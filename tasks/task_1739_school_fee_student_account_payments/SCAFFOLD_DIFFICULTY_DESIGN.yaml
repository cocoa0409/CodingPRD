# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_1739_school_fee_student_account_payments
# §1.8 Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# Every numeric literal in assert: was computed by hand-executing the pinned
# formulas in SCAFFOLD.yaml §1.3.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: waiver_stacking_provisional_vs_final_diverge
        grounds:
          - calculations.waiver_stacking
          - entities.FeeAssessment.fields.waived_amount_cents
          - state_machines.WaiverApplication.PENDING_to_APPROVED
        distinguishing_aspect: |
          Dual-variant divergence on the FeeAssessment/StudentAccount domain:
          provisional_stacking (applied at assessment creation against the full
          assessed amount) yields 5000 waived cents, while final_stacking
          (recomputed after a 2000-cent payment against assessed minus
          allocated) yields 4000 — same assessment, same program, different
          results purely from the variant's input-set definition.
        test_recipe:
          setup:
            - "OPEN school year with one department, waiverable fee 10000 cents, one SCHEDULED offering, grade-10 student with an account"
            - "WaiverProgram P1 at 5000 bp (50%), priority 1, cap 10000000, grades 9-12, with an APPROVED application BEFORE the enrollment/assessment exists"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 5000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "Lab Fee", amount_cents: 10000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d_id}", fee_item_id: "${f_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /school-years/${y_id}/waiver-programs"
              payload: { name: "P1", waiver_pct_bp: 5000, stacking_priority: 1, max_waived_per_student_cents: 10000000, eligibility_grade_min: 9, eligibility_grade_max: 12 }
              as: Bookkeeper
              captures: { p1_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/waiver-applications"
              payload: { waiver_program_id: "${p1_id}" }
              as: FamilyMember
              as_user_id: "fam-1"
              captures: { app1_id: $.data.id }
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { a_v1: $.data.version }
            - call: "POST /student-accounts/${a_id}/waiver-applications/${app1_id}/approve"
              payload: { expected_account_version: "${a_v1}" }
              as: Bookkeeper
              as_user_id: "bk-1"
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o_id}" }
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}/fee-assessments"
              as: Bookkeeper
              captures: { fa_id: "$.data[0].id", fa_waived_prov: "$.data[0].waived_amount_cents" }
            - call: "POST /student-accounts/${a_id}/payments"
              payload: { amount_cents: 2000, method: "CARD", idempotency_key: "k1" }
              as: FamilyMember
              captures: { pay_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/payments/${pay_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: FamilyMember
          trigger:
            - call: "POST /student-accounts/${a_id}/waiver-applications"
              payload: { waiver_program_id: "${p1_id}" }
              as: FamilyMember
              as_user_id: "fam-1"
              captures: { app2_id: $.data.id }
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { a_v2: $.data.version }
            - call: "POST /student-accounts/${a_id}/waiver-applications/${app2_id}/approve"
              payload: { expected_account_version: "${a_v2}" }
              as: Bookkeeper
              as_user_id: "bk-1"
            - call: "GET /student-accounts/${a_id}/fee-assessments"
              as: Bookkeeper
              captures: { fa_waived_final: "$.data[0].waived_amount_cents" }
          assert:
            - "Provisional waiver at creation == 5000 (floor(10000 * 5000/10000) against full base, allocated_cents == 0)"
            - "Final waiver after the 2000-cent payment == 4000 (floor((10000 - 2000) * 5000/10000))"
            - "${fa_waived_prov} == 5000 and ${fa_waived_final} == 4000 and the two variants diverge on identical program configuration"
            - "FeeAssessment.${fa_id}.outstanding_cents == 4000 after final restack (10000 - 4000 - 2000)"
      - name: refund_proration_withdrawal_vs_cancellation_diverge
        grounds:
          - calculations.refund_proration
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - state_machines.Offering.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Dual-variant divergence on the Refund/Enrollment domain (different
          domain from the waiver instance): on the same logical date with the
          same 10000-cent collected fee, the withdrawal variant measures
          days_elapsed=3 (PARTIAL tier, 50% -> 5000 cents) while the
          cancellation variant forces FULL for a SCHEDULED offering (-> 10000
          cents) regardless of calendar position.
        test_recipe:
          setup:
            - "OPEN year: refund_full_days=2, refund_partial_days=10, partial_refund_pct_bp=5000; two offerings O1 (IN_SESSION-era, start 2026-09-01) and O2 (still SCHEDULED, start 2026-10-01), each carrying a refundable 10000-cent fee"
            - "Two students/accounts, each enrolled and fully paid 10000 cents; logical clock set to 2026-09-04"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 5000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "Lab Fee", amount_cents: 10000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d_id}", fee_item_id: "${f_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o1_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "ACTIVITY", title: "Robotics", department_id: "${d_id}", fee_item_id: "${f_id}", start_date: "2026-10-01", end_date: "2027-02-28", capacity: 30 }
              as: Bookkeeper
              captures: { o2_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s1_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-2", full_name: "Ben", grade_level: 11, family_id: "fam-b" }
              as: Bookkeeper
              captures: { s2_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s1_id}" }
              as: Bookkeeper
              captures: { a1_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s2_id}" }
              as: Bookkeeper
              captures: { a2_id: $.data.id }
            - call: "POST /student-accounts/${a1_id}/enrollments"
              payload: { offering_id: "${o1_id}" }
              as: Bookkeeper
              captures: { e1_id: $.data.id }
            - call: "POST /student-accounts/${a2_id}/enrollments"
              payload: { offering_id: "${o2_id}" }
              as: Bookkeeper
            - call: "POST /student-accounts/${a1_id}/payments"
              payload: { amount_cents: 10000, method: "CARD", idempotency_key: "k1" }
              as: FamilyMember
              captures: { p1_id: $.data.id }
            - call: "POST /student-accounts/${a1_id}/payments/${p1_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: FamilyMember
            - call: "POST /student-accounts/${a2_id}/payments"
              payload: { amount_cents: 10000, method: "ACH", idempotency_key: "k2" }
              as: FamilyMember
              captures: { p2_id: $.data.id }
            - call: "POST /student-accounts/${a2_id}/payments/${p2_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: FamilyMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: Bookkeeper
          trigger:
            - call: "POST /student-accounts/${a1_id}/enrollments/${e1_id}/withdraw"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/offerings/${o2_id}/cancel"
              as: Bookkeeper
            - call: "GET /student-accounts/${a1_id}/refunds"
              as: Bookkeeper
              captures: { r1_cents: "$.data[0].refund_cents" }
            - call: "GET /student-accounts/${a2_id}/refunds"
              as: Bookkeeper
              captures: { r2_cents: "$.data[0].refund_cents" }
          assert:
            - "Withdrawal refund on account A1 == 5000 (days_elapsed 3 -> PARTIAL tier -> floor(10000 * 5000/10000))"
            - "Cancellation refund on account A2 == 10000 (SCHEDULED offering -> forced FULL tier regardless of date)"
            - "${r1_cents} == 5000 and ${r2_cents} == 10000 — identical collected amount, divergent refund purely from variant selection"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: waiver_stacking_priority_cap_waterfall
        grounds:
          - calculations.waiver_stacking
          - entities.WaiverProgram.fields.stacking_priority
          - entities.WaiverProgram.fields.max_waived_per_student_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula: waiver_stacking takes >=3 inputs
          (two programs' pct, stacking priority order, per-student cap shared
          across assessments, per-assessment remaining base) with non-linear
          interaction — program PA's 3000-cent cap redirects its residual to
          program PB's base, yielding A1 waived 4750 and A2 waived 2000.
        test_recipe:
          setup:
            - "OPEN year; two waiverable fees F1=10000 (offering O1, window 2026-09-01..2026-12-15) and F2=8000 (offering O2, window 2027-01-05..2027-04-30 — disjoint so no schedule conflict)"
            - "Grade-11 student, account, enrollments into O1 then O2 (A1 created before A2)"
            - "Programs PA (5000 bp, priority 1, cap 3000) and PB (2500 bp, priority 2, cap 100000), both grades 9-12"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 5000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 10000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f1_id: $.data.id }
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F2", amount_cents: 8000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f2_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d_id}", fee_item_id: "${f1_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o1_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Bio", department_id: "${d_id}", fee_item_id: "${f2_id}", start_date: "2027-01-05", end_date: "2027-04-30", capacity: 30 }
              as: Bookkeeper
              captures: { o2_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 11, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o1_id}" }
              as: Bookkeeper
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o2_id}" }
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/waiver-programs"
              payload: { name: "PA", waiver_pct_bp: 5000, stacking_priority: 1, max_waived_per_student_cents: 3000, eligibility_grade_min: 9, eligibility_grade_max: 12 }
              as: Bookkeeper
              captures: { pa_id: $.data.id }
            - call: "POST /school-years/${y_id}/waiver-programs"
              payload: { name: "PB", waiver_pct_bp: 2500, stacking_priority: 2, max_waived_per_student_cents: 100000, eligibility_grade_min: 9, eligibility_grade_max: 12 }
              as: Bookkeeper
              captures: { pb_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/waiver-applications"
              payload: { waiver_program_id: "${pa_id}" }
              as: FamilyMember
              as_user_id: "fam-1"
              captures: { appa_id: $.data.id }
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { a_v1: $.data.version }
            - call: "POST /student-accounts/${a_id}/waiver-applications/${appa_id}/approve"
              payload: { expected_account_version: "${a_v1}" }
              as: Bookkeeper
              as_user_id: "bk-1"
            - call: "POST /student-accounts/${a_id}/waiver-applications"
              payload: { waiver_program_id: "${pb_id}" }
              as: FamilyMember
              as_user_id: "fam-1"
              captures: { appb_id: $.data.id }
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { a_v2: $.data.version }
          trigger:
            - call: "POST /student-accounts/${a_id}/waiver-applications/${appb_id}/approve"
              payload: { expected_account_version: "${a_v2}" }
              as: Bookkeeper
              as_user_id: "bk-1"
            - call: "GET /student-accounts/${a_id}/fee-assessments"
              as: Bookkeeper
              captures: { a1_waived: "$.data[0].waived_amount_cents", a2_waived: "$.data[1].waived_amount_cents" }
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { acct_waived: $.data.waived_cents }
          assert:
            - "A1 (created first, 10000): PA min(floor(10000*0.5), cap 3000) = 3000; PB floor(7000*0.25) = 1750; total 4750"
            - "A2 (created second, 8000): PA cap exhausted (0 remaining) = 0; PB floor(8000*0.25) = 2000; total 2000"
            - "${a1_waived} == 4750 and ${a2_waived} == 2000"
            - "StudentAccount.${a_id}.waived_cents == 6750"
      - name: waterfall_proportional_split_rounding_remainder
        grounds:
          - calculations.allocation_waterfall
          - calculations.installment_schedule
          - entities.PaymentAllocation.fields.allocated_cents
        distinguishing_aspect: |
          Mode (b) combinatorial formula — nested rounding with pinned order:
          the Stage-1 proportional split rounds each covered assessment's share
          half_up BEFORE reconciling to the installment take; the 1-cent
          over-rounding is then assigned to the earliest-created covered
          assessment, yielding 1666/3334 rather than the 1667/3333 a
          round-last implementation would produce.
        test_recipe:
          setup:
            - "OPEN year (plan min 5000, max 6 installments); fees 3333 and 6667 on disjoint offerings; one account with assessments A1=3333 (created first) and A2=6667"
            - "ACTIVE payment plan covering both: covered_amount 10000, 2 installments of 5000 (remainder 0)"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 5000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 3333, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f1_id: $.data.id }
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F2", amount_cents: 6667, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f2_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d_id}", fee_item_id: "${f1_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o1_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Bio", department_id: "${d_id}", fee_item_id: "${f2_id}", start_date: "2027-01-05", end_date: "2027-04-30", capacity: 30 }
              as: Bookkeeper
              captures: { o2_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o1_id}" }
              as: Bookkeeper
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o2_id}" }
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { a_v: $.data.version }
            - call: "POST /student-accounts/${a_id}/payment-plans"
              payload: { installment_count: 2, first_due_date: "2026-09-05", interval_days: 30, expected_account_version: "${a_v}" }
              as: Bookkeeper
              captures: { plan_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/payments"
              payload: { amount_cents: 5000, method: "CARD", idempotency_key: "k1" }
              as: FamilyMember
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /student-accounts/${a_id}/payments/${pay_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: FamilyMember
            - call: "GET /student-accounts/${a_id}/payments/${pay_id}/allocations"
              as: Bookkeeper
              captures: { alloc1: "$.data[0].allocated_cents", alloc2: "$.data[1].allocated_cents" }
            - call: "GET /student-accounts/${a_id}/payment-plans/${plan_id}/installments"
              as: Bookkeeper
              captures: { inst1_status: "$.data[0].status", inst1_paid: "$.data[0].paid_cents" }
          assert:
            - "Stage-1 take == 5000 on installment 1; raw shares half_up(5000*3333/10000)=1667 and half_up(5000*6667/10000)=3334 sum to 5001"
            - "Pinned correction assigns the 1-cent overage to the earliest-created covered assessment: A1 gets 1666, A2 gets 3334"
            - "${alloc1} == 1666 and ${alloc2} == 3334 (allocation rows ordered by covered-assessment created_at ASC)"
            - "${inst1_paid} == 5000 and ${inst1_status} == PAID"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: installment_past_due_recovery_cycle
        grounds:
          - state_machines.PaymentPlanInstallment.DUE_to_PAST_DUE
          - state_machines.PaymentPlanInstallment.PAST_DUE_to_PAID
          - calculations.collections_aging
        distinguishing_aspect: |
          Non-linear (cyclic) machine on PaymentPlanInstallment: the
          installment travels SCHEDULED -> DUE -> PAST_DUE and then loops back
          to PAID when the waterfall covers it — a recovery cycle, not a
          linear pipeline.
        test_recipe:
          setup:
            - "OPEN year (aging_interval_days=10, plan min 1000); single 4000-cent assessment on an account"
            - "ACTIVE plan: 2 installments of 2000, first due 2026-08-05, interval 30; logical clock advanced to 2026-08-06 and ops-run executed so installment 1 is PAST_DUE"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
