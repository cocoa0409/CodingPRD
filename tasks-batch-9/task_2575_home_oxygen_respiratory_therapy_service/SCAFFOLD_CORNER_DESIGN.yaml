      - name: equipment_retirement_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[entity=EquipmentUnit].terminal_states
          - endpoints[POST /home-oxygen/equipment-units/{equipment_unit_id}/retire]
          - endpoints[POST /home-oxygen/equipment-units/{equipment_unit_id}/service]
        distinguishing_aspect: |
          RETIRED is reachable from two different states and, once reached, absorbs both fleet verbs:
          service (which would otherwise restamp preventive maintenance) and retire itself.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) with a single IN_STOCK unit SC-1001, pm_interval_days 365, next_pm_due_date 2027-06-01."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u1: $.data.id }
          trigger:
            - call: "POST /home-oxygen/equipment-units/${u1}/service"
              payload: {}
              as: RespiratoryTherapist
              captures: { e_service_stock: $.data.error_id }
            - call: "POST /home-oxygen/equipment-units/${u1}/retire"
              payload: {}
              as: BranchManager
              captures: { retired: $.data.status }
            - call: "POST /home-oxygen/equipment-units/${u1}/service"
              payload: {}
              as: RespiratoryTherapist
              captures: { e_service_retired: $.data.error_id }
            - call: "POST /home-oxygen/equipment-units/${u1}/retire"
              payload: {}
              as: BranchManager
              captures: { e_reretire: $.data.error_id }
          assert:
            - "${e_service_stock} == ERR_INVALID_STATE (409): service is declared only from IN_QUARANTINE, so a healthy IN_STOCK unit cannot be serviced"
            - "${retired} == RETIRED, reached directly from IN_STOCK"
            - "${e_service_retired} == ERR_INVALID_STATE (409) and next_pm_due_date is still 2027-06-01: the refused service restamps nothing"
            - "${e_reretire} == ERR_INVALID_STATE (409)"
            - "EquipmentUnit.${u1}.version incremented exactly once across all four calls"

      - name: certificate_revision_cycle_and_round_cap
        claim_type: valid_transition
        grounds:
          - state_machines[entity=CertificateOfMedicalNecessity].transitions[SUBMITTED->RETURNED_FOR_CORRECTION]
          - state_machines[entity=CertificateOfMedicalNecessity].transitions[RETURNED_FOR_CORRECTION->DRAFT]
          - validations[priority=32]
        distinguishing_aspect: |
          The DRAFT -> SUBMITTED -> RETURNED_FOR_CORRECTION -> DRAFT cycle with its MAX_REVISION_ROUNDS
          cap of 3 and its signature-discarding side effect.
        excluded_because:
          difficulty_instance: cmn_revision_cycle_returns_to_draft_and_caps_at_three_rounds
          rationale: |
            The §1.8 non_linear_state_machine instance already walks the cycle three times, asserts
            revision_round 1, 2, 3, asserts that signed_by_user_id and physician_signature_date are
            cleared on each return, and asserts the fourth return-for-correction failing with
            ERR_REVISION_LIMIT_REACHED. A §1.9 instance would restate it without adding a corner.

      - name: setup_failure_cascade_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines[entity=RentalContract][state_field=service_status].transitions[PENDING_SETUP->SETUP_FAILED]
          - state_machines[entity=Placement].transitions[RESERVED->REMOVED]
          - state_machines[entity=EquipmentUnit].transitions[RESERVED->IN_QUARANTINE]
        distinguishing_aspect: |
          The four-hop stop -> contract -> placements -> units cascade triggered by
          smoking_in_home == true, including billing suspension with suspension_reason SETUP_FAILED.
        excluded_because:
          difficulty_instance: setup_safety_failure_four_hop_cascade
          rationale: |
            The §1.8 transitive_cascade instance asserts all four hops plus the billing-dimension
            side effect and the quarantine_reason SAFETY on the units, and it also asserts that the
            hops do NOT fire when smoking_in_home is false. Re-asserting them here would duplicate.

      - name: recall_class_one_cascade_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines[entity=EquipmentUnit].transitions[DEPLOYED->IN_QUARANTINE]
          - state_machines[entity=Placement].transitions[PLACED->RECALLED_OUT_OF_SERVICE]
          - state_machines[entity=RentalContract][state_field=billing_status].transitions[ACCRUING->SUSPENDED]
        distinguishing_aspect: |
          The CLASS_I notice cascade notice -> units -> placements -> contract billing suspension,
          with auto_quarantined_unit_count snapshotting the units the cascade itself moved.
        excluded_because:
          difficulty_instance: recall_class_i_four_hop_cascade
          rationale: |
            The §1.8 transitive_cascade instance already asserts every hop of the CLASS_I cascade,
            the RECALL suspension_reason, the RECALLED_OUT_OF_SERVICE placements and the resulting
            ERR_CONTRACT_HAS_RECALLED_EQUIPMENT on resume-billing.

      - name: contract_billing_and_service_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines[entity=RentalContract][state_field=billing_status]
          - state_machines[entity=RentalContract][state_field=service_status]
        distinguishing_aspect: |
          The parallel state_machine_shape: one entity carrying two state fields whose transitions
          are driven by disjoint trigger sets and which can sit in any legal combination.
        excluded_because:
          difficulty_instance: contract_parallel_billing_and_service_dimensions_evolve_independently
          rationale: |
            The §1.8 non_linear_state_machine instance drives the two dimensions through four
            distinct combinations and asserts after each step that the other dimension did not move,
            which is strictly stronger than a breadth-level parallel-shape assertion.

      - name: certificate_expiry_sweep_suspends_billing
        claim_type: side_effect_execution
        grounds:
          - state_machines[entity=CertificateOfMedicalNecessity].transitions[ACTIVE->EXPIRED]
          - endpoints[POST /home-oxygen/_clock/set_current_utc]
          - calculations.recert_due_date
        distinguishing_aspect: |
          The system sweep that runs inside every clock advance: certificates past recert_due_date
          expire and their contracts fall to SUSPENDED with suspension_reason CMN_EXPIRED, which the
          clock response reports through expired_cmn_count and suspended_contract_count.
        excluded_because:
          difficulty_instance: billing_resume_blocked_when_linked_cmn_expired
          rationale: |
            The §1.8 cross_entity_state_dependency instance advances the clock past recert_due_date,
            asserts expired_cmn_count 1 and suspended_contract_count 1, and then proves the resume
            path is blocked by ERR_CMN_NOT_ACTIVE until a fresh certificate is activated.

  # ===========================================================================
  - section: calculations
    instances:

      - name: qualifying_group_pao2_band_boundaries
        claim_type: threshold
        grounds:
          - calculations.qualifying_group_determination
          - entities.QualifyingTest.fields.pao2_mmhg
          - entities.QualifyingTest.fields.cor_pulmonale_or_edema
        distinguishing_aspect: |
          The PaO2 axis has three thresholds in a row (<= 55 Group I, 56..59 borderline, >= 60 no
          qualification) and the middle band additionally demands a secondary finding, so 55, 56, 59
          and 60 must land in three different groups and 56 must flip on cor_pulmonale_or_edema alone.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) and one ACTIVE patient. The clock is at 2026-08-01T00:00:00Z so every study below is in the past."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0500", full_name: "Zia Marchetti", branch_id: "${br_id}", payer_type: "MEDICARE_NON_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", pao2_mmhg: 55, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { g_55: $.data.qualifying_group, exp_55: $.data.test_validity_expires_at }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", pao2_mmhg: 56, cor_pulmonale_or_edema: true, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { g_56_cor: $.data.qualifying_group }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", pao2_mmhg: 56, cor_pulmonale_or_edema: false, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { g_56_plain: $.data.qualifying_group }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", pao2_mmhg: 59, cor_pulmonale_or_edema: true, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { g_59_cor: $.data.qualifying_group }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", pao2_mmhg: 60, cor_pulmonale_or_edema: true, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { g_60_cor: $.data.qualifying_group }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", pao2_mmhg: 54, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { g_54: $.data.qualifying_group }
          assert:
            - "${g_55} == GROUP_I: 55 is inside the inclusive <= 55 Group I ceiling, and no secondary finding is needed"
            - "${g_56_cor} == GROUP_II and ${g_59_cor} == GROUP_II: 56 and 59 are the two ends of the inclusive borderline band"
            - "${g_56_plain} == NON_QUALIFYING: the identical PaO2 fails without cor_pulmonale_or_edema, so the flag is load-bearing only inside the band"
            - "${g_60_cor} == NON_QUALIFYING: 60 is one mmHg outside the band, and cor_pulmonale_or_edema cannot rescue it"
            - "${g_54} == GROUP_I, and every row above reports validity_days 30 with ${exp_55} == 2026-08-24T14:00:00Z (tested_at + 30 days)"
            - "spo2_percent is null on all six rows, so the Group I test rests on the PaO2 disjunct alone"

      - name: nocturnal_desat_minimum_and_sleep_validity_window
        claim_type: threshold
        grounds:
          - calculations.qualifying_group_determination
          - entities.QualifyingTest.fields.desat_minutes
          - entities.QualifyingTest.fields.validity_days
        distinguishing_aspect: |
          The desat_minutes >= 5 conjunct is scoped to NOCTURNAL_OVERNIGHT_OXIMETRY ONLY, so an
          identical saturation qualifies on a SLEEP_STUDY with zero documented desaturation minutes
          but not on an overnight oximetry with four; the same split drives the 90-day validity window.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) and one ACTIVE patient."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0510", full_name: "Arno Beck", branch_id: "${br_id}", payer_type: "MEDICARE_NON_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "NOCTURNAL_OVERNIGHT_OXIMETRY", spo2_percent: 87, desat_minutes: 4, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { g_desat4: $.data.qualifying_group, exp_noct: $.data.test_validity_expires_at, vd_noct: $.data.validity_days }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "NOCTURNAL_OVERNIGHT_OXIMETRY", spo2_percent: 87, desat_minutes: 5, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { g_desat5: $.data.qualifying_group }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "SLEEP_STUDY", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { g_sleep: $.data.qualifying_group, exp_sleep: $.data.test_validity_expires_at }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "EXERCISE", spo2_percent: 88, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { g_ex: $.data.qualifying_group, exp_ex: $.data.test_validity_expires_at, vd_ex: $.data.validity_days }
          assert:
            - "${g_desat4} == NON_QUALIFYING: spo2 87 clears the <= 88 ceiling but the overnight conjunct desat_minutes >= 5 fails at 4"
            - "${g_desat5} == GROUP_I on the identical saturation with desat_minutes 5 — the boundary is inclusive"
            - "${g_sleep} == GROUP_I with desat_minutes defaulted to 0: the conjunct is scoped to NOCTURNAL_OVERNIGHT_OXIMETRY and does not reach SLEEP_STUDY"
            - "${vd_noct} == 90 and ${exp_noct} == 2026-10-23T14:00:00Z; ${exp_sleep} == 2026-10-23T14:00:00Z — both sleep-family studies get the long window"
            - "${vd_ex} == 30 and ${exp_ex} == 2026-08-24T14:00:00Z: EXERCISE is in the acute family with RESTING_ROOM_AIR"
            - "Step 1 runs before Step 2, so the currency window is identical on the qualifying and the non-qualifying overnight rows"

      - name: documentation_score_single_final_rounding
        claim_type: precision
        grounds:
          - calculations.cmn_documentation_score
          - entities.CertificateOfMedicalNecessity.fields.documentation_score
        distinguishing_aspect: |
          Three certificates whose component sums are non-terminating or exactly on a half: 71.041666
          proves the components are NOT rounded before summing (component-first rounding gives 71.05),
          and 60.625 proves the final rounding is half-UP (banker's rounding gives 60.62).
        test_recipe:
          setup:
            - "One branch, one ACTIVE patient (HOMEBOUND) and one GROUP_I RESTING_ROOM_AIR study at spo2 87 taken 2026-07-25T14:00:00Z, still inside its 30-day window at the clock's 2026-08-01."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0520", full_name: "Bex Corrigan", branch_id: "${br_id}", payer_type: "MEDICARE_NON_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 7, portable_prescribed: false, length_of_need_months: 6, narrative_element_count: 1, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_a: $.data.id, score_a: $.data.documentation_score }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 1, portable_prescribed: false, length_of_need_months: 6, narrative_element_count: 0, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_b: $.data.id, score_b: $.data.documentation_score }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 23, portable_prescribed: false, length_of_need_months: 12, narrative_element_count: 2, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_c: $.data.id, score_c: $.data.documentation_score }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 12, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_d: $.data.id, score_d: $.data.documentation_score }
          assert:
            - "${score_a} == 71.04: components 30 + 20 + 4.375 + 6.666... + 10 + 0 = 71.041666..., rounded once at the end; rounding c_usage to 4.38 and c_narrative to 6.67 first would yield the wrong 71.05"
            - "${score_b} == 60.63: the sum is exactly 60.625 (30 + 20 + 0.625 + 0 + 10 + 0), and round_half_up carries the half upward — banker's rounding would give 60.62"
            - "${score_c} == 92.71: 30 + 20 + 14.375 + 13.333... + 10 + 5 = 92.708333..."
            - "${score_d} == 100.00 exactly: at hours_per_day 24 (the field's own ceiling), narrative_element_count 3 and length_of_need_months 12 every component is at its maximum and the six maxima sum to exactly 100, with no rounding artefact"
            - "All four certificates share one QualifyingTest, so c_group is 30 and c_currency is 20 in every case: only the three input-driven components move"
            - "Creating four DRAFT certificates for one patient is legal — the at-most-one rule (priority 62) constrains open CONTRACTS, not drafts"

