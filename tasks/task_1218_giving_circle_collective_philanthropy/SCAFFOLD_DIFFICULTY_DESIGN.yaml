  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cycle_phase_beats_tier_minimum
        grounds:
          - validations[priority=6]
          - validations[priority=18]
          - errors[ERR_CYCLE_PHASE]
          - errors[ERR_BELOW_TIER_MINIMUM]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: one contribution create that
          violates both the phase gate (cycle in NOMINATION) and the tier
          minimum (50000 < 100000) must surface ERR_CYCLE_PHASE because the
          state check (priority 6) outranks the fiscal check (priority 18).
        test_recipe:
          setup:
            - "Cycle in NOMINATION (M1's 100000 RECEIVED satisfied the pool guard); M2 ACTIVE, no contribution yet"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle PP1", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.pp1@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/members", payload: { full_name: "M Two", email: "m2.pp1@x.com" }, as: CircleAdmin, captures: { m2_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m2_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms2_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/memberships/${ms2_id}/accept", payload: {}, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
          trigger:
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms2_id}", amount_cents: 50000 }, as: Member, as_user_id: "${m2_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYCLE_PHASE (state priority 6 beats business_fiscal priority 18)"
            - "error_id != ERR_BELOW_TIER_MINIMUM although amount 50000 < 100000"
            - "HTTP status == 409"

      - name: voting_window_beats_finalist_reference
        grounds:
          - validations[priority=10]
          - validations[priority=16]
          - errors[ERR_VOTING_WINDOW_CLOSED]
          - errors[ERR_NOT_FINALIST]
        distinguishing_aspect: |
          Category pair {business_temporal, business_referential} (different
          pair than the other instance): a ballot cast after voting_closes_at
          whose allocation names a SUBMITTED (non-finalist) nomination must
          surface ERR_VOTING_WINDOW_CLOSED (priority 10), not ERR_NOT_FINALIST
          (priority 16).
        test_recipe:
          setup:
            - "Cycle in VOTING (opened 2026-06-10T11:00:00Z, closed 2026-06-17T11:00:00Z); N1 FINALIST, N2 still SUBMITTED; clock now 2026-06-18"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle PP2", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.pp2@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/members", payload: { full_name: "M Two", email: "m2.pp2@x.com" }, as: CircleAdmin, captures: { m2_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m2_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms2_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/memberships/${ms2_id}/accept", payload: {}, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nonprofits", payload: { ein: "99-0000001", legal_name: "NP Win", mission_category: "arts" }, as: CircleAdmin, captures: { np1_id: $.data.id } }
            - { call: "POST /api/nonprofits", payload: { ein: "99-0000002", legal_name: "NP Lose", mission_category: "arts" }, as: CircleAdmin, captures: { np2_id: $.data.id } }
            - { call: "POST /api/nominations", payload: { cycle_id: "${cycle_id}", nonprofit_id: "${np1_id}", statement: "s1" }, as: Member, as_user_id: "${m1_id}", captures: { n1_id: $.data.id } }
            - { call: "POST /api/nominations", payload: { cycle_id: "${cycle_id}", nonprofit_id: "${np2_id}", statement: "s2" }, as: Member, as_user_id: "${m2_id}", captures: { n2_id: $.data.id } }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nominations/${n1_id}/start-vetting", payload: {}, as: CircleAdmin }
            - { call: "PATCH /api/nominations/${n1_id}", payload: { financial_health: 80, mission_alignment: 80, org_capacity: 80 }, as: CircleAdmin }
            - { call: "POST /api/site-visits", payload: { nomination_id: "${n1_id}", starts_at: "2026-06-10T09:00:00Z", ends_at: "2026-06-10T10:00:00Z" }, as: CircleAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T10:00:00Z" }, as: CircleAdmin }
            - { call: "POST /api/site-visits/${v1_id}/complete", payload: {}, as: CircleAdmin }
            - { call: "POST /api/nominations/${n1_id}/advance-to-finalist", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-18T00:00:00Z" }, as: CircleAdmin }
          trigger:
            - { call: "POST /api/ballots", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", allocations: [{ nomination_id: "${n2_id}", points: 100 }] }, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VOTING_WINDOW_CLOSED (business_temporal priority 10 beats business_referential priority 16)"
            - "error_id != ERR_NOT_FINALIST although N2 is SUBMITTED"
            - "GivingCycle.${cycle_id}.ballots_cast_count == 0"
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_exact_count_passes
        grounds:
          - calculations.quorum_check
          - state_machines.GivingCycle.VOTING_to_AWARD
          - entities.GivingCycle.fields.active_member_snapshot
        distinguishing_aspect: |
          Metric: ballot count vs threshold — snapshot 4 x quorum 50 -> required
          exactly 2; casting exactly 2 ballots satisfies the >= boundary and
          the VOTING->AWARD advance succeeds (one ballot fewer would fail).
        test_recipe:
          setup:
            - "Cycle in VOTING with active_member_snapshot == 4, quorum_percent 50 (quorum_required == 2); one FINALIST; exactly 2 ballots cast; window closed"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle BP1", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
