  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  #
  # Instance 1: DemandLetter draft requires Case + MedicalRecordsRequest state
  # Instance 2: SettlementOffer accept requires NO MedicalLien in DISPUTED
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: demand_letter_requires_active_case_and_reviewed_records
        grounds:
          - validations[priority=11]
          - errors[ERR_DEMAND_PREREQUISITES_NOT_MET]
          - state_machines.MedicalRecordsRequest.RECEIVED_to_REVIEWED
          - entities.Case.fields.status
        distinguishing_aspect: |
          DemandLetter draft creation is allowed ONLY when (a) the parent Case.status
          == ACTIVE AND (b) at least one MedicalRecordsRequest on case_id has
          status == REVIEWED. Failing either rejects with
          ERR_DEMAND_PREREQUISITES_NOT_MET. The cross-entity pair here is
          DemandLetter ↔ {Case, MedicalRecordsRequest} — distinct from instance 2's
          SettlementOffer ↔ MedicalLien pair.
        test_recipe:
          setup:
            - "Active CA Case (Case.status=ACTIVE). One MedicalRecordsRequest exists on the case but is still in status REQUESTED (NOT yet REVIEWED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "CrossEnt1", email: "ce1@example.com", phone: "555-1200" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "CE1 Hosp", contact: "ce1@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            # Deliberately do NOT receive/review the records request.
          trigger:
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_ce1"
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_DEMAND_PREREQUISITES_NOT_MET'"

      - name: settlement_accept_blocked_by_disputed_lien
        grounds:
          - validations[priority=18]
          - errors[ERR_DISPUTED_LIEN_BLOCKS_SETTLEMENT]
          - state_machines.MedicalLien.NEGOTIATING_to_DISPUTED
          - state_machines.SettlementOffer.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          A SettlementOffer can be accepted ONLY when no MedicalLien on the same
          case is in status DISPUTED. The cross-entity pair is SettlementOffer ↔
          MedicalLien — distinct from instance 1's DemandLetter ↔ Case+MRR pair.
          The accept attempt with one DISPUTED lien returns
          ERR_DISPUTED_LIEN_BLOCKS_SETTLEMENT (422); the offer stays PENDING.
        test_recipe:
          setup:
            - "Active CA Case in IN_NEGOTIATION; one CARRIER PENDING offer at 5_000_000; one MedicalLien on the case in status DISPUTED (came via NEGOTIATING→DISPUTED transition)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
