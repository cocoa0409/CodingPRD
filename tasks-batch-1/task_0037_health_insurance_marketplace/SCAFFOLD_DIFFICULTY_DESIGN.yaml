          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_APTC_EXCEEDS_MAX]
        distinguishing_aspect: |
          Error-category pair: state (priority 6) vs business_fiscal (priority 14). Posting an enrollment for an
          application still in SUBMITTED (not DETERMINED) AND with elected_aptc above any plausible max must
          return ERR_INVALID_STATE (409), not ERR_APTC_EXCEEDS_MAX — the state check wins by priority.
        test_recipe:
          setup:
