              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TE9A" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /cases/${case_id}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /plans"
              payload: { case_id: "${case_id}", author_clinician_id: "${clin_id}", proposed_step_count: 10, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /plans/${plan_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /financing-plans"
              payload: { case_id: "${case_id}", term_months: 12, down_payment_cents: 300000, apr_bps: 0 }
              as: BillingAdmin
              captures: { fin_id: $.data.id, fin_v: $.data.version }
            - call: "POST /financing-plans/${fin_id}/activate"
              payload: { expected_financing_plan_version: "${fin_v}" }
              as: BillingAdmin
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: ManufacturingOps
            - call: "GET /cases/${case_id}"
              payload: {}
              as: BillingAdmin
              captures: { case_v: $.data.version }
            - call: "POST /refunds"
              payload: { case_id: "${case_id}", reason: "PATIENT_CANCEL", expected_case_version: "${case_v}" }
              as: BillingAdmin
              captures: { refund_id: $.data.id }
            - call: "POST /refunds/${refund_id}/approve"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /refunds/${refund_id}/settle"
              payload: {}
              as: BillingAdmin
            - call: "GET /cases/${case_id}"
              payload: {}
              as: BillingAdmin
              captures: { ac: $.data.amount_collected_cents, ri: $.data.refund_issued_cents }
          assert:
            - "TreatmentCase.${case_id}.amount_collected_cents == 300000"
            - "TreatmentCase.${case_id}.refund_issued_cents == 292500"
            - "(TreatmentCase.${case_id}.amount_collected_cents - TreatmentCase.${case_id}.refund_issued_cents) == 7500"

      - name: financing_cancel_conserves_principal_split
        grounds:
          - state_machines.FinancingPlan.ACTIVE_to_CANCELLED
          - state_machines.Installment.SCHEDULED_to_WAIVED
          - entities.FinancingPlan.fields.outstanding_principal_cents
          - entities.FinancingPlan.fields.financed_principal_cents
          - entities.Installment.fields.principal_portion_cents
        distinguishing_aspect: |
          Conserved quantity (DIFFERENT type: financing principal, not patient cash) =
          collected_principal + outstanding_principal == financed_principal. Before cancel:
          installment 1 POSTED (principal 20000) so collected_principal=20000,
          outstanding=220000, sum=240000=financed_principal. The cancel/waive compensation
          must NOT alter financed_principal (240000) and must leave outstanding at 220000.
        test_recipe:
