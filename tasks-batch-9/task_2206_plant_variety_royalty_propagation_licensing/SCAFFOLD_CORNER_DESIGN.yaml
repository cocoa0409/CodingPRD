        distinguishing_aspect: "All five declared side effects land in one call: brand_mark_text, brand_registry_class and brand_renewal_due_at copied from the payload, brand_registered_on stamped from the logical clock, brand_status set to BRAND_REGISTERED, and version incremented - while brand_renewal_count stays 0 because a first registration is not a renewal."
