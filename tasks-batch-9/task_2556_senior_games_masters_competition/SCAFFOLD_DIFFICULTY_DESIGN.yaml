            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_x_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T08:00:00Z", end_utc: "2026-09-12T09:00:00Z", teardown_buffer_minutes: 0, required_official_count: 1 }
              as: GamesAdmin
