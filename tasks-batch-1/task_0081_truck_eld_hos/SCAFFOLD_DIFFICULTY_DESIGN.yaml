          - validations[priority=14]
          - entities.DutyStatusEvent.fields.duration_minutes
        distinguishing_aspect: |
          DailyLog -> DutyStatusEvent pair (a DIFFERENT entity pair than ELDDevice->Vehicle): a
          DailyLog's UNCERTIFIED->CERTIFIED transition for a past day is rejected while an ACTIVE
          DutyStatusEvent in that day still has duration_minutes == null (the open event).
