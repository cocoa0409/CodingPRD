                repair_scope_items:
                  - { code: "ROOF", low_cents: 1000000, high_cents: 1200000 }
                expected_seller_lead_version: "${sl_v2}"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { da_id: $.data.id }
            - call: "POST /deal-analyses/${da_id}/finalize"
              payload: { valuation_variant: "AGGRESSIVE" }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /purchase-contracts"
              payload:
                seller_lead_id: "${sl_id}"
                deal_analysis_id: "${da_id}"
                purchase_price_cents: 18000000
                earnest_money_cents: 500001
                inspection_period_days: 7
                option_start_at: "2026-08-10T00:00:00Z"
                closing_window_start_at: "2026-09-15T00:00:00Z"
                closing_window_end_at: "2026-09-30T00:00:00Z"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /disclosure-acknowledgements"
              payload: { purchase_contract_id: "${pc_id}", disclosure_template_version: "DISC-2026.1", acknowledged_intent_to_assign: true, acknowledged_unlicensed_status: true, signature_ref: "esig-dana-001" }
              as: Seller
              as_user_id: "${sl_id}"
            - call: "POST /purchase-contracts/${pc_id}/sign"
              payload: {}
              as: Seller
              as_user_id: "${sl_id}"
            - call: "GET /earnest-money-deposits?purchase_contract_id=${pc_id}"
              payload: {}
              as: Wholesaler
