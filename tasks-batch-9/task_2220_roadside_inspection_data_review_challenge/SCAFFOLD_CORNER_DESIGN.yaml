            - "after all triggers: GET /intervention-thresholds returns meta.total_count == 0"

      - name: immutable_children_expose_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.ReportAmendment
          - entities.ChallengeEvidence
          - endpoints[GET /report-amendments/{id}]
          - endpoints[GET /data-challenges/{id}/evidence]
        distinguishing_aspect: |
          ReportAmendment and ChallengeEvidence are declared common_fields false: their reads carry
          no version key and §1.5 declares no PATCH or DELETE on either path, so the audit trail can
          only be appended to - the amendment instead records report_version_before /
          report_version_after of the report it changed.
        test_recipe:
