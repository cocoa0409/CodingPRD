              captures: { slot_a_status: $.data.status, slot_a_booked: $.data.booked_count }
          assert:
            - "${delay_before} == 0 — the original booking charges nothing"
            - "${a_attendance} == \"NO_SHOW\" and the application returned to ASSESSMENT_REQUIRED before the reschedule"
            - "the reschedule returns HTTP 201 with ${b_back_ref} == ${asmt_a}"
            - "${appn_status} == \"ASSESSMENT_SCHEDULED\" and ${delay_after} == 7 (2026-08-05T09:00:00Z to 2026-08-12T09:00:00Z)"
            - "GET /assessments?rescheduled_from_assessment_id=${asmt_a} returns total_count == 1, and the filter on the other direction (GET /assessments?slot_id=${slot_b}) also returns exactly 1"
            - "${slot_a_status} == \"OPEN\" and ${slot_a_booked} == 0 — the abandoned slot was released by the NO_SHOW, not by the reschedule"

