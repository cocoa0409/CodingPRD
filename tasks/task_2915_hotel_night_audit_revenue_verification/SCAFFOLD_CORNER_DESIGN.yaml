            - "The fourth attempt fails 409 ERR_TIE_OUT_ATTEMPT_LIMIT_REACHED even when gl_control_total_amount is the exactly-correct 217.75 - the counter closes the door before the arithmetic is consulted."
            - "After that refusal the period still reads status == \"TIE_OUT_FAILED\", tie_out_attempt_count == 3, gl_control_total_amount == 217.00 (the last attempt that actually ran) and audit_trail_retention_until_date == null, and ${bd1_id} is still CLOSED rather than ARCHIVED."

      - name: error_triggerable_not_found_codes_are_one_per_collection_and_ordered
        claim_type: error_triggerable
        grounds: ["validations[priority=10]", "validations[priority=11]", "validations[priority=12]", "validations[priority=13]", "validations[priority=14]", "validations[priority=20]", "validations[priority=21]", "validations[priority=22]", "validations[priority=23]", "validations[priority=24]"]
        distinguishing_aspect: "Thirteen collections each own a distinct 404 code rather than sharing a generic one, and when a body names several unknown ids at once the declared order property, business date, folio or allowance, outlet, ledger account decides which single code comes back."
        test_recipe:
          setup: ["Standard property with one outlet and one business date, so that real ids exist to contrast against the fabricated ones. Every fabricated id below is a well-formed UUID that belongs to no row: MISSING = 00000000-0000-4000-8000-000000000000."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "LOBBY", outlet_name: "Lobby Lounge", outlet_type: "FB_OUTLET", requires_shift_settlement: false }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { lounge_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
          trigger: "POST /night-audit/outlet-tickets with outlet_id MISSING, business_date_id MISSING, ticket_number T-NF-1, gross_amount 100.00, settlement_type CASH and opened_at 2026-08-01T18:00:00.000Z as NightAuditor (X-User-ID u_na_1) - two unknown foreign keys in one body."
          assert:
            - "HTTP 404 with data.error_id == \"ERR_BUSINESS_DATE_NOT_FOUND\" and not ERR_OUTLET_NOT_FOUND: the business-date FK is checked at priority 21 and the outlet FK at priority 23."
            - "The same call with the real ${bd1_id} and outlet_id MISSING then returns 404 ERR_OUTLET_NOT_FOUND, so the second code is genuinely reachable once the first condition is satisfied."
            - "POST /night-audit/journal-postings with business_date_id MISSING and folio_id MISSING returns ERR_BUSINESS_DATE_NOT_FOUND, and with the real ${bd1_id}, folio_id MISSING and ledger_account_id MISSING it returns ERR_FOLIO_NOT_FOUND - priority 22 before priority 24."
            - "POST /night-audit/authorization-documents with property_id MISSING and folio_id MISSING returns ERR_PROPERTY_NOT_FOUND, and with the real ${prop_id} plus allowance_id MISSING it returns ERR_ALLOWANCE_NOT_FOUND."
            - "GET on a MISSING path id returns a different code per collection: properties ERR_PROPERTY_NOT_FOUND, business-dates ERR_BUSINESS_DATE_NOT_FOUND, folios ERR_FOLIO_NOT_FOUND, journal-postings ERR_POSTING_NOT_FOUND, outlet-tickets ERR_TICKET_NOT_FOUND, settlement-batches ERR_BATCH_NOT_FOUND, ledger-accounts ERR_LEDGER_ACCOUNT_NOT_FOUND, allowances ERR_ALLOWANCE_NOT_FOUND, authorization-documents ERR_DOCUMENT_NOT_FOUND, card-authorizations ERR_AUTHORIZATION_NOT_FOUND, revenue-reports ERR_REPORT_NOT_FOUND, outlets ERR_OUTLET_NOT_FOUND and accounting-periods ERR_PERIOD_NOT_FOUND - thirteen collections, thirteen codes, all 404."
            - "POST /night-audit/business-dates/MISSING/post-room-and-tax as FrontDeskAgent returns 403 ERR_UNAUTHORIZED rather than 404, because the role check at priority 3 runs before any path lookup - a caller who may not use an endpoint learns nothing about what exists behind it."
            - "GET /night-audit/business-dates?property_id=MISSING returns 200 with an empty items array and total_count == 0, because a filter that matches nothing is not a not-found."

      - name: error_triggerable_shift_overlap_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: settlement_shift_half_open_window_allows_adjacent_shifts
          rationale: "ERR_SHIFT_WINDOW_OVERLAP is produced there by the one-second-inside probe, and the same instance also proves the touching pair at 22:00:00.000Z is accepted, so a separate breadth test would only repeat the half-open boundary."

      - name: error_triggerable_document_interval_overlap_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: authorization_document_closed_interval_rejects_touching_endpoints
          rationale: "ERR_AUTHORIZATION_INTERVAL_OVERLAP is asserted there on the inclusive-endpoint pair and again on the PENDING-blocks-PENDING case, which is the complete reachable surface of the code."

      - name: error_triggerable_revision_limit_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: allowance_revision_cycle_capped_at_two_with_tier_frozen
          rationale: "ERR_REVISION_LIMIT_REACHED only exists at revision_round 2, which that instance walks to deliberately while also holding required_approval_role frozen; re-triggering it here would duplicate the whole cycle."

      - name: error_triggerable_self_approval_and_tier_codes
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: segregation_of_duties_outranks_approved_amount_ceiling_on_allowance_approve
          rationale: "ERR_SELF_APPROVAL_FORBIDDEN and ERR_APPROVAL_TIER_INSUFFICIENT are both raised there, and the point of that instance is precisely which of them wins against a money violation, so the codes cannot be tested more sharply in isolation."

      - name: error_triggerable_comp_paperwork_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: revoking_comp_paperwork_breaks_tomorrows_audit_without_rewriting_yesterday
          rationale: "ERR_COMP_AUTHORIZATION_MISSING is raised there by revoking an ACTIVE document between two room runs, which is a strictly stronger setup than filing no document at all."

      - name: error_triggerable_allowance_document_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: controller_tier_allowance_requires_active_matching_approval_document
          rationale: "ERR_ALLOWANCE_DOCUMENT_MISSING is raised there three ways - no document, a PENDING document and a document naming a different allowance - which covers the code's whole condition."

      - name: error_triggerable_ledger_control_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: one_sided_ledger_transfer_reversal_returns_control_total_to_zero
          rationale: "ERR_LEDGERS_OUT_OF_BALANCE is raised there while the control total is non-zero and then cleared by the reversal, so both the failure and the recovery are already asserted."

      - name: error_triggerable_authorization_shortfall_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: sealed_date_state_gate_outranks_authorization_shortfall_on_checkout
          rationale: "ERR_AUTHORIZATION_SHORTFALL is asserted there on an unsealed date after the higher-priority state gate is removed, which is the only way to observe the code cleanly."

      - name: error_triggerable_settlements_unresolved_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: daily_balance_gated_on_every_settlement_batch_being_resolved
          rationale: "ERR_SETTLEMENTS_UNRESOLVED has two declared clauses and that instance walks both - a missing mandatory batch at verify time and a still-unresolved batch at balance time."

      - name: error_triggerable_declined_auth_unresolved_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: card_decline_cascades_three_hops_to_block_the_daily_balance
          rationale: "ERR_DECLINED_AUTH_UNRESOLVED is raised there on both of its declared sites - check-out of the held folio and balance of the date whose declined_authorization_count is above zero."

      - name: error_triggerable_period_has_open_dates_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: period_tie_out_gated_on_every_child_date_being_closed
          rationale: "ERR_PERIOD_HAS_OPEN_DATES is raised there for a sibling date left in each intermediate status, which is broader than a single breadth probe would be."

      - name: error_triggerable_folio_already_transferred_code
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: folio_settlement_dimension_reverses_while_stay_dimension_holds_departed
          rationale: "ERR_FOLIO_ALREADY_TRANSFERRED is raised there against a swept folio for both a posting and a payment, and the same instance then shows the code disappearing once the sweep is reversed."

  - section: rbac
    instances:

      - name: rbac_exclusive_operations_every_role_can_run_its_own_declared_exclusives
        claim_type: exclusive_operations
        grounds: ["roles.PropertyAdmin", "roles.NightAuditor", "roles.RevenueManager", "roles.Controller", "roles.OutletManager"]
        distinguishing_aspect: "The positive half of the matrix: each of the four roles that owns exclusive operations runs every one of them successfully in a single walk, which proves no endpoint's role list was tightened past its own declaration."
        test_recipe:
          setup: ["Standard property; one outlet requiring shift settlement; business date 2026-08-01; one IN_HOUSE folio; a flagged settlement batch and a PENDING document ready for their reviewers."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "LOBBY", outlet_name: "Lobby Lounge", outlet_type: "FB_OUTLET", requires_shift_settlement: true }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { lounge_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id", period_id: "$.data.accounting_period_id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-RB1", guest_name: "Idris Mwangi", room_number: "2001", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z", credit_limit_amount: 5000.00 }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/outlet-tickets"
              payload: { outlet_id: "${lounge_id}", business_date_id: "${bd1_id}", ticket_number: "T-RB-1", gross_amount: 128.00, settlement_type: "CASH", opened_at: "2026-08-01T18:00:00.000Z" }
              as: OutletManager
              as_user_id: "${lounge_id}"
              captures: { ticket_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets/${ticket_id}/close"
              payload: { transmitted_at: "2026-08-01T20:00:00.000Z" }
              as: OutletManager
              as_user_id: "${lounge_id}"
            - call: "POST /night-audit/settlement-batches"
              payload: { business_date_id: "${bd1_id}", outlet_id: "${lounge_id}", tender_type: "CASH", shift_start_at: "2026-08-01T14:00:00.000Z", shift_end_at: "2026-08-01T22:00:00.000Z", declared_amount: 100.00 }
              as: OutletManager
              as_user_id: "${lounge_id}"
              captures: { batch_id: "$.data.id" }
            - call: "POST /night-audit/authorization-documents"
              payload: { property_id: "${prop_id}", doc_type: "COMP_ROOM", authorized_by_name: "S. Adeyemi", document_reference: "CR-7711", valid_from_date: "2026-08-01", valid_to_date: "2026-08-04", folio_id: "${folio_id}" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { doc_id: "$.data.id" }
          trigger: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax as NightAuditor (X-User-ID u_na_1) - the first of that role's eight exclusive operations."
          assert:
            - "The trigger returns 200, and seal-charges, verify-settlements, city-ledger-sweep, balance and close all return 200 for the same NightAuditor once their own preconditions are met, as do request-recount on the flagged ${batch_id} and capture on a fresh authorization - all eight NightAuditor exclusives succeed."
            - "PropertyAdmin (X-User-ID u_admin_1) successfully ran POST /night-audit/properties and POST /night-audit/outlets in setup, and POST /night-audit/outlets/${lounge_id}/suspend returns 200 - all three of its exclusives."
            - "RevenueManager (X-User-ID u_rm_1) gets 200 from accept-variance on ${batch_id}, from review on ${doc_id}, from distribute on a DRAFT report, and from reject, return-for-revision and reverse on suitably staged allowances - all six of its exclusives."
            - "Controller (X-User-ID u_ctl_1) gets 200 from reopen on a CLOSED date, from revoke on an ACTIVE document and from tie-out on ${period_id} - all three of its exclusives."
            - "OutletManager (X-User-ID ${lounge_id}) gets 200 or 201 from its outlet-ticket create, close and void and from its settlement-batch create and redeclare, every call naming its own outlet."
            - "FrontDeskAgent declares no exclusive operations, and its shared arrival and tender calls in setup returned 201 and 200, so an empty exclusive list is not an empty permission set."

      - name: rbac_unauthorized_denial_no_role_reaches_another_roles_exclusives
        claim_type: unauthorized_denial
        grounds: ["roles.Controller", "roles.RevenueManager", "roles.NightAuditor", "roles.PropertyAdmin", "validations[priority=3]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "The negative half of the matrix, and specifically the claim the scaffold makes loudest: the approval ladder is NOT a permission hierarchy, so Controller - the top of the ladder - is refused on the close sequence, on a check-in and on an outlet ticket."
        test_recipe:
          setup: ["Standard property; outlet LOBBY; business date 2026-08-01; one RESERVED folio; one OPEN ticket; one PENDING document; one SUBMITTED allowance of 200.00; one DRAFT revenue report."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "LOBBY", outlet_name: "Lobby Lounge", outlet_type: "FB_OUTLET", requires_shift_settlement: false }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { lounge_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id", period_id: "$.data.accounting_period_id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-RB2", guest_name: "Suri Halvorsen", room_number: "2101", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z", credit_limit_amount: 5000.00 }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets"
              payload: { outlet_id: "${lounge_id}", business_date_id: "${bd1_id}", ticket_number: "T-RB-2", gross_amount: 128.00, settlement_type: "CASH", opened_at: "2026-08-01T18:00:00.000Z" }
              as: OutletManager
              as_user_id: "${lounge_id}"
              captures: { ticket_id: "$.data.id" }
            - call: "POST /night-audit/authorization-documents"
              payload: { property_id: "${prop_id}", doc_type: "COMP_ROOM", authorized_by_name: "S. Adeyemi", document_reference: "CR-7712", valid_from_date: "2026-08-01", valid_to_date: "2026-08-04", folio_id: "${folio_id}" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { doc_id: "$.data.id" }
            - call: "POST /night-audit/allowances"
              payload: { folio_id: "${folio_id}", business_date_id: "${bd1_id}", requested_amount: 200.00, reason_code: "MAINTENANCE_ISSUE", narrative: "Air handler failure." }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { allowance_id: "$.data.id" }
            - call: "POST /night-audit/allowances/${allowance_id}/submit"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
          trigger: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax as Controller (X-User-ID u_ctl_1)."
          assert:
            - "HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\" and the date still reads status == \"OPEN\" with version == 1 - the approval ladder does not promote Controller into the night audit."
            - "Controller is refused with 403 ERR_UNAUTHORIZED on seal-charges, verify-settlements, city-ledger-sweep, balance, close, request-recount and capture as well, and also on POST /night-audit/folios/${folio_id}/check-in and POST /night-audit/outlet-tickets/${ticket_id}/close."
            - "RevenueManager (X-User-ID u_rm_1) is refused with 403 ERR_UNAUTHORIZED on reopen, on revoke of ${doc_id} and on tie-out of ${period_id} - the three Controller exclusives."
            - "NightAuditor (X-User-ID u_na_1) is refused with 403 ERR_UNAUTHORIZED on reject, return-for-revision and reverse of ${allowance_id}, on accept-variance, on review of ${doc_id} and on distribute of a DRAFT report - the six RevenueManager exclusives - even though it may approve that same allowance."
            - "PropertyAdmin (X-User-ID u_admin_1) is refused with 403 ERR_UNAUTHORIZED on POST /night-audit/journal-postings, on check-in, on the close sequence and on every allowance action: it configures the hotel and holds no operational authority."
            - "FrontDeskAgent (X-User-ID u_fd_1) is refused with 403 ERR_UNAUTHORIZED on the whole close sequence and on POST /night-audit/outlets, while OutletManager (X-User-ID ${lounge_id}) is refused with 403 on POST /night-audit/journal-postings and on the close sequence."
            - "Every one of these refusals leaves the target row's version unchanged, so a denial is never a partial write."

      - name: rbac_shared_operations_each_listed_role_reaches_the_shared_endpoint
        claim_type: shared_operations
        grounds: ["roles.NightAuditor", "roles.FrontDeskAgent", "roles.Controller", "roles.PropertyAdmin", "roles.OutletManager", "endpoints[POST /night-audit/journal-postings]"]
        distinguishing_aspect: "Shared endpoints must admit every role on their list and must record who acted, so the same MISC_CHARGE posted by three different roles produces three rows differing only in posted_by_user_id - the permission is shared, the attribution is not."
        test_recipe:
          setup: ["Standard property; outlet LOBBY; business date 2026-08-01; one IN_HOUSE folio with a generous credit limit."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "LOBBY", outlet_name: "Lobby Lounge", outlet_type: "FB_OUTLET", requires_shift_settlement: false }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { lounge_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-RB3", guest_name: "Alva Ferreira", room_number: "2301", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z", credit_limit_amount: 9000.00 }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
          trigger: "POST /night-audit/journal-postings with business_date_id ${bd1_id}, folio_id ${folio_id}, charge_type MISC_CHARGE and amount 10.00 three times - once as NightAuditor (u_na_1), once as FrontDeskAgent (u_fd_1) and once as Controller (u_ctl_1)."
          assert:
            - "All three calls return 201 and GET /night-audit/journal-postings?folio_id=${folio_id}&charge_type=MISC_CHARGE returns exactly 3 rows whose posted_by_user_id values are u_na_1, u_fd_1 and u_ctl_1 respectively - the shared endpoint accepts all three roles and attributes each line separately."
            - "The folio's charges_total_amount rose by exactly 30.00 across the three, so a shared endpoint is not a shortcut around the arithmetic."
            - "POST /night-audit/business-dates succeeds for both PropertyAdmin (u_admin_1) and NightAuditor (u_na_1) - the two roles the scaffold lists - on distinct business_date values."
            - "POST /night-audit/outlet-tickets and its close action succeed both for OutletManager (X-User-ID ${lounge_id}) and for NightAuditor (u_na_1) acting on the same outlet, and the NightAuditor call is not subject to the outlet-scope rule because that rule is written for OutletManager only."
            - "POST /night-audit/ledger-accounts succeeds for PropertyAdmin and for Controller, and POST /night-audit/journal-postings/{id}/reverse succeeds for NightAuditor and for Controller - each shared list admits exactly the roles it names and no others."
            - "POST /night-audit/allowances and submit succeed for NightAuditor, FrontDeskAgent and RevenueManager alike, with requested_by_user_id set to whichever of them created the row."

      - name: rbac_segregation_of_duties_the_originator_is_locked_out_of_the_decision
