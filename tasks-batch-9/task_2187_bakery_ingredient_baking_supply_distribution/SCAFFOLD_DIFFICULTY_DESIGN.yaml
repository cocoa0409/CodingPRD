  - rule_id: transitive_cascade
    instances:
      - name: lot_quarantine_four_hop_cascade_unseals_route_and_reverts_order
        grounds:
          - state_machines.Lot.AVAILABLE_to_QUARANTINED
          - state_machines.DeliveryRoute.SEALED_to_PLANNING
          - calculations.route_load_waterfall
          - calculations.lot_inventory_conservation
          - entities.DeliveryRoute.fields.allergen_class_lock
        distinguishing_aspect: |
          One quarantine call walks FOUR declared hops across four entity types:
          Lot -> OrderLine (RESERVED -> UNALLOCATED, 15000 lb moved back from reserved to on hand)
          -> Order (ROUTED -> NEW) -> RouteStop (PLANNED -> CANCELLED) -> DeliveryRoute
          (SEALED -> PLANNING because stop_count hit 0, allergen_class_lock GLUTEN -> NONE and
          utilization_pct 62.50 -> 0.00). Naive implementations stop at hop 2 and leave a SEALED
          route holding a cancelled stop, or forget the allergen_class_lock reset.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; customer Hearth & Grain ACTIVE, credit_limit_cents 5000000, min_drop_cents 25000."
            - "Hard red winter flour SKU (GLUTEN, 42 c/lb) with lot LOT-FLR-9001 of 50000 lb in OPEN GLUTEN zone Z-GLU-01."
            - "One BAGGED order with a single 15000 lb flour line, submitted (total_cents 620267) then allocated so the line is RESERVED against LOT-FLR-9001 (lot on hand 35000, reserved 15000)."
            - "Route R-CASC-01 for 2026-09-15 with vehicle_capacity_lb 24000 and service_buffer_minutes 30; the order is on one stop (window 08:00-10:00) so the route is SEALED with stop_count 1, planned_load_lb 15000, utilization_pct 62.50, allergen_class_lock GLUTEN."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Hearth & Grain", allergen_program: "STANDARD", credit_limit_cents: 5000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am-1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-HRW-50", category: "FLOUR", allergen_class: "GLUTEN", bulk_capable: true, shelf_life_days: 180, index_code: "HRW_WHEAT", list_price_cents_per_lb: 42, min_rotation_days: 30 }
              as: PricingController
              as_user_id: "pc-1"
              captures: { flour_id: $.data.id }
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-GLU-01", allergen_class: "GLUTEN" }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { zone_glu_id: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-FLR-9001", product_id: "${flour_id}", zone_id: "${zone_glu_id}", manufactured_on: "2026-07-15T00:00:00Z", quantity_received_lb: 50000 }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { lot_id: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-15T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/lines"
              payload: { product_id: "${flour_id}", quantity_lb: 15000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { tot: $.data.total_cents }
            - call: "POST /bakery-distribution/orders/${order_id}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
            - call: "POST /bakery-distribution/routes"
              payload: { route_code: "R-CASC-01", service_on: "2026-09-15T00:00:00Z", vehicle_capacity_lb: 24000, service_buffer_minutes: 30 }
              as: LogisticsPlanner
              as_user_id: "lp-1"
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /bakery-distribution/routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_start_at: "2026-09-15T08:00:00Z", window_end_at: "2026-09-15T10:00:00Z", expected_route_version: "${route_v}" }
              as: LogisticsPlanner
              as_user_id: "lp-1"
              captures: { stop_id: $.data.id }
            - call: "POST /bakery-distribution/routes/${route_id}/seal"
