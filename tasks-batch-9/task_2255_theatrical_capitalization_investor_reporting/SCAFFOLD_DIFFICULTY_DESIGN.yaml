  - name: stale_production_version_occ_precedes_distribution_fiscal_ceiling
    grounds:
    - §1.2.1 concurrency rule distribution-declare-stale-production on POST /investor-distributions with occ_field Production.version
    - §1.4 priority 10 optimistic_concurrency -> ERR_STALE_PRODUCTION_VERSION (412)
    - §1.4 priority 14 business_fiscal -> ERR_DISTRIBUTION_EXCEEDS_DISTRIBUTABLE (422)
    distinguishing_aspect: |
      The production version is captured before certification, then certifying W1 bumps
      it, so the declared expected_production_version is stale. The same request also
      asks to distribute 99,999,999,999 cents, far above distributable cash. Only the
      412 concurrency error may surface: an implementation that validates amounts before
      comparing versions returns ERR_DISTRIBUTION_EXCEEDS_DISTRIBUTABLE (422), and one
      that ignores the version header returns 422 as well, so the 412 is the only
      outcome that proves the OCC check runs at priority 10.
