  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assignment_state_outranks_supportive_cap_exhaustion_on_authorize
        grounds:
          - validations[priority=26]
          - validations[priority=64]
          - errors.ERR_ASSIGNMENT_NOT_ACTIVE
          - errors.ERR_SUPPORTIVE_CAP_EXHAUSTED
          - calculations.supportive_service_waterfall
        distinguishing_aspect: |
          Both a cross_entity_state violation (priority 26) and a business_fiscal
          violation (priority 64) are true on the same authorize call, and the
          response is ERR_ASSIGNMENT_NOT_ACTIVE with HTTP 409, never
          ERR_SUPPORTIVE_CAP_EXHAUSTED with HTTP 422.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 is ACTIVE with assistance issued for 2026-08."
            - "An ACTIVE COMMUNITY_SERVICE assignment holds an AUTHORIZED TRANSPORTATION authorization of 60000 for 2026-08-01..2026-08-31, exactly exhausting SUPPORTIVE_CAPS_CENTS[TRANSPORTATION]."
            - "A second PROPOSED WORK_EXPERIENCE assignment has a REQUESTED TRANSPORTATION authorization of 10000 for 2026-09-01..2026-09-30 in the same fiscal year 2026."
