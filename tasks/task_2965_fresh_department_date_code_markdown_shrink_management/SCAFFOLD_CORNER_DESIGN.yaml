# §1.9 Scaffold Corner Design (Breadth Index)
# Taxonomy strictly from references/claim-extraction-guide.md: the nine sections below are its
# nine tables, and every `claim_type:` is one of that table's rows (snake_cased). Corners that
# §1.8 already asserts are emitted as `excluded_because:` stubs naming the covering instance.
#
# Shared base chain (referenced in prose as "the MEAT base chain"), replayed literally in each
# recipe that needs it:
#   clock 2026-08-10T08:00:00.000Z -> store 0412 (MID-ATL) -> ladder MEAT-STD-2026
#   (rungs: days_remaining_max 3 @ 15%, days_remaining_max 1 @ 50% requiring approval) -> activate
#   -> department MEAT (shelf_life_days_default 10) -> item 599c retail / 420c cost /
#   daily_forecast_units 4.00 -> lot of 24 produced 2026-08-05 (sell_by_at 2026-08-15T00:00:00.000Z).
#   Derived once and reused: cost_floor_price_cents = round_half_up(420 * 40 / 100) = 168;
#   rung 0 price = max(168, round_half_up(599 * 0.85)) = 509 at total_discount_pct 15.03.
scaffold_corner_design:
  - section: entities
    instances:
      - name: store_create_with_every_input_field_returns_201_envelope
        claim_type: creation
        grounds:
          - entities.Store
          - endpoints[POST /fresh/stores]
          - response_envelope.success
        distinguishing_aspect: |
          A create returns 201 with the full Store body inside data and the meta envelope around
          it: every supplied input field is echoed verbatim and version starts at 1.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-10T08:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
          trigger:
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1", "D2"], donation_program_enabled: true, status: "ACTIVE" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response_type == 'object' and meta.api_request_id is a non-empty string"
            - "data.store_number == '0412'"
            - "data.name == 'Fresh Market 0412'"
            - "data.region_code == 'MID-ATL'"
            - "data.dock_door_codes == ['D1', 'D2']"
            - "data.donation_program_enabled == true"
            - "data.status == 'ACTIVE'"
            - "data.version == 1"
            - "data.id is a non-empty string and data.created_at == data.updated_at"

      - name: store_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Store
          - endpoints[GET /fresh/stores/{storeId}]
        distinguishing_aspect: |
          GET by id returns exactly what POST persisted — same id, same version 1, no field
          re-derivation between the write and the read.
        test_recipe:
          setup:
            - "One store 0412 created at clock 2026-08-10T08:00:00.000Z with dock doors D1 and D2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1", "D2"] }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id, store_created_at: $.data.created_at }
          trigger:
            - call: "GET /fresh/stores/${store_id}"
              payload: {}
              as: FreshClerk
          assert:
            - "HTTP status is 200"
            - "data.id == ${store_id}"
            - "data.store_number == '0412'"
            - "data.dock_door_codes == ['D1', 'D2']"
            - "data.created_at == ${store_created_at}"
            - "data.version == 1"

      - name: items_list_filtered_by_department_paginates_with_total_count
        claim_type: listing
        grounds:
          - entities.Item
          - endpoints[GET /fresh/items]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          limit=2&offset=0 returns 2 of the 3 items of the department with total_count 3 and
          has_more true; offset=2 returns the remaining 1 with has_more false. total_count counts
          the filtered set, not the whole table.
        test_recipe:
          setup:
            - "The MEAT base chain up to the department, then three ACTIVE items in that department."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_a: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222334", description: "Ground Chuck 1lb", base_retail_cents: 499, unit_cost_cents: 350, daily_forecast_units: 6.00 }
              as: DepartmentManager
              captures: { item_b: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222335", description: "Pork Loin 2lb", base_retail_cents: 899, unit_cost_cents: 600, daily_forecast_units: 2.00 }
              as: DepartmentManager
              captures: { item_c: $.data.id }
          trigger:
            - call: "GET /fresh/items?department_id=${dept_id}&limit=2&offset=0"
              payload: {}
              as: FreshClerk
            - call: "GET /fresh/items?department_id=${dept_id}&limit=2&offset=2"
              payload: {}
              as: FreshClerk
            - call: "GET /fresh/items?department_id=${dept_id}"
              payload: {}
              as: FreshClerk
          assert:
            - "first response: response_type == 'array' and len(data) == 2"
            - "first response: total_count == 3, limit == 2, offset == 0, has_more == true"
            - "second response: len(data) == 1, total_count == 3, offset == 2, has_more == false"
            - "third response (no pagination params): limit == 10, offset == 0, total_count == 3, has_more == false, len(data) == 3"
            - "the three ids returned across pages are exactly {${item_a}, ${item_b}, ${item_c}} with no duplication"

      - name: lot_get_with_unknown_id_returns_lot_not_found
        claim_type: not_found
        grounds:
          - entities.DateCodeLot
          - endpoints[GET /fresh/lots/{lotId}]
          - validations[priority 4]
          - errors[ERR_LOT_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid but unknown lot id resolves at validation priority 4 to
          ERR_LOT_NOT_FOUND with HTTP 404 — the lot-specific code, not a generic not-found.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; no lot has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
          trigger:
            - call: "GET /fresh/lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FreshClerk
          assert:
            - "HTTP status is 404"
            - "response_type == 'error'"
            - "data.error_id == 'ERR_LOT_NOT_FOUND'"
            - "data.message is a non-empty string"

      - name: item_create_missing_unit_cost_cents_is_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Item.fields.unit_cost_cents
          - endpoints[POST /fresh/items]
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          unit_cost_cents has source input with no default, so omitting it fails the priority-3
          shape gate with ERR_INVALID_REQUEST (400) before any existence check on department_id.
        test_recipe:
          setup:
            - "The MEAT base chain up to the department; no item created yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, daily_forecast_units: 4.00 }
              as: DepartmentManager
          assert:
            - "HTTP status is 400"
            - "data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /fresh/items?department_id=${dept_id} returns total_count == 0 (nothing was persisted)"

      - name: department_and_item_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Department.fields.past_date_tolerance_hours
          - entities.Department.fields.shrink_budget_pct
          - entities.Department.fields.markdown_policy_profile
          - entities.Item.fields.donation_eligible
          - entities.Item.fields.sampling_allowed
          - endpoints[POST /fresh/departments]
          - endpoints[POST /fresh/items]
        distinguishing_aspect: |
          Creating a department with only its four required inputs yields tolerance 4h, budget
          2.50%, profile STANDARD, posture COMPLIANT and all four counters at 0; creating an item
          with only its six required inputs yields donation_eligible true, sampling_allowed false,
          status ACTIVE and a null shelf_life_days that falls back to the department default.
        test_recipe:
          setup:
            - "The MEAT base chain up to the ACTIVE ladder; no department or item yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
          trigger:
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
          assert:
            - "department response: data.past_date_tolerance_hours == 4"
            - "department response: data.shrink_budget_pct == 2.5"
            - "department response: data.markdown_policy_profile == 'STANDARD'"
            - "department response: data.compliance_status == 'COMPLIANT'"
            - "department response: data.markdown_liability_cents == 0 and data.shrink_cost_ratio_pct == 0"
            - "department response: data.sweep_epoch == 0 and data.open_finding_count == 0"
            - "item response: data.donation_eligible == true, data.sampling_allowed == false, data.status == 'ACTIVE'"
            - "item response: data.shelf_life_days is null"

      - name: lot_computed_fields_derive_sell_by_and_opening_price_from_item_and_department
        claim_type: computed_fields
        grounds:
          - entities.DateCodeLot.fields.sell_by_at
          - entities.DateCodeLot.fields.quantity_on_hand
          - entities.DateCodeLot.fields.current_price_cents
          - entities.DateCodeLot.fields.expected_sell_through_pct
          - calculations.sell_by_instant
          - calculations.expected_sell_through
        distinguishing_aspect: |
          The lot supplies only item_id, production_date and quantity_original; sell_by_at is
          2026-08-15T00:00:00.000Z (midnight of 2026-08-05 + the department's 10-day default,
          because the item declares no shelf_life_days), current_price_cents opens at the item's
          599 with current_rung_index -1, and expected_sell_through_pct is 66.67 =
          round_half_up(4.00 * 1.00 * 4 / 24 * 100, 2) with days_remaining floor(4.666) == 4.
        test_recipe:
          setup:
            - "The MEAT base chain up to the item; clock still 2026-08-10T08:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24, production_batch_code: "B-0805-A" }
              as: FreshClerk
              captures: { lot_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "data.sell_by_at == '2026-08-15T00:00:00.000Z'"
            - "data.quantity_on_hand == 24 and data.quantity_original == 24"
            - "data.units_sold == 0 and data.units_shrunk == 0 and data.units_donated == 0"
            - "data.current_price_cents == 599"
            - "data.current_rung_index == -1"
            - "data.total_discount_pct == 0"
            - "data.expected_sell_through_pct == 66.67"
            - "data.past_date_flag == false"
            - "data.status == 'FRESH'"

      - name: ladder_system_fields_are_server_owned_at_creation
        claim_type: system_fields
        grounds:
          - entities.MarkdownLadder.fields.status
          - entities.MarkdownLadder.fields.activated_at
          - endpoints[POST /fresh/markdown-ladders]
        distinguishing_aspect: |
          MarkdownLadder.status and activated_at are source system: the create endpoint does not
          accept them, the row lands DRAFT with activated_at null and version 1, and only the
          activate action can stamp activated_at.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-10T08:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
          trigger:
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "data.status == 'DRAFT'"
            - "data.activated_at is null"
            - "data.sell_through_floor_pct == 60 and data.max_total_discount_pct == 75 (declared defaults)"
            - "data.version == 1 and data.created_at == data.updated_at"
            - "data.id is a non-empty string that was not supplied by the client"

      - name: ladder_department_code_outside_enum_and_limit_above_max_are_rejected
        claim_type: type_constraints
        grounds:
          - entities.MarkdownLadder.fields.department_code
          - response_envelope.pagination_defaults
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Two distinct shape-gate violations both return ERR_INVALID_REQUEST (400): an enum member
          the scaffold never declares (department_code FLORAL) and a pagination limit of 101,
          one past the declared max of 100.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-10T08:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
          trigger:
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "FLORAL-STD-2026", department_code: "FLORAL", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }] }
              as: StoreOperationsAdmin
            - call: "GET /fresh/markdown-ladders?limit=101"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/markdown-ladders?limit=100"
              payload: {}
              as: StoreOperationsAdmin
          assert:
            - "first response: HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "second response: HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "third response: HTTP 200 with limit == 100, total_count == 0, has_more == false"

      - name: scan_price_check_is_append_only_with_no_version_or_update_surface
        claim_type: immutability
        grounds:
          - entities.ScanPriceCheck
          - entities.ScanPriceCheck.fields.label_barcode_snapshot
          - endpoints[POST /fresh/lots/{lotId}/scan-price-checks]
          - endpoints[GET /fresh/scan-price-checks/{checkId}]
        distinguishing_aspect: |
          ScanPriceCheck declares common_fields false: the created row carries id and created_at
          but no version and no updated_at, §1.5 exposes no PATCH or DELETE for it, and its
          computed fields snapshot the lot at scan time (expected 509, variance 0, MATCH, NONE).
        test_recipe:
          setup:
            - "The MEAT base chain; clock advanced to 2026-08-12T00:00:00.000Z (days_remaining 3)."
            - "A rung-0 markdown cut at 509 cents, its label PRINTED then APPLIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_v1}", pricing_variant: "LADDER_DAYS" }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { label_id: $.data.id }
            - call: "POST /fresh/markdown-labels/${label_id}/print"
              payload: {}
              as: FreshClerk
              as_user_id: "u-clerk-1"
            - call: "POST /fresh/markdown-labels/${label_id}/apply"
              payload: {}
              as: FreshClerk
              as_user_id: "u-clerk-1"
          trigger:
            - call: "POST /fresh/lots/${lot_id}/scan-price-checks"
              payload: { register_lane_code: "L07", scanned_price_cents: 509 }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { check_id: $.data.id }
            - call: "GET /fresh/scan-price-checks/${check_id}"
              payload: {}
              as: DepartmentManager
          assert:
            - "create response: HTTP 201 with data.id present and data.created_at present"
            - "create response: data has no 'version' key and no 'updated_at' key"
            - "create response: data.expected_price_cents == 509 and data.variance_cents == 0"
            - "create response: data.outcome == 'MATCH' and data.enforcement_action == 'NONE'"
            - "create response: data.label_barcode_snapshot == 'MD-000111222333-00509'"
            - "GET response: identical field set, still without 'version' or 'updated_at'"
            - "§1.5 declares no PATCH and no DELETE for /fresh/scan-price-checks/{checkId}"
            - "DateCodeLot.${lot_id}.status == 'MARKED_DOWN' (a MATCH scan changes nothing)"

