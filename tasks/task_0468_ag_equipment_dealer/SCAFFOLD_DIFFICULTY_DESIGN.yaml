# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Agricultural Equipment Dealer — Expert tier
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: labor_charge_estimate_vs_actual_on_work_order
        grounds:
          - calculations.labor_charge
          - state_machines.WorkOrder.IN_PROGRESS_to_CLOSED
          - entities.WorkOrder.fields.labor_charge_cents
        distinguishing_aspect: |
          The flat-rate estimate variant uses book hours (flat_rate_hours) while the actual
          variant uses technician hours (actual_hours); for the same WorkOrder, 3.5 book hours
          vs 4.0 actual hours at 15000 cents/hr yield 52500 vs 60000 — a different number on
          the WorkOrder (service domain), distinct from the floor-plan note variant below.
        test_recipe:
          setup:
            - "A Customer, a Unit, and a WorkOrder OPEN with labor_rate_cents=15000, flat_rate_hours=3.5"
            - "WorkOrder started (IN_PROGRESS) so labor_charge reflects the flat-rate estimate"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Prairie Farms", customer_type: "COMMERCIAL_AG" }
              as: DealerAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-LC-1", condition: "USED", model_code: "6155M", serial_number: "SN-LC-1", dealer_cost_cents: 5000000, list_price_cents: 6500000, engine_hours: 900 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /work-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", complaint: "hydraulic leak", labor_rate_cents: 15000, flat_rate_hours: 3.5 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /work-orders/${wo_id}/close"
              payload: { actual_hours: 4.0 }
              as: ServiceAdvisor
              captures: { final_labor: $.data.labor_charge_cents }
          assert:
            - "WorkOrder.${wo_id}.status == CLOSED"
            - "WorkOrder.${wo_id}.labor_charge_cents == 60000"
            - "The estimate observed while IN_PROGRESS was 52500 (flat_rate_hours*rate); the close value 60000 differs from it"

      - name: floor_plan_interest_full_principal_vs_declining_balance
        grounds:
          - calculations.floor_plan_interest
          - state_machines.FloorPlanNote.CURTAILMENT_DUE_to_ACTIVE
          - entities.FloorPlanNote.fields.interest_accrued_cents
        distinguishing_aspect: |
          The full_principal variant accrues on principal_cents (719178 at 100 days on 30000000 @875bps);
          the declining_balance variant accrues on principal minus curtailment — a different entity
          domain (FloorPlanNote financing) and a different conserved base than the WorkOrder labor variant.
        test_recipe:
          setup:
            - "A NEW Unit with an ACTIVE FloorPlanNote (principal 30000000, 875 bps) activated at clock default 2026-01-01"
            - "Clock advanced 100 days to 2026-04-11; interest recomputed on full principal"
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-FP-1", condition: "NEW", model_code: "8R410", serial_number: "SN-FP-1", dealer_cost_cents: 30000000, list_price_cents: 41000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /floor-plan-notes"
              payload: { unit_id: "${unit_id}", principal_cents: 30000000, annual_rate_bps: 875 }
              as: FinanceManager
              captures: { note_id: $.data.id }
            - call: "POST /floor-plan-notes/${note_id}/activate"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /floor-plan-notes/${note_id}/recompute"
              payload: {}
              as: FinanceManager
              captures: { accrued: $.data.interest_accrued_cents }
          assert:
            - "FloorPlanNote.${note_id}.days_outstanding == 100"
            - "FloorPlanNote.${note_id}.interest_accrued_cents == 719178"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: deal_amount_due_circular_tax_keyed_on_trade_reduced_base
        grounds:
          - calculations.deal_amount_due
          - state_machines.Deal.APPROVED_to_FUNDED
          - entities.Deal.fields.amount_due_cents
        distinguishing_aspect: |
          Mode (c) circular-looking: tax is keyed on taxable_base which itself depends on the
          trade allowance; the pinned order (trade first -> taxable_base -> tax -> amount_due)
          yields taxable 7008000, tax 508080, due 7516080 for sale 10000000 with a 2992000 trade.
        test_recipe:
          setup:
            - "A non-exempt Customer, an AVAILABLE Unit, an OFFERED TradeIn appraised at 2992000 (base 4000000 GOOD 1200h)"
            - "A SALE Deal sale_price 10000000 quoting that Unit with the trade attached, APPROVED"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Tax Buyer", customer_type: "RETAIL", tax_exempt: false }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-AD-1", condition: "NEW", model_code: "5075E", serial_number: "SN-AD-1", dealer_cost_cents: 7000000, list_price_cents: 10000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", model_code: "5065E", serial_number: "SN-TR-1", engine_hours: 1200, condition_grade: "GOOD", base_value_cents: 4000000 }
              as: SalesRep
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/offer"
              payload: {}
              as: SalesRep
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 10000000, tradein_id: "${ti_id}" }
              as: SalesRep
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v_now: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v_now}" }
              as: FinanceManager
              captures: { due: $.data.amount_due_cents }
          assert:
            - "Deal.${deal_id}.trade_allowance_cents == 2992000"
            - "Deal.${deal_id}.tax_cents == 508080"
            - "Deal.${deal_id}.amount_due_cents == 7516080"

      - name: lease_monthly_payment_nested_rounding_order_pinned
        grounds:
          - calculations.lease_monthly_payment
          - state_machines.Deal.APPROVED_to_FUNDED
          - entities.Deal.fields.monthly_payment_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: residual is rounded FIRST (rhu(sale*residual_pct)) then the
          per-month depreciation + rent charge is summed and rounded ONCE; STANDARD tier, sale
          12000000, 60 months yields residual 6000000 and monthly 127000 — a different mode than
          the circular tax instance above.
        test_recipe:
          setup:
            - "A STANDARD-tier Customer and an AVAILABLE Unit; a LEASE Deal sale_price 12000000, term 60, APPROVED"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Lessee Co", customer_type: "COMMERCIAL_AG", credit_tier: "STANDARD" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-LE-1", condition: "NEW", model_code: "6R145", serial_number: "SN-LE-1", dealer_cost_cents: 9000000, list_price_cents: 12000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "LEASE", sale_price_cents: 12000000, lease_term_months: 60 }
              as: SalesRep
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v}" }
              as: FinanceManager
              captures: { monthly: $.data.monthly_payment_cents }
          assert:
            - "Deal.${deal_id}.monthly_payment_cents == 127000"
            - "Unit.${unit_id}.status == LEASED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: unit_cyclic_sold_repossessed_available
        grounds:
          - state_machines.Unit.SOLD_to_REPOSSESSED
          - state_machines.Unit.REPOSSESSED_to_AVAILABLE
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Unit is cyclic: AVAILABLE->RESERVED->SOLD->REPOSSESSED->AVAILABLE; the unwind and
          recondition transitions return a terminal-looking SOLD unit to AVAILABLE, a loop on
          the Unit entity (distinct from the WorkOrder cycle below).
        test_recipe:
          setup:
            - "A funded SALE Deal whose Unit is SOLD (non-exempt customer, no trade, sale 6000000)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Repo Buyer", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-RP-1", condition: "USED", model_code: "4044M", serial_number: "SN-RP-1", dealer_cost_cents: 4000000, list_price_cents: 6000000, engine_hours: 300 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 6000000 }
              as: SalesRep
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v1: $.data.version }
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v1}" }
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v2: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/unwind"
              payload: { expected_unit_version: "${unit_v2}" }
              as: FinanceManager
            - call: "POST /units/${unit_id}/recondition"
              payload: {}
              as: DealerAdmin
              captures: { final_status: $.data.status }
          assert:
            - "Deal.${deal_id}.status == UNWOUND"
            - "Unit.${unit_id}.status == AVAILABLE"

      - name: work_order_cyclic_in_progress_awaiting_parts_loop
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_AWAITING_PARTS
          - state_machines.WorkOrder.AWAITING_PARTS_to_IN_PROGRESS
          - entities.WorkOrder.fields.status
        distinguishing_aspect: |
          WorkOrder loops IN_PROGRESS <-> AWAITING_PARTS via hold-for-parts/resume; the same row
          re-enters IN_PROGRESS, a cycle on a different entity (WorkOrder) than the Unit cycle.
        test_recipe:
          setup:
            - "A WorkOrder IN_PROGRESS with a PartLine for a Part whose available qty is below the line quantity"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Svc Cust", customer_type: "RETAIL" }
              as: DealerAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-WP-1", condition: "USED", model_code: "5100E", serial_number: "SN-WP-1", dealer_cost_cents: 4500000, list_price_cents: 6000000, engine_hours: 1500 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "FLT-001", description: "fuel filter", category: "FILTER", unit_price_cents: 8000, on_hand_qty: 1 }
              as: PartsClerk
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", complaint: "no start", labor_rate_cents: 14000, flat_rate_hours: 2.0 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/part-lines"
              payload: { part_id: "${part_id}", quantity: 3 }
              as: PartsClerk
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_id}/hold-for-parts"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /work-orders/${wo_id}/resume"
              payload: {}
              as: ServiceAdvisor
              captures: { st: $.data.status }
          assert:
            - "WorkOrder.${wo_id}.status == IN_PROGRESS"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deal_fund_cascade_floorplan_payoff_depth3
        grounds:
          - state_machines.Deal.APPROVED_to_FUNDED
          - state_machines.Unit.RESERVED_to_SOLD
          - state_machines.FloorPlanNote.ACTIVE_to_PAID_OFF
        distinguishing_aspect: |
          Depth-3 cascade originating at Deal.fund: fund mutates Deal->FUNDED (link1), which
          mutates Unit RESERVED->SOLD (link2), which itself triggers the ACTIVE FloorPlanNote on
          that unit ->PAID_OFF clearing Unit.floor_planned (link3) — each link caused by the prior.
        test_recipe:
          setup:
            - "A NEW Unit financed by an ACTIVE FloorPlanNote (floor_planned true); a non-exempt Customer"
            - "A SALE Deal (sale 9000000, no trade) on that Unit, RESERVED then APPROVED"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "FP Buyer", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-FC-1", condition: "NEW", model_code: "7R290", serial_number: "SN-FC-1", dealer_cost_cents: 7000000, list_price_cents: 9000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /floor-plan-notes"
              payload: { unit_id: "${unit_id}", principal_cents: 7000000, annual_rate_bps: 800 }
              as: FinanceManager
              captures: { note_id: $.data.id }
            - call: "POST /floor-plan-notes/${note_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 9000000 }
              as: SalesRep
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v}" }
              as: FinanceManager
          assert:
            - "Deal.${deal_id}.status == FUNDED"
            - "Unit.${unit_id}.status == SOLD"
            - "FloorPlanNote.${note_id}.status == PAID_OFF"
            - "Unit.${unit_id}.floor_planned == false"

      - name: deal_unwind_cascade_unit_repossess_tradein_revert_depth3
        grounds:
          - state_machines.Deal.FUNDED_to_UNWOUND
          - state_machines.Unit.SOLD_to_REPOSSESSED
          - state_machines.TradeIn.ACCEPTED_to_DECLINED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (Deal.unwind): unwind mutates Deal->UNWOUND
          (link1), which mutates the sold Unit SOLD->REPOSSESSED (link2), which triggers reversal
          of the accepted trade — minted Unit RETIRED and TradeIn ACCEPTED->DECLINED (link3).
        test_recipe:
          setup:
            - "A funded SALE Deal (sale 8000000) with an attached trade that was ACCEPTED at funding, minting a used Unit"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Unwind Cust", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-UW-1", condition: "NEW", model_code: "8RX410", serial_number: "SN-UW-1", dealer_cost_cents: 6000000, list_price_cents: 8000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", model_code: "8295R", serial_number: "SN-UWTR-1", engine_hours: 800, condition_grade: "FAIR", base_value_cents: 5000000 }
              as: SalesRep
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/offer"
              payload: {}
              as: SalesRep
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 8000000, tradein_id: "${ti_id}" }
              as: SalesRep
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v1: $.data.version }
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v1}" }
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v2: $.data.version }
            - call: "GET /trade-ins/${ti_id}"
              payload: {}
              as: FinanceManager
              captures: { minted_unit_id: $.data.minted_unit_id }
          trigger:
            - call: "POST /deals/${deal_id}/unwind"
              payload: { expected_unit_version: "${unit_v2}" }
              as: FinanceManager
          assert:
            - "Deal.${deal_id}.status == UNWOUND"
            - "Unit.${unit_id}.status == REPOSSESSED"
            - "TradeIn.${ti_id}.status == DECLINED"
            - "Unit.${minted_unit_id}.status == RETIRED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_on_work_order_close
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - state_machines.WorkOrder.IN_PROGRESS_to_CLOSED
        distinguishing_aspect: |
          A close on an OPEN (not IN_PROGRESS) WorkOrder that ALSO has a parts shortage fails the
          state check (priority 6, ERR_INVALID_STATE, category state) ahead of the fiscal parts
          check (priority 14, ERR_PARTS_SHORTAGE, category business_fiscal) — a state vs
          business_fiscal pairing.
        test_recipe:
          setup:
            - "A WorkOrder still OPEN (never started) with a PartLine whose Part has insufficient stock"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "PV Cust", customer_type: "RETAIL" }
              as: DealerAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-PV-1", condition: "USED", model_code: "5055E", serial_number: "SN-PV-1", dealer_cost_cents: 3000000, list_price_cents: 4000000, engine_hours: 2000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "BRG-9", description: "bearing", category: "MECHANICAL", unit_price_cents: 12000, on_hand_qty: 1 }
              as: PartsClerk
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", complaint: "noise", labor_rate_cents: 13000, flat_rate_hours: 1.5 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/part-lines"
              payload: { part_id: "${part_id}", quantity: 5 }
              as: PartsClerk
          trigger:
            - call: "POST /work-orders/${wo_id}/close"
              payload: { actual_hours: 2.0 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "WorkOrder.${wo_id}.status == OPEN"

      - name: referential_before_safety_on_recall_adjudicate
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.WarrantyClaim.SUBMITTED_to_DENIED
        distinguishing_aspect: |
          Adjudicating with decision DENY on a RECALL claim that is NOT in SUBMITTED state (still
          DRAFT) fails the state check (priority 6, ERR_INVALID_STATE, category state) ahead of
          the safety check (priority 10, ERR_RECALL_CANNOT_DENY, category business_safety) — a
          state vs business_safety pairing distinct from the state/business_fiscal pair above.
        test_recipe:
          setup:
            - "A RECALL WarrantyClaim still in DRAFT (never submitted)"
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-RC-1", condition: "USED", model_code: "6120M", serial_number: "SN-RC-1", dealer_cost_cents: 3500000, list_price_cents: 4800000, engine_hours: 1100 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_id: "${unit_id}", claim_type: "RECALL", campaign_code: "SAFETY-22" }
              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/adjudicate"
              payload: { decision: "DENY" }
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "WarrantyClaim.${claim_id}.status == DRAFT"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: curtailment_breakpoint_at_exactly_90_days
        grounds:
          - calculations.curtailment_schedule
          - state_machines.FloorPlanNote.ACTIVE_to_CURTAILMENT_DUE
          - entities.FloorPlanNote.fields.curtailment_stage
        distinguishing_aspect: |
          The 90-day breakpoint uses >= : at days_outstanding 89 the note stays ACTIVE
          (curtailment_stage 0), at exactly 90 it flips to CURTAILMENT_DUE (stage 1, required
          3000000 on principal 30000000) — a numeric-threshold boundary reached via recompute.
        test_recipe:
          setup:
            - "An ACTIVE FloorPlanNote principal 30000000 activated at 2026-01-01"
            - "Clock set to 2026-04-01 (exactly 90 days after 2026-01-01)"
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-CB-1", condition: "NEW", model_code: "9620RX", serial_number: "SN-CB-1", dealer_cost_cents: 30000000, list_price_cents: 42000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /floor-plan-notes"
              payload: { unit_id: "${unit_id}", principal_cents: 30000000, annual_rate_bps: 875 }
              as: FinanceManager
              captures: { note_id: $.data.id }
            - call: "POST /floor-plan-notes/${note_id}/activate"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /floor-plan-notes/${note_id}/recompute"
              payload: {}
              as: FinanceManager
              captures: { stage: $.data.curtailment_stage }
          assert:
            - "FloorPlanNote.${note_id}.days_outstanding == 90"
            - "FloorPlanNote.${note_id}.curtailment_stage == 1"
            - "FloorPlanNote.${note_id}.status == CURTAILMENT_DUE"

      - name: bid_must_strictly_exceed_high_bid_equal_rejected
        grounds:
          - validations[priority=12]
          - entities.AuctionLot.fields.high_bid_cents
          - errors[ERR_BID_TOO_LOW]
        distinguishing_aspect: |
          The bid endpoint uses strict > on amount vs high_bid_cents: a second bid equal to the
          current high (both 5000000) is rejected with ERR_BID_TOO_LOW — an equality-boundary edge
          on a different metric (bid amount) and a different endpoint than the curtailment day
          threshold.
        test_recipe:
          setup:
            - "A LIVE AuctionLot with a current high bid of 5000000"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Bidder A", customer_type: "COMMERCIAL_AG" }
              as: DealerAdmin
              captures: { bidder_a: $.data.id }
            - call: "POST /customers"
              payload: { name: "Bidder B", customer_type: "COMMERCIAL_AG" }
              as: DealerAdmin
              captures: { bidder_b: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-BD-1", condition: "USED", model_code: "S780", serial_number: "SN-BD-1", dealer_cost_cents: 4000000, list_price_cents: 5500000, engine_hours: 2500 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /auction-lots"
              payload: { unit_id: "${unit_id}", reserve_price_cents: 4500000, opens_at: "2026-01-01T00:00:00Z", closes_at: "2026-06-01T00:00:00Z" }
              as: AuctionClerk
              captures: { lot_id: $.data.id }
            - call: "POST /auction-lots/${lot_id}/open"
              payload: {}
              as: AuctionClerk
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_customer_id: "${bidder_a}", amount_cents: 5000000 }
              as: AuctionClerk
          trigger:
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_customer_id: "${bidder_b}", amount_cents: 5000000 }
              as: AuctionClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BID_TOO_LOW"
            - "AuctionLot.${lot_id}.high_bid_cents == 5000000"
            - "AuctionLot.${lot_id}.high_bidder_customer_id == ${bidder_a}"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: deal_quote_requires_unit_available
        grounds:
          - validations[priority=8]
          - state_machines.Unit.AVAILABLE_to_RESERVED
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Quoting a Deal (Deal entity) depends on the referenced Unit's state being AVAILABLE:
          a second SALE deal quoted against a Unit already RESERVED by a first deal is rejected
          with ERR_UNIT_NOT_RESERVABLE — a Deal->Unit cross-entity pair.
        test_recipe:
          setup:
            - "A Unit RESERVED by a first QUOTED SALE deal; a second customer attempts to quote the same Unit"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "CE Cust A", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { name: "CE Cust B", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_b: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-CE-1", condition: "NEW", model_code: "6155R", serial_number: "SN-CE-1", dealer_cost_cents: 7000000, list_price_cents: 9500000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_a}", deal_type: "SALE", sale_price_cents: 9500000 }
              as: SalesRep
              captures: { deal_a: $.data.id }
          trigger:
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_b}", deal_type: "SALE", sale_price_cents: 9500000 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNIT_NOT_RESERVABLE"
            - "Unit.${unit_id}.status == RESERVED"

      - name: floorplan_activate_requires_unit_available
        grounds:
          - validations[priority=8]
          - state_machines.FloorPlanNote.DRAFT_to_ACTIVE
          - entities.Unit.fields.status
        distinguishing_aspect: |
          FloorPlanNote.activate (FloorPlanNote entity) depends on the referenced Unit's state
          being AVAILABLE: once the unit is RESERVED by a quote, activating a DRAFT note on it is
          rejected with ERR_INVALID_STATE — a FloorPlanNote->Unit pair distinct from Deal->Unit.
        test_recipe:
          setup:
            - "A Unit reserved by a QUOTED deal (status RESERVED), and a DRAFT FloorPlanNote on that same unit"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "FPA Cust", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-FA-1", condition: "NEW", model_code: "7R250", serial_number: "SN-FA-1", dealer_cost_cents: 6500000, list_price_cents: 8800000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /floor-plan-notes"
              payload: { unit_id: "${unit_id}", principal_cents: 6500000, annual_rate_bps: 850 }
              as: FinanceManager
              captures: { note_id: $.data.id }
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 8800000 }
              as: SalesRep
          trigger:
            - call: "POST /floor-plan-notes/${note_id}/activate"
              payload: {}
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "FloorPlanNote.${note_id}.status == DRAFT"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: auction_window_opens_before_closes_strict
        grounds:
          - validations[priority=11]
          - entities.AuctionLot.fields.opens_at
          - errors[ERR_AUCTION_WINDOW]
        distinguishing_aspect: |
          AuctionLot uses a half-open occupation window [opens_at, closes_at): creating a lot with
          opens_at == closes_at (degenerate zero-width interval) is rejected with
          ERR_AUCTION_WINDOW — strict-adjacency interval semantics on the AuctionLot resource.
        test_recipe:
          setup:
            - "An AVAILABLE USED Unit eligible for auction"
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-AW-1", condition: "USED", model_code: "S770", serial_number: "SN-AW-1", dealer_cost_cents: 3800000, list_price_cents: 5000000, engine_hours: 1900 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /auction-lots"
              payload: { unit_id: "${unit_id}", reserve_price_cents: 4000000, opens_at: "2026-03-01T00:00:00Z", closes_at: "2026-03-01T00:00:00Z" }
              as: AuctionClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AUCTION_WINDOW"
            - "Unit.${unit_id}.status == AVAILABLE"

      - name: floorplan_one_active_note_per_unit_aggregate_capacity
        grounds:
          - validations[priority=6]
          - state_machines.FloorPlanNote.DRAFT_to_ACTIVE
          - entities.FloorPlanNote.fields.status
        distinguishing_aspect: |
          FloorPlanNote enforces aggregate-capacity-1 occupation per Unit over the open-ended
          financing interval [activated_on, payoff): activating a second DRAFT note while a first
          note on the same unit is already ACTIVE is rejected — a capacity-1 occupation semantics
          distinct from the AuctionLot half-open instant window.
        test_recipe:
          setup:
            - "A Unit with one ACTIVE FloorPlanNote and a second DRAFT FloorPlanNote on the same unit"
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-FN-1", condition: "NEW", model_code: "8R340", serial_number: "SN-FN-1", dealer_cost_cents: 20000000, list_price_cents: 28000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /floor-plan-notes"
              payload: { unit_id: "${unit_id}", principal_cents: 20000000, annual_rate_bps: 875 }
              as: FinanceManager
              captures: { note1_id: $.data.id }
            - call: "POST /floor-plan-notes/${note1_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /floor-plan-notes"
              payload: { unit_id: "${unit_id}", principal_cents: 20000000, annual_rate_bps: 875 }
              as: FinanceManager
              captures: { note2_id: $.data.id }
          trigger:
            - call: "POST /floor-plan-notes/${note2_id}/activate"
              payload: {}
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "FloorPlanNote.${note2_id}.status == DRAFT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deal_unwind_restores_unit_inventory_count
        grounds:
          - state_machines.Deal.FUNDED_to_UNWOUND
          - state_machines.Unit.SOLD_to_REPOSSESSED
          - state_machines.TradeIn.ACCEPTED_to_DECLINED
        distinguishing_aspect: |
          Conserved quantity = count of Units in a saleable/in-inventory lineage. Funding a
          trade-in deal mints +1 Unit (net inventory delta from trade); unwinding RETIRES that
          minted unit and reverts the trade, so the count of non-RETIRED Units traceable to this
          deal returns to its pre-fund value (the originally-sold unit returns to inventory as
          REPOSSESSED, the minted unit is removed). Named invariant: non_retired_unit_count.
        test_recipe:
          setup:
            - "A funded SALE Deal (sale 8000000) with an accepted trade that minted exactly one used Unit"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Inv Cust", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-IV-1", condition: "NEW", model_code: "8R230", serial_number: "SN-IV-1", dealer_cost_cents: 6000000, list_price_cents: 8000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", model_code: "7830", serial_number: "SN-IVTR-1", engine_hours: 800, condition_grade: "FAIR", base_value_cents: 5000000 }
              as: SalesRep
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/offer"
              payload: {}
              as: SalesRep
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 8000000, tradein_id: "${ti_id}" }
              as: SalesRep
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v1: $.data.version }
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v1}" }
              as: FinanceManager
            - call: "GET /trade-ins/${ti_id}"
              payload: {}
              as: FinanceManager
              captures: { minted_unit_id: $.data.minted_unit_id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v2: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/unwind"
              payload: { expected_unit_version: "${unit_v2}" }
              as: FinanceManager
          assert:
            - "Unit.${minted_unit_id}.status == RETIRED"
            - "Unit.${unit_id}.status == REPOSSESSED"
            - "TradeIn.${ti_id}.status == DECLINED"
            - "non_retired_unit_count of {original, minted} after unwind == 1 (only original, REPOSSESSED, remains), equal to the pre-fund count of 1 (only original)"

      - name: work_order_void_restores_part_reserved_quantity
        grounds:
          - state_machines.WorkOrder.OPEN_to_VOID
          - calculations.parts_availability
          - entities.Part.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity = Part.reserved_qty (a stock reservation count, a different conserved
          quantity than unit count). Adding a PartLine reserves quantity; voiding the OPEN
          WorkOrder releases it, so Part.reserved_qty returns to its pre-line value of 0 and
          available stock is fully restored. Named invariant: part_reserved_qty.
        test_recipe:
          setup:
            - "A Part on_hand_qty 10 reserved_qty 0; a WorkOrder OPEN with a PartLine reserving 4 (reserved_qty 4)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "WV Cust", customer_type: "RETAIL" }
              as: DealerAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-WV-1", condition: "USED", model_code: "5090E", serial_number: "SN-WV-1", dealer_cost_cents: 4000000, list_price_cents: 5500000, engine_hours: 1200 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "OIL-22", description: "oil filter", category: "FILTER", unit_price_cents: 3000, on_hand_qty: 10 }
              as: PartsClerk
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", complaint: "service", labor_rate_cents: 12000, flat_rate_hours: 1.0 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/part-lines"
              payload: { part_id: "${part_id}", quantity: 4 }
              as: PartsClerk
          trigger:
            - call: "POST /work-orders/${wo_id}/void"
              payload: {}
              as: ServiceAdvisor
            - call: "GET /parts/${part_id}"
              payload: {}
              as: PartsClerk
              captures: { reserved_after: $.data.reserved_qty }
          assert:
            - "WorkOrder.${wo_id}.status == VOID"
            - "Part.${part_id}.reserved_qty == 0"
            - "Part.${part_id}.on_hand_qty == 10"
