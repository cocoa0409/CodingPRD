              payload: { operating_day_id: "${od_id}", hauler_ref: "H-3", waste_stream: "CONSTRUCTION_DEBRIS", manifest_tons: 30.00, load_check_result: "PASS" }
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { l3_id: $.data.id }
            - call: "POST /waste-loads/${l3_id}/clear-screening"
              payload: {}
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { l3_gate: $.data.gate_charge_amount }
