  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: mast_slot_half_open_adjacency_allowed
        grounds:
          - calculations.mast_slot_overlap_check
          - validations[priority=7]
        distinguishing_aspect: |
          Resource Boat with HALF-OPEN interval semantics [slot_start_utc,
          slot_end_utc): a new booking whose slot_start_utc equals an existing
          booking's slot_end_utc is ADJACENT and ALLOWED; true overlap
          (start < existing.end AND existing.start < end) is rejected.
        test_recipe:
          setup:
            - "C15 owns B15; ME15 BOOKED 2026-09-10T08:00:00Z → 2026-09-10T12:00:00Z"
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C Fifteen", email: "c15@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c15_id: $.data.id }
            - call: "POST /lofts/customers/${c15_id}/boats"
              payload: { boat_name: "B15", hull_length_m: 10.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z", running_rigging_hours_accumulated: 0 }
              as: LoftManager
              captures: { b15_id: $.data.id }
            - call: "POST /lofts/boats/${b15_id}/mast-service-events"
              payload: { service_kind: "UNSTEP", slot_start_utc: "2026-09-10T08:00:00Z", slot_end_utc: "2026-09-10T12:00:00Z" }
              as: Rigger
              captures: { me15_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b15_id}/mast-service-events"
              payload: { service_kind: "STEP", slot_start_utc: "2026-09-10T12:00:00Z", slot_end_utc: "2026-09-10T16:00:00Z" }
              as: Rigger
              captures: { me15b_id: $.data.id }
          assert:
            - "Adjacent booking (start == existing end) succeeds: MastServiceEvent.${me15b_id}.event_status == BOOKED"
            - "Both events coexist on the same boat (half-open semantics: 12:00 is free)"

      - name: bay_window_closed_interval_with_turnaround_gap
        grounds:
          - calculations.bay_overlap_check
          - validations[priority=8]
        distinguishing_aspect: |
          Resource bay_code (different resource entity from Boat) with
          CLOSED-interval-plus-buffer semantics: a job ending 2026-09-05 and a
          new job starting 2026-09-06 CONFLICT because the 1-day turnaround gap
          is mandatory (adjacency is NOT allowed); starting 2026-09-07 is fine.
