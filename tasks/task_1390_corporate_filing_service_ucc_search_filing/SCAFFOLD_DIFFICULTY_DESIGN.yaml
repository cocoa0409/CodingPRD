# =============================================================================
# Task 1390 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2+ instances = 21 instances. Every recipe drives empty-DB to the
# precondition state using only §1.5 endpoints.
# Shared fixture values (pinned literals):
#   PROFILE_CA: base 10000, per_addl 1500, county_surcharge 2500,
#               county classes ["FIXTURE"], counties ["LOS_ANGELES","ORANGE"],
#               name rule LEGAL_NAME_ONLY, expedited capacity 2
#   DEBTOR_ORG: ORGANIZATION "Acme Manufacturing, Inc." (DE)
#   Collateral OK text: "All manufacturing equipment located at 100 Industrial Way"
#   Default clock: 2026-08-01T00:00:00Z
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: fee_quote_vs_charged_after_profile_update
        grounds:
          - calculations.filing_fee
          - entities.FilingRequest.fields.quoted_fee_cents
          - entities.UCCFiling.fields.charged_fee_cents
          - "endpoints[PUT /jurisdiction-profiles/{id}]"
        distinguishing_aspect: |
          Same formula, same request, two evaluation instants: QUOTED reads the
          profile at approve time (10000 base) and CHARGED reads it at submit
          time (after base_fee_cents rises to 12000) — the fiscal-variant pair
          lives on the FilingRequest/UCCFiling domain and must diverge by exactly 2000.
        test_recipe:
          setup:
            - "CA profile with base_fee_cents 10000; client, org debtor, secured party exist"
            - "NEW_UCC1 GENERAL STANDARD request is READY with quoted fee already snapshotted"
            - "Then the profile's base fee is raised to 12000 before the attempt is submitted"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin, captures: { prof_ca: $.data.id } }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1", captures: { quoted: $.data.quoted_fee_cents } }
            - { call: "PUT /jurisdiction-profiles/${prof_ca}", payload: { base_fee_cents: 12000 }, as: PlatformAdmin }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { fid: $.data.id } }
          trigger:
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist, captures: { charged: $.data.charged_fee_cents } }
          assert:
            - "FilingRequest.${rid}.quoted_fee_cents == 10000"
            - "UCCFiling.${fid}.charged_fee_cents == 12000"
            - "charged_fee_cents != quoted_fee_cents (divergence == 2000)"
            - "UCCFiling.${fid}.effectiveness_status == SUBMITTED"

      - name: report_as_of_now_vs_forward_projection
        grounds:
          - calculations.perfection_report
          - entities.PerfectionReport.fields.projected_lapsed_count
          - "endpoints[POST /client-accounts/{id}/perfection-reports]"
        distinguishing_aspect: |
          Same portfolio, two report modes: AS_OF_NOW counts the 30-days-to-expiry
          filing as ACTIVE+perfected, FORWARD_PROJECTION (horizon 90) reclassifies
          it into projected_lapsed with its exposure — the portfolio-domain variant
          pair must produce perfected_count 1 vs 0 and projected_lapsed_count 0 vs 1.
        test_recipe:
          setup:
            - "Client portfolio at 2026-08-01: F1 ACTIVE+REFLECTED secured 500000 expiring 2026-08-31; F2 ACTIVE+UNVERIFIED secured 300000 expiring 2027-03-01; F3 LAPSED secured 200000 (expired 2026-06-01); F4 TERMINATED secured 100000"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2021-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r3: $.data.id } }
            - { call: "POST /filing-requests/${r3}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${r3}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${r3}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 200000 }, as: FilingSpecialist, captures: { f3: $.data.id } }
            - { call: "POST /filings/${f3}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${f3}/record-acceptance", payload: { filing_number: "CA-2021-0003", filed_at: "2021-06-01T00:00:00Z" }, as: FilingOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2021-08-31T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r1: $.data.id } }
            - { call: "POST /filing-requests/${r1}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${r1}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${r1}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { f1: $.data.id } }
            - { call: "POST /filings/${f1}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${f1}/record-acceptance", payload: { filing_number: "CA-2021-0001", filed_at: "2021-08-31T00:00:00Z" }, as: FilingOfficer }
            - { call: "POST /lien-searches", payload: { client_id: "${cid}", purpose: "POST_FILING_VERIFICATION", debtor_id: "${did}", jurisdiction_code: "CA", subject_filing_id: "${f1}" }, as: FilingSpecialist, captures: { s1: $.data.id } }
            - { call: "POST /lien-searches/${s1}/record-results", payload: { through_date: "2021-09-15T00:00:00Z", hits: [ { found_debtor_name: "Acme Manufacturing, Inc.", found_filing_number: "CA-2021-0001", found_filed_at: "2021-08-31T00:00:00Z", secured_party_name: "Acme Lending" } ] }, as: SearchAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2022-01-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r4: $.data.id } }
            - { call: "POST /filing-requests/${r4}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${r4}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${r4}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 100000 }, as: FilingSpecialist, captures: { f4: $.data.id } }
            - { call: "POST /filings/${f4}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${f4}/record-acceptance", payload: { filing_number: "CA-2022-0004", filed_at: "2022-01-05T00:00:00Z" }, as: FilingOfficer }
            - { call: "GET /filings/${f4}", as: PlatformAdmin, captures: { f4v: $.data.version } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "TERMINATION", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${f4}", expected_target_filing_version: "${f4v}" }, as: FilingSpecialist, captures: { tr4: $.data.id } }
            - { call: "POST /filing-requests/${tr4}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${tr4}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${tr4}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc." }, as: FilingSpecialist, captures: { tf4: $.data.id } }
            - { call: "POST /filings/${tf4}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${tf4}/record-acceptance", payload: { filing_number: "CA-2022-0005", filed_at: "2022-01-20T00:00:00Z" }, as: FilingOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2022-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r2: $.data.id } }
            - { call: "POST /filing-requests/${r2}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${r2}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${r2}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 300000 }, as: FilingSpecialist, captures: { f2: $.data.id } }
            - { call: "POST /filings/${f2}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${f2}/record-acceptance", payload: { filing_number: "CA-2022-0002", filed_at: "2022-03-01T00:00:00Z" }, as: FilingOfficer }
