            - { call: "POST /expungement/criminal-records/${rq}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${pq}", jurisdiction_code: "CA-02", record_ids: ["${rq}"] }, as: Clerk, captures: { petq: "$.data.id" } }
            - { call: "POST /expungement/petitions/${petq}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
