        distinguishing_aspect: "Immediate consistency: the 201 response of POST /erp/referrals already carries every computed field (bonus_base_cents 150000, campaign_uplift_cents 0, bonus_total_cents 150000, policy_version_id pinned, status SUBMITTED) — no re-read needed."
