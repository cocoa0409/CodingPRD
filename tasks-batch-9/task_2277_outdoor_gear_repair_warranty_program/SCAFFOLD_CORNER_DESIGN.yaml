            - "GearItem.${item_id}.age_months == 89 and warranty_state == EXPIRED and proof_of_purchase_type == NONE"
            - "WarrantyClaim.${claim_id}.status == DRAFT and proof_verified == false"
            - "Customer.${cust_id}.lifetime_claim_count == 0"

      - name: future_purchase_date_rejected_same_day_accepted
        claim_type: temporal_validation
        grounds:
          - validations[priority=30]
          - errors[ERR_PURCHASE_DATE_IN_FUTURE]
          - calculations.replacement_value.formula
        distinguishing_aspect: "The comparison is against the logical clock and is inclusive: 2026-06-16 is refused while 2026-06-15 (today) registers with age_months 0, zero depreciation and the residual floor not binding."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; TNT-ASCENT-2 catalogued and a customer registered"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
