  - section: rbac
    instances:
      - name: credit_roles_cannot_swap_their_exclusive_operations
        claim_type: exclusive_operation_denied
        grounds:
          - roles.CreditUnderwriter.exclusive_operations
          - roles.CreditCommittee.exclusive_operations
          - validations[priority=10]
        distinguishing_aspect: |
          Underwriting and the credit decision are exclusive to different roles, and the 403
          ERR_UNAUTHORIZED is raised before any state or business rung: CreditCommittee is refused
          the underwrite of a SCREENING loan, CreditUnderwriter is refused the decision on that
          same loan (rather than getting ERR_LOAN_NOT_IN_UNDERWRITING), ComplianceAnalyst is
          refused both, and only then does CreditUnderwriter succeed.
        test_recipe:
          setup:
            - "One institution with one product and one GEOCODED borrower with credit score 740."
            - "One loan for 1,000,000 cents in SCREENING."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000044", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/loan-products"
              payload: { name: "Flexible Small Business Loan", base_rate_bps: 900, term_months: 60, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: ["REPORTS_TO_BUREAUS"], requires_ta_completion: false, product_cap_cents: 100000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Maria Ortiz", street_address: "12 Grand Concourse", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /cdfi/borrowers/${b1_id}/geocode"
              payload: { outcome: "MATCHED", census_tract_code: "36005010100" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b1_id}", product_id: "${prod_id}", requested_principal_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /cdfi/loans/${loan_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 740 }
              as: CreditCommittee
              as_user_id: "cc-1"
              captures: { cc_uw_status: $.status, cc_uw_code: $.data.error_id }
            - call: "POST /cdfi/loans/${loan_id}/decision"
              payload: { decision: "APPROVE", approved_principal_cents: 1000000 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
              captures: { uw_dec_status: $.status, uw_dec_code: $.data.error_id }
            - call: "POST /cdfi/loans/${loan_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 740 }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { ops_uw_status: $.status, ops_uw_code: $.data.error_id }
            - call: "POST /cdfi/loans/${loan_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 740 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
              captures: { ok_status: $.status }
          assert:
            - "${cc_uw_status} == 403"
            - "${cc_uw_code} == ERR_UNAUTHORIZED"
            - "${uw_dec_status} == 403"
            - "${uw_dec_code} == ERR_UNAUTHORIZED"
            - "${ops_uw_status} == 403"
            - "${ops_uw_code} == ERR_UNAUTHORIZED"
            - "${ok_status} == 200"
            - "Loan.${loan_id}.underwriting_state == UNDERWRITING"
            - "Loan.${loan_id}.dti_pct == 12.42"
            - "Loan.${loan_id}.underwritten_by_user_id == uw-1"
      - name: officer_and_reviewer_cannot_take_over_each_others_market_operations
        claim_type: exclusive_operation_denied
        grounds:
          - roles.InstitutionOfficer.exclusive_operations
          - roles.CertificationReviewer.exclusive_operations
          - validations[priority=10]
        distinguishing_aspect: |
          define_target_market belongs to the lender and approve_target_market belongs to the
          certifying authority: the officer's approve and the reviewer's create are both 403
          ERR_UNAUTHORIZED, and the market stays DRAFT with approved_at null until the reviewer
