              payload: { legal_name: "Mu Corp", admin_email: "m@m.example", home_country: "US", data_region: "US", plan_id: "${plan_plus_id}" }
              as: PlatformAdmin
              captures: { company_m_id: $.data.id }
            - &k_company_m_admin
              call: "POST /api/companies/${company_m_id}/users"
              payload: { company_id: "${company_m_id}", email: "admin@m.example", display_name: "M Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_m_admin_id: $.data.id }
            - call: "POST /api/companies/${company_m_id}/users/${company_m_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_m_admin_id}"
            - call: "POST /api/companies/${company_m_id}/subscription/activate"
              payload: { payment_method_token: "pm_card_visa" }
              as: CompanyUser
              as_user_id: "${company_m_admin_id}"
            - &k_bc_m
              call: "POST /api/companies/${company_m_id}/bank_connections"
