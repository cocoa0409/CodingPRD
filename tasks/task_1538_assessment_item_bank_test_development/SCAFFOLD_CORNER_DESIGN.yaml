scaffold_corner_design:
  # =====================================================================
  # Section: entities — creation, retrieval, listing, defaults, computed fields
  # =====================================================================
  - section: entities
    instances:
      - name: program_create_with_required_fields_returns_201
        claim_type: creation
        grounds:
          - entities.AssessmentProgram
          - "endpoints[POST /api/assessment-programs]"
        distinguishing_aspect: "POST with all required fields returns 201 + full entity including system-stamped fields"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "ELA-G3", subject: "ELA", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id, clock_init: $.data.current_period_utc }
          assert:
            - "HTTP 201"
            - "prog is a UUID"
            - "clock_init == '2026-08-01T00:00:00Z' (fixed logical clock default)"
            - "status == ACTIVE"

      - name: program_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - entities.AssessmentProgram
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Missing required subject field returns 400"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "MISSING-SUBJ", grade_level: 5, admin_year: 2026 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP 400"

      - name: program_retrieve_by_id_returns_stored_data
        claim_type: retrieval
        grounds:
          - "endpoints[GET /api/assessment-programs/{pid}]"
        distinguishing_aspect: "GET /api/assessment-programs/{pid} returns the program with all input fields preserved"
        test_recipe:
          setup: ["One program exists"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "SCI-G7", subject: "SCIENCE", grade_level: 7, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /api/assessment-programs/${prog}"
              payload: {}
              as: ProgramDirector
          assert:
            - "HTTP 200"
            - "data.program_code == 'SCI-G7'"
            - "data.grade_level == 7"

      - name: program_retrieve_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a non-existent program UUID returns 404 ERR_NOT_FOUND"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/assessment-programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "HTTP 404"

      - name: program_list_pagination_default
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "List endpoint returns paginated envelope with limit=10, offset=0 by default; total_count and has_more present"
        test_recipe:
          setup: ["Multiple programs exist"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-1", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-2", subject: "ELA", grade_level: 4, admin_year: 2026 }
              as: ProgramDirector
          trigger:
            - call: "GET /api/assessment-programs"
              payload: {}
              as: ProgramDirector
          assert:
            - "HTTP 200"
            - "response envelope contains meta.api_request_id"
            - "data is an array of length 2"
            - "pagination fields limit, offset, total_count, has_more present in envelope"

      - name: item_exposure_cap_defaults_to_3
        claim_type: defaults
        grounds:
          - entities.Item.fields.exposure_cap
        distinguishing_aspect: "When exposure_cap is omitted on item create, it defaults to 3"
        test_recipe:
          setup: ["Program and standard exist"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "ELA-G5", subject: "ELA", grade_level: 5, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
          trigger:
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-DEF", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { cap: $.data.exposure_cap }
          assert:
            - "cap == 3 (default applied when exposure_cap omitted)"

      - name: item_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Item.fields.author_user_id
          - entities.Item.fields.status
        distinguishing_aspect: "Client-supplied status / author_user_id / version on create are ignored; system stamps DRAFT, version=1, author from header"
        test_recipe:
          setup: ["Program and standard exist"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "MATH-G5", subject: "MATH", grade_level: 5, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
          trigger:
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-SYS", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              as_user_id: "writer-99"
              captures: { st: $.data.status, v: $.data.version, auth: $.data.author_user_id }
          assert:
            - "st == 'DRAFT'"
            - "v == 1"
            - "auth == 'writer-99' (taken from X-User-ID header)"

      - name: item_invalid_enum_item_type_returns_400
        claim_type: type_constraints
        grounds:
          - entities.Item.fields.item_type
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "item_type not in {MC, MS, EBSR, TE, CR} returns 400"
        test_recipe:
          setup: ["Program and standard exist"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "SCI-G6", subject: "SCIENCE", grade_level: 6, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
          trigger:
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-BAD", primary_standard_id: "${cs}", item_type: "ESSAY", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: item_response_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.ItemResponse
        distinguishing_aspect: "ItemResponse has common_fields=false: no version field, no updated_at; cannot be PUT/PATCH'd"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/item-responses"
              payload: {}
              as: Psychometrician
          assert:
            - "ItemResponse entity has no version field (common_fields=false)"
            - "No PUT/PATCH endpoint exists for /api/item-responses/{rid}"

  # =====================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, side effects
  # =====================================================================
  - section: state_machines
    instances:
      - name: item_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.Item
        distinguishing_aspect: "A newly created Item starts in DRAFT status, UNSECURED posture"
        test_recipe:
          setup: ["Program and standard"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "MATH-G8", subject: "MATH", grade_level: 8, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
          trigger:
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-INIT", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { st: $.data.status, sp: $.data.security_posture }
          assert:
            - "st == 'DRAFT'"
            - "sp == 'UNSECURED'"

      - name: item_submit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Item.DRAFT_to_SUBMITTED
          - "errors[ERR_ITEM_NOT_IN_DRAFT]"
        distinguishing_aspect: "Submitting an already-SUBMITTED (now CONTENT_REVIEW) item fails"
        test_recipe:
          setup: ["Item I in CONTENT_REVIEW status"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-INV", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-X", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { item: $.data.id, item_v: $.data.version }
            - call: "POST /api/items/${item}/submit"
              payload: { expected_item_version: "${item_v}" }
              as: ItemWriter
          trigger:
            - call: "POST /api/items/${item}/submit"
              payload: { expected_item_version: "${item_v} + 1" }
              as: ItemWriter
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ITEM_NOT_IN_DRAFT (HTTP 409) — item already past DRAFT"

      - name: item_retired_is_terminal_no_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Item
        distinguishing_aspect: "Once Item is RETIRED/REJECTED, no further transitions are possible"
        test_recipe:
          setup: ["Item I is REJECTED (via discard)"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-TERM", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-T", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              as_user_id: "w-1"
              captures: { item: $.data.id }
            - call: "POST /api/items/${item}/discard"
              payload: {}
              as: ItemWriter
              as_user_id: "w-1"
          trigger:
            - call: "POST /api/items/${item}/approve-operational"
              payload: {}
              as: Psychometrician
              captures: { err: $.data.error_id }
          assert:
            - "err in {ERR_INVALID_STATE, ERR_ITEM_NOT_IN_STATS_REVIEW} — terminal state locked"

      - name: item_update_only_in_draft_put_blocked_after_submit
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Item
          - "endpoints[PUT /api/items/{itemId}]"
        distinguishing_aspect: "PUT on a non-DRAFT item is rejected"
        test_recipe:
          setup: ["Item I is in CONTENT_REVIEW (submitted)"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-PUT", subject: "ELA", grade_level: 4, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-P", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { item: $.data.id, item_v: $.data.version }
            - call: "POST /api/items/${item}/submit"
              payload: { expected_item_version: "${item_v}" }
              as: ItemWriter
          trigger:
            - call: "PUT /api/items/${item}"
              payload: { stimulus_html: "<p>new</p>" }
              as: ItemWriter
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ITEM_NOT_IN_DRAFT (HTTP 409)"

      - name: window_open_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.FieldTestWindow
          - "errors[ERR_WINDOW_NOT_SCHEDULED]"
        distinguishing_aspect: "Re-opening an already OPEN window is rejected"
        test_recipe:
          setup: ["Window W is OPEN"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-WIN", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/field-test-windows"
              payload: { program_id: "${prog}", window_label: "W", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-31T23:59:59Z", target_sample_size: 50 }
              as: ProgramDirector
              captures: { win: $.data.id }
            - call: "POST /api/field-test-windows/${win}/open"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /api/field-test-windows/${win}/open"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_WINDOW_NOT_SCHEDULED (HTTP 409)"

      - name: session_close_before_open_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ReviewSession
          - "errors[ERR_SESSION_NOT_OPEN]"
        distinguishing_aspect: "Closing a SCHEDULED (never-opened) session is rejected"
        test_recipe:
          setup: ["Session S is SCHEDULED but not opened"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-S", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/review-committees"
              payload: { program_id: "${prog}", committee_kind: "CONTENT", name: "C", quorum_size: 2 }
              as: ProgramDirector
              captures: { cc: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-S", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { item: $.data.id }
            - call: "POST /api/review-sessions"
              payload: { committee_id: "${cc}", scheduled_at: "2026-08-01T00:00:00Z", agenda_item_ids: ["${item}"] }
              as: ProgramDirector
              captures: { sess: $.data.id }
          trigger:
            - call: "POST /api/review-sessions/${sess}/close"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "err in {ERR_SESSION_NOT_OPEN, ERR_INCOMPLETE_AGENDA, ERR_NO_QUORUM_REACHED} — cannot close a session that was never opened"

      - name: dossier_supersede_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ValidityDossier
          - "errors[ERR_DOSSIER_NOT_PUBLISHED]"
        distinguishing_aspect: "Superseding a DRAFT dossier (not yet PUBLISHED) fails"
        test_recipe:
          setup: ["Dossier D in DRAFT"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-D", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/test-blueprints"
              payload: { program_id: "${prog}", blueprint_code: "BP-D", sections: [{ strand: "S", item_count: 1, dok_min: 1, dok_max: 4 }] }
              as: TestAssembler
              captures: { bp: $.data.id }
            - call: "POST /api/test-blueprints/${bp}/lock"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/test-forms"
              payload: { blueprint_id: "${bp}", form_code: "F-D", intended_admin_date: "2026-09-01T00:00:00Z" }
              as: TestAssembler
              captures: { f: $.data.id }
            - call: "POST /api/validity-dossiers"
              payload: { program_id: "${prog}", form_id: "${f}", dossier_kind: "TECHNICAL_MANUAL", content_md: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat." }
              as: Psychometrician
              captures: { d: $.data.id }
          trigger:
            - call: "POST /api/validity-dossiers/${d}/supersede"
              payload: {}
              as: Psychometrician
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DOSSIER_NOT_PUBLISHED (HTTP 409)"

      - name: item_discard_side_effects_set_retirement_reason
        claim_type: side_effect_execution
        grounds:
          - state_machines.Item.DRAFT_to_REJECTED
        distinguishing_aspect: "Discarding a DRAFT item sets retirement_reason=MANUAL as declared side effect"
        test_recipe:
          setup: ["Item I in DRAFT"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-DSC", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-D", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              as_user_id: "w-9"
              captures: { item: $.data.id }
          trigger:
            - call: "POST /api/items/${item}/discard"
              payload: {}
              as: ItemWriter
              as_user_id: "w-9"
              captures: { rr: $.data.retirement_reason, st: $.data.status }
          assert:
            - "st == 'REJECTED'"
            - "rr == 'MANUAL'"

  # =====================================================================
  # Section: calculations — formula correctness, thresholds, rounding
  # =====================================================================
  - section: calculations
    instances:
      - name: pass_flag_fail_severe_threshold_check
        claim_type: correct_result
        grounds:
          - calculations.item_pass_flag
        distinguishing_aspect: "point_biserial < 0.10 strict produces FAIL_SEVERE regardless of p_value"
        test_recipe:
          setup: ["Item with FINAL stats: p_value=0.5, point_biserial=0.09"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-PB", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /api/item-statistics"
              payload: { stats_kind: "FINAL" }
              as: Psychometrician
          assert:
            - "pass_flag == FAIL_SEVERE"

      - name: p_value_rounding_4_decimals_half_up
        claim_type: precision
        grounds:
          - calculations.item_p_value_final
        distinguishing_aspect: "p_value rounds to 4 decimals ROUND_HALF_UP (e.g., 0.12345 -> 0.1235, not 0.1234)"
        test_recipe:
          setup: ["Responses yield a raw p_value that requires rounding at the 5th decimal"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-RND", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /api/item-statistics"
              payload: {}
              as: Psychometrician
          assert:
            - "p_value rounded to 4 decimals ROUND_HALF_UP"

      - name: point_biserial_degenerate_all_same_returns_zero
        claim_type: correct_result
        grounds:
          - calculations.item_point_biserial
        distinguishing_aspect: "When all x_r are equal (all students got same score), Pearson r is undefined — scaffold pins it to 0.0000"
        test_recipe:
          setup: ["Item where every response has raw_score=1 (ceiling)"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-DEG", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /api/item-statistics"
              payload: {}
              as: Psychometrician
          assert:
            - "point_biserial == 0.0000 (degenerate input pinned)"

      - name: quorum_accept_takes_priority_over_contested_reject
        claim_type: correct_result
        grounds:
          - calculations.session_quorum_tally
        distinguishing_aspect: "When ACCEPT >= quorum AND REJECT >= quorum simultaneously (e.g., quorum=2, 2 ACCEPT + 2 REJECT), ACCEPT wins (evaluation order: ACCEPT first)"
        test_recipe:
          setup: ["Session with quorum=2, item receives 2 ACCEPT + 2 REJECT verdicts"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-Q", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /api/review-sessions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramDirector
          assert:
            - "Item outcome == ACCEPT (content_review_outcome := PASSED)"
            - "ACCEPT branch evaluated before REJECT"

      - name: dok_section_boundary_inclusive
        claim_type: correct_result
        grounds:
          - calculations.blueprint_section_dok_range
        distinguishing_aspect: "dok_min == dok_sum == dok_max satisfies the constraint; dok_min-1 or dok_max+1 fails"
        test_recipe:
          setup: ["Blueprint with sections[0]: dok_min=4, dok_max=8; 4 items each with DOK=2 → dok_sum=8"]
          setup_api_calls:
