  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: technician_assignment_buffered_pairwise_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_TECH_DOUBLE_BOOKED]
          - state_machines.DispatchAssignment.PROPOSED_to_CONFIRMED
        distinguishing_aspect: |
          Interval semantics A on the Technician resource: pairwise half-open [start,end) overlap expanded
          by a TRAVEL_BUFFER on each side. Two windows that do NOT overlap as raw intervals (12:55 starts
          after 12:00 ends) still collide because the 30-minute buffer makes them conflict; confirm returns
          ERR_TECH_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Technician has a CONFIRMED assignment 10:00-12:00. A second job requests 12:25-14:00 (25 min after the first ends), within the 30-minute travel buffer."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-06-15T08:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/customers"
              payload: { name: "Cust BUF", service_address: "15 Hill St", credit_limit_cents: 1000000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech BUF", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_a_id: $.data.id, job_a_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_a_id}", technician_id: "${tech_id}", window_start: "2026-06-15T10:00:00.000Z", window_end: "2026-06-15T12:00:00.000Z", eta: "2026-06-15T10:15:00.000Z", expected_job_version: "${job_a_v0}" }
              as: Dispatcher
              captures: { asg_a_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_a_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "DRAIN", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_b_id: $.data.id, job_b_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_b_id}", technician_id: "${tech_id}", window_start: "2026-06-15T12:25:00.000Z", window_end: "2026-06-15T14:00:00.000Z", eta: "2026-06-15T12:30:00.000Z", expected_job_version: "${job_b_v0}" }
              as: Dispatcher
              captures: { asg_b_id: $.data.id }
          trigger:
            - call: "POST /plumbing/dispatch-assignments/${asg_b_id}/confirm"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "confirm response status code == 409"
            - "confirm response data.error_id == ERR_TECH_DOUBLE_BOOKED"
            - "DispatchAssignment.${asg_b_id}.status == PROPOSED"

      - name: inspector_daily_aggregate_capacity_full
        grounds:
          - validations[priority=10]
          - errors[ERR_INSPECTOR_CAPACITY_FULL]
          - entities.Inspector.fields.max_daily_inspections
          - state_machines.Permit.ISSUED_to_INSPECTION_SCHEDULED
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (Inspector): NOT pairwise interval overlap but
          aggregate per-DAY capacity — an inspector with max_daily_inspections=1 already holds one PENDING
          visit on 2026-06-20, so scheduling a second visit on the same date returns ERR_INSPECTOR_CAPACITY_FULL
          regardless of clock time within the day.
        test_recipe:
