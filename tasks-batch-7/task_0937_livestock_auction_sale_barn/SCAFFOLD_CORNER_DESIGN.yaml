        claim_type: Role denial
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "Rung 1 sits above every other check, so a request carrying no X-User-Role header at all returns 401 ERR_UNAUTHENTICATED even when the path resource does not exist."
        test_recipe:
          setup:
            - "One party exists; the trigger request is sent with no X-User-Role header."
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
          trigger:
            - call: "GET /sale-barn/parties/${consignor_id}"
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 401"
            - "error_id == ERR_UNAUTHENTICATED"
            - "response_type == error"

