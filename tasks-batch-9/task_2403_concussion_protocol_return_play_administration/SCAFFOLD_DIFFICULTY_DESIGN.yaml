            - *c_club_h
            - *c_club_r
            - *c_doc_h
            - *c_obs
            - *c_inc
            - *c_player
            - *c_baseline
            - *c_game
            - *c_clock_kick
            - *c_game_live
            - *c_clock_1805
            - *c_eval
            - *c_screen
            - *c_clock_1810
            - *c_exam
            - call: "POST /concussion-program/players"
              payload: { club_id: "${club_h_id}", full_name: "T Ruiz", jersey_number: 31, position: "DB" }
              as: LeagueAdmin
              captures: { player2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:35:00Z" }
              as: LeagueAdmin
            - call: "POST /concussion-program/sideline-evaluations"
              payload: { player_id: "${player2_id}", game_id: "${game_id}", trigger_source: "CLUB_MEDICAL_STAFF" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { eval2_id: $.data.id }
            - call: "POST /concussion-program/sideline-evaluations/${eval2_id}/screen"
              payload: { no_go_signs: [], symptom_score: 5 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:40:00Z" }
              as: LeagueAdmin
          trigger:
            - call: "POST /concussion-program/sideline-evaluations/${eval2_id}/locker-room-exam"
              payload: { inc_clinician_id: "${obs_id}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:40:01Z" }
              as: LeagueAdmin
            - call: "POST /concussion-program/sideline-evaluations/${eval2_id}/locker-room-exam"
              payload: { inc_clinician_id: "${obs_id}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "SidelineEvaluation.${eval_id}.inc_block_ends_at == 2026-09-13T18:40:00.000Z"
            - "trigger at 18:40:00Z: response status 409 with error_id ERR_INC_EXAM_WINDOW_CONFLICT"
            - "trigger at 18:40:00Z: SidelineEvaluation.${eval2_id}.status == SCREENED and inc_clinician_id == null"
            - "trigger at 18:40:01Z: response status 200, SidelineEvaluation.${eval2_id}.status == LOCKER_ROOM_EXAM"
            - "trigger at 18:40:01Z: exam_started_at == 2026-09-13T18:40:01.000Z and inc_block_ends_at == 2026-09-13T19:10:01.000Z"

  - rule_id: compensating_invariant
    instances:
      - name: dismissed_audit_vacates_club_fine_ledger_without_drift
        grounds:
          - calculations.club_compliance_score
          - state_machines.ProtocolAudit.FINDINGS_ISSUED_to_CLOSED_DISMISSED
          - entities.Club.fields.outstanding_fine_cents
          - entities.Club.fields.open_violation_count
        distinguishing_aspect: |
          The conserved quantity is MONEY: Club.outstanding_fine_cents must always equal the sum of
          assessed_fine_cents over counted audits, so vacating the 2250000 audit takes the ledger from
          17250000 back to exactly 15000000 - not to 0 and not leaving 2250000 of drift - while the
          upheld audit's own 15000000 survives its closure.
        test_recipe:
          setup:
            - "One club, no case"
            - "Audit A FINDINGS_ISSUED for MISSED_MANDATORY_REMOVAL, fine 15000000, club score 82, TIER_1"
            - "Audit B FINDINGS_ISSUED for LATE_INJURY_REPORT priced at the stamped TIER_1, fine 2250000, club score 76"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
              captures: { audit_a_id: $.data.id }
            - call: "POST /concussion-program/protocol-audits/${audit_a_id}/findings"
              payload: { violation_codes: ["MISSED_MANDATORY_REMOVAL"], exposure_days: 0 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
            - call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
              captures: { audit_b_id: $.data.id }
            - call: "POST /concussion-program/protocol-audits/${audit_b_id}/findings"
              payload: { violation_codes: ["LATE_INJURY_REPORT"], exposure_days: 0 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
          trigger:
            - call: "POST /concussion-program/protocol-audits/${audit_b_id}/close"
              payload: { disposition: "DISMISSED", closing_note: "report was filed on time, portal timestamp corrected" }
              as: LeagueAuditor
              as_user_id: "auditor-c"
            - call: "POST /concussion-program/protocol-audits/${audit_a_id}/close"
              payload: { disposition: "UPHELD" }
              as: LeagueAuditor
              as_user_id: "auditor-c"
          assert:
            - "before triggers: ProtocolAudit.${audit_b_id}.escalation_tier_at_issuance == TIER_1 and assessed_fine_cents == 2250000"
            - "before triggers: Club.${club_h_id}.outstanding_fine_cents == 17250000, compliance_score == 76, open_violation_count == 2"
            - "after DISMISSED: ProtocolAudit.${audit_b_id}.assessed_fine_cents == 0 and disposition == DISMISSED"
            - "after DISMISSED: Club.${club_h_id}.outstanding_fine_cents == 15000000, compliance_score == 82, escalation_tier == TIER_1, status == PROBATION, open_violation_count == 1"
            - "after UPHELD: ProtocolAudit.${audit_a_id}.assessed_fine_cents == 15000000"
            - "after UPHELD: Club.${club_h_id}.outstanding_fine_cents == 15000000, compliance_score == 82, adjudicated_compliance_score == 82, open_violation_count == 0"
            - "at every observation Club.outstanding_fine_cents equals the sum of assessed_fine_cents over the club's FINDINGS_ISSUED, CLUB_RESPONDED and CLOSED_UPHELD audits"

      - name: exemption_release_conserves_club_slot_pool
        grounds:
          - calculations.exemption_slot_ledger
          - entities.Club.fields.exemption_slots_used
          - entities.Club.fields.exemption_slots_available
          - state_machines.ConcussionCase.PENDING_INC_CLEARANCE_to_CLEARED_FOR_CONTACT
        distinguishing_aspect: |
          The conserved quantity is a COUNT of roster slots, not money: exemption_slots_used +
          exemption_slots_available equals exemption_slots_total (3) at every observation, and the
          return to contact compensates the earlier grant by moving the case to RELEASED and returning
          the slot (used 1 / available 2 becomes used 0 / available 3).
        test_recipe:
          setup:
            - "Harbor City with exemption_slots_total 3"
            - "The canonical case granted a roster exemption by the club compliance officer right after diagnosis"
            - "All five stages passed, a baseline retest on file, and an APPROVED consultant clearance"
            - "Logical clock 2026-09-28T12:00:00Z, exactly earliest_return_at"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - *c_club_r
            - *c_doc_h
            - *c_obs
            - *c_inc
            - *c_player
            - *c_baseline
            - *c_game
            - *c_clock_kick
            - *c_game_live
            - *c_clock_1805
            - *c_eval
            - *c_screen
            - *c_clock_1810
            - *c_exam
            - *c_clock_1819
            - *c_diagnose
            - call: "POST /concussion-program/concussion-cases/${case_id}/roster-exemption"
              as: ClubComplianceOfficer
              as_user_id: "${club_h_id}"
            - *c_clock_0915
            - *c_step1
            - *c_clock_0916
            - *c_pass1
            - *c_clock_0917
            - *c_step2
            - *c_clock_0918
            - *c_pass2
            - *c_clock_0919
            - *c_step3
            - *c_clock_0920
            - *c_pass3
            - *c_clock_0921
            - *c_step4
            - *c_clock_0923
            - *c_pass4
            - *c_clock_0925
            - *c_step5
            - *c_clock_0927
            - *c_pass5
            - *c_get_player_v2
            - *c_retest
            - *c_get_case_v
            - *c_request_inc
            - &c_approve_inc
              call: "POST /concussion-program/inc-clearances/${clearance_id}/decide"
              payload: { decision: "APPROVED", decision_notes: "asymptomatic, neurocognitive scores back to baseline" }
              as: IndependentConsultant
              as_user_id: "${inc_id}"
            - &c_clock_0928
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-28T12:00:00Z" }
              as: LeagueAdmin
          trigger:
            - call: "POST /concussion-program/concussion-cases/${case_id}/return-to-contact"
              payload: { documentation_note: "full clearance, unrestricted contact" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "before trigger: ConcussionCase.${case_id}.roster_exemption_status == GRANTED"
            - "before trigger: Club.${club_h_id}.exemption_slots_used == 1, exemption_slots_available == 2, exemption_slots_total == 3"
            - "before trigger: IncClearance.${clearance_id}.status == APPROVED and expires_at == 2026-10-04T12:00:00.000Z"
            - "after trigger: ConcussionCase.${case_id}.case_status == CLEARED_FOR_CONTACT and returned_to_contact_at == 2026-09-28T12:00:00.000Z"
            - "after trigger: ConcussionCase.${case_id}.roster_exemption_status == RELEASED"
            - "after trigger: Club.${club_h_id}.exemption_slots_used == 0, exemption_slots_available == 3, exemption_slots_total == 3"
            - "after trigger: Player.${player_id}.availability_status == AVAILABLE and public_injury_designation == NONE"
            - "exemption_slots_used + exemption_slots_available == exemption_slots_total at every observation"
