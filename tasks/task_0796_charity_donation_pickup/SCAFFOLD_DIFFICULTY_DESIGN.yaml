        grounds:
          - validations[priority=14]
          - errors[ERR_STOP_SLOT_CONFLICT]
          - entities.RouteStop.fields.slot_start
          - entities.RouteStop.fields.slot_end
        distinguishing_aspect: |
          A second stop at [10:40,11:00) is rejected against an existing [10:00,10:30) stop because the 10-minute
          gap is under TRAVEL_BUFFER_MIN (15) even though the raw intervals do not overlap — buffered-interval
          semantics on the Route resource, distinct from the route window's half-open adjacency.
        test_recipe:
          setup:
            - "Partner accepts FURNITURE; vehicle capacity 300; route OPENED."
            - "reqA (DONATION, item volume 20) scheduled at [10:00,10:30); route version re-read; reqB (item volume 20) prepared."
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "BufCo", region_code: "CA-BAY", tax_id: "EIN-16", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "T16", capacity_cf: 300, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "d16@x.com", full_name: "D Sixteen", address: "16 A St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "16 A St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { reqA_id: $.data.id }
            - call: "POST /pickup-requests/${reqA_id}/items"
              payload: { category: "FURNITURE", volume_cf: 20, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${reqA_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "GET /routes/${route_id}"
              payload: {}
              as: Dispatcher
              captures: { route_v2: $.data.version }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "16 A St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { reqB_id: $.data.id }
            - call: "POST /pickup-requests/${reqB_id}/items"
              payload: { category: "FURNITURE", volume_cf: 20, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "POST /pickup-requests/${reqB_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:40:00Z", slot_end: "2026-03-15T11:00:00Z", expected_route_version: "${route_v2}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STOP_SLOT_CONFLICT"

  # ================================================================
  - rule_id: compensating_invariant
    instances:
      - name: route_reserved_volume_conserved_schedule_cancel
        grounds:
          - calculations.route_reserved_volume
          - state_machines.PickupRequest.REQUESTED_to_SCHEDULED
          - state_machines.PickupRequest.SCHEDULED_to_CANCELLED
          - entities.Route.fields.reserved_volume_cf
        distinguishing_aspect: |
          Route.reserved_volume_cf returns to its pre-schedule value 0 after schedule (+40) then cancel (-40); the
          conserved quantity is cubic-feet volume, pinned as sum of RESERVED stops' reserved_volume_cf.
        test_recipe:
          setup:
            - "Partner accepts FURNITURE; vehicle capacity 200; route OPENED (reserved 0)."
            - "DONATION request item volume 40 scheduled -> reserved 40."
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "ConsVol", region_code: "CA-BAY", tax_id: "EIN-17", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
