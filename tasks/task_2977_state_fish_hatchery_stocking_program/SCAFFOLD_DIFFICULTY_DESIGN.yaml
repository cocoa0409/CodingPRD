# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2977_state_fish_hatchery_stocking_program
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1–§1.7.
# Deleting this file would leave the declared behaviour identical.
#
# The base production chain is anchored once (in rule dual_variant_calc,
# instance fcr_biological_vs_economic_diverge_on_same_lot) and re-used by later
# instances through YAML aliases, so every instance replays the same reachable
# state. Anchor names read as k_<step>. All literals below were computed with
# code against the §1.3 formulas and their constants.
#
# Base chain state after the last anchor (k_release1):
#   Hatchery SLVC: rearing_capacity_lbs 2000.0, annual_water_right_af 120.0,
#     oxygen_supply_lpm 6.0, tss_permit_limit_mg_l 20.0,
#     annual_budget_cents 50000000
#   RearingLot: initial_count 20000, initial_biomass_lbs 4.41
#   Logical clock starts at 2026-08-01T00:00:00Z (the §1.5 default)
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fcr_biological_vs_economic_diverge_on_same_lot
        grounds:
          - calculations.feed_conversion_ratio
          - entities.RearingLot.fields.fcr_biological
          - entities.RearingLot.fields.fcr_economic
          - entities.RearingLot.fields.cumulative_mortality_biomass_lbs
          - endpoints.POST /rearing-lots/{id}/feedings
        distinguishing_aspect: |
          This instance lives in the RearingLot husbandry domain: the two variants
          differ only in whether the pounds lost to mortality are credited as
          production, so ECONOMIC (0.991) is strictly lower than BIOLOGICAL (1.128)
          on the same feeding row, and both are stored side by side on the lot.
        test_recipe:
          setup:
            - "One hatchery SLVC with rearing_capacity_lbs 2000.0 and posture OPEN"
            - "One brood group in status SPAWNING inside its window"
            - "One RearingLot created by a take of 20000 eggs, so initial_biomass_lbs is 4.41"
            - "The lot has already recorded one feeding (300.0 lbs of feed, 2000 dead, mean weight 4.53592 g), leaving count_on_hand 18000, biomass_lbs 180.00 and cumulative_mortality_biomass_lbs 20.00"
            - "The lot has been advanced to FINGERLING and the clock stands at 2026-08-20T00:00:00Z"
          setup_api_calls:
            - &k_clock_0801
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - &k_hatch
              call: "POST /hatcheries"
              payload:
                name: "Silver Creek Hatchery"
                station_code: "SLVC"
                water_source_type: "SPRING"
                annual_water_right_af: 120.0
                rearing_capacity_lbs: 2000.0
                oxygen_supply_lpm: 6.0
                effluent_permit_number: "CO-0044821"
                tss_permit_limit_mg_l: 20.0
                annual_budget_cents: 50000000
              as: ProgramAdmin
              captures: { hatch_id: $.data.id }
            - &k_water_a
              call: "POST /waters"
              payload:
                name: "Blue Mesa Reservoir"
                county: "Gunnison"
                water_class: "COLDWATER_LAKE"
                habitat_suitability_score: 80
                angler_demand_index: 90
                plan_species: "RAINBOW_TROUT"
                plan_target_count: 2000
                access_type: "PUBLIC_BOAT"
              as: ProgramAdmin
              captures: { water_a_id: $.data.id }
            - &k_truck1
              call: "POST /transport-units"
              payload:
                hatchery_id: "${hatch_id}"
                unit_code: "TRK-01"
                tank_gallons: 500.0
                max_load_lbs: 300.0
                oxygen_lpm: 12.0
                certification_expires_at: "2027-01-01T00:00:00Z"
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { truck1_id: $.data.id }
            - &k_brood
              call: "POST /brood-stocks"
              payload:
                hatchery_id: "${hatch_id}"
                species: "RAINBOW_TROUT"
                strain: "Hofer"
                female_count: 400
                male_count: 200
                expected_fecundity_per_female: 3000
                spawning_window_start: "2026-08-01T00:00:00Z"
                spawning_window_end: "2026-10-31T00:00:00Z"
                egg_take_target: 120000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { brood_id: $.data.id }
            - &k_open
              call: "POST /brood-stocks/${brood_id}/open-spawning-window"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &k_spawn1
              call: "POST /spawn-events"
              payload:
                brood_stock_id: "${brood_id}"
                planned_take_date: "2026-08-10T00:00:00Z"
                females_spawned: 20
                target_release_count: 15000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { spawn1_id: $.data.id }
            - &k_clock_0810
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - &k_take1
              call: "POST /spawn-events/${spawn1_id}/record-take"
              payload: { eggs_taken: 20000, taken_at: "2026-08-10T00:00:00Z" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &k_lot
              call: "GET /rearing-lots?spawn_event_id=${spawn1_id}"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { lot_id: "$.data[0].id" }
            - &k_feed1
              call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-10T00:00:00Z", feed_lbs: 300.0, avg_weight_g_after: 4.53592, mortality_count: 2000 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &k_adv_fry
              call: "POST /rearing-lots/${lot_id}/advance-stage"
              payload: { to_stage: "FRY" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &k_adv_fing
              call: "POST /rearing-lots/${lot_id}/advance-stage"
              payload: { to_stage: "FINGERLING" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &k_clock_0820
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - &k_feed2
              call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-20T00:00:00Z", feed_lbs: 1500.0, avg_weight_g_after: 45.3592, mortality_count: 2000 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "RearingLot.${lot_id}.count_on_hand == 16000"
            - "RearingLot.${lot_id}.biomass_lbs == 1600.00"
            - "RearingLot.${lot_id}.cumulative_feed_lbs == 1800.0"
            - "RearingLot.${lot_id}.cumulative_mortality_biomass_lbs == 220.00"
            - "RearingLot.${lot_id}.fcr_biological == 1.128"
            - "RearingLot.${lot_id}.fcr_economic == 0.991"
            - "RearingLot.${lot_id}.fcr_economic < RearingLot.${lot_id}.fcr_biological"
            - "RearingLot.${lot_id}.growth_rate_g_per_day == 4.0823"
            - "Hatchery.${hatch_id}.biomass_on_hand_lbs == 1600.00 and Hatchery.${hatch_id}.density_index == 0.8000"
            - "Hatchery.${hatch_id}.operating_posture == OPEN"

      - name: contribution_cohort_vs_harvest_diverge_on_same_release
        grounds:
          - calculations.contribution_index
          - entities.StockingEvent.fields.contribution_index_cohort
          - entities.StockingEvent.fields.contribution_index_harvest
          - entities.StockingEvent.fields.effective_marked_count
          - endpoints.POST /stocking-events/{id}/recoveries
        distinguishing_aspect: |
          This instance lives in the StockingEvent fisheries-evaluation domain, a
          different entity domain from the RearingLot husbandry instance: COHORT
          divides recoveries by the marks that survived tagging (57 / 1900 =
          0.0300) while HARVEST expands the creel census over every fish released
          ((57 / 0.25) / 2380 = 0.0958), so the same recovery data yields two
          different indices on one row.
        test_recipe:
          setup:
            - "The base chain through the second feeding, so the lot carries 16000 YEARLING fish at 45.3592 g"
            - "The lot holds a health certificate signed by a second veterinarian, valid to 2026-09-24T00:00:00Z"
            - "Request R1 for 2400 YEARLING RAINBOW_TROUT on Blue Mesa is ALLOCATED 2400 by plan P1"
            - "StockingEvent E1 has been created, loaded at 12.0 degrees C and released with 20 transport mortalities, so released_count is 2380 and marked_count is 2000 with mark_type CWT"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - &k_adv_year
              call: "POST /rearing-lots/${lot_id}/advance-stage"
              payload: { to_stage: "YEARLING" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &k_clock_0825
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: ProgramAdmin
            - &k_insp1
              call: "POST /health-inspections"
              payload: { lot_id: "${lot_id}", inspection_type: "PRE_TRANSFER", sample_size: 60, sampled_at: "2026-08-25T00:00:00Z" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
              captures: { insp1_id: $.data.id }
            - &k_res_neg
              call: "POST /health-inspections/${insp1_id}/record-result"
              payload: { result: "NEGATIVE" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
            - &k_certify
              call: "POST /health-inspections/${insp1_id}/certify"
              payload: {}
              as: FishHealthVeterinarian
              as_user_id: "vet-bruno"
            - &k_req1
              call: "POST /stocking-requests"
              payload:
                water_id: "${water_a_id}"
                species: "RAINBOW_TROUT"
                requested_count: 2400
                size_class: "YEARLING"
                justification: "Opening-day put-and-take fishery on Blue Mesa"
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { req1_id: $.data.id }
            - &k_plan1
              call: "POST /allocation-plans"
              payload:
                hatchery_id: "${hatch_id}"
                fiscal_year: 2027
                species: "RAINBOW_TROUT"
                size_class: "YEARLING"
                available_count: 5000
                public_request_cap_pct: 0.20
                allocation_mode: "PRIORITY_WATERFALL"
              as: ProgramAdmin
              captures: { plan1_id: $.data.id, plan1_v0: $.data.version }
            - &k_attach1
              call: "POST /stocking-requests/${req1_id}/attach-to-plan"
              payload: { allocation_plan_id: "${plan1_id}", expected_plan_version: "${plan1_v0}" }
              as: RegionalBiologist
              as_user_id: "bio-carla"
            - &k_plan_v1
              call: "GET /allocation-plans/${plan1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { plan1_v1: $.data.version }
            - &k_run1
              call: "POST /allocation-plans/${plan1_id}/run"
              payload: { expected_plan_version: "${plan1_v1}" }
              as: ProgramAdmin
            - &k_clock_0901
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - &k_lot_v
              call: "GET /rearing-lots/${lot_id}"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { lot_v1: $.data.version }
            - &k_event1
              call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req1_id}"
                lot_id: "${lot_id}"
                transport_unit_id: "${truck1_id}"
                fish_count: 2400
                scheduled_depart_at: "2026-09-01T08:00:00Z"
                scheduled_return_at: "2026-09-01T14:00:00Z"
                expected_lot_version: "${lot_v1}"
                mark_type: "CWT"
                marked_count: 2000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { event1_id: $.data.id }
            - &k_load1
              call: "POST /stocking-events/${event1_id}/load"
              payload: { loaded_at: "2026-09-01T08:00:00Z", load_water_temp_c: 12.0, measured_load_lbs: 240.0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - &k_release1
              call: "POST /stocking-events/${event1_id}/release"
              payload: { arrived_at: "2026-09-01T11:00:00Z", site_water_temp_c: 4.5, tempering_minutes: 48, transport_mortality_count: 20 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          trigger:
            - call: "POST /stocking-events/${event1_id}/recoveries"
              payload: { recovered_count: 57, creel_sample_fraction: 0.25 }
              as: RegionalBiologist
              as_user_id: "bio-carla"
          assert:
            - "StockingEvent.${event1_id}.released_count == 2380"
            - "StockingEvent.${event1_id}.effective_marked_count == 1900"
            - "StockingEvent.${event1_id}.contribution_index_cohort == 0.0300"
            - "StockingEvent.${event1_id}.contribution_index_harvest == 0.0958"
            - "StockingEvent.${event1_id}.contribution_index_harvest != StockingEvent.${event1_id}.contribution_index_cohort"
            - "StockingEvent.${event1_id}.status == RELEASED"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: transport_load_plan_volume_limit_binds_over_oxygen_and_payload
        grounds:
          - calculations.transport_load_plan
          - entities.StockingEvent.fields.max_fish_allowed
          - entities.StockingEvent.fields.oxygen_flow_lpm
          - endpoints.POST /stocking-events/{id}/load
        distinguishing_aspect: |
          Mode (a) — multi-input selection: three independently computed ceilings
          (volume 250.00 lbs, oxygen 800.00 lbs, rated payload 300.0 lbs) are
          reduced by a min, and the answer 2500 fish proves the volume term won.
          Neither of the other two terms could produce 2500, so a wrong min
          argument or a dropped term changes the number.
        test_recipe:
          setup:
            - "The base chain through event creation: lot at avg_weight_g 45.3592, truck TRK-01 with tank_gallons 500.0, max_load_lbs 300.0 and oxygen_lpm 12.0"
            - "StockingEvent E1 is SCHEDULED for 2400 fish with planned_load_lbs 240.00"
            - "The clock stands at 2026-09-01T08:00:00Z and the lot is CERTIFIED to 2026-09-24T00:00:00Z"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0901
            - *k_lot_v
            - *k_event1
          trigger:
            - *k_load1
          assert:
            - "StockingEvent.${event1_id}.status == IN_TRANSIT"
            - "StockingEvent.${event1_id}.max_fish_allowed == 2500"
            - "StockingEvent.${event1_id}.planned_load_lbs == 240.00"
            - "StockingEvent.${event1_id}.oxygen_flow_lpm == 3.600"
            - "StockingEvent.${event1_id}.transport_cost_cents == 81000"
            - "TransportUnit.${truck1_id}.status == IN_USE and TransportUnit.${truck1_id}.current_event_id == ${event1_id}"

      - name: allocation_waterfall_rounds_to_unit_before_decrementing_pool
        grounds:
          - calculations.allocation_grant
          - entities.AllocationPlan.fields.allocated_total_count
          - entities.AllocationPlan.fields.unmet_demand_count
          - entities.AllocationPlan.fields.public_allocated_count
          - endpoints.POST /allocation-plans/{id}/run
        distinguishing_aspect: |
          Mode (b) — order-dependent sequential accumulation: three grants are
          resolved against one shrinking pool, and the whole-unit floor is applied
          BEFORE the decrement, so request A's 15 rounded-away fish stay in the
          pool and C can still be granted 175. A pool decremented by the unrounded
          640 would leave C with 150, and a public sub-pool applied after the floor
          would give B 300.
        test_recipe:
          setup:
            - "One hatchery GLDN (no production needed — the run only reads the queue)"
            - "Three ACTIVE waters, all with plan_target_count 2000 and zero counters: P1 habitat 80 / demand 90 / PUBLIC_BOAT, P2 habitat 60 / demand 100 / REMOTE, P3 habitat 55 / demand 40 / PUBLIC_BOAT"
            - "Three RAINBOW_TROUT YEARLING requests: A 640 by a RegionalBiologist on P1 (priority_score 97.50), B 300 by a PublicRequester on P2 (priority_score 70.60), C 210 by a RegionalBiologist on P3 (priority_score 68.75)"
            - "AllocationPlan P with available_count 1000, public_request_cap_pct 0.20 and allocation_mode PRIORITY_WATERFALL, all three requests QUEUED on it"
          setup_api_calls:
            - *k_clock_0801
            - &k_hatch2
              call: "POST /hatcheries"
              payload:
                name: "Golden Springs Hatchery"
                station_code: "GLDN"
                water_source_type: "WELL"
                annual_water_right_af: 200.0
                rearing_capacity_lbs: 5000.0
                oxygen_supply_lpm: 40.0
                effluent_permit_number: "CO-0044822"
                tss_permit_limit_mg_l: 20.0
                annual_budget_cents: 90000000
              as: ProgramAdmin
              captures: { hatch2_id: $.data.id }
            - &k_water_p1
              call: "POST /waters"
              payload:
                name: "Antero Reservoir"
                county: "Park"
                water_class: "COLDWATER_LAKE"
                habitat_suitability_score: 80
                angler_demand_index: 90
                plan_species: "RAINBOW_TROUT"
                plan_target_count: 2000
                access_type: "PUBLIC_BOAT"
              as: ProgramAdmin
              captures: { water_p1_id: $.data.id }
            - &k_water_p2
              call: "POST /waters"
              payload:
                name: "Lost Creek Beaver Ponds"
                county: "Park"
                water_class: "COLDWATER_STREAM"
                habitat_suitability_score: 60
                angler_demand_index: 100
                plan_species: "RAINBOW_TROUT"
                plan_target_count: 2000
                access_type: "REMOTE"
              as: ProgramAdmin
              captures: { water_p2_id: $.data.id }
            - &k_water_p3
              call: "POST /waters"
              payload:
                name: "Tarryall Creek"
                county: "Park"
                water_class: "COLDWATER_STREAM"
                habitat_suitability_score: 55
                angler_demand_index: 40
                plan_species: "RAINBOW_TROUT"
                plan_target_count: 2000
                access_type: "PUBLIC_BOAT"
              as: ProgramAdmin
              captures: { water_p3_id: $.data.id }
            - &k_req_a
              call: "POST /stocking-requests"
              payload:
                water_id: "${water_p1_id}"
                species: "RAINBOW_TROUT"
                requested_count: 640
                size_class: "YEARLING"
                justification: "Antero opener, plan target unmet"
              as: RegionalBiologist
              as_user_id: "bio-dana"
              captures: { req_a_id: $.data.id }
            - &k_req_b
              call: "POST /stocking-requests"
              payload:
                water_id: "${water_p2_id}"
                species: "RAINBOW_TROUT"
                requested_count: 300
                size_class: "YEARLING"
                justification: "Backcountry pond, public petition"
              as: PublicRequester
              as_user_id: "pub-erin"
              captures: { req_b_id: $.data.id }
            - &k_req_c
              call: "POST /stocking-requests"
              payload:
                water_id: "${water_p3_id}"
                species: "RAINBOW_TROUT"
                requested_count: 210
                size_class: "YEARLING"
                justification: "Tarryall put-and-grow supplement"
              as: RegionalBiologist
              as_user_id: "bio-frank"
              captures: { req_c_id: $.data.id }
            - &k_plan2
              call: "POST /allocation-plans"
              payload:
                hatchery_id: "${hatch2_id}"
                fiscal_year: 2027
                species: "RAINBOW_TROUT"
                size_class: "YEARLING"
                available_count: 1000
                public_request_cap_pct: 0.20
                allocation_mode: "PRIORITY_WATERFALL"
              as: ProgramAdmin
              captures: { plan2_id: $.data.id, plan2_v0: $.data.version }
            - &k_attach_a
              call: "POST /stocking-requests/${req_a_id}/attach-to-plan"
              payload: { allocation_plan_id: "${plan2_id}", expected_plan_version: "${plan2_v0}" }
              as: ProgramAdmin
            - &k_plan2_v1
              call: "GET /allocation-plans/${plan2_id}"
              payload: {}
              as: ProgramAdmin
              captures: { plan2_v1: $.data.version }
            - &k_attach_b
              call: "POST /stocking-requests/${req_b_id}/attach-to-plan"
              payload: { allocation_plan_id: "${plan2_id}", expected_plan_version: "${plan2_v1}" }
              as: ProgramAdmin
            - &k_plan2_v2
              call: "GET /allocation-plans/${plan2_id}"
              payload: {}
              as: ProgramAdmin
              captures: { plan2_v2: $.data.version }
            - &k_attach_c
              call: "POST /stocking-requests/${req_c_id}/attach-to-plan"
              payload: { allocation_plan_id: "${plan2_id}", expected_plan_version: "${plan2_v2}" }
              as: ProgramAdmin
            - &k_plan2_v3
              call: "GET /allocation-plans/${plan2_id}"
              payload: {}
              as: ProgramAdmin
              captures: { plan2_v3: $.data.version }
          trigger:
            - call: "POST /allocation-plans/${plan2_id}/run"
              payload: { expected_plan_version: "${plan2_v3}" }
              as: ProgramAdmin
          assert:
            - "StockingRequest.${req_a_id}.priority_score == 97.50 and StockingRequest.${req_a_id}.allocated_count == 625 and StockingRequest.${req_a_id}.status == ALLOCATED"
            - "StockingRequest.${req_b_id}.priority_score == 70.60 and StockingRequest.${req_b_id}.allocated_count == 200 and StockingRequest.${req_b_id}.status == ALLOCATED"
            - "StockingRequest.${req_c_id}.priority_score == 68.75 and StockingRequest.${req_c_id}.allocated_count == 175 and StockingRequest.${req_c_id}.status == ALLOCATED"
            - "AllocationPlan.${plan2_id}.allocated_total_count == 1000"
            - "AllocationPlan.${plan2_id}.unmet_demand_count == 150"
            - "AllocationPlan.${plan2_id}.public_allocated_count == 200"
            - "AllocationPlan.${plan2_id}.status == ALLOCATED and AllocationPlan.${plan2_id}.run_count == 1"
            - "Water.${water_p1_id}.allocated_count_ytd == 625 and Water.${water_p1_id}.plan_shortfall_count == 1375"

      - name: proportional_mode_leaves_rounding_remainder_unallocated
        grounds:
          - calculations.allocation_grant
          - entities.AllocationPlan.fields.allocation_mode
          - entities.AllocationPlan.fields.allocated_total_count
          - endpoints.POST /allocation-plans/{id}/run
        distinguishing_aspect: |
          Mode (b) again but with the selector flipped: the same three requests and
          the same 1000-fish pool now yield 550 / 200 / 175 = 925, because each
          grant is capped at its pro-rata share of the ORIGINAL pool and the
          75-fish remainder is deliberately not redistributed. A run that reused
          the waterfall's shrinking-pool logic would produce 1000.
        test_recipe:
          setup:
            - "Identical to the waterfall instance — hatchery GLDN, waters P1/P2/P3, requests A 640 BIOLOGIST, B 300 PUBLIC, C 210 BIOLOGIST"
            - "The only difference is AllocationPlan.allocation_mode == PROPORTIONAL; sum of requested_count is 1150"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch2
            - *k_water_p1
            - *k_water_p2
            - *k_water_p3
            - *k_req_a
            - *k_req_b
            - *k_req_c
            - call: "POST /allocation-plans"
              payload:
                hatchery_id: "${hatch2_id}"
                fiscal_year: 2027
                species: "RAINBOW_TROUT"
                size_class: "YEARLING"
                available_count: 1000
                public_request_cap_pct: 0.20
                allocation_mode: "PROPORTIONAL"
              as: ProgramAdmin
              captures: { plan2_id: $.data.id, plan2_v0: $.data.version }
            - *k_attach_a
            - *k_plan2_v1
            - *k_attach_b
            - *k_plan2_v2
            - *k_attach_c
            - *k_plan2_v3
          trigger:
            - call: "POST /allocation-plans/${plan2_id}/run"
              payload: { expected_plan_version: "${plan2_v3}" }
              as: ProgramAdmin
          assert:
            - "StockingRequest.${req_a_id}.allocated_count == 550"
            - "StockingRequest.${req_b_id}.allocated_count == 200"
            - "StockingRequest.${req_c_id}.allocated_count == 175"
            - "AllocationPlan.${plan2_id}.allocated_total_count == 925"
            - "AllocationPlan.${plan2_id}.unmet_demand_count == 225"
            - "AllocationPlan.${plan2_id}.public_allocated_count == 200"
            - "AllocationPlan.${plan2_id}.status == ALLOCATED"

      - name: egg_projection_derate_tier_read_from_stored_density
        grounds:
          - calculations.egg_take_projection
          - entities.SpawnEvent.fields.cumulative_survival
          - entities.SpawnEvent.fields.required_eggs_for_target
          - entities.SpawnEvent.fields.projected_release_count
          - endpoints.POST /spawn-events
        distinguishing_aspect: |
          Mode (c) — conditional tier selection from stored state: the survival
          chain 0.80 * 0.90 * 0.95 is multiplied by a derate chosen from the
          hatchery's density_index AS IT ALREADY STANDS (0.8000 → MID 0.95), so
          cumulative_survival is 0.6498 rather than the 0.6840 the same call would
          produce on an empty station. The tier is read, never recomputed from the
          incoming eggs.
        test_recipe:
          setup:
            - "The base chain through the second feeding, so Hatchery.density_index is exactly 0.8000 and the station is still OPEN"
            - "BroodStock SLVC-Hofer is still SPAWNING with females_available 380 and water_available_af 119.0"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
          trigger:
            - call: "POST /spawn-events"
              payload:
                brood_stock_id: "${brood_id}"
                planned_take_date: "2026-09-15T00:00:00Z"
                females_spawned: 20
                target_release_count: 15000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { spawn2_id: $.data.id }
          assert:
            - "Hatchery.${hatch_id}.density_index == 0.8000 and Hatchery.${hatch_id}.operating_posture == OPEN"
            - "SpawnEvent.${spawn2_id}.planned_eggs == 60000"
            - "SpawnEvent.${spawn2_id}.cumulative_survival == 0.6498"
            - "SpawnEvent.${spawn2_id}.required_eggs_for_target == 23085"
            - "SpawnEvent.${spawn2_id}.projected_release_count == 38988"
            - "SpawnEvent.${spawn2_id}.water_reserved_af == 3.0000"
            - "BroodStock.${brood_id}.females_reserved == 20 and BroodStock.${brood_id}.females_available == 360"
            - "Hatchery.${hatch_id}.water_reserved_af == 3.0000 and Hatchery.${hatch_id}.water_available_af == 116.0000"

  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: rearing_lot_stage_and_health_dimensions_move_independently
        grounds:
          - state_machines.RearingLot.health CERTIFIED_to_health UNDER_INSPECTION
          - entities.RearingLot.fields.rearing_stage
          - entities.RearingLot.fields.health_status
          - endpoints.POST /health-inspections
          - endpoints.POST /rearing-lots/{id}/feedings
        distinguishing_aspect: |
          PARALLEL shape: one row carries two orthogonal dimensions, so opening a
          re-inspection moves health_status CERTIFIED → UNDER_INSPECTION and nulls
          the certificate while rearing_stage stays YEARLING, and a feeding taken
          while the health dimension sits in UNDER_INSPECTION still lands on the
          growth dimension. An implementation with a single status column cannot
          hold both facts at once.
        test_recipe:
          setup:
            - "The base chain through certification: the lot is at rearing_stage YEARLING and health_status CERTIFIED with certificate_expires_at 2026-09-24T00:00:00Z"
            - "Inspection I1 is CERTIFIED and no inspection on the lot is SAMPLED or RETEST_DUE"
            - "The clock stands at 2026-08-25T00:00:00Z"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
          trigger:
            - call: "POST /health-inspections"
              payload: { lot_id: "${lot_id}", inspection_type: "ROUTINE", sample_size: 30, sampled_at: "2026-08-25T00:00:00Z" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
              captures: { insp2_id: $.data.id }
            - call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-25T00:00:00Z", feed_lbs: 10.0, avg_weight_g_after: 45.3592, mortality_count: 0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HealthInspection.${insp2_id}.status == SAMPLED"
            - "HealthInspection.${insp1_id}.status == CERTIFIED (the historical certificate row is untouched)"
            - "RearingLot.${lot_id}.health_status == UNDER_INSPECTION"
            - "RearingLot.${lot_id}.certificate_expires_at == null"
            - "RearingLot.${lot_id}.rearing_stage == YEARLING (the growth dimension did not move)"
            - "RearingLot.${lot_id}.cumulative_feed_lbs == 1810.0"
            - "RearingLot.${lot_id}.count_on_hand == 16000 and RearingLot.${lot_id}.biomass_lbs == 1600.00"
            - "RearingLot.${lot_id}.growth_rate_g_per_day == 0.0000"

      - name: inspection_retest_cycle_escalates_on_third_positive
        grounds:
          - state_machines.HealthInspection.RETEST_DUE_to_FAILED_REPORTABLE
          - entities.HealthInspection.fields.retest_count
          - entities.HealthInspection.fields.escalated_from_retests
          - endpoints.POST /health-inspections/{id}/record-treatment
        distinguishing_aspect: |
          CYCLIC shape with a bounded loop: FAILED_TREATABLE → RETEST_DUE →
          FAILED_TREATABLE is legal while retest_count < MAX_RETESTS, but the third
          POSITIVE_TREATABLE result — the identical payload that cycled twice —
          escalates to FAILED_REPORTABLE with escalated_from_retests true and
          quarantines the lot. The loop counter, not the payload, decides the
          target state.
        test_recipe:
          setup:
            - "The base chain through the second feeding and the stage advance, so the lot is YEARLING and UNSCREENED"
            - "Inspection I1 (PRE_TRANSFER) has cycled twice: POSITIVE_TREATABLE → FORMALIN treatment (withdrawal_days 5) → clock past withdrawal_clears_at 2026-08-30 → POSITIVE_TREATABLE again → second FORMALIN treatment, so retest_count is 2, status is RETEST_DUE and withdrawal_clears_at is 2026-09-05T00:00:00Z"
            - "The lot's health_status is RESTRICTED and the clock stands at 2026-09-06T00:00:00Z"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - call: "POST /health-inspections/${insp1_id}/record-result"
              payload: { result: "POSITIVE_TREATABLE", pathogen_code: "FLAVO-PSY" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
            - call: "POST /health-inspections/${insp1_id}/record-treatment"
              payload: { treatment_code: "FORMALIN", withdrawal_days: 5, treatment_completed_at: "2026-08-25T00:00:00Z" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /health-inspections/${insp1_id}/record-result"
              payload: { result: "POSITIVE_TREATABLE", pathogen_code: "FLAVO-PSY" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
            - call: "POST /health-inspections/${insp1_id}/record-treatment"
              payload: { treatment_code: "FORMALIN", withdrawal_days: 5, treatment_completed_at: "2026-08-31T00:00:00Z" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /health-inspections/${insp1_id}/record-result"
              payload: { result: "POSITIVE_TREATABLE", pathogen_code: "FLAVO-PSY" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
          assert:
            - "HealthInspection.${insp1_id}.status == FAILED_REPORTABLE"
            - "HealthInspection.${insp1_id}.retest_count == 2"
            - "HealthInspection.${insp1_id}.escalated_from_retests == true"
            - "RearingLot.${lot_id}.health_status == QUARANTINED"
            - "RearingLot.${lot_id}.certificate_expires_at == null"
            - "RearingLot.${lot_id}.rearing_stage == YEARLING"

      - name: allocation_plan_reverts_to_draft_on_late_attach
        grounds:
          - state_machines.AllocationPlan.ALLOCATED_to_DRAFT
          - entities.AllocationPlan.fields.run_count
          - entities.AllocationPlan.fields.allocated_total_count
          - endpoints.POST /stocking-requests/{id}/attach-to-plan
        distinguishing_aspect: |
          BACKWARD edge on a plan that already resolved: attaching a late request
          rewinds ALLOCATED → DRAFT, zeroes allocated_total_count and returns every
          previously ALLOCATED or DEFERRED request to QUEUED with allocated_count 0,
          while run_count KEEPS its historical value of 1. A forward-only plan
          machine, or one that reset run_count, fails here.
        test_recipe:
          setup:
            - "The waterfall setup: hatchery GLDN, waters P1/P2/P3, requests A 640, B 300, C 210 all QUEUED on plan P"
            - "P has been run once, so it is ALLOCATED with allocated_total_count 1000, run_count 1 and grants 625 / 200 / 175"
            - "Water P1.allocated_count_ytd is 625"
            - "No StockingEvent has been created against any request on this plan"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch2
            - *k_water_p1
            - *k_water_p2
            - *k_water_p3
            - *k_req_a
            - *k_req_b
            - *k_req_c
            - *k_plan2
            - *k_attach_a
            - *k_plan2_v1
            - *k_attach_b
            - *k_plan2_v2
            - *k_attach_c
            - *k_plan2_v3
            - call: "POST /allocation-plans/${plan2_id}/run"
              payload: { expected_plan_version: "${plan2_v3}" }
              as: ProgramAdmin
            - call: "POST /stocking-requests"
              payload:
                water_id: "${water_p3_id}"
                species: "RAINBOW_TROUT"
                requested_count: 100
                size_class: "YEARLING"
                justification: "Late request from the district biologist"
              as: RegionalBiologist
              as_user_id: "bio-frank"
              captures: { req_d_id: $.data.id }
            - call: "GET /allocation-plans/${plan2_id}"
              payload: {}
              as: ProgramAdmin
              captures: { plan2_v4: $.data.version }
          trigger:
            - call: "POST /stocking-requests/${req_d_id}/attach-to-plan"
              payload: { allocation_plan_id: "${plan2_id}", expected_plan_version: "${plan2_v4}" }
              as: ProgramAdmin
          assert:
            - "AllocationPlan.${plan2_id}.status == DRAFT"
            - "AllocationPlan.${plan2_id}.allocated_total_count == 0 and AllocationPlan.${plan2_id}.unmet_demand_count == 0 and AllocationPlan.${plan2_id}.public_allocated_count == 0"
            - "AllocationPlan.${plan2_id}.run_count == 1 (history is preserved)"
            - "StockingRequest.${req_a_id}.status == QUEUED and StockingRequest.${req_a_id}.allocated_count == 0"
            - "StockingRequest.${req_b_id}.status == QUEUED and StockingRequest.${req_b_id}.allocated_count == 0"
            - "StockingRequest.${req_c_id}.status == QUEUED and StockingRequest.${req_c_id}.allocated_count == 0"
            - "StockingRequest.${req_d_id}.status == QUEUED"
            - "Water.${water_p1_id}.allocated_count_ytd == 0 and Water.${water_p1_id}.plan_shortfall_count == 2000"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: reportable_pathogen_unwinds_the_whole_trip
        grounds:
          - state_machines.HealthInspection.SAMPLED_to_FAILED_REPORTABLE
          - state_machines.RearingLot.health CERTIFIED_to_health QUARANTINED
          - state_machines.StockingEvent.IN_TRANSIT_to_ABORTED
          - state_machines.StockingRequest.ALLOCATED_to_DEFERRED
          - conserved_quantities.fish-count-conservation
        distinguishing_aspect: |
          Five-level chain driven from the HEALTH domain: one record-result call
          walks inspection → lot → in-transit event → request → water and hatchery
          ledgers, and the truck comes back off the road on the way. Depth is what
          is under test: an implementation that quarantines the lot but leaves the
          event IN_TRANSIT, or aborts the event but leaves the request ALLOCATED,
          stops short.
        test_recipe:
          setup:
            - "The base chain through loading: event E1 is IN_TRANSIT with 2400 fish reserved, planned_load_lbs 240.00 and transport_cost_cents 81000 committed"
            - "Truck TRK-01 is IN_USE, the lot is CERTIFIED at YEARLING with 16000 fish, request R1 is ALLOCATED 2400 and Water Blue Mesa carries allocated_count_ytd 2400"
            - "A fresh ROUTINE inspection I2 has just been opened on the lot, so the lot reads UNDER_INSPECTION with certificate_expires_at null"
            - "The clock stands at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0901
            - *k_lot_v
            - *k_event1
            - *k_load1
            - call: "POST /health-inspections"
              payload: { lot_id: "${lot_id}", inspection_type: "ROUTINE", sample_size: 30, sampled_at: "2026-09-01T08:00:00Z" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
              captures: { insp3_id: $.data.id }
          trigger:
            - call: "POST /health-inspections/${insp3_id}/record-result"
              payload: { result: "POSITIVE_REPORTABLE", pathogen_code: "VHSV" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
          assert:
            - "link 1 — HealthInspection.${insp3_id}.status == FAILED_REPORTABLE and escalated_from_retests == false"
            - "link 2 — RearingLot.${lot_id}.health_status == QUARANTINED and certificate_expires_at == null"
            - "link 3 — StockingEvent.${event1_id}.status == ABORTED, abort_reason == LOT_QUARANTINED, aborted_at == 2026-09-01T08:00:00Z, released_count == 0"
            - "link 3 — RearingLot.${lot_id}.reserved_count == 0 and count_on_hand == 16000 (the fish stay in the lot)"
            - "link 3 — TransportUnit.${truck1_id}.status == AVAILABLE and current_event_id == null"
            - "link 3 — Hatchery.${hatch_id}.budget_committed_cents == 0 and budget_spent_cents == 0 and budget_available_cents == 50000000"
            - "link 4 — StockingRequest.${req1_id}.status == DEFERRED, allocated_count == 0, deferral_reason == EVENT_ABORTED"
            - "link 5 — Water.${water_a_id}.allocated_count_ytd == 0, released_count_ytd == 0, plan_shortfall_count == 2000, plan_fill_pct == 0.00"
            - "RearingLot.${lot_id}.rearing_stage == YEARLING (the growth dimension is untouched by the health cascade)"

      - name: effluent_exceedance_freezes_production_and_returns_reservations
        grounds:
          - calculations.effluent_compliance
          - state_machines.Hatchery.RESTRICTED_to_FROZEN
          - state_machines.BroodStock.SPAWNING_to_SUSPENDED
          - state_machines.SpawnEvent.PLANNED_to_CANCELLED
          - conserved_quantities.water-right-conservation
        distinguishing_aspect: |
          Four-level chain driven from the COMPLIANCE domain instead of the health
          domain: a single discharge sample walks reading → station posture → brood
          group → planned take, and the acre-feet and females the take had reserved
          come back on the far end. The trigger is a plain create call on an
          immutable row, which is what makes the depth easy to under-implement.
        test_recipe:
          setup:
            - "Hatchery SLVC with tss_permit_limit_mg_l 20.0 and annual_water_right_af 120.0"
            - "BroodStock SLVC-Hofer is SPAWNING with females_reserved 20 by PLANNED spawn event S1, which reserved 3.0 acre-feet"
            - "One EXCEEDANCE reading (tss 26.5, flow_af 0.5) is already on file, so exceedance_count_rolling is 1 and the posture is RESTRICTED"
            - "The clock stands at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_brood
            - *k_open
            - *k_spawn1
            - call: "POST /effluent-readings"
              payload: { hatchery_id: "${hatch_id}", sampled_at: "2026-08-01T00:00:00Z", tss_mg_l: 26.5, total_phosphorus_mg_l: 0.05, flow_af: 0.5 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { reading1_id: $.data.id }
          trigger:
            - call: "POST /effluent-readings"
              payload: { hatchery_id: "${hatch_id}", sampled_at: "2026-08-01T00:00:00Z", tss_mg_l: 30.0, total_phosphorus_mg_l: 0.05, flow_af: 0.5 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { reading2_id: $.data.id }
          assert:
            - "link 1 — EffluentReading.${reading1_id}.status == EXCEEDANCE and exceedance_margin_mg_l == 6.500"
            - "link 1 — EffluentReading.${reading2_id}.status == EXCEEDANCE and exceedance_margin_mg_l == 10.000"
            - "link 2 — Hatchery.${hatch_id}.exceedance_count_rolling == 2 and operating_posture == FROZEN"
            - "link 3 — BroodStock.${brood_id}.status == SUSPENDED"
            - "link 4 — SpawnEvent.${spawn1_id}.status == CANCELLED"
            - "link 4 — BroodStock.${brood_id}.females_reserved == 0 and females_available == 400"
            - "link 4 — Hatchery.${hatch_id}.water_reserved_af == 0.0000, water_used_af == 1.0000, water_available_af == 119.0000"
            - "the water-right identity holds: 120.0 == 119.0000 + 0.0000 + 1.0000"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: own_state_beats_quarantine_safety_on_load_of_aborted_event
        grounds:
          - validation_conflict_pairs.state-beats-safety
          - validations[priority=8]
          - validations[priority=10]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Priority 8 (own-entity state) against priority 10 (business safety) on
          POST /stocking-events/{id}/load: the event is ABORTED and its lot is
          QUARANTINED, so both rules fire, and the response must be
          ERR_INVALID_STATE (409) rather than the more alarming ERR_LOT_QUARANTINED
          (422). Checking safety first would report the wrong error and the wrong
          status code.
        test_recipe:
          setup:
            - "The base chain through event creation, then E1 aborted by its manager so it is ABORTED with abort_reason OPERATOR_ABORT"
            - "A fresh ROUTINE inspection on the lot returned POSITIVE_REPORTABLE, so the lot's health_status is QUARANTINED"
            - "The clock stands at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
