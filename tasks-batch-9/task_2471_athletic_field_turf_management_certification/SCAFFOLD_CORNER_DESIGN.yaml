        claim_type: parallel
        grounds:
          - state_machines.ReplacementPlan
        excluded_because:
          difficulty_instance: non_linear_state_machine / replacement_plan_funding_and_disposal_axes_advance_independently
          rationale: "That §1.8 instance advances disposal_status and funding_status independently and asserts the single cross-axis guard on /complete."

      - name: unsafe_closure_cascades_to_confirmed_bookings
        claim_type: cascade_down
        grounds:
          - state_machines.Field
          - state_machines.UsageBooking
        excluded_because:
          difficulty_instance: transitive_cascade / failed_impact_test_cascades_through_order_posture_booking_to_ledger
          rationale: "That §1.8 instance asserts the CLOSED_UNSAFE posture cancelling a CONFIRMED booking as CANCELLED_UNSAFE plus the resulting ledger entry and counter."

      - name: rain_out_compensation_reverses_the_wear_side_effect
        claim_type: compensation
        grounds:
          - state_machines.UsageBooking
          - calculations.field_cumulative_wear_units
        excluded_because:
          difficulty_instance: compensating_invariant / rain_out_relief_entry_restores_cumulative_wear_units_exactly
          rationale: "That §1.8 instance asserts the equal-and-opposite RAIN_OUT_RELIEF entry, the restored 0.00 balance and the deliberately uncompensated rest obligation."

  # ==========================================================================
  # CALCULATIONS
  # ==========================================================================
  - section: calculations
    instances:
      - name: field_age_and_warranty_boundary_is_inclusive_of_expiry
        claim_type: correct_result
        grounds:
          - calculations.field_age_and_warranty_status
          - entities.Field
        distinguishing_aspect: "Pins BOTH derived age_years values to 2dp and the three-way warranty_status fan-out, with one field whose warranty_expires_on equals the logical clock instant exactly. An implementation using a strict `current_utc <= warranty_expires_on` test reports ACTIVE for that field instead of EXPIRED; an implementation using whole calendar years instead of DAYS_PER_YEAR = 365.25 reports age_years 8.00 rather than 8.30."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its mandatory default 2026-08-01T00:00:00Z unless a POST /_clock/set_current_utc call below moves it forward."
            - "The setup_api_calls chain below is the authoritative, executable statement of this precondition - every fixture value is a literal and every id is captured from a prior response."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Boundary 4", surface_type: "NATURAL_GRASS", installed_on_date: "2018-04-15", expected_life_years: 12, area_sq_ft: 80000, sanctioned_level: "STATE", warranty_expires_on: "2026-08-01" }
              as: FacilitiesDirector
              as_user_id: ${s_dir}
              captures: { f_boundary: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: ${s_dir}
              captures: { f_new: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Rec 5", surface_type: "NATURAL_GRASS", installed_on_date: "2020-01-01", expected_life_years: 15, area_sq_ft: 40000, sanctioned_level: "NONE" }
              as: FacilitiesDirector
              as_user_id: ${s_dir}
              captures: { f_rec: $.data.id }
          trigger:
            - call: "GET /turf/fields/${f_boundary}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { boundary_age: $.data.age_years, boundary_warranty: $.data.warranty_status }
          assert:
            - "the logical clock is at its mandatory default 2026-08-01T00:00:00Z; no POST /_clock/set_current_utc call is made"
            - "GET /turf/fields/${f_boundary} returns data.age_years == 8.30 (3030 elapsed days / 365.25 = 8.2957 rounded half-up to 2dp)"
            - "GET /turf/fields/${f_boundary} returns data.warranty_status == \"EXPIRED\" because current_utc equals warranty_expires_on exactly and the boundary is inclusive of expiry"
            - "GET /turf/fields/${f_new} returns data.age_years == 1.00 and data.warranty_status == \"ACTIVE\""
            - "GET /turf/fields/${f_rec} returns data.age_years == 6.58 and data.warranty_status == \"NONE\" because warranty_expires_on was never supplied"
            - "all three fields return data.play_status == \"OPEN\", data.certification_status == \"NOT_CERTIFIED\", data.cumulative_wear_units == 0.00 and data.rest_debt_hours == 0.00"

      - name: gmax_mean_exactly_at_advisory_limit_is_pass
        claim_type: threshold
        grounds:
          - calculations.impact_attenuation_result
          - calculations.field_condition_index
          - state_machines.SafetyAssessment
        distinguishing_aspect: "Sits the g-max mean exactly on GMAX_ADVISORY_LIMIT = 165.0 with readings that are individually above and below it. Both threshold comparisons are `<=`, so 165.0 is PASS and no RemediationOrder is opened; a strict `<` implementation returns ADVISORY, opens an ADVISORY RemediationOrder and drops Field.play_status to RESTRICTED. Distinct from the §1.8 boundary instance, which sits on the MANDATORY limit 200.0 and asserts the ADVISORY/FAIL edge."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its mandatory default 2026-08-01T00:00:00Z unless a POST /_clock/set_current_utc call below moves it forward."
            - "The setup_api_calls chain below is the authoritative, executable statement of this precondition - every fixture value is a literal and every id is captured from a prior response."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Ines Vargas", roles: ["SafetyInspector"] }
              as: FacilitiesDirector
              as_user_id: ${s_dir}
              captures: { s_insp: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
