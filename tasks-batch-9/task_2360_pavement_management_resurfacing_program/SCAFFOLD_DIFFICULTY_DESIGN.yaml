        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so both HIGH-severity requests have sla_due_at 2026-08-04T00:00:00Z and neither breaches."
            - "One LOCAL Maple St segment with no project activity at all — the counter is exercised in isolation."
            - "Two resident pothole complaints are filed on that segment by resident-1."
            - "The first is triaged PATCH (which must leave the counter untouched) and then closed PATCHED; the second is closed straight from NEW as a DUPLICATE."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { q_open0: "$.data.open_service_request_count" }
            - call: "POST /pavement/service-requests"
              payload: { segment_id: "${seg1}", complaint_type: "POTHOLE", reported_severity: "HIGH", location_note: "deep pothole at 1200 block driveway" }
              as: Resident
              as_user_id: "resident-1"
              captures: { sr1: "$.data.id" }
            - call: "POST /pavement/service-requests"
              payload: { segment_id: "${seg1}", complaint_type: "POTHOLE", reported_severity: "HIGH", location_note: "second pothole near the intersection" }
              as: Resident
              as_user_id: "resident-1"
              captures: { sr2: "$.data.id", q_due: "$.data.sla_due_at", q_status2: "$.data.request_status" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { q_open1: "$.data.open_service_request_count" }
            - call: "POST /pavement/service-requests/${sr1}/triage"
              payload: { disposition: "PATCH" }
              as: PavementEngineer
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { q_open2: "$.data.open_service_request_count" }
          trigger:
            - call: "POST /pavement/service-requests/${sr1}/close"
              payload: { closure_code: "PATCHED" }
              as: PavementEngineer
              captures: { q_s1: "$.data.request_status", q_c1: "$.data.closure_code", q_b1: "$.data.sla_breached" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { q_open3: "$.data.open_service_request_count" }
            - call: "POST /pavement/service-requests/${sr1}/close"
              payload: { closure_code: "DUPLICATE" }
              as: PavementEngineer
              captures: { q_err: "$.data.error_id" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { q_open4: "$.data.open_service_request_count" }
            - call: "POST /pavement/service-requests/${sr2}/close"
              payload: { closure_code: "DUPLICATE" }
              as: PavementEngineer
              captures: { q_s2: "$.data.request_status" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { q_open5: "$.data.open_service_request_count" }
            - call: "POST /pavement/service-requests/${sr2}/close"
              payload: { closure_code: "DUPLICATE" }
              as: PavementEngineer
              captures: { q_err2: "$.data.error_id" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { q_open6: "$.data.open_service_request_count" }
          assert:
            - "${q_open0} == 0, ${q_open1} == 2, ${q_status2} == NEW and ${q_due} == 2026-08-04T00:00:00Z"
            - "${q_open2} == 2 — triage NEW -> TRIAGED_PATCH does not change the open count"
            - "${q_s1} == CLOSED_PATCHED, ${q_c1} == PATCHED, ${q_b1} == false, ${q_open3} == 1"
            - "${q_err} == ERR_SERVICE_REQUEST_ALREADY_CLOSED with HTTP 409 and ${q_open4} == 1 — the second close decrements nothing"
            - "${q_s2} == CLOSED_DUPLICATE and ${q_open5} == 0"
            - "${q_err2} == ERR_SERVICE_REQUEST_ALREADY_CLOSED and ${q_open6} == 0 — the counter never goes negative"
