      - name: waterfall_tie_break_uses_delinquent_since_then_created_at
        claim_type: Correct Result
        grounds:
          - calculations.waterfall_allocation
          - calculations.priority_rank_mapping
        distinguishing_aspect: "Two same-rank FEDERAL_NONTAX debts are ordered by delinquent_since ASC, not by creation order: the debt referred SECOND but delinquent since 2026-01-01 outranks the debt referred FIRST but delinquent since 2026-02-01, so the 10000-cent pool lands 8000 on the older-delinquency debt and only 2000 on the newer one. The final tie-break is created_at ASC (never id)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Federal creditor; payee tin 111-22-3333. Debt A referred first (balance 8000, delinquent_since 2026-02-01); debt B referred second (balance 8000, delinquent_since 2026-01-01). Both ACTIVE. FULL VENDOR policy ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "VENDOR", exemption_class: "FULL" }
