          setup:
            - "LOC award CC: TRAVEL 100000 + OTHER_DIRECT 100000 (directs 200000, F&A 100000, obligated 300000), ACTIVE"
            - "TRAVEL 100000 posted cash -> pool 150000; draw 150000 submitted and settled (drawn 150000)"
            - "No report requirements scheduled (the all-reports-accepted gate is vacuously true)"
