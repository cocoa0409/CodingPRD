          assert:
            - "the placement response itself already carries placement_status \"PLACED\", bed_id ${b_im1} and placed_at \"2026-09-03T08:00:00.000Z\" - no re-read is required to observe the transition"
            - "the GET on Unit.${u_im} immediately afterwards returns exactly what the placement's own side effects produced: occupied_bed_count 1, licensed_placement_bed_count 2, raw_available_bed_count 1, posture \"RESTRICTED\" (1 <= max(1, floor(2 * 0.20)) == 1) and effective_available_bed_count 0"
            - "the GET on Patient.${p_im} shows active_hold_count 1 while the hold is ACTIVE"
            - "the rescission response reports HoldOrder.${h_im}.status \"RESCINDED\" with closure_reason \"Criteria no longer met.\" (the request's rescind_reason verbatim), and the very next read of Patient.${p_im} shows active_hold_count 0 - the recomputed ancestor counter never lags"
            - "the read of Admission.${a_im} shows legal_status \"VOLUNTARY\" on the legal axis with placement_status still \"PLACED\" on the placement axis, and repeating any of these GET calls returns identical values - immediate consistency means idempotent reads, never a converging one"
