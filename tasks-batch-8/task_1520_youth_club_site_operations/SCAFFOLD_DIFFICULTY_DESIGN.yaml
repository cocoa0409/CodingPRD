              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Pay Kid", date_of_birth: "2011-01-01", grade: 8, household_size: 1, household_income_cents: 5000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /scholarship-funds"
              payload: { site_id: "${site_id}", name: "Fund H", budget_cents: 50000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id, fund_v: $.data.version }
            - call: "POST /scholarship-awards"
              payload: { fund_id: "${fund_id}", member_id: "${m1}", discount_pct: 0.50, weekly_cap_cents: 5000, annual_cap_cents: 4000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { aw1: $.data.id }
            - { call: "POST /scholarship-awards/${aw1}/activate", payload: { expected_fund_version: "${fund_v}" }, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - { call: "POST /members/${m1}/withdraw", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
          assert:
            - "Member.${m1}.status == WITHDRAWN"
            - "ScholarshipAward.${aw1}.status == REVOKED (link 1: caused by the withdrawal cascade)"
            - "ScholarshipFund.${fund_id}.reserved_cents == 0 and available_cents == 50000 and disbursed_cents == 0 (link 2: caused by the revocation)"
            - "invariant holds: 50000 == 50000 + 0 + 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: signin_member_state_referential_beats_fee_arrears_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_MEMBER_NOT_ACTIVE]
          - errors[ERR_FEE_ARREARS_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_fiscal: a
          WITHDRAWN member whose fee_balance_cents (17500) exceeds
          max_arrears_cents (10000) violates both the member-state gate (P8)
          and the arrears gate (P10); the referential error
          ERR_MEMBER_NOT_ACTIVE MUST win.
        test_recipe:
          setup:
            - "PAID member approved (balance 2500); three Friday closes accrue 5000 each -> balance 17500 > 10000"
            - "member then WITHDRAWN; new club day 2026-08-24 OPEN"
          setup_api_calls:
