# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth
  - { id: ERR_MISSING_OR_INVALID_ROLE, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.7" }
  - { id: ERR_NEGOTIATOR_CANNOT_APPROVE_OWN_OFFER, http: 403, condition: "Creator of an offer requiring director approval cannot tender it themselves" }
  - { id: ERR_DIRECTOR_APPROVAL_REQUIRED, http: 403, condition: "Offer requires DepartmentDirector acceptance due to compensation threshold" }

  # Not found
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "EasementCase with given caseId does not exist" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "EasementDocument with given docId does not exist" }
  - { id: ERR_ENCROACHMENT_NOT_FOUND, http: 404, condition: "Encroachment with given encId does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "AcquisitionOffer with given offerId does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "ThirdPartyPermit with given permitId does not exist" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "VegetationZone with given zoneId does not exist" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "VegetationViolation with given violId does not exist" }
  - { id: ERR_TITLE_TASK_NOT_FOUND, http: 404, condition: "TitleSearchTask with given taskId does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "LitigationReferral with given refId does not exist" }

  # State
  - { id: ERR_CASE_NOT_OPEN_FOR_RECORDING, http: 409, condition: "Case status not in {MAPPING, ACTIVE_MONITORING, RESOLUTION_PENDING}" }
  - { id: ERR_CASE_NOT_MONITORING, http: 409, condition: "Case status not in {ACTIVE_MONITORING, RESOLUTION_PENDING}" }
  - { id: ERR_CASE_ALREADY_CLOSED, http: 409, condition: "Case is in a terminal CLOSED_* state" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid state for the requested transition" }
  - { id: ERR_OFFER_NOT_TENDERED, http: 409, condition: "Offer must be TENDERED or COUNTERED for this operation" }
  - { id: ERR_ENCROACHMENT_NOT_NEGOTIATING, http: 409, condition: "Encroachment must be NEGOTIATING or COUNTERED for this operation" }
  - { id: ERR_PERMIT_NOT_PENDING, http: 409, condition: "Permit approval_status must be PENDING for this operation" }
  - { id: ERR_TASK_NOT_IN_PROGRESS, http: 409, condition: "TitleSearchTask must be IN_PROGRESS to complete" }
  - { id: ERR_DOCUMENT_NOT_DRAFT, http: 409, condition: "Document must be DRAFT to record or reject" }
  - { id: ERR_REFERRAL_NOT_ACCEPTED, http: 409, condition: "Referral must be ACCEPTED to file" }
  - { id: ERR_REFERRAL_NOT_FILED, http: 409, condition: "Referral must be FILED to settle or record judgment" }
  - { id: ERR_INSPECTION_NOT_PASSED, http: 409, condition: "Permit field_inspection_status must be PASSED to approve" }
  - { id: ERR_ONLY_FAILED_INSPECTION_REVOKABLE, http: 409, condition: "Only a permit with field_inspection_status=FAILED can be revoked" }
  - { id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, http: 409, condition: "negotiation_round has reached MAX_NEGOTIATION_ROUNDS" }
  - { id: ERR_NEGOTIATION_ROUNDS_NOT_EXHAUSTED, http: 409, condition: "Escalation requires negotiation_round >= MAX_NEGOTIATION_ROUNDS" }
  - { id: ERR_OPEN_ENCROACHMENTS_REMAIN, http: 409, condition: "open_encroachment_count > 0 at case close" }
  - { id: ERR_OPEN_OFFERS_EXIST, http: 409, condition: "Offer in DRAFT/TENDERED/COUNTERED exists at case close" }
  - { id: ERR_PENDING_PERMITS_EXIST, http: 409, condition: "Permit with approval_status=PENDING exists at case close" }
  - { id: ERR_PENDING_LITIGATION_EXISTS, http: 409, condition: "LitigationReferral in REFERRED/ACCEPTED exists at case close" }
  - { id: ERR_NO_DOCUMENTS_ON_CASE, http: 409, condition: "begin-mapping requires at least one document" }
  - { id: ERR_NO_RECORDED_DOCUMENT, http: 409, condition: "activate-monitoring requires at least one RECORDED document" }
  - { id: ERR_RECORDED_DOCUMENT_EXISTS, http: 409, condition: "abandon requires zero RECORDED documents" }
  - { id: ERR_ONLY_MINOR_WAIVABLE, http: 409, condition: "Only encroachments with severity_tier=MINOR can be waived" }

  # Business
  - { id: ERR_CROSS_CASE_REFERENCE, http: 409, condition: "Referenced document/encroachment belongs to a different case" }
  - { id: ERR_TITLE_NOT_CLEARED, http: 409, condition: "Latest TitleSearchTask is not COMPLETED_CLEAN or no RECORDED document exists" }
  - { id: ERR_TITLE_DEFECTS_EXIST, http: 409, condition: "Attempted to complete a title search with liens_found>0 or defects_found>0 as COMPLETED_CLEAN" }
  - { id: ERR_DUPLICATE_INSTRUMENT_NUMBER, http: 409, condition: "instrument_number already recorded in this county" }
  - { id: ERR_DOCUMENT_NOT_RECORDED, http: 409, condition: "Referenced document is not in RECORDED status" }
  - { id: ERR_SELF_SUPERSEDE, http: 409, condition: "supersedes_document_id cannot equal the document's own id" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "recording_date in future, or requested_end_date <= requested_start_date" }
  - { id: ERR_DEADLINE_PASSED, http: 422, condition: "negotiation_deadline or remediation_deadline has passed" }
  - { id: ERR_PERMIT_OVERLAP, http: 409, condition: "Another APPROVED permit on the same case covers an overlapping window for the same permit_type" }
  - { id: ERR_INSURANCE_REQUIRED, http: 409, condition: "insurance_certificate_on_file must be true to approve a permit" }
  - { id: ERR_PROHIBITED_SPECIES_NOT_EXEMPTABLE, http: 409, condition: "Violation species is in zone.prohibited_species; cannot exempt" }
  - { id: ERR_EXCESS_HEIGHT_TOO_LARGE, http: 409, condition: "excess_height_ft exceeds EXEMPTABLE_HEIGHT_MARGIN_FT" }
  - { id: ERR_COMPENSATION_EXCEEDS_BUDGET, http: 402, condition: "total_compensation_cents exceeds compensation_balance_cents" }

  # Concurrency
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not match EasementCase.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RightOfWayAgent
    description: "Field agent who discovers encroachments, negotiates removals and acquisitions, manages permits"
    identity: opaque
    exclusive_operations:
      - "POST /easement-cases — create case"
      - "POST /easement-cases/{id}/begin-mapping"
      - "POST /easement-cases/{id}/activate-monitoring"
      - "POST /easement-cases/{id}/encroachments — report encroachment"
      - "POST .../encroachments/{id}/notify"
      - "POST .../encroachments/{id}/begin-negotiation"
      - "POST .../encroachments/{id}/counter"
      - "POST .../encroachments/{id}/resume-negotiation"
      - "POST .../encroachments/{id}/agree-removal"
      - "POST .../encroachments/{id}/confirm-removal"
      - "POST .../encroachments/{id}/escalate"
      - "POST /easement-cases/{id}/offers — create offer"
      - "POST .../offers/{id}/tender"
      - "POST .../offers/{id}/counter"
      - "POST .../offers/{id}/re-tender"
      - "POST .../offers/{id}/accept (only when requires_director_approval=false)"
      - "POST .../offers/{id}/reject"
      - "POST .../offers/{id}/withdraw"
      - "POST /easement-cases/{id}/permits — request permit"
      - "POST .../permits/{id}/approve"
      - "POST .../permits/{id}/deny"
      - "POST /easement-cases/{id}/litigation-referrals — manual referral"
    shared_operations:
      - "GET list/detail endpoints"
      - "POST /_clock/set_current_utc"

  - name: TitleExaminer
    description: "Researches and records title documents, performs title searches"
    identity: opaque
    exclusive_operations:
      - "POST /easement-cases/{id}/documents — create document"
      - "POST .../documents/{id}/record"
      - "POST .../documents/{id}/reject-defective"
      - "POST /easement-cases/{id}/title-searches — order search"
      - "POST .../title-searches/{id}/begin"
      - "POST .../title-searches/{id}/complete"
      - "POST .../title-searches/{id}/cancel"
    shared_operations:
      - "GET list/detail endpoints"
      - "POST /_clock/set_current_utc"

  - name: VegetationInspector
    description: "Inspects vegetation zones, records violations, schedules permit field inspections"
    identity: opaque
    exclusive_operations:
      - "POST /easement-cases/{id}/vegetation-zones — create zone"
      - "POST .../vegetation-zones/{id}/violations — record violation"
      - "POST .../violations/{id}/notify"
      - "POST .../violations/{id}/confirm-remediation"
      - "POST /easement-cases/{id}/permits/{id}/schedule-inspection"
      - "POST .../permits/{id}/record-inspection"
    shared_operations:
      - "GET list/detail endpoints"
      - "POST /_clock/set_current_utc"

  - name: LitigationCounsel
    description: "Accepts and litigates referrals"
    identity: opaque
    exclusive_operations:
      - "POST .../litigation-referrals/{id}/accept"
      - "POST .../litigation-referrals/{id}/file"
      - "POST .../litigation-referrals/{id}/settle"
      - "POST .../litigation-referrals/{id}/record-judgment"
      - "POST .../litigation-referrals/{id}/withdraw"
    shared_operations:
      - "GET list/detail endpoints"
      - "POST /_clock/set_current_utc"

  - name: DepartmentDirector
    description: "Approves high-compensation offers, closes cases, waives minor encroachments, revokes permits, exempts violations"
    identity: opaque
    exclusive_operations:
      - "POST /easement-cases/{id}/close-case"
      - "POST /easement-cases/{id}/condemn"
      - "POST /easement-cases/{id}/abandon"
      - "POST .../offers/{id}/accept (when requires_director_approval=true)"
      - "POST .../offers/{id}/refer-to-condemnation"
      - "POST .../encroachments/{id}/waive"
      - "POST .../permits/{id}/revoke"
      - "POST .../violations/{id}/exempt"
    shared_operations:
      - "GET list/detail endpoints"
      - "POST /_clock/set_current_utc"
