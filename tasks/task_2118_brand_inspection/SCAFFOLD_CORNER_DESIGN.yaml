              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/fee-remittances"
              payload: { owner_id: "${own_a}", amount_cents: 2501, covered_order_ids: ["${ord_1}"] }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { rem_over: "$.data.id" }
            - call: "POST /brand-inspection/fee-remittances"
              payload: { owner_id: "${own_a}", amount_cents: 2500, covered_order_ids: ["${ord_1}"] }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { rem_exact: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/fee-remittances/${rem_over}/reconcile"
