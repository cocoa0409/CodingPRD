scenario: "752. Public-Notice & Legal-Advertising Platform: notice submission & type (foreclosure/probate/bid), publication scheduling & newspaper/affidavit, fee & word/line pricing, proof & affidavit-of-publication, digital archive & search, deadline/statutory compliance, recurring run, billing"
domain_name: "public-notice-legal-ads"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - scheduled_deferred_actions
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: hybrid
  # Notice is the aggregate root (parent of Insertion/Proof/Affidavit); Invoice/Payment/
  # InvoiceLineItem are flat peers wired by FK; Insertion carries a self-referential FK
  # (makes_good_insertion_id) for the make-good chain; StatutoryRequirement and Newspaper
  # are configuration entities resolved by county+type selector (Newspaper by explicit id).

  state_machine_shape: compound
  # Notice bubbles up from child Insertion states (RUNNING/PUBLISHED derived from
  # insertions_published) and carries two revert cycles (SUBMITTED<->DRAFT on proof reject,
  # AFFIDAVIT_ISSUED->PUBLISHED on affidavit void); Insertion/Proof/Affidavit/Invoice are
  # branching machines.

  relationship_patterns:
    - one_to_many          # Notice -> Insertion/Proof/Affidavit; Account -> Notice/Invoice/Payment; Invoice -> InvoiceLineItem
    - self_referential     # Insertion.makes_good_insertion_id -> Insertion.id
    - cross_aggregate      # Invoice references both Account and Notice across aggregate boundaries

  role_model: peer_roles
  # Advertiser owns Notices (entity_backed:Account); Publisher owns Insertions/Affidavits
  # (entity_backed:Newspaper); ComplianceOfficer and PlatformAdmin are opaque operators.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# ============================================================================
entities:
  - name: Newspaper
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the newspaper of record"
      - name: county
        type: string
        source: input
        description: "Jurisdiction (county code, UPPER_SNAKE) this newspaper serves; a notice may only run here when notice.county == newspaper.county"
      - name: circulation_qualified
        type: boolean
        source: input
        default: true
        description: "Whether this paper qualifies as a 'newspaper of general circulation' — a statutory precondition for scheduling any notice against it"
      - name: pricing_basis
        type: enum
        source: input
        description: "Per-insertion charge basis"
        constraints: "one of {PER_LINE, PER_WORD}"
      - name: chars_per_line
        type: integer
        source: input
        description: "Characters that fit on one typeset line; line_count = ceil(len(body_text) / chars_per_line)"
        constraints: ">= 1"
      - name: line_rate_first_cents
        type: integer
        source: input
        description: "Per-line charge for the FIRST insertion (sequence_number == 1) when pricing_basis == PER_LINE"
        constraints: ">= 0"
      - name: line_rate_subsequent_cents
        type: integer
        source: input
        description: "Per-line charge for every insertion with sequence_number >= 2 when pricing_basis == PER_LINE"
        constraints: ">= 0"
      - name: word_rate_cents
        type: integer
        source: input
        description: "Per-word charge applied to every insertion when pricing_basis == PER_WORD (flat across sequence_number)"
        constraints: ">= 0"
      - name: affidavit_fee_cents
        type: integer
        source: input
        description: "Flat affidavit-of-publication fee added to an invoice unless waived by the subtotal tier (see calculations.invoice_total)"
        constraints: ">= 0"
      - name: edition_line_capacity
        type: integer
        source: input
        description: "Maximum total legal-notice lines a single edition (newspaper + publication date) can carry across ALL notices"
        constraints: ">= 1"
      - name: publication_weekday
        type: integer
        source: input
        description: "Weekday this paper publishes, Python weekday() convention Monday=0..Sunday=6; every insertion date must fall on this weekday"
        constraints: "0..6"
      - name: blackout_dates
        type: array
        source: input
        default: []
        description: "List of half-open [start_date, end_date) ISO-date ranges (holidays/no-print). An insertion date d is blacked out iff start_date <= d < end_date for some range"

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Advertiser / law firm / agency name"
      - name: account_type
        type: enum
        source: input
        description: "Advertiser class"
        constraints: "one of {LAW_FIRM, GOVERNMENT, INDIVIDUAL}"
      - name: credit_limit_cents
        type: integer
        source: input
        default: 0
        description: "Maximum committed_balance_cents the account may carry; submit is rejected when committed_balance_cents + notice.estimated_cost_cents would exceed it"
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Account standing; only ACTIVE accounts may submit notices"
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: outstanding_balance_cents
        type: number
        source: computed
        description: "SETTLED-view balance = sum(Invoice.total_cents where status==ISSUED) - sum(Payment.amount_cents); see calculations.account_balance variant 'outstanding'"
      - name: committed_balance_cents
        type: number
        source: computed
        description: "COMMITTED-view balance = outstanding_balance_cents + sum(Invoice.total_cents where status==DRAFT); see calculations.account_balance variant 'committed'"

  - name: StatutoryRequirement
    parent: null
    common_fields: true
    fields:
      - name: notice_type
        type: enum
        source: input
        description: "Notice class this rule governs"
        constraints: "one of {FORECLOSURE, PROBATE, BID}"
      - name: county
        type: string
        source: input
        description: "County (UPPER_SNAKE) this rule governs; (notice_type, county) is unique"
      - name: min_insertions
        type: integer
        source: input
        description: "Statutory minimum number of consecutive weekly insertions required to satisfy publication"
        constraints: ">= 1"
      - name: min_days_before_deadline
        type: integer
        source: input
        description: "The LAST insertion date must fall on or before (notice.deadline_date - min_days_before_deadline days)"
        constraints: ">= 0"

  - name: Notice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the advertiser who owns this notice"
      - name: newspaper_id
        type: string
        source: input
        description: "FK -> Newspaper.id; the paper the notice will run in"
      - name: notice_type
        type: enum
        source: input
        description: "Legal notice class"
        constraints: "one of {FORECLOSURE, PROBATE, BID}"
      - name: county
        type: string
        source: input
        description: "County (UPPER_SNAKE) of publication; must equal newspaper.county and match a StatutoryRequirement row"
      - name: title
        type: string
        source: input
        description: "Short headline of the notice"
      - name: body_text
        type: string
        source: input
        description: "Full legal text; drives word_count and line_count"
      - name: deadline_date
        type: datetime
        source: input
        description: "Statutory anchor date (hearing / sale / bid-open, ISO date); the last insertion must precede it by >= min_days_before_deadline"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Lifecycle state (see state_machines.Notice)"
        constraints: "one of {DRAFT, SUBMITTED, PROOF_APPROVED, SCHEDULED, RUNNING, PUBLISHED, AFFIDAVIT_ISSUED, ARCHIVED}"
      - name: word_count
        type: integer
        source: computed
        description: "Number of whitespace-separated tokens in body_text (len(body_text.split()))"
      - name: line_count
        type: integer
        source: computed
        description: "ceil(len(body_text) / newspaper.chars_per_line) — typeset lines of the SUBMITTED copy"
      - name: required_insertions
        type: integer
        source: computed
        description: "Copied from the matching StatutoryRequirement.min_insertions at create time (selector: notice_type == and county ==)"
      - name: insertions_published
        type: integer
        source: computed
        default: 0
        description: "COUNT(Insertion where notice_id==this AND status==PUBLISHED) — includes make-good publications; drives compliance and PUBLISHED bubble-up"
      - name: paid_insertion_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Insertion where notice_id==this AND status==PUBLISHED AND is_make_good==false) — the billable insertions; make-goods never increment it"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: "Provisional charge computed from SUBMITTED copy over required_insertions; see calculations.notice_cost variant 'estimated'"
      - name: final_cost_cents
        type: integer
        source: computed
        default: null
        description: "Actual charge computed from PUBLISHED non-make-good insertions; set when Notice reaches PUBLISHED; see calculations.notice_cost variant 'final'"
      - name: compliance_status
        type: enum
        source: computed
        default: PENDING
        description: "Derived statutory compliance (see calculations.compliance_status)"
        constraints: "one of {PENDING, COMPLIANT, NON_COMPLIANT}"

  - name: Insertion
    parent: Notice
    common_fields: true
    fields:
      - name: notice_id
        type: string
        source: input
        description: "FK -> Notice.id; the notice this insertion runs for"
      - name: newspaper_id
        type: string
        source: computed
        description: "FK -> Newspaper.id; copied from the parent notice; used for edition-capacity aggregation"
      - name: scheduled_date
        type: datetime
        source: input
        description: "ISO date this insertion is planned to publish; must fall on newspaper.publication_weekday"
      - name: sequence_number
        type: integer
        source: computed
        description: "1-based position in the notice's run (1 = first insertion at line_rate_first_cents); a make-good inherits the sequence_number of the insertion it replaces"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: "Insertion lifecycle (see state_machines.Insertion)"
        constraints: "one of {SCHEDULED, PUBLISHED, SKIPPED, CANCELLED}"
      - name: published_date
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant at which /publish was accepted"
      - name: line_count_actual
        type: integer
        source: input
        description: "Actual typeset line count reported by the paper at publish time; may differ from notice.line_count (reformatting)"
        constraints: ">= 1; supplied only on POST /publish"
      - name: cost_cents
        type: integer
        source: computed
        default: 0
        description: "Charge booked for THIS insertion at publish: PER_LINE -> line_count_actual * rate(sequence_number); PER_WORD -> notice.word_count * word_rate_cents; always 0 when is_make_good==true"
      - name: is_make_good
        type: boolean
        source: computed
        default: false
        description: "True when this insertion was auto-created to replace a SKIPPED insertion; make-goods are free and never increment paid_insertion_count"
      - name: makes_good_insertion_id
        type: string
        source: computed
        default: null
        description: "FK -> Insertion.id; self-referential link to the SKIPPED insertion this make-good replaces (null for ordinary insertions)"

  - name: Proof
    parent: Notice
    common_fields: true
    fields:
      - name: notice_id
        type: string
        source: input
        description: "FK -> Notice.id; the notice whose copy is under proof"
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: "Proof review state (see state_machines.Proof)"
        constraints: "one of {PENDING, APPROVED, REJECTED}"
      - name: proof_text
        type: string
        source: computed
        description: "Snapshot of notice.body_text taken when the proof was created"
      - name: reviewer_note
        type: string
        source: input
        default: null
        description: "Optional advertiser note supplied on approve/reject"

  - name: Affidavit
    parent: Notice
    common_fields: true
    fields:
      - name: notice_id
        type: string
        source: input
        description: "FK -> Notice.id; the notice this affidavit of publication attests"
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: "Affidavit lifecycle (see state_machines.Affidavit)"
        constraints: "one of {PENDING, ISSUED, VOID}"
      - name: publication_dates
        type: array
        source: computed
        description: "ISO dates of the PUBLISHED insertions (published_date), ascending; frozen when the affidavit is ISSUED"
      - name: sworn_by
        type: string
        source: input
        description: "Name of the publisher representative swearing the affidavit; supplied on POST /issue"
      - name: issued_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant the affidavit was ISSUED"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: computed
        description: "FK -> Account.id; copied from the notice's account"
      - name: notice_id
        type: string
        source: computed
        description: "FK -> Notice.id; the notice being billed (1:1 with a live invoice)"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Invoice lifecycle (see state_machines.Invoice)"
        constraints: "one of {DRAFT, ISSUED, PAID, VOID}"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "notice.final_cost_cents at invoice creation (sum of InvoiceLineItem.amount_cents)"
      - name: affidavit_fee_cents
        type: integer
        source: computed
        description: "Affidavit fee after subtotal-tier waiver (see calculations.invoice_total)"
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + affidavit_fee_cents"
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: "SUM(Payment.amount_cents where invoice_id==this)"

  - name: InvoiceLineItem
    parent: Invoice
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: computed
        description: "FK -> Invoice.id; the invoice this line belongs to"
      - name: insertion_id
        type: string
        source: computed
        default: null
        description: "FK -> Insertion.id; the PUBLISHED non-make-good insertion this line charges (null for the affidavit-fee line)"
      - name: description
        type: string
        source: computed
        description: "Human-readable line label (e.g., 'Insertion 1 of 2' or 'Affidavit of publication fee')"
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: "line_count_actual of the charged insertion (0 for the affidavit-fee line)"
      - name: rate_cents
        type: integer
        source: computed
        description: "Per-line (or per-word) rate applied to this line"
      - name: amount_cents
        type: integer
        source: computed
        description: "Extended charge for this line"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: computed
        description: "FK -> Account.id; copied from the paid invoice"
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the invoice being paid"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents; must be > 0 and <= (invoice.total_cents - invoice.amount_paid_cents)"
        constraints: "> 0"

# ============================================================================
# §1.2 STATE MACHINE TABLE
# ============================================================================
state_machines:
  - entity: Notice
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /notices/{id}/submit"
        actor: Advertiser
        preconditions:
          - "notice.status == DRAFT"
          - "account.status == ACTIVE"
          - "account.committed_balance_cents + notice.estimated_cost_cents <= account.credit_limit_cents"
        side_effects:
          - "create Proof{status=PENDING, proof_text=snapshot(notice.body_text)}"

      - from: SUBMITTED
        to: PROOF_APPROVED
        trigger: "POST /proofs/{id}/approve"
        actor: Advertiser
        preconditions:
          - "proof.status == PENDING"
          - "the proof's notice_id == this notice"
        side_effects:
          - "set proof.status = APPROVED"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /proofs/{id}/reject"
        actor: Advertiser
        preconditions:
          - "proof.status == PENDING"
        side_effects:
          - "set proof.status = REJECTED"
        note: "Revision cycle A->B->A: rejecting the proof returns the notice to DRAFT so the advertiser can edit body_text and resubmit (a new Proof is minted on the next submit)."

      - from: PROOF_APPROVED
        to: SCHEDULED
        trigger: "POST /notices/{id}/schedule"
        actor: Advertiser
        preconditions:
          - "notice.status == PROOF_APPROVED"
          - "newspaper.circulation_qualified == true"
          - "notice.county == newspaper.county"
          - "a StatutoryRequirement row matches (notice.notice_type, notice.county)"
          - "expected_notice_version == notice.version (OCC)"
          - "every generated insertion date falls on newspaper.publication_weekday, is not in a blackout range, and the LAST date <= notice.deadline_date - min_days_before_deadline days"
          - "for every generated date, sum of SCHEDULED+PUBLISHED insertion line_counts in that edition + this notice.line_count <= newspaper.edition_line_capacity"
        side_effects:
          - "create required_insertions Insertion rows dated first_publication_date + 7*k (k=0..required_insertions-1), each status=SCHEDULED, sequence_number=k+1, newspaper_id=notice.newspaper_id"
          - "increments Notice.version by 1"

      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /notices/{id}/schedule (reschedule / supersede)"
        actor: Advertiser
        preconditions:
          - "notice.status == SCHEDULED"
          - "no insertion of this notice is yet PUBLISHED (insertions_published == 0)"
          - "expected_notice_version == notice.version (OCC)"
          - "same date/blackout/deadline/capacity checks as the PROOF_APPROVED->SCHEDULED transition"
        side_effects:
          - "set every existing SCHEDULED insertion of this notice to CANCELLED"
          - "create a fresh set of SCHEDULED insertions (supersedes the prior schedule)"
          - "increments Notice.version by 1"
        note: "True CREATE-with-supersede — a second sequential reschedule carrying a stale expected_notice_version is rejected by OCC (see concurrency_rules.schedule-create-stale-notice)."

      - from: SCHEDULED
        to: RUNNING
        trigger: "system: first Insertion reaches PUBLISHED while insertions_published < required_insertions"
        actor: system
        preconditions:
          - "1 <= insertions_published < notice.required_insertions"
        side_effects:
          - "recompute notice.compliance_status"

      - from: RUNNING
        to: PUBLISHED
        trigger: "system: an Insertion reaches PUBLISHED and insertions_published >= required_insertions"
        actor: system
        preconditions:
          - "insertions_published >= notice.required_insertions"
        side_effects:
          - "set notice.final_cost_cents = calculations.notice_cost(final)"
          - "recompute notice.compliance_status"
          - "create Affidavit{status=PENDING}"
          - "create Invoice{status=DRAFT} with one InvoiceLineItem per PUBLISHED non-make-good insertion plus (unless waived) an affidavit-fee line"
          - "recompute account.committed_balance_cents"

      - from: SCHEDULED
        to: PUBLISHED
        trigger: "system: an Insertion reaches PUBLISHED and insertions_published >= required_insertions (single-insertion runs, e.g. BID)"
        actor: system
        preconditions:
          - "insertions_published >= notice.required_insertions"
        side_effects:
          - "identical to RUNNING->PUBLISHED: final_cost, compliance recompute, Affidavit(PENDING), Invoice(DRAFT), committed_balance recompute"

      - from: PUBLISHED
        to: AFFIDAVIT_ISSUED
        trigger: "POST /affidavits/{id}/issue"
        actor: Publisher
        preconditions:
          - "notice.status == PUBLISHED"
          - "affidavit.status == PENDING"
        side_effects:
          - "set affidavit.status = ISSUED, affidavit.issued_at = clock, affidavit.publication_dates = ascending published_date list"
          - "set the notice's DRAFT Invoice.status = ISSUED"
          - "recompute account.outstanding_balance_cents"

      - from: AFFIDAVIT_ISSUED
        to: PUBLISHED
        trigger: "system: linked Affidavit is voided (POST /affidavits/{id}/void)"
        actor: system
        preconditions:
          - "affidavit.status == ISSUED"
        side_effects:
          - "set the notice's ISSUED Invoice.status = VOID"
          - "recompute account.outstanding_balance_cents"
        note: "Compensation revert AFFIDAVIT_ISSUED->PUBLISHED: voiding the affidavit unwinds billing and re-arms the notice for a corrected affidavit."

      - from: AFFIDAVIT_ISSUED
        to: ARCHIVED
        trigger: "POST /notices/{id}/archive"
        actor: ComplianceOfficer
        preconditions:
          - "notice.status == AFFIDAVIT_ISSUED"
          - "linked affidavit.status == ISSUED"
        side_effects:
          - "notice becomes read-only and remains query-visible in the digital archive"

  - entity: Insertion
    initial_state: SCHEDULED
    terminal_states: [PUBLISHED, SKIPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PUBLISHED
        trigger: "POST /insertions/{id}/publish"
        actor: Publisher
        preconditions:
          - "insertion.status == SCHEDULED"
          - "parent notice.status IN {SCHEDULED, RUNNING}"
          - "clock >= insertion.scheduled_date"
          - "acting Publisher owns insertion.newspaper_id"
        side_effects:
          - "set published_date = clock, line_count_actual = body value"
          - "set cost_cents = (is_make_good ? 0 : per-insertion charge from calculations.notice_cost)"
          - "increment notice.insertions_published by 1"
          - "if not is_make_good: increment notice.paid_insertion_count by 1"
          - "bubble notice: SCHEDULED->RUNNING or ->PUBLISHED per insertions_published vs required_insertions"

      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /insertions/{id}/skip"
        actor: Publisher
        preconditions:
          - "insertion.status == SCHEDULED"
          - "insertion.is_make_good == false (a make-good cannot itself be skipped into a further make-good)"
        side_effects:
          - "create make-good Insertion{is_make_good=true, makes_good_insertion_id=this.id, sequence_number=this.sequence_number, cost_cents=0, status=SCHEDULED, scheduled_date=this.scheduled_date + 7 days}"
          - "recompute notice.compliance_status"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /insertions/{id}/cancel"
        actor: Advertiser
        preconditions:
          - "insertion.status == SCHEDULED"
          - "parent notice.status IN {SCHEDULED}"
        side_effects:
          - "no counter change (SCHEDULED insertions were never counted)"

  - entity: Proof
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /proofs/{id}/approve"
        actor: Advertiser
        preconditions:
          - "proof.status == PENDING"
        side_effects:
          - "parent notice SUBMITTED->PROOF_APPROVED"

      - from: PENDING
        to: REJECTED
        trigger: "POST /proofs/{id}/reject"
        actor: Advertiser
        preconditions:
          - "proof.status == PENDING"
        side_effects:
          - "parent notice SUBMITTED->DRAFT (revision cycle)"

  - entity: Affidavit
    initial_state: PENDING
    terminal_states: [VOID]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /affidavits/{id}/issue"
        actor: Publisher
        preconditions:
          - "affidavit.status == PENDING"
          - "parent notice.status == PUBLISHED"
          - "acting Publisher owns the notice's newspaper_id"
        side_effects:
          - "freeze publication_dates, set issued_at = clock"
          - "parent notice PUBLISHED->AFFIDAVIT_ISSUED"
          - "notice's DRAFT Invoice -> ISSUED; account.outstanding_balance recompute"

      - from: ISSUED
        to: VOID
        trigger: "POST /affidavits/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "affidavit.status == ISSUED"
          - "notice's Invoice.status != PAID (a paid invoice cannot be unwound by void)"
        side_effects:
          - "parent notice AFFIDAVIT_ISSUED->PUBLISHED"
          - "notice's ISSUED Invoice -> VOID; account.outstanding_balance recompute"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system: linked Affidavit is ISSUED (POST /affidavits/{id}/issue)"
        actor: system
        preconditions:
          - "invoice.status == DRAFT"
        side_effects:
          - "account.outstanding_balance_cents increases by invoice.total_cents"

      - from: ISSUED
        to: PAID
        trigger: "system: a Payment brings amount_paid_cents >= total_cents (POST /payments)"
        actor: system
        preconditions:
          - "invoice.status == ISSUED"
          - "invoice.amount_paid_cents >= invoice.total_cents after this payment"
        side_effects:
          - "account.outstanding_balance_cents decreases by the payment amount"

      - from: ISSUED
        to: VOID
        trigger: "system: linked Affidavit is voided (POST /affidavits/{id}/void)"
        actor: system
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "account.outstanding_balance_cents decreases by invoice.total_cents (compensation)"

# ----------------------------------------------------------------------------
# §1.2.1 CONCURRENCY RULES
# ----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: schedule-create-stale-notice
    parent_entity: Notice
    write_endpoint: "POST /notices/{id}/schedule"
    occ_field: "expected_notice_version"
    description: |
      Rescheduling a Notice (POST /notices/{id}/schedule from the SCHEDULED state)
      legitimately supersedes the prior schedule: it cancels the existing SCHEDULED
      insertions and mints a fresh set. If the notice.version has advanced since the
      client last read it — because an earlier writer already superseded the schedule
      and bumped the version — the current request carries a stale expected_notice_version
      and is rejected. Two strictly sequential reschedules, the second still quoting the
      pre-advance version, reproduce this deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# §1.3 CALCULATION RULES TABLE
# ============================================================================
calculations:
  - name: notice_cost
    trigger: "estimated: on POST /notices/{id}/submit (and recomputed on create). final: on the system transition Notice ...->PUBLISHED"
    algorithm: tiered_pricing
    formula: |
      # ---- pinned rounding order (mode-b): CEIL to whole lines PER INSERTION, then
      #      multiply by rate, then sum. NEVER sum characters across insertions and ceil once.
      def line_count(text):
          return ceil(len(text) / newspaper.chars_per_line)     # ceil is per-insertion
      def per_insertion_cost(seq, lc):
          if newspaper.pricing_basis == "PER_LINE":
              rate = newspaper.line_rate_first_cents if seq == 1 else newspaper.line_rate_subsequent_cents
              return lc * rate
          else:  # PER_WORD
              return notice.word_count * newspaper.word_rate_cents
    input_set: |
      estimated: seq = 1..required_insertions, each using lc = line_count(notice.body_text).
      final: only Insertion rows with status==PUBLISHED AND is_make_good==false, ordered by
      sequence_number ASC, each using lc = insertion.line_count_actual and its own sequence_number.
    constants:
      WEEK_DAYS: 7
    precision: "integer cents; no fractional rounding (rates and counts are integers)"
    variants:
      - name: estimated
        when: "at submit — projects required_insertions runs of the submitted copy"
        difference: "uses notice.line_count for every insertion and assumes exactly required_insertions runs"
      - name: final
        when: "at Notice PUBLISHED — bills what actually ran"
        difference: "uses each PUBLISHED non-make-good insertion's line_count_actual and excludes SKIPPED/CANCELLED/make-good insertions, so it diverges from estimated whenever a paper reformats copy or a run is skipped"

  - name: account_balance
    trigger: "recomputed on every Invoice status change and on POST /payments; read on GET /accounts/{id}"
    algorithm: aggregation
    formula: |
      outstanding = sum(Invoice.total_cents where account_id==A and status=="ISSUED")
                    - sum(Payment.amount_cents where account_id==A)
      committed   = outstanding
                    + sum(Invoice.total_cents where account_id==A and status=="DRAFT")
    input_set: "All invoices of the account; ISSUED feed 'outstanding', DRAFT additionally feed 'committed'; VOID and PAID contribute 0 to outstanding (PAID's total is netted by its payments)."
    constants: {}
    precision: "integer cents"
    variants:
      - name: outstanding
        when: "settled view — money actually owed on issued affidavits"
        difference: "excludes DRAFT (not-yet-affidavited) invoices"
      - name: committed
        when: "exposure view — used by the credit-limit gate at submit"
        difference: "adds DRAFT invoices, so a notice that is PUBLISHED-but-not-yet-affidavited still consumes credit"

  - name: invoice_total
    trigger: "on Invoice creation (system, at Notice ...->PUBLISHED)"
    algorithm: threshold
    formula: |
      # ---- pinned evaluation order (mode-c circular-looking): the affidavit fee depends on
      #      the subtotal tier, and the total depends on the fee. Evaluate strictly:
      #   (1) subtotal_cents = notice.final_cost_cents        # sum of per-insertion line charges
      #   (2) affidavit_fee_cents = 0 if subtotal_cents >= AFFIDAVIT_WAIVER_THRESHOLD_CENTS
      #                             else newspaper.affidavit_fee_cents
      #   (3) total_cents = subtotal_cents + affidavit_fee_cents
      subtotal_cents = notice.final_cost_cents
      affidavit_fee_cents = 0 if subtotal_cents >= AFFIDAVIT_WAIVER_THRESHOLD_CENTS else newspaper.affidavit_fee_cents
      total_cents = subtotal_cents + affidavit_fee_cents
    input_set: "The single notice being billed; subtotal is its final_cost_cents."
    constants:
      AFFIDAVIT_WAIVER_THRESHOLD_CENTS: 3000
    precision: "integer cents"

  - name: insertion_schedule
    trigger: "on POST /notices/{id}/schedule"
    algorithm: interval_merge
    formula: |
      dates = [ first_publication_date + 7*k for k in 0..required_insertions-1 ]   # weekly, consecutive
      for d in dates:
          require d.weekday() == newspaper.publication_weekday          # else ERR_INVALID_PUBLICATION_DAY
          require not any(start <= d < end for [start,end] in newspaper.blackout_dates)  # half-open; else ERR_BLACKOUT_DATE
      require max(dates) <= notice.deadline_date - min_days_before_deadline days        # else ERR_INSERTION_AFTER_DEADLINE
      for d in dates:                                                                    # edition aggregate capacity
          occupied = sum(Insertion.line_count for Insertion in edition(newspaper_id,d) where status in {SCHEDULED,PUBLISHED})
          require occupied + notice.line_count <= newspaper.edition_line_capacity        # else ERR_EDITION_CAPACITY_EXCEEDED
    input_set: "Generated dates for this notice plus the existing SCHEDULED/PUBLISHED insertions sharing each (newspaper_id, date) edition."
    constants:
      WEEK_DAYS: 7
    precision: "whole calendar days"

  - name: compliance_status
    trigger: "recomputed whenever an Insertion of the notice changes state (publish/skip/cancel)"
    algorithm: threshold
    formula: |
      if notice.insertions_published < notice.required_insertions:
          return "PENDING"
      published = [ i for i in Insertion(notice) if i.status == "PUBLISHED" ]     # includes make-goods
      last_date = max(i.published_date for i in published)
      # boundary: on-or-before is COMPLIANT (<=), one day past the cutoff is NON_COMPLIANT
      if last_date <= notice.deadline_date - min_days_before_deadline days:
          return "COMPLIANT"
      return "NON_COMPLIANT"
    input_set: "PUBLISHED insertions of the notice (make-goods included) vs required_insertions and the statutory cutoff."
    constants: {}
    precision: "whole calendar days"

# ============================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc when used by PlatformAdmin"

  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7; entity_backed roles must own the target resource (Advertiser owns notice.account_id; Publisher owns insertion/affidavit newspaper_id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all business endpoints"

  - priority: 3
    category: existence
    check: "every path/body id resolves to a live resource, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with an id path segment or FK body field"

  - priority: 4
    category: state
    check: "target resource is in a state that permits the requested transition (see §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 5
    category: business_referential
    check: "newspaper.circulation_qualified == true AND notice.county == newspaper.county"
    error_id: ERR_NEWSPAPER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /notices/{id}/schedule"

  - priority: 6
    category: business_safety
    check: "a StatutoryRequirement row exists for (notice.notice_type, notice.county)"
    error_id: ERR_STATUTORY_REQUIREMENT_MISSING
    http_status: 422
    applies_to: "POST /notices (compute required_insertions), POST /notices/{id}/schedule"

  - priority: 7
    category: business_temporal
    check: "no generated insertion date falls on a non-publication weekday, none inside a blackout range, and the LAST insertion date <= deadline_date - min_days_before_deadline; on /publish, clock >= scheduled_date"
    error_id: ERR_INSERTION_AFTER_DEADLINE
    http_status: 422
    applies_to: "POST /notices/{id}/schedule, POST /notices/{id}/insertions, POST /insertions/{id}/publish"
    note: "sub-errors ERR_INVALID_PUBLICATION_DAY, ERR_BLACKOUT_DATE, ERR_PUBLISH_BEFORE_SCHEDULED share this temporal band; the deadline check is the canonical priority-7 row"

  - priority: 8
    category: business_constraint
    check: "consecutive-week adjacency: a manually added insertion date must be EXACTLY 7 days from the nearest existing active (SCHEDULED/PUBLISHED) insertion of the same notice — a larger gap or a same-day collision is rejected; AND edition aggregate capacity: occupied lines + notice.line_count <= newspaper.edition_line_capacity"
    error_id: ERR_INSERTION_SPACING_VIOLATION
    http_status: 409
    applies_to: "POST /notices/{id}/insertions, POST /notices/{id}/schedule"
    note: "spacing/adjacency uses exact 7-day gap geometry (ERR_INSERTION_SPACING_VIOLATION); edition-capacity uses aggregate line summation (ERR_EDITION_CAPACITY_EXCEEDED) — two distinct interval semantics at this band"

  - priority: 9
    category: business_fiscal
    check: "account.committed_balance_cents + notice.estimated_cost_cents <= account.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /notices/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "payment amount_cents > 0 and <= (invoice.total_cents - invoice.amount_paid_cents)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /payments"

# ============================================================================
# §1.5 API ENDPOINT TABLE
# ============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Sets the server's current UTC instant. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["advances the logical clock used by /publish, affidavit issued_at, and compliance cutoffs"]

  - method: POST
    path: "/newspapers"
    description: "Register a newspaper of record"
    roles: [PlatformAdmin]
    code: 201
    input: [name, county, "circulation_qualified?", pricing_basis, chars_per_line, line_rate_first_cents, line_rate_subsequent_cents, word_rate_cents, affidavit_fee_cents, edition_line_capacity, publication_weekday, "blackout_dates?"]
    output: Newspaper
    side_effects: []

  - method: GET
    path: "/newspapers/{id}"
    description: "Fetch a newspaper"
    roles: [PlatformAdmin, Advertiser, Publisher, ComplianceOfficer]
    code: 200
    input: []
    output: Newspaper
    side_effects: []

  - method: POST
    path: "/accounts"
    description: "Create an advertiser account"
    roles: [PlatformAdmin]
    code: 201
    input: [name, account_type, "credit_limit_cents?", "status?"]
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts/{id}"
    description: "Fetch an account, including computed outstanding_balance_cents and committed_balance_cents"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: []
    output: Account
    side_effects: ["recomputes account_balance variants for the response"]

  - method: POST
    path: "/statutory-requirements"
    description: "Define the statutory publication rule for a (notice_type, county); (notice_type, county) is unique"
    roles: [PlatformAdmin]
    code: 201
    input: [notice_type, county, min_insertions, min_days_before_deadline]
    output: StatutoryRequirement
    side_effects: []

  - method: GET
    path: "/statutory-requirements"
    description: "List statutory requirements; filterable"
    roles: [PlatformAdmin, Advertiser, ComplianceOfficer]
    code: 200
    input: ["notice_type?", "county?", "limit?", "offset?"]
    output: StatutoryRequirement[]
    side_effects: []

  - method: POST
    path: "/notices"
    description: "Create a DRAFT notice; server looks up the matching StatutoryRequirement to set required_insertions and computes word_count, line_count, estimated_cost_cents"
    roles: [Advertiser]
    code: 201
    input: [account_id, newspaper_id, notice_type, county, title, body_text, deadline_date]
    output: Notice
    side_effects: ["compute word_count, line_count, required_insertions, estimated_cost_cents (calculations.notice_cost estimated)"]

  - method: GET
    path: "/notices/{id}"
    description: "Fetch a notice with all computed fields"
    roles: [PlatformAdmin, Advertiser, Publisher, ComplianceOfficer]
    code: 200
    input: []
    output: Notice
    side_effects: []

  - method: GET
    path: "/notices"
    description: "Digital archive search: list notices with filters and pagination; ordered by created_at ASC"
    roles: [PlatformAdmin, Advertiser, Publisher, ComplianceOfficer]
    code: 200
    input: ["account_id?", "newspaper_id?", "notice_type?", "county?", "status?", "compliance_status?", "limit?", "offset?"]
    output: Notice[]
    side_effects: []

  - method: POST
    path: "/notices/{id}/submit"
    description: "Submit a DRAFT notice for proofing (DRAFT->SUBMITTED); enforces credit-limit gate"
    roles: [Advertiser]
    code: 200
    input: []
    output: Notice
    side_effects: ["create Proof(PENDING)"]

  - method: GET
    path: "/notices/{id}/proofs"
    description: "Reverse-reachability GET for Proof.notice_id; returns 0..N proofs ordered by created_at ASC"
    roles: [PlatformAdmin, Advertiser, ComplianceOfficer]
    code: 200
    input: []
    output: Proof[]
    side_effects: []

  - method: POST
    path: "/proofs/{id}/approve"
    description: "Advertiser approves the proof (PENDING->APPROVED); bubbles notice SUBMITTED->PROOF_APPROVED"
    roles: [Advertiser]
    code: 200
    input: ["reviewer_note?"]
    output: Proof
    side_effects: ["notice SUBMITTED->PROOF_APPROVED"]

  - method: POST
    path: "/proofs/{id}/reject"
    description: "Advertiser rejects the proof (PENDING->REJECTED); bubbles notice SUBMITTED->DRAFT for revision"
    roles: [Advertiser]
    code: 200
    input: ["reviewer_note?"]
    output: Proof
    side_effects: ["notice SUBMITTED->DRAFT"]

  - method: POST
    path: "/notices/{id}/schedule"
    description: "Generate the consecutive-weekly insertion run (PROOF_APPROVED->SCHEDULED, or SCHEDULED->SCHEDULED reschedule/supersede). OCC-guarded on the notice version."
    roles: [Advertiser]
    code: 201
    input: [first_publication_date, expected_notice_version]
    output: Notice
    side_effects: ["create required_insertions Insertion rows (calculations.insertion_schedule)", "on reschedule: cancel prior SCHEDULED insertions", "increments Notice.version by 1"]

  - method: GET
    path: "/notices/{id}/insertions"
    description: "Reverse-reachability GET for Insertion.notice_id; returns insertions ordered by scheduled_date ASC then created_at ASC"
    roles: [PlatformAdmin, Advertiser, Publisher, ComplianceOfficer]
    code: 200
    input: []
    output: Insertion[]
    side_effects: []

  - method: POST
    path: "/notices/{id}/insertions"
    description: "Manually add one extra insertion to a SCHEDULED notice (spacing-buffer and edition-capacity checked)"
    roles: [Advertiser]
    code: 201
    input: [scheduled_date]
    output: Insertion
    side_effects: ["sequence_number = max existing sequence_number + 1", "notice.required coverage unaffected (extra runs are advertiser-elected)"]

  - method: GET
    path: "/insertions/{id}"
    description: "Fetch one insertion"
    roles: [PlatformAdmin, Advertiser, Publisher, ComplianceOfficer]
    code: 200
    input: []
    output: Insertion
    side_effects: []

  - method: GET
    path: "/insertions"
    description: "List insertions; filters cover the Insertion.newspaper_id FK, edition queries, and the self-referential makes_good_insertion_id FK; ordered by scheduled_date ASC then created_at ASC"
    roles: [PlatformAdmin, Advertiser, Publisher, ComplianceOfficer]
    code: 200
    input: ["notice_id?", "newspaper_id?", "scheduled_date?", "status?", "makes_good_insertion_id?", "limit?", "offset?"]
    output: Insertion[]
    side_effects: []

  - method: POST
    path: "/insertions/{id}/publish"
    description: "Publisher records that an insertion ran (SCHEDULED->PUBLISHED); books cost and bubbles the notice"
    roles: [Publisher]
    code: 200
    input: [line_count_actual]
    output: Insertion
    side_effects: ["set published_date, cost_cents; increment insertions_published; increment paid_insertion_count unless make-good; bubble notice to RUNNING/PUBLISHED (which may create Affidavit+Invoice)"]

  - method: POST
    path: "/insertions/{id}/skip"
    description: "Publisher records a missed run (SCHEDULED->SKIPPED); auto-creates a free make-good insertion 7 days later"
    roles: [Publisher]
    code: 200
    input: []
    output: Insertion
    side_effects: ["create make-good Insertion (is_make_good=true, cost_cents=0)", "recompute compliance_status"]

  - method: POST
    path: "/insertions/{id}/cancel"
    description: "Advertiser cancels a still-SCHEDULED insertion (SCHEDULED->CANCELLED)"
    roles: [Advertiser]
    code: 200
    input: []
    output: Insertion
    side_effects: []

  - method: GET
    path: "/notices/{id}/affidavits"
    description: "Reverse-reachability GET for Affidavit.notice_id; returns 0..N affidavits ordered by created_at ASC"
    roles: [PlatformAdmin, Advertiser, Publisher, ComplianceOfficer]
    code: 200
    input: []
    output: Affidavit[]
    side_effects: []

  - method: GET
    path: "/affidavits/{id}"
    description: "Fetch one affidavit"
    roles: [PlatformAdmin, Advertiser, Publisher, ComplianceOfficer]
    code: 200
    input: []
    output: Affidavit
    side_effects: []

  - method: POST
    path: "/affidavits/{id}/issue"
    description: "Publisher swears and issues the affidavit of publication (PENDING->ISSUED); issues the notice's invoice"
    roles: [Publisher]
    code: 200
    input: [sworn_by]
    output: Affidavit
    side_effects: ["notice PUBLISHED->AFFIDAVIT_ISSUED", "Invoice DRAFT->ISSUED", "recompute account.outstanding_balance_cents"]

  - method: POST
    path: "/affidavits/{id}/void"
    description: "Compliance voids an issued affidavit (ISSUED->VOID); unwinds billing"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: Affidavit
    side_effects: ["notice AFFIDAVIT_ISSUED->PUBLISHED", "Invoice ISSUED->VOID", "recompute account.outstanding_balance_cents"]

  - method: GET
    path: "/invoices/{id}"
    description: "Fetch one invoice"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "Reverse-reachability GET for Invoice.account_id and Invoice.notice_id; ordered by created_at ASC"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: ["account_id?", "notice_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/invoice-line-items/{id}"
    description: "Fetch one invoice line item"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: []
    output: InvoiceLineItem
    side_effects: []

  - method: GET
    path: "/invoice-line-items"
    description: "Reverse-reachability GET for InvoiceLineItem.invoice_id and InvoiceLineItem.insertion_id; ordered by created_at ASC"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: ["invoice_id?", "insertion_id?", "limit?", "offset?"]
    output: InvoiceLineItem[]
    side_effects: []

  - method: POST
    path: "/payments"
    description: "Record a payment against an ISSUED invoice; may drive it to PAID"
    roles: [Advertiser]
    code: 201
    input: [invoice_id, amount_cents]
    output: Payment
    side_effects: ["increment invoice.amount_paid_cents; if >= total_cents then Invoice ISSUED->PAID; recompute account.outstanding_balance_cents"]

  - method: GET
    path: "/payments/{id}"
    description: "Fetch one payment"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "Reverse-reachability GET for Payment.account_id and Payment.invoice_id; ordered by created_at ASC"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: ["account_id?", "invoice_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/notices/{id}/archive"
    description: "Compliance archives an affidavited notice (AFFIDAVIT_ISSUED->ARCHIVED); it stays query-visible but read-only"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Notice
    side_effects: ["notice becomes read-only in the digital archive"]

# ============================================================================
# §1.6 ERROR CODE CATALOG
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation, or entity_backed role does not own the target resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced resource (path id or FK body field) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state that permits the requested transition"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field, wrong type, or invalid enum value"
  - id: ERR_NEWSPAPER_NOT_QUALIFIED
    http: 422
    condition: "newspaper.circulation_qualified == false, or notice.county != newspaper.county, at schedule time"
  - id: ERR_STATUTORY_REQUIREMENT_MISSING
    http: 422
    condition: "no StatutoryRequirement matches (notice_type, county)"
  - id: ERR_INVALID_PUBLICATION_DAY
    http: 422
    condition: "an insertion date does not fall on newspaper.publication_weekday"
  - id: ERR_BLACKOUT_DATE
    http: 422
    condition: "an insertion date falls inside a half-open blackout range [start, end)"
  - id: ERR_INSERTION_AFTER_DEADLINE
    http: 422
    condition: "the last insertion date is later than deadline_date - min_days_before_deadline days"
  - id: ERR_PUBLISH_BEFORE_SCHEDULED
    http: 422
    condition: "POST /publish while clock < insertion.scheduled_date"
  - id: ERR_INSERTION_SPACING_VIOLATION
    http: 409
    condition: "a manually added insertion date is not exactly 7 days from the nearest active insertion of the same notice (consecutive-week adjacency broken)"
  - id: ERR_EDITION_CAPACITY_EXCEEDED
    http: 409
    condition: "occupied edition lines + notice.line_count exceeds newspaper.edition_line_capacity"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "committed_balance_cents + estimated_cost_cents would exceed account.credit_limit_cents at submit"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "submit attempted while account.status == SUSPENDED"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "payment amount_cents <= 0 or exceeds invoice.total_cents - invoice.amount_paid_cents"
  - id: ERR_INVOICE_PAID_LOCK
    http: 409
    condition: "affidavit void attempted while the notice's invoice is PAID"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_notice_version does not match the current notice.version on a reschedule (OCC)"
  - id: ERR_MAKE_GOOD_NOT_SKIPPABLE
    http: 409
    condition: "POST /skip on an insertion whose is_make_good == true"

# ============================================================================
# §1.7 RBAC MATRIX
# ============================================================================
roles:
  - name: Advertiser
    description: "Law firm / agency / individual placing legal notices; owns its account's notices, proofs, insertions (scheduling), invoices, and payments"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /notices"
      - "POST /notices/{id}/submit"
      - "POST /proofs/{id}/approve"
      - "POST /proofs/{id}/reject"
      - "POST /notices/{id}/schedule"
