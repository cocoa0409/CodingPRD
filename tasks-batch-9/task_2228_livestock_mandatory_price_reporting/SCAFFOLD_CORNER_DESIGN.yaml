              payload: { reporting_entity_id: "${ent_e}", plant_code: "EST-801", species: "CATTLE", annual_head_history: { "2021": 130000, "2023": 130000, "2024": 130000, "2025": 130000 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500 }
              as: ProgramAdmin
            - call: "POST /reporting-entities"
              payload: { legal_name: "Foxtrot Foods", entity_type: "PACKER", species_scope: "CATTLE" }
