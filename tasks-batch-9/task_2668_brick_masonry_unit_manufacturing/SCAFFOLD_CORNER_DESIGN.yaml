            - call: "POST /orders"
              payload: { order_code: "O1", jobsite_grid_x: 30, jobsite_grid_y: 30, requested_units: 9600, color_family: "RED", texture: "WIRE_CUT", durability_grade: "SW", unloading_equipment_required: "TRUCK_MOUNTED_FORKLIFT", banding_type: "STEEL" }
              as: SalesRep
              as_user_id: "sales-001"
