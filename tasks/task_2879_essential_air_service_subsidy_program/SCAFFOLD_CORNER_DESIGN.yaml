        distinguishing_aspect: "Nothing about the award is deferred: the 201 body already carries every computed field of the new agreement, including the baseline fuel index copied from the published month and the obligation ledger, and the reads that follow immediately show the solicitation, the proposals and the community already in their post-cascade state."
        test_recipe:
          setup:
            - "A 2.4000 fuel index published for 2026-08, community HYS ELIGIBLE, CLOSED solicitation with one candidate at 1600000.00 for 24 months."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/fuel-indices"
              payload: { index_month: "2026-08", price_per_gallon_usd: 2.4000 }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /eas/proposals/${p1_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /eas/solicitations/${sol_id}/selection-order"
              payload: { order_note: "award to sole candidate" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { agr_id: $.data.id }
            - call: "GET /eas/service-agreements/${agr_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /eas/solicitations/${sol_id}"
              payload: {}
              as: SelectionOfficer
              as_user_id: "officer-1"
            - call: "GET /eas/proposals/${p1_id}"
              payload: {}
              as: SelectionOfficer
              as_user_id: "officer-1"
            - call: "GET /eas/communities/${comm_id}"
              payload: {}
              as: SelectionOfficer
              as_user_id: "officer-1"
            - call: "GET /eas/service-agreements"
              payload: { community_id: "${comm_id}", status: "ACTIVE" }
              as: ProgramAdmin
          assert:
            - "The 201 selection-order body already contains min_weekly_round_trips == 12, min_monthly_seats == floor(12 * 2 * 19 * 52 / 12) == 1976, annual_block_hours == 12 * 2 * 52 * 1.5 == 1872.0 and baseline_fuel_index_usd == 2.4000"
            - "That same body carries rate_effective_from == 2026-08-01T00:00:00.000Z, rate_effective_to == 2027-08-01T00:00:00.000Z, total_committed_usd == round(1600000.00 * 24 / 12, 2) == 3200000.00, disbursed_to_date_usd == 0.00 and obligated_remaining_usd == 3200000.00"
            - "The immediately following GET /eas/service-agreements/${agr_id} returns byte-identical field values to the 201 body, with no field null that was populated there"
            - "GET /eas/solicitations/${sol_id} already reports status AWARDED with selected_proposal_id == ${p1_id} and candidate_count_at_award == 1"
            - "GET /eas/proposals/${p1_id} already reports evaluation_state SELECTED with composite_score == 60.0000"
            - "GET /eas/communities/${comm_id} already reports status SUBSIDIZED with active_agreement_count == 1"
            - "GET /eas/service-agreements filtered by community_id ${comm_id} and status ACTIVE already returns that one agreement with total_count == 1"
