        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C50
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
      - call: POST /api/provider-accounts
        payload:
          name: Hold Provider
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /api/prior-authorizations
        payload:
          drug_id: ${drug_id}
          member_id: MEM-H1
          diagnosis_code: C50
          requested_start_date: '2026-07-01'
          requested_dose_mg: 100
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          auth_id: $.data.id
      - call: POST /api/prior-authorizations/${auth_id}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
      - call: POST /api/claims
        payload:
          auth_id: ${auth_id}
          drug_id: ${drug_id}
          service_date: '2026-07-15'
          site_of_care: HOPD
          sourcing_path: BUY_AND_BILL
          j_code_billed: J8300
          billed_units: 2
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          claim_a: $.data.id
      - call: POST /api/claims/${claim_a}/pay
        payload: {}
        as: PlanAdmin
      - call: POST /api/claims
        payload:
          auth_id: ${auth_id}
          drug_id: ${drug_id}
          service_date: '2026-07-15'
          site_of_care: HOPD
          sourcing_path: BUY_AND_BILL
          j_code_billed: J8300
          billed_units: 2
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          claim_b: $.data.id
      - call: POST /api/asp-schedules
        payload:
          drug_id: ${drug_id}
          effective_start: '2026-01-01'
          asp_rate_cents: 400
        as: PlanAdmin
      trigger:
      - call: POST /api/claims/${claim_b}/pay
        payload: {}
        as: PlanAdmin
        captures:
          err_1: $.data.error_id
      - call: POST /api/provider-accounts/${prov_id}/settle-recoupment
        payload: {}
        as: PlanAdmin
        captures:
          prov_after: $.data.status
      - call: POST /api/claims/${claim_b}/pay
        payload: {}
        as: PlanAdmin
        captures:
