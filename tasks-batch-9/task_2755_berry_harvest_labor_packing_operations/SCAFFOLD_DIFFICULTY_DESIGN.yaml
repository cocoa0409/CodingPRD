          trigger:
            - call: "POST /berry-ops/fruit-lots/${lot2}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T12:00:00Z", planned_cool_end_at: "2026-08-03T16:00:00Z", entry_pulp_temp_f: 56.0, pallet_slots: 1, expected_cooling_tunnel_version: "${tun_v2}" }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { err: $.data.error_id }
            - call: "POST /berry-ops/fruit-lots/${lot2}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T13:00:00Z", planned_cool_end_at: "2026-08-03T17:00:00Z", entry_pulp_temp_f: 56.0, pallet_slots: 1, expected_cooling_tunnel_version: "${tun_v2}" }
              as: PackhouseOperator
