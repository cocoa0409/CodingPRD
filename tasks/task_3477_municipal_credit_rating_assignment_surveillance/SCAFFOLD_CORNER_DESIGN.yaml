            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-03-27T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-03-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /muni/disclosure-obligations/${ob1}/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss}"
          trigger:
            - call: "POST /muni/ratings/${rating_id}/reinstate"
              payload: {}
              as: SurveillanceOfficer
              captures: { r_status: $.data.status, r_notch: $.data.notch, r_posture: $.data.surveillance_posture }
            - call: "GET /muni/ratings/${rating_id}/disclosure-obligations"
              payload: {}
              as: SurveillanceOfficer
              captures: { ob2_period: "$.data[1].period_index", ob2_fye: "$.data[1].fiscal_year_end" }
          assert:
            - "reinstate returns 200: status == PUBLISHED, notch == A (== notch_at_withdrawal, restored not re-assigned), surveillance_posture == CURRENT"
            - "notch_history's last entry has cause REINSTATEMENT and notch A"
            - "the obligation chain resumes: a new obligation exists with period_index == 2 and fiscal_year_end == 2028-06-30T00:00:00Z"
            - "IssuerNotification log gains a RATING_REINSTATED entry"

      - name: review_item_begin_complete_happy_path
        claim_type: Valid Transition
        grounds:
          - state_machines.CriteriaReviewItem
        distinguishing_aspect: "A fanned-out review item walks PENDING -> IN_REVIEW -> COMPLETED_NO_ACTION; completion flips the rating's review_pending back to false and logs REVIEW_COMPLETED — the criteria-review lifecycle's no-change branch."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO rating PUBLISHED 2026-09-08T00:00:00Z; criteria GO-2026.2 activated at the same clock, creating a PENDING review item due 2026-12-07T00:00:00Z."
