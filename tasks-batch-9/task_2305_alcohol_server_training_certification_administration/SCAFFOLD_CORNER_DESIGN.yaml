            - "ClassSession.${sess2_id}.enrolled_count == 0 (the refused sponsorship consumed no seat)"
            - "the first registry submission returns 201 with RegistrySubmission.${sub1}.submission_state == 'TRANSMITTED', attempt_number == 1, transmitted_at == '2026-08-10T18:30:00Z', due_at == '2026-08-25T18:30:00Z', late_days == 0 and penalty_fee_cents == 0"
            - "Certificate.${cert_id}.registry_state == 'TRANSMITTED' and validity_state == 'ACTIVE'"
            - "the second registry submission returns 409 with error.code == 'ERR_CERTIFICATE_INVALID_STATE' and GET /certificates/${cert_id}/registry-submissions returns total_count 1"
            - "the first assignment returns 201 with ServerAssignment.${asg_id}.assignment_state == 'ACTIVE'"
            - "the second assignment returns 409 with error.code == 'ERR_DUPLICATE_ASSIGNMENT' and EmployerLocation.${loc_a_id}.assigned_server_count == 1"

  # =========================================================================
  # RBAC note: the positive half of the matrix (each role performing its own
  # exclusive_operations) is exercised throughout every instance in this file and in
  # SCAFFOLD_DIFFICULTY_DESIGN.yaml - ProgramAdmin builds each fixture, StateRegulator
  # decides approvals and acknowledges submissions, Trainer runs the roster/exam
  # operations, EmployerAdmin buys seats and manages locations, AlcoholServer enrolls
  # itself. The segregation-of-duties row for role_model is covered by the validations
  # instance proctor_separation_rejects_the_instructor_and_admits_a_second_certified_trainer.
  - section: rbac
    instances:
      - name: every_exclusive_operation_returns_forbidden_for_the_wrong_role
        claim_type: RBAC deny
        grounds:
          - rbac.ProgramAdmin.exclusive_operations
          - rbac.StateRegulator.exclusive_operations
          - rbac.Trainer.exclusive_operations
          - rbac.AlcoholServer
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          Five cross-role attempts all return ERR_ROLE_NOT_PERMITTED (403) at priority 2 -
          before any shape, path or state check - so a StateRegulator cannot author a
          course, a Trainer cannot enroll a server, an EmployerAdmin cannot launch a
          compliance run, an AlcoholServer cannot read a location dashboard, and even
          ProgramAdmin cannot render a regulatory decision.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction, a PUBLISHED ON_PREMISE course with a SUBMITTED TX approval, a CERTIFIED trainer, a server, and an employer with one location."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "initial filing" }
              as: ProgramAdmin
              captures: { appr_id: $.data.id }
            - call: "POST /course-approvals/${appr_id}/decision"
              payload: { decision: "APPROVE", approval_number: "TX-ABC-2026-001", effective_from: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: StateRegulator
            - call: "POST /trainers"
              payload: { full_name: "Dana Reyes", email: "dana@tips.example" }
              as: ProgramAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /trainers/${tr_id}/credential"
              payload: { certified_tracks: ["ON_PREMISE"], certified_state_codes: ["TX"], credential_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", trainer_id: "${tr_id}", scheduled_start_at: "2026-08-10T14:00:00Z", scheduled_end_at: "2026-08-10T18:00:00Z", capacity: 20 }
              as: ProgramAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /alcohol-servers"
              payload: { full_name: "Ari Cole", email: "ari@example.com", state_jurisdiction_id: "${tx_id}" }
              as: ProgramAdmin
              captures: { srv_a: $.data.id }
            - call: "POST /employer-accounts"
              payload: { legal_name: "Lone Star Taverns LLC", billing_state_code: "TX" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employer-accounts/${emp_id}/locations"
              payload: { location_name: "Alamo Taproom", state_jurisdiction_id: "${tx_id}", premise_type: "ON_PREMISE", annual_premium_cents: 4821734 }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { loc_a_id: $.data.id }
          trigger:
            - call: "POST /courses"
              payload: { title: "Regulator-authored course", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: StateRegulator
            - call: "POST /enrollments"
              payload: { class_session_id: "${sess_id}", alcohol_server_id: "${srv_a}", expected_class_session_version: "${sess_v}" }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /compliance-runs"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${emp_id}"
            - call: "GET /employer-locations/${loc_a_id}/compliance-dashboard"
              payload: {}
              as: AlcoholServer
              as_user_id: "${srv_a}"
            - call: "POST /course-approvals/${appr_id}/decision"
              payload: { decision: "REJECT", changes_requested_note: "admin overreach" }
              as: ProgramAdmin
          assert:
            - "all five calls return 403 with error.code == 'ERR_ROLE_NOT_PERMITTED'"
            - "GET /courses returns total_count 1 (the regulator's course was never created)"
            - "ClassSession.${sess_id}.enrolled_count == 0 and GET /enrollments returns total_count 0"
            - "CourseApproval.${appr_id}.approval_status is still 'APPROVED' (the ProgramAdmin decision did not apply)"
            - "the AlcoholServer denial is a role denial, not ERR_NOT_RESOURCE_OWNER: the dashboard endpoint does not list AlcoholServer at all"

      - name: a_trainer_cannot_drive_another_trainers_roster
        claim_type: RBAC deny
        grounds:
          - rbac.Trainer.ownership_rule
          - validations.priority_5_ERR_NOT_RESOURCE_OWNER
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: |
          Elm Ortiz holds the Trainer role and is CERTIFIED for the same track and state,
          so the role check at priority 2 passes; ownership at priority 5 still rejects her
          lock-roster and attendance calls on Dana's session with ERR_NOT_RESOURCE_OWNER
          (403), and Dana's own call then succeeds.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction, an APPROVED ON_PREMISE course, two CERTIFIED ON_PREMISE/TX trainers Dana Reyes and Elm Ortiz."
            - "Dana owns a SCHEDULED session holding Ari's seat."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
