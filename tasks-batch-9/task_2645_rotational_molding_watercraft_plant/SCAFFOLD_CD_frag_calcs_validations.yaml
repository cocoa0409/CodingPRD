            - "storing fu2 at WH-CVF fails 409 ERR_WAREHOUSE_FROZEN even though rung 73 and rung 74 are ALSO violated by the same request: zone Z1 would need 1.0500 - 1.0000 - 0.5000 == -0.4500 m3 (nested candidate, because Z1 already anchors PM-CVF) and the bucket is at its cap. The lowest violated rung, 40, owns the response"
