# =============================================================================
# §1.6 Error Code Catalog
# Every id below is referenced by at least one §1.4 validation row or one §1.2
# transition precondition, and every id is triggerable through §1.5.
# =============================================================================
errors:
  # ---------------------------------------------------------------- auth ---
  - id: ERR_MISSING_USER_ID
    http: 401
    condition: "X-User-ID or X-User-Role header absent or empty (validations[priority=1])"
  - id: ERR_UNKNOWN_USER
    http: 401
    condition: "X-User-Role is CedentUnderwriter or ReinsurerUnderwriter and X-User-ID is not the id of any Cedent / Reinsurer respectively (validations[priority=2])"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not listed in the called endpoint's roles (validations[priority=3])"
  - id: ERR_FOREIGN_RESOURCE
    http: 403
    condition: "an entity_backed role acts on a resource belonging to another instance of its backing entity — CedentUnderwriter whose X-User-ID != Program.cedent_id, or ReinsurerUnderwriter whose X-User-ID != MarketSubmission.reinsurer_id / Quote.reinsurer_id / SigningLine.reinsurer_id (validations[priority=4])"

  # -------------------------------------------------------- request shape ---
  - id: ERR_VALIDATION
    http: 400
    condition: "a required input field is missing, a field has the wrong type, an enum value is outside its declared set, a numeric value violates its declared range or decimal width, or a pagination param is non-integer / negative / limit < 1 / limit > 100 (validations[priority=5,6,7])"

  # ------------------------------------------------------------ existence ---
  - id: ERR_CEDENT_NOT_FOUND
    http: 404
    condition: "cedent_id in the path or in POST /programs body matches no Cedent (validations[priority=8])"
  - id: ERR_REINSURER_NOT_FOUND
    http: 404
    condition: "reinsurer_id in the path or in POST /layers/{layer_id}/market-submissions body matches no Reinsurer (validations[priority=9])"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id in the path matches no Program (validations[priority=10])"
  - id: ERR_PRIOR_PROGRAM_NOT_FOUND
    http: 404
    condition: "prior_program_id supplied to POST /programs matches no Program (validations[priority=11])"
  - id: ERR_EXPOSURE_SUBMISSION_NOT_FOUND
    http: 404
    condition: "submission_id in the path matches no ExposureSubmission (validations[priority=12])"
  - id: ERR_LAYER_NOT_FOUND
    http: 404
    condition: "layer_id in the path matches no Layer (validations[priority=13])"
  - id: ERR_MARKET_SUBMISSION_NOT_FOUND
    http: 404
    condition: "market_submission_id in the path matches no MarketSubmission (validations[priority=14])"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "quote_id in the path matches no Quote (validations[priority=15])"
  - id: ERR_SIGNING_LINE_NOT_FOUND
    http: 404
    condition: "signing_line_id in the path, or in a fiduciary-transaction / cession-dispute / collection body, matches no SigningLine (validations[priority=16])"
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "disclosure_id in the path matches no BrokerageDisclosure (validations[priority=17])"
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "transaction_id in the path, or reverses_transaction_id in the body, matches no FiduciaryTransaction (validations[priority=18])"
  - id: ERR_CLAIM_ADVOCACY_NOT_FOUND
    http: 404
    condition: "claim_advocacy_id in the path matches no ClaimAdvocacy (validations[priority=19])"
  - id: ERR_CESSION_DISPUTE_NOT_FOUND
    http: 404
    condition: "dispute_id in the path matches no CessionDispute (validations[priority=20])"

  # ------------------------------------------------------- own-state gates ---
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "the Program's placement_status does not permit the requested transition, or a child write is attempted from a placement_status that forbids it (validations[priority=21] own-state, validations[priority=32] cross-entity)"
  - id: ERR_DOCUMENT_SEQUENCE_INVALID
    http: 409
    condition: "the filed document_type is not the successor of Program.documentation_status in the SLIP -> WORDING_DRAFT -> AGREED_WORDING -> EXECUTED_CONTRACT chain (validations[priority=22])"
  - id: ERR_SUBMISSION_STATE_INVALID
    http: 409
    condition: "the ExposureSubmission's status does not permit submit-for-review / signoff / revise (validations[priority=23])"
  - id: ERR_LAYER_STATE_INVALID
    http: 409
    condition: "the Layer's status does not permit patch / market-submission / sign-down (validations[priority=24]); claim notification against a non-BOUND layer raises ERR_LAYER_NOT_BOUND instead"
  - id: ERR_MARKET_SUBMISSION_CLOSED
    http: 409
    condition: "a quote is posted against a MarketSubmission whose status is not SENT (validations[priority=25])"
  - id: ERR_QUOTE_STATE_INVALID
    http: 409
    condition: "the Quote's status does not permit counter / requote / firm-order / decline (validations[priority=26])"
  - id: ERR_SIGNING_LINE_STATE_INVALID
    http: 409
    condition: "release is attempted on a SigningLine whose status is BOUND or already RELEASED (validations[priority=27])"
  - id: ERR_DISCLOSURE_STATE_INVALID
    http: 409
    condition: "disclose is attempted on a BrokerageDisclosure that is neither DRAFT nor REJECTED, or decision is attempted on one that is not DISCLOSED (validations[priority=28])"
  - id: ERR_TRANSACTION_STATE_INVALID
    http: 409
    condition: "approve / settle / reverse is attempted from a FiduciaryTransaction status that forbids it, including any write on a HELD row (validations[priority=29])"
  - id: ERR_ADVOCACY_STATE_INVALID
    http: 409
    condition: "review / withdraw / cession-dispute / advocacy-route / collection is attempted from a ClaimAdvocacy status that forbids it (validations[priority=30])"
  - id: ERR_DISPUTE_STATE_INVALID
    http: 409
    condition: "resolve is attempted on a CessionDispute whose status is not RAISED (validations[priority=31])"
  - id: ERR_LAYER_NOT_BOUND
    http: 409
    condition: "a claim advocacy is notified on a Layer whose status is not BOUND (validations[priority=33])"
  - id: ERR_DOCUMENTATION_NOT_AGREED
    http: 409
    condition: "settlement of a fiduciary transaction is attempted while Program.documentation_status is NOT_STARTED, SLIP_ISSUED, WORDING_DRAFTED or CERTAINTY_BREACHED (validations[priority=34])"

  # ------------------------------------------------ optimistic concurrency ---
  - id: ERR_STALE_LAYER_VERSION
    http: 412
    condition: "expected_layer_version in POST /quotes/{quote_id}/firm-order does not equal the current Layer.version (concurrency_rules[firm-order-stale-layer], validations[priority=35])"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version in POST /programs/{program_id}/fiduciary-transactions does not equal the current Program.version (concurrency_rules[fiduciary-booking-stale-program], validations[priority=36])"

  # ------------------------------------------------------- business safety ---
  - id: ERR_MARKET_SUSPENDED
    http: 422
    condition: "the target Reinsurer.security_status is SUSPENDED when a market submission or a firm order is attempted (validations[priority=37])"
  - id: ERR_LEAD_NOT_AUTHORISED
    http: 422
    condition: "is_lead=true is quoted or firm-ordered by a Reinsurer whose lead_authorised is false (validations[priority=38])"
  - id: ERR_CEDENT_SUSPENDED
    http: 422
    condition: "go-to-market is attempted while the owning Cedent.status is SUSPENDED (validations[priority=39])"
  - id: ERR_SIGNOFF_SCORE_TOO_LOW
    http: 422
    condition: "signoff with decision=SIGNED_OFF is attempted while ExposureSubmission.completeness_score < SIGNOFF_MIN_SCORE (70.00) (validations[priority=40])"
  - id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http: 422
    condition: "bind is attempted while Program.disclosure_acknowledged is false (validations[priority=41])"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "the ComplianceOfficer approving a fiduciary transaction has the same X-User-ID as its created_by_user_id (validations[priority=42])"

  # ----------------------------------------------------- business temporal ---
  - id: ERR_TREATY_PERIOD_INVALID
    http: 422
    condition: "expiry_date <= inception_date, or inception_date's UTC calendar year != underwriting_year (validations[priority=43])"
  - id: ERR_DEADLINE_NOT_IN_FUTURE
    http: 422
    condition: "response_deadline or expires_at is <= the current logical clock instant (validations[priority=44])"
  - id: ERR_RESPONSE_DEADLINE_PASSED
    http: 422
    condition: "a quote is posted after MarketSubmission.response_deadline (validations[priority=45])"
  - id: ERR_QUOTE_EXPIRED
    http: 422
    condition: "counter or firm-order is attempted at or after Quote.expires_at (validations[priority=46])"
  - id: ERR_EVENT_DATE_OUT_OF_PERIOD
    http: 422
    condition: "the claim event_date lies outside [Program.inception_date, Program.expiry_date) (validations[priority=47])"
  - id: ERR_CERTAINTY_NOT_BREACHED
    http: 422
    condition: "documentation-checkpoint is run at or before Program.contract_certainty_deadline, or when documentation_status is already WORDING_AGREED / EXECUTED (validations[priority=48])"

  # --------------------------------------------------- business constraint ---
  - id: ERR_DUPLICATE_NAME
    http: 409
    condition: "a Cedent or Reinsurer name already exists (case-insensitive) (validations[priority=49])"
  - id: ERR_OVERLAPPING_TREATY_PERIOD
    http: 409
    condition: "the new Program's half-open period [inception_date, expiry_date) overlaps an existing non-WITHDRAWN Program of the same cedent_id and line_of_business (validations[priority=50])"
  - id: ERR_RENEWAL_PRIOR_MISMATCH
    http: 422
    condition: "prior_program_id points at a Program with a different cedent_id or line_of_business, or with underwriting_year != this program's underwriting_year - 1 (validations[priority=51])"
  - id: ERR_LAYER_STRUCTURE_INVALID
    http: 422
    condition: "layer_type=QUOTA_SHARE with attachment_minor != 0 or cession_pct == 0, or layer_type IN {EXCESS_OF_LOSS, CATASTROPHE} with attachment_minor == 0 or cession_pct != 0 (validations[priority=52])"
  - id: ERR_SUBLIMIT_EXCEEDS_LIMIT
    http: 422
    condition: "sublimit_minor > limit_minor (validations[priority=53])"
  - id: ERR_DUPLICATE_MARKET_SUBMISSION
    http: 409
    condition: "a MarketSubmission with status IN {SENT, QUOTED} already exists for the same layer_id and reinsurer_id (validations[priority=54])"
  - id: ERR_LINE_EXCEEDS_OFFER
    http: 422
    condition: "accepted_line_pct > the quote's offered_line_pct (validations[priority=55])"
  - id: ERR_LINE_EXCEEDS_MAX_LINE
    http: 422
    condition: "accepted_line_pct > the quoting Reinsurer.max_line_pct (validations[priority=56])"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 422
    condition: "counter is attempted when Quote.negotiation_round is already MAX_NEGOTIATION_ROUNDS (3) (validations[priority=57])"
  - id: ERR_LAYER_NOT_OVERSUBSCRIBED
    http: 422
    condition: "sign-down is attempted on a Layer whose written_line_total_pct <= 100.0000 (validations[priority=58])"
  - id: ERR_LEAD_LINE_MISSING
    http: 422
    condition: "sign-down with Program.signdown_method=LEAD_PROTECTED is attempted on a Layer with no PROVISIONAL SigningLine whose quote is is_lead=true (validations[priority=59])"
  - id: ERR_DISCLOSURE_PCT_MISMATCH
    http: 422
    condition: "the BrokerageDisclosure.brokerage_pct being disclosed differs from Program.brokerage_pct (validations[priority=60])"
  - id: ERR_DUPLICATE_CLAIM_REFERENCE
    http: 409
    condition: "claim_reference already exists on the same Layer (validations[priority=61])"
  - id: ERR_TRANSACTION_TYPE_LINK_INVALID
    http: 422
    condition: "txn_type IN {REINSURER_REMITTANCE, REINSTATEMENT_PREMIUM, CLAIM_COLLECTION} booked without signing_line_id, txn_type IN {CEDENT_RECEIPT, BROKERAGE_DEDUCTION, CEDENT_PAYOUT} booked with signing_line_id, or txn_type=REMITTANCE_REVERSAL booked through the general endpoint instead of POST /fiduciary-transactions/{transaction_id}/reverse (validations[priority=62])"
  - id: ERR_LINE_LAYER_MISMATCH
    http: 422
    condition: "the referenced SigningLine's layer_id does not belong to the program in the path, or does not match the advocacy's layer_id (validations[priority=63])"
  - id: ERR_ALREADY_REVERSED
    http: 409
    condition: "reverse is attempted on a FiduciaryTransaction that already has a REMITTANCE_REVERSAL pointing at it (validations[priority=64])"
  - id: ERR_RESOLUTION_AMOUNT_INVALID
    http: 422
    condition: "settled_minor contradicts the chosen resolution — non-zero for UPHELD, != disputed_minor for WITHDRAWN, or outside (0, disputed_minor) for SETTLED_PARTIAL (validations[priority=65])"
  - id: ERR_COLLECTION_BLOCKED_BY_ARBITRATION
    http: 422
    condition: "a collection is attempted while ClaimAdvocacy.status is ADVOCACY_ARBITRATION or DISPUTED (validations[priority=66])"

  # -------------------------------------------------------- business fiscal ---
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "the firm order's committed capacity would push the reinsurer's WINDOWED_AT_FIRM_ORDER committed capacity above Reinsurer.capacity_limit_minor (validations[priority=67])"
  - id: ERR_AGGREGATE_LIMIT_EXHAUSTED
    http: 422
    condition: "the Layer has no remaining aggregate — limit_eroded_minor already equals limit_minor * (1 + reinstatements_total) (validations[priority=68])"
  - id: ERR_DISPUTE_EXCEEDS_CESSION
    http: 422
    condition: "the sum of disputed_minor across the advocacy's RAISED / UPHELD / SETTLED_PARTIAL disputes would exceed ClaimAdvocacy.ceded_claim_minor (validations[priority=69])"
  - id: ERR_COLLECTION_EXCEEDS_COLLECTIBLE
    http: 422
    condition: "ClaimAdvocacy.collected_minor plus this collection's amount_minor exceeds ClaimAdvocacy.collectible_minor; exact equality closes the file (validations[priority=70])"
  - id: ERR_INSUFFICIENT_FIDUCIARY_BALANCE
    http: 422
    condition: "settling an outflow would drive Program.fiduciary_holding_minor below 0 (validations[priority=71])"
  - id: ERR_PROGRAM_HAS_OPEN_TRANSACTIONS
    http: 409
    condition: "settle is attempted while any FiduciaryTransaction of the program has status IN {PENDING, APPROVED, HELD} (validations[priority=72])"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# Placement (BrokerPlacementLead) is separated from actuarial sign-off
# (BrokerActuary), from money movement (BrokerAccountant) and from control
# (ComplianceOfficer). The two market-facing counterparties are entity_backed.
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the brokerage platform: seeds the counterparty registry and drives the logical clock. Holds no placement, money or control authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /cedents"
      - "POST /reinsurers"
    shared_operations:
      - "GET /cedents, GET /cedents/{cedent_id}, GET /cedents/{cedent_id}/programs"
      - "GET /reinsurers, GET /reinsurers/{reinsurer_id}, GET /reinsurers/{reinsurer_id}/signing-lines, GET /reinsurers/{reinsurer_id}/market-submissions"
      - "GET /programs, GET /programs/{program_id} and every program sub-resource GET"
      - "GET /exposure-submissions/{submission_id}, GET /layers/{layer_id}, GET /layers/{layer_id}/market-submissions, GET /layers/{layer_id}/signing-lines, GET /layers/{layer_id}/claim-advocacies"
      - "GET /market-submissions/{market_submission_id}, GET /market-submissions/{market_submission_id}/quotes, GET /quotes, GET /quotes/{quote_id}"
      - "GET /signing-lines, GET /signing-lines/{signing_line_id}, GET /brokerage-disclosures/{disclosure_id}"
      - "GET /fiduciary-transactions, GET /fiduciary-transactions/{transaction_id}"
      - "GET /claim-advocacies/{claim_advocacy_id}, GET /claim-advocacies/{claim_advocacy_id}/cession-disputes, GET /cession-disputes, GET /cession-disputes/{dispute_id}"

  - name: BrokerPlacementLead
    description: "The placing broker. Structures the program, takes it to market, negotiates, firm-orders, signs down, binds, files contract documentation, and runs claims advocacy. Cannot sign off exposure data, cannot move fiduciary money, cannot approve or reverse a transaction, and cannot change a counterparty's security or suspension posture."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{program_id}/go-to-market"
      - "POST /programs/{program_id}/bind"
      - "POST /programs/{program_id}/withdraw"
      - "POST /programs/{program_id}/market-sweep"
      - "POST /programs/{program_id}/layers"
      - "PATCH /layers/{layer_id}"
      - "POST /programs/{program_id}/contract-documents"
      - "POST /exposure-submissions/{submission_id}/submit-for-review"
      - "POST /layers/{layer_id}/market-submissions"
      - "POST /layers/{layer_id}/sign-down"
      - "POST /quotes/{quote_id}/counter"
      - "POST /quotes/{quote_id}/firm-order"
      - "POST /signing-lines/{signing_line_id}/release"
      - "POST /claim-advocacies/{claim_advocacy_id}/review"
      - "POST /claim-advocacies/{claim_advocacy_id}/advocacy-route"
      - "POST /cession-disputes/{dispute_id}/resolve"
    shared_operations:
      - "POST /programs/{program_id}/exposure-submissions (with CedentUnderwriter)"
      - "POST /layers/{layer_id}/claim-advocacies (with CedentUnderwriter)"
      - "all read endpoints listed under PlatformAdmin.shared_operations"

  - name: BrokerActuary
    description: "Broker-side actuarial support. Signs off or rejects the cedent's exposure package and generates renewal analytics. Has no placement, binding or money authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /exposure-submissions/{submission_id}/signoff"
      - "POST /programs/{program_id}/renewal-reports"
    shared_operations:
      - "all read endpoints listed under PlatformAdmin.shared_operations except GET /fiduciary-transactions and GET /fiduciary-transactions/{transaction_id}"

  - name: BrokerAccountant
    description: "Fiduciary accounting. Books and settles premium and claim movements, publishes brokerage compensation disclosure, files collections, and closes the placement year. Cannot approve or reverse a transaction it booked (segregation of duties) and cannot place or bind."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs/{program_id}/settle"
      - "POST /programs/{program_id}/brokerage-disclosures"
      - "POST /programs/{program_id}/fiduciary-transactions"
      - "POST /brokerage-disclosures/{disclosure_id}/disclose"
      - "POST /fiduciary-transactions/{transaction_id}/settle"
      - "POST /claim-advocacies/{claim_advocacy_id}/collections"
    shared_operations:
      - "POST /fiduciary-transactions/{transaction_id}/approve (with ComplianceOfficer) — admitted only for a movement booked by a different X-User-ID; approving its own booking is refused by validations[priority=42]"
      - "all read endpoints listed under PlatformAdmin.shared_operations"

  - name: ComplianceOfficer
    description: "Independent control function. Owns counterparty suspension and security posture, the contract-certainty checkpoint, and the reversal of a settled movement, and is the second pair of eyes on every approval. Cannot originate a transaction and cannot place, bind or sign off."
    identity: "opaque"
    exclusive_operations:
      - "POST /cedents/{cedent_id}/suspension"
      - "POST /reinsurers/{reinsurer_id}/security-status"
      - "POST /programs/{program_id}/documentation-checkpoint"
      - "POST /fiduciary-transactions/{transaction_id}/reverse"
    shared_operations:
      - "POST /fiduciary-transactions/{transaction_id}/approve (with BrokerAccountant) — never blocked by validations[priority=42] because this role can never book a movement"
      - "all read endpoints listed under PlatformAdmin.shared_operations"

  - name: CedentUnderwriter
    description: "The ceding insurer. X-User-ID is the Cedent.id it acts as. Prepares and revises its own exposure package, acknowledges or rejects the broker's compensation disclosure, notifies claims and may withdraw a notification. Reads are confined to its own programs."
    identity: "entity_backed:Cedent"
    exclusive_operations:
      - "POST /exposure-submissions/{submission_id}/revise"
      - "POST /brokerage-disclosures/{disclosure_id}/decision"
      - "POST /claim-advocacies/{claim_advocacy_id}/withdraw"
    shared_operations:
      - "POST /programs/{program_id}/exposure-submissions (with BrokerPlacementLead)"
      - "POST /layers/{layer_id}/claim-advocacies (with BrokerPlacementLead)"
      - "GET /cedents, GET /cedents/{cedent_id}, GET /cedents/{cedent_id}/programs"
      - "GET /programs, GET /programs/{program_id}, GET /programs/{program_id}/exposure-submissions, /layers, /contract-documents, /brokerage-disclosures, /renewal-reports"
      - "GET /exposure-submissions/{submission_id}, GET /layers/{layer_id}, GET /layers/{layer_id}/claim-advocacies, GET /brokerage-disclosures/{disclosure_id}"
      - "GET /claim-advocacies/{claim_advocacy_id}, GET /claim-advocacies/{claim_advocacy_id}/cession-disputes, GET /cession-disputes, GET /cession-disputes/{dispute_id}"

  - name: ReinsurerUnderwriter
    description: "The assuming reinsurer. X-User-ID is the Reinsurer.id it acts as. Quotes, requotes and declines against submissions addressed to it, and raises cession disputes on its own signing lines. Never sees another market's quotes or lines."
    identity: "entity_backed:Reinsurer"
    exclusive_operations:
      - "POST /market-submissions/{market_submission_id}/quotes"
      - "POST /quotes/{quote_id}/requote"
      - "POST /quotes/{quote_id}/decline"
      - "POST /claim-advocacies/{claim_advocacy_id}/cession-disputes"
    shared_operations:
      - "GET /reinsurers, GET /reinsurers/{reinsurer_id}, GET /reinsurers/{reinsurer_id}/signing-lines, GET /reinsurers/{reinsurer_id}/market-submissions"
      - "GET /programs/{program_id}/layers, GET /layers/{layer_id}, GET /layers/{layer_id}/market-submissions, GET /layers/{layer_id}/signing-lines, GET /layers/{layer_id}/claim-advocacies"
      - "GET /market-submissions/{market_submission_id}, GET /market-submissions/{market_submission_id}/quotes, GET /quotes, GET /quotes/{quote_id}"
      - "GET /signing-lines, GET /signing-lines/{signing_line_id}"
      - "GET /claim-advocacies/{claim_advocacy_id}, GET /claim-advocacies/{claim_advocacy_id}/cession-disputes, GET /cession-disputes, GET /cession-disputes/{dispute_id}"
