      - name: trailing_spend_derived_after_delivery
        claim_type: derived_field_reconciliation
        grounds: ["calculations.ea_tier_discount", "entities.Account.fields.trailing_spend_cents"]
        distinguishing_aspect: "Derived field follows its source: trailing_spend_cents is 0 before, and exactly the order total 10000 after the only order crosses to DELIVERED via the transit sweep — not before (SHIPPED does not count)."
        test_recipe:
          setup: ["Account with one 10000-cent STANDARD order submitted and shipped at default clock."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Derived Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "DRV-1", name: "Derived item", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 10000, stock_on_hand: 5 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "DRV-1", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
            - call: "POST /lab/orders/${o_id}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
            - call: "POST /lab/orders/${o_id}/ship"
              payload: {}
              as: SupplyOps
            - call: "GET /lab/accounts/${a_id}"
              as: AccountManager
              captures: { ts_before: $.data.trailing_spend_cents }
          trigger:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /lab/accounts/${a_id}"
              as: AccountManager
              captures: { ts_after: $.data.trailing_spend_cents }
          assert:
            - "while SHIPPED: trailing_spend_cents == 0"
            - "after the +3-day sweep delivers it: trailing_spend_cents == 10000"

  - section: consistency_model
    instances:
      - name: immediate_read_after_create_shows_computed
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "response_envelope"]
        distinguishing_aspect: "Immediate consistency: the create response itself carries computed/system fields (status ACTIVE, credit_status GOOD, version 1) and a same-instant GET returns identical values — no lag, no reconciliation delay."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /lab/accounts"
              payload: { name: "Immediate Lab", segment: "ACADEMIC", priority_class: "PRIORITY", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id, v: $.data.version, st: $.data.status }
            - call: "GET /lab/accounts/${a_id}"
              as: AccountManager
              captures: { v2: $.data.version, st2: $.data.status }
          assert:
            - "POST response already shows status == ACTIVE and version == 1"
            - "immediate GET returns the identical representation (version 1, ACTIVE)"
