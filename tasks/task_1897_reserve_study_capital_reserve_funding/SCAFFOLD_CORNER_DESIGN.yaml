              payload: { name: "Rollover HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Paving", category: "PAVING", useful_life_years: 4, remaining_useful_life_years: 1, current_replacement_cost_cents: 50000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /associations/${a1}/annual-update"
              as: ReserveSpecialist
              captures: { lau: $.data.last_annual_update_fiscal_year }
            - call: "GET /reserve-studies/${s1}/components"
              as: ReserveSpecialist
              captures: { rul1: "$.data[0].remaining_useful_life_years", rul2: "$.data[1].remaining_useful_life_years"}
            - call: "GET /reserve-studies/${s1}"
              as: ReserveSpecialist
              captures: { ffb: $.data.fully_funded_balance_cents, pct: $.data.percent_funded }
            - call: "GET /reserve-studies/${s1}/disclosures?disclosure_type=ANNUAL_STATEMENT"
              as: ReserveSpecialist
              captures: { dstat: "$.data[0].status", ddue: "$.data[0].due_date", dtype: "$.data[0].disclosure_type"}
            - call: "POST /associations/${a1}/annual-update"
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "rul1 == 1 and rul2 == 0 (max(0, RUL-1); 0 floors at 0)"
            - "ffb == 130000 (round(100000*4/5) + round(50000*4/4))"
            - "pct == 384.62 (round_half_up(500000*100/130000, 2))"
            - "dtype == ANNUAL_STATEMENT and dstat == PENDING and ddue == 2027-02-04 (2027-01-05 + 30 days)"
            - "lau == 2027"
            - "err == ERR_ANNUAL_UPDATE_ALREADY_RUN (once per fiscal year)"

