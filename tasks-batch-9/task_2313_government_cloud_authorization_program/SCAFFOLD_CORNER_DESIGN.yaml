      -> HIGH as categories are declared, ignores a category that cannot raise it, and — the reversal half of the aggregation
      claim — falls back to MODERATE when the single HIGH category is WITHDRAWN, which a monotonic ''once HIGH always HIGH''
      implementation gets wrong.'
