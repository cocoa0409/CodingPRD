scaffold_corner_design:
  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: defendant_creation_success
        claim_type: Creation
        grounds: [entities.Defendant]
        distinguishing_aspect: "POST /defendants with full_name, date_of_birth, email returns 201 with a server-minted id, created_at, version 1, and prior_diversion_count defaulting to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /defendants"
              payload: { full_name: "Val Create", date_of_birth: "1990-01-01", email: "val@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
          assert:
            - "response code == 201"
            - "Defendant.${def_id}.prior_diversion_count == 0"
            - "Defendant.${def_id}.version == 1"

      - name: case_create_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Case.fields.defendant_id]
        distinguishing_aspect: "POST /cases omitting the required defendant_id is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { citation_number: "C-9001", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response code == 400"

      - name: defendant_not_found_on_get
        claim_type: Not Found
        grounds: [entities.Defendant, "errors[ERR_DEFENDANT_NOT_FOUND]"]
        distinguishing_aspect: "GET /defendants/{unknown-uuid} returns ERR_DEFENDANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /defendants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CourtClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEFENDANT_NOT_FOUND"
            - "response code == 404"

      - name: charge_default_is_diversion_eligible_applied
        claim_type: Defaults
        grounds: [entities.Charge.fields.is_diversion_eligible]
        distinguishing_aspect: "Omitting is_diversion_eligible on POST /cases/{id}/charges applies the default true."
        test_recipe:
          setup: ["A docketed case exists."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Deb Def", date_of_birth: "1990-01-02", email: "deb@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9002", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "INFRACTION", base_fine_amount: 50 }
              as: CourtClerk
              captures: { charge_id: $.data.id }
          assert:
            - "Charge.${charge_id}.is_diversion_eligible == true"

      - name: case_arraignment_deadline_computed
        claim_type: Computed Fields
        grounds: [entities.Case.fields.arraignment_deadline]
        distinguishing_aspect: "offense_date 2026-03-01 yields arraignment_deadline 2026-03-31T00:00:00Z (offense_date 00:00Z + ARRAIGNMENT_WINDOW_DAYS=30), regardless of any client-supplied value."
        test_recipe:
          setup: ["A defendant exists."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Cal Comp", date_of_birth: "1990-01-03", email: "cal@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9003", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.arraignment_deadline == 2026-03-31T00:00:00Z"

      - name: charge_invalid_severity_returns_400
        claim_type: Type Constraints
        grounds: [entities.Charge.fields.severity, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A severity value outside {INFRACTION, MISDEMEANOR} on POST /cases/{id}/charges is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A docketed case exists."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Eve Enum", date_of_birth: "1990-01-04", email: "eve@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9004", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "FELONY", base_fine_amount: 200 }
              as: CourtClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: accept_twice_second_rejected
        claim_type: Idempotency
        grounds: [state_machines.DiversionAgreement.OFFERED_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a DiversionAgreement already IN_PROGRESS a second time is rejected with ERR_INVALID_STATE (no state change)."
        test_recipe:
          setup: ["A granted diversion has already been accepted (IN_PROGRESS)."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Ivo Idem", date_of_birth: "1990-01-05", email: "ivo@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9005", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200 }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room S", room_code: "S" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-07T10:00:00Z", scheduled_end: "2026-03-07T10:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 0, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/accept"
              payload: {}
              as: Defendant
              as_user_id: "${def_id}"
          trigger:
            - call: "POST /diversion-agreements/${div_id}/accept"
              payload: {}
              as: Defendant
              as_user_id: "${def_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: plea_second_time_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Arraignment.SCHEDULED_to_HELD, "errors[ERR_INVALID_PLEA]"]
        distinguishing_aspect: "Entering a plea on an Arraignment already HELD is rejected with ERR_INVALID_PLEA."
        test_recipe:
          setup: ["An arraignment has already had a GUILTY plea entered (status HELD)."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Pia Plea", date_of_birth: "1990-01-06", email: "pia@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9006", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200 }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room T", room_code: "T" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-07T11:00:00Z", scheduled_end: "2026-03-07T11:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
          trigger:
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "NOT_GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PLEA"

      - name: warrant_before_deadline_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Case.DIVERSION_GRANTED_to_FAILED_TO_COMPLY, "errors[ERR_DEADLINE_NOT_PASSED]"]
        distinguishing_aspect: "Issuing a warrant while the clock (default 2026-03-01) is at or before the program_deadline (2026-06-01) is rejected with ERR_DEADLINE_NOT_PASSED."
        test_recipe:
          setup: ["A granted+accepted diversion with program_deadline 2026-06-01; clock at default 2026-03-01."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Wes Warr", date_of_birth: "1990-01-07", email: "wes@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9007", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200 }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room U", room_code: "U" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-07T12:00:00Z", scheduled_end: "2026-03-07T12:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 0, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/accept"
              payload: {}
              as: Defendant
              as_user_id: "${def_id}"
          trigger:
            - call: "POST /cases/${case_id}/warrant"
              payload: {}
              as: Judge
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEADLINE_NOT_PASSED"

      - name: dismiss_before_complied_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Case.COMPLIED_to_DISMISSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Dismissing a case still in DIVERSION_GRANTED (not COMPLIED) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A granted+accepted diversion; case is DIVERSION_GRANTED."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Dot Dism", date_of_birth: "1990-01-08", email: "dot@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9008", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200 }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room V", room_code: "V" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-07T13:00:00Z", scheduled_end: "2026-03-07T13:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 0, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/accept"
              payload: {}
              as: Defendant
              as_user_id: "${def_id}"
          trigger:
            - call: "POST /cases/${case_id}/dismiss"
              payload: {}
              as: Judge
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: payment_double_reverse_rejected
        claim_type: Idempotency
        grounds: [state_machines.LedgerAccount.SETTLED_to_ASSESSED, "errors[ERR_PAYMENT_ALREADY_REVERSED]"]
        distinguishing_aspect: "Reversing a Payment that is already reversed is rejected with ERR_PAYMENT_ALREADY_REVERSED."
        test_recipe:
          setup: ["A granted diversion (assessed 540); a $200 payment has been recorded and then reversed once."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Rex Rev", date_of_birth: "1990-01-09", email: "rex@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9009", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200 }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room W", room_code: "W" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-07T14:00:00Z", scheduled_end: "2026-03-07T14:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 0, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "GET /cases/${case_id}/ledger-account"
              payload: {}
              as: Cashier
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /ledger-accounts/${acct_id}/payments"
              payload: { amount: 200.00 }
              as: Cashier
              captures: { pay_id: $.data.id }
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAYMENT_ALREADY_REVERSED"

  # =================================================================
  # Calculations
  # =================================================================
  - section: calculations
    instances:
      - name: payment_waterfall_partial_allocation
        claim_type: Correct Result
        grounds: [calculations.payment_waterfall, entities.LedgerAccount.fields.balance, entities.Payment.fields.allocated_fines]
        distinguishing_aspect: "On assessed 540 (fines bucket 300), a $250 payment allocates entirely to fines (allocated_fines 250.00) leaving balance 290.00 — the waterfall fills the fines bucket first."
        test_recipe:
          setup: ["A granted diversion with final assessed 540.00, no payments yet."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Wan Water", date_of_birth: "1990-01-10", email: "wan@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9010", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200 }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room X", room_code: "X" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-07T15:00:00Z", scheduled_end: "2026-03-07T15:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 0, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "GET /cases/${case_id}/ledger-account"
              payload: {}
              as: Cashier
              captures: { acct_id: "$.data[0].id" }
          trigger:
            - call: "POST /ledger-accounts/${acct_id}/payments"
              payload: { amount: 250.00 }
              as: Cashier
              captures: { pay_id: $.data.id }
          assert:
            - "Payment.${pay_id}.allocated_fines == 250.00"
            - "Payment.${pay_id}.allocated_court_fee == 0.00"
            - "LedgerAccount.${acct_id}.balance == 290.00"

      - name: assessment_final_computed_value
        claim_type: Correct Result
        grounds: [calculations.fine_assessment]
        excluded_because:
          difficulty_instance: dual_variant_calc / assessment_provisional_vs_final_on_ledger_account
          rationale: "The final assessed_amount 540.00 value is already asserted as the trigger outcome of the named §1.8 instance."

      - name: installment_schedule_rounding_value
        claim_type: Correct Result
        grounds: [calculations.installment_schedule]
        excluded_because:
          difficulty_instance: combinatorial_formula / installment_rounding_last_absorbs_remainder
          rationale: "The 77.14 / 77.16 installment split is already asserted by the named §1.8 instance."

  # =================================================================
  # Validations
  # =================================================================
  - section: validations
    instances:
      - name: overpayment_single_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=10]", "errors[ERR_OVERPAYMENT]"]
        distinguishing_aspect: "On an ASSESSED account with balance 540, a $600 payment exceeds the balance and is rejected with ERR_OVERPAYMENT (422)."
        test_recipe:
          setup: ["A granted diversion with balance 540 (ASSESSED, not CLOSED)."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Ova Pay", date_of_birth: "1990-02-01", email: "ova@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9011", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200 }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room Y", room_code: "Y" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-08T10:00:00Z", scheduled_end: "2026-03-08T10:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 0, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "GET /cases/${case_id}/ledger-account"
              payload: {}
              as: Cashier
              captures: { acct_id: "$.data[0].id" }
          trigger:
            - call: "POST /ledger-accounts/${acct_id}/payments"
              payload: { amount: 600.00 }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OVERPAYMENT"

      - name: segregation_same_officer_verify_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "When the verifying officer's X-User-ID equals the assignment's assigned_by_officer_id (po_1), verify-completion is rejected with ERR_SEGREGATION_OF_DUTIES even though hours and ledger gates pass."
        test_recipe:
          setup: ["A granted+accepted diversion, ledger paid to SETTLED; a COMMUNITY_SERVICE assignment created by po_1 with 10 of 10 hours logged."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Seg One", date_of_birth: "1990-02-02", email: "seg@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-9012", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200 }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room Z", room_code: "Z" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-08T11:00:00Z", scheduled_end: "2026-03-08T11:30:00Z" }
              as: CourtClerk
