  # =========================================================================
  # From Table 3 (Calculations)
  # =========================================================================
  - section: calculations
    instances:
      - name: quality_index_excludes_draft_rows_from_the_confidence_mean
        claim_type: input_set_filtering
        grounds:
          - calculations.event_tag_quality_index
          - entities.Game.fields.quality_index
          - entities.Game.fields.draft_tag_count
        distinguishing_aspect: |
          The scored set is exactly {ACCEPTED, UNDER_CORRECTION}. A second tag left in DRAFT with a
          deliberately terrible confidence 0.1 must not move quality_index off 0.8000, and completeness
          must still use accepted_tag_count 1 / EXPECTED_TAGS_PER_GAME 4 = 0.25, not the 2-row total.
          Falsified if the index falls toward 0.55 (the value a DRAFT-inclusive mean would produce).
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z; Harbor Arena CERTIFIED; Game LIVE; player Ada Ruiz"
            - "tag t1 SHOT @ 120000 confidence 0.9 ACCEPTED by qa-01; tag t2 PASS @ 240000 confidence 0.1 left DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
