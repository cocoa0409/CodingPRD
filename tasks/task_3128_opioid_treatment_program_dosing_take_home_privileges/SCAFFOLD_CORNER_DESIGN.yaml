              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { j1: $.data.id }
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${ord_id}", dose_date: "2026-12-10", scheduled_datetime: "2026-12-10T07:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${lot_id}" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { j2: $.data.id }
