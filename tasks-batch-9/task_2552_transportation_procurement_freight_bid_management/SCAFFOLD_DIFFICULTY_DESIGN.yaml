              payload: { outcome: "ACCEPTED", load_reference: "LD-0005" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-0006" }
              as: ProcurementAnalyst
