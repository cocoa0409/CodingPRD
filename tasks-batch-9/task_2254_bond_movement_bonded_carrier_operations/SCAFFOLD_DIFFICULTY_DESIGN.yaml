  - rule_id: transitive_cascade
    instances:

      - name: non_arrival_claim_cascades_to_suspension_cancellation_and_bond_release
        grounds:
          - calculations.carrier_sanction_points
          - state_machines.BondedCarrier.ACTIVE_to_SUSPENDED
          - state_machines.InBondMovement.transit_status.FILED_to_CANCELLED
          - calculations.bond_obligation_ledger_balance
          - calculations.liquidated_damages_assessment
        distinguishing_aspect: |
          Depth-5 chain from a single POST /in-bond/ld-claims: (1) claim ISSUED with
          its INCREASE_LD ledger entry, (2) sanction_points recomputed to exactly
          10.0, (3) carrier ACTIVE -> SUSPENDED, (4) the FILED movement M3
          CANCELLED by the suspension cascade, (5) M3's RELEASE ledger entry
          driving CustomsBond.obligated_amount to 2041.75. Stopping at link 3
          leaves M3 FILED and the bond at 2083.50.
