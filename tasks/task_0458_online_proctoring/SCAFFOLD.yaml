    input: ["institution_id?", "limit?", "offset?"]
    output: Proctor[]
    side_effects: []

  # ---- Candidate ----
  - method: POST
    path: "/candidates"
    description: "Register a candidate"
    roles: [SchedulingCoordinator]
    code: 201
    input: [institution_id, full_name, email]
    output: Candidate
    side_effects: []

  - method: GET
    path: "/candidates/{candidate_id}"
    description: "Get a candidate"
    roles: [SchedulingCoordinator, Candidate]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: GET
    path: "/candidates"
    description: "List candidates, optionally filtered by institution"
    roles: [SchedulingCoordinator]
    code: 200
    input: ["institution_id?", "limit?", "offset?"]
    output: Candidate[]
    side_effects: []

  # ---- Exam ----
  - method: POST
    path: "/exams"
    description: "Create an exam definition with test window and monitoring mode"
    roles: [SchedulingCoordinator]
    code: 201
    input: [institution_id, title, base_duration_minutes, window_start_utc, window_end_utc, monitoring_mode, "lockdown_required?"]
    output: Exam
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/exams/{exam_id}"
    description: "Get an exam"
    roles: [SchedulingCoordinator, ReviewOfficer, Candidate]
    code: 200
    input: []
    output: Exam
    side_effects: []

  - method: GET
    path: "/exams"
    description: "List exams, optionally filtered by institution"
    roles: [SchedulingCoordinator, Candidate]
    code: 200
    input: ["institution_id?", "limit?", "offset?"]
    output: Exam[]
    side_effects: []

  - method: POST
    path: "/exams/{exam_id}/close"
    description: "Close an exam to new appointments"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Exam
    side_effects: ["status -> CLOSED (requires no open appointments)"]

  # ---- Accommodation ----
  - method: POST
    path: "/accommodations"
    description: "Grant an extra-time accommodation to a candidate for an exam"
    roles: [SchedulingCoordinator]
    code: 201
    input: [candidate_id, exam_id, "extra_time_pct?"]
    output: Accommodation
    side_effects: ["status=APPROVED"]

  - method: GET
    path: "/accommodations/{accommodation_id}"
    description: "Get an accommodation"
    roles: [SchedulingCoordinator, Candidate]
    code: 200
    input: []
    output: Accommodation
    side_effects: []

  - method: GET
    path: "/accommodations"
    description: "List accommodations filtered by candidate and/or exam"
    roles: [SchedulingCoordinator, Candidate]
    code: 200
    input: ["candidate_id?", "exam_id?", "limit?", "offset?"]
    output: Accommodation[]
    side_effects: []

  - method: POST
    path: "/accommodations/{accommodation_id}/revoke"
    description: "Revoke an accommodation"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Accommodation
    side_effects: ["status -> REVOKED"]

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Schedule an appointment; computes effective window, validates window/overlap/load"
    roles: [SchedulingCoordinator]
    code: 201
    input: [exam_id, candidate_id, proctor_id, "accommodation_id?", scheduled_start_utc]
    output: Appointment
    side_effects:
      - "computes effective_duration_minutes + effective_end_utc (appointment_effective_window)"
      - "status=SCHEDULED"

  - method: GET
    path: "/appointments/{appointment_id}"
    description: "Get an appointment"
    roles: [SchedulingCoordinator, ReviewOfficer, Candidate, Proctor]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/appointments"
    description: "List appointments filtered by exam, candidate, proctor, accommodation, or supersede pointer"
    roles: [SchedulingCoordinator, ReviewOfficer, Proctor]
    code: 200
    input: ["exam_id?", "candidate_id?", "proctor_id?", "accommodation_id?", "superseded_by_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: POST
    path: "/appointments/{appointment_id}/verify-identity"
    description: "Submit identity verification + room scan for an appointment"
    roles: [Candidate, Proctor]
    code: 201
    input: [photo_id_match, room_scan_clear]
    output: IdentityVerification
    side_effects: ["computes result=PASS|FAIL; PASS unlocks check-in when lockdown_required"]

  - method: GET
    path: "/appointments/{id}/identity-verifications"
    description: "List identity verification records for an appointment (reverse-reachability for IdentityVerification.appointment_id)"
    roles: [SchedulingCoordinator, ReviewOfficer, Candidate, Proctor]
    code: 200
    input: []
    output: IdentityVerification[]
    side_effects: []

  - method: POST
    path: "/appointments/{appointment_id}/check-in"
    description: "Candidate checks in; admits a ProctoringSession (ACTIVE) when gates pass"
    roles: [Candidate]
    code: 201
    input: []
    output: ProctoringSession
    side_effects:
      - "validates clock >= scheduled_start_utc, lockdown gate, proctor load_factor"
      - "Appointment -> CHECKED_IN"
      - "creates ProctoringSession (ACTIVE), copies proctor_id + monitoring_mode"
      - "recomputes proctor.active_session_count + proctor.load_factor"

  - method: POST
    path: "/appointments/{appointment_id}/mark-no-show"
    description: "Mark a candidate as a no-show after the window closed"
    roles: [Proctor, SchedulingCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> NO_SHOW"]

  - method: POST
    path: "/appointments/{appointment_id}/cancel"
    description: "Cancel a scheduled or checked-in appointment"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CANCELLED (rejects if a non-terminal session exists)"]

  # ---- ProctoringSession ----
  - method: GET
    path: "/sessions/{session_id}"
    description: "Get a proctoring session incl. computed integrity_score"
    roles: [SchedulingCoordinator, ReviewOfficer, Proctor]
    code: 200
    input: []
    output: ProctoringSession
    side_effects: []

  - method: GET
    path: "/sessions"
    description: "List sessions filtered by appointment or proctor"
    roles: [SchedulingCoordinator, ReviewOfficer, Proctor]
    code: 200
    input: ["appointment_id?", "proctor_id?", "status?", "limit?", "offset?"]
    output: ProctoringSession[]
    side_effects: []

  - method: POST
    path: "/sessions/{session_id}/flags"
    description: "Raise an incident flag on a session; may auto-void at threshold"
    roles: [Proctor]
    code: 201
    input: [kind, severity]
    output: IncidentFlag
    side_effects:
      - "creates IncidentFlag (OPEN)"
      - "recomputes session_integrity_score"
      - "if integrity_score < 50: session -> VOIDED (AUTO_THRESHOLD), appointment -> CONSUMED, OPEN flags -> RESOLVED, proctor load recomputed"

  - method: GET
    path: "/sessions/{id}/flags"
    description: "List incident flags for a session (reverse-reachability for IncidentFlag.session_id)"
    roles: [SchedulingCoordinator, ReviewOfficer, Proctor]
    code: 200
    input: []
    output: IncidentFlag[]
    side_effects: []

  - method: POST
    path: "/sessions/{session_id}/pause"
    description: "Pause an active session (network drop)"
    roles: [Proctor]
    code: 200
    input: []
    output: ProctoringSession
    side_effects: ["status -> PAUSED"]

  - method: POST
    path: "/sessions/{session_id}/resume"
    description: "Resume a paused session"
    roles: [Proctor]
    code: 200
    input: []
    output: ProctoringSession
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/sessions/{session_id}/complete"
    description: "Complete a session and freeze its integrity score"
    roles: [Proctor]
    code: 200
    input: []
    output: ProctoringSession
    side_effects:
      - "status -> COMPLETED (rejects if an OPEN/UNDER_REVIEW escalation exists)"
      - "appointment -> CONSUMED; proctor load recomputed"

  # ---- Escalation ----
  - method: POST
    path: "/escalations"
    description: "Open an escalation on a session for a flag; holds the session for review"
    roles: [Proctor]
    code: 201
    input: [session_id, incident_flag_id]
    output: Escalation
    side_effects:
      - "creates Escalation (OPEN), opened_by_proctor_id = acting proctor"
      - "session -> REVIEW_HELD; IncidentFlag -> ESCALATED"

  - method: GET
    path: "/escalations/{escalation_id}"
    description: "Get an escalation"
    roles: [SchedulingCoordinator, ReviewOfficer, Proctor]
    code: 200
    input: []
    output: Escalation
    side_effects: []

  - method: GET
    path: "/escalations"
    description: "List escalations filtered by session, incident flag, opening proctor, or review officer"
    roles: [SchedulingCoordinator, ReviewOfficer, Proctor]
    code: 200
    input: ["session_id?", "incident_flag_id?", "opened_by_proctor_id?", "review_officer_id?", "status?", "limit?", "offset?"]
    output: Escalation[]
    side_effects: []

  - method: POST
    path: "/escalations/{escalation_id}/claim"
    description: "A ReviewOfficer claims an open escalation for review (segregation of duties enforced)"
    roles: [ReviewOfficer]
    code: 200
    input: []
    output: Escalation
    side_effects: ["status -> UNDER_REVIEW; review_officer_id set; increments Escalation.version by 1"]

  - method: POST
    path: "/escalations/{escalation_id}/decide"
    description: "Decide an escalation (UPHELD voids session, DISMISSED resumes it); OCC-guarded"
    roles: [ReviewOfficer]
    code: 200
    input: [verdict, expected_escalation_version]
    output: Escalation
    side_effects:
      - "increments Escalation.version by 1"
      - "UPHELD: session -> VOIDED (ESCALATION_UPHELD), appointment -> CONSUMED, flag -> RESOLVED, proctor load recomputed"
      - "DISMISSED: session REVIEW_HELD -> ACTIVE, flag -> RESOLVED, integrity_score recomputed"

  # ---- IntegrityReport ----
  - method: POST
    path: "/integrity-reports"
    description: "Draft an integrity report bundling terminal sessions for an institution"
    roles: [SchedulingCoordinator]
    code: 201
    input: [institution_id, candidate_id, exam_id, session_ids]
    output: IntegrityReport
    side_effects: ["status=DRAFT (aggregate_score/disposition not frozen until deliver)"]

  - method: GET
    path: "/integrity-reports/{report_id}"
    description: "Get an integrity report"
    roles: [SchedulingCoordinator, ReviewOfficer]
    code: 200
    input: []
    output: IntegrityReport
    side_effects: []

  - method: GET
    path: "/integrity-reports"
    description: "List integrity reports filtered by institution, candidate, or exam"
    roles: [SchedulingCoordinator, ReviewOfficer]
    code: 200
    input: ["institution_id?", "candidate_id?", "exam_id?", "status?", "limit?", "offset?"]
    output: IntegrityReport[]
    side_effects: []

  - method: POST
    path: "/integrity-reports/{report_id}/deliver"
    description: "Deliver a report to the institution; freezes aggregate_score + disposition"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: IntegrityReport
    side_effects:
      - "computes report_aggregate_score + disposition"
      - "status -> DELIVERED"

  # ---- RetakeAuthorization ----
  - method: POST
    path: "/retake-authorizations"
    description: "Authorize a retake for a VOIDED session (segregation of duties: author != upholding officer)"
    roles: [ReviewOfficer]
    code: 201
    input: [voided_session_id]
    output: RetakeAuthorization
    side_effects:
      - "status=AUTHORIZED; original_appointment_id copied from the voided session's appointment; authorized_by_id = acting officer"

  - method: GET
    path: "/retake-authorizations/{retake_id}"
    description: "Get a retake authorization"
    roles: [SchedulingCoordinator, ReviewOfficer]
    code: 200
    input: []
    output: RetakeAuthorization
    side_effects: []

  - method: GET
    path: "/retake-authorizations"
    description: "List retake authorizations filtered by voided session, appointment, or authorizing officer"
    roles: [SchedulingCoordinator, ReviewOfficer]
    code: 200
    input: ["voided_session_id?", "original_appointment_id?", "replacement_appointment_id?", "authorized_by_id?", "status?", "limit?", "offset?"]
    output: RetakeAuthorization[]
    side_effects: []

  - method: POST
    path: "/retake-authorizations/{retake_id}/rebook"
    description: "Rebook a retake into a new appointment, superseding the original; OCC-guarded on original appointment version"
    roles: [SchedulingCoordinator]
    code: 201
    input: [proctor_id, scheduled_start_utc, "accommodation_id?", expected_appointment_version]
    output: Appointment
    side_effects:
      - "creates replacement Appointment (SCHEDULED) for the voided session's exam+candidate, computes its effective window"
      - "validates window-fit, proctor overlap, candidate overlap"
      - "original.superseded_by_id = replacement.id; increments original Appointment.version by 1 (original stays CONSUMED)"
      - "RetakeAuthorization -> REBOOKED, replacement_appointment_id set"

  - method: POST
    path: "/retake-authorizations/{retake_id}/expire"
    description: "Expire an unused retake authorization"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: RetakeAuthorization
    side_effects: ["status -> EXPIRED"]

  # ---- Test-driving (logical clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [SchedulingCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601; affects check-in / no-show gates"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path or FK body field) does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body, missing required field, or invalid enum/range value" }
  - { id: ERR_REFERENCE_MISMATCH, http: 422, condition: "FK targets inconsistent (accommodation candidate/exam != appointment; report sessions not for report candidate+exam)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_EXAM_CLOSED, http: 409, condition: "Appointment creation attempted against a CLOSED exam" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same person attempts two segregated steps (open+review escalation, or uphold+author retake)" }
  - { id: ERR_LOCKDOWN_NOT_VERIFIED, http: 409, condition: "Check-in attempted on a lockdown-required exam without a PASS IdentityVerification" }
  - { id: ERR_OUTSIDE_TEST_WINDOW, http: 422, condition: "Appointment effective window falls outside the exam test window" }
  - { id: ERR_PROCTOR_DOUBLE_BOOKED, http: 409, condition: "Appointment effective window overlaps another non-terminal appointment of the same proctor" }
  - { id: ERR_CANDIDATE_OVERLAP, http: 409, condition: "Candidate already has an overlapping/back-to-back appointment for the same exam (closed-interval rule)" }
  - { id: ERR_PROCTOR_OVERLOADED, http: 409, condition: "Proctor prospective load_factor would exceed MAX_LOAD_FACTOR (1.0)" }
  - { id: ERR_SESSION_IN_PROGRESS, http: 409, condition: "Cancel attempted while a non-terminal ProctoringSession exists for the appointment" }
  - { id: ERR_NOT_VOIDED, http: 409, condition: "Retake authorization attempted for a session that is not VOIDED" }
  - { id: ERR_EMPTY_REPORT, http: 422, condition: "Report session_ids empty, or a referenced session is not terminal" }
  - { id: ERR_CHECKIN_TOO_EARLY, http: 409, condition: "Check-in or no-show attempted before the relevant clock instant" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchedulingCoordinator
    description: "Institution operations staff: provisions institutions, proctors, candidates, exams, accommodations; schedules/cancels appointments; drafts and delivers reports; rebooks retakes."
    identity: "opaque"
    exclusive_operations:
      - "POST /institutions, POST /proctors, POST /candidates, POST /exams, POST /accommodations"
      - "POST /exams/{id}/close, POST /accommodations/{id}/revoke"
      - "POST /appointments, POST /appointments/{id}/cancel"
      - "POST /integrity-reports, POST /integrity-reports/{id}/deliver"
      - "POST /retake-authorizations/{id}/rebook, POST /retake-authorizations/{id}/expire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /appointments/{id}/mark-no-show (with Proctor)"
      - "GET reads across exams, appointments, sessions, escalations, reports, retakes"

  - name: Proctor
    description: "Live/record proctor: verifies identity, raises incident flags, opens escalations, runs the session lifecycle (pause/resume/complete)."
    identity: "entity_backed:Proctor"
    exclusive_operations:
      - "POST /sessions/{id}/flags"
      - "POST /sessions/{id}/pause, POST /sessions/{id}/resume, POST /sessions/{id}/complete"
      - "POST /escalations (open an escalation on a session they proctor)"
    shared_operations:
      - "POST /appointments/{id}/verify-identity (with Candidate)"
      - "POST /appointments/{id}/mark-no-show (with SchedulingCoordinator)"
      - "GET reads on proctors, appointments, sessions, escalations"

  - name: ReviewOfficer
    description: "Evidence reviewer: claims and decides escalations (a different person than the opening proctor) and authorizes retakes for voided sessions."
    identity: "entity_backed:Proctor"
    exclusive_operations:
      - "POST /escalations/{id}/claim, POST /escalations/{id}/decide"
      - "POST /retake-authorizations"
    shared_operations:
      - "GET reads on escalations, sessions, reports, retakes"

  - name: Candidate
    description: "Test-taker: submits identity verification and checks into their own appointment."
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /appointments/{id}/check-in"
    shared_operations:
      - "POST /appointments/{id}/verify-identity (with Proctor)"
      - "GET reads on own appointments, exams, accommodations, candidate record"
