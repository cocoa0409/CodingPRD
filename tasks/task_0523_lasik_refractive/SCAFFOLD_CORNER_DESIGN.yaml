scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: create_package_returns_201_all_fields
        claim_type: Creation
        grounds: [entities.TreatmentPackage, endpoints]
        distinguishing_aspect: "POST /refractive/packages with all required fields returns 201 and echoes tier, base_price_cents, deposit_cents, enhancement_window_days, outcome_guarantee_uncorrected_va, refund_mode."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /refractive/packages"
              payload: { tier: "PREMIUM", base_price_cents: 700000, deposit_cents: 70000, enhancement_window_days: 730, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "DEPOSIT_FORFEIT" }
              as: Coordinator
              captures: { pkg: $.data.id, tier: $.data.tier }
          assert:
            - "HTTP 201"
            - "TreatmentPackage.${pkg}.tier == PREMIUM"
            - "TreatmentPackage.${pkg}.base_price_cents == 700000"
            - "TreatmentPackage.${pkg}.refund_mode == DEPOSIT_FORFEIT"

      - name: package_active_defaults_true
        claim_type: Defaults
        grounds: [entities.TreatmentPackage.fields.active]
        distinguishing_aspect: "Omitting active on POST /refractive/packages yields active==true (declared default)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id, active: $.data.active }
          assert:
            - "TreatmentPackage.${pkg}.active == true"

      - name: suite_status_defaults_open
        claim_type: Defaults
        grounds: [entities.LaserSuite.fields.status]
        distinguishing_aspect: "Omitting status on POST /refractive/suites yields status==OPEN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /refractive/suites"
              payload: { name: "S1", turnaround_buffer_minutes: 15, daily_case_cap: 3 }
              as: Coordinator
              captures: { suite_id: $.data.id, status: $.data.status }
          assert:
            - "LaserSuite.${suite_id}.status == OPEN"

      - name: patient_status_system_initialized_prospect
        claim_type: System Fields
        grounds: [entities.Patient.fields.status]
        distinguishing_aspect: "New patient has system-set status==PROSPECT regardless of any input; caller cannot set it."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Anonymous
              captures: { pat: $.data.id, status: $.data.status }
          assert:
            - "Patient.${pat}.status == PROSPECT"

      - name: screening_computed_fields_ignore_input
        claim_type: Computed Fields
        grounds: [entities.CandidacyScreening.fields.ablation_depth_um, entities.CandidacyScreening.fields.residual_stromal_bed_um]
        distinguishing_aspect: "ablation_depth_um and residual_stromal_bed_um are null on a DRAFT screening (only computed at submit); creation cannot set them."
        test_recipe:
          setup: ["An optometrist and patient exist."]
          setup_api_calls:
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
          trigger:
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr: $.data.id, status: $.data.status }
          assert:
            - "CandidacyScreening.${scr}.status == DRAFT"
            - "CandidacyScreening.${scr}.ablation_depth_um == null"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Patient"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /refractive/patients/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /refractive/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_screening_missing_required_field
        claim_type: Required Fields
        grounds:
          - "entities.CandidacyScreening"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /refractive/screenings missing topography_k_max returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An optometrist and patient exist."]
          setup_api_calls:
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
          trigger:
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_package_invalid_enum_tier
        claim_type: Type Constraints
        grounds:
          - "entities.TreatmentPackage.fields.tier"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /refractive/packages with tier not in {STANDARD,PREMIUM,LIFETIME} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /refractive/packages"
              payload: { tier: "GOLD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

  # =================================================================
  - section: endpoints
    instances:
      - name: list_packages_pagination_envelope
        claim_type: Listing
        grounds: [entities.TreatmentPackage, endpoints]
        distinguishing_aspect: "GET /refractive/packages returns a paginated array envelope with limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Two packages created."]
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
            - call: "POST /refractive/packages"
              payload: { tier: "PREMIUM", base_price_cents: 700000, deposit_cents: 70000, enhancement_window_days: 730, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "DEPOSIT_FORFEIT" }
              as: Coordinator
          trigger:
            - call: "GET /refractive/packages"
              payload: { limit: 1, offset: 0 }
              as: Coordinator
          assert:
            - "response.data is an array of length 1"
            - "response envelope meta.total_count == 2 and has_more == true"

      - name: fk_reverse_list_case_bookings
        claim_type: Cross-reference link
        grounds: [entities.SuiteBooking.fields.case_id, endpoints]
        distinguishing_aspect: "GET /refractive/cases/{id}/bookings surfaces the cascade-created SuiteBooking (FK reverse-reachability for SuiteBooking.case_id)."
        test_recipe:
          setup: ["A SCHEDULED funded case with one ACTIVE booking."]
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/suites"
              payload: { name: "S1", turnaround_buffer_minutes: 15, daily_case_cap: 5 }
              as: Coordinator
              captures: { suite_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /refractive/cases/${case1}/financing"
              payload: { down_payment_cents: 500000, term_months: 1, apr_bps: 0 }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/bookings"
              payload: { suite_id: "${suite_id}", surgeon_id: "${surg_id}", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T10:00:00Z", expected_case_version: "${case1_v}" }
              as: Coordinator
          trigger:
            - call: "GET /refractive/cases/${case1}/bookings"
              payload: {}
              as: Coordinator
          assert:
            - "response.data is an array of length 1 with status == ACTIVE"

      - name: fk_reverse_list_patient_screenings
        claim_type: Cross-reference link
        grounds: [entities.CandidacyScreening.fields.patient_id, endpoints]
        distinguishing_aspect: "GET /refractive/patients/{id}/screenings returns the patient's screenings (FK reverse-reachability for CandidacyScreening.patient_id)."
        test_recipe:
          setup: ["A patient with one screening."]
          setup_api_calls:
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
          trigger:
            - call: "GET /refractive/patients/${pat1}/screenings"
              payload: {}
              as: Coordinator
          assert:
            - "response.data is an array of length 1"

  # =================================================================
  - section: state_machines
    instances:
      - name: submit_screening_from_submitted_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.CandidacyScreening.DRAFT_to_SUBMITTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Submitting an already-SUBMITTED screening returns ERR_INVALID_STATE (409); no recompute."
        test_recipe:
          setup: ["A SUBMITTED screening."]
          setup_api_calls:
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
          trigger:
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: adjudicate_screening_from_terminal_approved
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.CandidacyScreening.SUBMITTED_to_APPROVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Re-adjudicating an APPROVED (terminal) screening returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An APPROVED screening."]
          setup_api_calls:
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
          trigger:
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "REJECT" }
              as: Surgeon
              as_user_id: "${surg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: reject_screening_sets_reason_and_patient_ineligible
        claim_type: Side Effect Execution
        grounds: [state_machines.CandidacyScreening.SUBMITTED_to_REJECTED, entities.CandidacyScreening.fields.rejection_reason, entities.Patient.fields.status]
        distinguishing_aspect: "REJECT on a submitted screening with a thin bed sets rejection_reason==THIN_BED and Patient.status==INELIGIBLE (bubble-up)."
        test_recipe:
          setup: ["A SUBMITTED screening with residual bed 304 (< 350): thickness 450, error 3.0."]
          setup_api_calls:
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 450, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
          trigger:
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "REJECT" }
              as: Surgeon
              as_user_id: "${surg_id}"
              captures: { reason: $.data.rejection_reason }
          assert:
            - "CandidacyScreening.${scr1}.status == REJECTED"
            - "CandidacyScreening.${scr1}.rejection_reason == THIN_BED"
            - "Patient.${pat1}.status == INELIGIBLE"

      - name: enhancement_return_for_revision_from_requested_invalid
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.EnhancementRequest.RE_SCREENING_to_REQUESTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "return-for-revision on a REQUESTED (not RE_SCREENING) enhancement returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A REQUESTED EnhancementRequest on a HEALED, within-window origin case."]
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/suites"
              payload: { name: "S1", turnaround_buffer_minutes: 15, daily_case_cap: 5 }
              as: Coordinator
              captures: { suite_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /refractive/cases/${case1}/financing"
              payload: { down_payment_cents: 500000, term_months: 1, apr_bps: 0 }
              as: Coordinator
            - call: "POST /refractive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/bookings"
              payload: { suite_id: "${suite_id}", surgeon_id: "${surg_id}", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T10:00:00Z", expected_case_version: "${case1_v}" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/consent"
              payload: { drops_regimen_started: true, signed_by_patient_id: "${pat1}" }
              as: Patient
              as_user_id: "${pat1}"
            - call: "POST /refractive/cases/${case1}/operate"
              payload: {}
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/heal"
              payload: { final_uncorrected_va: 0.5 }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/enhancements"
              payload: { origin_case_id: "${case1}", patient_id: "${pat1}", reason: "regression" }
              as: Patient
              as_user_id: "${pat1}"
              captures: { enh: $.data.id }
          trigger:
            - call: "POST /refractive/enhancements/${enh}/return-for-revision"
              payload: {}
              as: Surgeon
              as_user_id: "${surg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: heal_too_early_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.SurgeryCase.clinical_status=OPERATED_to_clinical_status=HEALED"
          - "validations[priority=54]"
          - "errors[ERR_HEAL_TOO_EARLY]"
        distinguishing_aspect: "Heal attempted before surgery_completed_at + HEAL_SETTLE_DAYS (30d) returns ERR_HEAL_TOO_EARLY (422); operated 2026-06-01T12:00, clock still 2026-06-15."
        test_recipe:
          setup: ["An OPERATED case (surgery_completed_at 2026-06-01T12:00:00Z), clock advanced only to 2026-06-15T00:00:00Z."]
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/suites"
              payload: { name: "S1", turnaround_buffer_minutes: 15, daily_case_cap: 5 }
              as: Coordinator
              captures: { suite_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case1: $.data.id, case1_v: $.data.version }
