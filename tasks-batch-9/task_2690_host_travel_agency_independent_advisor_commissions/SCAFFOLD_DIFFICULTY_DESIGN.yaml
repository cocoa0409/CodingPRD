          Different resource entity (Client rather than Advisor coverage) and the opposite
          interval convention: HALF-OPEN [start, end), so a window starting exactly when another
          ends is disjoint and permitted. The constraint is also an aggregate rather than a
          pairwise exclusion — two concurrent trips are legal and only the third collides — and
