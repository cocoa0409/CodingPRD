              as_user_id: "tt-1"
              captures: { blocked_err: $.data.error_id }
          assert:
            - "FunctionalAssessment.${asmt_id}.recommended_category == \"UNCONDITIONAL\" and recommended_term_days == 1825"
            - "Determination.${det_id}.status == \"ISSUED\", category == \"UNCONDITIONAL\", term_days == 1825, expires_at == \"2031-08-05\" and trip_condition_count == 0"
            - "Applicant.${rider_id}.current_eligibility_status == \"ELIGIBLE\" and eligibility_category == \"UNCONDITIONAL\""
            - "the referral create returns HTTP 422 with data.error_id == \"ERR_CATEGORY_NOT_TRAINABLE\""
            - "GET /travel-training-referrals?applicant_id=${rider_id} returns total_count == 0 (the UNCONDITIONAL issue created no auto referral either)"
            - "GET /determinations/${det_id}/trip-conditions returns total_count == 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: evaluator_slot_closed_interval_plus_fifteen_minute_buffer
        grounds:
          - calculations.evaluator_slot_conflict
          - validations.priority_58.ERR_EVALUATOR_SLOT_CONFLICT
          - entities.AssessmentSlot.fields.evaluator_user_id
          - endpoints.POST_/assessment-slots
        distinguishing_aspect: |
          The resource is the EVALUATOR and the interval semantics are CLOSED intervals expanded by a
          mandatory 15-minute turnaround buffer on both sides, so back-to-back and 10-minute-gap slots
          conflict and a gap of exactly 15 minutes is the first accepted gap. This is the opposite
          convention from the vehicle instance of this rule, where adjacency is free.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z (all slots are in the future)"
            - "one AssessmentSlot for evaluator eval-1 from 2026-08-05T09:00:00Z to 2026-08-05T10:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_a: $.data.id }
          trigger:
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T10:00:00Z", ends_at: "2026-08-05T11:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { adjacent_err: $.data.error_id }
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T10:10:00Z", ends_at: "2026-08-05T11:10:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { ten_min_err: $.data.error_id }
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T10:15:00Z", ends_at: "2026-08-05T11:15:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_b: $.data.id }
            - call: "POST /assessment-slots"
              payload: { site_name: "East Branch Center", evaluator_user_id: "eval-2", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: false }
              as: AccessibilityOfficeAdmin
              captures: { slot_c: $.data.id }
          assert:
            - "the back-to-back slot (10:00-11:00, gap 0) returns HTTP 409 with data.error_id == \"ERR_EVALUATOR_SLOT_CONFLICT\""
            - "the 10-minute-gap slot (10:10-11:10) returns HTTP 409 with data.error_id == \"ERR_EVALUATOR_SLOT_CONFLICT\" (10 < EVALUATOR_BUFFER_MINUTES 15)"
            - "the 15-minute-gap slot (10:15-11:15) returns HTTP 201 with data.status == \"OPEN\" and booked_count == 0 (a gap of exactly the buffer is accepted)"
            - "the eval-2 slot fully overlapping 09:00-10:00 returns HTTP 201 (the conflict is scoped to one evaluator_user_id, not to the site or the clock)"
            - "GET /assessment-slots returns total_count == 3 (the two rejected calls created nothing)"
            - "AssessmentSlot.${slot_a}.booked_count == 0 and status == \"OPEN\" throughout"

      - name: vehicle_half_open_window_with_aggregate_wheelchair_lane_capacity
        grounds:
          - calculations.vehicle_window_occupancy
          - validations.priority_60.ERR_VEHICLE_WINDOW_CONFLICT
          - entities.Vehicle.fields.wheelchair_positions
          - entities.Vehicle.fields.open_wheelchair_reservations
          - endpoints.POST_/transportation-bookings
        distinguishing_aspect: |
          A different resource entity (Vehicle) with the opposite interval semantics: HALF-OPEN windows
          [start, end) where adjacency (a.end == b.start) is explicitly free, plus a per-lane aggregate
          capacity so the wheelchair and ambulatory lanes are counted separately. A booking ending one
          minute earlier than the adjacent boundary overlaps two existing reservations and is refused,
          while the same window in the ambulatory lane succeeds.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Applicant with a SCHEDULED FunctionalAssessment on the 2026-08-05T09:00:00Z slot (no attendance recorded yet)"
            - "one IN_SERVICE Vehicle with wheelchair_positions 1 and ambulatory_seats 2, no bookings"
            - "every pickup_window_end below is at or before the slot's 09:00 start, so rule 64 never fires"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Bea Tomlin", date_of_birth: "1955-08-23", residence_zone: "IN_SERVICE_AREA", mobility_aid: "MANUAL_WHEELCHAIR" }
