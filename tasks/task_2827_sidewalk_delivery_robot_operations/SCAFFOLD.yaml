scenario: |
  2827. Sidewalk Delivery Robot Operations (autonomous sidewalk delivery operator): service area mapping with sidewalk network, crossing safety assessment and permitted-zone compliance, merchant integration with order handoff, container loading and lid access codes, autonomous navigation with remote operator intervention thresholds and takeover procedures, pedestrian right-of-way behavior, accessibility clearance and local ordinance compliance, fleet charging, staging and maintenance cycles across dense zones, delivery exception handling for blocked routes, weather and vandalism with customer refund policy, incident reporting to municipal authorities and insurance, throughput, utilization and cost-per-delivery economics

domain_name: sidewalk-delivery-robot-operations
api_prefix: ""   # flat topology: every entity owns a root-level collection (/service-zones, /robots, /delivery-orders, ...); there is no single owning parent collection

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

common_fields_contract:
  fields: [id, created_at, updated_at, version]
  version_semantics: >-
    every entity declared with common_fields: true carries an integer version that is 1 immediately
    after creation and increases by exactly 1 on every mutation of that row, including mutations
    applied by a cascade the caller did not address directly. A read never changes a version.
  timestamp_format: "ISO 8601 UTC with exactly three fractional digits and a trailing Z, e.g. 2026-08-03T09:00:00.000Z"
  clock: >-
    every temporal rule reads the logical clock, whose startup default is 2026-08-01T00:00:00Z and
    which only moves when POST /_clock/set_current_utc is called

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: graph_constraint
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities at root-level collections joined by explicit foreign keys. No
  # entity is nested inside another's URL path; the only nested paths are
  # reverse-reachability reads (GET /service-zones/{id}/robots) and action
  # sub-paths on a single resource (POST /robots/{id}/duty-transitions).

  state_machine_shape: cyclic
  # Two independent non-linear shapes coexist:
  #   - DeliveryMission: EN_ROUTE -> BLOCKED -> EN_ROUTE reroute cycle
  #   - Robot: parallel dimensions duty_state x health_state on one row
  #   - IncidentReport: branching fork-join (municipal-only vs municipal+insurer) converging on CLOSED
  #   - DeliveryOrder: EXCEPTION -> DISPATCHED redelivery cycle
  #   - ServiceZone: PERMITTED -> RESTRICTED -> PERMITTED cycle

  relationship_patterns:
    - one_to_many          # ServiceZone -> SidewalkSegment / Robot / Merchant / DepotBay
    - self_referential     # SidewalkSegment.connected_segment_ids adjacency set (the sidewalk graph)
    - cross_aggregate      # BayReservation joins DepotBay x Robot; IncidentReport joins ServiceZone x DeliveryMission x Robot
    - polymorphic          # DeliveryOrder.exception_reason selects the remedy policy row applied by customer_remedy_amount

  role_model: segregation_of_duties
  # The RemoteOperator who files an IncidentReport can never be the SafetyOfficer
  # who submits it to the municipality or closes it; robot health quarantine and
  # incident review sit with SafetyOfficer, dispatch with FleetDispatcher.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceZone
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: human-readable zone name
        constraints: 1..120 chars, required
      - name: municipality_code
        type: string
        source: input
        description: code of the municipality that issued the sidewalk operating permit
        constraints: 2..12 chars, required
      - name: permit_state
        type: enum
        source: system
        description: permit lifecycle state gating every dispatch in the zone
        default: PROVISIONED
        constraints: "PROVISIONED | PERMITTED | RESTRICTED | REVOKED"
      - name: ordinance_min_clearance_cm
        type: number
        source: input
        description: local-ordinance minimum passable sidewalk clearance; a segment may not be APPROVED below it
        constraints: "> 0, required"
      - name: ordinance_max_speed_cm_s
        type: integer
        source: input
        description: local-ordinance maximum robot ground speed; a robot above it may not be staged in this zone
        constraints: "> 0, required"
      - name: operating_window_start_utc_hhmm
        type: string
        source: input
        description: inclusive start of the daily permitted operating window, UTC, four digits "HHMM" with no separator, e.g. "0700"
        constraints: matches ^([01][0-9]|2[0-3])[0-5][0-9]$
      - name: operating_window_end_utc_hhmm
        type: string
        source: input
        description: inclusive end of the daily permitted operating window, UTC, four digits "HHMM" with no separator, e.g. "2100"
        constraints: matches ^([01][0-9]|2[0-3])[0-5][0-9]$; must be strictly greater than start when compared as four-digit strings
      - name: max_concurrent_robots
        type: integer
        source: input
        description: maximum number of Robots in this zone allowed to hold duty_state == ON_MISSION at one time
        constraints: ">= 1, required"
      - name: max_crossing_risk
        type: number
        source: input
        description: crossing-safety ceiling; a SidewalkSegment whose crossing_risk_score exceeds it cannot be APPROVED
        default: 45.0
        constraints: 0.0..100.0
      - name: takeover_confidence_threshold_pct
        type: integer
        source: input
        description: autonomy-confidence breakpoint at or below which a remote takeover is mandatory
        default: 35
        constraints: 0..100
      - name: planning_haul_m
        type: number
        source: input
        description: zone planning constant for the estimated haul distance used by the forward_looking fee quote
        constraints: "> 0, required"
      - name: planning_crossings
        type: integer
        source: input
        description: zone planning constant for the estimated number of crossings used by the forward_looking fee quote
        constraints: ">= 0, required"
      - name: remedy_budget_cents
        type: integer
        source: input
        description: total customer-remedy budget authorised for this zone
        constraints: ">= 0, required"
      - name: remedy_spent_cents
        type: integer
        source: computed
        description: sum of remedy_amount_cents over every DeliveryOrder of this zone's merchants whose remedy has been issued
        default: 0
      - name: remedy_budget_remaining_cents
        type: integer
        source: computed
        description: remedy_budget_cents - remedy_spent_cents
      - name: reserved_bay_minutes
        type: integer
        source: computed
        description: conserved capacity quantity; sum of window_minutes over BayReservations on this zone's DepotBays whose state IN {HELD, ACTIVE}
        default: 0
      - name: open_incident_count
        type: integer
        source: computed
        description: count of IncidentReports with zone_id == this zone whose report_state IN {DRAFT, SUBMITTED_MUNICIPAL, INSURER_NOTIFIED}
        default: 0
      - name: on_mission_robot_count
        type: integer
        source: computed
        description: count of Robots with zone_id == this zone and duty_state == ON_MISSION
        default: 0
      - name: insurer_notify_threshold_cents
        type: integer
        source: input
        description: estimated damage at or above which an IncidentReport must be escalated to the insurer
        default: 25000
        constraints: ">= 0"
      - name: lid_code_sequence
        type: integer
        source: computed
        description: zone-scoped monotonic counter consumed by container LOAD to mint DeliveryMission.lid_access_code
        default: 0
      - name: restriction_reason
        type: string
        source: system
        description: free text recorded by the last RESTRICT or REVOKE permit transition; null while PERMITTED or PROVISIONED
        default: null

  - name: SidewalkSegment
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: FK -> ServiceZone.id; the permitted zone this segment belongs to
        constraints: required
      - name: segment_code
        type: string
        source: input
        description: survey code for the segment
        constraints: required, unique within (zone_id, segment_code)
      - name: segment_type
        type: enum
        source: input
        description: physical class of the sidewalk element
        constraints: "WALKWAY | CROSSING | RAMP"
      - name: crossing_control
        type: enum
        source: input
        description: traffic-control regime at this element; only meaningful when segment_type == CROSSING but always stored
        default: NONE
        constraints: "NONE | SIGNALIZED | UNSIGNALIZED | MIDBLOCK"
      - name: length_m
        type: number
        source: input
        description: centerline length used by route distance and duration arithmetic
        constraints: "> 0, required"
      - name: measured_clearance_cm
        type: number
        source: input
        description: narrowest passable clearance measured on this element
        constraints: "> 0, required"
      - name: surface_grade_pct
        type: number
        source: input
        description: steepest running grade as a percentage
        constraints: 0.0..25.0
      - name: sightline_m
        type: number
        source: input
        description: sightline distance recorded by the SURVEY action; 0.0 until surveyed
        default: 0.0
        constraints: ">= 0.0"
      - name: pedestrian_flow_per_min
        type: number
        source: input
        description: pedestrian right-of-way exposure recorded by the SURVEY action; 0.0 until surveyed
        default: 0.0
        constraints: ">= 0.0"
      - name: curb_ramp_present
        type: boolean
        source: input
        description: accessibility curb-ramp presence recorded by the SURVEY action
        default: false
      - name: crossing_risk_score
        type: number
        source: computed
        description: output of calculations.crossing_risk_score; null until the SURVEY action runs
        default: null
        constraints: 0.0..100.0, one decimal place
      - name: status
        type: enum
        source: system
        description: mapping/approval lifecycle state of the segment
        default: MAPPED
        constraints: "MAPPED | SURVEYED | APPROVED | BLOCKED | RETIRED"
      - name: connected_segment_ids
        type: array
        source: input
        description: "self-referential adjacency set: SidewalkSegment.id values reachable from this segment in one hop. Not a foreign key column; the server enforces symmetric closure (adding B to A also adds A to B) on POST /sidewalk-segments. Route contiguity is checked against this set."
        default: []
      - name: blocked_by_closure_id
        type: string
        source: system
        description: "denormalized back-pointer holding the SegmentClosure.id whose ACTIVE HARD closure forced status == BLOCKED; null otherwise. The owning foreign key is SegmentClosure.segment_id -> SidewalkSegment.id, so this column is a cascade-maintained mirror, not an FK."
        default: null

  - name: SegmentClosure
    parent: null
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: FK -> SidewalkSegment.id; the segment taken out of service by this closure
        constraints: required
      - name: closure_kind
        type: enum
        source: input
        description: HARD closures block the segment and force reroutes; ADVISORY closures are informational only
        constraints: "HARD | ADVISORY"
      - name: cause
        type: enum
        source: input
        description: operational cause of the closure
        constraints: "CONSTRUCTION | WEATHER | EVENT | VANDALISM"
      - name: starts_at_utc
        type: datetime
        source: input
        description: inclusive start instant of the closed interval
        constraints: ISO 8601 UTC with three fractional digits
      - name: ends_at_utc
        type: datetime
        source: input
        description: inclusive end instant of the closed interval; must be strictly after starts_at_utc
        constraints: ISO 8601 UTC with three fractional digits
      - name: state
        type: enum
        source: system
        description: closure lifecycle state
        default: SCHEDULED
        constraints: "SCHEDULED | ACTIVE | LIFTED"
      - name: reroute_triggered_count
        type: integer
        source: computed
        description: number of ACTIVE RoutePlans this closure superseded when it was activated
        default: 0

  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: FK -> ServiceZone.id; the zone whose robots serve this merchant
        constraints: required
      - name: name
        type: string
        source: input
        description: merchant trading name
        constraints: 1..120 chars, required
      - name: handoff_sla_seconds
        type: integer
        source: input
        description: seconds allowed between mission creation and container LOAD before the handoff counts as late
        default: 300
        constraints: ">= 0"
      - name: merchant_grade
        type: enum
        source: input
        description: commercial grade selecting the fee discount percentage
        default: STANDARD
        constraints: "STANDARD | PREFERRED | ANCHOR"
      - name: integration_state
        type: enum
        source: system
        description: order-intake integration state; only ACTIVE merchants may create DeliveryOrders
        default: PENDING
        constraints: "PENDING | ACTIVE | SUSPENDED"
      - name: escrowed_fee_cents
        type: integer
        source: computed
        description: conserved money quantity; quoted fees held for orders that are neither delivered nor released
        default: 0
      - name: recognized_fee_cents
        type: integer
        source: computed
        description: conserved money quantity; quoted fees recognized when an order reached DELIVERED
        default: 0
      - name: released_fee_cents
        type: integer
        source: computed
        description: conserved money quantity; quoted fees released when an order was cancelled or ended in EXCEPTION
        default: 0
      - name: settlement_variance_cents
        type: integer
        source: computed
        description: running sum of (settled_fee_cents - quoted_fee_cents) over DELIVERED orders; deliberately outside the escrow invariant
        default: 0
      - name: exception_count
        type: integer
        source: computed
        description: number of this merchant's orders that entered EXCEPTION plus the number of late container handoffs
        default: 0

  - name: Robot
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: FK -> ServiceZone.id; the zone this robot is homed to
        constraints: required
      - name: asset_tag
        type: string
        source: input
        description: fleet asset tag
        constraints: required, globally unique
      - name: width_cm
        type: number
        source: input
        description: widest chassis dimension; drives accessibility clearance margin arithmetic
        constraints: "> 0, required"
      - name: container_capacity_liters
        type: number
        source: input
        description: usable cargo container volume
        constraints: "> 0, required"
      - name: max_speed_cm_s
        type: integer
        source: input
        description: maximum commanded ground speed; must not exceed the zone ordinance speed
        constraints: "> 0, required"
      - name: battery_pct
        type: number
        source: system
        description: state of charge, updated only by POST /robots/{robot_id}/telemetry
        default: 100.0
        constraints: 0.0..100.0
      - name: duty_state
        type: enum
        source: system
        description: "first parallel state dimension: what the robot is doing"
        default: OFFLINE
        constraints: "OFFLINE | STAGING | AVAILABLE | ON_MISSION | CHARGING | MAINTENANCE | RETIRED"
      - name: health_state
        type: enum
        source: system
        description: "second parallel state dimension: fitness for service; evolves independently of duty_state"
        default: NOMINAL
        constraints: "NOMINAL | DEGRADED | IMPAIRED | QUARANTINED"
      - name: odometer_m
        type: number
        source: system
        description: lifetime distance accumulated from telemetry deltas
        default: 0.0
      - name: yield_event_count
        type: integer
        source: system
        description: cumulative pedestrian right-of-way yield events reported by telemetry
        default: 0
      - name: tamper_flag
        type: boolean
        source: system
        description: latched vandalism/tamper indicator raised by telemetry; cleared only by a CLEAR health transition
        default: false
      - name: lifetime_mission_count
        type: integer
        source: computed
        description: count of this robot's DeliveryMissions in a terminal state (COMPLETED or ABORTED)
        default: 0
      - name: lifetime_intervention_count
        type: integer
        source: computed
        description: sum of intervention_count over this robot's terminal DeliveryMissions
        default: 0
      - name: lifetime_escalation_count
        type: integer
        source: computed
        description: sum of escalation_count over this robot's terminal DeliveryMissions
        default: 0
      - name: clean_mission_count
        type: integer
        source: computed
        description: count of this robot's terminal DeliveryMissions whose intervention_count == 0
        default: 0
      - name: rolling_autonomy_index
        type: integer
        source: computed
        description: decayed windowed variant of calculations.robot_autonomy_index; gates selector eligibility
        default: 100
        constraints: 40..100
      - name: lifetime_autonomy_index
        type: integer
        source: computed
        description: undecayed cumulative variant of calculations.robot_autonomy_index; reported, never used as a gate
        default: 100
        constraints: 40..100
      - name: active_mission_id
        type: string
        source: system
        description: "denormalized back-pointer to the DeliveryMission currently occupying this robot; null when duty_state != ON_MISSION. The owning foreign key is DeliveryMission.robot_id -> Robot.id."
        default: null
      - name: current_bay_reservation_id
        type: string
        source: system
        description: "denormalized back-pointer to the BayReservation authorising the current CHARGING or MAINTENANCE duty state; null otherwise. The owning foreign key is BayReservation.robot_id -> Robot.id."
        default: null

  - name: DepotBay
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: FK -> ServiceZone.id; the zone whose fleet this bay serves
        constraints: required
      - name: bay_code
        type: string
        source: input
        description: depot bay label
        constraints: required, unique within (zone_id, bay_code)
      - name: bay_type
        type: enum
        source: input
        description: what the bay can be reserved for
        constraints: "CHARGE | STAGE | SERVICE"
      - name: power_kw
        type: number
        source: input
        description: charger output; 0 for STAGE and SERVICE bays
        default: 0.0
        constraints: ">= 0.0"
      - name: committed_minutes
        type: integer
        source: computed
        description: sum of window_minutes over this bay's BayReservations whose state IN {HELD, ACTIVE}
        default: 0
      - name: state
        type: enum
        source: input
        description: bay availability, fixed at provisioning; OUT_OF_SERVICE bays reject every reservation
        default: OPEN
        constraints: "OPEN | OUT_OF_SERVICE"

  - name: BayReservation
    parent: null
    common_fields: true
    fields:
      - name: bay_id
        type: string
        source: input
        description: FK -> DepotBay.id; the reserved bay
        constraints: required
      - name: robot_id
        type: string
        source: input
        description: FK -> Robot.id; the robot the bay is held for
        constraints: required
      - name: reservation_type
        type: enum
        source: input
        description: purpose of the occupation; must match the bay_type mapping in validations
        constraints: "CHARGE | SERVICE | STAGE"
      - name: window_start_utc
        type: datetime
        source: input
        description: inclusive start of the half-open occupation interval
        constraints: ISO 8601 UTC with three fractional digits
      - name: window_end_utc
        type: datetime
        source: input
        description: exclusive end of the half-open occupation interval; must be strictly after window_start_utc
        constraints: ISO 8601 UTC with three fractional digits
      - name: state
        type: enum
        source: system
        description: reservation lifecycle state
        default: HELD
        constraints: "HELD | ACTIVE | RELEASED | CANCELLED"
      - name: window_minutes
        type: integer
        source: computed
        description: whole minutes between window_start_utc and window_end_utc, floor; the unit of the conserved bay-minutes quantity

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: FK -> Merchant.id; the merchant that originated the order
        constraints: required
      - name: dropoff_segment_id
        type: string
        source: input
        description: FK -> SidewalkSegment.id; the segment the customer takes delivery on; must be the last element of any route plan
        constraints: required
      - name: customer_ref
        type: string
        source: input
        description: merchant-side customer reference used for remedy correspondence
        constraints: 1..64 chars, required
      - name: payload_liters
        type: number
        source: input
        description: declared cargo volume; drives payload_tier and the robot capacity gate
        constraints: "> 0, required"
      - name: declared_value_cents
        type: integer
        source: input
        description: customer-declared cargo value; capped input to the remedy value bucket
        constraints: ">= 0, required"
      - name: promised_by_utc
        type: datetime
        source: input
        description: promised delivery instant; compared to created_at to latch urgency_flag
        constraints: ISO 8601 UTC with three fractional digits, strictly after created_at
      - name: urgency_flag
        type: boolean
        source: computed
        description: latched once at creation; true when promised_by_utc - created_at <= URGENCY_WINDOW_MINUTES
      - name: payload_tier
        type: enum
        source: computed
        description: tier selected from payload_liters at creation; the settlement variant re-selects it from the mission's actual_payload_liters
        constraints: "SMALL | MEDIUM | LARGE"
      - name: quoted_fee_cents
        type: integer
        source: computed
        description: forward_looking variant of calculations.delivery_fee, computed once at order creation from zone planning constants
      - name: settled_fee_cents
        type: integer
        source: computed
        description: chronological variant of calculations.delivery_fee, computed at mission COMPLETE from replayed actuals; null until then
        default: null
      - name: order_state
        type: enum
        source: system
        description: customer-facing order lifecycle; EXCEPTION may cycle back to DISPATCHED via a REDELIVER remedy
        default: RECEIVED
        constraints: "RECEIVED | DISPATCHED | IN_TRANSIT | DELIVERED | EXCEPTION | CANCELLED | REFUNDED"
      - name: exception_reason
        type: enum
        source: system
        description: cause latched when the order entered EXCEPTION; selects the remedy policy row
        default: null
        constraints: "BLOCKED_ROUTE | WEATHER | VANDALISM | ROBOT_FAULT | LATE"
      - name: remedy_kind
        type: enum
        source: system
        description: remedy issued by CustomerSupport; null until a remedy is issued
        default: null
        constraints: "REFUND | REDELIVER | GOODWILL_CREDIT"
      - name: remedy_reason_code
        type: enum
        source: system
        description: policy row actually applied by calculations.customer_remedy_amount
        default: null
        constraints: "BLOCKED_ROUTE | WEATHER | VANDALISM | ROBOT_FAULT | LATE"
      - name: remedy_amount_cents
        type: integer
        source: computed
        description: output of calculations.customer_remedy_amount; null until a remedy is issued
        default: null
      - name: dispatch_attempt_count
        type: integer
        source: computed
        description: number of DeliveryMissions ever created for this order
        default: 0

  - name: DeliveryMission
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> DeliveryOrder.id; the order this mission fulfils
        constraints: required
      - name: robot_id
        type: string
        source: input
        description: FK -> Robot.id; when POST /delivery-missions omits robot_id the server picks it with calculations.robot_selector
        constraints: required after creation
      - name: mission_state
        type: enum
        source: system
        description: mission lifecycle with the EN_ROUTE -> BLOCKED -> EN_ROUTE reroute cycle
        default: PLANNED
        constraints: "PLANNED | LOADED | EN_ROUTE | BLOCKED | HANDOFF_READY | COMPLETED | ABORTED"
      - name: lid_access_code
        type: string
        source: system
        description: six-digit container lid code minted at LOAD as zero-padded decimal of (100000 + zone.lid_code_sequence after increment); null before LOAD
        default: null
      - name: actual_payload_liters
        type: number
        source: system
        description: volume actually loaded by the merchant at LOAD; re-tiers the fee in the settlement variant
        default: null
      - name: handoff_late
        type: boolean
        source: computed
        description: true when the LOAD instant minus created_at strictly exceeds merchant.handoff_sla_seconds
        default: false
      - name: active_route_plan_id
        type: string
        source: system
        description: "denormalized back-pointer to the RoutePlan whose plan_state == ACTIVE for this mission; null when none. The owning foreign key is RoutePlan.mission_id -> DeliveryMission.id."
        default: null
      - name: blocking_segment_id
        type: string
        source: system
        description: "denormalized back-pointer to the SidewalkSegment that caused mission_state == BLOCKED; null otherwise. Resolved against SidewalkSegment.id."
        default: null
      - name: traveled_distance_m
        type: number
        source: computed
        description: chronological accumulator; incremented by the activated plan's total_length_m at each DEPART and RESUME
        default: 0.0
      - name: traversed_crossing_count
        type: integer
        source: computed
        description: chronological accumulator; incremented by the activated plan's crossing_count at each DEPART and RESUME
        default: 0
      - name: blocked_minutes
        type: integer
        source: computed
        description: chronological accumulator of whole minutes spent in BLOCKED, added at each RESUME
        default: 0
      - name: intervention_count
        type: integer
        source: computed
        description: number of this mission's InterventionEvents that reached RELEASED
        default: 0
      - name: escalation_count
        type: integer
        source: computed
        description: number of this mission's InterventionEvents that passed through ESCALATED
        default: 0
      - name: active_minutes
        type: integer
        source: computed
        description: whole minutes between departed_at_utc and the terminal transition instant; 0 while the mission has not departed
        default: 0
      - name: departed_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the first DEPART
        default: null
      - name: blocked_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the most recent entry into BLOCKED; null when not blocked
        default: null
      - name: completed_at_utc
        type: datetime
        source: system
        description: logical-clock instant of COMPLETE or ABORT
        default: null
      - name: abort_reason
        type: enum
        source: system
        description: cause latched on ABORT
        default: null
        constraints: "ROBOT_QUARANTINED | ZONE_REVOKED | DISPATCH_CANCELLED | UNRECOVERABLE_BLOCKAGE"

  - name: RoutePlan
    parent: null
    common_fields: true
    fields:
      - name: mission_id
        type: string
        source: input
        description: FK -> DeliveryMission.id; the mission this plan routes
        constraints: required
      - name: segment_sequence
        type: array
        source: input
        description: ordered list of SidewalkSegment.id values forming the planned path; adjacency is checked against SidewalkSegment.connected_segment_ids
        constraints: length >= 1, no repeated element, required
      - name: plan_state
        type: enum
        source: system
        description: plan lifecycle; a newly ACTIVE plan supersedes the mission's previous ACTIVE plan
        default: DRAFT
        constraints: "DRAFT | VALIDATED | ACTIVE | SUPERSEDED | REJECTED"
      - name: total_length_m
        type: number
        source: computed
        description: sum of length_m over segment_sequence in order
      - name: crossing_count
        type: integer
        source: computed
        description: count of segment_sequence elements whose segment_type == CROSSING
      - name: clearance_margin_cm
        type: number
        source: computed
        description: output of calculations.route_clearance_margin; minimum accessibility slack across the plan for the mission's robot
      - name: planned_duration_min
        type: integer
        source: computed
        description: ceil(total_length_m / (robot.max_speed_cm_s * 0.6)) whole minutes; used by the operating-window containment check
      - name: revision_index
        type: integer
        source: computed
        description: 1-based ordinal of this plan among the mission's plans ordered by created_at ASC
      - name: supersedes_plan_id
        type: string
        source: system
        description: "denormalized back-pointer to the RoutePlan this plan displaced when it became ACTIVE; null for the first ACTIVE plan. Resolved against RoutePlan.id."
        default: null
      - name: rejection_reason
        type: enum
        source: system
        description: cause latched on REJECT or on cascade supersession
        default: null
        constraints: "OPERATOR_REJECTED | SEGMENT_BLOCKED | REPLACED_BY_NEWER"

  - name: InterventionEvent
    parent: null
    common_fields: true
    fields:
      - name: mission_id
        type: string
        source: input
        description: FK -> DeliveryMission.id; the mission whose autonomy was interrupted
        constraints: required
      - name: trigger_reason
        type: enum
        source: input
        description: why the remote operator was pulled in
        constraints: "LOW_CONFIDENCE | PEDESTRIAN_CONFLICT | OBSTACLE | CROSSING_ASSIST | VANDALISM_ALERT"
      - name: autonomy_confidence_pct
        type: integer
        source: input
        description: onboard autonomy confidence at the moment of the request; compared to the zone takeover threshold
        constraints: 0..100, required
      - name: takeover_state
        type: enum
        source: system
        description: takeover procedure state
        default: REQUESTED
        constraints: "REQUESTED | ACKNOWLEDGED | ACTIVE | RELEASED | ESCALATED"
      - name: mandatory
        type: boolean
        source: computed
        description: true when autonomy_confidence_pct <= zone.takeover_confidence_threshold_pct at request time
      - name: operator_user_id
        type: string
        source: system
        description: X-User-ID of the RemoteOperator that ran ASSUME; null until the takeover becomes ACTIVE
        default: null
      - name: control_seconds
        type: integer
        source: computed
        description: whole seconds between the ASSUME instant and the RELEASE instant on the logical clock
        default: 0
      - name: assumed_at_utc
        type: datetime
        source: system
        description: logical-clock instant of ASSUME
        default: null
      - name: escalation_reason
        type: string
        source: system
        description: free text recorded by ESCALATE
        default: null

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: FK -> ServiceZone.id; the zone whose municipality receives the report
        constraints: required
      - name: mission_id
        type: string
        source: input
        description: FK -> DeliveryMission.id; the mission involved, or null for a non-mission incident
        default: null
      - name: robot_id
        type: string
        source: input
        description: FK -> Robot.id; the robot involved
        constraints: required
      - name: category
        type: enum
        source: input
        description: municipal reporting category
        constraints: "PEDESTRIAN_CONTACT | RIGHT_OF_WAY_VIOLATION | VANDALISM | OBSTRUCTION | CLEARANCE_BREACH"
      - name: severity
        type: enum
        source: input
        description: severity band driving the municipal deadline and the insurer gate
        constraints: "MINOR | SERIOUS | CRITICAL"
      - name: narrative
        type: string
        source: input
        description: operator narrative filed with the municipality
        constraints: 1..2000 chars, required
      - name: estimated_damage_cents
        type: integer
        source: input
        description: estimated third-party and equipment damage; compared to the zone insurer threshold
        default: 0
        constraints: ">= 0"
      - name: report_state
        type: enum
        source: system
        description: reporting workflow state; the municipal-only and municipal-plus-insurer branches converge on CLOSED
        default: DRAFT
        constraints: "DRAFT | SUBMITTED_MUNICIPAL | INSURER_NOTIFIED | CLOSED | REJECTED"
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RemoteOperator that filed the draft, or the literal "SYSTEM" for cascade-created drafts
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the SafetyOfficer that first moved the report out of DRAFT; must differ from filed_by_user_id
        default: null
      - name: municipal_case_ref
        type: string
        source: system
        description: municipal case reference supplied by the SUBMIT_MUNICIPAL action
        default: null
      - name: insurer_claim_ref
        type: string
        source: system
        description: insurer claim reference supplied by the NOTIFY_INSURER action
        default: null
      - name: insurer_notification_required
        type: boolean
        source: computed
        description: true when severity == CRITICAL OR estimated_damage_cents >= zone.insurer_notify_threshold_cents
      - name: municipal_due_by_utc
        type: datetime
        source: computed
        description: "created_at + 72 hours (MUNICIPAL_FILING_HOURS = 72, a fixed platform constant) when severity IN {SERIOUS, CRITICAL}; null for MINOR"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version; no other mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: route-plan-create-stale-mission
    parent_entity: DeliveryMission
    write_endpoint: "POST /route-plans"
    occ_field: "expected_delivery_mission_version"
    description: |
      Creating a RoutePlan against a DeliveryMission whose version has advanced
      since the client last read it is rejected. A reroute plan legitimately
      supersedes the mission's previous ACTIVE plan, so a create that carries a
      stale mission version would silently displace a plan the client never saw;
      the OCC check turns that into a deterministic stale-version rejection.
    error_id: ERR_STALE_MISSION_VERSION
    http_status: 412
  - rule_id: bay-reservation-create-stale-bay
    parent_entity: DepotBay
    write_endpoint: "POST /bay-reservations"
    occ_field: "expected_depot_bay_version"
    description: |
      Creating a BayReservation against a DepotBay whose version has advanced
      since the client last read it is rejected. A non-overlapping window on the
      same bay is legitimate on its own merits, so the only way to guarantee the
      client reasoned about the bay's real committed_minutes ledger is to pin the
      version it observed.
    error_id: ERR_STALE_BAY_VERSION
    http_status: 412
  - rule_id: mission-create-stale-order
    parent_entity: DeliveryOrder
    write_endpoint: "POST /delivery-missions"
    occ_field: "expected_delivery_order_version"
    description: |
      Creating a DeliveryMission against a DeliveryOrder whose version has
      advanced since the client last read it is rejected. A redelivery mission
      legitimately supersedes an aborted predecessor, so a create carrying a
      stale order version can double-dispatch an order whose state the client
      has not observed.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceZone
    state_field: permit_state
    initial_state: PROVISIONED
    terminal_states: [REVOKED]
    transitions:
      - from: PROVISIONED
        to: PERMITTED
        trigger: "POST /service-zones/{zone_id}/permit-transitions {action: ACTIVATE_PERMIT}"
        actor: PlatformAdmin
        preconditions:
          - "permit_state == PROVISIONED"
          - "at least one SidewalkSegment with zone_id == this zone has status == APPROVED"
        side_effects:
          - "permit_state = PERMITTED"
          - "restriction_reason = null"
          - "increments ServiceZone.version by 1"
      - from: PERMITTED
        to: RESTRICTED
        trigger: "POST /service-zones/{zone_id}/permit-transitions {action: RESTRICT, reason}"
        actor: PlatformAdmin
        preconditions:
          - "permit_state == PERMITTED"
        side_effects:
          - "permit_state = RESTRICTED; restriction_reason = reason"
          - "no side effect on in-flight DeliveryMissions: missions already EN_ROUTE or BLOCKED continue; only new dispatch is refused with ERR_ZONE_NOT_PERMITTED"
          - "increments ServiceZone.version by 1"
      - from: RESTRICTED
        to: PERMITTED
        trigger: "POST /service-zones/{zone_id}/permit-transitions {action: LIFT_RESTRICTION}"
        actor: PlatformAdmin
        preconditions:
          - "permit_state == RESTRICTED"
        side_effects:
          - "permit_state = PERMITTED; restriction_reason = null"
          - "increments ServiceZone.version by 1"
        note: "closes the PERMITTED -> RESTRICTED -> PERMITTED cycle"
      - from: PERMITTED
        to: REVOKED
        trigger: "POST /service-zones/{zone_id}/permit-transitions {action: REVOKE, reason}"
        actor: PlatformAdmin
        preconditions:
          - "permit_state IN {PERMITTED, RESTRICTED}"
        side_effects:
          - "permit_state = REVOKED; restriction_reason = reason"
          - "every DeliveryMission whose robot.zone_id == this zone and mission_state IN {PLANNED, LOADED, EN_ROUTE, BLOCKED} -> ABORTED with abort_reason = ZONE_REVOKED, processed in created_at ASC order"
          - "each such mission's DeliveryOrder -> EXCEPTION with exception_reason = BLOCKED_ROUTE; merchant.escrowed_fee_cents -= quoted_fee_cents; merchant.released_fee_cents += quoted_fee_cents; merchant.exception_count += 1"
          - "each such robot follows its declared ON_MISSION -> AVAILABLE duty transition because the mission reached a terminal state; active_mission_id = null and zone.on_mission_robot_count is decremented once per robot"
          - "increments ServiceZone.version by 1"
      - from: RESTRICTED
        to: REVOKED
        trigger: "POST /service-zones/{zone_id}/permit-transitions {action: REVOKE, reason}"
        actor: PlatformAdmin
        preconditions:
          - "permit_state IN {PERMITTED, RESTRICTED}"
        side_effects:
          - "identical to the PERMITTED -> REVOKED side-effect set"

  - entity: SidewalkSegment
    state_field: status
    initial_state: MAPPED
    terminal_states: [RETIRED]
    transitions:
      - from: MAPPED
        to: SURVEYED
        trigger: "POST /sidewalk-segments/{segment_id}/transitions {action: SURVEY, sightline_m, pedestrian_flow_per_min, curb_ramp_present, measured_clearance_cm}"
        actor: PlatformAdmin
        preconditions:
          - "status == MAPPED"
        side_effects:
          - "sightline_m, pedestrian_flow_per_min, curb_ramp_present, measured_clearance_cm overwritten from the request when supplied; each of the four is optional and an omitted field keeps the value recorded by POST /sidewalk-segments"
          - "recompute crossing_risk_score per calculations.crossing_risk_score from the resulting field values, so a SURVEY that supplies no overrides scores the mapped values"
          - "status = SURVEYED"
          - "increments SidewalkSegment.version by 1"
      - from: SURVEYED
        to: APPROVED
        trigger: "POST /sidewalk-segments/{segment_id}/transitions {action: APPROVE}"
        actor: PlatformAdmin
        preconditions:
          - "status == SURVEYED"
          - "measured_clearance_cm >= zone.ordinance_min_clearance_cm (else ERR_CLEARANCE_INSUFFICIENT)"
          - "crossing_risk_score <= zone.max_crossing_risk (else ERR_CROSSING_RISK_EXCEEDED)"
        side_effects:
          - "status = APPROVED"
          - "increments SidewalkSegment.version by 1"
      - from: APPROVED
        to: BLOCKED
        trigger: "system: cascade link 2 of the SegmentClosure SCHEDULED -> ACTIVE transition when closure_kind == HARD"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "the activating closure has closure_kind == HARD (an ADVISORY closure leaves status untouched)"
        side_effects:
          - "status = BLOCKED; blocked_by_closure_id = the activating SegmentClosure.id"
          - "increments SidewalkSegment.version by 1"
          - "triggers cascade link 3: RoutePlan supersession"
      - from: BLOCKED
        to: APPROVED
        trigger: "system: cascade of the SegmentClosure ACTIVE -> LIFTED transition"
        actor: system
        preconditions:
          - "status == BLOCKED"
          - "no remaining SegmentClosure on this segment with closure_kind == HARD and state == ACTIVE"
        side_effects:
          - "status = APPROVED; blocked_by_closure_id = null"
          - "no automatic mission resumption: a blocked DeliveryMission stays BLOCKED until a new RoutePlan is activated and RESUME is called"
          - "increments SidewalkSegment.version by 1"
        note: "closes the APPROVED -> BLOCKED -> APPROVED cycle"
      - from: SURVEYED
        to: RETIRED
        trigger: "POST /sidewalk-segments/{segment_id}/transitions {action: RETIRE}"
        actor: PlatformAdmin
        preconditions:
          - "status IN {SURVEYED, APPROVED}"
          - "no RoutePlan with plan_state == ACTIVE contains this segment id in segment_sequence"
        side_effects:
          - "status = RETIRED"
          - "this segment id is removed from connected_segment_ids of every neighbour, and their versions increment by 1 each, processed in created_at ASC order"
          - "increments SidewalkSegment.version by 1"
      - from: APPROVED
        to: RETIRED
        trigger: "POST /sidewalk-segments/{segment_id}/transitions {action: RETIRE}"
        actor: PlatformAdmin
        preconditions:
          - "status IN {SURVEYED, APPROVED}"
          - "no RoutePlan with plan_state == ACTIVE contains this segment id in segment_sequence"
        side_effects:
          - "identical to the SURVEYED -> RETIRED side-effect set"

  - entity: SegmentClosure
    state_field: state
    initial_state: SCHEDULED
    terminal_states: [LIFTED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /segment-closures/{closure_id}/transitions {action: ACTIVATE}"
        actor: PlatformAdmin
        preconditions:
          - "state == SCHEDULED"
          - "current_utc >= starts_at_utc AND current_utc <= ends_at_utc on the logical clock"
        side_effects:
          - "cascade link 1: state = ACTIVE"
          - "cascade link 2 (caused by link 1, only when closure_kind == HARD): SidewalkSegment.status APPROVED -> BLOCKED, blocked_by_closure_id = this closure id"
          - "cascade link 3 (caused by link 2): every RoutePlan with plan_state == ACTIVE whose segment_sequence contains the blocked segment id -> SUPERSEDED with rejection_reason = SEGMENT_BLOCKED, processed in created_at ASC order; reroute_triggered_count += 1 per superseded plan"
          - "cascade link 4 (caused by link 3): each superseded plan's DeliveryMission with mission_state == EN_ROUTE -> BLOCKED, blocking_segment_id = the blocked segment id, blocked_at_utc = current_utc, active_route_plan_id = null"
          - "cascade link 5 (caused by link 4): each newly BLOCKED mission's DeliveryOrder with order_state == IN_TRANSIT -> EXCEPTION with exception_reason = (WEATHER when cause == WEATHER, VANDALISM when cause == VANDALISM, otherwise BLOCKED_ROUTE); merchant.escrowed_fee_cents -= quoted_fee_cents; merchant.released_fee_cents += quoted_fee_cents; merchant.exception_count += 1"
          - "increments SegmentClosure.version by 1"
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /segment-closures/{closure_id}/transitions {action: LIFT}"
        actor: PlatformAdmin
        preconditions:
          - "state == ACTIVE"
        side_effects:
          - "state = LIFTED"
          - "when closure_kind == HARD and no other closure on the same segment has closure_kind == HARD and state == ACTIVE: SidewalkSegment.status BLOCKED -> APPROVED and blocked_by_closure_id = null"
          - "increments SegmentClosure.version by 1"
      - from: SCHEDULED
        to: LIFTED
        trigger: "POST /segment-closures/{closure_id}/transitions {action: LIFT}"
        actor: PlatformAdmin
        preconditions:
          - "state == SCHEDULED"
        side_effects:
          - "state = LIFTED; no segment or route side effects because the closure never became ACTIVE"
          - "increments SegmentClosure.version by 1"

  - entity: Merchant
    state_field: integration_state
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /merchants/{merchant_id}/integration-transitions {action: ACTIVATE}"
        actor: PlatformAdmin
        preconditions:
          - "integration_state == PENDING"
          - "zone.permit_state == PERMITTED (else ERR_ZONE_NOT_PERMITTED)"
        side_effects:
          - "integration_state = ACTIVE"
          - "increments Merchant.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /merchants/{merchant_id}/integration-transitions {action: SUSPEND}"
        actor: PlatformAdmin
        preconditions:
          - "integration_state == ACTIVE"
        side_effects:
          - "integration_state = SUSPENDED"
          - "no side effect on existing DeliveryOrders; only new order intake is refused with ERR_MERCHANT_NOT_ACTIVE"
          - "increments Merchant.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /merchants/{merchant_id}/integration-transitions {action: REINSTATE}"
        actor: PlatformAdmin
        preconditions:
          - "integration_state == SUSPENDED"
          - "zone.permit_state == PERMITTED"
        side_effects:
          - "integration_state = ACTIVE"
          - "increments Merchant.version by 1"

  - entity: Robot
    state_field: duty_state
    initial_state: OFFLINE
    terminal_states: [RETIRED]
    note: "first of two parallel state dimensions on the Robot row; duty_state and health_state advance independently and are driven by different endpoints and different roles"
    transitions:
      - from: OFFLINE
        to: STAGING
        trigger: "POST /robots/{robot_id}/duty-transitions {action: STAGE}"
        actor: FleetDispatcher
        preconditions:
          - "duty_state == OFFLINE"
          - "zone.permit_state == PERMITTED (else ERR_ZONE_NOT_PERMITTED)"
          - "max_speed_cm_s <= zone.ordinance_max_speed_cm_s (else ERR_ORDINANCE_SPEED_EXCEEDED)"
          - "health_state != QUARANTINED (else ERR_ROBOT_HEALTH_BLOCKED)"
        side_effects:
          - "duty_state = STAGING"
          - "increments Robot.version by 1"
      - from: STAGING
        to: AVAILABLE
        trigger: "POST /robots/{robot_id}/duty-transitions {action: MAKE_AVAILABLE}"
        actor: FleetDispatcher
        preconditions:
          - "duty_state == STAGING"
          - "health_state IN {NOMINAL, DEGRADED} (else ERR_ROBOT_HEALTH_BLOCKED)"
          - "battery_pct >= calculations.robot_selector.MIN_BATTERY_PCT"
        side_effects:
          - "duty_state = AVAILABLE"
          - "increments Robot.version by 1"
      - from: AVAILABLE
        to: ON_MISSION
        trigger: "system: POST /delivery-missions selected or accepted this robot"
        actor: system
        preconditions:
          - "duty_state == AVAILABLE (else ERR_ROBOT_NOT_AVAILABLE)"
          - "health_state IN {NOMINAL, DEGRADED} (else ERR_ROBOT_HEALTH_BLOCKED)"
          - "zone.on_mission_robot_count < zone.max_concurrent_robots (else ERR_ZONE_ROBOT_CAP_EXCEEDED)"
        side_effects:
          - "duty_state = ON_MISSION; active_mission_id = the new DeliveryMission.id"
          - "zone.on_mission_robot_count += 1; increments ServiceZone.version by 1"
          - "increments Robot.version by 1"
      - from: ON_MISSION
        to: AVAILABLE
        trigger: "system: the robot's DeliveryMission reached COMPLETED or ABORTED"
        actor: system
        preconditions:
          - "duty_state == ON_MISSION"
          - "health_state != QUARANTINED (a quarantined robot goes to MAINTENANCE instead)"
        side_effects:
          - "duty_state = AVAILABLE; active_mission_id = null"
          - "zone.on_mission_robot_count -= 1; increments ServiceZone.version by 1"
          - "lifetime_mission_count += 1; lifetime_intervention_count += mission.intervention_count; lifetime_escalation_count += mission.escalation_count; clean_mission_count += 1 when mission.intervention_count == 0"
          - "recompute rolling_autonomy_index and lifetime_autonomy_index per calculations.robot_autonomy_index"
          - "increments Robot.version by 1"
      - from: ON_MISSION
        to: MAINTENANCE
        trigger: "system: cascade link 2 of a health_state -> QUARANTINED transition while duty_state == ON_MISSION"
        actor: system
        preconditions:
          - "duty_state == ON_MISSION"
          - "health_state == QUARANTINED"
        side_effects:
          - "duty_state = MAINTENANCE; active_mission_id = null"
          - "zone.on_mission_robot_count -= 1; increments ServiceZone.version by 1"
          - "the mission named by active_mission_id -> ABORTED with abort_reason = ROBOT_QUARANTINED (cascade link 2 continues into link 3)"
          - "increments Robot.version by 1"
      - from: AVAILABLE
        to: CHARGING
        trigger: "POST /robots/{robot_id}/duty-transitions {action: BEGIN_CHARGE, bay_reservation_id}"
        actor: FleetDispatcher
        preconditions:
          - "duty_state == AVAILABLE"
          - "the named BayReservation exists, has state == ACTIVE, reservation_type == CHARGE and robot_id == this robot (else ERR_RESERVATION_NOT_ACTIVE)"
        side_effects:
          - "duty_state = CHARGING; current_bay_reservation_id = the named reservation id"
          - "increments Robot.version by 1"
      - from: CHARGING
        to: AVAILABLE
        trigger: "POST /robots/{robot_id}/duty-transitions {action: MAKE_AVAILABLE}"
        actor: FleetDispatcher
        preconditions:
          - "duty_state == CHARGING"
          - "battery_pct >= calculations.robot_selector.MIN_BATTERY_PCT"
          - "health_state IN {NOMINAL, DEGRADED}"
        side_effects:
          - "duty_state = AVAILABLE"
          - "the reservation named by current_bay_reservation_id -> RELEASED; bay.committed_minutes -= window_minutes; zone.reserved_bay_minutes -= window_minutes; current_bay_reservation_id = null"
          - "increments Robot.version by 1"
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /robots/{robot_id}/duty-transitions {action: BEGIN_MAINTENANCE, bay_reservation_id}"
        actor: FleetDispatcher
        preconditions:
          - "duty_state == AVAILABLE"
          - "the named BayReservation exists, has state == ACTIVE, reservation_type == SERVICE and robot_id == this robot (else ERR_RESERVATION_NOT_ACTIVE)"
        side_effects:
          - "duty_state = MAINTENANCE; current_bay_reservation_id = the named reservation id"
          - "increments Robot.version by 1"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /robots/{robot_id}/duty-transitions {action: MAKE_AVAILABLE}"
        actor: FleetDispatcher
        preconditions:
          - "duty_state == MAINTENANCE"
          - "health_state IN {NOMINAL, DEGRADED} (else ERR_ROBOT_HEALTH_BLOCKED)"
          - "battery_pct >= calculations.robot_selector.MIN_BATTERY_PCT"
        side_effects:
          - "duty_state = AVAILABLE"
          - "when current_bay_reservation_id is not null: that reservation -> RELEASED; bay.committed_minutes -= window_minutes; zone.reserved_bay_minutes -= window_minutes; current_bay_reservation_id = null"
          - "increments Robot.version by 1"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /robots/{robot_id}/duty-transitions {action: RETIRE}"
        actor: FleetDispatcher
        preconditions:
          - "duty_state IN {OFFLINE, STAGING, AVAILABLE, CHARGING, MAINTENANCE}"
        side_effects:
          - "duty_state = RETIRED"
          - "every BayReservation of this robot with state IN {HELD, ACTIVE} -> CANCELLED, processed in created_at ASC order; bay.committed_minutes and zone.reserved_bay_minutes decrease by each window_minutes"
          - "increments Robot.version by 1"

  - entity: Robot
    state_field: health_state
    initial_state: NOMINAL
    terminal_states: []
    note: "second of two parallel state dimensions on the Robot row; a health transition never changes duty_state except for the QUARANTINED cascade"
    transitions:
      - from: NOMINAL
        to: DEGRADED
        trigger: "POST /robots/{robot_id}/health-transitions {action: DOWNGRADE, reason} OR system when POST /robots/{robot_id}/telemetry reports battery_pct <= calculations.robot_selector.LOW_BATTERY_PCT"
        actor: SafetyOfficer
        preconditions:
          - "health_state == NOMINAL"
        side_effects:
          - "health_state = DEGRADED"
          - "duty_state is deliberately unchanged, including when duty_state == ON_MISSION"
          - "increments Robot.version by 1"
      - from: DEGRADED
        to: IMPAIRED
        trigger: "POST /robots/{robot_id}/health-transitions {action: IMPAIR, reason}"
        actor: SafetyOfficer
        preconditions:
          - "health_state == DEGRADED"
        side_effects:
          - "health_state = IMPAIRED"
          - "duty_state unchanged; the robot becomes ineligible for calculations.robot_selector but any running mission continues"
          - "increments Robot.version by 1"
      - from: NOMINAL
        to: QUARANTINED
        trigger: "POST /robots/{robot_id}/health-transitions {action: QUARANTINE, reason} OR system when POST /robots/{robot_id}/telemetry reports tamper_flag == true"
        actor: SafetyOfficer
        preconditions:
          - "health_state IN {NOMINAL, DEGRADED, IMPAIRED}"
        side_effects:
          - "cascade link 1: health_state = QUARANTINED; tamper_flag = true when the trigger was telemetry"
          - "cascade link 2 (caused by link 1, only when duty_state == ON_MISSION): duty_state ON_MISSION -> MAINTENANCE, active_mission_id's DeliveryMission -> ABORTED with abort_reason = ROBOT_QUARANTINED, zone.on_mission_robot_count -= 1"
          - "cascade link 3 (caused by link 2): that mission's DeliveryOrder -> EXCEPTION with exception_reason = (VANDALISM when tamper_flag == true, otherwise ROBOT_FAULT); merchant.escrowed_fee_cents -= quoted_fee_cents; merchant.released_fee_cents += quoted_fee_cents; merchant.exception_count += 1; an IncidentReport is created in DRAFT with category = VANDALISM, severity = SERIOUS, filed_by_user_id = \"SYSTEM\", zone_id = robot.zone_id, mission_id = the aborted mission, robot_id = this robot, estimated_damage_cents = 0"
          - "cascade link 4 (caused by link 3): zone.open_incident_count += 1; increments ServiceZone.version by 1"
          - "increments Robot.version by 1"
      - from: DEGRADED
        to: QUARANTINED
        trigger: "POST /robots/{robot_id}/health-transitions {action: QUARANTINE, reason} OR system on telemetry tamper_flag == true"
        actor: SafetyOfficer
        preconditions:
          - "health_state IN {NOMINAL, DEGRADED, IMPAIRED}"
        side_effects:
          - "identical to the NOMINAL -> QUARANTINED cascade"
      - from: IMPAIRED
        to: QUARANTINED
        trigger: "POST /robots/{robot_id}/health-transitions {action: QUARANTINE, reason} OR system on telemetry tamper_flag == true"
        actor: SafetyOfficer
        preconditions:
          - "health_state IN {NOMINAL, DEGRADED, IMPAIRED}"
        side_effects:
          - "identical to the NOMINAL -> QUARANTINED cascade"
      - from: QUARANTINED
        to: NOMINAL
        trigger: "POST /robots/{robot_id}/health-transitions {action: CLEAR, reason}"
        actor: SafetyOfficer
        preconditions:
          - "health_state == QUARANTINED"
          - "duty_state != ON_MISSION"
          - "no IncidentReport with robot_id == this robot has report_state == DRAFT (else ERR_MANDATORY_INCIDENT_UNFILED)"
        side_effects:
          - "health_state = NOMINAL; tamper_flag = false"
          - "duty_state unchanged (a quarantined robot parked in MAINTENANCE still needs an explicit MAKE_AVAILABLE)"
          - "increments Robot.version by 1"
      - from: IMPAIRED
        to: DEGRADED
        trigger: "POST /robots/{robot_id}/health-transitions {action: CLEAR, reason}"
        actor: SafetyOfficer
        preconditions:
          - "health_state == IMPAIRED"
        side_effects:
          - "health_state = DEGRADED"
          - "increments Robot.version by 1"

  - entity: BayReservation
    state_field: state
    initial_state: HELD
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: HELD
        to: ACTIVE
        trigger: "POST /bay-reservations/{reservation_id}/transitions {action: ACTIVATE}"
        actor: FleetDispatcher
        preconditions:
          - "state == HELD"
          - "current_utc >= window_start_utc AND current_utc < window_end_utc on the logical clock"
          - "bay.state == OPEN"
        side_effects:
          - "state = ACTIVE"
          - "no change to bay.committed_minutes or zone.reserved_bay_minutes: HELD and ACTIVE both occupy the interval"
          - "increments BayReservation.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /bay-reservations/{reservation_id}/transitions {action: RELEASE} OR system on a CHARGING/MAINTENANCE -> AVAILABLE duty transition"
        actor: FleetDispatcher
        preconditions:
          - "state == ACTIVE"
        side_effects:
          - "state = RELEASED"
          - "bay.committed_minutes -= window_minutes; increments DepotBay.version by 1"
          - "zone.reserved_bay_minutes -= window_minutes; increments ServiceZone.version by 1"
          - "robot.current_bay_reservation_id = null when it pointed at this reservation"
          - "increments BayReservation.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /bay-reservations/{reservation_id}/transitions {action: CANCEL}"
        actor: FleetDispatcher
        preconditions:
          - "state == HELD"
        side_effects:
          - "state = CANCELLED"
          - "bay.committed_minutes -= window_minutes; increments DepotBay.version by 1"
          - "zone.reserved_bay_minutes -= window_minutes; increments ServiceZone.version by 1"
          - "the compensating half of the bay-minutes invariant: both ledgers return to their pre-create values"
          - "increments BayReservation.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system: the reserved Robot took a RETIRE duty transition"
        actor: system
        preconditions:
          - "state IN {HELD, ACTIVE}"
        side_effects:
          - "state = CANCELLED"
          - "bay.committed_minutes -= window_minutes; zone.reserved_bay_minutes -= window_minutes"
          - "increments BayReservation.version by 1"

  - entity: DeliveryOrder
    state_field: order_state
    initial_state: RECEIVED
    terminal_states: [DELIVERED, CANCELLED, REFUNDED]
    transitions:
      - from: RECEIVED
        to: DISPATCHED
        trigger: "system: POST /delivery-missions created a mission for this order"
        actor: system
        preconditions:
          - "order_state == RECEIVED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "order_state = DISPATCHED; dispatch_attempt_count += 1"
          - "increments DeliveryOrder.version by 1"
      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "system: the order's DeliveryMission took the DEPART transition"
        actor: system
        preconditions:
          - "order_state == DISPATCHED"
        side_effects:
          - "order_state = IN_TRANSIT"
          - "increments DeliveryOrder.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system: the order's DeliveryMission took the COMPLETE transition"
        actor: system
        preconditions:
          - "order_state == IN_TRANSIT"
        side_effects:
          - "settled_fee_cents = calculations.delivery_fee variant settlement_at_completion"
          - "order_state = DELIVERED"
          - "exception_reason = LATE when mission.completed_at_utc > promised_by_utc, otherwise left null"
          - "merchant.escrowed_fee_cents -= quoted_fee_cents; merchant.recognized_fee_cents += quoted_fee_cents; merchant.settlement_variance_cents += (settled_fee_cents - quoted_fee_cents); increments Merchant.version by 1"
          - "increments DeliveryOrder.version by 1"
      - from: DISPATCHED
        to: EXCEPTION
        trigger: "system: the order's DeliveryMission reached ABORTED"
        actor: system
        preconditions:
          - "order_state IN {DISPATCHED, IN_TRANSIT}"
        side_effects:
          - "order_state = EXCEPTION; exception_reason latched from the pinned abort mapping in calculations.exception_reason_mapping"
          - "merchant.escrowed_fee_cents -= quoted_fee_cents; merchant.released_fee_cents += quoted_fee_cents; merchant.exception_count += 1; increments Merchant.version by 1"
          - "increments DeliveryOrder.version by 1"
      - from: IN_TRANSIT
        to: EXCEPTION
        trigger: "system: the order's DeliveryMission reached ABORTED, or cascade link 5 of a HARD SegmentClosure activation moved the mission to BLOCKED"
        actor: system
        preconditions:
          - "order_state IN {DISPATCHED, IN_TRANSIT}"
        side_effects:
          - "identical to the DISPATCHED -> EXCEPTION side-effect set; for the closure cascade the exception_reason comes from closure.cause"
      - from: EXCEPTION
        to: RECEIVED
        trigger: "POST /delivery-orders/{order_id}/remedy {remedy_kind: REDELIVER}"
        actor: CustomerSupport
        preconditions:
          - "order_state == EXCEPTION"
          - "remedy_kind is null (else ERR_REMEDY_ALREADY_ISSUED)"
          - "exception_reason is not null"
        side_effects:
          - "order_state = RECEIVED; exception_reason = null"
          - "remedy_kind = REDELIVER; remedy_reason_code = the pre-clear exception_reason; remedy_amount_cents = 0"
          - "merchant.released_fee_cents -= quoted_fee_cents; merchant.escrowed_fee_cents += quoted_fee_cents; increments Merchant.version by 1 (the compensating direction of the merchant_fee_ledger invariant)"
          - "no change to zone.remedy_spent_cents"
          - "increments DeliveryOrder.version by 1"
        note: "closes the EXCEPTION -> RECEIVED -> DISPATCHED redelivery cycle"
      - from: EXCEPTION
        to: REFUNDED
        trigger: "POST /delivery-orders/{order_id}/remedy {remedy_kind: REFUND}"
        actor: CustomerSupport
        preconditions:
          - "order_state IN {EXCEPTION, DELIVERED}"
          - "remedy_kind is null (else ERR_REMEDY_ALREADY_ISSUED)"
          - "exception_reason is not null"
          - "calculations.customer_remedy_amount result <= zone.remedy_budget_remaining_cents (else ERR_REMEDY_BUDGET_EXCEEDED)"
        side_effects:
          - "remedy_kind = REFUND; remedy_reason_code = exception_reason; remedy_amount_cents = calculations.customer_remedy_amount"
          - "order_state = REFUNDED"
          - "zone.remedy_spent_cents += remedy_amount_cents; zone.remedy_budget_remaining_cents recomputed; increments ServiceZone.version by 1"
          - "increments DeliveryOrder.version by 1"
      - from: DELIVERED
        to: REFUNDED
        trigger: "POST /delivery-orders/{order_id}/remedy {remedy_kind: REFUND}"
        actor: CustomerSupport
        preconditions:
          - "order_state IN {EXCEPTION, DELIVERED}"
          - "exception_reason is not null (a DELIVERED order qualifies only when exception_reason == LATE was latched)"
        side_effects:
          - "identical to the EXCEPTION -> REFUNDED side-effect set"
      - from: DELIVERED
        to: DELIVERED
        trigger: "POST /delivery-orders/{order_id}/remedy {remedy_kind: GOODWILL_CREDIT}"
        actor: CustomerSupport
        preconditions:
          - "order_state IN {EXCEPTION, DELIVERED}"
          - "remedy_kind is null"
          - "exception_reason is not null"
        side_effects:
          - "order_state unchanged"
          - "remedy_kind = GOODWILL_CREDIT; remedy_reason_code = exception_reason; remedy_amount_cents = only the goodwill bucket of calculations.customer_remedy_amount"
          - "zone.remedy_spent_cents += remedy_amount_cents; increments ServiceZone.version by 1"
          - "increments DeliveryOrder.version by 1"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /delivery-orders/{order_id}/cancel {reason}"
        actor: MerchantOperator
        preconditions:
          - "order_state == RECEIVED (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID == merchant_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "order_state = CANCELLED"
          - "merchant.escrowed_fee_cents -= quoted_fee_cents; merchant.released_fee_cents += quoted_fee_cents; increments Merchant.version by 1"
          - "the compensating half of the merchant fee invariant: escrowed_fee_cents returns to its pre-create value and escrowed + recognized + released still equals the sum of quoted_fee_cents over every order of the merchant"
          - "increments DeliveryOrder.version by 1"

  - entity: DeliveryMission
    state_field: mission_state
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: PLANNED
        to: LOADED
        trigger: "POST /delivery-missions/{mission_id}/load {actual_payload_liters, lid_seal_confirmed}"
        actor: MerchantOperator
        preconditions:
          - "mission_state == PLANNED"
          - "X-User-ID == order.merchant_id (else ERR_NOT_RESOURCE_OWNER)"
          - "lid_seal_confirmed == true (else ERR_INVALID_REQUEST)"
          - "actual_payload_liters <= robot.container_capacity_liters (else ERR_PAYLOAD_CAPACITY_EXCEEDED)"
        side_effects:
          - "mission_state = LOADED; actual_payload_liters stored"
          - "zone.lid_code_sequence += 1; lid_access_code = zero-padded six-digit decimal of (100000 + zone.lid_code_sequence); increments ServiceZone.version by 1"
          - "handoff_late = true when current_utc - created_at strictly exceeds merchant.handoff_sla_seconds; when true merchant.exception_count += 1 and increments Merchant.version by 1"
          - "increments DeliveryMission.version by 1"
      - from: LOADED
        to: EN_ROUTE
        trigger: "POST /delivery-missions/{mission_id}/transitions {action: DEPART}"
        actor: FleetDispatcher
        preconditions:
          - "mission_state == LOADED"
          - "active_route_plan_id is not null and that plan has plan_state == ACTIVE"
          - "zone.permit_state == PERMITTED (else ERR_ZONE_NOT_PERMITTED)"
          - "robot.health_state IN {NOMINAL, DEGRADED} (else ERR_ROBOT_HEALTH_BLOCKED)"
        side_effects:
          - "mission_state = EN_ROUTE; departed_at_utc = current_utc"
          - "traveled_distance_m += active plan.total_length_m; traversed_crossing_count += active plan.crossing_count"
          - "order_state DISPATCHED -> IN_TRANSIT; increments DeliveryOrder.version by 1"
          - "increments DeliveryMission.version by 1"
      - from: EN_ROUTE
        to: BLOCKED
        trigger: "POST /delivery-missions/{mission_id}/transitions {action: REPORT_BLOCKAGE, blocking_segment_id}"
        actor: RemoteOperator
        preconditions:
          - "mission_state == EN_ROUTE"
          - "blocking_segment_id is an element of the active plan's segment_sequence (else ERR_INVALID_REQUEST)"
        side_effects:
          - "mission_state = BLOCKED; blocking_segment_id stored; blocked_at_utc = current_utc"
          - "the active RoutePlan -> SUPERSEDED with rejection_reason = SEGMENT_BLOCKED; active_route_plan_id = null; increments RoutePlan.version by 1"
          - "order_state stays IN_TRANSIT"
          - "increments DeliveryMission.version by 1"
      - from: EN_ROUTE
        to: BLOCKED
        trigger: "system: cascade link 4 of a HARD SegmentClosure activation superseded this mission's ACTIVE plan"
        actor: system
        preconditions:
          - "mission_state == EN_ROUTE"
        side_effects:
          - "mission_state = BLOCKED; blocking_segment_id = the closed segment; blocked_at_utc = current_utc; active_route_plan_id = null"
          - "cascade link 5 fires on the DeliveryOrder"
          - "increments DeliveryMission.version by 1"
      - from: BLOCKED
        to: EN_ROUTE
        trigger: "POST /delivery-missions/{mission_id}/transitions {action: RESUME}"
        actor: RemoteOperator
        preconditions:
          - "mission_state == BLOCKED"
          - "active_route_plan_id is not null and that plan has plan_state == ACTIVE (a replacement plan must have been created and activated first)"
          - "no SidewalkSegment in the active plan's segment_sequence has status == BLOCKED (else ERR_SEGMENT_BLOCKED)"
        side_effects:
          - "mission_state = EN_ROUTE; blocking_segment_id = null"
          - "blocked_minutes += floor((current_utc - blocked_at_utc) / 60 seconds); blocked_at_utc = null"
          - "traveled_distance_m += active plan.total_length_m; traversed_crossing_count += active plan.crossing_count"
          - "when the order sits in EXCEPTION because of the closure cascade it is NOT auto-restored; a REDELIVER remedy is the only path back"
          - "increments DeliveryMission.version by 1"
        note: "closes the EN_ROUTE -> BLOCKED -> EN_ROUTE reroute cycle"
      - from: EN_ROUTE
        to: HANDOFF_READY
        trigger: "POST /delivery-missions/{mission_id}/transitions {action: ARRIVE}"
        actor: FleetDispatcher
        preconditions:
          - "mission_state == EN_ROUTE"
          - "no InterventionEvent of this mission has takeover_state IN {REQUESTED, ACKNOWLEDGED, ACTIVE, ESCALATED} (else ERR_TAKEOVER_REQUIRED)"
        side_effects:
          - "mission_state = HANDOFF_READY"
          - "increments DeliveryMission.version by 1"
      - from: HANDOFF_READY
        to: COMPLETED
        trigger: "POST /delivery-missions/{mission_id}/transitions {action: COMPLETE, lid_access_code}"
        actor: FleetDispatcher
        preconditions:
          - "mission_state == HANDOFF_READY"
          - "the supplied lid_access_code equals mission.lid_access_code (else ERR_LID_CODE_MISMATCH)"
          - "no InterventionEvent of this mission has takeover_state IN {REQUESTED, ACKNOWLEDGED, ACTIVE, ESCALATED} (else ERR_TAKEOVER_REQUIRED)"
        side_effects:
          - "mission_state = COMPLETED; completed_at_utc = current_utc; active_minutes = floor((completed_at_utc - departed_at_utc) / 60 seconds)"
          - "order_state IN_TRANSIT -> DELIVERED with settled_fee_cents from calculations.delivery_fee variant settlement_at_completion"
          - "robot duty_state ON_MISSION -> AVAILABLE with the counter and autonomy-index recomputation listed on that transition"
          - "increments DeliveryMission.version by 1"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /delivery-missions/{mission_id}/transitions {action: ABORT, reason_code}"
        actor: FleetDispatcher
        preconditions:
          - "mission_state IN {PLANNED, LOADED, EN_ROUTE, BLOCKED} (else ERR_MISSION_ALREADY_TERMINAL)"
          - "reason_code IN {DISPATCH_CANCELLED, UNRECOVERABLE_BLOCKAGE}"
        side_effects:
          - "mission_state = ABORTED; abort_reason = reason_code; completed_at_utc = current_utc; active_minutes = floor((completed_at_utc - departed_at_utc) / 60 seconds) or 0 when departed_at_utc is null"
          - "every RoutePlan of this mission with plan_state IN {DRAFT, VALIDATED, ACTIVE} -> REJECTED with rejection_reason = OPERATOR_REJECTED, processed in created_at ASC order"
          - "the order -> EXCEPTION with exception_reason from calculations.exception_reason_mapping"
          - "robot duty_state ON_MISSION -> AVAILABLE with counter and autonomy-index recomputation"
          - "increments DeliveryMission.version by 1"
      - from: LOADED
        to: ABORTED
        trigger: "POST /delivery-missions/{mission_id}/transitions {action: ABORT, reason_code}"
        actor: FleetDispatcher
        preconditions:
          - "mission_state IN {PLANNED, LOADED, EN_ROUTE, BLOCKED}"
        side_effects:
          - "identical to the PLANNED -> ABORTED side-effect set"
      - from: EN_ROUTE
        to: ABORTED
        trigger: "POST /delivery-missions/{mission_id}/transitions {action: ABORT, reason_code} OR system on a robot QUARANTINED cascade or a zone REVOKE cascade"
        actor: FleetDispatcher
        preconditions:
          - "mission_state IN {PLANNED, LOADED, EN_ROUTE, BLOCKED}"
        side_effects:
          - "identical to the PLANNED -> ABORTED side-effect set; for the system cascades abort_reason is ROBOT_QUARANTINED or ZONE_REVOKED"
      - from: BLOCKED
        to: ABORTED
        trigger: "POST /delivery-missions/{mission_id}/transitions {action: ABORT, reason_code} OR system on a robot QUARANTINED cascade or a zone REVOKE cascade"
        actor: FleetDispatcher
        preconditions:
          - "mission_state IN {PLANNED, LOADED, EN_ROUTE, BLOCKED}"
        side_effects:
          - "identical to the PLANNED -> ABORTED side-effect set"

  - entity: RoutePlan
    state_field: plan_state
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /route-plans/{plan_id}/transitions {action: VALIDATE}"
        actor: FleetDispatcher
        preconditions:
          - "plan_state == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "every SidewalkSegment in segment_sequence has status IN {APPROVED, BLOCKED}; a MAPPED, SURVEYED or RETIRED segment raises ERR_SEGMENT_NOT_APPROVED"
          - "no SidewalkSegment in segment_sequence has status == BLOCKED (else ERR_SEGMENT_BLOCKED)"
          - "the geometry gates (clearance_margin_cm >= 0, crossing risk ceiling, operating-window containment) already ran at POST /route-plans and are not re-evaluated here"
        side_effects:
          - "plan_state = VALIDATED"
          - "increments RoutePlan.version by 1"
      - from: VALIDATED
        to: ACTIVE
        trigger: "POST /route-plans/{plan_id}/transitions {action: ACTIVATE}"
        actor: FleetDispatcher
        preconditions:
          - "plan_state == VALIDATED (else ERR_INVALID_STATE_TRANSITION)"
          - "mission.mission_state IN {PLANNED, LOADED, BLOCKED} (else ERR_INVALID_STATE_TRANSITION)"
          - "no SidewalkSegment in segment_sequence has status == BLOCKED (re-checked at activation; else ERR_SEGMENT_BLOCKED)"
        side_effects:
          - "plan_state = ACTIVE"
          - "the mission's previously ACTIVE plan, if any, -> SUPERSEDED with rejection_reason = REPLACED_BY_NEWER and supersedes_plan_id of the new plan set to it; increments that RoutePlan.version by 1"
          - "mission.active_route_plan_id = this plan id; increments DeliveryMission.version by 1"
          - "increments RoutePlan.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer plan of the same mission reached ACTIVE, or a HARD SegmentClosure activation covered one of this plan's segments, or the mission took REPORT_BLOCKAGE"
        actor: system
        preconditions:
          - "plan_state == ACTIVE"
        side_effects:
          - "plan_state = SUPERSEDED; rejection_reason = REPLACED_BY_NEWER or SEGMENT_BLOCKED depending on the trigger"
          - "mission.active_route_plan_id = null unless a replacement plan set it in the same request"
          - "increments RoutePlan.version by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /route-plans/{plan_id}/transitions {action: REJECT, rejection_reason} OR system on a mission ABORT"
        actor: FleetDispatcher
        preconditions:
          - "plan_state IN {DRAFT, VALIDATED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "plan_state = REJECTED; rejection_reason stored (OPERATOR_REJECTED for the system path)"
          - "increments RoutePlan.version by 1"
      - from: VALIDATED
        to: REJECTED
        trigger: "POST /route-plans/{plan_id}/transitions {action: REJECT, rejection_reason} OR system on a mission ABORT"
        actor: FleetDispatcher
        preconditions:
          - "plan_state IN {DRAFT, VALIDATED}"
        side_effects:
          - "identical to the DRAFT -> REJECTED side-effect set"
      - from: ACTIVE
        to: REJECTED
        trigger: "system: the mission took an ABORT transition while this plan was ACTIVE"
        actor: system
        preconditions:
          - "plan_state == ACTIVE"
        side_effects:
          - "plan_state = REJECTED; rejection_reason = OPERATOR_REJECTED; mission.active_route_plan_id = null"
          - "increments RoutePlan.version by 1"

  - entity: InterventionEvent
    state_field: takeover_state
    initial_state: REQUESTED
    terminal_states: [RELEASED]
    transitions:
      - from: REQUESTED
        to: ACKNOWLEDGED
        trigger: "POST /intervention-events/{event_id}/transitions {action: ACKNOWLEDGE}"
        actor: RemoteOperator
        preconditions:
          - "takeover_state == REQUESTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "takeover_state = ACKNOWLEDGED"
          - "increments InterventionEvent.version by 1"
      - from: ACKNOWLEDGED
        to: ACTIVE
        trigger: "POST /intervention-events/{event_id}/transitions {action: ASSUME}"
        actor: RemoteOperator
        preconditions:
          - "takeover_state == ACKNOWLEDGED (else ERR_INVALID_STATE_TRANSITION)"
          - "mission.mission_state IN {EN_ROUTE, BLOCKED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "takeover_state = ACTIVE; assumed_at_utc = current_utc; operator_user_id = X-User-ID"
          - "increments InterventionEvent.version by 1"
      - from: ACTIVE
        to: ESCALATED
        trigger: "POST /intervention-events/{event_id}/transitions {action: ESCALATE, escalation_reason}"
        actor: RemoteOperator
        preconditions:
          - "takeover_state == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID == operator_user_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "takeover_state = ESCALATED; escalation_reason stored"
          - "mission.escalation_count += 1; increments DeliveryMission.version by 1"
          - "increments InterventionEvent.version by 1"
      - from: ESCALATED
        to: ACTIVE
        trigger: "POST /intervention-events/{event_id}/transitions {action: DEESCALATE}"
        actor: SafetyOfficer
        preconditions:
          - "takeover_state == ESCALATED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "takeover_state = ACTIVE"
          - "escalation_reason is deliberately retained and mission.escalation_count is deliberately NOT decremented: the escalation already happened and still charges calculations.robot_autonomy_index"
          - "increments InterventionEvent.version by 1"
        note: "closes the ACTIVE -> ESCALATED -> ACTIVE cycle"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /intervention-events/{event_id}/transitions {action: RELEASE}"
        actor: RemoteOperator
        preconditions:
          - "takeover_state IN {ACTIVE, ESCALATED} (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID == operator_user_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "takeover_state = RELEASED; control_seconds = whole seconds from assumed_at_utc to current_utc"
          - "mission.intervention_count += 1; increments DeliveryMission.version by 1"
          - "increments InterventionEvent.version by 1"
      - from: ESCALATED
        to: RELEASED
        trigger: "POST /intervention-events/{event_id}/transitions {action: RELEASE}"
        actor: SafetyOfficer
        preconditions:
          - "takeover_state IN {ACTIVE, ESCALATED}"
          - "a SafetyOfficer may release an ESCALATED takeover regardless of operator_user_id; a RemoteOperator still needs X-User-ID == operator_user_id"
        side_effects:
          - "identical to the ACTIVE -> RELEASED side-effect set"
      - from: REQUESTED
        to: RELEASED
        trigger: "POST /intervention-events/{event_id}/transitions {action: RELEASE}"
        actor: FleetDispatcher
        preconditions:
          - "takeover_state == REQUESTED"
          - "mandatory == false (else ERR_TAKEOVER_REQUIRED: a mandatory takeover cannot be waived without an operator assuming control)"
        side_effects:
          - "takeover_state = RELEASED; control_seconds = 0; assumed_at_utc stays null"
          - "mission.intervention_count += 1; increments DeliveryMission.version by 1"
          - "increments InterventionEvent.version by 1"
        note: "a low-severity request the robot recovered from on its own; still counts against the autonomy index"

  - entity: IncidentReport
    state_field: report_state
    initial_state: DRAFT
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED_MUNICIPAL
        trigger: "POST /incident-reports/{report_id}/transitions {action: SUBMIT_MUNICIPAL, municipal_case_ref}"
        actor: SafetyOfficer
        preconditions:
          - "report_state == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "municipal_case_ref is a non-empty string (else ERR_INVALID_REQUEST)"
          - "X-User-ID != filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES; a cascade-created draft carries filed_by_user_id == \"SYSTEM\" and therefore never trips this check)"
        side_effects:
          - "report_state = SUBMITTED_MUNICIPAL; municipal_case_ref stored; reviewed_by_user_id = X-User-ID"
          - "increments IncidentReport.version by 1"
      - from: SUBMITTED_MUNICIPAL
        to: INSURER_NOTIFIED
        trigger: "POST /incident-reports/{report_id}/transitions {action: NOTIFY_INSURER, insurer_claim_ref}"
        actor: SafetyOfficer
        preconditions:
          - "report_state == SUBMITTED_MUNICIPAL (else ERR_INVALID_STATE_TRANSITION)"
          - "insurer_notification_required == true (else ERR_INVALID_STATE_TRANSITION: a report below the insurer gate skips this branch)"
          - "insurer_claim_ref is a non-empty string (else ERR_INVALID_REQUEST)"
        side_effects:
          - "report_state = INSURER_NOTIFIED; insurer_claim_ref stored"
          - "increments IncidentReport.version by 1"
      - from: SUBMITTED_MUNICIPAL
        to: CLOSED
        trigger: "POST /incident-reports/{report_id}/transitions {action: CLOSE}"
        actor: SafetyOfficer
        preconditions:
          - "report_state IN {SUBMITTED_MUNICIPAL, INSURER_NOTIFIED} (else ERR_INVALID_STATE_TRANSITION)"
          - "when report_state == SUBMITTED_MUNICIPAL, insurer_notification_required must be false (else ERR_INVALID_STATE_TRANSITION: the insurer branch has to run first)"
        side_effects:
          - "report_state = CLOSED"
          - "zone.open_incident_count -= 1; increments ServiceZone.version by 1"
          - "increments IncidentReport.version by 1"
        note: "municipal-only branch join"
      - from: INSURER_NOTIFIED
        to: CLOSED
        trigger: "POST /incident-reports/{report_id}/transitions {action: CLOSE}"
        actor: SafetyOfficer
        preconditions:
          - "report_state IN {SUBMITTED_MUNICIPAL, INSURER_NOTIFIED}"
        side_effects:
          - "identical to the SUBMITTED_MUNICIPAL -> CLOSED side-effect set"
        note: "municipal-plus-insurer branch join; both branches converge on CLOSED"
      - from: SUBMITTED_MUNICIPAL
        to: DRAFT
        trigger: "POST /incident-reports/{report_id}/transitions {action: RETURN_FOR_DETAIL}"
        actor: SafetyOfficer
        preconditions:
          - "report_state == SUBMITTED_MUNICIPAL (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID == reviewed_by_user_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "report_state = DRAFT; municipal_case_ref = null; reviewed_by_user_id = null"
          - "zone.open_incident_count is deliberately unchanged: the incident was never closed"
          - "increments IncidentReport.version by 1"
        note: "closes the DRAFT -> SUBMITTED_MUNICIPAL -> DRAFT cycle"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /incident-reports/{report_id}/transitions {action: REJECT}"
        actor: PlatformAdmin
        preconditions:
          - "report_state == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "severity == MINOR (else ERR_INVALID_STATE_TRANSITION: SERIOUS and CRITICAL incidents are municipally mandatory and cannot be rejected)"
        side_effects:
          - "report_state = REJECTED"
          - "zone.open_incident_count -= 1; increments ServiceZone.version by 1"
          - "increments IncidentReport.version by 1"

# =============================================================================
# 1.3 Calculations
# =============================================================================

calculations:

  - name: delivery_fee
    description: >-
      Customer-facing delivery fee in integer cents. The same formula skeleton is evaluated twice
      in the life of an order with deliberately different input sources: at order creation it is a
      forward-looking quote built from the zone's planning assumptions, and at mission completion it
      is a chronological settlement built from what the mission actually accumulated. The two results
      are stored side by side (quoted_fee_cents, settled_fee_cents) and their difference is
      accumulated into merchant.settlement_variance_cents.
    algorithm_type: threshold
    output_fields: [DeliveryOrder.quoted_fee_cents, DeliveryOrder.settled_fee_cents, DeliveryOrder.urgency_flag, DeliveryOrder.payload_tier]
    constants:
      BASE_FEE_CENTS: 349
      PER_100M_CENTS: 22
      PAYLOAD_TIER_CENTS:
        SMALL: 0
        MEDIUM: 120
        LARGE: 260
      PAYLOAD_TIER_UPPER_LITERS:
        SMALL: 15.0
        MEDIUM: 30.0
        LARGE: 45.0
      URGENCY_WINDOW_MINUTES: 45
      URGENCY_SURCHARGE_CENTS: 180
      CROSSING_FEE_CENTS: 35
      INTERVENTION_SURCHARGE_CENTS: 95
      BLOCKAGE_CREDIT_CENTS_PER_MIN: 8
      BLOCKAGE_CREDIT_CAP_FRACTION: 0.40
      MERCHANT_GRADE_DISCOUNT:
        STANDARD: 0.00
        PREFERRED: 0.05
        ANCHOR: 0.12
    formula: >-
      payload_tier = SMALL when payload_liters <= 15.0, MEDIUM when payload_liters <= 30.0,
      LARGE when payload_liters <= 45.0; a payload_liters above 45.0 is rejected by validation
      before the fee is ever computed.
      urgency_flag = true when (promised_by_utc - created_at) <= URGENCY_WINDOW_MINUTES minutes,
      evaluated on the logical clock at order-create time and then frozen.
      distance_units = ceil(distance_m / 100) using the variant's distance_m.
      gross_cents = BASE_FEE_CENTS + distance_units * PER_100M_CENTS
        + PAYLOAD_TIER_CENTS[payload_tier]
        + (URGENCY_SURCHARGE_CENTS when urgency_flag else 0)
        + crossing_count * CROSSING_FEE_CENTS
        + intervention_count * INTERVENTION_SURCHARGE_CENTS.
      blockage_credit_cents = min(blocked_minutes * BLOCKAGE_CREDIT_CENTS_PER_MIN,
        floor(gross_cents * BLOCKAGE_CREDIT_CAP_FRACTION)).
      net_cents = round_half_up((gross_cents - blockage_credit_cents)
        * (1 - MERCHANT_GRADE_DISCOUNT[merchant.merchant_grade])).
      The grade discount is applied exactly once, after the credit, to the whole basis; it is never
      applied per component.
    precision: integer cents, round_half_up at the single final step; no intermediate rounding
    variants:
      - name: quote_at_order
        applies_when: "POST /delivery-orders, writing DeliveryOrder.quoted_fee_cents"
        algorithm_type: forward_looking
        inputs: >-
          distance_m = zone.planning_haul_m of the dropoff segment's zone;
          crossing_count = zone.planning_crossings;
          intervention_count = 0; blocked_minutes = 0.
          No mission or route plan exists yet, so the quote uses the zone's planning assumptions for
          every future-dependent term.
      - name: settlement_at_completion
        applies_when: "the mission COMPLETE transition, writing DeliveryOrder.settled_fee_cents"
        algorithm_type: chronological
        inputs: >-
          distance_m = mission.traveled_distance_m, which is the ordered sum of total_length_m over
          every RoutePlan the mission actually activated (a reroute adds the replacement plan's full
          length on top of the original);
          crossing_count = mission.traversed_crossing_count accumulated the same way;
          intervention_count = mission.intervention_count;
          blocked_minutes = mission.blocked_minutes.
          Because the terms are accumulated in transition order, replaying the same events in a
          different order would produce a different traveled_distance_m; the settlement is defined by
          the chronological accumulation, not by the final plan alone.
    input_set: >-
      the DeliveryOrder, its Merchant (for merchant_grade), the dropoff SidewalkSegment's ServiceZone
      (for planning assumptions), and for the settlement variant the DeliveryMission counters

  - name: robot_autonomy_index
    description: >-
      Fleet-health score in 40..100 used as the primary ranking key of calculations.robot_selector and
      as the eligibility gate for dispatch. Two variants are maintained on every Robot row and both
      are recomputed on each terminal mission: a recency-weighted rolling window and an
      undiscounted lifetime cumulative score.
    algorithm_type: weighted_scoring
    output_fields: [Robot.rolling_autonomy_index, Robot.lifetime_autonomy_index]
    constants:
      START_INDEX: 100
      INTERVENTION_PENALTY: 6
      ESCALATION_PENALTY_EXTRA: 4
      CLEAN_MISSION_CREDIT: 2
      ROLLING_WINDOW_MISSIONS: 5
      ROLLING_DECAY_FACTOR: 0.85
      INDEX_FLOOR: 40
      INDEX_CEILING: 100
      DISPATCH_ELIGIBLE_MIN_INDEX: 70
    formula: >-
      Per mission term: term_i = INTERVENTION_PENALTY * mission.intervention_count
      + ESCALATION_PENALTY_EXTRA * mission.escalation_count, and credit_i = CLEAN_MISSION_CREDIT when
      mission.intervention_count == 0 else 0.
      Both variants then clamp to INDEX_FLOOR..INDEX_CEILING and round_half_up to an integer.
    precision: integer, round_half_up, clamped to 40..100 after rounding-free accumulation
    variants:
      - name: rolling_window
        applies_when: "Robot.rolling_autonomy_index, the field the selector ranks on"
        algorithm_type: decay_function
        inputs: >-
          the robot's terminal missions (mission_state IN {COMPLETED, ABORTED}) ordered by
          completed_at_utc DESC, tie-broken by created_at ASC, truncated to the newest
          ROLLING_WINDOW_MISSIONS. For the i-th mission in that order (i starting at 0) the weight is
          ROLLING_DECAY_FACTOR ** i, and the running value is
          START_INDEX + sum over i of weight_i * (credit_i - term_i).
          The decay curve restarts from the newest mission on every recomputation, so a fresh clean
          mission immediately dilutes an old intervention.
      - name: lifetime_cumulative
        applies_when: "Robot.lifetime_autonomy_index, the field reported by the fleet read endpoints"
        algorithm_type: aggregation
        inputs: >-
          every terminal mission of the robot with weight exactly 1, expressed through the stored
          counters: START_INDEX - (INTERVENTION_PENALTY * lifetime_intervention_count
          + ESCALATION_PENALTY_EXTRA * lifetime_escalation_count)
          + CLEAN_MISSION_CREDIT * clean_mission_count.
          Order is irrelevant here, which is exactly what makes the two variants diverge whenever the
          robot's history is not uniform.
    input_set: "DeliveryMission rows with mission_state IN {COMPLETED, ABORTED} for the robot; excludes PLANNED, LOADED, EN_ROUTE, BLOCKED missions"

  - name: crossing_risk_score
    description: >-
      Per-segment safety score, 0.0..100.0, computed once at survey time and frozen on the segment.
      It gates segment approval and route validation against zone.max_crossing_risk. Mode (a) of the
      combinatorial family: a tiered step function plus a capped linear term plus a categorical
      adjustment plus a hinge term plus a flat credit, clamped.
    algorithm_type: weighted_scoring
    output_fields: [SidewalkSegment.crossing_risk_score]
    constants:
      SIGHTLINE_TIERS: "sightline_m >= 30 -> 0 | >= 20 -> 8 | >= 10 -> 18 | else 30"
      FLOW_COEFFICIENT: 1.4
      FLOW_TERM_CAP: 28
      CONTROL_ADJUSTMENT:
        NONE: 0
        SIGNALIZED: -12
        UNSIGNALIZED: 10
        MIDBLOCK: 22
      GRADE_HINGE_PCT: 5.0
      GRADE_COEFFICIENT: 3.0
      CURB_RAMP_CREDIT: -6
      SCORE_FLOOR: 0.0
      SCORE_CEILING: 100.0
    formula: >-
      sightline_term = the SIGHTLINE_TIERS step value for sightline_m (a step function, so 30.0 and
      39.9 both score 0 while 29.9 scores 8).
      flow_term = min(FLOW_COEFFICIENT * pedestrian_flow_per_min, FLOW_TERM_CAP).
      control_term = CONTROL_ADJUSTMENT[crossing_control].
      grade_term = max(0.0, surface_grade_pct - GRADE_HINGE_PCT) * GRADE_COEFFICIENT, a hinge that is
      exactly 0 up to and including 5.0 percent.
      ramp_term = CURB_RAMP_CREDIT when curb_ramp_present else 0.
      raw = sightline_term + flow_term + control_term + grade_term + ramp_term.
      crossing_risk_score = round_half_up(clamp(raw, SCORE_FLOOR, SCORE_CEILING), 1).
      The clamp runs before the rounding, so a raw of -6.0 becomes 0.0 rather than a negative score.
    precision: one decimal place, round_half_up, clamped to 0.0..100.0 before rounding
    input_set: "the SidewalkSegment survey fields supplied to POST /sidewalk-segments/{segment_id}/transitions {action: SURVEY}"

  - name: route_clearance_margin
    description: >-
      Accessibility slack of a route plan for the mission's specific robot, in centimetres. A plan is
      only validatable when the tightest segment leaves the robot at least the ordinance buffer.
    algorithm_type: threshold
    output_fields: [RoutePlan.clearance_margin_cm]
    constants:
      CLEARANCE_BUFFER_CM: 12
      MARGIN_GATE: ">= 0 passes; < 0 raises ERR_CLEARANCE_INSUFFICIENT"
    formula: >-
      clearance_margin_cm = min over every SidewalkSegment s in segment_sequence of
      (s.measured_clearance_cm - robot.width_cm - CLEARANCE_BUFFER_CM), rounded to one decimal place.
      The gate is inclusive: a margin of exactly 0.0 validates, -1.0 does not. The robot is the one on
      the plan's DeliveryMission, so the identical segment sequence can validate for a narrow robot
      and fail for a wider one.
    precision: one decimal place, round_half_up
    input_set: "the SidewalkSegment rows named by segment_sequence and the Robot of the plan's mission"

  - name: route_plan_geometry
    description: >-
      The structural fields of a route plan, all derived from segment_sequence at creation time, plus
      the operating-window containment gate that consumes the duration.
    algorithm_type: aggregation
    output_fields: [RoutePlan.total_length_m, RoutePlan.crossing_count, RoutePlan.planned_duration_min, RoutePlan.revision_index]
    constants:
      SPEED_DERATE_FACTOR: 0.6
      CM_PER_S_TO_M_PER_MIN: "max_speed_cm_s * 0.6 yields metres per minute"
    formula: >-
      total_length_m = sum of length_m over segment_sequence in the given order, one decimal place.
      crossing_count = number of segment_sequence elements whose segment_type == CROSSING.
      planned_duration_min = ceil(total_length_m / (robot.max_speed_cm_s * SPEED_DERATE_FACTOR)),
      whole minutes, always rounded up.
      revision_index = 1-based ordinal of this plan among the mission's plans ordered by created_at
      ASC, so the first plan of a mission has revision_index 1.
      Operating-window containment: the interval [current_utc, current_utc + planned_duration_min
      minutes] must fall inside the zone's daily window
      [operating_window_start_utc_hhmm, operating_window_end_utc_hhmm] on the current UTC date, else
      ERR_CURFEW_WINDOW_VIOLATION. The check is inclusive at both ends.
    precision: total_length_m to one decimal place; planned_duration_min integer, always ceil
    input_set: "the SidewalkSegment rows named by segment_sequence, the Robot of the mission, the ServiceZone of the robot, and the mission's existing RoutePlan rows for the ordinal"

  - name: takeover_mandatory
    description: >-
      Decides whether a remote-operator intervention request is mandatory, which in turn decides
      whether the request can be waived without an operator assuming control.
    algorithm_type: threshold
    output_fields: [InterventionEvent.mandatory]
    constants:
      COMPARISON: "mandatory = autonomy_confidence_pct <= zone.takeover_confidence_threshold_pct"
      DEFAULT_ZONE_THRESHOLD_PCT: 35
    formula: >-
      mandatory = true when autonomy_confidence_pct <= zone.takeover_confidence_threshold_pct,
      otherwise false. The comparison is inclusive at the threshold: with a zone threshold of 35, a
      confidence of 35 is mandatory and a confidence of 36 is not. The zone is resolved through
      mission -> robot -> zone_id, so two events with identical confidence in differently configured
      zones classify differently.
    precision: boolean, integer comparison, no rounding
    input_set: "the InterventionEvent request payload and the ServiceZone reached through the mission's Robot"

  - name: customer_remedy_amount
    description: >-
      Money owed to the customer when a delivery goes wrong. Mode (b) of the combinatorial family: a
      three-bucket waterfall in which each bucket is rounded to whole cents on its own and the rounded
      buckets are then summed. This ordering is normative and is observably different from summing the
      unrounded buckets and rounding once.
    algorithm_type: waterfall_allocation
    output_fields: [DeliveryOrder.remedy_amount_cents, DeliveryOrder.remedy_reason_code]
    constants:
      DECLARED_VALUE_CAP_CENTS: 15000
      REMEDY_POLICY:
        WEATHER: {fee_refund_pct: 1.00, declared_value_pct: 0.00, goodwill_cents: 200}
        VANDALISM: {fee_refund_pct: 1.00, declared_value_pct: 0.60, goodwill_cents: 500}
        BLOCKED_ROUTE: {fee_refund_pct: 0.50, declared_value_pct: 0.00, goodwill_cents: 150}
        ROBOT_FAULT: {fee_refund_pct: 0.35, declared_value_pct: 0.60, goodwill_cents: 250}
        LATE: {fee_refund_pct: 0.25, declared_value_pct: 0.00, goodwill_cents: 150}
      ROUNDING_ORDER: "round each bucket, then sum the rounded buckets"
    formula: >-
      policy = REMEDY_POLICY[order.exception_reason]; the policy row is selected from the latched
      exception_reason on the order, never from the request payload.
      fee_basis_cents = order.settled_fee_cents when it is not null, otherwise
      order.quoted_fee_cents. A mission that never completed has no settlement, so the basis falls
      back to the quote.
      bucket_1_cents = round_half_up(fee_basis_cents * policy.fee_refund_pct).
      bucket_2_cents = round_half_up(min(order.declared_value_cents, DECLARED_VALUE_CAP_CENTS)
        * policy.declared_value_pct).
      bucket_3_cents = policy.goodwill_cents, an exact integer that never rounds.
      remedy_amount_cents = bucket_1_cents + bucket_2_cents + bucket_3_cents.
      Waterfall semantics: bucket 1 is exhausted before bucket 2 is considered and bucket 3 is always
      added last; the buckets are reported in that order and the per-bucket rounding happens as each
      bucket is filled.
      For remedy_kind == GOODWILL_CREDIT only bucket_3_cents is charged; for REFUND all three buckets
      are charged; for REDELIVER the amount is 0 and no budget is consumed.
      Budget gate: the resulting amount must be <= zone.remedy_budget_remaining_cents, else
      ERR_REMEDY_BUDGET_EXCEEDED (402). The gate is inclusive, so an amount exactly equal to the
      remaining budget is allowed and drives the remaining budget to 0.
    precision: >-
      integer cents; round_half_up applied independently to bucket 1 and bucket 2 before the
      addition. Summing the unrounded buckets and rounding once is a different number whenever two
      buckets each round down but their discarded fractions add to at least half a cent, which the
      §1.8 instance for this rule pins with concrete values.
    input_set: "the DeliveryOrder (exception_reason, declared_value_cents, quoted_fee_cents, settled_fee_cents) and the ServiceZone budget fields reached through merchant.zone_id"

  - name: zone_cost_per_delivery
    description: >-
      Unit economics of a service zone, served by GET /service-zones/{zone_id}/economics. Mode (c) of
      the combinatorial family: an eight-step pipeline whose evaluation order is pinned because each
      step consumes a rounded output of an earlier step. Evaluating the steps in any other order, or
      keeping unrounded intermediates, yields a different cost_per_delivery_cents.
    algorithm_type: constraint_propagation
    output_fields: []
    constants:
      ZONE_SHIFT_MINUTES: 600
      OVERHEAD_BASE_CENTS: 40000
      OVERHEAD_PER_UTILIZATION_POINT_CENTS: 150
      VARIABLE_CENTS_PER_100M: 9
      VARIABLE_CENTS_PER_INTERVENTION: 140
      UTILIZATION_CEILING_PCT: 100.0
    formula: >-
      Step 1 robot_active_minutes = sum of active_minutes over the zone's DeliveryMission rows with
      mission_state IN {COMPLETED, ABORTED}; a mission is in the zone when its robot's zone_id matches.
      Step 2 fleet_capacity_minutes = (count of the zone's Robot rows with duty_state != RETIRED)
      * ZONE_SHIFT_MINUTES.
      Step 3 utilization_pct = round_half_up(min(robot_active_minutes / fleet_capacity_minutes * 100,
      UTILIZATION_CEILING_PCT), 1); it is 0.0 when fleet_capacity_minutes is 0.
      Step 4 allocated_overhead_cents = OVERHEAD_BASE_CENTS
      + OVERHEAD_PER_UTILIZATION_POINT_CENTS * floor(utilization_pct); this consumes the ROUNDED
      utilization from step 3, which is why step 3 cannot be inlined.
      Step 5 variable_cost_cents = VARIABLE_CENTS_PER_100M * ceil(total_traveled_m / 100)
      + VARIABLE_CENTS_PER_INTERVENTION * total_intervention_count + zone.remedy_spent_cents, where
      the totals are summed over the same terminal-mission set as step 1.
      Step 6 delivered_count = count of the zone's DeliveryOrder rows with order_state IN {DELIVERED,
      REFUNDED}; cost_per_delivery_cents = round_half_up((allocated_overhead_cents
      + variable_cost_cents) / delivered_count) and is null when delivered_count is 0.
      Step 7 contribution_per_delivery_cents = round_half_up(total_recognized_revenue_cents /
      delivered_count) - cost_per_delivery_cents, where total_recognized_revenue_cents is the sum of
      settled_fee_cents over those orders minus the sum of remedy_amount_cents over them; the
      subtraction happens between two already-rounded integers. Like cost_per_delivery_cents it is
      null when delivered_count is 0, because both quotients share the same denominator.
      Step 8 throughput_per_robot_hour = round_half_up(delivered_count / (fleet_capacity_minutes / 60),
      2); it is 0.00 when fleet_capacity_minutes is 0.
    precision: >-
      utilization_pct one decimal; cost, overhead, variable and contribution integer cents;
      throughput_per_robot_hour two decimals; every round_half_up happens at the step boundary named
      above and the rounded value is what the next step reads
    input_set: >-
      the ServiceZone, its Robot rows, the DeliveryMission rows of those robots with mission_state IN
      {COMPLETED, ABORTED}, and the DeliveryOrder rows of the zone's merchants with order_state IN
      {DELIVERED, REFUNDED}; PLANNED, LOADED, EN_ROUTE and BLOCKED missions and RECEIVED, DISPATCHED,
      IN_TRANSIT, EXCEPTION and CANCELLED orders are excluded from every step

  - name: bay_minutes_ledger
    description: >-
      The conserved depot-capacity quantity. Reserved bay minutes are booked into two denormalized
      ledgers when a reservation is created and are removed by exactly one of the release paths, so the
      ledgers always equal the live reservation footprint.
    algorithm_type: aggregation
    output_fields: [BayReservation.window_minutes, DepotBay.committed_minutes, ServiceZone.reserved_bay_minutes]
    constants:
      TURNAROUND_BUFFER_MINUTES: 15
      LIVE_RESERVATION_STATES: "HELD, ACTIVE"
      SETTLED_RESERVATION_STATES: "RELEASED, CANCELLED"
    formula: >-
      window_minutes = whole minutes from window_start_utc to window_end_utc, computed at create time
      and immutable thereafter.
      Invariant A: DepotBay.committed_minutes == sum of window_minutes over that bay's BayReservation
      rows with state IN {HELD, ACTIVE}.
      Invariant B: ServiceZone.reserved_bay_minutes == sum of DepotBay.committed_minutes over the
      zone's bays == sum of window_minutes over every live reservation of the zone.
      Creating a reservation adds window_minutes to both ledgers; HELD -> ACTIVE changes neither
      (both are live); RELEASE and CANCEL each subtract exactly window_minutes from both, so a
      create-then-cancel round trip restores both ledgers to their exact pre-create values with no
      drift, and a create-activate-release round trip does the same.
      A double release is impossible because RELEASED and CANCELLED are terminal, which is what keeps
      the subtraction from applying twice.
    precision: integer minutes, exact, no rounding
    input_set: "BayReservation rows with state IN {HELD, ACTIVE} for the bay or the zone"

  - name: merchant_fee_ledger
    description: >-
      The conserved money quantity. Every cent a merchant's orders were quoted sits in exactly one of
      three buckets at all times, so the three buckets always reconcile against the order set.
    algorithm_type: aggregation
    output_fields: [Merchant.escrowed_fee_cents, Merchant.recognized_fee_cents, Merchant.released_fee_cents, Merchant.settlement_variance_cents]
    constants:
      BUCKETS: "escrowed_fee_cents (in flight), recognized_fee_cents (delivered), released_fee_cents (cancelled or excepted)"
    formula: >-
      Invariant: escrowed_fee_cents + recognized_fee_cents + released_fee_cents == sum of
      quoted_fee_cents over every DeliveryOrder of the merchant whose order_state is not CANCELLED-
      before-quote, i.e. over every order the merchant ever created.
      Order create moves quoted_fee_cents into escrowed; DELIVERED moves it from escrowed to
      recognized; EXCEPTION and CANCELLED move it from escrowed to released. A REDELIVER remedy sends
      the order back to RECEIVED and moves the same amount from released back to escrowed, which is the
      compensating direction of the same conserved quantity.
      settlement_variance_cents accumulates (settled_fee_cents - quoted_fee_cents) on each DELIVERED
      transition and is signed: a reroute that lengthened the haul makes it positive, a blockage credit
      can make it negative.
    precision: integer cents, exact, no rounding
    input_set: "every DeliveryOrder of the merchant, in any state"

  - name: robot_selector
    description: >-
      The deterministic choice of which robot a dispatch may use. The dispatcher supplies robot_id
      explicitly on POST /delivery-missions, so this rule is the admission filter plus the tie-broken
      ranking that GET /robots?zone_id=...&eligible_only=true reports, and the empty-pool case is the error
      the dispatch endpoint raises.
    algorithm_type: threshold
    output_fields: []
    constants:
      MIN_BATTERY_PCT: 35.0
      LOW_BATTERY_PCT: 20.0
      MIN_ROLLING_INDEX: 70
      ELIGIBLE_HEALTH_STATES: "NOMINAL, DEGRADED"
      ELIGIBLE_DUTY_STATE: "AVAILABLE"
    formula: >-
      Eligibility filter, all clauses required: robot.zone_id == the order's zone (the dropoff
      segment's zone_id); duty_state == AVAILABLE; health_state IN {NOMINAL, DEGRADED};
      battery_pct >= MIN_BATTERY_PCT; container_capacity_liters >= order.payload_liters;
      max_speed_cm_s <= zone.ordinance_max_speed_cm_s; rolling_autonomy_index >= MIN_ROLLING_INDEX.
      Every comparison is inclusive at its boundary, so a battery of exactly 35.0 and an index of
      exactly 70 are eligible.
      Ranking of the eligible pool: rolling_autonomy_index DESC, then battery_pct DESC, then
      created_at ASC.
      Tie-break of last resort: created_at ASC. The id is never consulted for ordering.
      Empty pool: POST /delivery-missions raises ERR_NO_ELIGIBLE_ROBOT (422) when the pool is empty,
      and GET /robots?zone_id=...&eligible_only=true returns an empty list rather than an error.
    precision: not applicable; comparisons only
    input_set: "the zone's Robot rows; RETIRED, OFFLINE, STAGING, ON_MISSION, CHARGING and MAINTENANCE robots and IMPAIRED or QUARANTINED robots are excluded"

  - name: exception_reason_mapping
    description: >-
      The pinned map from the cause of a failed delivery to the DeliveryOrder.exception_reason enum
      value, which is in turn the policy key of calculations.customer_remedy_amount. Every producer of
      the enum is listed here so the enum has no unreachable value.
    algorithm_type: projection
    output_fields: [DeliveryOrder.exception_reason]
    constants:
      CLOSURE_CAUSE_MAP: "WEATHER -> WEATHER | VANDALISM -> VANDALISM | CONSTRUCTION -> BLOCKED_ROUTE | EVENT -> BLOCKED_ROUTE"
      ABORT_REASON_MAP: "ROBOT_QUARANTINED with robot.tamper_flag == true -> VANDALISM | ROBOT_QUARANTINED with tamper_flag == false -> ROBOT_FAULT | ZONE_REVOKED -> BLOCKED_ROUTE | DISPATCH_CANCELLED -> ROBOT_FAULT | UNRECOVERABLE_BLOCKAGE -> BLOCKED_ROUTE"
      LATE_LATCH: "a mission COMPLETE whose completed_at_utc is strictly later than order.promised_by_utc latches exception_reason = LATE on the DELIVERED order without changing order_state"
    formula: >-
      When a HARD SegmentClosure activation cascades into an order, exception_reason =
      CLOSURE_CAUSE_MAP[closure.cause].
      When a DeliveryMission reaches ABORTED, exception_reason = ABORT_REASON_MAP[mission.abort_reason],
      with the tamper_flag branch evaluated against the robot row as it stands after the quarantine.
      When a mission completes late, LATE is latched on the delivered order.
      exception_reason is written once per exception; a REDELIVER remedy clears it back to null and a
      later failure of the same order may latch a different value.
    precision: not applicable; enum mapping
    input_set: "the triggering SegmentClosure or DeliveryMission plus the Robot for the tamper branch"

# =============================================================================
# 1.4 Validations
# =============================================================================
# Priority ladder, lowest number wins when several rules are violated by the same request:
#   1..9    auth          authentication, role, ownership, segregation of duties
#   10..19  input         syntax, types, enums, ranges, interval ordering, required fields
#   30..41  referential   existence of every referenced row (404 family)
#   45..47  concurrency   optimistic-concurrency version checks (412 family)
#   50..61  state         state of the target row and of the rows it depends on
#   65..69  safety        accessibility, crossing risk, ordinance speed, curfew
#   70..76  consistency   structural and cross-zone integrity of the submitted graph
#   80..89  constraint    capacity, caps, budgets, credentials, interval exclusivity
# The ladder is evaluated top to bottom and stops at the first violated rule.

validations:

  - rule: authenticated_request_required
    priority: 1
    category: auth
    condition: "X-Role header is absent or empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint including POST /_clock/set_current_utc"

  - rule: role_permitted_for_endpoint
    priority: 2
    category: auth
    condition: "X-Role is not one of the endpoint's declared roles, or is not a recognised role name"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: "every endpoint"

  - rule: merchant_operator_owns_target
    priority: 3
    category: auth
    condition: "X-Role == MerchantOperator and X-User-ID does not equal the Merchant.id that owns the target row (the merchant itself, or order.merchant_id, or mission.order.merchant_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /delivery-orders, POST /delivery-orders/{order_id}/cancel, POST /delivery-missions/{mission_id}/load, GET /merchants/{merchant_id}, GET /delivery-orders"

  - rule: incident_submitter_differs_from_filer
    priority: 4
    category: auth
    condition: "the SUBMIT_MUNICIPAL action is requested with X-User-ID equal to the report's filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /incident-reports/{report_id}/transitions"
    note: "checked before any state check, so a same-user submit on an already-submitted report reports the duties failure"

  - rule: incident_return_by_recorded_reviewer
    priority: 5
    category: auth
    condition: "the RETURN_FOR_DETAIL action is requested with X-User-ID different from the report's reviewed_by_user_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /incident-reports/{report_id}/transitions"

  - rule: intervention_control_held_by_actor
    priority: 6
    category: auth
    condition: "the ESCALATE action, or the RELEASE action taken by a RemoteOperator, is requested with X-User-ID different from operator_user_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /intervention-events/{event_id}/transitions"
    note: "a SafetyOfficer releasing an ESCALATED takeover is exempt"

  - rule: required_fields_present
    priority: 10
    category: input
    condition: "any field declared required for the endpoint is missing or null"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every write endpoint"

  - rule: enum_values_recognised
    priority: 11
    category: input
    condition: "an enum-typed field carries a value outside its declared constraint list"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every write endpoint"

  - rule: numeric_ranges_respected
    priority: 12
    category: input
    condition: "length_m <= 0, measured_clearance_cm <= 0, surface_grade_pct < 0, sightline_m < 0, pedestrian_flow_per_min < 0, width_cm <= 0, container_capacity_liters <= 0, max_speed_cm_s <= 0, payload_liters <= 0, declared_value_cents < 0, estimated_damage_cents < 0, autonomy_confidence_pct outside 0..100, battery_pct outside 0.0..100.0, or max_concurrent_robots < 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /service-zones, POST /sidewalk-segments, POST /robots, POST /robots/{robot_id}/telemetry, POST /delivery-orders, POST /intervention-events, POST /incident-reports"

  - rule: payload_tier_upper_bound
    priority: 13
    category: input
    condition: "payload_liters > 45.0, which has no payload tier"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /delivery-orders"

  - rule: timestamps_iso8601_utc
    priority: 14
    category: input
    condition: "a datetime field is not an ISO 8601 UTC instant with exactly three fractional digits and a trailing Z"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /segment-closures, POST /bay-reservations, POST /delivery-orders, POST /_clock/set_current_utc"

  - rule: interval_endpoints_ordered
    priority: 15
    category: input
    condition: "window_end_utc <= window_start_utc, or ends_at_utc <= starts_at_utc, or promised_by_utc <= the current logical clock instant"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /bay-reservations, POST /segment-closures, POST /delivery-orders"

  - rule: action_recognised_for_endpoint
    priority: 16
    category: input
    condition: "the action field is absent or is not one of the actions the transition endpoint declares"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every /transitions, /permit-transitions, /integration-transitions, /duty-transitions and /health-transitions endpoint"

  - rule: action_conditional_fields_present
    priority: 17
    category: input
    condition: "an action is submitted without the field that action requires: ABORT without reason_code, COMPLETE without lid_access_code, REPORT_BLOCKAGE without blocking_segment_id, SUBMIT_MUNICIPAL without municipal_case_ref, NOTIFY_INSURER without insurer_claim_ref, ESCALATE without escalation_reason, RESTRICT or REVOKE without reason, BEGIN_CHARGE or BEGIN_MAINTENANCE without bay_reservation_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every transition endpoint whose input carries optional action-specific fields"

  - rule: occ_version_field_present
    priority: 18
    category: input
    condition: "the endpoint declares an expected_<parent>_version field and the request omits it"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /route-plans, POST /bay-reservations, POST /delivery-missions"

  - rule: segment_sequence_well_formed
    priority: 19
    category: input
    condition: "segment_sequence is empty, or repeats the same segment id, or connected_segment_ids contains the segment's own id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /route-plans, POST /sidewalk-segments"

  - rule: zone_exists
    priority: 30
    category: referential
    condition: "a referenced ServiceZone id resolves to no row"
    error_id: ERR_ZONE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying zone_id in the path or the body"

  - rule: segment_exists
    priority: 31
    category: referential
    condition: "a referenced SidewalkSegment id resolves to no row, including any element of segment_sequence or connected_segment_ids"
    error_id: ERR_SEGMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET and POST /sidewalk-segments/{segment_id}..., POST /segment-closures, POST /route-plans, POST /delivery-orders"

  - rule: closure_exists
    priority: 32
    category: referential
    condition: "a referenced SegmentClosure id resolves to no row"
    error_id: ERR_CLOSURE_NOT_FOUND
    http_status: 404
    applies_to: "POST /segment-closures/{closure_id}/transitions"

  - rule: merchant_exists
    priority: 33
    category: referential
    condition: "a referenced Merchant id resolves to no row"
    error_id: ERR_MERCHANT_NOT_FOUND
    http_status: 404
    applies_to: "GET /merchants/{merchant_id}, POST /merchants/{merchant_id}/integration-transitions, POST /delivery-orders"

  - rule: robot_exists
    priority: 34
    category: referential
    condition: "a referenced Robot id resolves to no row"
    error_id: ERR_ROBOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /robots/{robot_id}, POST /robots/{robot_id}/..., POST /bay-reservations, POST /delivery-missions, POST /incident-reports"

  - rule: bay_exists
    priority: 35
    category: referential
    condition: "a referenced DepotBay id resolves to no row"
    error_id: ERR_BAY_NOT_FOUND
    http_status: 404
    applies_to: "GET /depot-bays/{bay_id}, POST /bay-reservations"

  - rule: reservation_exists
    priority: 36
    category: referential
    condition: "a referenced BayReservation id resolves to no row"
    error_id: ERR_RESERVATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /bay-reservations/{reservation_id}, POST /bay-reservations/{reservation_id}/transitions, POST /robots/{robot_id}/duty-transitions"

  - rule: order_exists
    priority: 37
    category: referential
    condition: "a referenced DeliveryOrder id resolves to no row"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /delivery-orders/{order_id}, POST /delivery-orders/{order_id}/cancel, POST /delivery-orders/{order_id}/remedy, POST /delivery-missions"

  - rule: mission_exists
    priority: 38
    category: referential
    condition: "a referenced DeliveryMission id resolves to no row"
    error_id: ERR_MISSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /delivery-missions/{mission_id}..., POST /delivery-missions/{mission_id}/..., POST /route-plans, POST /intervention-events, POST /incident-reports"

  - rule: route_plan_exists
    priority: 39
    category: referential
    condition: "a referenced RoutePlan id resolves to no row"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /route-plans/{plan_id}/transitions"

  - rule: intervention_exists
    priority: 40
    category: referential
    condition: "a referenced InterventionEvent id resolves to no row"
    error_id: ERR_INTERVENTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /intervention-events/{event_id}/transitions"

  - rule: incident_exists
    priority: 41
    category: referential
    condition: "a referenced IncidentReport id resolves to no row"
    error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /incident-reports/{report_id}, POST /incident-reports/{report_id}/transitions"

  - rule: mission_version_current
    priority: 45
    category: concurrency
    condition: "expected_delivery_mission_version does not equal the mission's current version"
    error_id: ERR_STALE_MISSION_VERSION
    http_status: 412
    applies_to: "POST /route-plans"

  - rule: bay_version_current
    priority: 46
    category: concurrency
    condition: "expected_depot_bay_version does not equal the bay's current version"
    error_id: ERR_STALE_BAY_VERSION
    http_status: 412
    applies_to: "POST /bay-reservations"

  - rule: order_version_current
    priority: 47
    category: concurrency
    condition: "expected_delivery_order_version does not equal the order's current version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /delivery-missions"

  - rule: target_state_allows_action
    priority: 50
    category: state
    condition: "the requested action is not a declared transition out of the target row's current state, or the target row is already in a terminal state"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every transition endpoint"
    note: "also covers NOTIFY_INSURER on a report whose insurer_notification_required is false, CLOSE on a SUBMITTED_MUNICIPAL report whose insurer_notification_required is true, and REJECT on a non-MINOR report"

  - rule: zone_permitted_for_operations
    priority: 51
    category: state
    condition: "the ServiceZone reached through the robot has permit_state != PERMITTED"
    error_id: ERR_ZONE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /delivery-missions, POST /delivery-missions/{mission_id}/transitions with action DEPART or RESUME"
    note: "outranks every capacity and eligibility rule, so a dispatch into a RESTRICTED zone reports the permit failure even when the zone also has no eligible robot"

  - rule: merchant_integration_active
    priority: 52
    category: state
    condition: "the order's Merchant has integration_state != ACTIVE"
    error_id: ERR_MERCHANT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /delivery-orders"

  - rule: robot_duty_available_for_dispatch
    priority: 53
    category: state
    condition: "the named Robot has duty_state != AVAILABLE"
    error_id: ERR_ROBOT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /delivery-missions"

  - rule: robot_health_allows_dispatch
    priority: 54
    category: state
    condition: "the named Robot has health_state IN {IMPAIRED, QUARANTINED}"
    error_id: ERR_ROBOT_HEALTH_BLOCKED
    http_status: 409
    applies_to: "POST /delivery-missions, POST /delivery-missions/{mission_id}/transitions with action DEPART"

  - rule: plan_segments_approved
    priority: 55
    category: state
    condition: "any SidewalkSegment in the plan's segment_sequence has status NOT IN {APPROVED, BLOCKED}, that is MAPPED, SURVEYED or RETIRED"
    error_id: ERR_SEGMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /route-plans/{plan_id}/transitions with action VALIDATE"
    note: "deliberately excludes BLOCKED so the more specific rule 56 owns the blocked case; without that carve-out this rule would shadow ERR_SEGMENT_BLOCKED at VALIDATE"

  - rule: plan_segments_not_blocked
    priority: 56
    category: state
    condition: "any SidewalkSegment in the plan's segment_sequence has status == BLOCKED"
    error_id: ERR_SEGMENT_BLOCKED
    http_status: 409
    applies_to: "POST /route-plans/{plan_id}/transitions with action VALIDATE or ACTIVATE, POST /delivery-missions/{mission_id}/transitions with action RESUME"
    note: "re-evaluated at ACTIVATE because a closure may have activated between validation and activation"

  - rule: mission_not_terminal
    priority: 57
    category: state
    condition: "the DeliveryMission has mission_state IN {COMPLETED, ABORTED}"
    error_id: ERR_MISSION_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /delivery-missions/{mission_id}/load, POST /delivery-missions/{mission_id}/transitions, POST /route-plans, POST /intervention-events"

  - rule: reservation_live_for_transition
    priority: 58
    category: state
    condition: "a RELEASE action targets a reservation whose state != ACTIVE, or a BEGIN_CHARGE/BEGIN_MAINTENANCE duty transition names a reservation whose state != ACTIVE"
    error_id: ERR_RESERVATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /bay-reservations/{reservation_id}/transitions, POST /robots/{robot_id}/duty-transitions"

  - rule: no_open_takeover_at_handoff
    priority: 59
    category: state
    condition: "the mission has at least one InterventionEvent whose takeover_state != RELEASED when ARRIVE or COMPLETE is requested, or a RELEASE is requested on a REQUESTED event whose mandatory is true"
    error_id: ERR_TAKEOVER_REQUIRED
    http_status: 409
    applies_to: "POST /delivery-missions/{mission_id}/transitions, POST /intervention-events/{event_id}/transitions"

  - rule: remedy_not_already_issued
    priority: 60
    category: state
    condition: "the order already has a non-null remedy_kind"
    error_id: ERR_REMEDY_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /delivery-orders/{order_id}/remedy"

  - rule: remedy_requires_latched_exception
    priority: 61
    category: state
    condition: "the order has exception_reason == null, so no remedy policy row can be selected"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /delivery-orders/{order_id}/remedy"

  - rule: route_clearance_sufficient
    priority: 65
    category: safety
    condition: "calculations.route_clearance_margin over the submitted segment_sequence is strictly negative for the mission's robot"
    error_id: ERR_CLEARANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /route-plans"
    note: "accessibility and ordinance findings are reported ahead of the structural rules at 70..76, so a plan that is both too tight and mis-sequenced reports the clearance failure"

  - rule: crossing_risk_within_ceiling
    priority: 66
    category: safety
    condition: "the maximum crossing_risk_score over the submitted segments, or the surveyed score of the segment being approved, exceeds zone.max_crossing_risk"
    error_id: ERR_CROSSING_RISK_EXCEEDED
    http_status: 422
    applies_to: "POST /route-plans, POST /sidewalk-segments/{segment_id}/transitions with action APPROVE"

  - rule: robot_speed_within_ordinance
    priority: 67
    category: safety
    condition: "robot.max_speed_cm_s > zone.ordinance_max_speed_cm_s"
    error_id: ERR_ORDINANCE_SPEED_EXCEEDED
    http_status: 422
    applies_to: "POST /robots, POST /delivery-missions"

  - rule: route_within_operating_window
    priority: 68
    category: safety
    condition: "the interval from the current logical clock instant to that instant plus planned_duration_min minutes is not fully inside the zone's daily operating window"
    error_id: ERR_CURFEW_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /route-plans"

  - rule: segment_clearance_meets_ordinance
    priority: 69
    category: safety
    condition: "measured_clearance_cm < zone.ordinance_min_clearance_cm when a segment is approved"
    error_id: ERR_CLEARANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /sidewalk-segments/{segment_id}/transitions with action APPROVE"

  - rule: route_sequence_contiguous
    priority: 70
    category: consistency
    condition: "any consecutive pair in segment_sequence is not adjacent, that is the successor's id is absent from the predecessor's connected_segment_ids"
    error_id: ERR_ROUTE_NOT_CONTIGUOUS
    http_status: 422
    applies_to: "POST /route-plans"

  - rule: route_terminates_at_dropoff
    priority: 71
    category: consistency
    condition: "the last element of segment_sequence is not the order's dropoff_segment_id"
    error_id: ERR_ROUTE_DROPOFF_MISMATCH
    http_status: 422
    applies_to: "POST /route-plans"

  - rule: route_segments_share_mission_zone
    priority: 72
    category: consistency
    condition: "any segment in segment_sequence has a zone_id different from the mission robot's zone_id"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /route-plans"

  - rule: order_dropoff_in_merchant_zone
    priority: 73
    category: consistency
    condition: "the dropoff segment's zone_id differs from the merchant's zone_id"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /delivery-orders"

  - rule: mission_robot_shares_order_zone
    priority: 74
    category: consistency
    condition: "the named robot's zone_id differs from the zone of the order's dropoff segment"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /delivery-missions"

  - rule: reservation_bay_shares_robot_zone
    priority: 75
    category: consistency
    condition: "the bay's zone_id differs from the robot's zone_id"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /bay-reservations"

  - rule: adjacency_within_zone
    priority: 76
    category: consistency
    condition: "any element of connected_segment_ids names a segment in a different zone"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /sidewalk-segments"

  - rule: payload_within_container_capacity
    priority: 80
    category: constraint
    condition: "order.payload_liters > robot.container_capacity_liters at dispatch, or actual_payload_liters > robot.container_capacity_liters at load"
    error_id: ERR_PAYLOAD_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /delivery-missions, POST /delivery-missions/{mission_id}/load"

  - rule: eligible_robot_pool_non_empty
    priority: 81
    category: constraint
    condition: "the named robot fails any clause of the calculations.robot_selector eligibility filter that is not already covered by rules 53, 54, 67 or 80, specifically battery_pct < 35.0 or rolling_autonomy_index < 70, or the zone's eligible pool is empty"
    error_id: ERR_NO_ELIGIBLE_ROBOT
    http_status: 422
    applies_to: "POST /delivery-missions"

  - rule: lid_access_code_matches
    priority: 82
    category: constraint
    condition: "the lid_access_code submitted with COMPLETE differs from the mission's minted lid_access_code"
    error_id: ERR_LID_CODE_MISMATCH
    http_status: 422
    applies_to: "POST /delivery-missions/{mission_id}/transitions"

  - rule: zone_concurrent_robot_cap
    priority: 83
    category: constraint
    condition: "zone.on_mission_robot_count is already >= zone.max_concurrent_robots when a robot is taken onto a mission"
    error_id: ERR_ZONE_ROBOT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery-missions"
    note: "aggregate rule enforced on the declared Robot AVAILABLE -> ON_MISSION precondition, which is where on_mission_robot_count is incremented: each individual dispatch is legal, the collective count is what fails"

  - rule: bay_window_exclusive
    priority: 84
    category: constraint
    condition: "the requested [window_start_utc, window_end_utc) half-open interval conflicts with an existing HELD or ACTIVE reservation of the same bay once that reservation is inflated by TURNAROUND_BUFFER_MINUTES on both sides, that is window_start_utc < existing.window_end_utc + 15 minutes AND window_end_utc + 15 minutes > existing.window_start_utc"
    error_id: ERR_BAY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /bay-reservations"
    note: "half-open semantics with a turnaround buffer: a window starting exactly 15 minutes after an existing window ends is accepted, one starting 14 minutes after is rejected"

  - rule: hard_closure_window_exclusive
    priority: 85
    category: constraint
    condition: "a HARD closure's fully closed [starts_at_utc, ends_at_utc] interval intersects the interval of an existing HARD closure of the same segment whose state is SCHEDULED or ACTIVE, that is starts_at_utc <= existing.ends_at_utc AND ends_at_utc >= existing.starts_at_utc"
    error_id: ERR_HARD_CLOSURE_OVERLAP
    http_status: 409
    applies_to: "POST /segment-closures"
    note: "closed semantics with no buffer and scoped to closure_kind == HARD: touching endpoints do conflict, and an ADVISORY closure never conflicts with anything"

  - rule: remedy_within_zone_budget
    priority: 86
    category: constraint
    condition: "the computed remedy amount exceeds zone.remedy_budget_remaining_cents"
    error_id: ERR_REMEDY_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /delivery-orders/{order_id}/remedy"

  - rule: quarantine_clear_requires_submitted_incident
    priority: 87
    category: constraint
    condition: "a CLEAR health transition is requested while the robot still has an IncidentReport in report_state DRAFT"
    error_id: ERR_MANDATORY_INCIDENT_UNFILED
    http_status: 409
    applies_to: "POST /robots/{robot_id}/health-transitions"

  - rule: reservation_type_matches_bay_type
    priority: 88
    category: constraint
    condition: "the reservation_type is not equal to the bay's bay_type, for example a CHARGE reservation on a SERVICE bay"
    error_id: ERR_BAY_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /bay-reservations"

  - rule: bay_in_service
    priority: 89
    category: constraint
    condition: "the DepotBay has state == OUT_OF_SERVICE"
    error_id: ERR_BAY_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /bay-reservations, POST /bay-reservations/{reservation_id}/transitions with action ACTIVATE"

# =============================================================================
# 1.5 Endpoints
# =============================================================================
# api_prefix is the empty string, so every collection sits at the root.
# Every list endpoint accepts limit? and offset? and returns the paginated
# envelope described in response_envelope; every FK is reachable in reverse
# through its child collection's filtered list.

endpoints:

  # --- reads -----------------------------------------------------------------

  - method: GET
    path: /service-zones
    description: "Paginated list of service zones, newest first by created_at DESC then id ASC."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer, CustomerSupport]
    input: ["permit_state?", "municipality_code?", "limit?", "offset?"]
    output: ServiceZone[]
    status: 200
    side_effects: []

  - method: GET
    path: /service-zones/{zone_id}
    description: "Single service zone with its permit state, ordinance limits and derived ledgers."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer, CustomerSupport]
    input: []
    output: ServiceZone
    status: 200
    side_effects: []

  - method: GET
    path: /service-zones/{zone_id}/economics
    description: >-
      Computed unit economics of the zone, produced by calculations.zone_cost_per_delivery. Every
      field is derived on read; nothing is stored. cost_per_delivery_cents and
      contribution_per_delivery_cents are null when the zone has no delivered or refunded order.
    roles: [PlatformAdmin, FleetDispatcher]
    input: []
    output: "{ zone_id: string, robot_active_minutes: integer, fleet_capacity_minutes: integer, utilization_pct: number, allocated_overhead_cents: integer, variable_cost_cents: integer, delivered_count: integer, cost_per_delivery_cents: integer, contribution_per_delivery_cents: integer, throughput_per_robot_hour: number }"
    status: 200
    side_effects: []

  - method: GET
    path: /sidewalk-segments
    description: "Filtered list of sidewalk segments; the zone_id filter is the reverse lookup from a zone to its sidewalk network."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer]
    input: ["zone_id?", "status?", "segment_type?", "limit?", "offset?"]
    output: SidewalkSegment[]
    status: 200
    side_effects: []

  - method: GET
    path: /sidewalk-segments/{segment_id}
    description: "Single sidewalk segment with its survey inputs, frozen crossing_risk_score and adjacency array."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer]
    input: []
    output: SidewalkSegment
    status: 200
    side_effects: []

  - method: GET
    path: /segment-closures
    description: "Filtered list of closures; the segment_id filter is the reverse lookup from a segment to its closures."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer]
    input: ["segment_id?", "state?", "closure_kind?", "cause?", "limit?", "offset?"]
    output: SegmentClosure[]
    status: 200
    side_effects: []

  - method: GET
    path: /segment-closures/{closure_id}
    description: "Single segment closure."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer]
    input: []
    output: SegmentClosure
    status: 200
    side_effects: []

  - method: GET
    path: /merchants
    description: "Filtered list of merchants; the zone_id filter is the reverse lookup from a zone to its merchants."
    roles: [PlatformAdmin, FleetDispatcher, CustomerSupport, MerchantOperator]
    input: ["zone_id?", "integration_state?", "merchant_grade?", "limit?", "offset?"]
    output: Merchant[]
    status: 200
    side_effects: []

  - method: GET
    path: /merchants/{merchant_id}
    description: "Single merchant with its three fee buckets and settlement variance. A MerchantOperator may only read its own row."
    roles: [PlatformAdmin, FleetDispatcher, CustomerSupport, MerchantOperator]
    input: []
    output: Merchant
    status: 200
    side_effects: []

  - method: GET
    path: /robots
    description: >-
      Filtered list of robots; the zone_id filter is the reverse lookup from a zone to its fleet.
      When eligible_only is true the list is restricted to the calculations.robot_selector eligible
      pool and ordered by rolling_autonomy_index DESC, battery_pct DESC, created_at ASC.
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer]
    input: ["zone_id?", "duty_state?", "health_state?", "eligible_only?", "limit?", "offset?"]
    output: Robot[]
    status: 200
    side_effects: []

  - method: GET
    path: /robots/{robot_id}
    description: "Single robot with both parallel state dimensions and both autonomy-index variants."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer]
    input: []
    output: Robot
    status: 200
    side_effects: []

  - method: GET
    path: /depot-bays
    description: "Filtered list of depot bays; the zone_id filter is the reverse lookup from a zone to its depot."
    roles: [PlatformAdmin, FleetDispatcher]
    input: ["zone_id?", "bay_type?", "state?", "limit?", "offset?"]
    output: DepotBay[]
    status: 200
    side_effects: []

  - method: GET
    path: /depot-bays/{bay_id}
    description: "Single depot bay with its committed_minutes ledger."
    roles: [PlatformAdmin, FleetDispatcher]
    input: []
    output: DepotBay
    status: 200
    side_effects: []

  - method: GET
    path: /bay-reservations
    description: "Filtered list of bay reservations; bay_id and robot_id are the two reverse lookups."
    roles: [PlatformAdmin, FleetDispatcher]
    input: ["bay_id?", "robot_id?", "state?", "reservation_type?", "limit?", "offset?"]
    output: BayReservation[]
    status: 200
    side_effects: []

  - method: GET
    path: /bay-reservations/{reservation_id}
    description: "Single bay reservation with its immutable window_minutes."
    roles: [PlatformAdmin, FleetDispatcher]
    input: []
    output: BayReservation
    status: 200
    side_effects: []

  - method: GET
    path: /delivery-orders
    description: >-
      Filtered list of delivery orders; merchant_id and dropoff_segment_id are the two reverse
      lookups. A MerchantOperator sees only its own orders regardless of the filter.
    roles: [PlatformAdmin, FleetDispatcher, CustomerSupport, MerchantOperator]
    input: ["merchant_id?", "dropoff_segment_id?", "order_state?", "exception_reason?", "limit?", "offset?"]
    output: DeliveryOrder[]
    status: 200
    side_effects: []

  - method: GET
    path: /delivery-orders/{order_id}
    description: "Single delivery order with both fee variants, the latched exception_reason and any remedy."
    roles: [PlatformAdmin, FleetDispatcher, CustomerSupport, MerchantOperator]
    input: []
    output: DeliveryOrder
    status: 200
    side_effects: []

  - method: GET
    path: /delivery-missions
    description: "Filtered list of missions; order_id and robot_id are the two reverse lookups."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer, MerchantOperator]
    input: ["order_id?", "robot_id?", "mission_state?", "limit?", "offset?"]
    output: DeliveryMission[]
    status: 200
    side_effects: []

  - method: GET
    path: /delivery-missions/{mission_id}
    description: "Single mission with its accumulated distance, crossing, blockage and intervention counters."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer, MerchantOperator]
    input: []
    output: DeliveryMission
    status: 200
    side_effects: []

  - method: GET
    path: /route-plans
    description: "Filtered list of route plans; the mission_id filter is the reverse lookup from a mission to its plan history, ordered by revision_index ASC."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator]
    input: ["mission_id?", "plan_state?", "limit?", "offset?"]
    output: RoutePlan[]
    status: 200
    side_effects: []

  - method: GET
    path: /route-plans/{plan_id}
    description: "Single route plan with its derived geometry, clearance margin and planned duration."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator]
    input: []
    output: RoutePlan
    status: 200
    side_effects: []

  - method: GET
    path: /intervention-events
    description: "Filtered list of intervention events; the mission_id filter is the reverse lookup from a mission to its takeovers."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer]
    input: ["mission_id?", "takeover_state?", "trigger_reason?", "mandatory?", "limit?", "offset?"]
    output: InterventionEvent[]
    status: 200
    side_effects: []

  - method: GET
    path: /intervention-events/{event_id}
    description: "Single intervention event with its mandatory classification and control_seconds."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer]
    input: []
    output: InterventionEvent
    status: 200
    side_effects: []

  - method: GET
    path: /incident-reports
    description: "Filtered list of incident reports; zone_id, mission_id and robot_id are the three reverse lookups."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer, CustomerSupport]
    input: ["zone_id?", "mission_id?", "robot_id?", "report_state?", "severity?", "category?", "limit?", "offset?"]
    output: IncidentReport[]
    status: 200
    side_effects: []

  - method: GET
    path: /incident-reports/{report_id}
    description: "Single incident report with its municipal deadline and insurer gate."
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer, CustomerSupport]
    input: []
    output: IncidentReport
    status: 200
    side_effects: []

  # --- writes: mapping and compliance ---------------------------------------

  - method: POST
    path: /service-zones
    description: "Provision a service zone with its ordinance limits, planning assumptions and remedy budget. The zone starts in permit_state PROVISIONED and cannot host a dispatch until its permit is activated."
    roles: [PlatformAdmin]
    input: ["name", "municipality_code", "ordinance_min_clearance_cm", "ordinance_max_speed_cm_s", "operating_window_start_utc_hhmm", "operating_window_end_utc_hhmm", "max_concurrent_robots", "planning_haul_m", "planning_crossings", "remedy_budget_cents", "max_crossing_risk?", "takeover_confidence_threshold_pct?", "insurer_notify_threshold_cents?"]
    output: ServiceZone
    status: 201
    side_effects:
      - "creates the ServiceZone with permit_state = PROVISIONED and every ledger at 0"
      - "remedy_budget_remaining_cents = remedy_budget_cents"

  - method: POST
    path: /service-zones/{zone_id}/permit-transitions
    description: "Drive the zone permit state machine. Actions: ACTIVATE_PERMIT, RESTRICT (reason required), LIFT_RESTRICTION, REVOKE (reason required). REVOKE fans out across the zone's fleet and aborts every live mission."
    roles: [PlatformAdmin]
    input: ["action", "reason?"]
    output: ServiceZone
    status: 200
    side_effects:
      - "applies the requested ServiceZone.permit_state transition and its declared cascade"
      - "increments ServiceZone.version by 1"

  - method: POST
    path: /sidewalk-segments
    description: >-
      Map a sidewalk segment into a zone's network. connected_segment_ids is the self-referential
      adjacency array; the server enforces symmetry by adding this segment's id to each named
      neighbour's array. The segment starts in status MAPPED with crossing_risk_score null.
    roles: [PlatformAdmin]
    input: ["zone_id", "segment_code", "segment_type", "length_m", "measured_clearance_cm", "surface_grade_pct", "crossing_control?", "sightline_m?", "pedestrian_flow_per_min?", "curb_ramp_present?", "connected_segment_ids?"]
    output: SidewalkSegment
    status: 201
    side_effects:
      - "creates the SidewalkSegment with status = MAPPED and crossing_risk_score = null"
      - "adds this segment's id to connected_segment_ids of every named neighbour and increments each of those SidewalkSegment.version by 1"

  - method: POST
    path: /sidewalk-segments/{segment_id}/transitions
    description: >-
      Drive the segment lifecycle. Actions: SURVEY (optionally overriding sightline_m,
      pedestrian_flow_per_min, curb_ramp_present and measured_clearance_cm, then freezing
      crossing_risk_score), APPROVE (gated on the ordinance clearance minimum and the zone risk
      ceiling), RETIRE. BLOCKED and the return to APPROVED are reached only through closure cascades.
    roles: [PlatformAdmin]
    input: ["action", "sightline_m?", "pedestrian_flow_per_min?", "curb_ramp_present?", "measured_clearance_cm?"]
    output: SidewalkSegment
    status: 200
    side_effects:
      - "applies the requested SidewalkSegment.status transition"
      - "on SURVEY: overwrites the supplied survey inputs and writes crossing_risk_score from calculations.crossing_risk_score"
      - "increments SidewalkSegment.version by 1"

  - method: POST
    path: /segment-closures
    description: >-
      Schedule a closure over a segment for a fully closed [starts_at_utc, ends_at_utc] window. HARD
      closures of the same segment may not intersect each other, not even at a shared endpoint;
      ADVISORY closures never conflict.
    roles: [PlatformAdmin]
    input: ["segment_id", "closure_kind", "cause", "starts_at_utc", "ends_at_utc"]
    output: SegmentClosure
    status: 201
    side_effects:
      - "creates the SegmentClosure in state SCHEDULED with reroute_triggered_count = 0"

  - method: POST
    path: /segment-closures/{closure_id}/transitions
    description: >-
      Drive the closure lifecycle. Actions: ACTIVATE, which is the head of the five-link blockage
      cascade (closure -> segment -> route plans -> missions -> orders and merchant ledgers), and
      LIFT, which returns the segment to APPROVED without restoring any cascaded order.
    roles: [PlatformAdmin]
    input: ["action"]
    output: SegmentClosure
    status: 200
    side_effects:
      - "applies the requested SegmentClosure.state transition and its declared five-link cascade"
      - "increments SegmentClosure.version by 1"

  - method: POST
    path: /merchants
    description: "Onboard a merchant into a zone. The merchant starts in integration_state PENDING and cannot receive orders until activated."
    roles: [PlatformAdmin]
    input: ["zone_id", "name", "handoff_sla_seconds?", "merchant_grade?"]
    output: Merchant
    status: 201
    side_effects:
      - "creates the Merchant with integration_state = PENDING and all three fee buckets at 0"

  - method: POST
    path: /merchants/{merchant_id}/integration-transitions
    description: "Drive the merchant integration lifecycle. Actions: ACTIVATE, SUSPEND, REINSTATE."
    roles: [PlatformAdmin]
    input: ["action", "reason?"]
    output: Merchant
    status: 200
    side_effects:
      - "applies the requested Merchant.integration_state transition"
      - "increments Merchant.version by 1"

  # --- writes: fleet ---------------------------------------------------------

  - method: POST
    path: /robots
    description: "Register a robot into a zone. Rejected when the robot's max_speed_cm_s exceeds the zone ordinance. The robot starts OFFLINE and NOMINAL with both autonomy indices at 100."
    roles: [PlatformAdmin]
    input: ["zone_id", "asset_tag", "width_cm", "container_capacity_liters", "max_speed_cm_s"]
    output: Robot
    status: 201
    side_effects:
      - "creates the Robot with duty_state = OFFLINE, health_state = NOMINAL, battery_pct = 100.0, rolling_autonomy_index = 100 and lifetime_autonomy_index = 100"

  - method: POST
    path: /robots/{robot_id}/duty-transitions
    description: >-
      Drive the duty dimension of the robot. Actions: STAGE, MAKE_AVAILABLE, BEGIN_CHARGE
      (bay_reservation_id required), BEGIN_MAINTENANCE (bay_reservation_id required), RETIRE.
      ON_MISSION is entered and left only by dispatch and mission completion.
    roles: [FleetDispatcher]
    input: ["action", "bay_reservation_id?"]
    output: Robot
    status: 200
    side_effects:
      - "applies the requested Robot.duty_state transition and its declared reservation side effects"
      - "increments Robot.version by 1"

  - method: POST
    path: /robots/{robot_id}/health-transitions
    description: >-
      Drive the health dimension of the robot, independently of duty_state. Actions: DOWNGRADE,
      IMPAIR, QUARANTINE (head of the four-link quarantine cascade), CLEAR. CLEAR is refused while
      the robot still has an incident report sitting in DRAFT.
    roles: [SafetyOfficer]
    input: ["action", "reason?"]
    output: Robot
    status: 200
    side_effects:
      - "applies the requested Robot.health_state transition and, for QUARANTINE, the declared four-link cascade"
      - "increments Robot.version by 1"

  - method: POST
    path: /robots/{robot_id}/telemetry
    description: >-
      Ingest a telemetry frame. A frame reporting tamper_flag true drives the health dimension to
      QUARANTINED with the full cascade; a frame dropping battery_pct to calculations.robot_selector.LOW_BATTERY_PCT (20.0) or below
      downgrades a NOMINAL robot to DEGRADED. odometer_delta_m and yield_event_delta accumulate onto
      the stored counters.
    roles: [FleetDispatcher, RemoteOperator]
    input: ["battery_pct?", "odometer_delta_m?", "yield_event_delta?", "tamper_flag?"]
    output: Robot
    status: 200
    side_effects:
      - "updates battery_pct when supplied; odometer_m += odometer_delta_m; yield_event_count += yield_event_delta"
      - "may trigger the NOMINAL -> DEGRADED or the any -> QUARANTINED health transition with its cascade"
      - "increments Robot.version by 1"

  - method: POST
    path: /depot-bays
    description: "Provision a depot bay in a zone. A bay created with state OUT_OF_SERVICE refuses every reservation."
    roles: [PlatformAdmin]
    input: ["zone_id", "bay_code", "bay_type", "power_kw?", "state?"]
    output: DepotBay
    status: 201
    side_effects:
      - "creates the DepotBay with committed_minutes = 0"

  - method: POST
    path: /bay-reservations
    description: >-
      Reserve a bay window for a robot. The window is half-open, [window_start_utc, window_end_utc),
      and every existing HELD or ACTIVE reservation of the same bay is inflated by
      TURNAROUND_BUFFER_MINUTES on both sides before the exclusivity test. Optimistic concurrency is
      on the parent DepotBay: expected_depot_bay_version must equal the bay's current version.
    roles: [FleetDispatcher]
    input: ["bay_id", "robot_id", "reservation_type", "window_start_utc", "window_end_utc", "expected_depot_bay_version"]
    output: BayReservation
    status: 201
    side_effects:
      - "creates the BayReservation in state HELD with window_minutes derived from the window"
      - "bay.committed_minutes += window_minutes; increments DepotBay.version by 1"
      - "zone.reserved_bay_minutes += window_minutes; increments ServiceZone.version by 1"

  - method: POST
    path: /bay-reservations/{reservation_id}/transitions
    description: "Drive the reservation lifecycle. Actions: ACTIVATE, RELEASE, CANCEL. RELEASE and CANCEL each return window_minutes to both ledgers exactly once."
    roles: [FleetDispatcher]
    input: ["action"]
    output: BayReservation
    status: 200
    side_effects:
      - "applies the requested BayReservation.state transition and its declared ledger side effects"
      - "increments BayReservation.version by 1"

  # --- writes: orders, missions and routes -----------------------------------

  - method: POST
    path: /delivery-orders
    description: >-
      Accept an order from an ACTIVE merchant. quoted_fee_cents is written here from the
      forward-looking variant of calculations.delivery_fee using the zone's planning assumptions, and
      the amount is escrowed on the merchant. urgency_flag and payload_tier are frozen at this moment.
    roles: [MerchantOperator, PlatformAdmin]
    input: ["merchant_id", "dropoff_segment_id", "customer_ref", "payload_liters", "declared_value_cents", "promised_by_utc"]
    output: DeliveryOrder
    status: 201
    side_effects:
      - "creates the DeliveryOrder in order_state RECEIVED with urgency_flag, payload_tier and quoted_fee_cents computed"
      - "merchant.escrowed_fee_cents += quoted_fee_cents; increments Merchant.version by 1"

  - method: POST
    path: /delivery-orders/{order_id}/cancel
    description: "Merchant-initiated cancellation, only while the order is still RECEIVED. Moves the escrowed amount to released, which is the compensating half of the merchant fee invariant."
    roles: [MerchantOperator, PlatformAdmin]
    input: ["reason"]
    output: DeliveryOrder
    status: 200
    side_effects:
      - "order_state RECEIVED -> CANCELLED"
      - "merchant.escrowed_fee_cents -= quoted_fee_cents; merchant.released_fee_cents += quoted_fee_cents; increments Merchant.version by 1"
      - "increments DeliveryOrder.version by 1"

  - method: POST
    path: /delivery-orders/{order_id}/remedy
    description: >-
      Issue the customer remedy for a failed or late delivery. The policy row is selected from the
      order's latched exception_reason, never from the request. remedy_kind REFUND charges all three
      waterfall buckets and moves the order to REFUNDED, GOODWILL_CREDIT charges only the goodwill
      bucket and leaves order_state untouched, REDELIVER charges nothing and returns the order to
      RECEIVED. Exactly one remedy may ever be issued per order.
    roles: [CustomerSupport]
    input: ["remedy_kind"]
    output: DeliveryOrder
    status: 200
    side_effects:
      - "writes remedy_kind, remedy_reason_code and remedy_amount_cents from calculations.customer_remedy_amount"
      - "applies the matching DeliveryOrder.order_state transition"
      - "zone.remedy_spent_cents += remedy_amount_cents and zone.remedy_budget_remaining_cents is recomputed for REFUND and GOODWILL_CREDIT; increments ServiceZone.version by 1"
      - "increments DeliveryOrder.version by 1"

  - method: POST
    path: /delivery-missions
    description: >-
      Dispatch a robot against a RECEIVED order. The robot is supplied explicitly and must satisfy
      every clause of the calculations.robot_selector eligibility filter. Optimistic concurrency is on
      the parent DeliveryOrder: expected_delivery_order_version must equal the order's current version.
    roles: [FleetDispatcher]
    input: ["order_id", "robot_id", "expected_delivery_order_version"]
    output: DeliveryMission
    status: 201
    side_effects:
      - "creates the DeliveryMission in mission_state PLANNED with every counter at 0"
      - "order_state RECEIVED -> DISPATCHED; dispatch_attempt_count += 1; increments DeliveryOrder.version by 1"
      - "robot duty_state AVAILABLE -> ON_MISSION; robot.active_mission_id = the new mission; increments Robot.version by 1"
      - "zone.on_mission_robot_count += 1; increments ServiceZone.version by 1"

  - method: POST
    path: /delivery-missions/{mission_id}/load
    description: >-
      Merchant handoff. Confirms the container was sealed, records the actual payload and mints the
      six-digit lid access code from the zone's monotonically increasing lid_code_sequence. A handoff
      later than the merchant's handoff_sla_seconds is flagged and counted as a merchant exception.
    roles: [MerchantOperator, PlatformAdmin]
    input: ["actual_payload_liters", "lid_seal_confirmed"]
    output: DeliveryMission
    status: 200
    side_effects:
      - "mission_state PLANNED -> LOADED with actual_payload_liters stored"
      - "zone.lid_code_sequence += 1 and lid_access_code minted from it; increments ServiceZone.version by 1"
      - "handoff_late set, and merchant.exception_count += 1 with increments Merchant.version by 1 when it is true"
      - "increments DeliveryMission.version by 1"

  - method: POST
    path: /delivery-missions/{mission_id}/transitions
    description: >-
      Drive the mission lifecycle. Actions and their roles: DEPART, ARRIVE, COMPLETE (lid_access_code
      required) and ABORT (reason_code required) are FleetDispatcher; REPORT_BLOCKAGE
      (blocking_segment_id required) and RESUME are RemoteOperator. A role submitting another role's
      action is refused with ERR_ROLE_FORBIDDEN.
    roles: [FleetDispatcher, RemoteOperator]
    input: ["action", "lid_access_code?", "reason_code?", "blocking_segment_id?"]
    output: DeliveryMission
    status: 200
    side_effects:
      - "applies the requested DeliveryMission.mission_state transition and every declared side effect, including the order, robot, merchant and zone updates"
      - "on COMPLETE: settles the order fee from the chronological variant of calculations.delivery_fee and recomputes both robot autonomy indices"
      - "increments DeliveryMission.version by 1"

  - method: POST
    path: /route-plans
    description: >-
      Submit a candidate route for a mission. The geometry gates run here in ladder order: clearance
      (65), crossing risk (66), operating window (68), then contiguity (70) and dropoff match (71).
      Optimistic concurrency is on the parent DeliveryMission: expected_delivery_mission_version must
      equal the mission's current version. The plan lands in DRAFT and must be validated and activated.
    roles: [FleetDispatcher]
    input: ["mission_id", "segment_sequence", "expected_delivery_mission_version"]
    output: RoutePlan
    status: 201
    side_effects:
      - "creates the RoutePlan in plan_state DRAFT with total_length_m, crossing_count, clearance_margin_cm, planned_duration_min and revision_index derived"
      - "increments DeliveryMission.version by 1"

  - method: POST
    path: /route-plans/{plan_id}/transitions
    description: >-
      Drive the plan lifecycle. Actions: VALIDATE (re-checks segment status), ACTIVATE (supersedes the
      mission's previous ACTIVE plan and repoints mission.active_route_plan_id), REJECT
      (rejection_reason required).
    roles: [FleetDispatcher]
    input: ["action", "rejection_reason?"]
    output: RoutePlan
    status: 200
    side_effects:
      - "applies the requested RoutePlan.plan_state transition and its declared supersession side effects"
      - "increments RoutePlan.version by 1"

  # --- writes: interventions and incidents ----------------------------------

  - method: POST
    path: /intervention-events
    description: >-
      Open a remote-operator intervention request against a live mission. mandatory is computed from
      the zone takeover threshold at this moment and freezes; a mandatory request can never be
      released without an operator assuming control.
    roles: [RemoteOperator, FleetDispatcher]
    input: ["mission_id", "trigger_reason", "autonomy_confidence_pct"]
    output: InterventionEvent
    status: 201
    side_effects:
      - "creates the InterventionEvent in takeover_state REQUESTED with mandatory computed from calculations.takeover_mandatory"

  - method: POST
    path: /intervention-events/{event_id}/transitions
    description: >-
      Drive the takeover procedure. Actions and their roles: ACKNOWLEDGE, ASSUME, ESCALATE
      (escalation_reason required) and RELEASE are RemoteOperator; DEESCALATE and a RELEASE out of
      ESCALATED are SafetyOfficer; a RELEASE of a non-mandatory REQUESTED event is FleetDispatcher.
    roles: [RemoteOperator, SafetyOfficer, FleetDispatcher]
    input: ["action", "escalation_reason?"]
    output: InterventionEvent
    status: 200
    side_effects:
      - "applies the requested InterventionEvent.takeover_state transition and its declared mission counter updates"
      - "increments InterventionEvent.version by 1"

  - method: POST
    path: /incident-reports
    description: >-
      File an incident draft for municipal and insurer handling. insurer_notification_required and
      municipal_due_by_utc are computed at creation from severity and the zone threshold, and
      filed_by_user_id latches the caller so the later submission can enforce segregation of duties.
    roles: [RemoteOperator, SafetyOfficer]
    input: ["zone_id", "robot_id", "category", "severity", "narrative", "mission_id?", "estimated_damage_cents?"]
    output: IncidentReport
    status: 201
    side_effects:
      - "creates the IncidentReport in report_state DRAFT with filed_by_user_id = X-User-ID"
      - "computes insurer_notification_required and municipal_due_by_utc"
      - "zone.open_incident_count += 1; increments ServiceZone.version by 1"

  - method: POST
    path: /incident-reports/{report_id}/transitions
    description: >-
      Drive the reporting workflow. Actions: SUBMIT_MUNICIPAL (municipal_case_ref required, refused
      when the caller is the filer), NOTIFY_INSURER (insurer_claim_ref required, only on the insurer
      branch), CLOSE (refused on the municipal-only path while the insurer branch is still owed),
      RETURN_FOR_DETAIL (only by the recorded reviewer), and REJECT, which is PlatformAdmin-only and
      allowed for MINOR severity alone.
    roles: [SafetyOfficer, PlatformAdmin]
    input: ["action", "municipal_case_ref?", "insurer_claim_ref?"]
    output: IncidentReport
    status: 200
    side_effects:
      - "applies the requested IncidentReport.report_state transition"
      - "on CLOSE and REJECT: zone.open_incident_count -= 1; increments ServiceZone.version by 1"
      - "increments IncidentReport.version by 1"

  # --- test-driving endpoint ------------------------------------------------

  - method: POST
    path: /_clock/set_current_utc
    description: >-
      Set the logical clock used by every temporal rule in this API. The clock is deterministic and
      never advances on its own; its startup default is 2026-08-01T00:00:00Z. Last resort of the §1.5
      priority ladder: the operating-window, urgency-window, handoff-SLA, reservation-window and
      municipal-deadline rules cannot otherwise be reached from the business endpoints.
    roles: [PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer, CustomerSupport, MerchantOperator]
    input: ["current_utc"]
    output: "{ current_utc: string }"
    status: 200
    side_effects:
      - "sets the logical clock; no entity row is touched and no version is incremented"

# =============================================================================
# 1.6 Errors
# =============================================================================

errors:

  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "authentication required"
    raised_by: "validations.authenticated_request_required"

  - error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    message: "role {role} may not perform this operation"
    raised_by: "validations.role_permitted_for_endpoint, including per-action role restrictions on the mission, intervention and incident transition endpoints"

  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    message: "caller does not own this resource"
    raised_by: "validations.merchant_operator_owns_target, validations.incident_return_by_recorded_reviewer, validations.intervention_control_held_by_actor"

  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "the filer of an incident report may not submit it"
    raised_by: "validations.incident_submitter_differs_from_filer"

  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "request payload is invalid: {detail}"
    raised_by: "validations.required_fields_present, enum_values_recognised, numeric_ranges_respected, payload_tier_upper_bound, timestamps_iso8601_utc, interval_endpoints_ordered, action_recognised_for_endpoint, action_conditional_fields_present, occ_version_field_present, segment_sequence_well_formed"

  - error_id: ERR_ZONE_NOT_FOUND
    http_status: 404
    message: "service zone not found"
    raised_by: "validations.zone_exists"

  - error_id: ERR_SEGMENT_NOT_FOUND
    http_status: 404
    message: "sidewalk segment not found"
    raised_by: "validations.segment_exists"

  - error_id: ERR_CLOSURE_NOT_FOUND
    http_status: 404
    message: "segment closure not found"
    raised_by: "validations.closure_exists"

  - error_id: ERR_MERCHANT_NOT_FOUND
    http_status: 404
    message: "merchant not found"
    raised_by: "validations.merchant_exists"

  - error_id: ERR_ROBOT_NOT_FOUND
    http_status: 404
    message: "robot not found"
    raised_by: "validations.robot_exists"

  - error_id: ERR_BAY_NOT_FOUND
    http_status: 404
    message: "depot bay not found"
    raised_by: "validations.bay_exists"

  - error_id: ERR_RESERVATION_NOT_FOUND
    http_status: 404
    message: "bay reservation not found"
    raised_by: "validations.reservation_exists"

  - error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    message: "delivery order not found"
    raised_by: "validations.order_exists"

  - error_id: ERR_MISSION_NOT_FOUND
    http_status: 404
    message: "delivery mission not found"
    raised_by: "validations.mission_exists"

  - error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    message: "route plan not found"
    raised_by: "validations.route_plan_exists"

  - error_id: ERR_INTERVENTION_NOT_FOUND
    http_status: 404
    message: "intervention event not found"
    raised_by: "validations.intervention_exists"

  - error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    message: "incident report not found"
    raised_by: "validations.incident_exists"

  - error_id: ERR_STALE_MISSION_VERSION
    http_status: 412
    message: "delivery mission version {expected} is stale; current version is {actual}"
    raised_by: "validations.mission_version_current, concurrency_rules.route-plan-create-stale-mission"

  - error_id: ERR_STALE_BAY_VERSION
    http_status: 412
    message: "depot bay version {expected} is stale; current version is {actual}"
    raised_by: "validations.bay_version_current, concurrency_rules.bay-reservation-create-stale-bay"

  - error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    message: "delivery order version {expected} is stale; current version is {actual}"
    raised_by: "validations.order_version_current, concurrency_rules.mission-create-stale-order"

  - error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    message: "action {action} is not permitted from state {state}"
    raised_by: "validations.target_state_allows_action, validations.remedy_requires_latched_exception"

  - error_id: ERR_ZONE_NOT_PERMITTED
    http_status: 409
    message: "service zone permit state {state} does not allow operations"
    raised_by: "validations.zone_permitted_for_operations"

  - error_id: ERR_MERCHANT_NOT_ACTIVE
    http_status: 409
    message: "merchant integration state {state} does not allow new orders"
    raised_by: "validations.merchant_integration_active"

  - error_id: ERR_ROBOT_NOT_AVAILABLE
    http_status: 409
    message: "robot duty state {state} is not AVAILABLE"
    raised_by: "validations.robot_duty_available_for_dispatch"

  - error_id: ERR_ROBOT_HEALTH_BLOCKED
    http_status: 409
    message: "robot health state {state} blocks dispatch"
    raised_by: "validations.robot_health_allows_dispatch"

  - error_id: ERR_SEGMENT_NOT_APPROVED
    http_status: 409
    message: "segment {segment_id} is not APPROVED"
    raised_by: "validations.plan_segments_approved"

  - error_id: ERR_SEGMENT_BLOCKED
    http_status: 409
    message: "segment {segment_id} is BLOCKED by an active closure"
    raised_by: "validations.plan_segments_not_blocked"

  - error_id: ERR_MISSION_ALREADY_TERMINAL
    http_status: 409
    message: "mission is already in terminal state {state}"
    raised_by: "validations.mission_not_terminal"

  - error_id: ERR_RESERVATION_NOT_ACTIVE
    http_status: 409
    message: "bay reservation state {state} is not ACTIVE"
    raised_by: "validations.reservation_live_for_transition"

  - error_id: ERR_TAKEOVER_REQUIRED
    http_status: 409
    message: "an open remote takeover blocks this action"
    raised_by: "validations.no_open_takeover_at_handoff"

  - error_id: ERR_REMEDY_ALREADY_ISSUED
    http_status: 409
    message: "a remedy of kind {remedy_kind} was already issued for this order"
    raised_by: "validations.remedy_not_already_issued"

  - error_id: ERR_ZONE_ROBOT_CAP_EXCEEDED
    http_status: 409
    message: "zone already has {count} robots on mission, cap is {cap}"
    raised_by: "validations.zone_concurrent_robot_cap"

  - error_id: ERR_BAY_WINDOW_CONFLICT
    http_status: 409
    message: "requested bay window conflicts with reservation {reservation_id} once the turnaround buffer is applied"
    raised_by: "validations.bay_window_exclusive"

  - error_id: ERR_HARD_CLOSURE_OVERLAP
    http_status: 409
    message: "requested hard closure intersects closure {closure_id}"
    raised_by: "validations.hard_closure_window_exclusive"

  - error_id: ERR_MANDATORY_INCIDENT_UNFILED
    http_status: 409
    message: "robot still has an incident report in DRAFT"
    raised_by: "validations.quarantine_clear_requires_submitted_incident"

  - error_id: ERR_BAY_OUT_OF_SERVICE
    http_status: 409
    message: "depot bay is OUT_OF_SERVICE"
    raised_by: "validations.bay_in_service"

  - error_id: ERR_CLEARANCE_INSUFFICIENT
    http_status: 422
    message: "accessibility clearance margin {margin} cm is below the ordinance buffer"
    raised_by: "validations.route_clearance_sufficient, validations.segment_clearance_meets_ordinance"

  - error_id: ERR_CROSSING_RISK_EXCEEDED
    http_status: 422
    message: "crossing risk score {score} exceeds the zone ceiling {ceiling}"
    raised_by: "validations.crossing_risk_within_ceiling"

  - error_id: ERR_ORDINANCE_SPEED_EXCEEDED
    http_status: 422
    message: "robot max speed {speed} cm/s exceeds the zone ordinance limit {limit}"
    raised_by: "validations.robot_speed_within_ordinance"

  - error_id: ERR_CURFEW_WINDOW_VIOLATION
    http_status: 422
    message: "planned route would run outside the zone operating window"
    raised_by: "validations.route_within_operating_window"

  - error_id: ERR_ROUTE_NOT_CONTIGUOUS
    http_status: 422
    message: "segment {segment_id} is not adjacent to its predecessor in the sequence"
    raised_by: "validations.route_sequence_contiguous"

  - error_id: ERR_ROUTE_DROPOFF_MISMATCH
    http_status: 422
    message: "route does not terminate at the order dropoff segment"
    raised_by: "validations.route_terminates_at_dropoff"

  - error_id: ERR_ZONE_MISMATCH
    http_status: 422
    message: "referenced rows do not belong to the same service zone"
    raised_by: "validations.route_segments_share_mission_zone, order_dropoff_in_merchant_zone, mission_robot_shares_order_zone, reservation_bay_shares_robot_zone, adjacency_within_zone"

  - error_id: ERR_PAYLOAD_CAPACITY_EXCEEDED
    http_status: 422
    message: "payload {liters} L exceeds the container capacity {capacity} L"
    raised_by: "validations.payload_within_container_capacity"

  - error_id: ERR_LID_CODE_MISMATCH
    http_status: 422
    message: "lid access code does not match"
    raised_by: "validations.lid_access_code_matches"

  - error_id: ERR_NO_ELIGIBLE_ROBOT
    http_status: 422
    message: "no robot in the zone satisfies the dispatch eligibility filter"
    raised_by: "validations.eligible_robot_pool_non_empty"

  - error_id: ERR_BAY_TYPE_MISMATCH
    http_status: 422
    message: "reservation type {reservation_type} does not match bay type {bay_type}"
    raised_by: "validations.reservation_type_matches_bay_type"

  - error_id: ERR_REMEDY_BUDGET_EXCEEDED
    http_status: 402
    message: "remedy of {amount} cents exceeds the zone remaining budget of {remaining} cents"
    raised_by: "validations.remedy_within_zone_budget"

# =============================================================================
# 1.7 RBAC
# =============================================================================

roles:

  - role: PlatformAdmin
    identity: opaque
    description: >-
      Municipal-compliance and configuration authority. Owns the mapping and permitting surface: zones,
      sidewalk segments, closures, merchants, depot bays and robot registration. Also the only role
      that may reject a MINOR incident report.
    exclusive_operations:
      - "POST /service-zones and POST /service-zones/{zone_id}/permit-transitions"
      - "POST /sidewalk-segments and POST /sidewalk-segments/{segment_id}/transitions"
      - "POST /segment-closures and POST /segment-closures/{closure_id}/transitions"
      - "POST /merchants and POST /merchants/{merchant_id}/integration-transitions"
      - "POST /robots and POST /depot-bays"
      - "POST /incident-reports/{report_id}/transitions with action REJECT"
    shared_operations:
      - "every GET endpoint"
      - "POST /delivery-orders, POST /delivery-orders/{order_id}/cancel and POST /delivery-missions/{mission_id}/load on behalf of any merchant, without the ownership restriction"
      - "POST /_clock/set_current_utc"

  - role: FleetDispatcher
    identity: opaque
    description: >-
      Runs the fleet. Owns dispatch, route planning, depot reservations and the duty dimension of every
      robot. May not touch the health dimension, may not file or progress incident reports and may not
      issue customer remedies.
    exclusive_operations:
      - "POST /delivery-missions"
      - "POST /route-plans and POST /route-plans/{plan_id}/transitions"
      - "POST /bay-reservations and POST /bay-reservations/{reservation_id}/transitions"
      - "POST /robots/{robot_id}/duty-transitions"
      - "POST /delivery-missions/{mission_id}/transitions with actions DEPART, ARRIVE, COMPLETE and ABORT"
      - "GET /service-zones/{zone_id}/economics"
    shared_operations:
      - "every GET endpoint except the merchant-owned filtering behaviour"
      - "POST /robots/{robot_id}/telemetry"
      - "POST /intervention-events, and POST /intervention-events/{event_id}/transitions with action RELEASE on a non-mandatory REQUESTED event"
      - "POST /_clock/set_current_utc"

  - role: RemoteOperator
    identity: opaque
    description: >-
      Sits in the teleoperation seat. Owns the takeover procedure and the two mission actions that
      belong to it, plus incident drafting. Cannot dispatch, cannot plan routes and cannot approve its
      own incident submissions.
    exclusive_operations:
      - "POST /delivery-missions/{mission_id}/transitions with actions REPORT_BLOCKAGE and RESUME"
      - "POST /intervention-events/{event_id}/transitions with actions ACKNOWLEDGE, ASSUME and ESCALATE"
    shared_operations:
      - "POST /intervention-events"
      - "POST /intervention-events/{event_id}/transitions with action RELEASE, restricted to the operator that assumed control"
      - "POST /incident-reports"
      - "POST /robots/{robot_id}/telemetry"
      - "the fleet, mission, route and incident GET endpoints"
      - "POST /_clock/set_current_utc"

  - role: SafetyOfficer
    identity: opaque
    description: >-
      Owns robot health and the municipal reporting workflow. The segregation-of-duties pivot: a
      SafetyOfficer may file an incident draft and a SafetyOfficer may submit it, but never the same
      user id for the same report.
    exclusive_operations:
      - "POST /robots/{robot_id}/health-transitions"
      - "POST /incident-reports/{report_id}/transitions with actions SUBMIT_MUNICIPAL, NOTIFY_INSURER, CLOSE and RETURN_FOR_DETAIL"
      - "POST /intervention-events/{event_id}/transitions with action DEESCALATE"
    shared_operations:
      - "POST /incident-reports"
      - "POST /intervention-events/{event_id}/transitions with action RELEASE out of ESCALATED"
      - "the zone, segment, closure, fleet, mission and incident GET endpoints"
      - "POST /_clock/set_current_utc"

  - role: CustomerSupport
    identity: opaque
    description: >-
      Faces the customer after a failed delivery. The only role that may spend the zone remedy budget,
      and it may do nothing else that mutates state.
    exclusive_operations:
      - "POST /delivery-orders/{order_id}/remedy"
    shared_operations:
      - "GET /service-zones, GET /service-zones/{zone_id}, GET /merchants, GET /merchants/{merchant_id}, GET /delivery-orders, GET /delivery-orders/{order_id}, GET /incident-reports, GET /incident-reports/{report_id}"
      - "POST /_clock/set_current_utc"

  - role: MerchantOperator
    identity: entity_backed:Merchant
    description: >-
      A merchant's own staff, identified by X-User-ID equal to the Merchant row id. Creates and cancels
      its own orders and performs the physical handoff. Every read and write is scoped to its own
      merchant; touching another merchant's order is ERR_NOT_RESOURCE_OWNER.
    exclusive_operations: []
    shared_operations:
      - "POST /delivery-orders and POST /delivery-orders/{order_id}/cancel, restricted to its own merchant_id"
      - "POST /delivery-missions/{mission_id}/load, restricted to missions of its own orders"
      - "GET /merchants, GET /merchants/{merchant_id}, GET /delivery-orders, GET /delivery-orders/{order_id}, GET /delivery-missions, GET /delivery-missions/{mission_id}, all scoped to its own rows"
      - "POST /_clock/set_current_utc"
