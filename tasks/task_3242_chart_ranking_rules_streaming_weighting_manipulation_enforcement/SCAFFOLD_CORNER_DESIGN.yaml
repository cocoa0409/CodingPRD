      - name: week_not_closed_error_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_WEEK_NOT_CLOSED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_chart_beats_week_not_closed
          rationale: "ERR_WEEK_NOT_CLOSED is the suppressed lower-priority error in the named §1.8 instance and is separately asserted by corner instance week_lock_before_close_rejected."

      - name: no_active_methodology_error_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_NO_ACTIVE_METHODOLOGY]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / chart_week_branching_invalidation_loop
          rationale: "The compute/methodology gating path is exercised by the named §1.8 instance; the no-active-methodology rejection is separately asserted by corner instance compute_without_active_methodology_rejected."

      - name: reclassification_target_mismatch_error_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_RECLASSIFICATION_TARGET_MISMATCH]"]
        excluded_because:
