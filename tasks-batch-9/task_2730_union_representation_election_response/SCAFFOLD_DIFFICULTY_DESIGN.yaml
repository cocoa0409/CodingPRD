              payload: { reconsideration_note: "Reopened to re-examine the production group description" }
              as: BoardAgent
          assert:
            - "before the trigger: Petition.${pet_id}.total_classified_headcount == 110, included_headcount == 0, excluded_headcount == 0, pending_headcount == 110"
            - "after call 1: included 60, excluded 0, pending 50 (sum 110)"
            - "after call 2: included 60, excluded 12, pending 38 (sum 110)"
            - "after call 3: included 60, excluded 0, pending 50 (sum 110) and Classification.${cls_qc_id}.scope_ruling == PENDING"
            - "after call 4: included 72, excluded 0, pending 38 (sum 110)"
            - "after call 5: included 12, excluded 0, pending 98 (sum 110) and Classification.${cls_prod_id}.scope_ruling == PENDING"
            - "included_headcount + excluded_headcount + pending_headcount == 110 after every single call, never transiently otherwise"
            - "Classification.${cls_qc_id}.coi_score is unchanged by the reconsideration (only the ruling is reversed, never the score)"
            - "Petition.${pet_id}.version increments by exactly 1 per trigger call"
            - "no call returns 409 ERR_HEADCOUNT_CONSERVATION_VIOLATION"

      - name: ballot_conservation_across_resolve_and_reopen
        grounds:
          - invariants.ballot_conservation
          - validations[priority=27]
          - errors.ERR_BALLOT_CONSERVATION_VIOLATION
          - endpoints.POST_challenged_ballots_id_reopen
          - constants.MAX_BALLOT_REOPENS
        conserved_quantity: "physical ballots cast in the round (85 ballots across nine buckets)"
        compensating_action: "POST /labor-relations/challenged-ballots/{id}/reopen returns a resolved ballot to the OPEN bucket and reverses the exact bucket movement, incrementing reopen_count"
        distinguishing_aspect: |
          A different conserved quantity with a nine-bucket partition on the ElectionRound rather than
          a three-bucket partition on the Petition, and the compensating action is bidirectional: a
          ballot can be resolved into one bucket, reopened, and resolved into a DIFFERENT bucket. The
          withdrawn bucket is the interesting one, because it stays inside ballots_cast_total forever
          while never entering any vote column.
        test_recipe:
          setup:
            - "a closed election with one poll session closed at 42 for / 39 against / 1 void and 3 challenged ballots OPEN"
            - "provisional tally posted, so ballots_cast_total is 85 and challenged_open_count is 3"
            - "challenger parties: ballot 1 EMPLOYER, ballot 2 UNION, ballot 3 EMPLOYER"
          setup_api_calls:
