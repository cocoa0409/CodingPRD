  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: work_order_cancel_restores_glass_lot_blank_conservation
        grounds:
          - calculations.blank_conservation_ledger
          - state_machines.WorkOrder.BLANKS_RESERVED_to_CANCELLED
          - entities.GlassLot.fields.available_blank_count
          - entities.GlassLot.fields.reserved_blank_count
          - entities.ProcessRun.fields.cancel_reason
        distinguishing_aspect: |
          Cancelling a four-element order reverses every ledger move it made: reserved_blank_count falls 5
          -> 0 and available_blank_count rises 15 -> 20, consumed and scrapped stay 0, so the
          total_blank_count invariant 20 == 20 + 0 + 0 + 0 is restored exactly, the lot stays RELEASED
          rather than sliding to DEPLETED, and the order's open run is cancelled with cancel_reason
          WORK_ORDER_CANCELLED while the instrument's booked minutes return to 0.
        test_recipe:
          setup:
            - "A RELEASED design, a certified lot with total_blank_count 20, and a WorkOrder with element_count 4 (spare_blank_count 1, reserved_blank_count 5), so the lot sits at reserved 5 / available 15."
            - "One SCHEDULED 120-minute polishing run books 120 minutes on IF-2540-1."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 4, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0 }
              as: PlantAdmin
              captures: { i1: $.data.id }
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T08:00:00Z", metrology_window_end_utc: "2026-08-01T10:00:00Z" }
              as: ProcessTechnician
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /optics/work-orders/${w1}/cancel"
              payload: { cancel_reason: "CUSTOMER_ORDER_WITHDRAWN" }
              as: ProcessTechnician
          assert:
            - "the trigger returns HTTP 200"
            - "WorkOrder.${w1}.spare_blank_count == 1"
            - "WorkOrder.${w1}.reserved_blank_count == 5"
            - "WorkOrder.${w1}.process_status == CANCELLED"
            - "WorkOrder.${w1}.cancel_reason == CUSTOMER_ORDER_WITHDRAWN"
            - "GlassLot.${g1}.reserved_blank_count == 0"
            - "GlassLot.${g1}.available_blank_count == 20"
            - "GlassLot.${g1}.consumed_blank_count == 0"
            - "GlassLot.${g1}.scrapped_blank_count == 0"
            - "GlassLot.${g1}.lot_status == RELEASED"
            - "ProcessRun.${r1}.run_status == CANCELLED"
            - "ProcessRun.${r1}.cancel_reason == WORK_ORDER_CANCELLED"
            - "MetrologyInstrument.${i1}.booked_minutes_total == 0"

      - name: process_run_cancel_restores_instrument_booked_minutes_and_frees_the_window
        grounds:
          - calculations.instrument_minutes_ledger
          - state_machines.ProcessRun.SCHEDULED_to_CANCELLED
          - entities.MetrologyInstrument.fields.booked_minutes_total
          - validations.priority_19
          - calculations.blank_conservation_ledger
        distinguishing_aspect: |
          Cancelling a run reverses exactly one conserved quantity and nothing else: booked_minutes_total
          falls 120 -> 0 while the WorkOrder stays BLANKS_RESERVED and the lot's reserved_blank_count
          stays 3; because the cancelled run also leaves the conflict scan, re-booking the byte-identical
          window succeeds and lifts booked_minutes_total back to exactly 120 — no residue, no double
          count.
        test_recipe:
          setup:
            - "A RELEASED design, a certified 20-blank lot, a WorkOrder with element_count 2 (reserved 3, available 17), and one SCHEDULED 08:00-10:00 polishing run booking 120 minutes on IF-2540-1."
