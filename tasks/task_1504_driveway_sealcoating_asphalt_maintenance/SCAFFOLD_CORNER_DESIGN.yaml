  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_quote_create_stale_property_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[quote-create-stale-property]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second quote create carrying the pre-first-create Property.version is rejected 412 ERR_STALE_VERSION; with the fresh version it succeeds and supersedes the first quote."
        test_recipe:
          setup: ["Property at version 2 after submit; quote1 created (version advances); stale writer replays version 2"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Dana Homeowner", customer_type: "RESIDENTIAL", email: "dana@example.com", phone: "555-9001" }, as: OfficeAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "1 Elm St", lot_kind: "RESIDENTIAL_DRIVEWAY" }, as: OfficeAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${p_id}", measured_area_sqft: 900, crack_linear_ft: 10, pothole_count: 1, pothole_area_sqft: 2, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { a_id: "$.data.id" } }
            - { call: "POST /api/assessments/${a_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Standard", grade: "STANDARD", coverage_sqft_per_gallon: 80, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 24, warranty_months: 12, price_per_gallon_cents: 900 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "GET /api/properties/${p_id}", payload: {}, as: OfficeAdmin, captures: { p_v_stale: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${p_id}", assessment_id: "${a_id}", material_id: "${mat_id}", include_crack_fill: true, include_patch: true, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${p_v_stale}" }, as: Estimator, captures: { q1: "$.data.id" } }
          trigger:
            - { call: "POST /api/quotes", payload: { property_id: "${p_id}", assessment_id: "${a_id}", material_id: "${mat_id}", include_crack_fill: false, include_patch: false, include_seal: true, include_striping: false, coats: 2, expected_property_version: "${p_v_stale}" }, as: Estimator, captures: { err: "$.data.error_id" } }
            - { call: "GET /api/properties/${p_id}", payload: {}, as: OfficeAdmin, captures: { p_v_fresh: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${p_id}", assessment_id: "${a_id}", material_id: "${mat_id}", include_crack_fill: false, include_patch: false, include_seal: true, include_striping: false, coats: 2, expected_property_version: "${p_v_fresh}" }, as: Estimator, captures: { q2: "$.data.id" } }
            - { call: "GET /api/quotes/${q1}", payload: {}, as: Estimator, captures: { q1_status: "$.data.status" } }
          assert:
            - "Stale replay: http 412, error_id == ERR_STALE_VERSION; no quote created"
            - "Fresh version: 201, quote2 created; quote1 status == SUPERSEDED; Property.open_quote_id == quote2"

