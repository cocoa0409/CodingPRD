          - state_machines.Loan.ACTIVE_to_REPAID
          - state_machines.LoanOffer.initial_state
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by sweep posting: sweep APPLIED
          mutates Loan (hop 1); Loan reaching remaining 0 transitions REPAID
          and mutates Merchant (hop 2: active_loan_id cleared,
          loans_repaid_count incremented); Merchant eligibility refresh
          auto-creates a renewal LoanOffer in DRAFT (hop 3). Each hop is caused
          by the previous mutation, not by the original sweep request.
