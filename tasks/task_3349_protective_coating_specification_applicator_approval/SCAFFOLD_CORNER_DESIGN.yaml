  # ===========================================================================
  - section: errors
    instances:
      - name: review_round_exhausted_triggerable
        claim_type: violation_to_error
        grounds:
          - "state_machines.SubstitutionRequest.transitions.UNDER_REVIEW_to_MORE_INFO_REQUESTED"
          - "errors[ERR_REVIEW_ROUND_EXHAUSTED]"
        distinguishing_aspect: "With max_review_rounds=1, the substitution request begins at review_round=1; the first request-info from UNDER_REVIEW would push it past the limit and is rejected 422 ERR_REVIEW_ROUND_EXHAUSTED — the error catalog entry is triggerable, not dead."
        test_recipe:
          setup:
            - "clock; regulation; incumbent + competitor systems; project; spec ISSUED (incumbent); substitution request created with max_review_rounds=1, moved to UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-CA-SCAQMD", application_method: "SPRAY_AIRLESS", voc_limit_gpl: 340, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-RRE-INC", manufacturer_name: "SW", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, max_thinner_pct: 0.10, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
              captures:
                inc_id: $.data.id
            - call: "POST /coating/coating-systems"
              payload: { system_code: "COMP-RRE", manufacturer_name: "Competitor", is_competitor_system: true, surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, max_thinner_pct: 0.10, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
              captures:
                comp_id: $.data.id
            - call: "POST /coating/projects"
              payload: { project_name: "Round Exhaust", owner_name: "Owner", jurisdiction_code: "US-CA-SCAQMD", asset_type: "BRIDGE", warranty_budget_cents: 50000000 }
              as: ProjectEngineer
              captures:
                proj_id: $.data.id
                proj_v: $.data.version
            - call: "POST /coating/projects/${proj_id}/specifications"
              payload: { coating_system_id: "${inc_id}", application_method: "SPRAY_AIRLESS" }
              as: ProjectEngineer
              captures:
                spec_id: $.data.id
            - call: "POST /coating/projects/${proj_id}/specifications/${spec_id}/issue"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectEngineer
            - call: "POST /coating/specifications/${spec_id}/substitution-requests"
              payload: { proposed_coating_system_id: "${comp_id}", rationale: "cheaper", max_review_rounds: 1 }
              as: OwnerRepresentative
              captures:
                sub_id: $.data.id
            - call: "POST /coating/specifications/${spec_id}/substitution-requests/${sub_id}/start-review"
              payload: {}
              as: TechnicalServiceEngineer
          trigger:
            - call: "POST /coating/specifications/${spec_id}/substitution-requests/${sub_id}/request-info"
              payload: {}
              as: TechnicalServiceEngineer
          assert:
            - "HTTP 422 with error_id ERR_REVIEW_ROUND_EXHAUSTED (review_round 1 not < max_review_rounds 1)"
            - "SubstitutionRequest.${sub_id}.status remains 'UNDER_REVIEW'"

