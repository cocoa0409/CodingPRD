      - name: corrective_action_windows_closed_interval_aggregate_rig_capacity
        grounds:
          - validations[priority=81]
          - errors[ERR_CA_RIG_CAPACITY_EXCEEDED]
          - state_machines.LegacyWellbore.CA_REQUIRED_to_CA_SCHEDULED
          - entities.StorageProject.fields.ca_rig_slots
          - entities.LegacyWellbore.fields.ca_window_start
          - entities.LegacyWellbore.fields.ca_window_end
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: corrective-action windows are
          *closed* intervals [ca_window_start, ca_window_end] competing for an aggregate capacity of
          project.ca_rig_slots = 2 rigs, so a shared endpoint counts as an intersection (one overlap is
          still admitted) and the third overlapping window is refused with ERR_CA_RIG_CAPACITY_EXCEEDED
          (409) even though it never overlaps any single window by more than a day.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status PERMITTING with ca_rig_slots 2 and aor_radius_km 3.0"
            - "one ACCEPTED GeologicModel with plume_status AOR_FINALIZED"
            - "three LegacyWellbore rows all in corrective_action_status CA_REQUIRED: W1 risk 90.00, W2 risk 47.60, W5 risk 9.00 but penetrating the seal"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
