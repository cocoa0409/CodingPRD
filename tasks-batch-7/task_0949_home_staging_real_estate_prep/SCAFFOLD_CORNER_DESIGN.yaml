      - name: consultation_submit_scope_twice_rejected_as_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.Consultation.SCOPE_DRAFTED_to_SCOPE_SUBMITTED", "validations[priority=18]", "errors[ERR_CONSULTATION_INVALID_STATE]"]
        distinguishing_aspect: "The second submit-scope observes state SCOPE_SUBMITTED, which is not a legal from-state, and returns ERR_CONSULTATION_INVALID_STATE (409) without bumping revision_count."
        test_recipe:
          setup: ["A HELD VACANT consultation with two scope items, already submitted once."]
          setup_api_calls: *cons_two_items
          trigger:
            - call: "POST /staging/consultations/${cons_id}/submit-scope"
              payload: { recommended_tier_code: "SIGNATURE" }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/submit-scope"
              payload: { recommended_tier_code: "LUXE" }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_CONSULTATION_INVALID_STATE"
            - "Consultation.${cons_id}.state == SCOPE_SUBMITTED"
            - "Consultation.${cons_id}.recommended_tier_code == SIGNATURE"
            - "Consultation.${cons_id}.revision_count == 0"

      - name: edit_scope_action_rejected_on_a_vacant_pipeline_consultation
        claim_type: guarded transitions
        grounds: ["validations[priority=20]", "errors[ERR_PIPELINE_MISMATCH]", "entities.ScopeItem.fields.action"]
        distinguishing_aspect: "EDIT is an OCCUPIED_PREP-only action, so adding it to a VACANT_STAGING consultation returns ERR_PIPELINE_MISMATCH (409) and leaves scoped_room_count at 2."
        test_recipe:
          setup: ["A HELD consultation on a VACANT property carrying two PACKAGE_ROOM rooms."]
          setup_api_calls: *cons_two_items
          trigger:
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Den", action: "EDIT", estimated_hours: 3.0, accessory_set_count: 0 }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_PIPELINE_MISMATCH"
            - "Consultation.${cons_id}.scoped_room_count == 2"

      - name: cancelled_consultation_is_terminal_and_blocks_scope_writes
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Consultation.SCHEDULED_to_CANCELLED", "validations[priority=17]", "errors[ERR_CONSULTATION_INVALID_STATE]"]
        distinguishing_aspect: "Once CANCELLED, the consultation is frozen by G5 rung 17: a further scope-item write returns ERR_CONSULTATION_INVALID_STATE (409) and the property falls back to prep_state NEW."
        test_recipe:
          setup: ["A HELD VACANT consultation with two scope items."]
          setup_api_calls: *cons_two_items
          trigger:
            - call: "POST /staging/consultations/${cons_id}/cancel"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Den", action: "PACKAGE_ROOM", requires_rental: true, accessory_set_count: 0 }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_CONSULTATION_INVALID_STATE"
            - "Consultation.${cons_id}.state == CANCELLED"
            - "Property.${prop_id}.prep_state == NEW"

