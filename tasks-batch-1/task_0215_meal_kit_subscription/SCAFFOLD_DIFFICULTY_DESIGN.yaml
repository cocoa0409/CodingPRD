              captures: { pws: $.data.id }
            - call: "POST /subscriptions/${pws}/pause"
              payload: { resume_date: "2026-07-20T00:00:00.000Z" }
              as: Member
              as_user_id: "${pwm}"
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-21T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${pws}/resume"
