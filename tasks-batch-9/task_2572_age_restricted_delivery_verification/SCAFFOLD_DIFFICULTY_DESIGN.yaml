    instances:
      - name: order_dispatch_depends_on_delivery_partner_posture
        grounds:
          - state_machines.Order.fulfillment_state.SUBMITTED_to_DISPATCHED
          - state_machines.DeliveryPartner.posture.OPEN_to_SUSPENDED
          - validations[priority=52]
          - errors.ERR_PARTNER_SUSPENDED
          - calculations.partner_posture_derivation
