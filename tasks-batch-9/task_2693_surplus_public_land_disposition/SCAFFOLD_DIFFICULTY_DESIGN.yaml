            - call: "GET /notices"
              payload: { declaration_id: "${decl_id}" }
              as: RealPropertyOfficer
              captures: { notice_id: "$.data[0].id" }
            - call: "POST /notices/${notice_id}/respond"
              payload: { response_type: "EXPRESS_INTEREST", claimed_preference_category: "AFFORDABLE_HOUSING", intended_use: "62 units of deed-restricted affordable housing" }
              as: AgencyRepresentative
              as_user_id: "${pref_agency_id}"
            - call: "GET /preference-offers"
              payload: { declaration_id: "${decl_id}" }
              as: RealPropertyOfficer
              captures: { offer_id: "$.data[0].id" }
            - call: "POST /preference-offers/${offer_id}/rounds"
              payload: { party: "CUSTODIAN_AGENCY", price_offered_cents: 80000000, terms_summary: "Opening position at appraised value less curative." }
              as: RealPropertyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: RealPropertyOfficer
            - call: "POST /preference-offers/${offer_id}/rounds"
              payload: { party: "PREFERENCE_ENTITY", price_offered_cents: 60000000, terms_summary: "Counter citing the statutory write-down.", responded_to_round_number: 1 }
              as: AgencyRepresentative
              as_user_id: "${pref_agency_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: RealPropertyOfficer
            - call: "POST /preference-offers/${offer_id}/rounds"
              payload: { party: "CUSTODIAN_AGENCY", price_offered_cents: 70000000, terms_summary: "Second agency position.", responded_to_round_number: 2 }
              as: RealPropertyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: RealPropertyOfficer
            - call: "POST /preference-offers/${offer_id}/rounds"
              payload: { party: "PREFERENCE_ENTITY", price_offered_cents: 62000000, terms_summary: "Counter at 62,000,000.", responded_to_round_number: 3 }
              as: AgencyRepresentative
              as_user_id: "${pref_agency_id}"
            - call: "POST /_clock/set_current_utc"
