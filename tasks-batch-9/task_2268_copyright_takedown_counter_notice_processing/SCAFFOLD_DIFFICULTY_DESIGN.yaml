            - "RightsHolder.${rh_id}.enrollment_status == PROSPECT (a rejection never suspends by itself)"

      - name: process_notice_with_zero_resolvable_urls_yields_no_actionable_claims
        grounds:
          - validations.priority_17_ERR_NO_ACTIONABLE_CLAIMS
          - endpoints.POST_/dmca/notices/{id}/process
          - entities.TakedownNotice.fields.matched_claim_count
          - state_machines.TakedownNotice.VALIDATED_to_PROCESSED
        distinguishing_aspect: |
          The empty-set boundary of the actionable-claim rule: a VALIDATED notice
          whose single claimed URL resolves to nothing must return 422
          ERR_NO_ACTIONABLE_CLAIMS and leave the notice in VALIDATED with zero
          claims, zero notifications and RightsHolder.notices_processed still 0 —
          it must not become PROCESSED with matched_claim_count 0.
        test_recipe:
          setup:
            - "Provider fully documented with a PUBLISHED policy; clock at 2026-08-01T00:00:00Z."
            - "Account with exactly one AVAILABLE ContentItem at https://northstar.example/v/1."
            - "One VALIDATED notice whose only claimed URL is https://northstar.example/v/absent, which belongs to no ContentItem."
