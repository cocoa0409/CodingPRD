              payload: { instrument_type: "CASH_COLLATERAL", purpose: "PERFORMANCE_SECURITY", face_amount_usd: 500000.00, effective_date: "2026-08-01T00:00:00Z", expiry_date: "2026-08-15T00:00:00Z" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { ci_cash: $.data.id }
            - call: "POST /ppa/deals/${deal_id}/credit-support"
              payload: { instrument_type: "LETTER_OF_CREDIT", purpose: "PERFORMANCE_SECURITY", face_amount_usd: 1000000.00, effective_date: "2026-08-01T00:00:00Z", expiry_date: "2029-08-01T00:00:00Z", issuer_name: "Cascade First Bank", issuer_rating: "BBB" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { ci_bbb: $.data.id }
            - call: "GET /ppa/deals/${deal_id}"
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { deal_v2: $.data.version }
          trigger:
            - call: "POST /ppa/credit-support/${ci_ccc}/post"
              payload: { expected_deal_version: "${deal_v2}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/credit-support/${ci_pg}/post"
              payload: { expected_deal_version: "${deal_v2}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/credit-support/${ci_cash}/post"
              payload: { expected_deal_version: "${deal_v2}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "GET /ppa/deals/${deal_id}"
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { deal_v3: $.data.version }
            - call: "POST /ppa/credit-support/${ci_bbb}/post"
              payload: { expected_deal_version: "${deal_v3}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
          assert:
            - "all four creations returned 201 with status PROPOSED, haircut_pct null and eligible_credit_usd null - a CCC rating is perfectly storable, so nothing is refused at creation time"
            - "the first trigger returns 422 with error_id ERR_INELIGIBLE_ISSUER, NOT ERR_INSTRUMENT_TENOR_TOO_SHORT, even though the instrument also expires only 14 days after the clock: eligibility at priority 20 is decided before tenor at priority 21"
            - "the second trigger returns 422 ERR_INELIGIBLE_ISSUER as well: Puget is a AA-rated offtaker but the anchor's parent_guarantor_offtaker_id is null, so the identity limb of the guarantee test can never match"
            - "after both refusals CreditSupportInstrument.${ci_ccc} and ${ci_pg} are still PROPOSED with posted_at null, Deal.${deal_id}.posted_credit_support_usd is 0.00 and the deal version is still ${deal_v2} - a refused post does not consume the OCC token"
            - "the third trigger returns 200 at the same expected_deal_version: the cash instrument posts with haircut_pct 0.00 and eligible_credit_usd 500000.00 even though it expires in 14 days, because CASH_COLLATERAL consults neither the issuer table nor the tenor floor"
            - "Deal.${deal_id}.posted_credit_support_usd is then 500000.00 and the deal version has advanced by one, which is why the BBB post must re-read it"
            - "the fifth trigger returns 200 with haircut_pct 10.00 and eligible_credit_usd 900000.00 = round(1000000.00 * (1 - 10.00 / 100), 2): BBB is a table row, so it is eligible with a discount rather than ineligible"
            - "Deal.${deal_id}.posted_credit_support_usd is finally 1400000.00 = 500000.00 + 900000.00, and credit_status stays APPROVED because the requirement was already 0.00"

      # ---------------------------------------------------------------------
      # excluded_because stubs: error codes whose corner is already the whole
      # point of a §1.8 difficulty instance. Restating them here would produce
      # a duplicate test, so each records its owner instead.
      # ---------------------------------------------------------------------
      - name: meter_interval_slot_guards_reject_a_foreign_hour_and_a_repeat_hour
        claim_type: violation_to_error
        grounds:
          - errors[ERR_HOUR_OUTSIDE_PERIOD]
          - errors[ERR_DUPLICATE_METER_HOUR]
          - validations.priority_24_ERR_HOUR_OUTSIDE_PERIOD
          - validations.priority_25_ERR_DUPLICATE_METER_HOUR
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / meter_interval_hour_slot_duplicate_versus_abutting_hour_and_period_boundary"
          rationale: |
            Both error codes ARE the difficulty instance: it posts the same hour twice to
            get ERR_DUPLICATE_METER_HOUR, posts the abutting hour to show it is accepted,
            and posts the instant that equals period_end to get ERR_HOUR_OUTSIDE_PERIOD
            under half-open semantics - plus the off-the-hour case. A separate corner
            instance here would re-walk the identical boundary set with the same fixture.

      - name: releasing_posted_support_below_the_requirement_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RELEASE_BREACHES_COVERAGE]
          - validations.priority_33_ERR_RELEASE_BREACHES_COVERAGE
          - endpoints.POST_/ppa/credit-support/{id}/release
        excluded_because:
          difficulty_instance: "compensating_invariant / credit_support_usd_conserved_across_post_and_release"
          rationale: |
            The conservation instance already drives posted_credit_support_usd to the
            exact requirement and then attempts the release that would breach it,
            asserting both the 422 and that posted + released + drawn is unchanged by the
            refusal. The error code has no corner left that is not that invariant.

      - name: minting_more_than_the_period_can_support_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ATTRIBUTE_QUANTITY_EXCEEDS_MINTABLE]
          - validations.priority_34_ERR_ATTRIBUTE_QUANTITY_EXCEEDS_MINTABLE
          - calculations.mintable_attributes
        excluded_because:
          difficulty_instance: "compensating_invariant / attribute_mwh_conserved_across_transfer_and_cancel_transfer"
          rationale: |
            That instance mints the full mintable volume, then asks for one more MWh from
            the same period to prove the headroom is mintable-minus-already-minted rather
            than mintable alone, and finally shows a cancel-transfer restores transferred
            volume without restoring mintable headroom. Re-testing the ceiling here would
            duplicate its arithmetic.

      - name: invoicing_a_period_under_a_live_risk_claim_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPEN_RISK_CLAIM]
          - validations.priority_14_ERR_OPEN_RISK_CLAIM
          - endpoints.POST_/ppa/settlement-periods/{id}/advance
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / invoice_blocked_by_claimed_risk_event_over_the_period_window"
          rationale: |
            The dependency instance is precisely this refusal plus the two adjacent
            negatives that give it meaning - a CLAIMED event OUTSIDE the period window
            does not block, and the same event once REJECTED stops blocking - so an
            errors-section restatement would test strictly less.

  # =========================================================================
  # Guide section 7: RBAC. complexity_profile.role_model is
  # segregation_of_duties, so the "Segregation of duties" row of the guide's
  # role-model table is the applicable one. The approval_chain, peer_roles,
  # hierarchical_override and delegated_authority rows are skipped: §1.6
  # declares no ranked approval ladder, no per-role resource partition, no
  # role hierarchy and no delegation grant surface.
  # =========================================================================
  - section: rbac
    instances:
      - name: missing_headers_return_unauthenticated_before_the_role_gate_or_the_body_check
        claim_type: cross_role_denial
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - validations.priority_3_ERR_INVALID_REQUEST
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - endpoints.POST_/ppa/pricing-nodes
          - endpoints.GET_/ppa/deals/{id}
        distinguishing_aspect: |
          The auth ladder is walked with ONE request body that is malformed throughout, so
          each rung is observable in isolation: no headers returns 401 even though the body
          is also invalid and the path id does not exist; the wrong role returns 403 rather
          than the 400 the body deserves; the right role finally reaches the body check and
          returns 400; and only a valid body returns 201. The 401-before-404 ordering is
          asserted on a genuinely absent deal id, which is the one place where an
          implementation that resolves the path first would be caught.
        test_recipe:
          setup:
            - "An empty database except for one pricing node, so that the deal id used below is genuinely absent."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
          trigger:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "MIDWAY 2N", iso: "CAISO", settlement_point_type: "TRANSFORMER" }
              as: "(omitted - no X-User-Role header is sent)"
              as_user_id: "(omitted - no X-User-ID header is sent)"
            - call: "GET /ppa/deals/00000000-0000-0000-0000-000000000000"
              as: "(omitted - no X-User-Role header is sent)"
              as_user_id: "(omitted - no X-User-ID header is sent)"
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "MIDWAY 2N", iso: "CAISO", settlement_point_type: "TRANSFORMER" }
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "MIDWAY 2N", iso: "CAISO", settlement_point_type: "TRANSFORMER" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "MIDWAY 2N", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "the first trigger returns 401 with error_id ERR_UNAUTHENTICATED even though settlement_point_type TRANSFORMER is not a member of the declared enum - priority 1 precedes priority 3"
            - "the second trigger returns 401 ERR_UNAUTHENTICATED, NOT 404: the headers are checked before the path id is resolved, so a missing header on a request for a non-existent deal never reveals its absence"
            - "the third trigger returns 403 with error_id ERR_ROLE_NOT_PERMITTED, not 400: POST /ppa/pricing-nodes declares roles [Originator], and the role gate at priority 2 precedes request-shape parsing at priority 3"
            - "the fourth trigger returns 400 with error_id ERR_INVALID_REQUEST - the same body, now under a permitted role, finally reaches the enum check"
            - "the fifth trigger returns 201 with settlement_point_type HUB, and GET /ppa/pricing-nodes then reports total_count 2, proving none of the four refused calls persisted anything"

      - name: each_of_the_six_roles_runs_its_own_exclusive_operations_across_one_lifecycle
        claim_type: role_permitted_operations
        grounds:
          - endpoints.POST_/ppa/deals/{id}/settlement-periods
          - endpoints.POST_/ppa/settlement-periods/{id}/intervals
          - endpoints.POST_/ppa/settlement-periods/{id}/calculate
          - endpoints.POST_/ppa/settlement-periods/{id}/mint-attributes
          - endpoints.POST_/ppa/settlement-periods/{id}/advance
          - endpoints.POST_/ppa/deals/{id}/execute
          - endpoints.POST_/ppa/deals/{id}/credit-decision
        distinguishing_aspect: |
          One deal is carried from empty DB to a disputed invoice using SIX different
          X-User-Role values, each doing only what §1.6 declares as its own: Originator
          originates, CreditOfficer decides credit, DealCommittee signs, SettlementAnalyst
          meters and invoices, RegistryAgent mints, OfftakerRep confirms and disputes. The
          sharpest part is POST /ppa/settlement-periods/{id}/advance, whose role list holds
          TWO roles but whose actions are partitioned by role - INVOICE and SETTLE are
          SettlementAnalyst-only and DISPUTE is OfftakerRep-only - so passing the role gate
          is not the same as being allowed the action.
        test_recipe:
          setup:
            - "An EFFECTIVE 25.000 MW HOURLY deal reached with each step performed by the role §1.6 assigns it: Originator created the node, the offtaker, the OPERATIONAL project, the deal, the round and the allocation; CreditOfficer qualified the buyer and approved credit; OfftakerRep confirmed the allocation and accepted the round; DealCommittee executed."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2026-07-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "PERMITTED", evidence_ref: "CUP-2025-0088" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "INTERCONNECTION_APPROVED", evidence_ref: "LGIA-2025-0177" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "NOTICE_TO_PROCEED", evidence_ref: "NTP-2026-0004" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "OPERATIONAL", evidence_ref: "COD-CERT-2026-0004" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${node_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_id: $.data.id }
            - call: "POST /ppa/deals/${deal_id}/rounds"
              payload: { proposed_by: "DEVELOPER", proposed_fixed_price_usd_per_mwh: 22.00, proposed_escalation_pct_per_year: 0.0, proposed_shape_product: "AS_GENERATED", proposed_basis_responsibility: "SHARED", response_deadline: "2026-09-01T00:00:00Z" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { round_1: $.data.id }
            - call: "GET /ppa/deals/${deal_id}"
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_v1: $.data.version }
            - call: "POST /ppa/deals/${deal_id}/allocations"
              payload: { offtaker_id: "${buyer_id}", allocated_mw: 25.000, expected_deal_version: "${deal_v1}", joint_and_several: true }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { alloc_id: $.data.id }
            - call: "POST /ppa/allocations/${alloc_id}/decision"
              payload: { decision: "CONFIRM" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "POST /ppa/rounds/${round_1}/respond"
              payload: { response: "ACCEPT" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "POST /ppa/deals/${deal_id}/submit-credit"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals/${deal_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/deals/${deal_id}/execute"
              payload: {}
              as: DealCommittee
              as_user_id: "u_committee_1"
          trigger:
            - call: "POST /ppa/deals/${deal_id}/settlement-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
              captures: { period_id: $.data.id, period_v: $.data.version }
            - call: "POST /ppa/settlement-periods/${period_id}/intervals"
              payload: { hour_start: "2026-08-01T00:00:00Z", metered_mwh: 30.0000, node_price_usd_per_mwh: 25.00, hub_price_usd_per_mwh: 26.00, expected_settlement_period_version: "${period_v}", curtailment_flag: false }
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /ppa/settlement-periods/${period_id}/calculate"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /ppa/settlement-periods/${period_id}/mint-attributes"
              payload: { quantity_mwh: 30, registry: "MRETS" }
              as: RegistryAgent
              as_user_id: "u_registry_1"
            - call: "POST /ppa/settlement-periods/${period_id}/advance"
              payload: { action: "INVOICE" }
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /ppa/settlement-periods/${period_id}/advance"
              payload: { action: "DISPUTE", dispute_reason: "Node price for hour 00 disagrees with the ISO settlement statement" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
          assert:
            - "every setup call succeeded under the role §1.6 declares for it, and Deal.${deal_id}.status is EFFECTIVE with created_by_user_id u_orig_1 and credit_approved_by_user_id u_credit_1"
            - "the first trigger returns 201 for SettlementAnalyst with status OPEN, netting_method HOURLY and interval_count 0"
            - "the second trigger returns 201 and the third returns 200 with status CALCULATED, calculated_at 2026-08-01T00:00:00Z, total_metered_mwh 30.0000 and mintable_attributes_mwh 30 = floor(30.0000)"
            - "the fourth trigger returns 201 for RegistryAgent with registry MRETS, quantity_mwh 30 and status MINTED - minting is the RegistryAgent's exclusive operation and no other role appears on that endpoint"
            - "the fifth trigger returns 200 with status INVOICED and invoiced_at 2026-08-01T00:00:00Z, and the sixth returns 200 with status DISPUTED and the stored dispute_reason"
            - "the advance endpoint declares roles [SettlementAnalyst, OfftakerRep] yet the two actions are not interchangeable: INVOICE came from the analyst and DISPUTE from the anchor's own representative, and each used the identity §1.6 requires"

      - name: project_single_reads_span_all_roles_while_the_list_and_the_write_are_forbidden
        claim_type: role_permitted_operations
        grounds:
          - endpoints.GET_/ppa/projects/{id}
          - endpoints.GET_/ppa/projects
          - endpoints.POST_/ppa/projects/{id}/advance-milestone
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          Three endpoints on the SAME entity carry three different role lists, and the
          difference is observable in one fixture: GET /ppa/projects/{id} is open to all six
          roles, GET /ppa/projects is operator-only (RegistryAgent and OfftakerRep are
          absent), and advance-milestone belongs to Originator alone - so DealCommittee, the
          role that can sign and terminate an entire agreement, cannot record a permit. The
          403s are role refusals at priority 2 and never depend on the requested project's
          state, which the trailing read confirms is unchanged.
        test_recipe:
          setup:
            - "One pricing node, one offtaker whose id backs the OfftakerRep identity used below, and one PRE_DEVELOPMENT project."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
          trigger:
            - call: "GET /ppa/projects/${project_id}"
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "GET /ppa/projects"
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "GET /ppa/projects"
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "PERMITTED", evidence_ref: "CUP-2026-0301" }
              as: DealCommittee
              as_user_id: "u_committee_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "PERMITTED", evidence_ref: "CUP-2026-0301" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "GET /ppa/projects/${project_id}"
              as: RegistryAgent
              as_user_id: "u_registry_1"
          assert:
            - "the first trigger returns 200 for OfftakerRep with status PRE_DEVELOPMENT, contracted_mw 0.000 and available_mw 100.000"
            - "the second trigger returns 403 with error_id ERR_ROLE_NOT_PERMITTED: GET /ppa/projects declares [Originator, CreditOfficer, DealCommittee, SettlementAnalyst] and OfftakerRep is not on it, even though that same representative may read any single project"
            - "the third trigger returns 200 with total_count 1, has_more false, limit 10 and offset 0"
            - "the fourth trigger returns 403 ERR_ROLE_NOT_PERMITTED: advance-milestone is Originator-only, so the signing role cannot record a permit"
            - "the fifth trigger returns 200 with Project.${project_id}.status PERMITTED and last_milestone_at 2026-08-01T00:00:00Z"
            - "the sixth trigger returns 200 for RegistryAgent showing status PERMITTED, so the refused DealCommittee call left no partial effect behind"

      - name: signing_and_counterparty_checks_read_x_user_id_not_just_x_user_role
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_7_ERR_NOT_DEAL_COUNTERPARTY
          - validations.priority_10_ERR_SEGREGATION_OF_DUTIES
          - errors[ERR_NOT_DEAL_COUNTERPARTY]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.Deal.TERMS_AGREED_to_EXECUTED
          - endpoints.POST_/ppa/rounds/{id}/respond
          - endpoints.POST_/ppa/deals/{id}/execute
        distinguishing_aspect: |
          Two identity checks bite on calls whose ROLE is entirely correct. An OfftakerRep
          who represents a different offtaker holds the right role for both
          /rounds/{id}/respond and GET /ppa/deals/{id} and is refused on both, because
          counterparty status is computed from X-User-ID against the deal's
          anchor_offtaker_id and its CONFIRMED allocations. Then one natural person wearing
          both hats - CreditOfficer for the credit decision and DealCommittee for signing -
          is refused at execute, so the same user id that approved credit can never sign,
          while a different DealCommittee user signs the identical request successfully.
        test_recipe:
          setup:
            - "A TERM_SHEET_ISSUED 25.000 MW deal created by u_orig_1 for anchor Northwind, with one OPEN developer round and one CONFIRMED 25.000 MW allocation to Northwind."
