  - name: study_school_area_and_development_reads_with_unknown_id_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_STUDY_NOT_FOUND]
    - errors[ERR_SCHOOL_NOT_FOUND]
    - errors[ERR_AREA_NOT_FOUND]
    - errors[ERR_DEVELOPMENT_NOT_FOUND]
    - validations[priority=30]
    distinguishing_aspect: Four seed-inventory reads each map an unresolvable path id to their OWN 404 error_id rather than a shared generic - a server that returns ERR_STUDY_NOT_FOUND for a missing school, or a bare 500, fails this instance.
    test_recipe:
      setup:
      - The Riverbend study exists and is DATA_LOCKED with one housing development, so each endpoint is definitely wired and the only thing wrong is the id in the path.
      - The literal 00000000-0000-0000-0000-000000000000 is used as the unknown id; no entity in the database carries it.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: DistrictPlanner
        as_user_id: planner-1
