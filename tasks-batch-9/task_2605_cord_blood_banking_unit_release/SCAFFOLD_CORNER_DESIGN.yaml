            - "the first call returns HTTP 200 with kits_expired == 0, screenings_expired == 0, reservations_expired == 0, excursions_escalated == 0"
            - "the same body has tanks_entered_maintenance == 0, tanks_exited_maintenance == 0, invoices_advanced_past_due == 0, invoices_advanced_delinquent == 0, accounts_advanced == 0, units_flagged_pending_abandonment == 0"
            - "the second call returns HTTP 200 with a byte-identical all-zero body — the sweep is a no-op, never an error"

      - name: corner_unit_search_projects_the_derived_dose_and_returns_empty_sets_cleanly
        claim_type: computed_read
        grounds: "§1.3 unit_search_ranking (eligibility filter, ranking on the PRE_CRYO dose DESC, empty candidate set -> HTTP 200 with data == [] and total_count == 0); §1.5 GET /cbb/units/search projection fields; §1.3 nucleated_cell_dose PRE_CRYO variant."
