              captures: { inspB_id: $.data.id }
          trigger:
            - call: "GET /stores/${storeB_id}"
              payload: {}
              as: StoreManager
              as_user_id: "${storeA_id}"
              captures: { e_store_read: $.data.error_id }
            - call: "GET /systems/${sysB_id}"
              payload: {}
              as: StoreManager
              as_user_id: "${storeA_id}"
              captures: { e_system_read: $.data.error_id }
            - call: "POST /inspections/${inspB_id}/response"
              payload: { response_summary: "Not my store, but responding anyway.", corrective_action_code: "RECORDS_CORRECTED" }
              as: StoreManager
              as_user_id: "${storeA_id}"
              captures: { e_response: $.data.error_id }
            - call: "GET /stores/${storeA_id}"
