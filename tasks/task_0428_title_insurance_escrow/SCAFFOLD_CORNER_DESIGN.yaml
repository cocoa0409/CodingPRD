        grounds: ["errors[ERR_NO_ISSUED_POLICY]", state_machines.Order.COMMITTED_to_CLEAR_TO_CLOSE]
        distinguishing_aspect: "Order COMMITTED->CLEAR_TO_CLOSE with open_exception_count 0 but NO ISSUED policy returns ERR_NO_ISSUED_POLICY."
        test_recipe:
          setup: ["An order in COMMITTED (ISSUED commitment, COMPLETED chain-verified search) with no policy issued."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C35", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/title-searches"
              payload: { searched_parcel_id: "APN-C35", effective_date: "2026-01-05T00:00:00Z" }
              as: TitleOfficer
              captures: { s_id: $.data.id }
            - call: "POST /title/orders/${o_id}/transitions"
              payload: { to_status: "IN_TITLE" }
              as: TitleOfficer
            - call: "POST /title/title-searches/${s_id}/transitions"
              payload: { to_status: "IN_EXAM" }
              as: TitleOfficer
            - call: "POST /title/title-searches/${s_id}/transitions"
              payload: { to_status: "COMPLETED", chain_verified: true, gap_from_date: "2026-01-05T00:00:00Z", gap_to_date: "2026-01-20T00:00:00Z" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/transitions"
              payload: { to_status: "COMMITTED" }
              as: TitleOfficer
          trigger:
            - call: "POST /title/orders/${o_id}/transitions"
              payload: { to_status: "CLEAR_TO_CLOSE" }
              as: TitleOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_ISSUED_POLICY"
            - "Order.${o_id}.status == COMMITTED"

      - name: order_in_title_requires_a_search
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]", state_machines.Order.OPENED_to_IN_TITLE]
        distinguishing_aspect: "Order OPENED->IN_TITLE with no TitleSearch in ORDERED/IN_EXAM fails the precondition (no search) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A freshly OPENED order with no title searches."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
