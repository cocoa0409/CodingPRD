scenario: |
  Generate task harder than expert level!

  2711. Regional Climate Adaptation & Resilience Planning (regional planning agency): hazard identification with downscaled climate projections for heat, flood, drought and storm exposure, vulnerability assessment across infrastructure, populations and economic sectors with social vulnerability overlays, asset criticality ranking and failure consequence analysis for lifeline systems, adaptation strategy development with cost, co-benefit and feasibility screening, project prioritization for capital programming and grant applications with benefit-cost analysis requirements, equity considerations in benefit distribution and community engagement in strategy selection, implementation tracking with indicators and periodic plan updates, coordination across jurisdictions with shared infrastructure and mutual aid agreements

domain_name: regional-climate-adaptation-resilience-planning
api_prefix: "/resilience"

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: multi_party_negotiation
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Member jurisdictions, lifeline assets (self-referential upstream-dependency DAG),
  # adaptation projects (self-referential prerequisite DAG) and a ProjectAssetLink
  # junction give a genuine many-to-many + self-referential graph rather than a tree.

  state_machine_shape: cyclic
  # PlanCycle loops ENDORSEMENT_ROUND -> REVISION -> ENDORSEMENT_ROUND until either the
  # weighted quorum is met (ADOPTED) or the revision budget is exhausted (FAILED).
  # HazardProfile also self-loops PUBLISHED -> PUBLISHED on each downscaled re-run.

  relationship_patterns:
    - one_to_many          # Jurisdiction -> HazardProfile / LifelineAsset
    - many_to_many         # AdaptationProject <-> LifelineAsset via ProjectAssetLink
    - self_referential     # LifelineAsset.upstream_asset_id, AdaptationProject.prerequisite_project_id
    - cross_aggregate      # MutualAidCommitment references an asset owned by another jurisdiction

  role_model: segregation_of_duties
  # The user who prepares a BenefitCostAnalysis may never certify it; the equity waiver
  # is reserved to a role that can neither prepare nor certify analyses.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
  pagination_placement: |
    For every response_type "array" the four pagination fields are returned inside meta
    alongside api_request_id and api_request_timestamp, so a list response reads
    { "meta": { "api_request_id": ..., "api_request_timestamp": ..., "limit": 10,
    "offset": 0, "total_count": 3, "has_more": false }, "response_type": "array",
    "data": [ ... ] }. total_count counts every row matching the filters, not the page.

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the member local government.
        constraints: "1..120 chars, non-blank"
      - name: jurisdiction_code
        type: string
        source: input
        description: Agency-assigned short code for the member government.
        constraints: "unique across all Jurisdiction rows; 3..32 chars, uppercase letters, digits and hyphen only"
      - name: population
        type: integer
        source: input
        description: Resident population used as the social-vulnerability denominator.
        constraints: ">= 1"
      - name: svi_score
        type: number
        source: input
        description: Social vulnerability index for the jurisdiction, 2 decimal places.
        constraints: "0.00 <= svi_score <= 1.00"
      - name: svi_tier
        type: enum
        source: computed
        description: Banded social vulnerability tier derived from svi_score by calculations.svi_tier_assignment.
        constraints: "one of {LOW, MODERATE, HIGH, SEVERE}"
      - name: disadvantaged_flag
        type: boolean
        source: computed
        description: True exactly when svi_tier IN {HIGH, SEVERE}; drives equity benefit accounting.
      - name: endorsement_weight
        type: integer
        source: input
        description: Weighted vote this jurisdiction carries in plan endorsement tallies.
        default: 1
        constraints: "1 <= endorsement_weight <= 10"
      - name: status
        type: enum
        source: input
        description: Membership standing; only ACTIVE jurisdictions may cast endorsements or host aid.
        default: ACTIVE
        constraints: "one of {ACTIVE, PROBATION, SUSPENDED}"

  - name: PlanCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_label
        type: string
        source: input
        description: Label of the periodic regional adaptation plan update cycle.
        constraints: "1..80 chars, non-blank"
      - name: status
        type: enum
        source: input
        description: Lifecycle state of the plan cycle; see state_machines.PlanCycle.
        default: DRAFT
        constraints: "one of {DRAFT, ENGAGEMENT, ENDORSEMENT_ROUND, REVISION, ADOPTED, FAILED}"
      - name: round_number
        type: integer
        source: computed
        description: Count of endorsement rounds opened so far; incremented by open-endorsement-round.
        default: 0
      - name: revision_count
        type: integer
        source: computed
        description: Count of times the cycle has been pushed back into REVISION.
        default: 0
      - name: max_revision_rounds
        type: integer
        source: input
        description: Revision budget; exceeding it turns a failed round into a FAILED cycle.
        default: 2
        constraints: "0 <= max_revision_rounds <= 5"
      - name: quorum_weight_bps
        type: integer
        source: input
        description: Supporting-weight share, in basis points of total ACTIVE endorsement weight, required to adopt.
        default: 6600
        constraints: "1 <= quorum_weight_bps <= 10000"
      - name: required_session_count
        type: integer
        source: input
        description: Number of COMPLETED EngagementSession rows required before an endorsement round may open.
        default: 2
        constraints: "0 <= required_session_count <= 10"
      - name: achieved_weight_bps
        type: integer
        source: computed
        description: Supporting-weight share of the most recently closed round, from calculations.endorsement_quorum_tally.
        default: 0
      - name: endorsement_deadline
        type: datetime
        source: input
        description: ISO 8601 UTC instant after which no endorsement may be cast for this cycle.
      - name: adopted_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the cycle reached ADOPTED; null until then.

  - name: HazardProfile
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; member government the downscaled projection covers."
      - name: hazard_type
        type: enum
        source: input
        description: Climate hazard the downscaled projection describes.
        constraints: "one of {HEAT, FLOOD, DROUGHT, STORM}"
      - name: scenario
        type: enum
        source: input
        description: Emissions scenario of the downscaled run.
        constraints: "one of {RCP45, RCP85}"
      - name: horizon_year
        type: integer
        source: input
        description: Projection horizon year of the downscaled run.
        constraints: "one of {2040, 2060, 2080}"
      - name: exposure_index
        type: number
        source: input
        description: Normalized exposure magnitude for the hazard at this horizon, 2 decimal places.
        constraints: "0.00 <= exposure_index <= 1.00"
      - name: annual_event_probability
        type: number
        source: input
        description: Annual exceedance probability of the design event, 4 decimal places.
        constraints: "0.0001 <= annual_event_probability <= 1.0000"
      - name: projected_annual_loss_cents
        type: integer
        source: input
        description: Downscaled expected annual loss for the jurisdiction under this hazard, in cents.
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: Publication state; only PUBLISHED profiles may back vulnerability assessments.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED}"
      - name: published_version
        type: integer
        source: computed
        description: Monotonic publication counter; 0 while DRAFT, 1 on first publish, +1 on every revision.
        default: 0
      - name: published_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent publish or revision; null while DRAFT.

  - name: LifelineAsset
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; owning member government."
      - name: upstream_asset_id
        type: string
        source: input
        description: "FK -> LifelineAsset.id; asset this one depends on for continued service, forming the lifeline dependency DAG. Null for a root asset."
        default: null
      - name: asset_class
        type: enum
        source: input
        description: Lifeline system the asset belongs to.
        constraints: "one of {WATER, POWER, TRANSPORT, HEALTH, COMMS}"
      - name: name
        type: string
        source: input
        description: Display name of the lifeline asset.
        constraints: "1..120 chars, non-blank"
      - name: replacement_value_cents
        type: integer
        source: input
        description: Full replacement value of the asset in cents.
        constraints: ">= 1"
      - name: service_population
        type: integer
        source: input
        description: Residents who lose service if the asset fails.
        constraints: ">= 0"
      - name: redundancy_factor
        type: number
        source: input
        description: Share of asset function covered by redundant capacity, 2 decimal places.
        constraints: "0.00 <= redundancy_factor <= 1.00"
      - name: is_shared
        type: boolean
        source: input
        description: True when the asset serves more than one member jurisdiction; required for mutual aid commitments.
        default: false
      - name: criticality_status
        type: enum
        source: input
        description: Whether the criticality ranking outputs are current; see state_machines.LifelineAsset.
        default: UNRANKED
        constraints: "one of {UNRANKED, RANKED, RECOMPUTE_REQUIRED}"
      - name: consequence_score
        type: number
        source: computed
        description: Failure-consequence score from calculations.asset_consequence_score, 2 decimal places; null when not RANKED.
      - name: criticality_tier
        type: enum
        source: computed
        description: Criticality band derived from consequence_score; null when not RANKED.
        constraints: "one of {TIER_1, TIER_2, TIER_3}"
      - name: dependency_depth
        type: integer
        source: computed
        description: Number of hops from this asset up the upstream_asset_id chain to a root asset; null when not RANKED.

  - name: VulnerabilityAssessment
    parent: null
    common_fields: true
    fields:
      - name: hazard_profile_id
        type: string
        source: input
        description: "FK -> HazardProfile.id; downscaled projection supplying the exposure term."
      - name: asset_id
        type: string
        source: input
        description: "FK -> LifelineAsset.id; asset whose service area the receptor sits in."
      - name: subject_type
        type: enum
        source: input
        description: Receptor dimension being assessed against the hazard.
        constraints: "one of {INFRASTRUCTURE, POPULATION, ECONOMIC_SECTOR}"
      - name: sensitivity_score
        type: number
        source: input
        description: Receptor sensitivity to the hazard, 2 decimal places.
        constraints: "0.00 <= sensitivity_score <= 1.00"
      - name: adaptive_capacity_score
        type: number
        source: input
        description: Receptor adaptive capacity, 2 decimal places; enters the formula as (1 - adaptive_capacity_score).
        constraints: "0.00 <= adaptive_capacity_score <= 1.00"
      - name: method
        type: enum
        source: input
        description: Which vulnerability algorithm variant to apply; the two variants yield different scores for identical inputs.
        constraints: "one of {COMPOSITE_MULTIPLICATIVE, ADDITIVE_WEIGHTED}"
      - name: svi_overlay_applied
        type: boolean
        source: input
        description: When true the owning jurisdiction's svi_tier multiplier is applied; when false the multiplier is 1.00.
        default: true
      - name: vulnerability_score
        type: number
        source: computed
        description: Output of calculations.vulnerability_score, 2 decimal places; null until first assessed.
      - name: vulnerability_band
        type: enum
        source: computed
        description: Band derived from vulnerability_score; null until first assessed.
        constraints: "one of {LOW, MODERATE, HIGH, EXTREME}"
      - name: status
        type: enum
        source: input
        description: Assessment freshness; see state_machines.VulnerabilityAssessment.
        default: DRAFT
        constraints: "one of {DRAFT, ASSESSED, STALE}"
      - name: assessed_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent assess call; null while DRAFT.
      - name: assessed_profile_version
        type: integer
        source: computed
        description: HazardProfile.published_version observed at assess time; a later profile revision makes the row STALE.

  - name: AdaptationProject
    parent: null
    common_fields: true
    fields:
      - name: plan_cycle_id
        type: string
        source: input
        description: "FK -> PlanCycle.id; plan update cycle this project belongs to."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; sponsoring member government; must equal the acting ProjectSponsor's X-User-ID."
      - name: prerequisite_project_id
        type: string
        source: input
        description: "FK -> AdaptationProject.id; project that must reach program_status AWARDED before this one may be programmed. Null when the project has no prerequisite."
        default: null
      - name: capital_program_id
        type: string
        source: computed
        description: "FK -> CapitalProgram.id; set when the project is programmed and retained for audit after withdrawal. Null while never programmed."
      - name: name
        type: string
        source: input
        description: Display name of the adaptation project.
        constraints: "1..120 chars, non-blank"
      - name: hazard_type
        type: enum
        source: input
        description: Primary hazard the project addresses.
        constraints: "one of {HEAT, FLOOD, DROUGHT, STORM}"
      - name: strategy_type
        type: enum
        source: input
        description: Adaptation strategy family; selects the cost escalation rate.
        constraints: "one of {PROTECT, ACCOMMODATE, RETREAT, AVOID}"
      - name: base_cost_cents
        type: integer
        source: input
        description: Planning-level capital cost estimate in cents, before escalation and administration.
        constraints: ">= 1"
      - name: service_life_years
        type: integer
        source: input
        description: Design service life used as the benefit-cost analysis horizon.
        constraints: "10 <= service_life_years <= 75"
      - name: cobenefit_points
        type: integer
        source: input
        description: Co-benefit points awarded during strategy screening.
        constraints: "0 <= cobenefit_points <= 20"
      - name: feasibility_score
        type: number
        source: input
        description: Implementation feasibility, 2 decimal places.
        constraints: "0.00 <= feasibility_score <= 1.00"
      - name: screening_status
        type: enum
        source: input
        description: Strategy screening dimension; evolves independently of analysis_status and program_status.
        default: PROPOSED
        constraints: "one of {PROPOSED, SCREENED_IN, SCREENED_OUT}"
      - name: screen_score
        type: number
        source: computed
        description: Output of calculations.strategy_screen_score, 4 decimal places; null while PROPOSED.
      - name: analysis_status
        type: enum
        source: input
        description: Benefit-cost analysis dimension; evolves independently of screening_status and program_status.
        default: NOT_ANALYZED
        constraints: "one of {NOT_ANALYZED, BCA_PENDING, BCA_CERTIFIED, BCA_STALE, BCA_REJECTED}"
      - name: program_status
        type: enum
        source: input
        description: Capital programming and grant dimension; evolves independently of the other three dimensions.
        default: UNPROGRAMMED
        constraints: "one of {UNPROGRAMMED, PROGRAMMED, GRANT_SUBMITTED, AWARDED, WITHDRAWN}"
      - name: escalated_cost_cents
        type: integer
        source: computed
        description: base_cost_cents escalated by the strategy rate, step 1 of calculations.program_cost_stack; null while PROPOSED.
      - name: admin_rate_bps
        type: integer
        source: computed
        description: Administration rate selected from the tier keyed on escalated_cost_cents, step 2 of calculations.program_cost_stack; null while PROPOSED.
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Administration fee, step 3 of calculations.program_cost_stack; null while PROPOSED.
      - name: total_program_cost_cents
        type: integer
        source: computed
        description: escalated_cost_cents + admin_fee_cents, step 4 of calculations.program_cost_stack; null while PROPOSED.
      - name: grant_match_share_bps
        type: integer
        source: computed
        description: Required local match share selected from the tier keyed on total_program_cost_cents, step 5 of calculations.program_cost_stack; null while PROPOSED.
      - name: allocated_cents
        type: integer
        source: computed
        description: Amount currently committed against capital_program_id; 0 while UNPROGRAMMED and reset to 0 on withdrawal.
        default: 0
      - name: equity_benefit_share_bps
        type: integer
        source: computed
        description: Share of avoided-loss benefit reaching disadvantaged jurisdictions, from calculations.project_priority_score; null until first programming attempt.
      - name: priority_score
        type: number
        source: computed
        description: Output of calculations.project_priority_score, 4 decimal places; null until programmed.
      - name: equity_waiver_granted
        type: boolean
        source: computed
        description: True after an EquityOfficer waiver; lets the project be programmed below the program's equity target.
        default: false
      - name: grant_hold_flag
        type: boolean
        source: computed
        description: True while the owning capital program's funding_posture is CLOSED; blocks grant submission.
        default: false
      - name: grant_funder
        type: enum
        source: input
        description: Funder the grant application targets; set at grant submission.
        default: null
        constraints: "one of {BRIC, HMGP, STATE_RESILIENCE}"
      - name: grant_submitted_at
        type: datetime
        source: computed
        description: Logical-clock instant of grant submission; null until submitted.
      - name: awarded_at
        type: datetime
        source: computed
        description: Logical-clock instant of grant award; null until program_status reaches AWARDED.
      - name: indicator_code
        type: string
        source: input
        description: Implementation-tracking indicator code; required before any indicator report may be filed.
        default: null
        constraints: "1..40 chars when present"
      - name: indicator_target_value
        type: number
        source: input
        description: Target value of the implementation indicator, 2 decimal places.
        default: null
        constraints: "> 0 when present"
      - name: indicator_latest_value
        type: number
        source: computed
        description: Most recently reported indicator value; null until the first report.
      - name: indicator_attainment_pct
        type: number
        source: computed
        description: Output of calculations.indicator_attainment, 2 decimal places; null until the first report.
      - name: latest_period_label
        type: string
        source: computed
        description: Reporting period label of the most recent indicator report; null until the first report.
      - name: reported_period_count
        type: integer
        source: computed
        description: Number of indicator reports filed against this project.
        default: 0
      - name: implementation_status
        type: enum
        source: computed
        description: Implementation-tracking dimension derived from indicator_attainment_pct; evolves independently of the other three dimensions.
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, ON_TRACK, AT_RISK, OFF_TRACK}"

  - name: ProjectAssetLink
    parent: AdaptationProject
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> AdaptationProject.id; project whose benefits are being attributed."
      - name: asset_id
        type: string
        source: input
        description: "FK -> LifelineAsset.id; lifeline asset protected by the project."
      - name: avoided_loss_annual_cents
        type: integer
        source: input
        description: Annual loss avoided at this asset once the project is in service, in cents.
        constraints: ">= 0"
      - name: benefit_reaches_disadvantaged
        type: boolean
        source: computed
        description: Snapshot of the asset's owning Jurisdiction.disadvantaged_flag at link creation; drives equity benefit share.
      - name: link_sequence
        type: integer
        source: computed
        description: 1-based position of this link within its project, assigned by created_at ASC; pins the per-line rounding order of the benefit-cost analysis.

  - name: BenefitCostAnalysis
    parent: AdaptationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> AdaptationProject.id; project under analysis."
      - name: method
        type: enum
        source: input
        description: Which benefit-cost algorithm variant to apply; the two variants yield different ratios for identical inputs.
        constraints: "one of {DISCOUNTED_NPV, ANNUALIZED_EQUIVALENT}"
      - name: discount_rate_bps
        type: integer
        source: input
        description: Real discount rate in basis points used by the DISCOUNTED_NPV variant.
        default: 700
        constraints: "1 <= discount_rate_bps <= 2000"
      - name: analysis_horizon_years
        type: integer
        source: computed
        description: Copy of AdaptationProject.service_life_years observed at analysis creation.
      - name: benefit_measure_cents
        type: integer
        source: computed
        description: Present-value benefit under DISCOUNTED_NPV, or undiscounted annual benefit under ANNUALIZED_EQUIVALENT, in cents.
      - name: cost_measure_cents
        type: integer
        source: computed
        description: Present-value cost under DISCOUNTED_NPV, or straight-line annualized cost under ANNUALIZED_EQUIVALENT, in cents.
      - name: bcr
        type: number
        source: computed
        description: benefit_measure_cents / cost_measure_cents from calculations.benefit_cost_ratio, 4 decimal places.
      - name: grant_eligible
        type: boolean
        source: computed
        description: True exactly when the rounded bcr >= 1.0000.
      - name: status
        type: enum
        source: input
        description: Review state of the analysis; see state_machines.BenefitCostAnalysis.
        default: DRAFT
        constraints: "one of {DRAFT, CERTIFIED, REJECTED, STALE}"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProjectSponsor who created the analysis; the certifier must differ from it.
      - name: certified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the BCAReviewer who certified the analysis; null until CERTIFIED.
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock instant of certification; null until CERTIFIED.
      - name: stale_reason
        type: enum
        source: computed
        description: >-
          Proximate cause that invalidated a CERTIFIED analysis. ASSET_RECOMPUTE is written when a
          linked asset flips to criticality_status RECOMPUTE_REQUIRED; LINK_ADDED is written when a new
          ProjectAssetLink changes the benefit input set of an already-certified analysis.
        default: NONE
        constraints: "one of {NONE, ASSET_RECOMPUTE, LINK_ADDED}"

  - name: CapitalProgram
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year of the regional capital program.
        constraints: "2026 <= fiscal_year <= 2040"
      - name: authorized_cents
        type: integer
        source: input
        description: Total authorized programming capacity in cents; the conserved quantity of the money invariant.
        constraints: ">= 1"
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of allocated_cents over projects committed to this program, from calculations.program_funding_ledger.
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: authorized_cents - committed_cents; the invariant committed_cents + available_cents == authorized_cents holds after every mutation.
      - name: equity_target_bps
        type: integer
        source: input
        description: Minimum equity_benefit_share_bps a project must reach to be programmed without a waiver.
        default: 4000
        constraints: "0 <= equity_target_bps <= 10000"
      - name: equity_committed_cents
        type: integer
        source: computed
        description: Portion of committed_cents attributable to projects meeting or exceeding equity_target_bps.
        default: 0
      - name: equity_achieved_bps
        type: integer
        source: computed
        description: equity_committed_cents as a basis-point share of committed_cents; 0 when committed_cents == 0.
        default: 0
      - name: funding_posture
        type: enum
        source: computed
        description: Derived gate over child projects' grant submissions; recomputed after every allocation or withdrawal.
        default: OPEN
        constraints: "one of {OPEN, OVERSUBSCRIBED, CLOSED}"

  - name: EngagementSession
    parent: PlanCycle
    common_fields: true
    fields:
      - name: plan_cycle_id
        type: string
        source: input
        description: "FK -> PlanCycle.id; plan cycle whose strategy set the session gathers input on."
      - name: host_jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; hosting member government; the exclusive-occupancy resource for session window conflicts."
      - name: modality
        type: enum
        source: input
        description: Delivery format of the community engagement session.
        constraints: "one of {IN_PERSON, VIRTUAL, HYBRID}"
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the session window.
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the session window; must be strictly after window_start.
      - name: status
        type: enum
        source: input
        description: Session lifecycle; CANCELLED is written only by the PlanCycle FAILED cascade.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
      - name: attendee_count
        type: integer
        source: computed
        description: Total attendance recorded at completion.
        default: 0
      - name: disadvantaged_attendee_count
        type: integer
        source: computed
        description: Attendance from disadvantaged communities recorded at completion.
        default: 0
      - name: equity_reach_bps
        type: integer
        source: computed
        description: disadvantaged_attendee_count as a basis-point share of attendee_count, from calculations.engagement_equity_reach; null while SCHEDULED.
      - name: preferred_strategy_type
        type: enum
        source: computed
        description: Strategy family the community selected at this session; recorded at completion, null while SCHEDULED.
        constraints: "one of {PROTECT, ACCOMMODATE, RETREAT, AVOID}"

  - name: Endorsement
    parent: PlanCycle
    common_fields: true
    fields:
      - name: plan_cycle_id
        type: string
        source: input
        description: "FK -> PlanCycle.id; cycle being endorsed."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; casting member government; must equal the acting JurisdictionDelegate's X-User-ID."
      - name: round_number
        type: integer
        source: computed
        description: PlanCycle.round_number observed when the endorsement was cast.
      - name: decision
        type: enum
        source: input
        description: Cast decision; SUPERSEDED is written only by the cascade that returns the cycle to REVISION.
        constraints: "one of {ENDORSED, CONDITIONED, VETOED, SUPERSEDED}"
      - name: condition_note
        type: string
        source: input
        description: Condition text; required when decision == CONDITIONED, must be absent otherwise.
        default: null
        constraints: "1..500 chars when present"
      - name: weight_at_cast
        type: integer
        source: computed
        description: Snapshot of Jurisdiction.endorsement_weight at cast time; used by the tally instead of the live value.
      - name: cast_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the endorsement was cast.

  - name: MutualAidPact
    parent: null
    common_fields: true
    fields:
      - name: host_jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; jurisdiction pledging the resources; must equal the acting JurisdictionDelegate's X-User-ID."
      - name: resource_class
        type: enum
        source: input
        description: Class of mutual aid resource pledged.
        constraints: "one of {CREWS, PUMPS, GENERATORS, COOLING_UNITS}"
      - name: pledged_units
        type: integer
        source: input
        description: Total units pledged; the conserved quantity of the aid-unit invariant.
        constraints: ">= 1"
      - name: reserved_units
        type: integer
        source: computed
        description: "Peak concurrent unit load over commitments in status IN {COMMITTED, FULFILLED}, from calculations.aid_unit_ledger; this is the same peak the admission check in calculations.aid_peak_overlap_capacity computes, so it can never exceed pledged_units."
        default: 0
      - name: free_units
        type: integer
        source: computed
        description: pledged_units - reserved_units; the invariant reserved_units + free_units == pledged_units holds after every mutation.
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the pact availability window.
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the pact availability window; must be strictly after window_start.
      - name: max_concurrent_commitments
        type: integer
        source: input
        description: Maximum number of existing commitments whose half-open windows may overlap a new one.
        default: 3
        constraints: "1 <= max_concurrent_commitments <= 20"
      - name: status
        type: enum
        source: computed
        description: Availability gate recomputed after every commitment mutation and read against the logical clock.
        default: OPEN
        constraints: "one of {OPEN, EXHAUSTED, EXPIRED}"

  - name: MutualAidCommitment
    parent: MutualAidPact
    common_fields: true
    fields:
      - name: pact_id
        type: string
        source: input
        description: "FK -> MutualAidPact.id; pact the units are drawn from."
      - name: requesting_jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; jurisdiction receiving the aid; must equal the acting JurisdictionDelegate's X-User-ID and must differ from the pact host."
      - name: asset_id
        type: string
        source: input
        description: "FK -> LifelineAsset.id; shared lifeline asset the aid supports; the asset must have is_shared == true."
      - name: committed_units
        type: integer
        source: input
        description: Units drawn from the pact for this commitment.
        constraints: ">= 1"
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the half-open occupation interval [window_start, window_end).
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the half-open occupation interval; must be strictly after window_start.
      - name: status
        type: enum
        source: input
        description: Commitment lifecycle; see state_machines.MutualAidCommitment.
        default: COMMITTED
        constraints: "one of {COMMITTED, RELEASED, FULFILLED}"
      - name: released_at
        type: datetime
        source: computed
        description: Logical-clock instant of release; null unless RELEASED.
      - name: fulfilled_at
        type: datetime
        source: computed
        description: Logical-clock instant of fulfilment; null unless FULFILLED.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PlanCycle
    initial_state: DRAFT
    terminal_states: [ADOPTED, FAILED]
    note: >-
      Cyclic shape. ENDORSEMENT_ROUND -> REVISION -> ENDORSEMENT_ROUND repeats until the weighted
      quorum is met or the revision budget is exhausted. close-endorsement-round is the fork-join:
      the three endorsement branches (ENDORSED / CONDITIONED / VETOED) converge into exactly one of
      three outcomes with different side-effect sets.
    transitions:
      - from: DRAFT
        to: ENGAGEMENT
        trigger: "POST /resilience/plan-cycles/{plan_cycle_id}/open-engagement"
        actor: RegionalAdministrator
        preconditions:
          - "plan_cycle.status == DRAFT"
        side_effects:
          - "refreshes PlanCycle.updated_at and increments PlanCycle.version by 1"

      - from: ENGAGEMENT
        to: ENDORSEMENT_ROUND
        trigger: "POST /resilience/plan-cycles/{plan_cycle_id}/open-endorsement-round"
        actor: RegionalAdministrator
        preconditions:
          - "plan_cycle.status == ENGAGEMENT"
          - "COUNT(EngagementSession WHERE plan_cycle_id == plan_cycle.id AND status == COMPLETED) >= plan_cycle.required_session_count, else ERR_ENGAGEMENT_INCOMPLETE"
          - "COUNT(AdaptationProject WHERE plan_cycle_id == plan_cycle.id AND screening_status == SCREENED_IN) >= 1, else ERR_NO_SCREENED_PROJECTS"
        side_effects:
          - "increments PlanCycle.round_number by 1"
          - "increments PlanCycle.version by 1"

      - from: REVISION
        to: ENDORSEMENT_ROUND
        trigger: "POST /resilience/plan-cycles/{plan_cycle_id}/open-endorsement-round"
        actor: RegionalAdministrator
        preconditions:
          - "plan_cycle.status == REVISION"
          - "COUNT(EngagementSession WHERE plan_cycle_id == plan_cycle.id AND status == COMPLETED) >= plan_cycle.required_session_count, else ERR_ENGAGEMENT_INCOMPLETE"
          - "COUNT(AdaptationProject WHERE plan_cycle_id == plan_cycle.id AND screening_status == SCREENED_IN) >= 1, else ERR_NO_SCREENED_PROJECTS"
        side_effects:
          - "increments PlanCycle.round_number by 1"
          - "increments PlanCycle.version by 1"
        note: "This is the cycle-closing edge that makes the machine non-linear."

      - from: ENDORSEMENT_ROUND
        to: ADOPTED
        trigger: "POST /resilience/plan-cycles/{plan_cycle_id}/close-endorsement-round"
        actor: RegionalAdministrator
        preconditions:
          - "plan_cycle.status == ENDORSEMENT_ROUND"
          - "calculations.endorsement_quorum_tally outcome == ADOPTED (veto_weight < 3 AND achieved_weight_bps >= plan_cycle.quorum_weight_bps)"
        side_effects:
          - "writes PlanCycle.achieved_weight_bps from calculations.endorsement_quorum_tally"
          - "sets PlanCycle.adopted_at to the logical clock instant"
          - "increments PlanCycle.version by 1"

      - from: ENDORSEMENT_ROUND
        to: REVISION
        trigger: "POST /resilience/plan-cycles/{plan_cycle_id}/close-endorsement-round"
        actor: RegionalAdministrator
        preconditions:
          - "plan_cycle.status == ENDORSEMENT_ROUND"
          - "calculations.endorsement_quorum_tally outcome IN {BLOCKED, SHORT}"
          - "plan_cycle.revision_count + 1 <= plan_cycle.max_revision_rounds"
        side_effects:
          - "writes PlanCycle.achieved_weight_bps from calculations.endorsement_quorum_tally"
          - "increments PlanCycle.revision_count by 1"
          - "sets decision = SUPERSEDED on every Endorsement WHERE plan_cycle_id == plan_cycle.id AND round_number == plan_cycle.round_number AND decision IN {ENDORSED, CONDITIONED, VETOED}"
          - "increments PlanCycle.version by 1"

      - from: ENDORSEMENT_ROUND
        to: FAILED
        trigger: "POST /resilience/plan-cycles/{plan_cycle_id}/close-endorsement-round"
        actor: RegionalAdministrator
        preconditions:
          - "plan_cycle.status == ENDORSEMENT_ROUND"
          - "calculations.endorsement_quorum_tally outcome IN {BLOCKED, SHORT}"
          - "plan_cycle.revision_count + 1 > plan_cycle.max_revision_rounds"
        side_effects:
          - "writes PlanCycle.achieved_weight_bps from calculations.endorsement_quorum_tally"
          - "sets decision = SUPERSEDED on every Endorsement WHERE plan_cycle_id == plan_cycle.id AND round_number == plan_cycle.round_number AND decision IN {ENDORSED, CONDITIONED, VETOED}"
          - "cascade down: sets status = CANCELLED on every EngagementSession WHERE plan_cycle_id == plan_cycle.id AND status == SCHEDULED"
          - "cascade down: sets screening_status = SCREENED_OUT on every AdaptationProject WHERE plan_cycle_id == plan_cycle.id AND screening_status == SCREENED_IN AND program_status == UNPROGRAMMED"
          - "increments PlanCycle.version by 1"

      - from: ENDORSEMENT_ROUND
        to: REVISION
        trigger: "system: hop 5 of the HazardProfile revision cascade (see state_machines.HazardProfile PUBLISHED_to_PUBLISHED)"
        actor: system
        preconditions:
          - "plan_cycle.status == ENDORSEMENT_ROUND"
          - "at least one AdaptationProject WHERE plan_cycle_id == plan_cycle.id was flipped to analysis_status BCA_STALE by hop 4 of the same cascade"
          - "plan_cycle.revision_count + 1 <= plan_cycle.max_revision_rounds"
        side_effects:
          - "increments PlanCycle.revision_count by 1"
          - "sets decision = SUPERSEDED on every Endorsement WHERE plan_cycle_id == plan_cycle.id AND round_number == plan_cycle.round_number AND decision IN {ENDORSED, CONDITIONED, VETOED}"
          - "increments PlanCycle.version by 1"
        note: "When revision_count + 1 > max_revision_rounds the cascade writes FAILED instead, with the same SUPERSEDED and cancellation side effects as the operator-driven FAILED edge."

  - entity: HazardProfile
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Self-loop on PUBLISHED: each downscaled re-run republishes the same row at a higher published_version."
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /resilience/hazard-profiles/{hazard_profile_id}/publish"
        actor: HazardAnalyst
        preconditions:
          - "hazard_profile.status == DRAFT, else ERR_HAZARD_PROFILE_ALREADY_PUBLISHED"
        side_effects:
          - "sets HazardProfile.published_version = 1 and published_at to the logical clock instant"
          - "sets status = SUPERSEDED on the single other HazardProfile with the same (jurisdiction_id, hazard_type, scenario, horizon_year) whose status == PUBLISHED, if one exists"
          - "increments HazardProfile.version by 1"

      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /resilience/hazard-profiles/{hazard_profile_id}/revisions"
        actor: HazardAnalyst
        preconditions:
          - "hazard_profile.status == PUBLISHED, else ERR_HAZARD_PROFILE_NOT_PUBLISHED"
        side_effects:
          - "hop 1: overwrites exposure_index, annual_event_probability and projected_annual_loss_cents from the request, increments published_version by 1 and refreshes published_at"
          - "hop 2: BECAUSE published_version advanced, every VulnerabilityAssessment WHERE hazard_profile_id == hazard_profile.id AND status == ASSESSED AND assessed_profile_version < hazard_profile.published_version flips status DRAFT-free straight to STALE (vulnerability_score and vulnerability_band are retained as the stale reading)"
          - "hop 3: BECAUSE those assessments flipped to STALE, every LifelineAsset that is the asset_id of one of them AND has criticality_status == RANKED flips to criticality_status RECOMPUTE_REQUIRED and has consequence_score, criticality_tier and dependency_depth set to null"
          - "hop 4: BECAUSE those assets flipped to RECOMPUTE_REQUIRED, every BenefitCostAnalysis WHERE status == CERTIFIED AND project_id IN (SELECT project_id FROM ProjectAssetLink WHERE asset_id IN those assets) flips to status STALE with stale_reason = ASSET_RECOMPUTE, and its AdaptationProject flips analysis_status BCA_CERTIFIED -> BCA_STALE"
          - "hop 5: BECAUSE those projects flipped to BCA_STALE, every PlanCycle that is the plan_cycle_id of one of them AND has status == ENDORSEMENT_ROUND moves to REVISION (revision_count + 1, current-round endorsements SUPERSEDED) or to FAILED when the revision budget is exhausted"
          - "increments version by 1 on every row touched by hops 1-5"
        note: "This is the depth-5 transitive cascade; each hop is caused by the previous hop's mutation, never directly by the request."

  - entity: LifelineAsset
    initial_state: UNRANKED
    terminal_states: []
    transitions:
      - from: UNRANKED
        to: RANKED
        trigger: "POST /resilience/assets/{asset_id}/criticality-ranking"
        actor: HazardAnalyst
        preconditions:
          - "asset.criticality_status IN {UNRANKED, RECOMPUTE_REQUIRED}, else ERR_ASSET_ALREADY_RANKED"
          - "COUNT(VulnerabilityAssessment WHERE asset_id == asset.id AND status == ASSESSED) >= 1, else ERR_NO_ASSESSED_VULNERABILITY"
          - "the upstream_asset_id chain from this asset contains no repeated id, else ERR_ASSET_DEPENDENCY_CYCLE"
        side_effects:
          - "writes consequence_score, criticality_tier and dependency_depth from calculations.asset_consequence_score"
          - "increments LifelineAsset.version by 1"

      - from: RECOMPUTE_REQUIRED
        to: RANKED
        trigger: "POST /resilience/assets/{asset_id}/criticality-ranking"
        actor: HazardAnalyst
        preconditions:
          - "asset.criticality_status == RECOMPUTE_REQUIRED"
          - "COUNT(VulnerabilityAssessment WHERE asset_id == asset.id AND status == ASSESSED) >= 1, else ERR_NO_ASSESSED_VULNERABILITY"
        side_effects:
          - "writes consequence_score, criticality_tier and dependency_depth from calculations.asset_consequence_score"
          - "increments LifelineAsset.version by 1"

      - from: RANKED
        to: RECOMPUTE_REQUIRED
        trigger: "system: hop 3 of the HazardProfile revision cascade"
        actor: system
        preconditions:
          - "at least one VulnerabilityAssessment WHERE asset_id == asset.id was flipped to STALE by hop 2 of the same cascade"
        side_effects:
          - "sets consequence_score, criticality_tier and dependency_depth to null"
          - "increments LifelineAsset.version by 1"

  - entity: VulnerabilityAssessment
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ASSESSED
        trigger: "POST /resilience/vulnerability-assessments/{assessment_id}/assess"
        actor: HazardAnalyst
        preconditions:
          - "assessment.status IN {DRAFT, STALE}, else ERR_ASSESSMENT_NOT_PENDING"
          - "the referenced HazardProfile.status == PUBLISHED, else ERR_HAZARD_PROFILE_NOT_PUBLISHED"
        side_effects:
          - "writes vulnerability_score and vulnerability_band from calculations.vulnerability_score"
          - "sets assessed_at to the logical clock instant and assessed_profile_version = HazardProfile.published_version"
          - "increments VulnerabilityAssessment.version by 1"

      - from: STALE
        to: ASSESSED
        trigger: "POST /resilience/vulnerability-assessments/{assessment_id}/assess"
        actor: HazardAnalyst
        preconditions:
          - "assessment.status == STALE"
          - "the referenced HazardProfile.status == PUBLISHED"
        side_effects:
          - "recomputes vulnerability_score and vulnerability_band against the current HazardProfile.exposure_index"
          - "sets assessed_profile_version = HazardProfile.published_version"
          - "increments VulnerabilityAssessment.version by 1"

      - from: ASSESSED
        to: STALE
        trigger: "system: hop 2 of the HazardProfile revision cascade"
        actor: system
        preconditions:
          - "assessment.assessed_profile_version < HazardProfile.published_version after hop 1"
        side_effects:
          - "retains vulnerability_score and vulnerability_band as the stale reading"
          - "increments VulnerabilityAssessment.version by 1"

  - entity: AdaptationProject
    state_field: screening_status
    initial_state: PROPOSED
    terminal_states: [SCREENED_OUT]
    note: >-
      AdaptationProject carries FOUR independent state dimensions on one row (screening_status,
      analysis_status, program_status, implementation_status). They advance on different triggers by
      different actors and are never collapsed into a single status field; a project can be
      SCREENED_IN + BCA_STALE + AWARDED + AT_RISK at once.
    transitions:
      - from: PROPOSED
        to: SCREENED_IN
        trigger: "POST /resilience/projects/{project_id}/screen"
        actor: RegionalAdministrator
        preconditions:
          - "project.screening_status == PROPOSED, else ERR_PROJECT_ALREADY_SCREENED"
          - "calculations.strategy_screen_score screen_score >= 0.4500"
        side_effects:
          - "writes AdaptationProject.escalated_cost_cents, admin_fee_cents, total_program_cost_cents and grant_match_share_bps from calculations.program_cost_stack"
          - "writes AdaptationProject.screen_score from calculations.strategy_screen_score"
          - "increments AdaptationProject.version by 1"

      - from: PROPOSED
        to: SCREENED_OUT
        trigger: "POST /resilience/projects/{project_id}/screen"
        actor: RegionalAdministrator
        preconditions:
          - "project.screening_status == PROPOSED"
          - "calculations.strategy_screen_score screen_score < 0.4500"
        side_effects:
          - "writes escalated_cost_cents, admin_fee_cents, total_program_cost_cents, grant_match_share_bps and screen_score exactly as on the SCREENED_IN edge"
          - "increments AdaptationProject.version by 1"

      - from: SCREENED_IN
        to: SCREENED_OUT
        trigger: "system: PlanCycle ENDORSEMENT_ROUND -> FAILED cascade"
        actor: system
        preconditions:
          - "project.program_status == UNPROGRAMMED"
        side_effects:
          - "increments AdaptationProject.version by 1"
        note: "Fan-out cascade: a project already PROGRAMMED keeps its screening_status SCREENED_IN when the cycle fails."

  - entity: AdaptationProject
    state_field: analysis_status
    initial_state: NOT_ANALYZED
    terminal_states: []
    transitions:
      - from: NOT_ANALYZED
        to: BCA_PENDING
        trigger: "POST /resilience/projects/{project_id}/analyses"
        actor: ProjectSponsor
        preconditions:
          - "project.screening_status == SCREENED_IN, else ERR_PROJECT_NOT_SCREENED_IN"
          - "COUNT(ProjectAssetLink WHERE project_id == project.id) >= 1, else ERR_NO_LINKED_ASSETS"
          - "every LifelineAsset linked through ProjectAssetLink has criticality_status == RANKED, else ERR_ASSET_RANKING_REQUIRED"
        side_effects:
          - "creates a BenefitCostAnalysis in status DRAFT carrying benefit_measure_cents, cost_measure_cents, bcr and grant_eligible from calculations.benefit_cost_ratio"
          - "increments AdaptationProject.version by 1"

      - from: BCA_PENDING
        to: BCA_CERTIFIED
        trigger: "POST /resilience/analyses/{analysis_id}/certify"
        actor: BCAReviewer
        preconditions:
          - "analysis.status == DRAFT, else ERR_ANALYSIS_NOT_DRAFT"
          - "X-User-ID != analysis.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "analysis.bcr >= 1.0000, else ERR_BCR_BELOW_FLOOR"
        side_effects:
          - "sets BenefitCostAnalysis.status = CERTIFIED, certified_by_user_id = X-User-ID, certified_at = logical clock instant, stale_reason = NONE"
          - "increments AdaptationProject.version by 1"

      - from: BCA_PENDING
        to: BCA_REJECTED
        trigger: "POST /resilience/analyses/{analysis_id}/reject"
        actor: BCAReviewer
        preconditions:
          - "analysis.status == DRAFT, else ERR_ANALYSIS_NOT_DRAFT"
          - "X-User-ID != analysis.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets BenefitCostAnalysis.status = REJECTED"
          - "increments AdaptationProject.version by 1"

      - from: BCA_REJECTED
        to: BCA_PENDING
        trigger: "POST /resilience/projects/{project_id}/analyses"
        actor: ProjectSponsor
        preconditions:
          - "project.analysis_status IN {NOT_ANALYZED, BCA_REJECTED, BCA_STALE}"
          - "no BenefitCostAnalysis for the project is in status CERTIFIED, else ERR_BCA_ALREADY_CERTIFIED"
        side_effects:
          - "creates a fresh DRAFT BenefitCostAnalysis; the rejected one keeps status REJECTED"
          - "increments AdaptationProject.version by 1"
        note: "Second cycle in the machine: a rejected analysis can be re-prepared without re-screening the project."

      - from: BCA_STALE
        to: BCA_PENDING
        trigger: "POST /resilience/projects/{project_id}/analyses"
        actor: ProjectSponsor
        preconditions:
          - "project.analysis_status == BCA_STALE"
          - "every LifelineAsset linked through ProjectAssetLink has criticality_status == RANKED, else ERR_ASSET_RANKING_REQUIRED"
        side_effects:
          - "creates a fresh DRAFT BenefitCostAnalysis computed against the re-ranked assets"
          - "increments AdaptationProject.version by 1"

      - from: BCA_CERTIFIED
        to: BCA_STALE
        trigger: "system: hop 4 of the HazardProfile revision cascade, or POST /resilience/projects/{project_id}/asset-links on a project whose analysis is CERTIFIED"
        actor: system
        preconditions:
          - "a linked LifelineAsset flipped to RECOMPUTE_REQUIRED (stale_reason = ASSET_RECOMPUTE), or a new ProjectAssetLink changed the benefit input set (stale_reason = LINK_ADDED)"
        side_effects:
          - "sets the CERTIFIED BenefitCostAnalysis to status STALE with the matching stale_reason"
          - "increments AdaptationProject.version by 1"

  - entity: AdaptationProject
    state_field: program_status
    initial_state: UNPROGRAMMED
    terminal_states: [AWARDED, WITHDRAWN]
    transitions:
      - from: UNPROGRAMMED
        to: PROGRAMMED
        trigger: "POST /resilience/capital-programs/{program_id}/allocations"
        actor: RegionalAdministrator
        preconditions:
          - "project.program_status == UNPROGRAMMED, else ERR_PROJECT_ALREADY_PROGRAMMED"
          - "project.analysis_status == BCA_CERTIFIED, else ERR_BCA_NOT_CERTIFIED"
          - "every LifelineAsset linked through ProjectAssetLink has criticality_status == RANKED, else ERR_ASSET_RANKING_REQUIRED"
          - "expected_capital_program_version == capital_program.version, else ERR_STALE_PROGRAM_VERSION"
          - "allocated_cents <= project.total_program_cost_cents, else ERR_ALLOCATION_EXCEEDS_PROJECT_COST"
          - "allocated_cents <= capital_program.available_cents, else ERR_PROGRAM_FUNDS_EXCEEDED"
          - "project.equity_benefit_share_bps >= capital_program.equity_target_bps OR project.equity_waiver_granted == true, else ERR_EQUITY_FLOOR_NOT_MET"
        side_effects:
          - "sets AdaptationProject.capital_program_id = program.id and allocated_cents from the request"
          - "writes AdaptationProject.priority_score from calculations.project_priority_score"
          - "recomputes CapitalProgram.committed_cents, available_cents, equity_committed_cents, equity_achieved_bps and funding_posture per calculations.program_funding_ledger"
          - "when the recomputed funding_posture == CLOSED, sets grant_hold_flag = true on every AdaptationProject WHERE capital_program_id == program.id AND program_status == PROGRAMMED"
          - "increments CapitalProgram.version by 1"
          - "increments AdaptationProject.version by 1"

      - from: PROGRAMMED
        to: GRANT_SUBMITTED
        trigger: "POST /resilience/projects/{project_id}/grant-submission"
        actor: ProjectSponsor
        preconditions:
          - "project.program_status == PROGRAMMED, else ERR_PROJECT_NOT_PROGRAMMED"
          - "project.grant_hold_flag == false, else ERR_GRANT_ON_HOLD"
          - "the CERTIFIED BenefitCostAnalysis has grant_eligible == true, else ERR_BCR_BELOW_FLOOR"
          - "project.prerequisite_project_id is null OR the prerequisite AdaptationProject.program_status == AWARDED, else ERR_PREREQUISITE_NOT_AWARDED"
        side_effects:
          - "sets AdaptationProject.grant_funder and grant_submitted_at"
          - "increments AdaptationProject.version by 1"

      - from: GRANT_SUBMITTED
        to: AWARDED
        trigger: "POST /resilience/projects/{project_id}/grant-award"
        actor: RegionalAdministrator
        preconditions:
          - "project.program_status == GRANT_SUBMITTED, else ERR_PROJECT_NOT_PROGRAMMED"
          - "project.analysis_status == BCA_CERTIFIED, else ERR_BCA_NOT_CERTIFIED"
        side_effects:
          - "sets AdaptationProject.implementation_status = NOT_STARTED (unchanged) and awarded_at"
          - "increments AdaptationProject.version by 1"

      - from: PROGRAMMED
        to: WITHDRAWN
        trigger: "POST /resilience/projects/{project_id}/withdraw"
        actor: ProjectSponsor
        preconditions:
          - "project.program_status IN {PROGRAMMED, GRANT_SUBMITTED}, else ERR_PROJECT_NOT_PROGRAMMED"
        side_effects:
          - "hop 1: sets program_status = WITHDRAWN and allocated_cents = 0; capital_program_id is retained for audit"
          - "hop 2: BECAUSE the project left the committed set, CapitalProgram.committed_cents decreases by the released amount and available_cents increases by exactly the same amount, so committed_cents + available_cents == authorized_cents still holds; equity_committed_cents and equity_achieved_bps are recomputed over the surviving set"
          - "hop 3: BECAUSE available_cents rose above zero, CapitalProgram.funding_posture is recomputed by calculations.program_funding_ledger and leaves CLOSED"
          - "hop 4: BECAUSE the posture left CLOSED, grant_hold_flag is cleared to false on every sibling AdaptationProject WHERE capital_program_id == program.id AND program_status == PROGRAMMED"
          - "increments CapitalProgram.version by 1 and AdaptationProject.version by 1 on every row touched"
        note: "Depth-4 compensating cascade; it exactly reverses the allocation side effects with no ledger drift."

      - from: GRANT_SUBMITTED
        to: WITHDRAWN
        trigger: "POST /resilience/projects/{project_id}/withdraw"
        actor: ProjectSponsor
        preconditions:
          - "project.program_status == GRANT_SUBMITTED"
        side_effects:
          - "identical hops 1-4 as the PROGRAMMED -> WITHDRAWN edge; grant_funder and grant_submitted_at are retained"

  - entity: AdaptationProject
    state_field: implementation_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: ON_TRACK
        trigger: "POST /resilience/projects/{project_id}/indicator-reports"
        actor: ProjectSponsor
        preconditions:
          - "project.program_status == AWARDED, else ERR_PROJECT_NOT_PROGRAMMED"
          - "project.indicator_code is not null AND project.indicator_target_value is not null, else ERR_INDICATOR_NOT_DEFINED"
          - "calculations.indicator_attainment indicator_attainment_pct >= 90.00"
        side_effects:
          - "writes indicator_attainment_pct and increments reported_period_count by 1"
          - "increments AdaptationProject.version by 1"

      - from: NOT_STARTED
        to: AT_RISK
        trigger: "POST /resilience/projects/{project_id}/indicator-reports"
        actor: ProjectSponsor
        preconditions:
          - "project.program_status == AWARDED"
          - "70.00 <= calculations.indicator_attainment indicator_attainment_pct < 90.00"
        side_effects:
          - "writes indicator_attainment_pct and increments reported_period_count by 1"

      - from: NOT_STARTED
        to: OFF_TRACK
        trigger: "POST /resilience/projects/{project_id}/indicator-reports"
        actor: ProjectSponsor
        preconditions:
          - "project.program_status == AWARDED"
          - "calculations.indicator_attainment indicator_attainment_pct < 70.00"
        side_effects:
          - "writes indicator_attainment_pct and increments reported_period_count by 1"

      - from: ON_TRACK
        to: AT_RISK
        trigger: "POST /resilience/projects/{project_id}/indicator-reports"
        actor: ProjectSponsor
        preconditions:
          - "70.00 <= indicator_attainment_pct < 90.00 for the newly reported period"
        side_effects:
          - "overwrites indicator_attainment_pct with the newest period's value and increments reported_period_count by 1"

      - from: OFF_TRACK
        to: ON_TRACK
        trigger: "POST /resilience/projects/{project_id}/indicator-reports"
        actor: ProjectSponsor
        preconditions:
          - "indicator_attainment_pct >= 90.00 for the newly reported period"
        side_effects:
          - "overwrites indicator_attainment_pct and increments reported_period_count by 1"
        note: "Recovery edge: implementation_status is fully re-derivable in both directions from the latest report."

  - entity: BenefitCostAnalysis
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /resilience/analyses/{analysis_id}/certify"
        actor: BCAReviewer
        preconditions:
          - "analysis.status == DRAFT, else ERR_ANALYSIS_NOT_DRAFT"
          - "no other BenefitCostAnalysis for the same project_id is in status CERTIFIED, else ERR_BCA_ALREADY_CERTIFIED"
          - "X-User-ID != analysis.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "analysis.bcr >= 1.0000, else ERR_BCR_BELOW_FLOOR"
        side_effects:
          - "sets certified_by_user_id, certified_at and stale_reason = NONE"
          - "moves the owning AdaptationProject.analysis_status to BCA_CERTIFIED"
          - "increments BenefitCostAnalysis.version by 1"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /resilience/analyses/{analysis_id}/reject"
        actor: BCAReviewer
        preconditions:
          - "analysis.status == DRAFT, else ERR_ANALYSIS_NOT_DRAFT"
          - "X-User-ID != analysis.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "moves the owning AdaptationProject.analysis_status to BCA_REJECTED"
          - "increments BenefitCostAnalysis.version by 1"

      - from: CERTIFIED
        to: STALE
        trigger: "system: hop 4 of the HazardProfile revision cascade, or POST /resilience/projects/{project_id}/asset-links"
        actor: system
        preconditions:
          - "analysis.status == CERTIFIED"
        side_effects:
          - "sets stale_reason = ASSET_RECOMPUTE when a linked asset flipped to RECOMPUTE_REQUIRED, or LINK_ADDED when a new ProjectAssetLink changed the benefit input set"
          - "moves the owning AdaptationProject.analysis_status to BCA_STALE"
          - "increments BenefitCostAnalysis.version by 1"

  - entity: EngagementSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /resilience/engagement-sessions/{session_id}/complete"
        actor: JurisdictionDelegate
        preconditions:
          - "session.status == SCHEDULED, else ERR_SESSION_NOT_SCHEDULED"
          - "disadvantaged_attendee_count <= attendee_count, else ERR_ATTENDANCE_MISMATCH"
        side_effects:
          - "writes attendee_count, disadvantaged_attendee_count, preferred_strategy_type and equity_reach_bps from calculations.engagement_equity_reach"
          - "increments EngagementSession.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: PlanCycle ENDORSEMENT_ROUND -> FAILED cascade"
        actor: system
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "leaves attendee_count and disadvantaged_attendee_count null; a CANCELLED session never counts toward required_session_count and is excluded from calculations.session_window_conflict"
          - "increments EngagementSession.version by 1"

  - entity: MutualAidCommitment
    initial_state: COMMITTED
    terminal_states: [RELEASED, FULFILLED]
    transitions:
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /resilience/mutual-aid-commitments/{commitment_id}/release"
        actor: JurisdictionDelegate
        preconditions:
          - "commitment.status == COMMITTED, else ERR_COMMITMENT_NOT_ACTIVE"
        side_effects:
          - "recomputes MutualAidPact.reserved_units and free_units per calculations.aid_unit_ledger so that reserved_units + free_units == pledged_units still holds"
          - "recomputes MutualAidPact.status (EXHAUSTED may revert to OPEN)"
          - "increments MutualAidPact.version by 1 and MutualAidCommitment.version by 1"
        note: "Compensating edge: releasing restores reserved_units and free_units to the exact values they held before this commitment was admitted, with no drift."

      - from: COMMITTED
        to: FULFILLED
        trigger: "POST /resilience/mutual-aid-commitments/{commitment_id}/fulfill"
        actor: JurisdictionDelegate
        preconditions:
          - "commitment.status == COMMITTED, else ERR_COMMITMENT_NOT_ACTIVE"
        side_effects:
          - "sets fulfilled_at to the logical clock instant"
          - "reserved_units is unchanged because FULFILLED remains inside the reserved set; free_units is unchanged"
          - "increments MutualAidCommitment.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (optimistic concurrency control)
# =============================================================================
concurrency_rules:
  - name: program-allocation-stale-program
    parent_entity: CapitalProgram
    write_endpoint: "POST /resilience/capital-programs/{program_id}/allocations"
    occ_field: expected_capital_program_version
    error_id: ERR_STALE_PROGRAM_VERSION
    status: 412
    rationale: >-
      Allocating capital to a project reads CapitalProgram.available_cents and writes back
      committed_cents, available_cents, equity_achieved_bps and funding_posture. A caller that
      allocated against a version it read before an earlier allocation landed would overwrite the
      ledger, so the request must carry the version it read.
    version_semantics: >-
      The request must supply expected_capital_program_version. The server compares it against the
      stored CapitalProgram.version and rejects a mismatch with ERR_STALE_PROGRAM_VERSION (412)
      before any ledger field is touched. On success CapitalProgram.version is incremented by 1, so
      replaying the identical request with the same expected version is rejected on the second call.

  - name: aid-commitment-stale-pact
    parent_entity: MutualAidPact
    write_endpoint: "POST /resilience/mutual-aid-pacts/{pact_id}/commitments"
    occ_field: expected_mutual_aid_pact_version
    error_id: ERR_STALE_PACT_VERSION
    status: 412
    rationale: >-
      Committing units reads MutualAidPact.free_units and the pact's existing commitment windows to
      evaluate peak overlap load, then writes reserved_units, free_units and status. A caller holding
      a version read before another commitment landed would over-commit the pledge.
    version_semantics: >-
      The request must supply expected_mutual_aid_pact_version. A mismatch against the stored
      MutualAidPact.version is rejected with ERR_STALE_PACT_VERSION (412) before capacity is
      evaluated. On success MutualAidPact.version is incremented by 1.

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: svi_tier_assignment
    entity: Jurisdiction
    output_fields: [svi_tier, disadvantaged_flag]
    algorithm_type: threshold
    trigger: "on Jurisdiction creation and on any PATCH that supplies svi_score"
    constants:
      SVI_TIER_SEVERE_FLOOR: 0.75
      SVI_TIER_HIGH_FLOOR: 0.50
      SVI_TIER_MODERATE_FLOOR: 0.25
    formula: |
      svi_tier =
        SEVERE   when svi_score >= 0.75
        HIGH     when svi_score >= 0.50 and svi_score < 0.75
        MODERATE when svi_score >= 0.25 and svi_score < 0.50
        LOW      otherwise
      disadvantaged_flag = (svi_tier IN {HIGH, SEVERE})
    precision: "svi_score is a Decimal with 2 fractional digits; comparisons are exact Decimal comparisons, never float"
    worked_examples:
      - "svi_score 0.62 -> HIGH, disadvantaged_flag true"
      - "svi_score 0.18 -> LOW, disadvantaged_flag false"
      - "svi_score 0.81 -> SEVERE, disadvantaged_flag true"
      - "svi_score 0.40 -> MODERATE, disadvantaged_flag false"
      - "svi_score 0.50 -> HIGH (floor is inclusive), disadvantaged_flag true"
      - "svi_score 0.25 -> MODERATE, disadvantaged_flag false"
      - "svi_score 0.24 -> LOW, disadvantaged_flag false"
      - "svi_score 0.75 -> SEVERE, disadvantaged_flag true"

  - name: vulnerability_score
    entity: VulnerabilityAssessment
    output_fields: [vulnerability_score, vulnerability_band]
    algorithm_type: weighted_scoring
    trigger: "POST /resilience/vulnerability-assessments/{assessment_id}/assess"
    variants:
      - name: COMPOSITE_MULTIPLICATIVE
        selected_when: "assessment.method == COMPOSITE_MULTIPLICATIVE"
      - name: ADDITIVE_WEIGHTED
        selected_when: "assessment.method == ADDITIVE_WEIGHTED"
    constants:
      SVI_MULTIPLIER: { LOW: 1.00, MODERATE: 1.10, HIGH: 1.25, SEVERE: 1.40 }
      SUBJECT_UPLIFT: { INFRASTRUCTURE: 0.00, POPULATION: 0.05, ECONOMIC_SECTOR: 0.03 }
      ADDITIVE_WEIGHTS: { exposure: 0.40, sensitivity: 0.35, adaptive_gap: 0.25 }
      SCORE_CEILING: 1.00
      SCORE_FLOOR: 0.00
      BAND_EXTREME_FLOOR: 0.75
      BAND_HIGH_FLOOR: 0.50
      BAND_MODERATE_FLOOR: 0.25
    formula: |
      E = HazardProfile(assessment.hazard_profile_id).exposure_index
      S = assessment.sensitivity_score
      A = assessment.adaptive_capacity_score
      M = SVI_MULTIPLIER[Jurisdiction(LifelineAsset(assessment.asset_id).jurisdiction_id).svi_tier]
            when assessment.svi_overlay_applied == true, else 1.00
      U = SUBJECT_UPLIFT[assessment.subject_type]

      variant COMPOSITE_MULTIPLICATIVE: raw = E * S * (1 - A)
      variant ADDITIVE_WEIGHTED:        raw = 0.40 * E + 0.35 * S + 0.25 * (1 - A)

      vulnerability_score = round_half_up( min(1.00, max(0.00, raw * M + U)), 2 )

      vulnerability_band =
        EXTREME  when vulnerability_score >= 0.75
        HIGH     when vulnerability_score >= 0.50
        MODERATE when vulnerability_score >= 0.25
        LOW      otherwise
    precision: >-
      All arithmetic is Decimal with ROUND_HALF_UP. The ceiling/floor clamp is applied to the
      unrounded value, then the clamped value is rounded to 2 fractional digits; the band is read off
      the rounded score, never the unrounded one.
    variant_divergence_note: >-
      The two variants are not monotone transforms of one another. Multiplicative collapses toward
      zero when any factor is small; additive keeps a floor contribution from every dimension. The
      same inputs therefore land in different bands.
    worked_examples:
      - "E 0.80, S 0.60, A 0.50, svi_tier HIGH (M 1.25), INFRASTRUCTURE (U 0.00), COMPOSITE_MULTIPLICATIVE: raw = 0.80*0.60*0.50 = 0.24; 0.24*1.25 + 0.00 = 0.30 -> score 0.30, band MODERATE"
      - "same inputs, ADDITIVE_WEIGHTED: raw = 0.32 + 0.21 + 0.125 = 0.655; 0.655*1.25 = 0.81875 -> score 0.82, band EXTREME"
      - "same inputs, ADDITIVE_WEIGHTED with svi_overlay_applied false (M 1.00): raw 0.655 -> score 0.66, band HIGH"
      - "E 0.80, S 0.60, A 0.50, svi_tier SEVERE (M 1.40), POPULATION (U 0.05), ADDITIVE_WEIGHTED: 0.655*1.40 + 0.05 = 0.967 -> score 0.97, band EXTREME"
      - "E 0.80, S 0.60, A 0.50, svi_tier LOW (M 1.00), INFRASTRUCTURE, COMPOSITE_MULTIPLICATIVE: 0.24 -> score 0.24, band LOW"
      - "after the hazard revision raises E to 0.90: ADDITIVE_WEIGHTED, HIGH, INFRASTRUCTURE: raw = 0.36 + 0.21 + 0.125 = 0.695; *1.25 = 0.86875 -> score 0.87, band EXTREME"

  - name: asset_consequence_score
    entity: LifelineAsset
    output_fields: [consequence_score, criticality_tier, dependency_depth]
    algorithm_type: topological
    trigger: "POST /resilience/assets/{asset_id}/criticality-ranking"
    input_set: >-
      Every VulnerabilityAssessment WHERE asset_id == asset.id AND status == ASSESSED. Rows in
      status DRAFT or STALE are excluded. An empty input set is rejected with
      ERR_NO_ASSESSED_VULNERABILITY.
    constants:
      DEPTH_STEP: 0.15
      MAX_DEPTH_COUNTED: 3
      SHARED_UPLIFT: 1.20
      POP_CAP: 250000
      VALUE_NORMALIZER_CENTS: 100000000
      TIER_1_FLOOR: 25.00
      TIER_2_FLOOR: 8.00
    formula: |
      dependency_depth = number of hops from this asset to the root of its upstream_asset_id chain
        (an asset with upstream_asset_id == null has dependency_depth 0). While walking the chain,
        any id seen twice is rejected with ERR_ASSET_DEPENDENCY_CYCLE.

      peak_vuln            = max(vulnerability_score over the input set)
      exposure_value_cents = round_half_up( replacement_value_cents * (1 - redundancy_factor) )
      cascade_factor       = 1.00 + 0.15 * min(dependency_depth, 3)
      shared_factor        = 1.20 when asset.is_shared == true, else 1.00
      population_weight    = min(250000, service_population) / 250000

      consequence_score = round_half_up(
          (exposure_value_cents / 100000000)
          * peak_vuln
          * cascade_factor
          * shared_factor
          * (1 + population_weight),
        2 )

      criticality_tier =
        TIER_1 when consequence_score >= 25.00
        TIER_2 when consequence_score >= 8.00
        TIER_3 otherwise
    precision: >-
      exposure_value_cents is rounded to whole cents with ROUND_HALF_UP before the division;
      consequence_score is rounded once at the end to 2 fractional digits. min(dependency_depth, 3)
      caps the cascade factor at 1.45 no matter how deep the chain runs.
    worked_examples:
      - "A1: replacement 1200000000, redundancy 0.25, service_population 150000, is_shared true, upstream null, peak_vuln 0.82 -> exposure_value 900000000, cascade 1.00, shared 1.20, population_weight 0.6, score = 9.00*0.82*1.00*1.20*1.60 = 14.1696 -> 14.17, TIER_2"
      - "same asset with dependency_depth 1: cascade 1.15 -> 16.2950 -> 16.30, TIER_2"
      - "same asset with is_shared false and peak_vuln 0.30: 9.00*0.30*1.00*1.00*1.60 = 4.32 -> TIER_3"
      - "A2: replacement 400000000, redundancy 0.10, service_population 40000, is_shared false, peak_vuln 0.30 -> exposure_value 360000000, population_weight 0.16, score = 3.60*0.30*1.00*1.00*1.16 = 1.2528 -> 1.25, TIER_3"
      - "an asset whose only VulnerabilityAssessment rows are STALE -> ERR_NO_ASSESSED_VULNERABILITY, no partial write"

  - name: program_cost_stack
    entity: AdaptationProject
    output_fields: [escalated_cost_cents, admin_fee_cents, total_program_cost_cents, grant_match_share_bps]
    algorithm_type: tiered_pricing
    trigger: "POST /resilience/projects/{project_id}/screen"
    constants:
      ESCALATION_BPS: { PROTECT: 1200, ACCOMMODATE: 800, RETREAT: 1500, AVOID: 500 }
      ADMIN_RATE_TIERS:
        - { keyed_on: escalated_cost_cents, floor_cents: 0,         ceiling_cents_exclusive: 50000000,   rate_bps: 900 }
        - { keyed_on: escalated_cost_cents, floor_cents: 50000000,  ceiling_cents_exclusive: 500000000,  rate_bps: 600 }
        - { keyed_on: escalated_cost_cents, floor_cents: 500000000, ceiling_cents_exclusive: null,       rate_bps: 350 }
      MATCH_SHARE_TIERS:
        - { keyed_on: total_program_cost_cents, floor_cents: 0,          ceiling_cents_exclusive: 100000000,  share_bps: 2500 }
        - { keyed_on: total_program_cost_cents, floor_cents: 100000000,  ceiling_cents_exclusive: 1000000000, share_bps: 3000 }
        - { keyed_on: total_program_cost_cents, floor_cents: 1000000000, ceiling_cents_exclusive: null,       share_bps: 3500 }
    evaluation_order_is_normative: true
    formula: |
      STEP 1  escalated_cost_cents = round_half_up(
                 base_cost_cents * (1 + ESCALATION_BPS[strategy_type] / 10000) )
      STEP 2  admin_rate_bps = the ADMIN_RATE_TIERS row whose [floor_cents, ceiling_cents_exclusive)
                 contains **escalated_cost_cents**   <-- keyed on the STEP 1 result, NOT on the total
      STEP 3  admin_fee_cents = round_half_up( escalated_cost_cents * admin_rate_bps / 10000 )
      STEP 4  total_program_cost_cents = escalated_cost_cents + admin_fee_cents
      STEP 5  grant_match_share_bps = the MATCH_SHARE_TIERS row whose
                 [floor_cents, ceiling_cents_exclusive) contains **total_program_cost_cents**

      STEP 2 is never re-evaluated after STEP 4. Adding the admin fee can push the running amount
      across the 50000000 boundary, but the admin rate stays the one selected in STEP 2.
    precision: >-
      Each of STEP 1 and STEP 3 rounds to whole cents with ROUND_HALF_UP independently; STEP 4 is
      exact integer addition of the two already-rounded amounts.
    worked_examples:
      - "P1: base 42000000, PROTECT (1200 bps): STEP 1 42000000*1.12 = 47040000; STEP 2 47040000 < 50000000 -> 900 bps; STEP 3 4233600; STEP 4 51273600; STEP 5 51273600 < 100000000 -> 2500 bps"
      - "P1 trap: keying the admin rate on the total instead would pick 600 bps -> fee 2822400 and total 49862400, which is wrong"
      - "P2: base 30000000, ACCOMMODATE (800 bps): STEP 1 32400000; STEP 2 900 bps; STEP 3 2916000; STEP 4 35316000; STEP 5 2500 bps"

  - name: strategy_screen_score
    entity: AdaptationProject
    output_fields: [screen_score, screening_status]
    algorithm_type: weighted_scoring
    trigger: "POST /resilience/projects/{project_id}/screen"
    depends_on: program_cost_stack
    constants:
      SCREEN_WEIGHTS: { cost: 0.40, cobenefit: 0.25, feasibility: 0.35 }
      COBENEFIT_MAX: 20
      COST_NORMALIZER_CENTS: 200000000
      SCREEN_IN_FLOOR: 0.4500
    formula: |
      cost_component = 1 - min(1.00, total_program_cost_cents / 200000000)
      screen_score = round_half_up(
          0.40 * cost_component
        + 0.25 * (cobenefit_points / 20)
        + 0.35 * feasibility_score,
        4 )
      screening_status = SCREENED_IN when screen_score >= 0.4500, else SCREENED_OUT
    precision: >-
      cost_component is carried unrounded into the weighted sum; the sum is rounded once to 4
      fractional digits and the SCREEN_IN_FLOOR comparison uses the rounded value.
    worked_examples:
      - "P1: total 51273600, cobenefit 12, feasibility 0.70 -> cost_component = 1 - 0.256368 = 0.743632; 0.2974528 + 0.15 + 0.245 = 0.6924528 -> 0.6925, SCREENED_IN"
      - "P2: total 35316000, cobenefit 10, feasibility 0.65 -> cost_component 0.82342; 0.329368 + 0.125 + 0.2275 = 0.681868 -> 0.6819, SCREENED_IN"
      - "a project whose total_program_cost_cents exceeds 200000000 has cost_component clamped to 0, never negative"

  - name: benefit_cost_ratio
    entity: BenefitCostAnalysis
    output_fields: [benefit_measure_cents, cost_measure_cents, bcr, grant_eligible]
    algorithm_type: forward_looking
    trigger: "POST /resilience/projects/{project_id}/analyses"
    input_set: >-
      Every ProjectAssetLink WHERE project_id == project.id, processed in link_sequence ASC order
      (link_sequence is assigned 1, 2, 3 ... by created_at ASC at link creation). An empty input set
      is rejected with ERR_NO_LINKED_ASSETS.
    variants:
      - name: DISCOUNTED_NPV
        selected_when: "analysis.method == DISCOUNTED_NPV"
      - name: ANNUALIZED_EQUIVALENT
        selected_when: "analysis.method == ANNUALIZED_EQUIVALENT"
    constants:
      OM_RATE: 0.02
      BCR_ELIGIBILITY_FLOOR: 1.0000
      DEFAULT_DISCOUNT_RATE_BPS: 700
    evaluation_order_is_normative: true
    formula: |
      r = analysis.discount_rate_bps / 10000
      n = project.service_life_years
      C = project.total_program_cost_cents

      variant DISCOUNTED_NPV:
        annuity_factor af = (1 - (1 + r) ** -n) / r          # carried at full Decimal precision
        for each link i in link_sequence ASC:
            per_link_pv[i] = round_half_up( link[i].avoided_loss_annual_cents * af )   # whole cents
        benefit_measure_cents = sum(per_link_pv)              # ROUND PER LINK, THEN SUM
        cost_measure_cents    = C + round_half_up( C * 0.02 * af )

      variant ANNUALIZED_EQUIVALENT:
        benefit_measure_cents = sum( link[i].avoided_loss_annual_cents )   # undiscounted, exact
        cost_measure_cents    = round_half_up( C / n ) + round_half_up( C * 0.02 )

      bcr           = round_half_up( benefit_measure_cents / cost_measure_cents, 4 )
      grant_eligible = ( bcr >= 1.0000 )      # compared on the ROUNDED bcr
    precision: >-
      The rounding ORDER is normative for DISCOUNTED_NPV: each link's present value is rounded to
      whole cents first and the rounded amounts are summed. Summing the raw products and rounding
      once at the end yields a different benefit_measure_cents. bcr is rounded to exactly 4
      fractional digits and the eligibility floor is compared against that rounded value.
    variant_divergence_note: >-
      DISCOUNTED_NPV discounts the benefit stream but also loads 30 years of discounted O&M onto the
      cost; ANNUALIZED_EQUIVALENT uses one undiscounted year of benefit against one straight-line
      year of capital plus one year of O&M. The two are not reciprocals and routinely land on
      opposite sides of the 1.0000 grant floor.
    worked_examples:
      - "single link 3333333, C 51273600, n 30, r 0.07 (af = 12.409041183505859...): DISCOUNTED_NPV benefit 41363466, cost 51273600 + 12725124 = 63998724, bcr 0.6463, grant_eligible false"
      - "same data ANNUALIZED_EQUIVALENT: benefit 3333333, cost round_half_up(51273600/30) + round_half_up(51273600*0.02) = 1709120 + 1025472 = 2734592, bcr 1.2190, grant_eligible true"
      - "three links 3333333 / 2777777 / 1111111, C 51273600, n 30, r 0.07, DISCOUNTED_NPV: per-link PVs 41363466 + 34469549 + 13787822 = 89620837; summing raw then rounding once would give 89620838, one cent higher and therefore wrong; cost 63998724, bcr 1.4004"
      - "same three links ANNUALIZED_EQUIVALENT: benefit 7222221, cost 2734592, bcr 2.6411"
      - "exact-floor case: P2 with C 35316000, n 25, single link 2118960, ANNUALIZED_EQUIVALENT: cost = round_half_up(35316000/25) + round_half_up(35316000*0.02) = 1412640 + 706320 = 2118960, bcr exactly 1.0000, grant_eligible true"
      - "boundary trap: the same setup with link 2118959 still rounds to bcr 1.0000 and is grant_eligible; link 2000000 gives 0.9439 and is not"
      - "P2 setup under DISCOUNTED_NPV (af(0.07, 25) = 11.653583178253719...): benefit 24693477, cost 35316000 + 8231159 = 43547159, bcr 0.5671, grant_eligible false"

  - name: project_priority_score
    entity: AdaptationProject
    output_fields: [priority_score, equity_benefit_share_bps]
    algorithm_type: weighted_scoring
    trigger: "POST /resilience/capital-programs/{program_id}/allocations"
    input_set: >-
      The single BenefitCostAnalysis for the project with status CERTIFIED, plus every
      ProjectAssetLink for the project and the LifelineAsset each one points at.
    constants:
      PRIORITY_WEIGHTS: { bcr: 0.45, criticality: 0.30, equity: 0.25 }
      BCR_CAP: 3.0000
      TIER_POINTS: { TIER_1: 1.00, TIER_2: 0.60, TIER_3: 0.30 }
    formula: |
      normalized_bcr = min(3.0000, certified_analysis.bcr) / 3.0000

      criticality_component = max( TIER_POINTS[LifelineAsset(link.asset_id).criticality_tier]
                                   over every ProjectAssetLink of the project )

      equity_benefit_share_bps = floor( 10000
          * sum(link.avoided_loss_annual_cents WHERE link.benefit_reaches_disadvantaged == true)
          / sum(link.avoided_loss_annual_cents over all links) )
      equity_component = min(1.0000, equity_benefit_share_bps / 10000)

      priority_score = round_half_up(
          0.45 * normalized_bcr + 0.30 * criticality_component + 0.25 * equity_component, 4 )
    precision: >-
      normalized_bcr and equity_component are carried unrounded into the weighted sum; only
      priority_score is rounded, to 4 fractional digits. equity_benefit_share_bps uses floor, never
      round, so a share of 61.53% is 6153 bps and never 6154.
    worked_examples:
      - "P1: certified bcr 0.6463, best linked tier TIER_2 (0.60), equity 10000 bps -> 0.45*0.215433... + 0.18 + 0.25 = 0.526945 -> 0.5269"
      - "P2: certified bcr 1.0000, TIER_2, equity 10000 bps -> 0.15 + 0.18 + 0.25 = 0.58 -> 0.5800"
      - "P3: certified bcr 1.4004, TIER_2, equity 6153 bps -> 0.45*0.4668 + 0.18 + 0.153825 = 0.543885 -> 0.5439"
      - "a project with bcr 3.5000 (capped to 3.0000), a TIER_1 asset and equity 0 bps -> 0.45 + 0.30 + 0 = 0.7500"
      - "equity share for links 3333333 (reaches disadvantaged) + 1111111 (reaches disadvantaged) + 2777777 (does not) = floor(10000 * 4444444 / 7222221) = 6153 bps"

  - name: program_funding_ledger
    entity: CapitalProgram
    output_fields: [committed_cents, available_cents, equity_committed_cents, equity_achieved_bps, funding_posture]
    algorithm_type: aggregation
    trigger: >-
      Recomputed from scratch on POST /resilience/capital-programs/{program_id}/allocations and on
      POST /resilience/projects/{project_id}/withdraw.
    input_set: >-
      Every AdaptationProject WHERE capital_program_id == program.id AND program_status IN
      {PROGRAMMED, GRANT_SUBMITTED, AWARDED}. WITHDRAWN and UNPROGRAMMED projects are excluded even
      though a WITHDRAWN project keeps its capital_program_id.
    constants:
      OVERSUBSCRIBED_BPS_FLOOR: 1000
    conserved_quantity: authorized_cents
    invariant: "committed_cents + available_cents == authorized_cents, after every allocation and every withdrawal"
    formula: |
      committed_cents = sum( allocated_cents over the input set )
      available_cents = authorized_cents - committed_cents

      equity_committed_cents = sum( allocated_cents over the input set
                                    WHERE equity_benefit_share_bps >= program.equity_target_bps )
      equity_achieved_bps    = 0 when committed_cents == 0,
                               else floor( 10000 * equity_committed_cents / committed_cents )

      funding_posture =
        CLOSED         when available_cents == 0
        OVERSUBSCRIBED when available_cents > 0
                        and floor( 10000 * available_cents / authorized_cents ) < 1000
        OPEN           otherwise
    precision: "All money is integer cents; the two bps figures use floor division, never rounding."
    worked_examples:
      - "authorized 100000000, one PROGRAMMED project at 51273600 -> committed 51273600, available 48726400, headroom 4872 bps, OPEN"
      - "authorized 60000000, two PROGRAMMED projects at 30000000 each -> committed 60000000, available 0, CLOSED"
      - "authorized 100000000, committed 95000000 -> available 5000000, headroom 500 bps < 1000 -> OVERSUBSCRIBED"
      - "boundary: authorized 100000000, committed 90000000 -> available 10000000, headroom exactly 1000 bps, which is NOT < 1000 -> OPEN"
      - "one cent past the boundary: committed 90000001 -> available 9999999, headroom 999 bps -> OVERSUBSCRIBED"
      - "conservation: authorized 60000000, allocate 30000000 to P2 then 30000000 to P1 -> CLOSED with available 0; withdraw P1 -> committed 30000000, available 30000000, equity_achieved 5000 bps when only P2 clears the target, posture back to OPEN, and 30000000 + 30000000 == 60000000 still holds"

  - name: aid_unit_ledger
    entity: MutualAidPact
    output_fields: [reserved_units, free_units, status]
    algorithm_type: aggregation
    trigger: >-
      Recomputed on POST /resilience/mutual-aid-pacts/{pact_id}/commitments, on
      POST /resilience/mutual-aid-commitments/{commitment_id}/release and on
      POST /resilience/mutual-aid-commitments/{commitment_id}/fulfill.
    input_set: >-
      Every MutualAidCommitment WHERE pact_id == pact.id AND status IN {COMMITTED, FULFILLED}.
      RELEASED commitments are excluded; FULFILLED ones stay inside the reserved set because the
      units were actually consumed.
    conserved_quantity: pledged_units
    invariant: "reserved_units + free_units == pledged_units, after every commit, release and fulfil"
    formula: |
      reserved_units = the PEAK concurrent unit load over the input set, computed exactly as in
        calculations.aid_peak_overlap_capacity:
          0 when the input set is empty, otherwise
          max over t in sorted(distinct window_start over the input set) of
              sum( c.committed_units for c in the input set
                   where c.window_start <= t and t < c.window_end )
      free_units = pledged_units - reserved_units

      Because every commitment is admitted only when that same peak stays within pledged_units,
      reserved_units is always in [0, pledged_units] and free_units is never negative.

      status is evaluated in this exact order:
        EXPIRED   when clock_now >= pact.window_end        <-- checked FIRST, before capacity
        EXHAUSTED when free_units == 0
        OPEN      otherwise
    precision: >-
      Units are non-negative integers; no rounding is involved. reserved_units is a PEAK, not a
      running sum: two 4-unit commitments whose half-open windows do not overlap reserve 4 units,
      not 8.
    worked_examples:
      - "pledged 10 with COMMITTED 4 units over [2026-09-05, 2026-09-15) and COMMITTED 4 units over [2026-09-10, 2026-09-20) -> the windows overlap, so reserved 8, free 2, OPEN"
      - "releasing the second 4-unit commitment -> reserved 4, free 6, still OPEN, and 4 + 6 == 10"
      - "fulfilling a 4-unit commitment leaves reserved_units unchanged at 8 and free_units at 2, because FULFILLED stays inside the input set"
      - "pledged 10 with COMMITTED 4 units over [2026-09-05, 2026-09-15) and COMMITTED 10 units over [2026-09-15, 2026-09-18) -> the windows are adjacent under half-open semantics, so reserved is the peak 10, not the sum 14; free 0, EXHAUSTED"
      - "an expired window with free_units 0 reports EXPIRED, not EXHAUSTED, because the temporal check runs first"

  - name: aid_peak_overlap_capacity
    entity: MutualAidCommitment
    output_fields: []
    algorithm_type: interval_merge
    trigger: "POST /resilience/mutual-aid-pacts/{pact_id}/commitments (admission check only, writes nothing)"
    input_set: >-
      Every MutualAidCommitment WHERE pact_id == pact.id AND status IN {COMMITTED, FULFILLED}, union
      the candidate commitment carried in the request. RELEASED commitments do not consume capacity.
    interval_semantics: half_open
    constants: {}
    formula: |
      Windows are half-open [window_start, window_end): a commitment that ends at exactly the instant
      another one starts does NOT overlap it.

      candidate_set = existing active commitments + the candidate
      for each t in sorted(distinct window_start over candidate_set):
          load(t) = sum( c.committed_units for c in candidate_set
                         where c.window_start <= t and t < c.window_end )
      peak_load = max( load(t) )

      peak_load > pact.pledged_units                -> reject with ERR_AID_CAPACITY_EXCEEDED
      max overlap COUNT at any t >= pact.max_concurrent_commitments
                                                     -> reject with ERR_AID_CONCURRENCY_LIMIT
      candidate.window_start < pact.window_start
        or candidate.window_end > pact.window_end    -> reject with ERR_AID_WINDOW_OUTSIDE_PACT
    precision: >-
      Evaluating load only at window_start instants is sufficient and exact, because the load
      function is a right-continuous step function that can only increase at a window_start.
      Aggregate capacity is checked, not pairwise overlap: three individually admissible commitments
      can still breach the pledge collectively.
    worked_examples:
      - "pledged 10: C1 4 units [2026-09-05, 2026-09-15) plus C2 4 units [2026-09-10, 2026-09-20) -> peak load 8 at 2026-09-10, admitted"
      - "adding C3 3 units [2026-09-12, 2026-09-14) -> load at 2026-09-12 is 4 + 4 + 3 = 11 > 10 -> ERR_AID_CAPACITY_EXCEEDED, even though each commitment alone fits"
      - "half-open adjacency: C1 4 units [2026-09-05, 2026-09-15) plus C4 10 units [2026-09-15, 2026-09-18) -> peak load 10 at 2026-09-15 (C1 has already ended), admitted at exactly the pledge"
      - "with max_concurrent_commitments 3, a fourth window covering the same instant as three others is rejected with ERR_AID_CONCURRENCY_LIMIT even when the unit total fits"

  - name: session_window_conflict
    entity: EngagementSession
    output_fields: []
    algorithm_type: interval_merge
    trigger: "POST /resilience/plan-cycles/{plan_cycle_id}/engagement-sessions (admission check only)"
    input_set: >-
      Every EngagementSession WHERE host_jurisdiction_id == the requested host AND status IN
      {SCHEDULED, COMPLETED}. CANCELLED sessions are excluded and never block a new booking.
    interval_semantics: closed_with_buffer
    constants:
      SESSION_BUFFER_HOURS: 24
    formula: |
      Windows are CLOSED [window_start, window_end] and a symmetric 24-hour travel buffer is added
      to each side, so a host jurisdiction has exclusive occupancy of its window plus the buffer.

      conflict(new, existing) =
          new.window_start <= existing.window_end + 24h
      AND existing.window_start <= new.window_end + 24h

      any conflict -> reject with ERR_SESSION_WINDOW_CONFLICT
    precision: >-
      Deliberately different from aid_peak_overlap_capacity: closed endpoints plus a buffer here,
      half-open aggregate capacity there. Touching endpoints DO conflict for sessions, and a booking
      that starts exactly 24h after the previous session's end still conflicts because the
      comparison is <=.
    worked_examples:
      - "S1 hosted by J_HARBOR runs 2026-09-10T17:00:00Z to 2026-09-10T20:00:00Z; a candidate at 2026-09-11T20:00:00Z to 2026-09-11T22:00:00Z starts exactly 24h after S1's end, so 2026-09-11T20:00:00Z <= 2026-09-11T20:00:00Z holds and the booking is rejected with ERR_SESSION_WINDOW_CONFLICT"
      - "a candidate at 2026-09-12T00:00:00Z to 2026-09-12T02:00:00Z clears the buffer and is admitted"
      - "the same conflicting candidate hosted by J_RIDGE instead is admitted, because occupancy is per host_jurisdiction_id"
      - "once S1 is CANCELLED by a failed plan cycle, the previously conflicting candidate is admitted"

  - name: engagement_equity_reach
    entity: EngagementSession
    output_fields: [equity_reach_bps]
    algorithm_type: aggregation
    trigger: "POST /resilience/engagement-sessions/{session_id}/complete"
    constants: {}
    formula: |
      equity_reach_bps = 0 when attendee_count == 0,
                         else floor( 10000 * disadvantaged_attendee_count / attendee_count )
    precision: "floor division on integers; never rounded up"
    worked_examples:
      - "attendees 120 of which 70 disadvantaged -> floor(700000/120) = 5833 bps"
      - "attendees 80 of which 10 disadvantaged -> 1250 bps"
      - "attendees 100 of which 40 disadvantaged -> 4000 bps"
      - "attendees 0 -> 0 bps, no division by zero"

  - name: endorsement_quorum_tally
    entity: PlanCycle
    output_fields: [achieved_weight_bps, status, revision_count]
    algorithm_type: weighted_scoring
    trigger: >-
      POST /resilience/plan-cycles/{plan_cycle_id}/close-endorsement-round, and read-only through
      GET /resilience/plan-cycles/{plan_cycle_id}/endorsement-tally.
    input_set: >-
      Every Endorsement WHERE plan_cycle_id == plan_cycle.id AND round_number == plan_cycle.round_number
      AND decision IN {ENDORSED, CONDITIONED, VETOED}. Endorsements carrying decision SUPERSEDED, and
      endorsements from earlier rounds, are excluded. The DENOMINATOR is the sum of endorsement_weight
      over Jurisdiction rows WHERE status == ACTIVE; PROBATION and SUSPENDED jurisdictions leave the
      denominator entirely.
    constants:
      CONDITIONED_CREDIT_NUM: 1
      CONDITIONED_CREDIT_DEN: 2
      VETO_BLOCK_WEIGHT: 3
    evaluation_order_is_normative: true
    formula: |
      total_active_weight = sum( endorsement_weight over Jurisdiction WHERE status == ACTIVE )

      supporting_weight = sum( e.weight_at_cast WHERE e.decision == ENDORSED )
                        + floor( sum( e.weight_at_cast WHERE e.decision == CONDITIONED ) * 1 / 2 )
                        # the halving floor is applied ONCE to the SUM of conditioned weights,
                        # never per endorsement

      achieved_weight_bps = 0 when total_active_weight == 0,
                            else floor( 10000 * supporting_weight / total_active_weight )

      veto_weight = sum( e.weight_at_cast WHERE e.decision == VETOED )

      outcome, evaluated in this exact order:
        1. veto_weight >= 3                                -> BLOCKED
        2. achieved_weight_bps >= plan_cycle.quorum_weight_bps -> ADOPTED
        3. otherwise                                       -> SHORT

      Then:
        ADOPTED          -> PlanCycle.status = ADOPTED, adopted_at set
        BLOCKED or SHORT -> REVISION with revision_count + 1 when revision_count + 1 <= max_revision_rounds,
                            otherwise FAILED
    precision: >-
      Step 1 dominates: a blocking veto coalition defeats the plan even when the supporting weight
      clears the quorum. weight_at_cast is frozen on the Endorsement row, so re-weighting a
      jurisdiction after it voted does not change an already-cast endorsement's contribution, but it
      does change total_active_weight.
    worked_examples:
      - "jurisdiction weights 4, 3, 2, 1 (total_active_weight 10), ENDORSED from the 4 and the 3, quorum 6600 -> supporting 7, 7000 bps, ADOPTED"
      - "ENDORSED from the 4 and CONDITIONED from the 3, quorum 6600 -> supporting 4 + floor(3/2) = 5, 5000 bps, SHORT"
      - "same votes with quorum 5000 -> ADOPTED at exactly the quorum boundary"
      - "ENDORSED from 4, 2 and 1 plus VETOED from the 3, quorum 6600 -> supporting 7, 7000 bps clears the quorum, but veto_weight 3 >= 3 so the outcome is BLOCKED"
      - "ENDORSED from the 4 only, quorum 4000 -> 4000 bps, ADOPTED; quorum 4001 -> SHORT"
      - "with the weight-3 jurisdiction SUSPENDED, total_active_weight drops to 7 and a single ENDORSED 4 gives 5714 bps, ADOPTED at quorum 5000"
      - "CONDITIONED from the 3 alone against a 4 + 3 active pool -> supporting floor(3/2) = 1, 1428 bps, SHORT"

  - name: indicator_attainment
    entity: AdaptationProject
    output_fields: [indicator_attainment_pct, implementation_status, reported_period_count]
    algorithm_type: threshold
    trigger: "POST /resilience/projects/{project_id}/indicator-reports"
    constants:
      ON_TRACK_FLOOR: 90.00
      AT_RISK_FLOOR: 70.00
    formula: |
      indicator_attainment_pct = round_half_up( 100 * reported_value / indicator_target_value, 2 )
      implementation_status =
        ON_TRACK  when indicator_attainment_pct >= 90.00
        AT_RISK   when indicator_attainment_pct >= 70.00
        OFF_TRACK otherwise
      reported_period_count = reported_period_count + 1
    precision: >-
      The percentage is rounded to 2 fractional digits first and the band is read off the rounded
      value. Each report overwrites indicator_attainment_pct with the newest period's figure; the
      status is fully re-derivable in both directions.
    worked_examples:
      - "target 100.0, reported 90.0 -> 90.00, ON_TRACK at the exact floor"
      - "target 100.0, reported 89.99 -> 89.99, AT_RISK"
      - "target 100.0, reported 70.0 -> 70.00, AT_RISK at the exact floor"
      - "target 100.0, reported 69.9 -> 69.90, OFF_TRACK"
      - "target 250.0, reported 200.0 -> 80.00, AT_RISK"
      - "target 40.0, reported 36.0 -> 90.00, ON_TRACK"

# =============================================================================
# 1.4 Validation Rules (evaluated strictly in ascending priority order;
#     the first violated rule short-circuits and nothing is written)
# =============================================================================
validations:
  - priority: 1
    category: auth
    applies_to: "every endpoint under /resilience"
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    status: 401

  - priority: 2
    category: auth
    applies_to: "every endpoint under /resilience"
    check: "X-User-Role is one of RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer"
    error_id: ERR_UNKNOWN_ROLE
    status: 403

  - priority: 3
    category: auth
    applies_to: "every endpoint under /resilience"
    check: "the supplied X-User-Role appears in the endpoint's declared roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    status: 403

  - priority: 4
    category: existence
    applies_to: "every endpoint carrying path parameters"
    check: >-
      Each path id resolves to an existing row, checked left to right in URL order:
      {jurisdiction_id} -> ERR_JURISDICTION_NOT_FOUND, {plan_cycle_id} -> ERR_PLAN_CYCLE_NOT_FOUND,
      {hazard_profile_id} -> ERR_HAZARD_PROFILE_NOT_FOUND, {asset_id} -> ERR_ASSET_NOT_FOUND,
      {assessment_id} -> ERR_ASSESSMENT_NOT_FOUND, {project_id} -> ERR_PROJECT_NOT_FOUND,
      {link_id} -> ERR_LINK_NOT_FOUND, {analysis_id} -> ERR_ANALYSIS_NOT_FOUND,
      {program_id} -> ERR_PROGRAM_NOT_FOUND, {session_id} -> ERR_SESSION_NOT_FOUND,
      {endorsement_id} -> ERR_ENDORSEMENT_NOT_FOUND, {pact_id} -> ERR_PACT_NOT_FOUND,
      {commitment_id} -> ERR_COMMITMENT_NOT_FOUND
    error_id: ERR_PROJECT_NOT_FOUND
    status: 404
    note: "error_id above is the representative code; the actual code is the one mapped to the leftmost unresolved path id."

  - priority: 5
    category: existence
    applies_to: "every endpoint carrying foreign keys in the request body"
    check: >-
      Each body foreign key resolves to an existing row, checked in the field order declared by the
      endpoint's input list, using the same id-to-code map as priority 4 (jurisdiction_id,
      host_jurisdiction_id and requesting_jurisdiction_id all map to ERR_JURISDICTION_NOT_FOUND;
      asset_id maps to ERR_ASSET_NOT_FOUND; project_id maps to ERR_PROJECT_NOT_FOUND;
      hazard_profile_id maps to ERR_HAZARD_PROFILE_NOT_FOUND; prerequisite_project_id maps to
      ERR_PROJECT_NOT_FOUND; upstream_asset_id maps to ERR_ASSET_NOT_FOUND)
    error_id: ERR_JURISDICTION_NOT_FOUND
    status: 404

  - priority: 6
    category: auth
    applies_to: "every write endpoint invoked by an entity_backed role (ProjectSponsor, JurisdictionDelegate)"
    check: >-
      The Jurisdiction bound to X-User-ID owns the target row: for ProjectSponsor the target
      AdaptationProject.jurisdiction_id, for JurisdictionDelegate the Endorsement.jurisdiction_id,
      EngagementSession.host_jurisdiction_id, MutualAidPact.host_jurisdiction_id or
      MutualAidCommitment.requesting_jurisdiction_id
    error_id: ERR_JURISDICTION_SCOPE_VIOLATION
    status: 403

  - priority: 7
    category: shape
    applies_to: "every write endpoint"
    check: >-
      All required input fields are present, every enum value is a declared member, every Decimal
      score in [0, 1] is inside that range, every _cents and _units and _bps integer is
      non-negative, service_life_years >= 1, discount_rate_bps in [0, 2000],
      quorum_weight_bps in [1, 10000], cobenefit_points in [0, 20], horizon_year one of {2040, 2060, 2080}
    error_id: ERR_INVALID_REQUEST
    status: 422

  - priority: 8
    category: shape
    applies_to: "POST /resilience/plan-cycles/{plan_cycle_id}/engagement-sessions, POST /resilience/mutual-aid-pacts, POST /resilience/mutual-aid-pacts/{pact_id}/commitments"
    check: "window_start < window_end"
    error_id: ERR_INVALID_WINDOW
    status: 422

  - priority: 9
    category: state
    applies_to: "every write endpoint that names a Jurisdiction (project creation, endorsement casting, session scheduling, pact creation, commitment creation)"
    check: "the named Jurisdiction.status == ACTIVE"
    error_id: ERR_JURISDICTION_NOT_ACTIVE
    status: 409

  - priority: 10
    category: state
    applies_to: "open-engagement, open-endorsement-round, close-endorsement-round, POST /resilience/projects, POST /resilience/plan-cycles/{plan_cycle_id}/endorsements, POST /resilience/plan-cycles/{plan_cycle_id}/engagement-sessions"
    check: >-
      PlanCycle.status is one the operation allows: DRAFT for open-engagement, ENGAGEMENT or REVISION
      for open-endorsement-round, ENDORSEMENT_ROUND for close-endorsement-round and endorsement
      casting, DRAFT or ENGAGEMENT or REVISION for project creation and session scheduling
    error_id: ERR_PLAN_CYCLE_STATE_INVALID
    status: 409

  - priority: 11
    category: state
    applies_to: "POST /resilience/hazard-profiles/{hazard_profile_id}/publish"
    check: "HazardProfile.status == DRAFT"
    error_id: ERR_HAZARD_PROFILE_ALREADY_PUBLISHED
    status: 409

  - priority: 12
    category: state
    applies_to: "POST /resilience/hazard-profiles/{hazard_profile_id}/revisions, POST /resilience/vulnerability-assessments/{assessment_id}/assess"
    check: "HazardProfile.status == PUBLISHED"
    error_id: ERR_HAZARD_PROFILE_NOT_PUBLISHED
    status: 409

  - priority: 13
    category: state
    applies_to: "POST /resilience/vulnerability-assessments/{assessment_id}/assess"
    check: "VulnerabilityAssessment.status IN {DRAFT, STALE}"
    error_id: ERR_ASSESSMENT_NOT_PENDING
    status: 409

  - priority: 14
    category: state
    applies_to: "POST /resilience/assets/{asset_id}/criticality-ranking, PATCH /resilience/assets/{asset_id}"
    check: "LifelineAsset.criticality_status IN {UNRANKED, RECOMPUTE_REQUIRED}"
    error_id: ERR_ASSET_ALREADY_RANKED
    status: 409

  - priority: 15
    category: state
    applies_to: "POST /resilience/projects/{project_id}/screen"
    check: "AdaptationProject.screening_status == PROPOSED"
    error_id: ERR_PROJECT_ALREADY_SCREENED
    status: 409

  - priority: 16
    category: state
    applies_to: "POST /resilience/projects/{project_id}/asset-links, POST /resilience/projects/{project_id}/analyses"
    check: "AdaptationProject.screening_status == SCREENED_IN"
    error_id: ERR_PROJECT_NOT_SCREENED_IN
    status: 409

  - priority: 17
    category: state
    applies_to: "POST /resilience/capital-programs/{program_id}/allocations, PATCH /resilience/projects/{project_id}"
    check: "the named AdaptationProject.program_status == UNPROGRAMMED"
    error_id: ERR_PROJECT_ALREADY_PROGRAMMED
    status: 409

  - priority: 18
    category: state
    applies_to: "POST /resilience/projects/{project_id}/grant-submission, POST /resilience/projects/{project_id}/grant-award, POST /resilience/projects/{project_id}/withdraw, POST /resilience/projects/{project_id}/indicator-reports"
    check: >-
      AdaptationProject.program_status is one the operation allows: PROGRAMMED for grant-submission,
      GRANT_SUBMITTED for grant-award, PROGRAMMED or GRANT_SUBMITTED for withdraw, AWARDED for
      indicator-reports
    error_id: ERR_PROJECT_NOT_PROGRAMMED
    status: 409

  - priority: 19
    category: state
    applies_to: "POST /resilience/analyses/{analysis_id}/certify, POST /resilience/analyses/{analysis_id}/reject"
    check: "BenefitCostAnalysis.status == DRAFT"
    error_id: ERR_ANALYSIS_NOT_DRAFT
    status: 409

  - priority: 20
    category: state
    applies_to: "POST /resilience/analyses/{analysis_id}/certify, POST /resilience/projects/{project_id}/analyses"
    check: "no BenefitCostAnalysis for the same project_id is already in status CERTIFIED"
    error_id: ERR_BCA_ALREADY_CERTIFIED
    status: 409

  - priority: 21
    category: state
    applies_to: "POST /resilience/engagement-sessions/{session_id}/complete"
    check: "EngagementSession.status == SCHEDULED"
    error_id: ERR_SESSION_NOT_SCHEDULED
    status: 409

  - priority: 22
    category: state
    applies_to: "POST /resilience/mutual-aid-commitments/{commitment_id}/release, POST /resilience/mutual-aid-commitments/{commitment_id}/fulfill"
    check: "MutualAidCommitment.status == COMMITTED"
    error_id: ERR_COMMITMENT_NOT_ACTIVE
    status: 409

  - priority: 23
    category: state
    applies_to: "POST /resilience/mutual-aid-pacts/{pact_id}/commitments"
    check: "MutualAidPact.status == OPEN (a pact reading EXHAUSTED or EXPIRED accepts nothing)"
    error_id: ERR_PACT_NOT_OPEN
    status: 409

  - priority: 24
    category: concurrency
    applies_to: "POST /resilience/capital-programs/{program_id}/allocations"
    check: "expected_capital_program_version == CapitalProgram.version"
    error_id: ERR_STALE_PROGRAM_VERSION
    status: 412

  - priority: 25
    category: concurrency
    applies_to: "POST /resilience/mutual-aid-pacts/{pact_id}/commitments"
    check: "expected_mutual_aid_pact_version == MutualAidPact.version"
    error_id: ERR_STALE_PACT_VERSION
    status: 412

  - priority: 26
    category: business_safety
    applies_to: "POST /resilience/analyses/{analysis_id}/certify, POST /resilience/analyses/{analysis_id}/reject"
    check: "X-User-ID != BenefitCostAnalysis.prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403

  - priority: 27
    category: business_safety
    applies_to: "POST /resilience/capital-programs/{program_id}/allocations"
    check: "AdaptationProject.equity_benefit_share_bps >= CapitalProgram.equity_target_bps OR AdaptationProject.equity_waiver_granted == true"
    error_id: ERR_EQUITY_FLOOR_NOT_MET
    status: 409

  - priority: 28
    category: business_referential
    applies_to: "POST /resilience/mutual-aid-pacts/{pact_id}/commitments"
    check: "the named LifelineAsset.is_shared == true (only shared lifeline assets can be pledged across jurisdictions)"
    error_id: ERR_ASSET_NOT_SHARED
    status: 409

  - priority: 29
    category: business_referential
    applies_to: "POST /resilience/mutual-aid-pacts/{pact_id}/commitments"
    check: "requesting_jurisdiction_id != MutualAidPact.host_jurisdiction_id"
    error_id: ERR_SELF_AID_NOT_ALLOWED
    status: 409

  - priority: 30
    category: business_referential
    applies_to: "POST /resilience/assets, PATCH /resilience/assets/{asset_id}, POST /resilience/assets/{asset_id}/criticality-ranking"
    check: "walking upstream_asset_id from the asset reaches a null without revisiting any id"
    error_id: ERR_ASSET_DEPENDENCY_CYCLE
    status: 409

  - priority: 31
    category: business_referential
    applies_to: "POST /resilience/projects, PATCH /resilience/projects/{project_id}"
    check: "walking prerequisite_project_id from the new project reaches a null without revisiting any id"
    error_id: ERR_PROJECT_PREREQUISITE_CYCLE
    status: 409

  - priority: 32
    category: business_referential
    applies_to: "POST /resilience/jurisdictions"
    check: "jurisdiction_code is not already taken by another Jurisdiction"
    error_id: ERR_DUPLICATE_JURISDICTION_CODE
    status: 409

  - priority: 33
    category: business_referential
    applies_to: "POST /resilience/plan-cycles/{plan_cycle_id}/endorsements"
    check: "no Endorsement already exists for the same (plan_cycle_id, jurisdiction_id, round_number) with decision IN {ENDORSED, CONDITIONED, VETOED}"
    error_id: ERR_DUPLICATE_ENDORSEMENT
    status: 409

  - priority: 34
    category: business_referential
    applies_to: "POST /resilience/projects/{project_id}/asset-links"
    check: "no ProjectAssetLink already exists for the same (project_id, asset_id)"
    error_id: ERR_DUPLICATE_ASSET_LINK
    status: 409

  - priority: 35
    category: business_referential
    applies_to: "POST /resilience/assets/{asset_id}/criticality-ranking"
    check: "at least one VulnerabilityAssessment for the asset has status ASSESSED"
    error_id: ERR_NO_ASSESSED_VULNERABILITY
    status: 409

  - priority: 36
    category: business_referential
    applies_to: "POST /resilience/projects/{project_id}/analyses"
    check: "at least one ProjectAssetLink exists for the project"
    error_id: ERR_NO_LINKED_ASSETS
    status: 409

  - priority: 37
    category: cross_entity_state
    applies_to: "POST /resilience/projects/{project_id}/analyses, POST /resilience/capital-programs/{program_id}/allocations"
    check: "every LifelineAsset reachable through the project's ProjectAssetLink rows has criticality_status == RANKED"
    error_id: ERR_ASSET_RANKING_REQUIRED
    status: 409

  - priority: 38
    category: cross_entity_state
    applies_to: "POST /resilience/capital-programs/{program_id}/allocations, POST /resilience/projects/{project_id}/grant-award"
    check: "AdaptationProject.analysis_status == BCA_CERTIFIED"
    error_id: ERR_BCA_NOT_CERTIFIED
    status: 409

  - priority: 39
    category: cross_entity_state
    applies_to: "POST /resilience/projects/{project_id}/grant-submission"
    check: "AdaptationProject.prerequisite_project_id is null OR the prerequisite project's program_status == AWARDED"
    error_id: ERR_PREREQUISITE_NOT_AWARDED
    status: 409

  - priority: 40
    category: cross_entity_state
    applies_to: "POST /resilience/plan-cycles/{plan_cycle_id}/open-endorsement-round"
    check: "COUNT(EngagementSession for the cycle with status == COMPLETED) >= PlanCycle.required_session_count"
    error_id: ERR_ENGAGEMENT_INCOMPLETE
    status: 409

  - priority: 41
    category: cross_entity_state
    applies_to: "POST /resilience/plan-cycles/{plan_cycle_id}/open-endorsement-round"
    check: "COUNT(AdaptationProject for the cycle with screening_status == SCREENED_IN) >= 1"
    error_id: ERR_NO_SCREENED_PROJECTS
    status: 409

  - priority: 42
    category: cross_entity_state
    applies_to: "POST /resilience/projects/{project_id}/indicator-reports"
    check: "AdaptationProject.indicator_code and indicator_target_value are both non-null"
    error_id: ERR_INDICATOR_NOT_DEFINED
    status: 409

  - priority: 43
    category: business_arithmetic
    applies_to: "POST /resilience/engagement-sessions/{session_id}/complete"
    check: "disadvantaged_attendee_count <= attendee_count"
    error_id: ERR_ATTENDANCE_MISMATCH
    status: 422

  - priority: 44
    category: business_arithmetic
    applies_to: "POST /resilience/plan-cycles/{plan_cycle_id}/endorsements"
    check: "condition_note is present and non-empty when decision == CONDITIONED"
    error_id: ERR_CONDITION_NOTE_REQUIRED
    status: 422

  - priority: 45
    category: business_temporal
    applies_to: "POST /resilience/plan-cycles/{plan_cycle_id}/engagement-sessions"
    check: "calculations.session_window_conflict finds no conflicting SCHEDULED or COMPLETED session for the same host_jurisdiction_id"
    error_id: ERR_SESSION_WINDOW_CONFLICT
    status: 409

  - priority: 46
    category: business_temporal
    applies_to: "POST /resilience/mutual-aid-pacts/{pact_id}/commitments"
    check: "window_start >= MutualAidPact.window_start AND window_end <= MutualAidPact.window_end"
    error_id: ERR_AID_WINDOW_OUTSIDE_PACT
    status: 422

  - priority: 47
    category: business_temporal
    applies_to: "POST /resilience/mutual-aid-pacts/{pact_id}/commitments"
    check: "the maximum overlap COUNT at any window_start instant is < MutualAidPact.max_concurrent_commitments"
    error_id: ERR_AID_CONCURRENCY_LIMIT
    status: 409

  - priority: 48
    category: business_fiscal
    applies_to: "POST /resilience/mutual-aid-pacts/{pact_id}/commitments"
    check: "calculations.aid_peak_overlap_capacity peak_load <= MutualAidPact.pledged_units"
    error_id: ERR_AID_CAPACITY_EXCEEDED
    status: 409

  - priority: 49
    category: business_fiscal
    applies_to: "POST /resilience/capital-programs/{program_id}/allocations"
    check: "allocated_cents <= AdaptationProject.total_program_cost_cents"
    error_id: ERR_ALLOCATION_EXCEEDS_PROJECT_COST
    status: 422

  - priority: 50
    category: business_fiscal
    applies_to: "POST /resilience/capital-programs/{program_id}/allocations"
    check: "allocated_cents <= CapitalProgram.available_cents"
    error_id: ERR_PROGRAM_FUNDS_EXCEEDED
    status: 409

  - priority: 51
    category: business_fiscal
    applies_to: "POST /resilience/analyses/{analysis_id}/certify, POST /resilience/projects/{project_id}/grant-submission"
    check: "BenefitCostAnalysis.bcr >= 1.0000 (equivalently grant_eligible == true)"
    error_id: ERR_BCR_BELOW_FLOOR
    status: 409

  - priority: 52
    category: business_fiscal
    applies_to: "POST /resilience/projects/{project_id}/grant-submission"
    check: "AdaptationProject.grant_hold_flag == false"
    error_id: ERR_GRANT_ON_HOLD
    status: 409

# =============================================================================
# 1.5 Endpoint Table
# =============================================================================
endpoints:
  # ---- Jurisdiction ---------------------------------------------------------
  - method: POST
    path: /resilience/jurisdictions
    roles: [RegionalAdministrator]
    input: [name, jurisdiction_code, population, svi_score, endorsement_weight, "status?"]
    output: Jurisdiction
    status: 201
    side_effects:
      - "computes svi_tier and disadvantaged_flag per calculations.svi_tier_assignment"
      - "defaults status to ACTIVE when omitted"

  - method: GET
    path: /resilience/jurisdictions
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["status?", "svi_tier?", "disadvantaged_flag?", "limit?", "offset?"]
    output: Jurisdiction[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/jurisdictions/{jurisdiction_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: Jurisdiction
    status: 200
    side_effects: []

  - method: PATCH
    path: /resilience/jurisdictions/{jurisdiction_id}
    roles: [RegionalAdministrator]
    input: ["status?", "endorsement_weight?", "svi_score?"]
    output: Jurisdiction
    status: 200
    side_effects:
      - "recomputes svi_tier and disadvantaged_flag when svi_score is supplied"
      - "a new endorsement_weight changes total_active_weight for future tallies but never the weight_at_cast frozen on existing Endorsement rows"
      - "increments Jurisdiction.version by 1"

  # ---- PlanCycle ------------------------------------------------------------
  - method: POST
    path: /resilience/plan-cycles
    roles: [RegionalAdministrator]
    input: [cycle_label, endorsement_deadline, "quorum_weight_bps?", "max_revision_rounds?", "required_session_count?"]
    output: PlanCycle
    status: 201
    side_effects:
      - "sets status DRAFT, round_number 0, revision_count 0, achieved_weight_bps null"

  - method: GET
    path: /resilience/plan-cycles
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["status?", "limit?", "offset?"]
    output: PlanCycle[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/plan-cycles/{plan_cycle_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: PlanCycle
    status: 200
    side_effects: []

  - method: POST
    path: /resilience/plan-cycles/{plan_cycle_id}/open-engagement
    roles: [RegionalAdministrator]
    input: []
    output: PlanCycle
    status: 200
    side_effects:
      - "moves status DRAFT -> ENGAGEMENT"
      - "increments PlanCycle.version by 1"

  - method: POST
    path: /resilience/plan-cycles/{plan_cycle_id}/open-endorsement-round
    roles: [RegionalAdministrator]
    input: []
    output: PlanCycle
    status: 200
    side_effects:
      - "moves status ENGAGEMENT -> ENDORSEMENT_ROUND or REVISION -> ENDORSEMENT_ROUND"
      - "increments round_number by 1"
      - "increments PlanCycle.version by 1"

  - method: POST
    path: /resilience/plan-cycles/{plan_cycle_id}/close-endorsement-round
    roles: [RegionalAdministrator]
    input: []
    output: PlanCycle
    status: 200
    side_effects:
      - "writes achieved_weight_bps from calculations.endorsement_quorum_tally"
      - "moves status to ADOPTED, REVISION or FAILED per the tally's ordered outcome"
      - "on REVISION and FAILED, marks every current-round Endorsement decision SUPERSEDED"
      - "on FAILED, cancels every SCHEDULED EngagementSession of the cycle and screens out every SCREENED_IN + UNPROGRAMMED project"
      - "increments PlanCycle.version by 1"

  - method: GET
    path: /resilience/plan-cycles/{plan_cycle_id}/endorsement-tally
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output:
      round_number: integer
      total_active_weight: integer
      supporting_weight: integer
      veto_weight: integer
      achieved_weight_bps: integer
      quorum_weight_bps: integer
      projected_outcome: string
    status: 200
    side_effects: []
    note: "Read-only projection of calculations.endorsement_quorum_tally; writes nothing."

  # ---- HazardProfile --------------------------------------------------------
  - method: POST
    path: /resilience/hazard-profiles
    roles: [HazardAnalyst]
    input: [jurisdiction_id, hazard_type, scenario, horizon_year, exposure_index, annual_event_probability, projected_annual_loss_cents]
    output: HazardProfile
    status: 201
    side_effects:
      - "sets status DRAFT, published_version 0, published_at null"

  - method: GET
    path: /resilience/hazard-profiles
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["jurisdiction_id?", "hazard_type?", "scenario?", "status?", "limit?", "offset?"]
    output: HazardProfile[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/hazard-profiles/{hazard_profile_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: HazardProfile
    status: 200
    side_effects: []

  - method: POST
    path: /resilience/hazard-profiles/{hazard_profile_id}/publish
    roles: [HazardAnalyst]
    input: []
    output: HazardProfile
    status: 200
    side_effects:
      - "moves status DRAFT -> PUBLISHED, sets published_version 1 and published_at"
      - "supersedes the previously PUBLISHED profile for the same (jurisdiction_id, hazard_type, scenario, horizon_year)"
      - "increments HazardProfile.version by 1"

  - method: POST
    path: /resilience/hazard-profiles/{hazard_profile_id}/revisions
    roles: [HazardAnalyst]
    input: [exposure_index, annual_event_probability, projected_annual_loss_cents]
    output: HazardProfile
    status: 200
    side_effects:
      - "hop 1: overwrites the three projection fields, increments published_version by 1, refreshes published_at"
      - "hop 2: flips every ASSESSED VulnerabilityAssessment of this profile to STALE"
      - "hop 3: flips every RANKED LifelineAsset behind those assessments to RECOMPUTE_REQUIRED and nulls consequence_score, criticality_tier and dependency_depth"
      - "hop 4: flips every CERTIFIED BenefitCostAnalysis linked to those assets to STALE with stale_reason ASSET_RECOMPUTE and its project's analysis_status to BCA_STALE"
      - "hop 5: moves every affected PlanCycle in ENDORSEMENT_ROUND to REVISION (or FAILED when the revision budget is spent) and supersedes its current-round endorsements"
      - "increments version by 1 on every row touched"

  # ---- LifelineAsset --------------------------------------------------------
  - method: POST
    path: /resilience/assets
    roles: [RegionalAdministrator]
    input: [jurisdiction_id, asset_class, name, replacement_value_cents, service_population, redundancy_factor, "is_shared?", "upstream_asset_id?"]
    output: LifelineAsset
    status: 201
    side_effects:
      - "sets criticality_status UNRANKED with consequence_score, criticality_tier and dependency_depth null"
      - "rejects an upstream_asset_id that would close a cycle with ERR_ASSET_DEPENDENCY_CYCLE"

  - method: GET
    path: /resilience/assets
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["jurisdiction_id?", "upstream_asset_id?", "asset_class?", "criticality_status?", "criticality_tier?", "is_shared?", "limit?", "offset?"]
    output: LifelineAsset[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/assets/{asset_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: LifelineAsset
    status: 200
    side_effects: []

  - method: PATCH
    path: /resilience/assets/{asset_id}
    roles: [RegionalAdministrator]
    input: ["is_shared?", "upstream_asset_id?"]
    output: LifelineAsset
    status: 200
    side_effects:
      - "rewrites the dependency edge upstream_asset_id, which is why validations priority 30 re-walks the chain for a repeated id"
      - "permitted only while criticality_status IN {UNRANKED, RECOMPUTE_REQUIRED} (validations priority 14)"
      - "increments LifelineAsset.version by 1"

  - method: POST
    path: /resilience/assets/{asset_id}/criticality-ranking
    roles: [HazardAnalyst]
    input: []
    output: LifelineAsset
    status: 200
    side_effects:
      - "writes consequence_score, criticality_tier and dependency_depth from calculations.asset_consequence_score"
      - "moves criticality_status UNRANKED -> RANKED or RECOMPUTE_REQUIRED -> RANKED"
      - "increments LifelineAsset.version by 1"

  # ---- VulnerabilityAssessment ---------------------------------------------
  - method: POST
    path: /resilience/vulnerability-assessments
    roles: [HazardAnalyst]
    input: [hazard_profile_id, asset_id, subject_type, sensitivity_score, adaptive_capacity_score, method, "svi_overlay_applied?"]
    output: VulnerabilityAssessment
    status: 201
    side_effects:
      - "sets status DRAFT with vulnerability_score, vulnerability_band, assessed_at and assessed_profile_version null"
      - "defaults svi_overlay_applied to true when omitted"

  - method: GET
    path: /resilience/vulnerability-assessments
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["hazard_profile_id?", "asset_id?", "subject_type?", "method?", "status?", "limit?", "offset?"]
    output: VulnerabilityAssessment[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/vulnerability-assessments/{assessment_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: VulnerabilityAssessment
    status: 200
    side_effects: []

  - method: POST
    path: /resilience/vulnerability-assessments/{assessment_id}/assess
    roles: [HazardAnalyst]
    input: []
    output: VulnerabilityAssessment
    status: 200
    side_effects:
      - "writes vulnerability_score and vulnerability_band from calculations.vulnerability_score under the row's declared method"
      - "sets assessed_at and assessed_profile_version = HazardProfile.published_version"
      - "moves status DRAFT -> ASSESSED or STALE -> ASSESSED"
      - "increments VulnerabilityAssessment.version by 1"

  # ---- AdaptationProject ----------------------------------------------------
  - method: POST
    path: /resilience/projects
    roles: [ProjectSponsor]
    input: [plan_cycle_id, jurisdiction_id, name, hazard_type, strategy_type, base_cost_cents, service_life_years, cobenefit_points, feasibility_score, "prerequisite_project_id?", "indicator_code?", "indicator_target_value?"]
    output: AdaptationProject
    status: 201
    side_effects:
      - "sets screening_status PROPOSED, analysis_status NOT_ANALYZED, program_status UNPROGRAMMED, implementation_status NOT_STARTED"
      - "sets grant_hold_flag false, equity_waiver_granted false, allocated_cents 0, reported_period_count 0"
      - "leaves escalated_cost_cents, admin_fee_cents, total_program_cost_cents, grant_match_share_bps, screen_score, priority_score, equity_benefit_share_bps and indicator_attainment_pct null until the relevant action runs"

  - method: GET
    path: /resilience/projects
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["plan_cycle_id?", "jurisdiction_id?", "prerequisite_project_id?", "capital_program_id?", "hazard_type?", "strategy_type?", "screening_status?", "analysis_status?", "program_status?", "implementation_status?", "limit?", "offset?"]
    output: AdaptationProject[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/projects/{project_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: AdaptationProject
    status: 200
    side_effects: []

  - method: PATCH
    path: /resilience/projects/{project_id}
    roles: [ProjectSponsor]
    input: ["prerequisite_project_id?", "indicator_code?", "indicator_target_value?"]
    output: AdaptationProject
    status: 200
    side_effects:
      - "rewrites the prerequisite edge prerequisite_project_id, which is why validations priority 31 re-walks the chain for a repeated id"
      - "permitted only while program_status == UNPROGRAMMED (validations priority 17)"
      - "increments AdaptationProject.version by 1"

  - method: POST
    path: /resilience/projects/{project_id}/screen
    roles: [RegionalAdministrator]
    input: []
    output: AdaptationProject
    status: 200
    side_effects:
      - "writes escalated_cost_cents, admin_fee_cents, total_program_cost_cents and grant_match_share_bps from calculations.program_cost_stack in the pinned STEP 1..5 order"
      - "writes screen_score from calculations.strategy_screen_score"
      - "moves screening_status PROPOSED -> SCREENED_IN when screen_score >= 0.4500, else PROPOSED -> SCREENED_OUT"
      - "increments AdaptationProject.version by 1"

  - method: POST
    path: /resilience/projects/{project_id}/asset-links
    roles: [ProjectSponsor]
    input: [asset_id, avoided_loss_annual_cents, "benefit_reaches_disadvantaged?"]
    output: ProjectAssetLink
    status: 201
    side_effects:
      - "assigns link_sequence as 1 + the count of existing links for the project, ordered by created_at ASC"
      - "defaults benefit_reaches_disadvantaged to the linked asset's jurisdiction disadvantaged_flag when omitted"
      - "when the project already holds a CERTIFIED BenefitCostAnalysis, flips that analysis to STALE with stale_reason LINK_ADDED and the project's analysis_status to BCA_STALE"

  - method: GET
    path: /resilience/asset-links
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["project_id?", "asset_id?", "benefit_reaches_disadvantaged?", "limit?", "offset?"]
    output: ProjectAssetLink[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/asset-links/{link_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: ProjectAssetLink
    status: 200
    side_effects: []

  - method: POST
    path: /resilience/projects/{project_id}/analyses
    roles: [ProjectSponsor]
    input: [method, "discount_rate_bps?"]
    output: BenefitCostAnalysis
    status: 201
    side_effects:
      - "defaults discount_rate_bps to 700 when omitted"
      - "computes benefit_measure_cents, cost_measure_cents, bcr and grant_eligible per calculations.benefit_cost_ratio under the requested method"
      - "records prepared_by_user_id from X-User-ID, status DRAFT, stale_reason NONE"
      - "moves the project's analysis_status to BCA_PENDING from NOT_ANALYZED, BCA_REJECTED or BCA_STALE"

  - method: GET
    path: /resilience/analyses
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["project_id?", "method?", "status?", "grant_eligible?", "limit?", "offset?"]
    output: BenefitCostAnalysis[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/analyses/{analysis_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: BenefitCostAnalysis
    status: 200
    side_effects: []

  - method: POST
    path: /resilience/analyses/{analysis_id}/certify
    roles: [BCAReviewer]
    input: []
    output: BenefitCostAnalysis
    status: 200
    side_effects:
      - "moves status DRAFT -> CERTIFIED, sets certified_by_user_id from X-User-ID and certified_at"
      - "moves the owning project's analysis_status to BCA_CERTIFIED"
      - "increments BenefitCostAnalysis.version by 1"

  - method: POST
    path: /resilience/analyses/{analysis_id}/reject
    roles: [BCAReviewer]
    input: []
    output: BenefitCostAnalysis
    status: 200
    side_effects:
      - "moves status DRAFT -> REJECTED"
      - "moves the owning project's analysis_status to BCA_REJECTED"
      - "increments BenefitCostAnalysis.version by 1"

  - method: POST
    path: /resilience/projects/{project_id}/withdraw
    roles: [ProjectSponsor]
    input: []
    output: AdaptationProject
    status: 200
    side_effects:
      - "hop 1: moves program_status to WITHDRAWN and sets allocated_cents to 0, retaining capital_program_id"
      - "hop 2: decreases CapitalProgram.committed_cents and increases available_cents by exactly the released amount, keeping committed + available == authorized"
      - "hop 3: recomputes equity_committed_cents, equity_achieved_bps and funding_posture"
      - "hop 4: clears grant_hold_flag on every sibling PROGRAMMED project once the posture leaves CLOSED"
      - "increments CapitalProgram.version by 1 and AdaptationProject.version by 1 on every row touched"

  - method: POST
    path: /resilience/projects/{project_id}/grant-submission
    roles: [ProjectSponsor]
    input: [grant_funder]
    output: AdaptationProject
    status: 200
    side_effects:
      - "moves program_status PROGRAMMED -> GRANT_SUBMITTED and sets grant_submitted_at"
      - "increments AdaptationProject.version by 1"

  - method: POST
    path: /resilience/projects/{project_id}/grant-award
    roles: [RegionalAdministrator]
    input: []
    output: AdaptationProject
    status: 200
    side_effects:
      - "moves program_status GRANT_SUBMITTED -> AWARDED and sets awarded_at"
      - "increments AdaptationProject.version by 1"

  - method: POST
    path: /resilience/projects/{project_id}/equity-waiver
    roles: [EquityOfficer]
    input: [waiver_rationale]
    output: AdaptationProject
    status: 200
    side_effects:
      - "sets equity_waiver_granted true, letting the project clear priority 27 without meeting the program equity target"
      - "increments AdaptationProject.version by 1"

  - method: POST
    path: /resilience/projects/{project_id}/indicator-reports
    roles: [ProjectSponsor]
    input: [reported_value, period_label]
    output: AdaptationProject
    status: 200
    side_effects:
      - "writes indicator_latest_value, latest_period_label and indicator_attainment_pct, and increments reported_period_count by 1"
      - "re-derives implementation_status per calculations.indicator_attainment, in either direction"
      - "increments AdaptationProject.version by 1"

  # ---- CapitalProgram -------------------------------------------------------
  - method: POST
    path: /resilience/capital-programs
    roles: [RegionalAdministrator]
    input: [fiscal_year, authorized_cents, "equity_target_bps?"]
    output: CapitalProgram
    status: 201
    side_effects:
      - "sets committed_cents 0, available_cents = authorized_cents, equity_committed_cents 0, equity_achieved_bps 0, funding_posture OPEN"
      - "defaults equity_target_bps to 4000 when omitted"

  - method: GET
    path: /resilience/capital-programs
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["fiscal_year?", "funding_posture?", "limit?", "offset?"]
    output: CapitalProgram[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/capital-programs/{program_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: CapitalProgram
    status: 200
    side_effects: []

  - method: POST
    path: /resilience/capital-programs/{program_id}/allocations
    roles: [RegionalAdministrator]
    input: [project_id, allocated_cents, expected_capital_program_version]
    output: AdaptationProject
    status: 200
    side_effects:
      - "sets AdaptationProject.capital_program_id and allocated_cents, moving program_status UNPROGRAMMED -> PROGRAMMED"
      - "writes AdaptationProject.priority_score and equity_benefit_share_bps from calculations.project_priority_score"
      - "recomputes CapitalProgram.committed_cents, available_cents, equity_committed_cents, equity_achieved_bps and funding_posture"
      - "sets grant_hold_flag true on every PROGRAMMED project of the program when the recomputed funding_posture is CLOSED"
      - "increments CapitalProgram.version by 1"
      - "increments AdaptationProject.version by 1"

  # ---- EngagementSession ----------------------------------------------------
  - method: POST
    path: /resilience/plan-cycles/{plan_cycle_id}/engagement-sessions
    roles: [JurisdictionDelegate]
    input: [host_jurisdiction_id, modality, window_start, window_end]
    output: EngagementSession
    status: 201
    side_effects:
      - "sets status SCHEDULED with attendee_count, disadvantaged_attendee_count, equity_reach_bps and preferred_strategy_type null"
      - "rejects a window colliding with the host jurisdiction's 24-hour buffered occupancy"

  - method: GET
    path: /resilience/engagement-sessions
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["plan_cycle_id?", "host_jurisdiction_id?", "modality?", "status?", "limit?", "offset?"]
    output: EngagementSession[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/engagement-sessions/{session_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: EngagementSession
    status: 200
    side_effects: []

  - method: POST
    path: /resilience/engagement-sessions/{session_id}/complete
    roles: [JurisdictionDelegate]
    input: [attendee_count, disadvantaged_attendee_count, preferred_strategy_type]
    output: EngagementSession
    status: 200
    side_effects:
      - "moves status SCHEDULED -> COMPLETED"
      - "writes equity_reach_bps from calculations.engagement_equity_reach"
      - "increments EngagementSession.version by 1"

  # ---- Endorsement ----------------------------------------------------------
  - method: POST
    path: /resilience/plan-cycles/{plan_cycle_id}/endorsements
    roles: [JurisdictionDelegate]
    input: [jurisdiction_id, decision, "condition_note?"]
    output: Endorsement
    status: 201
    side_effects:
      - "stamps round_number from the cycle's current round_number and freezes weight_at_cast from Jurisdiction.endorsement_weight"
      - "requires condition_note when decision is CONDITIONED"

  - method: GET
    path: /resilience/endorsements
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["plan_cycle_id?", "jurisdiction_id?", "decision?", "round_number?", "limit?", "offset?"]
    output: Endorsement[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/endorsements/{endorsement_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: Endorsement
    status: 200
    side_effects: []

  # ---- MutualAidPact / MutualAidCommitment ----------------------------------
  - method: POST
    path: /resilience/mutual-aid-pacts
    roles: [JurisdictionDelegate]
    input: [host_jurisdiction_id, resource_class, pledged_units, window_start, window_end, "max_concurrent_commitments?"]
    output: MutualAidPact
    status: 201
    side_effects:
      - "sets reserved_units 0, free_units = pledged_units, status OPEN"
      - "defaults max_concurrent_commitments to 3 when omitted"

  - method: GET
    path: /resilience/mutual-aid-pacts
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["host_jurisdiction_id?", "resource_class?", "status?", "limit?", "offset?"]
    output: MutualAidPact[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/mutual-aid-pacts/{pact_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: MutualAidPact
    status: 200
    side_effects: []

  - method: POST
    path: /resilience/mutual-aid-pacts/{pact_id}/commitments
    roles: [JurisdictionDelegate]
    input: [requesting_jurisdiction_id, asset_id, committed_units, window_start, window_end, expected_mutual_aid_pact_version]
    output: MutualAidCommitment
    status: 201
    side_effects:
      - "admits the commitment only when calculations.aid_peak_overlap_capacity peak_load stays within pledged_units under half-open window semantics"
      - "sets status COMMITTED and fulfilled_at null"
      - "recomputes MutualAidPact.reserved_units, free_units and status per calculations.aid_unit_ledger"
      - "increments MutualAidPact.version by 1"

  - method: GET
    path: /resilience/mutual-aid-commitments
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: ["pact_id?", "requesting_jurisdiction_id?", "asset_id?", "status?", "limit?", "offset?"]
    output: MutualAidCommitment[]
    status: 200
    side_effects: []

  - method: GET
    path: /resilience/mutual-aid-commitments/{commitment_id}
    roles: [RegionalAdministrator, HazardAnalyst, ProjectSponsor, BCAReviewer, JurisdictionDelegate, EquityOfficer]
    input: []
    output: MutualAidCommitment
    status: 200
    side_effects: []

  - method: POST
    path: /resilience/mutual-aid-commitments/{commitment_id}/release
    roles: [JurisdictionDelegate]
    input: []
    output: MutualAidCommitment
    status: 200
    side_effects:
      - "moves status COMMITTED -> RELEASED"
      - "recomputes MutualAidPact.reserved_units as the peak load over the surviving active commitments and free_units as pledged_units - reserved_units, keeping reserved + free == pledged"
      - "recomputes MutualAidPact.status, which may revert EXHAUSTED to OPEN"
      - "increments MutualAidPact.version by 1 and MutualAidCommitment.version by 1"

  - method: POST
    path: /resilience/mutual-aid-commitments/{commitment_id}/fulfill
    roles: [JurisdictionDelegate]
    input: []
    output: MutualAidCommitment
    status: 200
    side_effects:
      - "moves status COMMITTED -> FULFILLED and sets fulfilled_at"
      - "leaves reserved_units and free_units unchanged because FULFILLED stays inside the reserved set"
      - "increments MutualAidCommitment.version by 1"

  # ---- Logical clock --------------------------------------------------------
  - method: POST
    path: /resilience/_clock/set_current_utc
    roles: [RegionalAdministrator]
    input: [to_iso8601]
    output:
      current_utc: string
    status: 200
    side_effects:
      - "sets the server's logical clock, which every *_at timestamp, the MutualAidPact EXPIRED evaluation and every window comparison read from"
      - "the logical clock starts at 2026-08-01T00:00:00Z on server startup and only ever moves when this endpoint is called; it never advances on its own"

# =============================================================================
# 1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    status: 401
    message: "Authentication headers are missing."
    triggered_by: "any /resilience call without both X-User-Role and X-User-ID"

  - error_id: ERR_UNKNOWN_ROLE
    status: 403
    message: "The supplied role is not a recognized role."
    triggered_by: "X-User-Role set to a value outside the six declared roles"

  - error_id: ERR_ROLE_NOT_PERMITTED
    status: 403
    message: "This role may not perform this operation."
    triggered_by: "a HazardAnalyst calling POST /resilience/capital-programs/{program_id}/allocations"

  - error_id: ERR_JURISDICTION_SCOPE_VIOLATION
    status: 403
    message: "The caller's jurisdiction does not own the target record."
    triggered_by: "a JurisdictionDelegate bound to J_RIDGE casting an endorsement for J_HARBOR"

  - error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
    message: "The preparer of an analysis may not certify or reject it."
    triggered_by: "a BCAReviewer whose X-User-ID equals BenefitCostAnalysis.prepared_by_user_id calling certify"

  - error_id: ERR_JURISDICTION_NOT_FOUND
    status: 404
    message: "Jurisdiction not found."
    triggered_by: "an unknown jurisdiction_id in a path or body"

  - error_id: ERR_PLAN_CYCLE_NOT_FOUND
    status: 404
    message: "Plan cycle not found."
    triggered_by: "an unknown {plan_cycle_id}"

  - error_id: ERR_HAZARD_PROFILE_NOT_FOUND
    status: 404
    message: "Hazard profile not found."
    triggered_by: "an unknown {hazard_profile_id} or body hazard_profile_id"

  - error_id: ERR_ASSET_NOT_FOUND
    status: 404
    message: "Lifeline asset not found."
    triggered_by: "an unknown {asset_id} or body asset_id"

  - error_id: ERR_ASSESSMENT_NOT_FOUND
    status: 404
    message: "Vulnerability assessment not found."
    triggered_by: "an unknown {assessment_id}"

  - error_id: ERR_PROJECT_NOT_FOUND
    status: 404
    message: "Adaptation project not found."
    triggered_by: "an unknown {project_id}, body project_id or prerequisite_project_id"

  - error_id: ERR_LINK_NOT_FOUND
    status: 404
    message: "Project asset link not found."
    triggered_by: "an unknown {link_id}"

  - error_id: ERR_ANALYSIS_NOT_FOUND
    status: 404
    message: "Benefit-cost analysis not found."
    triggered_by: "an unknown {analysis_id}"

  - error_id: ERR_PROGRAM_NOT_FOUND
    status: 404
    message: "Capital program not found."
    triggered_by: "an unknown {program_id}"

  - error_id: ERR_SESSION_NOT_FOUND
    status: 404
    message: "Engagement session not found."
    triggered_by: "an unknown {session_id}"

  - error_id: ERR_ENDORSEMENT_NOT_FOUND
    status: 404
    message: "Endorsement not found."
    triggered_by: "an unknown {endorsement_id}"

  - error_id: ERR_PACT_NOT_FOUND
    status: 404
    message: "Mutual aid pact not found."
    triggered_by: "an unknown {pact_id}"

  - error_id: ERR_COMMITMENT_NOT_FOUND
    status: 404
    message: "Mutual aid commitment not found."
    triggered_by: "an unknown {commitment_id}"

  - error_id: ERR_JURISDICTION_NOT_ACTIVE
    status: 409
    message: "The jurisdiction is not ACTIVE."
    triggered_by: "creating a project for a SUSPENDED jurisdiction"

  - error_id: ERR_PLAN_CYCLE_STATE_INVALID
    status: 409
    message: "The plan cycle is not in a state that allows this operation."
    triggered_by: "calling close-endorsement-round on a cycle still in ENGAGEMENT"

  - error_id: ERR_HAZARD_PROFILE_ALREADY_PUBLISHED
    status: 409
    message: "The hazard profile has already been published."
    triggered_by: "calling publish twice on the same profile"

  - error_id: ERR_HAZARD_PROFILE_NOT_PUBLISHED
    status: 409
    message: "The hazard profile is not published."
    triggered_by: "posting a revision to a DRAFT profile, or assessing against a SUPERSEDED one"

  - error_id: ERR_ASSESSMENT_NOT_PENDING
    status: 409
    message: "The assessment is not awaiting assessment."
    triggered_by: "calling assess on an assessment already in ASSESSED"

  - error_id: ERR_ASSET_ALREADY_RANKED
    status: 409
    message: "The asset has already been ranked."
    triggered_by: "calling criticality-ranking twice without an intervening hazard revision"

  - error_id: ERR_PROJECT_ALREADY_SCREENED
    status: 409
    message: "The project has already been screened."
    triggered_by: "calling screen twice on the same project"

  - error_id: ERR_PROJECT_NOT_SCREENED_IN
    status: 409
    message: "The project has not been screened in."
    triggered_by: "linking assets to a project still in PROPOSED, or requesting an analysis for a SCREENED_OUT project"

  - error_id: ERR_PROJECT_ALREADY_PROGRAMMED
    status: 409
    message: "The project is already programmed against a capital program."
    triggered_by: "allocating twice to the same project"

  - error_id: ERR_PROJECT_NOT_PROGRAMMED
    status: 409
    message: "The project's program status does not allow this operation."
    triggered_by: "calling grant-submission on an UNPROGRAMMED project, or indicator-reports before the award"

  - error_id: ERR_ANALYSIS_NOT_DRAFT
    status: 409
    message: "The analysis is not in DRAFT."
    triggered_by: "certifying an analysis that is already CERTIFIED, REJECTED or STALE"

  - error_id: ERR_BCA_ALREADY_CERTIFIED
    status: 409
    message: "A certified analysis already exists for this project."
    triggered_by: "requesting a second analysis while the first is still CERTIFIED"

  - error_id: ERR_BCA_NOT_CERTIFIED
    status: 409
    message: "The project has no certified benefit-cost analysis."
    triggered_by: "allocating capital to a project whose analysis_status is BCA_PENDING or BCA_STALE"

  - error_id: ERR_SESSION_NOT_SCHEDULED
    status: 409
    message: "The engagement session is not scheduled."
    triggered_by: "completing a session that is already COMPLETED or was CANCELLED by a failed cycle"

  - error_id: ERR_COMMITMENT_NOT_ACTIVE
    status: 409
    message: "The commitment is no longer active."
    triggered_by: "releasing a commitment that is already RELEASED or FULFILLED"

  - error_id: ERR_PACT_NOT_OPEN
    status: 409
    message: "The mutual aid pact is not open for new commitments."
    triggered_by: "committing against a pact reading EXHAUSTED or EXPIRED"

  - error_id: ERR_STALE_PROGRAM_VERSION
    status: 412
    message: "The supplied capital program version is stale."
    triggered_by: "an allocation carrying expected_capital_program_version that no longer matches CapitalProgram.version"

  - error_id: ERR_STALE_PACT_VERSION
    status: 412
    message: "The supplied mutual aid pact version is stale."
    triggered_by: "a commitment carrying expected_mutual_aid_pact_version that no longer matches MutualAidPact.version"

  - error_id: ERR_EQUITY_FLOOR_NOT_MET
    status: 409
    message: "The project's equity benefit share is below the program's equity target."
    triggered_by: "allocating to a project with equity_benefit_share_bps 2000 in a program whose equity_target_bps is 4000 and no waiver"

  - error_id: ERR_ASSET_NOT_SHARED
    status: 409
    message: "Only shared lifeline assets may be pledged under a mutual aid pact."
    triggered_by: "committing against an asset whose is_shared is false"

  - error_id: ERR_SELF_AID_NOT_ALLOWED
    status: 409
    message: "A jurisdiction may not request aid from its own pact."
    triggered_by: "requesting_jurisdiction_id equal to the pact's host_jurisdiction_id"

  - error_id: ERR_ASSET_DEPENDENCY_CYCLE
    status: 409
    message: "The asset dependency chain contains a cycle."
    triggered_by: "pointing an asset's upstream_asset_id at one of its own downstream assets"

  - error_id: ERR_PROJECT_PREREQUISITE_CYCLE
    status: 409
    message: "The project prerequisite chain contains a cycle."
    triggered_by: "pointing prerequisite_project_id at a project that already depends on the new one"

  - error_id: ERR_DUPLICATE_JURISDICTION_CODE
    status: 409
    message: "jurisdiction_code is already in use."
    triggered_by: "creating a second jurisdiction with jurisdiction_code CITY-HARBOR"

  - error_id: ERR_DUPLICATE_ENDORSEMENT
    status: 409
    message: "This jurisdiction has already endorsed in this round."
    triggered_by: "casting a second live endorsement for the same (plan_cycle_id, jurisdiction_id, round_number)"

  - error_id: ERR_DUPLICATE_ASSET_LINK
    status: 409
    message: "This asset is already linked to the project."
    triggered_by: "posting the same (project_id, asset_id) pair twice"

  - error_id: ERR_NO_ASSESSED_VULNERABILITY
    status: 409
    message: "The asset has no assessed vulnerability to rank against."
    triggered_by: "ranking an asset whose only assessments are DRAFT or STALE"

  - error_id: ERR_NO_LINKED_ASSETS
    status: 409
    message: "The project has no linked assets to analyze."
    triggered_by: "requesting an analysis for a screened-in project with zero ProjectAssetLink rows"

  - error_id: ERR_ASSET_RANKING_REQUIRED
    status: 409
    message: "Every linked lifeline asset must be ranked first."
    triggered_by: "requesting an analysis, or allocating capital, while a linked asset sits in RECOMPUTE_REQUIRED"

  - error_id: ERR_PREREQUISITE_NOT_AWARDED
    status: 409
    message: "The prerequisite project has not been awarded."
    triggered_by: "submitting a grant for a project whose prerequisite is only PROGRAMMED"

  - error_id: ERR_ENGAGEMENT_INCOMPLETE
    status: 409
    message: "Not enough completed engagement sessions to open an endorsement round."
    triggered_by: "opening an endorsement round with 1 COMPLETED session while required_session_count is 2"

  - error_id: ERR_NO_SCREENED_PROJECTS
    status: 409
    message: "The plan cycle has no screened-in projects."
    triggered_by: "opening an endorsement round when every project is PROPOSED or SCREENED_OUT"

  - error_id: ERR_INDICATOR_NOT_DEFINED
    status: 409
    message: "The project has no implementation indicator defined."
    triggered_by: "posting an indicator report for a project created without indicator_code and indicator_target_value"

  - error_id: ERR_SESSION_WINDOW_CONFLICT
    status: 409
    message: "The session window conflicts with an existing session for this host jurisdiction."
    triggered_by: "scheduling a J_HARBOR session that starts exactly 24 hours after another J_HARBOR session ends"

  - error_id: ERR_AID_CONCURRENCY_LIMIT
    status: 409
    message: "The pact's concurrent commitment limit would be exceeded."
    triggered_by: "a fourth overlapping commitment on a pact whose max_concurrent_commitments is 3"

  - error_id: ERR_AID_CAPACITY_EXCEEDED
    status: 409
    message: "The pact's pledged units would be exceeded at some instant in the window."
    triggered_by: "adding a 3-unit commitment that lifts the peak overlapping load to 11 against a 10-unit pledge"

  - error_id: ERR_PROGRAM_FUNDS_EXCEEDED
    status: 409
    message: "The capital program has insufficient available funds."
    triggered_by: "allocating 40000000 against a program with 30000000 available"

  - error_id: ERR_BCR_BELOW_FLOOR
    status: 409
    message: "The benefit-cost ratio is below the grant eligibility floor."
    triggered_by: "certifying an analysis whose bcr is 0.9439, or submitting a grant for a project whose certified analysis is not grant_eligible"

  - error_id: ERR_GRANT_ON_HOLD
    status: 409
    message: "Grant submission is on hold for this project."
    triggered_by: "submitting a grant while grant_hold_flag is true because the program posture is CLOSED"

  - error_id: ERR_INVALID_REQUEST
    status: 422
    message: "The request payload is malformed."
    triggered_by: "a missing required field, an undeclared enum value, or a score outside [0, 1]"

  - error_id: ERR_INVALID_WINDOW
    status: 422
    message: "window_start must be strictly before window_end."
    triggered_by: "a session or pact window whose start equals or follows its end"

  - error_id: ERR_ATTENDANCE_MISMATCH
    status: 422
    message: "disadvantaged_attendee_count may not exceed attendee_count."
    triggered_by: "completing a session with attendee_count 80 and disadvantaged_attendee_count 90"

  - error_id: ERR_CONDITION_NOTE_REQUIRED
    status: 422
    message: "condition_note is required for a CONDITIONED endorsement."
    triggered_by: "casting decision CONDITIONED with no condition_note"

  - error_id: ERR_AID_WINDOW_OUTSIDE_PACT
    status: 422
    message: "The commitment window must lie inside the pact window."
    triggered_by: "a commitment ending after the pact's window_end"

  - error_id: ERR_ALLOCATION_EXCEEDS_PROJECT_COST
    status: 422
    message: "allocated_cents may not exceed the project's total program cost."
    triggered_by: "allocating 60000000 to a project whose total_program_cost_cents is 51273600"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegionalAdministrator
    identity:
      kind: opaque
      header: X-User-ID
      resolution: "the header value is carried as an opaque actor id; it is not resolved to any entity"
    description: "Regional planning agency staff who run the plan cycle, the asset register and the capital program."
    exclusive_operations:
      - "POST /resilience/jurisdictions"
      - "PATCH /resilience/jurisdictions/{jurisdiction_id}"
      - "POST /resilience/plan-cycles"
      - "POST /resilience/plan-cycles/{plan_cycle_id}/open-engagement"
      - "POST /resilience/plan-cycles/{plan_cycle_id}/open-endorsement-round"
      - "POST /resilience/plan-cycles/{plan_cycle_id}/close-endorsement-round"
      - "POST /resilience/assets"
      - "PATCH /resilience/assets/{asset_id}"
      - "POST /resilience/projects/{project_id}/screen"
      - "POST /resilience/projects/{project_id}/grant-award"
      - "POST /resilience/capital-programs"
      - "POST /resilience/capital-programs/{program_id}/allocations"
      - "POST /resilience/_clock/set_current_utc"
    shared_operations:
      - "every GET under /resilience"

  - name: HazardAnalyst
    identity:
      kind: opaque
      header: X-User-ID
      resolution: "the header value is carried as an opaque actor id; it is not resolved to any entity"
    description: "Climate science staff who own downscaled projections, vulnerability assessment and asset criticality ranking."
    exclusive_operations:
      - "POST /resilience/hazard-profiles"
      - "POST /resilience/hazard-profiles/{hazard_profile_id}/publish"
      - "POST /resilience/hazard-profiles/{hazard_profile_id}/revisions"
      - "POST /resilience/assets/{asset_id}/criticality-ranking"
      - "POST /resilience/vulnerability-assessments"
      - "POST /resilience/vulnerability-assessments/{assessment_id}/assess"
    shared_operations:
      - "every GET under /resilience"

  - name: ProjectSponsor
    identity:
      kind: entity_backed
      header: X-User-ID
      entity: Jurisdiction
      resolution: "X-User-ID is the id of the Jurisdiction sponsoring the project; the caller may only act on AdaptationProject rows whose jurisdiction_id equals that id"
    description: "The sponsoring jurisdiction's project manager, who proposes projects, links assets, prepares analyses and reports indicators."
    exclusive_operations:
      - "POST /resilience/projects"
      - "PATCH /resilience/projects/{project_id}"
      - "POST /resilience/projects/{project_id}/asset-links"
      - "POST /resilience/projects/{project_id}/analyses"
      - "POST /resilience/projects/{project_id}/withdraw"
      - "POST /resilience/projects/{project_id}/grant-submission"
      - "POST /resilience/projects/{project_id}/indicator-reports"
    shared_operations:
      - "every GET under /resilience"

  - name: BCAReviewer
    identity:
      kind: opaque
      header: X-User-ID
      resolution: "the header value is carried as an opaque reviewer id and is compared against BenefitCostAnalysis.prepared_by_user_id for segregation of duties"
    description: "Independent benefit-cost reviewer who certifies or rejects an analysis but never prepares one."
    exclusive_operations:
      - "POST /resilience/analyses/{analysis_id}/certify"
      - "POST /resilience/analyses/{analysis_id}/reject"
    shared_operations:
      - "every GET under /resilience"

  - name: JurisdictionDelegate
    identity:
      kind: entity_backed
      header: X-User-ID
      entity: Jurisdiction
      resolution: "X-User-ID is the id of the Jurisdiction the delegate speaks for; the caller may only endorse, host sessions, host pacts and request aid for that jurisdiction"
    description: "The member jurisdiction's delegate to the regional body, who runs engagement, casts weighted endorsements and negotiates mutual aid."
    exclusive_operations:
      - "POST /resilience/plan-cycles/{plan_cycle_id}/engagement-sessions"
      - "POST /resilience/engagement-sessions/{session_id}/complete"
      - "POST /resilience/plan-cycles/{plan_cycle_id}/endorsements"
      - "POST /resilience/mutual-aid-pacts"
      - "POST /resilience/mutual-aid-pacts/{pact_id}/commitments"
      - "POST /resilience/mutual-aid-commitments/{commitment_id}/release"
      - "POST /resilience/mutual-aid-commitments/{commitment_id}/fulfill"
    shared_operations:
      - "every GET under /resilience"

  - name: EquityOfficer
    identity:
      kind: opaque
      header: X-User-ID
      resolution: "the header value is carried as an opaque actor id; it is not resolved to any entity"
    description: "Regional equity officer who alone may waive the capital program's equity benefit floor for a specific project."
    exclusive_operations:
      - "POST /resilience/projects/{project_id}/equity-waiver"
    shared_operations:
      - "every GET under /resilience"

segregation_of_duties:
  - name: bca-preparer-may-not-certify
    tracked_by: X-User-ID
    step_a: "POST /resilience/projects/{project_id}/analyses (records prepared_by_user_id)"
    step_b: "POST /resilience/analyses/{analysis_id}/certify and POST /resilience/analyses/{analysis_id}/reject"
    rule: "the X-User-ID performing step_b must differ from the prepared_by_user_id recorded at step_a"
    error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
