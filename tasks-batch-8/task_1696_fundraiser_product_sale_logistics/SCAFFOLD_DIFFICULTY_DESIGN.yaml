        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): the request violates at once both the
          order-payment state gate (order CANCELLED) and the overpayment fiscal guard
