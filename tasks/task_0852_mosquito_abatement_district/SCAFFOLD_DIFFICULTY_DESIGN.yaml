            - "surveillance-report.larval_index == 0.00"
            - "surveillance-report.degree_days == 0.0"
            - "surveillance-report.mir_provisional == 0.00"
            - "surveillance-report.mir_confirmed == 0.00"
            - "surveillance-report.vector_index_provisional == 0.00"
            - "surveillance-report.risk_posture == NORMAL"
            - "surveillance-report.posture_source == NO_ASSESSMENT"
            - "surveillance-report.request_total_count == 0"
            - "surveillance-report.request_open_count == 0"
            - "HTTP status == 200"

      - name: aerial_schedule_lead_time_exactly_forty_eight_hours_is_allowed
        grounds:
          - validations[priority=19]
          - state_machines.TreatmentPlan.APPROVED_to_SCHEDULED
          - errors[ERR_NOTIFICATION_LEAD_TIME]
          - constants.AERIAL_NOTIFICATION_LEAD_HOURS
        distinguishing_aspect: |
          Boundary metric #3 is the aerial notification LEAD TIME on a third endpoint
          (POST /treatment-plans/{id}/transitions): a scheduled_start_at 47 hours ahead
          is refused with ERR_NOTIFICATION_LEAD_TIME while exactly 48 hours ahead
          (2026-06-03T00:00:00.000Z against a clock of 2026-06-01T00:00:00.000Z) is
