            - "req_a_after_suspend == \"WITHDRAWN\""
            - "req_b_after_suspend == \"HELD\""
            - "plan_resumed == \"ACTIVE\" and Offering.${off_id}.repurchase_plan_suspension_reason == null"
            - "RepurchasePeriod.${rp_id}.status == \"OPEN\" after the resume"
            - "req_a_after_resume == \"WITHDRAWN\""
            - "req_b_after_resume == \"QUEUED\""

  # ===========================================================================
  - section: calculations
    instances:
      - name: vote_tally_rejects_with_quorum_when_for_shares_are_exactly_half
        claim_type: correct_result
        grounds:
          - calculations.vote_tally
          - entities.LiquidityEvent.fields.record_date_shares_e4
          - entities.StockholderVote.fields.choice
          - state_machines.LiquidityEvent.VOTE_OPEN_to_REJECTED
        distinguishing_aspect: |
          An ABSTAIN ballot must count toward quorum and never toward approval, so
          a vote where FOR shares are exactly half of the record-date shares must
          close REJECTED with quorum_met true — not APPROVED on a majority of
          shares actually cast.
        test_recipe:
          setup:
            - "Offering 'Halcyon Income REIT' at 1000 cents per share with a zero-load class I and a 30000000-cent minimum offering."
            - "Two documented investors each subscribe 15000000 cents; breaking escrow accepts both and mints one 150000000 e4 lot each, so shares_outstanding_e4 is 300000000."
            - "A LISTING liquidity event is board-approved and its vote opened, snapshotting record_date_shares_e4 = 300000000."
            - "Investor A (150000000 e4) votes FOR and investor B (150000000 e4) votes ABSTAIN, so cast_e4 = 300000000."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Halcyon Income REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
