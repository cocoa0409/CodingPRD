scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: purchase_settlement_lookback_vs_no_lookback
        grounds:
          - calculations.purchase_settlement
          - entities.Plan.fields.lookback_enabled
          - entities.OfferingPeriod.fields.grant_date_fmv_cents
          - entities.OfferingPeriod.fields.purchase_date_fmv_cents
          - state_machines.OfferingPeriod.CLOSED_to_PURCHASED
        distinguishing_aspect: |
          Two valid algorithms for share-pricing on the OfferingPeriod / Purchase domain produce
          different per-share prices and different shares_purchased from identical contribution and
          FMV inputs: with lookback_enabled the chosen FMV is MIN(grant_fmv, purchase_fmv), without
          lookback only purchase_fmv is used. This is the OfferingPeriod/Purchase entity domain
          (price ledger), distinct from the participant-level tax-basis variant below.
        test_recipe:
          setup:
            - "Two Plans P1 (lookback_enabled=true) and P2 (lookback_enabled=false), discount_bp=1500, offering_period_months=6, annual_accrual_cap_cents=2_500_000."
            - "Both plans activated, each with one OfferingPeriod (sequence_number=1), start_date=2025-01-01, grant_date_fmv_cents=1000."
            - "Each plan has one Participant U1 enrolled at contribution_rate_bp=1500."
            - "PayrollAgent posts contributions totalling 17_000 cents per enrollment, all status=POSTED."
            - "POST /_clock/advance to 2025-07-01."
            - "PATCH /offering-periods/{P1.op1}/fmv body {purchase_date_fmv_cents: 2000, version: 1}; same for P2."
            - "POST /_sweep/run to advance both OfferingPeriods OPEN -> CLOSED."
          trigger:
            - "POST /offering-periods/{P1.op1}/run-purchase as PlanAdministrator (different X-User-ID than the PayrollAgent who posted contributions)."
            - "POST /offering-periods/{P2.op1}/run-purchase as PlanAdministrator (different X-User-ID than the PayrollAgent who posted contributions)."
          assert:
            - "Purchase under P1: chosen_fmv_cents == 1000, purchase_price_cents == 850, shares_purchased == 20, refund_cents == 0."
            - "Purchase under P2: chosen_fmv_cents == 2000, purchase_price_cents == 1700, shares_purchased == 10, refund_cents == 0."
            - "P1.Purchase.shares_purchased != P2.Purchase.shares_purchased even though contributions and both FMVs were identical."

      - name: disposition_tax_qualifying_vs_disqualifying
        grounds:
          - calculations.disposition_tax_split
          - entities.Disposition.fields.classification
          - entities.Disposition.fields.ordinary_income_cents
          - entities.Disposition.fields.capital_gain_cents
          - state_machines.Purchase.HELD_to_DISPOSED_QUALIFYING
          - state_machines.Purchase.HELD_to_DISPOSED_DISQUALIFYING
        distinguishing_aspect: |
          On the Disposition entity (taxpayer reporting domain — distinct from the Purchase-pricing
          ledger), two valid IRS algorithms split the same sale into different ordinary_income_cents
          and capital_gain_cents depending on whether the disposition is QUALIFYING (lesser-of-actual-
          gain-or-theoretical-discount) or DISQUALIFYING (full spread at purchase).
        test_recipe:
          setup:
            - "Plan P with discount_bp=1500, lookback_enabled=true, offering_period_months=6."
            - "OfferingPeriod op1: start_date=2024-01-01, grant_date_fmv_cents=1000."
            - "Participant U1 enrolled, contributions 8_500 cents posted."
            - "POST /_clock/advance to 2024-07-01; PATCH op1/fmv {purchase_date_fmv_cents: 2000, version: 1}; POST /_sweep/run; POST /op1/run-purchase."
            - "Purchase P1 has grant_date=2024-01-01, purchase_date=2024-07-01, chosen_fmv_cents=1000, purchase_price_cents=850, shares_purchased=10."
          trigger:
            - "Branch A (DISQUALIFYING): POST /_clock/advance to 2025-12-31; POST /dispositions as U1 body {purchase_id: P1.id, disposition_date: 2025-12-31, shares_disposed: 10, sale_price_per_share_cents: 2500}."
            - "Branch B (QUALIFYING, re-run on a fresh fixture identical to setup): POST /_clock/advance to 2026-01-01; POST /dispositions as U1 body {purchase_id: P1.id, disposition_date: 2026-01-01, shares_disposed: 10, sale_price_per_share_cents: 2500}."
          assert:
            - "Branch A: Disposition.classification == 'DISQUALIFYING', ordinary_income_cents == 11500, capital_gain_cents == 5000."
            - "Branch B: Disposition.classification == 'QUALIFYING', ordinary_income_cents == 1500, capital_gain_cents == 15000."
            - "Branch A.ordinary_income_cents != Branch B.ordinary_income_cents for identical sale_price_per_share_cents."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dilution_score_three_inputs_nonlinear   # mode (a)
        grounds:
          - calculations.purchase_dilution_warning_score
          - entities.Plan.fields.max_contribution_rate_bp
          - entities.Plan.fields.annual_accrual_cap_cents
        distinguishing_aspect: |
          Mode (a): a formula with three inputs (rate_factor, cap_factor, participation) and a
          non-linear branch — when rate_factor < 0.5 the cap and participation terms are scaled by
          rate_factor squared, changing the score regime. Distinct from the rounding-order mode below.
        test_recipe:
          setup:
            - "Plan P with max_contribution_rate_bp=1500, annual_accrual_cap_cents=2_500_000, activated."
            - "OfferingPeriod op1 OPEN with 5 ACTIVE Enrollments."
          trigger:
            - "GET /plans/{P.id}/dilution-preview?eligible_employee_count=10"
          assert:
            - "response.dilution_score == 85   # 100*(0.4*1.0 + 0.3*1.0 + 0.3*0.5) == 85, rate_factor==1.0 path"

      - name: purchase_round_then_floor_order      # mode (b)
        grounds:
          - calculations.purchase_settlement
          - entities.Purchase.fields.purchase_price_cents
          - entities.Purchase.fields.shares_purchased
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round_half_up the per-share price ONCE at
          (chosen_fmv * (10000 - discount_bp) / 10000), THEN integer-floor shares = total_contrib /
          per_share_price. A naive alternative ("compute total discount then divide") would give a
          different shares_purchased on inputs that straddle a cent. This is a different combinatorial
          axis from mode (a)'s non-linear branching and from mode (c)'s evaluation-order pinning.
        test_recipe:
          setup:
            - "Plan P discount_bp=1500, lookback_enabled=true, offering_period_months=6."
            - "OfferingPeriod op1 grant_date_fmv_cents=333."
            - "Participant U1 enrolled; contributions totalling 1000 cents posted."
            - "POST /_clock/advance past end_date; PATCH op1/fmv {purchase_date_fmv_cents: 500, version: 1}; POST /_sweep/run; POST /op1/run-purchase."
          trigger:
            - "GET /purchases/{P1.id}"
          assert:
            - "Purchase.chosen_fmv_cents == 333"
            - "Purchase.purchase_price_cents == 283    # round_half_up(333 * 8500 / 10000) == round_half_up(283.05) == 283"
            - "Purchase.shares_purchased == 3          # floor(1000 / 283) == 3"
            - "Purchase.refund_cents == 151            # 1000 - 3*283 == 151"

      - name: contribution_cap_pinned_eval_order    # mode (c)
        grounds:
          - calculations.contribution_amount
          - entities.Enrollment.fields.ytd_accrual_cents
          - entities.Plan.fields.annual_accrual_cap_cents
          - entities.Plan.fields.discount_bp
        distinguishing_aspect: |
          Mode (c): the cash withholding cap is circular-looking — amount_cents depends on
          remaining_cash_cap_cents which is derived from remaining_accrual_cents converted at the
          discount applied to grant_date_fmv. The scaffold pins the evaluation order: (1) compute raw,
          (2) compute remaining_accrual from ytd_accrual (which itself only updates at PURCHASE time
          using grant_date_fmv, not at contribution time), (3) take min. This produces a well-defined
          amount that a naive ordering ("subtract amount from accrual first, then cap") would not.
        test_recipe:
          setup:
            - "Plan P discount_bp=1500, annual_accrual_cap_cents=2_500_000, offering_period_months=6, activated."
            - "Participant U1 enrolled at contribution_rate_bp=1500."
            - "Enrollment.ytd_accrual_cents pre-loaded to 2_499_500 (via a prior COMPLETED offering period)."
          trigger:
            - "POST /enrollments/{U1.enrollment_id}/contributions body {pay_period_end: 2025-01-15, gross_pay_cents: 10000}"
          assert:
            - "Contribution.amount_cents == 425   # raw=1500, remaining_accrual=500, remaining_cash_cap=floor(500*8500/10000)=425, min(1500, 425)=425"
            - "Enrollment.ytd_accrual_cents unchanged at 2_499_500   # ytd_accrual is debited only at PURCHASE time, not at contribution time"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: purchase_parallel_holding_and_disposition_dimensions
        grounds:
          - state_machines.Purchase
          - entities.Purchase.fields.holding_period_status
          - entities.Purchase.fields.disposition_status
        distinguishing_aspect: |
          Purchase carries two independent state dimensions on the SAME row — holding_period_status
          (WITHIN_BOTH -> PAST_ONE_YEAR_FROM_PURCHASE -> QUALIFYING_MATURE, driven by clock + sweep)
          and disposition_status (HELD -> DISPOSED_QUALIFYING | DISPOSED_DISQUALIFYING, driven by
          Disposition rows). The two dimensions advance independently: holding maturation can occur
          while disposition_status remains HELD; disposition can fire while holding is still WITHIN_BOTH.
          This is the parallel-dimensions shape, on the Purchase entity.
        test_recipe:
          setup:
            - "Plan P discount_bp=1500, offering_period_months=6, lookback_enabled=true, activated."
            - "OfferingPeriod op1 start_date=2024-01-01, grant_date_fmv_cents=1000."
            - "Participant U1 enrolled; contributions 8500 cents posted."
            - "POST /_clock/advance to 2024-07-01; PATCH op1/fmv {purchase_date_fmv_cents: 2000, version: 1}; POST /_sweep/run; POST /op1/run-purchase."
          trigger:
            - "Step 1: POST /_clock/advance to 2025-07-01; POST /_sweep/run."
            - "Step 2: GET /purchases/{P1.id}."
          assert:
            - "After Step 2: Purchase.holding_period_status == 'PAST_ONE_YEAR_FROM_PURCHASE'   # >=1y from purchase_date, <2y from grant_date"
            - "After Step 2: Purchase.disposition_status == 'HELD'                              # no disposition filed yet — independent dimension"

      - name: disposition_branching_with_revert_to_held
        grounds:
          - state_machines.Disposition
          - state_machines.Purchase.HELD_to_DISPOSED_QUALIFYING
          - state_machines.Purchase.HELD_to_DISPOSED_DISQUALIFYING
        distinguishing_aspect: |
          Disposition exhibits a branching+revert non-linear shape on a different entity than Purchase:
          REPORTED -> AMENDED -> VOIDED, with a side-effect cycle on the linked Purchase
          (disposition_status: HELD -> DISPOSED_* -> HELD when the only Disposition is VOIDED).
          Different entity from the parallel-dimensions Purchase instance above.
        test_recipe:
          setup:
            - "Same fixture as purchase_parallel_holding_and_disposition_dimensions through Purchase creation."
            - "POST /_clock/advance to 2025-12-31."
            - "POST /dispositions as U1 body {purchase_id: P1.id, disposition_date: 2025-12-31, shares_disposed: 10, sale_price_per_share_cents: 2500} -> D1 (REPORTED, DISQUALIFYING)."
          trigger:
            - "Step 1: PATCH /dispositions/{D1.id} body {sale_price_per_share_cents: 3000, version: 1}."
            - "Step 2: DELETE /dispositions/{D1.id}."
            - "Step 3: GET /purchases/{P1.id}."
          assert:
            - "After Step 1: Disposition.status == 'AMENDED', capital_gain_cents == 10000   # 10*(3000-2000)"
            - "After Step 2: Disposition.status == 'VOIDED'"
            - "After Step 3: Purchase.disposition_status == 'HELD'   # reverted from DISPOSED_DISQUALIFYING because no non-VOIDED Disposition remains"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: run_purchase_cascade_depth_4
        grounds:
          - state_machines.OfferingPeriod.CLOSED_to_PURCHASED
          - state_machines.Enrollment.ACTIVE_to_COMPLETED
          - entities.Contribution.fields.status
          - entities.Form3922
          - entities.OfferingPeriod
        distinguishing_aspect: |
          Triggered by POST /offering-periods/{id}/run-purchase, the cascade is depth 4 with each link
          caused by the previous one (not fanout from the original action):
            (1) OfferingPeriod CLOSED -> PURCHASED
            (2) which causes Enrollment ACTIVE -> COMPLETED (per-enrollment write within the batch)
            (3) which causes Contribution.status POSTED -> CONSUMED on every funding contribution of
                that enrollment
            (4) which causes Form3922 issuance keyed to the new Purchase row.
          The next OfferingPeriod creation is a sibling fan-out, NOT counted in this chain.
        test_recipe:
          setup:
            - "Plan P activated; OfferingPeriod op1 OPEN; Participant U1 enrolled with status=ACTIVE; three Contributions on U1.enrollment posted (POSTED)."
            - "POST /_clock/advance past end_date; PATCH op1/fmv; POST /_sweep/run -> op1 status=CLOSED."
          trigger:
            - "POST /offering-periods/{op1.id}/run-purchase as PlanAdministrator (different X-User-ID from PayrollAgent)."
          assert:
            - "op1.status == 'PURCHASED'                                 # link 1"
            - "U1.enrollment.status == 'COMPLETED'                       # link 2 caused by link 1"
            - "All three Contributions of U1.enrollment have status == 'CONSUMED'   # link 3 caused by link 2"
            - "Exactly one Form3922 exists with purchase_id == new Purchase.id      # link 4 caused by link 3 (purchase row materialized inside link 2)"

      - name: withdraw_cascade_depth_2
        grounds:
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - entities.Contribution.fields.status
        distinguishing_aspect: |
          Triggered by POST /enrollments/{id}/withdraw (different trigger from run-purchase). Depth-2
          chain caused link-by-link:
            (1) Enrollment ACTIVE -> WITHDRAWN
            (2) which causes every Contribution.status POSTED -> REFUNDED for that enrollment.
          Distinct propagation pattern: withdraw blocks the period's purchase batch from including
          this enrollment, but does not advance OfferingPeriod state.
        test_recipe:
          setup:
            - "Plan P activated; OfferingPeriod op1 OPEN; Participant U1 enrolled; two Contributions on U1.enrollment posted (POSTED)."
          trigger:
            - "POST /enrollments/{U1.enrollment_id}/withdraw as U1."
          assert:
            - "U1.enrollment.status == 'WITHDRAWN'                            # link 1"
            - "Both Contributions of U1.enrollment have status == 'REFUNDED'  # link 2 caused by link 1"
            - "Subsequent POST /op1/run-purchase produces NO Purchase row for U1 (verified via GET /participants/{U1.id}/purchases returns empty)."

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_contribution
        grounds:
          - validations[priority=6]    # ERR_PERIOD_NOT_OPEN (state)
          - validations[priority=11]   # ERR_ANNUAL_ACCRUAL_CAP_EXCEEDED (business_fiscal)
        distinguishing_aspect: |
          Pair {state, business_fiscal}: POST /contributions on an enrollment whose OfferingPeriod has
          already advanced to CLOSED AND whose YTD accrual would exceed the cap. State check at
          priority 6 wins (ERR_PERIOD_NOT_OPEN), not the fiscal check at priority 11.
        test_recipe:
          setup:
            - "Plan P activated; op1 with end_date 2025-07-01; U1 enrolled."
            - "Preload Enrollment.ytd_accrual_cents to 2_500_000 (cap hit)."
            - "POST /_clock/advance to 2025-07-02; PATCH op1/fmv; POST /_sweep/run -> op1 status=CLOSED."
          trigger:
            - "POST /enrollments/{U1.enrollment_id}/contributions body {pay_period_end: 2025-07-15, gross_pay_cents: 10000}."
          assert:
            - "Response HTTP 409 with error_id == 'ERR_PERIOD_NOT_OPEN'   # state wins over fiscal because priority 6 < priority 11"

      - name: business_safety_vs_business_constraint_on_run_purchase
        grounds:
          - validations[priority=8]    # ERR_SOD_VIOLATION (business_safety)
          - validations[priority=9]    # ERR_PERIOD_LENGTH_OUT_OF_RANGE (business_constraint)
        distinguishing_aspect: |
          Different error-category pair {business_safety, business_constraint}: POST /run-purchase by
          a user who has also posted contributions on the period (SoD violation), on a plan that
          ALSO has an out-of-range offering_period_months (constraint violation injected via direct
          DB-state setup since PATCH would normally reject). The safety check at priority 8 wins over
          the constraint check at priority 9.
        test_recipe:
          setup:
            - "Plan P with offering_period_months=24 then directly mutate to 25 via privileged setup (test fixture), op1 created in setup state CLOSED."
            - "Same X-User-ID 'admin_42' first POSTs a Contribution to an enrollment under op1 (acting as PayrollAgent role), then attempts to POST /op1/run-purchase (acting as PlanAdministrator role)."
          trigger:
            - "POST /offering-periods/{op1.id}/run-purchase as X-User-ID=admin_42, X-User-Role=PlanAdministrator."
          assert:
            - "Response HTTP 403 with error_id == 'ERR_SOD_VIOLATION'   # business_safety priority 8 wins over business_constraint priority 9"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: holding_period_exact_two_year_boundary
        grounds:
          - state_machines.Purchase.WITHIN_BOTH_to_QUALIFYING_MATURE
          - state_machines.Purchase.HELD_to_DISPOSED_QUALIFYING
          - state_machines.Purchase.HELD_to_DISPOSED_DISQUALIFYING
          - entities.Disposition.fields.classification
        distinguishing_aspect: |
          Numeric/temporal threshold metric on the Disposition classification predicate (>= vs >):
          QUALIFYING iff disposition_date >= grant_date+2y AND disposition_date >= purchase_date+1y.
          Tests both sides of the exact 2-year-from-grant boundary on the same Purchase. Reachable
          through POST /dispositions endpoint.
        test_recipe:
          setup:
            - "Plan P, op1 start_date=2024-01-01, end_date=2024-07-01, grant_date_fmv_cents=1000, purchase_date_fmv_cents=2000, discount_bp=1500."
            - "Participant U1 enrolled, contributions 8500 cents -> Purchase P1 with grant_date=2024-01-01, purchase_date=2024-07-01, shares_purchased=10, chosen_fmv_cents=1000, purchase_price_cents=850."
          trigger:
            - "Branch A: POST /_clock/advance to 2025-12-31T23:59:59.999Z; POST /dispositions body {purchase_id: P1.id, disposition_date: '2025-12-31', shares_disposed: 10, sale_price_per_share_cents: 2500}."
            - "Branch B (fresh fixture identical to setup): POST /_clock/advance to 2026-01-01T00:00:00.000Z; POST /dispositions body {purchase_id: P1.id, disposition_date: '2026-01-01', shares_disposed: 10, sale_price_per_share_cents: 2500}."
          assert:
            - "Branch A: Disposition.classification == 'DISQUALIFYING'   # 2025-12-31 < 2026-01-01 (grant+2y), so DISQUALIFYING"
            - "Branch B: Disposition.classification == 'QUALIFYING'      # 2026-01-01 == grant+2y, >= boundary inclusive, QUALIFYING"

      - name: shares_disposed_empty_inventory_boundary
        grounds:
          - validations[priority=14]   # ERR_SHARES_EXCEED_BALANCE
          - entities.Purchase.fields.shares_purchased
          - entities.Disposition.fields.shares_disposed
        distinguishing_aspect: |
          Different metric (collection-cardinality / inventory boundary, NOT a temporal threshold):
          zero-quantity / empty-set edge on shares_disposed against remaining undisposed shares on
          Purchase. Reachable through a different endpoint (POST /dispositions) and tests the
          equal-vs-greater boundary, distinct from the temporal >= boundary above.
        test_recipe:
          setup:
            - "Same fixture as holding_period_exact_two_year_boundary up to Purchase creation."
            - "Disposition D1 already filed for all 10 shares (POST /dispositions {shares_disposed: 10}); D1.status==REPORTED."
            - "POST /_clock/advance to 2026-01-15 (post-qualifying)."
          trigger:
            - "Branch A: POST /dispositions body {purchase_id: P1.id, disposition_date: '2026-01-15', shares_disposed: 1, sale_price_per_share_cents: 2600}."
            - "Branch B: POST /dispositions body {purchase_id: P1.id, disposition_date: '2026-01-15', shares_disposed: 0, sale_price_per_share_cents: 2600}."
          assert:
            - "Branch A: Response HTTP 422 with error_id == 'ERR_SHARES_EXCEED_BALANCE'   # remaining inventory == 0, requested 1 > 0"
            - "Branch B: Response HTTP 422 with error_id == 'ERR_SHARES_EXCEED_BALANCE'   # shares_disposed must be > 0; zero is below the valid floor (treated as boundary violation)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_requires_offering_period_open
        grounds:
          - validations[priority=6]
          - state_machines.Enrollment
          - state_machines.OfferingPeriod
        distinguishing_aspect: |
          Entity pair (Enrollment, OfferingPeriod): a POST /offering-periods/{id}/enrollments is
          accepted only if the parent OfferingPeriod.status == OPEN. The valid transition of one
          entity depends on the state of a sibling entity.
        test_recipe:
          setup:
            - "Plan P activated; op1 OPEN."
            - "POST /_clock/advance past end_date; PATCH op1/fmv; POST /_sweep/run -> op1 status=CLOSED."
          trigger:
            - "POST /offering-periods/{op1.id}/enrollments as Participant U2 body {contribution_rate_bp: 500}."
          assert:
            - "Response HTTP 409 with error_id == 'ERR_PERIOD_NOT_OPEN'   # Enrollment creation gated on OfferingPeriod.status"

      - name: disposition_requires_purchase_held_or_amend
        grounds:
          - validations[priority=14]
          - state_machines.Disposition
          - state_machines.Purchase
          - entities.Purchase.fields.shares_purchased
        distinguishing_aspect: |
          Different entity pair (Disposition, Purchase): creating a Disposition depends on Purchase
          having remaining undisposed shares (purchase-side inventory state). Distinct pair from
          (Enrollment, OfferingPeriod) above.
        test_recipe:
          setup:
            - "Plan P, op1, Participant U1 enrolled, Purchase P1 with shares_purchased=10."
            - "POST /_clock/advance to 2026-01-15."
            - "POST /dispositions filing all 10 shares -> D1 (REPORTED, status_propagation Purchase.disposition_status == DISPOSED_QUALIFYING)."
          trigger:
            - "POST /dispositions as U1 body {purchase_id: P1.id, disposition_date: '2026-02-01', shares_disposed: 5, sale_price_per_share_cents: 2700}."
          assert:
            - "Response HTTP 422 with error_id == 'ERR_SHARES_EXCEED_BALANCE'   # Purchase inventory state blocks new Disposition"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_uniqueness_per_offering_period
        grounds:
          - concurrency_rules[duplicate_enrollment]
          - validations[priority=10]
          - entities.Enrollment
          - entities.OfferingPeriod
        distinguishing_aspect: |
          Resource: OfferingPeriod (treated as the participant-occupancy window). Interval semantics:
          PARTICIPANT-SLOT-EXCLUSIVE on the closed interval [op.start_date, op.end_date) — a
          participant occupies at most one Enrollment slot per OfferingPeriod, regardless of when
          within the period the request lands. Adjacent enrollments in op_next are allowed
          (half-open boundary at end_date).
        test_recipe:
          setup:
            - "Plan P activated; op1 OPEN; Participant U1 already enrolled in op1."
          trigger:
            - "POST /offering-periods/{op1.id}/enrollments as U1 body {contribution_rate_bp: 1000}."
          assert:
            - "Response HTTP 409 with error_id == 'ERR_DUPLICATE_ENROLLMENT'   # same participant cannot occupy two enrollment slots in the same OfferingPeriod"
            - "After op1 PURCHASED and op2 OPEN, the same U1 CAN enroll in op2 -> 201 (adjacent intervals are allowed)."

      - name: offering_period_chained_back_to_back
        grounds:
          - state_machines.OfferingPeriod.CLOSED_to_PURCHASED
          - entities.OfferingPeriod.fields.start_date
          - entities.OfferingPeriod.fields.end_date
        distinguishing_aspect: |
          Different resource (the Plan's OfferingPeriod timeline) with different interval semantics:
          BACK-TO-BACK NON-OVERLAPPING — op_{N+1}.start_date == op_N.end_date exactly (closed-open
          adjacency). No two OfferingPeriods of the same Plan may overlap; the new one is created
          touching but not crossing the previous one. Different geometric treatment of adjacency
          (touching IS allowed here; touching is NOT a conflict) than the previous slot-exclusion rule.
        test_recipe:
          setup:
            - "Plan P offering_period_months=6, activated; op1 start_date=2025-01-01, end_date=2025-07-01."
            - "POST /_clock/advance to 2025-07-02; PATCH op1/fmv; POST /_sweep/run; POST /op1/run-purchase."
          trigger:
            - "GET /plans/{P.id}/offering-periods?status=OPEN."
          assert:
            - "Returned op2.start_date == '2025-07-01T00:00:00.000Z'  # exactly equal to op1.end_date"
            - "Returned op2.end_date == '2026-01-01T00:00:00.000Z'    # +6 months"
            - "op2.sequence_number == 2; op1.status == 'PURCHASED'; no overlapping pair exists."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contribution_then_withdraw_conserves_cash
        grounds:
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - entities.Contribution.fields.status
          - entities.Contribution.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: SUM over (POSTED + REFUNDED) Contribution.amount_cents for a given
          enrollment == the original posted total at every moment (refund is a status flip, not a
          delete). The forward action POST /contributions and the compensating action
          POST /enrollments/{id}/withdraw together leave the cash conservation invariant
          unchanged. Formally pinned as:
            invariant_cash(E) := SUM(Contribution.amount_cents WHERE enrollment_id==E.id AND status IN {POSTED, REFUNDED, CONSUMED})
          and invariant_cash(E) is identical before and after withdraw.
        test_recipe:
          setup:
            - "Plan P activated; op1 OPEN; Participant U1 enrolled."
            - "POST /contributions x 3, amounts 1000, 1500, 1200 -> all POSTED. invariant_cash = 3700."
          trigger:
            - "POST /enrollments/{U1.enrollment_id}/withdraw as U1."
          assert:
            - "After withdraw: SUM(Contribution.amount_cents WHERE enrollment_id==U1.enrollment_id AND status IN {POSTED, REFUNDED, CONSUMED}) == 3700   # cash conserved"
            - "All three contributions now have status == 'REFUNDED' (none POSTED, none CONSUMED)."

      - name: dispose_then_void_conserves_share_inventory
        grounds:
          - state_machines.Disposition.REPORTED_to_VOIDED
          - state_machines.Purchase.HELD_to_DISPOSED_DISQUALIFYING
          - entities.Purchase.fields.shares_purchased
          - entities.Disposition.fields.shares_disposed
        distinguishing_aspect: |
          Different conserved quantity (SHARE INVENTORY rather than cash). Invariant pinned as:
            remaining_shares(P) := P.shares_purchased - SUM(D.shares_disposed WHERE D.purchase_id==P.id AND D.status IN {REPORTED, AMENDED})
          The forward action POST /dispositions decreases the visible remaining_shares; the
          compensating action DELETE /dispositions/{id} restores it. Across the create+void pair
          the remaining-share invariant is unchanged, AND Purchase.disposition_status reverts to
          HELD when no non-VOIDED Disposition remains.
        test_recipe:
          setup:
            - "Plan P, op1, U1 enrolled, Purchase P1 with shares_purchased=10. POST /_clock/advance to 2026-01-15. remaining_shares(P1) initially == 10."
          trigger:
            - "Step 1: POST /dispositions as U1 body {purchase_id: P1.id, disposition_date: '2026-01-15', shares_disposed: 4, sale_price_per_share_cents: 2500} -> D1 (REPORTED)."
            - "Step 2: DELETE /dispositions/{D1.id} as U1."
          assert:
            - "After Step 1: remaining_shares(P1) == 6   # 10 - 4"
            - "After Step 2: remaining_shares(P1) == 10   # restored — share inventory conserved across dispose+void"
            - "After Step 2: Purchase.disposition_status == 'HELD'   # reverted from DISPOSED_DISQUALIFYING because no non-VOIDED Disposition remains"
