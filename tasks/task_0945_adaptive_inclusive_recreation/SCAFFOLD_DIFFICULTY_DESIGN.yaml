            - call: "POST /recreation/program-sessions/${sess}/unlock-staffing"
              payload: {}
              as: ActivityLead
              as_user_id: "${st1}"
            - call: "POST /recreation/program-sessions/${sess}/lock-staffing"
              payload: {}
              as: ActivityLead
              as_user_id: "${st1}"
            - call: "POST /recreation/program-sessions/${sess}/unlock-staffing"
              payload: {}
              as: ActivityLead
              as_user_id: "${st1}"
            - call: "POST /recreation/program-sessions/${sess}/lock-staffing"
              payload: {}
