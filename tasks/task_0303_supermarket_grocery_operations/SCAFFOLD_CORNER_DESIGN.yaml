# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Sections/claim_types from references/claim-extraction-guide.md. Every chain is
# executable from empty-DB using only §1.5 endpoints. Money in integer cents;
# weights in milli-units (1000 milli = 1 lb). excluded_because stubs cite a
# §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_computed_fields_zeroed
        claim_type: Creation
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "POST /products with required fields returns 201; on_hand_qty==0, on_hand_value_cents==0, status==ACTIVE; computed fields server-set."
        test_recipe:
          setup: ["Empty DB; one department."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Sugar", sku: "SKU-SUGAR", sell_by_weight: false, unit_price_cents: 199, is_perishable: false, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id }
          assert:
            - "HTTP 201"
            - "Product.${pid}.on_hand_qty == 0"
            - "Product.${pid}.on_hand_value_cents == 0"
            - "Product.${pid}.status == ACTIVE"
            - "Product.${pid}.reorder_flagged == true"

      - name: get_nonexistent_product_returns_not_found
        claim_type: Not Found
        grounds: [entities.Product, "errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{id} with a non-existent UUID returns 404 ERR_PRODUCT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_PRODUCT_NOT_FOUND"

      - name: create_product_missing_required_unit_price_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product.fields.unit_price_cents, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products omitting unit_price_cents returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One department."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "NoPrice", sku: "SKU-NP", sell_by_weight: false }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: weighed_product_without_plu_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Product.fields.plu, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Conditional-required: sell_by_weight=true with no plu returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One department."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "PRODUCE", name: "Produce" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "NoPLU", sell_by_weight: true, unit_price_cents: 100 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_department_code_conflict
        claim_type: Type Constraints
        grounds: [entities.Department.fields.code, "validations[priority=5]", "errors[ERR_DUPLICATE_RESOURCE]"]
        distinguishing_aspect: "A second department with the same code returns 409 ERR_DUPLICATE_RESOURCE."
        test_recipe:
          setup: ["One department with code GROCERY."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery 2" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_DUPLICATE_RESOURCE"

      - name: list_products_pagination_envelope
        claim_type: Listing
        grounds: [entities.Product, endpoints, response_envelope]
        distinguishing_aspect: "GET /products?limit=1 returns response_type array with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["Two products in one department."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "A", sku: "SKU-LA", sell_by_weight: false, unit_price_cents: 100 }
              as: PriceManager
              as_user_id: "pm-1"
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "B", sku: "SKU-LB", sell_by_weight: false, unit_price_cents: 100 }
              as: PriceManager
              as_user_id: "pm-1"
          trigger:
            - call: "GET /products?limit=1&offset=0"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
          assert:
            - "response_type == array"
            - "total_count == 2 and has_more == true"

      - name: system_fields_ignored_on_create
        claim_type: System Fields
        grounds: [entities.Product, "validations[priority=4]"]
        distinguishing_aspect: "Client-supplied on_hand_qty / status are ignored; server returns on_hand_qty==0 and status==ACTIVE regardless."
        test_recipe:
          setup: ["One department."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Ignore", sku: "SKU-IGN", sell_by_weight: false, unit_price_cents: 100, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id }
          assert:
            - "Product.${pid}.on_hand_qty == 0"
            - "Product.${pid}.status == ACTIVE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: quarantine_already_quarantined_lot_returns_not_active
        claim_type: Invalid Transitions
        grounds: [state_machines.InventoryLot.ACTIVE_to_QUARANTINED, "errors[ERR_LOT_NOT_ACTIVE]"]
        distinguishing_aspect: "Quarantining a lot already QUARANTINED returns 409 ERR_LOT_NOT_ACTIVE; no side effects."
        test_recipe:
          setup: ["One ACTIVE lot from receiving; quarantined once."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Q", sku: "SKU-Q", sell_by_weight: false, unit_price_cents: 99, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-Q1", expected_total_cents: 500 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/lines"
              payload: { product_id: "${pid}", ordered_qty: 5, accepted_qty: 5, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/receive"
              payload: { expected_product_version: "${pv}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "GET /inventory-lots?product_id=${pid}"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /inventory-lots/${lot_id}/quarantine"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
          trigger:
            - call: "POST /inventory-lots/${lot_id}/quarantine"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_LOT_NOT_ACTIVE"

      - name: reconcile_before_submit_returns_not_submitted
        claim_type: Invalid Transitions
        grounds: [state_machines.CycleCount.SUBMITTED_to_RECONCILED, "errors[ERR_CYCLE_COUNT_NOT_SUBMITTED]"]
        distinguishing_aspect: "Reconciling a DRAFT cycle count (not yet SUBMITTED) returns 409 ERR_CYCLE_COUNT_NOT_SUBMITTED."
        test_recipe:
          setup: ["A DRAFT cycle count for a department+product."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "CC", sku: "SKU-CC", sell_by_weight: false, unit_price_cents: 99, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id }
            - call: "POST /cycle-counts"
              payload: { department_id: "${dept_id}", product_id: "${pid}" }
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /cycle-counts/${cc_id}/reconcile"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_CYCLE_COUNT_NOT_SUBMITTED"

      - name: new_shipment_initial_state_pending
        claim_type: Initial State
        grounds: [state_machines.Shipment, entities.Shipment.fields.status]
        distinguishing_aspect: "A newly created shipment starts in PENDING."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-INIT", expected_total_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { sid: $.data.id }
          assert:
            - "HTTP 201"
            - "Shipment.${sid}.status == PENDING"

      - name: terminal_received_shipment_cannot_reject
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Shipment.RECEIVING_to_REJECTED, "errors[ERR_SHIPMENT_NOT_RECEIVING]"]
        distinguishing_aspect: "A RECEIVED (terminal) shipment cannot be rejected: returns 409 ERR_SHIPMENT_NOT_RECEIVING."
        test_recipe:
          setup: ["A RECEIVED shipment (one accepted line)."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "T", sku: "SKU-T", sell_by_weight: false, unit_price_cents: 99, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-T1", expected_total_cents: 500 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/lines"
              payload: { product_id: "${pid}", ordered_qty: 5, accepted_qty: 5, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/receive"
              payload: { expected_product_version: "${pv}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /shipments/${sid}/reject"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_SHIPMENT_NOT_RECEIVING"

      - name: cancel_priceplan_compensation_no_other_change
        claim_type: Valid Transition
        grounds: [state_machines.PricePlan.SCHEDULED_to_CANCELLED, entities.PricePlan.fields.status]
        distinguishing_aspect: "Cancel a SCHEDULED price plan -> status CANCELLED (200)."
        test_recipe:
          setup: ["A SCHEDULED price plan for a product."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "PP", sku: "SKU-PP", sell_by_weight: false, unit_price_cents: 200, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /price-plans"
              payload: { product_id: "${pid}", ad_price_cents: 150, effective_start: "2026-07-01T00:00:00Z", effective_end: "2026-07-08T00:00:00Z", expected_product_version: "${pv}" }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { ppid: $.data.id }
          trigger:
            - call: "POST /price-plans/${ppid}/cancel"
              payload: {}
              as: PriceManager
              as_user_id: "pm-1"
              captures: { st: $.data.status }
          assert:
            - "PricePlan.${ppid}.status == CANCELLED"

      - name: pull_lot_writeoff_drops_on_hand_to_zero
        claim_type: Side Effect Execution
        grounds: [state_machines.InventoryLot.ACTIVE_to_PULLED, calculations.product_inventory_rollup, entities.Product.fields.on_hand_qty]
        distinguishing_aspect: "Pulling the only ACTIVE lot writes remaining_qty to 0 and rolls up Product.on_hand_qty to 0, on_hand_value_cents to 0."
        test_recipe:
          setup: ["One ACTIVE lot remaining 5 @ cost 100 on a non-perishable product."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Pull", sku: "SKU-PULL", sell_by_weight: false, unit_price_cents: 99, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-PULL", expected_total_cents: 500 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/lines"
              payload: { product_id: "${pid}", ordered_qty: 5, accepted_qty: 5, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/receive"
              payload: { expected_product_version: "${pv}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "GET /inventory-lots?product_id=${pid}"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { lot_id: "$.data[0].id" }
          trigger:
            - call: "POST /inventory-lots/${lot_id}/pull"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { st: $.data.status }
          assert:
            - "InventoryLot.${lot_id}.status == PULLED"
            - "Product.${pid}.on_hand_qty == 0"
            - "Product.${pid}.on_hand_value_cents == 0"

      - name: expire_lot_before_due_returns_not_expired_yet
        claim_type: Precondition Enforcement
        grounds: [state_machines.InventoryLot.ACTIVE_to_EXPIRED, "validations[priority=9]", "errors[ERR_LOT_NOT_EXPIRED_YET]"]
        distinguishing_aspect: "Expiring a lot whose expiration_date is after the clock returns 409 ERR_LOT_NOT_EXPIRED_YET."
        test_recipe:
          setup: ["Clock 2026-06-05; perishable lot expiring 2026-06-20 (future)."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "DAIRY", name: "Dairy" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Yogurt", sku: "SKU-YOG", sell_by_weight: false, unit_price_cents: 99, is_perishable: true, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-YOG", expected_total_cents: 500 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/lines"
              payload: { product_id: "${pid}", ordered_qty: 5, accepted_qty: 5, unit_cost_cents: 100, expiration_date: "2026-06-20T00:00:00Z" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/receive"
              payload: { expected_product_version: "${pv}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "GET /inventory-lots?product_id=${pid}"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { lot_id: "$.data[0].id" }
          trigger:
            - call: "POST /inventory-lots/${lot_id}/expire"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_LOT_NOT_EXPIRED_YET"

      - name: void_open_sale_no_inventory_effect
        claim_type: Valid Transition
        grounds: [state_machines.SalesTransaction.OPEN_to_VOIDED, entities.SalesTransaction.fields.fulfillment_status]
        distinguishing_aspect: "Voiding an OPEN sale -> fulfillment_status VOIDED with no inventory depletion (product on_hand unchanged)."
        test_recipe:
          setup: ["Product on-hand 5; OPEN sale with one line quantity 2 (not finalized)."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Void", sku: "SKU-VOID", sell_by_weight: false, unit_price_cents: 99, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-VOID", expected_total_cents: 500 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/lines"
              payload: { product_id: "${pid}", ordered_qty: 5, accepted_qty: 5, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/receive"
              payload: { expected_product_version: "${pv}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${pid}", quantity: 2 }
              as: Cashier
              as_user_id: "csh-1"
          trigger:
            - call: "POST /sales/${sale_id}/void"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { st: $.data.fulfillment_status }
          assert:
            - "SalesTransaction.${sale_id}.fulfillment_status == VOIDED"
            - "Product.${pid}.on_hand_qty == 5"

      - name: pay_before_finalize_returns_not_finalized
        claim_type: Precondition Enforcement
        grounds: [state_machines.SalesTransaction.UNPAID_to_PAID, "errors[ERR_SALE_NOT_FINALIZED]"]
