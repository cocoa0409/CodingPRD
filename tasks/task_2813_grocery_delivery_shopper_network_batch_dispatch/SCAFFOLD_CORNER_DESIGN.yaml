        distinguishing_aspect: "The junction row is reachable from either side and agrees on both: the batch-side list returns the two rows in sequence_no order 1 then 2, and the order-side list returns exactly the one row whose batch_id is the batch."
        test_recipe:
          setup:
            - "Retailer R1 with I1 EACH in_store 400 -> 460 unit_weight 1.0; Customer C1."
            - "Orders OM (I1 x2) and ON (I1 x1), both submitted; Batch B50 (window 08:00-11:00) receives OM first, then ON."
