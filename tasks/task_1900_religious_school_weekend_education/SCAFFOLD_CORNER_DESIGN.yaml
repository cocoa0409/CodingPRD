            - { call: "GET /school/sections/${sec}", payload: {}, as: SchoolAdmin, captures: { sv: $.data.version } }
            - { call: "POST /school/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SchoolAdmin }
          trigger:
