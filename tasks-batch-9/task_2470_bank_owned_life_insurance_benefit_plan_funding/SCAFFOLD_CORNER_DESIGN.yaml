      - name: second_execute_on_an_executed_consent_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.ConsentRecord.DRAFT_to_EXECUTED
          - validations[priority=8]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "EXECUTED has no outgoing execute transition, so replaying POST /consent-records/{id}/execute returns ERR_INVALID_STATE_TRANSITION (409) and executed_at keeps its first value — the endpoint is not idempotent by design."
        test_recipe:
          setup:
            - "Employee Sato with one EXECUTED consent for 2026-08-01..2027-07-31; the logical clock is at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Rin Sato", employee_number: "E-7301", annual_salary_usd: 400000.00 }
              as: BenefitsAnalyst
              captures: { emp_sato_id: $.data.id }
            - call: "POST /consent-records"
              payload: { employee_id: "${emp_sato_id}", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-07-31T00:00:00Z", consent_form_reference: "CF-7301", notice_and_consent_version: "NC-2026.1" }
              as: BenefitsAnalyst
              captures: { consent_sato_id: $.data.id }
            - call: "POST /consent-records/${consent_sato_id}/execute"
              payload: {}
              as: BenefitsAnalyst
          trigger:
            - call: "POST /consent-records/${consent_sato_id}/execute"
              payload: {}
              as: BenefitsAnalyst
          assert:
            - "trigger returns HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "ConsentRecord.${consent_sato_id}.status == EXECUTED"
            - "ConsentRecord.${consent_sato_id}.executed_at == 2026-08-01T00:00:00Z"
            - "ConsentRecord.${consent_sato_id}.version == 2, unchanged by the rejected replay"

