  - rule_id: compensating_invariant
    instances:

      - name: reverse_then_reinstate_conserves_account_ledger
        grounds:
          - state_machines.LoadTransaction.FUNDED_to_REVERSED
          - state_machines.LoadTransaction.REVERSED_to_SETTLED
          - calculations.funding_credit
          - entities.CardAccount.fields.ledger_posted_cents
        distinguishing_aspect: |
          The conserved quantity is the account ledger identity
          ledger_posted_cents - ledger_reversed_cents == balance_cents (a monetary
          balance): funding then reversing then re-instating returns balance_cents
          to exactly its pre-reversal value and the identity holds at every step.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T12:00:00Z. Program, brand, retailer agreement (per-txn limit 15000), location QM-001, REG_E account ACCT-0001."
            - "One 12000-cent load funded then reversed with reason DISPUTE_FAVOR_CARDHOLDER. No loss allocation references it."
