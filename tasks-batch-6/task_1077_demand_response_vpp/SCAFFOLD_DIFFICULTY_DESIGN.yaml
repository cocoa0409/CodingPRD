              as: ProgramOperator
              captures: { evt_pfp_id: $.data.id }
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_cap_id}", window_start: "2026-06-01T14:00:00Z", window_end: "2026-06-01T16:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { evt_cap_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
