          Body-level foreign keys are resolved with per-reference errors and they resolve BEFORE
          the state and amount rules that would otherwise fire: an unknown loan_id beats the OCC
          version check (33 before 45), an unknown payoff_quote_id beats the amount comparison
          (36 before 104), and an unknown reverses_posting_id beats the reversal-amount rule
          (37 before 106).
