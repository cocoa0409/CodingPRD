      - name: outside_season_window_beats_deduction_cap
        grounds:
          - validations.priority_10.ERR_OUTSIDE_SEASON_WINDOW
          - validations.priority_12.ERR_DEDUCTIONS_EXCEED_CAP
          - entities.UseArea.fields.season_open_date
          - errors.ERR_OUTSIDE_SEASON_WINDOW
          - errors.ERR_DEDUCTIONS_EXCEED_CAP
        distinguishing_aspect: |
          CATEGORY PAIR: business_temporal (priority 10) versus business_fiscal (priority 12) — a
          third distinct pair, and the two rules share HTTP 422, so the discriminator is the
          error_id alone rather than the status code. A single report both starts before the season
          opens and claims deductions of 500000 against a 150000 cap; the reporting window is
          settled before any money on the report is examined.
        test_recipe:
          setup:
            - "logical clock at 2027-09-01T00:00:00Z"
            - "UseArea BRW-01 with season_open_date 2027-05-15 and season_close_date 2027-09-30"
