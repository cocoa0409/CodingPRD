  # ===========================================================================
  # Rule 4 — transitive_cascade (two instances, different triggers, depths 3 / 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: service_change_cascade_depth3
        grounds:
          - state_machines.Student.SERVICE_CHANGE_PENDING_to_ACTIVE_IEP
          - state_machines.ServiceChangeOrder.APPROVED_to_EFFECTIVE
          - calculations.weekly_benefit_eligibility
          - calculations.assignment_daily_cost
        distinguishing_aspect: |
          Depth-3 chain from SCO effectuate: effectuate ENDs A1 (hop 1: release
          1900 minutes + 76000 committed) -> para drops below threshold, flipping
          benefit_eligible (hop 2) -> the para's remaining QUALIFICATION_VERIFIED
          assignment A2 re-snapshots to the non-surcharged rate, 2240 -> 1867/day
          (hop 3) -> plan.committed_cost_cents lands at exactly 9335. Each link is
          caused by the previous link, not by the original effectuate call.
        test_recipe:
          setup:
            - "Plan ACTIVE (threshold 1800, surcharge 0.20), building B1"
            - "P1 (wage 2000, cap 2400, no quals); S1 TRANSITIONAL/NONE 1900 min/wk with A1 ACTIVE 380/day Mon-Fri (480-860) weekly 76000 (surcharged: projected 1900 >= 1800)"
            - "S2 TRANSITIONAL/NONE 280 min/wk with A2 QUALIFICATION_VERIFIED 56/day Mon-Fri (900-956), daily 2240 / weekly 11200 (projected 1900+280 >= 1800 at create)"
            - "pre-cascade: committed 87200, P1 minutes 1900, benefit_eligible true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "FY27 SPED", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln Elementary", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 1900, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 860, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id }
            - call: "POST /sped-staffing/assignments/${a1}/verify-qualifications"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments/${a1}/activate"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-002", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 280, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s2: $.data.id }
            - call: "POST /sped-staffing/students/${s2}/activate-iep"
              as: SpecialEdCoordinator
            - call: "GET /sped-staffing/plans/${plan_id}"
              as: Any
              captures: { plan_v2: $.data.version }
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s2}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 900, daily_end_minute: 956, expected_plan_version: "${plan_v2}" }
              as: SpecialEdCoordinator
              captures: { a2: $.data.id, a2_daily_pre: $.data.daily_cost_cents }
            - call: "POST /sped-staffing/assignments/${a2}/verify-qualifications"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/service-change-orders"
              payload: { student_id: "${s1}", change_type: "MINUTES_CHANGE", new_minutes_per_week: 100, reason: "IEP revision reduces service minutes" }
              as: SpecialEdCoordinator
              captures: { sco1: $.data.id }
