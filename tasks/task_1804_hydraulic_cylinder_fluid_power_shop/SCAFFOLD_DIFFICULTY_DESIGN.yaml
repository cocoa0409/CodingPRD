  - rule_id: resource_temporal_overlap
    instances:
      - name: test_bay_booking_requires_thirty_minute_buffer
        grounds:
          - errors[ERR_TEST_BAY_WINDOW_OVERLAP]
          - validations[priority=10]
        distinguishing_aspect: |
          TestBay interval semantics are closed-interval-plus-buffer: a booking
          starting exactly when the previous one ends (11:00 after [10:00,11:00])
          still collides because bay_buffer_minutes (30) is added; the earliest
          legal follow-on start is 11:30.
        test_recipe:
          setup:
            - "Two work orders both ASSEMBLED; bay BAY-1 already booked [2026-08-02T10:00Z, 2026-08-02T11:00Z] for WO1"
          setup_api_calls:
