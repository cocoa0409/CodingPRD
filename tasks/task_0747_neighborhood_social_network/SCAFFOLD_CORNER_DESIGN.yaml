scaffold_corner_design:
  # =========================================================================
  # Section: entities — required fields, defaults, computed/system, immutability
  # =========================================================================
  - section: entities
    instances:
      - name: neighborhood_create_missing_required_state_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Neighborhood.fields.state_code
          - endpoints["POST /neighborhoods"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /neighborhoods with state_code omitted returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB, PlatformAdmin authenticated."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response HTTP status is 400"
            - "Response data.error_id == \"ERR_INVALID_REQUEST\""

      - name: post_creation_computed_local_relevance_score_returned
        claim_type: computed_fields
        grounds:
          - entities.Post.fields.local_relevance_score
          - calculations.post_feed_score
        distinguishing_aspect: "POST /posts response includes computed local_relevance_score field derived by post_feed_score."
        test_recipe:
          setup:
            - "Neighborhood N1 (OPEN posture), Verified Resident R1."
            - "Logical clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: { resident_id: "${r1_id}" }
              as: PlatformAdmin
              captures: { vr_r1_id: "$.data[0].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
          trigger:
            - call: "POST /neighborhood/posts"
              payload: { author_resident_id: "${r1_id}", neighborhood_id: "${n1_id}", category: "SAFETY", title: "T", body: "b" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { p_id: "$.data.id", p_score: "$.data.local_relevance_score" }
          assert:
            - "Post.${p_id}.local_relevance_score == 2.10 (SAFETY, OPEN posture, age 0)"

      - name: resident_create_sets_default_trust_score_100_and_is_moderator_false
        claim_type: defaults
        grounds:
          - entities.Resident.fields.trust_score
          - entities.Resident.fields.is_moderator
          - entities.Resident.fields.is_suspended
        distinguishing_aspect: "POST /residents defaults trust_score=100, is_moderator=false, is_suspended=false, verification_status=PENDING."
        test_recipe:
          setup:
            - "Neighborhood N1 exists."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood/residents"
              payload: { email: "r@x.com", display_name: "R", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r_id: "$.data.id", r_trust: "$.data.trust_score", r_mod: "$.data.is_moderator", r_susp: "$.data.is_suspended", r_vs: "$.data.verification_status" }
          assert:
            - "Resident.${r_id}.trust_score == 100"
            - "Resident.${r_id}.is_moderator == false"
            - "Resident.${r_id}.is_suspended == false"
            - "Resident.${r_id}.verification_status == \"PENDING\""

      - name: get_neighborhood_by_non_existent_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints["GET /neighborhoods/{id}"]
        distinguishing_aspect: "GET /neighborhoods/{id} with non-existent id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /neighborhood/neighborhoods/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response HTTP status is 404"
            - "Response data.error_id == \"ERR_NOT_FOUND\""

      - name: neighborhood_list_pagination_defaults_apply
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - endpoints["GET /neighborhoods"]
        distinguishing_aspect: "GET /neighborhoods with no limit/offset returns first 10 records; response includes total_count and has_more."
        test_recipe:
          setup:
            - "Empty DB; a single Neighborhood created."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
          trigger:
            - call: "GET /neighborhood/neighborhoods"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response response_type == \"array\""
            - "Response meta pagination has limit=10, offset=0, total_count>=1, has_more=false"

      - name: neighborhood_immutability_no_update_endpoint
        claim_type: immutability
        grounds:
          - endpoints["POST /neighborhoods"]
          - endpoints["GET /neighborhoods/{id}"]
        distinguishing_aspect: "No PUT/PATCH endpoints for Neighborhood — it is created but not mutable (except computed fields)."
        excluded_because:
          difficulty_instance: incident_resolve_cascades_unresolved_count_posture_and_feed_score_depth_3
          rationale: "Computed-field mutation via cascade is exercised by the incident-resolve depth-3 cascade instance."

  # =========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: incident_resolve_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Incident.ACKNOWLEDGED_to_RESOLVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Incident in OPEN state cannot resolve directly; must be ACKNOWLEDGED first."
        test_recipe:
          setup:
            - "Neighborhood N1, Verified Resident R1, Incident I1 reported by R1 in OPEN."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: { resident_id: "${r1_id}" }
              as: PlatformAdmin
              captures: { vr_r1_id: "$.data[0].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/incidents"
              payload: { reporter_resident_id: "${r1_id}", neighborhood_id: "${n1_id}", incident_lat: 37.75, incident_lng: -122.42, severity: "WARNING", category: "TRAFFIC_HAZARD", description: "d", occurred_at: "2026-06-01T00:00:00Z" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { i1_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood/incidents/${i1_id}/resolve"
              payload: {}
              as: AgencyOfficer
              as_user_id: "OFF1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response HTTP status is 409"
            - "Response data.error_id == \"ERR_INVALID_STATE\""

      - name: verification_expiry_auto_transition_on_clock_advance
        claim_type: valid_transition
        grounds:
          - state_machines.VerificationRequest.SUBMITTED_to_EXPIRED
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: "Advancing the clock past VerificationRequest.expires_at (submitted_at + 14 days) fires SUBMITTED->EXPIRED auto-transition; Resident.verification_status flips to REJECTED."
        test_recipe:
          setup:
            - "Neighborhood N1, Resident R submitted VerificationRequest VR at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "r@x.com", display_name: "R", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: { resident_id: "${r_id}" }
              as: PlatformAdmin
              captures: { vr_id: "$.data[0].id" }
          trigger:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /neighborhood/verification-requests/${vr_id}"
              payload: {}
              as: PlatformAdmin
              captures: { vr_state: "$.data.state" }
            - call: "GET /neighborhood/residents/${r_id}"
              payload: {}
              as: PlatformAdmin
              captures: { r_vs: "$.data.verification_status" }
          assert:
            - "VerificationRequest.${vr_id}.state == \"EXPIRED\""
            - "Resident.${r_id}.verification_status == \"REJECTED\""

      - name: local_ad_expires_on_clock_advance_running_to_ended
        claim_type: valid_transition
        grounds:
          - state_machines.LocalAd.RUNNING_to_ENDED
        distinguishing_aspect: "Clock advance beyond LocalAd.end_at transitions RUNNING->ENDED."
        test_recipe:
          setup:
            - "Neighborhood N1, Verified Resident R1, Business B1 VERIFIED_BUSINESS."
            - "LocalAd A1 in RUNNING with end_at=2026-06-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: { resident_id: "${r1_id}" }
              as: PlatformAdmin
              captures: { vr_r1_id: "$.data[0].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/businesses"
              payload: { owner_resident_id: "${r1_id}", name: "B1", address_line: "1 A St", business_lat: 37.75, business_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { b1_id: "$.data.id" }
            - call: "POST /neighborhood/businesses/${b1_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/local-ads"
              payload: { business_id: "${b1_id}", target_neighborhood_ids: ["${n1_id}"], budget_cents: 5000, bid_cents_per_impression: 100, start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-10T00:00:00Z" }
              as: BusinessOwner
              as_user_id: "${b1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /neighborhood/local-ads/${a1_id}/start"
              payload: {}
              as: BusinessOwner
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /neighborhood/local-ads/${a1_id}"
              payload: {}
              as: BusinessOwner
              as_user_id: "${b1_id}"
              captures: { a1_state: "$.data.state" }
          assert:
            - "LocalAd.${a1_id}.state == \"ENDED\""

      - name: marketplace_listing_reservation_expires_reserved_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.MarketplaceListing.RESERVED_to_ACTIVE
        distinguishing_aspect: "Clock advance past reserved_until returns RESERVED listing to ACTIVE and clears reserved_for_resident_id/reserved_until."
        test_recipe:
          setup:
            - "Neighborhood N1; Verified Residents R1 (seller) and R2 (buyer)."
            - "MarketplaceListing L1 by R1 in ACTIVE."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: { resident_id: "${r1_id}" }
              as: PlatformAdmin
              captures: { vr_r1_id: "$.data[0].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/residents"
              payload: { email: "r2@x.com", display_name: "R2", home_address_line: "3 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r2_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: { resident_id: "${r2_id}" }
              as: PlatformAdmin
              captures: { vr_r2_id: "$.data[0].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r2_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r2_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/marketplace-listings"
              payload: { seller_resident_id: "${r1_id}", neighborhood_id: "${n1_id}", title: "chair", price_cents: 5000, kind: "FOR_SALE" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { l1_id: "$.data.id" }
            - call: "POST /neighborhood/marketplace-listings/${l1_id}/reserve"
              payload: {}
              as: Resident
              as_user_id: "${r2_id}"
              captures: { l1_reserved_until: "$.data.reserved_until" }
          trigger:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /neighborhood/marketplace-listings/${l1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { l1_state_post: "$.data.state", l1_reserved_for_post: "$.data.reserved_for_resident_id" }
          assert:
            - "MarketplaceListing.${l1_id}.state == \"ACTIVE\""
            - "MarketplaceListing.${l1_id}.reserved_for_resident_id is null"

      - name: terminal_state_lockdown_removed_post_cannot_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Post.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A REMOVED Post cannot be re-flagged or otherwise transitioned — DELETE from REMOVED returns ERR_INVALID_STATE (or ERR_NOT_FOUND depending on soft-delete)."
        test_recipe:
          setup:
            - "Neighborhood N1, Verified Resident R1, Post P1 in state PUBLISHED then REMOVED."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: { resident_id: "${r1_id}" }
              as: PlatformAdmin
              captures: { vr_r1_id: "$.data[0].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/posts"
              payload: { author_resident_id: "${r1_id}", neighborhood_id: "${n1_id}", category: "GENERAL", title: "T", body: "b" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "DELETE /neighborhood/posts/${p1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
          trigger:
            - call: "DELETE /neighborhood/posts/${p1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response HTTP status is 409"
            - "Response data.error_id == \"ERR_INVALID_STATE\""

      - name: post_flagged_hidden_via_uphold_covered_by_difficulty
        claim_type: side_effect_execution
        grounds:
          - state_machines.Post.FLAGGED_to_HIDDEN
        excluded_because:
          difficulty_instance: moderation_uphold_cascades_post_hidden_trust_decrement_and_suspension_depth_3
          rationale: "The FLAGGED->HIDDEN transition and its cascading trust/suspension side effects are the trigger of a §1.8 instance."

      - name: incident_resolve_cascade_covered_by_difficulty
