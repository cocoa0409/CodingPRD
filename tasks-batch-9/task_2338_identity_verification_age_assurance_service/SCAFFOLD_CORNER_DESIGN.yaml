      - "VerificationSession.${s3}.identity_state == EXPIRED with disposition_reason == EXPIRED_TTL and completed_at == 2026-11-08T09:00:00Z"
      - "ManualReviewCase.${c2}.state == WITHDRAWN and VerificationSession.${s2}.identity_state == REJECTED with disposition_reason == REVIEW_LAPSED and assurance_score_final == 0"
      - "VerificationSession.${s2}.identity_state is not EXPIRED, so a MANUAL_REVIEW session past expires_at is only reachable through the SLA branch"
      - "GET /idv/verification-sessions/${s1}/biometric-templates returns total_count == 1 with data[0].state == DELETED and data[0].deletion_reason == RETENTION_EXPIRED"
      - "Client.${client_id}.stored_template_count == 0, reserved_review_credits == 0, available_review_credits == 1 and consumed_review_count == 0"
      - "GET /idv/verification-sessions/${s1}/audit-events?event_type=TEMPLATE_DELETED returns total_count == 1"
      - "VerificationSession.${s1}.identity_state == VERIFIED is untouched by the sweep"
  - name: clock_endpoint_moves_time_and_the_move_is_visible_in_derived_fields
