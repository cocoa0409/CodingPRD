    - name: higher_priority_error_wins_when_two_rules_are_violated_at_once
      claim_type: priority_ordering
      grounds: [validations.priority_12, validations.priority_38]
      excluded_because: {difficulty_instance: priority_pair_validation_conflict / dispatch_state_error_outranks_cash_limit_error_on_depart, rationale: 'That §1.8 instance violates the state rule at priority 12 and the cash-limit rule at priority 38 in a single depart call and asserts the priority-12 error is returned, which is exactly the priority-ordering claim; two further §1.8 instances repeat the pattern for the 13-vs-25 and 3-vs-12 pairs.'}
    - name: a_non_overlapping_reservation_window_passes_the_hot_bag_test
      claim_type: satisfaction_to_pass
      grounds: [validations.priority_23, entities.Store.fields.hot_bag_count]
      excluded_because: {difficulty_instance: resource_temporal_overlap / hot_bag_pool_window_is_half_open_so_1830_overlaps_but_1839_does_not, rationale: 'That §1.8 instance locks a second route whose window starts exactly when the first route''s window ends and asserts the lock SUCCEEDS, which is the satisfaction-to-pass side of the hot-bag rule.'}
    - name: driver_occupation_intervals_may_not_intersect
      claim_type: violation_to_error
      grounds: [validations.priority_22, errors.ERR_DRIVER_WINDOW_CONFLICT]
      excluded_because: {difficulty_instance: resource_temporal_overlap / driver_occupation_interval_is_closed_so_touching_at_1834_conflicts, rationale: 'That §1.8 instance locks a second dispatch whose planned_depart_at touches the first dispatch''s expected_return_at plus buffer and asserts ERR_DRIVER_WINDOW_CONFLICT, covering this temporal rule at its exact boundary.'}
    - name: locking_a_stop_free_dispatch_is_rejected
      claim_type: violation_to_error
      grounds: [validations.priority_25, errors.ERR_DISPATCH_HAS_NO_STOPS]
      excluded_because: {difficulty_instance: boundary_precision_check / lock_requires_at_least_one_stop_at_the_zero_to_one_boundary, rationale: 'That §1.8 instance locks at stop_count 0 and then at stop_count 1 and asserts ERR_DISPATCH_HAS_NO_STOPS then success, covering both sides of this rule.'}
    - name: locking_an_unqualified_drivers_route_is_rejected
      claim_type: violation_to_error
      grounds: [validations.priority_13, errors.ERR_DRIVER_NOT_QUALIFIED]
      excluded_because: {difficulty_instance: cross_entity_state_dependency / lock_of_a_valid_route_depends_on_driver_qualification_state, rationale: 'That §1.8 instance locks the identical route twice — once with the driver PENDING_CHECKS and once QUALIFIED — and asserts ERR_DRIVER_NOT_QUALIFIED then success, which is the cross-entity form of this rule.'}
    - name: locking_without_a_cost_model_for_the_vehicle_class_is_rejected
      claim_type: violation_to_error
      grounds: [validations.priority_20, errors.ERR_NO_COST_MODEL]
