  - rule_id: boundary_precision_check
    instances:
      - name: mutm_eligibility_requires_market_strictly_above_contract_rent
        grounds:
          - calculations.restructuring_eligibility
          - entities.RestructuringDetermination.fields.eligibility_reason_code
          - entities.RestructuringDetermination.fields.post_restructure_rent_per_unit_cents
          - state_machines.RestructuringDetermination.DRAFT_to_INELIGIBLE
          - state_machines.RestructuringDetermination.DRAFT_to_MUTM_ELIGIBLE
          - state_machines.RestructuringDetermination.MUTM_ELIGIBLE_to_APPROVED
        distinguishing_aspect: |
          The market-versus-contract test is strict: market 118000 exactly equal to contract rent
          118000 yields INELIGIBLE / MARKET_NOT_ABOVE_CONTRACT, while market 118100 — one whole
          dollar higher, the smallest step the whole-dollar comparable rounding can produce —
          yields MUTM_ELIGIBLE / MARKET_ABOVE_CONTRACT_AND_FMR on otherwise identical data.
          The boundary lives on an integer comparison, not on a rounding rule.
        test_recipe:
          setup:
            - "Owner, one IL property with published_fmr_cents 110000 so the MUTM FMR floor is met by both cases, two identical NEW_CONSTRUCTION contracts with rent 118000."
            - "Clock at 2026-12-01; case A and case B both on OPTION_1_MARK_UP_TO_MARKET with OCAF elected."
            - "Case A has an ACCEPTED study worth exactly 118000; case B has an ACCEPTED study worth 118100."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 110000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
