            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
          trigger:
            - {call: "GET /volunteers/vol-nope", as: ScopingSpecialist, as_user_id: "spec-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_VOLUNTEER_NOT_FOUND\""
            - "GET /volunteers/vol-nope/skill-profiles is likewise HTTP 404 with ERR_VOLUNTEER_NOT_FOUND"
            - "GET /volunteers/${vol_id}/skill-profiles returns HTTP 200 with total_count == 0, which is the contrasting empty-but-present case"
      - name: endpoint_vet_with_unrecognised_skill_code_verifies_nothing
        claim_type: conditional_action
        grounds: ["endpoints[POST /volunteers/{id}/vet]", state_machines.Volunteer, calculations.match_score]
        distinguishing_aspect: "verify_skill_codes is a set intersection, not a lookup that can fail: naming ROCKET_SURGERY - a code the volunteer does not hold - still returns 200 and still flips PENDING_VETTING -> ACTIVE with credential_verified_at stamped, while the held TAX_LAW claim stays verified == false because it was not named."
        test_recipe:
          setup: ["One PENDING_VETTING volunteer holding exactly one TAX_LAW claim."]
          setup_api_calls:
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
            - {call: "POST /volunteers/${vol_id}/skill-profiles", as: Volunteer, as_user_id: "${vol_id}", payload: {skill_code: "TAX_LAW", proficiency: 4, years_experience: 9.0}}
          trigger:
            - {call: "POST /volunteers/${vol_id}/vet", as: ProgramManager, as_user_id: "pm-1", payload: {verify_skill_codes: ["ROCKET_SURGERY"]}}
          assert:
            - "HTTP 200"
            - "data.status == \"ACTIVE\" and data.credential_verified_at == \"2026-08-01T00:00:00Z\" (the logical clock default)"
            - "GET /volunteers/${vol_id}/skill-profiles returns total_count == 1 with the TAX_LAW row still verified == false and verified_at == null"
            - "no SkillProfile row for ROCKET_SURGERY is created"
      - name: endpoint_volunteer_skill_profiles_empty_collection
        claim_type: standard_crud
        grounds: ["endpoints[GET /volunteers/{id}/skill-profiles]", "endpoints[POST /volunteers]"]
        distinguishing_aspect: "A freshly enrolled volunteer has an empty claim set: HTTP 200 with total_count 0, which is exactly the state that makes any skill-filtered match round produce ERR_NO_ELIGIBLE_VOLUNTEER for this candidate."
        test_recipe:
          setup: ["One PENDING_VETTING volunteer with no skill claims."]
          setup_api_calls:
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
          trigger:
            - {call: "GET /volunteers/${vol_id}/skill-profiles", as: Volunteer, as_user_id: "${vol_id}"}
          assert:
            - "HTTP 200"
            - "data.total_count == 0 and data.items is an empty list"
            - "GET /volunteers/${vol_id} shows status == \"PENDING_VETTING\" and credential_verified_at == null"
      - name: endpoint_volunteer_availability_windows_empty_collection
        claim_type: standard_crud
        grounds: ["endpoints[GET /volunteers/{id}/availability-windows]", "invariants.INV_VOLUNTEER_HOUR_CONSERVATION"]
        distinguishing_aspect: "With no window published the hour ledger has no rows at all, which is the base case of the hour-conservation invariant: total_count 0 rather than a synthetic zero-hour window, and the read is 200 for the volunteer's own id."
        test_recipe:
          setup: ["One ACTIVE vetted volunteer who has published no window."]
          setup_api_calls:
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
            - {call: "POST /volunteers/${vol_id}/vet", as: ProgramManager, as_user_id: "pm-1"}
          trigger:
            - {call: "GET /volunteers/${vol_id}/availability-windows", as: ProgramManager, as_user_id: "pm-1"}
          assert:
            - "HTTP 200"
            - "data.total_count == 0 and data.items is an empty list"
            - "GET /volunteers/${vol_id} shows status == \"ACTIVE\" with open_engagement_count == 0"
      - name: endpoint_match_offers_list_filter_empty_before_any_match
        claim_type: standard_crud
        grounds: ["endpoints[GET /match-offers]", "endpoints[POST /project-requests/{id}/match]"]
        distinguishing_aspect: "Every filter axis of the offers list must tolerate an empty result: volunteer_id and status=OFFERED against a system that has never run the matcher answer HTTP 200 with total_count 0, and an unknown volunteer_id filter value is also 200/0 rather than a 404, because filters are not path lookups."
        test_recipe:
          setup: ["One ACTIVE vetted volunteer; the matcher has never run."]
          setup_api_calls:
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
            - {call: "POST /volunteers/${vol_id}/vet", as: ProgramManager, as_user_id: "pm-1"}
          trigger:
            - {call: "GET /match-offers?volunteer_id=${vol_id}&status=OFFERED", as: Volunteer, as_user_id: "${vol_id}"}
          assert:
            - "HTTP 200"
            - "data.total_count == 0 and data.items is an empty list"
            - "GET /match-offers?volunteer_id=vol-nope returns HTTP 200 with total_count == 0, not 404"
      - name: endpoint_get_match_offer_unknown_id_returns_not_found
        claim_type: standard_crud
        grounds: ["endpoints[GET /match-offers/{id}]", "errors[ERR_MATCH_OFFER_NOT_FOUND]", "validations[priority=8]"]
        distinguishing_aspect: "The single-offer read is a path lookup and so must 404 where the filtered list returns an empty page: GET /match-offers/offer-nope is 404 ERR_MATCH_OFFER_NOT_FOUND while GET /match-offers?status=OFFERED is 200 with total_count 0 in the very same state."
        test_recipe:
          setup: ["One ACTIVE vetted volunteer; no offers exist."]
          setup_api_calls:
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
            - {call: "POST /volunteers/${vol_id}/vet", as: ProgramManager, as_user_id: "pm-1"}
          trigger:
            - {call: "GET /match-offers/offer-nope", as: ProgramManager, as_user_id: "pm-1", captures: {err: "$.data.error_id"}}
