              as: ClientAdmin
              as_user_id: "${c_id}"
            - call: "POST /onboarding-packets/${p1}/review"
              payload: { decision: "APPROVE" }
              as: PeoAdmin
            - call: "POST /clients/${c_id}/payroll-runs"
              payload: { period_start: "2026-05-01", period_end: "2026-05-15", check_date: "2026-05-20" }
              as: PayrollSpecialist
              as_user_id: "ps-1"
              captures: { r1: $.data.id }
            - call: "POST /payroll-runs/${r1}/calculate"
              payload: {}
              as: PayrollSpecialist
              as_user_id: "ps-1"
            - call: "POST /payroll-runs/${r1}/approve"
              payload: {}
              as: PeoAdmin
              as_user_id: "admin-1"
            - call: "GET /client-invoices"
              payload: { payroll_run_id: "${r1}" }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { inv: "$.data[0].id", inv_v: "$.data[0].version" }
          trigger:
            - call: "POST /client-invoices/${inv}/payments"
              payload: { expected_invoice_version: "${inv_v}", amount_cents: 100000 }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { inv_v2: $.data.version, paid1: $.data.amount_paid_cents }
            - call: "POST /client-invoices/${inv}/payments"
              payload: { expected_invoice_version: "${inv_v}", amount_cents: 100000 }
              as: ClientAdmin
              as_user_id: "${c_id}"
            - call: "GET /client-invoices/${inv}"
              payload: {}
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { paid_final: $.data.amount_paid_cents }
          assert:
            - "After the first payment: ClientInvoice.${inv}.amount_paid_cents == 100000, status == PARTIALLY_PAID, version == 2"
            - "ClientCompany.${c_id}.outstanding_balance_cents == 35755 after the first payment (135755 - 100000)"
            - "The replayed payment returns HTTP 412 with data.error_id == 'ERR_STALE_INVOICE_VERSION'"
            - "ClientInvoice.${inv}.amount_paid_cents is still 100000 (no double-credit) and version is still 2"
            - "A payment of 35755 carrying expected_invoice_version 2 settles the invoice: status == PAID and outstanding_balance_cents == 0"

  - section: consistency_model
    instances:
      - name: approve_response_immediately_reflects_cascade_results
        claim_type: immediate_consistency
        grounds:
          - state_machines.PayrollRun.CALCULATED_to_APPROVED
          - calculations.client_outstanding_balance
        excluded_because:
          difficulty_instance: approve_cascade_run_invoice_lines_client_ledger
          rationale: "That instance reads the invoice, its lines and the client's recomputed balance immediately after the approve call in the same trigger chain, which is exactly the immediate-consistency claim."
