  - rule_id: resource_temporal_overlap
    instances:
      - name: trainer_class_half_open_overlap
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_TRAINER_SCHEDULE_CONFLICT]"
        distinguishing_aspect: "Half-open [starts_on, ends_on) semantics on resource Trainer: a second class starting exactly when the first ends (2026-10-15 == ends_on) is ALLOWED (adjacency not overlap), while a third class starting 2026-11-29 overlaps the second's [2026-10-15, 2026-11-30) window and is rejected."
        test_recipe:
          setup:
            - "CERTIFIED lead trainer with one existing class [2026-09-01, 2026-10-15)"
          setup_api_calls:
            - { call: "POST /api/trainers", payload: { full_name: "Trainer Overlap", pat_certified: false }, as: ProgramAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/trainers/${t_id}/certify", as: ProgramAdmin }
            - { call: "POST /api/classes", payload: { name: "Class A", lead_trainer_id: "${t_id}", starts_on: "2026-09-01", ends_on: "2026-10-15", capacity: 2, total_sessions: 20 }, as: TrainingDirector, captures: { cla_id: $.data.id } }
          trigger:
            - { call: "POST /api/classes", payload: { name: "Class B", lead_trainer_id: "${t_id}", starts_on: "2026-10-15", ends_on: "2026-11-30", capacity: 2, total_sessions: 20 }, as: TrainingDirector, captures: { clb_id: $.data.id } }
            - call: "POST /api/classes"
              payload: { name: "Class C", lead_trainer_id: "${t_id}", starts_on: "2026-11-29", ends_on: "2026-12-15", capacity: 2, total_sessions: 20 }
              as: TrainingDirector
              captures: { err: $.data.error_id }
          assert:
            - "Class B created (adjacency at 2026-10-15 allowed under half-open semantics)"
            - "Class C rejected: error_id == ERR_TRAINER_SCHEDULE_CONFLICT (starts 2026-11-29 < B.ends_on 2026-11-30 and ends 2026-12-15 > B.starts_on)"

      - name: evaluator_pat_buffer_overlap
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_EVALUATOR_SCHEDULE_CONFLICT]"
        distinguishing_aspect: "Buffered-window semantics on resource Evaluator (a different resource than Trainer, and different geometry than half-open classes): an evaluator occupied [10:00, 11:00) with a 30-minute buffer rejects a new PAT at 11:29 but accepts one at exactly 11:30 (buffer satisfied exactly)."
