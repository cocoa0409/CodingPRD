              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k3_id: $.data.id }
            - call: "POST /care-network/clients/${k3_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /care-network/referrals"
              payload: { client_id: "${k3_id}", sender_org_id: "${s_id}", receiver_org_id: "${r_id}", service_offering_id: "${o_id}", consent_id: "${c3_id}", category_code: "FOOD" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { rf3_id: $.data.id }
            - { call: "POST /care-network/referrals/${rf3_id}/route", payload: {}, as: CaseWorker, as_user_id: "${s_id}" }
