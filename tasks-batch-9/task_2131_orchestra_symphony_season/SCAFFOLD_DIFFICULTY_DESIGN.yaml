          setup:
            - "Season 2027 in PLANNING with a union agreement (scale 20000, max_service_minutes 150, overtime 400/min, principal premium 2000bp, doubling premium 1250bp)"
            - "Principal horn with overscale_bp 1000 engaged with doubling_count 1 on two PUBLISHED services on consecutive days, each scheduled 14:00-17:00 with a 30-minute break"
            - "Each engagement already carries provisional_pay_cents 28500"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
