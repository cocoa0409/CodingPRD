scenario: |
  Deployment Previews, Bandwidth Metering & Build Minute Allocation (Vercel): git integration creating a preview deployment for every branch and pull request with unique URLs and access protection, production promotion with instant rollback to prior immutable deployments, build minute and concurrency limits by plan with queueing when limits are reached, bandwidth and function invocation metering with regional edge execution pricing, environment variable scoping across development, preview and production with secret handling, domain assignment, certificate issuance and redirect configuration, usage spike protection with alerts and spend management controls, team seat licensing and access control for deployment and configuration changes

domain_name: deployment-previews-metering
api_prefix: /v1

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: PlanCatalogEntry
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: string, source: input, description: "Plan tier key; unique across catalog (e.g. HOBBY, PRO)" }
      - { name: seat_limit, type: integer, source: input, description: "Maximum member count for teams on this tier (inclusive capacity)" }
      - { name: included_build_minutes, type: integer, source: input, description: "Build minutes included per usage period" }
      - { name: build_concurrency_limit, type: integer, source: input, description: "Max coexisting BUILDING-state deployments per team" }
      - { name: included_bandwidth_gb, type: integer, source: input, description: "Bandwidth GB included per usage period (1 GB = 1,000,000,000 bytes, decimal)" }
      - { name: included_invocations_millions, type: integer, source: input, description: "Function invocations included per period, in millions" }
      - { name: bandwidth_tier1_rate_cents_per_gb, type: integer, source: input, description: "Overage cents per GB for first bandwidth_tier2_threshold_gb overage GB" }
      - { name: bandwidth_tier2_rate_cents_per_gb, type: integer, source: input, description: "Overage cents per GB beyond bandwidth_tier2_threshold_gb overage GB" }
      - { name: bandwidth_tier2_threshold_gb, type: integer, source: input, description: "Overage GB volume at which the cheaper tier-2 rate begins (marginal)" }
      - { name: invocation_rate_cents_per_million, type: integer, source: input, description: "Overage cents per million invocations" }
      - { name: seat_price_cents_monthly, type: integer, source: input, description: "Monthly per-seat price in cents; prorated on mid-period adds" }
      - { name: overage_build_minute_rate_cents, type: integer, source: input, description: "Cents per build minute beyond included_build_minutes" }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Team display name" }
      - { name: plan_tier, type: string, source: input, description: "Tier key of the PlanCatalogEntry this team subscribes to" }
      - { name: seat_limit, type: integer, source: computed, description: "Copied from PlanCatalogEntry at creation and on plan change" }
      - { name: included_build_minutes, type: integer, source: computed, description: "Copied from PlanCatalogEntry" }
      - { name: build_concurrency_limit, type: integer, source: computed, description: "Copied from PlanCatalogEntry" }
      - { name: included_bandwidth_gb, type: integer, source: computed, description: "Copied from PlanCatalogEntry" }
      - { name: included_invocations_millions, type: integer, source: computed, description: "Copied from PlanCatalogEntry" }
      - { name: seats_used, type: integer, source: computed, description: "Count of Member rows for this team" }
      - { name: prorated_charges_cents, type: integer, source: computed, default: 0, description: "Accumulated mid-period seat proration charges" }

  - name: Member
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; owning team" }
      - { name: user_email, type: string, source: input, description: "Member email; unique within the team" }
      - { name: role, type: enum, source: input, description: "OWNER | BILLING | DEVELOPER | VIEWER" }

  - name: Project
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; owning team" }
      - { name: name, type: string, source: input, description: "Project name; unique within team" }
      - { name: production_branch, type: string, source: input, description: "Git branch whose deployments are production candidates" }
      - { name: framework, type: string, source: input, description: "Detected/declared framework", default: null }
      - { name: preview_protection, type: enum, source: input, default: "TEAM_ONLY", description: "Default access protection for preview deployments: NONE | TEAM_ONLY" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | ARCHIVED; SUSPENDED set by spend-cap breach cascade" }
      - { name: suspended_reason, type: string, source: system, default: null, description: "SPEND_CAP_BREACHED when cascade-suspended" }
      - { name: production_deployment_id, type: string, source: system, default: null, description: "Reference (not a lint FK) to the currently PROMOTED production Deployment id" }

  - name: Deployment
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: branch, type: string, source: input, description: "Git branch of this deployment" }
      - { name: git_ref, type: string, source: input, description: "Full git ref (e.g. refs/heads/feat or pull/17)" }
      - { name: commit_sha, type: string, source: input, description: "Commit SHA being deployed" }
      - { name: target, type: enum, source: input, default: "PREVIEW", description: "PREVIEW | PRODUCTION; promote() rewrites PREVIEW to PRODUCTION" }
      - { name: region, type: enum, source: input, default: "IAD", description: "Build/edge region: IAD | SFO | FRA | SIN" }
      - { name: access_protection, type: enum, source: computed, description: "NONE | TEAM_ONLY; defaults to project.preview_protection for PREVIEW and NONE for PRODUCTION; explicit input overrides" }
      - { name: status, type: enum, source: system, description: "QUEUED | BUILDING | READY | STALE | PROMOTED | ROLLED_BACK | ERROR | CANCELED" }
      - { name: url_slug, type: string, source: computed, description: "Deterministic unique slug: sanitized(branch) + '-' + first-8 hex of sha256(project_id|branch|commit_sha)" }
      - { name: url, type: string, source: computed, description: "url_slug + '.preview.example.com'" }
      - { name: estimated_build_minutes, type: integer, source: system, description: "Reserved minutes at admission: billable_minutes of most recent READY deployment of same project (created_at DESC), else DEFAULT_ESTIMATE_MINUTES=2" }
      - { name: billable_minutes, type: integer, source: system, default: null, description: "ceil(build_duration_seconds/60), set at build-complete (success AND failure both bill)" }
      - { name: build_duration_seconds, type: integer, source: system, default: null, description: "Worker-reported wall duration from build-complete" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Clock time at build-complete" }
      - { name: previous_promoted_deployment_id, type: string, source: system, default: null, description: "Reference (not a lint FK) to the PROMOTED deployment this one displaced on its last promote/rollback" }

  - name: EnvironmentVariable
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: key, type: string, source: input, description: "Variable name" }
      - { name: value, type: string, source: input, description: "Stored value; returned as null on reads when is_secret=true" }
      - { name: scopes, type: array, source: input, description: "Non-empty subset of [DEVELOPMENT, PREVIEW, PRODUCTION]; scope elements must not overlap any other same-key variable in the project" }
      - { name: is_secret, type: boolean, source: input, default: false, description: "Secret flag; secret values are masked (null) in every read response" }

  - name: Domain
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: name, type: string, source: input, description: "Hostname; unique globally across all projects" }
      - { name: certificate_id, type: string, source: system, default: null, description: "Reference (not a lint FK) to current ACTIVE Certificate, if any" }
      - { name: verification_status, type: enum, source: system, description: "PENDING | VERIFIED | FAILED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED when certificate transitions REVOKED" }

  - name: Certificate
    parent: Domain
    common_fields: true
    fields:
      - { name: domain_id, type: string, source: system, description: "FK -> Domain.id; owning domain" }
      - { name: issuer, type: string, source: input, default: "LETSENCRYPT", description: "Certificate authority label" }
      - { name: status, type: enum, source: system, description: "ISSUING | ACTIVE | EXPIRED | REVOKED" }
      - { name: not_before, type: datetime, source: system, description: "Clock time when issuance completed" }
      - { name: not_after, type: datetime, source: system, description: "not_before + CERT_VALIDITY_DAYS (90 days); system-expired at or after this time" }
      - { name: auto_renewed_from_id, type: string, source: system, default: null, description: "Reference (not a lint FK) to prior ACTIVE certificate renewed by issuance cascade" }

  - name: Redirect
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: source, type: string, source: input, description: "Path or hostname pattern the redirect matches" }
      - { name: target, type: string, source: input, description: "Destination URL or path" }
      - { name: status_code, type: enum, source: input, description: "301 | 302 | 307 | 308" }
      - { name: priority, type: integer, source: input, description: "Lower value matches first; must not duplicate another redirect's priority in the same project" }

  - name: UsagePeriod
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; owning team" }
      - { name: period_start, type: datetime, source: input, description: "Period start (ISO8601)" }
      - { name: period_end, type: datetime, source: input, description: "Period end; must be strictly after period_start" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | INVOICED" }
      - { name: bandwidth_bytes, type: integer, source: computed, default: 0, description: "Sum of bandwidth_bytes over UsageEvents in this period" }
      - { name: invocations, type: integer, source: computed, default: 0, description: "Sum of invocations over UsageEvents in this period" }
      - { name: build_minutes_used, type: integer, source: computed, default: 0, description: "Sum of billable_minutes of builds completing in this period" }
      - { name: projected_bill_cents, type: integer, source: computed, default: 0, description: "Forward-looking overage estimate incl. ESTIMATED events (usage_overage_charge provisional variant)" }
      - { name: final_bill_cents, type: integer, source: computed, default: null, description: "Chronological final overage charge, computed at period close" }
      - { name: total_due_cents, type: integer, source: computed, default: null, description: "final_bill_cents + prorated seat charges, computed at period close" }

  - name: UsageEvent
    parent: UsagePeriod
    common_fields: false
    fields:
      - { name: period_id, type: string, source: system, description: "FK -> UsagePeriod.id; period bucket (computed from recorded_at at ingest)" }
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; owning team (copied from period)" }
      - { name: deployment_id, type: string, source: input, description: "FK -> Deployment.id; serving deployment" }
      - { name: event_type, type: enum, source: input, description: "BANDWIDTH | INVOCATION" }
      - { name: bandwidth_bytes, type: integer, source: input, default: 0, description: "Bytes served; BANDWIDTH events require >= 1; INVOCATION events must be 0" }
      - { name: invocations, type: integer, source: input, default: 0, description: "Invocation count; INVOCATION events require >= 1; BANDWIDTH events must be 0" }
      - { name: region, type: enum, source: input, description: "Edge region: IAD | SFO | FRA | SIN" }
      - { name: edge_execution, type: boolean, source: input, default: false, description: "Whether function executed at edge; adds region-multiplied regional edge fee" }
      - { name: status, type: enum, source: system, description: "RECORDED | ESTIMATED; ESTIMATED batches convert at period close" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock at ingest; must lie within [period_start, period_end) of the target OPEN period" }
      - { name: effective_rate_cents, type: integer, source: system, default: null, description: "Per-event charge computed at period close (final algorithm); null while period OPEN" }

  - name: AlertRule
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; owning team" }
      - { name: metric, type: enum, source: input, description: "BANDWIDTH_BYTES | INVOCATIONS | BUILD_MINUTES | SPEND_CENTS" }
      - { name: threshold_value, type: integer, source: input, description: "Trigger value (compare metric >= threshold_value)" }
      - { name: window_minutes, type: integer, source: input, default: 60, description: "Sliding window length for spike detection" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FIRED | DISABLED; FIRED auto-resets to ACTIVE after window_minutes elapse with no re-trigger" }
      - { name: last_fired_at, type: datetime, source: system, default: null, description: "Clock time of last firing" }

  - name: SpendCap
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; owning team (one cap per team)" }
      - { name: cap_cents, type: integer, source: input, description: "Maximum projected spend before the cap trips (compare projected_bill_cents >= cap_cents)" }
      - { name: action, type: enum, source: input, description: "ALERT_ONLY | BLOCK_DEPLOYS_AND_SUSPEND" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TRIPPED | DISABLED" }
      - { name: tripped_at, type: datetime, source: system, default: null, description: "Clock time when the cap tripped" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Deployment
    initial_state: QUEUED
    terminal_states: [CANCELED, ERROR]
    transitions:
      - from: QUEUED
        to: BUILDING
        trigger: "POST /v1/deployments/{id}/build-start"
        actor: "SystemWebhook"
        preconditions:
          - "Deployment.status == QUEUED (ERR_INVALID_STATE)"
          - "Team's count of BUILDING deployments < team.build_concurrency_limit (ERR_BUILD_CONCURRENCY_EXCEEDED)"
        side_effects:
          - "Deployment.status = BUILDING"
          - "Updates Project.updated_at / version (cascade touch)"

      - from: QUEUED
        to: CANCELED
        trigger: "POST /v1/deployments/{id}/cancel"
        actor: "Developer"
        preconditions:
          - "Deployment.status == QUEUED (ERR_INVALID_STATE)"
          - "Owning project not ARCHIVED (ERR_PROJECT_ARCHIVED)"
        side_effects:
          - "Deployment.status = CANCELED"
          - "No build minutes reserved or billed"

      - from: BUILDING
        to: READY
        trigger: "POST /v1/deployments/{id}/build-complete with outcome=SUCCESS"
        actor: "SystemWebhook"
        preconditions:
          - "Deployment.status == BUILDING (ERR_INVALID_STATE)"
        side_effects:
          - "deployment.billable_minutes = ceil(build_duration_seconds/60); completed_at = clock; status = READY"
          - "Open UsagePeriod.build_minutes_used += billable_minutes"
          - "UsagePeriod.projected_bill_cents recomputed (usage_overage_charge provisional variant)"
          - "Active SPEND_CENTS/BUILD_MINUTES AlertRules re-evaluated"
          - "ACTIVE SpendCap re-evaluated; if BLOCK_DEPLOYS_AND_SUSPEND and projected_bill_cents >= cap_cents: cap TRIPPED and owning project SUSPENDED (suspended_reason=SPEND_CAP_BREACHED)"
          - "If another PREVIEW deployment of same (project, branch) is READY: it transitions READY -> STALE (supersede)"

      - from: BUILDING
        to: ERROR
        trigger: "POST /v1/deployments/{id}/build-complete with outcome=FAILURE"
        actor: "SystemWebhook"
        preconditions:
          - "Deployment.status == BUILDING (ERR_INVALID_STATE)"
        side_effects:
          - "deployment.billable_minutes = ceil(build_duration_seconds/60) (failures bill); status = ERROR"
          - "Open UsagePeriod.build_minutes_used += billable_minutes; projected_bill_cents recomputed"

      - from: READY
        to: STALE
        trigger: "system cascade: a later PREVIEW deployment of the same (project, branch) reaches READY"
        actor: system
        preconditions: []
        side_effects:
          - "Deployment.status = STALE"

      - from: READY
        to: PROMOTED
        trigger: "POST /v1/deployments/{id}/promote"
        actor: "TeamOwner or Developer"
        preconditions:
          - "Deployment.status == READY (ERR_INVALID_STATE)"
          - "Deployment.target == PREVIEW (ERR_INVALID_STATE); only previews are promoted"
          - "Owning project.status == ACTIVE (ERR_PROJECT_SUSPENDED)"
        side_effects:
          - "deployment.target = PRODUCTION; deployment.status = PROMOTED; deployment.access_protection = NONE"
          - "deployment.previous_promoted_deployment_id = project's current production_deployment_id (or null)"
          - "Project.production_deployment_id = this deployment"
          - "Prior PROMOTED production deployment (if any) -> ROLLED_BACK (audit trail)"

      - from: READY
        to: CANCELED
        trigger: "POST /v1/deployments/{id}/cancel"
        actor: "Developer"
        preconditions:
          - "Deployment.status == READY (ERR_INVALID_STATE)"
          - "Deployment.target == PREVIEW (ERR_CANNOT_CANCEL_PRODUCTION)"
        side_effects:
          - "Deployment.status = CANCELED"

      - from: PROMOTED
        to: ROLLED_BACK
        trigger: "POST /v1/projects/{id}/rollback (atomic production rollback to prior immutable deployment)"
        actor: "TeamOwner"
        preconditions:
          - "Project has a prior production deployment whose status is PROMOTED or ROLLED_BACK (ERR_NO_PRIOR_DEPLOYMENT)"
          - "Project.status == ACTIVE (ERR_PROJECT_SUSPENDED)"
        side_effects:
          - "Current PROMOTED deployment -> ROLLED_BACK with previous_promoted_deployment_id = chosen prior"
          - "Chosen prior deployment -> PROMOTED (again), previous_promoted_deployment_id = displaced current"
          - "Project.production_deployment_id = chosen prior id"

      - from: STALE
        to: PROMOTED
        trigger: "POST /v1/deployments/{id}/promote"
        actor: "TeamOwner or Developer"
        preconditions:
          - "Deployment.status == STALE (ERR_INVALID_STATE)"
          - "Owning project.status == ACTIVE (ERR_PROJECT_SUSPENDED)"
        side_effects:
          - "Same side effects as READY -> PROMOTED (artifact stays immutable; staleness does not block promotion)"

      - from: PROMOTED
        to: PROMOTED
        trigger: "POST /v1/deployments/{id}/promote (idempotent no-op)"
        actor: "TeamOwner or Developer"
        preconditions:
          - "Deployment.status == PROMOTED"
        side_effects:
          - "No state change; returns the deployment unchanged (idempotent promotion)"

  - entity: Project
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade: ACTIVE SpendCap with action=BLOCK_DEPLOYS_AND_SUSPEND trips"
        actor: system
        preconditions:
          - "project belongs to team whose cap tripped; one project per team in this benchmark scope"
        side_effects:
          - "Project.status = SUSPENDED, suspended_reason = SPEND_CAP_BREACHED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/projects/{id}/resume"
        actor: "TeamOwner"
        preconditions:
          - "Project.status == SUSPENDED (ERR_INVALID_STATE)"
          - "If a SpendCap with action=BLOCK_DEPLOYS_AND_SUSPEND is ACTIVE: current open period projected_bill_cents < cap_cents (ERR_SPEND_CAP_STILL_TRIPPED)"
        side_effects:
          - "Project.status = ACTIVE, suspended_reason = null"
          - "TRIPPED SpendCap of the team resets to ACTIVE"

      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /v1/projects/{id}/archive"
        actor: "TeamOwner"
        preconditions:
          - "Project.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Project.status = ARCHIVED"
          - "All QUEUED deployments of the project -> CANCELED"
          - "All ACTIVE Domains of the project -> SUSPENDED"
          - "All ACTIVE Certificates of those domains -> REVOKED (chain depth 3)"

      - from: SUSPENDED
        to: ARCHIVED
        trigger: "POST /v1/projects/{id}/archive"
        actor: "TeamOwner"
        preconditions:
          - "Project.status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Same cascade as ACTIVE -> ARCHIVED"

  - entity: UsagePeriod
    initial_state: OPEN
    terminal_states: [INVOICED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/usage-periods/{id}/close"
        actor: "TeamBillingManager or PlatformAdmin"
        preconditions:
          - "UsagePeriod.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "All ESTIMATED UsageEvents of the period -> RECORDED"
          - "final_bill_cents computed (usage_overage_charge final variant, chronological)"
          - "total_due_cents = final_bill_cents + team.prorated_charges_cents"
          - "status = CLOSED"

      - from: CLOSED
        to: INVOICED
        trigger: "POST /v1/usage-periods/{id}/invoice"
        actor: "TeamBillingManager"
        preconditions:
          - "UsagePeriod.status == CLOSED (ERR_INVALID_STATE)"
        side_effects:
          - "status = INVOICED"
          - "Team.prorated_charges_cents reset to 0 (settles into this invoice)"

  - entity: Domain
    initial_state: PENDING
    terminal_states: []
    note: "Domain has parallel dimensions: verification_status (PENDING|VERIFIED|FAILED) and status (ACTIVE|SUSPENDED); created with verification_status=PENDING, status=ACTIVE"
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /v1/domains/{id}/verify with outcome=SUCCESS"
        actor: "TeamOwner or Developer"
        preconditions:
          - "Domain.verification_status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "verification_status = VERIFIED"
          - "If no certificate exists for the domain: create Certificate ISSUING (issuance cascade, async — becomes ACTIVE via certificate complete)"

      - from: PENDING
        to: FAILED
        trigger: "POST /v1/domains/{id}/verify with outcome=FAILURE"
        actor: "TeamOwner or Developer"
        preconditions:
          - "Domain.verification_status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "verification_status = FAILED"

      - from: FAILED
        to: PENDING
        trigger: "POST /v1/domains/{id}/reverify"
        actor: "TeamOwner or Developer"
        preconditions:
          - "Domain.verification_status == FAILED (ERR_INVALID_STATE)"
        side_effects:
          - "verification_status = PENDING (retry loop)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade: certificate REVOKED or project archived"
        actor: system
        preconditions: []
        side_effects:
          - "Domain.status = SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade: a new Certificate reaches ACTIVE for the domain"
        actor: system
        preconditions: []
        side_effects:
          - "Domain.status = ACTIVE, domain.certificate_id = new certificate"

  - entity: Certificate
    initial_state: ISSUING
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUING
        to: ACTIVE
        trigger: "POST /v1/certificates/{id}/complete"
        actor: "SystemWebhook"
        preconditions:
          - "Certificate.status == ISSUING (ERR_INVALID_STATE)"
        side_effects:
          - "status = ACTIVE; not_before = clock; not_after = not_before + 90 days"
          - "Domain.certificate_id = this certificate"
          - "If prior ACTIVE certificate exists: prior -> EXPIRED, this.auto_renewed_from_id = prior id (renewal cascade)"
          - "If domain.status == SUSPENDED: domain -> ACTIVE"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock reaches not_after"
        actor: system
        preconditions: []
        side_effects:
          - "status = EXPIRED"
          - "Domain.certificate_id = null; domain -> SUSPENDED"
          - "System issues renewal: new Certificate ISSUING with auto_renewed_from_id = this id (only when domain verification_status == VERIFIED)"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /v1/certificates/{id}/revoke or cascade from project archive"
        actor: "TeamOwner"
        preconditions:
          - "Certificate.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "status = REVOKED"
          - "Domain.certificate_id = null; domain -> SUSPENDED"

  - entity: AlertRule
    initial_state: ACTIVE
    terminal_states: [DISABLED]
    transitions:
      - from: ACTIVE
        to: FIRED
        trigger: "system: threshold crossed on metered event ingest (BANDWIDTH_BYTES, INVOCATIONS, BUILD_MINUTES) or projected bill recompute (SPEND_CENTS)"
        actor: system
        preconditions:
          - "Windowed metric sum >= threshold_value"
        side_effects:
          - "status = FIRED; last_fired_at = clock"

      - from: FIRED
        to: ACTIVE
        trigger: "system auto-reset: window_minutes elapsed since last_fired_at with no re-trigger"
        actor: system
        preconditions:
          - "clock >= last_fired_at + window_minutes and windowed metric now < threshold_value"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: DISABLED
        trigger: "DELETE /v1/alert-rules/{id}"
        actor: "TeamBillingManager"
        preconditions: []
        side_effects:
          - "status = DISABLED"

      - from: FIRED
        to: DISABLED
        trigger: "DELETE /v1/alert-rules/{id}"
        actor: "TeamBillingManager"
        preconditions: []
        side_effects:
          - "status = DISABLED"

  - entity: SpendCap
    initial_state: ACTIVE
    terminal_states: [DISABLED]
    transitions:
      - from: ACTIVE
        to: TRIPPED
        trigger: "system: open period projected_bill_cents >= cap_cents"
        actor: system
        preconditions:
          - "Projected bill meets or exceeds cap (inclusive >=)"
        side_effects:
          - "status = TRIPPED; tripped_at = clock"
          - "If action == BLOCK_DEPLOYS_AND_SUSPEND: owning Project -> SUSPENDED (suspended_reason=SPEND_CAP_BREACHED)"

      - from: TRIPPED
        to: ACTIVE
        trigger: "system cascade: project resumed (spend back below cap), or cap_cents raised via PATCH"
        actor: "TeamBillingManager (via PATCH) / system"
        preconditions:
          - "After PATCH: projected_bill_cents < new cap_cents"
        side_effects:
          - "status = ACTIVE; tripped_at = null"

      - from: ACTIVE
        to: DISABLED
        trigger: "DELETE /v1/spend-caps/{id}"
        actor: "TeamBillingManager"
        preconditions: []
        side_effects:
          - "status = DISABLED"

      - from: TRIPPED
        to: DISABLED
        trigger: "DELETE /v1/spend-caps/{id}"
        actor: "TeamBillingManager"
        preconditions: []
        side_effects:
          - "status = DISABLED (project stays SUSPENDED until explicit resume)"

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on parent version, serially testable
# =============================================================================
concurrency_rules:
  - rule_id: domain-update-stale-version
    parent_entity: Domain
    write_endpoint: "PATCH /v1/domains/{id}"
    occ_field: "expected_domain_version"
    description: |
      Updating a Domain whose version has advanced since the client last
      observed it is rejected. Captures the case where a verify cascade has
      legitimately rewritten the domain (certificate issuance bumps
      certificate_id and status) and the writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: project-config-stale-version
    parent_entity: Project
    write_endpoint: "PATCH /v1/projects/{id}"
    occ_field: "expected_project_version"
    description: |
      Updating a Project (production_branch, preview_protection, framework)
      whose version has advanced since the client last observed it is
      rejected. Captures the case where a promote/rollback/suspend cascade
      has legitimately rewritten the project between the client's read and
      this write.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: spendcap-update-stale-version
    parent_entity: SpendCap
    write_endpoint: "PATCH /v1/spend-caps/{id}"
    occ_field: "expected_spendcap_version"
    description: |
      Updating a SpendCap (cap_cents, action) whose version has advanced
      since the client last observed it is rejected. A metering cascade can
      legitimately trip the cap (bumping its version) between the client's
      read and this write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: usage_overage_charge
    trigger: "provisional variant: on every UsageEvent ingest and every build-complete while period OPEN; final variant: at POST /v1/usage-periods/{id}/close"
    algorithm: tiered_pricing
    formula: |
      BANDWIDTH (per period):
        total_gb_ceil = ceil(bandwidth_bytes / 1_000_000_000)   # period-level ceiling
        overage_gb = max(0, total_gb_ceil - team.included_bandwidth_gb)
        bandwidth_cents = min(overage_gb, bandwidth_tier2_threshold_gb) * bandwidth_tier1_rate_cents_per_gb
                        + max(0, overage_gb - bandwidth_tier2_threshold_gb) * bandwidth_tier2_rate_cents_per_gb
      INVOCATIONS (per period):
        billable_millions_ceil = ceil(invocations / 1_000_000)
        overage_millions = max(0, billable_millions_ceil - team.included_invocations_millions)
        invocation_cents = overage_millions * invocation_rate_cents_per_million
      REGIONAL EDGE EXECUTION (per event, only when edge_execution=true):
        edge_fee_cents(event) = ceil(invocations / 1_000_000) * REGION_EDGE_MULTIPLIER[event.region]
        regional_edge_cents = sum over events of edge_fee_cents(event)
      BUILD MINUTES (per period):
        build_overage_minutes = max(0, build_minutes_used - team.included_build_minutes)
        build_cents = build_overage_minutes * overage_build_minute_rate_cents
      TOTAL = bandwidth_cents + invocation_cents + regional_edge_cents + build_cents
    constants:
      REGION_EDGE_MULTIPLIER: { IAD: 1, SFO: 1, FRA: 2, SIN: 3 }
      GB_BYTES: 1000000000
    precision: "integer cents; all ceilings applied before multiplication (ceil-then-multiply, never multiply-then-round)"
    variants:
      - name: provisional
        when: "period OPEN; projected_bill_cents field"
        difference: "input set includes UsageEvents with status IN {RECORDED, ESTIMATED}"
      - name: final
        when: "at period close; final_bill_cents field and per-event effective_rate_cents"
        difference: "all ESTIMATED events converted to RECORDED first, then identical formula over RECORDED events only; final also stamps each event's effective_rate_cents in chronological recorded_at order (bandwidth events share the period marginal tier at their cumulative position; tie-break created_at ASC)"

  - name: build_minute_billing
    trigger: "POST /v1/deployments/{id}/build-complete"
    algorithm: aggregation
    formula: |
      billable_minutes = ceil(build_duration_seconds / 60)
      period = the OPEN UsagePeriod of the deployment's team whose [period_start, period_end)
               contains the logical clock at completion
      period.build_minutes_used += billable_minutes
      (both SUCCESS and FAILURE outcomes bill; CANCELED QUEUED builds bill 0)
    constants:
      SECONDS_PER_MINUTE: 60
    precision: "integer minutes, ceiling"

  - name: seat_proration
    trigger: "POST /v1/teams/{teamId}/members (mid-period seat add)"
    algorithm: waterfall_allocation
    formula: |
      On member create, if the team's OPEN UsagePeriod exists:
        days_total = max(1, (period.period_end - period.period_start) in whole days)
        days_remaining = max(0, (period.period_end - clock) in whole days)
        charge_cents = round_half_up(plan.seat_price_cents_monthly * days_remaining / days_total)
        team.prorated_charges_cents += charge_cents
      seats_used = count(Member rows of team); enforced capacity seats_used < seat_limit BEFORE insert
      Evaluation order is pinned: (1) compute days_total, (2) compute days_remaining, (3) multiply then divide,
      (4) round_half_up once at the end. Team's seat_limit derives from its plan, so plan price feeds the charge —
      the dependency seat_price -> charge is resolved by reading PlanCatalogEntry BEFORE proration, never after.
    constants: {}
    precision: "integer cents, round_half_up, single final rounding"

  - name: preview_url_slug
    trigger: "deployment creation"
    algorithm: aggregation
    formula: |
      slug_base = lowercase(branch); replace every char not in [a-z0-9-] with '-'; collapse consecutive '-'; strip leading/trailing '-'; truncate to 40 chars
      digest = first 8 hex chars of sha256(project_id + '|' + branch + '|' + commit_sha)
      url_slug = slug_base + '-' + digest
      url = url_slug + '.preview.example.com'
    constants:
      SLUG_BASE_MAX_LEN: 40
    precision: "deterministic; same (project_id, branch, commit_sha) always yields the same slug; different commit_sha yields a different slug"

  - name: build_queue_admission
    trigger: "deployment creation and POST /v1/deployments/{id}/build-start"
    algorithm: threshold
    formula: |
      On create:
        reserved = build_minutes_used(OPEN period) + sum(estimated_build_minutes of team's QUEUED/BUILDING deployments)
        if reserved + estimated_build_minutes(new) > team.included_build_minutes AND NO ACTIVE SpendCap covering build overage:
          reject with ERR_BUILD_MINUTES_EXHAUSTED (no queueing beyond plan)
        else:
          if team BUILDING count >= build_concurrency_limit: status stays QUEUED
          else: status QUEUED (admission to build is a separate build-start transition)
      On build-start:
        if team BUILDING count >= build_concurrency_limit: reject ERR_BUILD_CONCURRENCY_EXCEEDED (caller retries later; boundary is strict >=)
      Dequeue order when a slot frees: QUEUED deployments of the team sorted by created_at ASC (never by id)
    constants:
      DEFAULT_ESTIMATE_MINUTES: 2
    precision: "integer minutes; boundary: reserved + estimate == included_build_minutes is ADMITTED (rejection requires strict >)"

  - name: alert_window_sum
    trigger: "UsageEvent ingest and build-complete"
    algorithm: aggregation
    formula: |
      window_start = clock - alert.window_minutes
      BANDWIDTH_BYTES: sum(bandwidth_bytes) of period events with recorded_at >= window_start
      INVOCATIONS: sum(invocations) of period events with recorded_at >= window_start
      BUILD_MINUTES: sum(billable_minutes) of deployments completed_at >= window_start
      SPEND_CENTS: current period projected_bill_cents (cumulative, not windowed)
      fire when metric >= threshold_value (inclusive)
      auto-reset when clock >= last_fired_at + window_minutes AND windowed metric < threshold_value
    constants: {}
    precision: "integer compare; boundary >= fires, threshold-1 does not"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_TEAM_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_DEPLOYMENT_NOT_FOUND | ERR_DOMAIN_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_ENV_VAR_NOT_FOUND | ERR_REDIRECT_NOT_FOUND | ERR_USAGE_PERIOD_NOT_FOUND | ERR_ALERT_RULE_NOT_FOUND | ERR_SPEND_CAP_NOT_FOUND | ERR_MEMBER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: state
    check: "Target entity in a state that permits the operation (per state machine preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: state
    check: "Project not ARCHIVED for child mutations (deployments, env vars, domains, redirects); project not SUSPENDED for deploy/promote/rollback; period OPEN for usage ingest"
    error_id: "ERR_PROJECT_ARCHIVED | ERR_PROJECT_SUSPENDED | ERR_USAGE_PERIOD_CLOSED"
    http_status: 409
    applies_to: "child creation and deployment lifecycle endpoints"
  - priority: 6
    category: business_referential
    check: "Referenced entities valid: env var scope non-overlap for same key in project; domain name globally unique; spend cap unique per team; member email unique per team; redirect priority unique per project"
    error_id: "ERR_ENV_SCOPE_OVERLAP | ERR_DOMAIN_ALREADY_ASSIGNED | ERR_SPEND_CAP_EXISTS | ERR_MEMBER_ALREADY_EXISTS | ERR_REDIRECT_PRIORITY_CONFLICT"
    http_status: 409
    applies_to: "creation/patch of env vars, domains, spend caps, members, redirects"
  - priority: 7
    category: business_safety
    check: "Access-protection and secret-safety rules: secret env var values never returned; preview deployments carry effective access_protection; PRODUCTION deployments forced access_protection=NONE"
    error_id: "ERR_INVALID_REQUEST"
    http_status: 400
    applies_to: "env var and deployment creation/patch"
  - priority: 8
    category: business_constraint
    check: "Shape/enum/range constraints: usage event type-consistent quantities; period_end > period_start; threshold_value > 0; cap_cents > 0; scopes non-empty subset of enum"
    error_id: "ERR_USAGE_EVENT_SHAPE | ERR_INVALID_PERIOD_RANGE | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "creation endpoints with constrained payloads"
  - priority: 9
    category: business_fiscal
    check: "Seat capacity: seats_used < seat_limit before member insert"
    error_id: ERR_SEAT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/teams/{teamId}/members"
  - priority: 10
    category: business_fiscal
    check: "Build budget: reserved + estimated_build_minutes(new) > included_build_minutes rejected (strict >)"
    error_id: ERR_BUILD_MINUTES_EXHAUSTED
    http_status: 402
    applies_to: "POST /v1/projects/{id}/deployments"
  - priority: 11
    category: business_fiscal
    check: "Concurrency capacity: team BUILDING count >= build_concurrency_limit"
    error_id: ERR_BUILD_CONCURRENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /v1/deployments/{id}/build-start"
  - priority: 12
    category: business_fiscal
    check: "Rollback target exists: project has a prior production deployment"
    error_id: ERR_NO_PRIOR_DEPLOYMENT
    http_status: 409
    applies_to: "POST /v1/projects/{id}/rollback"

