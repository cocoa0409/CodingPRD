      assert:
      - error_id == ERR_FORBIDDEN_ROLE 403; project remains PROPOSED
  - name: all_roles_can_read_facility
    claim_type: role_allowed
    grounds:
    - roles.MonthlyParker
    - endpoints[GET /ops/facilities/{facility_id}]
    distinguishing_aspect: Every declared role — including entity-backed MonthlyParker and GateDevice — can read shared GET endpoints.
    test_recipe:
      setup:
