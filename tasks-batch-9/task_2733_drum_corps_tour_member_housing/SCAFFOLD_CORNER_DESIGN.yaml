            - "${epoch_on_expiry_date} == 1 and ${status_on_expiry_date} == CLEARED — on 2027-08-01 the comparison screening_expires_on < clock date is false, so the threshold has not been crossed"
            - "Volunteer.${volunteer_id}.assignment_count == 2 immediately after the first sweep"
            - "after the second sweep Volunteer.${volunteer_id}.screening_status == EXPIRED with screening_expires_on still 2027-08-01"
            - "StaffAssignment.${august_assignment_id}.status == RELEASED with released_reason == SCREENING_EXPIRED because its shift_end_at is after the clock instant"
            - "StaffAssignment.${june_assignment_id}.status is still APPROVED — a shift that already ended is not retroactively released"
            - "Volunteer.${volunteer_id}.assignment_count == 1 and Season.${season_id}.billing_epoch == 2"

      - name: member_listing_filters_sort_and_offset_stay_consistent_under_mutation
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/members
          - entities.Member.fields.is_minor
          - complexity_profile.consistency_model
        distinguishing_aspect: "Two filters plus offset paging must compose on created_at order: with three OFFERED minors and two decoys (an adult and a DECLINED minor), membership_status=OFFERED and is_minor=true must yield exactly the three minors, offset 1 limit 1 must return the second of them, and inserting a fourth qualifying member afterwards must change total_count while the already-visited offsets keep pointing at the same rows."
        test_recipe:
          setup:
            - "One season with tour_departure_date 2027-06-12. Five members are created in a known order: three minors who receive OFFER decisions, one adult who receives an OFFER, and one minor who is DECLINED."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Minor One", email: "m1@corps.test", date_of_birth: "2010-01-01", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { minor_one_id: "$.data.id" }
            - call: "POST /members/${minor_one_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 80 }
              as: MembershipCoordinator
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Minor Two", email: "m2@corps.test", date_of_birth: "2010-02-02", section: "PERCUSSION", dietary_flag: "GLUTEN_FREE" }
              as: MembershipCoordinator
              captures: { minor_two_id: "$.data.id" }
            - call: "POST /members/${minor_two_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 81 }
              as: MembershipCoordinator
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Minor Three", email: "m3@corps.test", date_of_birth: "2010-03-03", section: "COLOR_GUARD", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { minor_three_id: "$.data.id" }
            - call: "POST /members/${minor_three_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 82 }
              as: MembershipCoordinator
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Adult Decoy", email: "adult@corps.test", date_of_birth: "2004-05-05", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { adult_id: "$.data.id" }
            - call: "POST /members/${adult_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 83 }
              as: MembershipCoordinator
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Declined Minor", email: "m4@corps.test", date_of_birth: "2010-04-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { declined_id: "$.data.id" }
            - call: "POST /members/${declined_id}/audition-decision"
              payload: { decision: "DECLINE", audition_score: 40 }
              as: MembershipCoordinator
          trigger:
            - call: "GET /members"
              payload: { season_id: "${season_id}", membership_status: "OFFERED", is_minor: true }
              as: MembershipCoordinator
            - call: "GET /members"
              payload: { season_id: "${season_id}", membership_status: "OFFERED", is_minor: true, limit: 1, offset: 1 }
              as: MembershipCoordinator
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Minor Four", email: "m5@corps.test", date_of_birth: "2010-05-05", section: "BRASS", dietary_flag: "VEGETARIAN" }
              as: MembershipCoordinator
              captures: { minor_four_id: "$.data.id" }
            - call: "POST /members/${minor_four_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 84 }
              as: MembershipCoordinator
            - call: "GET /members"
              payload: { season_id: "${season_id}", membership_status: "OFFERED", is_minor: true, limit: 2, offset: 2 }
              as: MembershipCoordinator
          assert:
            - "the unpaged filtered read returns exactly Member.${minor_one_id}, Member.${minor_two_id}, Member.${minor_three_id} in created_at order with total_count == 3 and has_more == false"
            - "Member.${adult_id} is excluded by is_minor and Member.${declined_id} by membership_status — both filters are applied, not just the first"
            - "the limit 1 offset 1 read returns exactly Member.${minor_two_id} with total_count == 3 and has_more == true"
            - "after the insertion the limit 2 offset 2 read returns Member.${minor_three_id} then Member.${minor_four_id} with total_count == 4 and has_more == false — the newly created row appends at the end of the created_at order and does not shift earlier offsets"

      - name: cascading_side_effect_chain_depth_and_ordering
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: third_delinquency_strike_cascades_plan_member_housing_and_school_ledgers
          rationale: "The N-level chain corner for this layer is that §1.8 transitive_cascade instance: one sweep drives plan closure -> member withdrawal -> housing release -> agreement/school/season ledger recomputation, with the deliberate ordering rule that the plan status is NOT re-derived after the withdrawal recharges the member."

      - name: dual_variant_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: settlement_provisional_forward_versus_circuit_final_net
          rationale: "Both variants and the delta on switch are asserted there (provisional_net 1274880 versus final_net 1038778, variance -236102), including that finalize retains rather than overwrites the provisional columns."

      - name: derived_field_reconciliation_after_source_changes
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.housing_bed_night_capacity
        excluded_because:
          difficulty_instance: housing_release_and_rebooking_restore_bed_night_ledgers_without_drift
          rationale: "Derived-field correctness after create, after release and after re-add — across FacilityAgreement.billable_cents, HostSchool.reserved_bed_nights and Season.housing_cost_cents — is exactly what that §1.8 compensating_invariant instance reconciles at each step."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.housing_bed_night_capacity
          - entities.Season.fields.housing_cost_cents
        distinguishing_aspect: "The model is immediate, so a single housing assignment must already be reflected in three other aggregates by the time the very next read happens — no sweep, no re-read delay: the agreement's occupancy and billing, the school's reserved bed-nights and the season's housing cost all move within the same request, and the assignment response itself carries the derived nights."
        test_recipe:
          setup:
            - "A SIGNED spring-training agreement (26 nights, 500 per bed-night, minimum 0) and one adult member exist with no occupancy yet."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /host-schools"
              payload: { name: "Rockford High School", city: "Rockford", state_code: "IL", sleeping_space_count: 30, capacity_per_space: 12, rehearsal_field_count: 2, has_air_conditioning: true }
              as: TourManager
              captures: { school_id: "$.data.id" }
            - call: "POST /facility-agreements"
              payload: { host_school_id: "${school_id}", season_id: "${season_id}", usage_type: "SPRING_TRAINING", start_date: "2027-05-10", end_date: "2027-06-05", nightly_rate_cents: 500, minimum_billable_beds: 0 }
              as: TourManager
              captures: { agreement_id: "$.data.id" }
            - call: "POST /facility-agreements/${agreement_id}/submit"
              payload: {}
              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/sign"
              payload: {}
              as: CorpsDirector
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "GET /facility-agreements/${agreement_id}"
              as: MembershipCoordinator
              captures: { agreement_v: "$.data.version" }
          trigger:
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_id}", member_id: "${member_id}", space_index: 7, check_in_date: "2027-05-12", check_out_date: "2027-05-22", expected_facility_agreement_version: "${agreement_v}" }
              as: MembershipCoordinator
              captures: { housing_id: "$.data.id" }
            - call: "GET /facility-agreements/${agreement_id}"
              as: MembershipCoordinator
            - call: "GET /host-schools/${school_id}"
              as: MembershipCoordinator
            - call: "GET /seasons/${season_id}"
              as: BusinessManager
          assert:
            - "the create response already carries HousingAssignment.${housing_id}.nights == 10 and occupant_is_minor == false — derived fields are not deferred to a later read"
            - "the immediately following agreement read shows occupied_bed_nights == 10, billable_bed_nights == 10 and billable_cents == 5000 with version == ${agreement_v} + 1"
            - "the immediately following school read shows reserved_bed_nights == 10 (the school's own counter is recomputed in the same request)"
            - "the immediately following season read shows housing_cost_cents == 5000 with ledger_status OPEN and billing_epoch 0 — no sweep was needed to publish the cost"
