    output: "SpecDeviation[]"
    side_effects:
      - "reads only"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SUBMITTAL_NOT_FOUND]
  - method: GET
    path: /water-treatment/spec-deviations/{deviation_id}
    purpose: "Fetch one disclosed deviation with its weighted penalty points."
    roles: [PlatformAdmin, ApplicationEngineer, DesignReviewer, FabricationManager, QualityEngineer, CommissioningEngineer, EngineerOfRecord, OwnerRepresentative, ContractsAdministrator]
    input: []
    output: SpecDeviation
    side_effects:
      - "reads only"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DEVIATION_NOT_FOUND]
  - method: GET
    path: /water-treatment/performance-demos
    purpose: "List performance demonstrations ordered by round_no ASC then created_at ASC, filterable by project, skid or result."
    roles: [PlatformAdmin, ApplicationEngineer, DesignReviewer, FabricationManager, QualityEngineer, CommissioningEngineer, EngineerOfRecord, OwnerRepresentative, ContractsAdministrator]
    input: ["project_id?", "skid_id?", "result?"]
    output: "PerformanceDemo[]"
    side_effects:
