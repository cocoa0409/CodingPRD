            - "after DISPUTE_RESOLVED_ALIVE ParticipantRecord.${p1_id}.mortality_status == ALIVE_CONFIRMED, data_confidence_score == 100, accounting_liability_cents == 11460000 and settlement_liability_cents == 12540000"
            - "ParticipantRecord.${p1_id}.participant_status == ASSIGNED at every one of the four observation points"
            - "ParticipantRecord.${p1_id}.address_status == CONFIRMED at every one of the four observation points"
            - "ParticipantRecord.${p1_id}.date_of_death is null after DISPUTE_RESOLVED_ALIVE"

      - name: strategy_revision_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.DeRiskingStrategy.UNDER_EVALUATION_to_DRAFT
          - entities.DeRiskingStrategy.fields.revision_count
          - errors.ERR_STRATEGY_STATE_INVALID
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          DRAFT -> UNDER_EVALUATION -> DRAFT is a genuine loop, but it is bounded:
          RETURN_FOR_REVISION is admissible only while revision_count <
          MAX_REVISION_ROUNDS (2), so the third return is rejected with
          ERR_STRATEGY_STATE_INVALID and the strategy is stuck in
          UNDER_EVALUATION with exactly APPROVE and REJECT remaining. Each return
          also clears the three projected cost fields and zeroes
          in_scope_participant_count, so the loop is lossy rather than idempotent,
          and the cleared submitted_by_user_id lets a different actuary re-submit.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one PensionPlan in ONGOING with two RETIREE_IN_PAY participants at stated monthly benefits 250001 and 99999"
