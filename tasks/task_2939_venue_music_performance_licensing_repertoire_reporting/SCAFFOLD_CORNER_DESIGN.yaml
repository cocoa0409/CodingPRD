            - "${ok_status} is SETTLEMENT_PROPOSED and ${proposer} is settlement-1 after the accepted offer"
            - "${settled_status} is SETTLED and ${settler} is settlement-2, so the proposer and the accepter need not be the same officer: only the findings author is barred"
            - "AuditCase.${case_id}.findings_issued_by_user_id is still auditor-1, and the two refused calls left version and offered_amount_cents untouched"
            - "Venue.${v2_id}.audit_hold is false after the settlement, and its AUDIT_BACK_LICENSE assessment is SETTLED"

      - name: corner_rbac_licensing_admin_covers_every_shared_operation
