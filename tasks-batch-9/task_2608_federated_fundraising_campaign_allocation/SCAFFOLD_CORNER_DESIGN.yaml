      - name: certify_review_under_wrong_agency_path_returns_review_agency_mismatch
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REVIEW_AGENCY_MISMATCH
          - validations.priority_7
          - state_machines.AgencyReview.PENDING_to_CERTIFIED
        distinguishing_aspect: |
          Nested path integrity is checked as a relationship, not as mere existence: both the
          agency in the path and the review id exist, but the review belongs to the other agency,
          so certify returns ERR_REVIEW_AGENCY_MISMATCH (409, priority 7) rather than a 404 or a
          silent certification. The control leg certifies the same review under its own agency and
          succeeds, so the refusal is attributable to the mismatch alone.
        test_recipe:
          setup:
            - "Two agencies, each with one PENDING AgencyReview for fiscal year 2025."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Crosswalk Legal Aid", ein: "620000004", primary_priority_area: "FINANCIAL_STABILITY" }
              as: UnitedFundAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /fundraising/agencies/${ag_a}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.7800, admin_expense_ratio: 0.1900, months_operating_reserve: 4.00, governance_checklist_passed_count: 8, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev_a: $.data.id }
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Dunmore Arts Collective", ein: "620000005", primary_priority_area: "EDUCATION" }
              as: UnitedFundAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /fundraising/agencies/${ag_b}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.7800, admin_expense_ratio: 0.1900, months_operating_reserve: 4.00, governance_checklist_passed_count: 8, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev_b: $.data.id }
          trigger:
            - call: "POST /fundraising/agencies/${ag_a}/reviews/${rev_b}/certify"
              payload: { audited_program_expense_ratio: 0.7800, audited_admin_expense_ratio: 0.1900, audited_months_operating_reserve: 4.00 }
              as: FinanceReviewer
              captures: { e1: $.data.error_id }
            - call: "POST /fundraising/agencies/${ag_b}/reviews/${rev_b}/certify"
              payload: { audited_program_expense_ratio: 0.7800, audited_admin_expense_ratio: 0.1900, audited_months_operating_reserve: 4.00 }
              as: FinanceReviewer
              captures: { st: $.data.status, cs: $.data.certified_score }
          assert:
            - "Mismatched leg: 409 ERR_REVIEW_AGENCY_MISMATCH"
            - "AgencyReview.${rev_b}.status is still PENDING after the refusal and Agency.${ag_a}.membership_status is still UNDER_FINANCIAL_REVIEW"
            - "Control leg: 200 with AgencyReview.${rev_b}.status == CERTIFIED, certified_score == 90.00, review_basis == AUDITED"
            - "Agency.${ag_b}.membership_status == GOOD_STANDING and latest_standing_score == 90.00"
            - "Agency.${ag_a}.membership_status is unchanged at UNDER_FINANCIAL_REVIEW (the refused call touched nothing)"

      - name: award_supplement_pushing_total_above_available_pool_returns_pool_insufficient
        claim_type: error_triggerable
        grounds:
          - errors.ERR_POOL_INSUFFICIENT
          - calculations.community_impact_fund_allocation
          - state_machines.AllocationRequest.PANEL_APPROVED_to_AWARDED
          - endpoints.POST /fundraising/allocation-cycles/{id}/awards
        distinguishing_aspect: |
          The pool guard is evaluated on total_award_unclamped, which the step-5 supplement can
          push above a pool that the step-3 base fits inside: with pool 1000.00 and
          max_award_per_agency 2000.00, a 2000.00 ask at composite 81.50 gives step2 1630.00,
          base_award min(1630.00, 1000.00) = 1000.00 (a perfect fit), offset 0.00 (base below the
          50000.00 tier floor and passthrough 0.00) and supplement round_half_up(1000.00 * 0.06)
          = 60.00, so total_award_unclamped 1060.00 exceeds the 1000.00 pool and the award is
          refused with ERR_POOL_INSUFFICIENT. An implementation that applies the step-7 clamp
          before checking, or that checks base_award instead of the unclamped total, wrongly
          awards 1000.00.
        test_recipe:
          setup:
            - "One GOOD_STANDING agency with designated_passthrough_ytd 0.00; cycle opening pool 1000.00, max_award_per_agency 2000.00 (so the REQUEST_CAP_MULTIPLE ceiling is 4000.00 and a 2000.00 ask submits cleanly)."
            - "Three conflict-free panelists each scoring 90/80/70, so all three weighted scores are 81.50, the eligible count is 3 (below TRIM_MIN_COUNT so no trim) and the composite is the plain mean 81.50."
            - "The request's priority_area FINANCIAL_STABILITY differs from the cycle focus HEALTH, so FOCUS_MULTIPLIER never applies."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Everly Credit Counseling", ein: "620000006", primary_priority_area: "FINANCIAL_STABILITY" }
              as: UnitedFundAdmin
