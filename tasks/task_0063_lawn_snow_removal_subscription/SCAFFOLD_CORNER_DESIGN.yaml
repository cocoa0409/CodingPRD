scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: create_contract_returns_all_fields
        claim_type: Creation
        grounds: [entities.ServiceContract]
        distinguishing_aspect: "POST /contracts with all required fields returns 201 and a DRAFT contract with accrued_balance_cents == 0, version == 1."
        test_recipe:
          setup: ["A customer and a property owned by them."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e1@x.com", full_name: "E One", service_zip: "20001" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "1 St", lawn_area_sqft: 3000, zip: "20001" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 12000, term_months: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id, st: $.data.status }
          assert:
            - "ServiceContract.${con_id}.status == DRAFT"
            - "ServiceContract.${con_id}.accrued_balance_cents == 0"
            - "ServiceContract.${con_id}.version == 1"

      - name: get_contract_not_found
        claim_type: Not Found
        grounds: [entities.ServiceContract, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /contracts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /contracts/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: list_properties_paginated
        claim_type: Listing
        grounds: [entities.ServiceProperty]
        distinguishing_aspect: "GET /properties returns a paginated array envelope with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["One customer with two properties."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e2@x.com", full_name: "E Two", service_zip: "20002" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "A", lawn_area_sqft: 1000, zip: "20002" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "B", lawn_area_sqft: 2000, zip: "20002" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /properties"
              payload: { customer_id: "${cust_id}", limit: 10, offset: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "response is an array of 2 ServiceProperty for ${cust_id}"
            - "pagination total_count == 2 and has_more == false"

      - name: preference_grass_height_out_of_range_rejected
        claim_type: Type Constraints
        grounds: [entities.CustomerPreference.fields.grass_height_mm, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /preferences with grass_height_mm == 10 (below the 20..120 floor) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A customer and property."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e3@x.com", full_name: "E Three", service_zip: "20003" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "C", lawn_area_sqft: 1000, zip: "20003" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /preferences"
              payload: { property_id: "${prop_id}", grass_height_mm: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: preference_fertilization_default_false
        claim_type: Defaults
        grounds: [entities.CustomerPreference.fields.fertilization_enabled, entities.CustomerPreference.fields.snow_opt_out]
        distinguishing_aspect: "Omitting fertilization_enabled and snow_opt_out on POST /preferences applies defaults fertilization_enabled == false and snow_opt_out == false."
        test_recipe:
          setup: ["A customer and property."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e4@x.com", full_name: "E Four", service_zip: "20004" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "D", lawn_area_sqft: 1000, zip: "20004" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /preferences"
              payload: { property_id: "${prop_id}", grass_height_mm: 50 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pref_id: $.data.id }
          assert:
            - "CustomerPreference.${pref_id}.fertilization_enabled == false"
            - "CustomerPreference.${pref_id}.snow_opt_out == false"

      - name: duplicate_customer_email_rejected
        claim_type: Type Constraints
        grounds: [entities.Customer.fields.email, "validations[priority=6]", "errors[ERR_DUPLICATE_RESOURCE]"]
        distinguishing_aspect: "POST /customers with an already-registered email returns ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["A customer already registered with email dup@x.com."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "Dup", service_zip: "20005" }
              as: PlatformAdmin
          trigger:
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "Dup2", service_zip: "20006" }
              as: PlatformAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_RESOURCE"
            - "http status == 409"

      - name: equipment_system_fields_ignored_on_input
        claim_type: System Fields
        grounds: [entities.Equipment.fields.wear_score, entities.Equipment.fields.status]
        distinguishing_aspect: "POST /equipment ignores any client-supplied wear_score/status; server mints wear_score == 0 and status == IDLE."
        test_recipe:
          setup: ["A route exists."]
          setup_api_calls:
            - call: "POST /routes"
              payload: { region_zip: "20007", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-SYS", equipment_type: "SPREADER", age_months: 1, assigned_route_id: "${route_id}" }
              as: DispatchManager
              captures: { eq_id: $.data.id }
          assert:
            - "Equipment.${eq_id}.wear_score == 0"
            - "Equipment.${eq_id}.status == IDLE"
            - "Equipment.${eq_id}.version == 1"

  # =====================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_contract_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceContract.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a contract already ACTIVE returns ERR_INVALID_STATE; no second version bump beyond the first activation."
        test_recipe:
          setup: ["An ACTIVE contract."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm1@x.com", full_name: "SM One", service_zip: "30001" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "P1", lawn_area_sqft: 1000, zip: "30001" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 10000, term_months: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: complete_scheduled_visit_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceVisit.DISPATCHED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a visit still in SCHEDULED (never dispatched) returns ERR_INVALID_STATE; no surcharge computed."
        test_recipe:
          setup: ["A SCHEDULED visit, never dispatched; a crew on the route."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm2@x.com", full_name: "SM Two", service_zip: "30002" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "P2", lawn_area_sqft: 1000, zip: "30002" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "SUMMER", contract_price_cents: 10000, term_months: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "30002", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew X", home_route_id: "${route_id}" }
              as: DispatchManager
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "LAWN", runtime_hours: 1 }
              as: DispatchManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /visits/${v_id}/complete"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "ServiceVisit.${v_id}.status == SCHEDULED"

      - name: contract_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.ServiceContract, entities.ServiceContract.fields.status]
        distinguishing_aspect: "A freshly created ServiceContract starts in initial_state DRAFT."
        test_recipe:
          setup: ["A customer and property."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm3@x.com", full_name: "SM Three", service_zip: "30003" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "P3", lawn_area_sqft: 1000, zip: "30003" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 9000, term_months: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
          assert:
            - "ServiceContract.${con_id}.status == DRAFT"

      - name: closed_contract_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceContract.ACTIVE_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After ACTIVE->CLOSED, a suspend on the CLOSED contract returns ERR_INVALID_STATE; CLOSED is terminal."
        test_recipe:
          setup: ["A CLOSED contract (activated then closed, no visits)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm4@x.com", full_name: "SM Four", service_zip: "30004" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "P4", lawn_area_sqft: 1000, zip: "30004" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 10000, term_months: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /contracts/${con_id}/close-season"
              payload: {}
              as: DispatchManager
          trigger:
            - call: "POST /contracts/${con_id}/suspend"
              payload: {}
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "ServiceContract.${con_id}.status == CLOSED"

      - name: reject_skip_keeps_visit_scheduled
        claim_type: Valid Transition
        grounds: [state_machines.SkipRequest.PENDING_to_REJECTED, entities.ServiceVisit.fields.status]
        distinguishing_aspect: "Rejecting a PENDING skip moves SkipRequest to REJECTED, grants no credit, and leaves the ServiceVisit SCHEDULED."
        test_recipe:
          setup: ["A SCHEDULED visit with a PENDING skip request."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm5@x.com", full_name: "SM Five", service_zip: "30005" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "P5", lawn_area_sqft: 1000, zip: "30005" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "SUMMER", contract_price_cents: 30000, term_months: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "30005", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "LAWN", runtime_hours: 1 }
              as: DispatchManager
              captures: { v_id: $.data.id }
            - call: "POST /skip-requests"
              payload: { visit_id: "${v_id}", reason: "maybe" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { skip_id: $.data.id }
          trigger:
            - call: "POST /skip-requests/${skip_id}/reject"
              payload: {}
              as: DispatchManager
              captures: { sstatus: $.data.status }
          assert:
            - "SkipRequest.${skip_id}.status == REJECTED"
            - "ServiceVisit.${v_id}.status == SCHEDULED"
            - "Customer.${cust_id}.wallet_credit_cents == 0"

      - name: suspend_cascades_routestop_inactive
        claim_type: Cross-entity
        grounds: [state_machines.ServiceContract.ACTIVE_to_SUSPENDED, entities.RouteStop.fields.active]
        distinguishing_aspect: "Suspending an ACTIVE contract flips its property's RouteStop.active to false (cross-entity cascade)."
        test_recipe:
          setup: ["ACTIVE contract with one active RouteStop."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm6@x.com", full_name: "SM Six", service_zip: "30006" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "P6", lawn_area_sqft: 1000, zip: "30006" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 10000, term_months: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "30006", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /contracts/${con_id}/suspend"
              payload: {}
              as: DispatchManager
          assert:
            - "ServiceContract.${con_id}.status == SUSPENDED"
            - "RouteStop.${stop_id}.active == false"

      - name: close_season_blocked_by_open_dispatch
        claim_type: Precondition Enforcement
        grounds: [state_machines.ServiceContract.ACTIVE_to_CLOSED, "validations[priority=14]", "errors[ERR_OPEN_DISPATCH_EXISTS]"]
        distinguishing_aspect: "close-season with a DISPATCHED visit on the contract returns ERR_OPEN_DISPATCH_EXISTS; contract stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE contract with a DISPATCHED visit (equipment IN_SERVICE)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm7@x.com", full_name: "SM Seven", service_zip: "30007" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "P7", lawn_area_sqft: 1000, zip: "30007" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 10000, term_months: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "30007", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-SM7", equipment_type: "PLOW", age_months: 2, assigned_route_id: "${route_id}" }
              as: DispatchManager
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "SNOW", snow_depth_in: 3.0, runtime_hours: 2 }
              as: DispatchManager
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/dispatch"
              payload: {}
              as: DispatchManager
          trigger:
            - call: "POST /contracts/${con_id}/close-season"
              payload: {}
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_OPEN_DISPATCH_EXISTS"
            - "ServiceContract.${con_id}.status == ACTIVE"

      - name: maintenance_due_to_under_maintenance_valid
        claim_type: Valid Transition
        grounds: [state_machines.Equipment.MAINTENANCE_DUE_to_UNDER_MAINTENANCE]
        distinguishing_aspect: "start-maintenance on a MAINTENANCE_DUE asset moves it to UNDER_MAINTENANCE."
        test_recipe:
          setup: ["Equipment in MAINTENANCE_DUE (reached via a 44h completed visit, age 24)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm8@x.com", full_name: "SM Eight", service_zip: "30008" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "P8", lawn_area_sqft: 1000, zip: "30008" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "SUMMER", contract_price_cents: 10000, term_months: 4 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "30008", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew SM8", home_route_id: "${route_id}" }
              as: DispatchManager
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-SM8", equipment_type: "MOWER", age_months: 24, assigned_route_id: "${route_id}" }
              as: DispatchManager
              captures: { eq_id: $.data.id }
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "LAWN", runtime_hours: 44 }
              as: DispatchManager
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/dispatch"
              payload: {}
              as: DispatchManager
            - call: "POST /visits/${v_id}/complete"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /equipment/${eq_id}/start-maintenance"
              payload: {}
              as: DispatchManager
              captures: { estatus: $.data.status }
          assert:
            - "Equipment.${eq_id}.status == UNDER_MAINTENANCE"

  # =====================================================================
  - section: calculations
    instances:
      - name: snow_surcharge_floor_whole_inches
        claim_type: Correct Result
        grounds: [calculations.visit_surcharge, entities.ServiceVisit.fields.surcharge_cents]
