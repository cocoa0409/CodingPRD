              as: OpsPlanner
              captures: { rdg: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3801", seat_capacity: 20, is_ada_accessible: false, odometer_km: 900, service_interval_km: 20000 }
              as: FleetManager
              captures: { vdg: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Degraded Driver", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { ddg: $.data.id }
            - call: "POST /routes/${rdg}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rdg}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tdg: "$.data[0].id" }
            - call: "POST /trips/${tdg}/assign"
