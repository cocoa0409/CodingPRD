              as: LandlordAssetManager
              as_user_id: u_landlord_negotiator
              captures: { p1_id: "$.data.id" }
            - call: "POST /ti-proposals/${p1_id}/accept"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /leases/${l_id}/escrow-deposits"
              payload: { amount_usd: 20000.00 }
              as: Tenant
