              as: TeamCapAnalyst
              as_user_id: "${ba_team_id}"
              captures: { ba_txn_id: $.data.id, ba_c_id: $.data.contract_id, ba_deadline: $.data.filing_deadline_at }
            - call: "POST /physical-exams"
              payload: { player_id: "${ba_p_id}", team_id: "${ba_team_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${ba_txn_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${ba_team_id}"
              captures: { ba_ex_id: $.data.id }
            - call: "POST /physical-exams/${ba_ex_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${ba_team_id}"
              captures: { ba_expires: $.data.expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-26T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /compliance-checks/run"
              payload: { team_id: "${ba_team_id}" }
              as: LeagueOfficer
              captures: { ba_codes: $.data.violation_codes, ba_result: $.data.result, ba_status: $.data.resulting_compliance_status, ba_checked: $.data.checked_at, ba_final: $.data.final_cap_committed_cents, ba_space: $.data.cap_space_cents }
          assert:
            - "the captured ${ba_deadline} == 2026-08-12T14:00:00Z and ${ba_expires} == 2026-08-24T14:00:00Z"
            - "HTTP 201 with the captured ${ba_codes} == [] (an empty list), ${ba_result} == COMPLIANT, ${ba_status} == COMPLIANT, ${ba_checked} == 2026-08-26T14:00:00Z"
            - "Transaction.${ba_txn_id}.status == VOIDED with filed_at == null — sweep step 1"
            - "Contract.${ba_c_id}.status == VOIDED, so the captured ${ba_final} == 0 and ${ba_space} == 500000000"
            - "PhysicalExam.${ba_ex_id}.status == EXPIRED — sweep step 5 — while performed_at stays 2026-08-10T14:00:00Z"
            - "Team.${ba_team_id}.provisional_cap_committed_cents == 0, compliance_status == COMPLIANT, consecutive_noncompliant_checks == 0"
            - "Player.${ba_p_id}.roster_designation == UNROSTERED and medical_status == CLEARED"

  # ===========================================================================
  # Errors (§1.6) — every catalogue entry must be triggerable
  #
  # Already triggered by an instance in an earlier section of THIS file, so not
  # repeated here: the eleven *_NOT_FOUND codes, ERR_INVALID_REQUEST,
  # ERR_INVALID_TRANSACTION_STATE, ERR_INVALID_WAIVER_STATE,
  # ERR_INVALID_DESIGNATION_STATE, ERR_INVALID_EXAM_STATE,
  # ERR_OUTSIDE_PROCESSING_WINDOW, ERR_FILING_DEADLINE_PASSED,
  # ERR_CLEARANCE_NOT_REACHED, ERR_ROSTER_LIMIT_EXCEEDED,
  # ERR_CAP_LIMIT_EXCEEDED, ERR_PRACTICE_SQUAD_INELIGIBLE,
  # ERR_REVISION_LIMIT_EXCEEDED.
  # The three ERR_STALE_*_VERSION codes are triggered in the
  # cross_cutting_complexity_layers section below (§1.2.1 OCC rules).
  # ===========================================================================
  - section: errors
    instances:
      - name: a_write_without_a_role_header_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is checked before anything else: a filing creation whose body is entirely well formed — valid club, valid player, fresh team version — is still refused with ERR_UNAUTHENTICATED 401 purely because it carries no X-User-Role header, and no Transaction row is written."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "One club, Harbor Kings, and one player exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { un_team_id: $.data.id, un_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { un_p_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { team_id: "${un_team_id}", player_id: "${un_p_id}", transaction_type: "SIGNING", expected_team_version: "${un_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              captures: { un_err: $.data.error_id }
          assert:
            - "the request carries no X-User-Role and no X-User-ID header"
            - "the captured ${un_err} == ERR_UNAUTHENTICATED with HTTP 401 — priority 1 fires even though the body itself is faultless and would have been accepted with a role header"
            - "COUNT(Transaction) == 0 and Team.${un_team_id}.version == 1"

      - name: a_player_agent_cannot_open_a_club_filing
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
          - rbac.TeamCapAnalyst.exclusive_operations
        distinguishing_aspect: "POST /transactions is exclusive to TeamCapAnalyst, so a PlayerAgent — a role that exists and is authenticated — is refused with ERR_UNAUTHORIZED 403 before the body is examined."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "One club and one player exist; the player's agent authenticates as PlayerAgent with X-User-ID equal to the player's id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { ua_team_id: $.data.id, ua_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { ua_p_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { team_id: "${ua_team_id}", player_id: "${ua_p_id}", transaction_type: "SIGNING", expected_team_version: "${ua_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: PlayerAgent
              as_user_id: "${ua_p_id}"
              captures: { ua_err: $.data.error_id }
          assert:
            - "the captured ${ua_err} == ERR_UNAUTHORIZED with HTTP 403"
            - "COUNT(Transaction) == 0, COUNT(Contract) == 0"
            - "Team.${ua_team_id}.version == 1 and provisional_cap_committed_cents == 0"

      - name: a_peer_clubs_analyst_cannot_file_another_clubs_filing
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_ACTOR_SCOPE_VIOLATION]
          - rbac.TeamCapAnalyst.identity
        distinguishing_aspect: "The actor holds the right role but the wrong club identity: Basin Otters' analyst files a filing whose Transaction.team_id is Harbor Kings, so priority 5 answers ERR_ACTOR_SCOPE_VIOLATION 403 — a different failure from the role refusal above."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Two clubs: Harbor Kings (rank 1) and Basin Otters (rank 2)."
            - "Harbor Kings has a DRAFT SIGNING filing for Ray Alder."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
