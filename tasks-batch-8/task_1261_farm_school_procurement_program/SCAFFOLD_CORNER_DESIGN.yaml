            - { call: "POST /f2s/kitchens", payload: { name: "Lincoln ES" }, as: DistrictProgramAdmin, captures: { kit: $.data.id } }
            - { call: "POST /f2s/receiving-windows", payload: { kitchen_id: "${kit}", weekday: "MON", start_minute: 480, end_minute: 720, capacity_deliveries: 3 }, as: KitchenManager, as_user_id: "${kit}", captures: { win: $.data.id } }
