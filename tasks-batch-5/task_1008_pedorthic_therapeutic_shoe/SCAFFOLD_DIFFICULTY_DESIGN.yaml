              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FITTER_DOUBLE_BOOKED"

      - name: gait_lab_aggregate_capacity_overlap
        grounds:
          - validations[priority=17]
          - errors[ERR_GAIT_LAB_AT_CAPACITY]
          - entities.GaitLab.fields.concurrent_capacity
        distinguishing_aspect: |
          GaitLab interval semantics = aggregate capacity count: with capacity 1 and
          one overlapping GAIT appointment on a DIFFERENT fitter (so no fitter
          conflict), a second overlapping GAIT booking is rejected purely on
          lab-occupancy count — distinct from the fitter buffer rule and a
          different resource.
        test_recipe:
          setup:
            - "Fitters F1 and F2; gait lab L capacity 1; a SCHEDULED GAIT appointment for F1 in L 10:00-11:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Cap Cust", date_of_birth: "1966-06-06" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "G One" }
              as: StoreManager
              captures: { f1_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "G Two" }
              as: StoreManager
              captures: { f2_id: $.data.id }
            - call: "POST /gait-labs"
              payload: { name: "Lab G", concurrent_capacity: 1 }
              as: StoreManager
              captures: { lab_id: $.data.id }
            - call: "POST /appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${f1_id}", gait_lab_id: "${lab_id}", appointment_type: "GAIT", start_time: "2026-07-02T10:00:00Z", end_time: "2026-07-02T11:00:00Z" }
              as: Fitter
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${f2_id}", gait_lab_id: "${lab_id}", appointment_type: "GAIT", start_time: "2026-07-02T10:30:00Z", end_time: "2026-07-02T11:30:00Z" }
              as: Fitter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GAIT_LAB_AT_CAPACITY"

  # ===================================================================
  # Rule 9 — compensating-action invariants across conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_availability_conserved_reserve_release
        grounds:
          - state_machines.Sale.fulfillment_PENDING_to_CANCELLED
          - entities.InventoryItem.fields.quantity_reserved
          - entities.InventoryItem.fields.quantity_available
          - entities.InventoryItem.fields.quantity_on_hand
        distinguishing_aspect: |
          Conserved quantity = quantity_available (= on_hand - reserved). Adding a
          2-unit line reserves (available 5->3); cancelling the sale releases
          (available ->5) with on_hand unchanged at 5 — physical-stock invariant.
        test_recipe:
          setup:
            - "Inventory item on_hand 5; a PENDING sale with one ACTIVE line reserving 2 units (available now 3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Shoe Q", brand: "Vionic", category: "REGULAR", base_price_cents: 6000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 9.0, width: "D", lot_number: "Q1", quantity_on_hand: 5 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ray Reserve", date_of_birth: "1969-09-09" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Fr Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${inv_id}", quantity: 2 }
              as: Fitter
          trigger:
            - call: "POST /sales/${sale_id}/cancel"
              payload: {}
              as: Fitter
          assert:
            - "InventoryItem.${inv_id}.quantity_reserved == 0"
            - "InventoryItem.${inv_id}.quantity_available == 5"
            - "InventoryItem.${inv_id}.quantity_on_hand == 5"

      - name: medicare_annual_allowance_conserved_paid_then_void
        grounds:
          - state_machines.MedicareClaim.SUBMITTED_to_PAID
          - state_machines.MedicareClaim.PAID_to_VOIDED
          - entities.Customer.fields.medicare_pairs_claimed_ytd
          - entities.Customer.fields.medicare_deductible_remaining_cents
        distinguishing_aspect: |
          Conserved quantity = Medicare annual benefit: PAID then VOID restores
          medicare_pairs_claimed_ytd to 0 and medicare_deductible_remaining_cents
          to 25700 — a regulatory-counter invariant distinct from physical stock.
        test_recipe:
          setup:
            - "Clock 2026-07-01. A5500 fulfilled sale, COMPLETE cert; claim submitted and adjudicated PAID (pairs_ytd=1, deductible_remaining=0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Dia Shoe 9", brand: "Apex", category: "DIABETIC", base_price_cents: 32000, medicare_allowable_cents: 30000, hcpcs_code: "A5500" }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 9.0, width: "D", lot_number: "L9", quantity_on_hand: 5 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Vi Void", date_of_birth: "1943-03-03", medicare_beneficiary_id: "7MN0ZM1SQ39" }
              as: StoreManager
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "POST /fitters"
              payload: { full_name: "Fv Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "6667778889", prescribing_practitioner_npi: "0001112223", statement_date: "2026-06-01", in_person_visit_date: "2026-05-10", expected_customer_version: "${cust_v}" }
              as: BillingSpecialist
              captures: { cert_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${inv_id}", quantity: 1 }
              as: Fitter
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
            - call: "POST /medicare-claims"
              payload: { customer_id: "${cust_id}", sale_id: "${sale_id}", certification_id: "${cert_id}", hcpcs_code: "A5500", billed_amount_cents: 32000 }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /medicare-claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /medicare-claims/${claim_id}/adjudicate"
              payload: { payer_decision: "PAID" }
              as: BillingSpecialist
          trigger:
            - call: "POST /medicare-claims/${claim_id}/void"
              payload: {}
              as: BillingSpecialist
          assert:
            - "MedicareClaim.${claim_id}.status == VOIDED"
            - "Customer.${cust_id}.medicare_pairs_claimed_ytd == 0"
            - "Customer.${cust_id}.medicare_deductible_remaining_cents == 25700"
