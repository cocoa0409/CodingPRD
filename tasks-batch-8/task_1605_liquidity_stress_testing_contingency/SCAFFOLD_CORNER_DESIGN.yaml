      - name: fk_reverse_reachability_subresources_and_filters
        claim_type: fk_reverse_reachability
        grounds: ["endpoints[GET /liquidity/stress-scenarios/{id}/projection-runs]", "endpoints[GET /liquidity/ewi-metrics/{id}/readings]", "endpoints[GET /liquidity/contingency-playbooks/{id}/actions]", "endpoints[GET /liquidity/board-limits/{id}/breaches]", "endpoints[GET /liquidity/collateral-pledges]", "endpoints[GET /liquidity/playbook-actions]", "endpoints[GET /liquidity/board-limits]"]
        distinguishing_aspect: "Every FK in section 1.1 is reverse-reachable: sub-resource lists (runs, readings, actions, breaches) and filtered lists (pledges by line_id, actions by prerequisite_action_id, limits by ewi_metric_id) each return the children created above."
        test_recipe:
          setup:
            - "Scenario with one CONTRACTUAL run; metric M with one RED reading and an EWI_METRIC limit on M (breach created); line with one pledge; playbook with action a1 and action a2 (prerequisite a1)"
          setup_api_calls:
