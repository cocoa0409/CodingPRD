          setup:
            - "One institution with one APPROVED LOW_INCOME_TARGETED_POPULATION market at ami_threshold_pct 80.00 and no INVESTMENT_AREA market."
            - "Borrower A with household_income_cents 4,000,200 and area_median_income_cents 5,000,000."
