            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", asset_kind: "FACE_SCAN", capture_ref: "cap-001", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:bbb" }
              as: RightsAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/viral", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 10000000, match_confidence: 1.000 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /infringement-cases/${c_id}/triage"
              payload: { decision: "DISMISS" }
