      # ---- Instance 2 (depth >= 2): sample void -> finding_level recompute -> open_finding_count recompute -> posture
      - name: sample_void_findinglevel_openfindings_posture_depth3
        grounds:
          - state_machines.Sample.ANALYZED_to_VOIDED
          - calculations.finding_level
          - calculations.open_findings
          - calculations.project_posture
        distinguishing_aspect: |
          Voiding the sole HAZARDOUS ANALYZED sample triggers: Assessment.finding_level
          recompute HAZARDOUS->CLEAN (hop1) -> Project.open_finding_count 1->0 (hop2, caused
          by finding_level dropping out of {ELEVATED,HAZARDOUS}) -> posture recompute (hop3).
          Triggered by a DIFFERENT transition (Sample void) than instance 1 (clearance fail).
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; MOLD project; assessment with one ANALYZED AIR sample raw_count=1200 vol=100 -> concentration 12000 -> HAZARDOUS; open_finding_count == 1."
