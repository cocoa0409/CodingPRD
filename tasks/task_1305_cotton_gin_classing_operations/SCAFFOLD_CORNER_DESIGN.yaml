# =============================================================================
# §1.9 Scaffold Corner Design — Cotton Gin & Classing Operations
# Breadth coverage of every testable claim in §1.1–§1.7 not already covered by
# §1.8 (stubs mark the overlaps). All numeric asserts pre-computed from §1.3.
# =============================================================================
scaffold_corner_design:

  # ================================================== entities
  - section: entities
    instances:
      - name: grower_create_defaults_and_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.Grower.fields.credit_balance_cents, entities.Grower.fields.patronage_rate]
        distinguishing_aspect: "credit_balance_cents is computed: a client-supplied value is ignored and the response shows 0; patronage_rate defaults to 0.20 when omitted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C01", legal_name: "Default Farm", credit_balance_cents: 999999 }
              as: CoopAdmin
              captures: { g: $.data.id }
          assert:
            - "response data.credit_balance_cents == 0 (input 999999 ignored)"
            - "response data.patronage_rate == 0.20 (default applied)"
            - "GET /gin-ops/growers/${g} shows the same computed values"

      - name: module_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ModuleReceipt.fields.gross_weight_lbs, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "omitting gross_weight_lbs (source input, no default) fails with ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["grower exists"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C02", legal_name: "Req Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-1", tare_weight_lbs: 1000, moisture_pct: 9.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400; no module persisted for ticket T-1"

      - name: ledger_entry_has_no_version_field
        claim_type: immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry is append-only (common_fields false): responses carry id and created_at but no version/updated_at, and no update or delete endpoint exists."
        test_recipe:
          setup: ["grower exists"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C03", legal_name: "Ledger Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /gin-ops/growers/${g}/ledger-adjustments"
              payload: { season: "2026", amount_cents: 250, memo: "opening correction" }
              as: CoopAccountant
              captures: { e: $.data.id }
          assert:
            - "response data has keys id, created_at, grower_id, season, entry_type, amount_cents, memo — and no version or updated_at key"
            - "LedgerEntry.${e}.entry_type == ADJUSTMENT and amount_cents == 250"

      - name: resource_not_found_matrix_returns_per_resource_404
        claim_type: not_found
        grounds: ["errors[ERR_GROWER_NOT_FOUND]", "errors[ERR_MODULE_NOT_FOUND]", "errors[ERR_BALE_NOT_FOUND]", "errors[ERR_GIN_SHIFT_NOT_FOUND]", "errors[ERR_WAREHOUSE_NOT_FOUND]", "errors[ERR_WAREHOUSE_RECEIPT_NOT_FOUND]", "errors[ERR_LOAN_PLEDGE_NOT_FOUND]", "errors[ERR_SETTLEMENT_NOT_FOUND]", "errors[ERR_SHIPPING_ORDER_NOT_FOUND]", "errors[ERR_GRADE_SCHEDULE_NOT_FOUND]", "errors[ERR_LEDGER_ENTRY_NOT_FOUND]"]
        distinguishing_aspect: "every single-resource GET with a well-formed but absent UUID returns 404 with the resource-specific error_id, not a generic one."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /gin-ops/growers/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /gin-ops/modules/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /gin-ops/bales/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /gin-ops/gin-shifts/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /gin-ops/warehouses/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /gin-ops/warehouse-receipts/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /gin-ops/loan-pledges/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /gin-ops/settlements/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e8: $.data.error_id }
            - call: "GET /gin-ops/shipping-orders/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e9: $.data.error_id }
            - call: "GET /gin-ops/grade-schedules/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e10: $.data.error_id }
            - call: "GET /gin-ops/ledger-entries/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { e11: $.data.error_id }
          assert:
            - "e1 ERR_GROWER_NOT_FOUND; e2 ERR_MODULE_NOT_FOUND; e3 ERR_BALE_NOT_FOUND; e4 ERR_GIN_SHIFT_NOT_FOUND; e5 ERR_WAREHOUSE_NOT_FOUND"
            - "e6 ERR_WAREHOUSE_RECEIPT_NOT_FOUND; e7 ERR_LOAN_PLEDGE_NOT_FOUND; e8 ERR_SETTLEMENT_NOT_FOUND; e9 ERR_SHIPPING_ORDER_NOT_FOUND; e10 ERR_GRADE_SCHEDULE_NOT_FOUND; e11 ERR_LEDGER_ENTRY_NOT_FOUND (all http 404)"

      - name: classing_results_list_contains_active_and_superseded
        claim_type: listing
        grounds: [entities.ClassingResult.fields.status, state_machines.ClassingResult.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "after a reclass, the bale's classing-results list retains both results: exactly one ACTIVE (the newer) and one SUPERSEDED (the older)."
        test_recipe:
          setup:
            - "grade schedule 31-3 (+265 pts) covering 2026; grower with one 500-lb bale classed once"
          setup_api_calls:
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "31-3", premium_discount_points: 265, loan_rate_points: 5450, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C04", legal_name: "List Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-CL" }
              as: GinOperator
              captures: { s: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-CL", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m: $.data.id }
            - call: "POST /gin-ops/modules/${m}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-CL1", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${m}/bales"
              as: ClassingClerk
              captures: { b: "$.data[0].id", bv: "$.data[0].version" }
            - call: "POST /gin-ops/bales/${b}/classing-results"
              payload: { grade_code: "31-3", micronaire: 4.0, strength_gpt: 28.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${bv}" }
              as: ClassingClerk
              captures: { cr1: $.data.id }
            - call: "GET /gin-ops/bales/${b}"
              as: ClassingClerk
              captures: { bv2: $.data.version }
          trigger:
            - call: "POST /gin-ops/bales/${b}/classing-results"
              payload: { grade_code: "31-3", micronaire: 4.1, strength_gpt: 28.5, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-20T00:00:00Z", expected_bale_version: "${bv2}" }
              as: ClassingClerk
              captures: { cr2: $.data.id }
            - call: "GET /gin-ops/bales/${b}/classing-results"
              as: ClassingClerk
          assert:
            - "list contains exactly 2 results: ${cr1} with status SUPERSEDED and ${cr2} with status ACTIVE"
            - "Bale.${b}.classing_status == CLASSED and quality_points reflects only ${cr2} (mic 4.1 -> 265 + 25 + 0 = 290)"

  # ================================================== state_machines
  - section: state_machines
    instances:
      - name: module_initial_state_and_estimate_on_create
        claim_type: initial_state
        grounds: [state_machines.ModuleReceipt, calculations.estimated_turnout, calculations.module_net_weight]
        distinguishing_aspect: "a created module starts in RECEIVED with computed net_weight_lbs 20000, est_lint_lbs 7520 (pct 0.376 after a 0.004 moisture adjustment), est_seed_lbs 11000."
        test_recipe:
          setup: ["grower exists"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C10", legal_name: "Init Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-I", gross_weight_lbs: 22000, tare_weight_lbs: 2000, moisture_pct: 9.0, foreign_matter_pct: 3.0 }
              as: GinOperator
              captures: { m: $.data.id }
          assert:
            - "ModuleReceipt.${m}.status == RECEIVED; gin_shift_id is null; reconciled_seed_lbs is null; ginned_at is null"
            - "net_weight_lbs == 20000; est_lint_lbs == 7520; est_seed_lbs == 11000"

      - name: module_conditioning_cycle_recomputes_turnout
        claim_type: valid_transition
        grounds: [state_machines.ModuleReceipt.RECEIVED_to_CONDITIONING, state_machines.ModuleReceipt.CONDITIONING_to_RECEIVED, calculations.estimated_turnout]
        distinguishing_aspect: "the RECEIVED -> CONDITIONING -> RECEIVED cycle re-reads moisture each hop and recomputes est_lint_lbs: 4320 at 14.0%, still 4320 at 13.0% (self-loop, cap 0.020), 4488 at 9.5%."
        test_recipe:
          setup: ["grower; module net 12000 created with moisture 14.0, fm 2.0"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C11", legal_name: "Dryer Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-D", gross_weight_lbs: 13000, tare_weight_lbs: 1000, moisture_pct: 14.0, foreign_matter_pct: 2.0 }
              as: GinOperator
              captures: { m: $.data.id }
          trigger:
            - call: "POST /gin-ops/modules/${m}/condition"
              payload: { moisture_pct: 14.0 }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/condition"
              payload: { moisture_pct: 13.0 }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/condition"
              payload: { moisture_pct: 9.5 }
              as: GinOperator
          assert:
            - "after create: status RECEIVED, est_lint_lbs == 4320 (pct capped-adjusted 0.36)"
            - "condition(14.0): status CONDITIONING; condition(13.0): still CONDITIONING (self-loop, moisture > 12.0), est_lint_lbs == 4320"
            - "condition(9.5): status RECEIVED, est_lint_lbs == 4488 (pct 0.374); moisture_pct == 9.5; version incremented on every hop"

      - name: module_invalid_transitions_from_received_and_queued
        claim_type: invalid_transition
        grounds: ["errors[ERR_MODULE_NOT_GINNABLE]", "errors[ERR_MODULE_NOT_COMPLETABLE]", "errors[ERR_MODULE_NOT_CONDITIONABLE]"]
        distinguishing_aspect: "start-ginning from RECEIVED, complete-ginning from QUEUED, and condition from QUEUED are each rejected with the transition-specific error."
        test_recipe:
          setup: ["grower; shift OPEN; module M queued"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C12", legal_name: "Invalid Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-IV" }
              as: GinOperator
              captures: { s: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-IV", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m: $.data.id }
          trigger:
            - call: "POST /gin-ops/modules/${m}/start-ginning"
              as: GinOperator
              captures: { e1: $.data.error_id }
            - call: "POST /gin-ops/modules/${m}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-IV1", net_weight_lbs: 500} ] }
              as: GinOperator
              captures: { e2: $.data.error_id }
            - call: "POST /gin-ops/modules/${m}/condition"
              payload: { moisture_pct: 10.0 }
              as: GinOperator
              captures: { e3: $.data.error_id }
          assert:
            - "e1 == ERR_MODULE_NOT_GINNABLE (start from RECEIVED); e2 == ERR_MODULE_NOT_COMPLETABLE (complete from QUEUED); e3 == ERR_MODULE_NOT_CONDITIONABLE (condition from QUEUED); all http 409"
            - "ModuleReceipt.${m}.status == QUEUED after all three rejections (no partial state drift)"

      - name: module_reject_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ModuleReceipt, "errors[ERR_MODULE_NOT_REJECTABLE]", "errors[ERR_MODULE_NOT_QUEUABLE]"]
        distinguishing_aspect: "REJECTED is terminal: queue and condition on a rejected module fail; reject itself is only legal from RECEIVED/CONDITIONING (a GINNED module rejects with ERR_MODULE_NOT_REJECTABLE)."
        test_recipe:
          setup: ["grower; shift; module M1 rejected from RECEIVED; module M2 fully ginned"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C13", legal_name: "Reject Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-RJ" }
              as: GinOperator
              captures: { s: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-R1", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-2", module_tag: "MT-R2", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m2: $.data.id }
            - call: "POST /gin-ops/modules/${m2}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m2}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m2}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-R2", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
          trigger:
            - call: "POST /gin-ops/modules/${m1}/reject"
              payload: { reason: "plastic contamination" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
              captures: { e1: $.data.error_id }
            - call: "POST /gin-ops/modules/${m1}/condition"
              payload: { moisture_pct: 10.0 }
              as: GinOperator
              captures: { e2: $.data.error_id }
            - call: "POST /gin-ops/modules/${m2}/reject"
              payload: { reason: "too late" }
              as: GinOperator
              captures: { e3: $.data.error_id }
          assert:
            - "M1: REJECTED; queue -> e1 ERR_MODULE_NOT_QUEUABLE; condition -> e2 ERR_MODULE_NOT_CONDITIONABLE (terminal lockdown)"
            - "M2 (GINNED): reject -> e3 ERR_MODULE_NOT_REJECTABLE; M2 stays GINNED"

      - name: shift_close_blocked_while_module_ginning
        claim_type: precondition_enforcement
        grounds: [state_machines.GinShift.OPEN_to_CLOSED, "errors[ERR_MODULES_STILL_GINNING]"]
        distinguishing_aspect: "a shift cannot close while any of its modules is GINNING, regardless of whether the scale numbers balance."
        test_recipe:
          setup: ["grower; shift with one module in GINNING"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C14", legal_name: "Close Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-CB" }
              as: GinOperator
              captures: { s: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-CB", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m: $.data.id }
            - call: "POST /gin-ops/modules/${m}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/start-ginning"
              as: GinOperator
          trigger:
            - call: "POST /gin-ops/gin-shifts/${s}/close"
              payload: { actual_lint_scale_lbs: 0, actual_seed_scale_lbs: 0, waste_lbs: 0 }
              as: GinOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MODULES_STILL_GINNING, http 409; GinShift.${s}.status stays OPEN"

      - name: shift_state_gates_for_reconcile_and_sale
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_SHIFT_NOT_CLOSED]", "errors[ERR_SHIFT_NOT_RECONCILED]", state_machines.GinShift]
        distinguishing_aspect: "reconcile requires CLOSED and seed sale requires RECONCILED — each upstream state gates its downstream operation with a distinct error."
        test_recipe:
          setup: ["empty OPEN shift, then closed empty (0 = 0+0+0)"]
          setup_api_calls:
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-SG" }
              as: GinOperator
              captures: { s: $.data.id }
          trigger:
            - call: "POST /gin-ops/gin-shifts/${s}/reconcile"
              as: GinOperator
              captures: { e1: $.data.error_id }
            - call: "POST /gin-ops/gin-shifts/${s}/close"
              payload: { actual_lint_scale_lbs: 0, actual_seed_scale_lbs: 0, waste_lbs: 0 }
              as: GinOperator
            - call: "POST /gin-ops/seed-sales"
              payload: { gin_shift_id: "${s}", buyer_name: "Early Mill", price_cents_per_lb: 20 }
              as: CoopAccountant
              captures: { e2: $.data.error_id }
          assert:
            - "reconcile from OPEN -> e1 ERR_SHIFT_NOT_CLOSED (409)"
            - "close of an empty shift succeeds (0 == 0+0+0): status CLOSED"
            - "seed sale from CLOSED -> e2 ERR_SHIFT_NOT_RECONCILED (409)"

      - name: shift_closed_rejects_queue_and_start
        claim_type: invalid_transition
        grounds: ["errors[ERR_SHIFT_NOT_OPEN]", state_machines.ModuleReceipt.RECEIVED_to_QUEUED, state_machines.ModuleReceipt.QUEUED_to_GINNING]
        distinguishing_aspect: "a CLOSED shift accepts neither new queued modules nor start-ginning on already-queued ones — both fail with ERR_SHIFT_NOT_OPEN."
        test_recipe:
          setup: ["grower; shift; module M1 queued, then shift closed empty; module M2 still RECEIVED"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C15", legal_name: "Late Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-LT" }
              as: GinOperator
              captures: { s: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-L1", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-2", module_tag: "MT-L2", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m2: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
            - call: "POST /gin-ops/gin-shifts/${s}/close"
              payload: { actual_lint_scale_lbs: 0, actual_seed_scale_lbs: 0, waste_lbs: 0 }
              as: GinOperator
          trigger:
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
              captures: { e1: $.data.error_id }
            - call: "POST /gin-ops/modules/${m2}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
              captures: { e2: $.data.error_id }
          assert:
            - "e1 == ERR_SHIFT_NOT_OPEN (start-ginning into CLOSED shift); e2 == ERR_SHIFT_NOT_OPEN (queue into CLOSED shift); both 409"
            - "M1 stays QUEUED, M2 stays RECEIVED"

      - name: seed_sale_second_sale_for_shift_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_SHIFT_ALREADY_SOLD]", calculations.seed_proceeds_credit]
        distinguishing_aspect: "at most one SeedSale per shift: the first sale posts the full pool; the second attempt fails with ERR_SHIFT_ALREADY_SOLD and posts nothing."
        test_recipe:
          setup: ["grower; shift with one module (net 10000, bale 1000 lbs) closed (lint 1000, seed 8000, waste 1000) and reconciled"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
