          assert:
            - "captured err == ERR_FORBIDDEN, HTTP 403"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_assessment_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assessment-create-stale-risk]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Sequential OCC: after a successful INHERENT assessment advances Risk.version, a second assessment carrying the pre-mutation version is rejected 412 — no wall-clock or simultaneity involved."
        test_recipe:
          setup: ["category; risk IDENTIFIED at version 2 (created v1, submit v2); a first INHERENT assessment succeeds with expected version 2 -> v3"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "OCC1" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v_obs: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v_obs}" }, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v_obs}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_STALE_VERSION, HTTP 412 (risk.version advanced to 3 by the first assessment; the client's observed version 2 is stale)"

      - name: occ_stale_plan_create_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-risk]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second OCC rule on a different write endpoint: two sequential plan creates against the same observed risk version — the first succeeds (bumps version), the second with the stale version fails 412."
        test_recipe:
          setup: ["category; risk ASSESSED at version v_obs"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "OCC2" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1", treatment_budget_cents: 500000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 2, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v_obs: $.data.version } }
          trigger:
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "PA", budget_cents: 10000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v_obs}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { pa: $.data.id } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "PB", budget_cents: 10000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v_obs}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
          assert:
            - "First create succeeds: TreatmentPlan.${pa} exists with status PROPOSED"
            - "Second create with same observed version: captured err == ERR_STALE_VERSION, HTTP 412"

      - name: attest_effectiveness_reconciles_residual_and_breach
        claim_type: derived_field_reconciliation
        grounds: ["calculations.residual_scoring", "calculations.appetite_breach_evaluation", "state_machines.Control.UNDER_REVIEW_to_ACTIVE"]
        distinguishing_aspect: "Derived-field reconciliation on a cross-entity write: attesting a LOWER effectiveness (0.8 -> 0.4) recomputes the mapped risk's residual (4 -> 12) and opens a breach against tolerance 10 — the risk row changes as a side effect of a control-row mutation."
        test_recipe:
          setup: ["category with APPROVED appetite tolerance 10 cap 20; risk inherent 20; control eff 0.8 mapped w 1.0 ACTIVE; residual assessed = 4 (no breach)"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "ATR" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 10, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app_id: $.data.id } }
            - { call: "POST /appetite-statements/${app_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "C", effectiveness_pct: 0.8 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ctl: $.data.id } }
            - { call: "POST /controls/${ctl}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${ctl}", coverage_weight: 1.0 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { mid: $.data.id } }
            - { call: "POST /control-mappings/${mid}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls/${ctl}/review", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
          trigger:
            - { call: "POST /controls/${ctl}/attest", payload: { effectiveness_pct: 0.4 }, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}/tolerance-breaches", as: RiskOwner, as_user_id: "user_owner_1", captures: { bid: "$.data[0].id" } }
          assert:
            - "Risk.${risk_id}.residual_score == 12 (ceil(20 * (1 - 0.40)))"
            - "ToleranceBreach.${bid}.status == OPEN and residual_at_breach == 12 (12 >= tolerance 10)"

      - name: kri_normal_observation_clears_alert_but_priority_ratchet_stays
        claim_type: cascading_side_effects
        grounds: ["state_machines.KRI.ACTIVE_to_ACTIVE", "entities.TreatmentPlan.fields.priority"]
        distinguishing_aspect: "Cascade asymmetry: a RED observation sets kri_alert and ratchets plan priority to URGENT; a later NORMAL observation clears kri_alert but does NOT lower plan priority (ratchet semantics pinned)."
        test_recipe:
          setup: ["category; risk TREATMENT with APPROVED plan; ACTIVE KRI ABOVE 50/75 min 0; RED observation already applied"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "RAT" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1", treatment_budget_cents: 500000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v3: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "P", budget_cents: 100000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v3}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /risks/${risk_id}/enter-treatment", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /kris", payload: { category_id: "${cat_id}", name: "K", direction: "ABOVE", amber_threshold: 50, red_threshold: 75, min_observation_interval_days: 0 }, as: RiskManager, as_user_id: "user_rm_1", captures: { kri_id: $.data.id } }
            - { call: "POST /kris/${kri_id}/activate", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 76, observed_at: "2026-08-01T01:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 10, observed_at: "2026-08-01T02:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /treatment-plans/${plan_id}", as: RiskManager, as_user_id: "user_rm_1" }
          assert:
            - "Risk.${risk_id}.kri_alert == false (cleared by NORMAL observation)"
            - "TreatmentPlan.${plan_id}.priority == URGENT (ratchet: RED-set priority persists)"

