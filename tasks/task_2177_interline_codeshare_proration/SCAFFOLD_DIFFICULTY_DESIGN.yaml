              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/carriers/${bb}/suspend"
              payload: {}
              as: ClearinghouseOperator
          trigger:
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
          assert:
            - "HTTP status 409 with data.error_id == ERR_OPERATING_CARRIER_SUSPENDED"
            - "Coupon.${c1}.coupon_status == OPEN and Coupon.${c1}.flown_at is null"
            - "Coupon.${c1}.ffp_miles_awarded == 0 and Coupon.${c1}.ffp_tier == NONE"
            - "Carrier.${bb}.period_accrued_miles == 0 and Carrier.${bb}.period_ffp_cost_estimate_minor == 0"
            - "Carrier.${aa}.status == ACTIVE — the acting carrier's own standing was never the problem"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: agreement_windows_are_closed_closed_so_shared_end_day_conflicts
        grounds:
          - validations[priority=19]
          - state_machines.ProrateAgreement.DRAFT_to_ACTIVE
          - errors[ERR_AGREEMENT_PERIOD_OVERLAP]
          - entities.ProrateAgreement.fields.effective_to
        distinguishing_aspect: |
          Interval semantics A — CLOSED-CLOSED on the ProrateAgreement resource keyed by the
          ordered carrier pair: the second agreement starts on 2026-08-31, the exact last day
          of the first, and that single shared day is a conflict. The two windows must be
          separated by a clear calendar day.
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE."
            - "An ACTIVE SPA_FLAT agreement AA->BB in USD covering 2026-08-01..2026-08-31."
            - "A second DRAFT agreement AA->BB in USD covering 2026-08-31..2026-09-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/prorate-agreements"
              payload: { issuing_carrier_id: "${aa}", partner_carrier_id: "${bb}", agreement_type: "SPA_FLAT", settlement_currency: "USD", effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { ag1: $.data.id }
            - call: "POST /interline/prorate-agreements/${ag1}/activate"
              payload: {}
              as: ClearinghouseOperator
            - call: "POST /interline/prorate-agreements"
              payload: { issuing_carrier_id: "${aa}", partner_carrier_id: "${bb}", agreement_type: "SPA_PERCENT", settlement_currency: "USD", effective_from: "2026-08-31", effective_to: "2026-09-30" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { ag2: $.data.id }
          trigger:
            - call: "POST /interline/prorate-agreements/${ag2}/activate"
              payload: {}
              as: ClearinghouseOperator
          assert:
            - "HTTP status 409 with data.error_id == ERR_AGREEMENT_PERIOD_OVERLAP"
            - "ProrateAgreement.${ag2}.status == DRAFT and suspension_reason == NONE"
            - "ProrateAgreement.${ag1}.status == ACTIVE — the incumbent is untouched"
            - "GET /interline/prorate-agreements with issuing_carrier_id ${aa} and status ACTIVE returns exactly 1 row"

      - name: settlement_period_windows_are_half_open_so_shared_boundary_is_legal
        grounds:
          - validations[priority=20]
          - entities.SettlementPeriod.fields.period_start
          - entities.SettlementPeriod.fields.period_end
          - errors[ERR_PERIOD_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics B on a different resource entity — HALF-OPEN on the
          SettlementPeriod calendar: a period starting at the exact instant the previous one
          ends is accepted (201), whereas a window that properly intersects an existing one
          is refused. The identical adjacency that conflicts for agreements is legal here.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "One OPEN settlement period 2026-08-P1 spanning [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-09-P1", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", submission_deadline: "2026-10-05T00:00:00Z", rate_fixing_date: "2026-10-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p2: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P2", period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", submission_deadline: "2026-09-20T00:00:00Z", rate_fixing_date: "2026-09-21T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
          assert:
            - "The first trigger call returns HTTP 201 and SettlementPeriod.${p2}.status == OPEN, because period_start 2026-09-01T00:00:00Z equals the incumbent's exclusive period_end"
            - "The second trigger call returns HTTP 409 with data.error_id == ERR_PERIOD_WINDOW_OVERLAP, because 2026-08-15T00:00:00Z < 2026-09-01T00:00:00Z and 2026-08-01T00:00:00Z < 2026-09-15T00:00:00Z"
            - "Exactly two SettlementPeriod rows exist afterwards, with period_code 2026-08-P1 and 2026-09-P1"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: void_proration_conserves_the_ticket_fare_identity
        grounds:
          - state_machines.Ticket.FINAL_to_UNPRORATED
          - calculations.coupon_revenue_allocation
          - entities.Ticket.fields.unallocated_residual_minor
          - entities.Coupon.fields.allocated_amount_minor
