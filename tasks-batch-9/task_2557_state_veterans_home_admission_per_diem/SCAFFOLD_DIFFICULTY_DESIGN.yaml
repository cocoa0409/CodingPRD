  - rule_id: compensating_invariant
    instances:
      - name: trust_fund_reversal_conserves_balance_exactly
        grounds:
          - calculations.trust_fund_running_balance
          - endpoints.POST_/svh/trust-fund-transactions/{id}/reverse
          - entities.TrustFundTransaction.fields.signed_amount_cents
          - entities.TrustFundTransaction.fields.reversed
          - validations[priority=65,ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Money is the conserved quantity: posting a 12000 WITHDRAWAL and then reversing it must
          return Resident.trust_fund_balance_cents to exactly 50000, its pre-withdrawal value, with
          the compensating row carrying signed_amount_cents +12000 and the original flagged
          reversed. No row is deleted or mutated in amount, so the invariant
          balance == sum(signed_amount_cents) holds over all four observations. A reversal
          implemented as a delete, or as a second negative row, breaks a different one of the
          asserts below.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with personal_needs_allowance_monthly_cents 9000 and one CERTIFIED NURSING CareUnit."
            - "One Resident admitted 2026-08-01 with an empty trust fund (trust_fund_balance_cents 0) and no census run yet, so no PNA_CREDIT rows exist."
            - "Two distinct business-office users, bom-1 and bom-2, because a reversal may not be posted by the recorder of the original."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Bemidji State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
