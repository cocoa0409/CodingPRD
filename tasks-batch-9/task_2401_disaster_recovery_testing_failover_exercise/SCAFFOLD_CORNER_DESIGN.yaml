      - name: exercise_parallel_axes_change_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - entities.Exercise.fields.data_state
          - entities.Exercise.fields.failback_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / exercise_three_axes_advance_independently_then_join_at_close
          rationale: "That §1.8 instance drives all three axes and asserts, call by call, that each moves without disturbing the other two, then asserts the CLOSE join."

      - name: finding_cycle_returns_to_a_previously_occupied_state
        claim_type: cyclic
        grounds:
          - state_machines.Finding.RETEST_FAILED_to_REMEDIATION_ASSIGNED
          - entities.Finding.fields.retest_failure_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / finding_retest_failure_loops_back_to_remediation_assigned
          rationale: "That §1.8 instance closes the loop and asserts the loop counter survives re-entry at 1."

      - name: retier_cascade_reaches_children_and_only_non_terminal_ones
        claim_type: cascade_down
        grounds:
          - state_machines.Application.AGREED_to_TIER_PROPOSED
          - state_machines.RunbookStep.VALIDATED_to_INVALIDATED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_retier_invalidates_step_stales_runbook_restricts_group_reverts_schedule_releases_capacity
          rationale: "That §1.8 instance asserts all six hops and that only the step covering the re-tiered application is invalidated."

      - name: cancellation_reverses_the_capacity_reservation_without_drift
        claim_type: compensation
        grounds:
          - state_machines.Exercise.SCHEDULED_to_CANCELLED
          - calculations.site_reserved_capacity_units
        excluded_because:
          difficulty_instance: compensating_invariant / site_reserved_capacity_equals_sum_over_active_exercises_after_cancellation
          rationale: "That §1.8 instance asserts the ledger equals the sum over active exercises before and after the reversal."

      - name: evidence_submit_is_guarded_by_the_exercises_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.EvidencePackage.DRAFT_to_SUBMITTED
          - validations.priority_40
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / evidence_submission_depends_on_exercise_closed
          rationale: "That §1.8 instance rejects the guarded transition at FAILOVER_COMPLETE and accepts it at CLOSED."

      - name: freeze_cascade_releases_capacity_only_for_scheduled_exercises
        claim_type: conditional_cascade
        grounds:
          - state_machines.RecoveryGroup.READY_to_FROZEN
          - state_machines.Exercise.SCOPED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_second_retest_failure_escalates_freezes_group_cancels_exercises_releases_capacity
          rationale: "That §1.8 instance cancels three in-scope exercises and asserts the capacity release applies only to the one that was SCHEDULED."

