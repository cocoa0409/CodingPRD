            - call: "POST /centers/${c_id}/events"
              payload: { kind: "ENTERTAINMENT_TOUR", name: "Tour Y", start_at: "2026-10-01T14:00:00Z", end_at: "2026-10-01T16:00:00Z", min_volunteers: 0, required_security_level: 2, talent_agreement_signed: false }
              as: CenterManager
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /events/${ev_id}/approve-security"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TALENT_AGREEMENT_UNSIGNED (level check passed, talent check fired)"
      - name: shift_full_on_confirm_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SHIFT_FULL]"
          - state_machines.ShiftAssignment.ASSIGNED_to_CONFIRMED
        distinguishing_aspect: "Confirm gate at exact capacity: with capacity 1 and confirmed_count already 1 (FILLED), the second volunteer's confirm is rejected while her assignment stays ASSIGNED."
        test_recipe:
          setup: ["Center with ACTIVE agreement; volunteers v1, v2 cleared; shift tomorrow capacity 1; both ASSIGNED; v1 CONFIRMED (shift FILLED)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Dalet2 Center", airport_code: "MLI", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 300, utilities_included: true, access_terms: "badge", security_level: 1, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /volunteers"
              payload: { full_name: "V Full1", email: "vf1@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v1_id: $.data.id, v1_v: $.data.version }
            - call: "POST /volunteers/${v1_id}/screenings"
              payload: { expected_volunteer_version: "${v1_v}" }
              as: CenterManager
              captures: { s1_id: $.data.id }
            - call: "POST /screenings/${s1_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s1_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /volunteers"
              payload: { full_name: "V Full2", email: "vf2@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v2_id: $.data.id, v2_v: $.data.version }
            - call: "POST /volunteers/${v2_id}/screenings"
              payload: { expected_volunteer_version: "${v2_v}" }
              as: CenterManager
              captures: { s2_id: $.data.id }
            - call: "POST /screenings/${s2_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s2_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /centers/${c_id}/shifts"
              payload: { start_at: "2026-09-02T08:00:00Z", end_at: "2026-09-02T12:00:00Z", role_required: "DESK", capacity: 1 }
              as: CenterManager
              captures: { sh_id: $.data.id }
            - call: "POST /shifts/${sh_id}/assignments"
              payload: { volunteer_id: "${v1_id}" }
              as: CenterManager
              captures: { as1_id: $.data.id }
            - call: "POST /shifts/${sh_id}/assignments"
              payload: { volunteer_id: "${v2_id}" }
              as: CenterManager
              captures: { as2_id: $.data.id }
            - call: "POST /shift-assignments/${as1_id}/confirm"
              as: Volunteer
              as_user_id: "${v1_id}"
          trigger:
            - call: "POST /shift-assignments/${as2_id}/confirm"
              as: Volunteer
              as_user_id: "${v2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second confirm rejected ERR_SHIFT_FULL (confirmed_count 1 >= capacity 1)"
            - "ShiftAssignment.${as2_id}.status == ASSIGNED (unchanged)"

      - name: event_confirm_staffing_shortfall
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STAFFING_SHORTFALL]"
          - state_machines.Event.PLANNED_to_CONFIRMED
        distinguishing_aspect: "Empty-pool selector: with no overlapping shifts at all, optimistic pledged staffing is 0 and an event needing min_volunteers 2 cannot confirm."
        test_recipe:
          setup: ["Center with ACTIVE agreement; DEPLOYMENT event 2026-09-10 10:00-12:00 min_volunteers 2; no shifts exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
