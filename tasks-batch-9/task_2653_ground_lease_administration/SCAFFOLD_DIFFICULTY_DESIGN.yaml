  - rule_id: transitive_cascade
    instances:
      - name: termination_fans_out_to_subleases_statements_certificates_then_mints_new_lease
        grounds:
          - state_machines.Lease.IN_DEFAULT_to_TERMINATED
          - state_machines.TransferRequest.ACTIVE_to_TERMINATED_BY_REVERSION
          - state_machines.LeaseholdMortgage.NOTICE_SERVED_to_NEW_LEASE_ELIGIBLE
          - state_machines.LeaseholdMortgage.NEW_LEASE_ELIGIBLE_to_NEW_LEASE_ELECTED
          - calculations.sublease_inclusion_base
          - entities.Lease.fields.predecessor_lease_id
        distinguishing_aspect: |
          One terminate call propagates four levels: notice -> Lease (both axes) -> the ACTIVE sublease,
          the SUBMITTED statement, the ISSUED certificate and the noticed mortgage -> Lease's derived
          sublease base recomputed to 0 because the sublease left ACTIVE -> and then the mortgagee's new
          lease election mints a whole new Lease row pointing back at the terminated one. Nothing in the
          chain is reachable by calling the endpoints of the affected entities directly: the sublease has
          no terminate endpoint, the statement has no void endpoint and the certificate has no revoke
          endpoint.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; two lessees (the tenant and the mortgagee's designee)."
            - "One lease with insurance filed to 2027-01-01, one RECORDED mortgage (cure_extension_days 30), one ACTIVE sublease at rent 4000001, one SUBMITTED statement and one ISSUED estoppel certificate."
            - "A UNPERMITTED_USE default notice served by acct-1, so the windows are 2026-08-31 (lessee) and 2026-09-30 (mortgagee) and no arrears are involved."
