# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  # not found
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Permit application does not exist" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "Venue does not exist" }
  - { id: ERR_CLOSURE_SCHEDULE_NOT_FOUND, http: 404, condition: "Closure schedule does not exist" }
  - { id: ERR_SEGMENT_NOT_FOUND, http: 404, condition: "Route segment does not exist in the application" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "Department review does not exist in the application" }
  - { id: ERR_COI_NOT_FOUND, http: 404, condition: "COI record does not exist in the application" }
  - { id: ERR_CONDITION_NOT_FOUND, http: 404, condition: "Permit condition does not exist in the application" }
  - { id: ERR_DEPOSIT_NOT_FOUND, http: 404, condition: "Deposit does not exist in the application" }
  - { id: ERR_DEBRIEF_NOT_FOUND, http: 404, condition: "Debrief does not exist in the application" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "Applicant does not exist" }
  # ownership / dept
  - { id: ERR_NOT_APPLICATION_OWNER, http: 403, condition: "Acting Applicant's X-User-ID != application.applicant_user_id" }
  - { id: ERR_DEPARTMENT_MISMATCH, http: 403, condition: "Acting reviewer's department does not match the review's department" }
  # state
  - { id: ERR_APPLICATION_NOT_DRAFT, http: 409, condition: "Operation requires DRAFT/REVISION_REQUESTED; application is in another state" }
  - { id: ERR_APPLICATION_NOT_UNDER_REVIEW, http: 409, condition: "Review action requires parent application in UNDER_REVIEW" }
  - { id: ERR_APPLICATION_NOT_APPROVABLE, http: 409, condition: "issue requires application in CONDITIONALLY_APPROVED" }
  - { id: ERR_APPLICATION_NOT_ISSUED, http: 409, condition: "debrief finalize requires application in ISSUED" }
  - { id: ERR_APPLICATION_NOT_CANCELLABLE, http: 409, condition: "cancel not permitted from a terminal or ISSUED state" }
  - { id: ERR_REVIEW_NOT_PENDING, http: 409, condition: "review action requires review in PENDING" }
  - { id: ERR_COI_NOT_SUBMITTED, http: 409, condition: "accept/reject requires COI in SUBMITTED" }
  - { id: ERR_CONDITION_NOT_PROPOSED, http: 409, condition: "acknowledge requires condition in PROPOSED" }
  - { id: ERR_DEBRIEF_NOT_OPEN, http: 409, condition: "finalize requires debrief in OPEN" }
  # business constraints
  - { id: ERR_ROUTE_PLAN_EMPTY, http: 409, condition: "submit-for-review with zero route segments" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "expected_attendance exceeds venue max_capacity at submit" }
  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 409, condition: "buffered venue window overlaps another non-terminal application's window on the same venue" }
  - { id: ERR_CLOSURE_CONFLICT, http: 409, condition: "route segment closure interval violates min_gap on the same closure schedule" }
  - { id: ERR_CLOSURE_SCHEDULE_SUSPENDED, http: 409, condition: "closure schedule is SUSPENDED and cannot accept new segments" }
  - { id: ERR_COI_NOT_ON_FILE, http: 409, condition: "issue requires an ACCEPTED COI meeting required_coverage_min" }
  - { id: ERR_DEPOSIT_NOT_HELD, http: 409, condition: "issue requires a HELD deposit >= deposit_required" }
  - { id: ERR_UNACKNOWLEDGED_CONDITIONS, http: 409, condition: "issue requires all mandatory conditions ACKNOWLEDGED" }
  - { id: ERR_VETO_REASON_REQUIRED, http: 422, condition: "veto without a note" }
  # fiscal / temporal
  - { id: ERR_COI_COVERAGE_INSUFFICIENT, http: 402, condition: "COI coverage_amount < required_coverage_min at accept" }
  - { id: ERR_COI_EXPIRES_BEFORE_EVENT, http: 409, condition: "COI expires_at not strictly after occupy_end at accept" }
  - { id: ERR_DEPOSIT_UNDERFUNDED, http: 402, condition: "deposit amount < deposit_required" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "end not strictly after start (occupancy or closure)" }
  # concurrency
  - { id: ERR_STALE_VENUE_VERSION, http: 412, condition: "expected_venue_version != current Venue.version at submit-for-review" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Event sponsor who files and manages applications, route plans, COI, deposit, conditions"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /permit-applications — create application (applicant_user_id = X-User-ID)"
      - "PATCH /permit-applications/{id} — edit DRAFT"
      - "POST /permit-applications/{id}/submit-for-review"
      - "POST /permit-applications/{id}/cancel"
      - "POST /permit-applications/{appId}/route-segments — add segment"
      - "POST /permit-applications/{appId}/conditions/{conditionId}/acknowledge"
      - "POST /permit-applications/{appId}/coi — submit COI"
      - "POST /permit-applications/{appId}/deposit — pay deposit"
    shared_operations:
      - "POST /applicants — register (shared with PermitOfficer)"
      - "GET reads on applications, venues, closure-schedules, route-segments, reviews, conditions, coi, deposit, invoice, debrief"

  - name: DepartmentReviewer
    description: "Police/Fire/EMS/PublicWorks reviewer; owns and acts on the DepartmentReview matching their department (X-User-ID encodes department context)"
    identity: "opaque"
    exclusive_operations:
      - "POST /permit-applications/{appId}/reviews/{reviewId}/approve"
      - "POST /permit-applications/{appId}/reviews/{reviewId}/request-changes"
      - "POST /permit-applications/{appId}/reviews/{reviewId}/veto"
      - "POST /permit-applications/{appId}/reviews/{reviewId}/log-actuals — log post-event actual hours"
      - "POST /permit-applications/{appId}/reviews/{reviewId}/conditions — propose condition"
    shared_operations:
      - "GET reads on applications, venues, closure-schedules, route-segments, reviews, conditions, coi, deposit, invoice, debrief"

  - name: PermitOfficer
    description: "Municipal permit officer; owns venues/closure-schedules, COI acceptance, issuance, debrief; segregated from filing reviews and from being the applicant"
    identity: "opaque"
    exclusive_operations:
      - "POST /venues, POST /venues/{id}/decommission"
      - "POST /closure-schedules, POST /closure-schedules/{id}/suspend"
      - "POST /permit-applications/{id}/issue"
      - "POST /permit-applications/{appId}/coi/{coiId}/accept, .../reject"
      - "POST /permit-applications/{appId}/debrief, .../debrief/{debriefId}/finalize"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /applicants — register (shared with Applicant)"
      - "GET reads on all resources"
