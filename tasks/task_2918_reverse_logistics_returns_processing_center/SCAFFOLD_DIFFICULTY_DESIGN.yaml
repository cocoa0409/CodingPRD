              captures: { wo_id: $.data.id }
            - call: "POST /refurb-work-orders/${wo_id}/start-test"
              payload: { bay_id: "${bay_id}", test_window_start_at: "2026-08-02T08:00:00Z", test_window_end_at: "2026-08-02T10:00:00Z" }
              as: RefurbTechnician
              as_user_id: "u_tech"
            - call: "POST /refurb-work-orders/${wo_id}/record-test-result"
              payload: { result: "FAIL", labor_minutes: 15 }
              as: GradingInspector
