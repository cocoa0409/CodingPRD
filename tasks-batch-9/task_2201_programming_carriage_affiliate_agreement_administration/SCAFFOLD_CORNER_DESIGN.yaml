      - name: escalator_contract_year_index_derived_from_period_not_today
        claim_type: constants_applied
        grounds:
          - calculations.agreement_effective_rate
          - calculations.subscriber_report_license_fee
          - entities.CarriageAgreement.fields.escalator_pct
          - entities.SubscriberReport.fields.rate_applied_cents_per_sub
        distinguishing_aspect: >-
          For a term starting 2025-01-01 and a 2026-06 report, elapsed_days from
          term start to 2026-06-01 is 516, so floor(516 / CONTRACT_YEAR_DAYS 365) is
          contract year index 1 and the applied rate is 40.0000 * 1.03 = 41.2000 —
          not the base 40.0000 and not the index-2 rate — giving a fee of 5,356,000
          for 130,000 subscribers.
        test_recipe:
          setup:
            - "Cliffside Telco (200,000 homes) with an executed agreement at base 40.0000 cents, escalator_pct 0.03, term 2025-01-01 → 2028-12-31."
            - "The clock stays at 2026-08-01, proving the index comes from the report's period_month and not from the current logical time."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dc_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dc_id}"
                contract_code: "CT-ESC"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.03
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ac_id: "id"
            - call: "POST /carriage/agreements/${ac_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${ac_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ac_version: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${ac_id}"
                period_month: "2026-06"
                reported_subscribers: 130000
                reported_tier: "BASIC"
                expected_agreement_version: "${ac_version}"
              as: DistributorLiaison
              as_user_id: "${dc_id}"
              captures:
                r_id: "id"
          trigger:
            - call: "POST /carriage/subscriber-reports/${r_id}/review"
              payload:
                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
          assert:
            - "response status code == 200"
            - "response body data.rate_applied_cents_per_sub == 41.2000 — contract year index 1, i.e. 40.0000 * 1.03"
            - "response body data.billable_subscribers == 130000 (reported 130,000 exceeds the 100,000 floor)"
            - "response body data.license_fee_due_cents == 5356000"
            - "GET /carriage/agreements/${ac_id} returns escalated_rate_cents_per_sub == 41.2000 and effective_rate_cents_per_sub == 41.2000 — the AGREEMENT-level stamp is computed from the clock month 2026-08 (577 elapsed days, so also index 1), independently of any report"
            - "GET /carriage/agreements/${ac_id} returns mfn_capped == false and recognized_revenue_cents == 5356000"

      - name: premium_tier_multiplier_and_placement_breach_flag
        claim_type: constants_applied
        grounds:
          - calculations.subscriber_report_license_fee
          - entities.SubscriberReport.fields.tier_placement_breach
          - entities.CarriageAgreement.fields.committed_tier
        distinguishing_aspect: >-
          A period reported on PREMIUM against a BASIC commitment applies
          TIER_MULTIPLIER 0.6 — fee 3,120,000 rather than 5,200,000 — and separately
          raises tier_placement_breach because TIER_RANK[PREMIUM] 1 is below
          TIER_RANK[BASIC] 4; the discount and the breach flag are independent
          outputs of the same call.
