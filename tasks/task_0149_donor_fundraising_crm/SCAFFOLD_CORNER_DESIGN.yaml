scaffold_corner_design:

  # =====================================================================
  # Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_donor_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Donor, endpoints]
        distinguishing_aspect: "POST /donors with full_name+email returns 201, lifecycle_status=PROSPECT, giving_status=NONE, lapse_threshold_days=365 default, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /donors"
              payload: { full_name: "New", email: "new@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
          assert:
            - "response status == 201"
            - "Donor.${dn}.lifecycle_status == PROSPECT"
            - "Donor.${dn}.giving_status == NONE"
            - "Donor.${dn}.lapse_threshold_days == 365"
            - "Donor.${dn}.version == 1"

      - name: get_donor_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Donor, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /donors/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /donors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GiftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: create_donor_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Donor.fields.email, "validations[priority=19]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /donors without email (a required source:input field) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /donors"
              payload: { full_name: "NoEmail" }
              as: GiftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: gift_computed_status_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Gift.fields.status, entities.Gift.fields.deductible_amount_cents]
        distinguishing_aspect: "POST /gifts cannot set status/deductible_amount_cents directly; server returns status=RECORDED, deductible_amount_cents=0 regardless of any client attempt."
        test_recipe:
          setup: ["OPEN campaign; donor"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Cmp", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Gd", email: "gd@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
          trigger:
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
          assert:
            - "Gift.${g}.status == RECORDED"
            - "Gift.${g}.deductible_amount_cents == 0"

      - name: create_donor_duplicate_email_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.Donor.fields.email, "validations[priority=8]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Second POST /donors with a case-insensitively duplicate email returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["donor with email dup@x.com exists"]
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "First", email: "dup@x.com" }
              as: GiftAdmin
          trigger:
            - call: "POST /donors"
              payload: { full_name: "Second", email: "DUP@X.COM" }
              as: GiftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_DUPLICATE_EMAIL"

      - name: softcredit_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.SoftCredit]
        distinguishing_aspect: "SoftCredit is common_fields:false (id+created_at only); it is never created directly and exposes no version/update endpoint — only readable via the household/gift soft-credit GETs."
        test_recipe:
          setup: ["Household FULL_TO_ALL with giver A and member B; A gives 6000 ACKNOWLEDGED"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Im", soft_credit_policy: "FULL_TO_ALL" }
              as: CampaignManager
              captures: { hh: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Ia", email: "ia@x.com", household_id: "${hh}" }
              as: GiftAdmin
              captures: { da: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Ib", email: "ib@x.com", household_id: "${hh}" }
              as: GiftAdmin
            - call: "POST /campaigns"
              payload: { name: "Imc", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /gifts"
              payload: { donor_id: "${da}", campaign_id: "${camp}", amount_cents: 6000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
          trigger:
            - call: "GET /gifts/${g}/soft-credits"
              payload: {}
              as: GiftAdmin
          assert:
            - "exactly one SoftCredit row returned with soft_credit_cents == 6000 and reversed == false"

      - name: donor_wrong_household_parent_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Donor.fields.household_id, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /donors with a non-existent household_id FK returns ERR_NOT_FOUND (404) (flat topology FK integrity)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /donors"
              payload: { full_name: "Wh", email: "wh@x.com", household_id: "00000000-0000-4000-8000-000000000000" }
              as: GiftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

  # =====================================================================
  # State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: gift_initial_state_recorded
        claim_type: Initial State
        grounds: [state_machines.Gift, entities.Gift.fields.status]
        distinguishing_aspect: "A freshly created Gift is in RECORDED."
        test_recipe:
          setup: ["OPEN campaign; donor"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Is", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Is", email: "is@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
          trigger:
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
          assert:
            - "Gift.${g}.status == RECORDED"

      - name: receipt_from_recorded_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Gift.ACKNOWLEDGED_to_RECEIPTED, "validations[priority=4]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /gifts/{id}/receipt on a RECORDED (not yet ACKNOWLEDGED) gift returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["OPEN campaign; donor; RECORDED gift"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Rc", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Rc", email: "rc@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /gifts/${g}/receipt"
              payload: {}
              as: DonorRelations
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: acknowledge_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Gift.RECORDED_to_ACKNOWLEDGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second POST /gifts/{id}/acknowledge on an already ACKNOWLEDGED gift returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["OPEN campaign; donor; gift ACKNOWLEDGED once"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Ak", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Ak", email: "ak@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
          trigger:
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: cancel_terminal_pledge_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Pledge, "validations[priority=4]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /pledges/{id}/cancel on a CANCELLED pledge returns ERR_INVALID_STATE (409) — state check precedes OCC since the pledge is terminal."
        test_recipe:
          setup: ["OPEN campaign; donor; pledge cancelled"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Tl", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Tl", email: "tl@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /pledges"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", total_amount_cents: 10000, installment_count: 2, frequency: "MONTHLY", schedule_basis: "FRONT_LOADED" }
              as: GiftAdmin
              captures: { pl: $.data.id, pver: $.data.version }
            - call: "POST /pledges/${pl}/cancel"
              payload: { expected_pledge_version: "${pver}" }
              as: GiftAdmin
              captures: { pver2: $.data.version }
          trigger:
            - call: "POST /pledges/${pl}/cancel"
              payload: { expected_pledge_version: "${pver2}" }
              as: GiftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: planned_gift_confirm_then_realize_mints_gift
        claim_type: Side Effect Execution
        grounds: [state_machines.PlannedGift.CONFIRMED_to_REALIZED, entities.PlannedGift.fields.realized_gift_id]
        distinguishing_aspect: "Realizing a CONFIRMED planned gift into an OPEN campaign creates a RECORDED Gift and sets realized_gift_id to that gift's id."
        test_recipe:
          setup: ["OPEN campaign; donor; planned gift CONFIRMED"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Pg", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Pg", email: "pg@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /planned-gifts"
              payload: { donor_id: "${dn}", vehicle: "BEQUEST", expected_amount_cents: 500000 }
              as: DonorRelations
              captures: { pg: $.data.id }
            - call: "POST /planned-gifts/${pg}/confirm"
              payload: {}
              as: DonorRelations
          trigger:
            - call: "POST /planned-gifts/${pg}/realize"
              payload: { campaign_id: "${camp}", realized_amount_cents: 500000 }
              as: DonorRelations
              captures: { rg: $.data.realized_gift_id }
          assert:
            - "PlannedGift.${pg}.status == REALIZED"
            - "PlannedGift.${pg}.realized_gift_id is non-null and references a Gift in status RECORDED with amount_cents == 500000"

      - name: gift_refund_denies_unpaid_match_cross_entity
        claim_type: Cross-entity
        grounds: [state_machines.Gift.ACKNOWLEDGED_to_REFUNDED, state_machines.MatchClaim.SUBMITTED_to_DENIED]
        distinguishing_aspect: "Refunding a gift with a SUBMITTED match cascades the claim to DENIED (cross-entity side effect Gift->MatchClaim)."
        test_recipe:
          setup: ["OPEN campaign; donor with employer; gift 100000 ACKNOWLEDGED; SUBMITTED match"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Xd", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /employers"
              payload: { name: "Xe", match_ratio: 1.0, min_gift_cents: 2500, max_match_cents: 1000000, annual_match_cap_cents: 5000000 }
              as: CampaignManager
              captures: { emp: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Xd", email: "xd@x.com", employer_id: "${emp}" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 100000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
              captures: { gver: $.data.version }
            - call: "POST /match-claims"
              payload: { gift_id: "${g}" }
              as: GiftAdmin
              captures: { mc: $.data.id }
          trigger:
            - call: "POST /gifts/${g}/refund"
              payload: { expected_gift_version: "${gver}" }
              as: GiftAdmin
            - call: "GET /match-claims/${mc}"
              payload: {}
              as: GiftAdmin
          assert:
            - "Gift.${g}.status == REFUNDED"
            - "MatchClaim.${mc}.status == DENIED"

      - name: donor_first_acknowledge_sets_active
        claim_type: Valid Transition
        grounds: [state_machines.Donor.PROSPECT_to_ACTIVE, entities.Donor.fields.lifecycle_status]
        distinguishing_aspect: "First gift acknowledgement auto-transitions the donor PROSPECT->ACTIVE (system actor) and stamps last_gift_at."
        test_recipe:
          setup: ["OPEN campaign; PROSPECT donor; one gift ACKNOWLEDGED"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Fa", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Fa", email: "fa@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
            - call: "GET /donors/${dn}"
              payload: {}
              as: GiftAdmin
          assert:
            - "Donor.${dn}.lifecycle_status == ACTIVE"
            - "Donor.${dn}.last_gift_at is non-null"

      - name: planned_gift_realize_into_draft_campaign_rejected
        claim_type: guarded transitions
        grounds: [state_machines.PlannedGift.CONFIRMED_to_REALIZED, "validations[priority=7]", "errors[ERR_CAMPAIGN_NOT_OPEN]"]
        distinguishing_aspect: "Realizing a planned gift into a DRAFT campaign (cross-entity guard on Campaign.status) returns ERR_CAMPAIGN_NOT_OPEN (409)."
        test_recipe:
          setup: ["DRAFT campaign; donor; planned gift CONFIRMED"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Dr", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Dr", email: "dr@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /planned-gifts"
              payload: { donor_id: "${dn}", vehicle: "IRA_ROLLOVER", expected_amount_cents: 200000 }
              as: DonorRelations
              captures: { pg: $.data.id }
            - call: "POST /planned-gifts/${pg}/confirm"
              payload: {}
              as: DonorRelations
          trigger:
            - call: "POST /planned-gifts/${pg}/realize"
              payload: { campaign_id: "${camp}", realized_amount_cents: 200000 }
              as: DonorRelations
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_CAMPAIGN_NOT_OPEN"

  # =====================================================================
  # Calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: installment_back_loaded_remainder_on_last
        claim_type: Correct Result
        grounds: [calculations.installment_schedule, entities.Pledge.fields.schedule_basis]
        distinguishing_aspect: "A BACK_LOADED pledge total 10000 / 3 installments yields amounts [3333,3333,3334] (remainder on the last) — complements the FRONT_LOADED §1.8 instance."
        test_recipe:
          setup: ["OPEN campaign; donor; BACK_LOADED pledge total 10000, 3 MONTHLY installments"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Bl", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Bl", email: "bl@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /pledges"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", total_amount_cents: 10000, installment_count: 3, frequency: "MONTHLY", schedule_basis: "BACK_LOADED" }
              as: GiftAdmin
              captures: { pl: $.data.id }
          trigger:
            - call: "GET /pledges/${pl}/installments"
              payload: {}
              as: GiftAdmin
          assert:
            - "installments sorted by sequence_no ASC have amount_cents == [3333, 3333, 3334]"

      - name: soft_credit_split_even_remainder_distribution
        claim_type: Correct Result
        grounds: [calculations.soft_credit_distribution, entities.Household.fields.soft_credit_policy]
        distinguishing_aspect: "SPLIT_EVEN policy: a 10000 gift across 3 other members produces SoftCredit cents [3334,3333,3333] in created_at ASC order, summing to exactly 10000 (cents conserved)."
        test_recipe:
          setup: ["Household SPLIT_EVEN with giver A and three others B,C,D (created in that order); A gives 10000 ACKNOWLEDGED"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Se", soft_credit_policy: "SPLIT_EVEN" }
              as: CampaignManager
              captures: { hh: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "SA", email: "sa@x.com", household_id: "${hh}" }
              as: GiftAdmin
              captures: { da: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "SB", email: "sb@x.com", household_id: "${hh}" }
              as: GiftAdmin
            - call: "POST /donors"
              payload: { full_name: "SC", email: "sc@x.com", household_id: "${hh}" }
              as: GiftAdmin
            - call: "POST /donors"
              payload: { full_name: "SD", email: "sd@x.com", household_id: "${hh}" }
              as: GiftAdmin
            - call: "POST /campaigns"
              payload: { name: "Sec", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /gifts"
              payload: { donor_id: "${da}", campaign_id: "${camp}", amount_cents: 10000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
          trigger:
            - call: "GET /households/${hh}/soft-credits"
              payload: {}
              as: CampaignManager
            - call: "GET /households/${hh}"
              payload: {}
              as: CampaignManager
          assert:
            - "the three SoftCredit rows (beneficiaries B,C,D in created_at ASC) have soft_credit_cents == [3334, 3333, 3333]"
            - "Household.${hh}.total_soft_credit_cents == 10000"

      - name: match_annual_cap_binding_second_claim
        claim_type: Variant Divergence
        grounds: [calculations.match_amount, entities.MatchClaim.fields.matched_amount_cents, entities.Employer.fields.annual_match_cap_cents]
        distinguishing_aspect: "With annual cap 60000 and a prior PAID claim of 50000, a second 100000-gift match pays only the remaining 10000 (annual_cap_binding variant vs per_gift_cap_only)."
        test_recipe:
          setup: ["OPEN campaign; employer ratio 1.0 max_match 1000000 annual cap 60000; donor; gift1 50000 ACKNOWLEDGED, claim PAID (50000); gift2 100000 ACKNOWLEDGED, claim APPROVED"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Cap", goal_cents: 5000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /employers"
              payload: { name: "Cap", match_ratio: 1.0, min_gift_cents: 2500, max_match_cents: 1000000, annual_match_cap_cents: 60000 }
              as: CampaignManager
              captures: { emp: $.data.id }
