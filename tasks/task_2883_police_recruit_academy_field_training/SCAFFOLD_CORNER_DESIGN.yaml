  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency_the_plan_token_is_invalidated_by_writes_that_are_not_themselves_guarded
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[lesson-plan-revision-stale-plan]
          - validations[priority 30]
          - errors[ERR_STALE_LESSON_PLAN_VERSION]
          - entities.LessonPlan.fields.version
          - entities.LessonPlan.fields.revision_number
          - endpoints[POST /lesson-plans/{lessonPlanId}/revisions]
          - endpoints[POST /lesson-plans/{lessonPlanId}/approve]
          - endpoints[POST /lesson-plans/{lessonPlanId}/request-revision]
        distinguishing_aspect: "The OCC token is LessonPlan.version, and only ONE of the three endpoints that bump it accepts a token: approve and request-revision carry no expected_lesson_plan_version, yet each invalidates a token a revising author is holding. So a client can be defeated by a call it never made and never saw. The instance also separates the two counters an implementation loves to conflate - version reaches 5 while revision_number reaches only 3, because two of the five bumps came from review actions that authored no revision - and pins that a rejected 412 bumps neither."
        test_recipe:
          setup:
            - "Instructor B-100 is CERTIFIED for PATROL and authored the PATROL plan, which is SUBMITTED at version 1 and revision_number 1."
            - "Two clients of the same author, A and B, have each read the plan and are holding version 1."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-FT", state_code: "TX", min_total_hours: 2.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 2.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
            - call: "POST /academy-classes"
              payload: { certification_standard_id: "${std_id}", class_code: "CLS-FT", start_date: "2026-08-03", planned_seats: 30 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
            - call: "POST /instructors"
              payload: { badge_number: "B-100", full_name: "Ivy Nash" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { instr_id: $.data.id }
            - call: "POST /instructors/${instr_id}/certify"
              payload: { certification_expires_at: "2028-08-01T00:00:00Z", authorized_topic_codes: ["PATROL"], fto_certified: true }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans"
              payload: { instructor_id: "${instr_id}", topic_code: "PATROL", title: "Patrol Operations", contact_hours: 2.00 }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { lp_id: $.data.id }
            - call: "GET /lesson-plans/${lp_id}"
              payload: {}
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { v_a: $.data.version }
            - call: "GET /lesson-plans/${lp_id}"
              payload: {}
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { v_b: $.data.version }
          trigger:
            - call: "POST /lesson-plans/${lp_id}/revisions"
              payload: { expected_lesson_plan_version: "${v_a}", contact_hours: 2.50, revision_notes: "client A widens the scenario block" }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
            - call: "POST /lesson-plans/${lp_id}/revisions"
              payload: { expected_lesson_plan_version: "${v_b}", contact_hours: 3.00, revision_notes: "client B writes against the version it read" }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { e1: $.data.error_id }
            - call: "GET /lesson-plans/${lp_id}"
              payload: {}
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { v_c: $.data.version }
            - call: "POST /lesson-plans/${lp_id}/request-revision"
              payload: { reviewer_notes: "add a use-of-force scenario" }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans/${lp_id}/revisions"
              payload: { expected_lesson_plan_version: "${v_c}", contact_hours: 3.00, revision_notes: "client B retries against the refreshed token" }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { e2: $.data.error_id }
            - call: "GET /lesson-plans/${lp_id}"
              payload: {}
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { v_d: $.data.version }
            - call: "POST /lesson-plans/${lp_id}/revisions"
              payload: { expected_lesson_plan_version: "${v_d}", contact_hours: 3.00, revision_notes: "use-of-force scenario added" }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
            - call: "POST /lesson-plans/${lp_id}/approve"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans/${lp_id}/revisions"
              payload: { expected_lesson_plan_version: "${v_d}", contact_hours: 3.50, revision_notes: "client A returns with a token the approval retired" }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { e3: $.data.error_id }
            - call: "GET /lesson-plans/${lp_id}"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
          assert:
            - "client A's revision against version 1: HTTP 200 with data.version == 2 and data.revision_number == 2"
            - "client B's revision against the same version 1: HTTP 412 with data.error_id == 'ERR_STALE_LESSON_PLAN_VERSION' - a lost update is refused, not silently applied last-writer-wins"
            - "refresh read after the 412: data.version == 2, data.revision_number == 2 and data.contact_hours == 2.50 - the rejected write bumped neither counter and left A's content in place"
            - "request-revision as the director: HTTP 200 with data.version == 3 and data.status == 'REVISION_REQUESTED' - a review action with no token of its own has just retired client B's freshly read token"
            - "client B's revision against version 2: HTTP 412, same error id - the token was invalidated by a call B neither made nor observed"
            - "client B's revision against version 3: HTTP 200 with data.version == 4, data.revision_number == 3 and data.status == 'SUBMITTED'"
            - "approve: HTTP 200 with data.version == 5 and data.approved_revision_number == 3"
            - "client A's revision against version 3: HTTP 412, same error id - approval retires tokens exactly as request-revision does"
            - "final read: data.version == 5 while data.revision_number == 3 - five accepted writes, of which only three were revisions, so the two counters must not be the same field"
            - "every 412 response body carries exactly error_id and message and no lesson-plan fields"
            - "no accepted write ever bumped version by more than 1"

      - name: derived_field_reconciliation_the_session_pin_versus_the_plans_approved_revision
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers[version_pinning_on_approval]
          - entities.CourseSession.fields.pinned_lesson_plan_revision
          - entities.LessonPlan.fields.approved_revision_number
          - validations[priority 52]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / session_delivery_requires_pinned_plan_revision_still_approved
          rationale: "That instance already walks the full reconciliation: the pin is copied at session creation, survives the plan dropping to SUBMITTED, and then goes numerically stale when the re-approval advances approved_revision_number, with a session created after the re-approval as the control. There is no residue of the version_pinning_on_approval layer left to probe separately."

      - name: cascading_side_effects_one_revocation_reaches_four_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - endpoints[POST /instructors/{instructorId}/revoke-certification]
          - state_machines[LessonPlan].transitions[APPROVED -> REVISION_REQUESTED]
          - entities.AcademyClass.fields.projected_topic_hours
        excluded_because:
          difficulty_instance: transitive_cascade / revoke_instructor_cascades_plan_session_projected_hours_class_at_risk
          rationale: "That instance drives the deepest cascade in the domain end to end - instructor, lesson plan, course session, class projection and class posture - and asserts each hop's stored result, which is exactly what this row asks for."

      - name: dual_variant_calculation_attended_and_scheduled_hour_bases
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[certified_hours_variant]
          - endpoints[GET /recruits/{recruitId}/certification-progress]
        excluded_because:
          difficulty_instance: dual_variant_calc / attended_basis_vs_scheduled_basis_diverge_on_partial_attendance
          rationale: "That instance constructs the partial-attendance row on which the two bases must disagree, reads both through the basis parameter and pins that only the ATTENDED basis governs eligibility."

      - name: rate_threshold_triggers_absence_accrual_against_the_declared_maximum
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations[absence_hours_accrual]
          - state_machines[Recruit.academy_status].transitions[IN_PROGRESS -> DISMISSAL_PENDING]
        excluded_because:
          difficulty_instance: boundary_precision_check / absence_hours_exactly_at_limit_does_not_trigger_dismissal_review
          rationale: "That instance sits the accrual exactly on max_absence_hours and then one hundredth of an hour past it, which is the only interesting behaviour of this threshold; a second instance would restate it."

  - section: consistency_model
    instances:

      - name: immediate_every_write_is_readable_and_every_aggregate_re_derived_before_the_response_returns
