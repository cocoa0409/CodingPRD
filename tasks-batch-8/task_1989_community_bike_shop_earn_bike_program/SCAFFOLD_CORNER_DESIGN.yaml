      - name: usage_exceeds_stock_returns_insufficient_stock
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Usage quantity 5 against on_hand 2 (bike correctly IN_REFURBISHMENT, logger APPRENTICE) isolates the fiscal check: ERR_INSUFFICIENT_STOCK and no decrement."
        test_recipe:
          setup: ["bike IN_REFURBISHMENT; part restocked to 2; APPRENTICE logger"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D ST", donor_type: "INDIVIDUAL", email: "dst@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V L", email: "vl@x.org" }, as: ShopCoordinator, captures: { v: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T1", level: "BASIC", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", credit_hours: 5, capacity: 10 }, as: ShopCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T2", level: "BASIC", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z", credit_hours: 5, capacity: 10 }, as: ShopCoordinator, captures: { s2: $.data.id } }
