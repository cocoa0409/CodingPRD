  # From Table 6 (Errors) — triggerability of codes not covered above/§1.8
  # ===========================================================================
  - section: errors
    instances:
      - name: corner_err_wave_not_fielding_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_WAVE_NOT_FIELDING]"]
        distinguishing_aspect: "Asserted as the winning error of the state-vs-fiscal priority pair."
        excluded_because:
          difficulty_instance: invite_wave_not_fielding_and_pool_insufficient_returns_409_state_error
          rationale: "Trigger produces exactly ERR_WAVE_NOT_FIELDING."

      - name: corner_err_privacy_hold_active_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRIVACY_HOLD_ACTIVE]"]
        distinguishing_aspect: "Asserted as the winning error of the safety-vs-referential priority pair."
        excluded_because:
          difficulty_instance: invite_privacy_hold_and_duplicate_returns_403_safety_error
          rationale: "Trigger produces exactly ERR_PRIVACY_HOLD_ACTIVE."

      - name: corner_err_k_anonymity_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_K_ANONYMITY_VIOLATION]"]
        distinguishing_aspect: "Asserted at the n == 4 boundary of the k-anonymity difficulty instance."
        excluded_because:
          difficulty_instance: k_anonymity_exactly_at_threshold_publishes
          rationale: "pub2 publish fails with exactly ERR_K_ANONYMITY_VIOLATION there."

      - name: corner_err_washout_and_cap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTACT_WASHOUT_VIOLATION]", "errors[ERR_CELL_CONTACT_CAP_REACHED]"]
        distinguishing_aspect: "Both temporal-overlap errors are asserted with exact boundary instants in the difficulty instances."
        excluded_because:
          difficulty_instance: invitation_washout_buffer_window
          rationale: "ERR_CONTACT_WASHOUT_VIOLATION at +6d; the sibling cell_contact_cap_sliding_window asserts ERR_CELL_CONTACT_CAP_REACHED twice."

      - name: corner_err_award_state_codes_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_AWARD_NOT_AUTHORIZED_STATE]", "errors[ERR_AWARD_NOT_FORFEIT_STATE]"]
        distinguishing_aspect: "Authorize-while-PENDING and forfeit-after-PAID error codes are both asserted in the parallel-dimensions instance."
        excluded_because:
          difficulty_instance: incentive_award_parallel_dimensions_independent
          rationale: "err_pending_auth and err_forfeit_paid carry exactly these codes."

