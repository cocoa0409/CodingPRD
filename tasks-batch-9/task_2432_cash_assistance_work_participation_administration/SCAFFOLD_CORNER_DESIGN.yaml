      - name: ledger_guards_refuse_over_recovery_and_over_reversal_amounts
        claim_type: aggregate_validation
        grounds:
          - validations[priority=66]
          - validations[priority=68]
          - errors.ERR_RECOVERY_EXCEEDS_BALANCE
          - errors.ERR_REVERSAL_EXCEEDS_RECOVERED
        distinguishing_aspect: |
          Each individual amount is a legal positive integer; only the running
          aggregate makes it illegal. 30001 against a 30000 balance is refused,
          30000 exactly satisfies the claim, and a 5001 reversal against 0
          recovered after a satisfied-then-reversed sequence is refused by the
          separate reversal guard with its own error id.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 with no income is ACTIVE with 2026-08 issued and benefit_amount_cents 41650."
            - "A CLIENT_ERROR GROSS overpayment for [2026-08] of 30000 is ESTABLISHED, so balance_cents is 30000 and total_recovered_cents is 0."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Ledger Guard Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /overpayments"
              payload: { case_id: "${case_id}", claim_type: "CLIENT_ERROR", months_covered: ["2026-08"], gross_amount_cents: 30000, computation_method: "GROSS" }
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { op_id: $.data.id }
            - call: "POST /overpayments/${op_id}/establish"
              payload: {}
              as: FiscalOfficer
              as_user_id: "fo-1"
            - call: "GET /overpayments/${op_id}"
              payload: {}
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { op_v1: $.data.version }
          trigger:
            - call: "POST /overpayments/${op_id}/recovery-transactions"
              payload: { method: "TAX_INTERCEPT", amount_cents: 30001, applied_month: "2026-09", expected_overpayment_version: "${op_v1}" }
              as: FiscalOfficer
              as_user_id: "fo-1"
            - call: "POST /overpayments/${op_id}/recovery-transactions"
              payload: { method: "TAX_INTERCEPT", amount_cents: 30000, applied_month: "2026-09", expected_overpayment_version: "${op_v1}" }
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { txn_full_id: $.data.id }
            - call: "GET /overpayments/${op_id}"
              payload: {}
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { op_v2: $.data.version }
            - call: "POST /overpayments/${op_id}/recovery-transactions"
              payload: { method: "RECOUPMENT_REVERSAL", amount_cents: 30001, applied_month: "2026-10", expected_overpayment_version: "${op_v2}" }
              as: FiscalOfficer
              as_user_id: "fo-1"
          assert:
            - "the first trigger call returns HTTP 422 with data.error_id == ERR_RECOVERY_EXCEEDS_BALANCE"
            - "Overpayment.${op_id}.balance_cents == 30000 after the first trigger call"
            - "Overpayment.${op_id}.status == ESTABLISHED after the first trigger call"
            - "the second trigger call returns HTTP 201 and RecoveryTransaction.${txn_full_id}.signed_amount_cents == 30000"
            - "Overpayment.${op_id}.total_recovered_cents == 30000 after the second trigger call"
            - "Overpayment.${op_id}.balance_cents == 0 after the second trigger call"
            - "Overpayment.${op_id}.status == SATISFIED after the second trigger call"
            - "the fourth trigger call returns HTTP 422 with data.error_id == ERR_REVERSAL_EXCEEDS_RECOVERED"
            - "Overpayment.${op_id}.total_recovered_cents == 30000 after the fourth trigger call"
            - "Overpayment.${op_id}.status == SATISFIED after the fourth trigger call"
            - "GET /overpayments/${op_id}/recovery-transactions returns total_count 1"

      - name: extension_grant_beyond_the_twelve_month_hardship_cap_is_refused
