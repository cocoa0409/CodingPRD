              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Atrium Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /commissioning-crews"
              payload: { name: "Crew West", region_code: "NA-W", certification_level: "L3" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { crew_w: $.data.id }
            - call: "POST /commissioning-crews"
              payload: { name: "Crew East", region_code: "NA-E", certification_level: "L3" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { crew_e: $.data.id }
            - call: "POST /commissioning-visits"
              payload: { project_id: "${pj}", commissioning_crew_id: "${crew_w}", window_start: "2026-08-05T08:00:00.000Z", window_end: "2026-08-05T16:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { visit: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /commissioning-visits/${visit}/sign-off"
              payload: {}
              as: FieldEngineer
              as_user_id: "${crew_e}"
              captures: { err_crew: $.data.error_id }
            - call: "POST /commissioning-visits/${visit}/sign-off"
              payload: {}
              as: FieldEngineer
              as_user_id: "${crew_w}"
              captures: { err_state: $.data.error_id }
            - call: "POST /commissioning-visits/${visit}/arrive"
              payload: {}
              as: FieldEngineer
              as_user_id: "${crew_w}"
              captures: { err_mount: $.data.error_id }
          assert:
            - "trigger call 1 -> 403 with ${err_crew} == 'ERR_CREW_NOT_ASSIGNED': priority 13 beats both 22 and 25"
            - "trigger call 2 -> 409 with ${err_state} == 'ERR_INVALID_VISIT_STATE': sign-off requires CALIBRATED, and 22 beats 25 even though nothing is mounted"
            - "trigger call 3 -> 409 with ${err_mount} == 'ERR_CABINETS_NOT_MOUNTED': arrive accepts a SCHEDULED visit, so 22 is satisfied and 25 finally speaks"
            - "GET /commissioning-visits/${visit} -> visit_state is still SCHEDULED, arrived_at null, and version unchanged after all three rejections"
            - "GET /projects/${pj} -> production_state == NOT_STARTED"

  # bulk_action has no instance: §1.5 declares no endpoint that accepts a list of
  # items or reports per-item status. Every mutating endpoint is single-subject, so
  # there is no partial-success semantics to probe.
  - section: endpoints
    instances:

      - name: logical_clock_drives_the_burn_in_window_gate
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - endpoints[POST /burn-in-runs/{burn_in_run_id}/complete]
          - validations[priority=33]
          - errors.ERR_BURN_IN_WINDOW_NOT_ELAPSED
        distinguishing_aspect: |
          The clock endpoint is only observable through the rules that read it, and
          this recipe pins all three of its contracts at once: (1) before any call
          the clock reads exactly the declared startup default 2026-08-01T00:00:00Z
          — an implementation that falls back to real wall-clock time would find the
          burn-in window long elapsed and return 200 on the very first trigger,
          (2) the response echoes the instant that was set, and (3) the
          window-elapsed comparison is `>=`, so the millisecond before window_end
          still fails and the instant equal to window_end succeeds.
        test_recipe:
          setup:
            - "NO clock call is made during setup. An FP10-IN cabinet ${cab} is POPULATED and run ${run} is SCHEDULED for the window [2026-08-02T00:00:00.000Z, 2026-08-03T00:00:00.000Z) - exactly the model's 24 required hours."
          setup_api_calls:
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Clock Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 120.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev: $.data.id }
            - call: "POST /drawing-revisions/${rev}/review"
              payload: { decision: "APPROVE" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /cabinets"
              payload: { project_id: "${pj}", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cab: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m1: $.data.id }
            - call: "POST /modules/${m1}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m1}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3292 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cabv1: $.data.version }
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m1}", slot_index: 1, expected_cabinet_version: "${cabv1}" }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /burn-in-chambers"
              payload: { name: "CH-1", slot_capacity: 4, turnaround_minutes: 60, certified_max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch: $.data.id }
            - call: "POST /burn-in-runs"
              payload: { cabinet_id: "${cab}", burn_in_chamber_id: "${ch}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-03T00:00:00.000Z", slots_required: 1, drive_pct: 80, ambient_c: 45.0 }
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { run: $.data.id }
          trigger:
            - call: "POST /burn-in-runs/${run}/complete"
              payload: { new_dead_pixel_count: 0, measured_brightness_nits: 4900, measured_uniformity_pct: 95.00 }
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { err_default: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T23:59:59.999Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { now1: $.data.current_utc }
            - call: "POST /burn-in-runs/${run}/complete"
              payload: { new_dead_pixel_count: 0, measured_brightness_nits: 4900, measured_uniformity_pct: 95.00 }
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { err_short: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { now2: $.data.current_utc }
            - call: "POST /burn-in-runs/${run}/complete"
              payload: { new_dead_pixel_count: 0, measured_brightness_nits: 4900, measured_uniformity_pct: 95.00 }
              as: QAEngineer
              as_user_id: "qa-1"
          assert:
            - "trigger call 1 -> 409 with ${err_default} == 'ERR_BURN_IN_WINDOW_NOT_ELAPSED': with no clock call the logical clock is still 2026-08-01T00:00:00.000Z, which is BEFORE window_end (a real-time fallback would wrongly succeed here)"
            - "trigger call 2 -> 200 with ${now1} == '2026-08-02T23:59:59.999Z' (the endpoint echoes the instant it was given)"
            - "trigger call 3 -> 409 with ${err_short} == 'ERR_BURN_IN_WINDOW_NOT_ELAPSED': one millisecond short of window_end still fails"
            - "trigger call 4 -> 200 with ${now2} == '2026-08-03T00:00:00.000Z'"
            - "trigger call 5 -> 200: exact equality with window_end passes; BurnInRun.${run}.run_state == PASSED and Cabinet.${cab}.cabinet_state == BURN_IN_PASSED"
            - "GET /burn-in-runs/${run} -> run_state == PASSED and the stored measurements come from the one successful write, not from the two rejected attempts"

      - name: list_pagination_envelope_composes_with_filters
        claim_type: standard_crud
        grounds:
          - endpoints[GET /modules]
          - endpoints[GET /display-models]
          - validations[priority=3]
        distinguishing_aspect: |
          The two listing instances in the entities section pin down WHICH rows a
          filter returns; this one pins the envelope arithmetic around them. Reads
          carry a four-field pagination envelope (limit, offset, total_count,
          has_more) whose semantics are easy to get half right: total_count must
          count the FILTERED set rather than the whole table, has_more must be
          computed from offset + returned versus total_count (not from "did I fill
          the page"), the default limit is 10 rather than "everything", and limit
          outside 1..100 is a 400 rather than a clamp. A single collection with 12
          rows in three different module states exposes every one of those.
        test_recipe:
          setup:
            - "12 FP10-IN modules M-01..M-12 exist in creation order; M-01..M-04 have passed the pixel test, and of those M-01 and M-02 are also calibrated, leaving 2 CALIBRATED, 2 TESTED and 8 CREATED."
