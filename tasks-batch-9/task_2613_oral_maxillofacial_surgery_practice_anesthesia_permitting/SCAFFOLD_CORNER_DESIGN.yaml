      - name: derived_totals_reconcile_after_reserve_consume_and_release
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers[derived_field_reconciliation]
          - calculations.consignment_liability
          - endpoints[POST /implant-reservations/{reservationId}/consume]
        distinguishing_aspect: "The exposure figure is re-derived after a create, after a status change that keeps the row in the sum (CONSUMED), and after one that drops it out (RELEASED) - and the cabinet counters move on consume but not on release, so the two derived families reconcile independently."
        test_recipe:
          setup:
            - "a consignment lot at 30000 per unit with 4 units, one DRAFT case, default 500000 credit limit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
