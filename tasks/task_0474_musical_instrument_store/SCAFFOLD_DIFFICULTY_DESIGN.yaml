# =============================================================================
# task_0474_musical_instrument_store — §1.8 Scaffold Difficulty Design
# Test Targeting Index — 9 rule_ids x >=2 instances. All literals pre-computed.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rto_equity_vs_payoff_diverge_on_agreement
        grounds:
          - calculations.equity_accrual
          - calculations.buyout_payoff
          - entities.RentalAgreement.fields.accrued_equity_cents
          - entities.RentalAgreement.fields.payoff_quote_cents
        distinguishing_aspect: |
          On the SAME RentalAgreement after 3 posted rent months, accrued_equity_cents
          counts UP to 15000 while payoff_quote_cents counts DOWN to 110000; their sum
          (125000) != purchase_price (120000) because payoff adds the 5000 buyout fee —
          two valid algorithms over one payment stream produce non-complementary numbers.
        test_recipe:
          setup:
            - "Customer C exists."
            - "InventoryUnit U: monthly_rent_cents=10000, list_price_cents=120000, AVAILABLE."
            - "RentalAgreement A (RENT_TO_OWN, equity_rate_pct=0.50) on U, 3 RENT payments POSTED (cycles 1,2,3)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C One", email: "c1@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c1: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Fender Strat", category: "GUITAR", condition: "NEW", serial_number: "S-DV-1", acquisition_cost_cents: 60000, list_price_cents: 120000, monthly_rent_cents: 10000 }
              as: SalesAssociate
              captures: { u1: $.data.id, u1v: $.data.version }
            - call: "POST /units/${u1}/reserve"
              payload: { customer_id: "${c1}", expected_inventory_unit_version: "${u1v}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c1}", inventory_unit_id: "${u1}", plan: "RENT_TO_OWN", equity_rate_pct: 0.50 }
              as: SalesAssociate
              captures: { a1: $.data.id }
            - call: "POST /rental-agreements/${a1}/payments"
              payload: { billing_cycle_index: 1 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /rental-agreements/${a1}/payments"
              payload: { billing_cycle_index: 2 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /rental-agreements/${a1}/payments"
              payload: { billing_cycle_index: 3 }
              as: Customer
              as_user_id: "${c1}"
          trigger:
            - call: "GET /rental-agreements/${a1}"
              as: Customer
              as_user_id: "${c1}"
              captures: { acc: $.data.accrued_equity_cents, payoff: $.data.payoff_quote_cents }
          assert:
            - "RentalAgreement.${a1}.accrued_equity_cents == 15000"
            - "RentalAgreement.${a1}.payoff_quote_cents == 110000"
            - "RentalAgreement.${a1}.accrued_equity_cents + RentalAgreement.${a1}.payoff_quote_cents == 125000"

      - name: store_credit_tradein_vs_consignment_diverge_on_customer
        grounds:
          - calculations.tradein_offer
          - calculations.consignment_settlement
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Both algorithms write Customer.store_credit_cents, but tradein_offer credits
          floor(appraised*tier_pct)=40000 (counts UP a fraction of appraised), while
          consignment_settlement credits ask-round(ask*comm)=120000 (counts DOWN from ask);
          same field, two structurally different conserved-quantity formulas.
        test_recipe:
          setup:
            - "Customer C exists with store_credit_cents=0."
            - "TradeIn (USED, appraised 80000) accepted -> +40000 credit."
            - "ConsignmentListing (ask 150000, comm 0.20) for C sold -> +120000 credit."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Two", email: "c2@x.com", credit_score: 700 }
              as: StoreManager
              captures: { c2: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${c2}", model_name: "Used Tele", condition: "USED", appraised_value_cents: 80000 }
              as: StoreManager
              captures: { t2: $.data.id }
            - call: "POST /trade-ins/${t2}/accept"
              as: StoreManager
            - call: "POST /consignment-listings"
              payload: { consignor_id: "${c2}", model_name: "Vintage Les Paul", ask_price_cents: 150000, commission_pct: 0.20 }
              as: SalesAssociate
              captures: { cl2: $.data.id }
          trigger:
            - call: "POST /consignment-listings/${cl2}/sell"
              as: SalesAssociate
          assert:
            - "TradeIn.${t2}.offer_cents == 40000"
            - "ConsignmentListing.${cl2}.consignor_payout_cents == 120000"
            - "Customer.${c2}.store_credit_cents == 160000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: repair_invoice_rush_branch_mode_a
        grounds:
          - calculations.repair_invoice
          - entities.RepairTicket.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (a): 3 inputs (labor_hours, labor_rate_cents, parts_cost_cents) with a
          non-linear rush branch applied to subtotal (not labor alone) plus a MIN_BENCH
          floor. rush=true on labor 10000 + parts 3000 -> 16250, not 13000.
        test_recipe:
          setup:
            - "Customer C exists."
            - "RepairTicket with labor_hours=2, labor_rate_cents=5000, parts_cost_cents=3000, rush=true."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Rep", email: "crep@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c3: $.data.id }
          trigger:
            - call: "POST /repair-tickets"
              payload: { customer_id: "${c3}", labor_hours: 2, labor_rate_cents: 5000, parts_cost_cents: 3000, rush: true }
              as: SalesAssociate
              captures: { rt3: $.data.id, rt3total: $.data.quoted_total_cents }
          assert:
            - "RepairTicket.${rt3}.quoted_total_cents == 16250"

      - name: financing_terms_rounding_order_mode_b
        grounds:
          - calculations.financing_terms
          - entities.FinancingApplication.fields.monthly_payment_cents
          - state_machines.FinancingApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (b): amortization where rounding order is pinned to "round only the final
          payment". principal 240000, term 12, score 740 (APR 0.0599) -> exactly 20655;
          rounding apr/12 first would yield a different cent value.
        test_recipe:
          setup:
            - "Customer C with credit_score=740."
            - "FinancingApplication (principal 240000, term 12) SUBMITTED, then approved."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Fin", email: "cfin@x.com", credit_score: 740 }
              as: SalesAssociate
              captures: { c4: $.data.id }
            - call: "POST /financing-applications"
              payload: { customer_id: "${c4}", principal_cents: 240000, term_months: 12 }
              as: SalesAssociate
              captures: { f4: $.data.id }
          trigger:
            - call: "POST /financing-applications/${f4}/approve"
              as: StoreManager
              captures: { apr: $.data.apr_pct, pay: $.data.monthly_payment_cents }
          assert:
            - "FinancingApplication.${f4}.apr_pct == 0.0599"
            - "FinancingApplication.${f4}.monthly_payment_cents == 20655"
            - "FinancingApplication.${f4}.status == APPROVED"

      - name: lesson_tuition_stacked_discount_order_mode_c
        grounds:
          - calculations.lesson_tuition
          - entities.LessonEnrollment.fields.monthly_tuition_cents
          - state_machines.RentalAgreement.transitions
        distinguishing_aspect: |
          Mode (c): evaluation-order dependency — volume discount applied FIRST, bundle
          discount SECOND on the volume-discounted amount. base 5000*8 sessions with an
          ACTIVE linked agreement -> 40000*0.85=34000 then *0.80=27200; reversing order
          changes the cents.
        test_recipe:
          setup:
            - "Customer C exists."
            - "InventoryUnit U AVAILABLE, reserved, RentalAgreement A (RENTAL) ACTIVE on U."
            - "LessonEnrollment for C linked to A, sessions_per_month=8, base_rate_cents=5000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Les", email: "cles@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c5: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Cello", category: "ORCHESTRA", condition: "NEW", serial_number: "S-LES-1", acquisition_cost_cents: 50000, list_price_cents: 90000, monthly_rent_cents: 8000 }
              as: SalesAssociate
              captures: { u5: $.data.id, u5v: $.data.version }
            - call: "POST /units/${u5}/reserve"
              payload: { customer_id: "${c5}", expected_inventory_unit_version: "${u5v}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c5}", inventory_unit_id: "${u5}", plan: "RENTAL" }
              as: SalesAssociate
              captures: { a5: $.data.id }
          trigger:
            - call: "POST /lesson-enrollments"
              payload: { student_id: "${c5}", rental_agreement_id: "${a5}", instrument_family: "ORCHESTRA", sessions_per_month: 8, base_rate_cents: 5000 }
              as: SalesAssociate
              captures: { le5: $.data.id, tui: $.data.monthly_tuition_cents }
          assert:
            - "LessonEnrollment.${le5}.monthly_tuition_cents == 27200"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rental_agreement_branching_fork_three_terminals
        grounds:
          - state_machines.RentalAgreement.ACTIVE_to_BOUGHT_OUT
          - state_machines.RentalAgreement.ACTIVE_to_RETURNED
          - state_machines.RentalAgreement.ACTIVE_to_DEFAULTED
        distinguishing_aspect: |
          RentalAgreement is a branching fork: ACTIVE -> {BOUGHT_OUT, RETURNED, DEFAULTED}
          with divergent side-effects (buyout sells the unit; return makes it AVAILABLE
          and forfeits equity). Here the RETURN branch leaves the unit AVAILABLE.
        test_recipe:
          setup:
            - "Customer C, InventoryUnit U AVAILABLE, RentalAgreement A (RENTAL) ACTIVE on U (ON_RENT)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Br", email: "cbr@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c6: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Violin", category: "ORCHESTRA", condition: "NEW", serial_number: "S-BR-1", acquisition_cost_cents: 40000, list_price_cents: 80000, monthly_rent_cents: 6000 }
              as: SalesAssociate
              captures: { u6: $.data.id, u6v: $.data.version }
            - call: "POST /units/${u6}/reserve"
              payload: { customer_id: "${c6}", expected_inventory_unit_version: "${u6v}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c6}", inventory_unit_id: "${u6}", plan: "RENTAL" }
              as: SalesAssociate
              captures: { a6: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${a6}/return"
              as: Customer
              as_user_id: "${c6}"
          assert:
            - "RentalAgreement.${a6}.status == RETURNED"
            - "InventoryUnit.${u6}.status == AVAILABLE"

      - name: repair_ticket_detour_awaiting_parts_cycle
        grounds:
          - state_machines.RepairTicket.IN_PROGRESS_to_AWAITING_PARTS
          - state_machines.RepairTicket.AWAITING_PARTS_to_IN_PROGRESS
        distinguishing_aspect: |
          RepairTicket has a non-linear detour cycle IN_PROGRESS <-> AWAITING_PARTS on a
          different entity than RentalAgreement; the ticket can return to IN_PROGRESS
          after AWAITING_PARTS rather than progressing only forward.
        test_recipe:
          setup:
            - "Customer C, RepairTicket claimed by Luthier L (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Det", email: "cdet@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c7: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${c7}", labor_hours: 1, labor_rate_cents: 6000 }
              as: SalesAssociate
              captures: { rt7: $.data.id }
            - call: "POST /repair-tickets/${rt7}/claim"
              as: Luthier
              as_user_id: "luthier-1"
            - call: "POST /repair-tickets/${rt7}/await-parts"
              as: Luthier
              as_user_id: "luthier-1"
          trigger:
            - call: "POST /repair-tickets/${rt7}/resume"
              as: Luthier
              as_user_id: "luthier-1"
          assert:
            - "RepairTicket.${rt7}.status == IN_PROGRESS"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: consignment_sell_cascade_depth3
        grounds:
          - state_machines.ConsignmentListing.LISTED_to_SOLD
          - state_machines.InventoryUnit.CONSIGNED_to_SOLD
          - entities.Customer.fields.store_credit_cents
          - entities.InventoryUnit.fields.consignment_listing_id
        distinguishing_aspect: |
          Depth-3 chain: selling the listing (A) mutates the linked InventoryUnit
          CONSIGNED->SOLD (B), and the listing's settlement credits the consignor Customer
          (C). Each hop is caused by the prior: listing.SOLD -> unit.SOLD -> customer credit.
        test_recipe:
          setup:
            - "Customer (consignor) C, ConsignmentListing CL (ask 150000, comm 0.20) LISTED with its minted CONSIGNED unit."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Csg", email: "ccsg@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c8: $.data.id }
            - call: "POST /consignment-listings"
              payload: { consignor_id: "${c8}", model_name: "Martin D-28", ask_price_cents: 150000, commission_pct: 0.20 }
              as: SalesAssociate
              captures: { cl8: $.data.id }
          trigger:
            - call: "POST /consignment-listings/${cl8}/sell"
              as: SalesAssociate
              captures: { payout: $.data.consignor_payout_cents }
          assert:
            - "ConsignmentListing.${cl8}.status == SOLD"
            - "ConsignmentListing.${cl8}.consignor_payout_cents == 120000"
            - "Customer.${c8}.store_credit_cents == 120000"

      - name: buyout_cascade_unit_sold_depth2
        grounds:
          - state_machines.RentalAgreement.ACTIVE_to_BOUGHT_OUT
          - state_machines.InventoryUnit.ON_RENT_to_SOLD
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (buyout, not consignment sale): paying
          the exact payoff transitions the agreement ACTIVE->BOUGHT_OUT (A) which cascades
          the unit ON_RENT->SOLD (B). The unit transition is caused by the agreement one.
        test_recipe:
          setup:
            - "Customer C, RENT_TO_OWN agreement A on unit U (ON_RENT), 3 rent months posted (payoff_quote=110000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Buy", email: "cbuy@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c9: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Gibson J-45", category: "GUITAR", condition: "NEW", serial_number: "S-BUY-1", acquisition_cost_cents: 60000, list_price_cents: 120000, monthly_rent_cents: 10000 }
              as: SalesAssociate
              captures: { u9: $.data.id, u9v: $.data.version }
            - call: "POST /units/${u9}/reserve"
              payload: { customer_id: "${c9}", expected_inventory_unit_version: "${u9v}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c9}", inventory_unit_id: "${u9}", plan: "RENT_TO_OWN", equity_rate_pct: 0.50 }
              as: SalesAssociate
              captures: { a9: $.data.id }
            - call: "POST /rental-agreements/${a9}/payments"
              payload: { billing_cycle_index: 1 }
              as: Customer
              as_user_id: "${c9}"
            - call: "POST /rental-agreements/${a9}/payments"
              payload: { billing_cycle_index: 2 }
              as: Customer
              as_user_id: "${c9}"
            - call: "POST /rental-agreements/${a9}/payments"
              payload: { billing_cycle_index: 3 }
              as: Customer
              as_user_id: "${c9}"
            - call: "GET /rental-agreements/${a9}"
              as: Customer
              as_user_id: "${c9}"
              captures: { a9v: $.data.version }
          trigger:
            - call: "POST /rental-agreements/${a9}/buyout"
              payload: { amount_cents: 110000, expected_agreement_version: "${a9v}" }
              as: Customer
              as_user_id: "${c9}"
          assert:
            - "RentalAgreement.${a9}.status == BOUGHT_OUT"
            - "InventoryUnit.${u9}.status == SOLD"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: forbidden_beats_invalid_state_on_repossess
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - state_machines.RentalAgreement.DEFAULTED_to_REPOSSESSED
        distinguishing_aspect: |
          Pair (auth/business_safety vs state): a Customer attempting repossess on an ACTIVE
          (not DEFAULTED) agreement violates BOTH the role rule (priority 2, ERR_FORBIDDEN)
          and the state rule (priority 5, ERR_INVALID_STATE); priority 2 wins -> ERR_FORBIDDEN.
        test_recipe:
          setup:
            - "Customer C, RentalAgreement A (RENTAL) ACTIVE (not DEFAULTED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Pr1", email: "cpr1@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c10: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Trumpet", category: "BAND", condition: "NEW", serial_number: "S-PR1-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u10: $.data.id, u10v: $.data.version }
            - call: "POST /units/${u10}/reserve"
              payload: { customer_id: "${c10}", expected_inventory_unit_version: "${u10v}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c10}", inventory_unit_id: "${u10}", plan: "RENTAL" }
              as: SalesAssociate
              captures: { a10: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${a10}/repossess"
              as: Customer
              as_user_id: "${c10}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_FORBIDDEN"
            - "RentalAgreement.${a10}.status == ACTIVE"

      - name: not_found_beats_credit_too_low_on_approve
        grounds:
          - validations[priority=3]
          - validations[priority=9]
          - state_machines.FinancingApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Pair (existence vs business_constraint): approving a non-existent financing
          application id violates existence (priority 3, ERR_NOT_FOUND) which is checked
          before the credit-score business rule (priority 9, ERR_CREDIT_TOO_LOW);
          ERR_NOT_FOUND wins even though no application is loaded to evaluate credit.
        test_recipe:
          setup:
            - "No financing application with the queried id exists; a StoreManager is authenticated."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Pr2", email: "cpr2@x.com", credit_score: 500 }
              as: StoreManager
              captures: { c11: $.data.id }
          trigger:
            - call: "POST /financing-applications/00000000-0000-4000-8000-000000000000/approve"
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: default_threshold_at_exactly_three_missed
        grounds:
          - calculations.missed_streak_advance
          - state_machines.RentalAgreement.ACTIVE_to_DEFAULTED
          - entities.RentalAgreement.fields.missed_streak
        distinguishing_aspect: |
          Boundary on missed_streak vs DEFAULT_THRESHOLD=3: after 2 unpaid advances the
          agreement is still ACTIVE (missed_streak=2), the 3rd unpaid advance crosses to
          DEFAULTED (>= not >). Reachable through POST .../advance-cycle.
        test_recipe:
          setup:
            - "Customer C, RENT_TO_OWN agreement A on unit U, ACTIVE, zero payments."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Bd1", email: "cbd1@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c12: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Clarinet", category: "BAND", condition: "NEW", serial_number: "S-BD1-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u12: $.data.id, u12v: $.data.version }
            - call: "POST /units/${u12}/reserve"
              payload: { customer_id: "${c12}", expected_inventory_unit_version: "${u12v}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c12}", inventory_unit_id: "${u12}", plan: "RENT_TO_OWN", equity_rate_pct: 0.50 }
              as: SalesAssociate
              captures: { a12: $.data.id }
            - call: "POST /rental-agreements/${a12}/advance-cycle"
              payload: { billing_cycle_index: 1 }
              as: StoreManager
            - call: "POST /rental-agreements/${a12}/advance-cycle"
              payload: { billing_cycle_index: 2 }
              as: StoreManager
          trigger:
            - call: "POST /rental-agreements/${a12}/advance-cycle"
              payload: { billing_cycle_index: 3 }
              as: StoreManager
              captures: { st: $.data.status, ms: $.data.missed_streak }
          assert:
            - "RentalAgreement.${a12}.missed_streak == 3"
            - "RentalAgreement.${a12}.status == DEFAULTED"
            - "RentalAgreement.${a12}.late_fee_balance_cents == 4500"

      - name: deposit_exactly_meets_required_boundary
        grounds:
          - calculations.special_order_deposit
          - validations[priority=10]
          - state_machines.SpecialOrder.QUOTED_to_DEPOSITED
        distinguishing_aspect: |
          Boundary on a different metric/endpoint: paying exactly required_deposit_cents
          (50000 for quoted 200000 @ 0.25) is accepted (>= boundary), one cent below would
          be ERR_DEPOSIT_INSUFFICIENT. Reachable through POST .../pay-deposit.
        test_recipe:
          setup:
            - "Customer C, SpecialOrder SO (quoted 200000, deposit_pct 0.25 -> required 50000) QUOTED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Bd2", email: "cbd2@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c13: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c13}", model_name: "Bespoke Archtop", quoted_price_cents: 200000, deposit_pct: 0.25 }
              as: SalesAssociate
              captures: { so13: $.data.id }
          trigger:
            - call: "POST /special-orders/${so13}/pay-deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${c13}"
              captures: { st: $.data.status }
          assert:
            - "SpecialOrder.${so13}.required_deposit_cents == 50000"
            - "SpecialOrder.${so13}.status == DEPOSITED"
            - "SpecialOrder.${so13}.deposit_paid_cents == 50000"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: financing_approve_depends_on_customer_credit
        grounds:
          - state_machines.FinancingApplication.SUBMITTED_to_APPROVED
          - validations[priority=9]
          - entities.Customer.fields.credit_score
        distinguishing_aspect: |
          FinancingApplication -> Customer pair: approve is rejected with ERR_CREDIT_TOO_LOW
          when the applicant Customer.credit_score (640) < MIN_FINANCE_SCORE; the
          application's own state is valid (SUBMITTED) but a different entity's field blocks.
        test_recipe:
          setup:
            - "Customer C with credit_score=640, FinancingApplication F (principal 240000, term 12) SUBMITTED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Ce1", email: "cce1@x.com", credit_score: 640 }
              as: SalesAssociate
              captures: { c14: $.data.id }
            - call: "POST /financing-applications"
              payload: { customer_id: "${c14}", principal_cents: 240000, term_months: 12 }
              as: SalesAssociate
              captures: { f14: $.data.id }
          trigger:
            - call: "POST /financing-applications/${f14}/approve"
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_CREDIT_TOO_LOW"
            - "FinancingApplication.${f14}.status == SUBMITTED"

      - name: lesson_bundle_discount_depends_on_agreement_active
        grounds:
          - calculations.lesson_tuition
          - state_machines.RentalAgreement.ACTIVE_to_RETURNED
          - state_machines.LessonEnrollment.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          LessonEnrollment -> RentalAgreement pair (different from the financing/customer
          pair): the bundle discount is granted only while the linked agreement is ACTIVE.
          After the agreement is RETURNED and the enrollment is paused/resumed, tuition
          recomputes WITHOUT the bundle discount (34000, not 27200).
        test_recipe:
          setup:
            - "Customer C, RentalAgreement A (RENTAL) ACTIVE on unit U."
            - "LessonEnrollment LE linked to A, sessions_per_month=8, base 5000 -> tuition 27200 (bundle ACTIVE)."
            - "LE paused; A returned (now RETURNED, unit AVAILABLE)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Ce2", email: "cce2@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c15: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Flute", category: "BAND", condition: "NEW", serial_number: "S-CE2-1", acquisition_cost_cents: 30000, list_price_cents: 70000, monthly_rent_cents: 6000 }
              as: SalesAssociate
              captures: { u15: $.data.id, u15v: $.data.version }
            - call: "POST /units/${u15}/reserve"
              payload: { customer_id: "${c15}", expected_inventory_unit_version: "${u15v}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c15}", inventory_unit_id: "${u15}", plan: "RENTAL" }
              as: SalesAssociate
              captures: { a15: $.data.id }
            - call: "POST /lesson-enrollments"
              payload: { student_id: "${c15}", rental_agreement_id: "${a15}", instrument_family: "BAND", sessions_per_month: 8, base_rate_cents: 5000 }
              as: SalesAssociate
              captures: { le15: $.data.id }
            - call: "POST /lesson-enrollments/${le15}/pause"
              as: Customer
              as_user_id: "${c15}"
            - call: "POST /rental-agreements/${a15}/return"
              as: Customer
              as_user_id: "${c15}"
          trigger:
            - call: "POST /lesson-enrollments/${le15}/resume"
              as: Customer
              as_user_id: "${c15}"
              captures: { tui: $.data.monthly_tuition_cents }
          assert:
            - "LessonEnrollment.${le15}.monthly_tuition_cents == 34000"
            - "LessonEnrollment.${le15}.status == ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_single_disposition_reserve_blocks_second_hold
        grounds:
          - state_machines.InventoryUnit.AVAILABLE_to_RESERVED
          - entities.InventoryUnit.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          Interval semantics: an InventoryUnit occupies a single point-allocation slot —
          once RESERVED its allocation interval is fully occupied, so a second reserve on
          the same unit collides (ERR_INVALID_STATE, from != AVAILABLE). Adjacency is
          'exclusive single-holder'; no buffer or aggregate capacity.
        test_recipe:
          setup:
            - "Customer C, InventoryUnit U reserved for C (status RESERVED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C To1", email: "cto1@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c16: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Banjo", category: "OTHER", condition: "USED", serial_number: "S-TO1-1", acquisition_cost_cents: 20000, list_price_cents: 45000, monthly_rent_cents: 4000 }
              as: SalesAssociate
              captures: { u16: $.data.id, u16v: $.data.version }
            - call: "POST /units/${u16}/reserve"
              payload: { customer_id: "${c16}", expected_inventory_unit_version: "${u16v}" }
              as: SalesAssociate
              captures: { u16v2: $.data.version }
          trigger:
            - call: "POST /units/${u16}/reserve"
              payload: { customer_id: "${c16}", expected_inventory_unit_version: "${u16v2}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "InventoryUnit.${u16}.status == RESERVED"

      - name: billing_cycle_index_aggregate_occupancy_one_payment_per_cycle
        grounds:
          - calculations.missed_streak_advance
          - entities.PaymentRecord.fields.billing_cycle_index
          - state_machines.RentalAgreement.DEFAULTED_to_ACTIVE
        distinguishing_aspect: |
          Different interval semantics on a different resource: a billing cycle is an
          aggregate-occupancy window keyed by billing_cycle_index — a POSTED RENT payment
          marks that cycle 'covered' so advancing that exact cycle does NOT post a late fee
          or bump the streak (cycle already occupied), unlike the exclusive-holder unit slot.
        test_recipe:
          setup:
            - "Customer C, RENT_TO_OWN agreement A on unit U, ACTIVE, 1 RENT payment POSTED for cycle 1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C To2", email: "cto2@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c17: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Mandolin", category: "OTHER", condition: "NEW", serial_number: "S-TO2-1", acquisition_cost_cents: 25000, list_price_cents: 55000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u17: $.data.id, u17v: $.data.version }
            - call: "POST /units/${u17}/reserve"
              payload: { customer_id: "${c17}", expected_inventory_unit_version: "${u17v}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c17}", inventory_unit_id: "${u17}", plan: "RENT_TO_OWN", equity_rate_pct: 0.50 }
              as: SalesAssociate
              captures: { a17: $.data.id }
            - call: "POST /rental-agreements/${a17}/payments"
              payload: { billing_cycle_index: 1 }
              as: Customer
              as_user_id: "${c17}"
          trigger:
            - call: "POST /rental-agreements/${a17}/advance-cycle"
              payload: { billing_cycle_index: 1 }
              as: StoreManager
              captures: { ms: $.data.missed_streak }
          assert:
            - "RentalAgreement.${a17}.missed_streak == 0"
            - "RentalAgreement.${a17}.late_fee_balance_cents == 0"
            - "RentalAgreement.${a17}.status == ACTIVE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: layaway_cancel_conserves_money_into_store_credit
        grounds:
          - state_machines.LayawayPlan.OPEN_to_CANCELLED
          - calculations.layaway_cancel_refund
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Conserved quantity = customer money. On cancel, paid_cents (40000) is partitioned
          exactly into refund-as-store-credit (34000) plus the store's restock fee (6000):
          refund_credit + restock_fee == paid_cents. No money is created or lost.
        test_recipe:
          setup:
            - "Customer C, InventoryUnit U (list 60000) reserved, LayawayPlan LP open (deposit 20000, restock 0.10), one 20000 installment -> paid 40000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Ci1", email: "cci1@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c18: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Snare Kit", category: "OTHER", condition: "NEW", serial_number: "S-CI1-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u18: $.data.id, u18v: $.data.version }
            - call: "POST /units/${u18}/reserve"
              payload: { customer_id: "${c18}", expected_inventory_unit_version: "${u18v}" }
              as: SalesAssociate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${c18}", inventory_unit_id: "${u18}", deposit_cents: 20000, restock_fee_pct: 0.10 }
              as: SalesAssociate
              captures: { lp18: $.data.id }
            - call: "POST /layaway-plans/${lp18}/payments"
              payload: { amount_cents: 20000 }
              as: Customer
              as_user_id: "${c18}"
          trigger:
            - call: "POST /layaway-plans/${lp18}/cancel"
              as: SalesAssociate
          assert:
            - "LayawayPlan.${lp18}.status == CANCELLED"
            - "Customer.${c18}.store_credit_cents == 34000"
            - "InventoryUnit.${u18}.status == AVAILABLE"

      - name: special_order_cancel_conserves_deposit_back_to_credit
        grounds:
          - state_machines.SpecialOrder.QUOTED_to_DEPOSITED
          - state_machines.SpecialOrder.transitions
          - entities.Customer.fields.store_credit_cents
          - entities.SpecialOrder.fields.deposit_paid_cents
        distinguishing_aspect: |
          Conserved quantity = the deposit (a DIFFERENT quantity than layaway money).
          Paying a 50000 deposit then cancelling returns exactly 50000 to store credit:
          store_credit delta == deposit_paid_cents, leaving net zero movement of the deposit.
        test_recipe:
          setup:
            - "Customer C (store_credit 0), SpecialOrder SO (quoted 200000) DEPOSITED with deposit_paid 50000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Ci2", email: "cci2@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c19: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c19}", model_name: "Custom Bass", quoted_price_cents: 200000, deposit_pct: 0.25 }
              as: SalesAssociate
              captures: { so19: $.data.id }
            - call: "POST /special-orders/${so19}/pay-deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${c19}"
          trigger:
            - call: "POST /special-orders/${so19}/cancel"
              as: SalesAssociate
          assert:
            - "SpecialOrder.${so19}.status == CANCELLED"
            - "Customer.${c19}.store_credit_cents == 50000"
