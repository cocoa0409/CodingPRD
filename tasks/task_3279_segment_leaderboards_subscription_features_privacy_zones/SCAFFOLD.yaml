    roles: [Athlete, PlatformAdmin]
    code: 200
    input: []
    output: PrivacyZone
    side_effects: ["status -> ACTIVE; recompute obfuscation for owner's activities"]

  # --- Activity ---
  - method: POST
    path: "/v1/athletes/{id}/activities"
