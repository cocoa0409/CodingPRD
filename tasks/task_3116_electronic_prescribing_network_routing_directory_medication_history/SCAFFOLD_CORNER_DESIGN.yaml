            - "the non-controlled sign on the same standard succeeds with clinical_status SIGNED, so the guard is conditioned on controlled_schedule rather than on the standard alone"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: deliverable_fallback_flow_requires_a_failed_attempt_first
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/network/prescriptions/{id}/route-fallback
          - errors[ERR_NO_FAILED_ATTEMPT_TO_FALL_BACK]
          - state_machines.Prescription.routing_status.transitions.BACKUP_SELECTION_to_FALLBACK_PENDING
        distinguishing_aspect: "route-fallback is gated on there already being a failed attempt, so calling it on a fresh signed order returns ERR_NO_FAILED_ATTEMPT_TO_FALL_BACK while the same call after a reported undeliverable moves routing_status to FALLBACK_PENDING."
        test_recipe:
          setup:
