        distinguishing_aspect: "The LOW/MODERATE frontier is walked from below and from exactly on it: 400 ml of residual water gives 5 + 24 - 5 = 24 and LOW with decon_mandatory false, while 500 ml gives 5 + 25 - 5 = 25 and MODERATE, where the residual-water clause makes decon_mandatory true."
