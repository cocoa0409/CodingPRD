      - name: settlement_close_is_blocked_until_every_load_is_tared_and_graded
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.GrapeContract.lifecycle.ACTIVE_to_SETTLED
          - validations.priority_24
          - validations.priority_25
