        distinguishing_aspect: |
          label_revision_ref is captured at submission; approve requires it to
          equal the formula's current revision_number. A registration submitted
          with label_revision_ref 99 against revision 1 reaches UNDER_REVIEW
          but fails approval with ERR_LABEL_REVISION_STALE (422).
