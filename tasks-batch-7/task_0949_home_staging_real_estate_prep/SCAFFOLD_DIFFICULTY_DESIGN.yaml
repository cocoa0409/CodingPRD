      - name: deposit_apply_then_refund_conserves_the_deposit_amount
        grounds:
          - conservation_invariants.deposit_amount_conservation
          - calculations.deposit_waterfall
          - state_machines.Deposit.HELD_to_PARTIALLY_APPLIED
          - state_machines.Deposit.PARTIALLY_APPLIED_to_REFUNDED
        distinguishing_aspect: |
          CONSERVED QUANTITY 2 — DEPOSIT MONEY, a different kind of quantity from unit
          counts. A 6197.50 deposit is partly consumed by a 3058.06 balance and the residue
          3139.44 is refunded, so amount == damage + holdover + balance + refunded +
          forfeited + held_remaining holds exactly, with held_remaining at 0.00.
        test_recipe:
          setup:
            - "The OCCUPIED PAY_AT_CLOSING project with contract_value 12395.00 and a 6197.50 deposit collected."
            - "One completed visit of 2.0 hours; invoice materialised at subtotal 2825.00 and tax 233.06."
          setup_api_calls: *occ_authorized
          trigger:
            - call: "POST /staging/deposits/${dep_id}/collect"
              payload: {}
              as: BillingClerk
            - call: "POST /staging/projects/${proj_id}/visits"
              payload: { scheduled_at: "2026-06-02T09:00:00Z" }
              as: StagingCoordinator
              captures: { visit_id: "$.data.id" }
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/visits/${visit_id}/complete"
              payload: { hours_logged: 2.0 }
              as: StagingCoordinator
            - call: "POST /staging/projects/${proj_id}/invoices"
              payload: {}
              as: BillingClerk
              captures: { inv_id: "$.data.id" }
            - call: "POST /staging/deposits/${dep_id}/apply"
              payload: { invoice_id: "${inv_id}" }
              as: BillingClerk
            - call: "POST /staging/invoices/${inv_id}/defer-to-closing"
              payload: {}
              as: BillingClerk
            - call: "POST /staging/listings/${listing_id}/under-contract"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /staging/listings/${listing_id}/close"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /staging/invoices/${inv_id}/pay"
              payload: { amount_paid: 0.00 }
              as: BillingClerk
            - call: "POST /staging/deposits/${dep_id}/refund"
              payload: {}
              as: BillingClerk
          assert:
            - "Deposit.${dep_id}.amount == 6197.50"
            - "Invoice.${inv_id}.subtotal == 2825.00"
            - "Invoice.${inv_id}.tax_amount == 233.06"
            - "Deposit.${dep_id}.applied_to_damage == 0.00"
            - "Deposit.${dep_id}.applied_to_holdover == 0.00"
            - "Deposit.${dep_id}.applied_to_balance == 3058.06"
            - "Deposit.${dep_id}.refunded_amount == 3139.44"
            - "Deposit.${dep_id}.forfeited_amount == 0.00"
            - "Deposit.${dep_id}.held_remaining == 0.00"
            - "Deposit.${dep_id}.state == REFUNDED"
            - "Invoice.${inv_id}.total_due == 0.00"

      - name: early_destage_then_escrow_reversal_conserves_billed_cycles
        grounds:
          - conservation_invariants.lease_billed_cycle_conservation
          - state_machines.Lease.ACTIVE_to_ENDING
          - state_machines.Lease.ENDING_to_ACTIVE
          - calculations.lease_term_cycles
          - calculations.pickup_window
        distinguishing_aspect: |
          CONSERVED QUANTITY 3 — BILLED LEASE CYCLES, neither a unit count nor money. The
          forward action (listing under contract, an early de-stage 120 days ahead of
          end_date) and its compensating action (fall-out-of-escrow) both move the pickup
          window but leave billed_cycles at 4 and end_date at 2026-10-08T09:00:00Z, proving
          the early de-stage never shortened the billing.
        test_recipe:
          setup:
            - "The canonical VACANT project staged 2026-06-10T09:00:00Z with a four-cycle lease ending 2026-10-08T09:00:00Z."
          setup_api_calls: *v_staged
          trigger:
            - call: "POST /staging/listings/${listing_id}/under-contract"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /staging/listings/${listing_id}/fall-out-of-escrow"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "GET /staging/leases/${lease_id}"
              payload: {}
              as: StagingCoordinator
          assert:
            - "Lease.${lease_id}.state == ACTIVE"
            - "Lease.${lease_id}.initial_cycles == 4"
            - "Lease.${lease_id}.extension_cycles == 0"
            - "Lease.${lease_id}.billed_cycles == 4"
            - "Lease.${lease_id}.start_date == 2026-06-10T09:00:00.000Z"
            - "Lease.${lease_id}.end_date == 2026-10-08T09:00:00.000Z"
            - "Lease.${lease_id}.monthly_rent == 1867.50"
