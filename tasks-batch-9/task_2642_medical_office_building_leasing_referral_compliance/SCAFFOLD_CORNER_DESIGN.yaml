        claim_type: action_endpoint
        grounds:
          - endpoints[POST /compliance-cases]
          - endpoints[POST /compliance-cases/{id}/transitions]
        excluded_because:
          difficulty_instance: daily_close_delinquency_cascades_to_watch_case_concession_lock_and_booking_cancellation
