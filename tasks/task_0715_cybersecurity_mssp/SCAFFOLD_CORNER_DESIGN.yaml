        claim_type: Cross-entity validation
        grounds:
          - validations[priority=26]
          - errors[ERR_CLIENT_NOT_ACTIVE]
          - state_machines.Alert.TRIAGED_to_PROMOTED
        distinguishing_aspect: "Promoting a TRIAGED alert while its Client has been SUSPENDED returns ERR_CLIENT_NOT_ACTIVE (409)."
        test_recipe:
