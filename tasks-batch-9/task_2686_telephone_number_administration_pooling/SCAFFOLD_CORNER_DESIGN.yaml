            - "GET /numbering/rate-centers/${rc2_id}/blocks reads total_count == 0 while GET /numbering/rate-centers/${rc_id}/blocks reads total_count == 1 with block_label \"614-555-0\""

      - name: duplicate_filing_period_for_the_same_carrier_and_rate_center
