  # ===========================================================================
  # RULE 3 — non_linear_state_machine  (3 instances on three DIFFERENT entities:
  #          Conference (bounded cycle), Abstract (parallel dimensions),
  #          DiscrepancyCase (fork + join))
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: conference_cfa_reopen_cycle_is_bounded_at_one_extension
        grounds:
          - state_machines.Conference.CFA_CLOSED_to_CFA_OPEN
          - state_machines.Conference.CFA_OPEN_to_CFA_CLOSED
          - entities.Conference.fields.cfa_extension_count
          - entities.Conference.fields.abstract_deadline_utc
          - validations[priority=10]
        distinguishing_aspect: |
          Conference carries a genuine cycle CFA_OPEN -> CFA_CLOSED -> CFA_OPEN
          whose traversal count is bounded by cfa_extension_count: the first
          re-entry succeeds and rewrites abstract_deadline_utc to
          2026-03-20T23:59:00Z, the second re-entry is refused with
          ERR_CFA_EXTENSION_LIMIT and leaves the conference in CFA_CLOSED.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z."
            - "Conference GOS26 with abstract_deadline_utc 2026-03-01T23:59:00Z and review_deadline_utc 2026-05-01T23:59:00Z."
            - "One SubmissionCategory so DRAFT -> CFA_OPEN is legal."
            - "Conference driven DRAFT -> CFA_OPEN -> CFA_CLOSED, cfa_extension_count still 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "EDU", name: "Education Research", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], requires_structured_body: false, min_reviews_required: 2, discrepancy_threshold: 4.00, cme_eligible: false }
              as: ConferenceAdmin
              captures: { cat_edu_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_CLOSED" }
              as: ConferenceAdmin
          trigger:
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN", new_abstract_deadline_utc: "2026-03-20T23:59:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_CLOSED" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN", new_abstract_deadline_utc: "2026-04-01T23:59:00Z" }
              as: ConferenceAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the first trigger call returns 200 and Conference.${conf_id}.cfa_extension_count == 1"
            - "Conference.${conf_id}.abstract_deadline_utc == 2026-03-20T23:59:00Z"
            - "the third trigger call returns 409 with error_id == ERR_CFA_EXTENSION_LIMIT"
            - "Conference.${conf_id}.status == CFA_CLOSED"
            - "Conference.${conf_id}.cfa_extension_count == 1"
            - "Conference.${conf_id}.abstract_deadline_utc == 2026-03-20T23:59:00Z"

      - name: abstract_status_and_embargo_dimensions_advance_independently
        grounds:
          - state_machines.Abstract.ACCEPTED_to_CONFIRMED
          - state_machines.Abstract.NONE_to_EMBARGOED
          - state_machines.Abstract.EMBARGOED_to_BREACHED
          - entities.Abstract.fields.embargo_status
          - entities.Author.fields.embargo_breach_count
          - state_machines.Author.NONE_to_WARNED
        distinguishing_aspect: |
          Abstract runs two parallel state dimensions on one row: the status
          dimension advances ACCEPTED -> CONFIRMED under the Author while the
          embargo dimension advances EMBARGOED -> BREACHED under the
          PressOfficer, and after both calls the row reads status CONFIRMED AND
          embargo_status BREACHED - neither transition rewrote the other
          dimension.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z."
            - "Conference GOS26 at DECISIONS_RELEASED; Author Ada is_registered true."
            - "One abstract by Ada with is_newsworthy true, two SUBMITTED reviews, decided ACCEPTED/ORAL."
            - "PressOfficer has already set an embargo until 2026-09-02T12:00:00Z, so embargo_status == EMBARGOED while status == ACCEPTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
