        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-item]
          - errors[ERR_STALE_MATERIAL_VERSION]
        distinguishing_aspect: "After a first reservation advances MaterialItem.version from 1 to 2, a second reservation still carrying expected_material_item_version 1 is rejected ERR_STALE_MATERIAL_VERSION (412) — two strictly sequential requests."
        test_recipe:
