      - name: build_ship_consignment_per_shipment_vs_store_aggregate
        grounds:
          - calculations.consignment_settlement
          - state_machines.BuildShipOrder.READY_FOR_PICKUP_to_HANDED_TO_CARRIER
        distinguishing_aspect: |
          On the BuildShipOrder domain the commissioning variant used by
          consignment_settlement (aggregate over a half-open handoff window:
          round(gmv*18%) once, then bonus = round(commission/count)) differs
          from the naive per-shipment reading (round each order's 18% then sum).
          For 10 orders of 4999 each: aggregate gives commission 8998 and bonus
          900; per-shipment rounding would give 10 * 900 = 9000 commission, a
          different number for identical inputs.
