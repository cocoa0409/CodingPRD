          trigger:
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-11-05", hours_worked: 8, lines: [ { allocation_id: "${ala}", cut_count: 100 }, { allocation_id: "${alb}", cut_count: 100 } ] }, as: CrewLead, as_user_id: "${crw}", captures: { tkt: $.data.id } }
          assert:
            - "HarvestTicket.${tkt}.piece_total_cents == 60000 (100*380 + 100*220)"
            - "HarvestTicket.${tkt}.hourly_floor_cents == 60000 (5*8*1500) — exact tie"
            - "HarvestTicket.${tkt}.gross_pay_cents == 60000 and pay_basis == PIECE (tie resolves to PIECE)"

