  - section: consistency_model
    instances:
      - name: acceptance_response_already_reflects_the_whole_cascade
        claim_type: immediate
        grounds:
          - consistency_model
          - state_machines.ProofOfLoss.UNDER_REVIEW_to_ACCEPTED
        distinguishing_aspect: |
          The model is immediate, not eventual: the accept response itself carries the final assessed figures,
          and reads issued straight afterwards - with no epoch call, no retry and no polling - already show the
          settled claim, the posted payment, the eroded section and the eroded tower.
