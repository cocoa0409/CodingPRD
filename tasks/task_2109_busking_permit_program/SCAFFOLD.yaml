scenario: "desgin task harder than expert level.!!!! 2109. Street Performer & Busking Permit Program (city busking permit program): permit application & audition/vetting where required, designated pitch/zone assignment & time limits, amplification & noise ordinance compliance, rotation/lottery for premium locations, complaint intake & permit suspension, permit fee & renewal cycle, coordination with special events & closures, performer conduct guidelines"
domain_name: busking-permit-program
api_prefix: /busking

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by foreign keys; no entity is nested inside another in
  # any URL path. Every collection sits directly under /busking/<collection>.

  state_machine_shape: cyclic
  # PermitApplication loops CHANGES_REQUESTED -> SUBMITTED -> UNDER_REVIEW ->
  # CHANGES_REQUESTED; Permit carries two INDEPENDENT state axes on one row
  # (lifecycle_status x compliance_status), and compliance_status itself cycles
  # CLEAR -> WARNED -> SUSPENDED -> CLEAR; Complaint forks OPEN -> {TRIAGED,
  # MEDIATION} and joins on {UPHELD, DISMISSED} with divergent side effects per
  # branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential      # Pitch.fallback_pitch_id -> Pitch.id
    - cross_aggregate       # Complaint -> Permit -> Performer; NoiseReading -> SessionBooking -> Pitch/Zone

  role_model: segregation_of_duties
  # The PermitOfficer user id that finalizes an Audition may not decide the same
  # PermitApplication; the PermitOfficer user id that triages a Complaint may not
  # adjudicate it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Zone
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable district name."
      - name: code
        type: string
        source: input
        description: "Short district code; unique across all Zone rows."
        constraints: "1-16 chars; unique (case-sensitive)"
      - name: base_noise_cap_db
        type: integer
        source: input
        description: "Ordinance base sound-pressure ceiling for the district, in whole dB."
        constraints: "55..100"
      - name: weekend_noise_bonus_db
        type: integer
        source: input
        default: 0
        description: "dB added to base_noise_cap_db when the measurement instant falls on a Saturday or Sunday (UTC)."
        constraints: "0..10"
      - name: evening_start_minute
        type: integer
        source: input
        description: "Minute-of-day (UTC) at or after which the evening noise penalty applies."
        constraints: "0..1439"
      - name: evening_penalty_db
        type: integer
        source: input
        default: 0
        description: "dB subtracted from the cap when the measurement instant is at or after evening_start_minute."
        constraints: "0..20"
      - name: quiet_hours_start_minute
        type: integer
        source: input
        description: "Minute-of-day (UTC) at which the ordinance quiet window opens. Window may wrap midnight."
        constraints: "0..1439"
      - name: quiet_hours_end_minute
        type: integer
        source: input
        description: "Minute-of-day (UTC) at which the ordinance quiet window closes. When equal to quiet_hours_start_minute the zone has NO quiet window."
        constraints: "0..1439"
      - name: max_concurrent_closures
        type: integer
        source: input
        default: 1
        description: "Aggregate ceiling on how many ClosureOrder rows with status IN {DRAFT, ACTIVE} may cover any single instant in this zone."
        constraints: "1..5"
      - name: active_closure_count
        type: integer
        source: computed
        default: 0
        description: "Count of ClosureOrder rows with zone_id = this Zone and status = ACTIVE. Recomputed on every ClosureOrder activation and on every ops-run lift."

  - name: Pitch
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the ordinance district this pitch sits in."
      - name: code
        type: string
        source: input
        description: "Pitch placard code; unique across all Pitch rows."
        constraints: "1-16 chars; unique (case-sensitive)"
      - name: tier
        type: enum
        source: input
        description: "PREMIUM pitches are allocated only through LotteryDraw; STANDARD pitches are booked directly."
        constraints: "PREMIUM | STANDARD"
      - name: amplification_allowed
        type: boolean
        source: input
        default: false
        description: "Whether any amplified act may occupy this pitch."
      - name: noise_cap_db
        type: integer
        source: input
        description: "Pitch-specific sound ceiling in whole dB; the effective cap is the min of this and the zone allowance."
        constraints: "55..100"
      - name: max_session_minutes
        type: integer
        source: input
        default: 120
        description: "Hard ceiling on the duration of any single SessionBooking on this pitch."
        constraints: "15..240"
      - name: daily_session_cap
        type: integer
        source: input
        default: 3
        description: "Maximum number of SessionBooking rows on this pitch with status IN {RESERVED, RELOCATED, COMPLETED} sharing one UTC calendar date."
        constraints: "1..12"
      - name: premium_slots_per_draw
        type: integer
        source: input
        default: 1
        description: "Number of winners a LotteryDraw on this pitch awards."
        constraints: "1..5"
      - name: fallback_pitch_id
        type: string
        source: input
        default: null
        description: "FK -> Pitch.id; nullable self-reference. The pitch that a closure-displaced booking is relocated to. Must belong to the same zone_id and must not equal this pitch."
      - name: availability_status
        type: enum
        source: computed
        default: OPEN
        description: "OPEN until an overlapping ClosureOrder is ACTIVE, then CLOSED; returns to OPEN on the ops-run that lifts the last covering closure."
        constraints: "OPEN | CLOSED"

  - name: Performer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name on the city ID check."
      - name: stage_name
        type: string
        source: input
        description: "Name shown on the permit placard."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across all Performer rows."
        constraints: "unique (case-insensitive)"
      - name: act_type
        type: enum
        source: input
        description: "Primary act classification used as the fee basis."
        constraints: "ACOUSTIC_MUSIC | AMPLIFIED_MUSIC | STREET_THEATRE | VISUAL_ART | CIRCUS_SKILL"
      - name: conduct_score
        type: integer
        source: computed
        default: 100
        description: "Live conduct score produced by calculations.performer_conduct_scoring variant ROLLING_365. Recomputed on every complaint adjudication and on every ops-run."
        constraints: "0..100"
      - name: renewal_conduct_score
        type: integer
        source: computed
        default: 100
        description: "Career-weighted conduct score produced by calculations.performer_conduct_scoring variant CAREER_WEIGHTED; used ONLY as the renewal gate. Recomputed at the same instants as conduct_score."
        constraints: "0..100"
      - name: standing
        type: enum
        source: computed
        default: GOOD
        description: "GOOD when conduct_score >= 80; WATCH when 60 <= conduct_score < 80; BARRED when conduct_score < 60."
        constraints: "GOOD | WATCH | BARRED"
      - name: upheld_complaint_count
        type: integer
        source: computed
        default: 0
        description: "Count of Complaint rows whose permit_id resolves to a Permit with this performer_id and whose status = UPHELD."
      - name: premium_wins_this_season
        type: integer
        source: computed
        default: 0
        description: "Count of LotteryEntry rows for this performer with status = WON in the current season_year. Drives the rotation priority band. Reset to 0 when a renewal invoice is paid."

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: performer_id
        type: string
        source: input
        description: "FK -> Performer.id; the applicant."
      - name: requested_zone_id
        type: string
        source: input
        description: "FK -> Zone.id; district the applicant wants to work."
      - name: season_year
        type: integer
        source: input
        description: "Calendar year the permit would cover."
        constraints: "2025..2035"
      - name: requested_act_type
        type: enum
        source: input
        description: "Act classification requested on this application; the fee basis."
        constraints: "ACOUSTIC_MUSIC | AMPLIFIED_MUSIC | STREET_THEATRE | VISUAL_ART | CIRCUS_SKILL"
      - name: amplification_requested
        type: boolean
        source: input
        default: false
        description: "Whether the applicant asks for an amplification endorsement."
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Application lifecycle state; see state_machines[entity=PermitApplication]."
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | AUDITION_REQUIRED | AUDITION_SCHEDULED | AUDITION_PASSED | AUDITION_FAILED | CHANGES_REQUESTED | APPROVED | REJECTED"
      - name: requires_audition
        type: boolean
        source: computed
        default: false
        description: "Recomputed on every submit and every revision: true iff requested_act_type IN {AMPLIFIED_MUSIC, CIRCUS_SKILL} OR amplification_requested = true OR the applicant's Performer.standing = WATCH."
      - name: revision_count
        type: integer
        source: computed
        default: 0
        description: "Number of accepted revisions; incremented by POST /busking/permit-applications/{id}/revisions."
      - name: change_request_reason
        type: string
        source: computed
        default: null
        description: "decision_note carried over when the officer routes the application to CHANGES_REQUESTED."
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the PermitOfficer who most recently called the review endpoint."
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the PermitOfficer who issued the terminal decision."
      - name: submitted_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the most recent submit or revision."
      - name: decided_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the APPROVED/REJECTED decision."
      - name: assessed_fee_cents
        type: integer
        source: computed
        default: 0
        description: "amount_due_cents of the INITIAL FeeInvoice minted at approval; 0 until then."

  - name: Audition
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id; the application being vetted."
      - name: scheduled_for
        type: datetime
        source: input
        description: "Panel sitting instant, ISO 8601 UTC."
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: "Audition lifecycle state; see state_machines[entity=Audition]."
        constraints: "SCHEDULED | PASSED | FAILED | CANCELLED"
      - name: panel_score
        type: number
        source: computed
        default: null
        description: "Panel composite produced by calculations.audition_panel_score, 2 decimal places. Null until finalize."
        constraints: "0.00..10.00"
      - name: score_count
        type: integer
        source: computed
        default: 0
        description: "Number of AuditionScore rows filed against this audition."
      - name: finalized_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the PermitOfficer who finalized the panel result. Segregation-of-duties key: this user may not decide the parent application."
      - name: finalized_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of finalize."

  - name: AuditionScore
    parent: null
    common_fields: false
    fields:
      - name: audition_id
        type: string
        source: input
        description: "FK -> Audition.id; the sitting this score belongs to."
      - name: panelist_user_id
        type: string
        source: system
        description: "X-User-ID of the filing AuditionPanelist. At most one AuditionScore per (audition_id, panelist_user_id)."
      - name: technical_score
        type: integer
        source: input
        description: "Technical craft subscore."
        constraints: "0..10"
      - name: suitability_score
        type: integer
        source: input
        description: "Street-suitability subscore."
        constraints: "0..10"
      - name: safety_score
        type: integer
        source: input
        description: "Public-safety subscore."
        constraints: "0..10"
      - name: composite_score
        type: number
        source: computed
        description: "Per-panelist composite produced by calculations.audition_panel_score step 1, rounded to 2 decimal places at THIS level before any averaging."
        constraints: "0.00..10.00"

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> PermitApplication.id; the approved application that minted this permit."
      - name: performer_id
        type: string
        source: system
        description: "FK -> Performer.id; the permit holder. Ownership key for the Performer role."
      - name: permit_number
        type: string
        source: system
        description: "Placard number stamped at issue, format BP-<season_year>-<zero-padded 4-digit sequence>."
      - name: season_year
        type: integer
        source: computed
        description: "Season the permit currently covers."
      - name: next_season_year
        type: integer
        source: computed
        default: null
        description: "Season requested on an in-flight renewal; null outside RENEWAL_PENDING."
      - name: lifecycle_status
        type: enum
        source: computed
        default: PENDING_FEE
        description: "Fee/renewal axis; evolves independently of compliance_status. See state_machines[entity=Permit, state_field=lifecycle_status]."
        constraints: "PENDING_FEE | ACTIVE | RENEWAL_PENDING | EXPIRED | REVOKED"
      - name: compliance_status
        type: enum
        source: computed
        default: CLEAR
        description: "Enforcement axis; evolves independently of lifecycle_status. See state_machines[entity=Permit, state_field=compliance_status]."
        constraints: "CLEAR | WARNED | SUSPENDED"
      - name: amplification_endorsed
        type: boolean
        source: computed
        default: false
        description: "Copied from PermitApplication.amplification_requested at issue; gates amplified bookings."
      - name: season_minutes_used
        type: integer
        source: computed
        default: 0
        description: "Denormalized minute ledger. INVARIANT: equals SUM(SessionBooking.duration_minutes) over rows with this permit_id and status IN {RESERVED, RELOCATED, COMPLETED}. Reset to 0 when a RENEWAL invoice is paid."
      - name: closure_credit_minutes
        type: integer
        source: computed
        default: 0
        description: "Cumulative minutes refunded to this permit because a ClosureOrder cancelled a booking outright. Reset to 0 when a RENEWAL invoice is paid."
      - name: noise_violation_count
        type: integer
        source: computed
        default: 0
        description: "Count of NoiseReading rows with verdict = VIOLATION against this permit's bookings since the last reinstatement. Reset to 0 on reinstate and on renewal payment."
      - name: net_fees_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Denormalized money ledger. INVARIANT: equals SUM(FeeInvoice.amount_paid_cents) - SUM(FeeInvoice.refunded_cents) over all FeeInvoice rows with this permit_id."
      - name: activated_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant lifecycle_status first became ACTIVE."
      - name: suspended_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant compliance_status most recently became SUSPENDED."

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: system
        description: "FK -> Permit.id; the permit this charge belongs to."
      - name: invoice_kind
        type: enum
        source: computed
        description: "INITIAL when minted by an application approval; RENEWAL when minted by a renewal request."
        constraints: "INITIAL | RENEWAL"
      - name: fee_variant
        type: enum
        source: computed
        description: "Which calculations.permit_fee_assessment variant produced amount_due_cents."
        constraints: "FULL_SEASON | PRORATED"
      - name: gross_fee_cents
        type: integer
        source: computed
        description: "Step-1 output of calculations.permit_fee_assessment (base + amplification surcharge)."
      - name: discount_cents
        type: integer
        source: computed
        description: "Step-3 output of calculations.permit_fee_assessment."
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Step-4 output of calculations.permit_fee_assessment."
      - name: months_covered
        type: integer
        source: computed
        description: "12 for FULL_SEASON; 13 - coverage_start_month for PRORATED."
      - name: coverage_start_month
        type: integer
        source: computed
        description: "1 for FULL_SEASON; the UTC calendar month of issued_at for PRORATED."
        constraints: "1..12"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "Final charge for this invoice."
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Cents actually received; equals amount_due_cents once status = PAID."
      - name: refunded_cents
        type: integer
        source: computed
        default: 0
        description: "Cents returned by a revocation refund."
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: "Invoice lifecycle state; see state_machines[entity=FeeInvoice]."
        constraints: "PENDING | PAID | PAST_DUE | REFUNDED | VOID"
      - name: issued_at
        type: datetime
        source: computed
        description: "Logical-clock instant the invoice was minted."
      - name: due_at
        type: datetime
        source: computed
        description: "issued_at + INVOICE_DUE_DAYS days."
      - name: paid_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of payment."

  - name: LotteryDraw
    parent: null
    common_fields: true
    fields:
      - name: pitch_id
        type: string
        source: input
        description: "FK -> Pitch.id; must be a PREMIUM pitch. The draw reserves the slot window on this pitch from creation."
      - name: season_year
        type: integer
        source: input
        description: "Season the draw allocates for; entrants' permits must match."
        constraints: "2026..2035"
      - name: slot_start_at
        type: datetime
        source: input
        description: "Start of the premium slot being allocated, ISO 8601 UTC."
      - name: slot_end_at
        type: datetime
        source: input
        description: "End of the premium slot being allocated, ISO 8601 UTC; must be after slot_start_at."
      - name: entry_deadline_at
        type: datetime
        source: input
        description: "Instant after which entries close and the draw may be executed; must be strictly before slot_start_at."
      - name: winner_slots
        type: integer
        source: computed
        description: "Copied from Pitch.premium_slots_per_draw at creation."
      - name: entry_count
        type: integer
        source: computed
        default: 0
        description: "Number of LotteryEntry rows filed against this draw."
      - name: winner_count
        type: integer
        source: computed
        default: 0
        description: "Number of entries promoted to WON by execute."
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "Draw lifecycle state; see state_machines[entity=LotteryDraw]."
        constraints: "OPEN | DRAWN | VOID"
      - name: executed_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant execute ran."

  - name: LotteryEntry
    parent: null
    common_fields: true
    fields:
      - name: draw_id
        type: string
        source: system
        description: "FK -> LotteryDraw.id; taken from the request path."
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit competing for the slot."
      - name: priority_band
        type: integer
        source: computed
        default: null
        description: "Rotation band assigned at execute time: 1 when the entrant's Performer.premium_wins_this_season = 0, 2 when = 1, 3 when >= 2. Null until execute."
        constraints: "1..3"
      - name: rank_position
        type: integer
        source: computed
        default: null
        description: "1-based position of this entry in the execute ranking over the eligible candidate set. Null when the entry was filtered out of the candidate set."
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Entry lifecycle state; see state_machines[entity=LotteryEntry]."
        constraints: "SUBMITTED | WON | LOST | FORFEITED"

  - name: SessionBooking
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit occupying the pitch."
      - name: pitch_id
        type: string
        source: input
        description: "FK -> Pitch.id; the pitch currently occupied (mutated to the fallback pitch on relocation)."
      - name: lottery_entry_id
        type: string
        source: system
        default: null
        description: "FK -> LotteryEntry.id; set only on bookings minted by a draw execution."
      - name: relocated_from_pitch_id
        type: string
        source: computed
        default: null
        description: "FK -> Pitch.id; the pitch this booking originally occupied before a closure relocation."
      - name: start_at
        type: datetime
        source: input
        description: "Occupation start, ISO 8601 UTC. Intervals are half-open [start_at, end_at)."
      - name: end_at
        type: datetime
        source: input
        description: "Occupation end, ISO 8601 UTC; must be strictly after start_at."
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between start_at and end_at."
      - name: amplification_planned
        type: boolean
        source: input
        default: false
        description: "Whether the performer will amplify during this session."
      - name: origin
        type: enum
        source: computed
        default: DIRECT
        description: "DIRECT for self-service bookings; LOTTERY for bookings minted by a draw execution."
        constraints: "DIRECT | LOTTERY"
      - name: effective_noise_cap_db
        type: integer
        source: computed
        description: "calculations.effective_noise_cap evaluated at start_at with the permit's compliance_status as of booking creation. Advisory snapshot; a NoiseReading recomputes its own cap at taken_at."
      - name: noise_violation_count
        type: integer
        source: computed
        default: 0
        description: "Count of NoiseReading rows against this booking with verdict = VIOLATION."
      - name: status
        type: enum
        source: computed
        default: RESERVED
        description: "Booking lifecycle state; see state_machines[entity=SessionBooking]."
        constraints: "RESERVED | RELOCATED | COMPLETED | CANCELLED_BY_PERFORMER | CANCELLED_BY_CLOSURE | CANCELLED_BY_SUSPENSION | CANCELLED_BY_REVOCATION | CANCELLED_BY_EXPIRY"

  - name: NoiseReading
    parent: null
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> SessionBooking.id; the session being metered."
      - name: inspector_user_id
        type: string
        source: system
        description: "X-User-ID of the filing NoiseInspector."
      - name: taken_at
        type: datetime
        source: input
        description: "Measurement instant, ISO 8601 UTC; must satisfy booking.start_at <= taken_at < booking.end_at."
      - name: reading_db
        type: integer
        source: input
        description: "Measured sound-pressure level in whole dB."
        constraints: "0..140"
      - name: effective_cap_db
        type: integer
        source: computed
        description: "calculations.effective_noise_cap evaluated at taken_at with the permit's compliance_status at filing time."
      - name: verdict
        type: enum
        source: computed
        description: "COMPLIANT when reading_db <= effective_cap_db; VIOLATION otherwise. The cap is INCLUSIVE."
        constraints: "COMPLIANT | VIOLATION"

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit complained about."
      - name: booking_id
        type: string
        source: input
        default: null
        description: "FK -> SessionBooking.id; optional session the complaint names. When present it must carry the same permit_id."
      - name: category
        type: enum
        source: input
        description: "Complaint classification."
        constraints: "NOISE | OBSTRUCTION | CONDUCT | UNPERMITTED_AMPLIFICATION"
      - name: description
        type: string
        source: input
        description: "Free-text narrative supplied by the complainant."
      - name: route
        type: enum
        source: computed
        default: null
        description: "Branch chosen at triage: DIRECT sends the complaint straight to adjudication; MEDIATION routes it through the mediation branch and halves the conduct deduction on an upheld outcome."
        constraints: "DIRECT | MEDIATION"
      - name: severity
        type: enum
        source: computed
        default: null
        description: "Severity assigned at triage; drives the conduct deduction."
        constraints: "MINOR | MODERATE | MAJOR"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "Complaint lifecycle state; see state_machines[entity=Complaint]."
        constraints: "OPEN | TRIAGED | MEDIATION | UPHELD | DISMISSED"
      - name: triaged_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the PermitOfficer who triaged. Segregation-of-duties key: this user may not adjudicate the same complaint."
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the PermitOfficer who adjudicated."
      - name: upheld_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant the complaint became UPHELD; the age key for both conduct-score variants."
      - name: conduct_deduction
        type: integer
        source: computed
        default: 0
        description: "Points charged against the performer when UPHELD; 0 while OPEN/TRIAGED/MEDIATION/DISMISSED."

  - name: ClosureOrder
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the district covered by the order."
      - name: pitch_id
        type: string
        source: input
        default: null
        description: "FK -> Pitch.id; when present the order covers only this pitch, otherwise every Pitch with the order's zone_id."
      - name: reason
        type: enum
        source: input
        description: "Why the street is being closed."
        constraints: "SPECIAL_EVENT | CONSTRUCTION | EMERGENCY | PARADE"
      - name: starts_at
        type: datetime
        source: input
        description: "Closure start, ISO 8601 UTC. Closure intervals are CLOSED [starts_at, ends_at] — endpoints are inside the closure."
      - name: ends_at
        type: datetime
        source: input
        description: "Closure end, ISO 8601 UTC; must be strictly after starts_at."
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Closure lifecycle state; see state_machines[entity=ClosureOrder]."
        constraints: "DRAFT | ACTIVE | LIFTED"
      - name: affected_booking_count
        type: integer
        source: computed
        default: 0
        description: "Number of SessionBooking rows the activation touched (relocated + cancelled)."
      - name: relocated_booking_count
        type: integer
        source: computed
        default: 0
        description: "Number of SessionBooking rows the activation moved to a fallback pitch."
      - name: cancelled_booking_count
        type: integer
        source: computed
        default: 0
        description: "Number of SessionBooking rows the activation cancelled outright."

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: PermitApplication
    state_field: status
    shape: cyclic_with_branching
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /busking/permit-applications/{id}/submit"
        actor: Performer
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == application.performer_id"
          - "no other PermitApplication for the same performer_id and season_year has status NOT IN {REJECTED} (checked at create, re-checked here)"
        side_effects:
          - "recompute requires_audition = requested_act_type IN {AMPLIFIED_MUSIC, CIRCUS_SKILL} OR amplification_requested == true OR Performer.standing == WATCH"
          - "set submitted_at = logical clock"
          - "increments PermitApplication.version by 1"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /busking/permit-applications/{id}/review"
        actor: PermitOfficer
        preconditions:
          - "status == SUBMITTED"
          - "requires_audition == false"
        side_effects:
          - "set reviewed_by_user_id = X-User-ID"
          - "increments PermitApplication.version by 1"
        note: "Branch A of the fork: no vetting needed, the officer may decide directly."

      - from: SUBMITTED
        to: AUDITION_REQUIRED
        trigger: "POST /busking/permit-applications/{id}/review"
        actor: PermitOfficer
        preconditions:
          - "status == SUBMITTED"
          - "requires_audition == true"
        side_effects:
          - "set reviewed_by_user_id = X-User-ID"
          - "increments PermitApplication.version by 1"
        note: "Branch B of the fork: the same endpoint lands in a different state purely on the computed requires_audition flag."

      - from: AUDITION_REQUIRED
        to: AUDITION_SCHEDULED
        trigger: "POST /busking/auditions"
        actor: PermitOfficer
        preconditions:
          - "status == AUDITION_REQUIRED"
          - "no Audition with this application_id has status == SCHEDULED"
        side_effects:
          - "creates an Audition row with status SCHEDULED, score_count 0, panel_score null"
          - "increments PermitApplication.version by 1"

      - from: AUDITION_SCHEDULED
        to: AUDITION_PASSED
        trigger: "POST /busking/auditions/{id}/finalize"
        actor: PermitOfficer
        preconditions:
          - "Audition.status == SCHEDULED"
          - "Audition.score_count >= AUDITION_MIN_PANELISTS"
          - "calculations.audition_panel_score result >= AUDITION_PASS_THRESHOLD"
        side_effects:
          - "Audition.status := PASSED, Audition.panel_score := computed value, Audition.finalized_by_user_id := X-User-ID, Audition.finalized_at := clock"
          - "increments PermitApplication.version by 1"

      - from: AUDITION_SCHEDULED
        to: AUDITION_FAILED
        trigger: "POST /busking/auditions/{id}/finalize"
        actor: PermitOfficer
        preconditions:
          - "Audition.status == SCHEDULED"
          - "Audition.score_count >= AUDITION_MIN_PANELISTS"
          - "calculations.audition_panel_score result < AUDITION_PASS_THRESHOLD"
        side_effects:
          - "Audition.status := FAILED, Audition.panel_score := computed value, Audition.finalized_by_user_id := X-User-ID, Audition.finalized_at := clock"
          - "increments PermitApplication.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /busking/permit-applications/{id}/decision with outcome=APPROVED"
        actor: PermitOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "requires_audition == false"
        side_effects:
          - "CASCADE L1: mints a Permit (lifecycle_status PENDING_FEE, compliance_status CLEAR, amplification_endorsed := application.amplification_requested, season_year := application.season_year)"
          - "CASCADE L2: the Permit creation itself mints a FeeInvoice (invoice_kind INITIAL, status PENDING) whose amount_due_cents comes from calculations.permit_fee_assessment"
          - "CASCADE L3: the FeeInvoice creation itself writes application.assessed_fee_cents := invoice.amount_due_cents"
          - "set decided_by_user_id = X-User-ID, decided_at = clock"
          - "increments PermitApplication.version by 1"

      - from: AUDITION_PASSED
        to: APPROVED
        trigger: "POST /busking/permit-applications/{id}/decision with outcome=APPROVED"
        actor: PermitOfficer
        preconditions:
          - "status == AUDITION_PASSED"
          - "X-User-ID != the Audition.finalized_by_user_id of the Audition with this application_id and status == PASSED"
        side_effects:
          - "CASCADE L1: mints a Permit (lifecycle_status PENDING_FEE, compliance_status CLEAR)"
          - "CASCADE L2: the Permit creation itself mints a FeeInvoice (invoice_kind INITIAL, status PENDING)"
          - "CASCADE L3: the FeeInvoice creation itself writes application.assessed_fee_cents := invoice.amount_due_cents"
          - "set decided_by_user_id = X-User-ID, decided_at = clock"
          - "increments PermitApplication.version by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /busking/permit-applications/{id}/decision with outcome=REJECTED"
        actor: PermitOfficer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "set decided_by_user_id = X-User-ID, decided_at = clock"
          - "any Audition with this application_id and status == SCHEDULED becomes CANCELLED"
          - "increments PermitApplication.version by 1"

      - from: AUDITION_PASSED
        to: REJECTED
        trigger: "POST /busking/permit-applications/{id}/decision with outcome=REJECTED"
        actor: PermitOfficer
        preconditions:
          - "status == AUDITION_PASSED"
        side_effects:
          - "set decided_by_user_id = X-User-ID, decided_at = clock"
          - "increments PermitApplication.version by 1"

      - from: AUDITION_SCHEDULED
        to: REJECTED
        trigger: "POST /busking/permit-applications/{id}/decision with outcome=REJECTED"
        actor: PermitOfficer
        preconditions:
          - "status == AUDITION_SCHEDULED"
        side_effects:
          - "the Audition with this application_id and status == SCHEDULED becomes CANCELLED with panel_score left null"
          - "set decided_by_user_id = X-User-ID, decided_at = clock"
          - "increments PermitApplication.version by 1"
        note: "The officer withdraws the application mid-vetting; this is the only producer of Audition.status == CANCELLED."

      - from: AUDITION_FAILED
        to: REJECTED
        trigger: "POST /busking/permit-applications/{id}/decision with outcome=REJECTED"
        actor: PermitOfficer
        preconditions:
          - "status == AUDITION_FAILED"
        side_effects:
          - "set decided_by_user_id = X-User-ID, decided_at = clock"
          - "increments PermitApplication.version by 1"

      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /busking/permit-applications/{id}/decision with outcome=CHANGES_REQUESTED"
        actor: PermitOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "decision_note is present and non-empty"
          - "revision_count < MAX_REVISIONS"
        side_effects:
          - "set change_request_reason = decision_note"
          - "increments PermitApplication.version by 1"

      - from: AUDITION_FAILED
        to: CHANGES_REQUESTED
        trigger: "POST /busking/permit-applications/{id}/decision with outcome=CHANGES_REQUESTED"
        actor: PermitOfficer
        preconditions:
          - "status == AUDITION_FAILED"
          - "decision_note is present and non-empty"
          - "revision_count < MAX_REVISIONS"
        side_effects:
          - "set change_request_reason = decision_note"
          - "the FAILED Audition stays FAILED; a fresh sitting is scheduled after the next review"
          - "increments PermitApplication.version by 1"

      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /busking/permit-applications/{id}/revisions"
        actor: Performer
        preconditions:
          - "status == CHANGES_REQUESTED"
          - "X-User-ID == application.performer_id"
          - "expected_application_version == application.version"
          - "revision_count < MAX_REVISIONS"
        side_effects:
          - "apply any supplied requested_act_type / amplification_requested / requested_zone_id overrides"
          - "revision_count += 1"
          - "recompute requires_audition from the post-override values"
          - "set submitted_at = clock, change_request_reason := null"
          - "any Audition with this application_id and status == SCHEDULED becomes CANCELLED"
          - "increments PermitApplication.version by 1"
        note: "The revision loop CHANGES_REQUESTED -> SUBMITTED -> UNDER_REVIEW -> CHANGES_REQUESTED is the cycle in this machine."

  - entity: Audition
    state_field: status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /busking/auditions/{id}/finalize"
        actor: PermitOfficer
        preconditions:
          - "status == SCHEDULED"
          - "score_count >= AUDITION_MIN_PANELISTS"
          - "calculations.audition_panel_score result >= AUDITION_PASS_THRESHOLD"
        side_effects:
          - "panel_score := calculations.audition_panel_score result"
          - "finalized_by_user_id := X-User-ID, finalized_at := clock"
          - "parent PermitApplication AUDITION_SCHEDULED -> AUDITION_PASSED"
          - "increments Audition.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /busking/auditions/{id}/finalize"
        actor: PermitOfficer
        preconditions:
          - "status == SCHEDULED"
          - "score_count >= AUDITION_MIN_PANELISTS"
          - "calculations.audition_panel_score result < AUDITION_PASS_THRESHOLD"
        side_effects:
          - "panel_score := calculations.audition_panel_score result"
          - "finalized_by_user_id := X-User-ID, finalized_at := clock"
          - "parent PermitApplication AUDITION_SCHEDULED -> AUDITION_FAILED"
          - "increments Audition.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: parent PermitApplication leaves the audition branch (revision accepted, or REJECTED decision)"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "panel_score stays null"
          - "increments Audition.version by 1"

  - entity: Permit
    state_field: lifecycle_status
    shape: cyclic
    initial_state: PENDING_FEE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: PENDING_FEE
        to: ACTIVE
        trigger: "POST /busking/fee-invoices/{id}/payments on the permit's INITIAL invoice"
        actor: Performer
        preconditions:
          - "invoice.status IN {PENDING, PAST_DUE}"
          - "invoice.invoice_kind == INITIAL"
          - "amount_cents == invoice.amount_due_cents"
        side_effects:
          - "CASCADE L1: FeeInvoice.status := PAID, amount_paid_cents := amount_cents, paid_at := clock"
          - "CASCADE L2: that payment itself credits Permit.net_fees_paid_cents += amount_paid_cents and moves lifecycle_status to ACTIVE, activated_at := clock"
          - "increments Permit.version by 1"
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /busking/permits/{id}/renew"
        actor: Performer
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "compliance_status == CLEAR"
          - "X-User-ID == permit.performer_id"
          - "clock is inside the renewal window for permit.season_year"
          - "Performer.renewal_conduct_score >= RENEWAL_MIN_CONDUCT"
          - "no FeeInvoice on this permit has status IN {PENDING, PAST_DUE}"
          - "season_year input == permit.season_year + 1"
        side_effects:
          - "next_season_year := season_year input"
          - "mints a FeeInvoice (invoice_kind RENEWAL, fee_variant FULL_SEASON, months_covered 12, coverage_start_month 1, status PENDING)"
          - "increments Permit.version by 1"
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /busking/fee-invoices/{id}/payments on the permit's RENEWAL invoice"
        actor: Performer
        preconditions:
          - "invoice.status IN {PENDING, PAST_DUE}"
          - "invoice.invoice_kind == RENEWAL"
          - "amount_cents == invoice.amount_due_cents"
        side_effects:
          - "FeeInvoice.status := PAID, paid_at := clock"
          - "season_year := next_season_year, next_season_year := null"
          - "season_minutes_used := 0, closure_credit_minutes := 0, noise_violation_count := 0"
          - "Performer.premium_wins_this_season := 0"
          - "net_fees_paid_cents += amount_paid_cents"
          - "increments Permit.version by 1"
        note: "This edge closes the renewal cycle ACTIVE -> RENEWAL_PENDING -> ACTIVE."
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /busking/ops-runs (step 2), when the permit's RENEWAL invoice passes its due_at unpaid"
        actor: PermitOfficer
        preconditions:
          - "lifecycle_status == RENEWAL_PENDING"
          - "the permit's RENEWAL FeeInvoice moves PENDING -> PAST_DUE in this same ops-run"
        side_effects:
          - "next_season_year := null — the renewal request lapses and the permit falls back to its current season"
          - "the PAST_DUE invoice is NOT voided; it keeps blocking new bookings and lottery entries via validations[priority=84] and keeps blocking a fresh renewal via validations[priority=85]"
          - "season_year, season_minutes_used and compliance_status are unchanged"
          - "increments Permit.version by 1"
        note: "The renewal lapse edge. It is the only way an ACTIVE permit can carry a PAST_DUE invoice, and therefore the only path to ERR_OUTSTANDING_INVOICE on a second renewal attempt."

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /busking/ops-runs (step 3)"
        actor: PermitOfficer
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "clock > season_end_utc(season_year)"
        side_effects:
          - "every SessionBooking with this permit_id, status IN {RESERVED, RELOCATED} and start_at > clock becomes CANCELLED_BY_EXPIRY, each crediting season_minutes_used -= duration_minutes"
          - "every LotteryEntry with this permit_id and status == SUBMITTED becomes FORFEITED"
          - "increments Permit.version by 1"
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "POST /busking/ops-runs (step 3)"
        actor: PermitOfficer
        preconditions:
          - "lifecycle_status == RENEWAL_PENDING"
          - "clock > season_end_utc(season_year)"
        side_effects:
          - "the unpaid RENEWAL FeeInvoice becomes VOID"
          - "every SessionBooking with this permit_id, status IN {RESERVED, RELOCATED} and start_at > clock becomes CANCELLED_BY_EXPIRY, each crediting season_minutes_used -= duration_minutes"
          - "increments Permit.version by 1"
      - from: PENDING_FEE
        to: REVOKED
        trigger: "POST /busking/permits/{id}/revoke"
        actor: PermitOfficer
        preconditions:
          - "lifecycle_status == PENDING_FEE"
        side_effects:
          - "every FeeInvoice on this permit with status IN {PENDING, PAST_DUE} becomes VOID"
          - "increments Permit.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /busking/permits/{id}/revoke"
        actor: PermitOfficer
        preconditions:
          - "lifecycle_status == ACTIVE"
        side_effects:
          - "CASCADE L1: lifecycle_status := REVOKED"
          - "CASCADE L2: the revocation itself refunds the PAID FeeInvoice per calculations.revocation_refund — invoice.refunded_cents := refund, invoice.status := REFUNDED, Permit.net_fees_paid_cents -= refund; any PENDING/PAST_DUE invoice becomes VOID"
          - "CASCADE L3: the revocation also cancels every SessionBooking with this permit_id, status IN {RESERVED, RELOCATED} and start_at > clock into CANCELLED_BY_REVOCATION"
          - "CASCADE L4: each such cancellation itself credits season_minutes_used -= duration_minutes"
          - "every LotteryEntry with this permit_id and status == SUBMITTED becomes FORFEITED"
          - "increments Permit.version by 1"
      - from: RENEWAL_PENDING
        to: REVOKED
        trigger: "POST /busking/permits/{id}/revoke"
        actor: PermitOfficer
        preconditions:
          - "lifecycle_status == RENEWAL_PENDING"
        side_effects:
          - "same refund / booking-cancellation / entry-forfeit cascade as the ACTIVE -> REVOKED edge"
          - "increments Permit.version by 1"

  - entity: Permit
    state_field: compliance_status
    shape: cyclic
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: WARNED
        trigger: "POST /busking/noise-readings whose verdict is VIOLATION"
        actor: NoiseInspector
        preconditions:
          - "compliance_status == CLEAR"
          - "permit.noise_violation_count reaches exactly NOISE_VIOLATIONS_FOR_WARNING after this reading"
        side_effects:
          - "subsequent effective_noise_cap evaluations subtract WARNED_PENALTY_DB"
          - "increments Permit.version by 1"
      - from: WARNED
        to: SUSPENDED
        trigger: "POST /busking/noise-readings whose verdict is VIOLATION"
        actor: NoiseInspector
        preconditions:
          - "compliance_status == WARNED"
          - "permit.noise_violation_count reaches NOISE_VIOLATIONS_FOR_SUSPENSION or more after this reading"
        side_effects:
          - "suspended_at := clock"
          - "every SessionBooking with this permit_id, status IN {RESERVED, RELOCATED} and start_at > clock becomes CANCELLED_BY_SUSPENSION, each crediting season_minutes_used -= duration_minutes"
          - "every LotteryEntry with this permit_id and status == SUBMITTED becomes FORFEITED"
          - "increments Permit.version by 1"
      - from: CLEAR
        to: SUSPENDED
        trigger: "system event: the holder's Performer.standing becomes BARRED (complaint adjudication or ops-run rescoring)"
        actor: system
        preconditions:
          - "compliance_status == CLEAR"
          - "Performer.standing == BARRED"
          - "lifecycle_status IN {PENDING_FEE, ACTIVE, RENEWAL_PENDING}"
        side_effects:
          - "suspended_at := clock"
          - "every SessionBooking with this permit_id, status IN {RESERVED, RELOCATED} and start_at > clock becomes CANCELLED_BY_SUSPENSION, each crediting season_minutes_used -= duration_minutes"
          - "every LotteryEntry with this permit_id and status == SUBMITTED becomes FORFEITED"
          - "increments Permit.version by 1"
      - from: WARNED
        to: SUSPENDED
        trigger: "system event: the holder's Performer.standing becomes BARRED (complaint adjudication or ops-run rescoring)"
        actor: system
        preconditions:
          - "compliance_status == WARNED"
          - "Performer.standing == BARRED"
          - "lifecycle_status IN {PENDING_FEE, ACTIVE, RENEWAL_PENDING}"
        side_effects:
          - "same suspension cascade as the CLEAR -> SUSPENDED edge"
          - "increments Permit.version by 1"
      - from: WARNED
        to: CLEAR
        trigger: "POST /busking/permits/{id}/reinstate"
        actor: PermitOfficer
        preconditions:
          - "compliance_status == WARNED"
          - "Performer.standing != BARRED"
        side_effects:
          - "noise_violation_count := 0"
          - "increments Permit.version by 1"
      - from: SUSPENDED
        to: CLEAR
        trigger: "POST /busking/permits/{id}/reinstate"
        actor: PermitOfficer
        preconditions:
          - "compliance_status == SUSPENDED"
          - "Performer.standing != BARRED"
        side_effects:
          - "noise_violation_count := 0, suspended_at := null"
          - "bookings cancelled while suspended are NOT restored"
          - "increments Permit.version by 1"
        note: "Reinstatement closes the enforcement cycle CLEAR -> WARNED -> SUSPENDED -> CLEAR. It is deliberately asymmetric: recovery of standing alone never auto-reinstates a permit."

  - entity: FeeInvoice
    state_field: status
    shape: branching
    initial_state: PENDING
    terminal_states: [REFUNDED, VOID]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /busking/fee-invoices/{id}/payments"
        actor: Performer
        preconditions:
          - "status == PENDING"
          - "amount_cents == amount_due_cents"
          - "X-User-ID == the permit's performer_id"
        side_effects:
          - "amount_paid_cents := amount_cents, paid_at := clock"
          - "Permit.net_fees_paid_cents += amount_paid_cents"
          - "parent Permit lifecycle transition PENDING_FEE -> ACTIVE or RENEWAL_PENDING -> ACTIVE"
          - "increments FeeInvoice.version by 1"
      - from: PENDING
        to: PAST_DUE
        trigger: "POST /busking/ops-runs (step 2)"
        actor: PermitOfficer
        preconditions:
          - "status == PENDING"
          - "clock > due_at"
        side_effects:
          - "the permit is now blocked from new bookings and lottery entries by validations[priority=84]"
          - "increments FeeInvoice.version by 1"
      - from: PAST_DUE
        to: PAID
        trigger: "POST /busking/fee-invoices/{id}/payments"
        actor: Performer
        preconditions:
          - "status == PAST_DUE"
          - "amount_cents == amount_due_cents"
        side_effects:
          - "same payment side effects as the PENDING -> PAID edge"
          - "increments FeeInvoice.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "POST /busking/permits/{id}/revoke"
        actor: PermitOfficer
        preconditions:
          - "status == PAID"
          - "the parent permit is transitioning to REVOKED"
        side_effects:
          - "refunded_cents := calculations.revocation_refund result"
          - "Permit.net_fees_paid_cents -= refunded_cents"
          - "increments FeeInvoice.version by 1"
      - from: PENDING
        to: VOID
        trigger: "POST /busking/permits/{id}/revoke, or POST /busking/ops-runs step 3 when a RENEWAL_PENDING permit expires"
        actor: PermitOfficer
        preconditions:
          - "status == PENDING"
          - "the parent permit is leaving the billable states"
        side_effects:
          - "increments FeeInvoice.version by 1"
      - from: PAST_DUE
        to: VOID
        trigger: "POST /busking/permits/{id}/revoke"
        actor: PermitOfficer
        preconditions:
          - "status == PAST_DUE"
          - "the parent permit is transitioning to REVOKED"
        side_effects:
          - "increments FeeInvoice.version by 1"

  - entity: LotteryDraw
    state_field: status
    shape: branching
    initial_state: OPEN
    terminal_states: [DRAWN, VOID]
    transitions:
      - from: OPEN
        to: DRAWN
        trigger: "POST /busking/lottery-draws/{id}/execute"
        actor: PermitOfficer
        preconditions:
          - "status == OPEN"
          - "clock > entry_deadline_at"
          - "entry_count >= 1"
          - "the eligible candidate set defined in calculations.lottery_winner_selection is non-empty"
        side_effects:
          - "CASCADE L1: the top winner_slots ranked candidates become LotteryEntry.status WON with rank_position 1..winner_slots; every other candidate becomes LOST with its own rank_position; entries filtered out of the candidate set become LOST with rank_position null"
          - "CASCADE L2: each WON entry itself mints a SessionBooking (origin LOTTERY, status RESERVED, pitch_id = draw.pitch_id, start_at = draw.slot_start_at, end_at = draw.slot_end_at, amplification_planned = permit.amplification_endorsed, lottery_entry_id = the entry id)"
          - "CASCADE L3: each minted SessionBooking itself debits Permit.season_minutes_used += duration_minutes and increments Permit.version by 1, and increments Performer.premium_wins_this_season by 1"
          - "winner_count := number of WON entries, executed_at := clock"
          - "increments LotteryDraw.version by 1"
      - from: OPEN
        to: VOID
        trigger: "POST /busking/lottery-draws/{id}/execute"
        actor: PermitOfficer
        preconditions:
          - "status == OPEN"
          - "clock > entry_deadline_at"
          - "entry_count >= 1"
          - "the eligible candidate set defined in calculations.lottery_winner_selection is EMPTY"
        side_effects:
          - "every LotteryEntry with this draw_id and status == SUBMITTED becomes LOST with rank_position null"
          - "winner_count := 0, executed_at := clock"
          - "no SessionBooking is minted and the pitch slot is released"
          - "increments LotteryDraw.version by 1"
        note: "Empty-candidate-pool fallback of the selector policy. Distinct from entry_count == 0, which is rejected with ERR_NO_ELIGIBLE_ENTRIES and leaves the draw OPEN."

  - entity: LotteryEntry
    state_field: status
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [WON, LOST, FORFEITED]
    transitions:
      - from: SUBMITTED
        to: WON
        trigger: "POST /busking/lottery-draws/{id}/execute"
        actor: PermitOfficer
        preconditions:
          - "entry is in the eligible candidate set"
          - "rank_position <= draw.winner_slots"
        side_effects:
          - "mints the awarded SessionBooking; see the LotteryDraw OPEN -> DRAWN cascade"
          - "increments LotteryEntry.version by 1"
      - from: SUBMITTED
        to: LOST
        trigger: "POST /busking/lottery-draws/{id}/execute"
        actor: PermitOfficer
        preconditions:
          - "entry was filtered out of the candidate set, or rank_position > draw.winner_slots"
        side_effects:
          - "increments LotteryEntry.version by 1"
      - from: SUBMITTED
        to: FORFEITED
        trigger: "system event: the entrant's Permit is suspended, revoked, or expired"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "the parent draw is still OPEN"
        side_effects:
          - "draw.entry_count is NOT decremented; a forfeited entry still counts as an entry but is filtered out of the candidate set"
          - "increments LotteryEntry.version by 1"

  - entity: SessionBooking
    state_field: status
    shape: branching
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED_BY_PERFORMER, CANCELLED_BY_CLOSURE, CANCELLED_BY_SUSPENSION, CANCELLED_BY_REVOCATION, CANCELLED_BY_EXPIRY]
    transitions:
      - from: RESERVED
        to: RELOCATED
        trigger: "POST /busking/closure-orders/{id}/activate"
        actor: PermitOfficer
        preconditions:
          - "status == RESERVED"
          - "the booking's pitch is covered by the activating closure and [start_at, end_at) intersects [closure.starts_at, closure.ends_at]"
          - "pitch.fallback_pitch_id is non-null AND that fallback pitch has availability_status == OPEN AND the buffered-overlap check on the fallback pitch passes"
        side_effects:
          - "relocated_from_pitch_id := old pitch_id, pitch_id := fallback pitch id"
          - "effective_noise_cap_db recomputed against the fallback pitch"
          - "Permit.season_minutes_used is UNCHANGED (relocated bookings still consume minutes)"
          - "increments SessionBooking.version by 1"
      - from: RESERVED
        to: CANCELLED_BY_CLOSURE
        trigger: "POST /busking/closure-orders/{id}/activate"
        actor: PermitOfficer
        preconditions:
          - "status == RESERVED"
          - "the booking's pitch is covered by the activating closure and the intervals intersect"
          - "no usable fallback pitch exists"
        side_effects:
          - "CASCADE: the cancellation itself credits Permit.season_minutes_used -= duration_minutes and Permit.closure_credit_minutes += duration_minutes, incrementing Permit.version by 1"
          - "increments SessionBooking.version by 1"
      - from: RELOCATED
        to: CANCELLED_BY_CLOSURE
        trigger: "POST /busking/closure-orders/{id}/activate"
        actor: PermitOfficer
        preconditions:
          - "status == RELOCATED"
          - "the fallback pitch is itself covered by a later activating closure with no further fallback"
        side_effects:
          - "same minute credit as the RESERVED -> CANCELLED_BY_CLOSURE edge"
          - "increments SessionBooking.version by 1"
      - from: RESERVED
        to: CANCELLED_BY_PERFORMER
        trigger: "POST /busking/session-bookings/{id}/cancel"
        actor: Performer
        preconditions:
          - "status IN {RESERVED, RELOCATED}"
          - "start_at > clock"
          - "X-User-ID == the permit's performer_id when the caller is a Performer"
        side_effects:
          - "COMPENSATION: Permit.season_minutes_used -= duration_minutes, restoring it to exactly its pre-booking value"
          - "Performer.premium_wins_this_season is deliberately NOT restored when origin == LOTTERY"
          - "increments Permit.version by 1"
          - "increments SessionBooking.version by 1"
      - from: RELOCATED
        to: CANCELLED_BY_PERFORMER
        trigger: "POST /busking/session-bookings/{id}/cancel"
        actor: Performer
        preconditions:
          - "status == RELOCATED"
          - "start_at > clock"
        side_effects:
          - "same minute compensation as the RESERVED -> CANCELLED_BY_PERFORMER edge"
          - "increments SessionBooking.version by 1"
      - from: RESERVED
        to: CANCELLED_BY_SUSPENSION
        trigger: "system event: the booking's Permit.compliance_status becomes SUSPENDED"
        actor: system
        preconditions:
          - "status IN {RESERVED, RELOCATED}"
          - "start_at > clock"
        side_effects:
          - "Permit.season_minutes_used -= duration_minutes"
          - "increments SessionBooking.version by 1"
      - from: RESERVED
        to: CANCELLED_BY_REVOCATION
        trigger: "system event: the booking's Permit.lifecycle_status becomes REVOKED"
        actor: system
        preconditions:
          - "status IN {RESERVED, RELOCATED}"
          - "start_at > clock"
        side_effects:
          - "Permit.season_minutes_used -= duration_minutes"
          - "increments SessionBooking.version by 1"
      - from: RESERVED
        to: CANCELLED_BY_EXPIRY
        trigger: "POST /busking/ops-runs (step 3)"
        actor: PermitOfficer
        preconditions:
          - "status IN {RESERVED, RELOCATED}"
          - "start_at > clock"
          - "the booking's Permit is expiring in this ops-run"
        side_effects:
          - "Permit.season_minutes_used -= duration_minutes"
          - "increments SessionBooking.version by 1"
      - from: RESERVED
        to: COMPLETED
        trigger: "POST /busking/ops-runs (step 4)"
        actor: PermitOfficer
        preconditions:
          - "status IN {RESERVED, RELOCATED}"
          - "end_at <= clock"
        side_effects:
          - "Permit.season_minutes_used is UNCHANGED (COMPLETED still counts toward the season cap)"
          - "increments SessionBooking.version by 1"
      - from: RELOCATED
        to: COMPLETED
        trigger: "POST /busking/ops-runs (step 4)"
        actor: PermitOfficer
        preconditions:
          - "status == RELOCATED"
          - "end_at <= clock"
        side_effects:
          - "Permit.season_minutes_used is UNCHANGED"
          - "increments SessionBooking.version by 1"

  - entity: Complaint
    state_field: status
    shape: fork_join
    initial_state: OPEN
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /busking/complaints/{id}/triage with route=DIRECT"
        actor: PermitOfficer
        preconditions:
          - "status == OPEN"
        side_effects:
          - "severity := input severity, route := DIRECT"
          - "triaged_by_user_id := X-User-ID"
          - "increments Complaint.version by 1"
        note: "Fork branch A. On an upheld outcome the FULL severity deduction is charged."
      - from: OPEN
        to: MEDIATION
        trigger: "POST /busking/complaints/{id}/triage with route=MEDIATION"
        actor: PermitOfficer
        preconditions:
          - "status == OPEN"
        side_effects:
          - "severity := input severity, route := MEDIATION"
          - "triaged_by_user_id := X-User-ID"
          - "increments Complaint.version by 1"
        note: "Fork branch B. On an upheld outcome the deduction is HALVED (round_half_up) — the two branches carry divergent side-effect sets."
      - from: TRIAGED
        to: UPHELD
        trigger: "POST /busking/complaints/{id}/adjudicate with outcome=UPHELD"
        actor: PermitOfficer
        preconditions:
          - "status == TRIAGED"
          - "X-User-ID != triaged_by_user_id"
        side_effects:
          - "CASCADE L1: conduct_deduction := SEVERITY_POINTS[severity]; upheld_at := clock; adjudicated_by_user_id := X-User-ID; Performer.upheld_complaint_count += 1"
          - "CASCADE L2: that deduction itself forces a recompute of Performer.conduct_score (calculations.performer_conduct_scoring variant ROLLING_365) and Performer.renewal_conduct_score (calculations.performer_conduct_scoring variant CAREER_WEIGHTED), which rewrites Performer.standing"
          - "CASCADE L3: when the rewritten Performer.standing == BARRED, every Permit of that performer with lifecycle_status IN {PENDING_FEE, ACTIVE, RENEWAL_PENDING} and compliance_status IN {CLEAR, WARNED} moves to compliance_status SUSPENDED"
          - "CASCADE L4: each such suspension itself cancels that permit's SessionBooking rows with status IN {RESERVED, RELOCATED} and start_at > clock into CANCELLED_BY_SUSPENSION (crediting season_minutes_used) and forfeits its SUBMITTED LotteryEntry rows"
          - "increments Complaint.version by 1"
      - from: MEDIATION
        to: UPHELD
        trigger: "POST /busking/complaints/{id}/adjudicate with outcome=UPHELD"
        actor: PermitOfficer
        preconditions:
          - "status == MEDIATION"
          - "X-User-ID != triaged_by_user_id"
        side_effects:
          - "conduct_deduction := round_half_up(SEVERITY_POINTS[severity] / 2) — the join point where the two fork branches diverge numerically"
          - "the same L2/L3/L4 cascade as the TRIAGED -> UPHELD edge"
          - "increments Complaint.version by 1"
      - from: TRIAGED
        to: DISMISSED
        trigger: "POST /busking/complaints/{id}/adjudicate with outcome=DISMISSED"
        actor: PermitOfficer
        preconditions:
          - "status == TRIAGED"
          - "X-User-ID != triaged_by_user_id"
        side_effects:
          - "conduct_deduction stays 0; no performer rescoring"
          - "adjudicated_by_user_id := X-User-ID"
          - "increments Complaint.version by 1"
      - from: MEDIATION
        to: DISMISSED
        trigger: "POST /busking/complaints/{id}/adjudicate with outcome=DISMISSED"
        actor: PermitOfficer
        preconditions:
          - "status == MEDIATION"
          - "X-User-ID != triaged_by_user_id"
        side_effects:
          - "conduct_deduction stays 0; no performer rescoring"
          - "increments Complaint.version by 1"

  - entity: ClosureOrder
    state_field: status
    shape: linear
    initial_state: DRAFT
    terminal_states: [LIFTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /busking/closure-orders/{id}/activate"
        actor: PermitOfficer
        preconditions:
          - "status == DRAFT"
          - "the count of ClosureOrder rows in the same zone with status == ACTIVE whose closed intervals intersect this one is < Zone.max_concurrent_closures"
        side_effects:
          - "CASCADE L1: status := ACTIVE and Zone.active_closure_count += 1"
          - "CASCADE L2: that activation itself sets availability_status := CLOSED on every Pitch in scope (the pitch_id when set, otherwise every Pitch with the order's zone_id)"
          - "CASCADE L3: each pitch closure itself displaces every SessionBooking on that pitch with status IN {RESERVED, RELOCATED} whose [start_at, end_at) intersects [starts_at, ends_at] — into RELOCATED when a usable fallback pitch exists, otherwise into CANCELLED_BY_CLOSURE"
          - "CASCADE L4: each CANCELLED_BY_CLOSURE booking itself credits Permit.season_minutes_used -= duration_minutes and Permit.closure_credit_minutes += duration_minutes"
          - "affected_booking_count, relocated_booking_count, cancelled_booking_count are written from the L3/L4 results"
          - "increments ClosureOrder.version by 1"
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /busking/ops-runs (step 1)"
        actor: PermitOfficer
        preconditions:
          - "status == ACTIVE"
          - "ends_at < clock"
        side_effects:
          - "Zone.active_closure_count -= 1"
          - "every Pitch in scope with no other ACTIVE ClosureOrder covering it returns to availability_status OPEN"
          - "bookings cancelled or relocated by this closure are NOT restored"
          - "increments ClosureOrder.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: application-revision-stale-version
    parent_entity: PermitApplication
    write_endpoint: "POST /busking/permit-applications/{id}/revisions"
    occ_field: "expected_application_version"
    description: |
      A revision legitimately supersedes whatever the officer last saw on the
      application, so a resubmission is not blocked by any state precondition
      once the application is CHANGES_REQUESTED. The system therefore rejects a
      revision whose expected_application_version does not equal the
      application's current version: the client is writing against a view of
      the application that has since advanced (a decision, an earlier accepted
      revision, or a cancelled audition all bump the version).
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: session-booking-stale-permit-version
    parent_entity: Permit
    write_endpoint: "POST /busking/session-bookings"
    occ_field: "expected_permit_version"
    description: |
      Booking a session against a permit is legitimate whenever the permit is
      ACTIVE and CLEAR, so a second booking request is not blocked by any state
      precondition. The system rejects a booking whose expected_permit_version
      does not equal the permit's current version, because the minute ledger,
      the compliance axis, or the endorsement flag the client reasoned about
      have since been rewritten by an earlier booking, cancellation, noise
      reading, closure cascade, or lottery award.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: permit_fee_assessment
    trigger: "Every FeeInvoice mint: PermitApplication -> APPROVED (invoice_kind INITIAL) and POST /busking/permits/{id}/renew (invoice_kind RENEWAL). Writes FeeInvoice.gross_fee_cents, discount_cents, admin_fee_cents, months_covered, coverage_start_month, fee_variant, amount_due_cents and PermitApplication.assessed_fee_cents."
    algorithm: tiered_pricing
    formula: |
      # ---- PINNED EVALUATION ORDER (this ordering is what makes the rule well-defined) ----
      # The discount tier AND the admin rate are both keyed on gross_fee_cents, the PRE-discount
      # figure. The admin fee is then charged on that same pre-discount gross. Evaluating the
      # discount first and re-tiering on the net (which "looks" equally reasonable because the
      # total feeds the tier and the tier feeds the total) yields a different, WRONG number.
      act    = INITIAL  -> PermitApplication.requested_act_type
               RENEWAL  -> the requested_act_type of the Permit's application_id row
      amped  = INITIAL  -> PermitApplication.amplification_requested
               RENEWAL  -> Permit.amplification_endorsed

      step 1: gross_fee_cents  = BASE_FEE_CENTS_BY_ACT[act] + (amped ? AMPLIFICATION_SURCHARGE_CENTS : 0)
      step 2: tier             = 1  if gross_fee_cents <= DISCOUNT_TIER_1_MAX_CENTS
                                 2  if DISCOUNT_TIER_1_MAX_CENTS < gross_fee_cents <= DISCOUNT_TIER_2_MAX_CENTS
                                 3  otherwise
              # tier 1 boundary is INCLUSIVE: gross == 15000 is tier 1, gross == 15001 is tier 2.
              # tier 2 boundary is INCLUSIVE: gross == 22000 is tier 2, gross == 22001 is tier 3.
      step 3: discount_cents   = round_half_up(gross_fee_cents * DISCOUNT_PCT[tier])
      step 4: admin_fee_cents  = round_half_up(gross_fee_cents * ADMIN_RATE[tier])
      step 5: season_total_cents = gross_fee_cents - discount_cents + admin_fee_cents
      step 6: apply the variant below to obtain amount_due_cents.
    input_set: "Exactly one act classification and one amplification flag, resolved as shown above. No other entity contributes."
    constants:
      BASE_FEE_CENTS_BY_ACT: { ACOUSTIC_MUSIC: 12000, AMPLIFIED_MUSIC: 18000, STREET_THEATRE: 15000, VISUAL_ART: 9000, CIRCUS_SKILL: 21000 }
      AMPLIFICATION_SURCHARGE_CENTS: 6500
      DISCOUNT_TIER_1_MAX_CENTS: 15000
      DISCOUNT_TIER_2_MAX_CENTS: 22000
      DISCOUNT_PCT: { 1: 0.00, 2: 0.10, 3: 0.15 }
      ADMIN_RATE: { 1: 0.08, 2: 0.06, 3: 0.05 }
      PRORATION_CUTOFF_MONTH: 6
      SEASON_MONTHS: 12
      INVOICE_DUE_DAYS: 14
    precision: "All money is integer cents; every multiplication is rounded with round_half_up to 0 decimal places at the step where it appears — never accumulated as a float and rounded once at the end."
    variants:
      - name: FULL_SEASON
        when: "invoice_kind == RENEWAL (always), or invoice_kind == INITIAL and month_utc(issued_at) <= PRORATION_CUTOFF_MONTH"
        difference: "coverage_start_month = 1, months_covered = 12, amount_due_cents = season_total_cents. The permit is billed for the whole season regardless of how much of it remains."
      - name: PRORATED
        when: "invoice_kind == INITIAL and month_utc(issued_at) > PRORATION_CUTOFF_MONTH"
        difference: "coverage_start_month = month_utc(issued_at), months_covered = 13 - coverage_start_month, amount_due_cents = round_half_up(season_total_cents * months_covered / 12). Identical application inputs therefore produce a strictly smaller charge than FULL_SEASON — e.g. AMPLIFIED_MUSIC with amplification is 22050 under FULL_SEASON and 9188 under PRORATED at a month-8 issue."

  - name: revocation_refund
    trigger: "POST /busking/permits/{id}/revoke, applied to every FeeInvoice on the permit with status == PAID in created_at ASC order."
    algorithm: waterfall_allocation
    formula: |
      if refund_mode == FULL_REFUND:   refund_cents = invoice.amount_paid_cents
      else:  # PRORATED_REFUND
          elapsed_months = month_utc(clock) - invoice.coverage_start_month + 1
          unused_months  = max(0, invoice.months_covered - elapsed_months)
          refund_cents   = round_half_up(invoice.amount_paid_cents * unused_months / invoice.months_covered)
      invoice.refunded_cents := refund_cents
      invoice.status         := REFUNDED
      Permit.net_fees_paid_cents -= refund_cents
    input_set: "FeeInvoice rows with permit_id == the revoked permit AND status == PAID. PENDING and PAST_DUE invoices are VOIDed instead and contribute 0."
    constants: {}
    precision: "Integer cents, round_half_up at the single division."
    variants:
      - name: PRORATED_REFUND
        when: "refund_mode input is omitted or PRORATED_REFUND (default)"
        difference: "Only the whole calendar months after the revocation month are returned."
      - name: FULL_REFUND
        when: "refund_mode input is FULL_REFUND"
        difference: "The entire amount_paid_cents is returned, so the forward payment and this compensating refund leave Permit.net_fees_paid_cents at exactly its pre-payment value."

  - name: audition_panel_score
    trigger: "POST /busking/auditions/{id}/finalize. Writes Audition.panel_score and picks the PASSED/FAILED edge."
    algorithm: weighted_scoring
    formula: |
      # ---- PINNED ROUNDING ORDER ----
      # Round EACH panelist's composite to 2 dp FIRST (persisted as AuditionScore.composite_score),
      # THEN average the ROUNDED values, THEN round the mean to 2 dp. Summing the raw un-rounded
      # composites and rounding once at the end is a DIFFERENT number and is WRONG.
      step 1 (per AuditionScore row):
          composite_score = round_half_up(
              (technical_score   * TECHNICAL_WEIGHT_NUM
             + suitability_score * SUITABILITY_WEIGHT_NUM
             + safety_score      * SAFETY_WEIGHT_NUM) / WEIGHT_DENOM , 2)
      step 2:
          panel_score = round_half_up(
              SUM(composite_score over the audition's AuditionScore rows, created_at ASC)
              / Audition.score_count , 2)
      step 3:
          PASSED when panel_score >= AUDITION_PASS_THRESHOLD, FAILED otherwise   # '>=' — equality PASSES
    input_set: "Every AuditionScore row with audition_id == this audition. No filtering by panelist; every filed score counts exactly once."
    constants:
      TECHNICAL_WEIGHT_NUM: 3
      SUITABILITY_WEIGHT_NUM: 2
      SAFETY_WEIGHT_NUM: 2
      WEIGHT_DENOM: 7
      AUDITION_MIN_PANELISTS: 3
      AUDITION_PASS_THRESHOLD: 7.00
    precision: "2 decimal places, round_half_up, applied twice: once per panelist row and once on the mean."

  - name: performer_conduct_scoring
    trigger: "Complaint TRIAGED|MEDIATION -> UPHELD, and POST /busking/ops-runs step 5. Writes Performer.conduct_score, Performer.renewal_conduct_score and Performer.standing."
    algorithm: decay_function
    formula: |
      UPHELD_SET(P) = every Complaint C with C.status == UPHELD whose C.permit_id resolves to a
                      Permit row whose performer_id == P.id, traversed in C.created_at ASC order.
      age_days(C)   = floor((clock - C.upheld_at) / 86400 seconds)

      charge_ROLLING(C)  = C.conduct_deduction                       if age_days(C) <= CONDUCT_WINDOW_DAYS
                           0                                          otherwise
      charge_CAREER(C)   = C.conduct_deduction                       if age_days(C) <= CONDUCT_WINDOW_DAYS
                           round_half_up(C.conduct_deduction / 2)     otherwise

      Performer.conduct_score         := max(0, 100 - SUM(charge_ROLLING(C) for C in UPHELD_SET(P)))
      Performer.renewal_conduct_score := max(0, 100 - SUM(charge_CAREER(C)  for C in UPHELD_SET(P)))

      Performer.standing := GOOD   when conduct_score >= STANDING_GOOD_MIN      # '>=' — 80 is GOOD
                            WATCH  when STANDING_WATCH_MIN <= conduct_score < STANDING_GOOD_MIN
                            BARRED when conduct_score < STANDING_WATCH_MIN      # 59 is BARRED, 60 is WATCH
    input_set: "Only Complaint rows in status UPHELD. OPEN, TRIAGED, MEDIATION and DISMISSED complaints contribute nothing, and a DISMISSED complaint never gets a conduct_deduction."
    constants:
      CONDUCT_WINDOW_DAYS: 365
      STANDING_GOOD_MIN: 80
      STANDING_WATCH_MIN: 60
      SEVERITY_POINTS: { MINOR: 5, MODERATE: 12, MAJOR: 25 }
      RENEWAL_MIN_CONDUCT: 80
    precision: "Integer points; the only rounding is round_half_up on the halved career charge (MAJOR 25 -> 13, MODERATE 12 -> 6, MINOR 5 -> 3)."
    variants:
      - name: ROLLING_365
        when: "Always, to produce the live Performer.conduct_score and Performer.standing that gate bookings, lottery eligibility and reinstatement."
        difference: "Complaints upheld more than CONDUCT_WINDOW_DAYS ago drop out of the sum entirely."
      - name: CAREER_WEIGHTED
        when: "Always, in the same pass, to produce Performer.renewal_conduct_score — the ONLY input to the renewal conduct gate."
        difference: "Complaints upheld more than CONDUCT_WINDOW_DAYS ago still charge half their deduction, so the same complaint history yields a strictly lower renewal score. A performer with one MAJOR upheld 500 days ago and one MODERATE upheld 31 days ago scores 88/GOOD live but 75 on the renewal gate and is refused renewal."

  - name: effective_noise_cap
    trigger: "POST /busking/session-bookings (evaluated at start_at, written to SessionBooking.effective_noise_cap_db) and POST /busking/noise-readings (evaluated at taken_at, written to NoiseReading.effective_cap_db and used for the verdict)."
    algorithm: threshold
    formula: |
      t = the evaluation instant (start_at for a booking snapshot, taken_at for a reading)
      is_weekend      = day_of_week_utc(t) IN {SATURDAY, SUNDAY}
      zone_allowance  = zone.base_noise_cap_db + (is_weekend ? zone.weekend_noise_bonus_db : 0)
      cap             = min(pitch.noise_cap_db, zone_allowance)
      if minute_of_day_utc(t) >= zone.evening_start_minute:  cap = cap - zone.evening_penalty_db
      if booking.amplification_planned:                      cap = cap - AMPLIFIED_PENALTY_DB
      if permit.compliance_status == WARNED:                 cap = cap - WARNED_PENALTY_DB
      effective_cap_db = max(cap, ABSOLUTE_FLOOR_DB)

      verdict = COMPLIANT when reading_db <= effective_cap_db else VIOLATION   # the cap is INCLUSIVE
      on VIOLATION: SessionBooking.noise_violation_count += 1 and Permit.noise_violation_count += 1,
                    then the Permit compliance escalation edges fire.
    input_set: "The reading's booking, that booking's current pitch (post-relocation, not relocated_from_pitch_id), that pitch's zone, and the booking's permit as of the filing instant."
    constants:
      AMPLIFIED_PENALTY_DB: 4
      WARNED_PENALTY_DB: 3
      ABSOLUTE_FLOOR_DB: 55
      NOISE_VIOLATIONS_FOR_WARNING: 2
      NOISE_VIOLATIONS_FOR_SUSPENSION: 4
    precision: "Whole dB; every term is an integer so no rounding occurs."

  - name: permit_minute_ledger
    trigger: "Every SessionBooking create, cancel, relocate, closure cancellation, suspension cancellation, revocation cancellation, expiry cancellation, and every RENEWAL payment."
    algorithm: aggregation
    formula: |
      duration_minutes = whole minutes between start_at and end_at (end_at is exclusive)

      INVARIANT_MINUTES(P):
        Permit.season_minutes_used
          == SUM(SessionBooking.duration_minutes)
             over SessionBooking rows with permit_id == P.id
             AND status IN {RESERVED, RELOCATED, COMPLETED}
        (bookings in any CANCELLED_* status contribute 0; RELOCATED and COMPLETED still contribute)

      admission test on POST /busking/session-bookings:
        Permit.season_minutes_used + duration_minutes <= SEASON_MINUTES_CAP    # '<=' — landing exactly
                                                                              # on the cap is ADMITTED
      A RENEWAL payment resets season_minutes_used to 0, which re-bases the invariant on the new season.
    input_set: "SessionBooking rows for one permit, filtered to status IN {RESERVED, RELOCATED, COMPLETED}. No time window: the season reset is what bounds the sum."
    constants:
      SEASON_MINUTES_CAP: 1800
    precision: "Whole minutes; no rounding."

  - name: permit_money_ledger
    trigger: "Every FeeInvoice payment and every revocation refund."
    algorithm: aggregation
    formula: |
      INVARIANT_MONEY(P):
        Permit.net_fees_paid_cents
          == SUM(FeeInvoice.amount_paid_cents) - SUM(FeeInvoice.refunded_cents)
             over ALL FeeInvoice rows with permit_id == P.id, in created_at ASC order
        (PENDING, PAST_DUE and VOID invoices contribute 0 on both sides)
    input_set: "Every FeeInvoice row of the permit regardless of status; unpaid ones simply contribute zeros."
    constants: {}
    precision: "Integer cents; the invariant must hold exactly with zero drift after any payment/refund pair."

  - name: renewal_eligibility_window
    trigger: "POST /busking/permits/{id}/renew and POST /busking/ops-runs step 3."
    algorithm: threshold
    formula: |
      season_end_utc(y)          = "<y>-12-31T23:59:59Z"
      renewal_window_open_at(y)  = "<y>-11-01T00:00:00Z"
      renewal_window_close_at(y) = season_end_utc(y)

      renewal admitted iff renewal_window_open_at(permit.season_year) <= clock <= renewal_window_close_at(permit.season_year)
        # BOTH bounds are INCLUSIVE: a renewal at exactly 2026-11-01T00:00:00Z is admitted.
      ops-run expiry fires iff clock > season_end_utc(permit.season_year)
        # STRICT: at exactly 2026-12-31T23:59:59Z the permit is still live.
    input_set: "The permit's own season_year and the logical clock."
    constants:
      RENEWAL_WINDOW_OPEN_MONTH_DAY: "11-01"
      SEASON_END_MONTH_DAY: "12-31"
    precision: "Second resolution on the logical clock."

  - name: pitch_slot_conflict
    trigger: "POST /busking/session-bookings, POST /busking/lottery-draws, and the relocation step of POST /busking/closure-orders/{id}/activate."
    algorithm: interval_merge
    formula: |
      # Session occupation on a Pitch uses HALF-OPEN intervals [start_at, end_at) EXPANDED by a
      # mandatory changeover buffer on BOTH sides. Two occupations that merely touch
      # (a.end_at == b.start_at) therefore DO conflict, because the buffer swallows the seam.
      occupied(pitch) = every SessionBooking with that pitch_id and status IN {RESERVED, RELOCATED, COMPLETED}
                      + every LotteryDraw with that pitch_id and status == OPEN or DRAWN,
                        contributing the interval [slot_start_at, slot_end_at)
      conflict(new, existing) iff
            new.start_at <  existing.end_at   + CHANGEOVER_BUFFER_MINUTES
        AND new.end_at   >  existing.start_at - CHANGEOVER_BUFFER_MINUTES
      A conflict is rejected with ERR_PITCH_SLOT_OVERLAP.
      Daily cap (independent of the geometry): the count of SessionBooking rows on the pitch with
      status IN {RESERVED, RELOCATED, COMPLETED} whose start_at falls on the SAME UTC calendar date
      as the new start_at must be < Pitch.daily_session_cap before the new row is admitted.
    input_set: "One pitch at a time. Cancelled bookings and VOID draws are excluded from occupied(pitch)."
    constants:
      CHANGEOVER_BUFFER_MINUTES: 15
    precision: "Minute resolution; the buffer is applied to the stored instants, not to a rounded copy."

  - name: zone_closure_capacity
    trigger: "POST /busking/closure-orders/{id}/activate."
    algorithm: interval_merge
    formula: |
      # Closure occupation on a Zone uses CLOSED intervals [starts_at, ends_at] with NO buffer, and
      # is capacity-limited rather than pairwise-exclusive. Endpoint-touching closures
      # (a.ends_at == b.starts_at) DO intersect, because both endpoints are inside the interval.
      intersect(a, b) iff a.starts_at <= b.ends_at AND a.ends_at >= b.starts_at
      overlapping_active = count of ClosureOrder rows with the same zone_id, status == ACTIVE,
                           id != this order, that intersect(this order)
      activation admitted iff overlapping_active < Zone.max_concurrent_closures
        # '<' — a zone with max_concurrent_closures 2 admits a second overlapping closure and
        # rejects the third with ERR_CLOSURE_WINDOW_CONFLICT.
      on admission: Zone.active_closure_count := overlapping-independent count of ACTIVE orders in the zone.
    input_set: "ClosureOrder rows of one zone with status == ACTIVE only. DRAFT and LIFTED orders never consume capacity."
    constants: {}
    precision: "Second resolution; intervals are compared as stored."

  - name: lottery_winner_selection
    trigger: "POST /busking/lottery-draws/{id}/execute."
    algorithm: weighted_scoring
    formula: |
      draw_duration_minutes = whole minutes between slot_start_at and slot_end_at

      # (a) ELIGIBILITY FILTER — the candidate set, as an explicit predicate over entity fields:
      candidate(E) iff
            E.draw_id == draw.id
        AND E.status  == SUBMITTED
        AND permit(E).lifecycle_status == ACTIVE
        AND permit(E).compliance_status == CLEAR
        AND permit(E).season_year == draw.season_year
        AND performer(E).standing IN {GOOD, WATCH}
        AND permit(E).season_minutes_used + draw_duration_minutes <= SEASON_MINUTES_CAP
        AND NO FeeInvoice with permit_id == permit(E).id has status == PAST_DUE
        where permit(E) = Permit row with id == E.permit_id and performer(E) = Performer row with
        id == permit(E).performer_id.

      # (b) RANKING EXPRESSION — applied to the candidate set only:
      priority_band(E) = 1 when performer(E).premium_wins_this_season == 0
                         2 when performer(E).premium_wins_this_season == 1
                         3 when performer(E).premium_wins_this_season >= 2
      sort key: priority_band ASC, then performer(E).conduct_score DESC

      # (c) TIE-BREAK when the whole sort key ties:
      E.created_at ASC   (earliest filed entry wins; the entry id is NEVER consulted)

      # (d) EMPTY-POOL FALLBACK:
      when the candidate set is empty, the draw transitions OPEN -> VOID, every SUBMITTED entry
      becomes LOST with rank_position null, winner_count := 0, and the response is 200.
      When draw.entry_count == 0 the execute is refused outright with ERR_NO_ELIGIBLE_ENTRIES (409)
      and the draw stays OPEN.

      winners = the first draw.winner_slots entries of the ranked candidate set; each becomes WON with
      rank_position 1..winner_slots. The remaining candidates become LOST with rank_position
      winner_slots+1.. in the same order. Non-candidates become LOST with rank_position null.
    input_set: "LotteryEntry rows of one draw. Entries in WON/LOST/FORFEITED are already terminal and are never re-ranked."
    constants:
      SEASON_MINUTES_CAP: 1800
    precision: "Integer bands and integer conduct scores; no rounding."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST failing rule decides the response)
# ---------------------------------------------------------------------------
validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "The supplied X-User-Role appears in the called endpoint's roles list in §1.5."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 30
    category: existence
    check: "Every path-segment id resolves to a live row, validated left to right."
    error_id: "ERR_ZONE_NOT_FOUND | ERR_PITCH_NOT_FOUND | ERR_PERFORMER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_AUDITION_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_DRAW_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_CLOSURE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 35
    category: existence
    check: "Every foreign key supplied in the request body resolves to a live row, validated in the order the fields appear in the endpoint's input list."
    error_id: "ERR_ZONE_NOT_FOUND | ERR_PITCH_NOT_FOUND | ERR_PERFORMER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_BOOKING_NOT_FOUND"
    http_status: 404
    applies_to: "POST /busking/pitches, POST /busking/permit-applications, POST /busking/auditions, POST /busking/lottery-draws, POST /busking/lottery-draws/{id}/entries, POST /busking/session-bookings, POST /busking/noise-readings, POST /busking/complaints, POST /busking/closure-orders"

  - priority: 40
    category: auth
    check: "When X-User-Role is Performer, X-User-ID equals the performer_id that owns the target resource (directly on Performer/PermitApplication, or through Permit.performer_id for Permit, FeeInvoice, LotteryEntry and SessionBooking)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles include Performer"

  - priority: 45
    category: business_constraint
    check: "Request body is well formed: every required field present, enum values inside their declared sets, integers inside their declared ranges, end_at strictly after start_at, ends_at strictly after starts_at, entry_deadline_at strictly before slot_start_at, decision_note non-empty when outcome is CHANGES_REQUESTED, season_year input on renew equal to permit.season_year + 1. Body keys that are NOT in the endpoint's declared input list — including attempts to set computed or system fields such as id, version, status, conduct_score or amount_due_cents — are silently IGNORED and never raise an error."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 46
    category: state
    check: "The complaint is not already in a terminal status (UPHELD or DISMISSED). This domain-specific terminal-state gate is deliberately ordered BEFORE the generic state check at priority 50, so triaging or adjudicating a resolved complaint reports ERR_COMPLAINT_ALREADY_RESOLVED rather than ERR_INVALID_STATE."
    error_id: ERR_COMPLAINT_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /busking/complaints/{id}/triage, POST /busking/complaints/{id}/adjudicate"

  - priority: 48
    category: business_constraint
    check: "Natural-key uniqueness: Zone.code, Pitch.code and Performer.email are each unique across their table."
    error_id: "ERR_ZONE_CODE_TAKEN | ERR_PITCH_CODE_TAKEN | ERR_PERFORMER_EMAIL_TAKEN"
    http_status: 409
    applies_to: "POST /busking/zones, POST /busking/pitches, POST /busking/performers"

  - priority: 49
    category: business_safety
    check: "An APPROVED decision on an application with requires_audition == true is only admitted from status AUDITION_PASSED. This domain-specific gate is deliberately ordered BEFORE the generic state check at priority 50, so an APPROVED decision from AUDITION_REQUIRED / AUDITION_SCHEDULED / AUDITION_FAILED reports ERR_AUDITION_REQUIRED rather than ERR_INVALID_STATE."
    error_id: ERR_AUDITION_REQUIRED
    http_status: 409
    applies_to: "POST /busking/permit-applications/{id}/decision"

  - priority: 50
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint (submit, review, revisions, decision, finalize, payments, renew, revoke, reinstate, entries, execute, cancel, triage, adjudicate, activate)"

  - priority: 51
    category: state
    check: "permit.lifecycle_status == ACTIVE."
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /busking/session-bookings, POST /busking/lottery-draws/{id}/entries"

  - priority: 52
    category: state
    check: "permit.compliance_status != SUSPENDED."
    error_id: ERR_PERMIT_SUSPENDED
    http_status: 409
    applies_to: "POST /busking/session-bookings, POST /busking/lottery-draws/{id}/entries, POST /busking/permits/{id}/renew"

  - priority: 54
    category: state
    check: "expected_application_version equals the application's current version."
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /busking/permit-applications/{id}/revisions"

  - priority: 55
    category: state
    check: "expected_permit_version equals the permit's current version."
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412
    applies_to: "POST /busking/session-bookings"

  - priority: 56
    category: business_safety
    check: "The adjudicating X-User-ID differs from Complaint.triaged_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /busking/complaints/{id}/adjudicate"

  - priority: 57
    category: business_safety
    check: "When the application required an audition, the deciding X-User-ID differs from the Audition.finalized_by_user_id of that application's PASSED audition."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /busking/permit-applications/{id}/decision"

  - priority: 59
    category: business_safety
    check: "Audition.score_count >= AUDITION_MIN_PANELISTS (3)."
    error_id: ERR_AUDITION_PANEL_INCOMPLETE
    http_status: 409
    applies_to: "POST /busking/auditions/{id}/finalize"

  - priority: 60
    category: business_safety
    check: "The permit holder's Performer.standing is not BARRED."
    error_id: ERR_PERFORMER_BARRED
    http_status: 409
    applies_to: "POST /busking/permits/{id}/reinstate"

  - priority: 61
    category: business_safety
    check: "amplification_planned == true requires pitch.amplification_allowed == true."
    error_id: ERR_AMPLIFICATION_PROHIBITED
    http_status: 422
    applies_to: "POST /busking/session-bookings"

  - priority: 62
    category: business_safety
    check: "amplification_planned == true requires permit.amplification_endorsed == true."
    error_id: ERR_AMPLIFICATION_NOT_ENDORSED
    http_status: 422
    applies_to: "POST /busking/session-bookings"

  - priority: 63
    category: business_safety
    check: "No minute of the half-open window [start_at, end_at) falls inside the pitch's zone quiet window (wrapping midnight when quiet_hours_start_minute > quiet_hours_end_minute; no quiet window at all when the two are equal)."
    error_id: ERR_QUIET_HOURS_VIOLATION
    http_status: 422
    applies_to: "POST /busking/session-bookings, POST /busking/lottery-draws"

  - priority: 64
    category: business_referential
    check: "pitch.availability_status == OPEN."
    error_id: ERR_PITCH_CLOSED
    http_status: 409
    applies_to: "POST /busking/session-bookings, POST /busking/lottery-draws"

  - priority: 65
    category: business_referential
    check: "fallback_pitch_id, when supplied, references a Pitch with the same zone_id and a different id than the pitch being created."
    error_id: ERR_PITCH_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /busking/pitches"

  - priority: 66
    category: business_referential
    check: "booking_id, when supplied on a complaint, references a SessionBooking whose permit_id equals the complaint's permit_id."
    error_id: ERR_BOOKING_PERMIT_MISMATCH
    http_status: 422
    applies_to: "POST /busking/complaints"

  - priority: 67
    category: business_temporal
    check: "duration_minutes <= pitch.max_session_minutes."
    error_id: ERR_SESSION_TOO_LONG
    http_status: 422
    applies_to: "POST /busking/session-bookings, POST /busking/lottery-draws"

  - priority: 68
    category: business_temporal
    check: "start_at >= clock + MIN_BOOKING_LEAD_MINUTES (60)."
    error_id: ERR_BOOKING_LEAD_TIME
    http_status: 422
    applies_to: "POST /busking/session-bookings"

  - priority: 69
    category: business_temporal
    check: "start_at <= clock + MAX_BOOKING_HORIZON_DAYS (30)."
    error_id: ERR_BOOKING_HORIZON_EXCEEDED
    http_status: 422
    applies_to: "POST /busking/session-bookings"

  - priority: 70
    category: business_temporal
    check: "booking.start_at <= taken_at < booking.end_at."
    error_id: ERR_READING_OUTSIDE_SESSION
    http_status: 422
    applies_to: "POST /busking/noise-readings"

  - priority: 71
    category: business_temporal
    check: "booking.start_at > clock (a session that has already begun cannot be cancelled)."
    error_id: ERR_SESSION_ALREADY_STARTED
    http_status: 409
    applies_to: "POST /busking/session-bookings/{id}/cancel"

  - priority: 72
    category: business_temporal
    check: "The clock is inside [renewal_window_open_at(season_year), season_end_utc(season_year)], both bounds inclusive."
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /busking/permits/{id}/renew"

  - priority: 73
    category: business_temporal
    check: "clock <= draw.entry_deadline_at."
    error_id: ERR_ENTRY_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /busking/lottery-draws/{id}/entries"

  - priority: 74
    category: business_temporal
    check: "clock > draw.entry_deadline_at."
    error_id: ERR_ENTRY_DEADLINE_NOT_PASSED
    http_status: 409
    applies_to: "POST /busking/lottery-draws/{id}/execute"

  - priority: 75
    category: business_constraint
    check: "The buffered half-open interval test in calculations.pitch_slot_conflict finds no conflicting occupation on the pitch."
    error_id: ERR_PITCH_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /busking/session-bookings, POST /busking/lottery-draws"

  - priority: 76
    category: business_constraint
    check: "The closed-interval aggregate test in calculations.zone_closure_capacity finds fewer than Zone.max_concurrent_closures intersecting ACTIVE closures."
    error_id: ERR_CLOSURE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /busking/closure-orders/{id}/activate"

  - priority: 77
    category: business_constraint
    check: "The count of same-UTC-date bookings on the pitch with status IN {RESERVED, RELOCATED, COMPLETED} is < pitch.daily_session_cap."
    error_id: ERR_PITCH_DAILY_CAP_REACHED
    http_status: 409
    applies_to: "POST /busking/session-bookings"

  - priority: 78
    category: business_constraint
    check: "pitch.tier == PREMIUM."
    error_id: ERR_PITCH_NOT_PREMIUM
    http_status: 422
    applies_to: "POST /busking/lottery-draws"

  - priority: 79
    category: business_constraint
    check: "No LotteryEntry with this draw_id already carries this permit_id."
    error_id: ERR_DUPLICATE_LOTTERY_ENTRY
    http_status: 409
    applies_to: "POST /busking/lottery-draws/{id}/entries"

  - priority: 80
    category: business_constraint
    check: "The performer has no other PermitApplication for the same season_year whose status is NOT in {REJECTED}."
    error_id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 409
    applies_to: "POST /busking/permit-applications"

  - priority: 81
    category: business_constraint
    check: "No AuditionScore with this audition_id already carries this panelist_user_id."
    error_id: ERR_DUPLICATE_PANEL_SCORE
    http_status: 409
    applies_to: "POST /busking/auditions/{id}/scores"

  - priority: 82
    category: business_constraint
    check: "application.revision_count < MAX_REVISIONS (2)."
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /busking/permit-applications/{id}/revisions, POST /busking/permit-applications/{id}/decision with outcome=CHANGES_REQUESTED"

  - priority: 83
    category: business_constraint
    check: "draw.entry_count >= 1."
    error_id: ERR_NO_ELIGIBLE_ENTRIES
    http_status: 409
    applies_to: "POST /busking/lottery-draws/{id}/execute"

  - priority: 84
    category: business_fiscal
    check: "No FeeInvoice with this permit_id has status == PAST_DUE."
    error_id: ERR_INVOICE_PAST_DUE
    http_status: 402
    applies_to: "POST /busking/session-bookings, POST /busking/lottery-draws/{id}/entries"

  - priority: 85
    category: business_fiscal
    check: "No FeeInvoice with this permit_id has status IN {PENDING, PAST_DUE}."
    error_id: ERR_OUTSTANDING_INVOICE
    http_status: 402
    applies_to: "POST /busking/permits/{id}/renew"

  - priority: 86
    category: business_fiscal
    check: "Performer.renewal_conduct_score >= RENEWAL_MIN_CONDUCT (80) — the CAREER_WEIGHTED variant, never the live conduct_score."
    error_id: ERR_RENEWAL_CONDUCT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /busking/permits/{id}/renew"

  - priority: 87
    category: business_fiscal
    check: "amount_cents equals invoice.amount_due_cents exactly."
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /busking/fee-invoices/{id}/payments"

  - priority: 88
    category: business_fiscal
    check: "permit.season_minutes_used + duration_minutes <= SEASON_MINUTES_CAP (1800)."
    error_id: ERR_SEASON_MINUTE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /busking/session-bookings"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # ---- Zones -------------------------------------------------------------
  - method: POST
    path: "/busking/zones"
    description: "Register an ordinance district."
    roles: [PermitOfficer]
    code: 201
    input: ["name", "code", "base_noise_cap_db", "evening_start_minute", "quiet_hours_start_minute", "quiet_hours_end_minute", "weekend_noise_bonus_db?", "evening_penalty_db?", "max_concurrent_closures?"]
    output: Zone
    side_effects: ["active_closure_count initialised to 0"]

  - method: GET
    path: "/busking/zones/{id}"
    description: "Read one district."
    roles: [PermitOfficer, Performer, NoiseInspector]
    code: 200
    input: []
    output: Zone
    side_effects: []

  # ---- Pitches -----------------------------------------------------------
  - method: POST
    path: "/busking/pitches"
    description: "Register a designated pitch inside a district."
    roles: [PermitOfficer]
    code: 201
    input: ["zone_id", "code", "tier", "noise_cap_db", "amplification_allowed?", "max_session_minutes?", "daily_session_cap?", "premium_slots_per_draw?", "fallback_pitch_id?"]
    output: Pitch
    side_effects: ["availability_status initialised to OPEN"]

  - method: GET
    path: "/busking/pitches/{id}"
    description: "Read one pitch."
    roles: [PermitOfficer, Performer, NoiseInspector]
    code: 200
    input: []
    output: Pitch
    side_effects: []

  - method: GET
    path: "/busking/pitches"
    description: "List pitches. Reverse-reachability channel for Pitch.zone_id and for the self-referential Pitch.fallback_pitch_id."
    roles: [PermitOfficer, Performer, NoiseInspector]
    code: 200
    input: ["zone_id?", "fallback_pitch_id?", "tier?", "availability_status?", "limit?", "offset?"]
    output: Pitch[]
    side_effects: []

  # ---- Performers --------------------------------------------------------
  - method: POST
    path: "/busking/performers"
    description: "Enroll a street performer after the city ID check. The minted id is the X-User-ID the Performer role then acts under."
    roles: [PermitOfficer]
    code: 201
    input: ["legal_name", "stage_name", "email", "act_type"]
    output: Performer
    side_effects: ["conduct_score 100, renewal_conduct_score 100, standing GOOD, upheld_complaint_count 0, premium_wins_this_season 0"]

  - method: GET
    path: "/busking/performers/{id}"
    description: "Read one performer, including both conduct scores and the derived standing."
    roles: [PermitOfficer, Performer]
    code: 200
    input: []
    output: Performer
    side_effects: []

  # ---- Permit applications ----------------------------------------------
  - method: POST
    path: "/busking/permit-applications"
    description: "Open a DRAFT permit application."
    roles: [Performer, PermitOfficer]
    code: 201
    input: ["performer_id", "requested_zone_id", "season_year", "requested_act_type", "amplification_requested?"]
    output: PermitApplication
    side_effects: ["status DRAFT, revision_count 0, requires_audition false until submit"]

  - method: GET
    path: "/busking/permit-applications/{id}"
    description: "Read one application."
    roles: [PermitOfficer, Performer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []

  - method: GET
    path: "/busking/permit-applications"
    description: "List applications. Reverse-reachability channel for PermitApplication.performer_id and PermitApplication.requested_zone_id."
    roles: [PermitOfficer, Performer]
    code: 200
    input: ["performer_id?", "requested_zone_id?", "status?", "season_year?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []

  - method: POST
    path: "/busking/permit-applications/{id}/submit"
    description: "Lodge the application with the program office."
    roles: [Performer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["DRAFT -> SUBMITTED", "recomputes requires_audition", "sets submitted_at", "increments PermitApplication.version by 1"]

  - method: POST
    path: "/busking/permit-applications/{id}/review"
    description: "Officer picks the application up. Branches to UNDER_REVIEW or AUDITION_REQUIRED purely on the computed requires_audition flag."
    roles: [PermitOfficer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["SUBMITTED -> UNDER_REVIEW or SUBMITTED -> AUDITION_REQUIRED", "sets reviewed_by_user_id", "increments PermitApplication.version by 1"]

  - method: POST
    path: "/busking/permit-applications/{id}/revisions"
    description: "Applicant resubmits after a change request. Optimistic-concurrency guarded on the application's version."
    roles: [Performer]
    code: 200
    input: ["expected_application_version", "requested_act_type?", "amplification_requested?", "requested_zone_id?"]
    output: PermitApplication
    side_effects: ["CHANGES_REQUESTED -> SUBMITTED", "revision_count += 1", "recomputes requires_audition", "cancels any SCHEDULED Audition on this application", "increments PermitApplication.version by 1"]

  - method: POST
    path: "/busking/permit-applications/{id}/decision"
    description: "Officer issues APPROVED, REJECTED or CHANGES_REQUESTED. An APPROVED decision mints the Permit and its INITIAL FeeInvoice."
    roles: [PermitOfficer]
    code: 200
    input: ["outcome", "decision_note?"]
    output: PermitApplication
    side_effects: ["mints Permit (PENDING_FEE / CLEAR) on APPROVED", "that Permit mints an INITIAL FeeInvoice via calculations.permit_fee_assessment", "that invoice writes assessed_fee_cents back onto the application", "cancels any SCHEDULED Audition on REJECTED", "increments PermitApplication.version by 1"]

  # ---- Auditions ---------------------------------------------------------
  - method: POST
    path: "/busking/auditions"
    description: "Schedule the vetting panel for an application sitting in AUDITION_REQUIRED."
    roles: [PermitOfficer]
    code: 201
    input: ["application_id", "scheduled_for"]
    output: Audition
    side_effects: ["application AUDITION_REQUIRED -> AUDITION_SCHEDULED", "increments PermitApplication.version by 1"]

  - method: GET
    path: "/busking/auditions/{id}"
    description: "Read one audition sitting."
    roles: [PermitOfficer, Performer]
    code: 200
    input: []
    output: Audition
    side_effects: []

  - method: GET
    path: "/busking/auditions"
    description: "List auditions. Reverse-reachability channel for Audition.application_id."
    roles: [PermitOfficer, Performer]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Audition[]
    side_effects: []

  - method: POST
    path: "/busking/auditions/{id}/scores"
    description: "A panelist files their three subscores. The per-panelist composite is rounded to 2 dp here, before any averaging."
    roles: [AuditionPanelist]
    code: 201
    input: ["technical_score", "suitability_score", "safety_score"]
    output: AuditionScore
    side_effects: ["stores panelist_user_id from X-User-ID", "computes composite_score", "audition.score_count += 1", "increments Audition.version by 1"]

  - method: GET
    path: "/busking/auditions/{id}/scores"
    description: "List the panel's filed scores in created_at ASC order. Reverse-reachability channel for AuditionScore.audition_id."
    roles: [PermitOfficer, AuditionPanelist]
    code: 200
    input: ["limit?", "offset?"]
    output: AuditionScore[]
    side_effects: []

  - method: POST
    path: "/busking/auditions/{id}/finalize"
    description: "Officer closes the sitting; panel_score is averaged from the ALREADY-ROUNDED per-panelist composites and compared to the pass threshold."
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Audition
    side_effects: ["SCHEDULED -> PASSED or FAILED", "writes panel_score, finalized_by_user_id, finalized_at", "parent application AUDITION_SCHEDULED -> AUDITION_PASSED/AUDITION_FAILED", "increments Audition.version by 1"]

  # ---- Permits -----------------------------------------------------------
  - method: GET
    path: "/busking/permits/{id}"
    description: "Read one permit, including both independent status axes and both ledgers."
    roles: [PermitOfficer, Performer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/busking/permits"
    description: "List permits. Reverse-reachability channel for Permit.application_id and Permit.performer_id, and the only discovery channel for a permit minted by an approval cascade."
    roles: [PermitOfficer, Performer]
    code: 200
    input: ["performer_id?", "application_id?", "lifecycle_status?", "compliance_status?", "season_year?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/busking/permits/{id}/renew"
    description: "Holder opens the renewal cycle for the following season. Gated on the CAREER_WEIGHTED conduct score, not the live one."
    roles: [Performer]
    code: 200
    input: ["season_year"]
    output: Permit
    side_effects: ["ACTIVE -> RENEWAL_PENDING", "sets next_season_year", "mints a RENEWAL FeeInvoice (always FULL_SEASON)", "increments Permit.version by 1"]

  - method: POST
    path: "/busking/permits/{id}/revoke"
    description: "Officer revokes a permit and settles the money and minute ledgers. refund_mode is one of PRORATED_REFUND (the default when omitted) or FULL_REFUND."
    roles: [PermitOfficer]
    code: 200
    input: ["reason", "refund_mode?"]
    output: Permit
    side_effects: ["lifecycle -> REVOKED", "refunds the PAID invoice per calculations.revocation_refund and VOIDs unpaid ones", "cancels future bookings into CANCELLED_BY_REVOCATION, crediting season_minutes_used", "forfeits SUBMITTED lottery entries", "increments Permit.version by 1"]

  - method: POST
    path: "/busking/permits/{id}/reinstate"
    description: "Officer clears the enforcement axis, closing the CLEAR -> WARNED -> SUSPENDED -> CLEAR cycle."
    roles: [PermitOfficer]
    code: 200
    input: ["note?"]
    output: Permit
    side_effects: ["compliance_status -> CLEAR", "noise_violation_count := 0", "already-cancelled bookings are NOT restored", "increments Permit.version by 1"]

  - method: GET
    path: "/busking/permits/{id}/fee-invoices"
    description: "List the permit's invoices, newest last (created_at ASC). Reverse-reachability channel for FeeInvoice.permit_id and the only discovery channel for a cascade-minted invoice."
    roles: [PermitOfficer, Performer]
    code: 200
    input: ["status?", "invoice_kind?", "limit?", "offset?"]
    output: FeeInvoice[]
    side_effects: []

  - method: POST
    path: "/busking/fee-invoices/{id}/payments"
    description: "Settle an invoice in full. Drives PENDING_FEE -> ACTIVE and RENEWAL_PENDING -> ACTIVE."
    roles: [Performer, PermitOfficer]
    code: 200
    input: ["amount_cents"]
    output: FeeInvoice
    side_effects: ["invoice -> PAID", "Permit.net_fees_paid_cents += amount_paid_cents", "permit lifecycle advances", "on a RENEWAL payment: season rollover and reset of season_minutes_used, closure_credit_minutes, noise_violation_count and premium_wins_this_season", "increments Permit.version by 1"]

  # ---- Lottery -----------------------------------------------------------
  - method: POST
    path: "/busking/lottery-draws"
    description: "Open a rotation draw for a PREMIUM pitch slot. Creating the draw reserves the slot window on that pitch."
    roles: [PermitOfficer]
    code: 201
    input: ["pitch_id", "season_year", "slot_start_at", "slot_end_at", "entry_deadline_at"]
    output: LotteryDraw
    side_effects: ["status OPEN, winner_slots copied from pitch.premium_slots_per_draw", "the slot window becomes an occupation on the pitch for calculations.pitch_slot_conflict"]

  - method: GET
    path: "/busking/lottery-draws/{id}"
    description: "Read one draw."
    roles: [PermitOfficer, Performer]
    code: 200
    input: []
    output: LotteryDraw
    side_effects: []

  - method: GET
    path: "/busking/lottery-draws"
    description: "List draws. Reverse-reachability channel for LotteryDraw.pitch_id."
    roles: [PermitOfficer, Performer]
    code: 200
    input: ["pitch_id?", "status?", "season_year?", "limit?", "offset?"]
    output: LotteryDraw[]
    side_effects: []

  - method: POST
    path: "/busking/lottery-draws/{id}/entries"
    description: "Holder enters a permit into an open draw."
    roles: [Performer]
    code: 201
    input: ["permit_id"]
    output: LotteryEntry
    side_effects: ["status SUBMITTED, priority_band and rank_position stay null until execute", "draw.entry_count += 1", "increments LotteryDraw.version by 1"]

  - method: POST
    path: "/busking/lottery-draws/{id}/execute"
    description: "Officer runs the rotation selector after the entry deadline."
    roles: [PermitOfficer]
    code: 200
    input: []
    output: LotteryDraw
    side_effects: ["OPEN -> DRAWN with winners, or OPEN -> VOID when the eligible candidate set is empty", "each WON entry mints a LOTTERY SessionBooking", "each minted booking debits Permit.season_minutes_used and increments Permit.version by 1", "Performer.premium_wins_this_season += 1 per winner", "increments LotteryDraw.version by 1"]

  - method: GET
    path: "/busking/lottery-entries/{id}"
    description: "Read one entry, including its execute-time priority_band and rank_position."
    roles: [PermitOfficer, Performer]
    code: 200
    input: []
    output: LotteryEntry
    side_effects: []

  - method: GET
    path: "/busking/lottery-entries"
    description: "List entries. Reverse-reachability channel for LotteryEntry.draw_id and LotteryEntry.permit_id."
    roles: [PermitOfficer, Performer]
    code: 200
    input: ["draw_id?", "permit_id?", "status?", "limit?", "offset?"]
    output: LotteryEntry[]
    side_effects: []

  # ---- Session bookings --------------------------------------------------
  - method: POST
    path: "/busking/session-bookings"
    description: "Reserve a pitch time window under an active permit. Optimistic-concurrency guarded on the permit's version."
    roles: [Performer]
    code: 201
    input: ["permit_id", "pitch_id", "start_at", "end_at", "expected_permit_version", "amplification_planned?"]
    output: SessionBooking
    side_effects: ["status RESERVED, origin DIRECT", "computes duration_minutes and effective_noise_cap_db", "Permit.season_minutes_used += duration_minutes", "increments Permit.version by 1"]

  - method: GET
    path: "/busking/session-bookings/{id}"
    description: "Read one booking."
    roles: [PermitOfficer, Performer, NoiseInspector]
    code: 200
    input: []
    output: SessionBooking
    side_effects: []

  - method: GET
    path: "/busking/session-bookings"
    description: "List bookings. Reverse-reachability channel for SessionBooking.permit_id, pitch_id, lottery_entry_id and relocated_from_pitch_id."
    roles: [PermitOfficer, Performer, NoiseInspector]
    code: 200
    input: ["permit_id?", "pitch_id?", "lottery_entry_id?", "relocated_from_pitch_id?", "status?", "limit?", "offset?"]
    output: SessionBooking[]
    side_effects: []

  - method: POST
    path: "/busking/session-bookings/{id}/cancel"
    description: "Release a future reservation. The compensating action for a booking creation."
    roles: [Performer, PermitOfficer]
    code: 200
    input: ["reason?"]
    output: SessionBooking
    side_effects: ["status -> CANCELLED_BY_PERFORMER", "Permit.season_minutes_used -= duration_minutes, restoring the pre-booking value exactly", "Performer.premium_wins_this_season is deliberately NOT restored", "increments Permit.version by 1"]

  - method: POST
    path: "/busking/noise-readings"
    description: "Inspector files a metered sound level against a live session."
    roles: [NoiseInspector]
    code: 201
    input: ["booking_id", "taken_at", "reading_db"]
    output: NoiseReading
    side_effects: ["computes effective_cap_db and verdict", "on VIOLATION: booking.noise_violation_count += 1, permit.noise_violation_count += 1 and the compliance escalation edges fire", "increments Permit.version by 1 when the permit is mutated"]

  - method: GET
    path: "/busking/session-bookings/{id}/noise-readings"
    description: "List the readings filed against a booking. Reverse-reachability channel for NoiseReading.booking_id."
    roles: [PermitOfficer, NoiseInspector, Performer]
    code: 200
    input: ["verdict?", "limit?", "offset?"]
    output: NoiseReading[]
    side_effects: []

  # ---- Complaints --------------------------------------------------------
  - method: POST
    path: "/busking/complaints"
    description: "Public complaint intake against a permit, optionally naming a session."
    roles: [Resident, PermitOfficer]
    code: 201
    input: ["permit_id", "category", "description", "booking_id?"]
    output: Complaint
    side_effects: ["status OPEN, severity null, route null, conduct_deduction 0"]

  - method: GET
    path: "/busking/complaints/{id}"
    description: "Read one complaint."
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/busking/complaints"
    description: "List complaints. Reverse-reachability channel for Complaint.permit_id and Complaint.booking_id."
    roles: [PermitOfficer]
    code: 200
    input: ["permit_id?", "booking_id?", "status?", "severity?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/busking/complaints/{id}/triage"
    description: "Officer grades the complaint and forks it to direct adjudication or to mediation."
    roles: [PermitOfficer]
    code: 200
    input: ["severity", "route"]
    output: Complaint
    side_effects: ["OPEN -> TRIAGED (route DIRECT) or OPEN -> MEDIATION (route MEDIATION)", "records triaged_by_user_id from X-User-ID", "increments Complaint.version by 1"]

  - method: POST
    path: "/busking/complaints/{id}/adjudicate"
    description: "A DIFFERENT officer resolves the complaint. Upholding fires the four-level conduct cascade."
    roles: [PermitOfficer]
    code: 200
    input: ["outcome", "resolution_note?"]
    output: Complaint
    side_effects: ["-> UPHELD or DISMISSED", "on UPHELD: conduct_deduction (halved on the MEDIATION branch), performer rescoring, possible standing BARRED, possible permit suspension, possible booking cancellation and lottery forfeiture", "increments Complaint.version by 1"]

  # ---- Closure orders ----------------------------------------------------
  - method: POST
    path: "/busking/closure-orders"
    description: "Draft a special-event or works closure over a zone or a single pitch."
    roles: [PermitOfficer]
    code: 201
    input: ["zone_id", "reason", "starts_at", "ends_at", "pitch_id?"]
    output: ClosureOrder
    side_effects: ["status DRAFT; nothing is closed until activation"]

  - method: GET
    path: "/busking/closure-orders/{id}"
    description: "Read one closure order."
    roles: [PermitOfficer, Performer]
    code: 200
    input: []
    output: ClosureOrder
    side_effects: []

  - method: GET
    path: "/busking/closure-orders"
    description: "List closure orders. Reverse-reachability channel for ClosureOrder.zone_id and ClosureOrder.pitch_id."
    roles: [PermitOfficer, Performer]
    code: 200
    input: ["zone_id?", "pitch_id?", "status?", "limit?", "offset?"]
    output: ClosureOrder[]
    side_effects: []

  - method: POST
    path: "/busking/closure-orders/{id}/activate"
    description: "Bring the closure into force and displace every booking it covers."
    roles: [PermitOfficer]
    code: 200
    input: []
    output: ClosureOrder
    side_effects: ["DRAFT -> ACTIVE, Zone.active_closure_count += 1", "every covered Pitch becomes CLOSED", "covered bookings become RELOCATED or CANCELLED_BY_CLOSURE", "each outright cancellation credits Permit.season_minutes_used and Permit.closure_credit_minutes", "writes affected/relocated/cancelled counts", "increments ClosureOrder.version by 1"]

  # ---- Operations / test-driving -----------------------------------------
  - method: POST
    path: "/busking/ops-runs"
    description: "Advance the program epoch. Steps run in this pinned order: (1) lift ACTIVE closures whose ends_at < clock and reopen their pitches; (2) mark PENDING invoices whose due_at < clock as PAST_DUE, and for each RENEWAL invoice swept this way move its permit RENEWAL_PENDING -> ACTIVE with next_season_year cleared; (3) expire permits past season_end_utc(season_year), cancelling their future bookings into CANCELLED_BY_EXPIRY and forfeiting their SUBMITTED entries; (4) complete bookings whose end_at <= clock; (5) rescore every performer with upheld_complaint_count > 0 and suspend the permits of anyone who lands on BARRED."
    roles: [PermitOfficer]
    code: 200
    input: []
    output: "{ processed_at: string, closures_lifted_count: integer, invoices_past_due_count: integer, permits_expired_count: integer, bookings_completed_count: integer, performers_rescored_count: integer }"
    side_effects: ["all five steps above, in the stated order", "increments the version of every row it mutates"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: move the server's logical clock. The clock starts at exactly 2026-08-01T00:00:00Z on server startup and MUST NOT fall back to wall-clock time before the first call. Every deadline, expiry, proration and window rule in this scaffold reads this logical clock."
    roles: [PermitOfficer]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["no entity is mutated; only the logical clock moves"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The authenticated role is not listed on the called endpoint in §1.5."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Performer acts on a Performer, PermitApplication, Permit, FeeInvoice, LotteryEntry or SessionBooking that resolves to a different performer_id than X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting officer id equals Complaint.triaged_by_user_id on adjudicate, or equals the PASSED Audition's finalized_by_user_id on an application decision."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, enum value outside its set, integer outside its range, non-increasing interval, entry_deadline_at not before slot_start_at, empty decision_note on CHANGES_REQUESTED, or renew season_year != permit.season_year + 1."

  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "zone_id in the path or body matches no Zone row."
  - id: ERR_PITCH_NOT_FOUND
    http: 404
    condition: "pitch_id or fallback_pitch_id matches no Pitch row."
  - id: ERR_PERFORMER_NOT_FOUND
    http: 404
    condition: "performer_id matches no Performer row."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application_id matches no PermitApplication row."
  - id: ERR_AUDITION_NOT_FOUND
    http: 404
    condition: "The audition id in the path matches no Audition row."
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit_id matches no Permit row."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "The invoice id in the path matches no FeeInvoice row."
  - id: ERR_DRAW_NOT_FOUND
    http: 404
    condition: "The draw id in the path matches no LotteryDraw row."
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "The entry id in the path matches no LotteryEntry row."
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "booking_id in the path or body matches no SessionBooking row."
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "The complaint id in the path matches no Complaint row."
  - id: ERR_CLOSURE_NOT_FOUND
    http: 404
    condition: "The closure id in the path matches no ClosureOrder row."

  - id: ERR_ZONE_CODE_TAKEN
    http: 409
    condition: "A Zone with the submitted code already exists."
  - id: ERR_PITCH_CODE_TAKEN
    http: 409
    condition: "A Pitch with the submitted code already exists."
  - id: ERR_PERFORMER_EMAIL_TAKEN
    http: 409
    condition: "A Performer with the submitted email already exists (case-insensitive)."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared in §1.2 from the target's current state — e.g. reviewing a DRAFT application, finalizing an already PASSED audition, activating an already ACTIVE closure, executing a DRAWN draw, cancelling a COMPLETED booking."
  - id: ERR_PERMIT_NOT_ACTIVE
    http: 409
    condition: "A booking or lottery entry is attempted while permit.lifecycle_status is not ACTIVE."
  - id: ERR_PERMIT_SUSPENDED
    http: 409
    condition: "A booking, lottery entry or renewal is attempted while permit.compliance_status is SUSPENDED."
  - id: ERR_COMPLAINT_ALREADY_RESOLVED
    http: 409
    condition: "Triage or adjudication is attempted on a complaint already in UPHELD or DISMISSED."
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not match the application's current version."
  - id: ERR_STALE_PERMIT_VERSION
    http: 412
    condition: "expected_permit_version does not match the permit's current version."

  - id: ERR_AUDITION_REQUIRED
    http: 409
    condition: "An APPROVED decision is issued on an application whose requires_audition is true and whose status is not AUDITION_PASSED."
  - id: ERR_AUDITION_PANEL_INCOMPLETE
    http: 409
    condition: "finalize is called with fewer than AUDITION_MIN_PANELISTS (3) filed AuditionScore rows."
  - id: ERR_DUPLICATE_PANEL_SCORE
    http: 409
    condition: "The same panelist X-User-ID files a second score on one audition."
  - id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http: 409
    condition: "The performer already has a non-REJECTED application for the same season_year."
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "A third revision is attempted, or a change request is issued when revision_count has already reached MAX_REVISIONS (2)."
  - id: ERR_PERFORMER_BARRED
    http: 409
    condition: "Reinstatement is attempted while the holder's Performer.standing is BARRED."

  - id: ERR_AMPLIFICATION_PROHIBITED
    http: 422
    condition: "amplification_planned is true on a pitch whose amplification_allowed is false."
  - id: ERR_AMPLIFICATION_NOT_ENDORSED
    http: 422
    condition: "amplification_planned is true on a permit whose amplification_endorsed is false."
  - id: ERR_QUIET_HOURS_VIOLATION
    http: 422
    condition: "Any minute of the requested occupation window falls inside the zone's quiet window."
  - id: ERR_PITCH_CLOSED
    http: 409
    condition: "A booking or draw is requested on a pitch whose availability_status is CLOSED."
  - id: ERR_PITCH_ZONE_MISMATCH
    http: 422
    condition: "fallback_pitch_id points at a pitch in a different zone, or at the pitch being created itself."
  - id: ERR_BOOKING_PERMIT_MISMATCH
    http: 422
    condition: "A complaint names a booking whose permit_id differs from the complaint's permit_id."

  - id: ERR_SESSION_TOO_LONG
    http: 422
    condition: "duration_minutes exceeds pitch.max_session_minutes."
  - id: ERR_BOOKING_LEAD_TIME
    http: 422
    condition: "start_at is less than MIN_BOOKING_LEAD_MINUTES (60) after the logical clock."
  - id: ERR_BOOKING_HORIZON_EXCEEDED
    http: 422
    condition: "start_at is more than MAX_BOOKING_HORIZON_DAYS (30) after the logical clock."
  - id: ERR_READING_OUTSIDE_SESSION
    http: 422
    condition: "taken_at is outside [booking.start_at, booking.end_at)."
  - id: ERR_SESSION_ALREADY_STARTED
    http: 409
    condition: "Cancellation is attempted at or after the booking's start_at."
  - id: ERR_PITCH_SLOT_OVERLAP
    http: 409
    condition: "The requested occupation conflicts with an existing booking or open draw on the pitch under the CHANGEOVER_BUFFER_MINUTES-expanded half-open interval test."
  - id: ERR_PITCH_DAILY_CAP_REACHED
    http: 409
    condition: "The pitch already holds daily_session_cap non-cancelled bookings on the requested UTC calendar date."
  - id: ERR_CLOSURE_WINDOW_CONFLICT
    http: 409
    condition: "Activating the closure would push the zone past max_concurrent_closures intersecting ACTIVE orders under the closed-interval test."

  - id: ERR_PITCH_NOT_PREMIUM
    http: 422
    condition: "A lottery draw is opened on a pitch whose tier is STANDARD."
  - id: ERR_ENTRY_DEADLINE_PASSED
    http: 409
    condition: "An entry is filed at or after the draw's entry_deadline_at."
  - id: ERR_ENTRY_DEADLINE_NOT_PASSED
    http: 409
    condition: "execute is called at or before the draw's entry_deadline_at."
  - id: ERR_DUPLICATE_LOTTERY_ENTRY
    http: 409
    condition: "The same permit is entered twice into one draw."
  - id: ERR_NO_ELIGIBLE_ENTRIES
    http: 409
    condition: "execute is called on a draw with entry_count == 0. (A draw that has entries but no ELIGIBLE ones is NOT an error: it succeeds with 200 and voids the draw.)"

  - id: ERR_INVOICE_PAST_DUE
    http: 402
    condition: "A booking or lottery entry is attempted while any FeeInvoice on the permit is PAST_DUE."
  - id: ERR_OUTSTANDING_INVOICE
    http: 402
    condition: "Renewal is attempted while any FeeInvoice on the permit is PENDING or PAST_DUE."
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents differs from the invoice's amount_due_cents."
  - id: ERR_RENEWAL_WINDOW_CLOSED
    http: 422
    condition: "Renewal is attempted outside [renewal_window_open_at, season_end_utc] for the permit's season_year."
  - id: ERR_RENEWAL_CONDUCT_INSUFFICIENT
    http: 422
    condition: "Performer.renewal_conduct_score is below RENEWAL_MIN_CONDUCT (80)."
  - id: ERR_SEASON_MINUTE_CAP_EXCEEDED
    http: 409
    condition: "permit.season_minutes_used + duration_minutes would exceed SEASON_MINUTES_CAP (1800)."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
roles:
  - name: PermitOfficer
    description: "City busking-program officer. Runs the register, the review desk, enforcement, the rotation draws, closures and the epoch advance. Segregation of duties is enforced BETWEEN officer user ids, not between roles: the officer who finalizes an audition may not decide that application, and the officer who triages a complaint may not adjudicate it."
    identity: "opaque"
    exclusive_operations:
      - "POST /busking/zones"
      - "POST /busking/pitches"
      - "POST /busking/performers"
      - "POST /busking/permit-applications/{id}/review"
      - "POST /busking/permit-applications/{id}/decision"
      - "POST /busking/auditions"
      - "POST /busking/auditions/{id}/finalize"
      - "POST /busking/permits/{id}/revoke"
      - "POST /busking/permits/{id}/reinstate"
      - "POST /busking/lottery-draws"
      - "POST /busking/lottery-draws/{id}/execute"
      - "POST /busking/complaints/{id}/triage"
      - "POST /busking/complaints/{id}/adjudicate"
      - "POST /busking/closure-orders"
      - "POST /busking/closure-orders/{id}/activate"
      - "POST /busking/ops-runs"
      - "POST /_clock/set_current_utc"
      - "GET /busking/complaints/{id}"
      - "GET /busking/complaints"
    shared_operations:
      - "POST /busking/permit-applications (shared with Performer)"
      - "POST /busking/fee-invoices/{id}/payments (shared with Performer)"
      - "POST /busking/session-bookings/{id}/cancel (shared with Performer)"
      - "POST /busking/complaints (shared with Resident)"
      - "all GET endpoints except GET /busking/auditions/{id}/scores, which it shares only with AuditionPanelist"

  - name: Performer
    description: "The street performer. X-User-ID is the Performer row's id; every mutation is checked against the performer_id reachable from the target resource."
    identity: "entity_backed:Performer"
    exclusive_operations:
      - "POST /busking/permit-applications/{id}/submit"
      - "POST /busking/permit-applications/{id}/revisions"
      - "POST /busking/permits/{id}/renew"
      - "POST /busking/lottery-draws/{id}/entries"
      - "POST /busking/session-bookings"
    shared_operations:
      - "POST /busking/permit-applications (shared with PermitOfficer)"
      - "POST /busking/fee-invoices/{id}/payments (shared with PermitOfficer)"
      - "POST /busking/session-bookings/{id}/cancel (shared with PermitOfficer)"
      - "read access to zones, pitches, performers, applications, auditions, permits, fee-invoices, draws, entries, bookings, noise readings and closure orders"

  - name: AuditionPanelist
    description: "Independent vetting panelist. X-User-ID is an operator identifier used only to enforce one score per panelist per sitting; it is never compared to any entity id."
    identity: "opaque"
    exclusive_operations:
      - "POST /busking/auditions/{id}/scores"
    shared_operations:
      - "GET /busking/auditions/{id}/scores (shared with PermitOfficer)"

  - name: NoiseInspector
    description: "Ordinance enforcement officer who meters live sessions. X-User-ID is recorded on each reading but is never compared to any entity id."
    identity: "opaque"
    exclusive_operations:
      - "POST /busking/noise-readings"
    shared_operations:
      - "GET /busking/zones/{id}, GET /busking/pitches/{id}, GET /busking/pitches, GET /busking/session-bookings/{id}, GET /busking/session-bookings, GET /busking/session-bookings/{id}/noise-readings"

  - name: Resident
    description: "Member of the public filing a complaint. X-User-ID identifies the complainant for the audit trail only and is never compared to any entity id."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /busking/complaints (shared with PermitOfficer)"
