              as: PlatformAdmin
              captures: { m3: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Xray Crew" }
              as: PlatformAdmin
              captures: { sx: $.data.id }
            - call: "POST /coverages"
              payload: { subcontractor_id: "${sx}", market_id: "${m1}", max_concurrent_jobs: 2, rank: 1 }
              as: PlatformAdmin
            - call: "POST /subcontractors"
              payload: { legal_name: "Yankee Crew" }
              as: PlatformAdmin
              captures: { sy: $.data.id }
            - call: "POST /coverages"
              payload: { subcontractor_id: "${sy}", market_id: "${m3}", max_concurrent_jobs: 1, rank: 1 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m3}", address_line: "3 Tide Flats", wind_zone: "HIGH" }
              as: PlatformAdmin
              captures: { pr3: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr3}", incident_type: "FIRE", priority: "P3" }
              as: Dispatcher
              captures: { ja: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr3}", incident_type: "STORM", priority: "P3" }
              as: Dispatcher
              captures: { jb: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr3}", incident_type: "VANDALISM", priority: "P3" }
              as: Dispatcher
              captures: { jc: $.data.id }
            - call: "PATCH /subcontractors/${sy}"
              payload: { status: "SUSPENDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /jobs/${ja}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { e1: $.data.error_id }
            - call: "POST /jobs/${ja}/dispatch"
              payload: { subcontractor_id: "${sx}" }
              as: Dispatcher
              captures: { e2: $.data.error_id }
            - call: "POST /jobs/${ja}/dispatch"
              payload: { subcontractor_id: "${sy}" }
              as: Dispatcher
              captures: { e3: $.data.error_id }
            - call: "PATCH /subcontractors/${sy}"
              payload: { status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /jobs/${jb}/dispatch"
              payload: { subcontractor_id: "${sy}" }
              as: Dispatcher
              captures: { asb: $.data.id }
            - call: "POST /assignments/${asb}/respond"
              payload: { outcome: "ACCEPT" }
              as: Subcontractor
              as_user_id: "${sy}"
            - call: "POST /jobs/${jc}/dispatch"
              payload: { subcontractor_id: "${sy}" }
              as: Dispatcher
              captures: { e4: $.data.error_id }
            - call: "POST /jobs/${jb}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { e5: $.data.error_id }
          assert:
            - "e1 == ERR_NO_COVERAGE (empty selector pool in TAC)"
            - "e2 == ERR_MARKET_MISMATCH (sx covers SEA only)"
            - "e3 == ERR_SUBCONTRACTOR_SUSPENDED (sy suspended at that moment)"
            - "e4 == ERR_CAPACITY_FULL (sy at max_concurrent_jobs 1 after accepting jb)"
            - "e5 == ERR_INVALID_STATE (jb is DISPATCHED with an open assignment; dispatch requires INTAKE)"
