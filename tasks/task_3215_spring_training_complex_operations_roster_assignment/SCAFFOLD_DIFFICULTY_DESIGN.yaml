              captures: { g94: $.data.id, g94_v: $.data.version }
            - call: "POST /camp-ops/complexes/${c95}/workout-groups"
              payload: { complex_id: "${c95}", roster_bucket: "MAJOR", group_name: "Group 95", facility_kind: "FIELD", capacity_units: 95 }
              as: ComplexDirector
              captures: { g95: $.data.id, g95_v: $.data.version }
            - call: "POST /camp-ops/complexes/${c99}/workout-groups"
              payload: { complex_id: "${c99}", roster_bucket: "MAJOR", group_name: "Group 99", facility_kind: "FIELD", capacity_units: 99 }
              as: ComplexDirector
              captures: { g99: $.data.id, g99_v: $.data.version }
            - call: "POST /camp-ops/complexes/${c100}/workout-groups"
              payload: { complex_id: "${c100}", roster_bucket: "MAJOR", group_name: "Group 100", facility_kind: "FIELD", capacity_units: 100 }
              as: ComplexDirector
              captures: { g100: $.data.id, g100_v: $.data.version }
            - call: "POST /camp-ops/workout-groups/${g94}/publish"
              payload: { expected_group_version: "${g94_v}" }
              as: ComplexDirector
            - call: "POST /camp-ops/workout-groups/${g95}/publish"
              payload: { expected_group_version: "${g95_v}" }
              as: ComplexDirector
            - call: "POST /camp-ops/workout-groups/${g99}/publish"
              payload: { expected_group_version: "${g99_v}" }
              as: ComplexDirector
            - call: "POST /camp-ops/workout-groups/${g100}/publish"
              payload: { expected_group_version: "${g100_v}" }
              as: ComplexDirector
          trigger:
            - call: "POST /camp-ops/complexes/${c94}/posture-sweeps"
              payload: {}
              as: ComplexDirector
            - call: "POST /camp-ops/complexes/${c95}/posture-sweeps"
              payload: {}
              as: ComplexDirector
            - call: "POST /camp-ops/complexes/${c99}/posture-sweeps"
              payload: {}
              as: ComplexDirector
            - call: "POST /camp-ops/complexes/${c100}/posture-sweeps"
              payload: {}
              as: ComplexDirector
          assert:
            - "Complex.${c94}.posted_occupancy_units == 94 and facility_posture == NORMAL"
            - "Complex.${c95}.posted_occupancy_units == 95 and facility_posture == FIELD_RESTRICTED"
            - "Complex.${c99}.posted_occupancy_units == 99 and facility_posture == FIELD_RESTRICTED"
            - "Complex.${c100}.posted_occupancy_units == 100 and facility_posture == CLOSED"
            - "Complex.${c100}.contention_flagged == false because 100 > 100 is false"
            - "contention_posture is WATCH at 94 (940 permille), TIGHT at 95 (950 permille) and OVER at 100 (1000 permille)"

      - name: ticket_sellout_flips_at_exactly_the_capacity_not_above_it
        grounds:
          - state_machines.HostCommunityRecord.transitions.ON_SALE_to_SOLD_OUT
          - validations[priority=24]
          - endpoints.POST_/camp-ops/host-community-records/{recordId}/sell-tickets
        distinguishing_aspect: "One host community record sold to 99 of a 100-ticket capacity stays ON_SALE while an identical record sold to exactly 100 flips to SOLD_OUT, so the sellout boundary is the equality itself; a zero-quantity sale is rejected outright rather than accepted as a no-op."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex with an ACTIVE agreement (ticket_price_cents 100, ticket_sellout_capacity 100) carrying two host community records, both on sale."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/community-agreements"
              payload: { complex_id: "${cx}", stadium_name: "Sloan Park", lease_start_date: "2026-01-01T00:00:00Z", lease_end_date: "2026-03-31T23:59:59Z", annual_rent_cents: 250000, sponsorship_minor_league_base_cents: 100000, sponsorship_major_league_base_cents: 250000, ticket_price_cents: 100, ticket_sellout_capacity: 100 }
              as: CommunityLiaison
              captures: { ag: $.data.id }
            - call: "POST /camp-ops/community-agreements/${ag}/activate"
              payload: {}
              as: CommunityLiaison
            - call: "POST /camp-ops/community-agreements/${ag}/host-community-record"
              payload: { agreement_id: "${ag}" }
              as: CommunityLiaison
              captures: { r99: $.data.id }
            - call: "POST /camp-ops/community-agreements/${ag}/host-community-record"
              payload: { agreement_id: "${ag}" }
              as: CommunityLiaison
              captures: { r100: $.data.id }
            - call: "POST /camp-ops/host-community-records/${r99}/open-ticketing"
              payload: {}
              as: CommunityLiaison
            - call: "POST /camp-ops/host-community-records/${r100}/open-ticketing"
              payload: {}
              as: CommunityLiaison
          trigger:
            - call: "POST /camp-ops/host-community-records/${r99}/sell-tickets"
              payload: { quantity: 99 }
              as: CommunityLiaison
            - call: "POST /camp-ops/host-community-records/${r100}/sell-tickets"
              payload: { quantity: 100 }
              as: CommunityLiaison
            - call: "POST /camp-ops/host-community-records/${r99}/sell-tickets"
              payload: { quantity: 0 }
              as: CommunityLiaison
              captures: { err: $.data.error_id }
          assert:
            - "HostCommunityRecord.${r99}.ticketing_status == ON_SALE and tickets_sold == 99"
            - "HostCommunityRecord.${r99}.ticketing_revenue_cents == 9900"
            - "HostCommunityRecord.${r100}.ticketing_status == SOLD_OUT and tickets_sold == 100"
            - "HostCommunityRecord.${r100}.ticketing_revenue_cents == 10000"
            - "the zero-quantity sale is rejected with ERR_INVALID_REQUEST and leaves tickets_sold at 99"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: physical_perform_gate_depends_on_the_invitation_report_window
        grounds:
          - validations[priority=10]
          - state_machines.Physical.transitions.SCHEDULED_to_PERFORMED
          - calculations.SpringReportDateCalculation
          - errors[ERR_PHYSICAL_WINDOW_LEAD]
        distinguishing_aspect: "A non-domestic pitcher's Physical may only be performed while its scheduled_visit_date sits at least 5 days before the owning CampInvitation's report_current_date, so the Physical machine's valid transitions are decided by the CampInvitation row's dates rather than by the Physical's own state."
        test_recipe:
          setup:
            - "Logical clock at 2026-02-01T00:00:00Z. One DEDICATED complex and one non-domestic pitcher (home_country Dominican Republic, position P) whose invitation computes report_current_date 2026-01-27."
            - "Two scheduled physicals: one at 2026-01-10 (inside the 5-day lead) and one at 2026-01-25 (outside it)."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Yunior Batista", idp_number: "IDP-41301", position_code: "P", acquisition_channel: "INTERNATIONAL_SIGNING", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "Dominican Republic", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
            - call: "POST /camp-ops/players/${pl}/roster-record"
              payload: { player_id: "${pl}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl}/program-profile"
              payload: { player_id: "${pl}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pl}/camp-invitations"
              payload: { player_id: "${pl}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
              captures: { inv: $.data.id }
            - call: "POST /camp-ops/players/${pl}/physicals"
              payload: { player_id: "${pl}", scheduled_visit_date: "2026-01-10T00:00:00Z" }
              as: TeamPhysician
              captures: { ph_ok: $.data.id }
            - call: "POST /camp-ops/players/${pl}/physicals"
              payload: { player_id: "${pl}", scheduled_visit_date: "2026-01-25T00:00:00Z" }
              as: TeamPhysician
              captures: { ph_late: $.data.id }
          trigger:
            - call: "POST /camp-ops/physicals/${ph_ok}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
            - call: "POST /camp-ops/physicals/${ph_late}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
              captures: { err: $.data.error_id }
          assert:
            - "CampInvitation.${inv}.report_current_date == 2026-01-27T00:00:00Z"
            - "Physical.${ph_ok}.status == PERFORMED because 2026-01-10 is at or before 2026-01-22"
            - "the late perform is rejected with status 422 and error_id ERR_PHYSICAL_WINDOW_LEAD"
            - "Physical.${ph_late}.status is unchanged at SCHEDULED"
            - "Player.${pl}.clearance_status == MEDICALS_COMPLETE after the successful perform"

      - name: away_game_publish_gate_depends_on_the_complex_posture
        grounds:
          - state_machines.GameSchedule.transitions.DRAFT_to_PUBLISHED
          - state_machines.Complex.transitions.NORMAL_to_CLOSED
          - errors[ERR_INVALID_STATE]
          - validations[priority=8]
        distinguishing_aspect: "The same AWAY game at an in-radius 180 miles publishes while its Complex posture is NORMAL and is rejected once that Complex has been driven to CLOSED, so GameSchedule's valid forward transition is decided by the Complex row's derived posture."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex at capacity 100 with no group assignments, and two AWAY games at radius 180."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 100 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/complexes/${cx}/games"
              payload: { complex_id: "${cx}", opponent_name: "Colorado Rockies", home_away: "AWAY", game_datetime: "2026-02-12T19:00:00Z", travel_radius_miles: 180, duration_units: 3, split_squad: false }
              as: ComplexDirector
              captures: { g1: $.data.id, g1_v: $.data.version }
            - call: "POST /camp-ops/complexes/${cx}/games"
              payload: { complex_id: "${cx}", opponent_name: "San Diego Padres", home_away: "AWAY", game_datetime: "2026-02-14T19:00:00Z", travel_radius_miles: 180, duration_units: 3, split_squad: false }
              as: ComplexDirector
              captures: { g2: $.data.id, g2_v: $.data.version }
          trigger:
            - call: "POST /camp-ops/games/${g1}/publish"
              payload: { expected_game_version: "${g1_v}" }
              as: ComplexDirector
            - call: "POST /camp-ops/complexes/${cx}/field-maintenance"
              payload: { maintenance_action: "CLOSED" }
              as: ComplexDirector
            - call: "POST /camp-ops/games/${g2}/publish"
              payload: { expected_game_version: "${g2_v}" }
              as: ComplexDirector
              captures: { err: $.data.error_id }
          assert:
            - "GameSchedule.${g1}.game_schedule_status == PUBLISHED because the complex posture was NORMAL"
            - "Complex.${cx}.facility_posture == CLOSED after field-maintenance"
            - "the second publish is rejected with status 409 and error_id ERR_INVALID_STATE"
            - "GameSchedule.${g2}.game_schedule_status is unchanged at DRAFT"
            - "GameSchedule.${g1} is unaffected because the closure cancels only DRAFT away games"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: workout_session_collides_with_a_candidate_game_interval
        grounds:
          - validations[priority=14]
          - state_machines.GameSchedule.transitions.DRAFT_to_PUBLISHED
          - errors[ERR_TEMPORAL_OVERLAP]
          - entities.GameSchedule.fields.game_interval_start
        distinguishing_aspect: "The game-publish overlap test is half-open yet adjacency-hostile: a session block ending exactly one hour before first pitch still collides, while an identical block on a sibling complex whose session ends earlier publishes cleanly — the interval arithmetic differs from the arrangement-liability rule's inclusive sweep."
