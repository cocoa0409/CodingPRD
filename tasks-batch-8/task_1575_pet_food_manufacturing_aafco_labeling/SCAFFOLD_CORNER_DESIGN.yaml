            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 26.0, crude_fat_min_pct: 9.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0, calcium_min_pct: 1.0, phosphorus_min_pct: 0.8 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/substantiate"
