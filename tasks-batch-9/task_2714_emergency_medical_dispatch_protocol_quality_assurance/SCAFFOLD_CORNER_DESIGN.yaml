            - "The score attempt returns 409 with data.error_id == ERR_REVIEW_NOT_SCORABLE even though expected_review_version is current — the state check at priority 40 is reached after the OCC check at 35 passes"
            - "The finalize attempt returns 409 with data.error_id == ERR_REVIEW_NOT_FINALIZABLE"
            - "GET /reviews/${r1_id}/score-sheets still returns exactly 1 sheet and Review.version is unchanged from ${r1_v_after_void}"

      - name: deciding_the_same_rebuttal_twice_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Rebuttal.terminal_states
