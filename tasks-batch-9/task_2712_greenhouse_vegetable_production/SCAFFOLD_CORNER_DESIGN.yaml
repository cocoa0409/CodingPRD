  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: stale_zone_version_on_climate_strategy_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers
          - concurrency_rules[climate-strategy-create-stale-zone]
          - errors[ERR_STALE_ZONE_VERSION]
        test_recipe:
          setup:
            - "One zone read at version 1, then one accepted ACTIVE DAY strategy that bumps Zone.version to 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-80", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc80: $.data.id, zc80_v0: $.data.version }
            - call: "POST /climate-strategies"
              payload: { zone_id: "${zc80}", regime: "DAY", window_start: "2026-08-07T06:00:00Z", window_end: "2026-08-07T18:00:00Z", temp_setpoint_c: 21.5, rh_setpoint_pct: 78, co2_setpoint_ppm: 900, lighting_hours: 6, screen_position_pct: 40, expected_zone_version: "${zc80_v0}" }
              as: GrowerManager
              captures: { s80: $.data.id }
            - call: "GET /zones/${zc80}"
              as: GrowerManager
              captures: { zc80_v1: $.data.version }
          trigger:
            - call: "POST /climate-strategies"
              payload: { zone_id: "${zc80}", regime: "NIGHT", window_start: "2026-08-07T18:00:00Z", window_end: "2026-08-08T06:00:00Z", temp_setpoint_c: 17.5, rh_setpoint_pct: 85, co2_setpoint_ppm: 420, lighting_hours: 0, screen_position_pct: 100, expected_zone_version: "${zc80_v0}" }
              as: GrowerManager
              captures: { occ_err: $.data.error_id }
          assert:
            - "${zc80_v0} == 1"
            - "${zc80_v1} == 2"
            - "${occ_err} == ERR_STALE_ZONE_VERSION"
            - "the call returns HTTP 412 even though the window does not overlap and every setpoint is in range"
            - "ClimateStrategy.${s80}.status == ACTIVE"
            - "only one ClimateStrategy row exists on Zone ${zc80}"
            - "Zone.${zc80}.version == 2, unchanged by the rejected write"

      - name: stale_zone_version_on_a_posture_override_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[zone-posture-override-stale-zone]
          - state_machines.Zone.ipm_posture.SCOUT_ALERT_to_NORMAL
          - errors[ERR_STALE_ZONE_VERSION]
        test_recipe:
          setup:
            - "One zone read at version 1, one crop cycle in TRANSPLANTED and one SCOUT worker."
            - "One above-threshold observation then moves ipm_posture to SCOUT_ALERT and bumps Zone.version, invalidating the client's cached view."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-81", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc81: $.data.id, zc81_v0: $.data.version }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { vc81: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zc81}", variety_id: "${vc81}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cc81: $.data.id }
            - call: "POST /crop-cycles/${cc81}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Sera Vos", skill: "SCOUT", hourly_rate_usd: 21.00, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { wc81: $.data.id }
            - call: "POST /scouting-observations"
              payload: { zone_id: "${zc81}", crop_cycle_id: "${cc81}", observed_at: "2026-08-06T08:00:00Z", pest_code: "WHITEFLY", plants_inspected: 60, pest_count_per_plant: 0.800 }
              as: IPMScout
              as_user_id: "${wc81}"
            - call: "GET /zones/${zc81}"
              as: GrowerManager
              captures: { zc81_v1: $.data.version, zc81_posture: $.data.ipm_posture }
          trigger:
            - call: "POST /zones/${zc81}/posture-overrides"
              payload: { target_field: "ipm_posture", target_value: "NORMAL", override_reason: "Stale client view", expected_zone_version: "${zc81_v0}" }
              as: GrowerManager
              captures: { occ_err2: $.data.error_id }
            - call: "POST /zones/${zc81}/posture-overrides"
              payload: { target_field: "ipm_posture", target_value: "NORMAL", override_reason: "Re-read then override", expected_zone_version: "${zc81_v1}" }
              as: GrowerManager
              captures: { zc81_after: $.data.ipm_posture }
          assert:
            - "${zc81_v0} == 1"
            - "${zc81_posture} == SCOUT_ALERT"
            - "${zc81_v1} > ${zc81_v0}"
            - "${occ_err2} == ERR_STALE_ZONE_VERSION"
            - "the first override returns HTTP 412 and changes nothing"
            - "${zc81_after} == NORMAL"
            - "Zone.${zc81}.open_pest_alert_count == 0"
            - "the retry with the freshly read version succeeds, proving the guard is on the version and not on the payload"

