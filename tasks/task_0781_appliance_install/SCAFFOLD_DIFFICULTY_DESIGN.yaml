        distinguishing_aspect: "Mode (a) non-linear formula: with 4 additive inputs the bundle discount is min(6000, cap 5000)=5000 and the surcharge is max(flat 4000, 1800)=4000, so both the min-cap and the max-select branches are exercised, yielding final 71000."
