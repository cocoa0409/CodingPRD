  # =========================================================================
  # Rule 4 — transitive_cascade: two cascades from different triggers,
  # one depth>=3 the other depth>=2.
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settlement_accept_cascade_depth3
        grounds:
          - state_machines.Claim.OFFERED_to_PAID
          - state_machines.Settlement.OFFERED_to_ACCEPTED
          - state_machines.Reserve.OPEN_to_EXHAUSTED
          - calculations.claim_ratio_analytics
        distinguishing_aspect: |
          Trigger: Settlement accept. Chain: Settlement.state := ACCEPTED
          mutates Claim (filing_status := PAID, payment_status := PAID_IN_FULL)
          — that Claim mutation itself triggers Reserve EXHAUSTED and Carrier
          claims_paid_count+1 → Carrier claim_ratio_bp recomputed (depth 4
          counting the ratio recompute).
