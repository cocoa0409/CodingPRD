              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /demand-forecast-buckets/${bucket}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v2: $.data.version }
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${wh_v2}" }
              as: LogisticsPlanner
