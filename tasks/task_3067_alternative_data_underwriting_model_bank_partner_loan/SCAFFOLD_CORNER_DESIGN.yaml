  # ===========================================================================
  - section: errors
    instances:
      - name: model_locked_error_on_patch_of_validated_model
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MODEL_LOCKED
          - state_machines.ModelVersion
        distinguishing_aspect: "ERR_MODEL_LOCKED (not ERR_MODEL_INVALID_STATE) fires when PATCH targets a VALIDATED model with a correct expected version — the dedicated domain error distinguishes 'locked for edit' from a generic state rejection."
        test_recipe:
          setup:
            - "Logical clock at default. One model VALIDATED (post-validate, pre-activate); version observed."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-R-1", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "lock", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
          trigger:
            - call: "PATCH /platform/model-versions/${m_id}"
              payload: { variables: [{ name: "bureau_score", weight: 2, min: 300, max: 850 }], score_floor: 0, score_ceiling: 1000, expected_model_version: "${m_v} + 1" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_MODEL_LOCKED"
            - "error_id != ERR_MODEL_INVALID_STATE"
            - "ModelVersion.${m_id}.variables is unchanged (weight still 1)"

      - name: model_activate_blocked_by_open_exclusion_review
        claim_type: violation_to_error
        grounds:
          - errors.ERR_EXCLUSION_REVIEW_OPEN
          - validations[priority=7]
        distinguishing_aspect: "A VALIDATED model with a PASSED disparate-impact review but a PENDING VARIABLE_EXCLUSION review fails activation with ERR_EXCLUSION_REVIEW_OPEN — the two governance errors are distinct and this one names the open-review gate specifically."
        test_recipe:
          setup:
            - "Logical clock at default. Model VALIDATED; one DISPARATE_IMPACT review PASSED; one VARIABLE_EXCLUSION review still PENDING."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-R-2", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "excl", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "DISPARATE_IMPACT", details: "di" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_di: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_di}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "VARIABLE_EXCLUSION", details: "vex pending" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_vex: $.data.id }
          trigger:
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_EXCLUSION_REVIEW_OPEN"
            - "error_id != ERR_FAIRNESS_GATE_BLOCKING"
            - "ModelVersion.${m_id}.status is still VALIDATED"

      - name: model_retire_blocked_with_open_applications
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MODEL_HAS_OPEN_APPLICATIONS
          - state_machines.ModelVersion.ACTIVE_to_RETIRED
        distinguishing_aspect: "Retiring the ACTIVE model while one of its applications sits in VERIFICATION_PENDING (non-terminal) is 409 ERR_MODEL_HAS_OPEN_APPLICATIONS; after that application is withdrawn (terminal), the identical retire succeeds."
        test_recipe:
          setup:
            - "Logical clock at default. Model ACTIVE; one application VERIFICATION_PENDING scored by it."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-R-3", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "retire", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/applicants"
              payload: { full_name: "Retire Ruth", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /platform/model-versions/${m_id}/retire"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { err: $.data.error_id }
            - call: "POST /platform/applications/${app_id}/withdraw"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pad-one"
            - call: "POST /platform/model-versions/${m_id}/retire"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
          assert:
            - "the first retire is 409 with error_id == ERR_MODEL_HAS_OPEN_APPLICATIONS"
            - "after the application is WITHDRAWN (terminal), the second retire returns 200 and ModelVersion.${m_id}.status == RETIRED"

      - name: fairness_gate_blocking_when_review_failed
        claim_type: violation_to_error
        grounds:
          - errors.ERR_FAIRNESS_GATE_BLOCKING
          - validations[priority=7]
        distinguishing_aspect: "A VALIDATED model whose only DISPARATE_IMPACT review was decided FAILED fails activation with ERR_FAIRNESS_GATE_BLOCKING — a decided failure blocks even though no review is PENDING."
        test_recipe:
          setup:
            - "Logical clock at default. Model VALIDATED; one DISPARATE_IMPACT review decided FAILED."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-R-4", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "gate", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "DISPARATE_IMPACT", details: "failed di" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "FAILED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
          trigger:
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FAIRNESS_GATE_BLOCKING"
            - "ModelVersion.${m_id}.status is still VALIDATED"

