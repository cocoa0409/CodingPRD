              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "seat conservation: CourseSection.${sec_id}.provisioned_access_count == 1 and revoked_access_count == 1 both before and after the rebill, summing to 2 == the number of charges with access_status != NOT_PROVISIONED"
            - "no access_status changed: StudentCharge.${chg1_id}.access_status == REVOKED and StudentCharge.${chg2_id}.access_status == PROVISIONED, with access_restored_at == null on both"
            - "money deliberately moved: StudentCharge.${chg2_id}.gross_price_cents == 6300, billed_amount_cents == 6300, net_billed_cents == 6300, billing_status == REBILLED, rebill_count == 1"
            - "GET /charges/${chg2_id}/ledger-entries returns total_count == 3 summing to 6300: +9450, -9450 (REBILL_CREDIT), +6300 (REBILL_CHARGE)"
            - "Student.${stu2_id}.bursar_balance_cents == 6300 (down 3150) while Student.${stu1_id}.bursar_balance_cents == 0 (untouched)"
            - "scope exclusion: StudentCharge.${chg1_id}.adoption_id is still ${adopt1_id}, billing_status == REFUNDED, rebill_count == 0, and its ledger still holds exactly 2 rows summing to 0"
            - "StudentCharge.${chg2_id}.adoption_id == ${adopt2_id} and publisher_share_cents == 5544"
            - "Adoption.${adopt1_id}.status == SUPERSEDED and Adoption.${adopt2_id}.status == APPROVED with requires_rebill == true and locked_list_price_cents == 12000"
            - "CourseSection.${sec_id}.participation_rate == 0.5000 and ia_status == BILLED (unchanged - the rebill cannot move a participation figure)"
            - "PublisherAgreement.${agr_id}.reconciliation_status == STALE while ReconciliationRun.${run_id} keeps its frozen gross_invoice_cents == 8316"
