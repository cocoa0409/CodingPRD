# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Group Home & IDD Residential (HCBS Waiver)
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by
# §1.8 (those are excluded_because stubs). All numeric asserts precomputed.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: agency_creation_applies_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.ProviderAgency.fields.day_staff_ratio, entities.ProviderAgency.fields.cash_collected_cents]
        distinguishing_aspect: "Omitting optional ratio fields applies defaults 4/8/15; system fields are server-minted (version starts at 1, computed ledgers at 0)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id, day_r: $.data.day_staff_ratio, night_r: $.data.night_staff_ratio, grace: $.data.evv_grace_minutes, ver: $.data.version, cash: $.data.cash_collected_cents } }
          trigger:
            - { call: "GET /agencies/${ag_id}", payload: {}, as: Any }
          assert:
            - "create response: day_staff_ratio == 4, night_staff_ratio == 8, evv_grace_minutes == 15 (defaults applied)"
            - "version == 1; cash_collected_cents == 0; recoupment_balance_cents == 0; held_claims_count == 0"
            - "id is a UUID without any type prefix; created_at has ISO8601 UTC form with three fractional digits"

      - name: agency_create_missing_required_name_rejected
        claim_type: required_fields
        grounds: [entities.ProviderAgency.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /agencies without name is rejected with ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /agencies", payload: { day_staff_ratio: 4 }, as: AgencyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: individual_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.Individual]
        distinguishing_aspect: "GET by id returns exactly the fields supplied at creation plus system fields."
        test_recipe:
          setup: ["Agency and CaseManager exist; one individual registered"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "WHEELCHAIR" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
          trigger:
            - { call: "GET /individuals/${ind_id}", payload: {}, as: Any, captures: { mn: $.data.legal_name, mob: $.data.mobility_level, st: $.data.status } }
          assert:
            - "legal_name == 'Ind One', medicaid_id == 'MCD-001', mobility_level == WHEELCHAIR"
            - "status == APPLICANT (initial state) and enrolled_at == null"

      - name: individual_get_nonexistent_id_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404), not a generic 500."
        test_recipe:
          setup: ["Agency exists"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
          trigger:
            - { call: "GET /individuals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: individual_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Individual.fields.mobility_level, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "mobility_level outside {AMBULATORY, ASSIST, WHEELCHAIR} is rejected."
        test_recipe:
          setup: ["Agency and CaseManager exist"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
          trigger:
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind X", medicaid_id: "MCD-009", date_of_birth: "1990-01-01", mobility_level: "FLOATING" }, as: CaseManager, as_user_id: "${cm_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: unknown_request_field_input_ignored_rejected
        claim_type: system_fields
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A client-supplied computed/system field (cash_collected_cents) in the create body is an unknown field and is rejected; computed fields can never be set by clients."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /agencies", payload: { name: "Agency A", cash_collected_cents: 999999 }, as: AgencyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST — computed ledger fields are server-owned"

      - name: med_admin_event_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.MedAdminEvent]
        distinguishing_aspect: "MedAdminEvent carries common_fields: false — response exposes id and created_at only; no version and no updated_at; no update endpoint exists."
        test_recipe:
          setup: ["Individual ENROLLED; ACTIVE medication order; DSP D1 with MED_CERT; clock 2026-06-01"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /medication-orders", payload: { individual_id: "${ind_id}", drug_name: "Metformin", dosage: "500mg", schedule_times: ["08:00"], start_date: "2026-06-01" }, as: QIDP, as_user_id: "${q_id}", captures: { mo_id: $.data.id } }
          trigger:
            - { call: "POST /admin-events", payload: { medication_order_id: "${mo_id}", scheduled_time: "2026-06-02T08:00:00Z", outcome: "GIVEN", administered_time: "2026-06-02T08:05:00Z" }, as: DSP, as_user_id: "${d1_id}", captures: { ev_id: $.data.id, by: $.data.administered_by_staff_id } }
          assert:
            - "response contains id and created_at but NO version and NO updated_at (common_fields: false)"
            - "administered_by_staff_id == ${d1_id} (taken from X-User-ID, not from the request body)"

      - name: individuals_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Individual]
        distinguishing_aspect: "Pagination fields limit/offset/total_count/has_more behave per the fixed envelope: page 1 of 2 with limit 2 over 3 rows."
        test_recipe:
          setup: ["Agency, CaseManager; three individuals registered"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind A", medicaid_id: "MCD-101", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind B", medicaid_id: "MCD-102", date_of_birth: "1990-01-02", mobility_level: "ASSIST" }, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind C", medicaid_id: "MCD-103", date_of_birth: "1990-01-03", mobility_level: "WHEELCHAIR" }, as: CaseManager, as_user_id: "${cm_id}" }
          trigger:
            - { call: "GET /individuals", payload: { agency_id: "${ag_id}", limit: 2, offset: 0 }, as: Any }
            - { call: "GET /individuals", payload: { agency_id: "${ag_id}", limit: 2, offset: 2 }, as: Any }
          assert:
            - "page 1: response_type == 'array', len(data) == 2, total_count == 3, has_more == true"
            - "page 2: len(data) == 1, total_count == 3, has_more == false"
            - "filter agency_id is honored: no rows from other agencies appear"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: isp_initial_state_and_return_loop
        claim_type: valid_transition
        grounds: [state_machines.ISP.PENDING_REVIEW_to_DRAFT, state_machines.ISP.DRAFT_to_PENDING_REVIEW]
        distinguishing_aspect: "New ISP starts DRAFT; the QIDP return transition reverts PENDING_REVIEW -> DRAFT and the plan can be submitted again (branching-with-revert loop)."
        test_recipe:
          setup: ["Individual ENROLLED; ISP created; clock 2026-06-01"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}", captures: { st1: $.data.status } }
            - { call: "POST /isps/${isp_id}/return", payload: { return_reason: "Goals need measurable outcomes" }, as: QIDP, as_user_id: "${q_id}", captures: { st2: $.data.status } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}", captures: { st3: $.data.status } }
          assert:
            - "initial status == DRAFT and amendment_count == 0"
            - "after submit: PENDING_REVIEW; after return: DRAFT; after resubmit: PENDING_REVIEW (revert loop works)"

      - name: isp_approve_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ISP.PENDING_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "approve is only declared from PENDING_REVIEW; calling it on a DRAFT ISP fails with ERR_INVALID_STATE and no fields change."
        test_recipe:
          setup: ["Individual ENROLLED; ISP in DRAFT; clock 2026-06-01"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { err: $.data.error_id } }
            - { call: "GET /isps/${isp_id}", payload: {}, as: Any, captures: { st: $.data.status, v1: $.data.version } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "ISP still DRAFT and version unchanged (no side effects fired)"

      - name: isp_terminal_expired_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ISP.ACTIVE_to_EXPIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Once EXPIRED (terminal), every further action — submit-review, approve, amend — is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Individual ENROLLED; ISP ACTIVE with plan_year_end 2026-06-30; clock advanced past the plan year"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-06-30", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /isps/${isp_id}/activate", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { isp_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "GET /isps/${isp_id}", payload: {}, as: Any, captures: { isp_st: $.data.status, isp_vx: $.data.version } }
          trigger:
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /isps/${isp_id}/amend", payload: { expected_isp_version: "${isp_vx}", goals_summary: "Attempted amendment of expired plan" }, as: CaseManager, as_user_id: "${cm_id}", captures: { err2: $.data.error_id } }
          assert:
            - "ISP status == EXPIRED after the clock crossed plan_year_end"
            - "submit-review on EXPIRED -> error_id == ERR_INVALID_STATE"
            - "amend on EXPIRED -> error_id == ERR_INVALID_STATE (state precondition fires before any amendment logic)"

      - name: authorization_resume_blocked_while_isp_expired
        claim_type: precondition_enforcement
        grounds: [state_machines.ServiceAuthorization.SUSPENDED_to_ACTIVE, "errors[ERR_ISP_NOT_ACTIVE]"]
        distinguishing_aspect: "The SUSPENDED -> ACTIVE resume guard is cross-entity: with the anchoring ISP EXPIRED, resume fails with ERR_ISP_NOT_ACTIVE even though the authorization itself is in the correct from-state."
        test_recipe:
          setup: ["Individual ENROLLED; ISP (plan year ending 2026-06-30) ACTIVE; authorization ACTIVE; clock crossed to 2026-07-01 so ISP expired and the authorization is SUSPENDED"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-06-30", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /isps/${isp_id}/activate", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /authorizations", payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "DAY_PROG", unit_type: "FIFTEEN_MIN", authorized_units: 24, rate_cents: 1500, span_start: "2026-01-01", span_end: "2026-06-30" }, as: CaseManager, as_user_id: "${cm_id}", captures: { auth_id: $.data.id } }
            - { call: "POST /authorizations/${auth_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: AgencyAdmin }
          trigger:
            - { call: "POST /authorizations/${auth_id}/resume", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ISP_NOT_ACTIVE — the ISP gate precedes the in-span check"

      - name: shift_confirm_ownership_and_completion_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.ShiftAssignment.SCHEDULED_to_CONFIRMED, state_machines.ShiftAssignment.CONFIRMED_to_COMPLETED, state_machines.EVVVisit.PENDING_to_VERIFIED]
        distinguishing_aspect: "Only the assigned DSP can confirm (ownership); a VERIFIED EVV visit with shift_id then flips the CONFIRMED shift to COMPLETED automatically (cross-entity side effect)."
        test_recipe:
          setup: ["Home ACTIVE; individual ENROLLED; ISP ACTIVE; authorization ACTIVE; DSP D1 with a DAY shift on 2026-06-02; clock 2026-06-01"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 2 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
