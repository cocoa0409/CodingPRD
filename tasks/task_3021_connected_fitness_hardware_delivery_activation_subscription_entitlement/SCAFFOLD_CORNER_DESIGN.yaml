            - call: "POST /fitness/service-orders/${so_id}/reserve-part"
              payload: { part_id: "${pi_id}", quantity: 3 }
              as: ServiceTechnician
              captures: { exact_qty: $.data.reserved_part_qty }
          assert:
            - "the zero-quantity reservation is refused with 400 ERR_INVALID_REQUEST or 409 ERR_PART_SAFETY_STOCK (captured as ${err_zero}), never a 200"
            - "PartsInventory.${pi_id}.reserved_qty stays 0 and PartsInventory.${pi_id}.on_hand_qty stays 5 immediately after the refusal"
            - "the boundary above it is admitted: reserving exactly 3, equal to on_hand 5 minus safety_stock 2, succeeds with reserved_part_qty == 3 (captured as ${exact_qty})"
            - "ServiceOrder.${so_id}.status == PART_RESERVED and PartsInventory.${pi_id}.on_hand_qty == 2"

      - name: class_session_hour_long_session_scores_exactly_the_upper_benchmark
        claim_type: Constants Applied
        grounds:
          - calculations.leaderboard_integrity_cap
          - entities.ClassEnrollment.fields.integrity_points
        distinguishing_aspect: "A one-hour CYCLING session pins duration_cap at exactly 100 points and discipline_cap at exactly 200, so an output of 150 is capped to 150, an output of 250 is capped to 200, and an output of 601 is flagged."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T13:30:00Z. Membership ACTIVE with a verified OWNER and a delivered linked ACTIVE device; a PUBLISHED one-hour ON_DEMAND CYCLING session from 2026-09-10T09:00:00Z to 2026-09-10T10:00:00Z with capacity 100."
