            - { call: "POST /notices/${n_b}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
          trigger:
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "LUMP_SUM_CASH", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}", captures: { el_a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:01Z" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_b}", payload: {}, as: ProviderOps, captures: { c_b_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_b}/elections", payload: { election_type: "LUMP_SUM_CASH", expected_case_version: "${c_b_v}" }, as: Participant, as_user_id: "${p_b}", captures: { err: $.data.error_id } }
          assert:
            - "Election at exactly the deadline succeeds: ${el_a} created with election_status == SUBMITTED; case ${c_a} -> ELECTED"
            - "Election one second after the deadline fails: err == ERR_ELECTION_WINDOW_CLOSED, http 422"
            - "Case ${c_b}.case_status remains NOTIFIED (no sweep ran; temporal rule fired, not a state rule)"

      - name: match_score_auto_confirm_boundary
        grounds:
          - calculations.match_score
          - state_machines.MatchCandidate.CANDIDATE_to_CONFIRMED
