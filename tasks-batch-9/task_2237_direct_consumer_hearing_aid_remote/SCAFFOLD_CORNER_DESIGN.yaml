        claim_type: cycle_constraint
        grounds: [complexity_profile.entity_topology_note, entities.RedFlagFinding, entities.ProviderReferral]
        distinguishing_aspect: "The declared cycle ScreeningSession -> RedFlagFinding -> ProviderReferral -> ScreeningSession must be navigable in both directions after a determination clears the flag: the finding points at the clearing referral and the referral points back at the triggering screening."
        test_recipe:
          setup:
            - "POLICY_CA + Patient; screening submitted with the SUDDEN_LOSS symptom so one MANDATORY_REFERRAL finding and one OPEN ProviderReferral are created; a CA-licensed LICENSED_AUDIOLOGIST takes the REFERRAL_EVALUATION slot, the session is started and completed so the referral reaches EVALUATED."
