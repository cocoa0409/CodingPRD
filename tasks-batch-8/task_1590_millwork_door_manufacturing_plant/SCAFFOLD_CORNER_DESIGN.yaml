          trigger:
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op1}", roll_id: "${roll_id}", expected_roll_version: "${roll_v}" }, as: LabelAuthority, as_user_id: "la-1", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_OPENING_NOT_RATED"
      - name: rework_batch_requires_rework_openings
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_REWORK_OPENINGS]"]
        distinguishing_aspect: "Creating an is_rework_batch=true batch when no opening of the order is in REWORK fails ERR_NO_REWORK_OPENINGS (order is IN_PRODUCTION, so the non-rework FINISHING gate is not the failing rule)."
