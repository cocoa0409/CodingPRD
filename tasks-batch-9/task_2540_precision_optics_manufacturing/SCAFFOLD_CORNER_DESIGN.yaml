            - "the captured fresh version is 2 and the second revision returns HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "OpticalDesign.${d1}.version == 2 after both refusals, so neither refusal wrote anything"
            - "the release returns HTTP 200 and the captured version is then 3"
            - "the third revision returns HTTP 201 with OpticalDesign.${d2}.design_revision == 2 and supersedes_design_id == ${d1}"
            - "OpticalDesign.${d1}.design_status == SUPERSEDED and version == 4"

      - name: exact_blank_equality_is_admissible_and_the_next_reservation_is_rejected
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_26
          - calculations.blank_conservation_ledger
          - errors.ERR_INSUFFICIENT_BLANKS
          - state_machines.GlassLot.RELEASED_to_DEPLETED
        distinguishing_aspect: |
          The sufficiency test is `available >= reserved` inclusive: on a four-blank lot an order needing
          exactly four (element_count 3 plus one spare) is admitted and drives available to 0, while the
          next order needing two is refused with ERR_INSUFFICIENT_BLANKS. The lot must NOT be DEPLETED —
          the transition demands available 0 AND reserved 0, and reserved is still 4.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one 0.0375-wave ACTIVE allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 4."
            - "The design's min_center_thickness_um default 5800.0 is below the lot's 6200.0 blank, and the certified grades H3/B match the design limits, so neither the grade gate nor the thickness gate interferes."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z unless stated otherwise."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 4, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
          trigger:
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-A", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 3, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v2: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-B", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 1, expected_glass_lot_version: "${g1v2}" }
              as: ProcessTechnician
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
          assert:
            - "the first create returns HTTP 201 with WorkOrder.${w1}.reserved_blank_count == 4"
            - "GlassLot.${g1}.available_blank_count == 0 and reserved_blank_count == 4"
            - "GlassLot.${g1}.lot_status == RELEASED, not DEPLETED"
            - "the second create returns HTTP 409 with error_id ERR_INSUFFICIENT_BLANKS (it needed 1 + 1 == 2 blanks against 0 available)"
            - "GlassLot.${g1}.reserved_blank_count == 4 and version == 3 after the refusal (create 1, certification 2, first order 3)"
            - "4 == 0 + 4 + 0 + 0, so the invariant holds"

      - name: the_compliance_screen_needs_a_classification_and_clears_an_exempt_one_directly
