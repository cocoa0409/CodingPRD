  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: kit_unit_four_bucket_conservation_across_allocate_and_cancel
        conserved_quantity: physical kit units per KitLine (units_available + units_reserved + units_shipped + units_written_off == units_received)
        grounds:
          - calculations.kit_unit_conservation
          - calculations.kit_reservation_selector
          - state_machines.SampleShipment.ALLOCATED_to_CANCELLED
          - endpoints[POST /kit-lines/{kit_line_id}/write-offs]
        distinguishing_aspect: |
          The conserved quantity is PHYSICAL INVENTORY spread over four buckets, and a write-off has already
          moved 3 units into a bucket the compensation must NOT touch. The forward action reserves
          1 / 2 / 1 units across the three lines and the compensating cancel must return exactly those
          amounts - restoring units_available to 7 / 20 / 10 rather than to the pre-write-off 10 / 20 / 10 -
          so the four-bucket sum still equals units_received on every line.
        test_recipe:
          setup:
            - "One campaign in SAMPLING_ACTIVE with three ACTIVE kit lines receiving 10 / 20 / 10 units and quantity_per_kit 1 / 2 / 1."
            - "3 units of the first line have been written off, so that line stands at units_available 7 and units_written_off 3, and Campaign.write_off_cost_cents is 3 * 1417 = 4251."
            - "One screened non-holdout enrollment holds one ALLOCATED shipment, so the lines stand at 6 / 18 / 9 available and 1 / 2 / 1 reserved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Unit Conservation", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "ACC-2", component_role: "ACCESSORY", unit_cost_cents: 388, quantity_per_kit: 2, component_discount_pct: 0.85 }
              as: CampaignManager
              captures: { kl2_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "INS-3", component_role: "INSERT_CARD", unit_cost_cents: 554, quantity_per_kit: 1, component_discount_pct: 0.9 }
              as: CampaignManager
              captures: { kl3_id: $.data.id }
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl2_id}/receipts"
              payload: { units: 20 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl3_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl1_id}/write-offs"
              payload: { units: 3, reason: "crushed during inbound handling" }
              as: FulfillmentOps
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "uc1@example.com", display_name: "UC One", address_hash: "H-UC1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
              as: CampaignManager
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/screen"
              payload: {}
              as: CampaignManager
              captures: { e1_v: $.data.version }
            - call: "POST /campaigns/${camp_id}/activate-sampling"
              payload: {}
              as: CampaignManager
            - call: "POST /fulfillment-centers"
              payload: { name: "FC Units", zone_code: "EAST", daily_pick_capacity_units: 100, freight_cents_per_kit: 300 }
              as: FulfillmentOps
              captures: { fc_id: $.data.id }
            - call: "POST /fulfillment-waves"
              payload: { fulfillment_center_id: "${fc_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z", planned_capacity_units: 20 }
              as: FulfillmentOps
              captures: { w1_id: $.data.id }
            - call: "POST /sample-shipments"
              payload: { enrollment_id: "${e1_id}", fulfillment_wave_id: "${w1_id}", expected_enrollment_version: "${e1_v}", surcharge_cents: 0 }
              as: FulfillmentOps
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /sample-shipments/${s1_id}/cancel"
              payload: {}
              as: FulfillmentOps
          assert:
            - "KitLine.${kl1_id}.units_received == 10"
            - "KitLine.${kl1_id}.units_available == 7"
            - "KitLine.${kl1_id}.units_reserved == 0"
            - "KitLine.${kl1_id}.units_shipped == 0"
            - "KitLine.${kl1_id}.units_written_off == 3"
            - "KitLine.${kl2_id}.units_received == 20"
            - "KitLine.${kl2_id}.units_available == 20"
            - "KitLine.${kl2_id}.units_reserved == 0"
            - "KitLine.${kl2_id}.units_written_off == 0"
            - "KitLine.${kl3_id}.units_received == 10"
            - "KitLine.${kl3_id}.units_available == 10"
            - "KitLine.${kl3_id}.units_reserved == 0"
            - "for each of the three kit lines: units_available + units_reserved + units_shipped + units_written_off == units_received"
            - "Campaign.${camp_id}.write_off_cost_cents == 4251"
            - "Campaign.${camp_id}.cost_per_sample_final_cents == 0 (no shipment ever reached DELIVERED or LOST)"
            - "SampleShipment.${s1_id}.status == CANCELLED"
            - "SampleShipment.${s1_id}.kit_unit_total == 4"

      - name: budget_cents_conservation_uses_the_allocation_snapshot_not_current_kit_cost
        conserved_quantity: campaign budget cents (budget_committed_cents + budget_available_cents == budget_total_cents)
        grounds:
          - calculations.campaign_budget_conservation
          - calculations.kit_assembly_unit_cost
          - entities.SampleShipment.fields.committed_cost_cents
          - state_machines.KitLine.ACTIVE_to_RETIRED
          - state_machines.SampleShipment.ALLOCATED_to_CANCELLED
        distinguishing_aspect: |
          A different conserved quantity - BUDGET CENTS across two buckets rather than physical units across
          four - and the compensation is deliberately attacked: a kit line is RETIRED between the allocation
          and the cancellation, dropping kit_assembly_unit_cost_cents from 454 to 399. The cancel must
          return the 754-cent SNAPSHOT stored on the shipment, not a recomputation from the current kit cost
          (which would return 699 and permanently leak 55 cents), so budget_available_cents must land back
          on exactly 1000000.
        test_recipe:
          setup:
            - "One campaign with budget_total_cents 1000000 in SAMPLING_ACTIVE, three ACTIVE kit lines summing to a kit assembly cost of 454, and a center whose freight is 300."
            - "One screened non-holdout enrollment holds one ALLOCATED shipment whose committed_cost_cents snapshot is 754, so budget_committed_cents is 754 and budget_available_cents is 999246."
            - "The third kit line (extended cost 55) is then RETIRED, so kit_assembly_unit_cost_cents becomes 283 + 116 = 399 while the shipment's snapshot stays 754."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Budget Conservation", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "ACC-2", component_role: "ACCESSORY", unit_cost_cents: 388, quantity_per_kit: 2, component_discount_pct: 0.85 }
              as: CampaignManager
              captures: { kl2_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "INS-3", component_role: "INSERT_CARD", unit_cost_cents: 554, quantity_per_kit: 1, component_discount_pct: 0.9 }
              as: CampaignManager
              captures: { kl3_id: $.data.id }
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl2_id}/receipts"
              payload: { units: 20 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl3_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "bc1@example.com", display_name: "BC One", address_hash: "H-BC1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
              as: CampaignManager
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/screen"
              payload: {}
              as: CampaignManager
              captures: { e1_v: $.data.version }
            - call: "POST /campaigns/${camp_id}/activate-sampling"
              payload: {}
              as: CampaignManager
            - call: "POST /fulfillment-centers"
              payload: { name: "FC Budget", zone_code: "EAST", daily_pick_capacity_units: 100, freight_cents_per_kit: 300 }
              as: FulfillmentOps
              captures: { fc_id: $.data.id }
            - call: "POST /fulfillment-waves"
              payload: { fulfillment_center_id: "${fc_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z", planned_capacity_units: 20 }
              as: FulfillmentOps
              captures: { w1_id: $.data.id }
            - call: "POST /sample-shipments"
              payload: { enrollment_id: "${e1_id}", fulfillment_wave_id: "${w1_id}", expected_enrollment_version: "${e1_v}", surcharge_cents: 0 }
              as: FulfillmentOps
              captures: { s1_id: $.data.id }
            - call: "POST /kit-lines/${kl3_id}/retire"
              payload: {}
              as: CampaignManager
          trigger:
            - call: "POST /sample-shipments/${s1_id}/cancel"
              payload: {}
              as: FulfillmentOps
          assert:
            - "SampleShipment.${s1_id}.committed_cost_cents == 754 (the allocation-time snapshot is immutable)"
            - "SampleShipment.${s1_id}.status == CANCELLED"
            - "KitLine.${kl3_id}.status == RETIRED"
            - "Campaign.${camp_id}.kit_assembly_unit_cost_cents == 399"
            - "Campaign.${camp_id}.budget_committed_cents == 0"
            - "Campaign.${camp_id}.budget_available_cents == 1000000"
            - "Campaign.${camp_id}.budget_available_cents != 999945 (999246 + 699 is the forbidden recompute-from-current-kit-cost reading, which leaks 55 cents)"
            - "Campaign.${camp_id}.budget_committed_cents + Campaign.${camp_id}.budget_available_cents == 1000000"
            - "Campaign.${camp_id}.allocated_sample_count == 0"
            - "Campaign.${camp_id}.cost_per_sample_provisional_cents == 0"
            - "KitLine.${kl3_id}.units_available == 10"
            - "KitLine.${kl3_id}.units_reserved == 0"
