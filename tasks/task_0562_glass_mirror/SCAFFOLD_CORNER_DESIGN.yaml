            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_account_version: "${acct_v0}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { job_id: $.data.ordered_job_id }
          trigger:
            - call: "POST /claim-reports"
              payload: { job_id: "${job_id}", line_item_id: "${li_id}", claim_type: "BREAKAGE", cause: "premature", billable_to_contractor: true }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
