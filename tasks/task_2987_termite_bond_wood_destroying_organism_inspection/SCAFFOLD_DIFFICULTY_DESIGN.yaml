  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: station_escalation_propagates_to_plan_then_to_bond_coverage_watch
        grounds:
          - state_machines.BaitStation.ACTIVE_HIT_to_ESCALATED
          - calculations.station_interval_and_escalation
          - entities.TreatmentPlan.fields.escalated_station_count
          - entities.TreatmentPlan.fields.retreat_required
          - entities.Bond.fields.coverage_watch
          - endpoints[POST /bait-stations/{id}/services]
        distinguishing_aspect: |
          Depth 3, triggered by POST /bait-stations/{id}/services. Hop 1 escalates the station, hop 2
          is caused by hop 1 (plan escalated_station_count reaches the ceil(18 * 0.05) == 1 threshold
          and retreat_required flips), hop 3 is caused by hop 2 alone (the covering ACTIVE bond sets
          coverage_watch). The first two services prove hops 2 and 3 do NOT fire early: the station
          reaches ACTIVE_HIT twice with the plan and bond untouched.
        test_recipe:
          setup:
            - "P2 in GA: CRAWLSPACE, 1800 sq ft, 175 linear ft, no attached structures."
            - "One GA inspector holding both WDO_INSPECTOR and TERMITE_APPLICATOR, who is also the plan's applicator (so the ownership rule is satisfied on every call)."
            - "A COMPLETED BAIT_STATION plan quoted at 1293.75 with target_station_count 18, completed at exactly 2026-08-10T00:00:00Z so every station's last_serviced_at starts there."
            - "A REPAIR_AND_RETREAT bond issued 2026-08-11 over that plan, still ACTIVE when the escalation lands."
            - "Station #1 is serviced three times on its exact due dates with MODERATE activity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "77 Sweetgum Lane", state_code: "GA", construction_type: "CRAWLSPACE", square_footage: 1800, linear_footage: 175, year_built: 1988, crawl_clearance_inches: 18, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p2: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Marsh", license_number: "GA-20001", license_state: "GA", license_categories: ["WDO_INSPECTOR", "TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insg: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p2}", inspector_id: "${insg}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insg}"
              captures: { ins2: $.data.id }
            - call: "POST /inspections/${ins2}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insg}"
            - call: "POST /treatment-plans"
              payload: { property_id: "${p2}", inspection_id: "${ins2}", applicator_id: "${insg}", method: "BAIT_STATION", chemical_product_code: "HEXA_BAIT_2" }
              as: BranchManager
              captures: { plan2: $.data.id }
            - call: "POST /treatment-plans/${plan2}/approve"
              payload: {}
              as: BranchManager
            - call: "GET /treatment-plans/${plan2}"
              payload: {}
              as: BranchManager
              captures: { pv2: $.data.version }
            - call: "POST /treatment-plans/${plan2}/applications"
              payload: { product_epa_number: "9384-12", gallons_applied: 0.50, concentration_pct: 0.05, expected_treatment_plan_version: "${pv2}" }
              as: Applicator
              as_user_id: "${insg}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plans/${plan2}/complete"
              payload: {}
              as: Applicator
              as_user_id: "${insg}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds"
              payload: { property_id: "${p2}", treatment_plan_id: "${plan2}", coverage_tier: "REPAIR_AND_RETREAT", conducive_waiver_codes: [] }
              as: BranchManager
              captures: { bond2: $.data.id }
            - call: "GET /treatment-plans/${plan2}/bait-stations"
              payload: {}
              as: BranchManager
              captures: { st1: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-08T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${st1}/services"
              payload: { activity_level: "MODERATE", matrix_replaced: true }
              as: FieldInspector
              as_user_id: "${insg}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-08T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${st1}/services"
              payload: { activity_level: "MODERATE", matrix_replaced: false }
              as: FieldInspector
              as_user_id: "${insg}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-07T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /bait-stations/${st1}/services"
              payload: { activity_level: "HEAVY", matrix_replaced: true }
              as: FieldInspector
              as_user_id: "${insg}"
          assert:
            - "before the trigger, after two MODERATE services: BaitStation.${st1}.status == ACTIVE_HIT, consecutive_activity_count == 2, service_count == 2, matrix_replacement_count == 1"
            - "before the trigger the cascade had NOT started: TreatmentPlan.${plan2}.escalated_station_count == 0 and retreat_required == false; Bond.${bond2}.coverage_watch == false and retreat_required == false"
            - "hop 1: the third MODERATE/HEAVY service takes consecutive_activity_count to 3 == ESCALATION_RUN_LENGTH, so BaitStation.${st1}.status == ESCALATED and next_due_at == 2027-01-21T00:00:00Z (serviced_at + 14 days)"
            - "hop 1 grading: the StationService row has days_since_last_service == 30 and interval_compliance == ON_TIME (ACTIVE_HIT limit is exactly 30)"
            - "hop 2, caused by hop 1: TreatmentPlan.${plan2}.escalated_station_count == 1 and retreat_required == true, because 1 >= ceil(18 * 0.05) == 1"
            - "hop 3, caused by hop 2 only: Bond.${bond2}.coverage_watch == true and Bond.${bond2}.retreat_required == true"
            - "ordering sensitivity: hop 3 reads the plan's post-hop-2 retreat_required, so an implementation that evaluated the bond before the plan leaves coverage_watch false"
            - "the other 17 stations are untouched: each still has status INSTALLED, service_count 0 and next_due_at 2026-11-08T00:00:00Z"
            - "version accounting across the chain: BaitStation.${st1}.version, TreatmentPlan.${plan2}.version and Bond.${bond2}.version each advanced by exactly 1 on this single request"
            - "frozen sizing confirms the threshold denominator: TreatmentPlan.${plan2}.target_station_count == 18 and quoted_price_usd == 1293.75"

