        grounds:
          - state_machines.RecallCampaign.DRAFT_to_OPEN
          - state_machines.ComponentLot.AVAILABLE_to_QUARANTINED
          - state_machines.ComponentInstallation.INSTALLED_to_RECALL_AFFECTED
          - entities.UnitBuild.fields.recall_hold
          - entities.UnitOrder.fields.ship_hold_reason
          - calculations.supplier_quality_score
          - errors.ERR_RECALL_SHIP_STOP
        distinguishing_aspect: |
          Depth 4, triggered by POST /recall-campaigns/{id}/open: the campaign
          quarantines the lot (hop 1), which flips that lot's installation to
          RECALL_AFFECTED and raises UnitBuild.recall_hold (hop 2), which stamps
          RECALL_HOLD on the owning UnitOrder (hop 3), which is what rescored the
          supplier to 85.00 (hop 4). Each hop is only reachable because the prior
          hop happened; a lot with no installation stops the chain at hop 1.
