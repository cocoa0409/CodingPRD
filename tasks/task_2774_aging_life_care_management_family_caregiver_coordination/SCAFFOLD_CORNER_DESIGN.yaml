  - section: cross_cutting
    instances:
      - name: version_increments_on_every_write_and_a_replayed_client_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.care-plan-create-stale-client
          - concurrency_rules.authorization-create-stale-care-plan
          - errors[ERR_STALE_CLIENT_VERSION]
          - entities.Client.version
        distinguishing_aspect: "Every accepted write bumps its entity's version by exactly one — including the system cascades nobody addressed directly — so a version observed before the assessment cascade is already stale for plan creation while the freshly re-read one succeeds."
        test_recipe:
          setup:
            - "CareManager Dana, supervisor Iris, Client Isolde (retainer_floor_cents 0, authorized_concurrent_caregivers 2), surrogate Jorunn, vendor Northgate."
          setup_api_calls:
