            - "CRISIS_RESPONSE against Zed's episode while client_id is Yara: HTTP 422 with data.error_id == \"ERR_CRISIS_CONTEXT_REQUIRED\", not ERR_ENTITY_RELATIONSHIP_INVALID (priority 58 runs before 62)"
