            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /charter-agreements/${ag1_id}/cancel", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-30", end_date: "2026-11-19", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq2_id: $.data.id } }
            - { call: "POST /charter-requests/${rq2_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq2_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq2_v: $.data.version } }
            - { call: "POST /charter-requests/${rq2_id}/accept", payload: { expected_charter_request_version: "${rq2_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /charter-agreements/${ag2_id}/cancel", payload: {}, as: Client, as_user_id: "${cl_id}" }
          assert:
