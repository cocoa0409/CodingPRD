- rule_id: non_linear_state_machine
  instances:
  - name: visit_parallel_service_payment_dimensions
    grounds:
    - state_machines.ServiceVisit.IN_SERVICE_to_COMPLETED
    - state_machines.ServiceVisit.UNPAID_to_SETTLED
    - entities.ServiceVisit.fields.service_status
    - entities.ServiceVisit.fields.payment_status
    distinguishing_aspect: 'ServiceVisit carries two independent dimensions: service_status reaches COMPLETED while

      payment_status remains UNPAID until a separate settle call flips it to SETTLED — parallel

      axes on one entity.

      '
    test_recipe:
      setup:
      - OPEN salon, member seated into IN_SERVICE/UNPAID visit (no package), completed -> COMPLETED/UNPAID.
      setup_api_calls:
