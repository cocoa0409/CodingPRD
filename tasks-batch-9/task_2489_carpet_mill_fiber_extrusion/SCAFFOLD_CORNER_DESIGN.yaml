scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES
  # ===========================================================================
  - section: entities
    instances:
      - name: create_polymer_lot_returns_201_with_all_declared_fields
        claim_type: creation
        grounds:
          - endpoints[POST /mill/polymer-lots]
          - entities.PolymerLot
          - response_envelope
        distinguishing_aspect: |
          A single POST with every declared input (including the three optional recycled-content
          inputs) returns 201 and echoes all of them, and the four mass buckets are already
          initialised so that received_kg == available_kg + reserved_kg + consumed_kg + scrapped_kg
          holds on the creation response itself, before any FiberBatch exists.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0, recycled_content_pct: 25.00, segregated: true, reclaim_source: "POST_INDUSTRIAL" }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
          assert:
            - "HTTP 201"
            - "response body has keys data and meta only"
            - "PolymerLot.${pl}.lot_code == \"PL-N66-01\""
            - "PolymerLot.${pl}.polymer_type == NYLON_66"
            - "PolymerLot.${pl}.received_kg == 5000.000"
            - "PolymerLot.${pl}.melt_flow_index == 18.0"
            - "PolymerLot.${pl}.recycled_content_pct == 25.00"
            - "PolymerLot.${pl}.segregated == true"
            - "PolymerLot.${pl}.reclaim_source == POST_INDUSTRIAL"
            - "PolymerLot.${pl}.available_kg == 5000.000"
            - "PolymerLot.${pl}.reserved_kg == 0.000 and PolymerLot.${pl}.consumed_kg == 0.000 and PolymerLot.${pl}.scrapped_kg == 0.000"
            - "PolymerLot.${pl}.status == AVAILABLE"
            - "PolymerLot.${pl}.id, created_at, updated_at are present and PolymerLot.${pl}.version == 1"

      - name: get_polymer_lot_by_id_returns_the_stored_lot
        claim_type: retrieval
        grounds:
          - endpoints[GET /mill/polymer-lots/{polymer_lot_id}]
          - entities.PolymerLot
        distinguishing_aspect: |
          The read-back of a lot created with only the four required inputs returns the stored row
          with the three omitted optional inputs materialised at their declared defaults — proving
          the GET serves persisted state, not the request body.
        test_recipe:
          setup:
            - "PolymerLot PL-N66-01 exists with received_kg 5000.000 and melt_flow_index 18.0."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
          trigger:
            - call: "GET /mill/polymer-lots/${pl}"
              payload: {}
              as: MillPlanner
          assert:
            - "HTTP 200"
            - "PolymerLot.${pl}.lot_code == \"PL-N66-01\" and PolymerLot.${pl}.received_kg == 5000.000"
            - "PolymerLot.${pl}.recycled_content_pct == 0 and PolymerLot.${pl}.segregated == false and PolymerLot.${pl}.reclaim_source == VIRGIN"
            - "PolymerLot.${pl}.available_kg == 5000.000 and PolymerLot.${pl}.status == AVAILABLE"
            - "PolymerLot.${pl}.version == 1"

      - name: list_polymer_lots_filters_by_reclaim_source_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /mill/polymer-lots]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three lots exist, two of them VIRGIN; a filtered page of limit 1 returns exactly one row,
          total_count 2 (the filtered cardinality, not the table cardinality 3) and has_more true —
          filter and pagination compose rather than one overriding the other.
        test_recipe:
          setup:
            - "Three PolymerLots: PL-V-01 and PL-V-02 with reclaim_source VIRGIN, PL-PI-01 with reclaim_source POST_INDUSTRIAL."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-V-01", polymer_type: "NYLON_66", received_kg: 1000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl1: $.data.id }
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-V-02", polymer_type: "NYLON_6", received_kg: 2000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl2: $.data.id }
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-PI-01", polymer_type: "PET", received_kg: 3000.000, melt_flow_index: 20.0, reclaim_source: "POST_INDUSTRIAL" }
              as: ExtrusionOperator
              captures: { pl3: $.data.id }
          trigger:
            - call: "GET /mill/polymer-lots"
              payload: { reclaim_source: "VIRGIN", limit: 1, offset: 0 }
              as: MillPlanner
          assert:
            - "HTTP 200"
            - "meta.total_count == 2"
            - "meta.limit == 1 and meta.offset == 0 and meta.has_more == true"
            - "len(data) == 1"
            - "data[0].id == ${pl1} and data[0].reclaim_source == VIRGIN"
            - "${pl3} does not appear in data"

      - name: get_style_with_unknown_id_returns_style_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /mill/styles/{style_id}]
          - errors[ERR_STYLE_NOT_FOUND]
          - validations[priority 5]
        distinguishing_aspect: |
          A syntactically valid but unpersisted style id resolves to the entity-specific
          ERR_STYLE_NOT_FOUND at 404 rather than a generic ERR_INVALID_REQUEST, and the error
          envelope carries error_id and message.
        test_recipe:
          setup:
            - "One unrelated CarpetStyle exists so the table is non-empty."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
          trigger:
            - call: "GET /mill/styles/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: MillPlanner
          assert:
            - "HTTP 404"
            - "error.error_id == ERR_STYLE_NOT_FOUND"
            - "error.message is a non-empty string"
            - "the existing CarpetStyle ${st} is untouched: status == DRAFT"

      - name: create_style_missing_pattern_repeat_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /mill/styles]
          - entities.CarpetStyle.fields.pattern_repeat_mm
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 4]
        distinguishing_aspect: |
          pattern_repeat_mm has source input with no default, so omitting it is a shape violation
          caught at priority 4 — 422 ERR_INVALID_REQUEST and no CarpetStyle row is created, proving
          the field is not silently defaulted to zero.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
            - call: "GET /mill/styles"
              payload: { limit: 10, offset: 0 }
              as: MillPlanner
          assert:
            - "the POST returns HTTP 422 with error.error_id == ERR_INVALID_REQUEST"
            - "the GET returns HTTP 200 with meta.total_count == 0 and len(data) == 0"

      - name: polymer_lot_recycled_fields_default_to_zero_false_and_virgin
        claim_type: defaults
        grounds:
          - entities.PolymerLot.fields.recycled_content_pct
          - entities.PolymerLot.fields.segregated
          - entities.PolymerLot.fields.reclaim_source
          - endpoints[POST /mill/polymer-lots]
        distinguishing_aspect: |
          Omitting all three optional recycled-content inputs yields recycled_content_pct 0,
          segregated false and reclaim_source VIRGIN on the creation response — the defaults are
          applied by the server, and a lot so created contributes 0.00 to a style's mass-balance
          recycled content.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 4000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
          assert:
            - "HTTP 201"
            - "PolymerLot.${pl}.recycled_content_pct == 0"
            - "PolymerLot.${pl}.segregated == false"
            - "PolymerLot.${pl}.reclaim_source == VIRGIN"
            - "PolymerLot.${pl}.status == AVAILABLE and PolymerLot.${pl}.available_kg == 4000.000"

      - name: tufting_machine_and_dye_vessel_status_default_to_idle_and_available
        claim_type: defaults
        grounds:
          - entities.TuftingMachine.fields.status
          - entities.DyeVessel.fields.status
          - endpoints[POST /mill/tufting-machines]
          - endpoints[POST /mill/dye-vessels]
        distinguishing_aspect: |
          Both resources expose status as an INPUT field with a default; omitting it yields IDLE for
          the tufter and AVAILABLE for the vessel, while supplying MAINTENANCE explicitly is honoured
          — so the default is a default, not a hard-coded constant.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 60, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm1: $.data.id }
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-02", native_gauge_code: "G_1_8", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0, status: "MAINTENANCE" }
              as: MillPlanner
              captures: { tm2: $.data.id }
            - call: "POST /mill/dye-vessels"
              payload: { vessel_code: "DV-01", vessel_type: "BECK", capacity_kg: 2000.0 }
              as: DyeHouseOperator
              captures: { dv1: $.data.id }
            - call: "POST /mill/dye-vessels"
              payload: { vessel_code: "DV-02", vessel_type: "JET", capacity_kg: 900.0, status: "MAINTENANCE" }
              as: DyeHouseOperator
              captures: { dv2: $.data.id }
          assert:
            - "all four calls return HTTP 201"
            - "TuftingMachine.${tm1}.status == IDLE"
            - "TuftingMachine.${tm2}.status == MAINTENANCE"
            - "DyeVessel.${dv1}.status == AVAILABLE"
            - "DyeVessel.${dv2}.status == MAINTENANCE"

      - name: polymer_lot_mass_buckets_are_computed_at_creation_and_after_a_draw
        claim_type: computed_fields
        grounds:
          - entities.PolymerLot.fields.available_kg
          - entities.PolymerLot.fields.reserved_kg
          - calculations.polymer_mass_conservation
          - endpoints[POST /mill/fiber-batches]
        distinguishing_aspect: |
          available_kg and reserved_kg are computed, never supplied: a 5000.000 kg lot reads
          5000.000/0.000 at creation and 1000.000/4000.000 after a 4000.000 kg FiberBatch draw, with
          the conservation identity holding at both instants.
        test_recipe:
          setup:
            - "PolymerLot PL-N66-01 with received_kg 5000.000 and melt_flow_index 18.0."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "GET /mill/polymer-lots/${pl}"
              payload: {}
              as: ExtrusionOperator
          trigger:
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "GET /mill/polymer-lots/${pl}"
              payload: {}
              as: ExtrusionOperator
          assert:
            - "on the setup GET, PolymerLot.${pl}.available_kg == 5000.000 and reserved_kg == 0.000 and consumed_kg == 0.000 and scrapped_kg == 0.000"
            - "on the trigger GET, PolymerLot.${pl}.available_kg == 1000.000 and reserved_kg == 4000.000"
            - "on the trigger GET, PolymerLot.${pl}.consumed_kg == 0.000 and scrapped_kg == 0.000"
            - "on the trigger GET, available_kg + reserved_kg + consumed_kg + scrapped_kg == 5000.000"
            - "PolymerLot.${pl}.status == AVAILABLE"
            - "FiberBatch.${fb}.status == QUEUED and FiberBatch.${fb}.denier_actual is null"

      - name: account_system_fields_are_generated_by_the_server
        claim_type: system_fields
        grounds:
          - entities.Account
          - endpoints[POST /mill/accounts]
        distinguishing_aspect: |
          The creation response carries a server-minted id, created_at, updated_at and version == 1,
          and the two non-input fields credit_used_cents and status come back at 0 and ACTIVE — the
          client supplies only account_code, account_type and credit_limit_cents.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 5000000 }
              as: MillPlanner
              captures: { acct: $.data.id }
          assert:
            - "HTTP 201"
            - "Account.${acct}.id is a non-empty string and differs from \"AC-01\""
            - "Account.${acct}.created_at and Account.${acct}.updated_at are ISO 8601 UTC datetimes"
            - "Account.${acct}.version == 1"
            - "Account.${acct}.credit_used_cents == 0"
            - "Account.${acct}.status == ACTIVE"
            - "Account.${acct}.credit_limit_cents == 5000000"

      - name: create_dye_vessel_with_unknown_vessel_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.DyeVessel.fields.vessel_type
          - endpoints[POST /mill/dye-vessels]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 4]
        distinguishing_aspect: |
          vessel_type is closed to {BECK, JET}; the out-of-set value KETTLE is rejected at priority 4
          with 422 ERR_INVALID_REQUEST and no DyeVessel row is persisted.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mill/dye-vessels"
              payload: { vessel_code: "DV-01", vessel_type: "KETTLE", capacity_kg: 2000.0 }
              as: DyeHouseOperator
            - call: "GET /mill/dye-vessels"
              payload: { limit: 10, offset: 0 }
              as: DyeHouseOperator
          assert:
            - "the POST returns HTTP 422 with error.error_id == ERR_INVALID_REQUEST"
            - "the GET returns meta.total_count == 0"

      - name: production_run_scheduled_end_before_start_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.ProductionRun.fields.scheduled_end_utc
          - endpoints[POST /mill/production-runs]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 4]
        distinguishing_aspect: |
          scheduled_end_utc must be strictly greater than scheduled_start_utc; an inverted window is
          rejected at priority 4 — before the machine-window overlap check at priority 22 — so the
          FiberBatch stays RELEASED instead of being reserved as ALLOCATED.
        test_recipe:
          setup:
            - "An ACTIVE solution-dyed style, an IDLE tufter and a RELEASED fiber batch."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
          trigger:
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T16:00:00Z", scheduled_end_utc: "2026-08-05T08:00:00Z" }
              as: MillPlanner
            - call: "GET /mill/fiber-batches/${fb}"
              payload: {}
              as: MillPlanner
          assert:
            - "the POST returns HTTP 422 with error.error_id == ERR_INVALID_REQUEST"
            - "FiberBatch.${fb}.status == RELEASED"
            - "CarpetStyle.${st}.status == ACTIVE"

      - name: product_test_response_omits_version_and_exposes_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.ProductTest
          - endpoints[POST /mill/product-tests]
          - endpoints[GET /mill/product-tests/{product_test_id}]
        distinguishing_aspect: |
          ProductTest declares common_fields false, so its create and read responses carry id,
          style_id, roll_good_id, test_type, result_value, verdict, tested_by_user_id and
          tested_at_utc but no version field, and §1.5 declares no PATCH for it — a recorded lab
          result is an immutable record of evidence.
        test_recipe:
          setup:
            - "A backed solution-dyed run PR-01 with RollGood RG-01 at qa_status PENDING."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/apply-backing"
              payload: { sbr_pct: 80.0, filler_load_pct: 20.0, cure_temp_c: 150, cure_seconds: 120, secondary_backing_type: "ACTION_BAC" }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/roll-goods"
              payload: { roll_number: "RG-01", width_ft: 12.0, initial_yards: 200.0 }
              as: MillPlanner
              captures: { rg: $.data.id }
          trigger:
            - call: "POST /mill/product-tests"
              payload: { style_id: "${st}", roll_good_id: "${rg}", test_type: "WEAR_TARR", result_value: 4.0 }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
              captures: { pt: $.data.id }
            - call: "GET /mill/product-tests/${pt}"
              payload: {}
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
          assert:
            - "the POST returns HTTP 201 and the GET returns HTTP 200"
            - "ProductTest.${pt} response has no version key"
            - "ProductTest.${pt} response has no updated_at key"
            - "ProductTest.${pt}.verdict == PASS and ProductTest.${pt}.result_value == 4.0"
            - "ProductTest.${pt}.tested_by_user_id == \"qa-tech-1\""
            - "ProductTest.${pt}.tested_at_utc == \"2026-08-05T08:00:00Z\""
            - "§1.5 declares no PATCH or DELETE endpoint whose path matches /mill/product-tests/{product_test_id}"

      - name: doff_roll_good_under_unknown_production_run_returns_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /mill/production-runs/{production_run_id}/roll-goods]
          - errors[ERR_PRODUCTION_RUN_NOT_FOUND]
          - validations[priority 5]
        distinguishing_aspect: |
          RollGood is only reachable through a run path segment; an unknown parent id fails at
          priority 5 with ERR_PRODUCTION_RUN_NOT_FOUND (404) before the priority-8 run-not-backed
          check and before roll_number uniqueness, and no RollGood is created.
        test_recipe:
          setup:
            - "Empty database except one TuftingMachine, so no ProductionRun exists at all."
          setup_api_calls:
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
          trigger:
            - call: "POST /mill/production-runs/00000000-0000-4000-8000-000000000404/roll-goods"
              payload: { roll_number: "RG-01", width_ft: 12.0, initial_yards: 200.0 }
              as: MillPlanner
            - call: "GET /mill/roll-goods"
              payload: { limit: 10, offset: 0 }
              as: MillPlanner
          assert:
            - "the POST returns HTTP 404 with error.error_id == ERR_PRODUCTION_RUN_NOT_FOUND"
            - "the GET returns meta.total_count == 0"

      - name: fiber_batch_blend_links_two_polymer_lots_and_both_reverse_lists_resolve
        claim_type: graph
        grounds:
          - entities.FiberBatch.fields.polymer_lot_id
          - entities.FiberBatch.fields.blend_polymer_lot_id
          - endpoints[GET /mill/fiber-batches]
          - calculations.polymer_mass_conservation
        distinguishing_aspect: |
          One FiberBatch is an edge onto two PolymerLots at once; the same batch is reachable from
          the primary lot via ?polymer_lot_id and from the blend lot via ?blend_polymer_lot_id, and
          each lot's reserved_kg reflects only its own leg of the draw (3000.000 vs 1000.000).
        test_recipe:
          setup:
            - "Two NYLON_66 PolymerLots of 5000.000 kg each (blends must share the primary lot's polymer_type)."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl1: $.data.id }
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-02", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 16.0, recycled_content_pct: 100.00, segregated: true, reclaim_source: "POST_CONSUMER" }
              as: ExtrusionOperator
              captures: { pl2: $.data.id }
          trigger:
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl1}", input_kg: 3000.000, blend_polymer_lot_id: "${pl2}", blend_input_kg: 1000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "GET /mill/fiber-batches"
              payload: { polymer_lot_id: "${pl1}", limit: 10, offset: 0 }
              as: ExtrusionOperator
            - call: "GET /mill/fiber-batches"
              payload: { blend_polymer_lot_id: "${pl2}", limit: 10, offset: 0 }
              as: ExtrusionOperator
            - call: "GET /mill/polymer-lots/${pl2}"
              payload: {}
              as: ExtrusionOperator
          assert:
            - "the POST returns HTTP 201 with FiberBatch.${fb}.polymer_lot_id == ${pl1} and FiberBatch.${fb}.blend_polymer_lot_id == ${pl2}"
            - "the ?polymer_lot_id list returns meta.total_count == 1 and data[0].id == ${fb}"
            - "the ?blend_polymer_lot_id list returns meta.total_count == 1 and data[0].id == ${fb}"
            - "PolymerLot.${pl1}.reserved_kg == 3000.000 and PolymerLot.${pl1}.available_kg == 2000.000"
            - "PolymerLot.${pl2}.reserved_kg == 1000.000 and PolymerLot.${pl2}.available_kg == 4000.000"
            - "FiberBatch.${fb}.status == QUEUED"

  # ===========================================================================
  # SECTION 2 — STATE MACHINES
  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_draft_style_moves_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.CarpetStyle.DRAFT_to_ACTIVE
          - endpoints[POST /mill/styles/{style_id}/activate]
        distinguishing_aspect: |
          A freshly created style is DRAFT and unorderable; the single activate call is the only
          door to ACTIVE and it leaves the style's computed posture fields untouched
          (open_backorder_yards 0, replenishment_flag NONE).
        test_recipe:
          setup:
            - "CarpetStyle ST-SD-01 in status DRAFT."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id, st_v: $.data.version }
          trigger:
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
          assert:
            - "HTTP 200"
            - "CarpetStyle.${st}.status == ACTIVE"
            - "CarpetStyle.${st}.open_backorder_yards == 0 and CarpetStyle.${st}.replenishment_flag == NONE"
            - "CarpetStyle.${st}.version == 2"

      - name: new_production_run_starts_scheduled_with_zero_recoat_count
        claim_type: initial_state
        grounds:
          - state_machines.ProductionRun.initial_state
          - entities.ProductionRun.fields.recoat_count
          - endpoints[POST /mill/production-runs]
        distinguishing_aspect: |
          The creation response — not a later read — already shows status SCHEDULED, recoat_count 0
          and null setup/backing fields, while the creel reservation has already moved the
          FiberBatch from RELEASED to ALLOCATED.
        test_recipe:
          setup:
            - "ACTIVE solution-dyed style ST-SD-01, IDLE tufter TM-01, RELEASED fiber batch FB-01."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
          trigger:
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "GET /mill/fiber-batches/${fb}"
              payload: {}
              as: MillPlanner
          assert:
            - "HTTP 201"
            - "ProductionRun.${pr}.status == SCHEDULED"
            - "ProductionRun.${pr}.recoat_count == 0"
            - "ProductionRun.${pr}.gauge_loaded_code is null and ProductionRun.${pr}.greige_yards is null"
            - "ProductionRun.${pr}.face_weight_oz_per_sy is null and ProductionRun.${pr}.delamination_strength_lbf is null"
            - "ProductionRun.${pr}.version == 1"
            - "FiberBatch.${fb}.status == ALLOCATED"

      - name: activate_style_twice_second_call_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.CarpetStyle.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
          - validations[priority 8]
        distinguishing_aspect: |
          activate is not idempotent: the second call from ACTIVE has no declared transition and
          returns 409 ERR_INVALID_STATE, and the style's version does not advance — a rejected
          transition performs no write at all.
        test_recipe:
          setup:
            - "CarpetStyle ST-SD-01 already ACTIVE with version 2."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
          trigger:
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "GET /mill/styles/${st}"
              payload: {}
              as: MillPlanner
          assert:
            - "the second activate returns HTTP 409 with error.error_id == ERR_INVALID_STATE"
            - "CarpetStyle.${st}.status == ACTIVE"
            - "CarpetStyle.${st}.version == 2"

      - name: complete_greige_from_scheduled_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.ProductionRun.TUFTING_to_GREIGE
          - endpoints[POST /mill/production-runs/{production_run_id}/complete-greige]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          complete-greige is declared only from TUFTING; firing it on a SCHEDULED run (setup never
          loaded) is rejected with 409 ERR_INVALID_STATE even though the clock is inside the booked
          window — and face_weight_oz_per_sy is never computed.
        test_recipe:
          setup:
            - "ProductionRun PR-01 in status SCHEDULED, logical clock at 2026-08-05T08:00:00Z (inside its window)."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
