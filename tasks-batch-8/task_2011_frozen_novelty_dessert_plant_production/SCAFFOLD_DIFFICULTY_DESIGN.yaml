            - { call: "POST /shipments/${s1}/allocations", payload: { lot_id: "${lot1}", units: 3000 }, as: WarehouseLead, captures: { al1: $.data.id } }
            - { call: "POST /shipments/${s1}/load", payload: {}, as: WarehouseLead }
            - { call: "POST /quality-complaints", payload: { complaint_code: "QC-K", lot_id: "${lot1}", complaint_type: TEXTURE }, as: QAManager, as_user_id: "qa_1", captures: { qc: $.data.id } }
          trigger:
            - { call: "POST /quality-complaints/${qc}/disposition", payload: { outcome: SUBSTANTIATED }, as: QAManager, as_user_id: "qa_2", captures: { qc_status: $.data.status } }
            - { call: "GET /inventory-lots/${lot1}", payload: {}, as: QAManager, captures: { lot_status: $.data.status, lot_avail: $.data.units_available, lot_res: $.data.units_reserved } }
            - { call: "GET /shipment-allocations/${al1}", payload: {}, as: QAManager, captures: { al_status: $.data.status, al_reason: $.data.release_reason } }
            - { call: "GET /shipments/${s1}", payload: {}, as: QAManager, captures: { sh_status: $.data.status, sh_units: $.data.allocated_units } }
          assert:
            - "QualityComplaint.${qc}.status == DISPOSITIONED_SUBSTANTIATED"
            - "link 1: lot status == QUARANTINED"
            - "link 2: allocation status == RELEASED with release_reason == COMPLAINT_CASCADE; lot units_reserved == 0 and units_available == 10000"
            - "link 3: shipment.allocated_units == 0 and shipment.status == PLANNED (LOADED regressed because its allocation was released by link 2)"

      - name: delivery_fulfills_contract_cascade
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_DELIVERED
          - state_machines.CoPackContract.ACTIVE_to_FULFILLED
          - calculations.contract_fulfillment
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (shipment deliver, not complaint
          disposition): deliver mutates contract.delivered_units (link 1); that field
          mutation itself fires the auto-transition contract ACTIVE -> FULFILLED at
