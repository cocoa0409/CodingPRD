              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-NPI", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, npi_ramp_pct: 100, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "PRELAUNCH" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-RAMP", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v1: $.data.version }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-10", end_month: "2026-10", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_id: $.data.id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "NEW_ITEM_PLAN", delta_units: 100, rationale: "launch pipeline fill", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id }
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_v_before: $.data.version }
          trigger:
            - call: "POST /sop/items/${item_id}/lifecycle-transitions"
              payload: { target_state: "RAMP" }
              as: SopAdmin
          assert:
            - "Status is 200 and Item.${item_id}.lifecycle_state == \"RAMP\""
            - "DemandForecast.${fc_id}.status is still \"UNDER_CONSENSUS\", consensus_units == 1000, endorsed_adjustment_count == 0"
            - "DemandForecast.${fc_id}.version == ${fc_v_before} — the RAMP branch does not touch the forecast at all"
            - "ConsensusAdjustment.${adj_id}.status is still \"PROPOSED\" and applied_delta_units is still 100"
            - "Promotion.${promo_id}.status is still \"DRAFT\" — nothing was cancelled"
            - "The item is now promotable: approving ${promo_id} as DemandReviewLead returns 200 whereas the same call before the trigger would have returned 422 ERR_ITEM_NOT_PROMOTABLE"

      - name: item_runout_to_discontinued_rejected_while_on_hand_units_remain
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Item.RUNOUT_to_DISCONTINUED
          - errors.ERR_RUNOUT_INVENTORY_REMAINS
          - validations[priority=160]
        distinguishing_aspect: |
          RUNOUT_TOLERANCE_UNITS is exactly 0, so the boundary is on_hand_units 0 passes /
          on_hand_units 1 fails — not "small residual is fine". Two sibling items in the same
          family, identical in every field except on_hand_units 5 versus 0, must diverge on
          the identical DISCONTINUED request.
        test_recipe:
          setup:
            - "One family with two MATURE items: SKU-RESIDUAL with on_hand_units 5 and SKU-CLEAN with on_hand_units 0. Both are moved to RUNOUT with runout_end_month 2026-09 and no successor. No forecasts exist."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-RESIDUAL", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 5, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { dirty_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-CLEAN", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { clean_id: $.data.id }
            - call: "POST /sop/items/${dirty_id}/lifecycle-transitions"
              payload: { target_state: "RUNOUT", runout_end_month: "2026-09" }
              as: SopAdmin
            - call: "POST /sop/items/${clean_id}/lifecycle-transitions"
              payload: { target_state: "RUNOUT", runout_end_month: "2026-09" }
              as: SopAdmin
          trigger:
            - call: "POST /sop/items/${dirty_id}/lifecycle-transitions"
              payload: { target_state: "DISCONTINUED" }
              as: SopAdmin
              captures: { err: $.data.error_id }
            - call: "POST /sop/items/${clean_id}/lifecycle-transitions"
              payload: { target_state: "DISCONTINUED" }
              as: SopAdmin
          assert:
            - "The SKU-RESIDUAL call returns 422 with ${err} == \"ERR_RUNOUT_INVENTORY_REMAINS\" and Item.${dirty_id}.lifecycle_state is still \"RUNOUT\""
            - "The SKU-CLEAN call returns 200 and Item.${clean_id}.lifecycle_state == \"DISCONTINUED\" — on_hand_units == 0 is exactly at RUNOUT_TOLERANCE_UNITS and passes"
            - "Both items kept runout_end_month == \"2026-09\" and successor_item_id null"

      - name: cancelled_npi_item_rejects_further_lifecycle_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Item.terminal_states
          - errors.ERR_ITEM_LIFECYCLE_TRANSITION_INVALID
          - validations[priority=120]
        distinguishing_aspect: |
          CANCELLED_NPI is terminal, so even the RAMP edge that WAS available from PRELAUNCH
          one request earlier is gone. Reviving a cancelled NPI, or jumping it to MATURE or
          DISCONTINUED, must all fail with 409 ERR_ITEM_LIFECYCLE_TRANSITION_INVALID.
        test_recipe:
          setup:
            - "One family with one PRELAUNCH item that is immediately cancelled. No forecasts, promotions or plans exist."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-DEAD", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "PRELAUNCH" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/items/${item_id}/lifecycle-transitions"
              payload: { target_state: "CANCELLED_NPI" }
              as: SopAdmin
              captures: { item_v: $.data.version }
          trigger:
            - call: "POST /sop/items/${item_id}/lifecycle-transitions"
              payload: { target_state: "RAMP" }
              as: SopAdmin
              captures: { err_ramp: $.data.error_id }
            - call: "POST /sop/items/${item_id}/lifecycle-transitions"
              payload: { target_state: "MATURE" }
              as: SopAdmin
              captures: { err_mature: $.data.error_id }
            - call: "POST /sop/items/${item_id}/lifecycle-transitions"
              payload: { target_state: "DISCONTINUED" }
              as: SopAdmin
              captures: { err_disc: $.data.error_id }
          assert:
            - "All three calls return 409 and ${err_ramp} == ${err_mature} == ${err_disc} == \"ERR_ITEM_LIFECYCLE_TRANSITION_INVALID\""
            - "Item.${item_id}.lifecycle_state is still \"CANCELLED_NPI\" and version == ${item_v}"

      - name: adjustment_reject_is_terminal_and_second_review_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ConsensusAdjustment.PROPOSED_to_REJECTED
          - state_machines.ConsensusAdjustment.terminal_states
          - errors.ERR_ADJUSTMENT_NOT_REVIEWABLE
        distinguishing_aspect: |
          REJECTED is terminal, so a reviewer cannot change their mind: a follow-up ENDORSE
          must fail with 409 ERR_ADJUSTMENT_NOT_REVIEWABLE and — critically — must not move
          consensus_units, which stays at the baseline 1000 because a REJECTED adjustment was
          never in the contributing set to begin with.
        test_recipe:
          setup:
            - "The base fixture with a cycle over 2026-09..2026-09 (commitment 0), a forecast of baseline 1000, and one SALES_INTELLIGENCE adjustment of +100 that has just been REJECTED by lead-1."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-REJ", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v1: $.data.version }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "unverified rumour", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "REJECT", review_note: "no evidence" }
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { adj_v: $.data.version }
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_v_now: $.data.version }
          trigger:
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "ENDORSE" }
              as: DemandReviewLead
              as_user_id: "lead-2"
              captures: { err_endorse: $.data.error_id }
            - call: "POST /sop/consensus-adjustments/${adj_id}/resubmit"
              payload: { rationale: "found the evidence", delta_units: 100, expected_demand_forecast_version: "${fc_v_now}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_resubmit: $.data.error_id }
          assert:
            - "ConsensusAdjustment.${adj_id}.status == \"REJECTED\", reviewed_by_user_id == \"lead-1\", review_note == \"no evidence\""
            - "The ENDORSE returns 409 with ${err_endorse} == \"ERR_ADJUSTMENT_NOT_REVIEWABLE\" — a DIFFERENT reviewer does not unlock a terminal row"
            - "The resubmit returns 409 with ${err_resubmit} == \"ERR_ADJUSTMENT_NOT_RESUBMITTABLE\" — REJECTED is not REVISION_REQUESTED, and the CURRENT forecast version ${fc_v_now} was supplied so priority 90 passed cleanly and priority 120 is the reported failure"
            - "ConsensusAdjustment.${adj_id}.version == ${adj_v} and revision_round == 0"
            - "DemandForecast.${fc_id}.consensus_units == 1000 and endorsed_adjustment_count == 0"

      - name: cycle_publish_commits_supply_plans_and_freezes_posture
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PlanningCycle.EXECUTIVE_REVIEW_to_PUBLISHED
          - state_machines.SupplyPlan.PLANNED_to_COMMITTED
          - calculations.calc_cycle_posture
          - entities.PlanningCycle.fields.published_at
        distinguishing_aspect: |
          Publication is a bubble-up: the cycle's own transition drags a child SupplyPlan from
          PLANNED to COMMITTED, and because COMMITTED is still inside
          calc_cycle_financials' input set, plan_value_cents must stay at 1_330_000 across the
          publish rather than dropping to 0 the way a STALE plan would. posture flips to FROZEN
          by rule 1 even though the money is fully closed.
        test_recipe:
          setup:
            - "The base fixture with a 14-hour CapacityBlock inside the 2026-09 horizon (1400 units) and financial_commitment_cents 0."
            - "One CONSENSUS_LOCKED forecast of 1000 units and one PLANNED SupplyPlan with constrained_units 1330 and constraint_type NONE, with the cycle walked to EXECUTIVE_REVIEW."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 14 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-PUB", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
          assert:
            - "Before the trigger: SupplyPlan.${plan_id}.available_units == 1400, demand_side_units == 1330, constrained_units == 1330, shortfall_units == 0, constraint_type == \"NONE\", status == \"PLANNED\""
            - "Before the trigger: PlanningCycle.${cycle_id}.plan_value_cents == 1330000, gross_gap_cents == -1330000, residual_gap_cents == -1330000, constrained_plan_count == 0, posture == \"GREEN\""
            - "Status is 200 and PlanningCycle.${cycle_id}.status == \"PUBLISHED\""
            - "SupplyPlan.${plan_id}.status == \"COMMITTED\" and requires_replan == false"
            - "PlanningCycle.${cycle_id}.plan_value_cents is STILL 1330000 — COMMITTED remains in calc_cycle_financials' input set"
            - "posture == \"FROZEN\" (rule 1 wins over the GREEN money verdict) and published_at == \"2026-08-01T00:00:00Z\""
            - "constrained_plan_count == 0 — COMMITTED is outside that counter's {PLANNED, RATIONED} filter"

      - name: runout_truncated_forecast_rejects_relock_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DemandForecast.terminal_states
          - state_machines.DemandForecast.CONSENSUS_LOCKED_to_RUNOUT_TRUNCATED
          - errors.ERR_FORECAST_TRANSITION_INVALID
        distinguishing_aspect: |
          A forecast line truncated by a runout is permanently out of the consensus workflow.
          Neither re-locking it nor reopening it to UNDER_CONSENSUS is allowed, so its
          consensus_units 0 can never be resurrected by a workflow move — only a new forecast
          row could. The month comparison is a string compare on YYYY-MM: 2026-11 > 2026-09.
        test_recipe:
          setup:
            - "The base fixture with a cycle over 2026-09..2026-11 (commitment 0) and one CONSENSUS_LOCKED forecast of 1000 units for 2026-11, then the item moved MATURE -> RUNOUT with runout_end_month 2026-09."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-TRUNC", horizon_start_month: "2026-09", horizon_end_month: "2026-11", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-11", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/items/${item_id}/lifecycle-transitions"
              payload: { target_state: "RUNOUT", runout_end_month: "2026-09" }
              as: SopAdmin
          trigger:
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_open: $.data.error_id }
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { err_lock: $.data.error_id }
          assert:
            - "After the runout: DemandForecast.${fc_id}.status == \"RUNOUT_TRUNCATED\", consensus_units == 0, baseline_units == 1000"
            - "Item.${item_id}.lifecycle_state == \"RUNOUT\" and runout_end_month == \"2026-09\""
            - "Both transition attempts return 409 with ${err_open} == ${err_lock} == \"ERR_FORECAST_TRANSITION_INVALID\""
            - "DemandForecast.${fc_id}.consensus_units is still 0 — no workflow move can resurrect the truncated volume"

  - section: calculations
    instances:
      - name: baseline_holt_winters_applies_trend_and_seasonality_at_offset_two
        claim_type: Correct Result
        grounds:
          - calculations.calc_statistical_baseline
          - entities.DemandForecast.fields.baseline_units
          - endpoints[POST /sop/demand-forecasts]
        distinguishing_aspect: |
          The horizon offset is a 0-based month distance from cycle.horizon_start_month, so a
          2026-11 line in a cycle starting 2026-09 has offset 2, not 1 and not 3. Trend is
          applied INSIDE the seasonal product and the causal factor is applied after it, with
          exactly ONE round_half_up at the very end: (800 + 25*2) * 1.50 = 1275.0, then
          1275.0 * 1.20 = 1530. Offset 1 would give 1485 and offset 0 would give 1440.
        test_recipe:
          setup:
            - "The base family and customer, a MATURE item with demand_cv 0.20 (below INTERMITTENT_CV_THRESHOLD 0.75), and a cycle over 2026-09..2026-11."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-HW", horizon_start_month: "2026-09", horizon_end_month: "2026-11", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-11", level_units: 800, trend_units_per_month: 25, seasonal_index: 1.50, causal_uplift_pct: 20 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
          assert:
            - "Status is 201 and DemandForecast.${fc_id}.method == \"HOLT_WINTERS\""
            - "baseline_units == 1530 == round_half_up((800 + 25*2) * 1.50 * 1.20)"
            - "NOT 1485 (offset 1) and NOT 1440 (offset 0) and NOT 1275 (causal factor dropped)"
            - "consensus_units == 1530 and endorsed_adjustment_count == 0 — consensus starts equal to baseline"
            - "status == \"BASELINE\""

      - name: baseline_analog_profile_scales_by_npi_ramp_and_ignores_trend
        claim_type: Variant Selection
        grounds:
          - calculations.calc_statistical_baseline
          - entities.Item.fields.npi_ramp_pct
          - entities.DemandForecast.fields.method
        distinguishing_aspect: |
          Method selection is an ordered ladder, so PRELAUNCH wins over the intermittent-CV
          test even when demand_cv 0.90 is above the 0.75 threshold — CROSTON_FLAT must NOT be
          chosen. ANALOG_PROFILE keeps seasonality but suppresses trend only:
          1000 * 0.60 * 1.20 = 720.0, then * 1.10 = 792. Letting trend through would give 832
          and choosing CROSTON_FLAT would give 1100.
        test_recipe:
          setup:
            - "The base family and customer, a PRELAUNCH item with npi_ramp_pct 60 and demand_cv 0.90, and a cycle over 2026-09..2026-11."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-NPI", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, npi_ramp_pct: 60, service_level_target_pct: 95.0, demand_cv: 0.90, lead_time_days: 30, lifecycle_state: "PRELAUNCH" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-ANALOG", horizon_start_month: "2026-09", horizon_end_month: "2026-11", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-11", level_units: 1000, trend_units_per_month: 25, seasonal_index: 1.20, causal_uplift_pct: 10 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
          assert:
            - "Status is 201 and DemandForecast.${fc_id}.method == \"ANALOG_PROFILE\" — NOT \"CROSTON_FLAT\", even though demand_cv 0.90 >= INTERMITTENT_CV_THRESHOLD 0.75, because the PRELAUNCH branch is tested first"
            - "baseline_units == 792 == round_half_up(1000 * (60/100) * 1.20 * 1.10)"
            - "NOT 832 (trend leaked in at offset 2) and NOT 1100 (CROSTON_FLAT would ignore both npi_ramp_pct and seasonal_index)"
            - "consensus_units == 792"

      - name: inventory_policy_z_tier_at_97_5_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.calc_inventory_policy
          - entities.Item.fields.safety_stock_units
          - endpoints[POST /sop/items]
        distinguishing_aspect: |
          The z ladder is inclusive at its lower edge: service_level_target_pct exactly 97.5
          selects Z_97_5 = 1.96, while 97.4 falls through to Z_95_0 = 1.65. Two items identical
          in every other field must therefore land on 392 versus 330 safety stock — a 62-unit
          gap produced purely by the boundary comparison being >= rather than >.
        test_recipe:
          setup:
            - "One family and two items identical except service_level_target_pct: SKU-AT with 97.5 and SKU-UNDER with 97.4. Both have demand_cv 0.20, avg_monthly_demand_units 1000 and lead_time_days 30."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /sop/items"
              payload: { sku: "SKU-AT", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 97.5, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { at_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-UNDER", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 97.4, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { under_id: $.data.id }
          assert:
            - "Item.${at_id}.safety_stock_units == 392 == ceil(1.96 * 0.20 * 1000 * sqrt(30/30)) and reorder_point_units == 1392 == ceil(1000 * 30 / 30) + 392"
            - "Item.${under_id}.safety_stock_units == 330 == ceil(1.65 * 0.20 * 1000 * sqrt(30/30)) and reorder_point_units == 1330"
            - "97.5 is INSIDE the Z_97_5 band (the comparison is >=), so ${at_id} must NOT get 330"
            - "Both items report lifecycle_state \"MATURE\" and family_id ${fam_id}"

      - name: reorder_point_ceils_cycle_stock_before_adding_safety_stock
        claim_type: Precision
        grounds:
          - calculations.calc_inventory_policy
          - entities.Item.fields.reorder_point_units
          - endpoints[POST /sop/items/{item_id}/inventory-policy]
        distinguishing_aspect: |
          The two ceilings are pinned and non-commutative. With lead_time_days 31 the cycle
          stock is 1000*31/30 = 1033.3333 and the safety stock is 330*sqrt(31/30) = 335.4549.
          Ceiling each term and adding gives 1034 + 336 = 1370; ceiling the single sum
          1368.788 gives 1369. Exactly one of the two answers is correct, and the 1-unit gap
          is the whole point of the rule.
        test_recipe:
          setup:
            - "One family with a MATURE item created at lead_time_days 30 (safety_stock_units 330), then re-policied to lead_time_days 31 through the inventory-policy endpoint."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id, item_v1: $.data.version }
          trigger:
            - call: "POST /sop/items/${item_id}/inventory-policy"
              payload: { service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 31 }
              as: SupplyPlanner
              as_user_id: "supply-1"
          assert:
            - "Before the trigger: Item.${item_id}.safety_stock_units == 330 and reorder_point_units == 1330"
            - "Status is 200 and Item.${item_id}.safety_stock_units == 336 == ceil(330 * sqrt(31/30)) == ceil(335.4549)"
            - "reorder_point_units == 1370 == ceil(1000 * 31 / 30) + 336 == 1034 + 336"
            - "NOT 1369, which is what ceil(1033.3333 + 335.4549) == ceil(1368.788) would produce — the cycle-stock term must be ceilinged BEFORE the already-ceilinged safety stock is added"
            - "lead_time_days == 31 and Item.${item_id}.version == ${item_v1} + 1"

      - name: gross_requirement_excludes_other_cycles_and_other_items
        claim_type: Input Set Filtering
        grounds:
          - calculations.calc_constrained_supply
          - entities.SupplyPlan.fields.gross_requirement_units
          - endpoints[POST /sop/supply-plans]
        distinguishing_aspect: |
          gross_requirement_units is keyed on BOTH cycle_id and item_id. Three CONSENSUS_LOCKED
          forecast lines of 1000, 500 and 700 units exist; only the 1000 belongs to the planned
          (cycle, item) pair. A plan that leaks the sibling item reads 1500, one that leaks the
          sibling cycle reads 1700, and one that leaks both reads 2200.
        test_recipe:
          setup:
            - "One family with two MATURE items (SKU-ONE and SKU-TWO, both 95.0 / 0.20 / 30 so safety_stock_units is 330), one customer, and a 20-hour CapacityBlock inside 2026-09."
            - "Two cycles CY-A and CY-B, both over 2026-09..2026-09. Locked forecasts: (CY-A, SKU-ONE) 1000, (CY-A, SKU-TWO) 500, (CY-B, SKU-ONE) 700."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-ONE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item1_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-TWO", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item2_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 20 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-A", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_a: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-B", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_b: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_a}", item_id: "${item1_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_mine: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_a}", item_id: "${item2_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 500, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_other_item: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_b}", item_id: "${item1_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 700, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_other_cycle: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_other_cycle}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cycle_a}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
          trigger:
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_a}", item_id: "${item1_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
          assert:
            - "All three forecasts are CONSENSUS_LOCKED with consensus_units 1000, 500 and 700 respectively"
            - "Status is 201 and SupplyPlan.${plan_id}.gross_requirement_units == 1000"
            - "NOT 1500 (SKU-TWO leaked in), NOT 1700 (CY-B leaked in) and NOT 2200 (both leaked in)"
            - "target_build_units == 330, available_units == 2000 == floor(20 * 100), material_cap_units == 100000"
            - "demand_side_units == 1330 == max(0, 1000 + 330 - 0), constrained_units == 1330, shortfall_units == 0, constraint_type == \"NONE\""
            - "PlanningCycle.${cycle_a}.plan_value_cents == 1330000 and PlanningCycle.${cycle_b}.plan_value_cents == 0"

      - name: available_units_excludes_partially_overlapping_capacity_blocks
        claim_type: Input Set Filtering
        grounds:
          - calculations.calc_constrained_supply
          - entities.SupplyPlan.fields.available_units
          - entities.CapacityBlock.fields.end_date
        distinguishing_aspect: |
          Capacity eligibility is all-or-nothing containment in the half-open horizon window
          [2026-09-01, 2026-10-01), with NO proration. A 5-hour block ending 2026-09-10 counts
          in full; a 5-hour block running 2026-09-25 to 2026-10-05 is dropped entirely even
          though six of its ten days lie inside the window. available_units is therefore 500,
          not 1000 (both counted) and not 800 (the second block prorated at 6/10 days).
        test_recipe:
          setup:
            - "The base fixture with a cycle over 2026-09..2026-09 and TWO capacity blocks for the family: B1 [2026-09-01, 2026-09-10) with 5 hours and B2 [2026-09-25, 2026-10-05) with 5 hours."
            - "B1 and B2 are 15 days apart, comfortably beyond CHANGEOVER_BUFFER_DAYS = 2, and their 10 combined hours are far below max_monthly_hours 800."
            - "One CONSENSUS_LOCKED forecast of 1000 units; the item's safety_stock_units is 330 and on_hand_units is 0."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-10", available_hours: 5 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { b1_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-25", end_date: "2026-10-05", available_hours: 5 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { b2_id: $.data.id }
            - call: "POST /sop/planning-cycles"
