      - name: role_authorization_outranks_path_existence_on_reopen
        grounds: "§1.4 priority 3 auth ERR_UNAUTHORIZED (403) versus priority 11 existence ERR_BUSINESS_DATE_NOT_FOUND (404); §1.5 POST /night-audit/business-dates/{id}/reopen with roles [Controller]."
        distinguishing_aspect: >-
          The auth-versus-existence pair, the earliest band boundary in the ladder. It is the only
          instance here where the winning check reads nothing but the request headers, which is
          what prevents a caller from probing for the existence of resources they may not touch.
        test_recipe:
          setup: "Standard property and business date 2026-08-01 exist, but the path id in the trigger is a well-formed UUID that matches no BusinessDate, and the caller holds a role that reopen does not list."
          setup_api_calls:
