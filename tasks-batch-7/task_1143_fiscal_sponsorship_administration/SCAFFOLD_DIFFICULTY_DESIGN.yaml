            - { call: "POST /fsa/disbursement-requests/${dr_p3}/pay", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "GET /fsa/staff-engagements/${eng_p}", payload: {}, as: ComplianceOfficer, as_user_id: user_co_1, captures: { ytd3: $.data.contractor_ytd_cents, f3: $.data.requires_1099 } }
          assert:
            - "after paying 30,000: contractor_ytd_cents == 30000 and requires_1099 == false"
            - "after paying 29,999 more: contractor_ytd_cents == 59999 and requires_1099 == false"
            - "after paying 1 more: contractor_ytd_cents == 60000 and requires_1099 == true (>= 60000 inclusive boundary)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: disbursement_submit_requires_project_active
        grounds:
          - state_machines.DisbursementRequest.DRAFT_to_SUBMITTED
          - state_machines.Project.ACTIVE_to_SUSPENDED
          - errors[ERR_PROJECT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair DisbursementRequest -> Project: submit is gated on the
          project's status; SUSPENDED blocks, reinstate re-enables.
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE with funded available 92,000; DRAFT disbursement 10,000 exists"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Rho", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "r@x.org" }, as: Applicant, as_user_id: user_app_q, captures: { app_q: $.data.id } }
            - { call: "POST /fsa/applications/${app_q}/submit", payload: {}, as: Applicant, as_user_id: user_app_q }
            - { call: "POST /fsa/applications/${app_q}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_q}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_q: $.data.project_id, ag_q: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_q}/countersign", payload: {}, as: Applicant, as_user_id: user_app_q }
            - { call: "POST /fsa/projects/${p_q}/donations", payload: { amount_cents: 100000, donor_name: "D Fourteen", donor_email: "d14@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d_q1: $.data.id } }
            - { call: "POST /fsa/donations/${d_q1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p_q}/disbursement-requests", payload: { amount_cents: 10000, purpose: "printing", payee_type: "VENDOR", payee_name: "PrintCo", spend_date: "2026-06-05" }, as: ProjectLead, as_user_id: "${p_q}", captures: { dr_q: $.data.id } }
            - { call: "POST /fsa/projects/${p_q}/suspend", payload: { reason: "hold" }, as: SponsorAdmin, as_user_id: user_sa_1 }
          trigger:
            - { call: "POST /fsa/disbursement-requests/${dr_q}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_q}", captures: { e: $.data.error_id } }
            - { call: "POST /fsa/projects/${p_q}/reinstate", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1 }
            - { call: "POST /fsa/disbursement-requests/${dr_q}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_q}", captures: { st: $.data.status } }
          assert:
            - "first submit: error_id == ERR_PROJECT_NOT_ACTIVE (DisbursementRequest gated on Project state)"
            - "after reinstate: submit succeeds, status == SUBMITTED"

      - name: staff_activate_requires_agreement_active
        grounds:
          - state_machines.StaffEngagement.VETTED_to_ACTIVE
          - state_machines.SponsorshipAgreement.PENDING_COUNTERSIGN_to_ACTIVE
        distinguishing_aspect: |
          Entity pair StaffEngagement -> SponsorshipAgreement (different pair
          from Disbursement->Project): activate is gated on the agreement's
          status; PENDING_COUNTERSIGN blocks, countersign unblocks.
        test_recipe:
          setup:
            - "Application APPROVED but agreement NOT countersigned (project PROPOSED); engagement VETTED"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Sigma", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "s@x.org" }, as: Applicant, as_user_id: user_app_r, captures: { app_r: $.data.id } }
            - { call: "POST /fsa/applications/${app_r}/submit", payload: {}, as: Applicant, as_user_id: user_app_r }
            - { call: "POST /fsa/applications/${app_r}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_r}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_r: $.data.project_id, ag_r: $.data.agreement_id } }
            - { call: "POST /fsa/projects/${p_r}/staff-engagements", payload: { worker_name: "W Three", worker_email: "w3@x.org", engagement_type: "CONTRACTOR", compensation_type: "HOURLY", rate_cents: 4000, start_date: "2026-06-01" }, as: ProjectLead, as_user_id: "${p_r}", captures: { eng_r: $.data.id } }
            - { call: "POST /fsa/staff-engagements/${eng_r}/classification-review", payload: { approved_type: "CONTRACTOR", rationale: "ok" }, as: ComplianceOfficer, as_user_id: user_co_1 }
          trigger:
            - { call: "POST /fsa/staff-engagements/${eng_r}/activate", payload: {}, as: ProjectLead, as_user_id: "${p_r}", captures: { e: $.data.error_id } }
            - { call: "POST /fsa/agreements/${ag_r}/countersign", payload: {}, as: Applicant, as_user_id: user_app_r }
            - { call: "POST /fsa/staff-engagements/${eng_r}/activate", payload: {}, as: ProjectLead, as_user_id: "${p_r}", captures: { st: $.data.status } }
          assert:
            - "first activate: error_id == ERR_AGREEMENT_NOT_ACTIVE (engagement gated on agreement state)"
            - "after countersign: activate succeeds, status == ACTIVE"

      - name: exit_due_diligence_blocked_by_open_review
        grounds:
          - state_machines.ExitPlan.PROPOSED_to_DUE_DILIGENCE
          - state_machines.ComplianceReview.OPEN_to_CLOSED
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair ExitPlan -> ComplianceReview (third distinct pair):
          begin-due-diligence is gated on the absence of OPEN reviews; closing
          the review unblocks.
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE; compliance review OPEN with no findings; exit plan PROPOSED"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Tau", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "t2@x.org" }, as: Applicant, as_user_id: user_app_s, captures: { app_s: $.data.id } }
            - { call: "POST /fsa/applications/${app_s}/submit", payload: {}, as: Applicant, as_user_id: user_app_s }
            - { call: "POST /fsa/applications/${app_s}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_s}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_s: $.data.project_id, ag_s: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_s}/countersign", payload: {}, as: Applicant, as_user_id: user_app_s }
            - { call: "POST /fsa/projects/${p_s}/compliance-reviews", payload: { review_type: "SCHEDULED" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { rv_s: $.data.id } }
            - { call: "POST /fsa/projects/${p_s}/exit-plans", payload: { successor_entity_name: "SpinCo", successor_ein: "98-7654321", reason: "independence" }, as: ProjectLead, as_user_id: "${p_s}", captures: { ep_s: $.data.id } }
          trigger:
            - { call: "POST /fsa/exit-plans/${ep_s}/begin-due-diligence", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e: $.data.error_id } }
            - { call: "POST /fsa/compliance-reviews/${rv_s}/close", payload: {}, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/exit-plans/${ep_s}/begin-due-diligence", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { st: $.data.status } }
          assert:
            - "first begin-due-diligence: error_id == ERR_OPEN_COMPLIANCE_BLOCKS_EXIT (ExitPlan gated on ComplianceReview state)"
            - "after closing the review: status == DUE_DILIGENCE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: engagement_half_open_interval_overlap
        grounds:
          - validations[priority=15]
          - entities.StaffEngagement.fields.start_date
          - entities.StaffEngagement.fields.end_date
        distinguishing_aspect: |
          Half-open interval semantics on StaffEngagement: [start, end) — a new
          engagement starting exactly when the existing one ends (end == start)
          is LEGAL adjacency, while a one-day-early start overlaps and is rejected.
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE; worker w4@x.org has ACTIVE engagement A [2026-06-01, 2026-09-01)"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Upsilon", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "u@x.org" }, as: Applicant, as_user_id: user_app_t, captures: { app_t: $.data.id } }
            - { call: "POST /fsa/applications/${app_t}/submit", payload: {}, as: Applicant, as_user_id: user_app_t }
            - { call: "POST /fsa/applications/${app_t}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_t}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_t: $.data.project_id, ag_t: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_t}/countersign", payload: {}, as: Applicant, as_user_id: user_app_t }
            - { call: "POST /fsa/projects/${p_t}/staff-engagements", payload: { worker_name: "W Four", worker_email: "w4@x.org", engagement_type: "CONTRACTOR", compensation_type: "HOURLY", rate_cents: 4000, start_date: "2026-06-01", end_date: "2026-09-01" }, as: ProjectLead, as_user_id: "${p_t}", captures: { eng_a: $.data.id } }
            - { call: "POST /fsa/staff-engagements/${eng_a}/classification-review", payload: { approved_type: "CONTRACTOR", rationale: "ok" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/staff-engagements/${eng_a}/activate", payload: {}, as: ProjectLead, as_user_id: "${p_t}" }
          trigger:
            - { call: "POST /fsa/projects/${p_t}/staff-engagements", payload: { worker_name: "W Four", worker_email: "w4@x.org", engagement_type: "CONTRACTOR", compensation_type: "HOURLY", rate_cents: 4000, start_date: "2026-09-01", end_date: "2026-12-01" }, as: ProjectLead, as_user_id: "${p_t}", captures: { eng_b: $.data.id } }
            - { call: "POST /fsa/staff-engagements/${eng_b}/classification-review", payload: { approved_type: "CONTRACTOR", rationale: "ok" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/staff-engagements/${eng_b}/activate", payload: {}, as: ProjectLead, as_user_id: "${p_t}", captures: { st_b: $.data.status } }
            - { call: "POST /fsa/projects/${p_t}/staff-engagements", payload: { worker_name: "W Four", worker_email: "w4@x.org", engagement_type: "CONTRACTOR", compensation_type: "HOURLY", rate_cents: 4000, start_date: "2026-08-31", end_date: "2026-10-01" }, as: ProjectLead, as_user_id: "${p_t}", captures: { eng_c: $.data.id } }
            - { call: "POST /fsa/staff-engagements/${eng_c}/classification-review", payload: { approved_type: "CONTRACTOR", rationale: "ok" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/staff-engagements/${eng_c}/activate", payload: {}, as: ProjectLead, as_user_id: "${p_t}", captures: { e_c: $.data.error_id } }
          assert:
            - "engagement B [2026-09-01, 2026-12-01) activates: status == ACTIVE (end==start adjacency is NOT overlap under half-open semantics)"
            - "engagement C [2026-08-31, 2026-10-01) activate: error_id == ERR_ENGAGEMENT_OVERLAP (overlaps A by one day and B by one month)"
            - "engagement C remains VETTED"

      - name: tranche_closed_interval_overlap
        grounds:
          - validations[priority=16]
          - entities.GrantTranche.fields.period_end
        distinguishing_aspect: |
          Closed-interval (day-inclusive) semantics on GrantTranche — a DIFFERENT
          interval semantics and resource from the engagement half-open rule:
          tranches sharing the single calendar day 2026-03-31 conflict (that
          adjacency WOULD be legal under half-open semantics), while
          end+1-day adjacency is legal.
        test_recipe:
          setup:
            - "PRE_APPROVED_GRANT project ACTIVE with tranche T1 [2026-01-01, 2026-03-31] ISSUED"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Phi", mission_statement: "m", requested_model: "PRE_APPROVED_GRANT", budget_estimate_cents: 100000, contact_email: "ph@x.org" }, as: Applicant, as_user_id: user_app_u, captures: { app_u: $.data.id } }
            - { call: "POST /fsa/applications/${app_u}/submit", payload: {}, as: Applicant, as_user_id: user_app_u }
            - { call: "POST /fsa/applications/${app_u}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_u}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "PRE_APPROVED_GRANT" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_u: $.data.project_id, ag_u: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_u}/countersign", payload: {}, as: Applicant, as_user_id: user_app_u }
            - { call: "POST /fsa/agreements/${ag_u}/grant-tranches", payload: { amount_cents: 500000, period_start: "2026-01-01", period_end: "2026-03-31", purpose: "Q1 programs" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { tr1: $.data.id } }
          trigger:
            - { call: "POST /fsa/agreements/${ag_u}/grant-tranches", payload: { amount_cents: 300000, period_start: "2026-04-01", period_end: "2026-06-30", purpose: "Q2 programs" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { tr2: $.data.id, tr2_st: $.data.status } }
            - { call: "POST /fsa/agreements/${ag_u}/grant-tranches", payload: { amount_cents: 100000, period_start: "2026-03-31", period_end: "2026-05-31", purpose: "overlap probe" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e3: $.data.error_id } }
          assert:
            - "T2 [2026-04-01, 2026-06-30] ISSUED (end+1-day adjacency legal under closed-interval semantics)"
            - "T3 [2026-03-31, 2026-05-31]: error_id == ERR_TRANCHE_PERIOD_OVERLAP (shares exactly one calendar day, 2026-03-31, with T1)"

  - rule_id: compensating_invariant
    instances:
      - name: fund_conservation_across_commit_pay_cancel
        grounds:
          - entities.FundAccount.fields.available_cents
          - entities.FundAccount.fields.committed_cents
          - state_machines.DisbursementRequest.APPROVED_FOR_PAYMENT_to_PAID
          - state_machines.DisbursementRequest.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: fund cents. Invariant available + committed +
          reserved == received - refunded - fees_net - disbursed - transferred +
          adjustments is verified after commit, after pay, and after cancel —
          each forward/compensating pair leaves the named quantity drift-free.
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE; donations 100,000 (fee 8,000) and 200,000 (fee 16,000) RECEIVED"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Chi", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "ch@x.org" }, as: Applicant, as_user_id: user_app_v, captures: { app_v: $.data.id } }
            - { call: "POST /fsa/applications/${app_v}/submit", payload: {}, as: Applicant, as_user_id: user_app_v }
            - { call: "POST /fsa/applications/${app_v}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_v}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_v: $.data.project_id, ag_v: $.data.agreement_id, f_v: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag_v}/countersign", payload: {}, as: Applicant, as_user_id: user_app_v }
            - { call: "POST /fsa/projects/${p_v}/donations", payload: { amount_cents: 100000, donor_name: "D Fifteen", donor_email: "d15@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d_v1: $.data.id } }
            - { call: "POST /fsa/donations/${d_v1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p_v}/donations", payload: { amount_cents: 200000, donor_name: "D Sixteen", donor_email: "d16@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d_v2: $.data.id } }
            - { call: "POST /fsa/donations/${d_v2}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
          trigger:
            - { call: "POST /fsa/projects/${p_v}/disbursement-requests", payload: { amount_cents: 50000, purpose: "A", payee_type: "VENDOR", payee_name: "A Co", spend_date: "2026-06-01" }, as: ProjectLead, as_user_id: "${p_v}", captures: { dr_a: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr_a}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_v}" }
            - { call: "POST /fsa/projects/${p_v}/disbursement-requests", payload: { amount_cents: 30000, purpose: "B", payee_type: "VENDOR", payee_name: "B Co", spend_date: "2026-06-02" }, as: ProjectLead, as_user_id: "${p_v}", captures: { dr_b: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr_b}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_v}" }
            - { call: "POST /fsa/disbursement-requests/${dr_a}/compliance-review", payload: { decision: "APPROVE" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/disbursement-requests/${dr_a}/pay", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/disbursement-requests/${dr_b}/cancel", payload: {}, as: ProjectLead, as_user_id: "${p_v}" }
            - { call: "GET /fsa/fund-accounts/${f_v}", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { avail: $.data.available_cents, comm: $.data.committed_cents, recv: $.data.total_received_cents, fees: $.data.total_fees_charged_cents, disb: $.data.total_disbursed_cents } }
          assert:
            - "final: available_cents == 226000 and committed_cents == 0"
            - "total_received_cents == 300000, total_fees_charged_cents == 24000, total_disbursed_cents == 50000"
            - "invariant: 226000 + 0 + 0 == 300000 - 0 - 24000 - 50000 - 0 + 0 (pay released committed into disbursed; cancel released committed into available; no drift)"

      - name: receipt_conservation_across_partial_refund
        grounds:
          - state_machines.Donation.REFUND_REQUESTED_to_RECEIPTED
          - state_machines.TaxReceipt.ISSUED_to_VOIDED
          - entities.TaxReceipt.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: outstanding receipted cents (a different conserved
          quantity from fund cents). A partial refund voids the 100,000 receipt
          and reissues 60,000; sum of ISSUED receipts == amount - refunded holds
          before and after the void+reissue pair.
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE; donation 100,000 RECEIVED (fee 8,000) and RECEIPTED with receipt R1 (100,000)"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Psi", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "ps@x.org" }, as: Applicant, as_user_id: user_app_w, captures: { app_w: $.data.id } }
            - { call: "POST /fsa/applications/${app_w}/submit", payload: {}, as: Applicant, as_user_id: user_app_w }
            - { call: "POST /fsa/applications/${app_w}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_w}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_w: $.data.project_id, ag_w: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_w}/countersign", payload: {}, as: Applicant, as_user_id: user_app_w }
            - { call: "POST /fsa/projects/${p_w}/donations", payload: { amount_cents: 100000, donor_name: "D Seventeen", donor_email: "d17@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d_w1: $.data.id } }
            - { call: "POST /fsa/donations/${d_w1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/donations/${d_w1}/issue-receipt", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "GET /fsa/donations/${d_w1}/receipts", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { r1_id: "$.data[0].id", r1_num: "$.data[0].receipt_number" } }
          trigger:
            - { call: "POST /fsa/donations/${d_w1}/request-refund", payload: { amount_cents: 40000, reason: "partial remorse" }, as: Donor, as_user_id: user_donor_1 }
            - { call: "POST /fsa/donations/${d_w1}/decide-refund", payload: { decision: "APPROVE" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { d_st: $.data.status, d_ref: $.data.refunded_cents } }
            - { call: "GET /fsa/donations/${d_w1}/receipts", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { r1_st: "$.data[0].status", r1_amt: "$.data[0].amount_cents", r2_st: "$.data[1].status", r2_amt: "$.data[1].amount_cents", r2_num: "$.data[1].receipt_number" } }
          assert:
            - "donation status == RECEIPTED (partial refund restores pre-refund state) and refunded_cents == 40000"
            - "R1: status VOIDED, amount_cents 100000, void_reason PARTIAL_REFUND (created_at ASC ordering keeps R1 at index 0)"
            - "R2: status ISSUED, amount_cents == 60000 == 100000 - 40000, receipt_number != R1 receipt_number (never reused)"
            - "conserved: sum of ISSUED receipt amounts for the donation == 60000 == amount_cents - refunded_cents (before refund it was 100000 == amount - 0)"
