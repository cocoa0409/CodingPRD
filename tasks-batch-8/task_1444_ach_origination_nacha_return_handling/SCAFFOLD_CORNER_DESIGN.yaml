              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
          trigger:
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "oc-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_v2: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 50000, receiver_account: "oc-2", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v2}"
                entries:
                  - { direction: "DEBIT", amount_cents: 50000, receiver_account: "oc-2", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
          assert:
            - "err == ERR_STALE_VERSION (http 412); AchFile.${f_id}.entry_count == 1 after the rejected append (atomic)"
            - "Retry with ${f_v2} succeeds: entry_count == 2 AND total_amount_cents == 150000 AND quoted_fee_cents == 320"

      - name: cascading_and_dual_variant_layers_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
