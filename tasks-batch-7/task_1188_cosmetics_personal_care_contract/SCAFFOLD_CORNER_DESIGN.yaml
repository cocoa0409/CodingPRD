scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: create_customer_missing_required_field_returns_validation
        claim_type: required_fields
        grounds:
          - entities.Customer.fields.credit_limit_cents
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /cosmfg/customers without credit_limit_cents is rejected with ERR_VALIDATION (400); no customer is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cosmfg/customers"
              payload: { name: "No Credit Corp", tier: "STANDARD", minimum_run_units: 1000 }
              as: PlantDirector
              captures: { e: $.data.error_id }
          assert:
            - "Response error_id == ERR_VALIDATION and http status 400"

      - name: lot_sensorial_defaults_applied
        claim_type: defaults
        grounds:
          - entities.ComponentLot.fields.sensorial_profile
          - entities.ComponentLot.fields.variant_waiver
        distinguishing_aspect: "A lot received without sensorial_profile defaults to WITHIN_SPEC and variant_waiver NOT_REQUIRED."
        test_recipe:
          setup: ["A MANUFACTURER_SUPPLIED raw-material component exists"]
          setup_api_calls:
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 100, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { lt: $.data.id, sp: $.data.sensorial_profile, vw: $.data.variant_waiver, st: $.data.status }
          assert:
            - "ComponentLot.${lt}.sensorial_profile == WITHIN_SPEC (default)"
            - "ComponentLot.${lt}.variant_waiver == NOT_REQUIRED"
            - "ComponentLot.${lt}.status == AVAILABLE"

      - name: lot_available_equals_received_on_create
        claim_type: computed_fields
        grounds:
          - entities.ComponentLot.fields.quantity_available
          - entities.ComponentLot.fields.quantity_reserved
        distinguishing_aspect: "Computed quantity_available equals quantity_received and reserved/consumed are 0 immediately after receipt; a client-supplied quantity_available in the payload is not accepted (field is not in the endpoint input schema)."
        test_recipe:
          setup: ["A component exists"]
          setup_api_calls:
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 250, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { lt: $.data.id, av: $.data.quantity_available, rs: $.data.quantity_reserved, cn: $.data.quantity_consumed }
          assert:
            - "ComponentLot.${lt}.quantity_available == 250"
            - "ComponentLot.${lt}.quantity_reserved == 0 and quantity_consumed == 0"

      - name: ipc_check_immutable_event_record
        claim_type: immutability
        grounds:
          - entities.IPCCheck
        distinguishing_aspect: "IPCCheck has common_fields: false — the record carries id and created_at but no version/updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "CONFIRMED order with a MIXING 100kg batch (allocation 100kg from a 200kg lot)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 100 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 100, batch_id: "${bt}" }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/start-mixing"
              as: ProductionPlanner
          trigger:
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "VISCOSITY", measured_value: 4100 }
              as: QAManager
              as_user_id: "qa-1"
              captures: { chk: $.data.id, rid: $.data.recorded_by_user_id, res: $.data.result }
          assert:
            - "IPCCheck.${chk} response contains id, created_at, recorded_by_user_id == qa-1, result == PASS"
            - "IPCCheck.${chk} response contains no version and no updated_at field"

      - name: get_order_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - "endpoints.GET /cosmfg/production-orders/{id}"
        distinguishing_aspect: "GET with a well-formed but non-existent order UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cosmfg/production-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProductionPlanner
              captures: { e: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND and http status 404"

      - name: list_orders_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - "endpoints.GET /cosmfg/production-orders"
        distinguishing_aspect: "GET /cosmfg/production-orders?limit=1&offset=0 returns response_type array with total_count == 2, has_more == true, and exactly 1 element, proving pagination defaults interact with the fixed envelope."
        test_recipe:
          setup:
            - "Customer with ACTIVE formula; two DRAFT orders exist"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { o1: $.data.id }
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1500 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { o2: $.data.id }
          trigger:
            - call: "GET /cosmfg/production-orders"
              payload: { limit: 1, offset: 0 }
              as: ProductionPlanner
          assert:
            - "Response envelope response_type == array, total_count == 2, has_more == true, and data contains exactly 1 element"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: batch_release_from_mixing_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Batch.IPC_PASSED_to_RELEASED_TO_FILLING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Release is only defined from IPC_PASSED; attempting it from MIXING (by a different QA user than the IPC recorder, so the SoD check passes) fails with ERR_INVALID_STATE and no status change."
        test_recipe:
          setup:
            - "CONFIRMED order with a MIXING 100kg batch; one passing VISCOSITY check recorded by qa-1"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 100 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 100, batch_id: "${bt}" }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/start-mixing"
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "VISCOSITY", measured_value: 4000 }
              as: QAManager
              as_user_id: "qa-1"
          trigger:
            - call: "POST /cosmfg/batches/${bt}/release"
              as: QAManager
              as_user_id: "qa-2"
              captures: { e: $.data.error_id }
            - call: "GET /cosmfg/batches/${bt}"
              as: QAManager
              captures: { bt_st: $.data.status }
          assert:
            - "Release from MIXING returns error_id ERR_INVALID_STATE"
            - "Batch.${bt} remains MIXING (captured ${bt_st})"

      - name: formula_retire_terminal_lockdown_and_order_cascade
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Formula.ACTIVE_to_RETIRED
          - state_machines.ProductionOrder.DRAFT_to_CANCELLED
        distinguishing_aspect: "Retiring an ACTIVE formula cascades CANCELLED to its DRAFT orders, and any further transition attempt on the RETIRED formula (submit) fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "ACTIVE formula with one DRAFT order"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /cosmfg/formulas/${fm}/retire"
              as: PlantDirector
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
              captures: { e: $.data.error_id }
            - call: "GET /cosmfg/production-orders/${ord}"
              as: ProductionPlanner
              captures: { ord_st: $.data.status }
          assert:
            - "Submit after retire rejected with error_id ERR_INVALID_STATE (terminal lockdown)"
            - "DRAFT order ${ord} cascaded to CANCELLED"

      - name: lot_depleted_at_exactly_zero
        claim_type: side_effect_execution
        grounds:
          - state_machines.ComponentLot.AVAILABLE_to_DEPLETED
        distinguishing_aspect: "Reserving the lot's entire remaining quantity (200 of 200) drives quantity_available to exactly 0 and flips status to DEPLETED; a further allocation then fails with ERR_LOT_INSUFFICIENT_QUANTITY."
        test_recipe:
          setup:
            - "Customer with ACTIVE formula and CONFIRMED order; lot of exactly 200kg"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
          trigger:
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 200 }] }
              as: ProductionPlanner
            - call: "GET /cosmfg/lots/${la}"
              as: ProductionPlanner
              captures: { lt_st: $.data.status, lt_av: $.data.quantity_available }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 1 }] }
              as: ProductionPlanner
              captures: { e: $.data.error_id }
          assert:
            - "After reserving all 200: ComponentLot.${la}.quantity_available == 0 and status == DEPLETED"
            - "Any further allocation from the depleted lot fails with error_id ERR_LOT_INSUFFICIENT_QUANTITY"

      - name: order_completion_waits_for_label_review
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProductionOrder.FILLING_to_COMPLETED
          - state_machines.RegulatoryReview.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "Guarded transition: filling the full requested quantity leaves the order in FILLING while the LABEL_ARTWORK review is unapproved; approving that review afterwards flips the order to COMPLETED."
        test_recipe:
          setup:
            - "ACTIVE formula (INCI approved, label review NOT yet approved); CONFIRMED order of 1000 units with a RELEASED_TO_FILLING 50kg batch and an IN_PROGRESS run planned for 1000 units"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 50 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 100, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 50, batch_id: "${bt}" }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/start-mixing"
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "VISCOSITY", measured_value: 4000 }
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "PH", measured_value: 5.5 }
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /cosmfg/batches/${bt}/release"
              as: QAManager
              as_user_id: "qa-2"
            - call: "POST /cosmfg/filling-lines"
              payload: { line_code: "L1" }
              as: ProductionPlanner
              captures: { ln: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${bt}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T09:00:00Z", planned_units: 1000 }
              as: ProductionPlanner
              captures: { rn: $.data.id }
            - call: "POST /cosmfg/filling-runs/${rn}/start"
              as: ProductionPlanner
          trigger:
            - call: "POST /cosmfg/filling-runs/${rn}/complete"
              payload: { filled_units: 1000 }
              as: ProductionPlanner
            - call: "GET /cosmfg/production-orders/${ord}"
              as: ProductionPlanner
              captures: { st_mid: $.data.status, fill_mid: $.data.filled_units }
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "LABEL_ARTWORK" }
              as: FormulationChemist
              captures: { rvl: $.data.id }
            - call: "POST /cosmfg/reviews/${rvl}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rvl}/approve"
              as: RegulatoryAffairs
            - call: "GET /cosmfg/production-orders/${ord}"
              as: ProductionPlanner
              captures: { st_end: $.data.status }
          assert:
            - "After filling all 1000 units without label approval: ProductionOrder.${ord}.status == FILLING (filled_units == 1000)"
            - "After LABEL_ARTWORK approval: ProductionOrder.${ord}.status == COMPLETED"

      - name: line_finish_cleaning_from_idle_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.FillingLine.CLEANING_to_IDLE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "finish-cleaning is defined only from CLEANING; invoking it on an IDLE line fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A freshly created (IDLE) filling line"]
          setup_api_calls:
            - call: "POST /cosmfg/filling-lines"
              payload: { line_code: "L1" }
              as: ProductionPlanner
              captures: { ln: $.data.id }
          trigger:
            - call: "POST /cosmfg/filling-lines/${ln}/finish-cleaning"
              as: ProductionPlanner
              captures: { e: $.data.error_id }
          assert:
            - "finish-cleaning from IDLE returns error_id ERR_INVALID_STATE"

  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: quote_filling_fee_tier_boundary
        claim_type: correct_result
        grounds:
          - calculations.order_quote_total
        distinguishing_aspect: "Tier boundary at 5000 units: 5000 units rate 50 => fee 250000 and quote 500000; 5001 units fall to rate 40 => fee 200040 and quote 450090 (a 1-unit increase lowers the total)."
        test_recipe:
          setup:
            - "Customer (min run 1000, STANDARD); ACTIVE formula with single AQUA ingredient at 1000 c/kg, bulk 0.05 kg/unit (materials 250000 cents per 5000 units)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
          trigger:
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 5000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { o1: $.data.id, q1: $.data.quote_total_cents }
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 5001 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { o2: $.data.id, q2: $.data.quote_total_cents }
          assert:
            - "ProductionOrder.${o1}.quote_total_cents == 500000 (materials 250000 + fee 250000)"
            - "ProductionOrder.${o2}.quote_total_cents == 450090 (materials 250050 + fee 200040)"

      - name: ipc_tolerance_tightening_covered_by_difficulty
        claim_type: constants_applied
        grounds:
          - calculations.ipc_evaluation
        excluded_because:
          difficulty_instance: batch_ipc_retry_cycle
          rationale: "Tightening constant TIGHTENING_PER_FAILURE and the round reset are asserted there (effective_tolerance == 360 in round 2)."

      - name: scale_up_threshold_boundary
        claim_type: correct_result
        grounds:
          - validations[priority=9]
          - entities.Batch.fields.scale_up_factor
        distinguishing_aspect: "Boundary on scale_up_factor: a 500kg batch (factor exactly 10) may start mixing without approval, while a 600kg batch (factor 12) is rejected with ERR_SCALE_UP_APPROVAL_REQUIRED until PlantDirector approves."
        test_recipe:
          setup:
            - "Customer with ACTIVE formula; CONFIRMED order; batches of 500kg and 600kg; lot of 1200kg raw material allocated 500/600 respectively"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 500 }
              as: ProductionPlanner
              captures: { b500: $.data.id, f500: $.data.scale_up_factor }
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 600 }
              as: ProductionPlanner
              captures: { b600: $.data.id, f600: $.data.scale_up_factor }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 1200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 500, batch_id: "${b500}" }, { lot_id: "${la}", quantity: 600, batch_id: "${b600}" }] }
              as: ProductionPlanner
          trigger:
            - call: "POST /cosmfg/batches/${b500}/start-mixing"
              as: ProductionPlanner
              captures: { st500: $.data.status }
            - call: "POST /cosmfg/batches/${b600}/start-mixing"
              as: ProductionPlanner
              captures: { e: $.data.error_id }
            - call: "POST /cosmfg/batches/${b600}/approve-scale-up"
              as: PlantDirector
            - call: "POST /cosmfg/batches/${b600}/start-mixing"
              as: ProductionPlanner
              captures: { st600: $.data.status }
          assert:
            - "Batch.${b500}.scale_up_factor == 10 and start-mixing succeeds without approval (status MIXING)"
            - "Batch.${b600} (factor 12) start-mixing rejected with error_id ERR_SCALE_UP_APPROVAL_REQUIRED"
            - "After approve-scale-up, Batch.${b600} start-mixing succeeds (status MIXING)"

      - name: shortfall_proration_waterfall_order
        claim_type: correct_result
        grounds:
          - calculations.shortfall_proration
          - state_machines.ShortfallCase.OPEN_to_CLOSED_RESOLVED
        distinguishing_aspect: "Waterfall on lot receipt: a 1000-unit cap lot first covers the older shortfall (800 => CLOSED_RESOLVED with an auto-created allocation on order1), then partially covers the newer (200 of 600 => stays OPEN); the lot ends DEPLETED."
        test_recipe:
          setup:
            - "ACTIVE formula requiring cap x1 (CUSTOMER_SUPPLIED); orders O1 and O2 (1000 units each, CONFIRMED, O1 created first)"
            - "OPEN shortfalls: SF1 on O1 (required 800, allocatable 0) and SF2 on O2 (required 600, allocatable 0)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Cap", kind: "SECONDARY_PACK", supply_mode: "CUSTOMER_SUPPLIED", customer_id: "${cust}", standard_cost_per_kg_cents: 0 }
              as: ProductionPlanner
              captures: { cap: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [{ component_id: "${cap}", units_per_product: 1 }] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { o1: $.data.id }
            - call: "POST /cosmfg/production-orders/${o1}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { o2: $.data.id }
            - call: "POST /cosmfg/production-orders/${o2}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${o1}/shortfalls"
              payload: { component_id: "${cap}", required_quantity: 800 }
              as: ProductionPlanner
              captures: { sf1: $.data.id }
            - call: "POST /cosmfg/production-orders/${o2}/shortfalls"
              payload: { component_id: "${cap}", required_quantity: 600 }
              as: ProductionPlanner
              captures: { sf2: $.data.id }
          trigger:
            - call: "POST /cosmfg/components/${cap}/lots"
              payload: { lot_code: "C1", quantity_received: 1000, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { lc: $.data.id, lc_st: $.data.status, lc_av: $.data.quantity_available }
            - call: "GET /cosmfg/shortfalls/${sf1}"
              as: ProductionPlanner
              captures: { sf1_st: $.data.status }
            - call: "GET /cosmfg/shortfalls/${sf2}"
              as: ProductionPlanner
              captures: { sf2_st: $.data.status }
            - call: "GET /cosmfg/production-orders/${o2}/allocations"
              payload: {}
              as: ProductionPlanner
              captures: { o2_alloc_qty: "$.data[0].quantity" }
          assert:
            - "ShortfallCase.${sf1}.status == CLOSED_RESOLVED (older shortfall covered first)"
            - "ShortfallCase.${sf2}.status == OPEN (only 200 of 600 remain after the waterfall)"
            - "Order ${o2} has one auto-created RESERVED allocation of quantity 200"
            - "ComponentLot.${lc}.quantity_available == 0 and status == DEPLETED"

  # ===================================================================
  # Section: validations
  # ===================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected with ERR_UNAUTHENTICATED (401) before any role or existence check runs."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cosmfg/customers"
          assert:
            - "Response error_id == ERR_UNAUTHENTICATED and http status 401"

      - name: review_already_open_same_scope
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_REVIEW_ALREADY_OPEN]
        distinguishing_aspect: "Opening a second INCI_LIST review while one is still open (SUBMITTED) fails with ERR_REVIEW_ALREADY_OPEN; a different scope (LABEL_ARTWORK) is allowed."
        test_recipe:
          setup:
            - "Customer; formula IN_REVIEW with one SUBMITTED INCI_LIST review"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
          trigger:
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { e: $.data.error_id }
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "LABEL_ARTWORK" }
              as: FormulationChemist
              captures: { rv2: $.data.id }
          assert:
            - "Duplicate open INCI_LIST review rejected with error_id ERR_REVIEW_ALREADY_OPEN"
            - "LABEL_ARTWORK review (different scope) is created as ${rv2} with status SUBMITTED"

      - name: reading_interval_out_of_order
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors[ERR_READING_INTERVAL_OUT_OF_ORDER]
        distinguishing_aspect: "An ACCELERATED study's first reading must be interval 30; recording 60 first fails, then 30 succeeds and the sequence advances."
        test_recipe:
          setup:
            - "ACTIVE formula with an IN_PROGRESS ACCELERATED study in a chamber"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/stability-chambers"
              payload: { chamber_code: "CH1", capacity_studies: 4 }
              as: QAManager
              captures: { ch: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/stability-studies"
              payload: { chamber_id: "${ch}", study_type: "ACCELERATED" }
              as: QAManager
              captures: { st: $.data.id }
          trigger:
            - call: "POST /cosmfg/stability-studies/${st}/readings"
              payload: { interval_index: 60, result: "PASS" }
              as: QAManager
              captures: { e: $.data.error_id }
            - call: "POST /cosmfg/stability-studies/${st}/readings"
              payload: { interval_index: 30, result: "PASS" }
              as: QAManager
              captures: { rd: $.data.id }
            - call: "GET /cosmfg/stability-studies/${st}"
              as: QAManager
              captures: { st_cnt: $.data.recorded_interval_count }
          assert:
            - "Interval 60 first rejected with error_id ERR_READING_INTERVAL_OUT_OF_ORDER"
            - "Interval 30 then accepted; StabilityStudy.${st}.recorded_interval_count == 1 and status IN_PROGRESS"

      - name: no_shortfall_when_coverage_sufficient
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors[ERR_NO_SHORTFALL]
        distinguishing_aspect: "Declaring a shortfall for 300 units while 500 units of the component lie AVAILABLE is rejected with ERR_NO_SHORTFALL (computed shortfall_quantity would be -200)."
        test_recipe:
          setup:
            - "ACTIVE formula requiring cap x1; CONFIRMED order; cap lot of 500 AVAILABLE (unreserved)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Cap", kind: "SECONDARY_PACK", supply_mode: "CUSTOMER_SUPPLIED", customer_id: "${cust}", standard_cost_per_kg_cents: 0 }
              as: ProductionPlanner
              captures: { cap: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [{ component_id: "${cap}", units_per_product: 1 }] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/components/${cap}/lots"
              payload: { lot_code: "C1", quantity_received: 500, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
          trigger:
            - call: "POST /cosmfg/production-orders/${ord}/shortfalls"
              payload: { component_id: "${cap}", required_quantity: 300 }
              as: ProductionPlanner
              captures: { e: $.data.error_id }
          assert:
            - "Shortfall declaration rejected with error_id ERR_NO_SHORTFALL (500 available >= 300 required)"

      - name: overfill_rejected_on_run_complete
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_OVER_DELIVERY]
        distinguishing_aspect: "Completing a 1000-unit order's run with filled_units 1001 is rejected with ERR_OVER_DELIVERY; the run stays IN_PROGRESS."
        test_recipe:
          setup:
            - "CONFIRMED order of 1000 units with an IN_PROGRESS run (RELEASED 50kg batch)"
