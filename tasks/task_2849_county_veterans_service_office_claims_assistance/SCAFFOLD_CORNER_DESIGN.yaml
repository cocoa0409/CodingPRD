            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-411", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
          trigger:
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
              captures: { first_status: $.data.accreditation_status, first_v: $.data.version }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
