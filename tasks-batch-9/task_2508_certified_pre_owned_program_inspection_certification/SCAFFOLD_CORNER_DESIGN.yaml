          assert:
            - "trigger call 1 returns 422 ERR_DOCUMENTATION_INCOMPLETE: CUSTOMER_DISCLOSURE is missing"
            - "trigger call 2 returns 422 ERR_DOCUMENT_NOT_APPLICABLE: ${iC} produced no ReconditioningItem, so RECONDITIONING_INVOICE must be absent - the array is otherwise a superset of every required type"
            - "trigger call 3 returns 422 ERR_DOCUMENT_NOT_APPLICABLE for the duplicate TITLE_HISTORY_REPORT, even though all required types are present"
            - "trigger call 4 returns 422 ERR_DOCUMENTATION_INCOMPLETE: the same three-document array that was merely incomplete for ${iC} is now missing the conditionally required RECONDITIONING_INVOICE"
            - "trigger call 5 returns 201 with document_count == 4 and status SUBMITTED; the identical array would have been rejected for ${iC}"
            - "no Certification row exists for ${vC} at the end, and Certification.${cR}.certification_number == CPO-FR-1001-0001 because the four rejected submissions never incremented Dealer.${d1}.lifetime_submitted_count"

      - name: vehicle_already_certified_blocks_third_submission
        claim_type: cross-entity
        grounds:
          - validations.priority_21
          - errors.ERR_VEHICLE_ALREADY_CERTIFIED
          - state_machines.Certification.SUBMITTED_to_SUPERSEDED
        distinguishing_aspect: |
          The rule discriminates between two occupied states of the same vehicle: a SUBMITTED
          certification may be superseded by a fresh submission, while an ACTIVE one blocks outright.
          The identical POST body therefore succeeds before approval and fails 409 afterwards, using
          the same vehicle and the same PASSED inspection both times.
        test_recipe:
          setup:
            - "Dealer D1, technician T1, published MPI-172, canonical vehicle V1 with a PASSED inspection I1 and a SUBMITTED certification C1."
