            a nil client_id but a real package answers 404 with
            ${e_client} == "ERR_CLIENT_NOT_FOUND" (priority 16), not a package or
            validation error.

  # ===========================================================================
  # §1.9 — rbac
  # ===========================================================================
  - section: rbac
    instances:

      - name: only_the_commercial_director_may_publish_a_price
        claim_type: exclusive_operations
        grounds: >-
          §1.7 roles.CommercialDirector.exclusive_operations
          ["POST /package-products/{id}/publish"]; endpoints
          "POST /package-products/{id}/publish" roles [CommercialDirector];
          validations[priority=2] -> ERR_UNAUTHORIZED 403.
        distinguishing_aspect: >-
          The exclusivity is probed from the two roles that are closest to it —
          CommercialManager, which may do everything else to the package
          including pricing it, and FinanceController, which owns money and reads
          the margin — so an implementation that grants publish to "anyone
          commercial" or "anyone who can read the margin" fails. The refusals
          leave the package in PRICED, proving the 403 happened before any state
          change, and the same body then succeeds for CommercialDirector.
        test_recipe:
          setup: >-
            Canonical event with a PRICED one-component BRONZE package
            (base 100000, list 120000, margin_pct 0.1667) priced by u_pricer.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
          trigger:
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialManager, as_user_id: u_pricer, captures: { e_cm: "$.data.error_id" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: FinanceController, as_user_id: u_fin, captures: { e_fc: "$.data.error_id" } }
            - { call: "GET /package-products/${pkg_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { st_mid: "$.data.package_status", v_mid: "$.data.version", pub_mid: "$.data.published_by_user_id" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director, captures: { st_ok: "$.data.package_status", pub_ok: "$.data.published_by_user_id" } }
          assert: >-
            CommercialManager — the role that created, componentized and priced
            this very package — is refused: 403 with
            ${e_cm} == "ERR_UNAUTHORIZED". FinanceController, which may read the
            margin report for the same event, is refused identically:
            ${e_fc} == "ERR_UNAUTHORIZED".
            Neither refusal touched the row: ${st_mid} == "PRICED",
            ${v_mid} == ${pkg_v} and ${pub_mid} == null.
            The byte-identical body from CommercialDirector answers 200 with
            ${st_ok} == "PUBLISHED" and ${pub_ok} == "u_director".

      - name: only_the_finance_controller_may_commit_the_organisation_to_spend_or_settlement
        claim_type: exclusive_operations
        grounds: >-
          §1.7 roles.FinanceController.exclusive_operations
          ["POST /rights-deals/{id}/settle",
          "POST /hospitality-builds/{id}/approve"]; endpoints for both actions
          list roles [FinanceController]; §1.7 header (six separate hands);
          validations[priority=2] -> ERR_UNAUTHORIZED 403.
        distinguishing_aspect: >-
          Both money-committing verbs are probed from the role that OWNS the
          neighbouring lifecycle step — OperationsManager plans the build and may
          declare it READY, RightsManager owns the deal and confirmed its
          tranches — so ownership of the entity is shown NOT to imply the right
          to commit spend against it. The pair also demonstrates that priority 2
          answers before the state rows: OperationsManager is told
          ERR_UNAUTHORIZED on a build that is in the correct PLANNED state, and
          RightsManager is told ERR_UNAUTHORIZED on a deal whose event is not
          COMPLETED — the deeper 409 never surfaces.
        test_recipe:
          setup: >-
            Canonical event, a PLANNED ZONE_A build, and a 20-unit deal
            (guaranteed_minimum 0) fully released with no blocks.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /hospitality-builds", payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }, as: OperationsManager, as_user_id: u_ops, captures: { hb_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 20, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 20, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 20, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
          trigger:
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { e_appr_ops: "$.data.error_id" } }
            - { call: "POST /hospitality-builds/${hb_id}/ready", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { e_ready: "$.data.error_id" } }
            - { call: "POST /rights-deals/${deal_id}/settle", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { e_settle_rights: "$.data.error_id" } }
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { hb_st: "$.data.build_state", hb_appr: "$.data.approved_by_user_id" } }
            - { call: "POST /hospitality-builds/${hb_id}/ready", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { hb_st2: "$.data.build_state" } }
          assert: >-
            The role that planned the build cannot approve its own spend: 403 with
            ${e_appr_ops} == "ERR_UNAUTHORIZED", even though PLANNED is exactly
            the state approve wants.
            Its own exclusive verb on the same row still answers on business
            grounds, not auth grounds: ready on a PLANNED build gives 409 with
            ${e_ready} == "ERR_INVALID_BUILD_STATE" — so the 403 above was about
            the actor, not the state.
            The role that owns the deal cannot settle it: 403 with
            ${e_settle_rights} == "ERR_UNAUTHORIZED"; the ERR_INVALID_DEAL_STATE
            it would otherwise have earned (Event still SCHEDULED) never
            surfaces, because priority 2 precedes priority 41.
            FinanceController approves: ${hb_st} == "APPROVED" with
            ${hb_appr} == "u_fin"; OperationsManager can then
            take it further, ${hb_st2} == "READY" — the two hands interleave on
            one row.

      - name: rostering_and_reading_are_shared_across_hands_while_registration_stays_exclusive
        claim_type: shared_operations
        grounds: >-
          §1.7 roles.ClientServiceAgent.shared_operations and
          roles.OperationsManager.shared_operations both list
          "POST /host-assignments" and "POST /host-assignments/{id}/release";
          roles.OperationsManager.exclusive_operations lists
          "POST /on-site-hosts"; endpoints "GET /events/{id}" roles = all seven
          roles.
        distinguishing_aspect: >-
          Shared means the SAME endpoint accepts two different roles with the same
          body and produces the same kind of row — proved by two assignments on
          one host created by two different hands — while the immediately adjacent
          endpoint on the same entity family is exclusive, so an implementation
          that copies one role list onto its neighbour fails. GET /events/{id}
          is then read by all seven roles including the entity-backed
          ClientPortalUser, which is the widest sharing in the matrix.
        test_recipe:
          setup: >-
            Canonical event with an APPROVED ZONE_A build (09:00-20:00), a host
            with max_concurrent_bookings 2, a published package and two 5-unit
            CORPORATE bookings; one client id doubles as the portal user's
            X-User-ID.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /hospitality-builds", payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }, as: OperationsManager, as_user_id: u_ops, captures: { hb_id: "$.data.id" } }
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin }
            - { call: "POST /on-site-hosts", payload: { full_name: "Alina Petrova", languages: ["EN", "IT"], max_concurrent_bookings: 2 }, as: OperationsManager, as_user_id: u_ops, captures: { host_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { clA: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "Vantage Partners", client_type: "TRAVEL_PARTNER", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { clB: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${clA}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bkA: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${clB}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bkB: "$.data.id" } }
          trigger:
            - { call: "POST /host-assignments", payload: { on_site_host_id: "${host_id}", booking_id: "${bkA}", hospitality_build_id: "${hb_id}", shift_start: "2027-02-01T10:00:00.000Z", shift_end: "2027-02-01T18:00:00.000Z" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { ha1: "$.data.id", ha1_st: "$.data.assignment_state" } }
            - { call: "POST /host-assignments", payload: { on_site_host_id: "${host_id}", booking_id: "${bkB}", hospitality_build_id: "${hb_id}", shift_start: "2027-02-01T10:00:00.000Z", shift_end: "2027-02-01T18:00:00.000Z" }, as: OperationsManager, as_user_id: u_ops, captures: { ha2: "$.data.id", ha2_st: "$.data.assignment_state" } }
            - { call: "GET /on-site-hosts/${host_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { h_cnt: "$.data.active_assignment_count" } }
            - { call: "POST /host-assignments/${ha1}/release", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { rel1_st: "$.data.assignment_state" } }
            - { call: "POST /host-assignments/${ha2}/release", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { rel2_st: "$.data.assignment_state" } }
            - { call: "POST /on-site-hosts", payload: { full_name: "Marc Delacroix", languages: ["FR"] }, as: ClientServiceAgent, as_user_id: u_csa, captures: { e_host: "$.data.error_id" } }
            - { call: "GET /events/${ev_id}", payload: {}, as: ClientPortalUser, as_user_id: "${clA}", captures: { ev_portal: "$.data.id" } }
            - { call: "GET /events/${ev_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { ev_r: "$.data.id" } }
            - { call: "GET /events/${ev_id}", payload: {}, as: CommercialDirector, as_user_id: u_director, captures: { ev_d: "$.data.id" } }
          assert: >-
            The same endpoint and the same shape of body succeed from two hands:
            ${ha1_st} == ${ha2_st} == "ASSIGNED" with ${ha1} != ${ha2}, and the
            host's counter aggregates both regardless of who created them:
            ${h_cnt} == 2.
            Release is shared symmetrically and crosswise — the operations hand
            releases the agent's assignment (${rel1_st} == "RELEASED") and the
            agent releases the operations hand's (${rel2_st} == "RELEASED").
            The adjacent registration endpoint is NOT shared: the agent
            registering a host earns 403 with ${e_host} == "ERR_UNAUTHORIZED".
            The widest read is open to every hand including the entity-backed
            portal identity: ${ev_portal} == ${ev_r} == ${ev_d} == "${ev_id}".

      - name: the_hand_that_set_the_price_can_never_be_the_hand_that_approves_it
        claim_type: segregation_of_duties
        grounds: >-
          validations[priority=51] ("X-User-ID differs from
          PackageProduct.priced_by_user_id") -> ERR_SEGREGATION_OF_DUTIES 403;
          state_machines.PackageProduct PRICED -> PUBLISHED guard
          "X-User-ID != PackageProduct.priced_by_user_id"; PRICED -> PRICED
          side effect "the previous published_by_user_id is cleared".
        distinguishing_aspect: >-
          The forbidden combination is (role allowed) AND (same user), which only
          shows up because price is a SHARED verb: the same u_director who is the
          only role able to publish is also able to price, and doing so
          disqualifies him from his own exclusive action — while u_pricer, who was
          blocked a moment earlier, becomes eligible. The instance also pins the
          priority order: a CommercialManager who priced the package and tries to
          publish violates rows 2 and 51 at once and must hear ERR_UNAUTHORIZED,
          because a wrong role is answered before a conflicted identity.
        test_recipe:
          setup: >-
            Canonical event with a one-component BRONZE package, unpriced.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
          trigger:
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v1: "$.data.version", by1: "$.data.priced_by_user_id" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${v1}" }, as: CommercialManager, as_user_id: u_pricer, captures: { e_both: "$.data.error_id" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${v1}" }, as: CommercialDirector, as_user_id: u_pricer, captures: { e_sod: "$.data.error_id" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${v1}" }, as: CommercialDirector, as_user_id: u_director, captures: { st_pub: "$.data.package_status", pub_by: "$.data.published_by_user_id", v2: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialDirector, as_user_id: u_director, captures: { v3: "$.data.version", by3: "$.data.priced_by_user_id", st3: "$.data.package_status", pub3: "$.data.published_by_user_id" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${v3}" }, as: CommercialDirector, as_user_id: u_director, captures: { e_sod2: "$.data.error_id" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${v3}" }, as: CommercialDirector, as_user_id: u_pricer, captures: { st_pub2: "$.data.package_status", pub_by2: "$.data.published_by_user_id" } }
          assert: >-
            Pricing stamps the hand: ${by1} == "u_pricer".
            That hand publishing under its own role violates rows 2 and 51
            simultaneously and hears the lower one: 403 with
            ${e_both} == "ERR_UNAUTHORIZED".
            The same hand wearing the director role clears row 2 and lands on
            row 51: 403 with ${e_sod} == "ERR_SEGREGATION_OF_DUTIES".
            A different hand in the director role succeeds:
            ${st_pub} == "PUBLISHED", ${pub_by} == "u_director",
            ${v2} == ${v1} + 1.
            Re-pricing as that same director moves the disqualification with the
            stamp: ${st3} == "PRICED", ${by3} == "u_director",
            ${pub3} == null and ${v3} == ${v2} + 1. He is now barred from his own
            exclusive verb — 403 with ${e_sod2} == "ERR_SEGREGATION_OF_DUTIES" —
            while u_pricer, refused at the top of this recipe, may now publish:
            ${st_pub2} == "PUBLISHED" with ${pub_by2} == "u_pricer".

      - name: the_portal_identity_is_confined_to_the_rows_that_trace_back_to_it
        claim_type: exclusive_operations
        grounds: >-
          §1.7 roles.ClientPortalUser (identity "entity_backed:Client",
          exclusive_operations [], shared_operations
          ["POST /payment-installments/{id}/pay", "POST /bookings/{id}/cancel",
          "GET /clients/{id}", "GET /bookings/{id}", ...]);
          validations[priority=3] -> ERR_CLIENT_SCOPE_VIOLATION 403 applying to
          "GET /clients/{id}, GET /bookings/{id}, GET /payment-installments/{id},
          POST /payment-installments/{id}/pay, POST /bookings/{id}/cancel".
        distinguishing_aspect: >-
          This role's boundary is data-shaped rather than verb-shaped: it holds no
          exclusive verb at all, every endpoint it can reach is shared with a
          staff role, and what is exclusive to it is the SET OF ROWS — its own
          client, bookings and installments. Two clients with identical bookings
          make the scope the only discriminator, and the portal user is shown to
          be refused on rows it can perfectly well describe (it knows the id) as
          well as on the staff-only list endpoint, where the refusal is
          ERR_UNAUTHORIZED instead because the endpoint is outside its matrix row.
        test_recipe:
          setup: >-
            Simple pricing fixture (no rights deal) with two clients, one 5-unit
            CORPORATE booking each; the portal user authenticates as client A.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { clA: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "Vantage Partners", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { clB: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${clA}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bkA: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${clB}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bkB: "$.data.id" } }
            - { call: "GET /payment-installments", payload: { booking_id: "${bkB}", limit: 10, offset: 0 }, as: FinanceController, as_user_id: u_fin, captures: { piB: "$.data[0].id", piB_amt: "$.data[0].amount_cents" } }
          trigger:
            - { call: "GET /clients/${clA}", payload: {}, as: ClientPortalUser, as_user_id: "${clA}", captures: { own_cl: "$.data.id" } }
            - { call: "GET /bookings/${bkA}", payload: {}, as: ClientPortalUser, as_user_id: "${clA}", captures: { own_bk: "$.data.id", own_bk_cl: "$.data.client_id" } }
            - { call: "GET /clients/${clB}", payload: {}, as: ClientPortalUser, as_user_id: "${clA}", captures: { e_cl: "$.data.error_id" } }
            - { call: "GET /bookings/${bkB}", payload: {}, as: ClientPortalUser, as_user_id: "${clA}", captures: { e_bk: "$.data.error_id" } }
            - { call: "GET /payment-installments/${piB}", payload: {}, as: ClientPortalUser, as_user_id: "${clA}", captures: { e_pi: "$.data.error_id" } }
            - { call: "POST /payment-installments/${piB}/pay", payload: { amount_cents_paid: "${piB_amt}" }, as: ClientPortalUser, as_user_id: "${clA}", captures: { e_pay: "$.data.error_id" } }
            - { call: "POST /bookings/${bkB}/cancel", payload: {}, as: ClientPortalUser, as_user_id: "${clA}", captures: { e_cancel: "$.data.error_id" } }
            - { call: "GET /bookings", payload: { limit: 10, offset: 0 }, as: ClientPortalUser, as_user_id: "${clA}", captures: { e_list: "$.data.error_id" } }
            - { call: "GET /bookings/${bkB}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { staff_bk: "$.data.id" } }
          assert: >-
            Its own rows are readable: ${own_cl} == "${clA}" and
            ${own_bk} == "${bkA}" with ${own_bk_cl} == "${clA}".
            Every row belonging to the other client is refused with 403 and the
            scope error, on reads and on writes alike:
            ${e_cl} == ${e_bk} == ${e_pi} == ${e_pay} == ${e_cancel} ==
            "ERR_CLIENT_SCOPE_VIOLATION". Note ${e_pay} is the scope error and
            NOT ERR_INSTALLMENT_AMOUNT_MISMATCH even though the amount was
            correct, and ${e_cancel} is the scope error and not a state error —
            priority 3 precedes every business row.
            The staff-only collection endpoint is a different refusal:
            ${e_list} == "ERR_UNAUTHORIZED" (403), because ClientPortalUser is
            absent from GET /bookings' role list — outside the matrix row is
            row 2, inside-but-not-yours is row 3.
            The rows themselves are fine for staff: ${staff_bk} == "${bkB}".

  # ===========================================================================
  # §1.9 — cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: two_bookings_race_for_the_same_block_and_the_loser_must_re_read
        claim_type: optimistic_concurrency
        grounds: >-
          §1.2.1 concurrency_rules[rule_id=allocate-against-stale-block]
          (parent AllocationBlock, write_endpoint "POST /bookings/{id}/allocate",
          occ_field "expected_allocation_block_version",
          error ERR_STALE_BLOCK_VERSION 412); endpoints
          "POST /bookings/{id}/allocate" side effect "increments
          AllocationBlock.version by 1".
        distinguishing_aspect: >-
          This is the rule's own scenario: both writers are legitimate — the block
          has 40 free units and each booking wants 5 — so NO state precondition
          separates them and only the version does. The losing call is then
          replayed byte-for-byte except for a freshly read version and succeeds,
          which distinguishes OCC from a lock, a duplicate guard or an
          availability check, and the refusal is shown to have left both the
          booking and the block untouched.
        test_recipe:
          setup: >-
            Canonical event, a 40-unit deal fully released into a CORPORATE block
            of target 40, a published BRONZE package and two 5-unit CORPORATE
            bookings, neither allocated.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_id: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { clA: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "Vantage Partners", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { clB: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${clA}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bkA: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${clB}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bkB: "$.data.id" } }
          trigger:
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v0: "$.data.version", c0: "$.data.committed_units" } }
            - { call: "POST /bookings/${bkA}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${v0}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { a_st: "$.data.fulfillment_status", a_blk: "$.data.allocation_block_id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v1: "$.data.version", c1: "$.data.committed_units" } }
            - { call: "POST /bookings/${bkB}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${v0}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { e_stale: "$.data.error_id" } }
            - { call: "GET /bookings/${bkB}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { b_st_mid: "$.data.fulfillment_status", b_blk_mid: "$.data.allocation_block_id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v1b: "$.data.version", c1b: "$.data.committed_units" } }
            - { call: "POST /bookings/${bkB}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${v1b}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b_st: "$.data.fulfillment_status", b_blk: "$.data.allocation_block_id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v2: "$.data.version", c2: "$.data.committed_units" } }
          assert: >-
            The first writer wins with the version it read: ${a_st} ==
            "ALLOCATED", ${a_blk} == "${blk_id}", and the parent moved —
            ${v1} == ${v0} + 1 with ${c1} == ${c0} + 5 == 5.
            The second writer, holding the same ${v0}, is refused with 412 and
            ${e_stale} == "ERR_STALE_BLOCK_VERSION" even though 35 units are
            free: nothing about ITS request was invalid.
            The refusal was total: ${b_st_mid} == "RESERVED" with
            ${b_blk_mid} == null, and the block is unmoved —
            ${v1b} == ${v1} and ${c1b} == 5.
            Replayed against the fresh version the identical intent succeeds:
            ${b_st} == "ALLOCATED", ${b_blk} == "${blk_id}",
            ${v2} == ${v1b} + 1 and ${c2} == 10 — the version increments on
            every successful write, once per write.

      - name: a_second_tranche_confirmation_needs_the_version_the_first_one_produced
        claim_type: optimistic_concurrency
        grounds: >-
          §1.2.1 concurrency_rules[rule_id=confirm-tranche-against-stale-deal]
          (parent RightsDeal, write_endpoint
          "POST /release-tranches/{id}/confirm", occ_field
          "expected_rights_deal_version", error ERR_STALE_DEAL_VERSION 412);
          endpoints "POST /release-tranches/{id}/confirm" side effect
          "increments RightsDeal.version by 1".
        distinguishing_aspect: >-
          The OCC field names the PARENT deal while the path names the CHILD
          tranche, so the stale token is not the version of the row being written
          — an implementation that versions the tranche instead of the deal passes
          the happy path and fails here. Two sibling tranches on one deal are both
          in the legal PENDING state, so again only the version separates them,
          and the 412 is shown to leave the second tranche PENDING with the deal's
          released_units frozen at the first confirmation's value.
        test_recipe:
          setup: >-
            Canonical event with a COMMITTED 40-unit deal (guaranteed_minimum 20,
            unit_cost 8000) carrying two PENDING tranches of 20 units each.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 20, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr1: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 20, promised_release_at: "2026-11-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr2: "$.data.id" } }
          trigger:
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dv0: "$.data.version", rel0: "$.data.released_units" } }
            - { call: "POST /release-tranches/${tr1}/confirm", payload: { confirmed_units: 20, expected_rights_deal_version: "${dv0}" }, as: RightsManager, as_user_id: u_rights, captures: { t1_st: "$.data.tranche_state", t1_conf: "$.data.confirmed_units" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dv1: "$.data.version", rel1: "$.data.released_units", st1: "$.data.deal_status" } }
            - { call: "POST /release-tranches/${tr2}/confirm", payload: { confirmed_units: 20, expected_rights_deal_version: "${dv0}" }, as: RightsManager, as_user_id: u_rights, captures: { e_stale: "$.data.error_id" } }
            - { call: "GET /release-tranches/${tr2}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { t2_st_mid: "$.data.tranche_state", t2_conf_mid: "$.data.confirmed_units" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dv1b: "$.data.version", rel1b: "$.data.released_units" } }
            - { call: "POST /release-tranches/${tr2}/confirm", payload: { confirmed_units: 20, expected_rights_deal_version: "${dv1b}" }, as: RightsManager, as_user_id: u_rights, captures: { t2_st: "$.data.tranche_state" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dv2: "$.data.version", rel2: "$.data.released_units", st2: "$.data.deal_status" } }
          assert: >-
            First confirmation with the read version succeeds: ${t1_st} ==
            "CONFIRMED", ${t1_conf} == 20, and the PARENT moved —
            ${dv1} == ${dv0} + 1, ${rel1} == 20 (from ${rel0} == 0) and
            ${st1} == "PARTIALLY_RELEASED".
            The sibling tranche, confirmed against the pre-existing ${dv0}, is
            refused with 412 and ${e_stale} == "ERR_STALE_DEAL_VERSION" — the
            stale token belongs to the deal, not to the tranche in the path.
            Nothing moved: ${t2_st_mid} == "PENDING" with
            ${t2_conf_mid} == null, ${dv1b} == ${dv1} and ${rel1b} == 20.
            With the version the first write produced it goes through:
            ${t2_st} == "CONFIRMED", ${dv2} == ${dv1b} + 1, ${rel2} == 40 and
            ${st2} == "FULLY_RELEASED".

      - name: a_re_price_invalidates_the_exact_price_the_director_was_approving
        claim_type: optimistic_concurrency
        grounds: >-
          §1.2.1 concurrency_rules[rule_id=publish-stale-package-price] (parent
          PackageProduct, write_endpoint "POST /package-products/{id}/publish",
          occ_field "expected_package_product_version", error
          ERR_STALE_PACKAGE_VERSION 412); state_machines.PackageProduct
          PRICED -> PRICED self-loop ("also bumps version, which is what the
          publish OCC check observes").
        distinguishing_aspect: >-
          Here the version moves through a SELF-LOOP: the package's status is
          PRICED before and after the re-price, so status is identical and only the
          version differs — an implementation that guards publish on status alone
          approves a margin nobody reviewed. The recipe makes the two prices
          materially different (120000 vs 220000 list) so the stale approval would
          have published a stale number, and confirms that the 412 outranks the
          403 the same actor would earn on a body carrying the fresh version.
        test_recipe:
          setup: >-
            Canonical event with a COMMITTED TICKET deal (so publish's rights
            precondition holds) and a PRICED one-component BRONZE package priced
            by u_pricer.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pv0: "$.data.version", list0: "$.data.list_price_cents" } }
          trigger:
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Trophy-room access", quantity: 1, unit_cost_cents: 50000, markup_pct: 1.0000, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pv1: "$.data.version", list1: "$.data.list_price_cents", st1: "$.data.package_status" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pv0}" }, as: CommercialDirector, as_user_id: u_director, captures: { e_stale: "$.data.error_id" } }
            - { call: "GET /package-products/${pkg_id}", payload: {}, as: CommercialDirector, as_user_id: u_director, captures: { st_mid: "$.data.package_status", pv_mid: "$.data.version", pub_mid: "$.data.published_by_user_id", list_mid: "$.data.list_price_cents" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pv1}" }, as: CommercialDirector, as_user_id: u_director, captures: { st_ok: "$.data.package_status", pv2: "$.data.version", list_ok: "$.data.list_price_cents" } }
          assert: >-
            The re-price is a self-loop that still moves the token:
            ${st1} == "PRICED" (unchanged), ${pv1} == ${pv0} + 1, and the number
            under approval really did change — ${list0} == 120000 while
            ${list1} == 220000.
            Publishing the reviewed-but-superseded version is refused with 412 and
            ${e_stale} == "ERR_STALE_PACKAGE_VERSION"; status alone would have
            admitted it.
            The refusal left no trace: ${st_mid} == "PRICED",
            ${pv_mid} == ${pv1}, ${pub_mid} == null and
            ${list_mid} == 220000.
            Carrying the current version publishes exactly the reviewed figure:
            ${st_ok} == "PUBLISHED", ${list_ok} == 220000 and
            ${pv2} == ${pv1} + 1.

      - name: the_guarantee_surcharge_rate_steps_exactly_at_its_two_money_thresholds
        claim_type: rate_threshold_triggers
        grounds: >-
          calculations.booking_net_price step 5 (GUARANTEE_SURCHARGE_PCT: ">=
          5000000 -> 0.0200, >= 1000000 -> 0.0350, else 0.0500", keyed on
          discounted_subtotal_cents and applied only when deal_exposure holds);
          calculations.booking_net_price step 4
          (CHANNEL_COMMISSION_PCT[CORPORATE] = 0.0300).
        distinguishing_aspect: >-
          The threshold is INSTANTANEOUS on money and the ladder runs DOWNWARD —
          a larger subtotal attracts a smaller rate — so an implementation that
          copies the usual "bigger means more" direction, or that uses > instead
          of >=, inverts two of the three answers. The three bookings differ by a
          single cent of list price at the 1000000 boundary (999999 vs 1000000),
          which is where an exclusive comparison shows up, and every unit count is
          1 so the volume ladder contributes nothing and the surcharge is the only
          moving part.
        test_recipe:
          setup: >-
            Canonical event with a COMMITTED 40-unit TICKET deal and zero released
            units, so deal_exposure holds for every booking; three published
            BRONZE packages of one ticket each, listing 999999, 1000000 and
            5000000 cents (BRONZE multiplier 1.00 so list == the single rounded
            line); one CORPORATE client with a 50000000 credit limit.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { d_st: "$.data.deal_status" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Just Under", tier: "BRONZE", tickets_per_package: 1, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { p_lo: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${p_lo}", component_type: "TICKET", descriptor: "Halfway-line single", quantity: 1, unit_cost_cents: 333333, markup_pct: 2.0000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${p_lo}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v_lo: "$.data.version", list_lo: "$.data.list_price_cents" } }
            - { call: "POST /package-products/${p_lo}/publish", payload: { expected_package_product_version: "${v_lo}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Exactly One Million", tier: "BRONZE", tickets_per_package: 1, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { p_mid: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${p_mid}", component_type: "TICKET", descriptor: "Directors' box single", quantity: 1, unit_cost_cents: 500000, markup_pct: 1.0000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${p_mid}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v_mid: "$.data.version", list_mid: "$.data.list_price_cents" } }
            - { call: "POST /package-products/${p_mid}/publish", payload: { expected_package_product_version: "${v_mid}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Exactly Five Million", tier: "BRONZE", tickets_per_package: 1, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { p_hi: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${p_hi}", component_type: "TICKET", descriptor: "Presidential suite single", quantity: 1, unit_cost_cents: 2500000, markup_pct: 1.0000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${p_hi}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v_hi: "$.data.version", list_hi: "$.data.list_price_cents" } }
            - { call: "POST /package-products/${p_hi}/publish", payload: { expected_package_product_version: "${v_hi}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
          trigger:
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${p_lo}", channel: "CORPORATE", units: 1 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { lo_gross: "$.data.gross_price_cents", lo_vol: "$.data.volume_discount_pct", lo_ds: "$.data.discounted_subtotal_cents", lo_comm: "$.data.partner_commission_cents", lo_sur: "$.data.guarantee_surcharge_cents", lo_net: "$.data.net_price_cents" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${p_mid}", channel: "CORPORATE", units: 1 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { mid_ds: "$.data.discounted_subtotal_cents", mid_comm: "$.data.partner_commission_cents", mid_sur: "$.data.guarantee_surcharge_cents", mid_net: "$.data.net_price_cents" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${p_hi}", channel: "CORPORATE", units: 1 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { hi_ds: "$.data.discounted_subtotal_cents", hi_comm: "$.data.partner_commission_cents", hi_sur: "$.data.guarantee_surcharge_cents", hi_net: "$.data.net_price_cents" } }
          assert: >-
            The fixture is exposed and the three list prices land on the boundary
            exactly: ${d_st} == "COMMITTED", ${list_lo} == 999999,
            ${list_mid} == 1000000, ${list_hi} == 5000000.
            One unit means the volume ladder is silent: ${lo_gross} == 999999
            and ${lo_vol} == 0.0000, so ${lo_ds} == 999999.
            Just under the first threshold the HIGHEST rate applies:
            ${lo_sur} == 50000 (round_half_up(999999 * 0.0500) = 50000) with
            ${lo_comm} == 30000 and
            ${lo_net} == 1019999 == 999999 - 30000 + 50000.
            One cent higher crosses it and the rate DROPS: ${mid_ds} == 1000000,
            ${mid_sur} == 35000 (0.0350, not 0.0500), ${mid_comm} == 30000 and
            ${mid_net} == 1005000.
            At the upper threshold it drops again: ${hi_ds} == 5000000,
            ${hi_sur} == 100000 (0.0200), ${hi_comm} == 150000 and
            ${hi_net} == 4950000.
            Both comparisons are inclusive: a one-cent step produced a
            15000-cent swing in the surcharge, and the 5000000 case took 0.0200
            rather than 0.0350.

      - name: nothing_rolls_over_until_the_operations_run_says_so
        claim_type: scheduled_actions
        grounds: >-
          complexity_profile.complexity_layers includes ops_run_checkpoint;
          endpoints "POST /operations/daily-run" ("the only checkpoint at which
          time-driven transitions are applied"); state_machines.ReleaseTranche
          PENDING -> LAPSED trigger "POST /operations/daily-run" and
          PaymentInstallment SCHEDULED -> OVERDUE trigger
          "POST /operations/daily-run"; state_machines.Client credit band driven
          only by the sweep.
        distinguishing_aspect: >-
          The claim is that the logical clock ALONE never changes a row: the fixture
          is left five weeks past a promised release and a month past a due date
          and every affected row is re-read and shown untouched, which fails any
          implementation that derives lateness on read (a computed "is_overdue" or
          a lazy transition inside GET). The sweep is then run once and the same
          reads flip, and a further clock advance without a run changes nothing
          more — so the checkpoint, not the timestamp comparison, is the trigger.
          Registration of the future obligation at creation time is asserted too:
          the tranche is PENDING with its promised date, and the installments are
          SCHEDULED with dates derived from the event, before any time passes.
        test_recipe:
          setup: >-
            Canonical event with a COMMITTED 40-unit deal (guaranteed_minimum 20,
            unit_cost 8000) carrying one 20-unit tranche promised for
            2026-09-01, a published BRONZE package, and one 5-unit CORPORATE
            booking whose first installment falls due 2026-08-04. Because the
            deal is exposed, the booking nets 587520 (ds 576000, commission
            17280, surcharge 28800) and its schedule is 176256 / 235008 / 176256.
