      - name: due_date_not_after_checkout_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUE_DATE_INVALID]"]
        distinguishing_aspect: "due_date equal to or before the current clock (2026-08-01T00:00:00Z default) → ERR_DUE_DATE_INVALID."
        test_recipe:
