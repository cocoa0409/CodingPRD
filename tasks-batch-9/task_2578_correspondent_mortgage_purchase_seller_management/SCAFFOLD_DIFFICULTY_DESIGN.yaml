          - calculations.commitment_price_pct
        distinguishing_aspect: |
          The identical lock request is rejected and then accepted with no change
          to its own payload: the deciding factor lives on a different entity
          (Seller.delivery_standing SUSPENDED vs GOOD_STANDING). The first call
          returns ERR_SELLER_DELIVERY_SUSPENDED, the second returns 201 with
