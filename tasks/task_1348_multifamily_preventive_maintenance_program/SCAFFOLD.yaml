scenario: |
  Multifamily Preventive Maintenance Program (multifamily asset services): asset register (HVAC/water heater/appliance) with age & warranty, PM task library & frequency by component, unit-entry scheduling in batches & resident notice, filter/detector/battery replacement compliance evidence, deficiency conversion to corrective work order, budget & labor hour planning, capital replacement forecasting from PM findings, completion audit

domain_name: multifamily-pm
api_prefix: /pm

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: property_code
        type: string
        source: input
        description: "Unique human-readable property code (e.g. 'MAPLE-01')"
        constraints: "Unique across all properties; immutable after creation"
      - name: display_name
        type: string
        source: input
        description: "Property display name"
      - name: notice_lead_hours
        type: integer
        source: input
        description: "Minimum hours of resident notice required before any unit entry at this property"
        constraints: "Must be >= 24"
      - name: default_labor_rate_cents_per_hour
        type: integer
        source: input
        description: "Default blended labor rate in cents per hour, used for every visit cost at this property"
        constraints: "Must be > 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | ARCHIVED"
        constraints: "Archived properties reject all child mutations"

  - name: Building
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; owning property"
      - name: building_label
        type: string
        source: input
        description: "Building label (e.g. 'A', 'Tower 2')"
      - name: floors
        type: integer
        source: input
        description: "Number of floors"
        constraints: "Must be >= 1"

  - name: Unit
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: "FK -> Building.id; owning building"
      - name: unit_number
        type: string
        source: input
        description: "Unit number within the building"
        constraints: "Unique within building"
      - name: occupancy_status
        type: enum
        source: input
        description: "OCCUPIED | VACANT"
        constraints: "VACANT units skip resident-notice lead-time enforcement on entry scheduling"

  - name: Asset
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit the asset is installed in"
      - name: component_type
        type: enum
        source: input
        description: "HVAC | WATER_HEATER | APPLIANCE"
      - name: installed_on
        type: datetime
        source: input
        description: "Installation date (ISO8601 date, UTC)"
      - name: warranty_months
        type: integer
        source: input
        description: "Manufacturer warranty length in months from installed_on"
        constraints: "Must be >= 0"
      - name: expected_life_months
        type: integer
        source: input
        description: "Expected useful life in months from installed_on"
        constraints: "Must be > 0 and >= warranty_months"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: "Estimated like-for-like replacement cost in cents"
        constraints: "Must be > 0"
      - name: condition_score
        type: integer
        source: system
        description: "Latest technician condition score 1-5 (5 = like new); null until first completed PM visit records one"
        constraints: "When set, must be between 1 and 5 inclusive"
      - name: age_months
        type: integer
        source: computed
        description: "Whole months elapsed between installed_on and the current logical clock; computed on read via asset_age calculation"
      - name: warranty_active
        type: boolean
        source: computed
        description: "true iff age_months < warranty_months at current logical clock; see asset_age calculation"
      - name: operational_status
        type: enum
        source: system
        description: "IN_SERVICE | OUT_OF_SERVICE | DECOMMISSIONED (parallel dimension 1)"
      - name: compliance_status
        type: enum
        source: system
        description: "COMPLIANT | DUE | OVERDUE | NON_COMPLIANT (parallel dimension 2, driven by PM schedule vs clock)"
      - name: superseded_by_asset_id
        type: string
        source: system
        description: "FK -> Asset.id; set when this asset is replaced via a corrective work order; null otherwise (self-referential link)"

  - name: PMTaskTemplate
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; property whose library this template belongs to"
      - name: component_type
        type: enum
        source: input
        description: "HVAC | WATER_HEATER | APPLIANCE"
      - name: task_name
        type: string
        source: input
        description: "Human-readable task name (e.g. 'Replace HVAC filter')"
      - name: frequency_days
        type: integer
        source: input
        description: "Interval between required completions of this task"
        constraints: "Must be >= 1"
      - name: estimated_labor_minutes
        type: integer
        source: input
        description: "Standard labor minutes per execution of this task"
        constraints: "Must be > 0"
      - name: requires_evidence
        type: boolean
        source: input
        description: "If true, a PMVisit completing this task must carry at least one ComplianceEvidence row"
      - name: effective_from
        type: datetime
        source: input
        description: "Date from which this template version applies (ISO8601 date, UTC)"
      - name: retired_at
        type: datetime
        source: system
        description: "Null while the template is current; set when the template is retired (soft delete)"

  - name: PMPlan
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; property this plan funds"
      - name: plan_year
        type: integer
        source: input
        description: "Calendar year this plan covers (e.g. 2027)"
      - name: budget_cents
        type: integer
        source: input
        description: "Total approved maintenance budget for the plan year, in cents"
        constraints: "Must be > 0"
      - name: planned_labor_hours
        type: integer
        source: computed
        description: "Ceiling of sum of estimated labor minutes across all non-cancelled visits under this plan, divided by 60; see labor_hour_aggregation (plan variant)"
      - name: actual_labor_minutes
        type: integer
        source: computed
        description: "Sum of technician-recorded minutes across COMPLETED visits under this plan; see labor_hour_aggregation (actual variant)"
      - name: committed_cents
        type: integer
        source: computed
        description: "Outstanding committed cents (commits minus releases) charged to this plan; see budget_burn"
      - name: spent_cents
        type: integer
        source: computed
        description: "Settled actual cents for COMPLETED visits and COMPLETED corrective work orders, net of fail-verification clawbacks; see budget_burn"
      - name: status
        type: enum
        source: system
        description: "DRAFT | ADOPTED | CLOSED"

  - name: EntryBatch
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; property whose units this batch enters"
      - name: batch_label
        type: string
        source: input
        description: "Human label (e.g. 'June HVAC sweep')"
      - name: window_start
        type: datetime
        source: input
        description: "Earliest entry datetime of the batch window (ISO8601, UTC, minute precision)"
      - name: window_end
        type: datetime
        source: input
        description: "Latest entry datetime of the batch window (ISO8601, UTC, minute precision); must be > window_start"
      - name: status
        type: enum
        source: system
        description: "DRAFT | PUBLISHED | LOCKED | EXECUTED | CANCELLED"
      - name: notice_sent_at
        type: datetime
        source: system
        description: "Timestamp when resident notices were dispatched (set on publish); null while DRAFT"

  - name: PMVisit
    parent: EntryBatch
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> EntryBatch.id; batch this visit is scheduled under"
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit to be entered"
      - name: template_id
        type: string
        source: input
        description: "FK -> PMTaskTemplate.id; task being performed"
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; asset serviced; its component_type must equal the template's component_type"
      - name: plan_id
        type: string
        source: input
        description: "FK -> PMPlan.id; plan this visit's cost and labor roll up to"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned entry datetime; must lie within the batch [window_start, window_end) half-open interval"
      - name: technician_id
        type: string
        source: input
        description: "Opaque id of the assigned Technician (must equal X-User-ID at start/complete/no-access time)"
      - name: actual_minutes
        type: integer
        source: input
        description: "Technician-recorded labor minutes at completion; required to complete"
        constraints: "Must be > 0"
      - name: condition_score_recorded
        type: integer
        source: input
        description: "Condition score 1-5 recorded for the asset at completion; required to complete"
        constraints: "1..5"
      - name: visit_status
        type: enum
        source: system
        description: "SCHEDULED | NOTIFIED | IN_PROGRESS | COMPLETED | NO_ACCESS | CANCELLED"
      - name: visit_cost_cents
        type: integer
        source: computed
        description: "Cost of this visit = round_half_up(actual_minutes * property.default_labor_rate_cents_per_hour / 60); 0 until COMPLETED"

  - name: ComplianceEvidence
    parent: PMVisit
    common_fields: false
    fields:
      - name: visit_id
        type: string
        source: system
        description: "FK -> PMVisit.id; visit this evidence is attached to (path parent)"
      - name: evidence_type
        type: enum
        source: input
        description: "FILTER_REPLACEMENT | DETECTOR_TEST | BATTERY_REPLACEMENT"
      - name: serial_or_lot
        type: string
        source: input
        description: "Serial or lot number of the consumable installed/tested"
      - name: notes
        type: string
        source: input
        description: "Free-text evidence note"
        default: ""
      - name: recorded_by
        type: string
        source: system
        description: "X-User-ID of the Technician who recorded the evidence (audit trail)"

  - name: Deficiency
    parent: PMVisit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: system
        description: "FK -> PMVisit.id; visit during which the deficiency was found (path parent)"
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; asset the deficiency was observed on (must equal the visit's asset_id)"
      - name: severity
        type: enum
        source: input
        description: "LOW | MEDIUM | HIGH | EMERGENCY"
      - name: description
        type: string
        source: input
        description: "Free-text description of the deficiency"
      - name: status
        type: enum
        source: system
        description: "RECORDED | TRIAGED | CONVERTED | WAIVED"
      - name: work_order_id
        type: string
        source: system
        description: "FK -> CorrectiveWorkOrder.id; null until converted (1:1 — a deficiency converts to at most one work order)"

  - name: CorrectiveWorkOrder
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; denormalized from the deficiency's visit's batch for query"
      - name: deficiency_id
        type: string
        source: input
        description: "FK -> Deficiency.id; originating deficiency"
      - name: plan_id
        type: string
        source: input
        description: "FK -> PMPlan.id; plan this work order charges against"
      - name: asset_id
        type: string
        source: system
        description: "FK -> Asset.id; asset being corrected (copied from deficiency.asset_id at creation)"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: "Supervisor estimate of correction cost in cents"
        constraints: "Must be > 0"
      - name: actual_cost_cents
        type: integer
        source: input
        description: "Actual cost in cents recorded at completion; required to complete"
        constraints: "Must be >= 0"
      - name: assigned_technician_id
        type: string
        source: input
        description: "Opaque id of technician assigned to perform the work"
      - name: replace_asset
        type: boolean
        source: input
        description: "If true, completing this work order decommissions the old asset and links its replacement"
        default: false
      - name: status
        type: enum
        source: system
        description: "OPEN | IN_REVIEW | APPROVED | IN_PROGRESS | COMPLETED | VERIFIED | REJECTED"
      - name: revision_count
        type: integer
        source: system
        description: "Number of times this work order has been sent back IN_REVIEW -> OPEN (rework cycle counter)"

  - name: BudgetLedgerEntry
    parent: PMPlan
    common_fields: false
    fields:
      - name: plan_id
        type: string
        source: system
        description: "FK -> PMPlan.id; plan this entry debits/credits"
      - name: entry_kind
        type: enum
        source: system
        description: "VISIT_COMMIT | VISIT_SETTLE | VISIT_RELEASE | WO_COMMIT | WO_SETTLE | WO_RELEASE"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed cents; positive commits/debits, negative releases/credits"
      - name: source_visit_id
        type: string
        source: system
        description: "FK -> PMVisit.id; set when entry_kind is VISIT_*; null otherwise"
      - name: source_work_order_id
        type: string
        source: system
        description: "FK -> CorrectiveWorkOrder.id; set when entry_kind is WO_*; null otherwise"
      - name: memo
        type: string
        source: system
        description: "System-generated memo describing the ledger event"

  - name: CapitalForecastSnapshot
    parent: Property
    common_fields: false
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; property whose assets are forecast"
      - name: horizon_years
        type: integer
        source: input
        description: "Forecast horizon in years (e.g. 5)"
        constraints: "Must be between 1 and 10 inclusive"
      - name: variant
        type: enum
        source: input
        description: "AGE_BASED | CONDITION_BASED; which capital_replacement_forecast variant to run"
      - name: total_projected_cents
        type: integer
        source: computed
        description: "Total projected replacement spend across the horizon; output of capital_replacement_forecast"
      - name: per_year_cents
        type: array
        source: computed
        description: "Array of horizon_years integers, projected cents per year index 0..horizon-1; output of capital_replacement_forecast"
      - name: asset_count_projected
        type: integer
        source: computed
        description: "Number of assets projected to require replacement within the horizon"
      - name: computed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the snapshot was computed"

  - name: CompletionAudit
    parent: PMVisit
    common_fields: false
    fields:
      - name: visit_id
        type: string
        source: system
        description: "FK -> PMVisit.id; exactly one audit per visit (1:1, path parent)"
      - name: auditor_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceAuditor performing the audit; MUST differ from the visit's technician_id (segregation of duties)"
      - name: outcome
        type: enum
        source: input
        description: "PASS | FAIL"
      - name: fail_reason
        type: string
        source: input
        description: "Required when outcome=FAIL; explains the compliance failure"
      - name: audited_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the audit"

# =============================================================================
# Table 2: State Machine Table (6 machines)
# =============================================================================
state_machines:
  - entity: PMVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: NOTIFIED
        trigger: "POST /pm/batches/{batch_id}/publish (cascade from EntryBatch publish)"
        actor: system
        preconditions:
          - "Parent batch transitions DRAFT -> PUBLISHED"
        side_effects:
          - "visit becomes NOTIFIED; notice implied by batch.notice_sent_at"
      - from: NOTIFIED
        to: IN_PROGRESS
        trigger: "POST /pm/visits/{visit_id}/start"
        actor: Technician
        preconditions:
          - "Current logical clock >= scheduled_start (ERR_VISIT_TOO_EARLY)"
          - "If unit.occupancy_status == OCCUPIED: current logical clock >= batch.notice_sent_at + property.notice_lead_hours (ERR_NOTICE_LEAD_VIOLATION)"
          - "visit.technician_id == X-User-ID of caller (ERR_NOT_ASSIGNED_TECHNICIAN folded into ERR_INSUFFICIENT_PERMISSIONS at priority 2 scope check)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /pm/visits/{visit_id}/complete"
        actor: Technician
        preconditions:
          - "Payload actual_minutes > 0 and condition_score_recorded in 1..5 (ERR_INVALID_REQUEST)"
          - "If template.requires_evidence: at least one ComplianceEvidence row exists for this visit (ERR_EVIDENCE_REQUIRED)"
        side_effects:
          - "visit.actual_minutes and condition_score_recorded persisted; visit_cost_cents computed via budget_burn"
          - "Ledger: VISIT_SETTLE(-committed estimate) then VISIT_SETTLE(+actual cost) on plan_id"
          - "Asset.condition_score := condition_score_recorded"
          - "Recompute Asset.compliance_status via next_due_date (asset's last completed visit for its template advanced)"
          - "Recompute plan.actual_labor_minutes and plan.spent_cents and plan.committed_cents"
          - "If every non-CANCELLED visit in the batch is terminal (COMPLETED or NO_ACCESS): batch -> EXECUTED"
      - from: [SCHEDULED, NOTIFIED]
        to: CANCELLED
        trigger: "POST /pm/visits/{visit_id}/cancel"
        actor: PropertyManager
        preconditions:
          - "Containing batch not LOCKED, EXECUTED, or CANCELLED (ERR_BATCH_NOT_MUTABLE)"
        side_effects:
          - "Ledger: VISIT_RELEASE(-committed estimate) on plan_id when the visit was committed (batch PUBLISHED)"
          - "Recompute plan.committed_cents"
      - from: NOTIFIED
        to: NO_ACCESS
        trigger: "POST /pm/visits/{visit_id}/no-access"
        actor: Technician
        preconditions:
          - "Current logical clock >= scheduled_start (ERR_VISIT_TOO_EARLY)"
          - "visit.technician_id == X-User-ID"
        side_effects:
          - "Ledger: VISIT_RELEASE(-committed estimate) on plan_id (no charge for failed entry)"
      - from: NO_ACCESS
        to: SCHEDULED
        trigger: "POST /pm/visits/{visit_id}/reschedule"
        actor: PropertyManager
        preconditions:
          - "Payload new_scheduled_start lies within target batch's [window_start, window_end) (ERR_VISIT_OUTSIDE_WINDOW)"
          - "Target batch status in {DRAFT, PUBLISHED} (ERR_BATCH_NOT_MUTABLE for LOCKED/EXECUTED/CANCELLED)"
          - "No interval overlap with another non-CANCELLED visit for the same unit (ERR_UNIT_ENTRY_OVERLAP)"
        side_effects:
          - "visit.batch_id := target_batch_id; visit.scheduled_start := new_scheduled_start"
          - "If target batch is PUBLISHED: visit enters NOTIFIED instead of SCHEDULED; Ledger: VISIT_COMMIT(+estimate) on plan_id"
          - "If target batch is DRAFT: visit enters SCHEDULED and commits at target batch publish"
          - "Cyclic loop: NOTIFIED -> NO_ACCESS -> SCHEDULED -> NOTIFIED allowed repeatedly"
    note: "Cyclic shape: NO_ACCESS -> SCHEDULED/NOTIFIED -> NO_ACCESS via reschedule; each loop releases and re-commits the budget estimate"

  - entity: CorrectiveWorkOrder
    initial_state: OPEN
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /pm/work-orders/{wo_id}/submit-review"
        actor: Technician
        preconditions:
          - "wo.assigned_technician_id == X-User-ID (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /pm/work-orders/{wo_id}/approve"
        actor: PropertyManager
        preconditions:
          - "plan.status == ADOPTED (ERR_PLAN_NOT_ADOPTED)"
          - "plan.committed_cents + wo.estimated_cost_cents <= plan.budget_cents (ERR_BUDGET_EXCEEDED; <= inclusive at boundary)"
        side_effects:
          - "Ledger: WO_COMMIT(+estimated_cost_cents) on plan_id"
          - "Recompute plan.committed_cents"
      - from: IN_REVIEW
        to: OPEN
        trigger: "POST /pm/work-orders/{wo_id}/return-rework"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "wo.revision_count += 1 (rework cycle OPEN -> IN_REVIEW -> OPEN)"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /pm/work-orders/{wo_id}/reject"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "Originating deficiency.status := TRIAGED (work order refused; deficiency falls back for re-handling)"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /pm/work-orders/{wo_id}/start"
        actor: Technician
        preconditions:
          - "wo.assigned_technician_id == X-User-ID"
        side_effects:
          - "asset.operational_status := OUT_OF_SERVICE (cross-entity cascade)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /pm/work-orders/{wo_id}/complete"
        actor: Technician
        preconditions:
          - "wo.assigned_technician_id == X-User-ID"
          - "Payload actual_cost_cents >= 0 (ERR_INVALID_REQUEST)"
          - "If wo.replace_asset: payload new_asset_id must reference an existing IN_SERVICE asset in the same unit (ERR_ASSET_NOT_FOUND / ERR_INVALID_STATE)"
        side_effects:
          - "Ledger: WO_RELEASE(-estimated_cost_cents) then WO_SETTLE(+actual_cost_cents) on plan_id"
          - "Recompute plan.committed_cents and plan.spent_cents"
          - "If wo.replace_asset: asset.operational_status := DECOMMISSIONED, asset.superseded_by_asset_id := payload.new_asset_id"
          - "Else: asset.operational_status := IN_SERVICE"
          - "Originating deficiency.status := CONVERTED (terminal)"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /pm/work-orders/{wo_id}/verify with outcome=PASS"
        actor: ComplianceAuditor
        preconditions:
          - "auditor X-User-ID != wo.assigned_technician_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: "POST /pm/work-orders/{wo_id}/verify with outcome=FAIL"
        actor: ComplianceAuditor
        preconditions:
          - "auditor X-User-ID != wo.assigned_technician_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Ledger: WO_RELEASE(-actual_cost_cents) on plan_id (clawback of settled spend)"
          - "Recompute plan.spent_cents and plan.committed_cents"
          - "asset.operational_status := OUT_OF_SERVICE"
          - "Originating deficiency.status := TRIAGED (reopened for re-completion)"
          - "Cyclic loop IN_PROGRESS -> COMPLETED -> IN_PROGRESS"
    note: "Branching with two cycles: rework loop (OPEN<->IN_REVIEW) and verification-failure loop (IN_PROGRESS->COMPLETED->IN_PROGRESS)"

  - entity: Asset
    initial_state: "operational_status=IN_SERVICE, compliance_status=COMPLIANT"
    terminal_states: ["operational_status=DECOMMISSIONED"]
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system (CorrectiveWorkOrder APPROVED -> IN_PROGRESS cascade) or POST /pm/assets/{asset_id}/operational-status with target_status=OUT_OF_SERVICE"
        actor: "system | PropertyManager"
        preconditions: []
        side_effects: []
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "system (CorrectiveWorkOrder IN_PROGRESS -> COMPLETED without replace_asset) or POST /pm/assets/{asset_id}/operational-status with target_status=IN_SERVICE"
        actor: "system | PropertyManager"
        preconditions: []
        side_effects: []
      - from: [IN_SERVICE, OUT_OF_SERVICE]
        to: DECOMMISSIONED
        trigger: "system (CorrectiveWorkOrder completion with replace_asset=true) or POST /pm/assets/{asset_id}/decommission"
        actor: "system | PropertyManager"
        preconditions:
          - "No CorrectiveWorkOrder in OPEN, IN_REVIEW, APPROVED, or IN_PROGRESS references this asset (ERR_ASSET_HAS_OPEN_WORK)"
        side_effects:
          - "Asset excluded from future PM scheduling and from capital_replacement_forecast input sets"
      - from: COMPLIANT
        to: DUE
        trigger: "system (next_due_date recomputation: clock within [next_due - DUE_SOON_WINDOW, next_due) and no SCHEDULED/NOTIFIED/IN_PROGRESS visit exists for the asset+template)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [COMPLIANT, DUE]
        to: OVERDUE
        trigger: "system (next_due_date recomputation: current logical clock >= next_due and no qualifying completed visit in window; >= inclusive)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DUE, OVERDUE, NON_COMPLIANT]
        to: COMPLIANT
        trigger: "system (PMVisit completion for this asset+template advances last_completed date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DUE, OVERDUE, COMPLIANT]
        to: NON_COMPLIANT
        trigger: "system (CompletionAudit with outcome=FAIL on the visit that serviced this asset)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NON_COMPLIANT
        to: OVERDUE
        trigger: "system (a later PMVisit for the same asset+template completes and its audit passes)"
        actor: system
        preconditions: []
        side_effects: []
    note: "Parallel dimensions: operational_status and compliance_status evolve independently on the same Asset row"

  - entity: EntryBatch
    initial_state: DRAFT
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /pm/batches/{batch_id}/publish"
        actor: PropertyManager
        preconditions:
          - "Batch has >= 1 non-CANCELLED visit (ERR_EMPTY_BATCH)"
          - "window_start > current logical clock (ERR_WINDOW_IN_PAST)"
          - "Every visit's scheduled_start lies within [window_start, window_end) (ERR_VISIT_OUTSIDE_WINDOW)"
          - "expected_batch_version == batch.version (ERR_STALE_VERSION)"
          - "Each visit's plan is ADOPTED (ERR_PLAN_NOT_ADOPTED) and each plan's committed_cents + newly committed estimates <= budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "batch.notice_sent_at := current logical clock; batch.version += 1"
          - "All SCHEDULED visits in batch -> NOTIFIED"
          - "Ledger: VISIT_COMMIT(+round_half_up(template.estimated_labor_minutes * property.default_labor_rate_cents_per_hour / 60)) per non-CANCELLED visit on each visit's plan_id"
          - "Recompute each affected plan.planned_labor_hours and committed_cents"
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /pm/batches/{batch_id}/lock"
        actor: PropertyManager
        preconditions:
          - "Current logical clock >= batch.window_start - 1 hour (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Visit cancel/reschedule into or within this batch rejected while LOCKED (ERR_BATCH_NOT_MUTABLE)"
      - from: [PUBLISHED, LOCKED]
        to: EXECUTED
        trigger: "system (every non-CANCELLED visit in the batch is terminal: COMPLETED or NO_ACCESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /pm/batches/{batch_id}/cancel"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "All SCHEDULED visits -> CANCELLED (no ledger entries exist while DRAFT, so no release needed)"

  - entity: PMPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /pm/plans/{plan_id}/adopt"
        actor: PropertyManager
        preconditions:
          - "No other plan for the same property_id + plan_year is in ADOPTED (ERR_DUPLICATE_ACTIVE_PLAN)"
        side_effects: []
      - from: ADOPTED
        to: CLOSED
        trigger: "POST /pm/plans/{plan_id}/close"
        actor: PropertyManager
        preconditions:
          - "No CorrectiveWorkOrder under this plan is in OPEN, IN_REVIEW, APPROVED, or IN_PROGRESS (ERR_PLAN_HAS_OPEN_WORK)"
          - "No PMVisit under this plan is in SCHEDULED, NOTIFIED, or IN_PROGRESS (ERR_PLAN_HAS_OPEN_WORK)"
          - "plan.committed_cents == 0 (ERR_PLAN_HAS_OPEN_WORK)"
        side_effects: []

  - entity: Deficiency
    initial_state: RECORDED
    terminal_states: [CONVERTED, WAIVED]
    transitions:
      - from: RECORDED
        to: TRIAGED
        trigger: "POST /pm/deficiencies/{deficiency_id}/triage"
        actor: PropertyManager
        preconditions: []
        side_effects: []
      - from: TRIAGED
        to: CONVERTED
        trigger: "system (cascade of CorrectiveWorkOrder IN_PROGRESS -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONVERTED
        to: TRIAGED
        trigger: "system (cascade of CorrectiveWorkOrder COMPLETED -> IN_PROGRESS fail-verification)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Deficiency reopens when verification fails; it returns to CONVERTED when the WO completes again — cyclic"
      - from: [RECORDED, TRIAGED]
        to: WAIVED
        trigger: "POST /pm/deficiencies/{deficiency_id}/waive"
        actor: PropertyManager
        preconditions:
          - "severity != EMERGENCY (ERR_EMERGENCY_NOT_WAIVABLE)"
          - "No CorrectiveWorkOrder in OPEN, IN_REVIEW, APPROVED, or IN_PROGRESS references this deficiency (ERR_INVALID_STATE)"
        side_effects: []
    note: "Creation of a CorrectiveWorkOrder (POST /pm/work-orders with deficiency_id) sets deficiency.work_order_id and bumps deficiency.version but leaves status TRIAGED until the WO completes — deep transitive coupling"

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on parent version
# =============================================================================
concurrency_rules:
  - rule_id: wo-create-stale-deficiency
    parent_entity: Deficiency
    write_endpoint: "POST /pm/work-orders"
    occ_field: expected_deficiency_version
    description: |
      Creating a CorrectiveWorkOrder against a Deficiency whose version has
      advanced since the client last observed it is rejected with 412. This
      captures the case where another writer has just converted the same
      deficiency into a work order (which legitimately supersedes the prior
      intent, since a deficiency converts to at most one work order) and the
      current writer's view of the deficiency is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: batch-publish-stale-batch
    parent_entity: EntryBatch
    write_endpoint: "POST /pm/batches/{batch_id}/publish"
    occ_field: expected_batch_version
    description: |
      Publishing an EntryBatch whose version has advanced since the client
      last observed it is rejected with 412. This captures the case where
      another writer has just added a visit to the batch (each visit creation
      bumps the batch version) and the publisher's notice/ledger commit would
      be computed from a stale roster.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (7 rules)
# =============================================================================
calculations:
  - name: asset_age
    trigger: "on read of Asset (age_months, warranty_active), and inside next_due_date and capital_replacement_forecast"
    algorithm: chronological
    formula: |
      age_months = floor( (current_logical_clock_date - installed_on_date) in whole calendar months )
        where a whole month has elapsed when the day-of-month of the clock date
        is >= day-of-month of installed_on; otherwise subtract one extra month.
      warranty_active = (age_months < warranty_months)   # strict less-than: the
        # asset is covered THROUGH the end of month warranty_months - 1; from the
        # first day of month warranty_months it is no longer covered.
    constants: {}
    precision: "integer months, floor"
    variants:
      - name: clock_frozen
        when: "server start before any POST /_clock/set_current_utc call"
        difference: "current logical clock is the fixed default 2026-08-01T00:00:00Z, not wall-clock time"

  - name: next_due_date
    trigger: "recomputed on PMVisit completion, on Asset creation, on clock moves, and on audit outcomes"
    algorithm: forward_looking
    formula: |
      last_completed = max over PMVisit v of v.scheduled_start
        where v.asset_id == asset.id AND v.template_id == template.id
          AND v.visit_status == COMPLETED
        (empty set => last_completed = asset.installed_on; if no template exists
         for the asset's component_type, compliance_status stays COMPLIANT)
      next_due = last_completed + template.frequency_days
      DUE_SOON_WINDOW_DAYS = 7 if unit.occupancy_status == OCCUPIED else 1
      open visit exists = exists v with v.asset_id == asset.id AND v.template_id == template.id
        AND v.visit_status IN {SCHEDULED, NOTIFIED, IN_PROGRESS}
      mapping (evaluated in order):
        audit FAIL outstanding for latest completed visit of asset+template => NON_COMPLIANT
        clock >= next_due => OVERDUE                                      # >= inclusive
        next_due - DUE_SOON_WINDOW_DAYS <= clock < next_due AND NOT open visit exists => DUE
        otherwise => COMPLIANT
      Boundary: at clock == next_due exactly the asset is OVERDUE.
    constants:
      DUE_SOON_WINDOW_OCCUPIED_DAYS: 7
      DUE_SOON_WINDOW_VACANT_DAYS: 1
    precision: "datetime, minute precision"
    variants:
      - name: vacant_unit_relaxation
        when: "unit.occupancy_status == VACANT"
        difference: "DUE window opens at next_due - 1 day instead of next_due - 7 days; OVERDUE rule unchanged"

  - name: notice_lead_check
    trigger: "PMVisit NOTIFIED -> IN_PROGRESS (start)"
    algorithm: threshold
    formula: |
      if unit.occupancy_status == OCCUPIED:
        earliest_start = batch.notice_sent_at + property.notice_lead_hours
        start allowed iff current_logical_clock >= earliest_start   # inclusive
      if unit.occupancy_status == VACANT:
        no lead-time check applies
      Boundary: clock == earliest_start exactly is ALLOWED (>= inclusive).
    constants: {}
    precision: "datetime, minute precision"

  - name: labor_hour_aggregation
    trigger: "recomputed on batch publish (plan variant) and on visit completion (actual variant)"
    algorithm: aggregation
    formula: |
      plan variant (planned_labor_hours, integer hours, ceiling):
        planned_labor_hours = ceil( sum over visits v of v.template.estimated_labor_minutes
          where v.plan_id == plan.id AND v.visit_status IN {SCHEDULED, NOTIFIED, IN_PROGRESS, COMPLETED}
          / 60 )
      actual variant (actual_labor_minutes, integer minutes):
        actual_labor_minutes = sum over visits v of v.actual_minutes
          where v.plan_id == plan.id AND v.visit_status == COMPLETED
        (empty set => 0)
      The two variants deliberately measure different things for the same plan:
      plan includes open visits and rounds UP to whole hours; actual counts only
      COMPLETED visits in raw minutes.
    constants: {}
    precision: "planned: integer hours ceiling; actual: integer minutes exact"

  - name: budget_burn
    trigger: "batch publish (commit), visit cancel/no-access (release), visit complete (settle), WO approve (commit), WO complete (settle), WO verify FAIL (clawback)"
    algorithm: waterfall_allocation
    formula: |
      All money in integer cents. Rounding pinned: round per-event THEN sum
      (never sum-then-round). round_half_up to whole cents.
      estimated_visit_cost(v) = round_half_up( v.template.estimated_labor_minutes * property.default_labor_rate_cents_per_hour / 60 )
      actual_visit_cost(v)    = round_half_up( v.actual_minutes * property.default_labor_rate_cents_per_hour / 60 )
      committed_cents = sum of BudgetLedgerEntry.amount_cents where plan_id == plan.id
        AND entry_kind IN {VISIT_COMMIT, WO_COMMIT}
        minus |sum of entries with entry_kind IN {VISIT_RELEASE, WO_RELEASE} that release a commit|
        (settles do not affect committed; the completion's first settle leg -estimate
        is recorded as a VISIT_RELEASE/WO_RELEASE-style negative against the commit)
      Concretely, per visit lifecycle the ledger rows are:
        publish:        VISIT_COMMIT  (+est)
        cancel/no-access: VISIT_RELEASE (-est)                 # pair cancels exactly
        complete:       VISIT_RELEASE (-est) + VISIT_SETTLE (+actual)
      per work order lifecycle:
        approve:        WO_COMMIT     (+est)
        complete:       WO_RELEASE    (-est) + WO_SETTLE (+actual)
        verify FAIL:    WO_RELEASE    (-actual)                # clawback of the settle
      committed_cents = sum(amount_cents) over entry_kind IN {VISIT_COMMIT, WO_COMMIT, VISIT_RELEASE, WO_RELEASE}
        where WO_RELEASE rows of the fail-verification form release a SETTLE, not a
        commit — they reduce spent_cents (see below), and are excluded from committed.
        Disambiguation: a WO_RELEASE row references the row it releases via memo text
        ("release-of-commit" vs "release-of-settle"); committed sums only
        release-of-commit rows.
      spent_cents = sum(amount_cents) over entry_kind IN {VISIT_SETTLE, WO_SETTLE}
        plus the negative fail-verification WO_RELEASE (release-of-settle) rows.
      Conserved invariants (compensating pairs):
        (a) per visit: committed contribution returns to exactly 0 after cancel,
            no-access, or completion; spent gains exactly actual on completion.
        (b) per work order: spent gains exactly actual_cost on completion and loses
            exactly actual_cost on verify FAIL — net recognized spend unchanged by
            a complete+fail-verification round trip.
    constants: {}
    precision: "integer cents, round_half_up, round-per-event-then-sum"

  - name: capital_replacement_forecast
    trigger: "POST /pm/capital-forecasts (computes a new snapshot)"
    algorithm: projection
    formula: |
      Input set: assets a whose unit's building's property_id == payload.property_id
        AND a.operational_status != DECOMMISSIONED.
      Horizon H = payload.horizon_years; years indexed y = 0..H-1;
      year y covers the half-open interval [clock + y years, clock + (y+1) years).
      effective_life_months(a):
        AGE_BASED variant:        expected_life_months
        CONDITION_BASED variant:  floor(expected_life_months * CONDITION_FACTOR(condition_score))
                                  where condition_score null (never serviced) maps to CONDITION_FACTOR(3) = 1.00
      replacement_date(a) = installed_on + effective_life_months(a) months
      if replacement_date < clock: bucket y = 0 (already past life)
      else: y = the index whose half-open interval contains replacement_date;
           if y >= H the asset is not projected within the horizon.
      per_year_cents[y] = sum of a.replacement_cost_cents over assets bucketed to y
      total_projected_cents = sum(per_year_cents)
      asset_count_projected = count of assets bucketed into 0..H-1
    constants:
      CONDITION_FACTOR_1: 0.60
      CONDITION_FACTOR_2: 0.80
      CONDITION_FACTOR_3: 1.00
      CONDITION_FACTOR_4: 1.15
      CONDITION_FACTOR_5: 1.30
    precision: "integer cents; effective_life_months floored to whole months before date arithmetic"
    variants:
      - name: AGE_BASED
        when: "snapshot.variant == AGE_BASED"
        difference: "uses raw expected_life_months; ignores condition_score entirely"
      - name: CONDITION_BASED
        when: "snapshot.variant == CONDITION_BASED"
        difference: "scales life by condition factor; score 5 defers replacement to 130% of nominal life, score 1 accelerates to 60%"

  - name: compliance_rate
    trigger: "GET /pm/compliance-summary (computed read)"
    algorithm: aggregation
    formula: |
      denominator = count of assets a in the property where a.operational_status IN {IN_SERVICE, OUT_OF_SERVICE}
      numerator   = count of those assets where a.compliance_status == COMPLIANT
      compliance_rate_pct = round_half_up( numerator * 10000 / denominator ) / 100
        (two-decimal percentage; denominator == 0 => compliance_rate_pct = 100.00 by convention)
      Boundary: an empty asset register yields exactly 100.00, not an error.
    constants: {}
    precision: "2 decimal places percentage, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles and §1.7; for technician-scoped actions (visit start/complete/no-access, WO submit-review/start/complete), X-User-ID must also equal the assigned technician_id"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in path or referenced in body must exist (path ids left-to-right first, then body references in declared input order)"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_BUILDING_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_TEMPLATE_NOT_FOUND | ERR_DEFICIENCY_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_ASSET_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: state
    check: "Property must be ACTIVE (not ARCHIVED) for any mutation of itself or its descendants"
    error_id: ERR_PROPERTY_ARCHIVED
    http_status: 409
    applies_to: "all mutating endpoints referencing a property"

  - priority: 5
    category: state
    check: "Target resource must be in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_temporal
    check: "OCC: expected_deficiency_version / expected_batch_version on guarded writes must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pm/work-orders, POST /pm/batches/{batch_id}/publish"

  - priority: 7
    category: business_temporal
    check: "Visit start / no-access: logical clock >= scheduled_start (ERR_VISIT_TOO_EARLY); for OCCUPIED units on start: clock >= notice_sent_at + notice_lead_hours (ERR_NOTICE_LEAD_VIOLATION)"
    error_id: "ERR_VISIT_TOO_EARLY | ERR_NOTICE_LEAD_VIOLATION"
    http_status: 409
    applies_to: "POST /pm/visits/{visit_id}/start, POST /pm/visits/{visit_id}/no-access"
    note: "ERR_VISIT_TOO_EARLY is evaluated before ERR_NOTICE_LEAD_VIOLATION"

  - priority: 8
    category: business_temporal
    check: "Batch publish: window_start > clock (ERR_WINDOW_IN_PAST); visit create/reschedule: scheduled_start within batch [window_start, window_end) (ERR_VISIT_OUTSIDE_WINDOW); reschedule target batch status in {DRAFT, PUBLISHED} and cancel source batch not LOCKED/EXECUTED/CANCELLED (ERR_BATCH_NOT_MUTABLE)"
    error_id: "ERR_WINDOW_IN_PAST | ERR_VISIT_OUTSIDE_WINDOW | ERR_BATCH_NOT_MUTABLE"
    http_status: 409
    applies_to: "POST /pm/batches/{batch_id}/publish, POST /pm/visits, POST /pm/visits/{visit_id}/reschedule, POST /pm/visits/{visit_id}/cancel"

  - priority: 9
    category: business_constraint
    check: "Temporal overlap: a unit may not have two non-CANCELLED visits whose half-open [scheduled_start, scheduled_start + template.estimated_labor_minutes) intervals intersect, regardless of batch (touching endpoints allowed)"
    error_id: ERR_UNIT_ENTRY_OVERLAP
    http_status: 409
    applies_to: "POST /pm/visits, POST /pm/visits/{visit_id}/reschedule"

  - priority: 10
    category: business_referential
    check: "Visit asset.component_type must equal template.component_type (ERR_COMPONENT_MISMATCH); visit's batch/unit/template/asset/plan must all belong to the same property (ERR_CROSS_PROPERTY_REFERENCE); deficiency.asset_id must equal visit.asset_id (ERR_DEFICIENCY_ASSET_MISMATCH)"
    error_id: "ERR_COMPONENT_MISMATCH | ERR_CROSS_PROPERTY_REFERENCE | ERR_DEFICIENCY_ASSET_MISMATCH"
    http_status: 422
    applies_to: "POST /pm/visits, POST /pm/visits/{visit_id}/deficiencies"

  - priority: 11
    category: business_safety
    check: "Evidence requirement: completing a visit whose template.requires_evidence demands >= 1 ComplianceEvidence row"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /pm/visits/{visit_id}/complete"

  - priority: 12
    category: business_safety
    check: "Segregation of duties: audit auditor must differ from visit.technician_id; WO verify auditor must differ from wo.assigned_technician_id (ERR_SEGREGATION_OF_DUTIES); waiver of EMERGENCY deficiency forbidden (ERR_EMERGENCY_NOT_WAIVABLE)"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_EMERGENCY_NOT_WAIVABLE"
    http_status: 422
    applies_to: "POST /pm/visits/{visit_id}/audit, POST /pm/work-orders/{wo_id}/verify, POST /pm/deficiencies/{deficiency_id}/waive"

  - priority: 13
    category: business_fiscal
    check: "WO approve / batch publish: plan.status == ADOPTED (ERR_PLAN_NOT_ADOPTED) then committed_cents + new commitments <= budget_cents (ERR_BUDGET_EXCEEDED)"
    error_id: "ERR_PLAN_NOT_ADOPTED | ERR_BUDGET_EXCEEDED"
    http_status: 402
    applies_to: "POST /pm/work-orders/{wo_id}/approve, POST /pm/batches/{batch_id}/publish"
    note: "ERR_PLAN_NOT_ADOPTED is evaluated before ERR_BUDGET_EXCEEDED"

  - priority: 14
    category: business_constraint
    check: "Plan close: no open work orders/visits and committed_cents == 0 (ERR_PLAN_HAS_OPEN_WORK); plan adopt: no other ADOPTED plan for same property+year (ERR_DUPLICATE_ACTIVE_PLAN); asset decommission: no open work order references the asset (ERR_ASSET_HAS_OPEN_WORK)"
    error_id: "ERR_PLAN_HAS_OPEN_WORK | ERR_DUPLICATE_ACTIVE_PLAN | ERR_ASSET_HAS_OPEN_WORK"
    http_status: 409
    applies_to: "POST /pm/plans/{plan_id}/close, POST /pm/plans/{plan_id}/adopt, POST /pm/assets/{asset_id}/decommission"

  - priority: 15
    category: business_constraint
    check: "Field shape: required fields present, enums in declared sets, integers positive where constrained, window_end > window_start, horizon_years in 1..10, property_code unique"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PropertyManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Recompute compliance_status of all assets via next_due_date (clock-driven transitions DUE/OVERDUE fire on clock moves)"

  # --- Property ---
  - method: POST
    path: "/pm/properties"
    description: "Create a property"
    roles: [PropertyManager]
    code: 201
    input: [property_code, display_name, notice_lead_hours, default_labor_rate_cents_per_hour]
    output: Property
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/pm/properties/{property_id}"
    description: "Get a property"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: POST
    path: "/pm/properties/{property_id}/archive"
    description: "Archive a property (blocks all child mutations)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Property
    side_effects: ["status -> ARCHIVED"]

  # --- Building / Unit / Asset register ---
  - method: POST
    path: "/pm/buildings"
    description: "Create a building in a property"
    roles: [PropertyManager]
    code: 201
    input: [property_id, building_label, floors]
    output: Building
    side_effects: []

  - method: GET
    path: "/pm/buildings/{building_id}"
    description: "Get a building"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: []
    output: Building
    side_effects: []

  - method: GET
    path: "/pm/properties/{property_id}/buildings"
    description: "List buildings of a property (reverse reachability for Building.property_id)"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Building[]"
    side_effects: []

  - method: POST
    path: "/pm/units"
    description: "Create a unit in a building"
    roles: [PropertyManager]
    code: 201
    input: [building_id, unit_number, occupancy_status]
    output: Unit
    side_effects: []

  - method: GET
    path: "/pm/buildings/{building_id}/units"
    description: "List units in a building (reverse reachability for Unit.building_id)"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Unit[]"
    side_effects: []

  - method: POST
    path: "/pm/assets"
    description: "Register an asset in a unit"
    roles: [PropertyManager]
    code: 201
    input: [unit_id, component_type, installed_on, warranty_months, expected_life_months, replacement_cost_cents]
    output: Asset
    side_effects: ["operational_status=IN_SERVICE; compliance_status initialized via next_due_date (COMPLIANT when no template or no overdue window)"]

  - method: GET
    path: "/pm/assets/{asset_id}"
    description: "Get one asset with computed age_months and warranty_active"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: GET
    path: "/pm/assets"
    description: "List assets with filters (reverse reachability for Asset.unit_id and Asset.superseded_by_asset_id)"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: ["unit_id?", "property_id?", "superseded_by_asset_id?", "component_type?", "compliance_status?", "operational_status?", "limit?", "offset?"]
    output: "Asset[]"
    side_effects: []

  - method: POST
    path: "/pm/assets/{asset_id}/operational-status"
    description: "Transition an asset between IN_SERVICE and OUT_OF_SERVICE"
    roles: [PropertyManager]
    code: 200
    input: [target_status]
    output: Asset
    side_effects: ["operational_status := target_status (only IN_SERVICE <-> OUT_OF_SERVICE allowed; DECOMMISSIONED only via decommission or WO completion)"]

  - method: POST
    path: "/pm/assets/{asset_id}/decommission"
    description: "Decommission an asset (terminal)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Asset
    side_effects: ["operational_status -> DECOMMISSIONED; excluded from forecast and scheduling"]

  # --- PM task library ---
  - method: POST
    path: "/pm/pm-task-templates"
    description: "Create a PM task template (library entry)"
    roles: [PropertyManager]
    code: 201
    input: [property_id, component_type, task_name, frequency_days, estimated_labor_minutes, requires_evidence, effective_from]
    output: PMTaskTemplate
    side_effects: ["retired_at = null"]

  - method: GET
    path: "/pm/properties/{property_id}/pm-task-templates"
    description: "List PM task templates of a property (reverse reachability for PMTaskTemplate.property_id); retired templates excluded unless include_retired=true"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: ["component_type?", "include_retired?", "limit?", "offset?"]
    output: "PMTaskTemplate[]"
    side_effects: []

  - method: POST
    path: "/pm/pm-task-templates/{template_id}/retire"
    description: "Retire a template (soft delete; excluded from default lists, still referenced by history)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: PMTaskTemplate
    side_effects: ["retired_at := current logical clock"]

  # --- Plans & ledger ---
  - method: POST
    path: "/pm/plans"
    description: "Create a PM plan for a year"
    roles: [PropertyManager]
    code: 201
    input: [property_id, plan_year, budget_cents]
    output: PMPlan
    side_effects: ["status=DRAFT; planned_labor_hours=0; actual_labor_minutes=0; committed_cents=0; spent_cents=0"]

  - method: GET
    path: "/pm/plans/{plan_id}"
    description: "Get a plan with computed aggregates"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: []
    output: PMPlan
    side_effects: []

  - method: GET
    path: "/pm/properties/{property_id}/plans"
    description: "List plans of a property (reverse reachability for PMPlan.property_id)"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: ["status?", "plan_year?", "limit?", "offset?"]
    output: "PMPlan[]"
    side_effects: []

  - method: POST
    path: "/pm/plans/{plan_id}/adopt"
    description: "Adopt a plan"
    roles: [PropertyManager]
    code: 200
    input: []
    output: PMPlan
    side_effects: ["status -> ADOPTED"]

  - method: POST
    path: "/pm/plans/{plan_id}/close"
    description: "Close a plan (terminal)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: PMPlan
    side_effects: ["status -> CLOSED"]

  - method: GET
    path: "/pm/plans/{plan_id}/ledger"
    description: "List budget ledger entries of a plan (reverse reachability for BudgetLedgerEntry.plan_id)"
    roles: [PropertyManager, ComplianceAuditor]
    code: 200
    input: ["entry_kind?", "limit?", "offset?"]
    output: "BudgetLedgerEntry[]"
    side_effects: []

  # --- Batches ---
  - method: POST
    path: "/pm/batches"
    description: "Create an entry batch"
    roles: [PropertyManager]
    code: 201
    input: [property_id, batch_label, window_start, window_end]
    output: EntryBatch
    side_effects: ["status=DRAFT; notice_sent_at=null"]

  - method: GET
    path: "/pm/batches/{batch_id}"
    description: "Get a batch"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: []
    output: EntryBatch
    side_effects: []

  - method: GET
    path: "/pm/properties/{property_id}/batches"
    description: "List batches of a property (reverse reachability for EntryBatch.property_id)"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EntryBatch[]"
    side_effects: []

  - method: POST
    path: "/pm/batches/{batch_id}/publish"
    description: "Publish a batch (sends resident notices, cascades SCHEDULED->NOTIFIED, commits budget). OCC-guarded."
    roles: [PropertyManager]
    code: 200
    input: [expected_batch_version]
    output: EntryBatch
    side_effects:
      - "status -> PUBLISHED; notice_sent_at := clock"
      - "all SCHEDULED visits -> NOTIFIED"
      - "Ledger VISIT_COMMIT(+estimated cost) per non-CANCELLED visit"
      - "recompute affected plans' planned_labor_hours and committed_cents"
      - "increments EntryBatch.version by 1"

  - method: POST
    path: "/pm/batches/{batch_id}/lock"
    description: "Lock a published batch shortly before entry"
    roles: [PropertyManager]
    code: 200
    input: []
    output: EntryBatch
    side_effects: ["status -> LOCKED"]

  - method: POST
    path: "/pm/batches/{batch_id}/cancel"
    description: "Cancel a DRAFT batch and its visits"
    roles: [PropertyManager]
    code: 200
    input: []
    output: EntryBatch
    side_effects: ["status -> CANCELLED; SCHEDULED visits -> CANCELLED"]

  # --- Visits ---
  - method: POST
    path: "/pm/visits"
    description: "Add a visit to a DRAFT batch (creates PMVisit in SCHEDULED); bumps batch.version by 1"
    roles: [PropertyManager]
    code: 201
    input: [batch_id, unit_id, template_id, asset_id, plan_id, scheduled_start, technician_id]
    output: PMVisit
    side_effects:
      - "visit_status=SCHEDULED"
      - "increments EntryBatch.version by 1 (visit roster mutation)"

  - method: GET
    path: "/pm/visits/{visit_id}"
    description: "Get a visit"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: []
    output: PMVisit
    side_effects: []

  - method: GET
    path: "/pm/visits"
    description: "List visits with filters (reverse reachability for PMVisit.batch_id, unit_id, template_id, asset_id, plan_id)"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: ["batch_id?", "unit_id?", "template_id?", "asset_id?", "plan_id?", "visit_status?", "limit?", "offset?"]
    output: "PMVisit[]"
    side_effects: []

  - method: POST
    path: "/pm/visits/{visit_id}/start"
    description: "Technician starts a NOTIFIED visit (entry)"
    roles: [Technician]
    code: 200
    input: []
    output: PMVisit
    side_effects: ["visit_status -> IN_PROGRESS"]

  - method: POST
    path: "/pm/visits/{visit_id}/complete"
    description: "Technician completes an IN_PROGRESS visit with actual minutes and condition score"
    roles: [Technician]
    code: 200
    input: [actual_minutes, condition_score_recorded]
    output: PMVisit
    side_effects:
      - "visit_status -> COMPLETED"
      - "ledger release+settle pair; asset.condition_score updated; compliance recompute; plan aggregates recompute; batch may auto-EXECUTE"

  - method: POST
    path: "/pm/visits/{visit_id}/no-access"
    description: "Technician records a failed entry on a NOTIFIED visit"
    roles: [Technician]
    code: 200
    input: []
    output: PMVisit
    side_effects: ["visit_status -> NO_ACCESS; ledger VISIT_RELEASE"]

  - method: POST
    path: "/pm/visits/{visit_id}/reschedule"
    description: "Reschedule a NO_ACCESS visit into a target batch window"
    roles: [PropertyManager]
    code: 200
    input: [target_batch_id, new_scheduled_start]
    output: PMVisit
    side_effects: ["visit_status -> SCHEDULED (DRAFT target) or NOTIFIED (PUBLISHED target); batch_id updated; ledger VISIT_COMMIT when target PUBLISHED"]

  - method: POST
    path: "/pm/visits/{visit_id}/cancel"
    description: "Cancel a SCHEDULED or NOTIFIED visit"
    roles: [PropertyManager]
    code: 200
    input: []
    output: PMVisit
    side_effects: ["visit_status -> CANCELLED; ledger VISIT_RELEASE if previously committed"]

  # --- Evidence / deficiencies / audit ---
  - method: POST
    path: "/pm/visits/{visit_id}/evidence"
    description: "Record compliance evidence on a visit (filter/detector/battery)"
    roles: [Technician]
    code: 201
    input: [evidence_type, serial_or_lot, "notes?"]
    output: ComplianceEvidence
    side_effects: ["recorded_by := X-User-ID"]

  - method: GET
    path: "/pm/visits/{visit_id}/evidence"
    description: "List compliance evidence of a visit (reverse reachability for ComplianceEvidence.visit_id)"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: []
    output: "ComplianceEvidence[]"
    side_effects: []

  - method: POST
    path: "/pm/visits/{visit_id}/deficiencies"
    description: "Record a deficiency found during a visit (visit must be IN_PROGRESS or COMPLETED)"
    roles: [Technician]
    code: 201
    input: [asset_id, severity, description]
    output: Deficiency
    side_effects: ["status=RECORDED; asset_id must equal visit.asset_id"]

  - method: GET
    path: "/pm/deficiencies"
    description: "List deficiencies with filters (reverse reachability for Deficiency.visit_id and Deficiency.asset_id)"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: ["visit_id?", "asset_id?", "status?", "limit?", "offset?"]
    output: "Deficiency[]"
    side_effects: []

  - method: GET
    path: "/pm/deficiencies/{deficiency_id}"
    description: "Get a deficiency"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: []
    output: Deficiency
    side_effects: []

  - method: POST
    path: "/pm/deficiencies/{deficiency_id}/triage"
    description: "Triage a RECORDED deficiency"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Deficiency
    side_effects: ["status -> TRIAGED; increments Deficiency.version by 1"]

  - method: POST
    path: "/pm/deficiencies/{deficiency_id}/waive"
    description: "Waive a deficiency (non-EMERGENCY only, no open work order)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Deficiency
    side_effects: ["status -> WAIVED"]

  - method: POST
    path: "/pm/visits/{visit_id}/audit"
    description: "Compliance audit of a COMPLETED visit (segregation of duties enforced); at most one audit per visit"
    roles: [ComplianceAuditor]
    code: 201
    input: [outcome, "fail_reason?"]
    output: CompletionAudit
    side_effects: ["auditor_id := X-User-ID; audited_at := clock; on FAIL: asset.compliance_status -> NON_COMPLIANT; on PASS on a later visit for a NON_COMPLIANT asset: asset.compliance_status recomputed"]

  - method: GET
    path: "/pm/visits/{visit_id}/audit"
    description: "Get the audit of a visit (reverse reachability for CompletionAudit.visit_id); returns array of 0 or 1"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: []
    output: "CompletionAudit[]"
    side_effects: []

  # --- Corrective work orders ---
  - method: POST
    path: "/pm/work-orders"
    description: "Convert a TRIAGED deficiency into a corrective work order. OCC-guarded on the deficiency."
    roles: [PropertyManager]
    code: 201
    input: [deficiency_id, plan_id, estimated_cost_cents, assigned_technician_id, "replace_asset?", expected_deficiency_version]
    output: CorrectiveWorkOrder
    side_effects:
      - "status=OPEN; deficiency.work_order_id set; wo.property_id/asset_id denormalized from the deficiency chain"
      - "increments Deficiency.version by 1 (work_order_id mutation)"

  - method: GET
    path: "/pm/work-orders/{wo_id}"
    description: "Get a corrective work order"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: []
    output: CorrectiveWorkOrder
    side_effects: []

  - method: GET
    path: "/pm/work-orders"
    description: "List work orders with filters (reverse reachability for CorrectiveWorkOrder.property_id, deficiency_id, plan_id, asset_id)"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: ["property_id?", "deficiency_id?", "plan_id?", "asset_id?", "status?", "limit?", "offset?"]
    output: "CorrectiveWorkOrder[]"
    side_effects: []

  - method: POST
    path: "/pm/work-orders/{wo_id}/submit-review"
    description: "Technician submits an OPEN work order for review"
    roles: [Technician]
    code: 200
    input: []
    output: CorrectiveWorkOrder
    side_effects: ["status -> IN_REVIEW"]

  - method: POST
    path: "/pm/work-orders/{wo_id}/approve"
    description: "Approve an IN_REVIEW work order (budget check)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: CorrectiveWorkOrder
    side_effects: ["status -> APPROVED; ledger WO_COMMIT"]

  - method: POST
    path: "/pm/work-orders/{wo_id}/return-rework"
    description: "Return an IN_REVIEW work order to OPEN (rework cycle)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: CorrectiveWorkOrder
    side_effects: ["status -> OPEN; revision_count += 1"]

  - method: POST
    path: "/pm/work-orders/{wo_id}/reject"
    description: "Reject an IN_REVIEW work order (terminal; deficiency falls back to TRIAGED)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: CorrectiveWorkOrder
    side_effects: ["status -> REJECTED; deficiency.status -> TRIAGED"]

  - method: POST
    path: "/pm/work-orders/{wo_id}/start"
    description: "Technician starts an APPROVED work order (asset goes OUT_OF_SERVICE)"
    roles: [Technician]
    code: 200
    input: []
    output: CorrectiveWorkOrder
    side_effects: ["status -> IN_PROGRESS; asset.operational_status -> OUT_OF_SERVICE"]

  - method: POST
    path: "/pm/work-orders/{wo_id}/complete"
    description: "Technician completes an IN_PROGRESS work order with actual cost"
    roles: [Technician]
    code: 200
    input: [actual_cost_cents, "new_asset_id?"]
    output: CorrectiveWorkOrder
    side_effects: ["status -> COMPLETED; ledger WO_RELEASE+WO_SETTLE; asset returned or decommissioned; deficiency -> CONVERTED"]

  - method: POST
    path: "/pm/work-orders/{wo_id}/verify"
    description: "Auditor verifies a COMPLETED work order; outcome=PASS -> VERIFIED, outcome=FAIL -> IN_PROGRESS with spend clawback"
    roles: [ComplianceAuditor]
    code: 200
    input: [outcome]
    output: CorrectiveWorkOrder
    side_effects: ["PASS: status -> VERIFIED | FAIL: status -> IN_PROGRESS, ledger WO_RELEASE(-actual, release-of-settle), asset -> OUT_OF_SERVICE, deficiency -> TRIAGED"]

  # --- Ledger reverse reachability from visit / work order ---
  - method: GET
    path: "/pm/visits/{visit_id}/ledger-entries"
    description: "List ledger entries sourced from a visit (reverse reachability for BudgetLedgerEntry.source_visit_id)"
    roles: [PropertyManager, ComplianceAuditor]
    code: 200
    input: []
    output: "BudgetLedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/pm/work-orders/{wo_id}/ledger-entries"
    description: "List ledger entries sourced from a work order (reverse reachability for BudgetLedgerEntry.source_work_order_id)"
    roles: [PropertyManager, ComplianceAuditor]
    code: 200
    input: []
    output: "BudgetLedgerEntry[]"
    side_effects: []

  # --- Forecasting & compliance read ---
  - method: POST
    path: "/pm/capital-forecasts"
    description: "Compute a capital replacement forecast snapshot (AGE_BASED or CONDITION_BASED)"
    roles: [PropertyManager]
    code: 201
    input: [property_id, horizon_years, variant]
    output: CapitalForecastSnapshot
    side_effects: ["computed_at := clock; snapshot persisted (append-only)"]

  - method: GET
    path: "/pm/properties/{property_id}/capital-forecasts"
    description: "List forecast snapshots of a property (reverse reachability for CapitalForecastSnapshot.property_id)"
    roles: [PropertyManager, ComplianceAuditor]
    code: 200
    input: ["variant?", "limit?", "offset?"]
    output: "CapitalForecastSnapshot[]"
    side_effects: []

  - method: GET
    path: "/pm/compliance-summary"
    description: "Computed compliance rate across a property's asset register"
    roles: [PropertyManager, Technician, ComplianceAuditor]
    code: 200
    input: [property_id]
    output: "{ compliance_rate_pct: number, compliant_count: integer, assessed_count: integer }"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog (30 codes)
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role not permitted for this endpoint, or technician X-User-ID does not match the assigned technician_id on technician-scoped actions"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property_id does not exist"
  - id: ERR_BUILDING_NOT_FOUND
    http: 404
    condition: "building_id does not exist"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "unit_id does not exist"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "asset_id does not exist"
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "template_id does not exist (or is retired where a current template is required)"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id does not exist"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "batch_id does not exist"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "visit_id does not exist"
  - id: ERR_DEFICIENCY_NOT_FOUND
    http: 404
    condition: "deficiency_id does not exist"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "wo_id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, enum out of set, non-positive integer where positive required, window_end <= window_start, horizon out of 1..10, duplicate property_code"
  - id: ERR_PROPERTY_ARCHIVED
    http: 409
    condition: "Mutation attempted under an ARCHIVED property"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not declared from the resource's current state (e.g. start a SCHEDULED visit, approve an OPEN work order, adopt an ADOPTED plan, lock before window_start - 1h, waive a deficiency with an open work order, audit a non-COMPLETED visit, second audit on same visit)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_deficiency_version / expected_batch_version does not match the parent entity's current version (OCC)"
  - id: ERR_VISIT_TOO_EARLY
    http: 409
    condition: "Visit start or no-access attempted before scheduled_start"
  - id: ERR_NOTICE_LEAD_VIOLATION
    http: 409
    condition: "Visit start attempted before notice_sent_at + notice_lead_hours on an OCCUPIED unit"
  - id: ERR_WINDOW_IN_PAST
    http: 409
    condition: "Batch publish attempted with window_start <= current logical clock"
  - id: ERR_VISIT_OUTSIDE_WINDOW
    http: 409
    condition: "Visit scheduled_start outside batch [window_start, window_end) at create, publish, or reschedule"
  - id: ERR_BATCH_NOT_MUTABLE
    http: 409
    condition: "Visit cancel/reschedule or visit-add attempted while the relevant batch is LOCKED/EXECUTED/CANCELLED (where forbidden)"
  - id: ERR_EMPTY_BATCH
    http: 409
    condition: "Batch publish attempted with zero non-CANCELLED visits"
  - id: ERR_UNIT_ENTRY_OVERLAP
    http: 409
    condition: "New or rescheduled visit's [start, start+estimated_labor_minutes) interval intersects another non-CANCELLED visit for the same unit"
  - id: ERR_COMPONENT_MISMATCH
    http: 422
    condition: "Visit asset.component_type != template.component_type"
  - id: ERR_CROSS_PROPERTY_REFERENCE
    http: 422
    condition: "Visit references unit/template/asset/plan/batch not belonging to one same property"
  - id: ERR_DEFICIENCY_ASSET_MISMATCH
    http: 422
    condition: "Deficiency asset_id != visit.asset_id"
  - id: ERR_EVIDENCE_REQUIRED
    http: 422
    condition: "Completing a visit whose template.requires_evidence without any ComplianceEvidence row"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Auditor X-User-ID equals the technician who performed the visit or work order"
  - id: ERR_EMERGENCY_NOT_WAIVABLE
    http: 422
    condition: "Waive attempted on an EMERGENCY deficiency"
  - id: ERR_PLAN_NOT_ADOPTED
    http: 402
    condition: "WO approve or batch publish references a plan whose status != ADOPTED"
  - id: ERR_BUDGET_EXCEEDED
    http: 402
    condition: "WO approve or batch publish would push plan.committed_cents + new commitments over plan.budget_cents"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PropertyManager
    description: "Manages the property, asset register, PM library, plans, batches, scheduling, deficiencies, and work-order approvals"
    identity: opaque
    exclusive_operations:
      - "POST /pm/properties, /archive — property lifecycle"
      - "POST /pm/buildings, /pm/units, /pm/assets — register management; operational-status, decommission"
      - "POST /pm/pm-task-templates, retire — task library"
      - "POST /pm/plans, adopt, close — plan lifecycle"
      - "POST /pm/batches, publish, lock, cancel — batch lifecycle"
      - "POST /pm/visits, reschedule, cancel — scheduling"
      - "POST /pm/deficiencies/{id}/triage, waive — deficiency handling"
      - "POST /pm/work-orders, approve, return-rework, reject — work-order management"
      - "POST /pm/capital-forecasts — compute forecast snapshots"
      - "POST /_clock/set_current_utc — drive the logical clock"
    shared_operations:
      - "All GET endpoints"
  - name: Technician
    description: "Performs unit entries and corrective work; records evidence, deficiencies, minutes, and condition scores; may only act on visits/work orders assigned to its X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /pm/visits/{id}/start, complete, no-access — visit execution"
      - "POST /pm/visits/{id}/evidence — compliance evidence capture"
      - "POST /pm/visits/{id}/deficiencies — deficiency recording"
      - "POST /pm/work-orders/{id}/submit-review, start, complete — work-order execution"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceAuditor
    description: "Independent auditor; may never audit or verify work performed by the same X-User-ID (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /pm/visits/{id}/audit — completion audit"
      - "POST /pm/work-orders/{id}/verify — work-order verification"
    shared_operations:
      - "All GET endpoints"
