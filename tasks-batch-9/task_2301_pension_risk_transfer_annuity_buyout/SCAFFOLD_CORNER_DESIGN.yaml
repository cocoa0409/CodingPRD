      - name: cap_waterfall_defers_one_election_and_keeps_walking
        claim_type: waterfall_allocation
        grounds:
          - calculations.window_cap_waterfall
          - state_machines.ParticipantElection.ELECTED_LUMP_SUM_to_CAP_DEFERRED
