            - "StormwaterAccount.${acct_a_id}: total_credit_pct == 0.2245, gross_billable_cents == 29264, current_net_fee_cents == 22694 because round_half_up(29264 * 0.2245) == 6570"
            - "PermitTerm.${term_id}.projected_annual_revenue_cents == 22694 and funding_adequacy_status == UNDERFUNDED, because 22694 is below the 25000 funding target"

      - name: outfall_retirement_blocked_by_open_illicit_discharge_case
        grounds:
          - state_machines.Outfall.ACTIVE_to_RETIRED
          - validations[priority=77]
          - entities.Outfall.fields.open_case_count
          - state_machines.IllicitDischargeCase.SOURCE_IDENTIFIED_to_RESOLVED
          - errors.ERR_OUTFALL_HAS_OPEN_CASES
        distinguishing_aspect: |
          Entity pair (Outfall, IllicitDischargeCase): the guard reads a census of *other* rows
          rather than one field of a parent. The outfall's own inventory state is ACTIVE and
          retirement is otherwise legal, but one non-terminal case blocks it; resolving that case
          both empties the census and flips the independent screening dimension back to CLEAR.
