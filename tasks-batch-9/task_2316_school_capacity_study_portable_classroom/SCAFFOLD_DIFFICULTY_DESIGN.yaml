            payload: { asset_tag: "PU-C101", size_class: "SINGLE_24x40", condition_grade: "B", ada_ramp_installed: true, acquisition_cost_cents: 9600000, in_service_year: 2011 }
            as: AssetManager
            as_user_id: "assets-3"
            captures: { stored_unit_id: id }
          - call: "POST /facilities/portable-units"
            payload: { asset_tag: "PU-C102", size_class: "SINGLE_24x40", condition_grade: "B", ada_ramp_installed: true, acquisition_cost_cents: 9600000, in_service_year: 2011 }
            as: AssetManager
            as_user_id: "assets-3"
            captures: { installed_unit_id: id }
          - call: "POST /facilities/portable-units/${installed_unit_id}/record-existing-placement"
            payload: { school_id: "${school_id}", placement_site_id: "${legacy_site_id}", installed_on: "2027-03-15" }
            as: AssetManager
            as_user_id: "assets-3"
        trigger:
          call: "POST /facilities/disposal-records"
          payload: { portable_unit_id: "${stored_unit_id}", method: "SCRAP", valuation_basis: "CONDITION_ADJUSTED", proceeds_cents: 0 }
          as: AssetManager
          as_user_id: "assets-3"
        asserts:
          - "response status is 409"
          - "data.error_id == \"ERR_UNIT_NOT_DISPOSABLE\""
          - "GET /facilities/portable-units/${stored_unit_id} returns data.allocation_status == \"IN_STORAGE\" and data.condition_status == \"SERVICEABLE\""
          - "GET /facilities/disposal-records with portable_unit_id ${stored_unit_id} returns data == [] and meta.total_count == 0"
          - "grade arm of the disjunction: after POST /facilities/portable-units/${stored_unit_id}/condition with body {condition_status: NEEDS_REHAB, condition_grade: D}, the identical create returns 201 with data.salvage_value_cents == 480000 and data.net_disposal_result_cents == -480000, and GET /facilities/portable-units/${stored_unit_id} returns data.allocation_status == \"DISPOSED\" - so the OR is satisfied by grade alone, with condition_status still short of UNSAFE"
          - "allocation conjunct is independent: after POST /facilities/portable-units/${installed_unit_id}/condition with body {condition_status: NEEDS_REHAB, condition_grade: D}, a disposal create for ${installed_unit_id} returns 409 with data.error_id == \"ERR_UNIT_NOT_DISPOSABLE\" because its allocation_status is INSTALLED even though the condition arm is satisfied"

  # =========================================================================
  # RULE 8 - resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: pad_reuse_closed_interval_with_turnaround_buffer
        grounds:
          validations: [38]
          entities: [InstallationSchedule, PlacementSite, PlacementRequest]
          endpoints: ["POST /facilities/installation-schedules"]
        resource: PlacementSite
        interval_semantics: "closed interval [window_start, window_end] widened by PAD_TURNAROUND_DAYS = 7 on both sides; two bookings on the same pad conflict unless new_window_start > existing_window_end + 7 days OR new_window_end < existing_window_start - 7 days; only schedules in PLANNED or IN_PROGRESS are considered"
        distinguishing_aspect: >
          A pad already carries a PLANNED set for 2027-06-15 through 2027-06-25. A
          second booking on the same pad starting 2027-07-02, a full week after the
          first ends, is still rejected because the buffered end is exactly
          2027-07-02 and the comparison is strictly greater-than; starting one day
          later at 2027-07-03 is accepted. The buffer is symmetric and the interval
          is closed, so a booking that merely touches the existing end date is a
          conflict rather than an adjacency. This is the pad dimension of scheduling
          and it is deliberately unlike the crew dimension: a different resource
          entity, a closed rather than half-open interval, a turnaround buffer
          rather than a capacity count.
