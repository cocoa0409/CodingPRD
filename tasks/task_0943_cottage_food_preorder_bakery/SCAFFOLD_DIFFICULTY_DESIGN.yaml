              payload: { to_iso8601: "2026-05-06T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bakery/offer-windows/${w1}/lock"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
          trigger:
            - call: "POST /bakery/offer-windows/${w1}/plan"
              payload: { mode: "PLAN" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "GET /bakery/batches"
              payload: { offer_window_id: "${w1}", menu_item_id: "${mi_cookie}" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { batch_cookie: "$.data[0].id", cookie_oven: "$.data[0].oven_hours", cookie_slots: "$.data[0].slot_count" }
            - call: "GET /bakery/batches"
              payload: { offer_window_id: "${w1}", menu_item_id: "${mi_bread}" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { batch_bread: "$.data[0].id", bread_oven: "$.data[0].oven_hours", bread_slots: "$.data[0].slot_count" }
            - call: "GET /bakery/offer-windows/${w1}/capacity"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
              captures: { oven_remaining: $.data.oven_hours_remaining }
          assert:
            - "${cookie_slots} == 1 and ${bread_slots} == 1"
            - "${cookie_oven} == 1.5"
            - "${bread_oven} == 3.0"
            - "Batch.${batch_cookie}.planned_yield_units == 24"
            - "Batch.${batch_bread}.planned_yield_units == 12"
            - "${oven_remaining} == 13.5"
            - "Identical slot_count 1 produced oven_hours 1.5 and 3.0, so the profile alone changed the capacity consumed"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_tax_rounding_then_sum_differs_by_one_cent
        grounds:
          - calculations.line_tax
          - calculations.order_tax_total
          - entities.OrderLine.fields.line_tax_cents
          - entities.Order.fields.tax_total_cents
        distinguishing_aspect: |
          Mode (b), nested rounding where the order matters: two taxable lines of
          4600 and 5400 cents round to 334 and 392 per line and sum to 726, whereas
          rounding the combined 10000 once gives 725. The scaffold pins
          per_line_then_sum, so tax_total_cents MUST be 726.
        test_recipe:
          setup:
            - "An ACTIVE baker with a PUBLISHED recipe and one LISTED PER_DOZEN_BAKERS cookie at unit 450 / dozen 4600."
            - "An OPEN window with default capacity, clock at 2026-05-04T09:00:00Z."
            - "A PICKUP_COUNTER order holding two taxable lines: 13 cookies WITH_UTENSILS (4600) and 12 cookies HEATED (5400)."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /bakery/customers"
              payload: { baker_id: "${baker_id}", display_name: "Ada Byron", email: "ada@example.com", delivery_distance_km: 6.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /bakery/recipes"
              payload: { baker_id: "${baker_id}", name: "Brown Butter Cookie" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { r_cookie: $.data.id }
            - call: "POST /bakery/recipes/${r_cookie}/components"
              payload: { component_name: "flour and butter", quantity_grams: 500, declared_allergens: ["wheat", "milk"] }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/recipes/${r_cookie}/publish"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/menu-items"
              payload: { baker_id: "${baker_id}", recipe_id: "${r_cookie}", name: "Brown Butter Cookie", product_class: "SHELF_STABLE", pricing_basis: "PER_DOZEN_BAKERS", unit_price_cents: 450, dozen_price_cents: 4600 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mi_cookie: $.data.id }
            - call: "POST /bakery/menu-items/${mi_cookie}/listing-status"
              payload: { to_status: "LISTED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/offer-windows"
              payload: { baker_id: "${baker_id}", label: "Wed 6 May", opens_at: "2026-05-04T00:00:00Z", order_cutoff_at: "2026-05-06T12:00:00Z", production_date: "2026-05-07T06:00:00Z", handoff_date: "2026-05-07T15:00:00Z", handoff_window_end_at: "2026-05-07T19:00:00Z" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1: $.data.id }
            - call: "POST /bakery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bakery/offer-windows/${w1}/advance"
              payload: { to_status: "OPEN" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1_v1: $.data.version }
            - call: "POST /bakery/orders"
              payload: { customer_id: "${cust_id}", offer_window_id: "${w1}", handoff_mode: "PICKUP_COUNTER" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
            - call: "POST /bakery/orders/${o1}/lines"
              payload: { menu_item_id: "${mi_cookie}", quantity: 13, disposition: "WITH_UTENSILS", expected_offer_window_version: "${w1_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_a: $.data.id }
            - call: "GET /bakery/offer-windows/${w1}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { w1_v2: $.data.version }
            - call: "POST /bakery/orders/${o1}/lines"
              payload: { menu_item_id: "${mi_cookie}", quantity: 12, disposition: "HEATED", expected_offer_window_version: "${w1_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_b: $.data.id }
          trigger:
            - call: "POST /bakery/orders/${o1}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { subtotal: $.data.subtotal_cents, taxtotal: $.data.tax_total_cents }
          assert:
            - "OrderLine.${line_a}.line_total_cents == 4600 and OrderLine.${line_a}.line_tax_cents == 334"
            - "OrderLine.${line_b}.line_total_cents == 5400 and OrderLine.${line_b}.line_tax_cents == 392"
            - "OrderLine.${line_a}.taxable == true and OrderLine.${line_b}.taxable == true"
            - "${subtotal} == 10000"
            - "${taxtotal} == 726"
            - "${taxtotal} != 725, which is the value the rejected sum-then-round order would produce"

      - name: grand_total_pinned_evaluation_order_tips_on_subtotal_only
        grounds:
          - calculations.order_grand_total
          - calculations.tip_amount
          - calculations.order_credit_applied
          - entities.Payment.fields.tip_mode
          - entities.Order.fields.grand_total_cents
        distinguishing_aspect: |
          Mode (c), circular-looking dependency with a pinned evaluation order: the
          tip base is subtotal_cents alone (8200 * 0.15 == 1230), NOT
          subtotal + tax + fee (8461 * 0.15 == 1269), and the credit cap at step 5
          is computed on a total that excludes the tip produced at step 4, while the
          grand total at step 6 includes it, giving 9691.
        test_recipe:
          setup:
            - "An ACTIVE baker with a PUBLISHED recipe, a LISTED PER_DOZEN_BAKERS cookie and a LISTED PER_UNIT loaf at 900."
            - "An OPEN window with default capacity, clock at 2026-05-04T09:00:00Z."
            - "A CONFIRMED PICKUP_COUNTER order with 13 cookies WHOLE_UNHEATED (4600, tax 0) and 4 loaves BY_THE_SLICE (3600, tax 261), so subtotal_cents 8200 and tax_total_cents 261."
