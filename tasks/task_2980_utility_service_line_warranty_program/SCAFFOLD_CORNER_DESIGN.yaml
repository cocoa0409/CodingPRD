      - name: duplicate_active_enrollment_is_blocked_but_a_cancelled_one_frees_the_slot
        claim_type: satisfaction_to_pass
        grounds:
          - validations.no-duplicate-active-enrollment
          - errors.ERR_DUPLICATE_ACTIVE_ENROLLMENT
          - state_machines.Enrollment.transitions.PENDING_WAITING_PERIOD_to_CANCELLED
          - calculations.cancellation_refund_proration
          - endpoints.POST /enrollments
        distinguishing_aspect: "The blocking set is {PENDING_WAITING_PERIOD, ACTIVE, SUSPENDED_NONPAY} - it deliberately excludes CANCELLED and LAPSED - so the SAME (premises, product) pair that is refused becomes admissible after the incumbent is cancelled, with no change to the request body except the premises version. An implementation enforcing a blanket uniqueness index on (premises_id, product_id) passes the first half and fails the second."
