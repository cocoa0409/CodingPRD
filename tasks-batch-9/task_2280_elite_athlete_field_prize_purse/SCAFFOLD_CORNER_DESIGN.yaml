  # ===========================================================================
  # From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: corner_endpoint_athlete_crud_create_read_patch_reread
        claim_type: standard_crud
        grounds:
          - endpoints[POST /athletes]
          - endpoints[GET /athletes/{id}]
          - endpoints[PATCH /athletes/{id}/tax-profile]
        distinguishing_aspect: >-
          Athlete is the one entity with a partial-update endpoint, and it is scoped: the tax-profile
          PATCH may touch only the three withholding fields, must leave identity and whereabouts
          untouched, must bump version on every write, and a PATCH with an empty body is still a
          write that the server accepts without changing any value.
        test_recipe:
          setup:
            - "The logical clock is at the 2026-08-01T00:00:00Z default; no other data is required."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
          trigger:
            - call: POST /athletes
              payload: { full_name: "Crud Carla", country_code: KEN, gender: FEMALE, birth_date: "1994-02-14", tax_residency_country: KEN, w8ben_on_file: false, treaty_withholding_bps: 0, whereabouts_filed: true }
              as: ElitesDirector
              captures: { ath_id: "$.data.id", v0: "$.data.version" }
            - call: GET /athletes/${ath_id}
              as: TechnicalOfficial
            - call: PATCH /athletes/${ath_id}/tax-profile
              payload: { w8ben_on_file: true, treaty_withholding_bps: 500 }
              as: FinanceOfficer
              captures: { v1: "$.data.version" }
            - call: GET /athletes/${ath_id}
              as: FinanceOfficer
            - call: PATCH /athletes/${ath_id}/tax-profile
              payload: { tax_residency_country: GBR }
              as: FinanceOfficer
            - call: GET /athletes/${ath_id}
              as: AntiDopingLiaison
          assert:
            - "trigger call 1 returns HTTP 201 with every submitted field echoed, version == 1 and created_at == updated_at == \"2026-08-01T00:00:00.000Z\""
            - "trigger call 2 returns HTTP 200 with the identical stored representation — full_name \"Crud Carla\", country_code KEN, whereabouts_filed true, version == 1"
            - "trigger call 3 returns HTTP 200 with w8ben_on_file == true, treaty_withholding_bps == 500 and version == 2 (one increment per write)"
            - "trigger call 4 confirms the patch persisted and that tax_residency_country is still KEN — the PATCH touched only the keys it carried"
            - "trigger call 5 returns tax_residency_country == GBR with w8ben_on_file still true, treaty_withholding_bps still 500 and version == 3"
            - "trigger call 6 shows full_name, country_code, gender, birth_date and whereabouts_filed unchanged from creation — the tax-profile endpoint cannot reach identity or availability fields"

      - name: corner_endpoint_record_submission_conditional_action_gates
        claim_type: conditional_action
        grounds:
          - endpoints[POST /race-results/{id}/record-submission]
          - endpoints[POST /race-results/{id}/record-decision]
          - errors.ERR_RECORD_CLAIM_NOT_ELIGIBLE
          - errors.ERR_INVALID_RECORD_CLAIM_STATE
          - errors.ERR_RESULT_NOT_CERTIFIED
        distinguishing_aspect: >-
          Record submission is a conditional action guarded by three independent predicates that map
          to three different errors: division eligibility (SUB_ELITE and never-raised claims fail at
          priority 15 with 422), claim state (already SUBMITTED or RATIFIED fails at priority 8 with
          409, as does a record-decision on a claim that is not SUBMITTED) and certification
          (a DISQUALIFIED result whose claim was auto-REJECTED fails with ERR_RESULT_NOT_CERTIFIED).
        test_recipe:
          setup:
            - "Edition with all four course_record_* fields null, an ELITE MALE standard (bibs 11..20) and a SUB_ELITE MALE standard (bibs 200..210), one OVERALL MALE place-1 line."
            - "Athletes A (ELITE, 7400 gun), B (ELITE, 7500 gun) and C (SUB_ELITE, 8600 gun) all finish, all three results are certified and the edition results certified — so A and B hold CLAIMED claims and C holds NONE."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Record Gate Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
