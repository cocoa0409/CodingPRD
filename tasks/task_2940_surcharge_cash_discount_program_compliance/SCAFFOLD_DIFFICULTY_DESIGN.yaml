  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rate_at_network_ceiling_passes_and_one_ten_thousandth_over_fails
        grounds:
          - calculations.effective_surcharge_cap
          - calculations.cost_documentation_evaluation
          - validations[priority=110]
          - entities.BrandRateRule.fields.rate_pct
          - errors[ERR_SURCHARGE_CAP_EXCEEDED]
        distinguishing_aspect: |
          A FOUR-DECIMAL PERCENTAGE boundary on POST /surcharge-programs/{id}/rate-rules: with docB
          (documented_cost_pct 3.0500) in AZ (statutory cap 4.0) the binding term is NETWORK_MAX_SURCHARGE_PCT,
          so effective_cap_pct is exactly 3.0; rate_pct 3.0 is accepted (equality passes) and rate_pct 3.0001,
          one ten-thousandth over, is rejected with ERR_SURCHARGE_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Jurisdiction AZ with statutory cap 4.0, one merchant whose only ACTIVE cost documentation is docB (base_mdr 2.55, assessment 0.20, per-item 15 cents, average ticket 5000 -> documented_cost_pct 3.0500)."
            - "One DRAFT SURCHARGE program pinned to docB, so effective_cap_pct == min(3.0500, 4.0, 3.0) == 3.0; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 2.55, assessment_pct: 0.20, per_item_fee_cents: 15, evidence_uri: "s3://acq/az/highcost-2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_b_id: $.data.id }
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_az_id}", cost_documentation_id: "${doc_b_id}", program_type: "SURCHARGE", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
          trigger:
            - call: "POST /surcharge-programs/${prog_id}/rate-rules"
              payload: { brand: "VISA", product_tier: "ALL", rate_pct: 3.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rule_at_cap_id: $.data.id }
            - call: "GET /surcharge-programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /surcharge-programs/${prog_id}/rate-rules"
              payload: { brand: "MASTERCARD", product_tier: "ALL", rate_pct: 3.0001, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_v1}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "CostDocumentation.${doc_b_id}.documented_cost_pct == 3.0500"
            - "SurchargeProgram.${prog_id}.effective_cap_pct == 3.0"
            - "Trigger step 1 returns HTTP 201 and BrandRateRule.${rule_at_cap_id}.rate_pct == 3.0"
            - "Trigger step 3 returns HTTP 422 with response.data.error_id == ERR_SURCHARGE_CAP_EXCEEDED"
            - "GET /brand-rate-rules?program_id=${prog_id} returns total_count == 1"
            - "GET /brand-rate-rules?program_id=${prog_id}&brand=MASTERCARD returns total_count == 0"

      - name: empty_required_artifact_set_activates_while_zero_attested_fails
        grounds:
          - calculations.disclosure_readiness
          - validations[priority=99]
          - errors[ERR_DISCLOSURE_INCOMPLETE]
          - entities.SurchargeProgram.fields.disclosure_ready
          - state_machines.SurchargeProgram.PENDING_REGISTRATION_to_ACTIVE
        distinguishing_aspect: |
          A SET-CARDINALITY boundary on a different endpoint (POST /surcharge-programs/{id}/activate) and a
          different metric than the percentage boundary above: the NY program's required set has three members
          and its satisfied set has zero, so activation fails with ERR_DISCLOSURE_INCOMPLETE, while the AZ
          program's required set is EMPTY and the identical empty satisfied set makes disclosure_ready vacuously
          true, so activation succeeds.
