      - name: a_stale_expected_trip_leg_version_is_rejected_then_the_refreshed_one_passes
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.detail-assignment-create-stale-leg
          - errors.ERR_STALE_TRIP_LEG_VERSION
          - endpoints.POST_/exec-protection/detail-assignments
        distinguishing_aspect: |
          The leg's version advances for a reason that has nothing to do with assignments — an
          advance-work item was recorded — so a client holding the version it saw at leg creation
          is planning coverage against a leg description that has already changed. The rejection is
          412, not 409, and the same request body succeeds unchanged once the client re-reads the
          leg, which is what separates an OCC guard from a state precondition.
        test_recipe:
          setup:
            - "an APPROVED assessment, a DRAFT trip with one PT leg observed at version 1, and one certified agent"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
