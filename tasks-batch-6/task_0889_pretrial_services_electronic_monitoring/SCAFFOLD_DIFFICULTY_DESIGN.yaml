scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_screening_vs_full
        grounds:
          - calculations.risk_score
          - entities.RiskAssessment.fields.raw_score
          - entities.RiskAssessment.fields.recommended_level
        distinguishing_aspect: |
          Two assessments on the same defendant with identical factor inputs but
          instrument_type SCREENING vs FULL yield raw_score 6 vs 17 (recommended_level
          MINIMUM vs MAXIMUM) — the divergence lives on the RiskAssessment entity domain.
        test_recipe:
          setup:
            - "One defendant exists; two assessments authored with identical factors, differing only in instrument_type."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-DV1", full_name: "Dana Vega", date_of_birth: "1990-01-01", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "SCREENING", prior_failures: 1, pending_charges_count: 1, pending_violent_charge: false, employment_status: "UNEMPLOYED", residence_stability: "UNSTABLE", substance_flag: true }
              as: IntakeOfficer
              captures: { a_screen: $.data.id }
            - call: "POST /assessments/${a_screen}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
              captures: { screen_score: $.data.raw_score, screen_level: $.data.recommended_level }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 1, pending_charges_count: 1, pending_violent_charge: false, employment_status: "UNEMPLOYED", residence_stability: "UNSTABLE", substance_flag: true }
              as: IntakeOfficer
              captures: { a_full: $.data.id }
            - call: "POST /assessments/${a_full}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
              captures: { full_score: $.data.raw_score, full_level: $.data.recommended_level }
          assert:
            - "RiskAssessment.${a_screen}.raw_score == 6"
            - "RiskAssessment.${a_screen}.recommended_level == MINIMUM"
            - "RiskAssessment.${a_full}.raw_score == 17"
            - "RiskAssessment.${a_full}.recommended_level == MAXIMUM"

      - name: supervision_fee_assessed_vs_adjusted
        grounds:
          - calculations.supervision_fee
          - entities.LedgerEntry.fields.amount_cents
          - entities.Defendant.fields.indigent
          - entities.Defendant.fields.balance_owed_cents
        distinguishing_aspect: |
          Identical fee inputs (15/10/4) produce a CHARGE amount_cents of 22576 for a
          non-indigent defendant (ASSESSED) vs 10750 for an indigent one (ADJUSTED) —
          a money-domain divergence distinct from the RiskAssessment risk_score variant.
        test_recipe:
          setup:
            - "Two defendants: one non-indigent, one indigent; no prior ledger entries."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-FEE-N", full_name: "Non Indigent", date_of_birth: "1988-02-02", indigent: false }
              as: IntakeOfficer
              captures: { def_non: $.data.id }
            - call: "POST /defendants"
              payload: { case_number: "C-FEE-I", full_name: "Ida Indigent", date_of_birth: "1988-03-03", indigent: true }
              as: IntakeOfficer
              captures: { def_ind: $.data.id }
          trigger:
            - call: "POST /defendants/${def_non}/fees"
              payload: { supervision_days: 15, em_days: 10, scheduled_test_count: 4 }
              as: SupervisingOfficer
              captures: { charge_non: $.data.amount_cents }
            - call: "POST /defendants/${def_ind}/fees"
              payload: { supervision_days: 15, em_days: 10, scheduled_test_count: 4 }
              as: SupervisingOfficer
              captures: { charge_ind: $.data.amount_cents }
          assert:
            - "LedgerEntry ${charge_non} amount_cents == 22576"
            - "LedgerEntry ${charge_ind} amount_cents == 10750"
            - "Defendant.${def_non}.balance_owed_cents == 22576"
            - "Defendant.${def_ind}.balance_owed_cents == 10750"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: recommended_level_tiered_with_override
        grounds:
          - calculations.recommended_level
          - entities.RiskAssessment.fields.pending_violent_charge
        distinguishing_aspect: |
          Mode (a): recommended_level combines a >=3-branch tiered threshold ladder with a
          pending_violent_charge override, so raw_score 0 still yields MAXIMUM when the
          override is true — a non-linear conditional interaction, not a plain sum.
        test_recipe:
          setup:
            - "One defendant; a FULL assessment whose numeric factors are all zero but pending_violent_charge is true."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-OVR1", full_name: "Otis Ver", date_of_birth: "1991-04-04", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, pending_violent_charge: true, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
              captures: { score: $.data.raw_score, level: $.data.recommended_level }
          assert:
            - "RiskAssessment.${a_id}.raw_score == 0"
            - "RiskAssessment.${a_id}.recommended_level == MAXIMUM"

      - name: supervision_fee_round_per_line_then_sum
        grounds:
          - calculations.supervision_fee
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): the ASSESSED fee rounds each of the three lines to whole cents BEFORE
          summing (4838+6988+10750 = 22576); a sum-then-round order would give 22575, so the
          pinned per-line rounding order is observable as a 1-cent difference.
        test_recipe:
          setup:
            - "One non-indigent defendant; a single fee assessment with inputs chosen so two lines end in half-cents."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-RND1", full_name: "Rae Round", date_of_birth: "1987-05-05", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
          trigger:
            - call: "POST /defendants/${def_id}/fees"
              payload: { supervision_days: 15, em_days: 10, scheduled_test_count: 4 }
              as: SupervisingOfficer
              captures: { charge: $.data.amount_cents }
          assert:
            - "LedgerEntry ${charge} amount_cents == 22576"
            - "LedgerEntry ${charge} amount_cents != 22575"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assessment_revision_cycle
        grounds:
          - state_machines.RiskAssessment.DRAFT_to_SUBMITTED
          - state_machines.RiskAssessment.SUBMITTED_to_DRAFT
        distinguishing_aspect: |
          RiskAssessment supports a DRAFT->SUBMITTED->DRAFT->SUBMITTED revision loop (kickback),
          a cycle on the RiskAssessment entity, before any terminal state is reached.
        test_recipe:
          setup:
            - "One defendant; a DRAFT assessment."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-CYC1", full_name: "Cy Loop", date_of_birth: "1992-06-06", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 2, pending_charges_count: 0, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
              captures: { s1: $.data.status }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "DRAFT" }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { s2: $.data.status }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
              captures: { s3: $.data.status, score: $.data.raw_score }
          assert:
            - "RiskAssessment.${a_id}.status == SUBMITTED after the second submit"
            - "RiskAssessment.${a_id}.raw_score == 8"

      - name: violation_branch_sanction_vs_dismiss
        grounds:
          - state_machines.ViolationEvent.UNDER_REVIEW_to_ADJUDICATED_SANCTION
          - state_machines.ViolationEvent.UNDER_REVIEW_to_ADJUDICATED_DISMISS
          - entities.ViolationEvent.fields.severity_points
        distinguishing_aspect: |
          From UNDER_REVIEW the ViolationEvent forks to ADJUDICATED_SANCTION (sets severity_points,
          raises the defendant's cumulative score) or ADJUDICATED_DISMISS (severity_points stays 0,
          score unchanged) — divergent side-effect sets per branch, on a different entity than the
          RiskAssessment cycle.
        test_recipe:
          setup:
            - "One defendant; two MODERATE violations REPORTED by an officer, each moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-BR1", full_name: "Bran Fork", date_of_birth: "1993-07-07", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /violations"
              payload: { defendant_id: "${def_id}", violation_type: "OTHER", severity: "MODERATE" }
              as: SupervisingOfficer
              as_user_id: "u_sup"
              captures: { v_sanc: $.data.id }
            - call: "POST /violations/${v_sanc}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /violations"
              payload: { defendant_id: "${def_id}", violation_type: "OTHER", severity: "MODERATE" }
              as: SupervisingOfficer
              as_user_id: "u_sup"
              captures: { v_dism: $.data.id }
            - call: "POST /violations/${v_dism}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: JudicialOfficer
              as_user_id: "u_judge"
          trigger:
            - call: "POST /violations/${v_sanc}/transition"
              payload: { to_status: "ADJUDICATED_SANCTION" }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { sanc_points: $.data.severity_points }
            - call: "POST /violations/${v_dism}/transition"
              payload: { to_status: "ADJUDICATED_DISMISS" }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { dism_points: $.data.severity_points }
          assert:
            - "ViolationEvent.${v_sanc}.severity_points == 6"
            - "ViolationEvent.${v_dism}.severity_points == 0"
            - "Defendant.${def_id}.cumulative_violation_score == 6"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sanction_escalation_depth3
        grounds:
          - state_machines.ViolationEvent.UNDER_REVIEW_to_ADJUDICATED_SANCTION
          - calculations.cumulative_violation_score
          - entities.Defendant.fields.supervision_level
          - entities.CheckIn.fields.origin
        distinguishing_aspect: |
          Adjudicating a MAJOR sanction recomputes cumulative_violation_score to 10 (link1) which
          crosses ESCALATION_THRESHOLD and escalates Defendant.supervision_level MEDIUM->MAXIMUM
          (link2), which itself creates an ESCALATION CheckIn (link3) — a depth-3 chain.
        test_recipe:
          setup:
            - "An ACTIVE defendant at supervision_level MEDIUM (assessment raw_score 8, released); one MAJOR violation moved to UNDER_REVIEW by an officer distinct from the adjudicator."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-ESC1", full_name: "Esca Late", date_of_birth: "1990-08-08", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 2, pending_charges_count: 0, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "RELEASE", ordered_conditions: ["CHECK_IN", "GPS_MONITORING"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /violations"
              payload: { defendant_id: "${def_id}", violation_type: "NEW_ARREST", severity: "MAJOR" }
              as: SupervisingOfficer
              as_user_id: "u_sup"
              captures: { v_id: $.data.id }
            - call: "POST /violations/${v_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: JudicialOfficer
              as_user_id: "u_judge"
          trigger:
            - call: "POST /violations/${v_id}/transition"
              payload: { to_status: "ADJUDICATED_SANCTION" }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { points: $.data.severity_points }
          assert:
            - "ViolationEvent.${v_id}.severity_points == 10"
            - "Defendant.${def_id}.cumulative_violation_score == 10"
            - "Defendant.${def_id}.supervision_level == MAXIMUM"
            - "GET /defendants/${def_id}/check-ins returns at least one CheckIn with origin == ESCALATION"

      - name: fta_creates_violation_depth2
        grounds:
          - state_machines.CourtEvent.SCHEDULED_to_FTA
          - entities.ViolationEvent.fields.violation_type
          - entities.ViolationEvent.fields.source_ref
        distinguishing_aspect: |
          Marking a CourtEvent FTA (link1) auto-creates a ViolationEvent {violation_type: FTA,
          severity: MAJOR} in REPORTED with source_ref set to the court event (link2) — a depth-2
          cascade from a trigger different than the sanction escalation.
        test_recipe:
          setup:
            - "One defendant; a SCHEDULED court event whose hearing_at plus grace is now in the past."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-FTA1", full_name: "Ft Away", date_of_birth: "1989-09-09", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /court-events"
              payload: { defendant_id: "${def_id}", hearing_at: "2026-06-01T09:00:00Z" }
              as: SupervisingOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /court-events/${ce_id}/transition"
              payload: { to_status: "FTA" }
              as: SupervisingOfficer
              captures: { ce_status: $.data.status }
          assert:
            - "CourtEvent.${ce_id}.status == FTA"
            - "GET /defendants/${def_id}/violations returns exactly one ViolationEvent with violation_type == FTA, status == REPORTED, severity == MAJOR, source_ref == ${ce_id}"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: em_activate_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=12]
        distinguishing_aspect: |
          Activating an EM enrollment when the defendant is not ACTIVE (state,
          ERR_DEFENDANT_NOT_ACTIVE) AND the device pool is exhausted (business_fiscal,
          ERR_NO_DEVICE_AVAILABLE) returns the state error — the {state, business_fiscal} pair.
        test_recipe:
          setup:
            - "A PRETRIAL_PENDING defendant, a device pool with total_units 0, and a PENDING enrollment linking them."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-P5A", full_name: "Pia Pend", date_of_birth: "1990-10-10", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /em-devices"
              payload: { model_name: "GT-Zero", total_units: 0 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /em-enrollments"
              payload: { defendant_id: "${def_id}", device_id: "${dev_id}" }
              as: SupervisingOfficer
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /em-enrollments/${enr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: SupervisingOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_DEFENDANT_NOT_ACTIVE"
            - "response HTTP status == 409"

      - name: drugtest_safety_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Scheduling a drug test when the defendant lacks a DRUG_TESTING ordered condition
          (business_safety, ERR_CONDITION_NOT_ORDERED) AND the site slot is at capacity
          (business_temporal, ERR_SLOT_CAPACITY_EXCEEDED) returns the safety error — the
          {business_safety, business_temporal} pair, distinct from {state, business_fiscal}.
        test_recipe:
          setup:
            - "A site with slot_capacity 1 already holding a SCHEDULED test from defendant A (who has DRUG_TESTING ordered); a second ACTIVE defendant B whose ORDERED release lacks DRUG_TESTING."
          setup_api_calls:
            - call: "POST /testing-sites"
              payload: { name: "Cap1 Site", slot_capacity: 1 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /defendants"
              payload: { case_number: "C-P5B-A", full_name: "Al Filler", date_of_birth: "1985-01-01", indigent: false }
              as: IntakeOfficer
              captures: { def_a: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_a}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_a: $.data.id }
            - call: "POST /assessments/${a_a}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_a}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_a}", assessment_id: "${a_a}", decision: "RELEASE", ordered_conditions: ["DRUG_TESTING"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_a: $.data.id }
            - call: "POST /release-orders/${ro_a}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /drug-tests"
              payload: { defendant_id: "${def_a}", site_id: "${site_id}", test_kind: "DRUG", slot_start: "2026-06-01T09:00:00Z" }
              as: SupervisingOfficer
              captures: { dt_a: $.data.id }
            - call: "POST /defendants"
              payload: { case_number: "C-P5B-B", full_name: "Bo NoCond", date_of_birth: "1986-02-02", indigent: false }
              as: IntakeOfficer
              captures: { def_b: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_b}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_b: $.data.id }
            - call: "POST /assessments/${a_b}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_b}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_b}", assessment_id: "${a_b}", decision: "RELEASE", ordered_conditions: ["CHECK_IN"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_b: $.data.id }
            - call: "POST /release-orders/${ro_b}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
          trigger:
            - call: "POST /drug-tests"
              payload: { defendant_id: "${def_b}", site_id: "${site_id}", test_kind: "DRUG", slot_start: "2026-06-01T09:15:00Z" }
              as: SupervisingOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_CONDITION_NOT_ORDERED"
            - "response HTTP status == 409"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: risk_score_medium_threshold_boundary
        grounds:
          - calculations.recommended_level
          - entities.RiskAssessment.fields.recommended_level
        distinguishing_aspect: |
          raw_score exactly 8 (== T_MED) yields MEDIUM and exactly 16 (== T_MAX) yields MAXIMUM
          (both >= boundaries inclusive), while 6 yields MINIMUM — the threshold boundary on the
          risk-score-to-level ladder reached through POST /assessments/{id}/transition.
        test_recipe:
          setup:
            - "One defendant; three FULL assessments producing raw_score 8, 16, and 6."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-BND1", full_name: "Bea Edge", date_of_birth: "1990-11-11", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 2, pending_charges_count: 0, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_med: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 4, pending_charges_count: 0, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_max: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 1, pending_charges_count: 1, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_min: $.data.id }
          trigger:
            - call: "POST /assessments/${a_med}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
              captures: { med_score: $.data.raw_score, med_level: $.data.recommended_level }
            - call: "POST /assessments/${a_max}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
              captures: { max_score: $.data.raw_score, max_level: $.data.recommended_level }
            - call: "POST /assessments/${a_min}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
              captures: { min_score: $.data.raw_score, min_level: $.data.recommended_level }
          assert:
            - "RiskAssessment.${a_med}.raw_score == 8 and recommended_level == MEDIUM"
            - "RiskAssessment.${a_max}.raw_score == 16 and recommended_level == MAXIMUM"
            - "RiskAssessment.${a_min}.raw_score == 6 and recommended_level == MINIMUM"

      - name: curfew_ping_end_minute_exclusive
        grounds:
          - calculations.curfew_ping_evaluation
          - entities.LocationPing.fields.is_curfew_violation
          - entities.CurfewWindow.fields.end_minute
        distinguishing_aspect: |
          A ping at exactly end_minute (minute 1320 == 22:00) with at_home=false is NOT a curfew
          violation (half-open [start,end)), while a ping at minute 1319 (21:59) is — the exclusive
          upper boundary on POST /em-enrollments/{id}/pings, a different metric/endpoint than the
          risk-score threshold.
        test_recipe:
          setup:
            - "An ACTIVE defendant with an ACTIVE EM enrollment carrying a Monday curfew window [1200,1320)."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-CRF1", full_name: "Cy Fu", date_of_birth: "1990-12-12", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "RELEASE", ordered_conditions: ["GPS_MONITORING", "CURFEW"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /em-devices"
              payload: { model_name: "GT-One", total_units: 1 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /em-enrollments"
              payload: { defendant_id: "${def_id}", device_id: "${dev_id}" }
              as: SupervisingOfficer
              captures: { enr_id: $.data.id, enr_v0: $.data.version }
            - call: "POST /em-enrollments/${enr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: SupervisingOfficer
            - call: "GET /em-enrollments/${enr_id}"
              payload: {}
              as: SupervisingOfficer
              captures: { enr_v1: $.data.version }
            - call: "POST /em-enrollments/${enr_id}/curfew-windows"
              payload: { expected_enrollment_version: "${enr_v1}", day_of_week: 0, start_minute: 1200, end_minute: 1320 }
              as: SupervisingOfficer
          trigger:
            - call: "POST /em-enrollments/${enr_id}/pings"
              payload: { pinged_at: "2026-06-01T22:00:00Z", at_home: false }
              as: SupervisingOfficer
              captures: { end_flag: $.data.is_curfew_violation }
            - call: "POST /em-enrollments/${enr_id}/pings"
              payload: { pinged_at: "2026-06-01T21:59:00Z", at_home: false }
              as: SupervisingOfficer
              captures: { inside_flag: $.data.is_curfew_violation }
          assert:
            - "the ping at 2026-06-01T22:00:00Z has is_curfew_violation == false"
            - "the ping at 2026-06-01T21:59:00Z has is_curfew_violation == true"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: em_activate_requires_defendant_active
        grounds:
          - state_machines.EMEnrollment.PENDING_to_ACTIVE
          - entities.Defendant.fields.supervision_status
        distinguishing_aspect: |
          EMEnrollment PENDING->ACTIVE requires the linked Defendant.supervision_status == ACTIVE;
          a PRETRIAL_PENDING defendant blocks activation with ERR_DEFENDANT_NOT_ACTIVE even though a
          device unit is available — the EMEnrollment->Defendant pair.
        test_recipe:
          setup:
            - "A PRETRIAL_PENDING defendant, a device pool with an available unit, and a PENDING enrollment."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-CE7A", full_name: "Cara Ent", date_of_birth: "1991-01-15", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /em-devices"
              payload: { model_name: "GT-Avail", total_units: 1 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /em-enrollments"
              payload: { defendant_id: "${def_id}", device_id: "${dev_id}" }
              as: SupervisingOfficer
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /em-enrollments/${enr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: SupervisingOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_DEFENDANT_NOT_ACTIVE"
            - "response HTTP status == 409"

      - name: release_order_requires_assessment_approved
        grounds:
          - state_machines.ReleaseOrder.PROPOSED_to_ORDERED
          - entities.RiskAssessment.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          ReleaseOrder PROPOSED->ORDERED requires the linked RiskAssessment.status == APPROVED; a
          SUBMITTED (not-yet-approved) assessment blocks ordering with ERR_ASSESSMENT_NOT_APPROVED —
          the ReleaseOrder->RiskAssessment pair, different from EMEnrollment->Defendant.
        test_recipe:
          setup:
            - "One defendant; an assessment left in SUBMITTED; a PROPOSED release order referencing it."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-CE7B", full_name: "Ray Order", date_of_birth: "1992-02-16", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 1, pending_charges_count: 0, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "RELEASE", ordered_conditions: ["CHECK_IN"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_ASSESSMENT_NOT_APPROVED"
            - "response HTTP status == 409"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: curfew_window_pairwise_overlap
        grounds:
          - validations[priority=9]
          - entities.CurfewWindow.fields.start_minute
          - entities.EMEnrollment.fields.version
        distinguishing_aspect: |
          On one enrollment, a second Monday curfew window [1300,1400) overlapping an existing
          [1200,1320) is rejected ERR_CURFEW_WINDOW_OVERLAP (pairwise half-open interval
          intersection), while an adjacent [1320,1380) is accepted — pairwise geometry on the
          EMEnrollment resource.
        test_recipe:
          setup:
            - "An enrollment (PENDING is sufficient) with one existing Monday curfew window [1200,1320)."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-OV8A", full_name: "Ova Lap", date_of_birth: "1990-03-17", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /em-devices"
              payload: { model_name: "GT-Win", total_units: 1 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /em-enrollments"
              payload: { defendant_id: "${def_id}", device_id: "${dev_id}" }
              as: SupervisingOfficer
              captures: { enr_id: $.data.id, enr_v0: $.data.version }
            - call: "POST /em-enrollments/${enr_id}/curfew-windows"
              payload: { expected_enrollment_version: "${enr_v0}", day_of_week: 0, start_minute: 1200, end_minute: 1320 }
              as: SupervisingOfficer
            - call: "GET /em-enrollments/${enr_id}"
              payload: {}
              as: SupervisingOfficer
              captures: { enr_v1: $.data.version }
          trigger:
            - call: "POST /em-enrollments/${enr_id}/curfew-windows"
              payload: { expected_enrollment_version: "${enr_v1}", day_of_week: 0, start_minute: 1300, end_minute: 1400 }
              as: SupervisingOfficer
              captures: { overlap_err: $.data.error_id }
            - call: "POST /em-enrollments/${enr_id}/curfew-windows"
              payload: { expected_enrollment_version: "${enr_v1}", day_of_week: 0, start_minute: 1320, end_minute: 1380 }
              as: SupervisingOfficer
              captures: { adj_id: $.data.id }
          assert:
            - "the overlapping window attempt returns error_id == ERR_CURFEW_WINDOW_OVERLAP"
            - "the adjacent window [1320,1380) is created (201) with day_of_week == 0"

      - name: drugtest_slot_aggregate_capacity
        grounds:
          - validations[priority=10]
          - entities.TestingSite.fields.slot_capacity
          - entities.DrugTest.fields.slot_start
        distinguishing_aspect: |
          At a site with slot_capacity 1, a second drug test whose [slot_start,slot_end) overlaps an
          existing SCHEDULED test is rejected ERR_SLOT_CAPACITY_EXCEEDED (aggregate count-based
          capacity), while an adjacent test starting at the prior slot_end is accepted — aggregate
          capacity semantics on the TestingSite resource, unlike pairwise curfew geometry.
        test_recipe:
          setup:
            - "A site with slot_capacity 1; one ACTIVE defendant with DRUG_TESTING ordered; a SCHEDULED test at 09:00 (slot 09:00-09:30)."
          setup_api_calls:
            - call: "POST /testing-sites"
              payload: { name: "AggCap Site", slot_capacity: 1 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /defendants"
              payload: { case_number: "C-OV8B", full_name: "Ada Slot", date_of_birth: "1990-04-18", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "RELEASE", ordered_conditions: ["DRUG_TESTING"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /drug-tests"
              payload: { defendant_id: "${def_id}", site_id: "${site_id}", test_kind: "DRUG", slot_start: "2026-06-01T09:00:00Z" }
              as: SupervisingOfficer
              captures: { dt_first: $.data.id }
          trigger:
            - call: "POST /drug-tests"
              payload: { defendant_id: "${def_id}", site_id: "${site_id}", test_kind: "DRUG", slot_start: "2026-06-01T09:15:00Z" }
              as: SupervisingOfficer
              captures: { cap_err: $.data.error_id }
            - call: "POST /drug-tests"
              payload: { defendant_id: "${def_id}", site_id: "${site_id}", test_kind: "DRUG", slot_start: "2026-06-01T09:30:00Z" }
              as: SupervisingOfficer
              captures: { dt_adj: $.data.id }
          assert:
            - "the overlapping 09:15 test returns error_id == ERR_SLOT_CAPACITY_EXCEEDED"
            - "the adjacent 09:30 test is created (201) with status == SCHEDULED"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ledger_charge_reversal_conserves_balance
        grounds:
          - entities.Defendant.fields.balance_owed_cents
          - entities.LedgerEntry.fields.amount_cents
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Assessing a fee (CHARGE +22576) then reversing it (REVERSAL -22576) returns
          Defendant.balance_owed_cents to exactly 0 — the money conservation invariant
          (balance == signed sum of ledger entries).
        test_recipe:
          setup:
            - "One non-indigent defendant; a single assessed fee CHARGE of 22576 cents."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-INV9A", full_name: "Vera Zero", date_of_birth: "1990-05-19", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/fees"
              payload: { supervision_days: 15, em_days: 10, scheduled_test_count: 4 }
              as: SupervisingOfficer
              captures: { charge_id: $.data.id, charge_amt: $.data.amount_cents }
          trigger:
            - call: "POST /defendants/${def_id}/ledger-entries"
              payload: { entry_type: "REVERSAL", reverses_entry_id: "${charge_id}" }
              as: ProgramAdmin
              captures: { rev_amt: $.data.amount_cents }
          assert:
            - "the CHARGE amount_cents == 22576 and the REVERSAL amount_cents == -22576"
            - "Defendant.${def_id}.balance_owed_cents == 0 after the reversal"

      - name: device_assign_return_conserves_units
        grounds:
          - entities.EMDevice.fields.available_units
          - state_machines.EMEnrollment.PENDING_to_ACTIVE
          - state_machines.EMEnrollment.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Activating an enrollment (available_units 1->0) then terminating it (0->1) restores
          EMDevice.available_units to its original total_units — the device-unit conservation
          invariant, a different conserved quantity than money.
        test_recipe:
          setup:
            - "An ACTIVE defendant with GPS_MONITORING ordered; a device pool total_units 1; a PENDING enrollment on it."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-INV9B", full_name: "Del Unit", date_of_birth: "1990-06-20", indigent: false }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, pending_violent_charge: false, employment_status: "EMPLOYED", residence_stability: "STABLE", substance_flag: false }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeOfficer
              as_user_id: "u_intake"
            - call: "POST /assessments/${a_id}/transition"
              payload: { to_status: "APPROVED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /release-orders"
              payload: { defendant_id: "${def_id}", assessment_id: "${a_id}", decision: "RELEASE", ordered_conditions: ["GPS_MONITORING"] }
              as: JudicialOfficer
              as_user_id: "u_judge"
              captures: { ro_id: $.data.id }
            - call: "POST /release-orders/${ro_id}/transition"
              payload: { to_status: "ORDERED" }
              as: JudicialOfficer
              as_user_id: "u_judge"
            - call: "POST /em-devices"
              payload: { model_name: "GT-Cons", total_units: 1 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /em-enrollments"
              payload: { defendant_id: "${def_id}", device_id: "${dev_id}" }
              as: SupervisingOfficer
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /em-enrollments/${enr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: SupervisingOfficer
            - call: "GET /em-devices/${dev_id}"
              payload: {}
              as: SupervisingOfficer
              captures: { avail_after_activate: $.data.available_units }
            - call: "POST /em-enrollments/${enr_id}/transition"
              payload: { to_status: "TERMINATED" }
              as: SupervisingOfficer
            - call: "GET /em-devices/${dev_id}"
              payload: {}
              as: SupervisingOfficer
              captures: { avail_after_terminate: $.data.available_units }
          assert:
            - "EMDevice.${dev_id}.available_units == 0 after activate"
            - "EMDevice.${dev_id}.available_units == 1 after terminate (== total_units)"
