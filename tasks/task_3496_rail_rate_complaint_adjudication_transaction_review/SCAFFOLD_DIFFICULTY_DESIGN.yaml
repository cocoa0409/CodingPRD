            - "after escalation: ServiceComplaint.${sc1}.status == ESCALATED"
            - "second decide succeeds: ReciprocalSwitchingPetition.${p1}.status == GRANTED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: second_active_eso_on_same_carrier_rejected
        grounds:
          - validations[priority=16]
          - state_machines.ServiceComplaint.OPEN_to_ESCALATED
        distinguishing_aspect: "Closed-interval capacity-1 semantics on the Carrier resource: while ESO1 is ACTIVE (2026-09-01 .. 2026-10-01 inclusive of its expiry instant), escalating a second complaint against the same carrier is refused with ERR_ESO_ALREADY_ACTIVE regardless of territory."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier CSXT exists. Two OPEN service complaints SC1 (CAR_SUPPLY) and SC2 (DELAY) against CSXT."
          setup_api_calls:
