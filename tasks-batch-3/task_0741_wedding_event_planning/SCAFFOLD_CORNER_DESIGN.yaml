# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction-guide's nine sections. Every active
# instance carries an executable setup_api_calls/trigger chain against §1.5;
# corners already covered by a §1.8 instance are emitted as excluded_because
# stubs (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_event_returns_201_with_envelope
        claim_type: creation
        grounds: [entities.EventProject, endpoints]
        distinguishing_aspect: "POST /planning/events with all required fields returns 201, response_type object, data.id present, status DRAFT, version 1, computed budget/headcount fields 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /planning/events"
              payload: { couple_names: "A & B", event_date: "2026-09-15T00:00:00Z", venue_name: "Hall", package_type: "FULL", total_budget_cents: 9000000, guest_count_estimate: 100 }
              as: Planner
              captures: { ev_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "HTTP 201; response_type == object"
            - "EventProject.${ev_id}.status == DRAFT"
            - "EventProject.${ev_id}.version == 1"
            - "EventProject.${ev_id}.committed_spend_cents == 0 and budget_balance_cents == 9000000"

      - name: event_system_fields_generated
        claim_type: system_fields
        grounds: [entities.EventProject.fields.status, entities.EventProject.fields.version]
        distinguishing_aspect: "id/created_at/updated_at/version and status are server-minted; client cannot set them (not in input) — id is a UUID with no type prefix and version starts at 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /planning/events"
              payload: { couple_names: "C & D", event_date: "2026-09-15T00:00:00Z", venue_name: "Loft", package_type: "DAY_OF", total_budget_cents: 2000000, guest_count_estimate: 40 }
              as: Planner
              captures: { ev_id: $.data.id, ca: $.data.created_at }
          assert:
            - "EventProject.${ev_id}.id is a bare UUID (no prefix)"
            - "EventProject.${ev_id}.created_at is ISO 8601 UTC with three fractional digits"
            - "EventProject.${ev_id}.status == DRAFT (system-set, not client input)"

      - name: guest_meal_choice_defaults_none
        claim_type: defaults
        grounds: [entities.Guest.fields.meal_choice]
        distinguishing_aspect: "Omitting meal_choice on guest create applies the default NONE."
        test_recipe:
          setup: ["One event exists."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "E & F", event_date: "2026-09-15T00:00:00Z", venue_name: "Barn", package_type: "PARTIAL", total_budget_cents: 3000000, guest_count_estimate: 30 }
              as: Planner
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "G", party_size: 2 }
              as: Planner
              captures: { g: $.data.id, mc: $.data.meal_choice }
          assert:
            - "Guest.${g}.meal_choice == NONE"
            - "Guest.${g}.rsvp_status == INVITED"

      - name: create_event_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: [entities.EventProject.fields.total_budget_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required total_budget_cents yields ERR_VALIDATION (400), no event created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /planning/events"
              payload: { couple_names: "H & I", event_date: "2026-09-15T00:00:00Z", venue_name: "X", package_type: "FULL", guest_count_estimate: 50 }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION (HTTP 400)"

      - name: create_event_invalid_package_enum_returns_validation
        claim_type: type_constraints
        grounds: [entities.EventProject.fields.package_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "package_type outside {FULL,PARTIAL,DAY_OF} (e.g. GOLD) yields ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /planning/events"
              payload: { couple_names: "J & K", event_date: "2026-09-15T00:00:00Z", venue_name: "X", package_type: "GOLD", total_budget_cents: 5000000, guest_count_estimate: 50 }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION (HTTP 400)"

      - name: list_guests_by_event_paginated
        claim_type: listing
        grounds: [entities.Guest, endpoints]
        distinguishing_aspect: "GET /planning/guests filtered by event_id returns an array envelope with pagination fields total_count and has_more honoring limit."
        test_recipe:
          setup: ["One event with 2 guests."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "L & M", event_date: "2026-09-15T00:00:00Z", venue_name: "Club", package_type: "PARTIAL", total_budget_cents: 3000000, guest_count_estimate: 20 }
              as: Planner
              captures: { ev_id: $.data.id }
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "G1", party_size: 2 }
              as: Planner
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "G2", party_size: 3 }
              as: Planner
          trigger:
            - call: "GET /planning/guests"
              payload: { event_id: "${ev_id}", limit: 1, offset: 0 }
              as: Planner
          assert:
            - "response_type == array; total_count == 2; has_more == true; exactly 1 item returned"

      - name: get_event_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent event id returns ERR_EVENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /planning/events/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EVENT_NOT_FOUND (HTTP 404)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: send_contract_not_draft_returns_conflict
        claim_type: invalid_transition
        grounds: [state_machines.Contract.DRAFT_to_SENT, "errors[ERR_CONTRACT_NOT_DRAFT]"]
        distinguishing_aspect: "Sending an already-SENT contract returns ERR_CONTRACT_NOT_DRAFT (409)."
        test_recipe:
          setup: ["Event with a contract already SENT."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "N & O", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 8000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
          trigger:
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONTRACT_NOT_DRAFT (HTTP 409)"

      - name: sign_contract_not_sent_returns_conflict
        claim_type: invalid_transition
        grounds: [state_machines.Contract.SENT_to_SIGNED, "errors[ERR_CONTRACT_NOT_SENT]"]
        distinguishing_aspect: "Signing a DRAFT (not yet SENT) contract returns ERR_CONTRACT_NOT_SENT (409)."
        test_recipe:
          setup: ["Event with a contract still DRAFT."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "P & Q", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 8000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
          trigger:
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONTRACT_NOT_SENT (HTTP 409)"

      - name: countersign_contract_not_signed_returns_conflict
        claim_type: invalid_transition
        grounds: [state_machines.Contract.SIGNED_to_COUNTERSIGNED, "errors[ERR_CONTRACT_NOT_SIGNED]"]
        distinguishing_aspect: "Countersigning a merely SENT contract returns ERR_CONTRACT_NOT_SIGNED (409)."
        test_recipe:
          setup: ["Event with a contract SENT (not signed)."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "R & S", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 8000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
          trigger:
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONTRACT_NOT_SIGNED (HTTP 409)"

      - name: verify_coi_not_pending_returns_conflict
        claim_type: invalid_transition
        grounds: [state_machines.COI.PENDING_to_VERIFIED, "errors[ERR_COI_NOT_PENDING]"]
        distinguishing_aspect: "Verifying an already-VERIFIED COI returns ERR_COI_NOT_PENDING (409)."
        test_recipe:
          setup: ["A vendor with a VERIFIED COI."]
          setup_api_calls:
            - call: "POST /planning/vendors"
              payload: { name: "V", category: "PHOTO", contact_email: "v@x.com" }
              as: Planner
              captures: { vd_id: $.data.id }
            - call: "POST /planning/cois"
              payload: { vendor_id: "${vd_id}", policy_number: "P", coverage_amount_cents: 1000000, coverage_expiry_date: "2027-01-01T00:00:00Z" }
              as: Planner
              captures: { coi_id: $.data.id }
            - call: "POST /planning/cois/${coi_id}/verify"
              payload: {}
              as: Planner
          trigger:
            - call: "POST /planning/cois/${coi_id}/verify"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COI_NOT_PENDING (HTTP 409)"

      - name: verify_expired_coi_returns_422
        claim_type: invalid_transition
        grounds: [state_machines.COI.PENDING_to_VERIFIED, "errors[ERR_COI_EXPIRED]"]
        distinguishing_aspect: "Verifying a still-PENDING COI whose coverage_expiry_date (2026-02-01) is at/before the current clock (default 2026-03-01) returns ERR_COI_EXPIRED (422)."
        test_recipe:
          setup: ["Vendor with a PENDING COI expiring 2026-02-01; the clock is left at the default 2026-03-01 (no set_current_utc call, so no sweep runs and the COI is still PENDING at verify time)."]
          setup_api_calls:
            - call: "POST /planning/vendors"
              payload: { name: "V2", category: "FLORAL", contact_email: "v2@x.com" }
              as: Planner
              captures: { vd_id: $.data.id }
            - call: "POST /planning/cois"
              payload: { vendor_id: "${vd_id}", policy_number: "P", coverage_amount_cents: 1000000, coverage_expiry_date: "2026-02-01T00:00:00Z" }
              as: Planner
              captures: { coi_id: $.data.id }
          trigger:
            - call: "POST /planning/cois/${coi_id}/verify"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COI_EXPIRED (HTTP 422) — the PENDING COI's expiry 2026-02-01 is before the clock 2026-03-01"

      - name: confirm_event_not_draft_returns_conflict
        claim_type: invalid_transition
        grounds: [state_machines.EventProject.DRAFT_to_BOOKING, "errors[ERR_EVENT_NOT_DRAFT]"]
        distinguishing_aspect: "Confirming an event already in BOOKING returns ERR_EVENT_NOT_DRAFT (409)."
        test_recipe:
          setup: ["Event already confirmed to BOOKING (contract COUNTERSIGNED)."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "T & U", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 8000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Planner
            - call: "POST /planning/events/${ev_id}/confirm"
              payload: {}
              as: Planner
          trigger:
            - call: "POST /planning/events/${ev_id}/confirm"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EVENT_NOT_DRAFT (HTTP 409)"

      - name: complete_event_not_booking_returns_conflict
        claim_type: invalid_transition
        grounds: [state_machines.EventProject.BOOKING_to_COMPLETED, "errors[ERR_EVENT_NOT_BOOKING]"]
        distinguishing_aspect: "Completing an event still in DRAFT returns ERR_EVENT_NOT_BOOKING (409)."
        test_recipe:
          setup: ["A fresh DRAFT event."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "V & W", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 8000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /planning/events/${ev_id}/complete"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EVENT_NOT_BOOKING (HTTP 409)"

      - name: complete_before_event_date_returns_conflict
        claim_type: invalid_transition
        grounds: [state_machines.EventProject.BOOKING_to_COMPLETED, "errors[ERR_EVENT_DATE_NOT_REACHED]"]
        distinguishing_aspect: "Completing a BOOKING event while the logical clock (default 2026-03-01) is before event_date (2026-09-15) returns ERR_EVENT_DATE_NOT_REACHED (409)."
        test_recipe:
          setup: ["Event BOOKING; clock left at default 2026-03-01 (before event_date)."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "X & Y", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 8000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Planner
            - call: "POST /planning/events/${ev_id}/confirm"
              payload: {}
              as: Planner
          trigger:
            - call: "POST /planning/events/${ev_id}/complete"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EVENT_DATE_NOT_REACHED (HTTP 409)"

      - name: complete_with_proposed_booking_returns_unresolved
        claim_type: invalid_transition
        grounds: [state_machines.EventProject.BOOKING_to_COMPLETED, "errors[ERR_UNRESOLVED_BOOKINGS]"]
        distinguishing_aspect: "Completing a BOOKING event after the event date while a VendorBooking is still PROPOSED returns ERR_UNRESOLVED_BOOKINGS (409)."
        test_recipe:
          setup: ["Event BOOKING with one PROPOSED booking; clock advanced to 2026-09-16 (after event_date)."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "Z & A", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 8000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Planner
            - call: "POST /planning/events/${ev_id}/confirm"
              payload: {}
              as: Planner
            - call: "POST /planning/vendors"
              payload: { name: "Vx", category: "OTHER", contact_email: "vx@x.com" }
              as: Planner
              captures: { vd_id: $.data.id }
            - call: "POST /planning/vendor-bookings"
              payload: { event_id: "${ev_id}", vendor_id: "${vd_id}", service_description: "TBD", estimated_cost_cents: 500000 }
              as: Planner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: Planner
          trigger:
            - call: "POST /planning/events/${ev_id}/complete"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNRESOLVED_BOOKINGS (HTTP 409)"

      - name: cancel_already_cancelled_event_returns_not_cancellable
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EventProject.BOOKING_to_CANCELLED, "errors[ERR_EVENT_NOT_CANCELLABLE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel returns ERR_EVENT_NOT_CANCELLABLE (409); no side effects re-fire."
        test_recipe:
          setup: ["A DRAFT event that has been cancelled once."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "B & C", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "DAY_OF", total_budget_cents: 2000000, guest_count_estimate: 30 }
              as: Planner
              captures: { ev_id: $.data.id }
            - call: "POST /planning/events/${ev_id}/cancel"
              payload: {}
              as: Planner
          trigger:
            - call: "POST /planning/events/${ev_id}/cancel"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EVENT_NOT_CANCELLABLE (HTTP 409)"

      - name: book_already_booked_returns_not_proposed
        claim_type: invalid_transition
        grounds: [state_machines.VendorBooking.PROPOSED_to_BOOKED, "errors[ERR_BOOKING_NOT_PROPOSED]"]
        distinguishing_aspect: "Booking a booking already in BOOKED returns ERR_BOOKING_NOT_PROPOSED (409)."
        test_recipe:
          setup: ["Event BOOKING; vendor VERIFIED COI; a booking already BOOKED."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "D & E", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 10000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Planner
            - call: "POST /planning/events/${ev_id}/confirm"
              payload: {}
              as: Planner
            - call: "POST /planning/vendors"
              payload: { name: "Vb", category: "CATERING", contact_email: "vb@x.com" }
              as: Planner
              captures: { vd_id: $.data.id }
            - call: "POST /planning/cois"
              payload: { vendor_id: "${vd_id}", policy_number: "P", coverage_amount_cents: 100000000, coverage_expiry_date: "2027-01-01T00:00:00Z" }
              as: Planner
              captures: { coi_id: $.data.id }
            - call: "POST /planning/cois/${coi_id}/verify"
              payload: {}
              as: Planner
            - call: "POST /planning/vendor-bookings"
              payload: { event_id: "${ev_id}", vendor_id: "${vd_id}", service_description: "Food", estimated_cost_cents: 1000000 }
              as: Planner
              captures: { vb: $.data.id }
            - call: "POST /planning/vendor-bookings/${vb}/book"
              payload: { contracted_cost_cents: 1000000 }
              as: Planner
          trigger:
            - call: "POST /planning/vendor-bookings/${vb}/book"
              payload: { contracted_cost_cents: 1000000 }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BOOKING_NOT_PROPOSED (HTTP 409)"

      - name: pay_already_paid_returns_not_scheduled
        claim_type: invalid_transition
        grounds: [state_machines.VendorPayment.SCHEDULED_to_PAID, "errors[ERR_PAYMENT_NOT_SCHEDULED]"]
        distinguishing_aspect: "Paying an already-PAID payment returns ERR_PAYMENT_NOT_SCHEDULED (409)."
        test_recipe:
          setup: ["A booked booking whose DEPOSIT payment has been PAID."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "F & G", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 10000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
