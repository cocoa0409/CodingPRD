              as: PayrollAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-C6", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-03-01" }
              as: TransportManager
              captures: { driver_id: $.data.id, score_0: $.data.safety_score, hold_0: $.data.coaching_hold }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-C6", domicile_id: "${dom_id}", odometer_miles: 50000, pm_interval_miles: 25000, pm_last_service_odometer: 40000 }
              as: MaintenanceCoordinator
              captures: { tractor_id: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "TL-C6", domicile_id: "${dom_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { trailer_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-C6", domicile_id: "${dom_id}", planned_start_at: "2026-08-20T06:00:00Z" }
              as: FleetPlanner
              captures: { trip_id: $.data.id }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${driver_id}", event_type: "SEATBELT", severity: 3, occurred_at: "2026-07-10T14:00:00Z" }
              as: SafetyManager
              captures: { ev_12: $.data.id }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${driver_id}", event_type: "HARD_BRAKE", severity: 3, occurred_at: "2026-07-11T14:00:00Z" }
              as: SafetyManager
              captures: { ev_6a: $.data.id }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${driver_id}", event_type: "FOLLOWING_DISTANCE", severity: 3, occurred_at: "2026-07-12T14:00:00Z" }
              as: SafetyManager
              captures: { ev_6b: $.data.id }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${driver_id}", event_type: "SPEEDING", severity: 2, occurred_at: "2026-07-13T14:00:00Z" }
              as: SafetyManager
              captures: { ev_6c: $.data.id }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${driver_id}", event_type: "SEATBELT", severity: 1, occurred_at: "2026-07-14T14:00:00Z" }
              as: SafetyManager
              captures: { ev_4: $.data.id, ev_4_points: $.data.penalty_points }
          trigger:
            - call: "GET /fleet/drivers/${driver_id}"
              payload: {}
              as: SafetyManager
              captures: { points_34: $.data.open_penalty_points, score_66: $.data.safety_score, hold_66: $.data.coaching_hold }
            - call: "POST /fleet/trips/${trip_id}/assignments"
              payload: { driver_id: "${driver_id}", tractor_id: "${tractor_id}", trailer_id: "${trailer_id}" }
              as: TransportManager
              captures: { err_66: $.data.error_id }
            - call: "POST /fleet/telematics-events/${ev_4}/coach"
              payload: { coaching_note: "Belt reminder" }
              as: SafetyManager
              captures: { coached_4: $.data.coached }
            - call: "GET /fleet/drivers/${driver_id}"
              payload: {}
              as: SafetyManager
              captures: { points_30: $.data.open_penalty_points, score_70: $.data.safety_score, hold_70: $.data.coaching_hold }
            - call: "POST /fleet/trips/${trip_id}/assignments"
              payload: { driver_id: "${driver_id}", tractor_id: "${tractor_id}", trailer_id: "${trailer_id}" }
              as: TransportManager
              captures: { err_70: $.data.error_id }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${driver_id}", event_type: "FOLLOWING_DISTANCE", severity: 1, occurred_at: "2026-07-30T14:00:00Z" }
              as: SafetyManager
              captures: { ev_2: $.data.id, ev_2_points: $.data.penalty_points }
            - call: "GET /fleet/drivers/${driver_id}"
              payload: {}
              as: SafetyManager
              captures: { points_32: $.data.open_penalty_points, score_68: $.data.safety_score, hold_68: $.data.coaching_hold }
            - call: "POST /fleet/trips/${trip_id}/assignments"
              payload: { driver_id: "${driver_id}", tractor_id: "${tractor_id}", trailer_id: "${trailer_id}" }
              as: TransportManager
              captures: { err_68: $.data.error_id }
            - call: "POST /fleet/telematics-events/${ev_12}/coach"
              payload: {}
              as: SafetyManager
            - call: "POST /fleet/telematics-events/${ev_6a}/coach"
              payload: {}
              as: SafetyManager
            - call: "POST /fleet/telematics-events/${ev_6b}/coach"
              payload: {}
              as: SafetyManager
            - call: "POST /fleet/telematics-events/${ev_6c}/coach"
              payload: {}
              as: SafetyManager
            - call: "POST /fleet/telematics-events/${ev_2}/coach"
              payload: {}
              as: SafetyManager
              captures: { last_coached: $.data.coached }
            - call: "GET /fleet/drivers/${driver_id}"
              payload: {}
              as: SafetyManager
              captures: { points_0: $.data.open_penalty_points, score_100: $.data.safety_score, hold_100: $.data.coaching_hold }
            - call: "POST /fleet/trips/${trip_id}/assignments"
              payload: { driver_id: "${driver_id}", tractor_id: "${tractor_id}", trailer_id: "${trailer_id}" }
              as: TransportManager
              captures: { assigned: $.data.driver_id }
          assert:
            - "${score_0} == 100 and ${hold_0} == false on a fresh driver; ${ev_4_points} == 4 and ${ev_2_points} == 2"
            - "${points_34} == 34, ${score_66} == 66, ${hold_66} == true and ${err_66} == ERR_DRIVER_COACHING_HOLD"
            - "${coached_4} == true, ${points_30} == 30, ${score_70} == 70 and ${hold_70} == false - a score of exactly 70 is NOT a hold, because the comparison is strictly less-than"
            - "${err_70} == ERR_DRIVER_SAFETY_INELIGIBLE with HTTP 422 - the hold cleared but 70 < 80, so the same endpoint reports the other code"
            - "${points_32} == 32, ${score_68} == 68, ${hold_68} == true and ${err_68} == ERR_DRIVER_COACHING_HOLD - one 2-point event re-arms the trigger"
            - "${last_coached} == true, ${points_0} == 0, ${score_100} == 100 and ${hold_100} == false - retiring every point resets the curve"
            - "${assigned} == ${driver_id} with HTTP 200 once the score is back above both thresholds"

      - name: pay_variant_switch_writes_the_final_number_not_the_planned_one
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: trip_pay_planned_accrual_vs_final_settlement_diverge_by_detention
          rationale: "That §1.8 instance already exercises both variants on one trip and the switch at completion end to end: PLANNED_ACCRUAL previews 27194 with hourly 0, FINAL_SETTLEMENT previews 28244 with hourly 1050, Trip.planned_pay_cents keeps the planned figure while Trip.driver_pay_cents and the single persisted DriverPayStatement carry the final one, and it asserts that no statement is ever persisted with variant PLANNED_ACCRUAL. A corner instance would re-run the same divergence with smaller numbers."
      - name: benchmark_variant_selection_is_the_caller_s_choice_on_the_same_window
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: domicile_benchmark_fully_allocated_vs_incremental_variable_diverge
          rationale: "That §1.8 instance reads one identical window under both variants and pins the delta to window_days * (fixed_ownership_cents_per_day + overhead_cents_per_day), including the day-count clamp, so variant selection and variant divergence for the benchmark are already covered; the corner-level residue (every declared field of the read, and the zero-volume guard) is covered by the_cost_benchmark_read_reports_every_declared_field_on_a_half_open_window."

  - section: consistency_model
    instances:
      - name: every_cascade_is_visible_in_the_body_of_the_call_that_caused_it
        claim_type: immediate consistency
        grounds:
          - consistency_model
          - endpoints[POST /fleet/trips/{trip_id}/plan]
          - endpoints[POST /fleet/trips/{trip_id}/complete]
        distinguishing_aspect: "Consistency is immediate, so no derived value may lag behind the write that caused it: the plan response already carries the pinned plan and the planned pay, the completion response already carries the final pay and ACCRUED settlement, and every follow-up read - store ledger, order status, tractor odometer, driver ledgers, statement row - returns exactly the value the write response implied, on the very first read, with no repetition or delay."
        test_recipe:
          setup:
            - "TRIP-C7 is a staffed DRAFT trip with one 600-case DELIVERY stop at S-6270; pay plan MILE-Z pays 80/mile and 2000/stop with no guarantee, so a trip run exactly to plan is worth 8000 + 2000 = 10000 under both variants."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-C7", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-Z", mileage_cents_per_mile: 80, stop_cents_per_stop: 2000, drop_hook_cents: 1400, hourly_cents_per_minute: 40, minimum_daily_cents: 0, backhaul_bonus_pct: 0.04 }
              as: PayrollAnalyst
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /fleet/stores"
              payload: { store_code: "S-6270", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-C7", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-03-01" }
              as: TransportManager
              captures: { driver_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-C7", domicile_id: "${dom_id}", odometer_miles: 50000, pm_interval_miles: 25000, pm_last_service_odometer: 40000 }
              as: MaintenanceCoordinator
              captures: { tractor_id: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "TL-C7", domicile_id: "${dom_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { trailer_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_id}", cases: 600, weight_lbs: 13200, requested_window_start: "2026-08-20T06:00:00Z", requested_window_end: "2026-08-20T18:00:00Z", temperature_mode: "DRY", priority: 1 }
              as: FleetPlanner
              captures: { order_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-C7", domicile_id: "${dom_id}", planned_start_at: "2026-08-20T06:00:00Z" }
              as: FleetPlanner
              captures: { trip_id: $.data.id }
            - call: "POST /fleet/trips/${trip_id}/stops"
              payload: { sequence: 1, stop_type: "DELIVERY", store_id: "${store_id}", replenishment_order_id: "${order_id}", scheduled_arrival_at: "2026-08-20T08:00:00Z", scheduled_departure_at: "2026-08-20T09:15:00Z", drive_minutes_from_prev: 120, miles_from_prev: 100, segment_loaded: true, cases: 600 }
              as: FleetPlanner
              captures: { stop_id: $.data.id, stop_service: $.data.service_minutes }
            - call: "GET /fleet/trips/${trip_id}"
              payload: {}
              as: FleetPlanner
              captures: { t_duty: $.data.planned_duty_minutes, t_miles: $.data.total_miles }
            - call: "POST /fleet/trips/${trip_id}/assignments"
              payload: { driver_id: "${driver_id}", tractor_id: "${tractor_id}", trailer_id: "${trailer_id}" }
              as: TransportManager
          trigger:
            - call: "POST /fleet/trips/${trip_id}/plan"
              payload: {}
              as: FleetPlanner
              captures: { plan_body_status: $.data.plan_status, plan_body_pay: $.data.planned_pay_cents, plan_body_pin: $.data.pinned_pay_plan_id, plan_body_pin_v: $.data.pinned_pay_plan_version }
            - call: "GET /fleet/replenishment-orders/${order_id}"
              payload: {}
              as: FleetPlanner
              captures: { order_now: $.data.status }
            - call: "GET /fleet/stores/${store_id}"
              payload: {}
              as: FleetPlanner
              captures: { store_open_now: $.data.open_scheduled_cases }
            - call: "POST /fleet/trips/${trip_id}/dispatch"
              payload: {}
              as: TransportManager
              captures: { disp_status: $.data.plan_status }
            - call: "POST /fleet/trip-stops/${stop_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${driver_id}"
              captures: { stop_arrived: $.data.status }
            - call: "GET /fleet/trips/${trip_id}"
              payload: {}
              as: TransportManager
              captures: { trip_bubbled: $.data.plan_status }
            - call: "POST /fleet/trip-stops/${stop_id}/complete"
              payload: { cases_handled: 600 }
              as: Driver
              as_user_id: "${driver_id}"
              captures: { stop_done: $.data.status }
            - call: "POST /fleet/trips/${trip_id}/complete"
              payload: { actual_drive_minutes: 120, actual_duty_minutes: 195 }
              as: TransportManager
              captures: { done_body_plan: $.data.plan_status, done_body_settle: $.data.settlement_status, done_body_pay: $.data.driver_pay_cents, done_body_delivered: $.data.delivered_cases }
            - call: "GET /fleet/pay-statements"
              payload: { trip_id: "${trip_id}", limit: 10, offset: 0 }
              as: PayrollAnalyst
              captures: { stmt_gross: "$.data[0].gross_cents", stmt_status: "$.data[0].status", stmt_variant: "$.data[0].variant" }
            - call: "GET /fleet/tractors/${tractor_id}"
              payload: {}
              as: MaintenanceCoordinator
              captures: { odo_now: $.data.odometer_miles, msp_now: $.data.miles_since_pm, tr_now: $.data.status }
            - call: "GET /fleet/drivers/${driver_id}"
              payload: {}
              as: PayrollAnalyst
              captures: { drv_ytd_now: $.data.ytd_gross_cents, drv_duty_now: $.data.duty_minutes_used_today }
            - call: "GET /fleet/domiciles/${dom_id}"
              payload: {}
              as: PayrollAnalyst
              captures: { dom_accrued_now: $.data.accrued_pay_cents }
            - call: "GET /fleet/replenishment-orders/${order_id}"
              payload: {}
              as: FleetPlanner
              captures: { order_after: $.data.status }
            - call: "GET /fleet/stores/${store_id}"
              payload: {}
              as: FleetPlanner
              captures: { store_open_after: $.data.open_scheduled_cases, store_del_after: $.data.delivered_cases_total }
          assert:
            - "${stop_service} == 75 is already in the body of the stop append, and the trip aggregates ${t_duty} == 195 and ${t_miles} == 100 are correct on the first read that follows it"
            - "${plan_body_status} == PLANNED with ${plan_body_pay} == 10000, ${plan_body_pin} == ${plan_id} and ${plan_body_pin_v} == ${plan_v} - the pin and the price are in the response that created them"
            - "${order_now} == SCHEDULED and ${store_open_now} == 600 on the FIRST read after the plan call - no lag"
            - "${disp_status} == DISPATCHED, ${stop_arrived} == ARRIVED and ${trip_bubbled} == IN_PROGRESS - the parent's bubble-up is observable immediately after the child's arrival"
            - "${stop_done} == COMPLETED, then ${done_body_plan} == COMPLETED, ${done_body_settle} == ACCRUED, ${done_body_pay} == 10000 and ${done_body_delivered} == 600 all in the completion response itself"
            - "${stmt_gross} == 10000 == ${done_body_pay} with ${stmt_status} == ACCRUED and ${stmt_variant} == FINAL_SETTLEMENT - the statement exists on the first read"
            - "${odo_now} == 50100, ${msp_now} == 10100 and ${tr_now} == AVAILABLE"
            - "${drv_ytd_now} == 10000, ${drv_duty_now} == 195 and ${dom_accrued_now} == 10000"
            - "${order_after} == DELIVERED, ${store_open_after} == 0 and ${store_del_after} == 600"
            - "every one of these reads is performed exactly once and no assertion requires a retry, a delay or a second read"
