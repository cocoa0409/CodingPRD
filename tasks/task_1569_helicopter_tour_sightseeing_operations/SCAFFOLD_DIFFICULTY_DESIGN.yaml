# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_1569 (§1.8 Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: manifest_provisional_estimate_vs_final_actual
        grounds:
          - calculations.manifest_estimate
          - calculations.manifest_final_wb
          - entities.Flight.fields.estimated_gross_weight_lb
          - entities.Flight.fields.actual_gross_weight_lb
        distinguishing_aspect: |
          Two valid weight algorithms over the SAME passenger set produce different pounds:
          the provisional estimate (declared_weight_lb + 5 allowance, FULL fuel) reads 2540 lb
          while the final manifest (actual scale weights, fuel trimmed against MTOW) reads 2480 lb.
          Entity domain: Flight/Aircraft weight-and-balance.
        test_recipe:
          setup:
            - "Base with waiver WAV-1; route R1 SHORT 25 min, base 25000, fuel 300 lb, not noise-sensitive"
            - "Aircraft A1: 4 seats, arms [40,40,80,80], empty 1500 lb / moment 82500, MTOW 2600, fuel arm 60, CG envelope [52, 57], QUIET"
            - "Flight dep 2026-08-03T14:00:00Z (Monday); booking with 4 passengers declared 180 lb each"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 180 }, { full_name: "P1", declared_weight_lb: 180 }, { full_name: "P2", declared_weight_lb: 180 }, { full_name: "P3", declared_weight_lb: 180 } ] }
              as: BookingAgent
              captures: { booking_id: $.data.id }
            - call: "GET /flights/${flight_id}"
              as: Dispatcher
              captures: { est_gross: $.data.estimated_gross_weight_lb }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { card_amount_cents: 100000 }
              as: BookingAgent
            - call: "GET /passengers?booking_id=${booking_id}"
              as: BookingAgent
              captures: { px0: "$.data[0].id", px1: "$.data[1].id", px2: "$.data[2].id", px3: "$.data[3].id" }
            - { call: "POST /passengers/${px0}/events", payload: { event_type: "SIGN_WAIVER", waiver_version: "WAV-1" }, as: BookingAgent }
            - { call: "POST /passengers/${px0}/events", payload: { event_type: "COMPLETE_BRIEFING" }, as: BookingAgent }
            - { call: "POST /passengers/${px0}/events", payload: { event_type: "CHECK_IN", actual_weight_lb: 200, seat_number: 0 }, as: BookingAgent }
            - { call: "POST /passengers/${px1}/events", payload: { event_type: "SIGN_WAIVER", waiver_version: "WAV-1" }, as: BookingAgent }
            - { call: "POST /passengers/${px1}/events", payload: { event_type: "COMPLETE_BRIEFING" }, as: BookingAgent }
            - { call: "POST /passengers/${px1}/events", payload: { event_type: "CHECK_IN", actual_weight_lb: 180, seat_number: 1 }, as: BookingAgent }
            - { call: "POST /passengers/${px2}/events", payload: { event_type: "SIGN_WAIVER", waiver_version: "WAV-1" }, as: BookingAgent }
            - { call: "POST /passengers/${px2}/events", payload: { event_type: "COMPLETE_BRIEFING" }, as: BookingAgent }
            - { call: "POST /passengers/${px2}/events", payload: { event_type: "CHECK_IN", actual_weight_lb: 150, seat_number: 2 }, as: BookingAgent }
            - { call: "POST /passengers/${px3}/events", payload: { event_type: "SIGN_WAIVER", waiver_version: "WAV-1" }, as: BookingAgent }
            - { call: "POST /passengers/${px3}/events", payload: { event_type: "COMPLETE_BRIEFING" }, as: BookingAgent }
            - { call: "POST /passengers/${px3}/events", payload: { event_type: "CHECK_IN", actual_weight_lb: 150, seat_number: 3 }, as: BookingAgent }
            - { call: "POST /flights/${flight_id}/events", payload: { event_type: "OPEN_BOARDING" }, as: Dispatcher }
            - call: "GET /flights/${flight_id}"
              as: Dispatcher
              captures: { f_ver: $.data.version }
          trigger:
            - call: "POST /flights/${flight_id}/close-manifest"
              payload: { expected_flight_version: "${f_ver}" }
              as: Dispatcher
              captures: { final_gross: $.data.actual_gross_weight_lb, final_cg: $.data.actual_cg_in, final_fuel: $.data.manifested_fuel_lb }
          assert:
            - "setup capture est_gross == 2540  (1500 + 4*(180+5) + 300; provisional variant)"
            - "trigger capture final_gross == 2480  (1500 + 680 + 300; final variant over the SAME passengers)"
            - "trigger capture final_fuel == 300"
            - "trigger capture final_cg == 56.33"
            - "est_gross != final_gross — identical inputs, two valid algorithms, different results"

      - name: duty_scheduled_projection_vs_actual_ledger
        grounds:
          - calculations.pilot_duty_minutes
          - entities.DutyDay.fields.flight_minutes_scheduled
          - entities.DutyDay.fields.flight_minutes_actual
          - errors[ERR_PILOT_FLIGHT_TIME_EXCEEDED]
        distinguishing_aspect: |
          Two valid duty algorithms over the SAME pilot-day diverge after early completions:
          the assignment gate's scheduled projection reads 480 min (blocking a further 240-min
          flight), while the chronological actual ledger reads 180 min. Entity domain: Pilot
          duty — a different domain from the weight-and-balance instance.
        test_recipe:
          setup:
            - "Route RD STANDARD 240 min, fuel 400, not noise-sensitive; aircraft; pilot P"
            - "P holds F1 dep 08:00 (arr 12:00) and F2 dep 13:00 (arr 17:00) on 2026-08-03 -> flight_minutes_scheduled == 480"
            - "F1 dispatched at 08:00 and completed at 09:30 (90 actual min); F2 dispatched 13:00, completed 14:30 (90 actual min) -> flight_minutes_actual == 180"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "RD", tier: "STANDARD", duration_minutes: 240, base_seat_price_cents: 10000, fuel_required_lb: 400, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T08:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { f1: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T13:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { f2: $.data.id }
            - { call: "POST /flights/${f1}/events", payload: { event_type: "PILOT_ACK" }, as: Pilot, as_user_id: "${pilot_id}" }
            - { call: "POST /flights/${f1}/events", payload: { event_type: "OPEN_BOARDING" }, as: Dispatcher, as_user_id: "disp-1" }
            - call: "GET /flights/${f1}"
              as: Dispatcher
              captures: { f1v: $.data.version }
            - { call: "POST /flights/${f1}/close-manifest", payload: { expected_flight_version: "${f1v}" }, as: Dispatcher, as_user_id: "disp-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: OpsAdmin }
            - { call: "POST /flights/${f1}/events", payload: { event_type: "DISPATCH" }, as: Dispatcher, as_user_id: "disp-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:30:00Z" }, as: OpsAdmin }
            - { call: "POST /flights/${f1}/events", payload: { event_type: "COMPLETE" }, as: Dispatcher, as_user_id: "disp-2" }
            - { call: "POST /flights/${f2}/events", payload: { event_type: "PILOT_ACK" }, as: Pilot, as_user_id: "${pilot_id}" }
            - { call: "POST /flights/${f2}/events", payload: { event_type: "OPEN_BOARDING" }, as: Dispatcher, as_user_id: "disp-1" }
            - call: "GET /flights/${f2}"
              as: Dispatcher
              captures: { f2v: $.data.version }
            - { call: "POST /flights/${f2}/close-manifest", payload: { expected_flight_version: "${f2v}" }, as: Dispatcher, as_user_id: "disp-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T13:00:00Z" }, as: OpsAdmin }
            - { call: "POST /flights/${f2}/events", payload: { event_type: "DISPATCH" }, as: Dispatcher, as_user_id: "disp-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:30:00Z" }, as: OpsAdmin }
            - { call: "POST /flights/${f2}/events", payload: { event_type: "COMPLETE" }, as: Dispatcher, as_user_id: "disp-2" }
            - call: "GET /duty-days?pilot_id=${pilot_id}&duty_date=2026-08-03"
              as: Dispatcher
              captures: { sched_min: "$.data[0].flight_minutes_scheduled", actual_min: "$.data[0].flight_minutes_actual" }
          trigger:
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T18:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { err: $.data.error_id }
          assert:
            - "setup capture sched_min == 480 (240+240 scheduled-projection variant)"
            - "setup capture actual_min == 180 (90+90 actual-ledger variant over the same day)"
            - "trigger capture err == ERR_PILOT_FLIGHT_TIME_EXCEEDED — the gate uses the scheduled variant (480+240=720 > 480) even though the actual ledger shows only 180"

  - rule_id: combinatorial_formula
    instances:
      - name: seat_price_nested_rounding_order_pinned
        grounds:
          - calculations.seat_price_quote
          - entities.Booking.fields.quoted_per_seat_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: season -> load -> weekend multipliers each round_half_up
          to integer cents before the next step. Base 9950 with season 11500, load 11000
          (exactly 50% full), weekend 11000 yields 13846 stepwise vs 13845 when rounded once
          at the end — the pinned per-step order is observable in quoted_per_seat_cents.
        test_recipe:
          setup:
            - "Season SP [2026-06-01, 2026-12-31) at 11500 bps; route base 9950; aircraft 4 seats"
            - "Flight departs Saturday 2026-08-15T14:00:00Z; booking B1 (2 seats) holds first -> load_pct for B2 is exactly floor(2*100/4) == 50 -> 11000 bps tier"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /seasons"
              payload: { label: "SP", start_date: "2026-06-01", end_date: "2026-12-31", multiplier_bps: 11500 }
              as: OpsAdmin
            - call: "POST /routes"
              payload: { route_code: "RX", tier: "STANDARD", duration_minutes: 50, base_seat_price_cents: 9950, fuel_required_lb: 450, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-15T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 150 }, { full_name: "P1", declared_weight_lb: 150 } ] }
              as: BookingAgent
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "B", contact_email: "b@x.com", passengers: [ { full_name: "P9", declared_weight_lb: 150 } ] }
              as: BookingAgent
              captures: { per_seat: $.data.quoted_per_seat_cents, total: $.data.quoted_total_cents }
          assert:
            - "trigger capture per_seat == 13846 (round_half_up(9950*1.15)=11443; round_half_up(11443*1.10)=12587; round_half_up(12587*1.10)=13846)"
            - "per_seat != 13845 — single-shot rounding of 9950*1.15*1.10*1.10 would give 13845; the pinned per-step order wins"
            - "trigger capture total == 13846 (per-seat rounded price multiplied by seat_count afterwards)"

      - name: manifest_fuel_pax_circular_pinned_order
        grounds:
          - calculations.manifest_final_wb
          - entities.Flight.fields.manifested_fuel_lb
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: fuel depends on passenger weight (MTOW budget),
          gross weight depends on fuel, and acceptance re-verifies gross after trimming.
          The pinned order (pax -> fuel_budget -> trim -> gross -> CG) makes 3 heavy passengers
          legal at exactly 2600 lb gross with fuel trimmed 300 -> 280; any other evaluation
          order either rejects a legal manifest or computes a different fuel figure.
        test_recipe:
          setup:
            - "Route R1 SHORT 25 min fuel 300 lb (min fuel = round_half_up(300*0.6) = 180); A1 MTOW 2600 empty 1500"
            - "Flight dep 2026-08-03T14:00:00Z; booking of 3 passengers (declared 250) CONFIRMED; checked in with actuals 280/270/270 = 820 lb at seats 0,1,2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 250 }, { full_name: "P1", declared_weight_lb: 250 }, { full_name: "P2", declared_weight_lb: 250 } ] }
              as: BookingAgent
              captures: { booking_id: $.data.id }
            - { call: "POST /bookings/${booking_id}/confirm", payload: { card_amount_cents: 75000 }, as: BookingAgent }
            - call: "GET /passengers?booking_id=${booking_id}"
              as: BookingAgent
              captures: { px0: "$.data[0].id", px1: "$.data[1].id", px2: "$.data[2].id" }
            - { call: "POST /passengers/${px0}/events", payload: { event_type: "SIGN_WAIVER", waiver_version: "WAV-1" }, as: BookingAgent }
            - { call: "POST /passengers/${px0}/events", payload: { event_type: "COMPLETE_BRIEFING" }, as: BookingAgent }
            - { call: "POST /passengers/${px0}/events", payload: { event_type: "CHECK_IN", actual_weight_lb: 280, seat_number: 0 }, as: BookingAgent }
            - { call: "POST /passengers/${px1}/events", payload: { event_type: "SIGN_WAIVER", waiver_version: "WAV-1" }, as: BookingAgent }
            - { call: "POST /passengers/${px1}/events", payload: { event_type: "COMPLETE_BRIEFING" }, as: BookingAgent }
            - { call: "POST /passengers/${px1}/events", payload: { event_type: "CHECK_IN", actual_weight_lb: 270, seat_number: 1 }, as: BookingAgent }
            - { call: "POST /passengers/${px2}/events", payload: { event_type: "SIGN_WAIVER", waiver_version: "WAV-1" }, as: BookingAgent }
            - { call: "POST /passengers/${px2}/events", payload: { event_type: "COMPLETE_BRIEFING" }, as: BookingAgent }
            - { call: "POST /passengers/${px2}/events", payload: { event_type: "CHECK_IN", actual_weight_lb: 270, seat_number: 2 }, as: BookingAgent }
            - { call: "POST /flights/${flight_id}/events", payload: { event_type: "OPEN_BOARDING" }, as: Dispatcher }
            - call: "GET /flights/${flight_id}"
              as: Dispatcher
              captures: { f_ver: $.data.version }
          trigger:
            - call: "POST /flights/${flight_id}/close-manifest"
              payload: { expected_flight_version: "${f_ver}" }
              as: Dispatcher
              captures: { fuel: $.data.manifested_fuel_lb, gross: $.data.actual_gross_weight_lb, cg: $.data.actual_cg_in }
          assert:
            - "trigger capture fuel == 280 (trimmed: min(300, 2600-1500-820) — fuel adapts to pax, not vice versa)"
            - "trigger capture gross == 2600 (recomputed AFTER the trim and accepted at exactly MTOW)"
            - "trigger capture cg == 54.96 (round_half_up(142900/2600, 2))"
            - "Flight.${flight_id}.status == MANIFEST_CLOSED"

  - rule_id: non_linear_state_machine
    instances:
      - name: booking_checkin_uncheck_revert_cycle
        grounds:
          - state_machines.Booking.CONFIRMED_to_CHECKED_IN
          - state_machines.Booking.CHECKED_IN_to_CONFIRMED
          - state_machines.Passenger.false_to_true
        distinguishing_aspect: |
          Cyclic machine on Booking: CONFIRMED -> CHECKED_IN -> CONFIRMED -> CHECKED_IN via
          passenger-level CHECK_IN/UNCHECK side effects; the loop is traversable repeatedly
          (not a one-way pipeline).
        test_recipe:
          setup:
            - "Flight dep 2026-08-03T14:00:00Z; booking of 2 passengers CONFIRMED (quote 25000/seat, no season)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - call: "POST /bookings"
