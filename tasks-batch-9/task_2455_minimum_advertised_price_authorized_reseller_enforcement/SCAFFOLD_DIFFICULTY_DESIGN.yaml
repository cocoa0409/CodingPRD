              as_user_id: "channel-mgr-1"
              captures: { n2_id: $.data.id, n2_rung: $.data.rung, n2_points: $.data.assessed_points, n2_cum: $.data.cumulative_points_at_issue }
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "MARKETPLACE", marketplace_name: "BigMarket", seller_display_name: "Charlie Retail", listing_url: "https://bigmarket.example/charlie/turntable-3", listed_price_cents: 8000, observed_at: "2026-08-07T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", matched_reseller_id: "${rs_id}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs3_id: $.data.id }
            - call: "POST /price-observations/${obs3_id}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { v3_id: $.data.violation_id }
            - call: "GET /resellers/${rs_id}"
              payload: {}
              as: BrandChannelManager
              captures: { rs_v3: $.data.version, pts_before_term: $.data.violation_points_total }
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${rs_id}", violation_id: "${v3_id}", delivery_channel: "CERTIFIED_MAIL", rung: "TERMINATION", expected_reseller_version: "${rs_v3}" }
              as: BrandLegalCounsel
              as_user_id: "counsel-2"
              captures: { n3_id: $.data.id, n3_rung: $.data.rung, n3_points: $.data.assessed_points, n3_cum: $.data.cumulative_points_at_issue }
          assert:
            - "${su_status_shipped} == SHIPPED_TO_RESELLER and ${n1_rung} == WARNING and ${n1_points} == 6 and ${n1_cum} == 6 (points_rung SUSPENSION, but max_next_rung is WARNING at highest_issued_ordinal 0)"
            - "${n2_rung} == SUSPENSION and ${n2_points} == 8 and ${n2_cum} == 14 (4 * 1.5 * 1.25 == 7.5 -> round_half_up 8; points_rung TERMINATION, capped to SUSPENSION)"
            - "${pts_before_term} == 14"
            - "${n3_points} == 9 (4 * 1.5 * 1.5 == 9.0) and ${n3_cum} == 23 and ${n3_rung} == TERMINATION"
            - "HOP 1 — Reseller.${rs_id}.authorization_status == TERMINATED, supply_status == CUT_OFF, hold_reason == TERMINATION, terminated_at == 2026-08-10T00:00:00Z"
            - "HOP 2 — ResellerAgreement.${ag_id}.status == TERMINATED and ResellerAgreement.${ag_id}.closed_reason == SUPPLY_TERMINATED"
            - "HOP 3 — SerialUnit.${su_id}.status == RECALLED and SerialUnit.${su_id}.downstream_reseller_id == ${rs_id}"
            - "SIDE BRANCH — Violation.${v1_id}.status == CLOSED_MOOT, Violation.${v2_id}.status == CLOSED_MOOT and Violation.${v3_id}.status == CLOSED_MOOT, each with resolution_reason == RESELLER_TERMINATED"
            - "Violation.${v1_id}.assessed_points == 6, Violation.${v2_id}.assessed_points == 8, Violation.${v3_id}.assessed_points == 9 (retained through CLOSED_MOOT)"
            - "Reseller.${rs_id}.violation_points_total == 23 (CLOSED_MOOT stays in LEDGER_STATUSES, so closing the violations does not refund points)"
            - "EnforcementNotice.${n2_id}.status == ISSUED (the suspension notice is not auto-satisfied by the termination)"

      - name: chargeback_reversal_cascades_standing_to_reseller_review_flag
        grounds:
          - state_machines.DistributorChargeback.DISPUTED_to_REVERSED
          - calculations.distributor_chargeback_ledger
          - calculations.reseller_review_required
          - entities.Distributor.fields.standing
          - entities.Reseller.fields.review_required
          - entities.SerialUnit.fields.status
        distinguishing_aspect: |
          A different triggering transition (DistributorChargeback DISPUTED -> REVERSED,
          not an EnforcementNotice issuance) drives a 3-hop chain in the opposite
          direction: chargeback -> Distributor (balance and diversion_score restored,
          standing re-derived PROBATION -> GOOD) -> every Reseller sourcing from that
          distributor (review_required recomputed true -> false).
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-H published; Product SKU-SER-3 serialization_enabled true."
            - "Distributor North Distribution (cap 5000000) and one Reseller whose sourcing_distributor_id is that distributor; the reseller has review_required false and no traced units of its own."
            - "SerialUnit SN-30 shipped to the distributor only (never shipped downstream), traced through a CONFIRMED_UNAUTHORIZED test purchase, so it is TRACED_UNAUTHORIZED with downstream_reseller_id null."
            - "One chargeback of 4 diverted units assessed at the 2500 tier: amount_cents 10000, score_delta_applied 10.0, so diversion_score becomes 10.0, standing PROBATION and the sourcing reseller's review_required flips to true."
            - "The distributor has disputed that chargeback (status DISPUTED, which still counts in the ledger)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-H" }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Cleared." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-SER-3", name: "Aurora Amplifier", msrp_cents: 40000, standard_map_floor_cents: 30000, governing_policy_id: "${pol_id}", serialization_enabled: true }
              as: BrandChannelManager
              captures: { prod_id: $.data.id }
            - call: "POST /distributors"
              payload: { legal_name: "North Distribution", annual_chargeback_cap_cents: 5000000 }
              as: BrandChannelManager
              captures: { d_id: $.data.id }
            - call: "POST /resellers"
              payload: { legal_name: "Delta Retail LLC", contact_email: "notices@deltaretail.example", primary_channel: "RETAILER_SITE", sourcing_distributor_id: "${d_id}" }
              as: BrandChannelManager
              captures: { rs_id: $.data.id }
            - call: "POST /serial-units"
