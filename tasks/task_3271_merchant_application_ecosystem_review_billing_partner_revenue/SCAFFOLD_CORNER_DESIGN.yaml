scaffold_corner_design:
  - section: entities
    instances:
      - name: developer_creation_missing_required_field_returns_400
        claim_type: required_field_validation
        grounds: [entities.DeveloperAccount.fields.contact_email, "validations[priority=7]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input contact_email on POST /developers yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /developers"
              payload: { company_name: "NoEmail", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_REQUEST'"
      - name: developer_status_defaults_to_active
        claim_type: defaults
        grounds: [entities.DeveloperAccount.fields.status]
        distinguishing_aspect: "Newly created DeveloperAccount has status ACTIVE and lifetime_gross_cents 0 without the client sending either."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /developers"
              payload: { company_name: "Fresh", contact_email: "fresh@x.com", payout_currency: "EUR" }
              as: PlatformAdmin
              captures: { d_status: $.data.status, d_gross: $.data.lifetime_gross_cents, d_version: $.data.version }
          assert:
            - "status == 'ACTIVE'"
            - "lifetime_gross_cents == 0"
            - "version == 1"
      - name: app_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.App.fields.status, entities.App.fields.revenue_share_tier]
        distinguishing_aspect: "Client-supplied status/listing_status/revenue_share_tier on POST /apps are ignored; system values DRAFT/UNLISTED/T0 are returned."
        test_recipe:
          setup: ["developer dC1 exists"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DC1", contact_email: "dc1@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { dc1_id: $.data.id }
          trigger:
            - call: "POST /apps"
              payload: { developer_id: "${dc1_id}", name: "SysFields", category: "PRODUCTIVITY" }
              as: Developer
              as_user_id: "${dc1_id}"
              captures: { a_status: $.data.status, a_listing: $.data.listing_status, a_tier: $.data.revenue_share_tier }
          assert:
            - "status == 'DRAFT'"
            - "listing_status == 'UNLISTED'"
            - "revenue_share_tier == 'T0'"
      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /apps/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == 'ERR_NOT_FOUND'"
      - name: app_invalid_enum_category_rejected
        claim_type: type_constraints
        grounds: [entities.App.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category outside {PRODUCTIVITY, MARKETING, FULFILLMENT, ANALYTICS, FINANCE} is rejected."
        test_recipe:
          setup: ["developer dC2 exists"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DC2", contact_email: "dc2@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { dc2_id: $.data.id }
          trigger:
            - call: "POST /apps"
              payload: { developer_id: "${dc2_id}", name: "BadEnum", category: "GAMES" }
              as: Developer
              as_user_id: "${dc2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_REQUEST'"
      - name: app_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints."GET /apps"]
        distinguishing_aspect: "GET /apps returns response_type array with meta.api_request_id and pagination fields total_count/has_more honoring limit/offset."
        test_recipe:
          setup: ["developer dC3 with two apps"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DC3", contact_email: "dc3@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { dc3_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${dc3_id}", name: "PgOne", category: "MARKETING" }
              as: Developer
              as_user_id: "${dc3_id}"
            - call: "POST /apps"
              payload: { developer_id: "${dc3_id}", name: "PgTwo", category: "FINANCE" }
              as: Developer
              as_user_id: "${dc3_id}"
          trigger:
            - call: "GET /apps"
              payload: { developer_id: "${dc3_id}", limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response envelope carries meta.api_request_id and response_type == 'array'"
            - "data length == 1 and pagination reports total_count == 2 with has_more == true"
      - name: computed_lifetime_gross_ignores_input
        claim_type: computed_fields
        grounds: [entities.DeveloperAccount.fields.lifetime_gross_cents, calculations.developer_accrual]
        distinguishing_aspect: "lifetime_gross_cents is computed from INVOICED/SETTLED charges; any client-supplied value at creation is discarded (stays 0)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /developers"
              payload: { company_name: "Comp", contact_email: "comp@x.com", payout_currency: "GBP" }
              as: PlatformAdmin
              captures: { d_gross: $.data.lifetime_gross_cents }
          assert:
            - "lifetime_gross_cents == 0"

  - section: state_machines
    instances:
      - name: app_submit_from_in_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.App, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /apps/{id}/submit while app is IN_REVIEW is not a defined transition — ERR_INVALID_STATE, no side effects."
        test_recipe:
          setup: ["app aS1 IN_REVIEW (version submitted)"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DS1", contact_email: "ds1@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { ds1_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${ds1_id}", name: "AppS1", category: "PRODUCTIVITY" }
              as: Developer
              as_user_id: "${ds1_id}"
              captures: { as1_id: $.data.id }
            - call: "POST /apps/${as1_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${ds1_id}"
              captures: { vs1_id: $.data.id }
            - call: "POST /apps/${as1_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${ds1_id}"
          trigger:
            - call: "POST /apps/${as1_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${ds1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
      - name: approve_with_pending_scope_request_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.AppVersion.IN_REVIEW_to_APPROVED, state_machines.App.IN_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approve is blocked while any ScopeRequest of the version is still PENDING."
        test_recipe:
          setup: ["app aS2 IN_REVIEW, version vS2 IN_REVIEW, scope request srS2 PENDING"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DS2", contact_email: "ds2@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { ds2_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${ds2_id}", name: "AppS2", category: "MARKETING" }
              as: Developer
              as_user_id: "${ds2_id}"
              captures: { as2_id: $.data.id }
            - call: "POST /apps/${as2_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${ds2_id}"
              captures: { vs2_id: $.data.id }
            - call: "POST /permission-scopes"
              payload: { code: "read_products", risk_level: "LOW" }
              as: PlatformAdmin
            - call: "POST /app-versions/${vs2_id}/scope-requests"
              payload: { scope_code: "read_products" }
              as: Developer
              as_user_id: "${ds2_id}"
            - call: "POST /apps/${as2_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${ds2_id}"
          trigger:
            - call: "POST /app-versions/${vs2_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
      - name: version_reject_denies_pending_scope_requests
        claim_type: side_effect_execution
        grounds: [state_machines.App.IN_REVIEW_to_DRAFT, state_machines.AppVersion.IN_REVIEW_to_REJECTED]
        distinguishing_aspect: "Rejection cascades: version REJECTED, app back to DRAFT, and every PENDING ScopeRequest flips to DENIED with denied_reason 'VERSION_REJECTED'."
        test_recipe:
          setup: ["app aS3 IN_REVIEW with version vS3 and PENDING scope request srS3"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DS3", contact_email: "ds3@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { ds3_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${ds3_id}", name: "AppS3", category: "FULFILLMENT" }
              as: Developer
              as_user_id: "${ds3_id}"
              captures: { as3_id: $.data.id }
            - call: "POST /apps/${as3_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${ds3_id}"
              captures: { vs3_id: $.data.id }
            - call: "POST /permission-scopes"
              payload: { code: "read_products", risk_level: "LOW" }
              as: PlatformAdmin
            - call: "POST /app-versions/${vs3_id}/scope-requests"
              payload: { scope_code: "read_products" }
              as: Developer
              as_user_id: "${ds3_id}"
              captures: { srs3_id: $.data.id }
            - call: "POST /apps/${as3_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${ds3_id}"
          trigger:
            - call: "POST /app-versions/${vs3_id}/reject"
              payload: { reviewer_id: "rev-1", reason: "security gaps" }
              as: Reviewer
            - call: "GET /scope-requests/${srs3_id}"
              payload: {}
              as: Reviewer
              captures: { srs3_status: $.data.status, srs3_reason: $.data.denied_reason }
            - call: "GET /apps/${as3_id}"
              payload: {}
              as: Developer
              as_user_id: "${ds3_id}"
              captures: { as3_status: $.data.status }
          assert:
            - "ScopeRequest.${srs3_id}.status == 'DENIED'"
            - "ScopeRequest.${srs3_id}.denied_reason == 'VERSION_REJECTED'"
            - "App.${as3_id}.status == 'DRAFT'"
      - name: publish_supersedes_prior_published_version
        claim_type: side_effect_execution
        grounds: [state_machines.App.APPROVED_to_LISTED, state_machines.AppVersion.PUBLISHED_to_SUPERSEDED]
        distinguishing_aspect: "Publishing version 2.0.0 flips the previously PUBLISHED 1.0.0 to SUPERSEDED — only one PUBLISHED version per app."
        test_recipe:
          setup: ["app aS4 LISTED with v1 PUBLISHED; new version v2 APPROVED"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DS4", contact_email: "ds4@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { ds4_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${ds4_id}", name: "AppS4", category: "ANALYTICS" }
              as: Developer
              as_user_id: "${ds4_id}"
              captures: { as4_id: $.data.id }
            - call: "POST /apps/${as4_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${ds4_id}"
              captures: { vs4a_id: $.data.id }
            - call: "POST /apps/${as4_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${ds4_id}"
            - call: "POST /app-versions/${vs4a_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${as4_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${ds4_id}"
            - call: "POST /apps/${as4_id}/versions"
              payload: { semver: "2.0.0" }
              as: Developer
              as_user_id: "${ds4_id}"
              captures: { vs4b_id: $.data.id }
            - call: "POST /apps/${as4_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${ds4_id}"
            - call: "POST /app-versions/${vs4b_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
          trigger:
            - call: "POST /apps/${as4_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${ds4_id}"
            - call: "GET /app-versions/${vs4a_id}"
              payload: {}
              as: Reviewer
              captures: { vs4a_status: $.data.status }
            - call: "GET /app-versions/${vs4b_id}"
              payload: {}
              as: Reviewer
              captures: { vs4b_status: $.data.status }
          assert:
            - "AppVersion.${vs4a_id}.status == 'SUPERSEDED'"
            - "AppVersion.${vs4b_id}.status == 'PUBLISHED'"
      - name: installation_initial_state_pending_consent
        claim_type: initial_state
        grounds: [state_machines.Installation]
        distinguishing_aspect: "A new Installation starts PENDING_CONSENT with installed_at null."
        test_recipe:
          setup: ["listed app aS5, merchant mS5"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DS5", contact_email: "ds5@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { ds5_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${ds5_id}", name: "AppS5", category: "PRODUCTIVITY" }
              as: Developer
              as_user_id: "${ds5_id}"
              captures: { as5_id: $.data.id }
            - call: "POST /apps/${as5_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${ds5_id}"
              captures: { vs5_id: $.data.id }
            - call: "POST /apps/${as5_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${ds5_id}"
            - call: "POST /app-versions/${vs5_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${as5_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${ds5_id}"
            - call: "POST /merchants"
              payload: { shop_domain: "ms5.myshop.com", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { ms5_id: $.data.id }
          trigger:
            - call: "POST /installations"
              payload: { app_id: "${as5_id}", merchant_id: "${ms5_id}" }
              as: Merchant
              as_user_id: "${ms5_id}"
              captures: { inst_status: $.data.status, inst_at: $.data.installed_at }
          assert:
            - "status == 'PENDING_CONSENT'"
            - "installed_at == null"
      - name: charge_approve_idempotency_second_call_fails
        claim_type: idempotency
        grounds: [state_machines.AppBillingCharge.PENDING_to_APPROVED, "errors[ERR_CHARGE_NOT_PENDING]"]
        distinguishing_aspect: "Approving the same charge twice: the second call finds status APPROVED and fails with ERR_CHARGE_NOT_PENDING."
        test_recipe:
          setup: ["ACTIVE installation instS6 with PENDING charge cS6"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DS6", contact_email: "ds6@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { ds6_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${ds6_id}", name: "AppS6", category: "FINANCE" }
              as: Developer
              as_user_id: "${ds6_id}"
              captures: { as6_id: $.data.id }
            - call: "POST /apps/${as6_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${ds6_id}"
              captures: { vs6_id: $.data.id }
            - call: "POST /apps/${as6_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${ds6_id}"
            - call: "POST /app-versions/${vs6_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${as6_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${ds6_id}"
            - call: "POST /merchants"
              payload: { shop_domain: "ms6.myshop.com", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { ms6_id: $.data.id }
            - call: "POST /installations"
              payload: { app_id: "${as6_id}", merchant_id: "${ms6_id}" }
              as: Merchant
              as_user_id: "${ms6_id}"
              captures: { insts6_id: $.data.id }
            - call: "POST /installations/${insts6_id}/consent"
              payload: {}
              as: Merchant
              as_user_id: "${ms6_id}"
            - call: "POST /installations/${insts6_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 600, description: "idem" }
              as: Developer
              as_user_id: "${ds6_id}"
              captures: { cs6_id: $.data.id }
            - call: "POST /billing-charges/${cs6_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${ms6_id}"
          trigger:
            - call: "POST /billing-charges/${cs6_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${ms6_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == 'ERR_CHARGE_NOT_PENDING'"
      - name: terminal_invoice_void_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.MonthlyInvoice, "errors[ERR_INVOICE_NOT_VOIDABLE]"]
        distinguishing_aspect: "Void on a PAID invoice is rejected — terminal state lockdown."
        test_recipe:
          setup: ["merchant mS7 with PAID invoice invS7 (one charge issued then paid)"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DS7", contact_email: "ds7@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { ds7_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${ds7_id}", name: "AppS7", category: "MARKETING" }
              as: Developer
              as_user_id: "${ds7_id}"
              captures: { as7_id: $.data.id }
            - call: "POST /apps/${as7_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${ds7_id}"
              captures: { vs7_id: $.data.id }
            - call: "POST /apps/${as7_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${ds7_id}"
            - call: "POST /app-versions/${vs7_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${as7_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${ds7_id}"
            - call: "POST /merchants"
              payload: { shop_domain: "ms7.myshop.com", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { ms7_id: $.data.id }
            - call: "POST /installations"
              payload: { app_id: "${as7_id}", merchant_id: "${ms7_id}" }
              as: Merchant
              as_user_id: "${ms7_id}"
              captures: { insts7_id: $.data.id }
            - call: "POST /installations/${insts7_id}/consent"
              payload: {}
              as: Merchant
              as_user_id: "${ms7_id}"
            - call: "POST /installations/${insts7_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 700, description: "seed" }
              as: Developer
              as_user_id: "${ds7_id}"
              captures: { cs7_id: $.data.id }
            - call: "POST /billing-charges/${cs7_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${ms7_id}"
            - call: "POST /merchants/${ms7_id}/invoices"
              payload: { cycle: "2026-09" }
              as: PlatformAdmin
              captures: { invs7_id: $.data.id, invs7_v: $.data.version }
            - call: "POST /invoices/${invs7_id}/issue"
              payload: { expected_invoice_version: "${invs7_v}" }
              as: PlatformAdmin
            - call: "POST /invoices/${invs7_id}/mark-paid"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /invoices/${invs7_id}/void"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVOICE_NOT_VOIDABLE'"
      - name: ticket_dispute_reopen_cycle
        claim_type: valid_transition
        grounds: [state_machines.SupportTicket.RESOLVED_to_DISPUTED, state_machines.SupportTicket.DISPUTED_to_RESOLVED]
        distinguishing_aspect: "Cyclic RESOLVED -> DISPUTED -> RESOLVED works: merchant dispute within 14 days reopens, developer re-resolves."
        test_recipe:
          setup: ["RESOLVED ticket tS8 opened at clock 2026-09-01 (merchant mS8, app aS8)"]
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "DS8", contact_email: "ds8@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { ds8_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${ds8_id}", name: "AppS8", category: "PRODUCTIVITY" }
              as: Developer
              as_user_id: "${ds8_id}"
              captures: { as8_id: $.data.id }
            - call: "POST /merchants"
              payload: { shop_domain: "ms8.myshop.com", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { ms8_id: $.data.id }
            - call: "POST /apps/${as8_id}/support-tickets"
              payload: { merchant_id: "${ms8_id}", severity: "LOW" }
              as: Merchant
              as_user_id: "${ms8_id}"
              captures: { ts8_id: $.data.id }
            - call: "POST /support-tickets/${ts8_id}/respond"
              payload: {}
              as: Developer
              as_user_id: "${ds8_id}"
            - call: "POST /support-tickets/${ts8_id}/resolve"
              payload: {}
              as: Developer
              as_user_id: "${ds8_id}"
          trigger:
            - call: "POST /support-tickets/${ts8_id}/dispute"
              payload: {}
              as: Merchant
              as_user_id: "${ms8_id}"
              captures: { ts8_status1: $.data.status }
