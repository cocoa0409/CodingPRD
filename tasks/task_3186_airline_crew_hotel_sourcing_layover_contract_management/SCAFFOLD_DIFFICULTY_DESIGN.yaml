  - rule_id: non_linear_state_machine
    instances:
      - name: rfp_cycle_evaluation_negotiation_cycle
        grounds:
          - state_machines.RfpCycle.EVALUATION_to_NEGOTIATION
          - state_machines.RfpCycle.NEGOTIATION_to_EVALUATION
          - entities.RfpCycle.fields.negotiation_round
        distinguishing_aspect: |
          RfpCycle runs a cyclic revision loop EVALUATION -> NEGOTIATION -> EVALUATION ->
          NEGOTIATION before award; only the EVALUATION->NEGOTIATION direction increments
          negotiation_round, so two full loops pin negotiation_round == 2 while the cycle can
          still be awarded from NEGOTIATION.
        test_recipe:
          setup:
            - "Station PHX, vendor VX, cycle CX with a proposal PX short-listed and the cycle in EVALUATION"
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "PHX", name: "Phoenix Sky Harbor", timezone: "America/Phoenix", min_rest_hours: 10, transport_time_minutes: 25, room_availability_commitment: 30 }
              as: PlatformAdmin
              captures: { st_phx: $.data.id }
