            - call: "POST /intakes/${i16_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c16_id}/consent-grants"
              payload: { provider_id: "${p16_id}", scope: "BASIC_CONTACT" }
              as: Client
