  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: void_covered_visit_conserves_entitlement_consumed
        grounds:
          - state_machines.ServiceVisit.COMPLETED_to_VOIDED
          - calculations.reconcile_term_balance
          - entities.ContractTerm.fields.entitlement_consumed_cents
        distinguishing_aspect: |
          Conserved quantity = term.entitlement_consumed_cents (credit ledger value). Recording a covered
          EXAM visit raises consumed by 6000; voiding it lowers consumed by 6000, leaving the named
          quantity exactly at its pre-visit value (0) with no drift.
        test_recipe:
          setup:
            - "PLUS membership ENROLLED; term1 entitlement_consumed_cents starts 0"
            - "Record one covered EXAM visit (consumed -> 6000), then void it"
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000, alacarte_discount_pct: 0.20, enrollment_fee_cents: 0 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "q@x.com", full_name: "Q", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
              captures: { term1_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/visits"
              payload: { enrolled_pet_id: "${pet_id}", clinic_id: "${clinic_id}", service_code: "EXAM" }
              as: ClinicStaff
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /wellness/visits/${visit_id}/void"
              payload: {}
              as: ClinicStaff
          assert:
            - "ContractTerm.${term1_id}.entitlement_consumed_cents == 0"
            - "ContractTerm.${term1_id}.entitlement_balance_cents == 12000"
            - "The EXAM ServiceCredit of term ${term1_id} has consumed_quantity == 0 and status == OPEN"

      - name: void_alacarte_visit_conserves_wallet_credit
        grounds:
          - state_machines.ServiceVisit.COMPLETED_to_VOIDED
          - entities.MemberAccount.fields.wallet_credit_cents
