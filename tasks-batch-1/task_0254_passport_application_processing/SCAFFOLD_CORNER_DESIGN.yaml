            - "data.error_id == \"ERR_NAME_CHANGE_EVIDENCE_REQUIRED\""

      - name: appointment_end_not_after_start_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_INVALID_INTERVAL]
          - entities.Appointment.fields.end_utc
        distinguishing_aspect: "Booking an appointment with end_utc equal to start_utc (not strictly after) returns ERR_INVALID_INTERVAL (422)."
        test_recipe:
          setup:
