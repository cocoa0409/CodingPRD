# =============================================================================
# Pharmaceutical Cold-Chain Warehousing — Scaffold Difficulty Design
# Test Targeting Index — cross-references §1.1–§1.7 of SCAFFOLD.yaml per the
# nine Difficulty Rules of §0.5. Every instance grounds in scaffold elements.
# =============================================================================

scaffold_difficulty_design:

  # =======================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fefo_pick_provisional_vs_final_on_shipment
        grounds:
          - calculations.fefo_pick_selection
          - state_machines.OutboundShipment.PLANNED_to_PICKED
          - endpoints.GET_/shipments/{id}/summary
        distinguishing_aspect: |
          The provisional preview variant on OutboundShipment subtracts in-flight PLANNED-shipment
          reservations from candidate Lot.quantity_on_hand whereas the final pick decrements physical
          Lot.quantity_on_hand; two PLANNED shipments competing for the same lot see different
          preview "available" counts than the post-commit pick result. This is the OutboundShipment
          entity domain (transport-stock).
        test_recipe:
          setup:
            - "Warehouse W with REFRIGERATED zone Z, bin B (volume_units=100)."
            - "Product P (required_zone_type=REFRIGERATED, unit_weight_kg=1, qualified)."
            - "Receipt R1 accepted -> Lot L1 with quantity_on_hand=10, expiry_minutes=10000."
            - "Two PLANNED shipments S1 (qty=6) and S2 (qty=6) created against P, neither picked yet."
          trigger:
            - "GET /shipments/S2/summary  (returns provisional preview view with virtual reserved=6 from S1, so projected available=4)"
            - "POST /shipments/S1/pick    (succeeds: decrements L1.quantity_on_hand to 4)"
            - "POST /shipments/S2/pick    (fails — final pick now sees physical 4 < 6)"
          assert:
            - "GET /shipments/S2/summary BEFORE S1 pick: response.data.projected_available_units == 4"
            - "POST /shipments/S1/pick: 200, Lot.quantity_on_hand == 4"
            - "POST /shipments/S2/pick: 409 ERR_INSUFFICIENT_STOCK"

      - name: recall_effectiveness_provisional_vs_final
        grounds:
          - calculations.recall_effectiveness
          - state_machines.Recall.EFFECTIVENESS_CHECK_to_CLOSED
          - endpoints.GET_/recalls/{id}/preview
        distinguishing_aspect: |
          The provisional projection variant on Recall counts unreturned-but-notified customers as
          virtual returns (AVG_RETURN_PER_NOTIFICATION=1.0) whereas the final calculation counts
          only physical returns_received_units. The Recall entity domain (regulatory closure) is
          structurally different from the OutboundShipment domain of the other dual-variant instance.
        test_recipe:
          setup:
            - "Warehouse W with Recall R (CLASS_II) in RETURNS_IN_PROGRESS."
            - "Recall has SHIPPED scope entries summing returns_expected_units=10."
            - "notifications_required=5, notifications_sent=4, returns_received_units=6."
          trigger:
            - "GET /recalls/R/preview            (provisional view)"
            - "POST /recalls/R/close             (forces final calc)"
          assert:
            - "GET /recalls/R/preview: response.data.projected_pass == true  (projected_received=6+4=10, ratio=1.0 >= 0.80)"
            - "POST /recalls/R/close: Recall.effectiveness_pass == false  (final ratio=6/10=0.60 < 0.80)"
            - "Recall.effectiveness_pass differs from preview.projected_pass for the same Recall id"

  # =======================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: shipment_outbound_total_nonlinear_three_input
        grounds:
          - calculations.shipment_outbound_total
          - endpoints.GET_/shipments/{id}/summary
          - entities.OutboundShipment.fields.packaging_kind
          - entities.Product.fields.required_zone_type
          - entities.Product.fields.special_storage_tag
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (required_zone_type, packaging_kind, quantity_units,
          special_storage_tag) interacting non-linearly via nested min/max and conditional branches
          on packaging_kind. DRY_ICE branch uses max(MIN_FLOOR, per_unit*qty); PCM branch uses
          min(MAX_CAP, per_unit*qty); base differs per zone tier; special premium is conditional.
        test_recipe:
          setup:
            - "Product P_frozen (required_zone_type=FROZEN, special_storage_tag=NONE)."
            - "Product P_pcm (required_zone_type=REFRIGERATED, special_storage_tag=VACCINE)."
            - "Receipts -> Lots in correct zones."
            - "Shipment S_a (P_frozen, packaging=INSULATED_DRY_ICE, qty=10) — picked, packed."
            - "Shipment S_b (P_pcm, packaging=INSULATED_PCM, qty=20) — picked, packed."
            - "Shipment S_c (P_pcm, packaging=INSULATED_PCM, qty=80) — picked, packed."
          trigger:
            - "GET /shipments/S_a/summary"
            - "GET /shipments/S_b/summary"
            - "GET /shipments/S_c/summary"
          assert:
            - "S_a.total_cents == 7000   (5000 base + max(2000,1000)=2000 + 0 premium)"
            - "S_b.total_cents == 5000   (3000 base + min(3000,1000)=1000 + 1000 vaccine premium)"
            - "S_c.total_cents == 6000   (3000 base + min(3000,4000)=3000 + 0 premium — PCM cap engaged)"

      - name: shipment_outbound_total_rounding_order_per_line
        grounds:
          - calculations.shipment_outbound_total
          - endpoints.GET_/shipments/{id}/summary
        distinguishing_aspect: |
          Mode (b): the scaffold PINS per-line rounding then sum, not sum-then-round. Per the
          formula precision clause: round_half_up(base) + round_half_up(surcharge) +
          round_half_up(premium). When base and surcharge each have fractional cent residues
          (introduced when packaging cost is multiplied by a tax factor in a hypothetical extension,
          but already exercised when raw inputs produce values whose half-cent residue would
          round differently if summed first), per-line rounding produces a stable, well-defined
          result. This distinguishes from instance #1 (which exercises non-linear three-input
          combinatorics, not rounding order).
        test_recipe:
          setup:
            - "Product P (required_zone_type=COOL, special_storage_tag=BIOLOGICAL)."
            - "Receipt accepted -> Lot."
            - "Shipment S (packaging=AMBIENT, qty=1) — picked, packed."
          trigger:
            - "GET /shipments/S/summary"
          assert:
            - "S.total_cents == 2500   (1500 base + 0 surcharge + 1000 biological premium); each line rounded independently before summing"
            - "Response field 'breakdown' lists base_cents=1500, surcharge_cents=0, premium_cents=1000 (the per-line literals proving the rounding order)"

  # =======================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: inbound_receipt_branching_with_revert
        grounds:
          - state_machines.InboundReceipt.INSPECTED_to_QUARANTINED
          - state_machines.InboundReceipt.QUARANTINED_to_ACCEPTED
          - state_machines.InboundReceipt.QUARANTINED_to_REJECTED
          - state_machines.InboundReceipt.INSPECTED_to_REJECTED
        distinguishing_aspect: |
          The InboundReceipt entity has a branching fork (INSPECTED → {ACCEPTED, QUARANTINED, REJECTED})
          with a comeback edge (QUARANTINED → ACCEPTED) that re-enters the happy path with divergent
          side-effect sets per branch (ACCEPT mints Lot + cert; QUARANTINE mints quarantine-zone Lot;
          REJECT mints no lot). This is a branching-with-revert shape on the InboundReceipt entity.
        test_recipe:
          setup:
            - "Warehouse W with REFRIGERATED zone Z1 (bin B1), QUARANTINE zone Z2 (bin B2)."
            - "Qualified Supplier S, qualified Product P (required_zone_type=REFRIGERATED)."
            - "Receipt R1 created with visual_pass=false (so nonconformance_reason will be VISUAL_FAIL)."
          trigger:
            - "POST /receipts/R1/inspect    (as user U_recv)"
            - "POST /receipts/R1/quarantine (as user U_qa1 — places lot in Z2/B2)"
            - "POST /receipts/R1/release-from-quarantine (as user U_qa2 — releases lot to Z1/B1, mints certificate)"
          assert:
            - "After quarantine: Lot.quality_status == QUARANTINED, Lot.bin_id == B2"
            - "After release: Receipt.status == ACCEPTED, Lot.quality_status == RELEASED, Lot.bin_id == B1, Receipt.acceptance_certificate_no starts with 'CERT-'"
            - "Bin B2.current_lot_id == null after release (quarantine bin cleared)"

      - name: zone_posture_cyclic_open_restricted_frozen_open
        grounds:
          - state_machines.Zone.OPEN_to_RESTRICTED
          - state_machines.Zone.OPEN_to_FROZEN
          - state_machines.Zone.RESTRICTED_to_FROZEN
          - state_machines.Zone.FROZEN_to_OPEN
          - state_machines.Zone.RESTRICTED_to_OPEN
        distinguishing_aspect: |
          The Zone entity has a CYCLIC posture machine OPEN ↔ RESTRICTED ↔ FROZEN ↔ OPEN — different
          entity from InboundReceipt and a structurally different non-linear shape (cycles, not
          fork-join with revert). Operationally a zone can leave the OPEN state, traverse
          RESTRICTED/FROZEN, and return to OPEN, then repeat.
        test_recipe:
          setup:
            - "Warehouse W (clock=0); REFRIGERATED zone Z (target 2..8 C, alarm 0..10 C)."
          trigger:
            - "POST /zones/Z/temperature-events {at_minutes:0, temp_c:11}   (ALARM_HIGH -> FROZEN)"
            - "POST /zones/Z/temperature-events {at_minutes:1, temp_c:5}    (IN_RANGE -> closes deviation pending QA)"
            - "POST /deviations/<dev_id>/assess {qa_decision: RELEASE} (closes deviation -> Zone returns to OPEN)"
            - "POST /zones/Z/temperature-events {at_minutes:2, temp_c:9}    (WARNING_HIGH -> RESTRICTED on second cycle)"
          assert:
            - "After event #1: Zone.current_posture == FROZEN"
            - "After deviation assessment: Zone.current_posture == OPEN"
            - "After event #4: Zone.current_posture == RESTRICTED  (cycle re-entered)"

  # =======================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =======================================================================
  - rule_id: transitive_cascade
    instances:

      - name: temperature_event_alarm_cascades_to_packed_shipment_quarantine
        grounds:
          - endpoints.POST_/zones/{id}/temperature-events
          - state_machines.Zone.OPEN_to_FROZEN
          - state_machines.Deviation.OPEN_to_CLOSED_PENDING_QA
          - state_machines.OutboundShipment.PACKED_to_QUARANTINED
        distinguishing_aspect: |
          Depth-3 chain originating from the temperature-event trigger:
            (A) temperature-event ALARM_HIGH on Zone
            ↓ caused by A: Zone posture flips OPEN→FROZEN, Bin status flips OCCUPIED→LOCKED, Deviation opened
            ↓ caused by the bin/deviation mutation (NOT by A directly): every Lot whose bin_id is in
              that Zone has quality_status RELEASED→QUARANTINED, cumulative_excursion_minutes ticked
            ↓ caused by the lot mutation (NOT by A directly): every PACKED OutboundShipment whose
              pick_lot_id is now QUARANTINED transitions PACKED→QUARANTINED
          The first triggering action is one POST /zones/.../temperature-events; the chain has three
          causal hops. Each link is triggered by the preceding mutation.
        test_recipe:
          setup:
            - "Warehouse W with REFRIGERATED zone Z (target 2..8 C, alarm 0..10 C), bin B."
            - "Receipt R accepted -> Lot L (RELEASED, bin_id=B, quantity_on_hand=10)."
            - "Shipment S (qty=5) PICKED + PACKED (pick_lot_id=L). Bin still references L for the remaining 5 units."
          trigger:
            - "POST /zones/Z/temperature-events {at_minutes:1, temp_c:12}   (ALARM_HIGH)"
          assert:
            - "Zone Z.current_posture == FROZEN"
            - "Bin B.status == LOCKED"
            - "Lot L.quality_status == QUARANTINED"
            - "Shipment S.status == QUARANTINED"
            - "Exactly one Deviation row exists for Zone Z, status=OPEN"

      - name: recall_announce_cascades_to_lot_recalled_and_shipment_recall_tag
        grounds:
          - state_machines.Recall.DRAFT_to_ANNOUNCED
          - entities.Lot.fields.quality_status
          - entities.RecallScopeEntry
          - entities.AuditLogEntry
        distinguishing_aspect: |
          Depth-2 chain originating from POST /recalls/{id}/announce — a DIFFERENT triggering
          transition from instance #1:
            (A) Recall.status DRAFT→ANNOUNCED
            ↓ caused by A: every Lot referenced in RecallScopeEntry rows has quality_status set to
              RECALLED (cascade across the many-to-many recall-lot junction)
            ↓ caused by the Lot mutation (NOT by A directly): an AuditLogEntry is written for each
              recalled lot capturing the quality_status change (action=LOT_RECALL_CASCADE), and the
              denormalised Recall.notifications_required is recomputed from distinct customer_ids
              across all shipments that drew from these now-RECALLED lots.
          The chain originates from the recall trigger, not the temperature trigger.
        test_recipe:
          setup:
            - "Warehouse W; two Lots L1 (customer C1 picked 3 units), L2 (customers C1 and C2 each picked)."
            - "Recall R (CLASS_II) DRAFT with scope entries covering L1 (units=3) and L2 (units=4)."
          trigger:
            - "POST /recalls/R/announce  (single action)"
          assert:
            - "Lot L1.quality_status == RECALLED"
            - "Lot L2.quality_status == RECALLED"
            - "Recall R.notifications_required == 2     (distinct customer_ids: C1, C2)"
            - "AuditLogEntry rows for action='LOT_RECALL_CASCADE' count == 2 (one per recalled lot, written downstream of the announce)"

  # =======================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =======================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_zone_frozen_on_inspected_receipt
        grounds:
          - validations[priority=7]     # ERR_RECEIPT_NOT_INSPECTED (state)
          - validations[priority=11]    # ERR_ZONE_FROZEN (business_safety)
        distinguishing_aspect: |
          A QA officer attempts to accept a receipt that is BOTH (a) not in INSPECTED state (it is
          already QUARANTINED) AND (b) targets a zone whose posture is FROZEN. The state check
          (priority 7) fires before the business_safety check (priority 11), so the response is
          ERR_RECEIPT_NOT_INSPECTED, not ERR_ZONE_FROZEN. This conflict is state-vs-business_safety.
        test_recipe:
          setup:
            - "Warehouse W with REFRIGERATED zone Z (in posture FROZEN due to prior alarm)."
            - "Receipt R already in QUARANTINED status."
          trigger:
            - "POST /receipts/R/accept  (as QAOfficer)"
          assert:
            - "Response status == 409"
            - "Response data.error_id == 'ERR_RECEIPT_NOT_INSPECTED'  (state wins over zone-frozen)"

      - name: business_safety_vs_business_constraint_unqualified_supplier_and_segregation
        grounds:
          - validations[priority=12]    # ERR_UNQUALIFIED_SUPPLIER (business_safety)
          - validations[priority=16]    # ERR_SEGREGATION_VIOLATION (business_constraint)
        distinguishing_aspect: |
          On POST /receipts/{id}/accept, a receipt has BOTH (a) an unqualified supplier AND (b)
          would require a bin whose special_storage_tag does not match product.special_storage_tag
          (no matching bin exists, would violate segregation). The business_safety check (priority 12)
          fires before the business_constraint check (priority 16), so the response is
          ERR_UNQUALIFIED_SUPPLIER. This is a different category pair from instance #1.
        test_recipe:
          setup:
            - "Warehouse W with one REFRIGERATED bin B with special_storage_tag=NONE only."
            - "Supplier S with qualified=false."
            - "Product P (required_zone_type=REFRIGERATED, special_storage_tag=NARCOTIC) — would require NARCOTIC-tagged bin (none exists)."
            - "Receipt R from S for P, inspected to INSPECTED status."
          trigger:
            - "POST /receipts/R/accept  (as QAOfficer)"
          assert:
            - "Response status == 422"
            - "Response data.error_id == 'ERR_UNQUALIFIED_SUPPLIER'  (business_safety wins over business_constraint)"

  # =======================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: deviation_classification_at_60min_boundary
        grounds:
          - calculations.deviation_classification
          - endpoints.POST_/zones/{id}/temperature-events
          - entities.Deviation.fields.duration_minutes
          - entities.Deviation.fields.classification
        distinguishing_aspect: |
          The threshold for MAJOR classification is duration >= 60 (inclusive). A deviation lasting
          exactly 60 minutes must classify as MAJOR; one lasting 59 minutes must classify as MINOR.
          The metric is duration_minutes on Deviation, reachable through POST /zones/{id}/temperature-events.
        test_recipe:
          setup:
            - "Warehouse W (clock=0); REFRIGERATED zone Z (target 2..8 C)."
          trigger:
            - "POST /zones/Z/temperature-events {at_minutes:1, temp_c:10}   (out-of-range, opens dev)"
            - "POST /warehouses/W/_clock/advance {minutes:60}"
            - "POST /zones/Z/temperature-events {at_minutes:60, temp_c:10}  (still out)"
            - "POST /zones/Z/temperature-events {at_minutes:61, temp_c:5}   (in-range — closes dev; duration=60)"
          assert:
            - "Deviation.duration_minutes == 60"
            - "Deviation.classification == 'MAJOR'  (>=60 boundary exactly hit)"

      - name: empty_pick_pool_on_pick_endpoint
        grounds:
          - calculations.fefo_pick_selection
          - endpoints.POST_/shipments/{id}/pick
          - validations[priority=21]    # ERR_INSUFFICIENT_STOCK uses the same gate; here we hit empty-pool first
        distinguishing_aspect: |
          Boundary on an EMPTY-COLLECTION metric (different from a numeric threshold): when zero
          candidate Lots survive the FEFO eligibility filter (e.g., every lot is RECALLED, leaving
          the candidate set empty), the pick endpoint must respond ERR_NO_FEFO_LOT — not
          ERR_INSUFFICIENT_STOCK. Reachable through POST /shipments/{id}/pick (different endpoint
          from instance #1's temperature-events endpoint).
        test_recipe:
          setup:
            - "Warehouse W; REFRIGERATED zone Z; product P; Lot L1 in RECALLED status (only lot for P)."
            - "Shipment S (P, qty=1) in PLANNED."
          trigger:
            - "POST /shipments/S/pick"
          assert:
            - "Response status == 422"
            - "Response data.error_id == 'ERR_NO_FEFO_LOT'   (empty-pool case, not ERR_INSUFFICIENT_STOCK which presumes a candidate lot existed)"

  # =======================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =======================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: shipment_pick_depends_on_lot_quality_status
        grounds:
          - state_machines.OutboundShipment.PLANNED_to_PICKED
          - entities.Lot.fields.quality_status
          - validations[priority=8]    # ERR_SHIPMENT_STATE_INVALID is the shipment-side; precondition uses Lot.quality_status
        distinguishing_aspect: |
          OutboundShipment.PLANNED→PICKED is gated by the state of a different entity Lot —
          specifically Lot.quality_status must be RELEASED. The dependency crosses the
          OutboundShipment↔Lot pair.
        test_recipe:
          setup:
            - "Warehouse W; Lot L (RELEASED initially); Shipment S (PLANNED, product matches L)."
            - "Transition L.quality_status to QUARANTINED by triggering a deviation in L's zone."
          trigger:
            - "POST /shipments/S/pick"
          assert:
            - "Response status == 422 (no released candidate lot)"
            - "Response data.error_id == 'ERR_NO_FEFO_LOT'  (Lot not in RELEASED disqualifies it from FEFO candidate set)"

      - name: receipt_accept_depends_on_zone_posture
        grounds:
          - state_machines.InboundReceipt.INSPECTED_to_ACCEPTED
          - entities.Zone.fields.current_posture
          - validations[priority=11]    # ERR_ZONE_FROZEN
        distinguishing_aspect: |
          InboundReceipt.INSPECTED→ACCEPTED is gated by the state of a different entity Zone —
          specifically Zone.current_posture must not be FROZEN for the target zone. The dependency
          crosses the InboundReceipt↔Zone pair (different from the OutboundShipment↔Lot pair of
          instance #1).
        test_recipe:
          setup:
            - "Warehouse W; REFRIGERATED zone Z (FROZEN due to prior alarm)."
            - "Receipt R (product requires REFRIGERATED) inspected to INSPECTED, nonconformance_reason=NONE."
          trigger:
            - "POST /receipts/R/accept"
          assert:
            - "Response status == 409"
            - "Response data.error_id == 'ERR_ZONE_FROZEN'  (Zone state disqualifies the receipt transition)"

  # =======================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: bin_single_lot_occupancy_overlap_inclusive
        grounds:
          - entities.Bin.fields.current_lot_id
          - entities.Bin.fields.status
          - concurrency_rules[fefo_bin_allocation_same_bin]
          - state_machines.InboundReceipt.INSPECTED_to_ACCEPTED
        distinguishing_aspect: |
          Bin occupancy interval is CLOSED (a bin holds exactly one lot from accept to fully picked-
          out). Two concurrent ACCEPT transitions racing for the same Bin: the geometric semantic is
          point-occupancy (bin holds at most ONE lot at any instant — overlap of [t_accept, t_emptied]
          intervals is forbidden). The resource entity is Bin; second writer rejected with
          ERR_BIN_UNAVAILABLE.
        test_recipe:
          setup:
            - "Warehouse W; REFRIGERATED zone Z with exactly one AVAILABLE bin B."
            - "Two INSPECTED receipts R1 and R2, both eligible for B."
          trigger:
            - "POST /receipts/R1/accept (qa_a) — succeeds"
            - "POST /receipts/R2/accept (qa_b) — racing"
          assert:
            - "R1.status == ACCEPTED, Bin B.current_lot_id == Lot(R1).id, Bin B.status == OCCUPIED"
            - "R2 response data.error_id == 'ERR_NO_ELIGIBLE_BIN' or 'ERR_BIN_UNAVAILABLE'  (no second occupancy permitted)"

      - name: zone_capacity_aggregate_overlap_capacity
        grounds:
          - entities.Zone.fields.capacity_units
          - entities.Zone.fields.utilization_units
          - validations[priority=28]    # ERR_ZONE_CAPACITY_EXCEEDED
          - calculations.zone_utilization_invariant
        distinguishing_aspect: |
          Zone capacity uses AGGREGATE-CAPACITY semantics (different interval/occupation geometry
          from bin point-occupancy): the sum of all per-bin volumes must not exceed Zone.capacity_units.
          Multiple lots may overlap in time across different bins, but their aggregate volume cannot.
          Resource entity is Zone (different from Bin in instance #1); the interval semantic is
          aggregate-capacity, not point-occupancy.
        test_recipe:
          setup:
            - "Warehouse W; REFRIGERATED zone Z with capacity_units=10; two bins B1 (vol=8), B2 (vol=8)."
            - "Receipt R1 (qty=8) accepted -> bin B1, Z.utilization_units==8."
            - "Receipt R2 (qty=8) INSPECTED, eligible for B2."
          trigger:
            - "POST /receipts/R2/accept"
          assert:
            - "Response status == 422"
            - "Response data.error_id == 'ERR_ZONE_CAPACITY_EXCEEDED'  (8+8 > 10 aggregate cap)"

  # =======================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =======================================================================
  - rule_id: compensating_invariant
    instances:

      - name: lot_units_conserved_on_pick_then_cancel
        grounds:
          - calculations.conserved_lot_units
          - state_machines.OutboundShipment.PLANNED_to_PICKED
          - state_machines.OutboundShipment.PICKED_to_CANCELLED
          - entities.Lot.fields.quantity_on_hand
          - entities.Lot.fields.quantity_picked
        distinguishing_aspect: |
          Conserved quantity: TOTAL_UNITS(Lot) = Lot.quantity_on_hand + Lot.quantity_picked.
          Forward action POST /shipments/{id}/pick decrements on_hand and increments picked by Q.
          Compensator POST /shipments/{id}/cancel reverses both. After the pair, TOTAL_UNITS(Lot)
          equals its pre-pick value — i.e. drift==0. This is the "unit-count" conserved quantity.
        test_recipe:
          setup:
            - "Lot L with quantity_on_hand=10, quantity_picked=0 (TOTAL=10)."
            - "Shipment S (qty=4) PLANNED."
          trigger:
            - "POST /shipments/S/pick"
            - "POST /shipments/S/cancel"
          assert:
            - "After pick: Lot L.quantity_on_hand == 6, Lot.quantity_picked == 4  (TOTAL=10)"
            - "After cancel: Lot L.quantity_on_hand == 10, Lot.quantity_picked == 0  (TOTAL=10 — drift=0)"

      - name: zone_volume_conserved_on_accept_then_recall_return
        grounds:
          - calculations.zone_utilization_invariant
          - state_machines.InboundReceipt.INSPECTED_to_ACCEPTED
          - state_machines.Recall.RETURNS_IN_PROGRESS_to_EFFECTIVENESS_CHECK
          - entities.Zone.fields.utilization_units
          - entities.Bin.fields.occupied_volume
        distinguishing_aspect: |
          Conserved quantity: TOTAL_OCCUPIED_VOLUME across warehouse = Σ Zone.utilization_units =
          Σ Bin.occupied_volume. ACCEPT places volume Q into a REFRIGERATED-zone bin; recall-return
          moves the same volume into a QUARANTINE-zone bin. The forward+compensator pair must leave
          the total occupied volume in the WAREHOUSE unchanged (volume conserved across zones — a
          different conserved quantity from Rule 9 instance #1's unit count).
        test_recipe:
          setup:
            - "Warehouse W with REFRIGERATED zone Z1 (cap 100), bin B1 (vol 100); QUARANTINE zone Z2 (cap 100), bin B2 (vol 100)."
            - "Receipt R (qty=5) accepted -> Lot L in B1 (Z1.utilization=5, Z2.utilization=0; warehouse total=5)."
            - "Shipment S picked all 5 units of L, dispatched (Z1.utilization=0; warehouse total=0)."
            - "Recall R covering shipment S with scope_kind=SHIPPED, units=5, ANNOUNCED, RETURNS_IN_PROGRESS."
          trigger:
            - "POST /recalls/R/record-return {scope_entry_id, units:5}"
          assert:
            - "After return: Z2.utilization_units == 5 (units moved into quarantine bin B2)"
            - "Z1.utilization_units == 0"
            - "WAREHOUSE total Σ utilization == 5 — equals the original ACCEPT volume (drift=0; conservation is the in-store volume after a complete accept->ship->return cycle)"
