# =============================================================================
# Scaffold: Single-Brand Line Extension & Distributor Coverage Management
# Difficulty directive: beyond expert level — dense interacting rules, cyclic
# state machines, dual-variant calculations, temporal overlap regimes, OCC.
# =============================================================================

scenario: |
  Single-Brand Line Extension & Distributor Coverage Management (WD-40 Company): core product formulation protected as a trade secret with contract manufacturing under confidentiality, line extension development that leverages the brand without diluting the core product's identity, distributor and retailer coverage management across hardware, automotive, industrial and mass channels, packaging format proliferation across can sizes and delivery systems with tooling and filling line implications, pricing and promotion discipline for a low-price high-frequency item with pack size differentiation by channel, international market expansion through distributors with local formulation and registration requirements, brand protection against genericization and counterfeit product, marketing built on use cases with consumer-submitted applications

domain_name: brand-line-coverage
api_prefix: /brand-ops

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand display name" }
      - { name: legal_entity_name, type: string, source: input, description: "Owning legal entity name" }
      - { name: equity_budget_bps, type: integer, source: input, default: 10000, constraints: "> 0", description: "Annual brand-equity dilution budget in basis points; launch gate consumes it" }
      - { name: status, type: enum, source: system, constraints: "OPERATING | PROTECTIVE_LOCKDOWN", description: "Lifecycle state; PROTECTIVE_LOCKDOWN blocks launches, registration submits and exclusive coverage activation" }
      - { name: lockdown_reason, type: enum, source: system, constraints: "CONFIDENTIALITY_BREACH | COUNTERFEIT_SURGE | MANUAL | null", description: "Why the brand entered PROTECTIVE_LOCKDOWN; null while OPERATING" }
      - { name: protection_posture, type: enum, source: computed, constraints: "NORMAL | ELEVATED | CRITICAL", description: "Derived from open counterfeit cases and for-cause confidentiality revocations; gates promo depth, launches, registration submits" }
      - { name: dilution_consumed_bps, type: integer, source: computed, description: "Sum of dilution_cost_bps over PILOT+LAUNCHED lines plus floor(cost/2) over DISCONTINUED lines of this brand" }
      - { name: core_identity_share_bps, type: integer, source: computed, description: "max(0, 10000 - dilution_consumed_bps); launch requires the post-launch value to stay >= 7000" }
      - { name: genericization_risk_bps, type: integer, source: computed, description: "min(10000, 100 * flagged PUBLISHED use cases + 50 * flagged VERIFIED use cases) across all lines of the brand" }

  - name: ProductLine
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; owning brand (supplied via path on create)" }
      - { name: line_code, type: string, source: input, description: "Machine code unique per brand among non-DISCONTINUED lines (e.g. CORE, SMART-STRAW)" }
      - { name: name, type: string, source: input, description: "Human name of the product line" }
      - { name: is_core, type: boolean, source: input, default: false, description: "True for the single flagship core line; at most one non-DISCONTINUED core line per brand; core line dilution cost is always 0" }
      - { name: target_channels, type: array, source: input, constraints: "non-empty subset of HARDWARE | AUTOMOTIVE | INDUSTRIAL | MASS", description: "Channels this line may be sold through" }
      - { name: status, type: enum, source: system, constraints: "FORMULATION | PILOT | LAUNCHED | DISCONTINUED", description: "Line lifecycle with brand-review revision loop" }
      - { name: brand_review_attempts, type: integer, source: system, default: 0, description: "Count of REJECT decisions; reaching 3 auto-discontinues the line" }
      - { name: dilution_cost_bps, type: integer, source: computed, description: "Brand-equity cost of this line per calculation line_dilution_cost; live-computed until the line first enters PILOT, frozen from then on; lines that never reached PILOT contribute nothing to brand consumption" }
      - { name: launched_at, type: datetime, source: system, description: "Set when the line enters LAUNCHED; null otherwise" }

  - name: Formulation
    parent: null
    common_fields: true
    fields:
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id; owning line (supplied via path on create)" }
      - { name: version_label, type: string, source: input, description: "Free-form version label, e.g. v1.0 or LOW-VOC-EU" }
      - { name: master_formulation_id, type: string, source: input, description: "FK -> Formulation.id; null for a master formulation; local market variants reference their master", default: null }
      - { name: component_codes, type: array, source: input, constraints: "1..12 non-empty strings", description: "Trade-secret component identifiers; sealing requires at least 3" }
      - { name: voc_class, type: enum, source: input, constraints: "STANDARD | LOW_VOC", description: "Volatile-organic-compound class; STRICT markets require LOW_VOC formulations" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | SEALED | COMPARTMENTALIZED", description: "SEALED after seal action; COMPARTMENTALIZED when every component is covered by at least one ACTIVE grant" }
      - { name: sealed_at, type: datetime, source: system, description: "Set on DRAFT -> SEALED; null before" }

  - name: ContractManufacturer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Manufacturer legal name" }
      - { name: site_country, type: string, source: input, description: "ISO country code of the production site" }
      - { name: capabilities, type: array, source: input, constraints: "non-empty subset of BLENDING | AEROSOL_FILL | LIQUID_FILL | PACKAGING", description: "Certified capabilities" }
      - { name: sponsoring_officer_id, type: string, source: system, description: "X-User-ID of the TradeSecretOfficer who created the record; excluded from for-cause revocation of this manufacturer's grants" }
      - { name: status, type: enum, source: system, constraints: "VETTING | QUALIFIED | SUSPENDED", description: "QUALIFIED required to hold grants; SUSPENDED by for-cause revocation cascade" }
      - { name: suspended_at, type: datetime, source: system, description: "When the manufacturer last entered SUSPENDED; null otherwise" }
      - { name: disclosed_component_count, type: integer, source: computed, description: "Count of distinct (formulation_id, component_code) pairs covered by this manufacturer's GRANTED or ACTIVE grants" }

  - name: ConfidentialityGrant
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer_id, type: string, source: input, description: "FK -> ContractManufacturer.id" }
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id" }
      - { name: component_scope, type: array, source: input, constraints: "non-empty subset of the formulation's component_codes", description: "Components disclosed under this grant" }
      - { name: grant_reason, type: enum, source: input, constraints: "PRODUCTION | PILOT_SUPPLY | SECOND_SOURCE", description: "Business reason for disclosure" }
      - { name: expires_on, type: datetime, source: input, description: "Grant expiry instant; must be strictly after the current logical time at create and at grant action" }
      - { name: status, type: enum, source: system, constraints: "REQUESTED | GRANTED | ACTIVE | REVOKED | EXPIRED", description: "Grant lifecycle" }
      - { name: granted_by_user_id, type: string, source: system, description: "X-User-ID recorded at the grant action; segregation-of-duties excludes this user from for-cause revocation" }
      - { name: revoked_for_cause, type: boolean, source: system, default: false, description: "True when revoked for confidentiality cause; feeds brand protection_posture" }
      - { name: revoked_at, type: datetime, source: system, description: "When the grant entered REVOKED; null otherwise" }

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Distributor legal name" }
      - { name: home_market_id, type: string, source: input, description: "FK -> Market.id; distributor's home market" }
      - { name: channels_served, type: array, source: input, constraints: "non-empty subset of HARDWARE | AUTOMOTIVE | INDUSTRIAL | MASS", description: "Channels this distributor is contracted to serve" }
      - { name: credit_limit_cents, type: integer, source: input, constraints: "> 0", description: "Trade credit ceiling (informational)" }
      - { name: status, type: enum, source: system, constraints: "APPLICANT | APPROVED | SUSPENDED | TERMINATED", description: "Distributor lifecycle with reinstatement loop and 3-strike termination" }
      - { name: suspension_count, type: integer, source: system, default: 0, description: "Increments on every entry into SUSPENDED; when a suspension would make this 3, the distributor goes straight to TERMINATED" }
      - { name: attainment_actual_bps, type: integer, source: computed, description: "Coverage attainment vs quota over the trailing 3 completed months, ACTUAL variant; null until first recomputation" }
      - { name: attainment_projected_bps, type: integer, source: computed, description: "Best-month-annualized PROJECTED variant of the same reports; null until first recomputation" }
      - { name: quota_compliance_tier, type: enum, source: computed, constraints: "GOLD | STANDARD | WATCH | SANCTION | null", description: "Tier from attainment_actual_bps: GOLD >= 12000, STANDARD >= 10000, WATCH >= 9000, else SANCTION" }

  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: country_code, type: string, source: input, constraints: "unique across markets", description: "ISO country code" }
      - { name: name, type: string, source: input, description: "Market display name" }
      - { name: registration_required, type: boolean, source: input, description: "True when product registration must be ACTIVE before coverage activates" }
      - { name: voc_regime, type: enum, source: input, constraints: "STANDARD | STRICT", description: "STRICT markets accept only LOW_VOC formulations" }
      - { name: allowed_channels, type: array, source: input, constraints: "non-empty subset of HARDWARE | AUTOMOTIVE | INDUSTRIAL | MASS", description: "Channels legally sellable in this market" }
      - { name: status, type: enum, source: system, constraints: "OPEN | CLOSED", description: "OPEN at creation; CLOSED is terminal" }

  - name: MarketRegistration
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id" }
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id; must belong to product_line_id and satisfy the market VOC regime" }
      - { name: registration_number, type: string, source: system, description: "Authority registration number supplied at approve; null before" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | SUBMITTED | REJECTED | ACTIVE | RENEWAL_DUE | EXPIRED | REVOKED", description: "Registration lifecycle with reject-revise and renewal loops" }
      - { name: expires_on, type: datetime, source: input, description: "Registration expiry; must be strictly after current logical time at create" }
      - { name: revise_count, type: integer, source: system, default: 0, description: "Number of REJECTED -> DRAFT revisions" }
      - { name: submitted_at, type: datetime, source: system, description: "When the registration entered SUBMITTED; null otherwise" }
      - { name: approved_at, type: datetime, source: system, description: "When the registration first entered ACTIVE; null otherwise" }

  - name: CoverageAssignment
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id (supplied via path on create)" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id" }
      - { name: channel, type: enum, source: input, constraints: "HARDWARE | AUTOMOTIVE | INDUSTRIAL | MASS", description: "Channel this assignment covers" }
      - { name: exclusive, type: boolean, source: input, default: false, description: "Exclusive assignments block any overlapping exclusive assignment on the same (market_id, channel, product_line_id) cell" }
      - { name: starts_on, type: string, source: input, constraints: "YYYY-MM-DD date", description: "Coverage window start date (closed interval)" }
      - { name: ends_on, type: string, source: input, constraints: "YYYY-MM-DD date, > starts_on", description: "Coverage window end date, inclusive" }
      - { name: annual_quota_units, type: integer, source: input, constraints: "> 0", description: "Annual sell-through quota in units" }
      - { name: status, type: enum, source: system, constraints: "PROPOSED | ACTIVE | SUSPENDED | SUPERSEDED | WITHDRAWN | CLOSED | TERMINATED", description: "Assignment lifecycle; SUSPENDED still reserves exclusivity" }
      - { name: supersedes_assignment_id, type: string, source: system, description: "When creation superseded PROPOSED proposals on the same cell, references the superseded proposal with the greatest created_at; null otherwise" }

  - name: PackFormat
    parent: null
    common_fields: true
    fields:
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id (supplied via path on create)" }
      - { name: size_ml, type: integer, source: input, constraints: "> 0", description: "Net contents in millilitres" }
      - { name: delivery_system, type: enum, source: input, constraints: "AEROSOL | TRIGGER_SPRAY | PUMP | PRECISION_PEN | BULK_CONTAINER", description: "Dispensing system; novelty vs other LAUNCHED lines feeds dilution cost" }
      - { name: channel_restrictions, type: array, source: input, constraints: "non-empty subset of the owning line's target_channels", description: "Channels this pack format may be priced and promoted in" }
      - { name: case_pack_qty, type: integer, source: input, default: 1, constraints: ">= 1", description: "Units per trade case; used by promo_case_price" }
      - { name: status, type: enum, source: system, constraints: "DESIGNED | TOOLED | IN_PRODUCTION | RETIRED", description: "Packaging lifecycle with tooling and production gates" }

  - name: ChannelPriceList
    parent: null
    common_fields: true
    fields:
      - { name: pack_format_id, type: string, source: input, description: "FK -> PackFormat.id (supplied via path on create)" }
      - { name: channel, type: enum, source: input, constraints: "HARDWARE | AUTOMOTIVE | INDUSTRIAL | MASS", description: "Channel this price applies to; must be in the pack's channel_restrictions" }
      - { name: list_price_cents, type: integer, source: input, constraints: "> 0", description: "Channel list price per unit" }
      - { name: map_price_cents, type: integer, source: input, constraints: "> 0 and <= list_price_cents", description: "Minimum advertised price per unit; promo selling price may not undercut it" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open effective window start" }
      - { name: effective_to, type: datetime, source: input, constraints: "> effective_from", description: "Half-open effective window end; windows may touch but not overlap" }
      - { name: status, type: enum, source: system, constraints: "SCHEDULED | EFFECTIVE | SUPERSEDED | EXPIRED", description: "EFFECTIVE when current logical time is inside [effective_from, effective_to); SUPERSEDED/EXPIRED by newer lists or time" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id" }
      - { name: channel, type: enum, source: input, constraints: "HARDWARE | AUTOMOTIVE | INDUSTRIAL | MASS", description: "Channel the promotion runs in" }
      - { name: discount_pct, type: number, source: input, constraints: "0 < discount_pct <= 90.00, two decimals", description: "Percent off the channel list price" }
      - { name: starts_on, type: string, source: input, constraints: "YYYY-MM-DD date", description: "First live date, inclusive" }
      - { name: ends_on, type: string, source: input, constraints: "YYYY-MM-DD date, >= starts_on", description: "Last live date, inclusive" }
      - { name: funding_budget_cents, type: integer, source: input, constraints: "> 0", description: "Total trade-promotion funding pool" }
      - { name: accrued_funding_cents, type: integer, source: computed, default: 0, description: "Funding consumed by redemptions so far" }
      - { name: redemptions_count, type: integer, source: system, default: 0, description: "Number of accepted redemptions" }
      - { name: unit_funding_provisional_cents, type: integer, source: computed, description: "PROVISIONAL variant of promo_funding computed at approve from the price list covering starts_on; null before approval" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | PENDING_APPROVAL | APPROVED | LIVE | SUSPENDED | ENDED", description: "Promotion lifecycle; LIVE<->SUSPENDED is the brand-protection loop" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the PricingAnalyst creator; the approver must differ" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID recorded at approve; null before" }

  - name: CounterfeitCase
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id (supplied via path on create)" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id where the counterfeit surfaced" }
      - { name: channel, type: enum, source: input, constraints: "HARDWARE | AUTOMOTIVE | INDUSTRIAL | MASS", description: "Channel of the counterfeit finding" }
      - { name: severity, type: integer, source: input, constraints: "1..5", description: "Severity 1 (isolated) to 5 (systemic)" }
      - { name: units_seized, type: integer, source: input, default: 0, constraints: ">= 0", description: "Units seized; overwritten at take-action" }
      - { name: status, type: enum, source: system, constraints: "REPORTED | ACTION_TAKEN | CLOSED", description: "Case lifecycle" }

  - name: UseCaseSubmission
    parent: null
    common_fields: true
    fields:
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id (supplied via path on create)" }
      - { name: submitter_ref, type: string, source: input, description: "Consumer handle; must equal the caller X-User-ID" }
      - { name: title, type: string, source: input, description: "Short use-case title" }
      - { name: description, type: string, source: input, description: "Consumer-submitted application description" }
      - { name: generic_use_flag, type: boolean, source: system, default: false, description: "Set at review: true when the submission uses the brand name generically (feeds genericization risk)" }
      - { name: status, type: enum, source: system, constraints: "SUBMITTED | VERIFIED | REJECTED | PUBLISHED | RETRACTED", description: "Moderation lifecycle" }

  - name: SellThroughReport
    parent: null
    common_fields: false
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id (supplied via path on create)" }
      - { name: coverage_assignment_id, type: string, source: input, description: "FK -> CoverageAssignment.id; must belong to the path distributor" }
      - { name: period_month, type: string, source: input, constraints: "YYYY-MM", description: "Reported month; must be a completed month strictly before the current logical month" }
      - { name: units_sold, type: integer, source: input, constraints: ">= 0", description: "Units sold through in the period" }
      - { name: units_returned, type: integer, source: input, default: 0, constraints: ">= 0", description: "Units returned in the period" }
      - { name: net_units, type: integer, source: computed, description: "max(0, units_sold - units_returned)" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Brand
    initial_state: OPERATING
    terminal_states: []
    transitions:
      - from: OPERATING
        to: PROTECTIVE_LOCKDOWN
        trigger: "POST /brand-ops/brands/{id}/lockdown"
        actor: ComplianceAuditor
        preconditions:
          - "reason is one of CONFIDENTIALITY_BREACH | COUNTERFEIT_SURGE | MANUAL"
        side_effects:
          - "lockdown_reason := reason"
      - from: PROTECTIVE_LOCKDOWN
        to: OPERATING
        trigger: "POST /brand-ops/brands/{id}/lift-lockdown"
        actor: ComplianceAuditor
        preconditions:
          - "no CounterfeitCase of this brand with status IN {REPORTED, ACTION_TAKEN} and severity == 5 (ERR_LOCKDOWN_CONDITIONS_UNMET)"
          - "no ConfidentialityGrant on formulations of this brand's lines with revoked_for_cause == true and revoked_at within the trailing 90 days (ERR_LOCKDOWN_CONDITIONS_UNMET)"
        side_effects:
          - "lockdown_reason := null"

  - entity: ProductLine
    initial_state: FORMULATION
    terminal_states: [DISCONTINUED]
    transitions:
      - from: FORMULATION
        to: FORMULATION
        trigger: "POST /brand-ops/product-lines/{id}/brand-review with decision=REJECT"
        actor: BrandManager
        preconditions:
          - "brand_review_attempts < 2 (the third rejection auto-discontinues instead)"
        side_effects:
          - "brand_review_attempts += 1"
        note: "Revision loop: the line stays in FORMULATION for rework."
      - from: FORMULATION
        to: DISCONTINUED
        trigger: "POST /brand-ops/product-lines/{id}/brand-review with decision=REJECT when brand_review_attempts == 2"
        actor: system
        preconditions: []
        side_effects:
          - "brand_review_attempts := 3"
          - "recompute brand dilution_consumed_bps and core_identity_share_bps"
        note: "Third rejection kills the line automatically."
      - from: FORMULATION
        to: PILOT
        trigger: "POST /brand-ops/product-lines/{id}/brand-review with decision=APPROVE"
        actor: BrandManager
        preconditions:
          - "at least one Formulation of this line has status IN {SEALED, COMPARTMENTALIZED} (ERR_FORMULATION_NOT_SEALED)"
          - "brand.dilution_consumed_bps + this line's live dilution_cost_bps <= brand.equity_budget_bps (ERR_EQUITY_BUDGET_EXCEEDED)"
          - "brand.core_identity_share_bps - this line's live dilution_cost_bps >= 7000 (ERR_CORE_IDENTITY_DILUTION)"
        side_effects:
          - "freeze dilution_cost_bps at its current value (lines that never reach PILOT keep a live-computed preview and contribute nothing if discontinued)"
          - "recompute brand dilution_consumed_bps and core_identity_share_bps (the line now counts at full frozen cost)"
      - from: PILOT
        to: LAUNCHED
        trigger: "POST /brand-ops/product-lines/{id}/launch"
        actor: BrandManager
        preconditions:
          - "brand.status == OPERATING (ERR_BRAND_IN_LOCKDOWN)"
          - "brand.protection_posture != CRITICAL (ERR_POSTURE_CRITICAL)"
          - "at least one PackFormat of this line has status IN_PRODUCTION (ERR_NO_PRODUCIBLE_PACK_FORMAT)"
        side_effects:
          - "launched_at := current logical time"
          - "dilution fields unchanged (the frozen cost was counted at PILOT entry)"
      - from: PILOT
        to: DISCONTINUED
        trigger: "POST /brand-ops/product-lines/{id}/discontinue"
        actor: BrandManager
        preconditions:
          - "is_core == false (ERR_CORE_LINE_IMMUTABLE)"
        side_effects:
          - "recompute brand dilution_consumed_bps and core_identity_share_bps (discontinued lines contribute floor(dilution_cost_bps / 2))"
      - from: LAUNCHED
        to: DISCONTINUED
        trigger: "POST /brand-ops/product-lines/{id}/discontinue"
        actor: BrandManager
        preconditions:
          - "is_core == false (ERR_CORE_LINE_IMMUTABLE)"
        side_effects:
          - "recompute brand dilution_consumed_bps and core_identity_share_bps"

  - entity: Formulation
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /brand-ops/formulations/{id}/seal"
        actor: TradeSecretOfficer
        preconditions:
          - "component_codes has at least 3 entries (ERR_INSUFFICIENT_COMPONENTS)"
        side_effects:
          - "sealed_at := current logical time"
      - from: SEALED
        to: COMPARTMENTALIZED
        trigger: "system (automatic when a ConfidentialityGrant activation completes component coverage)"
        actor: system
        preconditions:
          - "every component_code is covered by at least one grant of this formulation with status == ACTIVE"
        side_effects: []
      - from: COMPARTMENTALIZED
        to: SEALED
        trigger: "system (automatic when a grant revocation or expiry breaks component coverage)"
        actor: system
        preconditions:
          - "some component_code is no longer covered by any grant of this formulation with status == ACTIVE"
        side_effects: []

  - entity: ContractManufacturer
    initial_state: VETTING
    terminal_states: []
    transitions:
      - from: VETTING
        to: QUALIFIED
        trigger: "POST /brand-ops/contract-manufacturers/{id}/qualify"
        actor: TradeSecretOfficer
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /brand-ops/contract-manufacturers/{id}/qualify"
        actor: TradeSecretOfficer
        preconditions:
          - "no ConfidentialityGrant of this manufacturer with revoked_for_cause == true and revoked_at within the trailing 90 days (ERR_RECENT_BREACH)"
        side_effects:
          - "suspended_at := null"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "system (cascade: a ConfidentialityGrant of this manufacturer is revoked with for_cause=true)"
        actor: system
        preconditions: []
        side_effects:
          - "suspended_at := current logical time"
          - "every other ConfidentialityGrant of this manufacturer with status IN {REQUESTED, GRANTED, ACTIVE} -> REVOKED with revoked_for_cause := true and revoked_at := now (cascade link 2)"
          - "each affected Formulation re-evaluates component coverage and may regress COMPARTMENTALIZED -> SEALED (cascade link 3)"
          - "recompute protection_posture on every Brand owning an affected formulation's line"

  - entity: ConfidentialityGrant
    initial_state: REQUESTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /brand-ops/confidentiality-grants/{id}/grant"
        actor: TradeSecretOfficer
        preconditions:
          - "expires_on is strictly after current logical time (ERR_GRANT_EXPIRED)"
          - "compartmentalization: the union of component_scope across this manufacturer's grants ON THE SAME formulation with status IN {GRANTED, ACTIVE} plus this scope satisfies |union| * 2 <= |formulation.component_codes| (ERR_COMPARTMENT_SCOPE_EXCEEDED)"
        side_effects:
          - "granted_by_user_id := caller X-User-ID"
          - "recompute manufacturer.disclosed_component_count"
      - from: GRANTED
        to: ACTIVE
        trigger: "POST /brand-ops/confidentiality-grants/{id}/activate"
        actor: TradeSecretOfficer
        preconditions:
          - "manufacturer.status == QUALIFIED (ERR_MANUFACTURER_NOT_QUALIFIED)"
          - "expires_on is strictly after current logical time (ERR_GRANT_EXPIRED)"
        side_effects:
          - "recompute manufacturer.disclosed_component_count"
          - "re-evaluate formulation component coverage; if complete, Formulation SEALED -> COMPARTMENTALIZED"
      - from: REQUESTED
        to: REVOKED
        trigger: "POST /brand-ops/confidentiality-grants/{id}/revoke"
        actor: ComplianceAuditor
        preconditions:
          - "if for_cause == true and granted_by_user_id is set, caller X-User-ID != granted_by_user_id (ERR_AUDITOR_CONFLICT)"
        side_effects:
          - "revoked_at := now; revoked_for_cause := for_cause"
          - "if for_cause: posture recompute; no manufacturer cascade from REQUESTED"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /brand-ops/confidentiality-grants/{id}/revoke"
        actor: ComplianceAuditor
        preconditions:
          - "if for_cause == true and granted_by_user_id is set, caller X-User-ID != granted_by_user_id (ERR_AUDITOR_CONFLICT)"
        side_effects:
          - "revoked_at := now; revoked_for_cause := for_cause"
          - "recompute manufacturer.disclosed_component_count"
          - "if for_cause and manufacturer.status == QUALIFIED: manufacturer -> SUSPENDED (cascade link 1) with its own follow-on cascades"
          - "recompute protection_posture on the owning Brand"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /brand-ops/confidentiality-grants/{id}/revoke"
        actor: ComplianceAuditor
        preconditions:
          - "if for_cause == true and granted_by_user_id is set, caller X-User-ID != granted_by_user_id (ERR_AUDITOR_CONFLICT)"
        side_effects:
          - "revoked_at := now; revoked_for_cause := for_cause"
          - "recompute manufacturer.disclosed_component_count"
          - "re-evaluate formulation component coverage; if broken, Formulation COMPARTMENTALIZED -> SEALED"
          - "if for_cause and manufacturer.status == QUALIFIED: manufacturer -> SUSPENDED (cascade link 1) with its own follow-on cascades"
          - "recompute protection_posture on the owning Brand"
      - from: GRANTED
        to: EXPIRED
        trigger: "system (clock sweep: current logical time reaches expires_on)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute manufacturer.disclosed_component_count"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: current logical time reaches expires_on)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute manufacturer.disclosed_component_count"
          - "re-evaluate formulation component coverage; if broken, Formulation COMPARTMENTALIZED -> SEALED"

  - entity: Distributor
    initial_state: APPLICANT
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICANT
        to: APPROVED
        trigger: "POST /brand-ops/distributors/{id}/approve"
        actor: ChannelManager
        preconditions:
          - "home market status == OPEN (ERR_MARKET_NOT_OPEN)"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /brand-ops/distributors/{id}/suspend OR system (attainment recomputation flips quota_compliance_tier to SANCTION)"
        actor: ChannelManager | system
        preconditions:
          - "the suspension does not raise suspension_count to 3 (that path goes straight to TERMINATED)"
        side_effects:
          - "suspension_count += 1"
          - "every CoverageAssignment of this distributor with status == ACTIVE -> SUSPENDED (cascade link 2)"
      - from: APPROVED
        to: TERMINATED
        trigger: "system or ChannelManager: any suspension that would make suspension_count == 3"
        actor: ChannelManager | system
        preconditions: []
        side_effects:
          - "suspension_count := 3"
          - "CoverageAssignments: PROPOSED -> WITHDRAWN; ACTIVE or SUSPENDED -> TERMINATED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /brand-ops/distributors/{id}/terminate"
        actor: ChannelManager
        preconditions: []
        side_effects:
          - "CoverageAssignments: PROPOSED -> WITHDRAWN; ACTIVE or SUSPENDED -> TERMINATED"
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /brand-ops/distributors/{id}/terminate"
        actor: ChannelManager
        preconditions: []
        side_effects:
          - "CoverageAssignments: PROPOSED -> WITHDRAWN; ACTIVE or SUSPENDED -> TERMINATED"
      - from: APPLICANT
        to: TERMINATED
        trigger: "POST /brand-ops/distributors/{id}/terminate"
        actor: ChannelManager
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /brand-ops/distributors/{id}/reinstate"
        actor: ChannelManager
        preconditions: []
        side_effects: []
        note: "Reinstatement does NOT resume coverage assignments; each SUSPENDED assignment must be resumed individually."

  - entity: Market
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /brand-ops/markets/{id}/close"
        actor: RegulatoryAffairs
        preconditions:
          - "no CoverageAssignment with this market_id and status IN {PROPOSED, ACTIVE, SUSPENDED} (ERR_MARKET_IN_USE)"
          - "no MarketRegistration with this market_id and status IN {DRAFT, SUBMITTED, ACTIVE, RENEWAL_DUE} (ERR_MARKET_IN_USE)"
        side_effects: []

  - entity: MarketRegistration
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /brand-ops/market-registrations/{id}/submit"
        actor: RegulatoryAffairs
        preconditions:
          - "owning brand.status == OPERATING (ERR_BRAND_IN_LOCKDOWN)"
          - "owning brand.protection_posture != CRITICAL (ERR_POSTURE_CRITICAL)"
        side_effects:
          - "submitted_at := current logical time"
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /brand-ops/market-registrations/{id}/approve"
        actor: RegulatoryAffairs
        preconditions:
          - "expires_on is strictly after current logical time (ERR_WINDOW_INVALID)"
        side_effects:
          - "registration_number := request registration_number"
          - "approved_at := current logical time"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /brand-ops/market-registrations/{id}/reject"
        actor: RegulatoryAffairs
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /brand-ops/market-registrations/{id}/revise"
        actor: RegulatoryAffairs
        preconditions: []
        side_effects:
          - "revise_count += 1"
      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "system (clock sweep: current time reaches expires_on minus 90 days, inclusive)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RENEWAL_DUE
        to: ACTIVE
        trigger: "POST /brand-ops/market-registrations/{id}/renew"
        actor: RegulatoryAffairs
        preconditions:
          - "new_expires_on strictly greater than current expires_on (ERR_WINDOW_INVALID)"
        side_effects:
          - "expires_on := new_expires_on"
      - from: RENEWAL_DUE
        to: EXPIRED
        trigger: "system (clock sweep: current time reaches expires_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep jumps directly past expires_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /brand-ops/market-registrations/{id}/revoke"
        actor: RegulatoryAffairs
        preconditions: []
        side_effects:
          - "every CoverageAssignment with this market_id and product_line_id and status == ACTIVE -> SUSPENDED (cascade)"
      - from: RENEWAL_DUE
        to: REVOKED
        trigger: "POST /brand-ops/market-registrations/{id}/revoke"
        actor: RegulatoryAffairs
        preconditions: []
        side_effects:
          - "every CoverageAssignment with this market_id and product_line_id and status == ACTIVE -> SUSPENDED (cascade)"

  - entity: CoverageAssignment
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED, WITHDRAWN, CLOSED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /brand-ops/coverage-assignments/{id}/activate"
        actor: ChannelManager
        preconditions:
          - "distributor.status == APPROVED (ERR_DISTRIBUTOR_NOT_APPROVED)"
          - "starts_on <= current date <= ends_on (ERR_WINDOW_INVALID)"
          - "product_line.status == LAUNCHED (ERR_LINE_NOT_LAUNCHED)"
          - "if market.registration_required: a MarketRegistration for (market_id, product_line_id) has status == ACTIVE (ERR_REGISTRATION_NOT_ACTIVE)"
          - "if exclusive == true: brand.protection_posture != CRITICAL and brand.status == OPERATING (ERR_POSTURE_CRITICAL)"
          - "if exclusive == true: no other assignment on the same (market_id, channel, product_line_id) with exclusive == true, status IN {ACTIVE, SUSPENDED}, and closed-interval overlap (ERR_EXCLUSIVE_OVERLAP)"
          - "fewer than 3 assignments on the same cell with status IN {ACTIVE, SUSPENDED} (ERR_CELL_CAPACITY_EXCEEDED)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /brand-ops/coverage-assignments/{id}/suspend OR system (distributor suspension or registration revocation cascade)"
        actor: ChannelManager | system
        preconditions: []
        side_effects:
          - "distributor attainment is recomputed (quota basis unchanged: SUSPENDED still counts)"
        note: "SUSPENDED assignments still reserve their cell for exclusivity and capacity checks."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /brand-ops/coverage-assignments/{id}/resume"
        actor: ChannelManager
        preconditions:
          - "distributor.status == APPROVED (ERR_DISTRIBUTOR_NOT_APPROVED)"
          - "starts_on <= current date <= ends_on (ERR_WINDOW_INVALID)"
          - "if market.registration_required: a MarketRegistration for (market_id, product_line_id) has status == ACTIVE (ERR_REGISTRATION_NOT_ACTIVE)"
          - "exclusive overlap and cell capacity re-checked exactly as in activate (ERR_EXCLUSIVE_OVERLAP, ERR_CELL_CAPACITY_EXCEEDED)"
        side_effects: []
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /brand-ops/coverage-assignments/{id}/withdraw"
        actor: ChannelManager
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (a new CoverageAssignment is created on the same (market_id, channel, product_line_id) cell)"
        actor: system
        preconditions: []
        side_effects:
          - "the new assignment records supersedes_assignment_id := the superseded PROPOSED assignment with the greatest created_at"
      - from: ACTIVE
        to: CLOSED
        trigger: "system (clock sweep: current date passes ends_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "system (clock sweep: current date passes ends_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (distributor termination cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system (distributor termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PackFormat
    initial_state: DESIGNED
    terminal_states: [RETIRED]
    transitions:
      - from: DESIGNED
        to: TOOLED
        trigger: "POST /brand-ops/pack-formats/{id}/tool"
        actor: SupplyPlanner
        preconditions:
          - "owning product_line.status IN {PILOT, LAUNCHED} (ERR_LINE_STAGE_TOO_EARLY)"
        side_effects: []
      - from: TOOLED
        to: IN_PRODUCTION
        trigger: "POST /brand-ops/pack-formats/{id}/enter-production"
        actor: SupplyPlanner
        preconditions:
          - "at least one Formulation of the owning line has status == COMPARTMENTALIZED (ERR_FORMULATION_NOT_COMPARTMENTALIZED)"
          - "at least one ChannelPriceList of this pack has status IN {SCHEDULED, EFFECTIVE} (ERR_NO_PRICE_LIST)"
        side_effects: []
      - from: IN_PRODUCTION
        to: RETIRED
        trigger: "POST /brand-ops/pack-formats/{id}/retire"
        actor: SupplyPlanner
        preconditions:
          - "every ChannelPriceList of this pack has status IN {SUPERSEDED, EXPIRED} (ERR_PRICE_LISTS_OUTSTANDING)"
        side_effects: []

  - entity: ChannelPriceList
    initial_state: SCHEDULED
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: EFFECTIVE
        trigger: "system (clock sweep: current time reaches effective_from while before effective_to)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (clock sweep jumps directly past effective_to)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EFFECTIVE
        to: EXPIRED
        trigger: "system (clock sweep: current time reaches effective_to)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system (a new ChannelPriceList for the same (pack_format_id, channel) is created whose half-open window overlaps this one)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (a new overlapping ChannelPriceList is created with effective_from <= this list's effective_from)"
        actor: system
        preconditions: []
        side_effects: []
        note: "If instead the new list starts strictly inside this list's window, this EFFECTIVE list is CLIPPED: its effective_to is set to the new list's effective_from and it stays EFFECTIVE until then."
    note: "Creation stamps the initial status by the current logical time: EFFECTIVE when effective_from <= now < effective_to, else SCHEDULED; a window entirely in the past is rejected (ERR_WINDOW_INVALID)."

  - entity: Promotion
    initial_state: DRAFT
    terminal_states: [ENDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /brand-ops/promotions/{id}/submit"
        actor: PricingAnalyst
        preconditions: []
        side_effects: []
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /brand-ops/promotions/{id}/approve"
        actor: MarketingManager
        preconditions:
          - "caller X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "discount_pct <= posture depth cap: 25.00 when brand posture NORMAL, 15.00 ELEVATED, 5.00 CRITICAL (ERR_PROMO_DEPTH_EXCEEDS_CAP)"
          - "at least one PackFormat of the line has a non-SUPERSEDED ChannelPriceList for this channel whose window covers starts_on (ERR_NO_PRICE_LIST)"
          - "for every such pack and covering list: list_price_cents - round_half_up(list_price_cents * discount_pct / 100) >= map_price_cents (ERR_BELOW_MAP_PRICE)"
          - "fewer than 2 other promotions of the same (product_line_id, channel) with status IN {APPROVED, LIVE, SUSPENDED, ENDED} and starts_on within +/- 90 days of this starts_on (ERR_PROMO_TOO_FREQUENT)"
          - "no other promotion of the same (product_line_id, channel) with status IN {APPROVED, LIVE, SUSPENDED, ENDED} and |starts_on difference| < 14 days (ERR_PROMO_GAP_VIOLATION)"
        side_effects:
          - "approved_by_user_id := caller X-User-ID"
          - "unit_funding_provisional_cents := PROVISIONAL variant of promo_funding (see calculations)"
          - "if starts_on <= current date <= ends_on: enter LIVE immediately instead of APPROVED"
      - from: APPROVED
        to: LIVE
        trigger: "system (clock sweep: current date reaches starts_on while not past ends_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ENDED
        trigger: "system (clock sweep: current date passes ends_on before starts_on was ever reached in-window)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LIVE
        to: SUSPENDED
        trigger: "system (cascade: brand protection_posture becomes CRITICAL)"
        actor: system
        preconditions: []
        side_effects:
          - "accrued_funding_cents and funding_budget_cents are left untouched"
      - from: SUSPENDED
        to: LIVE
        trigger: "POST /brand-ops/promotions/{id}/resume"
        actor: MarketingManager
        preconditions:
          - "brand.protection_posture != CRITICAL (ERR_POSTURE_CRITICAL)"
          - "brand.status == OPERATING (ERR_BRAND_IN_LOCKDOWN)"
          - "current date <= ends_on (ERR_PROMO_WINDOW_CLOSED)"
        side_effects: []
      - from: LIVE
        to: ENDED
        trigger: "system (clock sweep: current date passes ends_on)"
        actor: system
        preconditions: []
        side_effects: []
    note: "The clock sweep never ends a SUSPENDED promotion; a SUSPENDED promotion past its ends_on can only leave via resume-then-expire or stays SUSPENDED."

  - entity: CounterfeitCase
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: ACTION_TAKEN
        trigger: "POST /brand-ops/counterfeit-cases/{id}/take-action"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "units_seized := request units_seized"
          - "recompute brand protection_posture"
          - "if protection_posture became CRITICAL: every Promotion of the brand with status LIVE -> SUSPENDED (cascade)"
      - from: REPORTED
        to: CLOSED
        trigger: "POST /brand-ops/counterfeit-cases/{id}/close"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "recompute brand protection_posture (SUSPENDED promotions are NOT auto-resumed)"
      - from: ACTION_TAKEN
        to: CLOSED
        trigger: "POST /brand-ops/counterfeit-cases/{id}/close"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "recompute brand protection_posture (SUSPENDED promotions are NOT auto-resumed)"
    note: "Creating a case also recomputes protection_posture; a severity-5 REPORTED case already makes the posture CRITICAL and fires the promotion cascade at creation."

  - entity: UseCaseSubmission
    initial_state: SUBMITTED
    terminal_states: [REJECTED, RETRACTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /brand-ops/use-cases/{id}/review with decision=VERIFY"
        actor: MarketingManager
        preconditions: []
        side_effects:
          - "generic_use_flag := request generic_use_flag"
          - "recompute brand genericization_risk_bps"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /brand-ops/use-cases/{id}/review with decision=REJECT"
        actor: MarketingManager
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: PUBLISHED
        trigger: "POST /brand-ops/use-cases/{id}/publish"
        actor: MarketingManager
        preconditions:
          - "if generic_use_flag == true: brand.genericization_risk_bps < 500 before this publish (ERR_GENERICIZATION_RISK)"
        side_effects:
          - "recompute brand genericization_risk_bps"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /brand-ops/use-cases/{id}/retract"
        actor: MarketingManager
        preconditions: []
        side_effects:
          - "recompute brand genericization_risk_bps"

# =============================================================================
# §1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: coverage-assignment-create-stale-distributor
    parent_entity: Distributor
    write_endpoint: "POST /brand-ops/distributors/{distributorId}/coverage-assignments"
    occ_field: expected_distributor_version
    description: |
      Creating a CoverageAssignment against a Distributor whose version has
      advanced since the caller last observed it is rejected. This captures the
      case where another writer has just created an assignment for the same
      distributor (legitimately superseding a PROPOSED proposal on the same
      cell per the CoverageAssignment state machine) and the current writer's
      view of the distributor is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: price-list-create-stale-pack-format
    parent_entity: PackFormat
    write_endpoint: "POST /brand-ops/pack-formats/{packFormatId}/price-lists"
    occ_field: expected_pack_format_version
    description: |
      Creating a ChannelPriceList against a PackFormat whose version has
      advanced since the caller last observed it is rejected. This captures the
      case where another writer has just created a price list for the same
      pack (legitimately superseding or clipping the caller's expected lists
      per the ChannelPriceList state machine) and the current writer's view of
      the pack format is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: brand_protection_posture
    trigger: "CounterfeitCase create / take-action / close; ConfidentialityGrant for-cause revoke (including cascade revocations); clock sweep"
    algorithm: threshold
    formula: |
      open_cases = CounterfeitCase of the brand with status IN {REPORTED, ACTION_TAKEN}
      severity_sum = sum(severity over open_cases)
      breach_count = count of ConfidentialityGrant with revoked_for_cause == true
                     and revoked_at >= now - 180 days, over formulations of the brand's lines
      if breach_count >= 2 OR any open case has severity == 5 OR severity_sum >= 10: CRITICAL
      elif breach_count == 1 OR severity_sum >= 6: ELEVATED
      else: NORMAL
    input_set: "CounterfeitCase rows of the brand in non-terminal states; ConfidentialityGrant rows joined through Formulation -> ProductLine of the brand"
    constants:
      CRITICAL_SEVERITY_SUM: 10
      ELEVATED_SEVERITY_SUM: 6
      CRITICAL_SINGLE_SEVERITY: 5
      BREACH_WINDOW_DAYS: 180
      CRITICAL_BREACH_COUNT: 2
    precision: "integer thresholds, no rounding"
    variants: []

  - name: genericization_risk
    trigger: "UseCaseSubmission review VERIFY with generic_use_flag, publish, retract"
    algorithm: aggregation
    formula: |
      pub = count of UseCaseSubmission on lines of the brand with status == PUBLISHED and generic_use_flag == true
      ver = count of UseCaseSubmission on lines of the brand with status == VERIFIED and generic_use_flag == true
      genericization_risk_bps = min(10000, 100 * pub + 50 * ver)
      Publish gate: a flagged submission may publish only while genericization_risk_bps < 500
    input_set: "UseCaseSubmission rows joined through ProductLine to the brand; REJECTED and RETRACTED contribute 0"
    constants:
      PUBLISHED_FLAGGED_BPS: 100
      VERIFIED_FLAGGED_BPS: 50
      RISK_CAP_BPS: 10000
      PUBLISH_GATE_BPS: 500
    precision: "integer basis points"
    variants: []

  - name: line_dilution_cost
    trigger: "read of ProductLine.dilution_cost_bps (live preview before PILOT); frozen at PILOT entry (brand-review APPROVE)"
    algorithm: weighted_scoring
    formula: |
      if is_core: cost = 0
      else:
        cost = 400
             + 150 * (len(target_channels) - 1)
             + (200 if novelty else 0)
        novelty = true when at least one PackFormat of this line (any status except RETIRED)
                  has a delivery_system not used by any PackFormat (any status except RETIRED)
                  of any OTHER line of the same brand with status == LAUNCHED
        cost = min(cost, 1000)
    input_set: "PackFormat rows of this line and of the brand's other LAUNCHED lines; evaluation order is pinned: the baseline is the set of OTHER lines already LAUNCHED at the moment this line's launch is evaluated; the candidate line itself is never part of its own baseline"
    constants:
      BASE_COST_BPS: 400
      PER_EXTRA_CHANNEL_BPS: 150
      NOVEL_DELIVERY_BPS: 200
      COST_CAP_BPS: 1000
    precision: "integer basis points"
    variants: []

  - name: brand_equity_consumption
    trigger: "line launch, line discontinue; read of Brand derived fields"
    algorithm: aggregation
    formula: |
      dilution_consumed_bps = sum(frozen dilution_cost_bps over lines with status IN {PILOT, LAUNCHED})
                            + sum(floor(frozen dilution_cost_bps / 2) over lines with status == DISCONTINUED
                                  that reached PILOT before discontinuation; lines discontinued from
                                  FORMULATION never froze a cost and contribute 0)
      core_identity_share_bps = max(0, 10000 - dilution_consumed_bps)
      Fiscal gates fire at brand-review APPROVE (the freeze moment), in this order:
        1. dilution_consumed_bps + candidate_cost <= brand.equity_budget_bps (ERR_EQUITY_BUDGET_EXCEEDED)
        2. core_identity_share_bps - candidate_cost >= 7000 (ERR_CORE_IDENTITY_DILUTION)
    input_set: "ProductLine rows of the brand"
    constants:
      DISCONTINUED_REFUND_DIVISOR: 2
      MIN_CORE_IDENTITY_SHARE_BPS: 7000
    precision: "integer basis points; floor on the discontinued refund"
    variants: []

  - name: coverage_attainment
    trigger: "SellThroughReport creation for any assignment of the distributor"
    algorithm: aggregation
    formula: |
      window = the 3 calendar months strictly before the current logical month (by period_month)
      assignments_in_scope = CoverageAssignment of the distributor with status IN {ACTIVE, SUSPENDED}
      if assignments_in_scope is empty: attainment fields and tier are left unchanged
      total_net = sum(net_units over reports of in-scope assignments whose period_month is in window)
      quota_3m = sum(floor(annual_quota_units / 4) over in-scope assignments)
      attainment_actual_bps = 0 if quota_3m == 0 else round_half_up(10000 * total_net / quota_3m)
      month_net(m) = sum(net_units over in-scope reports with period_month == m), missing month = 0
      best_month_net = max(month_net(m) for m in window)
      quota_annual = sum(annual_quota_units over in-scope assignments)
      attainment_projected_bps = 0 if quota_annual == 0 else round_half_up(10000 * best_month_net * 12 / quota_annual)
      quota_compliance_tier = GOLD if actual >= 12000; STANDARD if >= 10000; WATCH if >= 9000; else SANCTION
      if tier becomes SANCTION and distributor.status == APPROVED: fire the SUSPENDED/TERMINATED cascade
    input_set: "SellThroughReport rows of the distributor's in-scope assignments; reports outside the 3-month window contribute nothing"
    constants:
      WINDOW_MONTHS: 3
      TIER_GOLD_BPS: 12000
      TIER_STANDARD_BPS: 10000
      TIER_WATCH_BPS: 9000
    precision: "integer basis points, round_half_up; floor per assignment on the 3-month quota before summing"
    variants:
      - name: ACTUAL
        when: "quota_compliance_tier and attainment_actual_bps"
        difference: "conservative: sums all reported net units in the window against the prorated 3-month quota"
      - name: PROJECTED
        when: "attainment_projected_bps and rebate-preview"
        difference: "optimistic: annualizes only the single best month (best_month_net * 12) against the full annual quota"

  - name: distributor_rebate
    trigger: "GET /brand-ops/distributors/{id}/rebate-preview"
    algorithm: tiered_pricing
    formula: |
      tier = distributor.quota_compliance_tier (null -> rebate_bps 0)
      base = {GOLD: 300, STANDARD: 200, WATCH: 100, SANCTION: 0}[tier]
      bonus = 25 if MASS IN distributor.channels_served else 0
      rebate_bps = min(base + bonus, 350)
      rebate_estimate_cents = round_half_up(window_total_net_units * reference_unit_price_cents * rebate_bps / 10000)
      where window_total_net_units is the same trailing-3-month total_net used by coverage_attainment
    input_set: "the distributor, its channels_served, its current attainment fields, and the request's reference_unit_price_cents"
    constants:
      REBATE_GOLD_BPS: 300
      REBATE_STANDARD_BPS: 200
      REBATE_WATCH_BPS: 100
      REBATE_MASS_CHANNEL_BONUS_BPS: 25
      REBATE_CAP_BPS: 350
    precision: "rebate_bps integer; rebate_estimate_cents round_half_up to whole cents"
    variants: []

  - name: promo_funding
    trigger: "promotion approve (PROVISIONAL); promotion redemption (ACTUAL)"
    algorithm: forward_looking
    formula: |
      ACTUAL (at redemption): unit_funding_cents = round_half_up(list_price_cents * discount_pct / 100)
        where list_price_cents comes from the price list EFFECTIVE at redemption time
        for the redeemed (pack_format_id, promotion.channel) per price_resolution.
      PROVISIONAL (at approve): select the reference pack as the PackFormat of the line having a
        non-SUPERSEDED ChannelPriceList for promotion.channel whose window covers starts_on;
        rank candidates by size_ml ascending, tie-break by created_at ascending;
        unit_funding_provisional_cents = round_half_up(that list's list_price_cents * discount_pct / 100).
    input_set: "ChannelPriceList rows of the line's packs for the promotion channel; Promotion fields"
    constants: {}
    precision: "whole cents, round_half_up per unit before any multiplication"
    variants:
      - name: PROVISIONAL
        when: "at approve; stored as unit_funding_provisional_cents"
        difference: "prices funding from the list covering starts_on for the smallest qualifying pack; never updated afterwards"
      - name: ACTUAL
        when: "at each redemption"
        difference: "prices funding from the list EFFECTIVE at redemption time for the actually redeemed pack; diverges from PROVISIONAL when the price list changed between starts_on and redemption"

  - name: promo_case_price
    trigger: "promotion redemption response"
    algorithm: tiered_pricing
    formula: |
      unit_funding_cents = round_half_up(list_price_cents * discount_pct / 100)
      promo_unit_price_cents = list_price_cents - unit_funding_cents
      promo_case_price_cents = promo_unit_price_cents * case_pack_qty
      Rounding order is pinned: round ONCE at unit level, then multiply by case_pack_qty.
      (The alternative order — discounting the case gross and rounding at case level — yields
      different cents and is non-conformant: list 499, 15.00%, case 12 -> 5088, not 5090.)
    input_set: "the EFFECTIVE price list, the promotion, the redeemed pack's case_pack_qty"
    constants: {}
    precision: "whole cents, round_half_up at unit level only"
    variants: []

  - name: component_coverage
    trigger: "grant grant-action, activate, revoke, expiry sweep"
    algorithm: constraint_propagation
    formula: |
      compartment check (at grant action, per manufacturer per formulation):
        U = union of component_scope over this manufacturer's grants on this formulation
            with status IN {GRANTED, ACTIVE}, plus the candidate scope
        require |U| * 2 <= |formulation.component_codes|
      coverage check (after any grant leaves ACTIVE):
        formulation is COMPARTMENTALIZED iff every component_code is covered by >= 1 grant
        of that formulation with status == ACTIVE; otherwise SEALED
      manufacturer.disclosed_component_count = count of distinct (formulation_id, component_code)
        pairs covered by that manufacturer's grants with status IN {GRANTED, ACTIVE}
    input_set: "ConfidentialityGrant rows grouped by (manufacturer_id, formulation_id)"
    constants:
      MAX_SCOPE_FRACTION_NUMERATOR: 1
      MAX_SCOPE_FRACTION_DENOMINATOR: 2
    precision: "set cardinality, integer comparison"
    variants: []

  - name: registration_renewal_window
    trigger: "clock sweep; renew action"
    algorithm: threshold
    formula: |
      RENEWAL_DUE opens when now >= expires_on - 90 days (inclusive boundary)
      EXPIRED fires when now >= expires_on
      renew is accepted only from status RENEWAL_DUE:
        from ACTIVE (window not yet open) -> ERR_RENEWAL_WINDOW_NOT_OPEN
        from EXPIRED -> ERR_REGISTRATION_EXPIRED
    input_set: "MarketRegistration rows with status IN {ACTIVE, RENEWAL_DUE}"
    constants:
      RENEWAL_WINDOW_DAYS: 90
    precision: "second precision on datetimes; the boundary instant itself opens the window"
    variants: []

  - name: promo_frequency_gate
    trigger: "promotion approve"
    algorithm: chronological
    formula: |
      peers = promotions of the same (product_line_id, channel) with
              status IN {APPROVED, LIVE, SUSPENDED, ENDED}, excluding the candidate
      frequency: peers with starts_on within [candidate.starts_on - 90 days,
                 candidate.starts_on + 90 days] must number fewer than 2 (ERR_PROMO_TOO_FREQUENT)
      gap: every peer must satisfy |peer.starts_on - candidate.starts_on| >= 14 days
           (ERR_PROMO_GAP_VIOLATION); the frequency check runs before the gap check
    input_set: "Promotion rows of the same line and channel in terminal-or-live statuses"
    constants:
      MAX_PEERS_IN_WINDOW: 2
      WINDOW_DAYS: 90
      MIN_GAP_DAYS: 14
    precision: "whole days on YYYY-MM-DD dates"
    variants: []

  - name: price_resolution
    trigger: "effective-price endpoint; promo_funding ACTUAL variant"
    algorithm: forward_looking
    formula: |
      candidates = ChannelPriceList rows for (pack_format_id, channel) with status != SUPERSEDED
                   and effective_from <= at < effective_to
      if candidates empty: ERR_NO_EFFECTIVE_PRICE (404)
      else pick the candidate with the greatest effective_from; tie-break by created_at ascending
      (a later effective_from always wins; for equal effective_from the earlier-created wins)
    input_set: "ChannelPriceList rows of the pack and channel"
    constants: {}
    precision: "second precision on datetimes"
    variants: []

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty; X-User-Role must be a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "the caller's role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "every id in the path must exist, resolved left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "request body shape: required fields present; enum, integer, date and datetime values well-formed and in range (severity 1..5, discount_pct 0 < p <= 90.00, component_codes 1..12 entries, arrays non-empty where constrained); fields that are undeclared, computed or system-sourced and appear in a request body are ignored, never stored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: existence
    check: "ids referenced inside the request body must exist (formulation_id, market_id, product_line_id, pack_format_id, coverage_assignment_id, master_formulation_id)"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "create/action endpoints with body references"
  - priority: 6
    category: auth
    check: "ownership and caller-identity preconditions: DistributorContact X-User-ID must equal the path distributor id; Consumer submitter_ref must equal X-User-ID"
    error_id: "ERR_NOT_RESOURCE_OWNER | ERR_SUBMITTER_MISMATCH"
    http_status: 403
    applies_to: "sell-through report creation; use-case creation"
  - priority: 7
    category: state
    check: "optimistic concurrency: expected_distributor_version / expected_pack_format_version must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /brand-ops/distributors/{distributorId}/coverage-assignments; POST /brand-ops/pack-formats/{packFormatId}/price-lists"
  - priority: 8
    category: state
    check: "the target resource's own state machine must admit the requested transition; wrong-from-state on renew yields ERR_RENEWAL_WINDOW_NOT_OPEN from ACTIVE and ERR_REGISTRATION_EXPIRED from EXPIRED"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_RENEWAL_WINDOW_NOT_OPEN | ERR_REGISTRATION_EXPIRED | ERR_DISTRIBUTOR_NOT_APPROVED | ERR_PROMO_WINDOW_CLOSED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: business_safety
    check: "brand-protection and trade-secret gates: brand lockdown, CRITICAL posture, manufacturer qualification for grants, compartmentalization scope cap, segregation-of-duties (promotion approver vs creator; for-cause revoker vs grantor), VOC regime, genericization publish gate, recent-breach requalification block"
    error_id: "ERR_BRAND_IN_LOCKDOWN | ERR_POSTURE_CRITICAL | ERR_MANUFACTURER_NOT_QUALIFIED | ERR_COMPARTMENT_SCOPE_EXCEEDED | ERR_SEGREGATION_OF_DUTIES | ERR_AUDITOR_CONFLICT | ERR_VOC_REGIME_MISMATCH | ERR_GENERICIZATION_RISK | ERR_RECENT_BREACH"
    http_status: "409 or 422 as listed in the error catalog"
    applies_to: "launch, registration submit, assignment activate, grant create/grant/activate/revoke, promotion approve/resume, use-case publish, manufacturer qualify, registration create"
  - priority: 10
    category: business_temporal
    check: "window arithmetic: starts before ends, expiry in the future at create, activation inside the coverage window, grant not expired at grant/activate, exclusive closed-interval overlap, report period completed, clock strictly advancing"
    error_id: "ERR_WINDOW_INVALID | ERR_EXCLUSIVE_OVERLAP | ERR_PERIOD_NOT_COMPLETED | ERR_CLOCK_REGRESSION | ERR_GRANT_EXPIRED"
    http_status: "409 or 422 as listed in the error catalog"
    applies_to: "assignment create/activate/resume, grant create/grant/activate, price-list create, promotion create, report create, clock set"
  - priority: 11
    category: business_referential
    check: "referenced entities must be in a compatible state: formulation SEALED/COMPARTMENTALIZED for grants and registrations, formulation COMPARTMENTALIZED for enter-production, registration ACTIVE for coverage activation, price list present for enter-production and promotion approve, pack format IN_PRODUCTION for launch, line LAUNCHED for use-case creation, market OPEN for distributor approve and registration create"
    error_id: "ERR_FORMULATION_NOT_SEALED | ERR_FORMULATION_NOT_COMPARTMENTALIZED | ERR_FORMULATION_LINE_MISMATCH | ERR_PACK_LINE_MISMATCH | ERR_REGISTRATION_NOT_ACTIVE | ERR_NO_PRICE_LIST | ERR_NO_PRODUCIBLE_PACK_FORMAT | ERR_NO_EFFECTIVE_PRICE | ERR_LINE_STAGE_TOO_EARLY | ERR_LINE_NOT_LAUNCHED | ERR_MARKET_NOT_OPEN | ERR_PRICE_LISTS_OUTSTANDING | ERR_MARKET_IN_USE"
    http_status: "404 or 409 as listed in the error catalog"
    applies_to: "grant create, registration create, coverage activate/resume, enter-production, retire, launch, promotion approve, redemption, use-case create, distributor approve, market close"
  - priority: 12
    category: business_constraint
    check: "uniqueness, subset and capacity constraints: line_code unique per brand among non-DISCONTINUED lines, single core line, country_code unique, channel membership checks, component scope subset, minimum components at seal, cell capacity 3, one report per assignment per month, one non-terminal registration per (market, line), map <= list"
    error_id: "ERR_DUPLICATE_LINE_CODE | ERR_CORE_LINE_EXISTS | ERR_CORE_LINE_IMMUTABLE | ERR_MARKET_CODE_EXISTS | ERR_CHANNEL_NOT_SERVED | ERR_CHANNEL_NOT_ALLOWED | ERR_CHANNEL_OUTSIDE_LINE_SCOPE | ERR_CELL_CAPACITY_EXCEEDED | ERR_DUPLICATE_REPORT | ERR_REGISTRATION_EXISTS | ERR_SCOPE_NOT_SUBSET | ERR_INSUFFICIENT_COMPONENTS | ERR_COMPONENT_LIMIT_EXCEEDED | ERR_MAP_ABOVE_LIST"
    http_status: "409 or 422 as listed in the error catalog"
    applies_to: "create endpoints, seal, assignment activate, report create, price-list create, discontinue"
  - priority: 13
    category: business_fiscal
    check: "fiscal gates, evaluated last: equity budget, core identity floor, promotion depth cap, price-list presence and MAP floor at approve, promotion frequency then gap, redemption budget"
    error_id: "ERR_EQUITY_BUDGET_EXCEEDED | ERR_CORE_IDENTITY_DILUTION | ERR_PROMO_DEPTH_EXCEEDS_CAP | ERR_BELOW_MAP_PRICE | ERR_PROMO_TOO_FREQUENT | ERR_PROMO_GAP_VIOLATION | ERR_PROMO_BUDGET_EXCEEDED"
    http_status: "409 or 422 as listed in the error catalog"
    applies_to: "product-line brand-review approve, promotion approve, redemption"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Platform (outside api_prefix; logical clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO 8601 UTC). The startup default before any call is exactly 2026-09-01T00:00:00Z; the server never falls back to wall-clock time. The new time must be strictly after the current logical time (ERR_CLOCK_REGRESSION). Setting the clock runs the time sweep: registrations flip ACTIVE->RENEWAL_DUE->EXPIRED, grants GRANTED/ACTIVE->EXPIRED, price lists SCHEDULED->EFFECTIVE->EXPIRED, promotions APPROVED->LIVE and APPROVED/LIVE->ENDED, assignments ACTIVE/SUSPENDED->CLOSED; brand protection_posture is recomputed."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["time sweep transitions per state machines", "posture recompute"]

  # --- Brand ---
  - method: POST
    path: "/brand-ops/brands"
    description: "Create a brand (status OPERATING, posture NORMAL, dilution 0, identity share 10000, genericization risk 0)"
    roles: [BrandManager]
    code: 201
    input: [name, legal_entity_name, "equity_budget_bps?"]
    output: Brand
    side_effects: []
  - method: GET
    path: "/brand-ops/brands/{id}"
    description: "Get a brand including computed posture, dilution, identity share and genericization risk"
    roles: &all_roles [PlatformAdmin, BrandManager, TradeSecretOfficer, ComplianceAuditor, ChannelManager, PricingAnalyst, MarketingManager, RegulatoryAffairs, SupplyPlanner, DistributorContact, Consumer]
    code: 200
    input: []
    output: Brand
    side_effects: []
  - method: POST
    path: "/brand-ops/brands/{id}/lockdown"
    description: "Enter PROTECTIVE_LOCKDOWN"
    roles: [ComplianceAuditor]
    code: 200
    input: [reason]
    output: Brand
    side_effects: ["lockdown_reason := reason"]
  - method: POST
    path: "/brand-ops/brands/{id}/lift-lockdown"
    description: "Return to OPERATING; blocked while severity-5 cases are open or recent for-cause revocations exist"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: Brand
    side_effects: ["lockdown_reason := null"]

  # --- ProductLine ---
  - method: POST
    path: "/brand-ops/brands/{brandId}/product-lines"
    description: "Create a product line (initial status FORMULATION)"
    roles: [BrandManager]
    code: 201
    input: [line_code, name, "is_core?", target_channels]
    output: ProductLine
    side_effects: []
  - method: GET
    path: "/brand-ops/product-lines/{id}"
    description: "Get a product line"
    roles: *all_roles
    code: 200
    input: []
    output: ProductLine
    side_effects: []
  - method: GET
    path: "/brand-ops/product-lines"
    description: "List product lines, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["brand_id?", "status?", "limit?", "offset?"]
    output: ProductLine[]
    side_effects: []
  - method: POST
    path: "/brand-ops/product-lines/{id}/brand-review"
    description: "Brand review decision from FORMULATION: APPROVE -> PILOT (requires a SEALED or COMPARTMENTALIZED formulation and passes the equity-budget and identity-floor gates, freezing the dilution cost); REJECT loops back to FORMULATION and the third rejection auto-discontinues"
    roles: [BrandManager]
    code: 200
    input: [decision]
    output: ProductLine
    side_effects: ["brand_review_attempts bookkeeping", "possible auto-DISCONTINUED", "dilution recompute on auto-discontinue"]
  - method: POST
    path: "/brand-ops/product-lines/{id}/launch"
    description: "Launch a PILOT line; gates in order: lockdown, posture, producible pack (the dilution cost was frozen and budgeted at brand-review approval)"
    roles: [BrandManager]
    code: 200
    input: []
    output: ProductLine
    side_effects: ["freeze dilution_cost_bps", "launched_at := now", "dilution and identity recompute"]
  - method: POST
    path: "/brand-ops/product-lines/{id}/discontinue"
    description: "Discontinue a PILOT or LAUNCHED non-core line; discontinued lines refund half their dilution cost"
    roles: [BrandManager]
    code: 200
    input: []
    output: ProductLine
    side_effects: ["dilution and identity recompute"]

  # --- Formulation ---
  - method: POST
    path: "/brand-ops/product-lines/{lineId}/formulations"
    description: "Create a formulation for a line (initial status DRAFT); master_formulation_id makes it a local variant"
    roles: [TradeSecretOfficer]
    code: 201
    input: [version_label, component_codes, voc_class, "master_formulation_id?"]
    output: Formulation
    side_effects: []
  - method: GET
    path: "/brand-ops/formulations/{id}"
    description: "Get a formulation"
    roles: *all_roles
    code: 200
    input: []
    output: Formulation
    side_effects: []
  - method: GET
    path: "/brand-ops/formulations"
    description: "List formulations, optionally filtered by owning line or master formulation"
    roles: *all_roles
    code: 200
    input: ["product_line_id?", "master_formulation_id?", "status?", "limit?", "offset?"]
    output: Formulation[]
    side_effects: []
  - method: POST
    path: "/brand-ops/formulations/{id}/seal"
    description: "Seal a DRAFT formulation (requires at least 3 components)"
    roles: [TradeSecretOfficer]
    code: 200
    input: []
    output: Formulation
    side_effects: ["sealed_at := now"]

  # --- ContractManufacturer ---
  - method: POST
    path: "/brand-ops/contract-manufacturers"
    description: "Onboard a contract manufacturer (initial status VETTING); records sponsoring_officer_id from the caller"
    roles: [TradeSecretOfficer]
    code: 201
    input: [legal_name, site_country, capabilities]
    output: ContractManufacturer
    side_effects: ["sponsoring_officer_id := caller X-User-ID"]
  - method: GET
    path: "/brand-ops/contract-manufacturers/{id}"
    description: "Get a contract manufacturer including computed disclosed_component_count"
    roles: *all_roles
    code: 200
    input: []
    output: ContractManufacturer
    side_effects: []
  - method: POST
    path: "/brand-ops/contract-manufacturers/{id}/qualify"
    description: "Qualify from VETTING, or requalify from SUSPENDED (blocked for 90 days after a for-cause revocation)"
    roles: [TradeSecretOfficer]
    code: 200
    input: []
    output: ContractManufacturer
    side_effects: ["suspended_at := null"]

  # --- ConfidentialityGrant ---
  - method: POST
    path: "/brand-ops/confidentiality-grants"
    description: "Request a confidentiality grant (initial status REQUESTED); manufacturer must be QUALIFIED, formulation SEALED or COMPARTMENTALIZED, scope a non-empty subset, expiry in the future"
    roles: [TradeSecretOfficer]
    code: 201
    input: [manufacturer_id, formulation_id, component_scope, expires_on, grant_reason]
    output: ConfidentialityGrant
    side_effects: []
  - method: GET
    path: "/brand-ops/confidentiality-grants/{id}"
    description: "Get a confidentiality grant"
    roles: *all_roles
    code: 200
    input: []
    output: ConfidentialityGrant
    side_effects: []
  - method: GET
    path: "/brand-ops/confidentiality-grants"
    description: "List confidentiality grants, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["manufacturer_id?", "formulation_id?", "status?", "limit?", "offset?"]
    output: ConfidentialityGrant[]
    side_effects: []
  - method: POST
    path: "/brand-ops/confidentiality-grants/{id}/grant"
    description: "Grant a REQUESTED grant; enforces the per-manufacturer per-formulation compartmentalization cap"
    roles: [TradeSecretOfficer]
    code: 200
    input: []
    output: ConfidentialityGrant
    side_effects: ["granted_by_user_id := caller X-User-ID", "disclosed_component_count recompute"]
  - method: POST
    path: "/brand-ops/confidentiality-grants/{id}/activate"
    description: "Activate a GRANTED grant; may complete formulation coverage and flip it to COMPARTMENTALIZED"
    roles: [TradeSecretOfficer]
    code: 200
    input: []
    output: ConfidentialityGrant
    side_effects: ["disclosed_component_count recompute", "possible Formulation SEALED -> COMPARTMENTALIZED"]
  - method: POST
    path: "/brand-ops/confidentiality-grants/{id}/revoke"
    description: "Revoke a non-terminal grant; for_cause=true suspends the manufacturer and cascades revocation of its other grants, regressing formulations that lose coverage"
    roles: [ComplianceAuditor]
    code: 200
    input: [for_cause]
    output: ConfidentialityGrant
    side_effects: ["revoked_at := now", "revoked_for_cause := for_cause", "possible manufacturer suspension cascade (3 links)", "posture recompute"]

  # --- Distributor ---
  - method: POST
    path: "/brand-ops/distributors"
    description: "Create a distributor (initial status APPLICANT)"
    roles: [ChannelManager]
    code: 201
    input: [legal_name, home_market_id, channels_served, credit_limit_cents]
    output: Distributor
    side_effects: []
  - method: GET
    path: "/brand-ops/distributors/{id}"
    description: "Get a distributor including computed attainment fields and tier"
    roles: *all_roles
    code: 200
    input: []
    output: Distributor
    side_effects: []
  - method: GET
    path: "/brand-ops/distributors"
    description: "List distributors, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["home_market_id?", "status?", "limit?", "offset?"]
    output: Distributor[]
    side_effects: []
  - method: POST
    path: "/brand-ops/distributors/{id}/approve"
    description: "Approve an APPLICANT (home market must be OPEN)"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Distributor
    side_effects: []
  - method: POST
    path: "/brand-ops/distributors/{id}/suspend"
    description: "Manually suspend an APPROVED distributor; cascades ACTIVE assignments to SUSPENDED; a third suspension terminates instead"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Distributor
    side_effects: ["suspension_count += 1", "assignment cascade", "or straight to TERMINATED on third strike"]
  - method: POST
    path: "/brand-ops/distributors/{id}/reinstate"
    description: "Reinstate a SUSPENDED distributor to APPROVED; assignments stay SUSPENDED until individually resumed"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Distributor
    side_effects: []
  - method: POST
    path: "/brand-ops/distributors/{id}/terminate"
    description: "Terminate a non-terminated distributor; PROPOSED assignments withdraw, ACTIVE/SUSPENDED assignments terminate"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Distributor
    side_effects: ["assignment termination cascade"]
  - method: GET
    path: "/brand-ops/distributors/{id}/rebate-preview"
    description: "Computed read: attainment variants, tier, rebate rate and a monetary rebate estimate for a caller-supplied reference unit price"
    roles: [ChannelManager, PricingAnalyst, PlatformAdmin]
    code: 200
    input: [reference_unit_price_cents]
    output: { attainment_actual_bps: "integer|null", attainment_projected_bps: "integer|null", quota_compliance_tier: "string|null", rebate_bps: integer, window_net_units: integer, rebate_estimate_cents: integer }
    side_effects: []

  # --- Market ---
  - method: POST
    path: "/brand-ops/markets"
    description: "Create a market (initial status OPEN); country_code must be unique"
    roles: [RegulatoryAffairs]
    code: 201
    input: [country_code, name, registration_required, voc_regime, allowed_channels]
    output: Market
    side_effects: []
  - method: GET
    path: "/brand-ops/markets/{id}"
    description: "Get a market"
    roles: *all_roles
    code: 200
    input: []
    output: Market
    side_effects: []
  - method: POST
    path: "/brand-ops/markets/{id}/close"
    description: "Close an OPEN market; blocked while assignments or registrations are non-terminal"
    roles: [RegulatoryAffairs]
    code: 200
    input: []
    output: Market
    side_effects: []

  # --- MarketRegistration ---
  - method: POST
    path: "/brand-ops/market-registrations"
    description: "Create a registration (initial status DRAFT): market OPEN, line PILOT or LAUNCHED, formulation of that line SEALED or COMPARTMENTALIZED, VOC regime satisfied, one non-terminal registration per (market, line)"
    roles: [RegulatoryAffairs]
    code: 201
    input: [market_id, product_line_id, formulation_id, expires_on]
    output: MarketRegistration
    side_effects: []
  - method: GET
    path: "/brand-ops/market-registrations/{id}"
    description: "Get a market registration"
    roles: *all_roles
    code: 200
    input: []
    output: MarketRegistration
    side_effects: []
  - method: GET
    path: "/brand-ops/market-registrations"
    description: "List market registrations, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["market_id?", "product_line_id?", "formulation_id?", "status?", "limit?", "offset?"]
    output: MarketRegistration[]
    side_effects: []
  - method: POST
    path: "/brand-ops/market-registrations/{id}/submit"
    description: "Submit a DRAFT registration; blocked by brand lockdown or CRITICAL posture"
    roles: [RegulatoryAffairs]
    code: 200
    input: []
    output: MarketRegistration
    side_effects: ["submitted_at := now"]
  - method: POST
    path: "/brand-ops/market-registrations/{id}/approve"
    description: "Approve a SUBMITTED registration straight to ACTIVE with an authority registration number"
    roles: [RegulatoryAffairs]
    code: 200
    input: [registration_number]
    output: MarketRegistration
    side_effects: ["registration_number := input", "approved_at := now"]
  - method: POST
    path: "/brand-ops/market-registrations/{id}/reject"
    description: "Reject a SUBMITTED registration"
    roles: [RegulatoryAffairs]
    code: 200
    input: [reason]
    output: MarketRegistration
    side_effects: []
  - method: POST
    path: "/brand-ops/market-registrations/{id}/revise"
    description: "Return a REJECTED registration to DRAFT (revision loop)"
    roles: [RegulatoryAffairs]
    code: 200
    input: []
    output: MarketRegistration
    side_effects: ["revise_count += 1"]
  - method: POST
    path: "/brand-ops/market-registrations/{id}/renew"
    description: "Renew a RENEWAL_DUE registration back to ACTIVE with a strictly later expiry; from ACTIVE the window is not open, from EXPIRED it is gone"
    roles: [RegulatoryAffairs]
    code: 200
    input: [new_expires_on]
    output: MarketRegistration
    side_effects: ["expires_on := new_expires_on"]
  - method: POST
    path: "/brand-ops/market-registrations/{id}/revoke"
    description: "Revoke an ACTIVE or RENEWAL_DUE registration; ACTIVE coverage assignments for the (market, line) are suspended"
    roles: [RegulatoryAffairs]
    code: 200
    input: []
    output: MarketRegistration
    side_effects: ["coverage suspension cascade"]

  # --- CoverageAssignment ---
  - method: POST
    path: "/brand-ops/distributors/{distributorId}/coverage-assignments"
    description: "Propose a coverage assignment (OCC on distributor version). Requires distributor APPROVED, market OPEN, line PILOT or LAUNCHED, channel served by distributor, allowed by market and targeted by line, starts_on before ends_on, ends_on not past. Exclusive proposals conflict with ACTIVE/SUSPENDED exclusive assignments on the same cell under closed-interval semantics (touching endpoints conflict). Any PROPOSED assignments on the same cell are superseded."
    roles: [ChannelManager]
    code: 201
    input: [market_id, product_line_id, channel, "exclusive?", starts_on, ends_on, annual_quota_units, expected_distributor_version]
    output: CoverageAssignment
    side_effects: ["increments Distributor.version by 1", "supersedes PROPOSED assignments on the same cell", "sets supersedes_assignment_id"]
  - method: GET
    path: "/brand-ops/coverage-assignments/{id}"
    description: "Get a coverage assignment"
    roles: *all_roles
    code: 200
    input: []
    output: CoverageAssignment
    side_effects: []
  - method: GET
    path: "/brand-ops/coverage-assignments"
    description: "List coverage assignments, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["distributor_id?", "market_id?", "product_line_id?", "channel?", "status?", "limit?", "offset?"]
    output: CoverageAssignment[]
    side_effects: []
  - method: POST
    path: "/brand-ops/coverage-assignments/{id}/activate"
    description: "Activate a PROPOSED assignment; enforces distributor, window, line launch, registration, posture, exclusivity and cell-capacity gates"
    roles: [ChannelManager]
    code: 200
    input: []
    output: CoverageAssignment
    side_effects: []
  - method: POST
    path: "/brand-ops/coverage-assignments/{id}/suspend"
    description: "Suspend an ACTIVE assignment; it keeps reserving its cell"
    roles: [ChannelManager]
    code: 200
    input: []
    output: CoverageAssignment
    side_effects: []
  - method: POST
    path: "/brand-ops/coverage-assignments/{id}/resume"
    description: "Resume a SUSPENDED assignment with the same cross-entity gates as activation"
    roles: [ChannelManager]
    code: 200
    input: []
    output: CoverageAssignment
    side_effects: []
  - method: POST
    path: "/brand-ops/coverage-assignments/{id}/withdraw"
    description: "Withdraw a PROPOSED assignment"
    roles: [ChannelManager]
    code: 200
    input: []
    output: CoverageAssignment
    side_effects: []

  # --- PackFormat ---
  - method: POST
    path: "/brand-ops/product-lines/{lineId}/pack-formats"
    description: "Create a pack format for a line (initial status DESIGNED); channel_restrictions must be a non-empty subset of the line's target_channels"
    roles: [SupplyPlanner]
    code: 201
    input: [size_ml, delivery_system, channel_restrictions, "case_pack_qty?"]
    output: PackFormat
    side_effects: []
  - method: GET
    path: "/brand-ops/pack-formats/{id}"
    description: "Get a pack format"
    roles: *all_roles
    code: 200
    input: []
    output: PackFormat
    side_effects: []
  - method: GET
    path: "/brand-ops/pack-formats"
    description: "List pack formats, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["product_line_id?", "status?", "limit?", "offset?"]
    output: PackFormat[]
    side_effects: []
  - method: POST
    path: "/brand-ops/pack-formats/{id}/tool"
    description: "Tool a DESIGNED pack; the owning line must be PILOT or LAUNCHED"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: PackFormat
    side_effects: []
  - method: POST
    path: "/brand-ops/pack-formats/{id}/enter-production"
    description: "Move a TOOLED pack to IN_PRODUCTION; requires a COMPARTMENTALIZED formulation on the line and at least one SCHEDULED or EFFECTIVE price list"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: PackFormat
    side_effects: []
  - method: POST
    path: "/brand-ops/pack-formats/{id}/retire"
    description: "Retire an IN_PRODUCTION pack; all its price lists must be terminal"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: PackFormat
    side_effects: []

  # --- ChannelPriceList ---
  - method: POST
    path: "/brand-ops/pack-formats/{packFormatId}/price-lists"
    description: "Create a channel price list (OCC on pack format version). Initial status EFFECTIVE when the window covers now, else SCHEDULED; a window entirely past is rejected. Half-open windows may touch but not overlap: overlapped SCHEDULED lists are SUPERSEDED, an overlapped EFFECTIVE list is clipped (its effective_to becomes the new effective_from) or SUPERSEDED when the new list starts no later."
    roles: [PricingAnalyst]
    code: 201
    input: [channel, list_price_cents, map_price_cents, effective_from, effective_to, expected_pack_format_version]
    output: ChannelPriceList
    side_effects: ["increments PackFormat.version by 1", "supersede or clip overlapped lists on the same (pack, channel)"]
  - method: GET
    path: "/brand-ops/price-lists/{id}"
    description: "Get a price list"
    roles: *all_roles
    code: 200
    input: []
    output: ChannelPriceList
    side_effects: []
  - method: GET
    path: "/brand-ops/price-lists"
    description: "List price lists, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["pack_format_id?", "channel?", "status?", "limit?", "offset?"]
    output: ChannelPriceList[]
    side_effects: []
  - method: GET
    path: "/brand-ops/pack-formats/{id}/effective-price"
    description: "Resolve the price list governing (pack, channel) at the given instant (default: current logical time) via window arithmetic over non-SUPERSEDED lists"
    roles: *all_roles
    code: 200
    input: [channel, "at?"]
    output: { price_list_id: string, channel: string, list_price_cents: integer, map_price_cents: integer, effective_from: string, effective_to: string }
    side_effects: []

  # --- Promotion ---
  - method: POST
    path: "/brand-ops/promotions"
    description: "Create a promotion (initial status DRAFT); line must be PILOT or LAUNCHED, channel targeted by the line, window valid and not fully past"
    roles: [PricingAnalyst]
    code: 201
    input: [product_line_id, channel, discount_pct, starts_on, ends_on, funding_budget_cents]
    output: Promotion
    side_effects: ["created_by_user_id := caller X-User-ID"]
  - method: GET
    path: "/brand-ops/promotions/{id}"
    description: "Get a promotion including accrued funding and provisional unit funding"
    roles: *all_roles
    code: 200
    input: []
    output: Promotion
    side_effects: []
  - method: GET
    path: "/brand-ops/promotions"
    description: "List promotions, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["product_line_id?", "channel?", "status?", "limit?", "offset?"]
    output: Promotion[]
    side_effects: []
  - method: POST
    path: "/brand-ops/promotions/{id}/submit"
    description: "Submit a DRAFT promotion for approval"
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: Promotion
    side_effects: []
  - method: POST
    path: "/brand-ops/promotions/{id}/approve"
    description: "Approve a PENDING_APPROVAL promotion; enforces segregation of duties, posture depth cap, price-list presence, MAP floor, frequency and gap gates; computes unit_funding_provisional_cents; enters LIVE immediately when the window already covers today"
    roles: [MarketingManager]
    code: 200
    input: []
    output: Promotion
    side_effects: ["approved_by_user_id := caller X-User-ID", "unit_funding_provisional_cents computed", "may enter LIVE immediately"]
  - method: POST
    path: "/brand-ops/promotions/{id}/resume"
    description: "Resume a SUSPENDED promotion once posture recovers; blocked past ends_on"
    roles: [MarketingManager]
    code: 200
    input: []
    output: Promotion
    side_effects: []
  - method: POST
    path: "/brand-ops/promotions/{id}/redemptions"
    description: "Record units redeemed under a LIVE promotion for a pack of its line; computes ACTUAL unit funding from the price list EFFECTIVE now, enforces the funding budget (accrued + total <= budget)"
    roles: [ChannelManager]
    code: 200
    input: [pack_format_id, units]
    output: { redemption_id: string, unit_funding_cents: integer, promo_unit_price_cents: integer, promo_case_price_cents: integer, total_funding_cents: integer, accrued_funding_cents: integer, remaining_budget_cents: integer }
    side_effects: ["accrued_funding_cents += total_funding_cents", "redemptions_count += 1"]

  # --- CounterfeitCase ---
  - method: POST
    path: "/brand-ops/brands/{brandId}/counterfeit-cases"
    description: "Report a counterfeit case (initial status REPORTED); recomputes brand protection_posture and fires the promotion suspension cascade if the posture becomes CRITICAL"
    roles: [ComplianceAuditor]
    code: 201
    input: [market_id, channel, severity, "units_seized?"]
    output: CounterfeitCase
    side_effects: ["posture recompute", "possible promotion suspension cascade"]
  - method: GET
    path: "/brand-ops/counterfeit-cases/{id}"
    description: "Get a counterfeit case"
    roles: *all_roles
    code: 200
    input: []
    output: CounterfeitCase
    side_effects: []
  - method: GET
    path: "/brand-ops/counterfeit-cases"
    description: "List counterfeit cases, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["brand_id?", "market_id?", "status?", "limit?", "offset?"]
    output: CounterfeitCase[]
    side_effects: []
  - method: POST
    path: "/brand-ops/counterfeit-cases/{id}/take-action"
    description: "Record enforcement action on a REPORTED case; overwrites units_seized and recomputes posture (firing the promotion cascade on CRITICAL)"
    roles: [ComplianceAuditor]
    code: 200
    input: [units_seized]
    output: CounterfeitCase
    side_effects: ["units_seized := input", "posture recompute", "possible promotion suspension cascade"]
  - method: POST
    path: "/brand-ops/counterfeit-cases/{id}/close"
    description: "Close a REPORTED or ACTION_TAKEN case; recomputes posture but never auto-resumes promotions"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: CounterfeitCase
    side_effects: ["posture recompute"]

  # --- UseCaseSubmission ---
  - method: POST
    path: "/brand-ops/product-lines/{lineId}/use-cases"
    description: "Submit a consumer use case (initial status SUBMITTED); the line must be LAUNCHED and submitter_ref must equal the caller X-User-ID"
    roles: [Consumer]
    code: 201
    input: [submitter_ref, title, description]
    output: UseCaseSubmission
    side_effects: []
  - method: GET
    path: "/brand-ops/use-cases/{id}"
    description: "Get a use-case submission"
    roles: *all_roles
    code: 200
    input: []
    output: UseCaseSubmission
    side_effects: []
  - method: GET
    path: "/brand-ops/use-cases"
    description: "List use-case submissions, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["product_line_id?", "status?", "submitter_ref?", "limit?", "offset?"]
    output: UseCaseSubmission[]
    side_effects: []
  - method: POST
    path: "/brand-ops/use-cases/{id}/review"
    description: "Moderate a SUBMITTED use case: decision VERIFY (records generic_use_flag, feeds genericization risk) or REJECT"
    roles: [MarketingManager]
    code: 200
    input: [decision, generic_use_flag]
    output: UseCaseSubmission
    side_effects: ["generic_use_flag := input", "genericization risk recompute on VERIFY"]
  - method: POST
    path: "/brand-ops/use-cases/{id}/publish"
    description: "Publish a VERIFIED use case; a flagged submission is blocked once the brand genericization risk has reached 500 bps"
    roles: [MarketingManager]
    code: 200
    input: []
    output: UseCaseSubmission
    side_effects: ["genericization risk recompute"]
  - method: POST
    path: "/brand-ops/use-cases/{id}/retract"
    description: "Retract a PUBLISHED use case; removes its genericization contribution"
    roles: [MarketingManager]
    code: 200
    input: []
    output: UseCaseSubmission
    side_effects: ["genericization risk recompute"]

  # --- SellThroughReport ---
  - method: POST
    path: "/brand-ops/distributors/{distributorId}/sell-through-reports"
    description: "File a monthly sell-through report for one of the distributor's assignments. Gates: the caller X-User-ID must equal the path distributor id (ERR_NOT_RESOURCE_OWNER); coverage_assignment_id must exist and belong to the path distributor (ERR_INVALID_REFERENCE); the assignment status must be ACTIVE, SUSPENDED or CLOSED (ERR_INVALID_STATE_TRANSITION); the period must be a completed month strictly before the current logical month (ERR_PERIOD_NOT_COMPLETED); one report per assignment per month (ERR_DUPLICATE_REPORT). Recomputes attainment and may fire the SANCTION suspension cascade"
    roles: [DistributorContact]
    code: 201
    input: [coverage_assignment_id, period_month, units_sold, "units_returned?"]
    output: SellThroughReport
    side_effects: ["net_units computed", "attainment recompute", "possible distributor suspension cascade"]
  - method: GET
    path: "/brand-ops/sell-through-reports/{id}"
    description: "Get a sell-through report"
    roles: *all_roles
    code: 200
    input: []
    output: SellThroughReport
    side_effects: []
  - method: GET
    path: "/brand-ops/sell-through-reports"
    description: "List sell-through reports, optionally filtered"
    roles: *all_roles
    code: 200
    input: ["distributor_id?", "coverage_assignment_id?", "period_month?", "limit?", "offset?"]
    output: SellThroughReport[]
    side_effects: []

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  # --- auth / identity ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing, empty, or an undeclared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "DistributorContact X-User-ID does not equal the path distributor id" }
  - { id: ERR_SUBMITTER_MISMATCH, http: 403, condition: "Use-case submitter_ref does not equal the Consumer caller X-User-ID" }
  # --- existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, malformed value, enum/range violation, or a constrained array empty/oversized" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "A request-body referenced id does not exist" }
  - { id: ERR_NO_EFFECTIVE_PRICE, http: 404, condition: "No non-SUPERSEDED price list covers the requested (pack, channel, instant)" }
  # --- optimistic concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  # --- state ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The target resource's state machine has no such transition from its current state" }
  - { id: ERR_DISTRIBUTOR_NOT_APPROVED, http: 409, condition: "Coverage activation/resume or proposal requires an APPROVED distributor" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 409, condition: "Renew attempted while the registration is still ACTIVE (window opens exactly 90 days before expiry, inclusive)" }
  - { id: ERR_REGISTRATION_EXPIRED, http: 409, condition: "Renew attempted on an EXPIRED registration" }
  - { id: ERR_PROMO_WINDOW_CLOSED, http: 409, condition: "Resume attempted after the promotion's ends_on" }
  - { id: ERR_GRANT_EXPIRED, http: 409, condition: "Grant or activate attempted with expires_on at or before the current logical time" }
  # --- business safety ---
  - { id: ERR_BRAND_IN_LOCKDOWN, http: 409, condition: "Brand is PROTECTIVE_LOCKDOWN; blocks launch, registration submit, exclusive activation, promotion resume" }
  - { id: ERR_POSTURE_CRITICAL, http: 409, condition: "Brand protection_posture is CRITICAL; blocks launch, registration submit, exclusive activation, promotion resume" }
  - { id: ERR_MANUFACTURER_NOT_QUALIFIED, http: 409, condition: "Grant create/activate requires the manufacturer to be QUALIFIED" }
  - { id: ERR_COMPARTMENT_SCOPE_EXCEEDED, http: 422, condition: "The manufacturer's cumulative scope on the formulation would exceed half of its components" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Promotion approver X-User-ID equals the promotion's created_by_user_id" }
  - { id: ERR_AUDITOR_CONFLICT, http: 409, condition: "For-cause revocation attempted by the same user id recorded as granted_by_user_id" }
  - { id: ERR_VOC_REGIME_MISMATCH, http: 422, condition: "STRICT market registration requires a LOW_VOC formulation" }
  - { id: ERR_GENERICIZATION_RISK, http: 422, condition: "Publishing a flagged use case while brand genericization_risk_bps >= 500" }
  - { id: ERR_RECENT_BREACH, http: 409, condition: "Requalification within 90 days of a for-cause revocation of this manufacturer's grant" }
  - { id: ERR_LOCKDOWN_CONDITIONS_UNMET, http: 409, condition: "Lift-lockdown attempted while severity-5 cases are open or for-cause revocations are within 90 days" }
  # --- business temporal ---
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "Inverted or fully-past window: starts_on >= ends_on, ends_on past, effective_from >= effective_to, new_expires_on not after expires_on, activation outside the coverage window" }
  - { id: ERR_EXCLUSIVE_OVERLAP, http: 409, condition: "An exclusive coverage proposal/activation collides with an ACTIVE or SUSPENDED exclusive assignment on the same cell under closed-interval semantics" }
  - { id: ERR_PERIOD_NOT_COMPLETED, http: 422, condition: "Sell-through report period_month is the current or a future logical month" }
  - { id: ERR_CLOCK_REGRESSION, http: 400, condition: "Clock set to a time not strictly after the current logical time" }
  # --- business constraint ---
  - { id: ERR_DUPLICATE_LINE_CODE, http: 409, condition: "line_code already used by a non-DISCONTINUED line of the brand" }
  - { id: ERR_CORE_LINE_EXISTS, http: 409, condition: "A non-DISCONTINUED core line already exists for the brand" }
  - { id: ERR_CORE_LINE_IMMUTABLE, http: 409, condition: "The core line cannot be discontinued" }
  - { id: ERR_MARKET_CODE_EXISTS, http: 409, condition: "country_code already registered" }
  - { id: ERR_CHANNEL_NOT_SERVED, http: 422, condition: "Assignment channel is not in the distributor's channels_served" }
  - { id: ERR_CHANNEL_NOT_ALLOWED, http: 422, condition: "Channel is not allowed by the market or by the pack's channel_restrictions" }
  - { id: ERR_CHANNEL_OUTSIDE_LINE_SCOPE, http: 422, condition: "Channel is not in the product line's target_channels" }
  - { id: ERR_CELL_CAPACITY_EXCEEDED, http: 409, condition: "The (market, channel, line) cell already has 3 ACTIVE or SUSPENDED assignments" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "A report already exists for this coverage assignment and period_month" }
  - { id: ERR_REGISTRATION_EXISTS, http: 409, condition: "A non-terminal registration already exists for this (market, product_line)" }
  - { id: ERR_SCOPE_NOT_SUBSET, http: 422, condition: "component_scope is not a subset of the formulation's component_codes" }
  - { id: ERR_INSUFFICIENT_COMPONENTS, http: 422, condition: "Sealing requires at least 3 component codes" }
  - { id: ERR_COMPONENT_LIMIT_EXCEEDED, http: 422, condition: "component_codes exceeds 12 entries" }
  - { id: ERR_MAP_ABOVE_LIST, http: 422, condition: "map_price_cents exceeds list_price_cents" }
  - { id: ERR_FORMULATION_LINE_MISMATCH, http: 422, condition: "The formulation does not belong to the registration's product line" }
  - { id: ERR_PACK_LINE_MISMATCH, http: 422, condition: "The redeemed pack format does not belong to the promotion's product line" }
  - { id: ERR_MARKET_IN_USE, http: 409, condition: "Market close blocked by non-terminal assignments or registrations" }
  # --- business referential ---
  - { id: ERR_MARKET_NOT_OPEN, http: 409, condition: "Market is not OPEN (distributor approval, registration creation)" }
  - { id: ERR_FORMULATION_NOT_SEALED, http: 409, condition: "Formulation is not SEALED or COMPARTMENTALIZED (grant create, registration create, brand-review approve)" }
  - { id: ERR_FORMULATION_NOT_COMPARTMENTALIZED, http: 409, condition: "No formulation of the line is COMPARTMENTALIZED (enter-production)" }
  - { id: ERR_REGISTRATION_NOT_ACTIVE, http: 409, condition: "Coverage activation/resume requires an ACTIVE registration when the market requires registration" }
  - { id: ERR_NO_PRICE_LIST, http: 409, condition: "No SCHEDULED or EFFECTIVE price list exists where one is required (enter-production, promotion approve)" }
  - { id: ERR_NO_PRODUCIBLE_PACK_FORMAT, http: 409, condition: "Launch requires at least one IN_PRODUCTION pack format" }
  - { id: ERR_PRICE_LISTS_OUTSTANDING, http: 409, condition: "Retire blocked by non-terminal price lists" }
  - { id: ERR_LINE_STAGE_TOO_EARLY, http: 409, condition: "Line must be PILOT or LAUNCHED (tooling, promotion creation, registration creation, coverage proposal)" }
  - { id: ERR_LINE_NOT_LAUNCHED, http: 409, condition: "Line must be LAUNCHED (coverage activation, use-case creation)" }
  # --- business fiscal ---
  - { id: ERR_EQUITY_BUDGET_EXCEEDED, http: 422, condition: "Launch would push dilution_consumed_bps above the brand's equity_budget_bps" }
  - { id: ERR_CORE_IDENTITY_DILUTION, http: 422, condition: "Launch would push core_identity_share_bps below 7000" }
  - { id: ERR_PROMO_DEPTH_EXCEEDS_CAP, http: 422, condition: "discount_pct exceeds the posture-dependent depth cap (25.00 / 15.00 / 5.00)" }
  - { id: ERR_BELOW_MAP_PRICE, http: 422, condition: "Promotion selling price would undercut a covering list's map_price_cents" }
  - { id: ERR_PROMO_TOO_FREQUENT, http: 422, condition: "Two or more peer promotions of the same line and channel already fall within +/- 90 days of starts_on" }
  - { id: ERR_PROMO_GAP_VIOLATION, http: 422, condition: "A peer promotion of the same line and channel starts less than 14 days away" }
  - { id: ERR_PROMO_BUDGET_EXCEEDED, http: 409, condition: "Redemption would push accrued_funding_cents above funding_budget_cents" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns only the logical clock test-driving endpoint, may read everything"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: BrandManager
    description: "Owns the brand record, product-line lifecycle, brand reviews, launches and discontinuations"
    identity: opaque
    exclusive_operations: ["brand create", "product-line create/brand-review/launch/discontinue"]
    shared_operations: ["all GET endpoints"]
  - name: TradeSecretOfficer
    description: "Owns formulations, contract manufacturers, and the request/grant/activate side of confidentiality grants"
    identity: opaque
    exclusive_operations: ["formulation create/seal", "contract-manufacturer create/qualify", "grant create/grant/activate"]
    shared_operations: ["all GET endpoints"]
  - name: ComplianceAuditor
    description: "Owns revocation of grants (for-cause segregation from the grantor), brand lockdown, and counterfeit enforcement"
    identity: opaque
    exclusive_operations: ["grant revoke", "brand lockdown/lift-lockdown", "counterfeit-case create/take-action/close"]
    shared_operations: ["all GET endpoints"]
  - name: ChannelManager
    description: "Owns distributor lifecycle, coverage assignments, and records promotion redemptions"
    identity: opaque
    exclusive_operations: ["distributor create/approve/suspend/reinstate/terminate", "coverage-assignment create/activate/suspend/resume/withdraw", "promotion redemptions"]
    shared_operations: ["all GET endpoints", "rebate-preview"]
  - name: PricingAnalyst
    description: "Owns channel price lists and creates/submits promotions; may never approve them"
    identity: opaque
    exclusive_operations: ["price-list create", "promotion create/submit"]
    shared_operations: ["all GET endpoints", "rebate-preview"]
  - name: MarketingManager
    description: "Approves and resumes promotions (segregated from their creator) and moderates consumer use cases"
    identity: opaque
    exclusive_operations: ["promotion approve/resume", "use-case review/publish/retract"]
    shared_operations: ["all GET endpoints"]
  - name: RegulatoryAffairs
    description: "Owns markets and market registrations"
    identity: opaque
    exclusive_operations: ["market create/close", "registration create/submit/approve/reject/revise/renew/revoke"]
    shared_operations: ["all GET endpoints"]
  - name: SupplyPlanner
    description: "Owns pack formats and their tooling/production lifecycle"
    identity: opaque
    exclusive_operations: ["pack-format create/tool/enter-production/retire"]
    shared_operations: ["all GET endpoints"]
  - name: DistributorContact
    description: "External distributor user; X-User-ID equals the Distributor id; files sell-through reports only for that distributor's assignments"
    identity: "entity_backed:Distributor"
    exclusive_operations: ["sell-through report create"]
    shared_operations: ["all GET endpoints"]
  - name: Consumer
    description: "External consumer; X-User-ID is the consumer handle; submits use cases for LAUNCHED lines with submitter_ref equal to the caller id"
    identity: opaque
    exclusive_operations: ["use-case create"]
    shared_operations: ["all GET endpoints"]
