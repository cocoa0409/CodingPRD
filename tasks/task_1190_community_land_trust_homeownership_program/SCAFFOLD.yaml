# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 6: Error Code Catalogue
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist in expected scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Request body malformed, missing required field, or field value out of domain (e.g. appraised_value_cents == 0, household_size < 1, score_pct outside [0,1])" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource in wrong state for the requested transition" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body-referenced FK id does not resolve to an existing entity in the same program scope" }
  - { id: ERR_SO_DUTY_VIOLATION, http: 409, condition: "Segregation-of-duties: actor equals submitted_by/creator on an approval action" }
  - { id: ERR_CURE_EVIDENCE_MISSING, http: 422, condition: "MAINTENANCE cure requires a PASSED follow-up InspectionRecord after notice.issued_at; cure_evidence missing" }
  - { id: ERR_ARREARS_NOT_CLEARED, http: 402, condition: "FEE_ARREARS cure attempted while GroundLease.fee_arrears_cents > 0" }
  - { id: ERR_UNDERPAYMENT, http: 402, condition: "LeaseFee payment insufficient: paid_amount_cents + payment_amount_cents < amount_cents" }
  - { id: ERR_FUNDS_NOT_CONFIRMED, http: 402, condition: "ResaleListing close attempted with confirmed_funds != true" }
  - { id: ERR_HOUSEHOLD_INELIGIBLE, http: 409, condition: "Household.eligibility_status != ELIGIBLE at time of purchase/match/lease activation" }
  - { id: ERR_EDUCATION_INCOMPLETE, http: 409, condition: "Required EducationCourse completion missing or expired for this household" }
  - { id: ERR_CERT_STALE, http: 409, condition: "Latest approved IncomeCertification.decided_at is older than 24 months" }
  - { id: ERR_UNIT_BLOCKED, http: 409, condition: "Unit cannot enter resale/maintenance action (UNSAFE flag, open default, or wrong occupancy_status)" }
  - { id: ERR_UNIT_OCCUPIED, http: 409, condition: "Unit already has an ACTIVE GroundLease; cannot activate another" }
  - { id: ERR_MULTI_LEASE_PROHIBITED, http: 409, condition: "Household already holds an ACTIVE GroundLease in this program" }
  - { id: ERR_NO_ELIGIBLE_BUYER, http: 422, condition: "Waitlist match found zero eligible candidates after applying eligibility filter" }
  - { id: ERR_REFINANCE_LIMIT_EXCEEDED, http: 422, condition: "computed_ltv > program.max_refi_ltv_pct OR requested_cash_out_cents > program.max_equity_withdrawal_cents" }
  - { id: ERR_CURE_WINDOW_EXPIRED, http: 409, condition: "Action requires an OPEN DefaultNotice within cure window, or a notice past deadline for escalation; not satisfied" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC precondition: expected_*_version does not match parent entity's current version" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the benchmark platform; can create programs"
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET read endpoints across all resources"

  - name: ProgramAdmin
    description: "Administrator of a specific CLT program; manages courses, units, program parameters"
    identity: opaque
    exclusive_operations:
      - "PUT /programs/{id}"
      - "POST /programs/{id}/suspend"
      - "POST /programs/{id}/reinstate"
      - "POST /programs/{id}/close"
      - "POST /programs/{id}/education-courses (create)"
      - "POST /programs/{id}/education-courses/{courseId}/retire"
      - "POST /programs/{id}/units (create)"
    shared_operations:
      - "GET read endpoints across all resources"

  - name: IntakeSpecialist
    description: "Front-line staff who registers households, records education completions, files income certs"
    identity: opaque
    exclusive_operations:
      - "POST /programs/{id}/households (create)"
      - "POST /programs/{id}/households/{householdId}/education-completions (record)"
    shared_operations:
      - "POST /programs/{id}/households/{householdId}/income-certifications (with Household)"
      - "POST /programs/{id}/households/{householdId}/waitlist-entries (with Household)"
      - "GET read endpoints across household/waitlist resources"

  - name: ComplianceOfficer
    description: "Reviews and decides income certifications; cannot review their own submissions"
    identity: opaque
    exclusive_operations:
      - "POST .../income-certifications/{certId}/start-review"
      - "POST .../income-certifications/{certId}/approve"
      - "POST .../income-certifications/{certId}/reject"
    shared_operations:
      - "GET read endpoints"

  - name: LeaseManager
    description: "Manages ground leases, defaults, resales, refinances; cannot certify income"
    identity: opaque
    exclusive_operations:
      - "POST /programs/{id}/households/{householdId}/suspend"
      - "POST /programs/{id}/households/{householdId}/reinstate"
      - "POST /programs/{id}/units/{unitId}/leases (create draft)"
      - "POST .../leases/{leaseId}/activate"
      - "POST .../leases/{leaseId}/terminate"
      - "POST .../leases/{leaseId}/foreclose"
      - "POST .../leases/{leaseId}/fees/{feeId}/waive"
      - "POST .../leases/{leaseId}/default-notices (issue)"
      - "POST .../default-notices/{noticeId}/cure"
      - "POST .../default-notices/{noticeId}/escalate"
      - "POST .../default-notices/{noticeId}/dismiss"
      - "POST .../resale-listings/{listingId}/run-matching"
      - "POST .../resale-listings/{listingId}/open-contract"
      - "POST .../resale-listings/{listingId}/close"
      - "POST .../resale-listings/{listingId}/cancel"
      - "POST .../refinance-requests/{refiId}/approve"
      - "POST .../refinance-requests/{refiId}/reject"
      - "POST .../refinance-requests/{refiId}/record"
    shared_operations:
      - "POST .../resale-listings (with Household)"
      - "POST /programs/{id}/waitlist-entries/{entryId}/withdraw (with Household)"
      - "POST /programs/{id}/units/{unitId}/inspections (with Inspector)"
      - "GET read endpoints"

  - name: Inspector
    description: "Performs unit inspections"
    identity: opaque
    exclusive_operations:
      - "POST .../inspections/{inspectionId}/record-result"
    shared_operations:
      - "POST /programs/{id}/units/{unitId}/inspections (with LeaseManager)"
      - "GET read endpoints"

  - name: Household
    description: "A buyer/applicant household; acts on its own resources (X-User-ID == Household.id)"
    identity: "entity_backed:Household"
    exclusive_operations:
      - "POST .../leases/{leaseId}/fees/{feeId}/pay"
      - "POST .../refinance-requests (create)"
      - "POST .../refinance-requests/{refiId}/submit-to-lender"
      - "POST .../refinance-requests/{refiId}/withdraw"
    shared_operations:
      - "POST /programs/{id}/households/{householdId}/income-certifications (with IntakeSpecialist)"
      - "POST /programs/{id}/households/{householdId}/waitlist-entries (with IntakeSpecialist)"
      - "POST /programs/{id}/waitlist-entries/{entryId}/withdraw (with LeaseManager)"
      - "POST .../resale-listings (with LeaseManager)"
      - "GET read endpoints on own resources"
