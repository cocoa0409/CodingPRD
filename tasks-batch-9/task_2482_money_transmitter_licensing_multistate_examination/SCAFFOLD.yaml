scenario: |
  Generate task harder than expert level!

  2482. Money Transmitter Licensing & Multistate Examination (money services business licensing
  team): license application per state with surety bond, net worth and permissible investment
  requirements, control person background checks and change-of-control approvals, agent and
  authorized delegate onboarding with oversight obligations, permissible investment coverage of
  outstanding transmission obligations with periodic testing, multistate coordinated examination
  participation and information request response, license renewal, reporting calendar and call
  report filings, new product and jurisdiction expansion analysis, enforcement action, remediation
  and license surrender

domain_name: money-transmitter-licensing
api_prefix: ""            # flat top-level collections: /licensees, /state-licenses, /control-persons, ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: ControlPerson is self-referential (indirect ownership chains); DelegateAuthorization is a
  # Delegate x StateLicense junction; MultistateExam fans across many Jurisdictions via
  # participating_jurisdiction_ids and InformationRequest rows.

  state_machine_shape: cyclic
  # LicenseApplication cycles UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW (bounded deficiency rounds);
  # StateLicense carries two independent dimensions (license_status x reporting_status);
  # EnforcementAction branches ISSUED -> {CONSENT_ORDER, CONTESTED} -> {RESOLVED, REVOCATION} with
  # divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # A PermissibleInvestmentTest may not be certified by the same X-User-ID that prepared it; the
  # StateRegulator that adjudicates a control-person background check is scoped to its own
  # Jurisdiction id; licensee-side and regulator-side operations never overlap.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities / 59 endpoints / 60 error codes / 60 ordered validations / 10 calculations
  # (2 dual-variant, 3 combinatorial modes) / 10 state machines across 9 entities, including
  # 2 cyclic (application deficiency loop, information-request reopen loop), 1 parallel-dimension
  # pair (StateLicense license_status x reporting_status), 1 branching (enforcement consent vs
  # contest) and 2 compound (exam close gated on child requests, control-person approval quorum).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: false
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter state code, unique across Jurisdiction rows
        constraints: "uppercase, exactly 2 chars, unique"
      - name: name
        type: string
        source: input
        description: Regulator display name
      - name: min_net_worth_cents
        type: integer
        source: input
        description: Minimum tangible net worth a Licensee must report to be licensed here
        constraints: ">= 0"
      - name: base_bond_cents
        type: integer
        source: input
        description: Statutory floor of the surety bond requirement
        constraints: ">= 0"
      - name: per_delegate_bond_cents
        type: integer
        source: input
        description: Incremental bond amount per ACTIVE authorized delegate
        constraints: ">= 0"
      - name: bond_cap_cents
        type: integer
        source: input
        description: Statutory ceiling of the surety bond requirement
        constraints: ">= base_bond_cents"
      - name: response_window_days
        type: integer
        source: input
        description: Days allowed to answer an InformationRequest issued by this Jurisdiction
        constraints: ">= 1"
      - name: renewal_fee_cents
        type: integer
        source: input
        description: Base annual renewal fee for one license in this Jurisdiction
        constraints: ">= 0"
      - name: assessment_rate_bps
        type: integer
        source: input
        description: Annual assessment rate in basis points applied to outstanding obligations
        constraints: ">= 0"
      - name: participates_in_multistate
        type: boolean
        source: input
        description: Whether this Jurisdiction may join a coordinated multistate examination
        default: true
      - name: call_report_frequency
        type: enum
        source: input
        description: Reporting calendar cadence for licenses in this Jurisdiction
        constraints: "QUARTERLY | ANNUAL"

  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the money services business
      - name: ein
        type: string
        source: input
        description: Employer identification number, unique across Licensee rows
        constraints: "unique, 9 digits"
      - name: reported_tangible_net_worth_cents
        type: integer
        source: input
        description: Net worth from the most recent financial statement filing
        default: 0
        constraints: "may be negative"
      - name: net_worth_statement_date
        type: datetime
        source: input
        description: As-of date of the reported net worth figure
      - name: aggregate_outstanding_obligations_cents
        type: integer
        source: computed
        description: "Sum of StateLicense.outstanding_obligations_cents over licenses whose license_status IN {PENDING_BOND, ACTIVE, SUSPENDED, SURRENDER_REQUESTED}; see calculations.licensee_obligation_aggregate"
        default: 0
      - name: eligible_investment_value_cents
        type: integer
        source: computed
        description: "Permissible investment value under the ELIGIBLE_MARKET variant of calculations.permissible_investment_coverage"
        default: 0
      - name: book_investment_value_cents
        type: integer
        source: computed
        description: "Permissible investment value under the BOOK_VALUE variant of calculations.permissible_investment_coverage"
        default: 0
      - name: coverage_ratio_bps
        type: integer
        source: computed
        description: "ELIGIBLE_MARKET coverage ratio in basis points; 10000 when aggregate_outstanding_obligations_cents == 0"
        default: 10000
      - name: coverage_posture
        type: enum
        source: computed
        description: Posture gate derived from coverage_ratio_bps and consecutive_failed_test_count
        default: COMPLIANT
        constraints: "COMPLIANT | WATCH | DEFICIENT | FROZEN"
      - name: consecutive_failed_test_count
        type: integer
        source: computed
        description: Count of consecutive CERTIFIED PermissibleInvestmentTest rows whose result is SHORTFALL
        default: 0
      - name: control_chain_status
        type: enum
        source: computed
        description: Aggregate background-check state over ControlPerson rows with control_determination CONTROL
        default: VERIFIED
        constraints: "VERIFIED | PENDING_CHECKS | BLOCKED"
      - name: active_license_count
        type: integer
        source: computed
        description: Count of StateLicense rows for this Licensee with license_status == ACTIVE
        default: 0

  - name: ControlPerson
    parent: Licensee
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: FK -> Licensee.id; the licensee whose control chain this row belongs to
      - name: parent_control_person_id
        type: string
        source: input
        description: "FK -> ControlPerson.id; the intermediate holder through which this person owns the licensee; null for a direct holder"
        default: null
      - name: full_name
        type: string
        source: input
        description: Legal name of the natural person or entity holder
      - name: role_title
        type: enum
        source: input
        description: Officer/holder role used by the officer-status branch of the control test
        constraints: "CEO | CFO | COO | CCO | DIRECTOR | ENTITY_HOLDER | PASSIVE_INVESTOR"
      - name: direct_ownership_bps
        type: integer
        source: input
        description: Ownership basis points held directly in the immediate parent link (licensee if parent_control_person_id is null)
        constraints: "0..10000"
      - name: effective_ownership_bps
        type: integer
        source: computed
        description: "MULTIPLICATIVE variant output of calculations.control_person_ownership_attribution"
      - name: attributed_ownership_bps
        type: integer
        source: computed
        description: "ATTRIBUTION variant output of calculations.control_person_ownership_attribution"
      - name: control_determination
        type: enum
        source: computed
        description: CONTROL when attributed_ownership_bps >= 2500 or role_title is an officer title, else NON_CONTROL
        constraints: "CONTROL | NON_CONTROL"
      - name: background_check_status
        type: enum
        source: computed
        description: Background-check lifecycle; NOT_REQUIRED unless control_determination == CONTROL
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | PENDING | CLEARED | ADVERSE"
      - name: disqualifying_finding
        type: boolean
        source: computed
        description: Set true when a background-check adjudication returns ADVERSE with a statutory disqualifier
        default: false
      - name: change_of_control_status
        type: enum
        source: computed
        description: Change-of-control approval lifecycle for this holder
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | PENDING_APPROVAL | APPROVED | DENIED"
      - name: approving_jurisdiction_ids
        type: array
        source: system
        description: Array of Jurisdiction.id values that have recorded an APPROVED change-of-control decision for this holder
        default: []
      - name: required_approval_count
        type: integer
        source: computed
        description: Count of licensee StateLicense rows with license_status == ACTIVE at the moment this holder was created
        default: 0
      - name: status
        type: enum
        source: computed
        description: Row lifecycle; REMOVED rows are excluded from every control-chain aggregate
        default: PROPOSED
        constraints: "PROPOSED | SEATED | REMOVED"

  - name: LicenseApplication
    parent: Licensee
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: FK -> Licensee.id; applicant
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; state the application is filed with
      - name: license_class
        type: enum
        source: input
        description: Product class applied for; drives the bond class multiplier
        constraints: "MONEY_TRANSMISSION | PAYMENT_INSTRUMENTS | VIRTUAL_CURRENCY"
      - name: projected_annual_volume_cents
        type: integer
        source: input
        description: Projected annual transmission volume used for bond volume tiering
        constraints: ">= 0"
      - name: new_product_narrative
        type: string
        source: input
        description: Expansion / new-product analysis text submitted with the application
      - name: status
        type: enum
        source: computed
        description: Application lifecycle
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | DEFICIENT | APPROVED | DENIED | WITHDRAWN"
      - name: required_bond_cents
        type: integer
        source: computed
        description: "Output of calculations.surety_bond_requirement at submission time"
        default: 0
      - name: required_net_worth_cents
        type: integer
        source: computed
        description: Copy of Jurisdiction.min_net_worth_cents pinned at submission time
        default: 0
      - name: deficiency_round_count
        type: integer
        source: computed
        description: Number of ISSUE_DEFICIENCY review actions recorded so far
        default: 0
      - name: deficiency_deadline_at
        type: datetime
        source: computed
        description: Logical-clock instant by which a resubmission must arrive; null unless status == DEFICIENT
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the first submit
        default: null
      - name: decision_at
        type: datetime
        source: system
        description: Logical-clock instant of APPROVED / DENIED
        default: null
      - name: denial_reason
        type: enum
        source: computed
        description: Reason recorded when status becomes DENIED
        default: null
        constraints: "REGULATOR_DENIAL | EXCESSIVE_DEFICIENCY_ROUNDS"

  - name: StateLicense
    parent: Licensee
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: FK -> Licensee.id; holder of the license
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; issuing state
      - name: application_id
        type: string
        source: input
        description: FK -> LicenseApplication.id; the approved application that produced this license
      - name: license_number
        type: string
        source: system
        description: "Server-minted human license number, format MT-<state_code>-<6-digit sequence starting at 000001 per jurisdiction>"
      - name: license_class
        type: enum
        source: computed
        description: Copied from the approved application
        constraints: "MONEY_TRANSMISSION | PAYMENT_INSTRUMENTS | VIRTUAL_CURRENCY"
      - name: license_status
        type: enum
        source: computed
        description: Authorisation dimension of the license (independent of reporting_status)
        default: PENDING_BOND
        constraints: "PENDING_BOND | ACTIVE | SUSPENDED | SURRENDER_REQUESTED | SURRENDERED | REVOKED"
      - name: reporting_status
        type: enum
        source: computed
        description: Reporting-calendar dimension of the license (independent of license_status)
        default: CURRENT
        constraints: "CURRENT | DELINQUENT | DEFICIENT_FILING"
      - name: expansion_gate
        type: enum
        source: computed
        description: Gate on delegate activation and new-product expansion; BLOCKED whenever the licensee posture or an exam finding blocks growth
        default: BLOCKED
        constraints: "OPEN | BLOCKED"
      - name: annual_volume_cents
        type: integer
        source: computed
        description: Sum of CallReport.transmission_volume_cents over reports filed for this license
        default: 0
      - name: outstanding_obligations_cents
        type: integer
        source: computed
        description: Outstanding money transmission obligations owed to customers in this state
        default: 0
      - name: active_delegate_count
        type: integer
        source: computed
        description: Count of DelegateAuthorization rows for this license with status == ACTIVE
        default: 0
      - name: bond_requirement_cents
        type: integer
        source: computed
        description: "Output of calculations.surety_bond_requirement recomputed on every delegate-count or volume change"
        default: 0
      - name: bond_posted_cents
        type: integer
        source: computed
        description: Face amount of the surety bond currently on file
        default: 0
      - name: bond_status
        type: enum
        source: computed
        description: Surety bond lifecycle for this license
        default: NONE
        constraints: "NONE | POSTED | CANCELLATION_NOTICED | CANCELLED"
      - name: bond_issuer
        type: string
        source: input
        description: Surety company that issued the posted bond
        default: null
      - name: bond_cancellation_effective_date
        type: datetime
        source: input
        description: Effective date carried by a filed bond cancellation notice
        default: null
      - name: renewal_year
        type: integer
        source: computed
        description: Calendar year of the most recently completed renewal
        default: null
      - name: renewal_status
        type: enum
        source: computed
        description: Renewal cycle state for the current renewal_year
        default: NOT_RENEWED
        constraints: "NOT_RENEWED | RENEWED"
      - name: renewal_total_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.renewal_fee_assessment for the most recent renewal"
        default: 0
      - name: exam_findings_open
        type: boolean
        source: computed
        description: True while an issued examination report with findings has not been remediated
        default: false
      - name: authorized_at
        type: datetime
        source: system
        description: Logical-clock instant license_status first became ACTIVE
        default: null

  - name: Delegate
    parent: Licensee
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: FK -> Licensee.id; principal that appoints this delegate
      - name: legal_name
        type: string
        source: input
        description: Legal name of the agent / authorized delegate
      - name: delegate_type
        type: enum
        source: input
        description: Statutory classification of the appointment
        constraints: "AGENT | AUTHORIZED_DELEGATE"
      - name: status
        type: enum
        source: computed
        description: Delegate lifecycle
        default: ONBOARDING
        constraints: "ONBOARDING | ACTIVE | SUSPENDED | TERMINATED"
      - name: oversight_score
        type: integer
        source: computed
        description: "Output of calculations.delegate_oversight_score from the most recent oversight review; null until the first review"
        default: null
      - name: last_oversight_review_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent oversight review
        default: null
      - name: authorized_state_count
        type: integer
        source: computed
        description: Count of DelegateAuthorization rows for this delegate with status == ACTIVE
        default: 0
      - name: oversight_hold
        type: boolean
        source: computed
        description: True when every authorization of this delegate has been suspended by a posture or license cascade
        default: false

  - name: DelegateAuthorization
    parent: Delegate
    common_fields: true
    fields:
      - name: delegate_id
        type: string
        source: input
        description: FK -> Delegate.id; the appointed delegate
      - name: state_license_id
        type: string
        source: input
        description: FK -> StateLicense.id; the license under which the delegate transmits
      - name: effective_date
        type: datetime
        source: input
        description: First day of the authorization period (closed interval start)
      - name: expiry_date
        type: datetime
        source: input
        description: Last day of the authorization period (closed interval end)
        constraints: ">= effective_date"
      - name: monthly_volume_cap_cents
        type: integer
        source: input
        description: Contractual monthly transmission cap imposed on the delegate
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: Authorization lifecycle
        default: PENDING_OVERSIGHT
        constraints: "PENDING_OVERSIGHT | ACTIVE | SUSPENDED_BY_POSTURE | SUSPENDED | TERMINATED"
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant status first became ACTIVE
        default: null
      - name: oversight_score_at_activation
        type: integer
        source: computed
        description: Delegate.oversight_score pinned at activation time
        default: null

  - name: InvestmentHolding
    parent: Licensee
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: FK -> Licensee.id; owner of the asset
      - name: asset_class
        type: enum
        source: input
        description: Statutory asset class; drives haircut, eligibility and concentration treatment
        constraints: "CASH | US_TREASURY | AGENCY_BOND | MONEY_MARKET_FUND | RECEIVABLE_FROM_DELEGATE | CORPORATE_DEBT"
      - name: counterparty_name
        type: string
        source: input
        description: Obligor / custodian name used to group the concentration cap
      - name: book_value_cents
        type: integer
        source: input
        description: Carrying value used by the BOOK_VALUE coverage variant
        constraints: ">= 0"
      - name: market_value_cents
        type: integer
        source: input
        description: Fair value used by the ELIGIBLE_MARKET coverage variant
        constraints: ">= 0"
      - name: age_days
        type: integer
        source: input
        description: Age of a receivable in days; ignored for non-receivable asset classes
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: Holding lifecycle; only HELD rows enter any coverage calculation
        default: HELD
        constraints: "HELD | DISPOSED"

  - name: PermissibleInvestmentTest
    parent: Licensee
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: FK -> Licensee.id; subject of the periodic test
      - name: coverage_period_start
        type: datetime
        source: input
        description: First day of the tested coverage period (closed interval start)
      - name: coverage_period_end
        type: datetime
        source: input
        description: Last day of the tested coverage period (closed interval end)
        constraints: "> coverage_period_start"
      - name: method
        type: enum
        source: input
        description: Which variant of calculations.permissible_investment_coverage this filing uses
        constraints: "BOOK_VALUE | ELIGIBLE_MARKET"
      - name: status
        type: enum
        source: computed
        description: Test lifecycle
        default: DRAFT
        constraints: "DRAFT | PREPARED | CERTIFIED | SUPERSEDED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID that ran the prepare step
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID that ran the certify step; segregation of duties forbids equality with prepared_by_user_id
        default: null
      - name: obligations_cents
        type: integer
        source: computed
        description: Snapshot of Licensee.aggregate_outstanding_obligations_cents at prepare time
        default: 0
      - name: investment_value_cents
        type: integer
        source: computed
        description: Permissible investment value under this row's method, snapshotted at prepare time
        default: 0
      - name: coverage_ratio_bps
        type: integer
        source: computed
        description: "floor(investment_value_cents * 10000 / obligations_cents), or 10000 when obligations_cents == 0"
        default: 0
      - name: shortfall_cents
        type: integer
        source: computed
        description: "max(0, obligations_cents - investment_value_cents)"
        default: 0
      - name: result
        type: enum
        source: computed
        description: PASS when coverage_ratio_bps >= 10000, else SHORTFALL; null until PREPARED
        default: null
        constraints: "PASS | SHORTFALL"
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification
        default: null

  - name: MultistateExam
    parent: Licensee
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: FK -> Licensee.id; examined money services business
      - name: lead_jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; lead state coordinating the examination
      - name: participating_jurisdiction_ids
        type: array
        source: input
        description: Array of Jurisdiction.id values joining the coordinated exam; each must have participates_in_multistate true and an ACTIVE StateLicense for the licensee
      - name: fieldwork_start
        type: datetime
        source: input
        description: Half-open field window start (inclusive)
      - name: fieldwork_end
        type: datetime
        source: input
        description: Half-open field window end (exclusive)
        constraints: "> fieldwork_start"
      - name: status
        type: enum
        source: computed
        description: Examination lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | FIELDWORK | REPORT_DRAFT | REPORT_ISSUED | CLOSED"
      - name: participating_state_count
        type: integer
        source: computed
        description: Length of participating_jurisdiction_ids including the lead jurisdiction
        default: 0
      - name: open_request_count
        type: integer
        source: computed
        description: Count of InformationRequest rows for this exam with status IN {OPEN, OVERDUE, RESPONDED}
        default: 0
      - name: findings_count
        type: integer
        source: computed
        description: Number of examination findings recorded when the report was issued
        default: 0

  - name: InformationRequest
    parent: MultistateExam
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: input
        description: FK -> MultistateExam.id; examination the request belongs to
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; requesting participating state
      - name: subject
        type: string
        source: input
        description: Short description of the requested records
      - name: requested_item_count
        type: integer
        source: input
        description: Number of record items demanded
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: Request lifecycle
        default: OPEN
        constraints: "OPEN | RESPONDED | OVERDUE | ACCEPTED"
      - name: due_at
        type: datetime
        source: computed
        description: "Output of calculations.information_request_due_at, recomputed on each REJECTED re-open"
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times a REJECTED disposition sent this request back to OPEN
        default: 0
      - name: submitted_item_count
        type: integer
        source: input
        description: Items delivered by the most recent response
        default: 0
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent response
        default: null

  - name: CallReport
    parent: StateLicense
    common_fields: true
    fields:
      - name: state_license_id
        type: string
        source: input
        description: FK -> StateLicense.id; license the report covers
      - name: period_label
        type: string
        source: input
        description: "Reporting period key, format <YYYY>Q<1-4> for QUARTERLY jurisdictions or <YYYY>FY for ANNUAL; unique per state_license_id"
        constraints: "unique per state_license_id"
      - name: period_end
        type: datetime
        source: computed
        description: Last day of period_label (Q1 03-31, Q2 06-30, Q3 09-30, Q4 12-31, FY 12-31)
      - name: due_at
        type: datetime
        source: computed
        description: "period_end + 45 days at 00:00:00Z"
      - name: transmission_volume_cents
        type: integer
        source: input
        description: Money transmitted during the period
        constraints: ">= 0"
      - name: transaction_count
        type: integer
        source: input
        description: Number of transmission transactions during the period
        constraints: ">= 0"
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant of filing
      - name: status
        type: enum
        source: computed
        description: Filing quality outcome
        constraints: "FILED | LATE | FILED_DEFICIENT"
      - name: assessment_fee_cents
        type: integer
        source: computed
        description: "round_half_up(transmission_volume_cents * Jurisdiction.assessment_rate_bps / 10000) in cents for this single report"
        default: 0

  - name: EnforcementAction
    parent: StateLicense
    common_fields: true
    fields:
      - name: state_license_id
        type: string
        source: input
        description: FK -> StateLicense.id; license subject to the action
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; issuing regulator, must equal the license's jurisdiction_id
      - name: originating_exam_id
        type: string
        source: input
        description: "FK -> MultistateExam.id; examination that produced the finding, null for a stand-alone action"
        default: null
      - name: basis
        type: enum
        source: input
        description: Statutory basis of the action
        constraints: "PERMISSIBLE_INVESTMENT_SHORTFALL | BOND_LAPSE | DELINQUENT_REPORTING | UNAUTHORIZED_DELEGATE | EXAM_FINDING"
      - name: penalty_cents
        type: integer
        source: input
        description: Civil money penalty assessed
        constraints: ">= 0"
      - name: remediation_deadline_at
        type: datetime
        source: input
        description: Deadline for the licensee's remediation under a consent order
      - name: status
        type: enum
        source: computed
        description: Enforcement lifecycle; branches at the licensee response
        default: ISSUED
        constraints: "ISSUED | CONSENT_ORDER | CONTESTED | RESOLVED | REVOCATION"
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant the action was issued
      - name: response_at
        type: datetime
        source: system
        description: Logical-clock instant of the licensee response
        default: null
      - name: remediation_plan_narrative
        type: string
        source: input
        description: Remediation plan text supplied with a CONSENT_ORDER response
        default: null
      - name: remediation_accepted
        type: boolean
        source: computed
        description: Whether the regulator accepted the remediation at resolution
        default: false
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of RESOLVED / REVOCATION
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- CYCLIC: deficiency loop with a bounded round count -------------------
  - entity: LicenseApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /license-applications/{id}/submit"
        actor: LicensingManager
        preconditions:
          - "application.status == DRAFT"
          - "Licensee.coverage_posture != FROZEN"
          - "no other LicenseApplication for the same (licensee_id, jurisdiction_id) with status IN {SUBMITTED, UNDER_REVIEW, DEFICIENT, APPROVED}"
        side_effects:
          - "required_bond_cents = calculations.surety_bond_requirement using jurisdiction config, projected_annual_volume_cents, license_class and active_delegate_count 0"
          - "required_net_worth_cents = Jurisdiction.min_net_worth_cents"
          - "submitted_at = current logical clock"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /license-applications/{id}/review-actions with action START_REVIEW"
        actor: StateRegulator
        preconditions:
          - "application.status == SUBMITTED"
          - "X-User-ID == application.jurisdiction_id"
        side_effects: ["updated_at refreshed"]
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /license-applications/{id}/review-actions with action ISSUE_DEFICIENCY"
        actor: StateRegulator
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "X-User-ID == application.jurisdiction_id"
          - "deficiency_round_count < 3"
        side_effects:
          - "deficiency_round_count += 1"
          - "deficiency_deadline_at = current logical clock + 30 days"
        note: "Cycle edge 1 of 2 — an application may bounce between UNDER_REVIEW and DEFICIENT up to 3 times."
      - from: DEFICIENT
        to: UNDER_REVIEW
        trigger: "POST /license-applications/{id}/resubmit"
        actor: LicensingManager
        preconditions:
          - "application.status == DEFICIENT"
          - "current logical clock <= deficiency_deadline_at"
        side_effects:
          - "deficiency_deadline_at = null"
          - "required_bond_cents recomputed from the resubmitted projected_annual_volume_cents"
        note: "Cycle edge 2 of 2."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /license-applications/{id}/review-actions with action ISSUE_DEFICIENCY when deficiency_round_count == 3"
        actor: StateRegulator
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "X-User-ID == application.jurisdiction_id"
          - "deficiency_round_count == 3"
        side_effects:
          - "denial_reason = EXCESSIVE_DEFICIENCY_ROUNDS"
          - "decision_at = current logical clock"
          - "deficiency_deadline_at = null"
        note: "Auto-transition: the 4th deficiency is a denial, not another loop."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /license-applications/{id}/review-actions with action DENY"
        actor: StateRegulator
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "X-User-ID == application.jurisdiction_id"
        side_effects:
          - "denial_reason = REGULATOR_DENIAL"
          - "decision_at = current logical clock"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /license-applications/{id}/review-actions with action APPROVE"
        actor: StateRegulator
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "X-User-ID == application.jurisdiction_id"
          - "Licensee.reported_tangible_net_worth_cents >= application.required_net_worth_cents"
          - "every ControlPerson of the licensee with control_determination == CONTROL and status != REMOVED has background_check_status == CLEARED (i.e. Licensee.control_chain_status == VERIFIED)"
          - "Licensee.coverage_posture != FROZEN"
        side_effects:
          - "decision_at = current logical clock"
          - "creates StateLicense with license_status PENDING_BOND, reporting_status CURRENT, expansion_gate BLOCKED, bond_status NONE, license_class copied, bond_requirement_cents = application.required_bond_cents, outstanding_obligations_cents 0, license_number minted MT-<state_code>-<6-digit per-jurisdiction sequence>"
        note: "The created license is discoverable only through GET /state-licenses?application_id=<id>."
      - from: DEFICIENT
        to: WITHDRAWN
        trigger: "POST /license-applications/{id}/review-actions with action WITHDRAW"
        actor: LicensingManager
        preconditions: ["application.status == DEFICIENT"]
        side_effects: ["deficiency_deadline_at = null", "decision_at = current logical clock"]

  # ---- PARALLEL DIMENSION 1 of 2 on StateLicense ---------------------------
  - entity: StateLicense
    dimension: license_status
    initial_state: PENDING_BOND
    terminal_states: [SURRENDERED, REVOKED]
    transitions:
      - from: PENDING_BOND
        to: ACTIVE
        trigger: "POST /state-licenses/{id}/bond"
        actor: LicensingManager
        preconditions:
          - "license.license_status == PENDING_BOND"
          - "amount_cents >= license.bond_requirement_cents"
        side_effects:
          - "bond_posted_cents = amount_cents; bond_status = POSTED; bond_issuer stored"
          - "authorized_at = current logical clock"
          - "expansion_gate = OPEN when Licensee.coverage_posture IN {COMPLIANT, WATCH}, else stays BLOCKED"
          - "Licensee.active_license_count += 1"
          - "Licensee.aggregate_outstanding_obligations_cents recomputed (calculations.licensee_obligation_aggregate)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /state-licenses/{id}/bond-cancellation-notice"
        actor: LicensingManager
        preconditions:
          - "license.license_status == ACTIVE"
          - "license.bond_status == POSTED"
        side_effects:
          - "HOP 1: bond_status = CANCELLATION_NOTICED; bond_cancellation_effective_date stored; license_status = SUSPENDED; expansion_gate = BLOCKED; Licensee.active_license_count -= 1"
          - "HOP 2 (caused by license_status becoming SUSPENDED): every DelegateAuthorization of this license with status == ACTIVE moves to SUSPENDED; license.active_delegate_count = 0; bond_requirement_cents recomputed with 0 delegates"
          - "HOP 3 (caused by each authorization suspension): the authorization's Delegate.authorized_state_count -= 1 and, when it reaches 0, Delegate.status = SUSPENDED and Delegate.oversight_hold = true"
        note: "Cascade B (depth 3) — trigger distinct from Cascade A (test certification)."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /enforcement-actions/{id}/responses with response CONSENT_ORDER"
        actor: LicensingManager
        preconditions:
          - "enforcement.status == ISSUED"
          - "license.license_status == ACTIVE"
        side_effects:
          - "license_status = SUSPENDED; expansion_gate = BLOCKED; Licensee.active_license_count -= 1"
          - "every DelegateAuthorization of this license with status == ACTIVE moves to SUSPENDED; active_delegate_count = 0; bond_requirement_cents recomputed"
          - "each affected Delegate.authorized_state_count -= 1; Delegate.status = SUSPENDED when the count reaches 0"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /enforcement-actions/{id}/resolutions with outcome RESOLVED and remediation_accepted true"
        actor: StateRegulator
        preconditions:
          - "enforcement.status == CONSENT_ORDER"
          - "X-User-ID == enforcement.jurisdiction_id"
          - "license.license_status == SUSPENDED"
          - "license.bond_status == POSTED"
        side_effects:
          - "license_status = ACTIVE; Licensee.active_license_count += 1"
          - "expansion_gate = OPEN when Licensee.coverage_posture IN {COMPLIANT, WATCH} and exam_findings_open == false"
          - "exam_findings_open = false"
        note: "Compensating transition for the CONSENT_ORDER suspension; suspended authorizations are NOT auto-reactivated."
      - from: ACTIVE
        to: SURRENDER_REQUESTED
        trigger: "POST /state-licenses/{id}/surrender-requests"
        actor: LicensingManager
        preconditions:
          - "license.license_status IN {ACTIVE, SUSPENDED}"
          - "expected_state_license_version == license.version"
          - "license.outstanding_obligations_cents == 0"
          - "no DelegateAuthorization of this license has status == ACTIVE"
        side_effects:
          - "license_status = SURRENDER_REQUESTED; expansion_gate = BLOCKED; version += 1"
          - "Licensee.active_license_count -= 1 when the prior status was ACTIVE"
      - from: SUSPENDED
        to: SURRENDER_REQUESTED
        trigger: "POST /state-licenses/{id}/surrender-requests"
        actor: LicensingManager
        preconditions:
          - "license.license_status == SUSPENDED"
          - "expected_state_license_version == license.version"
          - "license.outstanding_obligations_cents == 0"
          - "no DelegateAuthorization of this license has status == ACTIVE"
        side_effects: ["license_status = SURRENDER_REQUESTED; version += 1"]
      - from: SURRENDER_REQUESTED
        to: SURRENDERED
        trigger: "POST /state-licenses/{id}/surrender-decisions with decision APPROVED"
        actor: StateRegulator
        preconditions:
          - "license.license_status == SURRENDER_REQUESTED"
          - "X-User-ID == license.jurisdiction_id"
        side_effects:
          - "license_status = SURRENDERED (terminal); bond_status = CANCELLED"
          - "Licensee.aggregate_outstanding_obligations_cents recomputed excluding this license; Licensee.coverage_ratio_bps and coverage_posture recomputed"
      - from: SURRENDER_REQUESTED
        to: ACTIVE
        trigger: "POST /state-licenses/{id}/surrender-decisions with decision DENIED"
        actor: StateRegulator
        preconditions:
          - "license.license_status == SURRENDER_REQUESTED"
          - "X-User-ID == license.jurisdiction_id"
          - "license.bond_status == POSTED"
        side_effects:
          - "license_status = ACTIVE; Licensee.active_license_count += 1"
          - "expansion_gate = OPEN when Licensee.coverage_posture IN {COMPLIANT, WATCH}"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /enforcement-actions/{id}/resolutions with outcome REVOCATION"
        actor: StateRegulator
        preconditions:
          - "enforcement.status IN {CONSENT_ORDER, CONTESTED}"
          - "X-User-ID == enforcement.jurisdiction_id"
          - "license.license_status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "HOP 1: license_status = REVOKED (terminal); expansion_gate = BLOCKED; bond_status = CANCELLED; Licensee.active_license_count -= 1 when the prior status was ACTIVE"
          - "HOP 2 (caused by revocation): every DelegateAuthorization of this license with status IN {PENDING_OVERSIGHT, ACTIVE, SUSPENDED_BY_POSTURE, SUSPENDED} moves to TERMINATED; active_delegate_count = 0"
          - "HOP 3 (caused by each termination): Delegate.authorized_state_count -= 1 for previously ACTIVE authorizations; Delegate.status = TERMINATED when the delegate has no remaining non-TERMINATED authorization"
          - "HOP 4 (caused by the license leaving the aggregate set): Licensee.aggregate_outstanding_obligations_cents recomputed excluding the revoked license; Licensee.coverage_ratio_bps and coverage_posture recomputed"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /enforcement-actions/{id}/resolutions with outcome REVOCATION"
        actor: StateRegulator
        preconditions:
          - "enforcement.status IN {CONSENT_ORDER, CONTESTED}"
          - "X-User-ID == enforcement.jurisdiction_id"
        side_effects: ["same four hops as the ACTIVE -> REVOKED edge, without the active_license_count decrement"]

  # ---- PARALLEL DIMENSION 2 of 2 on StateLicense ---------------------------
  - entity: StateLicense
    dimension: reporting_status
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /call-reports filed after CallReport.due_at"
        actor: LicensingManager
        preconditions:
          - "license.license_status NOT IN {SURRENDERED, REVOKED}"
          - "current logical clock > due_at for period_label"
        side_effects:
          - "CallReport.status = LATE"
          - "license.reporting_status = DELINQUENT"
          - "license.annual_volume_cents += transmission_volume_cents; bond_requirement_cents recomputed from the new volume"
        note: "Independent of license_status: a SUSPENDED license still files and still flips this dimension."
      - from: CURRENT
        to: DEFICIENT_FILING
        trigger: "POST /call-reports with transaction_count == 0 and transmission_volume_cents > 0"
        actor: LicensingManager
        preconditions: ["license.license_status NOT IN {SURRENDERED, REVOKED}"]
        side_effects:
          - "CallReport.status = FILED_DEFICIENT"
          - "license.reporting_status = DEFICIENT_FILING"
          - "license.annual_volume_cents += transmission_volume_cents"
        note: "Zero-count / non-zero-volume boundary: an internally inconsistent filing is accepted but flagged."
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /call-reports filed on or before due_at for a later period_label"
        actor: LicensingManager
        preconditions:
          - "current logical clock <= due_at for the new period_label"
          - "no other CallReport of this license has status == LATE for a period_label greater than the filed one"
        side_effects: ["CallReport.status = FILED", "license.reporting_status = CURRENT"]
      - from: DEFICIENT_FILING
        to: CURRENT
        trigger: "POST /call-reports with transaction_count > 0 filed on or before due_at"
        actor: LicensingManager
        preconditions: ["current logical clock <= due_at for the filed period_label"]
        side_effects: ["CallReport.status = FILED", "license.reporting_status = CURRENT"]

  # ---- Delegate onboarding + oversight ------------------------------------
  - entity: Delegate
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /delegate-authorizations/{id}/activate (first successful activation for the delegate)"
        actor: LicensingManager
        preconditions: ["delegate.status == ONBOARDING", "the activating authorization passes every precondition of DelegateAuthorization PENDING_OVERSIGHT -> ACTIVE"]
        side_effects: ["delegate.status = ACTIVE", "authorized_state_count += 1", "oversight_hold = false"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: last ACTIVE authorization of the delegate is suspended by a bond-cancellation, consent-order or posture cascade"
        actor: system
        preconditions: ["delegate.authorized_state_count reaches 0 through a cascade suspension"]
        side_effects: ["delegate.status = SUSPENDED", "oversight_hold = true"]
      - from: ONBOARDING
        to: SUSPENDED
        trigger: "system: every PENDING_OVERSIGHT authorization of the delegate is moved to SUSPENDED_BY_POSTURE by a posture cascade"
        actor: system
        preconditions: ["delegate has no ACTIVE authorization and at least one authorization moved to SUSPENDED_BY_POSTURE"]
        side_effects: ["delegate.status = SUSPENDED", "oversight_hold = true"]
        note: "HOP 4 of Cascade A."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /delegate-authorizations/{id}/activate on a SUSPENDED_BY_POSTURE authorization once the posture clears"
        actor: LicensingManager
        preconditions: ["delegate.status == SUSPENDED", "authorization.status == SUSPENDED_BY_POSTURE", "license.expansion_gate == OPEN"]
        side_effects: ["delegate.status = ACTIVE", "oversight_hold = false", "authorized_state_count += 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: license revocation terminates the delegate's last non-TERMINATED authorization"
        actor: system
        preconditions: ["no remaining authorization with status != TERMINATED"]
        side_effects: ["delegate.status = TERMINATED (terminal)", "authorized_state_count = 0"]

  - entity: DelegateAuthorization
    initial_state: PENDING_OVERSIGHT
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_OVERSIGHT
        to: ACTIVE
        trigger: "POST /delegate-authorizations/{id}/activate"
        actor: LicensingManager
        preconditions:
          - "authorization.status IN {PENDING_OVERSIGHT, SUSPENDED_BY_POSTURE}"
          - "StateLicense.license_status == ACTIVE"
          - "StateLicense.expansion_gate == OPEN"
          - "Delegate.oversight_score != null and Delegate.oversight_score >= 70"
          - "Delegate.licensee_id == StateLicense.licensee_id"
        side_effects:
          - "status = ACTIVE; activated_at = current logical clock; oversight_score_at_activation = Delegate.oversight_score"
          - "StateLicense.active_delegate_count += 1"
          - "StateLicense.bond_requirement_cents recomputed (calculations.surety_bond_requirement) with the new delegate count"
          - "Delegate.authorized_state_count += 1; Delegate.status = ACTIVE"
      - from: SUSPENDED_BY_POSTURE
        to: ACTIVE
        trigger: "POST /delegate-authorizations/{id}/activate"
        actor: LicensingManager
        preconditions: ["StateLicense.expansion_gate == OPEN", "StateLicense.license_status == ACTIVE", "Delegate.oversight_score >= 70"]
        side_effects: ["same as the PENDING_OVERSIGHT -> ACTIVE edge"]
      - from: PENDING_OVERSIGHT
        to: SUSPENDED_BY_POSTURE
        trigger: "system: StateLicense.expansion_gate flips to BLOCKED by a licensee posture cascade or an issued exam report"
        actor: system
        preconditions: ["authorization.status == PENDING_OVERSIGHT"]
        side_effects:
          - "status = SUSPENDED_BY_POSTURE"
          - "Delegate.status = SUSPENDED and Delegate.oversight_hold = true when the delegate has no ACTIVE authorization"
        note: "HOP 3 of Cascade A."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: license suspension from a bond cancellation notice or a consent order"
        actor: system
        preconditions: ["authorization.status == ACTIVE"]
        side_effects:
          - "status = SUSPENDED"
          - "StateLicense.active_delegate_count -= 1; bond_requirement_cents recomputed"
          - "Delegate.authorized_state_count -= 1; Delegate.status = SUSPENDED when the count reaches 0"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /delegate-authorizations/{id}/terminate"
        actor: LicensingManager
        preconditions: ["authorization.status IN {PENDING_OVERSIGHT, ACTIVE, SUSPENDED_BY_POSTURE, SUSPENDED}"]
        side_effects:
          - "status = TERMINATED (terminal)"
          - "StateLicense.active_delegate_count -= 1 when the prior status was ACTIVE"
          - "StateLicense.bond_requirement_cents recomputed with the reduced delegate count"
          - "Delegate.authorized_state_count -= 1 when the prior status was ACTIVE; Delegate.status = TERMINATED when no non-TERMINATED authorization remains"
        note: "Compensating action for activation — restores active_delegate_count, authorized_state_count and bond_requirement_cents exactly."
      - from: PENDING_OVERSIGHT
        to: TERMINATED
        trigger: "POST /delegate-authorizations/{id}/terminate"
        actor: LicensingManager
        preconditions: ["authorization.status == PENDING_OVERSIGHT"]
        side_effects: ["status = TERMINATED; no counter changes because the row was never ACTIVE"]

  # ---- Permissible investment testing (supersede + SoD certification) ------
  - entity: PermissibleInvestmentTest
    initial_state: DRAFT
    terminal_states: [CERTIFIED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /permissible-investment-tests/{id}/prepare"
        actor: ComplianceOfficer
        preconditions:
          - "test.status == DRAFT"
        side_effects:
          - "obligations_cents = Licensee.aggregate_outstanding_obligations_cents snapshot"
          - "investment_value_cents = calculations.permissible_investment_coverage under test.method"
          - "coverage_ratio_bps, shortfall_cents, result computed"
          - "prepared_by_user_id = X-User-ID"
      - from: PREPARED
        to: CERTIFIED
        trigger: "POST /permissible-investment-tests/{id}/certify"
        actor: ChiefComplianceOfficer
        preconditions:
          - "test.status == PREPARED"
          - "X-User-ID != test.prepared_by_user_id (segregation of duties)"
          - "current logical clock <= coverage_period_end + 45 days"
        side_effects:
          - "HOP 1: status = CERTIFIED; certified_at = current logical clock; certified_by_user_id = X-User-ID; Licensee.consecutive_failed_test_count = previous + 1 when result == SHORTFALL, else 0; Licensee.coverage_posture recomputed (calculations.licensee_coverage_posture)"
          - "HOP 2 (caused by coverage_posture becoming DEFICIENT or FROZEN): every StateLicense of the licensee with license_status == ACTIVE gets expansion_gate = BLOCKED"
          - "HOP 3 (caused by expansion_gate flipping to BLOCKED): every DelegateAuthorization of those licenses with status == PENDING_OVERSIGHT moves to SUSPENDED_BY_POSTURE"
          - "HOP 4 (caused by each authorization suspension): each affected Delegate with zero ACTIVE authorizations gets status = SUSPENDED and oversight_hold = true"
        note: "Cascade A (depth 4)."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /permissible-investment-tests (a later test row is created for the same licensee)"
        actor: system
        preconditions: ["test.status IN {DRAFT, PREPARED}"]
        side_effects: ["status = SUPERSEDED (terminal)", "Licensee.version += 1 from the create that superseded it"]
      - from: PREPARED
        to: SUPERSEDED
        trigger: "POST /permissible-investment-tests (a later test row is created for the same licensee)"
        actor: system
        preconditions: ["test.status == PREPARED"]
        side_effects: ["status = SUPERSEDED (terminal)"]

  # ---- Coordinated examination (compound close) ----------------------------
  - entity: MultistateExam
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: FIELDWORK
        trigger: "POST /multistate-exams/{id}/status-changes with to_status FIELDWORK"
        actor: StateRegulator
        preconditions:
          - "exam.status == SCHEDULED"
          - "X-User-ID == exam.lead_jurisdiction_id"
        side_effects: ["updated_at refreshed"]
      - from: FIELDWORK
        to: REPORT_DRAFT
        trigger: "POST /multistate-exams/{id}/status-changes with to_status REPORT_DRAFT"
        actor: StateRegulator
        preconditions:
          - "exam.status == FIELDWORK"
          - "X-User-ID == exam.lead_jurisdiction_id"
          - "exam.open_request_count == 0 (no InformationRequest with status IN {OPEN, OVERDUE, RESPONDED})"
        side_effects: ["updated_at refreshed"]
      - from: REPORT_DRAFT
        to: REPORT_ISSUED
        trigger: "POST /multistate-exams/{id}/status-changes with to_status REPORT_ISSUED and findings_count"
        actor: StateRegulator
        preconditions:
          - "exam.status == REPORT_DRAFT"
          - "X-User-ID == exam.lead_jurisdiction_id"
        side_effects:
          - "findings_count stored"
          - "when findings_count >= 3: every StateLicense of the licensee whose jurisdiction_id is in participating_jurisdiction_ids gets exam_findings_open = true and expansion_gate = BLOCKED"
          - "when findings_count >= 3: every DelegateAuthorization of those licenses with status == PENDING_OVERSIGHT moves to SUSPENDED_BY_POSTURE"
          - "when findings_count < 3: no license is touched"
      - from: REPORT_ISSUED
        to: CLOSED
        trigger: "POST /multistate-exams/{id}/status-changes with to_status CLOSED"
        actor: StateRegulator
        preconditions:
          - "exam.status == REPORT_ISSUED"
          - "X-User-ID == exam.lead_jurisdiction_id"
          - "no EnforcementAction with originating_exam_id == exam.id has status IN {ISSUED, CONTESTED, CONSENT_ORDER}"
        side_effects: ["status = CLOSED (terminal)"]

  # ---- Information request (cyclic re-open on rejection) -------------------
  - entity: InformationRequest
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /information-requests/{id}/response"
        actor: LicensingManager
        preconditions:
          - "request.status == OPEN"
          - "MultistateExam.status == FIELDWORK"
          - "current logical clock <= request.due_at"
          - "submitted_item_count >= request.requested_item_count"
        side_effects:
          - "status = RESPONDED; responded_at = current logical clock; submitted_item_count stored"
          - "MultistateExam.open_request_count unchanged (RESPONDED still counts as open)"
      - from: OPEN
        to: OVERDUE
        trigger: "POST /information-requests/{id}/disposition with decision REJECTED while current logical clock > due_at"
        actor: StateRegulator
        preconditions: ["request.status == OPEN", "X-User-ID == request.jurisdiction_id", "current logical clock > request.due_at"]
        side_effects: ["status = OVERDUE"]
      - from: RESPONDED
        to: ACCEPTED
        trigger: "POST /information-requests/{id}/disposition with decision ACCEPTED"
        actor: StateRegulator
        preconditions: ["request.status == RESPONDED", "X-User-ID == request.jurisdiction_id"]
        side_effects: ["status = ACCEPTED (terminal)", "MultistateExam.open_request_count -= 1"]
      - from: RESPONDED
        to: OPEN
        trigger: "POST /information-requests/{id}/disposition with decision REJECTED"
        actor: StateRegulator
        preconditions: ["request.status == RESPONDED", "X-User-ID == request.jurisdiction_id"]
        side_effects:
          - "status = OPEN; reopen_count += 1; submitted_item_count = 0"
          - "due_at = current logical clock + 5 days (calculations.information_request_due_at reopen branch)"
        note: "Cycle edge — a rejected response reopens the request with a short clock."
      - from: OVERDUE
        to: RESPONDED
        trigger: "POST /information-requests/{id}/response after an OVERDUE flag when the lead extends the exam"
        actor: LicensingManager
        preconditions: ["request.status == OVERDUE", "MultistateExam.status == FIELDWORK", "current logical clock <= request.due_at"]
        side_effects: ["status = RESPONDED; responded_at = current logical clock"]

  # ---- BRANCHING with divergent side-effect sets ---------------------------
  - entity: EnforcementAction
    initial_state: ISSUED
    terminal_states: [RESOLVED, REVOCATION]
    transitions:
      - from: ISSUED
        to: CONSENT_ORDER
        trigger: "POST /enforcement-actions/{id}/responses with response CONSENT_ORDER"
        actor: LicensingManager
        preconditions:
          - "enforcement.status == ISSUED"
          - "current logical clock <= issued_at + 20 days"
          - "remediation_plan_narrative present and non-empty"
        side_effects:
          - "status = CONSENT_ORDER; response_at = current logical clock; remediation_plan_narrative stored"
          - "BRANCH-SPECIFIC: StateLicense ACTIVE -> SUSPENDED with the delegate-suspension cascade described in the StateLicense license_status machine"
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /enforcement-actions/{id}/responses with response CONTEST"
        actor: LicensingManager
        preconditions:
          - "enforcement.status == ISSUED"
          - "current logical clock <= issued_at + 20 days"
        side_effects:
          - "status = CONTESTED; response_at = current logical clock"
          - "BRANCH-SPECIFIC: the license is NOT suspended, no delegate authorization is touched, expansion_gate is unchanged"
      - from: CONSENT_ORDER
        to: RESOLVED
        trigger: "POST /enforcement-actions/{id}/resolutions with outcome RESOLVED"
        actor: StateRegulator
        preconditions:
          - "enforcement.status == CONSENT_ORDER"
          - "X-User-ID == enforcement.jurisdiction_id"
          - "remediation_accepted == true in the request body"
          - "current logical clock <= enforcement.remediation_deadline_at"
        side_effects:
          - "status = RESOLVED (terminal); resolved_at = current logical clock; remediation_accepted = true"
          - "StateLicense SUSPENDED -> ACTIVE (compensating), exam_findings_open = false"
      - from: CONTESTED
        to: RESOLVED
        trigger: "POST /enforcement-actions/{id}/resolutions with outcome RESOLVED"
        actor: StateRegulator
        preconditions: ["enforcement.status == CONTESTED", "X-User-ID == enforcement.jurisdiction_id"]
        side_effects:
          - "status = RESOLVED (terminal); resolved_at = current logical clock"
          - "BRANCH-SPECIFIC: no license transition (the license was never suspended by this action)"
      - from: CONSENT_ORDER
        to: REVOCATION
        trigger: "POST /enforcement-actions/{id}/resolutions with outcome REVOCATION"
        actor: StateRegulator
        preconditions: ["enforcement.status == CONSENT_ORDER", "X-User-ID == enforcement.jurisdiction_id"]
        side_effects: ["status = REVOCATION (terminal)", "StateLicense -> REVOKED with the four-hop revocation cascade"]
      - from: CONTESTED
        to: REVOCATION
        trigger: "POST /enforcement-actions/{id}/resolutions with outcome REVOCATION"
        actor: StateRegulator
        preconditions: ["enforcement.status == CONTESTED", "X-User-ID == enforcement.jurisdiction_id"]
        side_effects: ["status = REVOCATION (terminal)", "StateLicense -> REVOKED with the four-hop revocation cascade"]

  # ---- Control person / change of control (compound approval) --------------
  - entity: ControlPerson
    initial_state: PROPOSED
    terminal_states: [REMOVED]
    transitions:
      - from: PROPOSED
        to: SEATED
        trigger: "system: change_of_control_status becomes APPROVED (or NOT_REQUIRED) and background_check_status becomes CLEARED (or NOT_REQUIRED)"
        actor: system
        preconditions:
          - "control_person.status == PROPOSED"
          - "background_check_status IN {NOT_REQUIRED, CLEARED}"
          - "change_of_control_status IN {NOT_REQUIRED, APPROVED}"
        side_effects:
          - "status = SEATED"
          - "Licensee.control_chain_status recomputed: BLOCKED if any non-REMOVED CONTROL row has background_check_status == ADVERSE, else PENDING_CHECKS if any is PENDING, else VERIFIED"
      - from: PROPOSED
        to: REMOVED
        trigger: "POST /control-persons/{id}/background-check-adjudication with outcome ADVERSE and disqualifying_finding true"
        actor: StateRegulator
        preconditions: ["control_person.background_check_status == PENDING", "X-User-ID is a Jurisdiction id where the licensee holds a StateLicense with license_status == ACTIVE"]
        side_effects:
          - "background_check_status = ADVERSE; disqualifying_finding = true; status = REMOVED (terminal)"
          - "Licensee.control_chain_status = BLOCKED"
          - "every child ControlPerson row whose parent_control_person_id == this id has effective_ownership_bps and attributed_ownership_bps recomputed to 0 and status = REMOVED"
      - from: PROPOSED
        to: PROPOSED
        trigger: "POST /control-persons/{id}/change-of-control-decisions with decision APPROVED from a jurisdiction not yet in approving_jurisdiction_ids"
        actor: StateRegulator
        preconditions:
          - "control_person.change_of_control_status == PENDING_APPROVAL"
          - "X-User-ID is a Jurisdiction id where the licensee holds a StateLicense with license_status == ACTIVE"
          - "X-User-ID NOT IN approving_jurisdiction_ids"
        side_effects:
          - "X-User-ID appended to approving_jurisdiction_ids"
          - "when len(approving_jurisdiction_ids) >= required_approval_count: change_of_control_status = APPROVED (compound bubble-up)"
        note: "Self-loop until the approval quorum is reached."
      - from: PROPOSED
        to: REMOVED
        trigger: "POST /control-persons/{id}/change-of-control-decisions with decision DENIED"
        actor: StateRegulator
        preconditions: ["control_person.change_of_control_status == PENDING_APPROVAL", "X-User-ID is a Jurisdiction id where the licensee holds an ACTIVE StateLicense"]
        side_effects: ["change_of_control_status = DENIED", "status = REMOVED (terminal)", "Licensee.control_chain_status recomputed"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — nothing else)
# =============================================================================
concurrency_rules:
  - rule_id: pi-test-create-stale-licensee
    parent_entity: Licensee
    write_endpoint: "POST /permissible-investment-tests"
    occ_field: "expected_licensee_version"
    description: |
      Creating a PermissibleInvestmentTest against a Licensee whose version has advanced since the
      client last read it is rejected. A new test row legitimately supersedes any prior DRAFT or
      PREPARED test for that licensee, so a writer holding a stale licensee view would silently
      discard work it never observed.
    error_id: ERR_STALE_LICENSEE_VERSION
    http_status: 412
  - rule_id: surrender-request-stale-license
    parent_entity: StateLicense
    write_endpoint: "POST /state-licenses/{id}/surrender-requests"
    occ_field: "expected_state_license_version"
    description: |
      Filing a surrender request against a StateLicense whose version has advanced since the client
      last read it is rejected. Obligation adjustments, delegate activations and bond events all bump
      the license version, and each of them changes whether surrender is admissible, so a stale view
      must not be allowed to move the license into SURRENDER_REQUESTED.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: licensee_obligation_aggregate
    trigger: "PATCH /state-licenses/{id}/obligations; POST /state-licenses/{id}/bond (license enters the aggregate set); StateLicense -> SURRENDERED; StateLicense -> REVOKED"
    algorithm: aggregation
    formula: |
      Licensee.aggregate_outstanding_obligations_cents =
        sum(L.outstanding_obligations_cents
            for L in StateLicense where L.licensee_id == licensee.id
            and L.license_status IN {PENDING_BOND, ACTIVE, SUSPENDED, SURRENDER_REQUESTED})
      # SURRENDERED and REVOKED licenses leave the set; their obligations are no longer covered.
    input_set: "StateLicense rows of the licensee with license_status IN {PENDING_BOND, ACTIVE, SUSPENDED, SURRENDER_REQUESTED}; no time window; order-insensitive sum so no tie-break is required"
    constants: {}
    precision: "integer cents, exact"

  - name: permissible_investment_coverage
    trigger: "POST /permissible-investment-tests/{id}/prepare; GET /licensees/{id}/coverage-summary; recomputed on POST /investment-holdings, POST /investment-holdings/{id}/dispose, PATCH /state-licenses/{id}/obligations, and on every transition that changes licensee_obligation_aggregate"
    algorithm: waterfall_allocation
    formula: |
      OBLIGATIONS = Licensee.aggregate_outstanding_obligations_cents
      CANDIDATES  = InvestmentHolding rows where licensee_id == licensee.id
                    and status == HELD
                    and asset_class NOT IN NON_PERMISSIBLE_CLASSES
      # --- variant BOOK_VALUE -------------------------------------------------
      book_investment_value_cents = sum(h.book_value_cents for h in CANDIDATES)
      # no haircut, no receivable ageing test, no concentration cap
      # --- variant ELIGIBLE_MARKET -------------------------------------------
      CAP = floor(OBLIGATIONS * CONCENTRATION_CAP_BPS / 10000)
      uncapped_total = 0
      groups = {}                              # counterparty_name -> running cents
      for h in CANDIDATES:                     # per-holding step, order-insensitive
          if h.asset_class == RECEIVABLE_FROM_DELEGATE and h.age_days > RECEIVABLE_MAX_AGE_DAYS:
              continue                         # aged receivable is not permissible
          adjusted = floor(h.market_value_cents * (10000 - HAIRCUT_BPS[h.asset_class]) / 10000)
          if h.asset_class in CONCENTRATION_CAPPED_CLASSES:
              groups[h.counterparty_name] += adjusted
          else:
              uncapped_total += adjusted
      eligible_investment_value_cents = uncapped_total + sum(min(g, CAP) for g in groups.values())
      # EVALUATION ORDER IS PINNED: per-holding haircut (floor) -> per-counterparty
      # grouping -> per-group cap -> single final sum. Capping before the haircut, or
      # summing before capping, yields a different number and is wrong.
      # --- ratio (both variants share this shape) ----------------------------
      ratio_bps(value) = 10000 if OBLIGATIONS == 0 else floor(value * 10000 / OBLIGATIONS)
    input_set: "InvestmentHolding rows of the licensee with status == HELD and asset_class != CORPORATE_DEBT; DISPOSED rows and CORPORATE_DEBT rows are excluded from both variants"
    constants:
      NON_PERMISSIBLE_CLASSES: [CORPORATE_DEBT]
      HAIRCUT_BPS: { CASH: 0, US_TREASURY: 200, AGENCY_BOND: 500, MONEY_MARKET_FUND: 300, RECEIVABLE_FROM_DELEGATE: 1000 }
      RECEIVABLE_MAX_AGE_DAYS: 5
      CONCENTRATION_CAP_BPS: 1000
      CONCENTRATION_CAPPED_CLASSES: [AGENCY_BOND, MONEY_MARKET_FUND, RECEIVABLE_FROM_DELEGATE]
    precision: "integer cents; every division floors (round-down) at the step where it appears"
    variants:
      - name: BOOK_VALUE
        when: "PermissibleInvestmentTest.method == BOOK_VALUE, and the book_* fields of GET /licensees/{id}/coverage-summary"
        difference: "Carrying value with no haircut, no receivable ageing exclusion and no counterparty concentration cap — systematically >= ELIGIBLE_MARKET for the same holdings."
      - name: ELIGIBLE_MARKET
        when: "PermissibleInvestmentTest.method == ELIGIBLE_MARKET, and always for Licensee.eligible_investment_value_cents / coverage_ratio_bps / coverage_posture"
        difference: "Fair value, per-class haircut, receivables older than 5 days excluded outright, and each capped-class counterparty limited to 10% of outstanding obligations."

  - name: licensee_coverage_posture
    trigger: "every recomputation of permissible_investment_coverage, and POST /permissible-investment-tests/{id}/certify"
    algorithm: threshold
    formula: |
      if Licensee.consecutive_failed_test_count >= FROZEN_FAILED_TEST_COUNT: posture = FROZEN
      elif coverage_ratio_bps >= COVERAGE_PASS_BPS:                          posture = COMPLIANT
      elif coverage_ratio_bps >= COVERAGE_WATCH_FLOOR_BPS:                   posture = WATCH
      else:                                                                  posture = DEFICIENT
      # coverage_ratio_bps is always the ELIGIBLE_MARKET ratio (never BOOK_VALUE).
      # Boundary: exactly 10000 is COMPLIANT; 9999 is WATCH; exactly 9500 is WATCH; 9499 is DEFICIENT.
    input_set: "Licensee.coverage_ratio_bps (ELIGIBLE_MARKET) and Licensee.consecutive_failed_test_count"
    constants:
      COVERAGE_PASS_BPS: 10000
      COVERAGE_WATCH_FLOOR_BPS: 9500
      FROZEN_FAILED_TEST_COUNT: 2
    precision: "integer basis points"

  - name: control_person_ownership_attribution
    trigger: "POST /control-persons; recomputed for descendant rows when a ControlPerson is REMOVED by an adverse adjudication"
    algorithm: constraint_propagation
    formula: |
      # Walk the parent_control_person_id chain from the row to the root (max depth 5).
      # MULTIPLICATIVE variant -> effective_ownership_bps
      if row.parent_control_person_id is null:
          effective = row.direct_ownership_bps
      else:
          effective = floor(row.direct_ownership_bps * parent.effective_ownership_bps / 10000)
      # ATTRIBUTION variant -> attributed_ownership_bps
      if row.parent_control_person_id is null:
          attributed = row.direct_ownership_bps
      elif parent.direct_ownership_bps >= CONTROL_THRESHOLD_BPS:
          attributed = row.direct_ownership_bps            # controlling link attributed at 100%
      else:
          attributed = floor(row.direct_ownership_bps * parent.attributed_ownership_bps / 10000)
      # control test and background-check requirement
      control_determination = CONTROL if (attributed >= CONTROL_THRESHOLD_BPS
                                          or role_title IN OFFICER_TITLES) else NON_CONTROL
      background_check_status = PENDING if control_determination == CONTROL else NOT_REQUIRED
      change_of_control_status = PENDING_APPROVAL if (control_determination == CONTROL
                                   and Licensee.active_license_count > 0) else NOT_REQUIRED
      required_approval_count = Licensee.active_license_count at creation time
      # Boundary: attributed exactly 2500 is CONTROL; 2499 is NON_CONTROL.
    input_set: "The row plus its ancestor chain of ControlPerson rows with status != REMOVED; a REMOVED ancestor contributes 0 to both variants"
    constants:
      CONTROL_THRESHOLD_BPS: 2500
      OFFICER_TITLES: [CEO, CFO, COO, CCO]
      MAX_CHAIN_DEPTH: 5
    precision: "integer basis points, floor at each chain hop"
    variants:
      - name: MULTIPLICATIVE
        when: "always computed into effective_ownership_bps; reported to regulators as economic ownership"
        difference: "Chain percentages multiply, so a 40% holder of a 60% holdco reads 2400 bps and would fall below the control threshold."
      - name: ATTRIBUTION
        when: "always computed into attributed_ownership_bps; this is the variant the control test and the background-check requirement use"
        difference: "Any intermediate link of at least 2500 bps is attributed at 100%, so the same holder reads 4000 bps and IS a control person."

  - name: surety_bond_requirement
    trigger: "POST /license-applications/{id}/submit; POST /license-applications/{id}/resubmit; DelegateAuthorization activation/termination/suspension; POST /call-reports (volume change)"
    algorithm: tiered_pricing
    formula: |
      volume = LicenseApplication.projected_annual_volume_cents (application context)
               or StateLicense.annual_volume_cents (license context)
      tier_bond = 2500000  if volume <= 100000000
                  10000000 if 100000000 < volume <= 1000000000
                  25000000 if volume > 1000000000
      raw      = max(jurisdiction.base_bond_cents,
                     tier_bond + delegate_count * jurisdiction.per_delegate_bond_cents)
      adjusted = floor(raw * CLASS_MULTIPLIER_BPS[license_class] / 10000)
      bond     = min(adjusted, jurisdiction.bond_cap_cents)
      # delegate_count = 0 in application context, StateLicense.active_delegate_count otherwise.
      # Order pinned: tier lookup -> max against the statutory floor -> class multiplier -> cap.
    input_set: "One Jurisdiction config row, one volume figure, one license_class, one delegate count"
    constants:
      VOLUME_TIER_1_MAX_CENTS: 100000000
      VOLUME_TIER_2_MAX_CENTS: 1000000000
      TIER_BOND_CENTS: [2500000, 10000000, 25000000]
      CLASS_MULTIPLIER_BPS: { MONEY_TRANSMISSION: 10000, PAYMENT_INSTRUMENTS: 12000, VIRTUAL_CURRENCY: 15000 }
    precision: "integer cents, floor on the multiplier step"

  - name: renewal_fee_assessment
    trigger: "POST /state-licenses/{id}/renewals"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents   = jurisdiction.renewal_fee_cents
                         + license.active_delegate_count * DELEGATE_RENEWAL_FEE_CENTS
      tier_bps         = 500 if subtotal_cents <= 100000
                         350 if 100000 < subtotal_cents <= 250000
                         200 if subtotal_cents > 250000
      assessment_cents = round_half_up(subtotal_cents * tier_bps / 10000)
      renewal_total_fee_cents = subtotal_cents + assessment_cents
      # EVALUATION ORDER IS PINNED AND NON-NEGOTIABLE: the tier is selected from the
      # PRE-ASSESSMENT subtotal, never from renewal_total_fee_cents. The dependency looks
      # circular (the tier keys off a total-like figure that itself contains the assessment);
      # pinning the order makes the value well-defined and single-pass.
    input_set: "One Jurisdiction renewal_fee_cents plus the license's current active_delegate_count"
    constants:
      DELEGATE_RENEWAL_FEE_CENTS: 25000
      TIER_1_MAX_CENTS: 100000
      TIER_2_MAX_CENTS: 250000
      TIER_BPS: [500, 350, 200]
    precision: "integer cents, round_half_up on the assessment step only"

  - name: aggregate_assessment_invoice
    trigger: "GET /licensees/{id}/assessment-summary"
    algorithm: aggregation
    formula: |
      LINES = StateLicense rows of the licensee with license_status == ACTIVE,
              ordered by created_at ASC (order affects nothing but is pinned for reproducibility)
      per_line_raw_cents(L)     = L.outstanding_obligations_cents * jurisdiction(L).assessment_rate_bps / 10000
      per_line_rounded_cents(L) = round_half_up(per_line_raw_cents(L) / 100) * 100      # whole dollars
      annual_assessment_total_cents = sum(per_line_rounded_cents(L) for L in LINES)
      unrounded_sum_cents           = sum(per_line_raw_cents(L) for L in LINES)          # reported for audit
      line_item_count               = count(LINES)
      # ROUNDING ORDER IS PINNED: round EACH line to whole dollars first, THEN sum.
      # Sum-then-round is a different number (e.g. 15060 + 10060 raw cents -> 25200 per-line
      # vs 25100 sum-then-round) and is wrong.
    input_set: "StateLicense rows with license_status == ACTIVE only; PENDING_BOND / SUSPENDED / SURRENDER_REQUESTED / SURRENDERED / REVOKED licenses contribute no line"
    constants:
      DOLLAR_CENTS: 100
    precision: "each line rounded to whole dollars with round_half_up, then summed; unrounded_sum_cents keeps exact cents"

  - name: delegate_oversight_score
    trigger: "POST /delegates/{id}/oversight-reviews"
    algorithm: weighted_scoring
    formula: |
      oversight_score = floor((training_score * 4000
                               + aml_test_score * 3500
                               + recordkeeping_score * 2500) / 10000)
      # Each component is 0..100. Boundary: a score of exactly 70 satisfies the activation gate.
    input_set: "The three component scores of the single most recent oversight review; earlier reviews are ignored entirely"
    constants:
      WEIGHT_TRAINING_BPS: 4000
      WEIGHT_AML_TEST_BPS: 3500
      WEIGHT_RECORDKEEPING_BPS: 2500
      OVERSIGHT_MIN_SCORE: 70
    precision: "integer score, floor"

  - name: information_request_due_at
    trigger: "POST /information-requests; POST /information-requests/{id}/disposition with decision REJECTED"
    algorithm: interval_merge
    formula: |
      on create:  due_at = current_logical_clock + jurisdiction.response_window_days days
      on reopen:  due_at = current_logical_clock + REOPEN_WINDOW_DAYS days
      # A response is timely when current_logical_clock <= due_at (inclusive boundary).
    input_set: "The requesting Jurisdiction's response_window_days and the logical clock at the moment of the call"
    constants:
      REOPEN_WINDOW_DAYS: 5
    precision: "millisecond-exact ISO 8601 UTC arithmetic; day arithmetic adds exact 24h multiples"

  - name: call_report_period_and_due_at
    trigger: "POST /call-reports"
    algorithm: threshold
    formula: |
      period_end = 03-31 for <YYYY>Q1, 06-30 for Q2, 09-30 for Q3, 12-31 for Q4 or <YYYY>FY
                   at 00:00:00.000Z of the labelled year
      due_at     = period_end + CALL_REPORT_DUE_DAYS days at 00:00:00.000Z
      status     = LATE            if current_logical_clock > due_at
                   FILED_DEFICIENT if transaction_count == 0 and transmission_volume_cents > 0
                   FILED           otherwise
      # LATE is evaluated before the deficiency test: a filing that is both late and internally
      # inconsistent is LATE and drives reporting_status = DELINQUENT.
      assessment_fee_cents = round_half_up(transmission_volume_cents
                                           * jurisdiction.assessment_rate_bps / 10000)
    input_set: "The single filed report plus its license's Jurisdiction config and the logical clock"
    constants:
      CALL_REPORT_DUE_DAYS: 45
    precision: "integer cents, round_half_up on the assessment fee"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present, and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 30
    category: business_constraint
    check: "request body shape: required fields present, enums within their declared sets, money and count fields integers >= 0, ISO 8601 datetimes well formed, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 40
    category: existence
    check: "path and body Licensee references resolve"
    error_id: ERR_LICENSEE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying licensee_id"
  - priority: 41
    category: existence
    check: "Jurisdiction references resolve (validated left-to-right after Licensee)"
    error_id: ERR_JURISDICTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /license-applications, POST /multistate-exams, POST /information-requests, POST /enforcement-actions"
  - priority: 42
    category: existence
    check: "ControlPerson path id and parent_control_person_id resolve"
    error_id: ERR_CONTROL_PERSON_NOT_FOUND
    http_status: 404
    applies_to: "POST /control-persons, GET /control-persons/{id}, POST /control-persons/{id}/*"
  - priority: 43
    category: existence
    check: "LicenseApplication path id resolves"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "/license-applications/{id}/*"
  - priority: 44
    category: existence
    check: "StateLicense path or body id resolves"
    error_id: ERR_LICENSE_NOT_FOUND
    http_status: 404
    applies_to: "/state-licenses/{id}/*, POST /call-reports, POST /delegate-authorizations, POST /enforcement-actions"
  - priority: 45
    category: existence
    check: "Delegate path or body id resolves"
    error_id: ERR_DELEGATE_NOT_FOUND
    http_status: 404
    applies_to: "/delegates/{id}/*, POST /delegate-authorizations"
  - priority: 46
    category: existence
    check: "DelegateAuthorization path id resolves"
    error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    applies_to: "/delegate-authorizations/{id}/*"
  - priority: 47
    category: existence
    check: "InvestmentHolding path id resolves"
    error_id: ERR_HOLDING_NOT_FOUND
    http_status: 404
    applies_to: "/investment-holdings/{id}/dispose"
  - priority: 48
    category: existence
    check: "PermissibleInvestmentTest path id resolves"
    error_id: ERR_TEST_NOT_FOUND
    http_status: 404
    applies_to: "/permissible-investment-tests/{id}/*"
  - priority: 49
    category: existence
    check: "MultistateExam path or body id resolves"
    error_id: ERR_EXAM_NOT_FOUND
    http_status: 404
    applies_to: "/multistate-exams/{id}/*, POST /information-requests, POST /enforcement-actions with originating_exam_id"
  - priority: 50
    category: existence
    check: "InformationRequest path id resolves"
    error_id: ERR_INFO_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "/information-requests/{id}/*"
  - priority: 51
    category: existence
    check: "EnforcementAction path id resolves"
    error_id: ERR_ENFORCEMENT_NOT_FOUND
    http_status: 404
    applies_to: "/enforcement-actions/{id}/*"
  - priority: 55
    category: auth
    check: "entity-backed scope: a StateRegulator's X-User-ID equals the jurisdiction_id of record on the target resource (application, license, exam lead, information request, enforcement action) or, for control-person actions, is a Jurisdiction where the licensee holds an ACTIVE StateLicense or has a LicenseApplication in a non-terminal status; a DelegateOperator's X-User-ID equals the target Delegate.id"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "all StateRegulator and DelegateOperator write endpoints"
  - priority: 57
    category: state
    check: "expected_licensee_version equals Licensee.version"
    error_id: ERR_STALE_LICENSEE_VERSION
    http_status: 412
    applies_to: "POST /permissible-investment-tests"
  - priority: 58
    category: state
    check: "expected_state_license_version equals StateLicense.version"
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412
    applies_to: "POST /state-licenses/{id}/surrender-requests"
  - priority: 60
    category: state
    check: "LicenseApplication.status admits the requested action (submit from DRAFT, review actions from SUBMITTED/UNDER_REVIEW, resubmit from DEFICIENT, withdraw from DEFICIENT)"
    error_id: ERR_APPLICATION_INVALID_STATE
    http_status: 409
    applies_to: "/license-applications/{id}/*"
  - priority: 61
    category: state
    check: "StateLicense.license_status admits the operation (bond from PENDING_BOND; cancellation notice, renewal, delegate authorization, obligations adjustment and surrender request from ACTIVE or SUSPENDED as declared per transition)"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "/state-licenses/{id}/*, POST /delegate-authorizations, POST /delegate-authorizations/{id}/activate"
  - priority: 62
    category: state
    check: "StateLicense.license_status NOT IN {SURRENDERED, REVOKED} for any further filing or mutation"
    error_id: ERR_LICENSE_TERMINAL
    http_status: 409
    applies_to: "POST /call-reports, /state-licenses/{id}/*, POST /enforcement-actions"
  - priority: 63
    category: state
    check: "PermissibleInvestmentTest.status admits the operation (prepare from DRAFT, certify from PREPARED)"
    error_id: ERR_TEST_INVALID_STATE
    http_status: 409
    applies_to: "/permissible-investment-tests/{id}/*"
  - priority: 64
    category: state
    check: "DelegateAuthorization.status admits the operation (activate from PENDING_OVERSIGHT or SUSPENDED_BY_POSTURE; terminate from any non-TERMINATED status)"
    error_id: ERR_AUTHORIZATION_INVALID_STATE
    http_status: 409
    applies_to: "/delegate-authorizations/{id}/*"
  - priority: 65
    category: state
    check: "MultistateExam.status admits the requested to_status per the declared edges, and exam.status == FIELDWORK for information-request creation and response"
    error_id: ERR_EXAM_INVALID_STATE
    http_status: 409
    applies_to: "/multistate-exams/{id}/status-changes, POST /information-requests, POST /information-requests/{id}/response"
  - priority: 66
    category: state
    check: "InformationRequest.status admits the operation (response from OPEN or OVERDUE, disposition from OPEN or RESPONDED)"
    error_id: ERR_INFO_REQUEST_INVALID_STATE
    http_status: 409
    applies_to: "/information-requests/{id}/*"
  - priority: 67
    category: state
    check: "EnforcementAction.status admits the operation (responses from ISSUED, resolutions from CONSENT_ORDER or CONTESTED)"
    error_id: ERR_ENFORCEMENT_INVALID_STATE
    http_status: 409
    applies_to: "/enforcement-actions/{id}/*"
  - priority: 68
    category: state
    check: "ControlPerson.status == PROPOSED and the requested adjudication/decision matches the row's pending sub-state"
    error_id: ERR_CONTROL_PERSON_INVALID_STATE
    http_status: 409
    applies_to: "/control-persons/{id}/*"
  - priority: 70
    category: business_safety
    check: "segregation of duties: the certifying X-User-ID differs from PermissibleInvestmentTest.prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /permissible-investment-tests/{id}/certify"
  - priority: 71
    category: business_safety
    check: "every non-REMOVED ControlPerson of the licensee with control_determination == CONTROL has background_check_status == CLEARED"
    error_id: ERR_BACKGROUND_CHECK_INCOMPLETE
    http_status: 409
    applies_to: "POST /license-applications/{id}/review-actions with action APPROVE"
  - priority: 72
    category: business_safety
    check: "Licensee.control_chain_status != BLOCKED"
    error_id: ERR_CONTROL_CHAIN_BLOCKED
    http_status: 409
    applies_to: "POST /license-applications/{id}/submit, POST /license-applications/{id}/review-actions with action APPROVE, POST /state-licenses/{id}/renewals"
  - priority: 73
    category: business_safety
    check: "Licensee.coverage_posture != FROZEN"
    error_id: ERR_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /license-applications/{id}/submit, POST /license-applications/{id}/review-actions with action APPROVE, POST /delegate-authorizations"
  - priority: 74
    category: business_safety
    check: "StateLicense.expansion_gate == OPEN"
    error_id: ERR_EXPANSION_GATE_BLOCKED
    http_status: 409
    applies_to: "POST /delegate-authorizations/{id}/activate"
  - priority: 75
    category: business_safety
    check: "Delegate.oversight_score is not null and >= 70"
    error_id: ERR_OVERSIGHT_SCORE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /delegate-authorizations/{id}/activate"
  - priority: 76
    category: business_safety
    check: "a CONSENT_ORDER response carries a non-empty remediation_plan_narrative"
    error_id: ERR_REMEDIATION_PLAN_REQUIRED
    http_status: 422
    applies_to: "POST /enforcement-actions/{id}/responses"
  - priority: 80
    category: business_referential
    check: "cross-aggregate references stay inside one Licensee: Delegate.licensee_id == StateLicense.licensee_id for an authorization; InvestmentHolding.licensee_id == test.licensee_id; ControlPerson.parent_control_person_id belongs to the same licensee"
    error_id: ERR_CROSS_LICENSEE_REFERENCE
    http_status: 422
    applies_to: "POST /delegate-authorizations, POST /control-persons"
  - priority: 81
    category: business_referential
    check: "EnforcementAction.jurisdiction_id equals the target license's jurisdiction_id"
    error_id: ERR_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /enforcement-actions"
  - priority: 82
    category: business_referential
    check: "InformationRequest.jurisdiction_id is the exam's lead_jurisdiction_id or appears in participating_jurisdiction_ids"
    error_id: ERR_JURISDICTION_NOT_PARTICIPATING
    http_status: 422
    applies_to: "POST /information-requests"
  - priority: 83
    category: business_referential
    check: "every id in participating_jurisdiction_ids has participates_in_multistate == true and an ACTIVE StateLicense for the examined licensee"
    error_id: ERR_JURISDICTION_NOT_MULTISTATE
    http_status: 422
    applies_to: "POST /multistate-exams"
  - priority: 84
    category: business_referential
    check: "the deciding jurisdiction has not already recorded a change-of-control decision for this control person"
    error_id: ERR_DUPLICATE_APPROVAL
    http_status: 409
    applies_to: "POST /control-persons/{id}/change-of-control-decisions"
  - priority: 90
    category: business_temporal
    check: "no other MultistateExam of the same licensee has a fieldwork window within 30 days of the requested half-open [fieldwork_start, fieldwork_end) window; formally reject when new.fieldwork_start < existing.fieldwork_end + 30d AND existing.fieldwork_start < new.fieldwork_end + 30d"
    error_id: ERR_EXAM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /multistate-exams"
  - priority: 91
    category: business_temporal
    check: "no other non-TERMINATED DelegateAuthorization of the same Delegate under a license of the SAME jurisdiction has an overlapping closed interval; formally reject when new.effective_date <= existing.expiry_date AND existing.effective_date <= new.expiry_date (touching endpoints collide; a one-day gap is required)"
    error_id: ERR_DELEGATE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /delegate-authorizations"
  - priority: 92
    category: business_temporal
    check: "current logical clock <= coverage_period_end + 45 days"
    error_id: ERR_CERTIFICATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /permissible-investment-tests/{id}/certify"
  - priority: 93
    category: business_temporal
    check: "current logical clock <= InformationRequest.due_at (inclusive)"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /information-requests/{id}/response"
  - priority: 94
    category: business_temporal
    check: "current logical clock <= LicenseApplication.deficiency_deadline_at (inclusive)"
    error_id: ERR_DEFICIENCY_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /license-applications/{id}/resubmit"
  - priority: 95
    category: business_temporal
    check: "current logical clock <= EnforcementAction.issued_at + 20 days"
    error_id: ERR_ENFORCEMENT_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /enforcement-actions/{id}/responses"
  - priority: 96
    category: business_temporal
    check: "current logical clock <= EnforcementAction.remediation_deadline_at for a RESOLVED outcome out of CONSENT_ORDER"
    error_id: ERR_REMEDIATION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /enforcement-actions/{id}/resolutions"
  - priority: 97
    category: business_temporal
    check: "bond_cancellation_effective_date >= current logical clock + 30 days"
    error_id: ERR_BOND_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /state-licenses/{id}/bond-cancellation-notice"
  - priority: 100
    category: business_constraint
    check: "no other LicenseApplication for the same (licensee_id, jurisdiction_id) with status IN {SUBMITTED, UNDER_REVIEW, DEFICIENT, APPROVED}"
    error_id: ERR_DUPLICATE_LICENSE_APPLICATION
    http_status: 409
    applies_to: "POST /license-applications/{id}/submit"
  - priority: 101
    category: business_constraint
    check: "Licensee.ein is unique"
    error_id: ERR_DUPLICATE_EIN
    http_status: 409
    applies_to: "POST /licensees"
  - priority: 102
    category: business_constraint
    check: "Jurisdiction.state_code is unique"
    error_id: ERR_DUPLICATE_STATE_CODE
    http_status: 409
    applies_to: "POST /jurisdictions"
  - priority: 103
    category: business_constraint
    check: "CallReport.period_label is unique per state_license_id, and the label form matches the jurisdiction's call_report_frequency"
    error_id: ERR_DUPLICATE_CALL_REPORT
    http_status: 409
    applies_to: "POST /call-reports"
  - priority: 104
    category: business_constraint
    check: "submitted_item_count >= InformationRequest.requested_item_count"
    error_id: ERR_RESPONSE_INCOMPLETE
    http_status: 422
    applies_to: "POST /information-requests/{id}/response"
  - priority: 105
    category: business_constraint
    check: "no DelegateAuthorization of the license has status == ACTIVE"
    error_id: ERR_ACTIVE_DELEGATES_REMAIN
    http_status: 409
    applies_to: "POST /state-licenses/{id}/surrender-requests"
  - priority: 106
    category: business_constraint
    check: "the parent_control_person_id chain is acyclic, does not point at the row itself, and is at most 5 links deep"
    error_id: ERR_CONTROL_CHAIN_CYCLE
    http_status: 422
    applies_to: "POST /control-persons"
  - priority: 107
    category: business_constraint
    check: "StateLicense.reporting_status == CURRENT"
    error_id: ERR_REPORTING_NOT_CURRENT
    http_status: 409
    applies_to: "POST /state-licenses/{id}/renewals"
  - priority: 110
    category: business_fiscal
    check: "Licensee.reported_tangible_net_worth_cents >= Jurisdiction.min_net_worth_cents"
    error_id: ERR_NET_WORTH_INSUFFICIENT
    http_status: 422
    applies_to: "POST /license-applications/{id}/review-actions with action APPROVE, POST /state-licenses/{id}/renewals"
  - priority: 111
    category: business_fiscal
    check: "amount_cents >= StateLicense.bond_requirement_cents"
    error_id: ERR_BOND_INSUFFICIENT
    http_status: 422
    applies_to: "POST /state-licenses/{id}/bond"
  - priority: 112
    category: business_fiscal
    check: "StateLicense.outstanding_obligations_cents == 0"
    error_id: ERR_OUTSTANDING_OBLIGATIONS_REMAIN
    http_status: 409
    applies_to: "POST /state-licenses/{id}/surrender-requests"
  - priority: 113
    category: business_fiscal
    check: "payment_amount_cents equals the renewal_fee_assessment output for this license"
    error_id: ERR_RENEWAL_FEE_MISMATCH
    http_status: 422
    applies_to: "POST /state-licenses/{id}/renewals"
  - priority: 114
    category: business_fiscal
    check: "outstanding_obligations_cents + delta_cents >= 0"
    error_id: ERR_NEGATIVE_OBLIGATIONS
    http_status: 422
    applies_to: "PATCH /state-licenses/{id}/obligations"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving / system ------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [PlatformAdmin]
    input: [to_iso8601]
    output: { current_utc: string }
    status: 200
    side_effects:
      - "Sets the server's logical clock, which every deadline, window and *_at stamp reads. The clock defaults to 2026-08-01T00:00:00Z at process start and never advances on its own; only this endpoint moves it."
      - "Moving the clock past an InformationRequest.due_at does not itself flip the request to OVERDUE; the flip happens on the next disposition call."
    description: "Test-driving endpoint (§1.5 priority ladder step 3): temporal rules — response windows, certification windows, deficiency deadlines, bond-cancellation notice periods, call-report lateness and enforcement response windows — are otherwise unreachable."
  - method: POST
    path: /jurisdictions
    roles: [PlatformAdmin]
    input: [state_code, name, min_net_worth_cents, base_bond_cents, per_delegate_bond_cents, bond_cap_cents, response_window_days, renewal_fee_cents, assessment_rate_bps, call_report_frequency, "participates_in_multistate?"]
    output: Jurisdiction
    status: 201
    side_effects:
      - "Jurisdiction is immutable (common_fields false): no version field, no update endpoint, and every downstream calculation reads the config as posted."

  # --- licensee -------------------------------------------------------------
  - method: POST
    path: /licensees
    roles: [LicensingManager]
    input: [legal_name, ein, "reported_tangible_net_worth_cents?", "net_worth_statement_date?"]
    output: Licensee
    status: 201
    side_effects:
      - "version starts at 1; coverage_posture COMPLIANT; coverage_ratio_bps 10000 (vacuous, no obligations); control_chain_status VERIFIED; all counters 0."
  - method: GET
    path: /licensees/{id}
    roles: [LicensingManager, ComplianceOfficer, ChiefComplianceOfficer, StateRegulator]
    input: []
    output: Licensee
    status: 200
    side_effects: []
  - method: PATCH
    path: /licensees/{id}/financials
    roles: [LicensingManager]
    input: [reported_tangible_net_worth_cents, net_worth_statement_date]
    output: Licensee
    status: 200
    side_effects:
      - "Bumps Licensee.version (relevant to the pi-test-create-stale-licensee OCC rule)."
  - method: GET
    path: /licensees/{id}/coverage-summary
    roles: [LicensingManager, ComplianceOfficer, ChiefComplianceOfficer, StateRegulator]
    input: []
    output: { obligations_cents: integer, book_investment_value_cents: integer, book_coverage_ratio_bps: integer, eligible_investment_value_cents: integer, coverage_ratio_bps: integer, concentration_cap_cents: integer, coverage_posture: string, consecutive_failed_test_count: integer }
    status: 200
    side_effects: []
    description: "Computed read exposing BOTH variants of calculations.permissible_investment_coverage side by side over identical holdings, so their divergence is observable in one response."
  - method: GET
    path: /licensees/{id}/assessment-summary
    roles: [LicensingManager, StateRegulator]
    input: []
    output: { line_item_count: integer, unrounded_sum_cents: integer, annual_assessment_total_cents: integer }
    status: 200
    side_effects: []
    description: "Computed read for calculations.aggregate_assessment_invoice; unrounded_sum_cents is exposed so per-line-then-sum rounding can be distinguished from sum-then-round."
  - method: GET
    path: /licensees/{id}/investment-holdings
    roles: [LicensingManager, ComplianceOfficer, ChiefComplianceOfficer, StateRegulator]
    input: ["status?", "asset_class?", "limit?", "offset?"]
    output: InvestmentHolding[]
    status: 200
    side_effects: []

  # --- control persons ------------------------------------------------------
  - method: POST
    path: /control-persons
    roles: [LicensingManager]
    input: [licensee_id, full_name, role_title, direct_ownership_bps, "parent_control_person_id?"]
    output: ControlPerson
    status: 201
    side_effects:
      - "Runs calculations.control_person_ownership_attribution for both variants, then sets control_determination, background_check_status, change_of_control_status and required_approval_count."
      - "Recomputes Licensee.control_chain_status: BLOCKED if any non-REMOVED CONTROL row has background_check_status == ADVERSE or change_of_control_status == DENIED, else PENDING_CHECKS if any non-REMOVED CONTROL row has background_check_status == PENDING or change_of_control_status == PENDING_APPROVAL, else VERIFIED."
  - method: GET
    path: /control-persons/{id}
    roles: [LicensingManager, StateRegulator]
    input: []
    output: ControlPerson
    status: 200
    side_effects: []
  - method: GET
    path: /control-persons
    roles: [LicensingManager, StateRegulator]
    input: ["licensee_id?", "parent_control_person_id?", "status?", "control_determination?", "limit?", "offset?"]
    output: ControlPerson[]
    status: 200
    side_effects: []
  - method: POST
    path: /control-persons/{id}/background-check-adjudication
    roles: [StateRegulator]
    input: [outcome, "disqualifying_finding?"]
    output: ControlPerson
    status: 200
    side_effects:
      - "outcome CLEARED sets background_check_status CLEARED; outcome ADVERSE with disqualifying_finding true sets status REMOVED and disqualifying_finding true."
      - "A REMOVED row contributes 0 to both ownership variants of every descendant, so descendant effective_ownership_bps and attributed_ownership_bps are recomputed and their control_determination may flip to NON_CONTROL."
      - "Recomputes Licensee.control_chain_status."
  - method: POST
    path: /control-persons/{id}/change-of-control-decisions
    roles: [StateRegulator]
    input: [decision, "rationale?"]
    output: ControlPerson
    status: 200
    side_effects:
      - "decision APPROVED appends the acting regulator's jurisdiction to approving_jurisdiction_ids (self-loop PROPOSED -> PROPOSED) and flips change_of_control_status to APPROVED only once len(approving_jurisdiction_ids) == required_approval_count."
      - "decision DENIED sets status REMOVED immediately regardless of how many approvals were already collected."
      - "Recomputes Licensee.control_chain_status."

  # --- license applications -------------------------------------------------
  - method: POST
    path: /license-applications
    roles: [LicensingManager]
    input: [licensee_id, jurisdiction_id, license_class, projected_annual_volume_cents, new_product_narrative]
    output: LicenseApplication
    status: 201
    side_effects:
      - "status DRAFT; no duplicate check yet (duplicates are rejected at submit)."
  - method: GET
    path: /license-applications/{id}
    roles: [LicensingManager, StateRegulator]
    input: []
    output: LicenseApplication
    status: 200
    side_effects: []
  - method: GET
    path: /license-applications
    roles: [LicensingManager, StateRegulator]
    input: ["licensee_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: LicenseApplication[]
    status: 200
    side_effects: []
  - method: POST
    path: /license-applications/{id}/submit
    roles: [LicensingManager]
    input: []
    output: LicenseApplication
    status: 200
    side_effects:
      - "status DRAFT -> SUBMITTED; submitted_at stamped from the logical clock."
      - "Pins required_bond_cents from calculations.surety_bond_requirement (delegate_count 0 in application context) and required_net_worth_cents from the Jurisdiction config."
  - method: POST
    path: /license-applications/{id}/review-actions
    roles: [StateRegulator]
    input: [action, "note?"]
    output: LicenseApplication
    status: 200
    side_effects:
      - "action START_REVIEW: SUBMITTED -> UNDER_REVIEW."
      - "action ISSUE_DEFICIENCY: increments deficiency_round_count, and either UNDER_REVIEW -> DEFICIENT with deficiency_deadline_at = clock + 30 days, or (when deficiency_round_count was already 3) UNDER_REVIEW -> DENIED with denial_reason EXCESSIVE_DEFICIENCY_ROUNDS and no deadline."
      - "action APPROVE: UNDER_REVIEW -> APPROVED, decision_at stamped, and a StateLicense row is minted in PENDING_BOND / CURRENT / expansion_gate BLOCKED with license_number MT-<state_code>-<6-digit sequence> and bond_requirement_cents copied from required_bond_cents."
      - "action DENY: UNDER_REVIEW -> DENIED with denial_reason REGULATOR_DENIAL."
      - "action WITHDRAW: DEFICIENT -> WITHDRAWN (the regulator records the applicant's withdrawal; no license is minted)."
  - method: POST
    path: /license-applications/{id}/resubmit
    roles: [LicensingManager]
    input: [projected_annual_volume_cents, "remediation_note?"]
    output: LicenseApplication
    status: 200
    side_effects:
      - "DEFICIENT -> UNDER_REVIEW; clears deficiency_deadline_at; recomputes required_bond_cents from the new projected volume; deficiency_round_count is NOT reset (it is the loop counter that eventually forces the auto-denial)."

  # --- state licenses -------------------------------------------------------
  - method: GET
    path: /state-licenses/{id}
    roles: [LicensingManager, ComplianceOfficer, ChiefComplianceOfficer, StateRegulator]
    input: []
    output: StateLicense
    status: 200
    side_effects: []
  - method: GET
    path: /state-licenses
    roles: [LicensingManager, ComplianceOfficer, ChiefComplianceOfficer, StateRegulator]
    input: ["licensee_id?", "jurisdiction_id?", "application_id?", "license_status?", "reporting_status?", "limit?", "offset?"]
    output: StateLicense[]
    status: 200
    side_effects: []
  - method: POST
    path: /state-licenses/{id}/bond
    roles: [LicensingManager]
    input: [amount_cents, bond_issuer, effective_date]
    output: StateLicense
    status: 200
    side_effects:
      - "PENDING_BOND -> ACTIVE; bond_status POSTED; bond_posted_cents set; authorized_at stamped; increments Licensee.active_license_count."
      - "Recomputes expansion_gate: OPEN when the license is ACTIVE, bond_status POSTED, reporting_status CURRENT, exam_findings_open false and Licensee.coverage_posture IN {COMPLIANT, WATCH}."
      - "Bumps StateLicense.version."
  - method: POST
    path: /state-licenses/{id}/bond-cancellation-notice
    roles: [LicensingManager]
    input: [bond_cancellation_effective_date]
    output: StateLicense
    status: 200
    side_effects:
      - "ACTIVE -> SUSPENDED; bond_status CANCELLATION_NOTICED; expansion_gate BLOCKED."
      - "Cascade: every ACTIVE DelegateAuthorization of this license -> SUSPENDED, which decrements Delegate.authorized_state_count and StateLicense.active_delegate_count, which recomputes bond_requirement_cents; a delegate that loses its last ACTIVE authorization moves ACTIVE -> SUSPENDED."
      - "Bumps StateLicense.version."
  - method: PATCH
    path: /state-licenses/{id}/obligations
    roles: [LicensingManager]
    input: [delta_cents, memo]
    output: StateLicense
    status: 200
    side_effects:
      - "Adds delta_cents (may be negative) to outstanding_obligations_cents, then re-derives Licensee.aggregate_outstanding_obligations_cents, the coverage variants, coverage_ratio_bps and coverage_posture."
      - "A posture drop to DEFICIENT or FROZEN flips expansion_gate BLOCKED on every ACTIVE license of the licensee."
      - "A posture recovery to COMPLIANT or WATCH re-derives expansion_gate on every ACTIVE license of the licensee: OPEN when reporting_status == CURRENT, bond_status == POSTED and exam_findings_open == false. This is what makes DelegateAuthorization SUSPENDED_BY_POSTURE -> ACTIVE reachable."
      - "Bumps StateLicense.version and Licensee.version."
  - method: POST
    path: /state-licenses/{id}/renewals
    roles: [LicensingManager]
    input: [renewal_year, payment_amount_cents]
    output: StateLicense
    status: 200
    side_effects:
      - "Computes calculations.renewal_fee_assessment, compares it to payment_amount_cents, and on a match sets renewal_status RENEWED, renewal_year and renewal_total_fee_cents."
      - "Bumps StateLicense.version."
  - method: POST
    path: /state-licenses/{id}/surrender-requests
    roles: [LicensingManager]
    input: [effective_date, wind_down_narrative, expected_state_license_version]
    output: StateLicense
    status: 200
    side_effects:
      - "ACTIVE or SUSPENDED -> SURRENDER_REQUESTED; expansion_gate BLOCKED."
      - "OCC: expected_state_license_version must equal StateLicense.version (rule surrender-request-stale-license, ERR_STALE_LICENSE_VERSION 412). On success StateLicense.version is bumped, so a second call replaying the same expected version is rejected."
  - method: POST
    path: /state-licenses/{id}/surrender-decisions
    roles: [StateRegulator]
    input: [decision, "rationale?"]
    output: StateLicense
    status: 200
    side_effects:
      - "decision APPROVED: SURRENDER_REQUESTED -> SURRENDERED (terminal); the license leaves the obligation aggregate set, decrements Licensee.active_license_count, and every non-TERMINATED DelegateAuthorization of the license -> TERMINATED."
      - "decision DENIED: SURRENDER_REQUESTED -> ACTIVE and expansion_gate is re-derived."
      - "Bumps StateLicense.version."
  - method: GET
    path: /state-licenses/{id}/call-reports
    roles: [LicensingManager, StateRegulator]
    input: ["status?", "limit?", "offset?"]
    output: CallReport[]
    status: 200
    side_effects: []
  - method: POST
    path: /call-reports
    roles: [LicensingManager]
    input: [state_license_id, period_label, transmission_volume_cents, transaction_count]
    output: CallReport
    status: 201
    side_effects:
      - "Derives period_end, due_at, status and assessment_fee_cents per calculations.call_report_period_and_due_at."
      - "Drives the StateLicense.reporting_status dimension independently of license_status: LATE -> DELINQUENT, FILED_DEFICIENT -> DEFICIENT_FILING, a clean later filing -> CURRENT."
      - "Adds transmission_volume_cents to StateLicense.annual_volume_cents and recomputes bond_requirement_cents (volume tier may move)."
      - "reporting_status other than CURRENT flips expansion_gate BLOCKED."
      - "Bumps StateLicense.version."

  # --- delegates and authorizations ----------------------------------------
  - method: POST
    path: /delegates
    roles: [LicensingManager]
    input: [licensee_id, legal_name, delegate_type]
    output: Delegate
    status: 201
    side_effects:
      - "status ONBOARDING; oversight_score null (no review yet), so activation is impossible until a review is recorded."
  - method: GET
    path: /delegates/{id}
    roles: [LicensingManager, ComplianceOfficer, DelegateOperator, StateRegulator]
    input: []
    output: Delegate
    status: 200
    side_effects: []
  - method: GET
    path: /delegates
    roles: [LicensingManager, ComplianceOfficer, StateRegulator]
    input: ["licensee_id?", "status?", "limit?", "offset?"]
    output: Delegate[]
    status: 200
    side_effects: []
  - method: POST
    path: /delegates/{id}/oversight-reviews
    roles: [ComplianceOfficer, DelegateOperator]
    input: [training_score, aml_test_score, recordkeeping_score]
    output: Delegate
    status: 200
    side_effects:
      - "Replaces oversight_score with calculations.delegate_oversight_score over the three submitted components (earlier reviews are not averaged in) and stamps last_oversight_review_at from the logical clock."
      - "A DelegateOperator may only submit for its own Delegate (X-User-ID must equal the path id) — otherwise ERR_FORBIDDEN_SCOPE; a ComplianceOfficer may submit for any delegate."
  - method: POST
    path: /delegate-authorizations
    roles: [LicensingManager]
    input: [delegate_id, state_license_id, effective_date, expiry_date, monthly_volume_cap_cents]
    output: DelegateAuthorization
    status: 201
    side_effects:
      - "status PENDING_OVERSIGHT; no counters move yet (only activation counts a delegate against the bond)."
      - "Rejects an overlapping closed authorization period for the same delegate within the same jurisdiction (ERR_DELEGATE_PERIOD_OVERLAP)."
  - method: GET
    path: /delegate-authorizations/{id}
    roles: [LicensingManager, ComplianceOfficer, DelegateOperator, StateRegulator]
    input: []
    output: DelegateAuthorization
    status: 200
    side_effects: []
  - method: GET
    path: /delegate-authorizations
    roles: [LicensingManager, ComplianceOfficer, DelegateOperator, StateRegulator]
    input: ["delegate_id?", "state_license_id?", "status?", "limit?", "offset?"]
    output: DelegateAuthorization[]
    status: 200
    side_effects: []
  - method: POST
    path: /delegate-authorizations/{id}/activate
    roles: [LicensingManager]
    input: []
    output: DelegateAuthorization
    status: 200
    side_effects:
      - "PENDING_OVERSIGHT or SUSPENDED_BY_POSTURE -> ACTIVE; activated_at stamped; oversight_score_at_activation pinned."
      - "Increments StateLicense.active_delegate_count and Delegate.authorized_state_count; recomputes StateLicense.bond_requirement_cents via calculations.surety_bond_requirement."
      - "First successful activation moves the Delegate ONBOARDING -> ACTIVE; a re-activation out of SUSPENDED_BY_POSTURE moves SUSPENDED -> ACTIVE and clears oversight_hold."
  - method: POST
    path: /delegate-authorizations/{id}/terminate
    roles: [LicensingManager]
    input: ["reason?"]
    output: DelegateAuthorization
    status: 200
    side_effects:
      - "Any non-TERMINATED status -> TERMINATED (terminal)."
      - "Decrements StateLicense.active_delegate_count and Delegate.authorized_state_count when the authorization was ACTIVE, and recomputes bond_requirement_cents — restoring the exact pre-activation values (compensating invariant)."

  # --- permissible investments ---------------------------------------------
  - method: POST
    path: /investment-holdings
    roles: [ComplianceOfficer, ChiefComplianceOfficer]
    input: [licensee_id, asset_class, counterparty_name, book_value_cents, market_value_cents, "age_days?"]
    output: InvestmentHolding
    status: 201
    side_effects:
      - "status HELD; recomputes both coverage variants, coverage_ratio_bps and coverage_posture on the Licensee; bumps Licensee.version."
  - method: POST
    path: /investment-holdings/{id}/dispose
    roles: [ComplianceOfficer, ChiefComplianceOfficer]
    input: []
    output: InvestmentHolding
    status: 200
    side_effects:
      - "status HELD -> DISPOSED, removing the row from every coverage input set; recomputes coverage and posture; bumps Licensee.version."
  - method: POST
    path: /permissible-investment-tests
    roles: [ComplianceOfficer, ChiefComplianceOfficer]
    input: [licensee_id, coverage_period_start, coverage_period_end, method, expected_licensee_version]
    output: PermissibleInvestmentTest
    status: 201
    side_effects:
      - "status DRAFT; any existing DRAFT or PREPARED test of the same licensee is moved to SUPERSEDED."
      - "OCC: expected_licensee_version must equal Licensee.version (rule pi-test-create-stale-licensee, ERR_STALE_LICENSEE_VERSION 412). On success Licensee.version is bumped, so replaying the same expected version is rejected."
  - method: POST
    path: /permissible-investment-tests/{id}/prepare
    roles: [ComplianceOfficer, ChiefComplianceOfficer]
    input: []
    output: PermissibleInvestmentTest
    status: 200
    side_effects:
      - "DRAFT -> PREPARED; snapshots obligations_cents and investment_value_cents (using this row's method variant), then derives coverage_ratio_bps, shortfall_cents and result."
      - "prepared_by_user_id records the acting X-User-ID for the later segregation-of-duties check."
  - method: POST
    path: /permissible-investment-tests/{id}/certify
    roles: [ChiefComplianceOfficer]
    input: ["attestation_note?"]
    output: PermissibleInvestmentTest
    status: 200
    side_effects:
      - "PREPARED -> CERTIFIED (terminal); certified_by_user_id and certified_at recorded."
      - "result SHORTFALL increments Licensee.consecutive_failed_test_count; result PASS resets it to 0."
      - "Recomputes Licensee.coverage_posture, and a posture of DEFICIENT or FROZEN starts the expansion-gate cascade over every ACTIVE license of the licensee."
      - "Bumps Licensee.version."
  - method: GET
    path: /permissible-investment-tests/{id}
    roles: [LicensingManager, ComplianceOfficer, ChiefComplianceOfficer, StateRegulator]
    input: []
    output: PermissibleInvestmentTest
    status: 200
    side_effects: []
  - method: GET
    path: /permissible-investment-tests
    roles: [LicensingManager, ComplianceOfficer, ChiefComplianceOfficer, StateRegulator]
    input: ["licensee_id?", "status?", "method?", "result?", "limit?", "offset?"]
    output: PermissibleInvestmentTest[]
    status: 200
    side_effects: []

  # --- multistate examination ----------------------------------------------
  - method: POST
    path: /multistate-exams
    roles: [StateRegulator]
    input: [licensee_id, lead_jurisdiction_id, participating_jurisdiction_ids, fieldwork_start, fieldwork_end]
    output: MultistateExam
    status: 201
    side_effects:
      - "status SCHEDULED; participating_state_count set to the distinct count of participating jurisdictions including the lead."
      - "Rejects a fieldwork window that falls inside the 30-day cooling-off buffer around another exam of the same licensee (ERR_EXAM_WINDOW_CONFLICT)."
  - method: GET
    path: /multistate-exams/{id}
    roles: [StateRegulator, LicensingManager]
    input: []
    output: MultistateExam
    status: 200
    side_effects: []
  - method: GET
    path: /multistate-exams
    roles: [StateRegulator, LicensingManager]
    input: ["licensee_id?", "lead_jurisdiction_id?", "status?", "limit?", "offset?"]
    output: MultistateExam[]
    status: 200
    side_effects: []
  - method: POST
    path: /multistate-exams/{id}/status-changes
    roles: [StateRegulator]
    input: [to_status, "findings_count?"]
    output: MultistateExam
    status: 200
    side_effects:
      - "Only the lead jurisdiction may drive the exam (ERR_FORBIDDEN_SCOPE otherwise)."
      - "to_status REPORT_ISSUED records findings_count and, when findings_count >= 3, sets exam_findings_open true and expansion_gate BLOCKED on every ACTIVE license of the examined licensee in the participating jurisdictions."
      - "to_status CLOSED is compound: it is admitted only when open_request_count == 0, i.e. every InformationRequest of the exam has reached ACCEPTED."
  - method: POST
    path: /information-requests
    roles: [StateRegulator]
    input: [exam_id, jurisdiction_id, subject, requested_item_count]
    output: InformationRequest
    status: 201
    side_effects:
      - "status OPEN; due_at = logical clock + the requesting Jurisdiction's response_window_days; increments MultistateExam.open_request_count."
  - method: GET
    path: /information-requests/{id}
    roles: [StateRegulator, LicensingManager, ComplianceOfficer]
    input: []
    output: InformationRequest
    status: 200
    side_effects: []
  - method: GET
    path: /information-requests
    roles: [StateRegulator, LicensingManager, ComplianceOfficer]
    input: ["exam_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: InformationRequest[]
    status: 200
    side_effects: []
  - method: POST
    path: /information-requests/{id}/response
    roles: [LicensingManager, ComplianceOfficer]
    input: [submitted_item_count, narrative]
    output: InformationRequest
    status: 200
    side_effects:
      - "OPEN or OVERDUE -> RESPONDED; submitted_item_count and responded_at recorded; decrements MultistateExam.open_request_count."
  - method: POST
    path: /information-requests/{id}/disposition
    roles: [StateRegulator]
    input: [decision, "rationale?"]
    output: InformationRequest
    status: 200
    side_effects:
      - "decision ACCEPTED: RESPONDED -> ACCEPTED (terminal)."
      - "decision REJECTED from RESPONDED: back to OPEN, increments reopen_count, re-arms due_at to clock + 5 days and increments open_request_count."
      - "decision REJECTED from OPEN while the clock is past due_at: OPEN -> OVERDUE."

  # --- enforcement ----------------------------------------------------------
  - method: POST
    path: /enforcement-actions
    roles: [StateRegulator]
    input: [state_license_id, jurisdiction_id, basis, penalty_cents, remediation_deadline_at, "originating_exam_id?"]
    output: EnforcementAction
    status: 201
    side_effects:
      - "status ISSUED; issued_at stamped from the logical clock, which starts the 20-day response window."
  - method: GET
    path: /enforcement-actions/{id}
    roles: [StateRegulator, LicensingManager]
    input: []
    output: EnforcementAction
    status: 200
    side_effects: []
  - method: GET
    path: /enforcement-actions
    roles: [StateRegulator, LicensingManager]
    input: ["state_license_id?", "jurisdiction_id?", "originating_exam_id?", "status?", "limit?", "offset?"]
    output: EnforcementAction[]
    status: 200
    side_effects: []
  - method: POST
    path: /enforcement-actions/{id}/responses
    roles: [LicensingManager]
    input: [response, "remediation_plan_narrative?"]
    output: EnforcementAction
    status: 200
    side_effects:
      - "response CONSENT_ORDER: ISSUED -> CONSENT_ORDER, remediation_plan_narrative stored, and the target StateLicense ACTIVE -> SUSPENDED with expansion_gate BLOCKED and every ACTIVE DelegateAuthorization of that license -> SUSPENDED."
      - "response CONTEST: ISSUED -> CONTESTED with NO license side effect at all — the license keeps operating while the matter is litigated. This is the branch divergence."
      - "Bumps StateLicense.version on the CONSENT_ORDER branch only."
  - method: POST
    path: /enforcement-actions/{id}/resolutions
    roles: [StateRegulator]
    input: [outcome, "remediation_accepted?"]
    output: EnforcementAction
    status: 200
    side_effects:
      - "outcome RESOLVED with remediation_accepted true: CONSENT_ORDER or CONTESTED -> RESOLVED, and a SUSPENDED license returns to ACTIVE with expansion_gate re-derived."
      - "outcome RESOLVED with remediation_accepted false or absent: the action resolves but the license stays SUSPENDED."
      - "outcome REVOCATION: -> REVOCATION (terminal), the StateLicense -> REVOKED (leaving the obligation aggregate set and decrementing Licensee.active_license_count), every non-TERMINATED DelegateAuthorization of that license -> TERMINATED, and a delegate whose last authorization was terminated moves ACTIVE -> TERMINATED."
      - "Bumps StateLicense.version."

# =============================================================================
# 1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message_template: "Missing or unrecognised identity headers"
    triggered_by: "any endpoint called without X-User-Role / X-User-ID or with an undeclared role"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message_template: "Role {role} may not call {method} {path}"
    triggered_by: "role not in the endpoint's roles list"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message_template: "Invalid request: {detail}"
    triggered_by: "missing required field, bad enum, negative money/count, malformed datetime, out-of-range limit/offset"
  - error_id: ERR_LICENSEE_NOT_FOUND
    http_status: 404
    message_template: "Licensee {licensee_id} not found"
    triggered_by: "unknown licensee_id in path or body"
  - error_id: ERR_JURISDICTION_NOT_FOUND
    http_status: 404
    message_template: "Jurisdiction {jurisdiction_id} not found"
    triggered_by: "unknown jurisdiction_id on an application, exam, information request or enforcement action"
  - error_id: ERR_CONTROL_PERSON_NOT_FOUND
    http_status: 404
    message_template: "Control person {control_person_id} not found"
    triggered_by: "unknown control person path id or parent_control_person_id"
  - error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    message_template: "License application {application_id} not found"
    triggered_by: "unknown application path id"
  - error_id: ERR_LICENSE_NOT_FOUND
    http_status: 404
    message_template: "State license {state_license_id} not found"
    triggered_by: "unknown license path id or state_license_id in a body"
  - error_id: ERR_DELEGATE_NOT_FOUND
    http_status: 404
    message_template: "Delegate {delegate_id} not found"
    triggered_by: "unknown delegate path id or delegate_id in a body"
  - error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    message_template: "Delegate authorization {authorization_id} not found"
    triggered_by: "unknown authorization path id"
  - error_id: ERR_HOLDING_NOT_FOUND
    http_status: 404
    message_template: "Investment holding {holding_id} not found"
    triggered_by: "unknown holding path id on dispose"
  - error_id: ERR_TEST_NOT_FOUND
    http_status: 404
    message_template: "Permissible investment test {test_id} not found"
    triggered_by: "unknown test path id"
  - error_id: ERR_EXAM_NOT_FOUND
    http_status: 404
    message_template: "Multistate exam {exam_id} not found"
    triggered_by: "unknown exam path id, exam_id or originating_exam_id"
  - error_id: ERR_INFO_REQUEST_NOT_FOUND
    http_status: 404
    message_template: "Information request {request_id} not found"
    triggered_by: "unknown information request path id"
  - error_id: ERR_ENFORCEMENT_NOT_FOUND
    http_status: 404
    message_template: "Enforcement action {action_id} not found"
    triggered_by: "unknown enforcement action path id"
  - error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    message_template: "Actor {user_id} is outside the scope of {resource}"
    triggered_by: "a StateRegulator acting on a resource of another jurisdiction, or a DelegateOperator acting on another delegate"
  - error_id: ERR_STALE_LICENSEE_VERSION
    http_status: 412
    message_template: "Expected licensee version {expected}, found {actual}"
    triggered_by: "POST /permissible-investment-tests with an expected_licensee_version that no longer matches"
  - error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412
    message_template: "Expected state license version {expected}, found {actual}"
    triggered_by: "POST /state-licenses/{id}/surrender-requests with an expected_state_license_version that no longer matches"
  - error_id: ERR_APPLICATION_INVALID_STATE
    http_status: 409
    message_template: "Application in status {status} does not admit {action}"
    triggered_by: "submit outside DRAFT, review action outside SUBMITTED/UNDER_REVIEW, resubmit outside DEFICIENT, any action on a terminal application"
  - error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    message_template: "License in status {license_status} does not admit this operation"
    triggered_by: "bond posting on a non-PENDING_BOND license, renewal or delegate authorization on a non-ACTIVE license, surrender request outside ACTIVE/SUSPENDED"
  - error_id: ERR_LICENSE_TERMINAL
    http_status: 409
    message_template: "License {state_license_id} is {license_status} and accepts no further filings"
    triggered_by: "any mutation of a SURRENDERED or REVOKED license"
  - error_id: ERR_TEST_INVALID_STATE
    http_status: 409
    message_template: "Test in status {status} does not admit this operation"
    triggered_by: "prepare outside DRAFT, certify outside PREPARED, any operation on a SUPERSEDED or CERTIFIED test"
  - error_id: ERR_AUTHORIZATION_INVALID_STATE
    http_status: 409
    message_template: "Authorization in status {status} does not admit this operation"
    triggered_by: "activate from ACTIVE/SUSPENDED/TERMINATED, terminate from TERMINATED"
  - error_id: ERR_EXAM_INVALID_STATE
    http_status: 409
    message_template: "Exam in status {status} does not admit {to_status}"
    triggered_by: "a status change that is not a declared edge, or information-request activity outside FIELDWORK; also CLOSED while open_request_count > 0"
  - error_id: ERR_INFO_REQUEST_INVALID_STATE
    http_status: 409
    message_template: "Information request in status {status} does not admit this operation"
    triggered_by: "response outside OPEN/OVERDUE, disposition outside OPEN/RESPONDED, anything on an ACCEPTED request"
  - error_id: ERR_ENFORCEMENT_INVALID_STATE
    http_status: 409
    message_template: "Enforcement action in status {status} does not admit this operation"
    triggered_by: "response outside ISSUED, resolution outside CONSENT_ORDER/CONTESTED"
  - error_id: ERR_CONTROL_PERSON_INVALID_STATE
    http_status: 409
    message_template: "Control person in status {status} does not admit this decision"
    triggered_by: "adjudication or change-of-control decision on a SEATED or REMOVED row"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    message_template: "User {user_id} prepared this test and may not certify it"
    triggered_by: "certify called with the same X-User-ID that ran prepare"
  - error_id: ERR_BACKGROUND_CHECK_INCOMPLETE
    http_status: 409
    message_template: "Control person {control_person_id} has background_check_status {status}"
    triggered_by: "APPROVE while a CONTROL person of the licensee is not CLEARED"
  - error_id: ERR_CONTROL_CHAIN_BLOCKED
    http_status: 409
    message_template: "Licensee control chain is BLOCKED"
    triggered_by: "submit, APPROVE or renewal while a CONTROL person still needs a background check or a change-of-control approval"
  - error_id: ERR_POSTURE_FROZEN
    http_status: 409
    message_template: "Licensee coverage posture is FROZEN"
    triggered_by: "submit, APPROVE or new delegate authorization after two consecutive certified shortfall tests"
  - error_id: ERR_EXPANSION_GATE_BLOCKED
    http_status: 409
    message_template: "License {state_license_id} expansion gate is BLOCKED"
    triggered_by: "activating a delegate authorization on a license whose gate is closed by posture, reporting status, bond status or open exam findings"
  - error_id: ERR_OVERSIGHT_SCORE_INSUFFICIENT
    http_status: 409
    message_template: "Delegate oversight score {score} is below the required 70"
    triggered_by: "activation with no oversight review or a weighted score below 70"
  - error_id: ERR_REMEDIATION_PLAN_REQUIRED
    http_status: 422
    message_template: "A consent order response requires a remediation plan"
    triggered_by: "response CONSENT_ORDER without remediation_plan_narrative"
  - error_id: ERR_CROSS_LICENSEE_REFERENCE
    http_status: 422
    message_template: "{child} belongs to a different licensee than {parent}"
    triggered_by: "authorizing a delegate under another licensee's license, or parenting a control person under another licensee's holder"
  - error_id: ERR_JURISDICTION_MISMATCH
    http_status: 422
    message_template: "Enforcement jurisdiction {jurisdiction_id} does not issue license {state_license_id}"
    triggered_by: "enforcement action filed by a jurisdiction other than the license's own"
  - error_id: ERR_JURISDICTION_NOT_PARTICIPATING
    http_status: 422
    message_template: "Jurisdiction {jurisdiction_id} is not part of exam {exam_id}"
    triggered_by: "information request from a state outside the exam's lead + participating set"
  - error_id: ERR_JURISDICTION_NOT_MULTISTATE
    http_status: 422
    message_template: "Jurisdiction {jurisdiction_id} cannot join a coordinated exam"
    triggered_by: "participating jurisdiction with participates_in_multistate false, or with no ACTIVE license for the examined licensee"
  - error_id: ERR_DUPLICATE_APPROVAL
    http_status: 409
    message_template: "Jurisdiction {jurisdiction_id} already decided on control person {control_person_id}"
    triggered_by: "a second change-of-control decision from the same jurisdiction"
  - error_id: ERR_EXAM_WINDOW_CONFLICT
    http_status: 409
    message_template: "Fieldwork window conflicts with exam {exam_id} inside the 30-day buffer"
    triggered_by: "a second exam of the same licensee scheduled within 30 days of an existing window"
  - error_id: ERR_DELEGATE_PERIOD_OVERLAP
    http_status: 409
    message_template: "Delegate {delegate_id} already authorized in {state_code} for an overlapping period"
    triggered_by: "a same-jurisdiction authorization whose closed interval touches or overlaps an existing one"
  - error_id: ERR_CERTIFICATION_WINDOW_CLOSED
    http_status: 409
    message_template: "Certification window closed on {deadline}"
    triggered_by: "certify more than 45 days after coverage_period_end"
  - error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 409
    message_template: "Response was due {due_at}"
    triggered_by: "responding to an information request after due_at"
  - error_id: ERR_DEFICIENCY_DEADLINE_PASSED
    http_status: 409
    message_template: "Deficiency response was due {deadline}"
    triggered_by: "resubmit after deficiency_deadline_at"
  - error_id: ERR_ENFORCEMENT_RESPONSE_WINDOW_CLOSED
    http_status: 409
    message_template: "Enforcement response window closed on {deadline}"
    triggered_by: "responding more than 20 days after issued_at"
  - error_id: ERR_REMEDIATION_DEADLINE_PASSED
    http_status: 409
    message_template: "Remediation deadline {deadline} has passed"
    triggered_by: "resolving a consent order as RESOLVED after remediation_deadline_at"
  - error_id: ERR_BOND_NOTICE_TOO_SHORT
    http_status: 422
    message_template: "Bond cancellation requires at least 30 days notice"
    triggered_by: "a cancellation effective date less than 30 days after the logical clock"
  - error_id: ERR_DUPLICATE_LICENSE_APPLICATION
    http_status: 409
    message_template: "Licensee already has a live application in jurisdiction {jurisdiction_id}"
    triggered_by: "submitting a second application for the same licensee/jurisdiction while one is live"
  - error_id: ERR_DUPLICATE_EIN
    http_status: 409
    message_template: "EIN {ein} already registered"
    triggered_by: "second licensee with the same EIN"
  - error_id: ERR_DUPLICATE_STATE_CODE
    http_status: 409
    message_template: "Jurisdiction {state_code} already configured"
    triggered_by: "second jurisdiction with the same state code"
  - error_id: ERR_DUPLICATE_CALL_REPORT
    http_status: 409
    message_template: "Period {period_label} already filed for this license"
    triggered_by: "duplicate period label, or a label whose form contradicts the jurisdiction's call_report_frequency"
  - error_id: ERR_RESPONSE_INCOMPLETE
    http_status: 422
    message_template: "Submitted {submitted} of {requested} requested items"
    triggered_by: "a response delivering fewer items than requested"
  - error_id: ERR_ACTIVE_DELEGATES_REMAIN
    http_status: 409
    message_template: "License still has {count} active delegate authorizations"
    triggered_by: "surrender request while an authorization is ACTIVE"
  - error_id: ERR_CONTROL_CHAIN_CYCLE
    http_status: 422
    message_template: "Control chain is cyclic or deeper than 5 links"
    triggered_by: "parent_control_person_id pointing at the row itself, into its own descendants, or beyond depth 5"
  - error_id: ERR_REPORTING_NOT_CURRENT
    http_status: 409
    message_template: "License reporting status is {reporting_status}"
    triggered_by: "renewal while reporting_status is DELINQUENT or DEFICIENT_FILING"
  - error_id: ERR_NET_WORTH_INSUFFICIENT
    http_status: 422
    message_template: "Net worth {reported} is below the {required} required in {state_code}"
    triggered_by: "APPROVE or renewal while reported net worth is under the jurisdiction minimum"
  - error_id: ERR_BOND_INSUFFICIENT
    http_status: 422
    message_template: "Bond {amount} is below the required {required}"
    triggered_by: "posting a bond smaller than bond_requirement_cents"
  - error_id: ERR_OUTSTANDING_OBLIGATIONS_REMAIN
    http_status: 409
    message_template: "License still carries {amount} of outstanding obligations"
    triggered_by: "surrender request with non-zero outstanding obligations"
  - error_id: ERR_RENEWAL_FEE_MISMATCH
    http_status: 422
    message_template: "Renewal payment {paid} does not equal the computed {expected}"
    triggered_by: "a renewal payment that misses the tiered assessment total"
  - error_id: ERR_NEGATIVE_OBLIGATIONS
    http_status: 422
    message_template: "Adjustment would drive obligations below zero"
    triggered_by: "an obligations delta more negative than the current balance"

# =============================================================================
# 1.7 RBAC Table
# =============================================================================
roles:
  - role: PlatformAdmin
    identity: opaque
    description: "Fixture/administrative actor. Configures Jurisdiction reference data and drives the logical clock."
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /_clock/set_current_utc"
    shared_operations: []
  - role: LicensingManager
    identity: opaque
    description: "Licensee-side owner of applications, licenses, bonds, renewals, call reports, delegates and enforcement responses."
    exclusive_operations:
      - "POST /licensees"
      - "PATCH /licensees/{id}/financials"
      - "POST /control-persons"
      - "POST /license-applications"
      - "POST /license-applications/{id}/submit"
      - "POST /license-applications/{id}/resubmit"
      - "POST /state-licenses/{id}/bond"
      - "POST /state-licenses/{id}/bond-cancellation-notice"
      - "PATCH /state-licenses/{id}/obligations"
      - "POST /state-licenses/{id}/renewals"
      - "POST /state-licenses/{id}/surrender-requests"
      - "POST /call-reports"
      - "POST /delegates"
      - "POST /delegate-authorizations"
      - "POST /delegate-authorizations/{id}/activate"
      - "POST /delegate-authorizations/{id}/terminate"
      - "POST /enforcement-actions/{id}/responses"
    shared_operations:
      - "POST /information-requests/{id}/response (with ComplianceOfficer)"
      - "all GET reads except the coverage/assessment computed reads it shares with the compliance roles"
  - role: ComplianceOfficer
    identity: opaque
    description: "Prepares permissible-investment tests, records investment holdings, conducts delegate oversight reviews. Cannot certify a test it prepared."
    exclusive_operations:
      - "POST /permissible-investment-tests/{id}/prepare"
    shared_operations:
      - "POST /investment-holdings and POST /investment-holdings/{id}/dispose (with ChiefComplianceOfficer)"
      - "POST /permissible-investment-tests (with ChiefComplianceOfficer)"
      - "POST /delegates/{id}/oversight-reviews (with DelegateOperator, which is restricted to its own delegate)"
      - "POST /information-requests/{id}/response (with LicensingManager)"
  - role: ChiefComplianceOfficer
    identity: opaque
    description: "Certifying officer. Holds the sole certification right, subject to segregation of duties against the preparer."
    exclusive_operations:
      - "POST /permissible-investment-tests/{id}/certify"
    shared_operations:
      - "POST /investment-holdings and POST /investment-holdings/{id}/dispose (with ComplianceOfficer)"
      - "POST /permissible-investment-tests (with ComplianceOfficer)"
      - "GET /licensees/{id}/coverage-summary and the test reads"
  - role: StateRegulator
    identity: "entity_backed:Jurisdiction"
    description: "A state regulator, identified by X-User-ID equal to a Jurisdiction.id. Adjudicates applications, control persons, surrenders, examinations, information requests and enforcement."
    exclusive_operations:
      - "POST /license-applications/{id}/review-actions"
      - "POST /control-persons/{id}/background-check-adjudication"
      - "POST /control-persons/{id}/change-of-control-decisions"
      - "POST /state-licenses/{id}/surrender-decisions"
      - "POST /multistate-exams"
      - "POST /multistate-exams/{id}/status-changes"
      - "POST /information-requests"
      - "POST /information-requests/{id}/disposition"
      - "POST /enforcement-actions"
      - "POST /enforcement-actions/{id}/resolutions"
    shared_operations:
      - "read access to licensees, applications, licenses, tests, exams, requests and enforcement actions"
  - role: DelegateOperator
    identity: "entity_backed:Delegate"
    description: "An authorized delegate's own operator, identified by X-User-ID equal to a Delegate.id. May self-report oversight metrics for its own delegate row only."
    exclusive_operations: []
    shared_operations:
      - "POST /delegates/{id}/oversight-reviews for its own delegate only (with ComplianceOfficer)"
      - "GET /delegates/{id}, GET /delegate-authorizations/{id}, GET /delegate-authorizations for its own rows"
