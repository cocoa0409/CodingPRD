            - "FY2026: window_start '2026-07-01T00:00:00Z', window_end '2027-07-01T00:00:00Z' and collections_cents == 5189521 - the payment made at exactly 2026-07-01T00:00:00Z fell into FY2026, so neither year double-counts it."
