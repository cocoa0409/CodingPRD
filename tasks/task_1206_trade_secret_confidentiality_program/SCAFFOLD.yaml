    output: NdaAgreement
    side_effects: ["status=DRAFT"]

  - method: POST
    path: "/api/ndas/{id}/amendments"
    description: "Create an amendment DRAFT whose supersedes_id is the path NDA; OCC-guarded on the superseded NDA's version; target NDA must be ACTIVE or BREACH_ALLEGED (ERR_INVALID_STATE otherwise); its window may overlap the superseded NDA but no other non-terminal NDA of the same counterparty"
    roles: [IPCounsel]
    code: 201
    input: [template_version, governing_law, effective_date, expiry_date, survival_months, classification_ceiling, expected_superseded_nda_version]
    output: NdaAgreement
    side_effects:
      - "increments the superseded NdaAgreement.version by 1 (amendment linkage is a mutation of the parent)"
      - "new NdaAgreement status=DRAFT, supersedes_id = path id"

  - method: GET
    path: "/api/ndas"
    description: "List NDAs (filterable by counterparty_id, supersedes_id, status)"
    roles: [IPCounsel, SeniorCounsel]
    code: 200
