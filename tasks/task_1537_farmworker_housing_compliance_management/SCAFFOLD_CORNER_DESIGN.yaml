          assert:
            - "occ == 2 and beds == 2"
            - "pe == false and cert == true and ust == OCCUPIED"

      - name: filtered_list_isolation_work_orders_by_unit
        claim_type: standard_crud
        grounds: [entities.WorkOrder.fields.unit_id]
        distinguishing_aspect: "GET /work-orders?unit_id=<u1> returns exactly the work orders of u1, none of u2's."
        test_recipe:
          setup: ["site + building + units U1 and U2; one work order on each"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u1: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U2", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u2: $.data.id } }
            - { call: "POST /work-orders", payload: { unit_id: "${u1}", category: "PLUMBING", severity: "MINOR", description: "on u1" }, as: MaintenanceLead, captures: { w1: $.data.id } }
            - { call: "POST /work-orders", payload: { unit_id: "${u2}", category: "ELECTRICAL", severity: "MAJOR", description: "on u2" }, as: MaintenanceLead, captures: { w2: $.data.id } }
          trigger:
            - { call: "GET /work-orders?unit_id=${u1}", as: OperatorAdmin, captures: { first_id: $.data.0.id } }
          assert:
            - "the filtered list contains exactly 1 row and first_id == ${w1}"
            - "no row in the filtered list has unit_id == ${u2}"

      - name: delete_window_cancels_then_invalid_state
        claim_type: standard_crud
        grounds: [state_machines.SeasonWindow.PLANNED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DELETE cancels a PLANNED window (204); a second DELETE hits terminal CANCELLED and is rejected."
        test_recipe:
          setup: ["site DRAFT; window PLANNED"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "W", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin, captures: { w_id: $.data.id } }
          trigger:
            - { call: "DELETE /season-windows/${w_id}", as: OperatorAdmin }
            - { call: "GET /season-windows/${w_id}", as: OperatorAdmin, captures: { w_st: $.data.status } }
            - { call: "DELETE /season-windows/${w_id}", as: OperatorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first DELETE returns 204"
            - "w_st == CANCELLED"
            - "err == ERR_INVALID_STATE — CANCELLED is terminal"

      - name: statement_computed_read_after_payment
        claim_type: computed_read
        grounds: [entities.Tenancy.fields.balance_cents]
        excluded_because:
          difficulty_instance: deduction_cap_nested_min_with_purpose_branch
          rationale: "The statement read's bucket fields (rent 5968, utility 625, total 6593) are asserted verbatim in the named §1.8 instance's final GET /tenancies/{id}/statement."

  # ===========================================================================
  - section: errors
    instances:
      - name: err_invalid_state_on_repeat_activation
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: occupancy_boundary_exact_capacity
          rationale: "ERR_INVALID_STATE on a second identical activation trigger is asserted by repeat_activation_rejected (§1.9 state_machines); occupancy_boundary_exact_capacity exercises the same error family on the second household's failed activation."

      - name: err_site_not_open_on_activation
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SITE_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: inspection_conduct_requires_site_open
          rationale: "ERR_SITE_NOT_OPEN is asserted on the inspection conduct gate in the named §1.8 instance; the tenancy-activation gate shares priority-8 machinery."

      - name: occupancy_invariant_claim
        claim_type: side_effect_execution
        grounds: [entities.HousingUnit.fields.current_occupancy]
        excluded_because:
          difficulty_instance: occupancy_activate_terminate_roundtrip_invariant
          rationale: "Occupancy bump on activation and release on termination (0 -> 3 -> 0) are asserted in the named §1.8 instance."

