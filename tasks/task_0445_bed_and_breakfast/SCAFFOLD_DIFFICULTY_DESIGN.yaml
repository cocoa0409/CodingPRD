              payload: { inn_id: "${inn_id}", full_name: "Ka G", email: "ka@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            # booking A (room_a)
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_a}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-06-15", checkout_date: "2026-06-17", guest_count: 1 }
              as: Innkeeper
              captures: { bk_a: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 10000 }
