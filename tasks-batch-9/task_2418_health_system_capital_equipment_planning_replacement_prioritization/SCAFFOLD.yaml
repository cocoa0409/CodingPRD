  # ---- VendorQuote --------------------------------------------------------
  - method: POST
    path: /capital/requests/{id}/quotes
    roles: [CapitalPlanner]
    input: ["gpo_contract_id", "vendor_name", "list_price_cents", "service_escalation_pct", "valid_until", "trade_in_asset_id?", "trade_in_offer_cents?", "multi_unit_count?", "warranty_months?"]
    output: VendorQuote
    side_effects:
      - "Creates a VendorQuote in SUBMITTED with negotiation_round 1, version 1."
      - "Runs negotiated_capital_price, writing gpo_tier, gpo_discount_cents, multi_unit_addendum_cents, subtotal_cents, trade_in_credit_cents and net_capital_cents."
      - "Nothing on the request changes; the request's TCO and funded amount move only when a quote is ACCEPTED."
    errors: [ERR_VALIDATION, ERR_REQUEST_NOT_FOUND, ERR_GPO_CONTRACT_NOT_FOUND, ERR_ASSET_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_GPO_CONTRACT_EXPIRED, ERR_TRADE_IN_ASSET_MISMATCH, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/vendor-quotes/{id}
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: []
    output: VendorQuote
    errors: [ERR_QUOTE_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/vendor-quotes
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["request_id?", "gpo_contract_id?", "trade_in_asset_id?", "status?", "limit?", "offset?"]
    output: VendorQuote[]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/vendor-quotes/{id}/counter
    roles: [CapitalPlanner]
    input: ["counter_list_price_cents", "counter_trade_in_offer_cents?", "counter_note?"]
    output: VendorQuote
    side_effects:
      - "SUBMITTED -> COUNTERED; list_price_cents (and trade_in_offer_cents when supplied) overwritten; negotiation_round += 1."
      - "Re-runs negotiated_capital_price over the new list price; quote.version += 1."
    errors: [ERR_VALIDATION, ERR_QUOTE_NOT_FOUND, ERR_QUOTE_INVALID_STATE, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/vendor-quotes/{id}/revise
    roles: [CapitalPlanner]
    input: ["revised_list_price_cents", "revised_trade_in_offer_cents?", "revised_warranty_months?"]
    output: VendorQuote
    side_effects:
      - "COUNTERED -> SUBMITTED; list_price_cents (and trade_in_offer_cents / warranty_months when supplied) overwritten."
      - "Re-runs negotiated_capital_price; quote.version += 1. negotiation_round is NOT incremented by a revise."
    errors: [ERR_VALIDATION, ERR_QUOTE_NOT_FOUND, ERR_QUOTE_INVALID_STATE, ERR_NEGOTIATION_ROUND_LIMIT, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/vendor-quotes/{id}/accept
    roles: [CapitalPlanner]
    input: ["safety_review_ack?"]
    output: VendorQuote
    side_effects:
      - "SUBMITTED -> ACCEPTED; any sibling quote of the same request in SUBMITTED, COUNTERED or ACCEPTED -> SUPERSEDED with its trade-in claim released; each quote.version += 1."
      - "When trade_in_asset_id is set: asset.trade_in_credit_applied_cents = trade_in_credit_cents, asset.disposition_status = HELD_FOR_TRADE_IN, asset.version += 1."
      - "CASCADE: runs five_year_tco variant `negotiated` and request_funded_amount, rewriting negotiated_operating_5y_cents, negotiated_tco_cents, baseline_year1_opex_cents and funded_amount_cents with request.version += 1; when the request is already FUNDED the allocation's committed_cents / available_cents / posture are adjusted by the delta with allocation.version += 1, and a posture flip back to ACTIVE decrements cycle.exhausted_allocation_count with cycle.version += 1."
    errors: [ERR_VALIDATION, ERR_QUOTE_NOT_FOUND, ERR_QUOTE_INVALID_STATE, ERR_REQUEST_INVALID_STATE, ERR_QUOTE_EXPIRED, ERR_SAFETY_REVIEW_REQUIRED, ERR_TRADE_IN_ASSET_UNAVAILABLE, ERR_NO_FACILITY_ALLOCATION, ERR_ALLOCATION_INSUFFICIENT, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/vendor-quotes/{id}/withdraw
    roles: [CapitalPlanner]
    input: ["withdrawal_reason?"]
    output: VendorQuote
    side_effects:
      - "SUBMITTED | COUNTERED | ACCEPTED -> WITHDRAWN; quote.version += 1."
      - "When the quote was ACCEPTED: the asset's trade-in claim is released, negotiated_operating_5y_cents and negotiated_tco_cents -> null, baseline_year1_opex_cents falls back to the budgetary year-1 figure, request_funded_amount is re-run and the allocation is adjusted by the delta."
    errors: [ERR_QUOTE_NOT_FOUND, ERR_QUOTE_INVALID_STATE, ERR_REQUEST_INVALID_STATE, ERR_ALLOCATION_INSUFFICIENT, ERR_UNAUTHORIZED]

  # ---- InstallationProject ------------------------------------------------
  - method: POST
    path: /capital/requests/{id}/installation-projects
    roles: [FacilityDirector]
    input: ["downtime_start", "downtime_end", "construction_required?", "construction_start?", "construction_end?", "predecessor_project_id?"]
    output: InstallationProject
    side_effects:
      - "Creates an InstallationProject with facility_id and department_id copied from the request, record_status ACTIVE, equipment_status AWAITING_DELIVERY, go_live_at null, version 1."
      - "construction_status = DESIGN when construction_required is true, else NOT_REQUIRED."
      - "Runs the V46 buffered downtime check per department and the V47 closed-interval construction capacity check per facility before writing."
    errors: [ERR_VALIDATION, ERR_REQUEST_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_FACILITY_SCOPE_VIOLATION, ERR_INVALID_INTERVAL, ERR_CONSTRUCTION_WINDOW_REQUIRED, ERR_DOWNTIME_WINDOW_CONFLICT, ERR_CONSTRUCTION_CAPACITY_EXCEEDED, ERR_PROJECT_DEPENDENCY_CYCLE, ERR_UNAUTHORIZED]
  - method: PATCH
    path: /capital/installation-projects/{id}
    roles: [FacilityDirector]
    input: ["downtime_start?", "downtime_end?", "construction_required?", "construction_start?", "construction_end?", "predecessor_project_id?"]
    output: InstallationProject
    side_effects:
      - "Updates the supplied fields and re-runs the V46 downtime and V47 construction-capacity checks, excluding the row being patched from both comparison sets; project.version += 1."
      - "Re-runs the V48 DAG cycle check whenever predecessor_project_id is supplied."
      - "Turning construction_required on sets construction_status DESIGN; turning it off sets NOT_REQUIRED and clears both construction bounds."
    errors: [ERR_VALIDATION, ERR_PROJECT_NOT_FOUND, ERR_PROJECT_INVALID_STATE, ERR_FACILITY_SCOPE_VIOLATION, ERR_INVALID_INTERVAL, ERR_CONSTRUCTION_WINDOW_REQUIRED, ERR_DOWNTIME_WINDOW_CONFLICT, ERR_CONSTRUCTION_CAPACITY_EXCEEDED, ERR_PROJECT_DEPENDENCY_CYCLE, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/installation-projects/{id}
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: []
    output: InstallationProject
    errors: [ERR_PROJECT_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/installation-projects
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["request_id?", "facility_id?", "department_id?", "predecessor_project_id?", "record_status?", "construction_status?", "equipment_status?", "limit?", "offset?"]
    output: InstallationProject[]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/installation-projects/{id}/advance-construction
    roles: [FacilityDirector]
    input: []
    output: InstallationProject
    side_effects: ["Advances construction_status one step along DESIGN -> PERMIT -> BUILD -> COMPLETE; project.version += 1. equipment_status is untouched."]
    errors: [ERR_PROJECT_NOT_FOUND, ERR_PROJECT_INVALID_STATE, ERR_FACILITY_SCOPE_VIOLATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/installation-projects/{id}/advance-equipment
    roles: [FacilityDirector]
    input: []
    output: InstallationProject
    side_effects: ["Advances equipment_status one step along AWAITING_DELIVERY -> DELIVERED -> INSTALLED -> COMMISSIONED; project.version += 1. construction_status is untouched and is never read."]
    errors: [ERR_PROJECT_NOT_FOUND, ERR_PROJECT_INVALID_STATE, ERR_FACILITY_SCOPE_VIOLATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/installation-projects/{id}/go-live
    roles: [FacilityDirector]
    input: []
    output: InstallationProject
    side_effects:
      - "Join step: requires construction_status in {NOT_REQUIRED, COMPLETE} AND equipment_status == COMMISSIONED AND request.status == FUNDED AND the predecessor (when set) COMMISSIONED."
      - "go_live_at = logical clock now; project.version += 1."
      - "request FUNDED -> IMPLEMENTED; request.version += 1."
    errors: [ERR_PROJECT_NOT_FOUND, ERR_PROJECT_INVALID_STATE, ERR_REQUEST_INVALID_STATE, ERR_FACILITY_SCOPE_VIOLATION, ERR_PREDECESSOR_NOT_COMMISSIONED, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/installation-projects/{id}/cancel
    roles: [CapitalPlanner]
    input: ["cancellation_reason?"]
    output: InstallationProject
    side_effects:
      - "record_status ACTIVE -> CANCELLED; project.version += 1."
      - "The project's downtime and construction intervals stop occupying their resources, so a later project or PATCH may claim overlapping windows."
    errors: [ERR_PROJECT_NOT_FOUND, ERR_PROJECT_INVALID_STATE, ERR_UNAUTHORIZED]

  # ---- UtilizationAudit ---------------------------------------------------
  - method: POST
    path: /capital/requests/{id}/audits
    roles: [ComplianceAuditor]
    input: [installation_project_id, audit_window_start, audit_window_end]
    output: UtilizationAudit
    side_effects:
      - "Creates a UtilizationAudit in SCHEDULED with projected_annual_volume_snapshot and baseline_year1_opex_snapshot pinned from the request, actuals and both percentages null, version 1."
    errors: [ERR_VALIDATION, ERR_REQUEST_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_INVALID_INTERVAL, ERR_AUDIT_WINDOW_INVALID, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/audits/{id}/collect
    roles: [ComplianceAuditor]
    input: [actual_annual_volume, actual_annual_opex_cents]
    output: UtilizationAudit
    side_effects:
      - "Runs business_case_variance; writes the actuals, volume_attainment_pct, opex_variance_pct and status PASSED | UNDERPERFORMING; audit.version += 1."
      - "request IMPLEMENTED -> AUDITED; request.version += 1."
      - "CASCADE on UNDERPERFORMING: department.utilization_penalty_points = min(20, current + 10), department.underperformance_flag = true, department.version += 1; then every request of that department in status SCORED whose cycle is in SCORING or ALLOCATED is re-scored (PriorityScore reason DEPARTMENT_PENALTY_CHANGE) with request.version += 1 and its cycle's expedited_count refreshed."
    errors: [ERR_VALIDATION, ERR_AUDIT_NOT_FOUND, ERR_AUDIT_INVALID_STATE, ERR_REQUEST_INVALID_STATE, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/audits/{id}
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: []
    output: UtilizationAudit
    errors: [ERR_AUDIT_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/audits
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["request_id?", "installation_project_id?", "status?", "limit?", "offset?"]
    output: UtilizationAudit[]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]

