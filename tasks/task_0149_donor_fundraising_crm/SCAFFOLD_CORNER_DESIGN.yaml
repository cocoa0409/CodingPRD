      - name: refund_match_paid_blocks
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_MATCH_PAID_BLOCKS_REFUND]"]
        distinguishing_aspect: "Refunding a gift that has a PAID MatchClaim returns ERR_MATCH_PAID_BLOCKS_REFUND (409)."
        test_recipe:
          setup: ["OPEN campaign; donor with employer; gift 100000 ACKNOWLEDGED; match PAID"]
