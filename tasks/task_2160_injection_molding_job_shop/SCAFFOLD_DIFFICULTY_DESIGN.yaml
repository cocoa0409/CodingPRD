        grounds:
          - calculations.regrind_ratio_control
          - entities.Mold.fields.approved_max_regrind_bp
          - entities.ProductionReport.fields.instantaneous_regrind_bp
          - errors[ERR_REGRIND_RATIO_EXCEEDED]
          - validations[priority=19]
        distinguishing_aspect: |
          Boundary metric one: a NUMERIC RATIO threshold reached through POST
          /production-reports. 8000 g regrind in 40 000 g total is exactly 2000 bp and is
          accepted because the gate is <=, while 1001 g in 5000 g is 2002 bp and is rejected,
          even though the resulting cumulative ratio would still round to exactly 2000 bp.
