  - section: validations
    instances:
      - name: deactivate_unknown_clinician_as_nurse_returns_forbidden_role
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=40]
          - roles.ComplianceOfficer.exclusive_operations
        distinguishing_aspect: "A NurseCaseManager calling the officer-only deactivate route with a non-existent clinician id is stopped by priority 20 with ERR_FORBIDDEN_ROLE (403), not by priority 40 with ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Facility with a NURSE and a REHAB_PHYSICIAN clinician; no clinician carries the id used in the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "200036", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { nurse_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Paul Physician", credential: "REHAB_PHYSICIAN", npi: "1000000002" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { phys_id: $.data.id }
          trigger:
            - call: "POST /clinicians/00000000-0000-0000-0000-000000000000/deactivate"
              payload: {}
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"
            - "HTTP status of the trigger response == 403"
            - "GET /clinicians?facility_id=${fac_id} returns total_count == 2"
            - "Clinician.${nurse_id}.status == ACTIVE"
