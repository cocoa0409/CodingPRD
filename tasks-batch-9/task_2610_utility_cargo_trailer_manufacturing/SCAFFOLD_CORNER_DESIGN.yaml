              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit2_id}/systems-install"
              payload: { stage: "BRAKE_AND_AXLE", installed_braked_axle_count: 1, breakaway_kit_installed: true }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit2_id}/road-tests"
              payload: { lane_id: "${lane_id}", window_start_at: "2026-08-04T12:00:00Z", window_end_at: "2026-08-04T13:00:00Z", protocol_code: "STANDARD_20MI" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { rt2_id: $.data.id }
            - call: "POST /road-tests/${rt2_id}/result"
              payload: { brake_stop_distance_ft: 32.5, lighting_check_passed: true, result_notes: "within spec" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000103", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit3_id: $.data.id }
            - call: "POST /trailer-units/${unit1_id}/certification-label"
              payload: { tire_size_code: "ST205/75R15" }
              as: CertificationOfficer
              as_user_id: "co-2"
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", po_ref: "PO-10001", stocking_program: "STOCK" }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { order_id: $.data.id }
            - call: "POST /dealer-orders/${order_id}/allocation"
              payload: { expected_dealer_version: "${dealer_v0}" }
              as: SalesAdmin
              as_user_id: "sa-1"
          trigger:
            - call: "POST /dealer-orders/${order_id}/delivery"
              payload: { delivery_note: "hauled by dealer" }
              as: SalesAdmin
              as_user_id: "sa-1"
          assert:
            - "Response status is 200 and DealerOrder.${order_id}.status == DELIVERED"
            - "TrailerUnit.${unit1_id}.build_status == SHIPPED and warranty_start_date == 2026-08-01T00:00:00.000Z"
            - "TrailerModel.${model_id}.active_unit_count == 2  # down from 3; SN-000102 and SN-000103 remain"
            - "TrailerUnit.${unit1_id}.model_id == ${model_id} and gvwr_lbs == 6300  # the row is intact"
            - "DealerOrder.${order_id}.floor_plan_status == DRAWN  # delivery does not repay the floor plan"
            - "Dealer.${dealer_id}.floor_plan_outstanding_cents == 521460"
      - name: layer_cascading_side_effects_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.RoadTest.SCHEDULED_to_FAILED
        excluded_because:
          difficulty_instance: transitive_cascade / road_test_failure_cascades_to_label_order_and_dealer
          rationale: "That instance verifies all four hops of the failure cascade from a single result call, including the dealer ledger."
      - name: layer_cascade_ordering_is_sensitive_to_the_child_state
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.TrailerModel.IN_ENGINEERING_REVIEW_to_DRAFT
        excluded_because:
          difficulty_instance: transitive_cascade / model_revision_cascades_to_units_reservations_and_jig_minutes
          rationale: "That instance drives the three-hop revision cascade over two units and asserts the jig minutes decrement per released window."
      - name: layer_dual_variant_gvwr_produces_two_stored_values
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.gvwr_rating.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / gvwr_provisional_estimate_versus_certified_final
          rationale: "That instance stores both variants on one model row and pins the delta and the pinned unit snapshot."
      - name: layer_dual_variant_warranty_delta_on_the_coverage_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.warranty_reimbursement.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / warranty_in_warranty_full_versus_goodwill_prorated
          rationale: "That instance approves two otherwise identical claims across the expiry boundary and pins both payouts."
  - section: Consistency Model
    instances:
      - name: consistency_allocation_response_already_carries_every_derived_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /dealer-orders/{id}/allocation]
          - endpoints[GET /dealer-orders/{id}]
          - endpoints[GET /dealers/{id}]
        distinguishing_aspect: |
          The model is immediate, so the allocation response itself must already contain the pinned invoice, the
          selected unit and the new floor-plan draw - no read-after-write settling is permitted - and three
          independent GETs taken straight afterwards must agree field for field, including the dealer's recomputed
          balances and the unit's cross-aggregate back-reference.
        test_recipe:
          setup:
            - "Unit SN-000101 RELEASED_TO_STOCK with an ISSUED label; dealer DLR-001 ACTIVE with a 200000000 limit."
            - "Order PO-10001 PENDING for model TA-7X14 under stocking_program STOCK."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "capacities verified" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /weld-jigs"
              payload: { jig_code: "JIG-TA-01", frame_design_code: "TA", changeover_buffer_min: 45 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { jig_id: $.data.id, jig_v0: $.data.version }
            - call: "POST /test-lanes"
              payload: { lane_code: "LANE-01", surface_type: "ASPHALT", max_concurrent_tests: 2 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { lane_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "DLR-001", name: "Prairie Trailer Sales", labor_rate_cents_per_hour: 9500, floor_plan_limit_cents: 200000000, allocation_quota_per_month: 5 }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { dealer_id: $.data.id, dealer_v0: $.data.version }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000101", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit_id: $.data.id }
            - call: "POST /weld-jigs/${jig_id}/jig-reservations"
              payload: { unit_id: "${unit_id}", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T11:00:00Z", expected_weld_jig_version: "${jig_v0}" }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/frame-inspections"
              payload: { measured_length_mm: 4267, measured_width_mm: 2134, diagonal_a_mm: 4770, diagonal_b_mm: 4770, critical_weld_defect_count: 0, non_critical_weld_defect_count: 0 }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "LIGHTING", stop_tail_turn_lamp_count: 2, clearance_lamp_count: 0, side_marker_lamp_count: 2, license_plate_lamp_count: 1, reflex_reflector_count: 4 }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "BRAKE_AND_AXLE", installed_braked_axle_count: 1, breakaway_kit_installed: true }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/road-tests"
              payload: { lane_id: "${lane_id}", window_start_at: "2026-08-04T10:00:00Z", window_end_at: "2026-08-04T11:00:00Z", protocol_code: "STANDARD_20MI" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { road_test_id: $.data.id }
            - call: "POST /road-tests/${road_test_id}/result"
              payload: { brake_stop_distance_ft: 32.5, lighting_check_passed: true, result_notes: "within spec" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /trailer-units/${unit_id}/certification-label"
              payload: { tire_size_code: "ST205/75R15" }
              as: CertificationOfficer
              as_user_id: "co-2"
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", po_ref: "PO-10001", stocking_program: "STOCK" }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /dealer-orders/${order_id}/allocation"
              payload: { expected_dealer_version: "${dealer_v0}" }
              as: SalesAdmin
              as_user_id: "sa-1"
            - call: "GET /dealer-orders/${order_id}"
              payload: {}
              as: SalesAdmin
              as_user_id: "sa-1"
            - call: "GET /dealers/${dealer_id}"
              payload: {}
              as: SalesAdmin
              as_user_id: "sa-1"
            - call: "GET /trailer-units/${unit_id}"
              payload: {}
              as: SalesAdmin
              as_user_id: "sa-1"
          assert:
            - "The allocation response body already carries status ALLOCATED, allocated_unit_id ${unit_id}, invoice_subtotal_cents 489900, volume_discount_cents 0, freight_cents 89500, invoice_total_cents 579400 and floor_plan_draw_cents 521460"
            - "The immediate GET /dealer-orders/${order_id} returns identical values for all seven of those fields"
            - "The immediate GET /dealers/${dealer_id} shows floor_plan_outstanding_cents 521460, floor_plan_available_cents 199478540 and allocations_current_month_count 1"
            - "The immediate GET /trailer-units/${unit_id} shows build_status ALLOCATED and dealer_order_id ${order_id}"
            - "No field differs between the write response and any of the three reads"
      - name: consistency_reversal_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.DealerOrder.ALLOCATED_to_CANCELLED
        excluded_because:
          difficulty_instance: compensating_invariant / order_cancellation_restores_the_floor_plan_sum_exactly
          rationale: "That instance reads the restored dealer balances in the cancellation response itself, with no re-read tolerance."
