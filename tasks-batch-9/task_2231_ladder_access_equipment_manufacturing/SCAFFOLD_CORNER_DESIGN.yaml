          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      trigger:
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-OTHER
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          pdup: $.data.id
      assert:
      - HTTP status == 409
      - response.data.error_id == ERR_DUPLICATE_KEY
      - GET /ladder-ops/products returns total_count 1
  - name: pagination_limit_above_maximum_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=7]
    - errors[ERR_INVALID_PAGINATION]
    distinguishing_aspect: limit is bounded to 1..100 inclusive, so 101 is refused and 0 is refused, while a negative offset is refused too — none of them silently clamps to the default 10.
    test_recipe:
      setup:
      - One product exists.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      trigger:
      - call: GET /ladder-ops/products
        payload:
          limit: 101
        as: ComplianceOfficer
      - call: GET /ladder-ops/products
        payload:
          limit: 0
        as: ComplianceOfficer
      - call: GET /ladder-ops/products
        payload:
          offset: -1
        as: ComplianceOfficer
      assert:
      - the limit=101 call returns HTTP 400 with error_id ERR_INVALID_PAGINATION
      - the limit=0 call returns HTTP 400 with error_id ERR_INVALID_PAGINATION
      - the offset=-1 call returns HTTP 400 with error_id ERR_INVALID_PAGINATION
