  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: acknowledge_resolved_by_unpaged_state_beats_safety
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INCIDENT_NOT_TRIGGERED]
          - errors[ERR_RESPONDER_NOT_PAGED]
        distinguishing_aspect: |
          A single acknowledge request that BOTH fails the priority-6 state check (the
          incident is already RESOLVED, not TRIGGERED) AND the priority-8 business_safety
          check (the acting responder R2 was never paged) returns the higher-priority
          ERR_INCIDENT_NOT_TRIGGERED, not ERR_RESPONDER_NOT_PAGED; the pair is state (6)
          vs business_safety (8).
        test_recipe:
          setup:
            - "Incident paged R1, acknowledged by R1, then RESOLVED; R2 exists but was never paged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R1", email: "r1@x.com", sms_number: "+15550008" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R2", email: "r2@x.com", sms_number: "+15550108" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r1_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r1_id}"
            - call: "POST /incidents/${inc_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r1_id}"
          trigger:
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Incident.${inc_id}.lifecycle_status == 'RESOLVED' (confirms state precondition violated)"
            - "response error_id == 'ERR_INCIDENT_NOT_TRIGGERED' (state priority 6 wins over unpaged-safety priority 8)"

      - name: schedule_shift_invalid_request_beats_invalid_interval
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_INTERVAL]
        distinguishing_aspect: |
          A single POST /schedule-shifts that BOTH omits the required responder_id
          (priority-4 business_constraint) AND has ends_at <= starts_at (priority-5
          business_temporal) returns the higher-priority ERR_INVALID_REQUEST, not
          ERR_INVALID_INTERVAL; the pair is business_constraint (4) vs business_temporal
          (5) — a different error-category pair than the state-vs-safety conflict above.
        test_recipe:
          setup:
            - "A schedule Sch exists; a single create call violates both request-shape and interval rules."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", starts_at: "2026-06-01T12:00:00Z", ends_at: "2026-06-01T11:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == 'ERR_INVALID_REQUEST' (request-shape priority 4 wins over interval priority 5; responder_id missing)"

      - name: publish_postmortem_safety_beats_state_when_both_off
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_POSTMORTEM_NOT_IN_REVIEW]
