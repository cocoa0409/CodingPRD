          Interval semantics: CLOSED date intervals per agency, where sharing a
          single endpoint day is an overlap (2026-06-30..2026-07-31 against an
          existing 2026-06-01..2026-06-30 is rejected) but starting the day
          after is not (2026-07-01..2026-07-31 is accepted). The contended
          resource is the Agency's reporting calendar.
