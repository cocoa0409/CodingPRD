            - { call: "POST /specimens", payload: { donor_id: "${donor_id}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { spec_id: "$.data.id" } }
            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-10" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${spec_id}", payload: {}, as: CatalogManager, captures: { inv_id: "$.data[0].id", inv_v: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "Fam A", contact_email: "a@x.com" }, as: CatalogManager, captures: { rcp_a: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${rcp_a}", donor_id: "${donor_id}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${rcp_a}", captures: { con_a: "$.data.id" } }
            - { call: "POST /recipient-consents/${con_a}/sign", payload: {}, as: Recipient, as_user_id: "${rcp_a}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${rcp_a}", inventory_id: "${inv_id}", vial_count: 1, expected_inventory_version: "${inv_v}" }, as: Recipient, as_user_id: "${rcp_a}", captures: { res_a: "$.data.id" } }
