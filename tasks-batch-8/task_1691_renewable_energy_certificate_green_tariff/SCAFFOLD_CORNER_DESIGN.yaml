  - section: consistency_model
    instances:
      - name: immediate_consistency_after_mint
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.rec_minting_carryover"]
        distinguishing_aspect: "Immediate consistency: the mint-run response, the certificate list, and the holder account's derived holdings all reflect the mint within the same request sequence — no eventual-consistency lag."
        test_recipe:
          setup: ["Generator ACTIVE; one 2500-kWh July reading accepted"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 2500 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
              captures: { m_count: $.data.minted_count, m_carry: $.data.carryover_kwh }
            - call: "GET /greenpower/certificates?generator_id=${g}"
              as: RegistryAdmin
              captures: { c: "$.data[0].id" }
            - call: "GET /greenpower/accounts?generator_id=${g}"
              as: RegistryAdmin
              captures: { gacc_hold: "$.data[0].active_holdings_mwh" }
          assert:
            - "mint-run response: minted_count == 2, carryover_kwh == 500 (2500 = 2*1000 + 500)"
            - "immediately after: GET /certificates?generator_id returns exactly 1 certificate with quantity_mwh == 2, serial range [1,2]"
            - "immediately after: the GENERATOR account active_holdings_mwh == 2 (derived field already reconciled)"
            - "MeterReading.${r1}.minted == true and minted_vintage_month == '2026-07'"
