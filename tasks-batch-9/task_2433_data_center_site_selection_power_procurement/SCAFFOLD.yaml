scenario: |
  Generate task harder than expert level!

  2433. Data Center Site Selection & Power Procurement (hyperscale site selection team): site
  screening on power availability, transmission capacity, land, water, fiber routes and natural
  hazard exposure, utility load study, interconnection application and energization timeline
  commitments, tax incentive negotiation with state and local authorities including sales tax
  exemptions and abatements, community engagement, zoning approvals and noise/visual impact
  mitigation, water use planning for cooling with drought contingency, renewable energy
  procurement through power purchase agreements matched to load, phased land acquisition with
  option agreements, construction labor market and workforce availability analysis
domain_name: hyperscale-site-selection-power-procurement
api_prefix: "/"   # flat topology: every resource collection is a top-level path segment

complexity_profile:
  difficulty_level: expert_plus   # above the §0.4 Expert band: 10 entities / 41 endpoints / 45 errors / 15 calculations / 38 validations / 7 state machines / 6 roles
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit FK fields in request bodies.
  # No entity is nested inside another entity's URL path for identity purposes; the four
  # `/candidate-sites/{id}/<child>` and `/interconnection-applications/{id}/<child>` GETs exist
  # only as reverse-reachability read paths, never as the child's identity.

  state_machine_shape: cyclic
  # IncentiveNegotiation cycles COMPANY_OFFER_PENDING <-> AUTHORITY_COUNTER_PENDING across
  # negotiation rounds; InterconnectionApplication cycles CAPACITY_RESERVED -> SUBMITTED on a
  # utility capacity revision; ZoningApplication self-loops CONTINUED -> CONTINUED and forks
  # SUBMITTED -> {APPROVED_WITH_CONDITIONS, CONTINUED, DENIED}; SitingProgram.program_status is
  # a compound field derived from its sites and their applications.

  relationship_patterns:
    - one_to_many          # SitingProgram -> CandidateSite; CandidateSite -> InterconnectionApplication / ZoningApplication / IncentiveNegotiation / LandParcelOption
    - self_referential     # LandParcelOption.replaces_option_id -> LandParcelOption.id (option supersede chain)
    - cross_aggregate      # CandidateSite -> Utility and -> WaterSource; PowerPurchaseAgreement -> SitingProgram
    - polymorphic: false

  role_model: segregation_of_duties
  # The X-User-ID that screened a site MUST NOT commit it; the X-User-ID that signed an
  # incentive term sheet MUST NOT ratify it. Opaque operator ids may hold more than one role,
  # so both rules are black-box testable by replaying the same X-User-ID under a second role.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: SitingProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: program label, e.g. "Hyperscale Alpha"
      - name: target_load_mw
        type: number
        source: input
        description: contracted IT load the program must energize, in MW
        constraints: "> 0"
      - name: required_energization_date
        type: datetime
        source: input
        description: contractual date by which the committed site must be energized
      - name: capital_budget_usd
        type: number
        source: input
        description: capital ceiling checked against CandidateSite.site_capital_commitment_usd at commit
        constraints: ">= 0"
      - name: program_annual_load_mwh
        type: number
        source: computed
        description: "round(target_load_mw * 8760 * PROGRAM_LOAD_FACTOR, 3); denominator of renewable_coverage_pct"
      - name: program_status
        type: enum
        source: computed
        description: compound status derived from this program's sites and their applications (calculations.program_status_rollup)
        default: SCREENING
        constraints: "SCREENING | SITE_COMMITTED | ENERGIZATION_SECURED | STALLED"
      - name: committed_load_mw
        type: number
        source: computed
        description: "sum of InterconnectionApplication.requested_mw over applications whose status == ENERGIZATION_COMMITTED and whose site.program_id == this program"
        default: 0
      - name: renewable_coverage_pct
        type: number
        source: computed
        description: "round(100 * sum(PowerPurchaseAgreement.credited_coverage_mwh where status == EXECUTED and program_id == this program) / program_annual_load_mwh, 2)"
        default: 0
      - name: option_exposure_usd
        type: number
        source: computed
        description: "sum of LandParcelOption.option_premium_usd where status == OPTIONED, over options of this program's sites"
        default: 0
      - name: forfeited_premium_usd
        type: number
        source: computed
        description: "sum of LandParcelOption.option_premium_usd where status IN {LAPSED, RELEASED}, over options of this program's sites"
        default: 0
      - name: capitalized_premium_usd
        type: number
        source: computed
        description: "sum of LandParcelOption.option_premium_usd where status == EXERCISED, over options of this program's sites"
        default: 0
      - name: premium_committed_total_usd
        type: number
        source: computed
        description: "sum of LandParcelOption.option_premium_usd over ALL options of this program's sites, regardless of status; conserved quantity of calculations.option_premium_ledger"
        default: 0
      - name: full_land_control_site_count
        type: integer
        source: computed
        description: "count of CandidateSite rows with program_id == this program, status IN {DRAFT, SCREENED, COMMITTED} and land_control_status == FULL"
        default: 0

  - name: Utility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: serving utility name
      - name: state_code
        type: string
        source: input
        description: two-letter state code of the utility's service territory
        constraints: "exactly 2 uppercase letters"
      - name: balancing_authority
        type: string
        source: input
        description: balancing authority code the utility settles into
      - name: total_transmission_capacity_mw
        type: number
        source: input
        description: total deliverable transmission capacity at the point of interconnection, in MW
        constraints: "> 0"
      - name: reserved_capacity_mw
        type: number
        source: computed
        description: "peak buffered-window group demand: the largest, over applications with this utility_id and status IN {CAPACITY_RESERVED, ENERGIZATION_COMMITTED}, of that application's requested_mw plus the requested_mw of every other such application whose buffered window overlaps it (calculations.utility_capacity_ledger); 0 when none are reserved"
        default: 0
      - name: available_capacity_mw
        type: number
        source: computed
        description: "round(total_transmission_capacity_mw - reserved_capacity_mw, 3); conserved quantity of calculations.utility_capacity_ledger, never negative because the reserve-capacity admission test bounds the same group demand"
      - name: interconnect_study_fee_per_mw_usd
        type: number
        source: input
        description: study fee rate charged per requested MW at submit
        constraints: ">= 0"
      - name: network_upgrade_rate_usd_per_mw
        type: number
        source: input
        description: network upgrade cost rate per diversified peak MW
        constraints: ">= 0"
      - name: commissioning_buffer_days
        type: integer
        source: input
        description: days of commissioning buffer added to BOTH ends of every energization window when testing transmission overlap
        default: 90
        constraints: ">= 0"
      - name: energization_lead_days
        type: integer
        source: input
        description: minimum days between capacity reservation and the committed energization date
        constraints: ">= 0"
      - name: queue_policy
        type: enum
        source: input
        description: ranking policy used by calculations.interconnection_queue_position
        default: FIRST_COME_FIRST_SERVED
        constraints: "FIRST_COME_FIRST_SERVED | FIRST_READY_FIRST_SERVED"

  - name: WaterSource
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: water source / basin name
      - name: basin_code
        type: string
        source: input
        description: regulator basin identifier
      - name: state_code
        type: string
        source: input
        description: two-letter state code of the permitting authority
        constraints: "exactly 2 uppercase letters"
      - name: annual_permitted_mgal
        type: number
        source: input
        description: annual permitted withdrawal in million gallons before drought curtailment
        constraints: "> 0"
      - name: drought_stage
        type: enum
        source: system
        description: current drought stage, advanced or relaxed only by POST /water-sources/{id}/drought-declarations
        default: NORMAL
        constraints: "NORMAL | STAGE_1 | STAGE_2 | STAGE_3"
      - name: stage_curtailment_pct
        type: number
        source: computed
        description: "STAGE_CURTAILMENT[drought_stage] constant lookup (NORMAL 0.00, STAGE_1 0.10, STAGE_2 0.30, STAGE_3 0.55)"
        default: 0
      - name: effective_supply_mgal
        type: number
        source: computed
        description: "round(annual_permitted_mgal * (1 - stage_curtailment_pct), 3)"
      - name: committed_annual_demand_mgal
        type: number
        source: computed
        description: "sum of CandidateSite.annual_water_demand_mgal over sites with this water_source_id and status IN {SCREENED, COMMITTED}"
        default: 0
      - name: last_declaration_effective_date
        type: datetime
        source: system
        description: effective_date of the most recent drought declaration; null before the first declaration

  - name: CandidateSite
    parent: SitingProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> SitingProgram.id; the program this candidate competes in
      - name: utility_id
        type: string
        source: input
        description: FK -> Utility.id; serving utility whose transmission capacity this site draws on
      - name: water_source_id
        type: string
        source: input
        description: FK -> WaterSource.id; basin supplying cooling water for this site
      - name: name
        type: string
        source: input
        description: site label
      - name: state_code
        type: string
        source: input
        description: two-letter state code
        constraints: "exactly 2 uppercase letters"
      - name: county
        type: string
        source: input
        description: county / local jurisdiction name
      - name: gross_acres
        type: number
        source: input
        description: total acreage the campus needs; denominator of land_control_pct
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: site lifecycle status
        default: DRAFT
        constraints: "DRAFT | SCREENED | COMMITTED | DISQUALIFIED"
      - name: transmission_headroom_mw
        type: number
        source: input
        description: headroom the developer measured at the nearest substation, supplied at POST /candidate-sites/{id}/screen; null before screening
        constraints: ">= 0"
      - name: fiber_route_count
        type: integer
        source: input
        description: count of physically diverse long-haul fiber routes reaching the parcel, supplied at screen
        constraints: ">= 0"
      - name: seismic_hazard_index
        type: number
        source: input
        description: normalized seismic hazard exposure supplied at screen
        constraints: "0.0 .. 1.0"
      - name: flood_hazard_index
        type: number
        source: input
        description: normalized flood hazard exposure supplied at screen
        constraints: "0.0 .. 1.0"
      - name: wind_hazard_index
        type: number
        source: input
        description: normalized wind/tornado hazard exposure supplied at screen
        constraints: "0.0 .. 1.0"
      - name: craft_labor_supply_index
        type: integer
        source: input
        description: available local construction craft headcount within the labor shed, supplied at screen
        constraints: ">= 0"
      - name: construction_peak_headcount
        type: integer
        source: input
        description: peak construction craft headcount the build requires, supplied at screen
        constraints: "> 0"
      - name: wage_premium_pct
        type: number
        source: input
        description: wage premium over the local prevailing craft wage required to staff the build, supplied at screen
        constraints: ">= 0"
      - name: cooling_type
        type: enum
        source: input
        description: cooling design supplied at screen
        constraints: "EVAPORATIVE | AIR_COOLED | HYBRID"
      - name: annual_water_demand_mgal
        type: number
        source: input
        description: annual cooling water demand in million gallons supplied at screen; MUST be exactly 0 when cooling_type == AIR_COOLED
        constraints: ">= 0"
      - name: hazard_tier
        type: enum
        source: computed
        description: "tier from max(seismic_hazard_index, flood_hazard_index, wind_hazard_index) per calculations.site_screening_score"
        constraints: "LOW | MODERATE | SEVERE"
      - name: workforce_availability_ratio
        type: number
        source: computed
        description: "round(craft_labor_supply_index / construction_peak_headcount, 4)"
      - name: water_headroom_mgal
        type: number
        source: computed
        description: "round(water_source.effective_supply_mgal - (sum of annual_water_demand_mgal over OTHER sites on the same water_source_id with status IN {SCREENED, COMMITTED}), 3)"
      - name: water_feasible
        type: boolean
        source: computed
        description: "annual_water_demand_mgal <= water_headroom_mgal (inclusive at equality); recomputed on drought declarations and on sibling-site screen/disqualify"
        default: false
      - name: screening_score
        type: number
        source: computed
        description: "0..100 weighted score from calculations.site_screening_score; null before screening, frozen at screen time and never re-derived afterwards"
      - name: energization_risk_tier
        type: enum
        source: computed
        description: "tier from calculations.energization_risk_tier; recomputed on this site's application status changes and on serving-utility capacity changes"
        default: ON_TRACK
        constraints: "ON_TRACK | AT_RISK | BREACHED"
      - name: land_control_pct
        type: number
        source: computed
        description: "round(min(100.0, 100 * sum(LandParcelOption.acres where status IN {OPTIONED, EXERCISED}) / gross_acres), 2)"
        default: 0
      - name: land_control_status
        type: enum
        source: computed
        description: "FULL if land_control_pct >= 100, NONE if land_control_pct == 0, else PARTIAL"
        default: NONE
        constraints: "NONE | PARTIAL | FULL"
      - name: site_capital_commitment_usd
        type: number
        source: computed
        description: "aggregate capital exposure of this site per calculations.site_capital_commitment; checked against SitingProgram.capital_budget_usd at commit"
        default: 0
      - name: screened_by_user_id
        type: string
        source: system
        description: X-User-ID that filed the screening; the segregation-of-duties comparand at commit
      - name: committed_by_user_id
        type: string
        source: system
        description: X-User-ID that committed the site; null until COMMITTED
      - name: disqualification_reason
        type: string
        source: input
        description: reason recorded when the site moves to DISQUALIFIED; null otherwise

  - name: InterconnectionApplication
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> CandidateSite.id; site whose load this application serves
      - name: utility_id
        type: string
        source: input
        description: FK -> Utility.id; MUST equal the site's utility_id
      - name: requested_mw
        type: number
        source: input
        description: nameplate MW requested from the utility queue
        constraints: "> 0"
      - name: window_start
        type: datetime
        source: input
        description: first date of the requested energization window (CLOSED interval start)
      - name: window_end
        type: datetime
        source: input
        description: last date of the requested energization window (CLOSED interval end); MUST be > window_start
      - name: status
        type: enum
        source: system
        description: interconnection lifecycle status
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | STUDY_COMPLETE | CAPACITY_RESERVED | ENERGIZATION_COMMITTED | WITHDRAWN"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of POST /interconnection-applications/{id}/submit; primary queue sort key
      - name: queue_position
        type: integer
        source: computed
        description: "1-based rank within the serving utility's queue per calculations.interconnection_queue_position; 0 while status == DRAFT or WITHDRAWN"
        default: 0
      - name: study_round
        type: integer
        source: system
        description: count of LoadStudy rows filed against this application
        default: 0
      - name: diversified_peak_mw
        type: number
        source: computed
        description: "diversified_peak_mw of the newest LoadStudy of this application (max study_round; tie-break created_at DESC); null before the first study"
      - name: study_fee_usd
        type: number
        source: computed
        description: "round(requested_mw * utility.interconnect_study_fee_per_mw_usd, 2), stamped at submit"
        default: 0
      - name: network_upgrade_cost_usd
        type: number
        source: computed
        description: "network_upgrade_cost_usd of the newest LoadStudy of this application"
        default: 0
      - name: reserved_mw
        type: number
        source: computed
        description: "requested_mw when status IN {CAPACITY_RESERVED, ENERGIZATION_COMMITTED}, else 0"
        default: 0
      - name: committed_energization_date
        type: datetime
        source: input
        description: date the utility commits to energize; null until ENERGIZATION_COMMITTED
      - name: delay_exposure_usd
        type: number
        source: computed
        description: "round(max(0, delay_days) * DELAY_PENALTY_USD_PER_DAY_PER_MW * requested_mw, 2) per calculations.energization_delay_exposure"
        default: 0
      - name: withdrawal_reason
        type: string
        source: input
        description: reason recorded on WITHDRAWN; null otherwise

  - name: LoadStudy
    parent: InterconnectionApplication
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> InterconnectionApplication.id; application this utility load study belongs to
      - name: study_round
        type: integer
        source: system
        description: 1-based round number, equal to the owning application's study_round after this row is appended
      - name: it_load_mw
        type: number
        source: input
        description: IT (server) load component in MW
        constraints: ">= 0"
      - name: cooling_load_mw
        type: number
        source: input
        description: mechanical cooling load component in MW
        constraints: ">= 0"
      - name: ancillary_load_mw
        type: number
        source: input
        description: lighting/office/ancillary load component in MW
        constraints: ">= 0"
      - name: diversity_factor
        type: number
        source: input
        description: coincidence factor applied to IT load by the utility study
        constraints: "> 0 and <= 1"
      - name: nameplate_peak_mw
        type: number
        source: computed
        description: "it_load_mw + cooling_load_mw + ancillary_load_mw (nameplate_stacked variant)"
      - name: diversified_peak_mw
        type: number
        source: computed
        description: "diversified_coincident variant of calculations.load_study_peak_load"
      - name: upgrade_required
        type: boolean
        source: computed
        description: "diversified_peak_mw > round(utility.total_transmission_capacity_mw * UPGRADE_TRIGGER_RATIO, 3)"
      - name: network_upgrade_cost_usd
        type: number
        source: computed
        description: "0.00 when upgrade_required is false, else round(diversified_peak_mw * utility.network_upgrade_rate_usd_per_mw * (1 + HAZARD_UPLIFT[site.hazard_tier]), 2)"
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID (== Utility.id) of the UtilityPlanner that filed the study

  - name: IncentiveNegotiation
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> CandidateSite.id; site the incentive package attaches to
      - name: authority_level
        type: enum
        source: input
        description: granting authority tier
        constraints: "STATE | LOCAL"
      - name: counterparty_name
        type: string
        source: input
        description: granting authority name
      - name: status
        type: enum
        source: system
        description: status names the party expected to act next, or the executed stage
        default: DRAFT
        constraints: "DRAFT | AUTHORITY_COUNTER_PENDING | COMPANY_OFFER_PENDING | SIGNED | RATIFIED"
      - name: round_count
        type: integer
        source: system
        description: number of rounds recorded via POST /incentive-negotiations/{id}/rounds
        default: 0
      - name: last_party
        type: enum
        source: system
        description: party that submitted the most recent round; null before the first round
        constraints: "COMPANY | AUTHORITY"
      - name: sales_tax_exemption_pct
        type: number
        source: input
        description: fraction of equipment sales tax exempted by the standing terms
        constraints: "0.0 .. 1.0"
      - name: abatement_years
        type: integer
        source: input
        description: property tax abatement term in whole years under the standing terms
        constraints: "1 .. 30"
      - name: abatement_pct
        type: number
        source: input
        description: fraction of annual property tax abated under the standing terms
        constraints: "0.0 .. 1.0"
      - name: jobs_commitment
        type: integer
        source: input
        description: permanent jobs the company commits to; drives CLAWBACK_SHARE selection
        constraints: ">= 0"
      - name: capex_commitment_usd
        type: number
        source: input
        description: capital investment the company commits to; drives the sales-tax rate tier
        constraints: "> 0"
      - name: npv_incentive_usd
        type: number
        source: computed
        description: "round(sales_tax_benefit_usd + abatement_npv_usd, 2) per calculations.incentive_npv"
        default: 0
      - name: sales_tax_benefit_usd
        type: number
        source: computed
        description: "round(capex_commitment_usd * EQUIPMENT_SHARE * tier_rate * sales_tax_exemption_pct, 2)"
        default: 0
      - name: abatement_npv_usd
        type: number
        source: computed
        description: "sum of the per-year values, each already rounded to cents (rounding order pinned in calculations.incentive_npv)"
        default: 0
      - name: clawback_exposure_usd
        type: number
        source: computed
        description: "round(npv_incentive_usd * CLAWBACK_SHARE, 2) where CLAWBACK_SHARE is 0.40 when jobs_commitment >= 100 else 0.60"
        default: 0
      - name: signed_by_user_id
        type: string
        source: system
        description: X-User-ID that signed the term sheet; the segregation-of-duties comparand at ratify
      - name: ratified_by_user_id
        type: string
        source: system
        description: X-User-ID that ratified the term sheet; null until RATIFIED

  - name: ZoningApplication
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> CandidateSite.id; site seeking the zoning approval
      - name: jurisdiction
        type: string
        source: input
        description: municipality or county board hearing the application
      - name: hearing_date
        type: datetime
        source: input
        description: scheduled public hearing date
      - name: noise_limit_dba
        type: number
        source: input
        description: ordinance property-line noise limit in dBA
        constraints: "> 0"
      - name: projected_noise_dba
        type: number
        source: input
        description: modelled property-line noise from the campus in dBA
        constraints: "> 0"
      - name: visual_mitigation_tier
        type: enum
        source: input
        description: visual/acoustic mitigation the applicant offers
        constraints: "NONE | BERM | BERM_AND_SCREENING | FULL_ENCLOSURE"
      - name: status
        type: enum
        source: system
        description: zoning docket status
        default: SUBMITTED
        constraints: "SUBMITTED | CONTINUED | APPROVED_WITH_CONDITIONS | DENIED"
      - name: continuance_count
        type: integer
        source: system
        description: number of CONTINUED decisions recorded so far
        default: 0
      - name: objection_count
        type: integer
        source: computed
        description: count of objections recorded via POST /zoning-applications/{id}/community-objections
        default: 0
      - name: weighted_opposition_score
        type: number
        source: computed
        description: "round(sum of OBJECTION_WEIGHT[objection_type] over recorded objections, 2)"
        default: 0
      - name: noise_excess_dba
        type: number
        source: computed
        description: "max(0, projected_noise_dba - noise_limit_dba)"
        default: 0
      - name: required_mitigation_tier
        type: enum
        source: computed
        description: "tier demanded by noise_excess_dba and weighted_opposition_score per calculations.zoning_mitigation_and_escrow"
        default: NONE
        constraints: "NONE | BERM | BERM_AND_SCREENING | FULL_ENCLOSURE"
      - name: mitigation_cost_usd
        type: number
        source: computed
        description: "round(TIER_BASE[required_mitigation_tier] + noise_excess_dba * DBA_UNIT_COST, 2)"
        default: 0
      - name: conditions_escrow_usd
        type: number
        source: computed
        description: "round(mitigation_cost_usd * escrow_pct, 2) where escrow_pct is tiered on mitigation_cost_usd (evaluation order pinned)"
        default: 0
      - name: decision_note
        type: string
        source: input
        description: free-text note recorded with the most recent decision; null before the first decision

  - name: PowerPurchaseAgreement
    parent: SitingProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> SitingProgram.id; portfolio whose load this PPA is matched against
      - name: counterparty_name
        type: string
        source: input
        description: generator / offtake counterparty
      - name: technology
        type: enum
        source: input
        description: generation technology; selects the CURTAILMENT constant
        constraints: "SOLAR | WIND | STORAGE_HYBRID | NUCLEAR"
      - name: contracted_capacity_mw
        type: number
        source: input
        description: nameplate capacity under contract in MW
        constraints: "> 0"
      - name: annual_generation_mwh
        type: number
        source: input
        description: expected annual generation in MWh (basis of the ANNUAL_VOLUMETRIC variant)
        constraints: "> 0"
      - name: hourly_matched_mwh
        type: number
        source: input
        description: subset of annual generation delivered in load-coincident hours (basis of the HOURLY_MATCHED variant)
        constraints: ">= 0 and <= annual_generation_mwh"
      - name: strike_price_usd_per_mwh
        type: number
        source: input
        description: contract strike price per MWh
        constraints: "> 0"
      - name: matching_mode
        type: enum
        source: input
        description: which variant of calculations.ppa_credited_coverage credits this PPA
        constraints: "ANNUAL_VOLUMETRIC | HOURLY_MATCHED"
      - name: delivery_start
        type: datetime
        source: input
        description: first delivery date
      - name: delivery_end
        type: datetime
        source: input
        description: last delivery date; MUST be > delivery_start
      - name: status
        type: enum
        source: system
        description: PPA lifecycle status
        default: DRAFT
        constraints: "DRAFT | EXECUTED"
      - name: credited_coverage_mwh
        type: number
        source: computed
        description: "MWh credited toward the program's renewable coverage per the matching_mode variant; 0 while status == DRAFT"
        default: 0
      - name: annual_cost_usd
        type: number
        source: computed
        description: "round(annual_generation_mwh * strike_price_usd_per_mwh, 2)"
        default: 0

  - name: LandParcelOption
    parent: CandidateSite
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> CandidateSite.id; site whose campus footprint this parcel belongs to
      - name: replaces_option_id
        type: string
        source: input
        description: FK -> LandParcelOption.id; prior option this one supersedes, which is moved to RELEASED; null for a first-time option
      - name: parcel_apn
        type: string
        source: input
        description: assessor parcel number; exclusivity windows are tested per (site_id, parcel_apn)
      - name: phase_index
        type: integer
        source: input
        description: acquisition phase this parcel belongs to
        constraints: ">= 1"
      - name: acres
        type: number
        source: input
        description: parcel acreage counted toward land_control_pct
        constraints: "> 0"
      - name: option_premium_usd
        type: number
        source: input
        description: non-refundable option premium paid at signing
        constraints: ">= 0"
      - name: purchase_price_usd
        type: number
        source: input
        description: strike price to buy the parcel on exercise
        constraints: "> 0"
      - name: premium_credit_pct
        type: number
        source: input
        description: fraction of option_premium_usd credited against purchase_price_usd on exercise
        default: 0.5
        constraints: "0.0 .. 1.0"
      - name: window_start
        type: datetime
        source: input
        description: first instant of the exclusivity window (HALF-OPEN interval start, inclusive)
      - name: window_end
        type: datetime
        source: input
        description: exclusive upper bound of the exclusivity window (HALF-OPEN interval end); MUST be > window_start
      - name: status
        type: enum
        source: system
        description: option lifecycle status
        default: OPTIONED
        constraints: "OPTIONED | EXERCISED | LAPSED | RELEASED"
      - name: premium_credited_usd
        type: number
        source: computed
        description: "round(option_premium_usd * premium_credit_pct, 2) once EXERCISED, else 0"
        default: 0
      - name: net_purchase_usd
        type: number
        source: computed
        description: "round(purchase_price_usd - premium_credited_usd, 2) once EXERCISED, else 0"
        default: 0
      - name: exercised_at
        type: datetime
        source: system
        description: logical-clock instant of exercise; null otherwise
      - name: lapsed_at
        type: datetime
        source: system
        description: logical-clock instant at which an option-expiry sweep lapsed this option; null otherwise

state_machines:
  - entity: SitingProgram
    initial_state: SCREENING
    terminal_states: []
    note: |
      Compound machine: program_status is never set by a request body. It is re-derived by
      calculations.program_status_rollup at the end of every request that mutates any
      CandidateSite of the program, any InterconnectionApplication of one of those sites, any
      LandParcelOption of one of those sites, or any PowerPurchaseAgreement of the program.
    transitions:
      - from: SCREENING
        to: SITE_COMMITTED
        trigger: "system re-derivation after POST /candidate-sites/{id}/commit"
        actor: system
        preconditions:
          - "exactly one CandidateSite with program_id == program.id has status == COMMITTED"
          - "that site has land_control_status == FULL, water_feasible == true and energization_risk_tier != BREACHED"
        side_effects:
          - "program_status = SITE_COMMITTED"
          - "recompute committed_load_mw, option_exposure_usd, forfeited_premium_usd, capitalized_premium_usd, premium_committed_total_usd, full_land_control_site_count"
          - "increments SitingProgram.version by 1"
      - from: SITE_COMMITTED
        to: ENERGIZATION_SECURED
        trigger: "system re-derivation after POST /interconnection-applications/{id}/commit-energization"
        actor: system
        preconditions:
          - "the COMMITTED site's non-terminal InterconnectionApplication has status == ENERGIZATION_COMMITTED"
          - "that site's energization_risk_tier == ON_TRACK"
        side_effects:
          - "program_status = ENERGIZATION_SECURED"
          - "recompute committed_load_mw"
          - "increments SitingProgram.version by 1"
      - from: SITE_COMMITTED
        to: STALLED
        trigger: "system re-derivation after any mutation that leaves the COMMITTED site impaired (POST /siting-programs/{id}/option-expiry-sweep, POST /water-sources/{id}/drought-declarations, POST /utilities/{id}/capacity-revisions)"
        actor: system
        preconditions:
          - "a CandidateSite with status == COMMITTED has land_control_status != FULL OR water_feasible == false OR energization_risk_tier == BREACHED"
        side_effects:
          - "program_status = STALLED"
          - "increments SitingProgram.version by 1"
      - from: ENERGIZATION_SECURED
        to: STALLED
        trigger: "system re-derivation after POST /utilities/{id}/capacity-revisions or POST /siting-programs/{id}/option-expiry-sweep impairs the committed site"
        actor: system
        preconditions:
          - "the COMMITTED site now has land_control_status != FULL OR water_feasible == false OR energization_risk_tier == BREACHED"
        side_effects:
          - "program_status = STALLED"
          - "increments SitingProgram.version by 1"
      - from: STALLED
        to: SITE_COMMITTED
        trigger: "system re-derivation after the impairment is cured (POST /parcel-options restoring land control, POST /water-sources/{id}/drought-declarations relaxing the stage)"
        actor: system
        preconditions:
          - "the COMMITTED site again has land_control_status == FULL, water_feasible == true and energization_risk_tier != BREACHED"
          - "that site's non-terminal InterconnectionApplication status != ENERGIZATION_COMMITTED"
        side_effects:
          - "program_status = SITE_COMMITTED"
          - "increments SitingProgram.version by 1"
      - from: SITE_COMMITTED
        to: SCREENING
        trigger: "system re-derivation after POST /candidate-sites/{id}/disqualify removes the last COMMITTED site"
        actor: system
        preconditions:
          - "no CandidateSite with program_id == program.id has status == COMMITTED"
        side_effects:
          - "program_status = SCREENING"
          - "recompute committed_load_mw and full_land_control_site_count"
          - "increments SitingProgram.version by 1"
      - from: STALLED
        to: SCREENING
        trigger: "system re-derivation after POST /candidate-sites/{id}/disqualify removes the last COMMITTED site"
        actor: system
        preconditions:
          - "no CandidateSite with program_id == program.id has status == COMMITTED"
        side_effects:
          - "program_status = SCREENING"
          - "increments SitingProgram.version by 1"

  - entity: WaterSource
    initial_state: NORMAL
    terminal_states: []
    note: "drought_stage may be advanced or relaxed to any other stage by a single declaration; NORMAL -> STAGE_2 -> NORMAL is a legal cycle."
    transitions:
      - from: NORMAL
        to: STAGE_1
        trigger: "POST /water-sources/{id}/drought-declarations"
        actor: PermittingAuthority
        preconditions:
          - "drought_stage != requested drought_stage"
          - "effective_date >= last_declaration_effective_date when a prior declaration exists"
        side_effects:
          - "stage_curtailment_pct = STAGE_CURTAILMENT[STAGE_1] = 0.10; recompute effective_supply_mgal"
          - "for every CandidateSite with this water_source_id and status IN {DRAFT, SCREENED, COMMITTED}: recompute water_headroom_mgal then water_feasible"
          - "for every such site whose water_feasible flipped to false: re-derive SitingProgram.program_status (STALLED when the site is COMMITTED)"
          - "increments WaterSource.version by 1"
      - from: STAGE_1
        to: STAGE_2
        trigger: "POST /water-sources/{id}/drought-declarations"
        actor: PermittingAuthority
        preconditions:
          - "drought_stage != requested drought_stage"
          - "effective_date >= last_declaration_effective_date"
        side_effects:
          - "stage_curtailment_pct = 0.30; recompute effective_supply_mgal; same site-level water_headroom_mgal / water_feasible cascade as above"
          - "increments WaterSource.version by 1"
      - from: NORMAL
        to: STAGE_2
        trigger: "POST /water-sources/{id}/drought-declarations"
        actor: PermittingAuthority
        preconditions:
          - "drought_stage != requested drought_stage"
        side_effects:
          - "stage_curtailment_pct = 0.30; recompute effective_supply_mgal; same site-level cascade"
          - "increments WaterSource.version by 1"
        note: "stages may be skipped in either direction; STAGE_3 (0.55) is reachable from any stage by the same transition shape."
      - from: STAGE_2
        to: STAGE_3
        trigger: "POST /water-sources/{id}/drought-declarations"
        actor: PermittingAuthority
        preconditions:
          - "drought_stage != requested drought_stage"
          - "effective_date >= last_declaration_effective_date"
        side_effects:
          - "stage_curtailment_pct = STAGE_CURTAILMENT[STAGE_3] = 0.55; recompute effective_supply_mgal; same site-level water_headroom_mgal / water_feasible cascade as above"
          - "increments WaterSource.version by 1"
      - from: STAGE_3
        to: STAGE_1
        trigger: "POST /water-sources/{id}/drought-declarations"
        actor: PermittingAuthority
        preconditions:
          - "drought_stage != requested drought_stage"
          - "effective_date >= last_declaration_effective_date"
        side_effects:
          - "stage_curtailment_pct = 0.10; recompute effective_supply_mgal; sites whose water_feasible flips back to true trigger SitingProgram.program_status re-derivation (STALLED -> SITE_COMMITTED when the COMMITTED site is cured)"
          - "increments WaterSource.version by 1"
      - from: STAGE_2
        to: NORMAL
        trigger: "POST /water-sources/{id}/drought-declarations"
        actor: PermittingAuthority
        preconditions:
          - "drought_stage != requested drought_stage"
        side_effects:
          - "stage_curtailment_pct = 0.00; recompute effective_supply_mgal"
          - "for every CandidateSite on this source: recompute water_headroom_mgal then water_feasible; sites whose water_feasible flips back to true trigger SitingProgram.program_status re-derivation (STALLED -> SITE_COMMITTED when the COMMITTED site is cured)"
          - "increments WaterSource.version by 1"

  - entity: CandidateSite
    initial_state: DRAFT
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: DRAFT
        to: SCREENED
        trigger: "POST /candidate-sites/{id}/screen"
        actor: SiteScreeningAnalyst
        preconditions:
          - "status == DRAFT"
          - "annual_water_demand_mgal == 0 when cooling_type == AIR_COOLED"
          - "construction_peak_headcount > 0"
        side_effects:
          - "persist the ten screening inputs; stamp screened_by_user_id = X-User-ID"
          - "compute hazard_tier, workforce_availability_ratio, water_headroom_mgal, water_feasible, screening_score (calculations.site_screening_score)"
          - "compute energization_risk_tier (calculations.energization_risk_tier)"
          - "recompute the serving WaterSource.committed_annual_demand_mgal, then recompute water_headroom_mgal and water_feasible on every OTHER site of that source with status IN {SCREENED, COMMITTED}"
          - "re-derive SitingProgram.program_status"
          - "increments CandidateSite.version by 1"
      - from: SCREENED
        to: COMMITTED
        trigger: "POST /candidate-sites/{id}/commit"
        actor: CapitalCommitteeChair
        preconditions:
          - "status == SCREENED"
          - "X-User-ID != screened_by_user_id (segregation of duties)"
          - "hazard_tier != SEVERE"
          - "the site's ZoningApplication (unique per validations priority 22) has status == APPROVED_WITH_CONDITIONS"
          - "no other CandidateSite with the same program_id has status == COMMITTED"
          - "land_control_pct >= 100"
          - "the site's IncentiveNegotiation with authority_level == STATE has status == RATIFIED"
          - "water_feasible == true"
          - "SitingProgram.renewable_coverage_pct >= MIN_RENEWABLE_COVERAGE_PCT"
          - "site_capital_commitment_usd <= SitingProgram.capital_budget_usd"
        side_effects:
          - "status = COMMITTED; stamp committed_by_user_id = X-User-ID"
          - "recompute site_capital_commitment_usd (calculations.site_capital_commitment)"
          - "re-derive SitingProgram.program_status (SCREENING -> SITE_COMMITTED)"
          - "increments CandidateSite.version by 1"
      - from: SCREENED
        to: DISQUALIFIED
        trigger: "POST /candidate-sites/{id}/disqualify, or the DENIED branch of POST /zoning-applications/{id}/decide"
        actor: PortfolioDirector | system
        preconditions:
          - "status IN {DRAFT, SCREENED, COMMITTED}"
        side_effects:
          - "status = DISQUALIFIED; persist disqualification_reason (\"ZONING_DENIED\" when driven by the zoning DENIED branch)"
          - "CASCADE hop 1 - the site's InterconnectionApplication with status IN {SUBMITTED, STUDY_COMPLETE, CAPACITY_RESERVED, ENERGIZATION_COMMITTED} moves to WITHDRAWN, withdrawal_reason = \"SITE_DISQUALIFIED\", reserved_mw = 0, queue_position = 0"
          - "CASCADE hop 2 - because that application released its reservation, the serving Utility.reserved_capacity_mw and Utility.available_capacity_mw are recomputed (calculations.utility_capacity_ledger)"
          - "CASCADE hop 3 - because the serving utility's available_capacity_mw changed, energization_risk_tier is recomputed on every OTHER CandidateSite with that utility_id and status IN {DRAFT, SCREENED, COMMITTED}"
          - "CASCADE hop 4 - because a sibling site's energization_risk_tier changed, SitingProgram.program_status is re-derived and full_land_control_site_count recomputed"
          - "every LandParcelOption of this site with status == OPTIONED moves to RELEASED (direct effect, not part of the hop chain), shifting its premium from SitingProgram.option_exposure_usd to forfeited_premium_usd"
          - "the serving WaterSource.committed_annual_demand_mgal is recomputed and water_feasible re-evaluated on its remaining sites (direct effect)"
          - "queue_position recomputed for every remaining application of the serving utility"
          - "increments CandidateSite.version by 1"
      - from: COMMITTED
        to: DISQUALIFIED
        trigger: "POST /candidate-sites/{id}/disqualify"
        actor: PortfolioDirector
        preconditions:
          - "status == COMMITTED"
        side_effects:
          - "identical cascade to the SCREENED -> DISQUALIFIED transition"
          - "SitingProgram.program_status re-derived to SCREENING because the program no longer has a COMMITTED site"
          - "increments CandidateSite.version by 1"
      - from: DRAFT
        to: DISQUALIFIED
        trigger: "POST /candidate-sites/{id}/disqualify"
        actor: PortfolioDirector
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "status = DISQUALIFIED; persist disqualification_reason; no application exists yet so the cascade stops after re-deriving SitingProgram.program_status"
          - "increments CandidateSite.version by 1"

  - entity: InterconnectionApplication
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    note: "Cyclic: CAPACITY_RESERVED -> SUBMITTED and STUDY_COMPLETE -> SUBMITTED are backward edges fired by a utility capacity revision, so an application can traverse SUBMITTED -> STUDY_COMPLETE -> CAPACITY_RESERVED -> SUBMITTED and forward again."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /interconnection-applications/{id}/submit"
        actor: SiteScreeningAnalyst
        preconditions:
          - "status == DRAFT"
          - "the site referenced by site_id has status == SCREENED"
        side_effects:
          - "status = SUBMITTED; submitted_at = current logical clock"
          - "study_fee_usd = round(requested_mw * utility.interconnect_study_fee_per_mw_usd, 2)"
          - "queue_position recomputed for every application of the serving utility (calculations.interconnection_queue_position)"
          - "recompute site.energization_risk_tier, then site.site_capital_commitment_usd"
          - "re-derive SitingProgram.program_status"
          - "increments InterconnectionApplication.version by 1"
      - from: SUBMITTED
        to: STUDY_COMPLETE
        trigger: "POST /interconnection-applications/{id}/load-studies"
        actor: UtilityPlanner
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID == utility_id"
        side_effects:
          - "append a LoadStudy row with study_round = study_round + 1; increment study_round"
          - "status = STUDY_COMPLETE; copy the new study's diversified_peak_mw and network_upgrade_cost_usd onto the application"
          - "recompute site.site_capital_commitment_usd"
          - "increments InterconnectionApplication.version by 1"
      - from: STUDY_COMPLETE
        to: STUDY_COMPLETE
        trigger: "POST /interconnection-applications/{id}/load-studies (restudy filed while already studied)"
        actor: UtilityPlanner
        preconditions:
          - "status == STUDY_COMPLETE"
          - "X-User-ID == utility_id"
        side_effects:
          - "append a LoadStudy row with the next study_round; the application's diversified_peak_mw and network_upgrade_cost_usd now mirror the NEW study"
          - "recompute site.site_capital_commitment_usd"
          - "increments InterconnectionApplication.version by 1"
      - from: STUDY_COMPLETE
        to: CAPACITY_RESERVED
        trigger: "POST /interconnection-applications/{id}/reserve-capacity"
        actor: UtilityPlanner
        preconditions:
          - "status == STUDY_COMPLETE"
          - "X-User-ID == utility_id"
          - "abs(requested_mw - diversified_peak_mw) / requested_mw <= RESTUDY_TOLERANCE"
          - "concurrent_mw + requested_mw <= utility.total_transmission_capacity_mw, where concurrent_mw is the buffered closed-interval aggregate of calculations.transmission_overlap_capacity"
        side_effects:
          - "status = CAPACITY_RESERVED; reserved_mw = requested_mw"
          - "recompute Utility.reserved_capacity_mw and Utility.available_capacity_mw"
          - "recompute site.energization_risk_tier for the owning site AND for every other site of the serving utility"
          - "re-derive SitingProgram.program_status"
          - "increments InterconnectionApplication.version by 1"
      - from: CAPACITY_RESERVED
        to: ENERGIZATION_COMMITTED
        trigger: "POST /interconnection-applications/{id}/commit-energization"
        actor: UtilityPlanner
        preconditions:
          - "status == CAPACITY_RESERVED"
          - "X-User-ID == utility_id"
          - "committed_energization_date >= window_start"
          - "committed_energization_date >= current logical clock + utility.energization_lead_days days"
          - "committed_energization_date <= program.required_energization_date + MAX_ENERGIZATION_DELAY_DAYS days"
        side_effects:
          - "status = ENERGIZATION_COMMITTED; persist committed_energization_date"
          - "delay_exposure_usd = calculations.energization_delay_exposure"
          - "recompute site.energization_risk_tier (BREACHED when committed_energization_date > program.required_energization_date)"
          - "re-derive SitingProgram.program_status and committed_load_mw"
          - "increments InterconnectionApplication.version by 1"
      - from: CAPACITY_RESERVED
        to: SUBMITTED
        trigger: "system, during POST /utilities/{id}/capacity-revisions"
        actor: system
        preconditions:
          - "status == CAPACITY_RESERVED"
          - "after the revision, concurrent_mw + requested_mw > revised_total_capacity_mw for this application"
        side_effects:
          - "status = SUBMITTED; reserved_mw = 0 (the reservation is released, the queue position is retained)"
          - "recompute Utility.reserved_capacity_mw and Utility.available_capacity_mw"
          - "recompute energization_risk_tier on every site of the serving utility"
          - "re-derive SitingProgram.program_status"
          - "increments InterconnectionApplication.version by 1"
      - from: ENERGIZATION_COMMITTED
        to: SUBMITTED
        trigger: "system, during POST /utilities/{id}/capacity-revisions"
        actor: system
        preconditions:
          - "status == ENERGIZATION_COMMITTED"
          - "after the revision, concurrent_mw + requested_mw > revised_total_capacity_mw for this application"
        side_effects:
          - "status = SUBMITTED; reserved_mw = 0; committed_energization_date = null; delay_exposure_usd = 0"
          - "recompute Utility.reserved_capacity_mw / available_capacity_mw, then energization_risk_tier on every site of the utility, then SitingProgram.program_status and committed_load_mw"
          - "increments InterconnectionApplication.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /interconnection-applications/{id}/withdraw"
        actor: SiteScreeningAnalyst
        preconditions:
          - "status IN {DRAFT, SUBMITTED, STUDY_COMPLETE, CAPACITY_RESERVED, ENERGIZATION_COMMITTED}"
        side_effects:
          - "status = WITHDRAWN; persist withdrawal_reason; reserved_mw = 0; queue_position = 0"
          - "recompute Utility.reserved_capacity_mw and Utility.available_capacity_mw"
          - "recompute queue_position for every remaining application of the serving utility"
          - "recompute site.energization_risk_tier and site.site_capital_commitment_usd"
          - "re-derive SitingProgram.program_status and committed_load_mw"
          - "increments InterconnectionApplication.version by 1"
      - from: CAPACITY_RESERVED
        to: WITHDRAWN
        trigger: "POST /interconnection-applications/{id}/withdraw"
        actor: SiteScreeningAnalyst
        preconditions:
          - "status == CAPACITY_RESERVED"
        side_effects:
          - "identical to the SUBMITTED -> WITHDRAWN side effects; releasing reserved_mw restores Utility.available_capacity_mw exactly (calculations.utility_capacity_ledger invariant)"
          - "increments InterconnectionApplication.version by 1"

  - entity: IncentiveNegotiation
    initial_state: DRAFT
    terminal_states: [RATIFIED]
    note: "Cyclic: AUTHORITY_COUNTER_PENDING -> COMPANY_OFFER_PENDING -> AUTHORITY_COUNTER_PENDING repeats once per negotiation round pair."
    transitions:
      - from: DRAFT
        to: AUTHORITY_COUNTER_PENDING
        trigger: "POST /incentive-negotiations/{id}/rounds with submitted_by_party == COMPANY"
        actor: IncentiveNegotiator
        preconditions:
          - "status IN {DRAFT, COMPANY_OFFER_PENDING}"
          - "the site referenced by site_id has status IN {DRAFT, SCREENED}"
        side_effects:
          - "persist the five term fields; round_count += 1; last_party = COMPANY; status = AUTHORITY_COUNTER_PENDING"
          - "recompute sales_tax_benefit_usd, abatement_npv_usd, npv_incentive_usd, clawback_exposure_usd (calculations.incentive_npv)"
          - "increments IncentiveNegotiation.version by 1"
      - from: AUTHORITY_COUNTER_PENDING
        to: COMPANY_OFFER_PENDING
        trigger: "POST /incentive-negotiations/{id}/rounds with submitted_by_party == AUTHORITY"
        actor: PermittingAuthority
        preconditions:
          - "status == AUTHORITY_COUNTER_PENDING"
        side_effects:
          - "persist the five counter-offer term fields; round_count += 1; last_party = AUTHORITY; status = COMPANY_OFFER_PENDING"
          - "recompute the four incentive money fields from the counter terms"
          - "increments IncentiveNegotiation.version by 1"
      - from: COMPANY_OFFER_PENDING
        to: AUTHORITY_COUNTER_PENDING
        trigger: "POST /incentive-negotiations/{id}/rounds with submitted_by_party == COMPANY (next round of the cycle)"
        actor: IncentiveNegotiator
        preconditions:
          - "status == COMPANY_OFFER_PENDING"
        side_effects:
          - "persist the five term fields; round_count += 1; last_party = COMPANY; status = AUTHORITY_COUNTER_PENDING"
          - "recompute the four incentive money fields"
          - "increments IncentiveNegotiation.version by 1"
      - from: COMPANY_OFFER_PENDING
        to: SIGNED
        trigger: "POST /incentive-negotiations/{id}/sign"
        actor: IncentiveNegotiator
        preconditions:
          - "status == COMPANY_OFFER_PENDING (an authority counter is on the table)"
          - "round_count >= MIN_NEGOTIATION_ROUNDS"
        side_effects:
          - "status = SIGNED; stamp signed_by_user_id = X-User-ID"
          - "increments IncentiveNegotiation.version by 1"
      - from: SIGNED
        to: RATIFIED
        trigger: "POST /incentive-negotiations/{id}/ratify"
        actor: CapitalCommitteeChair
        preconditions:
          - "status == SIGNED"
          - "X-User-ID != signed_by_user_id (segregation of duties)"
          - "the site's ZoningApplication has status == APPROVED_WITH_CONDITIONS"
        side_effects:
          - "status = RATIFIED; stamp ratified_by_user_id = X-User-ID"
          - "increments IncentiveNegotiation.version by 1"

  - entity: ZoningApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED_WITH_CONDITIONS, DENIED]
    note: "Branching fork with divergent side-effect sets per branch plus a CONTINUED self-loop: SUBMITTED -> {APPROVED_WITH_CONDITIONS, CONTINUED, DENIED} and CONTINUED -> {APPROVED_WITH_CONDITIONS, CONTINUED, DENIED}."
    transitions:
      - from: SUBMITTED
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /zoning-applications/{id}/decide with outcome == APPROVED_WITH_CONDITIONS"
        actor: PermittingAuthority
        preconditions:
          - "status IN {SUBMITTED, CONTINUED}"
          - "MITIGATION_RANK[visual_mitigation_tier] >= MITIGATION_RANK[required_mitigation_tier]"
        side_effects:
          - "status = APPROVED_WITH_CONDITIONS; persist decision_note"
          - "recompute mitigation_cost_usd then conditions_escrow_usd (calculations.zoning_mitigation_and_escrow, steps 4 then 5)"
          - "recompute site.site_capital_commitment_usd"
          - "increments ZoningApplication.version by 1"
      - from: SUBMITTED
        to: CONTINUED
        trigger: "POST /zoning-applications/{id}/decide with outcome == CONTINUED"
        actor: PermittingAuthority
        preconditions:
          - "status IN {SUBMITTED, CONTINUED}"
          - "continuance_count < MAX_ZONING_CONTINUANCES"
        side_effects:
          - "status = CONTINUED; continuance_count += 1; persist decision_note"
          - "recompute required_mitigation_tier, mitigation_cost_usd and conditions_escrow_usd; recompute site.site_capital_commitment_usd"
          - "increments ZoningApplication.version by 1"
      - from: CONTINUED
        to: CONTINUED
        trigger: "POST /zoning-applications/{id}/decide with outcome == CONTINUED (second continuance)"
        actor: PermittingAuthority
        preconditions:
          - "status == CONTINUED"
          - "continuance_count < MAX_ZONING_CONTINUANCES"
        side_effects:
          - "continuance_count += 1; persist decision_note; recompute the mitigation and escrow fields"
          - "increments ZoningApplication.version by 1"
      - from: CONTINUED
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /zoning-applications/{id}/decide with outcome == APPROVED_WITH_CONDITIONS after a continuance"
        actor: PermittingAuthority
        preconditions:
          - "status == CONTINUED"
          - "MITIGATION_RANK[visual_mitigation_tier] >= MITIGATION_RANK[required_mitigation_tier]"
        side_effects:
          - "identical to the SUBMITTED -> APPROVED_WITH_CONDITIONS side effects"
          - "increments ZoningApplication.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /zoning-applications/{id}/decide with outcome == DENIED"
        actor: PermittingAuthority
        preconditions:
          - "status IN {SUBMITTED, CONTINUED}"
        side_effects:
          - "status = DENIED; persist decision_note; mitigation_cost_usd and conditions_escrow_usd are left at their pre-decision values"
          - "the referenced CandidateSite transitions to DISQUALIFIED with disqualification_reason = \"ZONING_DENIED\", firing the full four-hop disqualification cascade declared on CandidateSite"
          - "increments ZoningApplication.version by 1"

  - entity: LandParcelOption
    initial_state: OPTIONED
    terminal_states: [EXERCISED, LAPSED, RELEASED]
    transitions:
      - from: OPTIONED
        to: EXERCISED
        trigger: "POST /parcel-options/{id}/exercise"
        actor: PortfolioDirector
        preconditions:
          - "status == OPTIONED"
          - "current logical clock < window_end (half-open window still open)"
          - "the site's InterconnectionApplication has status IN {CAPACITY_RESERVED, ENERGIZATION_COMMITTED}"
        side_effects:
          - "status = EXERCISED; exercised_at = current logical clock"
          - "premium_credited_usd = round(option_premium_usd * premium_credit_pct, 2); net_purchase_usd = round(purchase_price_usd - premium_credited_usd, 2)"
          - "shift option_premium_usd from SitingProgram.option_exposure_usd to SitingProgram.capitalized_premium_usd (calculations.option_premium_ledger; premium_committed_total_usd unchanged)"
          - "recompute site.land_control_pct then site.land_control_status then site.site_capital_commitment_usd"
          - "re-derive SitingProgram.program_status and full_land_control_site_count"
          - "increments LandParcelOption.version by 1"
      - from: OPTIONED
        to: LAPSED
        trigger: "system, during POST /siting-programs/{id}/option-expiry-sweep"
        actor: system
        preconditions:
          - "status == OPTIONED"
          - "current logical clock >= window_end"
        side_effects:
          - "CASCADE hop 1 - status = LAPSED; lapsed_at = current logical clock; option_premium_usd shifts from SitingProgram.option_exposure_usd to SitingProgram.forfeited_premium_usd, leaving premium_committed_total_usd unchanged"
          - "CASCADE hop 2 - because this option left the {OPTIONED, EXERCISED} set, site.land_control_pct is recomputed"
          - "CASCADE hop 3 - because land_control_pct changed, site.land_control_status is recomputed (FULL -> PARTIAL or NONE)"
          - "CASCADE hop 4 - because a site's land_control_status changed, SitingProgram.full_land_control_site_count is recomputed and program_status re-derived (SITE_COMMITTED -> STALLED when the impaired site is COMMITTED)"
          - "increments LandParcelOption.version by 1"
      - from: OPTIONED
        to: RELEASED
        trigger: "system, during POST /parcel-options with replaces_option_id set, or during POST /candidate-sites/{id}/disqualify"
        actor: system
        preconditions:
          - "status == OPTIONED"
        side_effects:
          - "status = RELEASED; option_premium_usd shifts from SitingProgram.option_exposure_usd to SitingProgram.forfeited_premium_usd"
          - "recompute site.land_control_pct, site.land_control_status, SitingProgram.full_land_control_site_count and program_status"
          - "increments LandParcelOption.version by 1"

concurrency_rules:
  - rule_id: parcel-option-supersede-stale-site
    parent_entity: CandidateSite
    write_endpoint: "POST /parcel-options"
    occ_field: "expected_site_version"
    description: |
      Creating a LandParcelOption against a CandidateSite whose version has advanced since the
      client last read it is rejected with a stale-version conflict. A supersede create (one
      carrying replaces_option_id) legitimately moves the prior option to RELEASED and rewrites
      the site's land_control_pct, so a writer holding an older view of the site would otherwise
      release an option it never saw and mis-state land control. The check compares
      expected_site_version against the site's current version integer.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

calculations:
  - name: site_screening_score
    trigger: "POST /candidate-sites/{id}/screen ONLY — screening_score is a point-in-time screening artifact and is NOT re-derived when a later drought declaration or a sibling site's screening changes this site's water_headroom_mgal (water_headroom_mgal and water_feasible ARE re-derived; screening_score is frozen)"
    algorithm: weighted_scoring
    formula: |
      max_hazard = max(seismic_hazard_index, flood_hazard_index, wind_hazard_index)
      hazard_tier = SEVERE   if max_hazard >= HAZARD_SEVERE_THRESHOLD
                    MODERATE if max_hazard >= HAZARD_MODERATE_THRESHOLD
                    LOW      otherwise
      power_component = WEIGHT_POWER * min(1.0, transmission_headroom_mw / program.target_load_mw)
      fiber_component = WEIGHT_FIBER * min(1.0, fiber_route_count / MIN_FIBER_ROUTES)
      water_component = WEIGHT_WATER                                     if annual_water_demand_mgal == 0
                        WEIGHT_WATER * max(0.0, min(1.0, water_headroom_mgal / annual_water_demand_mgal))  otherwise
      workforce_availability_ratio = round(craft_labor_supply_index / construction_peak_headcount, 4)
      workforce_component = WEIGHT_WORKFORCE * min(1.0, workforce_availability_ratio)
      if wage_premium_pct > WAGE_PREMIUM_THRESHOLD:
          workforce_component = workforce_component * WAGE_PENALTY_FACTOR
      land_component = WEIGHT_LAND * min(1.0, gross_acres / MIN_SITE_ACRES)
      raw = power_component + fiber_component + water_component + workforce_component
            + land_component - HAZARD_PENALTY[hazard_tier]
      screening_score = round(max(0.0, min(100.0, raw)), 2)
    input_set: "the site being screened, its SitingProgram (target_load_mw) and its WaterSource (effective_supply_mgal and the demand of OTHER sites with status IN {SCREENED, COMMITTED})"
    constants:
      WEIGHT_POWER: 30
      WEIGHT_FIBER: 15
      WEIGHT_WATER: 15
      WEIGHT_WORKFORCE: 25
      WEIGHT_LAND: 15
      MIN_FIBER_ROUTES: 3
      MIN_SITE_ACRES: 200
      WAGE_PREMIUM_THRESHOLD: 0.15
      WAGE_PENALTY_FACTOR: 0.8
      HAZARD_SEVERE_THRESHOLD: 0.70
      HAZARD_MODERATE_THRESHOLD: 0.40
      HAZARD_PENALTY: { LOW: 0, MODERATE: 6, SEVERE: 15 }
    precision: "screening_score 2 decimal places, round_half_up; workforce_availability_ratio 4 decimal places; component values are NOT rounded before summing"

  - name: load_study_peak_load
    trigger: "POST /interconnection-applications/{id}/load-studies"
    algorithm: threshold
    formula: |
      nameplate_peak_mw   = it_load_mw + cooling_load_mw + ancillary_load_mw
      diversified_peak_mw = round(it_load_mw * diversity_factor
                                  + cooling_load_mw * max(diversity_factor, COOLING_FLOOR_FACTOR)
                                  + ancillary_load_mw, 3)
      upgrade_trigger_mw  = round(utility.total_transmission_capacity_mw * UPGRADE_TRIGGER_RATIO, 3)
      upgrade_required    = diversified_peak_mw > upgrade_trigger_mw          # strict >, equality does NOT trigger
      network_upgrade_cost_usd = 0.00 if not upgrade_required else
          round(diversified_peak_mw * utility.network_upgrade_rate_usd_per_mw
                * (1 + HAZARD_UPLIFT[site.hazard_tier]), 2)
    input_set: "the single LoadStudy row being filed, plus the serving Utility and the owning CandidateSite (hazard_tier; HAZARD_UPLIFT defaults to 0.00 when hazard_tier is null because the site is unscreened)"
    constants:
      COOLING_FLOOR_FACTOR: 0.85
      UPGRADE_TRIGGER_RATIO: 0.50
      HAZARD_UPLIFT: { LOW: 0.00, MODERATE: 0.08, SEVERE: 0.20 }
    precision: "diversified_peak_mw 3 decimal places, money 2 decimal places, round_half_up"
    variants:
      - name: nameplate_stacked
        when: "reported as nameplate_peak_mw on every LoadStudy; the figure the developer requested capacity against"
        difference: "simple arithmetic sum of the three load components; the diversity_factor and the cooling floor are ignored entirely"
      - name: diversified_coincident
        when: "reported as diversified_peak_mw and used for upgrade_required, network_upgrade_cost_usd and the reserve-capacity restudy tolerance"
        difference: "IT load is scaled by diversity_factor, cooling load by max(diversity_factor, COOLING_FLOOR_FACTOR) so cooling never diversifies below the floor, ancillary load is undiversified; identical inputs therefore yield a strictly smaller (or equal) number than nameplate_stacked"

  - name: transmission_overlap_capacity
    trigger: "POST /interconnection-applications/{id}/reserve-capacity, and re-evaluated for every reserved application during POST /utilities/{id}/capacity-revisions"
    algorithm: interval_merge
    formula: |
      buffer = utility.commissioning_buffer_days
      # CLOSED intervals, buffer applied to BOTH ends of both intervals under test
      overlaps(a, b) = a.window_start <= b.window_end + buffer days
                       AND b.window_start <= a.window_end + buffer days
      concurrent_mw = sum(other.requested_mw
                          for other in applications of this utility
                          where other.id != this.id
                            and other.status IN {CAPACITY_RESERVED, ENERGIZATION_COMMITTED}
                            and overlaps(this, other))
      admissible = (concurrent_mw + this.requested_mw) <= utility.total_transmission_capacity_mw
    input_set: "applications of the same utility_id whose status IN {CAPACITY_RESERVED, ENERGIZATION_COMMITTED}; DRAFT, SUBMITTED, STUDY_COMPLETE and WITHDRAWN applications are excluded even when their windows overlap"
    constants:
      RESTUDY_TOLERANCE: 0.10   # gate applied alongside the overlap test at reserve-capacity
    precision: "MW compared at 3 decimal places; equality with total_transmission_capacity_mw is ADMISSIBLE (<=), one more MW is rejected"

  - name: utility_capacity_ledger
    trigger: "any transition that changes an application's membership of {CAPACITY_RESERVED, ENERGIZATION_COMMITTED}: reserve-capacity, commit-energization, withdraw, capacity-revisions, and the disqualification cascade"
    algorithm: aggregation
    formula: |
      live = applications of this utility with status IN {CAPACITY_RESERVED, ENERGIZATION_COMMITTED}
      # group demand uses the SAME buffered closed-interval overlap predicate as
      # calculations.transmission_overlap_capacity, so the admission test bounds this quantity
      group_mw(a) = a.requested_mw + sum(b.requested_mw for b in live
                                         where b.id != a.id and overlaps(a, b))
      reserved_capacity_mw  = 0 if live is empty else round(max(group_mw(a) for a in live), 3)
      available_capacity_mw = round(total_transmission_capacity_mw - reserved_capacity_mw, 3)
      INVARIANT: reserved_capacity_mw + available_capacity_mw == total_transmission_capacity_mw
                 after every request, including after a withdraw or a disqualification cascade
                 (full compensation, no drift); available_capacity_mw is never negative
    input_set: "all InterconnectionApplication rows sharing this utility_id; only the reserved and energization-committed ones enter `live`, and two live applications whose buffered windows do not overlap never inflate each other's group demand"
    constants: {}
    precision: "3 decimal places, round_half_up"

  - name: energization_delay_exposure
    trigger: "POST /interconnection-applications/{id}/commit-energization"
    algorithm: threshold
    formula: |
      delay_days = (committed_energization_date - program.required_energization_date) in whole days
      admissible = delay_days <= MAX_ENERGIZATION_DELAY_DAYS      # equality admissible
      delay_exposure_usd = round(max(0, delay_days) * DELAY_PENALTY_USD_PER_DAY_PER_MW
                                 * requested_mw, 2)
    input_set: "the application under commitment, its site's SitingProgram.required_energization_date"
    constants:
      MAX_ENERGIZATION_DELAY_DAYS: 90
      DELAY_PENALTY_USD_PER_DAY_PER_MW: 250
    precision: "2 decimal places, round_half_up; an early or on-time commitment yields exactly 0.00"

  - name: energization_risk_tier
    trigger: "recomputed on every application status change of the site, on every serving-utility capacity change, and at screen time"
    algorithm: constraint_propagation
    formula: |
      app = the site's InterconnectionApplication with status != WITHDRAWN
            (at most one exists; uniqueness enforced by validations priority 26)
      if app exists and app.status == ENERGIZATION_COMMITTED
             and app.committed_energization_date > program.required_energization_date:
          energization_risk_tier = BREACHED
      elif (app is absent or app.status IN {DRAFT, SUBMITTED, STUDY_COMPLETE})
             and utility.available_capacity_mw < program.target_load_mw:
          energization_risk_tier = AT_RISK
      else:
          energization_risk_tier = ON_TRACK
    input_set: "the site, its non-withdrawn application, its serving Utility and its SitingProgram; first matching branch wins"
    constants: {}
    precision: "enum, no rounding; MW comparison at 3 decimal places"

  - name: incentive_npv
    trigger: "POST /incentive-negotiations/{id}/rounds (every round, from either party's terms)"
    algorithm: tiered_pricing
    formula: |
      tier_rate = SALES_TAX_TIER_LOW  if capex_commitment_usd <  TIER_MID_FLOOR_USD
                  SALES_TAX_TIER_MID  if capex_commitment_usd <  TIER_HIGH_FLOOR_USD
                  SALES_TAX_TIER_HIGH otherwise                      # >= is the HIGH tier
      sales_tax_benefit_usd = round(capex_commitment_usd * EQUIPMENT_SHARE
                                    * tier_rate * sales_tax_exemption_pct, 2)
      annual_base = capex_commitment_usd * ASSESSED_RATIO * MILL_RATE * abatement_pct
      # ROUNDING ORDER IS PINNED: each year is rounded to cents FIRST, then the years are summed.
      # Summing the unrounded years and rounding once at the end is WRONG and can differ by cents.
      abatement_npv_usd = sum( round(annual_base / (1 + DISCOUNT_RATE) ** y, 2)
                               for y in 1 .. abatement_years )
      npv_incentive_usd = round(sales_tax_benefit_usd + abatement_npv_usd, 2)
      clawback_share = CLAWBACK_SHARE_HIGH_JOBS if jobs_commitment >= JOBS_THRESHOLD
                       else CLAWBACK_SHARE_LOW_JOBS
      clawback_exposure_usd = round(npv_incentive_usd * clawback_share, 2)
    input_set: "the five standing term fields of this negotiation only; sibling negotiations of the same site never contribute"
    constants:
      EQUIPMENT_SHARE: 0.62
      ASSESSED_RATIO: 0.85
      MILL_RATE: 0.0225
      DISCOUNT_RATE: 0.07
      SALES_TAX_TIER_LOW: 0.0625
      SALES_TAX_TIER_MID: 0.0550
      SALES_TAX_TIER_HIGH: 0.0475
      TIER_MID_FLOOR_USD: 500000000
      TIER_HIGH_FLOOR_USD: 1500000000
      JOBS_THRESHOLD: 100
      CLAWBACK_SHARE_HIGH_JOBS: 0.40
      CLAWBACK_SHARE_LOW_JOBS: 0.60
      MIN_NEGOTIATION_ROUNDS: 2   # a term sheet cannot be signed before one company offer and one authority counter
    precision: "2 decimal places, round_half_up, applied per abatement year before summation"

  - name: zoning_mitigation_and_escrow
    trigger: "POST /zoning-applications/{id}/community-objections (recomputes the tier preview) and POST /zoning-applications/{id}/decide (finalizes cost and escrow on the APPROVED_WITH_CONDITIONS and CONTINUED branches)"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - weighted community opposition
      weighted_opposition_score = round(sum(OBJECTION_WEIGHT[o.objection_type]
                                            for o in recorded objections), 2)
      # STEP 2 - acoustic excess
      noise_excess_dba = max(0, projected_noise_dba - noise_limit_dba)
      # STEP 3 - required tier: first matching branch wins, either driver can escalate alone
      required_mitigation_tier =
          FULL_ENCLOSURE      if noise_excess_dba >= 10 or weighted_opposition_score >= 12
          BERM_AND_SCREENING  if noise_excess_dba >= 5  or weighted_opposition_score >= 6
          BERM                if noise_excess_dba >  0  or weighted_opposition_score >= 3
          NONE                otherwise
      # STEP 4 - cost = tier base plus a per-dBA adder on the acoustic excess only
      mitigation_cost_usd = round(TIER_BASE[required_mitigation_tier]
                                  + noise_excess_dba * DBA_UNIT_COST, 2)
      # STEP 5 - escrow percentage is tiered on the COST computed in step 4, not on the tier
      escrow_pct = 0.00 if mitigation_cost_usd == 0
                   ESCROW_PCT_SMALL if mitigation_cost_usd <  ESCROW_MID_FLOOR_USD
                   ESCROW_PCT_MID   if mitigation_cost_usd <  ESCROW_HIGH_FLOOR_USD
                   ESCROW_PCT_LARGE otherwise
      conditions_escrow_usd = round(mitigation_cost_usd * escrow_pct, 2)
    input_set: "this zoning application and its recorded community objections; objections on sibling applications of the same site never contribute"
    constants:
      OBJECTION_WEIGHT: { NOISE: 1.5, TRAFFIC: 1.0, VISUAL: 1.2, WATER: 2.0 }
      TIER_BASE: { NONE: 0, BERM: 750000, BERM_AND_SCREENING: 2100000, FULL_ENCLOSURE: 5400000 }
      DBA_UNIT_COST: 125000
      ESCROW_PCT_SMALL: 0.10
      ESCROW_PCT_MID: 0.15
      ESCROW_PCT_LARGE: 0.20
      ESCROW_MID_FLOOR_USD: 1000000
      ESCROW_HIGH_FLOOR_USD: 4000000
      MITIGATION_RANK: { NONE: 0, BERM: 1, BERM_AND_SCREENING: 2, FULL_ENCLOSURE: 3 }
      MAX_ZONING_CONTINUANCES: 2
    precision: "2 decimal places, round_half_up; a cost of exactly 1000000.00 falls in the ESCROW_PCT_MID band because the SMALL band is a strict <"

  - name: ppa_credited_coverage
    trigger: "POST /power-purchase-agreements/{id}/execute, and re-aggregated onto SitingProgram.renewable_coverage_pct on the same request"
    algorithm: aggregation
    formula: |
      curtailment = CURTAILMENT[technology]
      credited_coverage_mwh =
          round(annual_generation_mwh * (1 - curtailment), 3)      if matching_mode == ANNUAL_VOLUMETRIC
          round(hourly_matched_mwh * HOURLY_DELIVERABILITY, 3)     if matching_mode == HOURLY_MATCHED
      annual_cost_usd = round(annual_generation_mwh * strike_price_usd_per_mwh, 2)
      program_annual_load_mwh = round(program.target_load_mw * HOURS_PER_YEAR
                                      * PROGRAM_LOAD_FACTOR, 3)
      renewable_coverage_pct = round(100 * sum(credited_coverage_mwh
                                               for PPAs of this program where status == EXECUTED)
                                     / program_annual_load_mwh, 2)
      commit_admissible = renewable_coverage_pct >= MIN_RENEWABLE_COVERAGE_PCT   # equality admissible
    input_set: "PowerPurchaseAgreement rows of the program whose status == EXECUTED; DRAFT PPAs credit exactly 0 and are excluded from the numerator"
    constants:
      CURTAILMENT: { SOLAR: 0.06, WIND: 0.11, STORAGE_HYBRID: 0.04, NUCLEAR: 0.01 }
      HOURLY_DELIVERABILITY: 0.98
      HOURS_PER_YEAR: 8760
      PROGRAM_LOAD_FACTOR: 0.90
      MIN_RENEWABLE_COVERAGE_PCT: 80.0
    precision: "MWh 3 decimal places, percentages 2 decimal places, money 2 decimal places, round_half_up"
    variants:
      - name: annual_volumetric
        when: "matching_mode == ANNUAL_VOLUMETRIC — annual energy matching, the whole contracted output counts subject to a technology curtailment haircut"
        difference: "credits annual_generation_mwh net of CURTAILMENT[technology]; the hourly_matched_mwh field is stored but ignored"
      - name: hourly_matched
        when: "matching_mode == HOURLY_MATCHED — 24/7 carbon-free matching, only load-coincident hours count"
        difference: "credits hourly_matched_mwh scaled by HOURLY_DELIVERABILITY and ignores both annual_generation_mwh and the technology curtailment, so the same PPA row credits a materially different MWh figure under the two modes"

  - name: option_premium_ledger
    trigger: "POST /parcel-options, POST /parcel-options/{id}/exercise, POST /siting-programs/{id}/option-expiry-sweep, and the disqualification cascade"
    algorithm: aggregation
    formula: |
      option_exposure_usd       = sum(option_premium_usd where status == OPTIONED)
      forfeited_premium_usd     = sum(option_premium_usd where status IN {LAPSED, RELEASED})
      capitalized_premium_usd   = sum(option_premium_usd where status == EXERCISED)
      premium_committed_total_usd = sum(option_premium_usd over ALL statuses)
      INVARIANT: option_exposure_usd + forfeited_premium_usd + capitalized_premium_usd
                 == premium_committed_total_usd  after every request
      # per-option money on exercise
      premium_credited_usd = round(option_premium_usd * premium_credit_pct, 2)
      net_purchase_usd     = round(purchase_price_usd - premium_credited_usd, 2)
    input_set: "all LandParcelOption rows belonging to CandidateSite rows of this SitingProgram, regardless of site status"
    constants: {}
    precision: "2 decimal places, round_half_up; every status change moves a premium between buckets and never creates or destroys value"

  - name: land_control_rollup
    trigger: "POST /parcel-options, exercise, the expiry sweep, and the disqualification cascade"
    algorithm: aggregation
    formula: |
      controlled_acres = sum(acres for options of this site where status IN {OPTIONED, EXERCISED})
      land_control_pct = round(min(100.0, 100 * controlled_acres / gross_acres), 2)
      land_control_status = FULL   if land_control_pct >= 100
                            NONE   if land_control_pct == 0
                            PARTIAL otherwise
      full_land_control_site_count = count(sites of the program with
                                           status IN {DRAFT, SCREENED, COMMITTED}
                                           and land_control_status == FULL)
    input_set: "LandParcelOption rows of the site with status IN {OPTIONED, EXERCISED}; LAPSED and RELEASED options drop out of the numerator immediately"
    constants: {}
    precision: "2 decimal places, round_half_up; land_control_pct is capped at 100.00 even when optioned acreage exceeds gross_acres"

  - name: water_headroom_and_feasibility
    trigger: "POST /candidate-sites/{id}/screen, POST /water-sources/{id}/drought-declarations, and the disqualification cascade"
    algorithm: constraint_propagation
    formula: |
      stage_curtailment_pct = STAGE_CURTAILMENT[drought_stage]
      effective_supply_mgal = round(annual_permitted_mgal * (1 - stage_curtailment_pct), 3)
      other_demand_mgal     = sum(annual_water_demand_mgal for OTHER sites on this water source
                                  with status IN {SCREENED, COMMITTED})
      water_headroom_mgal   = round(effective_supply_mgal - other_demand_mgal, 3)
      water_feasible        = annual_water_demand_mgal <= water_headroom_mgal   # equality feasible
      committed_annual_demand_mgal = sum(annual_water_demand_mgal for sites on this source
                                         with status IN {SCREENED, COMMITTED})
    input_set: "sites sharing the water_source_id with status IN {SCREENED, COMMITTED}; DRAFT and DISQUALIFIED sites never consume headroom"
    constants:
      STAGE_CURTAILMENT: { NORMAL: 0.00, STAGE_1: 0.10, STAGE_2: 0.30, STAGE_3: 0.55 }
    precision: "3 decimal places, round_half_up"

  - name: interconnection_queue_position
    trigger: "POST /interconnection-applications/{id}/submit, POST /interconnection-applications/{id}/withdraw, and the disqualification cascade"
    algorithm: chronological
    formula: |
      ranked = applications of this utility with status IN
               {SUBMITTED, STUDY_COMPLETE, CAPACITY_RESERVED, ENERGIZATION_COMMITTED}
      if utility.queue_policy == FIRST_COME_FIRST_SERVED:
          sort ranked by (submitted_at ASC, created_at ASC)
      else:  # FIRST_READY_FIRST_SERVED
          sort ranked by (site.screening_score DESC, submitted_at ASC, created_at ASC)
      queue_position = 1-based index in ranked; 0 for DRAFT and WITHDRAWN applications
    input_set: "non-draft, non-withdrawn applications of the same utility; positions are dense and contiguous, so a withdrawal closes the gap"
    constants: {}
    precision: "integer; ties broken by created_at ASC and never by id"

  - name: site_capital_commitment
    trigger: "recomputed on submit, load-studies, withdraw, zoning decide, parcel-option create/exercise/lapse and at commit"
    algorithm: aggregation
    formula: |
      app = the site's InterconnectionApplication with status != WITHDRAWN (0 or 1 row)
      zoning = the site's ZoningApplication (0 or 1 row)
      site_capital_commitment_usd = round(
            (app.study_fee_usd            if app    else 0)
          + (app.network_upgrade_cost_usd if app    else 0)
          + (zoning.mitigation_cost_usd   if zoning else 0)
          + (zoning.conditions_escrow_usd if zoning else 0)
          + sum(net_purchase_usd  for options of this site where status == EXERCISED)
          + sum(option_premium_usd for options of this site where status == OPTIONED), 2)
    input_set: "the site's non-withdrawn application, its zoning application, and its options with status IN {OPTIONED, EXERCISED}; LAPSED and RELEASED premiums are sunk and excluded"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: program_status_rollup
    trigger: "end of every request that mutates a CandidateSite, an InterconnectionApplication, a LandParcelOption, a PowerPurchaseAgreement or a WaterSource touching this program"
    algorithm: projection
    formula: |
      committed = the CandidateSite of this program with status == COMMITTED (0 or 1 row)
      program_status =                                          # FIRST MATCH WINS, in this order
          STALLED             if committed exists and (committed.land_control_status != FULL
                                                       or committed.water_feasible == false
                                                       or committed.energization_risk_tier == BREACHED)
          ENERGIZATION_SECURED if committed exists and committed's non-withdrawn application
                                                       has status == ENERGIZATION_COMMITTED
          SITE_COMMITTED       if committed exists
          SCREENING            otherwise
      committed_load_mw = sum(requested_mw for applications of this program's sites
                              where status == ENERGIZATION_COMMITTED)
    input_set: "all CandidateSite rows of the program plus their non-withdrawn applications and options; DISQUALIFIED sites are excluded from every branch"
    constants: {}
    precision: "enum plus a 3-decimal MW total; the STALLED test precedes the ENERGIZATION_SECURED test so an impaired but energization-committed site reports STALLED"

validations:
  - priority: 1
    category: auth
    check: "both X-User-ID and X-User-Role headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND is listed in the target endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for the entity_backed role UtilityPlanner, X-User-ID equals the Utility.id that owns the addressed resource (the application's utility_id, or the utility in the path)"
    error_id: ERR_UTILITY_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /utilities/{id}/capacity-revisions, POST /interconnection-applications/{id}/load-studies, POST /interconnection-applications/{id}/reserve-capacity, POST /interconnection-applications/{id}/commit-energization"
  - priority: 4
    category: business_constraint
    check: "request body schema: every required field present, types correct, enums within their declared value sets, numeric ranges respected (target_load_mw > 0, indices within 0.0..1.0, diversity_factor in (0,1], abatement_years 1..30, percentages 0.0..1.0, state_code exactly 2 uppercase letters, pagination limit 1..100 and offset >= 0); unknown body fields and any attempt to set a computed or system field are ignored, not rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 5
    category: business_temporal
    check: "interval ordering: InterconnectionApplication.window_end > window_start, PowerPurchaseAgreement.delivery_end > delivery_start, LandParcelOption.window_end > window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /interconnection-applications, POST /power-purchase-agreements, POST /parcel-options"
  - priority: 6
    category: business_temporal
    check: "a new LandParcelOption's window_start is not earlier than the current logical clock"
    error_id: ERR_OPTION_WINDOW_BACKDATED
    http_status: 422
    applies_to: "POST /parcel-options"
  - priority: 7
    category: existence
    check: "every path id resolves, validated left-to-right: siting-programs -> ERR_PROGRAM_NOT_FOUND, utilities -> ERR_UTILITY_NOT_FOUND, water-sources -> ERR_WATER_SOURCE_NOT_FOUND, candidate-sites -> ERR_SITE_NOT_FOUND, interconnection-applications -> ERR_APPLICATION_NOT_FOUND, incentive-negotiations -> ERR_NEGOTIATION_NOT_FOUND, zoning-applications -> ERR_ZONING_APPLICATION_NOT_FOUND, power-purchase-agreements -> ERR_PPA_NOT_FOUND, parcel-options -> ERR_PARCEL_OPTION_NOT_FOUND"
    error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 8
    category: existence
    check: "every FK in the request body resolves, validated in declaration order: program_id, utility_id, water_source_id, site_id, application_id, replaces_option_id"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "POST /candidate-sites, POST /interconnection-applications, POST /incentive-negotiations, POST /zoning-applications, POST /power-purchase-agreements, POST /parcel-options"
  - priority: 9
    category: business_constraint
    check: "expected_site_version equals the addressed CandidateSite's current version integer (optimistic concurrency, §1.2.1 rule parcel-option-supersede-stale-site)"
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    applies_to: "POST /parcel-options"
  - priority: 10
    category: state
    check: "CandidateSite is in a status this operation allows: screen requires DRAFT, commit requires SCREENED, disqualify requires status != DISQUALIFIED, and every child create (application, zoning, negotiation, parcel option) requires status IN {DRAFT, SCREENED, COMMITTED}"
    error_id: ERR_SITE_INVALID_STATE
    http_status: 409
    applies_to: "POST /candidate-sites/{id}/screen, POST /candidate-sites/{id}/commit, POST /candidate-sites/{id}/disqualify, POST /interconnection-applications, POST /zoning-applications, POST /incentive-negotiations, POST /parcel-options"
  - priority: 11
    category: state
    check: "InterconnectionApplication is in a status this operation allows: submit requires DRAFT, load-studies requires status IN {SUBMITTED, STUDY_COMPLETE}, commit-energization requires CAPACITY_RESERVED, withdraw requires status != WITHDRAWN"
    error_id: ERR_APPLICATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /interconnection-applications/{id}/submit, POST /interconnection-applications/{id}/load-studies, POST /interconnection-applications/{id}/commit-energization, POST /interconnection-applications/{id}/withdraw"
  - priority: 12
    category: state
    check: "reserve-capacity requires the application's status to be exactly STUDY_COMPLETE; a SUBMITTED application has no study to reserve against and a CAPACITY_RESERVED one is already reserved"
    error_id: ERR_APPLICATION_NOT_STUDIED
    http_status: 409
    applies_to: "POST /interconnection-applications/{id}/reserve-capacity"
  - priority: 13
    category: state
    check: "IncentiveNegotiation is in a status this operation allows: rounds requires status IN {DRAFT, AUTHORITY_COUNTER_PENDING, COMPANY_OFFER_PENDING}, sign requires COMPANY_OFFER_PENDING and round_count >= MIN_NEGOTIATION_ROUNDS, ratify requires SIGNED"
    error_id: ERR_NEGOTIATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /incentive-negotiations/{id}/rounds, POST /incentive-negotiations/{id}/sign, POST /incentive-negotiations/{id}/ratify"
  - priority: 14
    category: state
    check: "the submitted_by_party of a negotiation round matches the party the status expects: COMPANY when status IN {DRAFT, COMPANY_OFFER_PENDING}, AUTHORITY when status == AUTHORITY_COUNTER_PENDING; the two parties strictly alternate"
    error_id: ERR_WRONG_NEGOTIATION_PARTY
    http_status: 409
    applies_to: "POST /incentive-negotiations/{id}/rounds"
  - priority: 15
    category: state
    check: "ZoningApplication status IN {SUBMITTED, CONTINUED} for decide and for community-objections; APPROVED_WITH_CONDITIONS and DENIED are terminal"
    error_id: ERR_ZONING_INVALID_STATE
    http_status: 409
    applies_to: "POST /zoning-applications/{id}/decide, POST /zoning-applications/{id}/community-objections"
  - priority: 16
    category: business_constraint
    check: "a CONTINUED outcome requires continuance_count < MAX_ZONING_CONTINUANCES (2); the third continuance is refused"
    error_id: ERR_ZONING_CONTINUANCE_EXHAUSTED
    http_status: 409
    applies_to: "POST /zoning-applications/{id}/decide"
  - priority: 17
    category: state
    check: "PowerPurchaseAgreement status == DRAFT for execute; an EXECUTED PPA cannot be executed twice"
    error_id: ERR_PPA_INVALID_STATE
    http_status: 409
    applies_to: "POST /power-purchase-agreements/{id}/execute"
  - priority: 18
    category: state
    check: "LandParcelOption status == OPTIONED for exercise and for being superseded via replaces_option_id"
    error_id: ERR_OPTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /parcel-options/{id}/exercise, POST /parcel-options"
  - priority: 19
    category: business_temporal
    check: "the current logical clock is strictly before window_end at exercise (half-open window still open); a clock at or past window_end makes the option unexercisable"
    error_id: ERR_OPTION_EXPIRED
    http_status: 409
    applies_to: "POST /parcel-options/{id}/exercise"
  - priority: 20
    category: state
    check: "cross-entity state: submitting an interconnection application requires the referenced CandidateSite.status == SCREENED, and exercising a parcel option requires the site's non-withdrawn application to be in status IN {CAPACITY_RESERVED, ENERGIZATION_COMMITTED}"
    error_id: ERR_SITE_NOT_SCREENED
    http_status: 409
    applies_to: "POST /interconnection-applications/{id}/submit, POST /parcel-options/{id}/exercise"
  - priority: 21
    category: business_safety
    check: "segregation of duties: the X-User-ID committing a site differs from site.screened_by_user_id, and the X-User-ID ratifying a negotiation differs from negotiation.signed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /candidate-sites/{id}/commit, POST /incentive-negotiations/{id}/ratify"
  - priority: 22
    category: business_safety
    check: "the site's hazard_tier is not SEVERE at commit; a severe seismic, flood or wind exposure disqualifies the campus regardless of score"
    error_id: ERR_HAZARD_TIER_PROHIBITED
    http_status: 409
    applies_to: "POST /candidate-sites/{id}/commit"
  - priority: 23
    category: business_safety
    check: "the site has a ZoningApplication with status == APPROVED_WITH_CONDITIONS at commit, and at ratify"
    error_id: ERR_ZONING_NOT_APPROVED
    http_status: 409
    applies_to: "POST /candidate-sites/{id}/commit, POST /incentive-negotiations/{id}/ratify"
  - priority: 24
    category: business_safety
    check: "an APPROVED_WITH_CONDITIONS decision requires MITIGATION_RANK[visual_mitigation_tier] >= MITIGATION_RANK[required_mitigation_tier]; the applicant cannot be approved while offering less mitigation than the noise excess and weighted community opposition demand"
    error_id: ERR_MITIGATION_TIER_INSUFFICIENT
    http_status: 409
    applies_to: "POST /zoning-applications/{id}/decide"
  - priority: 25
    category: business_referential
    check: "an interconnection application's utility_id equals the referenced site's utility_id; a parcel option's replaces_option_id belongs to the same site_id and the same parcel_apn"
    error_id: ERR_APPLICATION_SITE_UTILITY_MISMATCH
    http_status: 422
    applies_to: "POST /interconnection-applications, POST /parcel-options"
  - priority: 26
    category: business_constraint
    check: "a site has at most one InterconnectionApplication with status != WITHDRAWN"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /interconnection-applications"
  - priority: 27
    category: business_constraint
    check: "a site has at most one ZoningApplication regardless of status"
    error_id: ERR_DUPLICATE_ZONING_APPLICATION
    http_status: 409
    applies_to: "POST /zoning-applications"
  - priority: 28
    category: business_constraint
    check: "a site has at most one IncentiveNegotiation per authority_level"
    error_id: ERR_DUPLICATE_NEGOTIATION
    http_status: 409
    applies_to: "POST /incentive-negotiations"
  - priority: 29
    category: business_temporal
    check: "exclusivity: no other LandParcelOption with the same (site_id, parcel_apn) and status IN {OPTIONED, EXERCISED} has a HALF-OPEN window [window_start, window_end) overlapping the new one; abutting windows (one ends exactly where the next begins) are admissible and no buffer is applied; the option named by replaces_option_id is exempt because it is released in the same request"
    error_id: ERR_OPTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /parcel-options"
  - priority: 30
    category: business_constraint
    check: "reserve-capacity requires abs(requested_mw - diversified_peak_mw) / requested_mw <= RESTUDY_TOLERANCE (0.10); a study that lands more than 10% away from the request must be restudied first"
    error_id: ERR_STUDY_LOAD_MISMATCH
    http_status: 409
    applies_to: "POST /interconnection-applications/{id}/reserve-capacity"
  - priority: 31
    category: business_constraint
    check: "no other CandidateSite of the same SitingProgram is already COMMITTED"
    error_id: ERR_SITE_COMMITMENT_EXISTS
    http_status: 409
    applies_to: "POST /candidate-sites/{id}/commit"
  - priority: 32
    category: business_constraint
    check: "the site's land_control_pct >= 100 at commit; a partially optioned campus cannot be committed"
    error_id: ERR_LAND_CONTROL_INCOMPLETE
    http_status: 409
    applies_to: "POST /candidate-sites/{id}/commit"
  - priority: 33
    category: business_referential
    check: "the site has an IncentiveNegotiation with authority_level == STATE and status == RATIFIED at commit"
    error_id: ERR_INCENTIVES_NOT_RATIFIED
    http_status: 409
    applies_to: "POST /candidate-sites/{id}/commit"
  - priority: 34
    category: business_fiscal
    check: "aggregate transmission: concurrent_mw + requested_mw <= utility.total_transmission_capacity_mw over the buffered closed windows of reserved and energization-committed applications (equality admissible)"
    error_id: ERR_TRANSMISSION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /interconnection-applications/{id}/reserve-capacity"
  - priority: 35
    category: business_fiscal
    check: "the committed site's water_feasible == true, i.e. annual_water_demand_mgal <= water_headroom_mgal after drought curtailment (equality admissible)"
    error_id: ERR_WATER_SUPPLY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /candidate-sites/{id}/commit"
  - priority: 36
    category: business_fiscal
    check: "the program's renewable_coverage_pct >= MIN_RENEWABLE_COVERAGE_PCT (80.0) from EXECUTED PPAs at commit (equality admissible)"
    error_id: ERR_RENEWABLE_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /candidate-sites/{id}/commit"
  - priority: 37
    category: business_fiscal
    check: "committed_energization_date <= program.required_energization_date + MAX_ENERGIZATION_DELAY_DAYS (90) days, and >= the application's window_start, and at least utility.energization_lead_days after the current logical clock"
    error_id: ERR_ENERGIZATION_DEADLINE_MISSED
    http_status: 409
    applies_to: "POST /interconnection-applications/{id}/commit-energization"
  - priority: 38
    category: business_fiscal
    check: "the site's site_capital_commitment_usd <= program.capital_budget_usd at commit (equality admissible); fiscal ceiling is the last gate"
    error_id: ERR_CAPITAL_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /candidate-sites/{id}/commit"

endpoints:
  - method: POST
    path: "/siting-programs"
    description: "open a hyperscale siting program with a load target, a contractual energization date and a capital ceiling"
    roles: [PortfolioDirector]
    code: 201
    input: [name, target_load_mw, required_energization_date, capital_budget_usd]
    output: SitingProgram
    side_effects: ["program_annual_load_mwh computed", "program_status = SCREENING", "all money and count rollups initialised to 0"]
  - method: GET
    path: "/siting-programs/{id}"
    description: "read a siting program including its compound program_status and premium ledger"
    roles: [PortfolioDirector, SiteScreeningAnalyst, CapitalCommitteeChair]
    code: 200
    input: []
    output: SitingProgram
    side_effects: []
  - method: GET
    path: "/siting-programs/{id}/power-purchase-agreements"
    description: "list the PPAs matched to this program (FK reverse-reachability for PowerPurchaseAgreement.program_id)"
    roles: [PortfolioDirector, CapitalCommitteeChair]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PowerPurchaseAgreement[]
    side_effects: []
  - method: POST
    path: "/siting-programs/{id}/option-expiry-sweep"
    description: "run the land-option expiry sweep for every parcel option of this program's sites: options whose HALF-OPEN window has closed at the current logical clock move OPTIONED -> LAPSED"
    roles: [PortfolioDirector]
    code: 200
    input: []
    output: SitingProgram
    side_effects: ["each expired option -> LAPSED with lapsed_at stamped", "premium moves from option_exposure_usd to forfeited_premium_usd (premium_committed_total_usd unchanged)", "affected sites' land_control_pct and land_control_status recomputed", "full_land_control_site_count recomputed and program_status re-derived (SITE_COMMITTED -> STALLED when the committed site loses full control)", "site_capital_commitment_usd recomputed for affected sites"]
  - method: POST
    path: "/utilities"
    description: "register a serving utility with its transmission capacity, study and upgrade rates, commissioning buffer and queue policy"
    roles: [PortfolioDirector]
    code: 201
    input: ["name", "state_code", "balancing_authority", "total_transmission_capacity_mw", "interconnect_study_fee_per_mw_usd", "network_upgrade_rate_usd_per_mw", "commissioning_buffer_days?", "energization_lead_days", "queue_policy?"]
    output: Utility
    side_effects: ["reserved_capacity_mw = 0", "available_capacity_mw = total_transmission_capacity_mw", "commissioning_buffer_days defaults to 90 and queue_policy to FIRST_COME_FIRST_SERVED when omitted"]
  - method: GET
    path: "/utilities/{id}"
    description: "read a utility including its reserved and available transmission capacity ledger"
    roles: [PortfolioDirector, SiteScreeningAnalyst, UtilityPlanner]
    code: 200
    input: []
    output: Utility
    side_effects: []
  - method: POST
    path: "/utilities/{id}/capacity-revisions"
    description: "the utility revises its total deliverable transmission capacity; reservations that no longer fit are pushed back into the queue"
    roles: [UtilityPlanner]
    code: 200
    input: [revised_total_capacity_mw, reason]
    output: Utility
    side_effects: ["total_transmission_capacity_mw = revised_total_capacity_mw", "every CAPACITY_RESERVED or ENERGIZATION_COMMITTED application that no longer fits the revised capacity is walked back to SUBMITTED with reserved_mw = 0 (and committed_energization_date / delay_exposure_usd cleared)", "reserved_capacity_mw and available_capacity_mw recomputed", "energization_risk_tier recomputed on every site of this utility", "program_status and committed_load_mw re-derived for every affected program"]
  - method: POST
    path: "/water-sources"
    description: "register a permitted water source for cooling supply"
    roles: [PermittingAuthority]
    code: 201
    input: [name, basin_code, state_code, annual_permitted_mgal]
    output: WaterSource
    side_effects: ["drought_stage = NORMAL", "stage_curtailment_pct = 0.00", "effective_supply_mgal = annual_permitted_mgal", "committed_annual_demand_mgal = 0"]
  - method: GET
    path: "/water-sources/{id}"
    description: "read a water source with its drought stage, effective supply and committed demand"
    roles: [PortfolioDirector, SiteScreeningAnalyst, PermittingAuthority]
    code: 200
    input: []
    output: WaterSource
    side_effects: []
  - method: POST
    path: "/water-sources/{id}/drought-declarations"
    description: "declare (or relax to) a drought stage on the basin, re-curtailing supply and re-testing the feasibility of every site drawing on it"
    roles: [PermittingAuthority]
    code: 200
    input: [drought_stage, effective_date]
    output: WaterSource
    side_effects: ["drought_stage set, stage_curtailment_pct looked up, effective_supply_mgal recomputed", "last_declaration_effective_date = effective_date", "water_headroom_mgal and water_feasible recomputed on every SCREENED or COMMITTED site of this source", "program_status re-derived for the affected programs (SITE_COMMITTED -> STALLED, or STALLED -> SITE_COMMITTED when relaxed)"]
  - method: POST
    path: "/candidate-sites"
    description: "add a candidate site to a program, bound to one serving utility and one water source"
    roles: [SiteScreeningAnalyst]
    code: 201
    input: [program_id, utility_id, water_source_id, name, state_code, county, gross_acres]
    output: CandidateSite
    side_effects: ["status = DRAFT", "land_control_pct = 0 and land_control_status = NONE", "energization_risk_tier initialised from calculations.energization_risk_tier", "screening_score and hazard_tier remain null until screening"]
  - method: GET
    path: "/candidate-sites/{id}"
    description: "read a candidate site with its screening score, hazard tier, water feasibility, land control and capital commitment; also the read used to obtain version for the parcel-option OCC check"
    roles: [SiteScreeningAnalyst, PortfolioDirector, CapitalCommitteeChair]
    code: 200
    input: []
    output: CandidateSite
    side_effects: []
  - method: GET
    path: "/candidate-sites"
    description: "list candidate sites filtered by program, serving utility, water source or status (FK reverse-reachability for program_id, utility_id and water_source_id)"
    roles: [SiteScreeningAnalyst, PortfolioDirector, CapitalCommitteeChair]
    code: 200
    input: ["program_id?", "utility_id?", "water_source_id?", "status?", "limit?", "offset?"]
    output: CandidateSite[]
    side_effects: []
  - method: POST
    path: "/candidate-sites/{id}/screen"
    description: "file the screening package (power, fiber, hazard, labor, cooling and water inputs) and score the site"
    roles: [SiteScreeningAnalyst]
    code: 200
    input: [transmission_headroom_mw, fiber_route_count, seismic_hazard_index, flood_hazard_index, wind_hazard_index, craft_labor_supply_index, construction_peak_headcount, wage_premium_pct, cooling_type, annual_water_demand_mgal]
    output: CandidateSite
    side_effects: ["status DRAFT -> SCREENED and screened_by_user_id stamped", "hazard_tier, workforce_availability_ratio, water_headroom_mgal, water_feasible and screening_score computed", "energization_risk_tier recomputed", "the water source's committed_annual_demand_mgal recomputed and sibling sites' water_headroom_mgal / water_feasible re-evaluated", "program_status re-derived"]
  - method: POST
    path: "/candidate-sites/{id}/commit"
    description: "capital committee commits the program to this site; runs the full ten-gate admission ladder in validations priority order"
    roles: [CapitalCommitteeChair]
    code: 200
    input: []
    output: CandidateSite
    side_effects: ["status SCREENED -> COMMITTED and committed_by_user_id stamped", "site_capital_commitment_usd recomputed and compared against the program's capital_budget_usd", "program_status re-derived SCREENING -> SITE_COMMITTED"]
  - method: POST
    path: "/candidate-sites/{id}/disqualify"
    description: "drop a candidate site, releasing its queue reservation, its land options and its water demand"
    roles: [PortfolioDirector]
    code: 200
    input: [disqualification_reason]
    output: CandidateSite
    side_effects: ["status -> DISQUALIFIED with disqualification_reason persisted", "cascade hop 1: the non-withdrawn application -> WITHDRAWN, reserved_mw = 0, queue_position = 0", "cascade hop 2: the serving utility's reserved_capacity_mw / available_capacity_mw recomputed", "cascade hop 3: energization_risk_tier recomputed on every sibling site of that utility", "cascade hop 4: program_status re-derived and full_land_control_site_count recomputed", "OPTIONED options of this site -> RELEASED, moving premiums into forfeited_premium_usd", "the water source's committed_annual_demand_mgal recomputed and sibling water_feasible re-evaluated", "queue_position recomputed for the utility's remaining applications"]
  - method: POST
    path: "/interconnection-applications"
    description: "draft an interconnection application for a site's requested MW over a requested energization window"
    roles: [SiteScreeningAnalyst]
    code: 201
    input: [site_id, utility_id, requested_mw, window_start, window_end]
    output: InterconnectionApplication
    side_effects: ["status = DRAFT", "queue_position = 0, reserved_mw = 0, study_round = 0", "no capacity is reserved and no fee is charged until submit"]
  - method: GET
    path: "/interconnection-applications/{id}"
    description: "read an interconnection application with its queue position, study results, reservation and delay exposure"
    roles: [SiteScreeningAnalyst, PortfolioDirector, UtilityPlanner]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: []
  - method: GET
    path: "/interconnection-applications"
    description: "list interconnection applications filtered by site, utility or status (FK reverse-reachability for site_id and utility_id)"
    roles: [SiteScreeningAnalyst, PortfolioDirector, UtilityPlanner]
    code: 200
    input: ["site_id?", "utility_id?", "status?", "limit?", "offset?"]
    output: InterconnectionApplication[]
    side_effects: []
  - method: POST
    path: "/interconnection-applications/{id}/submit"
    description: "submit the application into the utility's queue; requires the site to be SCREENED"
    roles: [SiteScreeningAnalyst]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: ["status DRAFT -> SUBMITTED, submitted_at = current logical clock", "study_fee_usd = round(requested_mw * utility.interconnect_study_fee_per_mw_usd, 2)", "queue_position recomputed for every application of the utility under its queue_policy", "site energization_risk_tier and site_capital_commitment_usd recomputed", "program_status re-derived"]
  - method: POST
    path: "/interconnection-applications/{id}/reserve-capacity"
    description: "the utility reserves transmission capacity for a studied application, subject to the buffered overlap aggregate"
    roles: [UtilityPlanner]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: ["status STUDY_COMPLETE -> CAPACITY_RESERVED, reserved_mw = requested_mw", "utility reserved_capacity_mw / available_capacity_mw recomputed", "energization_risk_tier recomputed on every site of the utility", "program_status re-derived"]
  - method: POST
    path: "/interconnection-applications/{id}/commit-energization"
    description: "the utility commits to an energization date, pricing the schedule slip against the program's contractual date"
    roles: [UtilityPlanner]
    code: 200
    input: [committed_energization_date]
    output: InterconnectionApplication
    side_effects: ["status CAPACITY_RESERVED -> ENERGIZATION_COMMITTED, committed_energization_date persisted", "delay_exposure_usd computed", "site energization_risk_tier recomputed (BREACHED on any slip past the required date)", "program_status re-derived (SITE_COMMITTED -> ENERGIZATION_SECURED, or -> STALLED when breached) and committed_load_mw recomputed"]
  - method: POST
    path: "/interconnection-applications/{id}/withdraw"
    description: "withdraw the application, fully releasing any reserved capacity and closing the queue gap"
    roles: [SiteScreeningAnalyst]
    code: 200
    input: [withdrawal_reason]
    output: InterconnectionApplication
    side_effects: ["status -> WITHDRAWN with withdrawal_reason persisted, reserved_mw = 0, queue_position = 0", "utility reserved_capacity_mw / available_capacity_mw recomputed to exactly their pre-reservation values", "queue_position recomputed for the utility's remaining applications", "site energization_risk_tier and site_capital_commitment_usd recomputed", "program_status and committed_load_mw re-derived"]
  - method: POST
    path: "/interconnection-applications/{id}/load-studies"
    description: "the utility files a load study round, splitting IT, cooling and ancillary load and applying its diversity factor"
    roles: [UtilityPlanner]
    code: 201
    input: [it_load_mw, cooling_load_mw, ancillary_load_mw, diversity_factor]
    output: LoadStudy
    side_effects: ["a LoadStudy row is appended with the next study_round and filed_by_user_id stamped", "nameplate_peak_mw, diversified_peak_mw, upgrade_required and network_upgrade_cost_usd computed", "the application's status moves to STUDY_COMPLETE (or stays STUDY_COMPLETE on a restudy) and mirrors the NEW study's diversified_peak_mw and network_upgrade_cost_usd", "site_capital_commitment_usd recomputed"]
  - method: GET
    path: "/interconnection-applications/{id}/load-studies"
    description: "list the load study rounds filed against an application (FK reverse-reachability for LoadStudy.application_id; the only discovery channel for these immutable rows)"
    roles: [UtilityPlanner, SiteScreeningAnalyst, PortfolioDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: LoadStudy[]
    side_effects: []
  - method: POST
    path: "/incentive-negotiations"
    description: "open an incentive negotiation with a state or local authority for a candidate site"
    roles: [IncentiveNegotiator]
    code: 201
    input: [site_id, authority_level, counterparty_name]
    output: IncentiveNegotiation
    side_effects: ["status = DRAFT, round_count = 0, last_party = null", "all four incentive money fields = 0 until the first round"]
  - method: GET
    path: "/candidate-sites/{id}/incentive-negotiations"
    description: "list the incentive negotiations attached to a site (FK reverse-reachability for IncentiveNegotiation.site_id)"
    roles: [IncentiveNegotiator, PortfolioDirector, CapitalCommitteeChair]
    code: 200
    input: ["authority_level?", "status?", "limit?", "offset?"]
    output: IncentiveNegotiation[]
    side_effects: []
  - method: POST
    path: "/incentive-negotiations/{id}/rounds"
    description: "record one negotiation round of terms from the party whose turn it is; the two parties strictly alternate"
    roles: [IncentiveNegotiator, PermittingAuthority]
    code: 200
    input: [submitted_by_party, sales_tax_exemption_pct, abatement_years, abatement_pct, jobs_commitment, capex_commitment_usd]
    output: IncentiveNegotiation
    side_effects: ["the five standing term fields are overwritten with this round's terms", "round_count += 1, last_party set, status flips to the other party's pending state", "sales_tax_benefit_usd, abatement_npv_usd, npv_incentive_usd and clawback_exposure_usd recomputed per calculations.incentive_npv"]
  - method: POST
    path: "/incentive-negotiations/{id}/sign"
    description: "sign the standing authority counter-offer as a term sheet"
    roles: [IncentiveNegotiator]
    code: 200
    input: []
    output: IncentiveNegotiation
    side_effects: ["status COMPANY_OFFER_PENDING -> SIGNED", "signed_by_user_id stamped as the segregation-of-duties comparand for ratify"]
  - method: POST
    path: "/incentive-negotiations/{id}/ratify"
    description: "capital committee ratifies a signed term sheet; a different operator than the signer, and only once zoning is approved"
    roles: [CapitalCommitteeChair]
    code: 200
    input: []
    output: IncentiveNegotiation
    side_effects: ["status SIGNED -> RATIFIED", "ratified_by_user_id stamped", "the site becomes eligible for the incentives gate at commit"]
  - method: POST
    path: "/zoning-applications"
    description: "file the site's zoning application with its ordinance noise limit, modelled noise and offered visual mitigation"
    roles: [SiteScreeningAnalyst]
    code: 201
    input: [site_id, jurisdiction, hearing_date, noise_limit_dba, projected_noise_dba, visual_mitigation_tier]
    output: ZoningApplication
    side_effects: ["status = SUBMITTED, continuance_count = 0, objection_count = 0", "noise_excess_dba, required_mitigation_tier, mitigation_cost_usd and conditions_escrow_usd computed from the noise inputs with zero objections"]
  - method: GET
    path: "/candidate-sites/{id}/zoning-applications"
    description: "list the zoning applications of a site (FK reverse-reachability for ZoningApplication.site_id)"
    roles: [SiteScreeningAnalyst, PortfolioDirector, PermittingAuthority]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ZoningApplication[]
    side_effects: []
  - method: POST
    path: "/zoning-applications/{id}/community-objections"
    description: "record one community objection raised in the engagement process; each type carries its own weight"
    roles: [PermittingAuthority]
    code: 200
    input: [objection_type, commenter_reference]
    output: ZoningApplication
    side_effects: ["objection_count += 1", "weighted_opposition_score recomputed from OBJECTION_WEIGHT", "required_mitigation_tier, mitigation_cost_usd and conditions_escrow_usd recomputed (steps 3-5 of calculations.zoning_mitigation_and_escrow)"]
  - method: POST
    path: "/zoning-applications/{id}/decide"
    description: "the board approves with conditions, continues the hearing, or denies the application"
    roles: [PermittingAuthority]
    code: 200
    input: ["outcome", "decision_note?"]
    output: ZoningApplication
    side_effects: ["APPROVED_WITH_CONDITIONS: status set, mitigation_cost_usd and conditions_escrow_usd finalized, site_capital_commitment_usd recomputed", "CONTINUED: continuance_count += 1 and the mitigation figures re-derived, capped at MAX_ZONING_CONTINUANCES", "DENIED: the site is DISQUALIFIED with disqualification_reason = \"ZONING_DENIED\", firing the full four-hop disqualification cascade"]
  - method: POST
    path: "/power-purchase-agreements"
    description: "draft a PPA matched to the program's load under either annual-volumetric or hourly-matched accounting"
    roles: [PortfolioDirector]
    code: 201
    input: [program_id, counterparty_name, technology, contracted_capacity_mw, annual_generation_mwh, hourly_matched_mwh, strike_price_usd_per_mwh, matching_mode, delivery_start, delivery_end]
    output: PowerPurchaseAgreement
    side_effects: ["status = DRAFT", "credited_coverage_mwh = 0 (a draft PPA never counts toward coverage)", "annual_cost_usd computed"]
  - method: POST
    path: "/power-purchase-agreements/{id}/execute"
    description: "execute the PPA so it credits toward the program's renewable coverage under its matching mode"
    roles: [PortfolioDirector]
    code: 200
    input: []
    output: PowerPurchaseAgreement
    side_effects: ["status DRAFT -> EXECUTED", "credited_coverage_mwh computed by the matching_mode variant of calculations.ppa_credited_coverage", "the program's renewable_coverage_pct re-aggregated over EXECUTED PPAs"]
  - method: POST
    path: "/parcel-options"
    description: "sign a phased land option on a parcel, optionally superseding a prior option on the same parcel; carries the site optimistic-concurrency token"
    roles: [SiteScreeningAnalyst]
    code: 201
    input: ["site_id", "parcel_apn", "phase_index", "acres", "option_premium_usd", "purchase_price_usd", "premium_credit_pct?", "window_start", "window_end", "replaces_option_id?", "expected_site_version"]
    output: LandParcelOption
    side_effects: ["expected_site_version is checked against CandidateSite.version before anything else state-related (412 on mismatch)", "status = OPTIONED", "any option named by replaces_option_id moves OPTIONED -> RELEASED, shifting its premium into forfeited_premium_usd", "site land_control_pct and land_control_status recomputed; increments CandidateSite.version by 1", "program option_exposure_usd, premium_committed_total_usd, full_land_control_site_count and program_status re-derived", "site_capital_commitment_usd recomputed"]
  - method: GET
    path: "/parcel-options/{id}"
    description: "read a land parcel option with its window, premium credit and net purchase price"
    roles: [SiteScreeningAnalyst, PortfolioDirector]
    code: 200
    input: []
    output: LandParcelOption
    side_effects: []
  - method: GET
    path: "/parcel-options"
    description: "list land parcel options filtered by site, superseded option or status (FK reverse-reachability for site_id and the self-referential replaces_option_id)"
    roles: [SiteScreeningAnalyst, PortfolioDirector]
    code: 200
    input: ["site_id?", "replaces_option_id?", "status?", "limit?", "offset?"]
    output: LandParcelOption[]
    side_effects: []
  - method: POST
    path: "/parcel-options/{id}/exercise"
    description: "exercise an open option to buy the parcel, crediting part of the premium against the purchase price"
    roles: [PortfolioDirector]
    code: 200
    input: []
    output: LandParcelOption
    side_effects: ["status OPTIONED -> EXERCISED, exercised_at stamped", "premium_credited_usd and net_purchase_usd computed", "the premium moves from option_exposure_usd to capitalized_premium_usd with premium_committed_total_usd unchanged", "site land_control_pct, land_control_status and site_capital_commitment_usd recomputed", "full_land_control_site_count and program_status re-derived"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint (§1.5 ladder step 3): set the server's logical UTC clock, which every window, expiry and stamping rule reads. The server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time."
    roles: [PortfolioDirector]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["the logical clock is set; no entity is mutated and no sweep is run (the expiry sweep is a separate explicit call)"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not listed in the target endpoint's roles"
  - id: ERR_UTILITY_IDENTITY_MISMATCH
    http: 403
    condition: "a UtilityPlanner's X-User-ID is not the Utility.id owning the addressed application or utility"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID that screened a site attempts to commit it, or the signer of a term sheet attempts to ratify it"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, out-of-range number, unknown enum value, or a pagination parameter outside 1..100 / offset < 0"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "an interval's end is not strictly after its start"
  - id: ERR_OPTION_WINDOW_BACKDATED
    http: 422
    condition: "a new parcel option's window_start is earlier than the current logical clock"
  - id: ERR_APPLICATION_SITE_UTILITY_MISMATCH
    http: 422
    condition: "an application's utility_id differs from the referenced site's utility_id, or a superseding option's replaces_option_id points at a different site or parcel_apn"
  - id: ERR_STALE_SITE_VERSION
    http: 412
    condition: "expected_site_version does not equal the CandidateSite's current version"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no SitingProgram with the given id"
  - id: ERR_UTILITY_NOT_FOUND
    http: 404
    condition: "no Utility with the given id"
  - id: ERR_WATER_SOURCE_NOT_FOUND
    http: 404
    condition: "no WaterSource with the given id"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "no CandidateSite with the given id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no InterconnectionApplication with the given id"
  - id: ERR_NEGOTIATION_NOT_FOUND
    http: 404
    condition: "no IncentiveNegotiation with the given id"
  - id: ERR_ZONING_APPLICATION_NOT_FOUND
    http: 404
    condition: "no ZoningApplication with the given id"
  - id: ERR_PPA_NOT_FOUND
    http: 404
    condition: "no PowerPurchaseAgreement with the given id"
  - id: ERR_PARCEL_OPTION_NOT_FOUND
    http: 404
    condition: "no LandParcelOption with the given id"
  - id: ERR_SITE_INVALID_STATE
    http: 409
    condition: "the CandidateSite's status does not permit the operation (screen on a non-DRAFT site, commit on a non-SCREENED site, disqualify on a DISQUALIFIED site, or a child create on a DISQUALIFIED site)"
  - id: ERR_SITE_NOT_SCREENED
    http: 409
    condition: "submitting an application for a site that is not SCREENED, or exercising an option whose site has no reserved interconnection"
  - id: ERR_APPLICATION_INVALID_STATE
    http: 409
    condition: "the InterconnectionApplication's status does not permit submit, load-studies, commit-energization or withdraw"
  - id: ERR_APPLICATION_NOT_STUDIED
    http: 409
    condition: "reserve-capacity called on an application whose status is not STUDY_COMPLETE"
  - id: ERR_STUDY_LOAD_MISMATCH
    http: 409
    condition: "the newest study's diversified_peak_mw deviates from requested_mw by more than RESTUDY_TOLERANCE"
  - id: ERR_TRANSMISSION_CAPACITY_EXCEEDED
    http: 409
    condition: "the buffered concurrent reserved MW plus this request exceeds the utility's total transmission capacity"
  - id: ERR_ENERGIZATION_DEADLINE_MISSED
    http: 409
    condition: "committed_energization_date is more than MAX_ENERGIZATION_DELAY_DAYS past the program's required date, earlier than the application's window_start, or less than utility.energization_lead_days after the logical clock"
  - id: ERR_NEGOTIATION_INVALID_STATE
    http: 409
    condition: "rounds, sign or ratify called from a status that does not permit it, or sign called before MIN_NEGOTIATION_ROUNDS rounds"
  - id: ERR_WRONG_NEGOTIATION_PARTY
    http: 409
    condition: "submitted_by_party is not the party the negotiation status expects"
  - id: ERR_ZONING_INVALID_STATE
    http: 409
    condition: "decide or community-objections called on an APPROVED_WITH_CONDITIONS or DENIED application"
  - id: ERR_ZONING_CONTINUANCE_EXHAUSTED
    http: 409
    condition: "a CONTINUED outcome requested when continuance_count already equals MAX_ZONING_CONTINUANCES"
  - id: ERR_MITIGATION_TIER_INSUFFICIENT
    http: 409
    condition: "approval requested while the offered visual_mitigation_tier ranks below required_mitigation_tier"
  - id: ERR_ZONING_NOT_APPROVED
    http: 409
    condition: "commit or ratify attempted before the site's zoning application reached APPROVED_WITH_CONDITIONS"
  - id: ERR_HAZARD_TIER_PROHIBITED
    http: 409
    condition: "commit attempted on a site whose hazard_tier is SEVERE"
  - id: ERR_INCENTIVES_NOT_RATIFIED
    http: 409
    condition: "commit attempted without a RATIFIED STATE-level incentive negotiation on the site"
  - id: ERR_LAND_CONTROL_INCOMPLETE
    http: 409
    condition: "commit attempted while the site's land_control_pct is below 100"
  - id: ERR_SITE_COMMITMENT_EXISTS
    http: 409
    condition: "commit attempted while another site of the same program is already COMMITTED"
  - id: ERR_WATER_SUPPLY_INSUFFICIENT
    http: 409
    condition: "commit attempted while the site's water demand exceeds its drought-curtailed headroom"
  - id: ERR_RENEWABLE_COVERAGE_INSUFFICIENT
    http: 409
    condition: "commit attempted while the program's renewable_coverage_pct from EXECUTED PPAs is below MIN_RENEWABLE_COVERAGE_PCT"
  - id: ERR_CAPITAL_BUDGET_EXCEEDED
    http: 409
    condition: "commit attempted while the site's site_capital_commitment_usd exceeds the program's capital_budget_usd"
  - id: ERR_PPA_INVALID_STATE
    http: 409
    condition: "execute called on an already EXECUTED PPA"
  - id: ERR_OPTION_INVALID_STATE
    http: 409
    condition: "exercise called on a non-OPTIONED option, or replaces_option_id names a non-OPTIONED option"
  - id: ERR_OPTION_EXPIRED
    http: 409
    condition: "exercise attempted at or after the option's window_end on the logical clock"
  - id: ERR_OPTION_WINDOW_CONFLICT
    http: 409
    condition: "a new option's half-open exclusivity window overlaps a live option on the same (site_id, parcel_apn)"
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "the site already has a non-WITHDRAWN interconnection application"
  - id: ERR_DUPLICATE_ZONING_APPLICATION
    http: 409
    condition: "the site already has a zoning application"
  - id: ERR_DUPLICATE_NEGOTIATION
    http: 409
    condition: "the site already has a negotiation at the requested authority_level"

roles:
  - name: SiteScreeningAnalyst
    description: "development analyst who assembles candidate sites, files screening packages, interconnection applications, zoning applications and land options"
    identity: opaque
    exclusive_operations:
      - "POST /candidate-sites"
      - "POST /candidate-sites/{id}/screen"
      - "POST /interconnection-applications"
      - "POST /interconnection-applications/{id}/submit"
      - "POST /interconnection-applications/{id}/withdraw"
      - "POST /zoning-applications"
      - "POST /parcel-options"
    shared_operations:
      - "GET /siting-programs/{id}"
      - "GET /utilities/{id}"
      - "GET /water-sources/{id}"
      - "GET /candidate-sites"
      - "GET /candidate-sites/{id}"
      - "GET /candidate-sites/{id}/zoning-applications"
      - "GET /interconnection-applications"
      - "GET /interconnection-applications/{id}"
      - "GET /interconnection-applications/{id}/load-studies"
      - "GET /parcel-options"
      - "GET /parcel-options/{id}"
  - name: PortfolioDirector
    description: "program owner who opens siting programs, registers utilities, procures PPAs, exercises options, runs the expiry sweep and disqualifies sites"
    identity: opaque
    exclusive_operations:
      - "POST /siting-programs"
      - "POST /siting-programs/{id}/option-expiry-sweep"
      - "POST /utilities"
      - "POST /candidate-sites/{id}/disqualify"
      - "POST /power-purchase-agreements"
      - "POST /power-purchase-agreements/{id}/execute"
      - "POST /parcel-options/{id}/exercise"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /siting-programs/{id}"
      - "GET /siting-programs/{id}/power-purchase-agreements"
      - "GET /utilities/{id}"
      - "GET /water-sources/{id}"
      - "GET /candidate-sites"
      - "GET /candidate-sites/{id}"
      - "GET /candidate-sites/{id}/incentive-negotiations"
      - "GET /candidate-sites/{id}/zoning-applications"
      - "GET /interconnection-applications"
      - "GET /interconnection-applications/{id}"
      - "GET /interconnection-applications/{id}/load-studies"
      - "GET /parcel-options"
      - "GET /parcel-options/{id}"
  - name: UtilityPlanner
    description: "serving-utility transmission planner who files load studies, reserves capacity, commits energization dates and revises available capacity; acts as one specific Utility"
    identity: "entity_backed:Utility"
    exclusive_operations:
      - "POST /utilities/{id}/capacity-revisions"
      - "POST /interconnection-applications/{id}/load-studies"
      - "POST /interconnection-applications/{id}/reserve-capacity"
      - "POST /interconnection-applications/{id}/commit-energization"
    shared_operations:
      - "GET /utilities/{id}"
      - "GET /interconnection-applications"
      - "GET /interconnection-applications/{id}"
      - "GET /interconnection-applications/{id}/load-studies"
  - name: IncentiveNegotiator
    description: "economic development lead who opens incentive negotiations, files company rounds and signs the term sheet"
    identity: opaque
    exclusive_operations:
      - "POST /incentive-negotiations"
      - "POST /incentive-negotiations/{id}/sign"
    shared_operations:
      - "POST /incentive-negotiations/{id}/rounds"
      - "GET /candidate-sites/{id}/incentive-negotiations"
  - name: CapitalCommitteeChair
    description: "capital committee chair who ratifies incentive term sheets and commits the program to a site; never the operator who screened or signed"
    identity: opaque
    exclusive_operations:
      - "POST /candidate-sites/{id}/commit"
      - "POST /incentive-negotiations/{id}/ratify"
    shared_operations:
      - "GET /siting-programs/{id}"
      - "GET /siting-programs/{id}/power-purchase-agreements"
      - "GET /candidate-sites"
      - "GET /candidate-sites/{id}"
