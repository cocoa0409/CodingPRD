  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: audit_materiality_at_exactly_two_hundred_basis_points
        grounds:
          - calculations.undercharge_extrapolation
          - state_machines.AuditSample.IN_REVIEW_to_CLAIM_RAISED
          - entities.AuditSample.fields.undercharge_ratio_bp
          - errors[ERR_SAMPLE_STATE_INVALID]
        distinguishing_aspect: |
          Boundary on the RATIO metric, reached through POST /interline/audit-samples/{id}/close:
          an undercharge of 1000 against a sampled base of 50000 is exactly 200 basis points,
          and the >= comparison means the sample must raise a claim (CLAIM_RAISED, 2000), not
          close immaterial. One unit less of undercharge would round to 199 and close immaterial.
        test_recipe:
          setup:
            - "Carriers AA (validating/auditing) and CC (operating/audited) ACTIVE."
            - "Period 2026-08-P1 closed at 2026-09-06T00:00:00Z, settlement_currency USD."
            - "A USD 100000 ticket validated by AA with two identical 1000-tpm ECONOMY coupons operated by CC, each FINAL-allocated 50000, both attached to one submitted invoice CC->AA and cleared."
            - "An audit sample drawn by AA over exactly one of those coupons: population 2 coupons worth 100000, sample 1 coupon worth 50000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
