              as: EmployeeRole
              as_user_id: "${bemp2}"
            - call: "POST /engagement/survey-invites/${rinv3}/submit"
              payload: { answers: [ { cycle_item_id: "${ritem1}", score: 3 }, { cycle_item_id: "${ritem2}", score: 3 }, { cycle_item_id: "${ritem3}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${bemp3}"
            - call: "POST /engagement/survey-invites/${rinv4}/submit"
              payload: { answers: [ { cycle_item_id: "${ritem1}", score: 3 }, { cycle_item_id: "${ritem2}", score: 3 }, { cycle_item_id: "${ritem3}", score: 3 } ] }
