# =============================================================================
# §1.9 Scaffold Corner Design — task_1508_insurance_rate_filing_state_approval
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: product_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Product]
        distinguishing_aspect: "POST /products returns 201 with system fields populated: version == 1, current_locked_indication_id null, created_at == default logical clock 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["Empty DB; logical clock untouched (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version, prod_created: $.data.created_at, prod_cur_ind: $.data.current_locked_indication_id }
          assert:
            - "HTTP 201; Product.${prod_id}.version == 1"
            - "Product.${prod_id}.current_locked_indication_id == null"
            - "Product.${prod_id}.created_at == '2026-08-01T00:00:00Z' (proves the pinned clock default)"

      - name: filing_created_initial_state_draft
        claim_type: defaults
        grounds: [entities.RateFiling, state_machines.RateFiling]
        distinguishing_aspect: "A new filing starts DRAFT with filing_number, submitted_at, deemer_date, actual_effective_date all null and open_objection_count == 0."
        test_recipe:
          setup: ["Product, CA profile, LOCKED indication"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
          trigger:
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id, fil_status: $.data.status, fil_num: $.data.filing_number, fil_open: $.data.open_objection_count, fil_deemer: $.data.deemer_date }
          assert:
            - "RateFiling.${fil_id}.status == DRAFT (initial state)"
            - "filing_number == null, submitted_at == null, deemer_date == null, actual_effective_date == null"
            - "open_objection_count == 0"

      - name: get_filing_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent filing id yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /filings/00000000-0000-0000-0000-000000000000"
              as: FilingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: list_filings_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Filtered list returns the fixed envelope: response_type 'array', total_count == 1, has_more == false with default limit 10."
        test_recipe:
          setup: ["One DRAFT filing exists for product PPA"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
          trigger:
            - call: "GET /filings"
              payload: { product_id: "${prod_id}" }
              as: FilingAnalyst
          assert:
            - "response envelope: response_type == 'array', data contains exactly the one filing ${fil_id}"
            - "pagination fields present: total_count == 1, has_more == false, limit == 10, offset == 0"

      - name: create_filing_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.RateFiling.fields.filing_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "filing_type outside the declared enum is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Product, CA profile, LOCKED indication"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
          trigger:
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "BOGUS", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: create_product_missing_required_product_code
        claim_type: required_fields
        grounds: [entities.Product.fields.product_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required product_code is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: create_indication_unknown_field_rejected
        claim_type: computed_fields
        grounds: [entities.RateIndication.fields.indicated_change_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied indicated_change_pct (a computed field, not in input) is rejected as an unknown field with ERR_INVALID_REQUEST — the server never takes client arithmetic."
        test_recipe:
          setup: ["Product exists"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
          trigger:
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "PAID_PURE", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, indicated_change_pct: 0.99, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST (unknown/computed field in input)"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: mark_ready_happy_path_returns_ready
        claim_type: valid_transition
        grounds: [state_machines.RateFiling.DRAFT_to_READY]
        distinguishing_aspect: "mark-ready on a DRAFT filing with a FINAL RATE component transitions to READY and returns it in the same response."
        test_recipe:
          setup: ["CA filing DRAFT with one FINAL RATE component"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/finalize"
              as: FilingAnalyst
          trigger:
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
              captures: { fil_status: $.data.status }
          assert:
            - "RateFiling.${fil_id}.status == READY"

      - name: approve_draft_filing_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RateFiling, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "approve exists only from SUBMITTED; on DRAFT it is rejected with ERR_INVALID_STATE and no approval fields are set."
        test_recipe:
          setup: ["CA filing DRAFT (never submitted)"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
          trigger:
            - call: "POST /filings/${fil_id}/approve"
              as: StateRegulator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE; RateFiling.${fil_id} stays DRAFT with approved_at null"

      - name: double_submit_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.RateFiling.READY_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-submitting an already SUBMITTED filing is not idempotent: the second call fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["CA filing SUBMITTED"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
          trigger:
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE; status remains SUBMITTED"

      - name: withdrawn_filing_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.RateFiling]
        distinguishing_aspect: "A WITHDRAWN (terminal) filing rejects every further transition: mark-ready fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["CA filing withdrawn from DRAFT"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/withdraw"
              as: FilingAnalyst
          trigger:
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE; status remains WITHDRAWN"

      - name: resolved_objection_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Objection]
        distinguishing_aspect: "A RESOLVED (terminal) objection rejects reopen with ERR_INVALID_STATE."
        test_recipe:
          setup: ["CA filing SUBMITTED; objection resolved after a full response cycle"]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
            - call: "POST /objections"
              payload: { filing_id: "${fil_id}", question_text: "Trend support?" }
              as: StateRegulator
              captures: { obj_id: $.data.id, obj_v: $.data.version }
            - call: "POST /objections/${obj_id}/responses"
              payload: { response_text: "See exhibit A.", expected_objection_version: "${obj_v}" }
              as: FilingAnalyst
              captures: { resp_id: $.data.id }
            - call: "POST /responses/${resp_id}/submit"
              as: ComplianceOfficer
            - call: "POST /objections/${obj_id}/resolve"
              as: StateRegulator
          trigger:
            - call: "POST /objections/${obj_id}/reopen"
              as: StateRegulator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE; Objection.${obj_id} remains RESOLVED"

