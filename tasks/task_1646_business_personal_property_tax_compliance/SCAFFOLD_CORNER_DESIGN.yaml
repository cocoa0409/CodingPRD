# =============================================================================
# Task 1646 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty
# Tests). Breadth probe over §1.1–§1.7 claims not covered by §1.8.
# 44 non-stub instances + 15 excluded_because stubs.
# Clock default 2026-08-01T00:00:00Z; all fixture dates respect monotonicity.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: asset_create_applies_system_defaults
        claim_type: defaults
        grounds:
          - "entities.Asset.fields.lifecycle_status"
          - "entities.Asset.fields.classification_status"
        distinguishing_aspect: "A newly imported asset starts ACTIVE / UNCLASSIFIED with no disposal data and version 1, regardless of request content."
        test_recipe:
          setup: ["Client C and jurisdiction J exist; no class rule needed for asset import"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "DefCo", contact_email: "def@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Def County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_d: $.data.id }
          trigger:
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_d}", asset_tag: "D1", category: "FURNITURE", acquisition_cost_cents: 50000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_d: $.data.id }
          assert:
            - "Asset.${a_d}.lifecycle_status == ACTIVE"
            - "Asset.${a_d}.classification_status == UNCLASSIFIED"
            - "Asset.${a_d}.taxable_classification == null and disposed_date == null and disposal_proceeds_cents == null"
            - "Asset.${a_d}.version == 1 and created_at is set"

      - name: create_client_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting the required contact_email on client creation is a 400 ERR_INVALID_REQUEST before any other check runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /bpp/clients"
              payload: { legal_name: "NoEmailCo" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: get_asset_not_found_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Reading a well-formed but nonexistent asset id yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /bpp/assets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status == 404"

      - name: rendition_create_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.Rendition.fields.total_assessed_value_cents"
          - "entities.Rendition.fields.deadline_date"
        distinguishing_aspect: "Client-supplied values for computed fields (total_assessed_value_cents) are ignored: the created rendition computes deadline_date from the jurisdiction (2027-04-15 for tax_year 2027, MM-DD 04-15) and totals stay 0."
        test_recipe:
          setup: ["Client C and jurisdiction J (base_deadline_mmdd 04-15) exist"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "CompCo", contact_email: "comp@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Comp County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_c: $.data.id }
          trigger:
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_c}", tax_year: 2027, total_assessed_value_cents: 999999 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_c: $.data.id }
          assert:
            - "Rendition.${r_c}.total_assessed_value_cents == 0 (input ignored)"
            - "Rendition.${r_c}.deadline_date == 2027-04-15"
            - "Rendition.${r_c}.rendition_status == DRAFT and lines == []"

      - name: asset_list_pagination_defaults
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Default pagination is limit=10 offset=0: 11 assets yield a first page of 10 with has_more=true and total_count=11, and offset=10 yields the last page of 1 with has_more=false."
        test_recipe:
          setup: ["Client C with 11 assets (tags PG01..PG11) in jurisdiction J"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "PageCo", contact_email: "page@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Page County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_p: $.data.id }
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG01", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG02", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG03", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG04", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG05", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG06", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG07", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG08", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG09", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG10", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_p}", asset_tag: "PG11", category: "FURNITURE", acquisition_cost_cents: 1000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
          trigger:
            - call: "GET /bpp/assets"
              payload: { client_id: "${cl_id}" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
          assert:
            - "Page 1: data length == 10, total_count == 11, has_more == true (default limit 10)"
            - "GET /bpp/assets?client_id=..&offset=10 returns data length == 1, total_count == 11, has_more == false"

      - name: class_rule_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.JurisdictionClassRule.fields.category"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "An out-of-enum category (TOOLS) on class-rule creation is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Jurisdiction J exists"]
          setup_api_calls:
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Enum County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_e: $.data.id }
          trigger:
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_e}", category: "TOOLS", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [80], percent_good_floor_pct: 30, de_minimis_line_cents: 0 }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: rendition_refile_without_amendment_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Rendition.transitions"
          - "validations[priority=6]"
          - "errors[ERR_RENDITION_ALREADY_FILED]"
        distinguishing_aspect: "Filing an already-FILED rendition (no open amendment) is rejected with ERR_RENDITION_ALREADY_FILED and leaves the rendition unchanged."
        test_recipe:
          setup: ["Client C, jurisdiction J (FULL_YEAR [100,100], de_minimis 0), one classified asset cost 100000 acq 2026-01-05; rendition 2027 generated and FILED"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "RefileCo", contact_email: "refile@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Refile County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_r: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_r}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [100, 100], percent_good_floor_pct: 10, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_r}", asset_tag: "RF1", category: "MACHINERY", acquisition_cost_cents: 100000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_r: $.data.id }
            - call: "POST /bpp/assets/${a_r}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_r}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_r: $.data.id }
            - call: "POST /bpp/renditions/${r_r}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_r}/file"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
          trigger:
            - call: "POST /bpp/renditions/${r_r}/file"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RENDITION_ALREADY_FILED and HTTP status == 409"
            - "Rendition.${r_r}.rendition_status == FILED (unchanged)"

      - name: amendment_open_by_filing_operator_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "state_machines.Rendition.FILED_to_AMENDMENT_OPEN"
        distinguishing_aspect: "Segregation of duties: a SeniorManager who FILED the rendition (senior managers may file) cannot OPEN its amendment — same X-User-ID as filed_by_operator_id yields 403 ERR_SEGREGATION_OF_DUTIES; a different SeniorManager succeeds."
        test_recipe:
          setup: ["Client C, jurisdiction J (FULL_YEAR [100,100], de_minimis 0), one classified asset; rendition 2027 FILED by SeniorManager op_m1"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "SodCo", contact_email: "sod@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Manny One", operator_role: "SENIOR_MANAGER" }
              as: FirmAdmin
              captures: { op_m1: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Manny Two", operator_role: "SENIOR_MANAGER" }
              as: FirmAdmin
              captures: { op_m2: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Sod County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_s: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_s}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [100, 100], percent_good_floor_pct: 10, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_s}", asset_tag: "SD1", category: "MACHINERY", acquisition_cost_cents: 100000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_m1}"
              captures: { a_s: $.data.id }
            - call: "POST /bpp/assets/${a_s}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_m1}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_s}", tax_year: 2027 }
              as: SeniorManager
              as_user_id: "${op_m1}"
              captures: { r_s: $.data.id }
            - call: "POST /bpp/renditions/${r_s}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_m1}"
            - call: "POST /bpp/renditions/${r_s}/file"
              payload: {}
              as: SeniorManager
              as_user_id: "${op_m1}"
          trigger:
            - call: "POST /bpp/renditions/${r_s}/amendments"
              payload: { action: "OPEN" }
              as: SeniorManager
              as_user_id: "${op_m1}"
              captures: { err: $.data.error_id }
            - call: "POST /bpp/renditions/${r_s}/amendments"
              payload: { action: "OPEN" }
              as: SeniorManager
              as_user_id: "${op_m2}"
          assert:
            - "First trigger: err == ERR_SEGREGATION_OF_DUTIES and HTTP status == 403 (filer cannot amend own filing)"
            - "Second trigger: 200, Rendition.${r_s}.rendition_status == AMENDMENT_OPEN and amendment_opened_by_operator_id == ${op_m2}"

      - name: bill_validate_by_importing_operator_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "state_machines.TaxBill"
        distinguishing_aspect: "Segregation of duties on a different resource pair than the rendition amendment: the SeniorManager who imported the bill cannot validate it; a second SeniorManager can."
        test_recipe:
          setup: ["Client C, jurisdiction J (FULL_YEAR [100,100], de_minimis 0), one classified asset cost 800000 acq 2026-01-05; rendition FILED; notice 800000 ACCEPTED; bill imported by SeniorManager op_m1 (billed 20000, rate 0.025, due 2027-06-30)"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "SodBillCo", contact_email: "sodb@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Manny One", operator_role: "SENIOR_MANAGER" }
              as: FirmAdmin
              captures: { op_m1: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Manny Two", operator_role: "SENIOR_MANAGER" }
              as: FirmAdmin
              captures: { op_m2: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "SodB County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.025, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_sb: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_sb}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [100, 100], percent_good_floor_pct: 10, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_sb}", asset_tag: "SB1", category: "MACHINERY", acquisition_cost_cents: 800000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_sb: $.data.id }
            - call: "POST /bpp/assets/${a_sb}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_sb}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_sb: $.data.id }
            - call: "POST /bpp/renditions/${r_sb}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_sb}/file"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_sb}/assessment-notices"
              payload: { notice_value_cents: 800000, received_date: "2027-05-01", protest_deadline_date: "2027-05-31" }
              as: AssessorClerk
              captures: { n_sb: $.data.id }
            - call: "POST /bpp/assessment-notices/${n_sb}/accept"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assessment-notices/${n_sb}/tax-bills"
              payload: { billed_amount_cents: 20000, tax_rate: 0.025, due_date: "2027-06-30" }
              as: SeniorManager
              as_user_id: "${op_m1}"
              captures: { b_sb: $.data.id }
          trigger:
            - call: "POST /bpp/tax-bills/${b_sb}/validate"
              payload: {}
              as: SeniorManager
              as_user_id: "${op_m1}"
              captures: { err: $.data.error_id }
            - call: "POST /bpp/tax-bills/${b_sb}/validate"
              payload: {}
              as: SeniorManager
              as_user_id: "${op_m2}"
          assert:
            - "First trigger: err == ERR_SEGREGATION_OF_DUTIES and HTTP status == 403 (importer cannot validate own bill)"
            - "Second trigger: 200, TaxBill.${b_sb}.validation_status == MATCHED and validated_amount_cents == 20000 and validated_by_operator_id == ${op_m2}"

      - name: appeal_withdraw_after_decision_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Appeal.transitions"
          - "errors[ERR_APPEAL_NOT_ACTIONABLE]"
        distinguishing_aspect: "Withdraw is offered only from FILED or HEARING_SCHEDULED; from DECIDED it is rejected with ERR_APPEAL_NOT_ACTIONABLE."
        test_recipe:
