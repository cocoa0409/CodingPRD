              captures: { err: $.data.error_id }
          assert:
            - "${cash2} == 30000 after the fee payment drained 20000"
            - "${err} == ERR_INSUFFICIENT_ESTATE_FUNDS — 30000 < scheduled 50000"

      - name: void_after_plan_executed_rejected
        claim_type: violation_to_error
        grounds: [state_machines.DistributionPayment.PAID_to_VOIDED, "errors[ERR_PLAN_NOT_EXECUTING]"]
        distinguishing_aspect: "Void is only available while the plan is APPROVED: once the last payment resolved and the plan bubbled to EXECUTED, voiding a PAID payment is rejected with ERR_PLAN_NOT_EXECUTING."
        test_recipe:
