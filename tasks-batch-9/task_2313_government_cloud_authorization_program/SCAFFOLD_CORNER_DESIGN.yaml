      guard: an unknown offering_id, engagement_id, supersedes_item_id, authorization_id or sponsor_agency_id each 404 with
      its own error_id — and priority 7 beats both the state gate (11) and the version gate (10), which is why the DRAFT offering''s
      path-selection call still reports the agency 404.'
    test_recipe:
      setup:
