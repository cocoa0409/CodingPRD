      - name: scoring_run_checkpoint_reports_expiry_overdue_and_quota_rederivation
        claim_type: bulk_action
        grounds:
          - endpoints[POST /scoring-runs]
          - state_machines.DataChallenge.INFO_REQUESTED_to_RESOLVED_REJECTED
          - state_machines.CoachingAssignment.ASSIGNED_to_OVERDUE
          - calculations.challenge_quota_ledger
        distinguishing_aspect: |
          One run performs several independent sweeps and reports each in its own counter:
          challenges_expired 1, coaching_marked_overdue 1, coaching_waived 0, carriers_scored 1,
          scores_updated 1 — and the full quota re-derivation drops the 2026-08-01 submission out of
          the rolling 30-day window as of the 2026-09-01 snapshot, so challenge_quota_used returns to 0
          even though the challenge itself is now RESOLVED_REJECTED.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM, exposure 30.0); driver d1 of c1; code 392.2S; UNSAFE_DRIVING/MEDIUM threshold 0.5 / 1.0 / 2.0."
