            - call: "POST /claims"
              payload: { crash_id: "${c_id}", claimant_notice_date: "2026-08-01" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_id: $.data.id }
            - call: "POST /claims/${cl_id}/subrogation-demands"
              payload: { third_party_name: "Muskingum Grading LLC", at_fault_percentage: 1, basis_note: "minimal shared fault for the debris" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pct_lo: $.data.at_fault_percentage, sd_lo_status: $.data.status }
            - call: "POST /claims/${cl_id}/subrogation-demands"
              payload: { third_party_name: "Licking County Haulage", at_fault_percentage: 100, basis_note: "entirely the other unit's failure to yield" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pct_hi: $.data.at_fault_percentage }
            - call: "GET /crashes"
              payload: { driver_id: "${d_id}", limit: 100, offset: 0 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { page_all: $.data }
            - call: "GET /crashes"
              payload: { limit: 1 }
              as: Auditor
