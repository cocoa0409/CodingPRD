  - section: validations
    instances:
      - name: auth_header_missing_and_role_denied_ordering
        claim_type: violation_to_error
        grounds: ["validations", "priority", "validations", "priority", "errors", "ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER", "errors", "ERR_FORBIDDEN_ROLE"]
        distinguishing_aspect: "p1 before p2: a call with no user headers gets 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the path is role-restricted; a declared-but-wrong role gets 403 ERR_FORBIDDEN_ROLE; an unknown role string is a 400, not a 403."
        test_recipe:
          setup: ["Department exists"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Anthro", cost_center: "CC-3800", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "NoHead" }
              as: ""
              captures: { err1: $.data.error_id }
            - call: "POST /vendors"
              payload: { legal_name: "WrongRole" }
              as: APClerk
              captures: { err2: $.data.error_id }
          assert:
            - "missing/invalid user context on a role-restricted endpoint: err1 == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), never ERR_FORBIDDEN_ROLE"
            - "APClerk creating a vendor (Buyer-exclusive): err2 == ERR_FORBIDDEN_ROLE (403); no vendor persisted"

      - name: approver_limit_and_self_approval_forbidden
        claim_type: conditional_validation
        grounds: ["errors", "ERR_APPROVER_LIMIT_EXCEEDED", "errors", "ERR_SELF_APPROVAL_FORBIDDEN", "validations", "priority"]
        distinguishing_aspect: "Two conditional gates on the DEPARTMENT step: the delegated limit applies only at that step (450,000 limit vs 500,000 requisition -> ERR_APPROVER_LIMIT_EXCEEDED), and the requester can never approve their own requisition regardless of role (ERR_SELF_APPROVAL_FORBIDDEN)."
        test_recipe:
          setup: ["Department with default_approval_limit_cents 450,000; requisition R1 500,000 SUBMITTED; requisition R2 400,000 SUBMITTED"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "SmallDept", cost_center: "CC-3900", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 450000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "OfficeCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "OFF", description: "copier", quantity: 1, unit_price_cents: 500000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r1_id: $.data.id }
            - call: "POST /requisitions/${r1_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "OFF", description: "paper", quantity: 1, unit_price_cents: 400000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r2_id: $.data.id }
            - call: "POST /requisitions/${r2_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
          trigger:
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
              captures: { err1: $.data.error_id }
            - call: "POST /requisitions/${r2_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "req-user-1"
              captures: { err2: $.data.error_id }
            - call: "GET /requisitions/${r1_id}"
              as: ProcurementAdmin
              captures: { r1_step: $.data.current_step_index }
          assert:
            - "R1 at the DEPARTMENT step: err1 == ERR_APPROVER_LIMIT_EXCEEDED (500,000 > department limit 450,000); current_step_index stays 0"
            - "R2 approved by the requester acting as DepartmentApprover: err2 == ERR_SELF_APPROVAL_FORBIDDEN (SoD fires even with a correct role)"

      - name: sole_source_justification_conditional_rules
        claim_type: conditional_validation
        grounds: ["errors", "ERR_SOLE_SOURCE_JUSTIFICATION_REQUIRED", "calculations.approval_chain_resolution"]
        distinguishing_aspect: "The sole-source flag is amount-conditional: >= 500,000 it demands a justification (422 without) and inserts the SOLE_SOURCE step; below 500,000 the flag itself is a shape error (400) — three outcomes from one boolean."
        test_recipe:
          setup: ["Department (limit 10,000,000); vendor; R1 600,000 sole-source without justification; R2 600,000 sole-source with justification; R3 400,000 sole-source"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Music3", cost_center: "CC-4000", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "UniqueCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", sole_source_requested: true, lines: [{ commodity_code: "MUS", description: "harp", quantity: 1, unit_price_cents: 600000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r1_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", sole_source_requested: true, sole_source_justification: "only maker", lines: [{ commodity_code: "MUS", description: "harp2", quantity: 1, unit_price_cents: 600000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r2_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", sole_source_requested: true, sole_source_justification: "n/a at this size", lines: [{ commodity_code: "MUS", description: "strings", quantity: 1, unit_price_cents: 400000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /requisitions/${r1_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { err1: $.data.error_id }
            - call: "POST /requisitions/${r2_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { chain2: $.data.required_chain }
            - call: "POST /requisitions/${r3_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { err3: $.data.error_id }
          assert:
            - "R1 (>= 500,000, no justification): err1 == ERR_SOLE_SOURCE_JUSTIFICATION_REQUIRED"
            - "R2 (>= 500,000, justification present): chain == [DEPARTMENT, SOLE_SOURCE, PURCHASING] (SOLE_SOURCE inserted before PURCHASING)"
            - "R3 (< 500,000, sole-source requested): err3 == ERR_INVALID_REQUEST (sole source not applicable below the tier)"

      - name: invoice_line_unknown_and_over_receipt
        claim_type: violation_to_error
        grounds: ["errors", "ERR_INVOICE_LINE_UNKNOWN", "errors", "ERR_OVER_RECEIPT", "calculations.three_way_match"]
        distinguishing_aspect: "Two structural quantity checks on different endpoints: an invoice referencing line_no 9 that does not exist on the PO is rejected outright (422), and a receipt that would push a line's cumulative received quantity past ordered is rejected (422) without partial application."
        test_recipe:
          setup: ["PO (1 line qty 2 @ 300,000) issued; receipt of 1 posted"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "VetMed", cost_center: "CC-4100", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "VetCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "VET", description: "scrubs", quantity: 2, unit_price_cents: 300000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
            - call: "POST /requisitions/${r_id}/issue-po"
              as: Buyer
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }] }
              as: ReceivingClerk
          trigger:
            - call: "POST /purchase-orders/${po_id}/invoices"
              payload: { invoice_number: "INV-X", lines: [{ line_no: 9, quantity: 1, unit_price_cents: 300000 }] }
              as: APClerk
              captures: { err1: $.data.error_id }
            - call: "POST /purchase-orders/${po_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 2 }] }
              as: ReceivingClerk
              captures: { err2: $.data.error_id }
            - call: "GET /purchase-orders/${po_id}"
              as: ProcurementAdmin
              captures: { fs: $.data.fulfillment_status }
          assert:
            - "invoice line_no 9 unknown on the PO: err1 == ERR_INVOICE_LINE_UNKNOWN (invoice not created)"
            - "receipt of 2 more on a line with 1 received of 2 ordered: err2 == ERR_OVER_RECEIPT (cumulative 3 > 2)"
            - "PO unchanged: fulfillment_status == PARTIALLY_RECEIVED"

      - name: mcc_restriction_conditional_on_card_config
        claim_type: conditional_validation
        grounds: ["errors", "ERR_MCC_NOT_ALLOWED", "entities.PCard.fields.allowed_mccs"]
        distinguishing_aspect: "The MCC check is conditional on configuration: with allowed_mccs [5942] a 7011 debit fails with ERR_MCC_NOT_ALLOWED while 5942 posts; a card with an empty allowed_mccs array accepts any MCC."
        test_recipe:
          setup: ["Department; card A allowed_mccs [5942]; card B allowed_mccs []"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Procure", cost_center: "CC-4200", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Max", single_txn_limit_cents: 100000, monthly_limit_cents: 500000, allowed_mccs: ["5942"] }
              as: ProcurementAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Nia", single_txn_limit_cents: 100000, monthly_limit_cents: 500000, allowed_mccs: [] }
              as: ProcurementAdmin
              captures: { pb_id: $.data.id }
          trigger:
            - call: "POST /pcards/${pa_id}/transactions"
              payload: { amount_cents: 5000, entry_type: "DEBIT", merchant_name: "Hotel", mcc_code: "7011" }
              as: Cardholder
              as_user_id: "${pa_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /pcards/${pa_id}/transactions"
              payload: { amount_cents: 5000, entry_type: "DEBIT", merchant_name: "Books", mcc_code: "5942" }
              as: Cardholder
              as_user_id: "${pa_id}"
              captures: { t_status: $.data.status }
            - call: "POST /pcards/${pb_id}/transactions"
              payload: { amount_cents: 5000, entry_type: "DEBIT", merchant_name: "Hotel", mcc_code: "7011" }
              as: Cardholder
              as_user_id: "${pb_id}"
              captures: { t2_status: $.data.status }
          assert:
            - "restricted card, MCC 7011: err1 == ERR_MCC_NOT_ALLOWED"
            - "restricted card, MCC 5942: POSTED"
            - "unrestricted card (empty allowed_mccs), MCC 7011: POSTED"

      - name: purchasing_gate_requires_award_before_step
        claim_type: cross_entity_validation
        grounds: ["errors", "ERR_SOURCING_REQUIRED", "state_machines.Requisition"]
        distinguishing_aspect: "Cross-entity gate at the PURCHASING step: a 3,000,000 requisition with no contract and no approved sole source cannot pass PURCHASING until its solicitation is AWARDED — the step fails with ERR_SOURCING_REQUIRED while the solicitation sits OPEN."
        test_recipe:
          setup: ["Department (limit 10,000,000); vendor; requisition 3,000,000 SUBMITTED, DEPARTMENT approved; solicitation created but still OPEN (deadline 2026-08-08, clock 2026-08-01)"]
