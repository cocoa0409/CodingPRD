        grounds:
          - endpoints."GET /bonus-plans/{planId}/funding-summary"
          - calculations.company_achievement
          - calculations.blended_achievement
          - calculations.funding_curve_multiplier
          - calculations.pool_funding_split
          - entities.BonusPlan.fields.aggregate_rounding_delta_cents
        distinguishing_aspect: |
          The summary is a pure read that must reproduce the whole chain that was
          already committed at funding: two metrics at 50.00 and 75.00 weighted
          60/40 -> company 60.00, BU 100.00, individual 100.00 -> blended exactly
          80.00, the floor multiplier 0.5000, target 4,000,000 + 504,110 =
          4,504,110 and funded 2,252,055. It must not recompute from today's data
          (nothing changed, so a recomputation is indistinguishable) but it must
          also not omit aggregate_rounding_delta_cents, which is 0 here because a
          single pool cannot disagree with the plan total.
        test_recipe:
