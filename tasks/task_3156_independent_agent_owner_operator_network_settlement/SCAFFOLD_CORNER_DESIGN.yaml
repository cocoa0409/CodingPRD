        distinguishing_aspect: "The selector policy pins the tie-break explicitly: two open offers carrying the identical offered_pay_cents of 126000 are separated by offered_at ascending, so the 01:00 offer takes rank 1 and the 02:00 offer rank 2 with no dependence on the row ids."
