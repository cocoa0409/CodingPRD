          Entity pair Order -> DeliveryPartner. The Order is impeccable — PREVERIFIED,
          SUBMITTED, inside its window, under both quantity ceilings — yet its
          SUBMITTED -> DISPATCHED transition is refused because a DIFFERENT entity, its
          DeliveryPartner, holds posture SUSPENDED (two OPEN CRITICAL cases reach
