              as: ServiceManager
              as_user_id: "svc-1"
              captures: { err_mod: $.data.error_id }
            - call: "POST /service-contracts/00000000-0000-0000-0000-0000000000ff/spare-reservations"
              payload: { module_id: "${sp1}", expected_service_contract_version: "${scv0}" }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { err_sc: $.data.error_id }
            - call: "POST /service-contracts/${sc}/spare-reservations"
