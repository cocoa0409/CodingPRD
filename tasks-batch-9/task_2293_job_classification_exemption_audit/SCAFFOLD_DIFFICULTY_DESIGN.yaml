            - "AuditProject.${proj_id}.remediation_posture == OPEN"
            - "AuditProject.${proj_id}.converted_annual_payroll_delta_cents == 0"

      - name: reverting_a_pay_conversion_restores_the_converted_payroll_delta_ledger
        grounds:
          - state_machines.ReclassificationCase.CONVERTED_to_REVERTED
          - entities.AuditProject.fields.converted_annual_payroll_delta_cents
          - entities.AuditProject.fields.committed_correction_cents
          - calculations.pay_structure_conversion
        distinguishing_aspect: |
          A different conserved quantity from the headcount ledger: the signed money ledger
          AuditProject.converted_annual_payroll_delta_cents, which holds a *negative* balance
          (-1156) because the cost-neutral conversion saves money. The compensation must subtract
          a negative number and land exactly on 0 rather than on -2312, and it must not disturb
          committed_correction_cents, which stays at 22274928 because the approved voluntary
          correction is a separate commitment that reverting payroll does not release.
