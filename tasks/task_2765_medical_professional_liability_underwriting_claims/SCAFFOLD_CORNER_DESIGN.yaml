  # =========================================================================
  # Table 6 (Errors): every one of the 60 catalog codes must be triggerable.
  # The instances below close the codes that neither §1.8 nor the sections
  # above already trigger; codes already asserted elsewhere carry an
  # `excluded_because:` stub naming the §1.8 instance that raises them.
  # Ordering matters throughout: each instance pins WHICH priority answers.
