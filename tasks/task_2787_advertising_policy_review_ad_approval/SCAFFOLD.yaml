    output: EnforcementAction
    side_effects: ["writes origin MANUAL, effective_from = logical clock, severity_index_at_issue from calculations.enforcement_severity_index", "defaults effective_until to effective_from + ENFORCEMENT_DURATION_DAYS[action_type]", "moves any existing ACTIVE action to SUPERSEDED", "re-derives Advertiser.account_status and increments Advertiser.version by 1", "a SUSPENSION sweeps the advertiser's creatives to SUSPENDED_HOLD and expires their ReviewTasks"]

  - method: GET
