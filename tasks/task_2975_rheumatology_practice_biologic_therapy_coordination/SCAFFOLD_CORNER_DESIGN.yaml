              payload: { current_utc: "2027-07-22T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: RegistryAdmin
          assert:
            - "read at 2026-08-01T00:00:00Z: tb_screen_status == \"CLEARED\" and hbv_screen_status == \"INCOMPLETE\""
            - "read at 2027-07-21T00:00:00Z: tb_screen_status == \"CLEARED\" (exactly 365 days is still current)"
            - "read at 2027-07-22T00:00:00Z: tb_screen_status == \"EXPIRED\" (not \"MISSING\" — a record exists, it is merely stale)"
            - "hbv_screen_status is \"INCOMPLETE\" at all three reads (no HBV record was ever filed)"

