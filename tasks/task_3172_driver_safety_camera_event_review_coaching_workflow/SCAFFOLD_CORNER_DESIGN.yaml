              as: TelematicsIngest
              captures: { err_nd: $.data.error_id }
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "LOW", occurred_at: "2026-08-31T00:00:00Z" }
              as: TelematicsIngest
          assert:
            - "DISTRACTION ingest: HTTP 422 and err_nd == ERR_EVENT_TYPE_DISABLED"
            - "HARSH_BRAKE ingest: HTTP 201"
            - "GET /api/fleets/${fleet_id}/safety-events returns exactly 1 row"

      - name: duplicate_claim_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_DUPLICATE_CLAIM
        distinguishing_aspect: "A second non-REJECTED claim on the same event fails 409 ERR_DUPLICATE_CLAIM; after the first claim is REJECTED a new claim may be filed."
        test_recipe:
          setup:
            - "Clock set; base setup; one MEDIUM COLLISION event CONFIRMED; first claim SUBMITTED."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "COLLISION", severity: "MEDIUM", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_dc: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_dc}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_dc: $.data.id }
            - call: "POST /api/footage-clips/${cl_dc}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_dc}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_dc}"
              payload: {}
              as: SafetyManager
              captures: { ev_dc_v: $.data.version }
            - call: "POST /api/safety-events/${ev_dc}/review"
              payload: { action: "CONFIRM", rationale: "at fault", expected_event_version: "${ev_dc_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
            - call: "POST /api/safety-events/${ev_dc}/exoneration-claims"
              payload: { claim_ref: "CLM-300" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { claim_dc: $.data.id }
          trigger:
            - call: "POST /api/safety-events/${ev_dc}/exoneration-claims"
              payload: { claim_ref: "CLM-301" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err_dc: $.data.error_id }
            - call: "POST /api/exoneration-claims/${claim_dc}/begin-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca-1"
            - call: "POST /api/exoneration-claims/${claim_dc}/decide"
              payload: { decision: "REJECT", rationale: "insufficient evidence" }
              as: ClaimsAdjuster
              as_user_id: "ca-1"
            - call: "POST /api/safety-events/${ev_dc}/exoneration-claims"
              payload: { claim_ref: "CLM-302" }
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "second claim while first SUBMITTED: HTTP 409 and err_dc == ERR_DUPLICATE_CLAIM"
            - "after REJECT, third claim: HTTP 201 (REJECTED claims do not block)"
            - "GET /api/safety-events/${ev_dc}/exoneration-claims returns 2 rows"
            - "SafetyEvent.${ev_dc}.status == CONFIRMED (REJECT leaves the event untouched)"

