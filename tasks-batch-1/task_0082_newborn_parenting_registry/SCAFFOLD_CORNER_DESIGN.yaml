scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_insurance_policy_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.InsurancePolicy, endpoints]
        distinguishing_aspect: "POST /insurance-policies with all required fields returns 201 and echoes carrier_name/plan_type plus system id, version 1, dependents_added_count 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
          trigger:
            - call: "POST /insurance-policies"
              payload: { carrier_name: "MktCo", subscriber_name: "Pat Doe", plan_type: "MARKETPLACE", coverage_effective_date: "2026-01-01", dependent_slots_max: 2 }
              as: BenefitsCoordinator
              captures: { pid: $.data.id, ver: $.data.version, cnt: $.data.dependents_added_count }
          assert:
            - "response code == 201"
            - "InsurancePolicy.${pid}.version == 1"
            - "InsurancePolicy.${pid}.dependents_added_count == 0"
            - "InsurancePolicy.${pid}.plan_type == MARKETPLACE"

      - name: get_newborn_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Newborn", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /newborns/{random-uuid} for a non-existent id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
          trigger:
            - call: "GET /newborns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AttendingNurse
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_registration_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.PreRegistration.fields.due_date", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /registrations omitting due_date (required, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An InsurancePolicy exists to satisfy the payer_policy_id FK if reached, but the body omits due_date."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_registration_default_birth_plan_flags_applied
        claim_type: Defaults
        grounds: [entities.PreRegistration.fields.birth_plan_flags, entities.PreRegistration.fields.status]
        distinguishing_aspect: "POST /registrations omitting birth_plan_flags applies default {} and status DRAFT, newborn_count 0."
        test_recipe:
          setup: ["One InsurancePolicy exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id, st: $.data.status, bpf: $.data.birth_plan_flags, nc: $.data.newborn_count }
          assert:
            - "PreRegistration.${reg_id}.status == DRAFT"
            - "PreRegistration.${reg_id}.birth_plan_flags == {}"
            - "PreRegistration.${reg_id}.newborn_count == 0"

      - name: newborn_count_computed_field_updates_on_birth
        claim_type: Computed Fields
        grounds: [entities.PreRegistration.fields.newborn_count]
        distinguishing_aspect: "After two POST /registrations/{id}/newborns calls (sequences 1 and 2), PreRegistration.newborn_count == 2 (server-computed, not client-supplied)."
        test_recipe:
          setup: ["An ADMITTED PreRegistration."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:05:00Z", birth_sequence: 2, weight_grams: 3100, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
          trigger:
            - call: "GET /registrations/${reg_id}"
              payload: {}
              as: IntakeClerk
              captures: { nc: $.data.newborn_count, st: $.data.status }
          assert:
            - "PreRegistration.${reg_id}.newborn_count == 2"
            - "PreRegistration.${reg_id}.status == BIRTH_RECORDED"

      - name: newborn_id_and_system_fields_server_generated
        claim_type: System Fields
        grounds: [entities.Newborn.fields.clinical_status, entities.Newborn.fields.care_location]
        distinguishing_aspect: "A newly recorded Newborn starts in clinical_status BORN, care_location WELL_BABY_NURSERY, version 1, with a server-minted id regardless of input."
        test_recipe:
          setup: ["An ADMITTED PreRegistration."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
          trigger:
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id, cs: $.data.clinical_status, cl: $.data.care_location, v: $.data.version }
          assert:
            - "Newborn.${nb_id}.clinical_status == BORN"
            - "Newborn.${nb_id}.care_location == WELL_BABY_NURSERY"
            - "Newborn.${nb_id}.version == 1"

      - name: newborn_apgar_out_of_range_rejected
        claim_type: Type Constraints
        grounds: ["entities.Newborn.fields.apgar_5min", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Recording a birth with apgar_5min == 11 (out of the 0-10 range) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An ADMITTED PreRegistration."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
          trigger:
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 11 }
              as: AttendingNurse
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_birth_sequence_within_registration_rejected
        claim_type: Type Constraints
        grounds: ["entities.Newborn.fields.birth_sequence", "validations[priority=14]", "errors[ERR_DUPLICATE_BIRTH_SEQUENCE]"]
        distinguishing_aspect: "Recording a second birth with birth_sequence 1 (already used) under the same PreRegistration returns ERR_DUPLICATE_BIRTH_SEQUENCE (409)."
        test_recipe:
          setup: ["A BIRTH_RECORDED PreRegistration that already has a newborn with birth_sequence 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
          trigger:
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:10:00Z", birth_sequence: 1, weight_grams: 3000, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_DUPLICATE_BIRTH_SEQUENCE"

      - name: list_nicu_beds_pagination_envelope
        claim_type: Listing
        grounds: [entities.NicuBed, endpoints]
        distinguishing_aspect: "GET /nicu-beds?limit=1 over a pool of 2 beds returns total_count 2 and has_more true with one item."
        test_recipe:
          setup: ["Two NICU beds registered."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /nicu-beds"
              payload: { bed_label: "NICU-1", acuity_level: "LEVEL_3" }
              as: Neonatologist
            - call: "POST /nicu-beds"
              payload: { bed_label: "NICU-2", acuity_level: "LEVEL_2" }
              as: Neonatologist
          trigger:
            - call: "GET /nicu-beds?limit=1&offset=0"
              payload: {}
              as: Neonatologist
          assert:
            - "meta/pagination total_count == 2"
            - "has_more == true"
            - "returned array length == 1"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: registration_admit_outside_window_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.PreRegistration.SUBMITTED_to_ADMITTED", "errors[ERR_ADMIT_WINDOW_CLOSED]"]
        distinguishing_aspect: "Admitting at clock 2026-01-01 (outside [due_date-21d, due_date+21d] for due_date 2026-03-20) returns ERR_ADMIT_WINDOW_CLOSED (422)."
        test_recipe:
          setup: ["A SUBMITTED PreRegistration with due_date 2026-03-20; clock at 2026-01-01T00:00:00Z (before the window opens on 2026-02-27)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-20", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
          trigger:
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "data.error_id == ERR_ADMIT_WINDOW_CLOSED"

      - name: submit_registration_from_draft_valid_transition
        claim_type: Valid Transition
        grounds: [state_machines.PreRegistration.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "POST /registrations/{id}/submit on a DRAFT registration moves it to SUBMITTED and bumps version to 2."
        test_recipe:
          setup: ["A DRAFT PreRegistration (version 1)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
              captures: { st: $.data.status, v: $.data.version }
          assert:
            - "PreRegistration.${reg_id}.status == SUBMITTED"
            - "PreRegistration.${reg_id}.version == 2"

      - name: room_in_from_discharged_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Newborn", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /newborns/{id}/room-in on a DISCHARGED newborn (no room-in transition from DISCHARGED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DISCHARGED newborn (full happy path)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9, legal_name: "Baby Doe" }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /newborns/${nb_id}/room-in"
              payload: {}
              as: AttendingNurse
            - call: "POST /lactation-consults"
              payload: { newborn_id: "${nb_id}", consult_datetime: "2026-03-05T11:00:00Z" }
              as: AttendingNurse
              captures: { lc_id: $.data.id }
            - call: "POST /lactation-consults/${lc_id}/complete"
              payload: { latch_score: 8 }
              as: AttendingNurse
            - call: "POST /discharge-bags"
              payload: { newborn_id: "${nb_id}", line_items: [ { sku: "FORM-A", category: "FORMULA", qty: 2, unit_value_cents: 1299 } ] }
              as: AttendingNurse
              captures: { bag_id: $.data.id }
            - call: "POST /discharge-bags/${bag_id}/assemble"
              payload: {}
              as: AttendingNurse
            - call: "POST /discharge-bags/${bag_id}/issue"
              payload: {}
              as: AttendingNurse
            - call: "POST /government-filings"
              payload: { newborn_id: "${nb_id}", filing_type: "BIRTH_CERTIFICATE" }
              as: VitalRecordsOfficer
              captures: { bc_id: $.data.id }
            - call: "POST /government-filings/${bc_id}/submit"
              payload: {}
              as: VitalRecordsOfficer
            - call: "POST /newborns/${nb_id}/mark-discharge-ready"
              payload: {}
              as: AttendingNurse
            - call: "POST /newborns/${nb_id}/discharge"
              payload: {}
              as: AttendingNurse
          trigger:
            - call: "POST /newborns/${nb_id}/room-in"
              payload: {}
              as: AttendingNurse
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: discharged_newborn_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Newborn", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DISCHARGED is terminal: a second POST /newborns/{id}/discharge returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DISCHARGED newborn (full happy path)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9, legal_name: "Baby Doe" }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /newborns/${nb_id}/room-in"
              payload: {}
              as: AttendingNurse
            - call: "POST /lactation-consults"
              payload: { newborn_id: "${nb_id}", consult_datetime: "2026-03-05T11:00:00Z" }
              as: AttendingNurse
              captures: { lc_id: $.data.id }
            - call: "POST /lactation-consults/${lc_id}/complete"
              payload: { latch_score: 8 }
              as: AttendingNurse
            - call: "POST /discharge-bags"
              payload: { newborn_id: "${nb_id}", line_items: [ { sku: "FORM-A", category: "FORMULA", qty: 2, unit_value_cents: 1299 } ] }
              as: AttendingNurse
              captures: { bag_id: $.data.id }
            - call: "POST /discharge-bags/${bag_id}/assemble"
              payload: {}
              as: AttendingNurse
            - call: "POST /discharge-bags/${bag_id}/issue"
              payload: {}
              as: AttendingNurse
            - call: "POST /government-filings"
              payload: { newborn_id: "${nb_id}", filing_type: "BIRTH_CERTIFICATE" }
              as: VitalRecordsOfficer
              captures: { bc_id: $.data.id }
            - call: "POST /government-filings/${bc_id}/submit"
              payload: {}
              as: VitalRecordsOfficer
            - call: "POST /newborns/${nb_id}/mark-discharge-ready"
              payload: {}
              as: AttendingNurse
            - call: "POST /newborns/${nb_id}/discharge"
              payload: {}
              as: AttendingNurse
          trigger:
            - call: "POST /newborns/${nb_id}/discharge"
              payload: {}
              as: AttendingNurse
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: lactation_consult_complete_latch_below_7_branches_feeding_at_risk
        claim_type: Valid Transition
        grounds: [state_machines.LactationConsult.SCHEDULED_to_FEEDING_AT_RISK, entities.LactationConsult.fields.feeding_adequate]
