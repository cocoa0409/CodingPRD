              as: RightsHolder
              as_user_id: "rh-windows-1"
              captures: { rf_x: $.data.id }
            - call: "POST /api/channels/${ch_x}/content-items"
              payload: { title: "Window Source", duration_seconds: 800, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_x}"
              captures: { i_x: $.data.id }
            - call: "POST /api/channels/${ch_x}/content-items/${i_x}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_x}"
            - call: "GET /api/claims"
              payload: { content_item_id: "${i_x}" }
              as: Any
              captures: { "cl_x": "$.data[0].id", "cl_xv1": "$.data[0].version" }
            - call: "POST /api/claims/${cl_x}/dispute"
              payload: { expected_claim_version: "${cl_xv1}", reason_code: "FAIR_USE" }
              as: Creator
              as_user_id: "${ch_x}"
            - call: "POST /api/claims/${cl_x}/appeals"
              payload: { grounds_code: "REVIEW_ERROR" }
              as: RightsHolder
              as_user_id: "${rf_x}"
              captures: { ap_x1: $.data.id }
            - call: "POST /api/claims/${cl_x}/appeals/${ap_x1}/decide"
              payload: { decision: "UPHOLD" }
              as: RightsHolder
