# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Municipal Transfer of Development Rights (TDR) Program — task 2756
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Deleting this file leaves
# the scaffold's declared behavior identical.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: parcel_allocation_v1_net_acre_vs_v2_gross_discounted
        grounds:
          - calculations.parcel_baseline_allocation
          - entities.SendingArea.fields.allocation_formula_version
          - entities.SendingArea.fields.gross_discount_factor
          - entities.SendingParcel.fields.baseline_allocation_units
          - entities.SendingParcel.fields.constrained_acres
        distinguishing_aspect: |
          This instance is dual-variant logic on the SendingParcel development-right
          allocation domain (units of entitlement derived from acreage and soil class):
          two ordinances that adopted different allocation formulas award a DIFFERENT
          integer unit count for byte-identical parcel geometry — 22 under V1_NET_ACRE
          versus 23 under V2_GROSS_DISCOUNTED — because V1 subtracts constrained_acres
          while V2 ignores them and discounts gross acreage instead.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one LANDOWNER party"
            - "sending area SA-V1: allocation_formula_version V1_NET_ACRE, base_rate_units_per_acre 0.25, gross_discount_factor 0.80, equity_tier UNDERSERVED, sending_cap_units 200, status ACTIVE"
            - "sending area SA-V2: identical numbers but allocation_formula_version V2_GROSS_DISCOUNTED, status ACTIVE"
            - "no parcels exist yet"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-V1", name: "East Ridge V1", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_v1_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_v1_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-V2", name: "East Ridge V2", neighborhood_code: "NB-EAST", allocation_formula_version: "V2_GROSS_DISCOUNTED", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_v2_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_v2_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_v1_id}", apn: "APN-V1", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_v1_id: $.data.id }
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_v2_id}", apn: "APN-V2", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_v2_id: $.data.id }
          assert:
            - "SendingParcel.${parcel_v1_id}.baseline_allocation_units == 22"
            - "SendingParcel.${parcel_v2_id}.baseline_allocation_units == 23"
            - "SendingParcel.${parcel_v2_id}.baseline_allocation_units - SendingParcel.${parcel_v1_id}.baseline_allocation_units == 1"
            - "SendingParcel.${parcel_v1_id}.remaining_units == 22 and SendingParcel.${parcel_v2_id}.remaining_units == 23"
            - "SendingParcel.${parcel_v1_id}.severed_units == 0 and SendingParcel.${parcel_v2_id}.severed_units == 0"
            - "SendingParcel.${parcel_v1_id}.parcel_status == UNSEVERED and SendingParcel.${parcel_v2_id}.parcel_status == UNSEVERED"

      - name: equity_index_acreage_weighted_vs_parcel_count_weighted
        grounds:
          - calculations.program_evaluation_metrics
          - entities.ProgramEvaluation.fields.equity_weighting
          - entities.ProgramEvaluation.fields.equity_index
          - entities.SendingArea.fields.equity_tier
          - entities.ConservationEasement.fields.restricted_acres
        distinguishing_aspect: |
          This instance is dual-variant logic on the ProgramEvaluation equity-reporting
          domain (a neighborhood-equity percentage over preserved land), a different
          entity and a different metric from the parcel allocation instance: the SAME two
          recorded easements yield equity_index 83.33 when the underserved share is
          weighted by preserved ACREAGE and 50.00 when it is weighted by easement COUNT.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one LANDOWNER party owning two parcels in two different sending areas"
            - "SA-EAST is equity_tier UNDERSERVED; SA-WEST is equity_tier HIGH_VALUE; both ACTIVE"
            - "parcel APN-E (100.00 gross / 22.00 constrained / PRIME / 2 dwellings) in SA-EAST -> baseline 22 units"
            - "parcel APN-W (20.00 gross / 0.00 constrained / LOCAL / 0 dwellings) in SA-WEST -> baseline 5 units"
            - "both parcels fully severed and certified on 2026-08-10, producing easements with restricted_acres 100.00 (UNDERSERVED) and 20.00 (HIGH_VALUE)"
            - "preserved_acres in August 2026 is 120.00 across 2 easements; 27 units issued; nothing redeemed or retired; no receiving areas exist"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_east_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_east_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-WEST", name: "West Bench", neighborhood_code: "NB-WEST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "HIGH_VALUE", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_west_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_west_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_east_id}", apn: "APN-E", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_e_id: $.data.id }
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_west_id}", apn: "APN-W", gross_acres: 20.00, constrained_acres: 0.00, soil_class: "LOCAL", existing_dwelling_units: 0 }
              as: ProgramAdministrator
              captures: { parcel_w_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_e_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_e_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_e_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_e_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_e_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_e_id: $.data.id, eas_e_id: $.data.conservation_easement_id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_w_id}", applicant_party_id: "${own_id}", requested_units: 5 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_w_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_w_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_w_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_w_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_w_id: $.data.id, eas_w_id: $.data.conservation_easement_id }
          trigger:
            - call: "POST /tdr/evaluations"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", equity_weighting: "ACREAGE_WEIGHTED" }
              as: ProgramAdministrator
              captures: { eval_acre_id: $.data.id }
            - call: "POST /tdr/evaluations"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", equity_weighting: "PARCEL_COUNT_WEIGHTED" }
              as: ProgramAdministrator
              captures: { eval_count_id: $.data.id }
          assert:
            - "ProgramEvaluation.${eval_acre_id}.equity_index == 83.33"
            - "ProgramEvaluation.${eval_count_id}.equity_index == 50.00"
            - "ProgramEvaluation.${eval_acre_id}.preserved_acres == 120.00 and ProgramEvaluation.${eval_count_id}.preserved_acres == 120.00"
            - "ProgramEvaluation.${eval_acre_id}.easement_count == 2 and ProgramEvaluation.${eval_count_id}.easement_count == 2"
            - "ProgramEvaluation.${eval_count_id}.issued_units == 27"
            - "ProgramEvaluation.${eval_count_id}.redeemed_units == 0 and ProgramEvaluation.${eval_count_id}.retired_units == 0"
            - "ProgramEvaluation.${eval_count_id}.outstanding_units == 27"
            - "ProgramEvaluation.${eval_count_id}.absorption_pct == 0.00"
            - "ProgramEvaluation.${eval_acre_id}.status == SUPERSEDED"
            - "ProgramEvaluation.${eval_count_id}.status == COMPUTED"
            - "ConservationEasement.${eas_e_id}.restricted_acres == 100.00 and ConservationEasement.${eas_w_id}.restricted_acres == 20.00"

  - rule_id: combinatorial_formula
    instances:

      - name: receiving_bonus_nested_min_over_site_tier_and_density_mode_a
        grounds:
          - calculations.receiving_bonus_units
          - entities.ReceivingArea.fields.base_density_units_per_acre
          - entities.ReceivingArea.fields.max_bonus_pct
          - entities.ReceivingSiteApplication.fields.base_units
          - entities.ReceivingSiteApplication.fields.max_bonus_units
          - entities.ReceivingSiteApplication.fields.provisional_bonus_units
          - entities.ReceivingSiteApplication.fields.required_backing_units
        distinguishing_aspect: |
          Mode (a): a five-input non-linear formula — site_acres, base_density_units_per_acre,
          max_bonus_pct, a size-band tier factor selected by a conditional branch on
          site_acres, and requested_bonus_units — combined through two separate floor()
          steps and a nested min(). Two sites in the SAME receiving area fall in different
          size bands (1.00 versus 0.75) and therefore get max_bonus_units 16 versus 2.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one DEVELOPER party"
            - "receiving area RA-CORE: base_density_units_per_acre 4.0, max_bonus_pct 0.35, absorption_cap_units 500, design_review_required false, eligible_sending_area_codes empty, status ACTIVE"
            - "no receiving site applications exist yet"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /tdr/receiving-areas"
              payload: { code: "RA-CORE", name: "Core Receiving Area", neighborhood_code: "NB-CORE", base_density_units_per_acre: 4.0, max_bonus_pct: 0.35, absorption_cap_units: 500, design_review_required: false, eligible_sending_area_codes: [] }
              as: ProgramAdministrator
              captures: { ra_id: $.data.id }
            - call: "POST /tdr/receiving-areas/${ra_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /tdr/receiving-site-applications"
              payload: { developer_party_id: "${dev_id}", receiving_area_id: "${ra_id}", site_acres: 12.00, requested_bonus_units: 20 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { rsa_big_id: $.data.id }
            - call: "POST /tdr/receiving-site-applications"
              payload: { developer_party_id: "${dev_id}", receiving_area_id: "${ra_id}", site_acres: 2.50, requested_bonus_units: 20 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { rsa_small_id: $.data.id }
          assert:
            - "ReceivingSiteApplication.${rsa_big_id}.base_units == 48"
            - "ReceivingSiteApplication.${rsa_big_id}.max_bonus_units == 16"
            - "ReceivingSiteApplication.${rsa_big_id}.required_backing_units == 16"
            - "ReceivingSiteApplication.${rsa_big_id}.provisional_bonus_units == 8"
            - "ReceivingSiteApplication.${rsa_small_id}.base_units == 10"
            - "ReceivingSiteApplication.${rsa_small_id}.max_bonus_units == 2"
            - "ReceivingSiteApplication.${rsa_small_id}.required_backing_units == 2"
            - "ReceivingSiteApplication.${rsa_small_id}.provisional_bonus_units == 1"
            - "ReceivingSiteApplication.${rsa_big_id}.status == DESIGN_APPROVED and ReceivingSiteApplication.${rsa_small_id}.status == DESIGN_APPROVED"
            - "ReceivingSiteApplication.${rsa_big_id}.allocated_bonus_units == 0 and ReceivingSiteApplication.${rsa_small_id}.allocated_bonus_units == 0"

      - name: bank_purchase_price_rounds_per_unit_before_multiplying_mode_b
        grounds:
          - calculations.bank_channel_price
          - calculations.appraisal_reference_value
          - entities.MarketTransaction.fields.applied_per_unit_value_cents
          - entities.MarketTransaction.fields.gross_price_cents
          - entities.MarketTransaction.fields.appraised_reference_cents
          - entities.AppraisalSchedule.fields.equity_adjustment_bps
        distinguishing_aspect: |
          Mode (b): nested rounding whose ORDER changes the cents. The scaffold pins
          "round the equity-adjusted per-unit value to whole cents, then multiply by
          units"; for 22 units at a 1234567-cent schedule with a +250 bps equity
          adjustment and a 300 bps bank purchase discount that yields exactly 27004296,
          whereas multiplying first and rounding the total once yields 27004298.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER, DEVELOPER, and MUNICIPAL_BANK parties exist"
            - "sending area SA-EAST (V1_NET_ACRE, base_rate 0.25, UNDERSERVED, cap 200) is ACTIVE in neighborhood NB-EAST"
            - "ACTIVE appraisal schedule for NB-EAST: per_unit_value_cents 1234567, equity_adjustment_bps 250, window 2026-01-01 to 2027-01-01"
            - "parcel APN-001 (100.00 / 22.00 / PRIME / 2 dwellings) fully severed and certified -> a 22-unit certificate held by the landowner, lifecycle ISSUED, market HELD"
            - "the certificate's easement is RECORDED and COMPLIANT"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/parties"
              payload: { kind: "MUNICIPAL_BANK", legal_name: "City TDR Bank", contact_email: "bank@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { bank_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1234567, equity_adjustment_bps: 250, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id }
          trigger:
            - call: "POST /tdr/market-transactions"
              payload: { certificate_id: "${cert_id}", seller_party_id: "${own_id}", buyer_party_id: "${bank_id}", channel: "BANK_PURCHASE", units: 22, conveyance_mode: "WHOLE" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { mtx_id: $.data.id }
          assert:
            - "MarketTransaction.${mtx_id}.applied_per_unit_value_cents == 1265431"
            - "MarketTransaction.${mtx_id}.appraised_reference_cents == 27839482"
            - "MarketTransaction.${mtx_id}.gross_price_cents == 27004296"
            - "MarketTransaction.${mtx_id}.gross_price_cents != 27004298"
            - "MarketTransaction.${mtx_id}.price_deviation_bps == -300"
            - "MarketTransaction.${mtx_id}.applied_neighborhood_code == NB-EAST"
            - "MarketTransaction.${mtx_id}.status == PROPOSED"
            - "MarketTransaction.${mtx_id}.program_fee_cents == 0 and MarketTransaction.${mtx_id}.net_to_seller_cents == 0"
            - "Certificate.${cert_id}.market_status == UNDER_CONTRACT and Certificate.${cert_id}.units_encumbered == 22"

      - name: settlement_fee_tier_keyed_on_gross_not_on_net_mode_c
        grounds:
          - calculations.settlement_split
          - entities.MarketTransaction.fields.program_fee_cents
          - entities.MarketTransaction.fields.equity_surcharge_cents
          - entities.MarketTransaction.fields.net_to_seller_cents
          - entities.SendingArea.fields.equity_tier
          - state_machines.MarketTransaction.PROPOSED_to_SETTLED
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency the scaffold breaks by pinning the
          evaluation order. net_to_seller_cents = gross - fee - surcharge, while the fee
          basis-point tier is selected from a price band — so keying the tier off the net
          would make the two mutually dependent. The scaffold pins the tier to GROSS: at
          gross 25100000 the tier is 200 bps (fee 502000); keying it off the resulting
          net of 24221500 would have selected 275 bps and a fee of 666091.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER, DEVELOPER, and MUNICIPAL_BANK parties exist"
            - "sending area SA-HIGH in neighborhood NB-WEST is equity_tier HIGH_VALUE (equity surcharge 150 bps) and ACTIVE"
            - "ACTIVE appraisal schedule for NB-WEST: per_unit_value_cents 1234567, equity_adjustment_bps 250 -> appraised reference 27839482 for 22 units"
            - "a 22-unit certificate held by the landowner, easement RECORDED and COMPLIANT"
            - "the developer's cash_balance_cents is exactly 30000000"
            - "a PROPOSED PRIVATE transaction: 22 units, agreed_price_cents 25100000, gross_price_cents 25100000, price_deviation_bps -984"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Bench Orchards LLC", contact_email: "bench@example.org", neighborhood_code: "NB-WEST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id, dev_v: $.data.version }
            - call: "POST /tdr/parties"
              payload: { kind: "MUNICIPAL_BANK", legal_name: "City TDR Bank", contact_email: "bank@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { bank_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-HIGH", name: "West Bench", neighborhood_code: "NB-WEST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "HIGH_VALUE", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-WEST", per_unit_value_cents: 1234567, equity_adjustment_bps: 250, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-W01", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
