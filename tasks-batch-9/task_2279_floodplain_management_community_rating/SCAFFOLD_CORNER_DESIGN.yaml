            - "Structure.${struct_id}.anchor_record_id == null"
            - "Structure.${struct_id}.cumulative_counted_cost_usd == 0"
            - "Structure.${struct_id}.cumulative_improvement_pct == 0.00"

      - name: certification_with_a_still_submitted_standard_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_86
          - errors.ERR_UNRESOLVED_SUBMISSIONS
          - state_machines.CrsCycle.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          The very SUBMITTED standard that made the cycle submittable also blocks
          certification: with one A430_FREEBOARD package still awaiting state review, certify
          returns 422 ERR_UNRESOLVED_SUBMISSIONS, the cycle stays SUBMITTED and
          Community.crs_class is not touched.
        test_recipe:
          setup:
            - "Community with freeboard_ft 1.5; A430_FREEBOARD standard for 2026 claiming 100 points, submitted but not verified."
            - "CrsCycle 2026 covering 2026-01-01..2026-12-31 (due 2027-03-01) submitted."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "GET /floodplain/communities/${comm_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { comm_version: $.data.version }
            - call: "POST /floodplain/higher-standards"
              payload: { community_id: "${comm_id}", activity_code: "A430_FREEBOARD", documentation_cycle_year: 2026, claimed_points: 100, expected_community_version: "${comm_version}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { std_id: $.data.id }
            - call: "POST /floodplain/higher-standards/${std_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2026, cycle_start_date: "2026-01-01T00:00:00Z", cycle_end_date: "2026-12-31T00:00:00Z", due_at: "2027-03-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_id: $.data.id }
            - call: "POST /floodplain/crs-cycles/${cycle_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/crs-cycles/${cycle_id}/certify"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_UNRESOLVED_SUBMISSIONS'"
            - "CrsCycle.${cycle_id}.status == SUBMITTED"
            - "CrsCycle.${cycle_id}.total_claimed_points == 100"
            - "CrsCycle.${cycle_id}.provisional_class == 10"
            - "CrsCycle.${cycle_id}.resulting_class == null"
            - "HigherStandard.${std_id}.documentation_status == SUBMITTED"
            - "Community.${comm_id}.crs_class == 10"

      - name: certification_without_the_required_verification_visit_is_rejected
        claim_type: conditional_validation
        grounds:
          - validations.priority_86
          - errors.ERR_VERIFICATION_VISIT_REQUIRED
          - calculations.derived_deadlines_and_loop_limits.constants.VERIFICATION_VISIT_YEAR_MODULUS
        distinguishing_aspect: |
          2025 is divisible by VERIFICATION_VISIT_YEAR_MODULUS 5, so
          verification_visit_required is true at creation and certify is refused with 422
          ERR_VERIFICATION_VISIT_REQUIRED even though every standard is already VERIFIED — the
          same cycle numbered 2026 would certify without a visit.
        test_recipe:
          setup:
            - "Community with freeboard_ft 1.5; A430_FREEBOARD standard for 2025 claiming 100 points, submitted and VERIFIED."
            - "CrsCycle 2025 covering 2025-01-01..2025-12-31 with due_at 2026-09-01, submitted; no verify-visit recorded."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
