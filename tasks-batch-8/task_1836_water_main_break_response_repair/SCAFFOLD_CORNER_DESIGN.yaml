        claim_type: violation_to_error
        grounds: [calculations.sample_spacing, "errors[ERR_TEST_SAMPLE_TOO_SOON]"]
        distinguishing_aspect: "A second sample 10 hours after the previous one violates the 20-hour spacing rule -> ERR_TEST_SAMPLE_TOO_SOON; spacing of exactly 20 hours is accepted."
        test_recipe:
