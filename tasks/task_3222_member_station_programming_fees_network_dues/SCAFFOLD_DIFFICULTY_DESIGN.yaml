scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dual_fee_adjustment_per_station_projection
        grounds:
          - calculations.programming_fee_provisional
          - calculations.programming_fee_final_adjusted
          - calculations.programming_fee_final_adjusted.variants.per_station_projection
          - calculations.programming_fee_final_adjusted.variants.schedule_unadjusted
          - entities.ProgrammingFeeSchedule.fields.annual_adjustment_bps
        distinguishing_aspect: "The two variants price the SAME station under the SAME revenue and market inputs on two different entity domains — the schedule-priced MemberStation fee versus the schedule's own annual adjustment epoch — and differ by exactly 178200 cents at the fixture inputs."
        test_recipe:
          setup:
            - "Clock at the fixed default 2026-09-01T00:00:00Z"
            - "One PlatformAdmin, one NetworkComplianceAuditor, one MemberStation APPLICANT with dma_market_rank 60, annual_local_revenue_cents 4800000, coverage_population 600000, full_time_staff_count 20, newsroom_staff_count 6, dma_households 600000, which classifies as CLASS_B"
            - "One fiscal-2026 schedule with base_fee_cents 1200000, revenue_rate_bps 250, tier bounds 25/75/150, market_size_multiplier_bps 12500, minimum 100000, maximum 5000000, annual_adjustment_bps 900, effective_from 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026A", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_tier_1_max_rank: 25, market_tier_2_max_rank: 75, market_tier_3_max_rank: 150, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 900, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sch_26_id: "$.data.id" }
            - call: "POST /network/member-stations"
              payload: { call_sign: "WQXR", licensee_name: "Hudson Licensee", state_code: "NY", dma_market_rank: 60, dma_households: 600000, coverage_population: 600000, full_time_staff_count: 20, newsroom_staff_count: 6, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
              captures: { st_a_id: "$.data.id" }
            - call: "POST /network/member-stations/${st_a_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_a_id}"
            - call: "POST /network/member-stations/${st_a_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
              captures: { st_a_ver: "$.data.version" }
            - call: "GET /network/member-stations/${st_a_id}/assessments"
              payload: {}
              as: NetworkComplianceAuditor
              captures: { assmt_a_id: "$.data[0].id" }
          trigger:
            - call: "POST /network/programming-fee-assessments/${assmt_a_id}/finalize"
              payload: { expected_station_version: "${st_a_ver}" }
              as: NetworkComplianceAuditor
          assert:
            - "Response programming_fee_provisional == 1980000"
            - "Response programming_fee_final_adjusted == 2158200"
            - "The delta between the projected and unadjusted variants is exactly 178200 cents for the same inputs"
      - name: dual_fee_class_multiplier_surcharge
        grounds:
          - calculations.membership_class_fee_multiplier
          - calculations.membership_class_assignment
          - entities.MemberStation.fields.membership_class
        distinguishing_aspect: "This second dual-variant pair sits on the MembershipDrive domain rather than the schedule domain: pledge_base charges the initiative gross while fulfilled_base charges only collected funds, differing by exactly 24750 cents on the same drive."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z"
            - "One ELIGIBLE station with a membership drive that has pledged 100000 cents and collected 55000 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026B", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_tier_1_max_rank: 25, market_tier_2_max_rank: 75, market_tier_3_max_rank: 150, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sch_b_id: "$.data.id" }
            - call: "POST /network/member-stations"
              payload: { call_sign: "WGBH", licensee_name: "Charles Licensee", state_code: "MA", dma_market_rank: 10, dma_households: 800000, coverage_population: 70000, full_time_staff_count: 8, newsroom_staff_count: 4, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
              captures: { st_b_id: "$.data.id" }
            - call: "POST /network/member-stations/${st_b_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_b_id}"
            - call: "POST /network/member-stations/${st_b_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/audience-reports"
              payload: { station_id: "${st_b_id}", fiscal_year: 2026, cume_persons: 250000, nielsen_share_bps: 2100, local_content_hours: 1200 }
              as: StationManager
              as_user_id: "${st_b_id}"
            - call: "POST /network/membership-drives"
              payload: { station_id: "${st_b_id}", drive_name: "Fall 2026 Drive", drive_close_at: "2026-10-15T00:00:00Z" }
              as: StationManager
              as_user_id: "${st_b_id}"
              captures: { drv_id: "$.data.id" }
            - call: "POST /network/membership-drives/${drv_id}/open"
              payload: {}
              as: StationManager
              as_user_id: "${st_b_id}"
            - call: "POST /network/membership-drives/${drv_id}/pledge"
              payload: { pledge_cents: 100000, collected_cents: 55000 }
              as: StationManager
              as_user_id: "${st_b_id}"
          trigger:
            - call: "POST /network/membership-drives/${drv_id}/report"
              payload: {}
              as: StationManager
              as_user_id: "${st_b_id}"
          assert:
            - "Response.pledged_cents == 100000"
            - "Response.collected_cents == 55000"
            - "Response.drive_deduction_cents == 55000 under the pledge_base variant"
            - "Response.drive_deduction_cents == 30250 under the fulfilled_base variant, a 24750-cent divergence for identical inputs"
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_liability_cap_circular
        grounds:
          - calculations.exception_liability_accrual
          - calculations.carriage_clearance_ratio
          - state_machines.BroadcastWindow.transitions.PENDING_CLEARANCE_to_REJECTED
        distinguishing_aspect: "Mode (c): a circular-looking dependency where the agreement-level per-station cap is computed from the child windows' exception liabilities, which are themselves derived from the agreement's own lifecycle stage — the evaluation order is pinned as three explicit steps inside carriage_clearance_ratio."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one ELIGIBLE station carrying a CARRIED agreement with one REJECTED window of 25 minutes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026C", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "KQED", licensee_name: "Bay Licensee", state_code: "CA", dma_market_rank: 6, dma_households: 2500000, coverage_population: 120000, full_time_staff_count: 9, newsroom_staff_count: 5, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_WEST" }
              as: PlatformAdmin
              captures: { st_c_id: "$.data.id" }
            - call: "POST /network/member-stations/${st_c_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_c_id}"
            - call: "POST /network/member-stations/${st_c_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/national-programs"
              payload: { program_code: "NP-1001", program_title: "Morning Edition Extra", strand_type: "NEWS", national_premiere_at: "2026-10-01T00:00:00Z" }
              as: NationalProgramEditor
            - call: "POST /network/carriage-agreements"
              payload: { station_id: "${st_c_id}", program_code: "NP-1001", obligation_type: "MANDATORY", clearance_deadline: "2026-11-01T00:00:00Z", exception_liability_cap_cents: 500000 }
              as: StationManager
              as_user_id: "${st_c_id}"
              captures: { agr_c_id: "$.data.id" }
            - call: "POST /network/broadcast-windows"
              payload: { parent_agreement_id: "${agr_c_id}", station_id: "${st_c_id}", program_code: "NP-1001", window_start: "2026-10-05T14:00:00Z", window_end: "2026-10-05T15:00:00Z" }
              as: StationManager
              as_user_id: "${st_c_id}"
              captures: { wnd_c1: "$.data.id" }
            - call: "POST /network/carriage-agreements/${agr_c_id}/submit"
              payload: {}
              as: StationManager
              as_user_id: "${st_c_id}"
            - call: "POST /network/carriage-agreements/${agr_c_id}/review"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/broadcast-windows/${wnd_c1}/request-clearance"
              payload: {}
              as: StationManager
              as_user_id: "${st_c_id}"
            - call: "POST /network/broadcast-windows/${wnd_c1}/reject"
              payload: { rejection_reason: "Clearance documents incomplete" }
              as: NetworkComplianceAuditor
          trigger:
            - call: "GET /network/carriage-agreements/${agr_c_id}"
              payload: {}
              as: NetworkComplianceAuditor
          assert:
            - "Response.exception_liability_cents == 25000 for the rejected window"
            - "The agreement-level rollup is not clamped at 500000 because the raw sum 25000 is below the cap"
            - "The reported clearance ratio uses the CLEARED, SCHEDULED and BROADCAST denominator only, so a window in REJECTED does not lower the denominator"
      - name: combinatorial_liability_two_quantities
        grounds:
          - calculations.exception_liability_accrual
          - calculations.network_dues_pool_allocation
          - state_machines.BroadcastWindow.transitions.SCHEDULED_to_MISSED
        distinguishing_aspect: "Mode (b): nested rounding where the order matters — each station's fee component is rounded to the cent before the sum, and the pooled funding in network_dues_pool_allocation assigns the single overflow cent by a pinned selector, so rounding the pooled total first produces a different cent split."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; two ELIGIBLE stations whose fiscal-2026 pool totals 240001 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026D", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "WKAR", licensee_name: "Michigan Licensee", state_code: "MI", dma_market_rank: 5, dma_households: 2200000, coverage_population: 130000, full_time_staff_count: 9, newsroom_staff_count: 5, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_MIDWEST" }
              as: PlatformAdmin
              captures: { st_d1: "$.data.id" }
            - call: "POST /network/member-stations/${st_d1}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_d1}"
            - call: "POST /network/member-stations/${st_d1}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/member-stations"
              payload: { call_sign: "WETA", licensee_name: "Potomac Licensee", state_code: "DC", dma_market_rank: 22, dma_households: 700000, coverage_population: 60000, full_time_staff_count: 6, newsroom_staff_count: 3, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_SOUTH" }
              as: PlatformAdmin
              captures: { st_d2: "$.data.id" }
            - call: "POST /network/member-stations/${st_d2}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_d2}"
            - call: "POST /network/member-stations/${st_d2}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
              captures: { assmt_d1: "$.data.id" }
          trigger:
            - call: "POST /network/programming-fee-assessments/${assmt_d1}/allocate-pool"
              payload: { total_pot_cents: 240001 }
              as: NetworkGovernanceOfficer
          assert:
            - "The higher-ranked station holds allocated_dues_cents == 120001 and the other 120000"
            - "The batch total 240001 equals total_pot_cents exactly, so no rounding drift is introduced"
            - "Rounding the pooled total before splitting it would assign 120001 to both stations and total 240002, one cent over the pot"
  - rule_id: non_linear_state_machine
    instances:
      - name: cyclic_station_eligibility_review_loop
        grounds:
          - state_machines.MemberStation.transitions.DEFICIENT_to_REMEDIATION_SUBMITTED
          - state_machines.MemberStation.transitions.REMEDIATION_SUBMITTED_to_UNDER_REVIEW
          - state_machines.MemberStation.transitions.UNDER_REVIEW_to_DEFICIENT
          - state_machines.MemberStation.transitions.PROBATION_to_ELIGIBLE
        distinguishing_aspect: "The MemberStation machine cycles UNDER_REVIEW to DEFICIENT to REMEDIATION_SUBMITTED back to UNDER_REVIEW, and separately cycles ELIGIBLE to PROBATION back to ELIGIBLE, so a station can legitimately be reviewed an unbounded number of times."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one station UNDER_REVIEW with newsroom_staff_count below the eligibility floor so the deficiency precondition holds"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "KTEP", licensee_name: "Border Licensee", state_code: "TX", dma_market_rank: 92, dma_households: 300000, coverage_population: 60000, full_time_staff_count: 4, newsroom_staff_count: 1, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_SOUTH" }
              as: PlatformAdmin
              captures: { st_e_id: "$.data.id" }
            - call: "POST /network/member-stations/${st_e_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_e_id}"
          trigger:
            - call: "POST /network/member-stations/${st_e_id}/record-deficiency"
              payload: { deficiency_factors: ["NEWSROOM_STAFF"] }
              as: NetworkComplianceAuditor
            - call: "POST /network/member-stations/${st_e_id}/remediation"
              payload: { remediated_factors: ["NEWSROOM_STAFF"] }
              as: StationManager
              as_user_id: "${st_e_id}"
            - call: "POST /network/member-stations/${st_e_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_e_id}"
          assert:
            - "After the first trigger Response.eligibility_status == DEFICIENT"
            - "After the second trigger Response.eligibility_status == REMEDIATION_SUBMITTED"
            - "After the third trigger Response.eligibility_status == UNDER_REVIEW, closing the loop"
      - name: parallel_underwriting_agreement_dimensions
        grounds:
          - state_machines.UnderwritingAgreement.state_dimensions.agreement_status
          - state_machines.UnderwritingAgreement.state_dimensions.airplay_status
          - state_machines.UnderwritingAgreement.transitions.SCHEDULED_to_AIRING
          - state_machines.UnderwritingAgreement.transitions.AIRING_to_AIRING
        distinguishing_aspect: "One UnderwritingAgreement row carries two independent state dimensions — agreement_status and airplay_status — that advance on different triggers, and the agreement_status dimension also has an AIRING self-loop for segment-by-segment airplay."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one ELIGIBLE station and one underwriting agreement whose acknowledgment script contains no forbidden phrase"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026E", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "KUOW", licensee_name: "Cascade Licensee", state_code: "WA", dma_market_rank: 13, dma_households: 1900000, coverage_population: 90000, full_time_staff_count: 7, newsroom_staff_count: 4, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_WEST" }
              as: PlatformAdmin
              captures: { st_f_id: "$.data.id" }
            - call: "POST /network/member-stations/${st_f_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_f_id}"
            - call: "POST /network/member-stations/${st_f_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/underwriting-agreements"
              payload: { sponsor_name: "Cascade Coffee Roasters", station_id: "${st_f_id}", program_code: "NP-1002", ack_script_text: "Support for this program comes from Cascade Coffee Roasters", consideration_cents: 250000, compliance_segment_count: 2 }
              as: UnderwritingCoordinator
              captures: { uw_f_id: "$.data.id" }
            - call: "POST /network/underwriting-agreements/${uw_f_id}/submit-for-review"
              payload: {}
              as: UnderwritingCoordinator
            - call: "POST /network/underwriting-agreements/${uw_f_id}/approve"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/underwriting-agreements/${uw_f_id}/schedule"
              payload: {}
              as: UnderwritingCoordinator
          trigger:
            - call: "POST /network/underwriting-agreements/${uw_f_id}/air-segment"
              payload: {}
              as: UnderwritingCoordinator
            - call: "POST /network/underwriting-agreements/${uw_f_id}/air-segment"
              payload: {}
              as: UnderwritingCoordinator
          assert:
            - "After the first trigger Response.agreement_status == AIRING and Response.aired_segment_count == 1"
            - "After the first trigger the airplay dimension reads PARTIALLY_AIRED"
            - "After the second trigger Response.agreement_status == AIRING_COMPLETE and aired_segment_count == 2"
            - "After the second trigger the airplay dimension reads FULLY_AIRED while agreement_status has settled, proving the two dimensions advance independently"
  - rule_id: transitive_cascade
    instances:
      - name: cascade_vote_eligibility_full_recompute
        grounds:
          - state_machines.MemberStation.transitions.SUSPENDED_to_UNDER_REVIEW
          - state_machines.MemberStation.transitions.ELIGIBLE_to_SUSPENDED
          - calculations.slate_weighted_vote_scoring
        distinguishing_aspect: "Depth 4 from a reinstate: SUSPENDED to UNDER_REVIEW changes eligibility, which recomputes the station's vote projection, which recomputes that station's recorded vote weight, which recomputes the DuesStructureProposal tally; each link is caused by the previous one rather than by the original request."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one ELIGIBLE station X in status ELIGIBLE with a recorded vote on one OPEN DuesStructureProposal whose quorum_required_votes is 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026F", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "KERA", licensee_name: "Trinity Licensee", state_code: "TX", dma_market_rank: 5, dma_households: 2400000, coverage_population: 140000, full_time_staff_count: 9, newsroom_staff_count: 5, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_SOUTH" }
              as: PlatformAdmin
              captures: { st_g_id: "$.data.id", st_g_ver: "$.data.version" }
            - call: "POST /network/member-stations/${st_g_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_g_id}"
            - call: "POST /network/member-stations/${st_g_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
              captures: { st_g_ver: "$.data.version" }
            - call: "POST /network/dues-proposals"
              payload: { fiscal_year: 2026, proposed_base_fee_cents: 1350000, proposed_revenue_rate_bps: 275, quorum_required_votes: 1, effective_from: "2027-01-01T00:00:00Z" }
              as: NetworkGovernanceOfficer
              captures: { prop_g_id: "$.data.id" }
            - call: "POST /network/dues-proposals/${prop_g_id}/open"
              payload: {}
              as: NetworkGovernanceOfficer
            - call: "POST /network/dues-proposals/${prop_g_id}/votes"
              payload: { station_id: "${st_g_id}", vote_choice: "YES", current_rate_bps: 250, expected_station_version: "${st_g_ver}" }
              as: StationManager
              as_user_id: "${st_g_id}"
          trigger:
            - call: "POST /network/member-stations/${st_g_id}/suspend"
              payload: { suspension_reason: "Coverage contour dispute" }
              as: NetworkComplianceAuditor
          assert:
            - "The station's DuesVoteEligibilityProjection row reads dues_vote_eligible == false after the suspend"
            - "Response.dues_arrears_cents is unchanged at 0 because only the eligibility_status field moves"
            - "The proposal's eligible_station_count drops by one, so the quorum denominator recomputes without any vote being re-recorded"
      - name: cascade_program_retirement_license_revocation
        grounds:
          - state_machines.ContentContribution.transitions.LICENSED_to_WITHDRAWN
          - state_machines.NationalProgram.transitions.PUBLISHED_to_RESCHEDULED
          - state_machines.NationalProgram.transitions.RESCHEDULED_to_RETIRED
          - calculations.archive_credit_ledger_invariant
        distinguishing_aspect: "Depth 3 from a return-to-development: PUBLISHED to RESCHEDULED withdraws the licensed contributions, the withdrawal decrements NationalProgram.licensed_contribution_count, and the changed count makes the later retire fail its precondition — a different trigger pattern from the eligibility cascade."
        test_recipe:
          setup:
            - "Program NP-1003 in PUBLISHED with one LICENSED contribution worth 60000 cents whose originating station is ELIGIBLE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
