# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3160_safety_incident_investigation_account_deactivation
#
# Depth probe: 9 difficulty rules x 2 instances = 18 instances.
# Every instance grounds in a declared element of SCAFFOLD.yaml §1.1-§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_evidence_score_per_item_rounding_vs_raw_sum
        grounds:
          - calculations.evidence_admissibility_score
          - calculations.evidence_admissibility_score.variants.per_item_rounded_then_summed
          - calculations.evidence_admissibility_score.variants.raw_sum_then_capped
          - entities.IncidentEvidence.fields.evidence_weight
        distinguishing_aspect: |
          On the same three admitted evidence items the pinned per-item-rounded reading
          charges one cent per y=0.005 item and yields exactly 1.58, while the raw-sum
          reading yields 1.60 — so the two valid readings of the identical evidence set
          disagree by exactly 0.02.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "One ACTIVE rider account with no prior incidents and the local R1 platform policy."
            - "One S2 HARASSMENT incident on the account, still OPEN, no evidence rows yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
              captures: { policy_r1_id: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Ada Mensah", contact_email: "ada.mensah@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "RIDER", reporter_account_id: "${acct_id}", incident_category: "HARASSMENT" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "LAW_ENFORCEMENT_CONTACT", evidence_weight: "STRONG" }
              as: SafetyInvestigator
              captures: { ev1_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "EXTERNAL_RECORD", evidence_weight: "STANDARD" }
              as: SafetyInvestigator
              captures: { ev2_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "RATINGS_HISTORY", evidence_weight: "STANDARD" }
              as: SafetyInvestigator
              captures: { ev3_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev1_id}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev2_id}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev3_id}", accepted: true }
              as: SafetyInvestigator
          trigger:
            - call: "GET /safety/incidents/${inc_id}/evidence-score"
              payload: {}
              as: SafetyInvestigator
              captures: { cont_score: $.data.evidence_score, conf_ratio: $.data.confidence_ratio }
          assert:
            - "the pinned per-item-rounded reading is exactly 1.58: 0.95*1.00 + 0.95*0.70 rounds to 1.62, 0.75*0.70 rounds to 0.53, 0.90*0.70 rounds to 0.63 on products 0.665/0.665, so the two-product rounding branch costs exactly 0.01 per y=0.005 item"
            - "the raw-sum reading of the same three items is 1.60 = round(0.95 + 0.95 + 0.63, 2); the confidence_ratio read from the endpoint is 1.502, which is the ratio the two readings disagree about"
            - "the two readings of the identical evidence set differ by exactly 0.02"
            - "the applied_evidence_cap is 2.50 = (1.00 + 1.00 + 0.80) and neither reading is clamped by it"

      - name: dual_variant_severity_aggravator_vs_floor_band
        grounds:
          - calculations.incident_severity_classification
          - calculations.incident_severity_classification.variants.band_from_category_then_aggravators
          - calculations.incident_severity_classification.variants.floor_band_from_category_and_prior_count
          - entities.SafetyIncident.fields.derivative_severity_flagged
        distinguishing_aspect: |
          For the identical PROPERTY_DAMAGE intake the aggravator reading yields S3
          (level 1 + 2 aggravator levels) while the floor-band reading yields S2
          (floor raised by prior_incident_count_at_intake >= 2) — two valid readings of
          the same intake request resolve to different severity bands, a full band apart.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "One ACTIVE rider account carrying exactly two prior S2 incidents, both WITHDRAWN."
            - "The local R1 platform policy exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Bo Tran", contact_email: "bo.tran@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "RIDER", reporter_account_id: "${acct_id}", incident_category: "HARASSMENT" }
              as: SafetyInvestigator
              captures: { pri1_id: $.data.id }
            - call: "POST /safety/incidents/${pri1_id}/withdraw"
              payload: {}
              as: SafetyOperationsLead
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "RIDER", reporter_account_id: "${acct_id}", incident_category: "HARASSMENT" }
              as: SafetyInvestigator
              captures: { pri2_id: $.data.id }
            - call: "POST /safety/incidents/${pri2_id}/withdraw"
              payload: {}
              as: SafetyOperationsLead
          trigger:
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "DRIVER", reporter_account_id: "${acct_id}", incident_category: "PROPERTY_DAMAGE", aggravator_codes: ["S3_INJURY", "S3_LAW_ENFORCEMENT_SEVERITY"] }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id }
          assert:
            - "Severity.${inc_id}.severity == \"S3\" under the aggravator reading: base level 1 for PROPERTY_DAMAGE plus 1 for S3_INJURY plus 1 for S3_LAW_ENFORCEMENT_SEVERITY, clamped to 4"
            - "the same intake read on the floor-band branch yields \"S2\" because prior_incident_count_at_intake == 2 and the PROPERTY_DAMAGE base level is 1"
            - "Severity.${inc_id}.derivative_severity_flagged == false because raw_level is 3 and the saturation branch requires raw_level >= 4"
            - "Severity.${inc_id}.prior_incident_count_at_intake == 2"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_risk_contagion_three_input_nonlinear
        grounds:
          - calculations.risk_contagion_propagation
          - calculations.risk_contagion_propagation.constants.CLUSTER_TERM_COEFFICIENT
          - entities.Account.fields.risk_score
          - entities.Account.fields.risk_tier
        distinguishing_aspect: |
          The score combines a decay-banded incident term, a per-action enforcement term
          and a cluster term into one clamped scalar whose tier classification then feeds
          back as a state-dependent branch — so a single S3 incident lands in TIER_LOW at
          70.00 while three of them land in TIER_HIGH at 420.00, and at most one of the two
          readings of the tier band can be right at the 640.00 boundary.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "One ACTIVE rider account with one linked OPEN device cluster."
            - "The local R1 platform policy exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Cy Okafor", contact_email: "cy.okafor@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/device-clusters"
              payload: { cluster_key: "dc-okafor", region_code: "R1" }
              as: PlatformAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /safety/account-device-links"
              payload: { account_id: "${acct_id}", device_cluster_id: "${cluster_id}", fingerprint_hash: "fp-okafor-1" }
              as: SafetyInvestigator
              captures: { link_id: $.data.id }
          trigger:
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PHYSICAL_ASSAULT" }
              as: SafetyInvestigator
              captures: { inc1_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "SEXUAL_MISCONDUCT" }
              as: SafetyInvestigator
              captures: { inc2_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
              captures: { inc3_id: $.data.id }
            - call: "GET /safety/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { final_score: $.data.risk_score, final_tier: $.data.risk_tier, final_deact_count: $.data.deactivation_count, final_standing: $.data.standing_enforcement_count, final_posture: $.data.safety_posture }
          assert:
            - "Account.${acct_id}.risk_score == 640.0 = 260 (S4 PHYSICAL_ASSAULT) + 260 (S4 SEXUAL_MISCONDUCT) + 140 (S3 SAFETY_VIOLATION with one S3_INJURY aggravator) + 0.25 * 0 + 0.25 * aggregate_cluster_risk where aggregate_cluster_risk == 0 because no member account carries a qualifying risk score yet"
            - "Account.${acct_id}.risk_tier == TIER_SEVERE because 640.0 >= TIER_SEVERE_CUTOFF 640 and the comparison is >=, not >"
            - "a single S4 incident alone would have scored 260.0 and landed in TIER_ELEVATED, so the 380.0 gap is produced entirely by the second and third incidents"
            - "Account.${acct_id}.standing_enforcement_count == 0 so the enforcement term contributes exactly 0 to the score"
            - "Account.${acct_id}.deactivation_count == 3 because all three incidents resolved to a DEACTIVATED outcome, and Account.${acct_id}.safety_posture == \"OPEN\" because standing_enforcement_count is 0"

      - name: combinatorial_decision_criteria_circular_tier_floor
        grounds:
          - calculations.deactivation_decision_criteria
          - calculations.deactivation_decision_criteria.variants.evidence_threshold_then_category_floor
          - calculations.deactivation_decision_criteria.variants.category_floor_then_evidence_threshold
          - entities.SafetyIncident.fields.decision_evidence_score
        distinguishing_aspect: |
          A circular-looking dependency where the category tier floor is read first and the
          evidence overrides are then applied in ascending threshold order — the pinned
          evaluation order makes a PHYSICAL_ASSAULT incident at score 3.99 with a single
          distinct source resolve to RESTRICTED rather than the DEACTIVATED the category
          floor alone would produce.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "One ACTIVE rider account and its R1 policy."
            - "One S4 PHYSICAL_ASSAULT incident held and investigating."
            - "Three DISPOSITIVE evidence rows gathered: one TRIP_DATA (promotable, score 3.00), one LAW_ENFORCEMENT_CONTACT (not promotable, weight 3.00) and one RATINGS_HISTORY (not promotable, not admissible as a support source)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Dara Whitfield", contact_email: "dara.whitfield@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/trips"
              payload: { rider_account_id: "${acct_id}", driver_account_id: "${acct_id}", region_code: "R1", requested_at: "2026-09-28T00:00:00Z", in_app_message_count: 4 }
              as: PlatformAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", referenced_trip_id: "${trip_id}", reporter_type: "RIDER", reporter_account_id: "${acct_id}", incident_category: "PHYSICAL_ASSAULT" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/hold"
              payload: {}
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", source_entity_id: "${trip_id}", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { evt_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "LAW_ENFORCEMENT_CONTACT", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { evl_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "RATINGS_HISTORY", source_entity_id: "${acct_id}", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { evr_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${evt_id}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${evl_id}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${evr_id}", accepted: true }
              as: SafetyInvestigator
              captures: { inc_v_ready: $.data.version }
          trigger:
            - call: "GET /safety/incidents/${inc_id}/decision-criteria"
              payload: {}
              as: SafetyInvestigator
              captures: { cat_tier: $.data.category_tier, ev_tier: $.data.evidence_tier }
            - &k_dual_decision
              call: "POST /safety/incidents/${inc_id}/decision"
              payload: { decision_category: "RESTRICTED", decision_basis: "Category floor DEACTIVATED but the provisional evidence override holds the tier at RESTRICTED.", expected_incident_version: "${inc_v_ready}" }
              as: SafetyInvestigator
          assert:
            - "Evidence.${inc_id}.decision_evidence_score == 3.00 exactly: three DISPOSITIVE items of 1.425 each sum to 4.275, which round(clamp_to_required_sources(4.00), 2) == 3.00"
            - "Evidence.${inc_id}.decision_distinct_evidence_sources == 3 because TRIP_DATA, LAW_ENFORCEMENT_CONTACT and RATINGS_HISTORY are three distinct types"
            - "the applied_evidence_cap is 3.00, so the accumulated cap binding is not exercised and the score is set by the required-distinct-sources clamp, not by the cap"
            - "DecisionCriteria.${inc_id}.category_tier == \"DEACTIVATED\" (PHYSICAL_ASSAULT is a DEACTIVATED-tier category)"
            - "DecisionCriteria.${inc_id}.evidence_tier == \"RESTRICTED\" because 2.50 <= 3.00 < 4.00 and the pinned order holds the floor at RESTRICTED"
            - "the category-floor-only reading of the same incident is DEACTIVATED, so the two readings land exactly one decision tier apart"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: non_linear_appeal_round_trip_cycle_on_account
        grounds:
          - state_machines.Account.transitions.DEACTIVATED_to_APPEAL_PENDING
          - state_machines.Account.transitions.APPEAL_PENDING_to_APPEAL_PENDING
          - state_machines.Account.transitions.APPEAL_PENDING_to_ACTIVE
          - validations[priority=11]
        distinguishing_aspect: |
          The Account machine is cyclic rather than a pipeline: DEACTIVATED and
          APPEAL_PENDING reciprocate through repeated revision rounds, and the machine also
          branches three ways out of a single state, so a reviewer who commits before the
          track deadline is refused while the same commit succeeds 15 days later.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-05T00:00:00Z. R1 policy with expedite_appeal_baseline_count 5, expedite_review_days 14, standard_review_days 30 and appeal_window_days 30."
            - "One ACTIVE driver account deactivated by an S4 PHYSICAL_ASSAULT incident decided at 2026-10-05T00:00:00Z, so review_due_at is 2026-11-04T00:00:00Z."
            - "The single appeal has been filed, moving the account to APPEAL_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", expedite_appeal_baseline_count: 5, expedite_review_days: 14, standard_review_days: 30, appeal_window_days: 30 }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Eli Baptiste", contact_email: "eli.baptiste@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PHYSICAL_ASSAULT" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/hold"
              payload: {}
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "EXTERNAL_RECORD", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev1_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "LAW_ENFORCEMENT_CONTACT", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev2_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev3_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev1_id}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev2_id}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev3_id}", accepted: true }
              as: SafetyInvestigator
              captures: { inc_v_ready: $.data.version }
            - call: "POST /safety/incidents/${inc_id}/decision"
              payload: { decision_category: "DEACTIVATED", decision_basis: "S4 physical assault with independently corroborated law-enforcement and platform evidence.", expected_incident_version: "${inc_v_ready}" }
              as: SafetyInvestigator
              captures: { inc_v_decided: $.data.version, action_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/appeals"
              payload: {}
              as: SafetyAppealReviewer
              captures: { inc_v_appealed: $.data.version }
          trigger:
            - &k_cycle_round1
              call: "POST /safety/incidents/${inc_id}/appeals/outcome"
              payload: { adjudication: "UPHELD", review_notes: "Upheld after re-reading the law-enforcement contact.", commit_early: false, expected_incident_version: "${inc_v_appealed}" }
              as: SafetyAppealReviewer
              as_user_id: "ar-priya"
              captures: { round1_outcome: $.data.incident_status, round1_v: $.data.version }
            - call: "POST /safety/incidents/${inc_id}/appeals"
              payload: {}
              as: SafetyAppealReviewer
              captures: { inc_v_appealed2: $.data.version }
            - call: "GET /safety/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cycle_round2_status: $.data.status }
          assert:
            - "the round-1 outcome is refused with ERR_APPEAL_NOT_ELIGIBLE (422) because the STANDARD track due date is 2026-11-04T00:00:00Z and the commit instant is 2026-10-05T00:00:00Z"
            - "Account.${acct_id}.status == \"APPEAL_PENDING\" after the refused round, so the rejected cycle leaves the machine exactly where it started"
            - "the second POST /safety/incidents/${inc_id}/appeals returned 201 and re-entered the same APPEAL_PENDING state, which is the cycle edge APPEAL_PENDING_to_APPEAL_PENDING"
            - "Account.${acct_id}.safety_posture == \"FROZEN\" throughout the revision rounds"
            - "Account.${acct_id}.deactivation_count == 1, unchanged by the failed revision round"

      - name: non_linear_cluster_branch_fork_join_with_sever_cycle
        grounds:
          - state_machines.DeviceCluster.transitions.OPEN_to_WATCHLIST
          - state_machines.DeviceCluster.transitions.WATCHLIST_to_BANNED
          - state_machines.DeviceCluster.transitions.WATCHLIST_to_OPEN
          - validations[priority=15]
        distinguishing_aspect: |
          The cluster machine forks from OPEN into either WATCHLIST or a direct BANNED
          escalation and then rejoins through the WATCHLIST_to_OPEN reverting edge, while
          the BANNED branch rejects the very link operation the OPEN and WATCHLIST branches
          accept — a genuine fork-join plus cycle on one entity.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-08T00:00:00Z. R1 policy with cluster_watchlist_threshold 2, cluster_purge_threshold 2400 and escalation_enabled true."
            - "Two OPEN device clusters, dc-a and dc-b, in R1."
            - "Four ACTIVE driver accounts in R1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", cluster_watchlist_threshold: 2, cluster_purge_threshold: 2400, escalation_enabled: true }
              as: PlatformAdmin
            - call: "POST /safety/device-clusters"
              payload: { cluster_key: "dc-a", region_code: "R1" }
              as: PlatformAdmin
              captures: { clust_a: $.data.id, clust_a_v0: $.data.version }
            - call: "POST /safety/device-clusters"
              payload: { cluster_key: "dc-b", region_code: "R1" }
              as: PlatformAdmin
              captures: { clust_b: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Fara Nkemelu", contact_email: "fara.nkemelu@example.com" }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Gwen Adeyemi", contact_email: "gwen.adeyemi@example.com" }
              as: PlatformAdmin
              captures: { a2: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Hana Suzuki", contact_email: "hana.suzuki@example.com" }
              as: PlatformAdmin
              captures: { a3: $.data.id }
            - call: "POST /safety/accounts"
