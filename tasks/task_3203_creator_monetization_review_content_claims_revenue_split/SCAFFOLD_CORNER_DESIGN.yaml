        distinguishing_aspect: "GET /api/review-queue returns only MONETIZATION_PENDING channels ordered by watch_hours/1000 + subscribers/500 - 10*strikes, descending, with no id in the ranking."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two channels applied for monetization: a high-reach one and a low-reach one; a third channel was never applied."
