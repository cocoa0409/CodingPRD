              as_user_id: "privacy-tuner-1"
              captures: { cfgR4_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgR4_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgR4_activator: $.data.activated_by_user_id }
            - call: "POST /hie/participants"
              payload: { legal_name: "Arborglen Regional Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 72000, primary_contact_email: "hie@arborglen.example" }
              as: HieAdmin
              captures: { pR4_id: $.data.id }
            - call: "POST /hie/participants/${pR4_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pR4_id}"
            - call: "POST /hie/participants/${pR4_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pR4_id}/patient-records"
              payload: { source_mrn: "A-5001", given_name: "Maria", family_name: "Gonzalez", birth_date: "1991-07-22", sex: "F", ssn_last4: "3321", postal_code: "78701", phone_digits: "5125550143" }
              as: HieAdmin
              captures: { recR4_left: $.data.id, clusterR4_left: $.data.cluster_id }
            - call: "POST /hie/participants"
              payload: { legal_name: "Brackenridge Family Clinic", org_type: "CLINIC", declared_annual_patient_volume: 24000, primary_contact_email: "hie@brackenridge.example" }
              as: HieAdmin
              captures: { pR4_b: $.data.id }
            - call: "POST /hie/participants/${pR4_b}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pR4_b}"
            - call: "POST /hie/participants/${pR4_b}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pR4_b}/patient-records"
              payload: { source_mrn: "R-6001", given_name: "Mari", family_name: "Gonzales", birth_date: "1991-07-22", sex: "F", ssn_last4: "3321", postal_code: "78701", phone_digits: "2125550143" }
              as: HieAdmin
              captures: { recR4_right: $.data.id, clusterR4_right: $.data.cluster_id, recR4_right_state: $.data.match_state }
            - call: "GET /hie/match-links"
              payload: { status: "PENDING_REVIEW" }
              as: PrivacyOfficer
