          assert:
            - "the first eight trigger responses all have status 404"
            - "their data.error_id values are, in order, ERR_DENSITOMETER_NOT_FOUND, ERR_QC_RUN_NOT_FOUND, ERR_CALIBRATION_EVENT_NOT_FOUND, ERR_SCAN_ORDER_NOT_FOUND, ERR_SCAN_APPOINTMENT_NOT_FOUND, ERR_FRAX_ASSESSMENT_NOT_FOUND, ERR_DIAGNOSTIC_REPORT_NOT_FOUND, ERR_TREATMENT_PLAN_NOT_FOUND"
