            - { call: "GET /contests/${ct_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_ver: "$.data.version" } }
            - { call: "POST /contests/${ct_id}/transitions", payload: { to: "QUESTIONNAIRE_PHASE", expected_contest_version: "${ct_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /contests/${ct_id}/questionnaire", payload: { due_at: "2026-10-01T17:00:00Z", questions: [{ position_index: 1, prompt_text: "Why are you running?" }] }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { q_id: "$.data.id" } }
            - { call: "POST /questionnaires/${q_id}/issue", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /questionnaires/${q_id}/responses", payload: { answers: [{ position_index: 1, text: "one two three four five six seven eight nine ten" }] }, as: Candidate, as_user_id: "${f1}" }
          trigger:
            - { call: "POST /filings/${f1}/withdraw", as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /questionnaires/${q_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { inv_mid: "$.data.invited_count", sub_mid: "$.data.submitted_count" } }
            - { call: "POST /filings/${f1}/refile", as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /filings/${f1}/verify", as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /questionnaires/${q_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { inv_end: "$.data.invited_count" } }
            - { call: "GET /questionnaires/${q_id}/responses", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { shell0_status: "$.data[0].status" } }
          assert:
            - "After withdraw: invited_count == 2 still (shell hidden, not deleted) and submitted_count == 0"
            - "After refile + verify: invited_count == 2 — the withdraw/refile pair conserved shell cardinality"
            - "Filing ${f1}'s shell is back to INVITED with its answers preserved (text 'one two three four five six seven eight nine ten' intact)"
            - "No duplicate shell was created by the late verify: the responses list still contains exactly 2 rows"
            - "Contest.completion_index == 0.0 after the round trip (nothing currently SUBMITTED)"
