# =============================================================================
# §1.9 Scaffold Corner Design — Sponsored Research Pre-Award
# Coverage Index: every non-difficulty testable claim of §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: funding_opportunity_computed_deadline_and_default
        claim_type: computed_fields
        grounds: [entities.FundingOpportunity.fields.internal_deadline_at, entities.FundingOpportunity.fields.internal_lead_days]
        distinguishing_aspect: "internal_deadline_at = sponsor_deadline_at - internal_lead_days; omitting internal_lead_days applies the default 5."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "DefaultLead", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z" }
              as: OSPSystemAdmin
              captures: { o1_deadline: $.data.internal_deadline_at, o1_lead: $.data.internal_lead_days, o1_status: $.data.status }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NIH", title: "Lead10", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 10 }
              as: OSPSystemAdmin
              captures: { o2_deadline: $.data.internal_deadline_at }
          trigger: []
          assert:
            - "o1_lead == 5 and o1_deadline == 2026-08-31T17:00:00Z and o1_status == PUBLISHED"
            - "o2_deadline == 2026-08-26T17:00:00Z"

      - name: principal_investigator_defaults_and_eligibility
        claim_type: defaults
        grounds: [entities.PrincipalInvestigator.fields.delinquent_report_count, entities.PrincipalInvestigator.fields.is_eligible]
        distinguishing_aspect: "delinquent_report_count defaults to 0 (eligible); an explicit 2 makes is_eligible false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "Clean", department_code: "BIO", rank: "FULL" }
              as: OSPSystemAdmin
              captures: { p1_dq: $.data.delinquent_report_count, p1_el: $.data.is_eligible }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "Late", department_code: "BIO", rank: "FULL", delinquent_report_count: 2 }
              as: OSPSystemAdmin
              captures: { p2_el: $.data.is_eligible }
          trigger: []
          assert:
            - "p1_dq == 0 and p1_el == true"
            - "p2_el == false"

      - name: budget_line_mtdc_flag_computed
        claim_type: computed_fields
        grounds: [entities.BudgetLine.fields.counts_toward_mtdc]
        distinguishing_aspect: "counts_toward_mtdc is computed: false for EQUIPMENT, true for PERSONNEL; client cannot supply it."
        test_recipe:
          setup: ["opportunity, eligible PI, proposal in DRAFT"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "M", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00, fa_base_type: "MTDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "EQUIPMENT", description: "scope", fiscal_year: 2027, amount_cents: 4000000, is_cost_share: false }, as: PreAwardAnalyst, captures: { eq_flag: $.data.counts_toward_mtdc } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "salary", fiscal_year: 2027, amount_cents: 1000000, is_cost_share: false }, as: PreAwardAnalyst, captures: { pers_flag: $.data.counts_toward_mtdc } }
          assert:
            - "eq_flag == false"
            - "pers_flag == true"

      - name: proposal_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Proposal.fields.activity_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /proposals without activity_code -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["opportunity and eligible PI exist"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
          trigger:
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "NoCode", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00 }
              as: PI
              as_user_id: "${pi_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: proposal_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Proposal.fields.activity_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An activity_code that is not an enum member -> ERR_INVALID_REQUEST (distinct from a valid-but-disallowed code, which is ERR_ACTIVITY_CODE_NOT_ALLOWED)."
        test_recipe:
          setup: ["opportunity and eligible PI exist"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS", "INSTRUCTION"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
          trigger:
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "BadEnum", activity_code: "VENTURE_CAPITAL", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00 }
              as: PI
              as_user_id: "${pi_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: get_nonexistent_proposal_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pre-award/proposals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OSPDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: subrecipient_org_duplicate_uei_rejected
        claim_type: type_constraints
        grounds: [entities.SubrecipientOrg.fields.uei, "errors[ERR_UEI_NOT_UNIQUE]"]
        distinguishing_aspect: "Second org with the same uei -> ERR_UEI_NOT_UNIQUE (409)."
        test_recipe:
          setup: ["one org with uei UEI-DUP1"]
          setup_api_calls:
            - { call: "POST /pre-award/subrecipient-orgs", payload: { legal_name: "First", uei: "UEI-DUP1", single_audit_status: "CURRENT", audit_finding_count: 0 }, as: SubrecipientManager }
          trigger:
            - call: "POST /pre-award/subrecipient-orgs"
              payload: { legal_name: "Second", uei: "UEI-DUP1", single_audit_status: "CURRENT", audit_finding_count: 0 }
              as: SubrecipientManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UEI_NOT_UNIQUE"

      - name: submission_package_via_reverse_list
        claim_type: retrieval
        grounds: [entities.SubmissionPackage.fields.portal_confirmation_code, endpoints]
        distinguishing_aspect: "The cascade-created SubmissionPackage is discoverable only via GET /proposals/{id}/submission-packages; it carries minted confirmation code and clock-stamped submitted_at; common_fields is false (no version)."
        test_recipe:
          setup:
            - "Proposal carried to INSTITUTIONALLY_APPROVED (finalize, route, approve); clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Pkg", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/approve-institutional", payload: {}, as: OSPDirector, as_user_id: "director-1" }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/submit", payload: { idempotency_key: "pkg-1" }, as: OSPDirector, captures: { pkg_code: $.data.portal_confirmation_code, pkg_at: $.data.submitted_at, pkg_status: $.data.status } }
            - { call: "GET /pre-award/proposals/${prop_id}/submission-packages", payload: {}, as: OSPDirector, captures: { list_code: "$.data[0].portal_confirmation_code", list_prop: "$.data[0].proposal_id" } }
          assert:
            - "pkg_status == ACCEPTED_BY_PORTAL and pkg_at == 2026-08-01T00:00:00Z"
            - "list_code == pkg_code and list_prop == ${prop_id} (reverse list reaches the cascade-created package)"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: proposal_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Proposal]
        distinguishing_aspect: "New proposal starts DRAFT with version 1 and null computed totals."
        test_recipe:
          setup: ["opportunity and eligible PI exist"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
          trigger:
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Init", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00, fa_base_type: "MTDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { st: $.data.status, v: $.data.version, td: $.data.total_direct_cents, posture: $.data.compliance_posture }
          assert:
            - "st == DRAFT and v == 1 and td == 0 and posture == CLEAR"

      - name: finalize_happy_path_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.Proposal.DRAFT_to_BUDGET_LOCKED, entities.BudgetSnapshot.fields.snapshot_index]
        distinguishing_aspect: "First finalize creates snapshot_index 1 CURRENT and copies totals onto the proposal; status becomes BUDGET_LOCKED."
        test_recipe:
          setup: ["opportunity (no cost-share), eligible PI, 54% rate, proposal with one PERSONNEL line 10000000"]
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "F", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv}" }, as: PreAwardAnalyst, captures: { s_idx: $.data.snapshot_index, s_status: $.data.status, s_req: $.data.total_request_cents } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { p_status: $.data.status, p_req: $.data.total_request_cents, p_snap: $.data.current_snapshot_id } }
          assert:
            - "s_idx == 1 and s_status == CURRENT and s_req == 15400000"
            - "p_status == BUDGET_LOCKED and p_req == 15400000 and p_snap is not null"

      - name: finalize_from_routed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Proposal.DRAFT_to_BUDGET_LOCKED, "errors[ERR_PROPOSAL_INVALID_STATE]"]
        distinguishing_aspect: "Finalize is legal only from DRAFT | BUDGET_LOCKED | JIT_REQUESTED; from ROUTED it fails with ERR_PROPOSAL_INVALID_STATE (OCC version is satisfied so the state check is what fires)."
        test_recipe:
          setup: ["proposal ROUTED (finalize, route done)"]
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "FR", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv1}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv2: $.data.version } }
          trigger:
            - call: "POST /pre-award/proposals/${prop_id}/budget-finalizations"
              payload: { expected_proposal_version: "${pv2}" }
              as: PreAwardAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROPOSAL_INVALID_STATE"

      - name: withdrawn_proposal_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Proposal.ANY_NON_TERMINAL_to_WITHDRAWN]
        distinguishing_aspect: "A WITHDRAWN proposal rejects PATCH and finalize with ERR_PROPOSAL_INVALID_STATE; no transition leaves a terminal state."
        test_recipe:
          setup: ["proposal in DRAFT with one line, then withdrawn by its PI"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "W", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/withdraw", payload: {}, as: PI, as_user_id: "${pi_id}" }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
          trigger:
            - call: "PATCH /pre-award/proposals/${prop_id}"
              payload: { title: "revive?" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /pre-award/proposals/${prop_id}/budget-finalizations"
              payload: { expected_proposal_version: "${pv}" }
              as: PreAwardAnalyst
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_PROPOSAL_INVALID_STATE"
            - "err2 == ERR_PROPOSAL_INVALID_STATE"

      - name: cost_share_release_from_pledged_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CostShareCommitment.APPROVED_to_RELEASED, "errors[ERR_COMMITMENT_INVALID_STATE]"]
        distinguishing_aspect: "Release is legal only from APPROVED; releasing a PLEDGED commitment fails with ERR_COMMITMENT_INVALID_STATE."
        test_recipe:
          setup: ["opportunity, eligible PI, proposal DRAFT, one PLEDGED commitment"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "CS", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00, fa_base_type: "MTDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /pre-award/proposals/${prop_id}/cost-share-commitments"
              payload: { source_type: "DEPARTMENT", amount_cents: 500000 }
