            - { call: "POST /tax1099/vendors", payload: { legal_name: "CA V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "1 Q", address_city: "Los Angeles", address_state: "CA", address_postal: "90001" }, as: APClerk, captures: { vca: $.data.id } }
            - { call: "POST /tax1099/vendors/${vca}/w9-submissions", payload: { submitted_legal_name: "CA V", submitted_tin: "111222333", submitted_tin_type: "SSN", signature_name: "C" }, as: APClerk, captures: { wca: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wca}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${vca}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 70000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "TX V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "2 Q", address_city: "Austin", address_state: "TX", address_postal: "78701" }, as: APClerk, captures: { vtx: $.data.id } }
            - { call: "POST /tax1099/vendors/${vtx}/w9-submissions", payload: { submitted_legal_name: "TX V", submitted_tin: "444555666", submitted_tin_type: "SSN", signature_name: "T" }, as: APClerk, captures: { wtx: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wtx}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${vtx}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 70000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "NY V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "3 Q", address_city: "Albany", address_state: "NY", address_postal: "12201" }, as: APClerk, captures: { vny: $.data.id } }
            - { call: "POST /tax1099/vendors/${vny}/w9-submissions", payload: { submitted_legal_name: "NY V", submitted_tin: "777888999", submitted_tin_type: "SSN", signature_name: "N" }, as: APClerk, captures: { wny: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wny}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${vny}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 70000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
          trigger:
            - { call: "POST /tax1099/state-obligations/evaluate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/state-obligations", payload: { vendor_id: "${vca}", tax_year: 2025 }, as: TaxSpecialist, captures: { chca: "$.data[0].required_channel"} }
            - { call: "GET /tax1099/state-obligations", payload: { vendor_id: "${vtx}", tax_year: 2025 }, as: TaxSpecialist, captures: { chtx: "$.data[0].required_channel", otx: "$.data[0].id"} }
            - { call: "GET /tax1099/state-obligations", payload: { vendor_id: "${vny}", tax_year: 2025 }, as: TaxSpecialist, captures: { chny: "$.data[0].required_channel", stny: "$.data[0].status"} }
