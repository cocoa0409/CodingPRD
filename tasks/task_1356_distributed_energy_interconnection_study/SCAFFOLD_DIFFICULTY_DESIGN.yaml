  - rule_id: resource_temporal_overlap
    instances:
      - name: cluster_window_overlap_halfopen_adjacency_allowed
        grounds:
          - entities.ClusterGroup.fields.application_window_open
          - errors[ERR_CLUSTER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource ClusterGroup, HALF-OPEN interval semantics [open, close): a window
          overlapping another non-CLOSED cluster's window in the same region is rejected,
          but a window whose open equals the other's close is adjacent, not overlapping,
          and a window in a different region never conflicts.
        test_recipe:
          setup:
            - "Empty queue; no clusters yet"
          setup_api_calls: []
          trigger:
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-10-01T00:00:00Z", capacity_mw: 100 }
              as: QueueAdministrator
              captures: { cg_a: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "B", region: "WEST", application_window_open: "2026-09-01T00:00:00Z", application_window_close: "2026-11-01T00:00:00Z", capacity_mw: 100 }
              as: QueueAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "C", region: "WEST", application_window_open: "2026-10-01T00:00:00Z", application_window_close: "2026-12-01T00:00:00Z", capacity_mw: 100 }
              as: QueueAdministrator
              captures: { cg_c: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "D", region: "EAST", application_window_open: "2026-09-01T00:00:00Z", application_window_close: "2026-11-01T00:00:00Z", capacity_mw: 100 }
              as: QueueAdministrator
              captures: { cg_d: $.data.id }
          assert:
            - "Cluster A created (${cg_a} present, status FORMING)"
            - "${err} == ERR_CLUSTER_WINDOW_OVERLAP (B's [2026-09-01, 2026-11-01) intersects A's [2026-08-01, 2026-10-01))"
            - "Cluster C created (open 2026-10-01 == A's close 2026-10-01 is adjacency, allowed under half-open semantics)"
            - "Cluster D created (same dates as B but region EAST is a different overlap scope)"

      - name: curtailment_window_overlap_closed_adjacency_rejected
        grounds:
          - entities.CurtailmentLimit.fields.effective_start
          - errors[ERR_CURTAILMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource CurtailmentLimit on a Project, CLOSED interval semantics [start, end]
          (distinct from the cluster window's half-open semantics): two limits of the
          same limit_type whose intervals merely touch at an endpoint overlap and are
          rejected, while an identical window under a different limit_type is allowed.
