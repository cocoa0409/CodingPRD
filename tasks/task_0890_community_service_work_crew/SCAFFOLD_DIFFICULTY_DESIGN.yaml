            - { call: "POST /participants", payload: { full_name: "P One", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "p1@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part1_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "P Two", date_of_birth: "1991-02-02T00:00:00Z", contact_email: "p2@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part2_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part1_id}", court_case_number: "CR-16A", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref1_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part2_id}", court_case_number: "CR-16B", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref2_id: "$.data.id" } }
            - { call: "POST /placements", payload: { referral_id: "${ref1_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc1_id: "$.data.id" } }
            - { call: "POST /placements/${plc1_id}/sign-waiver", payload: { signature_name: "P One" }, as: Participant, as_user_id: "${part1_id}" }
