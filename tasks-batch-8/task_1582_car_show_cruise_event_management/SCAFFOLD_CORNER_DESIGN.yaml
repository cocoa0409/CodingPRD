          setup_api_calls:
            - { call: "POST /events", payload: { name: "Uninsured", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00" }, as: Organizer, captures: { ev: $.data.id } }
