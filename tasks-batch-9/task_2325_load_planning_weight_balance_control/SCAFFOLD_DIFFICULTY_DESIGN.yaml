      - name: load_plan_revision_cycle_computed_to_draft_to_computed
        entity: LoadPlan
        shape: "cycle DRAFT -> COMPUTED -> DRAFT -> COMPUTED"
        grounds:
          - state_machines.LoadPlan.transitions.COMPUTED_to_DRAFT
          - state_machines.LoadPlan.transitions.DRAFT_to_COMPUTED
          - entities.LoadPlan.fields.status
        distinguishing_aspect: |
          A different entity from the Flight instance above. The plan loops:
          computing it freezes the whole balance chain and drives the flight to
          LOAD_CONTROLLED; adding one further bag allocation drags the plan back to
          DRAFT, zeroes every computed field and returns the flight to PLANNING;
          the second compute produces a materially different chain
          (index_zfw 85.79 instead of 97.10). The loop is re-enterable any number
          of times, which a linear pipeline cannot express.
        test_recipe:
          setup:
            - "Aircraft HB-AAA with cabin zone OC and holds H1, H5; runway LSGG/04 with the [15,30) band; STANDARD program; one flight 10:00-12:30 UTC."
