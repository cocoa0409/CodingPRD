          - errors[ERR_DUPLICATE_APPLICATION]
          - errors[ERR_AGE_OUT_OF_BAND]
        distinguishing_aspect: |
          A submit that both duplicates a non-terminal application (business_constraint, priority 10)
          AND targets a cohort whose age band excludes the child (business_referential, priority 11)
          returns ERR_DUPLICATE_APPLICATION, not ERR_AGE_OUT_OF_BAND.
        test_recipe:
