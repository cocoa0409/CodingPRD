    code: 200
    input: []
    output: Asset
    side_effects: []

  # --- AuctionSale ---
  - method: POST
    path: "/trustee/cases/{id}/sales"
    description: "Propose a sale of a MARKED_FOR_SALE asset"
    roles: [Trustee]
    code: 201
    input: [asset_id, buyer_name, hammer_price_cents, sale_costs_cents]
