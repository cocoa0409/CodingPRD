# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Voter Registration & Election Management — task_0098
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. 9 rules × ≥2 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: recount_certification_within_vs_outside_tolerance
        grounds:
          - calculations.recount_certification
          - state_machines.RecountCase.BOTH_DONE_to_CERTIFIED
          - entities.RecountCase.fields.certified_count
        distinguishing_aspect: |
          On the RecountCase entity domain, the same two passes resolve to a different
          certified_count depending on whether |machine - hand| <= 5 (certified = hand)
          or > 5 (certified = min(machine, hand)); this is a distinct entity domain from
          the turnout dual-variant on Election.
        test_recipe:
          setup:
            - "Election certify-ready clock; one TALLIED precinct with reported_vote_count=100; a RecountCase BOTH_DONE with machine_recount=100, hand_recount=90 (delta 10 > 5)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /precincts/${p_id}/tally"
              payload: { reported_vote_count: 100 }
              as: Canvasser
              as_user_id: "canvasser-tally-1"
            - call: "POST /recount-cases"
              payload: { election_id: "${e_id}", precinct_id: "${p_id}" }
              as: ElectionAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /recount-cases/${rc_id}/submit-pass"
              payload: { pass: "MACHINE", count: 100 }
              as: Canvasser
              as_user_id: "canvasser-recount-2"
            - call: "POST /recount-cases/${rc_id}/submit-pass"
              payload: { pass: "HAND", count: 90 }
              as: Canvasser
              as_user_id: "canvasser-recount-2"
          trigger:
            - call: "POST /recount-cases/${rc_id}/transition"
              payload: { target_status: "CERTIFIED" }
              as: ElectionAdmin
              captures: { certified: $.data.certified_count }
          assert:
            - "RecountCase.${rc_id}.status == CERTIFIED"
            - "RecountCase.${rc_id}.certified_count == 90"
            - "Precinct.${p_id}.reported_vote_count == 90"

      - name: turnout_projected_vs_final_diverge
        grounds:
          - calculations.turnout_rate
          - entities.Election.fields.turnout_pct
          - entities.Election.fields.projected_turnout_pct
        distinguishing_aspect: |
          On the Election entity domain, identical ballot data yields projected_turnout_pct=100.00
          (counts RETURNED+ACCEPTED) but turnout_pct=50.00 (counts ACCEPTED only) — a different
          conserved subject (turnout) than the RecountCase certification dual-variant.
        test_recipe:
          setup:
            - "Election VOTING_OPEN, 2 ACTIVE registrations in one precinct; one ballot ACCEPTED, the other RETURNED-not-accepted; no early votes; total_registered=2."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "B", last_name: "B", national_id: "N2", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 20 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r2_id: $.data.id }
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_v: $.data.version }
            - call: "POST /registrations/${r2_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r2_v: $.data.version }
            - call: "POST /absentee-ballots"
              payload: { registration_id: "${r1_id}", mailing_address: "1 A St", expected_registration_version: "${r1_v}" }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { b1_id: $.data.id }
            - call: "POST /absentee-ballots"
              payload: { registration_id: "${r2_id}", mailing_address: "2 B St", expected_registration_version: "${r2_v}" }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { b2_id: $.data.id }
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "ISSUED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "RETURNED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "ACCEPTED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b2_id}/transition"
              payload: { target_request_status: "ISSUED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b2_id}/transition"
              payload: { target_request_status: "RETURNED" }
              as: ElectionOfficial
              as_user_id: "off-1"
          trigger:
            - call: "GET /elections/${e_id}"
              as: ElectionAdmin
              captures: { tp: $.data.turnout_pct, ptp: $.data.projected_turnout_pct }
          assert:
            - "Election.${e_id}.turnout_pct == 50.00"
            - "Election.${e_id}.projected_turnout_pct == 100.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: recount_certification_conditional_min_three_inputs
        grounds:
          - calculations.recount_certification
          - state_machines.RecountCase.BOTH_DONE_to_CERTIFIED
        distinguishing_aspect: |
          Mode (a): a formula over three inputs (machine_recount, hand_recount, DISCREPANCY_TOLERANCE)
          with a conditional branch selecting between hand and min(machine,hand) — non-linear interaction.
        test_recipe:
          setup:
            - "RecountCase BOTH_DONE with machine_recount=100, hand_recount=95 (delta 5 == tolerance, within)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /precincts/${p_id}/tally"
              payload: { reported_vote_count: 100 }
              as: Canvasser
              as_user_id: "canvasser-tally-1"
            - call: "POST /recount-cases"
              payload: { election_id: "${e_id}", precinct_id: "${p_id}" }
              as: ElectionAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /recount-cases/${rc_id}/submit-pass"
              payload: { pass: "MACHINE", count: 100 }
              as: Canvasser
              as_user_id: "canvasser-recount-2"
            - call: "POST /recount-cases/${rc_id}/submit-pass"
              payload: { pass: "HAND", count: 95 }
              as: Canvasser
              as_user_id: "canvasser-recount-2"
          trigger:
            - call: "POST /recount-cases/${rc_id}/transition"
              payload: { target_status: "CERTIFIED" }
              as: ElectionAdmin
          assert:
            - "RecountCase.${rc_id}.certified_count == 95"

      - name: precinct_capacity_posture_eval_order_then_mutate
        grounds:
          - calculations.precinct_selector
          - entities.Precinct.fields.capacity_posture
          - entities.Precinct.fields.assigned_count
          - validations[priority=18]
        distinguishing_aspect: |
          Mode (c): capacity_posture is derived from assigned_count, yet approval both READS the
          posture (must be OPEN) and then INCREMENTS assigned_count; the pinned order is read-posture-
          THEN-increment, so the last OPEN slot succeeds and flips posture to FULL afterward — a
          circular-looking dependency with explicit evaluation order, a different mode from (a).
        test_recipe:
          setup:
            - "Election REGISTRATION_OPEN; one precinct with max_registrations=1, assigned_count=0 (posture OPEN); one PENDING citizen-eligible registration matching the precinct."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 1 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { pid: $.data.precinct_id }
          assert:
            - "VoterRegistration.${r1_id}.status == ACTIVE"
            - "VoterRegistration.${r1_id}.precinct_id == ${p_id}"
            - "Precinct.${p_id}.assigned_count == 1"
            - "Precinct.${p_id}.capacity_posture == FULL"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: voter_registration_needs_review_revision_loop
        grounds:
          - state_machines.VoterRegistration.PENDING_to_NEEDS_REVIEW
          - state_machines.VoterRegistration.NEEDS_REVIEW_to_PENDING
        distinguishing_aspect: |
          VoterRegistration is cyclic: PENDING -> NEEDS_REVIEW -> PENDING (resubmit with corrected
          fields), a revision loop on the VoterRegistration entity — distinct from the AbsenteeBallot
          parallel-dimension machine.
        test_recipe:
          setup:
            - "Election REGISTRATION_OPEN; a PENDING registration with is_citizen=false."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: false, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/transition"
              payload: { target_status: "NEEDS_REVIEW" }
              as: ElectionOfficial
              as_user_id: "off-1"
          trigger:
            - call: "POST /registrations/${r1_id}/transition"
              payload: { target_status: "PENDING", is_citizen: true }
              as: ElectionOfficial
              as_user_id: "off-1"
          assert:
            - "VoterRegistration.${r1_id}.status == PENDING"
            - "VoterRegistration.${r1_id}.is_citizen == true"

      - name: absentee_ballot_parallel_request_and_cure_dimensions
        grounds:
          - state_machines.AbsenteeBallot.cure_status=NONE (request_status=RETURNED)_to_cure_status=FLAGGED
          - entities.AbsenteeBallot.fields.request_status
          - entities.AbsenteeBallot.fields.cure_status
        distinguishing_aspect: |
          AbsenteeBallot carries two independent state axes on one row: request_status stays RETURNED
          while cure_status advances NONE -> FLAGGED — parallel dimensions on a different entity than
          the VoterRegistration cyclic machine.
        test_recipe:
          setup:
            - "An ACTIVE registration with a RETURNED absentee ballot (cure_status NONE)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_v: $.data.version }
            - call: "POST /absentee-ballots"
              payload: { registration_id: "${r1_id}", mailing_address: "1 A St", expected_registration_version: "${r1_v}" }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { b1_id: $.data.id }
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "ISSUED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "RETURNED" }
              as: ElectionOfficial
              as_user_id: "off-1"
          trigger:
            - call: "POST /absentee-ballots/${b1_id}/flag-cure"
              payload: { reason: "SIGNATURE_MISMATCH" }
              as: ElectionOfficial
              as_user_id: "off-1"
          assert:
            - "AbsenteeBallot.${b1_id}.cure_status == FLAGGED"
            - "AbsenteeBallot.${b1_id}.request_status == RETURNED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cure_deny_cascades_cure_failed_then_request_rejected
        grounds:
          - state_machines.CureCase.RESPONSE_SUBMITTED_to_DENIED
          - state_machines.AbsenteeBallot.cure_status=CURE_PENDING_to_cure_status=CURE_FAILED
          - entities.AbsenteeBallot.fields.request_status
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /cure-cases/{id}/transition DENY: CureCase->DENIED
          mutates AbsenteeBallot.cure_status->CURE_FAILED, which itself mutates that ballot's
          request_status->REJECTED. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "A RETURNED ballot whose CureCase is RESPONSE_SUBMITTED (cure_status CURE_PENDING); registration reviewed by off-1 so off-2 may adjudicate."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_v: $.data.version }
            - call: "POST /absentee-ballots"
              payload: { registration_id: "${r1_id}", mailing_address: "1 A St", expected_registration_version: "${r1_v}" }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { b1_id: $.data.id }
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "ISSUED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b1_id}/transition"
              payload: { target_request_status: "RETURNED" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /absentee-ballots/${b1_id}/flag-cure"
              payload: { reason: "SIGNATURE_MISMATCH" }
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "GET /cure-cases"
              payload: { ballot_id: "${b1_id}" }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { cc_id: "$.data[0].id" }
            - call: "POST /cure-cases/${cc_id}/transition"
              payload: { decision: "SUBMIT_RESPONSE", voter_response_text: "this is me" }
              as: ElectionOfficial
              as_user_id: "off-1"
          trigger:
            - call: "POST /cure-cases/${cc_id}/transition"
              payload: { decision: "DENY" }
              as: ElectionOfficial
              as_user_id: "off-2"
          assert:
            - "CureCase.${cc_id}.status == DENIED"
            - "AbsenteeBallot.${b1_id}.cure_status == CURE_FAILED"
            - "AbsenteeBallot.${b1_id}.request_status == REJECTED"

      - name: withdraw_cascades_precinct_count_and_election_total
        grounds:
          - state_machines.VoterRegistration.ACTIVE_to_WITHDRAWN
          - entities.Precinct.fields.assigned_count
          - entities.Election.fields.total_registered
        distinguishing_aspect: |
          Depth-2 cascade originating from POST /registrations/{id}/transition WITHDRAWN: the
          registration's withdrawal decrements its Precinct.assigned_count, which in turn re-derives
          that precinct's capacity_posture and the Election.total_registered counter — a different
          triggering transition from the cure-deny cascade.
        test_recipe:
          setup:
            - "One ACTIVE registration assigned to a precinct with max_registrations=1 (assigned_count=1, posture FULL); total_registered=1; no absentee ballot."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
