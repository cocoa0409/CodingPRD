              as: EngineeringReviewer
              as_user_id: "eng-1"
              captures: { state_after: $.data.resulting_proposal_state }
          assert:
            - "${gate_state} == ENGINEERING_REVIEW and ${critique_user} == dual-1 and ${eng_user_before} == null"
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP status == 403"
            - "${state_mid} == ENGINEERING_REVIEW and ${eng_user_mid} == null (the refused review wrote nothing)"
            - "${state_after} == READY_FOR_ACCEPTANCE"
            - "GET /design-system/contribution-proposals/${prop_id}/reviews returns total_count == 2 (the refused attempt left no ReviewRecord)"

      - name: the_engineering_gate_cannot_be_reached_or_revisited_out_of_order
        claim_type: approval_chain
        grounds:
          - validations[priority=10]
          - errors[ERR_REVIEW_STAGE_MISMATCH]
          - state_machines.ContributionProposal
        distinguishing_aspect: |
          The two gates form an ordered chain: filing ENGINEERING_REVIEW while the proposal still
          sits at DESIGN_CRITIQUE skips a step and must be refused with ERR_REVIEW_STAGE_MISMATCH
          at 409, and once the chain has moved on, filing DESIGN_CRITIQUE again - step N-1 - must
          be refused with the same id. BLOCK is also only accepted at the engineering gate, so a
          BLOCK verdict filed at the critique gate is refused rather than silently downgraded.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core`; Component `badge`"
            - "a submitted ENHANCEMENT proposal sitting at the DESIGN_CRITIQUE gate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
