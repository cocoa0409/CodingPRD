  # ===========================================================================
  # SECTION 6 — errors  (§1.6, 54 codes; every code not already triggered by an
  # instance above gets one here)
  # ===========================================================================
  - section: errors
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "ERR_UNAUTHENTICATED (401) is the only rung that also guards pure reads and the logical clock: dropping X-Role, dropping X-User-ID, or sending a blank X-Role each fail identically, and they fail before the endpoint's role list is even consulted."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty district."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "GET /rostering/schools"
              payload: {}
              as: "(X-Role header omitted entirely)"
              as_user_id: "ro-001"
              captures: { err: "$.data.error_id" }
            - call: "GET /rostering/schools"
              payload: {}
              as: RosterOperator
              as_user_id: "(X-User-ID header omitted entirely)"
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-02T00:00:00Z" }
              as: "(X-Role sent as an empty string)"
              as_user_id: "ro-001"
          assert:
            - "the read without X-Role returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the read without X-User-ID returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the clock write with a blank X-Role returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED — a blank header is not a present header"
            - "the clock is still 2026-08-01T00:00:00Z: the rejected write had no effect"
            - "each body carries the standard error envelope with success false and a non-empty message"

      - name: unknown_path_ids_return_not_found_per_entity
        claim_type: Triggerable
        grounds:
          - errors[ERR_SCHOOL_NOT_FOUND]
          - errors[ERR_TERM_NOT_FOUND]
          - errors[ERR_TEACHER_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - errors[ERR_VENDOR_APP_NOT_FOUND]
          - errors[ERR_APP_ACCOUNT_NOT_FOUND]
          - errors[ERR_SYNC_RUN_NOT_FOUND]
          - errors[ERR_ERROR_QUEUE_ITEM_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "One sentinel UUID walked across eight collections proves the 404 family is per-entity rather than a single generic code: the same non-existent id yields a different error_id on every path, which is what makes the left-to-right path resolution rule observable."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty district — nothing exists, so every id is unknown."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "GET /rostering/schools/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { err: "$.data.error_id" }
            - call: "GET /rostering/terms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/teachers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/enrollments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/vendor-apps/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VendorIntegrationManager
              as_user_id: "vim-001"
            - call: "GET /rostering/app-accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "GET /rostering/sync-runs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/error-queue-items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
          assert:
            - "every call returns HTTP 404"
            - "the error_ids are respectively ERR_SCHOOL_NOT_FOUND, ERR_TERM_NOT_FOUND, ERR_TEACHER_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_VENDOR_APP_NOT_FOUND, ERR_APP_ACCOUNT_NOT_FOUND, ERR_SYNC_RUN_NOT_FOUND, ERR_ERROR_QUEUE_ITEM_NOT_FOUND"
            - "no call creates anything: every collection list still reports total_count 0"

      - name: closed_building_rejects_teachers_students_and_sections
        claim_type: Triggerable
        grounds:
          - errors[ERR_SCHOOL_CLOSED]
          - validations[priority=9]
        distinguishing_aspect: "Closing a building is a write barrier, not a delete: the CLOSED School still reads back and still lists, but all three of its child creators (teacher, student, section) refuse with ERR_SCHOOL_CLOSED (409), and the barrier is checked after path existence so the school id itself is confirmed to resolve."
        test_recipe:
          setup:
            - "Clock at 2026-08-20T00:00:00Z; ACTIVE Term Fall 2026; Northside registered then PATCHed to status CLOSED; a second ACTIVE building Southmeadow as the control."
