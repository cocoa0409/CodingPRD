              payload: {}
              as: ResourceManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_ASSIGNMENT_STATE_INVALID"
            - "${err_id} != ERR_ALLOCATION_CAPACITY_EXCEEDED even though confirming would have driven allocation to 200.00"
            - "Assignment.${a2_id}.status == CANCELLED and confirmed_on is null"
            - "Assignment.${a1_id}.status == CONFIRMED and Consultant.${c1_id}.allocated_pct == 100.00"
            - "DemandOpportunity.${d1_id}.covered_internal_fte == 1.00 and open_fte == 1.00 — no coverage moved"

      - name: authz_beats_existence_on_assignment_confirm
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - rbac.SalesLead
          - endpoints[POST /assignments/{id}/confirm]
        distinguishing_aspect: |
          Category pair AUTH (priority 2) versus EXISTENCE (priority 4): a SalesLead confirming
          an assignment id that does not exist must get ERR_UNAUTHORIZED and never
          ERR_ASSIGNMENT_NOT_FOUND, so the role gate cannot be used to probe which ids exist.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. Database contains one NA group and one CLOUD_ARCH skill and no Assignment rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
          trigger:
            - call: "POST /assignments/00000000-0000-4000-8000-0000000000ff/confirm"
              payload: {}
              as: SalesLead
              as_user_id: "u_sales_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 403 and ${err_id} == ERR_UNAUTHORIZED"
            - "${err_id} != ERR_ASSIGNMENT_NOT_FOUND — priority 2 short-circuits before the priority 4 existence lookup runs"
            - "GET /assignments as ResourceManager returns total_count == 0 — nothing was created or mutated"

      - name: travel_constraint_beats_margin_floor_on_confirm
        grounds:
          - validations[priority=26]
          - validations[priority=40]
          - errors[ERR_TRAVEL_CONSTRAINT_VIOLATED]
          - errors[ERR_MARGIN_FLOOR_BREACH]
          - calculations.rate_realization
          - endpoints[POST /assignments/{id}/confirm]
        distinguishing_aspect: |
          Category pair BUSINESS_CONSTRAINT (priority 26) versus BUSINESS_FISCAL (priority 40):
          the candidate breaks the travel ceiling (3 onsite nights against a 1-night limit) AND
          projects a 4.00% margin against the 20.00 floor, and the response must be
          ERR_TRAVEL_CONSTRAINT_VIOLATED.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group, one CLOUD_ARCH skill."
            - "One consultant with travel_max_nights_per_week 1 and cost_rate_usd_per_hour 240.00, holding an ACTIVE proficiency-4 assertion with no certification (so priorities 21 and 25 both pass)."
            - "One QUALIFIED, INTERNAL demand with onsite_nights_per_week 3, min_proficiency_level 3, standard 250.00 and requested 250.00."
            - "One PROPOSED BILLABLE assignment at 100.00% over [2026-08-03, 2026-08-29) — capacity is fine, so priority 32 cannot fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
