              as_user_id: "${cust_a}"
              captures: { rsv_1: $.data.id, rsv_1_v: $.data.version }
            - call: "POST /rental-network/reservations/${rsv_1}/confirm"
              payload: { expected_reservation_version: "${rsv_1_v}" }
              as: Customer
              as_user_id: "${cust_a}"
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_b}", origin_dealer_id: "${dealer_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-12T10:00:00Z", dropoff_date: "2026-11-13T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_b}"
              captures: { rsv_2: $.data.id, rsv_2_v: $.data.version }
          trigger:
            - call: "POST /rental-network/reservations/${rsv_2}/confirm"
              payload: { expected_reservation_version: "${rsv_2_v}" }
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err: $.data.error_id }
            - call: "POST /rental-network/reservations/${rsv_1}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_a}"
            - call: "POST /rental-network/reservations/${rsv_2}/confirm"
              payload: { expected_reservation_version: "${rsv_2_v}" }
              as: Customer
              as_user_id: "${cust_b}"
          assert:
            - "First trigger error_id == ERR_NO_UNIT_AVAILABLE (U1 HELD by R1 even though windows are adjacent, not overlapping)"
            - "After R1 cancel: EquipmentUnit.${unit_1}.status == AVAILABLE"
            - "Second confirm succeeds: Reservation.${rsv_2}.status == CONFIRMED and unit HELD again"

      - name: storage_zone_aggregate_capacity_interval_semantics
        grounds:
          - validations[priority=19]
          - calculations.cross_sell_bundle
        distinguishing_aspect: |
          Different interval semantics: aggregate capacity overlap, not
          single-occupancy — storage months from MANY orders accumulate
          against the SUM of OPEN locations' capacity in the zone; closing
          one location shrinks the pool so a previously-legal order would now
          violate. Tested on cross-sell-orders (different resource entity:
          Location pool vs EquipmentUnit).
        test_recipe:
          setup:
            - "Two NORTH locations L1 (capacity 4) and L2 (capacity 4); dealers D1 at L1, D2 at L2"
            - "Existing orders occupy 5 zone-months"
            - "L2 closed (no units there; preconditions satisfied) -> zone capacity drops to 4"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-16", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 4 }
              as: NetworkAdmin
              captures: { loc_1: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "FLG-16", city: "Flagstaff", geo_zone: "NORTH", storage_capacity: 4 }
              as: NetworkAdmin
              captures: { loc_2: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-161", name: "Dealer 161", location_id: "${loc_1}" }
              as: NetworkAdmin
              captures: { dealer_1: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-162", name: "Dealer 162", location_id: "${loc_2}" }
              as: NetworkAdmin
              captures: { dealer_2: $.data.id }
            - call: "POST /rental-network/cross-sell-orders"
              payload: { dealer_id: "${dealer_1}", line_items: [], storage_months: 3 }
              as: DealerAgent
              as_user_id: "${dealer_1}"
            - call: "POST /rental-network/cross-sell-orders"
              payload: { dealer_id: "${dealer_2}", line_items: [], storage_months: 2 }
              as: DealerAgent
              as_user_id: "${dealer_2}"
            - call: "POST /rental-network/locations/${loc_2}/close"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /rental-network/cross-sell-orders"
              payload: { dealer_id: "${dealer_1}", line_items: [], storage_months: 1 }
              as: DealerAgent
              as_user_id: "${dealer_1}"
              captures: { err: $.data.error_id }
          assert:
            - "Before close: occupied 5 <= capacity 8 (orders succeeded)"
            - "After close: capacity 4 (only OPEN location L1 counts); occupied 5 already exceeds, so any further order fails"
            - "trigger error_id == ERR_STORAGE_CAPACITY_EXCEEDED (5 + 1 > 4)"
            - "HTTP 409"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: confirm_cancel_hold_release_conserves_fleet_availability
        grounds:
          - state_machines.EquipmentUnit.AVAILABLE_to_HELD
          - state_machines.EquipmentUnit.HELD_to_AVAILABLE
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: per dealer, count(AVAILABLE) + count(HELD) +
          count(OUT) + count(REPOSITIONING) + count(MAINTENANCE) over
          non-RETIRED units at that dealer is invariant under confirm/cancel
          pairs; the compensating cancel MUST restore the exact pre-confirm
          AVAILABLE count with zero drift across repeated cycles.
        test_recipe:
          setup:
            - "Dealer DA with 2 AVAILABLE TRUCK_10FT units; ACTIVE rate; verified customer"
            - "One confirm->cancel cycle exercises the forward/compensating pair"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-17", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-17", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-A17", name: "Dealer A17", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dealer_a: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-1701", equipment_type: "TRUCK_10FT", dealer_id: "${dealer_a}" }
              as: NetworkAdmin
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-1702", equipment_type: "TRUCK_10FT", dealer_id: "${dealer_a}" }
              as: NetworkAdmin
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate_1: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_1}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh_1: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "c17@x.com", full_name: "Cust 17", vehicle_profile_id: "${veh_1}" }
              as: Customer
              captures: { cust_1: $.data.id }
            - call: "POST /rental-network/customers/${cust_1}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_a}"
          trigger:
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_1}", origin_dealer_id: "${dealer_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-11T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_1}"
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /rental-network/reservations/${r1}/confirm"
              payload: { expected_reservation_version: "${r1_v}" }
              as: Customer
              as_user_id: "${cust_1}"
            - call: "GET /rental-network/equipment-units?current_dealer_id=${dealer_a}&status=AVAILABLE"
              payload: {}
              as: NetworkAdmin
              captures: { avail_after_confirm: $.data }
            - call: "POST /rental-network/reservations/${r1}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_1}"
            - call: "GET /rental-network/equipment-units?current_dealer_id=${dealer_a}&status=AVAILABLE"
              payload: {}
              as: NetworkAdmin
              captures: { avail_after_cancel: $.data }
          assert:
            - "After confirm: exactly 1 AVAILABLE unit at DA (2 - 1 held)"
            - "After cancel: exactly 2 AVAILABLE units at DA — invariant restored, no drift"
            - "GET list meta.total_count for AVAILABLE at DA == 2 after cancel"

      - name: claim_approve_plan_cancel_compensation_conserves_damage_charge
        grounds:
          - calculations.calculate_settlement
          - state_machines.DamageProtectionPlan.ACTIVE_to_CANCELLED
          - state_machines.DamageClaim.FILED_to_APPROVED
          - entities.RentalAgreement.fields.damage_charge_cents
        distinguishing_aspect: |
          Conserved quantity: RentalAgreement.damage_charge_cents == sum of
          approved amounts over claims in {APPROVED, PAID} — a compensating
          plan-cancel that auto-denies a FILED claim must leave the sum
          unchanged (denied claims contribute 0), and approving then settling
          freezes exactly that sum into total_settled_cents with no drift
          between damage_charge_cents and the claim ledger.
        test_recipe:
          setup:
            - "Rental flow to RETURNED with STANDARD plan; claim CL1 (100000c) APPROVED; claim CL2 (50000c) FILED"
            - "damage_charge_cents == 100000 after CL1 approval"
            - "Note: plan is EXPIRED after return, so plan-cancel path is exercised on a second agreement still ACTIVE"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-18", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-18", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-A18", name: "Dealer A18", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dealer_a: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-B18", name: "Dealer B18", location_id: "${loc_b}" }
              as: NetworkAdmin
              captures: { dealer_b: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-1801", equipment_type: "TRUCK_10FT", dealer_id: "${dealer_a}" }
              as: NetworkAdmin
              captures: { unit_1: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate_1: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_1}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh_1: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "c18@x.com", full_name: "Cust 18", vehicle_profile_id: "${veh_1}" }
              as: Customer
              captures: { cust_1: $.data.id }
            - call: "POST /rental-network/customers/${cust_1}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_a}"
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_1}", origin_dealer_id: "${dealer_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-12T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_1}"
              captures: { rsv_1: $.data.id, rsv_1_v: $.data.version }
            - call: "POST /rental-network/reservations/${rsv_1}/confirm"
              payload: { expected_reservation_version: "${rsv_1_v}" }
              as: Customer
              as_user_id: "${cust_1}"
            - call: "POST /rental-network/rental-agreements"
              payload: { reservation_id: "${rsv_1}", equipment_unit_id: "${unit_1}", return_location_id: "${loc_b}" }
              as: DealerAgent
              as_user_id: "${dealer_a}"
              captures: { agr_1: $.data.id }
            - call: "POST /rental-network/damage-protection-plans"
              payload: { agreement_id: "${agr_1}", tier: "STANDARD" }
              as: DealerAgent
              as_user_id: "${dealer_a}"
            - call: "POST /rental-network/rental-agreements/${agr_1}/return"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_b}"
              captures: { agr_v1: $.data.version }
            - call: "POST /rental-network/damage-claims"
              payload: { agreement_id: "${agr_1}", claimed_amount_cents: 100000 }
              as: DealerAgent
              as_user_id: "${dealer_a}"
              captures: { claim_1: $.data.id }
            - call: "POST /rental-network/damage-claims/${claim_1}/approve"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_b}"
            - call: "POST /rental-network/damage-claims"
              payload: { agreement_id: "${agr_1}", claimed_amount_cents: 50000 }
              as: DealerAgent
              as_user_id: "${dealer_a}"
              captures: { claim_2: $.data.id }
            - call: "POST /rental-network/damage-claims/${claim_2}/deny"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_b}"
            - call: "GET /rental-network/rental-agreements/${agr_1}"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_b}"
              captures: { agr_v2: $.data.version }
          trigger:
            - call: "POST /rental-network/rental-agreements/${agr_1}/settle"
              payload: { expected_agreement_version: "${agr_v2}" }
              as: DealerAgent
              as_user_id: "${dealer_b}"
          assert:
            - "RentalAgreement.${agr_1}.damage_charge_cents == 100000 (only CL1's approved amount; CL2's denial contributes 0 — the approve-then-compensate pair leaves the ledger sum exact)"
            - "RentalAgreement.${agr_1}.total_settled_cents == 110000 (base 2 days * 5000 = 10000 + late 0 + damage 100000)"
            - "DamageClaim.${claim_2}.status == DENIED and is excluded from damage_charge_cents"
            - "RentalAgreement.${agr_1}.status == SETTLED"
