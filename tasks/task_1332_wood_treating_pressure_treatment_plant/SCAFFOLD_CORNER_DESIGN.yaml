              captures: { q1_status: "$.data.status" }
          assert:
            - "TreatmentCylinder.${cyl1_id}.status == DECOMMISSIONED"
            - "TreatmentCylinder.${cyl2_id}.status == DECOMMISSIONED"
            - "Charge.${q1_id}.status == SCRAPPED (was CYCLE_COMPLETE, non-terminal)"

