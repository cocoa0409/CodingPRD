      - name: auction_composite_trimmed_mean
        claim_type: correct_result
        grounds: ['calculations.auction_composite_value']
        distinguishing_aspect: "4 comps (2800000, 3000000, 3100000, 3200000): trim min+max, mean of remainder = 3050000."
        test_recipe:
          setup: ["member, vehicle; 4 auction comps for CLASSIC/Ford within window"]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Zoe", email: "zoe@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN107", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /auction-results"
              payload: { vehicle_class: CLASSIC, make: "Ford", model: "Mustang", year: 1970, sale_price_cents: 2800000, sale_date: "2026-03-01T00:00:00Z", source_name: "A" }
              as: PlatformAdmin
            - call: "POST /auction-results"
              payload: { vehicle_class: CLASSIC, make: "Ford", model: "Mustang", year: 1969, sale_price_cents: 3000000, sale_date: "2026-04-01T00:00:00Z", source_name: "B" }
              as: PlatformAdmin
            - call: "POST /auction-results"
              payload: { vehicle_class: CLASSIC, make: "Ford", model: "Mustang", year: 1971, sale_price_cents: 3100000, sale_date: "2026-05-01T00:00:00Z", source_name: "C" }
