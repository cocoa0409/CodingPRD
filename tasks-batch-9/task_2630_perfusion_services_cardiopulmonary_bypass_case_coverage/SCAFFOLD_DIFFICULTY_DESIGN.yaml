        distinguishing_aspect: |
          A different error-category pair on a different endpoint: business_safety (priority 41,
          422) versus business_fiscal (priority 72, 409) on
          POST /bypass-cases/{id}/assign-perfusionist. With the contract's monthly_case_cap already
          consumed AND the candidate's CCP certification lapsed by a clock advance, the credential
          row answers first with ERR_CERTIFICATION_NOT_CURRENT; issuing a fresh certification with
          in-cycle CE credits leaves only the fiscal row violated and the same call then answers
          ERR_CONTRACT_CASE_CAP_EXCEEDED, proving the cap row was armed all along.
