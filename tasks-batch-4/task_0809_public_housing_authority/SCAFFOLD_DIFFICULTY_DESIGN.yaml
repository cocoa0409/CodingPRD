          - errors[ERR_UNIT_TURNOVER_CONFLICT]
        distinguishing_aspect: >
          Offering a unit that is BOTH the wrong bedroom size (business_referential, priority 8)
          and still inside its make-ready buffer (business_temporal, priority 9) returns
          ERR_BEDROOM_MISMATCH — referential outranks temporal. Pair {business_referential,
          business_temporal}, distinct from the accept-state pair.
        test_recipe:
          setup:
            - "A bedroom-3 unit U was occupied then evicted-overruled on 2026-03-01 (U AVAILABLE, last_lease_end_date 2026-03-01, inside its 14-day buffer at clock 2026-03-01). Applicant B2 has a drawn ACTIVE entry on a bedroom-2 waitlist."
          setup_api_calls:
