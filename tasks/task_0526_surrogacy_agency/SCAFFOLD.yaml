    input: []
    output: Contract
    side_effects: ["cascade: freeze linked EscrowAccount if OPEN"]

  # --- Journeys ---
  - method: POST
    path: "/journeys"
    description: "Start a journey from a psych-cleared match with an EXECUTED contract; auto-opens an EscrowAccount"
    roles: [CaseManager]
    code: 201
    input: [match_id]
    output: Journey
    side_effects: ["creates Journey ACTIVE; auto-creates EscrowAccount OPEN for this journey (cascade)"]
  - method: GET
    path: "/journeys/{id}"
    description: "Fetch a journey (includes computed current_phase)"
    roles: [CaseManager, Screener, FinanceOfficer]
    code: 200
    input: []
    output: Journey
    side_effects: []
  - method: GET
    path: "/journeys"
    description: "List journeys (paginated, filterable by match_id, status)"
    roles: [CaseManager, Screener, FinanceOfficer]
    code: 200
    input: ["match_id?", "status?", "limit?", "offset?"]
    output: Journey[]
    side_effects: []
  - method: POST
    path: "/journeys/{id}/hold"
    description: "ACTIVE -> ON_HOLD"
    roles: [CaseManager]
    code: 200
    input: []
    output: Journey
    side_effects: ["state transition"]
  - method: POST
    path: "/journeys/{id}/resume"
    description: "ON_HOLD -> ACTIVE"
    roles: [CaseManager]
    code: 200
    input: []
    output: Journey
    side_effects: ["state transition"]
  - method: POST
    path: "/journeys/{id}/complete"
    description: "ACTIVE -> COMPLETED (requires BIRTH ACHIEVED + parentage GRANTED)"
    roles: [CaseManager]
    code: 200
    input: []
    output: Journey
    side_effects: ["state transition"]
  - method: POST
    path: "/journeys/{id}/terminate"
    description: "-> TERMINATED; freezes linked EscrowAccount"
    roles: [CaseManager]
    code: 200
    input: []
    output: Journey
    side_effects: ["cascade: freeze linked EscrowAccount if OPEN"]
  - method: POST
    path: "/journeys/{id}/parentage/file"
    description: "NOT_FILED -> FILED (blocked in PARENTAGE_HOSTILE states)"
    roles: [CaseManager]
    code: 200
    input: []
    output: Journey
    side_effects: ["sets parentage_order_status FILED"]
  - method: POST
    path: "/journeys/{id}/parentage/decide"
    description: "FILED -> GRANTED or DENIED"
    roles: [CaseManager]
    code: 200
    input: [decision]
    output: Journey
    side_effects: ["sets parentage_order_status to GRANTED or DENIED"]

  # --- Milestones (under Journey) ---
  - method: POST
    path: "/journeys/{id}/milestones"
    description: "Schedule a milestone (type uniqueness enforced)"
    roles: [CaseManager]
    code: 201
    input: [milestone_type, scheduled_utc]
    output: Milestone
    side_effects: ["creates Milestone SCHEDULED"]
  - method: GET
    path: "/journeys/{id}/milestones"
    description: "List milestones for a journey (FK reverse-reachability)"
    roles: [CaseManager, Screener, FinanceOfficer]
    code: 200
    input: []
    output: Milestone[]
    side_effects: []
  - method: POST
    path: "/journeys/{id}/milestones/{mid}/achieve"
    description: "SCHEDULED -> ACHIEVED (ordering enforced; recomputes current_phase)"
    roles: [CaseManager]
    code: 200
    input: []
    output: Milestone
    side_effects: ["stamps achieved_utc; recomputes Journey.current_phase"]
  - method: POST
    path: "/journeys/{id}/milestones/{mid}/fail"
    description: "SCHEDULED -> FAILED"
    roles: [CaseManager]
    code: 200
    input: []
    output: Milestone
    side_effects: ["state transition"]

  # --- Compensation Schedule (under Journey) ---
  - method: POST
    path: "/journeys/{id}/comp-schedule"
    description: "Add a compensation-schedule line to a journey"
    roles: [CaseManager, FinanceOfficer]
    code: 201
    input: [trigger_milestone_type, recipient, amount_cents]
    output: CompensationSchedule
    side_effects: ["creates CompensationSchedule line"]
  - method: GET
    path: "/journeys/{id}/comp-schedule"
    description: "List compensation-schedule lines for a journey (FK reverse-reachability)"
    roles: [CaseManager, FinanceOfficer]
    code: 200
    input: []
    output: CompensationSchedule[]
    side_effects: []

  # --- Escrow ---
  - method: GET
    path: "/escrow-accounts/{id}"
    description: "Fetch an escrow account (includes computed available_cents)"
    roles: [CaseManager, FinanceOfficer]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: []
  - method: GET
    path: "/escrow-accounts"
    description: "List escrow accounts (filterable by journey_id)"
    roles: [CaseManager, FinanceOfficer]
    code: 200
    input: ["journey_id?", "limit?", "offset?"]
    output: EscrowAccount[]
    side_effects: []
  - method: GET
    path: "/escrow-accounts/{id}/summary"
    description: "Computed read: disbursable_now + projected_liability + funding_shortfall"
    roles: [CaseManager, FinanceOfficer]
    code: 200
    input: []
    output: "{ available_cents: integer, disbursable_now_cents: integer, projected_liability_cents: integer, funding_shortfall_cents: integer }"
    side_effects: []
  - method: POST
    path: "/escrow-accounts/{id}/deposit"
    description: "IP deposits funds (OCC; budget cap)"
    roles: [IntendedParentActor]
    code: 200
    input: [amount_cents, expected_escrow_version]
    output: EscrowAccount
    side_effects: ["adds to deposited_cents; recomputes available_cents; increments version"]
  - method: POST
    path: "/escrow-accounts/{id}/freeze"
    description: "OPEN -> FROZEN"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: ["state transition"]
  - method: POST
    path: "/escrow-accounts/{id}/unfreeze"
    description: "FROZEN -> OPEN (blocked if linked Contract VOID)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: ["state transition"]
  - method: POST
    path: "/escrow-accounts/{id}/close"
    description: "OPEN -> CLOSED (reserved must be 0, journey COMPLETED)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: ["state transition"]

  # --- Disbursements (under Journey) ---
  - method: POST
    path: "/journeys/{id}/disbursements"
    description: "Request a disbursement against a comp-schedule line"
    roles: [CaseManager, FinanceOfficer]
    code: 201
    input: [schedule_id, escrow_account_id]
    output: Disbursement
    side_effects: ["creates Disbursement REQUESTED; copies amount_cents from schedule line"]
  - method: GET
    path: "/journeys/{id}/disbursements"
    description: "List disbursements for a journey (FK reverse-reachability)"
    roles: [CaseManager, FinanceOfficer]
    code: 200
    input: []
    output: Disbursement[]
    side_effects: []
  - method: POST
    path: "/journeys/{id}/disbursements/{did}/approve"
    description: "REQUESTED -> APPROVED (reserves funds; records approver)"
    roles: [CaseManager]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["reserves amount on escrow; records approved_by_user_id"]
  - method: POST
    path: "/journeys/{id}/disbursements/{did}/release"
    description: "APPROVED -> RELEASED (segregation of duties: releaser != approver)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["moves reserved -> disbursed on escrow"]
  - method: POST
    path: "/journeys/{id}/disbursements/{did}/reject"
    description: "REQUESTED or APPROVED -> REJECTED (returns any reservation)"
    roles: [CaseManager]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["releases reservation if was APPROVED"]

  # --- Disbursement single-resource + filtered list (FK reverse-reachability
  #     for Disbursement.journey_id, Disbursement.schedule_id, Disbursement.escrow_account_id) ---
  - method: GET
    path: "/disbursements/{id}"
    description: "Fetch a single disbursement"
    roles: [CaseManager, FinanceOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: []
  - method: GET
    path: "/disbursements"
    description: "List disbursements (filterable by journey_id, schedule_id, escrow_account_id)"
    roles: [CaseManager, FinanceOfficer]
    code: 200
    input: ["journey_id?", "schedule_id?", "escrow_account_id?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  # --- CompensationSchedule single-resource + filtered list (FK reverse-reachability
  #     for CompensationSchedule.journey_id) ---
  - method: GET
    path: "/comp-schedule/{id}"
    description: "Fetch a single compensation-schedule line"
    roles: [CaseManager, FinanceOfficer]
    code: 200
    input: []
    output: CompensationSchedule
    side_effects: []

  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CaseManager, FinanceOfficer, Screener]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances logical clock used by cooling-off and milestone timestamps"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource (path or body FK) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a valid state for the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal current parent version (OCC)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: missing required field, invalid enum, negative cents, bad decision value"
  - id: ERR_CARRIER_INELIGIBLE
    http: 422
    condition: "carrier prior_deliveries < 1 on submit, or donor_code collides with a non-terminal donor"
  - id: ERR_PSYCH_CLEARANCE_MISSING
    http: 422
    condition: "match accept/psych-clear attempted before required party clearance/psych PASSED"
  - id: ERR_INSURANCE_REVIEW_REQUIRED
    http: 422
    condition: "carrier clearance attempted with no InsuranceReview in {APPROVED, GAP_IDENTIFIED}"
  - id: ERR_COOLING_OFF_ACTIVE
    http: 422
    condition: "carrier-sign attempted before ip_signed_at + cooling_off_days"
  - id: ERR_MILESTONE_ORDER_VIOLATION
    http: 422
    condition: "milestone achieved out of EMBRYO_TRANSFER -> HEARTBEAT -> BIRTH order"
  - id: ERR_DUPLICATE_MILESTONE
    http: 409
    condition: "a milestone of the same milestone_type already exists on the journey"
  - id: ERR_BUDGET_EXCEEDED
    http: 422
    condition: "deposit would push deposited_cents above IntendedParent.budget_cents"
  - id: ERR_INSUFFICIENT_ESCROW
    http: 422
    condition: "disbursement amount exceeds EscrowAccount.available_cents at approve"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "FinanceOfficer releasing equals the CaseManager who approved the disbursement"
  - id: ERR_PARENTAGE_JURISDICTION_BLOCKED
    http: 422
    condition: "parentage file attempted while IntendedParent.state_code in PARENTAGE_HOSTILE {LA, NE}"
  - id: ERR_MILESTONE_GATE_NOT_MET
    http: 422
    condition: "disbursement approve attempted before its trigger milestone is ACHIEVED"
  - id: ERR_JOURNEY_PRECONDITION
    http: 422
    condition: "journey create attempted from a match that is not PSYCH_CLEARED with an EXECUTED contract"
  - id: ERR_VALIDATION_LIMIT
    http: 422
    condition: "pagination limit outside [1,100] or offset < 0"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: CaseManager
    description: "Runs intake creation, matching negotiation, journey/milestone operations, and disbursement approval"
    identity: opaque
    exclusive_operations:
      - "create IP / carrier / donor / match / contract / journey / milestone / comp-schedule / disbursement"
      - "match counter / re-propose / accept / void"
      - "journey hold / resume / complete / terminate / parentage file+decide"
      - "milestone achieve / fail"
      - "disbursement approve / reject"
    shared_operations:
      - "read IP / carrier / donor / match / contract / journey / escrow"
      - "create comp-schedule and disbursement (shared with FinanceOfficer)"
  - name: Screener
    description: "Performs intake screening, psychological clearance, insurance review, and match psych-clearance"
    identity: opaque
    exclusive_operations:
      - "start-screening / set-psych / clear / reject on IP, carrier, donor"
      - "insurance-review create / approve / identify-gap / reject"
      - "match psych-clear"
    shared_operations:
      - "read IP / carrier / donor / match / contract / journey"
  - name: FinanceOfficer
    description: "Manages escrow deposits governance and disbursement release; segregated from approval"
    identity: opaque
    exclusive_operations:
      - "escrow freeze / unfreeze / close"
      - "disbursement release"
    shared_operations:
      - "read escrow / journey / match / carrier"
      - "create comp-schedule and disbursement (shared with CaseManager)"
  - name: IntendedParentActor
    description: "The intended parent acting on their own contract and escrow"
    identity: "entity_backed:IntendedParent"
    exclusive_operations:
      - "contract ip-sign"
      - "escrow deposit"
    shared_operations:
      - "read own contract"
  - name: CarrierActor
    description: "The gestational carrier acting on their own contract"
    identity: "entity_backed:GestationalCarrier"
    exclusive_operations:
      - "contract carrier-sign"
    shared_operations:
      - "read own contract"
