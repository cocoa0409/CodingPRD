# =============================================================================
# task_0437_pallet_pooling — §1.9 Scaffold Corner Design (breadth coverage)
# Enumerates testable claims from §1.1–§1.7 NOT already covered by §1.8.
# Same 7-point per-instance contract + §1.5 reachability as §1.8.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with legal_name, role_type, credit_limit_cents returns 201, status=ACTIVE, outstanding_charge_cents=0, server-minted id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB; a PoolPolicy ACTIVE (program bootstrap)"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
          trigger:
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "MANUFACTURER", credit_limit_cents: 500000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id, st: $.data.status, oc: $.data.outstanding_charge_cents, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Account.${acct_id}.status == ACTIVE"
            - "Account.${acct_id}.outstanding_charge_cents == 0"
            - "Account.${acct_id}.version == 1"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Account, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{nonexistent} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: create_asset_missing_required_serial_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Asset, "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "POST /assets without serial returns ERR_INVALID_REQUEST 400 (serial is source:input with no default)."
        test_recipe:
          setup: ["AssetType ACTIVE and a Location exist"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Std", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: create_account_invalid_enum_role_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Account, "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "POST /accounts with role_type='WHOLESALER' (not in {MANUFACTURER,DISTRIBUTOR,RETAILER}) returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["PoolPolicy ACTIVE"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
          trigger:
            - call: "POST /accounts"
              payload: { legal_name: "Bad", role_type: "WHOLESALER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: create_asset_type_default_useful_life_days_applied
        claim_type: Defaults
        grounds: [entities.AssetType.fields.useful_life_days]
        distinguishing_aspect: "POST /asset-types omitting useful_life_days yields useful_life_days=1825 (the declared default)."
        test_recipe:
          setup: ["PoolPolicy ACTIVE"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
          trigger:
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Std", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id, ul: $.data.useful_life_days }
          assert:
            - "AssetType.${at_id}.useful_life_days == 1825"

      - name: location_physical_and_equity_computed_zero_on_create
        claim_type: Computed Fields
        grounds: [entities.Location.fields.physical_balance, entities.Location.fields.equity_balance, entities.Location.fields.equity_status]
        distinguishing_aspect: "A freshly created Location has physical_balance=0, equity_balance=0, equity_status=BALANCED regardless of any input attempting to set them."
        test_recipe:
          setup: ["An Account exists"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id, pb: $.data.physical_balance, eb: $.data.equity_balance, es: $.data.equity_status }
          assert:
            - "Location.${l1_id}.physical_balance == 0"
            - "Location.${l1_id}.equity_balance == 0"
            - "Location.${l1_id}.equity_status == BALANCED"

      - name: invoice_line_immutable_no_version_field
        claim_type: Listing
        grounds: [entities.InvoiceLine, endpoints]
        distinguishing_aspect: "GET /invoices/{id}/lines returns the InvoiceLine[] created under the invoice; each line carries its kind and amount_cents."
        test_recipe:
          setup: ["A DRAFT invoice with one HIRE line of 1234"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "RETAILER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /invoices"
              payload: { account_id: "${acct_id}" }
              as: PoolOperator
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { kind: "HIRE", amount_cents: 1234 }
              as: PoolOperator
              captures: { line_id: $.data.id }
          trigger:
            - call: "GET /invoices/${inv_id}/lines"
              payload: {}
              as: PoolOperator
              captures: { first_amount: "$.data[0].amount_cents" }
          assert:
            - "InvoiceLine list length == 1"
            - "InvoiceLine[0].amount_cents == 1234"

      - name: list_locations_pagination_envelope
        claim_type: Listing
        grounds: [entities.Location, endpoints]
        distinguishing_aspect: "GET /locations returns response_type=array with pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Two locations under one account"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L2" }
              as: PoolAdmin
          trigger:
            - call: "GET /locations"
              payload: {}
              as: PoolOperator
          assert:
            - "response.response_type == array"
            - "response.data total_count >= 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: hire_close_from_already_closed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Hire.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a hire already in lifecycle_status==CLOSED returns ERR_INVALID_STATE 409; no second final_charge recompute."
        test_recipe:
          setup: ["A hire opened then closed once"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Std", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "DISTRIBUTOR", credit_limit_cents: 10000000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a1: $.data.id }
            - call: "GET /locations/${l1_id}"
              payload: {}
              as: PoolOperator
              captures: { l1_v: $.data.version }
            - call: "POST /hires"
              payload: { account_id: "${acct_id}", location_id: "${l1_id}", asset_type_id: "${at_id}", asset_ids: ["${a1}"], expected_location_version: "${l1_v}" }
              as: PoolOperator
              captures: { hire_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /hires/${hire_id}/close"
              payload: {}
              as: PoolOperator
          trigger:
            - call: "POST /hires/${hire_id}/close"
              payload: {}
              as: PoolOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: transfer_receive_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TransferOrder.DISPATCHED_to_RECEIVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Receiving a transfer order still in DRAFT (never dispatched) returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A DRAFT transfer order over one asset"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Std", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "DISTRIBUTOR", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "A" }
              as: PoolAdmin
              captures: { a_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "B" }
              as: PoolAdmin
              captures: { b_id: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "T1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${a_id}" }
              as: PoolOperator
              captures: { t1: $.data.id }
            - call: "POST /transfer-orders"
              payload: { from_location_id: "${a_id}", to_location_id: "${b_id}", kind: "TRANSFER", asset_ids: ["${t1}"] }
              as: PoolOperator
              captures: { to_id: $.data.id }
          trigger:
            - call: "POST /transfer-orders/${to_id}/receive"
              payload: {}
              as: PoolOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: voucher_redeem_after_expiry_returns_voucher_expired
        claim_type: Precondition Enforcement
        grounds: [state_machines.Voucher.OUTSTANDING_to_REDEEMED, "validations[priority=11]", "errors[ERR_VOUCHER_EXPIRED]"]
        distinguishing_aspect: "Redeeming a voucher after issued_at + voucher_expiry_days (90) has elapsed returns ERR_VOUCHER_EXPIRED 409; equity not credited to redeemer."
        test_recipe:
          setup: ["Voucher OUTSTANDING issued 2026-06-01 (expiry 90d); clock advanced to 2026-10-01 (past expiry)"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD", voucher_expiry_days: 90 }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Std", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acct1", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct1: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acct2", role_type: "RETAILER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct2: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct1}", name: "LA" }
              as: PoolAdmin
              captures: { la_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct2}", name: "LB" }
              as: PoolAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PoolAdmin
            - call: "GET /locations/${la_id}"
              payload: {}
              as: PoolOperator
              captures: { la_v: $.data.version }
            - call: "POST /vouchers"
              payload: { from_location_id: "${la_id}", to_account_id: "${acct2}", asset_type_id: "${at_id}", quantity: 2, expected_from_location_version: "${la_v}" }
              as: PoolOperator
              captures: { vch_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PoolAdmin
          trigger:
            - call: "POST /vouchers/${vch_id}/redeem"
              payload: { redeem_location_id: "${lb_id}" }
              as: PoolOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VOUCHER_EXPIRED"
            - "response.status == 409"

      - name: voucher_cancel_restores_issuer_equity
        claim_type: Side Effect Execution
        grounds: [state_machines.Voucher.OUTSTANDING_to_CANCELLED, entities.Location.fields.equity_balance]
        distinguishing_aspect: "Cancelling an OUTSTANDING voucher (qty 3) snaps the equity obligation back: from_location.equity_balance rises by 3 (compensating restore)."
        test_recipe:
          setup: ["Location LA equity_balance=5 (5-asset ISSUANCE); voucher qty=3 issued from LA (LA equity now 2)"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Std", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acct1", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct1: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acct2", role_type: "RETAILER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct2: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct1}", name: "Stock" }
              as: PoolAdmin
              captures: { stock_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct1}", name: "LA" }
              as: PoolAdmin
              captures: { la_id: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "W1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { w1: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "W2", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { w2: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "W3", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { w3: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "W4", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { w4: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "W5", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { w5: $.data.id }
            - call: "POST /transfer-orders"
              payload: { from_location_id: "${stock_id}", to_location_id: "${la_id}", kind: "ISSUANCE", asset_ids: ["${w1}","${w2}","${w3}","${w4}","${w5}"] }
              as: PoolOperator
              captures: { to_id: $.data.id }
            - call: "POST /transfer-orders/${to_id}/dispatch"
              payload: {}
              as: PoolOperator
            - call: "POST /transfer-orders/${to_id}/receive"
              payload: {}
              as: PoolOperator
            - call: "GET /locations/${la_id}"
              payload: {}
              as: PoolOperator
              captures: { la_v: $.data.version }
            - call: "POST /vouchers"
              payload: { from_location_id: "${la_id}", to_account_id: "${acct2}", asset_type_id: "${at_id}", quantity: 3, expected_from_location_version: "${la_v}" }
              as: PoolOperator
              captures: { vch_id: $.data.id }
          trigger:
            - call: "POST /vouchers/${vch_id}/cancel"
              payload: {}
              as: PoolAdmin
            - call: "GET /locations/${la_id}"
              payload: {}
              as: PoolOperator
              captures: { la_eq: $.data.equity_balance }
          assert:
            - "Location.${la_id}.equity_balance == 5"
            - "Voucher.${vch_id}.status == CANCELLED"

      - name: repair_scrap_marks_assets_lost
        claim_type: Side Effect Execution
        grounds: [state_machines.RepairJob.OPEN_to_SCRAPPED, state_machines.Asset.IN_REPAIR_to_LOST, entities.Asset.fields.condition]
        distinguishing_aspect: "Scrapping a repair job flips each IN_REPAIR asset to LOST permanently."
        test_recipe:
          setup: ["One DAMAGED asset collected and under an OPEN repair job"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Std", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "Depot" }
              as: PoolAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "R1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${dep_id}" }
              as: PoolOperator
              captures: { a1: $.data.id }
            - call: "POST /assets/${a1}/report-damage"
              payload: {}
              as: PoolOperator
            - call: "POST /collection-requests"
              payload: { location_id: "${dep_id}", asset_ids: ["${a1}"] }
              as: PoolOperator
              captures: { cr_id: $.data.id }
            - call: "POST /collection-requests/${cr_id}/collect"
              payload: {}
              as: PoolOperator
            - call: "POST /repair-jobs"
              payload: { collection_request_id: "${cr_id}", asset_ids: ["${a1}"], repair_cost_cents: 1000 }
              as: PoolOperator
              captures: { rj_id: $.data.id }
          trigger:
            - call: "POST /repair-jobs/${rj_id}/scrap"
              payload: {}
              as: PoolOperator
            - call: "GET /assets/${a1}"
              payload: {}
              as: PoolOperator
              captures: { cond: $.data.condition }
          assert:
            - "Asset.${a1}.condition == LOST"
            - "RepairJob.${rj_id}.status == SCRAPPED"

      - name: account_close_blocked_by_open_hire
        claim_type: Precondition Enforcement
        grounds: [state_machines.Account.ACTIVE_to_CLOSED, "errors[ERR_ACCOUNT_HAS_OPEN_HIRE]"]
        distinguishing_aspect: "Closing an account that has a hire in lifecycle_status==OPEN returns ERR_ACCOUNT_HAS_OPEN_HIRE 409."
        test_recipe:
          setup: ["Account with one OPEN hire"]
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Std", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "DISTRIBUTOR", credit_limit_cents: 10000000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a1: $.data.id }
            - call: "GET /locations/${l1_id}"
              payload: {}
              as: PoolOperator
