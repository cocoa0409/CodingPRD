  - rule_id: compensating_invariant
    instances:
      - name: accrued_liability_ledger_reverses_exactly_on_dispute_downgrade
        conserved_quantity: "WarrantyProgram.accrued_liability_cents == SUM(WarrantyClaim.oem_total_cents) over claims in {APPROVED_MODULE, APPROVED_PACK, APPROVED_SOFTWARE, FULFILLED, CLOSED}"
        grounds:
          - entities.WarrantyProgram.fields.accrued_liability_cents
          - calculations.lab_deviation
          - state_machines.CapacityDispute
          - validations[priority=22]
          - validations[priority=48]
        distinguishing_aspect: |
          The conserved quantity is a MONETARY ledger mirror, and the compensation must land on
          exactly one of two identically priced claims: the reversal takes the accrual from 741184
          to 370592 (claim 1's total, untouched), not to 0 and not to 741184 - and a second resolve
          attempt is refused so the reversal can never be applied twice.
        test_recipe:
          setup:
            - "One program at the default liability cap, one L3 center, one L3 technician."
            - "TWO vehicles in service 2020-03-10 with identical telemetry, both assessed at retention 70.00 % with faulted modules 3 and 7, both claims adjudicated MODULE_REPLACEMENT by adj-001 - so each books an identical oem_total_cents of 370592 and the accrual stands at 741184."
