      - name: repetitive_loss_ignores_a_claim_one_cent_below_the_minimum
        claim_type: constants_applied
        grounds:
          - calculations.repetitive_loss_classification
          - entities.Property.fields.qualifying_claim_count
          - entities.ImprovementRecord.fields.claim_paid_amount_usd
        distinguishing_aspect: |
          A 999.99 paid claim is one cent below RL_CLAIM_MIN_PAID_USD 1000.00 and never enters
          the claim list, so qualifying_claim_count is 1, cumulative_claim_paid_usd is 1500.00
          and repetitive_loss_status stays NONE; admitting it would have reached
          RL_REPETITIVE_CLAIM_COUNT inside the ten-year window and flipped the parcel to
          REPETITIVE_LOSS.
        test_recipe:
          setup:
            - "Canonical base fixture through the structure."
            - "One DAMAGE record with claim_paid_amount_usd 1500.00 on 2020-05-01 (no cost, so nothing is counted in the improvement ledger)."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
