# =============================================================================
# Competitive Price Monitoring & Price Match — retail pricing intelligence
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2524. Competitive Price Monitoring & Price Match (retail pricing intelligence):
  competitor set definition by market with online and store price collection
  methods, product matching across competitors using identifiers, attributes and
  image comparison with confidence scoring, price index reporting by category and
  market against strategic positioning targets, automated repricing rules with
  margin floors, brand restrictions and change frequency limits, price match
  policy administration with eligible competitors, exclusions and verification
  workflow, store associate override authority and approval logging, pricing
  change execution across channels with signage and label reprinting, price
  perception research validating index strategy

domain_name: competitive-price-intelligence
api_prefix: /pricing

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  difficulty_level: expert_plus          # §0.4 Expert band, deliberately over-coupled
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only ONE nested URL exists
  # (`/claims/{id}/override-logs`, the append-only audit child). Everything else
  # is addressed at its own top-level collection with FK fields in the body.

  state_machine_shape: cyclic
  # CompetitorProductLink loops PROPOSED -> UNDER_REVIEW -> PROPOSED (revision
  # rounds); PriceMatchClaim loops VERIFYING -> NEEDS_EVIDENCE -> VERIFYING and
  # forks VERIFYING -> {VERIFIED, REJECTED, NEEDS_EVIDENCE}; PriceChangeOrder
  # carries two independent dimensions (status x signage_status) and reverts
  # PENDING_APPROVAL -> DRAFT.

  relationship_patterns:
    - one_to_many          # Market -> Competitor / Product / Store / RepricingRule / PriceIndexReport
    - many_to_many         # CompetitorProductLink is the Product x Competitor junction
    - self_referential     # PriceChangeOrder.supersedes_order_id -> PriceChangeOrder.id
    - cross_aggregate      # PriceMatchClaim spans Store, Product, Competitor, PriceMatchPolicy

  role_model: segregation_of_duties
  # The PricingManager who authored a PriceChangeOrder may not decide it
  # (X-User-ID compared against PriceChangeOrder.authored_by_user_id), and a
  # StoreAssociate may not honor a claim whose required_approval_tier is MANAGER.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: market_code, type: string, source: input, description: "Short market identifier, e.g. US-WEST", constraints: "globally unique, 1..32 chars" }
      - { name: name, type: string, source: input, description: "Human-readable market name" }
      - { name: currency_code, type: string, source: input, default: "USD", description: "ISO 4217 currency of all *_cents fields in this market" }
      - { name: strategic_positioning, type: enum, source: input, description: "PRICE_LEADER | AT_PARITY | PREMIUM — the declared strategy this market is priced against" }
      - { name: strategic_index_target_bp, type: integer, source: input, description: "Target price index in basis points vs the competitor set (10000 = parity; 9800 = 2% below)", constraints: "5000..15000" }
      - { name: index_tolerance_bp, type: integer, source: input, default: 150, description: "Allowed absolute deviation from strategic_index_target_bp before the market is off target", constraints: ">= 0" }
      - { name: observed_index_bp, type: integer, source: computed, description: "index_bp of the governing PUBLISHED PriceIndexReport (selector pinned in calculations.market_posture_evaluation); null when no PUBLISHED report exists" }
      - { name: positioning_gap_bp, type: integer, source: computed, description: "observed_index_bp - strategic_index_target_bp; null when observed_index_bp is null" }
      - { name: insufficient_data_report_count, type: integer, source: computed, default: 0, description: "Count of PriceIndexReport rows for this market with data_sufficiency == INSUFFICIENT and status IN {DRAFT, PUBLISHED}" }
      - { name: pricing_posture, type: enum, source: computed, default: "OPEN", description: "OPEN | RESTRICTED | FROZEN — derived gate over all price-change and price-match writes in this market (see calculations.market_posture_evaluation)" }

  - name: Competitor
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; the market whose competitor set this row belongs to" }
      - { name: competitor_code, type: string, source: input, description: "Short competitor identifier", constraints: "unique per (market_id, competitor_code)" }
      - { name: name, type: string, source: input, description: "Competitor banner name" }
      - { name: collection_method, type: enum, source: input, description: "ONLINE | STORE_AUDIT | HYBRID — how prices are collected for this competitor" }
      - { name: tier, type: enum, source: input, description: "PRIMARY | SECONDARY — PRIMARY competitors set the index benchmark" }
      - { name: price_match_eligible, type: boolean, source: input, default: false, description: "Whether customer price-match claims may cite this competitor" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | RETIRED — SUSPENDED is reachable both by PATCH and by the drift auto-suspend cascade" }
      - { name: suspension_reason, type: string, source: system, description: "Free-text reason recorded on the ACTIVE -> SUSPENDED transition; null while ACTIVE" }
      - { name: confirmed_match_count, type: integer, source: computed, default: 0, description: "Count of CompetitorProductLink rows with competitor_id == this.id and status == CONFIRMED" }
      - { name: stale_match_count, type: integer, source: computed, default: 0, description: "Count of CompetitorProductLink rows with competitor_id == this.id, status == CONFIRMED and gap_stale == true" }
      - { name: stale_share_bp, type: integer, source: computed, default: 0, description: "round_half_up(stale_match_count * 10000 / confirmed_match_count); 0 when confirmed_match_count == 0" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; catalog rows are per-market" }
      - { name: sku, type: string, source: input, description: "Retailer SKU", constraints: "unique per (market_id, sku)" }
      - { name: category_code, type: string, source: input, description: "Merchandise category used by index reporting and repricing rules" }
      - { name: brand, type: string, source: input, description: "Brand name; matched against RepricingRule.brand_exclusions" }
      - { name: own_price_cents, type: integer, source: input, description: "Current shelf/online price. Set at creation; afterwards mutated ONLY by the PriceChangeOrder APPROVED -> EXECUTED transition", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Landed unit cost driving the margin floor", constraints: "> 0" }
      - { name: margin_floor_pct, type: number, source: input, default: 0.20, description: "Minimum gross margin as a fraction of price", constraints: "0 <= x < 1" }
      - { name: map_floor_cents, type: integer, source: input, default: 0, description: "Brand minimum advertised price; 0 means the brand imposes none", constraints: ">= 0" }
      - { name: brand_repricing_restricted, type: boolean, source: input, default: false, description: "When true the brand forbids AUTOMATED_RULE change orders on this product" }
      - { name: index_weight_bp, type: integer, source: input, default: 10000, description: "Basket weight of this product inside its category index", constraints: "> 0" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | DISCONTINUED — accepted at creation; DISCONTINUED products are excluded from every index basket" }
      - { name: last_price_change_at, type: datetime, source: computed, description: "Logical-clock instant of the most recent EXECUTED PriceChangeOrder on this product; null when never repriced" }
      - { name: price_change_count, type: integer, source: computed, default: 0, description: "Number of PriceChangeOrder rows for this product that reached EXECUTED" }
      - { name: effective_floor_cents, type: integer, source: computed, description: "max(ceil(unit_cost_cents / (1 - margin_floor_pct)), map_floor_cents) — the hard price floor for both repricing and price match" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: store_code, type: string, source: input, description: "Store identifier", constraints: "unique per (market_id, store_code)" }
      - { name: override_authority_cents, type: integer, source: input, description: "Largest per-claim discount a StoreAssociate may honor without StoreManager approval", constraints: ">= 0" }
      - { name: label_printer_capacity_per_day, type: integer, source: input, description: "Shelf-label reprint slots available per UTC calendar day", constraints: "> 0" }
      - { name: label_slots_used_today, type: integer, source: computed, default: 0, description: "Sum of LabelPrintBatch.item_count over batches for this store with status IN {SCHEDULED, PRINTING, COMPLETED} whose window_start falls on the logical clock's current UTC date" }
      - { name: label_slots_remaining_today, type: integer, source: computed, description: "label_printer_capacity_per_day - label_slots_used_today" }
      - { name: override_budget_used_cents, type: integer, source: computed, default: 0, description: "Sum of OverrideLog.approved_discount_cents with direction == DEBIT minus sum with direction == CREDIT, over logs whose created_at falls on the logical clock's current UTC date and whose claim.store_id == this.id" }
      - { name: override_budget_remaining_cents, type: integer, source: computed, description: "governing PriceMatchPolicy.daily_override_budget_cents - override_budget_used_cents" }

  - name: CompetitorProductLink
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: competitor_id, type: string, source: input, description: "FK -> Competitor.id; must belong to the same market_id as the product" }
      - { name: match_method, type: enum, source: input, description: "IDENTIFIER | ATTRIBUTE | IMAGE — the evidence channel that produced this candidate match" }
      - { name: competitor_identifier, type: string, source: input, description: "Competitor-side GTIN/UPC/MPN when match_method == IDENTIFIER; null otherwise" }
      - { name: identifier_score, type: integer, source: input, description: "Identifier agreement score", constraints: "0..100" }
      - { name: attribute_score, type: integer, source: input, description: "Attribute agreement score", constraints: "0..100" }
      - { name: image_score, type: integer, source: input, description: "Image comparison score", constraints: "0..100" }
      - { name: confidence_bp, type: integer, source: computed, description: "Match confidence in basis points (0..10000) per calculations.match_confidence_score" }
      - { name: confidence_variant, type: enum, source: computed, description: "IDENTIFIER_ANCHORED | ATTRIBUTE_BLEND — which confidence variant produced confidence_bp" }
      - { name: match_grade, type: enum, source: computed, description: "EXACT (confidence_bp >= 8500) | CLOSE (6000 <= confidence_bp < 8500) | WEAK (confidence_bp < 6000)" }
      - { name: review_round, type: integer, source: computed, default: 0, description: "Number of completed UNDER_REVIEW -> PROPOSED revision loops" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | UNDER_REVIEW | CONFIRMED | REJECTED" }
      - { name: latest_effective_price_cents, type: integer, source: computed, description: "Competitor price selected by calculations.effective_competitor_price; null when no observation qualifies" }
      - { name: selected_observation_id, type: string, source: computed, description: "id of the PriceObservation chosen by calculations.effective_competitor_price; null when none qualifies. Identity only — never a decision input" }
      - { name: data_status, type: enum, source: computed, default: "INSUFFICIENT", description: "SUFFICIENT when latest_effective_price_cents is non-null, otherwise INSUFFICIENT" }
      - { name: gap_bp, type: integer, source: computed, description: "round_half_up(product.own_price_cents * 10000 / latest_effective_price_cents); null when data_status == INSUFFICIENT" }
      - { name: gap_stale, type: boolean, source: computed, default: false, description: "true when abs(gap_bp - 10000) > MATCH_DRIFT_ALERT_BP after an own-price change; cleared when a fresh observation is posted" }

  - name: PriceObservation
    parent: null
    common_fields: true
    fields:
      - { name: link_id, type: string, source: input, description: "FK -> CompetitorProductLink.id; the matched pair this price was collected for" }
      - { name: observed_price_cents, type: integer, source: input, description: "Competitor price as collected", constraints: "> 0" }
      - { name: collection_method, type: enum, source: input, description: "ONLINE | STORE_AUDIT — must be compatible with the competitor's collection_method" }
      - { name: observed_at, type: datetime, source: input, description: "Instant the price was observed; drives TTL and dedup windows" }
      - { name: in_stock, type: boolean, source: input, default: true, description: "Out-of-stock observations never qualify as an effective competitor price" }
      - { name: promo_flag, type: boolean, source: input, default: false, description: "Marks a temporary promotional price" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | VOIDED" }
      - { name: void_reason, type: string, source: system, description: "Reason recorded on ACTIVE -> VOIDED; null while ACTIVE" }

  - name: PriceIndexReport
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: category_code, type: string, source: input, description: "Merchandise category the basket is drawn from; the literal '*' means every category in the market" }
      - { name: basis, type: enum, source: input, description: "MATCHED_BASKET | IMPUTED_FULL_CATALOG — the two index variants of calculations.price_index" }
      - { name: index_bp, type: integer, source: computed, description: "Weighted price index in basis points; null when data_sufficiency == INSUFFICIENT" }
      - { name: candidate_product_count, type: integer, source: computed, default: 0, description: "ACTIVE products in (market_id, category_code) — the basket universe" }
      - { name: matched_product_count, type: integer, source: computed, default: 0, description: "Candidates with a qualifying effective competitor price" }
      - { name: imputed_product_count, type: integer, source: computed, default: 0, description: "Candidates whose ratio was imputed from the category median (always 0 when basis == MATCHED_BASKET)" }
      - { name: excluded_product_count, type: integer, source: computed, default: 0, description: "candidate_product_count - matched_product_count - imputed_product_count" }
      - { name: data_sufficiency, type: enum, source: computed, description: "SUFFICIENT when matched_product_count >= 1, otherwise INSUFFICIENT" }
      - { name: positioning_gap_bp, type: integer, source: computed, description: "index_bp - market.strategic_index_target_bp; null when index_bp is null" }
      - { name: positioning_verdict, type: enum, source: computed, description: "ON_TARGET | ABOVE_TARGET | BELOW_TARGET | INDETERMINATE (when index_bp is null)" }
      - { name: perception_survey_index_bp, type: integer, source: input, description: "Shopper price-perception survey index for this market/category from price perception research; null when no study accompanies the report" }
      - { name: perception_validation, type: enum, source: computed, description: "CONFIRMS | CONTRADICTS | INDETERMINATE — validates the index strategy against perception research (see calculations.perception_validation)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PUBLISHED | SUPERSEDED" }
      - { name: published_at, type: datetime, source: computed, description: "Logical-clock instant of the DRAFT -> PUBLISHED transition; null while DRAFT" }

  - name: RepricingRule
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: category_code, type: string, source: input, description: "Category this rule governs; the literal '*' matches every category" }
      - { name: target_position_bp, type: integer, source: input, description: "Desired own price as basis points of the competitor benchmark (9700 = 3% below benchmark)", constraints: "5000..15000" }
      - { name: max_change_pct, type: number, source: input, description: "Largest single-step move as a fraction of the current own price", constraints: "0 < x <= 1" }
      - { name: change_frequency_limit_days, type: integer, source: input, description: "Minimum whole days between EXECUTED automated changes on the same product", constraints: ">= 0" }
      - { name: priority, type: integer, source: input, description: "Selector rank; higher wins", constraints: ">= 0" }
      - { name: brand_exclusions, type: array, source: input, default: [], description: "Brand names this rule refuses to reprice" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | PAUSED — accepted at creation and mutated by PATCH /repricing-rules/{id}/status" }
      - { name: applied_order_count, type: integer, source: computed, default: 0, description: "Number of PriceChangeOrder rows with rule_id == this.id that reached EXECUTED" }

  - name: PriceChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product being repriced" }
      - { name: market_id, type: string, source: computed, description: "FK -> Market.id; copied from product.market_id at creation" }
      - { name: rule_id, type: string, source: computed, description: "FK -> RepricingRule.id; the rule selected by calculations.repricing_rule_selection. Null when origin != AUTOMATED_RULE" }
      - { name: source_claim_id, type: string, source: computed, description: "FK -> PriceMatchClaim.id; set only on orders synthesized by the claim-honor cascade. Null otherwise" }
      - { name: signage_store_id, type: string, source: input, description: "FK -> Store.id; the store whose shelf label must be reprinted when this order is approved. Null means no shelf label is needed and signage_status stays NOT_REQUIRED for the order's whole life. The claim-honor cascade sets it to claim.store_id" }
      - { name: supersedes_order_id, type: string, source: input, description: "FK -> PriceChangeOrder.id; the non-terminal order this one replaces. Null when nothing is superseded" }
      - { name: label_batch_id, type: string, source: computed, description: "FK -> LabelPrintBatch.id; the batch this order's shelf label is queued into. Null when signage_status IN {NOT_REQUIRED, RELEASED} or no batch was eligible" }
      - { name: origin, type: enum, source: input, description: "AUTOMATED_RULE | MANUAL | PRICE_MATCH — PRICE_MATCH is producible only by the claim-honor cascade, never by direct request" }
      - { name: requested_price_cents, type: integer, source: input, description: "Operator-specified price; required when origin == MANUAL, forbidden otherwise", constraints: "> 0" }
      - { name: benchmark_price_cents, type: integer, source: computed, description: "Competitor benchmark chosen by calculations.repricing_benchmark_selection; null for MANUAL and PRICE_MATCH origins" }
      - { name: target_price_cents, type: integer, source: computed, description: "Step 1 of calculations.repricing_proposal before any clamp" }
      - { name: banded_price_cents, type: integer, source: computed, description: "Step 2 of calculations.repricing_proposal — target clamped into the max_change_pct band" }
      - { name: effective_floor_cents, type: integer, source: computed, description: "Snapshot of product.effective_floor_cents at creation time" }
      - { name: proposed_price_cents, type: integer, source: computed, description: "Step 3 of calculations.repricing_proposal — the price that will be written to product.own_price_cents on EXECUTED" }
      - { name: floor_binding, type: boolean, source: computed, default: false, description: "true when proposed_price_cents == effective_floor_cents and banded_price_cents < effective_floor_cents" }
      - { name: band_breach, type: boolean, source: computed, default: false, description: "true when proposed_price_cents falls outside the max_change_pct band because the floor clamp ran last" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of this order's price-effective window" }
      - { name: effective_until, type: datetime, source: input, description: "Exclusive end of the window; null means open-ended" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PENDING_APPROVAL | APPROVED | EXECUTED | SUSPENDED | SUPERSEDED" }
      - { name: signage_status, type: enum, source: system, default: "NOT_REQUIRED", description: "NOT_REQUIRED | QUEUED | PRINTED | RELEASED — a second, independent dimension that advances without changing status" }
      - { name: authored_by_user_id, type: string, source: system, description: "X-User-ID of the caller that created the order; compared against the decider for segregation of duties" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the PricingManager that approved or rejected the order; null while DRAFT" }

  - name: PriceMatchPolicy
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: eligible_competitor_tiers, type: array, source: input, description: "Competitor tiers a claim may cite, e.g. [\"PRIMARY\"]", constraints: "non-empty subset of {PRIMARY, SECONDARY}" }
      - { name: excluded_category_codes, type: array, source: input, default: [], description: "Categories the price match programme does not cover" }
      - { name: verification_required, type: boolean, source: input, default: true, description: "When true a claim must pass SUBMITTED -> VERIFYING -> VERIFIED before it can be honored" }
      - { name: max_match_discount_pct, type: number, source: input, default: 0.25, description: "Largest honored discount as a fraction of product.own_price_cents", constraints: "0 < x <= 1" }
      - { name: daily_override_budget_cents, type: integer, source: input, description: "Per-store, per-UTC-day ceiling on honored price-match discounts", constraints: ">= 0" }
      - { name: claim_window_hours, type: integer, source: input, default: 168, description: "How old claimed_observed_at may be, measured against the logical clock", constraints: "> 0" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | SUSPENDED — accepted at creation and also set to SUSPENDED by the FROZEN-posture cascade" }
      - { name: honored_claim_count, type: integer, source: computed, default: 0, description: "Count of PriceMatchClaim rows with policy_id == this.id and status == HONORED" }

  - name: PriceMatchClaim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> PriceMatchPolicy.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: competitor_id, type: string, source: input, description: "FK -> Competitor.id" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; must equal the acting StoreAssociate/StoreManager X-User-ID" }
      - { name: verification_link_id, type: string, source: computed, description: "FK -> CompetitorProductLink.id; the CONFIRMED link resolved for (product_id, competitor_id) at creation. Null when none exists" }
      - { name: claimed_price_cents, type: integer, source: input, description: "Competitor price the shopper claims", constraints: "> 0" }
      - { name: claimed_observed_at, type: datetime, source: input, description: "When the shopper saw the competitor price" }
      - { name: competitor_evidence_ref, type: string, source: input, description: "Receipt/screenshot reference supporting the claim; null when not supplied" }
      - { name: beat_bonus_cents, type: integer, source: computed, default: 0, description: "Beat-the-price bonus from calculations.price_match_honored_price" }
      - { name: honored_price_cents, type: integer, source: computed, description: "Price the shopper would pay if honored; computed at creation and frozen thereafter" }
      - { name: discount_cents, type: integer, source: computed, description: "product.own_price_cents - honored_price_cents at creation time" }
      - { name: required_approval_tier, type: enum, source: computed, description: "ASSOCIATE when discount_cents <= store.override_authority_cents, otherwise MANAGER" }
      - { name: evidence_round, type: integer, source: computed, default: 0, description: "Number of completed NEEDS_EVIDENCE -> VERIFYING loops" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | VERIFYING | NEEDS_EVIDENCE | VERIFIED | REJECTED | HONORED | REVERSED" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on VERIFYING -> REJECTED; null otherwise" }
      - { name: reversal_reason, type: string, source: system, description: "Reason recorded on HONORED -> REVERSED; null otherwise" }

  - name: LabelPrintBatch
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store whose label printer this batch occupies" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the printer occupation window" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive end of the printer occupation window", constraints: "> window_start" }
      - { name: reserved_item_count, type: integer, source: input, description: "Label slots reserved up front for planned reprints", constraints: ">= 0" }
      - { name: queued_order_ids, type: array, source: computed, default: [], description: "Ids of PriceChangeOrder rows whose shelf labels are queued in this batch, in queue-insertion order (order.created_at ASC). Not a foreign key: reverse lookup is served by GET /pricing/change-orders?label_batch_id" }
      - { name: item_count, type: integer, source: computed, description: "reserved_item_count + length(queued_order_ids)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | PRINTING | COMPLETED | CANCELLED" }
      - { name: cancel_reason, type: string, source: system, description: "Reason recorded on the transition into CANCELLED; null otherwise" }

  - name: OverrideLog
    parent: null
    common_fields: false          # append-only audit row: only id and created_at
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> PriceMatchClaim.id" }
      - { name: direction, type: enum, source: system, description: "DEBIT (written by HONORED) | CREDIT (written by REVERSED) — the ledger sign against the store's daily override budget" }
      - { name: approval_tier, type: enum, source: system, description: "ASSOCIATE | MANAGER — the tier that authorized the override" }
      - { name: approved_by_role, type: string, source: system, description: "X-User-Role of the caller that authorized the override" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the caller that authorized the override" }
      - { name: approved_discount_cents, type: integer, source: system, description: "Absolute discount amount recorded on this ledger row" }
      - { name: honored_price_cents, type: integer, source: system, description: "Snapshot of claim.honored_price_cents at authorization time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Competitor
  - entity: Competitor
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /pricing/competitors/{id}/status with to_status=SUSPENDED"
        actor: [PlatformAdmin, ComplianceOfficer]
        preconditions:
          - "competitor.status == ACTIVE"
        side_effects:
          - "sets competitor.suspension_reason = request.reason (null when omitted)"
          - "every CompetitorProductLink with competitor_id == competitor.id and status == CONFIRMED moves to UNDER_REVIEW and increments review_round by 1"
          - "every PriceObservation with link_id in those links and status == ACTIVE moves to VOIDED with void_reason = 'COMPETITOR_SUSPENDED'"
          - "each affected link recomputes latest_effective_price_cents / selected_observation_id / data_status / gap_bp; links left with zero ACTIVE observations become data_status = INSUFFICIENT with null latest_effective_price_cents and null gap_bp"
          - "competitor.confirmed_match_count, stale_match_count and stale_share_bp recomputed"
        note: "Same cascade body as the drift auto-suspend below; only the trigger differs."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — drift auto-suspend fired from the PriceChangeOrder APPROVED -> EXECUTED cascade when stale_share_bp >= COMPETITOR_STALE_SHARE_LIMIT_BP"
        actor: system
        preconditions:
          - "competitor.status == ACTIVE"
          - "competitor.confirmed_match_count >= 1"
          - "competitor.stale_share_bp >= 5000 (COMPETITOR_STALE_SHARE_LIMIT_BP)"
        side_effects:
          - "sets competitor.suspension_reason = 'MATCH_DRIFT_AUTO_SUSPEND'"
          - "every CompetitorProductLink with competitor_id == competitor.id and status == CONFIRMED moves to UNDER_REVIEW and increments review_round by 1"
          - "every PriceObservation with link_id in those links and status == ACTIVE moves to VOIDED with void_reason = 'COMPETITOR_SUSPENDED'"
          - "each affected link recomputes to data_status = INSUFFICIENT, latest_effective_price_cents = null, selected_observation_id = null, gap_bp = null, gap_stale = false"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /pricing/competitors/{id}/status with to_status=ACTIVE"
        actor: [PlatformAdmin, ComplianceOfficer]
        preconditions:
          - "competitor.status == SUSPENDED"
        side_effects:
          - "clears competitor.suspension_reason"
          - "links remain UNDER_REVIEW — reinstatement does not auto-confirm matches"

      - from: ACTIVE
        to: RETIRED
        trigger: "PATCH /pricing/competitors/{id}/status with to_status=RETIRED"
        actor: [PlatformAdmin, ComplianceOfficer]
        preconditions:
          - "competitor.status == ACTIVE"
        side_effects:
          - "every CompetitorProductLink with competitor_id == competitor.id and status IN {PROPOSED, UNDER_REVIEW, CONFIRMED} moves to REJECTED"
          - "every ACTIVE PriceObservation on those links moves to VOIDED with void_reason = 'COMPETITOR_RETIRED'"

      - from: SUSPENDED
        to: RETIRED
        trigger: "PATCH /pricing/competitors/{id}/status with to_status=RETIRED"
        actor: [PlatformAdmin, ComplianceOfficer]
        preconditions:
          - "competitor.status == SUSPENDED"
        side_effects:
          - "every CompetitorProductLink with competitor_id == competitor.id and status IN {PROPOSED, UNDER_REVIEW, CONFIRMED} moves to REJECTED"

  # ------------------------------------------------ CompetitorProductLink (cyclic)
  - entity: CompetitorProductLink
    initial_state: PROPOSED
    terminal_states: [REJECTED]
    transitions:
      - from: PROPOSED
        to: UNDER_REVIEW
        trigger: "POST /pricing/matches/{id}/review with decision=OPEN_REVIEW"
        actor: PricingManager
        preconditions:
          - "link.status == PROPOSED"
          - "link.review_round < 3 (MAX_MATCH_REVIEW_ROUNDS)"
        side_effects:
          - "no score change; confidence_bp and match_grade are unchanged"

      - from: UNDER_REVIEW
        to: PROPOSED
        trigger: "POST /pricing/matches/{id}/revise"
        actor: PricingAnalyst
        preconditions:
          - "link.status == UNDER_REVIEW"
          - "link.review_round < 3 (MAX_MATCH_REVIEW_ROUNDS)"
        side_effects:
          - "overwrites any supplied score / match_method / competitor_identifier field"
          - "increments link.review_round by 1"
          - "recomputes confidence_bp, confidence_variant and match_grade via calculations.match_confidence_score"
        note: "The revision cycle. review_round is the loop counter; the fourth entry attempt is rejected with ERR_MAX_REVIEW_ROUNDS."

      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /pricing/matches/{id}/review with decision=CONFIRM"
        actor: PricingManager
        preconditions:
          - "link.status == PROPOSED"
          - "product.status == ACTIVE (cross-entity guard)"
          - "competitor.status == ACTIVE (cross-entity guard)"
          - "link.match_grade == EXACT, i.e. link.confidence_bp >= 8500 (GRADE_EXACT_MIN_BP)"
        side_effects:
          - "increments competitor.confirmed_match_count by 1 and recomputes competitor.stale_share_bp"
          - "recomputes link.latest_effective_price_cents / selected_observation_id / data_status / gap_bp from ACTIVE observations"

      - from: UNDER_REVIEW
        to: CONFIRMED
        trigger: "POST /pricing/matches/{id}/review with decision=CONFIRM"
        actor: PricingManager
        preconditions:
          - "link.status == UNDER_REVIEW"
          - "product.status == ACTIVE (cross-entity guard)"
          - "competitor.status == ACTIVE (cross-entity guard)"
          - "link.confidence_bp >= 6000 (GRADE_CLOSE_MIN_BP) — a reviewed CLOSE match may be confirmed by hand"
        side_effects:
          - "increments competitor.confirmed_match_count by 1 and recomputes competitor.stale_share_bp"
          - "recomputes link.latest_effective_price_cents / selected_observation_id / data_status / gap_bp from ACTIVE observations"
        note: "Confirming straight from PROPOSED demands EXACT; confirming after review only demands CLOSE. This is the branch asymmetry the review loop buys."

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /pricing/matches/{id}/review with decision=REJECT"
        actor: PricingManager
        preconditions:
          - "link.status == PROPOSED"
        side_effects:
          - "every ACTIVE PriceObservation on this link moves to VOIDED with void_reason = 'LINK_REJECTED'"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /pricing/matches/{id}/review with decision=REJECT"
        actor: PricingManager
        preconditions:
          - "link.status == UNDER_REVIEW"
        side_effects:
          - "every ACTIVE PriceObservation on this link moves to VOIDED with void_reason = 'LINK_REJECTED'"

      - from: CONFIRMED
        to: UNDER_REVIEW
        trigger: "system — competitor ACTIVE -> SUSPENDED cascade (either trigger)"
        actor: system
        preconditions:
          - "link.status == CONFIRMED"
        side_effects:
          - "increments link.review_round by 1"
          - "decrements competitor.confirmed_match_count by 1"
          - "voids the link's ACTIVE observations, driving data_status to INSUFFICIENT"

  # --------------------------------------------------------- PriceObservation
  - entity: PriceObservation
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /pricing/observations/{id}/void"
        actor: [DataCollector, PricingAnalyst]
        preconditions:
          - "observation.status == ACTIVE"
        side_effects:
          - "sets observation.void_reason = request.void_reason"
          - "the parent CompetitorProductLink recomputes latest_effective_price_cents / selected_observation_id / data_status / gap_bp / gap_stale via calculations.effective_competitor_price"
          - "when the link is left with zero qualifying observations it becomes data_status = INSUFFICIENT with null latest_effective_price_cents and null gap_bp, and its competitor recomputes stale_match_count and stale_share_bp"

      - from: ACTIVE
        to: VOIDED
        trigger: "system — competitor suspension/retirement cascade, or link REJECTED cascade"
        actor: system
        preconditions:
          - "observation.status == ACTIVE"
        side_effects:
          - "sets observation.void_reason to 'COMPETITOR_SUSPENDED', 'COMPETITOR_RETIRED' or 'LINK_REJECTED' according to the originating transition"

  # ------------------------------------------------------- PriceIndexReport
  - entity: PriceIndexReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /pricing/index-reports/{id}/publish"
        actor: PricingManager
        preconditions:
          - "report.status == DRAFT"
          - "report.data_sufficiency == SUFFICIENT"
        side_effects:
          - "sets report.published_at = logical clock now"
          - "any other PriceIndexReport with the same (market_id, category_code, basis) and status == PUBLISHED moves to SUPERSEDED"
          - "market.observed_index_bp / positioning_gap_bp / insufficient_data_report_count / pricing_posture recomputed via calculations.market_posture_evaluation; increments Market.version by 1"
          - "when the recomputed pricing_posture == FROZEN: every PriceChangeOrder in this market with status IN {DRAFT, PENDING_APPROVAL, APPROVED} moves to SUSPENDED, and every ACTIVE PriceMatchPolicy in this market moves to SUSPENDED"
          - "each order suspended by the previous effect whose signage_status == QUEUED moves signage_status to RELEASED, clears label_batch_id, and is removed from its LabelPrintBatch.queued_order_ids (batch.item_count decreases by 1)"
          - "each store that lost a queued order recomputes label_slots_used_today and label_slots_remaining_today"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system — a newer report for the same (market_id, category_code, basis) is published"
        actor: system
        preconditions:
          - "report.status == PUBLISHED"
        side_effects:
          - "the superseded report stops governing market.observed_index_bp"

  # ------------------------------------------- PriceChangeOrder (status dimension)
  - entity: PriceChangeOrder
    initial_state: DRAFT
    terminal_states: [EXECUTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /pricing/change-orders/{id}/submit"
        actor: [PricingAnalyst, PricingManager]
        preconditions:
          - "order.status == DRAFT"
          - "market.pricing_posture IN {OPEN, RESTRICTED} (cross-entity guard)"
        side_effects:
          - "no price recomputation — proposed_price_cents was frozen at creation"

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /pricing/change-orders/{id}/decide with decision=APPROVE"
        actor: PricingManager
        preconditions:
          - "order.status == PENDING_APPROVAL"
          - "X-User-ID != order.authored_by_user_id (segregation of duties)"
          - "market.pricing_posture IN {OPEN, RESTRICTED} (cross-entity guard)"
        side_effects:
          - "sets order.decided_by_user_id = X-User-ID"
          - "sets order.signage_status = QUEUED when order.signage_store_id is non-null; when it is null signage_status stays NOT_REQUIRED and no batch is selected"
          - "selects a LabelPrintBatch via calculations.label_batch_selection; on a hit appends order.id to batch.queued_order_ids, recomputes batch.item_count, sets order.label_batch_id, and recomputes store.label_slots_used_today / label_slots_remaining_today"
          - "on an empty candidate pool order.label_batch_id stays null and signage_status stays QUEUED (awaiting a batch)"

      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /pricing/change-orders/{id}/decide with decision=REJECT"
        actor: PricingManager
        preconditions:
          - "order.status == PENDING_APPROVAL"
          - "X-User-ID != order.authored_by_user_id (segregation of duties)"
        side_effects:
          - "sets order.decided_by_user_id = X-User-ID"
          - "signage_status stays NOT_REQUIRED — nothing was ever queued"
        note: "The revert edge: rejection returns the order to DRAFT so it can be resubmitted, it is not terminal."

      - from: APPROVED
        to: EXECUTED
        trigger: "POST /pricing/change-orders/{id}/execute"
        actor: PricingManager
        preconditions:
          - "order.status == APPROVED"
          - "market.pricing_posture == OPEN (cross-entity guard — RESTRICTED is enough to approve but not to execute)"
          - "logical clock now >= order.effective_from"
          - "when order.origin == AUTOMATED_RULE: product.last_price_change_at is null OR (clock now - product.last_price_change_at) >= rule.change_frequency_limit_days whole days"
        side_effects:
          - "L1: product.own_price_cents = order.proposed_price_cents; product.last_price_change_at = clock now; product.price_change_count += 1; product.effective_floor_cents recomputed; increments Product.version by 1"
          - "L2: caused by L1 — every CompetitorProductLink with product_id == order.product_id and status == CONFIRMED recomputes gap_bp; each link whose abs(gap_bp - 10000) > 1200 (MATCH_DRIFT_ALERT_BP) sets gap_stale = true"
          - "L3: caused by L2 — every competitor owning a link that just set gap_stale recomputes stale_match_count and stale_share_bp; a competitor whose stale_share_bp >= 5000 and whose status == ACTIVE takes the drift auto-suspend transition to SUSPENDED"
          - "L4: caused by L3 — for each competitor auto-suspended, every CONFIRMED link on it moves to UNDER_REVIEW (review_round += 1) and every ACTIVE PriceObservation on those links moves to VOIDED with void_reason = 'COMPETITOR_SUSPENDED'"
          - "L5: caused by L4 — each link left with zero qualifying observations becomes data_status = INSUFFICIENT with latest_effective_price_cents = null, selected_observation_id = null, gap_bp = null and gap_stale = false"
          - "rule.applied_order_count += 1 when order.rule_id is non-null"
        note: "The depth-5 execution cascade. Each link is caused by the preceding link, not by the execute call itself."

      - from: DRAFT
        to: SUSPENDED
        trigger: "system — market pricing_posture recomputed to FROZEN on report publish"
        actor: system
        preconditions:
          - "order.status == DRAFT"
          - "market.pricing_posture == FROZEN"
        side_effects:
          - "signage_status unchanged (still NOT_REQUIRED)"

      - from: PENDING_APPROVAL
        to: SUSPENDED
        trigger: "system — market pricing_posture recomputed to FROZEN on report publish"
        actor: system
        preconditions:
          - "order.status == PENDING_APPROVAL"
          - "market.pricing_posture == FROZEN"
        side_effects:
          - "signage_status unchanged (still NOT_REQUIRED)"

      - from: APPROVED
        to: SUSPENDED
        trigger: "system — market pricing_posture recomputed to FROZEN on report publish, or the source claim is reversed"
        actor: system
        preconditions:
          - "order.status == APPROVED"
        side_effects:
          - "when signage_status == QUEUED it moves to RELEASED, label_batch_id is cleared, the order id is removed from batch.queued_order_ids, batch.item_count decreases by 1, and the store recomputes label_slots_used_today / label_slots_remaining_today"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /pricing/change-orders with supersedes_order_id == this order's id"
        actor: [PricingAnalyst, PricingManager]
        preconditions:
          - "order.status IN {DRAFT, PENDING_APPROVAL, APPROVED, SUSPENDED}"
          - "the new order references the same product_id"
        side_effects:
          - "when signage_status == QUEUED it moves to RELEASED and the label slot is returned exactly as in the APPROVED -> SUSPENDED transition"

      - from: PENDING_APPROVAL
        to: SUPERSEDED
        trigger: "POST /pricing/change-orders with supersedes_order_id == this order's id"
        actor: [PricingAnalyst, PricingManager]
        preconditions:
          - "order.status IN {DRAFT, PENDING_APPROVAL, APPROVED, SUSPENDED}"
        side_effects:
          - "no signage change"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /pricing/change-orders with supersedes_order_id == this order's id"
        actor: [PricingAnalyst, PricingManager]
        preconditions:
          - "order.status IN {DRAFT, PENDING_APPROVAL, APPROVED, SUSPENDED}"
        side_effects:
          - "when signage_status == QUEUED it moves to RELEASED, label_batch_id is cleared, batch.item_count decreases by 1, and the store's label slot counters are recomputed"

      - from: SUSPENDED
        to: DRAFT
        trigger: "system — market pricing_posture recomputed to OPEN or RESTRICTED on a later report publish"
        actor: system
        preconditions:
          - "order.status == SUSPENDED"
          - "market.pricing_posture IN {OPEN, RESTRICTED}"
        side_effects:
          - "signage_status stays RELEASED; re-approval re-queues the label"

  # -------------------------------- PriceChangeOrder (signage_status dimension)
  - entity: PriceChangeOrder
    initial_state: NOT_REQUIRED
    terminal_states: []
    transitions:
      - from: NOT_REQUIRED
        to: QUEUED
        trigger: "POST /pricing/change-orders/{id}/decide with decision=APPROVE, or the claim-honor cascade creating a PRICE_MATCH order"
        actor: [PricingManager, system]
        preconditions:
          - "order.signage_status == NOT_REQUIRED"
          - "order.signage_store_id is non-null"
        side_effects:
          - "label batch selection as described in the status dimension"
        note: "Parallel dimension: signage_status advances on approval while order.status advances independently; an EXECUTED order may still be QUEUED."

      - from: QUEUED
        to: PRINTED
        trigger: "POST /pricing/label-batches/{id}/advance with to_status=COMPLETED"
        actor: [StoreManager, PricingManager]
        preconditions:
          - "order.signage_status == QUEUED"
          - "order.label_batch_id == the advancing batch id"
        side_effects:
          - "order.status is NOT changed by this transition — the two dimensions are independent"

      - from: QUEUED
        to: RELEASED
        trigger: "system — order suspended/superseded, or POST /pricing/label-batches/{id}/cancel"
        actor: system
        preconditions:
          - "order.signage_status == QUEUED"
        side_effects:
          - "clears order.label_batch_id, removes the order id from batch.queued_order_ids, decrements batch.item_count by 1, recomputes store.label_slots_used_today and label_slots_remaining_today"

      - from: RELEASED
        to: QUEUED
        trigger: "POST /pricing/change-orders/{id}/decide with decision=APPROVE after the order returned to DRAFT and was resubmitted"
        actor: PricingManager
        preconditions:
          - "order.signage_status == RELEASED"
          - "order.status == PENDING_APPROVAL"
        side_effects:
          - "label batch selection re-runs and the slot is consumed again"

  # ------------------------------------------- PriceMatchClaim (branching + cyclic)
  - entity: PriceMatchClaim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: VERIFYING
        trigger: "POST /pricing/claims/{id}/verify"
        actor: [StoreManager, ComplianceOfficer]
        preconditions:
          - "claim.status == SUBMITTED"
          - "when the caller role is StoreManager, X-User-ID == claim.store_id"
          - "policy.status == ACTIVE (cross-entity guard)"
        side_effects:
          - "overwrites claim.competitor_evidence_ref when the request supplies one"

      - from: VERIFYING
        to: NEEDS_EVIDENCE
        trigger: "POST /pricing/claims/{id}/decide with decision=NEEDS_EVIDENCE"
        actor: [StoreManager, ComplianceOfficer]
        preconditions:
          - "claim.status == VERIFYING"
          - "claim.evidence_round < 2 (MAX_CLAIM_EVIDENCE_ROUNDS)"
        side_effects:
          - "no ledger movement; honored_price_cents stays frozen at its creation value"

      - from: NEEDS_EVIDENCE
        to: VERIFYING
        trigger: "POST /pricing/claims/{id}/verify with competitor_evidence_ref"
        actor: [StoreManager, ComplianceOfficer]
        preconditions:
          - "claim.status == NEEDS_EVIDENCE"
          - "request.competitor_evidence_ref is present and non-empty"
          - "claim.evidence_round < 2 (MAX_CLAIM_EVIDENCE_ROUNDS)"
        side_effects:
          - "increments claim.evidence_round by 1"
          - "overwrites claim.competitor_evidence_ref"
        note: "The evidence cycle. The third entry attempt is rejected with ERR_MAX_EVIDENCE_ROUNDS."

      - from: VERIFYING
        to: VERIFIED
        trigger: "POST /pricing/claims/{id}/decide with decision=VERIFIED"
        actor: [StoreManager, ComplianceOfficer]
        preconditions:
          - "claim.status == VERIFYING"
          - "competitor.status == ACTIVE AND competitor.price_match_eligible == true (cross-entity guard)"
          - "competitor.tier IN policy.eligible_competitor_tiers"
          - "claim.verification_link_id is non-null (a CONFIRMED CompetitorProductLink exists for the pair)"
        side_effects:
          - "no ledger movement"

      - from: VERIFYING
        to: REJECTED
        trigger: "POST /pricing/claims/{id}/decide with decision=REJECTED"
        actor: [StoreManager, ComplianceOfficer]
        preconditions:
          - "claim.status == VERIFYING"
        side_effects:
          - "sets claim.rejection_reason = request.rejection_reason"

      - from: VERIFIED
        to: HONORED
        trigger: "POST /pricing/claims/{id}/honor"
        actor: [StoreAssociate, StoreManager]
        preconditions:
          - "claim.status == VERIFIED"
          - "X-User-ID == claim.store_id (both honoring roles are store-scoped)"
          - "market.pricing_posture != FROZEN (cross-entity guard)"
          - "when claim.required_approval_tier == MANAGER the caller role must be StoreManager"
          - "store.override_budget_used_cents + claim.discount_cents <= policy.daily_override_budget_cents"
        side_effects:
          - "L1: appends an OverrideLog with direction = DEBIT, approval_tier = claim.required_approval_tier, approved_discount_cents = claim.discount_cents, honored_price_cents = claim.honored_price_cents; store.override_budget_used_cents and override_budget_remaining_cents recomputed; policy.honored_claim_count += 1"
          - "L2: caused by L1 — a PriceChangeOrder is synthesized with origin = PRICE_MATCH, source_claim_id = claim.id, product_id = claim.product_id, proposed_price_cents = claim.honored_price_cents, signage_store_id = claim.store_id, effective_from = clock now, effective_until = null, status = APPROVED, signage_status = QUEUED; increments Product.version by 1"
          - "L3: caused by L2 — the synthesized order runs calculations.label_batch_selection; on a hit its id is appended to batch.queued_order_ids, batch.item_count is recomputed, order.label_batch_id is set, and store.label_slots_used_today / label_slots_remaining_today are recomputed"
        note: "The depth-3 honor cascade. L2 fires because the ledger row was written, L3 fires because the order became APPROVED."

      - from: HONORED
        to: REVERSED
        trigger: "POST /pricing/claims/{id}/reverse"
        actor: [StoreManager, ComplianceOfficer]
        preconditions:
          - "claim.status == HONORED"
          - "when the caller role is StoreManager, X-User-ID == claim.store_id"
        side_effects:
          - "sets claim.reversal_reason = request.reversal_reason"
          - "appends a compensating OverrideLog with direction = CREDIT and approved_discount_cents = claim.discount_cents; store.override_budget_used_cents returns to its pre-honor value and override_budget_remaining_cents with it; policy.honored_claim_count -= 1"
          - "the PriceChangeOrder with source_claim_id == claim.id moves APPROVED -> SUSPENDED, which releases its queued label slot (signage_status QUEUED -> RELEASED)"

  # ---------------------------------------------------------- LabelPrintBatch
  - entity: LabelPrintBatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PRINTING
        trigger: "POST /pricing/label-batches/{id}/advance with to_status=PRINTING"
        actor: [StoreManager, PricingManager]
        preconditions:
          - "batch.status == SCHEDULED"
          - "when the caller role is StoreManager, X-User-ID == batch.store_id"
          - "logical clock now >= batch.window_start"
        side_effects:
          - "queued orders keep signage_status = QUEUED"

      - from: PRINTING
        to: COMPLETED
        trigger: "POST /pricing/label-batches/{id}/advance with to_status=COMPLETED"
        actor: [StoreManager, PricingManager]
        preconditions:
          - "batch.status == PRINTING"
          - "when the caller role is StoreManager, X-User-ID == batch.store_id"
        side_effects:
          - "every PriceChangeOrder id in batch.queued_order_ids whose signage_status == QUEUED moves signage_status to PRINTED; order.status is untouched"
          - "the batch keeps occupying its slots — store.label_slots_used_today does not change"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pricing/label-batches/{id}/cancel"
        actor: [StoreManager, PricingManager]
        preconditions:
          - "batch.status == SCHEDULED"
          - "when the caller role is StoreManager, X-User-ID == batch.store_id"
        side_effects:
          - "sets batch.cancel_reason = request.cancel_reason"
          - "every order in batch.queued_order_ids moves signage_status QUEUED -> RELEASED and has label_batch_id cleared"
          - "batch.queued_order_ids becomes empty and batch.item_count becomes 0"
          - "store.label_slots_used_today and label_slots_remaining_today recomputed — a CANCELLED batch contributes nothing"

      - from: PRINTING
        to: CANCELLED
        trigger: "POST /pricing/label-batches/{id}/cancel"
        actor: [StoreManager, PricingManager]
        preconditions:
          - "batch.status == PRINTING"
          - "when the caller role is StoreManager, X-User-ID == batch.store_id"
        side_effects:
          - "identical release + slot restoration as the SCHEDULED -> CANCELLED edge"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: change-order-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /pricing/change-orders"
    occ_field: "expected_product_version"
    description: |
      Creating a PriceChangeOrder against a Product whose version has advanced
      since the client last read it is rejected. This captures the case where an
      earlier writer already created (or executed) an order on the same product —
      an act that legitimately supersedes the prior order under the
      DRAFT/PENDING_APPROVAL/APPROVED -> SUPERSEDED transition — so the current
      writer's view of own_price_cents, effective_floor_cents and
      last_price_change_at is stale and the price it would propose was derived
      from numbers that no longer hold.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: index-report-create-stale-market
    parent_entity: Market
    write_endpoint: "POST /pricing/index-reports"
    occ_field: "expected_market_version"
    description: |
      Creating a PriceIndexReport against a Market whose version has advanced
      since the client last read it is rejected. An earlier report creation or
      publish has already moved observed_index_bp, positioning_gap_bp or
      pricing_posture, so the strategic-positioning comparison the caller
      intended would be computed against a superseded market baseline.
    error_id: ERR_STALE_MARKET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: match_confidence_score
    trigger: "POST /pricing/matches (creation) and the CompetitorProductLink UNDER_REVIEW -> PROPOSED revise transition"
    algorithm: weighted_scoring
    formula: |
      # All three scores are integers 0..100, so the weighted blend below is exact:
      #   round_half_up(100 * (0.55*i + 0.30*a + 0.15*g)) == 55*i + 30*a + 15*g
      blend_bp = round_half_up(100 * (CONF_W_IDENTIFIER * identifier_score
                                    + CONF_W_ATTRIBUTE  * attribute_score
                                    + CONF_W_IMAGE      * image_score))

      if match_method == "IDENTIFIER" and identifier_score >= IDENTIFIER_ANCHOR_MIN_SCORE:
          confidence_variant = "IDENTIFIER_ANCHORED"
          anchored_bp   = identifier_score * 100 + IDENTIFIER_ANCHOR_BONUS_BP
          confidence_bp = min(10000, max(anchored_bp, blend_bp))
      else:
          confidence_variant = "ATTRIBUTE_BLEND"
          if image_score < LOW_IMAGE_SCORE_THRESHOLD:
              confidence_bp = min(blend_bp, LOW_IMAGE_CONFIDENCE_CEILING_BP)
          else:
              confidence_bp = min(10000, blend_bp)

      match_grade = "EXACT" if confidence_bp >= GRADE_EXACT_MIN_BP
                    else ("CLOSE" if confidence_bp >= GRADE_CLOSE_MIN_BP else "WEAK")
    input_set: "The three scores plus match_method on the single link being created or revised. No other entity participates."
    constants:
      CONF_W_IDENTIFIER: 0.55
      CONF_W_ATTRIBUTE: 0.30
      CONF_W_IMAGE: 0.15
      IDENTIFIER_ANCHOR_MIN_SCORE: 90
      IDENTIFIER_ANCHOR_BONUS_BP: 500
      LOW_IMAGE_SCORE_THRESHOLD: 50
      LOW_IMAGE_CONFIDENCE_CEILING_BP: 6000
      GRADE_EXACT_MIN_BP: 8500
      GRADE_CLOSE_MIN_BP: 6000
    precision: "integer basis points, round_half_up, clamped to 0..10000"
    variants:
      - name: IDENTIFIER_ANCHORED
        when: "match_method == IDENTIFIER and identifier_score >= 90"
        difference: "Takes max(identifier-only score, blend) and adds a 500 bp anchor bonus; the attribute and image channels can only raise the result, never lower it, and the low-image ceiling does not apply."
      - name: ATTRIBUTE_BLEND
        when: "match_method IN {ATTRIBUTE, IMAGE}, or match_method == IDENTIFIER with identifier_score < 90"
        difference: "Uses the plain weighted blend and, when image_score < 50, caps the result at 6000 bp. Identical scores of (identifier 92, attribute 40, image 30) yield 9700 bp under IDENTIFIER_ANCHORED and 6000 bp under ATTRIBUTE_BLEND."

  - name: effective_competitor_price
    trigger: "POST /pricing/observations, POST /pricing/observations/{id}/void, link CONFIRMED transitions, competitor suspension/retirement cascades"
    algorithm: chronological
    formula: |
      # Selector over the link's observations. All four selector elements pinned.
      candidates = [o for o in PriceObservation
                    if o.link_id == link.id
                    and o.status == "ACTIVE"
                    and o.in_stock == true
                    and o.observed_at <= clock_now
                    and o.observed_at >= clock_now - OBSERVATION_TTL_HOURS hours]
      # ranking: cheapest observed price wins (price-leader benchmarking)
      # tie-break 1: most recent observed_at
      # tie-break 2: earliest created_at
      sort candidates by (observed_price_cents ASC, observed_at DESC, created_at ASC)
      if candidates is empty:
          latest_effective_price_cents = null
          selected_observation_id      = null
          data_status                  = "INSUFFICIENT"
          gap_bp                       = null
          gap_stale                    = false
      else:
          winner = candidates[0]
          latest_effective_price_cents = winner.observed_price_cents
          selected_observation_id      = winner.id
          data_status                  = "SUFFICIENT"
          gap_bp = round_half_up(product.own_price_cents * 10000
                                 / latest_effective_price_cents)
          gap_stale = false      # a fresh qualifying observation always clears the flag
    input_set: "PriceObservation rows for this link with status == ACTIVE and in_stock == true whose observed_at lies in the half-open window (clock_now - 72h, clock_now]. VOIDED and out-of-stock rows never participate."
    constants:
      OBSERVATION_TTL_HOURS: 72
    precision: "integer cents for prices, integer basis points for gap_bp, round_half_up"

  - name: price_index
    trigger: "POST /pricing/index-reports"
    algorithm: tiered_pricing
    formula: |
      # ---- basket universe -------------------------------------------------
      candidates = [p for p in Product
                    if p.market_id == report.market_id
                    and p.status == "ACTIVE"
                    and (report.category_code == "*"
                         or p.category_code == report.category_code)]
      candidate_product_count = len(candidates)

      # ---- per-product benchmark selector (all four elements pinned) -------
      def benchmark(p):
          links = [l for l in CompetitorProductLink
                   if l.product_id == p.id
                   and l.status == "CONFIRMED"
                   and l.data_status == "SUFFICIENT"
                   and l.confidence_bp >= MIN_INDEX_CONFIDENCE_BP
                   and competitor(l).status == "ACTIVE"
                   and competitor(l).tier == "PRIMARY"]
          # ranking: cheapest competitor price; tie-break: earliest link created_at
          sort links by (latest_effective_price_cents ASC, created_at ASC)
          return null if links is empty else links[0].latest_effective_price_cents

      # ---- PINNED ROUNDING ORDER -------------------------------------------
      # Each product's ratio is rounded to an integer basis point FIRST, and the
      # weighted average of those already-rounded ratios is rounded SECOND.
      # Averaging the unrounded ratios and rounding once at the end is a
      # DIFFERENT algorithm and is NOT what this scaffold specifies.
      matched = []
      for p in candidates:
          b = benchmark(p)
          if b is not null:
              matched.append((p, round_half_up(p.own_price_cents * 10000 / b)))
      matched_product_count = len(matched)

      if matched_product_count == 0:
          index_bp = null; data_sufficiency = "INSUFFICIENT"
          imputed_product_count = 0
          excluded_product_count = candidate_product_count
      else:
          data_sufficiency = "SUFFICIENT"
          if report.basis == "MATCHED_BASKET":
              basket = matched
              imputed_product_count = 0
          else:                                  # IMPUTED_FULL_CATALOG
              # median of the matched ratios; even count -> round_half_up of the
              # mean of the two middle values, ordered by ratio ASC then
              # product.created_at ASC
              imputed_ratio_bp = round_half_up(median([r for (_, r) in matched]))
              basket = matched + [(p, imputed_ratio_bp) for p in candidates
                                  if benchmark(p) is null]
              imputed_product_count = candidate_product_count - matched_product_count
          weight_sum = sum(p.index_weight_bp for (p, _) in basket)
          index_bp = round_half_up(sum(r * p.index_weight_bp for (p, r) in basket)
                                   / weight_sum)
          excluded_product_count = (candidate_product_count
                                    - matched_product_count
                                    - imputed_product_count)

      positioning_gap_bp = null if index_bp is null
                           else index_bp - market.strategic_index_target_bp
      positioning_verdict = "INDETERMINATE"                if index_bp is null
                       else "ON_TARGET"    if abs(positioning_gap_bp) <= market.index_tolerance_bp
                       else "ABOVE_TARGET" if positioning_gap_bp > 0
                       else "BELOW_TARGET"
    input_set: "Product rows with status == ACTIVE in (market_id, category_code); their CONFIRMED links with confidence_bp >= 7000 on ACTIVE PRIMARY competitors with data_status == SUFFICIENT. DISCONTINUED products, SECONDARY competitors, links below the confidence floor and INSUFFICIENT links are all excluded from the numerator and the weight denominator."
    constants:
      MIN_INDEX_CONFIDENCE_BP: 7000
    precision: "integer basis points, round_half_up, applied twice: once per product ratio, once on the weighted average"
    variants:
      - name: MATCHED_BASKET
        when: "report.basis == MATCHED_BASKET"
        difference: "Only products with a qualifying benchmark enter both numerator and weight denominator; unmatched products are counted in excluded_product_count and have no effect on index_bp."
      - name: IMPUTED_FULL_CATALOG
        when: "report.basis == IMPUTED_FULL_CATALOG"
        difference: "Unmatched candidates are pulled into the basket at the median matched ratio, so their weights enter the denominator. The same fixture yields 9743 bp under MATCHED_BASKET and 9760 bp under IMPUTED_FULL_CATALOG."

  - name: perception_validation
    trigger: "POST /pricing/index-reports (evaluated immediately after price_index)"
    algorithm: threshold
    formula: |
      if report.perception_survey_index_bp is null or index_bp is null:
          perception_validation = "INDETERMINATE"
      elif abs(report.perception_survey_index_bp - index_bp) <= PERCEPTION_AGREEMENT_BP:
          perception_validation = "CONFIRMS"
      else:
          perception_validation = "CONTRADICTS"
    input_set: "The report's own computed index_bp and the survey index supplied with the request. No other entity participates."
    constants:
      PERCEPTION_AGREEMENT_BP: 200
    precision: "integer basis points; the comparison is inclusive (<=) at exactly 200 bp"

  - name: market_posture_evaluation
    trigger: "POST /pricing/index-reports/{id}/publish"
    algorithm: threshold
    formula: |
      # governing report selector — all four elements pinned
      governing = [r for r in PriceIndexReport
                   if r.market_id == market.id and r.status == "PUBLISHED"]
      # ranking: latest published_at; tie-break: earliest created_at
      sort governing by (published_at DESC, created_at ASC)
      if governing is empty:
          observed_index_bp  = null
          positioning_gap_bp = null
      else:
          observed_index_bp  = governing[0].index_bp
          positioning_gap_bp = observed_index_bp - market.strategic_index_target_bp

      insufficient_data_report_count = count(r for r in PriceIndexReport
                                             if r.market_id == market.id
                                             and r.data_sufficiency == "INSUFFICIENT"
                                             and r.status in {"DRAFT", "PUBLISHED"})

      drift = 0 if positioning_gap_bp is null else abs(positioning_gap_bp)
      if drift > POSTURE_FROZEN_MULTIPLIER * market.index_tolerance_bp:
          pricing_posture = "FROZEN"
      elif drift > POSTURE_RESTRICTED_MULTIPLIER * market.index_tolerance_bp
           or insufficient_data_report_count >= 1:
          pricing_posture = "RESTRICTED"
      else:
          pricing_posture = "OPEN"
    input_set: "PUBLISHED PriceIndexReport rows for the market (any category or basis) for the drift term, plus DRAFT and PUBLISHED reports for the insufficiency term. SUPERSEDED reports are excluded from both."
    constants:
      POSTURE_RESTRICTED_MULTIPLIER: 1
      POSTURE_FROZEN_MULTIPLIER: 2
    precision: "integer basis points; both comparisons are strict (>), so drift exactly equal to index_tolerance_bp keeps the market OPEN and drift exactly equal to twice the tolerance leaves it RESTRICTED"

  - name: repricing_rule_selection
    trigger: "POST /pricing/change-orders with origin == AUTOMATED_RULE"
    algorithm: constraint_propagation
    formula: |
      candidates = [r for r in RepricingRule
                    if r.market_id == product.market_id
                    and r.status == "ACTIVE"
                    and (r.category_code == product.category_code
                         or r.category_code == "*")
                    and product.brand not in r.brand_exclusions]
      # ranking: priority DESC, then specificity DESC (exact category = 1, '*' = 0)
      # tie-break: created_at ASC
      sort candidates by (priority DESC, specificity DESC, created_at ASC)
      if candidates is empty:
          reject with ERR_NO_APPLICABLE_REPRICING_RULE
      rule_id = candidates[0].id
    input_set: "RepricingRule rows in the product's market with status == ACTIVE. PAUSED rules never participate; a rule whose brand_exclusions contains the product's brand is filtered out before ranking."
    constants: {}
    precision: "n/a — selector"

  - name: repricing_benchmark_selection
    trigger: "POST /pricing/change-orders with origin == AUTOMATED_RULE"
    algorithm: chronological
    formula: |
      links = [l for l in CompetitorProductLink
               if l.product_id == product.id
               and l.status == "CONFIRMED"
               and l.data_status == "SUFFICIENT"
               and l.confidence_bp >= MIN_INDEX_CONFIDENCE_BP
               and competitor(l).status == "ACTIVE"
               and competitor(l).tier == "PRIMARY"]
      # ranking: cheapest latest_effective_price_cents; tie-break: link created_at ASC
      sort links by (latest_effective_price_cents ASC, created_at ASC)
      if links is empty:
          reject with ERR_NO_COMPETITOR_BENCHMARK
      benchmark_price_cents = links[0].latest_effective_price_cents
    input_set: "Identical eligibility, ranking and tie-break to the per-product benchmark selector inside price_index, so an automated order and the index report always agree on which competitor price is the benchmark."
    constants:
      MIN_INDEX_CONFIDENCE_BP: 7000
    precision: "integer cents"

  - name: repricing_proposal
    trigger: "POST /pricing/change-orders"
    algorithm: waterfall_allocation
    formula: |
      effective_floor_cents = max(
          ceil(product.unit_cost_cents / (1 - product.margin_floor_pct)),
          product.map_floor_cents)

      # ---- step 1: target -------------------------------------------------
      if origin == "AUTOMATED_RULE":
          target_price_cents = round_half_up(benchmark_price_cents
                                             * rule.target_position_bp / 10000)
          max_step_cents     = floor(product.own_price_cents * rule.max_change_pct)
          band_low           = product.own_price_cents - max_step_cents
          band_high          = product.own_price_cents + max_step_cents
      else:                        # MANUAL and PRICE_MATCH
          target_price_cents = requested_price_cents      # PRICE_MATCH passes claim.honored_price_cents
          band_low, band_high = 0, +infinity              # no frequency band on hand-set prices

      # ---- step 2: clamp into the change band -----------------------------
      banded_price_cents = min(max(target_price_cents, band_low), band_high)

      # ---- step 3: clamp UP to the hard floor (RUNS LAST — PINNED) --------
      proposed_price_cents = max(banded_price_cents, effective_floor_cents)

      floor_binding = (banded_price_cents < effective_floor_cents)
      band_breach   = (proposed_price_cents < band_low
                       or proposed_price_cents > band_high)
    input_set: "The single product, the selected rule (AUTOMATED_RULE only) and the benchmark. Steps 2 and 3 are NOT commutative: with own_price 24999, unit_cost 22000, margin_floor_pct 0.20, map_floor 22999, benchmark 22499, target_position_bp 9700 and max_change_pct 0.10 the pinned order yields 27500 while floor-then-band would yield 27498. Margin and MAP compliance outrank the change-frequency band by construction."
    constants: {}
    precision: "integer cents; round_half_up on the target, floor() on the step size, ceil() on the margin floor"
    variants:
      - name: AUTOMATED_RULE
        when: "origin == AUTOMATED_RULE"
        difference: "Target derives from the competitor benchmark and the rule's target_position_bp, and the step band is finite."
      - name: HAND_SET
        when: "origin IN {MANUAL, PRICE_MATCH}"
        difference: "Target is the requested (or honored) price and the step band is unbounded, so only the floor clamp can move the value."

  - name: price_match_honored_price
    trigger: "POST /pricing/claims"
    algorithm: tiered_pricing
    formula: |
      # The beat-the-price bonus tier LOOKS circular: the tier is a function of
      # the price band, and the honored price is the claimed price minus the
      # bonus. PINNED EVALUATION ORDER: the tier is selected from
      # claimed_price_cents (the pre-bonus value) and never re-derived from
      # honored_price_cents. Re-deriving it is not merely a different answer, it
      # is ill-defined: a claim of 2050 on a product with effective_floor_cents
      # 1500 yields bonus 103 and honored 1947 under the pinned order, while
      # keying the tier on honored_price_cents has NO fixed point (tier 0.05 ->
      # honored 1947, which sits in the 0.00 tier; tier 0.00 -> honored 2050,
      # which sits in the 0.05 tier).
      if   claimed_price_cents <  BEAT_BONUS_TIER1_MAX_CENTS: tier_pct = 0.00
      elif claimed_price_cents <  BEAT_BONUS_TIER2_MAX_CENTS: tier_pct = 0.05
      else:                                                   tier_pct = 0.10

      beat_bonus_cents = min(round_half_up(claimed_price_cents * tier_pct),
                             BEAT_BONUS_CAP_CENTS)
      pre_floor_cents  = claimed_price_cents - beat_bonus_cents
      honored_price_cents = max(pre_floor_cents, product.effective_floor_cents)
      discount_cents      = product.own_price_cents - honored_price_cents
      required_approval_tier = "ASSOCIATE" if discount_cents <= store.override_authority_cents
                               else "MANAGER"
    input_set: "The claim's own claimed_price_cents, the product's own_price_cents and effective_floor_cents, and the store's override_authority_cents, all read at claim creation and frozen on the claim thereafter."
    constants:
      BEAT_BONUS_TIER1_MAX_CENTS: 2000
      BEAT_BONUS_TIER2_MAX_CENTS: 10000
      BEAT_BONUS_CAP_CENTS: 500
    precision: "integer cents, round_half_up on the bonus; the tier comparisons are strict (<) at both breakpoints, so a claim of exactly 10000 lands in the 0.10 tier"

  - name: label_batch_selection
    trigger: "PriceChangeOrder PENDING_APPROVAL -> APPROVED, and the PriceMatchClaim VERIFIED -> HONORED cascade"
    algorithm: waterfall_allocation
    formula: |
      if order.signage_store_id is null:
          order.label_batch_id = null
          order.signage_status = "NOT_REQUIRED"     # no shelf label is needed
          return
      store = Store(order.signage_store_id)
      candidates = [b for b in LabelPrintBatch
                    if b.store_id == order.signage_store_id
                    and b.status == "SCHEDULED"
                    and b.window_end > clock_now
                    and store.label_slots_remaining_today >= 1]
      # ranking: earliest window_start; tie-break: earliest created_at
      sort candidates by (window_start ASC, created_at ASC)
      if candidates is empty:
          order.label_batch_id = null       # fallback: queued but unbatched
          order.signage_status = "QUEUED"
      else:
          batch = candidates[0]
          append order.id to batch.queued_order_ids
          batch.item_count = batch.reserved_item_count + len(batch.queued_order_ids)
          order.label_batch_id = batch.id
          order.signage_status = "QUEUED"
    input_set: "LabelPrintBatch rows for the store named by order.signage_store_id with status == SCHEDULED whose window has not closed. PRINTING, COMPLETED and CANCELLED batches never accept new orders; an exhausted daily slot pool empties the candidate set."
    constants: {}
    precision: "n/a — selector; the empty-pool fallback leaves label_batch_id null and never errors"

  - name: store_override_budget_ledger
    trigger: "PriceMatchClaim VERIFIED -> HONORED and HONORED -> REVERSED"
    algorithm: aggregation
    formula: |
      today = date(clock_now)          # UTC calendar date of the logical clock
      logs  = [g for g in OverrideLog
               if claim(g).store_id == store.id and date(g.created_at) == today]
      override_budget_used_cents =
            sum(g.approved_discount_cents for g in logs if g.direction == "DEBIT")
          - sum(g.approved_discount_cents for g in logs if g.direction == "CREDIT")
      override_budget_remaining_cents =
            policy.daily_override_budget_cents - override_budget_used_cents

      # CONSERVED QUANTITY (invariant, must hold after every honor and reverse):
      #   policy.daily_override_budget_cents
      #     == store.override_budget_used_cents
      #      + store.override_budget_remaining_cents
    input_set: "OverrideLog rows whose claim belongs to this store and whose created_at falls on the logical clock's current UTC date. Rows from earlier dates are excluded; the ledger is append-only, so a reversal writes a CREDIT row rather than mutating the DEBIT row."
    constants: {}
    precision: "integer cents; no rounding"

  - name: store_label_slot_ledger
    trigger: "PriceChangeOrder approval/suspension/supersession, LabelPrintBatch creation, cancellation and advance"
    algorithm: aggregation
    formula: |
      today   = date(clock_now)
      batches = [b for b in LabelPrintBatch
                 if b.store_id == store.id
                 and b.status in {"SCHEDULED", "PRINTING", "COMPLETED"}
                 and date(b.window_start) == today]
      label_slots_used_today      = sum(b.item_count for b in batches)
      label_slots_remaining_today = store.label_printer_capacity_per_day
                                    - label_slots_used_today

      # CONSERVED QUANTITY (invariant, must hold after every batch or signage move):
      #   store.label_printer_capacity_per_day
      #     == store.label_slots_used_today
      #      + store.label_slots_remaining_today
    input_set: "LabelPrintBatch rows for this store whose window_start falls on the logical clock's current UTC date and whose status is SCHEDULED, PRINTING or COMPLETED. CANCELLED batches contribute zero, which is how a cancellation returns slots."
    constants: {}
    precision: "integer slot counts; no rounding"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 15
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 20
    category: existence
    check: "every path id resolves to a live resource, validated left to right"
    error_id: "ERR_MARKET_NOT_FOUND | ERR_COMPETITOR_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_MATCH_NOT_FOUND | ERR_OBSERVATION_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_RULE_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_BATCH_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 25
    category: business_referential
    check: "every foreign key supplied in the body resolves, checked in body-field declaration order (policy_id, product_id, competitor_id, store_id, link_id, market_id, supersedes_order_id)"
    error_id: "ERR_MARKET_NOT_FOUND | ERR_COMPETITOR_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_MATCH_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all POST/PATCH endpoints carrying FK fields"

  - priority: 28
    category: business_constraint
    check: "all required body fields are present with the declared type; numeric constraints (> 0, >= 0, 0..100, 0 <= x < 1) hold"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH endpoints"

  - priority: 30
    category: business_constraint
    check: "every enum-typed body field carries a declared member of that enum"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST/PATCH endpoints with enum inputs"

  - priority: 32
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list GET endpoints"

  - priority: 34
    category: auth
    check: "for StoreAssociate and StoreManager, X-User-ID equals the store_id of the targeted Store, PriceMatchClaim or LabelPrintBatch"
    error_id: ERR_STORE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /pricing/claims, POST /pricing/claims/{id}/verify, POST /pricing/claims/{id}/decide, POST /pricing/claims/{id}/honor, POST /pricing/claims/{id}/reverse, POST /pricing/label-batches, POST /pricing/label-batches/{id}/advance, POST /pricing/label-batches/{id}/cancel"

  - priority: 36
    category: state
    check: "expected_product_version equals the current Product.version"
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: "POST /pricing/change-orders"

  - priority: 36
    category: state
    check: "expected_market_version equals the current Market.version"
    error_id: ERR_STALE_MARKET_VERSION
    http_status: 412
    applies_to: "POST /pricing/index-reports"

  - priority: 40
    category: state
    check: "the target resource is in a state from which the requested transition exists in §1.2 and the transition's own timing preconditions hold (batch window_start reached before PRINTING, order effective_from reached before execution)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (review, revise, void, publish, submit, decide, execute, verify, honor, reverse, advance, cancel, PATCH status)"

  - priority: 45
    category: state
    check: "the market's pricing_posture permits the operation: submit and approve require OPEN or RESTRICTED, execute requires OPEN, honor requires anything but FROZEN"
    error_id: ERR_MARKET_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /pricing/change-orders/{id}/submit, POST /pricing/change-orders/{id}/decide, POST /pricing/change-orders/{id}/execute, POST /pricing/claims/{id}/honor"

  - priority: 50
    category: business_safety
    check: "a price-match claim may not be created when claimed_price_cents < product.map_floor_cents — honoring it would breach the brand's minimum advertised price"
    error_id: ERR_MAP_FLOOR_VIOLATION
    http_status: 422
    applies_to: "POST /pricing/claims"

  - priority: 52
    category: business_safety
    check: "an AUTOMATED_RULE change order may not be created for a product whose brand_repricing_restricted == true"
    error_id: ERR_BRAND_REPRICING_RESTRICTED
    http_status: 422
    applies_to: "POST /pricing/change-orders"

  - priority: 54
    category: business_safety
    check: "the X-User-ID deciding a change order differs from order.authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /pricing/change-orders/{id}/decide"

  - priority: 56
    category: business_safety
    check: "a StoreAssociate may not honor a claim whose required_approval_tier == MANAGER"
    error_id: ERR_OVERRIDE_AUTHORITY_EXCEEDED
    http_status: 403
    applies_to: "POST /pricing/claims/{id}/honor"

  - priority: 60
    category: business_referential
    check: "the cited competitor has status == ACTIVE, price_match_eligible == true and tier IN policy.eligible_competitor_tiers"
    error_id: ERR_COMPETITOR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /pricing/claims, POST /pricing/claims/{id}/decide"

  - priority: 61
    category: business_referential
    check: "the product's category_code is not listed in policy.excluded_category_codes"
    error_id: ERR_CATEGORY_EXCLUDED
    http_status: 422
    applies_to: "POST /pricing/claims"

  - priority: 62
    category: business_referential
    check: "claim.verification_link_id (resolved once at claim creation) is non-null, so the claim can be verified against collected data"
    error_id: ERR_NO_CONFIRMED_MATCH
    http_status: 422
    applies_to: "POST /pricing/claims/{id}/decide with decision=VERIFIED"

  - priority: 63
    category: business_referential
    check: "the competitor referenced by a match belongs to the same market_id as the product; a claim's store, product, competitor and policy all share one market_id; a change order's signage_store_id names a Store in the product's market"
    error_id: ERR_MARKET_MISMATCH
    http_status: 422
    applies_to: "POST /pricing/matches, POST /pricing/claims, POST /pricing/change-orders"

  - priority: 64
    category: business_constraint
    check: "an AUTOMATED_RULE order resolves at least one applicable RepricingRule"
    error_id: ERR_NO_APPLICABLE_REPRICING_RULE
    http_status: 422
    applies_to: "POST /pricing/change-orders"

  - priority: 65
    category: business_constraint
    check: "an AUTOMATED_RULE order resolves a competitor benchmark from at least one qualifying CONFIRMED link"
    error_id: ERR_NO_COMPETITOR_BENCHMARK
    http_status: 422
    applies_to: "POST /pricing/change-orders"

  - priority: 66
    category: business_constraint
    check: "uniqueness: (market_id, competitor_code), (market_id, sku), (market_id, store_code), and at most one non-REJECTED CompetitorProductLink per (product_id, competitor_id)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /pricing/competitors, POST /pricing/products, POST /pricing/stores, POST /pricing/matches"

  - priority: 68
    category: business_constraint
    check: "link.review_round < 3 before entering another review or revise loop"
    error_id: ERR_MAX_REVIEW_ROUNDS
    http_status: 409
    applies_to: "POST /pricing/matches/{id}/review, POST /pricing/matches/{id}/revise"

  - priority: 68
    category: business_constraint
    check: "claim.evidence_round < 2 before entering another evidence loop"
    error_id: ERR_MAX_EVIDENCE_ROUNDS
    http_status: 409
    applies_to: "POST /pricing/claims/{id}/verify, POST /pricing/claims/{id}/decide with decision=NEEDS_EVIDENCE"

  - priority: 69
    category: business_constraint
    check: "confirming a PROPOSED link requires confidence_bp >= 8500; confirming an UNDER_REVIEW link requires confidence_bp >= 6000"
    error_id: ERR_CONFIDENCE_BELOW_CONFIRM_THRESHOLD
    http_status: 422
    applies_to: "POST /pricing/matches/{id}/review with decision=CONFIRM"

  - priority: 70
    category: business_constraint
    check: "publishing requires report.data_sufficiency == SUFFICIENT"
    error_id: ERR_INSUFFICIENT_INDEX_DATA
    http_status: 422
    applies_to: "POST /pricing/index-reports/{id}/publish"

  - priority: 72
    category: business_temporal
    check: "for an AUTOMATED_RULE order, whole days between product.last_price_change_at and the logical clock must be >= rule.change_frequency_limit_days"
    error_id: ERR_CHANGE_FREQUENCY_LIMIT
    http_status: 409
    applies_to: "POST /pricing/change-orders/{id}/execute"

  - priority: 74
    category: business_temporal
    check: "half-open window semantics on Product: the new order's [effective_from, effective_until) must not intersect the window of any other order on the same product_id with status IN {DRAFT, PENDING_APPROVAL, APPROVED, EXECUTED}. Touching endpoints (previous.effective_until == new.effective_from) do NOT collide; a null effective_until occupies everything from effective_from onward"
    error_id: ERR_EFFECTIVE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /pricing/change-orders"

  - priority: 76
    category: business_temporal
    check: "buffered closed-interval semantics on Store: for every other LabelPrintBatch of the same store with status IN {SCHEDULED, PRINTING, COMPLETED}, the new batch must satisfy new.window_start >= other.window_end + 45 minutes OR new.window_end <= other.window_start - 45 minutes. Touching or merely non-overlapping-but-close windows DO collide"
    error_id: ERR_PRINT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /pricing/label-batches"

  - priority: 77
    category: business_temporal
    check: "aggregate daily capacity on Store: label_slots_used_today + new batch reserved_item_count <= store.label_printer_capacity_per_day"
    error_id: ERR_PRINT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /pricing/label-batches"

  - priority: 78
    category: business_temporal
    check: "point-proximity semantics on CompetitorProductLink: no other ACTIVE observation on the same (link_id, collection_method) may lie strictly within 60 minutes (OBSERVATION_PROXIMITY_MINUTES) of the new observed_at; a separation of exactly 60 minutes is accepted"
    error_id: ERR_DUPLICATE_OBSERVATION_WINDOW
    http_status: 409
    applies_to: "POST /pricing/observations"

  - priority: 79
    category: business_temporal
    check: "observed_at must not be in the future relative to the logical clock, and claimed_observed_at must satisfy clock_now - claimed_observed_at <= policy.claim_window_hours"
    error_id: "ERR_OBSERVATION_IN_FUTURE | ERR_CLAIM_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "POST /pricing/observations, POST /pricing/claims"

  - priority: 80
    category: business_fiscal
    check: "a claim must actually save the shopper money: product.own_price_cents > honored_price_cents, i.e. discount_cents >= 1"
    error_id: ERR_CLAIM_NO_SAVINGS
    http_status: 422
    applies_to: "POST /pricing/claims"

  - priority: 82
    category: business_fiscal
    check: "discount_cents <= round_half_up(product.own_price_cents * policy.max_match_discount_pct)"
    error_id: ERR_MATCH_DISCOUNT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /pricing/claims"

  - priority: 86
    category: business_fiscal
    check: "store.override_budget_used_cents + claim.discount_cents <= policy.daily_override_budget_cents (inclusive at exact equality)"
    error_id: ERR_OVERRIDE_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /pricing/claims/{id}/honor"

  - priority: 88
    category: business_fiscal
    check: "a MANUAL order's requested_price_cents must be present, and an AUTOMATED_RULE or PRICE_MATCH order must not carry one"
    error_id: ERR_REQUESTED_PRICE_MISMATCH
    http_status: 422
    applies_to: "POST /pricing/change-orders"

# =============================================================================
# §1.5 API Endpoint Table   (api_prefix = /pricing)
# =============================================================================
endpoints:

  # ------------------------------------------------- reference data (Market)
  - method: POST
    path: "/pricing/markets"
    description: "Define a market with its strategic positioning target"
    roles: [PlatformAdmin]
    code: 201
    input: [market_code, name, strategic_positioning, strategic_index_target_bp, "currency_code?", "index_tolerance_bp?"]
    output: Market
    side_effects: ["pricing_posture initialised to OPEN", "observed_index_bp and positioning_gap_bp initialised to null", "version starts at 1"]

  - method: GET
    path: "/pricing/markets/{id}"
    description: "Read one market including its derived posture and index fields"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: Market
    side_effects: []

  - method: GET
    path: "/pricing/markets"
    description: "List markets"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["strategic_positioning?", "pricing_posture?", "limit?", "offset?"]
    output: Market[]
    side_effects: []

  # ------------------------------------------------------------- Competitor
  - method: POST
    path: "/pricing/competitors"
    description: "Add a competitor to a market's competitor set with its collection method"
    roles: [PlatformAdmin]
    code: 201
    input: [market_id, competitor_code, name, collection_method, tier, "price_match_eligible?"]
    output: Competitor
    side_effects: ["status initialised to ACTIVE", "confirmed_match_count / stale_match_count / stale_share_bp initialised to 0"]

  - method: PATCH
    path: "/pricing/competitors/{id}/status"
    description: "Suspend, reinstate or retire a competitor; suspension and retirement cascade into matches and observations"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [to_status, "reason?"]
    output: Competitor
    side_effects: ["CONFIRMED links move to UNDER_REVIEW (suspend) or REJECTED (retire)", "ACTIVE observations on affected links move to VOIDED", "affected links recompute data_status / latest_effective_price_cents / gap_bp"]

  - method: GET
    path: "/pricing/competitors/{id}"
    description: "Read one competitor"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: Competitor
    side_effects: []

  - method: GET
    path: "/pricing/competitors"
    description: "List competitors, filterable by market (FK reverse lookup for Competitor.market_id)"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["market_id?", "status?", "tier?", "collection_method?", "limit?", "offset?"]
    output: Competitor[]
    side_effects: []

  # ---------------------------------------------------------------- Product
  - method: POST
    path: "/pricing/products"
    description: "Create a per-market catalog row with its cost, margin floor and MAP floor"
    roles: [PlatformAdmin]
    code: 201
    input: [market_id, sku, category_code, brand, own_price_cents, unit_cost_cents, "margin_floor_pct?", "map_floor_cents?", "brand_repricing_restricted?", "index_weight_bp?", "status?"]
    output: Product
    side_effects: ["effective_floor_cents computed from unit_cost_cents, margin_floor_pct and map_floor_cents", "price_change_count initialised to 0 and last_price_change_at to null"]

  - method: GET
    path: "/pricing/products/{id}"
    description: "Read one product including effective_floor_cents and version"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/pricing/products"
    description: "List products, filterable by market (FK reverse lookup for Product.market_id)"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["market_id?", "category_code?", "brand?", "status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # ------------------------------------------------------------------ Store
  - method: POST
    path: "/pricing/stores"
    description: "Create a store with its associate override authority and daily label printer capacity"
    roles: [PlatformAdmin]
    code: 201
    input: [market_id, store_code, override_authority_cents, label_printer_capacity_per_day]
    output: Store
    side_effects: ["label_slots_used_today initialised to 0 and label_slots_remaining_today to label_printer_capacity_per_day", "override_budget_used_cents initialised to 0"]

  - method: GET
    path: "/pricing/stores/{id}"
    description: "Read one store including its live slot and override-budget ledgers"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: GET
    path: "/pricing/stores"
    description: "List stores, filterable by market (FK reverse lookup for Store.market_id)"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["market_id?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  # ------------------------------------------------ CompetitorProductLink
  - method: POST
    path: "/pricing/matches"
    description: "Propose a product-to-competitor match from identifier, attribute and image evidence"
    roles: [PricingAnalyst]
    code: 201
    input: [product_id, competitor_id, match_method, identifier_score, attribute_score, image_score, "competitor_identifier?"]
    output: CompetitorProductLink
    side_effects: ["confidence_bp, confidence_variant and match_grade computed via calculations.match_confidence_score", "status initialised to PROPOSED and review_round to 0", "data_status initialised to INSUFFICIENT"]

  - method: POST
    path: "/pricing/matches/{id}/review"
    description: "Open a review, confirm or reject a proposed match"
    roles: [PricingManager]
    code: 200
    input: [decision, "note?"]
    output: CompetitorProductLink
    side_effects: ["OPEN_REVIEW moves PROPOSED -> UNDER_REVIEW", "CONFIRM increments competitor.confirmed_match_count and recomputes the link's effective competitor price", "REJECT voids the link's ACTIVE observations"]

  - method: POST
    path: "/pricing/matches/{id}/revise"
    description: "Revise the scores of an under-review match, returning it to PROPOSED (revision loop)"
    roles: [PricingAnalyst]
    code: 200
    input: ["identifier_score?", "attribute_score?", "image_score?", "match_method?", "competitor_identifier?"]
    output: CompetitorProductLink
    side_effects: ["review_round incremented by 1", "confidence_bp, confidence_variant and match_grade recomputed"]

  - method: GET
    path: "/pricing/matches/{id}"
    description: "Read one match with its confidence scoring and drift fields"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: CompetitorProductLink
    side_effects: []

  - method: GET
    path: "/pricing/matches"
    description: "List matches, filterable by product or competitor (FK reverse lookup for both link FKs)"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["product_id?", "competitor_id?", "status?", "match_grade?", "min_confidence_bp?", "limit?", "offset?"]
    output: CompetitorProductLink[]
    side_effects: []

  # -------------------------------------------------------- PriceObservation
  - method: POST
    path: "/pricing/observations"
    description: "Record a collected competitor price for a matched pair"
    roles: [DataCollector]
    code: 201
    input: [link_id, observed_price_cents, collection_method, observed_at, "in_stock?", "promo_flag?"]
    output: PriceObservation
    side_effects: ["the parent link recomputes latest_effective_price_cents, selected_observation_id, data_status, gap_bp and clears gap_stale", "status initialised to ACTIVE"]

  - method: POST
    path: "/pricing/observations/{id}/void"
    description: "Void a collected observation, e.g. a mis-scraped or superseded price"
    roles: [DataCollector, PricingAnalyst]
    code: 200
    input: [void_reason]
    output: PriceObservation
    side_effects: ["parent link recomputes its effective competitor price; a link left with no qualifying observation becomes data_status = INSUFFICIENT", "the link's competitor recomputes stale_match_count and stale_share_bp"]

  - method: GET
    path: "/pricing/observations/{id}"
    description: "Read one observation"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: PriceObservation
    side_effects: []

  - method: GET
    path: "/pricing/observations"
    description: "List observations, filterable by link (FK reverse lookup for PriceObservation.link_id)"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["link_id?", "status?", "collection_method?", "limit?", "offset?"]
    output: PriceObservation[]
    side_effects: []

  # ------------------------------------------------------- PriceIndexReport
  - method: POST
    path: "/pricing/index-reports"
    description: "Compute a price index report for a market and category under one of the two basis variants; optionally attach a price-perception survey index for validation"
    roles: [PricingAnalyst]
    code: 201
    input: [market_id, category_code, basis, expected_market_version, "perception_survey_index_bp?"]
    output: PriceIndexReport
    side_effects: ["index_bp and all basket counts computed via calculations.price_index", "perception_validation computed", "increments Market.version by 1", "status initialised to DRAFT"]

  - method: POST
    path: "/pricing/index-reports/{id}/publish"
    description: "Publish a draft report, making it the governing index for its market and recomputing market posture"
    roles: [PricingManager]
    code: 200
    input: []
    output: PriceIndexReport
    side_effects: ["prior PUBLISHED report for the same (market_id, category_code, basis) moves to SUPERSEDED", "market.observed_index_bp / positioning_gap_bp / insufficient_data_report_count / pricing_posture recomputed; increments Market.version by 1", "a FROZEN posture suspends DRAFT/PENDING_APPROVAL/APPROVED orders and ACTIVE policies in the market and releases their queued labels"]

  - method: GET
    path: "/pricing/index-reports/{id}"
    description: "Read one index report"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: PriceIndexReport
    side_effects: []

  - method: GET
    path: "/pricing/index-reports"
    description: "List index reports, filterable by market (FK reverse lookup for PriceIndexReport.market_id)"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["market_id?", "category_code?", "basis?", "status?", "data_sufficiency?", "limit?", "offset?"]
    output: PriceIndexReport[]
    side_effects: []

  # ---------------------------------------------------------- RepricingRule
  - method: POST
    path: "/pricing/repricing-rules"
    description: "Create an automated repricing rule with its positioning target, step limit, frequency limit and brand exclusions"
    roles: [PricingManager]
    code: 201
    input: [market_id, category_code, target_position_bp, max_change_pct, change_frequency_limit_days, priority, "brand_exclusions?", "status?"]
    output: RepricingRule
    side_effects: ["applied_order_count initialised to 0"]

  - method: PATCH
    path: "/pricing/repricing-rules/{id}/status"
    description: "Pause or resume an automated repricing rule"
    roles: [PricingManager]
    code: 200
    input: [to_status]
    output: RepricingRule
    side_effects: ["a PAUSED rule is removed from the calculations.repricing_rule_selection candidate set"]

  - method: GET
    path: "/pricing/repricing-rules/{id}"
    description: "Read one repricing rule"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: RepricingRule
    side_effects: []

  - method: GET
    path: "/pricing/repricing-rules"
    description: "List repricing rules, filterable by market (FK reverse lookup for RepricingRule.market_id)"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["market_id?", "category_code?", "status?", "limit?", "offset?"]
    output: RepricingRule[]
    side_effects: []

  # -------------------------------------------------------- PriceChangeOrder
  - method: POST
    path: "/pricing/change-orders"
    description: "Create a price change order. origin accepts AUTOMATED_RULE or MANUAL only; PRICE_MATCH orders are synthesized exclusively by the claim-honor cascade. Guarded by OCC on the product's version"
    roles: [PricingAnalyst, PricingManager]
    code: 201
    input: [product_id, origin, effective_from, expected_product_version, "requested_price_cents?", "effective_until?", "supersedes_order_id?", "signage_store_id?"]
    output: PriceChangeOrder
    side_effects: ["rule and benchmark selected for AUTOMATED_RULE origin", "target_price_cents / banded_price_cents / effective_floor_cents / proposed_price_cents / floor_binding / band_breach computed via calculations.repricing_proposal", "the order named by supersedes_order_id moves to SUPERSEDED and releases any queued label", "increments Product.version by 1", "authored_by_user_id set from X-User-ID; status DRAFT, signage_status NOT_REQUIRED"]

  - method: POST
    path: "/pricing/change-orders/{id}/submit"
    description: "Submit a draft order for approval"
    roles: [PricingAnalyst, PricingManager]
    code: 200
    input: []
    output: PriceChangeOrder
    side_effects: ["status DRAFT -> PENDING_APPROVAL"]

  - method: POST
    path: "/pricing/change-orders/{id}/decide"
    description: "Approve or reject a submitted order; the author may not decide their own order"
    roles: [PricingManager]
    code: 200
    input: [decision, "note?"]
    output: PriceChangeOrder
    side_effects: ["APPROVE sets signage_status = QUEUED and runs calculations.label_batch_selection, consuming a store label slot", "REJECT returns the order to DRAFT", "decided_by_user_id set from X-User-ID"]

  - method: POST
    path: "/pricing/change-orders/{id}/execute"
    description: "Execute an approved order across channels: writes the new own price and triggers the depth-5 drift cascade"
    roles: [PricingManager]
    code: 200
    input: []
    output: PriceChangeOrder
    side_effects: ["product.own_price_cents / last_price_change_at / price_change_count / effective_floor_cents updated; Product.version incremented by 1", "CONFIRMED links recompute gap_bp and may set gap_stale", "competitors over the stale-share limit auto-suspend, sending their CONFIRMED links to UNDER_REVIEW and voiding their ACTIVE observations", "affected links fall to data_status = INSUFFICIENT", "rule.applied_order_count incremented when rule_id is set"]

  - method: GET
    path: "/pricing/change-orders/{id}"
    description: "Read one change order including both status dimensions"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: PriceChangeOrder
    side_effects: []

  - method: GET
    path: "/pricing/change-orders"
    description: "List change orders; the filtered-list FK reverse lookup for product_id, market_id, rule_id, source_claim_id, supersedes_order_id, label_batch_id and signage_store_id"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["product_id?", "market_id?", "rule_id?", "source_claim_id?", "supersedes_order_id?", "label_batch_id?", "signage_store_id?", "status?", "signage_status?", "origin?", "limit?", "offset?"]
    output: PriceChangeOrder[]
    side_effects: []

  # -------------------------------------------------------- PriceMatchPolicy
  - method: POST
    path: "/pricing/match-policies"
    description: "Administer a market's price match policy: eligible competitor tiers, category exclusions, verification requirement, discount cap and the per-store daily override budget"
    roles: [PricingManager, ComplianceOfficer]
    code: 201
    input: [market_id, eligible_competitor_tiers, daily_override_budget_cents, "excluded_category_codes?", "verification_required?", "max_match_discount_pct?", "claim_window_hours?", "status?"]
    output: PriceMatchPolicy
    side_effects: ["honored_claim_count initialised to 0"]

  - method: GET
    path: "/pricing/match-policies/{id}"
    description: "Read one price match policy"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: PriceMatchPolicy
    side_effects: []

  - method: GET
    path: "/pricing/match-policies"
    description: "List price match policies, filterable by market (FK reverse lookup for PriceMatchPolicy.market_id)"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["market_id?", "status?", "limit?", "offset?"]
    output: PriceMatchPolicy[]
    side_effects: []

  # ---------------------------------------------------------- PriceMatchClaim
  - method: POST
    path: "/pricing/claims"
    description: "A store associate files a price match claim against a competitor price; honored price, discount and approval tier are computed and frozen at creation"
    roles: [StoreAssociate, StoreManager]
    code: 201
    input: [policy_id, product_id, competitor_id, store_id, claimed_price_cents, claimed_observed_at, "competitor_evidence_ref?"]
    output: PriceMatchClaim
    side_effects: ["verification_link_id resolved to the CONFIRMED link for (product_id, competitor_id) or null", "beat_bonus_cents / honored_price_cents / discount_cents / required_approval_tier computed via calculations.price_match_honored_price", "status initialised to SUBMITTED and evidence_round to 0"]

  - method: POST
    path: "/pricing/claims/{id}/verify"
    description: "Start or restart verification of a claim (SUBMITTED -> VERIFYING, or NEEDS_EVIDENCE -> VERIFYING once fresh evidence is attached)"
    roles: [StoreManager, ComplianceOfficer]
    code: 200
    input: ["competitor_evidence_ref?"]
    output: PriceMatchClaim
    side_effects: ["a NEEDS_EVIDENCE -> VERIFYING loop increments evidence_round by 1"]

  - method: POST
    path: "/pricing/claims/{id}/decide"
    description: "Close verification: mark the claim VERIFIED, REJECTED, or send it back for more evidence"
    roles: [StoreManager, ComplianceOfficer]
    code: 200
    input: [decision, "reason?"]
    output: PriceMatchClaim
    side_effects: ["REJECTED records rejection_reason", "NEEDS_EVIDENCE parks the claim awaiting fresh evidence"]

  - method: POST
    path: "/pricing/claims/{id}/honor"
    description: "Honor a claim at the register: debits the store's daily override budget, writes the audit row and synthesizes the PRICE_MATCH change order that reprints the shelf label"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: []
    output: PriceMatchClaim
    side_effects: ["appends a DEBIT OverrideLog row for discount_cents and increments store.override_budget_used_cents", "creates a PRICE_MATCH PriceChangeOrder in APPROVED status at honored_price_cents and increments Product.version by 1", "runs calculations.label_batch_selection for that order, setting signage_status = QUEUED and consuming a store label slot", "increments policy.honored_claim_count by 1"]

  - method: POST
    path: "/pricing/claims/{id}/reverse"
    description: "Reverse an honored claim (fraudulent evidence, returned goods); every side effect of the honor is compensated"
    roles: [StoreManager, ComplianceOfficer]
    code: 200
    input: [reversal_reason]
    output: PriceMatchClaim
    side_effects: ["appends a CREDIT OverrideLog row for the same discount_cents and decrements store.override_budget_used_cents back", "the spawned PRICE_MATCH order moves to SUPERSEDED, releasing its queued label and returning the store label slot", "decrements policy.honored_claim_count by 1"]

  - method: GET
    path: "/pricing/claims/{id}"
    description: "Read one price match claim"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: PriceMatchClaim
    side_effects: []

  - method: GET
    path: "/pricing/claims"
    description: "List claims; the filtered-list FK reverse lookup for policy_id, product_id, competitor_id, store_id and verification_link_id"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["policy_id?", "product_id?", "competitor_id?", "store_id?", "verification_link_id?", "status?", "required_approval_tier?", "limit?", "offset?"]
    output: PriceMatchClaim[]
    side_effects: []

  - method: GET
    path: "/pricing/claims/{id}/override-logs"
    description: "Read the append-only override ledger rows written for one claim, in created_at ASC order (FK reverse lookup for OverrideLog.claim_id)"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["direction?", "limit?", "offset?"]
    output: OverrideLog[]
    side_effects: []

  # ---------------------------------------------------------- LabelPrintBatch
  - method: POST
    path: "/pricing/label-batches"
    description: "Reserve a shelf-label printing window on a store's printer"
    roles: [StoreManager, PricingManager]
    code: 201
    input: [store_id, window_start, window_end, "reserved_item_count?"]
    output: LabelPrintBatch
    side_effects: ["reserved_item_count label slots consumed from the store's daily capacity", "status initialised to SCHEDULED and queued_order_ids to an empty list"]

  - method: POST
    path: "/pricing/label-batches/{id}/advance"
    description: "Advance a batch to PRINTING or COMPLETED; completion releases the queued orders' signage"
    roles: [StoreManager, PricingManager]
    code: 200
    input: [to_status]
    output: LabelPrintBatch
    side_effects: ["COMPLETED moves every queued order's signage_status from PRINTED to RELEASED"]

  - method: POST
    path: "/pricing/label-batches/{id}/cancel"
    description: "Cancel a batch that has not started printing, returning its slots and un-queueing its labels"
    roles: [StoreManager, PricingManager]
    code: 200
    input: [cancel_reason]
    output: LabelPrintBatch
    side_effects: ["all reserved and queued slots returned to the store's daily capacity", "each queued order's signage_status returns to NOT_REQUIRED and its label_batch_id is cleared"]

  - method: GET
    path: "/pricing/label-batches/{id}"
    description: "Read one label print batch including its queued order ids and item_count"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: []
    output: LabelPrintBatch
    side_effects: []

  - method: GET
    path: "/pricing/label-batches"
    description: "List label print batches, filterable by store (FK reverse lookup for LabelPrintBatch.store_id)"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: LabelPrintBatch[]
    side_effects: []

  # ------------------------------------------------------------ logical clock
  - method: POST
    path: "/pricing/_clock/set_current_utc"
    description: "Test-driving endpoint: set the service's logical current UTC instant. The clock starts at the mandatory default 2026-08-01T00:00:00Z on every fresh service start, and every temporal rule (observation TTL, claim_window_hours, change_frequency_limit_days, order effective windows, per-UTC-day label and override ledgers) reads this clock rather than wall time"
    roles: [PlatformAdmin, PricingAnalyst, PricingManager, ComplianceOfficer, DataCollector, StoreAssociate, StoreManager]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["no business state is recomputed; subsequent requests evaluate temporal rules against the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization -----------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming an unknown role"
  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "The caller's X-User-Role is not listed in the §1.5 roles for the requested endpoint"
  - id: ERR_STORE_SCOPE_VIOLATION
    http: 403
    condition: "A StoreAssociate or StoreManager acts on a claim, label batch or store whose store_id differs from the caller's X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID deciding a price change order equals the order's authored_by_user_id"

  # --- request shape ----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "A required body field is absent or null, or a numeric/temporal field violates its declared constraint (non-positive price, window_end <= window_start, negative capacity)"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "An enum-typed body field carries a value outside its declared set (collection_method, match_method, decision, to_status, basis, strategic_positioning, direction)"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit <= 0, limit > 100, or offset < 0 on a list endpoint"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A uniqueness key is already taken: market_code, (market_id, competitor_code), (market_id, sku), (market_id, store_code), (product_id, competitor_id) for a non-REJECTED link, or a second ACTIVE PriceMatchPolicy for one market"
  - id: ERR_REQUESTED_PRICE_MISMATCH
    http: 422
    condition: "A MANUAL change order omits requested_price_cents, or an AUTOMATED_RULE order supplies one"

  # --- existence --------------------------------------------------------------
  - id: ERR_MARKET_NOT_FOUND
    http: 404
    condition: "market_id, or the market reached through a parent, does not resolve"
  - id: ERR_COMPETITOR_NOT_FOUND
    http: 404
    condition: "competitor_id does not resolve, or /pricing/competitors/{id} names an unknown competitor"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id does not resolve, or /pricing/products/{id} names an unknown product"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "store_id does not resolve, or /pricing/stores/{id} names an unknown store"
  - id: ERR_MATCH_NOT_FOUND
    http: 404
    condition: "link_id, verification target, or /pricing/matches/{id} names an unknown competitor-product link"
  - id: ERR_OBSERVATION_NOT_FOUND
    http: 404
    condition: "/pricing/observations/{id} names an unknown price observation"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "/pricing/index-reports/{id} names an unknown price index report"
  - id: ERR_RULE_NOT_FOUND
    http: 404
    condition: "rule_id or /pricing/repricing-rules/{id} names an unknown repricing rule"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "supersedes_order_id or /pricing/change-orders/{id} names an unknown price change order"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy_id or /pricing/match-policies/{id} names an unknown price match policy"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "/pricing/claims/{id} (or its sub-resources) names an unknown price match claim"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "label_batch_id or /pricing/label-batches/{id} names an unknown label print batch"

  # --- referential coherence --------------------------------------------------
  - id: ERR_MARKET_MISMATCH
    http: 422
    condition: "Two referenced rows belong to different markets: a match whose product and competitor differ in market_id, a claim whose store, product, competitor and policy are not all in one market, or a label batch reserved in a store outside the order's market"
  - id: ERR_NO_CONFIRMED_MATCH
    http: 422
    condition: "A price match claim reaches decide=VERIFIED with verification_link_id == null, i.e. no CONFIRMED CompetitorProductLink existed for (product_id, competitor_id) at the moment the claim was created; the link is resolved once at creation and never re-resolved, so confirming the match afterwards does not rescue an existing claim"

  # --- state guards -----------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared for the row's current state, or one of its non-cross-entity preconditions in §1.2 fails (re-submitting an EXECUTED order, voiding a VOIDED observation, publishing a SUPERSEDED report, advancing a CANCELLED batch, honoring a claim that is not VERIFIED, reversing a claim that is not HONORED, advancing a SCHEDULED batch to PRINTING before its window_start, executing an APPROVED order before its effective_from)"
  - id: ERR_MARKET_POSTURE_BLOCKED
    http: 409
    condition: "The market's pricing_posture forbids the write: FROZEN blocks every change-order create, submit, decide and execute plus every claim honor; RESTRICTED still permits create, submit and decide but blocks execute for every origin"
  - id: ERR_CONFIDENCE_BELOW_CONFIRM_THRESHOLD
    http: 422
    condition: "A CONFIRM review is attempted on a link whose confidence_bp is below the threshold that applies to its current state (8500 from PROPOSED, 6000 from UNDER_REVIEW)"
  - id: ERR_MAX_REVIEW_ROUNDS
    http: 409
    condition: "A match revision would push review_round past the MAX_REVIEW_ROUNDS limit of 3"
  - id: ERR_MAX_EVIDENCE_ROUNDS
    http: 409
    condition: "A NEEDS_EVIDENCE -> VERIFYING loop would push evidence_round past the MAX_EVIDENCE_ROUNDS limit of 2"
  - id: ERR_COMPETITOR_NOT_ELIGIBLE
    http: 422
    condition: "The cited competitor is not ACTIVE, has price_match_eligible false, or its tier is outside the policy's eligible_competitor_tiers"

  # --- data sufficiency -------------------------------------------------------
  - id: ERR_INSUFFICIENT_INDEX_DATA
    http: 422
    condition: "Publishing an index report whose data_sufficiency is INSUFFICIENT, i.e. matched_product_count == 0 so index_bp is null"
  - id: ERR_NO_COMPETITOR_BENCHMARK
    http: 422
    condition: "An AUTOMATED_RULE order's benchmark selection finds no CONFIRMED link with data_status = SUFFICIENT on an ACTIVE PRIMARY competitor"
  - id: ERR_NO_APPLICABLE_REPRICING_RULE
    http: 422
    condition: "No ACTIVE repricing rule matches the product's market and category, or every candidate excludes the product's brand"
  - id: ERR_DUPLICATE_OBSERVATION_WINDOW
    http: 409
    condition: "An ACTIVE observation already exists on the same link with the same collection_method whose observed_at is strictly within 60 minutes (OBSERVATION_PROXIMITY_MINUTES) of the new one; a separation of exactly 60 minutes is accepted"
  - id: ERR_OBSERVATION_IN_FUTURE
    http: 422
    condition: "observed_at, or a claim's claimed_observed_at, is later than the logical current UTC instant"
  - id: ERR_CLAIM_WINDOW_EXPIRED
    http: 422
    condition: "claimed_observed_at is older than the policy's claim_window_hours measured from the logical clock"

  # --- pricing safety and fiscal limits --------------------------------------
  - id: ERR_MAP_FLOOR_VIOLATION
    http: 422
    condition: "A proposed or honored price is below the product's map_floor_cents"
  - id: ERR_BRAND_REPRICING_RESTRICTED
    http: 422
    condition: "An AUTOMATED_RULE order targets a product whose brand_repricing_restricted is true or whose brand appears in the selected rule's brand_exclusions"
  - id: ERR_CHANGE_FREQUENCY_LIMIT
    http: 409
    condition: "Fewer whole days than the selected rule's change_frequency_limit_days have elapsed between product.last_price_change_at and the logical clock"
  - id: ERR_EFFECTIVE_WINDOW_OVERLAP
    http: 409
    condition: "A new order's half-open [effective_from, effective_until) window overlaps a live (DRAFT, PENDING_APPROVAL, APPROVED or EXECUTED) order on the same product; exact adjacency is permitted"
  - id: ERR_CLAIM_NO_SAVINGS
    http: 422
    condition: "The computed honored_price_cents is greater than or equal to the product's own_price_cents, so the claim yields no discount"
  - id: ERR_CATEGORY_EXCLUDED
    http: 422
    condition: "The claimed product's category_code appears in the policy's excluded_category_codes"
  - id: ERR_MATCH_DISCOUNT_CAP_EXCEEDED
    http: 422
    condition: "discount_cents exceeds round_half_up(own_price_cents * max_match_discount_pct)"
  - id: ERR_OVERRIDE_AUTHORITY_EXCEEDED
    http: 403
    condition: "A StoreAssociate honors a claim whose required_approval_tier is MANAGER because discount_cents exceeds the store's override_authority_cents"
  - id: ERR_OVERRIDE_BUDGET_EXCEEDED
    http: 409
    condition: "Honoring the claim would push the store's same-UTC-day override_budget_used_cents past the policy's daily_override_budget_cents; equality is allowed"

  # --- printing capacity ------------------------------------------------------
  - id: ERR_PRINT_WINDOW_CONFLICT
    http: 409
    condition: "A new label batch leaves less than the 45-minute PRINTER_BUFFER_MINUTES of clearance from a SCHEDULED, PRINTING or COMPLETED batch on the same store's printer; a gap of exactly 45 minutes is allowed"
  - id: ERR_PRINT_CAPACITY_EXCEEDED
    http: 409
    condition: "The reservation or label queue-up would push the store's same-UTC-day label_slots_used_today past label_printer_capacity_per_day"

  # --- optimistic concurrency -------------------------------------------------
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version on POST /pricing/change-orders does not equal the product's current version"
  - id: ERR_STALE_MARKET_VERSION
    http: 412
    condition: "expected_market_version on POST /pricing/index-reports does not equal the market's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Sets up reference data: markets, competitor sets, catalog products and stores. Never authors, approves or executes a price change"
    identity: "opaque"
    exclusive_operations:
      - "POST /pricing/markets"
      - "POST /pricing/competitors"
      - "POST /pricing/products"
      - "POST /pricing/stores"
    shared_operations:
      - "PATCH /pricing/competitors/{id}/status (with ComplianceOfficer)"
      - "POST /pricing/_clock/set_current_utc (with every role)"
      - "all GET endpoints"

  - name: PricingAnalyst
    description: "Builds the intelligence layer: proposes product matches, revises match evidence, computes index reports and drafts change orders. Cannot approve its own or anyone's order"
    identity: "opaque"
    exclusive_operations:
      - "POST /pricing/matches"
      - "POST /pricing/matches/{id}/revise"
      - "POST /pricing/index-reports"
    shared_operations:
      - "POST /pricing/change-orders (with PricingManager)"
      - "POST /pricing/change-orders/{id}/submit (with PricingManager)"
      - "POST /pricing/observations/{id}/void (with DataCollector)"
      - "POST /pricing/_clock/set_current_utc (with every role)"
      - "all GET endpoints"

  - name: PricingManager
    description: "Owns pricing authority: confirms matches, publishes index reports, administers repricing rules, and approves and executes change orders. Segregation of duties forbids deciding an order it authored"
    identity: "opaque"
    exclusive_operations:
      - "POST /pricing/matches/{id}/review"
      - "POST /pricing/index-reports/{id}/publish"
      - "POST /pricing/repricing-rules"
      - "PATCH /pricing/repricing-rules/{id}/status"
      - "POST /pricing/change-orders/{id}/decide"
      - "POST /pricing/change-orders/{id}/execute"
    shared_operations:
      - "POST /pricing/change-orders (with PricingAnalyst)"
      - "POST /pricing/change-orders/{id}/submit (with PricingAnalyst)"
      - "POST /pricing/match-policies (with ComplianceOfficer)"
      - "POST /pricing/label-batches, /advance, /cancel (with StoreManager)"
      - "POST /pricing/_clock/set_current_utc (with every role)"
      - "all GET endpoints"

  - name: ComplianceOfficer
    description: "Independent control function: suspends or retires competitors, administers price match policy, adjudicates claim verification and reverses honored claims. Holds no repricing authority"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "PATCH /pricing/competitors/{id}/status (with PlatformAdmin)"
      - "POST /pricing/match-policies (with PricingManager)"
      - "POST /pricing/claims/{id}/verify (with StoreManager)"
      - "POST /pricing/claims/{id}/decide (with StoreManager)"
      - "POST /pricing/claims/{id}/reverse (with StoreManager)"
      - "POST /pricing/_clock/set_current_utc (with every role)"
      - "all GET endpoints"

  - name: DataCollector
    description: "Online scraper or in-store price auditor. Submits and voids raw price observations only; holds no matching, indexing or repricing authority"
    identity: "opaque"
    exclusive_operations:
      - "POST /pricing/observations"
    shared_operations:
      - "POST /pricing/observations/{id}/void (with PricingAnalyst)"
      - "POST /pricing/_clock/set_current_utc (with every role)"
      - "all GET endpoints"

  - name: StoreAssociate
    description: "Front-line register user of the store named by X-User-ID. Files price match claims and honors those within its own override authority tier"
    identity: "entity_backed:Store"
    exclusive_operations: []
    shared_operations:
      - "POST /pricing/claims (with StoreManager, scoped to own store_id)"
      - "POST /pricing/claims/{id}/honor (with StoreManager, ASSOCIATE tier only)"
      - "POST /pricing/_clock/set_current_utc (with every role)"
      - "all GET endpoints"

  - name: StoreManager
    description: "Manager of the store named by X-User-ID. Adds MANAGER-tier honor authority, claim verification, reversal and shelf-label batch scheduling on top of everything a StoreAssociate can do"
    identity: "entity_backed:Store"
    exclusive_operations: []
    shared_operations:
      - "POST /pricing/claims (with StoreAssociate, scoped to own store_id)"
      - "POST /pricing/claims/{id}/honor (with StoreAssociate; the only role that may honor a MANAGER-tier claim)"
      - "POST /pricing/claims/{id}/verify (with ComplianceOfficer)"
      - "POST /pricing/claims/{id}/decide (with ComplianceOfficer)"
      - "POST /pricing/claims/{id}/reverse (with ComplianceOfficer)"
      - "POST /pricing/label-batches, /advance, /cancel (with PricingManager)"
      - "POST /pricing/_clock/set_current_utc (with every role)"
      - "all GET endpoints"
