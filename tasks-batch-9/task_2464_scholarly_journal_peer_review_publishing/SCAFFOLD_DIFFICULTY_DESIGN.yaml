          - state_machines.Manuscript.IN_PRODUCTION_to_PUBLISHED
          - state_machines.APCInvoice.ISSUED_to_WAIVED
          - entities.APCInvoice.fields.status
          - calculations.embargo_end_date_projection
          - errors[ERR_UNPAID_APC_INVOICE]
        distinguishing_aspect: |
          Entity pair (ProductionJob/Manuscript -> APCInvoice): the publication transition is gated
          on the state of a DIFFERENT entity's rows — with the stage gate fully satisfied
          (PROOF_APPROVED, DEPOSIT_CONFIRMED) a freshly issued second APCInvoice in status ISSUED
          still blocks publication with ERR_UNPAID_APC_INVOICE, and the identical call succeeds the
          moment that invoice moves to WAIVED.
