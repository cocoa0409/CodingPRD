  - section: errors
    instances:
      - name: error_envelope_shape_is_uniform_whenever_a_call_is_rejected
        claim_type: error_envelope
        grounds:
          - response_envelope.error
          - errors[ERR_SUPPLIER_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_DUPLICATE_CODE]
          - errors[ERR_STALE_PARENT_VERSION]
          - errors[ERR_SUPPLIER_SCORE_BELOW_FLOOR]
          - validations[priority 3]
          - validations[priority 4]
          - validations[priority 7]
          - validations[priority 23]
          - validations[priority 28]
        distinguishing_aspect: >
          Every refusal, whatever its HTTP status, must come back in the SAME envelope: response_type 'error' and a
          data object carrying exactly error_id and message - never a partially built entity, never a bare string,
          never a 200 with an error inside. The ladder here deliberately spans 404, 400, 409, 412 and 422 so that a
          handler which special-cases one family (typically the 412 raised deep in the OCC check, or the 422 raised
          by a calculation) is caught, and no refused write may leave a row behind.
        test_recipe:
          setup:
            - "Model GX50-T exists and its version was observed as 1 before being bumped to 2 by the channel release."
            - "One Supplier row exists; the UUID 00000000-0000-4000-8000-0000000000cc belongs to no row."
            - "A supplier scored audit 60, 4000 ppm and 3 open CAPAs computes 46.63, below the CONDITIONAL floor of 70.00."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
              captures: { m1_id: $.data.id }

