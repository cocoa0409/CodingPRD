              payload: {}
              as: CarrierRep
              as_user_id: "${c39_id}"
              captures: { app39_fee: $.data.filing_fee_cents }
          assert:
            - "AuthorityApplication.${app39_id}.required_bipd_limit_cents == 75000000 (BIPD_PROPERTY_BASE_CENTS, no hazmat lift, 3 states is below the 25-state uplift threshold)"
            - "AuthorityApplication.${app39_id}.required_cargo_limit_cents == 1000000"
            - "AuthorityApplication.${app39_id}.required_bond_limit_cents == 0"
            - "${app39_fee} == 80879 — lines 32175 + 441 + 48263 + 0, each rounded HALF_UP before summation"
            - "AuthorityApplication.${app39_id}.status == 'SUBMITTED' and submission_count == 1"
            - "Carrier.${c39_id}.fee_balance_cents == 80879"

