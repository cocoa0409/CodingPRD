          assert:
            - "payment ${pay_a} (exactly 75000 == protected minimum): GET /offsets?payment_id returns 0 rows; execute succeeds with total_offset_cents == 0 and disbursed_cents == 75000"
            - "payment ${pay_b} (75001): exactly one offset of offset_amount_cents == 1; disbursed_cents == 75000"
            - "Debt.${debt_1}.current_balance_cents == 99999"
            - "Payment.${pay_a}.projected_offset_cents == 0 and Payment.${pay_b}.projected_offset_cents == 1 (INTAKE_ESTIMATE mirrors the same max(0, A - 75000) boundary)"

      - name: notice_window_exact_30_days
        grounds:
          - state_machines.Debt.NOTICED_to_ACTIVE
          - validations[priority=8]
          - errors.ERR_NOTICE_WINDOW_NOT_ELAPSED
          - endpoints.POST /debts/{debtId}/activate
        distinguishing_aspect: "Days-elapsed boundary on the notice-window metric, reached via debt activate: activation one second before notice_sent_at + 30 days fails with ERR_NOTICE_WINDOW_NOT_ELAPSED, and activation at exactly notice_sent_at + 30 days succeeds (>= semantics). The sibling boundary is a cents equality on payment endpoints."
        test_recipe:
          setup:
            - "Federal creditor; debt referred NOTICED with notice_sent_at 2026-09-01T00:00:00Z and due_process_completed true."
          setup_api_calls:
            - *c_cred_fed
