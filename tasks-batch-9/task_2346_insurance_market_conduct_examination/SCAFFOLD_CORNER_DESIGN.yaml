            - "The second carrier answer returns 201 with round_number == 2 and remediation_offer_cents == 9000, and the criticism reads response_round == 2 with rebuttal_count == 1"
            - "finalize from the second RESPONDED state returns 200 with status == SUSTAINED"

      - name: parent_scoped_collections_never_leak_across_parents
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /market-conduct/examinations/{id}/scope-areas]
          - endpoints[GET /market-conduct/scope-areas/{id}/data-calls]
          - endpoints[GET /market-conduct/examinations/{id}/collaborations]
        distinguishing_aspect: |
          Every nested collection is keyed on the path parent rather than on a filter, so two
          examinations holding scope areas with the identical CLAIMS value and data calls with the
          identical due date still read back disjointly. The one-cent case is the scope-area collection:
          because area values repeat across examinations, an implementation that filtered on the area
          value instead of the parent identifier would return both rows.
