      - name: justification_length_boundary_at_configured_minimum_chars
        grounds:
          - validations[priority=32]
          - errors.ERR_JUSTIFICATION_TOO_SHORT
          - entities.Agency.fields.justification_min_chars
          - entities.VideoRequest.fields.justification_text
          - state_machines.VideoRequest.compliance_state.JUSTIFICATION_PENDING_to_JUSTIFICATION_LOGGED
          - endpoints[POST /neighborhood-safety/video-requests/{id}/justification]
        distinguishing_aspect: |
          A completely different metric — a character count of a free-text field — on a
          different endpoint, POST /video-requests/{id}/justification, and the threshold is not
          a constant but per-agency configuration. A 79-character justification is rejected with
          422 while an 80-character one is accepted by the SAME agency whose
          justification_min_chars is 80, so the bound is inclusive at exactly the configured
          value; a second agency configured at 200 rejects a 150-character justification that
          the first agency would have accepted, which pins the value as read from the agency row
          rather than from a hardcoded literal. Nothing else in the scaffold exercises a
          string-length boundary or this 422 path.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z."
            - "Agency ALPHA ONBOARDED with justification_min_chars 80; officer OA with duty_role REQUESTER; RequestArea A (0,0) radius 500 over 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z is LOCKED (no devices exist, so eligible_device_count is 0, which does not gate justification) and VideoRequest VRA is created in compliance_state JUSTIFICATION_PENDING."
