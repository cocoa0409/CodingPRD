      - name: top_level_collection_listings_paginate_with_total_count_and_has_more
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /leagues]
          - endpoints[GET /organizations]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Two leagues and four organizations (three under league A, one under league B) let the
          top-level listings be walked page by page: total_count counts the whole filtered set and
          not the page, has_more flips false on the last page, the league_id filter narrows
          total_count from 4 to 3, and limit 0 / limit 101 / offset -1 are rejected with
