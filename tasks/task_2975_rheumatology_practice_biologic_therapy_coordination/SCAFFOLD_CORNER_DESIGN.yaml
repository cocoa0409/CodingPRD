      - name: the_error_envelope_is_identical_across_every_status_class
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_STALE_PATIENT_VERSION]
        distinguishing_aspect: "A 403, a 404, a 409, a 412 and a 422 all answer with response_type \"error\" and a data object holding exactly error_id and message — the status code varies, the envelope never does, and no partial entity body leaks into data."
        test_recipe:
