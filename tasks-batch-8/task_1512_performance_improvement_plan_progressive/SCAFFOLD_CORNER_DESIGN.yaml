        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: |
          Request without X-User-ID or X-User-Role returns 400
          ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER.
        test_recipe:
          setup:
            - "Org unit OU1 exists"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
          trigger:
            - call: "GET /hr-org-units/${ou_id}"
              payload: {}
              as: HRSystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 (when headers omitted by test harness; simulated here by negative naming convention)"
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

