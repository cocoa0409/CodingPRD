            - { call: "POST /course-sections/${s4_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s4_id}", faculty_id: "${f2_id}" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "05", modality: "ONLINE", meeting_day: "FRI", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s5_id: "$.data.id" } }
            - { call: "POST /course-sections/${s5_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
