              captures: { eid: $.data.error_id }
          assert:
            - "OutletSupplyPosition.${spA}.allocated_units == 12"
            - "HTTP status == 409"
            - "${eid} == ERR_ROUTE_CAPACITY_EXCEEDED"
            - "OutletSupplyPosition.${spB}.allocated_units == 0"
            - "OutletSupplyPosition.${spB}.planned_route_stop_id == null"
            - "SupplyItem.${siB}.reserved_pool_units == 0"
            - "ReplenishmentRoute.${rt}.committed_units == 12"

      - name: dispatch_without_a_part_sku_skips_both_van_parts_checks
        claim_type: conditional_validation
        grounds:
          - validations[priority 25 ERR_PART_NOT_ON_VAN]
          - validations[priority 26 ERR_INSUFFICIENT_VAN_PARTS]
        distinguishing_aspect: "Both parts checks are guarded by 'when part_sku is supplied', so a dispatch that omits part_sku succeeds on a van with no stock rows at all and leaves reserved_part_units at 0."
        test_recipe:
          setup:
            - "One OPEN service call on an IN_SERVICE unit; no VanPartStock rows exist."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
