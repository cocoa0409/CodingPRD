  # ===========================================================================
  - section: state_machines
    instances:
      - name: nav_record_lifecycle_draft_to_published_valid_transitions
        claim_type: valid_transition
        grounds:
          - state_machines.NavRecord
          - endpoints[POST /nav-records/{nav_record_id}/status]
          - calculations.nav_variance
        distinguishing_aspect: |
          The declared happy path is four hops long (DRAFT -> ADVISOR_REVIEW ->
          ADVISOR_CONFIRMED -> PUBLISHED) and every hop bumps version, so the row
          must sit at version 4 when published. With no prior PUBLISHED record the
          variance is 0, which also proves advisor_opinion_reference is optional
          below the escalation threshold.
        test_recipe:
          setup:
            - "Offering 'Ladderway REIT' with one class I and no shares outstanding."
            - "Clock advanced to 2026-09-02 so the August valuation period has elapsed."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Ladderway REIT", minimum_offering_amount_cents: 25000000, maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id, sc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: SponsorOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", gross_asset_value_cents: 0, other_liabilities_cents: 0, expected_share_class_version: "${sc_v}" }
              as: SponsorOperator
              captures: { nav_id: $.data.id, nav_v1: $.data.version, nav_s0: $.data.status }
          trigger:
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_REVIEW" }
              as: SponsorOperator
              captures: { nav_s1: $.data.status, nav_v2: $.data.version }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_CONFIRMED" }
              as: IndependentValuationAdvisor
              captures: { nav_s2: $.data.status, nav_v3: $.data.version }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SponsorOperator
              captures: { nav_s3: $.data.status, nav_v4: $.data.version }
          assert:
            - "nav_s0 == \"DRAFT\" and nav_v1 == 1"
            - "nav_s1 == \"ADVISOR_REVIEW\" and nav_v2 == 2"
            - "nav_s2 == \"ADVISOR_CONFIRMED\" and nav_v3 == 3"
            - "nav_s3 == \"PUBLISHED\" and nav_v4 == 4"
            - "NavRecord.${nav_id}.variance_bps == 0"
            - "NavRecord.${nav_id}.advisor_opinion_reference == null"
            - "NavRecord.${nav_id}.rejection_reason == null"
            - "NavRecord.${nav_id}.shares_outstanding_e4_snapshot == 0"
            - "NavRecord.${nav_id}.nav_per_share_pre_accrual_cents == 1000"
            - "NavRecord.${nav_id}.nav_per_share_cents == 1000"
            - "Offering.${off_id}.aggregate_nav_cents == 0"

      - name: selling_agreement_activation_preconditions_enforced
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SellingAgreement.PENDING_to_ACTIVE
          - errors[ERR_OFFERING_NOT_EFFECTIVE]
          - errors[ERR_BROKER_DEALER_BARRED]
        distinguishing_aspect: |
          PENDING -> ACTIVE carries two independent preconditions from two
          different parents, and each must be enforced on its own: a DRAFT
          offering blocks activation even for a spotless firm, and a BARRED firm
          blocks it even once the offering is EFFECTIVE. The agreement for the
          barred firm must be created AFTER the bar, because barring already
          terminates existing agreements.
        test_recipe:
          setup:
            - "Offering 'Gatecheck REIT' still in DRAFT with one class and one PENDING agreement for firm A."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Gatecheck REIT", minimum_offering_amount_cents: 25000000, maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Gatecheck Placement A", crd_number: "CRD-210001" }
              as: ComplianceOfficer
              captures: { bd_a_id: $.data.id }
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_a_id}", max_commission_bps: 700 }
              as: ComplianceOfficer
              captures: { sa_a_id: $.data.id }
          trigger:
            - call: "POST /selling-agreements/${sa_a_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { draft_offering_error: $.data.error_id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /broker-dealers"
              payload: { firm_name: "Gatecheck Placement B", crd_number: "CRD-210002" }
              as: ComplianceOfficer
              captures: { bd_b_id: $.data.id }
            - call: "POST /broker-dealers/${bd_b_id}/supervision-status"
              payload: { to_status: "HEIGHTENED_SUPERVISION" }
              as: ComplianceOfficer
            - call: "POST /broker-dealers/${bd_b_id}/supervision-status"
              payload: { to_status: "BARRED", reason: "FINRA expulsion" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_b_id}", max_commission_bps: 700 }
              as: ComplianceOfficer
              captures: { sa_b_id: $.data.id }
            - call: "POST /selling-agreements/${sa_b_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { barred_firm_error: $.data.error_id }
            - call: "POST /selling-agreements/${sa_a_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { sa_a_status: $.data.status, sa_a_version: $.data.version }
          assert:
            - "draft_offering_error == \"ERR_OFFERING_NOT_EFFECTIVE\" with http status 409"
            - "barred_firm_error == \"ERR_BROKER_DEALER_BARRED\" with http status 409"
            - "SellingAgreement.${sa_b_id}.status == \"PENDING\""
            - "sa_a_status == \"ACTIVE\""
            - "sa_a_version == 2"
            - "BrokerDealer.${bd_b_id}.supervision_status == \"BARRED\""

      - name: supervision_findings_auto_suspend_and_reactivate_agreement
        claim_type: side_effect_execution
        grounds:
          - state_machines.SellingAgreement.ACTIVE_to_SUSPENDED
          - state_machines.SellingAgreement.SUSPENDED_to_ACTIVE
          - state_machines.BrokerDealer.IN_GOOD_STANDING_to_HEIGHTENED_SUPERVISION
          - endpoints[POST /selling-agreements/{selling_agreement_id}/supervision-findings]
        distinguishing_aspect: |
          Suspension is DERIVED from finding counts, not requested: two minor
          findings leave the agreement ACTIVE, the third flips it to SUSPENDED and
          bubbles a HEIGHTENED_SUPERVISION status plus a suspended_agreement_count
          increment up to the firm; a single MAJOR finding on a sibling agreement
          does the same on its own; resolving back under the threshold
          auto-reactivates and decrements the firm counter.
        test_recipe:
          setup:
            - "Offering 'Findingsworth REIT' EFFECTIVE with two ACTIVE agreements for the same firm."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Findingsworth REIT", minimum_offering_amount_cents: 25000000, maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Findingsworth Placement", crd_number: "CRD-220001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 700 }
              as: ComplianceOfficer
              captures: { sa_1_id: $.data.id }
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 700 }
              as: ComplianceOfficer
              captures: { sa_2_id: $.data.id }
            - call: "POST /selling-agreements/${sa_1_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements/${sa_2_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /selling-agreements/${sa_1_id}/supervision-findings"
              payload: { action: "RECORD", severity: "MINOR", finding_reference: "FIND-1" }
              as: ComplianceOfficer
              captures: { after_one_minor: $.data.status }
            - call: "POST /selling-agreements/${sa_1_id}/supervision-findings"
              payload: { action: "RECORD", severity: "MINOR", finding_reference: "FIND-2" }
              as: ComplianceOfficer
              captures: { after_two_minor: $.data.status }
            - call: "POST /selling-agreements/${sa_1_id}/supervision-findings"
              payload: { action: "RECORD", severity: "MINOR", finding_reference: "FIND-3" }
              as: ComplianceOfficer
              captures: { after_three_minor: $.data.status, minor_count: $.data.open_minor_finding_count }
            - call: "POST /selling-agreements/${sa_2_id}/supervision-findings"
              payload: { action: "RECORD", severity: "MAJOR", finding_reference: "FIND-4" }
              as: ComplianceOfficer
              captures: { after_one_major: $.data.status, major_count: $.data.open_major_finding_count }
            - call: "POST /selling-agreements/${sa_1_id}/supervision-findings"
              payload: { action: "RESOLVE", severity: "MINOR", finding_reference: "FIND-3" }
              as: ComplianceOfficer
              captures: { after_resolve: $.data.status }
          assert:
            - "after_one_minor == \"ACTIVE\""
            - "after_two_minor == \"ACTIVE\""
            - "after_three_minor == \"SUSPENDED\" and minor_count == 3"
            - "after_one_major == \"SUSPENDED\" and major_count == 1"
            - "BrokerDealer.${bd_id}.supervision_status == \"HEIGHTENED_SUPERVISION\" after the third minor finding"
            - "BrokerDealer.${bd_id}.suspended_agreement_count == 2 after the MAJOR finding on the sibling agreement"
            - "after_resolve == \"ACTIVE\""
            - "SellingAgreement.${sa_1_id}.open_minor_finding_count == 2"
            - "BrokerDealer.${bd_id}.suspended_agreement_count == 1 after the resolution"
            - "SellingAgreement.${sa_2_id}.status == \"SUSPENDED\" (unaffected by the sibling's resolution)"

      - name: subscription_undefined_transitions_from_pending_and_escrowed_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Subscription
          - errors[ERR_INVALID_STATE_TRANSITION]
          - validations[priority=7]
        distinguishing_aspect: |
          Subscription has three legal exits from PENDING (ESCROWED, ACCEPTED,
          REJECTED) and two from ESCROWED (ACCEPTED via cascade, REFUNDED); every
          other pair must 409. Each attempt is made by the role that WOULD own the
          transition elsewhere, so a 403 cannot stand in for the 409.
        test_recipe:
          setup:
            - "Offering 'Deadend REIT' EFFECTIVE, zero-load class I, ACTIVE agreement, DOCUMENTED investor, one PENDING subscription of 250000 cents."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Deadend REIT", minimum_offering_amount_cents: 25000000, maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
