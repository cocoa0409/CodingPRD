            - call: "POST /mitigation/banks/${bank_id}/stewardship-contributions"
              payload: { amount_cents: 85260000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { funded_after: $.data.stewardship_funded_cents }
          trigger:
            - call: "POST /mitigation/credit-sales/${sale_id}/execute"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { executed_price: $.data.executed_price_cents }
          assert:
            - "CreditSale.${sale_id}.quoted_price_cents == 32216400"
            - "CreditSale.${sale_id}.quoted_demand_index == 0.0000"
            - "CreditSale.${sale_id}.executed_price_cents == 29830000"
            - "CreditSale.${sale_id}.quoted_price_cents - CreditSale.${sale_id}.executed_price_cents == 2386400"
