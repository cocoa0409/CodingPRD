  - method: GET
    path: "/load-assignments/{assignmentId}"
    description: "Get a load assignment"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
