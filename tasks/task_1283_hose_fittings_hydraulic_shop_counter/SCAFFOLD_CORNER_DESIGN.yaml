        distinguishing_aspect: "After a first inspection create bumps the asset version 1 -> 2, a second create carrying expected_equipment_asset_version 1 is rejected with ERR_STALE_VERSION (412); the current version succeeds."
        test_recipe:
          setup: ["Customer; ACTIVE asset at version 1; inspection I1 created (asset now version 2)"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "OccCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "OC-01", machine_type: "crane", installed_at: "2026-07-01T00:00:00Z" }
              as: ShopManager
              captures: { asset_id: $.data.id, asset_v1: $.data.version }
            - call: "POST /api/equipment-assets/${asset_id}/inspections"
              payload: { expected_equipment_asset_version: "${asset_v1}", scheduled_window_start: "2026-08-10T00:00:00Z", scheduled_window_end: "2026-08-11T00:00:00Z" }
              as: CounterSales
              captures: { i1_id: $.data.id }
