  - method: POST
    path: "/api/fantasy-contests/{contest_id}/entries"
    description: "Register an entry"
    roles: [Server, Host]
    code: 201
    input: [guest_id, lineup]
    output: FantasyEntry
    side_effects: []

  - method: GET
    path: "/api/fantasy-contests/{id}/fantasy-entries"
    description: "List entries in a contest"
    roles: [PlatformAdmin, VenueManager, Host, Server]
    code: 200
    input: []
    output: FantasyEntry[]
    side_effects: []

  - method: POST
    path: "/api/fantasy-contests/{contest_id}/lock"
