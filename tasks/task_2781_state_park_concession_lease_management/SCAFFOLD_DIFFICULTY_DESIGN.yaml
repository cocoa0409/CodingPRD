  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: prospectus_issue_blocked_by_opportunity_not_yet_approved
        grounds:
          - validations[priority=12]
          - state_machines.ConcessionOpportunity.ANALYSIS_COMPLETE_to_APPROVED_FOR_SOLICITATION
          - state_machines.Prospectus.DRAFT_to_ISSUED
          - errors[ERR_OPPORTUNITY_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair (Prospectus, ConcessionOpportunity): the prospectus is a perfectly
          valid DRAFT and every field on the request is in order, yet issuing it is refused
          because a DIFFERENT entity — the parent opportunity — is only ANALYSIS_COMPLETE
          and has never been approved for solicitation; nothing about the Prospectus row
          itself explains the 409.
        test_recipe:
          setup:
            - "One park and one opportunity whose market analysis has been filed (comparable 200,000,000 at 80.00% capture, estimated 160,000,000), leaving it in ANALYSIS_COMPLETE."
            - "No ContractingOfficer has called approve-solicitation on that opportunity."
            - "A DRAFT prospectus already exists under that opportunity with normalized weights and a 2027-02-01T00:00:00Z deadline; the clock is at 2027-01-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
              payload: { name: "Cedar Hollow State Park", region_code: "NW", annual_visitation: 480000, comparable_lodging_rate_cents: 20000, comparable_meal_rate_cents: 3000, comparable_activity_rate_cents: 9000 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
            - call: "POST /concession-opportunities"
              payload: { park_id: "${park_id}", title: "Cedar Hollow Lodge Concession", service_category: "LODGING", required_capital_investment_cents: 30000000 }
              as: ConcessionSpecialist
              captures: { opp_id: $.data.id }
            - call: "POST /concession-opportunities/${opp_id}/market-analysis"
              payload: { comparable_gross_receipts_cents: 200000000, market_capture_pct: 80.00, analyst_note: "Regional lodging comparables at 80 percent capture." }
              as: ConcessionSpecialist
            - call: "POST /prospectuses"
              payload: { opportunity_id: "${opp_id}", minimum_franchise_fee_pct: 4.00, minimum_annual_guarantee_cents: 6000000, term_years: 10, submission_deadline: "2027-02-01T00:00:00Z", weight_experience: 20, weight_operating_plan: 25, weight_capital_investment: 20, weight_financial_capacity: 15, weight_fee_offer: 20, scoring_mode: "PER_CRITERION_ROUNDING", min_technical_score: 70.00 }
              as: ConcessionSpecialist
              captures: { pros_id: $.data.id }
          trigger:
            - call: "POST /prospectuses/${pros_id}/issue"
              payload: {}
              as: ConcessionSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_OPPORTUNITY_NOT_APPROVED"
            - "Prospectus.${pros_id}.status == DRAFT"
            - "ConcessionOpportunity.${opp_id}.status == ANALYSIS_COMPLETE"
            - "ConcessionOpportunity.${opp_id}.estimated_annual_gross_receipts_cents == 160000000"

