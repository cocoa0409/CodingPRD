    side_effects: ["program_status=OPEN; computed capacity fields initialized (interconnected=0, reserved=0, available=cap, queued_count=0)"]
  - method: GET
    path: "/programs"
    description: "List programs"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: ["program_status?"]
    output: Program[]
    side_effects: []
  - method: GET
    path: "/programs/{program_id}"
    description: "Get program"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: POST
    path: "/programs/{program_id}/suspend"
    description: "Suspend intake"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Program
    side_effects: ["program_status -> SUSPENDED"]
  - method: POST
    path: "/programs/{program_id}/resume"
    description: "Resume intake"
    roles: [ProgramAdministrator]
    code: 200
    input: []
