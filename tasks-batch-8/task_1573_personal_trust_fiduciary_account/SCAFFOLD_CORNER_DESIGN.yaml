            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "AAA", units: 1000, unit_price_cents: 25000, expected_trust_account_version: "${tv1}" }, as: InvestmentManager }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv2: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "BBB", units: 1000, unit_price_cents: 25000, expected_trust_account_version: "${tv2}" }, as: InvestmentManager }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv3: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "CCC", units: 1000, unit_price_cents: 15000, expected_trust_account_version: "${tv3}" }, as: InvestmentManager, captures: { h3: $.data.id } }
            - { call: "POST /trusts/investment-holdings/${h3}/update-price", payload: { unit_price_cents: 15010, priced_at: "2026-10-01T00:00:00Z" }, as: InvestmentManager }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv4: $.data.version } }
          trigger:
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "DDD", units: 1, unit_price_cents: 100000, expected_trust_account_version: "${tv4}" }, as: InvestmentManager, captures: { err: $.data.error_id } }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv5: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "FIXED_INCOME", ticker: "BND", units: 1, unit_price_cents: 100000, expected_trust_account_version: "${tv5}" }, as: InvestmentManager, captures: { h_fi: $.data.id } }
          assert:
            - "EQUITY purchase fails: error_id == ERR_IPS_DRIFT_BREACH, http 422"
