scenario: |
  2875. Non-Qualified Mortgage & Alternative Documentation Underwriting (non-QM lender): documentation type selection across bank statement, asset depletion, debt-service-coverage and profit-and-loss programs, income calculation methodology by program with expense factor rules, ability-to-repay documentation and safe harbor analysis outside qualified mortgage status, points and fees testing and high-cost loan avoidance, credit event seasoning rules for prior derogatory history, appraisal review with second valuation requirements on certain programs, investor guideline overlays and exception approval authority, securitization eligibility and post-close audit
domain_name: non-qm-alt-doc-underwriting
api_prefix: "/"
# All resource collections are mounted at the server root (flat topology): /loan-files,
# /income-worksheets, /statement-months, /valuation-orders, /points-and-fees-items,
# /exception-requests, /post-close-audits, /audit-findings, /borrowers, /credit-events,
# /documentation-programs, /investor-overlays, /securitization-pools.
# The single-resource id segment is spelled `{id}` in every path.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - version_pinning_on_approval
    - optimistic_concurrency
  difficulty_level: expert_plus
  entity_topology: flat
  # Peer entities linked by FK fields carried in request bodies; no nested creation and no
  # nested identity paths. A handful of read-only parent-scoped collection GETs exist purely
  # as FK reverse-reachability channels for cascade-created children (AppraisalReview) and
  # for append-only children (StatementMonth, AuditFinding, CreditEvent, ValuationOrder,
  # PointsAndFeesItem).
  state_machine_shape: branching
  # LoanFile: branching + revision cycle (UNDERWRITING <-> SUSPENDED, CLOSED <-> AUDIT_DEFECT).
  # ExceptionRequest: fork-join on authority tier (tier 1 single signoff vs tier 2 dual
  #   signature) with divergent side-effect sets per branch.
  # AppraisalReview: two parallel state dimensions on one row (primary_review_status x
  #   second_valuation_status) that advance independently and are joined by reconciliation.
  # AuditFinding: cycle (ISSUED -> REBUTTED -> ISSUED on RETURN_FOR_MORE_INFO).
  # PostCloseAudit: compound - status/grade derived from the aggregate state of its findings.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  # one_to_many: LoanFile -> IncomeWorksheet / ValuationOrder / PointsAndFeesItem /
  #   ExceptionRequest / PostCloseAudit; IncomeWorksheet -> StatementMonth.
  # cross_aggregate: LoanFile.pool_id crosses into the securitization aggregate;
  #   ExceptionRequest.overlay_id crosses into the investor-overlay configuration aggregate.
  # polymorphic: InvestorOverlay.rule_metric selects which LoanFile numeric field the same
  #   comparator/threshold pair is evaluated against.
  role_model: segregation_of_duties
  # The X-User-ID that requested an exception may never sign it off, and the tier-2 second
  # signature may never be the same X-User-ID as the first signoff. Loan-level underwriting
  # actions are locked to the assigned underwriter's X-User-ID.
  consistency_model: immediate

entities:
  - name: DocumentationProgram
    parent: null
    common_fields: true
    role: configuration
    fields:
      - name: program_code
        type: enum
        source: input
        description: Alternative-documentation program family this row configures.
        constraints: "one of {BANK_STATEMENT_12MO, BANK_STATEMENT_24MO, ASSET_DEPLETION, DSCR, PROFIT_AND_LOSS}; unique across rows"
      - name: name
        type: string
        source: input
        description: Human label for the program.
      - name: statement_period_months
        type: integer
        source: input
        description: Fixed divisor for bank-statement and profit-and-loss income averaging; null for ASSET_DEPLETION and DSCR.
        constraints: "required and in {12, 24} when program_code starts with BANK_STATEMENT_; required and 12 for PROFIT_AND_LOSS; must be null otherwise"
      - name: default_expense_factor_pct
        type: number
        source: input
        description: Program expense factor applied to eligible deposits when expense_factor_source is PROGRAM_DEFAULT.
        constraints: "0.00-100.00, 2 decimals; required for BANK_STATEMENT_12MO, BANK_STATEMENT_24MO and PROFIT_AND_LOSS, and must be omitted (null) for ASSET_DEPLETION and DSCR"
      - name: min_expense_factor_pct
        type: number
        source: input
        description: Hard floor for a CPA-letter expense factor; a lower CPA factor is rejected.
        constraints: "0.00-100.00, 2 decimals; required for BANK_STATEMENT_12MO, BANK_STATEMENT_24MO and PROFIT_AND_LOSS, and must be omitted (null) for ASSET_DEPLETION and DSCR"
      - name: depletion_horizon_months
        type: integer
        source: input
        description: Divisor used by the asset-depletion income calculation; null unless program_code is ASSET_DEPLETION.
        constraints: "positive integer"
      - name: min_dscr
        type: number
        source: input
        description: Minimum debt-service-coverage ratio accepted at approval; null unless program_code is DSCR.
        constraints: "4 decimals"
      - name: max_ltv_pct
        type: number
        source: input
        description: Program loan-to-value ceiling checked at approval with <=.
        constraints: "0.00-100.00, 2 decimals"
      - name: min_fico
        type: integer
        source: input
        description: Program representative-credit-score floor checked at approval with >=.
        constraints: "300-850"
      - name: min_reserves_months
        type: integer
        source: input
        description: Months of PITIA that verified liquid assets must cover, checked with >=.
        constraints: ">= 0"
      - name: max_dti_pct
        type: number
        source: input
        description: Program debt-to-income ceiling checked with <=; null for DSCR (no borrower income).
        constraints: "0.00-100.00, 2 decimals; required for every program except DSCR, and must be omitted (null) for DSCR"
      - name: min_residual_income_cents
        type: integer
        source: input
        description: Minimum monthly residual income required for ability-to-repay documentation, checked with >=.
        constraints: ">= 0"
      - name: second_valuation_ltv_threshold_pct
        type: number
        source: input
        description: LTV above which a second valuation is required (strict >).
        constraints: "0.00-100.00, 2 decimals"
      - name: second_valuation_loan_amount_threshold_cents
        type: integer
        source: input
        description: Loan amount at or above which a second valuation is required (>=).
        constraints: "> 0"
      - name: atr_exempt_flag
        type: boolean
        source: input
        description: True when the program funds business-purpose investment loans that sit outside the ability-to-repay rule.
        default: false
      - name: seasoning_matrix
        type: object
        source: input
        description: "Required seasoning in whole months per credit-event type; keys are exactly {FORECLOSURE, SHORT_SALE, DEED_IN_LIEU, BK_CH7, BK_CH13, MODIFICATION, MORTGAGE_LATE_60}, values non-negative integers."
        constraints: "all seven keys required"

  - name: InvestorOverlay
    parent: null
    common_fields: true
    role: configuration
    fields:
      - name: investor_code
        type: string
        source: input
        description: Investor whose guideline overlay this row expresses; matched against LoanFile.investor_code by exact string equality.
      - name: overlay_code
        type: string
        source: input
        description: Stable overlay identifier used in LoanFile.overlay_breach_codes and as the deterministic sort key of overlay evaluation.
        constraints: "unique per (investor_code, overlay_code)"
      - name: applies_to_program_code
        type: enum
        source: input
        description: Restricts the overlay to one program family; null means it applies to every program.
        constraints: "one of {BANK_STATEMENT_12MO, BANK_STATEMENT_24MO, ASSET_DEPLETION, DSCR, PROFIT_AND_LOSS} or null"
      - name: rule_metric
        type: enum
        source: input
        description: Which LoanFile/Borrower numeric field the overlay comparator is evaluated against.
        constraints: "one of {MIN_FICO, MAX_LTV_PCT, MIN_DSCR, MAX_DTI_PCT, MIN_RESERVES_MONTHS, MIN_SEASONING_MONTHS, MAX_LOAN_AMOUNT_CENTS}"
      - name: comparator
        type: enum
        source: input
        description: GTE means the loan metric must be >= threshold_value; LTE means it must be <= threshold_value.
        constraints: "one of {GTE, LTE}"
      - name: threshold_value
        type: number
        source: input
        description: Overlay threshold in the metric's own unit (percent for LTV/DTI, ratio for DSCR, cents for loan amount, months for seasoning/reserves, points for FICO).
      - name: waivable_flag
        type: boolean
        source: input
        description: False means no ExceptionRequest may be opened against this overlay.
        default: true
      - name: required_authority_tier
        type: integer
        source: input
        description: Signoff authority tier needed to approve an exception to this overlay; 1 = single CreditCommittee signoff, 2 = CreditCommittee plus ChiefCreditOfficer dual signature.
        constraints: "1 or 2"
      - name: severity
        type: enum
        source: input
        description: Overlay severity; MATERIAL escalates the computed authority tier of any exception request to 2 regardless of required_authority_tier.
        constraints: "one of {MINOR, MATERIAL}"

  - name: SecuritizationPool
    parent: null
    common_fields: true
    role: resource
    fields:
      - name: pool_code
        type: string
        source: input
        description: Pool identifier used in operator tooling.
        constraints: unique
      - name: investor_code
        type: string
        source: input
        description: Investor taking delivery of the pool; a loan may only be assigned when its investor_code matches by exact string equality.
      - name: target_balance_cents
        type: integer
        source: input
        description: Aggregate scheduled balance cap of the pool; an assignment that would push aggregate_scheduled_balance_cents above this value is refused (the cap itself is an allowed landing point).
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Pool lifecycle state.
        default: OPEN
        constraints: "one of {OPEN, REBALANCING, SETTLED}"
      - name: aggregate_scheduled_balance_cents
        type: integer
        source: computed
        description: Recomputed from scratch on every membership mutation as the sum of member LoanFile.loan_amount_cents (see calculations.pool_metrics_recompute).
        default: 0
      - name: weighted_avg_coupon_pct
        type: number
        source: computed
        description: Balance-weighted average of member LoanFile.note_rate_pct, 4 decimals, recomputed from scratch on every membership mutation (see calculations.pool_metrics_recompute).
        default: 0.0000
      - name: member_loan_count
        type: integer
        source: computed
        description: Count of LoanFile rows whose pool_id equals this pool's id and whose status is CLOSED.
        default: 0

  - name: Borrower
    parent: null
    common_fields: true
    role: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: Borrower legal name.
      - name: fico_score
        type: integer
        source: input
        description: Representative credit score used for program and overlay MIN_FICO checks.
        constraints: "300-850"
      - name: self_employed_flag
        type: boolean
        source: input
        description: True when income is self-employment income; required true for BANK_STATEMENT and PROFIT_AND_LOSS doc types.
        default: false
      - name: entity_ownership_pct
        type: number
        source: input
        description: Borrower's ownership share of the business whose deposits or profit-and-loss statement are used; scales bank-statement and profit-and-loss qualifying income.
        default: 100.00
        constraints: "0.01-100.00, 2 decimals"
      - name: monthly_debt_obligations_cents
        type: integer
        source: input
        description: Verified monthly consumer and mortgage obligations excluding the subject PITIA.
        constraints: ">= 0"
      - name: verified_liquid_assets_cents
        type: integer
        source: input
        description: Verified checking/savings balances used for the reserves test.
        constraints: ">= 0"
      - name: age_years
        type: integer
        source: input
        description: Borrower age in whole years at application; drives the retirement-asset haircut boundary in the asset-depletion calculation.
        constraints: "18-120"
      - name: credit_event_count
        type: integer
        source: computed
        description: Count of CreditEvent rows whose borrower_id equals this borrower's id, recomputed on every credit-event creation.
        default: 0

  - name: CreditEvent
    parent: Borrower
    common_fields: false
    role: event
    fields:
      - name: borrower_id
        type: string
        source: input
        description: FK -> Borrower.id; the borrower whose derogatory history this event records.
      - name: event_type
        type: enum
        source: input
        description: Derogatory event class; keys the program's seasoning_matrix lookup.
        constraints: "one of {FORECLOSURE, SHORT_SALE, DEED_IN_LIEU, BK_CH7, BK_CH13, MODIFICATION, MORTGAGE_LATE_60}"
      - name: completion_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant at which the event completed (discharge, sale, or modification effective date); only its UTC calendar date participates in seasoning arithmetic.
      - name: documented_flag
        type: boolean
        source: input
        description: True when supporting documentation is in file; undocumented events are excluded from the seasoning candidate set.
        default: true

  - name: LoanFile
    parent: null
    common_fields: true
    role: resource
    fields:
      - name: borrower_id
        type: string
        source: input
        description: FK -> Borrower.id; the qualifying borrower.
      - name: program_id
        type: string
        source: input
        description: FK -> DocumentationProgram.id; the alternative-documentation program the file is underwritten to.
      - name: pool_id
        type: string
        source: system
        description: FK -> SecuritizationPool.id; null until the loan is assigned to a pool, reset to null when it is removed or detached by cascade.
        default: null
      - name: investor_code
        type: string
        source: input
        description: Investor the loan is being originated for; selects the applicable InvestorOverlay rows and constrains pool assignment.
      - name: assigned_underwriter_id
        type: string
        source: system
        description: X-User-ID of the Underwriter who performed doc-type selection; every later Underwriter action on this file must carry the same X-User-ID.
        default: null
      - name: loan_amount_cents
        type: integer
        source: input
        description: Note amount.
        constraints: "> 0"
      - name: purchase_price_cents
        type: integer
        source: input
        description: Contract price; required when purpose is PURCHASE, must be null otherwise.
        constraints: "> 0 when present"
      - name: property_value_cents
        type: integer
        source: input
        description: Estimated value at application; used as the LTV denominator basis until AppraisalReview.reconciled_value_cents exists.
        constraints: "> 0"
      - name: occupancy
        type: enum
        source: input
        description: Subject-property occupancy.
        constraints: "one of {PRIMARY, SECOND_HOME, INVESTMENT}"
      - name: purpose
        type: enum
        source: input
        description: Transaction purpose.
        constraints: "one of {PURCHASE, RATE_TERM_REFI, CASH_OUT_REFI}"
      - name: lien_position
        type: enum
        source: input
        description: Lien position; selects the higher-priced rate-spread threshold in the safe-harbor analysis.
        constraints: "one of {FIRST, SECOND}"
      - name: note_rate_pct
        type: number
        source: input
        description: Note rate used for payment and weighted-average-coupon math.
        constraints: "3 decimals, > 0"
      - name: apor_pct
        type: number
        source: input
        description: Average prime offer rate for the comparable transaction at lock; the rate-spread subtrahend.
        constraints: "3 decimals, > 0"
      - name: term_months
        type: integer
        source: input
        description: Amortization term in months.
        constraints: "> 0"
      - name: amortization_type
        type: enum
        source: input
        description: Selects the principal-and-interest branch of the PITIA calculation.
        constraints: "one of {FULLY_AMORTIZING, INTEREST_ONLY}"
      - name: monthly_taxes_cents
        type: integer
        source: input
        description: Monthly property taxes escrowed.
        constraints: ">= 0"
      - name: monthly_insurance_cents
        type: integer
        source: input
        description: Monthly hazard insurance escrowed.
        constraints: ">= 0"
      - name: monthly_hoa_cents
        type: integer
        source: input
        description: Monthly homeowner-association dues.
        constraints: ">= 0"
      - name: gross_market_rent_cents
        type: integer
        source: input
        description: Appraiser-opined market rent (form 1007); required when doc_type will be DSCR.
        constraints: ">= 0 when present"
      - name: lease_rent_cents
        type: integer
        source: input
        description: Contract rent from an in-place lease; presence selects the LEASE_IN_PLACE variant of the DSCR calculation.
        constraints: ">= 0 when present"
      - name: doc_type
        type: enum
        source: system
        description: Documentation type selected for the file; set once by the doc-type-selection action and immutable afterwards.
        default: null
        constraints: "one of {BANK_STATEMENT, ASSET_DEPLETION, DSCR, PROFIT_AND_LOSS} or null"
      - name: status
        type: enum
        source: system
        description: Loan file lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, DOC_TYPE_SELECTED, UNDERWRITING, SUSPENDED, APPROVED, CLOSED, DENIED, AUDIT_DEFECT}"
      - name: qualifying_income_monthly_cents
        type: integer
        source: computed
        description: Monthly qualifying income copied from the ACCEPTED IncomeWorksheet; 0 while no worksheet is accepted and 0 for DSCR files.
        default: 0
      - name: pitia_monthly_cents
        type: integer
        source: computed
        description: Monthly principal, interest, taxes, insurance and HOA (see calculations.pitia_monthly); recomputed on creation and whenever a payment input changes.
      - name: dti_pct
        type: number
        source: computed
        description: Debt-to-income percent, 2 decimals; null when qualifying_income_monthly_cents is 0.
        default: null
      - name: dscr_ratio
        type: number
        source: computed
        description: Debt-service-coverage ratio, 4 decimals (see calculations.dscr_ratio); null unless doc_type is DSCR.
        default: null
      - name: residual_income_cents
        type: integer
        source: computed
        description: qualifying_income_monthly_cents - Borrower.monthly_debt_obligations_cents - pitia_monthly_cents; may be negative.
        default: 0
      - name: documented_reserves_months
        type: number
        source: computed
        description: Borrower.verified_liquid_assets_cents divided by pitia_monthly_cents, 2 decimals, round_half_up.
        default: 0.00
      - name: ltv_pct
        type: number
        source: computed
        description: Loan-to-value percent, 2 decimals (see calculations.ltv_recompute).
      - name: points_and_fees_total_cents
        type: integer
        source: computed
        description: Sum of amount_cents over PointsAndFeesItem rows classified INCLUDED (see calculations.points_and_fees_test).
        default: 0
      - name: total_loan_amount_cents
        type: integer
        source: computed
        description: loan_amount_cents less included prepaid finance charges; the denominator of the points-and-fees cap.
        default: 0
      - name: points_and_fees_cap_cents
        type: integer
        source: computed
        description: Tier-selected points-and-fees ceiling in cents (see calculations.points_and_fees_test).
        default: 0
      - name: points_and_fees_test_result
        type: enum
        source: computed
        description: Result of the most recent points-and-fees test; recomputed whenever a fee item is added or voided after the first test.
        default: NOT_TESTED
        constraints: "one of {NOT_TESTED, PASS, FAIL}"
      - name: atr_documentation_status
        type: enum
        source: computed
        description: Ability-to-repay documentation state produced by the atr-determination action and invalidated back to INCOMPLETE by any later change to income, PITIA, fee totals or reconciled value.
        default: INCOMPLETE
        constraints: "one of {INCOMPLETE, DOCUMENTED, EXEMPT}"
      - name: safe_harbor_class
        type: enum
        source: computed
        description: Safe-harbor classification outside qualified-mortgage status (see calculations.atr_determination).
        default: NOT_EVALUATED
        constraints: "one of {NOT_EVALUATED, EXEMPT_BUSINESS_PURPOSE, ATR_DOCUMENTED_NO_SAFE_HARBOR, HIGHER_PRICED_NO_PRESUMPTION, HIGH_COST_PROHIBITED}"
      - name: rate_spread_pct
        type: number
        source: computed
        description: note_rate_pct - apor_pct, 3 decimals; compared against the lien-position threshold in the safe-harbor analysis.
        default: null
      - name: governing_credit_event_id
        type: string
        source: computed
        description: Id of the CreditEvent selected as governing by calculations.credit_event_seasoning (greatest seasoning deficit, tie-break latest completion_date then created_at ASC); null when the borrower has no documented credit events. Not a request-supplied foreign key.
        default: null
      - name: seasoning_months_required
        type: integer
        source: computed
        description: Program seasoning requirement of the governing credit event; 0 when there is none.
        default: 0
      - name: seasoning_months_elapsed
        type: integer
        source: computed
        description: Whole calendar months from the governing credit event's completion_date to the current logical clock date; 0 when there is none.
        default: 0
      - name: seasoning_satisfied
        type: boolean
        source: computed
        description: seasoning_months_elapsed >= seasoning_months_required.
        default: true
      - name: overlay_breach_codes
        type: array
        source: computed
        description: InvestorOverlay.overlay_code values the loan currently fails, sorted ascending by overlay_code.
        default: []
      - name: unresolved_overlay_breach_count
        type: integer
        source: computed
        description: Count of breached overlays that have no ExceptionRequest in status APPROVED for the same overlay_id on this loan.
        default: 0
      - name: securitization_eligible
        type: boolean
        source: computed
        description: Aggregate delivery gate (see calculations.securitization_eligibility).
        default: false
      - name: second_valuation_required
        type: boolean
        source: computed
        description: True when program thresholds or the cash-out bank-statement rule demand a second valuation (see calculations.appraisal_reconciliation).
        default: false
      - name: investor_notification_required
        type: boolean
        source: system
        description: Set true only by a tier-2 dual-signature exception approval on this loan; never cleared.
        default: false
      - name: repurchase_flag
        type: boolean
        source: system
        description: Set true when a post-close audit reaches grade C_MATERIAL; cleared when the audit is regraded below C_MATERIAL.
        default: false

  - name: IncomeWorksheet
    parent: LoanFile
    common_fields: true
    role: resource
    fields:
      - name: loan_file_id
        type: string
        source: input
        description: FK -> LoanFile.id; the file this worksheet qualifies.
      - name: method
        type: enum
        source: input
        description: Income methodology; must equal the loan file's doc_type.
        constraints: "one of {BANK_STATEMENT, ASSET_DEPLETION, DSCR, PROFIT_AND_LOSS}"
      - name: expense_factor_source
        type: enum
        source: input
        description: Selects the bank-statement expense-factor variant; ignored for non-BANK_STATEMENT methods.
        default: PROGRAM_DEFAULT
        constraints: "one of {PROGRAM_DEFAULT, CPA_LETTER}"
      - name: cpa_expense_factor_pct
        type: number
        source: input
        description: CPA-attested expense ratio; required when expense_factor_source is CPA_LETTER and rejected otherwise.
        constraints: "0.00-100.00, 2 decimals; must be >= DocumentationProgram.min_expense_factor_pct"
      - name: p_and_l_net_income_cents
        type: integer
        source: input
        description: Net income from the CPA-prepared profit-and-loss statement; required when method is PROFIT_AND_LOSS.
        constraints: ">= 0 when present"
      - name: p_and_l_period_months
        type: integer
        source: input
        description: Number of months the profit-and-loss statement covers; must equal DocumentationProgram.statement_period_months.
        constraints: "> 0 when present"
      - name: asset_bucket_checking_cents
        type: integer
        source: input
        description: Checking/savings balance entering asset depletion at a 100 percent factor; required when method is ASSET_DEPLETION.
        constraints: ">= 0 when present"
      - name: asset_bucket_brokerage_cents
        type: integer
        source: input
        description: Non-retirement brokerage balance entering asset depletion at a 90 percent factor; required when method is ASSET_DEPLETION.
        constraints: ">= 0 when present"
      - name: asset_bucket_retirement_cents
        type: integer
        source: input
        description: Retirement balance entering asset depletion at 100 percent when Borrower.age_years >= 60 and 70 percent otherwise; required when method is ASSET_DEPLETION.
        constraints: ">= 0 when present"
      - name: status
        type: enum
        source: system
        description: Worksheet lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, CALCULATED, ACCEPTED, SUPERSEDED}"
      - name: eligible_deposit_total_cents
        type: integer
        source: computed
        description: Sum of StatementMonth.eligible_deposit_cents over months with inclusion_status INCLUDED; 0 for non-BANK_STATEMENT methods.
        default: 0
      - name: net_deposit_total_cents
        type: integer
        source: computed
        description: Sum of the per-month expense-factored deposit amounts, each rounded half-up to the cent BEFORE summing (see calculations.bank_statement_income); 0 for non-BANK_STATEMENT methods.
        default: 0
      - name: included_month_count
        type: integer
        source: computed
        description: Count of StatementMonth rows with inclusion_status INCLUDED.
        default: 0
      - name: eligible_assets_after_haircut_cents
        type: integer
        source: computed
        description: Sum of the three per-bucket haircut products, each rounded half-up to the cent BEFORE summing (see calculations.asset_depletion_income); 0 for non-ASSET_DEPLETION methods.
        default: 0
      - name: depletable_assets_cents
        type: integer
        source: computed
        description: eligible_assets_after_haircut_cents less required reserves, floored at 0; 0 for non-ASSET_DEPLETION methods.
        default: 0
      - name: expense_factor_pct_applied
        type: number
        source: computed
        description: Expense factor actually used, 2 decimals; null for non-BANK_STATEMENT methods.
        default: null
      - name: gross_monthly_income_cents
        type: integer
        source: computed
        description: Pre-expense-factor monthly average for BANK_STATEMENT (eligible_deposit_total_cents divided by the program divisor, round_half_up); pre-ownership monthly figure for PROFIT_AND_LOSS; equals the depletion quotient for ASSET_DEPLETION; 0 for DSCR.
        default: 0
      - name: monthly_qualifying_income_cents
        type: integer
        source: computed
        description: Final monthly qualifying income this worksheet produces; copied onto LoanFile.qualifying_income_monthly_cents when the worksheet is accepted.
        default: 0
      - name: variant_applied
        type: enum
        source: computed
        description: Which calculation variant produced monthly_qualifying_income_cents.
        default: null
        constraints: "one of {PROGRAM_DEFAULT_FACTOR, CPA_LETTER_FACTOR, ASSET_DEPLETION_STANDARD, PL_NET_INCOME, DSCR_NO_BORROWER_INCOME} or null"
      - name: calculation_count
        type: integer
        source: computed
        description: Number of times the calculate action has run against this worksheet; increments on every recalculation loop.
        default: 0

  - name: StatementMonth
    parent: IncomeWorksheet
    common_fields: true
    role: resource
    fields:
      - name: worksheet_id
        type: string
        source: input
        description: FK -> IncomeWorksheet.id; the bank-statement worksheet this month belongs to.
      - name: period_start_date
        type: datetime
        source: input
        description: Inclusive ISO 8601 UTC start of the statement month; intervals are half-open [period_start_date, period_end_date).
      - name: period_end_date
        type: datetime
        source: input
        description: Exclusive ISO 8601 UTC end of the statement month; must be strictly after period_start_date.
      - name: deposits_total_cents
        type: integer
        source: input
        description: Gross deposits on the statement.
        constraints: ">= 0"
      - name: ineligible_transfer_cents
        type: integer
        source: input
        description: Portion of deposits identified as inter-account transfers or non-business funds.
        default: 0
        constraints: ">= 0"
      - name: eligible_deposit_cents
        type: integer
        source: computed
        description: max(0, deposits_total_cents - ineligible_transfer_cents), fixed at creation.
      - name: inclusion_status
        type: enum
        source: system
        description: Whether the month participates in the deposit aggregate.
        default: INCLUDED
        constraints: "one of {INCLUDED, EXCLUDED}"
      - name: exclusion_reason
        type: string
        source: system
        description: Reason captured by the exclude action; null while inclusion_status is INCLUDED.
        default: null

  - name: ValuationOrder
    parent: LoanFile
    common_fields: true
    role: resource
    fields:
      - name: loan_file_id
        type: string
        source: input
        description: FK -> LoanFile.id; the file the valuation is ordered for.
      - name: valuation_type
        type: enum
        source: input
        description: Valuation product ordered.
        constraints: "one of {PRIMARY_APPRAISAL, SECOND_APPRAISAL, DESK_REVIEW, FIELD_REVIEW}"
      - name: vendor_code
        type: string
        source: input
        description: Appraisal management company code.
      - name: effective_date
        type: datetime
        source: input
        description: ISO 8601 UTC inspection/effective instant; the left endpoint of the closed 120-day validity window used for overlap detection.
      - name: validity_expires_date
        type: datetime
        source: computed
        description: effective_date plus exactly 120 calendar days; the inclusive right endpoint of the validity window.
      - name: appraised_value_cents
        type: integer
        source: system
        description: Opinion of value captured by the receive action; null until then.
        default: null
      - name: status
        type: enum
        source: system
        description: Valuation order lifecycle state.
        default: ORDERED
        constraints: "one of {ORDERED, RECEIVED, ACCEPTED, REJECTED}"
      - name: rejection_reason
        type: string
        source: system
        description: Reason captured when the review decision is REJECTED; null otherwise.
        default: null

  - name: AppraisalReview
    parent: LoanFile
    common_fields: true
    role: resource
    fields:
      - name: loan_file_id
        type: string
        source: input
        description: FK -> LoanFile.id; the file under valuation review. Created by cascade when the first PRIMARY_APPRAISAL is ordered, never by a direct client call.
      - name: primary_review_status
        type: enum
        source: system
        description: First parallel state dimension - disposition of the primary appraisal review.
        default: PRIMARY_NOT_ORDERED
        constraints: "one of {PRIMARY_NOT_ORDERED, PRIMARY_PENDING_REVIEW, PRIMARY_CLEARED, PRIMARY_ESCALATED}"
      - name: second_valuation_status
        type: enum
        source: system
        description: Second parallel state dimension - progress of the second-valuation requirement, advancing independently of primary_review_status.
        default: SECOND_NOT_REQUIRED
        constraints: "one of {SECOND_NOT_REQUIRED, SECOND_REQUIRED, SECOND_ORDERED, SECOND_RECEIVED, SECOND_RECONCILED}"
      - name: primary_value_cents
        type: integer
        source: computed
        description: appraised_value_cents of the ACCEPTED PRIMARY_APPRAISAL; null until one exists.
        default: null
      - name: second_value_cents
        type: integer
        source: computed
        description: appraised_value_cents of the ACCEPTED SECOND_APPRAISAL; null until one exists.
        default: null
      - name: variance_pct
        type: number
        source: computed
        description: Percentage spread between the two values over the lower value, 2 decimals (see calculations.appraisal_reconciliation); null until both exist.
        default: null
      - name: reconciled_value_cents
        type: integer
        source: computed
        description: Value the file is underwritten to once review completes; drives LoanFile.ltv_pct.
        default: null
      - name: escalation_reason
        type: string
        source: system
        description: Reason recorded when primary_review_status becomes PRIMARY_ESCALATED; null otherwise.
        default: null

  - name: PointsAndFeesItem
    parent: LoanFile
    common_fields: true
    role: resource
    fields:
      - name: loan_file_id
        type: string
        source: input
        description: FK -> LoanFile.id; the file this charge belongs to.
      - name: fee_code
        type: string
        source: input
        description: Line-item code from the fee schedule.
      - name: fee_category
        type: enum
        source: input
        description: Category driving points-and-fees inclusion classification.
        constraints: "one of {ORIGINATION_POINTS, DISCOUNT_POINTS, AFFILIATE_TITLE, THIRD_PARTY_UNAFFILIATED, PMI_UPFRONT, ESCROW_TAXES, PREPAYMENT_PENALTY, LOAN_LEVEL_PRICE_ADJUSTMENT}"
      - name: amount_cents
        type: integer
        source: input
        description: Charge amount.
        constraints: "> 0"
      - name: paid_to_affiliate_flag
        type: boolean
        source: input
        description: True when the charge is retained by an affiliate of the creditor; pulls THIRD_PARTY_UNAFFILIATED charges into the test.
        default: false
      - name: prepaid_finance_charge_flag
        type: boolean
        source: input
        description: True when the charge is a prepaid finance charge financed into the note; included charges with this flag reduce total_loan_amount_cents.
        default: false
      - name: bona_fide_discount_flag
        type: boolean
        source: input
        description: True when discount points are bona fide and therefore excluded from the test.
        default: false
      - name: inclusion_in_test
        type: enum
        source: computed
        description: Classification produced by step 1 of calculations.points_and_fees_test.
        constraints: "one of {INCLUDED, EXCLUDED}"
      - name: status
        type: enum
        source: system
        description: Fee item state; VOIDED items leave every aggregate.
        default: ACTIVE
        constraints: "one of {ACTIVE, VOIDED}"
      - name: void_reason
        type: string
        source: system
        description: Reason captured by the void action; null while ACTIVE.
        default: null

  - name: ExceptionRequest
    parent: LoanFile
    common_fields: true
    role: resource
    fields:
      - name: loan_file_id
        type: string
        source: input
        description: FK -> LoanFile.id; the file seeking the guideline waiver.
      - name: overlay_id
        type: string
        source: input
        description: FK -> InvestorOverlay.id; the breached overlay the waiver targets.
      - name: justification
        type: string
        source: input
        description: Underwriter narrative supporting the waiver.
      - name: compensating_factors
        type: array
        source: input
        description: Compensating-factor codes cited by the requester; array of strings, may be empty.
        default: []
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the requesting Underwriter; may never appear as a signoff user id on this row.
      - name: pinned_metric_value
        type: number
        source: computed
        description: Value of the overlay's rule_metric on the loan file at request time; an approved exception is voided when the live metric no longer equals this pinned value.
      - name: pinned_overlay_version
        type: integer
        source: computed
        description: InvestorOverlay.version observed at request time.
      - name: required_authority_tier
        type: integer
        source: computed
        description: max(InvestorOverlay.required_authority_tier, 2 if InvestorOverlay.severity is MATERIAL else 1); 1 needs a single CreditCommittee signoff, 2 needs a CreditCommittee signoff plus a ChiefCreditOfficer second signature.
        constraints: "1 or 2"
      - name: status
        type: enum
        source: system
        description: Exception lifecycle state.
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, AWAITING_SECOND_SIGNATURE, APPROVED, DENIED, VOIDED}"
      - name: first_signoff_user_id
        type: string
        source: system
        description: X-User-ID of the CreditCommittee member who signed first; null until then.
        default: null
      - name: second_signoff_user_id
        type: string
        source: system
        description: X-User-ID of the ChiefCreditOfficer who added the second signature; null unless required_authority_tier is 2 and the join completed.
        default: null
      - name: decision_reason
        type: string
        source: system
        description: Reason text from the latest decision or void cascade; null while PENDING_REVIEW.
        default: null

  - name: PostCloseAudit
    parent: LoanFile
    common_fields: true
    role: resource
    fields:
      - name: loan_file_id
        type: string
        source: input
        description: FK -> LoanFile.id; the closed file being audited.
      - name: sample_reason
        type: enum
        source: input
        description: Why the file entered the audit sample.
        constraints: "one of {RANDOM, DISCRETIONARY, INVESTOR_REQUEST}"
      - name: status
        type: enum
        source: system
        description: Audit lifecycle state; derived from the aggregate state of its findings once every finding is terminal.
        default: OPEN
        constraints: "one of {OPEN, FINDINGS_ISSUED, CLEARED, MATERIAL_DEFECT}"
      - name: defect_score
        type: integer
        source: computed
        description: Severity-weighted score over non-waived findings (see calculations.audit_grade).
        default: 0
      - name: grade
        type: enum
        source: computed
        description: Audit grade derived from defect_score.
        default: NOT_GRADED
        constraints: "one of {NOT_GRADED, A_CLEAN, B_MINOR, C_MATERIAL}"
      - name: open_finding_count
        type: integer
        source: computed
        description: Count of AuditFinding rows on this audit whose status is ISSUED or REBUTTED.
        default: 0

  - name: AuditFinding
    parent: PostCloseAudit
    common_fields: true
    role: resource
    fields:
      - name: audit_id
        type: string
        source: input
        description: FK -> PostCloseAudit.id; the audit that raised the finding.
      - name: finding_code
        type: string
        source: input
        description: Finding identifier from the audit taxonomy.
      - name: category
        type: enum
        source: input
        description: Which underwriting area the defect sits in.
        constraints: "one of {INCOME_CALCULATION, ATR_DOCUMENTATION, POINTS_AND_FEES, APPRAISAL, SEASONING, OVERLAY_EXCEPTION}"
      - name: severity
        type: enum
        source: input
        description: Severity weight input to the audit grade (MINOR 1, SIGNIFICANT 3, MATERIAL 6).
        constraints: "one of {MINOR, SIGNIFICANT, MATERIAL}"
      - name: status
        type: enum
        source: system
        description: Finding lifecycle state; REBUTTED may cycle back to ISSUED on a RETURN_FOR_MORE_INFO adjudication.
        default: ISSUED
        constraints: "one of {ISSUED, REBUTTED, UPHELD, WAIVED}"
      - name: rebuttal_text
        type: string
        source: system
        description: Latest lender rebuttal narrative; null until the first rebuttal.
        default: null
      - name: rebuttal_round
        type: integer
        source: computed
        description: Number of completed rebuttal cycles on this finding; increments on every rebut action.
        default: 0
      - name: adjudication_note
        type: string
        source: system
        description: Auditor note from the latest adjudication; null until then.
        default: null

state_machines:
  - entity: LoanFile
    shape: branching_with_revision_cycles
    initial_state: DRAFT
    terminal_states: [DENIED]
    transitions:
      - from: DRAFT
        to: DOC_TYPE_SELECTED
        trigger: "POST /loan-files/{id}/doc-type-selection"
        actor: Underwriter
        preconditions:
          - "status == DRAFT"
          - "doc_type IS NULL"
          - "requested doc_type is compatible with DocumentationProgram.program_code per validations[priority=17]"
          - "when doc_type == DSCR: occupancy == INVESTMENT and gross_market_rent_cents IS NOT NULL"
          - "when doc_type IN {BANK_STATEMENT, PROFIT_AND_LOSS}: Borrower.self_employed_flag == true"
        side_effects:
          - "sets doc_type to the requested value (immutable afterwards)"
          - "sets assigned_underwriter_id to the acting X-User-ID"
          - "recomputes pitia_monthly_cents and documented_reserves_months (calculations.pitia_monthly)"
          - "when doc_type == DSCR: recomputes dscr_ratio (calculations.dscr_ratio) and leaves qualifying_income_monthly_cents at 0"
      - from: DOC_TYPE_SELECTED
        to: UNDERWRITING
        trigger: "POST /loan-files/{id}/submit-to-underwriting"
        actor: LoanOfficer
        preconditions:
          - "status == DOC_TYPE_SELECTED"
          - "at least one PointsAndFeesItem with status ACTIVE exists for the file"
        side_effects:
          - "recomputes credit-event seasoning fields (calculations.credit_event_seasoning) against the current logical clock"
          - "recomputes overlay_breach_codes and unresolved_overlay_breach_count (calculations.overlay_breach_evaluation)"
          - "creates the AppraisalReview row for the file when none exists, with primary_review_status PRIMARY_NOT_ORDERED and second_valuation_status set by calculations.appraisal_reconciliation step 1"
          - "recomputes second_valuation_required"
      - from: UNDERWRITING
        to: SUSPENDED
        trigger: "POST /loan-files/{id}/suspend"
        actor: Underwriter
        preconditions:
          - "status == UNDERWRITING"
          - "acting X-User-ID == assigned_underwriter_id"
        side_effects:
          - "records the condition note"
          - "sets atr_documentation_status to INCOMPLETE and safe_harbor_class to NOT_EVALUATED"
        note: "Manual condition issuance; the same target state is also reached by cascade from calculations.appraisal_reconciliation and from an exception denial."
      - from: UNDERWRITING
        to: SUSPENDED
        trigger: "system - cascade link 4 of the appraisal reconciliation chain, or an ExceptionRequest reaching DENIED, or an APPROVED ExceptionRequest being VOIDED"
        actor: system
        preconditions:
          - "status == UNDERWRITING"
          - "unresolved_overlay_breach_count transitions from 0 to a positive value, or the file's reconciled value moved"
        side_effects:
          - "sets securitization_eligible to false"
          - "sets atr_documentation_status to INCOMPLETE and safe_harbor_class to NOT_EVALUATED"
        note: "Cascade-only edge; no client endpoint drives it directly."
      - from: SUSPENDED
        to: UNDERWRITING
        trigger: "POST /loan-files/{id}/clear-conditions"
        actor: Underwriter
        preconditions:
          - "status == SUSPENDED"
          - "acting X-User-ID == assigned_underwriter_id"
          - "unresolved_overlay_breach_count == 0"
        side_effects:
          - "records the clearance note"
          - "recomputes overlay_breach_codes, unresolved_overlay_breach_count and seasoning fields"
        note: "Revision cycle - a file may traverse UNDERWRITING -> SUSPENDED -> UNDERWRITING any number of times."
      - from: UNDERWRITING
        to: APPROVED
        trigger: "POST /loan-files/{id}/approve"
        actor: Underwriter
        preconditions:
          - "status == UNDERWRITING"
          - "acting X-User-ID == assigned_underwriter_id"
          - "an IncomeWorksheet for the file has status ACCEPTED, unless doc_type == DSCR"
          - "points_and_fees_test_result == PASS"
          - "atr_documentation_status IN {DOCUMENTED, EXEMPT} and safe_harbor_class != HIGH_COST_PROHIBITED"
          - "AppraisalReview.primary_review_status == PRIMARY_CLEARED"
          - "AppraisalReview.second_valuation_status IN {SECOND_NOT_REQUIRED, SECOND_RECONCILED}"
          - "seasoning_satisfied == true"
          - "unresolved_overlay_breach_count == 0"
          - "Borrower.fico_score >= DocumentationProgram.min_fico"
          - "ltv_pct <= DocumentationProgram.max_ltv_pct"
          - "documented_reserves_months >= DocumentationProgram.min_reserves_months"
          - "when doc_type != DSCR: dti_pct <= DocumentationProgram.max_dti_pct and residual_income_cents >= DocumentationProgram.min_residual_income_cents"
          - "when doc_type == DSCR: dscr_ratio >= DocumentationProgram.min_dscr"
        side_effects:
          - "recomputes securitization_eligible (calculations.securitization_eligibility)"
      - from: SUSPENDED
        to: DENIED
        trigger: "POST /loan-files/{id}/deny"
        actor: Underwriter
        preconditions:
          - "status == SUSPENDED"
          - "acting X-User-ID == assigned_underwriter_id"
        side_effects:
          - "records the denial reason"
          - "sets securitization_eligible to false"
          - "cascades every ExceptionRequest on the file in status IN {PENDING_REVIEW, AWAITING_SECOND_SIGNATURE} to VOIDED"
      - from: UNDERWRITING
        to: DENIED
        trigger: "POST /loan-files/{id}/deny"
        actor: Underwriter
        preconditions:
          - "status == UNDERWRITING"
          - "acting X-User-ID == assigned_underwriter_id"
        side_effects:
          - "records the denial reason"
          - "sets securitization_eligible to false"
          - "cascades every ExceptionRequest on the file in status IN {PENDING_REVIEW, AWAITING_SECOND_SIGNATURE} to VOIDED"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /loan-files/{id}/close"
        actor: LoanOfficer
        preconditions:
          - "status == APPROVED"
          - "securitization_eligible == true"
        side_effects:
          - "records the closing date"
          - "recomputes securitization_eligible"
      - from: CLOSED
        to: AUDIT_DEFECT
        trigger: "system - cascade link 3 of the audit adjudication chain when the file's PostCloseAudit reaches grade C_MATERIAL"
        actor: system
        preconditions:
          - "status == CLOSED"
          - "the file's PostCloseAudit grade became C_MATERIAL and every AuditFinding on it is terminal"
        side_effects:
          - "sets repurchase_flag to true"
          - "sets securitization_eligible to false"
          - "when pool_id IS NOT NULL: detaches the loan (pool_id -> null) and triggers SecuritizationPool metric recomputation (cascade link 4)"
      - from: AUDIT_DEFECT
        to: CLOSED
        trigger: "system - cascade from an adjudication that regrades the PostCloseAudit below C_MATERIAL (for example a WAIVE on the last MATERIAL finding)"
        actor: system
        preconditions:
          - "status == AUDIT_DEFECT"
          - "the file's PostCloseAudit grade is now IN {A_CLEAN, B_MINOR}"
        side_effects:
          - "sets repurchase_flag to false"
          - "recomputes securitization_eligible"
        note: "Second revision cycle on this entity: CLOSED -> AUDIT_DEFECT -> CLOSED."

  - entity: IncomeWorksheet
    shape: linear_with_recalculation_self_loop
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /income-worksheets/{id}/calculate"
        actor: Underwriter
        preconditions:
          - "status == DRAFT"
          - "LoanFile.status IN {UNDERWRITING, SUSPENDED}"
          - "acting X-User-ID == LoanFile.assigned_underwriter_id"
          - "when method == BANK_STATEMENT: included_month_count >= 1"
        side_effects:
          - "runs the method-specific calculation (calculations.bank_statement_income, calculations.asset_depletion_income, or calculations.profit_and_loss_income) and writes every computed worksheet field"
          - "increments calculation_count by 1"
      - from: CALCULATED
        to: CALCULATED
        trigger: "POST /income-worksheets/{id}/calculate (recalculation after statement-month or bucket changes)"
        actor: Underwriter
        preconditions:
          - "status == CALCULATED"
          - "LoanFile.status IN {UNDERWRITING, SUSPENDED}"
          - "acting X-User-ID == LoanFile.assigned_underwriter_id"
        side_effects:
          - "recomputes every computed worksheet field from current inputs"
          - "increments calculation_count by 1"
        note: "Self-loop; the recalculated figures do not reach the loan file until the worksheet is accepted."
      - from: CALCULATED
        to: ACCEPTED
        trigger: "POST /income-worksheets/{id}/accept"
        actor: Underwriter
        preconditions:
          - "status == CALCULATED"
          - "LoanFile.status IN {UNDERWRITING, SUSPENDED}"
          - "acting X-User-ID == LoanFile.assigned_underwriter_id"
          - "when method == BANK_STATEMENT: included_month_count == DocumentationProgram.statement_period_months"
        side_effects:
          - "any other IncomeWorksheet on the same loan file in status ACCEPTED transitions to SUPERSEDED"
          - "sets LoanFile.qualifying_income_monthly_cents to monthly_qualifying_income_cents"
          - "recomputes LoanFile.dti_pct, LoanFile.residual_income_cents and LoanFile.documented_reserves_months"
          - "sets LoanFile.atr_documentation_status to INCOMPLETE and LoanFile.safe_harbor_class to NOT_EVALUATED (stale-determination invalidation)"
          - "recomputes LoanFile.overlay_breach_codes and LoanFile.unresolved_overlay_breach_count"
          - "increments LoanFile.version by 1"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system - another IncomeWorksheet on the same loan file is accepted"
        actor: system
        preconditions:
          - "status == ACCEPTED"
          - "a sibling worksheet on the same loan_file_id is transitioning CALCULATED -> ACCEPTED"
        side_effects:
          - "no further calculate or accept action is permitted on this row"

  - entity: StatementMonth
    shape: linear
    initial_state: INCLUDED
    terminal_states: [EXCLUDED]
    transitions:
      - from: INCLUDED
        to: EXCLUDED
        trigger: "POST /statement-months/{id}/exclude"
        actor: Underwriter
        preconditions:
          - "inclusion_status == INCLUDED"
          - "parent IncomeWorksheet.status IN {DRAFT, CALCULATED}"
          - "acting X-User-ID == LoanFile.assigned_underwriter_id of the worksheet's loan file"
        side_effects:
          - "records the exclusion reason"
          - "decrements IncomeWorksheet.included_month_count by 1 and recomputes IncomeWorksheet.eligible_deposit_total_cents"
          - "when the worksheet status is CALCULATED: reruns calculations.bank_statement_income over the remaining INCLUDED months, rewrites net_deposit_total_cents / gross_monthly_income_cents / monthly_qualifying_income_cents and increments calculation_count by 1 (worksheet stays CALCULATED)"

  - entity: ValuationOrder
    shape: branching
    initial_state: ORDERED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /valuation-orders/{id}/receive"
        actor: AppraisalReviewer
        preconditions:
          - "status == ORDERED"
          - "LoanFile.status IN {UNDERWRITING, SUSPENDED}"
        side_effects:
          - "stores appraised_value_cents"
          - "when valuation_type == PRIMARY_APPRAISAL: sets AppraisalReview.primary_review_status to PRIMARY_PENDING_REVIEW"
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /valuation-orders/{id}/decision with decision ACCEPTED"
        actor: AppraisalReviewer
        preconditions:
          - "status == RECEIVED"
          - "LoanFile.status IN {UNDERWRITING, SUSPENDED}"
        side_effects:
          - "runs calculations.appraisal_reconciliation, which writes AppraisalReview.primary_value_cents or second_value_cents, advances the matching parallel dimension, and may write variance_pct and reconciled_value_cents"
          - "when reconciled_value_cents changes: recomputes LoanFile.ltv_pct (cascade link 3) which recomputes overlay_breach_codes / unresolved_overlay_breach_count and may cascade the loan file to SUSPENDED (cascade link 4) and void pinned APPROVED ExceptionRequest rows (cascade link 5)"
          - "sets LoanFile.atr_documentation_status to INCOMPLETE and LoanFile.safe_harbor_class to NOT_EVALUATED when reconciled_value_cents changes"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /valuation-orders/{id}/decision with decision REJECTED"
        actor: AppraisalReviewer
        preconditions:
          - "status == RECEIVED"
          - "rejection_reason is present"
        side_effects:
          - "stores rejection_reason"
          - "when valuation_type == PRIMARY_APPRAISAL: resets AppraisalReview.primary_review_status to PRIMARY_NOT_ORDERED and leaves primary_value_cents null"
          - "arms the 30-day re-order buffer measured from this order's effective_date (validations[priority=25])"

  - entity: AppraisalReview
    shape: parallel_dimensions
    dimensions:
      primary_review_status:
        initial: PRIMARY_NOT_ORDERED
        states: [PRIMARY_NOT_ORDERED, PRIMARY_PENDING_REVIEW, PRIMARY_CLEARED, PRIMARY_ESCALATED]
      second_valuation_status:
        initial: SECOND_NOT_REQUIRED
        states: [SECOND_NOT_REQUIRED, SECOND_REQUIRED, SECOND_ORDERED, SECOND_RECEIVED, SECOND_RECONCILED]
    initial_state: PRIMARY_NOT_ORDERED
    terminal_states: []
    note: "One row carries two independent state dimensions. The primary dimension advances with the PRIMARY_APPRAISAL lifecycle; the second dimension advances with the second-valuation requirement and its own order. They are joined only by calculations.appraisal_reconciliation, which needs both values before it can write variance_pct."
    transitions:
      - from: PRIMARY_NOT_ORDERED
        to: PRIMARY_PENDING_REVIEW
        trigger: "POST /valuation-orders/{id}/receive for a PRIMARY_APPRAISAL"
        actor: AppraisalReviewer
        preconditions:
          - "primary_review_status == PRIMARY_NOT_ORDERED"
        side_effects:
          - "no value is published yet; second_valuation_status is untouched"
      - from: PRIMARY_PENDING_REVIEW
        to: PRIMARY_CLEARED
        trigger: "system - PRIMARY_APPRAISAL accepted while second_valuation_required == false, or accepted second valuation reconciles within tolerance"
        actor: system
        preconditions:
          - "primary_review_status == PRIMARY_PENDING_REVIEW"
          - "second_valuation_status IN {SECOND_NOT_REQUIRED, SECOND_RECONCILED} after this reconciliation step"
        side_effects:
          - "sets primary_value_cents and reconciled_value_cents per calculations.appraisal_reconciliation"
      - from: PRIMARY_PENDING_REVIEW
        to: PRIMARY_ESCALATED
        trigger: "system - accepted second valuation whose variance_pct > 10.00"
        actor: system
        preconditions:
          - "primary_review_status == PRIMARY_PENDING_REVIEW"
          - "variance_pct > VARIANCE_ESCALATION_PCT"
        side_effects:
          - "sets escalation_reason to VARIANCE_ABOVE_TOLERANCE"
          - "sets reconciled_value_cents to min(primary_value_cents, second_value_cents)"
      - from: PRIMARY_ESCALATED
        to: PRIMARY_CLEARED
        trigger: "POST /appraisal-reviews/{id}/override-escalation"
        actor: AppraisalReviewer
        preconditions:
          - "primary_review_status == PRIMARY_ESCALATED"
          - "second_valuation_status == SECOND_RECONCILED"
        side_effects:
          - "keeps reconciled_value_cents at the conservative lower value; the override accepts that value, it does not restore the primary appraisal's number"
          - "sets escalation_reason to OVERRIDDEN_BY_REVIEWER"
          - "does not re-run calculations.ltv_recompute, because reconciled_value_cents is unchanged"
      - from: SECOND_NOT_REQUIRED
        to: SECOND_REQUIRED
        trigger: "system - calculations.appraisal_reconciliation step 1 at submit-to-underwriting or after an LTV recomputation"
        actor: system
        preconditions:
          - "LoanFile.second_valuation_required == true"
        side_effects:
          - "no value fields change; the primary dimension is untouched"
      - from: SECOND_REQUIRED
        to: SECOND_ORDERED
        trigger: "POST /valuation-orders with valuation_type SECOND_APPRAISAL"
        actor: "LoanOfficer, Underwriter or AppraisalReviewer - any role permitted on POST /valuation-orders may place the second order"
        preconditions:
          - "second_valuation_status == SECOND_REQUIRED"
        side_effects: []
      - from: SECOND_ORDERED
        to: SECOND_RECEIVED
        trigger: "POST /valuation-orders/{id}/receive for the SECOND_APPRAISAL"
        actor: AppraisalReviewer
        preconditions:
          - "second_valuation_status == SECOND_ORDERED"
        side_effects: []
      - from: SECOND_RECEIVED
        to: SECOND_RECONCILED
        trigger: "POST /valuation-orders/{id}/decision with decision ACCEPTED for the SECOND_APPRAISAL"
        actor: AppraisalReviewer
        preconditions:
          - "second_valuation_status == SECOND_RECEIVED"
          - "primary_value_cents IS NOT NULL"
        side_effects:
          - "writes second_value_cents and variance_pct, then reconciled_value_cents per calculations.appraisal_reconciliation"
          - "moves the primary dimension to PRIMARY_CLEARED when variance_pct <= 10.00 and to PRIMARY_ESCALATED otherwise"

  - entity: ExceptionRequest
    shape: fork_join_on_authority_tier
    initial_state: PENDING_REVIEW
    terminal_states: [DENIED, VOIDED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /exception-requests/{id}/decision with decision APPROVE (tier-1 branch)"
        actor: CreditCommittee
        preconditions:
          - "status == PENDING_REVIEW"
          - "required_authority_tier == 1"
          - "acting X-User-ID != requested_by_user_id"
          - "LoanFile.status IN {UNDERWRITING, SUSPENDED}"
          - "pinned_metric_value still equals the live value of the overlay's rule_metric on the loan file"
        side_effects:
          - "sets first_signoff_user_id to the acting X-User-ID"
          - "recomputes LoanFile.unresolved_overlay_breach_count (the waived overlay stops counting)"
          - "recomputes LoanFile.securitization_eligible"
        note: "Tier-1 branch: single signature, no investor notification."
      - from: PENDING_REVIEW
        to: AWAITING_SECOND_SIGNATURE
        trigger: "POST /exception-requests/{id}/decision with decision APPROVE (tier-2 fork)"
        actor: CreditCommittee
        preconditions:
          - "status == PENDING_REVIEW"
          - "required_authority_tier == 2"
          - "acting X-User-ID != requested_by_user_id"
          - "LoanFile.status IN {UNDERWRITING, SUSPENDED}"
        side_effects:
          - "sets first_signoff_user_id to the acting X-User-ID"
          - "LoanFile.unresolved_overlay_breach_count is NOT reduced yet - the waiver is not effective until the join completes"
      - from: AWAITING_SECOND_SIGNATURE
        to: APPROVED
        trigger: "POST /exception-requests/{id}/decision with decision APPROVE (tier-2 join)"
        actor: ChiefCreditOfficer
        preconditions:
          - "status == AWAITING_SECOND_SIGNATURE"
          - "acting X-User-ID != requested_by_user_id"
          - "acting X-User-ID != first_signoff_user_id"
          - "LoanFile.status IN {UNDERWRITING, SUSPENDED}"
          - "pinned_metric_value still equals the live value of the overlay's rule_metric on the loan file"
        side_effects:
          - "sets second_signoff_user_id to the acting X-User-ID"
          - "sets LoanFile.investor_notification_required to true (branch-exclusive side effect absent from the tier-1 branch)"
          - "recomputes LoanFile.unresolved_overlay_breach_count and LoanFile.securitization_eligible"
      - from: PENDING_REVIEW
        to: DENIED
        trigger: "POST /exception-requests/{id}/decision with decision DENY"
        actor: CreditCommittee
        preconditions:
          - "status == PENDING_REVIEW"
          - "acting X-User-ID != requested_by_user_id"
        side_effects:
          - "stores decision_reason"
          - "when LoanFile.status == UNDERWRITING: cascades the loan file to SUSPENDED"
      - from: AWAITING_SECOND_SIGNATURE
        to: DENIED
        trigger: "POST /exception-requests/{id}/decision with decision DENY"
        actor: ChiefCreditOfficer
        preconditions:
          - "status == AWAITING_SECOND_SIGNATURE"
          - "acting X-User-ID != requested_by_user_id"
        side_effects:
          - "stores decision_reason"
          - "when LoanFile.status == UNDERWRITING: cascades the loan file to SUSPENDED"
      - from: APPROVED
        to: VOIDED
        trigger: "system - the live value of the overlay's rule_metric on the loan file no longer equals pinned_metric_value"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "the loan file metric named by InvestorOverlay.rule_metric changed value"
        side_effects:
          - "sets decision_reason to PINNED_METRIC_CHANGED"
          - "recomputes LoanFile.unresolved_overlay_breach_count (the breach returns)"
          - "when LoanFile.status == UNDERWRITING: cascades the loan file to SUSPENDED"
        note: "Version-pinning-on-approval edge: the waiver is only valid for the exact metric value it was granted against."
      - from: PENDING_REVIEW
        to: VOIDED
        trigger: "system - the loan file reaches DENIED"
        actor: system
        preconditions:
          - "status IN {PENDING_REVIEW, AWAITING_SECOND_SIGNATURE}"
          - "LoanFile.status became DENIED"
        side_effects:
          - "sets decision_reason to LOAN_DENIED"

  - entity: PostCloseAudit
    shape: compound
    initial_state: OPEN
    terminal_states: [CLEARED, MATERIAL_DEFECT]
    note: "Aggregate machine - status and grade are functions of the child AuditFinding rows; the audit never transitions on a direct client action other than finding creation."
    transitions:
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /audit-findings (first finding on this audit)"
        actor: PostCloseAuditor
        preconditions:
          - "status == OPEN"
          - "LoanFile.status IN {CLOSED, AUDIT_DEFECT}"
        side_effects:
          - "recomputes defect_score, grade and open_finding_count (calculations.audit_grade)"
      - from: FINDINGS_ISSUED
        to: CLEARED
        trigger: "system - every AuditFinding on the audit reached a terminal status and grade IN {A_CLEAN, B_MINOR}"
        actor: system
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "open_finding_count == 0"
          - "grade IN {A_CLEAN, B_MINOR}"
        side_effects:
          - "recomputes LoanFile.securitization_eligible"
          - "when LoanFile.status == AUDIT_DEFECT: cascades the loan file back to CLOSED and clears repurchase_flag"
      - from: FINDINGS_ISSUED
        to: MATERIAL_DEFECT
        trigger: "system - every AuditFinding on the audit reached a terminal status and grade == C_MATERIAL"
        actor: system
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "open_finding_count == 0"
          - "grade == C_MATERIAL"
        side_effects:
          - "cascade link 3: sets LoanFile.repurchase_flag true, LoanFile.securitization_eligible false and moves the loan file CLOSED -> AUDIT_DEFECT"
      - from: MATERIAL_DEFECT
        to: CLEARED
        trigger: "system - a later adjudication regrades the audit below C_MATERIAL"
        actor: system
        preconditions:
          - "status == MATERIAL_DEFECT"
          - "grade IN {A_CLEAN, B_MINOR}"
          - "open_finding_count == 0"
        side_effects:
          - "cascades the loan file AUDIT_DEFECT -> CLOSED, clears repurchase_flag and recomputes securitization_eligible"

  - entity: AuditFinding
    shape: cyclic
    initial_state: ISSUED
    terminal_states: [UPHELD, WAIVED]
    transitions:
      - from: ISSUED
        to: REBUTTED
        trigger: "POST /audit-findings/{id}/rebut"
        actor: Underwriter
        preconditions:
          - "status == ISSUED"
          - "parent PostCloseAudit.status == FINDINGS_ISSUED"
          - "the caller holds LoanOfficer or Underwriter per §1.5; a rebuttal carries no X-User-ID binding, so validations[priority=23] does not apply to this endpoint and any user of either role may file it"
        side_effects:
          - "stores rebuttal_text and increments rebuttal_round by 1"
          - "leaves the parent audit's open_finding_count unchanged (REBUTTED still counts as open)"
      - from: REBUTTED
        to: ISSUED
        trigger: "POST /audit-findings/{id}/adjudicate with decision RETURN_FOR_MORE_INFO"
        actor: PostCloseAuditor
        preconditions:
          - "status == REBUTTED"
        side_effects:
          - "stores adjudication_note"
          - "leaves defect_score unchanged (both ISSUED and REBUTTED carry full severity weight)"
        note: "Cycle edge - a finding may loop ISSUED -> REBUTTED -> ISSUED without bound; rebuttal_round records how many loops occurred."
      - from: REBUTTED
        to: UPHELD
        trigger: "POST /audit-findings/{id}/adjudicate with decision UPHOLD"
        actor: PostCloseAuditor
        preconditions:
          - "status == REBUTTED"
        side_effects:
          - "cascade link 1: stores adjudication_note and fixes the finding as a confirmed defect"
          - "cascade link 2: recomputes parent PostCloseAudit.defect_score, grade and open_finding_count; when open_finding_count reaches 0 the audit auto-transitions to CLEARED or MATERIAL_DEFECT"
      - from: ISSUED
        to: UPHELD
        trigger: "POST /audit-findings/{id}/adjudicate with decision UPHOLD (no rebuttal filed)"
        actor: PostCloseAuditor
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "cascade link 1 and 2 as above"
      - from: REBUTTED
        to: WAIVED
        trigger: "POST /audit-findings/{id}/adjudicate with decision WAIVE"
        actor: PostCloseAuditor
        preconditions:
          - "status == REBUTTED"
        side_effects:
          - "removes the finding's severity weight from defect_score and recomputes the parent audit's grade and open_finding_count"
      - from: ISSUED
        to: WAIVED
        trigger: "POST /audit-findings/{id}/adjudicate with decision WAIVE"
        actor: PostCloseAuditor
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "removes the finding's severity weight from defect_score and recomputes the parent audit's grade and open_finding_count"

  - entity: SecuritizationPool
    shape: cyclic
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: REBALANCING
        trigger: "system - cascade link 4: a member loan file is detached because it lost securitization eligibility"
        actor: system
        preconditions:
          - "status == OPEN"
          - "a LoanFile whose pool_id equals this pool moved to AUDIT_DEFECT"
        side_effects:
          - "recomputes aggregate_scheduled_balance_cents, weighted_avg_coupon_pct and member_loan_count from scratch over the remaining members (calculations.pool_metrics_recompute)"
          - "increments version by 1"
      - from: REBALANCING
        to: OPEN
        trigger: "POST /securitization-pools/{id}/loans (a replacement loan is assigned)"
        actor: SecuritizationAnalyst
        preconditions:
          - "status == REBALANCING"
          - "the assigned LoanFile.securitization_eligible == true and LoanFile.status == CLOSED"
        side_effects:
          - "recomputes the three pool metrics from scratch"
          - "increments version by 1"
        note: "Cycle edge - a pool may oscillate OPEN -> REBALANCING -> OPEN as defects are found and replacements delivered."
      - from: OPEN
        to: SETTLED
        trigger: "POST /securitization-pools/{id}/removals with removal_reason SETTLEMENT_FINALIZED"
        actor: SecuritizationAnalyst
        preconditions:
          - "status == OPEN"
          - "member_loan_count becomes 0 after this removal"
        side_effects:
          - "recomputes the three pool metrics from scratch (all zeroes)"
          - "increments version by 1"
        note: "No further assignment or removal is accepted once SETTLED."

concurrency_rules:
  - rule_id: worksheet-create-stale-loan-file
    parent_entity: LoanFile
    write_endpoint: "POST /income-worksheets"
    occ_field: "expected_loan_file_version"
    description: |
      Creating an IncomeWorksheet against a LoanFile whose version has advanced since
      the client last read it is rejected. A new worksheet legitimately supersedes the
      file's previously ACCEPTED worksheet once accepted, so the operation cannot be
      guarded by a state precondition: the writer must prove its view of the loan file
      (income, PITIA, reconciled value, overlay breach set) is the one it based the new
      methodology on, by echoing the version it observed.
    error_id: ERR_STALE_LOAN_FILE_VERSION
    http_status: 412
  - rule_id: pool-assignment-stale-pool
    parent_entity: SecuritizationPool
    write_endpoint: "POST /securitization-pools/{id}/loans"
    occ_field: "expected_pool_version"
    description: |
      Assigning a loan to a SecuritizationPool whose version has advanced since the
      analyst last read its aggregate balance and weighted-average coupon is rejected.
      Adding a different eligible loan is legitimate under the product semantics, so no
      state precondition rejects it; the analyst must echo the pool version their
      concentration arithmetic was based on.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

calculations:
  - name: pitia_monthly
    trigger: "LoanFile creation, doc-type selection, and any change to loan_amount_cents-derived inputs; recomputed before every reserves, DTI, residual-income and DSCR evaluation"
    algorithm: threshold
    formula: |
      r = note_rate_pct / 100 / 12                      # exact decimal, no intermediate rounding
      if amortization_type == INTEREST_ONLY:
          principal_and_interest_cents = round_half_up(loan_amount_cents * r)
      else:
          principal_and_interest_cents = round_half_up(loan_amount_cents * r / (1 - (1 + r) ** (-term_months)))
      pitia_monthly_cents = principal_and_interest_cents
                          + monthly_taxes_cents + monthly_insurance_cents + monthly_hoa_cents
      documented_reserves_months = round_half_up(Borrower.verified_liquid_assets_cents / pitia_monthly_cents, 2)
      residual_income_cents = qualifying_income_monthly_cents
                            - Borrower.monthly_debt_obligations_cents - pitia_monthly_cents
      dti_pct = null if qualifying_income_monthly_cents == 0
                else round_half_up((Borrower.monthly_debt_obligations_cents + pitia_monthly_cents)
                                   * 100 / qualifying_income_monthly_cents, 2)
    input_set: "Exactly one LoanFile row plus its Borrower; no sibling loans participate."
    constants:
      MONTHS_PER_YEAR: 12
    precision: "principal_and_interest_cents and pitia_monthly_cents are whole cents, round_half_up applied once at the end of the branch; documented_reserves_months and dti_pct 2 decimals round_half_up"
    variants:
      - name: interest_only_branch
        when: "amortization_type == INTEREST_ONLY"
        difference: "Skips the amortization factor entirely; payment is rate times balance, so PITIA is strictly lower than the amortizing branch for the same inputs."
      - name: fully_amortizing_branch
        when: "amortization_type == FULLY_AMORTIZING"
        difference: "Applies the annuity factor over term_months; the non-linear (1+r)**(-n) term makes the result sensitive to rate and term together."

  - name: bank_statement_income
    trigger: "POST /income-worksheets/{id}/calculate when method == BANK_STATEMENT; rerun by POST /statement-months/{id}/exclude when the worksheet is CALCULATED"
    algorithm: aggregation
    formula: |
      # STEP ORDER IS NORMATIVE. Rounding happens per month BEFORE summing.
      months = StatementMonth rows where worksheet_id == this.id AND inclusion_status == INCLUDED
      included_month_count = count(months)
      if included_month_count == 0: reject with ERR_NO_INCLUDED_STATEMENT_MONTHS
      eligible_deposit_total_cents = sum(m.eligible_deposit_cents for m in months)
      divisor = DocumentationProgram.statement_period_months          # FIXED; zero-deposit months still consume a slot
      gross_monthly_income_cents = round_half_up(eligible_deposit_total_cents / divisor)
      factor_pct = DocumentationProgram.default_expense_factor_pct if expense_factor_source == PROGRAM_DEFAULT
                   else cpa_expense_factor_pct
      expense_factor_pct_applied = factor_pct
      # step 1: per-month expense factor, each rounded half-up to the cent
      net_deposit_total_cents = sum(round_half_up(m.eligible_deposit_cents * (100 - factor_pct) / 100)
                                    for m in months)
      # step 2: average the already-rounded monthly nets
      pre_ownership_monthly_cents = round_half_up(net_deposit_total_cents / divisor)
      # step 3: apply the borrower's ownership share last
      monthly_qualifying_income_cents = round_half_up(pre_ownership_monthly_cents
                                                      * Borrower.entity_ownership_pct / 100)
    input_set: "StatementMonth rows of this worksheet with inclusion_status == INCLUDED only; EXCLUDED months contribute neither to the numerator nor to the divisor, but the divisor is the program's fixed statement_period_months regardless of how many months are INCLUDED."
    constants:
      PERCENT_BASE: 100
    precision: "Whole cents. Three round_half_up applications, in the pinned order per-month -> average -> ownership. Rounding the aggregate once at the end instead (round_half_up(eligible_deposit_total_cents * (100 - factor_pct) / 100)) yields a different net_deposit_total_cents and is explicitly NOT the rule."
    variants:
      - name: PROGRAM_DEFAULT_FACTOR
        when: "expense_factor_source == PROGRAM_DEFAULT"
        difference: "Uses DocumentationProgram.default_expense_factor_pct; sets variant_applied to PROGRAM_DEFAULT_FACTOR."
      - name: CPA_LETTER_FACTOR
        when: "expense_factor_source == CPA_LETTER and cpa_expense_factor_pct >= DocumentationProgram.min_expense_factor_pct"
        difference: "Uses the CPA-attested factor instead of the program default, so the identical set of statement months produces a different monthly_qualifying_income_cents; sets variant_applied to CPA_LETTER_FACTOR."

  - name: asset_depletion_income
    trigger: "POST /income-worksheets/{id}/calculate when method == ASSET_DEPLETION"
    algorithm: waterfall_allocation
    formula: |
      # STEP ORDER IS NORMATIVE. Each bucket product is rounded half-up BEFORE the sum.
      retirement_factor = 1.00 if Borrower.age_years >= RETIREMENT_FULL_ACCESS_AGE else 0.70
      checking_component  = round_half_up(asset_bucket_checking_cents  * 1.00)
      brokerage_component = round_half_up(asset_bucket_brokerage_cents * 0.90)
      retirement_component = round_half_up(asset_bucket_retirement_cents * retirement_factor)
      eligible_assets_after_haircut_cents = checking_component + brokerage_component + retirement_component
      reserves_required_cents = DocumentationProgram.min_reserves_months * LoanFile.pitia_monthly_cents
      depletable_assets_cents = max(0, eligible_assets_after_haircut_cents - reserves_required_cents)
      gross_monthly_income_cents = round_half_up(depletable_assets_cents
                                                 / DocumentationProgram.depletion_horizon_months)
      monthly_qualifying_income_cents = gross_monthly_income_cents
      variant_applied = ASSET_DEPLETION_STANDARD
    input_set: "The three asset buckets supplied on this worksheet plus the Borrower's age and the loan file's current pitia_monthly_cents. No StatementMonth rows participate."
    constants:
      RETIREMENT_FULL_ACCESS_AGE: 60
      BROKERAGE_HAIRCUT_FACTOR: 0.90
      RETIREMENT_HAIRCUT_FACTOR: 0.70
    precision: "Whole cents; per-bucket round_half_up BEFORE summation (summing the raw products and rounding once produces a different eligible_assets_after_haircut_cents and is NOT the rule). The final quotient is rounded half-up once."
    variants:
      - name: retirement_full_access
        when: "Borrower.age_years >= 60"
        difference: "Retirement balances enter at 100 percent instead of 70 percent, raising both eligible_assets_after_haircut_cents and the monthly figure."
      - name: retirement_haircut
        when: "Borrower.age_years < 60"
        difference: "Retirement balances are cut to 70 percent."

  - name: profit_and_loss_income
    trigger: "POST /income-worksheets/{id}/calculate when method == PROFIT_AND_LOSS"
    algorithm: aggregation
    formula: |
      if p_and_l_period_months != DocumentationProgram.statement_period_months:
          reject with ERR_INVALID_REQUEST
      gross_monthly_income_cents = round_half_up(p_and_l_net_income_cents / p_and_l_period_months)
      monthly_qualifying_income_cents = round_half_up(gross_monthly_income_cents
                                                      * Borrower.entity_ownership_pct / 100)
      expense_factor_pct_applied = null      # expenses are already inside the CPA statement
      variant_applied = PL_NET_INCOME
    input_set: "The single p_and_l_net_income_cents figure on this worksheet; no expense factor and no statement months participate."
    constants:
      PERCENT_BASE: 100
    precision: "Whole cents; round_half_up after the division, then again after the ownership scaling."

  - name: dscr_ratio
    trigger: "LoanFile doc-type selection when doc_type == DSCR, and any recomputation of pitia_monthly_cents on a DSCR file"
    algorithm: threshold
    formula: |
      if doc_type != DSCR: dscr_ratio = null
      elif lease_rent_cents IS NOT NULL and occupancy == INVESTMENT:
          qualifying_rent_cents = min(lease_rent_cents,
                                      round_half_up(gross_market_rent_cents * LEASE_OVERAGE_CAP_FACTOR))
          variant = LEASE_IN_PLACE
      else:
          qualifying_rent_cents = round_half_up(gross_market_rent_cents * MARKET_RENT_VACANCY_FACTOR)
          variant = MARKET_RENT_1007
      dscr_ratio = round_half_up(qualifying_rent_cents / pitia_monthly_cents, 4)
    input_set: "One LoanFile row; the accepted IncomeWorksheet never feeds this ratio and DSCR files keep qualifying_income_monthly_cents at 0."
    constants:
      LEASE_OVERAGE_CAP_FACTOR: 1.20
      MARKET_RENT_VACANCY_FACTOR: 0.75
    precision: "4 decimals, round_half_up, single rounding of the final quotient; qualifying_rent_cents is whole cents."
    variants:
      - name: LEASE_IN_PLACE
        when: "lease_rent_cents IS NOT NULL and occupancy == INVESTMENT"
        difference: "Uses contract rent capped at 120 percent of market rent - a higher ratio than the market-rent variant whenever the lease exceeds 75 percent of market rent."
      - name: MARKET_RENT_1007
        when: "lease_rent_cents IS NULL or occupancy != INVESTMENT"
        difference: "Uses 75 percent of appraiser-opined market rent, producing a materially lower ratio on the same property and payment."

  - name: points_and_fees_test
    trigger: "POST /loan-files/{id}/points-and-fees-test; steps 1-3 also rerun on POST /points-and-fees-items and POST /points-and-fees-items/{id}/void, with steps 4-5 rerun only when points_and_fees_test_result != NOT_TESTED"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS NORMATIVE. The cap tier depends on total_loan_amount_cents, which
      # itself depends on which items were classified INCLUDED, so the order below is the only
      # thing that makes the result well defined.
      # step 1 - classify each PointsAndFeesItem with status == ACTIVE:
      #   INCLUDED when fee_category IN {ORIGINATION_POINTS, AFFILIATE_TITLE, PMI_UPFRONT,
      #                                  PREPAYMENT_PENALTY, LOAN_LEVEL_PRICE_ADJUSTMENT}
      #   INCLUDED when fee_category == DISCOUNT_POINTS AND bona_fide_discount_flag == false
      #   INCLUDED when fee_category == THIRD_PARTY_UNAFFILIATED AND paid_to_affiliate_flag == true
      #   EXCLUDED otherwise (ESCROW_TAXES is always EXCLUDED)
      # step 2
      points_and_fees_total_cents = sum(i.amount_cents for i in items if i.inclusion_in_test == INCLUDED)
      # step 3
      financed_prepaid_cents = sum(i.amount_cents for i in items
                                   if i.inclusion_in_test == INCLUDED and i.prepaid_finance_charge_flag)
      total_loan_amount_cents = loan_amount_cents - financed_prepaid_cents
      # step 4 - tier selection on the value produced by step 3
      if total_loan_amount_cents >= HOEPA_TIER_BOUNDARY_CENTS:
          points_and_fees_cap_cents = round_half_up(total_loan_amount_cents * LARGE_LOAN_CAP_PCT / 100)
      else:
          points_and_fees_cap_cents = min(round_half_up(total_loan_amount_cents * SMALL_LOAN_CAP_PCT / 100),
                                          SMALL_LOAN_FLAT_CAP_CENTS)
      # step 5 - strict comparison
      points_and_fees_test_result = FAIL if points_and_fees_total_cents > points_and_fees_cap_cents else PASS
    input_set: "PointsAndFeesItem rows of this loan file with status == ACTIVE; VOIDED items are absent from every sum in steps 2 and 3."
    constants:
      HOEPA_TIER_BOUNDARY_CENTS: 2486600
      LARGE_LOAN_CAP_PCT: 5.00
      SMALL_LOAN_CAP_PCT: 8.00
      SMALL_LOAN_FLAT_CAP_CENTS: 124300
    precision: "Whole cents; the cap is rounded half-up once. The boundary is inclusive on the large-loan side: total_loan_amount_cents == 2486600 uses the 5.00 percent cap, 2486599 uses the small-loan branch."

  - name: credit_event_seasoning
    trigger: "POST /loan-files/{id}/submit-to-underwriting, POST /loan-files/{id}/clear-conditions, and every overlay evaluation"
    algorithm: chronological
    formula: |
      candidates = CreditEvent rows where borrower_id == LoanFile.borrower_id AND documented_flag == true
      if candidates is empty:
          governing_credit_event_id = null; seasoning_months_required = 0
          seasoning_months_elapsed = 0; seasoning_satisfied = true
      else:
          for e in candidates:
              required(e) = DocumentationProgram.seasoning_matrix[e.event_type]
              # whole calendar months between UTC dates, ignoring time of day
              elapsed(e) = 12 * (year(now) - year(e.completion_date)) + (month(now) - month(e.completion_date))
              if day(now) < day(e.completion_date): elapsed(e) = elapsed(e) - 1
              deficit(e) = required(e) - elapsed(e)
          governing = the candidate with the greatest deficit(e);
                      ties broken by latest completion_date (DESC), then by earliest created_at (ASC)
          governing_credit_event_id = governing.id
          seasoning_months_required = required(governing)
          seasoning_months_elapsed = elapsed(governing)
          seasoning_satisfied = seasoning_months_elapsed >= seasoning_months_required
    input_set: "CreditEvent rows of the loan file's Borrower with documented_flag == true; undocumented events are ignored entirely. `now` is the current logical clock instant (default 2026-08-01T00:00:00Z)."
    constants:
      SEASONING_COMPARISON: ">= (exactly meeting the requirement satisfies it)"
    precision: "Whole months; date-component arithmetic only, never day counts."

  - name: overlay_breach_evaluation
    trigger: "POST /loan-files/{id}/submit-to-underwriting, POST /loan-files/{id}/clear-conditions, IncomeWorksheet acceptance, LTV recomputation, and every ExceptionRequest decision"
    algorithm: constraint_propagation
    formula: |
      applicable = InvestorOverlay rows where investor_code == LoanFile.investor_code
                   AND (applies_to_program_code IS NULL
                        OR applies_to_program_code == DocumentationProgram.program_code)
      for o in applicable sorted by overlay_code ASC:
          metric = MIN_FICO              -> Borrower.fico_score
                   MAX_LTV_PCT           -> LoanFile.ltv_pct
                   MIN_DSCR              -> LoanFile.dscr_ratio (breach skipped when null)
                   MAX_DTI_PCT           -> LoanFile.dti_pct (breach skipped when null)
                   MIN_RESERVES_MONTHS   -> LoanFile.documented_reserves_months
                   MIN_SEASONING_MONTHS  -> LoanFile.seasoning_months_elapsed
                   MAX_LOAN_AMOUNT_CENTS -> LoanFile.loan_amount_cents
          satisfied = metric >= o.threshold_value if o.comparator == GTE
                      else metric <= o.threshold_value
          if not satisfied: append o.overlay_code to overlay_breach_codes
      overlay_breach_codes is emitted in ascending overlay_code order
      unresolved_overlay_breach_count = count of breached overlays o for which no ExceptionRequest
          exists with loan_file_id == this loan AND overlay_id == o.id AND status == APPROVED
    input_set: "InvestorOverlay rows matching the loan's investor_code, filtered by program applicability; overlays whose metric is null on this file (DSCR/DTI on the wrong doc type) are skipped rather than breached."
    constants:
      SORT_KEY: "overlay_code ASC"
    precision: "Comparisons use the metric's declared decimal precision; no rounding is applied at comparison time."

  - name: appraisal_reconciliation
    trigger: "POST /loan-files/{id}/submit-to-underwriting (step 1 only), POST /valuation-orders/{id}/receive, and POST /valuation-orders/{id}/decision"
    algorithm: interval_merge
    formula: |
      # step 1 - requirement determination (recomputed whenever ltv_pct changes)
      second_valuation_required = (ltv_pct > DocumentationProgram.second_valuation_ltv_threshold_pct)
                               OR (loan_amount_cents >= DocumentationProgram.second_valuation_loan_amount_threshold_cents)
                               OR (purpose == CASH_OUT_REFI AND doc_type == BANK_STATEMENT)
      if second_valuation_required and AppraisalReview.second_valuation_status == SECOND_NOT_REQUIRED:
          second_valuation_status = SECOND_REQUIRED
      # step 2 - on ACCEPTED PRIMARY_APPRAISAL
      primary_value_cents = order.appraised_value_cents
      if second_valuation_status == SECOND_NOT_REQUIRED:
          reconciled_value_cents = primary_value_cents; primary_review_status = PRIMARY_CLEARED
      # step 3 - on ACCEPTED SECOND_APPRAISAL (requires primary_value_cents already set)
      second_value_cents = order.appraised_value_cents
      lo = min(primary_value_cents, second_value_cents); hi = max(primary_value_cents, second_value_cents)
      variance_pct = round_half_up((hi - lo) * 100 / lo, 2)
      second_valuation_status = SECOND_RECONCILED
      if variance_pct > VARIANCE_ESCALATION_PCT:
          reconciled_value_cents = lo
          primary_review_status = PRIMARY_ESCALATED
          escalation_reason = VARIANCE_ABOVE_TOLERANCE
      else:
          reconciled_value_cents = primary_value_cents
          primary_review_status = PRIMARY_CLEARED
    input_set: "The loan file's ValuationOrder rows with status == ACCEPTED, at most one per valuation_type; REJECTED and RECEIVED orders publish no value."
    constants:
      VARIANCE_ESCALATION_PCT: 10.00
      VALIDITY_WINDOW_DAYS: 120
      REORDER_BUFFER_DAYS: 30
    precision: "variance_pct 2 decimals round_half_up; the denominator is always the LOWER of the two values (using the higher value or their average yields a different percentage and is NOT the rule). The escalation comparison is strict >, so exactly 10.00 percent clears."

  - name: ltv_recompute
    trigger: "LoanFile creation, and any change to AppraisalReview.reconciled_value_cents"
    algorithm: threshold
    formula: |
      basis_cents = AppraisalReview.reconciled_value_cents if it is not null else property_value_cents
      if purpose == PURCHASE: basis_cents = min(basis_cents, purchase_price_cents)
      ltv_pct = round_half_up(loan_amount_cents * 100 / basis_cents, 2)
      # cascade: recompute second_valuation_required, then overlay_breach_evaluation
    input_set: "One LoanFile row plus its AppraisalReview, if any."
    constants:
      PERCENT_BASE: 100
    precision: "2 decimals, round_half_up, single rounding."

  - name: atr_determination
    trigger: "POST /loan-files/{id}/atr-determination"
    algorithm: weighted_scoring
    formula: |
      if DocumentationProgram.atr_exempt_flag and occupancy == INVESTMENT:
          atr_documentation_status = EXEMPT
          safe_harbor_class = EXEMPT_BUSINESS_PURPOSE
          rate_spread_pct = round_half_up(note_rate_pct - apor_pct, 3)
      else:
          accepted_worksheet_exists = an IncomeWorksheet on this file has status == ACCEPTED
          # Documentation completeness only - it asks whether the ability-to-repay file is
          # DOCUMENTED, never whether the documented numbers clear the program ceilings.
          # Program eligibility lives in validations[priority=36..38] and is deliberately NOT
          # folded in here, so a fully documented file whose DTI is above the program maximum
          # reaches the DTI rule instead of being masked by validations[priority=19].
          docs_complete = accepted_worksheet_exists
                          AND dti_pct IS NOT NULL
                          AND documented_reserves_months IS NOT NULL
                          AND residual_income_cents IS NOT NULL
          atr_documentation_status = DOCUMENTED if docs_complete else INCOMPLETE
          rate_spread_pct = round_half_up(note_rate_pct - apor_pct, 3)
          spread_threshold = FIRST_LIEN_HIGHER_PRICED_SPREAD_PCT if lien_position == FIRST
                             else SECOND_LIEN_HIGHER_PRICED_SPREAD_PCT
          if points_and_fees_test_result == FAIL:
              safe_harbor_class = HIGH_COST_PROHIBITED
          elif not docs_complete:
              safe_harbor_class = NOT_EVALUATED
          elif rate_spread_pct > spread_threshold:
              safe_harbor_class = HIGHER_PRICED_NO_PRESUMPTION
          else:
              safe_harbor_class = ATR_DOCUMENTED_NO_SAFE_HARBOR
    input_set: "The loan file's own computed fields plus the existence of an ACCEPTED IncomeWorksheet. No qualified-mortgage safe harbour is ever granted: the best attainable class is ATR_DOCUMENTED_NO_SAFE_HARBOR."
    constants:
      FIRST_LIEN_HIGHER_PRICED_SPREAD_PCT: 6.500
      SECOND_LIEN_HIGHER_PRICED_SPREAD_PCT: 8.500
    precision: "rate_spread_pct 3 decimals round_half_up; the higher-priced comparison is strict >, so a spread exactly equal to the threshold stays ATR_DOCUMENTED_NO_SAFE_HARBOR."
    variants:
      - name: business_purpose_exemption
        when: "DocumentationProgram.atr_exempt_flag and occupancy == INVESTMENT"
        difference: "Skips every documentation test and lands on EXEMPT / EXEMPT_BUSINESS_PURPOSE even when no income worksheet exists."
      - name: consumer_purpose_documentation
        when: "not (DocumentationProgram.atr_exempt_flag and occupancy == INVESTMENT)"
        difference: "Requires an accepted worksheet and non-null DTI, reserves and residual income before any class above NOT_EVALUATED is assigned, then classifies on the rate spread."

  - name: audit_grade
    trigger: "POST /audit-findings, POST /audit-findings/{id}/rebut, and POST /audit-findings/{id}/adjudicate"
    algorithm: weighted_scoring
    formula: |
      findings = AuditFinding rows where audit_id == this.id
      weight(f) = 1 if f.severity == MINOR else 3 if f.severity == SIGNIFICANT else 6
      defect_score = sum(weight(f) for f in findings if f.status IN {ISSUED, REBUTTED, UPHELD})
      open_finding_count = count(f for f in findings if f.status IN {ISSUED, REBUTTED})
      grade = A_CLEAN   if defect_score == 0
              B_MINOR   if 1 <= defect_score <= MATERIAL_SCORE_THRESHOLD - 1
              C_MATERIAL if defect_score >= MATERIAL_SCORE_THRESHOLD
    input_set: "All AuditFinding rows of the audit; WAIVED findings are the only ones excluded from defect_score, and both ISSUED and REBUTTED carry full weight so filing a rebuttal never improves the score."
    constants:
      WEIGHT_MINOR: 1
      WEIGHT_SIGNIFICANT: 3
      WEIGHT_MATERIAL: 6
      MATERIAL_SCORE_THRESHOLD: 6
    precision: "Integer score; the C_MATERIAL boundary is inclusive (a score of exactly 6 is material, 5 is B_MINOR)."

  - name: pool_metrics_recompute
    trigger: "POST /securitization-pools/{id}/loans, POST /securitization-pools/{id}/removals, and the cascade that detaches an AUDIT_DEFECT loan"
    algorithm: aggregation
    formula: |
      members = LoanFile rows where pool_id == pool.id AND status == CLOSED
      member_loan_count = count(members)
      aggregate_scheduled_balance_cents = sum(m.loan_amount_cents for m in members)
      if aggregate_scheduled_balance_cents == 0:
          weighted_avg_coupon_pct = 0.0000
      else:
          weighted_avg_coupon_pct = round_half_up(
              sum(m.loan_amount_cents * m.note_rate_pct for m in members)
              / aggregate_scheduled_balance_cents, 4)
    input_set: "Only LoanFile rows whose pool_id equals this pool AND whose status is exactly CLOSED; a detached (pool_id null) or AUDIT_DEFECT loan is absent from all three metrics."
    constants:
      RECOMPUTE_MODE: "full recomputation from the member set; incremental deltas are forbidden because they accumulate rounding drift in weighted_avg_coupon_pct"
    precision: "aggregate_scheduled_balance_cents whole cents; weighted_avg_coupon_pct 4 decimals round_half_up applied once to the final quotient."

  - name: securitization_eligibility
    trigger: "LoanFile approval, closing, every points-and-fees recomputation, every ATR determination, every exception decision, and every audit grade change"
    algorithm: constraint_propagation
    formula: |
      securitization_eligible =
            status IN {APPROVED, CLOSED}
        AND points_and_fees_test_result == PASS
        AND atr_documentation_status IN {DOCUMENTED, EXEMPT}
        AND safe_harbor_class != HIGH_COST_PROHIBITED
        AND seasoning_satisfied == true
        AND unresolved_overlay_breach_count == 0
        AND AppraisalReview.primary_review_status == PRIMARY_CLEARED
        AND AppraisalReview.second_valuation_status IN {SECOND_NOT_REQUIRED, SECOND_RECONCILED}
        AND repurchase_flag == false
        AND no PostCloseAudit row for this loan file has grade == C_MATERIAL
    input_set: "The loan file's own computed fields, its AppraisalReview row, and its PostCloseAudit rows."
    constants:
      REQUIRED_CONJUNCTS: 10
    precision: "Boolean; every conjunct must hold."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
# Ordering doctrine for this domain: authentication, then authorization, then
# existence, then request shape, then optimistic-concurrency, then state
# preconditions, then business rules in the order
#   business_safety (consumer-protection / compliance)
#   -> business_temporal (valuation and statement windows)
#   -> business_constraint (uniqueness, sufficiency of documentation)
#   -> business_referential (pool and exception linkage integrity)
#   -> business_fiscal (capacity, authority limits, pool capacity)
# Compliance outranks fiscal capacity: a loan that fails the points-and-fees
# test must be reported as prohibited even when it also blows the DTI cap.
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and non-empty (a header sent as an empty or whitespace-only string counts as absent)"
    error_id: ERR_MISSING_ROLE_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role value is one of the eight roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "X-User-ID header is present and non-empty"
    error_id: ERR_MISSING_USER_HEADER
    http_status: 401
    applies_to: all

  - priority: 4
    category: auth
    check: "the authenticated role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 5
    category: existence
    check: "every referenced resource exists, validated left-to-right: path segments first (parent before child), then request-body foreign keys in the order the fields are listed in the endpoint's input"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (ERR_PROGRAM_NOT_FOUND, ERR_OVERLAY_NOT_FOUND, ERR_BORROWER_NOT_FOUND, ERR_LOAN_FILE_NOT_FOUND, ERR_WORKSHEET_NOT_FOUND, ERR_STATEMENT_MONTH_NOT_FOUND, ERR_VALUATION_ORDER_NOT_FOUND, ERR_FEE_ITEM_NOT_FOUND, ERR_EXCEPTION_NOT_FOUND, ERR_AUDIT_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_POOL_NOT_FOUND, ERR_REVIEW_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path parameters or foreign-key inputs"

  - priority: 6
    category: state
    check: "request shape is valid: every non-optional input field is present, every value has the declared type, every enum value is a declared member, and no unknown field is supplied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 7
    category: business_constraint
    check: "numeric and calendar domains hold: *_cents >= 0, 0 < note_rate_pct <= 25.000, 0 <= *_pct <= 100 for share and threshold percentages, 300 <= fico_score <= 850, 1 <= term_months <= 480, period_start_date < period_end_date, and completion_date is not in the future relative to the logical clock"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /borrowers, POST /credit-events, POST /loan-files, POST /documentation-programs, POST /investor-overlays, POST /income-worksheets/{id}/statement-months, POST /points-and-fees-items"

  - priority: 8
    category: state
    check: "expected_loan_file_version equals the target LoanFile's current version"
    error_id: ERR_STALE_LOAN_FILE_VERSION
    http_status: 412
    applies_to: "POST /income-worksheets"

  - priority: 9
    category: state
    check: "expected_pool_version equals the target SecuritizationPool's current version"
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
    applies_to: "POST /securitization-pools/{id}/loans, POST /securitization-pools/{id}/removals"

  - priority: 10
    category: state
    check: "the LoanFile is in a state from which the requested trigger is declared in §1.2 (doc-type-selection requires DRAFT, submit-to-underwriting requires DOC_TYPE_SELECTED, suspend and approve require UNDERWRITING, clear-conditions requires SUSPENDED, close requires APPROVED, and DENIED accepts no trigger). For the child-creation endpoints: POST /income-worksheets, POST /valuation-orders and POST /exception-requests require DOC_TYPE_SELECTED, UNDERWRITING or SUSPENDED; POST /post-close-audits requires CLOSED or AUDIT_DEFECT; POST /points-and-fees-items is legal in every status except DENIED, so a post-close fee correction is accepted and re-runs the points-and-fees test on the closed file"
    error_id: ERR_LOAN_FILE_STATE_INVALID
    http_status: 409
    applies_to: "every POST under /loan-files/{id}/, POST /income-worksheets, POST /valuation-orders, POST /points-and-fees-items, POST /exception-requests, POST /post-close-audits"

  - priority: 11
    category: state
    check: "the IncomeWorksheet is in the required state: calculate requires DRAFT or CALCULATED, accept requires CALCULATED, statement-month attachment requires DRAFT or CALCULATED, and a SUPERSEDED worksheet accepts no trigger"
    error_id: ERR_WORKSHEET_STATE_INVALID
    http_status: 409
    applies_to: "POST /income-worksheets/{id}/statement-months, POST /income-worksheets/{id}/calculate, POST /income-worksheets/{id}/accept"

  - priority: 12
    category: state
    check: "the StatementMonth is INCLUDED when exclude is requested; excluding an already EXCLUDED month is rejected rather than treated as a no-op"
    error_id: ERR_STATEMENT_MONTH_STATE_INVALID
    http_status: 409
    applies_to: "POST /statement-months/{id}/exclude"

  - priority: 13
    category: state
    check: "the ValuationOrder is ORDERED when receive is requested and RECEIVED when decision is requested; a second receive or a second decision on the same order is rejected"
    error_id: ERR_VALUATION_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /valuation-orders/{id}/receive, POST /valuation-orders/{id}/decision"

  - priority: 14
    category: state
    check: "the ExceptionRequest is PENDING_REVIEW or AWAITING_SECOND_SIGNATURE when decision is requested; APPROVED, DENIED and VOIDED accept no further decision"
    error_id: ERR_EXCEPTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /exception-requests/{id}/decision"

  - priority: 15
    category: state
    check: "the AuditFinding write is state-legal: the parent PostCloseAudit is OPEN or FINDINGS_ISSUED when a finding is filed (CLEARED and MATERIAL_DEFECT are closed to new findings), the finding is ISSUED when rebut is requested, and the finding is ISSUED or REBUTTED when adjudicate is requested - UPHELD and WAIVED are terminal and accept neither call, and decision RETURN_FOR_MORE_INFO additionally requires the finding to be REBUTTED because there is no rebuttal to return otherwise"
    error_id: ERR_FINDING_STATE_INVALID
    http_status: 409
    applies_to: "POST /audit-findings, POST /audit-findings/{id}/rebut, POST /audit-findings/{id}/adjudicate"

  - priority: 16
    category: state
    check: "the SecuritizationPool is OPEN or REBALANCING for membership writes; a SETTLED pool accepts neither assignments nor removals, and a SETTLEMENT_FINALIZED removal is refused unless member_loan_count would become 0"
    error_id: ERR_POOL_STATE_INVALID
    http_status: 409
    applies_to: "POST /securitization-pools/{id}/loans, POST /securitization-pools/{id}/removals"

  - priority: 17
    category: business_safety
    check: "the selected doc_type is offered by the loan's DocumentationProgram: BANK_STATEMENT requires program_code BANK_STATEMENT_12MO or BANK_STATEMENT_24MO, ASSET_DEPLETION requires ASSET_DEPLETION, DSCR requires DSCR, PROFIT_AND_LOSS requires PROFIT_AND_LOSS. Any other pairing is refused, and every downstream worksheet must carry the loan's doc_type. The same rule also enforces the transition data preconditions of state_machines.LoanFile DRAFT -> DOC_TYPE_SELECTED: DSCR additionally requires occupancy == INVESTMENT and a non-null gross_market_rent_cents, and BANK_STATEMENT or PROFIT_AND_LOSS additionally require Borrower.self_employed_flag == true."
    error_id: ERR_DOC_TYPE_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /loan-files/{id}/doc-type-selection, POST /income-worksheets"

  - priority: 18
    category: business_safety
    check: "points_and_fees_test_result is not FAIL. A loan whose included points and fees exceed the tier cap is a high-cost loan the lender does not originate: it can neither be approved, closed, nor assigned to a pool."
    error_id: ERR_HIGH_COST_LOAN_PROHIBITED
    http_status: 422
    applies_to: "POST /loan-files/{id}/approve, POST /loan-files/{id}/close, POST /securitization-pools/{id}/loans"

  - priority: 19
    category: business_safety
    check: "atr_documentation_status is DOCUMENTED or EXEMPT before approval; INCOMPLETE is refused, and safe_harbor_class must not be NOT_EVALUATED. This rule tests only documentation completeness, so a file with an accepted worksheet reaches validations[priority=36..38] with its program-ceiling breaches intact."
    error_id: ERR_ATR_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /loan-files/{id}/approve, POST /securitization-pools/{id}/loans"

  - priority: 20
    category: business_safety
    check: "seasoning_satisfied is true for the governing credit event, i.e. seasoning_months_elapsed >= seasoning_months_required"
    error_id: ERR_SEASONING_NOT_SATISFIED
    http_status: 422
    applies_to: "POST /loan-files/{id}/submit-to-underwriting, POST /loan-files/{id}/approve"

  - priority: 21
    category: business_safety
    check: "when AppraisalReview.second_valuation_status is SECOND_REQUIRED or SECOND_ORDERED, an accepted second appraisal must exist before approval; only SECOND_NOT_REQUIRED or SECOND_RECONCILED clears this gate"
    error_id: ERR_SECOND_VALUATION_REQUIRED
    http_status: 422
    applies_to: "POST /loan-files/{id}/approve"

  - priority: 22
    category: business_safety
    check: "AppraisalReview.primary_review_status is PRIMARY_CLEARED; PRIMARY_ESCALATED (variance above tolerance) blocks approval until the escalation is resolved by a reviewer override"
    error_id: ERR_APPRAISAL_ESCALATION_UNRESOLVED
    http_status: 422
    applies_to: "POST /loan-files/{id}/approve"

  - priority: 23
    category: business_safety
    check: "segregation of duties, two clauses: (a) every Underwriter action on a loan file must carry the file's assigned_underwriter_id as X-User-ID, so a second underwriter cannot pick up someone else's file; (b) the acting X-User-ID on an exception decision must differ from ExceptionRequest.requested_by_user_id, and on a tier-2 second signature it must also differ from first_signoff_user_id, so no single operator can both request and fully approve a guideline waiver."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /loan-files/{id}/points-and-fees-test, POST /loan-files/{id}/atr-determination, POST /loan-files/{id}/suspend, POST /loan-files/{id}/clear-conditions, POST /loan-files/{id}/approve, POST /loan-files/{id}/deny, POST /income-worksheets, POST /exception-requests/{id}/decision"

  - priority: 24
    category: business_temporal
    check: "the accepted valuation supporting reconciled_value_cents is still inside its 120-day validity window at close time: effective_date + 120 days >= logical clock date, evaluated as a closed interval so day 120 is still valid and day 121 is expired"
    error_id: ERR_VALUATION_EXPIRED
    http_status: 422
    applies_to: "POST /loan-files/{id}/close"

  - priority: 25
    category: business_temporal
    check: "a replacement ValuationOrder of the same valuation_type may not be placed within 30 days of the effective_date of the most recent order of that type on the loan, unless that order was REJECTED. The buffer is a closed interval measured in whole days on the logical clock."
    error_id: ERR_VALUATION_REORDER_TOO_SOON
    http_status: 422
    applies_to: "POST /valuation-orders"

  - priority: 26
    category: business_temporal
    check: "StatementMonth periods attached to one IncomeWorksheet must not overlap. Intervals are half-open [period_start_date, period_end_date): a month ending on the exact start date of another is adjacent and allowed, while any shared interior day is an overlap. Both INCLUDED and EXCLUDED months occupy their interval."
    error_id: ERR_STATEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /income-worksheets/{id}/statement-months"

  - priority: 27
    category: business_temporal
    check: "a StatementMonth period must end on or before the logical clock date and must start no earlier than 2 * DocumentationProgram.statement_period_months whole months before it"
    error_id: ERR_STATEMENT_PERIOD_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /income-worksheets/{id}/statement-months"

  - priority: 28
    category: business_constraint
    check: "code uniqueness: DocumentationProgram.program_code is globally unique, InvestorOverlay.overlay_code is unique per investor_code, SecuritizationPool.pool_code is globally unique, PointsAndFeesItem.fee_code is unique per loan file, and AuditFinding.finding_code is unique per audit"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /documentation-programs, POST /investor-overlays, POST /securitization-pools, POST /income-worksheets/{id}/statement-months, POST /points-and-fees-items, POST /audit-findings"

  - priority: 29
    category: business_constraint
    check: "the number of INCLUDED StatementMonth rows equals DocumentationProgram.statement_period_months exactly when a BANK_STATEMENT worksheet is accepted; fewer is insufficient documentation and more is an unaudited sample"
    error_id: ERR_INSUFFICIENT_STATEMENT_MONTHS
    http_status: 422
    applies_to: "POST /income-worksheets/{id}/accept"

  - priority: 30
    category: business_constraint
    check: "a BANK_STATEMENT worksheet calculation requires at least one INCLUDED StatementMonth; an empty included set has no defined average and is refused rather than yielding zero income"
    error_id: ERR_NO_INCLUDED_STATEMENT_MONTHS
    http_status: 422
    applies_to: "POST /income-worksheets/{id}/calculate, POST /statement-months/{id}/exclude"

  - priority: 31
    category: business_referential
    check: "the overlay named by an ExceptionRequest is currently in the loan's overlay_breach_codes; an exception cannot be requested against an overlay the file already satisfies, and a duplicate PENDING or APPROVED request for the same (loan_file_id, overlay_id) pair is refused"
    error_id: ERR_OVERLAY_NOT_BREACHED
    http_status: 422
    applies_to: "POST /exception-requests"

  - priority: 32
    category: business_referential
    check: "the loan is CLOSED and securitization_eligible is true; a loan carrying an unresolved overlay breach, repurchase_flag, or a C_MATERIAL audit grade is not poolable"
    error_id: ERR_LOAN_NOT_SECURITIZATION_ELIGIBLE
    http_status: 422
    applies_to: "POST /securitization-pools/{id}/loans"

  - priority: 33
    category: business_referential
    check: "the loan is not already a member of any pool; pool_id must be null at assignment time"
    error_id: ERR_LOAN_ALREADY_POOLED
    http_status: 409
    applies_to: "POST /securitization-pools/{id}/loans"

  - priority: 34
    category: business_referential
    check: "the loan named in a removal is currently a member of this pool (loan.pool_id equals the path pool id)"
    error_id: ERR_LOAN_NOT_IN_POOL
    http_status: 422
    applies_to: "POST /securitization-pools/{id}/removals"

  - priority: 35
    category: business_fiscal
    check: "the deciding role carries sufficient authority for the exception's computed required_authority_tier: tier 1 may be approved outright by CreditCommittee or ChiefCreditOfficer; tier 2 needs a CreditCommittee first signoff followed by a ChiefCreditOfficer second signature, so a ChiefCreditOfficer cannot supply both signatures and a CreditCommittee member cannot supply the second one."
    error_id: ERR_EXCEPTION_AUTHORITY_INSUFFICIENT
    http_status: 403
    applies_to: "POST /exception-requests/{id}/decision"

  - priority: 36
    category: business_fiscal
    check: "dti_pct is not null and dti_pct <= DocumentationProgram.max_dti_pct at approval (DSCR files whose dti_pct is null are exempt from this rule and are governed by the program's min_dscr instead)"
    error_id: ERR_DTI_ABOVE_PROGRAM_MAX
    http_status: 422
    applies_to: "POST /loan-files/{id}/approve"

  - priority: 37
    category: business_fiscal
    check: "documented_reserves_months >= DocumentationProgram.min_reserves_months at approval; the comparison is inclusive so exactly meeting the requirement passes"
    error_id: ERR_RESERVES_INSUFFICIENT
    http_status: 422
    applies_to: "POST /loan-files/{id}/approve"

  - priority: 38
    category: business_fiscal
    check: "residual_income_cents >= DocumentationProgram.min_residual_income_cents at approval; the check is skipped entirely when doc_type is DSCR (a DSCR file has no borrower income worksheet, so residual_income_cents stays null and no floor applies) and when min_residual_income_cents is 0"
    error_id: ERR_RESIDUAL_INCOME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /loan-files/{id}/approve"

  - priority: 39
    category: business_constraint
    check: "Borrower.fico_score >= DocumentationProgram.min_fico at approval; the comparison is inclusive, so a score exactly equal to the program minimum passes"
    error_id: ERR_FICO_BELOW_PROGRAM_MIN
    http_status: 422
    applies_to: "POST /loan-files/{id}/approve"

  - priority: 40
    category: business_constraint
    check: "ltv_pct <= DocumentationProgram.max_ltv_pct at approval, measured against the current reconciled_value_cents rather than the purchase price; the comparison is inclusive"
    error_id: ERR_LTV_ABOVE_PROGRAM_MAX
    http_status: 422
    applies_to: "POST /loan-files/{id}/approve"

  - priority: 41
    category: business_constraint
    check: "dscr_ratio >= DocumentationProgram.min_dscr at approval when doc_type == DSCR; the rule is skipped entirely for every other doc_type, whose income files are governed by validations[priority=36..38] instead"
    error_id: ERR_DSCR_BELOW_PROGRAM_MIN
    http_status: 422
    applies_to: "POST /loan-files/{id}/approve"

  - priority: 42
    category: business_fiscal
    check: "adding the loan would not push aggregate_scheduled_balance_cents above SecuritizationPool.target_balance_cents; the cap is inclusive, so landing exactly on it is allowed and exceeding it by one cent is not"
    error_id: ERR_POOL_BALANCE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /securitization-pools/{id}/loans"

  # Numbered last deliberately: it governs exactly one endpoint on which no other business
  # rule can be live, so its position in the ladder is never observable.
  - priority: 43
    category: state
    check: "the AppraisalReview is PRIMARY_ESCALATED when override-escalation is requested; PRIMARY_NOT_ORDERED, PRIMARY_PENDING_REVIEW and PRIMARY_CLEARED all reject the override, and a second override on an already-cleared review is rejected rather than treated as a no-op"
    error_id: ERR_REVIEW_STATE_INVALID
    http_status: 409
    applies_to: "POST /appraisal-reviews/{id}/override-escalation"

# ---------------------------------------------------------------------------
# 1.5 API Endpoints
# ---------------------------------------------------------------------------
# api_prefix is "/", so every collection sits at the root. The single-resource
# id segment is spelled {id} everywhere, including under a parent collection.
# Reverse-reachability GETs: CreditEvent via GET /borrowers/{id}/credit-events;
# LoanFile via the filtered GET /loan-files (borrower_id / program_id / pool_id);
# IncomeWorksheet, ValuationOrder, AppraisalReview, PointsAndFeesItem and
# PostCloseAudit via sub-resource GETs under /loan-files/{id}/;
# StatementMonth under /income-worksheets/{id}/; AuditFinding under
# /post-close-audits/{id}/; ExceptionRequest via the filtered GET
# /exception-requests (loan_file_id / overlay_id).
endpoints:
  - method: POST
    path: "/documentation-programs"
    description: "Register an alternative-documentation program with its income methodology parameters, guideline floors and seasoning matrix."
    roles: [ProgramAdmin]
    code: 201
    input: [program_code, name, "statement_period_months?", "default_expense_factor_pct?", "min_expense_factor_pct?", "depletion_horizon_months?", "min_dscr?", max_ltv_pct, min_fico, min_reserves_months, "max_dti_pct?", min_residual_income_cents, second_valuation_ltv_threshold_pct, second_valuation_loan_amount_threshold_cents, "atr_exempt_flag?", seasoning_matrix]
    output: DocumentationProgram
    side_effects: ["none"]

  - method: GET
    path: "/documentation-programs/{id}"
    description: "Read one documentation program."
    roles: [ProgramAdmin, LoanOfficer, Underwriter, CreditCommittee, ChiefCreditOfficer, AppraisalReviewer, PostCloseAuditor, SecuritizationAnalyst]
    code: 200
    input: []
    output: DocumentationProgram
    side_effects: ["none"]

  - method: POST
    path: "/investor-overlays"
    description: "Publish an investor guideline overlay, optionally scoped to one program family, with the signoff authority tier required to waive it."
    roles: [ProgramAdmin]
    code: 201
    input: [investor_code, overlay_code, "applies_to_program_code?", rule_metric, comparator, threshold_value, "waivable_flag?", required_authority_tier, severity]
    output: InvestorOverlay
    side_effects: ["none"]

  - method: GET
    path: "/investor-overlays/{id}"
    description: "Read one investor overlay, including its current version for exception pinning."
    roles: [ProgramAdmin, LoanOfficer, Underwriter, CreditCommittee, ChiefCreditOfficer, SecuritizationAnalyst]
    code: 200
    input: []
    output: InvestorOverlay
    side_effects: ["none"]

  - method: POST
    path: "/borrowers"
    description: "Create a borrower with credit, asset and obligation facts."
    roles: [LoanOfficer]
    code: 201
    input: [legal_name, fico_score, "self_employed_flag?", "entity_ownership_pct?", monthly_debt_obligations_cents, verified_liquid_assets_cents, age_years]
    output: Borrower
    side_effects: ["none"]

  - method: GET
    path: "/borrowers/{id}"
    description: "Read one borrower, including the computed credit_event_count."
    roles: [LoanOfficer, Underwriter, CreditCommittee, ChiefCreditOfficer, PostCloseAuditor]
    code: 200
    input: []
    output: Borrower
    side_effects: ["none"]

  - method: POST
    path: "/credit-events"
    description: "Record a prior derogatory credit event for a borrower. Immutable once written (CreditEvent has no version field and no update endpoint)."
    roles: [LoanOfficer, Underwriter]
    code: 201
    input: [borrower_id, event_type, completion_date, "documented_flag?"]
    output: CreditEvent
    side_effects: ["increments Borrower.credit_event_count", "re-runs calculations.credit_event_seasoning for every non-terminal LoanFile of this borrower"]

  - method: GET
    path: "/borrowers/{id}/credit-events"
    description: "List the borrower's credit events, including undocumented ones (reverse-reachability channel for CreditEvent.borrower_id)."
    roles: [LoanOfficer, Underwriter, CreditCommittee, ChiefCreditOfficer, PostCloseAuditor]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CreditEvent[]
    side_effects: ["none"]

  - method: POST
    path: "/loan-files"
    description: "Open a loan file in DRAFT against a borrower and a documentation program."
    roles: [LoanOfficer]
    code: 201
    input: [borrower_id, program_id, investor_code, loan_amount_cents, "purchase_price_cents?", property_value_cents, occupancy, purpose, lien_position, note_rate_pct, apor_pct, term_months, amortization_type, monthly_taxes_cents, monthly_insurance_cents, "monthly_hoa_cents?", "gross_market_rent_cents?", "lease_rent_cents?"]
    output: LoanFile
    side_effects: ["runs calculations.pitia_monthly", "runs calculations.ltv_recompute against property_value_cents (no appraisal exists yet)", "status DRAFT, doc_type null"]

  - method: GET
    path: "/loan-files/{id}"
    description: "Read one loan file with every computed compliance field."
    roles: [LoanOfficer, Underwriter, CreditCommittee, ChiefCreditOfficer, AppraisalReviewer, PostCloseAuditor, SecuritizationAnalyst]
    code: 200
    input: []
    output: LoanFile
    side_effects: ["none"]

  - method: GET
    path: "/loan-files"
    description: "Filtered loan-file list; the reverse-reachability channel for borrower_id, program_id and pool_id."
    roles: [LoanOfficer, Underwriter, CreditCommittee, ChiefCreditOfficer, PostCloseAuditor, SecuritizationAnalyst]
    code: 200
    input: ["borrower_id?", "program_id?", "pool_id?", "status?", "doc_type?", "limit?", "offset?"]
    output: LoanFile[]
    side_effects: ["none"]

  - method: POST
    path: "/loan-files/{id}/doc-type-selection"
    description: "Select the documentation type for the file. Sets doc_type once and immutably, and binds the file to the acting Underwriter's X-User-ID; DRAFT -> DOC_TYPE_SELECTED."
    roles: [Underwriter]
    code: 200
    input: [doc_type]
    output: LoanFile
    side_effects: ["validates doc_type against the program per validations[priority=17]", "status -> DOC_TYPE_SELECTED"]

  - method: POST
    path: "/loan-files/{id}/submit-to-underwriting"
    description: "Submit the file for underwriting. Runs seasoning, the second-valuation requirement test and the overlay sweep."
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanFile
    side_effects: ["runs calculations.credit_event_seasoning", "runs calculations.appraisal_reconciliation step 1 and may move AppraisalReview.second_valuation_status to SECOND_REQUIRED", "runs calculations.overlay_breach_evaluation", "status -> UNDERWRITING"]

  - method: POST
    path: "/loan-files/{id}/points-and-fees-test"
    description: "Run the points-and-fees and high-cost test over the file's active fee items."
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanFile
    side_effects: ["runs calculations.points_and_fees_test", "sets inclusion_in_test on every ACTIVE PointsAndFeesItem", "invalidates atr_documentation_status to INCOMPLETE and safe_harbor_class to NOT_EVALUATED when points_and_fees_test_result changes", "runs calculations.securitization_eligibility"]

  - method: POST
    path: "/loan-files/{id}/atr-determination"
    description: "Perform the ability-to-repay documentation review and the safe-harbor classification outside qualified-mortgage status."
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanFile
    side_effects: ["runs calculations.atr_determination", "runs calculations.securitization_eligibility"]

  - method: POST
    path: "/loan-files/{id}/suspend"
    description: "Suspend the file for conditions. UNDERWRITING -> SUSPENDED."
    roles: [Underwriter]
    code: 200
    input: [suspension_reason]
    output: LoanFile
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/loan-files/{id}/clear-conditions"
    description: "Clear outstanding conditions and return the file to underwriting. SUSPENDED -> UNDERWRITING."
    roles: [Underwriter]
    code: 200
    input: [resolution_note]
    output: LoanFile
    side_effects: ["re-runs calculations.credit_event_seasoning and calculations.overlay_breach_evaluation", "status -> UNDERWRITING"]

  - method: POST
    path: "/loan-files/{id}/approve"
    description: "Approve the file. Enforces the full compliance gate: high-cost, ATR, seasoning, appraisal, overlays, DTI, reserves and residual income."
    roles: [Underwriter]
    code: 200
    input: ["approval_note?"]
    output: LoanFile
    side_effects: ["runs calculations.securitization_eligibility", "status -> APPROVED"]

  - method: POST
    path: "/loan-files/{id}/deny"
    description: "Deny the file. Terminal."
    roles: [Underwriter]
    code: 200
    input: [denial_reason]
    output: LoanFile
    side_effects: ["voids every PENDING_REVIEW or AWAITING_SECOND_SIGNATURE ExceptionRequest on the file", "status -> DENIED"]

  - method: POST
    path: "/loan-files/{id}/close"
    description: "Close the approved loan. Enforces the 120-day valuation validity window."
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanFile
    side_effects: ["runs calculations.securitization_eligibility", "status -> CLOSED"]

  - method: POST
    path: "/income-worksheets"
    description: "Open an income worksheet for the loan file using the file's documentation methodology. Carries the loan file's expected version (optimistic concurrency, §1.2.1)."
    roles: [Underwriter]
    code: 201
    input: [loan_file_id, method, expected_loan_file_version, "expense_factor_source?", "cpa_expense_factor_pct?", "p_and_l_net_income_cents?", "p_and_l_period_months?", "asset_bucket_checking_cents?", "asset_bucket_brokerage_cents?", "asset_bucket_retirement_cents?"]
    output: IncomeWorksheet
    side_effects: ["increments LoanFile.version by 1", "status DRAFT", "method must equal LoanFile.doc_type per validations[priority=17]"]

  - method: GET
    path: "/income-worksheets/{id}"
    description: "Read one income worksheet with every computed aggregate."
    roles: [Underwriter, CreditCommittee, ChiefCreditOfficer, PostCloseAuditor]
    code: 200
    input: []
    output: IncomeWorksheet
    side_effects: ["none"]

  - method: GET
    path: "/loan-files/{id}/income-worksheets"
    description: "List the file's income worksheets, newest last (reverse-reachability channel for IncomeWorksheet.loan_file_id)."
    roles: [Underwriter, CreditCommittee, ChiefCreditOfficer, PostCloseAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IncomeWorksheet[]
    side_effects: ["none"]

  - method: POST
    path: "/income-worksheets/{id}/statement-months"
    description: "Attach one bank-statement month to the worksheet. Enforces the half-open non-overlap rule and the lookback window."
    roles: [Underwriter]
    code: 201
    input: [period_start_date, period_end_date, deposits_total_cents, "ineligible_transfer_cents?"]
    output: StatementMonth
    side_effects: ["computes eligible_deposit_cents = max(0, deposits_total_cents - ineligible_transfer_cents)", "inclusion_status INCLUDED", "does NOT recalculate the worksheet; calculate must be called explicitly"]

  - method: GET
    path: "/income-worksheets/{id}/statement-months"
    description: "List the worksheet's statement months (reverse-reachability channel for StatementMonth.worksheet_id)."
    roles: [Underwriter, CreditCommittee, ChiefCreditOfficer, PostCloseAuditor]
    code: 200
    input: ["inclusion_status?", "limit?", "offset?"]
    output: StatementMonth[]
    side_effects: ["none"]

  - method: POST
    path: "/statement-months/{id}/exclude"
    description: "Exclude a statement month from the deposit aggregate. Terminal for the month; INCLUDED -> EXCLUDED."
    roles: [Underwriter]
    code: 200
    input: [exclusion_reason]
    output: StatementMonth
    side_effects: ["recomputes the parent worksheet's eligible_deposit_total_cents, net_deposit_total_cents, included_month_count and monthly_qualifying_income_cents", "refuses to exclude the last INCLUDED month per validations[priority=30]"]

  - method: POST
    path: "/income-worksheets/{id}/calculate"
    description: "Run the worksheet's income methodology. Idempotent in value, but increments calculation_count each time; DRAFT -> CALCULATED and CALCULATED -> CALCULATED."
    roles: [Underwriter]
    code: 200
    input: []
    output: IncomeWorksheet
    side_effects: ["runs calculations.bank_statement_income, calculations.asset_depletion_income or calculations.profit_and_loss_income by method", "sets variant_applied and expense_factor_pct_applied", "increments calculation_count", "does NOT touch the loan file; only accept publishes income"]

  - method: POST
    path: "/income-worksheets/{id}/accept"
    description: "Accept the worksheet as the file's qualifying income. Supersedes any previously accepted worksheet; CALCULATED -> ACCEPTED."
    roles: [Underwriter]
    code: 200
    input: []
    output: IncomeWorksheet
    side_effects: ["moves any other ACCEPTED worksheet on the file to SUPERSEDED", "publishes monthly_qualifying_income_cents to LoanFile.qualifying_income_monthly_cents", "recomputes LoanFile.dti_pct, residual_income_cents and documented_reserves_months", "runs calculations.overlay_breach_evaluation", "invalidates atr_documentation_status to INCOMPLETE", "increments LoanFile.version by 1"]

  - method: POST
    path: "/valuation-orders"
    description: "Order a valuation product for the file. Creates the AppraisalReview row on the first primary order and enforces the 30-day re-order buffer."
    roles: [LoanOfficer, Underwriter, AppraisalReviewer]
    code: 201
    input: [loan_file_id, valuation_type, vendor_code, effective_date]
    output: ValuationOrder
    side_effects: ["computes validity_expires_date = effective_date + 120 days", "creates the file's AppraisalReview row when absent (cascade-created child; discoverable only via GET /loan-files/{id}/appraisal-reviews)", "moves second_valuation_status SECOND_REQUIRED -> SECOND_ORDERED for a SECOND_APPRAISAL", "arms the re-order buffer per validations[priority=25]", "status ORDERED"]

  - method: GET
    path: "/valuation-orders/{id}"
    description: "Read one valuation order."
    roles: [LoanOfficer, Underwriter, AppraisalReviewer, PostCloseAuditor]
    code: 200
    input: []
    output: ValuationOrder
    side_effects: ["none"]

  - method: GET
    path: "/loan-files/{id}/valuation-orders"
    description: "List the file's valuation orders (reverse-reachability channel for ValuationOrder.loan_file_id)."
    roles: [LoanOfficer, Underwriter, AppraisalReviewer, PostCloseAuditor]
    code: 200
    input: ["valuation_type?", "status?", "limit?", "offset?"]
    output: ValuationOrder[]
    side_effects: ["none"]

  - method: POST
    path: "/valuation-orders/{id}/receive"
    description: "Record the returned appraised value. ORDERED -> RECEIVED; publishes no value to the review yet."
    roles: [AppraisalReviewer]
    code: 200
    input: [appraised_value_cents]
    output: ValuationOrder
    side_effects: ["moves primary_review_status PRIMARY_NOT_ORDERED -> PRIMARY_PENDING_REVIEW for a PRIMARY_APPRAISAL", "moves second_valuation_status SECOND_ORDERED -> SECOND_RECEIVED for a SECOND_APPRAISAL", "status RECEIVED"]

  - method: POST
    path: "/valuation-orders/{id}/decision"
    description: "Accept or reject the received valuation. Acceptance drives the full reconciliation cascade: value -> variance -> reconciled value -> LTV -> overlays -> loan state -> exception voiding."
    roles: [AppraisalReviewer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: ValuationOrder
    side_effects: ["on ACCEPTED: runs calculations.appraisal_reconciliation steps 2-3, then calculations.ltv_recompute, then calculations.overlay_breach_evaluation", "an overlay breach arising from the new LTV moves the LoanFile UNDERWRITING -> SUSPENDED and VOIDs any APPROVED ExceptionRequest whose pinned_metric_value no longer matches", "on REJECTED: publishes no value and clears the re-order buffer for that valuation_type", "status ACCEPTED or REJECTED"]

  - method: GET
    path: "/loan-files/{id}/appraisal-reviews"
    description: "The file's appraisal review, as an array of length 0 or 1 (reverse-reachability channel for AppraisalReview.loan_file_id and the only discovery channel for this cascade-created row)."
    roles: [LoanOfficer, Underwriter, AppraisalReviewer, PostCloseAuditor, SecuritizationAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: AppraisalReview[]
    side_effects: ["none"]

  - method: POST
    path: "/appraisal-reviews/{id}/override-escalation"
    description: "Reviewer override of a variance escalation, accepting the conservative reconciled value; PRIMARY_ESCALATED -> PRIMARY_CLEARED."
    roles: [AppraisalReviewer]
    code: 200
    input: [override_justification]
    output: AppraisalReview
    side_effects: ["sets escalation_reason to OVERRIDDEN_BY_REVIEWER", "leaves reconciled_value_cents and therefore ltv_pct unchanged", "primary_review_status -> PRIMARY_CLEARED"]

  - method: POST
    path: "/points-and-fees-items"
    description: "Add a charge to the file's points-and-fees schedule."
    roles: [LoanOfficer, Underwriter]
    code: 201
    input: [loan_file_id, fee_code, fee_category, amount_cents, "paid_to_affiliate_flag?", "prepaid_finance_charge_flag?", "bona_fide_discount_flag?"]
    output: PointsAndFeesItem
    side_effects: ["status ACTIVE", "when points_and_fees_test_result != NOT_TESTED: re-runs steps 1-5 of calculations.points_and_fees_test and re-runs calculations.securitization_eligibility", "when that re-run changes points_and_fees_test_result: invalidates atr_documentation_status to INCOMPLETE and safe_harbor_class to NOT_EVALUATED, exactly as POST /loan-files/{id}/points-and-fees-test does"]

  - method: GET
    path: "/loan-files/{id}/points-and-fees-items"
    description: "List the file's fee schedule with each item's inclusion classification (reverse-reachability channel for PointsAndFeesItem.loan_file_id)."
    roles: [LoanOfficer, Underwriter, CreditCommittee, ChiefCreditOfficer, PostCloseAuditor]
    code: 200
    input: ["status?", "inclusion_in_test?", "limit?", "offset?"]
    output: PointsAndFeesItem[]
    side_effects: ["none"]

  - method: POST
    path: "/points-and-fees-items/{id}/void"
    description: "Void a charge. The item leaves every aggregate and the test is re-run, restoring the prior totals exactly."
    roles: [LoanOfficer, Underwriter]
    code: 200
    input: [void_reason]
    output: PointsAndFeesItem
    side_effects: ["status VOIDED", "when points_and_fees_test_result != NOT_TESTED: re-runs calculations.points_and_fees_test from scratch over the remaining ACTIVE items", "when that re-run changes points_and_fees_test_result: invalidates atr_documentation_status to INCOMPLETE and safe_harbor_class to NOT_EVALUATED", "re-runs calculations.securitization_eligibility"]

  - method: POST
    path: "/exception-requests"
    description: "Request a waiver of a breached investor overlay. Pins the metric value and the overlay version at request time and computes the required authority tier."
    roles: [Underwriter]
    code: 201
    input: [loan_file_id, overlay_id, justification, "compensating_factors?"]
    output: ExceptionRequest
    side_effects: ["sets requested_by_user_id to the acting X-User-ID", "pins pinned_metric_value from the live overlay metric and pinned_overlay_version from InvestorOverlay.version", "computes required_authority_tier = max(overlay.required_authority_tier, 2 if overlay.severity == MATERIAL else 1)", "status PENDING_REVIEW"]

  - method: GET
    path: "/exception-requests/{id}"
    description: "Read one exception request."
    roles: [Underwriter, CreditCommittee, ChiefCreditOfficer, PostCloseAuditor]
    code: 200
    input: []
    output: ExceptionRequest
    side_effects: ["none"]

  - method: GET
    path: "/exception-requests"
    description: "Filtered exception list; the reverse-reachability channel for loan_file_id and overlay_id."
    roles: [Underwriter, CreditCommittee, ChiefCreditOfficer, PostCloseAuditor]
    code: 200
    input: ["loan_file_id?", "overlay_id?", "status?", "limit?", "offset?"]
    output: ExceptionRequest[]
    side_effects: ["none"]

  - method: POST
    path: "/exception-requests/{id}/decision"
    description: "Record a signoff or a denial. Tier 1 approves outright; tier 2 forks to AWAITING_SECOND_SIGNATURE and joins on the ChiefCreditOfficer's second signature."
    roles: [CreditCommittee, ChiefCreditOfficer]
    code: 200
    input: [decision, "decision_reason?"]
    output: ExceptionRequest
    side_effects: ["records first_signoff_user_id on the first APPROVE and second_signoff_user_id on the join", "on APPROVED: decrements LoanFile.unresolved_overlay_breach_count and re-runs calculations.securitization_eligibility", "on the tier-2 join: sets LoanFile.investor_notification_required to true", "on DENIED: moves the LoanFile UNDERWRITING -> SUSPENDED"]

  - method: POST
    path: "/post-close-audits"
    description: "Open a post-close audit on a closed loan file."
    roles: [PostCloseAuditor]
    code: 201
    input: [loan_file_id, sample_reason]
    output: PostCloseAudit
    side_effects: ["status OPEN", "grade NOT_GRADED", "defect_score 0"]

  - method: GET
    path: "/post-close-audits/{id}"
    description: "Read one audit with its derived score and grade."
    roles: [PostCloseAuditor, Underwriter, ChiefCreditOfficer, SecuritizationAnalyst]
    code: 200
    input: []
    output: PostCloseAudit
    side_effects: ["none"]

  - method: GET
    path: "/loan-files/{id}/post-close-audits"
    description: "List the file's audits (reverse-reachability channel for PostCloseAudit.loan_file_id)."
    roles: [PostCloseAuditor, Underwriter, ChiefCreditOfficer, SecuritizationAnalyst]
    code: 200
    input: ["grade?", "limit?", "offset?"]
    output: PostCloseAudit[]
    side_effects: ["none"]

  - method: POST
    path: "/audit-findings"
    description: "Issue an audit finding. The first finding moves the audit OPEN -> FINDINGS_ISSUED."
    roles: [PostCloseAuditor]
    code: 201
    input: [audit_id, finding_code, category, severity]
    output: AuditFinding
    side_effects: ["runs calculations.audit_grade on the parent audit", "status ISSUED", "the audit stays non-terminal while any finding is ISSUED or REBUTTED"]

  - method: GET
    path: "/post-close-audits/{id}/findings"
    description: "List the audit's findings (reverse-reachability channel for AuditFinding.audit_id)."
    roles: [PostCloseAuditor, Underwriter, LoanOfficer, ChiefCreditOfficer]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: ["none"]

  - method: POST
    path: "/audit-findings/{id}/rebut"
    description: "File a rebuttal against an issued finding. ISSUED -> REBUTTED; the finding keeps its full severity weight while rebutted."
    roles: [LoanOfficer, Underwriter]
    code: 200
    input: [rebuttal_text]
    output: AuditFinding
    side_effects: ["increments rebuttal_round", "re-runs calculations.audit_grade (the score does not change, because REBUTTED still counts)", "status REBUTTED"]

  - method: POST
    path: "/audit-findings/{id}/adjudicate"
    description: "Adjudicate a finding: UPHOLD, WAIVE, or RETURN_FOR_MORE_INFO (which cycles the finding back to ISSUED for another rebuttal round)."
    roles: [PostCloseAuditor]
    code: 200
    input: [decision, "adjudication_note?"]
    output: AuditFinding
    side_effects: ["on WAIVE: the finding leaves defect_score entirely", "re-runs calculations.audit_grade", "when every finding is terminal: the audit auto-transitions to CLEARED or MATERIAL_DEFECT", "a C_MATERIAL grade cascades LoanFile CLOSED -> AUDIT_DEFECT, sets repurchase_flag, and detaches the loan from its pool (pool_id null, pool -> REBALANCING, pool metrics recomputed)"]

  - method: POST
    path: "/securitization-pools"
    description: "Open a securitization pool for one investor with an aggregate balance cap."
    roles: [SecuritizationAnalyst]
    code: 201
    input: [pool_code, investor_code, target_balance_cents]
    output: SecuritizationPool
    side_effects: ["status OPEN", "aggregate_scheduled_balance_cents 0", "weighted_avg_coupon_pct 0.0000", "member_loan_count 0"]

  - method: GET
    path: "/securitization-pools/{id}"
    description: "Read one pool with its conserved aggregates and current version."
    roles: [SecuritizationAnalyst, ChiefCreditOfficer, PostCloseAuditor]
    code: 200
    input: []
    output: SecuritizationPool
    side_effects: ["none"]

  - method: POST
    path: "/securitization-pools/{id}/loans"
    description: "Assign an eligible closed loan to the pool. Carries the pool's expected version (optimistic concurrency, §1.2.1)."
    roles: [SecuritizationAnalyst]
    code: 200
    input: [loan_file_id, expected_pool_version]
    output: SecuritizationPool
    side_effects: ["sets LoanFile.pool_id", "runs calculations.pool_metrics_recompute from scratch over the CLOSED member set", "increments SecuritizationPool.version by 1", "moves REBALANCING -> OPEN"]

  - method: POST
    path: "/securitization-pools/{id}/removals"
    description: "Remove a loan from the pool, or finalise settlement. removal_reason is one of {LOAN_INELIGIBLE, ANALYST_DISCRETION, SETTLEMENT_FINALIZED}; the first two require loan_file_id and SETTLEMENT_FINALIZED must omit it. Carries the pool's expected version (optimistic concurrency, §1.2.1)."
    roles: [SecuritizationAnalyst]
    code: 200
    input: [removal_reason, "loan_file_id?", expected_pool_version]
    output: SecuritizationPool
    side_effects: ["clears LoanFile.pool_id when loan_file_id is supplied", "runs calculations.pool_metrics_recompute from scratch, restoring the pre-assignment aggregates exactly", "increments SecuritizationPool.version by 1", "removal_reason SETTLEMENT_FINALIZED moves the pool OPEN -> SETTLED and takes no loan_file_id"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock, which every seasoning, validity-window, lookback and re-order-buffer rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramAdmin, LoanOfficer, Underwriter, CreditCommittee, ChiefCreditOfficer, AppraisalReviewer, PostCloseAuditor, SecuritizationAnalyst]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock", "recomputes no stored field; every time-dependent rule reads the clock at evaluation time"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_MISSING_ROLE_HEADER
    http: 401
    condition: "X-User-Role absent, empty, or whitespace-only"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the eight declared roles"
  - id: ERR_MISSING_USER_HEADER
    http: 401
    condition: "X-User-ID absent, empty, or whitespace-only"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the authenticated role is not listed for the endpoint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "an Underwriter action carries an X-User-ID other than the file's assigned_underwriter_id, or an exception decision is made by the requester, or the tier-2 second signature is supplied by the first signer"
  - id: ERR_EXCEPTION_AUTHORITY_INSUFFICIENT
    http: 403
    condition: "the deciding role lacks authority for the exception's required_authority_tier (a CreditCommittee member attempting the tier-2 second signature, or a ChiefCreditOfficer attempting to supply both tier-2 signatures)"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id or the path documentation-program id does not exist"
  - id: ERR_OVERLAY_NOT_FOUND
    http: 404
    condition: "overlay_id or the path investor-overlay id does not exist"
  - id: ERR_BORROWER_NOT_FOUND
    http: 404
    condition: "borrower_id or the path borrower id does not exist"
  - id: ERR_LOAN_FILE_NOT_FOUND
    http: 404
    condition: "loan_file_id or the path loan-file id does not exist"
  - id: ERR_WORKSHEET_NOT_FOUND
    http: 404
    condition: "the path income-worksheet id does not exist"
  - id: ERR_STATEMENT_MONTH_NOT_FOUND
    http: 404
    condition: "the path statement-month id does not exist"
  - id: ERR_VALUATION_ORDER_NOT_FOUND
    http: 404
    condition: "the path valuation-order id does not exist"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "the path appraisal-review id does not exist (the row is created by cascade on the first primary valuation order)"
  - id: ERR_FEE_ITEM_NOT_FOUND
    http: 404
    condition: "the path points-and-fees-item id does not exist"
  - id: ERR_EXCEPTION_NOT_FOUND
    http: 404
    condition: "the path exception-request id does not exist"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "audit_id or the path post-close-audit id does not exist"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "the path audit-finding id does not exist"
  - id: ERR_POOL_NOT_FOUND
    http: 404
    condition: "the path securitization-pool id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, undeclared enum member, or unknown field in the body"
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "a numeric or calendar value falls outside its declared domain (negative cents, note_rate_pct above 25.000, fico_score outside 300-850, term_months outside 1-480, period_start_date not before period_end_date, completion_date in the future)"
  - id: ERR_STALE_LOAN_FILE_VERSION
    http: 412
    condition: "expected_loan_file_version does not equal the loan file's current version on POST /income-worksheets"
  - id: ERR_STALE_POOL_VERSION
    http: 412
    condition: "expected_pool_version does not equal the pool's current version on a pool membership write"
  - id: ERR_LOAN_FILE_STATE_INVALID
    http: 409
    condition: "the loan file is not in a state from which the requested trigger is declared in §1.2"
  - id: ERR_WORKSHEET_STATE_INVALID
    http: 409
    condition: "the income worksheet is not in the state the trigger requires, or is SUPERSEDED"
  - id: ERR_STATEMENT_MONTH_STATE_INVALID
    http: 409
    condition: "exclude requested on a month that is already EXCLUDED"
  - id: ERR_VALUATION_ORDER_STATE_INVALID
    http: 409
    condition: "receive on a non-ORDERED order, or decision on a non-RECEIVED order"
  - id: ERR_REVIEW_STATE_INVALID
    http: 409
    condition: "override-escalation requested while primary_review_status is not PRIMARY_ESCALATED or second_valuation_status is not SECOND_RECONCILED (state precondition, evaluated in the same band as priorities 11-16)"
  - id: ERR_EXCEPTION_STATE_INVALID
    http: 409
    condition: "decision requested on an exception that is APPROVED, DENIED or VOIDED"
  - id: ERR_FINDING_STATE_INVALID
    http: 409
    condition: "a finding is filed against an audit that is CLEARED or MATERIAL_DEFECT, rebut on a non-ISSUED finding, or adjudicate on a finding that is neither ISSUED nor REBUTTED"
  - id: ERR_POOL_STATE_INVALID
    http: 409
    condition: "a membership write against a SETTLED pool, or a SETTLEMENT_FINALIZED removal that would leave member_loan_count above 0"
  - id: ERR_DOC_TYPE_PROGRAM_MISMATCH
    http: 422
    condition: "the requested doc_type is not offered by the file's DocumentationProgram, or an IncomeWorksheet.method differs from the file's doc_type"
  - id: ERR_HIGH_COST_LOAN_PROHIBITED
    http: 422
    condition: "points_and_fees_test_result is FAIL at approval, closing or pool assignment"
  - id: ERR_ATR_DOCUMENTATION_INCOMPLETE
    http: 422
    condition: "atr_documentation_status is INCOMPLETE, or safe_harbor_class is NOT_EVALUATED, at approval or pool assignment"
  - id: ERR_SEASONING_NOT_SATISFIED
    http: 422
    condition: "seasoning_months_elapsed is below seasoning_months_required for the governing credit event"
  - id: ERR_SECOND_VALUATION_REQUIRED
    http: 422
    condition: "approval attempted while second_valuation_status is SECOND_REQUIRED, SECOND_ORDERED or SECOND_RECEIVED"
  - id: ERR_APPRAISAL_ESCALATION_UNRESOLVED
    http: 422
    condition: "approval attempted while primary_review_status is PRIMARY_NOT_ORDERED, PRIMARY_PENDING_REVIEW or PRIMARY_ESCALATED"
  - id: ERR_VALUATION_EXPIRED
    http: 422
    condition: "the valuation supporting reconciled_value_cents is more than 120 days past its effective_date at closing"
  - id: ERR_VALUATION_REORDER_TOO_SOON
    http: 422
    condition: "a same-type valuation is re-ordered within 30 days of the previous non-REJECTED order's effective_date"
  - id: ERR_STATEMENT_PERIOD_OVERLAP
    http: 409
    condition: "a statement month shares an interior day with another month on the same worksheet (adjacency at a shared boundary date is allowed)"
  - id: ERR_STATEMENT_PERIOD_OUT_OF_WINDOW
    http: 422
    condition: "a statement month ends after the logical clock date, or starts earlier than twice the program's statement_period_months before it"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "program_code, pool_code, per-investor overlay_code, per-file fee_code or per-audit finding_code already exists"
  - id: ERR_INSUFFICIENT_STATEMENT_MONTHS
    http: 422
    condition: "the INCLUDED month count does not equal the program's statement_period_months at worksheet acceptance"
  - id: ERR_NO_INCLUDED_STATEMENT_MONTHS
    http: 422
    condition: "a bank-statement calculation is requested with zero INCLUDED months, or the last INCLUDED month is being excluded"
  - id: ERR_OVERLAY_NOT_BREACHED
    http: 422
    condition: "an exception is requested against an overlay the file currently satisfies, against a non-waivable overlay, or duplicating a live request for the same overlay"
  - id: ERR_LOAN_NOT_SECURITIZATION_ELIGIBLE
    http: 422
    condition: "pool assignment attempted while securitization_eligible is false"
  - id: ERR_LOAN_ALREADY_POOLED
    http: 409
    condition: "pool assignment attempted while the loan's pool_id is already set"
  - id: ERR_LOAN_NOT_IN_POOL
    http: 422
    condition: "removal names a loan whose pool_id is not this pool"
  - id: ERR_DTI_ABOVE_PROGRAM_MAX
    http: 422
    condition: "dti_pct exceeds the program's max_dti_pct at approval"
  - id: ERR_RESERVES_INSUFFICIENT
    http: 422
    condition: "documented_reserves_months is below the program's min_reserves_months at approval"
  - id: ERR_RESIDUAL_INCOME_INSUFFICIENT
    http: 422
    condition: "residual_income_cents is below the program's min_residual_income_cents at approval"
  - id: ERR_FICO_BELOW_PROGRAM_MIN
    http: 422
    condition: "the borrower's fico_score is below the program's min_fico at approval"
  - id: ERR_LTV_ABOVE_PROGRAM_MAX
    http: 422
    condition: "ltv_pct exceeds the program's max_ltv_pct at approval"
  - id: ERR_DSCR_BELOW_PROGRAM_MIN
    http: 422
    condition: "dscr_ratio is below the program's min_dscr at approval on a DSCR file"
  - id: ERR_POOL_BALANCE_CAP_EXCEEDED
    http: 422
    condition: "the assignment would push aggregate_scheduled_balance_cents above the pool's target_balance_cents"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
# Segregation of duties: the operator who requests a guideline exception can
# never be the operator who approves it, and a tier-2 waiver needs two distinct
# X-User-IDs in two distinct roles. Every role is opaque: X-User-ID is an
# operator identifier, never the id of a persisted entity. The loan file stores
# one opaque operator id (assigned_underwriter_id) and the exception stores
# three (requested_by_user_id, first_signoff_user_id, second_signoff_user_id),
# but none of them is required to equal any entity's id.
roles:
  - name: ProgramAdmin
    description: "Configures documentation programs, investor overlays and their authority tiers. Never touches a loan file."
    identity: opaque
    exclusive_operations: [create documentation program, create investor overlay]
    shared_operations: [read documentation program, read investor overlay, set logical clock]

  - name: LoanOfficer
    description: "Originates the file: borrower, credit events, fee schedule, submission and closing."
    identity: opaque
    exclusive_operations: [create borrower, create loan file, submit loan file to underwriting, close loan file]
    shared_operations: [create credit event, create points-and-fees item, void points-and-fees item, order valuation, rebut audit finding, read loan file, read borrower, read credit events, read fee schedule, read valuation orders, read appraisal review, read audit findings, set logical clock]

  - name: Underwriter
    description: "Owns the credit decision on files bound to their X-User-ID: doc-type selection, income worksheets, the points-and-fees and ATR tests, suspension, condition clearing, approval, denial and exception requests."
    identity: opaque
    exclusive_operations: [select documentation type, create income worksheet, attach statement month, exclude statement month, calculate income worksheet, accept income worksheet, run points-and-fees test, run ATR determination, suspend loan file, clear conditions, approve loan file, deny loan file, create exception request]
    shared_operations: [create credit event, create points-and-fees item, void points-and-fees item, order valuation, rebut audit finding, read loan file, read borrower, read credit events, read income worksheets, read statement months, read fee schedule, read valuation orders, read appraisal review, read exception requests, read post-close audits, read audit findings, read documentation program, read investor overlay, set logical clock]

  - name: CreditCommittee
    description: "First signoff authority on guideline exceptions. Can approve a tier-1 waiver outright and supplies the first signature on a tier-2 waiver, but can never supply the second."
    identity: opaque
    exclusive_operations: []
    shared_operations: [decide exception request, read loan file, read borrower, read credit events, read income worksheets, read statement months, read fee schedule, read exception requests, read documentation program, read investor overlay, set logical clock]

  - name: ChiefCreditOfficer
    description: "Highest waiver authority. Supplies the second signature that joins a tier-2 exception, and can approve a tier-1 waiver outright."
    identity: opaque
    exclusive_operations: []
    shared_operations: [decide exception request, read loan file, read borrower, read credit events, read income worksheets, read statement months, read fee schedule, read exception requests, read post-close audits, read audit findings, read securitization pool, read documentation program, read investor overlay, set logical clock]

  - name: AppraisalReviewer
    description: "Independent valuation function: receives values, accepts or rejects them, and overrides variance escalations."
    identity: opaque
    exclusive_operations: [receive valuation, decide valuation, override appraisal escalation]
    shared_operations: [order valuation, read loan file, read valuation orders, read appraisal review, read documentation program, set logical clock]

  - name: PostCloseAuditor
    description: "Post-close quality control: opens audits, issues findings and adjudicates rebuttals."
    identity: opaque
    exclusive_operations: [create post-close audit, create audit finding, adjudicate audit finding]
    shared_operations: [read loan file, read borrower, read credit events, read income worksheets, read statement months, read fee schedule, read valuation orders, read appraisal review, read exception requests, read post-close audits, read audit findings, read securitization pool, read documentation program, set logical clock]

  - name: SecuritizationAnalyst
    description: "Builds and settles pools from eligible closed loans. Cannot underwrite, approve or audit anything."
    identity: opaque
    exclusive_operations: [create securitization pool, assign loan to pool, remove loan from pool, settle pool]
    shared_operations: [read securitization pool, read loan file, read appraisal review, read post-close audits, read documentation program, read investor overlay, set logical clock]
