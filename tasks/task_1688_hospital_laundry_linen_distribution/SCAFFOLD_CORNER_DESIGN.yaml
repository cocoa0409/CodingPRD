            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
