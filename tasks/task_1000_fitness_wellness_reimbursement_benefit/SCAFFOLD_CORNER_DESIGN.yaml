      - name: family_allowance_reconciles_with_dependents
        claim_type: correct_result
        grounds: [calculations.calc_effective_allowance, entities.Enrollment.fields.annual_allowance_cents]
        distinguishing_aspect: "Derived-field reconciliation: FAMILY base 60000 with dep_pct 0.25 recomputes on every dependent add/deactivate — 60000 -> 75000 -> 90000 -> 75000."
        test_recipe:
          setup: ["plan with FAMILY tier (60000 base, dep 0.25); FAMILY member with enrollment"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Family", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "FAMILY", annual_allowance_cents: 60000, quarterly_cap_cents: 20000, per_claim_cap_cents: 8000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Fam One", tier_code: "FAMILY", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id, al0: $.data.annual_allowance_cents } }
          trigger:
            - { call: "POST /api/members/${m_id}/dependents", payload: { full_name: "Spouse One", relationship: "SPOUSE", birth_date: "1990-06-01T00:00:00Z" }, as: BenefitsAdmin, captures: { d1: $.data.id } }
            - { call: "GET /api/enrollments/${enr_id}", payload: {}, as: BenefitsAdmin, captures: { al1: $.data.annual_allowance_cents } }
            - { call: "POST /api/members/${m_id}/dependents", payload: { full_name: "Kid One", relationship: "CHILD", birth_date: "2010-06-01T00:00:00Z" }, as: BenefitsAdmin, captures: { d2: $.data.id } }
            - { call: "GET /api/enrollments/${enr_id}", payload: {}, as: BenefitsAdmin, captures: { al2: $.data.annual_allowance_cents } }
            - { call: "POST /api/dependents/${d1}/deactivate", payload: {}, as: BenefitsAdmin }
            - { call: "GET /api/enrollments/${enr_id}", payload: {}, as: BenefitsAdmin, captures: { al3: $.data.annual_allowance_cents } }
          assert:
            - "annual_allowance_cents == 60000 at enrollment (0 dependents)"
            - "== 75000 after 1 dependent (60000 * 1.25)"
            - "== 90000 after 2 dependents (60000 * 1.50)"
            - "== 75000 after deactivating the spouse (recompute, no drift)"

