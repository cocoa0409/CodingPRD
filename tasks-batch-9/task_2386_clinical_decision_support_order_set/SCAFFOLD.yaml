scenario: "2386. Clinical Decision Support & Order Set Governance (health system clinical informatics committee): content request intake with clinical sponsor and evidence citation, order set build, peer review and specialty approval workflow, alert design with firing criteria, severity tiering and override reason capture, alert burden monitoring and retirement of low-value firings, drug interaction and dosing rule vendor content update review cycles, downtime and read-only behavior for decision support content, post-implementation measurement of adherence and unintended consequences, annual content review with expiration and archival"
domain_name: clinical-decision-support-governance
api_prefix: "/cds"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Order sets, alerts and vendor releases form a reference graph with two
  # self-referential edges (OrderSet.supersedes_order_set_id,
  # VendorContentRelease.supersedes_release_id) and a polymorphic-by-nullable-FK
  # junction (ReviewAssignment targets exactly one of OrderSet | Alert).

  state_machine_shape: parallel
  # OrderSet carries two independent dimensions (review_state x publication_state);
  # OrderSet.review_state and Alert.review_state are cyclic (revision loops);
  # Alert.lifecycle_state is cyclic (ACTIVE -> SUSPENDED -> ACTIVE);
  # VendorContentRelease is a branching fork-join with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # A reviewer may never be the artifact's clinical sponsor nor its builder, and
  # no clinician may hold both a PEER_REVIEW and a SPECIALTY_APPROVAL assignment
  # on the same artifact. Each acting role must be listed in the acting
  # Clinician.authorized_roles.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: display name of the clinician
      - name: npi
        type: string
        source: input
        description: national provider identifier
        default: null
      - name: specialty
        type: enum
        source: input
        description: clinical specialty used for specialty-approval matching
        constraints: "one of INTERNAL_MEDICINE, HOSPITAL_MEDICINE, CRITICAL_CARE, CARDIOLOGY, NEPHROLOGY, ENDOCRINOLOGY, GERIATRICS, ONCOLOGY, PEDIATRICS, EMERGENCY, ORTHOPEDICS, PHARMACY, NURSING, INFORMATICS"
      - name: credential
        type: enum
        source: input
        description: professional credential
        constraints: "one of MD, DO, PHARMD, RN, NP"
      - name: authorized_roles
        type: array
        source: input
        description: role tokens this clinician may act as; the acting X-User-Role must map into this array
        constraints: "non-empty; members drawn from the §1.7 role names ClinicalSponsor, InformaticsBuilder, PeerReviewer, SpecialtyApprover, CommitteeChair, PharmacyInformaticist (SystemAdmin is an opaque principal and never appears here)"
      - name: employment_status
        type: enum
        source: input
        description: employment state; only ACTIVE clinicians may act or be assigned
        default: ACTIVE
        constraints: "one of ACTIVE, INACTIVE"
      - name: review_workload_capacity_minutes
        type: integer
        source: input
        description: committee review time budget for this clinician
        default: 480
        constraints: ">= 0"
      - name: review_workload_assigned_minutes
        type: integer
        source: computed
        description: sum of estimated_minutes over this clinician's ReviewAssignment rows in state ASSIGNED or CAST
        default: 0
      - name: review_workload_remaining_minutes
        type: integer
        source: computed
        description: review_workload_capacity_minutes - review_workload_assigned_minutes
      - name: open_assignment_count
        type: integer
        source: computed
        description: count of this clinician's ReviewAssignment rows in state ASSIGNED
        default: 0

  - name: ContentRequest
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: short title of the requested decision-support content
      - name: request_type
        type: enum
        source: input
        description: what the request asks to be built
        constraints: "one of ORDER_SET, ALERT, BOTH"
      - name: clinical_sponsor_id
        type: string
        source: input
        description: "FK -> Clinician.id; the sponsoring clinician, must have ClinicalSponsor in authorized_roles and employment_status ACTIVE"
      - name: clinical_domain
        type: enum
        source: input
        description: owning clinical domain used for reviewer routing
        constraints: "same enum as Clinician.specialty"
      - name: urgency
        type: enum
        source: input
        description: requested urgency
        constraints: "one of ROUTINE, EXPEDITED, SAFETY_URGENT"
      - name: evidence_grade
        type: enum
        source: input
        description: sponsor-asserted strength of the cited evidence
        constraints: "one of A, B, C, EXPERT_OPINION"
      - name: evidence_citations
        type: array
        source: input
        description: "citation objects { citation: string (required), peer_reviewed: boolean (required), doi: string|null (optional), publication_year: integer|null (optional) }"
        constraints: "length >= 1"
      - name: patient_safety_flag
        type: boolean
        source: input
        description: sponsor asserts this content mitigates a patient-safety event
        default: false
      - name: requested_go_live_at
        type: datetime
        source: input
        description: sponsor-requested go-live instant; advisory only, the chair sets the binding go_live_at at publication
        default: null
      - name: status
        type: enum
        source: system
        description: intake workflow state (see state_machines.ContentRequest)
        default: INTAKE_SUBMITTED
        constraints: "one of INTAKE_SUBMITTED, TRIAGE_ACCEPTED, RETURNED_TO_SPONSOR, DECLINED, BUILD_IN_PROGRESS, CLOSED_IMPLEMENTED"
      - name: priority_score
        type: number
        source: computed
        description: triage priority, 2 decimals; see calculations.content_request_priority_score
      - name: priority_score_basis
        type: enum
        source: computed
        description: which variant produced the stored priority_score
        default: INTAKE_PROVISIONAL
        constraints: "one of INTAKE_PROVISIONAL, COMMITTEE_CALIBRATED"
      - name: peer_reviewed_citation_count
        type: integer
        source: computed
        description: count of evidence_citations entries with peer_reviewed == true
      - name: triage_note
        type: string
        source: system
        description: committee note captured at triage
        default: null
      - name: return_count
        type: integer
        source: computed
        description: number of times this request has been returned to the sponsor
        default: 0

  - name: OrderSet
    parent: ContentRequest
    common_fields: true
    fields:
      - name: content_request_id
        type: string
        source: system
        description: "FK -> ContentRequest.id; taken from the path of the creating call"
      - name: name
        type: string
        source: input
        description: order set display name
      - name: specialty
        type: enum
        source: input
        description: owning specialty
        constraints: "same enum as Clinician.specialty"
      - name: built_by_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the builder of record, which MUST equal the X-User-ID of the InformaticsBuilder issuing the create"
      - name: pinned_vendor_release_id
        type: string
        source: input
        description: "FK -> VendorContentRelease.id; drug-interaction/dosing content version this build is pinned to"
      - name: supersedes_order_set_id
        type: string
        source: input
        description: "FK -> OrderSet.id; the build this one legitimately supersedes"
        default: null
      - name: review_state
        type: enum
        source: system
        description: governance review dimension (see state_machines.OrderSet.review_state)
        default: DRAFT
        constraints: "one of DRAFT, PEER_REVIEW, SPECIALTY_APPROVAL, APPROVED"
      - name: publication_state
        type: enum
        source: system
        description: publication dimension, evolves independently of review_state
        default: UNPUBLISHED
        constraints: "one of UNPUBLISHED, PUBLISHED, EXPIRING, EXPIRED, ARCHIVED, SUPERSEDED"
      - name: risk_class
        type: enum
        source: computed
        description: HIGH when high_alert_item_count >= 1 or the parent ContentRequest.patient_safety_flag is true, else STANDARD
        constraints: "one of STANDARD, HIGH"
      - name: item_count
        type: integer
        source: computed
        description: count of OrderSetItem rows with order_set_id == this.id
        default: 0
      - name: high_alert_item_count
        type: integer
        source: computed
        description: count of OrderSetItem rows with high_alert_medication == true
        default: 0
      - name: peer_required_votes
        type: integer
        source: computed
        description: required PEER_REVIEW votes; see calculations.artifact_quorum_evaluation
        default: null
      - name: peer_cast_count
        type: integer
        source: computed
        description: count of ReviewAssignment rows for this order set with review_kind PEER_REVIEW and state CAST
        default: 0
      - name: peer_approve_ratio
        type: number
        source: computed
        description: approve_count / cast_count over PEER_REVIEW CAST rows, 4 decimals
        default: null
      - name: specialty_required_votes
        type: integer
        source: computed
        description: required SPECIALTY_APPROVAL votes; see calculations.artifact_quorum_evaluation
        default: null
      - name: specialty_cast_count
        type: integer
        source: computed
        description: count of ReviewAssignment rows with review_kind SPECIALTY_APPROVAL and state CAST
        default: 0
      - name: specialty_approve_ratio
        type: number
        source: computed
        description: approve_count / cast_count over SPECIALTY_APPROVAL CAST rows, 4 decimals
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: incremented every time review_state returns to DRAFT from a review state
        default: 0
      - name: votes_cast_count
        type: integer
        source: computed
        description: count of ReviewAssignment rows for this order set in state CAST
        default: 0
      - name: votes_voided_count
        type: integer
        source: computed
        description: count of ReviewAssignment rows for this order set in state VOIDED
        default: 0
      - name: pharmacy_signoff_at
        type: datetime
        source: system
        description: logical-clock instant at which pharmacy signed off on high-alert items
        default: null
      - name: pharmacy_signoff_by_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the pharmacy informaticist who signed off"
        default: null
      - name: go_live_at
        type: datetime
        source: system
        description: publication instant supplied at publish
        default: null
      - name: review_due_date
        type: datetime
        source: computed
        description: go_live_at + REVIEW_INTERVAL_DAYS[risk_class]; see calculations.content_review_schedule
        default: null
      - name: expiration_at
        type: datetime
        source: computed
        description: review_due_date + GRACE_PERIOD_DAYS
        default: null
      - name: archive_eligible_at
        type: datetime
        source: computed
        description: expiration_at + ARCHIVE_AFTER_EXPIRY_DAYS
        default: null
      - name: pinned_content_stale
        type: boolean
        source: computed
        description: true when pinned_vendor_release_id points at a release in review_cycle_state SUPERSEDED
        default: false
      - name: latest_adherence_pct
        type: number
        source: computed
        description: adherence_pct_intention_to_treat of the most recently FINALIZED AdherenceMeasurement for this order set
        default: null
      - name: archived_at
        type: datetime
        source: system
        description: logical-clock instant at which publication_state became ARCHIVED
        default: null

  - name: OrderSetItem
    parent: OrderSet
    common_fields: false
    fields:
      - name: order_set_id
        type: string
        source: system
        description: "FK -> OrderSet.id; taken from the path of the creating call"
      - name: orderable_code
        type: string
        source: input
        description: catalog code of the orderable
      - name: display_name
        type: string
        source: input
        description: display name of the orderable
      - name: item_category
        type: enum
        source: input
        description: orderable category
        constraints: "one of MEDICATION, LAB, IMAGING, NURSING, CONSULT"
      - name: default_selected
        type: boolean
        source: input
        description: whether the line is pre-checked when the order set is opened
        default: false
      - name: default_dose
        type: string
        source: input
        description: "pre-populated dose string for MEDICATION lines, e.g. 40 mg"
        default: null
      - name: route
        type: string
        source: input
        description: administration route
        default: null
      - name: frequency
        type: string
        source: input
        description: administration frequency
        default: null
      - name: high_alert_medication
        type: boolean
        source: input
        description: institution-designated high-alert medication; drives OrderSet.risk_class and pharmacy sign-off
        default: false
      - name: sequence_index
        type: integer
        source: input
        description: "display order within the order set; when omitted the server assigns OrderSet.item_count + 1"
        default: null
        constraints: ">= 1; unique per order_set_id"

  - name: Alert
    parent: ContentRequest
    common_fields: true
    fields:
      - name: content_request_id
        type: string
        source: system
        description: "FK -> ContentRequest.id; taken from the path of the creating call"
      - name: name
        type: string
        source: input
        description: alert display name
      - name: designed_by_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; snapshot of the X-User-ID that designed the alert"
      - name: linked_order_set_id
        type: string
        source: input
        description: "FK -> OrderSet.id; order set whose publication gates this alert's activation"
        default: null
      - name: firing_criteria
        type: object
        source: input
        description: "{ trigger_event: string, expression: string }"
      - name: severity_tier
        type: enum
        source: input
        description: interruption tier; drives quorum size, burden weighting and justification requirements
        constraints: "one of TIER_1_HARD_STOP, TIER_2_INTERRUPTIVE, TIER_3_PASSIVE"
      - name: override_reason_required
        type: boolean
        source: input
        description: whether a firing that is not accepted must carry an override_reason_code
        default: true
      - name: override_reason_codes
        type: array
        source: input
        description: allowed override reason code strings
        default: []
      - name: hard_stop_justification
        type: string
        source: input
        description: required narrative when severity_tier is TIER_1_HARD_STOP
        default: null
      - name: review_state
        type: enum
        source: system
        description: single-stage specialty approval dimension (see state_machines.Alert.review_state)
        default: DRAFT
        constraints: "one of DRAFT, SPECIALTY_APPROVAL, APPROVED"
      - name: lifecycle_state
        type: enum
        source: system
        description: firing lifecycle dimension, cyclic between ACTIVE and SUSPENDED
        default: UNPUBLISHED
        constraints: "one of UNPUBLISHED, ACTIVE, SUSPENDED, RETIRED"
      - name: required_approval_votes
        type: integer
        source: computed
        description: ALERT_REQUIRED_VOTES[severity_tier]; see calculations.artifact_quorum_evaluation
      - name: approval_cast_count
        type: integer
        source: computed
        description: count of ReviewAssignment rows for this alert in state CAST
        default: 0
      - name: lifetime_fire_count
        type: integer
        source: computed
        description: count of OverrideEvent rows with alert_id == this.id
        default: 0
      - name: windowed_fire_count
        type: integer
        source: computed
        description: sum of AlertBurdenWindow.fire_count over this alert's windows in state CLOSED or FINALIZED
        default: 0
      - name: unwindowed_fire_count
        type: integer
        source: computed
        description: lifetime_fire_count - windowed_fire_count; the conserved remainder of the firing ledger
        default: 0
      - name: lifetime_override_count
        type: integer
        source: computed
        description: count of OverrideEvent rows with accepted == false
        default: 0
      - name: latest_burden_index
        type: number
        source: computed
        description: burden_index of the most recently closed AlertBurdenWindow (window_start DESC, created_at DESC)
        default: null
      - name: latest_burden_classification
        type: enum
        source: computed
        description: burden_classification of the most recently closed AlertBurdenWindow
        default: null
        constraints: "one of NO_SIGNAL, HIGH_VALUE, MONITOR, LOW_VALUE"
      - name: suspension_count
        type: integer
        source: computed
        description: number of times lifecycle_state entered SUSPENDED
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: reason recorded on the most recent suspension
        default: null
      - name: restage_count
        type: integer
        source: computed
        description: number of times review_state was forced back to DRAFT by a linked order set revision
        default: 0
      - name: review_due_date
        type: datetime
        source: computed
        description: activation instant + REVIEW_INTERVAL_DAYS[risk_class_of_tier]
        default: null
      - name: expiration_at
        type: datetime
        source: computed
        description: review_due_date + GRACE_PERIOD_DAYS
        default: null
      - name: retired_at
        type: datetime
        source: system
        description: logical-clock instant at which lifecycle_state became RETIRED
        default: null

  - name: AlertBurdenWindow
    parent: Alert
    common_fields: true
    fields:
      - name: alert_id
        type: string
        source: system
        description: "FK -> Alert.id; taken from the path of the creating call"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the half-open monitoring interval
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the half-open monitoring interval
        constraints: "must be strictly after window_start"
      - name: state
        type: enum
        source: system
        description: window lifecycle (see state_machines.AlertBurdenWindow)
        default: OPEN
        constraints: "one of OPEN, CLOSED, FINALIZED"
      - name: closure_reason
        type: enum
        source: system
        description: why the window closed
        default: null
        constraints: "one of MANUAL_CLOSE, SUPERSEDED_BY_NEW_WINDOW, SOURCE_SUSPENDED, ALERT_RETIRED"
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent close
        default: null
      - name: fire_count
        type: integer
        source: computed
        description: count of OverrideEvent rows for the alert with window_start <= fired_at < window_end, computed at close
        default: 0
      - name: override_count
        type: integer
        source: computed
        description: count of in-window OverrideEvent rows with accepted == false
        default: 0
      - name: accept_count
        type: integer
        source: computed
        description: count of in-window OverrideEvent rows with accepted == true
        default: 0
      - name: distinct_fired_clinician_count
        type: integer
        source: computed
        description: count of distinct firing_clinician_ref values among in-window rows
        default: 0
      - name: distinct_overriding_clinician_count
        type: integer
        source: computed
        description: count of distinct firing_clinician_ref values among in-window rows with accepted == false
        default: 0
      - name: override_rate
        type: number
        source: computed
        description: override_count / fire_count, 4 decimals; 0.0000 when fire_count == 0
        default: null
      - name: volume_factor
        type: number
        source: computed
        description: min(VOLUME_FACTOR_CAP, fire_count / EXPECTED_FIRES_PER_WINDOW), 4 decimals
        default: null
      - name: burden_index
        type: number
        source: computed
        description: fire_weighted variant of calculations.alert_burden_index, 2 decimals
        default: null
      - name: burden_index_clinician_weighted
        type: number
        source: computed
        description: clinician_weighted variant of calculations.alert_burden_index, 2 decimals
        default: null
      - name: burden_classification
        type: enum
        source: computed
        description: NO_SIGNAL / HIGH_VALUE / MONITOR / LOW_VALUE from burden_index
        default: null
        constraints: "one of NO_SIGNAL, HIGH_VALUE, MONITOR, LOW_VALUE"
      - name: reopen_count
        type: integer
        source: computed
        description: number of times this window returned from CLOSED to OPEN
        default: 0

  - name: OverrideEvent
    parent: Alert
    common_fields: false
    fields:
      - name: alert_id
        type: string
        source: input
        description: "FK -> Alert.id; the alert that fired"
      - name: firing_clinician_ref
        type: string
        source: system
        description: opaque EHR-supplied clinician reference (SYN-001 style) used only for distinct-clinician counting; never a Clinician.id
      - name: fired_at
        type: datetime
        source: system
        description: instant the alert fired, derived from the ingest generator inputs
      - name: accepted
        type: boolean
        source: system
        description: true when the clinician accepted the advice; false means the alert was overridden
      - name: override_reason_code
        type: string
        source: system
        description: reason code recorded when accepted is false
        default: null
      - name: severity_tier_snapshot
        type: enum
        source: system
        description: Alert.severity_tier at ingest time
        constraints: "one of TIER_1_HARD_STOP, TIER_2_INTERRUPTIVE, TIER_3_PASSIVE"
      - name: ingest_batch_seq
        type: integer
        source: system
        description: 0-based index of this firing inside its ingest batch, pinning deterministic ordering

  - name: ReviewAssignment
    parent: null
    common_fields: true
    fields:
      - name: order_set_id
        type: string
        source: input
        description: "FK -> OrderSet.id; set when the reviewed artifact is an order set"
        default: null
      - name: alert_id
        type: string
        source: input
        description: "FK -> Alert.id; set when the reviewed artifact is an alert"
        default: null
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> Clinician.id; the assigned reviewer"
      - name: due_at
        type: datetime
        source: input
        description: advisory due instant for the reviewer; never enforced as a hard gate
        default: null
      - name: review_kind
        type: enum
        source: input
        description: which governance stage this assignment belongs to
        constraints: "one of PEER_REVIEW, SPECIALTY_APPROVAL"
      - name: state
        type: enum
        source: system
        description: assignment lifecycle (see state_machines.ReviewAssignment)
        default: ASSIGNED
        constraints: "one of ASSIGNED, CAST, WITHDRAWN, VOIDED"
      - name: estimated_minutes
        type: integer
        source: computed
        description: REVIEW_MINUTES[review_kind][risk_class_snapshot]; debited from the reviewer's workload
      - name: risk_class_snapshot
        type: enum
        source: computed
        description: artifact risk class at assignment time
        constraints: "one of STANDARD, HIGH"
      - name: vote
        type: enum
        source: system
        description: recorded vote
        default: null
        constraints: "one of APPROVE, REVISE, REJECT"
      - name: comment
        type: string
        source: system
        description: reviewer comment recorded at cast
        default: null
      - name: evidence_concern
        type: boolean
        source: system
        description: reviewer flagged an evidence concern; raises the PEER_REVIEW quorum bar
        default: false
      - name: cast_at
        type: datetime
        source: system
        description: logical-clock instant of the cast
        default: null
      - name: withdrawal_reason
        type: string
        source: system
        description: reason recorded when the chair withdraws the assignment
        default: null
      - name: void_reason
        type: enum
        source: system
        description: why the assignment was voided by cascade
        default: null
        constraints: "one of ARTIFACT_RETURNED_TO_DRAFT, ARTIFACT_SUPERSEDED"

  - name: VendorContentRelease
    parent: null
    common_fields: true
    fields:
      - name: vendor_name
        type: string
        source: input
        description: drug-interaction/dosing content vendor
      - name: release_label
        type: string
        source: input
        description: vendor release label
        constraints: "unique per vendor_name"
      - name: content_domain
        type: enum
        source: input
        description: which vendor knowledge base the release updates
        constraints: "one of DRUG_INTERACTION, DOSING, ALLERGY, DUPLICATE_THERAPY"
      - name: received_at
        type: datetime
        source: input
        description: instant the release was received by the health system; defaults to clock_now when omitted
        default: null
      - name: effective_at
        type: datetime
        source: input
        description: earliest instant the release may be activated
        default: null
      - name: supersedes_release_id
        type: string
        source: input
        description: "FK -> VendorContentRelease.id; the release this one replaces on activation"
        default: null
      - name: review_cycle_state
        type: enum
        source: system
        description: vendor content review cycle (see state_machines.VendorContentRelease)
        default: RECEIVED
        constraints: "one of RECEIVED, IMPACT_ANALYZED_FAST_TRACK, IMPACT_ANALYZED_CLINICAL_REVIEW, ACTIVATED, SUPERSEDED"
      - name: delta_count
        type: integer
        source: computed
        description: count of VendorRuleDelta rows with vendor_release_id == this.id
        default: 0
      - name: contraindicated_delta_count
        type: integer
        source: computed
        description: count of deltas with new_severity == CONTRAINDICATED
        default: 0
      - name: dispositioned_delta_count
        type: integer
        source: computed
        description: count of deltas with disposition not null
        default: 0
      - name: impact_score
        type: integer
        source: computed
        description: see calculations.vendor_release_impact_score; null until impact analysis runs
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant of activation
        default: null
      - name: restaged_order_set_count
        type: integer
        source: computed
        description: number of published order sets marked pinned_content_stale by this activation
        default: 0

  - name: VendorRuleDelta
    parent: VendorContentRelease
    common_fields: true
    fields:
      - name: vendor_release_id
        type: string
        source: system
        description: "FK -> VendorContentRelease.id; taken from the path of the creating call"
      - name: rule_code
        type: string
        source: input
        description: vendor rule identifier
        constraints: "unique per vendor_release_id"
      - name: change_type
        type: enum
        source: input
        description: nature of the vendor change
        constraints: "one of NEW_INTERACTION, SEVERITY_INCREASED, SEVERITY_DECREASED, RETIRED_INTERACTION, DOSING_BOUND_CHANGED"
      - name: description
        type: string
        source: input
        description: vendor-supplied prose description of the change
      - name: drug_pair
        type: string
        source: input
        description: interacting drug pair or dosing target
        default: null
      - name: prior_severity
        type: enum
        source: input
        description: pre-change severity as carried by the superseded release
        default: null
        constraints: "one of CONTRAINDICATED, MAJOR, MODERATE, MINOR"
      - name: new_severity
        type: enum
        source: input
        description: post-change severity asserted by the vendor
        default: null
        constraints: "one of CONTRAINDICATED, MAJOR, MODERATE, MINOR"
      - name: weight
        type: integer
        source: computed
        description: DELTA_WEIGHTS[change_type]; the delta's contribution to impact_score
      - name: disposition
        type: enum
        source: system
        description: local decision on the vendor change
        default: null
        constraints: "one of ACCEPT, SUPPRESS, CUSTOMIZE"
      - name: suppression_justification
        type: string
        source: system
        description: required narrative when disposition is SUPPRESS
        default: null
      - name: dispositioned_at
        type: datetime
        source: system
        description: logical-clock instant of the disposition
        default: null

  - name: DowntimeEvent
    parent: null
    common_fields: true
    fields:
      - name: scope
        type: enum
        source: input
        description: which decision-support content the downtime covers
        constraints: "one of SYSTEM_WIDE, ORDER_SETS_ONLY, ALERTS_ONLY"
      - name: mode
        type: enum
        source: input
        description: READ_ONLY blocks in-scope mutations; FULL_UNAVAILABLE blocks in-scope reads as well
        constraints: "one of READ_ONLY, FULL_UNAVAILABLE"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the closed downtime interval
      - name: window_end
        type: datetime
        source: input
        description: inclusive end of the closed downtime interval
      - name: reason
        type: string
        source: input
        description: operational reason recorded for the downtime
        default: null
        constraints: "must be strictly after window_start"
      - name: planned
        type: boolean
        source: input
        description: whether the downtime was planned
        default: true
      - name: declared_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the declaring operator
      - name: state
        type: enum
        source: system
        description: downtime lifecycle (see state_machines.DowntimeEvent)
        default: SCHEDULED
        constraints: "one of SCHEDULED, ACTIVE, CLOSED, CANCELLED"
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant of activation
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of closure
        default: null
      - name: blocked_mutation_count
        type: integer
        source: computed
        description: number of in-scope mutations this downtime rejected while ACTIVE
        default: 0

  - name: AdherenceMeasurement
    parent: OrderSet
    common_fields: true
    fields:
      - name: order_set_id
        type: string
        source: system
        description: "FK -> OrderSet.id; taken from the path of the creating call"
      - name: measurement_period_start
        type: datetime
        source: input
        description: inclusive start of the measurement period
      - name: measurement_period_end
        type: datetime
        source: input
        description: exclusive end of the measurement period
        constraints: "must be strictly after measurement_period_start"
      - name: unit_observations
        type: array
        source: input
        description: "per-unit rows { unit_code: string, eligible_orders: integer, adherent_orders: integer, unintended_events: integer }"
        constraints: "length >= 1; adherent_orders <= eligible_orders; all counts >= 0"
      - name: measurement_state
        type: enum
        source: system
        description: measurement lifecycle (see state_machines.AdherenceMeasurement)
        default: PROVISIONAL
        constraints: "one of PROVISIONAL, FINALIZED, INSUFFICIENT_DATA"
      - name: included_unit_count
        type: integer
        source: computed
        description: count of unit_observations rows with eligible_orders > 0
      - name: excluded_unit_count
        type: integer
        source: computed
        description: count of unit_observations rows with eligible_orders == 0
      - name: adherence_pct_per_protocol
        type: number
        source: computed
        description: per_protocol variant of calculations.order_set_adherence, 2 decimals
        default: null
      - name: adherence_pct_intention_to_treat
        type: number
        source: computed
        description: intention_to_treat variant of calculations.order_set_adherence, 2 decimals; null until FINALIZED
        default: null
      - name: unintended_event_count
        type: integer
        source: computed
        description: sum of unintended_events over all unit_observations rows
        default: 0
      - name: unintended_event_rate_per_100
        type: number
        source: computed
        description: pooled unintended events per 100 eligible orders, 2 decimals
        default: null
      - name: verdict
        type: enum
        source: system
        description: committee verdict recorded at finalize
        default: null
        constraints: "one of SUSTAIN, REVISE, RETIRE"
      - name: finalized_at
        type: datetime
        source: system
        description: logical-clock instant of finalization
        default: null

  - name: AnnualReviewTask
    parent: null
    common_fields: true
    fields:
      - name: order_set_id
        type: string
        source: system
        description: "FK -> OrderSet.id; set when artifact_kind is ORDER_SET"
        default: null
      - name: alert_id
        type: string
        source: system
        description: "FK -> Alert.id; set when artifact_kind is ALERT"
        default: null
      - name: attested_by_clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; the sponsor who attested the current cycle"
        default: null
      - name: evidence_citations
        type: array
        source: input
        description: "citation objects supplied by the attesting sponsor, same shape as ContentRequest.evidence_citations; empty until the cycle is attested"
        default: []
      - name: artifact_kind
        type: enum
        source: system
        description: which artifact this task governs
        constraints: "one of ORDER_SET, ALERT"
      - name: state
        type: enum
        source: system
        description: annual review lifecycle (see state_machines.AnnualReviewTask)
        default: PENDING
        constraints: "one of PENDING, OVERDUE, ATTESTED, EXPIRED"
      - name: review_due_date
        type: datetime
        source: computed
        description: mirror of the governed artifact's review_due_date for the current cycle
      - name: expiration_at
        type: datetime
        source: computed
        description: review_due_date + GRACE_PERIOD_DAYS
      - name: archive_eligible_at
        type: datetime
        source: computed
        description: expiration_at + ARCHIVE_AFTER_EXPIRY_DAYS
      - name: stale_content_triggered
        type: boolean
        source: computed
        description: true when a vendor activation pulled review_due_date forward
        default: false
      - name: attested_at
        type: datetime
        source: system
        description: logical-clock instant of attestation
        default: null
      - name: attestation_note
        type: string
        source: system
        description: sponsor attestation narrative
        default: null
      - name: cycle_index
        type: integer
        source: computed
        description: 1 for the first review cycle, incremented on every attestation that opens a new cycle
        default: 1

state_machines:
  - entity: ContentRequest
    state_field: status
    initial_state: INTAKE_SUBMITTED
    terminal_states: [DECLINED, CLOSED_IMPLEMENTED]
    transitions:
      - from: INTAKE_SUBMITTED
        to: TRIAGE_ACCEPTED
        trigger: "POST /cds/content-requests/{id}/triage with decision ACCEPT"
        actor: CommitteeChair
        preconditions:
          - "status == INTAKE_SUBMITTED"
          - "evidence sufficiency holds per validations[priority=15]"
        side_effects:
          - "recompute priority_score with the committee_calibrated variant of calculations.content_request_priority_score"
          - "set priority_score_basis = COMMITTEE_CALIBRATED"
          - "store triage_note"
          - "increment version by 1"
      - from: INTAKE_SUBMITTED
        to: RETURNED_TO_SPONSOR
        trigger: "POST /cds/content-requests/{id}/triage with decision RETURN"
        actor: CommitteeChair
        preconditions: ["status == INTAKE_SUBMITTED"]
        side_effects:
          - "increment return_count by 1"
          - "store triage_note"
          - "priority_score and priority_score_basis are left unchanged"
          - "increment version by 1"
      - from: INTAKE_SUBMITTED
        to: DECLINED
        trigger: "POST /cds/content-requests/{id}/triage with decision DECLINE"
        actor: CommitteeChair
        preconditions: ["status == INTAKE_SUBMITTED"]
        side_effects: ["store triage_note", "increment version by 1"]
      - from: RETURNED_TO_SPONSOR
        to: INTAKE_SUBMITTED
        trigger: "POST /cds/content-requests/{id}/resubmit"
        actor: ClinicalSponsor
        preconditions:
          - "status == RETURNED_TO_SPONSOR"
          - "X-User-ID == clinical_sponsor_id"
        side_effects:
          - "replace evidence_citations with the submitted array and recompute peer_reviewed_citation_count"
          - "recompute priority_score with the intake_provisional variant; set priority_score_basis = INTAKE_PROVISIONAL"
          - "increment version by 1"
        note: "cycle: a request may be returned and resubmitted any number of times"
      - from: TRIAGE_ACCEPTED
        to: BUILD_IN_PROGRESS
        trigger: "POST /cds/content-requests/{id}/order-sets or POST /cds/content-requests/{id}/alerts (first build artifact)"
        actor: InformaticsBuilder
        preconditions: ["status == TRIAGE_ACCEPTED"]
        side_effects: ["increment version by 1"]
      - from: BUILD_IN_PROGRESS
        to: CLOSED_IMPLEMENTED
        trigger: "system: POST /cds/order-sets/{id}/publish, or POST /cds/alerts/{id}/activate, closing the request"
        actor: system
        preconditions:
          - "status == BUILD_IN_PROGRESS"
          - "for request_type ORDER_SET: at least one child OrderSet has publication_state == PUBLISHED"
          - "for request_type ALERT: at least one child Alert has lifecycle_state == ACTIVE"
          - "for request_type BOTH: both of the above hold"
        side_effects: ["increment version by 1"]

  - entity: OrderSet
    state_field: review_state
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PEER_REVIEW
        trigger: "POST /cds/order-sets/{id}/submit-for-peer-review"
        actor: InformaticsBuilder
        preconditions:
          - "review_state == DRAFT"
          - "item_count >= 1"
          - "publication_state IN {UNPUBLISHED, EXPIRING, EXPIRED}"
          - "no ACTIVE DowntimeEvent covers OrderSet per validations[priority=12]"
        side_effects:
          - "recompute risk_class from high_alert_item_count and parent ContentRequest.patient_safety_flag"
          - "set peer_required_votes = calculations.artifact_quorum_evaluation step 4 for stage PEER_REVIEW"
          - "increment version by 1"
      - from: PEER_REVIEW
        to: SPECIALTY_APPROVAL
        trigger: "system: quorum met on the PEER_REVIEW stage during POST /cds/review-assignments/{id}/cast"
        actor: system
        preconditions:
          - "review_state == PEER_REVIEW"
          - "peer_cast_count >= peer_required_votes"
          - "peer_approve_ratio >= REQUIRED_APPROVAL_RATIO[risk_class]"
          - "zero PEER_REVIEW ReviewAssignment rows with vote == REJECT"
        side_effects:
          - "set specialty_required_votes = calculations.artifact_quorum_evaluation step 4 for stage SPECIALTY_APPROVAL"
          - "increment version by 1"
      - from: SPECIALTY_APPROVAL
        to: APPROVED
        trigger: "system: quorum met on the SPECIALTY_APPROVAL stage during POST /cds/review-assignments/{id}/cast"
        actor: system
        preconditions:
          - "review_state == SPECIALTY_APPROVAL"
          - "specialty_cast_count >= specialty_required_votes"
          - "specialty_approve_ratio >= REQUIRED_APPROVAL_RATIO[risk_class]"
          - "zero SPECIALTY_APPROVAL ReviewAssignment rows with vote == REJECT"
        side_effects: ["increment version by 1"]
      - from: SPECIALTY_APPROVAL
        to: DRAFT
        trigger: "POST /cds/review-assignments/{id}/cast with vote REVISE or REJECT on a SPECIALTY_APPROVAL assignment"
        actor: SpecialtyApprover
        preconditions: ["review_state == SPECIALTY_APPROVAL", "the casting assignment is in state ASSIGNED"]
        side_effects:
          - "CASCADE LINK 1: review_state -> DRAFT and revision_round += 1"
          - "CASCADE LINK 2: because the order set returned to DRAFT, every OTHER ReviewAssignment on this order set in state ASSIGNED or CAST transitions to VOIDED with void_reason ARTIFACT_RETURNED_TO_DRAFT"
          - "CASCADE LINK 3: because each of those assignments was voided, its reviewer Clinician.review_workload_assigned_minutes is reduced by that assignment's estimated_minutes and review_workload_remaining_minutes is recomputed"
          - "CASCADE LINK 4: because the order set is no longer in approval, every Alert with linked_order_set_id == this.id whose lifecycle_state == UNPUBLISHED and review_state IN {SPECIALTY_APPROVAL, APPROVED} has review_state forced to DRAFT and restage_count += 1"
          - "recompute peer_cast_count, specialty_cast_count, votes_cast_count, votes_voided_count"
          - "increment version by 1"
        note: "cyclic revision loop; the triggering assignment itself stays CAST with its vote recorded"
      - from: PEER_REVIEW
        to: DRAFT
        trigger: "POST /cds/review-assignments/{id}/cast with vote REJECT on a PEER_REVIEW assignment"
        actor: PeerReviewer
        preconditions: ["review_state == PEER_REVIEW", "the casting assignment is in state ASSIGNED"]
        side_effects:
          - "review_state -> DRAFT and revision_round += 1"
          - "every OTHER ReviewAssignment on this order set in state ASSIGNED or CAST transitions to VOIDED with void_reason ARTIFACT_RETURNED_TO_DRAFT, crediting each reviewer's workload minutes back"
          - "increment version by 1"
        note: "a PEER_REVIEW vote of REVISE does not revert the stage; it only lowers peer_approve_ratio"

  - entity: OrderSet
    state_field: publication_state
    initial_state: UNPUBLISHED
    terminal_states: [ARCHIVED, SUPERSEDED]
    transitions:
      - from: UNPUBLISHED
        to: PUBLISHED
        trigger: "POST /cds/order-sets/{id}/publish"
        actor: CommitteeChair
        preconditions:
          - "publication_state == UNPUBLISHED"
          - "review_state == APPROVED"
          - "pinned VendorContentRelease.review_cycle_state == ACTIVATED"
          - "if high_alert_item_count >= 1 then pharmacy_signoff_at is not null"
          - "no ACTIVE DowntimeEvent covers OrderSet per validations[priority=12]"
        side_effects:
          - "set go_live_at from the request body"
          - "compute review_due_date, expiration_at, archive_eligible_at per calculations.content_review_schedule"
          - "create one AnnualReviewTask with artifact_kind ORDER_SET, state PENDING, cycle_index 1 mirroring those three dates"
          - "if the parent ContentRequest.status == BUILD_IN_PROGRESS and its request_type is satisfied, transition it to CLOSED_IMPLEMENTED"
          - "increment version by 1"
      - from: PUBLISHED
        to: EXPIRING
        trigger: "POST /cds/_ops/run-expiration-sweep when clock_now >= review_due_date and clock_now < expiration_at"
        actor: system
        preconditions: ["publication_state == PUBLISHED", "the governing AnnualReviewTask transitioned PENDING -> OVERDUE in this sweep"]
        side_effects: ["increment version by 1"]
      - from: EXPIRING
        to: PUBLISHED
        trigger: "POST /cds/annual-review-tasks/{id}/attest"
        actor: ClinicalSponsor
        preconditions: ["publication_state == EXPIRING", "the governing AnnualReviewTask.state IN {PENDING, OVERDUE}"]
        side_effects:
          - "recompute review_due_date = clock_now + REVIEW_INTERVAL_DAYS[risk_class], expiration_at, archive_eligible_at"
          - "increment version by 1"
        note: "cycle: attestation returns an expiring order set to PUBLISHED for a new review cycle"
      - from: EXPIRING
        to: EXPIRED
        trigger: "POST /cds/_ops/run-expiration-sweep when clock_now >= expiration_at"
        actor: system
        preconditions: ["publication_state == EXPIRING", "the governing AnnualReviewTask transitioned to EXPIRED in this sweep"]
        side_effects:
          - "CASCADE LINK 2 of the sweep chain: publication_state -> EXPIRED"
          - "CASCADE LINK 3: because this order set expired, every Alert with linked_order_set_id == this.id and lifecycle_state == ACTIVE transitions to SUSPENDED with suspension_reason SOURCE_CONTENT_EXPIRED and suspension_count += 1"
          - "increment version by 1"
      - from: PUBLISHED
        to: EXPIRED
        trigger: "POST /cds/_ops/run-expiration-sweep when clock_now >= expiration_at and the sweep skipped the EXPIRING step"
        actor: system
        preconditions: ["publication_state == PUBLISHED", "clock_now >= expiration_at"]
        side_effects:
          - "same cascade as EXPIRING -> EXPIRED"
          - "increment version by 1"
      - from: EXPIRED
        to: ARCHIVED
        trigger: "POST /cds/_ops/run-expiration-sweep when clock_now >= archive_eligible_at"
        actor: system
        preconditions: ["publication_state == EXPIRED", "clock_now >= archive_eligible_at"]
        side_effects:
          - "set archived_at = clock_now"
          - "because this order set archived, every Alert with linked_order_set_id == this.id and lifecycle_state == SUSPENDED transitions to RETIRED with retired_at = clock_now"
          - "because each such alert retired, every AlertBurdenWindow of that alert in state CLOSED transitions to FINALIZED and every window in state OPEN is closed with closure_reason ALERT_RETIRED then FINALIZED"
          - "increment version by 1"
      - from: UNPUBLISHED
        to: SUPERSEDED
        trigger: "POST /cds/content-requests/{id}/order-sets with supersedes_order_set_id pointing at this order set"
        actor: InformaticsBuilder
        preconditions: ["publication_state == UNPUBLISHED"]
        side_effects:
          - "every ReviewAssignment on this order set in state ASSIGNED or CAST transitions to VOIDED with void_reason ARTIFACT_SUPERSEDED, crediting each reviewer's workload minutes back"
          - "increment version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /cds/order-sets/{id}/publish on a successor whose supersedes_order_set_id == this.id"
        actor: CommitteeChair
        preconditions: ["publication_state == PUBLISHED"]
        side_effects:
          - "the governing AnnualReviewTask of this order set transitions to ATTESTED is NOT performed; it transitions to EXPIRED with state EXPIRED and stale_content_triggered unchanged"
          - "every Alert with linked_order_set_id == this.id and lifecycle_state == ACTIVE is re-linked to the successor order set"
          - "increment version by 1"

  - entity: Alert
    state_field: review_state
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SPECIALTY_APPROVAL
        trigger: "POST /cds/review-assignments with alert_id set (first assignment on this alert)"
        actor: CommitteeChair
        preconditions:
          - "review_state == DRAFT"
          - "if severity_tier == TIER_1_HARD_STOP then hard_stop_justification is not null"
        side_effects:
          - "set required_approval_votes = ALERT_REQUIRED_VOTES[severity_tier]"
          - "increment version by 1"
      - from: SPECIALTY_APPROVAL
        to: APPROVED
        trigger: "system: unanimous quorum met during POST /cds/review-assignments/{id}/cast"
        actor: system
        preconditions:
          - "review_state == SPECIALTY_APPROVAL"
          - "approval_cast_count >= required_approval_votes"
          - "every CAST assignment on this alert has vote == APPROVE (ratio 1.0000)"
        side_effects: ["increment version by 1"]
      - from: SPECIALTY_APPROVAL
        to: DRAFT
        trigger: "POST /cds/review-assignments/{id}/cast with vote REVISE or REJECT on an alert assignment"
        actor: SpecialtyApprover
        preconditions: ["review_state == SPECIALTY_APPROVAL"]
        side_effects:
          - "every OTHER ReviewAssignment on this alert in state ASSIGNED or CAST transitions to VOIDED with void_reason ARTIFACT_RETURNED_TO_DRAFT, crediting each reviewer's workload minutes back"
          - "increment version by 1"
        note: "cyclic revision loop on the alert's single approval stage"
      - from: APPROVED
        to: DRAFT
        trigger: "system: linked OrderSet.review_state returned to DRAFT (cascade link 4)"
        actor: system
        preconditions: ["review_state IN {SPECIALTY_APPROVAL, APPROVED}", "lifecycle_state == UNPUBLISHED"]
        side_effects: ["restage_count += 1", "increment version by 1"]

  - entity: Alert
    state_field: lifecycle_state
    initial_state: UNPUBLISHED
    terminal_states: [RETIRED]
    transitions:
      - from: UNPUBLISHED
        to: ACTIVE
        trigger: "POST /cds/alerts/{id}/activate"
        actor: CommitteeChair
        preconditions:
          - "lifecycle_state == UNPUBLISHED"
          - "review_state == APPROVED"
          - "if linked_order_set_id is not null then that OrderSet.publication_state == PUBLISHED"
          - "no ACTIVE DowntimeEvent covers Alert per validations[priority=12]"
        side_effects:
          - "compute review_due_date = clock_now + REVIEW_INTERVAL_DAYS[HIGH if severity_tier == TIER_1_HARD_STOP else STANDARD] and expiration_at = review_due_date + GRACE_PERIOD_DAYS"
          - "create one AnnualReviewTask with artifact_kind ALERT, state PENDING, cycle_index 1"
          - "if the parent ContentRequest.status == BUILD_IN_PROGRESS and its request_type is satisfied, transition it to CLOSED_IMPLEMENTED"
          - "increment version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cds/alerts/{id}/suspend, or system cascade from a linked order set expiring"
        actor: CommitteeChair | system
        preconditions: ["lifecycle_state == ACTIVE"]
        side_effects:
          - "store suspension_reason and suspension_count += 1"
          - "CASCADE: because the alert suspended, its AlertBurdenWindow in state OPEN (if any) is closed with closure_reason SOURCE_SUSPENDED, which computes that window's fire_count, override_count, override_rate, volume_factor, burden_index, burden_index_clinician_weighted and burden_classification"
          - "CASCADE: because that window closed, windowed_fire_count, unwindowed_fire_count, latest_burden_index and latest_burden_classification are recomputed on this alert"
          - "increment version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cds/alerts/{id}/resume"
        actor: CommitteeChair
        preconditions:
          - "lifecycle_state == SUSPENDED"
          - "review_state == APPROVED"
          - "if linked_order_set_id is not null then that OrderSet.publication_state == PUBLISHED"
        side_effects: ["clear suspension_reason", "increment version by 1"]
        note: "cycle: an alert may be suspended and resumed any number of times; suspension_count accumulates"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /cds/alerts/{id}/retire"
        actor: CommitteeChair
        preconditions:
          - "lifecycle_state == ACTIVE"
          - "retirement criteria hold per calculations.low_value_retirement_eligibility"
        side_effects:
          - "set retired_at = clock_now"
          - "every AlertBurdenWindow of this alert in state OPEN is closed with closure_reason ALERT_RETIRED, then every CLOSED window transitions to FINALIZED"
          - "the governing AnnualReviewTask in state PENDING or OVERDUE transitions to EXPIRED"
          - "increment version by 1"
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /cds/alerts/{id}/retire, or system cascade from a linked order set archiving"
        actor: CommitteeChair | system
        preconditions:
          - "lifecycle_state == SUSPENDED"
          - "for the CommitteeChair trigger: retirement criteria hold per calculations.low_value_retirement_eligibility"
        side_effects: ["same as ACTIVE -> RETIRED", "increment version by 1"]

  - entity: ReviewAssignment
    state_field: state
    initial_state: ASSIGNED
    terminal_states: [WITHDRAWN, VOIDED]
    transitions:
      - from: ASSIGNED
        to: CAST
        trigger: "POST /cds/review-assignments/{id}/cast"
        actor: PeerReviewer | SpecialtyApprover
        preconditions:
          - "state == ASSIGNED"
          - "X-User-ID == reviewer_id"
          - "for review_kind PEER_REVIEW: the target OrderSet.review_state == PEER_REVIEW"
          - "for review_kind SPECIALTY_APPROVAL on an order set: OrderSet.review_state == SPECIALTY_APPROVAL"
          - "for review_kind SPECIALTY_APPROVAL on an alert: Alert.review_state == SPECIALTY_APPROVAL"
        side_effects:
          - "store vote, comment, evidence_concern and cast_at"
          - "recompute the target artifact's cast counts and approve ratios, then re-evaluate calculations.artifact_quorum_evaluation which may auto-advance the artifact's review_state"
          - "reviewer workload minutes stay debited (the work was performed)"
          - "increment version by 1"
      - from: ASSIGNED
        to: WITHDRAWN
        trigger: "POST /cds/review-assignments/{id}/withdraw"
        actor: CommitteeChair
        preconditions: ["state == ASSIGNED"]
        side_effects:
          - "COMPENSATION: reviewer Clinician.review_workload_assigned_minutes -= estimated_minutes and review_workload_remaining_minutes is recomputed, restoring the pre-assignment workload ledger exactly"
          - "reviewer Clinician.open_assignment_count -= 1"
          - "store withdrawal_reason"
          - "increment version by 1"
      - from: ASSIGNED
        to: VOIDED
        trigger: "system: target artifact returned to DRAFT or superseded"
        actor: system
        preconditions: ["state == ASSIGNED"]
        side_effects:
          - "set void_reason"
          - "reviewer workload minutes credited back exactly as in WITHDRAWN"
          - "increment version by 1"
      - from: CAST
        to: VOIDED
        trigger: "system: target artifact returned to DRAFT or superseded"
        actor: system
        preconditions: ["state == CAST"]
        side_effects:
          - "set void_reason; the recorded vote is retained for audit and never deleted"
          - "reviewer workload minutes credited back"
          - "target artifact votes_cast_count -= 1 and votes_voided_count += 1"
          - "increment version by 1"

  - entity: VendorContentRelease
    state_field: review_cycle_state
    initial_state: RECEIVED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: IMPACT_ANALYZED_FAST_TRACK
        trigger: "POST /cds/vendor-releases/{id}/run-impact-analysis when impact_score < CLINICAL_REVIEW_THRESHOLD"
        actor: PharmacyInformaticist
        preconditions: ["review_cycle_state == RECEIVED", "delta_count >= 1"]
        side_effects:
          - "compute and store impact_score per calculations.vendor_release_impact_score"
          - "increment version by 1"
        note: "fork branch A"
      - from: RECEIVED
        to: IMPACT_ANALYZED_CLINICAL_REVIEW
        trigger: "POST /cds/vendor-releases/{id}/run-impact-analysis when impact_score >= CLINICAL_REVIEW_THRESHOLD"
        actor: PharmacyInformaticist
        preconditions: ["review_cycle_state == RECEIVED", "delta_count >= 1"]
        side_effects:
          - "compute and store impact_score per calculations.vendor_release_impact_score"
          - "increment version by 1"
        note: "fork branch B"
      - from: IMPACT_ANALYZED_FAST_TRACK
        to: ACTIVATED
        trigger: "POST /cds/vendor-releases/{id}/activate"
        actor: PharmacyInformaticist | CommitteeChair
        preconditions:
          - "review_cycle_state == IMPACT_ANALYZED_FAST_TRACK"
          - "dispositioned_delta_count == delta_count"
          - "effective_at is null or clock_now >= effective_at"
        side_effects:
          - "set activated_at = clock_now"
          - "if supersedes_release_id is not null, that release transitions to SUPERSEDED"
          - "restaged_order_set_count stays 0: the FAST_TRACK branch does NOT restage pinned order sets and does NOT touch any AnnualReviewTask"
          - "increment version by 1"
        note: "join point, branch A side-effect set"
      - from: IMPACT_ANALYZED_CLINICAL_REVIEW
        to: ACTIVATED
        trigger: "POST /cds/vendor-releases/{id}/activate"
        actor: CommitteeChair
        preconditions:
          - "review_cycle_state == IMPACT_ANALYZED_CLINICAL_REVIEW"
          - "dispositioned_delta_count == delta_count"
          - "every delta with disposition SUPPRESS has a non-null suppression_justification"
          - "effective_at is null or clock_now >= effective_at"
        side_effects:
          - "CASCADE LINK 1: set activated_at = clock_now and transition the release named by supersedes_release_id to SUPERSEDED"
          - "CASCADE LINK 2: because that predecessor release became SUPERSEDED, every OrderSet with pinned_vendor_release_id == predecessor.id and publication_state == PUBLISHED gets pinned_content_stale = true, and restaged_order_set_count is set to the number of order sets so marked"
          - "CASCADE LINK 3: because each of those order sets now carries stale pinned content, its AnnualReviewTask in state PENDING or OVERDUE has review_due_date pulled to clock_now + STALE_CONTENT_REVIEW_DAYS, expiration_at and archive_eligible_at recomputed from it, and stale_content_triggered set to true; the same three dates are mirrored onto the order set"
          - "increment version by 1"
        note: "join point, branch B side-effect set — divergent from branch A"

  - entity: AlertBurdenWindow
    state_field: state
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /cds/alerts/{id}/burden-windows/{window_id}/close, or system close on supersede / suspension / retirement"
        actor: SystemAdmin | system
        preconditions: ["state == OPEN"]
        side_effects:
          - "compute fire_count, override_count, accept_count, distinct_fired_clinician_count and distinct_overriding_clinician_count from OverrideEvent rows of the alert with window_start <= fired_at < window_end"
          - "compute override_rate, volume_factor, burden_index, burden_index_clinician_weighted and burden_classification per calculations.alert_burden_index"
          - "set closure_reason and closed_at"
          - "LEDGER: alert.windowed_fire_count += fire_count and alert.unwindowed_fire_count = alert.lifetime_fire_count - alert.windowed_fire_count"
          - "set alert.latest_burden_index and alert.latest_burden_classification"
          - "increment version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /cds/alerts/{id}/burden-windows/{window_id}/reopen"
        actor: SystemAdmin
        preconditions:
          - "state == CLOSED"
          - "no other AlertBurdenWindow of this alert is in state OPEN"
        side_effects:
          - "COMPENSATION: reset fire_count, override_count, accept_count, distinct_fired_clinician_count, distinct_overriding_clinician_count to 0 and override_rate, volume_factor, burden_index, burden_index_clinician_weighted, burden_classification, closure_reason, closed_at to null"
          - "LEDGER: alert.windowed_fire_count -= the fire_count that was just discarded and alert.unwindowed_fire_count = alert.lifetime_fire_count - alert.windowed_fire_count, leaving lifetime_fire_count unchanged"
          - "recompute alert.latest_burden_index and alert.latest_burden_classification from the remaining CLOSED / FINALIZED windows, or null when none remain"
          - "reopen_count += 1"
          - "increment version by 1"
        note: "cycle: a window may be closed and reopened repeatedly; the firing ledger must not drift"
      - from: CLOSED
        to: FINALIZED
        trigger: "system: owning Alert transitioned to RETIRED"
        actor: system
        preconditions: ["state == CLOSED", "alert.lifecycle_state == RETIRED"]
        side_effects: ["increment version by 1"]

  - entity: AnnualReviewTask
    state_field: state
    initial_state: PENDING
    terminal_states: [ATTESTED, EXPIRED]
    transitions:
      - from: PENDING
        to: OVERDUE
        trigger: "POST /cds/_ops/run-expiration-sweep when clock_now >= review_due_date and clock_now < expiration_at"
        actor: system
        preconditions: ["state == PENDING", "clock_now >= review_due_date"]
        side_effects:
          - "because the task became OVERDUE, the governed OrderSet transitions PUBLISHED -> EXPIRING (no change for artifact_kind ALERT)"
          - "increment version by 1"
      - from: PENDING
        to: ATTESTED
        trigger: "POST /cds/annual-review-tasks/{id}/attest"
        actor: ClinicalSponsor
        preconditions:
          - "state == PENDING"
          - "X-User-ID == the governed artifact's ContentRequest.clinical_sponsor_id"
          - "the submitted evidence_citations array is non-empty"
        side_effects:
          - "set attested_at, attestation_note, attested_by_clinician_id"
          - "the governed artifact's review_due_date is recomputed as clock_now + REVIEW_INTERVAL_DAYS[risk_class]; expiration_at and archive_eligible_at follow"
          - "a fresh AnnualReviewTask is created in state PENDING with cycle_index = this.cycle_index + 1 mirroring the new dates"
          - "increment version by 1"
      - from: OVERDUE
        to: ATTESTED
        trigger: "POST /cds/annual-review-tasks/{id}/attest"
        actor: ClinicalSponsor
        preconditions: ["state == OVERDUE", "X-User-ID == the governed artifact's ContentRequest.clinical_sponsor_id"]
        side_effects:
          - "same as PENDING -> ATTESTED"
          - "because the task was attested, the governed OrderSet transitions EXPIRING -> PUBLISHED"
          - "increment version by 1"
      - from: OVERDUE
        to: EXPIRED
        trigger: "POST /cds/_ops/run-expiration-sweep when clock_now >= expiration_at"
        actor: system
        preconditions: ["state == OVERDUE", "clock_now >= expiration_at"]
        side_effects:
          - "CASCADE LINK 1 of the sweep chain: state -> EXPIRED"
          - "CASCADE LINK 2: because this task expired, the governed OrderSet transitions to publication_state EXPIRED (or, for artifact_kind ALERT, the governed Alert transitions ACTIVE -> SUSPENDED directly)"
          - "increment version by 1"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /cds/_ops/run-expiration-sweep when clock_now >= expiration_at and the sweep skipped the OVERDUE step"
        actor: system
        preconditions: ["state == PENDING", "clock_now >= expiration_at"]
        side_effects: ["same cascade as OVERDUE -> EXPIRED", "increment version by 1"]

  - entity: DowntimeEvent
    state_field: state
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /cds/downtime-events/{id}/activate"
        actor: SystemAdmin
        preconditions:
          - "state == SCHEDULED"
          - "clock_now >= window_start"
          - "clock_now <= window_end"
        side_effects:
          - "set activated_at = clock_now"
          - "from this point every in-scope content mutation is rejected with ERR_CDS_CONTENT_FROZEN (mode READ_ONLY) and in-scope reads are additionally rejected with ERR_CDS_UNAVAILABLE (mode FULL_UNAVAILABLE)"
          - "increment version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /cds/downtime-events/{id}/close, or POST /cds/_ops/run-expiration-sweep when clock_now > window_end"
        actor: SystemAdmin | system
        preconditions: ["state == ACTIVE"]
        side_effects: ["set closed_at = clock_now", "in-scope mutations resume", "increment version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cds/downtime-events/{id}/close"
        actor: SystemAdmin
        preconditions: ["state == SCHEDULED"]
        side_effects: ["set closed_at = clock_now", "increment version by 1"]

  - entity: AdherenceMeasurement
    state_field: measurement_state
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, INSUFFICIENT_DATA]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /cds/adherence-measurements/{id}/finalize"
        actor: CommitteeChair
        preconditions:
          - "measurement_state == PROVISIONAL"
          - "the submitted verdict is supported per validations[priority=21]"
        side_effects:
          - "compute adherence_pct_intention_to_treat and unintended_event_rate_per_100 per the intention_to_treat variant of calculations.order_set_adherence"
          - "set verdict and finalized_at"
          - "set OrderSet.latest_adherence_pct = adherence_pct_intention_to_treat"
          - "if verdict == RETIRE: the governed OrderSet transitions PUBLISHED -> EXPIRING and its AnnualReviewTask in state PENDING transitions to OVERDUE"
          - "increment version by 1"
        note: "the creation-time state INSUFFICIENT_DATA is reached directly at POST time when included_unit_count == 0 and is terminal"

concurrency_rules:
  - rule_id: order-set-create-stale-content-request
    parent_entity: ContentRequest
    write_endpoint: "POST /cds/content-requests/{id}/order-sets"
    occ_field: "expected_content_request_version"
    description: |
      Creating an OrderSet build against a ContentRequest whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another builder has already created a build on the same request
      (a build that may legitimately supersede the prior one via
      supersedes_order_set_id), so the current builder's view of the request —
      including its status and calibrated priority_score — is stale.
    error_id: ERR_STALE_CONTENT_REQUEST_VERSION
    http_status: 412

  - rule_id: burden-window-create-stale-alert
    parent_entity: Alert
    write_endpoint: "POST /cds/alerts/{id}/burden-windows"
    occ_field: "expected_alert_version"
    description: |
      Opening a new AlertBurdenWindow against an Alert whose version has advanced
      since the client last observed it is rejected. Opening a window legitimately
      supersedes the currently OPEN window (closing it with closure_reason
      SUPERSEDED_BY_NEW_WINDOW and computing its burden index), so a stale view of
      the alert's version means the client is reasoning about a firing ledger and
      window chain that have already moved.
    error_id: ERR_STALE_ALERT_VERSION
    http_status: 412

calculations:
  - name: content_request_priority_score
    algorithm_type: weighted_scoring
    trigger: "POST /cds/content-requests (intake_provisional), POST /cds/content-requests/{id}/resubmit (intake_provisional), POST /cds/content-requests/{id}/triage with decision ACCEPT (committee_calibrated)"
    output_field: "ContentRequest.priority_score"
    constants:
      EVIDENCE_GRADE_POINTS: { A: 40, B: 30, C: 18, EXPERT_OPINION: 8 }
      URGENCY_POINTS: { ROUTINE: 0, EXPEDITED: 12, SAFETY_URGENT: 25 }
      SAFETY_FLAG_POINTS: 15
      CITATION_POINTS_PER_PEER_REVIEWED: 6
      CITATION_COMPONENT_CAP: 40
      BACKLOG_AGE_BONUS_PER_DAY: "0.02"
      BACKLOG_AGE_BONUS_CAP: "0.30"
      SCORE_CAP: "100.00"
    variants:
      - variant_name: intake_provisional
        applies_when: "the request is first submitted or resubmitted by its clinical sponsor; priority_score_basis is set to INTAKE_PROVISIONAL"
        formula: |
          grade_component = EVIDENCE_GRADE_POINTS[evidence_grade]
          urgency_component = URGENCY_POINTS[urgency]
          safety_component = SAFETY_FLAG_POINTS if patient_safety_flag else 0
          raw = grade_component + urgency_component + safety_component
          priority_score = min(SCORE_CAP, round(raw, 2))   # ROUND_HALF_UP, 2dp
        note: |
          The provisional variant trusts the sponsor's self-declared evidence_grade
          and completely IGNORES peer_reviewed_citation_count and backlog age. No
          multiplier is applied.
      - variant_name: committee_calibrated
        applies_when: "the committee chair accepts the request at triage; priority_score_basis is set to COMMITTEE_CALIBRATED"
        formula: |
          citation_component = min(CITATION_COMPONENT_CAP,
                                   CITATION_POINTS_PER_PEER_REVIEWED * peer_reviewed_citation_count)
          urgency_component = URGENCY_POINTS[urgency]
          safety_component = SAFETY_FLAG_POINTS if patient_safety_flag else 0
          base = citation_component + urgency_component + safety_component
          backlog_age_days = floor((clock_now - created_at) / 86400 seconds)
          age_bonus = min(BACKLOG_AGE_BONUS_CAP,
                          round(BACKLOG_AGE_BONUS_PER_DAY * backlog_age_days, 4))
          priority_score = min(SCORE_CAP, round(base * (1 + age_bonus), 2))   # ROUND_HALF_UP, 2dp
        note: |
          The calibrated variant REPLACES the self-declared grade component with a
          verified citation component (peer-reviewed citations only, capped at 40)
          and then applies a backlog-age multiplier. Because the two variants use a
          different first term AND only one of them multiplies, the same request
          yields two different scores.
    precision: "ROUND_HALF_UP, 2 decimal places for priority_score; the age bonus is intermediately rounded to 4 decimal places before the multiplication"
    worked_example: |
      Request R: evidence_grade B, urgency EXPEDITED, patient_safety_flag true,
      evidence_citations = 5 entries of which 3 have peer_reviewed true,
      created_at 2026-08-01T00:00:00Z, triaged at 2026-08-16T00:00:00Z.

      intake_provisional:
        30 (grade B) + 12 (EXPEDITED) + 15 (safety) = 57
        priority_score = 57.00
      committee_calibrated:
        citation_component = min(40, 6 * 3) = 18
        base = 18 + 12 + 15 = 45
        backlog_age_days = 15
        age_bonus = min(0.30, round(0.02 * 15, 4)) = 0.3000
        priority_score = min(100.00, round(45 * 1.3000, 2)) = 58.50
      The variants differ by 1.50 on identical stored data.

  - name: alert_burden_index
    algorithm_type: weighted_scoring
    trigger: "AlertBurdenWindow OPEN -> CLOSED (explicit close, supersede by a new window, alert suspension or alert retirement)"
    output_field: "AlertBurdenWindow.burden_index and AlertBurdenWindow.burden_index_clinician_weighted"
    input_set: |
      All OverrideEvent rows with alert_id == window.alert_id and
      window.window_start <= fired_at < window.window_end (half-open interval:
      the lower bound is inclusive, the upper bound is exclusive). Events outside
      the interval are excluded even when they belong to the same alert, and an
      event whose fired_at equals window_end belongs to the NEXT window.
    constants:
      TIER_MULTIPLIER: { TIER_1_HARD_STOP: "1.6", TIER_2_INTERRUPTIVE: "1.0", TIER_3_PASSIVE: "0.4" }
      EXPECTED_FIRES_PER_WINDOW: 50
      EXPECTED_CLINICIANS_PER_WINDOW: 20
      VOLUME_FACTOR_CAP: "2.0"
      BURDEN_INDEX_CAP: "100.00"
      LOW_VALUE_INDEX_THRESHOLD: "65.00"
      HIGH_VALUE_INDEX_CEILING: "25.00"
    variants:
      - variant_name: fire_weighted
        applies_when: "always; stored in AlertBurdenWindow.burden_index and mirrored to Alert.latest_burden_index, and it is the value the retirement gate reads"
        formula: |
          fire_count = count(input_set)
          override_count = count(e in input_set where e.accepted == false)
          override_rate = round(override_count / fire_count, 4)          # 0.0000 when fire_count == 0
          volume_factor = min(VOLUME_FACTOR_CAP, round(fire_count / EXPECTED_FIRES_PER_WINDOW, 4))
          tier_multiplier = TIER_MULTIPLIER[window.severity_tier_snapshot]
          burden_index = min(BURDEN_INDEX_CAP,
                             round(override_rate * tier_multiplier * volume_factor * 100, 2))
      - variant_name: clinician_weighted
        applies_when: "always; stored in AlertBurdenWindow.burden_index_clinician_weighted and reported alongside the fire-weighted index, but NEVER used by the retirement gate"
        formula: |
          distinct_overriding = count(distinct e.firing_clinician_ref where e.accepted == false)
          distinct_fired = count(distinct e.firing_clinician_ref)
          override_rate_clin = round(distinct_overriding / distinct_fired, 4)   # 0.0000 when distinct_fired == 0
          volume_factor_clin = min(VOLUME_FACTOR_CAP,
                                   round(distinct_fired / EXPECTED_CLINICIANS_PER_WINDOW, 4))
          burden_index_clinician_weighted = min(BURDEN_INDEX_CAP,
                             round(override_rate_clin * tier_multiplier * volume_factor_clin * 100, 2))
        note: |
          The clinician-weighted variant counts DISTINCT clinicians rather than
          firings and normalises against EXPECTED_CLINICIANS_PER_WINDOW (20) rather
          than EXPECTED_FIRES_PER_WINDOW (50). A high-volume alert that annoys a
          small number of clinicians scores far lower on this variant, which is
          exactly why the retirement gate is pinned to the fire-weighted variant.
    classification: |
      burden_classification is derived from the fire-weighted burden_index only:
        fire_count == 0                          -> NO_SIGNAL
        burden_index >= LOW_VALUE_INDEX_THRESHOLD -> LOW_VALUE
        burden_index <= HIGH_VALUE_INDEX_CEILING  -> HIGH_VALUE
        otherwise                                 -> MONITOR
      The NO_SIGNAL check runs first, so a zero-firing window is NO_SIGNAL and not
      HIGH_VALUE even though its index of 0.00 is <= 25.00.
    precision: "override_rate and volume_factor are rounded to 4 decimal places BEFORE being multiplied; the index is then rounded to 2 decimal places, all ROUND_HALF_UP"
    worked_example: |
      Alert A, severity_tier TIER_2_INTERRUPTIVE (multiplier 1.0), window with
      60 firings of which 45 are overrides, spread over 12 distinct clinicians
      of whom all 12 produced at least one override:
        override_rate  = round(45/60, 4) = 0.7500
        volume_factor  = min(2.0, round(60/50, 4)) = 1.2000
        burden_index   = min(100.00, round(0.7500 * 1.0 * 1.2000 * 100, 2)) = 90.00  -> LOW_VALUE
        override_rate_clin = round(12/12, 4) = 1.0000
        volume_factor_clin = min(2.0, round(12/20, 4)) = 0.6000
        burden_index_clinician_weighted = round(1.0000 * 1.0 * 0.6000 * 100, 2) = 60.00
      Same window, two indices: 90.00 vs 60.00 — only the first crosses 65.00.

  - name: order_set_adherence
    algorithm_type: aggregation
    trigger: "POST /cds/order-sets/{id}/adherence-measurements (per_protocol), POST /cds/adherence-measurements/{id}/finalize (intention_to_treat)"
    output_field: "AdherenceMeasurement.adherence_pct_per_protocol, AdherenceMeasurement.adherence_pct_intention_to_treat, AdherenceMeasurement.unintended_event_rate_per_100"
    input_set: |
      The unit_observations array submitted at creation. Each observation is
      { unit_code, eligible_orders, adherent_orders, unintended_events }.
      A unit with eligible_orders == 0 is EXCLUDED from the per-protocol
      denominator and counted in excluded_unit_count; it is still retained in
      unit_observations for audit.
    constants:
      MIN_INCLUDED_UNITS: 1
      UNINTENDED_RATE_BASIS: 100
      ADHERENCE_SUCCESS_FLOOR: "70.00"
      UNINTENDED_RATE_CEILING: "5.00"
    variants:
      - variant_name: per_protocol
        applies_when: "at measurement creation; stored in adherence_pct_per_protocol"
        formula: |
          included = [u for u in unit_observations if u.eligible_orders > 0]
          per_unit_rates = [round(u.adherent_orders / u.eligible_orders, 4) for u in included]
          mean_rate = sum(per_unit_rates) / len(included)
          adherence_pct_per_protocol = round(UNINTENDED_RATE_BASIS * mean_rate, 2)
        note: "unweighted mean of per-unit rates; every included unit counts equally regardless of volume"
      - variant_name: intention_to_treat
        applies_when: "at finalize; stored in adherence_pct_intention_to_treat and mirrored to OrderSet.latest_adherence_pct"
        formula: |
          adherence_pct_intention_to_treat = round(
              100 * sum(u.adherent_orders for u in included) / sum(u.eligible_orders for u in included), 2)
        note: |
          Volume-pooled ratio. Because the per-protocol variant averages rounded
          per-unit rates while the ITT variant pools raw numerators and
          denominators, a measurement whose units have very different volumes
          produces two materially different percentages from the same array.
    additional_outputs: |
      unintended_event_rate_per_100 = round(
          100 * sum(u.unintended_events for u in included) / sum(u.eligible_orders for u in included), 2)
      is always pooled (never averaged) and is computed at finalize.
    precision: "per-unit rates are rounded to 4 decimal places before averaging; all percentages are ROUND_HALF_UP to 2 decimal places"
    worked_example: |
      unit_observations = [
        { unit_code: "ICU",  eligible_orders: 30,  adherent_orders: 20, unintended_events: 3 },
        { unit_code: "WARD", eligible_orders: 970, adherent_orders: 490, unintended_events: 27 },
        { unit_code: "CLIN", eligible_orders: 0,   adherent_orders: 0,  unintended_events: 0 }
      ]
      included_unit_count = 2, excluded_unit_count = 1
      per_protocol:
        rates = [round(20/30,4), round(490/970,4)] = [0.6667, 0.5052]
        mean  = 1.1719 / 2 = 0.58595
        adherence_pct_per_protocol = round(100 * 0.58595, 2) = 58.60
      intention_to_treat:
        adherence_pct_intention_to_treat = round(100 * 510 / 1000, 2) = 51.00
      unintended:
        unintended_event_rate_per_100 = round(100 * 30 / 1000, 2) = 3.00
      The two adherence variants differ by 7.60 percentage points because the
      small ICU cohort is weighted equally under per-protocol.

  - name: artifact_quorum_evaluation
    algorithm_type: constraint_propagation
    trigger: "POST /cds/order-sets/{id}/submit-for-peer-review, POST /cds/review-assignments, POST /cds/review-assignments/{id}/cast"
    output_field: "OrderSet.peer_required_votes, OrderSet.specialty_required_votes, OrderSet.review_state, Alert.required_approval_votes, Alert.review_state"
    constants:
      BASE_REQUIRED_VOTES: { HIGH: 3, STANDARD: 2 }
      REQUIRED_APPROVAL_RATIO: { HIGH: "0.8000", STANDARD: "0.6667" }
      EVIDENCE_CONCERN_VOTE_BUMP: 1
      MAX_REQUIRED_VOTES: 4
      ALERT_REQUIRED_VOTES: { TIER_1_HARD_STOP: 3, TIER_2_INTERRUPTIVE: 2, TIER_3_PASSIVE: 1 }
      ALERT_REQUIRED_APPROVAL_RATIO: "1.0000"
    evaluation_order: |
      The steps below are evaluated in EXACTLY this order on every cast; the
      order is load-bearing because step 3 feeds step 4 and step 4 feeds step 5.
        step 1  risk_class = HIGH if (order_set.high_alert_item_count >= 1
                  OR parent ContentRequest.patient_safety_flag == true)
                  else STANDARD
        step 2  base = BASE_REQUIRED_VOTES[risk_class]
        step 3  evidence_concern_count = number of ReviewAssignment rows on this
                  artifact and this stage with state == CAST and evidence_concern
                  == true, INCLUDING the vote being cast in this very request
        step 4  required_votes = min(MAX_REQUIRED_VOTES,
                  base + (EVIDENCE_CONCERN_VOTE_BUMP if evidence_concern_count >= 1 else 0))
        step 5  cast_count      = CAST assignments on this artifact and stage
                  approve_count = those with vote == APPROVE
                  reject_count  = those with vote == REJECT
                  approve_ratio = round(approve_count / cast_count, 4)
        step 6  quorum_met = (cast_count >= required_votes)
                  AND (approve_ratio >= REQUIRED_APPROVAL_RATIO[risk_class])
                  AND (reject_count == 0)
        step 7  if quorum_met the artifact advances its review_state
    formula: |
      For alerts the same skeleton runs with a single stage:
        required_votes = ALERT_REQUIRED_VOTES[severity_tier]   (no risk_class, no concern bump)
        approve_ratio must be exactly ALERT_REQUIRED_APPROVAL_RATIO (1.0000)
      so any non-APPROVE vote on an alert both blocks quorum and returns the
      alert to DRAFT.
    precision: "approve_ratio is ROUND_HALF_UP to 4 decimal places; the STANDARD threshold 0.6667 is compared against the rounded ratio, so 2 approvals out of 3 (0.6667) passes while 1 of 2 (0.5000) does not"
    worked_example: |
      OrderSet S, high_alert_item_count 0, parent patient_safety_flag false
      -> risk_class STANDARD, base 2, required ratio 0.6667.
      Cast 1 APPROVE with evidence_concern false:
        evidence_concern_count 0 -> required_votes 2; cast_count 1 -> no quorum.
      Cast 2 APPROVE with evidence_concern TRUE:
        evidence_concern_count 1 -> required_votes min(4, 2+1) = 3;
        cast_count 2 < 3 -> still no quorum even though 2 of 2 approved.
      Cast 3 APPROVE with evidence_concern false:
        evidence_concern_count still 1 -> required_votes 3;
        cast_count 3, approve_ratio round(3/3,4) = 1.0000 >= 0.6667, reject_count 0
        -> quorum met, review_state PEER_REVIEW -> SPECIALTY_APPROVAL.

  - name: reviewer_workload_minutes
    algorithm_type: aggregation
    trigger: "POST /cds/review-assignments (debit), POST /cds/review-assignments/{id}/withdraw (credit), system void of an assignment (credit)"
    output_field: "Clinician.review_workload_assigned_minutes, Clinician.review_workload_remaining_minutes, Clinician.open_assignment_count, ReviewAssignment.estimated_minutes"
    constants:
      REVIEW_MINUTES:
        PEER_REVIEW: { STANDARD: 20, HIGH: 35 }
        SPECIALTY_APPROVAL: { STANDARD: 15, HIGH: 25 }
      ALERT_REVIEW_MINUTES: { TIER_1_HARD_STOP: 30, TIER_2_INTERRUPTIVE: 18, TIER_3_PASSIVE: 10 }
    formula: |
      On assignment creation:
        risk_class_snapshot = order_set.risk_class for an order-set assignment,
                              or HIGH when alert.severity_tier == TIER_1_HARD_STOP
                              else STANDARD for an alert assignment
        estimated_minutes = REVIEW_MINUTES[review_kind][risk_class_snapshot] for an
                            order-set assignment, or
                            ALERT_REVIEW_MINUTES[alert.severity_tier] for an alert assignment
        reviewer.review_workload_assigned_minutes += estimated_minutes
        reviewer.open_assignment_count += 1
        reviewer.review_workload_remaining_minutes =
            reviewer.review_workload_capacity_minutes - reviewer.review_workload_assigned_minutes
      On withdraw or void:
        reviewer.review_workload_assigned_minutes -= assignment.estimated_minutes
        reviewer.open_assignment_count -= 1
        reviewer.review_workload_remaining_minutes recomputed by the same identity
      Casting a vote does NOT change the ledger: the minutes were consumed by
      performing the review.
    invariant: |
      COMPENSATING INVARIANT, checked after every write that touches assignments:
        review_workload_capacity_minutes
          == review_workload_assigned_minutes + review_workload_remaining_minutes
      and review_workload_assigned_minutes == sum(estimated_minutes) over that
      clinician's ReviewAssignment rows in state ASSIGNED or CAST. A withdraw
      followed by an identical re-assignment must restore both sides exactly, with
      no drift, and open_assignment_count must return to its prior value.
    precision: "integer minutes only; no rounding"
    worked_example: |
      Clinician C capacity 480, no assignments: assigned 0, remaining 480, open 0.
      Assign PEER_REVIEW on a HIGH order set: estimated_minutes 35 ->
        assigned 35, remaining 445, open 1.
      Assign SPECIALTY_APPROVAL on a STANDARD order set: 15 ->
        assigned 50, remaining 430, open 2.
      Withdraw the first assignment: assigned 15, remaining 465, open 1.
      Re-assign the identical PEER_REVIEW: assigned 50, remaining 430, open 2 —
      identical to the pre-withdraw ledger.

  - name: content_review_schedule
    algorithm_type: threshold
    trigger: "POST /cds/order-sets/{id}/publish, POST /cds/alerts/{id}/activate, POST /cds/annual-review-tasks/{id}/attest, POST /cds/_ops/run-expiration-sweep, vendor release activation on the CLINICAL_REVIEW branch"
    output_field: "OrderSet.review_due_date, OrderSet.expiration_at, OrderSet.archive_eligible_at, Alert.review_due_date, Alert.expiration_at, AnnualReviewTask.review_due_date, AnnualReviewTask.expiration_at, AnnualReviewTask.archive_eligible_at"
    constants:
      REVIEW_INTERVAL_DAYS: { STANDARD: 365, HIGH: 180 }
      GRACE_PERIOD_DAYS: 30
      ARCHIVE_AFTER_EXPIRY_DAYS: 90
      STALE_CONTENT_REVIEW_DAYS: 30
    formula: |
      anchor = go_live_at at publish/activate, clock_now at attest,
               clock_now at stale-content pull-in
      review_due_date    = anchor + REVIEW_INTERVAL_DAYS[risk_class] days
      expiration_at      = review_due_date + GRACE_PERIOD_DAYS days
      archive_eligible_at = expiration_at + ARCHIVE_AFTER_EXPIRY_DAYS days
      For a stale-content pull-in the interval is replaced:
      review_due_date = clock_now + STALE_CONTENT_REVIEW_DAYS days, and the other
      two dates are recomputed from that new review_due_date.
      Alerts use risk_class HIGH when severity_tier == TIER_1_HARD_STOP else STANDARD
      and have no archive_eligible_at.
    threshold_comparisons: |
      The expiration sweep uses INCLUSIVE comparisons throughout:
        clock_now >= review_due_date    -> PENDING task becomes OVERDUE
        clock_now >= expiration_at      -> task becomes EXPIRED
        clock_now >= archive_eligible_at -> expired order set becomes ARCHIVED
      A sweep run at exactly review_due_date DOES flip the task; a sweep run one
      second earlier does not. All arithmetic is on whole UTC days.
    precision: "whole days added to the anchor instant; the time-of-day component of the anchor is preserved exactly"
    worked_example: |
      OrderSet S, risk_class STANDARD, published with go_live_at 2026-08-15T00:00:00Z:
        review_due_date     = 2027-08-15T00:00:00Z
        expiration_at       = 2027-09-14T00:00:00Z
        archive_eligible_at = 2027-12-13T00:00:00Z
      The same publish with risk_class HIGH:
        review_due_date     = 2027-02-11T00:00:00Z
        expiration_at       = 2027-03-13T00:00:00Z
        archive_eligible_at = 2027-06-11T00:00:00Z

  - name: vendor_release_impact_score
    algorithm_type: weighted_scoring
    trigger: "POST /cds/vendor-releases/{id}/run-impact-analysis"
    output_field: "VendorContentRelease.impact_score, VendorContentRelease.review_cycle_state"
    input_set: "all VendorRuleDelta rows with vendor_release_id == release.id"
    constants:
      DELTA_WEIGHTS: { SEVERITY_INCREASED: 5, NEW_INTERACTION: 3, RETIRED_INTERACTION: 2, SEVERITY_DECREASED: 1, DOSING_BOUND_CHANGED: 3 }
      HIGH_SEVERITY_BONUS: 4
      CLINICAL_REVIEW_THRESHOLD: 25
    formula: |
      impact_score = sum over deltas of (
          DELTA_WEIGHTS[delta.change_type]
          + (HIGH_SEVERITY_BONUS if delta.new_severity == CONTRAINDICATED else 0)
      )
      routing:
        impact_score >= CLINICAL_REVIEW_THRESHOLD -> IMPACT_ANALYZED_CLINICAL_REVIEW
        impact_score <  CLINICAL_REVIEW_THRESHOLD -> IMPACT_ANALYZED_FAST_TRACK
      The two branches diverge permanently: the FAST_TRACK branch may be activated
      by a PharmacyInformaticist and restages nothing, while the CLINICAL_REVIEW
      branch requires the CommitteeChair and drives the three-level stale-content
      cascade.
    precision: "integer score; no rounding"
    worked_example: |
      Release V with deltas:
        d1 SEVERITY_INCREASED, new_severity CONTRAINDICATED -> 5 + 4 = 9
        d2 NEW_INTERACTION,    new_severity MAJOR           -> 3
        d3 DOSING_BOUND_CHANGED, new_severity MODERATE      -> 3
        d4 SEVERITY_INCREASED, new_severity CONTRAINDICATED -> 9
        d5 RETIRED_INTERACTION, new_severity null           -> 2
      impact_score = 9 + 3 + 3 + 9 + 2 = 26 >= 25 -> IMPACT_ANALYZED_CLINICAL_REVIEW.
      Drop d5 and the score is 24 -> IMPACT_ANALYZED_FAST_TRACK, a different
      approver role and a different side-effect set.

  - name: low_value_retirement_eligibility
    algorithm_type: threshold
    trigger: "POST /cds/alerts/{id}/retire"
    output_field: "Alert.lifecycle_state (RETIRED), Alert.retired_at"
    input_set: |
      The two most recent AlertBurdenWindow rows of this alert in state CLOSED or
      FINALIZED, ordered by window_start DESC with created_at DESC as the
      tie-break. Windows in state OPEN are never considered. If fewer than
      RETIREMENT_WINDOW_COUNT such windows exist the gate fails.
    constants:
      RETIREMENT_WINDOW_COUNT: 2
      MIN_OVERRIDE_RATE: "0.9000"
      MIN_FIRE_COUNT: 40
      MIN_BURDEN_INDEX: "65.00"
    formula: |
      eligible = (len(candidate_windows) == RETIREMENT_WINDOW_COUNT)
        AND for EVERY w in candidate_windows:
              w.override_rate >= MIN_OVERRIDE_RATE
          AND w.fire_count    >= MIN_FIRE_COUNT
          AND w.burden_index  >= MIN_BURDEN_INDEX
      All three per-window criteria are conjunctive and all comparisons are
      inclusive. burden_index here is the FIRE-WEIGHTED variant; the
      clinician-weighted index is never consulted. If eligible is false the retire
      request is rejected with ERR_RETIREMENT_CRITERIA_NOT_MET and the alert stays
      in its current lifecycle_state.
    precision: "override_rate compared at 4 decimal places, burden_index at 2 decimal places, both ROUND_HALF_UP as stored"
    worked_example: |
      Alert A, TIER_2_INTERRUPTIVE, two CLOSED windows:
        W2 (most recent): 40 firings, 36 overrides
            override_rate = round(36/40, 4) = 0.9000 (== 0.9000, passes)
            volume_factor = min(2.0, round(40/50, 4)) = 0.8000
            burden_index  = round(0.9000 * 1.0 * 0.8000 * 100, 2) = 72.00 (>= 65.00, passes)
            fire_count 40 (== 40, passes)
        W1: 60 firings, 45 overrides -> rate 0.7500 -> FAILS MIN_OVERRIDE_RATE
      Retirement is rejected because W1 fails, even though W1's burden_index of
      90.00 is the highest the alert has ever recorded.

validations:
  - priority: 1
    rule: "Every business endpoint requires a non-empty X-User-ID header naming an existing Clinician, or the literal SYSTEM_ADMIN principal for SystemAdmin-only endpoints"
    category: authentication
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints under /cds"
    note: "checked before anything else, including path existence, so an unauthenticated call against a non-existent id returns 401 and not 404"

  - priority: 2
    rule: "The caller's Clinician.authorized_roles must contain a role permitted for the endpoint per the RBAC table"
    category: authorization
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints under /cds"
    note: "checked before path existence, so a wrong-role call against a non-existent id returns 403 and not 404"

  - priority: 3
    rule: "Where an endpoint binds the actor to a stored identity, X-User-ID must equal that stored id: resubmit requires ContentRequest.clinical_sponsor_id, cast/withdraw-by-self requires ReviewAssignment.reviewer_id, attest requires the governed artifact's ContentRequest.clinical_sponsor_id"
    category: authorization
    error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /cds/content-requests/{id}/resubmit, POST /cds/review-assignments/{id}/cast, POST /cds/annual-review-tasks/{id}/attest"

  - priority: 4
    rule: "Every id in the path must resolve to an existing row, evaluated left to right"
    category: existence
    error_id: ERR_CONTENT_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
    per_endpoint_errors:
      "/cds/content-requests/{id}/*": ERR_CONTENT_REQUEST_NOT_FOUND
      "/cds/order-sets/{id}/*": ERR_ORDER_SET_NOT_FOUND
      "/cds/alerts/{id}/*": ERR_ALERT_NOT_FOUND
      "/cds/alerts/{id}/burden-windows/{window_id}/*": ERR_BURDEN_WINDOW_NOT_FOUND
      "/cds/review-assignments/{id}/*": ERR_REVIEW_ASSIGNMENT_NOT_FOUND
      "/cds/vendor-releases/{id}/*": ERR_VENDOR_RELEASE_NOT_FOUND
      "/cds/vendor-rule-deltas/{id}/*": ERR_VENDOR_RULE_DELTA_NOT_FOUND
      "/cds/downtime-events/{id}/*": ERR_DOWNTIME_EVENT_NOT_FOUND
      "/cds/adherence-measurements/{id}/*": ERR_ADHERENCE_MEASUREMENT_NOT_FOUND
      "/cds/annual-review-tasks/{id}/*": ERR_ANNUAL_REVIEW_TASK_NOT_FOUND
      "/cds/clinicians/{id}": ERR_CLINICIAN_NOT_FOUND
    note: "a burden-window id that exists but belongs to a different alert than the path alert id is treated as not found for that alert"

  - priority: 5
    rule: "Every foreign key supplied in the request body must resolve to an existing row, evaluated in the field order declared by the endpoint's input"
    category: existence
    error_id: ERR_CLINICIAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /cds/content-requests, POST /cds/content-requests/{id}/order-sets, POST /cds/content-requests/{id}/alerts, POST /cds/review-assignments, POST /cds/vendor-releases"
    per_endpoint_errors:
      "clinical_sponsor_id / built_by_clinician_id / reviewer_id / designed_by_clinician_id / pharmacy_signoff_by_clinician_id": ERR_CLINICIAN_NOT_FOUND
      "supersedes_order_set_id / linked_order_set_id": ERR_ORDER_SET_NOT_FOUND
      "pinned_vendor_release_id / supersedes_release_id": ERR_VENDOR_RELEASE_NOT_FOUND
      "order_set_id / alert_id on POST /cds/review-assignments": "ERR_ORDER_SET_NOT_FOUND / ERR_ALERT_NOT_FOUND"

  - priority: 6
    rule: "Required body fields must be present and every field must satisfy its declared type and enum domain; unknown enum members, wrong JSON types, empty required arrays and negative counts are rejected"
    category: schema
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 7
    rule: "Interval bounds must satisfy start < end (window_start < window_end for burden windows and downtime events, measurement_period_start < measurement_period_end for adherence measurements); a zero-length or inverted interval is rejected"
    category: schema
    error_id: ERR_INVALID_WINDOW_BOUNDS
    http_status: 422
    applies_to: "POST /cds/alerts/{id}/burden-windows, POST /cds/downtime-events, POST /cds/order-sets/{id}/adherence-measurements"

  - priority: 8
    rule: "Every unit observation must satisfy eligible_orders >= 0, 0 <= adherent_orders <= eligible_orders and unintended_events >= 0"
    category: schema
    error_id: ERR_INVALID_OBSERVATION_COUNTS
    http_status: 422
    applies_to: "POST /cds/order-sets/{id}/adherence-measurements"

  - priority: 9
    rule: "On endpoints declared in §1.2.1, expected_<parent>_version must equal the parent's current version"
    category: concurrency
    error_id: ERR_STALE_CONTENT_REQUEST_VERSION
    http_status: 412
    applies_to: "POST /cds/content-requests/{id}/order-sets, POST /cds/alerts/{id}/burden-windows"
    per_endpoint_errors:
      "POST /cds/content-requests/{id}/order-sets": ERR_STALE_CONTENT_REQUEST_VERSION
      "POST /cds/alerts/{id}/burden-windows": ERR_STALE_ALERT_VERSION
    note: "OCC is checked after schema and existence but before every state precondition, so a stale version against an artifact that is also in the wrong state returns 412"

  - priority: 10
    rule: "The primary entity named by the path must be in a state from which the requested transition exists"
    category: state
    error_id: ERR_ORDER_SET_NOT_DRAFT
    http_status: 409
    applies_to: "every action endpoint; the endpoint-specific error id is listed below and ERR_ORDER_SET_NOT_DRAFT is the representative member of the family"
    per_endpoint_errors:
      "POST /cds/content-requests/{id}/triage": ERR_CONTENT_REQUEST_NOT_TRIAGEABLE
      "POST /cds/content-requests/{id}/resubmit": ERR_CONTENT_REQUEST_NOT_RETURNED
      "POST /cds/content-requests/{id}/order-sets, /alerts": ERR_CONTENT_REQUEST_NOT_ACCEPTED
      "POST /cds/order-sets/{id}/items": ERR_ORDER_SET_NOT_DRAFT
      "POST /cds/order-sets/{id}/submit-for-peer-review": ERR_ORDER_SET_NOT_DRAFT
      "POST /cds/order-sets/{id}/publish": ERR_ORDER_SET_NOT_APPROVED
      "POST /cds/alerts/{id}/activate": ERR_ALERT_NOT_APPROVED
      "POST /cds/alerts/{id}/suspend, /retire": ERR_ALERT_NOT_ACTIVE
      "POST /cds/alerts/{id}/resume": ERR_ALERT_NOT_SUSPENDED
      "POST /cds/alerts/{id}/burden-windows/{window_id}/close": ERR_BURDEN_WINDOW_NOT_OPEN
      "POST /cds/alerts/{id}/burden-windows/{window_id}/reopen": ERR_BURDEN_WINDOW_NOT_CLOSED
      "POST /cds/vendor-releases/{id}/run-impact-analysis": ERR_VENDOR_RELEASE_NOT_RECEIVED
      "POST /cds/vendor-releases/{id}/activate": ERR_VENDOR_RELEASE_NOT_ANALYZED
      "POST /cds/vendor-rule-deltas/{id}/disposition": ERR_VENDOR_RELEASE_NOT_ANALYZED
      "POST /cds/downtime-events/{id}/activate": ERR_DOWNTIME_EVENT_NOT_SCHEDULED
      "POST /cds/downtime-events/{id}/close": ERR_DOWNTIME_EVENT_NOT_CLOSEABLE
      "POST /cds/adherence-measurements/{id}/finalize": ERR_MEASUREMENT_NOT_PROVISIONAL
      "POST /cds/annual-review-tasks/{id}/attest": ERR_REVIEW_TASK_NOT_OPEN

  - priority: 11
    rule: "Entities referenced but not named in the path must be in a usable state: a reviewer Clinician must have employment_status ACTIVE, a casting ReviewAssignment must be in state ASSIGNED, and opening a burden window or reopening one requires that no other window of the alert is already OPEN in the reopen case"
    category: state
    error_id: ERR_CLINICIAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cds/review-assignments, POST /cds/review-assignments/{id}/cast, POST /cds/alerts/{id}/burden-windows/{window_id}/reopen"
    per_endpoint_errors:
      "reviewer not ACTIVE": ERR_CLINICIAN_NOT_ACTIVE
      "assignment already CAST, WITHDRAWN or VOIDED": ERR_ASSIGNMENT_NOT_ASSIGNED
      "reopen while another window is OPEN": ERR_ANOTHER_WINDOW_OPEN
    note: "cross-entity state dependency: the same cast request succeeds or fails purely on the state of a second entity the caller did not name"

  - priority: 12
    rule: "While a DowntimeEvent is in state ACTIVE and its scope covers the target artifact class, in-scope content mutations are frozen; when the event's mode is FULL_UNAVAILABLE the in-scope read endpoints are refused as well"
    category: business_temporal
    error_id: ERR_CDS_CONTENT_FROZEN
    http_status: 409
    applies_to: "all content mutations on OrderSet, OrderSetItem, Alert, ReviewAssignment, VendorContentRelease and VendorRuleDelta, plus in-scope GETs when mode is FULL_UNAVAILABLE"
    per_endpoint_errors:
      "mode READ_ONLY, mutation attempt": ERR_CDS_CONTENT_FROZEN
      "mode FULL_UNAVAILABLE, read or mutation attempt": ERR_CDS_UNAVAILABLE
    scope_semantics: |
      scope ORDER_SETS covers OrderSet, OrderSetItem and order-set ReviewAssignment
      writes; scope ALERTS covers Alert, AlertBurdenWindow and alert ReviewAssignment
      writes; scope VENDOR_CONTENT covers VendorContentRelease and VendorRuleDelta;
      scope ALL covers everything above. Downtime never blocks POST
      /cds/downtime-events/{id}/close, POST /cds/_ops/run-expiration-sweep,
      POST /_events/alert-firings or POST /_clock/set_current_utc, and never blocks
      writes on ContentRequest, AdherenceMeasurement or AnnualReviewTask.
    note: "the freeze is evaluated AFTER OCC and AFTER the primary state precondition, so a frozen system still returns 412 for a stale version and 409 for a bad state transition before it reports the freeze"
    increments: "each rejected in-scope mutation increments the ACTIVE DowntimeEvent.blocked_mutation_count by 1"

  - priority: 13
    rule: "Segregation of duties: the clinician who built an order set (built_by_clinician_id) may not be assigned to review it, the clinician who designed an alert may not be assigned to review it, the same clinician may not hold both a PEER_REVIEW and a SPECIALTY_APPROVAL assignment on the same order set, and the clinician who cast the deciding specialty vote may not be the one who publishes the artifact"
    category: business_constraint
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cds/review-assignments, POST /cds/order-sets/{id}/publish, POST /cds/alerts/{id}/activate"

  - priority: 14
    rule: "The clinical sponsor of a content request may not review any artifact built from that request, and no clinician may review an artifact whose pharmacy sign-off they provided"
    category: business_constraint
    error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    applies_to: "POST /cds/review-assignments"
    note: "priority 13 and 14 are both segregation constraints but 13 is checked first, so a builder who is also the sponsor receives ERR_SEGREGATION_OF_DUTIES"

  - priority: 15
    rule: "Evidence sufficiency: a request may only be accepted at triage when it carries at least MIN_CITATIONS_FOR_ACCEPT citations of which at least MIN_PEER_REVIEWED_FOR_ACCEPT are peer reviewed, and a request with patient_safety_flag true or urgency SAFETY_URGENT requires at least MIN_PEER_REVIEWED_FOR_SAFETY peer-reviewed citations; attestation likewise requires a non-empty evidence_citations array"
    category: business_safety
    error_id: ERR_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /cds/content-requests/{id}/triage with decision ACCEPT, POST /cds/annual-review-tasks/{id}/attest"
    constants:
      MIN_CITATIONS_FOR_ACCEPT: 2
      MIN_PEER_REVIEWED_FOR_ACCEPT: 1
      MIN_PEER_REVIEWED_FOR_SAFETY: 2

  - priority: 16
    rule: "An alert with severity_tier TIER_1_HARD_STOP must carry a non-empty hard_stop_justification before it can enter review or be activated"
    category: business_safety
    error_id: ERR_TIER1_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /cds/review-assignments with alert_id, POST /cds/alerts/{id}/activate"

  - priority: 17
    rule: "An alert with override_reason_required true must declare at least MIN_OVERRIDE_REASON_CODES override_reason_codes, and every OverrideEvent ingested for such an alert with accepted false must carry an override_reason_code drawn from that alert's declared codes"
    category: business_safety
    error_id: ERR_OVERRIDE_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /cds/alerts/{id}/activate, POST /_events/alert-firings"
    constants:
      MIN_OVERRIDE_REASON_CODES: 2
    note: "TIER_1_HARD_STOP and TIER_2_INTERRUPTIVE alerts are forced to override_reason_required true at creation; TIER_3_PASSIVE alerts may set it false"

  - priority: 18
    rule: "An order set with high_alert_item_count >= 1 may not be published until a PharmacyInformaticist has recorded pharmacy sign-off"
    category: business_safety
    error_id: ERR_HIGH_ALERT_PHARMACY_SIGNOFF_REQUIRED
    http_status: 409
    applies_to: "POST /cds/order-sets/{id}/publish"

  - priority: 19
    rule: "A new AlertBurdenWindow may not overlap any window of the same alert in state CLOSED or FINALIZED; overlap is computed on half-open intervals so a new window whose window_start equals an existing window's window_end is adjacent and allowed"
    category: business_temporal
    error_id: ERR_BURDEN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /cds/alerts/{id}/burden-windows"
    note: "an existing OPEN window is never an overlap conflict: opening a new window legitimately supersedes it and closes it"

  - priority: 20
    rule: "A new DowntimeEvent may not overlap any DowntimeEvent in state SCHEDULED or ACTIVE whose scope intersects the new scope; scope SYSTEM_WIDE intersects every other scope; overlap is computed on closed intervals so touching endpoints DO conflict"
    category: business_temporal
    error_id: ERR_DOWNTIME_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /cds/downtime-events"
    note: "deliberately the opposite endpoint convention from priority 19: downtime intervals are inclusive of window_end, burden windows are not"

  - priority: 21
    rule: "The verdict submitted at finalize must be supported by the computed measurements: SUSTAIN requires adherence_pct_intention_to_treat >= ADHERENCE_SUCCESS_FLOOR and unintended_event_rate_per_100 <= UNINTENDED_RATE_CEILING; RETIRE requires adherence_pct_intention_to_treat < ADHERENCE_SUCCESS_FLOOR or unintended_event_rate_per_100 > UNINTENDED_RATE_CEILING; REVISE is always permitted"
    category: business_constraint
    error_id: ERR_ADHERENCE_VERDICT_UNSUPPORTED
    http_status: 422
    applies_to: "POST /cds/adherence-measurements/{id}/finalize"
    note: "the check runs against the intention_to_treat variant computed in this same request, never against the per-protocol value stored at creation"

  - priority: 22
    rule: "An order set may only be published while its pinned_vendor_release_id names a VendorContentRelease in state ACTIVATED"
    category: business_referential
    error_id: ERR_VENDOR_RELEASE_NOT_ACTIVATED
    http_status: 409
    applies_to: "POST /cds/order-sets/{id}/publish"

  - priority: 23
    rule: "An alert with a non-null linked_order_set_id may only be activated or resumed while that order set has publication_state PUBLISHED"
    category: business_referential
    error_id: ERR_LINKED_ORDER_SET_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /cds/alerts/{id}/activate, POST /cds/alerts/{id}/resume"

  - priority: 24
    rule: "A clinician may hold at most one ReviewAssignment in state ASSIGNED or CAST per (artifact, review_kind) pair; VOIDED and WITHDRAWN assignments do not block a fresh assignment"
    category: business_constraint
    error_id: ERR_DUPLICATE_REVIEW_ASSIGNMENT
    http_status: 409
    applies_to: "POST /cds/review-assignments"

  - priority: 25
    rule: "A vendor release may only be activated once every one of its deltas carries a disposition, i.e. dispositioned_delta_count == delta_count"
    category: business_constraint
    error_id: ERR_DELTA_DISPOSITION_INCOMPLETE
    http_status: 409
    applies_to: "POST /cds/vendor-releases/{id}/activate"

  - priority: 26
    rule: "On the CLINICAL_REVIEW branch every delta dispositioned SUPPRESS must carry a non-empty suppression_justification before the release may be activated; the FAST_TRACK branch does not impose this requirement"
    category: business_constraint
    error_id: ERR_SUPPRESSION_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /cds/vendor-releases/{id}/activate"

  - priority: 27
    rule: "An alert may only be retired when the low-value retirement gate is satisfied per calculations.low_value_retirement_eligibility"
    category: business_constraint
    error_id: ERR_RETIREMENT_CRITERIA_NOT_MET
    http_status: 409
    applies_to: "POST /cds/alerts/{id}/retire"

  - priority: 28
    rule: "A new ReviewAssignment may not push its reviewer's review_workload_assigned_minutes above review_workload_capacity_minutes; the check is aggregate, so several individually small assignments can collectively breach the cap"
    category: business_fiscal
    error_id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /cds/review-assignments"
    note: "checked last, so a reviewer who is both over capacity and duplicated receives ERR_DUPLICATE_REVIEW_ASSIGNMENT from priority 24"

endpoints:
  # ---------- Clinicians ----------
  - method: POST
    path: /cds/clinicians
    purpose: Register a clinician with their committee roles and review capacity
    roles: [SystemAdmin]
    input:
      - full_name
      - npi?
      - specialty
      - authorized_roles
      - credential?
      - employment_status?
      - review_workload_capacity_minutes?
    output: Clinician
    side_effects:
      - "review_workload_assigned_minutes starts at 0 and review_workload_remaining_minutes starts equal to review_workload_capacity_minutes"

  - method: GET
    path: /cds/clinicians/{id}
    purpose: Read a clinician including the live workload ledger
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input: []
    output: Clinician
    side_effects: []

  # ---------- Content requests ----------
  - method: POST
    path: /cds/content-requests
    purpose: Submit a decision-support content request with its clinical sponsor and evidence citations
    roles: [ClinicalSponsor, CommitteeChair]
    input:
      - title
      - request_type
      - clinical_domain
      - urgency
      - evidence_grade
      - clinical_sponsor_id
      - evidence_citations
      - patient_safety_flag?
      - requested_go_live_at?
    output: ContentRequest
    side_effects:
      - "status set to INTAKE_SUBMITTED"
      - "peer_reviewed_citation_count derived from the evidence_citations entries with peer_reviewed true"
      - "priority_score computed with the intake_provisional variant; priority_score_basis set to INTAKE_PROVISIONAL"

  - method: GET
    path: /cds/content-requests/{id}
    purpose: Read one content request
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input: []
    output: ContentRequest
    side_effects: []

  - method: GET
    path: /cds/content-requests
    purpose: List content requests with filters, sorted by priority_score DESC then created_at ASC
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - clinical_sponsor_id?
      - status?
      - urgency?
      - request_type?
      - clinical_domain?
      - patient_safety_flag?
      - limit?
      - offset?
    output: ContentRequest[]
    side_effects: []

  - method: POST
    path: /cds/content-requests/{id}/triage
    purpose: Committee triage decision — accept, return to sponsor or decline
    roles: [CommitteeChair]
    input:
      - decision
      - triage_note?
    output: ContentRequest
    side_effects:
      - "ACCEPT recomputes priority_score with the committee_calibrated variant and sets priority_score_basis COMMITTEE_CALIBRATED"
      - "RETURN increments return_count and leaves priority_score untouched"
      - "DECLINE is terminal"

  - method: POST
    path: /cds/content-requests/{id}/resubmit
    purpose: Sponsor resubmits a returned request with revised evidence
    roles: [ClinicalSponsor]
    input:
      - evidence_citations
      - evidence_grade?
      - urgency?
    output: ContentRequest
    side_effects:
      - "status returns to INTAKE_SUBMITTED"
      - "peer_reviewed_citation_count and priority_score recomputed with the intake_provisional variant"

  # ---------- Order sets ----------
  - method: POST
    path: /cds/content-requests/{id}/order-sets
    purpose: Create an order set build against an accepted content request (OCC on the parent request)
    roles: [InformaticsBuilder]
    input:
      - expected_content_request_version
      - name
      - specialty
      - pinned_vendor_release_id
      - built_by_clinician_id
      - supersedes_order_set_id?
    output: OrderSet
    side_effects:
      - "review_state DRAFT, publication_state UNPUBLISHED, risk_class seeded from the parent request's patient_safety_flag"
      - "parent ContentRequest advances TRIAGE_ACCEPTED -> BUILD_IN_PROGRESS on the first build artifact"
      - "supersedes_order_set_id, when supplied and pointing at an UNPUBLISHED order set, transitions that order set to SUPERSEDED and voids its open assignments"
      - "parent ContentRequest.version is incremented"

  - method: GET
    path: /cds/order-sets/{id}
    purpose: Read one order set including both state dimensions and the schedule fields
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input: []
    output: OrderSet
    side_effects: []

  - method: GET
    path: /cds/order-sets
    purpose: List order sets with filters
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - content_request_id?
      - built_by_clinician_id?
      - pinned_vendor_release_id?
      - supersedes_order_set_id?
      - pharmacy_signoff_by_clinician_id?
      - review_state?
      - publication_state?
      - risk_class?
      - specialty?
      - pinned_content_stale?
      - limit?
      - offset?
    output: OrderSet[]
    side_effects: []

  - method: POST
    path: /cds/order-sets/{id}/items
    purpose: Add an orderable item to a draft order set
    roles: [InformaticsBuilder, PharmacyInformaticist]
    input:
      - orderable_code
      - display_name
      - item_category
      - high_alert_medication?
      - default_dose?
      - default_selected?
      - route?
      - frequency?
      - sequence_index?
    output: OrderSetItem
    side_effects:
      - "OrderSet.item_count incremented and high_alert_item_count incremented when high_alert_medication is true"
      - "OrderSet.risk_class recomputed; adding a high-alert item can promote a STANDARD order set to HIGH"
      - "OrderSet.version incremented"

  - method: GET
    path: /cds/order-sets/{id}/items
    purpose: List the items of an order set in sequence_index order
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - item_category?
      - high_alert_medication?
    output: OrderSetItem[]
    side_effects: []

  - method: POST
    path: /cds/order-sets/{id}/pharmacy-signoff
    purpose: Pharmacy informaticist records high-alert medication sign-off
    roles: [PharmacyInformaticist]
    input:
      - pharmacy_signoff_by_clinician_id
      - signoff_note?
    output: OrderSet
    side_effects:
      - "pharmacy_signoff_at set to clock_now and pharmacy_signoff_by_clinician_id stored"
      - "the signing clinician becomes ineligible to review this order set per validations[priority=14]"

  - method: POST
    path: /cds/order-sets/{id}/submit-for-peer-review
    purpose: Move a draft order set into the peer review stage
    roles: [InformaticsBuilder]
    input:
      - submission_note?
    output: OrderSet
    side_effects:
      - "risk_class recomputed and peer_required_votes seeded per calculations.artifact_quorum_evaluation"
      - "review_state DRAFT -> PEER_REVIEW"

  - method: POST
    path: /cds/order-sets/{id}/publish
    purpose: Publish an approved order set and open its first annual review cycle
    roles: [CommitteeChair]
    input: [go_live_at]
    output: OrderSet
    side_effects:
      - "publication_state UNPUBLISHED -> PUBLISHED"
      - "review_due_date, expiration_at and archive_eligible_at computed per calculations.content_review_schedule"
      - "an AnnualReviewTask with artifact_kind ORDER_SET, state PENDING and cycle_index 1 is created"
      - "any predecessor named by supersedes_order_set_id and currently PUBLISHED transitions to SUPERSEDED"
      - "the parent ContentRequest closes when its request_type is satisfied"

  # ---------- Review assignments ----------
  - method: POST
    path: /cds/review-assignments
    purpose: Assign a reviewer to an order set stage or to an alert approval
    roles: [CommitteeChair]
    input:
      - reviewer_id
      - review_kind
      - order_set_id?
      - alert_id?
      - due_at?
    output: ReviewAssignment
    side_effects:
      - "estimated_minutes and risk_class_snapshot computed per calculations.reviewer_workload_minutes; the reviewer's workload ledger is debited"
      - "the first alert assignment moves Alert.review_state DRAFT -> SPECIALTY_APPROVAL and seeds required_approval_votes"
      - "exactly one of order_set_id and alert_id must be supplied"

  - method: GET
    path: /cds/review-assignments/{id}
    purpose: Read one review assignment
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input: []
    output: ReviewAssignment
    side_effects: []

  - method: GET
    path: /cds/review-assignments
    purpose: List review assignments with filters
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - order_set_id?
      - alert_id?
      - reviewer_id?
      - review_kind?
      - state?
      - vote?
      - evidence_concern?
      - limit?
      - offset?
    output: ReviewAssignment[]
    side_effects: []

  - method: POST
    path: /cds/review-assignments/{id}/cast
    purpose: Cast a review vote, re-evaluating quorum on the target artifact
    roles: [PeerReviewer, SpecialtyApprover]
    input:
      - vote
      - evidence_concern?
      - comment?
    output: ReviewAssignment
    side_effects:
      - "assignment ASSIGNED -> CAST with vote, evidence_concern and cast_at recorded"
      - "the target artifact's cast counts, approve ratios and required vote counts are recomputed per calculations.artifact_quorum_evaluation"
      - "a met quorum advances the artifact's review_state; a REVISE or REJECT specialty vote returns it to DRAFT and drives cascade B"

  - method: POST
    path: /cds/review-assignments/{id}/withdraw
    purpose: Withdraw an outstanding assignment and credit the reviewer's workload back
    roles: [CommitteeChair]
    input: [withdrawal_reason]
    output: ReviewAssignment
    side_effects:
      - "assignment ASSIGNED -> WITHDRAWN"
      - "reviewer review_workload_assigned_minutes, review_workload_remaining_minutes and open_assignment_count are restored exactly"

  # ---------- Alerts ----------
  - method: POST
    path: /cds/content-requests/{id}/alerts
    purpose: Design an alert with firing criteria, severity tier and override reason capture
    roles: [InformaticsBuilder]
    input:
      - name
      - firing_criteria
      - severity_tier
      - designed_by_clinician_id
      - override_reason_codes?
      - override_reason_required?
      - hard_stop_justification?
      - linked_order_set_id?
    output: Alert
    side_effects:
      - "review_state DRAFT, lifecycle_state UNPUBLISHED"
      - "override_reason_required is forced true for TIER_1_HARD_STOP and TIER_2_INTERRUPTIVE regardless of the submitted value"
      - "parent ContentRequest advances TRIAGE_ACCEPTED -> BUILD_IN_PROGRESS on the first build artifact"

  - method: GET
    path: /cds/alerts/{id}
    purpose: Read one alert including the firing ledger and latest burden snapshot
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input: []
    output: Alert
    side_effects: []

  - method: GET
    path: /cds/alerts
    purpose: List alerts with filters
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - content_request_id?
      - designed_by_clinician_id?
      - linked_order_set_id?
      - severity_tier?
      - review_state?
      - lifecycle_state?
      - latest_burden_classification?
      - limit?
      - offset?
    output: Alert[]
    side_effects: []

  - method: POST
    path: /cds/alerts/{id}/activate
    purpose: Activate an approved alert into production firing
    roles: [CommitteeChair]
    input:
      - activation_note?
    output: Alert
    side_effects:
      - "lifecycle_state UNPUBLISHED -> ACTIVE"
      - "review_due_date and expiration_at computed per calculations.content_review_schedule and an AnnualReviewTask with artifact_kind ALERT is created"
      - "the parent ContentRequest closes when its request_type is satisfied"

  - method: POST
    path: /cds/alerts/{id}/suspend
    purpose: Suspend a firing alert, closing its open burden window
    roles: [CommitteeChair]
    input: [suspension_reason]
    output: Alert
    side_effects:
      - "lifecycle_state ACTIVE -> SUSPENDED and suspension_count incremented"
      - "an OPEN AlertBurdenWindow is closed with closure_reason SOURCE_SUSPENDED, computing its burden indices and updating the alert ledger"

  - method: POST
    path: /cds/alerts/{id}/resume
    purpose: Resume a suspended alert
    roles: [CommitteeChair]
    input:
      - resume_note?
    output: Alert
    side_effects:
      - "lifecycle_state SUSPENDED -> ACTIVE and suspension_reason cleared"

  - method: POST
    path: /cds/alerts/{id}/retire
    purpose: Retire a low-value alert once the burden gate is satisfied
    roles: [CommitteeChair]
    input: [retirement_rationale]
    output: Alert
    side_effects:
      - "lifecycle_state -> RETIRED with retired_at set"
      - "every OPEN window is closed with closure_reason ALERT_RETIRED and every CLOSED window becomes FINALIZED"
      - "the governing AnnualReviewTask in state PENDING or OVERDUE becomes EXPIRED"

  - method: POST
    path: /cds/alerts/{id}/burden-windows
    purpose: Open a burden monitoring window on an alert (OCC on the parent alert)
    roles: [SystemAdmin, CommitteeChair]
    input: [expected_alert_version, window_start, window_end]
    output: AlertBurdenWindow
    side_effects:
      - "state OPEN with severity_tier_snapshot copied from the alert"
      - "a currently OPEN window of the same alert is closed with closure_reason SUPERSEDED_BY_NEW_WINDOW, computing its burden indices"
      - "parent Alert.version is incremented"

  - method: GET
    path: /cds/alerts/{id}/burden-windows
    purpose: List an alert's burden windows, most recent window_start first
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - state?
      - burden_classification?
      - limit?
      - offset?
    output: AlertBurdenWindow[]
    side_effects: []

  - method: POST
    path: /cds/alerts/{id}/burden-windows/{window_id}/close
    purpose: Close a burden window and compute both burden index variants
    roles: [SystemAdmin, CommitteeChair]
    input:
      - closure_reason?
    output: AlertBurdenWindow
    side_effects:
      - "state OPEN -> CLOSED with every count, rate, volume factor, both indices and the classification computed per calculations.alert_burden_index"
      - "Alert.windowed_fire_count, unwindowed_fire_count, latest_burden_index and latest_burden_classification updated"

  - method: POST
    path: /cds/alerts/{id}/burden-windows/{window_id}/reopen
    purpose: Reopen a closed burden window, reversing its ledger contribution
    roles: [SystemAdmin]
    input: [reopen_reason]
    output: AlertBurdenWindow
    side_effects:
      - "state CLOSED -> OPEN, every computed measure reset to null or 0 and reopen_count incremented"
      - "Alert.windowed_fire_count reduced by the discarded fire_count, unwindowed_fire_count recomputed, lifetime_fire_count unchanged"
      - "Alert.latest_burden_index and latest_burden_classification recomputed from the remaining closed windows, or nulled when none remain"

  - method: GET
    path: /cds/alerts/{id}/override-events
    purpose: List the raw firing and override events recorded for an alert
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - accepted?
      - override_reason_code?
      - fired_at_from?
      - fired_at_to?
      - limit?
      - offset?
    output: OverrideEvent[]
    side_effects: []

  # ---------- Vendor content ----------
  - method: POST
    path: /cds/vendor-releases
    purpose: Receive a drug interaction and dosing rule content release from the vendor
    roles: [PharmacyInformaticist, SystemAdmin]
    input:
      - vendor_name
      - release_label
      - content_domain
      - received_at?
      - effective_at?
      - supersedes_release_id?
    output: VendorContentRelease
    side_effects:
      - "review_cycle_state RECEIVED with delta_count 0"

  - method: GET
    path: /cds/vendor-releases/{id}
    purpose: Read one vendor content release
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input: []
    output: VendorContentRelease
    side_effects: []

  - method: GET
    path: /cds/vendor-releases
    purpose: List vendor content releases with filters
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - supersedes_release_id?
      - review_cycle_state?
      - vendor_name?
      - content_domain?
      - limit?
      - offset?
    output: VendorContentRelease[]
    side_effects: []

  - method: POST
    path: /cds/vendor-releases/{id}/deltas
    purpose: Record one rule change carried by a received vendor release
    roles: [PharmacyInformaticist, SystemAdmin]
    input:
      - rule_code
      - change_type
      - description
      - drug_pair?
      - new_severity?
      - prior_severity?
    output: VendorRuleDelta
    side_effects:
      - "weight assigned from calculations.vendor_release_impact_score constants including the contraindicated bonus"
      - "release delta_count incremented and contraindicated_delta_count incremented when new_severity is CONTRAINDICATED"

  - method: GET
    path: /cds/vendor-releases/{id}/deltas
    purpose: List the rule deltas of a vendor release
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - change_type?
      - disposition?
      - new_severity?
      - limit?
      - offset?
    output: VendorRuleDelta[]
    side_effects: []

  - method: POST
    path: /cds/vendor-releases/{id}/run-impact-analysis
    purpose: Score the release and fork it onto the fast-track or clinical-review branch
    roles: [PharmacyInformaticist]
    input:
      - analysis_note?
    output: VendorContentRelease
    side_effects:
      - "impact_score computed per calculations.vendor_release_impact_score"
      - "review_cycle_state RECEIVED -> IMPACT_ANALYZED_FAST_TRACK or IMPACT_ANALYZED_CLINICAL_REVIEW depending on the threshold"

  - method: POST
    path: /cds/vendor-rule-deltas/{id}/disposition
    purpose: Accept or suppress an individual vendor rule delta
    roles: [PharmacyInformaticist, CommitteeChair]
    input:
      - disposition
      - suppression_justification?
    output: VendorRuleDelta
    side_effects:
      - "release dispositioned_delta_count incremented on the first disposition of this delta"

  - method: POST
    path: /cds/vendor-releases/{id}/activate
    purpose: Activate an analysed release; the clinical-review branch restages pinned content
    roles: [PharmacyInformaticist, CommitteeChair]
    input:
      - activation_note?
    output: VendorContentRelease
    side_effects:
      - "review_cycle_state -> ACTIVATED with activated_at set and any predecessor transitioned to SUPERSEDED"
      - "on the CLINICAL_REVIEW branch only: published order sets pinned to the predecessor are marked pinned_content_stale and their annual review tasks are pulled in to clock_now + STALE_CONTENT_REVIEW_DAYS with stale_content_triggered true; restaged_order_set_count records how many"
      - "on the FAST_TRACK branch restaged_order_set_count stays 0 and no annual review task is touched"

  # ---------- Downtime ----------
  - method: POST
    path: /cds/downtime-events
    purpose: Schedule a decision-support downtime window with a scope and read-only mode
    roles: [SystemAdmin]
    input:
      - scope
      - mode
      - window_start
      - window_end
      - planned?
      - reason?
    output: DowntimeEvent
    side_effects:
      - "state SCHEDULED with blocked_mutation_count 0"

  - method: GET
    path: /cds/downtime-events/{id}
    purpose: Read one downtime event including the blocked mutation counter
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input: []
    output: DowntimeEvent
    side_effects: []

  - method: POST
    path: /cds/downtime-events/{id}/activate
    purpose: Activate a scheduled downtime window, freezing in-scope content
    roles: [SystemAdmin]
    input:
      - activation_note?
    output: DowntimeEvent
    side_effects:
      - "state SCHEDULED -> ACTIVE with activated_at set"
      - "in-scope content mutations begin returning ERR_CDS_CONTENT_FROZEN, or ERR_CDS_UNAVAILABLE when mode is FULL_UNAVAILABLE"

  - method: POST
    path: /cds/downtime-events/{id}/close
    purpose: Close an active downtime window or cancel a scheduled one
    roles: [SystemAdmin]
    input:
      - closure_note?
    output: DowntimeEvent
    side_effects:
      - "ACTIVE -> CLOSED or SCHEDULED -> CANCELLED with closed_at set; in-scope mutations resume"

  # ---------- Post-implementation measurement ----------
  - method: POST
    path: /cds/order-sets/{id}/adherence-measurements
    purpose: Record a post-implementation adherence and unintended-consequence observation set
    roles: [CommitteeChair, InformaticsBuilder, ClinicalSponsor]
    input: [measurement_period_start, measurement_period_end, unit_observations]
    output: AdherenceMeasurement
    side_effects:
      - "included_unit_count and excluded_unit_count derived; units with eligible_orders 0 are excluded"
      - "adherence_pct_per_protocol computed with the per_protocol variant of calculations.order_set_adherence"
      - "measurement_state PROVISIONAL, or INSUFFICIENT_DATA when included_unit_count is 0"

  - method: GET
    path: /cds/order-sets/{id}/adherence-measurements
    purpose: List the adherence measurements recorded against an order set
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - measurement_state?
      - verdict?
      - limit?
      - offset?
    output: AdherenceMeasurement[]
    side_effects: []

  - method: POST
    path: /cds/adherence-measurements/{id}/finalize
    purpose: Finalize a measurement with a verdict, computing the intention-to-treat variant
    roles: [CommitteeChair]
    input:
      - verdict
      - finalization_note?
    output: AdherenceMeasurement
    side_effects:
      - "adherence_pct_intention_to_treat and unintended_event_rate_per_100 computed with the intention_to_treat variant"
      - "measurement_state PROVISIONAL -> FINALIZED and OrderSet.latest_adherence_pct updated"
      - "a RETIRE verdict pushes the order set PUBLISHED -> EXPIRING and its PENDING annual review task to OVERDUE"

  # ---------- Annual content review ----------
  - method: GET
    path: /cds/annual-review-tasks/{id}
    purpose: Read one annual review task
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input: []
    output: AnnualReviewTask
    side_effects: []

  - method: GET
    path: /cds/annual-review-tasks
    purpose: List annual review tasks with filters
    roles: [SystemAdmin, CommitteeChair, InformaticsBuilder, ClinicalSponsor, PeerReviewer, SpecialtyApprover, PharmacyInformaticist]
    input:
      - order_set_id?
      - alert_id?
      - attested_by_clinician_id?
      - artifact_kind?
      - state?
      - stale_content_triggered?
      - cycle_index?
      - limit?
      - offset?
    output: AnnualReviewTask[]
    side_effects: []

  - method: POST
    path: /cds/annual-review-tasks/{id}/attest
    purpose: Sponsor attests that the content remains current, opening the next review cycle
    roles: [ClinicalSponsor]
    input:
      - evidence_citations
      - attestation_note?
    output: AnnualReviewTask
    side_effects:
      - "state PENDING or OVERDUE -> ATTESTED with attested_at and attested_by_clinician_id set"
      - "the governed artifact's review_due_date, expiration_at and archive_eligible_at are recomputed from clock_now"
      - "an EXPIRING order set returns to PUBLISHED"
      - "a successor AnnualReviewTask is created in state PENDING with cycle_index incremented"

  # ---------- Operations ----------
  - method: POST
    path: /cds/_ops/run-expiration-sweep
    purpose: Run the expiration, archival and downtime-close sweep against the current logical clock
    roles: [SystemAdmin, CommitteeChair]
    input:
      - dry_run?
    output: { swept_at: string, tasks_marked_overdue: integer, tasks_expired: integer, order_sets_marked_expiring: integer, order_sets_expired: integer, order_sets_archived: integer, alerts_suspended: integer, alerts_retired: integer, burden_windows_closed: integer, downtime_events_closed: integer }
    side_effects:
      - "drives the full expiration cascade: AnnualReviewTask PENDING -> OVERDUE -> EXPIRED, OrderSet PUBLISHED -> EXPIRING -> EXPIRED -> ARCHIVED, Alert ACTIVE -> SUSPENDED -> RETIRED, AlertBurdenWindow OPEN -> CLOSED -> FINALIZED"
      - "closes any ACTIVE DowntimeEvent whose window_end has passed"
      - "dry_run true reports the counts without applying any transition"

  # ---------- Test-driving endpoints ----------
  - method: POST
    path: /_events/alert-firings
    purpose: Deterministically ingest a batch of alert firings and overrides so burden windows have data to score
    roles: [SystemAdmin]
    input:
      - alert_id
      - fired_at_start
      - interval_seconds
      - fire_count
      - override_count
      - distinct_clinician_count
      - override_reason_code?
    output: { created_event_count: integer, first_fired_at: string, last_fired_at: string, override_event_count: integer, distinct_clinician_count: integer }
    side_effects:
      - "creates fire_count OverrideEvent rows with fired_at = fired_at_start + n * interval_seconds for n in 0..fire_count-1"
      - "the first override_count events are created with accepted false and the supplied override_reason_code; the remainder with accepted true and a null reason code"
      - "firing_clinician_ref is assigned round-robin as SYN-001 .. SYN-<distinct_clinician_count>, zero padded to three digits"
      - "Alert.lifetime_fire_count increased by fire_count and unwindowed_fire_count recomputed; window counters are only computed at window close"

  - method: POST
    path: /_clock/set_current_utc
    purpose: Set the logical clock that every schedule, sweep and freeze comparison reads
    roles: [SystemAdmin]
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "the default logical clock before any call is 2026-08-01T00:00:00Z"
      - "setting the clock never itself triggers a sweep; POST /cds/_ops/run-expiration-sweep must be called explicitly"

errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Missing or unknown X-User-ID"
    triggered_by: "any /cds endpoint called without an X-User-ID header, or with an id that names no Clinician"

  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Caller role may not perform this operation"
    triggered_by: "a clinician whose authorized_roles contains no role permitted for the endpoint"

  - error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    message: "Caller identity does not match the identity bound to this operation"
    triggered_by: "resubmit by a clinician other than clinical_sponsor_id, cast by a clinician other than reviewer_id, attest by a clinician other than the governing sponsor"

  - error_id: ERR_CLINICIAN_NOT_FOUND
    http_status: 404
    message: "Clinician not found"
    triggered_by: "an unknown clinician id in a path or in a body FK such as reviewer_id or clinical_sponsor_id"

  - error_id: ERR_CONTENT_REQUEST_NOT_FOUND
    http_status: 404
    message: "Content request not found"
    triggered_by: "an unknown content request id in the path"

  - error_id: ERR_ORDER_SET_NOT_FOUND
    http_status: 404
    message: "Order set not found"
    triggered_by: "an unknown order set id in the path, or in supersedes_order_set_id / linked_order_set_id / order_set_id"

  - error_id: ERR_ALERT_NOT_FOUND
    http_status: 404
    message: "Alert not found"
    triggered_by: "an unknown alert id in the path or in alert_id"

  - error_id: ERR_BURDEN_WINDOW_NOT_FOUND
    http_status: 404
    message: "Burden window not found for this alert"
    triggered_by: "an unknown window_id, or a window_id that exists but belongs to a different alert than the path alert"

  - error_id: ERR_REVIEW_ASSIGNMENT_NOT_FOUND
    http_status: 404
    message: "Review assignment not found"
    triggered_by: "an unknown review assignment id in the path"

  - error_id: ERR_VENDOR_RELEASE_NOT_FOUND
    http_status: 404
    message: "Vendor content release not found"
    triggered_by: "an unknown release id in the path or in pinned_vendor_release_id / supersedes_release_id"

  - error_id: ERR_VENDOR_RULE_DELTA_NOT_FOUND
    http_status: 404
    message: "Vendor rule delta not found"
    triggered_by: "an unknown delta id on POST /cds/vendor-rule-deltas/{id}/disposition"

  - error_id: ERR_DOWNTIME_EVENT_NOT_FOUND
    http_status: 404
    message: "Downtime event not found"
    triggered_by: "an unknown downtime event id in the path"

  - error_id: ERR_ADHERENCE_MEASUREMENT_NOT_FOUND
    http_status: 404
    message: "Adherence measurement not found"
    triggered_by: "an unknown measurement id on POST /cds/adherence-measurements/{id}/finalize"

  - error_id: ERR_ANNUAL_REVIEW_TASK_NOT_FOUND
    http_status: 404
    message: "Annual review task not found"
    triggered_by: "an unknown task id in the path"

  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request body failed schema validation"
    triggered_by: "a missing required field, an unknown enum member, a wrong JSON type, an empty evidence_citations array, or supplying neither or both of order_set_id and alert_id on POST /cds/review-assignments"

  - error_id: ERR_INVALID_WINDOW_BOUNDS
    http_status: 422
    message: "window_start must be strictly before window_end"
    triggered_by: "an inverted or zero-length burden window or downtime window"

  - error_id: ERR_INVALID_OBSERVATION_COUNTS
    http_status: 422
    message: "Unit observation counts are out of range"
    triggered_by: "adherent_orders greater than eligible_orders, or any negative count, in unit_observations"

  - error_id: ERR_STALE_CONTENT_REQUEST_VERSION
    http_status: 412
    message: "expected_content_request_version does not match the current content request version"
    triggered_by: "POST /cds/content-requests/{id}/order-sets with a stale expected_content_request_version"

  - error_id: ERR_STALE_ALERT_VERSION
    http_status: 412
    message: "expected_alert_version does not match the current alert version"
    triggered_by: "POST /cds/alerts/{id}/burden-windows with a stale expected_alert_version"

  - error_id: ERR_CONTENT_REQUEST_NOT_TRIAGEABLE
    http_status: 409
    message: "Content request is not awaiting triage"
    triggered_by: "triaging a request whose status is not INTAKE_SUBMITTED"

  - error_id: ERR_CONTENT_REQUEST_NOT_RETURNED
    http_status: 409
    message: "Content request is not awaiting resubmission"
    triggered_by: "resubmitting a request whose status is not RETURNED_TO_SPONSOR"

  - error_id: ERR_CONTENT_REQUEST_NOT_ACCEPTED
    http_status: 409
    message: "Content request has not been accepted for build"
    triggered_by: "creating an order set or an alert against a request whose status is not TRIAGE_ACCEPTED or BUILD_IN_PROGRESS"

  - error_id: ERR_ORDER_SET_NOT_DRAFT
    http_status: 409
    message: "Order set is not in DRAFT"
    triggered_by: "adding an item to, or submitting for peer review, an order set whose review_state is not DRAFT"

  - error_id: ERR_ORDER_SET_NOT_APPROVED
    http_status: 409
    message: "Order set is not approved for publication"
    triggered_by: "publishing an order set whose review_state is not APPROVED or whose publication_state is not UNPUBLISHED"

  - error_id: ERR_ALERT_NOT_APPROVED
    http_status: 409
    message: "Alert is not approved for activation"
    triggered_by: "activating an alert whose review_state is not APPROVED or whose lifecycle_state is not UNPUBLISHED"

  - error_id: ERR_ALERT_NOT_ACTIVE
    http_status: 409
    message: "Alert is not active"
    triggered_by: "suspending an alert that is not ACTIVE, or retiring an alert that is neither ACTIVE nor SUSPENDED"

  - error_id: ERR_ALERT_NOT_SUSPENDED
    http_status: 409
    message: "Alert is not suspended"
    triggered_by: "resuming an alert whose lifecycle_state is not SUSPENDED"

  - error_id: ERR_BURDEN_WINDOW_NOT_OPEN
    http_status: 409
    message: "Burden window is not open"
    triggered_by: "closing a window that is already CLOSED or FINALIZED"

  - error_id: ERR_BURDEN_WINDOW_NOT_CLOSED
    http_status: 409
    message: "Burden window is not closed"
    triggered_by: "reopening a window that is OPEN or already FINALIZED"

  - error_id: ERR_ANOTHER_WINDOW_OPEN
    http_status: 409
    message: "Another burden window of this alert is already open"
    triggered_by: "reopening a closed window while a different window of the same alert is OPEN"

  - error_id: ERR_CLINICIAN_NOT_ACTIVE
    http_status: 409
    message: "Clinician employment status is not ACTIVE"
    triggered_by: "assigning a review to, or casting a vote as, a clinician whose employment_status is LEAVE or TERMINATED"

  - error_id: ERR_ASSIGNMENT_NOT_ASSIGNED
    http_status: 409
    message: "Review assignment is no longer outstanding"
    triggered_by: "casting or withdrawing an assignment already in state CAST, WITHDRAWN or VOIDED"

  - error_id: ERR_VENDOR_RELEASE_NOT_RECEIVED
    http_status: 409
    message: "Vendor release is not awaiting impact analysis"
    triggered_by: "running impact analysis on a release whose review_cycle_state is not RECEIVED, or on a release with zero deltas"

  - error_id: ERR_VENDOR_RELEASE_NOT_ANALYZED
    http_status: 409
    message: "Vendor release has not been impact analysed"
    triggered_by: "activating or dispositioning against a release still in RECEIVED, or activating one already ACTIVATED or SUPERSEDED"

  - error_id: ERR_DOWNTIME_EVENT_NOT_SCHEDULED
    http_status: 409
    message: "Downtime event is not scheduled"
    triggered_by: "activating a downtime event that is already ACTIVE, CLOSED or CANCELLED, or activating one whose window has not started or has already ended"

  - error_id: ERR_DOWNTIME_EVENT_NOT_CLOSEABLE
    http_status: 409
    message: "Downtime event is already closed or cancelled"
    triggered_by: "closing a downtime event in state CLOSED or CANCELLED"

  - error_id: ERR_MEASUREMENT_NOT_PROVISIONAL
    http_status: 409
    message: "Adherence measurement is not provisional"
    triggered_by: "finalizing a measurement in state FINALIZED or INSUFFICIENT_DATA"

  - error_id: ERR_REVIEW_TASK_NOT_OPEN
    http_status: 409
    message: "Annual review task is no longer open for attestation"
    triggered_by: "attesting a task already in state ATTESTED or EXPIRED"

  - error_id: ERR_CDS_CONTENT_FROZEN
    http_status: 409
    message: "Decision support content is frozen by an active downtime window"
    triggered_by: "any in-scope content mutation while a READ_ONLY DowntimeEvent is ACTIVE"

  - error_id: ERR_CDS_UNAVAILABLE
    http_status: 409
    message: "Decision support content is unavailable during this downtime window"
    triggered_by: "any in-scope read or mutation while a FULL_UNAVAILABLE DowntimeEvent is ACTIVE"

  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "Segregation of duties prevents this clinician from performing this step"
    triggered_by: "assigning the builder or designer as a reviewer of their own artifact, holding both review kinds on one order set, or publishing an artifact whose deciding specialty vote the caller cast"

  - error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    message: "Clinician may not review content they sponsored or signed off"
    triggered_by: "assigning the request's clinical sponsor, or the pharmacy sign-off clinician, as a reviewer of that artifact"

  - error_id: ERR_EVIDENCE_INSUFFICIENT
    http_status: 422
    message: "Evidence citations do not meet the acceptance threshold"
    triggered_by: "accepting a request with fewer than two citations or no peer-reviewed citation, accepting a safety-flagged request with fewer than two peer-reviewed citations, or attesting with an empty citation array"

  - error_id: ERR_TIER1_JUSTIFICATION_REQUIRED
    http_status: 422
    message: "A hard-stop alert requires a documented justification"
    triggered_by: "assigning review to, or activating, a TIER_1_HARD_STOP alert with a null hard_stop_justification"

  - error_id: ERR_OVERRIDE_REASON_REQUIRED
    http_status: 422
    message: "Override reason capture is incomplete for this alert"
    triggered_by: "activating an alert with override_reason_required true and fewer than two override_reason_codes, or ingesting an override event with a missing or undeclared override_reason_code"

  - error_id: ERR_HIGH_ALERT_PHARMACY_SIGNOFF_REQUIRED
    http_status: 409
    message: "High-alert medication content requires pharmacy sign-off before publication"
    triggered_by: "publishing an order set with high_alert_item_count >= 1 and a null pharmacy_signoff_at"

  - error_id: ERR_BURDEN_WINDOW_OVERLAP
    http_status: 409
    message: "Burden window overlaps an existing closed window for this alert"
    triggered_by: "opening a window whose half-open interval intersects a CLOSED or FINALIZED window of the same alert"

  - error_id: ERR_DOWNTIME_WINDOW_OVERLAP
    http_status: 409
    message: "Downtime window overlaps an existing scheduled or active window with an intersecting scope"
    triggered_by: "scheduling a downtime whose closed interval touches or intersects another SCHEDULED or ACTIVE event with an intersecting scope"

  - error_id: ERR_ADHERENCE_VERDICT_UNSUPPORTED
    http_status: 422
    message: "Submitted verdict is not supported by the computed measurements"
    triggered_by: "finalizing with SUSTAIN when the intention-to-treat adherence is below the floor or the unintended rate is above the ceiling, or with RETIRE when both measures are acceptable"

  - error_id: ERR_VENDOR_RELEASE_NOT_ACTIVATED
    http_status: 409
    message: "Pinned vendor content release is not activated"
    triggered_by: "publishing an order set whose pinned_vendor_release_id names a release not in state ACTIVATED"

  - error_id: ERR_LINKED_ORDER_SET_NOT_PUBLISHED
    http_status: 409
    message: "Linked order set is not published"
    triggered_by: "activating or resuming an alert whose linked_order_set_id names an order set that is not PUBLISHED"

  - error_id: ERR_DUPLICATE_REVIEW_ASSIGNMENT
    http_status: 409
    message: "Clinician already holds an outstanding assignment of this kind on this artifact"
    triggered_by: "a second POST /cds/review-assignments with the same reviewer_id, artifact and review_kind while the first is ASSIGNED or CAST"

  - error_id: ERR_DELTA_DISPOSITION_INCOMPLETE
    http_status: 409
    message: "Every vendor rule delta must be dispositioned before activation"
    triggered_by: "activating a release whose dispositioned_delta_count is less than delta_count"

  - error_id: ERR_SUPPRESSION_JUSTIFICATION_REQUIRED
    http_status: 422
    message: "Suppressed deltas on a clinical-review release require a justification"
    triggered_by: "activating a CLINICAL_REVIEW release that has a SUPPRESS delta with a null suppression_justification"

  - error_id: ERR_RETIREMENT_CRITERIA_NOT_MET
    http_status: 409
    message: "Alert does not meet the low-value retirement criteria"
    triggered_by: "retiring an alert with fewer than two closed burden windows, or where either of the two most recent closed windows fails the override rate, fire count or burden index threshold"

  - error_id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http_status: 422
    message: "Assignment would exceed the reviewer's workload capacity"
    triggered_by: "an assignment whose estimated_minutes pushes review_workload_assigned_minutes above review_workload_capacity_minutes"

roles:
  - role: ClinicalSponsor
    identity: "entity_backed:Clinician"
    description: "The requesting clinician who owns the evidence base for a content request and re-attests it every review cycle"
    exclusive_operations:
      - "POST /cds/content-requests/{id}/resubmit"
      - "POST /cds/annual-review-tasks/{id}/attest"
    shared_operations:
      - "POST /cds/content-requests (shared with CommitteeChair)"
      - "POST /cds/order-sets/{id}/adherence-measurements (shared with CommitteeChair and InformaticsBuilder)"
      - "all GET endpoints"
    constraints:
      - "may only resubmit or attest for requests where X-User-ID == clinical_sponsor_id (validations priority 3)"
      - "may never be assigned as a reviewer of an artifact built from their own request (validations priority 14)"

  - role: InformaticsBuilder
    identity: "entity_backed:Clinician"
    description: "Clinical informaticist who builds order sets, adds orderable items and designs alert firing criteria"
    exclusive_operations:
      - "POST /cds/content-requests/{id}/order-sets"
      - "POST /cds/content-requests/{id}/alerts"
      - "POST /cds/order-sets/{id}/submit-for-peer-review"
    shared_operations:
      - "POST /cds/order-sets/{id}/items (shared with PharmacyInformaticist)"
      - "POST /cds/order-sets/{id}/adherence-measurements"
      - "all GET endpoints"
    constraints:
      - "cannot publish an order set or activate an alert; that is the CommitteeChair's exclusive step"
      - "cannot be assigned to review an artifact they built (validations priority 13)"

  - role: PeerReviewer
    identity: "entity_backed:Clinician"
    description: "Clinician who reviews order set content for clinical accuracy in the PEER_REVIEW stage"
    exclusive_operations: []
    shared_operations:
      - "POST /cds/review-assignments/{id}/cast (shared with SpecialtyApprover)"
      - "all GET endpoints"
    constraints:
      - "may only cast on assignments where X-User-ID == reviewer_id (validations priority 3)"
      - "casting a PEER_REVIEW REJECT returns the order set to DRAFT; casting REVISE only lowers the approve ratio"
      - "cannot create or withdraw assignments"

  - role: SpecialtyApprover
    identity: "entity_backed:Clinician"
    description: "Specialty representative who gives the final content approval for order sets and the only approval stage for alerts"
    exclusive_operations: []
    shared_operations:
      - "POST /cds/review-assignments/{id}/cast (shared with PeerReviewer)"
      - "all GET endpoints"
    constraints:
      - "may not hold both a PEER_REVIEW and a SPECIALTY_APPROVAL assignment on the same order set (validations priority 13)"
      - "the approver who casts the deciding specialty vote may not then publish or activate the artifact (validations priority 13)"

  - role: CommitteeChair
    identity: "entity_backed:Clinician"
    description: "Chair of the clinical informatics committee: triage, assignment, publication, activation, suspension and retirement authority"
    exclusive_operations:
      - "POST /cds/content-requests/{id}/triage"
      - "POST /cds/review-assignments"
      - "POST /cds/review-assignments/{id}/withdraw"
      - "POST /cds/order-sets/{id}/publish"
      - "POST /cds/alerts/{id}/activate"
      - "POST /cds/alerts/{id}/suspend"
      - "POST /cds/alerts/{id}/resume"
      - "POST /cds/alerts/{id}/retire"
      - "POST /cds/adherence-measurements/{id}/finalize"
    shared_operations:
      - "POST /cds/content-requests (shared with ClinicalSponsor)"
      - "POST /cds/alerts/{id}/burden-windows and the close action (shared with SystemAdmin)"
      - "POST /cds/vendor-releases/{id}/activate and POST /cds/vendor-rule-deltas/{id}/disposition (shared with PharmacyInformaticist)"
      - "POST /cds/_ops/run-expiration-sweep (shared with SystemAdmin)"
      - "all GET endpoints"
    constraints:
      - "is the ONLY role that may activate a CLINICAL_REVIEW vendor release; a PharmacyInformaticist may only activate the FAST_TRACK branch"
      - "cannot cast review votes and cannot reopen a burden window"

  - role: PharmacyInformaticist
    identity: "entity_backed:Clinician"
    description: "Medication safety pharmacist who owns vendor interaction and dosing content plus high-alert medication sign-off"
    exclusive_operations:
      - "POST /cds/order-sets/{id}/pharmacy-signoff"
      - "POST /cds/vendor-releases/{id}/run-impact-analysis"
    shared_operations:
      - "POST /cds/vendor-releases and POST /cds/vendor-releases/{id}/deltas (shared with SystemAdmin)"
      - "POST /cds/vendor-releases/{id}/activate and POST /cds/vendor-rule-deltas/{id}/disposition (shared with CommitteeChair)"
      - "POST /cds/order-sets/{id}/items (shared with InformaticsBuilder)"
      - "all GET endpoints"
    constraints:
      - "a release on the CLINICAL_REVIEW branch is rejected for this role with ERR_UNAUTHORIZED; only the FAST_TRACK branch is theirs to activate"
      - "a clinician who signs off high-alert content may not review that same order set (validations priority 14)"

  - role: SystemAdmin
    identity: opaque
    description: "Platform operator responsible for clinician registration, downtime windows, burden window mechanics, firing ingestion and the logical clock"
    exclusive_operations:
      - "POST /cds/clinicians"
      - "POST /cds/downtime-events"
      - "POST /cds/downtime-events/{id}/activate"
      - "POST /cds/downtime-events/{id}/close"
      - "POST /cds/alerts/{id}/burden-windows/{window_id}/reopen"
      - "POST /_events/alert-firings"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /cds/alerts/{id}/burden-windows and the close action (shared with CommitteeChair)"
      - "POST /cds/vendor-releases and POST /cds/vendor-releases/{id}/deltas (shared with PharmacyInformaticist)"
      - "POST /cds/_ops/run-expiration-sweep (shared with CommitteeChair)"
      - "all GET endpoints"
    constraints:
      - "may never triage, review, publish, activate, retire or attest any clinical content"

  - role_model_notes: |
      role_model is segregation_of_duties. Roles are carried on
      Clinician.authorized_roles and a single clinician may legitimately hold
      several roles, so authorization alone is never sufficient: the checks at
      validations priority 13 and 14 compare the caller's X-User-ID against the
      identities already recorded on the artifact. A clinician holding both
      InformaticsBuilder and SpecialtyApprover passes the role check for
      POST /cds/review-assignments as a reviewer and is still rejected with
      ERR_SEGREGATION_OF_DUTIES when the artifact is one they built.
