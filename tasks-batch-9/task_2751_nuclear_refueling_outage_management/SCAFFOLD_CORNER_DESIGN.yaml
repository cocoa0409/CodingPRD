      - name: lock_scope_moves_outage_from_planning_to_scope_locked
        claim_type: valid_transition
        grounds: ["state_machines.Outage.transitions[PLANNING->SCOPE_LOCKED]", "endpoints.POST_/outages/{id}/lock-scope"]
        distinguishing_aspect: "The happy path of the first outage transition: status becomes SCOPE_LOCKED, scope_locked_at is stamped with the logical clock, and Outage.version increments by exactly 1."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 in PLANNING with one APPROVED work order (MAINTENANCE, 10 hours, 1000 USD) and one APPROVED core load pattern."
            - "The logical clock is advanced to 2026-08-20T06:00:00Z immediately before the trigger so the stamped instant is unambiguous."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
