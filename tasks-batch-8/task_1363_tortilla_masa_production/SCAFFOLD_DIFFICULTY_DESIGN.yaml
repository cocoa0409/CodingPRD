            - { call: "POST /plant/products", payload: { sku_code: "CORN-6-C1", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-C1", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 100, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T12:00:00Z", expected_line_version: "${line_v}" }, as: LineScheduler, captures: { run_id: "$.data.id" } }
          trigger:
