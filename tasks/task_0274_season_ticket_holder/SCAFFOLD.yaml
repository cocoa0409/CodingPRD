        type: string
        source: system
        description: "Server-minted UUID, no type prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription holding this seat."
      - name: seat_id
        type: string
        source: input
        description: "FK -> Seat.id; the physical seat assigned."
      - name: assigned_price_cents
        type: integer
        source: computed
        description: "Per-seat price under the subscription's plan and the holder's loyalty tier, computed by renewal_price at assignment."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Assignment status."
        default: ASSIGNED
        constraints: "one of {ASSIGNED, RELEASED, REASSIGNED}"

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
