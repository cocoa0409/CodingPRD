              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "occ3@x.com", display_name: "O3" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "SPV", promo_type: "THRESHOLD", threshold_tiers: [{ min_subtotal_cents: 0, discount_cents: 100 }], stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z", budget_cap_cents: 5000 }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "SPVK", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 2000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "GET /promotions/${promo_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { promo_ver: $.data.version }
          trigger:
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "SPVK", expected_promotion_version: "${promo_ver} - 1" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_STALE_PROMOTION_VERSION (412)"

      - name: derived_member_count_decrements_on_revoke
        claim_type: derived_field_reconciliation
        grounds: [entities.Segment.fields.member_count, state_machines.SegmentMembership.ACTIVE_to_REVOKED]
        distinguishing_aspect: "Segment.member_count == 1 after one ACTIVE membership; revoking it recomputes member_count to 0."
        test_recipe:
          setup: ["Segment SEG with one ACTIVE membership for customer C."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dfr@x.com", display_name: "DFR" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /segments"
              payload: { code: "SEG1", name: "Seg One" }
              as: MerchantAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /segments/${seg_id}/members"
              payload: { customer_id: "${cust_id}" }
              as: MerchantAdmin
              captures: { mem_id: $.data.id }
          trigger:
            - call: "DELETE /segments/${seg_id}/members/${mem_id}"
              payload: {}
              as: MerchantAdmin
          assert:
            - "Segment.${seg_id}.member_count == 0 after revoke"

      - name: scheduled_expiry_sweep_on_clock_advance
        claim_type: scheduled_actions
        grounds: [state_machines.Promotion.ACTIVE_to_EXPIRED, endpoints]
        distinguishing_aspect: "Advancing the clock past active_until runs the sweep and transitions an ACTIVE promotion to EXPIRED."
        test_recipe:
          setup: ["Clock 2026-06-05. Promotion SCH ACTIVE, active window 2026-06-01..2026-06-10."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-05T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /promotions"
              payload: { name: "SCH", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-06-10T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
          trigger:
            - call: "POST /_clock/advance"
              payload: { seconds: 864000 }
              as: PlatformOperator
          assert:
            - "Promotion.${promo_id}.status == EXPIRED after the clock advances past active_until (2026-06-10)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_discount_after_reprice
        claim_type: immediate
        grounds: [calculations.percent_off_discount, entities.Cart.fields.total_discount_cents]
        distinguishing_aspect: "Discount is visible in the same reprice response (immediate consistency): repricing returns total_discount_cents == 200 for a 2000c line at 10%."
        test_recipe:
          setup: ["Clock 2026-06-15. Promotion IM PERCENT_OFF 10% ACTIVE, coupon IMK; cart one line 2000c, applied."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "cm1@x.com", display_name: "CM1" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "IM", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "IMK", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 2000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "IMK" }
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { td: $.data.total_discount_cents }
          assert:
            - "the reprice response data.total_discount_cents == 200 (visible immediately in the same response)"
