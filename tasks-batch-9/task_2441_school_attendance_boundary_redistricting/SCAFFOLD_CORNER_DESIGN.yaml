  - name: first_complete_projection_run_auto_advances_the_study_phase
    claim_type: side_effect_execution
    grounds:
    - state_machines.BoundaryStudy.DATA_LOCKED_to_SCENARIO_DEVELOPMENT
    - endpoints[POST /redistricting/studies/{id}/projection-runs]
    - calculations.area_enrollment_projection
    - entities.ProjectionRun.fields.area_projections
    - entities.ProjectionRun.fields.status
    distinguishing_aspect: 'The DATA_LOCKED -> SCENARIO_DEVELOPMENT transition has no endpoint of its own - it is a side effect of the FIRST run reaching COMPLETE. The instance also pins the projection arithmetic with no pipeline at all: round_half_up(resident * 0.98^5, 0) gives 271 / 181 / 136 and a total of 588, and a SECOND run of the same variant supersedes the first without moving the study again.'
    test_recipe:
      setup:
      - The Riverbend study is DATA_LOCKED with three areas of 300, 200 and 150 residents, horizon_years 5, and no housing developments, so every development term is zero.
      - The clock reads 2026-09-01T00:00:00Z, making the horizon end 2031-08-31.
      - The caller re-reads the study before each run so that expected_study_version is always current.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
