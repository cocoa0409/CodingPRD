scaffold_corner_design:
  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: corner_create_tour_product_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.TourProduct, endpoints]
        distinguishing_aspect: "POST /api/tour-products with all required fields returns 201 and echoes name/duration_days/base_price_per_person_cents plus server id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/tour-products"
              payload: { name: "Sampler", duration_days: 2, base_price_per_person_cents: 100000 }
              as: OpsManager
              captures: { tp: $.data.id }
          assert:
            - "http status == 201"
            - "TourProduct.${tp}.duration_days == 2 and base_price_per_person_cents == 100000"

      - name: corner_booking_insurance_defaults_false
        claim_type: Defaults
        grounds: [entities.Booking.fields.insurance_opt_in]
        distinguishing_aspect: "Omitting insurance_opt_in on POST /api/bookings yields insurance_opt_in==false and insurance_premium_cents==0."
        test_recipe:
          setup: ["A published departure exists."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "DefTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Def Dep", start_date: "2026-08-01", end_date: "2026-08-02", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
          trigger:
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Def Party", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
          assert:
            - "Booking.${bk}.insurance_opt_in == false"
            - "Booking.${bk}.insurance_premium_cents == 0"

      - name: corner_coach_status_initialized_available
        claim_type: Computed Fields
        grounds: [entities.Coach.fields.status]
        distinguishing_aspect: "A freshly created coach has system-set status AVAILABLE regardless of input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/coaches"
              payload: { code: "CX", seat_capacity: 40, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
          assert:
            - "Coach.${coach}.status == AVAILABLE"

      - name: corner_get_departure_nonexistent_returns_404
        claim_type: Not Found
        grounds:
          - endpoints
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /api/departures/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/departures/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

      - name: corner_create_booking_missing_pax_count_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Booking.fields.pax_count
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /api/bookings without the required pax_count returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A published departure exists."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "ReqTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Req Dep", start_date: "2026-08-01", end_date: "2026-08-02", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
          trigger:
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "NoPax", rooms_requested: 0 }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION (400)"

  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: corner_publish_twice_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Departure.PLANNING_to_OPEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second publish on an already-OPEN departure (not in PLANNING) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A published (OPEN) departure exists."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "PubTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Pub Dep", start_date: "2026-08-01", end_date: "2026-08-02", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
          trigger:
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: corner_cancel_departure_twice_returns_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Departure.terminal_states
          - errors[ERR_DEPARTURE_TERMINAL]
        distinguishing_aspect: "Cancelling an already-CANCELLED departure returns ERR_DEPARTURE_TERMINAL; no further side effects."
        test_recipe:
          setup: ["A published departure has been CANCELLED."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "CanTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Can Dep", start_date: "2026-08-01", end_date: "2026-08-02", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
            - call: "POST /api/departures/${dep}/cancel"
              payload: { reason: "first cancel" }
              as: OpsManager
          trigger:
            - call: "POST /api/departures/${dep}/cancel"
              payload: { reason: "second cancel" }
              as: OpsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEPARTURE_TERMINAL (409)"

      - name: corner_voucher_redeem_twice_returns_not_issued
        claim_type: Idempotency
        grounds:
          - state_machines.Voucher.ISSUED_to_REDEEMED
          - errors[ERR_VOUCHER_NOT_ISSUED]
        distinguishing_aspect: "Redeeming a voucher already REDEEMED returns ERR_VOUCHER_NOT_ISSUED (precondition status==ISSUED)."
        test_recipe:
          setup: ["A CONFIRMED booking with an issued MEAL voucher, redeemed once."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "VouTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "VC", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Vou Dep", start_date: "2026-08-01", end_date: "2026-08-02", guaranteed_min_pax: 2, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Vou Party", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "V1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "V2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
            - call: "GET /api/vouchers"
              payload: { booking_id: "${bk}" }
              as: SalesAgent
              captures: { v0: "$.data[0].id" }
            - call: "POST /api/vouchers/${v0}/redeem"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /api/vouchers/${v0}/redeem"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VOUCHER_NOT_ISSUED (409)"

  # -------------------------------------------------------------------------
  - section: validations
    instances:
      - name: corner_coach_capacity_exceeded_on_confirm
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_COACH_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Confirming a pax-2 booking against a seat_capacity-1 coach returns ERR_COACH_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["Departure OPEN, coach seat_capacity 1 assigned; booking pax 2 with 2 passengers, deposit paid."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "CapTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "CapC", seat_capacity: 1, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Cap Dep", start_date: "2026-08-01", end_date: "2026-08-02", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Cap Party", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "P1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "P2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
          trigger:
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COACH_CAPACITY_EXCEEDED (409)"

      - name: corner_passenger_count_mismatch_on_confirm
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_PASSENGER_COUNT_MISMATCH]
        distinguishing_aspect: "Confirming a pax-2 booking that has only 1 passenger returns ERR_PASSENGER_COUNT_MISMATCH."
        test_recipe:
          setup: ["Departure OPEN, coach assigned; booking pax 2 with only 1 passenger, deposit paid."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "PcTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "PcC", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Pc Dep", start_date: "2026-08-01", end_date: "2026-08-02", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Pc Party", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "Solo", is_lead: true }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
          trigger:
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PASSENGER_COUNT_MISMATCH (409)"

      - name: corner_hotel_block_insufficient_on_confirm
        claim_type: Aggregate validation
        grounds:
          - validations[priority=15]
          - errors[ERR_HOTEL_BLOCK_INSUFFICIENT]
        distinguishing_aspect: "Confirming a booking needing 1 room against a room_count-0 hotel block returns ERR_HOTEL_BLOCK_INSUFFICIENT."
        test_recipe:
          setup: ["Departure OPEN, coach assigned; hotel block room_count 0; booking pax 2 rooms_requested 1 with 2 passengers."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "HbTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "HbC", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Hb Dep", start_date: "2026-08-01", end_date: "2026-08-02", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/hotel-blocks"
              payload: { departure_id: "${dep}", hotel_name: "Tiny Inn", city: "DC", room_count: 0, nights: 1, rate_per_room_night_cents: 12000 }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Hb Party", pax_count: 2, rooms_requested: 1 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "H1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "H2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
          trigger:
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_HOTEL_BLOCK_INSUFFICIENT (409)"

      - name: corner_deposit_unpaid_on_confirm
        claim_type: Violation → Error
        grounds:
          - validations[priority=19]
          - errors[ERR_DEPOSIT_UNPAID]
        distinguishing_aspect: "Confirming a booking on an OPEN departure with matching passengers but no deposit returns ERR_DEPOSIT_UNPAID (402)."
        test_recipe:
          setup: ["Departure OPEN, coach assigned; booking pax 2 with 2 passengers, NO payment."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "DuTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "DuC", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Du Dep", start_date: "2026-08-01", end_date: "2026-08-02", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Du Party", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "U1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "U2" }
              as: SalesAgent
          trigger:
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEPOSIT_UNPAID (402)"

      - name: corner_depart_missing_crew_returns_not_assigned
        claim_type: Violation → Error
        grounds:
          - validations[priority=16]
          - errors[ERR_DEPARTURE_NOT_ASSIGNED]
        distinguishing_aspect: "Departing a GUARANTEED departure that has a coach but no driver/guide returns ERR_DEPARTURE_NOT_ASSIGNED."
        test_recipe:
          setup: ["Departure GUARANTEED with only a coach assigned (no driver/guide)."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "NaTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "NaC", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Na Dep", start_date: "2026-08-01", end_date: "2026-08-02", guaranteed_min_pax: 2, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Na Party", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "Na1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "Na2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /api/departures/${dep}/depart"
              payload: {}
              as: OpsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEPARTURE_NOT_ASSIGNED (409)"

      - name: corner_settle_balance_unpaid_returns_402
        claim_type: Violation → Error
        grounds:
          - validations[priority=20]
          - errors[ERR_BALANCE_UNPAID]
        distinguishing_aspect: "Settling a departed departure whose TRAVELED booking paid only the deposit returns ERR_BALANCE_UNPAID (402)."
        test_recipe:
          setup: ["Departure DEPARTED; its TRAVELED booking paid only deposit (40000 of 257400)."]
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "BuTP", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "BuC", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/drivers"
              payload: { name: "BuDrv", license_no: "CDLB", day_rate_cents: 40000 }
              as: OpsManager
