            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "PROCESS" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "SETTLE_FAILURE", failure_reason: "f1" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "RETRY" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "PROCESS" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "SETTLE_FAILURE", failure_reason: "f2" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "RETRY" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "PROCESS" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "SETTLE_FAILURE", failure_reason: "f3" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "RETRY" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/payouts/${p_id}/transition"
