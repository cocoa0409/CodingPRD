        distinguishing_aspect: "Lazy expiry with a durable side effect on a rejected request: the 409 response is accompanied by a persisted status change, so a follow-up GET observes AUTH_EXPIRED rather than AUTHORIZED, and the expired case then re-enters the payer loop with revision_round reset to 0, authorized_device_count reset to 0 and auth_expires_at cleared."
