# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Makerspace & Fab-Lab — Expert
# 9 rule_ids x 2 instances = 18 instances. Every grounds[] ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Logical clock default: 2026-04-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_charge_estimate_vs_final_on_reservation
        grounds:
          - calculations.session_charge
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Reservation.CHECKED_IN_to_COMPLETED
          - entities.Reservation.fields.estimate_charge_cents
          - entities.Reservation.fields.final_charge_cents
        distinguishing_aspect: |
          On a Reservation, the FORWARD estimate (reserved 90 min) yields
          estimate_charge_cents == 6980 while the FINAL actual (45 min used)
          yields final_charge_cents == 3740 — same machine, two algorithms,
          different cents; the subject entity is Reservation (machine-time domain).
        test_recipe:
          setup:
            - "FacilityAdmin creates MAKER monthly tier (discount_bps=1000, prepaid 0)."
            - "Member registered on MAKER, waiver signed, activated, wallet topped to 10000c."
            - "LASER machine: hourly 4800, setup 500, min_billing 30, cooldown 15, requires_certification true."
            - "ACTIVE LASER certification on the member; SUPERVISED reservation 10:00–11:30 (90 reserved min) confirmed."
            - "Clock advanced into the window; check-in at 10:05, check-out at 10:50 (45 actual min)."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "POST /members/${m1}/topup"
              payload: { amount_cents: 10000 }
              as: Member
              as_user_id: "${m1}"
            - call: "POST /members/${m1}/activate"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { m1_v_after_act: $.data.version }
            - call: "POST /machines"
              payload: { name: "Laser A", machine_class: "LASER", hourly_rate_cents: 4800, setup_fee_cents: 500, min_billing_minutes: 30, cooldown_minutes: 15, requires_certification: true }
              as: FacilityAdmin
              captures: { laser_a: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${m1}", machine_class: "LASER", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${m1}"
              captures: { cert_laser: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${m1}", machine_id: "${laser_a}", certification_id: "${cert_laser}", start_at: "2026-04-10T10:00:00Z", end_at: "2026-04-10T11:30:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${m1}"
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: { expected_member_version: "${m1_v_after_act}" }
              as: Member
              as_user_id: "${m1}"
              captures: { res1_est: $.data.estimate_charge_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T10:05:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res1}/check-in"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T10:50:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /reservations/${res1}/check-out"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { res1_final: $.data.final_charge_cents }
          assert:
            - "Reservation.${res1}.estimate_charge_cents == 6980"
            - "Reservation.${res1}.final_charge_cents == 3740"
            - "Reservation.${res1}.estimate_charge_cents != Reservation.${res1}.final_charge_cents"
            - "Reservation.${res1}.billing_status == SETTLED"

      - name: membership_proration_forward_vs_chronological_on_member
        grounds:
          - calculations.membership_proration
          - state_machines.Member.PENDING_WAIVER_to_ACTIVE
          - state_machines.Member.ACTIVE_to_CANCELLED
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          On a Member (subscription-fee domain, NOT machine time), FORWARD debits
          the full 8000c monthly fee at activation while CHRONOLOGICAL at cancel
          after 12 elapsed days accrues only 3200c and refunds 4800c — a different
          entity domain and a different conserved metric than session_charge.
        test_recipe:
          setup:
            - "FacilityAdmin creates MAKER monthly tier (monthly_fee 8000)."
            - "Member registered, waiver signed, wallet topped 10000c, activated at clock 2026-04-01 (cycle opens)."
            - "Clock advanced to 2026-04-13 (12 whole elapsed days)."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 8000, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M Two", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { m2: $.data.id }
            - call: "POST /members/${m2}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /members/${m2}/topup"
              payload: { amount_cents: 10000 }
              as: Member
              as_user_id: "${m2}"
            - call: "POST /members/${m2}/activate"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { m2_wallet_after_act: $.data.wallet_credit_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-13T00:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /members/${m2}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { m2_wallet_after_cancel: $.data.wallet_credit_cents }
          assert:
            - "Member.${m2}.wallet_credit_cents == 2000 immediately after activate (10000 - 8000 forward)"
            - "Member.${m2}.wallet_credit_cents == 6800 after cancel (2000 + 4800 chronological refund)"
            - "Member.${m2}.subscription_status == CANCELLED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: session_charge_nonlinear_min_prepaid_discount
        grounds:
          - calculations.session_charge
          - entities.Machine.fields.min_billing_minutes
          - entities.MembershipTier.fields.prepaid_machine_minutes
          - state_machines.Reservation.HELD_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a): session_charge nests max(min_billing) then min(prepaid block)
          then tiered discount — 3 interacting inputs. PRO tier prepaid 60 + CNC
          min_billing 60 + 20% discount on a 120-min reserve yields exactly 8700c
          (charged 60 min only).
        test_recipe:
          setup:
            - "FacilityAdmin creates PRO monthly tier (discount_bps=2000, prepaid_machine_minutes=60)."
            - "Member on PRO, waiver, activated, wallet 20000c."
            - "CNC machine: hourly 9000, setup 1500, min_billing 60, cooldown 30, requires_certification true."
            - "ACTIVE CNC certification; SUPERVISED reservation 120 reserved min, then confirm."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "PRO", name: "Pro", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 2000, prepaid_machine_minutes: 60, locker_free_liters: 100, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_pro: $.data.id }
            - call: "POST /members"
              payload: { email: "m3@x.com", full_name: "M Three", tier_id: "${tier_pro}" }
              as: FacilityAdmin
              captures: { m3: $.data.id }
            - call: "POST /members/${m3}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m3}"
            - call: "POST /members/${m3}/topup"
              payload: { amount_cents: 20000 }
              as: Member
              as_user_id: "${m3}"
            - call: "POST /members/${m3}/activate"
              payload: {}
              as: Member
              as_user_id: "${m3}"
              captures: { m3_v: $.data.version }
            - call: "POST /machines"
              payload: { name: "CNC A", machine_class: "CNC", hourly_rate_cents: 9000, setup_fee_cents: 1500, min_billing_minutes: 60, cooldown_minutes: 30, requires_certification: true }
              as: FacilityAdmin
              captures: { cnc_a: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${m3}", machine_class: "CNC", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${m3}"
              captures: { cert_cnc: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${m3}", machine_id: "${cnc_a}", certification_id: "${cert_cnc}", start_at: "2026-04-10T09:00:00Z", end_at: "2026-04-10T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${m3}"
              captures: { res3: $.data.id }
          trigger:
            - call: "POST /reservations/${res3}/confirm"
              payload: { expected_member_version: "${m3_v}" }
              as: Member
              as_user_id: "${m3}"
              captures: { res3_est: $.data.estimate_charge_cents, res3_free: $.data.free_minutes_applied }
          assert:
            - "Reservation.${res3}.estimate_charge_cents == 8700"
            - "Reservation.${res3}.free_minutes_applied == 60"
            - "Member.${m3}.prepaid_minutes_remaining == 0 after confirm (60 prepaid consumed)"

      - name: material_billing_nested_rounding_order
        grounds:
          - calculations.material_billing
          - state_machines.MaterialPurchase.DRAFT_to_BILLED
          - entities.MaterialPurchase.fields.subtotal_cents
          - entities.MaterialPurchase.fields.total_cents
        distinguishing_aspect: |
          Mode (b): material_billing pins round-per-line-then-sum-then-surcharge.
          Three lines [3x133, 2x167, 5x99] at 10% discount round to [359,301,446]
          → subtotal 1106; sum-then-round would give 1105. Pinned total == 1161.
        test_recipe:
          setup:
            - "FacilityAdmin creates MAKER tier (discount_bps=1000) and three material items."
            - "Member on MAKER, activated, wallet topped to 5000c."
            - "DRAFT MaterialPurchase with lines [acrylic x3 @133, filament x2 @167, screws x5 @99], waste_surcharge_bps=500."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "m4@x.com", full_name: "M Four", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { m4: $.data.id }
            - call: "POST /members/${m4}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m4}"
            - call: "POST /members/${m4}/topup"
              payload: { amount_cents: 5000 }
              as: Member
              as_user_id: "${m4}"
            - call: "POST /members/${m4}/activate"
              payload: {}
              as: Member
              as_user_id: "${m4}"
            - call: "POST /material-items"
              payload: { sku: "ACR1", name: "Acrylic", unit_price_cents: 133, stock_qty: 100 }
              as: FacilityAdmin
              captures: { item_acr: $.data.id }
            - call: "POST /material-items"
              payload: { sku: "FIL1", name: "Filament", unit_price_cents: 167, stock_qty: 100 }
              as: FacilityAdmin
              captures: { item_fil: $.data.id }
            - call: "POST /material-items"
              payload: { sku: "SCR1", name: "Screws", unit_price_cents: 99, stock_qty: 100 }
              as: FacilityAdmin
              captures: { item_scr: $.data.id }
            - call: "POST /material-purchases"
              payload: { member_id: "${m4}", lines: [ { material_item_id: "${item_acr}", quantity: 3 }, { material_item_id: "${item_fil}", quantity: 2 }, { material_item_id: "${item_scr}", quantity: 5 } ], waste_surcharge_bps: 500 }
              as: Member
              as_user_id: "${m4}"
              captures: { mp4: $.data.id }
          trigger:
            - call: "POST /material-purchases/${mp4}/bill"
              payload: {}
              as: Member
              as_user_id: "${m4}"
              captures: { mp4_total: $.data.total_cents }
          assert:
            - "MaterialPurchase.${mp4}.subtotal_cents == 1106"
            - "MaterialPurchase.${mp4}.surcharge_cents == 55"
            - "MaterialPurchase.${mp4}.total_cents == 1161"
            - "MaterialPurchase.${mp4}.status == BILLED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_parallel_occupancy_x_billing_dimensions
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_HELD
          - entities.Reservation.fields.occupancy_status
          - entities.Reservation.fields.billing_status
        distinguishing_aspect: |
          Reservation carries two parallel state axes: occupancy_status and
          billing_status evolve independently — confirm moves occupancy HELD→CONFIRMED
          AND billing UNBILLED→HOLD_PLACED; release-hold moves occupancy back to HELD
          while billing returns to UNBILLED. Two independent dimensions on one entity.
        test_recipe:
          setup:
            - "MAKER member activated wallet 10000; LASER machine; ACTIVE laser cert; reservation 60 reserved min HELD."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "m5@x.com", full_name: "M Five", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { m5: $.data.id }
            - call: "POST /members/${m5}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m5}"
            - call: "POST /members/${m5}/topup"
              payload: { amount_cents: 10000 }
              as: Member
              as_user_id: "${m5}"
            - call: "POST /members/${m5}/activate"
              payload: {}
              as: Member
              as_user_id: "${m5}"
              captures: { m5_v: $.data.version }
            - call: "POST /machines"
              payload: { name: "Laser B", machine_class: "LASER", hourly_rate_cents: 4800, setup_fee_cents: 500, min_billing_minutes: 30, cooldown_minutes: 15, requires_certification: true }
              as: FacilityAdmin
              captures: { laser_b: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${m5}", machine_class: "LASER", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${m5}"
              captures: { cert_l5: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${m5}", machine_id: "${laser_b}", certification_id: "${cert_l5}", start_at: "2026-04-15T10:00:00Z", end_at: "2026-04-15T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${m5}"
              captures: { res5: $.data.id }
            - call: "POST /reservations/${res5}/confirm"
              payload: { expected_member_version: "${m5_v}" }
              as: Member
              as_user_id: "${m5}"
          trigger:
            - call: "POST /reservations/${res5}/release-hold"
              payload: {}
              as: Member
              as_user_id: "${m5}"
          assert:
            - "Reservation.${res5}.occupancy_status == HELD after release-hold"
            - "Reservation.${res5}.billing_status == UNBILLED after release-hold"
            - "Member.${m5}.wallet_credit_cents == 10000 after release-hold (4820 estimate refunded)"

      - name: certification_cyclic_active_expired_active_loop
        grounds:
          - state_machines.Certification.ACTIVE_to_EXPIRED
          - state_machines.Certification.EXPIRED_to_ACTIVE
          - entities.Certification.fields.status
          - entities.Certification.fields.expires_at
        distinguishing_aspect: |
          Certification is cyclic: ACTIVE→EXPIRED (clock past expires_at)→ACTIVE
          (renew resets expires_at to now+365d) — a revision loop on a different
          entity than Reservation. Renew returns status to ACTIVE and advances expiry.
        test_recipe:
          setup:
            - "A member with an ACTIVE LASER certification granted at clock 2026-04-01 (expires 2027-04-01)."
            - "Clock advanced past expiry to 2027-05-01, then refresh-expiry lapses it to EXPIRED."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "m6@x.com", full_name: "M Six", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { m6: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${m6}", machine_class: "LASER", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${m6}"
              captures: { cert6: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /certifications/${cert6}/refresh-expiry"
              payload: {}
              as: StaffInstructor
              as_user_id: "${m6}"
          trigger:
            - call: "POST /certifications/${cert6}/renew"
              payload: {}
              as: StaffInstructor
              as_user_id: "${m6}"
              captures: { cert6_status: $.data.status }
          assert:
            - "Certification.${cert6}.status == EXPIRED immediately after refresh-expiry"
            - "Certification.${cert6}.status == ACTIVE after renew"
            - "Certification.${cert6}.expires_at == 2028-04-30T00:00:00.000Z after renew (now 2027-05-01 + 365 days; 2028 leap year)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: member_suspend_cancels_reservation_refunds_wallet_depth3
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.HELD_to_CONFIRMED
          - entities.Member.fields.wallet_credit_cents
          - entities.WalletEntry.fields.kind
        distinguishing_aspect: |
          Depth-3 chain originating at Member suspend: suspend(A=Member) →
          Reservation occupancy → CANCELLED (B) → that cancel refunds the wallet
          hold and appends a WalletEntry kind=REFUND (C). Each link is caused by
          the previous, not by the original suspend directly.
        test_recipe:
          setup:
            - "MAKER member activated wallet 10000; LASER machine; ACTIVE laser cert; reservation 60 min CONFIRMED (hold 4820)."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "m7@x.com", full_name: "M Seven", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { m7: $.data.id }
            - call: "POST /members/${m7}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m7}"
            - call: "POST /members/${m7}/topup"
              payload: { amount_cents: 10000 }
              as: Member
              as_user_id: "${m7}"
            - call: "POST /members/${m7}/activate"
              payload: {}
              as: Member
              as_user_id: "${m7}"
              captures: { m7_v: $.data.version }
            - call: "POST /machines"
              payload: { name: "Laser C", machine_class: "LASER", hourly_rate_cents: 4800, setup_fee_cents: 500, min_billing_minutes: 30, cooldown_minutes: 15, requires_certification: true }
              as: FacilityAdmin
              captures: { laser_c: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${m7}", machine_class: "LASER", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${m7}"
              captures: { cert7: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${m7}", machine_id: "${laser_c}", certification_id: "${cert7}", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${m7}"
              captures: { res7: $.data.id }
            - call: "POST /reservations/${res7}/confirm"
              payload: { expected_member_version: "${m7_v}" }
              as: Member
              as_user_id: "${m7}"
          trigger:
            - call: "POST /members/${m7}/suspend"
              payload: {}
              as: StaffInstructor
              as_user_id: "${m7}"
          assert:
            - "Member.${m7}.subscription_status == SUSPENDED"
            - "Reservation.${res7}.occupancy_status == CANCELLED"
            - "Reservation.${res7}.billing_status == REFUNDED"
            - "Member.${m7}.wallet_credit_cents == 10000 (4820 hold refunded by the cascaded cancel)"

      - name: workshop_complete_noshow_enrollment_depth2
        grounds:
          - state_machines.Workshop.RUNNING_to_COMPLETED
          - state_machines.WorkshopEnrollment.ENROLLED_to_NO_SHOW
          - entities.WorkshopEnrollment.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (workshop complete): completing a
          RUNNING workshop (A) auto-resolves every still-ENROLLED enrollment to
          NO_SHOW (B). Distinct origin transition from the suspend cascade.
        test_recipe:
          setup:
            - "A StaffInstructor member; a non-certifying workshop starting 2026-04-05 capacity 3; one member ENROLLED."
            - "Clock advanced to 2026-04-05; workshop started to RUNNING."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "inst1@x.com", full_name: "Inst One", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { inst1: $.data.id }
            - call: "POST /members"
              payload: { email: "stu1@x.com", full_name: "Stu One", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { stu1: $.data.id }
            - call: "POST /workshops"
              payload: { title: "Intro Safety", instructor_id: "${inst1}", starts_at: "2026-04-05T09:00:00Z", capacity: 3 }
              as: StaffInstructor
              as_user_id: "${inst1}"
