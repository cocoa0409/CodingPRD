      - name: routing_reports_body_scope_before_intake_pause
        claim_type: priority_ordering
        grounds:
          - validations[priority=21]
          - validations[priority=22]
          - errors[ERR_BODY_SCOPE_MISMATCH]
          - errors[ERR_BODY_INTAKE_PAUSED]
        distinguishing_aspect: |
          A PAUSED body whose scope_categories also exclude the case category violates both
          priority 21 and priority 22, and the response must be ERR_BODY_SCOPE_MISMATCH with
          HTTP 422 rather than the 409 pause error; routing to a correctly scoped but PAUSED
          body then isolates ERR_BODY_INTAKE_PAUSED, and only the accepting, correctly scoped
          body moves the case to ROUTED and increments its open_case_count to 1.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with member m_br"
            - "body_wrong has scope_categories [PHYSICAL_ABUSE] and intake_status PAUSED"
            - "body_paused has scope_categories [EMOTIONAL_MISCONDUCT] and intake_status PAUSED"
            - "body_ok has scope_categories [EMOTIONAL_MISCONDUCT] and intake_status ACCEPTING"
            - "case case_br has allegation_category EMOTIONAL_MISCONDUCT and is in INTAKE_REVIEW"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Bo Reid", email: "bo.reid@alpha.test", role_type: "ASSISTANT_COACH", has_minor_athlete_contact: true, date_of_birth: "1986-03-21", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_br_id: $.data.id }
            - call: "POST /safesport/investigating-bodies"
              payload: { name: "Physical Abuse Panel", scope_categories: ["PHYSICAL_ABUSE"], max_open_cases: 5, intake_status: "PAUSED" }
              as: NgbAdmin
              captures: { body_wrong_id: $.data.id }
            - call: "POST /safesport/investigating-bodies"
              payload: { name: "Conduct Panel East", scope_categories: ["EMOTIONAL_MISCONDUCT"], max_open_cases: 5, intake_status: "PAUSED" }
              as: NgbAdmin
              captures: { body_paused_id: $.data.id }
            - call: "POST /safesport/investigating-bodies"
              payload: { name: "Conduct Panel West", scope_categories: ["EMOTIONAL_MISCONDUCT"], max_open_cases: 5, intake_status: "ACCEPTING" }
              as: NgbAdmin
              captures: { body_ok_id: $.data.id }
            - call: "POST /safesport/cases"
              payload: { club_id: "${club_a_id}", reported_member_id: "${m_br_id}", allegation_category: "EMOTIONAL_MISCONDUCT", reporter_kind: "MANDATORY_REPORTER", narrative: "raised voice and belittling remarks at practice", occurred_at: "2026-07-31T23:00:00Z" }
              as: SafeSportOfficer
              as_user_id: "so_intake"
              captures: { case_br_id: $.data.id }
          trigger:
            - call: "POST /safesport/cases/${case_br_id}/route"
              payload: { investigating_body_id: "${body_wrong_id}" }
              as: SafeSportOfficer
              as_user_id: "so_intake"
              captures: { br_scope_error: $.data.error_id }
            - call: "POST /safesport/cases/${case_br_id}/route"
              payload: { investigating_body_id: "${body_paused_id}" }
              as: SafeSportOfficer
              as_user_id: "so_intake"
              captures: { br_pause_error: $.data.error_id }
            - call: "POST /safesport/cases/${case_br_id}/route"
              payload: { investigating_body_id: "${body_ok_id}" }
              as: SafeSportOfficer
              as_user_id: "so_intake"
              captures: { br_status: $.data.status, br_body: $.data.investigating_body_id, br_routed_at: $.data.routed_at }
            - call: "GET /safesport/investigating-bodies/${body_ok_id}"
              payload: {}
              as: NgbAdmin
              captures: { br_ok_count: $.data.open_case_count }
          assert:
            - "${br_scope_error} == ERR_BODY_SCOPE_MISMATCH"
            - "HTTP status is 422 on the wrongly scoped, paused body"
            - "${br_pause_error} == ERR_BODY_INTAKE_PAUSED"
            - "HTTP status is 409 on the correctly scoped, paused body"
            - "${br_status} == ROUTED"
            - "${br_body} == ${body_ok_id}"
            - "${br_routed_at} == 2026-08-01T00:00:00.000Z"
            - "${br_ok_count} == 1"
            - "InvestigatingBody.${body_wrong_id}.open_case_count == 0"
            - "InvestigatingBody.${body_paused_id}.open_case_count == 0"
