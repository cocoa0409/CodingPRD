  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_requires_room_available_pair_stayrequest_room
        grounds:
          - state_machines.StayRequest.WAITLISTED_to_OFFERED
          - errors.ERR_ROOM_NOT_AVAILABLE
        distinguishing_aspect: |
          Entity pair StayRequest -> Room: the WAITLISTED -> OFFERED transition
          is gated on the target Room's status/occupation — a room in
          MAINTENANCE (not occupied, simply not AVAILABLE) rejects the offer
          with ERR_ROOM_NOT_AVAILABLE while the same offer against an AVAILABLE
          room succeeds.
        test_recipe:
          setup:
            - "House with room R1 AVAILABLE and room R2 in MAINTENANCE. Verified, waitlisted request S."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
