  # =========================================================================
  # Section: endpoints — listing, pagination, idempotency happy path
  # =========================================================================
  - section: endpoints
    instances:

      - name: idempotent_topup_returns_original_entry_on_replay
        claim_type: idempotent_replay
        grounds: ["endpoints.POST./school-meals/parent-accounts/{id}/topup", "validations[priority=11]"]
        distinguishing_aspect: "Replaying TOPUP with SAME idempotency_key AND SAME amount_cents returns the ORIGINAL LedgerEntry id (200) — no new ledger row, balance unchanged."
        test_recipe:
          setup:
            - "Fresh ParentAccount."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Idem", family_size: 2, annual_income_cents: 3000000, address_state: "CA" }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/parent-accounts/${hh_id}/topup"
              payload: { amount_cents: 5000, idempotency_key: "idem-1" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { entry1_id: $.data.id }
          trigger:
            - call: "POST /school-meals/parent-accounts/${hh_id}/topup"
              payload: { amount_cents: 5000, idempotency_key: "idem-1" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { entry2_id: $.data.id }
            - call: "GET /school-meals/parent-accounts/${hh_id}"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
              captures: { bal: $.data.balance_cents }
          assert:
            - "Second response data.id == ${entry1_id}  # same LedgerEntry returned (idempotent)"
            - "ParentAccount.${hh_id}.balance_cents == 5000  # NOT 10000; only one ledger row exists"

      - name: listing_pagination_meta_fields_present
        claim_type: pagination
        grounds: ["endpoints.GET./school-meals/households", "response_envelope"]
        distinguishing_aspect: "GET list endpoints return pagination meta (limit, offset, total_count, has_more) in addition to the data array."
        test_recipe:
          setup:
            - "Create 3 households."
          setup_api_calls:
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "A", family_size: 1, annual_income_cents: 1000000, address_state: "CA" }
              as: SchoolStaff
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "B", family_size: 2, annual_income_cents: 2000000, address_state: "CA" }
              as: SchoolStaff
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "C", family_size: 3, annual_income_cents: 3000000, address_state: "CA" }
              as: SchoolStaff
          trigger:
            - call: "GET /school-meals/households"
              payload: { limit: 2, offset: 0 }
              as: SchoolStaff
              captures: { total: $.data }
          assert:
            - "Response data array length == 2 (limit=2)"
            - "Response has total_count == 3 in pagination meta"
            - "Response has has_more == true (3 > 0+2)"

      - name: filtered_list_eligibility_by_household_returns_only_that_household
        claim_type: listing
        grounds: ["endpoints.GET./school-meals/households/{id}/eligibility-determinations"]
        distinguishing_aspect: "GET /households/{id}/eligibility-determinations returns only determinations whose household_id matches the path id (FK reverse-reachability)."
        test_recipe:
          setup:
            - "Two households A and B, each with one ACTIVE EligibilityDetermination."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Fil-A", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_a_id: $.data.id }
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Fil-B", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_b_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_a_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-06-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
              captures: { elig_a_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_b_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-06-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
              captures: { elig_b_id: $.data.id }
          trigger:
            - call: "GET /school-meals/households/${hh_a_id}/eligibility-determinations"
              payload: {}
              as: SchoolStaff
              captures: { resp: $.data }
          assert:
            - "Response data is an array containing exactly 1 element: id == ${elig_a_id}"

      - name: ledger_filter_by_linked_transaction_id_returns_pair
        claim_type: listing
        grounds: ["endpoints.GET./school-meals/ledger-entries", "entities.LedgerEntry.fields.linked_transaction_id"]
        distinguishing_aspect: "GET /ledger-entries?linked_transaction_id=<tx_id> returns the ledger entries (MEAL_CHARGE then MEAL_REFUND) for that transaction (FK reverse-reachability for LedgerEntry.linked_transaction_id)."
        test_recipe:
          setup:
            - "PAID-tier 300c transaction TX, SETTLED then REFUNDED. Expect 2 ledger entries linked to TX."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-26T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "LF", family_size: 4, annual_income_cents: 8000000, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "LF kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_id: $.data.id }
            - call: "POST /school-meals/applications/${app_id}/submit"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/applications/${app_id}/start-review"
              payload: {}
              as: DistrictReviewer
            - call: "POST /school-meals/applications/${app_id}/approve"
              payload: { decision_reason: "PAID" }
              as: DistrictReviewer
            - call: "POST /school-meals/parent-accounts/${hh_id}/topup"
              payload: { amount_cents: 1000, idempotency_key: "lf-1" }
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Burger", list_price_cents: 300, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: [], calories: 400 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx_id: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx_id}/settle"
              payload: {}
              as: SchoolStaff
              captures: { tx_v: $.data.version }
            - call: "POST /school-meals/service-transactions/${tx_id}/refund"
              payload: { expected_servicetransaction_version: "${tx_v}" }
              as: SchoolStaff
          trigger:
            - call: "GET /school-meals/ledger-entries"
              payload: { linked_transaction_id: "${tx_id}" }
              as: SchoolStaff
              captures: { resp: $.data }
          assert:
            - "Response data array length == 2  # MEAL_CHARGE then MEAL_REFUND for tx_id"
            - "All returned entries have linked_transaction_id == ${tx_id}"

      - name: auto_renewal_creates_new_determinations_for_returning_households
        claim_type: scheduled_action
        grounds: ["endpoints.POST./school-meals/_renewal/run_auto_renewal", "entities.EligibilityDetermination.fields.source"]
        distinguishing_aspect: |
          POST /_renewal/run_auto_renewal sweeps households with prior
          ACTIVE/SUPERSEDED eligibility and no DENIED app in the new school
          year, creating an AUTO_RENEWAL-sourced determination carrying the
          prior tier.
        test_recipe:
          setup:
            - "Household H had ACTIVE FREE determination for SY 2025-2026 valid_to_utc=2026-06-30T00:00:00.000Z; now SY 2026-2027 begins on 2026-08-01."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Ren", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-01-01T00:00:00.000Z", valid_to_utc: "2026-06-30T00:00:00.000Z" }
              as: SchoolStaff
              captures: { elig_prior_id: $.data.id }
            # Expire the prior at end of SY
            - call: "POST /school-meals/_clock/advance_and_expire"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /school-meals/_renewal/run_auto_renewal"
              payload: { school_year: "2026-2027", valid_from_utc: "2026-08-01T00:00:00.000Z", valid_to_utc: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { renewed_count: $.data.renewed_count }
            - call: "GET /school-meals/households/${hh_id}/eligibility-determinations"
              payload: { lifecycle_status: "ACTIVE" }
              as: SchoolStaff
              captures: { active_list: $.data }
          assert:
            - "renewed_count >= 1"
            - "GET /households/${hh_id}/eligibility-determinations?lifecycle_status=ACTIVE returns at least one determination with source == AUTO_RENEWAL and tier == FREE (carried forward)"

