            - "$.data.error_id == ERR_FUND_EXCEEDED"
            - "DistributionBatch.${batch_id}.planned_total_cents == 400"
            - "Settlement.${s_id}.allocated_cents == 0 (unchanged by the rejected post)"

      - name: cy_pres_exact_partition_collision_at_reconcile
        grounds:
          - validations[priority=16]
          - errors[ERR_CY_PRES_SHARES_UNBALANCED]
          - entities.CyPresDesignation.fields.share_bps
          - calculations.cy_pres_sweep
        distinguishing_aspect: |
          Interval semantics B (exact-partition occupation on the cy pres
          allocation resource, a DIFFERENT resource from the fund): APPROVED
          designations must tile the [0,10000] bps interval EXACTLY; a set summing
          to 9000 (under-tiling) collides at sweep with ERR_CY_PRES_SHARES_UNBALANCED.
          This is exact-partition geometry, distinct from the fund's over-cap sum.
        test_recipe:
          setup:
            - "DISTRIBUTING TIERED settlement net=560000, cy_pres_floor=20000, residual 10000 after a POSTED batch, but APPROVED cy pres shares sum to only 9000 bps."
