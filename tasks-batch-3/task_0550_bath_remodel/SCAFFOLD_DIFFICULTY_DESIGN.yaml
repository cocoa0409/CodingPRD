      - name: referral_credit_conserved_after_reward_then_void
        grounds:
          - state_machines.Referral.REGISTERED_to_REWARDED
          - state_machines.Referral.REWARDED_to_VOID
          - entities.Customer.fields.referral_credit_cents
        distinguishing_aspect: >
          A STANDARD referral rewards the referrer 50000 at the referred project's SOLD;
          voiding the referral reverses exactly 50000, returning referral_credit_cents to 0 —
          the referral-credit conserved quantity (money) is preserved, distinct from the
          crew-slot count invariant.
        test_recipe:
          setup:
            - "A referrer with 50000 referral credit from a REWARDED STANDARD referral (referred project SOLD)"
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dana D", email: "dana18@x.com", region_state_code: "CA" }
