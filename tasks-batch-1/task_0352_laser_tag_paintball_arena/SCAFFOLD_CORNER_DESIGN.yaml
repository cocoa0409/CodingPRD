# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Laser Tag & Paintball Arena — breadth probe over every testable §1.1-§1.7 claim
# not already covered by §1.8. Same seven-point per-instance contract as §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_arena_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Arena, endpoints]
        distinguishing_aspect: "POST /arenas with name + pool totals returns 201, status OPEN, version 1, server-minted id, and zero available counts."
        test_recipe:
          setup: ["No arenas exist"]
          setup_api_calls: []
          trigger:
            - call: "POST /arenas"
              payload: { name: "Corner Arena", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Arena.${arena_id}.status == OPEN"
            - "Arena.${arena_id}.version == 1"
            - "Arena.${arena_id}.marker_available_count == 0"
            - "Arena.${arena_id}.deposit_held_cents == 0"

      - name: create_field_missing_game_mode_returns_validation
        claim_type: Required Fields
        grounds: [entities.Field.fields.game_mode, "validations[priority=4]"]
        distinguishing_aspect: "POST /fields without game_mode (required, no default) returns ERR_VALIDATION 400."
        test_recipe:
          setup: ["Arena exists"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CA2", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
          trigger:
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "NoMode", capacity_max: 8 }
              as: ArenaManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_field_invalid_game_mode_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Field.fields.game_mode, "validations[priority=4]"]
        distinguishing_aspect: "POST /fields with game_mode 'AIRSOFT' (outside {LASER_TAG,PAINTBALL}) returns ERR_VALIDATION 400."
        test_recipe:
          setup: ["Arena exists"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CA3", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
          trigger:
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "BadMode", game_mode: "AIRSOFT", capacity_max: 8 }
              as: ArenaManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: turnaround_minutes_defaults_to_zero_when_omitted
        claim_type: Defaults
        grounds: [entities.Field.fields.turnaround_minutes]
        distinguishing_aspect: "POST /fields omitting turnaround_minutes yields default 0."
        test_recipe:
          setup: ["Arena exists"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CA4", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
          trigger:
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "DefBuf", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id }
          assert:
            - "Field.${field_id}.turnaround_minutes == 0"

      - name: waiver_age_and_is_minor_computed_from_clock
        claim_type: Computed Fields
        grounds: [entities.WaiverProfile.fields.age_years, entities.WaiverProfile.fields.is_minor, calculations.referee_required]
        distinguishing_aspect: "WaiverProfile with DOB 2010-01-01 at clock 2026-06-15 computes age_years 16, is_minor true; input age fields ignored."
        test_recipe:
          setup: ["Arena clock 2026-06-15T09:00:00Z; field; HELD booking"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CA5", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F5c", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /waiver-profiles"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", participant_name: "Teen", date_of_birth: "2010-01-01T00:00:00Z", guardian_name: "Parent" }
              as: FrontDesk
              captures: { waiver_id: $.data.id }
          assert:
            - "WaiverProfile.${waiver_id}.age_years == 16"
            - "WaiverProfile.${waiver_id}.is_minor == true"

      - name: get_arena_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Arena, "errors[ERR_ARENA_NOT_FOUND]"]
        distinguishing_aspect: "GET /arenas/{random-uuid} returns ERR_ARENA_NOT_FOUND 404."
        test_recipe:
          setup: ["No arena with the queried id"]
          setup_api_calls: []
          trigger:
            - call: "GET /arenas/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ArenaManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ARENA_NOT_FOUND"

      - name: list_bookings_paginated_envelope
        claim_type: Listing
        grounds: [entities.Booking, endpoints]
        distinguishing_aspect: "GET /bookings returns an array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Arena + field + one HELD booking exist"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CA6", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F6c", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
          trigger:
            - call: "GET /bookings"
              payload: {}
              as: FrontDesk
          assert:
            - "response.response_type == array"
            - "response.meta.total_count >= 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_booking_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.HELD_to_CONFIRMED, "errors[ERR_BOOKING_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a booking already CONFIRMED (not HELD) returns ERR_BOOKING_INVALID_STATE 409; idempotent re-confirm rejected."
        test_recipe:
          setup: ["Arena; field; WALK_IN booking CONFIRMED"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CB1", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "Fb1", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
              captures: { field_v1: $.data.field_fee_cents }
          trigger:
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BOOKING_INVALID_STATE"

      - name: cancel_completed_booking_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Booking, "errors[ERR_BOOKING_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED booking (terminal) returns ERR_BOOKING_INVALID_STATE 409; no transition out of a terminal state."
        test_recipe:
          setup: ["Arena; LASER_TAG field; WALK_IN booking party 4 driven to COMPLETED (no rentals, no referee needed)"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CB2", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "Fb2", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
            - call: "POST /bookings/${booking_id}/check-in"
              payload: { checked_in_count: 4 }
              as: FieldMarshal
            - call: "POST /bookings/${booking_id}/complete"
              payload: {}
              as: FieldMarshal
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BOOKING_INVALID_STATE"

      - name: restore_equipment_not_in_maintenance_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.EquipmentUnit.MAINTENANCE_to_AVAILABLE, "errors[ERR_EQUIPMENT_INVALID_STATE]"]
        distinguishing_aspect: "Restoring an AVAILABLE (not MAINTENANCE) equipment unit returns ERR_EQUIPMENT_INVALID_STATE 409."
        test_recipe:
          setup: ["Arena; one AVAILABLE marker"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CB3", marker_pool_total: 1, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { arena_id: "${arena_id}", unit_type: "MARKER", asset_tag: "M-b3", deposit_cents: 2000 }
              as: ArenaManager
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /equipment-units/${unit_id}/restore"
              payload: {}
              as: ArenaManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EQUIPMENT_INVALID_STATE"

      - name: lock_round_with_scheduled_match_returns_round_not_complete
        claim_type: Precondition Enforcement
        grounds: [state_machines.League.OPEN_to_ROUND_LOCKED, "errors[ERR_ROUND_NOT_COMPLETE]"]
        distinguishing_aspect: "lock-round while a match in current_round is still SCHEDULED returns ERR_ROUND_NOT_COMPLETE 409."
        test_recipe:
          setup: ["Arena; field; League OPEN round 1; one SCHEDULED match on a CONFIRMED booking"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CB4", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "Fb4", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
            - call: "POST /leagues"
              payload: { arena_id: "${arena_id}", name: "Lb4", total_rounds: 2 }
              as: LeagueDirector
              captures: { league_id: $.data.id }
            - call: "POST /leagues/${league_id}/open"
              payload: {}
              as: LeagueDirector
              captures: { lv: $.data.version }
            - call: "POST /league-matches"
              payload: { arena_id: "${arena_id}", league_id: "${league_id}", booking_id: "${booking_id}", home_team: "A", away_team: "B" }
              as: LeagueDirector
          trigger:
            - call: "POST /leagues/${league_id}/lock-round"
              payload: { expected_league_version: "${lv}" }
              as: LeagueDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ROUND_NOT_COMPLETE"

      - name: finalize_before_last_round_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.League.ROUND_LOCKED_to_FINALIZED, "errors[ERR_LEAGUE_NOT_AT_FINAL_ROUND]"]
        distinguishing_aspect: "finalize while current_round (1) < total_rounds (2) returns ERR_LEAGUE_NOT_AT_FINAL_ROUND 409."
        test_recipe:
          setup: ["Arena; League total_rounds 2 OPEN round 1, round 1 locked (so ROUND_LOCKED at round 1)"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CB5", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /leagues"
              payload: { arena_id: "${arena_id}", name: "Lb5", total_rounds: 2 }
              as: LeagueDirector
              captures: { league_id: $.data.id }
            - call: "POST /leagues/${league_id}/open"
              payload: {}
              as: LeagueDirector
              captures: { lv: $.data.version }
            - call: "POST /leagues/${league_id}/lock-round"
              payload: { expected_league_version: "${lv}" }
              as: LeagueDirector
          trigger:
            - call: "POST /leagues/${league_id}/finalize"
              payload: {}
              as: LeagueDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LEAGUE_NOT_AT_FINAL_ROUND"

      - name: advance_round_at_limit_returns_round_limit_reached
        claim_type: Precondition Enforcement
        grounds: [state_machines.League.ROUND_LOCKED_to_OPEN, "errors[ERR_ROUND_LIMIT_REACHED]"]
        distinguishing_aspect: "advance-round when current_round == total_rounds (1==1) returns ERR_ROUND_LIMIT_REACHED 409."
        test_recipe:
          setup: ["Arena; League total_rounds 1 OPEN round 1, round 1 locked (ROUND_LOCKED at last round)"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CB6", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /leagues"
              payload: { arena_id: "${arena_id}", name: "Lb6", total_rounds: 1 }
              as: LeagueDirector
              captures: { league_id: $.data.id }
            - call: "POST /leagues/${league_id}/open"
              payload: {}
              as: LeagueDirector
              captures: { lv: $.data.version }
            - call: "POST /leagues/${league_id}/lock-round"
              payload: { expected_league_version: "${lv}" }
              as: LeagueDirector
              captures: { lv2: $.data.version }
          trigger:
            - call: "POST /leagues/${league_id}/advance-round"
              payload: { expected_league_version: "${lv2}" }
              as: LeagueDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ROUND_LIMIT_REACHED"

      - name: sign_minor_waiver_without_guardian_returns_minor_waiver_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.WaiverProfile.DRAFT_to_SIGNED, "validations[priority=7]", "errors[ERR_MINOR_WAIVER_REQUIRED]"]
        distinguishing_aspect: "Signing a minor's waiver that has no guardian_name returns ERR_MINOR_WAIVER_REQUIRED 422 at the sign step."
        test_recipe:
          setup: ["Arena clock set; field; HELD booking; DRAFT waiver for a minor with NO guardian_name"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CB7", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "Fb7", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /waiver-profiles"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", participant_name: "Minor", date_of_birth: "2015-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { waiver_id: $.data.id }
          trigger:
            - call: "POST /waiver-profiles/${waiver_id}/sign"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_MINOR_WAIVER_REQUIRED"

      - name: booking_initial_state_is_held
        claim_type: Initial State
        grounds: [state_machines.Booking, entities.Booking.fields.status]
        distinguishing_aspect: "A newly created booking starts in HELD (initial_state)."
        test_recipe:
          setup: ["Arena; field"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CB8", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "Fb8", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.status == HELD"

      - name: no_show_before_window_end_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.CONFIRMED_to_NO_SHOW, "errors[ERR_BOOKING_INVALID_STATE]"]
        distinguishing_aspect: "no-show while Arena.current_utc < window_end returns ERR_BOOKING_INVALID_STATE 409 (precondition clock >= window_end unmet)."
        test_recipe:
          setup: ["Arena clock 2026-06-15T09:30:00Z; field; WALK_IN booking 09:30-11:00 CONFIRMED; clock still inside window"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CB9", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:30:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "Fb9", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:30:00Z", window_end: "2026-06-15T11:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
          trigger:
            - call: "POST /bookings/${booking_id}/no-show"
              payload: {}
              as: FieldMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BOOKING_INVALID_STATE"

      - name: booking_branch_checkin_happy_path
        claim_type: Valid Transition
        grounds: [state_machines.Booking.CONFIRMED_to_CHECKED_IN]
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_branch_checkin_vs_noshow
          rationale: "The CHECKED_IN branch and its check-out side effects are exercised by the dual_variant and combinatorial §1.8 instances that drive bookings through CHECKED_IN; the NO_SHOW branch is the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: field_fee_zero_for_a_la_carte_booking
        claim_type: Correct Result
        grounds: [calculations.field_fee_cents, entities.Booking.fields.field_fee_cents]
        distinguishing_aspect: "A booking with package_id null has field_fee_cents 0 after confirm."
        test_recipe:
          setup: ["Arena; field; WALK_IN booking with no package CONFIRMED"]
          setup_api_calls:
            - call: "POST /arenas"
