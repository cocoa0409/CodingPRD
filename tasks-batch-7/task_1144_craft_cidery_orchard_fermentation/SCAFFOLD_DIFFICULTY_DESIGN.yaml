              payload: { code: "T-110", capacity_liters: 100, material: "STAINLESS", temperature_controlled: true }
              as: CellarLead
              captures: { t10: $.data.id }
            - call: "POST /cidery/yeast-programs"
              payload: { code: "Y10", kind: "CULTURED", attenuation_pct: 90, temp_min_f: 60, temp_max_f: 72, nutrient_required: false }
              as: CellarLead
              captures: { y10: $.data.id }
            - call: "POST /cidery/fermentation-batches"
