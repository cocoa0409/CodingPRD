        claim_type: immediate
        grounds: [complexity_profile.consistency_model, calculations.adjustment_payout]
        distinguishing_aspect: "Immediate consistency: the POST /api/pay-adjustments response already carries the computed provisional_estimate_cents (170000 for base 100000 at 0.20) and status PROPOSED in the same envelope."
        test_recipe:
          setup: ["SETUP production; MEDIUM/FIGHT DRAFT sequence; QUALIFIED performer"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 10000000 }
