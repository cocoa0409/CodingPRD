              as: FunderAdmin
              as_user_id: "${f_id}"
              captures: { rp_id: $.data.id }
          assert:
            - "FunderReport.${rp_id}.total_referrals == 3"
            - "FunderReport.${rp_id}.delivered_count == 2"
            - "FunderReport.${rp_id}.not_reached_count == 1"
            - "FunderReport.${rp_id}.closure_rate_percent == 66.7"
            - "FunderReport.${rp_id}.resolution_rate_percent == 100.0"
            - "closure_rate_percent != resolution_rate_percent for identical inputs (variant divergence on the report domain)"


  # ===================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_amount_circular_cap_evaluation_order
        grounds:
          - calculations.claim_amount_quote
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          the monthly cap depends on approved amounts, which depend on the cap;
          the scaffold pins gross-first / sum-prior-excluding-self / clamp.
          Two same-month claims of 200 units each against a 25000 cap:
          first approves at 20000, second clamps to remaining 5000 — if the
          second claim wrongly included its own gross in paid_this_month the
          residue would be 25000 - (20000+20000) < 0 => 0 instead of 5000.
        test_recipe:
          setup:
            - "Funder rate card: rate 100/unit, no tier, monthly_cap_cents 25000"
            - "Two referrals (clients K1, K2) completed with 200 DELIVERED units each, same calendar month (clock fixed)"
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
