      - name: the_two_defensive_funding_and_scope_invariants_hold_on_the_only_path_that_reaches_them
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=27]
          - validations[priority=24]
          - errors[ERR_FUNDING_PLAN_STALE]
          - errors[ERR_EASEMENT_SCOPE_MISMATCH]
          - state_machines.Application.funding_plan_status[OBLIGATED -> DISBURSED]
        distinguishing_aspect: "ERR_FUNDING_PLAN_STALE and ERR_EASEMENT_SCOPE_MISMATCH are the catalog's two defensive invariants and are unreachable through §1.5 by construction: acceptance is the single event that both obligates the plan and creates the closing requirements, so a CLEARED closing_status always implies funding_plan_status == OBLIGATED (and any release of commitments cancels the closing outright, driving closing_status to CANCELLED rather than leaving it CLEARED); and no endpoint accepts a program id or a parcel id for an existing easement, so Easement.parcel_id can never diverge from Application.parcel_id. This instance pins the passing side of both guards on the legal path and records that they must remain implemented as invariant checks."
        test_recipe:
          setup:
            - "Application AP1 has been accepted, cleared and closed at clock 2026-12-15, recording easement EA1."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
            - *k_offer_a
            - *k_get_app_a_v2
            - *k_plan_a
            - *k_clk_1012
            - *k_accept_a
            - *k_get_req_title
            - *k_get_req_sub
            - *k_get_req_survey
            - *k_submit_req_title
            - *k_review_req_title
            - *k_submit_req_sub
            - *k_review_req_sub
            - *k_submit_req_survey
            - *k_review_req_survey
            - *k_clk_1215
            - *k_close_a
          trigger:
            - call: "GET /applications/${app_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /easements/${ease_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /funding-commitments"
              payload: { application_id: "${app_a_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1 returns HTTP 200 with Application.${app_a_id}.closing_status == CLOSED and funding_plan_status == DISBURSED, so the priority 27 staleness guard was satisfied at closing time"
            - "trigger call 1 also shows funded_cost_cents == total_program_cost_cents == 160364925"
            - "trigger call 2 returns HTTP 200 with Easement.${ease_a_id}.parcel_id == ${parcel_a_id} and application_id == ${app_a_id}, matching Application.${app_a_id}.parcel_id exactly, so the priority 24 scope guard was satisfied"
            - "trigger call 3 returns total_count == 3 with every row status == DISBURSED and no row status IN {LAPSED, RELEASED}, which is why ERR_FUNDING_PLAN_STALE cannot be reached from a CLEARED closing"
            - "the implementation MUST still carry both checks: ERR_FUNDING_PLAN_STALE on POST /applications/{id}/closing when funding_plan_status != OBLIGATED, and ERR_EASEMENT_SCOPE_MISMATCH when an easement's parcel_id or program scope diverges, even though no §1.5 request sequence can violate them"

      - name: error_triggerable_negotiation_rounds_exhausted
