              as: HostOperations
              captures: { sup_mer_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
              captures: { agr_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "NY-SOT-40118", effective_on: "2026-01-01", expires_on: "2027-01-01", jurisdiction_state_code: "NY" }
