          trigger:
            - call: "POST /pre-orders"
              payload: { wholesale_account_id: "${acct_id}", pickup_production_day_id: "${d_id}", pickup_window_start: "2026-03-12T07:00:00Z", pickup_window_end: "2026-03-12T08:00:00Z", line_items: [ { product_id: "${glazed_id}", qty: 23 }, { product_id: "${sesame_id}", qty: 3 }, { product_id: "${every_id}", qty: 4 } ] }
