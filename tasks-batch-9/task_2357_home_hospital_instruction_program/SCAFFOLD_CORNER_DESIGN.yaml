        claim_type: reconciliation
        grounds:
          - calculations.funding_reconciliation_net
          - calculations.service_gap_minutes
          - errors[ERR_FUNDING_ALREADY_RECONCILED]
          - errors[ERR_FUNDING_NOT_ACCRUING]
        distinguishing_aspect: |
          With 240 verified minutes against an entitled_total of 390 the ratio is
