# =============================================================================
# task_1025 — §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7 claims
# not already covered by §1.8). Every error code in §1.6 is triggered here or in
# §1.8. Default logical clock = 2026-07-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: cn_product_is_hazmat_computed
        claim_type: computed_field
        grounds: ['entities.Product.fields.is_hazmat']
        distinguishing_aspect: "A BATTERY product has is_hazmat==true; a KIT product has is_hazmat==false (derived from product_type, input ignored)."
        test_recipe:
          setup: ["Create one BATTERY and one KIT product."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "BAT-CN", name: "LiPo 2S", product_type: "BATTERY", price_cents: 3000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { bat: $.data.id, bat_h: $.data.is_hazmat }
          trigger:
            - call: "POST /products"
              payload: { sku: "KIT-CN", name: "Glider", product_type: "KIT", price_cents: 8000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { kit: $.data.id, kit_h: $.data.is_hazmat }
          assert:
            - "Product.${bat}.is_hazmat == true"
            - "Product.${kit}.is_hazmat == false"

      - name: cn_order_defaults_source_standard
        claim_type: defaults
        grounds: ['entities.Order.fields.source']
        distinguishing_aspect: "Omitting source on order create yields source==STANDARD, status==DRAFT, payment_status==UNPAID, fulfillment_status==PENDING."
        test_recipe:
          setup: ["Customer + product exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "def@x.com", full_name: "Def" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PRT-DEF", name: "Servo", product_type: "PART", price_cents: 2000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 2000 } ] }
              as: StoreStaff
              captures: { src: $.data.source, st: $.data.status }
          assert:
            - "Order.source == STANDARD"
            - "Order.status == DRAFT AND payment_status == UNPAID AND fulfillment_status == PENDING"

      - name: cn_customer_not_found_returns_404
        claim_type: not_found
        grounds: ['endpoints."GET /customers/{customer_id}"', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET on a well-formed but non-existent customer id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: cn_order_create_missing_customer_returns_400
        claim_type: required_fields
        grounds: ['endpoints."POST /orders"', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "Order create without customer_id fails with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "PRT-M", name: "Wheel", product_type: "PART", price_cents: 1000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 1000 } ] }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: cn_product_bad_enum_type_returns_400
        claim_type: type_constraints
        grounds: ['entities.Product.fields.product_type', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "product_type outside {KIT,RC_VEHICLE,PART,BATTERY} fails with ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "X", name: "X", product_type: "SPACESHIP", price_cents: 1000, stock_on_hand: 1 }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cn_campaign_open_from_open_returns_409
        claim_type: idempotency
        grounds: ['state_machines.PreOrderCampaign.DRAFT_to_OPEN', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Opening an already-OPEN campaign fails with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Campaign opened once."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "RC-OP", name: "RC", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 10 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "Op", total_allocation_units: 5, unit_price_cents: 10000, reservation_open_at: "2026-07-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cn_order_cancel_from_cancelled_returns_409
        claim_type: terminal_state_lockdown
        grounds: ['state_machines.Order.PENDING_to_CANCELLED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Cancelling an order whose fulfillment_status is already CANCELLED fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Order placed then cancelled."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "tl@x.com", full_name: "TL" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-TL", name: "Kit", product_type: "KIT", price_cents: 10000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 10000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
            - call: "POST /orders/${ord}/transition"
              payload: { action: "CANCEL" }
              as: StoreStaff
          trigger:
            - call: "POST /orders/${ord}/transition"
              payload: { action: "CANCEL" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cn_transition_invalid_action_returns_400
        claim_type: invalid_transition
        grounds: ['endpoints."POST /orders/{order_id}/transition"', 'errors[ERR_INVALID_ACTION]']
        distinguishing_aspect: "An unknown action on a /transition endpoint returns ERR_INVALID_ACTION (400)."
        test_recipe:
          setup: ["A DRAFT order exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ia@x.com", full_name: "IA" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-IA", name: "Kit", product_type: "KIT", price_cents: 10000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 10000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/transition"
              payload: { action: "TELEPORT" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ACTION"

      - name: cn_campaign_reallocate_returns_already_allocated
        claim_type: invalid_transition
        grounds: ['state_machines.PreOrderCampaign.OPEN_to_ALLOCATING', 'errors[ERR_CAMPAIGN_ALREADY_ALLOCATED]']
        distinguishing_aspect: "Allocating a campaign already in ALLOCATING returns ERR_CAMPAIGN_ALREADY_ALLOCATED."
        test_recipe:
          setup: ["Campaign opened and allocated once."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "RC-RA", name: "RC", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 10 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "RA", total_allocation_units: 5, unit_price_cents: 10000, reservation_open_at: "2026-07-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
            - call: "POST /campaigns/${camp}/allocate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /campaigns/${camp}/allocate"
              payload: {}
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CAMPAIGN_ALREADY_ALLOCATED"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: cn_place_hazmat_without_ack_returns_409
        claim_type: violation_to_error
        grounds: ['validations[priority=6]', 'errors[ERR_HAZMAT_ACK_REQUIRED]']
        distinguishing_aspect: "Placing an order with a BATTERY line while buyer.hazmat_safety_ack is false returns ERR_HAZMAT_ACK_REQUIRED (409)."
        test_recipe:
          setup: ["Buyer without safety-ack; order with a BATTERY line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "hz@x.com", full_name: "HZ" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "BAT-HZ", name: "LiPo", product_type: "BATTERY", price_cents: 4000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { bat: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${bat}", quantity: 1, unit_price_cents: 4000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_HAZMAT_ACK_REQUIRED"

      - name: cn_place_order_insufficient_stock_returns_409
        claim_type: violation_to_error
        grounds: ['validations[priority=11]', 'errors[ERR_INSUFFICIENT_STOCK]']
        distinguishing_aspect: "Placing an order whose line quantity exceeds product stock_on_hand returns ERR_INSUFFICIENT_STOCK."
        test_recipe:
          setup: ["Product stock 1; order requests 5."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "st@x.com", full_name: "ST" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PRT-ST", name: "Gear", product_type: "PART", price_cents: 1000, stock_on_hand: 1 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 5, unit_price_cents: 1000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_STOCK"

      - name: cn_pay_insufficient_returns_402
        claim_type: violation_to_error
        grounds: ['validations[priority=12]', 'errors[ERR_INSUFFICIENT_PAYMENT]']
        distinguishing_aspect: "Paying a PLACED order with amount_cents < total_cents returns ERR_INSUFFICIENT_PAYMENT (402)."
        test_recipe:
          setup: ["Order PLACED with total 10000; pay 5000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pi@x.com", full_name: "PI" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-PI", name: "Kit", product_type: "KIT", price_cents: 10000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 10000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
          trigger:
            - call: "POST /orders/${ord}/pay"
              payload: { amount_cents: 5000 }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_PAYMENT"
            - "http status == 402"

      - name: cn_pay_already_settled_returns_409
        claim_type: violation_to_error
        grounds: ['errors[ERR_PAYMENT_ALREADY_SETTLED]', 'state_machines.Order.PENDING_to_FULFILLED']
        distinguishing_aspect: "Paying an order whose payment_status is already PAID returns ERR_PAYMENT_ALREADY_SETTLED."
        test_recipe:
          setup: ["Order PLACED and PAID once."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ps@x.com", full_name: "PS" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-PS", name: "Kit", product_type: "KIT", price_cents: 10000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 10000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
            - call: "POST /orders/${ord}/pay"
              payload: { amount_cents: 10000 }
              as: StoreStaff
          trigger:
            - call: "POST /orders/${ord}/pay"
              payload: { amount_cents: 10000 }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAYMENT_ALREADY_SETTLED"

      - name: cn_reservation_window_closed_returns_409
        claim_type: temporal_validation
        grounds: ['validations[priority=7]', 'errors[ERR_WINDOW_CLOSED]']
        distinguishing_aspect: "Creating a reservation before reservation_open_at (clock at default 2026-07-01, window opens 2026-08-01) returns ERR_WINDOW_CLOSED."
        test_recipe:
          setup: ["Campaign OPEN whose reservation window opens 2026-08-01; clock at default 2026-07-01."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "wc@x.com", full_name: "WC" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "RC-WC", name: "RC", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 10 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "Future", total_allocation_units: 5, unit_price_cents: 10000, reservation_open_at: "2026-08-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cust}", requested_units: 1, expected_campaign_version: "${cv}" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WINDOW_CLOSED"

      - name: cn_reservation_over_pool_returns_allocation_exhausted
        claim_type: violation_to_error
        grounds: ['validations[priority=10]', 'errors[ERR_ALLOCATION_EXHAUSTED]']
        distinguishing_aspect: "requested_units (999) exceeding campaign.total_allocation_units (5) returns ERR_ALLOCATION_EXHAUSTED."
        test_recipe:
          setup: ["Campaign OPEN total 5; clock in window."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ae@x.com", full_name: "AE" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "RC-AE", name: "RC", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 10 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "Small", total_allocation_units: 5, unit_price_cents: 10000, reservation_open_at: "2026-07-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cust}", requested_units: 999, expected_campaign_version: "${cv}" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ALLOCATION_EXHAUSTED"

      - name: cn_register_window_closed_returns_409
        claim_type: temporal_validation
        grounds: ['validations[priority=7]', 'errors[ERR_WINDOW_CLOSED]']
        distinguishing_aspect: "Registering before registration_open_at (window opens 2026-08-01, clock default 2026-07-01) returns ERR_WINDOW_CLOSED."
        test_recipe:
          setup: ["Event OPEN whose registration window opens 2026-08-01; clock default."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rw@x.com", full_name: "RW" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /race-events"
              payload: { name: "Future Race", event_date: "2026-09-01T10:00:00Z", capacity: 8, lane_count: 4, entry_fee_cents: 1000, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-08-20T00:00:00Z" }
              as: StoreStaff
              captures: { ev: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "OPEN" }
              as: StoreStaff
          trigger:
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cust}", race_class: "STOCK", lane_no: 1, heat_start: "2026-09-01T10:00:00Z", heat_end: "2026-09-01T10:10:00Z" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WINDOW_CLOSED"

      - name: cn_checkin_window_closed_returns_409
        claim_type: temporal_validation
        grounds: ['validations[priority=7]', 'errors[ERR_CHECKIN_WINDOW_CLOSED]']
        distinguishing_aspect: "Safety-acked racer, event RUNNING, clock (default 2026-07-01) far before heat window on 2026-07-15 → pure temporal failure ERR_CHECKIN_WINDOW_CLOSED."
        test_recipe:
          setup: ["Racer safety-acked; event RUNNING; entry REGISTERED; clock default 2026-07-01."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cw@x.com", full_name: "CW" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/safety-ack"
              payload: {}
              as: StoreStaff
            - call: "POST /race-events"
              payload: { name: "Timed", event_date: "2026-07-15T10:00:00Z", capacity: 8, lane_count: 4, entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-07-20T00:00:00Z" }
              as: StoreStaff
              captures: { ev: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "OPEN" }
              as: StoreStaff
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cust}", race_class: "STOCK", lane_no: 1, heat_start: "2026-07-15T10:00:00Z", heat_end: "2026-07-15T10:10:00Z" }
              as: StoreStaff
              captures: { entry: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "RUN" }
              as: StoreStaff
          trigger:
            - call: "POST /race-entries/${entry}/transition"
              payload: { action: "CHECK_IN" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHECKIN_WINDOW_CLOSED"

      - name: cn_event_full_returns_409
        claim_type: aggregate_validation
        grounds: ['validations[priority=10]', 'errors[ERR_EVENT_FULL]']
        distinguishing_aspect: "Registering into an event whose entry_count already equals capacity (1) returns ERR_EVENT_FULL."
        test_recipe:
          setup: ["Capacity-1 event OPEN; one entry already registered; a second racer registers."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ef1@x.com", full_name: "EF1" }
              as: StoreStaff
              captures: { cA: $.data.id }
            - call: "POST /customers"
              payload: { email: "ef2@x.com", full_name: "EF2" }
              as: StoreStaff
              captures: { cB: $.data.id }
            - call: "POST /race-events"
              payload: { name: "Tiny", event_date: "2026-07-15T10:00:00Z", capacity: 1, lane_count: 4, entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-07-20T00:00:00Z" }
              as: StoreStaff
              captures: { ev: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "OPEN" }
              as: StoreStaff
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cA}", race_class: "STOCK", lane_no: 1, heat_start: "2026-07-15T10:00:00Z", heat_end: "2026-07-15T10:10:00Z" }
              as: StoreStaff
          trigger:
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cB}", race_class: "STOCK", lane_no: 2, heat_start: "2026-07-15T10:00:00Z", heat_end: "2026-07-15T10:10:00Z" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EVENT_FULL"

      - name: cn_duplicate_entry_returns_409
        claim_type: violation_to_error
        grounds: ['errors[ERR_DUPLICATE_ENTRY]', 'entities.RaceEntry.fields.customer_id']
        distinguishing_aspect: "The same customer registering a second non-terminal entry in the same event returns ERR_DUPLICATE_ENTRY."
        test_recipe:
          setup: ["Event OPEN; customer registered once."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "du@x.com", full_name: "DU" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /race-events"
              payload: { name: "Dup", event_date: "2026-07-15T10:00:00Z", capacity: 8, lane_count: 4, entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-07-20T00:00:00Z" }
              as: StoreStaff
              captures: { ev: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "OPEN" }
              as: StoreStaff
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cust}", race_class: "STOCK", lane_no: 1, heat_start: "2026-07-15T10:00:00Z", heat_end: "2026-07-15T10:10:00Z" }
              as: StoreStaff
          trigger:
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cust}", race_class: "PRO", lane_no: 2, heat_start: "2026-07-15T11:00:00Z", heat_end: "2026-07-15T11:10:00Z" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_ENTRY"

      - name: cn_lane_out_of_range_returns_400
        claim_type: type_constraints
        grounds: ['entities.RaceEntry.fields.lane_no', 'errors[ERR_LANE_OUT_OF_RANGE]']
        distinguishing_aspect: "lane_no (5) exceeding event.lane_count (2) returns ERR_LANE_OUT_OF_RANGE (400)."
        test_recipe:
          setup: ["Event OPEN with lane_count 2."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "lo@x.com", full_name: "LO" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /race-events"
              payload: { name: "TwoLane", event_date: "2026-07-15T10:00:00Z", capacity: 8, lane_count: 2, entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-07-20T00:00:00Z" }
              as: StoreStaff
              captures: { ev: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "OPEN" }
              as: StoreStaff
          trigger:
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cust}", race_class: "STOCK", lane_no: 5, heat_start: "2026-07-15T10:00:00Z", heat_end: "2026-07-15T10:10:00Z" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LANE_OUT_OF_RANGE"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: cn_missing_auth_header_returns_401
        claim_type: rbac_denial
        grounds: ['validations[priority=1]', 'errors[ERR_MISSING_AUTH]']
        distinguishing_aspect: "A request with no/invalid X-User-Role returns ERR_MISSING_AUTH (401) before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_AUTH"
            - "http status == 401"

      - name: cn_rbac_product_create_customer_forbidden
        claim_type: rbac_denial
        grounds: ['roles.Customer', 'roles.StoreStaff', 'errors[ERR_UNAUTHORIZED]']
        distinguishing_aspect: "Role Customer calling POST /products (a StoreStaff-exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A customer exists to act as."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rb@x.com", full_name: "RB" }
              as: StoreStaff
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "X", name: "X", product_type: "PART", price_cents: 1000, stock_on_hand: 1 }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "http status == 403"

      - name: cn_rbac_campaign_cancel_staff_forbidden
        claim_type: rbac_denial
        grounds: ['roles.StoreManager', 'endpoints."POST /campaigns/{campaign_id}/cancel"', 'errors[ERR_UNAUTHORIZED]']
        distinguishing_aspect: "StoreStaff calling POST /campaigns/{id}/cancel (StoreManager-exclusive) returns ERR_UNAUTHORIZED — hierarchical override does not extend downward."
        test_recipe:
          setup: ["A campaign exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "RC-CX", name: "RC", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 10 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "CX", total_allocation_units: 5, unit_price_cents: 10000, reservation_open_at: "2026-07-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp}/cancel"
              payload: {}
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: cn_occ_stale_campaign_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[preorder-reservation-stale-campaign]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "A second reservation create carrying the pre-advance campaign version (stale after the first create bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Campaign OPEN; one reservation created (campaign version advances); a second create reuses the stale version."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "oc1@x.com", full_name: "OC1" }
              as: StoreStaff
              captures: { cA: $.data.id }
            - call: "POST /customers"
              payload: { email: "oc2@x.com", full_name: "OC2" }
              as: StoreStaff
              captures: { cB: $.data.id }
            - call: "POST /products"
              payload: { sku: "RC-OC", name: "RC", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 10 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "OCC", total_allocation_units: 10, unit_price_cents: 10000, reservation_open_at: "2026-07-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
              captures: { cv: $.data.version }
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cA}", requested_units: 1, expected_campaign_version: "${cv}" }
              as: StoreStaff
          trigger:
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cB}", requested_units: 1, expected_campaign_version: "${cv}" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http status == 412"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: cn_fk_reverse_reservations_by_campaign
        claim_type: cross_reference_link
        grounds: ['endpoints."GET /pre-orders"', 'entities.PreOrderReservation.fields.campaign_id']
        distinguishing_aspect: "GET /pre-orders?campaign_id=<id> returns the reservation array for that campaign (FK reverse-reachability)."
        test_recipe:
          setup: ["Campaign OPEN with one reservation."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "fk@x.com", full_name: "FK" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "RC-FK", name: "RC", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 10 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "FK", total_allocation_units: 5, unit_price_cents: 10000, reservation_open_at: "2026-07-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
              captures: { cv: $.data.version }
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cust}", requested_units: 2, expected_campaign_version: "${cv}" }
              as: StoreStaff
              captures: { res: $.data.id }
          trigger:
            - call: "GET /pre-orders"
              payload: { campaign_id: "${camp}" }
              as: StoreStaff
          assert:
            - "response data is an array containing reservation ${res}"
            - "response envelope carries total_count and has_more"

      - name: cn_orders_list_pagination_envelope
        claim_type: listing
        grounds: ['endpoints."GET /orders"', 'response_envelope']
        distinguishing_aspect: "GET /orders?customer_id=<id> returns a paginated array response with total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["Customer with one order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "lp@x.com", full_name: "LP" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-LP", name: "Kit", product_type: "KIT", price_cents: 10000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 10000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
          trigger:
            - call: "GET /orders"
              payload: { customer_id: "${cust}", limit: 10, offset: 0 }
              as: StoreStaff
          assert:
            - "response_type == array; data contains order ${ord}"
            - "pagination fields total_count and has_more present"

