              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "EXTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/result"
              payload: { result: "PASS" }
              as: Inspector
