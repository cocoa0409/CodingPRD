    grounds:
    - §1.2 Destination CANDIDATE -> SHORTLISTED preconditions (inspection_status, inspection_score, risk_score)
    - §1.4 priority 17 ERR_DESTINATION_RISK_TOO_HIGH, priority 18 ERR_INSPECTION_SCORE_BELOW_MINIMUM,
