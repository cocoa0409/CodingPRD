# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: destination-sales-convention-attraction (task 2949)
# 9 rule_ids x >= 2 instances = 20 instances total.
# Every money literal in `assert:` was produced by executing the matching
# calculations[].formula in Python with Decimal / ROUND_HALF_UP.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: impact_provisional_vs_final_diverge_for_same_opportunity
        grounds:
          - calculations.economic_impact_estimate
          - entities.EconomicImpactEstimate.fields.variant
          - entities.EconomicImpactEstimate.fields.total_impact_amount
          - state_machines.BidPackage.DRAFT_to_INCENTIVE_PENDING
          - endpoints[POST /economic-impact-estimates]
        distinguishing_aspect: |
          The PROVISIONAL variant values the planner's 1800 requested room nights at the 219.00 rate ceiling
          and 8000 delegates over 2 event nights, while the FINAL variant values only the 990 room nights
          actually picked up at the rates actually charged and derives delegates as 990 * 1.6 persons, so the
          same opportunity yields total_impact_amount 9741930.00 (PROVISIONAL) versus 2659756.61 (FINAL).
        test_recipe:
          setup:
            - "logical clock at 2027-03-01T00:00:00Z; planner CDA carries legacy counters 2 definites / 6000 room nights (tier TIER_B, lifetime score 36)"
            - "three participating hotels: Harborview 600 committable, Bayside 400, Cityline 200; one hall Grand Hall A with 250000 exhibit sqft, 12000 person capacity, 48h turnaround"
            - "opportunity CDA Annual 2028: arrival 2028-04-10, departure 2028-04-12 (event_nights 2), peak_rooms_requested 1000, total_room_nights_requested 1800, attendance_estimate 8000, exhibit_sqft_requested 200000, rate_ceiling_amount 219.00, sales_stage QUALIFIED"
            - "citywide block COMMITTED at 500 + 300 + 100 = 900 peak rooms (block_coverage_pct 90.00, cutoff_alignment_spread_days 0) and one HELD FIRST-rank hold on Grand Hall A"
            - "bid package APPROVED with a 12000.00 incentive charged to a 500000.00 fund, SUBMITTED, then ACCEPTED by the planner, so the opportunity is DEFINITE and the hold is CONFIRMED"
            - "actual pickup reported: Harborview 400 + 250 rooms at 214.33, Bayside 180 + 150 at 209.77, Cityline 10 at 199.51 (990 room nights total)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org", legacy_definite_count: 2, legacy_definite_room_nights: 6000 }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /hotels"
              payload: { name: "Harborview Grand", committable_rooms: 600, walk_distance_blocks: 2 }
              as: BureauAdmin
              captures: { hotel_a_id: $.data.id }
            - call: "POST /hotels"
              payload: { name: "Bayside Suites", committable_rooms: 400, walk_distance_blocks: 4 }
              as: BureauAdmin
              captures: { hotel_b_id: $.data.id }
            - call: "POST /hotels"
              payload: { name: "Cityline Inn", committable_rooms: 200, walk_distance_blocks: 6 }
              as: BureauAdmin
              captures: { hotel_c_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Grand Hall A", exhibit_sqft: 250000, capacity_persons: 12000, turnaround_hours: 48 }
              as: CenterScheduler
              captures: { hall_id: $.data.id }
            - call: "POST /incentive-funds"
              payload: { fiscal_year: 2028, budget_amount: 500000.00 }
              as: BureauAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { hold_a_id: $.data.id }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { opp_v_a: $.data.version }
            - call: "POST /room-block-commitments"
              payload: { opportunity_id: "${opp_id}", hotel_id: "${hotel_a_id}", rooms_peak_invited: 500, expected_opportunity_version: "${opp_v_a}" }
              as: SalesManager
              captures: { c_a_id: $.data.id }
            - call: "POST /room-block-commitments/${c_a_id}/offer"
