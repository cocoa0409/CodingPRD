        test_recipe:
          setup:
            - "NON_FEDERAL disclosure PATENT_PURSUED with roster = {inv1}; startup SpinCo with APPROVED COI plan for inv1 [2026-01-01, 2027-01-01)"
            - "inv2 exists but is NOT on the disclosure roster"
