        grounds:
          - validations[priority=22]
          - errors.ERR_SHIPMENT_NOT_DELIVERED
          - state_machines.Shipment.PICKED_UP_to_DELIVERED
          - state_machines.LossDamageClaim.initial_state
        distinguishing_aspect: >-
          A third entity pair (LossDamageClaim, Shipment): the notice is inside every window and the
          filer owns the shipment, but opening a claim on a PICKED_UP shipment is refused with
          ERR_SHIPMENT_NOT_DELIVERED; the identical body is accepted the moment the shipment reaches
          DELIVERED, proving the gate is the other entity's state and not the request.
