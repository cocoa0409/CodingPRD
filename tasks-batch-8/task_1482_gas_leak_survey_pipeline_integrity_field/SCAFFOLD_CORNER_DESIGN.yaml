            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-SOD", install_year: 2010, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-SOD", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_id}", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/dispatch"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-runs"
              payload: { route_id: "${route_id}", instrument_id: "${instr_id}", distance_covered_feet: 1000.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { run_id: $.data.id }
            - call: "POST /survey-runs/${run_id}/submit"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
          trigger:
            - call: "POST /survey-runs/${run_id}/accept"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ft_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (X-User-ID == technician_id rejected)"

      - name: error_invalid_state_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: state_vs_safety_on_survey_run_submit
          rationale: "ERR_INVALID_STATE asserted as the winning error in the named §1.8 priority-conflict instance (double submit on SurveyRun)."

      - name: error_route_includes_inactive_segment_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ROUTE_INCLUDES_INACTIVE_SEGMENT]
        excluded_because:
          difficulty_instance: route_dispatch_blocked_by_inactive_segment
          rationale: "Asserted as the failure path of the named §1.8 cross-entity dependency instance."

      - name: error_outside_scheduled_window_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OUTSIDE_SCHEDULED_WINDOW]
        excluded_because:
          difficulty_instance: route_start_outside_scheduled_window_rejected
          rationale: "Asserted as the failure path of the named §1.8 temporal-overlap instance."

      - name: error_no_post_repair_survey_covered
        claim_type: violation_to_error
        grounds:
