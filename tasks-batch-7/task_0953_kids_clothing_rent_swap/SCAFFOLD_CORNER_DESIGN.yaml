        distinguishing_aspect: "For a 2-slot, 1-swap member with one item allocated, the entitlements read returns slots_total 2, slots_occupied 1, slots_permanently_consumed 0, swaps_remaining 1 and pause_days_remaining_period 30."
        test_recipe:
          setup: ["A 2-slot, 1-swap plan; one ACTIVE member with an OPEN cycle whose box holds one allocated item."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
