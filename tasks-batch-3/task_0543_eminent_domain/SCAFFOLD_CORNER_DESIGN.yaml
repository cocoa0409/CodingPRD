        distinguishing_aspect: "When the replacement differential (5,000,000) exceeds RESIDENTIAL_REPLACEMENT_CAP_CENTS (3,150,000) it is clamped to the cap; benefit == 3,150,000 with zero moving expense."
        test_recipe:
