# =============================================================================
# Task 0759 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: alert_reach_estimated_vs_delivered
        grounds:
          - calculations.alert_reach
          - entities.Alert.fields.estimated_reach
          - entities.Alert.fields.delivered_reach
          - state_machines.Alert.APPROVED_to_DISPATCHING
        distinguishing_aspect: "On the SAME Alert, estimated_reach counts every contact with a created notification (=1) while delivered_reach counts only DELIVERED (=0); the two diverge because the sole notification FAILED."
        test_recipe:
          setup:
            - "Clock 2026-03-10T14:00:00Z; one ONLINE SMS gateway (cap 100); contact c1 (EN) with a CONFIRMED SMS channel; c1 in group g1; alert a1 (WARNING, [SMS], GROUP=g1) approved."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /contacts", payload: { full_name: "Ann", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550001" }, as: ContactAdmin, captures: { ch1: "$.data.id", tok1: "$.data.confirmation_token" } }
            - { call: "POST /channels/${ch1}/confirm", payload: { confirmation_token: "${tok1}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "Boil Water", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Boil water advisory in effect." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
          trigger:
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1", captures: { est: "$.data.estimated_reach" } }
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
            - { call: "GET /notifications", payload: { alert_id: "${a1}" }, as: Dispatcher, as_user_id: "disp1", captures: { n1: "$.data[0].id" } }
            - { call: "POST /notifications/${n1}/delivery-report", payload: { outcome: "FAILED" }, as: Integrator }
            - { call: "POST /alerts/${a1}/close", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { dr: "$.data.delivered_reach" } }
          assert:
            - "Alert.${a1}.estimated_reach == 1"
            - "Alert.${a1}.delivered_reach == 0"

      - name: contact_reliability_optimistic_vs_strict
        grounds:
          - calculations.contact_reliability
          - entities.Contact.fields.reliability_score
        distinguishing_aspect: "On a Contact (different entity domain than Alert), optimistic reliability counts SENT as success (2/2 = 1.00) while strict counts only DELIVERED (1/2 = 0.50)."
        test_recipe:
          setup:
            - "Clock 2026-03-10T14:00:00Z; ONLINE SMS + EMAIL gateways; contact c1 with CONFIRMED SMS and EMAIL channels in group g1; alert a1 ([SMS,EMAIL], GROUP=g1) dispatched; both notifications SENT; the SMS one reported DELIVERED, the EMAIL one left SENT."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /gateways", payload: { name: "EMAIL-GW", channel_type: "EMAIL", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /contacts", payload: { full_name: "Bob", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550002" }, as: ContactAdmin, captures: { chS: "$.data.id", tokS: "$.data.confirmation_token" } }
            - { call: "POST /channels/${chS}/confirm", payload: { confirmation_token: "${tokS}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "EMAIL", address: "bob@x.com" }, as: ContactAdmin, captures: { chE: "$.data.id", tokE: "$.data.confirmation_token" } }
            - { call: "POST /channels/${chE}/confirm", payload: { confirmation_token: "${tokE}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "Advisory", severity: "WARNING", channels: ["SMS", "EMAIL"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Air quality advisory." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
            - { call: "GET /notifications", payload: { alert_id: "${a1}", channel_id: "${chS}" }, as: Dispatcher, as_user_id: "disp1", captures: { nS: "$.data[0].id" } }
            - { call: "POST /notifications/${nS}/delivery-report", payload: { outcome: "DELIVERED" }, as: Integrator }
          trigger:
            - { call: "GET /contacts/${c1}", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { rel_opt: "$.data.reliability_score" } }
            - { call: "GET /contacts/${c1}", payload: { mode: "strict" }, as: Dispatcher, as_user_id: "disp1", captures: { rel_strict: "$.data.reliability_score" } }
          assert:
            - "GET /contacts/${c1} (default) -> data.reliability_score == 1.00"
            - "GET /contacts/${c1}?mode=strict -> data.reliability_score == 0.50"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: retry_backoff_tiered_min_delay
        grounds:
          - calculations.retry_backoff_delay
          - state_machines.Notification.FAILED_to_RETRYING
          - entities.Notification.fields.next_retry_at
        distinguishing_aspect: "MODE (a): delay = min(3600, 60 * 2^(attempt-1) * severity_factor). For WARNING (factor 2) at attempt 1: min(3600, 60*1*2)=120s → next_retry_at = 2026-03-10T14:02:00Z (three inputs, nested min, tiered multiplier)."
        test_recipe:
          setup:
            - "Clock 2026-03-10T14:00:00Z; alert a1 (WARNING,[SMS]) dispatched to contact c1; its notification n1 SENT then reported FAILED (attempt_count=1)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /contacts", payload: { full_name: "Cy", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550003" }, as: ContactAdmin, captures: { ch1: "$.data.id", tok1: "$.data.confirmation_token" } }
            - { call: "POST /channels/${ch1}/confirm", payload: { confirmation_token: "${tok1}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning message." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
            - { call: "GET /notifications", payload: { alert_id: "${a1}" }, as: Dispatcher, as_user_id: "disp1", captures: { n1: "$.data[0].id" } }
            - { call: "POST /notifications/${n1}/delivery-report", payload: { outcome: "FAILED" }, as: Integrator }
          trigger:
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
            - { call: "GET /notifications/${n1}", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { nst: "$.data.delivery_status", nra: "$.data.next_retry_at" } }
          assert:
            - "Notification.${n1}.delivery_status == RETRYING"
            - "Notification.${n1}.attempt_count == 1"
            - "Notification.${n1}.next_retry_at == 2026-03-10T14:02:00Z"

      - name: sms_billable_segments_round_per_line_then_sum
        grounds:
          - calculations.sms_billable_segments
          - entities.Alert.fields.sms_billable_segments
          - entities.AlertLocalization.fields.segment_count
        distinguishing_aspect: "MODE (b): rounding order is pinned to ceil-per-notification-then-sum: ceil(192/160)+ceil(52/160)=2+1=3, whereas sum-then-round ceil(244/160)=2. Result must be 3."
        test_recipe:
          setup:
            - "Clock 2026-03-10T14:00:00Z; SMS gateway; contact A (EN) and contact B (ES) each with CONFIRMED SMS, both in group g1; alert a1 ([SMS], GROUP=g1) with EN localization (192 chars) and ES localization (52 chars); approved."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /contacts", payload: { full_name: "A", primary_language: "EN" }, as: ContactAdmin, captures: { cA: "$.data.id" } }
            - { call: "POST /contacts/${cA}/channels", payload: { channel_type: "SMS", address: "+15550010" }, as: ContactAdmin, captures: { chA: "$.data.id", tokA: "$.data.confirmation_token" } }
            - { call: "POST /channels/${chA}/confirm", payload: { confirmation_token: "${tokA}" }, as: Contact, as_user_id: "${cA}" }
            - { call: "POST /contacts", payload: { full_name: "B", primary_language: "ES" }, as: ContactAdmin, captures: { cB: "$.data.id" } }
            - { call: "POST /contacts/${cB}/channels", payload: { channel_type: "SMS", address: "+15550011" }, as: ContactAdmin, captures: { chB: "$.data.id", tokB: "$.data.confirmation_token" } }
            - { call: "POST /channels/${chB}/confirm", payload: { confirmation_token: "${tokB}" }, as: Contact, as_user_id: "${cB}" }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${cA}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /subscriptions", payload: { contact_id: "${cB}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "Flood", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Flash flood warning for the downtown river district. Move to higher ground immediately and avoid all low-lying roads, underpasses, and storm drains until further official notice is given here." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "ES", message_text: "Aviso de inundacion repentina en el centro urbano ya" }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
          trigger:
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1", captures: { segs: "$.data.sms_billable_segments" } }
          assert:
            - "Alert.${a1}.sms_billable_segments == 3"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: alert_revision_cycle_reject_to_draft
        grounds:
          - state_machines.Alert.PENDING_APPROVAL_to_DRAFT
          - state_machines.Alert.DRAFT_to_PENDING_APPROVAL
          - entities.Alert.fields.revision_count
        distinguishing_aspect: "Alert cycles PENDING_APPROVAL -> DRAFT (reject) -> PENDING_APPROVAL (re-submit); revision_count increments to 1 — a non-linear revision loop, not a forward-only pipeline."
        test_recipe:
          setup:
            - "Alert a1 (WARNING,[SMS],GROUP=g1) with one EN localization, submitted to PENDING_APPROVAL."
          setup_api_calls:
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
          trigger:
            - { call: "POST /alerts/${a1}/reject", payload: { reason: "Fix wording" }, as: Approver, as_user_id: "appr1", captures: { rc: "$.data.revision_count", st1: "$.data.status" } }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { st2: "$.data.status" } }
          assert:
            - "reject -> Alert.${a1}.status == DRAFT"
            - "Alert.${a1}.revision_count == 1"
            - "re-submit -> Alert.${a1}.status == PENDING_APPROVAL"

      - name: notification_retry_cycle_failed_retrying_sent
        grounds:
          - state_machines.Notification.SENT_to_FAILED
          - state_machines.Notification.FAILED_to_RETRYING
          - state_machines.Notification.RETRYING_to_SENT
          - entities.Notification.fields.attempt_count
        distinguishing_aspect: "Notification cycles SENT -> FAILED -> RETRYING -> SENT (attempt_count 1 -> 2), a retry loop on a different entity (Notification) than the Alert cycle."
        test_recipe:
          setup:
            - "Clock 2026-03-10T14:00:00Z; alert a1 dispatched to c1; notification n1 SENT, reported FAILED, ticked to RETRYING (next_retry_at 14:02:00Z)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /contacts", payload: { full_name: "Cy", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550004" }, as: ContactAdmin, captures: { ch1: "$.data.id", tok1: "$.data.confirmation_token" } }
            - { call: "POST /channels/${ch1}/confirm", payload: { confirmation_token: "${tok1}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
            - { call: "GET /notifications", payload: { alert_id: "${a1}" }, as: Dispatcher, as_user_id: "disp1", captures: { n1: "$.data[0].id" } }
            - { call: "POST /notifications/${n1}/delivery-report", payload: { outcome: "FAILED" }, as: Integrator }
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:05:00Z" }, as: Integrator }
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
            - { call: "GET /notifications/${n1}", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { nst: "$.data.delivery_status", ac: "$.data.attempt_count" } }
          assert:
            - "Notification.${n1}.delivery_status == SENT"
            - "Notification.${n1}.attempt_count == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: optout_suppresses_notification_then_autocloses_alert
        grounds:
          - state_machines.ContactChannel.CONFIRMED_to_OPTED_OUT
          - state_machines.Notification.SENT_to_SUPPRESSED
          - state_machines.Alert.SENT_to_CLOSED
          - entities.Alert.fields.pending_count
        distinguishing_aspect: "Depth-3 chain from a channel opt-out: channel OPTED_OUT -> its notification SUPPRESSED -> parent Alert.pending_count decremented to 0 -> Alert auto-CLOSED; each hop is caused by the previous."
        test_recipe:
          setup:
            - "Clock 2026-03-10T14:00:00Z; alert a1 dispatched to c1's only channel ch1; ticked so notification n1 is SENT and a1 is SENT with pending_count=1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /contacts", payload: { full_name: "Dee", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550005" }, as: ContactAdmin, captures: { ch1: "$.data.id", tok1: "$.data.confirmation_token" } }
            - { call: "POST /channels/${ch1}/confirm", payload: { confirmation_token: "${tok1}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
            - { call: "GET /notifications", payload: { alert_id: "${a1}" }, as: Dispatcher, as_user_id: "disp1", captures: { n1: "$.data[0].id" } }
          trigger:
            - { call: "POST /channels/${ch1}/opt-out", payload: {}, as: Contact, as_user_id: "${c1}" }
            - { call: "GET /notifications/${n1}", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { nst: "$.data.delivery_status" } }
            - { call: "GET /alerts/${a1}", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { ast: "$.data.status", apc: "$.data.pending_count" } }
          assert:
            - "ContactChannel.${ch1}.opt_in_status == OPTED_OUT"
            - "Notification.${n1}.delivery_status == SUPPRESSED"
            - "Alert.${a1}.pending_count == 0"
            - "Alert.${a1}.status == CLOSED"

      - name: cancel_suppresses_queued_then_recomputes_gateway_window
        grounds:
          - state_machines.Alert.SENT_to_CANCELLED
          - state_machines.Notification.QUEUED_to_SUPPRESSED
          - calculations.gateway_window_count
          - entities.Gateway.fields.window_count
        distinguishing_aspect: "Depth-2 chain from a DIFFERENT trigger (alert cancel): Alert CANCELLED -> its QUEUED notification SUPPRESSED -> Gateway.window_count recomputed to 0; distinct propagation from the opt-out chain."
        test_recipe:
          setup:
            - "Clock 2026-03-10T14:00:00Z; alert a1 dispatched to c1 (notification n1 left QUEUED — no tick); SMS gateway gw1 window_count=1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin, captures: { gw1: "$.data.id" } }
            - { call: "POST /contacts", payload: { full_name: "Eve", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550006" }, as: ContactAdmin, captures: { ch1: "$.data.id", tok1: "$.data.confirmation_token" } }
            - { call: "POST /channels/${ch1}/confirm", payload: { confirmation_token: "${tok1}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1" }
          trigger:
            - { call: "POST /alerts/${a1}/cancel", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { ast: "$.data.status" } }
            - { call: "GET /notifications", payload: { alert_id: "${a1}" }, as: Dispatcher, as_user_id: "disp1", captures: { nst: "$.data[0].delivery_status" } }
            - { call: "GET /gateways/${gw1}", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { wc: "$.data.window_count" } }
          assert:
            - "Alert.${a1}.status == CANCELLED"
            - "GET /notifications?alert_id=${a1} -> data[0].delivery_status == SUPPRESSED"
            - "Gateway.${gw1}.window_count == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
