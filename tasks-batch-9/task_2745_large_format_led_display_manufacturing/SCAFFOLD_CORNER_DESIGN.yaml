          The uniqueness scope is the whole module population, not the display model
          or the cabinet: a second module with the same serial_no is refused even
          when it is declared against a DIFFERENT DisplayModel, which is exactly
          where a per-model unique index would let the duplicate through.
        test_recipe:
          setup:
            - "Two DisplayModels ${dm} (FP10-IN) and ${dm2} (FP16-STD); module 'M-DUP' already exists against ${dm}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
