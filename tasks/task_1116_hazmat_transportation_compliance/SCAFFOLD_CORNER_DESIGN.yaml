        distinguishing_aspect: "Authorization (priority 2) beats existence (priority 3): CarrierAdmin calling the Regulator-only approve endpoint on a NON-EXISTENT carrier id gets ERR_INSUFFICIENT_PERMISSIONS (403), not 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
