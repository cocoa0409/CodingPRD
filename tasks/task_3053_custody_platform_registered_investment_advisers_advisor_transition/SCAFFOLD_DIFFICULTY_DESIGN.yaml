# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3053
# Custody Platform for RIAs & Advisor Transition
#
# 9 rule_id blocks, 28 instances total. Anchors (&c_*) are YAML-local fixtures
# reused verbatim by later instances; the unit-test-generator transcribes each
# instance's four blocks as a self-contained fixture.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: fee_household_aggregated_vs_per_account_variant
        grounds:
          - calculations.advisory_fee_household_aggregation
          - calculations.advisory_fee_household_aggregation.variants.HOUSEHOLD_AGGREGATED
          - calculations.advisory_fee_household_aggregation.variants.PER_ACCOUNT
          - calculations.household_fee_basis
          - entities.HouseholdAccount.fields.householding_consent
        distinguishing_aspect: "Two accounts of one household holding identical positions produce gross fees 890553 (HOUSEHOLD_AGGREGATED) and 941414 (PER_ACCOUNT) for the same 91-day period and the same 320000000-cent household basis — the two valid algorithms differ by 50861 cents on the money-movement domain of Household versus the per-account domain of HouseholdAccount."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm 'Bay Meridian Wealth Advisors' with an EXECUTED custody agreement and a GRANTED BILLING entitlement; firm_posture OPEN."
            - "Household 'Alvarez Family' with two OPEN billable INDIVIDUAL accounts: RIA-100001 holding a single VTI lot of 8000000000 micros at 250000000 micros (account_fee_basis_cents 200000000) and RIA-100002 holding a single VTI lot of 4800000000 micros at 250000000 micros (account_fee_basis_cents 120000000)."
            - "Both accounts consent OP_IN, so the household basis is 320000000 and C2 selects HOUSEHOLD_AGGREGATED."
            - "No FeeCredit rows exist for the household, so credit_applied_cents is 0 in both runs."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_firm
              call: "POST /ria/firms"
              payload: { legal_name: "Bay Meridian Wealth Advisors", crd_number: "CRD-118044", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { f_id: $.data.id }
            - &c_agr
              call: "POST /ria/firms/${f_id}/custody-agreements"
              payload: { adviser_crd_number: "CRD-118044" }
              as: AdvisorOperationsLead
              captures: { agr_draft_id: $.data.id }
            - &c_agr_submit
              call: "POST /ria/custody-agreements/${agr_draft_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
            - &c_agr_exec
              call: "POST /ria/firms/${f_id}/custody-agreements/execute"
              payload: {}
              as: CustodyOperationsOfficer
              captures: { agr_id: $.data.id }
            - &c_ent_bil
              call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "BILLING", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_bil_id: $.data.id }
            - &c_ent_bil_grant
              call: "POST /ria/firm-entitlements/${ent_bil_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - &c_house
              call: "POST /ria/households"
              payload: { firm_id: "${f_id}", household_name: "Alvarez Family" }
              as: AdvisorOperationsLead
              captures: { h_id: $.data.id }
            - &c_acct_a
              call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-100001", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_a_id: $.data.id }
            - &c_acct_a_act
              call: "POST /ria/accounts/${acct_a_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - &c_tx_a
              call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_a_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "ACAT" }
              as: AdvisorOperationsLead
              captures: { tx_a_id: $.data.id }
            - &c_lot_a
              call: "POST /ria/transfers/${tx_a_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 8000000000, sent_cost_basis_cents: 160000000, lot_inventory_date: "2021-03-15T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - &c_tx_a_out
              call: "POST /ria/assets/${tx_a_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - &c_tx_a_recv
              call: "POST /ria/assets/${tx_a_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
            - &c_acct_b
              call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-100002", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_b_id: $.data.id }
            - &c_acct_b_act
              call: "POST /ria/accounts/${acct_b_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - &c_tx_b
              call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_b_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "ACAT" }
              as: AdvisorOperationsLead
              captures: { tx_b_id: $.data.id }
            - &c_lot_b
              call: "POST /ria/transfers/${tx_b_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 4800000000, sent_cost_basis_cents: 96000000, lot_inventory_date: "2021-03-15T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - &c_tx_b_out
              call: "POST /ria/assets/${tx_b_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - &c_tx_b_recv
              call: "POST /ria/assets/${tx_b_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
          trigger:
            - call: "POST /ria/billing-runs"
              payload: { firm_id: "${f_id}", household_id: "${h_id}", period_start_date: "2026-09-01T00:00:00Z", period_end_date: "2026-12-01T00:00:00Z", fee_variant_used: "HOUSEHOLD_AGGREGATED", stated_invoice_cents: 890553 }
              as: AdvisorOperationsLead
              captures: { br1_id: $.data.id }
            - call: "PATCH /ria/accounts/${acct_a_id}"
              payload: { householding_consent: "OP_OUT" }
              as: AdvisorOperationsLead
            - call: "PATCH /ria/accounts/${acct_b_id}"
              payload: { householding_consent: "OP_OUT" }
              as: AdvisorOperationsLead
            - call: "POST /ria/billing-runs"
              payload: { firm_id: "${f_id}", household_id: "${h_id}", period_start_date: "2026-09-01T00:00:00Z", period_end_date: "2026-12-01T00:00:00Z", fee_variant_used: "PER_ACCOUNT", stated_invoice_cents: 941414 }
              as: AdvisorOperationsLead
              captures: { br2_id: $.data.id }
          assert:
            - "Household.${h_id}.household_fee_basis_cents == 320000000"
            - "FeeBillingRun.${br1_id}.period_days == 91"
            - "FeeBillingRun.${br1_id}.gross_fee_cents == 890553"
            - "FeeBillingRun.${br1_id}.net_fee_cents == 890553"
            - "FeeBillingRun.${br1_id}.billing_run_status == SETTLED"
            - "FeeBillingRun.${br2_id}.gross_fee_cents == 941414"
            - "FeeBillingRun.${br2_id}.gross_fee_cents - FeeBillingRun.${br1_id}.gross_fee_cents == 50861"

      - name: transfer_basis_graded_vs_full_carryover_variant
        grounds:
          - calculations.cost_basis_carryover
          - calculations.cost_basis_carryover.variants.GRADED_CARRYOVER
          - calculations.cost_basis_carryover.variants.FULL_CARRYOVER
          - state_machines.AssetTransfer.SUBMITTED_to_RECEIVED
          - entities.TransferLot.fields.basis_confidence_grade
        distinguishing_aspect: "The same two-lot payload carried by ACAT yields sent_basis_confidence HIGH and carryover_cents 3000000 (GRADED_CARRYOVER), while the identical payload carried by DIRECT_ROLLOVER yields carryover_cents 3600000 (FULL_CARRYOVER) — the dual variant sits on the AssetTransfer domain, where method selects the algorithm, not on the fee domain."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with an EXECUTED custody agreement, GRANTED TRADING_AUTHORIZATION entitlement, firm_posture OPEN."
            - "One household with two OPEN billable accounts RIA-200001 and RIA-200002, both empty."
          setup_api_calls:
            - *c_clock
            - *c_firm
            - *c_agr
            - *c_agr_submit
            - *c_agr_exec
            - &c_ent_tr
              call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "TRADING_AUTHORIZATION", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_tr_id: $.data.id }
            - &c_ent_tr_grant
              call: "POST /ria/firm-entitlements/${ent_tr_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *c_house
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-200001", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_g_id: $.data.id }
            - call: "POST /ria/accounts/${acct_g_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-200002", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_r_id: $.data.id }
            - call: "POST /ria/accounts/${acct_r_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
          trigger:
            - call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_g_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "ACAT" }
              as: AdvisorOperationsLead
              captures: { tx_g_id: $.data.id }
            - call: "POST /ria/transfers/${tx_g_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 4000000000, sent_cost_basis_cents: 1200000, lot_inventory_date: "2020-01-02T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/transfers/${tx_g_id}/lots"
              payload: { symbol: "BND", quantity_micros: 2000000000, sent_cost_basis_cents: 2400000, lot_inventory_date: "2025-12-31T00:00:00Z", valuation_price_micros: 90000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_g_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_g_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_r_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "DIRECT_ROLLOVER" }
              as: AdvisorOperationsLead
              captures: { tx_r_id: $.data.id }
            - call: "POST /ria/transfers/${tx_r_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 4000000000, sent_cost_basis_cents: 1200000, lot_inventory_date: "2020-01-02T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/transfers/${tx_r_id}/lots"
              payload: { symbol: "BND", quantity_micros: 2000000000, sent_cost_basis_cents: 2400000, lot_inventory_date: "2025-12-31T00:00:00Z", valuation_price_micros: 90000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_r_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_r_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "GET /ria/asset-transfers/${tx_g_id}"
              as: AdvisorOperationsLead
              captures: { grade_g: $.data.sent_basis_confidence, carry_g: $.data.carryover_cents }
            - call: "GET /ria/asset-transfers/${tx_r_id}"
              as: AdvisorOperationsLead
              captures: { grade_r: $.data.sent_basis_confidence, carry_r: $.data.carryover_cents }
          assert:
            - "AssetTransfer.${tx_g_id}.transfer_status == CREDITED"
            - "AssetTransfer.${tx_g_id}.sent_basis_confidence == HIGH"
            - "AssetTransfer.${tx_g_id}.carryover_cents == 1200000"
            - "AssetTransfer.${tx_g_id}.cost_basis_complete == false"
            - "AssetTransfer.${tx_r_id}.sent_basis_confidence == HIGH"
            - "AssetTransfer.${tx_r_id}.carryover_cents == 3600000"
            - "AssetTransfer.${tx_r_id}.carryover_cents - AssetTransfer.${tx_g_id}.carryover_cents == 2400000"
            - "GET /ria/asset-transfers/${tx_g_id}/lots returns VTI with basis_confidence_grade HIGH and BND with basis_confidence_grade MEDIUM"

      - name: block_allocate_then_round_vs_round_then_allocate_variant
        grounds:
          - calculations.block_trade_average_price_allocation
          - calculations.block_trade_average_price_allocation.variants.ALLOCATE_THEN_ROUND
          - calculations.block_trade_average_price_allocation.variants.ROUND_THEN_ALLOCATE
          - endpoints.POST_/ria/block-orders/{id}/allocation-preview
        distinguishing_aspect: "The same three-way split of a 1000000000-micro execution at 52375001 micros prices the block at 5237500 cents, but ALLOCATE_THEN_ROUND ceilings one allocation's independent cost to 5237501 cents while the ROUND_THEN_ALLOCATE preview never exceeds the block notional — the dual variant sits on the BlockAllocation domain, distinct from the Household fee and AssetTransfer basis domains."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement, GRANTED TRADING_AUTHORIZATION and MODEL_MANAGEMENT entitlements, firm_posture OPEN."
            - "Model 'Core Balanced' approved with target weights summing to 10000. Three OPEN accounts A1/A2/A3 each assigned to the model."
          setup_api_calls:
            - *c_clock
            - *c_firm
            - *c_agr
            - *c_agr_submit
            - *c_agr_exec
            - *c_ent_tr
            - *c_ent_tr_grant
            - &c_ent_mm
              call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "MODEL_MANAGEMENT", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_mm_id: $.data.id }
            - &c_ent_mm_grant
              call: "POST /ria/firm-entitlements/${ent_mm_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *c_house
            - &c_model
              call: "POST /ria/models"
              payload: { firm_id: "${f_id}", model_name: "Core Balanced" }
              as: AdvisorOperationsLead
              captures: { model_id: $.data.id }
            - call: "POST /ria/models/${model_id}/targets"
              payload: { symbol: "VTI", target_weight_bps: 6000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/models/${model_id}/targets"
              payload: { symbol: "BND", target_weight_bps: 4000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/models/${model_id}/approve"
              payload: {}
              as: InvestmentCommitteeChair
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-300001", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { a1_id: $.data.id }
            - call: "POST /ria/accounts/${a1_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-300002", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { a2_id: $.data.id }
            - call: "POST /ria/accounts/${a2_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-300003", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { a3_id: $.data.id }
            - call: "POST /ria/accounts/${a3_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "PUT /ria/accounts/${a1_id}/model"
              payload: { model_portfolio_id: "${model_id}" }
              as: AdvisorOperationsLead
            - call: "PUT /ria/accounts/${a2_id}/model"
              payload: { model_portfolio_id: "${model_id}" }
              as: AdvisorOperationsLead
            - call: "PUT /ria/accounts/${a3_id}/model"
              payload: { model_portfolio_id: "${model_id}" }
              as: AdvisorOperationsLead
          trigger:
            - call: "POST /ria/block-orders"
              payload: { firm_id: "${f_id}", model_id: "${model_id}", symbol: "VTI", side: "BUY", executed_share_micros: 1000000000, execution_price_micros: 52375001 }
              as: AdvisorOperationsLead
              captures: { blk_id: $.data.id }
            - call: "POST /ria/block-orders/${blk_id}/allocations"
              payload: { account_id: "${a1_id}", requested_share_micros: 333000000, allocation_rank: 1 }
              as: AdvisorOperationsLead
            - call: "POST /ria/block-orders/${blk_id}/allocations"
              payload: { account_id: "${a2_id}", requested_share_micros: 333000000, allocation_rank: 2 }
              as: AdvisorOperationsLead
            - call: "POST /ria/block-orders/${blk_id}/allocations"
              payload: { account_id: "${a3_id}", requested_share_micros: 334000001, allocation_rank: 3 }
              as: AdvisorOperationsLead
            - call: "POST /ria/block-orders/${blk_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/block-orders/${blk_id}/execute"
              payload: {}
              as: AdvisorOperationsLead
              captures: { blk_v: $.data.version }
            - call: "POST /ria/block-orders/${blk_id}/allocation-preview"
              payload: { executed_share_micros: 1000000000, execution_price_micros: 52375001 }
              as: AdvisorOperationsLead
              captures: { preview_total_cents: $.data.preview_notional_cents }
            - call: "POST /ria/block-orders/${blk_id}/allocate"
              payload: { expected_block_order_version: "${blk_v}" }
              as: AdvisorOperationsLead
          assert:
            - "BlockOrder.${blk_id}.block_status == ALLOCATED"
            - "BlockOrder.${blk_id}.unallocated_share_micros == 0"
            - "GET /ria/block-orders/${blk_id}/allocations returns A2 with share_micros 333000000 and allocated_cost_cents 1744088"
            - "GET /ria/block-orders/${blk_id}/allocations returns A3 with share_micros 334000000 and allocated_cost_cents 1749325"
            - "the sum of allocated_cost_cents over the block's allocations is 5237501, one cent above the block notional 5237500"
            - "the ROUND_THEN_ALLOCATE preview reports preview_notional_cents 5237500, which is 1 cent below the ALLOCATE_THEN_ROUND total"
            - "BlockAllocation.average_price_micros for A3 is 52375000 while A1 and A2 are 52375015"

      - name: money_movement_first_binding_vs_dominant_rule_variant
        grounds:
          - calculations.money_movement_verification
          - calculations.money_movement_verification.variants.FIRST_BINDING_RULE
          - calculations.money_movement_verification.variants.DOMINANT_RULE
          - endpoints.GET_/ria/accounts/{id}/money-movements/summary
        distinguishing_aspect: "On an IRA account whose standing instruction is not yet verified, the C7 read probe returns the entitlement-level withdrawal demand 0 (DOMINANT_RULE, largest of {0, 0}) while the authorization write path refuses at the first binding rule with ERR_STANDING_INSTRUCTION_NOT_VERIFIED — the two valid algorithms diverge on the MoneyMovementInstruction domain, distinct from the Household, AssetTransfer and BlockAllocation domains."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Firm with EXECUTED agreement, GRANTED TRADING_AUTHORIZATION and MONEY_MOVEMENT entitlements, firm_posture OPEN."
            - "One household; OPEN IRA account RIA-400001 hosting a single VTI lot of 4000000000 micros at 250000000 micros."
            - "A standing instruction on that account with periodic_limit_cents 500000, verification_status PENDING, consumed_period_cents 0."
            - "A drafted movement of 100000 cents with a blank authorization_note."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - *c_firm
            - *c_agr
            - *c_agr_submit
            - *c_agr_exec
            - &c_ent_mm2
              call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "MONEY_MOVEMENT", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_pay_id: $.data.id }
            - call: "POST /ria/firm-entitlements/${ent_pay_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *c_house
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-400001", account_type: "IRA", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_ira_id: $.data.id }
            - call: "POST /ria/accounts/${acct_ira_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_ira_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "DIRECT_ROLLOVER" }
              as: AdvisorOperationsLead
              captures: { tx_ira_id: $.data.id }
            - call: "POST /ria/transfers/${tx_ira_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 4000000000, sent_cost_basis_cents: 90000000, lot_inventory_date: "2019-06-01T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_ira_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_ira_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/accounts/${acct_ira_id}/standing-instructions"
              payload: { instruction_type: "THIRD_PARTY_DISBURSEMENT", payee_name: "Alvarez Charitable Trust", periodic_limit_cents: 500000 }
              as: AdvisorOperationsLead
              captures: { si_id: $.data.id, si_tok: $.data.verification_token }
            - call: "POST /ria/money-movements"
              payload: { account_id: "${acct_ira_id}", standing_instruction_id: "${si_id}", amount_cents: 100000, movement_type: "ACH_DISBURSEMENT", authorization_note: "" }
              as: AdvisorOperationsLead
              captures: { mm_id: $.data.id }
            - call: "POST /ria/money-movements/${mm_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
          trigger:
            - call: "GET /ria/accounts/${acct_ira_id}/money-movements/summary"
              as: AdvisorOperationsLead
              captures: { probe_withholding: "$.data[0].withheld_cents", probe_net: "$.data[0].net_disbursed_cents" }
            - call: "POST /ria/money-movements/${mm_id}/authorize"
              payload: {}
              as: Client
              as_user_id: "${h_id}"
