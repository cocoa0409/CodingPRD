      - name: disallowed_and_voided_and_requested_rows_are_excluded_from_the_rollup
        claim_type: input_set_filtering
        grounds:
          - calculations.grant_obligation_rollup
          - entities.GrantAward.fields.direct_obligated_cents
          - state_machines.Expenditure
        distinguishing_aspect: |
          The rollup declares its input set as status IN {CERTIFIED, OBLIGATED}. Four lines are staged so that each of the
          three excluded statuses is represented once — DISALLOWED, still-REQUESTED and VOIDED — and only one line is
          countable, so a rollup that summed all four, or that summed everything except REQUESTED, or that forgot to drop
          the voided line, would each produce a different direct_obligated_cents than the single lawful 85000.
        test_recipe:
          setup:
            - "One STATE_APPROVED ProgramOfStudy and one GrantAward for fiscal_year 2027 with allocation_cents 5000000."
            - "Four REQUESTED Expenditures: L1 CONSUMABLE 100000 x 1, L2 ENTERTAINMENT 40000 x 1, L3 CONSUMABLE 200000 x 1, L4 CONSUMABLE 100000 x 1."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
