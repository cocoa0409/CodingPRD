            - call: "POST /drone-ops/waivers/${wa}/safety-cases"
              payload: { mitigation_summary: "Chase vehicle and airspace observers.", ground_risk_class: 4, air_risk_class: "ARC_C", contingency_procedures: "Ditch to the corridor verge on C2 loss." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { sca: $.data.id, sail_a: $.data.sail_level }
            - call: "POST /drone-ops/waivers/${wa}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/waivers/${wa}/begin-review"
              payload: {}
              as: SafetyReviewer
              as_user_id: "sr-11"
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { vb: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "NIGHT", requested_ceiling_ft: 500, operation_description: "Night thermal survey of a substation.", expected_pilot_version: "${vb}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { wb: $.data.id }
            - call: "POST /drone-ops/waivers/${wb}/safety-cases"
              payload: { mitigation_summary: "Lit airframe, cordoned launch site, two observers.", ground_risk_class: 3, air_risk_class: "ARC_C", contingency_procedures: "Hover-hold then vertical recovery on link loss." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { scb: $.data.id, sail_b: $.data.sail_level }
            - call: "POST /drone-ops/waivers/${wb}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/waivers/${wb}/begin-review"
              payload: {}
              as: SafetyReviewer
              as_user_id: "sr-11"
          trigger:
            - call: "POST /drone-ops/waivers/${wa}/clear-safety-case"
              payload: { reviewer_findings: "Ground risk unmitigated for an urban corridor." }
              as: SafetyReviewer
              as_user_id: "sr-11"
              captures: { err_id: $.data.error_id }
            - call: "GET /drone-ops/waivers/${wa}"
              payload: {}
              as: SafetyReviewer
              as_user_id: "sr-11"
              captures: { wa_status: $.data.status, wa_rounds: $.data.revision_round }
            - call: "GET /drone-ops/safety-cases/${sca}"
              payload: {}
              as: SafetyReviewer
              as_user_id: "sr-11"
              captures: { sca_review: $.data.review_status, sca_by: $.data.cleared_by_user_id }
            - call: "POST /drone-ops/waivers/${wb}/clear-safety-case"
              payload: {}
              as: SafetyReviewer
              as_user_id: "sr-11"
              captures: { wb_status: $.data.status }
            - call: "GET /drone-ops/safety-cases/${scb}"
              payload: {}
              as: SafetyReviewer
              as_user_id: "sr-11"
              captures: { scb_review: $.data.review_status, scb_by: $.data.cleared_by_user_id }
          assert:
            - "${sail_a} == 6 == min(6, 4 + 2 + 1) and ${sail_b} == 5 == min(6, 3 + 2 + 0)"
            - "waiver A: HTTP 422 with ${err_id} == \"ERR_SAIL_LEVEL_UNACCEPTABLE\" - 6 > MAX_APPROVABLE_SAIL 5"
            - "the refusal is inert: ${wa_status} == \"UNDER_REVIEW\", ${wa_rounds} == 0, ${sca_review} == \"PENDING\" and ${sca_by} == null"
            - "waiver B: HTTP 200 with ${wb_status} == \"CLEARED\" - exactly 5 satisfies the <= comparison"
            - "${scb_review} == \"CLEARED\" and ${scb_by} == \"sr-11\" - the clearing reviewer is recorded, which is what later bars them from deciding the waiver"
            - "reviewer_findings is optional on this endpoint: waiver B cleared with no body fields at all"

      - name: waiver_actions_drive_the_review_state_machine
