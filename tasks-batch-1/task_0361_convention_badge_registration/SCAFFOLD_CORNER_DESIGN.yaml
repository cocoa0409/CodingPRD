scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_convention_returns_201_with_open_posture
        claim_type: Creation
        grounds:
          - entities.Convention
          - endpoints
        distinguishing_aspect: "POST /conventions with all required fields returns 201; posture defaults to OPEN and badges_issued_count to 0."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /conventions"
              payload: { name: "Fresh Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id, post: $.data.posture, cnt: $.data.badges_issued_count, v: $.data.version }
          assert:
            - "http 201"
            - "Convention.${conv_id}.posture == OPEN"
            - "Convention.${conv_id}.badges_issued_count == 0"
            - "Convention.${conv_id}.version == 1"
      - name: create_order_missing_line_items_returns_empty_order
        claim_type: Required Fields
        grounds:
          - entities.Order
          - errors[ERR_EMPTY_ORDER]
        distinguishing_aspect: "POST /orders with line_items=[] returns 422 ERR_EMPTY_ORDER (an order must have at least one line item)."
        test_recipe:
          setup:
            - "Convention with a GENERAL ticket type; an ACTIVE attendee"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Empty Order Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "emptyorder@x.com", full_name: "Empty Order" }
              as: Anonymous
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "http 422 with error_id == ERR_EMPTY_ORDER"
      - name: get_convention_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Convention
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /conventions/{id} with an unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /conventions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ConventionAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_NOT_FOUND"
      - name: duplicate_attendee_email_rejected_case_insensitive
        claim_type: Type Constraints
        grounds:
          - entities.Attendee.fields.email
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "Registering a second attendee with an email differing only in case returns 409 ERR_DUPLICATE_EMAIL."
        test_recipe:
          setup:
            - "an attendee already registered with email dup@x.com"
          setup_api_calls:
            - call: "POST /attendees"
              payload: { email: "dup@x.com", full_name: "First" }
              as: Anonymous
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /attendees"
              payload: { email: "DUP@x.com", full_name: "Second" }
              as: Anonymous
              captures: { eid: $.data.error_id }
          assert:
            - "http 409 with error_id == ERR_DUPLICATE_EMAIL"
      - name: duplicate_booth_code_within_convention_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Booth.fields.booth_code
          - errors[ERR_DUPLICATE_BOOTH_CODE]
        distinguishing_aspect: "Creating a second booth with the same booth_code in one convention returns 409 ERR_DUPLICATE_BOOTH_CODE."
        test_recipe:
          setup:
            - "a convention with a booth coded A1"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Booth Code Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/booths"
              payload: { booth_code: "A1", zone: "STANDARD" }
              as: ConventionAdmin
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /conventions/${conv_id}/booths"
              payload: { booth_code: "A1", zone: "PREMIUM" }
              as: ConventionAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "http 409 with error_id == ERR_DUPLICATE_BOOTH_CODE"
      - name: convention_end_before_start_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Convention.fields.event_end_utc
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Creating a convention with event_end_utc <= event_start_utc returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /conventions"
              payload: { name: "Bad Dates", event_start_utc: "2026-09-03T00:00:00Z", event_end_utc: "2026-09-01T00:00:00Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "http 422 with error_id == ERR_INVALID_REQUEST"
      - name: invalid_ticket_tier_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.TicketType.fields.tier
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Creating a ticket type with tier='PLATINUM' (not in the enum) returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "a convention"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Enum Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
          trigger:
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "PLATINUM", base_price_cents: 1000, tier_capacity: 10 }
              as: ConventionAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "http 422 with error_id == ERR_INVALID_REQUEST"
      - name: system_fields_generated_input_ignored_on_convention
        claim_type: System Fields
        grounds:
          - entities.Convention
        distinguishing_aspect: "id, created_at, version are server-minted on POST /conventions; version starts at 1 regardless of any client-supplied value."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /conventions"
              payload: { name: "Sys Fields Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id, v: $.data.version, ca: $.data.created_at }
          assert:
            - "Convention.${conv_id}.id is a server-minted UUID with no type prefix"
            - "Convention.${conv_id}.version == 1"
            - "Convention.${conv_id}.created_at is ISO 8601 UTC"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: pickup_from_already_picked_up_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Badge.ISSUED_to_PICKED_UP
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /badges/{id}/pickup on a badge already PICKED_UP returns 409 ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup:
            - "a PICKED_UP badge (paid, picked up once, clock in window)"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Idem Pickup Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 50 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "idempickup@x.com", full_name: "Idem Pickup" }
              as: Anonymous
              captures: { att_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 1 } ] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { conv_v: $.data.version }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_convention_version: "${conv_v}" }
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /badges?order_id=${order_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { badge_id: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /badges/${badge_id}/pickup"
              payload: {}
              as: RegistrationAgent
          trigger:
            - call: "POST /badges/${badge_id}/pickup"
              payload: {}
              as: RegistrationAgent
              captures: { eid: $.data.error_id }
          assert:
            - "http 409 with error_id == ERR_INVALID_STATE"
            - "Badge.${badge_id}.status == PICKED_UP (unchanged)"
      - name: print_before_pickup_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Badge.PICKED_UP_to_PRINTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /badges/{id}/print on an ISSUED (not yet PICKED_UP) badge returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "an ISSUED badge from a PAID order (never picked up)"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Print Order Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 50 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "printorder@x.com", full_name: "Print Order" }
              as: Anonymous
              captures: { att_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 1 } ] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { conv_v: $.data.version }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_convention_version: "${conv_v}" }
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /badges?order_id=${order_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { badge_id: "$.data[0].id" }
          trigger:
            - call: "POST /badges/${badge_id}/print"
              payload: {}
              as: RegistrationAgent
              captures: { eid: $.data.error_id }
          assert:
            - "http 409 with error_id == ERR_INVALID_STATE"
            - "Badge.${badge_id}.status == ISSUED (unchanged)"
      - name: cancel_paid_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Order.PENDING_PAYMENT_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /orders/{id}/cancel on a PAID order returns 409 ERR_INVALID_STATE (cancel is only defined from DRAFT/PENDING_PAYMENT; refund is the PAID path)."
        test_recipe:
          setup:
            - "a PAID order"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Cancel Paid Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 50 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "cancelpaid@x.com", full_name: "Cancel Paid" }
              as: Anonymous
              captures: { att_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 1 } ] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { conv_v: $.data.version }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_convention_version: "${conv_v}" }
              as: Attendee
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "http 409 with error_id == ERR_INVALID_STATE"
            - "Order.${order_id}.status == PAID (unchanged)"
      - name: refund_already_refunded_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order.PAID_to_REFUNDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /orders/{id}/refund on an already REFUNDED order (terminal) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "a REFUNDED order"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Refund Term Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 50 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "refundterm@x.com", full_name: "Refund Term" }
              as: Anonymous
              captures: { att_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 1 } ] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: Attendee
              as_user_id: "${att_id}"
              captures: { conv_v: $.data.version }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_convention_version: "${conv_v}" }
              as: Attendee
              as_user_id: "${att_id}"
            - call: "POST /orders/${order_id}/refund"
              payload: {}
              as: RegistrationAgent
          trigger:
            - call: "POST /orders/${order_id}/refund"
              payload: {}
              as: RegistrationAgent
              captures: { eid: $.data.error_id }
          assert:
            - "http 409 with error_id == ERR_INVALID_STATE"
            - "Order.${order_id}.status == REFUNDED (unchanged)"
      - name: new_order_starts_in_draft_state
        claim_type: Initial State
        grounds:
          - state_machines.Order
          - entities.Order.fields.status
        distinguishing_aspect: "A freshly created order has status == DRAFT and ticket_subtotal_cents == 0 before submit."
        test_recipe:
          setup:
            - "a convention with a GENERAL ticket type; an attendee"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Init Order Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 50, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /conventions/${conv_id}/ticket-types"
              payload: { tier: "GENERAL", base_price_cents: 9900, tier_capacity: 50 }
              as: ConventionAdmin
              captures: { tt_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "initorder@x.com", full_name: "Init Order" }
              as: Anonymous
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { convention_id: "${conv_id}", purchaser_attendee_id: "${att_id}", line_items: [ { ticket_type_id: "${tt_id}", quantity: 1 } ] }
              as: Attendee
              as_user_id: "${att_id}"
              captures: { order_id: $.data.id, st: $.data.status, sub: $.data.ticket_subtotal_cents }
          assert:
            - "Order.${order_id}.status == DRAFT"
            - "Order.${order_id}.ticket_subtotal_cents == 0"
      - name: lottery_run_marks_winners_and_losers_waterfall
        claim_type: Valid Transition
        grounds:
          - state_machines.WaitlistEntry.ENTERED_to_WON
          - state_machines.WaitlistEntry.ENTERED_to_LOST
          - calculations.lottery_allocation
        distinguishing_aspect: "Run-lottery on capacity 10 with entries (req 4, req 8, req 3) sorted by score grants 4 then skips 8 (all-or-nothing, would exceed) then grants 3 — the req-8 entry is LOST while the smaller req-3 entry WON."
        test_recipe:
          setup:
            - "Convention total_badge_capacity=10, badges_issued_count=0"
            - "Three ENTERED waitlist entries: E1 PLATINUM/late/gs2 (score 310) req 4; E2 GOLD/early/gs4 (score 270) req 8; E3 SILVER/early/gs20 (score 210) req 3"
          setup_api_calls:
            - call: "POST /conventions"
              payload: { name: "Lottery Run Con", event_start_utc: "2026-09-01T00:00:00Z", event_end_utc: "2026-09-03T23:59:59Z", total_badge_capacity: 10, lottery_open_utc: "2026-06-01T00:00:00Z" }
              as: ConventionAdmin
              captures: { conv_id: $.data.id }
            - call: "POST /attendees"
              payload: { email: "lr_p@x.com", full_name: "LR P", loyalty_tier: "PLATINUM" }
              as: Anonymous
              captures: { att_p: $.data.id }
            - call: "POST /attendees"
              payload: { email: "lr_g@x.com", full_name: "LR G", loyalty_tier: "GOLD" }
              as: Anonymous
              captures: { att_g: $.data.id }
            - call: "POST /attendees"
              payload: { email: "lr_s@x.com", full_name: "LR S", loyalty_tier: "SILVER" }
              as: Anonymous
              captures: { att_s: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: ConventionAdmin
            - call: "POST /conventions/${conv_id}/waitlist"
              payload: { attendee_id: "${att_p}", requested_quantity: 4, group_size: 2 }
              as: Attendee
              as_user_id: "${att_p}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T06:00:00Z" }
              as: ConventionAdmin
            - call: "POST /conventions/${conv_id}/waitlist"
              payload: { attendee_id: "${att_g}", requested_quantity: 8, group_size: 4 }
              as: Attendee
              as_user_id: "${att_g}"
              captures: { e2: $.data.id }
            - call: "POST /conventions/${conv_id}/waitlist"
              payload: { attendee_id: "${att_s}", requested_quantity: 3, group_size: 20 }
              as: Attendee
              as_user_id: "${att_s}"
              captures: { e3: $.data.id }
            - call: "GET /conventions/${conv_id}"
              payload: {}
              as: ConventionAdmin
              captures: { conv_v: $.data.version }
          trigger:
            - call: "POST /conventions/${conv_id}/run-lottery"
              payload: { expected_convention_version: "${conv_v}" }
              as: ConventionAdmin
          assert:
            - "WaitlistEntry.${e1}.status == WON"
            - "WaitlistEntry.${e2}.status == LOST"
            - "WaitlistEntry.${e3}.status == WON"
      - name: badge_transfer_increments_count_no_status_change
        claim_type: Valid Transition
        grounds:
          - entities.Badge.fields.holder_attendee_id
          - entities.Badge.fields.transfer_count
        distinguishing_aspect: "POST /badges/{id}/transfer updates holder_attendee_id, increments transfer_count to 1, and leaves status == ISSUED."
        test_recipe:
          setup:
            - "an ISSUED badge held by attendee A; attendee B exists"
          setup_api_calls:
            - call: "POST /conventions"
