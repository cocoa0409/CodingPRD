  # ============================================================= endpoints ====
  - section: endpoints
    instances:
      - name: package_create_supersedes_assembling_sibling
        claim_type: side_effect_execution
        grounds:
          - state_machines.SubmissionPackage.ASSEMBLING_to_SUPERSEDED
          - "concurrency_rules[package-create-stale-title-version]"
        distinguishing_aspect: "Creating a second package for the same (title, platform) while the first is ASSEMBLING flips the first to SUPERSEDED and the newcomer computes round 1 (superseded packages do not count); the plan stays LOCKED because the new package references it."
        test_recipe:
          setup: ["Title IN_DEVELOPMENT; plan APPROVED; build CANDIDATE; PKG1 ASSEMBLING (title version advanced by its creation)"]
