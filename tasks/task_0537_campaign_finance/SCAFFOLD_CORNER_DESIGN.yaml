scaffold_corner_design:

  # ===================================================================
  - section: entities
    instances:
      - name: committee_create_persists_all_fields
        claim_type: Creation
        grounds: [entities.Committee, endpoints]
        distinguishing_aspect: "POST /disclosure/committees with all required fields -> 201; status PENDING, derived totals 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegulatorAuditor
          trigger:
            - call: "POST /disclosure/committees"
              payload: { name: "Nu", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id, st: $.data.status, tr: $.data.total_receipts_cents, ver: $.data.version }
          assert:
            - "st == PENDING; tr == 0; ver == 1; id is a bare UUID (no prefix)"

      - name: committee_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Committee.fields.status, entities.Committee.fields.total_receipts_cents]
        distinguishing_aspect: "Client-supplied status/total_receipts_cents in the create body are ignored; server sets PENDING and 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /disclosure/committees"
              payload: { name: "Xi", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { st: $.data.status, tr: $.data.total_receipts_cents }
          assert:
            - "st == PENDING and tr == 0 regardless of any client-supplied values"

      - name: committee_list_pagination
        claim_type: Listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /disclosure/committees returns an array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["two committees registered"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "C1", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
            - call: "POST /disclosure/committees"
              payload: { name: "C2", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
          trigger:
            - call: "GET /disclosure/committees"
              as: PublicViewer
          trigger_note: "limit=1 offset=0 query params"
          assert:
            - "response_type == array; meta.total_count >= 2; has_more reflects the page window"

      - name: contribution_computed_matchable
        claim_type: Computed Fields
        grounds: [entities.Contribution.fields.matchable_amount_cents, calculations.report_matching_funds]
        distinguishing_aspect: "matchable_amount_cents = min(amount_cents, 20000) for INDIVIDUAL; a 50000 INDIVIDUAL gift yields matchable 20000 (capped)."
        test_recipe:
          setup: ["committee ACTIVE"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "Om", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
          trigger:
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 50000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { m: $.data.matchable_amount_cents }
          assert:
            - "m == 20000 (min(50000, MATCH_CAP_CENTS))"

      - name: expenditure_created_has_no_version_field
        claim_type: Immutability
        grounds: [entities.Expenditure]
        distinguishing_aspect: "Expenditure (common_fields:false) is created with id/created_at only; no version and no update endpoint."
        test_recipe:
          setup: ["committee ACTIVE"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "Pi", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
          trigger:
            - call: "POST /disclosure/committees/${cid}/expenditures"
              payload: { payee_name: "Vendor", amount_cents: 10000, expenditure_date: "2026-02-20T00:00:00Z", purpose: "print" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { eid: $.data.id }
          assert:
            - "expenditure created with id and created_at; response carries no version field"

      - name: committee_get_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_COMMITTEE_NOT_FOUND]"]
        distinguishing_aspect: "GET a non-existent committee id -> ERR_COMMITTEE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /disclosure/committees/00000000-0000-0000-0000-000000000000"
              as: PublicViewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMMITTEE_NOT_FOUND; HTTP 404"

      - name: committee_create_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Committee.fields.committee_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST committee omitting committee_type -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /disclosure/committees"
              payload: { name: "NoType", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION; HTTP 422"

      - name: committee_create_invalid_enum_committee_type
        claim_type: Type Constraints
        grounds: [entities.Committee.fields.committee_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "committee_type not in {CANDIDATE,PAC,PARTY} -> ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /disclosure/committees"
              payload: { name: "Bad", committee_type: "SUPERPAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION; HTTP 422"

      - name: contribution_fk_committee_not_found
        claim_type: Parent Relationships
        grounds: [entities.Contribution.fields.committee_id, "errors[ERR_COMMITTEE_NOT_FOUND]"]
        distinguishing_aspect: "POST contribution under a non-existent committee id -> ERR_COMMITTEE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /disclosure/committees/00000000-0000-0000-0000-000000000000/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 5000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMMITTEE_NOT_FOUND; HTTP 404"

      - name: report_create_period_not_found
        claim_type: Parent Relationships
        grounds: [entities.Report.fields.period_id, "errors[ERR_PERIOD_NOT_FOUND]"]
        distinguishing_aspect: "POST report with a body period_id that does not exist -> ERR_PERIOD_NOT_FOUND."
        test_recipe:
          setup: ["committee ACTIVE"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "Rho", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "00000000-0000-0000-0000-000000000000", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERIOD_NOT_FOUND; HTTP 404"

  # ===================================================================
  - section: state_machines
    instances:
      - name: committee_approve_when_active_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Committee.PENDING_to_ACTIVE, "errors[ERR_COMMITTEE_NOT_PENDING]"]
        distinguishing_aspect: "Approving an already-ACTIVE committee -> ERR_COMMITTEE_NOT_PENDING."
        test_recipe:
          setup: ["committee ACTIVE"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "Sig", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
          trigger:
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMMITTEE_NOT_PENDING; HTTP 409"

      - name: committee_terminated_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Committee, "errors[ERR_COMMITTEE_NOT_ACTIVE]"]
        distinguishing_aspect: "From terminal TERMINATED, suspend is rejected (no transitions out of a terminal state)."
        test_recipe:
          setup: ["committee TERMINATED"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "Tau", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/committees/${cid}/terminate"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /disclosure/committees/${cid}/suspend"
              payload: {}
              as: RegulatorAuditor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMMITTEE_NOT_ACTIVE; HTTP 409 (terminal TERMINATED admits no transition)"

      - name: contribution_deposit_twice_rejected
        claim_type: Idempotency
        grounds: [state_machines.Contribution.RECORDED_to_DEPOSITED, "errors[ERR_CONTRIBUTION_NOT_RECORDED]"]
        distinguishing_aspect: "Depositing an already-DEPOSITED contribution -> ERR_CONTRIBUTION_NOT_RECORDED on the second call."
        test_recipe:
          setup: ["committee ACTIVE; one RECORDED contribution"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "Ups", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 5000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { con: $.data.id }
            - call: "POST /disclosure/contributions/${con}/deposit"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /disclosure/contributions/${con}/deposit"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONTRIBUTION_NOT_RECORDED; HTTP 409"

      - name: contribution_clear_without_flag_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Contribution.FLAGGED_to_CLEARED, "errors[ERR_CONTRIBUTION_REVIEW_INVALID]"]
        distinguishing_aspect: "Clearing an UNREVIEWED contribution -> ERR_CONTRIBUTION_REVIEW_INVALID (clear requires FLAGGED)."
        test_recipe:
          setup: ["committee ACTIVE; one UNREVIEWED contribution"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "Phi", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 5000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { con: $.data.id }
          trigger:
            - call: "POST /disclosure/contributions/${con}/clear"
              payload: {}
              as: RegulatorAuditor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONTRIBUTION_REVIEW_INVALID; HTTP 409"

      - name: report_file_when_not_draft_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Report.DRAFT_to_FILED, "errors[ERR_REPORT_NOT_DRAFT]"]
        distinguishing_aspect: "Filing an already-FILED report -> ERR_REPORT_NOT_DRAFT."
        test_recipe:
          setup: ["a FILED report (on-time)"]
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Chi", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
            - call: "POST /disclosure/reports/${rid}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /disclosure/reports/${rid}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REPORT_NOT_DRAFT; HTTP 409"

      - name: report_audit_close_without_open_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Report.UNDER_AUDIT_to_FILED, "errors[ERR_REPORT_NOT_UNDER_AUDIT]"]
        distinguishing_aspect: "audit-close on a FILED (not UNDER_AUDIT) report -> ERR_REPORT_NOT_UNDER_AUDIT."
        test_recipe:
          setup: ["a FILED report (on-time)"]
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "Psi", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
            - call: "POST /disclosure/reports/${rid}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /disclosure/reports/${rid}/audit-close"
              payload: {}
              as: RegulatorAuditor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REPORT_NOT_UNDER_AUDIT; HTTP 409"

      - name: period_close_twice_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.ReportingPeriod.OPEN_to_CLOSED, "errors[ERR_PERIOD_NOT_OPEN]"]
        distinguishing_aspect: "Closing an already-CLOSED reporting period -> ERR_PERIOD_NOT_OPEN."
        test_recipe:
          setup: ["a CLOSED reporting period"]
          setup_api_calls:
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
          trigger:
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERIOD_NOT_OPEN; HTTP 409"

      - name: activity_void_twice_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.LobbyingActivity.RECORDED_to_VOIDED, "errors[ERR_ACTIVITY_NOT_VOIDABLE]"]
        distinguishing_aspect: "Voiding an already-VOIDED activity -> ERR_ACTIVITY_NOT_VOIDABLE (VOIDED is terminal)."
        test_recipe:
          setup: ["registrant ACTIVE; client ACTIVE; period OPEN; one RECORDED activity then VOIDED"]
          setup_api_calls:
            - call: "POST /disclosure/registrants"
              payload: { name: "L", registrant_contact: "c", jurisdiction: "CA" }
              as: LobbyRegistrant
              captures: { rgid: $.data.id }
            - call: "POST /disclosure/registrants/${rgid}/clients"
              payload: { client_name: "C" }
              as: LobbyRegistrant
              as_user_id: "${rgid}"
              captures: { clid: $.data.id }
            - call: "POST /disclosure/lobbying-periods"
              payload: { jurisdiction: "CA", period_label: "LP1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { lp: $.data.id }
            - call: "POST /disclosure/registrants/${rgid}/activities"
              payload: { client_id: "${clid}", period_id: "${lp}", lobbyist_name: "L", subject: "S", amount_cents: 5000, activity_date: "2026-02-01T00:00:00Z" }
              as: LobbyRegistrant
              as_user_id: "${rgid}"
              captures: { act: $.data.id }
            - call: "POST /disclosure/activities/${act}/void"
              payload: {}
              as: LobbyRegistrant
              as_user_id: "${rgid}"
          trigger:
            - call: "POST /disclosure/activities/${act}/void"
              payload: {}
              as: LobbyRegistrant
              as_user_id: "${rgid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACTIVITY_NOT_VOIDABLE; HTTP 409"

      - name: report_amend_creates_supersede_revision
        claim_type: Side Effect Execution
        grounds: [state_machines.Report.FILED_to_SUPERSEDED, entities.Report.fields.supersedes_report_id, entities.Report.fields.amendment_seq]
        distinguishing_aspect: "Amending a FILED report sets old->SUPERSEDED and creates a DRAFT with amendment_seq 1 and supersedes_report_id==old.id, discoverable via /revisions."
        test_recipe:
          setup: ["a FILED report (on-time)"]
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "AmendCo", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
            - call: "POST /disclosure/reports/${rid}/file"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /disclosure/reports/${rid}/amend"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
              captures: { newid: $.data.id, seq: $.data.amendment_seq, sup: $.data.supersedes_report_id }
            - call: "GET /disclosure/reports/${rid}"
              as: Treasurer
              captures: { oldstatus: $.data.status }
          assert:
            - "oldstatus == SUPERSEDED; seq == 1; sup == ${rid}"
            - "GET /disclosure/reports/${rid}/revisions returns an array containing the amendment ${newid}"

  # ===================================================================
  - section: calculations
    instances:
      - name: late_penalty_medium_tier
        claim_type: Constants Applied
        grounds: [calculations.late_filing_penalty]
        distinguishing_aspect: "MEDIUM tier (receipts 1000000, per_day 5000): 3 days late -> penalty 2500 + 5000*3 = 17500."
        test_recipe:
          setup: ["committee PARTY ACTIVE; period CLOSED deadline 2026-04-15; clock 2026-04-18 (3 late); one DEPOSITED 1000000"]
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-18T00:00:00Z" }
