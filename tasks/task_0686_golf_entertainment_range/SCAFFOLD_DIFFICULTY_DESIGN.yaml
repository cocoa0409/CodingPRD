  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_back_to_back_allowed_overlap_rejected_on_bay
        grounds:
          - validations[priority=7]
          - state_machines.Reservation.HOLD_to_CONFIRMED
          - entities.Reservation.fields.start_utc
          - entities.Reservation.fields.end_utc
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on the Bay resource via Reservation:
          a reservation starting exactly when a CONFIRMED one ends (back-to-back, gap 0)
          is allowed, but a reservation overlapping by even one minute is rejected with
          ERR_BAY_WINDOW_CONFLICT. Adjacency is permitted.
