# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_0121_quality_management_system  —  Expert tier
# BREADTH probe. Walks references/claim-extraction-guide.md section-by-section
# against SCAFFOLD.yaml §1.1–§1.7. Every instance grounds in declared elements;
# corners already exercised by a §1.8 instance are emitted as excluded_because
# stubs (no test_recipe). Names are unique across the UNION of §1.8 + §1.9.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section 1 — From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      # ---- Creation (happy-path 201 + persisted fields) ----
      - name: create_supplier_returns_201_defaults_applied
        claim_type: creation
        grounds:
          - entities.Supplier.fields.name
          - entities.Supplier.fields.code
          - entities.Supplier.fields.quality_rating
          - entities.Supplier.fields.approval_status
        distinguishing_aspect: "POST /suppliers with name+code returns 201 with server defaults quality_rating==100.00, approval_status==APPROVED and every counter==0; computed fields ignore any client input."
        test_recipe:
          setup:
            - "Empty DB; a QualityManager operator acts."
          setup_api_calls: []
          trigger:
            - call: "POST /suppliers"
              payload: { name: "Acme Parts", code: "ACME-1" }
              as: QualityManager
              captures: { sup_id: $.data.id }
          assert:
            - "response_type == object"
            - "http_status == 201"
            - "Supplier.${sup_id}.name == Acme Parts"
            - "Supplier.${sup_id}.code == ACME-1"
            - "Supplier.${sup_id}.quality_rating == 100.00"
            - "Supplier.${sup_id}.approval_status == APPROVED"
            - "Supplier.${sup_id}.open_scar_count == 0"
            - "Supplier.${sup_id}.lots_inspected == 0"
            - "Supplier.${sup_id}.lots_rejected == 0"
            - "Supplier.${sup_id}.ncrs_attributed == 0"
            - "Supplier.${sup_id}.version == 1"

      - name: create_ncr_returns_201_in_draft
        claim_type: creation
        grounds:
          - entities.NonconformanceReport.fields.title
          - entities.NonconformanceReport.fields.source
          - entities.NonconformanceReport.fields.status
          - entities.NonconformanceReport.fields.created_by_personnel_id
          - entities.NonconformanceReport.fields.budget_reserved_cents
        distinguishing_aspect: "POST /nonconformance-reports returns 201 with status==DRAFT, budget_reserved_cents==0, and created_by_personnel_id stamped from X-User-ID."
        test_recipe:
          setup:
            - "A QualityEngineer Personnel and a Supplier exist."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Create", email: "qecreate@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Create Co", code: "CRT-NCR" }
              as: QualityManager
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /nonconformance-reports"
              payload: { title: "Bent flange", source: "SUPPLIER", severity: "MAJOR", defect_qty: 3, unit_cost_cents: 500, part_number: "P-NCR", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
          assert:
            - "http_status == 201"
            - "NonconformanceReport.${ncr_id}.status == DRAFT"
            - "NonconformanceReport.${ncr_id}.disposition == null"
            - "NonconformanceReport.${ncr_id}.budget_reserved_cents == 0"
            - "NonconformanceReport.${ncr_id}.created_by_personnel_id == ${qe_id}"

      # ---- Retrieval ----
      - name: get_supplier_returns_stored_entity
        claim_type: retrieval
        grounds:
          - entities.Supplier.fields.code
        distinguishing_aspect: "GET /suppliers/{id} returns the entity whose id matches with stored field values (code) intact."
        test_recipe:
          setup:
            - "A Supplier exists."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "Get Co", code: "GET-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
          trigger:
            - call: "GET /suppliers/${sup_id}"
              payload: {}
              as: QualityManager
          assert:
            - "http_status == 200"
            - "Supplier.${sup_id}.code == GET-SUP"

      # ---- Listing + pagination ----
      - name: list_ncrs_paginated_envelope
        claim_type: listing
        grounds:
          - entities.NonconformanceReport.fields.supplier_id
        distinguishing_aspect: "GET /nonconformance-reports?limit=1 returns response_type==array with pagination fields total_count and has_more reflecting more than one stored NCR."
        test_recipe:
          setup:
            - "A QualityEngineer and a Supplier exist; two DRAFT NCRs are created for that supplier."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE List", email: "qelist@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "List Co", code: "LST-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "ncr 1", source: "SUPPLIER", severity: "MINOR", defect_qty: 1, unit_cost_cents: 100, part_number: "P-L", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports"
              payload: { title: "ncr 2", source: "SUPPLIER", severity: "MINOR", defect_qty: 1, unit_cost_cents: 100, part_number: "P-L", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "GET /nonconformance-reports"
              payload: { supplier_id: "${sup_id}", limit: 1, offset: 0 }
              as: QualityManager
          assert:
            - "response_type == array"
            - "http_status == 200"
            - "data.total_count == 2"
            - "data.has_more == true"
            - "len(data.items) == 1"

      # ---- Not Found ----
      - name: get_supplier_nonexistent_id_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /suppliers/{id} with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB except an operator."
          setup_api_calls: []
          trigger:
            - call: "GET /suppliers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      # ---- Required Fields ----
      - name: create_ncr_missing_severity_invalid_request
        claim_type: required_fields
        grounds:
          - entities.NonconformanceReport.fields.severity
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /nonconformance-reports omitting the required severity field returns ERR_INVALID_REQUEST (400); severity has source:input and no default."
        test_recipe:
          setup:
            - "A QualityEngineer and a Supplier exist."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Req", email: "qereq@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Req Co", code: "REQ-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /nonconformance-reports"
              payload: { title: "no severity", source: "SUPPLIER", defect_qty: 1, unit_cost_cents: 100, part_number: "P-RQ", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      # ---- Defaults ----
      - name: create_inspection_plan_default_level_gii
        claim_type: defaults
        grounds:
          - entities.InspectionPlan.fields.inspection_level
          - entities.InspectionPlan.fields.severity_mode
          - entities.InspectionPlan.fields.consecutive_rejects
          - entities.InspectionPlan.fields.needs_review
        distinguishing_aspect: "POST /inspection-plans omitting inspection_level applies the declared default GII; severity_mode defaults NORMAL, consecutive_rejects 0, needs_review false."
        test_recipe:
          setup:
            - "A ControlPlan exists."
          setup_api_calls:
            - call: "POST /control-plans"
              payload: { name: "CP Def", part_number: "P-DEF" }
              as: QualityManager
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /inspection-plans"
              payload: { name: "IP Def", control_plan_id: "${cp_id}", part_number: "P-DEF", lot_size: 120, aql_pct: 4.0 }
              as: QualityManager
              captures: { ip_id: $.data.id }
          assert:
            - "http_status == 201"
            - "InspectionPlan.${ip_id}.inspection_level == GII"
            - "InspectionPlan.${ip_id}.severity_mode == NORMAL"
            - "InspectionPlan.${ip_id}.consecutive_rejects == 0"
            - "InspectionPlan.${ip_id}.needs_review == false"

      - name: create_ncr_default_rework_hours_zero
        claim_type: defaults
        grounds:
          - entities.NonconformanceReport.fields.rework_hours
        distinguishing_aspect: "POST /nonconformance-reports omitting rework_hours applies the declared default 0."
        test_recipe:
          setup:
            - "A QualityEngineer and a Supplier exist."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Dr", email: "qedr@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Dr Co", code: "DR-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /nonconformance-reports"
              payload: { title: "no rework", source: "SUPPLIER", severity: "MAJOR", defect_qty: 1, unit_cost_cents: 100, part_number: "P-DR", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
          assert:
            - "http_status == 201"
            - "NonconformanceReport.${ncr_id}.rework_hours == 0"

      # ---- Computed Fields ----
      - name: computed_ncr_cost_of_quality_rework_critical_ignores_client
        claim_type: computed_fields
        grounds:
          - entities.NonconformanceReport.fields.cost_of_quality_cents
          - entities.NonconformanceReport.fields.budget_reserved_cents
          - calculations.ncr_cost_of_quality
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
        distinguishing_aspect: "On disposition REWORK with severity CRITICAL (weight 1.5), cost_of_quality_cents is computed server-side: labour_cents_per_unit=round_half_up(1.0*6000)=6000, per-line=round_half_up(6000*1.5)=9000, sum over defect_qty=2 = 18000; budget re-reserved to 18000."
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager Personnel and a Supplier exist."
            - "A SUPPLIER NCR (severity=CRITICAL, defect_qty=2, unit_cost_cents=1000, rework_hours=1.0) is OPEN."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Cf", email: "qecf@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM Cf", email: "qmcf@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Cf Co", code: "CF-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "critical rework", source: "SUPPLIER", severity: "CRITICAL", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-CF", supplier_id: "${sup_id}", rework_hours: 1.0 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { coq: $.data.cost_of_quality_cents }
          assert:
            - "NonconformanceReport.${ncr_id}.disposition == REWORK"
            - "NonconformanceReport.${ncr_id}.cost_of_quality_cents == 18000"
            - "NonconformanceReport.${ncr_id}.budget_reserved_cents == 18000"

      - name: computed_budget_reserved_on_open_equals_qty_times_unit_cost
        claim_type: computed_fields
        grounds:
          - entities.NonconformanceReport.fields.budget_reserved_cents
          - state_machines.NonconformanceReport.DRAFT_to_OPEN
        distinguishing_aspect: "On NCR DRAFT->OPEN the side-effect reserves budget_reserved_cents = defect_qty*unit_cost_cents = 4*1000 = 4000, computed server-side independent of any client value."
        test_recipe:
          setup:
            - "A QualityEngineer and a Supplier exist; a SUPPLIER NCR (defect_qty=4, unit_cost_cents=1000) is in DRAFT."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Bg", email: "qebg@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Bg Co", code: "BG-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "budget ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 4, unit_cost_cents: 1000, part_number: "P-BG", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          assert:
            - "NonconformanceReport.${ncr_id}.status == OPEN"
            - "NonconformanceReport.${ncr_id}.budget_reserved_cents == 4000"

      # ---- System Fields ----
      - name: system_fields_generated_on_supplier_create
        claim_type: system_fields
        grounds:
          - entities.Supplier.fields.quality_rating
        distinguishing_aspect: "id/created_at/updated_at/version are server-minted on POST /suppliers (input is only name+code, so the client has no channel to set them): version starts at 1 and the computed quality_rating is 100.00."
        test_recipe:
          setup:
            - "Empty DB except operator."
          setup_api_calls: []
          trigger:
            - call: "POST /suppliers"
              payload: { name: "Sys Co", code: "SYS-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id, sup_ver: $.data.version }
          assert:
            - "http_status == 201"
            - "Supplier.${sup_id}.version == 1"
            - "Supplier.${sup_id}.quality_rating == 100.00"

      # ---- Type Constraints ----
      - name: create_ncr_invalid_source_enum_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.NonconformanceReport.fields.source
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /nonconformance-reports with source outside {SUPPLIER, INTERNAL, AUDIT} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A QualityEngineer exists."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE En", email: "qeen@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
          trigger:
            - call: "POST /nonconformance-reports"
              payload: { title: "bad source", source: "WHATEVER", severity: "MAJOR", defect_qty: 1, unit_cost_cents: 100, part_number: "P-EN" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_ncr_negative_defect_qty_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.NonconformanceReport.fields.defect_qty
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /nonconformance-reports with defect_qty=0 violates the constraint >= 1 and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A QualityEngineer and a Supplier exist."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Ng", email: "qeng@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Ng Co", code: "NG-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /nonconformance-reports"
              payload: { title: "zero qty", source: "SUPPLIER", severity: "MAJOR", defect_qty: 0, unit_cost_cents: 100, part_number: "P-NG", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      # ---- Immutability (common_fields:false entity) ----
      - name: eightdstep_is_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.EightDStep.fields.discipline
          - entities.EightDStep.fields.capa_id
        distinguishing_aspect: "EightDStep has common_fields:false — it carries only id+created_at (no version field) and exposes no update endpoint; the created step is read back only via GET /capas/{id}/steps."
        test_recipe:
          setup:
            - "A QualityEngineer, an independent QualityManager, a Supplier, a DISPOSITIONED NCR and an OPEN CAPA exist."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Im", email: "qeim@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM Im", email: "qmim@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Im Co", code: "IM-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "im ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 5, unit_cost_cents: 1000, part_number: "P-IM", supplier_id: "${sup_id}", rework_hours: 2.0 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm_id}"
            - call: "POST /capas"
              payload: { ncr_id: "${ncr_id}", title: "im 8d" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { capa_id: $.data.id }
          trigger:
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D1", narrative: "team formed" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { step_id: $.data.id }
            - call: "GET /capas/${capa_id}/steps"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          assert:
            - "http_status == 201"
            - "EightDStep.${step_id}.discipline == D1"
            - "EightDStep.${step_id}.capa_id == ${capa_id}"
            - "len(data.items) == 1"

      # ---- Parent Relationships / FK integrity ----
      - name: create_capa_nonexistent_ncr_fk_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Capa.fields.ncr_id
          - validations[priority=4]
          - errors[ERR_FK_NOT_FOUND]
        distinguishing_aspect: "POST /capas whose body ncr_id (FK -> NonconformanceReport.id) does not resolve returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "A QualityEngineer exists; no NCR with the supplied id exists."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Fk", email: "qefk@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
          trigger:
            - call: "POST /capas"
              payload: { ncr_id: "00000000-0000-4000-8000-000000000001", title: "orphan capa" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 404"
            - "data.error_id == ERR_FK_NOT_FOUND"

      # ---- graph topology: cross-aggregate FK integrity ----
      - name: create_ncr_supplier_source_nonexistent_supplier_fk_not_found
        claim_type: parent_relationships
        grounds:
          - entities.NonconformanceReport.fields.supplier_id
          - validations[priority=4]
          - errors[ERR_FK_NOT_FOUND]
        distinguishing_aspect: "Graph topology: POST /nonconformance-reports with source=SUPPLIER and a non-resolving supplier_id (FK -> Supplier.id) returns ERR_FK_NOT_FOUND (404) — cross-aggregate FK integrity is enforced."
        test_recipe:
          setup:
            - "A QualityEngineer exists; no Supplier with the supplied id exists."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Xf", email: "qexf@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
          trigger:
            - call: "POST /nonconformance-reports"
              payload: { title: "orphan ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 1, unit_cost_cents: 100, part_number: "P-XF", supplier_id: "00000000-0000-4000-8000-000000000002" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 404"
            - "data.error_id == ERR_FK_NOT_FOUND"

  # ===========================================================================
  # Section 2 — From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      # ---- Initial State ----
      - name: ncr_initial_state_draft
        claim_type: initial_state
        grounds:
          - state_machines.NonconformanceReport
          - entities.NonconformanceReport.fields.status
        distinguishing_aspect: "A newly created NonconformanceReport starts in initial_state DRAFT with disposition null."
        test_recipe:
          setup:
            - "A QualityEngineer and a Supplier exist."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Is", email: "qeis@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
