      - name: mark_reprinted_requires_reprint_pending_and_clears_stale_flags
        claim_type: Conditional action
        grounds:
          - endpoints["POST /beverage-program/list-versions/{list_version_id}/mark-reprinted"]
          - validations[priority 26].ERR_LIST_VERSION_NOT_REPRINT_PENDING
          - constants_global.REPRINT_THRESHOLD_ENTRIES
        distinguishing_aspect: >-
          Reprinting is legal only from REPRINT_PENDING, and a PUBLISHED version only gets there once
          stale_entry_count reaches the threshold of 2 — so the same call is refused on a clean version,
          refused again after ONE vintage change, and accepted only after the second.
        test_recipe:
          setup:
