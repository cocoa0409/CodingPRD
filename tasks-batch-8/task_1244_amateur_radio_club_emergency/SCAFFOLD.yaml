  - { method: POST, path: "/members", description: "Register a club member (starts PENDING until dues are paid)", roles: [ClubAdmin], code: 201, input: [callsign, full_name, license_class, license_expires_at], output: Member, side_effects: ["readiness fields initialized: scores 0 + no-show bonus applied, tier from formula"] }
  - { method: GET, path: "/members", description: "List members", roles: [ClubAdmin, EmergencyCoordinator, NetControl, ExamLiaison], code: 200, input: ["membership_status?", "readiness_tier?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: GET, path: "/members/{id}", description: "Member detail including computed readiness fields", roles: [ClubAdmin, Member, EmergencyCoordinator, NetControl, ExamLiaison], code: 200, input: [], output: Member, side_effects: [] }
  - { method: PATCH, path: "/members/{id}", description: "Update mutable member profile fields", roles: [ClubAdmin], code: 200, input: ["full_name?", "license_class?", "license_expires_at?"], output: Member, side_effects: ["Member.version += 1"] }
  - { method: POST, path: "/members/{id}/set-status", description: "Suspend (ACTIVE -> SUSPENDED) or reinstate (SUSPENDED -> ACTIVE, requires dues current)", roles: [ClubAdmin], code: 200, input: [to], output: Member, side_effects: ["Member.version += 1", "readiness recompute"] }
  - { method: POST, path: "/members/{id}/renew", description: "Pay dues: PENDING/LAPSED -> ACTIVE (self-loop on ACTIVE), extends dues_paid_through per calculations.membership_renewal", roles: [ClubAdmin], code: 200, input: [periods], output: Member, side_effects: ["dues_paid_through extended", "renewal_amount_cents = periods * 3600 included in response", "Member.version += 1", "readiness recompute"] }

  - { method: POST, path: "/antenna-site-agreements", description: "Create site agreement in NEGOTIATION; closed-interval overlap on site_name vs agreements in {NEGOTIATION, ACTIVE}", roles: [ClubAdmin], code: 201, input: [site_name, owner_name, lease_start, lease_end], output: AntennaSiteAgreement, side_effects: [] }
  - { method: GET, path: "/antenna-site-agreements", description: "List site agreements", roles: [ClubAdmin], code: 200, input: ["status?", "site_name?", "limit?", "offset?"], output: "AntennaSiteAgreement[]", side_effects: [] }
  - { method: GET, path: "/antenna-site-agreements/{id}", description: "Site agreement detail", roles: [ClubAdmin], code: 200, input: [], output: AntennaSiteAgreement, side_effects: [] }
  - { method: POST, path: "/antenna-site-agreements/{id}/set-status", description: "NEGOTIATION -> ACTIVE; ACTIVE/NEGOTIATION -> TERMINATED; EXPIRED -> NEGOTIATION renewal (lease_start + lease_end required)", roles: [ClubAdmin], code: 200, input: [to, "lease_start?", "lease_end?"], output: AntennaSiteAgreement, side_effects: ["AntennaSiteAgreement.version += 1", "renewal_count += 1 on renewal", "leaving ACTIVE fires repeater -> OFFLINE -> net CANCELLED -> readiness cascade"] }

  - { method: POST, path: "/repeaters", description: "Register a repeater (starts MAINTENANCE)", roles: [ClubAdmin], code: 201, input: [callsign, output_frequency_mhz, site_agreement_id], output: Repeater, side_effects: [] }
  - { method: GET, path: "/repeaters", description: "List repeaters", roles: [ClubAdmin, NetControl, Member], code: 200, input: ["status?", "site_agreement_id?", "limit?", "offset?"], output: "Repeater[]", side_effects: [] }
  - { method: GET, path: "/repeaters/{id}", description: "Repeater detail", roles: [ClubAdmin, NetControl, Member], code: 200, input: [], output: Repeater, side_effects: [] }
  - { method: POST, path: "/repeaters/{id}/set-status", description: "Repeater status moves; -> OPERATIONAL requires ACTIVE site agreement + a GRANTED coordination; -> OFFLINE cancels future/open nets", roles: [ClubAdmin], code: 200, input: [to], output: Repeater, side_effects: ["Repeater.version += 1", "OFFLINE cascades nets in {SCHEDULED, OPEN} -> CANCELLED and recomputes affected members' readiness"] }

  - { method: POST, path: "/coordination-requests", description: "File a frequency-coordination request (DRAFT) for a repeater; supersedes existing DRAFT/SUBMITTED requests of that repeater (they -> WITHDRAWN); OCC via expected_repeater_version", roles: [ClubAdmin], code: 201, input: [repeater_id, requested_frequency_mhz, expected_repeater_version], output: CoordinationRequest, side_effects: ["Repeater.version += 1", "prior DRAFT/SUBMITTED CoordinationRequests for this repeater -> WITHDRAWN"] }
  - { method: GET, path: "/coordination-requests", description: "List coordination requests", roles: [ClubAdmin], code: 200, input: ["repeater_id?", "status?", "limit?", "offset?"], output: "CoordinationRequest[]", side_effects: [] }
  - { method: GET, path: "/coordination-requests/{id}", description: "Coordination request detail", roles: [ClubAdmin], code: 200, input: [], output: CoordinationRequest, side_effects: [] }
  - { method: POST, path: "/coordination-requests/{id}/submit", description: "DRAFT -> SUBMITTED", roles: [ClubAdmin], code: 200, input: [], output: CoordinationRequest, side_effects: ["submitted_at = clock_now", "CoordinationRequest.version += 1"] }
  - { method: POST, path: "/coordination-requests/{id}/record-decision", description: "Record the frequency council decision: SUBMITTED -> GRANTED or RETURNED", roles: [ClubAdmin], code: 200, input: [outcome, council_reference], output: CoordinationRequest, side_effects: ["decision_at = clock_now", "CoordinationRequest.version += 1"] }
  - { method: POST, path: "/coordination-requests/{id}/revise", description: "RETURNED -> DRAFT revision loop; revision_number += 1; optionally changes requested_frequency_mhz", roles: [ClubAdmin], code: 200, input: ["requested_frequency_mhz?"], output: CoordinationRequest, side_effects: ["revision_number += 1", "CoordinationRequest.version += 1"] }
  - { method: POST, path: "/coordination-requests/{id}/withdraw", description: "DRAFT/SUBMITTED -> WITHDRAWN", roles: [ClubAdmin], code: 200, input: [], output: CoordinationRequest, side_effects: ["CoordinationRequest.version += 1"] }

  - { method: POST, path: "/net-sessions", description: "Schedule a net on a repeater; NetControl callers become net_control_member_id; half-open overlap rule per repeater; net control license_class must be >= min_license_class", roles: [NetControl, ClubAdmin], code: 201, input: [name, repeater_id, scheduled_start, scheduled_end, "min_license_class?", "net_control_member_id?"], output: NetSession, side_effects: [] }
