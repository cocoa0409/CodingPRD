          as: FacilitiesPlanner
          as_user_id: "planner-1"
        asserts:
          - "response status is 422"
          - "data.error_id == \"ERR_SITE_SCHOOL_MISMATCH\""
          - "data.error_id != \"ERR_PAD_TOO_SMALL\""
          - "control for the lower-priority rule: the same call with placement_site_id ${right_small_site_id} returns 422 with data.error_id == \"ERR_PAD_TOO_SMALL\" because 42 ft is below the 50 ft a single-wide needs with 5 ft clearance on each end"
          - "control for the higher-priority rule: the same call with placement_site_id ${wrong_big_site_id} returns 422 with data.error_id == \"ERR_SITE_SCHOOL_MISMATCH\""
          - "GET /facilities/portable-units/${unit_id} returns data.allocation_status == \"IN_STORAGE\" because no rejected create may reserve the unit"

