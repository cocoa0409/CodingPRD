        grounds:
          - calculations.tenant_notice_and_relocation
          - entities.TenantHousehold.fields.protected_class
          - entities.TenantHousehold.fields.notice_period_days
          - entities.TenantHousehold.fields.relocation_assistance_cents
          - entities.TenantHousehold.fields.vacate_deadline_at
          - state_machines.TenantHousehold.PRE_NOTICE_to_NOTICE_SERVED
          - state_machines.TenantHousehold.NOT_OWED_to_ACCRUED
          - validations[priority=41]
        distinguishing_aspect: |
          This instance is mode (a) - four interacting inputs (tenancy_months tier, protected_class
          branch, monthly_rent_cents multiplier and the served_at clock) combine through a nested
          min/max ladder whose steps are cap, then uplift, then cap again, then floor, so an ELDERLY
          tenant at 900000c rent and one at 60000c rent land on 1500000c and 270000c: the mode is
          non-linear input interaction, not the pinned-evaluation-order circularity of the budget
          fee tier.
