              payload: { author_name: "C", comment_text: "Ok." }
              as: StateDOTPlanner
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "R1", description: "P1", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 1000 }
              as: StateDOTPlanner
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips/${stip_id}/submit"
              payload: {}
              as: StateDOTPlanner
            - call: "POST /federal-aid/stips/${stip_id}/decide"
