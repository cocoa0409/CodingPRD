          - validations[priority=19]
          - errors.ERR_SCHOOL_MEETING_CAPACITY_FULL
          - entities.School.fields.concurrent_meeting_capacity
          - endpoints["POST /psych-services/eligibility-meetings"]
        distinguishing_aspect: |
          Opposite interval semantics and a different resource from the calendar instance: intervals are
          CLOSED [start, end] so touching endpoints DO conflict, the contended resource is a SCHOOL's
          concurrent_meeting_capacity, and the limit is an AGGREGATE count (2) rather than a pairwise
          exclusion — two overlapping meetings are legal, the third is not.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one building with concurrent_meeting_capacity = 2."
            - "Three consented INITIAL referrals give three Evaluations, each version read immediately before its meeting is created."
            - "Meeting M1 occupies 2026-09-20T15:00:00Z-16:00:00Z and meeting M2 occupies 15:30:00Z-16:30:00Z; M2 is accepted because only one other meeting (M1) intersects it and the capacity is 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Oakhaven High", building_code: "OH17", grade_band: "HIGH", concurrent_meeting_capacity: 2, enrollment_count: 980 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-S", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["COGNITIVE"], intervention_team_summary: "tier 3 cognition" }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-S-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: IntakeCoordinator
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/eligibility-meetings"
              payload: { evaluation_id: "${eval1}", school_id: "${s1}", scheduled_start_at: "2026-09-20T15:00:00Z", scheduled_end_at: "2026-09-20T16:00:00Z", expected_evaluation_version: "${ver1}" }
              as: IntakeCoordinator
              captures: { m1: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-T", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["ACADEMIC"], intervention_team_summary: "tier 3 reading" }
              as: IntakeCoordinator
              captures: { r2: $.data.id }
            - call: "POST /psych-services/referrals/${r2}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-T-1" }
              as: IntakeCoordinator
              captures: { eval2: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval2}"
              payload: {}
              as: IntakeCoordinator
              captures: { ver2: $.data.version }
            - call: "POST /psych-services/eligibility-meetings"
              payload: { evaluation_id: "${eval2}", school_id: "${s1}", scheduled_start_at: "2026-09-20T15:30:00Z", scheduled_end_at: "2026-09-20T16:30:00Z", expected_evaluation_version: "${ver2}" }
              as: IntakeCoordinator
              captures: { m2: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-U", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["ADAPTIVE"], intervention_team_summary: "tier 3 adaptive" }
              as: IntakeCoordinator
              captures: { r3: $.data.id }
            - call: "POST /psych-services/referrals/${r3}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-U-1" }
              as: IntakeCoordinator
              captures: { eval3: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval3}"
              payload: {}
              as: IntakeCoordinator
              captures: { ver3: $.data.version }
          trigger:
            - call: "POST /psych-services/eligibility-meetings"
              payload: { evaluation_id: "${eval3}", school_id: "${s1}", scheduled_start_at: "2026-09-20T16:00:00Z", scheduled_end_at: "2026-09-20T17:00:00Z", expected_evaluation_version: "${ver3}" }
              as: IntakeCoordinator
          assert:
            - "EligibilityMeeting.${m1}.status == PROPOSED and EligibilityMeeting.${m2}.status == PROPOSED — two overlapping meetings are legal at capacity 2"
            - "The trigger returns HTTP 409 with error_id == ERR_SCHOOL_MEETING_CAPACITY_FULL: [16:00, 17:00] touches [15:00, 16:00] at 16:00 AND overlaps [15:30, 16:30], so the intersecting count is 2 >= concurrent_meeting_capacity 2"
            - "Under half-open semantics the count would be 1 and the call would have returned 201; closed-interval touching MUST conflict here"
            - "GET /psych-services/eligibility-meetings?evaluation_id=${eval3} returns an empty list after the rejected trigger"
            - "Re-issuing the same call with scheduled_start_at 2026-09-20T16:31:00Z and scheduled_end_at 2026-09-20T17:30:00Z returns HTTP 201, because no existing closed interval reaches 16:31"
            - "Evaluation.${eval3}.version is unchanged from ${ver3} after the rejected trigger"

  - rule_id: compensating_invariant
    instances:
      - name: license_seat_release_restores_seat_conservation
        grounds:
          - calculations.license_seat_conservation
          - state_machines.ScoringLicenseSeat.ASSIGNED_to_RELEASED
          - validations[priority=26]
          - entities.AssessmentInstrument.fields.license_seats_free
        distinguishing_aspect: |
          The conserved quantity is AssessmentInstrument.license_seat_total, split between ASSIGNED seats and
          license_seats_free. The forward action is seat assignment and the compensating action is seat
          release; a released seat row is never deleted, so the invariant must be maintained against a growing
          seat population rather than a moving sum.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one building; three ACTIVE SSP psychologists covering it."
            - "One AssessmentInstrument with license_seat_total = 2 and a licence valid to 2027-06-30."
            - "Seats are assigned to psychologists A and B, exhausting the pool (license_seats_free == 0), and a third assignment attempt for psychologist C returns HTTP 409 ERR_LICENSE_SEATS_EXHAUSTED with no row created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Pinecrest Middle", building_code: "PC18", grade_band: "MIDDLE", concurrent_meeting_capacity: 2, enrollment_count: 600 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Omar Diaz", employee_number: "E-1016", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Pia Lund", employee_number: "E-1017", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pb: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Quinn Ahmed", employee_number: "E-1018", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pc: $.data.id }
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "BASC-3", instrument_code: "BASC3", protocol_stock_count: 6, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1200, license_seat_total: 2, license_expires_on: "2027-06-30", supported_language_editions: ["en"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
            - call: "POST /psych-services/assessment-instruments/${inst}/license-seats"
              payload: { psychologist_id: "${pa}" }
              as: DistrictAdmin
              captures: { seat_a: $.data.id }
            - call: "POST /psych-services/assessment-instruments/${inst}/license-seats"
              payload: { psychologist_id: "${pb}" }
              as: DistrictAdmin
              captures: { seat_b: $.data.id }
          trigger:
            - call: "POST /psych-services/assessment-instruments/${inst}/license-seats/${seat_a}/release"
              payload: {}
              as: PsychServicesSupervisor
          assert:
            - "Before the trigger AssessmentInstrument.${inst}.license_seats_free == 0 and an assignment attempt for ${pc} returns HTTP 409 with error_id == ERR_LICENSE_SEATS_EXHAUSTED"
            - "Invariant before the trigger: license_seat_total 2 == count(ASSIGNED seats) 2 + license_seats_free 0"
            - "After the trigger ScoringLicenseSeat.${seat_a}.status == RELEASED with released_at set, and AssessmentInstrument.${inst}.license_seats_free == 1"
            - "Invariant after the compensating action: license_seat_total 2 == count(ASSIGNED seats) 1 + license_seats_free 1"
            - "Re-issuing the assignment for ${pc} now returns HTTP 201 and AssessmentInstrument.${inst}.license_seats_free returns to 0, with the invariant 2 == 2 + 0 holding again"
            - "GET /psych-services/assessment-instruments/${inst}/license-seats then returns 3 rows (one RELEASED, two ASSIGNED) — no seat row is ever deleted, so the invariant is over statuses, not over row counts"
            - "ScoringLicenseSeat.${seat_b}.status == ASSIGNED throughout (releasing A never disturbs B)"

      - name: reassignment_conserves_district_caseload_points
        grounds:
          - calculations.caseload_points_conservation
          - calculations.psychologist_open_case_points
          - state_machines.Evaluation.ASSIGNED_to_ASSIGNED
          - entities.Evaluation.fields.reassignment_count
        distinguishing_aspect: |
          A different conserved quantity from the seat pool: district_open_points, the sum of
          Psychologist.open_case_points, must equal the total caseload_points of all open Evaluations. Here the
          forward and compensating movements happen inside a SINGLE request — reassignment debits one
          psychologist and credits another by exactly the same points — so the district total must be
          bit-identical before and after.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one building; two ACTIVE SSP psychologists covering it, both weekly_capacity_points 20."
            - "One INITIAL referral with 3 domains and interpreter_required = true (9 caseload points) consented 2026-08-01T09:00:00Z and ASSIGNED to psychologist A."
            - "The Evaluation's version is re-read after the first assignment so the reassignment's expected_evaluation_version is fresh."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Rosewood Elementary", building_code: "RW19", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 2, enrollment_count: 400 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Rita Vance", employee_number: "E-1019", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Sam Ito", employee_number: "E-1020", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pb: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-V", referral_type: "INITIAL", primary_language: "es", interpreter_required: true, bilingual_evaluation_required: false, requested_domains: ["COGNITIVE", "ACADEMIC", "SOCIAL_EMOTIONAL"], intervention_team_summary: "tier 3 multi-domain" }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-V-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver2: $.data.version }
          trigger:
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver2}", psychologist_id: "${pb}" }
              as: PsychServicesSupervisor
          assert:
            - "Before the trigger Psychologist.${pa}.open_case_points == 9, Psychologist.${pb}.open_case_points == 0, so district_open_points == 9 == Evaluation.${eval1}.caseload_points"
            - "After the trigger Psychologist.${pa}.open_case_points == 0 and pressure_index_assigned_basis == 0.00"
            - "After the trigger Psychologist.${pb}.open_case_points == 9, pressure_index_assigned_basis == 0.45 and pressure_index_clock_weighted == 0.45"
            - "Invariant: district_open_points == 9 both before and after the reassignment — the debit and the credit are exactly equal, with no double count and no leak"
            - "Evaluation.${eval1}.psychologist_id == ${pb}, assessment_status == ASSIGNED and reassignment_count == 1"
            - "Evaluation.${eval1}.caseload_points is still 9 (immutable after creation) and version is greater than ${ver2}"

