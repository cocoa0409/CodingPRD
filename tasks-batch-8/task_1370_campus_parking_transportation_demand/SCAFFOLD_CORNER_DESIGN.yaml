              as: ParkingAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /parking/shuttle-routes"
              payload: { fund_id: "${fund_id}", route_code: "BLUE_LOOP", fleet_group: "FLEET_A", service_window_start_minutes: 480, service_window_end_minutes: 960, headway_minutes: 30, vehicle_capacity: 25, projected_daily_ridership: 400, annual_operating_cost_cents: 10000 }
