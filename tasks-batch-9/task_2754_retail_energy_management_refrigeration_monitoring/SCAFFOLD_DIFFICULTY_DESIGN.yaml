            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
              captures: { posture_start: "$.data.energy_posture" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Midland Power", rate_schedule_code: "TOU-A", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
