        9800 bps, cancellation 200 bps, defect 2000 bps), scoring 0.50*9800 + 0.30*9800 + 0.20*8000 = 9440 bps ->
        composite_score 94.40 -> tier GOLD, so the vendor stays ACTIVE while its defect_rate_bps of 2000 exceeds
