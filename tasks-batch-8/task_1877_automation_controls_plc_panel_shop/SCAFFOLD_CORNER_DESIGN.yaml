            - call: "POST /panel-shop/jobs/${j_sd}/panels"
              payload: { panel_tag: "P-SD1", enclosure_rating: "NEMA_1", design_engineer_id: "de-sod" }
              as: DesignEngineer
              captures: { p_sd: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "BPD-SD", component_class: "BRANCH_PROTECTIVE", unit_cost_cents: 10000, lead_time_days: 7, sccr_ka: 10, heat_dissipation_w: 8 }
              as: QAManager
              captures: { comp_sd: "$.data.id" }
