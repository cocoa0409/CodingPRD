              captures: { cx_id: $.data.id }
          trigger:
            - call: "POST /closure-agreements"
              payload: { crossing_id: "${cx_id}", locality_id: "${loc_id}", closure_type: "CONSOLIDATION", consolidation_target_crossing_id: "${cx_id}" }
