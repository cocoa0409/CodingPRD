          assert:
            - "Order.${o7_id}.status == \"CANCELLED\"                                # link 1"
            - "Proof.${pr7_id}.status == \"CANCELLED\"                               # link 2 (caused by link 1)"
            - "AddressingJob.${aj7_id}.status == \"CANCELLED\"                       # link 3 (caused by link 1)"
            - "PaperStock.${p7_id}.reserved_units == 0                               # released"
            - "Order.${o7_id}.deposit_paid_cents == 0"
            - "Customer.${c7_id}.credit_balance_cents == 41250                       # cash-conservation refund"

      - name: proof_expiry_auto_cascade_depth_two_from_clock
        grounds:
