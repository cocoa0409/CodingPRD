      - name: segregation_of_duties_approver_cannot_field_sign_final
        claim_type: Segregation of duties
        grounds:
          - validations[priority=9]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.PermitApplication.fields.approving_reviewer_id
          - entities.Inspection.fields.inspector_id
        distinguishing_aspect: |
          Segregation of duties: the person who approved the plan may not field-sign the FINAL
          inspection. When the acting Inspector's X-User-ID equals permit.approving_reviewer_id the
          FINAL result is rejected ERR_SEGREGATION_OF_DUTIES (409). The neutral ROUGH is passed by a
          different inspector; the FINAL slot is published for inspector_id == the approving reviewer's
          id, and the FINAL result is attempted with as_user_id == that reviewer id.
        test_recipe:
          setup:
            - "Permit approved by PlanReviewer (id RID); ROUGH passed by a neutral inspector; a FINAL inspection scheduled in a slot whose inspector_id == RID; the FINAL result is then attempted by the approver acting as inspector (as_user_id == RID)."
