      - name: quality_gate_thresholds_78_and_60_with_pinned_rounding
        grounds:
          - calculations.deliverable_quality_score
          - calculations.deliverable_quality_score.constants.PASS_THRESHOLD
          - calculations.deliverable_quality_score.constants.CONDITIONAL_THRESHOLD
          - calculations.deliverable_quality_score.constants.SCORE_SCALE
        distinguishing_aspect: |
          The only boundary family in this rule where the boundary value is assembled out of
          MULTIPLE rounded terms, so the threshold test and the rounding ORDER are entangled:
          the score must be rounded per deliverable and only then summed. Instances 1-3 and 5
          each round one number once; here six arms sit within one cent of a threshold, and
          one of them (ARM R) lands on opposite sides of PASS depending purely on whether the
          implementer summed first or rounded first. Both thresholds are INCLUSIVE floors, and
          they are the only ones in this rule whose crossing changes a THREE-way band
          (PASS / CONDITIONAL / FAIL) with three different engagement outcomes.

          Every arm keeps active_weight_total = 100.00 (no WAIVED deliverables), so
          norm_weight(D) = round(weight_pct / 100.00, 6) is exact at 6 decimals and
          contribution(D) = round(norm_weight * review_score * 20, 2). Rubric scores are
          integers 0-5.
            ARM P0 exactly on PASS: weights 90.00 / 10.00, scores 4 / 3
              round(0.900000 * 4 * 20, 2) = 72.00 ; round(0.100000 * 3 * 20, 2) = 6.00
              weighted_score = round(72.00 + 6.00, 2) = 78.00 >= 78.00 -> PASS
            ARM P1 one cent below PASS: weights 89.95 / 10.05, scores 4 / 3
              round(0.899500 * 80, 2) = round(71.96, 2) = 71.96
              round(0.100500 * 60, 2) = round(6.03, 2)  = 6.03
              weighted_score = 77.99 -> 60.00 <= 77.99 < 78.00 -> CONDITIONAL
            ARM P2 one cent above PASS: weights 90.05 / 9.95, scores 4 / 3
              round(0.900500 * 80, 2) = 72.04 ; round(0.099500 * 60, 2) = 5.97
              weighted_score = 78.01 -> PASS
            ARM C0 exactly on CONDITIONAL: weights 50.00 / 50.00, scores 3 / 3
              round(0.500000 * 60, 2) = 30.00 twice -> weighted_score = 60.00 >= 60.00
              -> CONDITIONAL (not FAIL: the floor is inclusive)
            ARM C1 one cent below CONDITIONAL: weights 99.95 / 0.05, scores 3 / 2
              round(0.999500 * 60, 2) = round(59.97, 2) = 59.97
              round(0.000500 * 40, 2) = round(0.02, 2)  = 0.02
              weighted_score = 59.99 < 60.00 -> FAIL
            ARM C2 one cent above CONDITIONAL: weights 99.95 / 0.05, scores 3 / 4
              59.97 + round(0.000500 * 80, 2) = 59.97 + 0.04 = 60.01 -> CONDITIONAL
            ARM R rounding-order discriminator: weights 16.62 / 60.17 / 23.21, scores 2 / 4 / 5
              round(0.166200 * 40, 2) = round(6.648,  2) = 6.65
              round(0.601700 * 80, 2) = round(48.136, 2) = 48.14
              round(0.232100 * 100, 2) = round(23.210, 2) = 23.21
              PINNED order  -> weighted_score = round(6.65 + 48.14 + 23.21, 2) = 78.00 -> PASS
              WRONG order   -> round(6.648 + 48.136 + 23.210, 2) = round(77.994, 2) = 77.99
                               -> CONDITIONAL
              The two orders differ by exactly one cent and land on opposite sides of 78.00,
              so ARM R alone separates a correct implementation from the natural one.
          Downstream consequences make the band observable rather than cosmetic: PASS ->
          Engagement.quality_gate PASSED and work_status SUBMITTED -> ACCEPTED (handoff
          allowed, reliability base 1.00); CONDITIONAL -> quality_gate CONDITIONAL, also
          ACCEPTED, and rework is available while round_no < MAX_REVIEW_ROUNDS 2 (reliability
          base 0.70); FAIL -> CASCADE-B, quality_gate FAILED and work_status TERMINATED with
          termination_reason QUALITY_FAILURE (reliability base 0.00). ARM C1 and ARM C0
          therefore differ by one cent and by a whole engagement.
