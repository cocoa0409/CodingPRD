  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: buyer_cannot_publish_listing_returns_unauthorized
        claim_type: exclusive_denied
        grounds:
          - "roles.Buyer"
          - "roles.Seller"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "A Buyer calling POST /seller/listings/{id}/publish (Seller-exclusive) returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Shop with a DRAFT listing."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: seller_cannot_create_shop_returns_unauthorized
        claim_type: exclusive_denied
        grounds:
          - "roles.Seller"
          - "roles.PlatformAdmin"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "A Seller calling POST /seller/shops (PlatformAdmin-exclusive) returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["An existing shop supplies a Seller identity."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_2", name: "Sneaky Shop" }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: seller_not_owner_create_listing_returns_not_shop_owner
        claim_type: ownership_denied
        grounds:
          - "roles.Seller"
          - "validations[priority=3]"
          - "errors[ERR_NOT_SHOP_OWNER]"
        distinguishing_aspect: "Seller acting as shopA (X-User-ID=shopA) creating a listing with shop_id=shopB returns ERR_NOT_SHOP_OWNER."
        test_recipe:
          setup: ["Two shops A and B exist."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_a", name: "Shop A" }
              as: PlatformAdmin
              captures: { shop_a: $.data.id }
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_b", name: "Shop B" }
              as: PlatformAdmin
              captures: { shop_b: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_b}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_b}"
              captures: { sp_b: $.data.id }
          trigger:
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_b}", shipping_profile_id: "${sp_b}", title: "Cross Shop", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 1 }
              as: Seller
              as_user_id: "${shop_a}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_SHOP_OWNER"

      - name: unauthenticated_missing_role_returns_401
        claim_type: exclusive_denied
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no valid role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"

      - name: buyer_cannot_pay_others_order_returns_not_shop_owner
        claim_type: ownership_denied
        grounds:
          - "roles.Buyer"
          - "validations[priority=3]"
          - "errors[ERR_NOT_SHOP_OWNER]"
        distinguishing_aspect: "A different buyer (buyer_2) paying buyer_1's order returns ERR_NOT_SHOP_OWNER (X-User-ID != order.buyer_id)."
        test_recipe:
          setup: ["Order placed by buyer_1, UNPAID."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_SHOP_OWNER"

  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_shop_version_on_payout_create
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[payout-create-stale-shop]"
          - "errors[ERR_STALE_SHOP_VERSION]"
        distinguishing_aspect: "A payout create carrying a Shop.version that has since advanced (via a vacation toggle) is rejected with ERR_STALE_SHOP_VERSION (412) while an eligible order still exists; a fresh version then succeeds."
        test_recipe:
          setup: ["Shop with one COMPLETED order; shop.version captured; then two vacation toggles advance shop.version by 2."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 500, per_item_cost_cents: 150, free_shipping_threshold_cents: 100 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 100, quantity: 10 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_id}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_id}/deliver"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_id}/complete"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "GET /seller/shops/${shop_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { stale_v: $.data.version }
            - call: "POST /seller/shops/${shop_id}/enable-vacation"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/shops/${shop_id}/return-from-vacation"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /seller/payouts"
              payload: { shop_id: "${shop_id}", expected_shop_version: "${stale_v}" }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { err: $.data.error_id }
            - call: "GET /seller/shops/${shop_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { fresh_v: $.data.version }
            - call: "POST /seller/payouts"
              payload: { shop_id: "${shop_id}", expected_shop_version: "${fresh_v}" }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { payout_id: $.data.id }
          assert:
            - "stale create response error_id == ERR_STALE_SHOP_VERSION"
            - "Payout.${payout_id}.order_count == 1"

      - name: version_increments_on_shop_mutation
        claim_type: optimistic_concurrency
        grounds:
          - "entities.Shop.fields.version"
          - "state_machines.Shop.ACTIVE_to_VACATION"
        distinguishing_aspect: "enable-vacation increments Shop.version from 1 to 2."
        test_recipe:
          setup: ["Shop ACTIVE at version 1."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /seller/shops/${shop_id}/enable-vacation"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { v1: $.data.version }
          assert:
            - "Shop.${shop_id}.version == 2"

      - name: pay_cascade_side_effects
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Order.UNPAID_to_PAID"
        excluded_because:
          difficulty_instance: transitive_cascade / pay_material_stockout_listing_soldout
          rationale: "The multi-level pay cascade (material decrement + SOLD_OUT) is verified there."

      - name: hide_review_recomputes_shop_rating
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.shop_rating"
          - "state_machines.Review.PUBLISHED_to_HIDDEN"
          - "entities.Shop.fields.simple_avg_rating"
        distinguishing_aspect: "With reviews 5 and 3 (simple 4.0), hiding the 3-star review recomputes simple_avg_rating to 5.0 and published_review_count to 1."
        test_recipe:
          setup: ["Two COMPLETED orders reviewed 5 and 3 stars -> simple_avg_rating 4.0, published_review_count 2."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 10 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_a: $.data.id }
            - call: "POST /seller/orders/${order_a}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_a}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_a}/deliver"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_a}/complete"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_b: $.data.id }
            - call: "POST /seller/orders/${order_b}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_b}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_b}/deliver"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_b}/complete"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/reviews"
              payload: { order_id: "${order_a}", rating: 5 }
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/reviews"
              payload: { order_id: "${order_b}", rating: 3 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { review_b: $.data.id }
          trigger:
            - call: "POST /seller/reviews/${review_b}/hide"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "GET /seller/shops/${shop_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { simple: $.data.simple_avg_rating, n: $.data.published_review_count }
          assert:
            - "Shop.${shop_id}.published_review_count == 1"
            - "Shop.${shop_id}.simple_avg_rating == 5.0"

  # =========================================================================
  # Consistency model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_computed_pricing_on_order_create
        claim_type: immediate
