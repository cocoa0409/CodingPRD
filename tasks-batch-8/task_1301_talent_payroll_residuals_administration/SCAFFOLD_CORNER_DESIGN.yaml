  - section: rbac
    instances:
      - name: union_auditor_cannot_create_timecard
        claim_type: role_exclusive_denial
        grounds:
          - "roles[UnionAuditor]"
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "UnionAuditor is read-plus-grievance only: POST /timecards as UnionAuditor fails 403 ERR_FORBIDDEN before any existence/state check."
        test_recipe:
          setup: ["standard fixture; engagement ACTIVE"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
          trigger:
            - call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng}", work_date: "2026-08-10", jurisdiction_code: "CA", call_time: "2026-08-10T08:00:00Z", first_meal_out: "2026-08-10T13:30:00Z", first_meal_in: "2026-08-10T14:00:00Z", wrap_time: "2026-08-10T17:00:00Z", scheduled_hours: 9 }
              as: UnionAuditor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN; no timecard is persisted"
      - name: production_accountant_cannot_close_batch
        claim_type: role_exclusive_denial
        grounds:
          - "roles[ProductionAccountant]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Batch close is exclusive to PayrollClerk: as ProductionAccountant it fails 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["standard fixture; TC-A approved; batch OPEN"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
            - *c_batch
          trigger:
            - call: "POST /payroll/pay-batches/${bat}/close"
              payload: {}
              as: ProductionAccountant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN; batch remains OPEN"
      - name: batch_approve_by_creator_rejected_sod
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "complexity_profile.role_model"
        distinguishing_aspect: "Segregation of duties: the batch creator (X-User-ID clerk-1) may not approve the same batch even while holding the PayrollSupervisor role — 403 ERR_SEGREGATION_OF_DUTIES; a different supervisor (sup-1) succeeds."
        test_recipe:
          setup: ["standard fixture; TC-A approved; batch created by clerk-1 and closed"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
            - *c_batch
            - *c_close
          trigger:
            - call: "POST /payroll/pay-batches/${bat}/approve"
              payload: {}
              as: PayrollSupervisor
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
            - call: "POST /payroll/pay-batches/${bat}/approve"
              payload: {}
              as: PayrollSupervisor
              as_user_id: "sup-1"
          assert:
            - "Approve as clerk-1 (the creator): HTTP 403 error_id == ERR_SEGREGATION_OF_DUTIES; batch stays CLOSED"
            - "Approve as sup-1: HTTP 200, batch becomes APPROVED"
      - name: unauthenticated_missing_headers_returns_401
        claim_type: role_exclusive_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Auth precedes everything: a request with no role/id headers fails 401 ERR_UNAUTHENTICATED even for a read endpoint."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /payroll/union-agreements"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 with error_id == ERR_UNAUTHENTICATED"
      - name: union_auditor_read_access_shared
        claim_type: role_shared_allowed
        grounds:
          - "roles[UnionAuditor]"
        distinguishing_aspect: "The shared read surface works for UnionAuditor: GET engagement and timecard list return 200 with data."
        test_recipe:
          setup: ["standard fixture; TC-A approved"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
          trigger:
            - call: "GET /payroll/engagements/${eng}"
              payload: {}
              as: UnionAuditor
            - call: "GET /payroll/timecards"
              payload: { engagement_id: "${eng}" }
              as: UnionAuditor
          assert:
            - "GET engagement: HTTP 200 with status APPROVED"
            - "GET timecards: HTTP 200, total_count == 1"

  - section: cross_cutting_layers
    instances:
      - name: amendment_create_with_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[engagement-amendment-stale-version]"
          - "errors[ERR_STALE_VERSION]"
          - "validations[priority=29]"
        distinguishing_aspect: "OCC on Engagement.version: after amendment A legitimately supersedes the target (bumping it to version 4), amendment B carrying the earlier observed version 3 is rejected 412 ERR_STALE_VERSION — two strictly sequential requests, no wall-clock dependence."
        test_recipe:
          setup:
            - "standard fixture; E1 ACTIVE; its version captured (3); amendment A created with the current version (E1 -> AMENDMENT_PENDING, version 4)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - call: "GET /payroll/engagements/${eng}"
              payload: {}
              as: PayrollClerk
              captures: { e1v: $.data.version }
            - call: "POST /payroll/engagements"
              payload: { production_id: "${prod}", union_agreement_id: "${agr}", performer_id: "${perf}", tier_code: "T2", payee_type: "DIRECT", weekly_guarantee_cents: 400000, guaranteed_days: 20, start_date: "2026-08-03", end_date: "2026-09-11", supersedes_engagement_id: "${eng}", expected_engagement_version: "${e1v}" }
              as: ProductionAccountant
              captures: { engA: $.data.id }
          trigger:
            - call: "POST /payroll/engagements"
              payload: { production_id: "${prod}", union_agreement_id: "${agr}", performer_id: "${perf}", tier_code: "T2", payee_type: "DIRECT", weekly_guarantee_cents: 450000, guaranteed_days: 20, start_date: "2026-08-03", end_date: "2026-09-11", supersedes_engagement_id: "${eng}", expected_engagement_version: "${e1v}" }
              as: ProductionAccountant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id == ERR_STALE_VERSION (E1.version is now ${e1v} + 1 after amendment A's create-time bump)"
            - "E1 remains AMENDMENT_PENDING; no second amendment engagement is persisted"
