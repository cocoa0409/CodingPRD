        payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
        as: TitleAnalyst
      - call: "POST /tracts/${c5t}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /royalty-owners"
        payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
        as: DivisionOrderAdmin
        captures: { c5o: $.data.id }
      - call: "POST /mineral-interests"
        payload: { tract_id: "${c5t}", seller_owner_id: "${c5o}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
        as: AcquisitionManager
