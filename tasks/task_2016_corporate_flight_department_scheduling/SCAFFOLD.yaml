# =============================================================================
# PRD Benchmark Seed Tables — Corporate Flight Department Scheduling
# =============================================================================

scenario: |
  2016. Corporate Flight Department Scheduling (corporate flight department): trip
  request & passenger priority policy, aircraft assignment & crew pairing legality,
  catering/ground transport coordination, maintenance & training conflicts on the
  calendar, personal-use imputed income (SIFL) calculation, cost allocation to
  business units, charter supplement when fleet unavailable, tail-specific
  document/permit currency.

domain_name: corporate-flight-department
api_prefix: /flight-ops

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - selector_policy

  entity_topology: hybrid
  # TripRequest → FlightLeg tree, with peer references to Aircraft, CrewMember,
  # PassengerProfile, BusinessUnit, plus flat config entities (SiflRatePeriod,
  # DocumentPermit) and per-leg children (CateringOrder, GroundTransport).

  state_machine_shape: parallel
  # TripRequest carries two independent dimensions (approval_status ×
  # assignment_status); Aircraft carries posture derived from MaintenanceWindow
  # and DocumentPermit children (compound); CrewMember duty cycles (training
  # expiry loops); FlightLeg is a guarded pipeline gated on parent TripRequest.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # Dispatcher who assigns an aircraft/crew cannot also approve personal-use
  # classification on the same trip; a PilotInCommand cannot approve their own
  # duty-overrun waiver; only FinanceAdmin finalizes SIFL reporting.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: tail_number, type: string, source: input, description: "Registration e.g. N123CF; unique across fleet" }
      - { name: aircraft_type, type: enum, source: input, description: "LIGHT_JET | MIDSIZE_JET | HEAVY_JET | TURBOPROP" }
      - { name: passenger_capacity, type: integer, source: input, description: "Certified passenger seats, >= 1" }
      - { name: home_base_icao, type: string, source: input, description: "Home airport ICAO code, e.g. KTEB" }
      - { name: status, type: enum, source: system, description: "ACTIVE | GROUNDED | RETIRED" , default: ACTIVE }
      - { name: posture, type: enum, source: computed, description: "AVAILABLE | MAINTENANCE_HOLD | DOCUMENT_LAPSE — derived from MaintenanceWindow + DocumentPermit children" }
      - { name: posture_reason, type: string, source: computed, description: "Human-readable reason for non-AVAILABLE posture" }

  - name: DocumentPermit
    parent: Aircraft
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; owning tail" }
      - { name: doc_kind, type: enum, source: input, description: "AIRWORTHINESS_CERT | REGISTRATION | INSURANCE | OPS_SPECS | NOISE_CERT | INTERNATIONAL_PERMIT" }
      - { name: identifier, type: string, source: input, description: "Document number" }
      - { name: issued_at, type: datetime, source: input, description: "Issue timestamp" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry timestamp; lapse when expires_at <= current clock" }
      - { name: status, type: enum, source: computed, description: "CURRENT | EXPIRED — recomputed whenever the logical clock advances or on read" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: employee_number, type: string, source: input, description: "Unique employee number" }
      - { name: full_name, type: string, source: input, description: "Pilot name" }
      - { name: seat_qualification, type: enum, source: input, description: "PIC | SIC — pilot-in-command vs second-in-command" }
      - { name: type_ratings, type: array, source: input, description: "List of aircraft_type values the crew is type-rated on; must contain FlightLeg's assigned aircraft type" }
      - { name: training_valid_until, type: datetime, source: input, description: "Recurrent training expiry; leg departure must be strictly before this instant" }
      - { name: duty_window_start_utc, type: datetime, source: system, description: "Start of the crew's current rolling duty window; set on first assignment of a duty day" }
      - { name: duty_minutes_used, type: integer, source: computed, description: "Minutes of block time already assigned within the current duty window" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ON_LEAVE | INACTIVE", default: ACTIVE }

  - name: BusinessUnit
    parent: null
    common_fields: true
    fields:
      - { name: bu_code, type: string, source: input, description: "Unique cost-center code, e.g. BU-EXEC" }
      - { name: name, type: string, source: input, description: "Business unit name" }
      - { name: annual_flight_budget_cents, type: integer, source: input, description: "Annual budget in cents, >= 0" }
      - { name: allocated_cents, type: integer, source: computed, description: "Running total of allocated cost on SETTLED TripRequests in the current calendar year; starts at 0" }

  - name: PassengerProfile
    parent: null
    common_fields: true
    fields:
      - { name: employee_number, type: string, source: input, description: "Unique employee number" }
      - { name: full_name, type: string, source: input, description: "Passenger name" }
      - { name: priority_tier, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3 — TIER_1 preempts TIER_2 preempts TIER_3" }
      - { name: home_bu_id, type: string, source: input, description: "FK -> BusinessUnit.id; default cost center for the passenger's trips" }
      - { name: sifl_control_employee, type: boolean, source: input, description: "True when the passenger is a control employee per IRS rules; drives SIFL multiplier" }

  - name: TripRequest
    parent: null
    common_fields: true
    fields:
      - { name: requester_id, type: string, source: input, description: "FK -> PassengerProfile.id; executive requesting the trip" }
      - { name: charge_bu_id, type: string, source: input, description: "FK -> BusinessUnit.id; business unit receiving cost allocation" }
      - { name: trip_kind, type: enum, source: input, description: "BUSINESS | PERSONAL | MIXED" }
      - { name: purpose, type: string, source: input, description: "Free-text purpose" }
      - { name: requested_departure_utc, type: datetime, source: input, description: "Desired first-leg departure" }
      - { name: requested_return_utc, type: datetime, source: input, description: "Desired final-leg arrival; must be strictly after requested_departure_utc" }
      - { name: passenger_ids, type: array, source: input, description: "List of PassengerProfile ids riding; must include requester_id; size >= 1" }
      - { name: max_priority_tier, type: enum, source: computed, description: "Highest (TIER_1 > TIER_2 > TIER_3) priority_tier among passenger_ids" }
      - { name: approval_status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED — independent dimension 1" }
      - { name: assignment_status, type: enum, source: system, description: "UNASSIGNED | ASSIGNED | DISPATCHED | COMPLETED | CANCELLED — independent dimension 2" }
      - { name: personal_use_flag, type: boolean, source: input, description: "True when any leg carries personal-use passengers; requires FinanceAdmin personal-use approval before DISPATCH", default: false }
      - { name: personal_use_approved_by, type: string, source: system, description: "X-User-ID of the FinanceAdmin who approved personal use; set by the approve-personal-use endpoint" }
      - { name: assigned_by_user_id, type: string, source: system, description: "X-User-ID of the Dispatcher who ran assign-aircraft; used for segregation-of-duties checks" }
      - { name: dispatched_by_user_id, type: string, source: system, description: "X-User-ID of the Dispatcher who ran dispatch; used for segregation-of-duties checks" }
      - { name: sifl_imputed_income_cents, type: integer, source: computed, description: "SIFL imputed income in cents, computed at SETTLEMENT for personal-use passengers" }
      - { name: allocated_cost_cents, type: integer, source: computed, description: "Cost allocated to charge_bu_id at settlement" }
      - { name: settlement_status, type: enum, source: system, description: "UNSETTLED | SETTLED — set when finance closes the trip" }

  - name: FlightLeg
    parent: TripRequest
    common_fields: true
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; parent trip" }
      - { name: leg_sequence, type: integer, source: input, description: "1-based ordering of legs inside the trip; unique per trip" }
      - { name: origin_icao, type: string, source: input, description: "Departure airport ICAO" }
      - { name: destination_icao, type: string, source: input, description: "Arrival airport ICAO" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Planned departure" }
      - { name: scheduled_arrival_utc, type: datetime, source: input, description: "Planned arrival; strictly after scheduled_departure_utc" }
      - { name: distance_statute_miles, type: integer, source: input, description: "Great-circle statute miles between origin and destination; drives SIFL banding" }
      - { name: aircraft_id, type: string, source: system, description: "FK -> Aircraft.id; assigned by Selector, nullable until assignment" }
      - { name: pic_crew_id, type: string, source: system, description: "FK -> CrewMember.id; PIC assigned, nullable until crew pairing" }
      - { name: sic_crew_id, type: string, source: system, description: "FK -> CrewMember.id; SIC assigned, nullable until crew pairing" }
      - { name: block_minutes, type: integer, source: computed, description: "scheduled_arrival_utc minus scheduled_departure_utc, in whole minutes; feeds duty-time and cost calculations" }
      - { name: status, type: enum, source: system, description: "PLANNED | AIRCRAFT_ASSIGNED | CREWED | RELEASED | COMPLETED | CANCELLED" }

  - name: MaintenanceWindow
    parent: Aircraft
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; tail under maintenance" }
      - { name: window_start_utc, type: datetime, source: input, description: "Start of downtime (inclusive)" }
      - { name: window_end_utc, type: datetime, source: input, description: "End of downtime (exclusive); strictly after window_start_utc" }
      - { name: maintenance_kind, type: enum, source: input, description: "SCHEDULED_INSPECTION | UNSCHEDULED_REPAIR | AVIONICS_UPGRADE | ENGINE_OVERHAUL" }
      - { name: status, type: enum, source: system, description: "PLANNED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: CateringOrder
    parent: FlightLeg
    common_fields: true
    fields:
      - { name: flight_leg_id, type: string, source: input, description: "FK -> FlightLeg.id; leg being catered" }
      - { name: vendor_name, type: string, source: input, description: "Catering vendor" }
      - { name: menu_code, type: string, source: input, description: "Vendor menu code" }
      - { name: headcount, type: integer, source: input, description: "Meals to board, >= 1" }
      - { name: quoted_cost_cents, type: integer, source: input, description: "Vendor quote in cents, >= 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | DELIVERED | CANCELLED" }

  - name: GroundTransport
    parent: FlightLeg
    common_fields: true
    fields:
      - { name: flight_leg_id, type: string, source: input, description: "FK -> FlightLeg.id; leg requiring ground transport at destination" }
      - { name: provider_name, type: string, source: input, description: "Car service provider" }
      - { name: pickup_minutes_after_arrival, type: integer, source: input, description: "Minutes after scheduled_arrival_utc the car meets passengers, >= 0" }
      - { name: quoted_cost_cents, type: integer, source: input, description: "Provider quote in cents, >= 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED" }

  - name: CharterSupplement
    parent: null
    common_fields: true
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; trip that cannot be covered by the fleet" }
      - { name: vendor_name, type: string, source: input, description: "Charter operator" }
      - { name: quoted_cost_cents, type: integer, source: input, description: "Charter quote, >= 0" }
      - { name: aircraft_type_offered, type: enum, source: input, description: "LIGHT_JET | MIDSIZE_JET | HEAVY_JET | TURBOPROP" }
      - { name: status, type: enum, source: system, description: "QUOTED | ACCEPTED | DECLINED | EXPIRED" }

  - name: SiflRatePeriod
    parent: null
    common_fields: true
    fields:
      - { name: period_start_utc, type: datetime, source: input, description: "Start (inclusive) of the IRS semi-annual rate period" }
      - { name: period_end_utc, type: datetime, source: input, description: "End (exclusive) of the rate period; strictly after period_start_utc; periods for the same lookup date must not overlap" }
      - { name: terminal_charge_cents, type: integer, source: input, description: "Terminal charge per flight, in cents, >= 0" }
      - { name: rate_band_1_cents_per_mile, type: integer, source: input, description: "Cents per statute mile for band 1 (0-500 miles)" }
      - { name: rate_band_2_cents_per_mile, type: integer, source: input, description: "Cents per statute mile for band 2 (501-1500 miles)" }
      - { name: rate_band_3_cents_per_mile, type: integer, source: input, description: "Cents per statute mile for band 3 (> 1500 miles)" }
      - { name: control_employee_multiplier_pct, type: integer, source: input, description: "Percentage multiplier applied for control employees, e.g. 400 means 4.00x" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TripRequest
    initial_state: "approval_status=DRAFT, assignment_status=UNASSIGNED"
    terminal_states:
      - "approval_status=REJECTED"
      - "assignment_status=CANCELLED"
      - "assignment_status=COMPLETED"
    transitions:
      - from: "approval_status=DRAFT"
        to: "approval_status=SUBMITTED"
        trigger: "POST /flight-ops/trip-requests/{id}/submit"
        actor: "ExecutiveRequester"
        preconditions:
          - "trip has >= 1 FlightLeg child in PLANNED"
          - "requester_id is the acting PassengerProfile"
        side_effects:
          - "max_priority_tier recomputed from passenger_ids"

      - from: "approval_status=SUBMITTED"
        to: "approval_status=APPROVED"
        trigger: "POST /flight-ops/trip-requests/{id}/approve"
        actor: "FlightDeptManager"
        preconditions:
          - "every FlightLeg's scheduled_departure_utc is strictly after current clock"
        side_effects:
          - "selector engine attempts aircraft assignment on every PLANNED leg (see assign-aircraft)"

      - from: "approval_status=SUBMITTED"
        to: "approval_status=REJECTED"
        trigger: "POST /flight-ops/trip-requests/{id}/reject"
        actor: "FlightDeptManager"
        preconditions: []
        side_effects:
          - "every PLANNED FlightLeg cascades to CANCELLED"
          - "CateringOrder children in REQUESTED/CONFIRMED cascade to CANCELLED"
          - "GroundTransport children in REQUESTED/CONFIRMED cascade to CANCELLED"

      - from: "approval_status=APPROVED, assignment_status=UNASSIGNED"
        to: "assignment_status=ASSIGNED"
        trigger: "POST /flight-ops/trip-requests/{id}/assign-aircraft"
        actor: "Dispatcher"
        preconditions:
          - "at least one PLANNED FlightLeg exists"
          - "expected_trip_request_version matches current version (OCC)"
        side_effects:
          - "every PLANNED FlightLeg transitions to AIRCRAFT_ASSIGNED with aircraft_id set by selector"
          - "assigned_by_user_id set to the acting Dispatcher's X-User-ID"
          - "increments TripRequest.version by 1"

      - from: "assignment_status=ASSIGNED"
        to: "assignment_status=DISPATCHED"
        trigger: "POST /flight-ops/trip-requests/{id}/dispatch"
        actor: "Dispatcher"
        preconditions:
          - "every FlightLeg is in CREWED or COMPLETED"
          - "personal_use_flag == false OR personal_use_approved_by is set"
          - "segregation of duties: when personal_use_flag is true, acting Dispatcher's X-User-ID must differ from assigned_by_user_id"
        side_effects:
          - "dispatched_by_user_id set to the acting Dispatcher's X-User-ID"
          - "CrewMember.duty_minutes_used incremented by sum of leg block_minutes for both PIC and SIC"
          - "CrewMember.duty_window_start_utc set when first assignment of duty day"

      - from: "assignment_status=DISPATCHED"
        to: "assignment_status=COMPLETED"
        trigger: "system (every FlightLeg reaches COMPLETED)"
        actor: "system"
        preconditions:
          - "every FlightLeg.status == COMPLETED"
        side_effects:
          - "settlement_status remains UNSETTLED until finance closes"

      - from: "assignment_status in {UNASSIGNED, ASSIGNED}"
        to: "assignment_status=CANCELLED"
        trigger: "POST /flight-ops/trip-requests/{id}/cancel"
        actor: "Dispatcher | ExecutiveRequester | FlightDeptManager"
        preconditions: []
        side_effects:
          - "every non-terminal FlightLeg cascades to CANCELLED"
          - "CateringOrder and GroundTransport children in REQUESTED/CONFIRMED cascade to CANCELLED"

      - from: "settlement_status=UNSETTLED"
        to: "settlement_status=SETTLED"
        trigger: "POST /flight-ops/trip-requests/{id}/settle"
        actor: "FinanceAdmin"
        preconditions:
          - "assignment_status == COMPLETED"
          - "segregation of duties: when personal_use_flag is true, acting FinanceAdmin's X-User-ID must differ from personal_use_approved_by"
        side_effects:
          - "sifl_imputed_income_cents computed via sifl_imputed_income calculation"
          - "allocated_cost_cents computed via trip_cost_allocation calculation"
          - "BusinessUnit.allocated_cents incremented by allocated_cost_cents"
          - "increments TripRequest.version by 1"

  - entity: FlightLeg
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: AIRCRAFT_ASSIGNED
        trigger: "system (parent TripRequest assign-aircraft)"
        actor: "system"
        preconditions:
          - "selected Aircraft.posture == AVAILABLE"
          - "Aircraft.passenger_capacity >= trip passenger count"
          - "no overlapping AIRCRAFT_ASSIGNED/CREWED/RELEASED FlightLeg on same Aircraft with buffer rule (see aircraft_interval_overlap)"
        side_effects:
          - "aircraft_id set"
          - "block_minutes computed"

      - from: AIRCRAFT_ASSIGNED
        to: CREWED
        trigger: "POST /flight-ops/flight-legs/{id}/assign-crew"
        actor: "Dispatcher"
        preconditions:
          - "pic_crew_id != sic_crew_id"
          - "both crew ACTIVE and type-rated for assigned aircraft_type"
          - "both crew training_valid_until strictly after scheduled_departure_utc"
          - "duty-time check: duty_minutes_used + block_minutes <= DUTY_LIMIT_MINUTES"
          - "no overlapping CREWED/RELEASED FlightLeg on same CrewMember (see crew_interval_overlap)"
        side_effects:
          - "pic_crew_id, sic_crew_id set"

      - from: CREWED
        to: RELEASED
        trigger: "POST /flight-ops/flight-legs/{id}/release"
        actor: "Dispatcher"
        preconditions:
          - "parent TripRequest.approval_status == APPROVED"
          - "all CateringOrder for the leg are in CONFIRMED or CANCELLED"
          - "all GroundTransport for the leg are in CONFIRMED or CANCELLED"
        side_effects: []

      - from: RELEASED
        to: COMPLETED
        trigger: "POST /flight-ops/flight-legs/{id}/complete"
        actor: "Dispatcher"
        preconditions:
          - "current clock >= scheduled_arrival_utc"
        side_effects:
          - "if all sibling FlightLegs COMPLETED, parent TripRequest.assignment_status -> COMPLETED"

      - from: "PLANNED | AIRCRAFT_ASSIGNED | CREWED"
        to: CANCELLED
        trigger: "system (parent cascade) or POST /flight-ops/flight-legs/{id}/cancel"
        actor: "system | Dispatcher"
        preconditions: []
        side_effects:
          - "CateringOrder/GroundTransport children in REQUESTED/CONFIRMED cascade to CANCELLED"

  - entity: Aircraft
    initial_state: "status=ACTIVE, posture=AVAILABLE"
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: GROUNDED
        trigger: "POST /flight-ops/aircraft/{id}/ground"
        actor: "MaintenancePlanner"
        preconditions: []
        side_effects:
          - "posture recomputed -> MAINTENANCE_HOLD"
          - "every FlightLeg with this aircraft in AIRCRAFT_ASSIGNED/CREWED whose departure window intersects an open MaintenanceWindow cascades back to PLANNED with aircraft_id cleared"

      - from: GROUNDED
        to: ACTIVE
        trigger: "POST /flight-ops/aircraft/{id}/return-to-service"
        actor: "MaintenancePlanner"
        preconditions:
          - "no MaintenanceWindow in PLANNED/IN_PROGRESS overlapping current clock"
          - "every DocumentPermit with doc_kind in {AIRWORTHINESS_CERT, REGISTRATION, INSURANCE} is CURRENT"
        side_effects:
          - "posture recomputed"

      - from: "ACTIVE | GROUNDED"
        to: RETIRED
        trigger: "POST /flight-ops/aircraft/{id}/retire"
        actor: "FlightDeptManager"
        preconditions:
          - "no FlightLeg with this aircraft in AIRCRAFT_ASSIGNED/CREWED/RELEASED"
        side_effects:
          - "DocumentPermit children remain for audit"

  - entity: MaintenanceWindow
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "system (clock reaches window_start_utc)"
        actor: "system"
        preconditions: []
        side_effects:
          - "parent Aircraft.posture recomputed -> MAINTENANCE_HOLD"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /flight-ops/maintenance-windows/{id}/cancel"
        actor: "MaintenancePlanner"
        preconditions: []
        side_effects:
          - "parent Aircraft.posture recomputed"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /flight-ops/maintenance-windows/{id}/complete"
        actor: "MaintenancePlanner"
        preconditions:
          - "current clock >= window_end_utc"
        side_effects:
          - "parent Aircraft.posture recomputed"

  - entity: CateringOrder
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /flight-ops/catering-orders/{id}/confirm"
        actor: "Dispatcher"
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /flight-ops/catering-orders/{id}/deliver"
        actor: "Dispatcher"
        preconditions:
          - "parent FlightLeg.status in {CREWED, RELEASED}"
        side_effects: []
      - from: "REQUESTED | CONFIRMED"
        to: CANCELLED
        trigger: "POST /flight-ops/catering-orders/{id}/cancel or parent cascade"
        actor: "Dispatcher | system"
        preconditions: []
        side_effects: []

  - entity: GroundTransport
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /flight-ops/ground-transports/{id}/confirm"
        actor: "Dispatcher"
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /flight-ops/ground-transports/{id}/complete"
        actor: "Dispatcher"
        preconditions:
          - "parent FlightLeg.status == COMPLETED"
        side_effects: []
      - from: "REQUESTED | CONFIRMED"
        to: CANCELLED
        trigger: "POST /flight-ops/ground-transports/{id}/cancel or parent cascade"
        actor: "Dispatcher | system"
        preconditions: []
        side_effects: []

  - entity: CharterSupplement
    initial_state: QUOTED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /flight-ops/charter-supplements/{id}/accept"
        actor: "FlightDeptManager"
        preconditions:
          - "parent TripRequest.approval_status == APPROVED"
          - "parent TripRequest.assignment_status == UNASSIGNED"
        side_effects:
          - "TripRequest.assignment_status -> DISPATCHED (charter vendor operates the trip)"
          - "TripRequest.allocated_cost_cents deferred to settlement"

      - from: QUOTED
        to: DECLINED
        trigger: "POST /flight-ops/charter-supplements/{id}/decline"
        actor: "FlightDeptManager"
        preconditions: []
        side_effects: []

      - from: QUOTED
        to: EXPIRED
        trigger: "system (clock advances past TripRequest.requested_departure_utc)"
        actor: "system"
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: trip-assign-stale-version
    parent_entity: TripRequest
    write_endpoint: "POST /flight-ops/trip-requests/{id}/assign-aircraft"
    occ_field: "expected_trip_request_version"
    description: |
      Assigning aircraft to a TripRequest whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just modified the trip (passenger list change, leg insertion,
      settle cascade) and the current writer's view of the trip is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: trip-settle-stale-version
    parent_entity: TripRequest
    write_endpoint: "POST /flight-ops/trip-requests/{id}/settle"
    occ_field: "expected_trip_request_version"
    description: |
      Settling a TripRequest whose version has advanced since the client last
      observed it is rejected. Because settle computes SIFL and cost allocation
      from current leg state, a stale settle would freeze numbers against a
      superseded leg mix.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sifl_imputed_income
    trigger: "TripRequest transition UNSETTLED -> SETTLED"
    algorithm: tiered_pricing
    formula: |
      # Standard Industry Fare Level imputed income, per personal-use passenger.
      # Per leg, per personal-use passenger:
      #   distance_band statute miles:
      #     band1 (0-500 mi)     = min(miles, 500)
      #     band2 (501-1500 mi)  = max(0, min(miles, 1500) - 500)
      #     band3 (>1500 mi)     = max(0, miles - 1500)
      #   base_cents = terminal_charge_cents
      #              + band1 * rate_band_1_cents_per_mile
      #              + band2 * rate_band_2_cents_per_mile
      #              + band3 * rate_band_3_cents_per_mile
      #   if passenger.sifl_control_employee:
      #     base_cents = base_cents * control_employee_multiplier_pct / 100
      #   leg_per_passenger_cents = base_cents  (each passenger carries full charge)
      # Rate period: the SiflRatePeriod whose [period_start_utc, period_end_utc)
      # contains the leg's scheduled_arrival_utc.
      # Rounding: each passenger's per-leg charge is rounded to whole cents
      # round_half_up BEFORE summing across legs and passengers (round-per-line-
      # then-sum order is pinned; do NOT sum then round).
      # Total = sum over (leg, personal-use passenger) of leg_per_passenger_cents.
      # personal-use passenger = passenger_ids on the TripRequest when
      # trip_kind == PERSONAL, or the subset flagged personal in trip manifest
      # when trip_kind == MIXED (here: requester_id only).
    input_set: |
      TripRequest where settlement_status flips UNSETTLED->SETTLED.
      Include all FlightLeg children of the trip whose status == COMPLETED.
      Include personal-use passengers: all passenger_ids when trip_kind == PERSONAL;
      only requester_id when trip_kind == MIXED; zero passengers when trip_kind == BUSINESS.
    constants:
      BAND_1_MAX_MILES: 500
      BAND_2_MAX_MILES: 1500
    precision: "0 decimal places (whole cents), round_half_up per (leg, passenger) line before summing"
    variants:
      - name: provisional_sifl
        when: "computed on demand by GET /flight-ops/trip-requests/{id}/sifl-preview before settlement"
        difference: "uses leg block distance for ALL legs regardless of leg.status (PLANNED/ASSIGNED/CREWED/RELEASED included), no persistence, and no requirement that trip be COMPLETED"
      - name: final_sifl
        when: "persisted at UNSETTLED -> SETTLED transition"
        difference: "uses only COMPLETED FlightLeg children; result persisted to sifl_imputed_income_cents"

  - name: trip_cost_allocation
    trigger: "TripRequest transition UNSETTLED -> SETTLED"
    algorithm: waterfall_allocation
    formula: |
      # Allocate the trip's total cost across its legs in leg_sequence order,
      # then sum to the trip-level allocation against the charge BusinessUnit.
      # Per leg:
      #   leg_cost_cents = block_minutes * cost_per_minute_cents(aircraft_type)
      #                  + catering_cents (sum of DELIVERED CateringOrder.quoted_cost_cents)
      #                  + ground_cents   (sum of COMPLETED GroundTransport.quoted_cost_cents)
      # If parent TripRequest was covered by an ACCEPTED CharterSupplement,
      #   leg_cost_cents is replaced by charter_prorated_share =
      #     quoted_cost_cents * block_minutes(leg) / sum(block_minutes over legs)
      #   rounded per-leg round_half_up; any cent remainder is credited/debited
      #   to the highest leg_sequence leg so that the leg shares sum exactly
      #   to quoted_cost_cents.
      # trip.allocated_cost_cents = sum over COMPLETED legs of leg_cost_cents.
      # Budget check: BusinessUnit.allocated_cents + allocated_cost_cents may
      # exceed annual_flight_budget_cents; the settle still succeeds but the
      # response includes over_budget=true when strictly greater.
    input_set: |
      TripRequest where settlement_status flips UNSETTLED->SETTLED.
      Include all FlightLeg children with status == COMPLETED, ordered by
      leg_sequence ASC (tie-break: created_at ASC).
      CateringOrder children with status == DELIVERED; GroundTransport children
      with status == COMPLETED.
    constants:
      COST_PER_MINUTE_CENTS_LIGHT_JET: 8500
      COST_PER_MINUTE_CENTS_MIDSIZE_JET: 14000
      COST_PER_MINUTE_CENTS_HEAVY_JET: 23000
      COST_PER_MINUTE_CENTS_TURBOPROP: 5000
    precision: "0 decimal places (whole cents), round_half_up per leg; charter proration remainder allocated to highest leg_sequence leg"
    variants:
      - name: owned_fleet_variant
        when: "no ACCEPTED CharterSupplement exists for the trip"
        difference: "leg cost = block_minutes * aircraft-type rate + services"
      - name: charter_variant
        when: "an ACCEPTED CharterSupplement covers the trip"
        difference: "leg cost replaced by prorated share of the charter quote; aircraft-type rate ignored"

  - name: aircraft_selector
    trigger: "TripRequest assign-aircraft action; one selection per PLANNED FlightLeg"
    algorithm: constraint_propagation
    formula: |
      # Candidate set: Aircraft where
      #   status == ACTIVE AND posture == AVAILABLE
      #   AND passenger_capacity >= |trip.passenger_ids|
      #   AND aircraft_type in requested equipment preference (if provided)
      #   AND no AIRCRAFT_ASSIGNED/CREWED/RELEASED FlightLeg on this Aircraft
      #       whose [departure-buffer, arrival+buffer) overlaps this leg's
      #       [scheduled_departure_utc - TURN_BUFFER_MINUTES,
      #        scheduled_arrival_utc + TURN_BUFFER_MINUTES)
      # Ranking: sort by (passenger_capacity ASC, home_base_icao == leg.origin_icao
      # DESC, created_at ASC). Smallest sufficient aircraft is preferred; home-base
      # match breaks capacity ties; created_at is the final deterministic tie-break.
      # Empty candidate set: leave FlightLeg PLANNED, mark trip for charter
      # eligibility (CharterSupplement may be created).
    input_set: "All Aircraft rows; all FlightLeg rows in AIRCRAFT_ASSIGNED/CREWED/RELEASED"
    constants:
      TURN_BUFFER_MINUTES: 90
    precision: "integer arithmetic on minutes; no rounding"
    variants: []

  - name: aircraft_posture_derivation
    trigger: "on any mutation of MaintenanceWindow or DocumentPermit children, on clock advance, and on read"
    algorithm: aggregation
    formula: |
      # posture =
      #   MAINTENANCE_HOLD  if status == GROUNDED
      #                     OR any MaintenanceWindow with status IN_PROGRESS
      #                     OR any MaintenanceWindow with status PLANNED whose
      #                        [window_start_utc, window_end_utc) contains current clock
      #   DOCUMENT_LAPSE    else if any DocumentPermit with doc_kind in
      #                     {AIRWORTHINESS_CERT, REGISTRATION, INSURANCE}
      #                     has expires_at <= current clock
      #   AVAILABLE         otherwise
      # MAINTENANCE_HOLD dominates DOCUMENT_LAPSE when both apply.
    input_set: "MaintenanceWindow children of this Aircraft with status in {PLANNED, IN_PROGRESS}; DocumentPermit children regardless of status"
    constants: {}
    precision: "exact timestamp comparison (<= for lapse boundary, half-open interval for maintenance)"
    variants: []

  - name: aircraft_interval_overlap
    trigger: "FlightLeg PLANNED -> AIRCRAFT_ASSIGNED candidate validation"
    algorithm: interval_merge
    formula: |
      # Leg interval = [scheduled_departure_utc - TURN_BUFFER_MINUTES,
      #                 scheduled_arrival_utc + TURN_BUFFER_MINUTES)
      # Overlap iff leg_interval intersects any existing AIRCRAFT_ASSIGNED /
      # CREWED / RELEASED leg's interval on the same Aircraft.
      # Half-open semantics: back-to-back legs where the later leg's buffered
      # start equals the earlier leg's buffered end do NOT overlap.
    input_set: "FlightLeg rows on the same Aircraft with status in {AIRCRAFT_ASSIGNED, CREWED, RELEASED}"
    constants:
      TURN_BUFFER_MINUTES: 90
    precision: "half-open interval comparison"
    variants: []

  - name: crew_interval_overlap
    trigger: "FlightLeg AIRCRAFT_ASSIGNED -> CREWED validation"
    algorithm: interval_merge
    formula: |
      # Crew leg interval = [scheduled_departure_utc, scheduled_arrival_utc)
      # with NO turn buffer. Overlap iff strict time intersection on the same
      # CrewMember against any CREWED/RELEASED leg. Adjacent legs sharing an
      # endpoint are permitted (different interval semantics from
      # aircraft_interval_overlap, which uses buffered half-open).
    input_set: "FlightLeg rows referencing the same CrewMember (as PIC or SIC) with status in {CREWED, RELEASED}"
    constants: {}
    precision: "half-open interval comparison without buffer"
    variants: []

  - name: duty_time_check
    trigger: "FlightLeg AIRCRAFT_ASSIGNED -> CREWED validation"
    algorithm: threshold
    formula: |
      # duty_window = [duty_window_start_utc, duty_window_start_utc + 24h)
      # If leg.scheduled_departure_utc falls outside the current duty window
      # OR no duty window is open, a new duty window opens at
      # scheduled_departure_utc and duty_minutes_used resets to 0.
      # Check: duty_minutes_used + leg.block_minutes <= DUTY_LIMIT_MINUTES.
      # Boundary: equality is PERMITTED (<=, not <).
    input_set: "CrewMember being assigned; FlightLeg being crewed"
    constants:
      DUTY_LIMIT_MINUTES: 840
    precision: "integer minutes; boundary is inclusive (<= 840 passes)"
    variants: []

  - name: maintenance_training_conflict_check
    trigger: "FlightLeg PLANNED -> AIRCRAFT_ASSIGNED and AIRCRAFT_ASSIGNED -> CREWED"
    algorithm: interval_merge
    formula: |
      # Aircraft side: reject when any PLANNED/IN_PROGRESS MaintenanceWindow's
      # [window_start_utc, window_end_utc) intersects the leg's
      # [scheduled_departure_utc, scheduled_arrival_utc).
      # Crew side: reject when leg.scheduled_departure_utc >= crew.training_valid_until.
    input_set: "MaintenanceWindow rows on the assigned Aircraft; CrewMember training_valid_until"
    constants: {}
    precision: "half-open interval comparison; expiry comparison is strictly-less-than (departure must be < training_valid_until)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to invoke the endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-template resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Body-referenced FKs (requester_id, charge_bu_id, passenger_ids, aircraft_id, pic/sic crew ids, trip_request_id, flight_leg_id) resolve to existing entities"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all mutation endpoints with FK inputs"

  - priority: 5
    category: state
    check: "Target entity is in a state that permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "OCC expected_trip_request_version matches the TripRequest's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /flight-ops/trip-requests/{id}/assign-aircraft, POST /flight-ops/trip-requests/{id}/settle"

  - priority: 7
    category: business_safety
    check: "Crew legality: both crew ACTIVE, type-rated on the aircraft's aircraft_type, training_valid_until strictly after scheduled_departure_utc, duty_minutes_used + block_minutes <= DUTY_LIMIT_MINUTES"
    error_id: ERR_CREW_ILLEGAL
    http_status: 422
    applies_to: "POST /flight-ops/flight-legs/{id}/assign-crew"

  - priority: 8
    category: business_safety
    check: "Aircraft airworthiness: posture == AVAILABLE at assign-aircraft time"
    error_id: ERR_AIRCRAFT_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /flight-ops/trip-requests/{id}/assign-aircraft"

  - priority: 9
    category: business_temporal
    check: "No aircraft interval overlap with buffered half-open semantics (aircraft_interval_overlap)"
    error_id: ERR_AIRCRAFT_INTERVAL_CONFLICT
    http_status: 422
    applies_to: "POST /flight-ops/trip-requests/{id}/assign-aircraft"

  - priority: 10
    category: business_temporal
    check: "No crew interval overlap with unbuffered half-open semantics (crew_interval_overlap)"
    error_id: ERR_CREW_INTERVAL_CONFLICT
    http_status: 422
    applies_to: "POST /flight-ops/flight-legs/{id}/assign-crew"

  - priority: 11
    category: business_temporal
    check: "Maintenance window conflict: no PLANNED/IN_PROGRESS MaintenanceWindow intersecting the leg interval; training_valid_until strictly after departure"
    error_id: ERR_MAINTENANCE_CONFLICT
    http_status: 422
    applies_to: "POST /flight-ops/trip-requests/{id}/assign-aircraft, POST /flight-ops/flight-legs/{id}/assign-crew"

  - priority: 12
    category: business_constraint
    check: "Capacity: Aircraft.passenger_capacity >= |passenger_ids|; leg_sequence unique per trip; passenger_ids includes requester_id; scheduled_arrival_utc strictly after scheduled_departure_utc"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 422
    applies_to: "POST /flight-ops/trip-requests, POST /flight-ops/trip-requests/{id}/flight-legs, POST /flight-ops/trip-requests/{id}/assign-aircraft"

  - priority: 13
    category: business_constraint
    check: "Segregation of duties: when personal_use_flag is true, dispatch requires acting Dispatcher X-User-ID != assigned_by_user_id; settle requires acting FinanceAdmin X-User-ID != personal_use_approved_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /flight-ops/trip-requests/{id}/dispatch, POST /flight-ops/trip-requests/{id}/settle"

  - priority: 14
    category: business_referential
    check: "Personal-use governance: when personal_use_flag is true, personal_use_approved_by must be set before dispatch"
    error_id: ERR_PERSONAL_USE_NOT_APPROVED
    http_status: 422
    applies_to: "POST /flight-ops/trip-requests/{id}/dispatch"

  - priority: 15
    category: business_fiscal
    check: "Charter quote currency: CharterSupplement can only be ACCEPTED when trip is APPROVED and UNASSIGNED"
    error_id: ERR_CHARTER_STATE_INVALID
    http_status: 422
    applies_to: "POST /flight-ops/charter-supplements/{id}/accept"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Clock (test-driving) ----------
  - method: POST
    path: /flight-ops/_clock/set_current_utc
    description: "Advance the logical clock. Server default on startup is exactly 2026-08-01T00:00:00Z; the logical clock MUST NOT fall back to wall-clock time. Side effect: recompute DocumentPermit.status and Aircraft.posture; MaintenanceWindow PLANNED -> IN_PROGRESS when window_start_utc is reached; CharterSupplement QUOTED -> EXPIRED when trip departure passes."
    roles: [FlightDeptManager]
    code: 200
    input: [to_iso8601]
    output: { now_utc: string }
    side_effects: ["posture recomputation", "maintenance window auto-start", "charter quote expiry"]

  # ---------- Aircraft ----------
  - method: POST
    path: /flight-ops/aircraft
    description: "Register an aircraft"
    roles: [FlightDeptManager]
    code: 201
    input: [tail_number, aircraft_type, passenger_capacity, home_base_icao]
    output: Aircraft
    side_effects: []

  - method: GET
    path: /flight-ops/aircraft
    description: "List aircraft; supports status?, posture?, limit, offset"
    roles: [FlightDeptManager, Dispatcher, MaintenancePlanner, FinanceAdmin]
    code: 200
    input:
      - "status?"
      - "posture?"
      - "limit?"
      - "offset?"
    output: Aircraft[]
    side_effects: []

  - method: GET
    path: /flight-ops/aircraft/{id}
    description: "Read one aircraft (posture recomputed on read)"
    roles: [FlightDeptManager, Dispatcher, MaintenancePlanner, FinanceAdmin]
    code: 200
    input: []
    output: Aircraft
    side_effects: []

  - method: POST
    path: /flight-ops/aircraft/{id}/ground
    description: "Ground an aircraft; cascades affected FlightLegs back to PLANNED"
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["FlightLeg cascade PLANNED", "posture -> MAINTENANCE_HOLD"]

  - method: POST
    path: /flight-ops/aircraft/{id}/return-to-service
    description: "Return grounded aircraft to service after maintenance/document checks"
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["posture recomputed"]

  - method: POST
    path: /flight-ops/aircraft/{id}/retire
    description: "Retire an aircraft; forbidden while any leg holds it"
    roles: [FlightDeptManager]
    code: 200
    input: []
    output: Aircraft
    side_effects: []

  # ---------- DocumentPermit ----------
  - method: POST
    path: /flight-ops/aircraft/{id}/documents
    description: "Attach a document/permit to an aircraft"
    roles: [MaintenancePlanner]
    code: 201
    input: [doc_kind, identifier, issued_at, expires_at]
    output: DocumentPermit
    side_effects: ["parent Aircraft.posture recomputed"]

  - method: GET
    path: /flight-ops/aircraft/{id}/documents
    description: "List documents for an aircraft"
    roles: [FlightDeptManager, Dispatcher, MaintenancePlanner]
    code: 200
    input:
      - "limit?"
      - "offset?"
    output: DocumentPermit[]
    side_effects: []

  # ---------- CrewMember ----------
  - method: POST
    path: /flight-ops/crew-members
    description: "Register a crew member"
    roles: [FlightDeptManager]
    code: 201
    input: [employee_number, full_name, seat_qualification, type_ratings, training_valid_until]
    output: CrewMember
    side_effects: []

  - method: GET
    path: /flight-ops/crew-members
    description: "List crew; supports status?, seat_qualification?, limit, offset"
    roles: [FlightDeptManager, Dispatcher]
    code: 200
    input:
      - "status?"
      - "seat_qualification?"
      - "limit?"
      - "offset?"
    output: CrewMember[]
    side_effects: []

  - method: GET
    path: /flight-ops/crew-members/{id}
    description: "Read one crew member"
    roles: [FlightDeptManager, Dispatcher]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  # ---------- BusinessUnit ----------
  - method: POST
    path: /flight-ops/business-units
    description: "Register a business unit"
    roles: [FinanceAdmin]
    code: 201
    input: [bu_code, name, annual_flight_budget_cents]
    output: BusinessUnit
    side_effects: []

  - method: GET
    path: /flight-ops/business-units
    description: "List business units"
    roles: [FinanceAdmin, FlightDeptManager]
    code: 200
    input:
      - "limit?"
      - "offset?"
    output: BusinessUnit[]
    side_effects: []

  - method: GET
    path: /flight-ops/business-units/{id}
    description: "Read one business unit"
    roles: [FinanceAdmin, FlightDeptManager]
    code: 200
    input: []
    output: BusinessUnit
    side_effects: []

  # ---------- PassengerProfile ----------
  - method: POST
    path: /flight-ops/passenger-profiles
    description: "Register a passenger"
    roles: [FlightDeptManager]
    code: 201
    input: [employee_number, full_name, priority_tier, home_bu_id, sifl_control_employee]
    output: PassengerProfile
    side_effects: []

  - method: GET
    path: /flight-ops/passenger-profiles
    description: "List passengers; supports home_bu_id? filter for FK reverse-reachability"
    roles: [FlightDeptManager, Dispatcher, FinanceAdmin]
    code: 200
    input:
      - "home_bu_id?"
      - "limit?"
      - "offset?"
    output: PassengerProfile[]
    side_effects: []

  - method: GET
    path: /flight-ops/passenger-profiles/{id}
    description: "Read one passenger"
    roles: [FlightDeptManager, Dispatcher, FinanceAdmin]
    code: 200
    input: []
    output: PassengerProfile
    side_effects: []

  # ---------- TripRequest ----------
  - method: POST
    path: /flight-ops/trip-requests
    description: "Create a trip request"
    roles: [ExecutiveRequester]
    code: 201
    input:
      - "requester_id"
      - "charge_bu_id"
      - "trip_kind"
      - "purpose"
      - "requested_departure_utc"
      - "requested_return_utc"
      - "passenger_ids"
      - "personal_use_flag?"
    output: TripRequest
    side_effects: []

  - method: GET
    path: /flight-ops/trip-requests
    description: "List trip requests; supports approval_status?, assignment_status?, requester_id?, charge_bu_id?, limit, offset"
    roles: [FlightDeptManager, Dispatcher, FinanceAdmin, ExecutiveRequester]
    code: 200
    input:
      - "approval_status?"
      - "assignment_status?"
      - "requester_id?"
      - "charge_bu_id?"
      - "limit?"
      - "offset?"
    output: TripRequest[]
    side_effects: []

  - method: GET
    path: /flight-ops/trip-requests/{id}
    description: "Read one trip"
    roles: [FlightDeptManager, Dispatcher, FinanceAdmin, ExecutiveRequester]
    code: 200
    input: []
    output: TripRequest
    side_effects: []

  - method: POST
    path: /flight-ops/trip-requests/{id}/submit
    description: "Submit a draft trip for approval"
    roles: [ExecutiveRequester]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["max_priority_tier recomputed"]

  - method: POST
    path: /flight-ops/trip-requests/{id}/approve
    description: "Approve a submitted trip"
    roles: [FlightDeptManager]
    code: 200
    input: []
    output: TripRequest
    side_effects: []

  - method: POST
    path: /flight-ops/trip-requests/{id}/reject
    description: "Reject a submitted trip; cascades legs and services to CANCELLED"
    roles: [FlightDeptManager]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["FlightLeg cascade CANCELLED", "service cascade CANCELLED"]

  - method: POST
    path: /flight-ops/trip-requests/{id}/assign-aircraft
    description: "Run aircraft selector over all PLANNED legs; OCC-guarded"
    roles: [Dispatcher]
    code: 200
    input: [expected_trip_request_version]
    output: TripRequest
    side_effects: ["FlightLeg PLANNED -> AIRCRAFT_ASSIGNED", "increments TripRequest.version by 1"]

  - method: POST
    path: /flight-ops/trip-requests/{id}/dispatch
    description: "Dispatch an assigned trip after crewing; enforces personal-use approval and segregation of duties"
    roles: [Dispatcher]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["CrewMember.duty_minutes_used incremented"]

  - method: POST
    path: /flight-ops/trip-requests/{id}/cancel
    description: "Cancel a trip before completion"
    roles: [Dispatcher, ExecutiveRequester, FlightDeptManager]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["FlightLeg cascade CANCELLED", "service cascade CANCELLED"]

  - method: POST
    path: /flight-ops/trip-requests/{id}/approve-personal-use
    description: "FinanceAdmin records personal-use approval; sets personal_use_approved_by"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["personal_use_approved_by set to acting X-User-ID"]

  - method: POST
    path: /flight-ops/trip-requests/{id}/settle
    description: "Finance closes a completed trip; computes SIFL and cost allocation; OCC-guarded"
    roles: [FinanceAdmin]
    code: 200
    input: [expected_trip_request_version]
    output: TripRequest
    side_effects: ["sifl_imputed_income_cents computed", "allocated_cost_cents computed", "BusinessUnit.allocated_cents incremented", "increments TripRequest.version by 1"]

  - method: GET
    path: /flight-ops/trip-requests/{id}/sifl-preview
    description: "Provisional SIFL over all legs regardless of leg status (variant of sifl_imputed_income)"
    roles: [FinanceAdmin, FlightDeptManager]
    code: 200
    input: []
    output: { provisional_sifl_cents: integer, leg_count_included: integer }
    side_effects: []

  # ---------- FlightLeg ----------
  - method: POST
    path: /flight-ops/trip-requests/{id}/flight-legs
    description: "Add a leg to a trip"
    roles: [ExecutiveRequester, Dispatcher]
    code: 201
    input: [leg_sequence, origin_icao, destination_icao, scheduled_departure_utc, scheduled_arrival_utc, distance_statute_miles]
    output: FlightLeg
    side_effects: ["block_minutes computed"]

  - method: GET
    path: /flight-ops/trip-requests/{id}/flight-legs
    description: "List legs of a trip"
    roles: [FlightDeptManager, Dispatcher, FinanceAdmin, ExecutiveRequester]
    code: 200
    input:
      - "limit?"
      - "offset?"
    output: FlightLeg[]
    side_effects: []

  - method: GET
    path: /flight-ops/flight-legs
    description: "Filtered list of flight legs; supports aircraft_id?, pic_crew_id?, sic_crew_id?, status?, trip_request_id? for FK reverse-reachability"
    roles: [FlightDeptManager, Dispatcher, FinanceAdmin, ExecutiveRequester]
    code: 200
    input:
      - "aircraft_id?"
      - "pic_crew_id?"
      - "sic_crew_id?"
      - "status?"
      - "trip_request_id?"
      - "limit?"
      - "offset?"
    output: FlightLeg[]
    side_effects: []

  - method: GET
    path: /flight-ops/flight-legs/{id}
    description: "Read one leg"
    roles: [FlightDeptManager, Dispatcher, FinanceAdmin, ExecutiveRequester]
    code: 200
    input: []
    output: FlightLeg
    side_effects: []

  - method: POST
    path: /flight-ops/flight-legs/{id}/assign-crew
    description: "Pair PIC and SIC onto an AIRCRAFT_ASSIGNED leg"
    roles: [Dispatcher]
    code: 200
    input: [pic_crew_id, sic_crew_id]
    output: FlightLeg
    side_effects: ["pic_crew_id, sic_crew_id set"]

  - method: POST
    path: /flight-ops/flight-legs/{id}/release
    description: "Release a crewed leg once services are confirmed"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightLeg
    side_effects: []

  - method: POST
    path: /flight-ops/flight-legs/{id}/complete
    description: "Mark a released leg completed after arrival time"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightLeg
    side_effects: ["parent TripRequest assignment_status auto-COMPLETED when all legs COMPLETED"]

  - method: POST
    path: /flight-ops/flight-legs/{id}/cancel
    description: "Cancel one leg"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightLeg
    side_effects: ["service cascade CANCELLED"]

  # ---------- MaintenanceWindow ----------
  - method: POST
    path: /flight-ops/aircraft/{id}/maintenance-windows
    description: "Schedule a maintenance window on an aircraft"
    roles: [MaintenancePlanner]
    code: 201
    input: [window_start_utc, window_end_utc, maintenance_kind]
    output: MaintenanceWindow
    side_effects: ["parent Aircraft.posture recomputed"]

  - method: GET
    path: /flight-ops/aircraft/{id}/maintenance-windows
    description: "List maintenance windows for an aircraft"
    roles: [FlightDeptManager, Dispatcher, MaintenancePlanner]
    code: 200
    input:
      - "status?"
      - "limit?"
      - "offset?"
    output: MaintenanceWindow[]
    side_effects: []

  - method: POST
    path: /flight-ops/maintenance-windows/{id}/cancel
    description: "Cancel a planned window"
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["parent Aircraft.posture recomputed"]

  - method: POST
    path: /flight-ops/maintenance-windows/{id}/complete
    description: "Mark an in-progress window completed"
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["parent Aircraft.posture recomputed"]

  # ---------- CateringOrder ----------
  - method: POST
    path: /flight-ops/flight-legs/{id}/catering-orders
    description: "Order catering for a leg"
    roles: [Dispatcher]
    code: 201
    input: [vendor_name, menu_code, headcount, quoted_cost_cents]
    output: CateringOrder
    side_effects: []

  - method: GET
    path: /flight-ops/flight-legs/{id}/catering-orders
    description: "List catering for a leg"
    roles: [Dispatcher, FlightDeptManager]
    code: 200
    input:
      - "limit?"
      - "offset?"
    output: CateringOrder[]
    side_effects: []

  - method: POST
    path: /flight-ops/catering-orders/{id}/confirm
    description: "Confirm a catering order with the vendor"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CateringOrder
    side_effects: []

  - method: POST
    path: /flight-ops/catering-orders/{id}/deliver
    description: "Mark catering delivered once the leg is crewed or released"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CateringOrder
    side_effects: []

  - method: POST
    path: /flight-ops/catering-orders/{id}/cancel
    description: "Cancel a catering order"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CateringOrder
    side_effects: []

  # ---------- GroundTransport ----------
  - method: POST
    path: /flight-ops/flight-legs/{id}/ground-transports
    description: "Book ground transport for a leg"
    roles: [Dispatcher]
    code: 201
    input: [provider_name, pickup_minutes_after_arrival, quoted_cost_cents]
    output: GroundTransport
    side_effects: []

  - method: GET
    path: /flight-ops/flight-legs/{id}/ground-transports
    description: "List ground transports for a leg"
    roles: [Dispatcher, FlightDeptManager]
    code: 200
    input:
      - "limit?"
      - "offset?"
    output: GroundTransport[]
    side_effects: []

  - method: POST
    path: /flight-ops/ground-transports/{id}/confirm
    description: "Confirm ground transport"
    roles: [Dispatcher]
    code: 200
    input: []
    output: GroundTransport
    side_effects: []

  - method: POST
    path: /flight-ops/ground-transports/{id}/complete
    description: "Complete ground transport after leg completion"
    roles: [Dispatcher]
    code: 200
    input: []
    output: GroundTransport
    side_effects: []

  - method: POST
    path: /flight-ops/ground-transports/{id}/cancel
    description: "Cancel ground transport"
    roles: [Dispatcher]
    code: 200
    input: []
    output: GroundTransport
    side_effects: []

  # ---------- CharterSupplement ----------
  - method: POST
    path: /flight-ops/charter-supplements
    description: "Record a charter quote for an unassignable trip"
    roles: [Dispatcher]
    code: 201
    input: [trip_request_id, vendor_name, quoted_cost_cents, aircraft_type_offered]
    output: CharterSupplement
    side_effects: []

  - method: GET
    path: /flight-ops/charter-supplements
    description: "List charter quotes; supports trip_request_id?, status?, limit, offset"
    roles: [FlightDeptManager, Dispatcher, FinanceAdmin]
    code: 200
    input:
      - "trip_request_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: CharterSupplement[]
    side_effects: []

  - method: GET
    path: /flight-ops/charter-supplements/{id}
    description: "Read one charter quote"
    roles: [FlightDeptManager, Dispatcher, FinanceAdmin]
    code: 200
    input: []
    output: CharterSupplement
    side_effects: []

  - method: POST
    path: /flight-ops/charter-supplements/{id}/accept
    description: "Accept a charter quote; trips moves to DISPATCHED under vendor operation"
    roles: [FlightDeptManager]
    code: 200
    input: []
    output: CharterSupplement
    side_effects: ["TripRequest.assignment_status -> DISPATCHED"]

  - method: POST
    path: /flight-ops/charter-supplements/{id}/decline
    description: "Decline a charter quote"
    roles: [FlightDeptManager]
    code: 200
    input: []
    output: CharterSupplement
    side_effects: []

  # ---------- SiflRatePeriod ----------
  - method: POST
    path: /flight-ops/sifl-rate-periods
    description: "Publish an IRS SIFL rate period"
    roles: [FinanceAdmin]
    code: 201
    input: [period_start_utc, period_end_utc, terminal_charge_cents, rate_band_1_cents_per_mile, rate_band_2_cents_per_mile, rate_band_3_cents_per_mile, control_employee_multiplier_pct]
    output: SiflRatePeriod
    side_effects: []

  - method: GET
    path: /flight-ops/sifl-rate-periods
    description: "List SIFL rate periods"
    roles: [FinanceAdmin, FlightDeptManager]
    code: 200
    input:
      - "limit?"
      - "offset?"
    output: SiflRatePeriod[]
    side_effects: []

  - method: GET
    path: /flight-ops/sifl-rate-periods/{id}
    description: "Read one rate period"
    roles: [FinanceAdmin, FlightDeptManager]
    code: 200
    input: []
    output: SiflRatePeriod
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on endpoint per §1.5 roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body FK (requester_id, charge_bu_id, passenger_ids entry, crew id, trip_request_id, flight_leg_id, aircraft_id) does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is in a state from which the requested transition is not defined per §1.2" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_trip_request_version does not match TripRequest.version" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body, wrong types, missing required fields" }
  - { id: ERR_CONSTRAINT_VIOLATION, http: 422, condition: "Capacity / leg-sequence uniqueness / passenger-roster containment / timestamp ordering violated" }
  - { id: ERR_CREW_ILLEGAL, http: 422, condition: "Crew inactive, not type-rated, training expired, or duty limit exceeded" }
  - { id: ERR_CREW_INTERVAL_CONFLICT, http: 422, condition: "Crew member already committed to an overlapping CREWED/RELEASED leg (unbuffered half-open)" }
  - { id: ERR_AIRCRAFT_NOT_AVAILABLE, http: 422, condition: "Selected aircraft posture is not AVAILABLE at assign time" }
  - { id: ERR_AIRCRAFT_INTERVAL_CONFLICT, http: 422, condition: "Aircraft already committed to an overlapping AIRCRAFT_ASSIGNED/CREWED/RELEASED leg (buffered half-open)" }
  - { id: ERR_MAINTENANCE_CONFLICT, http: 422, condition: "Maintenance window intersects leg interval, or crew training expires before departure" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same operator attempted two separated steps on a personal-use trip (assign vs dispatch, or dispatch vs settle)" }
  - { id: ERR_PERSONAL_USE_NOT_APPROVED, http: 422, condition: "personal_use_flag true but no FinanceAdmin approval recorded before dispatch" }
  - { id: ERR_CHARTER_STATE_INVALID, http: 422, condition: "Charter accept attempted on trip not in (APPROVED, UNASSIGNED)" }
  - { id: ERR_TRIP_NOT_COMPLETED, http: 422, condition: "Settle attempted before assignment_status == COMPLETED" }
  - { id: ERR_LEG_NOT_RELEASED, http: 422, condition: "Complete attempted on a leg not in RELEASED" }
  - { id: ERR_SERVICE_NOT_READY, http: 422, condition: "Release attempted while a catering order or ground transport is still in REQUESTED" }
  - { id: ERR_NO_CANDIDATE_AIRCRAFT, http: 422, condition: "Selector candidate pool is empty; trip is charter-eligible" }
  - { id: ERR_RATE_PERIOD_NOT_FOUND, http: 422, condition: "No SiflRatePeriod covers a leg's scheduled_arrival_utc at settle time" }
  - { id: ERR_OVERLAPPING_RATE_PERIOD, http: 422, condition: "New SiflRatePeriod overlaps an existing period (half-open intersection)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ExecutiveRequester
    description: "Executive or exec assistant who originates trip requests"
    identity: "entity_backed:PassengerProfile"
    exclusive_operations:
      - "POST /flight-ops/trip-requests"
      - "POST /flight-ops/trip-requests/{id}/submit"
    shared_operations:
      - "POST /flight-ops/trip-requests/{id}/flight-legs"
      - "POST /flight-ops/trip-requests/{id}/cancel"
      - "GET read endpoints"

  - name: Dispatcher
    description: "Flight-following dispatcher who assigns aircraft, pairs crew, coordinates services"
    identity: "opaque"
    exclusive_operations:
      - "POST /flight-ops/trip-requests/{id}/assign-aircraft"
      - "POST /flight-ops/trip-requests/{id}/dispatch"
      - "POST /flight-ops/flight-legs/{id}/assign-crew"
      - "POST /flight-ops/flight-legs/{id}/release"
      - "POST /flight-ops/flight-legs/{id}/complete"
      - "POST /flight-ops/flight-legs/{id}/cancel"
      - "catering and ground-transport mutations"
      - "POST /flight-ops/charter-supplements"
    shared_operations:
      - "POST /flight-ops/trip-requests/{id}/cancel"
      - "POST /flight-ops/trip-requests/{id}/flight-legs"
      - "GET read endpoints"

  - name: FlightDeptManager
    description: "Department manager; approves trips, manages aircraft registry, accepts charter"
    identity: "opaque"
    exclusive_operations:
      - "POST /flight-ops/trip-requests/{id}/approve"
      - "POST /flight-ops/trip-requests/{id}/reject"
      - "POST /flight-ops/aircraft"
      - "POST /flight-ops/aircraft/{id}/retire"
      - "POST /flight-ops/crew-members"
      - "POST /flight-ops/passenger-profiles"
      - "POST /flight-ops/charter-supplements/{id}/accept"
      - "POST /flight-ops/charter-supplements/{id}/decline"
      - "POST /flight-ops/_clock/set_current_utc"
    shared_operations:
      - "POST /flight-ops/trip-requests/{id}/cancel"
      - "GET read endpoints"

  - name: MaintenancePlanner
    description: "Plans maintenance windows and tracks document currency"
    identity: "opaque"
    exclusive_operations:
      - "POST /flight-ops/aircraft/{id}/ground"
      - "POST /flight-ops/aircraft/{id}/return-to-service"
      - "POST /flight-ops/aircraft/{id}/documents"
      - "POST /flight-ops/aircraft/{id}/maintenance-windows"
      - "POST /flight-ops/maintenance-windows/{id}/cancel"
      - "POST /flight-ops/maintenance-windows/{id}/complete"
    shared_operations:
      - "GET read endpoints"

  - name: FinanceAdmin
    description: "Finance business partner; settles trips, manages business units and SIFL rates, approves personal use"
    identity: "opaque"
    exclusive_operations:
      - "POST /flight-ops/trip-requests/{id}/settle"
      - "POST /flight-ops/trip-requests/{id}/approve-personal-use"
      - "POST /flight-ops/business-units"
      - "POST /flight-ops/sifl-rate-periods"
    shared_operations:
      - "GET read endpoints including /flight-ops/trip-requests/{id}/sifl-preview"
