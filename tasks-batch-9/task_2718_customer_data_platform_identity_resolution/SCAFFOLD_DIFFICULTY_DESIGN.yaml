                    phone_raw: "+1 (555) 120-0003"
                    loyalty_number: "LY00001103"
                    first_name: "Cleo"
                    last_name: "Charlie"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-10T12:00:00Z"
                    consent_signals: []
                  - external_id: "B4"
                    email_raw: "b4@example.com"
                    phone_raw: "+1 (555) 120-0004"
                    loyalty_number: "LY00001104"
                    first_name: "Dee"
                    last_name: "Delta"
                    postal_code: "10001"
                    address_line: null
