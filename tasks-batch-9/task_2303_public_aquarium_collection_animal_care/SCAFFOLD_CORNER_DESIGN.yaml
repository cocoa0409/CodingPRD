# SCAFFOLD_CORNER_DESIGN.yaml — task_2303 Public Aquarium Collection & Animal Care
#
# §1.9 breadth pass over the nine claim-extraction sections. Generation of this
# file WAS the §1.5 audit pass: every endpoint, error code, role, calculation,
# state machine and validation rule declared in SCAFFOLD.yaml was walked and
# either given a falsifiable instance below or explicitly deferred to a §1.8
# difficulty instance via `excluded_because`.
#
# instances: 91 total — 77 with a test_recipe, 14 deferred stubs.
# Every `name` is unique across the union of §1.8 and §1.9.
scaffold_corner_design:
- section: entities
  instances:
  - name: entity_life_support_system_creation_sets_defaults_and_system_fields
    claim_type: Creation
    grounds:
    - '§1.1 LifeSupportSystem (all fields, common_fields: true)'
    - §1.5 POST /aquarium/life-support-systems
    - §1.2 LifeSupportSystem.alarm_state initial_state NORMAL
    - §1.3 latest_reading_selector (no-reading fallback 100.00)
    distinguishing_aspect: A plant created with only the five declared inputs must come back with alarm_state NORMAL, water_quality_index 100.00, both consecutive counters 0, redundancy_overdue false and version 1 — none of which the caller supplied.
    test_recipe:
      setup:
      - clock at 2026-08-01T00:00:00Z; empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      trigger:
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      assert:
      - HTTP 201 and response_type == "object"
      - LifeSupportSystem.system_code == "LSS-COLD-1"
      - LifeSupportSystem.system_type == RECIRCULATING_MARINE
      - LifeSupportSystem.design_habitat == COLD_MARINE
      - LifeSupportSystem.redundancy_class == N_PLUS_1
      - LifeSupportSystem.redundancy_test_interval_days == 90
      - LifeSupportSystem.alarm_state == NORMAL
      - LifeSupportSystem.water_quality_index == 100.00
      - LifeSupportSystem.consecutive_normal_readings == 0
      - LifeSupportSystem.consecutive_breach_readings == 0
      - LifeSupportSystem.redundancy_overdue == false
      - LifeSupportSystem.last_redundancy_test_at == null
      - LifeSupportSystem.last_redundancy_test_result == null
      - LifeSupportSystem.version == 1 and id / created_at / updated_at are non-null
  - name: entity_exhibit_read_returns_zero_ledger_and_open_posture
    claim_type: Retrieval
    grounds:
    - §1.1 Exhibit.occupied_bioload_units / bioload_utilization_pct / posture / last_posture_reason / suspended_session_count / interaction_program_enabled
    - §1.5 GET /aquarium/exhibits/{id}
    - §1.3 exhibit_bioload_ledger
    - §1.3 exhibit_posture
    distinguishing_aspect: A freshly created exhibit reads back with occupied_bioload_units 0.00, bioload_utilization_pct 0.00, posture OPEN, last_posture_reason null and interaction_program_enabled false (the declared default, not the value of any input).
    test_recipe:
      setup:
      - One COLD_MARINE plant serving one COLD_MARINE exhibit of 100 bioload capacity units.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      trigger:
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: CuratorOfCollections
      assert:
      - HTTP 200 and response_type == "object"
      - Exhibit.exhibit_code == "EX-COLD-1" and Exhibit.habitat_type == COLD_MARINE
      - Exhibit.bioload_capacity_units == 100
      - Exhibit.occupied_bioload_units == 0.00
      - Exhibit.bioload_utilization_pct == 0.00
      - Exhibit.posture == OPEN
      - Exhibit.last_posture_reason == null
      - Exhibit.interaction_program_enabled == false
      - Exhibit.suspended_session_count == 0
      - Exhibit.version == 1
  - name: entity_species_listing_reports_total_count_and_has_more
    claim_type: Listing
    grounds:
    - §1.1 Species
    - §1.5 GET /aquarium/species
    - §1.5 pagination contract (limit 10 / offset 0, max 100, total_count, has_more)
    distinguishing_aspect: With three species rows, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, while limit=2&offset=2 returns 1 row with has_more false.
    test_recipe:
      setup:
      - Three Species rows with distinct scientific_name values.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp1_id: $.data.id, sp1_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Hippocampus abdominalis, common_name: pot-bellied seahorse, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 2, base_quarantine_days: 21, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp2_id: $.data.id, sp2_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Metridium senile, common_name: plumose anemone, taxon_group: INVERTEBRATE, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 1, base_quarantine_days: 14, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp3_id: $.data.id, sp3_v1: $.data.version}
      trigger:
      - call: GET /aquarium/species
        payload: {limit: 2, offset: 0}
        as: CuratorOfCollections
      - call: GET /aquarium/species
        payload: {limit: 2, offset: 2}
        as: CuratorOfCollections
      assert:
      - 'first call: HTTP 200, response_type == "array", 2 rows in data'
      - 'first call: total_count == 3, has_more == true, limit == 2, offset == 0'
      - 'second call: 1 row in data, total_count == 3, has_more == false, offset == 2'
      - the three returned ids across both pages are exactly ${sp1_id}, ${sp2_id}, ${sp3_id} with no duplicates
      - GET /aquarium/species?taxon_group=INVERTEBRATE returns total_count == 1
  - name: entity_get_unknown_specimen_id_returns_specimen_not_found
    claim_type: Not Found
    grounds:
    - §1.5 GET /aquarium/specimens/{id}
    - §1.6 ERR_SPECIMEN_NOT_FOUND (404)
    - §1.4 priority 5 (path-id existence)
    distinguishing_aspect: A syntactically valid but unknown Specimen id returns 404 ERR_SPECIMEN_NOT_FOUND, not 422 and not an empty 200.
    test_recipe:
      setup:
      - Empty database (no Specimen rows at all).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      trigger:
      - call: GET /aquarium/specimens/00000000-0000-4000-8000-000000000999
        payload: {}
        as: CuratorOfCollections
        captures: {err: $.data.error_id}
      assert:
      - HTTP 404 and response_type == "error"
      - data.error_id == ERR_SPECIMEN_NOT_FOUND
      - data.message is a non-empty string
      - meta.api_request_id and meta.api_request_timestamp are present on the error envelope
  - name: entity_exhibit_creation_without_bioload_capacity_units_is_rejected
    claim_type: Required Fields
    grounds:
    - '§1.1 Exhibit.bioload_capacity_units (source: input, no default)'
    - §1.5 POST /aquarium/exhibits
    - §1.6 ERR_VALIDATION (422)
    - §1.4 priority 7 (shape / required fields)
    distinguishing_aspect: bioload_capacity_units carries no default, so omitting it fails at priority 7 with ERR_VALIDATION and no Exhibit row is persisted.
    test_recipe:
      setup:
      - One COLD_MARINE plant; no exhibits yet.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      trigger:
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-2, name: Kelp Forest, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 90000}
        as: CuratorOfCollections
        captures: {err: $.data.error_id}
      assert:
      - HTTP 422 and data.error_id == ERR_VALIDATION
      - GET /aquarium/exhibits returns total_count == 0 — nothing was persisted
      - LifeSupportSystem.version == 1 (unchanged)
  - name: entity_species_wild_take_quota_annual_defaults_to_zero
    claim_type: Defaults
    grounds:
    - §1.1 Species.wild_take_quota_annual (default 0)
    - §1.1 Species.wild_take_quota_reserved (default 0)
    - §1.1 Species.permit_required (computed)
    - §1.3 derived_flag_reconciliation
    - §1.5 POST /aquarium/species
    distinguishing_aspect: Omitting the optional wild_take_quota_annual yields 0 — which is the declared 'wild collection not permitted' encoding — while permit_required is derived false from protection_status UNLISTED.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      trigger:
      - call: POST /aquarium/species
        payload: {scientific_name: Metridium senile, common_name: plumose anemone, taxon_group: INVERTEBRATE, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 1, base_quarantine_days: 14}
        as: CuratorOfCollections
      assert:
      - HTTP 201
      - Species.wild_take_quota_annual == 0
      - Species.wild_take_quota_reserved == 0
      - Species.permit_required == false
      - Species.version == 1
  - name: entity_specimen_bioload_units_snapshotted_from_species_at_creation
    claim_type: Computed Fields
    grounds:
    - §1.1 Specimen.bioload_units / quarantine_required_days / disposition_status / health_status / welfare_score / welfare_score_variant / captive_bred / exhibit_id
    - §1.3 quarantine_required_days
    - §1.3 derived_flag_reconciliation
    - §1.5 POST /aquarium/specimens
    - §1.2 Specimen.disposition_status initial_state QUARANTINE
    - §1.1 QuarantineCase.protocol_days / started_at / projected_release_at
    distinguishing_aspect: Specimen.bioload_units is copied from Species.bioload_units_per_specimen (12.5) at accession and quarantine_required_days is 30 for a TELEOST captive-bred arrival with base_quarantine_days 30 (ceil(30 * 1.0) + 0 surcharge, STANDARD tier).
    test_recipe:
      setup:
      - Approved plan line for a TELEOST species with bioload_units_per_specimen 12.5 and base_quarantine_days 30; a CAPTIVE_BRED acquisition request cleared for one specimen; clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12.5, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: CAPTIVE_BRED, requested_count: 1}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
      trigger:
      - call: POST /aquarium/specimens
        payload: {accession_code: SPC-0001, species_id: '${sp_id}', acquisition_request_id: '${ar_id}', arrival_at: '2026-08-01T00:00:00Z', holding_area: QT-BAY-1}
        as: CuratorOfCollections
        captures: {spec_id: $.data.id}
      - call: GET /aquarium/specimens/${spec_id}/quarantine-cases
        payload: {}
        as: VeterinaryOfficer
      assert:
      - HTTP 201 on the accession
      - Specimen.bioload_units == 12.5
      - Specimen.quarantine_required_days == 30
      - Specimen.disposition_status == QUARANTINE
      - Specimen.health_status == HEALTHY
      - Specimen.welfare_score == null and Specimen.welfare_score_variant == null
      - Specimen.captive_bred == false
      - Specimen.exhibit_id == null and Specimen.holding_area == "QT-BAY-1"
      - Specimen.version == 1
      - the quarantine-cases list returns exactly 1 row
      - QuarantineCase.status == ACTIVE, protocol_days == 30, extension_count == 0, total_extension_days == 0, clearance_exam_count == 0
      - QuarantineCase.started_at == 2026-08-01T00:00:00Z and QuarantineCase.projected_release_at == 2026-08-31T00:00:00Z
  - name: entity_water_quality_reading_is_immutable_and_carries_no_version
    claim_type: Immutability
    grounds:
    - '§1.1 WaterQualityReading (common_fields: false)'
    - §1.5 POST /aquarium/life-support-systems/{id}/water-quality-readings
    - §1.5 GET /aquarium/life-support-systems/{id}/water-quality-readings
    - §1.3 water_quality_index
    distinguishing_aspect: 'WaterQualityReading is declared common_fields: false and §1.5 exposes no PATCH or DELETE for it, so the recorded sample has no version field and can never be edited after insertion.'
    test_recipe:
      setup:
      - One COLD_MARINE plant, no readings yet; clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      trigger:
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: GET /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {}
        as: AquaristTechnician
      assert:
      - HTTP 201 on the reading
      - WaterQualityReading.severity == NORMAL
      - WaterQualityReading.water_quality_index_snapshot == 100.00
      - WaterQualityReading.breach_parameters == []
      - 'the reading payload carries no `version` and no `updated_at` field (common_fields: false)'
      - §1.5 declares no PATCH and no DELETE under /aquarium/life-support-systems/{id}/water-quality-readings, so the row is write-once
      - the list call returns total_count == 1 and data[0].water_quality_index_snapshot == 100.00
  - name: entity_husbandry_log_under_unknown_specimen_returns_specimen_not_found
    claim_type: Parent Relationships
    grounds:
    - §1.1 HusbandryLog.parent == Specimen
    - §1.5 POST /aquarium/specimens/{id}/husbandry-logs
    - §1.6 ERR_SPECIMEN_NOT_FOUND (404)
    - §1.4 priority 5
    distinguishing_aspect: The child write is refused with 404 ERR_SPECIMEN_NOT_FOUND when the path parent does not exist, before any field-shape complaint about the log body.
    test_recipe:
      setup:
      - Empty database; clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      trigger:
      - call: POST /aquarium/specimens/00000000-0000-4000-8000-000000000999/husbandry-logs
        payload: {log_type: FEEDING, logged_at: '2026-08-01T00:00:00Z', appetite_score: 4, feed_grams: 120.0}
        as: AquaristTechnician
        captures: {err: $.data.error_id}
      assert:
      - HTTP 404 and data.error_id == ERR_SPECIMEN_NOT_FOUND
      - no HusbandryLog row is created
  - name: entity_specimen_self_referential_parentage_sets_captive_bred_true
    claim_type: graph
    grounds:
    - §1.1 Specimen.sire_specimen_id / dam_specimen_id (self-referential FK)
    - §1.1 Specimen.captive_bred (computed)
    - §1.3 derived_flag_reconciliation
    - §1.5 POST /aquarium/specimens
    - §1.5 GET /aquarium/specimens (sire_specimen_id / dam_specimen_id filters)
    - §1.2 AcquisitionRequest CLEARED -> FULFILLED
    distinguishing_aspect: 'captive_bred flips to true only when BOTH parent ids are present: the two founder specimens keep captive_bred false, the third — created with sire and dam — reads true, and the graph edge is queryable through the sire_specimen_id filter.'
    test_recipe:
      setup:
      - Approved plan line for 3 specimens; one CLEARED acquisition request with requested_count 3; two founder specimens already accessioned.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 3, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: CAPTIVE_BRED, requested_count: 3}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
      - call: POST /aquarium/specimens
        payload: {accession_code: SPC-0001, species_id: '${sp_id}', acquisition_request_id: '${ar_id}', arrival_at: '2026-08-01T00:00:00Z', holding_area: QT-BAY-1}
        as: CuratorOfCollections
        captures: {sire_id: $.data.id}
      - call: POST /aquarium/specimens
        payload: {accession_code: SPC-0002, species_id: '${sp_id}', acquisition_request_id: '${ar_id}', arrival_at: '2026-08-01T00:00:00Z', holding_area: QT-BAY-1}
        as: CuratorOfCollections
        captures: {dam_id: $.data.id}
      trigger:
      - call: POST /aquarium/specimens
        payload: {accession_code: SPC-0003, species_id: '${sp_id}', acquisition_request_id: '${ar_id}', arrival_at: '2026-08-01T00:00:00Z', holding_area: QT-BAY-2, sire_specimen_id: '${sire_id}', dam_specimen_id: '${dam_id}'}
        as: CuratorOfCollections
        captures: {calf_id: $.data.id}
      - call: GET /aquarium/specimens
        payload: {sire_specimen_id: '${sire_id}'}
        as: CuratorOfCollections
      - call: GET /aquarium/acquisition-requests/${ar_id}
        payload: {}
        as: CuratorOfCollections
      assert:
      - HTTP 201 on the third accession
      - Specimen.${calf_id}.captive_bred == true
      - Specimen.${calf_id}.sire_specimen_id == ${sire_id} and Specimen.${calf_id}.dam_specimen_id == ${dam_id}
      - Specimen.${sire_id}.captive_bred == false and Specimen.${dam_id}.captive_bred == false
      - the filtered list returns total_count == 1 and data[0].id == ${calf_id}
      - AcquisitionRequest.fulfilled_count == 3 and AcquisitionRequest.status == FULFILLED
