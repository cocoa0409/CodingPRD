              payload: { target_status: "ACTIVE", reason: "Product filed.", expected_partner_version: "${partner_b_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_b_v2: $.data.version }
            - call: "POST /partners/${partner_b}/status-changes"
