            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { wk_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_code: "POS-CF", display_name: "POS CF", feed_kind: "SALES", territory: "DOMESTIC" }
              as: PlatformAdmin
              captures: { pv_sales: $.data.id }
            - call: "POST /providers"
