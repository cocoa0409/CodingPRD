# =============================================================================
# Waxing Studio Membership (European Wax Center style) — Scaffold seed tables
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# Difficulty band: Expert (per §0.4).
# =============================================================================

scenario: |
  636. Waxing Studio Membership (European Wax Center style): service menu &
  reservation, wax-pass/membership & prepaid credits, first-service-free intro,
  technician & room scheduling, product retail attach, package rollover & freeze,
  no-show/late & deposit, multi-location

domain_name: waxing-studio-membership
api_prefix: /studio

# =============================================================================
# Complexity profile (§0.1–§0.3) — Expert band (§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys (Location, Room, Technician,
  # ServiceType, Product, Member, Membership, Reservation, CreditLedgerEntry,
  # RetailSale, NoShowStrike). URLs are flat collections with FK fields in body
  # and filtered-list GETs for reverse reachability.

  state_machine_shape: parallel
  # Reservation carries two independent state axes (booking_status x
  # settlement_status). Membership has a branching/cyclic lifecycle
  # (ACTIVE<->FROZEN cycle plus PAST_DUE branch). CreditLedgerEntry is an
  # append-only event log.

  relationship_patterns:
    - one_to_many        # Location -> Room, Location -> Technician, Member -> Membership
    - cross_aggregate    # Reservation references Member, Room, Technician, ServiceType across aggregates
    - polymorphic        # CreditLedgerEntry.source_ref_id references Membership OR Reservation by source_kind

  role_model: peer_roles
  # FrontDesk (operator at a location), Technician (entity-backed, owns own
  # schedule), Member (entity-backed, books for self), StudioAdmin (cross-location
  # operator). FrontDesk vs Member own different operations; StudioAdmin is the
  # cross-location/config authority.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }
      - { name: name, type: string, source: input, description: "Location display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code, e.g. CA, TX" }
      - { name: open_minute_of_day, type: integer, source: input, description: "Minutes after 00:00 UTC that the studio opens, evaluated against start_utc time-of-day, e.g. 540 = 09:00Z", default: 540 }
      - { name: close_minute_of_day, type: integer, source: input, description: "Minutes after 00:00 UTC that the studio closes; the full slot (start..end) must end at or before this minute, e.g. 1200 = 20:00Z", default: 1200 }
      - { name: deposit_required_cents, type: integer, source: input, description: "Deposit charged to hold a reservation when the member has no covering membership credit", default: 1000 }
      - { name: no_show_fee_cents, type: integer, source: input, description: "Flat fee charged on a no-show with no deposit on file", default: 2500 }

  - name: ServiceType
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }
      - { name: name, type: string, source: input, description: "Menu name, e.g. Brazilian, Brow, Underarm" }
      - { name: duration_minutes, type: integer, source: input, description: "Reservation slot length in minutes, > 0" }
      - { name: buffer_minutes, type: integer, source: input, description: "Cleanup/turnover minutes appended after the slot before the room is free again", default: 5 }
      - { name: list_price_cents, type: integer, source: input, description: "Walk-in price in cents when not paid by credit" }
      - { name: credit_cost, type: integer, source: input, description: "Number of wax-pass credits this service consumes when paid by membership", default: 1 }
      - { name: intro_eligible, type: boolean, source: input, description: "True if this service can be the member's first-service-free intro", default: false }
      - { name: active, type: boolean, source: input, description: "Whether bookable; INACTIVE services reject new reservations", default: true }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }
      - { name: name, type: string, source: input, description: "Retail product name, e.g. Smooth Body Wash" }
      - { name: unit_price_cents, type: integer, source: input, description: "Retail unit price in cents" }
      - { name: member_discount_pct, type: number, source: input, description: "Fractional discount applied to active members on retail attach, e.g. 0.10 = 10%", default: 0.10 }
      - { name: stock_qty, type: integer, source: input, description: "On-hand retail inventory units, decremented on confirmed sale, >= 0", default: 100 }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; the studio this room belongs to" }
      - { name: label, type: string, source: input, description: "Room label, e.g. Room 1" }
      - { name: active, type: boolean, source: input, description: "INACTIVE rooms cannot host new reservations", default: true }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when acting as Technician" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; the studio this technician staffs" }
      - { name: full_name, type: string, source: input, description: "Technician display name" }
      - { name: certified_service_ids, type: array, source: input, description: "Array of ServiceType.id the technician is certified to perform" }
      - { name: active, type: boolean, source: input, description: "INACTIVE technicians cannot be assigned to new reservations", default: true }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when acting as Member" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }
      - { name: home_location_id, type: string, source: input, description: "FK -> Location.id; member's primary studio" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: email, type: string, source: input, description: "Unique contact email" }
      - { name: intro_used, type: boolean, source: computed, description: "True once the member has consumed the first-service-free intro on any completed reservation", default: false }
      - { name: no_show_strike_count, type: integer, source: computed, description: "Count of NoShowStrike rows with status=ACTIVE for this member; drives deposit gating", default: 0 }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Prepaid store-credit balance in cents (refunds/forfeits land here), >= 0", default: 0 }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owner of this wax-pass" }
      - { name: tier, type: enum, source: input, description: "BASIC | PLUS | UNLIMITED; constraints: tier IN {BASIC, PLUS, UNLIMITED}" }
      - { name: monthly_credit_grant, type: integer, source: input, description: "Credits granted each billing cycle for BASIC/PLUS; ignored for UNLIMITED" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring fee charged each renewal cycle" }
      - { name: max_rollover_credits, type: integer, source: input, description: "Cap on credits that survive into the next cycle; excess is forfeited", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | FROZEN | PAST_DUE | CANCELLED; constraints: status IN {PENDING, ACTIVE, FROZEN, PAST_DUE, CANCELLED}" }
      - { name: credit_balance, type: integer, source: computed, description: "Running wax-pass credit balance from CreditLedgerEntry sum, >= 0" }
      - { name: cycle_anchor_utc, type: datetime, source: system, description: "UTC timestamp of the current cycle start; renewal advances it by 30 days" }
      - { name: cycle_index, type: integer, source: system, description: "Monotonic billing-cycle counter, starts at 0, +1 on each renewal", default: 0 }
      - { name: freeze_until_utc, type: datetime, source: system, description: "UTC instant the FROZEN hold auto-expires; null unless FROZEN" }
      - { name: frozen_cycle_credits, type: integer, source: system, description: "Credits parked at freeze time, restored on unfreeze; 0 unless FROZEN", default: 0 }

  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC; append order is created_at ASC, ties broken by created_at then insertion sequence" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the wax-pass this entry mutates" }
      - { name: entry_type, type: enum, source: system, description: "GRANT | DEBIT | REFUND | ROLLOVER_FORFEIT | FREEZE_PARK | UNFREEZE_RESTORE; constraints: entry_type IN {GRANT, DEBIT, REFUND, ROLLOVER_FORFEIT, FREEZE_PARK, UNFREEZE_RESTORE}" }
      - { name: delta_credits, type: integer, source: system, description: "Signed credit change; positive grants/restores, negative debits/forfeits/parks" }
      - { name: source_kind, type: enum, source: system, description: "MEMBERSHIP | RESERVATION; which entity caused this entry; constraints: source_kind IN {MEMBERSHIP, RESERVATION}" }
      - { name: source_ref_id, type: string, source: system, description: "Polymorphic ref: Membership.id when source_kind=MEMBERSHIP, Reservation.id when source_kind=RESERVATION" }
      - { name: cycle_index, type: integer, source: system, description: "Membership.cycle_index at the time this entry was written" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC; booking order tie-break key is created_at ASC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; who the reservation is for" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; studio the reservation is at" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; assigned room" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; assigned technician" }
      - { name: service_type_id, type: string, source: input, description: "FK -> ServiceType.id; the booked service" }
      - { name: start_utc, type: datetime, source: input, description: "Reservation start instant (UTC); slot end = start + ServiceType.duration_minutes" }
      - { name: end_utc, type: datetime, source: computed, description: "start_utc + duration_minutes; room is held start..end+buffer_minutes" }
      - { name: booking_status, type: enum, source: system, description: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW; constraints: booking_status IN {BOOKED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW}" }
      - { name: settlement_status, type: enum, source: system, description: "UNSETTLED | DEPOSIT_HELD | CREDIT_HELD | PAID | REFUNDED | FORFEITED; independent payment axis; constraints: settlement_status IN {UNSETTLED, DEPOSIT_HELD, CREDIT_HELD, PAID, REFUNDED, FORFEITED}" }
      - { name: payment_method, type: enum, source: input, description: "CREDIT | DEPOSIT | INTRO_FREE | WALK_IN; how the booking is to be paid; constraints: payment_method IN {CREDIT, DEPOSIT, INTRO_FREE, WALK_IN}" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; required when payment_method=CREDIT, else null" }
      - { name: credits_held, type: integer, source: computed, description: "Credits debited from membership to hold this reservation; 0 unless payment_method=CREDIT" }
      - { name: deposit_held_cents, type: integer, source: computed, description: "Deposit captured to hold this reservation; 0 unless payment_method=DEPOSIT" }
      - { name: charged_amount_cents, type: integer, source: computed, description: "Final amount billed at completion (service price net of intro/credit), >= 0" }

  - name: RetailSale
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; buyer" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the visit this retail purchase is attached to (the attach context); required" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product sold" }
      - { name: quantity, type: integer, source: input, description: "Units purchased, > 0" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | VOIDED; constraints: status IN {PENDING, CONFIRMED, VOIDED}" }
      - { name: gross_cents, type: integer, source: computed, description: "unit_price_cents * quantity before discount" }
      - { name: discount_cents, type: integer, source: computed, description: "Member discount applied (0 if buyer has no ACTIVE membership)" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - discount_cents, >= 0" }

  - name: NoShowStrike
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC; strikes expire 90 days after created_at" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the offending member" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the no-show/late-cancel that minted the strike" }
      - { name: strike_kind, type: enum, source: system, description: "NO_SHOW | LATE_CANCEL; constraints: strike_kind IN {NO_SHOW, LATE_CANCEL}" }
      - { name: fee_charged_cents, type: integer, source: system, description: "Fee captured at strike time (deposit forfeited or no_show_fee_cents), >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | WAIVED; constraints: status IN {ACTIVE, EXPIRED, WAIVED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Membership lifecycle: branching + cyclic (ACTIVE<->FROZEN, PAST_DUE branch)
  - entity: Membership
    state_field: status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /studio/memberships/{id}/activate"
        actor: FrontDesk
        preconditions:
          - "Membership.status == PENDING"
        side_effects:
          - "Set cycle_anchor_utc = current clock time; cycle_index stays 0"
          - "Write CreditLedgerEntry GRANT delta_credits = (UNLIMITED ? 0 : monthly_credit_grant), source_kind=MEMBERSHIP, source_ref_id=Membership.id, cycle_index=0"
          - "Recompute Membership.credit_balance (calc membership_credit_balance)"
          - "increments Membership.version by 1"

      - from: ACTIVE
        to: FROZEN
        trigger: "POST /studio/memberships/{id}/freeze"
        actor: Member
        preconditions:
          - "Membership.status == ACTIVE"
          - "freeze_days in [1,90]"
        side_effects:
          - "Set freeze_until_utc = current clock time + freeze_days days"
          - "Set frozen_cycle_credits = current credit_balance"
          - "Write CreditLedgerEntry FREEZE_PARK delta_credits = -credit_balance, source_kind=MEMBERSHIP, source_ref_id=Membership.id"
          - "Recompute credit_balance (now 0 while FROZEN)"
          - "increments Membership.version by 1"
        note: "Cyclic: FROZEN can return to ACTIVE."

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /studio/memberships/{id}/unfreeze, or system on freeze_until_utc reached during clock advance"
        actor: "Member or system"
        preconditions:
          - "Membership.status == FROZEN"
        side_effects:
          - "Clear freeze_until_utc"
          - "Write CreditLedgerEntry UNFREEZE_RESTORE delta_credits = +frozen_cycle_credits, source_kind=MEMBERSHIP, source_ref_id=Membership.id"
          - "Set frozen_cycle_credits = 0"
          - "Recompute credit_balance"
          - "increments Membership.version by 1"

      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /studio/memberships/{id}/renew with payment_outcome=FAILED, or system renewal at cycle_anchor_utc+30d with FAILED outcome"
        actor: "FrontDesk or system"
        preconditions:
          - "Membership.status == ACTIVE"
        side_effects:
          - "No GRANT entry written; credit_balance unchanged"
          - "increments Membership.version by 1"
        note: "Branch: failed renewal diverges to PAST_DUE rather than continuing ACTIVE."

      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /studio/memberships/{id}/renew with payment_outcome=SUCCEEDED"
        actor: FrontDesk
        preconditions:
          - "Membership.status == PAST_DUE"
        side_effects:
          - "cascade: cycle renewal runs calc cycle_rollover_settlement then writes ROLLOVER_FORFEIT (if any) then GRANT for the new cycle"
          - "Advance cycle_anchor_utc by 30 days; cycle_index += 1"
          - "Recompute credit_balance"
          - "increments Membership.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /studio/memberships/{id}/renew with payment_outcome=SUCCEEDED (on-cycle renewal)"
        actor: "FrontDesk or system"
        preconditions:
          - "Membership.status == ACTIVE"
        side_effects:
          - "cascade: calc cycle_rollover_settlement computes surviving credits; write ROLLOVER_FORFEIT delta_credits = -(carryover_before_cap - capped_carryover) when forfeit > 0; then write GRANT delta_credits = monthly_credit_grant (0 for UNLIMITED)"
          - "Advance cycle_anchor_utc by 30 days; cycle_index += 1"
          - "Recompute credit_balance"
          - "increments Membership.version by 1"
        note: "Cyclic self-loop: each successful renewal re-grants and applies rollover cap."

      - from: [PENDING, ACTIVE, FROZEN, PAST_DUE]
        to: CANCELLED
        trigger: "POST /studio/memberships/{id}/cancel"
        actor: "Member or FrontDesk"
        preconditions:
          - "Membership.status != CANCELLED"
        side_effects:
          - "cascade: each BOOKED/CHECKED_IN Reservation with payment_method=CREDIT on this membership -> CANCELLED (releases held credits via REFUND ledger entry); each released credit's REFUND in turn re-credits credit_balance which is then converted: remaining credit_balance forfeited to Member.wallet_credit_cents at 100 cents/credit"
          - "Recompute credit_balance to 0"
          - "increments Membership.version by 1"

  # --- Reservation booking axis: parallel dimension #1 (branching + revert)
  - entity: Reservation
    state_field: booking_status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /studio/reservations/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "Reservation.booking_status == BOOKED"
          - "current clock time >= start_utc - 30 minutes (cannot check in earlier than 30m before start)"
        side_effects:
          - "increments Reservation.version by 1"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /studio/reservations/{id}/complete"
        actor: "FrontDesk or Technician"
        preconditions:
          - "Reservation.booking_status == CHECKED_IN"
        side_effects:
          - "cascade: settlement axis advances to PAID (calc reservation_charge); if payment_method=CREDIT the held credits are consumed (no refund); if payment_method=INTRO_FREE set Member.intro_used=true; charged_amount_cents finalized"
          - "Set Member.intro_used=true when payment_method=INTRO_FREE (cross-entity)"
          - "increments Reservation.version by 1"

      - from: [BOOKED, CHECKED_IN]
        to: CANCELLED
        trigger: "POST /studio/reservations/{id}/cancel"
        actor: "Member or FrontDesk"
        preconditions:
          - "Reservation.booking_status IN {BOOKED, CHECKED_IN}"
        side_effects:
          - "cascade: if cancel is >= 24h before start_utc (timely): settlement axis -> REFUNDED; CREDIT bookings write REFUND ledger entry restoring credits_held; DEPOSIT bookings refund deposit_held_cents to Member.wallet_credit_cents"
          - "cascade: if cancel is < 24h before start_utc (late): mint NoShowStrike(strike_kind=LATE_CANCEL); settlement axis -> FORFEITED; DEPOSIT deposit_held_cents forfeited (not refunded); CREDIT credits_held forfeited (no REFUND entry); that strike increments Member.no_show_strike_count which (when it reaches threshold) flips future deposit gating"
          - "Any PENDING RetailSale attached to this reservation -> VOIDED (restock product)"
          - "increments Reservation.version by 1"
        note: "Branching: timely vs late cancel produce divergent side-effect sets."

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /studio/reservations/{id}/mark-no-show, or system sweep when current clock time >= start_utc + 15 minutes and still BOOKED"
        actor: "FrontDesk or system"
        preconditions:
          - "Reservation.booking_status == BOOKED"
          - "current clock time >= start_utc + 15 minutes"
        side_effects:
          - "cascade: mint NoShowStrike(strike_kind=NO_SHOW); settlement axis -> FORFEITED; DEPOSIT deposit forfeited, CREDIT credits forfeited (no REFUND); the new strike increments Member.no_show_strike_count; when count crosses 2 the member becomes deposit-required for future CREDIT bookings"
          - "Any PENDING RetailSale attached -> VOIDED (restock)"
          - "increments Reservation.version by 1"

  # --- Reservation settlement axis: parallel dimension #2 (independent of booking)
  - entity: Reservation
    state_field: settlement_status
    initial_state: UNSETTLED
    terminal_states: [PAID, REFUNDED, FORFEITED]
    transitions:
      - from: UNSETTLED
        to: CREDIT_HELD
        trigger: "system on POST /studio/reservations (payment_method=CREDIT)"
        actor: system
        preconditions:
          - "payment_method == CREDIT"
          - "Membership.status == ACTIVE"
        side_effects:
          - "Write CreditLedgerEntry DEBIT delta_credits = -ServiceType.credit_cost, source_kind=RESERVATION, source_ref_id=Reservation.id"
          - "Set credits_held = ServiceType.credit_cost"

      - from: UNSETTLED
        to: DEPOSIT_HELD
        trigger: "system on POST /studio/reservations (payment_method=DEPOSIT)"
        actor: system
        preconditions:
          - "payment_method == DEPOSIT"
        side_effects:
          - "Set deposit_held_cents = Location.deposit_required_cents"

      - from: [CREDIT_HELD, DEPOSIT_HELD, UNSETTLED]
        to: PAID
        trigger: "system on reservation complete"
        actor: system
        preconditions:
          - "Reservation.booking_status transitioning to COMPLETED"
        side_effects:
          - "Finalize charged_amount_cents via calc reservation_charge"

      - from: [CREDIT_HELD, DEPOSIT_HELD]
        to: REFUNDED
        trigger: "system on timely cancel (>= 24h before start_utc)"
        actor: system
        preconditions:
          - "Reservation.booking_status transitioning to CANCELLED"
          - "current clock time <= start_utc - 24 hours"
        side_effects:
          - "CREDIT: write REFUND delta_credits = +credits_held; DEPOSIT: deposit_held_cents -> Member.wallet_credit_cents"

      - from: [CREDIT_HELD, DEPOSIT_HELD]
        to: FORFEITED
        trigger: "system on late cancel (< 24h) or no-show"
        actor: system
        preconditions:
          - "Reservation.booking_status transitioning to CANCELLED (late) or NO_SHOW"
        side_effects:
          - "CREDIT credits_held forfeited (no REFUND entry); DEPOSIT deposit forfeited; fee recorded on NoShowStrike"

  # --- RetailSale: linear with void-revert
  - entity: RetailSale
    state_field: status
    initial_state: PENDING
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /studio/retail-sales/{id}/confirm"
        actor: FrontDesk
        preconditions:
          - "RetailSale.status == PENDING"
          - "Reservation.booking_status == COMPLETED (cross-entity: retail can only finalize after the visit completes)"
          - "Product.stock_qty >= quantity"
        side_effects:
          - "Decrement Product.stock_qty by quantity (cross-entity)"
          - "Finalize gross_cents, discount_cents, net_cents via calc retail_net"
          - "increments RetailSale.version by 1"

      - from: PENDING
        to: VOIDED
        trigger: "POST /studio/retail-sales/{id}/void, or system on reservation cancel/no-show"
        actor: "FrontDesk or system"
        preconditions:
          - "RetailSale.status == PENDING"
        side_effects:
          - "No stock change (stock not yet decremented while PENDING)"
          - "increments RetailSale.version by 1"

  # --- NoShowStrike: append-only with expiry/waive
  - entity: NoShowStrike
    state_field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, WAIVED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system on clock advance past created_at + 90 days"
        actor: system
        preconditions:
          - "current clock time >= created_at + 90 days"
        side_effects:
          - "Recompute Member.no_show_strike_count (cross-entity; may re-open credit booking without deposit)"

      - from: ACTIVE
        to: WAIVED
        trigger: "POST /studio/no-show-strikes/{id}/waive"
        actor: StudioAdmin
        preconditions:
          - "NoShowStrike.status == ACTIVE"
        side_effects:
          - "Refund fee_charged_cents to Member.wallet_credit_cents"
          - "Recompute Member.no_show_strike_count (cross-entity)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — see §1.2.1 filter)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-room
    parent_entity: Room
    write_endpoint: "POST /studio/reservations"
    occ_field: "expected_room_version"
    description: |
      Creating a Reservation against a Room whose version has advanced since the
      client last observed it is rejected with a stale-version error. Booking a
      slot mutates the room (its updated_at/version bump as part of holding the
      slot), so a second create that legitimately fills a different non-overlapping
      slot but still carries the old room version is rejected on the stale check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: membership-credit-debit-stale
    parent_entity: Membership
    write_endpoint: "POST /studio/reservations"
    occ_field: "expected_membership_version"
    description: |
      A CREDIT reservation debits the membership; the membership version advances
      on each successful debit. A create that carries a membership version older
      than the membership's current version is rejected, capturing the case where
      a prior debit (which legitimately drew down credits) has already advanced the
      membership the current writer still believes is at the older version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- Rule 1 dual-variant #A: reservation charge (forward-looking hold-quote
  #      vs chronological completion-charge), on Reservation domain
  - name: reservation_charge
    trigger: "reservation create (provisional quote) and reservation complete (final charge)"
    algorithm: forward_looking
    formula: |
      provisional_quote (at booking, payment_method-dependent):
        if INTRO_FREE: 0
        if CREDIT:     0 cents (paid by credits; credits_held = ServiceType.credit_cost)
        if DEPOSIT:    Location.deposit_required_cents (held, not yet the service price)
        if WALK_IN:    ServiceType.list_price_cents
      final_charge (at completion, chronological — uses state AT completion time):
        base = ServiceType.list_price_cents
        if INTRO_FREE: charged_amount_cents = 0  (and Member.intro_used set true)
        if CREDIT:     charged_amount_cents = 0  (credits already consumed)
        if DEPOSIT:    charged_amount_cents = max(0, base - deposit_held_cents)  (deposit applied to service)
        if WALK_IN:    charged_amount_cents = base
    input_set: "Single reservation; final variant reads ServiceType.list_price_cents and deposit_held_cents as of completion."
    constants: {}
    precision: "integer cents, no rounding (all cents)"
    variants:
      - name: provisional_quote
        when: "at POST /studio/reservations (hold time)"
        difference: "DEPOSIT shows the deposit amount, not the net service price; CREDIT shows 0 with credits_held set"
      - name: final_charge
        when: "at reservation complete"
        difference: "DEPOSIT subtracts the already-held deposit from list price (deposit applied), so the final charged amount differs from the provisional quote"

  # ---- Rule 1 dual-variant #B: membership credit valuation at cancel
  #      (par-value forfeit vs pro-rated refund), on Membership domain
  - name: membership_cancel_valuation
    trigger: "POST /studio/memberships/{id}/cancel"
    algorithm: chronological
    formula: |
      At cancel, two interpretations of the leftover credit_balance:
      variant par_value_forfeit (the pinned production rule):
        wallet_gain_cents = credit_balance * CREDIT_PAR_CENTS
        (every surviving credit converts to wallet store-credit at par)
      variant prorated_refund (alternative interpretation, divergent):
        days_elapsed = floor((now - cycle_anchor_utc) / 1 day)
        unused_fraction = max(0, (30 - days_elapsed) / 30)
        wallet_gain_cents = round_half_up(monthly_fee_cents * unused_fraction)
      The system applies par_value_forfeit. The two produce different wallet
      gains for the same membership state, so an implementer who reads "refund
      the unused value" as proration computes a different number.
    input_set: "Single membership at cancel; credit_balance and cycle timing."
    constants:
      CREDIT_PAR_CENTS: 100
    precision: "integer cents, round_half_up where division occurs"
    variants:
      - name: par_value_forfeit
        when: "production cancel path"
        difference: "values surviving credits at 100 cents each regardless of cycle timing"
      - name: prorated_refund
        when: "alternative (NOT used) — refund unused monthly fee by elapsed days"
        difference: "values the refund by elapsed cycle days, ignoring credit count"

  # ---- Rule 2 combinatorial #A (mode a): nested min/max + conditional branch
  - name: bookable_credit_check
    trigger: "POST /studio/reservations with payment_method=CREDIT"
    algorithm: threshold
    formula: |
      need = ServiceType.credit_cost
      effective_balance =
        (Membership.tier == UNLIMITED) ? INF
        : Membership.credit_balance
      Booking allowed iff effective_balance >= need.
      deposit_gate (combinatorial, >=3 inputs with non-linear interaction):
        require_deposit =
          (Member.no_show_strike_count >= NO_SHOW_DEPOSIT_THRESHOLD)
          AND (payment_method == CREDIT)
          AND (Membership.tier != UNLIMITED)
        If require_deposit, the CREDIT booking is rejected unless the request
        also includes a deposit (payment_method must instead be DEPOSIT) ->
        ERR_DEPOSIT_REQUIRED.
    input_set: "Membership.tier, Membership.credit_balance, Member.no_show_strike_count, payment_method, ServiceType.credit_cost"
    constants:
      NO_SHOW_DEPOSIT_THRESHOLD: 2
    precision: "integer credits"

  # ---- Rule 2 combinatorial #B (mode b): nested rounding order pinned
  - name: retail_net
    trigger: "RetailSale confirm"
    algorithm: tiered_pricing
    formula: |
      Rounding order is PINNED as round-per-unit-then-sum (NOT sum-then-round):
        per_unit_discount_cents = round_half_up(Product.unit_price_cents * member_discount_pct)
        discount_cents = per_unit_discount_cents * quantity         # multiply AFTER per-unit rounding
        gross_cents = Product.unit_price_cents * quantity
        net_cents = gross_cents - discount_cents
      Member discount applies only if the buyer has a Membership with status==ACTIVE
      at confirm time; otherwise member_discount_pct is treated as 0.
      Example: unit_price_cents=1299, pct=0.10, quantity=3:
        per_unit = round_half_up(129.9) = 130; discount = 130*3 = 390  (vs sum-then-round
        path round(1299*3*0.10)=round(389.7)=390 here equal, but for pct=0.10 unit=1295:
        per_unit=round(129.5)=130, *3=390 vs round(1295*3*0.10)=round(388.5)=389 -> differ).
    input_set: "Single RetailSale + its Product + buyer's ACTIVE membership presence"
    constants: {}
    precision: "integer cents, round_half_up; per-unit rounding precedes multiplication by quantity"

  # ---- Rule 2 combinatorial #C (mode c): ordered evaluation of circular-looking dep
  - name: cycle_rollover_settlement
    trigger: "Membership renew (ACTIVE->ACTIVE on-cycle, PAST_DUE->ACTIVE recovery)"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is PINNED (the carryover depends on pre-grant balance, and
      the grant depends on the capped carryover, so order must be fixed):
        step 1 pre_renew_balance = current credit_balance (BEFORE this renewal's grant)
        step 2 capped_carryover = min(pre_renew_balance, Membership.max_rollover_credits)
        step 3 forfeit = pre_renew_balance - capped_carryover     # >= 0
                if forfeit > 0: write ROLLOVER_FORFEIT delta = -forfeit
        step 4 grant = (tier == UNLIMITED) ? 0 : Membership.monthly_credit_grant
                write GRANT delta = +grant
        step 5 new_balance = capped_carryover + grant
      UNLIMITED tier never accumulates a numeric balance (effective_balance is INF
      for bookability) so capped_carryover and grant are both 0.
    input_set: "Single membership at renewal; pre-renewal credit_balance and max_rollover_credits."
    constants: {}
    precision: "integer credits"

  # ---- credit balance aggregation (ledger projection)
  - name: membership_credit_balance
    trigger: "any CreditLedgerEntry write (activate, debit, refund, grant, forfeit, freeze park/restore)"
    algorithm: projection
    formula: |
      credit_balance = sum(delta_credits for all CreditLedgerEntry where
                           membership_id == Membership.id)
      Processing order is created_at ASC (ties broken by created_at then write
      sequence; never by id). Balance MUST NOT go below 0 — a DEBIT that would
      drive it negative is rejected upstream by bookable_credit_check, never
      clamped here.
    input_set: "All CreditLedgerEntry rows for the membership (every entry_type)."
    constants: {}
    precision: "integer credits"

  # ---- active strike aggregation (drives deposit gating)
  - name: active_strike_count
    trigger: "strike mint, strike expire, strike waive, clock advance"
    algorithm: aggregation
    formula: |
      no_show_strike_count = count(NoShowStrike where member_id == Member.id
                                   AND status == ACTIVE
                                   AND created_at + 90 days > current clock time)
      A strike at exactly created_at + 90 days is EXPIRED (boundary: >, not >=,
      i.e. strictly within 90 days counts as ACTIVE).
    input_set: "All NoShowStrike rows for the member with status filter ACTIVE."
    constants:
      STRIKE_TTL_DAYS: 90
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; entity-backed roles acting on a resource they do not own are denied"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right): Location, Room, Technician, ServiceType, Member, Membership, Product, Reservation"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enum values valid, integers in range (duration_minutes>0, quantity>0, freeze_days in [1,90])"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"

  - priority: 5
    category: state
    check: "Target resource in a valid state for the requested transition (booking_status, settlement_status, Membership.status, RetailSale.status, NoShowStrike.status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes (reservation create vs Room and Membership)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /studio/reservations"

  - priority: 7
    category: business_referential
    check: "Cross-entity coherence: Room.location_id == Reservation.location_id; Technician.location_id == Reservation.location_id; Technician certified for ServiceType; ServiceType.active; Room.active; Technician.active; membership_id present iff payment_method=CREDIT and Membership.member_id == Reservation.member_id"
    error_id: ERR_RESOURCE_MISMATCH
    http_status: 409
    applies_to: "POST /studio/reservations"

  - priority: 8
    category: business_referential
    check: "Membership must be ACTIVE for a CREDIT booking (FROZEN/PAST_DUE/PENDING/CANCELLED reject)"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /studio/reservations (payment_method=CREDIT)"

  - priority: 9
    category: business_temporal
    check: "Reservation slot lies within Location open/close window (start time-of-day >= open_minute_of_day AND slot end time-of-day <= close_minute_of_day, evaluated in UTC) and start_utc is not in the past relative to the clock"
    error_id: ERR_OUTSIDE_HOURS
    http_status: 409
    applies_to: "POST /studio/reservations"

  - priority: 10
    category: business_safety
    check: "First-service-free: payment_method=INTRO_FREE only when Member.intro_used==false AND ServiceType.intro_eligible==true"
    error_id: ERR_INTRO_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /studio/reservations (payment_method=INTRO_FREE)"

  - priority: 11
    category: business_safety
    check: "Deposit gating: when Member.no_show_strike_count >= 2 and tier != UNLIMITED, a CREDIT booking is rejected; member must book with payment_method=DEPOSIT"
    error_id: ERR_DEPOSIT_REQUIRED
    http_status: 409
    applies_to: "POST /studio/reservations (payment_method=CREDIT)"

  - priority: 12
    category: business_temporal
    check: "Technician time-overlap: requested [start, start+duration] must not overlap another non-terminal reservation for the same technician (closed-open intervals, NO buffer)"
    error_id: ERR_TECH_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /studio/reservations"

  - priority: 13
    category: business_temporal
    check: "Room time-overlap: requested [start, start+duration+buffer_minutes] must not overlap another non-terminal reservation's buffered window for the same room (buffer-inclusive intervals)"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /studio/reservations"

  - priority: 14
    category: business_fiscal
    check: "CREDIT booking: membership effective credit balance >= ServiceType.credit_cost (UNLIMITED always passes)"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 409
    applies_to: "POST /studio/reservations (payment_method=CREDIT)"

  - priority: 15
    category: business_temporal
    check: "Check-in cannot occur earlier than 30 minutes before start_utc"
    error_id: ERR_CHECKIN_TOO_EARLY
    http_status: 409
    applies_to: "POST /studio/reservations/{id}/check-in"

  - priority: 16
    category: business_fiscal
    check: "RetailSale confirm: Product.stock_qty >= quantity"
    error_id: ERR_OUT_OF_STOCK
    http_status: 409
    applies_to: "POST /studio/retail-sales/{id}/confirm"

  - priority: 17
    category: business_constraint
    check: "Member.email is unique across all members"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /studio/members"

  - priority: 18
    category: business_constraint
    check: "Pagination params in range: limit 1..100, offset >= 0"
    error_id: ERR_VALIDATION_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Locations (config) ----
  - method: POST
    path: "/studio/locations"
    description: "Create a location/studio."
    roles: [StudioAdmin]
    code: 201
    input: [name, state_code, "open_minute_of_day?", "close_minute_of_day?", "deposit_required_cents?", "no_show_fee_cents?"]
    output: Location
    side_effects: ["version=1"]

  - method: GET
    path: "/studio/locations/{id}"
    description: "Get a location."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: []
    output: Location
    side_effects: []

  - method: GET
    path: "/studio/locations"
    description: "List locations (paginated)."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Location[]
    side_effects: []

  # ---- ServiceTypes (config) ----
  - method: POST
    path: "/studio/service-types"
    description: "Create a service menu item."
    roles: [StudioAdmin]
    code: 201
    input: [name, duration_minutes, list_price_cents, "buffer_minutes?", "credit_cost?", "intro_eligible?", "active?"]
    output: ServiceType
    side_effects: ["version=1"]

  - method: GET
    path: "/studio/service-types/{id}"
    description: "Get a service type."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: []
    output: ServiceType
    side_effects: []

  - method: GET
    path: "/studio/service-types"
    description: "List service types (paginated)."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: ServiceType[]
    side_effects: []

  - method: PATCH
    path: "/studio/service-types/{id}"
    description: "Update a service type (price, active flag, etc.)."
    roles: [StudioAdmin]
    code: 200
    input: ["expected_servicetype_version", "list_price_cents?", "duration_minutes?", "buffer_minutes?", "credit_cost?", "intro_eligible?", "active?"]
    output: ServiceType
    side_effects: ["increments ServiceType.version by 1"]

  # ---- Products (config + retail) ----
  - method: POST
    path: "/studio/products"
    description: "Create a retail product."
    roles: [StudioAdmin]
    code: 201
    input: [name, unit_price_cents, "member_discount_pct?", "stock_qty?"]
    output: Product
    side_effects: ["version=1"]

  - method: GET
    path: "/studio/products/{id}"
    description: "Get a product."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/studio/products"
    description: "List products (paginated)."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Product[]
    side_effects: []

  # ---- Rooms ----
  - method: POST
    path: "/studio/rooms"
    description: "Create a room at a location."
    roles: [StudioAdmin]
    code: 201
    input: [location_id, label, "active?"]
    output: Room
    side_effects: ["version=1"]

  - method: GET
    path: "/studio/rooms/{id}"
    description: "Get a room."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: GET
    path: "/studio/rooms"
    description: "List rooms; filter by location_id (FK reverse-reachability for Room.location_id)."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: ["location_id?", "active?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  # ---- Technicians ----
  - method: POST
    path: "/studio/technicians"
    description: "Create a technician at a location."
    roles: [StudioAdmin]
    code: 201
    input: [location_id, full_name, "certified_service_ids?", "active?"]
    output: Technician
    side_effects: ["version=1"]

  - method: GET
    path: "/studio/technicians/{id}"
    description: "Get a technician."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: GET
    path: "/studio/technicians"
    description: "List technicians; filter by location_id (FK reverse-reachability for Technician.location_id)."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: ["location_id?", "active?", "limit?", "offset?"]
