          - entities.Participant.fields.license_suspension_active
          - entities.Participant.fields.has_valid_drivers_license
          - entities.SupportCase.fields.interest_written_off_cents
          - entities.SupportCase.fields.interest_receivable_cents
          - entities.CompromiseOffer.fields.next_installment_due_date
