  - section: consistency model
    instances:
      - name: an_approval_is_visible_to_every_read_path_on_the_next_call
        claim_type: immediate
        grounds:
          - state_machines.AidApplication.SUBMITTED_to_PARTIALLY_APPROVED
          - calculations.aid_award_allocation
          - calculations.funder_outcome_rollup
          - endpoints.GET /nature-center/scholarship-funds/{id}/outcome-report
        distinguishing_aspect: |
          The approval's consequences are read through four independent paths immediately after
          the single write — the application row, the booking's funding dimension, the fund's
          counters and the funder projection — with no intervening call that could act as a
          reconciliation step. Every number is asserted at its post-write value, so any deferred
          or batched recomputation surfaces as a stale read here.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "OPEN fund of 5,000,000 cents with a 0.25 transport sublimit"
