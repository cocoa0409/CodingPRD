          assert:
            - "BondIssue.${bond_id}.par_amount_cents == 200000000"
            - "BondIssue.${bond_id}.issuance_allowance_cents == 3920000"
            - "Project.${proj_id}.aggregate_basis_cents == 400000000"
            - "Project.${proj_id}.provisional_fifty_percent_ratio_bps == 5000"
            - "CostCertification.${cc_id}.certified_aggregate_basis_cents == 410000000"
            - "CostCertification.${cc_id}.status == ACCEPTED"
            - "Project.${proj_id}.final_fifty_percent_ratio_bps == 4878"
            - "Project.${proj_id}.final_fifty_percent_ratio_bps != Project.${proj_id}.provisional_fifty_percent_ratio_bps"
            - "Project.${proj_id}.automatic_credit_triggered == false"

      - name: dscr_variant_t3_clears_conversion_while_t12_on_the_same_months_is_refused
        grounds:
          - calculations.debt_service_coverage_ratio
          - entities.BondIssue.fields.operating_months
          - entities.BondIssue.fields.dscr_bps
          - entities.BondIssue.fields.dscr_basis
          - state_machines.BondIssue.ISSUED_to_CONVERTED
          - validations[priority=115]
          - errors[ERR_DSCR_BELOW_MINIMUM]
        distinguishing_aspect: |
          Over one identical twelve-month operating series (nine months at
          15,000,000 NOI against 15,000,000 debt service, then three months at
          18,000,000 NOI), the T3 variant reads only the last three months and
          annualizes by 4 to give exactly 12000 bps, while the T12 variant reads
          all twelve months with factor 1 and gives 10500 bps - below the 11500
          bps minimum - so the same conversion request succeeds under T3 and is
          refused with ERR_DSCR_BELOW_MINIMUM under T12.
