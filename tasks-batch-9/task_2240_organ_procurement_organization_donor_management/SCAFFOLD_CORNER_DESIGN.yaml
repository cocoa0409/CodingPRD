        grounds:
          - validations[priority 25]
          - errors.ERR_HOSPITAL_SCOPE_VIOLATION
          - roles.HospitalReferralClerk.identity
        distinguishing_aspect: |
          The clerk's identity is entity_backed:HospitalPartner, so the same declared role is admitted
          or refused purely on whether X-User-ID equals the hospital in the request: clerk of hospital A
          cannot refer for hospital B nor read hospital B, while its own hospital works on both verbs.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-09T08:00:00Z."
            - "Two hospital partners, MERCY and SECOND."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T08:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_a: $.data.id }
            - call: "POST /opo/hospital-partners"
              payload: { name: "Second General", hospital_code: "SECOND", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_b: $.data.id }
          trigger:
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_b}", patient_mrn: "MRN-8001", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-09T07:30:00Z" }
              as: HospitalReferralClerk
              as_user_id: "${hosp_a}"
              captures: { error_write: $.data.error_id }
            - call: "GET /opo/hospital-partners/${hosp_b}"
              payload: {}
              as: HospitalReferralClerk
              as_user_id: "${hosp_a}"
              captures: { error_read: $.data.error_id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_a}", patient_mrn: "MRN-8002", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-09T07:30:00Z" }
              as: HospitalReferralClerk
              as_user_id: "${hosp_a}"
              captures: { ok_ref: $.data.id, ok_hosp: $.data.hospital_partner_id, ok_flag: $.data.timeliness_flag }
            - call: "GET /opo/hospital-partners/${hosp_a}"
              payload: {}
              as: HospitalReferralClerk
              as_user_id: "${hosp_a}"
              captures: { own_code: $.data.hospital_code, own_count: $.data.referral_count }
          assert:
            - "${error_write} == ERR_HOSPITAL_SCOPE_VIOLATION with HTTP 403 and HospitalPartner.${hosp_b}.referral_count == 0"
            - "${error_read} == ERR_HOSPITAL_SCOPE_VIOLATION with HTTP 403, not ERR_FORBIDDEN_ROLE: the role is listed on that endpoint"
            - "${ok_hosp} == ${hosp_a} with ${ok_flag} == TIMELY (30-minute lag inside the 60-minute window)"
            - "${own_code} == MERCY with ${own_count} == 1"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_screening_version_blocks_a_resubmitted_risk_assessment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[risk-assessment-stale-screening]
          - validations[priority 55]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: |
          Resubmitting an assessment is legal from PENDING, so nothing but the version guard can reject
          the second call: replaying the version captured before the first submission returns 412, and
          the freshly read version succeeds, with EligibilityScreening.version stepping 1 -> 2 -> 3.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-09T08:00:00Z."
            - "A PENDING screening at version 1, with one assessment already submitted at that version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T08:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8101", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-09T07:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v1: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["TATTOO_UNREGULATED_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v1}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
              captures: { score_1: $.data.risk_score, v_after_first: $.data.version }
          trigger:
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["IV_DRUG_USE_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v1}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
              captures: { error_stale: $.data.error_id }
            - call: "GET /opo/eligibility-screenings/${scr_id}"
              payload: {}
              as: ReferralCoordinator
              captures: { score_after_error: $.data.risk_score, v_after_error: $.data.version, status_after_error: $.data.status }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["IV_DRUG_USE_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${v_after_error}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
              captures: { score_2: $.data.risk_score, v_after_second: $.data.version }
          assert:
            - "${scr_v1} == 1, ${score_1} == 1.50 and ${v_after_first} == 2"
            - "${error_stale} == ERR_STALE_VERSION with HTTP 412"
            - "${score_after_error} == 1.50, ${v_after_error} == 2 and ${status_after_error} == PENDING: the rejected write changed nothing, not even the version"
            - "the retry with the fresh version returns HTTP 200 with ${score_2} == 6.50 and ${v_after_second} == 3"

      - name: stale_organ_version_blocks_a_superseding_match_run
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[match-run-create-stale-organ]
          - validations[priority 55]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: |
          A second run on the same organ is a legitimate supersede, so the state gate at 48 accepts
          OFFERING: only the version guard distinguishes the replayed pre-run version (412) from the
          re-read version (201 with run_number 2), proving version is bumped by run creation itself.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-09T09:00:00Z."
            - "An OFFERING KIDNEY_RIGHT whose first run was created against the version captured while it was ALLOCATABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T09:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8201", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-09T08:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: [], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /opo/death-referrals/${ref_id}/authorizations"
              payload: { registry_hit: true, registry_document_ref: "REG-8201" }
              as: AuthorizationSpecialist
              as_user_id: "auth-1"
              captures: { auth_id: $.data.id }
            - call: "POST /opo/authorizations/${auth_id}/finalize"
              payload: {}
              as: AuthorizationSpecialist
              as_user_id: "auth-2"
            - call: "POST /opo/donor-cases"
              payload: { referral_id: "${ref_id}", authorization_id: "${auth_id}", donor_code: "D-8201" }
              as: DonorCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /opo/donor-cases/${case_id}/organs"
              payload: { organ_type: "KIDNEY_RIGHT" }
              as: DonorCoordinator
              captures: { organ_id: $.data.id }
            - call: "POST /opo/organs/${organ_id}/evaluation"
              payload: { decision: "ALLOCATABLE" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /opo/organs/${organ_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { organ_v_pre: $.data.version }
            - call: "POST /opo/organs/${organ_id}/match-runs"
              payload: { expected_organ_version: "${organ_v_pre}", primary_offer_slots: 1, candidates: [ { sequence_position: 1, center_code: "CTR-A", candidate_code: "CAND-A", acceptance_clock_minutes: 240 } ] }
              as: AllocationSpecialist
              captures: { run_1: $.data.id, run_1_number: $.data.run_number }
          trigger:
            - call: "POST /opo/organs/${organ_id}/match-runs"
              payload: { expected_organ_version: "${organ_v_pre}", primary_offer_slots: 1, candidates: [ { sequence_position: 1, center_code: "CTR-B", candidate_code: "CAND-B", acceptance_clock_minutes: 240 } ] }
              as: AllocationSpecialist
              captures: { error_stale: $.data.error_id }
            - call: "GET /opo/organs/${organ_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { organ_status: $.data.status, organ_v_now: $.data.version }
            - call: "GET /opo/match-runs/${run_1}"
              payload: {}
              as: AllocationSpecialist
              captures: { run_1_status_mid: $.data.status }
            - call: "POST /opo/organs/${organ_id}/match-runs"
              payload: { expected_organ_version: "${organ_v_now}", primary_offer_slots: 1, candidates: [ { sequence_position: 1, center_code: "CTR-B", candidate_code: "CAND-B", acceptance_clock_minutes: 240 } ] }
              as: AllocationSpecialist
              captures: { run_2: $.data.id, run_2_number: $.data.run_number }
          assert:
            - "${run_1_number} == 1 and ${organ_v_now} > ${organ_v_pre}: creating the first run bumped Organ.version"
            - "${error_stale} == ERR_STALE_VERSION with HTTP 412"
            - "${organ_status} == OFFERING and ${run_1_status_mid} == OPEN: the rejected call neither superseded the run nor moved the organ"
            - "the retry with the re-read version returns HTTP 201 with ${run_2_number} == 2 and MatchRun.${run_1}.status == SUPERSEDED"

      - name: five_hop_cascade_from_a_single_write
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.Authorization.transitions[AUTHORIZED_to_RESCINDED]
        excluded_because:
          difficulty_instance: transitive_cascade / authorization_rescission_cascade_depth_five
          rationale: |
            The §1.8 instance already drives the deepest chain in the scaffold from one OBJECTION call -
            authorization, donor case, organs, match runs and offers, then the scheduled recovery
            operation and its team ledger - asserting every hop and the ordering between them.

      - name: two_variants_of_the_same_risk_input
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.behavioral_risk_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / behavioral_risk_interview_versus_records_only_variant
          rationale: |
            The §1.8 instance already runs the identical factor set through both the INTERVIEW_BASED and
            RECORDS_ONLY variants, pinning the divergent scores, the imputation fraction and the tier
            flip that the delta causes.

      - name: rate_thresholds_at_their_declared_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.hospital_timeliness_posture.constants
        excluded_because:
          difficulty_instance: dual_variant_calc / hospital_lifetime_rate_versus_windowed_recert_denominator
          rationale: |
            The §1.8 instance already exercises the timeliness rate against both the persisted lifetime
            posture bands and the windowed recertification tiers from the same referral set, which is
            where every rate threshold in the scaffold lives.

  - section: consistency_model
    instances:
      - name: match_run_creation_response_already_shows_the_promotion
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.offer_promotion_selector
          - endpoints["POST /opo/organs/{id}/match-runs"]
        distinguishing_aspect: |
          The promotion that fills the primary slots runs inside the creating request: the 201 body
          itself reports pending_offer_count 2 and slots_free 0 out of three candidates, and the organ
          and donor case read back as OFFERING / OFFERS_IN_FLIGHT with no intervening write.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-09T09:00:00Z."
            - "An ALLOCATABLE PANCREAS on a donor case whose allocation_status is NOT_STARTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T09:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8301", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-09T08:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: [], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /opo/death-referrals/${ref_id}/authorizations"
              payload: { registry_hit: true, registry_document_ref: "REG-8301" }
              as: AuthorizationSpecialist
              as_user_id: "auth-1"
              captures: { auth_id: $.data.id }
            - call: "POST /opo/authorizations/${auth_id}/finalize"
              payload: {}
              as: AuthorizationSpecialist
              as_user_id: "auth-2"
            - call: "POST /opo/donor-cases"
              payload: { referral_id: "${ref_id}", authorization_id: "${auth_id}", donor_code: "D-8301" }
              as: DonorCoordinator
              captures: { case_id: $.data.id, alloc_before: $.data.allocation_status }
            - call: "POST /opo/donor-cases/${case_id}/organs"
              payload: { organ_type: "PANCREAS" }
              as: DonorCoordinator
              captures: { organ_id: $.data.id }
            - call: "POST /opo/organs/${organ_id}/evaluation"
              payload: { decision: "ALLOCATABLE" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /opo/organs/${organ_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { organ_v: $.data.version }
          trigger:
            - call: "POST /opo/organs/${organ_id}/match-runs"
              payload: { expected_organ_version: "${organ_v}", candidates: [ { sequence_position: 1, center_code: "CTR-A", candidate_code: "CAND-A", acceptance_clock_minutes: 90 }, { sequence_position: 2, center_code: "CTR-B", candidate_code: "CAND-B", acceptance_clock_minutes: 90 }, { sequence_position: 3, center_code: "CTR-C", candidate_code: "CAND-C", acceptance_clock_minutes: 90 } ] }
              as: AllocationSpecialist
              captures: { run_id: $.data.id, run_status: $.data.status, slots: $.data.primary_offer_slots, cand: $.data.candidate_count, pending: $.data.pending_offer_count, free: $.data.slots_free }
            - call: "GET /opo/match-runs/${run_id}/offers"
              payload: {}
              as: AllocationSpecialist
              captures: { o1_status: "$.data[0].status", o1_expires: "$.data[0].expires_at", o3_status: "$.data[2].status" }
            - call: "GET /opo/donor-cases/${case_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { alloc_after: $.data.allocation_status }
          assert:
            - "${alloc_before} == NOT_STARTED before the trigger"
            - "the creation response already carries ${run_status} == OPEN, ${slots} == 2 (default), ${cand} == 3, ${pending} == 2 and ${free} == 0 - no second call is needed to observe the promotion"
            - "${o1_status} == PENDING with ${o1_expires} == 2026-09-09T10:30:00Z and ${o3_status} == QUEUED"
            - "${alloc_after} == OFFERS_IN_FLIGHT (the run creation passed through MATCH_RUN_OPEN in the same request) and Organ.${organ_id}.status == OFFERING"
