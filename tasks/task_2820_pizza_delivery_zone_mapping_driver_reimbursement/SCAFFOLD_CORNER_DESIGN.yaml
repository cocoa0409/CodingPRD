      grounds: [concurrency_rules.insurance-verification-create-stale-driver, errors.ERR_STALE_DRIVER_VERSION, validations.priority_11, entities.Driver.fields.insurance_status]
      distinguishing_aspect: 'Filing a certificate bumps Driver.version as a side effect, so the very token that made the FIRST filing legal is stale for the second: the renewal presented with it returns ERR_STALE_DRIVER_VERSION (412) and leaves the incumbent certificate VERIFIED, while the retry with the re-read version supersedes it.'
