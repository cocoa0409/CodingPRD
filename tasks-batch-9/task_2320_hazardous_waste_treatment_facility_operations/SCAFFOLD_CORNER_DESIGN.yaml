  # ===========================================================================
  # 8. From the cross-cutting complexity layers declared in §1.0
  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: instrument_posted_against_a_stale_facility_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[instrument-create-stale-facility]
          - validations[priority=7]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          Because a new instrument silently supersedes the facility's prior ACTIVE one, the write is
          guarded by the PARENT's version: the second post replaying version 1 is refused with 412 and
          the first instrument survives untouched; only after re-reading the facility does the
          supersession go through.
        test_recipe:
          setup:
            - "Facility read once at version 1; a first instrument posted with that version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 40000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
              as_user_id: "cm-01"
              captures: { instr1_id: $.data.id }
          trigger:
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "SURETY_BOND", face_amount_cents: 90000000, effective_on: "2026-07-15", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
              as_user_id: "cm-02"
            - call: "GET /tsdf/facilities/${fac_id}"
              payload: {}
              as: ComplianceManager
              captures: { fac_v2: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "SURETY_BOND", face_amount_cents: 90000000, effective_on: "2026-07-15", expected_facility_version: "${fac_v2}" }
              as: ComplianceManager
              as_user_id: "cm-02"
              captures: { instr2_id: $.data.id }
          assert:
            - "Stale post: status == 412 and data.error_id == ERR_STALE_VERSION"
            - "FinancialAssuranceInstrument.${instr1_id}.status == ACTIVE after the refusal"
            - "Facility.${fac_id}.posted_assurance_cents == 40000000 after the refusal"
            - "${fac_v2} == 2"
            - "Retried post: status == 201 and FinancialAssuranceInstrument.${instr2_id}.status == ACTIVE"
            - "FinancialAssuranceInstrument.${instr1_id}.status == SUPERSEDED"
            - "Facility.${fac_id}.posted_assurance_cents == 90000000"
            - "Facility.${fac_id}.version == 3"

      - name: sample_recorded_against_a_stale_profile_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[sample-create-stale-profile]
          - validations[priority=7]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          The second OCC guard protects a different parent for a different reason — a sample written
          from a stale view would be judged against superseded declared values — and the version it
          checks advances on every sample, so a chemist replaying the submit-time version after one
          recorded sample is refused with 412 and the attempt counter does not move.
        test_recipe:
          setup:
            - "Profile SUBMITTED at version 1; a first FAIL sample recorded, taking it to SAMPLE_FAILED at version 2"
            - "The generator resubmits with a revised characterization, taking it to SUBMITTED at version 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
