        distinguishing_aspect: |
          Depth-4 chain from a DIFFERENT triggering transition (claim pay, not case assign):
          (1) claim APPROVED -> PAID; (2) BECAUSE the claim entered the PAID set, insurance_remaining
          recomputes 100000 -> 0; (3) BECAUSE remaining reached 0, insurance_status flips
