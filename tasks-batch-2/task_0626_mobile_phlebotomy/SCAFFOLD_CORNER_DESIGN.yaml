# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Mobile Phlebotomy & At-Home Lab Draw — breadth probe across §1.1-§1.7.
# excluded_because: stubs cite §1.8 instances by name where the corner is
# already exercised as a difficulty instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_test_panel_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.TestPanel, endpoints]
        distinguishing_aspect: "POST /test-panels with all required fields returns 201; status defaults ACTIVE; server mints id/created_at/version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /test-panels"
              payload: { panel_code: "LIPID", name: "Lipid Panel", required_tube_count: 1, base_lab_fee_cents: 1800, fasting_required: true }
              as: LabOps
              captures: { pid: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "TestPanel.${pid}.status == ACTIVE"
            - "TestPanel.${pid}.required_tube_count == 1"
            - "TestPanel.${pid}.version == 1"

      - name: get_lab_order_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.LabOrder, "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /lab-orders/{id} with a non-existent UUID returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /lab-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OrderingProvider
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_NOT_FOUND"
            - "response HTTP status == 404"

      - name: create_lab_order_missing_panel_code_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.LabOrder.fields.panel_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /lab-orders omitting required panel_code returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["LabPartner Quest accepting CMP14 exists"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
          trigger:
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "response HTTP status == 400"

      - name: create_insurance_order_missing_member_id_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.LabOrder.fields.insurance_member_id, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "billing_mode INSURANCE without insurance_member_id is rejected ERR_INVALID_REQUEST (400) — conditional required field."
        test_recipe:
          setup: ["Panel CMP14 + partner Quest exist"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
          trigger:
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "INSURANCE" }
              as: OrderingProvider
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "response HTTP status == 400"

      - name: order_priority_defaults_routine
        claim_type: Defaults
        grounds: [entities.LabOrder.fields.priority]
        distinguishing_aspect: "Omitting priority on POST /lab-orders applies default ROUTINE."
        test_recipe:
          setup: ["Panel CMP14 + partner Quest exist"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
          trigger:
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
          assert:
            - "LabOrder.${o_id}.priority == ROUTINE"
            - "LabOrder.${o_id}.status == ORDERED"

      - name: order_specimens_required_count_mirrors_panel
        claim_type: Computed Fields
        grounds: [entities.LabOrder.fields.specimens_required_count, entities.TestPanel.fields.required_tube_count]
        distinguishing_aspect: "specimens_required_count is server-computed from the panel's required_tube_count (3), ignoring any client-supplied value."
        test_recipe:
          setup: ["Panel CMP14 (3 tubes) + partner Quest exist"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
          trigger:
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
          assert:
            - "LabOrder.${o_id}.specimens_required_count == 3"
            - "LabOrder.${o_id}.redraw_count == 0"

      - name: custody_event_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ChainOfCustodyEvent]
        distinguishing_aspect: "ChainOfCustodyEvent uses common_fields:false (append-only) — it carries only id/created_at, no version field and no update endpoint; the first event is COLLECTED at sequence_index 0."
        test_recipe:
          setup: ["One COLLECTED specimen sp1 with its first custody event"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "ONE", name: "single", required_tube_count: 1, base_lab_fee_cents: 1000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["ONE"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "ONE", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/kit"
              payload: { kit_lot_number: "L1", tube_count: 1 }
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /appointments/${appt_id}/specimens"
              payload: { tube_label: "T1" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp1: $.data.id }
          trigger:
            - call: "GET /specimens/${sp1}/custody-events"
              payload: {}
              as: LabOps
              captures: { ev0_type: "$.data[0].event_type", ev0_seq: "$.data[0].sequence_index" }
          assert:
            - "ev0_type == COLLECTED"
            - "ev0_seq == 0"
            - "custody-events list for sp1 has length 1"

      - name: list_lab_orders_pagination_envelope
        claim_type: Listing
        grounds: [entities.LabOrder, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /lab-orders returns a paginated array envelope with limit/offset/total_count/has_more."
        test_recipe:
          setup: ["At least one order exists"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
          trigger:
            - call: "GET /lab-orders"
              payload: { limit: 5, offset: 0 }
              as: Dispatcher
          assert:
            - "response_type == array"
            - "meta.total_count >= 1"
            - "meta.has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_order_returns_not_cancellable
        claim_type: Invalid Transitions
        grounds: [state_machines.LabOrder.ORDERED_to_CANCELLED, "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED order returns ERR_ORDER_NOT_CANCELLABLE (409); no side effects fire."
        test_recipe:
          setup: ["An ORDERED order already cancelled"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
            - call: "POST /lab-orders/${o_id}/cancel"
              payload: {}
              as: OrderingProvider
          trigger:
            - call: "POST /lab-orders/${o_id}/cancel"
              payload: {}
              as: OrderingProvider
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_NOT_CANCELLABLE"
            - "LabOrder.${o_id}.status == CANCELLED"

      - name: dispatch_without_kit_returns_kit_not_assigned
        claim_type: Precondition Enforcement
        grounds: [state_machines.Appointment.SCHEDULED_to_DISPATCHED, "errors[ERR_KIT_NOT_ASSIGNED]"]
        distinguishing_aspect: "Dispatching a SCHEDULED appointment with no kit assigned returns ERR_KIT_NOT_ASSIGNED (409)."
        test_recipe:
          setup: ["SCHEDULED appointment, no kit assigned, available phlebotomist"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_KIT_NOT_ASSIGNED"
            - "Appointment.${appt_id}.status == SCHEDULED"

      - name: arrive_by_non_assigned_phlebotomist_forbidden
        claim_type: guarded transitions
        grounds: [state_machines.Appointment.DISPATCHED_to_ARRIVED, "errors[ERR_NOT_ASSIGNED_PHLEBOTOMIST]"]
        distinguishing_aspect: "A different phlebotomist (X-User-ID != Appointment.phlebotomist_id) calling arrive is rejected ERR_NOT_ASSIGNED_PHLEBOTOMIST (403)."
        test_recipe:
          setup: ["DISPATCHED appointment assigned to phleb A; a second phleb B exists"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "ONE", name: "single", required_tube_count: 1, base_lab_fee_cents: 1000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["ONE"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Phleb A", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_a: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Phleb B", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_b: $.data.id }
            - call: "POST /phlebotomists/${phleb_a}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "ONE", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/kit"
              payload: { kit_lot_number: "L1", tube_count: 1 }
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_ASSIGNED_PHLEBOTOMIST"
            - "Appointment.${appt_id}.status == DISPATCHED"

      - name: dispatch_recall_returns_to_scheduled
        claim_type: Valid Transition
        grounds: [state_machines.Appointment.DISPATCHED_to_SCHEDULED]
        distinguishing_aspect: "Recalling a DISPATCHED appointment reverts it to SCHEDULED (branching-with-revert) and a re-dispatch then succeeds."
        test_recipe:
          setup: ["DISPATCHED appointment with kit, available phlebotomist"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "ONE", name: "single", required_tube_count: 1, base_lab_fee_cents: 1000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["ONE"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "ONE", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/kit"
              payload: { kit_lot_number: "L1", tube_count: 1 }
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /appointments/${appt_id}/recall"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/dispatch"
              payload: {}
              as: Dispatcher
          assert:
            - "Appointment.${appt_id}.status == DISPATCHED"

      - name: issue_invoice_before_order_resulted_returns_not_resulted
        claim_type: Precondition Enforcement
        grounds: [state_machines.Invoice.DRAFT_to_ISSUED, "errors[ERR_ORDER_NOT_RESULTED]"]
        distinguishing_aspect: "Issuing the invoice while the owning order is still ORDERED returns ERR_ORDER_NOT_RESULTED (409)."
        test_recipe:
          setup: ["ORDERED order with its auto-created DRAFT invoice"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
            - call: "GET /lab-orders/${o_id}/invoices"
              payload: {}
              as: BillingAgent
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_NOT_RESULTED"
            - "Invoice.${inv_id}.status == DRAFT"

      - name: result_before_specimens_accessioned_returns_specimens_not_accessioned
        claim_type: Precondition Enforcement
        grounds: [state_machines.LabOrder.DRAW_COMPLETED_to_RESULTED, "errors[ERR_SPECIMENS_NOT_ACCESSIONED]"]
        distinguishing_aspect: "Posting results on a DRAW_COMPLETED order before all specimens are ACCESSIONED returns ERR_SPECIMENS_NOT_ACCESSIONED (409)."
        test_recipe:
          setup: ["DRAW_COMPLETED 2-tube order; only 1 of 2 specimens accessioned"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CBC2", name: "CBC2", required_tube_count: 2, base_lab_fee_cents: 2000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CBC2"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CBC2", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id }
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/kit"
              payload: { kit_lot_number: "L1", tube_count: 2 }
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /appointments/${appt_id}/specimens"
              payload: { tube_label: "T1" }
