      - name: program_lifecycle_and_catalog_axes_move_independently
        claim_type: parallel
        grounds:
          - state_machines.AcademicProgram.lifecycle_state
          - state_machines.AcademicProgram.catalog_status
          - complexity_profile.state_machine_shape
          - endpoints["POST /provost/academic-programs/{id}/catalog-status"]
        distinguishing_aspect: |
          The two axes on one row are genuinely independent: the registrar can
          suppress marketing and reverse it while the lifecycle axis sits at
          ACTIVE, and opening a review cycle then moves the lifecycle axis
          without disturbing the catalog axis. Each axis write bumps the single
          shared version counter, which is how the combined state is observed.
        test_recipe:
          setup:
            - "One program HIST-BA at ACTIVE / LISTED with version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "MARKETING_SUPPRESSED", suppression_note: "Pre-emptive suppression pending review." }
              as: Registrar
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "LISTED" }
              as: Registrar
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
          assert:
            - "after the first trigger: catalog_status == MARKETING_SUPPRESSED, lifecycle_state == ACTIVE, version == 2"
            - "after the second trigger: catalog_status == LISTED again (the reverse edge), lifecycle_state == ACTIVE, version == 3"
            - "after the third trigger: lifecycle_state == UNDER_REVIEW, catalog_status == LISTED, version == 4"
            - "catalog_status_pre_decision == null throughout — only a ratification cascade captures it"
            - "AcademicProgram.${prog_id}.composite_score == null and viability_band == INSUFFICIENT_DATA — neither axis touched the derived viability fields"

