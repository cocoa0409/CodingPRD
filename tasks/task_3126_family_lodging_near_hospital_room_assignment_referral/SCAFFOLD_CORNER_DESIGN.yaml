            - "fresh respond succeeds: StayRequest.${sr_id}.assignment_status == ACCEPTED"
            - "StayRequest.${sr_id}.version == ${sr_v_post} + 1"

      - name: ops_checkpoint_sweep_expire_then_promote
        claim_type: ops_run_checkpoint
        grounds: [calculations.assignment_capacity_snapshot]
        excluded_because:
          difficulty_instance: "combinatorial_formula / assignment_sweep_expire_before_promote_evaluation_order"
          rationale: "That instance exercises the full expire-then-promote epoch with literal promoted/expired id assertions."

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[stay-request-create-stale-family]', entities.Family]
        distinguishing_aspect: "Family.version starts at 1 and increments exactly once per successful mutation: after one stay-request create it reads 2, after the superseding create it reads 3."
