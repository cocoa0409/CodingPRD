      - name: violation_to_error_guest_visit_window_count_and_delinquency_gates
        claim_type: violation_to_error
        grounds:
          - validations[priority=60]
          - validations[priority=61]
          - validations[priority=67]
          - validations[priority=80]
          - endpoints[POST /swim-club/guest-visits]
          - endpoints[POST /swim-club/households/{id}/payments]
        distinguishing_aspect: |
          Four rules with four different HTTP statuses (422, 422, 422, 402) are triggered one at a
          time on the same endpoint, each with the other three satisfied, and the delinquency gate is
          then discharged with money rather than by waiting. The guest-count rule is checked at BOTH
          ends of its inclusive range, so an implementation that only tests the upper bound lets a
          zero-guest visit through. Every call carries a freshly read expected_household_version, so
          none of the refusals can be mistaken for the stale-version rule at priority 38.
        test_recipe:
          setup:
            - "One SINGLE category with guest_pass_allotment 0, so every guest is billable and the fee is easy to reason about."
            - "One OPEN 2027 season, 2027-05-22 .. 2027-09-06, guest_settlement_policy PASS_FIRST."
            - "One household with an invoiced ACTIVE membership and nothing owed."
            - "The clock sits at 2027-07-11T09:00Z."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-11T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "SINGLE", label: "Single", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 20000, guest_pass_allotment: 0, max_household_size: 2, volunteer_credits_required: 0, waitlist_required: false, proration_allowed: true, party_privileges: false }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Gate Rules Household", address_line: "191 Cedar Court", residency: "IN_DISTRICT", member_count: 1, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-07-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_access: $.data.access_status }
            - call: "GET /swim-club/households/${h_id}"
              payload: {}
              as: PoolManager
              captures: { h_v0: $.data.version }
          trigger:
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "Preseason Guest", guest_count: 2, visit_start_iso: "2027-05-01T14:00:00Z", expected_household_version: "${h_v0}" }
              as: PoolManager
              captures: { err_outside_window: $.data.error_id }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "Next Week Guest", guest_count: 2, visit_start_iso: "2027-07-20T14:00:00Z", expected_household_version: "${h_v0}" }
              as: PoolManager
              captures: { err_future: $.data.error_id }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "Seven Guests", guest_count: 7, visit_start_iso: "2027-07-10T14:00:00Z", expected_household_version: "${h_v0}" }
              as: PoolManager
              captures: { err_too_many: $.data.error_id }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "No Guests", guest_count: 0, visit_start_iso: "2027-07-10T14:00:00Z", expected_household_version: "${h_v0}" }
              as: PoolManager
              captures: { err_zero: $.data.error_id }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "Six Guests At The Limit", guest_count: 6, visit_start_iso: "2027-07-08T14:00:00Z", expected_household_version: "${h_v0}" }
              as: PoolManager
              captures: { v_ok_id: $.data.id, v_ok_fee: $.data.fee_charged_cents }
            - call: "GET /swim-club/households/${h_id}"
              payload: {}
              as: PoolManager
              captures: { h_v1: $.data.version, h_owed_1: $.data.guest_fee_owed_cents }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "One More Guest", guest_count: 1, visit_start_iso: "2027-07-09T14:00:00Z", expected_household_version: "${h_v1}" }
              as: PoolManager
              captures: { err_delinquent: $.data.error_id }
            - call: "POST /swim-club/households/${h_id}/payments"
              payload: { amount_cents: 3000, allocation: "GUEST_FEES" }
              as: Treasurer
              captures: { h_owed_2: $.data.guest_fee_owed_cents, h_v2: $.data.version }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "One More Guest Retried", guest_count: 1, visit_start_iso: "2027-07-09T14:00:00Z", expected_household_version: "${h_v2}" }
              as: PoolManager
              captures: { v_retry_id: $.data.id, v_retry_fee: $.data.fee_charged_cents }
          assert:
            - "${m_access} == ACTIVE, so priority 46 is satisfied on every attempt"
            - "${err_outside_window} == ERR_OUTSIDE_SEASON_WINDOW with HTTP 422: 2027-05-01 is before open_date 2027-05-22, and being in the past does not save it"
            - "${err_future} == ERR_VISIT_IN_FUTURE with HTTP 422: 2027-07-20 is inside the season window but after the clock, so the window rule at priority 60 is silent and 61 fires"
            - "${err_too_many} == ERR_GUEST_LIMIT_EXCEEDED with HTTP 422: 7 > MAX_GUESTS_PER_VISIT 6"
            - "${err_zero} == ERR_GUEST_LIMIT_EXCEEDED as well: the range is [1, 6] inclusive, so 0 is a violation of the SAME rule and not ERR_VALIDATION"
            - "the 6-guest visit is HTTP 201, proving the upper bound is inclusive, with ${v_ok_fee} == 3000 == 6 * 500 on a Thursday"
            - "${h_owed_1} == 3000 and ${h_v1} > ${h_v0}: the successful visit moved the household row"
            - "${err_delinquent} == ERR_DUES_DELINQUENT with HTTP 402: guest_fee_owed_cents 3000 exceeds DELINQUENCY_TOLERANCE_CENTS 0, even though the membership's own dues_status is INVOICED and not DELINQUENT"
            - "${h_owed_2} == 0 after the GUEST_FEES payment"
            - "the retried visit is HTTP 201 with ${v_retry_fee} == 500 == 1 * 500 on a Friday, so the delinquency gate is a live condition and not a sticky flag"
            - "no GuestVisit row exists for any of the five refused attempts"

      - name: violation_to_error_a_party_reservation_needs_a_settled_bond
        claim_type: violation_to_error
        grounds:
          - validations[priority=81]
          - validations[priority=82]
          - endpoints[POST /swim-club/households/{id}/payments]
          - entities.Household.fields.bond_status
        distinguishing_aspect: |
          The bond gate reads the HOUSEHOLD's bond_paid_cents, not the membership's invoice, and the
          fixture makes those two disagree: the membership was invoiced with the 30000 first
          installment (bond_payment_plan INSTALLMENTS moves bond_status to INSTALLMENTS), so a naive
          "has the bond been billed" test passes while bond_paid_cents is still 0. Only an actual
          BOND-allocated household payment satisfies the rule. The same payment endpoint is also shown
          refusing an overpayment, which pins the BOND arm of priority 82 to the remaining bond and
          not to the amount already billed.
        test_recipe:
          setup:
            - "One SENIOR category with bond_cents 120000, waitlist_required false, party_privileges true, max_household_size 6."
            - "One OPEN 2027 season with facility_posture OPEN, so the posture rules at priorities 41 and 42 are silent."
            - "One household with member_count 4 and an invoiced ACTIVE membership on bond_payment_plan INSTALLMENTS."
            - "The clock sits at 2027-07-01T09:00Z, before the party window."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "SENIOR", label: "Senior", bond_cents: 120000, initiation_fee_cents: 0, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 0, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id, cat_bond: $.data.bond_cents }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
              captures: { s_posture: $.data.facility_posture }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Bond Gate Household", address_line: "201 Cedar Court", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id, h_bond_status_0: $.data.bond_status, h_bond_paid_0: $.data.bond_paid_cents }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-07-01", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_bond_line: $.data.bond_installment_cents, m_access: $.data.access_status }
            - call: "GET /swim-club/households/${h_id}"
              payload: {}
              as: Treasurer
              captures: { h_bond_status_1: $.data.bond_status, h_bond_paid_1: $.data.bond_paid_cents }
          trigger:
            - call: "POST /swim-club/party-reservations"
              payload: { membership_id: "${m_id}", zone: "PAVILION", start_iso: "2027-07-15T14:00:00Z", end_iso: "2027-07-15T18:00:00Z", guest_count: 12, host_party_size: 14 }
              as: PoolManager
              captures: { err_bond: $.data.error_id }
            - call: "POST /swim-club/households/${h_id}/payments"
              payload: { amount_cents: 130000, allocation: "BOND" }
              as: Treasurer
              captures: { err_overpay: $.data.error_id }
            - call: "POST /swim-club/households/${h_id}/payments"
              payload: { amount_cents: 120000, allocation: "BOND" }
              as: Treasurer
              captures: { h_bond_status_2: $.data.bond_status, h_bond_paid_2: $.data.bond_paid_cents }
            - call: "POST /swim-club/party-reservations"
              payload: { membership_id: "${m_id}", zone: "PAVILION", start_iso: "2027-07-15T14:00:00Z", end_iso: "2027-07-15T18:00:00Z", guest_count: 12, host_party_size: 14 }
              as: PoolManager
              captures: { p_id: $.data.id, p_status: $.data.status, p_total: $.data.total_charge_cents }
          assert:
            - "${s_posture} == OPEN and ${m_access} == ACTIVE, so the only live gate is the bond"
            - "${h_bond_status_0} == NONE and ${h_bond_paid_0} == 0 on a fresh household"
            - "${m_bond_line} == 30000 == round_half_up(120000 * 0.25) and ${h_bond_status_1} == INSTALLMENTS, but ${h_bond_paid_1} == 0: billing the installment is not paying it"
            - "${err_bond} == ERR_BOND_NOT_PAID with HTTP 402, because bond_paid_cents 0 < ${cat_bond} 120000 and bond_status INSTALLMENTS is not in {PAID, TRANSFERRED}"
            - "${err_overpay} == ERR_PAYMENT_EXCEEDS_BALANCE with HTTP 422: 130000 > 120000 - 0, so the BOND arm is bounded by the remaining bond"
            - "${h_bond_paid_2} == 120000 and ${h_bond_status_2} == PAID after the exact payment"
            - "the retried reservation is HTTP 201 with ${p_status} == REQUESTED and ${p_total} == 22500, so the refusal was a live condition"
            - "no PartyReservation row exists for the first attempt, and bond_paid_cents was never moved by the refused overpayment"

      - name: violation_to_error_confirming_a_party_without_guard_coverage
        claim_type: violation_to_error
        grounds:
          - validations[priority=51]
          - calculations.staffing_ratio_compliance
          - state_machines[PartyReservation].REQUESTED_to_CONFIRMED
          - endpoints[POST /swim-club/party-reservations/{id}/transitions]
        distinguishing_aspect: |
          The ratio rule is enforced on CONFIRM, not on CREATE, so the reservation is allowed to exist
          and be priced with required_guard_count 1 while no guard is scheduled at all. The check is
          evaluated at TWO instants - start_iso and end_iso minus one minute - which is why a single
          spot check at start_iso would be insufficient in general; here both are uncovered. The
          refusal must leave the reservation in REQUESTED so it can be confirmed later once a shift
          exists.
        test_recipe:
          setup:
            - "One COUPLE category with bond 0, so priority 81 is satisfied."
            - "One OPEN 2027 season with facility_posture OPEN and no GuardShifts whatsoever."
            - "One household with an invoiced ACTIVE membership and a REQUESTED PAVILION reservation for 2027-07-15T14:00Z-18:00Z with 12 guests and 8 hosts (load 20, one required guard)."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Uncovered Party Household", address_line: "211 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-07-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "POST /swim-club/party-reservations"
              payload: { membership_id: "${m_id}", zone: "PAVILION", start_iso: "2027-07-15T14:00:00Z", end_iso: "2027-07-15T18:00:00Z", guest_count: 12, host_party_size: 8 }
              as: PoolManager
              captures: { p_id: $.data.id, p_status_0: $.data.status, p_guards: $.data.required_guard_count, p_total: $.data.total_charge_cents }
            - call: "GET /swim-club/guard-shifts"
              payload: { season_id: "${s27_id}" }
              as: PoolManager
              captures: { shift_list: $.data }
          trigger:
            - call: "GET /swim-club/seasons/${s27_id}/staffing-window"
              payload: { at_iso: "2027-07-15T14:00:00Z" }
              as: PoolManager
              captures: { win_start: $.data }
            - call: "POST /swim-club/party-reservations/${p_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: PoolManager
              captures: { err_ratio: $.data.error_id }
            - call: "GET /swim-club/party-reservations/${p_id}"
              payload: {}
              as: PoolManager
              captures: { p_status_1: $.data.status }
          assert:
            - "${p_status_0} == REQUESTED at creation and ${p_guards} == 1 == max(1, ceil(20 / 25)), with ${p_total} == 16200"
            - "${shift_list} is empty: the season has no GuardShift rows at all"
            - "${win_start} reports bather_load 20, required_guard_count 1, scheduled_guard_count 0 and compliant false at the party's start instant"
            - "${err_ratio} == ERR_GUARD_RATIO_NOT_MET with HTTP 422, not ERR_INVALID_TRANSITION: REQUESTED -> CONFIRMED is a declared edge and only its precondition failed"
            - "${p_status_1} == REQUESTED: the refused confirmation left the machine where it was"
            - "the household is still charged 16200, because the charge was booked at creation and a refused confirmation is not a refund event"

      - name: satisfaction_to_pass_a_confirmed_primary_shift_admits_the_confirmation
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=51]
          - validations[priority=50]
          - calculations.staffing_ratio_compliance
          - state_machines[GuardShift].SCHEDULED_to_CONFIRMED
          - endpoints[POST /swim-club/party-reservations/{id}/transitions]
        distinguishing_aspect: |
          This is the positive twin of the ratio refusal, and it has to satisfy the rule in the exact
          shape the calculation demands: the shift must be CONFIRMED rather than SCHEDULED, it must
          carry counts_toward_ratio true (so PRIMARY, not SUPERVISOR), and its CLOSED interval must
          cover both probe instants. The lifeguard must hold BOTH a VALID LIFEGUARD certification and
          a VALID CPR_AED certification with expires_on at or after the shift's end date, or the shift
          could not have been created at all.
        test_recipe:
          setup:
            - "The same fixture as the ratio refusal: COUPLE bond 0, OPEN 2027 season, one household with an invoiced ACTIVE membership and a REQUESTED PAVILION reservation for 2027-07-15T14:00Z-18:00Z (load 20, one required guard, total 16200)."
            - "One lifeguard with a VALID LIFEGUARD certification and a VALID CPR_AED certification, both expiring 2028-05-31, comfortably after the shift's end date."
            - "One PRIMARY shift 2027-07-15T13:00Z-19:00Z, which strictly contains the party window at both ends."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
