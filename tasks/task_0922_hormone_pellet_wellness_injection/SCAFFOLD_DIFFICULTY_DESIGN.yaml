          Procedure.status is cyclic: CONSENTED returns to SCHEDULED when a protocol
          publication supersedes the attached consent, and the same row then re-enters
          CONSENTED under a fresh consent. The same procedure occupies CONSENTED twice
          with two different consent_record_id values.
