          - errors[ERR_LEASE_NOT_ACTIVE]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: "error_precedence / holdover_lease_state_error_precedes_report_period_overlap"
          rationale: "That instance builds a filing that violates both rules at once — a lease moved into holdover and a period overlapping an accepted report — and pins the single 409 that must come back. Any additional probe of the same pair would only restate it."

      - name: insurance_guard_outranks_the_capital_obligation_ceiling
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INSURANCE_LAPSED]
          - errors[ERR_IMPROVEMENT_EXCEEDS_OBLIGATION]
        excluded_because:
          difficulty_instance: "error_precedence / insurance_safety_error_precedes_capital_obligation_excess"
          rationale: "An improvement approval that is both uninsured and over the committed capital obligation is the exact doubly-invalid request that instance drives, and it asserts that the safety error wins and that no partial approval is recorded."
