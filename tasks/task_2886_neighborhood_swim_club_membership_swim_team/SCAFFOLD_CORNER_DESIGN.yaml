          assert:
            - "${m_a_balance} == ${m_b_balance} == 31050 and ${w_offered_id} == ${w_a_id} with ${w_a_status_0} == OFFERED"
            - "${err_read_foreign_household} == ERR_NOT_RESOURCE_OWNER with HTTP 403, while the same read of its own household returns ${own_household_name} == Owner Household A"
            - "${err_pay_foreign_membership} == ERR_NOT_RESOURCE_OWNER: ownership is resolved through membership.household_id, one hop away from the header"
            - "the member's payment against its OWN membership is HTTP 200 with ${m_a_dues_1} == PAID and ${m_a_balance_1} == 0, so the endpoint works and only the identity was wrong"
            - "${err_respond_foreign_entry} == ERR_NOT_RESOURCE_OWNER for household B answering household A's offer, which is also the precondition X-User-ID == entry.household_id on the ACCEPTED edge"
            - "the owner's identical response is HTTP 200 with ${w_a_status_1} == ACCEPTED, and B's own entry ${w_b_id} is untouched and still WAITING"
            - "${m_b_dues_1} == PAID with ${m_b_balance_1} == 0 when the Treasurer sends the very payment the foreign Member was refused: priority 4 constrains Members only"
            - "${err_member_reads_findings} == ERR_UNAUTHORIZED with HTTP 403, not ERR_NOT_RESOURCE_OWNER: the finding list is not an owned resource, so the role check is what refuses it"

      - name: segregation_of_duties_no_office_may_decide_its_own_paperwork
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=5]
          - state_machines[CapitalProject].PROPOSED_to_APPROVED
          - state_machines[ConductCase].UNDER_REVIEW_to_SANCTIONED
          - state_machines[InspectionFinding].REMEDIATION_SUBMITTED_to_VERIFIED_CLOSED
        distinguishing_aspect: |
          Two-person control is asserted on all three entities that carry it, and in every case the
          refused caller holds a role that the endpoint DOES accept, so the 403 can only come from the
          identity comparison and never from priority 3. The second user is always the same role as the
          first, which rules out an implementation that merely requires a different role. The stamped
          decider ids are then read back to prove the winning call recorded who decided.
        test_recipe:
          setup:
            - "One OPEN 2027 season and one household, created by their owning offices."
            - "A capital project proposed by tr-001, a conduct case reported by bp-001, and a MINOR inspection finding recorded by hi-001 whose remediation has been submitted by the PoolManager."
            - "Two distinct user ids exist per office: tr-001/tr-002, bp-001/bp-002 and hi-001/hi-002."
            - "The clock sits at 2027-07-01T09:00Z."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
