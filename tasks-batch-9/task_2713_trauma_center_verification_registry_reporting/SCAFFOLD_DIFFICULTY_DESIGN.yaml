            - "RegistryCase.${k1}.effective_iss == 26 and inclusion_status == INCLUDED"
      - name: transfer_out_requires_partner_agreement_in_active_state
        grounds:
          - validations[priority=60]
          - errors[ERR_NO_ACTIVE_REFERRAL_AGREEMENT]
          - state_machines.ReferralAgreement.DRAFT_to_ACTIVE
          - calculations.case_inclusion_classification
        distinguishing_aspect: |
          The blocking entity here lives in a different aggregate entirely — a ReferralAgreement between
          two centers — and the gate is its agreement_status, not a child record's state. Activation is
          performed by the *receiving* center's manager, and only then does the same transfer-out body
          succeed and flip the case out of the included cohort.
        test_recipe:
          setup:
            - "two trauma centers: the referring center and the receiving center"
            - "one ReferralAgreement on the directed pair covering 2026-01-01 to 2027-01-01 but still DRAFT"
            - "one INCLUDED case at the referring center with arrival_at inside that interval, los_hours 12.00 and injury_severity_score 5, so it will fall into the minor-transfer exclusion once transferred"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
