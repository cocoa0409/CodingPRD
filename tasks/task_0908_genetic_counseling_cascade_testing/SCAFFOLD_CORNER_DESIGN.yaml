            - "CounselingCase.${case_id}.sessions_used == 1"
            - "CounselingCase.${case_id}.sessions_remaining == 1"

      - name: referral_manual_create_then_close_completed
        claim_type: Valid Transition
        grounds: [state_machines.Referral.PENDING_to_COMPLETED, entities.Referral.fields.status]
        distinguishing_aspect: "A manually created Referral starts PENDING and closing it with outcome COMPLETED moves it to COMPLETED."
