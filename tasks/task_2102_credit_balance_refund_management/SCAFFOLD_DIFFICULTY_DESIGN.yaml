            - call: "POST /refund-requests"
              payload: { credit_balance_id: "${cb_es1_id}", requested_amount_cents: 12000, payee_type: "PATIENT", payee_name: "Elena Sharp", payee_address_line: "12 Bay St", payee_state_code: "CA", expected_credit_balance_version: "${cb_es1_v}" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { rr_es1_id: "$.data.id" }
            - call: "POST /refund-requests"
              payload: { credit_balance_id: "${cb_es2_id}", requested_amount_cents: 12000, payee_type: "PATIENT", payee_name: "Evan Sharp", payee_address_line: "14 Bay St", payee_state_code: "CA", expected_credit_balance_version: "${cb_es2_v}" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { rr_es2_id: "$.data.id" }
            - call: "POST /refund-requests/${rr_es1_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /refund-requests/${rr_es2_id}/submit"
              payload: {}
              as: CreditAnalyst
