              as: AuctionStaff
              captures: { cg: "$.data.id" }
            - call: "POST /consignments/${cg}/appraise"
              payload: { appraised_low_cents: 100000, appraised_high_cents: 400000 }
              as: Appraiser
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "Vase", category: "ART", reserve_cents: 0, starting_bid_cents: 200000, estimate_low_cents: 100000, estimate_high_cents: 400000, lot_number: 1 }
              as: AuctionStaff
              captures: { lot: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot_v: "$.data.version" }
            - call: "POST /bidders"
              payload: { display_name: "Buyer", email: "b@x.com", paddle_number: "P1", deposit_cents: 0 }
              as: AuctionStaff
              captures: { bd: "$.data.id" }
            - call: "POST /lots/${lot}/bids"
              payload: { bidder_id: "${bd}", bid_type: "LIVE", amount_cents: 300000, expected_lot_version: "${lot_v}" }
              as: Bidder
              as_user_id: "${bd}"
            - call: "POST /lots/${lot}/hammer"
              payload: {}
              as: AuctionStaff
          trigger:
            - call: "GET /invoices?bidder_id=${bd}&auction_id=${au}"
              payload: {}
              as: AuctionStaff
              captures: { inv: "$.data[0].id", p0: "$.data[0].payment_status", f0: "$.data[0].fulfillment_status" }
            - call: "POST /invoices/${inv}/payments"
              payload: { amount_cents: 375000 }
              as: AuctionStaff
              captures: { p1: "$.data.payment_status", f1: "$.data.fulfillment_status" }
            - call: "POST /invoices/${inv}/ready"
              payload: { fulfillment_method: "PICKUP" }
              as: AuctionStaff
              captures: { p2: "$.data.payment_status", f2: "$.data.fulfillment_status" }
          assert:
            - "${p0} == 'UNPAID'"
            - "${f0} == 'PENDING'"
            - "${p1} == 'PAID'"
            - "${f1} == 'PENDING'"
            - "${p2} == 'PAID'"
            - "${f2} == 'READY'"

      - name: nl_dispute_cycle_review_requestinfo_review
        grounds:
          - state_machines.Dispute.OPEN_to_UNDER_REVIEW
          - state_machines.Dispute.UNDER_REVIEW_to_OPEN
          - state_machines.Dispute.UNDER_REVIEW_to_REJECTED
        distinguishing_aspect: "A Dispute loops UNDER_REVIEW -> OPEN -> UNDER_REVIEW via request-info before REJECTED, a genuine cycle on the Dispute entity (distinct entity from the Invoice parallel machine)."
        test_recipe:
          setup:
