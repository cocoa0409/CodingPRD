            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 100 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "TILE_LOOK_ACRYLIC", color: "WHITE", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.system_price_cents == 542800"
            - "Quote.${q_id}.addon_price_cents == 0"
            - "Quote.${q_id}.discount_cents == 0"
            - "Quote.${q_id}.net_price_cents == 542800"

      - name: per_line_rounding_discount_mode_b
        grounds:
          - calculations.quote_discount_cents
          - entities.Quote.fields.discount_cents
          - entities.Quote.fields.net_price_cents
        distinguishing_aspect: >
          Mode (b) rounding order: SMOOTH 60 sqft (217500) + WALK_IN_TUB (449900) at
          SPRING750 (7.5%) — round-per-line round(16312.5)+round(33742.5)=16313+33743=50056,
          which differs from sum-then-round (50055). Pinned per-line result is 50056.
        test_recipe:
          setup:
            - "A DESIGN_COMPLETE project with measured_wall_area_sqft=60"
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dana D", email: "dana4@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Homer H", email: "homer4@x.com", phone: "555-5", street_address: "5 Fir", city: "LA", state_code: "CA", postal_code: "90005" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T16:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 60 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "SMOOTH_ACRYLIC", color: "WHITE", accessibility_addon: "WALK_IN_TUB", promo_code: "SPRING750", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.system_price_cents == 217500"
            - "Quote.${q_id}.addon_price_cents == 449900"
            - "Quote.${q_id}.discount_cents == 50056"
            - "Quote.${q_id}.net_price_cents == 617344"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_parallel_status_and_financing_dimensions
        grounds:
          - state_machines.Quote.REQUESTED_to_APPROVED
          - state_machines.Quote.PRESENTED_to_ACCEPTED
          - entities.Quote.fields.status
          - entities.Quote.fields.financing_status
        distinguishing_aspect: >
          Quote runs two independent axes: finance-decide APPROVE moves financing_status
          REQUESTED->APPROVED while the status axis stays PRESENTED (unchanged) — proving
          the dimensions evolve independently; approved_apr_bps=999, monthly_payment_cents=11802.
        test_recipe:
          setup:
            - "A PRESENTED quote (SMOOTH/60/WALK_IN_TUB/SPRING750, net 617344) with financing REQUESTED on PLAN_60_999, requested 555610, income 6000000"
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dana D", email: "dana5@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Homer H", email: "homer5@x.com", phone: "555-6", street_address: "6 Pine", city: "LA", state_code: "CA", postal_code: "90006" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T16:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 60 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "SMOOTH_ACRYLIC", color: "WHITE", accessibility_addon: "WALK_IN_TUB", promo_code: "SPRING750", financing_plan_code: "PLAN_60_999", requested_amount_cents: 555610, stated_annual_income_cents: 6000000, expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/present"
              payload: {}
              as: Designer
              as_user_id: "${des_id}"
          trigger:
            - call: "POST /quotes/${q_id}/finance-decide"
              payload: { decision: "APPROVE" }
              as: FinanceOfficer
          assert:
            - "Quote.${q_id}.financing_status == APPROVED"
            - "Quote.${q_id}.status == PRESENTED"
            - "Quote.${q_id}.deposit_cents == 61734"
            - "Quote.${q_id}.financed_amount_cents == 555610"
            - "Quote.${q_id}.approved_apr_bps == 999"
            - "Quote.${q_id}.monthly_payment_cents == 11802"

      - name: warranty_claim_branching_approve
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.WarrantyClaim.SUBMITTED_to_REJECTED
          - entities.WarrantyClaim.fields.status
          - entities.WarrantyClaim.fields.resolution
        distinguishing_aspect: >
          From SUBMITTED the WarrantyClaim forks purely on the decision input: APPROVE ->
          APPROVED with resolution REPAIR (this test); the sibling REJECT branch -> REJECTED
          with resolution DENIED. A linear machine could not reach APPROVED with REPAIR.
        test_recipe:
          setup:
            - "A project driven all the way to INSTALLED (warranty ACTIVE), with a SUBMITTED warranty claim"
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dana D", email: "dana6@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew A", home_state_code: "CA", max_installs_per_day: 2, accessibility_certified: true }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Homer H", email: "homer6@x.com", phone: "555-7", street_address: "7 Birch", city: "LA", state_code: "CA", postal_code: "90007" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T16:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 100 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "TILE_LOOK_ACRYLIC", color: "WHITE", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/present"
              payload: {}
              as: Designer
              as_user_id: "${des_id}"
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /install-bookings"
              payload: { project_id: "${proj_id}", crew_id: "${crew_id}", install_date: "2026-06-01T00:00:00Z" }
              as: InstallCoordinator
              captures: { book_id: $.data.id }
            - call: "POST /install-bookings/${book_id}/complete"
              payload: {}
              as: InstallCoordinator
            - call: "POST /warranty-claims"
              payload: { project_id: "${proj_id}", defect_type: "CRACK", description: "hairline crack near drain" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/decide"
              payload: { decision: "APPROVE", resolution: "REPAIR", review_notes: "warranted repair" }
              as: InstallCoordinator
          assert:
            - "WarrantyClaim.${claim_id}.status == APPROVED"
            - "WarrantyClaim.${claim_id}.resolution == REPAIR"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_cascade_quote_project_referral_customer_depth3
        grounds:
          - state_machines.Quote.PRESENTED_to_ACCEPTED
          - state_machines.Project.QUOTED_to_SOLD
          - state_machines.Referral.REGISTERED_to_REWARDED
          - entities.Customer.fields.referral_credit_cents
        distinguishing_aspect: >
          One accept propagates 3 caused hops: Quote->ACCEPTED causes Project->SOLD, which
          causes the REGISTERED Referral->REWARDED, which causes referrer
          Customer.referral_credit_cents += 50000 (STANDARD flat). Each hop is caused by
          the prior one, not by the accept directly.
        test_recipe:
          setup:
            - "A referrer with a STANDARD referral; a referred customer registered via the code; the referred customer's project at a PRESENTED no-addon quote (TILE/100, net 542800)"
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dana D", email: "dana7@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Rita Referrer", email: "rita7@x.com", phone: "555-8", street_address: "8 Cedar", city: "LA", state_code: "CA", postal_code: "90008" }
              as: PlatformAdmin
              captures: { ref_cust_id: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_customer_id: "${ref_cust_id}", program_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { referral_id: $.data.id, ref_code: $.data.referral_code }
            - call: "POST /customers"
              payload: { full_name: "Ned New", email: "ned7@x.com", phone: "555-9", street_address: "9 Palm", city: "LA", state_code: "CA", postal_code: "90009", referral_code_used: "${ref_code}" }
              as: PlatformAdmin
              captures: { new_cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${new_cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T16:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 100 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "TILE_LOOK_ACRYLIC", color: "WHITE", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/present"
              payload: {}
              as: Designer
              as_user_id: "${des_id}"
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${new_cust_id}"
          assert:
            - "Quote.${q_id}.status == ACCEPTED"
            - "Project.${proj_id}.status == INSTALL_READY"
            - "Referral.${referral_id}.status == REWARDED"
            - "Referral.${referral_id}.reward_cents == 50000"
            - "Customer.${ref_cust_id}.referral_credit_cents == 50000"

      - name: cancel_cascade_project_referral_customer_depth2
        grounds:
          - state_machines.Project.INSTALL_READY_to_CANCELLED
          - state_machines.Referral.REWARDED_to_VOID
          - entities.Customer.fields.referral_credit_cents
        distinguishing_aspect: >
          Cancelling the referred project (now INSTALL_READY after reward) causes its
          REWARDED Referral->VOID, which causes referrer
          Customer.referral_credit_cents -= 50000 back to 0 — two caused hops from a
          cancel trigger, a different propagation origin than the accept cascade.
        test_recipe:
          setup:
            - "Exactly the accept_cascade end-state: referrer credit 50000, referred project INSTALL_READY, referral REWARDED"
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dana D", email: "dana8@x.com", region_state_code: "CA" }
              as: PlatformAdmin
