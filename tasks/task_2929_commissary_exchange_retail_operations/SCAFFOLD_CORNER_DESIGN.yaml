              as: StoreCashier
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${order_id}/route"
              payload: { route: "OVERSEAS_SHIP" }
              as: StoreCashier
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and ${error_id} == ERR_ROUTE_NOT_AVAILABLE_IN_REGION"
            - "SpecialOrder.${order_id}.state == SUBMITTED, route == null, shipping_allowance_cents == 0"
            - "Store.${store_id}.shipping_allowance_committed_cents == 0"

      - name: corner_terminal_order_state_outranks_route_region_check
        claim_type: priority_conflict
        grounds:
          - validations.priority_25_ERR_SPECIAL_ORDER_TERMINAL
          - validations.priority_39_ERR_ROUTE_NOT_AVAILABLE_IN_REGION
