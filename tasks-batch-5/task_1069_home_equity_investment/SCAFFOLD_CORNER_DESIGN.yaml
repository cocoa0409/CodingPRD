# =============================================================================
# task_1069 — §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7)
# Every error in §1.6 not already triggered by §1.8 is triggered here.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: fund_create_computed_available_equals_total
        claim_type: Computed Fields
        grounds: [entities.Fund.fields.available_capital_cents, entities.Fund.fields.committed_capital_cents]
        distinguishing_aspect: "A freshly created Fund has committed_capital_cents == 0 and available_capital_cents == total_capital_cents (30000000)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC1", total_capital_cents: 30000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
          trigger:
            - call: "GET /hei/funds/${fund_id}"
              payload: {}
              as: InvestmentAnalyst
          assert:
            - "Fund.${fund_id}.committed_capital_cents == 0"
            - "Fund.${fund_id}.available_capital_cents == 30000000"

      - name: application_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Application, "errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random non-existent application id returns ERR_APPLICATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /hei/applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: InvestmentAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_APPLICATION_NOT_FOUND (HTTP 404)"

      - name: application_create_missing_required_returns_validation
        claim_type: Required Fields
        grounds: [entities.Application.fields.requested_investment_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Creating an application without the required requested_investment_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["a Fund and a Homeowner exist"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC2", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoc2@x.com", full_name: "Ho C2" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "C2", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_VALIDATION (HTTP 400)"

      - name: application_create_bad_fund_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Application.fields.fund_id, "errors[ERR_FUND_NOT_FOUND]"]
        distinguishing_aspect: "Creating an application with a non-existent fund_id returns ERR_FUND_NOT_FOUND (404)."
        test_recipe:
          setup: ["a Homeowner exists"]
          setup_api_calls:
            - call: "POST /hei/homeowners"
              payload: { email: "hoc3@x.com", full_name: "Ho C3" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "00000000-0000-4000-8000-000000000000", property_address: "C3", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_FUND_NOT_FOUND (HTTP 404)"

      - name: application_create_bad_property_type_invalid_enum
        claim_type: Type Constraints
        grounds: [entities.Application.fields.property_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "property_type outside {SINGLE_FAMILY,CONDO,TOWNHOUSE,MULTI_UNIT} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["a Fund and a Homeowner exist"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC4", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoc4@x.com", full_name: "Ho C4" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "C4", property_type: "HOUSEBOAT", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_VALIDATION (HTTP 400)"

  - section: validations
    instances:
      - name: decision_by_homeowner_unauthorized
        claim_type: Violation to Error
        grounds: ["validations[priority=2]", roles.InvestmentAnalyst, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Homeowner calling the analyst-only /decision endpoint gets ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Application UNDER_REVIEW with a COMPLETED AVM valuation"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC5", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoc5@x.com", full_name: "Ho C5" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "C5", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 80000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
          trigger:
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_UNAUTHORIZED (HTTP 403)"

      - name: create_application_unknown_role_unauthenticated
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request whose X-User-Role is not a known role returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["a Fund and a Homeowner exist"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC6", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoc6@x.com", full_name: "Ho C6" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "C6", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Guest
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: offer_accept_by_other_homeowner_forbidden
        claim_type: Violation to Error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A different Homeowner (not the application owner) accepting the offer gets ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Application (owned by HO-A) APPROVED with a PRESENTED offer; a second Homeowner HO-B exists"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC7", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoa7@x.com", full_name: "Ho A7" }
              as: InvestmentAnalyst
              captures: { ho_a: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hob7@x.com", full_name: "Ho B7" }
              as: InvestmentAnalyst
              captures: { ho_b: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_a}", fund_id: "${fund_id}", property_address: "C7", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_a}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 80000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_a}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_id}", investment_amount_cents: 10000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /hei/offers/${offer_id}/accept"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_b}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_NOT_RESOURCE_OWNER (HTTP 403)"

      - name: decision_approve_ltv_exceeded_returns_422
        claim_type: Violation to Error
        grounds: ["validations[priority=12]", calculations.combined_ltv, "errors[ERR_LTV_EXCEEDED]"]
        distinguishing_aspect: "combined_ltv = (26000000+50000000)/100000000 = 0.76 > 0.75 -> APPROVE returns ERR_LTV_EXCEEDED (422)."
        test_recipe:
          setup: ["Application UNDER_REVIEW; AVM valuation 100000000; requested 26000000, mortgage 50000000"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC8", total_capital_cents: 1000000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoc8@x.com", full_name: "Ho C8" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "C8", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 100000000, existing_mortgage_balance_cents: 50000000, requested_investment_cents: 26000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 100000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
          trigger:
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_LTV_EXCEEDED (HTTP 422)"

      - name: offer_present_insufficient_fund_capital_returns_422
        claim_type: Aggregate validation
        grounds: ["validations[priority=12]", calculations.fund_committed_capital, "errors[ERR_INSUFFICIENT_FUND_CAPITAL]"]
        distinguishing_aspect: "Fund available 10000000; presenting an offer of 10000001 (one cent over) returns ERR_INSUFFICIENT_FUND_CAPITAL (422); the LTV cap does not bind (valued 40000000 -> cap 12000000)."
        test_recipe:
          setup: ["Fund total 10000000; Application APPROVED with AVM valuation 40000000"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC9", total_capital_cents: 10000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoc9@x.com", full_name: "Ho C9" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "C9", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 40000000, existing_mortgage_balance_cents: 0, requested_investment_cents: 10000001 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 40000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
          trigger:
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_id}", investment_amount_cents: 10000001, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_INSUFFICIENT_FUND_CAPITAL (HTTP 422)"

  - section: state_machines
    instances:
      - name: submit_without_completed_valuation_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.Application.DRAFT_to_UNDER_REVIEW, "errors[ERR_NO_COMPLETED_VALUATION]"]
        distinguishing_aspect: "Submitting a DRAFT application that has no COMPLETED valuation returns ERR_NO_COMPLETED_VALUATION (409)."
        test_recipe:
          setup: ["Application DRAFT with no valuation"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC10", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoc10@x.com", full_name: "Ho C10" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "C10", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_NO_COMPLETED_VALUATION (HTTP 409)"

      - name: offer_accept_after_expiry_returns_offer_expired
        claim_type: Precondition Enforcement
        grounds: [state_machines.Offer.PRESENTED_to_ACCEPTED, "errors[ERR_OFFER_EXPIRED]"]
        distinguishing_aspect: "Accepting an offer whose expires_at 2026-06-15 is before the default clock 2026-07-01 returns ERR_OFFER_EXPIRED (409)."
        test_recipe:
          setup: ["Application APPROVED; one PRESENTED offer already expired (expires_at 2026-06-15)"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC11", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoc11@x.com", full_name: "Ho C11" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "C11", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 80000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_id}", investment_amount_cents: 10000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2026-06-15T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /hei/offers/${offer_id}/accept"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_OFFER_EXPIRED (HTTP 409)"

      - name: offer_accept_twice_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Offer.PRESENTED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an already-ACCEPTED (terminal) offer a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Application APPROVED; offer ACCEPTED once"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC12", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoc12@x.com", full_name: "Ho C12" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "C12", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 80000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_id}", investment_amount_cents: 10000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /hei/offers/${offer_id}/accept"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
          trigger:
            - call: "POST /hei/offers/${offer_id}/accept"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_INVALID_STATE (HTTP 409)"

      - name: lien_record_clouded_title_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.Lien.PENDING_to_RECORDED, "errors[ERR_TITLE_NOT_CLEAR]"]
        distinguishing_aspect: "Recording a lien with title_status CLOUDED returns ERR_TITLE_NOT_CLEAR (409); lien stays PENDING."
        test_recipe:
          setup: ["AGR-A FUNDED with its Lien PENDING"]
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "FC13", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "hoc13@x.com", full_name: "Ho C13" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "C13", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 80000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_id}", investment_amount_cents: 10000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /hei/offers/${offer_id}/accept"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "GET /hei/agreements?offer_id=${offer_id}"
              payload: {}
              as: ClosingAgent
              captures: { agr_id: "$.data[0].id" }
            - call: "GET /hei/liens?agreement_id=${agr_id}"
              payload: {}
              as: ClosingAgent
              captures: { lien_id: "$.data[0].id" }
          trigger:
            - call: "POST /hei/liens/${lien_id}/record"
              payload: { title_status: "CLOUDED", lien_position: 2 }
              as: ClosingAgent
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response error_id == ERR_TITLE_NOT_CLEAR (HTTP 409)"

  - section: cross_cutting
    instances:
