        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: transitive_cascade / challenge_removal_cascade
          rationale: "Depth-3 and depth-4 cascade assertions (including compensation release) live in the two transitive_cascade instances."

