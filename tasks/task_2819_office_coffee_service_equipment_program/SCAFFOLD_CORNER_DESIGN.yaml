            - call: "POST /ocs/consolidated-invoices"
              payload: { account_id: "${acctB_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", expected_account_version: "${acctB_v}", site_id: "${siteA_id}" }
              as: BillingSpecialist
              captures: { err_foreign: "$.data.error_id" }
            - call: "POST /ocs/consolidated-invoices"
              payload: { account_id: "${acctA_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", expected_account_version: "${acctA_v}", site_id: "${siteB_id}" }
              as: BillingSpecialist
