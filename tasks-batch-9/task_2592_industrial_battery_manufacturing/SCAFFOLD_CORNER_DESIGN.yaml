      - name: bay_window_conflict_code_is_triggerable
        claim_type: every error code is triggerable
        grounds:
          - errors[ERR_BAY_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / formation_bay_single_occupancy_with_two_sided_cooldown_buffer
          rationale: "The §1.8 instance triggers this code five times across nested, straddling, touching and cooldown-buffered windows, so a breadth-level triggerability probe adds nothing."

      - name: emission_budget_and_frozen_plant_codes_are_triggerable
        claim_type: every error code is triggerable
        grounds:
          - errors[ERR_EMISSION_BUDGET_EXCEEDED]
          - errors[ERR_PLANT_FROZEN]
        excluded_because:
          difficulty_instance: boundary_precision_check / emission_ratio_exactly_one_is_accepted_then_freezes
          rationale: "The §1.8 boundary instance triggers ERR_EMISSION_BUDGET_EXCEEDED just above the 1.0000 line and then ERR_PLANT_FROZEN on the next production write once the plant has frozen, covering both codes and their ordering."

      - name: acceptance_and_retest_limit_codes_are_triggerable
        claim_type: every error code is triggerable
        grounds:
          - errors[ERR_RETEST_LIMIT_REACHED]
          - errors[ERR_ACCEPTANCE_EXCEEDED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / production_lot_quarantine_retest_cycle_with_hard_cap
          rationale: "The §1.8 instance walks the quarantine/retest cycle to the RETEST_MAX 2 hard cap and pins ERR_RETEST_LIMIT_REACHED plus the ERR_LOT_STATE_INVALID that follows on the scrapped-or-stuck lot, which is the whole acceptance-limit surface reachable without re-deriving CASCADE B."

      - name: rework_limit_code_is_triggerable
        claim_type: every error code is triggerable
        grounds:
          - errors[ERR_REWORK_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / battery_assembly_parallel_axes_rework_generations
          rationale: "The §1.8 instance exhausts the three permitted rework generations on one assembly and pins the fourth attempt, so the code is already triggered at its exact boundary."

      - name: medical_removal_and_clearance_codes_are_triggerable
        claim_type: every error code is triggerable
        grounds:
          - errors[ERR_ACTOR_MEDICALLY_REMOVED]
          - errors[ERR_CLEARANCE_EVIDENCE_MISSING]
          - errors[ERR_WORKER_NOT_REMOVED]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_exposure_removal_freezes_plant_holds_lots_aborts_runs
          rationale: "The §1.8 cascade removes a worker from duty and then exercises the removal's consequences, including the refused action by the removed actor and the clearance path back to duty. Re-triggering those codes here would replay the same five-hop cascade."

      - name: core_mass_and_core_state_codes_are_triggerable
        claim_type: every error code is triggerable
        grounds:
          - errors[ERR_CORE_MASS_VARIANCE_EXCEEDED]
          - errors[ERR_CORE_STATE_INVALID]
          - errors[ERR_CORE_NOT_APPLICABLE]
          - errors[ERR_LEAD_INVENTORY_INSUFFICIENT]
        excluded_because:
          difficulty_instance: compensating_invariant / invariant_l1_lead_mass_balance_closes_through_shipment_and_core_return
          rationale: "The §1.8 invariant instance ships units, returns cores at and beyond the 2 percent mass tolerance and pins ERR_CORE_MASS_VARIANCE_EXCEEDED against the lead ledger; its companion invariant_c1 instance pins ERR_CORE_STATE_INVALID on the deposit lifecycle. Both chains are long shipment chains that a breadth probe would duplicate wholesale."

  # ===================================================================
  # SECTION 7 - rbac
  # -------------------------------------------------------------------
  # Seven roles, four of them entity_backed on Worker (DesignEngineer,
  # ProductionSupervisor, QualityInspector, SafetyOfficer) and three
  # opaque (PlantAdmin, FleetEngineer, WarrantyAdministrator). The RBAC
  # surface therefore has three independent axes that an implementation
  # can confuse with each other:
  #   * the role gate (§1.4 priority 2) - is this role in the endpoint's
  #     roles list at all;
  #   * the acting-worker gate (priorities 4 and 5) - does as_user_id
  #     resolve, and is that worker on duty;
  #   * the job-class gate (priority 6) - APPROVE needs ENGINEER,
  #     exposure sampling needs SAFETY, RELEASE needs QUALITY, and the
  #     class is a property of the WORKER, not of the role header.
  # The instances below pin one exclusive operation per role, the
  # denial of each of those operations to every other role, and both
  # segregation-of-duties axes (design approval and lot release)
  # including their precedence against the job-class gate.
  # ===================================================================
  - section: rbac
    instances:

      - name: each_role_can_perform_its_own_exclusive_operation
        claim_type: exclusive operation permitted
        grounds:
          - rbac[PlantAdmin]
          - rbac[DesignEngineer]
          - rbac[ProductionSupervisor]
          - rbac[QualityInspector]
          - rbac[SafetyOfficer]
          - rbac[FleetEngineer]
          - rbac[WarrantyAdministrator]
          - endpoints[POST /plants]
          - endpoints[POST /cell-designs]
          - endpoints[POST /production-lots]
          - endpoints[POST /battery-assemblies/{id}/verifications]
          - endpoints[POST /workers/{id}/exposure-samples]
          - endpoints[POST /chargers]
          - endpoints[GET /battery-units]
        distinguishing_aspect: "Each role owns at least one endpoint that no other role may call, and for the four entity_backed roles the successful call needs BOTH a permitted role header and an as_user_id that resolves to an on-duty worker of the right job class - so an implementation that only checks the role header, or that ignores as_user_id entirely, cannot distinguish these successes from the denials in the next instance. WarrantyAdministrator's exclusive WRITE endpoints (maintenance-logs, warranty-claims, warranty-adjudication) all need a shipped BatteryUnit; they are exercised in the calculations instance warranty_settlement_ladder_at_every_boundary, so this instance closes the role's coverage with the shared unit read GET /battery-units, which its §1.7 shared_operations list grants it."
        test_recipe:
          setup:
            - "Plant PLT-RIV licensed for LEAD_ACID and LITHIUM_LFP; workers Ada/Ben (ENGINEER), Cara (PRODUCTION), Dana (QUALITY), Sam (SAFETY); design CD-LEAD-465 APPROVED; lot LOT-R (quantity 9) advanced to ASSEMBLY with assembly ASM-R1 created; clock 2026-09-01T00:00Z."
