            - "none of the denied calls mutated state (case still EVIDENCE_SUBMITTED; plan version unchanged at ${plan_v})"
      - name: missing_auth_header_unauthenticated
        claim_type: rbac_denial
        grounds: ["validations[priority=2]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call with no X-User-ID/X-User-Role headers fails priority-2 authentication with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role, existence, or business check — even on an otherwise valid request."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/plans"
              payload: { name: "Plan NA", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "when the X-User-ID / X-User-Role headers are omitted, ${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
        note: "The trigger row documents the endpoint+payload; the test harness replays it with the auth headers stripped. Header absence cannot be expressed as a payload field, so the note carries the omission."
      - name: participant_ownership_mismatch_rejected
        claim_type: rbac_denial
        grounds: ["validations[priority=3.5]", "errors[ERR_RESOURCE_OWNERSHIP_MISMATCH]", "roles"]
        distinguishing_aspect: "Participant is entity_backed: X-User-ID must equal the owning Participant id. P2 attempting to submit P1's election (or request from P1's account) is refused with ERR_RESOURCE_OWNERSHIP_MISMATCH even though Participant is the correct role."
        test_recipe:
          setup: ["ACTIVE plan, fund, OPEN window 2027 (clock 2026-10-15); participants P1 and P2; P1 has a DRAFT election and an account"]
          setup_api_calls:
            - call: "POST /api/plans"
