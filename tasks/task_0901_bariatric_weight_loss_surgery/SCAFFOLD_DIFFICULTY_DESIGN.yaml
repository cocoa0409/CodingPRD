  - rule_id: compensating_invariant
    instances:
      - name: cancellation_refund_money_conservation
        grounds:
          - calculations.cancellation_refund
          - state_machines.SurgeryCase.SCHEDULED_to_CANCELLED
          - entities.Program.fields.amount_collected_cents
          - entities.Program.fields.amount_refunded_cents
          - entities.Program.fields.amount_forfeited_cents
        distinguishing_aspect: "Conserved quantity = MONEY: after a self-pay surgery is cancelled, amount_refunded_cents (300000) + amount_forfeited_cents (100000) == amount_collected_cents (400000); the forward deposit collection and the compensating cancel leave the collected total fully accounted."
        test_recipe:
          setup:
            - "SELF_PAY female 170/120 program CLEARED with an ACTIVE financing plan (down_payment 400000 collected) and a SCHEDULED surgery."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-INV-1", full_name: "Inv One", date_of_birth: "1982-02-02", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
