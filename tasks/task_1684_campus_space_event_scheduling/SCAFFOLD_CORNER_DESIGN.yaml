scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: org_create_computed_standing_input_ignored
        claim_type: computed_fields
        grounds: [entities.Organization.fields.standing, entities.Organization.fields.no_show_count]
        distinguishing_aspect: "Client-supplied standing is ignored; server derives GOOD with all counters 0."
        test_recipe:
          setup: ["No orgs exist"]
          setup_api_calls: []
          trigger:
            - { call: "POST /campus/organizations", payload: { name: "Econ Dept", org_type: "INTERNAL_DEPARTMENT", contact_email: "econ@univ.edu", standing: "SUSPENDED" }, as: Scheduler, captures: { org_id: $.data.id } }
          assert:
            - "Organization.${org_id}.standing == GOOD (input ignored)"
            - "no_show_count == 0 and deposit_held_cents == 0 and outstanding_balance_cents == 0"
            - "version == 1"

      - name: room_create_applies_inventory_defaults
        claim_type: defaults
        grounds: [entities.Room.fields.turnaround_buffer_minutes, entities.Room.fields.peak_multiplier_bps]
        distinguishing_aspect: "Omitting optional room fields yields buffer 30, peak multiplier 12500, features [], key_count 0, status ACTIVE."
        test_recipe:
          setup: ["No rooms exist"]
          setup_api_calls: []
          trigger:
            - { call: "POST /campus/rooms", payload: { name: "DEF-1", building_code: "DEF", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id } }
          assert:
            - "Room.${room_id}.turnaround_buffer_minutes == 30 and peak_multiplier_bps == 12500"
            - "features == [] and key_count == 0 and keys_issued == 0 and keys_lost_total == 0"
            - "status == ACTIVE and outage_windows == []"

      - name: event_create_mints_system_fields_and_decision_deadline
        claim_type: system_fields
        grounds: [entities.EventReservation.fields.decision_deadline, entities.EventReservation.fields.precedence_tier]
        distinguishing_aspect: "created_at equals the logical clock default 2026-08-01T00:00:00Z, version 1, decision_deadline exactly +72h, precedence_tier 200 for INTERNAL_DEPARTMENT."
        test_recipe:
          setup: ["Org and room exist; clock untouched (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept A", org_type: "INTERNAL_DEPARTMENT", contact_email: "a@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "SYS-1", building_code: "SYS", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
          trigger:
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Sys", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
          assert:
            - "EventReservation.${ev_id}.created_at == 2026-08-01T00:00:00Z (logical clock, not wall clock)"
            - "version == 1 and status == REQUESTED"
            - "decision_deadline == 2026-08-04T00:00:00Z and precedence_tier == 200"
            - "Room.${room_id}.version == 2 (reservation create bumps the OCC parent's version)"

      - name: room_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent room id yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /campus/rooms/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND with http 404"

      - name: access_grant_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.AccessGrant.fields.grant_type]
        distinguishing_aspect: "grant_type outside PHYSICAL_KEY|CARD_ACCESS is rejected ERR_INVALID_REQUEST before any state is created."
        test_recipe:
          setup: ["Org, room, and a REQUESTED event exist"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept B", org_type: "INTERNAL_DEPARTMENT", contact_email: "b@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "ENM-1", building_code: "ENM", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
          trigger:
            - { call: "POST /campus/access-grants", payload: { event_id: "${ev_id}", grant_type: "MAGIC_KEY" }, as: FacilitiesManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST with http 400; no AccessGrant persisted (list for event is empty)"

      - name: event_list_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, "endpoints[GET /campus/event-reservations]"]
        distinguishing_aspect: "limit/offset windowing over 3 events: page 1 has_more true, page at offset 2 returns exactly 1 item with has_more false; total_count stays 3."
        test_recipe:
          setup: ["One org, one room, three REQUESTED events on 2026-09-14/15/16"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept C", org_type: "INTERNAL_DEPARTMENT", contact_email: "c@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "PAG-1", building_code: "PAG", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "P1", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "P2", expected_attendance: 5, start_at: "2026-09-15T14:00:00Z", end_at: "2026-09-15T15:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v3: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "P3", expected_attendance: 5, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${room_v3}" }, as: OrgRequester, as_user_id: "${org_id}" }
          trigger:
            - { call: "GET /campus/event-reservations", payload: { limit: 2, offset: 0 }, as: Scheduler }
            - { call: "GET /campus/event-reservations", payload: { limit: 2, offset: 2 }, as: Scheduler }
          assert:
            - "page 1: response_type == array, total_count == 3, has_more == true, 2 items"
            - "page 2: total_count == 3, has_more == false, exactly 1 item"

      - name: org_requester_reads_scoped_to_own_org
        claim_type: retrieval
        grounds: ["validations[priority=3]", roles.OrgRequester]
        distinguishing_aspect: "OrgRequester reading another org's event gets masked 404 (not 403); the list endpoint silently contains only own-org rows."
        test_recipe:
          setup: ["Org A with one REQUESTED event; org B with none"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Org A", org_type: "INTERNAL_DEPARTMENT", contact_email: "a@univ.edu" }, as: Scheduler, captures: { org_a: $.data.id } }
            - { call: "POST /campus/organizations", payload: { name: "Org B", org_type: "STUDENT_GROUP", contact_email: "b@univ.edu" }, as: Scheduler, captures: { org_b: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "SCO-1", building_code: "SCO", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "A's event", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_a}", captures: { ev_id: $.data.id } }
          trigger:
            - { call: "GET /campus/event-reservations/${ev_id}", payload: {}, as: OrgRequester, as_user_id: "${org_b}", captures: { err: $.data.error_id } }
            - { call: "GET /campus/event-reservations", payload: {}, as: OrgRequester, as_user_id: "${org_b}" }
            - { call: "GET /campus/event-reservations", payload: {}, as: OrgRequester, as_user_id: "${org_a}" }
          assert:
            - "${err} == ERR_NOT_FOUND (existence masked cross-org)"
            - "Org B list total_count == 0; Org A list total_count == 1"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: decline_after_approve_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.EventReservation.REQUESTED_to_DECLINED]
        distinguishing_aspect: "decline is defined only from REQUESTED; from APPROVED it fails and leaves the event APPROVED."
        test_recipe:
          setup: ["Org, room, APPROVED event"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept D", org_type: "INTERNAL_DEPARTMENT", contact_email: "d@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "DEC-1", building_code: "DEC", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/decline", payload: { reason: "late" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE and EventReservation.${ev_id}.status == APPROVED"

      - name: cancel_completed_event_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.EventReservation]
        distinguishing_aspect: "COMPLETED is terminal: cancel afterwards fails and the FINALIZED invoice is untouched."
        test_recipe:
          setup: ["INTERNAL event driven to COMPLETED (approve, confirm, check-in, daily-close past end)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept E", org_type: "INTERNAL_DEPARTMENT", contact_email: "e@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "CMP-1", building_code: "CMP", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T13:45:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/check-in", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T16:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/cancel", payload: {}, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE and EventReservation.${ev_id}.status == COMPLETED"
            - "Invoice for ${ev_id} remains FINALIZED with total_cents == 1000 (1 off-peak bucket at 1000)"

      - name: rebook_cancelled_event_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.EventReservation.BUMPED_to_APPROVED]
        distinguishing_aspect: "rebook accepts only BUMPED; a cancelled REQUESTED event (fee 0, no invoice ever created) cannot be rebooked."
        test_recipe:
          setup: ["Org, room; event cancelled while still REQUESTED"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept F", org_type: "INTERNAL_DEPARTMENT", contact_email: "f@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "RBK-1", building_code: "RBK", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/cancel", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/rebook", payload: { room_id: "${room_id}" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE and EventReservation.${ev_id}.status == CANCELLED and cancellation_fee_cents == 0"
            - "No invoice exists for ${ev_id} (cancelling REQUESTED creates none)"

      - name: create_initial_states_across_entities
        claim_type: initial_state
        grounds: [state_machines.AcademicBlock, state_machines.SchedulingRun, state_machines.AccessGrant, state_machines.Invoice]
        distinguishing_aspect: "Fresh entities land in their declared initial states: block UNPLACED with computed score, run DRAFT, grant REQUESTED with return_deadline == end+24h, invoice PROVISIONAL upon approve."
        test_recipe:
          setup: ["Term, org, room exist; event approved; grant requested; run created"]
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id, term_v: $.data.version } }
            - { call: "POST /campus/academic-blocks", payload: { term_id: "${term_id}", course_code: "ART-110", instructor_name: "Dr. B", enrollment: 95, days_of_week: ["TUE"], start_time: "11:00", end_time: "12:15", required_features: ["PROJECTOR", "VIDEO_CONF"] }, as: Scheduler, captures: { blk_id: $.data.id, blk_score: $.data.priority_score } }
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v}" }, as: Scheduler, captures: { run_id: $.data.id } }
            - { call: "POST /campus/organizations", payload: { name: "Dept G", org_type: "INTERNAL_DEPARTMENT", contact_email: "g@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "INI-1", building_code: "INI", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/access-grants", payload: { event_id: "${ev_id}", grant_type: "CARD_ACCESS" }, as: OrgRequester, as_user_id: "${org_id}", captures: { grant_id: $.data.id, grant_deadline: $.data.return_deadline } }
          trigger:
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_status: "$.data[0].status" } }
          assert:
            - "AcademicBlock.${blk_id}.status == UNPLACED and ${blk_score} == 980"
            - "SchedulingRun.${run_id}.status == DRAFT"
            - "AccessGrant.${grant_id}.status == REQUESTED and ${grant_deadline} == 2026-09-15T15:00:00Z (end 15:00 + 24h)"
            - "${inv_status} == PROVISIONAL"

      - name: second_checkin_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.EventReservation.CONFIRMED_to_IN_PROGRESS]
        distinguishing_aspect: "Check-in is not idempotent: the second attempt from IN_PROGRESS fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["CONFIRMED event at 2026-09-14 14:00; clock inside the check-in window"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept H", org_type: "INTERNAL_DEPARTMENT", contact_email: "h@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "CHK-1", building_code: "CHK", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T14:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/check-in", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/check-in", payload: {}, as: FacilitiesManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE and checked_in_at remains the first timestamp"

      - name: room_auto_returns_to_service_after_outage
        claim_type: valid_transition
        grounds: [state_machines.Room.OUT_OF_SERVICE_to_ACTIVE]
        distinguishing_aspect: "daily-close returns the room to ACTIVE once now >= outage_end_at and preserves the window in outage_windows."
        test_recipe:
          setup: ["Room taken OUT_OF_SERVICE over 2026-08-05..2026-08-07 (no events)"]
          setup_api_calls:
            - { call: "POST /campus/rooms", payload: { name: "OUT-1", building_code: "OUT", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id } }
            - { call: "POST /campus/rooms/${room_id}/out-of-service", payload: { outage_start_at: "2026-08-05T00:00:00Z", outage_end_at: "2026-08-07T00:00:00Z" }, as: FacilitiesManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler, captures: { returned: $.data.rooms_returned } }
          assert:
            - "${returned} == 1 and Room.${room_id}.status == ACTIVE"
            - "outage_start_at == null and outage_windows has exactly 1 entry [2026-08-05, 2026-08-07)"

      - name: term_status_auto_advances_on_daily_close
        claim_type: valid_transition
        grounds: [state_machines.TermWindow]
        distinguishing_aspect: "Term flips DRAFT->SCHEDULING exactly at priority_open_at (>= boundary), ->GENERAL exactly at general_open_at, ->CLOSED once past term_end_date + 1 day."
        test_recipe:
          setup: ["Term Fall 2026 (priority 2026-08-10, general 2026-09-01, end 2026-12-15)"]
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler, captures: { adv1: $.data.terms_advanced } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { st2: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { st3: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-17T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { st4: $.data.status } }
          assert:
            - "${adv1} == 0 and status stayed DRAFT at 2026-08-09"
            - "${st2} == SCHEDULING (exactly at priority_open_at)"
            - "${st3} == GENERAL (exactly at general_open_at)"
            - "${st4} == CLOSED"

      - name: unplace_leaves_bumped_events_bumped
        claim_type: side_effect_execution
        grounds: [state_machines.AcademicBlock.PLACED_to_UNPLACED]
        distinguishing_aspect: "Unplacing a block frees the room but performs NO retroactive restore — the previously bumped event remains BUMPED and must be rebooked explicitly."
        test_recipe:
          setup: ["Term SCHEDULING; room STAGE cap 100; REQUESTED event 2026-10-05 10:00-11:00; block enrollment 90 STAGE MON 10:00-11:00; run finalized (event bumped, block placed)"]
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id } }
            - { call: "POST /campus/organizations", payload: { name: "Dept I", org_type: "INTERNAL_DEPARTMENT", contact_email: "i@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "UNP-1", building_code: "UNP", capacity: 100, features: ["STAGE"], internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/academic-blocks", payload: { term_id: "${term_id}", course_code: "ENG-300", instructor_name: "Dr. Z", enrollment: 90, days_of_week: ["MON"], start_time: "10:00", end_time: "11:00", required_features: ["STAGE"] }, as: Scheduler, captures: { blk_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 50, start_at: "2026-10-05T10:00:00Z", end_at: "2026-10-05T11:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { term_v: $.data.version } }
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v}" }, as: Scheduler, captures: { run_id: $.data.id } }
            - { call: "POST /campus/scheduling-runs/${run_id}/finalize", payload: {}, as: Scheduler }
          trigger:
            - { call: "POST /campus/academic-blocks/${blk_id}/unplace", payload: {}, as: Scheduler }
          assert:
            - "AcademicBlock.${blk_id}.status == UNPLACED and assigned_room_id == null"
            - "EventReservation.${ev_id}.status == BUMPED (no retroactive restore) and room_id == null"

      - name: request_expires_after_decision_deadline
        claim_type: valid_transition
        grounds: [state_machines.EventReservation.REQUESTED_to_EXPIRED]
        distinguishing_aspect: "A REQUESTED event whose decision_deadline passes with no decision becomes EXPIRED at the next daily-close."
        test_recipe:
          setup: ["Event created at clock 2026-08-01 (decision_deadline 2026-08-04); clock advanced to 2026-08-05"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept J", org_type: "INTERNAL_DEPARTMENT", contact_email: "j@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "EXP-1", building_code: "EXP", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler, captures: { expired: $.data.requests_expired } }
          assert:
            - "${expired} == 1 and EventReservation.${ev_id}.status == EXPIRED"

      - name: approval_expiry_voids_provisional_invoice
        claim_type: side_effect_execution
        grounds: [state_machines.EventReservation.APPROVED_to_EXPIRED, state_machines.Invoice.PROVISIONAL_to_VOIDED]
        distinguishing_aspect: "An APPROVED event not confirmed within 48h expires at daily-close and its PROVISIONAL invoice is voided."
        test_recipe:
          setup: ["Event approved at clock 2026-08-01 (confirm_deadline 2026-08-03); clock advanced to 2026-08-04"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept K", org_type: "INTERNAL_DEPARTMENT", contact_email: "k@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "APX-1", building_code: "APX", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler, captures: { expired: $.data.approvals_expired } }
          assert:
            - "${expired} == 1 and EventReservation.${ev_id}.status == EXPIRED"
            - "Invoice.${inv_id}.status == VOIDED"

      - name: grant_goes_overdue_and_late_return_forfeits_half
        claim_type: valid_transition
        grounds: [state_machines.AccessGrant.ISSUED_to_OVERDUE, state_machines.AccessGrant.OVERDUE_to_RETURNED, calculations.deposit_refund]
        distinguishing_aspect: "An ISSUED key past event.end+24h flips OVERDUE at daily-close; a late return forfeits exactly half (3750 of 7500) which lands on the already-FINALIZED no-show invoice (total 18750)."
        test_recipe:
          setup: ["CONFIRMED event 2026-09-16 14:00-16:00 (INTERNAL, room 2 buckets x 5000); key grant issued at clock 2026-08-01; clock advanced past return_deadline 2026-09-17T16:00"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept L", org_type: "INTERNAL_DEPARTMENT", contact_email: "l@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "OVD-1", building_code: "OVD", capacity: 10, key_count: 1, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/access-grants", payload: { event_id: "${ev_id}", grant_type: "PHYSICAL_KEY" }, as: FacilitiesManager, captures: { grant_id: $.data.id } }
            - { call: "POST /campus/access-grants/${grant_id}/issue", payload: {}, as: FacilitiesManager }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-18T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler, captures: { overdue: $.data.grants_overdue, noshows: $.data.no_shows_marked } }
            - { call: "GET /campus/invoices/${inv_id}", payload: {}, as: FinanceAdmin, captures: { tot_mid: $.data.total_cents } }
          trigger:
            - { call: "POST /campus/access-grants/${grant_id}/return", payload: {}, as: FacilitiesManager, captures: { forfeit: $.data.deposit_forfeit_cents } }
            - { call: "GET /campus/invoices/${inv_id}", payload: {}, as: FinanceAdmin, captures: { tot_end: $.data.total_cents, dep_chg: $.data.deposit_charge_cents } }
          assert:
            - "${overdue} == 1 and ${noshows} == 1 (never checked in -> NO_SHOW in the same close)"
            - "${tot_mid} == 15000 (no-show final: room 10000 + flat 5000, deposit not yet forfeited)"
            - "${forfeit} == 3750 (round_half_up(7500 * 0.5) late return)"
            - "${tot_end} == 18750 and ${dep_chg} == 3750 (forfeit accrues onto the FINALIZED invoice)"
            - "Organization.${org_id}.deposit_held_cents == 0 and Room.${room_id}.keys_issued == 0"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: noshow_final_invoice_composition_external
        claim_type: correct_result
        grounds: [calculations.final_invoice_total, state_machines.EventReservation.CONFIRMED_to_NO_SHOW]
        distinguishing_aspect: "EXTERNAL no-show final invoice = room 12000 + fulfilled order 4000 + flat 5000 = 21000 with insurance_surcharge_cents == 0 — the surcharge is pinned OFF for no-show outcomes even though the provisional carried 320."
        test_recipe:
          setup:
            - "EXTERNAL org with valid insurance; room external 12000; event 2026-09-10 16:00-17:00 (1 off-peak bucket); CATERING order qty 1 at 4000 quoted, approved, scheduled, fulfilled; event never checked in"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "CaterCo Client", org_type: "EXTERNAL", contact_email: "cc@ext.org", insurance_certificate_expiry: "2026-12-31T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "NSH-1", building_code: "NSH", capacity: 40, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Gala", expected_attendance: 30, start_at: "2026-09-10T16:00:00Z", end_at: "2026-09-10T17:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "CATERING", quantity: 1, service_start_at: "2026-09-10T15:30:00Z", service_end_at: "2026-09-10T16:30:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so_id: $.data.id } }
            - { call: "POST /campus/service-orders/${so_id}/quote", payload: { unit_cost_cents: 4000 }, as: ServiceCoordinator }
            - { call: "POST /campus/service-orders/${so_id}/approve", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/service-crews", payload: { name: "Cater One", category: "CATERING", concurrent_capacity: 1, shift_start: "08:00", shift_end: "20:00" }, as: ServiceCoordinator, captures: { crew_id: $.data.id } }
            - { call: "POST /campus/service-orders/${so_id}/schedule", payload: { crew_id: "${crew_id}" }, as: ServiceCoordinator }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id", prov_total: "$.data[0].total_cents", prov_sur: "$.data[0].insurance_surcharge_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T17:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/service-orders/${so_id}/fulfill", payload: {}, as: ServiceCoordinator }
          trigger:
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
          assert:
            - "${prov_total} == 16320 and ${prov_sur} == 320 (provisional variant included the surcharge)"
            - "EventReservation.${ev_id}.status == NO_SHOW (now 17:00 > check-in deadline 16:15, never checked in)"
            - "Invoice.${inv_id}.status == FINALIZED and room_charge_cents == 12000 and service_charge_cents == 4000"
            - "Invoice.${inv_id}.insurance_surcharge_cents == 0 and no_show_fee_cents == 5000 and total_cents == 21000"
            - "ServiceOrder.${so_id}.status == INVOICED"
            - "Organization.${org_id}.no_show_count == 1 and standing == GOOD"

      - name: utilization_full_outage_window_null_rate
        claim_type: boundary_edge
        grounds: [calculations.utilization_bps]
        distinguishing_aspect: "When the outage covers the entire query window the denominator is 0 and both utilization_bps fields are null (not 0, not an error) while minutes are still reported."
        test_recipe:
          setup: ["Room out of service for the whole of 2026-09-20; no events"]
          setup_api_calls:
            - { call: "POST /campus/rooms", payload: { name: "OUT-9", building_code: "OUT", capacity: 10, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id } }
            - { call: "POST /campus/rooms/${room_id}/out-of-service", payload: { outage_start_at: "2026-09-20T00:00:00Z", outage_end_at: "2026-09-21T00:00:00Z" }, as: FacilitiesManager }
          trigger:
            - { call: "GET /campus/rooms/${room_id}/utilization", payload: { window_start: "2026-09-20T00:00:00Z", window_end: "2026-09-21T00:00:00Z" }, as: Scheduler, captures: { sched: $.data.scheduled_utilization_bps, out_min: $.data.outage_minutes } }
          assert:
            - "${out_min} == 1440 and window_minutes == 1440"
            - "${sched} == null and realized_utilization_bps == null (denominator 0)"
            - "scheduled_minutes == 0 and realized_minutes == 0"

      - name: utilization_outage_shrinks_denominator
        claim_type: input_set_filtering
        grounds: [calculations.utilization_bps, entities.Room.fields.outage_windows]
        distinguishing_aspect: "A 120-minute outage that does not overlap the event still shrinks the denominator: 210 booked minutes over 1320 available minutes -> 1591 bps, not the 1458 bps a 1440 denominator would give."
        test_recipe:
          setup: ["APPROVED event 2026-09-10 16:00-18:30 setup/teardown 30 (booked 15:30-19:00 = 210 min); outage 2026-09-10 08:00-10:00"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept M", org_type: "INTERNAL_DEPARTMENT", contact_email: "m@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "UTI-1", building_code: "UTI", capacity: 80, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 40, start_at: "2026-09-10T16:00:00Z", end_at: "2026-09-10T18:30:00Z", setup_minutes: 30, teardown_minutes: 30, expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/rooms/${room_id}/out-of-service", payload: { outage_start_at: "2026-09-10T08:00:00Z", outage_end_at: "2026-09-10T10:00:00Z" }, as: FacilitiesManager }
          trigger:
            - { call: "GET /campus/rooms/${room_id}/utilization", payload: { window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z" }, as: Scheduler, captures: { bps: $.data.scheduled_utilization_bps, out_min: $.data.outage_minutes, sched_min: $.data.scheduled_minutes } }
          assert:
            - "${out_min} == 120 and ${sched_min} == 210"
            - "${bps} == 1591 (round_half_up(10000 * 210 / 1320)); denominator excludes outage minutes"
            - "EventReservation.${ev_id}.status == APPROVED (outage did not overlap its occupancy 15:30-19:30, so no bump)"

      - name: cancel_fee_full_tier_under_24h
        claim_type: boundary_edge
        grounds: [calculations.cancellation_fee]
        excluded_because:
          difficulty_instance: invoice_ledger_conservation_across_cancel_pay_refund
          rationale: "That instance cancels E2 at exactly 1h notice and asserts cancellation_fee_cents == 10000 (100% tier) on the FINALIZED invoice."

      - name: internal_org_pays_no_insurance_surcharge
        claim_type: conditional_validation
        grounds: [calculations.final_invoice_total]
        excluded_because:
          difficulty_instance: invoice_provisional_includes_quoted_but_final_excludes
          rationale: "That instance asserts insurance_surcharge_cents == 0 for an INTERNAL event's provisional invoice (16000 total with no surcharge)."

      - name: key_slot_lowest_free_assignment
        claim_type: correct_result
        grounds: [entities.AccessGrant.fields.key_slot]
        excluded_because:
          difficulty_instance: key_inventory_conservation_across_issue_return_lost
          rationale: "That instance asserts slots 1 then 2, the freed slot 1 reuse by the third grant, and slot 2 retirement after LOST."

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: attendance_equals_capacity_allowed_exceeds_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAPACITY_EXCEEDED]", entities.EventReservation.fields.expected_attendance]
        distinguishing_aspect: "Headcount boundary on the create endpoint: expected_attendance == capacity (30) is accepted; 31 is rejected — the check is <=, inclusive."
        test_recipe:
          setup: ["Org; room capacity 30"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept N", org_type: "INTERNAL_DEPARTMENT", contact_email: "n@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "CAP-1", building_code: "CAP", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
          trigger:
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "At cap", expected_attendance: 30, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Over cap", expected_attendance: 31, start_at: "2026-09-15T14:00:00Z", end_at: "2026-09-15T15:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
          assert:
            - "EventReservation.${ev_id} created (201) at exactly capacity"
            - "${err} == ERR_CAPACITY_EXCEEDED with http 422; no second event persisted"

      - name: required_features_not_subset_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_FEATURE_MISMATCH]"]
        distinguishing_aspect: "An event requiring PIANO on a room without PIANO fails ERR_FEATURE_MISMATCH at create; same-day retry after a room PATCH adding PIANO succeeds (conditional validation on entity config)."
        test_recipe:
          setup: ["Org; room with features [PROJECTOR]"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept O", org_type: "INTERNAL_DEPARTMENT", contact_email: "o@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "FEA-1", building_code: "FEA", capacity: 30, features: ["PROJECTOR"], internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
          trigger:
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Recital", expected_attendance: 10, required_features: ["PIANO"], start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
            - { call: "PATCH /campus/rooms/${room_id}", payload: { features: ["PROJECTOR", "PIANO"] }, as: FacilitiesManager, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Recital", expected_attendance: 10, required_features: ["PIANO"], start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
          assert:
            - "${err} == ERR_FEATURE_MISMATCH (http 422)"
            - "after PATCH: EventReservation.${ev_id} created (201)"

      - name: end_not_after_start_returns_invalid_time_range
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "end_at == start_at is rejected (strictly-greater semantics), as is a reversed range."
        test_recipe:
          setup: ["Org; room"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept P", org_type: "INTERNAL_DEPARTMENT", contact_email: "p@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "TIM-1", building_code: "TIM", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
          trigger:
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Zero", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T14:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_TIME_RANGE (http 422); nothing persisted"

      - name: duration_bounds_thirty_minutes_eight_hours
        claim_type: boundary_edge
        grounds: ["errors[ERR_DURATION_OUT_OF_RANGE]"]
        distinguishing_aspect: "Duration bounds are inclusive: exactly 30 minutes and exactly 8 hours are accepted; 29 minutes and 8h01m are rejected with ERR_DURATION_OUT_OF_RANGE."
        test_recipe:
          setup: ["Org; room (buffer 0 so the two accepted events on adjacent days never interact)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Q", org_type: "INTERNAL_DEPARTMENT", contact_email: "q@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "DUR-1", building_code: "DUR", capacity: 30, turnaround_buffer_minutes: 0, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
          trigger:
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "29min", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T14:29:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { err29: $.data.error_id } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "30min", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T14:30:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ok30: $.data.id } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "8h01m", expected_attendance: 5, start_at: "2026-09-15T08:00:00Z", end_at: "2026-09-15T16:01:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { err481: $.data.error_id } }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "8h", expected_attendance: 5, start_at: "2026-09-16T08:00:00Z", end_at: "2026-09-16T16:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ok480: $.data.id } }
          assert:
            - "${err29} == ERR_DURATION_OUT_OF_RANGE and ${err481} == ERR_DURATION_OUT_OF_RANGE"
            - "EventReservation.${ok30} and .${ok480} created (201) — both bounds inclusive"

      - name: approve_during_priority_window_locked_then_general_allows
        claim_type: temporal_validation
        grounds: ["errors[ERR_TERM_PRIORITY_LOCKED]", state_machines.EventReservation.REQUESTED_to_APPROVED]
        distinguishing_aspect: "Approving an event whose dates fall inside a SCHEDULING term is rejected ERR_TERM_PRIORITY_LOCKED; the same operation on a fresh request succeeds once the term reaches GENERAL."
        test_recipe:
          setup: ["Term Fall 2026 flipped to SCHEDULING at clock 2026-08-12; event for 2026-09-14 created fresh (decision_deadline 2026-08-15, so it survives the close)"]
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id } }
            - { call: "POST /campus/organizations", payload: { name: "Dept R", org_type: "INTERNAL_DEPARTMENT", contact_email: "r@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "PRI-1", building_code: "PRI", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Early", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev1: $.data.id } }
          trigger:
            - { call: "POST /campus/event-reservations/${ev1}/approve", payload: {}, as: Scheduler, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Late", expected_attendance: 5, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev2: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev2}/approve", payload: {}, as: Scheduler }
          assert:
            - "${err} == ERR_TERM_PRIORITY_LOCKED (http 409) and EventReservation.${ev1}.status == REQUESTED"
            - "after GENERAL: EventReservation.${ev2}.status == APPROVED"

