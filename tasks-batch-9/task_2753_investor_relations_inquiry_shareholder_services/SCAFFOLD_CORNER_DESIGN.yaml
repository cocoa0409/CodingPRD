        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[position-update-stale-company]
          - endpoints[PATCH /contacts/{id}/position]
          - errors[ERR_STALE_COMPANY_VERSION]
        distinguishing_aspect: "A threat-level servicing call bumps the issuer row as a side effect, so a position write carrying the previously read expected_company_version is refused with ERR_STALE_COMPANY_VERSION (412) even though the posture never changed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
