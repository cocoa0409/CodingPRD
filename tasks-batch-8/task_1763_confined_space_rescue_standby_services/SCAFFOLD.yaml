# =============================================================================
# Task 1763: Confined-Space & Rescue-Standby Services (industrial rescue contractor)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: "Confined-Space & Rescue-Standby Services (industrial rescue contractor): space classification & entry permit, atmospheric monitoring & continuous log, attendant/entrant roster & rotation, rescue plan & team standby staffing, ventilation/blind-flange isolation verification, permit cancellation & re-entry conditions, hourly standby vs event billing, incident escalation"

domain_name: confined-space-rescue-standby
api_prefix: /rescue-ops

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid          # client→space→permit tree + cross-cutting FKs to Personnel + self-referential roster relief
  state_machine_shape: cyclic      # permit suspend/resume loop, incident reopen loop, statement dispute loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential             # RosterEntry.relief_of_entry_id
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Personnel
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Worker full name" }
      - { name: role_qualifications, type: array, source: input, description: "Qualification enum members: ENTRY_SUPERVISOR | ATTENDANT | RESCUE_LEAD | SAFETY_OFFICER | RESCUER. Entity-backed API roles resolve X-User-ID to a Personnel row holding the matching qualification." }
      - { name: certifications, type: array, source: input, default: [], description: "Certification enum members: CONFINED_SPACE_RESCUE | HIGH_ANGLE | HAZMAT | MEDIC" }
      - { name: max_duty_hours, type: integer, source: input, default: 12, description: "Maximum length of a single scheduled roster shift, in whole hours" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE. Only ACTIVE personnel may be scheduled or act via entity-backed roles." }
      - { name: committed_standby_minutes, type: integer, source: computed, default: 0, description: "Sum of (standby_end_at - standby_start_at) minutes over this rescuer's StandbyAssignments with status in {SCHEDULED, ON_STANDBY, DEPLOYED}. RELEASED / CANCELLED / NO_SHOW contribute 0." }

  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client facility operator name" }
      - { name: billing_mode, type: enum, source: input, description: "HOURLY_STANDBY | EVENT. Selects which billing calculation variant applies to this account." }
      - { name: hourly_standby_rate_cents, type: integer, source: input, description: "Base hourly rate for standby time (HOURLY_STANDBY mode)" }
      - { name: event_base_fee_cents, type: integer, source: input, description: "Flat fee per activated permit (EVENT mode); also the base for cancellation fees in both modes" }
      - { name: event_per_rescuer_cents, type: integer, source: input, description: "Per-rescuer fee for each standby assignment with ON_STANDBY time in the period (EVENT mode)" }
      - { name: deployment_surcharge_cents, type: integer, source: input, default: 50000, description: "Flat surcharge per standby assignment that reached DEPLOYED before release (both billing modes)" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit ceiling; account goes on credit hold when balance_cents >= credit_limit_cents" }
      - { name: minimum_billable_hours, type: number, source: input, default: 4, description: "Floor applied per standby assignment when billing hourly" }
      - { name: tier1_hours_threshold, type: number, source: input, default: 8, description: "Chargeable hours up to this many bill at base rate; hours beyond bill at tier2_multiplier" }
      - { name: tier2_multiplier, type: number, source: input, default: 1.5, description: "Marginal multiplier applied to chargeable hours beyond tier1_hours_threshold" }
      - { name: after_hours_multiplier, type: number, source: input, default: 1.5, description: "Applied to the whole assignment when checked_in_at hour (UTC) is < 7 or >= 19 and the day is not Sat/Sun" }
      - { name: weekend_multiplier, type: number, source: input, default: 2.0, description: "Applied to the whole assignment when checked_in_at falls on Saturday or Sunday (UTC). Takes precedence over after_hours_multiplier; the two never stack." }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Always equals the sum of billed_balance_contribution_cents over all of the account's BillingStatements" }
      - { name: on_credit_hold, type: boolean, source: computed, default: false, description: "True iff balance_cents >= credit_limit_cents (boundary is inclusive)" }

  - name: ConfinedSpace
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_account_id, type: string, source: system, description: "FK -> ClientAccount.id; owning account (from path)" }
      - { name: space_code, type: string, source: input, description: "Client-side identifier for the physical space" }
      - { name: classification, type: enum, source: input, description: "NON_PERMIT | PERMIT_REQUIRED | PERMIT_REQUIRED_HAZARDOUS. EntryPermits may only be created for PERMIT_REQUIRED*" }
      - { name: requires_continuous_monitoring, type: boolean, source: input, description: "When true, an ACTIVE permit on this space auto-suspends if the gap since the last CONTINUOUS reading exceeds 15 minutes" }
      - { name: max_entrants, type: integer, source: input, description: "Maximum number of RosterEntries with assignment_role ENTRANT in ON_DUTY status at any one moment on permits of this space; rejected at check-in when count already >= max_entrants" }
      - { name: ventilation_required, type: boolean, source: input, description: "When true, permit activation/resume requires an unexpired VERIFIED IsolationVerification of type VENTILATION" }
      - { name: blind_flange_required, type: boolean, source: input, description: "When true, permit activation/resume requires an unexpired VERIFIED IsolationVerification of type BLIND_FLANGE" }
      - { name: exposure_standard, type: enum, source: input, description: "TWA8 | PEAK_CEILING. Selects which entrant exposure calculation variant applies to roster entries on permits of this space." }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | OUT_OF_SERVICE" }

  - name: RescuePlan
    parent: ConfinedSpace
    common_fields: true
    fields:
      - { name: space_id, type: string, source: system, description: "FK -> ConfinedSpace.id; space this plan covers (from path)" }
      - { name: required_team_size, type: integer, source: input, description: "Minimum standby rescuers whose windows cover the activation instant for permit activation" }
      - { name: required_certifications, type: array, source: input, default: [], description: "Certification enum members every standby rescuer on this space must hold" }
      - { name: retrieval_system_type, type: enum, source: input, description: "MECHANICAL_RETRIEVAL | TRIPOD | HORIZONTAL_HAUL | ENTRY_RESCUE" }
      - { name: plan_revision, type: integer, source: computed, description: "Per-space monotonically increasing revision; first plan for a space is 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED" }
      - { name: approved_by, type: string, source: system, description: "FK -> Personnel.id; RescueTeamLead who approved; null until approved" }
      - { name: approved_at, type: datetime, source: system, description: "Logical clock timestamp of approval; null until approved" }

  - name: EntryPermit
    parent: ConfinedSpace
    common_fields: true
    fields:
      - { name: space_id, type: string, source: system, description: "FK -> ConfinedSpace.id; space this permit authorizes entry into (from path)" }
      - { name: client_account_id, type: string, source: system, description: "FK -> ClientAccount.id; denormalized from the space at creation for billing sweeps" }
      - { name: purpose, type: string, source: input, description: "Work description" }
      - { name: planned_start_at, type: datetime, source: input, description: "Planned entry window start (must be strictly before planned_end_at)" }
      - { name: planned_end_at, type: datetime, source: input, description: "Planned entry window end" }
      - { name: issued_by, type: string, source: system, description: "FK -> Personnel.id; EntrySupervisor who issued; null until issued" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock timestamp of issue; null until issued" }
      - { name: actual_entry_at, type: datetime, source: system, description: "Logical clock timestamp of activation; null until ACTIVE" }
      - { name: last_suspended_at, type: datetime, source: system, description: "Logical clock timestamp of the most recent transition into SUSPENDED; null if never suspended" }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock timestamp of closure or cancellation; null until terminal" }
      - { name: close_reason, type: enum, source: system, description: "COMPLETED | CANCELLED | INCIDENT; null until terminal" }
      - { name: suspension_count, type: integer, source: computed, default: 0, description: "Number of transitions into SUSPENDED" }
      - { name: reentry_count, type: integer, source: computed, default: 0, description: "Number of successful SUSPENDED -> ACTIVE resume transitions" }
      - { name: event_base_billed, type: boolean, source: computed, default: false, description: "True once the EVENT_BASE line for this permit has been swept into a statement" }
      - { name: cancellation_fee_billed, type: boolean, source: computed, default: false, description: "True once the CANCELLATION_FEE line for this permit has been swept into a statement" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | ACTIVE | SUSPENDED | CLOSED | CANCELLED" }

  - name: IsolationVerification
    parent: EntryPermit
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> EntryPermit.id; permit this verification belongs to (from path)" }
      - { name: isolation_type, type: enum, source: input, description: "VENTILATION | BLIND_FLANGE | LOCKOUT_TAGOUT" }
      - { name: evidence_ref, type: string, source: input, description: "Free-text evidence reference (photo id, lock serial, etc.)" }
      - { name: created_by, type: string, source: system, description: "Personnel id (from X-User-ID) of the SafetyOfficer who submitted the verification" }
      - { name: verified_by, type: string, source: system, description: "FK -> Personnel.id; SafetyOfficer who verified; null until VERIFIED" }
      - { name: verified_at, type: datetime, source: system, description: "Logical clock timestamp of verification; null until VERIFIED" }
      - { name: expires_at, type: datetime, source: computed, description: "= verified_at + 12 hours; null until VERIFIED. The verification is valid iff now < expires_at." }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | EXPIRED | VOIDED" }

  - name: RosterEntry
    parent: EntryPermit
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> EntryPermit.id; permit this roster slot belongs to (from path)" }
      - { name: personnel_id, type: string, source: input, description: "FK -> Personnel.id; the scheduled worker" }
      - { name: assignment_role, type: enum, source: input, description: "ENTRANT | ATTENDANT" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Scheduled shift start (strictly before scheduled_end_at)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Scheduled shift end; shift length must be <= personnel.max_duty_hours" }
      - { name: relief_of_entry_id, type: string, source: input, description: "FK -> RosterEntry.id; optional self-reference declaring this entry relieves another entry on the same permit with the same assignment_role", default: null }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical clock timestamp of check-in; null until ON_DUTY" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical clock timestamp of check-out / relief / evacuation; null while ON_DUTY" }
      - { name: exposure_twa_ppm, type: number, source: computed, default: 0, description: "Time-weighted average H2S over the duty window, normalized to 480 minutes (see entrant_exposure_classification)" }
      - { name: exposure_peak_ppm, type: number, source: computed, default: 0, description: "Maximum H2S reading recorded during the duty window" }
      - { name: exposure_class, type: enum, source: computed, description: "OK | ACTION | EXCEEDANCE, per the space's exposure_standard variant" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ON_DUTY | RELIEVED | COMPLETED | EVACUATED | NO_SHOW | CANCELLED" }

  - name: AtmosphericReading
    parent: EntryPermit
    common_fields: false
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> EntryPermit.id; permit this reading belongs to (from path)" }
      - { name: recorded_by, type: string, source: system, description: "FK -> Personnel.id; Attendant who recorded the reading (from X-User-ID)" }
      - { name: reading_kind, type: enum, source: input, description: "PRE_ENTRY (allowed while ISSUED or SUSPENDED) | CONTINUOUS (allowed only while ACTIVE)" }
      - { name: o2_pct, type: number, source: input, description: "Oxygen percent; plausible range 0.0–30.0" }
      - { name: lel_pct, type: number, source: input, description: "Percent of lower explosive limit; plausible range 0–100" }
      - { name: h2s_ppm, type: number, source: input, description: "Hydrogen sulfide ppm; plausible range 0–500" }
      - { name: co_ppm, type: number, source: input, description: "Carbon monoxide ppm; plausible range 0–2000" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: within_limits, type: boolean, source: computed, description: "True iff 19.5 <= o2_pct <= 23.5 AND lel_pct <= 10 AND h2s_ppm <= 10 AND co_ppm <= 35 (all bounds inclusive)" }

  - name: StandbyAssignment
    parent: EntryPermit
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> EntryPermit.id; permit this standby window covers (from path)" }
      - { name: rescuer_id, type: string, source: input, description: "FK -> Personnel.id; the standby rescuer" }
      - { name: standby_start_at, type: datetime, source: input, description: "Standby window start (strictly before standby_end_at)" }
      - { name: standby_end_at, type: datetime, source: input, description: "Standby window end" }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical clock timestamp of standby check-in; null until ON_STANDBY" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical clock timestamp of release; null until RELEASED" }
      - { name: deployed_at, type: datetime, source: system, description: "Logical clock timestamp of deployment; null unless DEPLOYED was reached" }
      - { name: billable_minutes, type: integer, source: computed, description: "Quarter-hour-rounded-up billable minutes between checked_in_at and checked_out_at; null until RELEASED" }
      - { name: line_amount_cents, type: integer, source: computed, description: "HOURLY_STANDBY accounts: the full hourly charge for this assignment per standby_line_amount_hourly; null until RELEASED" }
      - { name: billed, type: boolean, source: computed, default: false, description: "True once this assignment has been swept into a BillingStatement line" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ON_STANDBY | DEPLOYED | RELEASED | NO_SHOW | CANCELLED" }

  - name: Incident
    parent: EntryPermit
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> EntryPermit.id; permit this incident occurred under (from path)" }
      - { name: reported_by, type: string, source: system, description: "FK -> Personnel.id; reporter (from X-User-ID)" }
      - { name: severity, type: enum, source: input, description: "MINOR | SERIOUS | CRITICAL" }
      - { name: kind, type: enum, source: input, description: "ENTRAPMENT | ATMOSPHERE | MEDICAL | EQUIPMENT" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: triaged_by, type: string, source: system, description: "Personnel id of triaging SafetyOfficer; null until TRIAGED" }
      - { name: resolved_by, type: string, source: system, description: "Personnel id of resolving SafetyOfficer; null until RESOLVED" }
      - { name: resolution_notes, type: string, source: system, description: "Notes captured at resolve; null until RESOLVED" }
      - { name: escalation_level, type: integer, source: computed, default: 0, description: "Increments by 1 on each TRIAGED -> ESCALATED transition" }
      - { name: status, type: enum, source: system, description: "REPORTED | TRIAGED | ESCALATED | RESOLVED | REOPENED" }

  - name: BillingStatement
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_account_id, type: string, source: system, description: "FK -> ClientAccount.id; owning account (from path)" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end (exclusive); strictly after period_start" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | DISPUTED | PAID | VOID" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over all lines; each line rounded to integer cents BEFORE summing (pinned rounding order)" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Number of StatementLines on this statement" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical clock timestamp of latest finalization; null until first finalize" }
      - { name: billed_balance_contribution_cents, type: integer, source: computed, default: 0, description: "Amount this statement currently contributes to ClientAccount.balance_cents" }

  - name: StatementLine
    parent: BillingStatement
    common_fields: false
    fields:
      - { name: statement_id, type: string, source: system, description: "FK -> BillingStatement.id; owning statement (from path or generation sweep)" }
      - { name: line_kind, type: enum, source: system, description: "STANDBY_HOURLY | EVENT_BASE | EVENT_RESCUER | CANCELLATION_FEE | DEPLOYMENT_SURCHARGE | CREDIT_ADJUSTMENT" }
      - { name: reference_permit_id, type: string, source: system, description: "Permit that generated this line, when applicable (plain reference, not a scoped FK)" }
      - { name: reference_assignment_id, type: string, source: system, description: "StandbyAssignment that generated this line, when applicable (plain reference, not a scoped FK)" }
      - { name: quantity, type: number, source: system, description: "Charged units (hours for STANDBY_HOURLY; 1 for flat lines)" }
      - { name: unit_rate_cents, type: number, source: system, description: "Applied unit rate before per-line rounding" }
      - { name: amount_cents, type: integer, source: computed, description: "round_half_up(quantity * unit_rate_cents * applicable_multiplier) to integer cents; negative for CREDIT_ADJUSTMENT" }
      - { name: description, type: string, source: system, description: "Human-readable line description" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EntryPermit
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /rescue-ops/entry-permits/{id}/issue"
        actor: EntrySupervisor
        preconditions:
          - "Permit in DRAFT (ERR_PERMIT_INVALID_STATE)"
        side_effects:
          - "issued_by = X-User-ID; issued_at = now"

      - from: ISSUED
        to: ACTIVE
        trigger: "POST /rescue-ops/entry-permits/{id}/activate"
        actor: EntrySupervisor
        preconditions:
          - "Permit in ISSUED (ERR_PERMIT_INVALID_STATE)"
          - "Space status == AVAILABLE (ERR_SPACE_OUT_OF_SERVICE)"
          - "An APPROVED RescuePlan exists for the space (ERR_RESCUE_PLAN_NOT_APPROVED)"
          - "For each required isolation type (ventilation_required -> VENTILATION, blind_flange_required -> BLIND_FLANGE): an IsolationVerification of that type in VERIFIED with expires_at > now (ERR_ISOLATION_NOT_VERIFIED)"
          - "Latest PRE_ENTRY reading for the permit exists and has within_limits == true (ERR_ATMOSPHERE_OUT_OF_LIMITS)"
          - "Latest PRE_ENTRY reading recorded_at is <= 30 minutes before now (ERR_PRE_ENTRY_READING_STALE)"
          - "Standby coverage at now (assignments in SCHEDULED or ON_STANDBY whose [standby_start_at, standby_end_at) contains now) >= plan.required_team_size (ERR_RESCUE_TEAM_UNDERSTAFFED)"
          - "planned_start_at <= now <= planned_end_at (ERR_OUTSIDE_PLANNED_WINDOW)"
        side_effects:
          - "actual_entry_at = now"
          - "Permit version increments"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rescue-ops/entry-permits/{id}/suspend (orderly manual stop)"
        actor: EntrySupervisor | SafetyOfficer
        preconditions:
          - "Permit in ACTIVE (ERR_PERMIT_INVALID_STATE)"
          - "No RosterEntry of this permit in ON_DUTY (ERR_ENTRANTS_STILL_INSIDE) — manual suspension is an orderly stop; emergency paths evacuate automatically"
        side_effects:
          - "suspension_count += 1; last_suspended_at = now"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: out-of-limits CONTINUOUS reading posted (alarm), or monitoring-gap sweep fires"
        actor: system
        preconditions:
          - "Permit in ACTIVE"
        side_effects:
          - "suspension_count += 1; last_suspended_at = now"
          - "Every RosterEntry of this permit in ON_DUTY -> EVACUATED, checked_out_at = now (link 2 of the alarm cascade)"
          - "Alarm path only: an Incident is auto-created (kind=ATMOSPHERE, severity CRITICAL if any of o2<16 or o2>25 or lel>=25 or h2s>=20 or co>=100 else SERIOUS, reported_by = reading's recorded_by)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rescue-ops/entry-permits/{id}/resume (re-entry authorization)"
        actor: EntrySupervisor
        preconditions:
          - "Permit in SUSPENDED (ERR_PERMIT_INVALID_STATE)"
          - "An APPROVED RescuePlan exists for the space — a plan SUPERSEDED while suspended fails this check (ERR_RESCUE_PLAN_NOT_APPROVED)"
          - "Required isolation types have VERIFIED verifications with expires_at > now (ERR_ISOLATION_NOT_VERIFIED)"
          - "Latest PRE_ENTRY reading recorded after last_suspended_at exists and is within_limits (ERR_ATMOSPHERE_OUT_OF_LIMITS)"
          - "That reading's recorded_at is <= 30 minutes before now (ERR_PRE_ENTRY_READING_STALE)"
          - "No Incident of this permit in REPORTED | TRIAGED | ESCALATED | REOPENED (ERR_OPEN_INCIDENTS_EXIST)"
        side_effects:
          - "reentry_count += 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /rescue-ops/entry-permits/{id}/close"
        actor: EntrySupervisor
        preconditions:
          - "Permit in ACTIVE or SUSPENDED (ERR_PERMIT_INVALID_STATE)"
          - "No RosterEntry of this permit in ON_DUTY (ERR_ENTRANTS_STILL_INSIDE)"
          - "No Incident of this permit in REPORTED | TRIAGED | ESCALATED | REOPENED (ERR_OPEN_INCIDENTS_EXIST)"
        side_effects:
          - "close_reason = COMPLETED; closed_at = now"
          - "StandbyAssignments in ON_STANDBY -> RELEASED (billable fields computed); in SCHEDULED -> CANCELLED"
          - "RosterEntries in SCHEDULED -> CANCELLED"
          - "IsolationVerifications in PENDING or VERIFIED -> VOIDED"

      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /rescue-ops/entry-permits/{id}/close"
        actor: EntrySupervisor
        preconditions:
          - "Permit in ACTIVE or SUSPENDED (ERR_PERMIT_INVALID_STATE)"
          - "No RosterEntry of this permit in ON_DUTY (ERR_ENTRANTS_STILL_INSIDE)"
          - "No Incident of this permit in REPORTED | TRIAGED | ESCALATED | REOPENED (ERR_OPEN_INCIDENTS_EXIST)"
        side_effects:
          - "close_reason = COMPLETED; closed_at = now"
          - "StandbyAssignments in ON_STANDBY -> RELEASED (billable fields computed); in SCHEDULED -> CANCELLED; DEPLOYED unchanged (must be released explicitly)"
          - "RosterEntries in SCHEDULED -> CANCELLED"
          - "IsolationVerifications in PENDING or VERIFIED -> VOIDED"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /rescue-ops/entry-permits/{id}/cancel, or system supersede when a new permit is created on the same space"
        actor: EntrySupervisor | system
        preconditions:
          - "Permit in DRAFT | ISSUED | ACTIVE | SUSPENDED (ERR_PERMIT_INVALID_STATE)"
        side_effects:
          - "close_reason = CANCELLED (or supersede keeps CANCELLED with close_reason=CANCELLED); closed_at = now"
          - "RosterEntries in SCHEDULED -> CANCELLED"
          - "StandbyAssignments in SCHEDULED -> CANCELLED; in ON_STANDBY -> RELEASED (bill actual time)"
          - "IsolationVerifications in PENDING or VERIFIED -> VOIDED"

      - from: ISSUED
        to: CANCELLED
        trigger: "POST /rescue-ops/entry-permits/{id}/cancel"
        actor: EntrySupervisor
        preconditions:
          - "Permit in DRAFT | ISSUED | ACTIVE | SUSPENDED (ERR_PERMIT_INVALID_STATE)"
        side_effects:
          - "close_reason = CANCELLED; closed_at = now"
          - "RosterEntries in SCHEDULED -> CANCELLED"
          - "StandbyAssignments in SCHEDULED -> CANCELLED; in ON_STANDBY -> RELEASED (bill actual time)"
          - "IsolationVerifications in PENDING or VERIFIED -> VOIDED"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /rescue-ops/entry-permits/{id}/cancel (manual) or incident escalation cascade (system)"
        actor: EntrySupervisor | system
        preconditions:
          - "Manual cancel: no RosterEntry of this permit in ON_DUTY (ERR_ENTRANTS_STILL_INSIDE); incident-escalation path has no such precondition (emergency)"
        side_effects:
          - "close_reason = CANCELLED (manual) or INCIDENT (escalation cascade); closed_at = now"
          - "Manual path: RosterEntries SCHEDULED -> CANCELLED; StandbyAssignments SCHEDULED -> CANCELLED, ON_STANDBY -> RELEASED; IsolationVerifications PENDING|VERIFIED -> VOIDED"
          - "Escalation path: RosterEntries ON_DUTY -> EVACUATED (checked_out_at = now) and SCHEDULED -> CANCELLED; StandbyAssignments ON_STANDBY -> DEPLOYED (deployed_at = now) and SCHEDULED -> CANCELLED; IsolationVerifications PENDING|VERIFIED -> VOIDED"
          - "If the permit had actual_entry_at set, a CANCELLATION_FEE line becomes billable (swept at statement generation)"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /rescue-ops/entry-permits/{id}/cancel (manual) or incident escalation cascade (system)"
        actor: EntrySupervisor | system
        preconditions:
          - "Permit in SUSPENDED (ERR_PERMIT_INVALID_STATE)"
        side_effects:
          - "close_reason = CANCELLED (manual) or INCIDENT (escalation cascade); closed_at = now"
          - "RosterEntries SCHEDULED -> CANCELLED (ON_DUTY cannot exist: alarm/incident suspensions evacuated them; manual suspend required empty)"
          - "StandbyAssignments SCHEDULED -> CANCELLED; ON_STANDBY -> RELEASED on manual path, -> DEPLOYED on escalation path; DEPLOYED unchanged"
          - "IsolationVerifications PENDING|VERIFIED -> VOIDED"
          - "If actual_entry_at set, CANCELLATION_FEE line becomes billable"

  - entity: RescuePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /rescue-ops/rescue-plans/{id}/approve"
        actor: RescueTeamLead
        preconditions:
          - "Plan in DRAFT (ERR_PLAN_INVALID_STATE)"
          - "expected_space_version matches ConfinedSpace.version (ERR_STALE_VERSION)"
        side_effects:
          - "approved_by = X-User-ID; approved_at = now"
          - "Any other plan of the same space in APPROVED -> SUPERSEDED"
          - "ConfinedSpace.version += 1"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a newer RescuePlan is created for the same space"
        actor: system
        preconditions:
          - "Plan in DRAFT"
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a different plan of the same space is approved"
        actor: system
        preconditions:
          - "Plan in APPROVED"
        side_effects:
          - "Permits in ISSUED or SUSPENDED that later attempt activate/resume observe no APPROVED plan until the new plan is approved — the superseding create leaves space without an APPROVED plan if the new plan is still DRAFT"

  - entity: IsolationVerification
    initial_state: PENDING
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /rescue-ops/isolation-verifications/{id}/verify"
        actor: SafetyOfficer
        preconditions:
          - "Verification in PENDING (ERR_VERIFICATION_INVALID_STATE)"
          - "Parent permit in ISSUED or SUSPENDED (ERR_PERMIT_INVALID_STATE)"
          - "X-User-ID != parent permit's issued_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by = X-User-ID; verified_at = now; expires_at = now + 12 hours"

      - from: VERIFIED
        to: EXPIRED
        trigger: "system: clock sweep when now >= expires_at"
        actor: system
        preconditions:
          - "Verification in VERIFIED and now >= expires_at"
        side_effects: []

      - from: PENDING
        to: VOIDED
        trigger: "POST /rescue-ops/isolation-verifications/{id}/void, or cascade from permit close/cancel"
        actor: SafetyOfficer | system
        preconditions:
          - "Verification in PENDING or VERIFIED (ERR_VERIFICATION_INVALID_STATE)"
        side_effects: []

      - from: VERIFIED
        to: VOIDED
        trigger: "POST /rescue-ops/isolation-verifications/{id}/void, or cascade from permit close/cancel"
        actor: SafetyOfficer | system
        preconditions:
          - "Verification in PENDING or VERIFIED (ERR_VERIFICATION_INVALID_STATE)"
        side_effects: []

  - entity: RosterEntry
    initial_state: SCHEDULED
    terminal_states: [RELIEVED, COMPLETED, EVACUATED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ON_DUTY
        trigger: "POST /rescue-ops/roster-entries/{id}/check-in"
        actor: EntrySupervisor
        preconditions:
          - "Entry in SCHEDULED (ERR_ROSTER_INVALID_STATE)"
          - "Parent permit in ACTIVE (ERR_PERMIT_INVALID_STATE)"
          - "scheduled_start_at - 15 minutes <= now (ERR_CHECKIN_WINDOW_NOT_OPEN)"
          - "now <= scheduled_end_at (ERR_CHECKIN_WINDOW_EXPIRED)"
          - "Personnel not ON_DUTY on any other RosterEntry (ERR_PERSONNEL_ALREADY_ON_DUTY)"
          - "If assignment_role == ENTRANT: at least one ATTENDANT RosterEntry of this permit is ON_DUTY (ERR_NO_ATTENDANT_ON_DUTY)"
          - "If assignment_role == ENTRANT: count of ON_DUTY ENTRANT entries of this permit < space.max_entrants (ERR_MAX_ENTRANTS_EXCEEDED)"
          - "If relief_of_entry_id set: target entry is ON_DUTY (ERR_RELIEF_TARGET_NOT_ON_DUTY)"
        side_effects:
          - "checked_in_at = now"
          - "If relief_of_entry_id set: target entry ON_DUTY -> RELIEVED with checked_out_at = this entry's checked_in_at (rotation)"

      - from: ON_DUTY
        to: COMPLETED
        trigger: "POST /rescue-ops/roster-entries/{id}/check-out"
        actor: EntrySupervisor
        preconditions:
          - "Entry in ON_DUTY (ERR_ROSTER_INVALID_STATE)"
          - "If assignment_role == ATTENDANT: no ENTRANT RosterEntry of this permit in ON_DUTY (ERR_ENTRANTS_STILL_INSIDE)"
        side_effects:
          - "checked_out_at = now"
          - "Exposure fields finalized for the duty window"

      - from: ON_DUTY
        to: RELIEVED
        trigger: "system: relief entry checks in (rotation), or exposure_class becomes EXCEEDANCE (auto-relief)"
        actor: system
        preconditions:
          - "Entry in ON_DUTY"
        side_effects:
          - "checked_out_at = trigger timestamp"
          - "Exposure fields finalized for the duty window"

      - from: ON_DUTY
        to: EVACUATED
        trigger: "system: parent permit emergency suspension (alarm / monitoring gap) or incident-escalation cancellation"
        actor: system
        preconditions:
          - "Entry in ON_DUTY"
        side_effects:
          - "checked_out_at = now"
          - "Exposure fields finalized for the duty window"
          - "When any entry of a permit becomes EVACUATED: that permit's StandbyAssignments in ON_STANDBY -> DEPLOYED (link 3 of the alarm cascade)"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system: clock sweep when now > scheduled_start_at + 15 minutes and still SCHEDULED"
        actor: system
        preconditions:
          - "Entry in SCHEDULED and now > scheduled_start_at + 15 minutes"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade from parent permit close/cancel"
        actor: system
        preconditions:
          - "Entry in SCHEDULED"
        side_effects: []

  - entity: StandbyAssignment
    initial_state: SCHEDULED
    terminal_states: [RELEASED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ON_STANDBY
        trigger: "POST /rescue-ops/standby-assignments/{id}/check-in"
        actor: RescueTeamLead
        preconditions:
          - "Assignment in SCHEDULED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "Parent permit in ISSUED | ACTIVE | SUSPENDED (ERR_PERMIT_INVALID_STATE)"
          - "standby_start_at - 30 minutes <= now (ERR_CHECKIN_WINDOW_NOT_OPEN)"
          - "now <= standby_end_at (ERR_CHECKIN_WINDOW_EXPIRED)"
        side_effects:
          - "checked_in_at = now"
          - "Personnel.committed_standby_minutes unchanged (window minutes stay committed while ON_STANDBY)"

      - from: ON_STANDBY
        to: DEPLOYED
        trigger: "system: any RosterEntry of the same permit becomes EVACUATED, or incident-escalation permit cancellation"
        actor: system
        preconditions:
          - "Assignment in ON_STANDBY"
        side_effects:
          - "deployed_at = now"

      - from: ON_STANDBY
        to: RELEASED
        trigger: "POST /rescue-ops/standby-assignments/{id}/release, or cascade from permit close/manual-cancel"
        actor: RescueTeamLead | system
        preconditions:
          - "Assignment in ON_STANDBY or DEPLOYED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "checked_out_at = now; billable_minutes and line_amount_cents computed"
          - "Personnel.committed_standby_minutes -= (standby_end_at - standby_start_at) minutes for this assignment"

      - from: DEPLOYED
        to: RELEASED
        trigger: "POST /rescue-ops/standby-assignments/{id}/release"
        actor: RescueTeamLead
        preconditions:
          - "Assignment in ON_STANDBY or DEPLOYED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "checked_out_at = now; billable_minutes and line_amount_cents computed"
          - "DEPLOYMENT_SURCHARGE line becomes billable for this assignment"
          - "Personnel.committed_standby_minutes -= (standby_end_at - standby_start_at) minutes for this assignment"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system: clock sweep when now > standby_start_at + 15 minutes and still SCHEDULED"
        actor: system
        preconditions:
          - "Assignment in SCHEDULED and now > standby_start_at + 15 minutes"
        side_effects:
          - "Personnel.committed_standby_minutes -= (standby_end_at - standby_start_at) minutes for this assignment"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rescue-ops/standby-assignments/{id}/cancel, or cascade from parent permit cancel"
        actor: RescueTeamLead | system
        preconditions:
          - "Assignment in SCHEDULED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "No charge accrues"
          - "Personnel.committed_standby_minutes -= (standby_end_at - standby_start_at) minutes for this assignment"

  - entity: Incident
    initial_state: REPORTED
    terminal_states: []
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /rescue-ops/incidents/{id}/triage"
        actor: SafetyOfficer
        preconditions:
          - "Incident in REPORTED or REOPENED (ERR_INCIDENT_INVALID_STATE)"
        side_effects:
          - "triaged_by = X-User-ID; severity may be reclassified by optional severity input"

      - from: REOPENED
        to: TRIAGED
        trigger: "POST /rescue-ops/incidents/{id}/triage"
        actor: SafetyOfficer
        preconditions:
          - "Incident in REPORTED or REOPENED (ERR_INCIDENT_INVALID_STATE)"
        side_effects:
          - "triaged_by = X-User-ID"

      - from: TRIAGED
        to: ESCALATED
        trigger: "POST /rescue-ops/incidents/{id}/escalate"
        actor: SafetyOfficer
        preconditions:
          - "Incident in TRIAGED (ERR_INCIDENT_INVALID_STATE)"
        side_effects:
          - "escalation_level += 1"
          - "Parent permit, if in DRAFT | ISSUED | ACTIVE | SUSPENDED, -> CANCELLED with close_reason = INCIDENT (link 1 of the escalation cascade; its own side effects then fire as link 2: roster cancel/evacuate, standby cancel/deploy, verifications VOIDED, CANCELLATION_FEE becomes billable)"
          - "If severity == CRITICAL: parent space -> OUT_OF_SERVICE"

      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /rescue-ops/incidents/{id}/resolve"
        actor: SafetyOfficer
        preconditions:
          - "Incident in TRIAGED or ESCALATED (ERR_INCIDENT_INVALID_STATE)"
          - "X-User-ID != reported_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "resolved_by = X-User-ID; resolution_notes captured"

      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /rescue-ops/incidents/{id}/resolve"
        actor: SafetyOfficer
        preconditions:
          - "Incident in TRIAGED or ESCALATED (ERR_INCIDENT_INVALID_STATE)"
          - "X-User-ID != reported_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "resolved_by = X-User-ID; resolution_notes captured"

      - from: RESOLVED
        to: REOPENED
        trigger: "POST /rescue-ops/incidents/{id}/reopen"
        actor: SafetyOfficer
        preconditions:
          - "Incident in RESOLVED (ERR_INCIDENT_INVALID_STATE)"
        side_effects: []

  - entity: BillingStatement
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /rescue-ops/statements/{id}/finalize"
        actor: BillingClerk
        preconditions:
          - "Statement in OPEN or DISPUTED (ERR_STATEMENT_INVALID_STATE)"
          - "No permit of this account in ACTIVE or SUSPENDED with actual_entry_at in [period_start, period_end) (ERR_PERMITS_STILL_OPEN)"
        side_effects:
          - "total_cents recomputed as sum of per-line rounded amount_cents"
          - "ClientAccount.balance_cents += (total_cents - billed_balance_contribution_cents); billed_balance_contribution_cents = total_cents"
          - "finalized_at = now; account on_credit_hold recomputed"

      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /rescue-ops/statements/{id}/finalize"
        actor: BillingClerk
        preconditions:
          - "Statement in OPEN or DISPUTED (ERR_STATEMENT_INVALID_STATE)"
          - "No permit of this account in ACTIVE or SUSPENDED with actual_entry_at in [period_start, period_end) (ERR_PERMITS_STILL_OPEN)"
        side_effects:
          - "ClientAccount.balance_cents += (total_cents - billed_balance_contribution_cents); billed_balance_contribution_cents = total_cents"
          - "finalized_at = now; account on_credit_hold recomputed"

      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /rescue-ops/statements/{id}/dispute"
        actor: BillingClerk
        preconditions:
          - "Statement in FINALIZED (ERR_STATEMENT_INVALID_STATE)"
        side_effects: []

      - from: FINALIZED
        to: VOID
        trigger: "POST /rescue-ops/statements/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Statement in FINALIZED or DISPUTED (ERR_STATEMENT_INVALID_STATE)"
        side_effects:
          - "ClientAccount.balance_cents -= billed_balance_contribution_cents; billed_balance_contribution_cents = 0; on_credit_hold recomputed"

      - from: DISPUTED
        to: VOID
        trigger: "POST /rescue-ops/statements/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Statement in FINALIZED or DISPUTED (ERR_STATEMENT_INVALID_STATE)"
        side_effects:
          - "ClientAccount.balance_cents -= billed_balance_contribution_cents; billed_balance_contribution_cents = 0; on_credit_hold recomputed"

      - from: FINALIZED
        to: PAID
        trigger: "POST /rescue-ops/statements/{id}/pay"
        actor: BillingClerk
        preconditions:
          - "Statement in FINALIZED (ERR_STATEMENT_INVALID_STATE)"
          - "payment_cents == total_cents exactly; any other amount is rejected (ERR_PARTIAL_PAYMENT)"
        side_effects:
          - "ClientAccount.balance_cents -= payment_cents; billed_balance_contribution_cents = 0; on_credit_hold recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-space
    parent_entity: ConfinedSpace
    write_endpoint: "POST /rescue-ops/confined-spaces/{spaceId}/rescue-plans"
    occ_field: expected_space_version
    description: |
      Creating a RescuePlan supersedes any existing DRAFT plan of the same space
      and advances ConfinedSpace.version. A creation request carrying an
      expected_space_version that no longer matches the space's current version
      is rejected: the client's view of the space (including which plan revisions
      exist) is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-approve-stale-space
    parent_entity: ConfinedSpace
    write_endpoint: "POST /rescue-ops/rescue-plans/{id}/approve"
    occ_field: expected_space_version
    description: |
      Approving a RescuePlan supersedes any other APPROVED plan of the same space
      and advances ConfinedSpace.version. An approval carrying an
      expected_space_version that no longer matches the space's current version
      is rejected: another plan write has legitimately altered the space's plan
      lineage since the client last observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: permit-create-stale-space
    parent_entity: ConfinedSpace
    write_endpoint: "POST /rescue-ops/confined-spaces/{spaceId}/entry-permits"
    occ_field: expected_space_version
    description: |
      Creating an EntryPermit auto-cancels any DRAFT permit of the same space
      (supersede semantics) and advances ConfinedSpace.version. A creation
      request carrying an expected_space_version that no longer matches the
      space's current version is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: space-update-stale-version
    parent_entity: ConfinedSpace
    write_endpoint: "PATCH /rescue-ops/confined-spaces/{id}"
    occ_field: expected_space_version
    description: |
      Updating a ConfinedSpace (reclassification, max_entrants change, status
      toggle) advances ConfinedSpace.version. An update carrying an
      expected_space_version that no longer matches the current version is
      rejected: classification and capacity decisions must be made against the
      latest observed space record.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: standby_line_amount_hourly
    trigger: "StandbyAssignment transitions to RELEASED (HOURLY_STANDBY accounts); result stored on the assignment and swept as a STANDBY_HOURLY line"
    algorithm: tiered_pricing
    formula: |
      actual_minutes = (checked_out_at - checked_in_at) in whole minutes
      billable_minutes = ceil(actual_minutes / 15) * 15          # quarter-hour roundup
      billable_hours = billable_minutes / 60
      chargeable_hours = max(account.minimum_billable_hours, billable_hours)
      tier1_hours = min(chargeable_hours, account.tier1_hours_threshold)
      tier2_hours = max(0, chargeable_hours - account.tier1_hours_threshold)
      base_cents = tier1_hours * account.hourly_standby_rate_cents
                 + tier2_hours * account.hourly_standby_rate_cents * account.tier2_multiplier
      # Day-type multiplier, NON-STACKING with explicit precedence:
      day_multiplier = account.weekend_multiplier     if checked_in_at's UTC weekday is Saturday or Sunday
                     = account.after_hours_multiplier else if checked_in_at's UTC hour < 7 or >= 19
                     = 1.0                            otherwise
      line_amount_cents = round_half_up(base_cents * day_multiplier) to integer cents
    input_set: "The released assignment + its permit's ClientAccount rate fields"
    constants:
      QUARTER_HOUR_MINUTES: 15
      AFTER_HOURS_START_UTC_HOUR: 19
      AFTER_HOURS_END_UTC_HOUR: 7
    precision: "integer cents, round_half_up applied once at the end"

  - name: statement_total_aggregation
    trigger: "Statement generation, line append (adjustment), finalize"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER: each StatementLine rounds FIRST, then the statement sums.
        line.amount_cents = round_half_up(line.quantity * line.unit_rate_cents * applicable_multiplier) to integer cents
        statement.total_cents = sum of line.amount_cents over all lines of the statement
      Sum-then-round is FORBIDDEN: the per-line rounding must happen before summation.
      (E.g., two lines of 4999.5 cents each yield 5000 + 5000 = 10000, not round(9999.0) = 9999.)
    input_set: "All StatementLines of the statement, regardless of line_kind"
    precision: "integer cents, round_half_up per line"

  - name: event_mode_billing
    trigger: "Statement generation sweep for EVENT-mode accounts"
    algorithm: aggregation
    formula: |
      For each permit of the account with actual_entry_at in [period_start, period_end)
      and event_base_billed == false:
        append EVENT_BASE line: quantity 1, unit_rate_cents = account.event_base_fee_cents,
        amount_cents = event_base_fee_cents; set event_base_billed = true.
      For each StandbyAssignment of the account's permits in RELEASED with checked_out_at
      in [period_start, period_end) and billed == false:
        append EVENT_RESCUER line: quantity 1, unit_rate_cents = account.event_per_rescuer_cents,
        amount_cents = event_per_rescuer_cents; set billed = true.
      Duration is irrelevant in EVENT mode: a 30-minute and a 9-hour standby bill identically.
    input_set: "Permits activated in period + released standby assignments in period, for EVENT accounts"
    precision: "integer cents (no fractional products in this variant)"
    variants:
      - name: hourly_vs_event
        when: "ClientAccount.billing_mode selects exactly one variant: HOURLY_STANDBY uses standby_line_amount_hourly per assignment and no EVENT_BASE/EVENT_RESCUER lines; EVENT uses this rule and no STANDBY_HOURLY lines. Identical standby activity yields different totals under the two variants."
        difference: "HOURLY scales with duration and multipliers; EVENT is flat per activation and per rescuer."

  - name: cancellation_fee
    trigger: "Permit with actual_entry_at set transitions to CANCELLED (any cancel path); swept at statement generation when closed_at in period and cancellation_fee_billed == false"
    algorithm: fixed
    formula: |
      CANCELLATION_FEE line: quantity 1,
        unit_rate_cents = round_half_up(account.event_base_fee_cents * CANCELLATION_FEE_RATIO) to integer cents,
        amount_cents = unit_rate_cents.
      Applies in BOTH billing modes. Set cancellation_fee_billed = true when swept.
    constants:
      CANCELLATION_FEE_RATIO: 0.5
    precision: "integer cents, round_half_up"

  - name: deployment_surcharge
    trigger: "Statement generation sweep: assignment reached DEPLOYED before RELEASED, checked_out_at in period, billed == false"
    algorithm: fixed
    formula: |
      DEPLOYMENT_SURCHARGE line: quantity 1, unit_rate_cents = account.deployment_surcharge_cents,
      amount_cents = account.deployment_surcharge_cents. Applies in BOTH billing modes.
      Swept together with the assignment's mode-specific line.
    precision: "integer cents"

  - name: entrant_exposure_classification
    trigger: "After each CONTINUOUS AtmosphericReading is posted on a permit: recompute for every ON_DUTY RosterEntry of that permit; also recomputed by the clock sweep for ON_DUTY entries"
    algorithm: chronological
    formula: |
      Duty window W = [checked_in_at, now). Each reading applies its h2s_ppm forward from its
      recorded_at until the next reading's recorded_at or the end of W. Time in W before the
      first reading counts as 0 ppm.
        exposure_twa_ppm  = sum over intervals (h2s_ppm_i * interval_minutes_i) / 480   # normalized to an 8-hour shift
        exposure_peak_ppm = max h2s_ppm over readings whose recorded_at falls inside W  (0 if none)
      Variant selection is by the SPACE's exposure_standard:
        TWA8 variant:        EXCEEDANCE iff exposure_twa_ppm >= 10; ACTION iff >= 5; else OK
        PEAK_CEILING variant: EXCEEDANCE iff exposure_peak_ppm >= 15; ACTION iff >= 10; else OK
      All thresholds inclusive (>=). The same reading stream can classify differently under
      the two variants (e.g., readings 8ppm x 240min then 2ppm x 240min give TWA8 = 5.0 ->
      ACTION, while peak = 8 -> OK under PEAK_CEILING).
      Side effect: when exposure_class becomes EXCEEDANCE, the RosterEntry is auto-relieved
      (ON_DUTY -> RELIEVED, checked_out_at = now).
    input_set: "CONTINUOUS readings of the entry's permit recorded within the duty window, processed in recorded_at order"
    constants:
      TWA_NORMALIZATION_MINUTES: 480
      TWA8_ACTION_PPM: 5
      TWA8_EXCEEDANCE_PPM: 10
      PEAK_ACTION_PPM: 10
      PEAK_EXCEEDANCE_PPM: 15
    precision: "2 decimal places, round_half_up, compared AFTER rounding"
    variants:
      - name: twa8_vs_peak
        when: "ConfinedSpace.exposure_standard selects exactly one variant per space"
        difference: "TWA8 accumulates dose over time; PEAK_CEILING reacts only to the maximum instantaneous reading."

  - name: credit_hold_evaluation
    trigger: "Any change to ClientAccount.balance_cents (finalize, re-finalize, void, pay)"
    algorithm: threshold
    formula: |
      on_credit_hold = (balance_cents >= credit_limit_cents)   # boundary is INCLUSIVE
      balance_cents == sum of billed_balance_contribution_cents over all BillingStatements
      of the account (ledger invariant).
    input_set: "The account's statements"
    precision: "integer cents"

  - name: pre_entry_reading_staleness
    trigger: "Permit activate / resume precondition evaluation"
    algorithm: threshold
    formula: |
      The latest PRE_ENTRY reading (for resume: only readings with recorded_at >
      last_suspended_at) must satisfy (now - recorded_at) <= 30 minutes. Exactly 30 minutes
      is acceptable (inclusive); 30 minutes + 1 second fails with ERR_PRE_ENTRY_READING_STALE.
    constants:
      PRE_ENTRY_MAX_AGE_MINUTES: 30

  - name: verification_validity_window
    trigger: "Clock sweep; activate/resume precondition evaluation"
    algorithm: threshold
    formula: |
      expires_at = verified_at + 12 hours (set at verify time).
      A VERIFIED verification is valid iff now < expires_at. At now == expires_at the clock
      sweep moves it to EXPIRED (boundary: expiry is inclusive of expires_at).
    constants:
      VERIFICATION_TTL_HOURS: 12

  - name: monitoring_gap_suspension
    trigger: "Clock sweep over ACTIVE permits"
    algorithm: threshold
    formula: |
      For each ACTIVE permit whose space requires_continuous_monitoring:
        let last = recorded_at of the latest CONTINUOUS reading (or actual_entry_at if none).
        if (now - last) > 15 minutes (STRICTLY greater): permit -> SUSPENDED with the
        emergency cascade (roster EVACUATED, standby DEPLOYED). Exactly 15 minutes does
        NOT suspend. No Incident is auto-created by the gap path (unlike the alarm path).
    constants:
      MONITORING_MAX_GAP_MINUTES: 15

  - name: duty_window_rules
    trigger: "Roster scheduling and clock sweeps"
    algorithm: threshold
    formula: |
      Shift length: (scheduled_end_at - scheduled_start_at) <= personnel.max_duty_hours,
      else ERR_SHIFT_DURATION_EXCEEDS.
      Check-in window: [scheduled_start_at - 15 minutes, scheduled_end_at].
      No-show sweep: SCHEDULED and now > scheduled_start_at + 15 minutes -> NO_SHOW
      (strictly greater; exactly +15:00 does not flip).
      Rest gap: for the same personnel, any existing entry in SCHEDULED or ON_DUTY conflicts
      with a new entry iff (new_start < existing_end + 8 hours) AND (existing_start <
      new_end + 8 hours) -> ERR_INSUFFICIENT_REST. Exactly 8 hours between shifts is legal.
    constants:
      CHECKIN_EARLY_MINUTES: 15
      NO_SHOW_GRACE_MINUTES: 15
      REST_GAP_HOURS: 8

  - name: standby_window_rules
    trigger: "Standby scheduling and clock sweeps"
    algorithm: threshold
    formula: |
      Overlap (HALF-OPEN interval semantics): a new assignment for a rescuer conflicts with
      any existing assignment of that rescuer in SCHEDULED | ON_STANDBY | DEPLOYED iff
      (new_start < existing_end) AND (existing_start < new_end) -> ERR_STANDBY_OVERLAP.
      Touching windows (new_start == existing_end) are legal — no rest buffer applies to
      standby (unlike roster's 8-hour rest gap).
      Check-in window: [standby_start_at - 30 minutes, standby_end_at].
      No-show sweep: SCHEDULED and now > standby_start_at + 15 minutes -> NO_SHOW.
    constants:
      STANDBY_CHECKIN_EARLY_MINUTES: 30
      STANDBY_NO_SHOW_GRACE_MINUTES: 15

  - name: balance_reconciliation
    trigger: "Statement finalize / re-finalize / void / pay"
    algorithm: aggregation
    formula: |
      LEDGER INVARIANT (must hold after every mutation):
        ClientAccount.balance_cents == sum of billed_balance_contribution_cents
          over all BillingStatements of the account.
      finalize:      balance += (total - contribution); contribution = total
      re-finalize:   balance += (total - contribution); contribution = total   (delta adjust)
      void:          balance -= contribution;           contribution = 0
      pay:           balance -= payment_cents;          contribution = 0        (payment == total enforced)
      Compensating pair: finalize followed by void leaves balance_cents unchanged.
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role must be permitted on this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "For entity-backed roles (EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer): X-User-ID must resolve to a Personnel row with status ACTIVE whose role_qualifications contain the role's required qualification (ENTRY_SUPERVISOR / ATTENDANT / RESCUE_LEAD / SAFETY_OFFICER respectively)"
    error_id: ERR_IDENTITY_NOT_QUALIFIED
    http_status: 403
    applies_to: "all endpoints invoked with an entity-backed role"

  - priority: 4
    category: existence
    check: "Path resource ids must exist, validated left-to-right; nested children must belong to their path parents; body-supplied FK references (personnel_id, rescuer_id, relief_of_entry_id) must exist"
    error_id: "ERR_PERSONNEL_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_SPACE_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_VERIFICATION_NOT_FOUND | ERR_ROSTER_ENTRY_NOT_FOUND | ERR_READING_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_STATEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present, no unknown fields (client-supplied computed/system fields such as within_limits, balance_cents, id are rejected), enum values valid, numeric ranges sane; planned_end_at strictly after planned_start_at; scheduled_end_at strictly after scheduled_start_at; standby_end_at strictly after standby_start_at; period_end strictly after period_start"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_TIME_RANGE"
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_space_version, when an endpoint requires it, must equal ConfinedSpace.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST rescue-plans, POST rescue-plans/{id}/approve, POST entry-permits, PATCH confined-spaces/{id}"

  - priority: 7
    category: state
    check: "Target entity must be in a state from which the requested transition exists (per §1.2); reading_kind must be allowed in the permit's current state (PRE_ENTRY: ISSUED|SUSPENDED; CONTINUOUS: ACTIVE)"
    error_id: "ERR_PERMIT_INVALID_STATE | ERR_PLAN_INVALID_STATE | ERR_VERIFICATION_INVALID_STATE | ERR_ROSTER_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_INCIDENT_INVALID_STATE | ERR_STATEMENT_INVALID_STATE | ERR_READING_KIND_NOT_ALLOWED"
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 8
    category: business_safety
    check: "Atmospheric reading plausibility: 0.0 <= o2_pct <= 30.0; 0 <= lel_pct <= 100; 0 <= h2s_ppm <= 500; 0 <= co_ppm <= 2000"
    error_id: ERR_READING_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST atmospheric-readings"

  - priority: 9
    category: business_safety
    check: "Permit activation/resume safety chain, evaluated in this exact order: (a) APPROVED rescue plan exists (ERR_RESCUE_PLAN_NOT_APPROVED); (b) required isolation types VERIFIED and unexpired (ERR_ISOLATION_NOT_VERIFIED); (c) latest PRE_ENTRY reading exists and within_limits (ERR_ATMOSPHERE_OUT_OF_LIMITS); (d) reading fresh <= 30 min (ERR_PRE_ENTRY_READING_STALE); (e) standby coverage >= required_team_size (ERR_RESCUE_TEAM_UNDERSTAFFED, activation only); (f) now within planned window (ERR_OUTSIDE_PLANNED_WINDOW, activation only); (g) no open incidents (ERR_OPEN_INCIDENTS_EXIST, resume only)"
    error_id: "ERR_RESCUE_PLAN_NOT_APPROVED | ERR_ISOLATION_NOT_VERIFIED | ERR_ATMOSPHERE_OUT_OF_LIMITS | ERR_PRE_ENTRY_READING_STALE | ERR_RESCUE_TEAM_UNDERSTAFFED | ERR_OUTSIDE_PLANNED_WINDOW | ERR_OPEN_INCIDENTS_EXIST"
    http_status: 409
    applies_to: "POST entry-permits/{id}/activate, POST entry-permits/{id}/resume"

  - priority: 10
    category: business_safety
    check: "People-safety gates: no ON_DUTY roster entries when closing/manual-suspending/manual-cancelling a permit (ERR_ENTRANTS_STILL_INSIDE); entrant check-in requires an ON_DUTY attendant (ERR_NO_ATTENDANT_ON_DUTY); attendant check-out blocked while entrants ON_DUTY (ERR_ENTRANTS_STILL_INSIDE); segregation of duties: isolation verifier != permit issuer, incident resolver != reporter (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_ENTRANTS_STILL_INSIDE | ERR_NO_ATTENDANT_ON_DUTY | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "permit close/suspend/cancel, roster check-in/check-out, isolation verify, incident resolve"

  - priority: 11
    category: business_constraint
    check: "Capacity/occupancy constraints: ON_DUTY entrant count < max_entrants at check-in (ERR_MAX_ENTRANTS_EXCEEDED); personnel not ON_DUTY elsewhere (ERR_PERSONNEL_ALREADY_ON_DUTY); relief target ON_DUTY (ERR_RELIEF_TARGET_NOT_ON_DUTY); space must be AVAILABLE for permit creation/activation (ERR_SPACE_OUT_OF_SERVICE); no ISSUED|ACTIVE|SUSPENDED permit exists on the space when creating a permit (ERR_SPACE_OCCUPIED)"
    error_id: "ERR_MAX_ENTRANTS_EXCEEDED | ERR_PERSONNEL_ALREADY_ON_DUTY | ERR_RELIEF_TARGET_NOT_ON_DUTY | ERR_SPACE_OUT_OF_SERVICE | ERR_SPACE_OCCUPIED"
    http_status: 409
    applies_to: "roster check-in, permit create/activate, space PATCH"

  - priority: 12
    category: business_temporal
    check: "Temporal windows: check-in windows (ERR_CHECKIN_WINDOW_NOT_OPEN / ERR_CHECKIN_WINDOW_EXPIRED); roster rest gap of 8 hours between shifts of the same personnel (ERR_INSUFFICIENT_REST); standby half-open overlap per rescuer (ERR_STANDBY_OVERLAP); statement period must not overlap an existing FINALIZED|DISPUTED|PAID statement of the account (ERR_STATEMENT_PERIOD_OVERLAP)"
    error_id: "ERR_CHECKIN_WINDOW_NOT_OPEN | ERR_CHECKIN_WINDOW_EXPIRED | ERR_INSUFFICIENT_REST | ERR_STANDBY_OVERLAP | ERR_STATEMENT_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "roster/standby check-in, roster/standby create, statement generate"

  - priority: 13
    category: business_referential
    check: "Qualification/reference integrity: standby create requires an APPROVED RescuePlan for the space (ERR_RESCUE_PLAN_NOT_APPROVED, http 409); ATTENDANT roster slots require personnel with ATTENDANT qualification (ERR_PERSONNEL_NOT_QUALIFIED); standby rescuers require RESCUER qualification and certifications covering the APPROVED plan's required_certifications (ERR_PERSONNEL_NOT_QUALIFIED); shift length <= max_duty_hours (ERR_SHIFT_DURATION_EXCEEDS); permits only on PERMIT_REQUIRED* spaces (ERR_SPACE_NOT_PERMIT_REQUIRED)"
    error_id: "ERR_RESCUE_PLAN_NOT_APPROVED | ERR_PERSONNEL_NOT_QUALIFIED | ERR_SHIFT_DURATION_EXCEEDS | ERR_SPACE_NOT_PERMIT_REQUIRED"
    http_status: 422
    applies_to: "roster create, standby create, permit create"

  - priority: 14
    category: business_fiscal
    check: "Fiscal gates last: permit creation blocked while account on credit hold (ERR_CLIENT_CREDIT_HOLD); statement finalize blocked by in-period ACTIVE|SUSPENDED permits (ERR_PERMITS_STILL_OPEN); payment must equal total exactly (ERR_PARTIAL_PAYMENT)"
    error_id: "ERR_CLIENT_CREDIT_HOLD | ERR_PERMITS_STILL_OPEN | ERR_PARTIAL_PAYMENT"
    http_status: 402
    applies_to: "permit create, statement finalize, statement pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving logical clock ---
  - method: POST
    path: "/rescue-ops/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time. Each set runs the system sweeps: roster/standby NO_SHOW marking, verification EXPIRED marking, monitoring-gap suspensions, exposure recompute for ON_DUTY entries."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Runs all time-based sweeps against the new logical time"]

  # --- Personnel ---
  - method: POST
    path: "/rescue-ops/personnel"
    description: "Create a Personnel record"
    roles: [OperationsManager]
    code: 201
    input: [full_name, role_qualifications, "certifications?", "max_duty_hours?"]
    output: Personnel
    side_effects: ["status = ACTIVE; committed_standby_minutes = 0"]

  - method: GET
    path: "/rescue-ops/personnel"
    description: "List Personnel"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["role_qualification?", "status?"]
    output: "Personnel[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/personnel/{id}"
    description: "Get one Personnel record"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: Personnel
    side_effects: []

  - method: PATCH
    path: "/rescue-ops/personnel/{id}"
    description: "Update Personnel (currently: status ACTIVE<->INACTIVE)"
    roles: [OperationsManager]
    code: 200
    input: ["status?"]
    output: Personnel
    side_effects: []

  # --- Client accounts ---
  - method: POST
    path: "/rescue-ops/client-accounts"
    description: "Create a ClientAccount with its rate configuration"
    roles: [OperationsManager]
    code: 201
    input: [name, billing_mode, hourly_standby_rate_cents, event_base_fee_cents, event_per_rescuer_cents, credit_limit_cents, "deployment_surcharge_cents?", "minimum_billable_hours?", "tier1_hours_threshold?", "tier2_multiplier?", "after_hours_multiplier?", "weekend_multiplier?"]
    output: ClientAccount
    side_effects: ["balance_cents = 0; on_credit_hold = false"]

  - method: GET
    path: "/rescue-ops/client-accounts"
    description: "List ClientAccounts"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["billing_mode?", "on_credit_hold?"]
    output: "ClientAccount[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/client-accounts/{id}"
    description: "Get one ClientAccount"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []

  # --- Confined spaces ---
  - method: POST
    path: "/rescue-ops/client-accounts/{accountId}/confined-spaces"
    description: "Register a ConfinedSpace under an account"
    roles: [OperationsManager]
    code: 201
    input: [space_code, classification, requires_continuous_monitoring, max_entrants, ventilation_required, blind_flange_required, exposure_standard]
    output: ConfinedSpace
    side_effects: ["status = AVAILABLE"]

  - method: GET
    path: "/rescue-ops/confined-spaces"
    description: "List ConfinedSpaces (filtered-list FK reverse for client_account_id)"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["client_account_id?", "classification?", "status?"]
    output: "ConfinedSpace[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/confined-spaces/{id}"
    description: "Get one ConfinedSpace"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: ConfinedSpace
    side_effects: []

  - method: PATCH
    path: "/rescue-ops/confined-spaces/{id}"
    description: "Update a ConfinedSpace (reclassification, capacity, monitoring flag, status). Downgrading classification to NON_PERMIT or setting status OUT_OF_SERVICE is rejected while any of its permits is non-terminal (ERR_PERMITS_STILL_OPEN)."
    roles: [OperationsManager, SafetyOfficer]
    code: 200
    input: ["classification?", "max_entrants?", "requires_continuous_monitoring?", "status?", expected_space_version]
    output: ConfinedSpace
    side_effects: ["increments ConfinedSpace.version by 1"]

  # --- Rescue plans ---
  - method: POST
    path: "/rescue-ops/confined-spaces/{spaceId}/rescue-plans"
    description: "Create a RescuePlan (DRAFT) for a space; supersedes existing DRAFT plans of that space"
    roles: [RescueTeamLead]
    code: 201
    input: [required_team_size, "required_certifications?", retrieval_system_type, expected_space_version]
    output: RescuePlan
    side_effects: ["plan_revision = prior max revision for space + 1", "existing DRAFT plans of the space -> SUPERSEDED", "increments ConfinedSpace.version by 1"]

  - method: GET
    path: "/rescue-ops/rescue-plans"
    description: "List RescuePlans (filtered-list FK reverse for space_id, approved_by)"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["space_id?", "status?", "approved_by?"]
    output: "RescuePlan[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/rescue-plans/{id}"
    description: "Get one RescuePlan"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: RescuePlan
    side_effects: []

  - method: POST
    path: "/rescue-ops/rescue-plans/{id}/approve"
    description: "Approve a DRAFT plan; supersedes any other APPROVED plan of the same space"
    roles: [RescueTeamLead]
    code: 200
    input: [expected_space_version]
    output: RescuePlan
    side_effects: ["status -> APPROVED; approved_by/at set", "other APPROVED plans of the space -> SUPERSEDED", "increments ConfinedSpace.version by 1"]

  # --- Entry permits ---
  - method: POST
    path: "/rescue-ops/confined-spaces/{spaceId}/entry-permits"
    description: "Create an EntryPermit (DRAFT); auto-cancels existing DRAFT permits of the space"
    roles: [EntrySupervisor]
    code: 201
    input: [purpose, planned_start_at, planned_end_at, expected_space_version]
    output: EntryPermit
    side_effects: ["status = DRAFT; client_account_id denormalized from space", "existing DRAFT permits of the space -> CANCELLED", "increments ConfinedSpace.version by 1"]

  - method: GET
    path: "/rescue-ops/entry-permits"
    description: "List EntryPermits (filtered-list FK reverse for space_id, client_account_id, issued_by)"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["space_id?", "client_account_id?", "status?", "issued_by?"]
    output: "EntryPermit[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/entry-permits/{id}"
    description: "Get one EntryPermit"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: EntryPermit
    side_effects: []

  - method: POST
    path: "/rescue-ops/entry-permits/{id}/issue"
    description: "Issue a DRAFT permit"
    roles: [EntrySupervisor]
    code: 200
    input: []
    output: EntryPermit
    side_effects: ["status -> ISSUED; issued_by/at set"]

  - method: POST
    path: "/rescue-ops/entry-permits/{id}/activate"
    description: "Activate an ISSUED permit (full safety chain per §1.4 priority 9)"
    roles: [EntrySupervisor]
    code: 200
    input: []
    output: EntryPermit
    side_effects: ["status -> ACTIVE; actual_entry_at = now"]

  - method: POST
    path: "/rescue-ops/entry-permits/{id}/suspend"
    description: "Orderly manual suspension of an ACTIVE permit (requires empty space)"
    roles: [EntrySupervisor, SafetyOfficer]
    code: 200
    input: ["reason?"]
    output: EntryPermit
    side_effects: ["status -> SUSPENDED; suspension_count += 1; last_suspended_at = now"]

  - method: POST
    path: "/rescue-ops/entry-permits/{id}/resume"
    description: "Resume a SUSPENDED permit (re-entry authorization per §1.4 priority 9)"
    roles: [EntrySupervisor]
    code: 200
    input: []
    output: EntryPermit
    side_effects: ["status -> ACTIVE; reentry_count += 1"]

  - method: POST
    path: "/rescue-ops/entry-permits/{id}/close"
    description: "Close an ACTIVE or SUSPENDED permit (orderly completion)"
    roles: [EntrySupervisor]
    code: 200
    input: []
    output: EntryPermit
    side_effects: ["status -> CLOSED; close_reason = COMPLETED; closed_at = now", "cascades per §1.2 (standby release/cancel, roster cancel, verifications VOIDED)"]

  - method: POST
    path: "/rescue-ops/entry-permits/{id}/cancel"
    description: "Cancel a non-terminal permit"
    roles: [EntrySupervisor]
    code: 200
    input: ["reason?"]
    output: EntryPermit
    side_effects: ["status -> CANCELLED; close_reason = CANCELLED; closed_at = now", "cascades per §1.2; CANCELLATION_FEE becomes billable if actual_entry_at was set"]

  # --- Isolation verifications ---
  - method: POST
    path: "/rescue-ops/entry-permits/{permitId}/isolation-verifications"
    description: "Submit an isolation verification (PENDING) for a permit in ISSUED or SUSPENDED"
    roles: [SafetyOfficer]
    code: 201
    input: [isolation_type, evidence_ref]
    output: IsolationVerification
    side_effects: ["status = PENDING; created_by = X-User-ID"]

  - method: GET
    path: "/rescue-ops/isolation-verifications"
    description: "List IsolationVerifications (filtered-list FK reverse for permit_id, verified_by)"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["permit_id?", "isolation_type?", "status?", "verified_by?"]
    output: "IsolationVerification[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/isolation-verifications/{id}"
    description: "Get one IsolationVerification"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: IsolationVerification
    side_effects: []

  - method: POST
    path: "/rescue-ops/isolation-verifications/{id}/verify"
    description: "Verify a PENDING verification (segregation of duties: verifier != permit issuer)"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IsolationVerification
    side_effects: ["status -> VERIFIED; verified_by/at set; expires_at = now + 12h"]

  - method: POST
    path: "/rescue-ops/isolation-verifications/{id}/void"
    description: "Void a PENDING or VERIFIED verification"
    roles: [SafetyOfficer]
    code: 200
    input: ["reason?"]
    output: IsolationVerification
    side_effects: ["status -> VOIDED"]

  # --- Roster ---
  - method: POST
    path: "/rescue-ops/entry-permits/{permitId}/roster-entries"
    description: "Schedule a roster entry on a permit in ISSUED or ACTIVE"
    roles: [EntrySupervisor]
    code: 201
    input: [personnel_id, assignment_role, scheduled_start_at, scheduled_end_at, "relief_of_entry_id?"]
    output: RosterEntry
    side_effects: ["status = SCHEDULED"]

  - method: GET
    path: "/rescue-ops/roster-entries"
    description: "List RosterEntries (filtered-list FK reverse for permit_id, personnel_id, relief_of_entry_id)"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["permit_id?", "personnel_id?", "status?", "assignment_role?", "relief_of_entry_id?"]
    output: "RosterEntry[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/roster-entries/{id}"
    description: "Get one RosterEntry"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: RosterEntry
    side_effects: []

  - method: POST
    path: "/rescue-ops/roster-entries/{id}/check-in"
    description: "Check a rostered worker in (window, capacity, attendant, rotation rules)"
    roles: [EntrySupervisor]
    code: 200
    input: []
    output: RosterEntry
    side_effects: ["status -> ON_DUTY; checked_in_at = now", "relief target -> RELIEVED when relief_of_entry_id set"]

  - method: POST
    path: "/rescue-ops/roster-entries/{id}/check-out"
    description: "Check an ON_DUTY worker out"
    roles: [EntrySupervisor]
    code: 200
    input: []
    output: RosterEntry
    side_effects: ["status -> COMPLETED; checked_out_at = now; exposure finalized"]

  # --- Atmospheric readings ---
  - method: POST
    path: "/rescue-ops/entry-permits/{permitId}/atmospheric-readings"
    description: "Record an atmospheric reading. Out-of-limits CONTINUOUS readings trigger the alarm cascade (permit SUSPENDED, roster EVACUATED, standby DEPLOYED, Incident auto-created)."
    roles: [Attendant]
    code: 201
    input: [reading_kind, o2_pct, lel_pct, h2s_ppm, co_ppm]
    output: AtmosphericReading
    side_effects: ["within_limits computed", "alarm cascade when CONTINUOUS and out of limits", "exposure recompute for ON_DUTY roster entries"]

  - method: GET
    path: "/rescue-ops/atmospheric-readings"
    description: "List AtmosphericReadings (filtered-list FK reverse for permit_id, recorded_by)"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["permit_id?", "reading_kind?", "within_limits?", "recorded_by?"]
    output: "AtmosphericReading[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/atmospheric-readings/{id}"
    description: "Get one AtmosphericReading"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: AtmosphericReading
    side_effects: []

  # --- Standby assignments ---
  - method: POST
    path: "/rescue-ops/entry-permits/{permitId}/standby-assignments"
    description: "Schedule a rescue-team standby window on a permit in ISSUED or ACTIVE; requires an APPROVED RescuePlan for the space (ERR_RESCUE_PLAN_NOT_APPROVED)"
    roles: [RescueTeamLead]
    code: 201
    input: [rescuer_id, standby_start_at, standby_end_at]
    output: StandbyAssignment
    side_effects: ["status = SCHEDULED", "Personnel.committed_standby_minutes += window minutes"]

  - method: GET
    path: "/rescue-ops/standby-assignments"
    description: "List StandbyAssignments (filtered-list FK reverse for permit_id, rescuer_id)"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["permit_id?", "rescuer_id?", "status?"]
    output: "StandbyAssignment[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/standby-assignments/{id}"
    description: "Get one StandbyAssignment"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: StandbyAssignment
    side_effects: []

  - method: POST
    path: "/rescue-ops/standby-assignments/{id}/check-in"
    description: "Check a standby rescuer in"
    roles: [RescueTeamLead]
    code: 200
    input: []
    output: StandbyAssignment
    side_effects: ["status -> ON_STANDBY; checked_in_at = now"]

  - method: POST
    path: "/rescue-ops/standby-assignments/{id}/release"
    description: "Release an ON_STANDBY or DEPLOYED assignment; computes billable fields"
    roles: [RescueTeamLead]
    code: 200
    input: []
    output: StandbyAssignment
    side_effects: ["status -> RELEASED; checked_out_at = now; billable_minutes/line_amount_cents computed", "Personnel.committed_standby_minutes -= window minutes"]

  - method: POST
    path: "/rescue-ops/standby-assignments/{id}/cancel"
    description: "Cancel a SCHEDULED assignment (no charge)"
    roles: [RescueTeamLead]
    code: 200
    input: []
    output: StandbyAssignment
    side_effects: ["status -> CANCELLED", "Personnel.committed_standby_minutes -= window minutes"]

  # --- Incidents ---
  - method: POST
    path: "/rescue-ops/entry-permits/{permitId}/incidents"
    description: "Report an incident on an ACTIVE or SUSPENDED permit. On an ACTIVE permit this forces emergency suspension (with evacuation/deployment cascade)."
    roles: [EntrySupervisor, SafetyOfficer, RescueTeamLead]
    code: 201
    input: [severity, kind, description]
    output: Incident
    side_effects: ["status = REPORTED; reported_by = X-User-ID", "ACTIVE permit -> SUSPENDED with emergency cascade"]

  - method: GET
    path: "/rescue-ops/incidents"
    description: "List Incidents (filtered-list FK reverse for permit_id, reported_by)"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["permit_id?", "status?", "severity?", "reported_by?"]
    output: "Incident[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/incidents/{id}"
    description: "Get one Incident"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: POST
    path: "/rescue-ops/incidents/{id}/triage"
    description: "Triage a REPORTED or REOPENED incident"
    roles: [SafetyOfficer]
    code: 200
    input: ["severity?"]
    output: Incident
    side_effects: ["status -> TRIAGED; triaged_by set"]

  - method: POST
    path: "/rescue-ops/incidents/{id}/escalate"
    description: "Escalate a TRIAGED incident; cancels the parent permit with emergency cascades"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Incident
    side_effects: ["status -> ESCALATED; escalation_level += 1", "permit -> CANCELLED (close_reason INCIDENT) with link-2 cascades", "CRITICAL severity: space -> OUT_OF_SERVICE"]

  - method: POST
    path: "/rescue-ops/incidents/{id}/resolve"
    description: "Resolve a TRIAGED or ESCALATED incident (resolver != reporter)"
    roles: [SafetyOfficer]
    code: 200
    input: [resolution_notes]
    output: Incident
    side_effects: ["status -> RESOLVED; resolved_by, resolution_notes set"]

  - method: POST
    path: "/rescue-ops/incidents/{id}/reopen"
    description: "Reopen a RESOLVED incident"
    roles: [SafetyOfficer]
    code: 200
    input: [reason]
    output: Incident
    side_effects: ["status -> REOPENED"]

  # --- Billing ---
  - method: POST
    path: "/rescue-ops/client-accounts/{accountId}/statements/generate"
    description: "Generate (or, when an OPEN statement with identical period exists, return and top-up) the statement for a period. Sweeps unbilled billable items per the account's billing_mode. Overlap with a FINALIZED|DISPUTED|PAID statement of the same account is rejected."
    roles: [BillingClerk]
    code: 201
    input: [period_start, period_end]
    output: BillingStatement
    side_effects: ["StatementLines appended per billing sweep rules; swept items marked billed", "total_cents and line_count recomputed (per-line rounding then sum)"]

  - method: GET
    path: "/rescue-ops/statements"
    description: "List BillingStatements (filtered-list FK reverse for client_account_id)"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: ["client_account_id?", "status?"]
    output: "BillingStatement[]"
    side_effects: []

  - method: GET
    path: "/rescue-ops/statements/{id}"
    description: "Get one BillingStatement"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: BillingStatement
    side_effects: []

  - method: POST
    path: "/rescue-ops/statements/{id}/finalize"
    description: "Finalize an OPEN or DISPUTED statement (delta-debits the account balance)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: BillingStatement
    side_effects: ["status -> FINALIZED; balance_cents delta applied; finalized_at = now"]

  - method: POST
    path: "/rescue-ops/statements/{id}/dispute"
    description: "Dispute a FINALIZED statement"
    roles: [BillingClerk]
    code: 200
    input: [reason]
    output: BillingStatement
    side_effects: ["status -> DISPUTED"]

  - method: POST
    path: "/rescue-ops/statements/{id}/adjustments"
    description: "Append a CREDIT_ADJUSTMENT line to a DISPUTED statement"
    roles: [BillingClerk]
    code: 201
    input: [credit_amount_cents, reason]
    output: StatementLine
    side_effects: ["CREDIT_ADJUSTMENT line appended with amount_cents = -credit_amount_cents", "total_cents and line_count recomputed"]

  - method: POST
    path: "/rescue-ops/statements/{id}/void"
    description: "Void a FINALIZED or DISPUTED statement (credits back its balance contribution)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: BillingStatement
    side_effects: ["status -> VOID; balance_cents -= billed_balance_contribution_cents"]

  - method: POST
    path: "/rescue-ops/statements/{id}/pay"
    description: "Pay a FINALIZED statement; payment must equal total_cents exactly"
    roles: [BillingClerk]
    code: 200
    input: [payment_cents]
    output: BillingStatement
    side_effects: ["status -> PAID; balance_cents -= payment_cents"]

  - method: GET
    path: "/rescue-ops/statements/{id}/lines"
    description: "List StatementLines of a statement (sub-resource FK reverse for statement_id)"
    roles: [OperationsManager, EntrySupervisor, Attendant, RescueTeamLead, SafetyOfficer, BillingClerk]
    code: 200
    input: []
    output: "StatementLine[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role is not permitted on this endpoint" }
  - { id: ERR_IDENTITY_NOT_QUALIFIED, http: 403, condition: "Entity-backed role's X-User-ID does not resolve to an ACTIVE Personnel holding the role's required qualification" }

  # --- Existence ---
  - { id: ERR_PERSONNEL_NOT_FOUND, http: 404, condition: "Personnel id (path or body FK) does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "ClientAccount id does not exist" }
  - { id: ERR_SPACE_NOT_FOUND, http: 404, condition: "ConfinedSpace id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "RescuePlan id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "EntryPermit id does not exist" }
  - { id: ERR_VERIFICATION_NOT_FOUND, http: 404, condition: "IsolationVerification id does not exist" }
  - { id: ERR_ROSTER_ENTRY_NOT_FOUND, http: 404, condition: "RosterEntry id does not exist" }
  - { id: ERR_READING_NOT_FOUND, http: 404, condition: "AtmosphericReading id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "StandbyAssignment id does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "Incident id does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "BillingStatement id does not exist" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field (including client-supplied computed/system fields), invalid enum member, or value outside sane range" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "End timestamp not strictly after start timestamp (permit window, shift, standby window, billing period)" }

  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_space_version does not match ConfinedSpace.version" }

  # --- State ---
  - { id: ERR_PERMIT_INVALID_STATE, http: 409, condition: "Permit not in a state from which the requested transition exists" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "Plan not in DRAFT when approving" }
  - { id: ERR_VERIFICATION_INVALID_STATE, http: 409, condition: "Verification not in PENDING when verifying, or not in PENDING|VERIFIED when voiding" }
  - { id: ERR_ROSTER_INVALID_STATE, http: 409, condition: "RosterEntry not in a state allowing the requested operation" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "StandbyAssignment not in a state allowing the requested operation" }
  - { id: ERR_INCIDENT_INVALID_STATE, http: 409, condition: "Incident not in a state allowing the requested transition" }
  - { id: ERR_STATEMENT_INVALID_STATE, http: 409, condition: "BillingStatement not in a state allowing the requested transition" }
  - { id: ERR_READING_KIND_NOT_ALLOWED, http: 409, condition: "reading_kind not permitted in the permit's current state (PRE_ENTRY needs ISSUED|SUSPENDED; CONTINUOUS needs ACTIVE)" }

  # --- Safety ---
  - { id: ERR_READING_OUT_OF_RANGE, http: 422, condition: "Reading value outside plausibility range (o2 0-30, lel 0-100, h2s 0-500, co 0-2000)" }
  - { id: ERR_RESCUE_PLAN_NOT_APPROVED, http: 409, condition: "No APPROVED RescuePlan exists for the space at activate/resume time" }
  - { id: ERR_ISOLATION_NOT_VERIFIED, http: 409, condition: "A required isolation type lacks a VERIFIED, unexpired IsolationVerification" }
  - { id: ERR_ATMOSPHERE_OUT_OF_LIMITS, http: 409, condition: "No PRE_ENTRY reading exists, or the latest PRE_ENTRY reading is out of limits" }
  - { id: ERR_PRE_ENTRY_READING_STALE, http: 409, condition: "Latest PRE_ENTRY reading older than 30 minutes at activate/resume" }
  - { id: ERR_RESCUE_TEAM_UNDERSTAFFED, http: 409, condition: "Standby coverage at activation instant below the APPROVED plan's required_team_size" }
  - { id: ERR_OUTSIDE_PLANNED_WINDOW, http: 409, condition: "now outside [planned_start_at, planned_end_at] at activation" }
  - { id: ERR_OPEN_INCIDENTS_EXIST, http: 409, condition: "An incident of the permit is REPORTED|TRIAGED|ESCALATED|REOPENED during close/resume" }
  - { id: ERR_ENTRANTS_STILL_INSIDE, http: 409, condition: "ON_DUTY roster entries exist during manual suspend/close/cancel, or attendant check-out attempted while entrants ON_DUTY" }
  - { id: ERR_NO_ATTENDANT_ON_DUTY, http: 409, condition: "Entrant check-in without any ON_DUTY attendant on the permit" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same Personnel attempting both sides of a segregated control (verify vs issue; resolve vs report)" }

  # --- Constraint / temporal ---
  - { id: ERR_MAX_ENTRANTS_EXCEEDED, http: 409, condition: "Entrant check-in while ON_DUTY entrant count >= space.max_entrants" }
  - { id: ERR_PERSONNEL_ALREADY_ON_DUTY, http: 409, condition: "Personnel already ON_DUTY on another RosterEntry" }
  - { id: ERR_RELIEF_TARGET_NOT_ON_DUTY, http: 409, condition: "relief_of_entry_id references an entry not currently ON_DUTY at relief check-in" }
  - { id: ERR_SPACE_OUT_OF_SERVICE, http: 409, condition: "Space status is OUT_OF_SERVICE for permit creation/activation" }
  - { id: ERR_SPACE_OCCUPIED, http: 409, condition: "Space already has a permit in ISSUED|ACTIVE|SUSPENDED when creating a permit" }
  - { id: ERR_CHECKIN_WINDOW_NOT_OPEN, http: 409, condition: "Check-in attempted before the early-admission bound of the window" }
  - { id: ERR_CHECKIN_WINDOW_EXPIRED, http: 409, condition: "Check-in attempted after the window end" }
  - { id: ERR_INSUFFICIENT_REST, http: 409, condition: "New roster shift violates the 8-hour rest gap against another SCHEDULED|ON_DUTY entry of the same personnel" }
  - { id: ERR_STANDBY_OVERLAP, http: 409, condition: "New standby window strictly overlaps another SCHEDULED|ON_STANDBY|DEPLOYED assignment of the same rescuer (half-open semantics; touching windows legal)" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "Requested period intersects an existing FINALIZED|DISPUTED|PAID statement of the account" }

  # --- Referential / qualification ---
  - { id: ERR_PERSONNEL_NOT_QUALIFIED, http: 422, condition: "Personnel lacks the qualification (ATTENDANT for attendant slots, RESCUER for standby) or required certifications for the APPROVED plan" }
  - { id: ERR_SHIFT_DURATION_EXCEEDS, http: 422, condition: "Scheduled shift length exceeds personnel.max_duty_hours" }
  - { id: ERR_SPACE_NOT_PERMIT_REQUIRED, http: 422, condition: "Permit creation attempted on a NON_PERMIT space" }

  # --- Fiscal ---
  - { id: ERR_CLIENT_CREDIT_HOLD, http: 402, condition: "Account on credit hold (balance_cents >= credit_limit_cents) when creating a permit" }
  - { id: ERR_PERMITS_STILL_OPEN, http: 409, condition: "Finalize blocked by in-period ACTIVE|SUSPENDED permits; also space downgrade/OUT_OF_SERVICE blocked by non-terminal permits" }
  - { id: ERR_PARTIAL_PAYMENT, http: 422, condition: "payment_cents differs from total_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OperationsManager
    description: "Contractor operations administrator: personnel registry, client accounts, space registry, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /rescue-ops/personnel — create personnel"
      - "PATCH /rescue-ops/personnel/{id} — activate/deactivate personnel"
      - "POST /rescue-ops/client-accounts — create client account"
      - "POST /rescue-ops/client-accounts/{id}/confined-spaces — register space"
      - "POST /rescue-ops/_clock/set_current_utc — set logical clock"
    shared_operations:
      - "PATCH /rescue-ops/confined-spaces/{id} — shared with SafetyOfficer"
      - "All GET endpoints"

  - name: EntrySupervisor
    description: "Permit issuer and entry controller: permit lifecycle, roster scheduling and check-in/out"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /rescue-ops/confined-spaces/{id}/entry-permits — create permit"
      - "POST /rescue-ops/entry-permits/{id}/issue — issue"
      - "POST /rescue-ops/entry-permits/{id}/activate — activate"
      - "POST /rescue-ops/entry-permits/{id}/resume — resume (re-entry)"
      - "POST /rescue-ops/entry-permits/{id}/close — close"
      - "POST /rescue-ops/entry-permits/{id}/cancel — cancel"
      - "POST /rescue-ops/entry-permits/{id}/roster-entries — schedule roster"
      - "POST /rescue-ops/roster-entries/{id}/check-in — check in"
      - "POST /rescue-ops/roster-entries/{id}/check-out — check out"
    shared_operations:
      - "POST /rescue-ops/entry-permits/{id}/suspend — shared with SafetyOfficer"
      - "POST /rescue-ops/entry-permits/{id}/incidents — shared with SafetyOfficer, RescueTeamLead"
      - "All GET endpoints"

  - name: Attendant
    description: "Permit attendant: records atmospheric readings to the continuous log"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /rescue-ops/entry-permits/{id}/atmospheric-readings — record reading"
    shared_operations:
      - "All GET endpoints"

  - name: RescueTeamLead
    description: "Rescue team leader: rescue plans and standby staffing"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /rescue-ops/confined-spaces/{id}/rescue-plans — create plan"
      - "POST /rescue-ops/rescue-plans/{id}/approve — approve plan"
      - "POST /rescue-ops/entry-permits/{id}/standby-assignments — schedule standby"
      - "POST /rescue-ops/standby-assignments/{id}/check-in — standby check-in"
      - "POST /rescue-ops/standby-assignments/{id}/release — release"
      - "POST /rescue-ops/standby-assignments/{id}/cancel — cancel assignment"
    shared_operations:
      - "POST /rescue-ops/entry-permits/{id}/incidents — shared with EntrySupervisor, SafetyOfficer"
      - "All GET endpoints"

  - name: SafetyOfficer
    description: "Safety/compliance officer: isolation verification, incident workflow, space reclassification"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /rescue-ops/entry-permits/{id}/isolation-verifications — submit verification"
      - "POST /rescue-ops/isolation-verifications/{id}/verify — verify"
      - "POST /rescue-ops/isolation-verifications/{id}/void — void"
      - "POST /rescue-ops/incidents/{id}/triage — triage"
      - "POST /rescue-ops/incidents/{id}/escalate — escalate"
      - "POST /rescue-ops/incidents/{id}/resolve — resolve"
      - "POST /rescue-ops/incidents/{id}/reopen — reopen"
    shared_operations:
      - "POST /rescue-ops/entry-permits/{id}/suspend — shared with EntrySupervisor"
      - "POST /rescue-ops/entry-permits/{id}/incidents — shared with EntrySupervisor, RescueTeamLead"
      - "PATCH /rescue-ops/confined-spaces/{id} — shared with OperationsManager"
      - "All GET endpoints"

  - name: BillingClerk
    description: "Billing operator: statement lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /rescue-ops/client-accounts/{id}/statements/generate — generate statement"
      - "POST /rescue-ops/statements/{id}/finalize — finalize"
      - "POST /rescue-ops/statements/{id}/dispute — dispute"
      - "POST /rescue-ops/statements/{id}/adjustments — credit adjustment"
      - "POST /rescue-ops/statements/{id}/void — void"
      - "POST /rescue-ops/statements/{id}/pay — record payment"
    shared_operations:
      - "All GET endpoints"
