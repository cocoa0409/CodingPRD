          Registration validity depends on the ExamSession's own state, not on anything about the
          registration: a DRAFT sitting (no proctor yet) sells no seats, and the very same request
          succeeds the moment the session is proctored into SCHEDULED. After the first candidate
          checks in and the session moves to IN_PROGRESS, a later seat request is refused again.
