# =============================================================================
# Task 1243: Scaffold Corner Design (§1.9 Coverage Index — non-difficulty claims)
# Breadth walk over §1.1-§1.7 per claim-extraction-guide; §1.8-covered corners
# are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: station_create_applies_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.Station.fields.default_share_fallback]
        distinguishing_aspect: "Omitting default_share_fallback applies 1.0; system fields id/created_at/version are server-minted with version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id, st_fb: $.data.default_share_fallback, st_v: $.data.version } }
          assert:
            - "response 201; default_share_fallback == 1.0 (default applied)"
            - "version == 1; id and created_at present and server-minted"

      - name: station_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Station]
        distinguishing_aspect: "Client-supplied version/id in the create payload are ignored, never honored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", version: 99 }, as: SalesManager, captures: { st_v: $.data.version } }
          assert: ["Station.version == 1 (client-supplied 99 ignored)"]

      - name: station_create_missing_required_returns_400
        claim_type: required_fields
        grounds: [entities.Station.fields.market_name, "errors[ERR_BAD_REQUEST]"]
        distinguishing_aspect: "Missing required market_name is rejected with ERR_BAD_REQUEST before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /stations", payload: { call_sign: "KAAA" }, as: SalesManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_BAD_REQUEST, HTTP 400"]

      - name: spot_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /spots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: TrafficDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_FOUND, HTTP 404"]

      - name: spots_list_filter_and_paginate
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /spots]"]
        distinguishing_aspect: "order_id filter plus limit/offset pagination: page 1 (limit 2) reports total_count 3 and has_more true; page 2 (offset 2) returns the final item with has_more false."
        test_recipe:
          setup: ["station + MON clock (SPOT_BREAK hour 6, 10/600) + rate card (MORNING_DRIVE MON base 1000 min 100) + ACTIVE CASH order (3 units) + LOCKED log 2026-05-04 + 3 spots booked"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 3 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oA_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oA_v}" }, as: TrafficDirector }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { oA_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oA_v2}" }, as: TrafficDirector }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { oA_v3: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oA_v3}" }, as: TrafficDirector }
          trigger:
            - { call: "GET /spots", payload: { order_id: "${oA}", limit: 2, offset: 0 }, as: TrafficDirector, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /spots", payload: { order_id: "${oA}", limit: 2, offset: 2 }, as: TrafficDirector, captures: { last_id: "$.data[0].id" } }
          assert:
            - "page 1 (limit 2, offset 0): 2 items, total_count == 3, has_more == true"
            - "page 2 (limit 2, offset 2): 1 item (last_id), has_more == false"
            - "page 1 and page 2 return disjoint spot ids (first_id != last_id)"

      - name: order_computed_units_reconciled_after_import
        claim_type: computed_fields
        grounds: [entities.Order.fields.units_scheduled, entities.Order.fields.units_aired]
        distinguishing_aspect: "units_scheduled counts SCHEDULED+AIRED only: after import airs one of two spots, units_scheduled drops 2 -> 1 and units_aired becomes 1 (MAKE_GOOD_PENDING excluded)."
        test_recipe:
          setup: ["bookable station; ACTIVE CASH order (2 MORNING_DRIVE units); LOCKED log 2026-05-04 with 2 spots booked"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 2 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oA_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oA_v}" }, as: TrafficDirector, captures: { s1: $.data.id } }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { oA_v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oA_v2}" }, as: TrafficDirector, captures: { s2: $.data.id } }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { sched_pre: $.data.units_scheduled } }
          trigger:
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: ["${s1}"], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { sched_post: $.data.units_scheduled, aired_post: $.data.units_aired } }
          assert:
            - "sched_pre == 2 (both SCHEDULED before import)"
            - "sched_post == 1 and aired_post == 1 (MAKE_GOOD_PENDING spot excluded from both)"

  # -------------------------------------------------------- state_machines ---
  - section: state_machines
    instances:
      - name: order_approve_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approve is declared only from SUBMITTED; calling it on a DRAFT order fails with ERR_INVALID_STATE and no version bump."
        test_recipe:
          setup: ["station; DRAFT order"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id, oA_v: $.data.version } }
          trigger:
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE, HTTP 409", "Order.${oA} stays DRAFT at version ${oA_v}"]

      - name: spot_cancel_aired_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Spot.transitions]
        distinguishing_aspect: "AIRED is terminal; cancel on an AIRED spot is rejected and no reversal/counter changes occur."
        test_recipe:
          setup: ["bookable station; order ACTIVE; log LOCKED with spot s1; import airs s1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oA_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oA_v}" }, as: TrafficDirector, captures: { s1: $.data.id } }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: ["${s1}"], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
          trigger:
            - { call: "POST /spots/${s1}/cancel", payload: {}, as: TrafficDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE, HTTP 409", "Spot.${s1}.status stays AIRED"]

      - name: clearance_disaffirm_twice_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SyndicationClearance.transitions]
        distinguishing_aspect: "DISAFFIRMED is terminal; a second disaffirm is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["station; clearance PENDING then DISAFFIRMED once"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clearances", payload: { station_id: "${st}", program_name: "Show1", provider: "NetCo", weekday_set: ["MON"], start_hour: 10, duration_hours: 2, barter_avails_per_hour: 1, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: ProgramDirector, captures: { cl: $.data.id } }
            - { call: "POST /clearances/${cl}/disaffirm", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /clearances/${cl}/disaffirm", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE, HTTP 409"]

      - name: log_reopen_from_reconciled_returns_reconciling
        claim_type: valid_transition
        grounds: [state_machines.DailyLog.RECONCILED_to_RECONCILING]
        distinguishing_aspect: "The second revert branch works: RECONCILED -> RECONCILING clears reconciled_by_user_id so a different auditor can redo reconciliation."
        test_recipe:
          setup: ["station; MON clock; log 2026-05-04 LOCKED -> AS_RUN (empty import) -> RECONCILING -> RECONCILED by td-1"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: [], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/begin-reconciliation", payload: {}, as: TrafficDirector }
            - { call: "POST /logs/${lg}/reconcile", payload: {}, as: TrafficDirector, as_user_id: "td-1" }
          trigger:
            - { call: "POST /logs/${lg}/reopen", payload: {}, as: TrafficDirector, captures: { posture: $.data.posture, rec_by: $.data.reconciled_by_user_id } }
          assert: ["posture == RECONCILING", "reconciled_by_user_id == null (cleared by the revert)"]

      - name: entity_initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.Order, state_machines.DailyLog, state_machines.SyndicationClearance, state_machines.RemoteEvent]
        distinguishing_aspect: "Fresh entities start in their declared initial states: Order DRAFT, DailyLog DRAFT, Clearance PENDING, RemoteEvent PLANNED."
        test_recipe:
          setup: ["station"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { o_st: $.data.status } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { l_st: $.data.posture } }
            - { call: "POST /clearances", payload: { station_id: "${st}", program_name: "Show1", provider: "NetCo", weekday_set: ["MON"], start_hour: 10, duration_hours: 2, barter_avails_per_hour: 1, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: ProgramDirector, captures: { c_st: $.data.status } }
            - { call: "POST /remote-events", payload: { station_id: "${st}", event_name: "Remote1", sponsor_name: "SponCo", event_date: "2026-05-04", spot_units_promised: 1, package_price_cents: 50000 }, as: SalesRep, as_user_id: "rep-1", captures: { e_st: $.data.status } }
          assert: ["o_st == DRAFT", "l_st == DRAFT", "c_st == PENDING", "e_st == PLANNED"]

      - name: contract_close_completed_vs_breached_threshold
        claim_type: side_effect_execution
        grounds: [state_machines.EndorsementContract.ACTIVE_to_COMPLETED, state_machines.EndorsementContract.ACTIVE_to_BREACHED, calculations.endorsement_contracted_total]
        distinguishing_aspect: "Same close action, two outcomes by threshold: contract A with reads_completed 1 >= contracted 1 -> COMPLETED; contract B with 0 < 2 -> BREACHED. Boundary is >= (equal completes)."
        test_recipe:
          setup:
            - "station; FRI clock with LIVE_READ_WINDOW hour 7 (2/120); log 2026-05-01 (FRI) LOCKED"
            - "Contract A: 1 read/week, 2026-05-01..2026-05-07 (floor(7/7)=1 week -> contracted 1), program FRI 6-9, ACTIVE, one live read AIRED on the log"
            - "Contract B: 2 reads/week, same window (contracted 2), ACTIVE, no reads"
            - "clock advanced to 2026-05-08 (> end_date for both)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "fri", applies_weekdays: ["FRI"], slots: [{ slot_type: "LIVE_READ_WINDOW", hour: 7, capacity_units: 2, capacity_seconds: 120 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /endorsement-contracts", payload: { station_id: "${st}", advertiser_name: "AdvA", host_name: "HostA", program_weekdays: ["FRI"], program_start_hour: 6, program_end_hour: 9, reads_per_week: 1, start_date: "2026-05-01", end_date: "2026-05-07" }, as: SalesRep, as_user_id: "rep-1", captures: { ctA: $.data.id } }
            - { call: "POST /endorsement-contracts", payload: { station_id: "${st}", advertiser_name: "AdvB", host_name: "HostB", program_weekdays: ["FRI"], program_start_hour: 6, program_end_hour: 9, reads_per_week: 2, start_date: "2026-05-01", end_date: "2026-05-07" }, as: SalesRep, as_user_id: "rep-1", captures: { ctB: $.data.id } }
            - { call: "POST /endorsement-contracts/${ctA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /endorsement-contracts/${ctB}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-01" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /live-reads", payload: { contract_id: "${ctA}", log_id: "${lg}", hour: 7 }, as: TrafficDirector, captures: { lrA: $.data.id } }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: [], aired_live_read_ids: ["${lrA}"], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SalesManager }
          trigger:
            - { call: "POST /endorsement-contracts/${ctA}/close", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { ctA_status: $.data.status } }
            - { call: "POST /endorsement-contracts/${ctB}/close", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { ctB_status: $.data.status } }
          assert:
            - "Contract A (1 >= 1): status == COMPLETED (boundary >= completes)"
            - "Contract B (0 < 2): status == BREACHED"
            - "Contract A reads_completed == 1 exactly (only AIRED live reads count)"

      - name: remote_event_settle_gate_delivered_defaulted
        claim_type: side_effect_execution
        grounds: [state_machines.RemoteEvent.CONFIRMED_to_DELIVERED, state_machines.RemoteEvent.CONFIRMED_to_DEFAULTED, calculations.event_delivery_evaluation]
        distinguishing_aspect: "Settle is gated on the event date's log reaching AFFIDAVIT_ISSUED (cross-entity gate -> ERR_INVALID_STATE while only RECONCILED); after issuance, event E1 with 1 delivered >= 1 promised -> DELIVERED while E2 with 0 < 2 -> DEFAULTED."
        test_recipe:
          setup:
            - "station; FRI clock SPOT_BREAK hour 18 (5/300); AFTERNOON_DRIVE rate card FRI base 1000 min 100; order (1 unit) ACTIVE"
            - "E1 (promised 1) and E2 (promised 2) on 2026-05-01, both CONFIRMED; log 2026-05-01 LOCKED; one spot tagged event_id=E1 booked and AIRED; log RECONCILED by td-1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "fri", applies_weekdays: ["FRI"], slots: [{ slot_type: "SPOT_BREAK", hour: 18, capacity_units: 5, capacity_seconds: 300 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "AFTERNOON_DRIVE", weekday_set: ["FRI"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "AFTERNOON_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oA_v: $.data.version } }
            - { call: "POST /remote-events", payload: { station_id: "${st}", event_name: "Remote1", sponsor_name: "SponCo", event_date: "2026-05-01", spot_units_promised: 1, package_price_cents: 50000 }, as: SalesRep, as_user_id: "rep-1", captures: { e1: $.data.id } }
            - { call: "POST /remote-events", payload: { station_id: "${st}", event_name: "Remote2", sponsor_name: "SponCo2", event_date: "2026-05-01", spot_units_promised: 2, package_price_cents: 90000 }, as: SalesRep, as_user_id: "rep-1", captures: { e2: $.data.id } }
            - { call: "POST /remote-events/${e1}/confirm", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /remote-events/${e2}/confirm", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-01" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "AFTERNOON_DRIVE", hour: 18, duration_sec: 60, expected_order_version: "${oA_v}", event_id: "${e1}" }, as: TrafficDirector, captures: { s1: $.data.id } }
            - { call: "POST /logs/${lg}/as-run-import", payload: { aired_spot_ids: ["${s1}"], aired_live_read_ids: [], aired_barter_avail_ids: [] }, as: TrafficDirector }
            - { call: "POST /logs/${lg}/begin-reconciliation", payload: {}, as: TrafficDirector }
            - { call: "POST /logs/${lg}/reconcile", payload: {}, as: TrafficDirector, as_user_id: "td-1" }
          trigger:
            - { call: "POST /remote-events/${e2}/settle", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { gate_err: $.data.error_id } }
            - { call: "POST /logs/${lg}/issue-affidavit", payload: {}, as: BillingAdmin, as_user_id: "ba-1" }
            - { call: "POST /remote-events/${e1}/settle", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { e1_status: $.data.status, e1_deliv: $.data.spots_delivered } }
            - { call: "POST /remote-events/${e2}/settle", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { e2_status: $.data.status } }
          assert:
            - "Settle while log RECONCILED: gate_err == ERR_INVALID_STATE, HTTP 409 (affiliate not yet issued)"
            - "E1 after affidavit: status == DELIVERED with spots_delivered == 1 (boundary: 1 >= 1 delivers)"
            - "E2 after affidavit: status == DEFAULTED (spots_delivered 0 < 2)"

      - name: ratings_publish_supersedes_overlapping_book
        claim_type: side_effect_execution
        grounds: [state_machines.RatingsBook.DRAFT_to_PUBLISHED]
        excluded_because:
          difficulty_instance: locked_vs_repriced_spot_rate_on_ratings_publish
          rationale: "D1 asserts RatingsBook Winter ends SUPERSEDED after Spring publishes (overlap cascade)."

      - name: trade_agreement_exhausted_active_cycle
        claim_type: valid_transition
        grounds: [state_machines.TradeAgreement.ACTIVE_to_EXHAUSTED, state_machines.TradeAgreement.EXHAUSTED_to_ACTIVE]
        excluded_because:
          difficulty_instance: order_cancel_cascade_spots_ledger_agreement
          rationale: "D7 drives ACTIVE -> EXHAUSTED (debits) and EXHAUSTED -> ACTIVE (cancel reversals) end-to-end."

  # ---------------------------------------------------------- calculations ---
  - section: calculations
    instances:
      - name: spot_rate_min_rate_floor_applies
        claim_type: constants_applied
        grounds: [calculations.spot_unit_rate, entities.RateCardEntry.fields.min_rate_cents]
        distinguishing_aspect: "raw rate 1360 (2000 x 0.80 share tier x 0.85 SAT x 1.00 demand) is below the 3000 floor; max() pins the booked rate to exactly 3000."
        test_recipe:
          setup: ["station fallback 2.5; SAT clock SPOT_BREAK hour 15 (10/600); AFTERNOON_DRIVE rate card SAT base 2000 min 3000; book share 1.0 (2026-04-01..2026-06-30) PUBLISHED -> x0.80; ACTIVE CASH order 1 unit; log 2026-05-02 (SAT) LOCKED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "sat", applies_weekdays: ["SAT"], slots: [{ slot_type: "SPOT_BREAK", hour: 15, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "AFTERNOON_DRIVE", weekday_set: ["SAT"], base_rate_cents: 2000, min_rate_cents: 3000, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /ratings-books", payload: { station_id: "${st}", survey_name: "Low", period_start: "2026-04-01", period_end: "2026-06-30", share_value: 1.0 }, as: SalesManager, captures: { bk: $.data.id } }
            - { call: "POST /ratings-books/${bk}/publish", payload: {}, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "AFTERNOON_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oA_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-02" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "AFTERNOON_DRIVE", hour: 15, duration_sec: 60, expected_order_version: "${oA_v}" }, as: TrafficDirector, captures: { rate: $.data.unit_rate_cents } }
          assert: ["unit_rate_cents == 3000 (floor), not 1360"]

      - name: ratings_fallback_uses_station_default_share
        claim_type: input_set_filtering
        grounds: [calculations.ratings_lookup, entities.Station.fields.default_share_fallback]
        distinguishing_aspect: "With zero PUBLISHED books the candidate set is empty and the station fallback share 1.5 applies (x0.80 tier): base 10000 -> 8000."
        test_recipe:
          setup: ["station fallback 1.5; MON clock SPOT_BREAK hour 6 (10/600); MORNING_DRIVE rate card MON base 10000 min 100; NO ratings books; order 1 unit ACTIVE; log 2026-05-04 LOCKED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 1.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 10000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { oA_v: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${oA_v}" }, as: TrafficDirector, captures: { rate: $.data.unit_rate_cents } }
          assert: ["unit_rate_cents == 8000 (10000 x 0.80 fallback-share tier x 1.00 MON x 1.00 demand)"]

      - name: demand_tier_boundary_at_exactly_070
        claim_type: constants_applied
        grounds: [calculations.spot_unit_rate]
        distinguishing_aspect: "Utilization exactly 0.70 selects the 1.15 tier (>= boundary): the 7th-of-10 booking (u=0.6) prices 5000, the 8th (u=0.70) prices 5750."
        test_recipe:
          setup: ["station fallback 2.5 (x1.00); MON clock SPOT_BREAK hour 6 (10 units/600s); MORNING_DRIVE rate card MON base 5000 min 100; order 8 units ACTIVE; log 2026-05-04 LOCKED; 6 spots booked in setup (utilization 0.6); trigger books the 7th and 8th"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /clocks", payload: { station_id: "${st}", name: "wkdy", applies_weekdays: ["MON"], slots: [{ slot_type: "SPOT_BREAK", hour: 6, capacity_units: 10, capacity_seconds: 600 }] }, as: ProgramDirector, captures: { clk: $.data.id } }
            - { call: "POST /clocks/${clk}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /rate-card-entries", payload: { station_id: "${st}", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 5000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesManager }
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "CASH", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 8 }] }, as: SalesRep, as_user_id: "rep-1", captures: { oA: $.data.id } }
            - { call: "POST /orders/${oA}/submit", payload: {}, as: SalesRep, as_user_id: "rep-1" }
            - { call: "POST /orders/${oA}/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1" }
            - { call: "POST /orders/${oA}/activate", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { v0: $.data.version } }
            - { call: "POST /logs", payload: { station_id: "${st}", log_date: "2026-05-04" }, as: TrafficDirector, captures: { lg: $.data.id, lg_v: $.data.version } }
            - { call: "POST /logs/${lg}/lock", payload: { expected_log_version: "${lg_v}" }, as: TrafficDirector }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${v0}" }, as: TrafficDirector }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { v1: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${v1}" }, as: TrafficDirector }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { v2: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${v2}" }, as: TrafficDirector }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { v3: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${v3}" }, as: TrafficDirector }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { v4: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${v4}" }, as: TrafficDirector }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { v5: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${v5}" }, as: TrafficDirector }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { v6: $.data.version } }
          trigger:
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${v6}" }, as: TrafficDirector, captures: { rate7: $.data.unit_rate_cents } }
            - { call: "GET /orders/${oA}", as: TrafficDirector, captures: { v7: $.data.version } }
            - { call: "POST /spots", payload: { order_id: "${oA}", log_id: "${lg}", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60, expected_order_version: "${v7}" }, as: TrafficDirector, captures: { rate8: $.data.unit_rate_cents } }
          assert:
            - "7th booking (u = 6/10 = 0.60): rate7 == 5000 (x1.00)"
            - "8th booking (u = 7/10 = 0.70 exactly): rate8 == 5750 (x1.15, boundary is >=)"

      - name: contracted_reads_total_floors_partial_weeks
        claim_type: correct_result
        grounds: [calculations.endorsement_contracted_total]
        distinguishing_aspect: "A 6-day window with 3 reads/week yields floor(6/7)=0 weeks -> contracted_reads_total == 0 (partial week contributes nothing)."
        test_recipe:
          setup: ["station"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /endorsement-contracts", payload: { station_id: "${st}", advertiser_name: "AdvA", host_name: "HostA", program_weekdays: ["FRI"], program_start_hour: 6, program_end_hour: 9, reads_per_week: 3, start_date: "2026-05-01", end_date: "2026-05-06" }, as: SalesRep, as_user_id: "rep-1", captures: { total: $.data.contracted_reads_total } }
          assert: ["contracted_reads_total == 0 (3 x floor(6/7))"]

      - name: trade_positive_adjustment_restores_available
        claim_type: correct_result
        grounds: [calculations.trade_available_balance]
        distinguishing_aspect: "Signed ADJUSTMENT replay: a +3000 adjustment raises available to limit + 3000 = 13000 and status stays ACTIVE (EXHAUSTED only at exactly 0)."
        test_recipe:
          setup: ["station; agreement limit 10000 ratio 1.0"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
            - { call: "POST /trade-agreements", payload: { station_id: "${st}", vendor_name: "VendorCo", credit_limit_cents: 10000, trade_ratio: 1.0 }, as: SalesManager, as_user_id: "mgr-1", captures: { ta: $.data.id } }
          trigger:
            - { call: "POST /trade-agreements/${ta}/ledger-entries", payload: { entry_kind: "ADJUSTMENT", amount_cents: 3000, note: "bonus credit" }, as: BillingAdmin, as_user_id: "ba-1" }
            - { call: "GET /trade-agreements/${ta}", as: BillingAdmin, captures: { avail: $.data.available_cents, adj: $.data.adjustments_cents, status: $.data.status } }
          assert: ["available_cents == 13000", "adjustments_cents == 3000", "status == ACTIVE"]

      - name: affidavit_per_line_rounding_order
        claim_type: precision
        grounds: [calculations.affidavit_billing_total]
        excluded_because:
          difficulty_instance: affidavit_net_per_line_rounding_beats_sum_then_round
          rationale: "D4 pins per-line-then-sum (1706 vs 1705) end-to-end."

  # ------------------------------------------------------------ validations ---
  - section: validations
    instances:
      - name: spots_create_missing_auth_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role / X-User-ID headers -> 401 before any role or existence check (test sends the call with no identity headers)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spots", payload: { order_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", log_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", daypart: "MORNING_DRIVE", hour: 6, duration_sec: 60 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_UNAUTHENTICATED, HTTP 401 (identity headers absent)"]

      - name: rate_card_create_sales_rep_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "roles[SalesManager].exclusive_operations"]
        distinguishing_aspect: "SalesRep calling a SalesManager-exclusive endpoint gets ERR_ROLE_FORBIDDEN 403 before existence checks (station id need not exist)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rate-card-entries", payload: { station_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", daypart: "MORNING_DRIVE", weekday_set: ["MON"], base_rate_cents: 1000, min_rate_cents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: SalesRep, as_user_id: "rep-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ROLE_FORBIDDEN, HTTP 403"]

      - name: existence_beats_state_on_approve
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]"]
        distinguishing_aspect: "Approving a nonexistent order returns ERR_NOT_FOUND (priority 3), never ERR_INVALID_STATE (priority 5)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/approve", payload: {}, as: SalesManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_FOUND, HTTP 404"]

      - name: trade_order_requires_agreement_reference
        claim_type: violation_to_error
        grounds: ["validations[priority=3.1]", "errors[ERR_TRADE_AGREEMENT_REQUIRED]"]
        distinguishing_aspect: "TRADE order without trade_agreement_id -> 422 ERR_TRADE_AGREEMENT_REQUIRED at creation."
        test_recipe:
          setup: ["station"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /orders", payload: { station_id: "${st}", advertiser_name: "AdvA", order_kind: "TRADE", flight_start: "2026-05-01", flight_end: "2026-05-31", rate_tier: "FIXED", reprice_policy: "LOCKED_AT_BOOKING", daypart_targets: [{ daypart: "MORNING_DRIVE", units: 1 }] }, as: SalesRep, as_user_id: "rep-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_TRADE_AGREEMENT_REQUIRED, HTTP 422"]

      - name: spot_hour_must_belong_to_daypart
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DAYPART_HOUR_MISMATCH]", calculations.hour_spot_capacity]
        distinguishing_aspect: "MORNING_DRIVE booking at hour 10 (a MIDDAY hour) fails with ERR_DAYPART_HOUR_MISMATCH 422."
        test_recipe:
          setup: ["bookable station (MON clock SPOT_BREAK hour 10 cap 10/600; MIDDAY rate card; order ACTIVE 1 unit; log 2026-05-04 LOCKED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SalesManager }
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro", default_share_fallback: 2.5 }, as: SalesManager, captures: { st: $.data.id } }
