            - { call: "POST /clients", payload: { full_name: "Cli MM", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
