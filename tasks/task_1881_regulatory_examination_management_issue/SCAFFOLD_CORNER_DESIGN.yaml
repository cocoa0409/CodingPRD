  # ===================================================================
  # Section: rbac
  # ===================================================================
  - section: rbac
    instances:
      - name: remediation_owner_cannot_approve_closure
        claim_type: rbac_exclusive_op_denied
        grounds: [roles.RemediationOwner, roles.ComplianceReviewer]
        distinguishing_aspect: "RemediationOwner calling closure approve -> ERR_UNAUTHORIZED. Role check precedes not-found."
        test_recipe:
          setup: ["one officer created (to own the as_user_id) and one unrelated exam created to source a real version number for the OCC placeholder"]
          setup_api_calls:
            - call: "POST /regulatory-exams/officers"
              payload: { full_name: "O", email: "o@x", officer_role_title: "CRO" }
              as: PlatformAdmin
              captures: { off: $.data.id }
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "RD", agency_name: "RD", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag_rd: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag_rd}", exam_cycle_code: "RD", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex_rd_v: $.data.version }
          trigger:
            - call: "POST /regulatory-exams/closure-requests/00000000-0000-0000-0000-000000000000/approve"
              payload: { expected_issue_version: "${ex_rd_v}" }
              as: RemediationOwner
              as_user_id: "${off}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHORIZED (RemediationOwner lacks closure-approve permission; role check precedes not-found)"

      - name: platform_admin_cannot_file_issue
        claim_type: rbac_exclusive_op_denied
        grounds: [roles.PlatformAdmin, roles.RegulatoryAffairsManager]
        distinguishing_aspect: "PlatformAdmin calling POST /examinations/{id}/issues -> ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["one agency"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "RA", agency_name: "RA", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "RA", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id, ex_v: $.data.version }
          trigger:
            - call: "POST /regulatory-exams/examinations/${ex}/issues"
              payload: { issue_ref: "X", classification: "MRA", severity: "LOW", due_date: "2026-09-01T00:00:00Z", expected_examination_version: "${ex_v}" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHORIZED"

      - name: board_reporter_exclusive_generate_and_finalize
        claim_type: rbac_exclusive_op_allowed
        grounds: [roles.BoardReporter]
        distinguishing_aspect: "BoardReporter can create and finalize a report; RegulatoryAffairsManager cannot."
        test_recipe:
          setup: ["one exam"]
