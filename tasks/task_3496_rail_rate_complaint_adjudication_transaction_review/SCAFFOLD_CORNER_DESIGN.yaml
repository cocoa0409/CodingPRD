            - "at exactly nitu_expires_at: AB2 consummate fails err1 == ERR_TRAIL_USE_WINDOW_OPEN — strictly-greater boundary"
            - "after expiry: AB2 convert fails err2 == ERR_TRAIL_USE_NOTICE_EXPIRED; AB2 consummate then succeeds (status CONSUMMATED)"
            - "Carrier.${c1}: active_route_miles == 830, trail_use_route_miles == 50, abandoned_route_miles == 120"

