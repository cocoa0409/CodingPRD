            - call: "POST /visa-cases/${vc}/docs"
              payload: { action: "REQUEST", doc_list: ["PASSPORT", "INVITATION_LETTER"] }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /visa-cases/${vc}/docs"
              payload: { action: "SUBMIT", doc_list: ["PASSPORT", "INVITATION_LETTER"] }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /visa-cases/${vc}/docs"
              payload: { action: "REQUEST", doc_list: ["PASSPORT", "INVITATION_LETTER", "FUNDING_PROOF"] }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /visa-cases/${vc}/docs"
              payload: { action: "SUBMIT", doc_list: ["PASSPORT", "INVITATION_LETTER", "FUNDING_PROOF"] }
              as: VisaCoordinator
              as_user_id: "visa-01"
          trigger:
            - call: "POST /visa-cases/${vc}/docs"
