              payload: {}
              as: BoardPresident
              captures: { mt_status_1: $.data.status, mt_filled_1: $.data.volunteer_slots_filled, mt_penalty_1: $.data.understaffed_penalty_cents, mt_closed_at: $.data.roster_closed_at }
          assert:
            - "hop 0 (the decision): ConductCase.${c_id}.status == SANCTIONED, sanction_type == SUSPENSION, points_assessed == 4, decided_by_user_id == \"bp-001\""
            - "hop 1: Household.${h_a_id}.conduct_points == 4 and Household.${h_a_id}.standing == SUSPENDED (from the sanction_type, since 4 < CONDUCT_SUSPENSION_THRESHOLD 6)"
            - "hop 2: Membership.${m_a_id}.access_status == SUSPENDED while dues_status is UNCHANGED at INVOICED"
            - "hop 3: SwimTeamRegistration.${r1_id}.status == REVOKED and SwimTeamRegistration.${r2_id}.status == REVOKED"
            - "hop 4: VolunteerAssignment.${a1_id}.status == RELEASED and VolunteerAssignment.${a2_id}.status == RELEASED"
            - "hop 5: Meet.${mt_id}.volunteer_slots_filled == 0 (was 2) and Meet.${mt_id}.status == UNDERSTAFFED (was STAFFED)"
            - "hop 5 arithmetic: Meet.${mt_id}.understaffed_penalty_cents == 15000, i.e. (2 - 0) * MEET_UNDERSTAFF_PENALTY_CENTS 7500 (it was 0 immediately after close-roster)"
            - "Meet.${mt_id}.roster_closed_at is NOT null after the cascade - the roster stays closed, so no replacement volunteer can be assigned"
            - "Membership.${m_a_id}.volunteer_credits_required == 0 after the cascade, because no registration remains in CONFIRMED or COMPLETED"
            - "before the trigger the meet was STAFFED with volunteer_slots_filled 2 and understaffed_penalty_cents 0, so every one of the six hops is attributable to the single conduct decision"

      - name: critical_finding_closure_cascade_to_membership_settlement
        grounds:
          - calculations.facility_posture_derivation
          - state_machines[PartyReservation].CONFIRMED_to_CANCELLED_BY_CLOSURE
          - state_machines[GuardShift].CONFIRMED_to_CANCELLED_BY_CLOSURE
          - entities.Household.fields.account_credit_cents
          - state_machines[Membership, dimension=dues_status].INVOICED_to_PAID
          - calculations.capital_reserve_position
          - endpoints[POST /swim-club/inspection-findings]
        distinguishing_aspect: |
          Depth 4, triggered by recording a CRITICAL health-department finding, and every hop is a
          MONEY hop rather than an ownership hop: posture CLOSED -> full party refund -> household
          account credit -> automatic settlement of an open dues balance -> capital-reserve
          contribution booked on the Season. The cascade crosses from the compliance aggregate into
          the fiscal aggregate without any actor touching the membership. This is a different
          trigger, a different depth and a different chain shape from
