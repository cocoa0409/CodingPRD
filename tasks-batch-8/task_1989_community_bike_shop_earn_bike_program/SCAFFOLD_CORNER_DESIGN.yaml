# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1989 Community Bike Shop & Earn-a-Bike Program
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: bike_intake_defaults_and_initial_state
        claim_type: creation
        grounds: [entities.DonatedBike, state_machines.DonatedBike]
        distinguishing_aspect: "POST /bikes with all required fields returns 201 with status RECEIVED, null condition_grade/frame_damage, parts_cost_cents 0, rework_count 0, version 1, and increments the donor's donated_bike_count."
        test_recipe:
          setup: ["empty DB; one donor"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D E", donor_type: "INDIVIDUAL", email: "de@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-E1", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { b_id: $.data.id, st: $.data.status, ver: $.data.version } }
            - { call: "GET /donors/${d_id}", as: ShopCoordinator, captures: { cnt: $.data.donated_bike_count } }
          assert:
            - "bike.status == RECEIVED"
            - "bike.condition_grade == null and bike.frame_damage == null"
            - "bike.parts_cost_cents == 0 and bike.rework_count == 0"
            - "bike.version == 1 and bike.latest_inspection_result == null"
            - "donor.donated_bike_count == 1"

      - name: bike_computed_fields_input_ignored
        claim_type: computed_field
        grounds: [entities.DonatedBike.fields.status, entities.DonatedBike.fields.parts_cost_cents]
        distinguishing_aspect: "Client-supplied values for system/computed fields (status, parts_cost_cents) are ignored: the created bike still starts RECEIVED with parts_cost_cents 0."
        test_recipe:
          setup: ["one donor"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D CI", donor_type: "INDIVIDUAL", email: "dci@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-CI", bike_type: "MTB", wheel_size_inches: 29, status: "SOLD", parts_cost_cents: 99999 }, as: ShopCoordinator, captures: { st: $.data.status, pc: $.data.parts_cost_cents } }
          assert:
            - "response status == RECEIVED (client-supplied SOLD ignored)"
            - "response parts_cost_cents == 0 (client-supplied 99999 ignored)"

      - name: participant_required_hours_and_deadline_computed
        claim_type: computed_field
        grounds: [entities.EarnABikeParticipant.fields.required_hours, entities.EarnABikeParticipant.fields.enrollment_deadline, calculations.hours_accrual]
        distinguishing_aspect: "required_hours derives from age_group (YOUTH 8, ADULT 12) and enrollment_deadline is enrolled_at + 90 days from the logical clock default 2026-08-01T00:00:00Z -> 2026-10-30T00:00:00Z."
        test_recipe:
          setup: ["empty DB; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /participants", payload: { full_name: "P Y", contact_email: "py@x.org", age_group: "YOUTH" }, as: ShopCoordinator, captures: { py: $.data.id, ry: $.data.required_hours, dy: $.data.enrollment_deadline } }
            - { call: "POST /participants", payload: { full_name: "P A", contact_email: "pa@x.org", age_group: "ADULT" }, as: ShopCoordinator, captures: { ra: $.data.required_hours, da: $.data.enrollment_deadline } }
          assert:
            - "YOUTH participant.required_hours == 8"
            - "ADULT participant.required_hours == 12"
            - "enrollment_deadline == 2026-10-30T00:00:00Z for both (enrolled 2026-08-01 + 90 days)"
            - "both participants start ENROLLED with hours_earned 0 and safety_quiz_passed false"

      - name: helmet_part_size_conditional_constraint
        claim_type: type_constraint
        grounds: [entities.Part.fields.helmet_size, "validations[priority=8]", "errors[ERR_HELMET_SIZE_REQUIRED]"]
        distinguishing_aspect: "HELMET parts require helmet_size and non-HELMET parts must not carry one; both violations return ERR_HELMET_SIZE_REQUIRED while a conforming HELMET part is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /parts", payload: { name: "Helmet NoSize", category: "HELMET", unit_cost_cents: 1500 }, as: ShopCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /parts", payload: { name: "Brake w/ size", category: "BRAKES", helmet_size: "M" }, as: ShopCoordinator, captures: { err2: $.data.error_id } }
            - { call: "POST /parts", payload: { name: "Helmet S", category: "HELMET", helmet_size: "S" }, as: ShopCoordinator, captures: { ok_id: $.data.id } }
          assert:
            - "HELMET without helmet_size -> error_id ERR_HELMET_SIZE_REQUIRED"
            - "non-HELMET with helmet_size -> error_id ERR_HELMET_SIZE_REQUIRED"
            - "HELMET with helmet_size S -> 201 with quantity_on_hand 0 and low_stock true (0 <= default threshold 0)"

      - name: harvest_event_entity_immutability
        claim_type: immutability
        grounds: [entities.PartHarvest]
        distinguishing_aspect: "PartHarvest is an append-only event (common_fields false): its read exposes id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["donor; grade-D bike routed to HARVEST_QUEUE; one ACTIVE volunteer; one WHEELS part"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D IM", donor_type: "INDIVIDUAL", email: "dim@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-IM", bike_type: "MTB", wheel_size_inches: 26 }, as: ShopCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "D", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes/${bk}/route", payload: { destination: "HARVEST" }, as: ShopCoordinator }
            - { call: "POST /volunteers", payload: { full_name: "V H", email: "vh@x.org" }, as: ShopCoordinator, captures: { v: $.data.id } }
            - { call: "POST /parts", payload: { name: "Wheel 26", category: "WHEELS", unit_cost_cents: 800 }, as: ShopCoordinator, captures: { pt: $.data.id } }
          trigger:
            - { call: "POST /bikes/${bk}/harvest-logs", payload: { part_id: "${pt}", quantity: 2 }, as: Volunteer, as_user_id: "${v}", captures: { hl: $.data.id } }
            - { call: "GET /harvest-logs/${hl}", as: ShopCoordinator }
          assert:
            - "create and GET responses contain id and created_at"
            - "responses contain NO version field and NO updated_at field (immutable event)"
            - "Part.${pt}.quantity_on_hand == 2 (harvest credited stock)"

      - name: triage_invalid_enum_returns_invalid_request
        claim_type: type_constraint
        grounds: [entities.DonatedBike.fields.condition_grade, "validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "An out-of-enum condition_grade on triage is rejected as a schema error (ERR_VALIDATION, 400) before any state or business rule runs."
        test_recipe:
          setup: ["donor; RECEIVED bike"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D EN", donor_type: "INDIVIDUAL", email: "den@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-EN", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { bk: $.data.id } }
          trigger:
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "Z", frame_damage: false }, as: ShopCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"
            - "DonatedBike.${bk}.status == RECEIVED (unchanged)"

      - name: volunteer_listing_filter_and_pagination
        claim_type: listing
        grounds: ["endpoints[GET /volunteers]", response_envelope]
        distinguishing_aspect: "GET /volunteers filters by engagement_status and paginates with envelope fields total_count/has_more under the default limit 10."
        test_recipe:
          setup: ["three volunteers; one suspended"]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "V 1", email: "v1@x.org" }, as: ShopCoordinator, captures: { v1: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V 2", email: "v2@x.org" }, as: ShopCoordinator, captures: { v2: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V 3", email: "v3@x.org" }, as: ShopCoordinator, captures: { v3: $.data.id } }
            - { call: "POST /volunteers/${v2}/suspend", payload: { reason: "conduct" }, as: ProgramDirector }
          trigger:
            - { call: "GET /volunteers?engagement_status=SUSPENDED", as: ShopCoordinator }
            - { call: "GET /volunteers?engagement_status=ACTIVE", as: ShopCoordinator }
          assert:
            - "SUSPENDED filter: total_count == 1 and the row is ${v2}"
            - "ACTIVE filter: total_count == 2"
            - "both responses carry pagination fields limit 10 (default), offset 0, has_more false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: scrapped_bike_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.DonatedBike, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SCRAPPED is terminal: triage, route, submit-safety and scrap-ticket creation on a SCRAPPED bike all fail with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["grade-D frame-damaged bike fully scrapped (ticket PICKED_UP)"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D TL", donor_type: "INDIVIDUAL", email: "dtl@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-TL", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "D", frame_damage: true }, as: ShopCoordinator }
            - { call: "POST /bikes/${bk}/route", payload: { destination: "SCRAP" }, as: ShopCoordinator }
            - { call: "POST /bikes/${bk}/scrap-tickets", payload: { material: "STEEL", weight_kg: 9.0, recycler_name: "RecCo" }, as: ShopCoordinator, captures: { tk: $.data.id } }
            - { call: "POST /scrap-tickets/${tk}/pick-up", as: ProgramDirector }
          trigger:
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "B", frame_damage: false }, as: ShopCoordinator, captures: { e1: $.data.error_id } }
            - { call: "POST /bikes/${bk}/route", payload: { destination: "REFURBISH" }, as: ShopCoordinator, captures: { e2: $.data.error_id } }
            - { call: "POST /bikes/${bk}/scrap-tickets", payload: { material: "STEEL", weight_kg: 5.0, recycler_name: "RecCo" }, as: ShopCoordinator, captures: { e3: $.data.error_id } }
          assert:
            - "triage on SCRAPPED -> ERR_INVALID_STATE"
            - "route on SCRAPPED -> ERR_INVALID_STATE"
            - "scrap-ticket create on SCRAPPED -> ERR_INVALID_STATE"
            - "DonatedBike.${bk}.status == SCRAPPED and ScrapTicket.${tk}.payout_cents == 135 (round(9.0*15))"

      - name: submit_safety_from_triaged_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DonatedBike.IN_REFURBISHMENT_to_SAFETY_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "submit-safety is only valid from IN_REFURBISHMENT; from TRIAGED it fails ERR_INVALID_STATE (and the no-work-recorded constraint is never reached because state priority 6 precedes it... state is checked first regardless of part usage absence)."
        test_recipe:
          setup: ["donor; TRIAGED grade-B bike (never routed)"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D IV", donor_type: "INDIVIDUAL", email: "div@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-IV", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "B", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /volunteers", payload: { full_name: "V S", email: "vs@x.org" }, as: ShopCoordinator, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /bikes/${bk}/submit-safety", as: Volunteer, as_user_id: "${v}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "DonatedBike.${bk}.status == TRIAGED"

      - name: double_approve_hour_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.HourLog.PENDING_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving the same HourLog twice: the second attempt finds the log no longer PENDING and fails ERR_INVALID_STATE; hours_earned reflects exactly one approval (no double credit)."
        test_recipe:
          setup: ["YOUTH participant; one PENDING 4h log; clock 2026-08-07"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "P DA", contact_email: "pda@x.org", age_group: "YOUTH" }, as: ShopCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-02", hours: 4, activity_type: "SHOP_HELP" }, as: Participant, as_user_id: "${pa}", captures: { h1: $.data.id } }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /hour-logs/${h1}/approve", payload: { expected_participant_version: "${v1}" }, as: ShopCoordinator, as_user_id: "sc-approver-1" }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { v2: $.data.version, h_after: $.data.hours_earned } }
            - { call: "POST /hour-logs/${h1}/approve", payload: { expected_participant_version: "${v2}" }, as: ShopCoordinator, as_user_id: "sc-approver-1", captures: { err: $.data.error_id } }
          assert:
            - "first approve succeeds; hours_earned == 4"
            - "second approve -> error_id ERR_INVALID_STATE (log not PENDING)"
            - "hours_earned stays 4 after the rejected second approve"

      - name: hourlog_reject_is_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.HourLog.PENDING_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED hour log cannot later be approved or voided; both attempts fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["participant; one PENDING log rejected"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "P RJ", contact_email: "prj@x.org", age_group: "ADULT" }, as: ShopCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-02", hours: 3, activity_type: "OUTREACH" }, as: Participant, as_user_id: "${pa}", captures: { h1: $.data.id } }
            - { call: "POST /hour-logs/${h1}/reject", payload: { reason: "unverifiable" }, as: ShopCoordinator, as_user_id: "sc-reviewer-1" }
          trigger:
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { v_now: $.data.version } }
            - { call: "POST /hour-logs/${h1}/approve", payload: { expected_participant_version: "${v_now}" }, as: ShopCoordinator, as_user_id: "sc-reviewer-1", captures: { e1: $.data.error_id } }
            - { call: "POST /hour-logs/${h1}/void", payload: { reason: "late" }, as: ProgramDirector, captures: { e2: $.data.error_id } }
          assert:
            - "approve after reject -> ERR_INVALID_STATE"
            - "void after reject -> ERR_INVALID_STATE"
            - "EarnABikeParticipant.${pa}.hours_earned == 0"

      - name: sale_void_leaves_bike_ready_and_seals_sale
        claim_type: side_effect_execution
        grounds: [state_machines.Sale.PENDING_to_VOIDED, "errors[ERR_SALE_NOT_PENDING]"]
        distinguishing_aspect: "Voiding a PENDING sale never touches the bike (it stays READY_FOR_DISPOSITION because only completion transitions it) and seals the sale: a later complete fails ERR_SALE_NOT_PENDING."
        test_recipe:
          setup: ["READY_FOR_DISPOSITION bike (APPRENTICE lead + JOURNEYMAN inspector pipeline); PENDING sale"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D SV", donor_type: "INDIVIDUAL", email: "dsv@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V Lead", email: "vl@x.org" }, as: ShopCoordinator, captures: { v_lead: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V Insp", email: "vi@x.org" }, as: ShopCoordinator, captures: { v_insp: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T1", level: "BASIC", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T2", level: "BASIC", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T3", level: "BASIC", scheduled_start: "2026-08-04T10:00:00Z", scheduled_end: "2026-08-04T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s3: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T4", level: "BASIC", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s4: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T5", level: "BASIC", scheduled_start: "2026-08-06T10:00:00Z", scheduled_end: "2026-08-06T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s5: $.data.id } }
            - { call: "POST /training-sessions/${s1}/enroll", payload: { volunteer_id: "${v_lead}" }, as: ShopCoordinator, captures: { la1: $.data.id } }
            - { call: "POST /training-sessions/${s2}/enroll", payload: { volunteer_id: "${v_lead}" }, as: ShopCoordinator, captures: { la2: $.data.id } }
            - { call: "POST /training-sessions/${s1}/enroll", payload: { volunteer_id: "${v_insp}" }, as: ShopCoordinator, captures: { ia1: $.data.id } }
            - { call: "POST /training-sessions/${s2}/enroll", payload: { volunteer_id: "${v_insp}" }, as: ShopCoordinator, captures: { ia2: $.data.id } }
            - { call: "POST /training-sessions/${s3}/enroll", payload: { volunteer_id: "${v_insp}" }, as: ShopCoordinator, captures: { ia3: $.data.id } }
            - { call: "POST /training-sessions/${s4}/enroll", payload: { volunteer_id: "${v_insp}" }, as: ShopCoordinator, captures: { ia4: $.data.id } }
            - { call: "POST /training-sessions/${s5}/enroll", payload: { volunteer_id: "${v_insp}" }, as: ShopCoordinator, captures: { ia5: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s1}/complete", payload: { marks: [ { attendance_id: "${la1}", outcome: "ATTENDED" }, { attendance_id: "${ia1}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s2}/complete", payload: { marks: [ { attendance_id: "${la2}", outcome: "ATTENDED" }, { attendance_id: "${ia2}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s3}/complete", payload: { marks: [ { attendance_id: "${ia3}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s4}/complete", payload: { marks: [ { attendance_id: "${ia4}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s5}/complete", payload: { marks: [ { attendance_id: "${ia5}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /volunteers/${v_lead}/promote", as: ProgramDirector }
            - { call: "POST /volunteers/${v_insp}/promote", as: ProgramDirector }
            - { call: "POST /volunteers/${v_insp}/promote", as: ProgramDirector }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-SV", bike_type: "BMX", wheel_size_inches: 20 }, as: ShopCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "A", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes/${bk}/route", payload: { destination: "REFURBISH", refurb_lead_volunteer_id: "${v_lead}" }, as: ShopCoordinator }
            - { call: "POST /parts", payload: { name: "Peg", category: "MISC", unit_cost_cents: 150 }, as: ShopCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /parts/${pt}/restock", payload: { quantity: 10 }, as: ShopCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /bikes/${bk}/usage-logs", payload: { part_id: "${pt}", quantity: 1, expected_part_version: "${pt_v}" }, as: Volunteer, as_user_id: "${v_lead}" }
            - { call: "POST /bikes/${bk}/submit-safety", as: Volunteer, as_user_id: "${v_lead}" }
            - { call: "POST /bikes/${bk}/safety-inspections", payload: { result: "PASS", checklist: { brakes: true, steering: true, tires: true, drivetrain: true, reflectors: true } }, as: Volunteer, as_user_id: "${v_insp}" }
            - { call: "POST /sales", payload: { bike_id: "${bk}", buyer_name: "B V", buyer_email: "bv@x.org" }, as: ShopCoordinator, captures: { sl: $.data.id } }
          trigger:
            - { call: "POST /sales/${sl}/void", payload: { reason: "buyer walked" }, as: ProgramDirector, captures: { st: $.data.status } }
            - { call: "POST /sales/${sl}/complete", payload: { payment_method: "CASH" }, as: ShopCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /bikes/${bk}", as: ShopCoordinator, captures: { bk_st: $.data.status } }
          assert:
            - "void response status == VOIDED"
            - "complete after void -> error_id ERR_SALE_NOT_PENDING"
            - "DonatedBike.${bk}.status == READY_FOR_DISPOSITION (void never moved the bike)"

      - name: training_cancel_drops_attendances
        claim_type: side_effect_execution
        grounds: [state_machines.TrainingSession.SCHEDULED_to_CANCELLED, state_machines.TrainingAttendance.ENROLLED_to_DROPPED]
        distinguishing_aspect: "Cancelling a SCHEDULED session cascades ENROLLED attendances to DROPPED (no training_hours credited), and completing a cancelled session fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["session with one ENROLLED volunteer"]
          setup_api_calls:
