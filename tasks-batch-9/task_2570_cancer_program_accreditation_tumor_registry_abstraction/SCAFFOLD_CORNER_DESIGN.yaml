          - errors[ERR_MEASURE_STRATA_EMPTY]
        distinguishing_aspect: |
          A zero-eligible stratum is dropped BEFORE any arithmetic, so [(0/0), (3/4)] scores 75.0
          from a single included stratum rather than 37.5 (a mean that treats the empty stratum as
          0.0) or a division error, and 75.0 clears the 70.0 threshold without reaching EXCEEDS.
        test_recipe:
          setup:
            - "One program with one DRAFT quality measure whose accountability threshold is 70.0."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/quality-measures"
              payload: { program_id: "${prog_id}", measure_code: "CSTC", measurement_year: 2026, threshold_pct: 70.0 }
              as: RegistryManager
              captures: { meas_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/quality-measures/${meas_id}/evaluate"
              payload: { strata: [{ stage_group: "STAGE_0", eligible_case_count: 0, compliant_case_count: 0 }, { stage_group: "STAGE_I", eligible_case_count: 4, compliant_case_count: 3 }] }
              as: RegistryManager
          assert:
            - "HTTP 200 with data.included_strata_count == 1 and data.performance_rate_pct == 75.0 (not 37.5)"
            - "data.pooled_rate_pct == 75.0 and data.performance_state == MEETS (75.0 >= 70.0 but < 80.0)"
            - "data.measure_state == MEASURED and data.strata still contains both posted strata (the zero stratum is stored, only excluded from the arithmetic)"

      - name: calculation_dual_variant_divergence_on_follow_up_rate
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: follow_up_rate_coc_five_year_vs_state_central_all_years_divergence
          rationale: |
            The §1.8 instance already drives both follow-up variants apart on one shared case set
            (dead patients, out-of-cohort diagnoses and the 456-vs-365-day contact windows) and
            asserts the exact delta; repeating a divergence pair here would add no discrimination.

      - name: calculation_weighted_scoring_rounding_drift_on_quality_score
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: abstractor_quality_rolling_weighted_vs_cumulative_unweighted_divergence
          rationale: |
            The §1.8 instance pins both abstractor quality variants over a multi-audit history where
            the 5/3/1 weighting and the 90-day window each move the number independently.

      - name: calculation_tiered_waterfall_boundary_on_submission_assessment
        claim_type: Constants Applied
        excluded_because:
          difficulty_instance: submission_assessment_relief_tier_keyed_on_pre_relief_subtotal
          rationale: |
            The §1.8 instance already walks the relief waterfall at a tier boundary and proves the
            tier is keyed on the pre-relief subtotal rather than the post-relief amount, which is
            the only interesting boundary in this calculation.

      - name: calculation_combinatorial_required_field_set
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: abstraction_required_field_set_recombines_on_three_independent_inputs
          rationale: |
            The §1.8 instance recombines analytic_flag, stage_source and behavior_code to reshape the
            required-field set; the corner case here (one missing field on the default combination)
            is covered by abstraction_completeness_score_penalizes_one_missing_required_field above.

      - name: calculation_threshold_boundary_on_class_of_case
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: referral_lag_exactly_120_days_is_analytic_class_20_and_121_is_not
          rationale: |
            The §1.8 instance sits exactly on the REFERRAL_LAG_MAX_DAYS boundary and its neighbour,
            which is the only boundary the class-of-case calculation exposes.

      - name: calculation_aggregation_on_empty_conference_case_set
        claim_type: Input Set Filtering
        excluded_because:
          difficulty_instance: conference_credit_with_zero_cases_presented_fails_quorum_on_empty_set
          rationale: |
            The §1.8 instance already exercises the empty-set branch of conference_quorum
            (cases_presented_count == 0 forcing prospective_case_ratio 0.0 and quorum_met false).

  # =========================================================================
  # Guide section 4 - From Table 4 (Validations)  [78 ordered rules]
  # =========================================================================
  - section: validations
    instances:

      - name: reportable_decision_on_pre_reference_year_entry_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority 57 diagnosis_date >= reference_year on decision=REPORTABLE]
          - calculations.reportability_determination
          - errors[ERR_DIAGNOSIS_BEFORE_REFERENCE_YEAR]
        distinguishing_aspect: |
          A pre-reference-year diagnosis must still be RECORDABLE (the casefinding list is built from
          the pathology feed, not from eligibility), so the entry is created with
          suggested_reportability NON_REPORTABLE / BEFORE_REFERENCE_YEAR and only the REPORTABLE
          decision is refused; the NON_REPORTABLE decision then succeeds without an override reason
          because it agrees with the suggestion.
        test_recipe:
          setup:
            - "One program with reference_year 2018 and one entry diagnosed 2017-06-10."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0009", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2017-06-10", first_contact_date: "2017-06-15", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR", override_reason_code: "REGISTRAR_JUDGEMENT" }
              as: RegistryManager
              captures: { err: $.data.error_id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "NON_REPORTABLE", decision_reason_code: "BEFORE_REFERENCE_YEAR" }
              as: RegistryManager
          assert:
            - "the entry was created with suggested_reportability == NON_REPORTABLE and suggested_reason_code == BEFORE_REFERENCE_YEAR"
            - "the REPORTABLE decision returns HTTP 422 with data.error_id == ERR_DIAGNOSIS_BEFORE_REFERENCE_YEAR, even though an override_reason_code was supplied"
            - "after the refusal the entry is still reportability_state == PENDING_REVIEW and created_case_id == null"
            - "the NON_REPORTABLE decision returns HTTP 200 with reportability_state == NON_REPORTABLE and created_case_id == null"
            - "CancerProgram.${prog_id}.identified_case_count == 0 throughout"

      - name: assign_with_abstractor_from_another_program_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority 60 abstractor/case program agreement]
          - errors[ERR_ABSTRACTOR_PROGRAM_MISMATCH]
          - endpoints[POST /cancer-registry/cases/{caseId}/assign]
        distinguishing_aspect: |
          Both ids resolve, so this is not a NOT_FOUND: the cross-entity referential rule fires at
          priority 60 with a 409, and the case must remain IDENTIFIED with the foreign abstractor's
          assigned_open_case_count untouched.
        test_recipe:
          setup:
            - "Two programs, an abstractor in the second program, and an IDENTIFIED case in the first."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_a: $.data.id }
            - call: "POST /cancer-registry/programs"
              payload: { name: "Lakeside Cancer Institute", coc_program_id: "COC-2200L", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_b: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_b}", name: "Sam Okafor", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_b_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_a}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
          trigger:
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_b_id}" }
              as: RegistryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_ABSTRACTOR_PROGRAM_MISMATCH (not ERR_ABSTRACTOR_NOT_FOUND)"
            - "TumorCase.${case_id}.case_state == IDENTIFIED, assigned_abstractor_id == null and version unchanged"
            - "Abstractor.${abs_b_id}.assigned_open_case_count == 0"

      - name: stale_case_version_outranks_case_state_check_on_abstraction_create
        claim_type: Priority Ordering
        grounds:
          - validations[priority 30 expected_case_version]
          - validations[priority 40 TumorCase abstractability]
          - concurrency_rules[abstraction-create-stale-case]
        distinguishing_aspect: |
          After assign+unassign the case is back in IDENTIFIED (not abstractable) AND its version has
          moved twice, so two rules are violated at once; priority 30 must win with a 412
          ERR_STALE_CASE_VERSION rather than the 409 ERR_CASE_NOT_ABSTRACTABLE or the priority-60
          ERR_NOT_ASSIGNED_ABSTRACTOR that the null assignment would also justify.
        test_recipe:
          setup:
            - "One program, one abstractor, one case that is assigned and then released; the pre-release version is captured."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_v_assigned: $.data.version }
            - call: "POST /cancer-registry/cases/${case_id}/unassign"
              payload: { unassign_reason: "Registrar reassigned to backlog triage" }
              as: RegistryManager
              captures: { case_v_released: $.data.version }
          trigger:
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_v_assigned}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with data.error_id == ERR_STALE_CASE_VERSION"
            - "the error is NOT ERR_CASE_NOT_ABSTRACTABLE (priority 40) and NOT ERR_NOT_ASSIGNED_ABSTRACTOR (priority 60)"
            - "${case_v_released} == ${case_v_assigned} + 1 (unassign incremented the version)"
            - "no Abstraction row exists for ${case_id} and TumorCase.${case_id}.case_state == IDENTIFIED"
            - "Abstractor.${abs_a_id}.assigned_open_case_count == 0 (workload_conservation holds)"

      - name: unknown_case_path_id_outranks_unknown_body_abstractor_id
        claim_type: Priority Ordering
        grounds:
          - validations[priority 10 {caseId} existence]
          - validations[priority 15 body foreign keys]
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: |
          Path existence is checked before body foreign keys, so an assign whose caseId AND
          abstractor_id are both unknown reports ERR_CASE_NOT_FOUND - never ERR_ABSTRACTOR_NOT_FOUND.
        test_recipe:
          setup:
            - "An empty registry; no case and no abstractor with the requested ids exist."
          setup_api_calls: []
          trigger:
            - call: "POST /cancer-registry/cases/00000000-0000-0000-0000-0000000000ff/assign"
              payload: { abstractor_id: "00000000-0000-0000-0000-0000000000ee" }
              as: RegistryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_CASE_NOT_FOUND"
            - "data.error_id is NOT ERR_ABSTRACTOR_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: future_follow_up_contact_date_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority 57 follow-up contact_date bounds]
          - errors[ERR_CONTACT_DATE_INVALID]
          - endpoints[POST /cancer-registry/cases/{caseId}/follow-up-contacts]
        distinguishing_aspect: |
          The bound is the LOGICAL clock, not wall-clock time: a contact dated 2026-08-02 is one day
          in the future at the default clock 2026-08-01 and must be refused, leaving the case's
          last_contact_date and vital_status exactly as the abstraction left them.
        test_recipe:
          setup:
            - "The canonical COMPLETED case fixture (program, two abstractors, entry, case, approved abstraction)."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_v: $.data.version }
