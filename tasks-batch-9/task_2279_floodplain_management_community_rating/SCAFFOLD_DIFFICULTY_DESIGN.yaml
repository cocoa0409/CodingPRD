            - "response.data.error_id == ERR_APPEAL_NOT_PENDING"
            - "DeterminationCase.${case_id}.status == DETERMINED"
            - "DeterminationCase.${case_id}.appeal_decided_by_user_id == null"
            - "Structure.${struct_id}.substantial_status == SUBSTANTIAL_IMPROVEMENT"

      - name: permit_submit_owner_check_outranks_state_precondition
        grounds:
          - validations[priority=15]
          - validations[priority=40]
          - errors[ERR_NOT_PROPERTY_OWNER]
          - errors[ERR_PERMIT_NOT_SUBMITTABLE]
        distinguishing_aspect: |
          Category pair auth (priority 15) vs state (priority 40), and the only pair here whose
          winner is not the state rule: a stranger acting on an APPROVED permit gets
          ERR_NOT_PROPERTY_OWNER with HTTP 403, not ERR_PERMIT_NOT_SUBMITTABLE with HTTP 409.
        test_recipe:
          setup:
            - "Two parcels in the same community, each with its own structure."
            - "Parcel 1's permit is APPROVED; the acting X-User-ID is parcel 2's Property.id."
          setup_api_calls:
