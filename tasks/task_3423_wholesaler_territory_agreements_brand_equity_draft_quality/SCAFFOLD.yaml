# =============================================================================
# Scaffold: Wholesaler Territory Agreements, Brand Equity & Draft Quality
# Task: task_3423_wholesaler_territory_agreements_brand_equity_draft_quality
# §1.0–§1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Wholesaler Territory Agreements, Brand Equity & Draft Quality (Anheuser-Busch): wholesaler appointment for exclusive territories with brand equity agreements governing performance expectations, wholesaler transfer approvals with right of first refusal and successor qualification, pricing and promotion coordination limited by three-tier regulations that prohibit certain manufacturer control, brand allocation for limited releases with wholesaler quantity assignment, draft quality program setting line cleaning frequency, keg age limits and account service standards with audits, point-of-sale material provision within value limits set by state law, wholesaler performance measurement on distribution, freshness and share with corrective plans, craft and import portfolio management within a wholesaler's book of competing suppliers

domain_name: wholesaler-territory-agreements-draft-quality
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_note: >
    Hardest profile: dense cross-entity gating (agreement ↔ transfer ↔ allocation ↔
    audit ↔ review ↔ plan), dual-variant scoring on two domains, a pinned
    rounding-order composite, an iterative waterfall allocation with caps and
    tier weights, half-open vs minimum-gap interval semantics, two compensating
    invariants, and a segregation-of-duties approval chain with an OCC-guarded
    amendment endpoint.

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Territory
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Territory display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code governing this territory" }
      - { name: status, type: enum, source: system, description: "VACANT | AWARDED" }
      - { name: incumbent_wholesaler_id, type: string, source: computed, default: null, description: "ID of the wholesaler currently holding the exclusive award; null while VACANT" }

  - name: Wholesaler
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Wholesaler legal entity name" }
      - { name: home_state, type: string, source: input, description: "Two-letter state code of principal place of business" }
      - { name: license_number, type: string, source: input, description: "State wholesaler license number" }
      - { name: tier, type: enum, source: input, description: "GOLD | SILVER | BRONZE — performance tier used as allocation weight" }
      - { name: holds_retail_interest, type: boolean, source: input, default: false, description: "True if the wholesaler holds any retail-tier ownership interest (three-tier prohibition trigger)" }
      - { name: financial_capacity_score, type: integer, source: input, description: "0-100 successor qualification input: financial strength" }
      - { name: warehouse_capacity_score, type: integer, source: input, description: "0-100 successor qualification input: warehouse/cold-storage capacity" }
      - { name: market_coverage_score, type: integer, source: input, description: "0-100 successor qualification input: market coverage" }
      - { name: supplier_book, type: array, source: input, default: [], description: "Book of competing suppliers: entries { supplier_name, supplier_type: CRAFT | IMPORT | DOMESTIC_PREMIUM, added_at }" }
      - { name: status, type: enum, source: system, description: "APPLICANT | APPOINTED | SUSPENDED | TERMINATED" }
      - { name: suspended_account_count, type: integer, source: computed, default: 0, description: "Count of served RetailAccounts currently in SERVICE_SUSPENDED; reaching 3 suspends the wholesaler" }

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; the exclusive territory this brand equity agreement covers" }
      - { name: wholesaler_id, type: string, source: input, description: "FK -> Wholesaler.id; the appointed wholesaler" }
      - { name: rofr_holder_wholesaler_id, type: string, source: input, default: null, description: "ID of the wholesaler holding right of first refusal on transfer; null = no ROFR" }
      - { name: brand_scope, type: array, source: input, description: "Brand codes this agreement authorizes the wholesaler to distribute" }
      - { name: weighting_profile, type: enum, source: input, default: STANDARD, description: "STANDARD | SHARE_TILTED — selects performance composite weights" }
      - { name: distribution_target_pct, type: number, source: input, description: "Performance expectation: numeric distribution percentage target" }
      - { name: freshness_target_index, type: number, source: input, description: "Performance expectation: freshness index target (0-100)" }
      - { name: share_target_pct, type: number, source: input, description: "Performance expectation: market share percentage target" }
      - { name: declared_distribution_pct, type: number, source: input, description: "Wholesaler-declared distribution metric (provisional equity input)" }
      - { name: declared_freshness_index, type: number, source: input, description: "Wholesaler-declared freshness metric (provisional equity input)" }
      - { name: declared_share_pct, type: number, source: input, description: "Wholesaler-declared share metric (provisional equity input)" }
      - { name: term_years, type: integer, source: input, description: "Agreement term length in years" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }
      - { name: amendment_log, type: array, source: computed, default: [], description: "Append-only log of amendments: { amended_at, fields_changed }" }

  - name: TransferApplication
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the agreement whose territory award is being transferred" }
      - { name: seller_wholesaler_id, type: string, source: computed, description: "Copied from agreement.wholesaler_id at creation" }
      - { name: buyer_wholesaler_id, type: string, source: input, description: "ID of the candidate successor Wholesaler (must be APPLICANT, no retail interest)" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Agreed purchase price for the distributorship" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | QUALIFIED | ROFR_OPEN | ROFR_EXERCISED | ROFR_WAIVED | ROFR_LAPSED | APPROVED | REJECTED | CONSUMMATED | EXPIRED" }
      - { name: qualification_score, type: number, source: computed, default: null, description: "Successor qualification score computed at qualification review" }
      - { name: rofr_deadline, type: datetime, source: computed, default: null, description: "logical clock at qualification + 30 days; null when no ROFR holder" }
      - { name: successor_wholesaler_id, type: string, source: computed, default: null, description: "Set at approval: ROFR holder if exercised, else buyer" }
      - { name: consummation_deadline, type: datetime, source: computed, default: null, description: "logical clock at approval + 60 days" }
      - { name: decision_reason, type: string, source: input, default: null, description: "Optional reason recorded at decision" }

  - name: AllocationEvent
    parent: null
    common_fields: true
    fields:
      - { name: brand_code, type: string, source: input, description: "Brand code of the limited release being allocated" }
      - { name: total_qty_cases, type: integer, source: input, description: "Total limited-release cases available for assignment" }
      - { name: min_guarantee_cases, type: integer, source: input, default: 100, description: "Per-wholesaler minimum guarantee in phase 1 of the waterfall" }
      - { name: territory_cap_pct, type: number, source: input, default: 0.40, description: "Max share of total_qty_cases any single wholesaler may be assigned" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | CLOSED" }
      - { name: requests, type: array, source: computed, default: [], description: "Wholesaler requests: { wholesaler_id, requested_qty_cases, created_at }" }
      - { name: assignments, type: array, source: computed, default: [], description: "Computed at lock: { wholesaler_id, tier_snapshot, requested_qty_cases, assigned_qty, status: PENDING | CONFIRMED | RELEASED }" }
      - { name: unassigned_remainder, type: integer, source: computed, default: null, description: "total_qty_cases - sum(assigned_qty); fixed at lock" }
      - { name: committed_qty, type: integer, source: computed, default: 0, description: "Sum of assigned_qty over CONFIRMED assignments" }
      - { name: pending_qty, type: integer, source: computed, default: 0, description: "Sum of assigned_qty over PENDING assignments" }
      - { name: released_qty, type: integer, source: computed, default: 0, description: "Sum of assigned_qty over RELEASED assignments" }

  - name: RetailAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "On-premise retail account name (bar/restaurant)" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code; selects POS value cap" }
      - { name: serving_wholesaler_id, type: string, source: input, description: "FK -> Wholesaler.id; wholesaler servicing this account" }
      - { name: line_cleaning_frequency_days, type: integer, source: input, default: 14, description: "Required draft line cleaning frequency in days" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SERVICE_SUSPENDED" }
      - { name: last_audit_at, type: datetime, source: computed, default: null, description: "conducted_at of the most recent accepted audit (failed audits do not update it)" }

  - name: DraftAudit
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> RetailAccount.id; audited account" }
      - { name: conducted_at, type: datetime, source: input, description: "Timestamp the audit was conducted" }
      - { name: line_cleaning_last_at, type: datetime, source: input, description: "Timestamp of the account's last draft line cleaning" }
      - { name: kegs, type: array, source: input, description: "Kegs on tap: { brand_code, filled_at, volume_bbl }" }
      - { name: stale_keg_count, type: integer, source: computed, description: "Kegs with age_days >= 90 at conducted_at" }
      - { name: critical_keg_flag, type: boolean, source: computed, description: "True if any keg age_days >= 120" }
      - { name: line_cleaning_overdue, type: boolean, source: computed, description: "True if gap between conducted_at and line_cleaning_last_at exceeds frequency" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL | CRITICAL_FAIL" }

  - name: PosGrant
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> RetailAccount.id; account receiving point-of-sale material" }
      - { name: item_description, type: string, source: input, description: "Description of POS material provided" }
      - { name: value_cents, type: integer, source: input, description: "Value of the POS material in cents" }
      - { name: status, type: enum, source: system, description: "ISSUED | VOIDED" }
      - { name: granted_year, type: integer, source: computed, description: "Calendar year of the logical clock at issuance; scopes the annual cap" }
      - { name: voided_at, type: datetime, source: computed, default: null, description: "Logical clock timestamp when voided" }

  - name: PerformanceReview
    parent: null
    common_fields: true
    fields:
      - { name: wholesaler_id, type: string, source: input, description: "FK -> Wholesaler.id; reviewed wholesaler" }
      - { name: period_year, type: integer, source: input, description: "Review period year" }
      - { name: period_quarter, type: enum, source: input, description: "Q1 | Q2 | Q3 | Q4" }
      - { name: distribution_pct, type: number, source: input, description: "Measured numeric distribution percentage for the period" }
      - { name: share_pct, type: number, source: input, description: "Measured market share percentage for the period" }
      - { name: freshness_index, type: number, source: computed, description: "Pooled volume-weighted freshness across the wholesaler's account audits in the period; 100.00 when no audits or no kegs" }
      - { name: weighting_profile_snapshot, type: string, source: computed, description: "Weighting profile copied from the wholesaler's ACTIVE agreement at creation" }
      - { name: composite_score, type: number, source: computed, description: "Weighted composite per pinned rounding order" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | ACKNOWLEDGED | DISPUTED" }
      - { name: dispute_reason, type: string, source: input, default: null, description: "Required when response action is DISPUTE" }

  - name: CorrectivePlan
    parent: null
    common_fields: true
    fields:
      - { name: review_id, type: string, source: computed, description: "FK -> PerformanceReview.id; the review whose sub-floor composite spawned this plan" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | VERIFIED | FAILED" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of FAILED -> PROPOSED revisions" }
      - { name: resolution_notes, type: string, source: input, default: null, description: "Notes recorded at resolve" }
      - { name: target_snapshot, type: object, source: computed, description: "Copy of the agreement targets in force when the plan was created" }

  - name: PromotionProgram
    parent: null
    common_fields: true
    fields:
      - { name: brand_code, type: string, source: input, description: "Brand code the promotion supports" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (inclusive, half-open interval)" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (exclusive, half-open interval)" }
      - { name: suggested_discount_pct, type: number, source: input, description: "Advisory wholesale discount percentage; never binding on retail price" }
      - { name: mandated_retail_price_cents, type: integer, source: input, default: null, description: "MUST be null/absent — manufacturer-mandated retail price violates three-tier law" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }
      - { name: opt_ins, type: array, source: computed, default: [], description: "Wholesaler opt-ins: { wholesaler_id, opted_at }" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Territory
    initial_state: VACANT
    terminal_states: []
    transitions:
      - from: VACANT
        to: AWARDED
        trigger: "POST /agreements (system side effect of agreement creation)"
        actor: system
        preconditions:
          - "Territory referenced by the new agreement is VACANT"
        side_effects:
          - "incumbent_wholesaler_id := agreement.wholesaler_id"
      - from: AWARDED
        to: AWARDED
        trigger: "POST /transfer-applications/{id}/consummate (incumbent swap)"
        actor: system
        preconditions:
          - "The consummated transfer's agreement covers this territory"
        side_effects:
          - "incumbent_wholesaler_id := transfer.successor_wholesaler_id"

  - entity: Wholesaler
    initial_state: APPLICANT
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICANT
        to: APPOINTED
        trigger: "system (first ACTIVE agreement: POST /agreements or transfer consummation naming this wholesaler as successor)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPOINTED
        to: SUSPENDED
        trigger: "system (suspended_account_count reaches 3 after a CRITICAL_FAIL draft audit)"
        actor: system
        preconditions:
          - "suspended_account_count transitions from 2 to 3"
        side_effects:
          - "All PENDING AllocationEvent assignments naming this wholesaler become RELEASED (released_qty increases by each assigned_qty, pending_qty decreases by the same)"
          - "Further allocation requests, transfer creation as seller, agreement creation, and promotion opt-ins are rejected while SUSPENDED"
      - from: SUSPENDED
        to: APPOINTED
        trigger: "system (a CorrectivePlan targeting a review of this wholesaler is resolved VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Wholesaler may again request allocations, opt into promotions, and be appointed to new agreements"
      - from: APPOINTED
        to: TERMINATED
        trigger: "system (transfer consummation terminates this seller's last ACTIVE agreement)"
        actor: system
        preconditions:
          - "After the consummation cascade terminates the seller's agreement, the seller holds zero remaining ACTIVE agreements"
        side_effects:
          - "All PENDING AllocationEvent assignments naming this wholesaler become RELEASED (released_qty increases, pending_qty decreases by the same amounts)"

  - entity: Agreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /agreements/{id}/amendments"
        actor: BrewerAdmin
        preconditions:
          - "expected_agreement_version equals agreement.version (else ERR_STALE_VERSION, 412)"
        side_effects:
          - "Provided target/declared/scope/profile/term/rofr_holder fields updated in place"
          - "amendment_log appended with { amended_at: logical clock, fields_changed }"
          - "version incremented by 1; status remains ACTIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (transfer consummation on a TransferApplication referencing this agreement)"
        actor: system
        preconditions: []
        side_effects:
          - "Seller wholesaler re-evaluated: if it holds zero remaining ACTIVE agreements, seller -> TERMINATED (see Wholesaler machine)"

  - entity: TransferApplication
    initial_state: SUBMITTED
    terminal_states: [REJECTED, CONSUMMATED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: QUALIFIED
        trigger: "POST /transfer-applications/{id}/qualification-review"
        actor: BrewerCompliance
        preconditions:
          - "Computed successor_qualification_score >= 70.00"
          - "Agreement has no rofr_holder_wholesaler_id"
        side_effects:
          - "qualification_score stored"
      - from: SUBMITTED
        to: ROFR_OPEN
        trigger: "POST /transfer-applications/{id}/qualification-review"
        actor: BrewerCompliance
        preconditions:
          - "Computed successor_qualification_score >= 70.00"
          - "Agreement has a rofr_holder_wholesaler_id"
        side_effects:
          - "qualification_score stored"
          - "rofr_deadline := logical clock + 30 days"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /transfer-applications/{id}/qualification-review"
        actor: BrewerCompliance
        preconditions:
          - "Computed successor_qualification_score < 70.00"
        side_effects:
          - "qualification_score stored"
      - from: ROFR_OPEN
        to: ROFR_EXERCISED
        trigger: "POST /transfer-applications/{id}/rofr-response with decision=EXERCISE"
        actor: WholesalerPrincipal
        preconditions:
          - "X-User-ID equals agreement.rofr_holder_wholesaler_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Logical clock <= rofr_deadline"
        side_effects: []
      - from: ROFR_OPEN
        to: ROFR_WAIVED
        trigger: "POST /transfer-applications/{id}/rofr-response with decision=WAIVE"
        actor: WholesalerPrincipal
        preconditions:
          - "X-User-ID equals agreement.rofr_holder_wholesaler_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Logical clock <= rofr_deadline"
        side_effects: []
      - from: ROFR_OPEN
        to: ROFR_LAPSED
        trigger: "system (sweep during POST /_clock/set_current_utc when new clock > rofr_deadline)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUALIFIED
        to: APPROVED
        trigger: "POST /transfer-applications/{id}/decision with decision=APPROVE"
        actor: BrewerCompliance
        preconditions: []
        side_effects:
          - "successor_wholesaler_id := buyer_wholesaler_id"
          - "consummation_deadline := logical clock + 60 days"
      - from: ROFR_WAIVED
        to: APPROVED
        trigger: "POST /transfer-applications/{id}/decision with decision=APPROVE"
        actor: BrewerCompliance
        preconditions: []
        side_effects:
          - "successor_wholesaler_id := buyer_wholesaler_id"
          - "consummation_deadline := logical clock + 60 days"
      - from: ROFR_LAPSED
        to: APPROVED
        trigger: "POST /transfer-applications/{id}/decision with decision=APPROVE"
        actor: BrewerCompliance
        preconditions: []
        side_effects:
          - "successor_wholesaler_id := buyer_wholesaler_id"
          - "consummation_deadline := logical clock + 60 days"
      - from: ROFR_EXERCISED
        to: APPROVED
        trigger: "POST /transfer-applications/{id}/decision with decision=APPROVE"
        actor: BrewerCompliance
        preconditions: []
        side_effects:
          - "successor_wholesaler_id := agreement.rofr_holder_wholesaler_id"
          - "consummation_deadline := logical clock + 60 days"
      - from: QUALIFIED
        to: REJECTED
        trigger: "POST /transfer-applications/{id}/decision with decision=REJECT"
        actor: BrewerCompliance
        preconditions: []
        side_effects: ["decision_reason recorded"]
      - from: ROFR_WAIVED
        to: REJECTED
        trigger: "POST /transfer-applications/{id}/decision with decision=REJECT"
        actor: BrewerCompliance
        preconditions: []
        side_effects: ["decision_reason recorded"]
      - from: ROFR_LAPSED
        to: REJECTED
        trigger: "POST /transfer-applications/{id}/decision with decision=REJECT"
        actor: BrewerCompliance
        preconditions: []
        side_effects: ["decision_reason recorded"]
      - from: ROFR_EXERCISED
        to: REJECTED
        trigger: "POST /transfer-applications/{id}/decision with decision=REJECT"
        actor: BrewerCompliance
        preconditions: []
        side_effects: ["decision_reason recorded"]
      - from: ROFR_OPEN
        to: APPROVED
        trigger: "POST /transfer-applications/{id}/decision with decision=APPROVE (REJECTED PATH)"
        actor: BrewerCompliance
        preconditions:
          - "NEVER permitted while the ROFR window is unresolved — rejected with ERR_ROFR_WINDOW_OPEN"
        side_effects: []
        note: "Explicit non-transition documenting the open-window gate"
      - from: APPROVED
        to: CONSUMMATED
        trigger: "POST /transfer-applications/{id}/consummate"
        actor: BrewerAdmin
        preconditions:
          - "Logical clock <= consummation_deadline"
          - "Successor wholesaler status is not TERMINATED (else ERR_WHOLESALER_NOT_ELIGIBLE)"
        side_effects:
          - "Referenced agreement -> TERMINATED"
          - "Territory of the agreement: incumbent_wholesaler_id := successor_wholesaler_id (stays AWARDED)"
          - "New Agreement created for (territory, successor) copying brand_scope, weighting_profile, targets, declared metrics, term_years; rofr_holder_wholesaler_id := null; status ACTIVE; version 1"
          - "Successor wholesaler APPLICANT -> APPOINTED if this is its first ACTIVE agreement"
          - "Seller wholesaler -> TERMINATED if it holds zero remaining ACTIVE agreements; a TERMINATED seller's PENDING allocation assignments become RELEASED"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (sweep during POST /_clock/set_current_utc when new clock > consummation_deadline)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AllocationEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /allocation-events/{id}/lock"
        actor: BrewerAdmin
        preconditions:
          - "At least one eligible request exists (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "calculations.allocation_waterfall_assignment executes; assignments array materialized with status PENDING"
          - "unassigned_remainder, pending_qty computed and frozen"
      - from: LOCKED
        to: CLOSED
        trigger: "system (after any assignment decision leaves zero PENDING assignments)"
        actor: system
        preconditions:
          - "pending_qty == 0"
        side_effects: []

  - entity: RetailAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SERVICE_SUSPENDED
        trigger: "system (a DraftAudit on this account computes result == CRITICAL_FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "serving wholesaler.suspended_account_count += 1; if it reaches 3, wholesaler APPOINTED -> SUSPENDED (cascade link 2)"
          - "POS grants to this account become rejected while SERVICE_SUSPENDED"
      - from: SERVICE_SUSPENDED
        to: ACTIVE
        trigger: "system (a DraftAudit on this account computes result == PASS)"
        actor: system
        preconditions: []
        side_effects:
          - "serving wholesaler.suspended_account_count -= 1 (wholesaler status itself is NOT auto-restored; reinstatement requires a VERIFIED CorrectivePlan)"

  - entity: PerformanceReview
    initial_state: PUBLISHED
    terminal_states: [ACKNOWLEDGED, DISPUTED]
    transitions:
      - from: PUBLISHED
        to: ACKNOWLEDGED
        trigger: "POST /performance-reviews/{id}/response with action=ACKNOWLEDGE"
        actor: WholesalerPrincipal
        preconditions:
          - "X-User-ID equals review.wholesaler_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: PUBLISHED
        to: DISPUTED
        trigger: "POST /performance-reviews/{id}/response with action=DISPUTE"
        actor: WholesalerPrincipal
        preconditions:
          - "X-User-ID equals review.wholesaler_id (else ERR_NOT_RESOURCE_OWNER)"
          - "dispute_reason is present (else ERR_INVALID_REQUEST)"
        side_effects: []

  - entity: CorrectivePlan
    initial_state: PROPOSED
    terminal_states: [VERIFIED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /corrective-plans/{id}/activate"
        actor: BrewerCompliance
        preconditions:
          - "The plan's PerformanceReview (via review_id) has status ACKNOWLEDGED (else ERR_REVIEW_NOT_ACKNOWLEDGED)"
        side_effects: []
      - from: ACTIVE
        to: VERIFIED
        trigger: "POST /corrective-plans/{id}/resolve with outcome=VERIFIED"
        actor: BrewerCompliance
        preconditions: []
        side_effects:
          - "resolution_notes recorded"
          - "If the reviewed wholesaler is SUSPENDED, wholesaler SUSPENDED -> APPOINTED"
      - from: ACTIVE
        to: FAILED
        trigger: "POST /corrective-plans/{id}/resolve with outcome=FAILED"
        actor: BrewerCompliance
        preconditions: []
        side_effects: ["resolution_notes recorded"]
      - from: FAILED
        to: PROPOSED
        trigger: "POST /corrective-plans/{id}/revise"
        actor: WholesalerPrincipal
        preconditions:
          - "X-User-ID equals the wholesaler of the plan's review (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "revision_count += 1"

  - entity: PosGrant
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /pos-grants/{id}/void"
        actor: BrewerAdmin
        preconditions: []
        side_effects:
          - "voided_at := logical clock"
          - "Grant stops counting toward the account's chargeable year-to-date POS value; lifetime granted value is unchanged"

  - entity: PromotionProgram
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (sweep during POST /_clock/set_current_utc when new clock >= ends_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Further opt-ins rejected with ERR_OPT_IN_WINDOW_CLOSED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: amend-agreement-stale-version
    parent_entity: Agreement
    write_endpoint: "POST /agreements/{id}/amendments"
    occ_field: expected_agreement_version
    description: |
      Amending an Agreement whose version has advanced beyond the version the
      client last observed is rejected. Two clients may each legitimately amend
      an ACTIVE agreement (amendment updates terms in place and keeps status
      ACTIVE, so no state precondition distinguishes them); the stale write is
      detected purely by the expected_agreement_version mismatch. Ordering:
      the OCC check runs immediately after the state precondition, so amending
      a TERMINATED agreement reports ERR_AGREEMENT_NOT_ACTIVE even when the
      supplied version is also stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: equity_index_score
    trigger: "GET /agreements/{id}/equity-index (computed on read; never persisted)"
    algorithm: weighted_scoring
    formula: |
      equity_index = round2_half_up(
        0.5 * distribution_component + 0.3 * freshness_component + 0.2 * share_component)
      Components are selected by the requested variant (see variants).
      AUDITED with no existing review: equity_index is null and
      components_source == "NO_REVIEW".
    input_set: "The Agreement row; for AUDITED, the latest PerformanceReview of agreement.wholesaler_id ordered by (period_year desc, period_quarter desc) in any status"
    constants:
      DIST_WEIGHT: 0.5
      FRESH_WEIGHT: 0.3
      SHARE_WEIGHT: 0.2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "variant=PROVISIONAL (default)"
        difference: "Components are the agreement's declared_* fields (declared_distribution_pct, declared_freshness_index, declared_share_pct); components_source == DECLARED"
      - name: AUDITED
        when: "variant=AUDITED"
        difference: "Components are the latest review's distribution_pct, freshness_index, share_pct; components_source == LATEST_REVIEW; null with components_source == NO_REVIEW when the wholesaler has no review"

  - name: allocation_waterfall_assignment
    trigger: "POST /allocation-events/{id}/lock"
    algorithm: waterfall_allocation
    formula: |
      eligible = requests whose wholesaler is APPOINTED, holds an ACTIVE agreement
        whose brand_scope contains event.brand_code, and was created while event
        was OPEN. (Ineligible requests are dropped at request time, so all
        requests present at lock are eligible.)
      cap_i = floor(territory_cap_pct * total_qty_cases) for every request i.
      Phase 1 (guarantee): for each request i, assigned_i = min(requested_i, min_guarantee_cases, cap_i).
      Iterative phase 2: P = total_qty_cases - sum(assigned_i).
        Repeat passes until P == 0 or no request has remaining capacity
        (capacity_i = min(requested_i, cap_i) - assigned_i > 0):
          For each i with capacity_i > 0:
            w_i = capacity_i * TIER_MULT[tier_of_wholesaler_i]   (fixed for the pass)
          granted_i = min(floor(P * w_i / sum(w)), capacity_i)   (0 when w_i == 0)
          assigned_i += granted_i
          R = P - sum(granted_i)
          Distribute R by cycling through requests with capacity_i > 0 ordered by
            w_i descending (tie-break: request created_at ascending), granting
            exactly 1 case per visit, until R == 0 or no capacity remains.
          P = total_qty_cases - sum(assigned_i) at pass end.
      tier_of_wholesaler_i is snapshotted onto each assignment as tier_snapshot.
      unassigned_remainder = total_qty_cases - sum(assigned_qty); each
      assignment starts PENDING. pending_qty = sum(assigned_qty).
    input_set: "AllocationEvent.requests present at lock time"
    constants:
      TIER_MULT_GOLD: 1.2
      TIER_MULT_SILVER: 1.0
      TIER_MULT_BRONZE: 0.8
    precision: "integer cases; floor on proportional shares; remainder distributed by weight desc, created_at asc"

  - name: performance_composite_score
    trigger: "POST /performance-reviews (computed at creation, stored on the review)"
    algorithm: weighted_scoring
    formula: |
      PINNED ORDER (mandatory):
        1. Round each input metric to 1 decimal place, round_half_up:
           d = round1(distribution_pct); f = round1(freshness_index); s = round1(share_pct)
        2. composite = w_d*d + w_f*f + w_s*s   (full precision intermediate)
        3. composite_score = round2_half_up(composite)
      Rounding each metric BEFORE weighting is required; rounding only the
      final sum produces different values and is non-conformant.
      Weight sets by weighting_profile_snapshot:
        STANDARD:     w_d=0.40, w_f=0.30, w_s=0.30
        SHARE_TILTED: w_d=0.25, w_f=0.25, w_s=0.50
      If composite_score < CORRECTIVE_FLOOR, a CorrectivePlan is auto-created
      (status PROPOSED, revision_count 0, target_snapshot copied from the
      wholesaler's ACTIVE agreement).
    input_set: "The new PerformanceReview row (freshness_index computed by keg_freshness_index for the same period)"
    constants:
      CORRECTIVE_FLOOR: 70.00
    precision: "inputs rounded to 1 decimal half_up before weighting; result 2 decimals half_up"
    variants:
      - name: STANDARD
        when: "wholesaler's ACTIVE agreement has weighting_profile == STANDARD"
        difference: "weights 0.40 / 0.30 / 0.30 (distribution / freshness / share)"
      - name: SHARE_TILTED
        when: "wholesaler's ACTIVE agreement has weighting_profile == SHARE_TILTED"
        difference: "weights 0.25 / 0.25 / 0.50 — same inputs yield a different composite than STANDARD"

  - name: keg_freshness_index
    trigger: "POST /performance-reviews (feeds performance_composite_score); per-audit staleness computed at POST /draft-audits"
    algorithm: aggregation
    formula: |
      Per audit (at creation): for each keg, age_days = floor((conducted_at - filled_at) / 86400).
      A keg is STALE when age_days >= 90; CRITICAL when age_days >= 120.
      Line cleaning: gap_days = floor((conducted_at - line_cleaning_last_at) / 86400);
      overdue when gap_days > account.line_cleaning_frequency_days;
      critically overdue when gap_days > 2 * account.line_cleaning_frequency_days.
      Review freshness_index (pooled across ALL audits of accounts served by the
      wholesaler whose conducted_at falls inside the review quarter window,
      inclusive of both window endpoints):
        total_bbl = sum(keg.volume_bbl over pooled kegs)
        stale_bbl = sum(keg.volume_bbl over pooled STALE kegs)
        freshness_index = 100.00 when total_bbl == 0 or there are no audits;
        else round2_half_up(100 - 100 * stale_bbl / total_bbl)
    input_set: "DraftAudits of RetailAccounts whose serving_wholesaler_id == review.wholesaler_id, conducted within [quarter_start, quarter_end] inclusive"
    constants:
      STALE_AGE_DAYS: 90
      CRITICAL_AGE_DAYS: 120
    precision: "2 decimal places, round_half_up"

  - name: pos_ytd_chargeable
    trigger: "POST /pos-grants (cap check); POST /pos-grants/{id}/void (recomputes chargeable)"
    algorithm: threshold
    formula: |
      ytd = sum(value_cents over PosGrants where account_id == account.id
                AND status == ISSUED AND granted_year == current logical-clock year)
      A new grant of value_cents V is allowed iff ytd + V <= cap(state_code).
      Cap is INCLUSIVE: ytd + V == cap is allowed; ytd + V == cap + 1 is rejected
      with ERR_POS_VALUE_CAP_EXCEEDED.
    input_set: "ISSUED PosGrants of the account in the current calendar year of the logical clock"
    constants:
      CAP_TX_CENTS: 30000
      CAP_CA_CENTS: 25000
      CAP_DEFAULT_CENTS: 20000
    precision: "integer cents; no rounding"

  - name: successor_qualification_score
    trigger: "POST /transfer-applications/{id}/qualification-review"
    algorithm: weighted_scoring
    formula: |
      score = round2_half_up(
        0.5 * buyer.financial_capacity_score
        + 0.3 * buyer.warehouse_capacity_score
        + 0.2 * buyer.market_coverage_score)
      Qualified iff score >= 70.00 (inclusive).
    input_set: "The buyer Wholesaler row referenced by buyer_wholesaler_id"
    constants:
      QUALIFY_THRESHOLD: 70.00
      FIN_WEIGHT: 0.5
      WH_WEIGHT: 0.3
      MKT_WEIGHT: 0.2
    precision: "2 decimal places, round_half_up"

  - name: book_concentration_rule
    trigger: "POST /agreements (eligibility gate at appointment)"
    algorithm: threshold
    formula: |
      competing = count of supplier_book entries with supplier_type in {CRAFT, IMPORT}
      total = count of all supplier_book entries
      Reject appointment with ERR_PORTFOLIO_CONCENTRATION_EXCEEDED when
        competing >= 4 AND (total == 0 OR competing / total > 0.50).
      Exactly 4 competing of 8 total (ratio 0.50) is ALLOWED (strict >).
    input_set: "supplier_book of the wholesaler being appointed"
    constants:
      COMPETING_MIN_COUNT: 4
      CONCENTRATION_LIMIT: 0.50
    precision: "ratio compared exactly; strict greater-than"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when
# several checks fail for one request)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty; X-User-Role must name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role in X-User-Role must appear in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: WholesalerPrincipal may only act where its X-User-ID equals the governing wholesaler id (seller on transfer create, ROFR holder on rofr-response, requester on allocation request, path wholesalerId on assignment decision, review wholesaler on review response, review wholesaler on plan revise, self on promotion opt-in)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /transfer-applications; POST /transfer-applications/{id}/rofr-response; POST /allocation-events/{id}/requests; POST /allocation-events/{id}/assignments/{wholesalerId}/decision; POST /performance-reviews/{id}/response; POST /corrective-plans/{id}/revise; POST /promotion-programs/{id}/opt-ins"
  - priority: 4
    category: business_constraint
    check: "Request body well-formedness: required fields present, types and enum members valid, unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Every id referenced in path or body (territory, wholesaler, agreement, transfer, event, account, review, plan, grant, program) must exist; path ids validated left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 6
    category: state
    check: "Target resource must be in a state from which the requested transition exists (terminal-state lockdown included). Domain state errors in this tier: ERR_TERRITORY_NOT_VACANT (agreement create on AWARDED territory), ERR_AGREEMENT_NOT_ACTIVE (amend or transfer-create on TERMINATED agreement), ERR_ACCOUNT_NOT_ACTIVE (POS grant to SERVICE_SUSPENDED account), ERR_WHOLESALER_NOT_ELIGIBLE (wholesaler not APPLICANT/APPOINTED where required, or SUSPENDED), ERR_REVIEW_NOT_ACKNOWLEDGED (plan activate before review ACKNOWLEDGED), ERR_ROFR_WINDOW_OPEN (decision while ROFR_OPEN), ERR_OPT_IN_WINDOW_CLOSED (opt-in on non-OPEN program)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition and gated-creation endpoints"
  - priority: 7
    category: business_safety
    check: "Three-tier regulatory prohibitions: transfer buyer must not hold a retail-tier interest; promotion programs must not carry a manufacturer-mandated retail price"
    error_id: "ERR_THREE_TIER_PROHIBITION | ERR_RETAIL_PRICE_MANDATE_PROHIBITED"
    http_status: 422
    applies_to: "POST /transfer-applications; POST /promotion-programs"
  - priority: 8
    category: business_constraint
    check: "Uniqueness, overlap, and structural caps: one pending transfer per agreement (ERR_TRANSFER_ALREADY_PENDING); one review per wholesaler per (period_year, period_quarter) (ERR_DUPLICATE_REVIEW); one request per wholesaler per allocation event (ERR_DUPLICATE_REQUEST); one opt-in per wholesaler per program (ERR_DUPLICATE_OPT_IN); half-open promotion windows for the same brand_code must not overlap — adjacency (ends_at == starts_at) is allowed (ERR_PROMOTION_WINDOW_OVERLAP); promotion ends_at must be strictly after starts_at (ERR_INVALID_WINDOW); allocation brand must be in the requesting wholesaler's ACTIVE agreement brand_scope (ERR_BRAND_SCOPE_MISMATCH); rofr_holder_wholesaler_id must differ from agreement.wholesaler_id and reference an existing non-TERMINATED wholesaler (ERR_ROFR_HOLDER_CONFLICT); book concentration rule (ERR_PORTFOLIO_CONCENTRATION_EXCEEDED)"
    error_id: "ERR_TRANSFER_ALREADY_PENDING | ERR_DUPLICATE_REVIEW | ERR_DUPLICATE_REQUEST | ERR_DUPLICATE_OPT_IN | ERR_PROMOTION_WINDOW_OVERLAP | ERR_INVALID_WINDOW | ERR_BRAND_SCOPE_MISMATCH | ERR_ROFR_HOLDER_CONFLICT | ERR_PORTFOLIO_CONCENTRATION_EXCEEDED"
    http_status: "409 | 422"
    applies_to: "POST /transfer-applications; POST /performance-reviews; POST /allocation-events/{id}/requests; POST /promotion-programs; POST /promotion-programs/{id}/opt-ins; POST /agreements"
  - priority: 9
    category: business_temporal
    check: "Minimum separation buffer: two accepted audits on the same account must have conducted_at values at least 7 days (604800 seconds) apart; gap exactly 604800 is allowed, 604799 rejected. Also: rofr-response and consummate must arrive no later than their deadlines (after the sweep, status has moved on and the state tier reports ERR_INVALID_STATE_TRANSITION)"
    error_id: ERR_AUDIT_TOO_SOON
    http_status: 409
    applies_to: "POST /draft-audits"
  - priority: 10
    category: business_fiscal
    check: "POS annual value cap per account per state law: ytd_chargeable + value_cents <= cap(account.state_code), inclusive boundary"
    error_id: ERR_POS_VALUE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /pos-grants"

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints; flat topology — FKs travel in bodies,
# reverse-reachability via sub-resource GETs)
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Setting the clock runs time-based sweeps: ROFR windows past deadline lapse (ROFR_OPEN -> ROFR_LAPSED), approved transfers past consummation deadline expire (APPROVED -> EXPIRED), promotion programs at/past ends_at close (OPEN -> CLOSED)."
    roles: [BrewerAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, rofr_lapsed_count: integer, consummation_expired_count: integer, promotions_closed_count: integer }
    side_effects: ["Time-based sweeps listed in description"]

  # --- Territory ---
  - method: POST
    path: "/territories"
    description: "Create an exclusive sales territory (born VACANT)"
    roles: [BrewerAdmin]
    code: 201
    input: [name, state_code]
    output: Territory
    side_effects: ["status=VACANT, incumbent_wholesaler_id=null, version=1"]

  - method: GET
    path: "/territories/{id}"
    description: "Get a Territory"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: []
    output: Territory
    side_effects: []

  - method: GET
    path: "/territories/{id}/agreements"
    description: "List agreements covering a territory (reverse reachability for Agreement.territory_id)"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Agreement[]
    side_effects: []

  # --- Agreement (brand equity agreement; born ACTIVE) ---
  - method: POST
    path: "/agreements"
    description: "Appoint a wholesaler to a VACANT territory with a brand equity agreement; agreement is born ACTIVE"
    roles: [BrewerAdmin]
    code: 201
    input: [territory_id, wholesaler_id, "rofr_holder_wholesaler_id?", brand_scope, "weighting_profile?", distribution_target_pct, freshness_target_index, share_target_pct, declared_distribution_pct, declared_freshness_index, declared_share_pct, term_years]
    output: Agreement
    side_effects:
      - "Territory VACANT -> AWARDED; incumbent_wholesaler_id := wholesaler_id"
      - "Wholesaler APPLICANT -> APPOINTED if this is its first ACTIVE agreement"
      - "Rejects: ERR_TERRITORY_NOT_VACANT, ERR_WHOLESALER_NOT_ELIGIBLE, ERR_ROFR_HOLDER_CONFLICT, ERR_PORTFOLIO_CONCENTRATION_EXCEEDED (book_concentration_rule)"

  - method: GET
    path: "/agreements/{id}"
    description: "Get an Agreement"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: []
    output: Agreement
    side_effects: []

  - method: POST
    path: "/agreements/{id}/amendments"
    description: "Amend an ACTIVE agreement's terms in place (OCC-guarded)"
    roles: [BrewerAdmin]
    code: 200
    input: [expected_agreement_version, "distribution_target_pct?", "freshness_target_index?", "share_target_pct?", "declared_distribution_pct?", "declared_freshness_index?", "declared_share_pct?", "brand_scope?", "weighting_profile?", "term_years?", "rofr_holder_wholesaler_id?"]
    output: Agreement
    side_effects:
      - "increments Agreement.version by 1"
      - "appends amendment_log entry { amended_at: logical clock, fields_changed }"
      - "ERR_STALE_VERSION (412) when expected_agreement_version != agreement.version; ERR_AGREEMENT_NOT_ACTIVE when TERMINATED"

  - method: GET
    path: "/agreements/{id}/equity-index"
    description: "Computed read: equity index per equity_index_score; variant query param PROVISIONAL (default) | AUDITED"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: ["variant?"]
    output: { variant: string, equity_index: number, distribution_component: number, freshness_component: number, share_component: number, components_source: string }
    side_effects: []

  - method: GET
    path: "/agreements/{id}/transfer-applications"
    description: "List transfer applications for an agreement (reverse reachability for TransferApplication.agreement_id)"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: TransferApplication[]
    side_effects: []

  # --- Wholesaler ---
  - method: POST
    path: "/wholesalers"
    description: "Register a wholesaler (born APPLICANT)"
    roles: [BrewerAdmin]
    code: 201
    input: [legal_name, home_state, license_number, tier, "holds_retail_interest?", financial_capacity_score, warehouse_capacity_score, market_coverage_score, "supplier_book?"]
    output: Wholesaler
    side_effects: ["status=APPLICANT, suspended_account_count=0, supplier_book defaults to []"]

  - method: GET
    path: "/wholesalers/{id}"
    description: "Get a Wholesaler"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: []
    output: Wholesaler
    side_effects: []

  - method: GET
    path: "/wholesalers/{id}/agreements"
    description: "List a wholesaler's agreements (reverse reachability for Agreement.wholesaler_id)"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Agreement[]
    side_effects: []

  - method: GET
    path: "/wholesalers/{id}/retail-accounts"
    description: "List retail accounts served by a wholesaler (reverse reachability for RetailAccount.serving_wholesaler_id)"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RetailAccount[]
    side_effects: []

  - method: GET
    path: "/wholesalers/{id}/performance-reviews"
    description: "List a wholesaler's performance reviews (reverse reachability for PerformanceReview.wholesaler_id)"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: PerformanceReview[]
    side_effects: []

  # --- Transfer application (seller initiates; compliance reviews/decides) ---
  - method: POST
    path: "/transfer-applications"
    description: "Seller wholesaler applies to transfer its agreement's territory award to a buyer wholesaler"
    roles: [WholesalerPrincipal]
    code: 201
    input: [agreement_id, buyer_wholesaler_id, purchase_price_cents]
    output: TransferApplication
    side_effects:
      - "status=SUBMITTED; seller_wholesaler_id copied from agreement.wholesaler_id"
      - "ERR_THREE_TIER_PROHIBITION when buyer.holds_retail_interest is true"
      - "ERR_TRANSFER_ALREADY_PENDING when another application for the same agreement is in SUBMITTED | QUALIFIED | ROFR_OPEN | ROFR_EXERCISED | ROFR_WAIVED | ROFR_LAPSED | APPROVED"

  - method: POST
    path: "/transfer-applications/{id}/qualification-review"
    description: "Compute successor_qualification_score and route SUBMITTED -> QUALIFIED | ROFR_OPEN | REJECTED"
    roles: [BrewerCompliance]
    code: 200
    input: []
    output: TransferApplication
    side_effects: ["qualification_score stored; rofr_deadline set when agreement has a ROFR holder and score >= 70.00"]

  - method: POST
    path: "/transfer-applications/{id}/rofr-response"
    description: "ROFR holder exercises or waives its right of first refusal (ROFR_OPEN only, on or before rofr_deadline)"
    roles: [WholesalerPrincipal]
    code: 200
    input: [decision]
    output: TransferApplication
    side_effects: ["decision=EXERCISE -> ROFR_EXERCISED; decision=WAIVE -> ROFR_WAIVED"]

  - method: POST
    path: "/transfer-applications/{id}/decision"
    description: "Compliance approves or rejects a qualified transfer (never from ROFR_OPEN: ERR_ROFR_WINDOW_OPEN)"
    roles: [BrewerCompliance]
    code: 200
    input: [decision, "reason?"]
    output: TransferApplication
    side_effects: ["APPROVE -> APPROVED: successor_wholesaler_id set (ROFR holder if exercised, else buyer), consummation_deadline := clock + 60 days; REJECT -> REJECTED"]

  - method: POST
    path: "/transfer-applications/{id}/consummate"
    description: "Consummate an APPROVED transfer within its consummation window; runs the full reassignment cascade"
    roles: [BrewerAdmin]
    code: 200
    input: []
    output: TransferApplication
    side_effects:
      - "Agreement -> TERMINATED; Territory incumbent swapped to successor; successor's new Agreement born ACTIVE"
      - "Successor APPLICANT -> APPOINTED on first ACTIVE agreement"
      - "Seller with zero remaining ACTIVE agreements -> TERMINATED, and its PENDING allocation assignments -> RELEASED"

  # --- Performance review & corrective plan ---
  - method: POST
    path: "/performance-reviews"
    description: "Publish a quarterly performance review (born PUBLISHED); computes freshness_index and composite_score; auto-creates a PROPOSED CorrectivePlan when composite < 70.00"
    roles: [BrewerAdmin]
    code: 201
    input: [wholesaler_id, period_year, period_quarter, distribution_pct, share_pct]
    output: PerformanceReview
    side_effects:
      - "keg_freshness_index and performance_composite_score execute; weighting_profile_snapshot copied from the wholesaler's ACTIVE agreement"
      - "composite_score < 70.00 -> auto-create CorrectivePlan (PROPOSED, revision_count 0, target_snapshot from agreement)"
      - "ERR_WHOLESALER_NOT_ELIGIBLE when wholesaler is APPLICANT or TERMINATED; ERR_DUPLICATE_REVIEW for a second review of the same wholesaler+period"

  - method: GET
    path: "/performance-reviews/{id}"
    description: "Get a PerformanceReview"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: []
    output: PerformanceReview
    side_effects: []

  - method: POST
    path: "/performance-reviews/{id}/response"
    description: "Reviewed wholesaler acknowledges or disputes a PUBLISHED review"
    roles: [WholesalerPrincipal]
    code: 200
    input: [action, "dispute_reason?"]
    output: PerformanceReview
    side_effects: ["action=ACKNOWLEDGE -> ACKNOWLEDGED; action=DISPUTE (requires dispute_reason) -> DISPUTED"]

  - method: GET
    path: "/performance-reviews/{id}/corrective-plans"
    description: "List corrective plans spawned by a review (reverse reachability for CorrectivePlan.review_id)"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CorrectivePlan[]
    side_effects: []

  - method: POST
    path: "/corrective-plans/{id}/activate"
    description: "Activate a PROPOSED corrective plan (requires the parent review ACKNOWLEDGED)"
    roles: [BrewerCompliance]
    code: 200
    input: []
    output: CorrectivePlan
    side_effects: ["status PROPOSED -> ACTIVE; ERR_REVIEW_NOT_ACKNOWLEDGED while review is PUBLISHED or DISPUTED"]

  - method: POST
    path: "/corrective-plans/{id}/resolve"
    description: "Resolve an ACTIVE plan VERIFIED or FAILED; VERIFIED reinstates a SUSPENDED wholesaler"
    roles: [BrewerCompliance]
    code: 200
    input: [outcome, "resolution_notes?"]
    output: CorrectivePlan
    side_effects: ["outcome=VERIFIED -> VERIFIED (+ wholesaler SUSPENDED -> APPOINTED); outcome=FAILED -> FAILED"]

  - method: POST
    path: "/corrective-plans/{id}/revise"
    description: "Wholesaler resubmits a FAILED plan for another round (cycle: FAILED -> PROPOSED)"
    roles: [WholesalerPrincipal]
    code: 200
    input: []
    output: CorrectivePlan
    side_effects: ["status FAILED -> PROPOSED; revision_count += 1"]

  # --- Limited-release allocation ---
  - method: POST
    path: "/allocation-events"
    description: "Create a limited-release allocation event (born OPEN)"
    roles: [BrewerAdmin]
    code: 201
    input: [brand_code, total_qty_cases, "min_guarantee_cases?", "territory_cap_pct?"]
    output: AllocationEvent
    side_effects: ["status=OPEN; requests/assignments empty; committed/pending/released = 0; unassigned_remainder null until lock"]

  - method: GET
    path: "/allocation-events/{id}"
    description: "Get an AllocationEvent including requests, assignments, and quantity ledger fields"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: []
    output: AllocationEvent
    side_effects: []

  - method: POST
    path: "/allocation-events/{id}/requests"
    description: "Wholesaler requests a quantity from an OPEN event"
    roles: [WholesalerPrincipal]
    code: 201
    input: [requested_qty_cases]
    output: AllocationEvent
    side_effects:
      - "Appends { wholesaler_id: X-User-ID, requested_qty_cases, created_at: logical clock } to requests"
      - "ERR_WHOLESALER_NOT_ELIGIBLE unless wholesaler is APPOINTED; ERR_BRAND_SCOPE_MISMATCH when event brand not in an ACTIVE agreement's brand_scope; ERR_DUPLICATE_REQUEST for a second request by the same wholesaler"

  - method: POST
    path: "/allocation-events/{id}/lock"
    description: "Lock an OPEN event and run the waterfall assignment"
    roles: [BrewerAdmin]
    code: 200
    input: []
    output: AllocationEvent
    side_effects: ["allocation_waterfall_assignment executes; assignments materialized PENDING; unassigned_remainder and pending_qty frozen"]

  - method: POST
    path: "/allocation-events/{id}/assignments/{wholesalerId}/decision"
    description: "Wholesaler confirms or releases its own PENDING/CONFIRMED assignment (CONFIRM | RELEASE)"
    roles: [WholesalerPrincipal]
    code: 200
    input: [decision]
    output: AllocationEvent
    side_effects:
      - "CONFIRM: PENDING -> CONFIRMED (pending_qty -= q, committed_qty += q); RELEASE from PENDING or CONFIRMED -> RELEASED (released_qty += q; pending_qty or committed_qty -= q); both decisions remain legal while the event is LOCKED or CLOSED"
      - "Event LOCKED -> CLOSED when pending_qty reaches 0"
      - "Conservation: committed_qty + pending_qty + released_qty + unassigned_remainder == total_qty_cases after every decision"

  # --- Retail accounts & draft quality ---
  - method: POST
    path: "/retail-accounts"
    description: "Register an on-premise retail account served by a wholesaler (born ACTIVE)"
    roles: [BrewerAdmin]
    code: 201
    input: [name, state_code, serving_wholesaler_id, "line_cleaning_frequency_days?"]
    output: RetailAccount
    side_effects: ["status=ACTIVE; line_cleaning_frequency_days defaults to 14"]

  - method: GET
    path: "/retail-accounts/{id}"
    description: "Get a RetailAccount"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: []
    output: RetailAccount
    side_effects: []

  - method: GET
    path: "/retail-accounts/{id}/draft-audits"
    description: "List draft-quality audits of an account (reverse reachability for DraftAudit.account_id)"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: DraftAudit[]
    side_effects: []

  - method: POST
    path: "/draft-audits"
    description: "Record a completed draft-quality audit; computes staleness, line-cleaning status, and result; a CRITICAL_FAIL suspends the account and may cascade to the wholesaler"
    roles: [DraftAuditor]
    code: 201
    input: [account_id, conducted_at, line_cleaning_last_at, kegs]
    output: DraftAudit
    side_effects:
      - "keg staleness/line-cleaning computation per keg_freshness_index; result PASS | FAIL | CRITICAL_FAIL"
      - "CRITICAL_FAIL: account ACTIVE -> SERVICE_SUSPENDED, wholesaler.suspended_account_count += 1; at 3 the wholesaler is SUSPENDED and its PENDING assignments are RELEASED"
      - "PASS on a SERVICE_SUSPENDED account: account -> ACTIVE, suspended_account_count -= 1"
      - "On success updates account.last_audit_at; ERR_AUDIT_TOO_SOON when conducted_at < last_audit_at + 7 days"

  - method: GET
    path: "/retail-accounts/{id}/pos-grants"
    description: "List POS grants issued to an account (reverse reachability for PosGrant.account_id)"
    roles: [BrewerAdmin, BrewerCompliance, WholesalerPrincipal, DraftAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: PosGrant[]
    side_effects: []

  # --- POS material provision (state-law value caps) ---
  - method: POST
    path: "/pos-grants"
    description: "Issue point-of-sale material to an account within the state-law annual value cap"
    roles: [BrewerAdmin]
    code: 201
    input: [account_id, item_description, value_cents]
    output: PosGrant
    side_effects:
      - "status=ISSUED; granted_year := logical-clock year"
      - "ERR_ACCOUNT_NOT_ACTIVE for SERVICE_SUSPENDED accounts; ERR_POS_VALUE_CAP_EXCEEDED when ytd + value exceeds the state cap (inclusive cap boundary)"

  - method: POST
    path: "/pos-grants/{id}/void"
    description: "Void an ISSUED grant; the value stops counting against the account's chargeable year-to-date"
    roles: [BrewerAdmin]
    code: 200
    input: []
    output: PosGrant
    side_effects: ["status ISSUED -> VOIDED; voided_at := logical clock; ytd_chargeable recomputed excluding VOIDED grants"]

  # --- Promotion programs (three-tier constrained) ---
  - method: POST
    path: "/promotion-programs"
    description: "Create a promotion program with a half-open [starts_at, ends_at) window; manufacturer-mandated retail price is prohibited"
    roles: [BrewerAdmin]
    code: 201
    input: [brand_code, starts_at, ends_at, suggested_discount_pct, "mandated_retail_price_cents?"]
    output: PromotionProgram
    side_effects:
      - "status=OPEN; opt_ins empty"
      - "ERR_RETAIL_PRICE_MANDATE_PROHIBITED when mandated_retail_price_cents is present and non-null; ERR_INVALID_WINDOW when ends_at <= starts_at; ERR_PROMOTION_WINDOW_OVERLAP when another non-CLOSED program for the same brand_code overlaps (adjacency allowed)"

  - method: POST
    path: "/promotion-programs/{id}/opt-ins"
    description: "Wholesaler opts itself into an OPEN promotion program for a brand in its agreement scope"
    roles: [WholesalerPrincipal]
    code: 201
    input: []
    output: PromotionProgram
    side_effects:
      - "Appends { wholesaler_id: X-User-ID, opted_at: logical clock } to opt_ins"
      - "ERR_OPT_IN_WINDOW_CLOSED unless program OPEN and clock < ends_at; ERR_WHOLESALER_NOT_ELIGIBLE unless APPOINTED; ERR_BRAND_SCOPE_MISMATCH when brand outside ACTIVE agreement scope; ERR_DUPLICATE_OPT_IN on a second opt-in"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty, or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "WholesalerPrincipal X-User-ID does not match the governing wholesaler id for the operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, invalid enum member, or unknown field" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id in path or body does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Trigger invoked from a state with no such transition, including terminal-state lockdown and post-sweep states (ROFR_LAPSED, EXPIRED)" }
  - { id: ERR_TERRITORY_NOT_VACANT, http: 409, condition: "Agreement creation on a territory already AWARDED" }
  - { id: ERR_WHOLESALER_NOT_ELIGIBLE, http: 409, condition: "Wholesaler in wrong lifecycle state for the operation (SUSPENDED, TERMINATED, or APPLICANT where APPOINTED is required); also successor TERMINATED at consummation" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Amendment or transfer creation attempted on a TERMINATED agreement" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "POS grant issued to a SERVICE_SUSPENDED account" }
  - { id: ERR_REVIEW_NOT_ACKNOWLEDGED, http: 409, condition: "Corrective plan activation while the parent review is PUBLISHED or DISPUTED" }
  - { id: ERR_ROFR_WINDOW_OPEN, http: 409, condition: "Decision attempted while the right-of-first-refusal window is still unresolved (ROFR_OPEN)" }
  - { id: ERR_OPT_IN_WINDOW_CLOSED, http: 409, condition: "Opt-in attempted on a CLOSED promotion program or at/after ends_at" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_agreement_version does not match the agreement's current version (OCC)" }
  - { id: ERR_THREE_TIER_PROHIBITION, http: 422, condition: "Transfer buyer holds a retail-tier ownership interest (three-tier violation)" }
  - { id: ERR_RETAIL_PRICE_MANDATE_PROHIBITED, http: 422, condition: "Promotion program carries a manufacturer-mandated retail price" }
  - { id: ERR_TRANSFER_ALREADY_PENDING, http: 409, condition: "Another transfer application for the same agreement is in a non-terminal state" }
  - { id: ERR_DUPLICATE_REVIEW, http: 409, condition: "A review already exists for the wholesaler and (period_year, period_quarter)" }
  - { id: ERR_DUPLICATE_REQUEST, http: 409, condition: "Wholesaler already has a request on the allocation event" }
  - { id: ERR_DUPLICATE_OPT_IN, http: 409, condition: "Wholesaler already opted into the promotion program" }
  - { id: ERR_PROMOTION_WINDOW_OVERLAP, http: 409, condition: "Half-open window overlaps another non-CLOSED program for the same brand_code; adjacency (ends_at == starts_at) is allowed" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Promotion ends_at is not strictly after starts_at" }
  - { id: ERR_BRAND_SCOPE_MISMATCH, http: 422, condition: "Brand not present in the acting wholesaler's ACTIVE agreement brand_scope" }
  - { id: ERR_ROFR_HOLDER_CONFLICT, http: 422, condition: "rofr_holder_wholesaler_id equals the appointed wholesaler, or references a missing/TERMINATED wholesaler" }
  - { id: ERR_PORTFOLIO_CONCENTRATION_EXCEEDED, http: 409, condition: "Book concentration rule: >= 4 competing (CRAFT/IMPORT) suppliers and competing ratio > 0.50" }
  - { id: ERR_AUDIT_TOO_SOON, http: 409, condition: "Second accepted audit on the same account less than 7 days (604800 s) after the previous one" }
  - { id: ERR_POS_VALUE_CAP_EXCEEDED, http: 422, condition: "Grant would push the account's chargeable year-to-date POS value above its state-law cap" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BrewerAdmin
    description: "Manufacturer operations: territories, wholesaler registry, equity agreements and amendments, limited-release allocations, reviews, POS material, promotion programs, logical clock"
    identity: opaque
    exclusive_operations: ["POST /territories", "POST /agreements", "POST /agreements/{id}/amendments", "POST /wholesalers", "POST /performance-reviews", "POST /allocation-events", "POST /allocation-events/{id}/lock", "POST /retail-accounts", "POST /pos-grants", "POST /pos-grants/{id}/void", "POST /promotion-programs", "POST /transfer-applications/{id}/consummate", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: BrewerCompliance
    description: "Manufacturer regulatory/compliance office: transfer qualification and decisions, corrective-plan activation and resolution; deliberately segregated from BrewerAdmin's creation powers"
    identity: opaque
    exclusive_operations: ["POST /transfer-applications/{id}/qualification-review", "POST /transfer-applications/{id}/decision", "POST /corrective-plans/{id}/activate", "POST /corrective-plans/{id}/resolve"]
    shared_operations: ["all GET endpoints"]
  - name: WholesalerPrincipal
    description: "Principal of a specific wholesaler; acts only where X-User-ID equals the governing wholesaler id"
    identity: "entity_backed:Wholesaler"
    exclusive_operations: ["POST /transfer-applications", "POST /transfer-applications/{id}/rofr-response", "POST /allocation-events/{id}/requests", "POST /allocation-events/{id}/assignments/{wholesalerId}/decision", "POST /performance-reviews/{id}/response", "POST /corrective-plans/{id}/revise", "POST /promotion-programs/{id}/opt-ins"]
    shared_operations: ["all GET endpoints"]
  - name: DraftAuditor
    description: "Field quality auditor conducting draft-quality audits; no commercial powers"
    identity: opaque
    exclusive_operations: ["POST /draft-audits"]
    shared_operations: ["all GET endpoints"]
