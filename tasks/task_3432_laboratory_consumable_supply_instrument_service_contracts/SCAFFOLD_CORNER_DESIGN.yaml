            - "BREAK_FIX on the same instrument succeeds with 201 (conditional validation)"

      - name: second_surge_same_group_rejected
        claim_type: violation_to_error
        grounds: ["state_machines.SurgeEvent", "errors[ERR_SURGE_ALREADY_ACTIVE]"]
        distinguishing_aspect: "One ACTIVE surge per allocation_group: a second create on GROUP_C fails 409 ERR_SURGE_ALREADY_ACTIVE while a different group (GROUP_B) is accepted."
