# =============================================================================
# Scaffold Difficulty Design — Test Targeting Index
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty Rules.
# Every grounds[*] reference resolves into SCAFFOLD.yaml.
# Every assert[*] using a numeric literal is the actual result of running the formula
# by hand on the pinned setup inputs.
# =============================================================================

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rent_schedule_stepped_vs_annual
        grounds:
          - calculations.rent_schedule_generation
          - calculations.rent_schedule_generation.variants.linear_no_escalation
          - calculations.rent_schedule_generation.variants.stepped_escalation
          - entities.Lease.fields.escalation_mode
          - entities.Lease.fields.stepped_schedule
          - state_machines.Lease.DRAFT_to_SIGNED
        distinguishing_aspect: |
          Operates on the Lease entity domain (rent revenue). Same monthly rent inputs
          produce different total rent over the lease term under STEPPED vs ANNUAL escalation
          because STEPPED uses table lookup at arbitrary effective_from dates while ANNUAL
          uses anniversary-based compounding from start_date.
        test_recipe:
          setup:
            - "Building B1 created"
            - "Unit U1 (area=100 sqm) created under B1, status=VACANT"
            - "Tenant T1 created, qualification_status=APPROVED"
            - "Lease L_annual: unit=U1, tenant=T1, start_date=2026-01-01, end_date=2026-12-01, base_monthly_rent_cents=100000, escalation_mode=ANNUAL, escalation_pct_bps=500, deposit_months=1"
            - "Lease L_stepped: same dates, base=100000, escalation_mode=STEPPED, stepped_schedule=[{effective_from:2026-01-01, monthly_rent_cents:100000},{effective_from:2026-07-01, monthly_rent_cents:110000}], deposit_months=1"
          trigger:
            - "POST /leases/L_annual/sign"
            - "GET /leases/L_annual/rent-schedule"
            - "POST /leases/L_stepped/sign  (on a different unit U2 created the same way to avoid overlap)"
            - "GET /leases/L_stepped/rent-schedule"
          assert:
            - "L_annual total sum(RentScheduleItem.net_rent_cents) == 1100000 (11 months × 100000, years_elapsed=0 for all months in year 1)"
            - "L_stepped total sum(RentScheduleItem.net_rent_cents) == 1150000 (6 months × 100000 + 5 months × 110000)"
            - "L_annual total != L_stepped total (1100000 vs 1150000)"

      - name: energy_sub_meter_vs_allocated
        grounds:
          - calculations.energy_fee_calc
          - calculations.energy_fee_calc.variants.sub_meter_actual
          - calculations.energy_fee_calc.variants.allocated_by_area
          - entities.FeeBill.fields.energy_mode
          - entities.FeeBill.fields.sub_meter_kwh
          - entities.FeeBill.fields.shared_total_kwh
          - entities.FeeBill.fields.shared_meter_group_unit_ids
          - endpoints[POST /fee-bills]
        distinguishing_aspect: |
          Operates on the FeeBill entity domain (energy cost), distinct from the Lease rent
          domain above. For the SAME unit consuming 200 kWh, SUB_METER charges only the
          actual reading × tariff, whereas ALLOCATED distributes the group's 1000 shared kWh
          across units by area share, producing a different cents amount even when the same
          physical kWh quantity is consumed.
        test_recipe:
          setup:
            - "Building B1, two units U1 (area=100) and U2 (area=300) under B1"
            - "Tenants T1 and T2 approved; Leases L1 (U1↔T1) and L2 (U2↔T2) signed+activated"
            - "Clock advanced to 2026-02-15"
          trigger:
            - "POST /fee-bills body={lease_id:L1, bill_kind:ENERGY_FEE, period_start:2026-01-01, period_end:2026-02-01, energy_mode:SUB_METER, sub_meter_kwh:200, tariff_per_kwh_cents:50}  → bill_A"
            - "POST /fee-bills body={lease_id:L1, bill_kind:ENERGY_FEE, period_start:2026-02-01, period_end:2026-03-01, energy_mode:ALLOCATED, shared_total_kwh:1000, shared_meter_group_unit_ids:[U1,U2], tariff_per_kwh_cents:50}  → bill_B"
          assert:
            - "bill_A.amount_cents == 10000  (200 × 50)"
            - "bill_B.amount_cents == 12500  (1000 × (100/400) × 50 = 250 × 50)"
            - "bill_A.amount_cents != bill_B.amount_cents (10000 vs 12500) although both bills cover unit U1"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: property_fee_with_cap_and_modes
        grounds:
          - calculations.property_fee_calc
          - entities.FeeBill.fields.property_fee_mode
          - entities.FeeBill.fields.rate_per_sqm_per_month_cents
          - entities.Unit.fields.area_sqm
          - endpoints[POST /fee-bills]
        distinguishing_aspect: |
          Mode (a): a formula with ≥3 inputs (unit.area_sqm × rate × months) bounded by a
          non-linear cap (PROPERTY_FEE_CAP_CENTS_PER_SQM_PER_MONTH × area × months) chosen
          via min(). Switching from BY_AREA at high rates to FIXED_RATE changes which input
          the cap binds against, producing different amounts for the same physical unit.
        test_recipe:
          setup:
            - "Building B1, Unit U1 with area_sqm=100, Lease L1 ACTIVE on U1 with tenant T1"
            - "Clock at 2026-03-15"
          trigger:
            - "POST /fee-bills body={lease_id:L1, bill_kind:PROPERTY_FEE, period_start:2026-01-01, period_end:2026-02-01, property_fee_mode:BY_AREA, rate_per_sqm_per_month_cents:6000} → bill_high_rate"
            - "POST /fee-bills body={lease_id:L1, bill_kind:PROPERTY_FEE, period_start:2026-02-01, period_end:2026-03-01, property_fee_mode:BY_AREA, rate_per_sqm_per_month_cents:3000} → bill_low_rate"
          assert:
            - "bill_high_rate.amount_cents == 500000  (raw 100×6000×1=600000 capped at 5000×100×1=500000)"
            - "bill_low_rate.amount_cents == 300000  (raw 100×3000×1=300000, below cap 500000)"
            - "bill_high_rate.amount_cents == cap_value, confirming min() of the raw product and the cap; bill_low_rate.amount_cents < cap_value, confirming min() returns the raw"

      - name: energy_allocation_rounding_order
        grounds:
          - calculations.energy_fee_calc
          - calculations.energy_fee_calc.formula
          - calculations.energy_fee_calc.precision
          - entities.FeeBill.fields.shared_total_kwh
          - entities.FeeBill.fields.shared_meter_group_unit_ids
        distinguishing_aspect: |
          Mode (b): nested rounding where ORDER MATTERS. The scaffold pins per-line round
          (round_half_up per unit bill, then sum) with the canonical (lex-smallest unit_id)
          absorbing the integer-cent remainder so the group sum equals the un-rounded total
          exactly. Naive sum-then-round would give a different value (34 cents vs 33 cents
          on the pinned setup); the scaffold pins per-line-then-sum-with-remainder.
        test_recipe:
          setup:
            - "Building B1, Units U_a and U_b (lexicographically U_a < U_b, both area_sqm=100)"
            - "Leases L_a (U_a↔T_a) and L_b (U_b↔T_b) both ACTIVE"
          trigger:
            - "POST /fee-bills body={lease_id:L_a, bill_kind:ENERGY_FEE, period_start:2026-01-01, period_end:2026-02-01, energy_mode:ALLOCATED, shared_total_kwh:1.0, shared_meter_group_unit_ids:[U_a, U_b], tariff_per_kwh_cents:33}  → bill_A"
            - "POST /fee-bills body={lease_id:L_b, bill_kind:ENERGY_FEE, period_start:2026-01-01, period_end:2026-02-01, energy_mode:ALLOCATED, shared_total_kwh:1.0, shared_meter_group_unit_ids:[U_a, U_b], tariff_per_kwh_cents:33}  → bill_B"
          assert:
            - "bill_A.amount_cents == 16  (canonical U_a absorbs -1 cent so group sum equals round_half_up(1.0 × 33) = 33)"
            - "bill_B.amount_cents == 17  (non-canonical receives the round_half_up of 0.5×33 = 16.5 → 17)"
            - "bill_A.amount_cents + bill_B.amount_cents == 33  (group sum exactly matches the un-rounded total; per-line then sum-with-remainder, NOT sum-then-round which would give 33 evenly split as 16+17 or 17+16 depending on order)"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lease_amendment_cycle
        grounds:
          - state_machines.Lease.ACTIVE_to_AMENDMENT_PENDING
          - state_machines.Lease.AMENDMENT_PENDING_to_ACTIVE  # amend-confirm
          - state_machines.Lease.AMENDMENT_PENDING_to_ACTIVE  # amend-cancel cycle
          - entities.Lease.fields.amendment_count
        distinguishing_aspect: |
          Cycle on the Lease entity: ACTIVE → AMENDMENT_PENDING → ACTIVE (via either confirm
          or cancel), and the cycle can repeat any number of times, tracked by amendment_count.
          This is a true cycle, not a linear chain.
        test_recipe:
          setup:
            - "Lease L1 in ACTIVE state on Unit U1 (T1), base_monthly_rent_cents=100000"
            - "amendment_count = 0"
          trigger:
            - "POST /leases/L1/amend body={new_base_monthly_rent_cents:110000, effective_from:2026-04-01}  →  Lease.status=AMENDMENT_PENDING"
            - "POST /leases/L1/amend-cancel  →  Lease.status=ACTIVE (cycle 1)"
            - "POST /leases/L1/amend body={new_base_monthly_rent_cents:120000, effective_from:2026-04-01}  →  Lease.status=AMENDMENT_PENDING"
            - "POST /leases/L1/amend-confirm (as FinanceOfficer)  →  Lease.status=ACTIVE (cycle 2)"
          assert:
            - "Final Lease.status == 'ACTIVE'"
            - "Final Lease.amendment_count == 1  (cancel does not increment; only confirm does)"
            - "Lease.base_monthly_rent_cents == 120000 after the confirmed amendment"

      - name: deposit_parallel_dimensions
        grounds:
          - entities.Deposit.fields.frozen_status
          - entities.Deposit.fields.adjustment_status
          - state_machines.Deposit
          - state_machines.Lease.ACTIVE_to_TERMINATING
        distinguishing_aspect: |
          Parallel state dimensions on the Deposit entity: frozen_status ∈ {UNFROZEN, FROZEN}
          and adjustment_status ∈ {AT_REST, ADJUSTMENT_PENDING, DEDUCTION_PENDING_APPROVAL,
          SETTLED} evolve independently. A move-out request flips frozen_status to FROZEN
          while adjustment_status can still independently transition AT_REST →
          DEDUCTION_PENDING_APPROVAL. Different entity from Rule 3 instance 1.
        test_recipe:
          setup:
            - "Lease L1 ACTIVE on U1, Deposit D1 with frozen_status=UNFROZEN, adjustment_status=AT_REST, collected_cents=100000, required_cents=100000"
            - "Clock at 2026-02-01"
          trigger:
            - "POST /leases/L1/move-out-request body={target_move_out_date:2026-04-01}  →  Lease=TERMINATING, D1.frozen_status=FROZEN, D1.adjustment_status still AT_REST"
            - "POST /move-out-requests/M1/record-inspection body={inspection_findings:[]}"
            - "POST /move-out-requests/M1/confirm-restoration body={restoration_done:true}"
            - "POST /deposits/D1/propose-deductions body={deduction_items:[{kind:CLEANING, amount_cents:1000, note:'x'}]}  →  D1.adjustment_status=DEDUCTION_PENDING_APPROVAL"
          assert:
            - "After move-out-request: D1.frozen_status == 'FROZEN' AND D1.adjustment_status == 'AT_REST' (parallel evolution)"
            - "After propose-deductions: D1.frozen_status == 'FROZEN' AND D1.adjustment_status == 'DEDUCTION_PENDING_APPROVAL' (both dimensions changed independently from their initial values)"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: lease_finalize_depth_4_cascade
        grounds:
          - state_machines.Lease.TERMINATING_to_TERMINATED
          - state_machines.MoveOutRequest.DEDUCTION_APPROVED_to_SETTLED
          - state_machines.Unit.LEASED_to_VACANT
          - calculations.tenant_deposit_ledger
          - entities.RentScheduleItem.fields.status
          - entities.AuditEvent
        distinguishing_aspect: |
          Depth-4 transitive cascade triggered by POST /move-out-requests/:request_id/finalize:
          (1) Lease.status TERMINATING → TERMINATED;
          (2) caused by (1): MoveOutRequest.status DEDUCTION_APPROVED → SETTLED (Unit cascade
              gated on Deposit.adjustment_status == SETTLED);
          (3) caused by (2): Unit.status LEASED → VACANT;
          (4) caused by (3): future RentScheduleItem rows past terminated_on → VOIDED;
          and an AuditEvent CONTRACT_TERMINATED is appended. Each hop is caused by the
          previous hop, not directly by the finalize call.
        test_recipe:
          setup:
            - "Lease L1 ACTIVE on U1 (status=LEASED) from 2026-01-01 to 2026-12-01, base_monthly_rent_cents=100000"
            - "MoveOutRequest M1 in DEDUCTION_APPROVED state"
            - "Deposit D1 with adjustment_status=SETTLED, retained_cents=0, refunded_cents=100000"
            - "All FeeBill rows for L1 are PAID"
            - "Clock advanced to 2026-04-01"
          trigger:
            - "POST /move-out-requests/M1/finalize (as FinanceOfficer)"
          assert:
            - "Lease L1.status == 'TERMINATED' (hop 1)"
            - "Lease L1.terminated_on == M1.target_move_out_date (e.g., 2026-04-01)"
            - "MoveOutRequest M1.status == 'SETTLED' (hop 2 — cascaded from hop 1)"
            - "Unit U1.status == 'VACANT' (hop 3 — cascaded from hop 2 because Deposit was already SETTLED)"
            - "Every RentScheduleItem where period_start > 2026-04-01 has status == 'VOIDED' (hop 4 — cascaded from hop 1)"
            - "A new AuditEvent exists with subject_kind=='LEASE', subject_id==L1.id, action=='CONTRACT_TERMINATED'"

      - name: unit_split_depth_3_cascade
        grounds:
          - state_machines.Unit.VACANT_to_RETIRED  # split
          - entities.Unit.fields.parent_unit_id
          - calculations.unit_status_derivation
          - entities.AuditEvent.fields.action
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /buildings/:building_id/units/:unit_id/split,
          originating from a DIFFERENT transition than the finalize cascade above:
          (1) parent Unit.status VACANT → RETIRED;
          (2) caused by (1): N child Unit rows created with parent_unit_id=parent.id, each
              with derived status=VACANT (per unit_status_derivation evaluation order — no
              renovation interval, no lease, → VACANT);
          (3) caused by (2): an AuditEvent UNIT_SPLIT row is appended capturing the parent+child
              mapping (depth 2). Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Building B1, Unit U_parent (area_sqm=100, status=VACANT, code='A')"
          trigger:
            - "POST /buildings/B1/units/U_parent/split body={child_units:[{floor:1, code:'A1', area_sqm:40, orientation:N, usage_type:OFFICE, rent_reference_per_sqm:100}, {floor:1, code:'A2', area_sqm:60, orientation:N, usage_type:OFFICE, rent_reference_per_sqm:100}]}"
          assert:
            - "U_parent.status == 'RETIRED' (hop 1)"
            - "Exactly two new Unit rows exist with parent_unit_id == U_parent.id (hop 2)"
            - "Each child Unit has status == 'VACANT' (derived per unit_status_derivation step 5)"
            - "Sum of children.area_sqm == U_parent.area_sqm == 100.00 (constraint)"
            - "Exactly one AuditEvent exists with action=='UNIT_SPLIT' and subject_id==U_parent.id (hop 3)"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_on_lease_sign
        grounds:
          - validations[priority=5]   # state
          - validations[priority=6]   # business_referential
          - errors.ERR_INVALID_STATE
          - errors.ERR_TENANT_NOT_APPROVED
          - state_machines.Lease.DRAFT_to_SIGNED
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_referential (priority 6). A Lease in SIGNED
          state (already signed) whose Tenant.qualification_status is PENDING_REVIEW would
          simultaneously fail both checks if /sign is re-invoked. Priority 5 must win and
          ERR_INVALID_STATE is returned, NOT ERR_TENANT_NOT_APPROVED.
        test_recipe:
          setup:
            - "Tenant T1 created with qualification_status=APPROVED"
            - "Building B1, Unit U1 VACANT, Lease L1 created in DRAFT on U1↔T1 with valid dates"
            - "POST /leases/L1/sign  →  L1.status=SIGNED, U1 cascades to LEASED"
            - "POST /tenants/T1/revoke-approval  →  T1.qualification_status=PENDING_REVIEW (NB: per state_machines.Tenant.APPROVED→PENDING_REVIEW precondition, this requires no Lease in {DRAFT,SIGNED,ACTIVE,AMENDMENT_PENDING,TERMINATING} for T1 — so the test variant is: create T1, sign L1, terminate L1 fully through move-out → L1.status=TERMINATED, then revoke T1's approval; then re-attempt POST /leases/L1/sign — L1 is now TERMINATED and T1 is PENDING_REVIEW)"
          trigger:
            - "POST /leases/L1/sign  (L1.status is currently TERMINATED, NOT DRAFT; T1.qualification_status is PENDING_REVIEW)"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_INVALID_STATE' (priority 5 wins over priority 6; state check is evaluated first)"
            - "Response data.error_id != 'ERR_TENANT_NOT_APPROVED' (lower-priority business_referential check is masked)"

      - name: business_safety_vs_business_temporal_on_lease_sign
        grounds:
          - validations[priority=7]   # business_safety: renovation conflict
          - validations[priority=8]   # business_temporal: lease overlap
          - errors.ERR_RENOVATION_LEASE_CONFLICT
          - errors.ERR_LEASE_OVERLAP
          - state_machines.Lease.DRAFT_to_SIGNED
        distinguishing_aspect: |
          Pair: business_safety (priority 7, ERR_RENOVATION_LEASE_CONFLICT) vs business_temporal
          (priority 8, ERR_LEASE_OVERLAP). Different category pair from instance 1's
          {state, business_referential}. A single POST /leases/:lease_id/sign request can
          simultaneously trip both checks: the candidate lease overlaps an existing signed
          lease AND its [start_date, end_date) overlaps the unit's renovation interval.
          Priority 7 wins; ERR_RENOVATION_LEASE_CONFLICT is returned, not ERR_LEASE_OVERLAP.
        test_recipe:
          setup:
            - "Building B1, Unit U1 (area=100, status=VACANT)"
            - "Tenant T1 APPROVED"
            - "POST /buildings/B1/units/U1/start-renovation body={renovation_start_date:2026-04-01, renovation_end_date:2026-04-15}  →  U1.status=UNDER_RENOVATION"
            - "POST /buildings/B1/units/U1/finish-renovation  →  U1.status=VACANT (renovation dates retained for overlap reference)"
            - "Lease L_existing created and SIGNED on U1 with start_date=2026-04-20, end_date=2026-12-01 (start_date is renovation_end_date+5, outside buffer)"
            - "Lease L_candidate created in DRAFT on U1 with start_date=2026-04-10, end_date=2026-05-01 (overlaps renovation [2026-04-01,2026-04-16] AND overlaps L_existing on 2026-04-20→2026-05-01)"
          trigger:
            - "POST /leases/L_candidate/sign"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_RENOVATION_LEASE_CONFLICT' (priority 7 wins over priority 8)"
            - "data.error_id != 'ERR_LEASE_OVERLAP' (the overlap exists but is masked by higher-priority safety check)"
            - "Different error-category pair than instance 1: this instance exercises {business_safety, business_temporal}; instance 1 exercises {state, business_referential}"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: move_out_lead_time_30_day_boundary
        grounds:
          - validations[priority=9]
          - errors.ERR_MOVE_OUT_LEAD_TIME
          - state_machines.Lease.ACTIVE_to_TERMINATING
          - endpoints[POST /leases/:lease_id/move-out-request]
        distinguishing_aspect: |
          Numeric threshold crossing on a temporal metric: target_move_out_date >=
          current_server_date + 30 days. At exactly 30 days the request is accepted;
          at 29 days it is rejected. The boundary is on a temporal-day count and is
          reached via the move-out-request endpoint.
        test_recipe:
          setup:
            - "Lease L1 ACTIVE on U1 from 2026-01-01 to 2026-12-01"
            - "Clock advanced to 2026-02-01 00:00:00 UTC"
          trigger:
            - "POST /leases/L1/move-out-request body={target_move_out_date:2026-03-02}  (exactly 29 days ahead → reject)"
            - "POST /leases/L1/move-out-request body={target_move_out_date:2026-03-03}  (exactly 30 days ahead → accept)"
          assert:
            - "First request: HTTP 409, data.error_id == 'ERR_MOVE_OUT_LEAD_TIME'"
            - "Second request: HTTP 201, MoveOutRequest created with status='SUBMITTED', Lease L1.status == 'TERMINATING'"

      - name: empty_pending_deduction_items_settlement
        grounds:
          - state_machines.Deposit.DEDUCTION_PENDING_APPROVAL_to_SETTLED
          - entities.Deposit.fields.pending_deduction_items
          - entities.Deposit.fields.retained_cents
          - entities.Deposit.fields.refunded_cents
          - endpoints[POST /deposits/:deposit_id/propose-deductions]
        distinguishing_aspect: |
          Empty-collection edge: approve-deductions is invoked when
          pending_deduction_items is an EMPTY array (zero deduction items). Different
          metric (collection cardinality) and different endpoint (approve-deductions on
          Deposit, not move-out-request on Lease). After approval, retained_cents must be
          exactly 0 and refunded_cents must equal collected_cents (full refund).
        test_recipe:
          setup:
            - "Lease L1 in TERMINATING state on U1; Deposit D1 collected_cents=100000"
            - "MoveOutRequest M1 in RESTORATION_CONFIRMED state"
          trigger:
            - "POST /deposits/D1/propose-deductions body={deduction_items:[]}  → D1.adjustment_status=DEDUCTION_PENDING_APPROVAL, pending_deduction_items=[]"
            - "POST /deposits/D1/approve-deductions"
          assert:
            - "D1.retained_cents == 0 (sum of an empty array)"
            - "D1.refunded_cents == 100000 (D1.collected_cents - D1.retained_cents = 100000 - 0)"
            - "D1.adjustment_status == 'SETTLED'"
            - "Tenant T1.total_deposit_refunded_cents == 100000 and T1.total_deposit_retained_cents == 0 after the operation"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_sign_requires_unit_not_renovating
        grounds:
          - state_machines.Lease.DRAFT_to_SIGNED
          - state_machines.Unit.VACANT_to_UNDER_RENOVATION
          - validations[priority=7]
          - errors.ERR_RENOVATION_LEASE_CONFLICT
        distinguishing_aspect: |
          Entity pair: Lease ↔ Unit. Lease.DRAFT → SIGNED valid transitions depend on
          Unit.status not being UNDER_RENOVATION AND on the renovation closed interval
          [start, end+1] not overlapping the Lease half-open interval [start, end).
        test_recipe:
          setup:
            - "Unit U1 (VACANT, area=100)"
            - "Renovation started on U1: renovation_start_date=2026-03-01, renovation_end_date=2026-03-15 (Unit.status=UNDER_RENOVATION)"
            - "Tenant T1 APPROVED; Lease L_bad DRAFT on U1 with start_date=2026-03-10, end_date=2026-09-10 (overlaps renovation)"
            - "Lease L_good DRAFT on U1 with start_date=2026-03-17, end_date=2026-09-17 (after renovation_end_date+1 buffer day)"
          trigger:
            - "POST /buildings/B1/units/U1/finish-renovation  →  U1.status=VACANT (renovation_end_date persisted to 2026-03-15)"
            - "POST /leases/L_bad/sign  (should fail because renovation interval [2026-03-01, 2026-03-16] overlaps L_bad [2026-03-10, 2026-09-10))"
            - "POST /leases/L_good/sign"
          assert:
            - "L_bad /sign: HTTP 409, data.error_id == 'ERR_RENOVATION_LEASE_CONFLICT'"
            - "L_good /sign: HTTP 200, Lease.status == 'SIGNED'"

      - name: fee_bill_payment_requires_lease_billable
        grounds:
          - state_machines.FeeBill.ISSUED_to_PAID
          - entities.Lease.fields.status
          - errors.ERR_LEASE_NOT_BILLABLE
        distinguishing_aspect: |
          Entity pair: FeeBill ↔ Lease (DIFFERENT pair from the Lease-↔-Unit dependency
          above). A FeeBill in ISSUED state can be transitioned to PAID only when its
          owning Lease is in {ACTIVE, AMENDMENT_PENDING, TERMINATING, TERMINATED}; an
          attempt to pay a bill whose owning Lease is still in DRAFT or whose Lease was
          rejected (status REJECTED in the parallel Tenant qualification path doesn't
          apply here, but DRAFT does) fails with ERR_LEASE_NOT_BILLABLE.
        test_recipe:
          setup:
            - "Building B1, Unit U1, Tenant T1 APPROVED"
            - "Lease L1 SIGNED then ACTIVATED on U1 (status=ACTIVE)"
            - "Lease L2 in DRAFT on a separate Unit U2 (status=DRAFT, never signed)"
            - "FeeBill F1 issued against L1 (bill_kind=PROPERTY_FEE) → F1.status=ISSUED"
          trigger:
            - "POST /fee-bills/F1/pay  (L1 is ACTIVE, F1 is ISSUED → should succeed)"
            - "POST /fee-bills body={lease_id:L2, bill_kind:PROPERTY_FEE, period_start:2026-01-01, period_end:2026-02-01, property_fee_mode:FIXED_RATE, fixed_rate_cents_per_month:50000}  (L2 is DRAFT → should be rejected by Lease.status billability gate)"
          assert:
            - "First request: HTTP 200, F1.status == 'PAID'"
            - "Second request: HTTP 409, data.error_id == 'ERR_LEASE_NOT_BILLABLE'"
            - "Entity pair {FeeBill, Lease} is distinct from {Lease, Unit} of the prior instance"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lease_half_open_overlap_on_unit
        grounds:
          - validations[priority=8]
          - errors.ERR_LEASE_OVERLAP
          - state_machines.Lease.DRAFT_to_SIGNED
          - entities.Lease.fields.start_date
          - entities.Lease.fields.end_date
        distinguishing_aspect: |
          Interval semantics: half-open [start_date, end_date). Adjacent leases where
          end_date_of_A == start_date_of_B are accepted (no overlap), but any interior
          overlap (even one day) is rejected. Resource is the Unit.
        test_recipe:
          setup:
            - "Unit U1 VACANT; Tenant T1 APPROVED; Lease L1 SIGNED on U1 from 2026-01-01 to 2026-06-01"
          trigger:
            - "Create and sign Lease L_adj on U1 with start_date=2026-06-01, end_date=2026-12-01  (adjacent: end of L1 == start of L_adj)"
            - "Create Lease L_over on U1 (different draft) with start_date=2026-05-31, end_date=2026-12-01 → POST /leases/L_over/sign"
          assert:
            - "L_adj /sign: HTTP 200, status='SIGNED' (adjacency allowed under half-open semantics)"
            - "L_over /sign: HTTP 409, data.error_id == 'ERR_LEASE_OVERLAP' (one-day interior overlap with L1 because [2026-05-31, 2026-12-01) ∩ [2026-01-01, 2026-06-01) = [2026-05-31, 2026-06-01) which is non-empty)"

      - name: renovation_closed_interval_with_buffer
        grounds:
          - validations[priority=7]
          - errors.ERR_RENOVATION_LEASE_CONFLICT
          - state_machines.Unit.VACANT_to_UNDER_RENOVATION
          - entities.Unit.fields.renovation_start_date
          - entities.Unit.fields.renovation_end_date
        distinguishing_aspect: |
          DIFFERENT interval semantics from the lease-overlap rule: renovation interval
          is CLOSED on both ends with a one-day buffer added after renovation_end_date,
          i.e. [renovation_start_date, renovation_end_date + 1 day]. So a Lease whose
          start_date equals renovation_end_date + 1 day is accepted (just past the buffer),
          but a Lease whose start_date equals renovation_end_date exactly is rejected
          (still inside the buffer). Resource is the Unit but the geometric treatment
          differs from the half-open Lease overlap rule.
        test_recipe:
          setup:
            - "Unit U1 VACANT; renovation interval [2026-03-01, 2026-03-15] active"
            - "Tenant T1 APPROVED"
          trigger:
            - "POST /buildings/B1/units/U1/finish-renovation  →  U1.status=VACANT, renovation dates retained as historical reference"
            - "Create Lease L_inside DRAFT on U1 with start_date=2026-03-15, end_date=2026-09-15 → POST /leases/L_inside/sign  (start equals renovation_end_date; closed-interval semantics rejects)"
            - "Create Lease L_buffer DRAFT on U1 with start_date=2026-03-16, end_date=2026-09-16 → POST /leases/L_buffer/sign  (start equals renovation_end_date + 1 day → exact buffer)"
            - "Create Lease L_safe  DRAFT on U1 with start_date=2026-03-17, end_date=2026-09-17 → POST /leases/L_safe/sign  (start equals renovation_end_date + 2 days, definitely outside buffer)"
          assert:
            - "L_inside /sign: HTTP 409, data.error_id == 'ERR_RENOVATION_LEASE_CONFLICT' (closed interval includes 2026-03-15)"
            - "L_buffer /sign: HTTP 409, data.error_id == 'ERR_RENOVATION_LEASE_CONFLICT' (buffer day 2026-03-16 still inside [2026-03-01, 2026-03-16])"
            - "L_safe /sign: HTTP 200, status='SIGNED'"
            - "Different interval semantics from instance 1: half-open vs closed+buffer"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_ledger_invariant
        grounds:
          - calculations.tenant_deposit_ledger
          - entities.Tenant.fields.total_deposit_paid_cents
          - entities.Tenant.fields.total_deposit_refunded_cents
          - entities.Tenant.fields.total_deposit_retained_cents
          - state_machines.Deposit.DEDUCTION_PENDING_APPROVAL_to_SETTLED
          - state_machines.Deposit.AT_REST_to_AT_REST  # top-up cycles
        distinguishing_aspect: |
          Conserved quantity: outstanding-deposit-held-by-landlord(T) = total_deposit_paid_cents
          - total_deposit_refunded_cents - total_deposit_retained_cents. After any forward
          action (top-up) paired with its compensating action (full refund on settlement),
          this quantity must be exactly 0 for the tenant, and must equal sum of live
          (collected - refunded - retained) across Deposit rows at every intermediate step.
        test_recipe:
          setup:
            - "Tenant T1 APPROVED; Lease L1 SIGNED on U1 with deposit_months=1, base_monthly_rent_cents=100000  → Deposit D1.required_cents=100000"
          trigger:
            - "POST /deposits/D1/top-up body={amount_cents:100000}  (forward action — deposit collected)"
            - "Activate Lease, then submit move-out, propose-deductions [] (empty), approve-deductions  (compensating chain that ultimately refunds the deposit)"
            - "POST /move-out-requests/M1/finalize"
          assert:
            - "Mid-state: after top-up: T1.total_deposit_paid_cents==100000, T1.total_deposit_refunded_cents==0, T1.total_deposit_retained_cents==0  →  outstanding == 100000 == D1.collected_cents - D1.refunded_cents - D1.retained_cents"
            - "Final state: T1.total_deposit_paid_cents==100000, T1.total_deposit_refunded_cents==100000, T1.total_deposit_retained_cents==0  →  outstanding == 0"
            - "Invariant: at every observable step, total_deposit_paid_cents - total_deposit_refunded_cents - total_deposit_retained_cents == sum over D in Deposits-of(T1) of (D.collected_cents - D.refunded_cents - D.retained_cents)"

      - name: rent_schedule_amendment_conservation
        grounds:
          - calculations.rent_schedule_generation
          - state_machines.Lease.ACTIVE_to_AMENDMENT_PENDING
          - state_machines.Lease.AMENDMENT_PENDING_to_ACTIVE
          - entities.RentScheduleItem.fields.status
          - entities.RentScheduleItem.fields.net_rent_cents
        distinguishing_aspect: |
          Conserved quantity is DIFFERENT from instance 1 (cents in tenant deposit
          ledger): here it is sum(RentScheduleItem.net_rent_cents) for periods STRICTLY
          BEFORE the amendment's effective_from. The forward action (amend) paired with
          its compensating action (regenerate schedule only for periods >= effective_from,
          preserving earlier rows) must leave the pre-amendment cumulative rent UNCHANGED.
        test_recipe:
          setup:
            - "Lease L1 SIGNED then ACTIVATED on U1, start_date=2026-01-01, end_date=2026-07-01, base_monthly_rent_cents=100000, escalation_mode=NONE, rent_free_days=0  →  rent schedule has 6 rows each net_rent_cents=100000"
            - "Capture pre_amend_total = sum(net_rent_cents for items where period_start < 2026-04-01) == 300000 (Jan, Feb, Mar)"
          trigger:
            - "POST /leases/L1/amend body={new_base_monthly_rent_cents:120000, effective_from:2026-04-01}"
            - "POST /leases/L1/amend-confirm  (as FinanceOfficer)"
            - "GET /leases/L1/rent-schedule"
          assert:
            - "After amend-confirm: sum(RentScheduleItem.net_rent_cents for period_start < 2026-04-01) == 300000 (UNCHANGED — invariant)"
            - "After amend-confirm: sum(RentScheduleItem.net_rent_cents for period_start >= 2026-04-01) == 360000 (3 months × 120000, regenerated)"
            - "Sum of all rows post-amend == 660000 = 300000 (preserved) + 360000 (new)"
            - "Conserved quantity is rent cents in the pre-effective-from window, distinct in TYPE from instance 1's tenant deposit balance"
