  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: corner_not_found_on_subresource_list
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A list endpoint under a non-existent parent id returns 404 (existence validated left-to-right on the path)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /ambient-clinical-documentation/patients/00000000-0000-0000-0000-000000000000/encounters"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status == 404"
      - name: corner_error_envelope_shape
        claim_type: violation_to_error
        grounds:
          - response_envelope
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Error responses use the fixed envelope: response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /ambient-clinical-documentation/physicians/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id", msg: "$.data.message" }
          assert:
            - "err == ERR_NOT_FOUND; msg is a non-empty string; envelope meta.api_request_id present and response_type == 'error'"
      - name: corner_gap_violation_error_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CAPTURE_GAP_VIOLATION]
        excluded_because:
          difficulty_instance: capture_buffer_gap_on_encounter
          rationale: "The 59s-vs-60s boundary instance triggers ERR_CAPTURE_GAP_VIOLATION as its failure path."
      - name: corner_segment_overlap_error_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEGMENT_OVERLAP]
        excluded_because:
          difficulty_instance: segment_half_open_intervals_on_capture
          rationale: "The half-open interval instance triggers ERR_SEGMENT_OVERLAP on the 1ms-overlap segment."
      - name: corner_consent_not_active_error_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONSENT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: attest_requires_granted_consent
          rationale: "The cross-entity dependency instance triggers ERR_CONSENT_NOT_ACTIVE as its primary assertion."

