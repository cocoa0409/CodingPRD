              as: Trader
              as_user_id: "${acc_tr}"
            - call: "POST /accounts/${acc_tr}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /accounts/${acc_tr}/kyc-applications"
              payload: { requested_tier: "TIER_2" }
              as: Trader
              as_user_id: "${acc_tr}"
            - call: "POST /accounts/${acc_tr}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
