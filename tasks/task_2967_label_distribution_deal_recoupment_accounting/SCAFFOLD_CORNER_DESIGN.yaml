          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_REVENUE_REPORT_NOT_FOUND
          - errors.ERR_PHYSICAL_RUN_NOT_FOUND
          - errors.ERR_STATEMENT_NOT_FOUND
          - errors.ERR_RELEASE_NOT_FOUND
          - errors.ERR_DEAL_NOT_FOUND
          - errors.ERR_ARTIST_NOT_FOUND
          - errors.ERR_MARKETING_SPEND_NOT_FOUND
          - validations[priority 3]
        distinguishing_aspect: |
          Priority 3 resolves path ids left-to-right and each entity has its OWN 404 id. One
          syntactically valid but unused UUID is pushed through eight read paths and one action path,
          and every response must name the entity that the segment addresses — not a shared
          ERR_NOT_FOUND, and not the first entity in some internal lookup order. The action path
          POST /dsp-revenue-reports/{id}/lines additionally proves that the PATH id is resolved before
          the BODY foreign key: the body's release_id is valid, the path id is not, and the answer is
          the report's 404 rather than a body error.
