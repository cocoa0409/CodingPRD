# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Household Employer Payroll & Nanny Tax Service
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from
# empty-DB via its setup_api_calls chain. All formula-derived asserts were
# precomputed by hand-executing the §1.3 formulas.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: paycheck_gross_provisional_vs_final
        grounds:
          - calculations.paycheck_withholding_net
          - calculations.gross_pay_hourly_overtime
          - entities.Paycheck.fields.provisional_gross_cents
          - entities.Paycheck.fields.gross_cents
        distinguishing_aspect: |
          Dual variant on the PAYCHECK entity domain: identical period data,
          provisional (guarantee-basis, no OT) yields 120000 while final
          (timesheet-basis with weekly OT extraction) yields 142500.
        test_recipe:
          setup:
            - "Employer in state AA (sit 0.05, no daily OT, weekly OT 2400, wc not required), fully registered (NEW_HIRE_DIRECTORY, SIT_WITHHOLDING, SUTA all ACTIVE), status ACTIVE"
            - "Worker W LIVE_OUT, EMPLOYEE, ACTIVE; agreement HOURLY 3000 cents/h (50/min), guaranteed_minutes_per_week 2400, effective 2026-01-01"
            - "Approved timesheet 2026-01-05..2026-01-12 with entries Mon-Fri 540 min each (2700 total = 45h)"
            - "Pay run 2026-01-05..2026-01-12 (pay_date 2026-01-12) CALCULATED after the approval"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam A", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v2: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "SIT_WITHHOLDING", expected_employer_version: "${e_v2}" }, as: PayrollAdmin, captures: { reg_sit: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v3: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "SUTA", expected_employer_version: "${e_v3}" }, as: PayrollAdmin, captures: { reg_suta: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/activate", payload: { agency_account_number: "SIT-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/activate", payload: { agency_account_number: "SUTA-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Nora Nanny", ssn: "123456789", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-01-05", period_end: "2026-01-12", entries: [ { work_date: "2026-01-05", worked_minutes: 540 }, { work_date: "2026-01-06", worked_minutes: 540 }, { work_date: "2026-01-07", worked_minutes: 540 }, { work_date: "2026-01-08", worked_minutes: 540 }, { work_date: "2026-01-09", worked_minutes: 540 } ] }, as: Worker, as_user_id: "${w_id}", captures: { ts_id: "$.data.id" } }
            - { call: "POST /household-payroll/timesheets/${ts_id}/submit", as: Worker, as_user_id: "${w_id}" }
            - { call: "POST /household-payroll/timesheets/${ts_id}/approve", as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/employers/${e_id}/pay-runs", payload: { period_start: "2026-01-05", period_end: "2026-01-12", pay_date: "2026-01-12" }, as: PayrollAdmin, captures: { pr_id: "$.data.id" } }
            - { call: "POST /household-payroll/pay-runs/${pr_id}/calculate", as: PayrollAdmin }
          trigger:
            - { call: "GET /household-payroll/pay-runs/${pr_id}/paychecks", as: PayrollAdmin, captures: { pc_id: "$.data[0].id", pc_basis: "$.data[0].basis", pc_prov: "$.data[0].provisional_gross_cents", pc_gross: "$.data[0].gross_cents", pc_reg: "$.data[0].regular_minutes", pc_ot: "$.data[0].overtime_minutes", pc_topup: "$.data[0].guarantee_top_up_minutes", pc_net: "$.data[0].net_pay_cents" } }
          assert:
            - "Paycheck.${pc_id}.basis == TIMESHEET"
            - "Paycheck.${pc_id}.provisional_gross_cents == 120000 (2400 min x 50 cents/min, guarantee basis, no OT)"
            - "Paycheck.${pc_id}.gross_cents == 142500 (2400 regular x 50 + 300 OT x 75; identical period data, different variant)"
            - "Paycheck.${pc_id}.regular_minutes == 2400 and overtime_minutes == 300 and guarantee_top_up_minutes == 0"
            - "Paycheck.${pc_id}.net_pay_cents == 135375 (142500 - SIT round(142500*0.05)=7125; FICA not yet covered)"
      - name: schedule_h_projection_vs_ytd_actual
        grounds:
          - calculations.safe_harbor_deposit_requirement
          - entities.TaxLiabilityAccount.fields.projected_annual_cents
          - entities.TaxLiabilityAccount.fields.accrued_cents
        distinguishing_aspect: |
          Dual variant on the TAX LIABILITY ACCOUNT domain (different entity
          from the paycheck instance): same finalized ledger, chronological
          accrued_cents == 2400 while forward-looking projected_annual_cents
          == 124800 (2400 + 2400 x 51 remaining weekly periods).
        test_recipe:
          setup:
            - "Employer in state BB (sit 0.00, suta 0.02, wc not required), WEEKLY, fully registered, ACTIVE"
            - "One ACTIVE EMPLOYEE worker, agreement HOURLY 3000 cents/h, guarantee 2400 min/week, no timesheets"
            - "One pay run 2026-01-05..2026-01-12 pay_date 2026-01-12, CALCULATED then FINALIZED (guarantee fallback gross 120000)"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "BB", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.0, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam B", primary_state_code: "BB", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "BB", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v2: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "BB", agency: "SIT_WITHHOLDING", expected_employer_version: "${e_v2}" }, as: PayrollAdmin, captures: { reg_sit: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v3: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "BB", agency: "SUTA", expected_employer_version: "${e_v3}" }, as: PayrollAdmin, captures: { reg_suta: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/activate", payload: { agency_account_number: "SIT-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/activate", payload: { agency_account_number: "SUTA-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Gary Gardener", ssn: "123456789", work_state_code: "BB", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/employers/${e_id}/pay-runs", payload: { period_start: "2026-01-05", period_end: "2026-01-12", pay_date: "2026-01-12" }, as: PayrollAdmin, captures: { pr_id: "$.data.id" } }
            - { call: "POST /household-payroll/pay-runs/${pr_id}/calculate", as: PayrollAdmin }
            - { call: "POST /household-payroll/pay-runs/${pr_id}/finalize", as: PayrollAdmin }
          trigger:
            - { call: "GET /household-payroll/employers/${e_id}/tax-accounts", as: PayrollAdmin, captures: { futa_acc: "$.data[2].accrued_cents", suta_acc: "$.data[4].accrued_cents", suta_proj: "$.data[4].projected_annual_cents" } }
          assert:
            - "TaxLiabilityAccount[SUTA_ER].accrued_cents == 2400 (chronological variant: round(120000 x 0.02))"
            - "TaxLiabilityAccount[SUTA_ER].projected_annual_cents == 124800 (forward-looking variant: 2400 + 2400 x 51 remaining of 52 weekly periods)"
            - "TaxLiabilityAccount[FUTA_ER].accrued_cents == 720 (quarter wages 120000 >= 100000 trigger; round(120000 x 0.006))"
            - "accrued_cents != projected_annual_cents for identical ledger data (2400 != 124800)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: gross_pay_multi_input_overtime
        grounds:
          - calculations.gross_pay_hourly_overtime
          - entities.StateRulePack.fields.daily_ot_threshold_minutes
        distinguishing_aspect: |
          Mode (a): >=3 inputs (daily minutes, work_arrangement, daily OT/DT
          thresholds, weekly threshold, hourly rate) with non-linear nested
          min/max extraction — daily OT/DT carved out BEFORE the weekly 2400
          test, so the weekly test sees 2220 not 2700.
        test_recipe:
          setup:
            - "Employer in state CC (daily OT 480, daily DT 720, weekly OT 2400, sit 0.00), fully registered, ACTIVE"
            - "Worker LIVE_OUT ACTIVE, agreement HOURLY 3000 cents/h, guarantee 2400"
            - "Approved timesheet 2026-01-05..2026-01-12: 660, 780, 480, 480, 300 minutes Mon-Fri"
            - "Pay run for the period, CALCULATED after approval"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "CC", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 480, daily_dt_threshold_minutes: 720, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.0, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam C", primary_state_code: "CC", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "CC", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v2: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "CC", agency: "SIT_WITHHOLDING", expected_employer_version: "${e_v2}" }, as: PayrollAdmin, captures: { reg_sit: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v3: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "CC", agency: "SUTA", expected_employer_version: "${e_v3}" }, as: PayrollAdmin, captures: { reg_suta: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/activate", payload: { agency_account_number: "SIT-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/activate", payload: { agency_account_number: "SUTA-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Cleo Cook", ssn: "123456789", work_state_code: "CC", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-01-05", period_end: "2026-01-12", entries: [ { work_date: "2026-01-05", worked_minutes: 660 }, { work_date: "2026-01-06", worked_minutes: 780 }, { work_date: "2026-01-07", worked_minutes: 480 }, { work_date: "2026-01-08", worked_minutes: 480 }, { work_date: "2026-01-09", worked_minutes: 300 } ] }, as: Worker, as_user_id: "${w_id}", captures: { ts_id: "$.data.id" } }
            - { call: "POST /household-payroll/timesheets/${ts_id}/submit", as: Worker, as_user_id: "${w_id}" }
            - { call: "POST /household-payroll/timesheets/${ts_id}/approve", as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/employers/${e_id}/pay-runs", payload: { period_start: "2026-01-05", period_end: "2026-01-12", pay_date: "2026-01-12" }, as: PayrollAdmin, captures: { pr_id: "$.data.id" } }
            - { call: "POST /household-payroll/pay-runs/${pr_id}/calculate", as: PayrollAdmin }
          trigger:
            - { call: "GET /household-payroll/pay-runs/${pr_id}/paychecks", as: PayrollAdmin, captures: { pc_reg: "$.data[0].regular_minutes", pc_ot: "$.data[0].overtime_minutes", pc_dt: "$.data[0].double_minutes", pc_gross: "$.data[0].gross_cents", pc_net: "$.data[0].net_pay_cents" } }
          assert:
            - "Paycheck.regular_minutes == 2220 (daily carve-outs removed before the weekly test)"
            - "Paycheck.overtime_minutes == 420 (180 from 660-min day + 240 from 780-min day; weekly OT is 0 because 2220 <= 2400)"
            - "Paycheck.double_minutes == 60 (780 - 720)"
            - "Paycheck.gross_cents == 148500 (2220x50 + 420x75 + 60x100)"
            - "Paycheck.net_pay_cents == 148500 (sit 0.0; 148500 < 280000 so no FICA)"
      - name: withholding_per_line_rounding
        grounds:
          - calculations.paycheck_withholding_net
        distinguishing_aspect: |
          Mode (b): nested rounding order — each withholding line rounded
          half-up to cents BEFORE summation yields total withheld 37962; the
          forbidden sum-then-round order yields 37963 (300100 x 0.1265 =
          37962.65). The scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Employer in state AA (sit 0.05), fully registered, ACTIVE"
            - "Worker ACTIVE, agreement HOURLY 3000 cents/h, guaranteed_minutes_per_week 6002, no timesheet (GUARANTEE_FALLBACK gross = 6002 x 50 = 300100)"
            - "Pay run 2026-01-05..2026-01-12 CALCULATED"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam R", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v2: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "SIT_WITHHOLDING", expected_employer_version: "${e_v2}" }, as: PayrollAdmin, captures: { reg_sit: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v3: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "SUTA", expected_employer_version: "${e_v3}" }, as: PayrollAdmin, captures: { reg_suta: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/activate", payload: { agency_account_number: "SIT-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/activate", payload: { agency_account_number: "SUTA-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Rita Rounds", ssn: "123456789", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 6002, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/employers/${e_id}/pay-runs", payload: { period_start: "2026-01-05", period_end: "2026-01-12", pay_date: "2026-01-12" }, as: PayrollAdmin, captures: { pr_id: "$.data.id" } }
            - { call: "POST /household-payroll/pay-runs/${pr_id}/calculate", as: PayrollAdmin }
          trigger:
            - { call: "GET /household-payroll/pay-runs/${pr_id}/paychecks", as: PayrollAdmin, captures: { pc_gross: "$.data[0].gross_cents", pc_net: "$.data[0].net_pay_cents", pc_lines: "$.data[0].withholding_lines" } }
          assert:
            - "Paycheck.gross_cents == 300100 and basis == GUARANTEE_FALLBACK"
            - "withholding_lines contains SS_EE == 18606 (round(300100 x 0.062) = round(18606.2))"
            - "withholding_lines contains MEDICARE_EE == 4351 (round(300100 x 0.0145) = round(4351.45))"
            - "withholding_lines contains SIT_EE == 15005 (round(300100 x 0.05) = 15005)"
            - "withholding_lines has no ADDL_MEDICARE_EE line (300100 <= 20000000) and no FIT_EE line (0)"
            - "Paycheck.net_pay_cents == 262138 (300100 - (18606+4351+15005) = 300100 - 37962; sum-then-round would wrongly give 300100 - 37963 = 262137)"
      - name: fluctuating_workweek_circular_rate
        grounds:
          - calculations.fluctuating_workweek_premium
          - entities.Paycheck.fields.fww_effective_rate_cents_per_minute
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the effective rate depends on
          total minutes while the OT premium depends on the rate. The pinned
          evaluation order (total -> rate at 4dp -> 0.5x premium -> gross)
          yields gross 132159; any other order or rate precision drifts cents.
        test_recipe:
