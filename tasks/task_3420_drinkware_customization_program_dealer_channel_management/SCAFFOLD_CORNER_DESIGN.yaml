          - errors.ERR_DUPLICATE_ALLOCATION_REQUEST
        distinguishing_aspect: "One REQUESTED allocation per (dealer, drop): the second request on the same pair is 409 ERR_DUPLICATE_ALLOCATION_REQUEST; the dealer must forfeit first to re-request."
