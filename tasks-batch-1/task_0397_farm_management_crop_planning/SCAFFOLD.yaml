# =============================================================================
# SCAFFOLD — Farm Management & Crop Planning (Expert band)
# §1.0–§1.7. (scaffold_difficulty_design and scaffold_corner_design live in
# their own sibling files.)
# =============================================================================

scenario: |
  Farm Management & Crop Planning: field/parcel & crop plan, planting/harvest
  schedule, input (seed/fertilizer/chemical) application log, yield &
  cost-per-acre, equipment & labor, weather/irrigation, harvest inventory &
  sale contract, compliance (restricted-use) record

domain_name: farm-management-crop-planning
api_prefix: ""
# Flat topology: all entities are top-level collections (/crop-plans, /input-lots,
# /harvest-lots, ...) rather than nested under a single prefix. api_prefix is empty
# so each collection's first path segment is its canonical resource name.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  # Peer entities linked by foreign keys; URLs are flat collections with FK
  # fields in bodies / query params, NOT a deep nested tree.
  state_machine_shape: parallel
  # CropPlan is cyclic (DRAFT<->UNDER_REVISION revision loop); HarvestLot carries
  # two independent state dimensions (quality_status x sale_status); SaleContract
  # is branching fork-join; ApplicationRecord is linear-with-revert.
  relationship_patterns:
    - one_to_many
    - cross_aggregate          # ApplicationRecord references both CropPlan and InputLot
    - many_to_many             # HarvestLot <-> SaleContract via allocation side effects
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Parcel
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Field/parcel display name" }
      - { name: acreage, type: number, source: input, description: "Tillable acreage; must be > 0" , constraints: "> 0" }
      - { name: soil_type, type: enum, source: input, description: "CLAY | LOAM | SAND | SILT" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESTRICTED | RETIRED — AVAILABLE on create", default: "AVAILABLE", constraints: "AVAILABLE, RESTRICTED, RETIRED" }
      - { name: reentry_blocked_until, type: datetime, source: computed, required: false, description: "Latest REI expiry across non-voided restricted ApplicationRecords on plans of this parcel; null if none active" }
      - { name: active_crop_plan_count, type: integer, source: computed, description: "Count of CropPlans on this parcel whose status IN {APPROVED, GROWING, HARVESTING}" }

  - name: CropPlan
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; the field this plan occupies" }
      - { name: crop, type: enum, source: input, description: "CORN | SOY | WHEAT | COTTON | ALFALFA" }
      - { name: season_year, type: integer, source: input, description: "Calendar year of the growing season", constraints: ">= 2000" }
      - { name: planned_acres, type: number, source: input, description: "Acres this plan intends to plant; must be > 0 and <= parcel.acreage", constraints: "> 0" }
      - { name: budget_input_cost, type: number, source: input, description: "Planner's estimated input (seed/fertilizer/chemical) spend in dollars" }
      - { name: budget_labor_cost, type: number, source: input, description: "Planner's estimated labor spend in dollars" }
      - { name: budget_equipment_cost, type: number, source: input, description: "Planner's estimated equipment spend in dollars" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVISION | APPROVED | GROWING | HARVESTING | CLOSED | ABANDONED — DRAFT on create", default: "DRAFT", constraints: "DRAFT, UNDER_REVISION, APPROVED, GROWING, HARVESTING, CLOSED, ABANDONED" }
      - { name: revision_count, type: integer, source: system, description: "Number of times the plan has cycled back into UNDER_REVISION", default: 0 }
      - { name: planted_acres, type: number, source: computed, description: "Sum of PlantingEvent.acres_planted for this plan (non-voided)" }
      - { name: harvested_acres, type: number, source: computed, description: "Sum of HarvestEvent.acres_harvested for this plan (status=RECORDED)" }
      - { name: actual_input_cost, type: number, source: computed, description: "Sum of ApplicationRecord.applied_cost for non-voided records on this plan" }
      - { name: actual_labor_cost, type: number, source: computed, description: "Sum of LaborEntry.labor_cost for this plan" }
      - { name: actual_equipment_cost, type: number, source: computed, description: "Sum of EquipmentUsage.usage_cost for this plan" }
      - { name: provisional_cost_per_acre, type: number, source: computed, description: "Estimate variant of cost_per_acre (see calc cost_per_acre); 2 dp" }
      - { name: final_cost_per_acre, type: number, source: computed, required: false, description: "Final variant of cost_per_acre; null until plan is CLOSED; 2 dp" }
      - { name: total_yield_units, type: number, source: computed, description: "Aggregated yield from HarvestLots (see calc yield_aggregation); 2 dp" }

  - name: InputProduct
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: category, type: enum, source: input, description: "SEED | FERTILIZER | CHEMICAL" }
      - { name: unit, type: enum, source: input, description: "LB | GAL | SEED_UNIT | TON" }
      - { name: unit_cost, type: number, source: input, description: "Dollar cost per unit", constraints: ">= 0" }
      - { name: restricted_use, type: boolean, source: input, description: "True for restricted-use chemicals requiring a certified applicator and compliance record", default: false }
      - { name: reentry_interval_hours, type: integer, source: input, required: false, description: "REI: hours a parcel is re-entry-blocked after application; required when restricted_use is true", default: 0 }
      - { name: preharvest_interval_days, type: integer, source: input, required: false, description: "PHI: minimum whole days that must elapse between application and harvest; required when restricted_use is true", default: 0 }
      - { name: max_seasonal_rate_per_acre, type: number, source: input, required: false, description: "Cap on cumulative applied rate per acre per CropPlan; null = uncapped" }

  - name: InputLot
    parent: null
    common_fields: true
    fields:
      - { name: input_product_id, type: string, source: input, description: "FK -> InputProduct.id; the product this lot stocks" }
      - { name: lot_code, type: string, source: input, description: "Supplier lot/batch code" }
      - { name: quantity_received, type: number, source: input, description: "Units originally received", constraints: "> 0" }
      - { name: quantity_remaining, type: number, source: computed, description: "Units left after debits; starts equal to quantity_received" }
      - { name: status, type: enum, source: system, description: "OPEN | DEPLETED — OPEN on create, DEPLETED when quantity_remaining reaches 0", default: "OPEN", constraints: "OPEN, DEPLETED" }

  - name: ApplicationRecord
    parent: null
    common_fields: true
    fields:
      - { name: crop_plan_id, type: string, source: input, description: "FK -> CropPlan.id; the plan this application is logged against" }
      - { name: input_product_id, type: string, source: input, description: "FK -> InputProduct.id; product applied" }
      - { name: applicator_user_id, type: string, source: input, description: "FK -> Applicator.id; certified applicator performing restricted-use work; for non-restricted products any Agronomist id is accepted" }
      - { name: rate_per_acre, type: number, source: input, description: "Units of product applied per acre", constraints: "> 0" }
      - { name: acres_treated, type: number, source: input, description: "Acres covered by this application", constraints: "> 0" }
      - { name: quantity_used, type: number, source: computed, description: "rate_per_acre * acres_treated, units of product" }
      - { name: applied_cost, type: number, source: computed, description: "quantity_used * InputProduct.unit_cost; 2 dp" }
      - { name: applied_at, type: datetime, source: system, description: "Server clock at the moment the record is logged (CONFIRMED)" }
      - { name: status, type: enum, source: system, description: "LOGGED | CONFIRMED | VOIDED — LOGGED on create", default: "LOGGED", constraints: "LOGGED, CONFIRMED, VOIDED" }
      - { name: is_restricted, type: boolean, source: computed, description: "Mirror of InputProduct.restricted_use at confirm time" }
      - { name: reentry_clear_at, type: datetime, source: computed, required: false, description: "applied_at + InputProduct.reentry_interval_hours; null for non-restricted" }

  - name: ComplianceRecord
    parent: null
    common_fields: true
    fields:
      - { name: application_record_id, type: string, source: system, description: "FK -> ApplicationRecord.id; the restricted application that generated this record" }
      - { name: crop_plan_id, type: string, source: system, description: "FK -> CropPlan.id; denormalized from the application for filtering" }
      - { name: applicator_user_id, type: string, source: system, description: "FK -> Applicator.id; copied from the application" }
      - { name: reentry_interval_hours, type: integer, source: system, description: "Snapshot of InputProduct.reentry_interval_hours at confirm time" }
      - { name: preharvest_interval_days, type: integer, source: system, description: "Snapshot of InputProduct.preharvest_interval_days at confirm time" }
      - { name: reentry_clear_at, type: datetime, source: system, description: "Snapshot of ApplicationRecord.reentry_clear_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED — ACTIVE on create, SUPERSEDED when its source application is VOIDED", default: "ACTIVE", constraints: "ACTIVE, SUPERSEDED" }

  - name: PlantingEvent
    parent: null
    common_fields: true
    fields:
      - { name: crop_plan_id, type: string, source: input, description: "FK -> CropPlan.id; the plan being planted" }
      - { name: input_lot_id, type: string, source: input, description: "FK -> InputLot.id; seed lot consumed (must be a SEED product lot)" }
      - { name: acres_planted, type: number, source: input, description: "Acres planted in this event", constraints: "> 0" }
      - { name: seed_rate_per_acre, type: number, source: input, description: "Seed units per acre", constraints: "> 0" }
      - { name: seed_units_used, type: number, source: computed, description: "acres_planted * seed_rate_per_acre debited from the seed lot (waterfall, see calc input_inventory_debit)" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED — RECORDED on create", default: "RECORDED", constraints: "RECORDED, VOIDED" }

  - name: HarvestEvent
    parent: null
    common_fields: true
    fields:
      - { name: crop_plan_id, type: string, source: input, description: "FK -> CropPlan.id; the plan being harvested" }
      - { name: acres_harvested, type: number, source: input, description: "Acres harvested in this event", constraints: "> 0" }
      - { name: gross_quantity, type: number, source: input, description: "Raw harvested quantity in crop units (e.g., bushels)", constraints: ">= 0" }
      - { name: moisture_pct, type: number, source: input, description: "Moisture percentage 0..100 used to compute dry-weight net quantity", constraints: "0 <= moisture_pct <= 100" }
      - { name: net_quantity, type: number, source: computed, description: "Dry-weight adjusted quantity (see calc yield_aggregation); 2 dp" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED — RECORDED on create", default: "RECORDED", constraints: "RECORDED, VOIDED" }

  - name: HarvestLot
    parent: null
    common_fields: true
    fields:
      - { name: harvest_event_id, type: string, source: input, description: "FK -> HarvestEvent.id; the harvest that produced this lot" }
      - { name: crop_plan_id, type: string, source: system, description: "FK -> CropPlan.id; denormalized from the harvest event" }
      - { name: quantity, type: number, source: input, description: "Lot quantity in crop units", constraints: "> 0" }
      - { name: quantity_committed, type: number, source: computed, description: "Sum of quantity allocated to sale contracts from this lot" }
      - { name: quality_status, type: enum, source: system, description: "UNGRADED | GRADE_A | GRADE_B | REJECTED — UNGRADED on create (independent state axis)", default: "UNGRADED", constraints: "UNGRADED, GRADE_A, GRADE_B, REJECTED" }
      - { name: sale_status, type: enum, source: system, description: "IN_INVENTORY | PARTIALLY_COMMITTED | FULLY_COMMITTED | SHIPPED — IN_INVENTORY on create (independent state axis)", default: "IN_INVENTORY", constraints: "IN_INVENTORY, PARTIALLY_COMMITTED, FULLY_COMMITTED, SHIPPED" }
      - { name: committed_contract_id, type: string, source: computed, required: false, description: "FK -> SaleContract.id; the contract this lot's committed quantity is allocated to; null until committed" }

  - name: SaleContract
    parent: null
    common_fields: true
    fields:
      - { name: crop, type: enum, source: input, description: "Crop the contract buys; lots committed must match (CORN | SOY | WHEAT | COTTON | ALFALFA)" }
      - { name: buyer_name, type: string, source: input, description: "Counterparty buyer name" }
      - { name: contracted_quantity, type: number, source: input, description: "Total crop units the contract must be filled with", constraints: "> 0" }
      - { name: min_quality, type: enum, source: input, description: "Minimum acceptable lot quality (GRADE_B | GRADE_A); lots below are ineligible", default: "GRADE_B" }
      - { name: price_per_unit, type: number, source: input, description: "Dollar price per crop unit", constraints: ">= 0" }
      - { name: committed_quantity, type: number, source: computed, description: "Sum of quantity committed from HarvestLots to this contract" }
      - { name: contract_value, type: number, source: computed, description: "committed_quantity * price_per_unit; 2 dp" }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIALLY_FILLED | FILLED | SHIPPED | CANCELLED — OPEN on create", default: "OPEN", constraints: "OPEN, PARTIALLY_FILLED, FILLED, SHIPPED, CANCELLED" }

  - name: EquipmentAsset
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Equipment display name (e.g., 'John Deere 8R')" }
      - { name: kind, type: enum, source: input, description: "TRACTOR | COMBINE | SPRAYER | PLANTER" }
      - { name: hourly_cost, type: number, source: input, description: "Operating cost per hour in dollars", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DOWN — ACTIVE on create; DOWN blocks new usage bookings", default: "ACTIVE", constraints: "ACTIVE, DOWN" }
      - { name: total_logged_hours, type: number, source: computed, description: "Sum of EquipmentUsage.hours for this asset across all plans (RECORDED only)" }

  - name: EquipmentUsage
    parent: null
    common_fields: true
    fields:
      - { name: equipment_asset_id, type: string, source: input, description: "FK -> EquipmentAsset.id; asset used" }
      - { name: crop_plan_id, type: string, source: input, description: "FK -> CropPlan.id; plan the usage is billed to" }
      - { name: window_start, type: datetime, source: input, description: "Usage window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Usage window end (exclusive); must be > window_start" }
      - { name: hours, type: number, source: computed, description: "(window_end - window_start) in hours, 2 dp" }
      - { name: usage_cost, type: number, source: computed, description: "hours * EquipmentAsset.hourly_cost; 2 dp" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED — RECORDED on create", default: "RECORDED", constraints: "RECORDED, VOIDED" }

  - name: LaborEntry
    parent: null
    common_fields: true
    fields:
      - { name: crop_plan_id, type: string, source: input, description: "FK -> CropPlan.id; plan the labor is billed to" }
      - { name: worker_name, type: string, source: input, description: "Worker display name" }
      - { name: hours, type: number, source: input, description: "Hours worked", constraints: "> 0" }
      - { name: hourly_rate, type: number, source: input, description: "Dollar rate per hour", constraints: ">= 0" }
      - { name: labor_cost, type: number, source: computed, description: "hours * hourly_rate; 2 dp" }

  - name: IrrigationEvent
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; field being irrigated" }
      - { name: window_start, type: datetime, source: input, description: "Irrigation window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Irrigation window end (inclusive); must be > window_start" }
      - { name: inches_applied, type: number, source: input, description: "Inches of water applied", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED — SCHEDULED on create", default: "SCHEDULED", constraints: "SCHEDULED, COMPLETED, CANCELLED" }

  - name: Applicator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Certified applicator name" }
      - { name: license_no, type: string, source: input, description: "Restricted-use applicator license number" }
      - { name: certified, type: boolean, source: input, description: "Whether the license is currently certified", default: true }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- CropPlan: cyclic revision loop + linear growth pipeline -----
  - entity: CropPlan
    initial_state: DRAFT
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /crop-plans/{id}/approve"
        actor: FarmManager
        preconditions:
          - "Parcel.status == AVAILABLE (ERR_PARCEL_NOT_AVAILABLE)"
          - "planned_acres <= Parcel.acreage (ERR_PLANNED_ACRES_EXCEED_PARCEL)"
          - "expected_parcel_version matches Parcel.version (ERR_STALE_PARCEL_VERSION)"
        side_effects:
          - "Parcel.active_crop_plan_count incremented (recompute)"
          - "increments Parcel.version by 1"

      - from: APPROVED
        to: UNDER_REVISION
        trigger: "POST /crop-plans/{id}/request-revision"
        actor: Agronomist
        preconditions:
          - "No PlantingEvent exists for this plan with status RECORDED (ERR_PLAN_ALREADY_PLANTED)"
        side_effects:
          - "revision_count incremented by 1"
          - "Parcel.active_crop_plan_count recomputed (plan no longer in APPROVED set)"

      - from: UNDER_REVISION
        to: APPROVED
        trigger: "POST /crop-plans/{id}/approve"
        actor: FarmManager
        preconditions:
          - "Parcel.status == AVAILABLE (ERR_PARCEL_NOT_AVAILABLE)"
          - "planned_acres <= Parcel.acreage (ERR_PLANNED_ACRES_EXCEED_PARCEL)"
          - "expected_parcel_version matches Parcel.version (ERR_STALE_PARCEL_VERSION)"
        side_effects:
          - "Parcel.active_crop_plan_count recomputed"
          - "increments Parcel.version by 1"
        note: "Cycle: a plan may loop APPROVED -> UNDER_REVISION -> APPROVED any number of times; revision_count records the loops."

      - from: APPROVED
        to: GROWING
        trigger: "POST /crop-plans/{id}/begin-growing"
        actor: Agronomist
        preconditions:
          - "planted_acres > 0 (at least one RECORDED PlantingEvent) (ERR_NO_PLANTING_RECORDED)"
        side_effects:
          - "provisional_cost_per_acre recomputed"

      - from: GROWING
        to: HARVESTING
        trigger: "POST /crop-plans/{id}/begin-harvest"
        actor: Agronomist
        preconditions:
          - "For every non-voided restricted ApplicationRecord on this plan, current clock >= applied_at + preharvest_interval_days (PHI satisfied) (ERR_PREHARVEST_INTERVAL_ACTIVE)"
        side_effects:
          - "Plan accepts HarvestEvents"

      - from: HARVESTING
        to: CLOSED
        trigger: "POST /crop-plans/{id}/close"
        actor: FarmManager
        preconditions:
          - "harvested_acres > 0 (ERR_NO_HARVEST_RECORDED)"
        side_effects:
          - "final_cost_per_acre computed (final variant)"
          - "total_yield_units recomputed (yield_aggregation)"
          - "Parcel.active_crop_plan_count recomputed (plan leaves active set)"
          - "increments Parcel.version by 1"

      - from: DRAFT
        to: ABANDONED
        trigger: "POST /crop-plans/{id}/abandon"
        actor: FarmManager
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: ABANDONED
        trigger: "POST /crop-plans/{id}/abandon"
        actor: FarmManager
        preconditions:
          - "No PlantingEvent exists for this plan with status RECORDED (ERR_PLAN_ALREADY_PLANTED)"
        side_effects:
          - "Parcel.active_crop_plan_count recomputed"
          - "increments Parcel.version by 1"

  # ----- ApplicationRecord: linear-with-revert (LOGGED -> CONFIRMED -> VOIDED) -----
  - entity: ApplicationRecord
    initial_state: LOGGED
    terminal_states: [VOIDED]
    transitions:
      - from: LOGGED
        to: CONFIRMED
        trigger: "POST /application-records/{id}/confirm"
        actor: Applicator
        preconditions:
          - "CropPlan.status IN {GROWING} (ERR_PLAN_NOT_GROWING)"
          - "If InputProduct.restricted_use: acting applicator's Applicator.certified == true (ERR_APPLICATOR_NOT_CERTIFIED)"
          - "If InputProduct.restricted_use: acting Applicator.id == ApplicationRecord.applicator_user_id (ERR_APPLICATOR_MISMATCH)"
          - "Parcel.status != RESTRICTED OR current clock >= Parcel.reentry_blocked_until (ERR_REENTRY_INTERVAL_ACTIVE)"
          - "Cumulative confirmed rate_per_acre for this product on this plan + rate_per_acre <= InputProduct.max_seasonal_rate_per_acre when set (ERR_SEASONAL_RATE_EXCEEDED)"
        side_effects:
          - "applied_at stamped from server clock"
          - "quantity_used and applied_cost computed; CropPlan.actual_input_cost recomputed"
          - "InputLot debit is NOT performed here (applications draw from product, not a seed lot)"
          - "If restricted_use: reentry_clear_at = applied_at + reentry_interval_hours; a ComplianceRecord (ACTIVE) is created; Parcel.status -> RESTRICTED; Parcel.reentry_blocked_until recomputed; increments Parcel.version by 1"
          - "provisional_cost_per_acre recomputed"

      - from: LOGGED
        to: VOIDED
        trigger: "POST /application-records/{id}/void"
        actor: Agronomist
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /application-records/{id}/void"
        actor: Agronomist
        preconditions: []
        side_effects:
          - "CropPlan.actual_input_cost recomputed (this record drops out)"
          - "provisional_cost_per_acre recomputed"
          - "If restricted_use: the linked ComplianceRecord.status -> SUPERSEDED; Parcel.reentry_blocked_until recomputed across remaining ACTIVE compliance records; if no ACTIVE compliance record keeps the parcel blocked AND no other restricted record holds it, Parcel.status -> AVAILABLE; increments Parcel.version by 1"
        note: "Compensation: voiding a confirmed restricted application reverses its cost, supersedes its compliance record, and releases the re-entry block — leaving Parcel.reentry_blocked_until equal to the max over the remaining ACTIVE compliance records (or null)."

  # ----- HarvestLot: PARALLEL state dimensions (quality_status x sale_status) -----
  - entity: HarvestLot
    initial_state: "UNGRADED x IN_INVENTORY"
    terminal_states: ["REJECTED x IN_INVENTORY", "* x SHIPPED"]
    transitions:
      # quality axis
      - from: "quality_status=UNGRADED"
        to: "quality_status=GRADE_A"
        trigger: "POST /harvest-lots/{id}/grade (grade=GRADE_A)"
        actor: Agronomist
        preconditions:
          - "quality_status == UNGRADED (ERR_LOT_ALREADY_GRADED)"
        side_effects: ["sale eligibility opens for contracts whose min_quality <= GRADE_A"]
      - from: "quality_status=UNGRADED"
        to: "quality_status=GRADE_B"
        trigger: "POST /harvest-lots/{id}/grade (grade=GRADE_B)"
        actor: Agronomist
        preconditions:
          - "quality_status == UNGRADED (ERR_LOT_ALREADY_GRADED)"
        side_effects: []
      - from: "quality_status=UNGRADED"
        to: "quality_status=REJECTED"
        trigger: "POST /harvest-lots/{id}/grade (grade=REJECTED)"
        actor: Agronomist
        preconditions:
          - "quality_status == UNGRADED (ERR_LOT_ALREADY_GRADED)"
          - "sale_status == IN_INVENTORY with quantity_committed == 0 (ERR_LOT_ALREADY_COMMITTED)"
        side_effects: ["lot becomes permanently ineligible for any contract"]
      # sale axis (independent of quality axis except eligibility gate)
      - from: "sale_status=IN_INVENTORY"
        to: "sale_status=PARTIALLY_COMMITTED"
        trigger: "POST /sale-contracts/{id}/commit-lot (partial fill)"
        actor: SalesAgent
        preconditions:
          - "quality_status IN {GRADE_A, GRADE_B} and >= contract.min_quality (ERR_LOT_QUALITY_INSUFFICIENT)"
          - "HarvestLot.crop_plan_id's CropPlan.crop == SaleContract.crop (ERR_CROP_MISMATCH)"
        side_effects:
          - "quantity_committed increased; committed_contract_id set; SaleContract.committed_quantity & contract_value recomputed; SaleContract may advance to PARTIALLY_FILLED"
      - from: "sale_status=IN_INVENTORY"
        to: "sale_status=FULLY_COMMITTED"
        trigger: "POST /sale-contracts/{id}/commit-lot (full fill)"
        actor: SalesAgent
        preconditions:
          - "quality_status IN {GRADE_A, GRADE_B} and >= contract.min_quality (ERR_LOT_QUALITY_INSUFFICIENT)"
          - "HarvestLot.crop_plan_id's CropPlan.crop == SaleContract.crop (ERR_CROP_MISMATCH)"
        side_effects:
          - "quantity_committed == quantity; committed_contract_id set; SaleContract recomputed"
      - from: "sale_status=PARTIALLY_COMMITTED"
        to: "sale_status=FULLY_COMMITTED"
        trigger: "POST /sale-contracts/{id}/commit-lot (remaining fill, same contract)"
        actor: SalesAgent
        preconditions:
          - "target contract == committed_contract_id (ERR_LOT_ALREADY_COMMITTED)"
        side_effects: ["quantity_committed == quantity; SaleContract recomputed"]
      - from: "sale_status=FULLY_COMMITTED"
        to: "sale_status=SHIPPED"
        trigger: "POST /sale-contracts/{id}/ship (cascade to committed lots)"
        actor: SalesAgent
        preconditions:
          - "owning SaleContract.status == FILLED (ERR_CONTRACT_NOT_FILLED)"
        side_effects: ["lot frozen; sale_status SHIPPED is terminal"]

  # ----- SaleContract: branching fork-join (OPEN -> {PARTIALLY_FILLED, FILLED} -> SHIPPED, with CANCELLED branch) -----
  - entity: SaleContract
    initial_state: OPEN
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: OPEN
        to: PARTIALLY_FILLED
        trigger: "POST /sale-contracts/{id}/commit-lot (committed < contracted)"
        actor: SalesAgent
        preconditions:
          - "lot eligible (see HarvestLot commit preconditions)"
        side_effects:
          - "committed_quantity & contract_value recomputed; lot side effects per HarvestLot machine"
      - from: PARTIALLY_FILLED
        to: PARTIALLY_FILLED
        trigger: "POST /sale-contracts/{id}/commit-lot (still committed < contracted)"
        actor: SalesAgent
        preconditions:
          - "lot eligible"
        side_effects: ["committed_quantity & contract_value recomputed"]
      - from: OPEN
        to: FILLED
        trigger: "POST /sale-contracts/{id}/commit-lot (committed == contracted in one commit)"
        actor: SalesAgent
        preconditions:
          - "lot eligible"
          - "committed_quantity after commit == contracted_quantity (no over-commit; ERR_CONTRACT_OVERCOMMIT)"
        side_effects: ["committed_quantity & contract_value recomputed"]
      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "POST /sale-contracts/{id}/commit-lot (committed reaches contracted)"
        actor: SalesAgent
        preconditions:
          - "committed_quantity after commit == contracted_quantity (ERR_CONTRACT_OVERCOMMIT if it would exceed)"
        side_effects: ["committed_quantity & contract_value recomputed"]
      - from: FILLED
        to: SHIPPED
        trigger: "POST /sale-contracts/{id}/ship"
        actor: SalesAgent
        preconditions:
          - "status == FILLED (ERR_CONTRACT_NOT_FILLED)"
        side_effects:
          - "Every HarvestLot with committed_contract_id == this contract: sale_status -> SHIPPED (cascade)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sale-contracts/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects: []
      - from: PARTIALLY_FILLED
        to: CANCELLED
        trigger: "POST /sale-contracts/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "Every committed HarvestLot released: quantity_committed -> 0; committed_contract_id -> null; sale_status -> IN_INVENTORY; contract committed_quantity & contract_value recomputed (compensation)"

  # ----- IrrigationEvent: linear with cancel -----
  - entity: IrrigationEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /irrigation-events/{id}/complete"
        actor: Agronomist
        preconditions:
          - "current clock >= window_start (ERR_IRRIGATION_NOT_DUE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /irrigation-events/{id}/cancel"
        actor: Agronomist
        preconditions: []
        side_effects: ["window freed for overlap purposes"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: approve-plan-stale-parcel
    parent_entity: Parcel
    write_endpoint: "POST /crop-plans/{id}/approve"
    occ_field: "expected_parcel_version"
    description: |
      Approving a CropPlan against a Parcel whose version has advanced since the
      client last observed it is rejected with a stale-version error. The approve
      transition mutates the Parcel (active_crop_plan_count, version), so a second
      approval that legitimately succeeds under product semantics (another plan on
      the same parcel was just approved, or a restricted application just flipped
      the parcel to RESTRICTED) must carry the up-to-date parcel version; a stale
      one is rejected.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cost_per_acre
    trigger: "CropPlan begin-growing (provisional), confirm/void application & labor/equipment changes (provisional recompute), CropPlan close (final)"
    algorithm: forward_looking
    formula: |
      Overhead pool O = budget_equipment_cost (estimate) or actual_equipment_cost (final),
      treated as shared overhead allocated by acreage share.
      PROVISIONAL (forward_looking, estimate):
        numerator   = budget_input_cost + budget_labor_cost + budget_equipment_cost
        denominator = planned_acres
        provisional_cost_per_acre = round(numerator / denominator, 2)   # round once at the end
      FINAL (chronological, actuals):
        direct      = actual_input_cost + actual_labor_cost          # accrued line-item actuals
        overhead    = actual_equipment_cost                          # allocated by acreage share below
        # acreage-share allocation: this plan absorbs equipment cost in proportion to
        # harvested_acres / max(harvested_acres, 1) -> for a single-plan harvest the full
        # equipment cost lands on the plan. Allocation factor f = 1 when this is the only
        # plan harvested on the parcel in this season_year; otherwise
        #   f = harvested_acres / (sum of harvested_acres across CLOSED+HARVESTING plans on the parcel for season_year)
        numerator   = direct + overhead * f
        denominator = harvested_acres        # ACTUAL acres harvested, not planned
        final_cost_per_acre = round(numerator / denominator, 2)
    input_set: "Provisional uses budget_* fields and planned_acres. Final uses confirmed (non-voided) ApplicationRecords, all LaborEntry, RECORDED EquipmentUsage, and RECORDED HarvestEvents' acres_harvested."
    constants:
      MIN_DENOMINATOR_GUARD: 1
    precision: "2 decimal places, round_half_up; round once at the very end (sum-then-round), NOT per line item"
    variants:
      - name: provisional
        when: "Plan in DRAFT..GROWING; before CLOSED"
        difference: "Uses budgeted estimates over planned_acres; ignores actuals; full equipment budget, no acreage-share split."
      - name: final
        when: "Plan transitions to CLOSED"
        difference: "Uses chronological actuals over harvested_acres; equipment overhead allocated by acreage share f across the parcel's plans for the season."

  - name: yield_aggregation
    trigger: "HarvestEvent create (net_quantity), HarvestLot create, CropPlan close (total_yield_units)"
    algorithm: aggregation
    formula: |
      Per HarvestEvent dry-weight net:
        net_quantity = round(gross_quantity * (1 - moisture_pct/100), 2)
      Per CropPlan total yield (SUM-then-ROUND, pinned order):
        total_yield_units = round( SUM over HarvestLots L where
            L.crop_plan_id == plan.id
            AND L.quality_status IN {GRADE_A, GRADE_B}     # REJECTED and UNGRADED excluded
          of L.quantity , 2)
      Tie-break / ordering: addition is commutative; no order sensitivity, but the
      single round happens AFTER the full sum (NOT per-lot rounding then summing).
    input_set: "HarvestLots whose quality_status IN {GRADE_A, GRADE_B}; UNGRADED and REJECTED lots are excluded from total_yield_units."
    constants: {}
    precision: "2 decimal places, round_half_up; round once after the sum"
    variants:
      - name: gross_basis
        when: "An interim read before grading"
        difference: "If asked for raw basis, sums L.quantity over ALL non-rejected lots including UNGRADED — but total_yield_units (the persisted field) always uses the graded-only filter above."

  - name: input_inventory_debit
    trigger: "PlantingEvent create (seed lot debit)"
    algorithm: waterfall_allocation
    formula: |
      need = acres_planted * seed_rate_per_acre  (= seed_units_used)
      Candidate lots: InputLots L where L.input_product_id == PlantingEvent.input_lot's product,
        L.status == OPEN, ordered by L.created_at ASC (FIFO), tie-break by L.created_at then never by id.
      Debit waterfall from the named input_lot_id FIRST, then continue FIFO over remaining OPEN
      lots of the SAME product:
        remaining = need
        for each lot in [named_lot] + (other OPEN lots of same product by created_at ASC):
            take = min(lot.quantity_remaining, remaining)
            lot.quantity_remaining -= take
            if lot.quantity_remaining == 0: lot.status -> DEPLETED
            remaining -= take
            if remaining == 0: break
        if remaining > 0 after exhausting lots: reject (ERR_INSUFFICIENT_INVENTORY); no partial debit persists.
    input_set: "OPEN InputLots of the planting's seed product; named lot consumed first, then FIFO by created_at."
    constants: {}
    precision: "quantities are exact (no rounding of unit counts)"

  - name: restricted_use_window
    trigger: "ApplicationRecord confirm (REI set), CropPlan begin-harvest (PHI check), application confirm (REI block check)"
    algorithm: threshold
    formula: |
      RE-ENTRY (REI) — hours, blocks re-entry / further application on the parcel:
        reentry_clear_at = applied_at + reentry_interval_hours (hours)
        Parcel.reentry_blocked_until = MAX over ACTIVE ComplianceRecords on the parcel of reentry_clear_at
        A new application confirm is BLOCKED when:
            Parcel.status == RESTRICTED AND current_clock < Parcel.reentry_blocked_until
        Boundary: current_clock == reentry_blocked_until is CLEAR (block is strict '<', i.e. allowed at exact expiry).
      PRE-HARVEST (PHI) — whole days, blocks begin-harvest:
        For each non-voided restricted ApplicationRecord A on the plan:
            earliest_harvest_at = A.applied_at + preharvest_interval_days (days)
        begin-harvest is BLOCKED when current_clock < MAX(earliest_harvest_at over such A).
        Boundary: current_clock == earliest_harvest_at is ALLOWED (PHI satisfied at exact day boundary, strict '<').
    input_set: "ACTIVE ComplianceRecords for REI; non-voided restricted ApplicationRecords for PHI."
    constants:
      HOURS_PER_DAY: 24
    precision: "datetime arithmetic; REI in hours, PHI in whole days; comparisons strict '<' for blocking"

  - name: equipment_overlap
    trigger: "EquipmentUsage create"
    algorithm: interval_merge
    formula: |
      A new EquipmentUsage [window_start, window_end) for asset E conflicts with any
      existing RECORDED EquipmentUsage U for the SAME asset E when the half-open
      intervals intersect:
          new.window_start < U.window_end AND U.window_start < new.window_end
      Half-open semantics: adjacency is allowed — new.window_start == U.window_end does
      NOT conflict (back-to-back bookings permitted).
    input_set: "RECORDED EquipmentUsage rows for the same equipment_asset_id."
    constants: {}
    precision: "datetime; half-open [start, end)"

  - name: irrigation_overlap
    trigger: "IrrigationEvent create"
    algorithm: interval_merge
    formula: |
      A new IrrigationEvent [window_start, window_end] for parcel P conflicts with any
      SCHEDULED or COMPLETED IrrigationEvent I on the SAME parcel when the CLOSED
      intervals intersect OR touch within a buffer:
          new.window_start <= I.window_end + BUFFER_HOURS AND
          I.window_start <= new.window_end + BUFFER_HOURS
      Closed-interval + buffer semantics: touching endpoints DO conflict, and bookings
      within BUFFER_HOURS of each other also conflict (soil saturation guard). This is a
      strictly DIFFERENT interval geometry from equipment_overlap (half-open, no buffer).
    input_set: "IrrigationEvents on the same parcel with status IN {SCHEDULED, COMPLETED}."
    constants:
      BUFFER_HOURS: 6
    precision: "datetime; closed [start, end] plus 6h buffer on each side"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum members valid; numeric ranges (e.g., acreage > 0, moisture 0..100) honored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_referential
    check: "Cross-aggregate references coherent: PlantingEvent.input_lot must be a SEED product lot; ApplicationRecord product category SEED is rejected; HarvestLot.crop must match SaleContract.crop on commit"
    error_id: ERR_PRODUCT_CATEGORY_MISMATCH
    http_status: 409
    applies_to: "POST /planting-events, POST /application-records, POST /sale-contracts/{id}/commit-lot"

  - priority: 7
    category: business_safety
    check: "Restricted-use compliance: certified applicator required; applicator identity must match; re-entry interval (REI) must have elapsed before a new application confirm; pre-harvest interval (PHI) must have elapsed before begin-harvest"
    error_id: ERR_REENTRY_INTERVAL_ACTIVE
    http_status: 409
    applies_to: "POST /application-records/{id}/confirm, POST /crop-plans/{id}/begin-harvest"

  - priority: 8
    category: business_temporal
    check: "Resource booking windows must not overlap per their interval semantics: equipment half-open; irrigation closed + 6h buffer"
    error_id: ERR_EQUIPMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /equipment-usages, POST /irrigation-events"

  - priority: 9
    category: business_constraint
    check: "Seasonal rate cap: cumulative confirmed rate_per_acre for a product on a plan must not exceed InputProduct.max_seasonal_rate_per_acre"
    error_id: ERR_SEASONAL_RATE_EXCEEDED
    http_status: 409
    applies_to: "POST /application-records/{id}/confirm"

  - priority: 10
    category: business_fiscal
    check: "Inventory sufficiency: seed lot waterfall must cover seed_units_used; sale-contract commit must not exceed contracted_quantity (overcommit) and lot must have uncommitted quantity"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /planting-events, POST /sale-contracts/{id}/commit-lot"

  - priority: 11
    category: business_constraint
    check: "Optimistic concurrency: expected_parcel_version must equal current Parcel.version on crop-plan approve"
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412
    applies_to: "POST /crop-plans/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Parcel ----------
  - method: POST
    path: "/parcels"
    description: "Create a parcel/field"
    roles: [FarmManager]
    code: 201
    input: [name, acreage, soil_type]
    output: Parcel
    side_effects: ["status=AVAILABLE; active_crop_plan_count=0"]

  - method: GET
    path: "/parcels/{id}"
    description: "Get a parcel"
    roles: [FarmManager, Agronomist, Applicator, SalesAgent]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: GET
    path: "/parcels"
    description: "List parcels (paginated)"
    roles: [FarmManager, Agronomist, Applicator, SalesAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  - method: GET
    path: "/parcels/{id}/crop-plans"
    description: "List crop plans on a parcel (FK reverse-reachability for CropPlan.parcel_id)"
    roles: [FarmManager, Agronomist, Applicator, SalesAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: CropPlan[]
    side_effects: []

  - method: GET
    path: "/parcels/{id}/irrigation-events"
    description: "List irrigation events on a parcel (FK reverse-reachability for IrrigationEvent.parcel_id)"
    roles: [FarmManager, Agronomist, SalesAgent, Applicator]
    code: 200
    input: ["limit?", "offset?"]
    output: IrrigationEvent[]
    side_effects: []

  # ---------- CropPlan ----------
  - method: POST
    path: "/crop-plans"
    description: "Create a crop plan (DRAFT)"
    roles: [Agronomist, FarmManager]
    code: 201
    input: [parcel_id, crop, season_year, planned_acres, budget_input_cost, budget_labor_cost, budget_equipment_cost]
    output: CropPlan
    side_effects: ["status=DRAFT; revision_count=0; computed cost/yield fields initialized"]

  - method: GET
    path: "/crop-plans/{id}"
    description: "Get a crop plan with computed cost/yield fields"
    roles: [FarmManager, Agronomist, Applicator, SalesAgent]
    code: 200
    input: []
    output: CropPlan
    side_effects: []

  - method: GET
    path: "/crop-plans"
    description: "List crop plans (filter by parcel_id, crop, status)"
    roles: [FarmManager, Agronomist, Applicator, SalesAgent]
    code: 200
    input: ["parcel_id?", "crop?", "status?", "season_year?", "limit?", "offset?"]
    output: CropPlan[]
    side_effects: []

  - method: POST
    path: "/crop-plans/{id}/approve"
    description: "Approve a plan (DRAFT or UNDER_REVISION -> APPROVED); OCC on parcel version"
    roles: [FarmManager]
    code: 200
    input: [expected_parcel_version]
    output: CropPlan
    side_effects: ["status -> APPROVED", "Parcel.active_crop_plan_count recomputed", "increments Parcel.version by 1"]

  - method: POST
    path: "/crop-plans/{id}/request-revision"
    description: "Send an APPROVED plan back to UNDER_REVISION (cycle)"
    roles: [Agronomist]
    code: 200
    input: []
    output: CropPlan
    side_effects: ["status -> UNDER_REVISION", "revision_count += 1", "Parcel.active_crop_plan_count recomputed"]

  - method: POST
    path: "/crop-plans/{id}/begin-growing"
    description: "Move APPROVED plan to GROWING"
    roles: [Agronomist]
    code: 200
    input: []
    output: CropPlan
    side_effects: ["status -> GROWING", "provisional_cost_per_acre recomputed"]

  - method: POST
    path: "/crop-plans/{id}/begin-harvest"
    description: "Move GROWING plan to HARVESTING (PHI gate)"
    roles: [Agronomist]
    code: 200
    input: []
    output: CropPlan
    side_effects: ["status -> HARVESTING (only if all PHI windows elapsed)"]

  - method: POST
    path: "/crop-plans/{id}/close"
    description: "Close a HARVESTING plan; compute final cost-per-acre and yield"
    roles: [FarmManager]
    code: 200
    input: []
    output: CropPlan
    side_effects: ["status -> CLOSED", "final_cost_per_acre computed", "total_yield_units recomputed", "Parcel.active_crop_plan_count recomputed", "increments Parcel.version by 1"]

  - method: POST
    path: "/crop-plans/{id}/abandon"
    description: "Abandon a DRAFT or APPROVED plan"
    roles: [FarmManager]
    code: 200
    input: []
    output: CropPlan
    side_effects: ["status -> ABANDONED", "Parcel.active_crop_plan_count recomputed (if was APPROVED)", "increments Parcel.version by 1 (if was APPROVED)"]

  # ---------- InputProduct ----------
  - method: POST
    path: "/input-products"
    description: "Create an input product (seed/fertilizer/chemical catalog item)"
    roles: [FarmManager]
    code: 201
    input: [name, category, unit, unit_cost, "restricted_use?", "reentry_interval_hours?", "preharvest_interval_days?", "max_seasonal_rate_per_acre?"]
    output: InputProduct
    side_effects: []

  - method: GET
    path: "/input-products/{id}"
    description: "Get an input product"
    roles: [FarmManager, Agronomist, Applicator]
    code: 200
    input: []
    output: InputProduct
    side_effects: []

  - method: GET
    path: "/input-products/{id}/lots"
    description: "List lots of a product (FK reverse-reachability for InputLot.input_product_id)"
    roles: [FarmManager, Agronomist, Applicator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InputLot[]
    side_effects: []

  # ---------- InputLot ----------
  - method: POST
    path: "/input-lots"
    description: "Receive a lot of an input product into inventory"
    roles: [FarmManager]
    code: 201
    input: [input_product_id, lot_code, quantity_received]
    output: InputLot
    side_effects: ["quantity_remaining = quantity_received; status=OPEN"]

  - method: GET
    path: "/input-lots/{id}"
    description: "Get an input lot"
    roles: [FarmManager, Agronomist, Applicator]
    code: 200
    input: []
    output: InputLot
    side_effects: []

  # ---------- ApplicationRecord ----------
  - method: POST
    path: "/application-records"
    description: "Log an input application against a crop plan (LOGGED)"
    roles: [Agronomist, Applicator]
    code: 201
    input: [crop_plan_id, input_product_id, applicator_user_id, rate_per_acre, acres_treated]
    output: ApplicationRecord
    side_effects: ["status=LOGGED; quantity_used and applied_cost computed"]

  - method: GET
    path: "/application-records/{id}"
    description: "Get an application record"
    roles: [FarmManager, Agronomist, Applicator]
    code: 200
    input: []
    output: ApplicationRecord
    side_effects: []

  - method: GET
    path: "/application-records"
    description: "List application records (filter by crop_plan_id)"
    roles: [FarmManager, Agronomist, Applicator]
    code: 200
    input: ["crop_plan_id?", "input_product_id?", "applicator_user_id?", "status?", "limit?", "offset?"]
    output: ApplicationRecord[]
    side_effects: []

  - method: POST
    path: "/application-records/{id}/confirm"
    description: "Confirm a logged application; stamps applied_at, enforces compliance, creates ComplianceRecord for restricted products"
    roles: [Applicator]
    code: 200
    input: []
    output: ApplicationRecord
    side_effects: ["status -> CONFIRMED", "applied_at stamped", "CropPlan.actual_input_cost & provisional_cost_per_acre recomputed", "restricted: ComplianceRecord created, Parcel -> RESTRICTED, Parcel.reentry_blocked_until set, increments Parcel.version by 1"]

  - method: POST
    path: "/application-records/{id}/void"
    description: "Void an application (LOGGED or CONFIRMED); compensates cost and compliance"
    roles: [Agronomist]
    code: 200
    input: []
    output: ApplicationRecord
    side_effects: ["status -> VOIDED", "if confirmed: actual_input_cost & provisional_cost_per_acre recomputed", "if restricted: ComplianceRecord -> SUPERSEDED, Parcel.reentry_blocked_until recomputed, Parcel may revert to AVAILABLE, increments Parcel.version by 1"]

  # ---------- ComplianceRecord ----------
  - method: GET
    path: "/compliance-records/{id}"
    description: "Get a compliance (restricted-use) record"
    roles: [FarmManager, Agronomist, Applicator]
    code: 200
    input: []
    output: ComplianceRecord
    side_effects: []

  - method: GET
    path: "/compliance-records"
    description: "List compliance records (filter by crop_plan_id, application_record_id, applicator_user_id, status)"
    roles: [FarmManager, Agronomist, Applicator]
    code: 200
    input: ["crop_plan_id?", "application_record_id?", "applicator_user_id?", "status?", "limit?", "offset?"]
    output: ComplianceRecord[]
    side_effects: []

  # ---------- PlantingEvent ----------
  - method: POST
    path: "/planting-events"
    description: "Record a planting; debits seed lots via FIFO waterfall"
    roles: [Agronomist]
    code: 201
    input: [crop_plan_id, input_lot_id, acres_planted, seed_rate_per_acre]
    output: PlantingEvent
    side_effects: ["seed_units_used debited from seed lots (waterfall)", "CropPlan.planted_acres recomputed", "lots may become DEPLETED"]

  - method: GET
    path: "/planting-events/{id}"
    description: "Get a planting event"
    roles: [FarmManager, Agronomist]
    code: 200
    input: []
    output: PlantingEvent
    side_effects: []

  - method: GET
    path: "/planting-events"
    description: "List planting events (filter by crop_plan_id)"
    roles: [FarmManager, Agronomist]
    code: 200
    input: ["crop_plan_id?", "input_lot_id?", "status?", "limit?", "offset?"]
    output: PlantingEvent[]
    side_effects: []

  - method: POST
    path: "/planting-events/{id}/void"
    description: "Void a planting event; restores seed lot quantities"
    roles: [Agronomist]
    code: 200
    input: []
    output: PlantingEvent
    side_effects: ["status -> VOIDED", "seed lot quantities restored; lots may revert OPEN", "CropPlan.planted_acres recomputed"]

  # ---------- HarvestEvent ----------
  - method: POST
    path: "/harvest-events"
    description: "Record a harvest event on a HARVESTING plan"
    roles: [Agronomist]
    code: 201
    input: [crop_plan_id, acres_harvested, gross_quantity, moisture_pct]
    output: HarvestEvent
    side_effects: ["net_quantity computed; CropPlan.harvested_acres recomputed"]

  - method: GET
    path: "/harvest-events/{id}"
    description: "Get a harvest event"
    roles: [FarmManager, Agronomist, SalesAgent]
    code: 200
    input: []
    output: HarvestEvent
    side_effects: []

  - method: GET
    path: "/harvest-events"
    description: "List harvest events (filter by crop_plan_id)"
    roles: [FarmManager, Agronomist, SalesAgent]
    code: 200
    input: ["crop_plan_id?", "status?", "limit?", "offset?"]
    output: HarvestEvent[]
    side_effects: []

  - method: GET
    path: "/harvest-events/{id}/harvest-lots"
    description: "List lots produced by a harvest event (FK reverse-reachability for HarvestLot.harvest_event_id)"
    roles: [FarmManager, Agronomist, SalesAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: HarvestLot[]
    side_effects: []

  # ---------- HarvestLot ----------
  - method: POST
    path: "/harvest-lots"
    description: "Create an inventory lot from a harvest event"
    roles: [Agronomist]
    code: 201
    input: [harvest_event_id, quantity]
    output: HarvestLot
    side_effects: ["quality_status=UNGRADED; sale_status=IN_INVENTORY; quantity_committed=0"]

  - method: GET
    path: "/harvest-lots/{id}"
    description: "Get a harvest lot (both state dimensions)"
    roles: [FarmManager, Agronomist, SalesAgent]
    code: 200
    input: []
    output: HarvestLot
    side_effects: []

  - method: GET
    path: "/harvest-lots"
    description: "List harvest lots (filter by crop_plan_id, committed_contract_id, quality_status, sale_status)"
    roles: [FarmManager, Agronomist, SalesAgent]
    code: 200
    input: ["crop_plan_id?", "committed_contract_id?", "quality_status?", "sale_status?", "limit?", "offset?"]
    output: HarvestLot[]
    side_effects: []

  - method: POST
    path: "/harvest-lots/{id}/grade"
    description: "Set quality grade on a lot (quality axis)"
    roles: [Agronomist]
    code: 200
    input: [grade]
    output: HarvestLot
    side_effects: ["quality_status -> GRADE_A | GRADE_B | REJECTED"]

  # ---------- SaleContract ----------
  - method: POST
    path: "/sale-contracts"
    description: "Create a sale contract (OPEN)"
    roles: [SalesAgent]
    code: 201
    input: [crop, buyer_name, contracted_quantity, price_per_unit, "min_quality?"]
    output: SaleContract
    side_effects: ["status=OPEN; committed_quantity=0; contract_value=0"]

  - method: GET
    path: "/sale-contracts/{id}"
    description: "Get a sale contract"
    roles: [FarmManager, SalesAgent, Agronomist]
    code: 200
    input: []
    output: SaleContract
    side_effects: []

  - method: GET
    path: "/sale-contracts"
    description: "List sale contracts (filter by crop, status)"
    roles: [FarmManager, SalesAgent, Agronomist]
    code: 200
    input: ["crop?", "status?", "limit?", "offset?"]
    output: SaleContract[]
    side_effects: []

  - method: GET
    path: "/sale-contracts/{id}/harvest-lots"
    description: "List lots committed to a contract (FK reverse-reachability for HarvestLot.committed_contract_id)"
    roles: [FarmManager, SalesAgent, Agronomist]
    code: 200
    input: ["limit?", "offset?"]
    output: HarvestLot[]
    side_effects: []

  - method: POST
    path: "/sale-contracts/{id}/commit-lot"
    description: "Commit (all or part of) a harvest lot's uncommitted quantity to the contract"
    roles: [SalesAgent]
    code: 200
    input: [harvest_lot_id, commit_quantity]
    output: SaleContract
    side_effects: ["lot quantity_committed & sale_status updated; lot.committed_contract_id set; contract committed_quantity/contract_value/status recomputed"]

  - method: POST
    path: "/sale-contracts/{id}/ship"
    description: "Ship a FILLED contract; cascade lots to SHIPPED"
    roles: [SalesAgent]
    code: 200
    input: []
    output: SaleContract
    side_effects: ["status -> SHIPPED", "every committed lot sale_status -> SHIPPED (cascade)"]

  - method: POST
    path: "/sale-contracts/{id}/cancel"
    description: "Cancel an OPEN or PARTIALLY_FILLED contract; release committed lots"
    roles: [SalesAgent]
    code: 200
    input: []
    output: SaleContract
    side_effects: ["status -> CANCELLED", "committed lots released to IN_INVENTORY (compensation)"]

  # ---------- EquipmentAsset ----------
  - method: POST
    path: "/equipment-assets"
    description: "Create an equipment asset"
    roles: [FarmManager]
    code: 201
    input: [name, kind, hourly_cost]
    output: EquipmentAsset
    side_effects: ["status=ACTIVE; total_logged_hours=0"]

  - method: GET
    path: "/equipment-assets/{id}"
    description: "Get an equipment asset"
    roles: [FarmManager, Agronomist]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: []

  - method: GET
    path: "/equipment-assets/{id}/usages"
    description: "List usages of an asset (FK reverse-reachability for EquipmentUsage.equipment_asset_id)"
    roles: [FarmManager, Agronomist]
    code: 200
    input: ["limit?", "offset?"]
    output: EquipmentUsage[]
    side_effects: []

  # ---------- EquipmentUsage ----------
  - method: POST
    path: "/equipment-usages"
    description: "Book equipment usage to a plan; half-open overlap check per asset"
    roles: [Agronomist]
    code: 201
    input: [equipment_asset_id, crop_plan_id, window_start, window_end]
    output: EquipmentUsage
    side_effects: ["hours & usage_cost computed", "EquipmentAsset.total_logged_hours recomputed", "CropPlan.actual_equipment_cost & provisional_cost_per_acre recomputed"]

  - method: GET
    path: "/equipment-usages/{id}"
    description: "Get an equipment usage"
    roles: [FarmManager, Agronomist]
    code: 200
    input: []
    output: EquipmentUsage
    side_effects: []

  - method: GET
    path: "/equipment-usages"
    description: "List equipment usages (filter by crop_plan_id, equipment_asset_id)"
    roles: [FarmManager, Agronomist]
    code: 200
    input: ["crop_plan_id?", "equipment_asset_id?", "status?", "limit?", "offset?"]
    output: EquipmentUsage[]
    side_effects: []

  # ---------- LaborEntry ----------
  - method: POST
    path: "/labor-entries"
    description: "Record labor against a plan"
    roles: [Agronomist, FarmManager]
    code: 201
    input: [crop_plan_id, worker_name, hours, hourly_rate]
    output: LaborEntry
    side_effects: ["labor_cost computed", "CropPlan.actual_labor_cost & provisional_cost_per_acre recomputed"]

  - method: GET
    path: "/labor-entries/{id}"
    description: "Get a labor entry"
    roles: [FarmManager, Agronomist]
    code: 200
    input: []
    output: LaborEntry
    side_effects: []

  - method: GET
    path: "/labor-entries"
    description: "List labor entries (filter by crop_plan_id)"
    roles: [FarmManager, Agronomist]
    code: 200
    input: ["crop_plan_id?", "limit?", "offset?"]
    output: LaborEntry[]
    side_effects: []

  # ---------- IrrigationEvent ----------
  - method: POST
    path: "/irrigation-events"
    description: "Schedule an irrigation event on a parcel; closed+buffer overlap check"
    roles: [Agronomist]
    code: 201
    input: [parcel_id, window_start, window_end, inches_applied]
    output: IrrigationEvent
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/irrigation-events/{id}"
    description: "Get an irrigation event"
    roles: [FarmManager, Agronomist]
    code: 200
    input: []
    output: IrrigationEvent
    side_effects: []

  - method: POST
    path: "/irrigation-events/{id}/complete"
    description: "Mark a scheduled irrigation completed"
    roles: [Agronomist]
    code: 200
    input: []
    output: IrrigationEvent
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/irrigation-events/{id}/cancel"
    description: "Cancel a scheduled irrigation"
    roles: [Agronomist]
    code: 200
    input: []
    output: IrrigationEvent
    side_effects: ["status -> CANCELLED; window freed for overlap"]

  # ---------- Applicator ----------
  - method: POST
    path: "/applicators"
    description: "Register a certified applicator"
    roles: [FarmManager]
    code: 201
    input: [full_name, license_no, "certified?"]
    output: Applicator
    side_effects: []

  - method: GET
    path: "/applicators/{id}"
    description: "Get an applicator"
    roles: [FarmManager, Agronomist, Applicator]
    code: 200
    input: []
    output: Applicator
    side_effects: []

  # ---------- Test-driving clock ----------
  - method: POST
    path: "/_clock/set"
    description: "Test-driving endpoint: set the server's current UTC clock (drives REI/PHI window math deterministically)"
    roles: [FarmManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["server clock advanced/rewound to to_iso8601 for subsequent applied_at stamping and window comparisons"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/ill-typed field, invalid enum, or out-of-range number (acreage<=0, moisture out of 0..100, etc.)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_PARCEL_NOT_AVAILABLE, http: 409, condition: "Crop-plan approve requires Parcel.status == AVAILABLE" }
  - { id: ERR_PLANNED_ACRES_EXCEED_PARCEL, http: 409, condition: "CropPlan.planned_acres exceeds Parcel.acreage" }
  - { id: ERR_STALE_PARCEL_VERSION, http: 412, condition: "expected_parcel_version does not match current Parcel.version on approve" }
  - { id: ERR_PLAN_ALREADY_PLANTED, http: 409, condition: "request-revision or abandon blocked: a RECORDED PlantingEvent exists for the plan" }
  - { id: ERR_NO_PLANTING_RECORDED, http: 409, condition: "begin-growing requires planted_acres > 0" }
  - { id: ERR_NO_HARVEST_RECORDED, http: 409, condition: "close requires harvested_acres > 0" }
  - { id: ERR_PLAN_NOT_GROWING, http: 409, condition: "application confirm requires CropPlan.status == GROWING" }
  - { id: ERR_APPLICATOR_NOT_CERTIFIED, http: 409, condition: "Restricted-use application confirm requires a certified applicator" }
  - { id: ERR_APPLICATOR_MISMATCH, http: 409, condition: "Restricted-use confirm: acting applicator id != ApplicationRecord.applicator_user_id" }
  - { id: ERR_REENTRY_INTERVAL_ACTIVE, http: 409, condition: "Parcel is RESTRICTED and current clock < reentry_blocked_until (REI not elapsed)" }
  - { id: ERR_PREHARVEST_INTERVAL_ACTIVE, http: 409, condition: "begin-harvest blocked: PHI window not elapsed for a restricted application" }
  - { id: ERR_SEASONAL_RATE_EXCEEDED, http: 409, condition: "Cumulative confirmed rate_per_acre would exceed InputProduct.max_seasonal_rate_per_acre" }
  - { id: ERR_PRODUCT_CATEGORY_MISMATCH, http: 409, condition: "Seed lot expected on planting but product is not SEED; or application product is SEED" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Seed lot waterfall cannot cover seed_units_used; no partial debit persisted" }
  - { id: ERR_EQUIPMENT_WINDOW_CONFLICT, http: 409, condition: "EquipmentUsage half-open window intersects an existing RECORDED usage of the same asset" }
  - { id: ERR_EQUIPMENT_DOWN, http: 409, condition: "EquipmentAsset.status == DOWN; cannot book usage" }
  - { id: ERR_IRRIGATION_WINDOW_CONFLICT, http: 409, condition: "IrrigationEvent closed+6h-buffer window conflicts with another SCHEDULED/COMPLETED event on the parcel" }
  - { id: ERR_IRRIGATION_NOT_DUE, http: 409, condition: "irrigation complete before window_start (current clock < window_start)" }
  - { id: ERR_LOT_QUALITY_INSUFFICIENT, http: 409, condition: "Lot quality below contract.min_quality or UNGRADED/REJECTED at commit" }
  - { id: ERR_LOT_ALREADY_GRADED, http: 409, condition: "grade requested on a lot whose quality_status != UNGRADED" }
  - { id: ERR_LOT_ALREADY_COMMITTED, http: 409, condition: "Lot already committed to a different contract, or being graded REJECTED while committed" }
  - { id: ERR_CROP_MISMATCH, http: 409, condition: "Lot's plan crop != SaleContract.crop on commit" }
  - { id: ERR_CONTRACT_OVERCOMMIT, http: 409, condition: "commit-lot would push committed_quantity beyond contracted_quantity" }
  - { id: ERR_CONTRACT_NOT_FILLED, http: 409, condition: "ship requires SaleContract.status == FILLED" }
  - { id: ERR_VALIDATION_WINDOW_INVALID, http: 400, condition: "window_end <= window_start on equipment/irrigation booking" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FarmManager
    description: "Owns parcels, products, lots, equipment, applicator registry; approves/closes/abandons plans"
    identity: opaque
    exclusive_operations:
      - "POST /parcels"
      - "POST /input-products"
      - "POST /input-lots"
      - "POST /equipment-assets"
      - "POST /applicators"
      - "POST /crop-plans/{id}/approve"
      - "POST /crop-plans/{id}/close"
      - "POST /crop-plans/{id}/abandon"
      - "POST /_clock/set"
    shared_operations:
      - "POST /crop-plans (with Agronomist)"
      - "POST /labor-entries (with Agronomist)"
      - "GET endpoints (read access)"

  - name: Agronomist
    description: "Plans and runs crop growth: plantings, harvests, lots, grading, irrigation, equipment usage; drives plan lifecycle except approve/close/abandon"
    identity: opaque
    exclusive_operations:
      - "POST /crop-plans/{id}/request-revision"
      - "POST /crop-plans/{id}/begin-growing"
      - "POST /crop-plans/{id}/begin-harvest"
      - "POST /planting-events"
      - "POST /planting-events/{id}/void"
      - "POST /harvest-events"
      - "POST /harvest-lots"
      - "POST /harvest-lots/{id}/grade"
      - "POST /equipment-usages"
      - "POST /irrigation-events"
      - "POST /irrigation-events/{id}/complete"
      - "POST /irrigation-events/{id}/cancel"
      - "POST /application-records/{id}/void"
    shared_operations:
      - "POST /crop-plans (with FarmManager)"
      - "POST /application-records (with Applicator)"
      - "POST /labor-entries (with FarmManager)"
      - "GET endpoints (read access)"

  - name: Applicator
    description: "Certified restricted-use applicator; confirms applications (entity-backed, identity must match the application's applicator_user_id for restricted products)"
    identity: "entity_backed:Applicator"
    exclusive_operations:
      - "POST /application-records/{id}/confirm"
    shared_operations:
      - "POST /application-records (with Agronomist)"
      - "GET endpoints (read access)"

  - name: SalesAgent
    description: "Manages sale contracts: create, commit lots, ship, cancel"
    identity: opaque
    exclusive_operations:
      - "POST /sale-contracts"
      - "POST /sale-contracts/{id}/commit-lot"
      - "POST /sale-contracts/{id}/ship"
      - "POST /sale-contracts/{id}/cancel"
    shared_operations:
      - "GET endpoints (read access)"
