            - "at the threshold: Retailer.${ret1_id}.fraud_score == 70.00, status == WATCHLIST, handling_fee_tier == PROBATION (the comparison is >=, not >)"
            - "CouponItem.${item_k3_id}.status == REJECTED_DUPLICATE with duplicate_of_item_id == ${item_k2_id}"
