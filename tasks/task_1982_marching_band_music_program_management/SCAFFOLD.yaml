# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BandDirector
    description: "Program head; superset of all operations, subject to segregation-of-duties on arrangement approval"
    identity: opaque
    exclusive_operations:
      - "POST /band/programs, PATCH /band/programs/{id}, POST /band/programs/{id}/advance"
      - "POST /band/students/{id}/suspend, reinstate, withdraw, designate-leader"
      - "POST /band/arrangements/{id}/approve, reject"
      - "POST /band/auditions/{id}/finalize-scores, placements"
      - "POST /band/events/{id}/cancel; POST /band/trips/{id}/cancel"
      - "POST /band/_clock/set_current_utc"
    shared_operations: ["all GETs", "events/trips/auditions/enrollments management shared with AssistantDirector"]
  - name: AssistantDirector
    description: "Second staff conductor; day-to-day scheduling and roster work"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "students create/enroll; events create/weather-watch/relocate/postpone/complete"
      - "trips create/open-roster/lock-roster/complete; enrollments create/confirm/excuse/mark-attendance"
      - "auditions create; audition entries + judge scores; arrangements create (QUOTED)"
  - name: BoosterTreasurer
    description: "Booster club treasurer; money operations"
    identity: opaque
    exclusive_operations:
      - "POST /band/payments (ledger posting)"
      - "POST /band/fundraisers, POST /band/fundraisers/{id}/close"
      - "POST /band/arrangements/{id}/purchase"
      - "POST /band/trips/{id}/finalize"
    shared_operations: ["all GETs"]
  - name: EquipmentManager
    description: "Owns instruments, uniforms, cleaning cycle, and truck logistics"
    identity: opaque
    exclusive_operations:
      - "POST /band/instruments(+retire/complete-maintenance), /band/instrument-assignments(+return/renew)"
      - "POST /band/uniforms(+retire), /band/uniform-assignments(+return)"
      - "POST /band/cleaning-batches(+items/send/receive)"
      - "POST /band/truck-charters(+loads/depart/return/cancel)"
    shared_operations: ["all GETs"]
  - name: SectionLeader
    description: "Student section leader; requests arrangements and files chair challenges for own section"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /band/auditions/{id}/challenge"
    shared_operations: ["POST /band/arrangements (creates QUOTED)", "all GETs"]
  - name: Student
    description: "Enrolled student; self-service trip enrollment and excuse, own ledger visibility"
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations: ["POST /band/trip-enrollments (self only)", "POST /band/trip-enrollments/{id}/excuse (self only)", "all GETs"]
  - name: Any
    description: "Any authenticated role; read access and program-independent reads"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
