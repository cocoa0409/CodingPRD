              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "C18", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 1, autopay_enabled: false }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "GET /invoices?rental_agreement_id=${agr}"
              payload: {}
              as: FacilityOperator
              captures: { inv: "$.data[0].id" }
            - call: "POST /mail-items"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", mail_class: "FIRST_CLASS" }
              as: FacilityOperator
              captures: { mi: $.data.id }
            - call: "POST /forwarding-requests"
              payload: { mail_item_id: "${mi}", kind: "SCAN" }
              as: FacilityOperator
              captures: { fr: $.data.id }
          trigger:
            - call: "POST /forwarding-requests/${fr}/complete"
              payload: {}
              as: FacilityOperator
            - call: "GET /invoices/${inv}"
              payload: {}
              as: FacilityOperator
              captures: { bal_mid: $.data.balance_cents }
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", amount_cents: 150, method: "CARD_MANUAL" }
              as: FacilityOperator
            - call: "GET /invoices/${inv}"
              payload: {}
              as: FacilityOperator
              captures: { bal_final: $.data.balance_cents }
          assert:
            - "Invoice ${inv}.balance_cents == 3150 after the FORWARDING charge posts (3000 RENTAL + 150 FORWARDING, autopay OFF)"
            - "Invoice ${inv}.balance_cents == 3000 after the 150c manual payment (conserved back to the pre-charge value 3000)"
