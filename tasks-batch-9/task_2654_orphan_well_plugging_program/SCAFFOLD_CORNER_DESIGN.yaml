          assert:
            - "the first call returns HTTP 422 with error_id ERR_OPERATOR_STILL_SOLVENT"
            - "the first call's error_id is NOT ERR_INVALID_STATE_TRANSITION, which the generic priority-40 rule would have returned"
            - "after the first call Operator.${op_id}.status == ACTIVE, bond_amount_cents == 250000 and bond_forfeited_at == null"
            - "the DECLARE_INSOLVENT call returns HTTP 200 with data.status == INSOLVENT and insolvency_declared_at == 2026-08-01T00:00:00Z"
            - "the second FORFEIT_BOND call returns HTTP 200 with data.status == REVOKED, bond_amount_cents == 0 and bond_forfeited_at == 2026-08-01T00:00:00Z"
            - "a FundingSource of kind FORFEITED_BOND now exists with authorized_cents == 250000, bond_operator_id == ${op_id}, allowable_cost_categories == [PLUGGING, RECLAMATION], expires_at == 2036-07-29T00:00:00Z and status == ACTIVE"
            - "Well.${w_id}.status == ORPHAN_CANDIDATE and Operator.${op_id}.orphan_candidate_count == 1"

      - name: bidding_is_rejected_before_open_and_after_close_but_accepted_while_open
        claim_type: Cross-entity validation
        grounds:
          - validations[priority 43].ERR_SOLICITATION_NOT_OPEN
        distinguishing_aspect: |
          The same bid payload is submitted at three points of the solicitation lifecycle. DRAFT and
          EVALUATING both reject with ERR_SOLICITATION_NOT_OPEN even though EVALUATING is downstream
          of a state that accepted bids, so an implementation that only guards the DRAFT side passes
          the first half and fails the third call.
        test_recipe:
          setup:
            - "one DRAFT Solicitation and two eligible contractors; logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /contractors"
              payload: { name: "Bighorn Plugging", license_number: "P-60001", bond_amount_cents: 2500000, performance_score: 89 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c1_id: $.data.id }
            - call: "POST /contractors"
              payload: { name: "Teton Cementing", license_number: "P-60002", bond_amount_cents: 2500000, performance_score: 91 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c2_id: $.data.id }
            - call: "POST /solicitations"
              payload: { region_code: "WY", scope_description: "district 5 orphan well plugging", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
          trigger:
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c1_id}", cement_per_sack_cents: 4000, rig_day_rate_cents: 800000, casing_per_ft_cents: 1200, mobilization_fee_cents: 2400000, technical_score: 80 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { err_draft: $.data.error_id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c1_id}", cement_per_sack_cents: 4000, rig_day_rate_cents: 800000, casing_per_ft_cents: 1200, mobilization_fee_cents: 2400000, technical_score: 80 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { bid1_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c2_id}", cement_per_sack_cents: 4100, rig_day_rate_cents: 810000, casing_per_ft_cents: 1250, mobilization_fee_cents: 2450000, technical_score: 85 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { err_eval: $.data.error_id }
          assert:
            - "the first bid returns HTTP 422 with error_id ERR_SOLICITATION_NOT_OPEN and Solicitation.${sol_id}.status == DRAFT"
            - "GET /bids?solicitation_id=${sol_id} returns total_count == 0 after the first call: nothing was persisted"
            - "the second bid returns HTTP 201 with data.status == SUBMITTED and evaluated_unit_cost_cents == 7040000"
            - "the third bid returns HTTP 422 with error_id ERR_SOLICITATION_NOT_OPEN while Solicitation.${sol_id}.status == EVALUATING"
            - "GET /bids?solicitation_id=${sol_id} returns total_count == 1 at the end: only the OPEN-window bid exists"
            - "Contractor.${c2_id} has no bid on this solicitation"

      - name: grant_report_on_a_source_expiring_at_the_clock_instant_is_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority 45].ERR_FUNDING_SOURCE_EXPIRED
        distinguishing_aspect: |
          Both grants still carry status ACTIVE because no clock tick has swept them, so the rule has
          to be decided on the timestamp: expires_at exactly equal to the clock is expired (at or
          before), while one second... one day later is not. A status-only implementation accepts
          both, and an exclusive comparison accepts the first.
        test_recipe:
          setup:
            - "two FEDERAL_GRANT sources, one expiring exactly at the 2026-08-01T00:00:00Z clock instant and one expiring 2026-08-02T00:00:00Z, both still status ACTIVE"
          setup_api_calls:
            - call: "POST /funding-sources"
              payload: { kind: "FEDERAL_GRANT", name: "FY25 orphan well grant closing today", authorized_cents: 5000000, expires_at: "2026-08-01T00:00:00Z", allowable_cost_categories: ["PLUGGING"], federal_match_required_pct: 40 }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_today_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "FEDERAL_GRANT", name: "FY26 orphan well grant closing tomorrow", authorized_cents: 5000000, expires_at: "2026-08-02T00:00:00Z", allowable_cost_categories: ["PLUGGING"], federal_match_required_pct: 40 }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_tomorrow_id: $.data.id }
          trigger:
            - call: "POST /funding-sources/${fs_today_id}/grant-reports"
              payload: { period_start: "2026-07-01", period_end: "2026-07-31" }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { err: $.data.error_id }
            - call: "POST /funding-sources/${fs_tomorrow_id}/grant-reports"
              payload: { period_start: "2026-07-01", period_end: "2026-07-31" }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { rep_id: $.data.id }
          assert:
            - "the first call returns HTTP 422 with error_id ERR_FUNDING_SOURCE_EXPIRED"
            - "FundingSource.${fs_today_id}.status == ACTIVE: the rejection is driven by expires_at, not by the stored status"
            - "GET /funding-sources/${fs_today_id}/grant-reports returns total_count == 0"
            - "the second call returns HTTP 201 with data.status == DUE, wells_plugged_count == 0, reported_cost_cents == 0 and federal_share_pct == 0.00"
            - "GrantReport.${rep_id}.source_id == ${fs_tomorrow_id} and period_start == 2026-07-01 and period_end == 2026-07-31"
            - "both sources have reporting_required == true, so neither call could have been rejected by the priority-30 non-reportable check"

      - name: entry_cannot_be_ordered_one_day_before_the_supplied_notice_window_ends
        claim_type: Temporal validation
        grounds:
          - validations[priority 51].ERR_STATUTORY_NOTICE_PERIOD_ACTIVE
          - entities.SiteAccess.fields.window_end_at
        distinguishing_aspect: |
          waiting_period_days is supplied as 45, overriding the STATUTORY_ENTRY default of 30, so the
          window closes 2026-09-15 rather than 2026-08-31: an implementation that ignores the payload
          and uses the default would wrongly allow entry two weeks early. The rule is strict-before,
          so 2026-09-14 is rejected and the boundary instant 2026-09-15 is allowed.
        test_recipe:
          setup:
            - "one ORPHAN_CONFIRMED-eligible Well with a REQUESTED STATUTORY_ENTRY SiteAccess created at the 2026-08-01T00:00:00Z clock with waiting_period_days 45"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Wind River Petroleum", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 250000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-013-31002", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
            - call: "POST /wells/${w_id}/site-accesses"
              payload: { surface_owner_name: "Halvorsen Ranch", mode: "STATUTORY_ENTRY", waiting_period_days: 45 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /site-accesses/${sa_id}/resolution"
              payload: { outcome: "ORDER_ENTRY", legal_authority_citation: "W.S. 30-5-104(d)(vi)" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /site-accesses/${sa_id}/resolution"
              payload: { outcome: "ORDER_ENTRY", legal_authority_citation: "W.S. 30-5-104(d)(vi)" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "SiteAccess.${sa_id}.notice_sent_at == 2026-08-01T00:00:00Z, waiting_period_days == 45 and window_end_at == 2026-09-15T00:00:00Z"
            - "window_end_at is NOT 2026-08-31T00:00:00Z, the value the STATUTORY_ENTRY default of 30 days would produce"
            - "the 2026-09-14 call returns HTTP 422 with error_id ERR_STATUTORY_NOTICE_PERIOD_ACTIVE"
            - "after the rejected call SiteAccess.${sa_id}.status == REQUESTED, legal_authority_citation == null, resolved_at == null and Well.${w_id}.access_status == ACCESS_PENDING"
            - "the 2026-09-15 call returns HTTP 200 with data.status == ENTRY_ORDERED and resolved_at == 2026-09-15T00:00:00Z"
            - "SiteAccess.${sa_id}.legal_authority_citation == 'W.S. 30-5-104(d)(vi)' and Well.${w_id}.access_status == ENTRY_ORDERED"
            - "SiteAccess.${sa_id}.compensation_cents == 0, the default for an omitted optional input"

      - name: revegetation_cannot_start_before_pit_closure_or_before_ninety_days
        claim_type: Temporal validation
