      - name: reserve_coverage_rounds_to_three_months_blocks_rate_increase
        grounds:
          - calculations.reserve_coverage_months
          - validations[priority=91]
          - errors[ERR_RESERVE_ABOVE_INCREASE_CEILING]
          - state_machines.FeeRateSchedule.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          A different precision mechanism from the contamination boundary: the gate compares the
          2-decimal round_half_up value, so a reserve of 14999999c against a 5000000c monthly cost
          rounds up to exactly 3.00 and the rate increase is refused by the strict `< 3.00` test — one
          cent short of the target is still "fully funded".
        test_recipe:
          setup:
            - "NV program: annual cost 60000000c (monthly 5000000c) over 60000 units, other revenue 3000000c, 3-month reserve target, opening reserve 14999999c → reserve_coverage_months 3.00, recommended_rate_cents 989, band [791, 1187]."
            - "MATTRESS rate 1000c ACTIVE for [2026-08-01, 2026-09-01) (approved while no ACTIVE rate existed, so the increase gate did not apply)."
            - "A successor MATTRESS proposal of 1100c abutting at 2026-09-01 is PROPOSED and awaiting approval."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "NV", program_name: "Nevada Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 14999999, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_nv_id: $.data.id, v_nv_1: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_nv_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_state_program_version: "${v_nv_1}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_m1000_id: $.data.id }
            - call: "POST /fee-rate-schedules/${sch_m1000_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-2"
            - call: "POST /fee-rate-schedules/${sch_m1000_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /state-programs/${prog_nv_id}"
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { v_nv_2: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_nv_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1100, effective_from: "2026-09-01T00:00:00Z", expected_state_program_version: "${v_nv_2}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_m1100_id: $.data.id }
          trigger:
            - call: "POST /fee-rate-schedules/${sch_m1100_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-2"
          assert:
            - "StateProgram.${prog_nv_id}.reserve_coverage_months == 3.00"
            - "StateProgram.${prog_nv_id}.reserve_balance_cents == 14999999"
            - "StateProgram.${prog_nv_id}.recommended_rate_cents == 989"
            - "Trigger response: HTTP 422 with data.error_id == ERR_RESERVE_ABOVE_INCREASE_CEILING"
            - "FeeRateSchedule.${sch_m1100_id}.status == PROPOSED"
            - "FeeRateSchedule.${sch_m1100_id}.approved_by_user_id == null"
            - "FeeRateSchedule.${sch_m1100_id}.band_low_cents == 791 and FeeRateSchedule.${sch_m1100_id}.band_high_cents == 1187"

