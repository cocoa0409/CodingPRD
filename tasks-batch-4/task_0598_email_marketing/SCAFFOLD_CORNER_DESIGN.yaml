  # =========================================================================
  - section: endpoints
    instances:

      - name: clock_startup_default_is_2026_05_01
        claim_type: Computed read
        grounds: [endpoints, entities.Subscriber.fields.created_at]
        distinguishing_aspect: "Before any POST /_clock/set_current_utc, the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time -- a subscriber created first thing carries created_at == 2026-05-01T00:00:00.000Z."
        test_recipe:
          setup: ["Empty database; the clock has never been set."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: PlatformAdmin
              captures: { s1: $.data.id, ca: $.data.created_at, cc: $.data.consent_confirmed_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:30:00Z" }
              as: PlatformAdmin
              captures: { now: $.data.current_utc }
          assert:
            - "${ca} == \"2026-05-01T00:00:00.000Z\""
            - "${cc} == \"2026-05-01T00:00:00.000Z\""
            - "${now} == \"2026-06-15T12:30:00.000Z\""

      - name: ops_run_returns_zeroed_counter_summary_on_empty_epoch
        claim_type: Computed read
        grounds: [endpoints]
        distinguishing_aspect: "POST /_ops/run on an account with nothing due returns all five counters at 0 (subscribers_archived, campaigns_dispatched, sends_created, enrollments_advanced, billing_cycles_closed) while still taking a contact snapshot into the OPEN cycle."
        test_recipe:
          setup: ["One account with a single-opt-in audience holding 1 CONFIRMED subscriber; nothing scheduled, no journeys, clock at 2026-05-02T00:00:00Z (well before period_end)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
              captures: { a: $.data.subscribers_archived, b: $.data.campaigns_dispatched, c: $.data.sends_created, d: $.data.enrollments_advanced, e: $.data.billing_cycles_closed }
          assert:
            - "${a} == 0 and ${b} == 0 and ${c} == 0 and ${d} == 0 and ${e} == 0"
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].peak_contact_count == 1   # the snapshot still ran"
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].status == \"OPEN\""

      - name: segment_member_count_recomputed_on_list_read
        claim_type: Computed read
        grounds: [calculations.segment_member_set, entities.Segment.fields.member_count]
        distinguishing_aspect: "member_count is not a frozen snapshot: a segment created when the audience had 1 CONFIRMED contact reports member_count 2 on the next GET /audiences/{id}/segments after a second contact is added."
        test_recipe:
          setup: ["One single-opt-in audience with 1 CONFIRMED subscriber and one segment over CONFIRMED with min_engagement_score 0."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: PlatformAdmin
            - call: "POST /audiences/${aud}/segments"
              payload: { name: "All", consent_states: ["CONFIRMED"], min_engagement_score: 0 }
              as: PlatformAdmin
              captures: { seg: $.data.id, mc0: $.data.member_count }
          trigger:
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s2@x.com", consent_source: "API" }
              as: PlatformAdmin
          assert:
            - "${mc0} == 1"
            - "GET /audiences/${aud}/segments -> $.data[0].member_count == 2   # recomputed on read"

