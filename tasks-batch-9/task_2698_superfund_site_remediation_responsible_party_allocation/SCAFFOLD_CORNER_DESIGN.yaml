            - "RecordOfDecision.${rod_id}.status == SIGNED, signed_by_user_id == rpm-003 and selected_alternative_id == ${alt_a} (auto-selected from the protective pool)"
            - "Site.${site_id}.unrecovered_cost_cents == 1150000000 and recovered_cost_cents == 0"

      - name: corner_state_gate_outranks_the_fiscal_gate_on_one_posting
