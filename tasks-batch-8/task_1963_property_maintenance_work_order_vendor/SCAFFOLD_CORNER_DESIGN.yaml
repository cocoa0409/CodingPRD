      - name: vendor_cannot_start_inhouse_work_order
        claim_type: role_denial
        grounds: ["roles[Vendor]", "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Vendor is a permitted role on start, but the order is IN_HOUSE: assigned_vendor_id is null, so the entity-backed ownership check fails with ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
