# =============================================================================
# §1.9 Scaffold Corner Design — task_2289 Festival Talent Buying & Radius
# Administration. Breadth walk of references/claim-extraction-guide.md against
# this scaffold's §1.1-§1.7. Sections below are exactly the guide's nine
# sections; claim_type values are exactly the guide's per-section rows.
#
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub naming the covering §1.8 instance instead of a
# duplicate test_recipe.
#
# Shared canonical fixture (unless an instance overrides it):
#   logical clock 2026-08-01T00:00:00Z
#   Festival "Harbor Lights Festival" 2026, market 47.6062 / -122.3321,
#     event 2026-12-04..2026-12-06, talent_budget_cents 10000000,
#     contingency_reserve_pct 0.05 -> allocatable_budget_cents 9500000
#   BudgetTiers HEADLINER 0.50 -> 4750000 | MID_CARD 0.30 -> 2850000 |
#     EMERGING 0.20 -> 1900000 (remainder 0), max_slots 5 each
#   Stage "Aurora Main" capacity 24000, curfew 1380, day cap 600, buffer 30,
#     flagship
#   Artist "Nova Kade" ELECTRONIC draw_score 72 -> ceiling 1800000
#     (max(500000, 72*25000) = 1800000, genre factor 1.00, headroom 4750000)
#   days_until_show at that clock = 338 - 213 = 125 -> deposit_pct 0.50
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: festival_creation_stamps_derived_budget_and_posture
        claim_type: creation
        grounds:
          - endpoints[POST /festival-ops/festivals]
          - entities.Festival.fields.allocatable_budget_cents
          - entities.Festival.fields.lineup_posture
          - entities.Festival.fields.announcement_phase
          - calculations.tier_allocation_waterfall
        distinguishing_aspect: |
          Creation-time derivation only: the reserve is taken off the top with a single
          round_half_up (10000000 * 0.05 = 500000.0 -> 500000) so allocatable_budget_cents
          is 9500000 and every ledger/posture field starts at its declared zero, with
          version 1 and tiers_allocated false before any waterfall has run.
        test_recipe:
          setup:
            - "Empty database with the logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
          trigger:
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id" }
          assert:
            - "HTTP 201"
            - "response_type == \"object\" and meta.api_request_id is present"
            - "data.allocatable_budget_cents == 9500000"
            - "data.committed_budget_cents == 0"
            - "data.tiers_allocated == false"
            - "data.announcement_phase == \"PRESALE\""
            - "data.lineup_posture == \"OPEN\""
            - "data.headliner_anchor_count == 0"
            - "data.version == 1 and data.id is a non-empty string"

      - name: festival_and_stage_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Festival.fields.contingency_reserve_pct
          - entities.Stage.fields.changeover_buffer_minutes
          - entities.Stage.fields.is_flagship
          - endpoints[POST /festival-ops/stages]
        distinguishing_aspect: |
          Two declared defaults are exercised in one chain: the omitted
          contingency_reserve_pct falls back to 0.05 (so allocatable_budget_cents is
          9500000, not 10000000) and the omitted changeover_buffer_minutes /
          is_flagship fall back to 20 and false, which is what makes the stage
          ineligible for a billing_position 1 offer.
        test_recipe:
          setup:
            - "Festival created without contingency_reserve_pct."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
          trigger:
            - call: "GET /festival-ops/festivals/${fest}"
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Grove", capacity: 6000, daily_curfew_minute: 1200, daily_program_minutes_cap: 360 }
              as: ProductionManager
              captures: { stage_g: "$.data.id" }
          assert:
            - "first call: data.contingency_reserve_pct == 0.05 and data.allocatable_budget_cents == 9500000"
            - "second call: HTTP 201"
            - "second call: data.changeover_buffer_minutes == 20"
            - "second call: data.is_flagship == false"
            - "second call: data.booked_minutes == 0"

      - name: artist_creation_initialises_counters_and_system_fields
        claim_type: system_fields
        grounds:
          - endpoints[POST /festival-ops/artists]
          - entities.Artist.fields.strict_risk_score
          - entities.Artist.fields.adjudicated_risk_score
          - entities.Artist.fields.default_radius_miles
        distinguishing_aspect: |
          The four risk counters are `source: computed` and must be seeded to 0 by the
          server even though the artist already carries draw_score 72 - the draw
          penalty only materialises through GET radius-risk, never as a stored score at
          creation. default_radius_miles falls back to 75 and id / created_at /
          updated_at / version are system-generated.
        test_recipe:
          setup:
            - "Empty database with the clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
          trigger:
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72 }
              as: TalentBuyer
              captures: { artist_n: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.reported_conflict_count == 0"
            - "data.radius_breach_count == 0"
            - "data.strict_risk_score == 0"
            - "data.adjudicated_risk_score == 0"
            - "data.default_radius_miles == 75"
            - "data.version == 1 and data.created_at == data.updated_at"

      - name: offer_creation_computes_slot_end_and_creates_provisional_clause
        claim_type: computed_fields
        grounds:
          - endpoints[POST /festival-ops/offers]
          - entities.Offer.fields.slot_end_utc
          - entities.Offer.fields.guarantee_ceiling_cents
          - entities.RadiusClause.fields.enforcement_status
          - state_machines.RadiusClause.initial_state
        distinguishing_aspect: |
          A DRAFT offer commits nothing: slot_end_utc is derived as
          21:00 + 90 minutes = 22:30, the ceiling and factor are still at their
          creation defaults (0 and 1.0 - they are only stamped at issue), and exactly
          one RadiusClause exists in PROVISIONAL with booking_id null, while the tier's
          committed_cents and slots_committed stay 0.
        test_recipe:
          setup:
            - "Canonical base fixture: festival, three allocated tiers, flagship stage, Nova Kade."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_a: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_n: "$.data.id" }
          trigger:
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest}", artist_id: "${artist_n}", budget_tier_id: "${tier_h}", stage_id: "${stage_a}", guarantee_cents: 1800000, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-04T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_1: "$.data.id" }
            - call: "GET /festival-ops/radius-clauses"
              payload: { offer_id: "${offer_1}" }
              as: BusinessAffairs
              captures: { clause: "$.data[0].id" }
            - call: "GET /festival-ops/budget-tiers/${tier_h}"
              as: TalentBuyer
          assert:
            - "first call: HTTP 201 and data.slot_end_utc == \"2026-12-04T22:30:00Z\""
            - "first call: data.status == \"DRAFT\", data.round_number == 0, data.issued_by_user_id == null"
            - "first call: data.guarantee_ceiling_cents == 0 and data.genre_balance_factor == 1.0"
            - "second call: total_count == 1 and data[0].enforcement_status == \"PROVISIONAL\""
            - "second call: data[0].waiver_status == \"NONE\", data[0].booking_id == null, data[0].radius_miles == 150, data[0].exclusivity_scope == \"FULL\""
            - "third call: data.committed_cents == 0 and data.slots_committed == 0"

      - name: budget_tier_retrieval_after_waterfall
        claim_type: retrieval
        grounds:
          - endpoints[GET /festival-ops/budget-tiers/{id}]
          - endpoints[GET /festival-ops/festivals/{id}/budget-tiers]
          - calculations.tier_allocation_waterfall
        distinguishing_aspect: |
          Read-back of stored waterfall output: 9500000 splits 0.50/0.30/0.20 into
          4750000 / 2850000 / 1900000 with a zero remainder, and the collection read is
          ordered by tier_rank ASC rather than by insertion order (EMERGING was created
          last but is returned last only because its rank is 3).
        test_recipe:
          setup:
            - "Festival with three tiers allocated; no offers exist."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
          trigger:
            - call: "GET /festival-ops/budget-tiers/${tier_h}"
              as: FinanceController
            - call: "GET /festival-ops/festivals/${fest}/budget-tiers"
              payload: { limit: 10, offset: 0 }
              as: FinanceController
          assert:
            - "first call: HTTP 200 and data.allocation_cents == 4750000"
            - "first call: data.committed_cents == 0, data.slots_committed == 0, data.status == \"OPEN\""
            - "second call: total_count == 3 and has_more == false"
            - "second call: data[0].tier_rank == 1 and data[0].allocation_cents == 4750000"
            - "second call: data[1].allocation_cents == 2850000 and data[2].allocation_cents == 1900000"
            - "second call: data[0].allocation_cents + data[1].allocation_cents + data[2].allocation_cents == 9500000"

      - name: offers_list_pagination_envelope_and_slot_ordering
        claim_type: listing
        grounds:
          - endpoints[GET /festival-ops/offers]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three DRAFT offers are created in descending slot order (21:00, then 12:00,
          then 15:00) so insertion order and the declared slot_start_utc ASC ordering
          disagree; limit 2 must return the 12:00 and 15:00 rows with has_more true and
          total_count 3, and offset 2 must return the 21:00 row with has_more false.
        test_recipe:
          setup:
            - "Canonical base fixture plus three DRAFT offers on Aurora Main for 2026-12-04."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_a: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_n: "$.data.id" }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest}", artist_id: "${artist_n}", budget_tier_id: "${tier_h}", stage_id: "${stage_a}", guarantee_cents: 500000, billing_position: 1, set_length_minutes: 60, slot_start_utc: "2026-12-04T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_late: "$.data.id" }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest}", artist_id: "${artist_n}", budget_tier_id: "${tier_h}", stage_id: "${stage_a}", guarantee_cents: 500000, billing_position: 3, set_length_minutes: 60, slot_start_utc: "2026-12-04T12:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_early: "$.data.id" }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest}", artist_id: "${artist_n}", budget_tier_id: "${tier_h}", stage_id: "${stage_a}", guarantee_cents: 500000, billing_position: 2, set_length_minutes: 60, slot_start_utc: "2026-12-04T15:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_mid: "$.data.id" }
          trigger:
            - call: "GET /festival-ops/offers"
              payload: { festival_id: "${fest}", limit: 2, offset: 0 }
              as: TalentBuyer
            - call: "GET /festival-ops/offers"
              payload: { festival_id: "${fest}", limit: 2, offset: 2 }
              as: TalentBuyer
          assert:
            - "first call: HTTP 200, response_type == \"array\", total_count == 3, has_more == true, limit == 2, offset == 0"
            - "first call: data has length 2 with data[0].slot_start_utc == \"2026-12-04T12:00:00Z\" and data[1].slot_start_utc == \"2026-12-04T15:00:00Z\""
            - "second call: total_count == 3, has_more == false, data has length 1"
            - "second call: data[0].slot_start_utc == \"2026-12-04T21:00:00Z\""
            - "every returned row has status == \"DRAFT\""

      - name: unknown_ids_return_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority 10]
          - validations[priority 11]
          - errors[ERR_FESTIVAL_NOT_FOUND]
          - errors[ERR_OFFER_NOT_FOUND]
          - errors[ERR_BOOKING_NOT_FOUND]
        distinguishing_aspect: |
          The 404 is keyed to the entity of the segment that failed, not to a generic
          NOT_FOUND: the same syntactically valid UUID produces ERR_FESTIVAL_NOT_FOUND
          on a festival path, ERR_OFFER_NOT_FOUND on an offer path and
          ERR_BOOKING_NOT_FOUND on a booking path, and priority 11 gives the same
          treatment to an unresolvable body FK rather than 422.
        test_recipe:
          setup:
            - "Canonical base fixture; the probed UUIDs belong to no row."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_a: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_n: "$.data.id" }
          trigger:
            - call: "GET /festival-ops/festivals/11111111-1111-4111-8111-111111111111"
              as: TalentBuyer
              captures: { err_fest: "$.data.error_id" }
            - call: "GET /festival-ops/offers/22222222-2222-4222-8222-222222222222"
              as: TalentBuyer
              captures: { err_offer: "$.data.error_id" }
            - call: "GET /festival-ops/bookings/33333333-3333-4333-8333-333333333333"
              as: TalentBuyer
              captures: { err_booking: "$.data.error_id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "44444444-4444-4444-8444-444444444444", tier_code: "DIRECT_SUPPORT", tier_rank: 4, allocation_pct: 0.1, max_slots: 2 }
              as: TalentBuyer
              captures: { err_body_fk: "$.data.error_id" }
          assert:
            - "first call: HTTP 404 with error_id ERR_FESTIVAL_NOT_FOUND"
            - "second call: HTTP 404 with error_id ERR_OFFER_NOT_FOUND"
            - "third call: HTTP 404 with error_id ERR_BOOKING_NOT_FOUND"
