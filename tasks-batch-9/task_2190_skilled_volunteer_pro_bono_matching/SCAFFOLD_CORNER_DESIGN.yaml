            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /engagements/${eng_id}/agreements shows the row with status == \"SENT\", counter_round == 0, terms_revision_no == 1 and last_countered_by == null"
            - "indemnity_cap_usd is still 25000.00"
