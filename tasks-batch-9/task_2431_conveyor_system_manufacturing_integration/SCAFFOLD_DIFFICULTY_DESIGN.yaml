  # =========================================================================
  # Rule 8 — resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: zone_window_buffer_padded_half_open_exclusion_boundary
        grounds:
          - validations[priority=12]
          - errors[ERR_ZONE_WINDOW_OVERLAP]
          - entities.SiteZone.fields.buffer_minutes
          - entities.CutoverWindow.fields.start_utc
        distinguishing_aspect: |
          The SiteZone is an exclusive resource with a 60-minute quiet pad: a second window starting
          2026-08-10T23:30:00Z is rejected because it falls inside the first window's padded tail, while one
          starting exactly 2026-08-11T00:00:00Z is accepted because the padded comparison is strictly
          less-than — exclusive single-occupancy with a buffer, not a counted capacity.
        test_recipe:
          setup:
            - "Project frozen with SiteZone Z-INBOUND (throughput_share_bps 10000, protected shift 480-1080, buffer_minutes 60)."
            - "Two FabricationLot rows in FAT_PASSED in a bay with concurrent_capacity 3, occupying disjoint intervals."
            - "One SCHEDULED CutoverWindow on the zone from 2026-08-10T19:00:00Z to 2026-08-10T23:00:00Z."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_to: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_to}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_to1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_to}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_to2: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_to}", from_segment_id: "${seg_to1}", to_segment_id: "${seg_to2}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_to}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_to}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-10", concurrent_capacity: 3 }
              as: ShopSupervisor
              captures: { bay_to: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_to}", lot_code: "LOT-1000", staging_bay_id: "${bay_to}", segment_codes: ["IB-01"], occupancy_start_utc: "2026-08-03T00:00:00Z", occupancy_end_utc: "2026-08-05T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_to1: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_to}", lot_code: "LOT-1001", staging_bay_id: "${bay_to}", segment_codes: ["TR-02"], occupancy_start_utc: "2026-08-06T00:00:00Z", occupancy_end_utc: "2026-08-08T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_to2: $.data.id }
            - call: "POST /site-zones"
              payload: { project_id: "${proj_to}", zone_code: "Z-INBOUND", throughput_share_bps: 10000, protected_shift_start_minute: 480, protected_shift_end_minute: 1080, buffer_minutes: 60 }
              as: SiteManager
              captures: { zone_to: $.data.id }
            - call: "POST /cutover-windows"
              payload: { project_id: "${proj_to}", site_zone_id: "${zone_to}", fabrication_lot_id: "${lot_to1}", start_utc: "2026-08-10T19:00:00Z", end_utc: "2026-08-10T23:00:00Z" }
              as: SiteManager
              captures: { win_to1: $.data.id }
          trigger:
            - call: "POST /cutover-windows"
              payload: { project_id: "${proj_to}", site_zone_id: "${zone_to}", fabrication_lot_id: "${lot_to2}", start_utc: "2026-08-10T23:30:00Z", end_utc: "2026-08-11T02:00:00Z" }
              as: SiteManager
            - call: "POST /cutover-windows"
              payload: { project_id: "${proj_to}", site_zone_id: "${zone_to}", fabrication_lot_id: "${lot_to2}", start_utc: "2026-08-11T00:00:00Z", end_utc: "2026-08-11T03:00:00Z" }
              as: SiteManager
              captures: { win_to2: $.data.id }
          assert:
            - "the 23:30 request returns 409 with error_id ERR_ZONE_WINDOW_OVERLAP"
            - "the 00:00 request returns 201 and CutoverWindow.${win_to2}.status == SCHEDULED"
            - "CutoverWindow.${win_to2}.start_utc == '2026-08-11T00:00:00Z' (exactly the padded end of the first window, so the strict comparison admits it)"
            - "GET /cutover-windows?site_zone_id=${zone_to} returns total_count == 2"
            - "CutoverWindow.${win_to1}.status == SCHEDULED (unaffected by the rejected request)"

      - name: staging_bay_closed_interval_aggregate_capacity_exceeded
        grounds:
          - validations[priority=12]
          - errors[ERR_STAGING_BAY_CAPACITY_EXCEEDED]
          - entities.StagingBay.fields.concurrent_capacity
          - entities.FabricationLot.fields.occupancy_start_utc
        distinguishing_aspect: |
          The StagingBay is a counted resource with concurrent_capacity 2 and CLOSED occupancy intervals, so
          three lots merely touching at the single instant 2026-08-07T00:00:00Z push that instant to three
          occupancies and the third request is rejected — a capacity-2 aggregate over closed intervals, the
          opposite semantics from the zone's exclusive half-open buffered window.
        test_recipe:
          setup:
            - "Project frozen with required_throughput_cph 1250."
            - "One StagingBay BAY-11 with concurrent_capacity 2."
            - "Two PLANNED FabricationLot rows in that bay: 2026-08-03 to 2026-08-07 and 2026-08-07 to 2026-08-11, sharing the endpoint instant."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_sb: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_sb}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_sb1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_sb}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_sb2: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_sb}", from_segment_id: "${seg_sb1}", to_segment_id: "${seg_sb2}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_sb}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_sb}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-11", concurrent_capacity: 2 }
              as: ShopSupervisor
              captures: { bay_sb: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_sb}", lot_code: "LOT-1100", staging_bay_id: "${bay_sb}", segment_codes: ["IB-01"], occupancy_start_utc: "2026-08-03T00:00:00Z", occupancy_end_utc: "2026-08-07T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_sb1: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_sb}", lot_code: "LOT-1101", staging_bay_id: "${bay_sb}", segment_codes: ["TR-02"], occupancy_start_utc: "2026-08-07T00:00:00Z", occupancy_end_utc: "2026-08-11T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_sb2: $.data.id }
          trigger:
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_sb}", lot_code: "LOT-1102", staging_bay_id: "${bay_sb}", segment_codes: ["IB-01"], occupancy_start_utc: "2026-08-07T00:00:00Z", occupancy_end_utc: "2026-08-09T00:00:00Z" }
              as: ShopSupervisor
          assert:
            - "the response is 409 with error_id ERR_STAGING_BAY_CAPACITY_EXCEEDED"
            - "GET /fabrication-lots?staging_bay_id=${bay_sb} returns total_count == 2"
            - "FabricationLot.${lot_sb1}.status == PLANNED and FabricationLot.${lot_sb2}.status == PLANNED"
            - "the rejection is caused solely by the shared endpoint instant 2026-08-07T00:00:00Z being covered by three closed intervals"

  # =========================================================================
  # Rule 9 — compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: spares_ledger_conserved_across_reprovisioning_runs
        grounds:
          - calculations.spares_budget_waterfall
          - entities.Project.fields.spares_budget_cents
          - entities.Project.fields.spares_allocated_cents
          - entities.Project.fields.spares_unallocated_cents
        distinguishing_aspect: |
          spares_budget_cents == spares_allocated_cents + spares_unallocated_cents holds exactly after every
          run: the first run over two CRITICAL lines splits 5,000,000 into 3,206,000 + 1,794,000, and the second
          run — after two MAJOR lines are added — resets every prior allocation to zero before re-funding and
          splits the same 5,000,000 into 4,754,008 + 245,992, with no cent double-counted from run one.
        test_recipe:
          setup:
            - "One Project with spares_budget_cents 5000000."
            - "Two DRAFT CRITICAL SparePartLine rows: MOTOR-3KW (850000 x 2, lead 45) and SORT-SHOE (125500 x 12, lead 30)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_ci: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_ci}", part_no: "MOTOR-3KW", criticality: "CRITICAL", unit_cost_cents: 850000, min_stock_qty: 2, lead_time_days: 45 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { ci_motor: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_ci}", part_no: "SORT-SHOE", criticality: "CRITICAL", unit_cost_cents: 125500, min_stock_qty: 12, lead_time_days: 30 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { ci_shoe: $.data.id }
            - call: "GET /projects/${proj_ci}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_ci_v1: $.data.version }
          trigger:
            - call: "POST /projects/${proj_ci}/spares-provisioning"
              payload: { expected_project_version: "${proj_ci_v1}" }
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_ci}", part_no: "BELT-24IN", criticality: "MAJOR", unit_cost_cents: 215001, min_stock_qty: 6, lead_time_days: 60 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { ci_belt: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_ci}", part_no: "PHOTO-EYE", criticality: "MAJOR", unit_cost_cents: 430002, min_stock_qty: 3, lead_time_days: 21 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { ci_eye: $.data.id }
            - call: "GET /projects/${proj_ci}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_ci_v2: $.data.version }
            - call: "POST /projects/${proj_ci}/spares-provisioning"
              payload: { expected_project_version: "${proj_ci_v2}" }
              as: ProjectDirector
              as_user_id: "pd-001"
          assert:
            - "after run 1, Project.${proj_ci}.spares_allocated_cents == 3206000 and Project.${proj_ci}.spares_unallocated_cents == 1794000"
            - "after run 1, 3206000 + 1794000 == 5000000 == Project.${proj_ci}.spares_budget_cents"
            - "after run 2, Project.${proj_ci}.spares_allocated_cents == 4754008 and Project.${proj_ci}.spares_unallocated_cents == 245992"
            - "after run 2, 4754008 + 245992 == 5000000 == Project.${proj_ci}.spares_budget_cents"
            - "after run 2, SparePartLine.${ci_motor}.allocated_cents == 1700000 (re-funded, not doubled to 3400000)"
            - "after run 2, SparePartLine.${ci_belt}.allocated_cents == 774004 and SparePartLine.${ci_eye}.allocated_cents == 774004"
            - "after run 2, every SparePartLine of the project has status in {ALLOCATED, PARTIAL, UNFUNDED, DRAFT} with no row left holding an allocation from run 1"

      - name: cutover_abort_restores_facility_share_ledger_without_drift
        grounds:
          - state_machines.CutoverWindow.IN_PROGRESS_to_ABORTED
          - entities.Project.fields.legacy_share_bps
          - entities.Project.fields.in_transition_share_bps
          - entities.Project.fields.cutover_share_bps
          - state_machines.SiteZone.CUTOVER_IN_PROGRESS_to_LIVE_LEGACY
        distinguishing_aspect: |
          legacy_share_bps + in_transition_share_bps + cutover_share_bps == 10000 holds at every step of
          start-then-abort: 10000/0/0 becomes 6000/4000/0 when the window starts and returns to exactly
          10000/0/0 on abort, with the SiteZone back in LIVE_LEGACY — a basis-points share ledger across two
          entities, distinct from the cents ledger of the spares instance.
        test_recipe:
          setup:
            - "Project frozen and IN_FABRICATION with two SiteZone rows: Z-INBOUND (throughput_share_bps 4000) and Z-OUTBOUND (throughput_share_bps 6000), both LIVE_LEGACY, summing to exactly 10000."
            - "One FabricationLot in FAT_PASSED."
            - "One SCHEDULED CutoverWindow on Z-INBOUND from 2026-08-10T19:00:00Z to 2026-08-10T23:00:00Z, with the logical clock at 2026-08-10T20:00:00Z."
