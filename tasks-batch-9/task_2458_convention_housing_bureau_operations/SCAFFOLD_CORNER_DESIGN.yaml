  # ===================================================================================
  # SECTION 5 — ENDPOINTS
  # ===================================================================================
  - section: endpoints
    instances:
      - name: hotel_create_read_and_distance_ordered_listing
        claim_type: standard_crud
        grounds:
          - endpoints[POST /housing/hotels]
          - endpoints[GET /housing/hotels/{id}]
          - endpoints[GET /housing/hotels]
        distinguishing_aspect: "The list endpoint orders by distance_to_venue_miles ASC then name ASC regardless of insertion order, so the 0.3-mile property created second comes back first, and the standing filter narrows the page to the ACTIVE property."
        test_recipe:
          setup: ["No hotels yet."]
          setup_api_calls:
            - call: "POST /housing/hotels"
              payload: { name: "Airport Inn", distance_to_venue_miles: 4.5, room_tax_pct: 0.12, total_rooms: 120 }
              as: BureauCoordinator
              captures: { far_hotel_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { near_hotel_id: $.data.id }
            - call: "PATCH /housing/hotels/${far_hotel_id}/standing"
              payload: { standing: "SUSPENDED" }
              as: BureauCoordinator
          trigger:
            - call: "GET /housing/hotels/${near_hotel_id}"
              payload: {}
              as: Attendee
              as_user_id: "att-anon"
            - call: "GET /housing/hotels"
              payload: { limit: 10, offset: 0 }
              as: Attendee
              as_user_id: "att-anon"
            - call: "GET /housing/hotels"
              payload: { standing: "ACTIVE" }
              as: Attendee
              as_user_id: "att-anon"
          assert:
            - "the single-hotel read returns HTTP 200 with data.id == ${near_hotel_id} and data.room_tax_pct == 0.1475"
            - "the unfiltered list returns total_count == 2 with data[0].id == ${near_hotel_id} and data[1].id == ${far_hotel_id}"
            - "the unfiltered list has_more == false"
            - "the ACTIVE-filtered list returns total_count == 1 with data[0].id == ${near_hotel_id}"
            - "Hotel.${far_hotel_id}.standing == SUSPENDED"

      - name: request_changes_action_returns_block_to_the_bureau
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /housing/hotel-blocks/{id}/request-changes]
          - state_machines.HotelBlock.TERMS_SUBMITTED_to_CHANGES_REQUESTED
        distinguishing_aspect: "request-changes is a hotel-side action with an empty body: it moves TERMS_SUBMITTED -> CHANGES_REQUESTED and bumps HotelBlock.version, but leaves revision_round at 1 — only a further terms submission advances the negotiation counter to 2."
        test_recipe:
          setup: ["Block in TERMS_SUBMITTED after one terms submission (revision_round 1)."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/request-changes"
              payload: {}
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version, status_after: $.data.status, rounds_after: $.data.revision_round }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 20900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
          assert:
            - "${status_after} == CHANGES_REQUESTED"
            - "${rounds_after} == 1"
            - "${block_v3} == ${block_v2} + 1"
            - "the second terms submission returns HTTP 200 with data.status == TERMS_SUBMITTED and data.revision_round == 2"
            - "HotelBlock.${block_id}.negotiated_nightly_rate_cents == 20900"

