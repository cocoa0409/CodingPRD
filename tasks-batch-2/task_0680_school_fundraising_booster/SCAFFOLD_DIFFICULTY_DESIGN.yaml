              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 5 } ] }
              as: CampaignAdmin
              captures: { o_id: $.data.id }
            - call: "POST /fundraising/orders/${o_id}/pay"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /fundraising/orders/${o_id}/refund"
              payload: {}
              as: CampaignAdmin
            - call: "GET /fundraising/campaigns/${camp_id}"
              payload: {}
              as: Treasurer
              captures: { gc: $.data.gross_collected_cents }
          assert:
            - "Order.${o_id}.payment_status == REFUNDED"
            - "Campaign.${camp_id}.gross_collected_cents == 0"

      # --- #2: refund conserves seller prize-tier eligibility (tier credit / count) ---
      - name: refund_conserves_seller_credit_and_drops_tier
        grounds:
          - state_machines.Order.PAID_to_REFUNDED
          - calculations.seller_credited
          - calculations.prize_tier_earned
          - entities.Seller.fields.credited_cents
          - entities.Seller.fields.earned_prize_tier_id
        distinguishing_aspect: |
          DIFFERENT conserved quantity = Seller.credited_cents (per-seller credit
          ledger, not campaign-wide money). After pay then refund of the same
          order, the seller's credited_cents returns to the value contributed by
          the OTHER still-PAID order (5842), and earned_prize_tier_id drops from
          SILVER(10000) back to BRONZE(5000) — the refund's effect on credit is
          exactly the inverse of the pay's.
        test_recipe:
          setup:
            - "ACTIVE CATALOG campaign, 1 seller, 1 product (price2000/cost800/stock100) + MUG(1299) + PEN(750); tiers BRONZE(5000), SILVER(10000)."
            - "Order O1 PAID total 10825; Order O2 PAID total 5842 (mug x3 + pen x2). Seller credited 16667 -> SILVER."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Inv2", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "BRONZE", threshold_cents: 5000, prize_description: "b" }
              as: CampaignAdmin
              captures: { bronze_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "SILVER", threshold_cents: 10000, prize_description: "s" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "MUG", name: "Mug", unit_price_cents: 1299, unit_cost_cents: 500, stock_qty: 100 }
              as: CampaignAdmin
              captures: { mug_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "PEN", name: "Pen", unit_price_cents: 750, unit_cost_cents: 200, stock_qty: 100 }
              as: CampaignAdmin
              captures: { pen_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 5 } ] }
              as: CampaignAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /fundraising/orders/${o1_id}/pay"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "C", buyer_email: "c@x.com", lines: [ { product_id: "${mug_id}", quantity: 3 }, { product_id: "${pen_id}", quantity: 2 } ] }
              as: CampaignAdmin
              captures: { o2_id: $.data.id }
            - call: "POST /fundraising/orders/${o2_id}/pay"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /fundraising/orders/${o1_id}/refund"
              payload: {}
              as: CampaignAdmin
            - call: "GET /fundraising/sellers/${seller_id}"
              payload: {}
              as: Treasurer
              captures: { credit: $.data.credited_cents, earned: $.data.earned_prize_tier_id }
          assert:
            - "Seller.${seller_id}.credited_cents == 5842"
            - "Seller.${seller_id}.earned_prize_tier_id == ${bronze_id}"
