            - "GET /flights with aircraft_id == ${ac1} returns total_count == 2"

      - name: missing_role_header_returns_unauthenticated
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Authentication precedes everything, including authorisation: the same
          creation body that an administrator may submit is refused with 401
          ERR_UNAUTHENTICATED - not 403 - when no role header accompanies the
          request, and a read is refused the same way, so anonymous access is
          not quietly allowed for GETs.
        test_recipe:
          setup:
            - "One airframe exists so that the anonymous read has a real target."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
          trigger:
            - call: "POST /runways"
              payload: { airport_code: "LSZH", designator: "16", elevation_ft: 1416, length_m: 3700 }
              as: NONE
              captures: { e_write: $.data.error_id }
            - call: "GET /aircraft/${ac1}"
              payload: {}
              as: NONE
              captures: { e_read: $.data.error_id }
          assert:
            - "both triggers are issued with no role header at all"
            - "both triggers return HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "GET /runways with no filters, as LoadControlAdmin, returns total_count == 0"

      - name: undeclared_role_name_returns_unauthenticated
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A role header that is present but names none of the six declared
          roles is an authentication failure, not an authorisation one: the
          request is 401 ERR_UNAUTHENTICATED rather than 403, which keeps
          unknown principals out of the role-matching logic entirely.
        test_recipe:
          setup:
            - "One airframe exists; the request carries the role name FuelPlanner, which the scaffold never declares."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
          trigger:
            - call: "GET /aircraft/${ac1}"
              payload: {}
              as: FuelPlanner
              captures: { e_unknown: $.data.error_id }
          assert:
            - "HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "the response is not 403 and carries no aircraft payload"

