            - call: "GET /mountain-ops/day-plans/${day_id}/access-reservations"
              payload: { state: "CONFIRMED" }
              as: GroomingLead
            - call: "POST /mountain-ops/access-reservations/${res1}/check-in"
              payload: {  }
              as: GuestServicesAgent
            - call: "POST /mountain-ops/access-reservations/${res1}/release"
              payload: {  }
              as: GuestServicesAgent
          assert:
            - "Triggers 2, 3 and 4: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - never 412, because ${dp_v} was captured immediately before and is current."
            - "Trigger 5: HTTP 201 with state == 'CONFIRMED' and allocated_stalls == 3, at the same party_code 'G1' the three refusals used, so none of them persisted a row."
            - "Triggers 6 and 7: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - and the reservation is still 'CONFIRMED' afterwards."
            - "Trigger 8: HTTP 200 - the MountainOpsDirector who was refused the check-in reads the whole reservation, including party_size 10 and allocated_stalls 3."
            - "Trigger 9: HTTP 200 with total_count == 1 - the GroomingLead may list the admissions of the day even though no admission write is open to that role."
            - "Trigger 10: HTTP 200 with state == 'CHECKED_IN'."
            - "Trigger 11: HTTP 200 with state == 'RELEASED' and allocated_stalls == 0; the day plan returns to admitted_guest_count 0 and parking_stalls_used 0."

  - section: complexity_layers
    instances:
      - name: a_stale_terrain_area_version_is_rejected_and_the_refreshed_retry_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[session-create-stale-terrain-area]
          - validations[priority=17]
          - errors[ERR_STALE_TERRAIN_AREA_VERSION]
          - endpoints[POST /mountain-ops/snowmaking-sessions]
          - entities.SeasonConfig.fields.water_reserved_af
        distinguishing_aspect: |
          The OCC token is the version of a DIFFERENT entity from the one being created, so the writer that
          invalidates it is an unrelated endpoint: a snow stake reading. The corner is the pair of
          conservation assertions around the rejection - a 412 must reserve no water on the season ledger
          and commit no flow on the pump house, and must NOT itself bump the TerrainArea version, which is
          why the very same stale token still fails the second time. The last two triggers prove the token
          is consumed by SUCCESS as well: the accepted create advances the version, so replaying the token
          that just worked is now stale.
        test_recipe:
          setup:
            - "A PRESEASON season 2026-27 with water_right_seasonal_af 250.000, one CLOSED terrain area T1 with a single 40.0 inch stake reading, and one ONLINE pump house PH1 of max_gpm 2400."
