              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "Family.${fam_id}.status == DELINQUENT"

      - name: existence_before_temporal_on_session_create
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - state_machines.ClassSection.PLANNED_to_SCHEDULED
        distinguishing_aspect: |
          Adding a session to a NON-EXISTENT section would otherwise also raise a room-conflict (priority 9,
          business_temporal); the existence check (priority 4, category existence) wins -> ERR_NOT_FOUND,
          a different error-category pair than the state/fiscal conflict above.
        test_recipe:
          setup:
            - "A room and instructor exist and a real section with a 10:00 session occupies the room, but the trigger targets a bogus section id."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "EX Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
