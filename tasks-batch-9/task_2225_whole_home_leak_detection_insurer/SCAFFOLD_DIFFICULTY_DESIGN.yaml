  - rule_id: resource_temporal_overlap
    instances:
      - name: irrigation_window_half_open_overlap_on_property
        grounds:
          - validations[priority=31]
          - errors[ERR_IRRIGATION_WINDOW_OVERLAP]
          - entities.IrrigationWindow.fields.start_at
          - entities.IrrigationWindow.fields.end_at
          - entities.Property.fields.irrigation_present
        distinguishing_aspect: |
          RESOURCE = Property ${p1}'s irrigation schedule; INTERVAL SEMANTICS = strict half-open [start_at, end_at)
          non-overlap, so a window starting exactly at an existing window's end_at (11:00Z) is ACCEPTED while one
          starting one minute earlier (10:59Z) is REFUSED with ERR_IRRIGATION_WINDOW_OVERLAP. Different resource entity
          and different semantics from snooze_cooldown_buffered_window_on_device, whose interval is a Device-scoped
          occupancy window EXTENDED by a 60-minute cooldown buffer with an inclusive right boundary.
