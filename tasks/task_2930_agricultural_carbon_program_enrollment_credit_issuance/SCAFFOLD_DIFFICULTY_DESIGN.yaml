            - "hop 5: Enrollment.${e5_id}.permanence_status == BREACHED"
            - "hop 6: GrowerPayment.${pay5_id}.status == CLAWED_BACK and Enrollment.${e5_id}.accrued_payment_cents == 0"
            - "hop 6: Grower.${g5_id}.outstanding_clawback_cents == 792000 (booked once per reversal event, NOT 1584000)"
            - "hop 7: Grower.${g5_id}.status == SUSPENDED, Enrollment.${e5_id}.status == SUSPENDED, Field.${f5_id}.status == SUSPENDED"
            - "hop 7 did not corrupt hop 3 of baseline approval: Grower.${g5_id}.total_enrolled_acres == 5000.00 (SUSPENDED fields still count)"
            - "GET /growers/${g5_id}/ledger-summary reports paid_total_cents 0, clawed_back_total_cents 3550000, outstanding_clawback_cents 792000, buffer_contributed_credits 199, lifetime_credits_issued 1217"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: unauthorized_role_beats_path_existence_returns_403
        grounds:
          - validations[priority 2 ERR_UNAUTHORIZED]
          - validations[priority 3 ERR_GROWER_NOT_FOUND]
          - roles.Grower
          - endpoints[POST /growers/{grower_id}/suspend]
        distinguishing_aspect: |
          The same request violates two tiers at once: the caller holds a role that may never
          suspend a grower (priority 2) AND names a grower id that does not exist (priority 3).
          The ladder must answer 403 ERR_UNAUTHORIZED and must NOT leak the non-existence of the
          resource with a 404. The paired control call - identical path, ProgramAdmin role -
          proves the 404 tier is genuinely reachable and that the 403 was not a blanket answer.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z."
            - "No Grower exists with id 00000000-0000-0000-0000-0000000009ff."
            - "Both callers authenticate successfully, so priority 1 (ERR_UNAUTHENTICATED) is not in play."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /growers/00000000-0000-0000-0000-0000000009ff/suspend"
              payload: { suspension_reason: "attempted by a grower principal" }
              as: Grower
              captures: { err_role: "$.data.error_id" }
            - call: "POST /growers/00000000-0000-0000-0000-0000000009ff/suspend"
              payload: { suspension_reason: "attempted by an admin" }
              as: ProgramAdmin
              captures: { err_missing: "$.data.error_id" }
          assert:
            - "first call: HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "first call: the response body does NOT contain ERR_GROWER_NOT_FOUND"
            - "second call: HTTP 404 with error_id ERR_GROWER_NOT_FOUND"
            - "the two calls differ ONLY in the acting role, so the ordering is attributable to the priority ladder"

      - name: invalid_state_beats_segregation_of_duties_on_superseded_baseline
        grounds:
          - validations[priority 9 ERR_INVALID_STATE_TRANSITION]
          - validations[priority 11 ERR_SEGREGATION_OF_DUTIES]
          - state_machines.Baseline.PROPOSED_to_SUPERSEDED
          - entities.Enrollment.fields.screening_decision_admin_id
        distinguishing_aspect: |
          One enrollment ends up with a SUPERSEDED baseline B1 and a PROPOSED baseline B2, and
          every approval below is attempted by the very admin who screened the enrollment, so
          the duties rule at priority 11 is violated in ALL of them. Approving the SUPERSEDED
          baseline must answer ERR_INVALID_STATE_TRANSITION (priority 9 wins), approving the
          PROPOSED one must answer ERR_SEGREGATION_OF_DUTIES (priority 9 is satisfied so 11
          fires), and the same call by a different admin must succeed - three outcomes from one
          endpoint that pin the ordering rather than the mere existence of both rules.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; COVER_CROP standard v1; grower G8 ACTIVE; field F8 MAPPED with mapped_acres 1000.00 and the standard 2021-2025 history."
            - "Enrollment E8 was screened ACCEPT by admin-screener-01, so screening_decision_admin_id == admin-screener-01 and status == ACCEPTED."
            - "Baseline B1 (HISTORICAL_DATA) was proposed first and then superseded by Baseline B2 (MODELED), so B1.status == SUPERSEDED and B2.status == PROPOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "COVER_CROP", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 15.00, sequestration_rate_per_acre: 0.3500, modeled_baseline_rate_per_acre: 0.2000, buffer_base_pct: 10.00, telemetry_required: true, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_cc_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Duties Divide Farms", operator_type: "SOLE_PROPRIETOR", tax_id: "91-2233445", mailing_state: "IL" }
              as: ProgramAdmin
              captures: { g8_id: $.data.id }
            - call: "POST /growers/${g8_id}/fields"
              payload: { field_name: "Divide Quarter", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1010.00, soil_group: "LOAM", county_code: "IL-019" }
              as: ProgramAdmin
              captures: { f8_id: $.data.id }
            - call: "POST /fields/${f8_id}/map-confirm"
              payload: { surveyor_reference: "SUR-2026-0008" }
              as: ProgramAdmin
            - call: "POST /fields/${f8_id}/practice-history"
              payload: { crop_year: 2021, practice_code: "COVER_CROP", adopted: true, evidence_source: "FARM_RECORD", acres: 200.00, observed_emissions_per_acre: 0.1000 }
              as: ProgramAdmin
            - call: "POST /fields/${f8_id}/practice-history"
              payload: { crop_year: 2022, practice_code: "COVER_CROP", adopted: true, evidence_source: "REMOTE_SENSING", acres: 500.00, observed_emissions_per_acre: 0.1200 }
              as: ProgramAdmin
            - call: "POST /fields/${f8_id}/practice-history"
              payload: { crop_year: 2023, practice_code: "COVER_CROP", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1400 }
              as: ProgramAdmin
            - call: "POST /fields/${f8_id}/practice-history"
              payload: { crop_year: 2024, practice_code: "COVER_CROP", adopted: false, evidence_source: "EQUIPMENT_TELEMETRY", acres: 0.00, observed_emissions_per_acre: 0.1600 }
              as: ProgramAdmin
            - call: "POST /fields/${f8_id}/practice-history"
              payload: { crop_year: 2025, practice_code: "COVER_CROP", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1800 }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { field_id: "${f8_id}", practice_standard_id: "${std_cc_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
              captures: { e8_id: $.data.id }
            - call: "POST /enrollments/${e8_id}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${e8_id}/screen"
              payload: { decision: "ACCEPT" }
              as: ProgramAdmin
              as_user_id: "admin-screener-01"
              captures: { e8_v_screened: $.data.version }
            - call: "POST /enrollments/${e8_id}/baselines"
              payload: { method: "HISTORICAL_DATA", expected_enrollment_version: "${e8_v_screened}" }
              as: ProgramAdmin
              as_user_id: "admin-baseline-01"
              captures: { b8a_id: $.data.id }
            - call: "GET /enrollments/${e8_id}"
              payload: {}
              as: ProgramAdmin
              captures: { e8_v_after_first: $.data.version }
            - call: "POST /enrollments/${e8_id}/baselines"
              payload: { method: "MODELED", expected_enrollment_version: "${e8_v_after_first}" }
              as: ProgramAdmin
