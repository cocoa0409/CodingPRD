              as: BuyingPointAdmin
              captures: { ds: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${ds}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
