              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/prospectuses/${p2}/close-submissions"
              payload: {}
              as: PermitSpecialist
          assert:
            - "awarding P1 while it is OPEN returns HTTP 409 ERR_PROSPECTUS_NOT_OPEN — 'open' is not the admissible state for award, EVALUATING is, and the correct expected_use_area_version does not rescue the call"
            - "close-submissions on the OPEN P1 succeeds: status EVALUATING with responsive_application_count 0, and no preliminary score is written because there is nothing responsive to score"
            - "filing ${app_a} against the EVALUATING P1 returns HTTP 409 ERR_PROSPECTUS_NOT_OPEN: the response window closed even though the application itself is a perfectly valid PROSPECTUS_QUEUED candidate on the same area"
            - "awarding the EVALUATING P1 now clears the state gate and fails the next gate instead: HTTP 409 ERR_NO_RESPONSIVE_APPLICATIONS, and P1 stays EVALUATING with awarded_application_id null"
            - "the use area's version is still ${ua_ver} after both rejected awards — neither rejection incremented the OCC token or moved a service day"
            - "cancelling the EVALUATING P1 succeeds (cancel admits OPEN or EVALUATING, unlike the other three actions) and records cancellation_reason_code PROGRAM_WITHDRAWN"
            - "the second cancel returns HTTP 409 ERR_PROSPECTUS_NOT_OPEN — CANCELLED is terminal, so cancel is idempotent-refused rather than idempotent-accepted"
            - "close-submissions on the CANCELLED P1 returns HTTP 409 ERR_PROSPECTUS_NOT_OPEN as well: the same error id serves a fourth call/state pair"
            - "${app_a} is untouched by P1's whole failed competition and files successfully against the OPEN P2: status PROSPECTUS_RESPONDED, prospectus_id ${p2}, and P2.responsive_application_count 1"
            - "closing P2 writes preliminary_evaluation_score 66.67 on ${app_a} = round_half_up(0.30*0 + 0.30*100.00 + 0.20*100.0 + 0.20*83.33)"
            - "awarding the EVALUATING P2 succeeds: status AWARDED, awarded_application_id ${app_a}, and the use area's version is exactly one greater than ${ua_ver_2}"
            - "${app_a} reads back AWARDED with final_evaluation_score 66.67 (experience 0 from prior_permit_count 0, guide_pts 100.00 from 1 of 1 QUALIFIED, assurance 100.0 from the verified flag, need_match 83.33 = 100.0 - 16.67 on |250 - 300| * 100 / 300) — at or above the defaulted min_qualifying_score 60.0"
            - "close-submissions on the AWARDED P2 returns HTTP 409 ERR_PROSPECTUS_NOT_OPEN: five distinct action/state pairs share one error id, so the guard must be per-action, not per-resource"

      - name: finalize_is_conditional_on_every_sibling_report_state
        claim_type: conditional_action
        excluded_because:
          difficulty_instance: fee_finalization_gated_by_sibling_report_states
          rationale: |
            The conditional-availability corner where an action's precondition depends on the states of
            a SET of sibling rows rather than the target row is exactly what the §1.8 state-dependent
            availability instance drives: it walks POST /osup/fee-assessments/{id}/finalize from
            ERR_USE_REPORTS_PENDING through each remaining unaccepted report until the last acceptance
            unlocks the action, and it also covers the mirror case where an amendment re-locks it.

  # ===========================================================================
  # §1.6 Error Catalog  (64 ids; the guide gives no claim-type table for this
  # table, so every instance here is error_triggerable)
  # ===========================================================================
  - section: errors
    instances:

      - name: plan_completeness_and_duplicate_year_are_enforced_at_their_own_gates
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OPERATING_PLAN_INCOMPLETE]
          - errors[ERR_DUPLICATE_PLAN_YEAR]
          - calculations.operating_plan_completeness
          - endpoints.POST /osup/operating-plans/{id}/sections
        distinguishing_aspect: |
          Two errors that look like one "bad plan" check but fire on different endpoints and different
          rows: incompleteness is a 422 on submit computed from the four sections of THIS plan, while
          duplicate-year is a 409 on creation computed over the OTHER plans of the same
          (permit_id, plan_year). The duplicate rule excludes REJECTED plans only, so a plan sitting in
          DRAFT or UNDER_REVIEW blocks a refiling and a rejected one does not — and a missing key in
          any one of the four sections costs exactly one 25.0-point section, wherever it sits.
        test_recipe:
          setup:
            - "an ISSUED permit for Alpine on BRW-01"
            - "plan A for 2027 is filed with campsite_section missing fire_policy, so completeness_score is 75.0"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
