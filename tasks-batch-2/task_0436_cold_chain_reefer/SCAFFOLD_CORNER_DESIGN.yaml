            - "data.error_id == ERR_UNAUTHENTICATED"

      - name: non_owner_shipper_cannot_cancel_returns_forbidden
        claim_type: peer_roles
        grounds: ["roles", "state_machines.Shipment.ACCEPTED_to_CANCELLED", "errors[ERR_FORBIDDEN_ROLE]", "entities.Shipment.fields.shipper_user_id"]
        distinguishing_aspect: "Cancel requires X-User-ID == Shipment.shipper_user_id; a different Shipper user calling cancel returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["An ACCEPTED shipment owned by shipper-c25a."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Own Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-c25"
              captures: { cid: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lid: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${cid}", asset_tag: "RU-C25", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-c25"
              captures: { uid: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${cid}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-c25a"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/compartments"
              payload: { temp_lane_id: "${lid}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-c25a"
            - call: "GET /shipments/${sid}"
              as: Carrier
              as_user_id: "carrier-c25"
              captures: { sv: $.data.version }
            - call: "POST /shipments/${sid}/accept"
              payload: { reefer_unit_id: "${uid}", expected_shipment_version: "${sv}" }
              as: Carrier
              as_user_id: "carrier-c25"
          trigger:
            - call: "POST /shipments/${sid}/cancel"
              as: Shipper
              as_user_id: "shipper-c25b"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE (X-User-ID is not the owning shipper_user_id)"

  # =========================================================================
  # Section: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_shipment_version_on_accept
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[accept-stale-shipment]", "validations[priority=19]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Accept carrying an expected_shipment_version one behind the current version (a compartment was added after the carrier last read it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A TENDERED shipment with 1 compartment; the carrier reads it (captures version sv); the shipper then adds a 2nd compartment (bumping the version past sv); the carrier accepts still carrying the stale captured ${sv}."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Occ Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-c26"
