    claim_type: precondition_violation
    grounds:
    - state_machines.Referral.RECEIVED_to_ACCEPTED
    - errors[ERR_NO_ASSESSMENT_ON_FILE]
    distinguishing_aspect: Accepting a referral for a patient with zero wound assessments returns ERR_NO_ASSESSMENT_ON_FILE (409); patient stays INTAKE.
    test_recipe:
      setup:
      - Patient with a RECEIVED referral but no assessments.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: C
        as: IntakeCoordinator
