  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: enumerator_window_overlap
        grounds:
          - validations[priority=12]
          - entities.Attempt.fields.window_start
          - entities.Attempt.fields.window_end
        distinguishing_aspect: |
          Two LOGGED attempts by the same enumerator on different cases with overlapping half-open [start,end)
          windows (10:00-11:00 and 10:30-11:30) collide -> ERR_ENUMERATOR_SCHEDULE_CONFLICT; interval semantics
          are half-open with adjacency allowed and no buffer; resource is the Enumerator.
        test_recipe:
          setup:
            - "Two cases in the same IN_FIELD area both assigned to ACTIVE E1; case A already has a LOGGED attempt 10:00-11:00."
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave O", region_code: "R1", default_language: "EN", supported_languages: ["EN"], fraud_score_threshold: 60, max_attempts: 6 }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { caseA_id: $.data.id, caseA_v: $.data.version }
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "B St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { caseB_id: $.data.id, caseB_v: $.data.version }
            - call: "POST /cases/${caseA_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${caseA_v}" }
              as: FieldSupervisor
            - call: "POST /cases/${caseB_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${caseB_v}" }
              as: FieldSupervisor
            - call: "POST /cases/${caseA_id}/attempts"
              payload: { mode: "IN_PERSON", window_start: "2026-03-01T10:00:00Z", window_end: "2026-03-01T11:00:00Z", disposition: "NO_ONE_HOME", mileage_miles: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
          trigger:
            - call: "POST /cases/${caseB_id}/attempts"
              payload: { mode: "IN_PERSON", window_start: "2026-03-01T10:30:00Z", window_end: "2026-03-01T11:30:00Z", disposition: "NO_ONE_HOME", mileage_miles: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ENUMERATOR_SCHEDULE_CONFLICT"

      - name: case_contact_cooldown
        grounds:
          - validations[priority=13]
          - entities.Attempt.fields.window_start
          - entities.Attempt.fields.window_end
        distinguishing_aspect: |
          Two LOGGED attempts on the same case whose windows are only 90 minutes apart (10:00-10:30 then
          12:00-12:30) violate the 240-minute REST_BUFFER -> ERR_CASE_CONTACT_COOLDOWN; interval semantics are
          closed intervals expanded by a buffer; resource is the Case (distinct from the enumerator overlap).
        test_recipe:
          setup:
            - "One case in an IN_FIELD area assigned to ACTIVE E1 with a LOGGED attempt 10:00-10:30."
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave P", region_code: "R1", default_language: "EN", supported_languages: ["EN"], fraud_score_threshold: 60, max_attempts: 6 }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
            - call: "POST /cases/${case_id}/attempts"
              payload: { mode: "PHONE", window_start: "2026-03-01T10:00:00Z", window_end: "2026-03-01T10:30:00Z", disposition: "NO_ONE_HOME" }
              as: Enumerator
              as_user_id: "${en1_id}"
          trigger:
            - call: "POST /cases/${case_id}/attempts"
              payload: { mode: "PHONE", window_start: "2026-03-01T12:00:00Z", window_end: "2026-03-01T12:30:00Z", disposition: "NO_ONE_HOME" }
              as: Enumerator
              as_user_id: "${en1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CASE_CONTACT_COOLDOWN"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: case_count_conservation_on_reopen
        grounds:
          - state_machines.Case.IN_PROGRESS_to_COMPLETE
          - state_machines.Case.COMPLETE_to_IN_PROGRESS
          - entities.AssignmentArea.fields.total_case_count
        distinguishing_aspect: |
          Response capture (COMPLETE) followed by its compensating fraud-reopen (IN_PROGRESS) leaves
          pending+in_progress+complete+refused+vacant+max_attempts == total_case_count == 1 unchanged;
          the conserved quantity is the total case count.
        test_recipe:
          setup:
            - "A single-case area COMPLETE (E1 captured), reinterview (reviewer E2) IN_REVIEW; total_case_count=1."
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave Q", region_code: "R1", default_language: "EN", supported_languages: ["EN"], fraud_score_threshold: 60, max_attempts: 6 }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E2", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en2_id: $.data.id }
            - call: "POST /enumerators/${en2_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en2_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
            - call: "POST /cases/${case_id}/attempts"
              payload: { mode: "IN_PERSON", window_start: "2026-03-01T10:00:00Z", window_end: "2026-03-01T10:30:00Z", disposition: "CONTACT_MADE", mileage_miles: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
            - call: "POST /cases/${case_id}/responses"
              payload: { mode: "IN_PERSON", language_used: "EN", duration_minutes: 20, flagged_answer_count: 0, gps_variance_meters: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
              captures: { resp_id: $.data.id }
            - call: "POST /responses/${resp_id}/reinterviews"
              payload: { reviewer_enumerator_id: "${en2_id}", reason: "RANDOM_SAMPLE" }
              as: QCReviewer
              captures: { ri_id: $.data.id }
            - call: "POST /reinterviews/${ri_id}/start"
              payload: {}
              as: QCReviewer
          trigger:
            - call: "POST /reinterviews/${ri_id}/finalize"
              payload: { outcome: "FRAUD" }
              as: QCReviewer
          assert:
            - "AssignmentArea.${area_id}.total_case_count == 1"
            - "AssignmentArea.${area_id}.complete_case_count == 0"
            - "AssignmentArea.${area_id}.in_progress_case_count == 1"
            - "AssignmentArea.${area_id}.pending_case_count + AssignmentArea.${area_id}.in_progress_case_count + AssignmentArea.${area_id}.complete_case_count + AssignmentArea.${area_id}.refused_case_count + AssignmentArea.${area_id}.vacant_case_count + AssignmentArea.${area_id}.max_attempts_case_count == 1"

      - name: budget_conservation_on_attempt_cancel
        grounds:
          - calculations.attempt_pay_commit
          - state_machines.Attempt.LOGGED_to_CANCELLED
          - entities.AssignmentArea.fields.budget_committed_cents
        distinguishing_aspect: |
          Logging an in-person attempt (commits pay_committed_cents=3670) then cancelling it leaves
          budget_committed_cents=0 and budget_committed_cents+budget_remaining_cents==budget_cents (500000);
          the conserved quantity is area budget cents, distinct from case counts.
        test_recipe:
          setup:
            - "An IN_FIELD area with budget 500,000; ACTIVE E1 (hourly_rate_cents=3000); one case assigned to E1; one LOGGED IN_PERSON attempt 10:00-11:00 mileage 10 committing 3670 cents."
