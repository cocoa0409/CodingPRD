  - rule_id: boundary_precision_check
    instances:

      - name: retention_window_at_policy_floor_exactly
        grounds:
          - calculations.effective_retention_days
          - errors.ERR_RETENTION_BELOW_POLICY_FLOOR
          - state_machines.RetentionChangeRequest.SUBMITTED_to_COOLING_OFF
          - entities.GroupPolicy.fields.min_retention_days
        distinguishing_aspect: "The floor comparison is inclusive: requested_retention_days 60 against a min_retention_days of 60 passes, while 59 fails with ERR_RETENTION_BELOW_POLICY_FLOOR — the boundary sits on exactly the floor value, not one above it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account whose single group has an ACTIVE RETENTION policy with min_retention_days 60."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
