              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "CONTINUOUS_MONITOR", purpose: "INITIAL", placement_window_hours: 48, warmup_hours_dropped: 4 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { test_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /radon-tests/${test_id}/retrieve"
              payload: { hourly_readings: [5.0, 5.0, 5.0, 5.0] }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INSUFFICIENT_READINGS (HTTP 409)"

