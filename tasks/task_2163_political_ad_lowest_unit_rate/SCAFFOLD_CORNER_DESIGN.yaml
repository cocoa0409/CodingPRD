scaffold_corner_design:
  - section: entities
    instances:
      - name: station_creation_applies_declared_defaults_and_zeroes_every_counter
        claim_type: Defaults
        grounds:
          - entities.Station.fields.political_file_posting_deadline_hours
          - entities.Station.fields.daily_political_seconds_cap
          - entities.Station.fields.eo_parity_basis
          - entities.Station.fields.compliance_posture
        distinguishing_aspect: "A station created with only call_sign, licensee_name and market_code comes back with political_file_posting_deadline_hours 24, daily_political_seconds_cap 300, eo_parity_basis SPOT_COUNT, all four compliance counters 0, compliance_posture OPEN and version 1."
        test_recipe:
          setup: ["Empty database with the logical clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WDEF-TV", licensee_name: "Default Licensee LLC", market_code: "DMA-100" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Station.${st}.political_file_posting_deadline_hours == 24"
            - "Station.${st}.daily_political_seconds_cap == 300"
            - "Station.${st}.eo_parity_basis == SPOT_COUNT"
            - "Station.${st}.pending_file_entry_count == 0"
            - "Station.${st}.overdue_file_entry_count == 0"
            - "Station.${st}.late_posting_count == 0"
            - "Station.${st}.open_complaint_count == 0"
            - "Station.${st}.compliance_posture == OPEN"
            - "Station.${st}.version == 1"
            - "Station.${st}.last_sweep_at == null"

      - name: general_election_window_is_sixty_days_and_status_tracks_the_clock
        claim_type: Computed Fields
        grounds:
          - entities.Election.fields.luc_window_days
          - entities.Election.fields.window_start_date
          - entities.Election.fields.status
          - calculations.lowest_unit_charge
        distinguishing_aspect: "A GENERAL election on 2026-11-03 derives luc_window_days 60 and window_start_date 2026-09-04, and its status reads SCHEDULED at 2026-08-05, WINDOW_OPEN at 2026-09-04 and CLOSED at 2026-11-04."
        test_recipe:
          setup: ["One station and one GENERAL election on 2026-11-03."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WGEN-TV", licensee_name: "General Election Media", market_code: "DMA-101" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/elections"
              payload: { station_id: "${st}", office_sought: "US House 4", election_type: "GENERAL", election_date: "2026-11-03" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { el: $.data.id, wsd: $.data.window_start_date, wd: $.data.luc_window_days, s0: $.data.status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "GET /political-ads/elections/${el}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { s1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-04T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "GET /political-ads/elections/${el}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { s2: $.data.status }
          assert:
            - "${wd} == 60"
            - "${wsd} == 2026-09-04"
            - "Election.${el}.window_end_date == 2026-11-03"
            - "${s0} == SCHEDULED"
            - "${s1} == WINDOW_OPEN"
            - "${s2} == CLOSED"

      - name: order_get_with_unknown_uuid_returns_order_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_ORDER_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: "GET /political-ads/orders/{unknown uuid} returns ERR_ORDER_NOT_FOUND with HTTP 404 and the standard error envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "GET /political-ads/orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORDER_NOT_FOUND"
            - "HTTP status == 404"
            - "response_type == error"

      - name: rate_class_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /political-ads/rate-classes]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three rate classes on one station, GET /political-ads/rate-classes?station_id=&limit=2&offset=0 returns exactly 2 rows in created_at ASC order with total_count 3 and has_more true, and offset 2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One station carrying three rate classes created in a known order."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WPAG-TV", licensee_name: "Paginated Media LLC", market_code: "DMA-102" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-1", daypart: "MORNING", preemptible: true, preemption_priority: 3, posted_rate_cents: 10000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc1: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-2", daypart: "DAYTIME", preemptible: true, preemption_priority: 4, posted_rate_cents: 20000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc2: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-3", daypart: "PRIME", preemptible: false, preemption_priority: 0, posted_rate_cents: 30000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc3: $.data.id }
          trigger:
            - call: "GET /political-ads/rate-classes"
              payload: { station_id: "${st}", limit: 2, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { first_id: "$.data[0].id", second_id: "$.data[1].id" }
            - call: "GET /political-ads/rate-classes"
              payload: { station_id: "${st}", limit: 2, offset: 2 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { third_id: "$.data[0].id" }
          assert:
            - "first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "${first_id} == ${rc1}"
            - "${second_id} == ${rc2}"
            - "second page returns exactly 1 row with total_count == 3 and has_more == false"
            - "${third_id} == ${rc3}"

      - name: spot_creation_with_duration_45_rejected_as_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ScheduledSpot.fields.duration_seconds
          - validations[priority=18]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "duration_seconds is constrained to exactly {30, 60}; a spot requested at 45 seconds is refused with ERR_INVALID_REQUEST and HTTP 422 and the order's spot_count stays 0."
        test_recipe:
          setup: ["One station, one EARLY_NEWS rate class, one issue advertiser and one empty DRAFT order."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WTYP-TV", licensee_name: "Type Guard Media", market_code: "DMA-103" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-EN", daypart: "EARLY_NEWS", preemptible: true, preemption_priority: 2, posted_rate_cents: 100000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Empire Growth Fund", requested_class: "ISSUE" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv: $.data.id }
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv}", rate_class_id: "${rc}", payment_terms: "PREPAY", sponsorship_disclosure_text: "PAID FOR BY Empire Growth Fund", disclosure_duration_seconds: 5, agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 0, duration_seconds: 45, program_code: "EN-1" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 422"
            - "CommercialOrder.${ord}.spot_count == 0"
            - "GET /political-ads/spots?order_id=${ord} returns total_count == 0"

      - name: rebate_ledger_entry_is_append_only_and_reachable_only_by_reverse_lookup
        claim_type: Immutability
        grounds:
          - entities.RebateLedgerEntry.fields.amount_cents
          - entities.RebateLedgerEntry.fields.reason
          - endpoints[GET /political-ads/rebates]
        distinguishing_aspect: "RebateLedgerEntry carries common_fields false, so the entry written by a preemption exposes id, created_at, order_id, amount_cents, reason and occurred_at, has no update endpoint, and its amount_cents is unchanged after a second preemption writes a separate entry."
        test_recipe:
          setup:
            - "One station, one MORNING rate class at posted_rate_cents 12345, one issue advertiser."
            - "A PREPAY order with three 30-second spots on 2026-08-20 accepted and fully paid at 22221 cents; one spot has been preempted, leaving one rebate entry of 7407 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WLED-TV", licensee_name: "Ledger Broadcasting LLC", market_code: "DMA-104", political_file_posting_deadline_hours: 24, daily_political_seconds_cap: 300 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-AM", daypart: "MORNING", preemptible: true, preemption_priority: 3, posted_rate_cents: 12345 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Empire Growth Fund", requested_class: "ISSUE" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv: $.data.id }
            - call: "POST /political-ads/advertisers/${adv}/review"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers/${adv}/decision"
              payload: { decision: "CLASSIFY_ISSUE", reason: "Non-candidate issue advocacy" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv}", rate_class_id: "${rc}", payment_terms: "PREPAY", sponsorship_disclosure_text: "PAID FOR BY Empire Growth Fund", disclosure_duration_seconds: 5, agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 0, duration_seconds: 30, program_code: "AM-1" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { sp1: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 3600, duration_seconds: 30, program_code: "AM-2" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { sp2: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 7200, duration_seconds: 30, program_code: "AM-3" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/decision"
              payload: { decision: "ACCEPT" }
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
            - call: "GET /political-ads/orders/${ord}"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord_v: $.data.version }
            - call: "POST /political-ads/orders/${ord}/payments"
              payload: { direction: "CHARGE", amount_cents: 22221, expected_order_version: "${ord_v}" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/spots/${sp1}/disposition"
              payload: { disposition: "PREEMPTED", preemption_reason: "Breaking news override" }
              as: TrafficScheduler
              as_user_id: "traffic-01"
            - call: "GET /political-ads/rebates"
              payload: { order_id: "${ord}" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { reb1: "$.data[0].id" }
          trigger:
            - call: "POST /political-ads/spots/${sp2}/disposition"
              payload: { disposition: "PREEMPTED", preemption_reason: "Weather cut-in" }
              as: TrafficScheduler
              as_user_id: "traffic-01"
            - call: "GET /political-ads/rebates/${reb1}"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { reb1_amount: $.data.amount_cents }
          assert:
            - "${reb1_amount} == 7407"
            - "RebateLedgerEntry.${reb1}.reason == SPOT_PREEMPTED"
            - "GET /political-ads/rebates?order_id=${ord} returns total_count == 2 in created_at ASC order with amount_cents 7407 then 7407"
            - "CommercialOrder.${ord}.rebate_total_cents == 14814"
            - "CommercialOrder.${ord}.gross_charge_cents == 7407"

      - name: audit_sweep_on_unknown_station_returns_station_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_STATION_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: "POST /political-ads/stations/{unknown uuid}/audit-sweep returns ERR_STATION_NOT_FOUND with HTTP 404 and performs no sweep."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /political-ads/stations/00000000-0000-0000-0000-000000000000/audit-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STATION_NOT_FOUND"
            - "HTTP status == 404"

  - section: state_machines
    instances:
      - name: new_order_starts_in_draft_and_unbilled_on_both_dimensions
        claim_type: Initial State
        grounds:
          - state_machines.CommercialOrder.initial_state
          - entities.CommercialOrder.fields.status
          - entities.CommercialOrder.fields.payment_status
        distinguishing_aspect: "A freshly created order reports status DRAFT, payment_status UNBILLED, spot_count 0, gross_charge_cents 0, net_due_cents 0, paid_cents 0, refunded_cents 0, accepted_at null and payment_due_at null."
        test_recipe:
          setup: ["One station, one EARLY_NEWS rate class and one issue advertiser."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WINI-TV", licensee_name: "Initial State Media", market_code: "DMA-105" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-EN", daypart: "EARLY_NEWS", preemptible: true, preemption_priority: 2, posted_rate_cents: 100000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Empire Growth Fund", requested_class: "ISSUE" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv: $.data.id }
          trigger:
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv}", rate_class_id: "${rc}", payment_terms: "PREPAY", sponsorship_disclosure_text: "PAID FOR BY Empire Growth Fund", disclosure_duration_seconds: 5, agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord: $.data.id }
          assert:
            - "HTTP status == 201"
            - "CommercialOrder.${ord}.status == DRAFT"
            - "CommercialOrder.${ord}.payment_status == UNBILLED"
            - "CommercialOrder.${ord}.spot_count == 0"
            - "CommercialOrder.${ord}.gross_charge_cents == 0"
            - "CommercialOrder.${ord}.net_due_cents == 0"
            - "CommercialOrder.${ord}.paid_cents == 0"
            - "CommercialOrder.${ord}.refunded_cents == 0"
            - "CommercialOrder.${ord}.accepted_at == null"
            - "CommercialOrder.${ord}.payment_due_at == null"
            - "CommercialOrder.${ord}.disclosure_status == CONFORMING"
            - "Advertiser.${adv}.status == SUBMITTED"
            - "Advertiser.${adv}.review_round == 0"

      - name: second_submit_on_the_same_order_rejected_as_not_draft
        claim_type: Idempotency
        grounds:
          - state_machines.CommercialOrder.DRAFT_to_SUBMITTED
          - validations[priority=25]
          - errors[ERR_ORDER_NOT_DRAFT]
        distinguishing_aspect: "Submitting an order that already reached SUBMITTED fails with ERR_ORDER_NOT_DRAFT and HTTP 409, and the order's version is unchanged by the refused call."
        test_recipe:
          setup: ["One station, one EARLY_NEWS rate class, one issue advertiser and one order holding a single 30-second spot that has already been submitted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WIDM-TV", licensee_name: "Idempotent Media LLC", market_code: "DMA-106" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-EN", daypart: "EARLY_NEWS", preemptible: true, preemption_priority: 2, posted_rate_cents: 100000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Empire Growth Fund", requested_class: "ISSUE" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv: $.data.id }
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv}", rate_class_id: "${rc}", payment_terms: "PREPAY", sponsorship_disclosure_text: "PAID FOR BY Empire Growth Fund", disclosure_duration_seconds: 5, agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 0, duration_seconds: 30, program_code: "EN-1" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { v_after_submit: $.data.version }
          trigger:
            - call: "POST /political-ads/orders/${ord}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORDER_NOT_DRAFT"
            - "HTTP status == 409"
            - "CommercialOrder.${ord}.status == SUBMITTED"
            - "CommercialOrder.${ord}.version == ${v_after_submit}"

      - name: cancel_on_an_already_cancelled_order_rejected_as_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CommercialOrder.terminal_states
          - validations[priority=28]
          - errors[ERR_ORDER_TERMINAL]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel fails with ERR_ORDER_TERMINAL and HTTP 409, and no second RebateLedgerEntry is written."
        test_recipe:
          setup: ["One station, one EARLY_NEWS rate class, one issue advertiser and one DRAFT order that has already been cancelled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WTRM-TV", licensee_name: "Terminal Media Group", market_code: "DMA-107" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-EN", daypart: "EARLY_NEWS", preemptible: true, preemption_priority: 2, posted_rate_cents: 100000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Empire Growth Fund", requested_class: "ISSUE" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv: $.data.id }
            - call: "POST /political-ads/orders"
