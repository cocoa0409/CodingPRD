            - "${codesA} == [] and ${seqB} == 1 — the clean draft carries no codes while the deficient one was noticed once."
            - "${e_no_def} == \"ERR_NO_DEFICIENCIES_TO_REPORT\" with HTTP 409 — the notice path recomputes the set and refuses to manufacture a deficiency."
            - "${e_deny_clean} == \"ERR_DENIAL_NOT_PERMITTED\" with HTTP 409 — ORDER_NOT_QUALIFIABLE requires a non-empty recomputed set, so a compliant order can only be qualified."
            - "${e_deny_reason} == \"ERR_DENIAL_NOT_PERMITTED\" with HTTP 409 — the draft's revision_number is 1, below max_revisions 3, so the named reason is untrue even though the DEFICIENT -> DENIED edge exists."
            - "${e_deny_wrong_edge} == \"ERR_DENIAL_NOT_PERMITTED\" with HTTP 409 — ORDER_NOT_QUALIFIABLE is only admissible from UNDER_REVIEW, and this draft is DEFICIENT."
            - "GET /draft-orders/${draftA} still reports status \"UNDER_REVIEW\" with denial_reason null, and GET /draft-orders/${draftB} still reports status \"DEFICIENT\" with denial_reason null; GET /qdro-cases/${caseA} is still \"UNDER_REVIEW\" and GET /qdro-cases/${caseB} is still \"DEFICIENT\"."
            - "GET /draft-orders/${draftA}/deficiency-notices returns 0 rows — the refused notice was not persisted."

      - name: exhausted_payee_account_is_terminal_in_three_machines_at_once
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[AlternatePayeeAccount].terminal_states
          - state_machines[DraftOrder].terminal_states
          - state_machines[SegregationHold].terminal_states
          - errors.ERR_AP_ACCOUNT_CLOSED
          - errors.ERR_DISTRIBUTION_ALREADY_VOIDED
          - validations[priority=40]
          - validations[priority=70]
        distinguishing_aspect: |
          A SEPARATE_INTEREST payee account auto-closes the instant a distribution drives its balance to
          exactly 0, and CLOSED is terminal: neither a further distribution nor a VOID of the very
          distribution that closed it is accepted. The void refusal is the sharp edge — the distribution
          itself is still ISSUED and still inside its tax year, so the only reason to refuse is the
          account's terminal state, and the state check at priority 40 outranks the balance check at
          priority 70 (a 1-cent request on a closed account is a 409, never ERR_INSUFFICIENT_DISTRIBUTABLE_BALANCE).
          The same fixture is simultaneously terminal on DraftOrder (QUALIFIED) and SegregationHold (CONVERTED).
        test_recipe:
          setup:
            - "A PUBLISHED plan (PERIOD_END, max_assignable_pct_bps 5000), participant with benefit_commenced false, one plan account, one assignable PRE_TAX_DEFERRAL source of 1000000 with basis 0, a snapshot on 2026-06-30 of 1000000."
            - "A case valued 2026-06-30 receives a 4000 bps SEPARATE_INTEREST draft at clock 2026-09-01 (hold 400000) and is qualified at clock 2026-09-15 with no post-segregation snapshot, so earnings are 0 and the payee account is established at exactly 400000."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Lockdown Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
