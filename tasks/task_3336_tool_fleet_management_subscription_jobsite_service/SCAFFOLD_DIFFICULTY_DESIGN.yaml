  - rule_id: cross_entity_state_dependency
    instances:
      - name: deploy_blocked_when_agreement_suspended
        grounds:
          - state_machines.ToolAsset.REGISTERED_to_DEPLOYED
          - state_machines.ContractorAccount.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair ToolAsset -> FleetAgreement (via owning ContractorAccount): once
          the account suspension cascade flips the agreement to SUSPENDED,
          deploy is rejected with ERR_INVALID_STATE even though the asset itself
          is REGISTERED and the jobsite has capacity.
        test_recipe:
          setup:
            - "Account (limit 25000) with ACTIVE agreement holding 6 DRILL units + 1 extra REGISTERED unit; activation bill 29000 > 25000; account suspended -> agreement SUSPENDED"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/accounts"
              payload: { company_name: "November GC", tax_id: "EIN-DEP1", credit_limit_cents: 25000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-DRILL-DEP1", tool_category: "DRILL", base_monthly_rate_cents: 10000, tier2_threshold: 5, tier2_monthly_rate_cents: 9000, tier3_threshold: 10, tier3_monthly_rate_cents: 8000, min_monthly_fee_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/tool-models"
              payload: { model_code: "TM-DEP1", category: "DRILL", replacement_value_cents: 80000, weight_class: "LIGHT" }
              as: FleetAdmin
              captures: { tm: $.data.id }
            - call: "POST /fleet/accounts/${acct}/agreements"
              payload: { term_months: 12, start_date: "2026-09-16T00:00:00Z", end_of_term_option: "RETURN" }
              as: FleetAdmin
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/adjust-fleet"
              payload: { expected_agreement_version: "${ag_v}", add_tool_model_ids: ["${tm}", "${tm}", "${tm}", "${tm}", "${tm}", "${tm}", "${tm}"], return_asset_ids: [] }
              as: ContractorManager
              as_user_id: "${acct}"
            - call: "GET /fleet/assets"
              payload: {}
              as: FleetAdmin
              captures: { a1: "$.data[0].id" }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/activate"
              payload: {}
              as: FleetAdmin
            - call: "POST /fleet/accounts/${acct}/jobsites"
              payload: { name: "Site DEP1", address: "10 Way", capacity_assets: 10, geofence_radius_m: 500 }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { js: $.data.id }
            - call: "POST /fleet/accounts/${acct}/suspend"
              payload: {}
              as: FleetAdmin
              captures: { acct_st: $.data.status }
          trigger:
            - call: "POST /fleet/assets/${a1}/deploy"
              payload: { jobsite_id: "${js}" }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "acct_st == SUSPENDED (29000 > 25000 precondition held)"
            - "err == ERR_INVALID_STATE (agreement SUSPENDED blocks deploy despite valid asset and free capacity)"

      - name: consumable_submit_requires_documented_anchor_case
        grounds:
          - state_machines.ConsumableOrder.DRAFT_to_SUBMITTED
          - state_machines.SupportCase.OPEN_to_DOCUMENTED
          - "validations[priority=10]"
        distinguishing_aspect: |
          Pair ConsumableOrder -> SupportCase (distinct from the sibling's
          ToolAsset -> FleetAgreement): submitting an order containing an
          approval-gated product fails with ERR_APPLICATION_APPROVAL_REQUIRED
          while the account's only ANCHOR_DESIGN case is OPEN, and succeeds
          after the same case reaches DOCUMENTED.
        test_recipe:
          setup:
            - "ACTIVE account; product ANC-1 requires_application_approval; jobsite; ANCHOR_DESIGN support case in OPEN"
          setup_api_calls:
            - call: "POST /fleet/accounts"
              payload: { company_name: "Oscar Supply", tax_id: "EIN-GATE1", credit_limit_cents: 100000000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/consumable-products"
              payload: { sku: "ANC-1", name: "Wedge anchor", unit_price_cents: 1200, pack_size: 50, requires_application_approval: true }
              as: FleetAdmin
              captures: { prod: $.data.id }
            - call: "POST /fleet/accounts/${acct}/jobsites"
              payload: { name: "Site GATE1", address: "11 Way", capacity_assets: 5, geofence_radius_m: 300 }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { js: $.data.id }
            - call: "POST /fleet/accounts/${acct}/support-cases"
              payload: { kind: "ANCHOR_DESIGN", jobsite_id: "${js}", scheduled_for: "2026-09-10T10:00:00Z" }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { sc: $.data.id }
            - call: "POST /fleet/accounts/${acct}/consumable-orders"
              payload: { lines: [{ product_id: "${prod}", quantity_units: 50 }] }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { order: $.data.id }
          trigger:
            - call: "POST /fleet/accounts/${acct}/consumable-orders/${order}/submit"
              payload: {}
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
            - call: "POST /fleet/accounts/${acct}/support-cases/${sc}/review"
              payload: { decision: "APPROVE", documentation_url: "https://docs.example/anchor-1.pdf" }
              as: FieldEngineer
              as_user_id: "eng-gate1"
              captures: { sc_st: $.data.status }
            - call: "POST /fleet/accounts/${acct}/consumable-orders/${order}/submit"
              payload: {}
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { st2: $.data.status, tot2: $.data.total_cents }
          assert:
            - "err == ERR_APPLICATION_APPROVAL_REQUIRED (case OPEN, gate closed)"
            - "sc_st == DOCUMENTED"
            - "st2 == SUBMITTED and tot2 == 60000 (1 pack * 50 * 1200)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: support_case_half_open_window_overlap
        grounds:
          - "validations[priority=9]"
          - entities.SupportCase.fields.scheduled_for
          - endpoints.POST_/fleet/accounts/{account_id}/support-cases
        distinguishing_aspect: |
          Interval semantics: half-open [scheduled_for, +2h) on resource
          Jobsite. A case starting exactly when another ends (10:00-12:00 vs
          12:00) is ALLOWED (adjacent, gap 0), while 11:00 overlaps and is
          rejected with ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Account with one jobsite; case A scheduled 2026-09-10T10:00 (window [10:00, 12:00)) in OPEN"
          setup_api_calls:
            - call: "POST /fleet/accounts"
              payload: { company_name: "Papa Builders", tax_id: "EIN-OVL1", credit_limit_cents: 100000000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/accounts/${acct}/jobsites"
              payload: { name: "Site OVL1", address: "12 Way", capacity_assets: 5, geofence_radius_m: 300 }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { js: $.data.id }
            - call: "POST /fleet/accounts/${acct}/support-cases"
              payload: { kind: "ANCHOR_DESIGN", jobsite_id: "${js}", scheduled_for: "2026-09-10T10:00:00Z" }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { sc_a: $.data.id }
          trigger:
            - call: "POST /fleet/accounts/${acct}/support-cases"
              payload: { kind: "FIRESTOP", jobsite_id: "${js}", scheduled_for: "2026-09-10T12:00:00Z" }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { sc_b: $.data.id }
            - call: "POST /fleet/accounts/${acct}/support-cases"
              payload: { kind: "FIRESTOP", jobsite_id: "${js}", scheduled_for: "2026-09-10T11:00:00Z" }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "sc_b created (half-open adjacency: [10:00,12:00) and [12:00,14:00) do not overlap)"
            - "err == ERR_WINDOW_OVERLAP ([11:00,13:00) intersects [10:00,12:00))"

      - name: rate_card_closed_interval_overlap
        grounds:
          - "validations[priority=9]"
          - entities.RateCard.fields.effective_from
          - entities.RateCard.fields.effective_to
          - endpoints.POST_/fleet/rate-cards
        distinguishing_aspect: |
          Interval semantics: CLOSED [effective_from, effective_to] on resource
          tool_category — the dual of the sibling's half-open semantics. A card
          whose effective_from equals an existing card's effective_to OVERLAPS
          (shared boundary day) and is rejected, while a card starting the next
          day is accepted.
        test_recipe:
          setup:
            - "Existing ACTIVE DRILL card covering [2026-01-01, 2026-12-31]"
          setup_api_calls:
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-OVL2-A", tool_category: "DRILL", base_monthly_rate_cents: 5000, tier2_threshold: 100, tier2_monthly_rate_cents: 5000, tier3_threshold: 200, tier3_monthly_rate_cents: 5000, min_monthly_fee_cents: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-OVL2-B", tool_category: "DRILL", base_monthly_rate_cents: 6000, tier2_threshold: 100, tier2_monthly_rate_cents: 6000, tier3_threshold: 200, tier3_monthly_rate_cents: 6000, min_monthly_fee_cents: 0, effective_from: "2026-12-31T00:00:00Z", effective_to: "2027-06-30T00:00:00Z" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-OVL2-C", tool_category: "DRILL", base_monthly_rate_cents: 6000, tier2_threshold: 100, tier2_monthly_rate_cents: 6000, tier3_threshold: 200, tier3_monthly_rate_cents: 6000, min_monthly_fee_cents: 0, effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: FleetAdmin
              captures: { ok_id: $.data.id }
          assert:
            - "err == ERR_WINDOW_OVERLAP (closed interval: 2026-12-31 belongs to both cards)"
            - "ok_id is a valid id (disjoint successor interval accepted)"

  - rule_id: compensating_invariant
    instances:
      - name: transfer_cancel_transfer_conserves_jobsite_counts
        grounds:
          - state_machines.ToolAsset.DEPLOYED_to_IN_TRANSIT
          - state_machines.ToolAsset.IN_TRANSIT_to_DEPLOYED
          - entities.Jobsite.fields.deployed_asset_count
        distinguishing_aspect: |
          Conserved quantity: per-jobsite deployed_asset_count (and their sum).
          Forward action transfer (origin -1) paired with its compensating
          action cancel-transfer (origin +1) leaves every jobsite's count
          identical to the pre-transfer values: sum over jobsites == 1
          throughout, origin A back to 1 after the pair.
        test_recipe:
          setup:
            - "ACTIVE agreement with one asset DEPLOYED at jobsite A (count 1); empty jobsite B (capacity 5, count 0)"
          setup_api_calls:
            - call: "POST /fleet/accounts"
