scenario: |
  845. Oversize/Overweight Load Permit (state DOT): route & dimension/weight,
  bridge-analysis & clearance, escort/pilot-car requirement, fee & bond,
  time-of-travel restriction, superload review, permit issuance & validity,
  violation

domain_name: oversize-overweight-permit
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: graph_constraint
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: hybrid
  # Permit is the aggregate root (tree: Permit -> RouteSegment / BridgeAnalysis /
  # EscortAssignment / Bond). Structure, PilotCar, Carrier, TravelRestriction are
  # cross-cutting flat entities referenced by FK across the tree.
  state_machine_shape: branching
  # Permit forks at begin-review (standard vs superload) with divergent side
  # effects and cycles (RETURNED_FOR_CORRECTION->SUBMITTED, ISSUED<->SUSPENDED);
  # BridgeAnalysis forks REQUESTED->{CLEARED,CONDITIONAL,REJECTED}.
  relationship_patterns:
    - one_to_many          # Permit -> RouteSegment / BridgeAnalysis / EscortAssignment
    - cross_aggregate      # RouteSegment/BridgeAnalysis -> Structure; EscortAssignment -> PilotCar
  role_model: peer_roles
  # Carrier owns applications; PermitOfficer owns standard review/issuance;
  # BridgeEngineer owns bridge analysis + superload review; EnforcementOfficer
  # owns violations; DOTAdmin owns reference-data + clock.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the trucking company.
      - name: usdot_number
        type: string
        source: input
        description: US DOT registration number; unique across carriers.
        constraints: unique
      - name: total_escrow_deposited_cents
        type: integer
        source: system
        description: Lifetime sum of escrow deposits; invariant baseline. Never decreases.
        default: 0
      - name: escrow_balance_cents
        type: integer
        source: system
        description: Currently available (unencumbered) escrow. Debited when a bond activates, credited when a bond releases.
        default: 0
      - name: active_bond_amount_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this carrier's Bonds whose status == ACTIVE. Invariant partner of escrow_balance_cents.
        default: 0
      - name: unpaid_fee_balance_cents
        type: integer
        source: system
        description: Accumulated unpaid violation penalties (incremented when a Violation is UPHELD).
        default: 0
      - name: compliance_standing
        type: enum
        source: computed
        description: GOOD_STANDING when upheld_violation_count < 3; PROBATION when 3..4; SUSPENDED when >= 5 UPHELD violations. Recomputed on every Violation uphold/dismiss.
        default: GOOD_STANDING
        constraints: one of [GOOD_STANDING, PROBATION, SUSPENDED]

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the applicant carrier.
      - name: permit_type
        type: enum
        source: input
        description: SINGLE_TRIP or ANNUAL. Drives the fee variant. ANNUAL forbidden for SUPERLOAD loads.
        constraints: one of [SINGLE_TRIP, ANNUAL]
      - name: length_in
        type: integer
        source: input
        description: Overall load length in inches (includes overhang).
        constraints: "> 0"
      - name: width_in
        type: integer
        source: input
        description: Overall load width in inches.
        constraints: "> 0"
      - name: height_in
        type: integer
        source: input
        description: Overall load height in inches.
        constraints: "> 0"
      - name: front_overhang_in
        type: integer
        source: input
        description: Load projection beyond front of vehicle, inches.
        default: 0
        constraints: ">= 0"
      - name: rear_overhang_in
        type: integer
        source: input
        description: Load projection beyond rear of vehicle, inches.
        default: 0
        constraints: ">= 0"
      - name: gross_weight_lbs
        type: integer
        source: input
        description: Gross combination weight in pounds.
        constraints: "> 0"
      - name: num_axles
        type: integer
        source: input
        description: Number of axles supporting the load.
        constraints: ">= 2"
      - name: valid_from
        type: datetime
        source: input
        description: Requested first instant of permit validity (UTC).
      - name: valid_until
        type: datetime
        source: input
        description: Requested last instant of permit validity (UTC). Must be strictly after valid_from and strictly after the current clock at issuance.
      - name: classification
        type: enum
        source: computed
        description: Computed at submit by classify_load. One of LEGAL, OVERSIZE, OVERWEIGHT, OVERSIZE_OVERWEIGHT, SUPERLOAD.
        constraints: one of [LEGAL, OVERSIZE, OVERWEIGHT, OVERSIZE_OVERWEIGHT, SUPERLOAD]
      - name: requires_superload_review
        type: boolean
        source: computed
        description: True iff classification == SUPERLOAD. Routes review to BridgeEngineer at begin-review.
        default: false
      - name: fee_cents
        type: integer
        source: computed
        description: Permit fee computed at submit by compute_permit_fee using the permit_type variant.
        default: 0
      - name: required_escort_count
        type: integer
        source: computed
        description: Number of pilot-car/police escorts required, computed at submit by compute_escort_requirement.
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle state. See state machine.
        default: DRAFT
        constraints: one of [DRAFT, SUBMITTED, UNDER_STANDARD_REVIEW, UNDER_SUPERLOAD_REVIEW, RETURNED_FOR_CORRECTION, APPROVED, REJECTED, ISSUED, SUSPENDED, COMPLETED, REVOKED, EXPIRED]
      - name: issued_at
        type: datetime
        source: system
        description: Clock value at the moment the permit transitioned to ISSUED. Null before issuance.

  - name: RouteSegment
    parent: Permit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the owning permit.
      - name: sequence_index
        type: integer
        source: input
        description: 1-based ordinal of this segment along the route.
        constraints: ">= 1"
      - name: highway_id
        type: string
        source: input
        description: Highway/route identifier this segment travels.
      - name: from_milepost
        type: number
        source: input
        description: Segment start milepost.
        constraints: ">= 0"
      - name: to_milepost
        type: number
        source: input
        description: Segment end milepost. Must be strictly greater than from_milepost.
      - name: structure_id
        type: string
        source: input
        description: FK -> Structure.id; the bridge crossed on this segment, or null if none.
        default: null
      - name: planned_cross_start_utc
        type: datetime
        source: input
        description: Planned instant the load begins crossing this segment's structure (UTC). Required when structure_id is set.
        default: null
      - name: planned_cross_end_utc
        type: datetime
        source: input
        description: Planned instant the load finishes crossing this segment's structure (UTC). Must be after planned_cross_start_utc when set.
        default: null
      - name: miles
        type: number
        source: computed
        description: to_milepost - from_milepost. Priced by compute_permit_fee.
      - name: load_tonnage
        type: number
        source: computed
        description: Owning Permit.gross_weight_lbs / 2000, in tons. The tonnage committed on the crossed Structure while RESERVED.
      - name: reservation_status
        type: enum
        source: system
        description: PLANNED at creation; RESERVED when the permit is ISSUED (structure tonnage committed); RELEASED on permit revoke/void; COMPLETED when the trip completes.
        default: PLANNED
        constraints: one of [PLANNED, RESERVED, RELEASED, COMPLETED]

  - name: Structure
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Bridge/structure name.
      - name: highway_id
        type: string
        source: input
        description: Highway the structure carries.
      - name: milepost
        type: number
        source: input
        description: Milepost location of the structure.
      - name: rated_capacity_tonnage
        type: number
        source: input
        description: Rated live-load capacity in tons. Invariant baseline (committed_tonnage + available_tonnage == rated_capacity_tonnage).
        constraints: "> 0"
      - name: dead_load_tonnage
        type: number
        source: input
        description: Permanent dead-load tonnage carried by the structure; input to the bridge rating factor.
        constraints: ">= 0"
      - name: committed_tonnage
        type: number
        source: system
        description: Sum of load_tonnage over RESERVED RouteSegments crossing this structure. Increases on reserve, decreases on release.
        default: 0
      - name: available_tonnage
        type: number
        source: computed
        description: rated_capacity_tonnage - committed_tonnage.
      - name: posture
        type: enum
        source: computed
        description: OPEN when available_tonnage/rated_capacity_tonnage >= 0.5; RESTRICTED when 0 < that ratio < 0.5; CLOSED when available_tonnage <= 0.
        default: OPEN
        constraints: one of [OPEN, RESTRICTED, CLOSED]

  - name: BridgeAnalysis
    parent: Permit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit under analysis.
      - name: structure_id
        type: string
        source: input
        description: FK -> Structure.id; the structure being analysed for this permit.
      - name: method
        type: enum
        source: input
        description: Rating method chosen at review time. LFR or LRFR. Null before review.
        default: null
        constraints: one of [LFR, LRFR]
      - name: rating_factor
        type: number
        source: computed
        description: Computed by compute_rating_factor at review using the chosen method; 4 decimal places.
        default: null
      - name: status
        type: enum
        source: system
        description: REQUESTED at submit; branches at review to CLEARED / CONDITIONAL / REJECTED; CONDITIONAL->CLEARED on carrier accept-conditions; SUPERSEDED on permit revoke/void.
        default: REQUESTED
        constraints: one of [REQUESTED, CLEARED, CONDITIONAL, REJECTED, SUPERSEDED]
      - name: conditions_note
        type: string
        source: system
        description: Restriction text recorded when status becomes CONDITIONAL (e.g., reduced speed, single-lane).
        default: null

  - name: PilotCar
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: Escort company name.
      - name: cert_number
        type: string
        source: input
        description: Pilot-car certification number; unique.
        constraints: unique
      - name: status
        type: enum
        source: input
        description: AVAILABLE (eligible for confirmation) or OUT_OF_SERVICE.
        default: AVAILABLE
        constraints: one of [AVAILABLE, OUT_OF_SERVICE]

  - name: EscortAssignment
    parent: Permit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit this escort serves.
      - name: pilot_car_id
        type: string
        source: input
        description: FK -> PilotCar.id; the assigned pilot car.
      - name: role
        type: enum
        source: input
        description: Escort position. FRONT, REAR, or POLICE.
        constraints: one of [FRONT, REAR, POLICE]
      - name: window_start_utc
        type: datetime
        source: input
        description: Escort duty window start (UTC).
      - name: window_end_utc
        type: datetime
        source: input
        description: Escort duty window end (UTC); must be strictly after window_start_utc.
      - name: status
        type: enum
        source: system
        description: PENDING at creation; CONFIRMED when the pilot car is booked; CANCELLED on cancel; COMPLETED when the trip completes.
        default: PENDING
        constraints: one of [PENDING, CONFIRMED, CANCELLED, COMPLETED]

  - name: Bond
    parent: Permit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit this bond secures.
      - name: amount_cents
        type: integer
        source: computed
        description: Bond amount computed by compute_bond_amount at submit (SUPERLOAD only).
      - name: status
        type: enum
        source: system
        description: DRAFT at creation (submit, superload only); ACTIVE when the permit is ISSUED (escrow encumbered); RELEASED when the permit completes/voids (escrow freed); FORFEITED when a CRITICAL violation is upheld.
        default: DRAFT
        constraints: one of [DRAFT, ACTIVE, RELEASED, FORFEITED]

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit cited.
      - name: carrier_id
        type: string
        source: system
        description: FK -> Carrier.id; copied from the cited permit at creation.
      - name: violation_type
        type: enum
        source: input
        description: OVER_DIMENSION, OFF_ROUTE, OFF_SCHEDULE, NO_ESCORT, or EXPIRED_PERMIT.
        constraints: one of [OVER_DIMENSION, OFF_ROUTE, OFF_SCHEDULE, NO_ESCORT, EXPIRED_PERMIT]
      - name: severity
        type: enum
        source: input
        description: MINOR, MAJOR, or CRITICAL. MAJOR/CRITICAL suspend the permit at creation.
        constraints: one of [MINOR, MAJOR, CRITICAL]
      - name: penalty_cents
        type: integer
        source: computed
        description: Computed by compute_violation_penalty at creation using the carrier's prior UPHELD-violation count.
      - name: status
        type: enum
        source: system
        description: OPEN at creation; CONTESTED on contest; UPHELD or DISMISSED at adjudication.
        default: OPEN
        constraints: one of [OPEN, CONTESTED, UPHELD, DISMISSED]

  - name: TravelRestriction
    parent: null
    common_fields: false
    fields:
      - name: restriction_type
        type: enum
        source: input
        description: CURFEW or HOLIDAY. Descriptive only.
        constraints: one of [CURFEW, HOLIDAY]
      - name: start_utc
        type: datetime
        source: input
        description: Restricted window start (UTC, inclusive).
      - name: end_utc
        type: datetime
        source: input
        description: Restricted window end (UTC, inclusive); must be strictly after start_utc.
      - name: applies_to_classification
        type: enum
        source: input
        description: Which loads the restriction blocks. ALL, or a specific classification value.
        constraints: one of [ALL, OVERSIZE, OVERWEIGHT, OVERSIZE_OVERWEIGHT, SUPERLOAD]

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [REJECTED, COMPLETED, REVOKED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permits/{id}/submit"
        actor: Carrier
        preconditions:
          - "acting Carrier owns the permit (X-User-ID == Permit.carrier_id)"
          - "carrier.compliance_standing != SUSPENDED"
          - "carrier.unpaid_fee_balance_cents == 0"
          - "at least one RouteSegment exists"
          - "if permit_type == ANNUAL then classify_load(permit) != SUPERLOAD"
        side_effects:
          - "compute classification via classify_load"
          - "set requires_superload_review = (classification == SUPERLOAD)"
          - "compute required_escort_count via compute_escort_requirement"
          - "compute fee_cents via compute_permit_fee"
          - "for each RouteSegment with structure_id set, create a BridgeAnalysis(REQUESTED) for (permit, structure)"
          - "if classification == SUPERLOAD, create Bond(DRAFT) with amount via compute_bond_amount"
      - from: RETURNED_FOR_CORRECTION
        to: SUBMITTED
        trigger: "POST /permits/{id}/submit"
        actor: Carrier
        preconditions:
          - "acting Carrier owns the permit"
          - "at least one RouteSegment exists"
        side_effects:
          - "recompute classification, required_escort_count, fee_cents"
          - "recreate missing BridgeAnalysis rows for structures now on the route (existing REQUESTED rows kept)"
        note: "revision loop; re-uses the submit endpoint from the returned state"
      - from: SUBMITTED
        to: UNDER_STANDARD_REVIEW
        trigger: "POST /permits/{id}/begin-review"
        actor: PermitOfficer
        preconditions:
          - "requires_superload_review == false"
        side_effects:
          - "record reviewer as the PermitOfficer (audit)"
        note: "branch A of the fork: non-superload path"
      - from: SUBMITTED
        to: UNDER_SUPERLOAD_REVIEW
        trigger: "POST /permits/{id}/begin-review"
        actor: BridgeEngineer
        preconditions:
          - "requires_superload_review == true"
        side_effects:
          - "record reviewer as the BridgeEngineer (audit)"
          - "flag that an ACTIVE bond will be mandatory before issuance"
        note: "branch B of the fork: superload path, divergent side effects"
      - from: UNDER_STANDARD_REVIEW
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /permits/{id}/return"
        actor: PermitOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_SUPERLOAD_REVIEW
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /permits/{id}/return"
        actor: BridgeEngineer
        preconditions: []
        side_effects: []
      - from: UNDER_STANDARD_REVIEW
        to: APPROVED
        trigger: "POST /permits/{id}/approve"
        actor: PermitOfficer
        preconditions:
          - "every BridgeAnalysis for this permit is CLEARED (cross-entity: Permit depends on BridgeAnalysis.status)"
          - "count of EscortAssignments in CONFIRMED >= required_escort_count"
        side_effects: []
      - from: UNDER_SUPERLOAD_REVIEW
        to: APPROVED
        trigger: "POST /permits/{id}/approve"
        actor: BridgeEngineer
        preconditions:
          - "every BridgeAnalysis for this permit is CLEARED"
          - "count of EscortAssignments in CONFIRMED >= required_escort_count"
          - "a Bond(DRAFT) exists for this permit"
        side_effects: []
      - from: UNDER_STANDARD_REVIEW
        to: REJECTED
        trigger: "POST /permits/{id}/reject"
        actor: PermitOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_SUPERLOAD_REVIEW
        to: REJECTED
        trigger: "POST /permits/{id}/reject"
        actor: BridgeEngineer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ISSUED
        trigger: "POST /permits/{id}/issue"
        actor: PermitOfficer
        preconditions:
          - "every BridgeAnalysis for this permit is CLEARED"
          - "valid_until > current clock and valid_from < valid_until"
          - "for each RouteSegment crossing a Structure: structure.posture != CLOSED"
          - "for each RouteSegment crossing a Structure: structure.available_tonnage >= segment.load_tonnage"
          - "for each RouteSegment crossing a Structure: no other RESERVED RouteSegment on the same structure lies within STRUCTURE_CLEARANCE_BUFFER_MIN of this segment's [planned_cross_start_utc, planned_cross_end_utc]"
          - "no RouteSegment crossing window intersects a TravelRestriction window applicable to this classification"
          - "if classification == SUPERLOAD: a Bond(DRAFT) exists and carrier.escrow_balance_cents >= bond.amount_cents"
        side_effects:
          - "set issued_at = current clock; set valid_from/valid_until on the permit"
          - "each RouteSegment PLANNED->RESERVED; structure.committed_tonnage += segment.load_tonnage; recompute structure.available_tonnage and posture (transitive cascade origin: issue)"
          - "if SUPERLOAD: Bond DRAFT->ACTIVE; carrier.escrow_balance_cents -= bond.amount_cents; carrier.active_bond_amount_cents += bond.amount_cents; recompute carrier.compliance_standing (cascade Permit->Bond->Carrier)"
      - from: ISSUED
        to: SUSPENDED
        trigger: "system: POST /violations with severity in {MAJOR, CRITICAL} on this permit"
        actor: system
        preconditions:
          - "permit.status == ISSUED"
        side_effects:
          - "permit frozen; no completion allowed until the violation is dismissed or the permit revoked"
      - from: SUSPENDED
        to: ISSUED
        trigger: "system: POST /violations/{id}/dismiss for the violation that suspended this permit"
        actor: system
        preconditions:
          - "no other non-DISMISSED Violation exists for this permit"
        side_effects:
          - "permit reinstated (revision/reinstatement cycle)"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system: POST /violations/{id}/uphold with severity == CRITICAL"
        actor: system
        preconditions: []
        side_effects:
          - "each RESERVED RouteSegment RESERVED->RELEASED; structure.committed_tonnage -= segment.load_tonnage; recompute available_tonnage and posture (transitive cascade: Violation->Permit->RouteSegment->Structure)"
          - "if a Bond is ACTIVE: Bond ACTIVE->FORFEITED; carrier.active_bond_amount_cents -= bond.amount_cents (escrow NOT refunded on forfeiture)"
      - from: ISSUED
        to: COMPLETED
        trigger: "POST /permits/{id}/complete"
        actor: Carrier
        preconditions:
          - "acting Carrier owns the permit"
          - "current clock <= valid_until"
        side_effects:
          - "each RESERVED RouteSegment RESERVED->COMPLETED; structure.committed_tonnage -= segment.load_tonnage; recompute available_tonnage and posture"
          - "each CONFIRMED EscortAssignment CONFIRMED->COMPLETED"
          - "if a Bond is ACTIVE: Bond ACTIVE->RELEASED; carrier.escrow_balance_cents += bond.amount_cents; carrier.active_bond_amount_cents -= bond.amount_cents (escrow/bond conservation)"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances clock past valid_until"
        actor: system
        preconditions:
          - "new clock > valid_until"
        side_effects:
          - "each RESERVED RouteSegment RESERVED->RELEASED; structure.committed_tonnage -= segment.load_tonnage; recompute available_tonnage and posture"
          - "if a Bond is ACTIVE: Bond ACTIVE->RELEASED; carrier.escrow_balance_cents += bond.amount_cents; carrier.active_bond_amount_cents -= bond.amount_cents"

  - entity: BridgeAnalysis
    initial_state: REQUESTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: CLEARED
        trigger: "POST /bridge-analyses/{id}/review"
        actor: BridgeEngineer
        preconditions:
          - "owning permit.status in {UNDER_STANDARD_REVIEW, UNDER_SUPERLOAD_REVIEW}"
          - "compute_rating_factor(method) >= 1.00"
        side_effects:
          - "set method and rating_factor"
        note: "fork branch: pass"
      - from: REQUESTED
        to: CONDITIONAL
        trigger: "POST /bridge-analyses/{id}/review"
        actor: BridgeEngineer
        preconditions:
          - "owning permit.status in {UNDER_STANDARD_REVIEW, UNDER_SUPERLOAD_REVIEW}"
          - "0.90 <= compute_rating_factor(method) < 1.00"
        side_effects:
          - "set method and rating_factor"
          - "set conditions_note (reduced speed / single-lane crossing)"
        note: "fork branch: conditional, divergent side effect (conditions_note)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /bridge-analyses/{id}/review"
        actor: BridgeEngineer
        preconditions:
          - "owning permit.status in {UNDER_STANDARD_REVIEW, UNDER_SUPERLOAD_REVIEW}"
          - "compute_rating_factor(method) < 0.90"
        side_effects:
          - "set method and rating_factor; route is infeasible until re-routed/edited"
        note: "fork branch: fail (terminal)"
      - from: CONDITIONAL
        to: CLEARED
        trigger: "POST /bridge-analyses/{id}/accept-conditions"
        actor: Carrier
        preconditions:
          - "acting Carrier owns the owning permit"
        side_effects:
          - "conditions accepted; analysis counts as cleared for approval"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system: owning Permit -> REVOKED or trip COMPLETED"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONDITIONAL
        to: SUPERSEDED
        trigger: "system: owning Permit -> REVOKED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EscortAssignment
    initial_state: PENDING
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /escort-assignments/{id}/confirm"
        actor: Carrier
        preconditions:
          - "acting Carrier owns the owning permit"
          - "PilotCar.status == AVAILABLE (cross-entity: EscortAssignment depends on PilotCar.status)"
          - "no other CONFIRMED EscortAssignment for the same pilot_car_id overlaps [window_start_utc, window_end_utc) (half-open; back-to-back allowed)"
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /escort-assignments/{id}/cancel"
        actor: Carrier
        preconditions:
          - "acting Carrier owns the owning permit"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /escort-assignments/{id}/cancel"
        actor: Carrier
        preconditions:
          - "acting Carrier owns the owning permit"
          - "owning permit.status != ISSUED"
        side_effects:
          - "pilot car freed for its window"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: owning Permit trip COMPLETED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Violation
    initial_state: OPEN
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: OPEN
        to: CONTESTED
        trigger: "POST /violations/{id}/contest"
        actor: Carrier
        preconditions:
          - "acting Carrier owns the cited permit"
        side_effects: []
      - from: OPEN
        to: UPHELD
        trigger: "POST /violations/{id}/uphold"
        actor: EnforcementOfficer
        preconditions: []
        side_effects:
          - "carrier.unpaid_fee_balance_cents += penalty_cents"
          - "recompute carrier.compliance_standing"
          - "if severity == CRITICAL and cited permit.status == SUSPENDED: permit SUSPENDED->REVOKED (fires the revoke cascade)"
      - from: CONTESTED
        to: UPHELD
        trigger: "POST /violations/{id}/uphold"
        actor: EnforcementOfficer
        preconditions: []
        side_effects:
          - "carrier.unpaid_fee_balance_cents += penalty_cents"
          - "recompute carrier.compliance_standing"
          - "if severity == CRITICAL and cited permit.status == SUSPENDED: permit SUSPENDED->REVOKED"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /violations/{id}/dismiss"
        actor: EnforcementOfficer
        preconditions: []
        side_effects:
          - "if cited permit.status == SUSPENDED and no other non-DISMISSED Violation exists: permit SUSPENDED->ISSUED"
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /violations/{id}/dismiss"
        actor: EnforcementOfficer
        preconditions: []
        side_effects:
          - "if cited permit.status == SUSPENDED and no other non-DISMISSED Violation exists: permit SUSPENDED->ISSUED"

  - entity: Bond
    initial_state: DRAFT
    terminal_states: [RELEASED, FORFEITED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system: owning Permit -> ISSUED"
        actor: system
        preconditions:
          - "carrier.escrow_balance_cents >= amount_cents"
        side_effects:
          - "carrier.escrow_balance_cents -= amount_cents; carrier.active_bond_amount_cents += amount_cents"
      - from: ACTIVE
        to: RELEASED
        trigger: "system: owning Permit -> COMPLETED or EXPIRED"
        actor: system
        preconditions: []
        side_effects:
          - "carrier.escrow_balance_cents += amount_cents; carrier.active_bond_amount_cents -= amount_cents"
      - from: ACTIVE
        to: FORFEITED
        trigger: "system: CRITICAL Violation upheld -> owning Permit REVOKED"
        actor: system
        preconditions: []
        side_effects:
          - "carrier.active_bond_amount_cents -= amount_cents (escrow retained by the DOT, not refunded)"

  - entity: RouteSegment
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: RESERVED
        trigger: "system: owning Permit -> ISSUED"
        actor: system
        preconditions:
          - "if structure_id set: structure.available_tonnage >= load_tonnage and structure.posture != CLOSED"
        side_effects:
          - "if structure_id set: structure.committed_tonnage += load_tonnage"
      - from: RESERVED
        to: RELEASED
        trigger: "system: owning Permit -> REVOKED or EXPIRED"
        actor: system
        preconditions: []
        side_effects:
          - "if structure_id set: structure.committed_tonnage -= load_tonnage"
      - from: RESERVED
        to: COMPLETED
        trigger: "system: owning Permit -> COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "if structure_id set: structure.committed_tonnage -= load_tonnage"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: permit-edit-stale-version
    parent_entity: Permit
    write_endpoint: "PATCH /permits/{id}"
    occ_field: "expected_permit_version"
    description: |
      Editing a Permit's load fields while it is DRAFT or RETURNED_FOR_CORRECTION
      is rejected when the client's expected_permit_version no longer matches the
      stored Permit.version. Because adding a route segment, resubmitting, or any
      prior edit advances Permit.version, a client acting on a stale view has its
      edit rejected. A second sequential edit against an already-advanced version
      is deterministically refused; the edit itself would otherwise succeed (the
      permit is still editable), so this is a version-staleness guard, not a state
      precondition.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: classify_load
    trigger: "on POST /permits/{id}/submit (and recompute on resubmit)"
    algorithm: threshold
    formula: |
      oversize = (width_in > LEGAL_WIDTH_IN) or (height_in > LEGAL_HEIGHT_IN)
                 or (length_in > LEGAL_LENGTH_IN)
                 or (max(front_overhang_in, rear_overhang_in) > LEGAL_OVERHANG_IN)
      overweight = (gross_weight_lbs > LEGAL_GROSS_LBS)
      superload = (width_in >= SUPERLOAD_WIDTH_IN) or (height_in >= SUPERLOAD_HEIGHT_IN)
                  or (length_in >= SUPERLOAD_LENGTH_IN)
                  or (gross_weight_lbs >= SUPERLOAD_WEIGHT_LBS)
      if superload:        classification = SUPERLOAD
      elif oversize and overweight: classification = OVERSIZE_OVERWEIGHT
      elif oversize:       classification = OVERSIZE
      elif overweight:     classification = OVERWEIGHT
      else:                classification = LEGAL
    input_set: "the permit's own dimension/weight fields; no cross-entity inputs"
    constants:
      LEGAL_WIDTH_IN: 102
      LEGAL_HEIGHT_IN: 162
      LEGAL_LENGTH_IN: 1020
      LEGAL_OVERHANG_IN: 72
      LEGAL_GROSS_LBS: 80000
      SUPERLOAD_WIDTH_IN: 192
      SUPERLOAD_HEIGHT_IN: 204
      SUPERLOAD_LENGTH_IN: 1560
      SUPERLOAD_WEIGHT_LBS: 200000
    precision: "integer comparisons; SUPERLOAD_WEIGHT_LBS uses >= (200000 lbs is SUPERLOAD, 199999 is not)"

  - name: compute_escort_requirement
    trigger: "on POST /permits/{id}/submit (and recompute on resubmit)"
    algorithm: weighted_scoring
    formula: |
      width_comp  = 0 if width_in <= ESCORT_WIDTH_T1_IN
                    else 1 if width_in <= ESCORT_WIDTH_T2_IN
                    else 2
      length_comp = 0 if length_in <= ESCORT_LENGTH_T1_IN
                    else 1 if length_in <= ESCORT_LENGTH_T2_IN
                    else 2
      height_comp = 1 if height_in > ESCORT_HEIGHT_POLE_IN else 0
      police_comp = 1 if (width_in > POLICE_WIDTH_IN or gross_weight_lbs >= SUPERLOAD_WEIGHT_LBS) else 0
      required_escort_count = max(width_comp, length_comp) + height_comp + police_comp
    input_set: "the permit's own width_in, length_in, height_in, gross_weight_lbs"
    constants:
      ESCORT_WIDTH_T1_IN: 120
      ESCORT_WIDTH_T2_IN: 168
      ESCORT_LENGTH_T1_IN: 960
      ESCORT_LENGTH_T2_IN: 1440
      ESCORT_HEIGHT_POLE_IN: 168
      POLICE_WIDTH_IN: 192
      SUPERLOAD_WEIGHT_LBS: 200000
    precision: "integer count; note the nested max() over the two tiered components before adding height/police"

  - name: compute_permit_fee
    trigger: "on POST /permits/{id}/submit (and recompute on resubmit)"
    algorithm: tiered_pricing
    formula: |
      oversize_surcharge = OVERSIZE_SURCHARGE_CENTS if classification in
        {OVERSIZE, OVERSIZE_OVERWEIGHT, SUPERLOAD} else 0
      overweight_surcharge = ceil((gross_weight_lbs - LEGAL_GROSS_LBS) / 1000) * OVERWEIGHT_PER_KLB_CENTS
        if gross_weight_lbs > LEGAL_GROSS_LBS else 0
      superload_surcharge = SUPERLOAD_SURCHARGE_CENTS if classification == SUPERLOAD else 0

      # VARIANT SINGLE_TRIP:
      #   per-segment rounding is PINNED: round EACH segment then sum (round_half_up to whole cents)
      mileage_total = sum over RouteSegments of round_half_up(segment.miles * PER_MILE_RATE_CENTS)
      fee_single = BASE_FEE_CENTS + mileage_total + oversize_surcharge
                   + overweight_surcharge + superload_surcharge

      # VARIANT ANNUAL: flat base, NO mileage, NO superload (ANNUAL+SUPERLOAD is rejected at submit)
      fee_annual = ANNUAL_BASE_FEE_CENTS + oversize_surcharge + overweight_surcharge

      fee_cents = fee_single if permit_type == SINGLE_TRIP else fee_annual
    input_set: "permit fields + its RouteSegments' miles (RouteSegment order by sequence_index ASC)"
    constants:
      BASE_FEE_CENTS: 1500
      PER_MILE_RATE_CENTS: 25
      OVERSIZE_SURCHARGE_CENTS: 3000
      OVERWEIGHT_PER_KLB_CENTS: 1000
      SUPERLOAD_SURCHARGE_CENTS: 50000
      ANNUAL_BASE_FEE_CENTS: 40000
      LEGAL_GROSS_LBS: 80000
    precision: "whole cents; round_half_up per-segment BEFORE summing (sum-then-round is the wrong, forbidden order)"
    variants:
      - name: single_trip
        when: "permit_type == SINGLE_TRIP"
        difference: "includes per-segment mileage and superload surcharge"
      - name: annual
        when: "permit_type == ANNUAL"
        difference: "flat ANNUAL_BASE_FEE_CENTS, no mileage, superload disallowed"

  - name: compute_rating_factor
    trigger: "on POST /bridge-analyses/{id}/review"
    algorithm: weighted_scoring
    formula: |
      live_load_tonnage = owning_permit.gross_weight_lbs / 2000
      # method-specific dead/live load factors:
      #   LFR : dead=1.30, live=2.17 ; LRFR: dead=1.25, live=1.75
      rating_factor = round_half_up(
        (structure.rated_capacity_tonnage - dead_factor * structure.dead_load_tonnage)
        / (live_factor * live_load_tonnage), 4)
    input_set: "the target Structure (rated_capacity_tonnage, dead_load_tonnage) and owning Permit.gross_weight_lbs"
    constants:
      LFR_DEAD_FACTOR: 1.30
      LFR_LIVE_FACTOR: 2.17
      LRFR_DEAD_FACTOR: 1.25
      LRFR_LIVE_FACTOR: 1.75
      CLEARED_MIN_RF: 1.00
      CONDITIONAL_MIN_RF: 0.90
    precision: "4 decimal places, round_half_up"
    variants:
      - name: lfr
        when: "method == LFR"
        difference: "Load Factor Rating: dead=1.30, live=2.17"
      - name: lrfr
        when: "method == LRFR"
        difference: "Load and Resistance Factor Rating: dead=1.25, live=1.75; yields a different rating_factor for identical structure+load"

  - name: compute_bond_amount
    trigger: "on POST /permits/{id}/submit when classification == SUPERLOAD"
    algorithm: threshold
    formula: |
      over_klb = ceil((gross_weight_lbs - SUPERLOAD_WEIGHT_LBS) / 1000)
      amount_cents = BOND_BASE_CENTS + over_klb * BOND_PER_KLB_CENTS
    input_set: "the permit's gross_weight_lbs"
    constants:
      SUPERLOAD_WEIGHT_LBS: 200000
      BOND_BASE_CENTS: 5000000
      BOND_PER_KLB_CENTS: 100000
    precision: "whole cents; ceil the klb count"

  - name: compute_violation_penalty
    trigger: "on POST /violations (creation)"
    algorithm: chronological
    formula: |
      prior_upheld = count of Violations for this carrier with status == UPHELD,
                     evaluated in created_at ASC order at the instant of creation
      repeat_mult = 1 + REPEAT_STEP * prior_upheld
      penalty_cents = round_half_up(BASE_PENALTY[violation_type] * SEVERITY_MULT[severity] * repeat_mult)
    input_set: "the carrier's UPHELD Violations (status == UPHELD only), counted chronologically by created_at ASC"
    constants:
      BASE_PENALTY_OVER_DIMENSION: 100000
      BASE_PENALTY_OFF_ROUTE: 150000
      BASE_PENALTY_OFF_SCHEDULE: 75000
      BASE_PENALTY_NO_ESCORT: 200000
      BASE_PENALTY_EXPIRED_PERMIT: 50000
      SEVERITY_MULT_MINOR: 1
      SEVERITY_MULT_MAJOR: 2
      SEVERITY_MULT_CRITICAL: 3
      REPEAT_STEP: 0.5
    precision: "whole cents, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per RBAC; for Carrier mutations the acting Carrier owns the target resource (X-User-ID == owning Permit.carrier_id / Carrier.id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path id and body FK resolves, left-to-right (carrier, permit, structure, pilot_car, route_segment, bridge_analysis, escort_assignment, violation)"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "dimensions/weight positive; overhang >= 0; num_axles >= 2; RouteSegment to_milepost > from_milepost; cross windows: planned_cross_end_utc > planned_cross_start_utc; escort window_end_utc > window_start_utc"
    error_id: ERR_INVALID_DIMENSIONS
    http_status: 422
    applies_to: "POST /permits, PATCH /permits/{id}, POST /permits/{id}/route-segments, POST /permits/{id}/escort-assignments"
  - priority: 6
    category: business_temporal
    check: "valid_from < valid_until"
    error_id: ERR_VALIDITY_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /permits, PATCH /permits/{id}"
  - priority: 7
    category: state
    check: "OCC: expected_permit_version == Permit.version"
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412
    applies_to: "PATCH /permits/{id}"
  - priority: 8
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_PERMIT_STATE
    http_status: 409
    applies_to: "all Permit transition endpoints (submit, begin-review, return, approve, reject, issue, complete) and PATCH /permits/{id}"
  - priority: 9
    category: state
    check: "BridgeAnalysis transition defined from current status"
    error_id: ERR_INVALID_ANALYSIS_STATE
    http_status: 409
    applies_to: "POST /bridge-analyses/{id}/review, POST /bridge-analyses/{id}/accept-conditions"
  - priority: 10
    category: state
    check: "EscortAssignment transition defined from current status"
    error_id: ERR_INVALID_ESCORT_STATE
    http_status: 409
    applies_to: "POST /escort-assignments/{id}/confirm, POST /escort-assignments/{id}/cancel"
  - priority: 11
    category: state
    check: "Violation transition defined from current status"
    error_id: ERR_INVALID_VIOLATION_STATE
    http_status: 409
    applies_to: "POST /violations/{id}/contest, /uphold, /dismiss"
  - priority: 12
    category: business_constraint
    check: "carrier.compliance_standing != SUSPENDED"
    error_id: ERR_CARRIER_SUSPENDED
    http_status: 403
    applies_to: "POST /permits/{id}/submit"
  - priority: 13
    category: business_constraint
    check: "permit has >= 1 RouteSegment"
    error_id: ERR_ROUTE_EMPTY
    http_status: 422
    applies_to: "POST /permits/{id}/submit"
  - priority: 14
    category: business_constraint
    check: "not (permit_type == ANNUAL and classify_load == SUPERLOAD)"
    error_id: ERR_ANNUAL_SUPERLOAD_FORBIDDEN
    http_status: 422
    applies_to: "POST /permits/{id}/submit"
  - priority: 15
    category: business_safety
    check: "no BridgeAnalysis for the permit is REJECTED (checked before the incomplete check, since a REJECTED analysis is also non-cleared)"
    error_id: ERR_BRIDGE_REJECTED
    http_status: 409
    applies_to: "POST /permits/{id}/approve, POST /permits/{id}/issue"
  - priority: 16
    category: business_safety
    check: "every BridgeAnalysis for the permit is CLEARED, i.e. none is still REQUESTED or CONDITIONAL (pending)"
    error_id: ERR_BRIDGE_ANALYSIS_INCOMPLETE
    http_status: 409
    applies_to: "POST /permits/{id}/approve, POST /permits/{id}/issue"
  - priority: 17
    category: business_safety
    check: "count of CONFIRMED EscortAssignments >= required_escort_count"
    error_id: ERR_ESCORT_REQUIREMENT_UNMET
    http_status: 409
    applies_to: "POST /permits/{id}/approve"
  - priority: 18
    category: business_safety
    check: "for each RouteSegment crossing a Structure: structure.posture != CLOSED"
    error_id: ERR_STRUCTURE_CLOSED
    http_status: 409
    applies_to: "POST /permits/{id}/issue"
  - priority: 19
    category: business_safety
    check: "for each RouteSegment crossing a Structure: structure.available_tonnage >= segment.load_tonnage"
    error_id: ERR_STRUCTURE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /permits/{id}/issue"
  - priority: 20
    category: business_referential
    check: "PilotCar.status == AVAILABLE"
    error_id: ERR_PILOT_CAR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /escort-assignments/{id}/confirm"
  - priority: 21
    category: business_constraint
    check: "no other CONFIRMED EscortAssignment on the same pilot_car_id overlaps [window_start_utc, window_end_utc) (half-open; adjacency allowed)"
    error_id: ERR_PILOT_CAR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /escort-assignments/{id}/confirm"
  - priority: 22
    category: business_constraint
    check: "for each RouteSegment crossing a Structure: no other RESERVED RouteSegment on the same structure lies within STRUCTURE_CLEARANCE_BUFFER_MIN minutes of [planned_cross_start_utc, planned_cross_end_utc] (closed interval + buffer)"
    error_id: ERR_STRUCTURE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /permits/{id}/issue"
  - priority: 23
    category: business_temporal
    check: "no RouteSegment crossing window intersects a TravelRestriction window applicable to the permit classification"
    error_id: ERR_TRAVEL_TIME_RESTRICTED
    http_status: 409
    applies_to: "POST /permits/{id}/issue"
  - priority: 24
    category: business_fiscal
    check: "carrier.unpaid_fee_balance_cents == 0"
    error_id: ERR_UNPAID_FEES
    http_status: 402
    applies_to: "POST /permits/{id}/submit"
  - priority: 25
    category: business_fiscal
    check: "if classification == SUPERLOAD: carrier.escrow_balance_cents >= bond.amount_cents"
    error_id: ERR_INSUFFICIENT_ESCROW
    http_status: 402
    applies_to: "POST /permits/{id}/issue"

constants_global:
  STRUCTURE_CLEARANCE_BUFFER_MIN: 30
  DEFAULT_CLOCK_UTC: "2026-03-01T00:00:00Z"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- reference data (DOTAdmin) ----
  - method: POST
    path: "/carriers"
    description: "Register a carrier."
    roles: [DOTAdmin]
    code: 201
    input: [legal_name, usdot_number]
    output: Carrier
    side_effects: []
  - method: GET
    path: "/carriers/{id}"
    description: "Read a carrier (escrow, bond, standing)."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: POST
    path: "/carriers/{id}/escrow-deposits"
    description: "Deposit escrow for a carrier (increments escrow_balance_cents and total_escrow_deposited_cents)."
    roles: [DOTAdmin]
    code: 200
    input: [amount_cents]
    output: Carrier
    side_effects: ["carrier.escrow_balance_cents += amount_cents", "carrier.total_escrow_deposited_cents += amount_cents"]
  - method: POST
    path: "/structures"
    description: "Create a bridge/structure."
    roles: [DOTAdmin]
    code: 201
    input: [name, highway_id, milepost, rated_capacity_tonnage, dead_load_tonnage]
    output: Structure
    side_effects: ["committed_tonnage = 0; available_tonnage = rated_capacity_tonnage; posture computed"]
  - method: GET
    path: "/structures/{id}"
    description: "Read a structure (tonnage, posture)."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: []
    output: Structure
    side_effects: []
  - method: POST
    path: "/pilot-cars"
    description: "Register a pilot car."
    roles: [DOTAdmin]
    code: 201
    input: [company_name, cert_number, "status?"]
    output: PilotCar
    side_effects: []
  - method: GET
    path: "/pilot-cars/{id}"
    description: "Read a pilot car."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: []
    output: PilotCar
    side_effects: []
  - method: POST
    path: "/travel-restrictions"
    description: "Create a time-of-travel restriction window."
    roles: [DOTAdmin]
    code: 201
    input: [restriction_type, start_utc, end_utc, applies_to_classification]
    output: TravelRestriction
    side_effects: []

  # ---- permit lifecycle ----
  - method: POST
    path: "/permits"
    description: "Create a permit application (DRAFT)."
    roles: [Carrier]
    code: 201
    input: [carrier_id, permit_type, length_in, width_in, height_in, "front_overhang_in?", "rear_overhang_in?", gross_weight_lbs, num_axles, valid_from, valid_until]
    output: Permit
    side_effects: ["status = DRAFT; version = 1"]
  - method: GET
    path: "/permits/{id}"
    description: "Read a permit."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/permits"
    description: "List permits, filterable by carrier (FK reverse Carrier->Permit) and status."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: ["carrier_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: PATCH
    path: "/permits/{id}"
    description: "Edit load fields while DRAFT/RETURNED_FOR_CORRECTION. OCC-guarded."
    roles: [Carrier]
    code: 200
    input: [expected_permit_version, "permit_type?", "length_in?", "width_in?", "height_in?", "front_overhang_in?", "rear_overhang_in?", "gross_weight_lbs?", "num_axles?", "valid_from?", "valid_until?"]
    output: Permit
    side_effects: ["increments Permit.version by 1"]
  - method: POST
    path: "/permits/{id}/route-segments"
    description: "Add a route segment while the permit is DRAFT/RETURNED_FOR_CORRECTION."
    roles: [Carrier]
    code: 201
    input: [sequence_index, highway_id, from_milepost, to_milepost, "structure_id?", "planned_cross_start_utc?", "planned_cross_end_utc?"]
    output: RouteSegment
    side_effects: ["miles computed; load_tonnage computed; increments Permit.version by 1"]
  - method: GET
    path: "/route-segments"
    description: "List route segments, filterable by permit (FK reverse Permit->RouteSegment) and structure (FK reverse Structure->RouteSegment)."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: ["permit_id?", "structure_id?", "limit?", "offset?"]
    output: RouteSegment[]
    side_effects: []
  - method: GET
    path: "/route-segments/{id}"
    description: "Read a route segment."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: []
    output: RouteSegment
    side_effects: []
  - method: POST
    path: "/permits/{id}/escort-assignments"
    description: "Add an escort assignment (PENDING)."
    roles: [Carrier]
    code: 201
    input: [pilot_car_id, role, window_start_utc, window_end_utc]
    output: EscortAssignment
    side_effects: []
  - method: GET
    path: "/escort-assignments"
    description: "List escort assignments, filterable by permit (FK reverse Permit->EscortAssignment) and pilot_car (FK reverse PilotCar->EscortAssignment)."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: ["permit_id?", "pilot_car_id?", "limit?", "offset?"]
    output: EscortAssignment[]
    side_effects: []
  - method: GET
    path: "/escort-assignments/{id}"
    description: "Read an escort assignment."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: []
    output: EscortAssignment
    side_effects: []
  - method: POST
    path: "/escort-assignments/{id}/confirm"
    description: "Confirm an escort (books the pilot car)."
    roles: [Carrier]
    code: 200
    input: []
    output: EscortAssignment
    side_effects: ["PENDING->CONFIRMED"]
  - method: POST
    path: "/escort-assignments/{id}/cancel"
    description: "Cancel an escort assignment."
    roles: [Carrier]
    code: 200
    input: []
    output: EscortAssignment
    side_effects: ["->CANCELLED; frees the pilot car window"]
  - method: POST
    path: "/permits/{id}/submit"
    description: "Submit (or resubmit after correction). Computes classification/escort/fee, spawns BridgeAnalyses, spawns Bond for superload."
    roles: [Carrier]
    code: 200
    input: []
    output: Permit
    side_effects: ["classify_load; compute_escort_requirement; compute_permit_fee; create BridgeAnalysis per structure; create Bond(DRAFT) if SUPERLOAD"]
  - method: POST
    path: "/permits/{id}/begin-review"
    description: "Start review. PermitOfficer for standard loads; BridgeEngineer for superloads (branch)."
    roles: [PermitOfficer, BridgeEngineer]
    code: 200
    input: []
    output: Permit
    side_effects: ["SUBMITTED -> UNDER_STANDARD_REVIEW or UNDER_SUPERLOAD_REVIEW per requires_superload_review"]
  - method: POST
    path: "/permits/{id}/return"
    description: "Return a permit for correction."
    roles: [PermitOfficer, BridgeEngineer]
    code: 200
    input: ["reason?"]
    output: Permit
    side_effects: ["-> RETURNED_FOR_CORRECTION"]
  - method: POST
    path: "/permits/{id}/approve"
    description: "Approve a permit (all bridges cleared, escorts met)."
    roles: [PermitOfficer, BridgeEngineer]
    code: 200
    input: []
    output: Permit
    side_effects: ["-> APPROVED"]
  - method: POST
    path: "/permits/{id}/reject"
    description: "Reject a permit (terminal)."
    roles: [PermitOfficer, BridgeEngineer]
    code: 200
    input: ["reason?"]
    output: Permit
    side_effects: ["-> REJECTED"]
  - method: POST
    path: "/permits/{id}/issue"
    description: "Issue an approved permit: reserve structures, activate bond, set validity."
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: ["APPROVED->ISSUED; reserve RouteSegments (commit tonnage); Bond DRAFT->ACTIVE (debit escrow); set issued_at"]
  - method: POST
    path: "/permits/{id}/complete"
    description: "Mark the trip completed (release structures/escorts/bond)."
    roles: [Carrier]
    code: 200
    input: []
    output: Permit
    side_effects: ["ISSUED->COMPLETED; release tonnage; complete escorts; Bond ACTIVE->RELEASED (refund escrow)"]

  # ---- bridge analysis ----
  - method: GET
    path: "/bridge-analyses"
    description: "List bridge analyses, filterable by permit (FK reverse Permit->BridgeAnalysis) and structure (FK reverse Structure->BridgeAnalysis)."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: ["permit_id?", "structure_id?", "limit?", "offset?"]
    output: BridgeAnalysis[]
    side_effects: []
  - method: GET
    path: "/bridge-analyses/{id}"
    description: "Read a bridge analysis."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: []
    output: BridgeAnalysis
    side_effects: []
  - method: POST
    path: "/bridge-analyses/{id}/review"
    description: "Engineer reviews: computes rating_factor with the chosen method and branches CLEARED/CONDITIONAL/REJECTED."
    roles: [BridgeEngineer]
    code: 200
    input: [method]
    output: BridgeAnalysis
    side_effects: ["compute_rating_factor; set status per thresholds"]
  - method: POST
    path: "/bridge-analyses/{id}/accept-conditions"
    description: "Carrier accepts CONDITIONAL restrictions -> CLEARED."
    roles: [Carrier]
    code: 200
    input: []
    output: BridgeAnalysis
    side_effects: ["CONDITIONAL->CLEARED"]

  # ---- bond ----
  - method: GET
    path: "/bonds"
    description: "List bonds, filterable by permit (FK reverse Permit->Bond)."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: ["permit_id?", "limit?", "offset?"]
    output: Bond[]
    side_effects: []
  - method: GET
    path: "/bonds/{id}"
    description: "Read a bond."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: []
    output: Bond
    side_effects: []

  # ---- violations ----
  - method: POST
    path: "/violations"
    description: "Cite a violation against a permit. Computes penalty; suspends the permit for MAJOR/CRITICAL."
    roles: [EnforcementOfficer]
    code: 201
    input: [permit_id, violation_type, severity]
    output: Violation
    side_effects: ["compute_violation_penalty; copy carrier_id; if severity in {MAJOR,CRITICAL} and permit ISSUED: permit->SUSPENDED"]
  - method: GET
    path: "/violations/{id}"
    description: "Read a violation."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: GET
    path: "/violations"
    description: "List violations, filterable by permit (FK reverse Permit->Violation) and carrier (FK reverse Carrier->Violation)."
    roles: [Carrier, PermitOfficer, BridgeEngineer, EnforcementOfficer, DOTAdmin]
    code: 200
    input: ["permit_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []
  - method: POST
    path: "/violations/{id}/contest"
    description: "Carrier contests a violation."
    roles: [Carrier]
    code: 200
    input: []
    output: Violation
    side_effects: ["OPEN->CONTESTED"]
  - method: POST
    path: "/violations/{id}/uphold"
    description: "Uphold a violation: accrue penalty; CRITICAL upheld revokes a suspended permit."
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["->UPHELD; carrier.unpaid_fee_balance_cents += penalty; recompute standing; CRITICAL cascade to permit REVOKED"]
  - method: POST
    path: "/violations/{id}/dismiss"
    description: "Dismiss a violation: reinstate a suspended permit when no other open violations remain."
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["->DISMISSED; reinstate permit SUSPENDED->ISSUED when clear"]

  # ---- clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default at startup is 2026-03-01T00:00:00Z (never falls back to wall-clock). Advancing past a permit's valid_until expires it (releases structures/bond)."
    roles: [DOTAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set logical clock; expire ISSUED permits whose valid_until < new clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid auth headers or unknown role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the endpoint, or Carrier acting on a resource it does not own, or PermitOfficer beginning review on a superload (superloads require BridgeEngineer)."
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "carrier_id does not resolve."
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit id does not resolve."
  - id: ERR_STRUCTURE_NOT_FOUND
    http: 404
    condition: "structure_id does not resolve."
  - id: ERR_PILOT_CAR_NOT_FOUND
    http: 404
    condition: "pilot_car_id does not resolve."
  - id: ERR_ROUTE_SEGMENT_NOT_FOUND
    http: 404
    condition: "route segment id does not resolve."
  - id: ERR_BRIDGE_ANALYSIS_NOT_FOUND
    http: 404
    condition: "bridge analysis id does not resolve."
  - id: ERR_ESCORT_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "escort assignment id does not resolve."
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "violation id does not resolve."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, invalid enum, or unknown field."
  - id: ERR_INVALID_DIMENSIONS
    http: 422
    condition: "Non-positive dimension/weight, negative overhang, num_axles < 2, to_milepost <= from_milepost, or window end <= start."
  - id: ERR_VALIDITY_WINDOW_INVALID
    http: 422
    condition: "valid_from >= valid_until."
  - id: ERR_STALE_PERMIT_VERSION
    http: 412
    condition: "PATCH /permits expected_permit_version != Permit.version."
  - id: ERR_INVALID_PERMIT_STATE
    http: 409
    condition: "Permit transition not defined from its current status."
  - id: ERR_INVALID_ANALYSIS_STATE
    http: 409
    condition: "BridgeAnalysis transition not defined from its current status."
  - id: ERR_INVALID_ESCORT_STATE
    http: 409
    condition: "EscortAssignment transition not defined from its current status."
  - id: ERR_INVALID_VIOLATION_STATE
    http: 409
    condition: "Violation transition not defined from its current status."
  - id: ERR_CARRIER_SUSPENDED
    http: 403
    condition: "Carrier compliance_standing == SUSPENDED at submit."
  - id: ERR_ROUTE_EMPTY
    http: 422
    condition: "Submit with zero RouteSegments."
  - id: ERR_ANNUAL_SUPERLOAD_FORBIDDEN
    http: 422
    condition: "permit_type == ANNUAL but the load classifies as SUPERLOAD."
  - id: ERR_BRIDGE_ANALYSIS_INCOMPLETE
    http: 409
    condition: "Approve/issue while some BridgeAnalysis is not CLEARED (still REQUESTED or CONDITIONAL)."
  - id: ERR_BRIDGE_REJECTED
    http: 409
    condition: "Approve/issue while a BridgeAnalysis is REJECTED."
  - id: ERR_ESCORT_REQUIREMENT_UNMET
    http: 409
    condition: "Approve while CONFIRMED escort count < required_escort_count."
  - id: ERR_STRUCTURE_CLOSED
    http: 409
    condition: "Issue while a crossed structure's posture == CLOSED."
  - id: ERR_STRUCTURE_CAPACITY_EXCEEDED
    http: 409
    condition: "Issue while a crossed structure's available_tonnage < segment.load_tonnage."
  - id: ERR_PILOT_CAR_UNAVAILABLE
    http: 409
    condition: "Confirm an escort whose pilot car status != AVAILABLE."
  - id: ERR_PILOT_CAR_DOUBLE_BOOKED
    http: 409
    condition: "Confirm an escort overlapping another CONFIRMED window for the same pilot car (half-open)."
  - id: ERR_STRUCTURE_WINDOW_CONFLICT
    http: 409
    condition: "Issue where a structure crossing window is within the clearance buffer of another RESERVED crossing on the same structure."
  - id: ERR_TRAVEL_TIME_RESTRICTED
    http: 409
    condition: "Issue where a crossing window intersects an applicable TravelRestriction."
  - id: ERR_UNPAID_FEES
    http: 402
    condition: "Submit while carrier.unpaid_fee_balance_cents > 0."
  - id: ERR_INSUFFICIENT_ESCROW
    http: 402
    condition: "Issue a superload while carrier.escrow_balance_cents < bond.amount_cents."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Carrier
    description: "Trucking company applicant; owns permits, route segments, escorts, contests violations."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /permits"
      - "PATCH /permits/{id}"
      - "POST /permits/{id}/route-segments"
      - "POST /permits/{id}/escort-assignments"
      - "POST /escort-assignments/{id}/confirm"
      - "POST /escort-assignments/{id}/cancel"
      - "POST /permits/{id}/submit"
      - "POST /permits/{id}/complete"
      - "POST /bridge-analyses/{id}/accept-conditions"
      - "POST /violations/{id}/contest"
    shared_operations:
      - "GET (permits, route-segments, escort-assignments, bridge-analyses, bonds, violations, carriers, structures, pilot-cars)"
  - name: PermitOfficer
    description: "Reviews and issues standard (non-superload) permits."
    identity: opaque
    exclusive_operations:
      - "POST /permits/{id}/issue"
    shared_operations:
      - "POST /permits/{id}/begin-review"
      - "POST /permits/{id}/return"
      - "POST /permits/{id}/approve"
      - "POST /permits/{id}/reject"
      - "GET reads"
  - name: BridgeEngineer
    description: "Performs bridge analysis and superload review."
    identity: opaque
    exclusive_operations:
      - "POST /bridge-analyses/{id}/review"
    shared_operations:
      - "POST /permits/{id}/begin-review"
      - "POST /permits/{id}/return"
      - "POST /permits/{id}/approve"
      - "POST /permits/{id}/reject"
      - "GET reads"
  - name: EnforcementOfficer
    description: "Issues and adjudicates violations."
    identity: opaque
    exclusive_operations:
      - "POST /violations"
      - "POST /violations/{id}/uphold"
      - "POST /violations/{id}/dismiss"
    shared_operations:
      - "GET reads"
  - name: DOTAdmin
    description: "Manages reference data (carriers, structures, pilot cars, restrictions, escrow) and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /carriers"
      - "POST /carriers/{id}/escrow-deposits"
      - "POST /structures"
      - "POST /pilot-cars"
      - "POST /travel-restrictions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads"
