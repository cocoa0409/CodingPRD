  - section: errors
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID fails ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /licensure/candidates/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with http status 401 (priority 1 beats existence 404)"
      - name: error_referential_before_state_on_submit
        claim_type: excluded_placeholder
        grounds: ["errors[ERR_SUPERVISOR_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / submit_conflict_referential_beats_constraint
          rationale: "Asserted as the winning error of the referential-vs-constraint dual failure."
      - name: error_retake_wait_on_schedule
        claim_type: excluded_placeholder
        grounds: ["errors[ERR_RETAKE_WAIT_NOT_ELAPSED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / schedule_conflict_state_beats_temporal
          rationale: "The retake rule is exercised as the losing (temporal) side of the dual failure and satisfied at its boundary in exam_division_fail_retake_cycle."
      - name: error_exam_day_conflict
        claim_type: excluded_placeholder
        grounds: ["errors[ERR_EXAM_DAY_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / exam_day_closed_interval_conflict
          rationale: "Same-day rejection and next-day success are both asserted there."
      - name: error_work_period_overlap
        claim_type: excluded_placeholder
        grounds: ["errors[ERR_WORK_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / work_period_half_open_adjacency
          rationale: "Half-open adjacency vs overlap rejection both asserted there."
      - name: error_certificate_not_active_on_transmittal
        claim_type: excluded_placeholder
        grounds: ["errors[ERR_CERTIFICATE_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / transmittal_requires_certificate_active
          rationale: "Asserted after the lapse sweep."
      - name: error_division_already_scheduled
        claim_type: excluded_placeholder
        grounds: ["errors[ERR_DIVISION_ALREADY_SCHEDULED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / schedule_conflict_state_beats_temporal
          rationale: "Asserted as the winning state-tier error."
