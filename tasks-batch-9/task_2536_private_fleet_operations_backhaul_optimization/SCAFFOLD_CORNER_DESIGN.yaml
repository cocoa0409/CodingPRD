              captures: { borrow_err: $.data.error_id }
            - call: "POST /fleet/trips/${trip_id}/assignments"
              payload: { driver_id: "${t1}", tractor_id: "${src_tractor}", trailer_id: "${tgt_trailer}" }
              as: TransportManager
              captures: { equip_err: $.data.error_id }
            - call: "POST /fleet/drivers/${t3}/termination"
              payload: { termination_reason: "VOLUNTARY_QUIT" }
              as: TransportManager
              captures: { t3_status: $.data.status }
            - call: "GET /fleet/domiciles/${tgt_id}"
              payload: {}
              as: TransportManager
              captures: { tgt_index_2: $.data.balance_index, tgt_count_2: $.data.assigned_driver_count }
            - call: "POST /fleet/trips/${trip_id}/assignments"
              payload: { driver_id: "${s1}", tractor_id: "${tgt_tractor}", trailer_id: "${tgt_trailer}" }
              as: TransportManager
              captures: { assigned_driver: $.data.driver_id }
            - call: "GET /fleet/domiciles/${src_id}"
              payload: {}
              as: TransportManager
              captures: { src_index_after: $.data.balance_index }
          assert:
            - "${src_count} == 3 and ${src_index} == 1.5 with ${tgt_index} == 1.0"
            - "${borrow_err} == ERR_DOMICILE_MISMATCH with HTTP 422 - the source qualifies inclusively but the target is not strictly below 1.0000"
            - "${equip_err} == ERR_DOMICILE_MISMATCH with HTTP 422 - the driver is local and eligible; it is the tractor that belongs to the wrong domicile, and no balance gate rescues equipment"
            - "${t3_status} == TERMINATED, then ${tgt_count_2} == 2 and ${tgt_index_2} == 0.6667 (2/3 rounded half-up to 4 places)"
            - "${assigned_driver} == ${s1} with HTTP 200 - the identical call now passes the borrow gate"
            - "${src_index_after} == 1.5 - lending a driver does not change the source's assigned_driver_count, which counts domicile membership rather than current work"

      - name: hos_and_rest_gap_violated_together_report_the_hos_code
        claim_type: Priority Conflict
        grounds:
          - errors.ERR_HOS_DUTY_LIMIT
          - errors.ERR_DRIVER_REST_GAP
        distinguishing_aspect: "The priority pair between the hours-of-service limits and the driver rest-gap rule is settled by the §1.8 instance below, which violates both in one assignment call."
        excluded_because:
          difficulty_instance: hos_duty_limit_beats_driver_rest_gap_when_both_are_violated
          rationale: "That instance stages a driver who both exceeds the daily duty limit and sits inside the 600-minute rest gap of a committed trip, asserts ERR_HOS_DUTY_LIMIT, and then relaxes only the duty counters to reveal ERR_DRIVER_REST_GAP underneath."

      - name: overlapping_deliveries_are_an_aggregate_not_a_pairwise_check
        claim_type: Aggregate Validation
        grounds:
          - errors.ERR_DOCK_CAPACITY_EXCEEDED
          - calculations.dock_capacity_occupancy
        distinguishing_aspect: "The dock-capacity rule is an aggregate: individually legal stops can collectively exceed the door count. The §1.8 instance below covers the boundary in both directions."
        excluded_because:
          difficulty_instance: store_dock_tolerates_overlap_up_to_the_door_count_and_ignores_adjacency
          rationale: "That instance plans two overlapping deliveries against a two-dock store (allowed), then a third overlapping delivery (ERR_DOCK_CAPACITY_EXCEEDED), and finally an exactly adjacent stop that is not an overlap at all."

      - name: a_future_shop_window_conflicts_with_an_already_committed_trip
        claim_type: Temporal Validation
        grounds:
          - errors.ERR_ASSET_MAINTENANCE_CONFLICT
          - calculations.asset_maintenance_conflict
        distinguishing_aspect: "The maintenance-conflict rule is bidirectional and buffered, so it is a temporal validation whose interesting case is an operation that is legal now and creates a future collision. The §1.8 instance below owns it."
        excluded_because:
          difficulty_instance: tractor_shop_window_collides_on_touch_across_a_120_minute_buffer
          rationale: "That instance tests the buffered interval from both directions - a work order proposed against a committed trip and a trip assigned against a scheduled work order - including the exactly-touching boundary at 120 minutes."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: the_expiration_sweep_skips_what_it_cannot_expire_and_unlinks_what_it_does
        claim_type: Bulk action
        grounds:
          - endpoints[POST /fleet/backhaul-offers/expiration-sweep]
          - state_machines[BackhaulOffer].transitions[PROPOSED->EXPIRED]
          - state_machines[BackhaulOffer].transitions[UNDER_REVIEW->EXPIRED]
        distinguishing_aspect: "The sweep is skip-not-fail: it retires every PROPOSED or UNDER_REVIEW offer whose expiry has passed, silently ignores an equally overdue REJECTED offer and an unexpired one, reports the affected ids in its own inline response shape, and unlinks the trips of the offers it did retire. Running it a second time is a no-op that still returns HTTP 200 with a zero count."
        test_recipe:
          setup:
            - "At clock 2026-08-01 four offers exist against store S-6001: OF-A (PROPOSED, expires 2026-08-05), OF-B (UNDER_REVIEW, expires 2026-08-05, linked to TRIP-E1), OF-C (PROPOSED, expires 2026-09-10) and OF-D (REJECTED, expires 2026-08-05)."
            - "TRIP-E1 is a DRAFT trip of DOM-E1 whose only reference to the backhaul market is its link to OF-B."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-E1", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom_id: $.data.id }
            - call: "POST /fleet/stores"
              payload: { store_code: "S-6001", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-E1", domicile_id: "${dom_id}", planned_start_at: "2026-08-20T06:00:00Z" }
              as: FleetPlanner
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "VENDOR_PICKUP", shipper_name: "Prairie Foods", origin_region_code: "MIDWEST", dest_store_id: "${store_id}", revenue_cents: 60000, cases: 500, weight_lbs: 11000, deadhead_miles: 40, loaded_miles: 160, temperature_mode: "DRY", pickup_window_start: "2026-08-03T12:00:00Z", pickup_window_end: "2026-08-03T20:00:00Z", offer_expires_at: "2026-08-05T00:00:00Z" }
              as: FleetPlanner
              captures: { offer_a: $.data.id }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "THIRD_PARTY", shipper_name: "Lakeshore Brokerage", origin_region_code: "MIDWEST", dest_store_id: "${store_id}", revenue_cents: 58000, cases: 400, weight_lbs: 9000, deadhead_miles: 30, loaded_miles: 150, temperature_mode: "DRY", pickup_window_start: "2026-08-03T12:00:00Z", pickup_window_end: "2026-08-03T20:00:00Z", offer_expires_at: "2026-08-05T00:00:00Z" }
              as: FleetPlanner
              captures: { offer_b: $.data.id }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "VENDOR_PICKUP", shipper_name: "Northline Mills", origin_region_code: "MIDWEST", dest_store_id: "${store_id}", revenue_cents: 61000, cases: 450, weight_lbs: 9900, deadhead_miles: 35, loaded_miles: 165, temperature_mode: "DRY", pickup_window_start: "2026-09-02T12:00:00Z", pickup_window_end: "2026-09-02T20:00:00Z", offer_expires_at: "2026-09-10T00:00:00Z" }
              as: FleetPlanner
              captures: { offer_c: $.data.id }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "THIRD_PARTY", shipper_name: "Cedar Freight", origin_region_code: "MIDWEST", dest_store_id: "${store_id}", revenue_cents: 45000, cases: 300, weight_lbs: 6600, deadhead_miles: 60, loaded_miles: 140, temperature_mode: "DRY", pickup_window_start: "2026-08-03T12:00:00Z", pickup_window_end: "2026-08-03T20:00:00Z", offer_expires_at: "2026-08-05T00:00:00Z" }
              as: FleetPlanner
              captures: { offer_d: $.data.id }
            - call: "POST /fleet/backhaul-offers/${offer_b}/submit-review"
              payload: {}
              as: FleetPlanner
            - call: "POST /fleet/backhaul-offers/${offer_d}/submit-review"
              payload: {}
              as: FleetPlanner
            - call: "POST /fleet/backhaul-offers/${offer_d}/reject"
              payload: { reason_code: "MARGIN_TOO_THIN" }
              as: TransportManager
              captures: { d_status: $.data.status }
            - call: "POST /fleet/trips/${trip_id}/backhaul-assignments"
              payload: { backhaul_offer_id: "${offer_b}", expected_trip_version: "${trip_v0}" }
              as: TransportManager
              captures: { linked_offer: $.data.backhaul_offer_id, linked_credit: $.data.backhaul_credit_cents }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: TransportManager
          trigger:
            - call: "POST /fleet/backhaul-offers/expiration-sweep"
              payload: {}
              as: TransportManager
              captures: { n1: $.data.expired_count, ids1: $.data.expired_offer_ids, trips1: $.data.unlinked_trip_ids }
            - call: "POST /fleet/backhaul-offers/expiration-sweep"
              payload: {}
              as: TransportManager
              captures: { n2: $.data.expired_count, ids2: $.data.expired_offer_ids, trips2: $.data.unlinked_trip_ids }
            - call: "GET /fleet/backhaul-offers/${offer_a}"
              payload: {}
              as: FleetPlanner
              captures: { a_status: $.data.status }
            - call: "GET /fleet/backhaul-offers/${offer_b}"
              payload: {}
              as: FleetPlanner
              captures: { b_status: $.data.status }
            - call: "GET /fleet/backhaul-offers/${offer_c}"
              payload: {}
              as: FleetPlanner
              captures: { c_status: $.data.status }
            - call: "GET /fleet/backhaul-offers/${offer_d}"
              payload: {}
              as: FleetPlanner
              captures: { d_status_after: $.data.status }
            - call: "GET /fleet/trips/${trip_id}"
              payload: {}
              as: TransportManager
              captures: { trip_offer_after: $.data.backhaul_offer_id, trip_credit_after: $.data.backhaul_credit_cents, trip_v_after: $.data.version }
            - call: "GET /fleet/backhaul-offers"
              payload: { status: "EXPIRED", limit: 10, offset: 0 }
              as: FleetPlanner
              captures: { first_expired: "$.data[0].id" }
          assert:
            - "${d_status} == REJECTED and ${linked_offer} == ${offer_b} with ${linked_credit} == 0 before the sweep runs"
            - "${n1} == 2 with ${ids1} containing exactly ${offer_a} and ${offer_b} - the overdue REJECTED offer is skipped rather than failing the batch"
            - "${trips1} contains exactly ${trip_id} - only trips that actually lost an offer are reported"
            - "${n2} == 0 with ${ids2} and ${trips2} both empty at HTTP 200 - the sweep is safely repeatable"
            - "${a_status} == EXPIRED and ${b_status} == EXPIRED - the sweep reaches both PROPOSED and UNDER_REVIEW"
            - "${c_status} == PROPOSED - 2026-09-10 is still in the future at the 2026-08-10 clock"
            - "${d_status_after} == REJECTED - a terminal offer is never re-terminated"
            - "${trip_offer_after} == null, ${trip_credit_after} == 0 and ${trip_v_after} > ${trip_v0} - the unlink is a real write on the trip"
            - "${first_expired} is one of the two swept ids and the status filter reports total_count 2"

      - name: the_pay_preview_is_a_pure_read_that_reconciles_with_the_persisted_statement
