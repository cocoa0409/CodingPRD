            - { call: "POST /servicing/escrow-accounts/${acct2_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan2_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/loans/${loan2_id}/insurance-policies", payload: { policy_type: "HAZARD", carrier_name: "Carrier C", policy_number: "POL-FP-2", coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", annual_premium_cents: 120000 }, as: InsuranceSpecialist, as_user_id: "is_1", captures: { pol2_id: $.data.id } }
            - { call: "POST /servicing/insurance-policies/${pol2_id}/report-lapse", payload: {}, as: InsuranceSpecialist, as_user_id: "is_1" }
