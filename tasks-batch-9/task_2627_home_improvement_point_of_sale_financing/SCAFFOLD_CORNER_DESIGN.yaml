# =============================================================================
# §1.9 Scaffold Corner Design — BREADTH probe for
# task_2627_home_improvement_point_of_sale_financing
#
# Walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Every instance either carries a fully executable test_recipe or an
# `excluded_because:` stub naming the SCAFFOLD_DIFFICULTY_DESIGN.yaml instance
# that already asserts the corner.
#
# Fixture conventions shared by every recipe below (the same canonical fixture
# the §1.8 file uses, so the two files never disagree):
#   - logical clock starts at 2026-08-01T00:00:00Z (§1.5 mandatory default)
#   - TradeRule ROOFING: max_ticket 5000000, holdback 500 bps,
#     max_precompletion_release 7000 bps, velocity_cap 15000000,
#     requires_completion_certificate true, min_license_months 6
#   - PromotionPlan DI12-ROOF: DEFERRED_INTEREST, 12 months, 2699/2699 bps,
#     merchant_discount 525 bps, ticket band 100000..5000000,
#     disclosure template DI-2026.2, trades [ROOFING, GENERAL_REMODEL]
#   - Merchant "Summit Roofing LLC" ROOFING/TX, licence TX-RCF-88120
#     2026-01-01 -> 2027-06-30, enrollment window 2026-08-01..2026-12-31 with
#     negotiated_discount_bps 449
#   - Consumer "Dana Ruiz" ssn_last4 4417, income 9600000, FICO 742 -> tier T2
#     (4500 bps / 5000000 cap) -> approved_limit 4320000, dti 3646,
#     offer_expires_at 2026-08-15T00:00:00Z
#   - operator X-User-IDs: pa-1 (ProgramAdmin), uw-1 (ProgramUnderwriter),
#     ra-1 (RiskAnalyst), sa-1 / sa-2 (ServicingAgent)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES (claim-extraction-guide Table 1 + flat topology rows)
  # ===========================================================================
  - section: entities
    instances:

      - name: trade_rule_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.TradeRule
          - endpoints[POST /trade-rules]
        distinguishing_aspect: "POST /trade-rules with all seven input fields returns 201 and echoes every §1.1 TradeRule field plus the common id/created_at/version envelope."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "GET /trade-rules"
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", max_ticket_cents: 5000000, holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { tr_id: "$.data.id" }
          assert:
            - "HTTP status is 201 and the envelope is { success: true, data: {...} } with no error key"
            - "TradeRule.${tr_id}.trade_type == ROOFING"
            - "TradeRule.${tr_id}.max_ticket_cents == 5000000"
            - "TradeRule.${tr_id}.holdback_pct_bps == 500"
            - "TradeRule.${tr_id}.max_precompletion_release_bps == 7000"
            - "TradeRule.${tr_id}.velocity_cap_cents == 15000000"
            - "TradeRule.${tr_id}.requires_completion_certificate == true"
            - "TradeRule.${tr_id}.min_license_months == 6"
            - "TradeRule.${tr_id}.version == 1 and id and created_at are present (common_fields: true)"
            - "The pre-create GET /trade-rules returned total_count == 0, so the row is genuinely new"

      - name: merchant_retrieval_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds:
          - entities.Merchant
          - endpoints[GET /merchants/{id}]
        distinguishing_aspect: "GET /merchants/{id} on a freshly registered DRAFT merchant returns the four input fields verbatim and every computed portfolio field at its declared default."
        test_recipe:
          setup:
            - "One merchant registered by ProgramAdmin, nothing else in the database."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_id: "$.data.id" }
          trigger:
            - call: "GET /merchants/${merch_id}"
              as: ProgramUnderwriter
              as_user_id: "uw-1"
          assert:
            - "HTTP status is 200"
            - "Merchant.${merch_id}.legal_name == Summit Roofing LLC and trade_type == ROOFING and state_code == TX and contact_email == ops@summitroof.example"
            - "Merchant.${merch_id}.enrollment_status == DRAFT"
            - "Merchant.${merch_id}.approved_by_user_id is null and approved_on is null and suspension_reason_code is null and termination_reason_code is null"
            - "Merchant.${merch_id}.funded_volume_cents == 0, holdback_reserve_cents == 0, holdback_target_cents == 0, reserve_coverage_bps == 10000"
            - "Merchant.${merch_id}.settlement_offset_receivable_cents == 0 and program_write_off_cents == 0"
            - "Merchant.${merch_id}.dispute_rate_bps == 0, delinquency_rate_bps == 0, phantom_risk_score == 0"
            - "Merchant.${merch_id}.portfolio_grade == A, risk_tier == STANDARD, termination_recommended == false"
            - "Merchant.${merch_id}.version == 1"

      - name: merchant_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Merchant
          - endpoints[GET /merchants]
        distinguishing_aspect: "With exactly three merchants stored, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Three merchants registered: two ROOFING and one HVAC, all still DRAFT."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_a: "$.data.id" }
            - call: "POST /merchants"
              payload: { legal_name: "Bluebonnet Exteriors LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ap@bluebonnet.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_b: "$.data.id" }
            - call: "POST /merchants"
              payload: { legal_name: "Lone Star Comfort Air", trade_type: "HVAC", state_code: "TX", contact_email: "svc@lonestarair.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_c: "$.data.id" }
          trigger:
            - call: "GET /merchants?limit=2&offset=0"
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "GET /merchants?limit=2&offset=2"
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "GET /merchants?trade_type=HVAC"
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "PAGE 1: len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "PAGE 2: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "The union of the two pages' ids equals {${merch_a}, ${merch_b}, ${merch_c}} with no duplicate id across pages"
            - "FILTERED: GET /merchants?trade_type=HVAC returns total_count == 1 and data[0].id == ${merch_c}"
            - "The filtered call's has_more == false and every returned row has trade_type == HVAC"

      - name: merchant_retrieval_of_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_MERCHANT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "A GET /merchants/{id} for an id that was never minted returns ERR_MERCHANT_NOT_FOUND with HTTP 404, not an empty 200 envelope."
        test_recipe:
          setup:
            - "One real merchant exists so the collection is non-empty; the probed id is a syntactically valid but unused identifier."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_id: "$.data.id" }
          trigger:
            - call: "GET /merchants/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "HTTP status is 404 and the envelope is { success: false, error: { code: ERR_MERCHANT_NOT_FOUND, message: ... } } with no data key"
            - "GET /merchants/${merch_id} still returns 200, so the 404 is specific to the unknown id"

      - name: promotion_plan_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /promotion-plans]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /promotion-plans omitting disclosure_template_version — an input field with no default — returns ERR_INVALID_REQUEST (400) and persists nothing."
        test_recipe:
          setup:
            - "Empty database; the plan collection is empty before and must remain empty after."
          setup_api_calls:
            - call: "GET /promotion-plans"
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /promotion-plans"
              payload: { code: "DI12-ROOF", promotion_type: "DEFERRED_INTEREST", promo_term_months: 12, deferred_apr_bps: 2699, post_promo_apr_bps: 2699, merchant_discount_bps: 525, min_ticket_cents: 100000, max_ticket_cents: 5000000, allowed_trade_types: ["ROOFING", "GENERAL_REMODEL"] }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /promotion-plans"
              payload: { code: "DI12-ROOF", promotion_type: "DEFERRED_INTEREST", promo_term_months: 12, deferred_apr_bps: 2699, post_promo_apr_bps: 2699, merchant_discount_bps: 525, min_ticket_cents: 100000, disclosure_template_version: "DI-2026.2", allowed_trade_types: ["ROOFING", "GENERAL_REMODEL"] }
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "TRIGGER 1 (no disclosure_template_version): HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "TRIGGER 2 (no max_ticket_cents): HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /promotion-plans still reports total_count == 0 — a rejected create writes no row"

      - name: defaults_applied_when_optional_fields_are_omitted
        claim_type: defaults
        grounds:
          - entities.ProjectMilestone.fields.requires_consumer_signoff
          - entities.MerchantLicense.fields.verification_status
          - entities.MerchantPromotionEnrollment.fields.negotiated_discount_bps
          - endpoints[POST /projects/{id}/milestones]
        distinguishing_aspect: "Omitting requires_consumer_signoff on a milestone yields true (the §1.1 default), a newly filed licence lands UNVERIFIED, and an enrollment created without negotiated_discount_bps stores null so the FINAL discount falls back to the plan rate."
        test_recipe:
          setup:
            - "Full program fixture through an ACTIVATED application and an open project (contract 3500000)."
            - "A second, touching licence window 2027-06-30 -> 2028-06-30 is filed but never verified."
          setup_api_calls:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", max_ticket_cents: 5000000, holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /promotion-plans"
              payload: { code: "DI12-ROOF", promotion_type: "DEFERRED_INTEREST", promo_term_months: 12, deferred_apr_bps: 2699, post_promo_apr_bps: 2699, merchant_discount_bps: 525, min_ticket_cents: 100000, max_ticket_cents: 5000000, disclosure_template_version: "DI-2026.2", allowed_trade_types: ["ROOFING", "GENERAL_REMODEL"] }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { plan_id: "$.data.id" }
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses"
              payload: { trade_type: "ROOFING", license_number: "TX-RCF-88120", state_code: "TX", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses/${lic_id}/verification"
              payload: { outcome: "VERIFIED", verification_note: "State board record matched" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/enrollment-submission"
              payload: { attestation_ref: "ATT-2026-0801" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /merchants/${merch_id}/enrollment-decision"
              payload: { decision: "APPROVE", decision_note: "Licence verified" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/promotion-enrollments"
              payload: { promotion_plan_id: "${plan_id}", window_start_date: "2026-08-01", window_end_date: "2026-12-31", negotiated_discount_bps: 449 }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
              captures: { enr_id: "$.data.id" }
            - call: "POST /consumers"
              payload: { full_name: "Dana Ruiz", ssn_last4: "4417", annual_income_cents: 9600000, fico_score: 742, state_code: "TX" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { merchant_id: "${merch_id}", consumer_id: "${cons_id}", promotion_plan_id: "${plan_id}", project_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { app_id: "$.data.id" }
            - call: "POST /credit-applications/${app_id}/disclosure-delivery"
              payload: { disclosure_template_version: "DI-2026.2" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /credit-applications/${app_id}/disclosure-acknowledgement"
              payload: { consumer_signature_ref: "SIG-DANA-1" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /credit-applications/${app_id}/acceptance"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "GET /loan-accounts?application_id=${app_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_id: "$.data[0].id" }
            - call: "POST /projects"
              payload: { application_id: "${app_id}", scope_description: "Full roof replacement, 32 squares", contract_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { proj_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses"
              payload: { trade_type: "ROOFING", license_number: "TX-RCF-99001", state_code: "TX", effective_from: "2027-06-30", expires_on: "2028-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic2_id: "$.data.id" }
          trigger:
            - call: "POST /projects/${proj_id}/milestones"
              payload: { sequence_no: 1, name: "Tear-off and deck inspection", release_pct_bps: 3000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { ms_default_id: "$.data.id" }
          assert:
            - "ProjectMilestone.${ms_default_id}.requires_consumer_signoff == true (default applied, not false)"
            - "ProjectMilestone.${ms_default_id}.status == PENDING, rejection_count == 0, is_funded == false, claimed_at is null, verified_at is null"
            - "MerchantLicense.${lic2_id}.verification_status == UNVERIFIED and verified_by_user_id is null and verified_on is null"
            - "MerchantPromotionEnrollment.${enr_id}.status == ACTIVE (default) and negotiated_discount_bps == 449 (supplied, so no fallback)"
            - "Project.${proj_id}.completion_status == IN_PROGRESS, verified_release_bps == 0, settled_funded_cents == 0, funded_pct_bps == 0, max_fundable_now_cents == 0, disputed_amount_cents == 0"

      - name: computed_decision_fields_are_absent_from_the_input_contract
        claim_type: computed_fields
        grounds:
          - entities.CreditApplication.fields.decision
          - entities.CreditApplication.fields.approved_limit_cents
          - entities.CreditApplication.fields.decision_dti_bps
          - calculations.instant_credit_decision
          - endpoints[POST /credit-applications]
        distinguishing_aspect: "POST /credit-applications accepts exactly four input fields; decision, approved_limit_cents, decision_dti_bps, decision_reason_codes and offer_expires_at are all computed server-side from calculations.instant_credit_decision and can therefore never be dictated by the caller."
        test_recipe:
          setup:
            - "Program fixture with an ACTIVE enrollment; Consumer Dana Ruiz (FICO 742, income 9600000, no existing program debt); clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", max_ticket_cents: 5000000, holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /promotion-plans"
              payload: { code: "DI12-ROOF", promotion_type: "DEFERRED_INTEREST", promo_term_months: 12, deferred_apr_bps: 2699, post_promo_apr_bps: 2699, merchant_discount_bps: 525, min_ticket_cents: 100000, max_ticket_cents: 5000000, disclosure_template_version: "DI-2026.2", allowed_trade_types: ["ROOFING", "GENERAL_REMODEL"] }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { plan_id: "$.data.id" }
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses"
              payload: { trade_type: "ROOFING", license_number: "TX-RCF-88120", state_code: "TX", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses/${lic_id}/verification"
              payload: { outcome: "VERIFIED", verification_note: "State board record matched" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/enrollment-submission"
              payload: { attestation_ref: "ATT-2026-0801" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /merchants/${merch_id}/enrollment-decision"
              payload: { decision: "APPROVE", decision_note: "Licence verified" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/promotion-enrollments"
              payload: { promotion_plan_id: "${plan_id}", window_start_date: "2026-08-01", window_end_date: "2026-12-31", negotiated_discount_bps: 449 }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
              captures: { enr_id: "$.data.id" }
            - call: "POST /consumers"
              payload: { full_name: "Dana Ruiz", ssn_last4: "4417", annual_income_cents: 9600000, fico_score: 742, state_code: "TX" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { cons_id: "$.data.id" }
          trigger:
            - call: "POST /credit-applications"
              payload: { merchant_id: "${merch_id}", consumer_id: "${cons_id}", promotion_plan_id: "${plan_id}", project_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { app_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "CreditApplication.${app_id}.decision == APPROVED (computed at STEP 5 of instant_credit_decision, not supplied)"
            - "CreditApplication.${app_id}.approved_limit_cents == 4320000 (the credit LINE min(round_half_up(9600000*4500/10000), 5000000), not the 3500000 ticket)"
            - "CreditApplication.${app_id}.decision_dti_bps == 3646"
            - "CreditApplication.${app_id}.decision_reason_codes == [WITHIN_LIMIT]"
            - "CreditApplication.${app_id}.offer_expires_at == 2026-08-15T00:00:00Z (clock + OFFER_VALIDITY_DAYS 14)"
            - "CreditApplication.${app_id}.disclosure_status == NOT_SENT, disclosure_delivered_at is null, promo_disclosure_summary is null"
            - "The §1.5 input contract for POST /credit-applications lists only [merchant_id, consumer_id, promotion_plan_id, project_amount_cents] — none of the five computed fields above is an accepted input"

      - name: system_fields_are_server_minted_and_taken_from_the_path
        claim_type: system_fields
        grounds:
          - entities.MerchantLicense.fields.merchant_id
          - entities.Merchant.fields.enrollment_status
          - endpoints[POST /merchants/{id}/licenses]
        distinguishing_aspect: "MerchantLicense.merchant_id is source: system and is taken from the path — the licence body never carries it — while id, created_at and version are minted by the server on every write."
        test_recipe:
          setup:
            - "Two merchants registered; the licence is filed under the first one's path."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_a: "$.data.id" }
            - call: "POST /merchants"
              payload: { legal_name: "Bluebonnet Exteriors LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ap@bluebonnet.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_b: "$.data.id" }
          trigger:
            - call: "POST /merchants/${merch_a}/licenses"
              payload: { trade_type: "ROOFING", license_number: "TX-RCF-88120", state_code: "TX", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_a}"
              captures: { lic_id: "$.data.id" }
          assert:
            - "MerchantLicense.${lic_id}.merchant_id == ${merch_a} even though the payload never carried merchant_id"
            - "MerchantLicense.${lic_id}.merchant_id != ${merch_b}"
            - "MerchantLicense.${lic_id}.id, created_at and version are present with version == 1"
            - "MerchantLicense.${lic_id}.verification_status == UNVERIFIED (system-defaulted, not an input)"
            - "Merchant.${merch_a}.id != Merchant.${merch_b}.id and both were minted by the server (POST /merchants input is only [legal_name, trade_type, state_code, contact_email])"
            - "Merchant.${merch_a}.enrollment_status == DRAFT and Merchant.${merch_a}.version == 1 — filing a licence does not bump the merchant"

      - name: type_constraints_reject_bad_enums_negative_money_and_empty_intervals
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: "An out-of-set enum, a negative money amount and a zero-income consumer all return ERR_INVALID_REQUEST at priority 3, while a licence whose effective_from equals expires_on describes an empty half-open interval and returns ERR_INVALID_DATE_RANGE at priority 4."
        test_recipe:
          setup:
            - "One merchant registered so the licence path resolves."
          setup_api_calls:
