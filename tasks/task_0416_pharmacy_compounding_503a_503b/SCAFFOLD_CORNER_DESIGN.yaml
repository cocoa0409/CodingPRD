        excluded_because:
          difficulty_instance: transitive_cascade / recall_cascade_batch_to_prep_to_prescription_depth3
          rationale: "The release-to-QC_RELEASED side effect and version bump are setup preconditions exercised and observed by the recall-cascade difficulty instance, which releases then dispenses the QC_RELEASED preps."

