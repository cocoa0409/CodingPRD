        grounds:
          - validations[priority=18]
          - errors[ERR_APPLICATOR_ROUTE_CONFLICT]
          - constants.ROUTE_SETUP_BUFFER_MINUTES
          - entities.Applicator.fields.assigned_route_count
        distinguishing_aspect: |
          Overlap rule #1 occupies the APPLICATOR resource with HALF-OPEN intervals
          extended by a 45-minute trailing turnaround: against a COMMITTED route
          [09:00, 12:00) the occupancy runs to 12:45 exclusive, so a route starting at
          12:44 is refused with ERR_APPLICATOR_ROUTE_CONFLICT while a route starting at
          exactly 12:45 is accepted because the comparison is strict `<`.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with a CONFIRMED assessment of index 0.00 (NORMAL posture, so no posture gate applies to a LARVICIDE plan)."
