  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: shipment_state_check_beats_label_safety_check
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_ORDER_NOT_COMPLETE]
          - errors[ERR_LABEL_NOT_ACTIVE]
        distinguishing_aspect: |
          Category pair state (priority 5) vs business_safety (priority 6): the order
          is QC_HOLD (not COMPLETE) AND no ACTIVE label exists for its destination
          state; the dual-failure shipment create must return ERR_ORDER_NOT_COMPLETE,
          proving the state check runs before the regulatory label check.
        test_recipe:
          setup:
            - "Order reached QC_PENDING with ACTIVE CA label, then the flammability cert was revoked: cascade superseded the label and moved the order to QC_HOLD"
