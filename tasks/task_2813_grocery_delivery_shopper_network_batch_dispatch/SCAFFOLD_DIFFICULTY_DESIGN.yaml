              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i3: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Dana Ortiz", card_last4: "4242" }
              as: CustomerSupport
              captures: { c1: $.data.id }
            - call: "POST /shoppers"
              payload: { display_name: "Sam Reyes", service_area_code: "SF-01", vehicle_capacity_units: 10 }
              as: DispatchAdmin
              captures: { s1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1}", retailer_id: "${r1}", delivery_distance_mi: 4.0, delivery_deadline: "2026-08-01T11:00:00Z", ebt_requested: false, tip_amount_cents: 0 }
              as: Customer
              as_user_id: "${c1}"
              captures: { o3: $.data.id }
            - call: "POST /orders/${o3}/lines"
              payload: { catalog_item_id: "${i1}", requested_qty: 1 }
              as: Customer
              as_user_id: "${c1}"
              captures: { k1: $.data.id }
            - call: "POST /orders/${o3}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /batches"
              payload: { service_area_code: "SF-01", shop_window_start: "2026-08-01T08:00:00Z", shop_window_end: "2026-08-01T11:00:00Z", tier_access_floor: "PROBATION" }
              as: DispatchAdmin
              captures: { b3: $.data.id, b3_v: $.data.version }
            - call: "POST /batches/${b3}/orders"
              payload: { order_id: "${o3}", expected_batch_version: "${b3_v}" }
              as: DispatchAdmin
            - call: "POST /batches/${b3}/dispatch"
              payload: {}
              as: DispatchAdmin
            - call: "POST /batches/${b3}/claim"
              payload: {}
              as: Shopper
              as_user_id: "${s1}"
