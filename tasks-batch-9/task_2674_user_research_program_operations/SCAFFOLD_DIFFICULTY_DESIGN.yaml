          - state_machines.Recruitment.incentive_state.RESERVED_to_PAID
          - concurrency_rules[settlement-run-stale-pool]
        distinguishing_aspect: |
          This dual variant lives in the incentive-money domain on ParticipantPool and Recruitment,
          not on Finding: the same recruitment set yields a 15250-cent FORWARD_ESTIMATE (every open
          reservation assumed to be paid in full, SCREENED_OUT rows ignored, no row mutated) and a
          5200-cent CHRONOLOGICAL_ACTUAL payout (COMPLETED paid in full, SCREENED_OUT paid the
