# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3394_veteran_program_enrollment_benefits_navigation_outcome_measurement
# 9 rules x 2 instances = 18 instances. Every setup chain replays against
# SCAFFOLD.yaml §1.2/§1.4/§1.6; all formula-derived asserts are precomputed literals.
# Logical clock default at startup: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: claim_compensation_provisional_vs_final
        grounds:
          - calculations.compensation_monthly
          - state_machines.BenefitsClaim.FILED_to_DECIDED
          - entities.BenefitsClaim.fields.provisional_monthly_cents
          - entities.BenefitsClaim.fields.final_monthly_cents
        distinguishing_aspect: |
          This dual-variant pair lives on the BENEFITS CLAIM (fiscal) domain — a filing-time
          estimate versus a decision-time award on one BenefitsClaim — whereas the other
          instance (donor_report_itt_vs_completer) lives on the outcome-measurement domain.
          Identical claim data yields 166100 provisionally and 140118 finally.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One VERIFIED veteran with a FILED disability claim (claimed rating 70, 2 dependents)."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Alex Rivera", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/claims"
              payload: { member_id: "${m_id}", claim_type: "DISABILITY_COMPENSATION", claimed_rating_pct: 70, dependent_count: 2 }
              as: AccreditedRepresentative
              captures: { claim_id: "$.data.id", claim_provisional: "$.data.provisional_monthly_cents" }
          trigger:
            - call: "POST /veteran-services/claims/${claim_id}/decide"
              payload: { outcome: "GRANTED", decided_rating_pct: 50 }
              as: BenefitsOfficer
              as_user_id: "officer-a"
              captures: { claim_final: "$.data.final_monthly_cents" }
          assert:
            - "claim_provisional == 166100 (RATING_BASE_CENTS[70]; no COLA, no dependents at filing)"
            - "claim_final == 140118 (round_half_up((105700 + 31000) * 1.025) = round_half_up(140117.5))"
            - "claim_final != claim_provisional on identical claim data"
            - "BenefitsClaim.${claim_id}.status == DECIDED and decided_by_officer_id == \"officer-a\""
            - "GET /veteran-services/members/${m_id} reports total_monthly_compensation_cents == 140118"

      - name: donor_report_itt_vs_completer
        grounds:
          - calculations.program_effect_reporting
          - calculations.survey_window_schedule
          - entities.DonorReport.fields.overall_effect
          - state_machines.OutcomeSurvey.OPEN_to_EXPIRED
        distinguishing_aspect: |
          This dual-variant pair lives on the OUTCOME MEASUREMENT domain — two donor-report
          methodologies over one fixed cohort — whereas claim_compensation_provisional_vs_final
          lives on the benefits-claim domain. ITT imputes the missing EXIT wave at the member's
          baseline (delta 0) giving 12.00; COMPLETER drops that member giving 24.00.
        test_recipe:
          setup:
            - "Clock choreography below. Track MENTAL_HEALTH capacity 10. Two VERIFIED veterans m1, m2, each with a COMPLETED enrollment exiting 2026-10-01T00:00:00Z. m1 submitted BASELINE (score 56) and EXIT (score 80); m2 submitted BASELINE (score 40) only, and m2's EXIT wave is EXPIRED."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 10 }
              as: PlatformAdmin
              captures: { trk_mh: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Member One", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "NAVY" }
              as: IntakeCoordinator
              captures: { m1_id: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m1_id}", expected_member_version: "${m1_v}" }
              as: IntakeCoordinator
              captures: { c1: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${c1}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/members"
              payload: { full_name: "Member Two", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m2_id: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m2_id}", expected_member_version: "${m2_v}" }
              as: IntakeCoordinator
              captures: { c2: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${c2}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m1_id}", program_track_id: "${trk_mh}" }
              as: IntakeCoordinator
              captures: { e1: "$.data.id" }
            - call: "POST /veteran-services/enrollments/${e1}/assessments"
              payload: { psych_score: 5, phys_score: 5, voc_score: 5, soc_score: 5 }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m2_id}", program_track_id: "${trk_mh}" }
              as: IntakeCoordinator
              captures: { e2: "$.data.id" }
            - call: "POST /veteran-services/enrollments/${e2}/assessments"
              payload: { psych_score: 5, phys_score: 5, voc_score: 5, soc_score: 5 }
              as: IntakeCoordinator
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /veteran-services/enrollments/${e1}/surveys"
              payload: { wave: "BASELINE" }
              as: OutcomeAnalyst
              captures: { sv1_base: "$.data[0].id" }
            - call: "POST /veteran-services/surveys/${sv1_base}/submit"
              payload: { q1: 3, q2: 3, q3: 2, q4: 3, q5: 3 }
              as: ProgramMember
              as_user_id: "${m1_id}"
            - call: "GET /veteran-services/enrollments/${e2}/surveys"
              payload: { wave: "BASELINE" }
              as: OutcomeAnalyst
              captures: { sv2_base: "$.data[0].id" }
            - call: "POST /veteran-services/surveys/${sv2_base}/submit"
              payload: { q1: 2, q2: 2, q3: 2, q4: 2, q5: 2 }
              as: ProgramMember
              as_user_id: "${m2_id}"
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/enrollments/${e1}/transition"
              payload: { target_status: "COMPLETED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments/${e2}/transition"
              payload: { target_status: "COMPLETED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /veteran-services/enrollments/${e1}/surveys"
              payload: { wave: "EXIT" }
              as: OutcomeAnalyst
              captures: { sv1_exit: "$.data[0].id" }
            - call: "POST /veteran-services/surveys/${sv1_exit}/submit"
              payload: { q1: 5, q2: 4, q3: 4, q4: 3, q5: 4 }
              as: ProgramMember
              as_user_id: "${m1_id}"
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /veteran-services/donor-reports"
              payload: { period_start: "2026-09-15T00:00:00Z", period_end: "2026-10-15T00:00:00Z", methodology: "ITT" }
              as: OutcomeAnalyst
              captures: { rep_itt: "$.data.overall_effect" }
            - call: "POST /veteran-services/donor-reports"
              payload: { period_start: "2026-09-15T00:00:00Z", period_end: "2026-10-15T00:00:00Z", methodology: "COMPLETER" }
              as: OutcomeAnalyst
              captures: { rep_comp: "$.data.overall_effect" }
          assert:
            - "rep_itt == 12.00 — m1 delta +24 plus m2 imputed delta 0 over a cohort of 2"
            - "rep_comp == 24.00 — only m1 has both waves submitted"
            - "the ITT report per_track entry for MENTAL_HEALTH has cohort_size == 2; the COMPLETER report's == 1"
            - "rep_itt != rep_comp on identical underlying survey data"

  - rule_id: combinatorial_formula
    instances:
      - name: acuity_weighted_branching_by_member_type
        grounds:
          - calculations.acuity_scoring
          - entities.Assessment.fields.acuity_score
          - entities.Enrollment.fields.intensity_tier
        distinguishing_aspect: |
          Mode (a): a >= 3-input formula whose weights switch on the owning Member's
          member_type branch. Identical scores (9,3,5,6) yield acuity 61 / ENHANCED for a
          VETERAN but 70 / INTENSIVE for a FAMILY_SUPPORT member — a tier flip caused
          purely by the conditional branch. The other instance
          (compensation_cola_per_claim_rounding) is mode (b) nested rounding.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. MENTAL_HEALTH track capacity 10. Two VERIFIED members: veteran A and family-support member B, each holding an INTAKE enrollment."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 10 }
              as: PlatformAdmin
              captures: { trk_mh: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Vet A", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "MARINES" }
              as: IntakeCoordinator
              captures: { a_id: "$.data.id", a_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${a_id}", expected_member_version: "${a_v}" }
              as: IntakeCoordinator
              captures: { c_a: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${c_a}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/members"
              payload: { full_name: "Fam B", member_type: "FAMILY_SUPPORT", service_era_claimed: "POST_911", injury_connection_claimed: "NON_SERVICE_CONNECTED" }
              as: IntakeCoordinator
              captures: { b_id: "$.data.id", b_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${b_id}", expected_member_version: "${b_v}" }
              as: IntakeCoordinator
              captures: { c_b: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${c_b}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "NON_SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${a_id}", program_track_id: "${trk_mh}" }
              as: IntakeCoordinator
              captures: { e_a: "$.data.id" }
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${b_id}", program_track_id: "${trk_mh}" }
              as: IntakeCoordinator
              captures: { e_b: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/enrollments/${e_a}/assessments"
              payload: { psych_score: 9, phys_score: 3, voc_score: 5, soc_score: 6 }
              as: IntakeCoordinator
              captures: { ac_a: "$.data.acuity_score", tier_a: "$.data.tier_result" }
            - call: "POST /veteran-services/enrollments/${e_b}/assessments"
              payload: { psych_score: 9, phys_score: 3, voc_score: 5, soc_score: 6 }
              as: IntakeCoordinator
              captures: { ac_b: "$.data.acuity_score", tier_b: "$.data.tier_result" }
          assert:
            - "ac_a == 61 (10 * (0.4*9 + 0.3*3 + 0.2*5 + 0.1*6)) and tier_a == ENHANCED"
            - "ac_b == 70 (10 * (0.5*9 + 0.1*3 + 0.2*5 + 0.2*6)) and tier_b == INTENSIVE (70 >= ACUITY_TIER_INTENSIVE_MIN is inclusive)"
            - "identical four scores produce different acuity and different tiers purely from member_type"
            - "both enrollments are now ACTIVE with intensity_tier ENHANCED and INTENSIVE respectively"

      - name: compensation_cola_per_claim_rounding
        grounds:
          - calculations.compensation_monthly
          - entities.Member.fields.total_monthly_compensation_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — each claim's final award is rounded to whole
          cents BEFORE the member-level sum (pinned). Two claims decided at rating 10 round
          to 17938 each, so the member total is 35876; a sum-then-round implementation
          produces round_half_up(35875.0) == 35875. The other instance
          (acuity_weighted_branching_by_member_type) is mode (a).
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One VERIFIED veteran with two FILED disability claims, each claimed rating 10 with 0 dependents."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Cola Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/claims"
              payload: { member_id: "${m_id}", claim_type: "DISABILITY_COMPENSATION", claimed_rating_pct: 10, dependent_count: 0 }
              as: AccreditedRepresentative
              captures: { k1: "$.data.id" }
            - call: "POST /veteran-services/claims"
              payload: { member_id: "${m_id}", claim_type: "DISABILITY_COMPENSATION", claimed_rating_pct: 10, dependent_count: 0 }
              as: AccreditedRepresentative
              captures: { k2: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/claims/${k1}/decide"
              payload: { outcome: "GRANTED", decided_rating_pct: 10 }
              as: BenefitsOfficer
              as_user_id: "officer-a"
              captures: { f1: "$.data.final_monthly_cents" }
            - call: "POST /veteran-services/claims/${k2}/decide"
              payload: { outcome: "GRANTED", decided_rating_pct: 10 }
              as: BenefitsOfficer
              as_user_id: "officer-a"
              captures: { f2: "$.data.final_monthly_cents" }
          assert:
            - "f1 == 17938 (round_half_up(17500 * 1.025) = round_half_up(17937.5))"
            - "f2 == 17938"
            - "GET /veteran-services/members/${m_id} reports total_monthly_compensation_cents == 35876 (17938 + 17938, per-claim rounding first)"
            - "35876 != 35875, the result of summing unrounded values (35875.0) and rounding once"

  - rule_id: non_linear_state_machine
    instances:
      - name: member_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Member.verification_status
          - state_machines.Member.engagement_status
          - calculations.engagement_status_derivation
        distinguishing_aspect: |
          Member carries two INDEPENDENT state dimensions (verification_status x
          engagement_status) on one row — a parallel-dimensions machine — whereas the other
          instance (eligibility_pend_resume_cycle) is a revision cycle on EligibilityCase.
          Verification transitions never touch engagement and vice versa.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. MENTAL_HEALTH track exists. One member registered (UNVERIFIED / INACTIVE)."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 5 }
              as: PlatformAdmin
              captures: { trk_mh: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Parallel Member", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "AIR_FORCE" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "${trk_mh}" }
              as: IntakeCoordinator
              captures: { e_id: "$.data.id" }
            - call: "POST /veteran-services/enrollments/${e_id}/assessments"
              payload: { psych_score: 5, phys_score: 5, voc_score: 5, soc_score: 5 }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments/${e_id}/transition"
              payload: { target_status: "COMPLETED" }
              as: IntakeCoordinator
          assert:
            - "at creation: verification_status == UNVERIFIED and engagement_status == INACTIVE"
            - "after the VERIFIED decision: verification_status == VERIFIED while engagement_status == INACTIVE (verification moved alone)"
            - "after enrollment creation: engagement_status == ENGAGED while verification_status == VERIFIED (engagement moved alone)"
            - "after the enrollment COMPLETED exit: engagement_status == GRADUATED while verification_status == VERIFIED"
            - "GET /veteran-services/members/${m_id} after each step shows the untouched dimension byte-identical"

      - name: eligibility_pend_resume_cycle
        grounds:
          - state_machines.EligibilityCase
          - validations[priority=7]
        distinguishing_aspect: |
          EligibilityCase runs a revision CYCLE (UNDER_REVIEW -> PENDED -> UNDER_REVIEW,
          repeatable) on the EligibilityCase entity — whereas the other instance is
          parallel dimensions on Member. Two full pend/resume loops precede the decision.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One member with an UNDER_REVIEW eligibility case."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Cycle Member", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "PENDED", pend_reason: "awaiting DD-214" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "UNDER_REVIEW" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "PENDED", pend_reason: "awaiting medical nexus letter" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "UNDER_REVIEW" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
              captures: { case_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "PENDED", pend_reason: "too late" }
              as: IntakeCoordinator
              captures: { err_terminal: "$.data.error_id" }
          assert:
            - "the four pend/resume calls return status PENDED, UNDER_REVIEW, PENDED, UNDER_REVIEW in order"
            - "the fifth call returns VERIFIED and case_v == 6 (creation version 1 plus five transitions)"
            - "EligibilityCase.${case_id}.pend_reason == \"awaiting medical nexus letter\" (the latest pend wins)"
            - "err_terminal == ERR_INVALID_STATE — VERIFIED is terminal, the cycle cannot re-open"
            - "GET /veteran-services/members/${m_id} reports verification_status == VERIFIED"

  - rule_id: transitive_cascade
    instances:
      - name: appeal_overturned_cascade
        grounds:
          - state_machines.Appeal.OPEN_to_DECIDED
          - state_machines.BenefitsClaim.APPEAL_PENDING_to_DECIDED
          - calculations.compensation_monthly
          - entities.Member.fields.total_monthly_compensation_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by an APPEAL DECISION: appeal decide (OVERTURNED)
          mutates the claim's rating, that rating mutation recomputes the claim's
          final_monthly_cents, and that recomputation re-aggregates the member's
          total_monthly_compensation_cents. The other instance
          (event_cancel_waitlist_promotion_cascade) starts from a registration cancel.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. VERIFIED veteran; claim decided GRANTED at rating 50 with 2 dependents by officer-a (final 140118; member total 140118)."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Cascade Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/claims"
              payload: { member_id: "${m_id}", claim_type: "DISABILITY_COMPENSATION", claimed_rating_pct: 70, dependent_count: 2 }
              as: AccreditedRepresentative
              captures: { claim_id: "$.data.id" }
            - call: "POST /veteran-services/claims/${claim_id}/decide"
              payload: { outcome: "GRANTED", decided_rating_pct: 50 }
              as: BenefitsOfficer
              as_user_id: "officer-a"
          trigger:
            - call: "POST /veteran-services/appeals"
              payload: { claim_id: "${claim_id}", grounds: "rating too low" }
              as: AccreditedRepresentative
              captures: { ap_id: "$.data.id" }
            - call: "POST /veteran-services/appeals/${ap_id}/decide"
              payload: { outcome: "OVERTURNED", new_rating_pct: 70 }
              as: BenefitsOfficer
              as_user_id: "officer-b"
          assert:
            - "Appeal.${ap_id}.status == DECIDED with outcome OVERTURNED and decided_by_officer_id == \"officer-b\""
            - "BenefitsClaim.${claim_id}.status == DECIDED (returned from APPEAL_PENDING) with decided_rating_pct == 70"
            - "BenefitsClaim.${claim_id}.final_monthly_cents == 202028 (round_half_up((166100 + 31000) * 1.025) = round_half_up(202027.5))"
            - "BenefitsClaim.${claim_id}.decided_by_officer_id == \"officer-b\" (the appeal re-anchors the standing decision)"
            - "GET /veteran-services/members/${m_id} reports total_monthly_compensation_cents == 202028 (was 140118 before the appeal decision)"
            - "Member.version advanced twice across the chain (once on claim decide, once on the appeal-driven recomputation)"

      - name: event_cancel_waitlist_promotion_cascade
        grounds:
          - state_machines.EventRegistration.CONFIRMED_to_CANCELLED
          - state_machines.EventRegistration.WAITLISTED_to_CONFIRMED
          - calculations.waitlist_promotion
          - calculations.travel_award
          - entities.CommunityEvent.fields.travel_budget_remaining_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by a REGISTRATION CANCEL: cancelling a CONFIRMED
          registration mutates the event (seat + budget release), that release promotes the
          smallest-queue_position WAITLISTED registration, and the promotion itself computes
          and debits a travel award. Different trigger than appeal_overturned_cascade.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Event capacity 1, no accessibility seats, travel budget 100000, on 2026-10-15T10:00:00Z-12:00:00Z. r1 (m1) CONFIRMED with award 20000; r2 (m2) and r3 (m3) WAITLISTED in that order."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/community-events"
              payload: { name: "Caregiver Summit", starts_at: "2026-10-15T10:00:00Z", ends_at: "2026-10-15T12:00:00Z", capacity: 1, accessibility_seat_count: 0, travel_budget_cents: 100000 }
              as: EventCoordinator
              captures: { ev: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Reg One", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m1: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Reg Two", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "NAVY" }
              as: IntakeCoordinator
              captures: { m2: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Reg Three", member_type: "FAMILY_SUPPORT", service_era_claimed: "POST_911", injury_connection_claimed: "NON_SERVICE_CONNECTED" }
              as: IntakeCoordinator
              captures: { m3: "$.data.id" }
            - call: "POST /veteran-services/event-registrations"
              payload: { member_id: "${m1}", community_event_id: "${ev}", travel_request_cents: 20000 }
              as: EventCoordinator
              captures: { r1: "$.data.id", r1_status: "$.data.status", r1_award: "$.data.travel_award_cents" }
            - call: "POST /veteran-services/event-registrations"
              payload: { member_id: "${m2}", community_event_id: "${ev}", travel_request_cents: 40000 }
              as: EventCoordinator
              captures: { r2: "$.data.id", r2_status: "$.data.status" }
            - call: "POST /veteran-services/event-registrations"
              payload: { member_id: "${m3}", community_event_id: "${ev}", travel_request_cents: 10000 }
              as: EventCoordinator
              captures: { r3: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/event-registrations/${r1}/transition"
              payload: { action: "CANCEL" }
              as: EventCoordinator
          assert:
            - "r1_status == CONFIRMED and r1_award == 20000 before the cancel"
            - "r2_status == WAITLISTED at creation (capacity 1 was full)"
            - "EventRegistration.${r1}.status == CANCELLED"
            - "GET /veteran-services/event-registrations/${r2} shows status == CONFIRMED and travel_award_cents == 40000 (min(40000, 50000 cap, 100000 remaining))"
            - "GET /veteran-services/event-registrations/${r3} shows status == WAITLISTED and travel_award_cents == 0"
            - "GET /veteran-services/community-events shows travel_budget_remaining_cents == 60000 and registered_count == 1"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: appeal_state_error_beats_temporal_error
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - calculations.clock_sweep_rules
          - errors.ERR_CLAIM_NOT_APPEALABLE
          - errors.ERR_APPEAL_WINDOW_CLOSED
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: the claim is already CLOSED
          (state violation) AND the 90-day appeal window has passed (temporal violation);
          priority 7 must win with ERR_CLAIM_NOT_APPEALABLE. The other instance
          (enrollment_referential_beats_fiscal) exercises referential vs fiscal.
        test_recipe:
          setup:
            - "VERIFIED veteran; claim decided GRANTED at 2026-09-10T12:00:00Z; clock advanced to 2026-12-17T00:00:00Z so the sweep auto-closed the claim (decided_at + 97 days = 2026-12-16T12:00:00Z) — window end 2026-12-09T12:00:00Z also passed."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Window Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/claims"
              payload: { member_id: "${m_id}", claim_type: "DISABILITY_COMPENSATION", claimed_rating_pct: 50, dependent_count: 0 }
              as: AccreditedRepresentative
              captures: { claim_id: "$.data.id" }
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/claims/${claim_id}/decide"
              payload: { outcome: "GRANTED", decided_rating_pct: 50 }
              as: BenefitsOfficer
              as_user_id: "officer-a"
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-17T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /veteran-services/appeals"
              payload: { claim_id: "${claim_id}" }
              as: AccreditedRepresentative
              captures: { err: "$.data.error_id" }
          assert:
            - "BenefitsClaim.${claim_id}.status == CLOSED before the trigger (sweep ran at the 2026-12-17 clock set)"
            - "err == ERR_CLAIM_NOT_APPEALABLE (state category, priority 7)"
            - "err != ERR_APPEAL_WINDOW_CLOSED (temporal category, priority 11, also violated but lower priority)"
            - "the response status is 409, not 422"
            - "GET /veteran-services/claims/${claim_id}/appeals returns 0 rows"

      - name: enrollment_referential_beats_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=13]
          - errors.ERR_EXTERNAL_SERVICE_CONFLICT
          - errors.ERR_TRACK_CAPACITY_REACHED
        distinguishing_aspect: |
          Error-category pair business_referential vs business_fiscal: the member holds an
          ACTIVE external MENTAL_HEALTH service record (duplication violation) AND the
          track is at capacity (fiscal violation); priority 10 must win with
          ERR_EXTERNAL_SERVICE_CONFLICT. The other instance exercises state vs temporal.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. MENTAL_HEALTH track capacity 1, filled by verified member B. Verified member A has an ACTIVE ExternalServiceRecord with service_category MENTAL_HEALTH and no coordination consent."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 1 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Dup A", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { a_id: "$.data.id", a_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${a_id}", expected_member_version: "${a_v}" }
              as: IntakeCoordinator
              captures: { c_a: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${c_a}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/external-service-records"
              payload: { member_id: "${a_id}", organization_name: "VetHelp Alliance", service_category: "MENTAL_HEALTH", start_date: "2026-08-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/members"
              payload: { full_name: "Filler B", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "NAVY" }
              as: IntakeCoordinator
              captures: { b_id: "$.data.id", b_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${b_id}", expected_member_version: "${b_v}" }
              as: IntakeCoordinator
              captures: { c_b: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${c_b}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${b_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${a_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_EXTERNAL_SERVICE_CONFLICT (business_referential, priority 10)"
            - "err != ERR_TRACK_CAPACITY_REACHED (business_fiscal, priority 13, also violated)"
            - "GET /veteran-services/enrollments?member_id=${a_id} returns 0 rows"
            - "GET /veteran-services/program-tracks shows active_enrollment_count == 1 (unchanged)"

  - rule_id: boundary_precision_check
    instances:
      - name: track_capacity_boundary_count
        grounds:
          - validations[priority=13]
          - calculations.registration_seating
          - entities.ProgramTrack.fields.active_enrollment_count
          - errors.ERR_TRACK_CAPACITY_REACHED
        distinguishing_aspect: |
          Integer-count boundary on POST /veteran-services/enrollments: the second
          enrollment succeeds at count == capacity - 1 and the third fails at
          count == capacity. The other instance (survey_window_close_inclusive) is a
          datetime boundary on a different endpoint.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. PHYSICAL_HEALTH track capacity 2. Three VERIFIED veterans a, b, c."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "PHYSICAL_HEALTH", name: "Physical Health Track", capacity: 2 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Cap A", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { a_id: "$.data.id", a_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${a_id}", expected_member_version: "${a_v}" }
              as: IntakeCoordinator
              captures: { c_a: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${c_a}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/members"
              payload: { full_name: "Cap B", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "NAVY" }
              as: IntakeCoordinator
              captures: { b_id: "$.data.id", b_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${b_id}", expected_member_version: "${b_v}" }
              as: IntakeCoordinator
              captures: { c_b: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${c_b}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/members"
              payload: { full_name: "Cap C", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "MARINES" }
              as: IntakeCoordinator
              captures: { cc_id: "$.data.id", cc_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${cc_id}", expected_member_version: "${cc_v}" }
              as: IntakeCoordinator
              captures: { c_c: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${c_c}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${a_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { e_a: "$.data.id" }
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${b_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { e_b: "$.data.id" }
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${cc_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "enrollment a returns 201 with status INTAKE (count was 0 < 2)"
            - "enrollment b returns 201 with status INTAKE (count was 1 == capacity - 1, still admitted)"
            - "err == ERR_TRACK_CAPACITY_REACHED with status 409 (count was 2 == capacity, rejected)"
            - "GET /veteran-services/program-tracks shows active_enrollment_count == 2"
            - "GET /veteran-services/enrollments?member_id=${cc_id} returns 0 rows"

      - name: survey_window_close_inclusive
        grounds:
          - calculations.survey_window_schedule
          - calculations.clock_sweep_rules
          - state_machines.OutcomeSurvey
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Datetime boundary on POST /veteran-services/surveys/{survey_id}/submit: the EXIT
          window close instant itself is submittable (inclusive bound), one second later the
          sweep has expired the wave and the submit fails. The other instance
          (track_capacity_boundary_count) is an integer-count boundary on a different endpoint.
        test_recipe:
          setup:
            - "Two VERIFIED veterans each with a MENTAL_HEALTH enrollment COMPLETED at 2026-10-01T00:00:00Z; both EXIT waves have window [2026-10-01T00:00:00Z, 2026-10-31T00:00:00Z]."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
