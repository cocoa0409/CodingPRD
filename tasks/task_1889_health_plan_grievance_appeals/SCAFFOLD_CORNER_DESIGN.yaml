        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_ACK_WINDOW_MISSED]"]
        distinguishing_aspect: "Triage at received_at + 25h exceeds the 24h acknowledgement window -> ERR_ACK_WINDOW_MISSED; at exactly +24h it succeeds."
        test_recipe:
          setup: ["Two RECEIVED GRIEVANCE cases; clock advanced differently per case"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-VA4", full_name: "Ack Win", program: "MEDICARE" }
              as: PlatformAdmin
