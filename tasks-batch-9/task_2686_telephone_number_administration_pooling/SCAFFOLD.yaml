    output: RoutingRecord
    side_effects: ["rejects the write with ERR_STALE_BLOCK_VERSION when expected_block_version does not equal the block's current version", "closes the block's open PUBLISHED record by stamping end_at = the new record's effective_at and record_status = SUPERSEDED", "creates the new record with record_status = PUBLISHED, end_at = null and ocn copied from the holding carrier", "moves routing_status to LERG_PUBLISHED when effective_at is at or before the logical clock, otherwise to ROUTING_PENDING", "increments NumberBlock.npac_db_version by 1 and stamps it onto the new record", "increments NumberBlock.version by 1"]
  - method: GET
