# §1.9 Scaffold Corner Design — task 2357 Home and Hospital Instruction Program
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already cover.
# section: / claim_type: values are taken verbatim from references/claim-extraction-guide.md.
# All derived numbers were computed by executing the §1.3 formulas with their declared constants.
# Logical clock starts at 2026-08-01T00:00:00Z; every chain pins it explicitly.

scaffold_corner_design:
  - section: entities
    instances:
      - name: student_creation_returns_201_with_derived_grade_band_and_success_envelope
        claim_type: creation
        grounds:
          - entities.Student
          - endpoints[POST /hhi/students]
          - response_envelope.success
        distinguishing_aspect: |
          Creation returns 201 inside the declared success envelope and grade_band is derived from
          grade_level by the §1.1 banding rule (grade_level 7 -> MIDDLE), not echoed from input.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /hhi/students"
              payload: { student_number: "S-0001", full_name: "Ada Lin", grade_level: 7, campus_code: "MS-01", special_ed_status: "IEP", iep_service_minutes_weekly: 300, enrollment_status: "ENROLLED" }
              as: ProgramAdministrator
              captures: { stu_id: $.data.id }
          assert:
            - "HTTP status is 201."
            - "Response body has exactly the keys meta, response_type, data; response_type == \"object\"."
            - "meta contains api_request_id and api_request_timestamp."
            - "data.student_number == \"S-0001\"; data.full_name == \"Ada Lin\"; data.grade_level == 7; data.campus_code == \"MS-01\"."
            - "data.special_ed_status == \"IEP\"; data.iep_service_minutes_weekly == 300; data.enrollment_status == \"ENROLLED\"."
            - "data.grade_band == \"MIDDLE\" (grade_level 7 falls in 6..8)."
            - "data.version == 1."

      - name: teacher_retrieval_returns_the_stored_row_with_zero_committed_minutes
        claim_type: retrieval
        grounds:
          - entities.Teacher
          - endpoints[GET /hhi/teachers/{id}]
          - calculations.teacher_committed_minutes
        distinguishing_aspect: |
          A freshly created Teacher with no ACTIVE assignments reads back byte-for-byte with
          committed_weekly_minutes 0 and over_cap false — the derived pair is present on retrieval,
          not only after an assignment exists.
        test_recipe:
          setup:
            - "One Teacher, no assignments anywhere in the system."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/teachers"
              payload: { full_name: "Tara Ng", employee_number: "E-1001", credential_areas: ["MATH", "ELA"], grade_bands: ["MIDDLE", "HIGH"], max_weekly_caseload_minutes: 1200, safety_clearance_status: "CLEARED", clearance_expires_on: "2027-06-30", home_visit_eligible: true }
              as: ProgramAdministrator
              captures: { tch_primary_id: $.data.id }
          trigger:
            - call: "GET /hhi/teachers/${tch_primary_id}"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "HTTP status is 200; response_type == \"object\"."
            - "data.id == ${tch_primary_id}; data.employee_number == \"E-1001\"."
            - "data.credential_areas == [\"MATH\", \"ELA\"]; data.grade_bands == [\"MIDDLE\", \"HIGH\"]."
            - "data.max_weekly_caseload_minutes == 1200; data.safety_clearance_status == \"CLEARED\"."
            - "data.clearance_expires_on == \"2027-06-30\"; data.home_visit_eligible is true."
            - "data.committed_weekly_minutes == 0; data.over_cap is false."

      - name: student_listing_paginates_and_filters_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /hhi/students]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          total_count reports the filtered population (3), not the page size, and has_more flips from
          true to false across the offset boundary; a campus_code filter narrows total_count to 1
          while limit/offset still apply to the filtered set.
        test_recipe:
          setup:
            - "Three Students: S-0001 (grade 7, MS-01), S-0002 (grade 4, EL-02), S-0003 (grade 10, HS-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/students"
              payload: { student_number: "S-0001", full_name: "Ada Lin", grade_level: 7, campus_code: "MS-01" }
              as: ProgramAdministrator
            - call: "POST /hhi/students"
              payload: { student_number: "S-0002", full_name: "Ben Ortiz", grade_level: 4, campus_code: "EL-02" }
              as: ProgramAdministrator
            - call: "POST /hhi/students"
              payload: { student_number: "S-0003", full_name: "Cara Voss", grade_level: 10, campus_code: "HS-01" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /hhi/students?limit=2&offset=0"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /hhi/students?limit=2&offset=2"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /hhi/students?campus_code=EL-02"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /hhi/students?grade_band=HIGH"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          assert:
            - "First call: HTTP 200, response_type == \"array\", len(data) == 2, total_count == 3, limit == 2, offset == 0, has_more is true."
            - "Second call: len(data) == 1, total_count == 3, offset == 2, has_more is false."
            - "Third call: total_count == 1, len(data) == 1, data[0].student_number == \"S-0002\", has_more is false."
            - "Fourth call: total_count == 1, data[0].student_number == \"S-0003\" (grade_level 10 -> HIGH)."

      - name: nonexistent_path_ids_return_the_entity_specific_not_found_error
        claim_type: not_found
        grounds:
          - errors[ERR_STUDENT_NOT_FOUND]
          - errors[ERR_TEACHER_NOT_FOUND]
          - errors[ERR_ENTITLEMENT_RULE_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
          - errors[ERR_CERTIFICATION_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_SESSION_NOT_FOUND]
          - errors[ERR_SAFETY_REVIEW_NOT_FOUND]
          - errors[ERR_EXTENSION_REQUEST_NOT_FOUND]
          - errors[ERR_TRANSITION_PLAN_NOT_FOUND]
          - errors[ERR_PACING_SYNC_NOT_FOUND]
          - errors[ERR_SPED_LOG_NOT_FOUND]
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
        distinguishing_aspect: |
          Each of the thirteen path-level 404 codes is distinct and keyed to the entity named in the
          path segment — a well-formed but unknown UUID never collapses to a generic 404 and never
          returns 200 with an empty body.
        test_recipe:
          setup:
            - "Empty database; no entity of any type exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /hhi/students/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_student: $.data.error_id }
            - call: "GET /hhi/teachers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_teacher: $.data.error_id }
            - call: "GET /hhi/entitlement-rules/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_rule: $.data.error_id }
            - call: "GET /hhi/cases/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_case: $.data.error_id }
            - call: "GET /hhi/certifications/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_cert: $.data.error_id }
            - call: "GET /hhi/assignments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_asg: $.data.error_id }
            - call: "GET /hhi/sessions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_ses: $.data.error_id }
            - call: "GET /hhi/safety-reviews/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_sr: $.data.error_id }
            - call: "GET /hhi/extension-requests/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_ext: $.data.error_id }
            - call: "GET /hhi/transition-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_plan: $.data.error_id }
            - call: "GET /hhi/pacing-syncs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_sync: $.data.error_id }
            - call: "GET /hhi/sped-service-logs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_sped: $.data.error_id }
            - call: "GET /hhi/attendance-entries/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              captures: { err_ledger: $.data.error_id }
          assert:
            - "Every call returns HTTP 404 with response_type == \"error\" and data limited to error_id and message."
            - "${err_student} == \"ERR_STUDENT_NOT_FOUND\"; ${err_teacher} == \"ERR_TEACHER_NOT_FOUND\"; ${err_rule} == \"ERR_ENTITLEMENT_RULE_NOT_FOUND\"."
            - "${err_case} == \"ERR_CASE_NOT_FOUND\"; ${err_cert} == \"ERR_CERTIFICATION_NOT_FOUND\"; ${err_asg} == \"ERR_ASSIGNMENT_NOT_FOUND\"."
            - "${err_ses} == \"ERR_SESSION_NOT_FOUND\"; ${err_sr} == \"ERR_SAFETY_REVIEW_NOT_FOUND\"; ${err_ext} == \"ERR_EXTENSION_REQUEST_NOT_FOUND\"."
            - "${err_plan} == \"ERR_TRANSITION_PLAN_NOT_FOUND\"; ${err_sync} == \"ERR_PACING_SYNC_NOT_FOUND\"; ${err_sped} == \"ERR_SPED_LOG_NOT_FOUND\"; ${err_ledger} == \"ERR_LEDGER_ENTRY_NOT_FOUND\"."

      - name: missing_required_input_fields_are_rejected_with_validation_before_any_lookup
        claim_type: required_fields
        grounds:
          - errors[ERR_VALIDATION]
          - validations[priority 3]
          - endpoints[POST /hhi/students]
          - endpoints[POST /hhi/teachers]
          - endpoints[POST /hhi/cases]
          - endpoints[POST /hhi/certifications]
        distinguishing_aspect: |
          ERR_VALIDATION (priority 3) fires for a missing required field even when the same request
          also names a nonexistent FK, so schema validation strictly precedes the priority-5 body-FK
          NOT_FOUND checks; no partial row is persisted.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /hhi/students"
              payload: { student_number: "S-0001", grade_level: 7, campus_code: "MS-01" }
              as: ProgramAdministrator
              captures: { err_no_name: $.data.error_id }
            - call: "POST /hhi/teachers"
              payload: { full_name: "Tara Ng", employee_number: "E-1001", credential_areas: ["MATH"], grade_bands: ["MIDDLE"], max_weekly_caseload_minutes: 1200 }
              as: ProgramAdministrator
              captures: { err_no_expiry: $.data.error_id }
            - call: "POST /hhi/cases"
              payload: { student_id: "00000000-0000-0000-0000-0000000000ff", referral_date: "2026-09-01" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_no_mode: $.data.error_id }
            - call: "POST /hhi/certifications"
              payload: { case_id: "00000000-0000-0000-0000-0000000000ff", physician_npi: "1234567890", diagnosis_category: "MEDICAL_ACUTE", certified_start_date: "2026-09-07", certified_end_date: "2026-10-07", expected_absence_days: 30, signature_date: "2026-09-01" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_no_version: $.data.error_id }
          assert:
            - "All four calls return HTTP 400 with error_id ERR_VALIDATION."
            - "${err_no_name} == \"ERR_VALIDATION\" (full_name absent)."
            - "${err_no_expiry} == \"ERR_VALIDATION\" (clearance_expires_on absent)."
            - "${err_no_mode} == \"ERR_VALIDATION\" (delivery_mode absent) — NOT ERR_STUDENT_NOT_FOUND, even though student_id does not exist."
            - "${err_no_version} == \"ERR_VALIDATION\" (expected_case_version absent) — NOT ERR_CASE_NOT_FOUND."
            - "GET /hhi/students returns total_count == 0; GET /hhi/teachers returns total_count == 0."

      - name: omitted_optional_fields_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Student.fields.special_ed_status
          - entities.Student.fields.iep_service_minutes_weekly
          - entities.Student.fields.enrollment_status
          - entities.Teacher.fields.safety_clearance_status
          - entities.Teacher.fields.home_visit_eligible
          - entities.EntitlementRule.fields.status
          - entities.HomeVisitSafetyReview.fields.hazard_findings
          - entities.HomeVisitSafetyReview.fields.escort_available
        distinguishing_aspect: |
          Every §1.1 input field carrying a default materialises that exact default when omitted —
          including EntitlementRule.status defaulting to PUBLISHED (so an omitted status makes the
          rule immediately resolvable) and hazard_findings defaulting to the empty list (risk 0).
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-09-01T00:00:00Z."
            - "A DRAFT HomeboundCase exists so a HomeVisitSafetyReview can be created against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/students"
              payload: { student_number: "S-0001", full_name: "Ada Lin", grade_level: 7, campus_code: "MS-01" }
              as: ProgramAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /hhi/cases"
              payload: { student_id: "${stu_id}", referral_date: "2026-09-01", delivery_mode: "IN_HOME" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /hhi/students/${stu_id}"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /hhi/teachers"
              payload: { full_name: "Tara Ng", employee_number: "E-1001", credential_areas: ["MATH"], grade_bands: ["MIDDLE"], max_weekly_caseload_minutes: 1200, clearance_expires_on: "2027-06-30" }
              as: ProgramAdministrator
              captures: { tch_id: $.data.id }
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "MIDDLE", delivery_mode: "IN_HOME", base_weekly_minutes: 360, cap_weekly_minutes: 480, min_session_minutes: 30, max_session_minutes: 120, max_daily_minutes: 240, min_gap_minutes: 15, travel_buffer_minutes: 30 }
              as: ProgramAdministrator
              captures: { rule_id: $.data.id }
            - call: "POST /hhi/safety-reviews"
              payload: { case_id: "${case_id}", evidence_source: "ONSITE_WALKTHROUGH", review_date: "2026-09-02" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { sr_id: $.data.id }
          assert:
            - "Student read-back: data.special_ed_status == \"NONE\", data.iep_service_minutes_weekly == 0, data.enrollment_status == \"ENROLLED\"."
            - "Teacher: HTTP 201, data.safety_clearance_status == \"CLEARED\", data.home_visit_eligible is true, data.committed_weekly_minutes == 0, data.over_cap is false."
            - "EntitlementRule: HTTP 201, data.status == \"PUBLISHED\"."
            - "SafetyReview: HTTP 201, data.hazard_findings == [], data.escort_available is false, data.risk_score == 0, data.clearance == \"CLEARED\", data.status == \"DRAFT\"."
            - "SafetyReview data.scoring_variant == \"ONSITE_VERIFIED\"; data.expires_on == \"2026-11-01\" (review_date + 60 days)."

      - name: session_computed_fields_are_derived_and_client_supplied_values_are_ignored
        claim_type: computed_fields
        grounds:
          - entities.InstructionSession.fields.scheduled_minutes
          - entities.InstructionSession.fields.service_date
          - entities.InstructionSession.fields.credited_minutes
          - entities.HomeboundCase.fields.weekly_entitled_minutes
          - calculations.weekly_entitlement_minutes
        distinguishing_aspect: |
          scheduled_minutes (120) and service_date (2026-09-07) are derived from the two timestamps,
          credited_minutes stays 0 while the session is SCHEDULED, and the case's
          weekly_entitled_minutes is 390 from the formula — none of these are settable by the client.
        test_recipe:
          setup:
            - "MIDDLE/IN_HOME EntitlementRule PUBLISHED: base 360, cap 480, min_session 30, max_session 120, max_daily 240, min_gap 15, travel_buffer 30."
            - "HomeboundCase ACTIVE / ACCRUING for grade-7 student, MEDICAL_ACUTE, 30 expected absence days, weekly_entitled_minutes 390 (round_half_up(360*1.0) + MID bonus 30, under the 480 cap)."
            - "One ACTIVE PRIMARY assignment; logical clock 2026-09-07T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "MIDDLE", delivery_mode: "IN_HOME", base_weekly_minutes: 360, cap_weekly_minutes: 480, min_session_minutes: 30, max_session_minutes: 120, max_daily_minutes: 240, min_gap_minutes: 15, travel_buffer_minutes: 30, status: "PUBLISHED" }
              as: ProgramAdministrator
              captures: { rule_home_id: $.data.id }
            - call: "POST /hhi/students"
              payload: { student_number: "S-0001", full_name: "Ada Lin", grade_level: 7, campus_code: "MS-01", special_ed_status: "NONE", iep_service_minutes_weekly: 0, enrollment_status: "ENROLLED" }
              as: ProgramAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /hhi/teachers"
              payload: { full_name: "Tara Ng", employee_number: "E-1001", credential_areas: ["MATH", "ELA"], grade_bands: ["MIDDLE", "HIGH"], max_weekly_caseload_minutes: 1200, safety_clearance_status: "CLEARED", clearance_expires_on: "2027-06-30", home_visit_eligible: true }
              as: ProgramAdministrator
              captures: { tch_primary_id: $.data.id }
            - call: "POST /hhi/cases"
              payload: { student_id: "${stu_id}", referral_date: "2026-09-01", delivery_mode: "IN_HOME", referral_note: "Post-surgical recovery" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /hhi/certifications"
              payload: { case_id: "${case_id}", physician_npi: "1234567890", diagnosis_category: "MEDICAL_ACUTE", certified_start_date: "2026-09-07", certified_end_date: "2026-10-07", expected_absence_days: 30, signature_date: "2026-09-01", expected_case_version: "${case_v0}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cert_id: $.data.id }
            - call: "POST /hhi/certifications/${cert_id}/review"
              payload: { decision: "ACCEPT", review_note: "Documentation complete" }
              as: NurseReviewer
              as_user_id: "nr-001"
            - call: "POST /hhi/safety-reviews"
              payload: { case_id: "${case_id}", evidence_source: "ONSITE_WALKTHROUGH", review_date: "2026-09-02", hazard_findings: ["UNLIT_ACCESS"], escort_available: false }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { sr_id: $.data.id }
            - call: "POST /hhi/safety-reviews/${sr_id}/finalize"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /hhi/assignments"
              payload: { case_id: "${case_id}", role: "PRIMARY", teacher_id: "${tch_primary_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { asg_primary_id: $.data.id }
            - call: "POST /hhi/assignments/${asg_primary_id}/accept"
              payload: {}
              as: HomeboundTeacher
              as_user_id: "${tch_primary_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/cases/${case_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
          trigger:
            - call: "POST /hhi/sessions"
              payload: { case_id: "${case_id}", assignment_id: "${asg_primary_id}", scheduled_start: "2026-09-07T09:00:00Z", scheduled_end: "2026-09-07T11:00:00Z", delivery_mode: "IN_HOME", subject: "MATH" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ses_id: $.data.id }
            - call: "GET /hhi/cases/${case_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
          assert:
            - "Session: HTTP 201, data.scheduled_minutes == 120, data.service_date == \"2026-09-07\"."
            - "Session data.credited_minutes == 0 and data.actual_minutes is null while data.status == \"SCHEDULED\"."
            - "Case read-back: data.weekly_entitled_minutes == 390; data.entitlement_rule_id == ${rule_home_id}."
            - "Case data.diagnosis_category == \"MEDICAL_ACUTE\" (copied from the accepted certification), data.certified_start_date == \"2026-09-07\", data.certified_end_date == \"2026-10-07\"."
            - "Case data.service_start_date == \"2026-09-07\" (the logical-clock date at activation)."

      - name: system_fields_are_server_generated_and_version_starts_at_one
        claim_type: system_fields
        grounds:
          - entities.Student
          - entities.HomeboundCase.fields.created_by_user_id
          - entities.PhysicianCertification.fields.submitted_by_user_id
        distinguishing_aspect: |
          id / created_at / updated_at / version are server-assigned and unaffected by client input;
          created_by_user_id and submitted_by_user_id are taken from the X-User-ID header, never the
          body, and the case's version increments from 1 to 2 across the certification write.
        test_recipe:
          setup:
            - "One Student; logical clock pinned to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/students"
              payload: { student_number: "S-0001", full_name: "Ada Lin", grade_level: 7, campus_code: "MS-01" }
              as: ProgramAdministrator
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /hhi/cases"
              payload: { student_id: "${stu_id}", referral_date: "2026-09-01", delivery_mode: "IN_HOME" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_id: $.data.id, case_v0: $.data.version }
