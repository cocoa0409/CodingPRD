          - errors.ERR_INFECTION_INCIDENT_NOT_FOUND
          - errors.ERR_LEDGER_ENTRY_NOT_FOUND
          - errors.ERR_TRAINING_RECORD_NOT_FOUND
        distinguishing_aspect: "Each entity family returns its OWN 404 code rather than a shared generic one, so eleven syntactically identical GETs against well-formed but unknown UUIDs must produce eleven different error_id values — a single ERR_NOT_FOUND for all of them fails this."
