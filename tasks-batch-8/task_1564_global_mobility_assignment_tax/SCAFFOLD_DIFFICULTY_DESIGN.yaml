# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1564: Global Mobility & Assignment Tax Equalization
# 9 rules x >=2 instances; every chain replayed against SCAFFOLD.yaml §1.2/§1.4/§1.5.
# Canonical fixtures unless an instance overrides:
#   program: home US, threshold 110, duration cap 1825, per-diem cap 365
#   employee: family_size 2, base 10_800_000; policy JP: 7500/day, cola 15, housing cap 300000
#   assignment: JP, BU-TOKYO, LONG_TERM, 2026-09-01 -> 2027-08-31, split 60/40
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: hypothetical_tax_provisional_vs_final_divergence
        grounds:
          - calculations.hypothetical_tax
          - entities.ShadowPayrollRecord.fields.hypothetical_tax_cents
          - entities.Settlement.fields.final_hypo_tax_cents
        distinguishing_aspect: |
          Same payroll inputs (monthly gross 900000, family_size 2) yield PROVISIONAL
          withholding of 135000 cents (annualize-then-divide on the ShadowPayrollRecord
          domain) but a FINAL liability of 110000 cents (brackets applied once to the
          filed gross of 1500000 on the Settlement domain) — the two variants of
          calculations.hypothetical_tax provably diverge on identical underlying data.
        test_recipe:
          setup:
            - "Fully activated assignment (package APPROVED, split 60/40 ACTIVE, CoC ISSUED 2026-09-01..2027-08-31)"
            - "One POSTED record: 2026-09, total 900000, per_diem 20 days, receipts 310000"
            - "Vendor engagement for tax_year 2026 driven to FILED with filed_total_gross_cents=1500000"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US", functional_currency: "USD", cost_overrun_threshold_pct: 110, max_assignment_duration_days: 1825, per_diem_annual_day_cap: 365 }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: true, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000, goods_services_differential_pct: 0, relocation_lump_sum_cents: 0 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/certificates-of-coverage", payload: { assignment_id: "${asg_id}", application_ref: "COC-1" }, as: VendorCoordinator, captures: { coc_id: "$.data.id" } }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/submit", as: VendorCoordinator }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/mark-issued", payload: { valid_from: "2026-09-01", valid_until: "2027-08-31" }, as: VendorCoordinator }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 9, total_gross_cents: 900000, per_diem_days: 20, housing_receipts_cents: 310000 }, as: PayrollSpecialist, captures: { rec_id: "$.data.id", rec_hypo: "$.data.hypothetical_tax_cents" } }
            - { call: "POST /mobility/shadow-payroll-records/${rec_id}/post", as: PayrollSpecialist }
            - { call: "POST /mobility/vendor-engagements", payload: { assignment_id: "${asg_id}", tax_year: 2026, scope: "DUAL", vendor_name: "TaxCo", fee_cents: 500000 }, as: VendorCoordinator, captures: { ven_id: "$.data.id" } }
            - { call: "POST /mobility/vendor-engagements/${ven_id}/send-data", as: VendorCoordinator }
            - { call: "POST /mobility/vendor-engagements/${ven_id}/return-draft", as: TaxVendor }
            - { call: "POST /mobility/vendor-engagements/${ven_id}/start-review", as: VendorCoordinator }
            - { call: "POST /mobility/vendor-engagements/${ven_id}/accept", as: VendorCoordinator }
            - { call: "POST /mobility/vendor-engagements/${ven_id}/mark-filed", payload: { filed_total_gross_cents: 1500000, filed_home_tax_cents: 130000 }, as: VendorCoordinator }
          trigger:
            - { call: "POST /mobility/settlements", payload: { assignment_id: "${asg_id}", tax_year: 2026 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { set_id: "$.data.id" } }
          assert:
            - "ShadowPayrollRecord.${rec_id}.hypothetical_tax_cents == 135000 (PROVISIONAL: brackets on 900000x12=10800000 less 400000 exemption = 1620000/12)"
            - "Settlement.${set_id}.final_hypo_tax_cents == 110000 (FINAL: brackets on filed 1500000 less 400000 exemption)"
            - "Settlement.${set_id}.total_hypo_withheld_cents == 135000"
            - "Settlement.${set_id}.settlement_amount_cents == 25000"
            - "Settlement.${set_id}.direction == EMPLOYEE_CREDIT"
            - "135000 != 110000 — variants diverge on the same payroll data"

      - name: cost_projection_provisional_vs_actualized_divergence
        grounds:
          - calculations.cost_projection_total
          - entities.CostProjection.fields.variant
          - entities.CostProjection.fields.total_projected_cents
          - concurrency_rules[cost-projection-create-stale-assignment]
        distinguishing_aspect: |
          Same assignment (12 months, monthly_cost_cents 1158750) yields PROVISIONAL
          total 13905000 when no POSTED record exists, but ACTUALIZED total 13818750
          once the September record posts actuals of 1072500 — the CostProjection
          entity domain's two variants diverge on identical plan data.
        test_recipe:
          setup:
            - "Fully activated assignment as canonical fixtures (CoC ISSUED, so employer_socsec_cents is 0 in plan)"
            - "No shadow payroll records exist when the first projection is created"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US", functional_currency: "USD", cost_overrun_threshold_pct: 110, max_assignment_duration_days: 1825, per_diem_annual_day_cap: 365 }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: true, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000, goods_services_differential_pct: 0, relocation_lump_sum_cents: 0 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/certificates-of-coverage", payload: { assignment_id: "${asg_id}", application_ref: "COC-1" }, as: VendorCoordinator, captures: { coc_id: "$.data.id" } }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/submit", as: VendorCoordinator }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/mark-issued", payload: { valid_from: "2026-09-01", valid_until: "2027-08-31" }, as: VendorCoordinator }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "GET /mobility/assignments/${asg_id}", as: MobilityAdmin, captures: { asg_v: "$.data.version" } }
            - { call: "POST /mobility/cost-projections", payload: { assignment_id: "${asg_id}", expected_assignment_version: "${asg_v}" }, as: FinanceController, captures: { proj1_id: "$.data.id", proj1_total: "$.data.total_projected_cents", proj1_variant: "$.data.variant" } }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 9, total_gross_cents: 900000, per_diem_days: 20, housing_receipts_cents: 310000 }, as: PayrollSpecialist, captures: { rec_id: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records/${rec_id}/post", as: PayrollSpecialist }
            - { call: "GET /mobility/assignments/${asg_id}", as: MobilityAdmin, captures: { asg_v2: "$.data.version" } }
          trigger:
            - { call: "POST /mobility/cost-projections", payload: { assignment_id: "${asg_id}", expected_assignment_version: "${asg_v2}" }, as: FinanceController, captures: { proj2_id: "$.data.id" } }
          assert:
            - "CostProjection.${proj1_id} read back has variant == PROVISIONAL and total_projected_cents == 13905000 (12 x 1158750)"
            - "CostProjection.${proj2_id}.variant == ACTUALIZED"
            - "CostProjection.${proj2_id}.total_projected_cents == 13818750 (posted 1072500 + 11 x 1158750)"
            - "CostProjection.${proj1_id}.status == SUPERSEDED and CostProjection.${proj2_id}.status == CURRENT after the second create"
            - "13905000 != 13818750 — the two variants price the same 12-month assignment differently"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: hypothetical_tax_tiered_brackets_with_proration
        grounds:
          - calculations.hypothetical_tax
          - entities.ShadowPayrollRecord.fields.hypothetical_tax_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (period gross, family_size-driven exemption, tiered
          bracket selection) interact non-linearly — the 900000 record crosses all
          three brackets (taxable 10400000 > 10000000) for exactly 135000, while the
          400000 record stays in bracket 1 and forces the non-integral division
          440000/12 = 36666.67 -> round_half_up 36667.
        test_recipe:
          setup:
            - "Fully activated assignment (canonical fixtures, CoC ISSUED)"
            - "September record total 900000; October record total 400000"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US", functional_currency: "USD", cost_overrun_threshold_pct: 110, max_assignment_duration_days: 1825, per_diem_annual_day_cap: 365 }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: true, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000, goods_services_differential_pct: 0, relocation_lump_sum_cents: 0 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/certificates-of-coverage", payload: { assignment_id: "${asg_id}", application_ref: "COC-1" }, as: VendorCoordinator, captures: { coc_id: "$.data.id" } }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/submit", as: VendorCoordinator }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/mark-issued", payload: { valid_from: "2026-09-01", valid_until: "2027-08-31" }, as: VendorCoordinator }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
          trigger:
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 9, total_gross_cents: 900000, per_diem_days: 0, housing_receipts_cents: 0 }, as: PayrollSpecialist, captures: { rec_sep: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 10, total_gross_cents: 400000, per_diem_days: 0, housing_receipts_cents: 0 }, as: PayrollSpecialist, captures: { rec_oct: "$.data.id" } }
          assert:
            - "ShadowPayrollRecord.${rec_sep}.hypothetical_tax_cents == 135000 (0.10x5000000 + 0.20x5000000 + 0.30x400000 = 1620000, /12 exact)"
            - "ShadowPayrollRecord.${rec_oct}.hypothetical_tax_cents == 36667 (440000/12 = 36666.67 rounds half-up, NOT truncation 36666)"

      - name: allowance_accrual_nested_rounding_order
        grounds:
          - calculations.allowance_accrual
          - entities.ShadowPayrollRecord.fields.per_diem_cents
          - entities.ShadowPayrollRecord.fields.housing_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is observable — per-diem 6333 with cola 7
          gives a rounded daily rate of 6776 which times 20 days yields 135520, while
          the forbidden multiply-then-round order yields 135526; housing receipts
          260000 clamp to the 250000 cap. A six-cent delta proves the pinned order.
        test_recipe:
          setup:
            - "SG policy: per_diem_daily_cents 6333, cola_pct 7, housing cap 250000, window 2027-01-01..2028-01-01"
            - "Assignment to SG, 2027-01-01..2027-12-31, totalization_applies false, split 50/50 ACTIVE, package APPROVED"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US", functional_currency: "USD", cost_overrun_threshold_pct: 110, max_assignment_duration_days: 1825, per_diem_annual_day_cap: 365 }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E2002", full_name: "Ben Traveler", home_country_code: "US", family_size: 1, annual_base_salary_cents: 6000000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "SG Alt", host_country_code: "SG", effective_from: "2027-01-01", effective_to: "2028-01-01", per_diem_daily_cents: 6333, housing_monthly_cap_cents: 250000, cola_pct: 7 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "SG", host_business_unit: "BU-SG", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2027-01-01", planned_end_date: "2027-12-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter B", home_base_annual_cents: 6000000, goods_services_differential_pct: 0, relocation_lump_sum_cents: 0 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 50, host_payroll_pct: 50 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
          trigger:
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2027, period_month: 2, total_gross_cents: 500000, per_diem_days: 20, housing_receipts_cents: 260000 }, as: PayrollSpecialist, captures: { rec_id: "$.data.id" } }
          assert:
            - "ShadowPayrollRecord.${rec_id}.per_diem_cents == 135520 (round_half_up(6333 x 1.07) = 6776 per day, x 20; the multiply-then-round order would give 135526)"
            - "ShadowPayrollRecord.${rec_id}.housing_cents == 250000 (receipts 260000 clamped to cap)"
            - "ShadowPayrollRecord.${rec_id}.home_gross_cents == 250000 and host_gross_cents == 250000 (50/50 split conserves total 500000)"

      - name: employer_tax_gross_up_fixed_point_iteration
        grounds:
          - calculations.employer_tax_gross_up
          - entities.ShadowPayrollRecord.fields.employer_host_tax_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — employer tax is 40% of (host gross
          plus itself) — with the evaluation order pinned as a per-cent fixed-point
          iteration: host 360000 converges to the exact fixed point 240000
          (0.40 x 600000 = 240000), and host 481275 converges to 320850
          (0.40 x 802125 = 320850), values the naive single-pass formula misses.
        test_recipe:
          setup:
            - "Activated assignment WITHOUT totalization (totalization_applies false, no CoC) so employer_social_security is also observable"
            - "September record total 900000 (host 360000); October record total 1203188 (host 481275)"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US", functional_currency: "USD", cost_overrun_threshold_pct: 110, max_assignment_duration_days: 1825, per_diem_annual_day_cap: 365 }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000, goods_services_differential_pct: 0, relocation_lump_sum_cents: 0 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
