              as: BureauAdmin
              captures: { employer_c: $.data.id }
            - call: "POST /assigned-risk-enrollments"
              payload: { employer_id: "${employer_c}", state_code: "TX", effective_date: "2026-01-01", expiration_date: "2026-12-31", estimated_annual_premium_cents: 500000 }
              as: PoolAdministrator
              captures: { enr_1: $.data.id }
            - call: "POST /assigned-risk-enrollments/${enr_1}/assign"
              payload: { carrier_id: "${carrier_1}" }
              as: PoolAdministrator
              captures: { enr_1_v: $.data.version }
            - call: "POST /assigned-risk-take-outs"
              payload: { enrollment_id: "${enr_1}", voluntary_carrier_id: "${carrier_2}", exit_date: "2026-07-01", expected_enrollment_version: "${enr_1_v}" }
              as: VoluntaryCarrierRepresentative
              as_user_id: "${carrier_2}"
              captures: { takeout_1: $.data.id }
          trigger:
            - call: "POST /assigned-risk-take-outs/${takeout_1}/approve"
              payload: {}
              as: PoolAdministrator
          assert:
            - "AssignedRiskTakeOut.${takeout_1}.status == APPROVED"
            - "AssignedRiskEnrollment.${enr_1}.status == EXITED and exit_reason == TAKE_OUT"
            - "Carrier.${carrier_1}.assigned_risk_current_load_cents == 0"

