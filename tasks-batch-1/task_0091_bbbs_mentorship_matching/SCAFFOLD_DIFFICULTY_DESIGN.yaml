          - state_machines.BackgroundCheck.PENDING_to_CLEARED
        distinguishing_aspect: "Dual-failure on adjudicate of an already-CLEARED check supplied with adverse_findings=3 (DMV) violates BOTH state (priority 6 ERR_INVALID_STATE) and business_safety (priority 7 ERR_ADVERSE_FINDING_BLOCKS_CLEAR); the lower priority number wins, so ERR_INVALID_STATE is returned."
        test_recipe:
          setup:
            - "A BackgroundCheck already CLEARED; a second adjudicate(CLEAR, adverse_findings=3) is sent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V PV1", email: "vpv1@x.com", gender: "MALE", home_zip: "10001", interest_tags: ["STEM"], max_weekly_hours: 5 }
              as: Coordinator
              captures: { v_id: $.data.id }
            - call: "POST /volunteers/${v_id}/submit-screening"
              payload: {}
              as: BackgroundScreener
            - call: "GET /volunteers/${v_id}/background-checks"
              payload: {}
              as: BackgroundScreener
              captures: { bc0: "$.data[0].id"}
            - call: "POST /background-checks/${bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
          trigger:
            - call: "POST /background-checks/${bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 3 }
              as: BackgroundScreener
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: propose_consent_referential_beats_no_eligible_constraint
        grounds:
          - validations[priority=9]
