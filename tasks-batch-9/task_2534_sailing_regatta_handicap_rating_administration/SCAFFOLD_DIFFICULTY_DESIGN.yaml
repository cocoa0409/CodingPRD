          assert:
            - "RatingCertificate.${c_a}.band_key_spm == 171.3, exactly the upper edge of NLOW and exactly the lower edge of NHIGH"
            - "trigger call 1 returns HTTP 422 with error_id ERR_NO_ELIGIBLE_DIVISION, because the upper endpoint is exclusive: 171.3 < 171.3 is false"
            - "after trigger call 1, Entry.${e_a}.division_id == null and Division.${div_lo}.assigned_entry_count == 0"
            - "trigger call 3 returns HTTP 200 and Entry.${e_a}.division_id == ${div_hi}, because the lower endpoint is inclusive: 171.3 <= 171.3 is true"
            - "Division.${div_hi}.assigned_entry_count == 1 with accepted_entry_count 0 and status PROVISIONAL, and Division.${div_lo}.assigned_entry_count stays 0"
            - "Entry.${e_a}.registration_status == SUBMITTED and Entry.${e_a}.version == 3, one increment for the crew addition and one for the successful assignment only"

  # =========================================================================
  # RULE 7 of 9 -- cross_entity_state_dependency (3 instances)
  # Pair 1: Entry.registration/division assignment depends on RatingCertificate.status.
  # Pair 2: Protest.status depends on JuryPanel.status and seated_member_count.
  # Pair 3: Race.start_status depends on Division.status.
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: assign_division_requires_issued_certificate
        entity_pair: "Entry depends on RatingCertificate"
        grounds:
          - validations.priority_25_ERR_CERTIFICATE_NOT_ISSUED
          - endpoints.POST_entries_id_assign_division
          - state_machines.RatingCertificate.status.DRAFT_to_ISSUED
          - calculations.entry_division_assignment_selection
        distinguishing_aspect: |
          The gate crosses aggregates: the Entry lives under a Regatta while the pinned
          RatingCertificate lives in the boat registry, so an implementation that validates only
          Regatta-local state lets the assignment through. A DRAFT certificate already carries a fully
          computed band_key_spm of 171.3 and the division band 150.0 to 230.0 would accept it, so the
          refusal cannot come from the selector -- it can only come from reading the OTHER entity status.
          Issuing the certificate, with no change at all to the entry or the division, flips the same
          call from 409 to 200.
        test_recipe:
          setup:
            - "Three club members, one MONOHULL boat and one certificate minted but deliberately left in status DRAFT, whose band_key_spm is 171.3."
            - "A regatta in status SI_PUBLISHED with one division banded 150.0 to 230.0, MONOHULL, min_entries 2, PROVISIONAL."
            - "Entry A is submitted against the DRAFT certificate with a complete one-member crew manifest, and division_id is still null."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Certificate Gate Regatta", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v2: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions revision 1", effective_utc: "2026-07-15T00:00:00Z", expected_regatta_version: "${reg_v2}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "A", boat_type_filter: "MONOHULL", rating_band_low: 150.0, rating_band_high: 230.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_a: $.data.id } }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_a}", helm_member_id: "${m_h1}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_a: $.data.id } }
            - { call: "POST /regatta-ops/entries/${e_a}/crew", payload: { member_id: "${m_h1}", position: "HELM", weight_kg: 84.0 }, as: Competitor, as_user_id: "${m_h1}" }
          trigger:
            - { call: "POST /regatta-ops/entries/${e_a}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/entries/${e_a}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "trigger call 1 returns HTTP 409 with error_id ERR_CERTIFICATE_NOT_ISSUED while RatingCertificate.${c_a}.status is DRAFT"
            - "after trigger call 1, Entry.${e_a}.division_id == null and Division.${div_a}.assigned_entry_count == 0, so the refusal left no partial write"
            - "trigger call 2 moves RatingCertificate.${c_a}.status to ISSUED with supersedes_certificate_id null"
            - "trigger call 3, byte-identical to trigger call 1, returns HTTP 200 and Entry.${e_a}.division_id == ${div_a}"
            - "Division.${div_a}.assigned_entry_count == 1 and accepted_entry_count == 0 and status PROVISIONAL"
            - "RatingCertificate.${c_a}.band_key_spm == 171.3 both before and after the issue, proving the selector inputs never changed"
            - "Entry.${e_a}.registration_status == SUBMITTED and inspection_status == NOT_INSPECTED throughout"

      - name: schedule_hearing_requires_seated_jury_panel
        entity_pair: "Protest depends on JuryPanel"
        grounds:
          - validations.priority_39_ERR_JURY_QUORUM_NOT_MET
          - endpoints.POST_protests_id_schedule_hearing
          - state_machines.JuryPanel.status.FORMING_to_SEATED
          - state_machines.Protest.status.FILED_to_HEARING_SCHEDULED
        distinguishing_aspect: |
          A different entity pair and a different shape of dependency: the gate is not another row
          lifecycle flag but an aggregate COUNT on the other entity, seated_member_count against
          Regatta.jury_quorum_required, and the protest itself is perfectly schedulable. The regatta
          already owns one SEATED panel -- the one that let racing open -- so an implementation that
          checks "the regatta has a seated panel" instead of "the panel NAMED IN THE PAYLOAD is seated"
          accepts the first call. Seating one more judge on the named panel, touching nothing on the
          protest, flips the identical call from 409 to 200.
        test_recipe:
          setup:
            - "Eleven club members, including three certified judges plus a second REGIONAL chair, and two ISSUED TOD_PHRF certificates A 171.3 and B 218.8."
