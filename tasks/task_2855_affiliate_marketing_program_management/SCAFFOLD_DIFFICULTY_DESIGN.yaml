              as: Anonymous
              captures: { aff_id: $.data.id, aff_v1: $.data.version }
            - call: "POST /affiliates/${aff_id}/applications"
              payload: { site_url: "https://scanmedia.example", primary_traffic_source: "CONTENT_NEWSLETTER", monthly_traffic_estimate: 90000, declared_promo_methods: ["EDITORIAL_CONTENT"], product_categories: ["APPAREL"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { app_id: $.data.id }
            - call: "POST /affiliate-applications/${app_id}/screen"
              payload: { domain_authority: 80, content_originality_pct: 92, broken_link_ratio_bps: 200, brand_safety_flag_count: 0, restricted_vertical_overlap_bps: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /affiliate-applications/${app_id}/decide"
              payload: { decision: "APPROVE", decision_notes: "ok", expected_affiliate_version: "${aff_v1}" }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /monitoring-scans"
              payload: { affiliate_id: "${aff_id}", engine: "GOOGLE_ADS", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-15T00:00:00Z", trademark_hits: 0, forced_click_ratio_bps: 0, cookie_stuffing_index: 0, unauthorized_coupon_hits: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
              captures: { scan1_id: $.data.id }
          trigger:
            - call: "POST /monitoring-scans"
              payload: { affiliate_id: "${aff_id}", engine: "GOOGLE_ADS", window_start: "2026-07-15T00:00:00Z", window_end: "2026-07-20T00:00:00Z", trademark_hits: 0, forced_click_ratio_bps: 0, cookie_stuffing_index: 0, unauthorized_coupon_hits: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /monitoring-scans"
              payload: { affiliate_id: "${aff_id}", engine: "GOOGLE_ADS", window_start: "2026-07-15T12:00:00Z", window_end: "2026-07-20T00:00:00Z", trademark_hits: 0, forced_click_ratio_bps: 0, cookie_stuffing_index: 0, unauthorized_coupon_hits: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /monitoring-scans"
              payload: { affiliate_id: "${aff_id}", engine: "GOOGLE_ADS", window_start: "2026-07-16T00:00:00Z", window_end: "2026-07-20T00:00:00Z", trademark_hits: 0, forced_click_ratio_bps: 0, cookie_stuffing_index: 0, unauthorized_coupon_hits: 0 }
              as: ComplianceAnalyst
