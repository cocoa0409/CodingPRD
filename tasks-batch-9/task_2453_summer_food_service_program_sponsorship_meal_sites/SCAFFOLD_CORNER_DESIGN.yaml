              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/area-eligibility-records"
              payload: { area_code: "CT-0031", data_source: "SCHOOL_DATA", free_reduced_pct: 62.50, determination_date: "2026-03-15", valid_through_date: "2031-06-30" }
              as: StateAgencyReviewer
