              payload: { system_code: "CD-ACK", name: "Acknowledging Consumer", propagation_mode: "BATCH", ack_required: true, max_concurrent_dispatch: 1 }
              as: MpiAdmin
              captures: { sys_ack_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
