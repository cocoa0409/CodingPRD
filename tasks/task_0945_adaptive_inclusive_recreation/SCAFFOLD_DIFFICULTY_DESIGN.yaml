scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: series_flat_remainder_lands_on_sequence_one_not_per_session
        grounds:
          - calculations.participant_session_fee_cents
          - entities.EnrollmentCharge.fields.program_fee_cents
          - entities.ProgramSession.fields.sequence_number
          - entities.ActivityProgram.fields.pricing_mode
        distinguishing_aspect: |
          The dual-variant subject is money on the EnrollmentCharge domain: with one
          FeeScaleBand and one multiplier, SERIES_FLAT divides 27000 across 7 scheduled
          sessions and loads the whole remainder onto sequence_number 1 (3858 vs 3857),
          while PER_SESSION on the same band yields 4500 — three different cents figures
          from identical participant data.
        test_recipe:
          setup:
            - "One FeeScaleBand covering household sizes 1-6 in BAND_C at 4000 per session and 24000 per series."
            - "Two ActivityPrograms with fee_multiplier_bp 11250: one SERIES_FLAT with scheduled_session_count 7, one PER_SESSION."
            - "Two sessions on the SERIES_FLAT program (sequence 1 and 2) and one on the PER_SESSION program, all OPEN and more than 24 hours ahead of the 2026-05-01 clock."
            - "One ACTIVE participant in BAND_C with household_size 3."
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Adaptive Aquatics Series", activity_type: "AQUATICS", risk_tier: "LOW", pricing_mode: "SERIES_FLAT", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 11250, scheduled_session_count: 7, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog_series: "$.data.id" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Adaptive Aquatics Drop-in", activity_type: "AQUATICS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 11250, scheduled_session_count: 7, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog_per: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog_series}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T11:00:00Z", slot_capacity: 5, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { s_ser1: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog_series}", start_at: "2026-06-08T09:00:00Z", end_at: "2026-06-08T11:00:00Z", slot_capacity: 5, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { s_ser2: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog_per}", start_at: "2026-06-15T09:00:00Z", end_at: "2026-06-15T11:00:00Z", slot_capacity: 5, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { s_per: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p1}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "INDEPENDENT", expected_participant_version: "${p1_v}" }
              as: IntakeCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a1}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/program-sessions/${s_ser1}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /recreation/program-sessions/${s_ser2}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /recreation/program-sessions/${s_per}/open"
              payload: {}
              as: ProgramAdmin
            - call: "GET /recreation/program-sessions/${s_ser1}"
              payload: {}
              as: ProgramAdmin
              captures: { s_ser1_v: "$.data.version" }
            - call: "GET /recreation/program-sessions/${s_ser2}"
              payload: {}
              as: ProgramAdmin
              captures: { s_ser2_v: "$.data.version" }
            - call: "GET /recreation/program-sessions/${s_per}"
              payload: {}
              as: ProgramAdmin
              captures: { s_per_v: "$.data.version" }
          trigger:
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${s_ser1}", expected_session_version: "${s_ser1_v}" }
              as: IntakeCoordinator
              captures: { e_ser1: "$.data.id" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${s_ser2}", expected_session_version: "${s_ser2_v}" }
              as: IntakeCoordinator
              captures: { e_ser2: "$.data.id" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${s_per}", expected_session_version: "${s_per_v}" }
              as: IntakeCoordinator
              captures: { e_per: "$.data.id" }
            - call: "GET /recreation/enrollment-charges"
              payload: { enrollment_id: "${e_ser1}" }
              as: FundingOfficer
              captures: { ch_ser1_fee: "$.data[0].program_fee_cents" }
            - call: "GET /recreation/enrollment-charges"
              payload: { enrollment_id: "${e_ser2}" }
              as: FundingOfficer
              captures: { ch_ser2_fee: "$.data[0].program_fee_cents" }
            - call: "GET /recreation/enrollment-charges"
              payload: { enrollment_id: "${e_per}" }
              as: FundingOfficer
              captures: { ch_per_fee: "$.data[0].program_fee_cents" }
          assert:
            - "EnrollmentCharge(enrollment_id=${e_ser1}).program_fee_cents == 3858"
            - "EnrollmentCharge(enrollment_id=${e_ser2}).program_fee_cents == 3857"
            - "EnrollmentCharge(enrollment_id=${e_per}).program_fee_cents == 4500"
            - "EnrollmentCharge(enrollment_id=${e_ser1}).fee_scale_band_id == ${band_c}"
            - "ProgramSession.${s_ser1}.sequence_number == 1 and ProgramSession.${s_ser2}.sequence_number == 2"

      - name: staffing_requirement_planned_two_but_delivered_one
        grounds:
          - calculations.required_group_staff_count
          - entities.ProgramSession.fields.required_group_staff_planned
          - entities.ProgramSession.fields.required_group_staff_delivered
          - state_machines.ProgramSession.STAFFING_LOCKED_to_DELIVERED
        distinguishing_aspect: |
          The dual-variant subject is whole staffers on the ProgramSession domain, a
          different entity domain from the EnrollmentCharge money variant: three
          SUBSTANTIAL participants on a HIGH-risk session require 2 group staff under
          the PLANNED roster (CONFIRMED) and exactly 1 under the DELIVERED roster
          (ATTENDED only), on one and the same session row.
        test_recipe:
          setup:
            - "A HIGH-risk PER_SESSION program with no consent or certification requirements."
            - "One session with slot_capacity 3 and one_to_one_pool_size 0, starting 2026-06-10T14:00Z and ending 16:00Z."
            - "Three ACTIVE participants each holding an ACTIVE SUPPORT assessment at tier SUBSTANTIAL, all CONFIRMED on the session."
            - "Two staff members assigned in the GROUP role so staffing_gap is 0 and the session can be locked."
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Adaptive Climbing", activity_type: "SPORTS", risk_tier: "HIGH", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T14:00:00Z", end_at: "2026-06-10T16:00:00Z", slot_capacity: 3, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sess: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p1}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "SUBSTANTIAL", expected_participant_version: "${p1_v}" }
              as: IntakeCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a1}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ben Osei", date_of_birth: "2009-07-15", household_id: "HH-2", household_size: 3, income_band: "BAND_C", weight_kg: 45, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p2: "$.data.id", p2_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p2}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "SUBSTANTIAL", expected_participant_version: "${p2_v}" }
              as: IntakeCoordinator
              captures: { a2: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a2}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p2}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/participants"
              payload: { legal_name: "Cleo Vance", date_of_birth: "2008-11-02", household_id: "HH-3", household_size: 3, income_band: "BAND_C", weight_kg: 50, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p3: "$.data.id", p3_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p3}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "SUBSTANTIAL", expected_participant_version: "${p3_v}" }
              as: IntakeCoordinator
              captures: { a3: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a3}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p3}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/staff-members"
              payload: { full_name: "Dana Lead", role_title: "Recreation Therapist" }
              as: ProgramAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /recreation/staff-members"
              payload: { full_name: "Eli Support", role_title: "Program Aide" }
              as: ProgramAdmin
              captures: { st2: "$.data.id" }
            - call: "POST /recreation/program-sessions/${sess}/open"
              payload: {}
              as: ProgramAdmin
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv1: "$.data.version" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${sess}", expected_session_version: "${sv1}" }
              as: IntakeCoordinator
              captures: { e1: "$.data.id" }
            - call: "POST /recreation/enrollments/${e1}/confirm"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv2: "$.data.version" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p2}", session_id: "${sess}", expected_session_version: "${sv2}" }
              as: IntakeCoordinator
              captures: { e2: "$.data.id" }
            - call: "POST /recreation/enrollments/${e2}/confirm"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv3: "$.data.version" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p3}", session_id: "${sess}", expected_session_version: "${sv3}" }
              as: IntakeCoordinator
              captures: { e3: "$.data.id" }
            - call: "POST /recreation/enrollments/${e3}/confirm"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/staff-assignments"
              payload: { session_id: "${sess}", staff_member_id: "${st1}", assignment_role: "LEAD" }
              as: ProgramAdmin
              captures: { asg1: "$.data.id" }
            - call: "POST /recreation/staff-assignments"
              payload: { session_id: "${sess}", staff_member_id: "${st2}", assignment_role: "GROUP" }
              as: ProgramAdmin
              captures: { asg2: "$.data.id" }
            - call: "GET /recreation/program-sessions/${sess}/staffing-summary"
              payload: {}
              as: ProgramAdmin
              captures: { planned_before: "$.data.required_group_staff_planned" }
            - call: "POST /recreation/program-sessions/${sess}/lock-staffing"
              payload: {}
              as: ActivityLead
              as_user_id: "${st1}"
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T15:00:00Z" }
              as: ProgramAdmin
            - call: "POST /recreation/enrollments/${e1}/attendance"
              payload: { outcome: "ATTENDED" }
              as: ActivityLead
              as_user_id: "${st1}"
            - call: "POST /recreation/enrollments/${e2}/attendance"
              payload: { outcome: "ATTENDED" }
              as: ActivityLead
              as_user_id: "${st1}"
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T16:30:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /recreation/program-sessions/${sess}/deliver"
              payload: {}
              as: ActivityLead
              as_user_id: "${st1}"
              captures: { planned_after: "$.data.required_group_staff_planned", delivered_after: "$.data.required_group_staff_delivered" }
          assert:
            - "ProgramSession.${sess}.required_group_staff_planned == 2 before the deliver call (pooled points 300, HIGH multiplier, ceil(450/400) = 2)"
            - "ProgramSession.${sess}.required_group_staff_delivered == 1 after the deliver call (pooled points 200, ceil(300/400) = 1)"
            - "Enrollment.${e3}.enrollment_status == NO_SHOW"
            - "Enrollment.${e1}.enrollment_status == ATTENDED and Enrollment.${e2}.enrollment_status == ATTENDED"
            - "ProgramSession.${sess}.status == DELIVERED"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes (a), (b), (c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: staff_requirement_nested_ceilings_in_the_pinned_order
        grounds:
          - calculations.required_group_staff_count
          - calculations.session_staffing_gap
          - entities.ActivityProgram.fields.risk_tier
          - entities.ProgramSession.fields.required_group_staff_planned
        distinguishing_aspect: |
          Mode (a): four inputs (pooled support points, risk multiplier, staff point
          capacity, MIN_GROUP_STAFF floor) interact non-linearly through two nested
          ceilings whose ORDER is pinned — 250 points at HIGH risk gives
          ceil(ceil(250*1.5)/400) = 1, whereas the reversed order ceil(250/400)*1.5
          ceiled gives 2. Exactly one of the two answers is correct.
        test_recipe:
          setup:
            - "A HIGH-risk program with no consent or certification requirements."
            - "One OPEN session with slot_capacity 3, one_to_one_pool_size 0."
            - "Three ACTIVE participants with ACTIVE assessments at SUBSTANTIAL, SUBSTANTIAL and INTERMITTENT, giving 250 pooled support points once all three are CONFIRMED."
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Adaptive Cycling", activity_type: "SPORTS", risk_tier: "HIGH", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T14:00:00Z", end_at: "2026-06-10T16:00:00Z", slot_capacity: 3, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sess: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p1}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "SUBSTANTIAL", expected_participant_version: "${p1_v}" }
              as: IntakeCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a1}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ben Osei", date_of_birth: "2009-07-15", household_id: "HH-2", household_size: 3, income_band: "BAND_C", weight_kg: 45, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p2: "$.data.id", p2_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p2}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "SUBSTANTIAL", expected_participant_version: "${p2_v}" }
              as: IntakeCoordinator
              captures: { a2: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a2}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p2}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/participants"
              payload: { legal_name: "Cleo Vance", date_of_birth: "2008-11-02", household_id: "HH-3", household_size: 3, income_band: "BAND_C", weight_kg: 50, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p3: "$.data.id", p3_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p3}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "INTERMITTENT", expected_participant_version: "${p3_v}" }
              as: IntakeCoordinator
              captures: { a3: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a3}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p3}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/program-sessions/${sess}/open"
              payload: {}
              as: ProgramAdmin
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv1: "$.data.version" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${sess}", expected_session_version: "${sv1}" }
              as: IntakeCoordinator
              captures: { e1: "$.data.id" }
            - call: "POST /recreation/enrollments/${e1}/confirm"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv2: "$.data.version" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p2}", session_id: "${sess}", expected_session_version: "${sv2}" }
              as: IntakeCoordinator
              captures: { e2: "$.data.id" }
            - call: "POST /recreation/enrollments/${e2}/confirm"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv3: "$.data.version" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p3}", session_id: "${sess}", expected_session_version: "${sv3}" }
              as: IntakeCoordinator
              captures: { e3: "$.data.id" }
          trigger:
            - call: "POST /recreation/enrollments/${e3}/confirm"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /recreation/program-sessions/${sess}/staffing-summary"
              payload: {}
              as: ProgramAdmin
              captures: { pts: "$.data.pooled_support_points", req: "$.data.required_group_staff_planned", gap: "$.data.staffing_gap" }
          assert:
            - "staffing-summary.pooled_support_points == 250"
            - "staffing-summary.required_group_staff_planned == 1"
            - "staffing-summary.staffing_gap == 1"
            - "ProgramSession.${sess}.one_to_one_committed == 0"

      - name: family_responsibility_round_per_line_is_one_cent_above_round_on_total
        grounds:
          - calculations.family_responsibility_total_cents
          - calculations.sibling_discount_bp
          - calculations.transport_fare_cents
          - entities.ActivityProgram.fields.rounding_policy
          - entities.EnrollmentCharge.fields.family_responsibility_cents
        distinguishing_aspect: |
          Mode (b): identical inputs (copay 5010, transport 1250, discount 1500 bp)
          produce 5322 under ROUND_PER_LINE and 5321 under ROUND_ON_TOTAL, because both
          per-line products end in exactly .5 cents. The scaffold pins the order per
          program, so the one-cent gap is a deterministic assertion, not a tolerance.
        test_recipe:
          setup:
            - "One FeeScaleBand for BAND_C households 1-6 priced at 5010 cents per session."
