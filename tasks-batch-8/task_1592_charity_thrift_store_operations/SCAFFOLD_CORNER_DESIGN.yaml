            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
            - call: "POST /api/items/${i1}/to-floor"
              as: Pricer
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 10000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${i1}"], payment_method: "CASH" }
