              as: ClaimsExaminer
              captures: { bill_a1_id: "$.data.id" }
            - call: "POST /provider-bills/${bill_a1_id}/reprice"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /provider-bills"
              payload: { claim_id: "${claim_a_id}", provider_npi: "1447203981", provider_name: "Northside Imaging", network_status: "OUT_OF_NETWORK", service_category: "DIAGNOSTIC_IMAGING", service_date: "2026-07-11", billed_charge_cents: 480000, fee_schedule_amount_cents: 260000 }
              as: ClaimsExaminer
              captures: { bill_a2_id: "$.data.id" }
            - call: "POST /provider-bills/${bill_a2_id}/reprice"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /provider-bills"
              payload: { claim_id: "${claim_b_id}", provider_npi: "1730294856", provider_name: "Riverside General ED", network_status: "IN_NETWORK", service_category: "EMERGENCY_ROOM", service_date: "2026-07-11", billed_charge_cents: 620000, fee_schedule_amount_cents: 385000 }
              as: ClaimsExaminer
              captures: { bill_b1_id: "$.data.id" }
            - call: "POST /provider-bills/${bill_b1_id}/reprice"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /provider-bills"
              payload: { claim_id: "${claim_b_id}", provider_npi: "1447203981", provider_name: "Northside Imaging", network_status: "OUT_OF_NETWORK", service_category: "DIAGNOSTIC_IMAGING", service_date: "2026-07-11", billed_charge_cents: 480000, fee_schedule_amount_cents: 260000 }
              as: ClaimsExaminer
              captures: { bill_b2_id: "$.data.id" }
            - call: "POST /provider-bills/${bill_b2_id}/reprice"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /claims/${claim_a_id}/request-eob"
              payload: { note: "requesting explanation of benefits from Buckeye Mutual" }
              as: ClaimsExaminer
            - call: "GET /claims/${claim_a_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { claim_a_v: "$.data.version" }
            - call: "POST /coordination-records"
              payload: { claim_id: "${claim_a_id}", provider_bill_id: "${bill_a1_id}", family_health_plan_id: "${fhp1_id}", eob_received_date: "2026-07-20", other_plan_allowed_cents: 0, other_plan_paid_cents: 0, patient_responsibility_cents: 0, expected_claim_version: "${claim_a_v}" }
              as: ClaimsExaminer
            - call: "POST /claims/${claim_b_id}/confirm-no-other-coverage"
              payload: { attestation_note: "guardian attests no other health coverage exists for this athlete" }
              as: ClaimsExaminer
          trigger:
            - call: "POST /claims/${claim_a_id}/adjudicate"
              payload: { examiner_note: "covered GAME activity, excess of other coverage" }
              as: ClaimsExaminer
            - call: "POST /claims/${claim_b_id}/adjudicate"
              payload: { examiner_note: "covered GAME activity, program primary on a full-excess footing" }
              as: ClaimsExaminer
          assert:
            - "ProviderBill.${bill_a1_id}.allowed_amount_cents == 385000"
            - "ProviderBill.${bill_a2_id}.allowed_amount_cents == 345000"
            - "ProviderBill.${bill_a2_id}.family_responsibility_cents == 15000"
            - "Claim.${claim_a_id}.allowed_amount_total_cents == 730000"
            - "Claim.${claim_b_id}.allowed_amount_total_cents == 730000"
            - "Claim.${claim_a_id}.coordination_basis == EXCESS_OF_OTHER"
            - "Claim.${claim_b_id}.coordination_basis == FULL_EXCESS"
            - "Claim.${claim_a_id}.deductible_applied_cents == 25000"
            - "Claim.${claim_b_id}.deductible_applied_cents == 50000"
            - "Claim.${claim_a_id}.benefit_before_limit_cents == 705000"
            - "Claim.${claim_b_id}.benefit_before_limit_cents == 680000"
            - "Claim.${claim_a_id}.benefit_payable_cents == 705000"
            - "Claim.${claim_b_id}.benefit_payable_cents == 680000"
            - "Claim.${claim_a_id}.benefit_payable_cents - Claim.${claim_b_id}.benefit_payable_cents == 25000"
            - "Claim.${claim_a_id}.adjudication_status == APPROVED"
            - "Claim.${claim_b_id}.adjudication_status == APPROVED"

