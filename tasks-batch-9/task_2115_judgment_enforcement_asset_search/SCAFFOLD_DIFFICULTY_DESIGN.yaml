              captures: { cf_id: $.data.id }
            - call: "POST /county-filings/${cf_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /county-filings/${cf_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
            - call: "POST /asset-findings"
              payload: { judgment_id: "${jud_id}", asset_type: "BANK_ACCOUNT", institution_name: "First Pacific Bank", identifier_last4: "8811", estimated_value_cents: 10000000, source: "PUBLIC_RECORD" }
