  - section: rbac
    instances:

      - name: every_exclusive_operation_is_refused_to_the_neighbouring_role
        claim_type: exclusive_operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.ContentManager.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - errors.ERR_UNAUTHORIZED_ROLE
          - validations.priority_2_ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "Each declared exclusive operation is exercised twice — once by its owning role (success) and once by a role that owns a different exclusive slice (403 ERR_UNAUTHORIZED_ROLE) — so no role's write surface leaks to a peer."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z (the default). No fixtures are needed beyond a zone and cluster to make the store and bundle calls well-formed."
          setup_api_calls:
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K001", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_X", currency_code: "USD", price_multiplier_bp: 10000, psychological_rounding: "NONE", tax_rate_bp: 700, max_uplift_bp: 2000 }
              as: ContentManager
              captures: { zone_denied_err: $.data.error_id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S099", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PricingAnalyst
              captures: { store_denied_err: $.data.error_id }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-01T00:00:00Z" }
              as: PricingApprover
              captures: { bundle_denied_err: $.data.error_id }
            - call: "POST /kiosk-ops/devices/${dev_id}/payment-attestation"
              payload: { pin_pad_firmware_version: "1.4.2", p2pe_certified: true, attestation_expiry_utc: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { attest_denied_err: $.data.error_id }
            - call: "POST /kiosk-ops/devices/${dev_id}/payment-attestation"
              payload: { pin_pad_firmware_version: "1.4.2", p2pe_certified: true, attestation_expiry_utc: "2027-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { attest_state: $.data.payment_compliance_state }
          assert:
            - "${zone_denied_err} == ERR_UNAUTHORIZED_ROLE with HTTP 403 — price zones are PlatformAdmin-only"
            - "${store_denied_err} == ERR_UNAUTHORIZED_ROLE with HTTP 403 — stores are PlatformAdmin-only"
            - "${bundle_denied_err} == ERR_UNAUTHORIZED_ROLE with HTTP 403 — content bundles are ContentManager-only"
            - "${attest_denied_err} == ERR_UNAUTHORIZED_ROLE with HTTP 403 — even PlatformAdmin cannot attest a payment device"
            - "${attest_state} == COMPLIANT: the same payload from ComplianceOfficer succeeds, proving the refusal was about the role and not the body"
            - "GET /kiosk-ops/price-zones?limit=100 returns total_count 1 — none of the refused writes created a row"

      - name: a_missing_role_header_is_unauthenticated_before_any_role_check
        claim_type: denial
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1_ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "Priority 1 outranks priority 2: a request that omits X-User-Role entirely returns ERR_UNAUTHENTICATED (401) even when the operation it names is one no role could perform anonymously, and an unrecognised role value is also 401 rather than 403."
        test_recipe:
          setup:
            - "One price zone exists so the GET path below names a real resource; the auth ladder is evaluated before the 404 lookup at priority 5."
          setup_api_calls:
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
          trigger:
            - call: "GET /kiosk-ops/price-zones/${zone_a_id}"
              payload: {}
              as: ""
              captures: { no_header_err: $.data.error_id }
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_Y", currency_code: "USD", price_multiplier_bp: 10000, psychological_rounding: "NONE", tax_rate_bp: 700, max_uplift_bp: 2000 }
              as: "NotARole"
              captures: { bad_role_err: $.data.error_id }
            - call: "GET /kiosk-ops/price-zones/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ""
              captures: { unknown_and_anon_err: $.data.error_id }
          assert:
            - "${no_header_err} == ERR_UNAUTHENTICATED with HTTP 401 — an empty X-User-Role header (sent as the empty string, not spaces) is unauthenticated"
            - "${bad_role_err} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_UNAUTHORIZED_ROLE: a value outside the seven declared roles never reaches priority 2"
            - "${unknown_and_anon_err} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_RESOURCE_NOT_FOUND — priority 1 precedes priority 5"
            - "GET /kiosk-ops/price-zones?limit=100 as PlatformAdmin still returns total_count 1"

      - name: a_device_agent_may_only_speak_for_its_own_device
        claim_type: peer_roles
        grounds:
          - roles.DeviceAgent.exclusive_operations
          - errors.ERR_DEVICE_IDENTITY_MISMATCH
          - validations.priority_3_ERR_DEVICE_IDENTITY_MISMATCH
        distinguishing_aspect: "The DeviceAgent role passes the role gate at priority 2 but is then bound to its own identity at priority 3: K001's agent heart-beating for K002 gets ERR_DEVICE_IDENTITY_MISMATCH (403), and the mismatch outranks the 404 for an unknown device id."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001; two kiosks K001 and K002 registered under S001."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
