        distinguishing_aspect: "The accessibility path has one 422 shape rule and one 409 business rule and they must not be conflated: an array whose length differs from section_count and an array with an element outside [0, 1] are both ERR_SECTION_SCORE_SHAPE at 422 before any index is computed, whereas a well-shaped but low-scoring submission is accepted, computes a11y_index 80.00 with conformance_level FAIL, and only refuses at publish with ERR_A11Y_GATE_NOT_MET at 409."
