      - name: subcert_submit_forks_into_submitted_or_exception_noted_with_divergent_side_effects
        grounds:
          - state_machines.SubCertificationRequest.PENDING_to_SUBMITTED
          - state_machines.SubCertificationRequest.PENDING_to_EXCEPTION_NOTED
          - calculations.subcert_scope_weight
          - calculations.cycle_total_assigned_scope_weight
          - calculations.certification_coverage_pct
        distinguishing_aspect: |
          One trigger (action=SUBMIT) forks on the presence of exception_severity, and the two arms
          run DIFFERENT side-effect sets on rows that are otherwise identical (same scope_area
          OPERATIONS, both non-officer holders, both weighted 20.00 at creation). The SUBMITTED arm
          moves only the coverage numerator and leaves total_assigned_scope_weight at 40.00; the
          EXCEPTION_NOTED arm re-runs subcert_scope_weight, so the row becomes 28.00 and BOTH the
          numerator and the denominator move, pushing the cycle total to 48.00 while coverage still
          lands on exactly 100.00. An implementation that treats the fork as one arm cannot produce
          both 40.00 and 48.00 from the same starting pair, and the EXCEPTION_NOTED arm additionally
          requires a non-empty exception_note (ERR_INVALID_REQUEST when omitted).
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 2, required_functions [FINANCE, LEGAL]) with one ACTIVE voting non-officer FINANCE member and one ACTIVE voting non-officer LEGAL member."
            - "A ReportingCycle in CLOSE_OPEN carrying two PENDING SubCertificationRequest rows of scope_area OPERATIONS, one per member, each weighted 20.00; total_assigned_scope_weight 40.00, certification_coverage_pct 0.00."
