            - { call: "POST /mga/policies/${pol}/claims", payload: { claim_type: "LIABILITY", occurrence_date: "2026-08-10T00:00:00Z", amount_claimed_cents: 150000 }, as: MGAUnderwriter, captures: { clA: $.data.id } }
