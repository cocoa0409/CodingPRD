            - "GET /ticketing/hospitality-packages?game_id=${g1} returns total_count == 2"

  - rule_id: compensating_invariant
    instances:
      - name: hold_release_restores_the_seat_census_identity
        grounds:
          - state_machines.SeatHold.ACTIVE_to_RELEASED
          - calculations.seat_occupancy_and_season_census
          - entities.Season.fields.available_seat_count
          - entities.Season.fields.held_seat_count
          - entities.Season.fields.assigned_seat_count
          - endpoints[POST /ticketing/seat-holds/{hold_id}/release]
        distinguishing_aspect: |
          Conserved quantity #1 is a seat count: available_seat_count + held_seat_count +
          assigned_seat_count must equal total_seat_count before the hold, while it is held, and after the
          release, with every seat back in the AVAILABLE bucket - no seat may leak into HELD.
        test_recipe:
          setup:
            - "Season in RENEWAL_OPEN with exactly four ZONE_C seats, so total_seat_count is 4 and available_seat_count is 4"
            - "An account with an assigned rep and no orders"
            - "One ACTIVE GROUP_HOLD on seat s1 over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), covering the clock, so the census reads available 3 / held 1 / assigned 0"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "RIV", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_C", seat_number_from: 1, seat_number_to: 4 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}"], min_seats: 1, max_seats: 4 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
              payload: {}
              as: RevenueManager
            - call: "POST /ticketing/seasons/${season_id}/open-renewal"
              payload: {}
              as: TicketOpsAdmin
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep North", territory_code: "NORTH", book_capacity: 5 }
              as: TicketOpsAdmin
              captures: { rep1: "$.data.id" }
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "GROUP", territory_code: "NORTH", tenure_years: 0 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /ticketing/accounts/${acct1}/assign-rep"
              payload: {}
              as: TicketOpsAdmin
              captures: { rep_of_acct1: "$.data.assigned_rep_id" }
            - call: "GET /ticketing/seats/${s1}"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { s1_v0: "$.data.version" }
            - call: "POST /ticketing/seat-holds"
              payload: { seat_id: "${s1}", account_id: "${acct1}", hold_type: "GROUP_HOLD", hold_window_start_utc: "2026-08-01T00:00:00Z", hold_window_end_utc: "2026-09-01T00:00:00Z", expected_seat_version: "${s1_v0}" }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { hold1: "$.data.id" }
            - call: "GET /ticketing/seasons/${season_id}"
              payload: {}
              as: TicketOpsAdmin
              captures: { held_mid: "$.data.held_seat_count" }
          trigger:
            - call: "POST /ticketing/seat-holds/${hold1}/release"
              payload: { release_reason: "customer declined" }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { hold_state: "$.data.hold_status" }
          assert:
            - "before release: Season.${season_id}.available_seat_count == 3, held_seat_count == 1, assigned_seat_count == 0, total_seat_count == 4"
            - "after release: Season.${season_id}.available_seat_count == 4, held_seat_count == 0, assigned_seat_count == 0, total_seat_count == 4"
            - "available_seat_count + held_seat_count + assigned_seat_count == total_seat_count at both observations"
            - "SeatHold.${hold1}.hold_status == RELEASED"
            - "SeatHold.${hold1}.released_reason == customer declined"
            - "Seat.${s1}.seat_status == AVAILABLE"
            - "Seat.${s1}.assigned_account_id == null"

      - name: order_cancel_restores_the_contracted_revenue_ledger
        grounds:
          - state_machines.PlanOrder.CONFIRMED_to_CANCELLED
          - state_machines.PlanOrder.payment_status.PARTIALLY_PAID_to_REFUNDED
          - entities.Season.fields.contracted_revenue_cents
          - entities.TicketAccount.fields.loyalty_credit_cents
          - endpoints[POST /ticketing/plan-orders/{order_id}/cancel]
        distinguishing_aspect: |
          Conserved quantity #2 is money rather than seat count: contracted_revenue_cents must equal
          sum(final_total_cents of CONFIRMED orders) plus sum(total_due_cents of CONFIRMED/SETTLED
          packages) both before and after the cancel, so cancelling the only confirmed order returns the
          ledger to exactly 0 while the 5000 already paid moves into loyalty_credit_cents.
        test_recipe:
          setup:
            - "Season in RENEWAL_OPEN with four ZONE_C seats and one PREMIUM/WEEKEND/85 game"
            - "A CONFIRMED four-seat order with final_total_cents 38430, installment_count 3 and one 5000 payment applied, so contracted_revenue_cents is 38430 and assigned_seat_count is 4"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "RIV", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_C", seat_number_from: 1, seat_number_to: 4 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id", s2: "$.data[1].id", s3: "$.data[2].id", s4: "$.data[3].id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}"], min_seats: 1, max_seats: 8 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
              payload: {}
              as: RevenueManager
            - call: "POST /ticketing/seasons/${season_id}/open-renewal"
              payload: {}
              as: TicketOpsAdmin
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep North", territory_code: "NORTH", book_capacity: 5 }
              as: TicketOpsAdmin
              captures: { rep1: "$.data.id" }
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "INDIVIDUAL", territory_code: "NORTH", tenure_years: 0 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /ticketing/accounts/${acct1}/assign-rep"
              payload: {}
              as: TicketOpsAdmin
              captures: { rep_of_acct1: "$.data.assigned_rep_id" }
            - call: "POST /ticketing/plan-orders"
              payload: { account_id: "${acct1}", plan_id: "${plan_id}", seat_ids: ["${s1}", "${s2}", "${s3}", "${s4}"] }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { order1: "$.data.id" }
            - call: "POST /ticketing/plan-orders/${order1}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
            - call: "POST /ticketing/plan-orders/${order1}/confirm"
              payload: { installment_count: 3 }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
            - call: "POST /ticketing/plan-orders/${order1}/payments"
              payload: { amount_cents: 5000 }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
            - call: "GET /ticketing/seasons/${season_id}"
              payload: {}
              as: TicketOpsAdmin
              captures: { revenue_before: "$.data.contracted_revenue_cents" }
          trigger:
            - call: "POST /ticketing/plan-orders/${order1}/cancel"
              payload: { cancel_reason: "buyer withdrew" }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { order_state: "$.data.order_status" }
          assert:
            - "before cancel: Season.${season_id}.contracted_revenue_cents == 38430 and assigned_seat_count == 4"
            - "after cancel: Season.${season_id}.contracted_revenue_cents == 0"
            - "after cancel: Season.${season_id}.assigned_seat_count == 0 and available_seat_count == 4"
            - "PlanOrder.${order1}.order_status == CANCELLED"
            - "PlanOrder.${order1}.payment_status == REFUNDED"
            - "PlanOrder.${order1}.amount_paid_cents == 5000"
            - "TicketAccount.${acct1}.loyalty_credit_cents == 5000"
            - "TicketAccount.${acct1}.lifetime_value_cents == 0"
            - "GET /ticketing/seat-holds?origin_order_id=${order1}&hold_status=RELEASED returns total_count == 4"
