          assert:
            - "Inspection.${insp_0_id}.final_adjusted_score == 15.00 and final_outcome == CONDITIONAL_PASS"
            - "the ROUTINE 2026-08-11T10:00:00Z window call returns HTTP 409 with data.error_id == ERR_INSPECTION_WINDOW_COOLDOWN"
