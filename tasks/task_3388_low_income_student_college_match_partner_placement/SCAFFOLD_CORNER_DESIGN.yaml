  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: rankings_stale_version_returns_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[ranking-submit-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Application.version: after a first accepted submission advanced the version, a resubmission carrying the pre-submit expected_application_version fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Cycle A in RANKING phase, clock inside the window; one FINALIST application whose first list [col] was accepted (version advanced from ${app_v})."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - call: "POST /colleges"
              payload: { name: "Second U", aid_policy: "NO_LOAN", min_academic_index: 0, match_slots: 1, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { col2: $.data.id }
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
          trigger:
            - call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${col2}", rank_position: 1 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 with error_id ERR_STALE_VERSION (${app_v} is stale after the first accepted list)"
            - "the stored list is still the first one (list_seq 1, college ${col})"

      - name: revise_stale_version_returns_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[aid-revise-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on AidPackage.version: after a finalize advanced the version, a revise carrying the older expected_aid_package_version fails 412 ERR_STALE_VERSION (the package is FINALIZED, so only the version is stale)."
        test_recipe:
          setup: ["Cycle A; matched student with package FINALIZED under VERIFIED (version captured at the first finalize), then revised and re-finalized once more."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkcns
            - *mkprt
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
            - *getmatch
            - *getpkg
            - *mkiv
            - *decide_verify
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { fv: $.data.version }
            - call: "POST /aid-packages/${pkg}/revise"
              payload: { coa_cents: 8100000, expected_aid_package_version: "${fv}" }
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { rv: $.data.version }
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
          trigger:
            - call: "POST /aid-packages/${pkg}/revise"
              payload: { coa_cents: 8200000, expected_aid_package_version: "${fv}" }
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 with error_id ERR_STALE_VERSION (${fv} is two versions behind)"
            - "AidPackage.${pkg}.status remains FINALIZED with coa_cents 8100000"

      - name: application_version_increments_on_each_mutation
        claim_type: version_increment
        grounds: [entities.Application, "concurrency_rules[ranking-submit-occ]"]
        distinguishing_aspect: "The version counter is exact: create -> 1, submit -> 2, review -> 3, accepted rankings -> 4, each observable in the response."
        test_recipe:
          setup: ["Cycle A in RANKING phase with clock inside the window; one ACTIVE college; one student with a DRAFT application."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /applications/${app}/submit"
              as: Student
              as_user_id: "${stu}"
              captures: { v2: $.data.version }
            - *adv
            - call: "POST /applications/${app}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
              captures: { v3: $.data.version }
            - *adv
            - *clock_rank
            - call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${v3}" }
              as: Student
              as_user_id: "${stu}"
              captures: { v4: $.data.version }
          assert:
            - "v1 == 1, v2 == 2, v3 == 3, v4 == 4 — exactly one increment per mutating call"
            - "the rankings call accepted expected_application_version == ${v3}, proving OCC observes the same counter"

      - name: regular_pool_empty_returns_empty_array
        claim_type: selector_empty_fallback
        grounds: [calculations.match_priority_score, "endpoints.GET_/colleges/{id}/regular-pool"]
        distinguishing_aspect: "The selector's empty-pool fallback: with no REGULAR_POOL applications the computed read returns 200 with an empty array and total_count 0, not an error."
        test_recipe:
          setup: ["Cycle A advanced to MATCH_RUN with zero applications; one ACTIVE college."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *adv
            - *adv
            - *clock_nov
            - *adv
          trigger:
            - call: "GET /colleges/${col}/regular-pool"
              payload: { cycle_id: "${cyc}" }
              as: CollegeOfficer
              as_user_id: "${col}"
          assert:
            - "the response status is 200 with an empty data array and total_count 0"

      - name: regular_pool_tie_break_uses_created_at
        claim_type: selector_ordering
        grounds: [calculations.match_priority_score]
        distinguishing_aspect: "Two applications with identical pair scores (both academic_index 1040, no bonuses, STANDARD need) are ordered by Application.created_at ASC — the first-created application leads, never a random id."
        test_recipe:
          setup: ["Cycle A in MATCH_RUN phase; two FINALIST applications with gpa 370 / test 1200 (academic_index 1040), created A before B, neither with prep or referral; both moved to REGULAR_POOL by the phase advance; one NO_LOAN college."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 370, test_score: 1200 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - call: "POST /students"
              payload: { email: "s2@x.com", full_name: "Stu Two", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu2: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 370, test_score: 1200 }
              as: Student
              as_user_id: "${stu2}"
              captures: { app2: $.data.id }
            - call: "POST /applications/${app}/submit"
              as: Student
              as_user_id: "${stu}"
            - call: "POST /applications/${app2}/submit"
              as: Student
              as_user_id: "${stu2}"
            - *adv
            - call: "POST /applications/${app}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
            - call: "POST /applications/${app2}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
            - *adv
            - *clock_nov
            - *adv
          trigger:
            - call: "GET /colleges/${col}/regular-pool"
              payload: { cycle_id: "${cyc}" }
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { first: "$.data[0].id", second: "$.data[1].id" }
          assert:
            - "the first row is ${app} (created earlier) and the second is ${app2} — equal scores fall back to created_at ASC"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: match_run_response_immediately_consistent
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST_/cycles/{id}/run-match"]
        distinguishing_aspect: "Immediate consistency: the run-match response counts and every dependent read (application status, matches list, college counters) agree within the same request timeline, with no reconciliation delay."
