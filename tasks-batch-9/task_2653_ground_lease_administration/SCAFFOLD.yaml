  # ---------- Reads: computed ----------
  - method: GET
    path: "/portfolio/leases/{id}/rent-summary"
    description: "Computed read: the rent picture in force plus the conserved-quantity totals a lender diligences"
    roles: [LessorAdmin, AssetManager, LeaseAccountant, GroundTenant, MortgageeAgent]
    code: 200
    input: []
    output: "{ current_annual_base_rent_cents: integer, percentage_rent_sublease_base_cents: integer, arrears_balance_cents: integer, gfa_allocated_sqft: integer, gfa_unallocated_sqft: integer, deposit_held_cents: integer, deposit_applied_cents: integer, deposit_refunded_cents: integer, active_sublease_count: integer, open_mortgage_principal_cents: integer }"
    side_effects: []

errors:
  # --- not found ---
  - id: ERR_LESSEE_NOT_FOUND
    http: 404
    condition: "lessee_id, transferee_lessee_id or new_lessee_id names no Lessee, or GET /portfolio/lessees/{id} misses"
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "lease_id or a {id} path segment names no Lease"
  - id: ERR_MORTGAGE_NOT_FOUND
    http: 404
    condition: "requested_by_mortgage_id, mortgage_id or a {id} path segment names no LeaseholdMortgage"
  - id: ERR_REVALUATION_NOT_FOUND
    http: 404
    condition: "revaluation_id or a {id} path segment names no RentRevaluation"
  - id: ERR_APPRAISAL_NOT_FOUND
    http: 404
    condition: "GET /portfolio/appraisal-submissions/{id} names no AppraisalSubmission"
  - id: ERR_ARBITRATION_NOT_FOUND
    http: 404
    condition: "an arbitration {id} path segment names no ArbitrationProceeding"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "a percentage-rent-statement {id} path segment names no PercentageRentStatement"
  - id: ERR_ALTERATION_NOT_FOUND
    http: 404
    condition: "an alteration-request {id} path segment names no AlterationRequest"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "parent_transfer_id or a transfer-request {id} path segment names no TransferRequest"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "a default-notice {id} path segment names no DefaultNotice"
  - id: ERR_LOSS_EVENT_NOT_FOUND
    http: 404
    condition: "a loss-event {id} path segment names no LossEvent"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "a reversion-assessment {id} path segment names no ReversionAssessment"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "GET /portfolio/estoppel-certificates/{id} names no EstoppelCertificate"
  # --- authorization ---
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the X-User-Role is not in the endpoint's roles list, or a GroundTenant acts on a lease whose lessee_id is not its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID terminating a default notice is the one that served it, or the X-User-ID applying a reversion holdback equals ReversionAssessment.inspected_by_user_id"
  - id: ERR_APPRAISAL_SIDE_MISMATCH
    http: 403
    condition: "appointed_by is LESSOR but the acting role is GroundTenant, or appointed_by is LESSEE but the acting role is LessorAdmin"
  # --- format and concurrency ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, an enum value is unknown, money or area is negative, a condition score is outside 0-100, basis points are outside 0-10000, or an instant is not ISO 8601 UTC"
  - id: ERR_STALE_LEASE_VERSION
    http: 412
    condition: "expected_lease_version does not equal the lease's current version on statement filing or estoppel issuance"
  - id: ERR_DUPLICATE_RECORD
    http: 409
    condition: "a second appraisal for the same (revaluation_id, appointed_by, round_number), a second open revaluation, arbitration, or reversion assessment for the same parent, a duplicate mortgage priority_rank on one lease, a duplicate ACTIVE sublease premises_unit_code, or a duplicate Lessee legal_name"
  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the entity's current state has no such transition declared in §1.2, including a repeat of an already-applied action and any move out of a terminal state"
  - id: ERR_LEASE_NOT_OPERATIVE
    http: 409
    condition: "a new revaluation, statement, alteration request, transfer request, mortgage or default notice is attempted on a lease whose lease_status is TERMINATED, EXPIRED or REVERTED"
  - id: ERR_CROSS_ENTITY_BLOCKED
    http: 409
    condition: "an arbitration referral while the lease is IN_DEFAULT, a transfer consent while rent_status is IN_ARBITRATION, an alteration approval while a CASUALTY loss event is REPORTED or ADJUSTED, or an estoppel issuance while a revaluation on the lease is ARBITRATION_REFERRED"
  - id: ERR_APPRAISALS_INCOMPLETE
    http: 409
    condition: "exchange is attempted without exactly one LESSOR and one LESSEE appraisal at the revaluation's current round_number"
  - id: ERR_MAX_ROUNDS_REACHED
    http: 409
    condition: "a further negotiation round is opened when round_number already equals MAX_NEGOTIATION_ROUNDS"
  - id: ERR_DIVERGENCE_BELOW_THRESHOLD
    http: 409
    condition: "an arbitration referral is attempted when divergence_bps is at or below ARBITRATION_DIVERGENCE_THRESHOLD_BPS"
  - id: ERR_ELECTION_NOT_AVAILABLE
    http: 409
    condition: "a restoration-or-termination election is attempted on a CONDEMNATION loss event"
  - id: ERR_STANDARD_MET_NO_HOLDBACK
    http: 409
    condition: "a holdback is attempted when weighted_score_bps is at or above the passing score for required_standard_code"
  # --- temporal ---
  - id: ERR_INTERVAL_OVERLAP
    http: 409
    condition: "a half-open construction window, sublease term for one premises_unit_code, or statement period overlaps an existing one; endpoints that merely touch do not overlap"
  - id: ERR_CHRONOLOGY_VIOLATION
    http: 422
    condition: "start is not strictly before end, a valuation_date is inside the REVALUATION_ADVANCE_NOTICE_DAYS window, a statement period_end is in the future, a lessee-cure payment_at precedes served_at, or a sublease term escapes the lease term"
  - id: ERR_CURE_WINDOW_CLOSED
    http: 409
    condition: "a lessee cure, mortgagee cure election or completion, or new-lease election is attempted strictly after its deadline"
  # --- aggregate and financial ---
  - id: ERR_GFA_ENVELOPE_EXCEEDED
    http: 409
    condition: "approving the alteration would push gfa_allocated_sqft above total_permitted_gfa_sqft"
  - id: ERR_SUBLET_AREA_EXCEEDED
    http: 409
    condition: "granting consent would push the lease's consented plus active sublet_area_sqft above total_permitted_gfa_sqft"
  - id: ERR_AMOUNT_NOT_RECONCILED
    http: 422
    condition: "a fee payment amount_cents is not exactly the outstanding balance, an acknowledged_holdback_cents is not exactly the computed holdback, or an adjusted distributable_pool_cents is 0 or less"
  # --- business ---
  - id: ERR_TERMS_INCOHERENT
    http: 422
    condition: "reval_collar_min_uplift_bps is not strictly below reval_collar_max_uplift_bps, percentage_rent_rate_bps is outside 100-2000, expiration_date is not after commencement_date, or total_permitted_gfa_sqft is below 1"
  - id: ERR_USE_NOT_PERMITTED
    http: 422
    condition: "an alteration's proposed_use_code differs from the lease's permitted_use_code, at creation or again at decision time"
  - id: ERR_INSURANCE_DEFICIENT
    http: 409
    condition: "an estoppel certificate is requested while insurance_status is LAPSED or insurance_expires_at is at or before now, or a STRUCTURAL_ALTERATION or REDEVELOPMENT approval is attempted without lessor_additional_insured or with builders_risk_limit_cents below estimated_cost_cents"
  - id: ERR_CREDIT_RATING_REFUSED
    http: 422
    condition: "consent to an ASSIGNMENT is sought for a transferee_credit_rating_code of SPECULATIVE"
  - id: ERR_MORTGAGE_LEASE_MISMATCH
    http: 422
    condition: "the named mortgage does not encumber the lease in question - an estoppel request whose requested_by_mortgage_id sits on another lease, or a mortgagee-cure mortgage_id that is not on the notice's lease"
  - id: ERR_TRANSFER_FIELDS_MISMATCHED
    http: 422
    condition: "an ASSIGNMENT omits transferee_lessee_id or net_consideration_cents, or a SUBLEASE omits premises_unit_code, annual_sublease_rent_cents or sublet_area_sqft"

roles:
  - name: LessorAdmin
    description: "Institutional ground lessor's lease administration desk: papers leases and amendments, records mortgages, opens revaluations and refers disputes, issues estoppel certificates and drives the administration sweep"
    identity: "opaque"
    exclusive_operations: ["create lessees", "execute leases", "amend lease terms", "record leasehold mortgages", "open rent revaluations", "exchange appraisals", "open further negotiation rounds", "settle a revaluation at the midpoint", "refer a revaluation to arbitration", "run administration sweeps", "set the logical clock"]
    shared_operations: ["lodge the LESSOR-side appraisal", "file insurance endorsements", "issue estoppel certificates", "read every resource"]
  - name: AssetManager
    description: "Asset management: consents to alterations, redevelopment and transfers, serves default notices, adjusts loss events and inspects the premises at reversion"
    identity: "opaque"
    exclusive_operations: ["decide alteration requests", "revoke alteration approvals", "decide transfer requests", "adjust loss events", "open reversion assessments", "record reversion inspections", "close reversions"]
    shared_operations: ["serve default notices", "terminate a lease on an uncured default", "report loss events", "apply reversion holdbacks", "read every resource"]
  - name: LeaseAccountant
    description: "Lease accounting: posts rent charges, assesses and audits percentage rent, allocates loss proceeds and applies reversion holdbacks"
    identity: "opaque"
    exclusive_operations: ["post rent charges", "assess percentage-rent statements provisionally", "audit percentage-rent statements", "allocate loss proceeds", "rescind an allocation"]
    shared_operations: ["serve default notices", "terminate a lease on an uncured default", "apply reversion holdbacks", "read lease, statement, transfer, notice and loss-event resources"]
  - name: GroundTenant
    description: "The ground lessee of record; X-User-ID is the Lessee.id currently named on the lease"
    identity: "entity_backed:Lessee"
    exclusive_operations: ["file percentage-rent statements", "apply for alterations", "request transfer consent", "pay transfer fees", "cure its own default", "make the casualty restoration-or-termination election"]
    shared_operations: ["lodge the LESSEE-side appraisal", "file insurance endorsements", "report loss events", "read its own lease's resources"]
  - name: MortgageeAgent
    description: "Servicing agent for a leasehold mortgagee, exercising the notice, cure and new-lease protections"
    identity: "opaque"
    exclusive_operations: ["elect and complete a mortgagee cure", "elect a new lease after termination"]
    shared_operations: ["issue estoppel certificates", "read lease, mortgage, notice, loss-event and certificate resources"]
  - name: Arbitrator
    description: "Neutral appointed on a referred revaluation; files the independent value and issues the baseball award"
    identity: "opaque"
    exclusive_operations: ["issue an arbitration award"]
    shared_operations: ["read the lease, the revaluation, its appraisal submissions and the proceeding"]
