              as: ShopAdmin
              captures: { pkg12_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c12_id}", event_package_id: "${pkg12_id}", paper_stock_id: "${p12_id}", finish_option_id: "${f12_id}" }
              as: Customer
              captures: { d12_id: "$.data.id" }
            - call: "POST /orders"
