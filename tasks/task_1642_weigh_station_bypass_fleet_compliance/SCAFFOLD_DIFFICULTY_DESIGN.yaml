  - rule_id: boundary_precision_check
    instances:
      - name: iss_score_74_vs_75_posture_boundary
        grounds:
          - calculations.carrier_eligibility_posture
          - validations[priority=7]
        distinguishing_aspect: |
          Metric: ISS score (integer) through POST /api/safety-score-snapshots. iss 74 maps to CONDITIONAL
          (approvable) while iss 75 maps to INELIGIBLE (approval rejected ERR_CARRIER_INELIGIBLE_FOR_APPROVAL) —
          the >= boundary at exactly 75 decides both posture and enrollment legality.
        test_recipe:
          setup:
            - "Clock 2026-08-01; two freshly onboarded carriers A (dot 100001) and B (dot 100002), both NOT_EVALUATED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Boundary A" }
              as: PlatformAdmin
              captures: { carA: $.data.id, carA_v: $.data.version }
            - call: "POST /api/carriers"
              payload: { dot_number: "100002", legal_name: "Boundary B" }
              as: PlatformAdmin
              captures: { carB: $.data.id, carB_v: $.data.version }
          trigger:
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${carA}", iss_score: 74, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${carA_v}" }
              as: SafetyDataFeed
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${carB}", iss_score: 75, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${carB_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${carA}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { carA_status: $.data.status }
            - call: "POST /api/carriers/${carB}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { errB: $.data.error_id }
            - call: "GET /api/carriers/${carA}"
              payload: {}
              as: ComplianceOfficer
              captures: { carA_posture: $.data.eligibility_status, carA_iss: $.data.latest_iss_score }
            - call: "GET /api/carriers/${carB}"
              payload: {}
              as: ComplianceOfficer
              captures: { carB_posture: $.data.eligibility_status, carB_iss: $.data.latest_iss_score }
          assert:
            - "Carrier A (iss 74): eligibility_status == CONDITIONAL, latest_iss_score == 74, approve-enrollment succeeds (status ACTIVE)"
            - "Carrier B (iss 75): eligibility_status == INELIGIBLE, latest_iss_score == 75, approve-enrollment rejected with ERR_CARRIER_INELIGIBLE_FOR_APPROVAL"
            - "boundary is inclusive-lower: 74 < 75 is CONDITIONAL, 75 >= 75 is INELIGIBLE"

      - name: wim_weight_at_tolerance_boundary
