            - call: "POST /officials"
              payload: { federation_official_id: "OF-9001", full_name: "Jo Judge", license_roles: ["JUDGE"], license_level: 2, licensed_disciplines: ["JUMPER"], license_expires_on: "2027-12-31T00:00:00Z" }
              as: FederationOfficer
              captures: { judge_id: $.data.id }
            - call: "POST /officials"
