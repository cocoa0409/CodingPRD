              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /esa/students"
              payload: { household_id: "HH-2", first_name: "Luis", last_name: "Ortega", date_of_birth: "2013-06-15", residency_state: "TX", prior_enrollment: "PRIVATE_SCHOOL", income_band: "BAND_B", category_flags: [], has_enrolled_sibling: false }
              as: ProgramAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s1_id}", claimed_income_band: "BAND_A", claimed_category_flags: ["DISABILITY_IEP"] }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /esa/applications/${a1_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s2_id}", claimed_income_band: "BAND_B", claimed_category_flags: [] }
              as: Guardian
              as_user_id: "${s2_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /esa/applications/${a2_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${s2_id}"
            - call: "POST /esa/applications/${a1_id}/eligibility-determinations"
              payload: { residency_check: "PASS", prior_enrollment_check: "PASS", verified_income_band: "BAND_A", verified_prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", verified_category_flags: ["DISABILITY_IEP"] }
              as: EligibilityOfficer
              as_user_id: "eo-1"
              captures: { ed1_score: $.data.priority_score, ed1_tier: $.data.priority_tier }
            - call: "POST /esa/applications/${a2_id}/eligibility-determinations"
              payload: { residency_check: "PASS", prior_enrollment_check: "PASS", verified_income_band: "BAND_B", verified_prior_enrollment: "PRIVATE_SCHOOL", verified_category_flags: [] }
              as: EligibilityOfficer
              as_user_id: "eo-1"
              captures: { ed2_score: $.data.priority_score, ed2_tier: $.data.priority_tier }
            - call: "POST /esa/program-years/${py_id}/awarding-runs"
              payload: {}
              as: ProgramAdmin
              captures: { awarded_count: $.data.awarded_count, waitlisted_count: $.data.waitlisted_count }
            - call: "POST /esa/applications/${a1_id}/accept-award"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { acct1_id: $.data.account_id }
          trigger:
            - call: "POST /esa/applications/${a1_id}/withdraw"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { promoted_id: $.data.promoted_application_id, seats_committed_after: $.data.seats_committed }
          assert:
            - "before the trigger: Application.${a1_id}.priority_tier == 3 with priority_score == 140, Application.${a2_id}.priority_tier == 5 with priority_score == 60"
            - "before the trigger: awarded_count == 1, waitlisted_count == 1, Application.${a2_id}.waitlist_position == 1, ProgramYear.${py_id}.seats_committed == 1 and seats_available == 0"
            - "withdraw response application_status == WITHDRAWN and account_status == CLOSED"
            - "withdraw response promoted_application_id == ${a2_id}"
            - "Application.${a2_id}.status == AWARD_OFFERED with acceptance_deadline_at 2026-09-15T00:00:00Z"
            - "Account.${acct1_id}.status == CLOSED"
            - "withdraw response seats_committed == 1 and seats_available == 0"
            - "identity: ProgramYear.${py_id}.seats_committed + seats_available == total_seats == 1, before and after the withdrawal"
            - "GET /esa/accounts?program_year_id=${py_id} returns exactly 1 row (no second Account was minted by the promotion)"
