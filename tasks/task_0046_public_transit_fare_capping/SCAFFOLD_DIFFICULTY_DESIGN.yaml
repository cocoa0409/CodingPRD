              as: Rider
              as_user_id: "${r9}"
              captures: { f9: $.data.id }
            - call: "POST /funding-sources/${f9}/load"
              payload: { amount_cents: 100 }
              as: Rider
              as_user_id: "${r9}"
            - call: "POST /fare-weeks"
              payload: { rider_id: "${r9}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${r9}"
              captures: { w1: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r9}", fare_week_id: "${w1}", funding_source_id: "${f9}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${r9}"
