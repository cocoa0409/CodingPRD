    input: [appointment_id, fingerprint_quality, "photo_captured?"]
    output: BiometricCapture
    side_effects: ["status ACCEPTED if fingerprint_quality <= 3 and photo_captured, else REJECTED"]

  - method: GET
    path: "/appointments/{id}/biometric-captures"
    description: "List biometric captures for an appointment (reverse-reachability for BiometricCapture.appointment_id)"
    roles: [EnrollmentOfficer, SchedulingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BiometricCapture[]"
    side_effects: []

  # --- Application approval / KTN ---
  - method: POST
    path: "/applications/{id}/approve"
    description: "Approve an interview-complete application and issue a KTN"
    roles: [EnrollmentOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["Application INTERVIEW_COMPLETE -> APPROVED", "Create KnownTravelerNumber(ACTIVE); expires_at := compute_ktn_expiry", "If renewal: prior ACTIVE KTN -> SUPERSEDED", "increments Application.version by 1", "Write AuditEvent"]

  - method: GET
    path: "/applications/{id}/known-traveler-numbers"
    description: "List KTNs issued from an application (reverse-reachability for KnownTravelerNumber.application_id)"
    roles: [SchedulingAdmin, VettingOfficer, Applicant, EnrollmentOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "KnownTravelerNumber[]"
    side_effects: []

  - method: GET
    path: "/known-traveler-numbers/{id}"
    description: "Get a KTN"
    roles: [SchedulingAdmin, VettingOfficer, Applicant, EnrollmentOfficer]
    code: 200
    input: []
    output: KnownTravelerNumber
    side_effects: []

  - method: GET
    path: "/known-traveler-numbers/{id}/renewals"
    description: "List KTNs that renew this one (reverse-reachability for KnownTravelerNumber.renews_from_ktn_id)"
    roles: [SchedulingAdmin, VettingOfficer, Applicant, EnrollmentOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "KnownTravelerNumber[]"
    side_effects: []

  - method: POST
    path: "/known-traveler-numbers/{id}/revoke"
    description: "Revoke an active KTN"
    roles: [VettingOfficer]
    code: 200
    input: []
    output: KnownTravelerNumber
    side_effects: ["status ACTIVE -> REVOKED", "Write AuditEvent"]

  - method: POST
    path: "/known-traveler-numbers/{id}/expire-sweep"
    description: "Expire an active KTN whose expires_at has passed (admin sweep)"
    roles: [SchedulingAdmin]
    code: 200
    input: []
    output: KnownTravelerNumber
    side_effects: ["status ACTIVE -> EXPIRED", "Write AuditEvent"]

  # --- Appeals (denial/appeal) ---
  - method: POST
    path: "/applications/{id}/appeals"
    description: "File an appeal against a denied application"
    roles: [Applicant]
    code: 201
    input: [filed_reason]
    output: Appeal
    side_effects: ["Application DENIED -> APPEAL_PENDING", "Create Appeal(OPEN); appeal_count += 1", "increments Application.version by 1", "Write AuditEvent"]

  - method: GET
    path: "/applications/{id}/appeals"
    description: "List appeals for an application (reverse-reachability for Appeal.application_id)"
    roles: [Applicant, AppealsOfficer, SchedulingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/appeals/{id}"
    description: "Get an appeal"
    roles: [Applicant, AppealsOfficer, SchedulingAdmin]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/appeals/{id}/decide"
    description: "Decide an open appeal (UPHELD keeps denial, OVERTURNED reopens vetting)"
    roles: [AppealsOfficer]
    code: 200
    input: [outcome]
    output: Appeal
    side_effects: ["Appeal OPEN -> DECIDED", "On OVERTURNED: Application APPEAL_PENDING -> VETTING; BackgroundCheck ADVERSE -> PENDING, adverse_reason cleared", "On UPHELD: Application APPEAL_PENDING -> DENIED", "increments Application.version by 1", "Write AuditEvent"]

  # --- Redress (DHS TRIP) ---
  - method: POST
    path: "/redress-cases"
    description: "File a redress (DHS TRIP) case against an application's adverse vetting"
    roles: [Applicant, AppealsOfficer]
    code: 201
    input: [application_id, trip_number, match_strength_score]
    output: RedressCase
    side_effects: ["status FILED"]

  - method: GET
    path: "/applications/{id}/redress-cases"
    description: "List redress cases for an application (reverse-reachability for RedressCase.application_id)"
    roles: [Applicant, AppealsOfficer, SchedulingAdmin, VettingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "RedressCase[]"
    side_effects: []

  - method: GET
    path: "/redress-cases/{id}"
    description: "Get a redress case"
    roles: [Applicant, AppealsOfficer, SchedulingAdmin, VettingOfficer]
    code: 200
    input: []
    output: RedressCase
    side_effects: []

  - method: POST
    path: "/redress-cases/{id}/resolve"
    description: "Resolve a redress case; CLEARED applies a risk offset to the background check"
    roles: [AppealsOfficer]
    code: 200
    input: []
    output: RedressCase
    side_effects: ["status FILED -> RESOLVED", "resolution + risk_offset := compute_redress_offset", "On CLEARED: BackgroundCheck.redress_offset_applied += risk_offset", "Write AuditEvent"]

  # --- Audit trail ---
  - method: GET
    path: "/applications/{id}/audit-events"
    description: "List audit events for an application (reverse-reachability for AuditEvent.application_id)"
    roles: [SchedulingAdmin, VettingOfficer, AppealsOfficer, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the deterministic server clock (test-driving)"
    roles: [SchedulingAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["server clock pinned to to_iso8601 for all subsequent time-dependent logic"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADERS, http: 401, condition: "X-User-ID or X-User-Role header absent or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_REFERENCED_ENTITY_NOT_FOUND, http: 404, condition: "FK in request body references a non-existent row" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "Application references an applicant_id that does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Body schema invalid: missing required field, enum out of range, numeric out of bounds" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_application_version does not match live Application.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_PERMANENTLY_DISQUALIFIED, http: 403, condition: "Applicant self-declared a permanently disqualifying conviction at submit" }
  - { id: ERR_ELIGIBILITY_CITIZENSHIP, http: 422, condition: "GLOBAL_ENTRY submitted by applicant who is neither US_CITIZEN nor LPR" }
  - { id: ERR_RENEWAL_SOURCE_INVALID, http: 409, condition: "renews_from_application_id is not APPROVED or differs in applicant/program" }
  - { id: ERR_RENEWAL_TOO_EARLY, http: 409, condition: "Renewal submitted before prior KTN.expires_at minus renewal_window_days" }
  - { id: ERR_FEE_UNPAID, http: 402, condition: "fee_paid_cents < fee_due_cents when opening vetting" }
  - { id: ERR_BACKGROUND_CHECK_EXISTS, http: 409, condition: "A BackgroundCheck already exists for the application" }
  - { id: ERR_VETTING_NOT_CLEARED, http: 409, condition: "Approve/advance attempted while BackgroundCheck is not CLEARED" }
  - { id: ERR_VETTING_NOT_ADVERSE, http: 409, condition: "Operation requires the BackgroundCheck to be ADVERSE but it is not" }
  - { id: ERR_CENTER_SUSPENDED, http: 409, condition: "Booking attempted at a SUSPENDED enrollment center" }
  - { id: ERR_SLOT_NOT_AVAILABLE, http: 409, condition: "Target AppointmentSlot is not AVAILABLE" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Buffer-expanded interval collides with another same-lane CONFIRMED appointment" }
  - { id: ERR_DAILY_CAPACITY_EXCEEDED, http: 409, condition: "CONFIRMED appointment count for the center on the slot's UTC date is at daily_interview_capacity" }
  - { id: ERR_NO_APPOINTMENT, http: 409, condition: "Advance to INTERVIEW_SCHEDULED with no CONFIRMED appointment" }
  - { id: ERR_BIOMETRICS_NOT_ACCEPTED, http: 409, condition: "Interview completion attempted without an ACCEPTED BiometricCapture" }
  - { id: ERR_APPOINTMENT_NOT_ELAPSED, http: 409, condition: "No-show marked before appointment.ends_at has passed" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Appeals decider equals the vetting officer who adjudicated the check" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "An appeal already exists for this denied application (appeal_count >= 1)" }
  - { id: ERR_KTN_NOT_EXPIRED, http: 409, condition: "Expire-sweep run on a KTN whose expires_at has not passed" }
  - { id: ERR_KTN_COVERAGE_OVERLAP, http: 409, condition: "Approval would issue a KTN whose closed coverage interval overlaps an existing ACTIVE KTN for the same applicant+program (non-renewal)" }
  - { id: ERR_VALIDATION_OUT_OF_RANGE, http: 422, condition: "Pagination limit/offset out of [min,max] or negative" }
  - { id: ERR_CLOCK_INVALID, http: 422, condition: "to_iso8601 is not a valid ISO 8601 UTC datetime" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "The traveler enrolling; owns their applications, payments, appointments, appeals, redress"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applications/{id}/appeals (file appeal)"
    shared_operations:
      - "POST /applicants (with SchedulingAdmin)"
      - "POST /applications (with SchedulingAdmin)"
      - "POST /applications/{id}/pay, submit, withdraw (with SchedulingAdmin)"
      - "POST /appointments, POST /appointments/{id}/cancel (with SchedulingAdmin)"
      - "POST /redress-cases (with AppealsOfficer)"
      - "GET reads on own applicant/application/appointment/KTN/appeal/redress"

  - name: VettingOfficer
    description: "Adjudicates background vetting; opens checks, clears/denies, revokes KTNs"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/background-checks"
      - "POST /applications/{id}/adjudicate"
      - "POST /background-checks/{id}/manual-clear"
      - "POST /background-checks/{id}/manual-deny"
      - "POST /known-traveler-numbers/{id}/revoke"
    shared_operations:
      - "GET reads on applications, background-checks, KTNs"

  - name: EnrollmentOfficer
    description: "Runs in-person interviews; records biometrics, completes/no-shows appointments, approves"
    identity: "opaque"
    exclusive_operations:
      - "POST /biometric-captures"
      - "POST /appointments/{id}/no-show"
      - "POST /appointments/{id}/complete"
      - "POST /applications/{id}/approve"
    shared_operations:
      - "GET reads on appointments, biometric-captures, applications, KTNs"

  - name: AppealsOfficer
    description: "Independent officer who decides appeals and resolves redress; segregated from vetting"
    identity: "opaque"
    exclusive_operations:
      - "POST /appeals/{id}/decide"
      - "POST /redress-cases/{id}/resolve"
    shared_operations:
      - "POST /redress-cases (with Applicant)"
      - "GET reads on appeals, redress-cases, applications, background-checks, audit-events"

  - name: SchedulingAdmin
    description: "Operational admin: programs, centers, slots, clock; superset of applicant-facing writes"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "POST /enrollment-centers, POST /enrollment-centers/{id}/suspend"
      - "POST /appointment-slots, POST /appointment-slots/{id}/release"
      - "POST /known-traveler-numbers/{id}/expire-sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /applicants, POST /applications, pay, submit, withdraw, appointments (with Applicant)"
      - "GET reads across all resources"

  - name: Auditor
    description: "Read-only oversight role; can read audit trail and any resource but mutates nothing"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /applications/{id}/audit-events and all GET reads"
