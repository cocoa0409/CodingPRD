# =============================================================================
# Special Event & Parade Permit — SCAFFOLD (§1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: |
  Special Event & Parade Permit: application & route/site, multi-department review
  (police/fire/EMS/public-works), capacity & road-closure plan, insurance (COI) &
  deposit, fee & cost-recovery (staffing), conditions & approval workflow,
  conflict/double-booking, post-event cleanup/debrief

domain_name: event-parade-permit
api_prefix: ""

complexity_profile:
  primary_archetype: multi-party-negotiation
  secondary_archetype: temporal-windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # PermitApplication is the aggregate root; RouteSegment / DepartmentReview /
  # StaffingLine / PermitCondition / Deposit / Invoice hang off it as children,
  # while Venue, ClosureSchedule and EventClock are peer/config entities that the
  # application references by FK (cross-aggregate temporal-overlap reasoning).

  state_machine_shape: compound
  # PermitApplication.status is derived from the aggregate posture of its four
  # DepartmentReview children (quorum + veto) and its Deposit/Invoice/COI
  # sub-states; DepartmentReview and Deposit carry their own non-linear machines
  # (revision loop, forfeit branch).

  relationship_patterns:
    - one_to_many          # Application -> RouteSegment / DepartmentReview / StaffingLine / PermitCondition
    - cross_aggregate      # RouteSegment -> ClosureSchedule occupancy; Application -> Venue

  role_model: segregation_of_duties
  # Applicant requests; four Department reviewers (Police/Fire/EMS/PublicWorks)
  # each own their DepartmentReview; PermitOfficer runs the approval workflow and
  # cannot also file the reviews; a reviewer cannot self-approve the whole permit.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable venue/park name" }
      - { name: venue_type, type: enum, source: input, description: "PARK | PLAZA | STADIUM | STREET_CORRIDOR", constraints: "one of the four" }
      - { name: max_capacity, type: integer, source: input, description: "Maximum peak occupants the venue may lawfully hold at once" }
      - { name: setup_buffer_minutes, type: integer, source: input, default: 60, description: "Minutes of exclusive setup/teardown buffer applied on BOTH sides of any booked occupancy on this venue (closed-interval buffer)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECOMMISSIONED", default: "ACTIVE", constraints: "ACTIVE at creation; DECOMMISSIONED via decommission action" }

  - name: EventClock
    parent: null
    common_fields: false
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Logical server clock; defaults to 2026-05-01T00:00:00Z at startup, advanced only via POST /_clock/set_current_utc" }

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_org, type: string, source: input, description: "Sponsoring organization name" }
      - { name: applicant_user_id, type: string, source: system, description: "FK -> Applicant.id; the Applicant who filed this application" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue/site the event occupies" }
      - { name: event_kind, type: enum, source: input, description: "PARADE | FESTIVAL | RACE | RALLY", constraints: "one of the four" }
      - { name: permit_class, type: enum, source: computed, description: "SMALL | MEDIUM | LARGE; derived from expected_attendance (see permit_class_derivation)" }
      - { name: expected_attendance, type: integer, source: input, description: "Peak expected attendance headcount", constraints: ">= 1" }
      - { name: occupy_start, type: datetime, source: input, description: "Start of the event occupancy window (UTC, inclusive)" }
      - { name: occupy_end, type: datetime, source: input, description: "End of the event occupancy window (UTC, exclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED | CONDITIONALLY_APPROVED | ISSUED | DENIED | CANCELLED | CLOSED; derived-compound over DepartmentReview quorum, COI, Deposit, Invoice" }
      - { name: coi_on_file, type: boolean, source: computed, description: "True once an accepted COI record satisfies required_coverage_min; else false" }
      - { name: required_coverage_min, type: integer, source: computed, description: "Minimum liability coverage the COI must meet (see coi_minimum_coverage)" }
      - { name: application_fee, type: number, source: computed, description: "Total assessed fee (see application_fee_calc); recomputed on submit and on any attendance/route change while DRAFT" }
      - { name: deposit_required, type: number, source: computed, description: "Required cleanup/damage deposit (see deposit_calc)" }
      - { name: quorum_met, type: boolean, source: computed, description: "True when all four required DepartmentReview children are in APPROVED (see review_quorum)" }
      - { name: has_veto, type: boolean, source: computed, description: "True when any DepartmentReview child is in VETOED" }
      - { name: expected_venue_version, type: integer, source: input, description: "OCC guard: the Venue.version the applicant last observed; required on submit-for-review to detect a venue booking that superseded the applicant's view", constraints: "OCC field" }

  - name: RouteSegment
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; owning application" }
      - { name: closure_schedule_id, type: string, source: input, description: "FK -> ClosureSchedule.id; the road/corridor resource this segment closes" }
      - { name: segment_label, type: string, source: input, description: "Human label, e.g. 'Main St 1st-5th'" }
      - { name: closure_start, type: datetime, source: input, description: "Start of the road closure interval on this schedule (UTC, inclusive)" }
      - { name: closure_end, type: datetime, source: input, description: "End of the road closure interval on this schedule (UTC, exclusive)" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | RELEASED; PLANNED at creation, ACTIVE on issuance, RELEASED at debrief", default: "PLANNED" }

  - name: ClosureSchedule
    parent: null
    common_fields: true
    fields:
      - { name: corridor_name, type: string, source: input, description: "Road corridor identifier the schedule governs" }
      - { name: min_gap_minutes, type: integer, source: input, default: 30, description: "Minimum clear gap required BETWEEN two closures on this corridor (half-open interval arithmetic; adjacency allowed only if gap >= this)" }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED", default: "OPEN", constraints: "OPEN accepts closures; SUSPENDED rejects" }

  - name: DepartmentReview
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; owning application" }
      - { name: department, type: enum, source: system, description: "POLICE | FIRE | EMS | PUBLIC_WORKS; the reviewing department (one review row per department, created on submit-for-review)" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | CHANGES_REQUESTED | VETOED; PENDING at creation" }
      - { name: planned_personnel, type: integer, source: input, description: "Staff this department plans to deploy (drives cost-recovery estimate)", default: 0 }
      - { name: planned_hours, type: number, source: input, description: "Planned staffing hours per person for this department", default: 0 }
      - { name: hourly_rate, type: number, source: input, description: "Department fully-loaded hourly staffing rate", default: 0 }
      - { name: actual_hours, type: number, source: input, description: "Actual staffing hours per person logged post-event (drives cost-recovery actual)", default: 0 }
      - { name: note, type: string, source: input, required: false, description: "Reviewer note / veto reason / change request" }

  - name: PermitCondition
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; owning application" }
      - { name: department_review_id, type: string, source: input, description: "FK -> DepartmentReview.id; the review that imposed this condition" }
      - { name: text, type: string, source: input, description: "Condition the applicant must satisfy" }
      - { name: mandatory, type: boolean, source: input, default: true, description: "If true, condition must be ACKNOWLEDGED before issuance" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACKNOWLEDGED | WAIVED; PROPOSED at creation", default: "PROPOSED" }

  - name: InsuranceCertificate
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; owning application" }
      - { name: carrier, type: string, source: input, description: "Insurance carrier name" }
      - { name: coverage_amount, type: integer, source: input, description: "Liability coverage the certificate provides" }
      - { name: expires_at, type: datetime, source: input, description: "COI expiry instant (UTC)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED; SUBMITTED at creation, ACCEPTED/REJECTED by officer review" }

  - name: Deposit
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; owning application" }
      - { name: amount, type: number, source: input, description: "Deposit amount paid (must be >= application.deposit_required)" }
      - { name: status, type: enum, source: system, description: "HELD | FORFEITED_PARTIAL | REFUNDED; HELD on payment, resolved at debrief" }
      - { name: forfeited_amount, type: number, source: computed, description: "Amount withheld to cover cleanup charges at debrief (see deposit_reconciliation)", default: 0 }
      - { name: refunded_amount, type: number, source: computed, description: "Amount returned to applicant at debrief (amount - forfeited_amount)", default: 0 }

  - name: Invoice
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; owning application" }
      - { name: fee_component, type: number, source: computed, description: "Snapshot of application_fee at issuance" }
      - { name: cost_recovery_estimate, type: number, source: computed, description: "Estimated staffing cost recovery at conditional approval (see cost_recovery, ESTIMATE variant)" }
      - { name: cost_recovery_actual, type: number, source: computed, description: "Actual staffing cost recovery finalized at debrief (see cost_recovery, ACTUAL variant); 0 until debrief" }
      - { name: balance_due, type: number, source: computed, description: "Read-only running balance: fee_component + cost_recovery_estimate at issuance; trued-up to cost_recovery_actual at debrief" }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED; OPEN at issuance, SETTLED at debrief close" }

  - name: CleanupDebrief
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; owning application" }
      - { name: actual_attendance, type: integer, source: input, description: "Observed attendance for the after-action record" }
      - { name: cleanup_charges, type: number, source: input, description: "Assessed cleanup/damage charges against the deposit", default: 0 }
      - { name: incident_count, type: integer, source: input, default: 0, description: "Incidents logged during the event" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED; OPEN at creation, FINALIZED when debrief closes the permit" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Applicant organization" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- PermitApplication: compound over DepartmentReview quorum + veto + gates ----
  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [DENIED, CANCELLED, CLOSED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /permit-applications/{id}/submit-for-review"
        actor: Applicant
        preconditions:
          - "Application is DRAFT (ERR_APPLICATION_NOT_DRAFT)"
          - "Acting Applicant owns this application: X-User-ID == applicant_user_id (ERR_NOT_APPLICATION_OWNER)"
          - "At least one RouteSegment exists (ERR_ROUTE_PLAN_EMPTY)"
          - "expected_attendance <= Venue.max_capacity (ERR_CAPACITY_EXCEEDED)"
          - "expected_venue_version == Venue.version for the referenced venue (ERR_STALE_VENUE_VERSION, 412)"
        side_effects:
          - "Create exactly four DepartmentReview children (POLICE, FIRE, EMS, PUBLIC_WORKS), each PENDING"
          - "Freeze application_fee, deposit_required, required_coverage_min at their computed values (attendance no longer editable)"
          - "increments Venue.version by 1 (venue occupancy provisionally reserved for the window)"

      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "system (auto when any DepartmentReview enters CHANGES_REQUESTED)"
        actor: system
        preconditions:
          - "At least one DepartmentReview is CHANGES_REQUESTED and none is VETOED"
        side_effects:
          - "Applicant may edit route plan and resubmit; no fee change (fee frozen at submit)"

      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /permit-applications/{id}/submit-for-review"
        actor: Applicant
        preconditions:
          - "Application is REVISION_REQUESTED (ERR_APPLICATION_NOT_DRAFT covers non-resubmittable states)"
          - "Acting Applicant owns this application (ERR_NOT_APPLICATION_OWNER)"
          - "expected_venue_version == Venue.version (ERR_STALE_VENUE_VERSION, 412)"
        side_effects:
          - "Every DepartmentReview in CHANGES_REQUESTED is reset to PENDING"
          - "increments Venue.version by 1"
        note: "Revision loop: cyclic REVISION_REQUESTED -> UNDER_REVIEW -> REVISION_REQUESTED."

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system (auto when any DepartmentReview enters VETOED)"
        actor: system
        preconditions:
          - "At least one DepartmentReview is VETOED"
        side_effects:
          - "All PLANNED RouteSegments -> RELEASED (closure reservations freed)"
          - "decrements the reserved venue occupancy (Venue.version increments by 1 on release)"
          - "All non-terminal PermitCondition children -> WAIVED"

      - from: UNDER_REVIEW
        to: CONDITIONALLY_APPROVED
        trigger: "system (auto when quorum_met becomes true: all four DepartmentReview APPROVED)"
        actor: system
        preconditions:
          - "quorum_met is true (all four DepartmentReview are APPROVED)"
          - "has_veto is false"
        side_effects:
          - "Compute cost_recovery_estimate (ESTIMATE variant) and create/refresh Invoice with balance_due = application_fee + cost_recovery_estimate, status OPEN"

      - from: CONDITIONALLY_APPROVED
        to: ISSUED
        trigger: "POST /permit-applications/{id}/issue"
        actor: PermitOfficer
        preconditions:
          - "Application is CONDITIONALLY_APPROVED (ERR_APPLICATION_NOT_APPROVABLE)"
          - "coi_on_file is true (an ACCEPTED COI meets required_coverage_min) (ERR_COI_NOT_ON_FILE)"
          - "A Deposit exists in HELD with amount >= deposit_required (ERR_DEPOSIT_NOT_HELD)"
          - "Every mandatory PermitCondition is ACKNOWLEDGED (ERR_UNACKNOWLEDGED_CONDITIONS)"
        side_effects:
          - "All PLANNED RouteSegments -> ACTIVE"
          - "Invoice.status stays OPEN; fee_component snapshot pinned"

      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /permit-applications/{id}/cancel"
        actor: Applicant
        preconditions:
          - "Acting Applicant owns this application (ERR_NOT_APPLICATION_OWNER)"
          - "Application is DRAFT, UNDER_REVIEW, or REVISION_REQUESTED (ERR_APPLICATION_NOT_CANCELLABLE)"
        side_effects:
          - "All PLANNED RouteSegments -> RELEASED"
          - "increments Venue.version by 1 (venue reservation freed)"
          - "All non-terminal DepartmentReview -> stay; all PROPOSED PermitCondition -> WAIVED"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /permit-applications/{id}/cancel"
        actor: Applicant
        preconditions:
          - "Acting Applicant owns this application (ERR_NOT_APPLICATION_OWNER)"
        side_effects:
          - "No reviews created yet; no venue reservation to free"

      - from: CONDITIONALLY_APPROVED
        to: CANCELLED
        trigger: "POST /permit-applications/{id}/cancel"
        actor: Applicant
        preconditions:
          - "Acting Applicant owns this application (ERR_NOT_APPLICATION_OWNER)"
        side_effects:
          - "All PLANNED RouteSegments -> RELEASED; Venue.version increments by 1"
          - "Any HELD Deposit -> REFUNDED in full (refunded_amount = amount, forfeited_amount = 0)"

      - from: ISSUED
        to: CLOSED
        trigger: "POST /permit-applications/{id}/debrief/{debriefId}/finalize"
        actor: PermitOfficer
        preconditions:
          - "Application is ISSUED (ERR_APPLICATION_NOT_ISSUED)"
          - "A CleanupDebrief in OPEN exists for this application (ERR_DEBRIEF_NOT_OPEN)"
        side_effects:
          - "Compute cost_recovery_actual (ACTUAL variant); Invoice.cost_recovery_actual set, balance_due trued-up to fee_component + cost_recovery_actual, Invoice.status -> SETTLED"
          - "Run deposit_reconciliation: Deposit.forfeited_amount and refunded_amount set; Deposit -> FORFEITED_PARTIAL if cleanup_charges > 0 else REFUNDED"
          - "All ACTIVE RouteSegments -> RELEASED (Venue.version increments by 1)"
          - "CleanupDebrief -> FINALIZED"

  # ---- DepartmentReview: branching with revision loop + veto branch ----
  - entity: DepartmentReview
    initial_state: PENDING
    terminal_states: [VETOED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /permit-applications/{appId}/reviews/{reviewId}/approve"
        actor: DepartmentReviewer
        preconditions:
          - "Review is PENDING (ERR_REVIEW_NOT_PENDING)"
          - "Acting reviewer's department matches this review's department (ERR_DEPARTMENT_MISMATCH)"
          - "Parent application is UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
        side_effects:
          - "Recompute application quorum_met; if all four APPROVED, application auto-transitions UNDER_REVIEW -> CONDITIONALLY_APPROVED"

      - from: PENDING
        to: CHANGES_REQUESTED
        trigger: "POST /permit-applications/{appId}/reviews/{reviewId}/request-changes"
        actor: DepartmentReviewer
        preconditions:
          - "Review is PENDING (ERR_REVIEW_NOT_PENDING)"
          - "Acting reviewer's department matches (ERR_DEPARTMENT_MISMATCH)"
          - "Parent application is UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
        side_effects:
          - "Optionally create PermitCondition children (PROPOSED)"
          - "Parent application auto-transitions UNDER_REVIEW -> REVISION_REQUESTED"

      - from: PENDING
        to: VETOED
        trigger: "POST /permit-applications/{appId}/reviews/{reviewId}/veto"
        actor: DepartmentReviewer
        preconditions:
          - "Review is PENDING (ERR_REVIEW_NOT_PENDING)"
          - "Acting reviewer's department matches (ERR_DEPARTMENT_MISMATCH)"
          - "Parent application is UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "note is present (ERR_VETO_REASON_REQUIRED)"
        side_effects:
          - "Parent application auto-transitions UNDER_REVIEW -> DENIED (cascade: RouteSegments RELEASED, conditions WAIVED, venue freed)"

      - from: CHANGES_REQUESTED
        to: PENDING
        trigger: "system (auto on parent REVISION_REQUESTED -> UNDER_REVIEW resubmit)"
        actor: system
        preconditions:
          - "Parent application transitions REVISION_REQUESTED -> UNDER_REVIEW"
        side_effects: []
        note: "Revision loop reset for this review."

  # ---- RouteSegment: linear-with-release ----
  - entity: RouteSegment
    initial_state: PLANNED
    terminal_states: [RELEASED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "system (on application issue)"
        actor: system
        preconditions: ["Parent application transitions CONDITIONALLY_APPROVED -> ISSUED"]
        side_effects: []
      - from: PLANNED
        to: RELEASED
        trigger: "system (on application deny/cancel)"
        actor: system
        preconditions: []
        side_effects: ["Closure interval on ClosureSchedule freed"]
      - from: ACTIVE
        to: RELEASED
        trigger: "system (on debrief finalize)"
        actor: system
        preconditions: []
        side_effects: ["Closure interval freed"]

  # ---- Deposit: forfeit/refund branch ----
  - entity: Deposit
    initial_state: HELD
    terminal_states: [FORFEITED_PARTIAL, REFUNDED]
    transitions:
      - from: HELD
        to: FORFEITED_PARTIAL
        trigger: "system (on debrief finalize when cleanup_charges > 0)"
        actor: system
        preconditions: ["cleanup_charges > 0"]
        side_effects: ["forfeited_amount = min(amount, cleanup_charges); refunded_amount = amount - forfeited_amount"]
      - from: HELD
        to: REFUNDED
        trigger: "system (on debrief finalize when cleanup_charges == 0, or on cancel from CONDITIONALLY_APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["forfeited_amount = 0; refunded_amount = amount"]

  # ---- InsuranceCertificate: officer review ----
  - entity: InsuranceCertificate
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /permit-applications/{appId}/coi/{coiId}/accept"
        actor: PermitOfficer
        preconditions:
          - "COI is SUBMITTED (ERR_COI_NOT_SUBMITTED)"
          - "coverage_amount >= application.required_coverage_min (ERR_COI_COVERAGE_INSUFFICIENT)"
          - "expires_at > application.occupy_end (ERR_COI_EXPIRES_BEFORE_EVENT)"
        side_effects:
          - "application.coi_on_file recomputed to true"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /permit-applications/{appId}/coi/{coiId}/reject"
        actor: PermitOfficer
        preconditions: ["COI is SUBMITTED (ERR_COI_NOT_SUBMITTED)"]
        side_effects: ["application.coi_on_file recomputed (may stay false)"]
      - from: ACCEPTED
        to: SUBMITTED
        trigger: "system (auto when a superseding COI is accepted; prior ACCEPTED demoted)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Only the latest ACCEPTED COI satisfies coi_on_file."

  # ---- PermitCondition ----
  - entity: PermitCondition
    initial_state: PROPOSED
    terminal_states: [WAIVED]
    transitions:
      - from: PROPOSED
        to: ACKNOWLEDGED
        trigger: "POST /permit-applications/{appId}/conditions/{conditionId}/acknowledge"
        actor: Applicant
        preconditions:
          - "Condition is PROPOSED (ERR_CONDITION_NOT_PROPOSED)"
          - "Acting Applicant owns the parent application (ERR_NOT_APPLICATION_OWNER)"
        side_effects: []
      - from: PROPOSED
        to: WAIVED
        trigger: "system (on application deny/cancel)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- CleanupDebrief ----
  - entity: CleanupDebrief
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /permit-applications/{appId}/debrief/{debriefId}/finalize"
        actor: PermitOfficer
        preconditions: ["Parent application is ISSUED (ERR_APPLICATION_NOT_ISSUED)"]
        side_effects: ["Drives application ISSUED -> CLOSED cascade (invoice true-up, deposit reconciliation, segment release)"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: submit-review-stale-venue
    parent_entity: Venue
    write_endpoint: "POST /permit-applications/{id}/submit-for-review"
    occ_field: "expected_venue_version"
    description: |
      Submitting an application for review against a Venue whose version has
      advanced since the applicant last observed it is rejected. This captures
      the case where another application has already been submitted (or resubmitted)
      for the same venue and provisionally reserved the occupancy window, advancing
      the Venue.version; the current applicant's view of the venue is therefore
      stale and the submit is rejected on a stale-version check.
    error_id: ERR_STALE_VENUE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: permit_class_derivation
    trigger: "on application create and on any expected_attendance change while DRAFT"
    algorithm: threshold
    formula: |
      if expected_attendance <= 1000: permit_class = SMALL
      elif expected_attendance <= 5000: permit_class = MEDIUM
      else: permit_class = LARGE
    constants: { SMALL_MAX: 1000, MEDIUM_MAX: 5000 }
    precision: "integer thresholds; <= comparisons (1000 is SMALL, 1001 is MEDIUM, 5000 is MEDIUM, 5001 is LARGE)"

  - name: application_fee_calc
    trigger: "on application create/edit while DRAFT; frozen at submit-for-review"
    algorithm: tiered_pricing
    formula: |
      base = BASE_FEE[permit_class]                # SMALL=150, MEDIUM=400, LARGE=900
      # marginal attendance surcharge (tiered, per head over each breakpoint)
      surcharge = 0
      if expected_attendance > 1000:
        surcharge += (min(expected_attendance, 5000) - 1000) * TIER2_RATE   # 0.20/head
      if expected_attendance > 5000:
        surcharge += (expected_attendance - 5000) * TIER3_RATE              # 0.35/head
      surcharge = round(surcharge, 2)
      closure_fee = round(count(RouteSegment where application_id == this.id) * SEGMENT_FEE, 2)   # 75.00/segment
      application_fee = round(base + surcharge + closure_fee, 2)
    input_set: "RouteSegment children of THIS application in any status (all count toward closure_fee at submit time)"
    constants:
      BASE_FEE: { SMALL: 150.00, MEDIUM: 400.00, LARGE: 900.00 }
      TIER2_RATE: 0.20
      TIER3_RATE: 0.35
      SEGMENT_FEE: 75.00
    precision: "2 decimals, round_half_up; surcharge rounded once after summing tiers, then whole fee rounded"
    note: "Tiered surcharge is MARGINAL (per-head over each breakpoint), not average; 1000 pays no surcharge, 1001 pays for one head."

  - name: deposit_calc
    trigger: "on application create/edit while DRAFT; frozen at submit-for-review"
    algorithm: threshold
    formula: |
      floor = CLEANUP_FLOOR[permit_class]          # SMALL=200, MEDIUM=500, LARGE=1500
      per_head = round(expected_attendance * PER_HEAD_RATE, 2)   # 0.10/head
      deposit_required = round(max(floor, per_head), 2)
    constants:
      CLEANUP_FLOOR: { SMALL: 200.00, MEDIUM: 500.00, LARGE: 1500.00 }
      PER_HEAD_RATE: 0.10
    precision: "2 decimals, round_half_up"
    note: "max() of a class floor and a per-head figure; different domain (cleanup deposit) than the fee tiers."

  - name: coi_minimum_coverage
    trigger: "on application create; frozen at submit-for-review; used when accepting a COI"
    algorithm: threshold
    formula: |
      required_coverage_min = min(COI_CAP, COI_BASE + max(0, expected_attendance - 1000) * COI_PER_HEAD)
    constants: { COI_BASE: 1000000, COI_PER_HEAD: 100, COI_CAP: 5000000 }
    precision: "integer dollars"
    note: "Floor at COI_BASE (attendance <= 1000), capped at COI_CAP."

  - name: cost_recovery
    trigger: "ESTIMATE at CONDITIONALLY_APPROVED (Invoice creation); ACTUAL at debrief finalize"
    algorithm: aggregation
    formula: |
      # per-department staffing line from DepartmentReview children
      line_cost(r, hours_field) = round(r.planned_personnel * r.<hours_field> * r.hourly_rate, 2)
      subtotal = round( sum over all four DepartmentReview r of line_cost(r, hours_field), 2 )
      total = round( subtotal * (1 + OVERHEAD_RATE), 2 )
    input_set: "All four DepartmentReview children of the application, regardless of review status at finalize (all are APPROVED by the time issuance/debrief runs)"
    constants: { OVERHEAD_RATE: 0.15 }
    precision: "2 decimals, round_half_up; ROUND-ORDER PINNED: round each line to cents, SUM lines, THEN apply overhead, THEN round total (round-per-line-then-sum, not sum-then-round)"
    variants:
      - name: ESTIMATE
        when: "at CONDITIONALLY_APPROVED, populating Invoice.cost_recovery_estimate and balance_due"
        difference: "hours_field = planned_hours"
      - name: ACTUAL
        when: "at debrief finalize, populating Invoice.cost_recovery_actual and truing up balance_due"
        difference: "hours_field = actual_hours (logged per-department via POST .../reviews/{id}/log-actuals while ISSUED); identical personnel/rate, different hours source -> different total for identical department rows. If a department never logs actuals, its actual_hours stays 0 (default)."

  - name: deposit_reconciliation
    trigger: "at debrief finalize"
    algorithm: waterfall_allocation
    formula: |
      forfeited_amount = round(min(Deposit.amount, CleanupDebrief.cleanup_charges), 2)
      refunded_amount  = round(Deposit.amount - forfeited_amount, 2)
      # conserved quantity: forfeited_amount + refunded_amount == Deposit.amount, always
    input_set: "The single HELD Deposit and the OPEN CleanupDebrief of the application"
    precision: "2 decimals, round_half_up"
    note: "Cleanup charges recover from the deposit first; overflow beyond deposit is NOT clawed back from the applicant (capped at amount)."

  - name: review_quorum
    trigger: "recomputed on every DepartmentReview status change"
    algorithm: aggregation
    formula: |
      required = {POLICE, FIRE, EMS, PUBLIC_WORKS}
      quorum_met = (every department in required has its DepartmentReview status == APPROVED)
      has_veto   = (any DepartmentReview status == VETOED)
    input_set: "The four DepartmentReview children of the application"
    precision: "boolean"
    note: "Veto is absolute (single VETOED -> DENIED); quorum requires unanimity of four APPROVED."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist and belong to the correct parent, left-to-right"
    error_id: "varies (ERR_APPLICATION_NOT_FOUND, ERR_VENUE_NOT_FOUND, ERR_REVIEW_NOT_FOUND, ERR_COI_NOT_FOUND, ERR_CONDITION_NOT_FOUND, ERR_DEPOSIT_NOT_FOUND, ERR_DEBRIEF_NOT_FOUND, ERR_SEGMENT_NOT_FOUND, ERR_CLOSURE_SCHEDULE_NOT_FOUND, ERR_APPLICANT_NOT_FOUND)"
    http_status: 404
    applies_to: all nested/reference endpoints

  - priority: 4
    category: business_referential
    check: "Acting Applicant owns the target application (X-User-ID == applicant_user_id)"
    error_id: ERR_NOT_APPLICATION_OWNER
    http_status: 403
    applies_to: "applicant-owned actions (submit, cancel, acknowledge, add route segment, pay deposit, submit COI)"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the operation (application/review/coi/condition/deposit/debrief)"
    error_id: "varies (ERR_APPLICATION_NOT_DRAFT, ERR_APPLICATION_NOT_UNDER_REVIEW, ERR_APPLICATION_NOT_APPROVABLE, ERR_APPLICATION_NOT_ISSUED, ERR_APPLICATION_NOT_CANCELLABLE, ERR_REVIEW_NOT_PENDING, ERR_COI_NOT_SUBMITTED, ERR_CONDITION_NOT_PROPOSED, ERR_DEBRIEF_NOT_OPEN)"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_referential
    check: "Acting DepartmentReviewer's X-User department matches the review's department"
    error_id: ERR_DEPARTMENT_MISMATCH
    http_status: 403
    applies_to: "review approve/request-changes/veto"

  - priority: 7
    category: business_constraint
    check: "Application must have >= 1 RouteSegment before submit-for-review"
    error_id: ERR_ROUTE_PLAN_EMPTY
    http_status: 409
    applies_to: "POST /permit-applications/{id}/submit-for-review"

  - priority: 8
    category: business_safety
    check: "expected_attendance must not exceed Venue.max_capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /permit-applications/{id}/submit-for-review"

  - priority: 9
    category: business_temporal
    check: "Venue occupancy window (expanded by setup_buffer_minutes on both sides) must not overlap another non-terminal application's booked window on the same venue"
    error_id: ERR_VENUE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /permit-applications/{id}/submit-for-review"

  - priority: 10
    category: business_temporal
    check: "Each RouteSegment closure interval must keep >= ClosureSchedule.min_gap_minutes clear of every other non-terminal closure on the same schedule (half-open intervals; back-to-back allowed only if gap >= min_gap)"
    error_id: ERR_CLOSURE_CONFLICT
    http_status: 409
    applies_to: "POST /permit-applications/{appId}/route-segments"

  - priority: 11
    category: business_constraint
    check: "ClosureSchedule.status must be OPEN to accept a new RouteSegment"
    error_id: ERR_CLOSURE_SCHEDULE_SUSPENDED
    http_status: 409
    applies_to: "POST /permit-applications/{appId}/route-segments"

  - priority: 12
    category: business_temporal
    check: "COI expires_at must be strictly after application.occupy_end when accepting a COI"
    error_id: ERR_COI_EXPIRES_BEFORE_EVENT
    http_status: 409
    applies_to: "POST /permit-applications/{appId}/coi/{coiId}/accept"

  - priority: 13
    category: business_fiscal
    check: "COI coverage_amount must be >= application.required_coverage_min to accept"
    error_id: ERR_COI_COVERAGE_INSUFFICIENT
    http_status: 402
    applies_to: "POST /permit-applications/{appId}/coi/{coiId}/accept"

  - priority: 14
    category: business_fiscal
    check: "Deposit amount must be >= application.deposit_required"
    error_id: ERR_DEPOSIT_UNDERFUNDED
    http_status: 402
    applies_to: "POST /permit-applications/{appId}/deposit"

  - priority: 15
    category: business_constraint
    check: "Issuance requires COI on file, deposit HELD, and all mandatory conditions ACKNOWLEDGED"
    error_id: "varies (ERR_COI_NOT_ON_FILE, ERR_DEPOSIT_NOT_HELD, ERR_UNACKNOWLEDGED_CONDITIONS)"
    http_status: 409
    applies_to: "POST /permit-applications/{id}/issue"

  - priority: 16
    category: business_constraint
    check: "Veto requires a non-empty note"
    error_id: ERR_VETO_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /permit-applications/{appId}/reviews/{reviewId}/veto"

  - priority: 17
    category: business_temporal
    check: "occupy_end must be strictly after occupy_start; closure_end strictly after closure_start"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /permit-applications, POST /permit-applications/{appId}/route-segments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Applicant ----
  - method: POST
    path: "/applicants"
    description: "Register an applicant organization (identity for entity_backed Applicant role)"
    roles: [Applicant, PermitOfficer]
    code: 201
    input: [org_name, contact_email]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants/{applicantId}"
    description: "Get an applicant"
    roles: [Applicant, PermitOfficer]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # ---- Venue ----
  - method: POST
    path: "/venues"
    description: "Create a venue"
    roles: [PermitOfficer]
    code: 201
    input: [name, venue_type, max_capacity, "setup_buffer_minutes?"]
    output: Venue
    side_effects: ["status ACTIVE, version 1"]

  - method: GET
    path: "/venues"
    description: "List venues"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Venue[]"
    side_effects: []

  - method: GET
    path: "/venues/{venueId}"
    description: "Get a venue (read current version for OCC)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: POST
    path: "/venues/{venueId}/decommission"
    description: "Decommission a venue"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Venue
    side_effects: ["status -> DECOMMISSIONED; version increments by 1"]

  # ---- ClosureSchedule ----
  - method: POST
    path: "/closure-schedules"
    description: "Create a road-corridor closure schedule resource"
    roles: [PermitOfficer]
    code: 201
    input: [corridor_name, "min_gap_minutes?"]
    output: ClosureSchedule
    side_effects: ["status OPEN"]

  - method: GET
    path: "/closure-schedules"
    description: "List closure schedules"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClosureSchedule[]"
    side_effects: []

  - method: GET
    path: "/closure-schedules/{scheduleId}"
    description: "Get a closure schedule"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: []
    output: ClosureSchedule
    side_effects: []

  - method: POST
    path: "/closure-schedules/{scheduleId}/suspend"
    description: "Suspend a closure schedule (stops accepting new closures)"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: ClosureSchedule
    side_effects: ["status -> SUSPENDED"]

  # ---- PermitApplication ----
  - method: POST
    path: "/permit-applications"
    description: "Create a DRAFT permit application"
    roles: [Applicant]
    code: 201
    input: [applicant_org, venue_id, event_kind, expected_attendance, occupy_start, occupy_end]
    output: PermitApplication
    side_effects: ["status DRAFT; permit_class, application_fee, deposit_required, required_coverage_min computed; applicant_user_id set to X-User-ID"]

  - method: GET
    path: "/permit-applications"
    description: "List permit applications (filterable by venue_id and applicant_user_id)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["venue_id?", "applicant_user_id?", "limit?", "offset?"]
    output: "PermitApplication[]"
    side_effects: []

  - method: GET
    path: "/permit-applications/{id}"
    description: "Get a permit application with computed fields"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []

  - method: PATCH
    path: "/permit-applications/{id}"
    description: "Edit DRAFT application (attendance/window); recomputes fee/deposit/coverage/class"
    roles: [Applicant]
    code: 200
    input: ["expected_attendance?", "occupy_start?", "occupy_end?"]
    output: PermitApplication
    side_effects: ["permit_class/application_fee/deposit_required/required_coverage_min recomputed while DRAFT"]

  - method: POST
    path: "/permit-applications/{id}/submit-for-review"
    description: "Submit DRAFT or REVISION_REQUESTED application for multi-department review; OCC-guarded on Venue.version"
    roles: [Applicant]
    code: 200
    input: [expected_venue_version]
    output: PermitApplication
    side_effects:
      - "status -> UNDER_REVIEW"
      - "four DepartmentReview children created (PENDING) on first submit; CHANGES_REQUESTED reviews reset to PENDING on resubmit"
      - "fee/deposit/coverage frozen"
      - "increments Venue.version by 1"

  - method: POST
    path: "/permit-applications/{id}/cancel"
    description: "Applicant cancels their application"
    roles: [Applicant]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status -> CANCELLED; PLANNED segments RELEASED; Venue.version increments by 1 if reserved; HELD deposit fully REFUNDED if present; PROPOSED conditions WAIVED"]

  - method: POST
    path: "/permit-applications/{id}/issue"
    description: "Officer issues a conditionally-approved permit"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status -> ISSUED; PLANNED RouteSegments -> ACTIVE; Invoice fee_component pinned"]

  # ---- RouteSegment (child) ----
  - method: POST
    path: "/permit-applications/{appId}/route-segments"
    description: "Add a road-closure route segment to a DRAFT/REVISION_REQUESTED application"
    roles: [Applicant]
    code: 201
    input: [closure_schedule_id, segment_label, closure_start, closure_end]
    output: RouteSegment
    side_effects: ["status PLANNED; application_fee recomputed if DRAFT; closure conflict + schedule-open checks run"]

  - method: GET
    path: "/permit-applications/{appId}/route-segments"
    description: "List route segments of an application (reverse-reachability for RouteSegment.application_id)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteSegment[]"
    side_effects: []

  - method: GET
    path: "/route-segments"
    description: "List route segments filtered by closure_schedule_id or application_id (reverse-reachability for both RouteSegment FKs)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["closure_schedule_id?", "application_id?", "limit?", "offset?"]
    output: "RouteSegment[]"
    side_effects: []

  - method: GET
    path: "/permit-applications/{appId}/route-segments/{segmentId}"
    description: "Get a route segment"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: []
    output: RouteSegment
    side_effects: []

  # ---- DepartmentReview (child) ----
  - method: GET
    path: "/permit-applications/{appId}/reviews"
    description: "List department reviews of an application (reverse-reachability for DepartmentReview.application_id)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "DepartmentReview[]"
    side_effects: []

  - method: GET
    path: "/permit-applications/{appId}/reviews/{reviewId}"
    description: "Get a department review"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: []
    output: DepartmentReview
    side_effects: []

  - method: POST
    path: "/permit-applications/{appId}/reviews/{reviewId}/approve"
    description: "Department reviewer approves their review; may set staffing plan (personnel/hours/rate)"
    roles: [DepartmentReviewer]
    code: 200
    input: ["planned_personnel?", "planned_hours?", "hourly_rate?"]
    output: DepartmentReview
    side_effects: ["status -> APPROVED; recompute quorum; if all four APPROVED -> application CONDITIONALLY_APPROVED + Invoice (ESTIMATE)"]

  - method: POST
    path: "/permit-applications/{appId}/reviews/{reviewId}/request-changes"
    description: "Department reviewer requests changes; may propose conditions"
    roles: [DepartmentReviewer]
    code: 200
    input: ["note?"]
    output: DepartmentReview
    side_effects: ["status -> CHANGES_REQUESTED; application -> REVISION_REQUESTED"]

  - method: POST
    path: "/permit-applications/{appId}/reviews/{reviewId}/veto"
    description: "Department reviewer vetoes (absolute deny); note required"
    roles: [DepartmentReviewer]
    code: 200
    input: [note]
    output: DepartmentReview
    side_effects: ["status -> VETOED; application -> DENIED cascade (segments RELEASED, conditions WAIVED, venue freed)"]

  - method: POST
    path: "/permit-applications/{appId}/reviews/{reviewId}/log-actuals"
    description: "Department reviewer logs actual post-event staffing hours for this department (drives cost_recovery ACTUAL); allowed while parent application is ISSUED, before debrief finalize"
    roles: [DepartmentReviewer]
    code: 200
    input: [actual_hours]
    output: DepartmentReview
    side_effects: ["actual_hours set on this DepartmentReview; department must match acting reviewer; parent application must be ISSUED"]

  # ---- PermitCondition (child) ----
  - method: POST
    path: "/permit-applications/{appId}/reviews/{reviewId}/conditions"
    description: "Reviewer attaches a permit condition to their review"
    roles: [DepartmentReviewer]
    code: 201
    input: [text, "mandatory?"]
    output: PermitCondition
    side_effects: ["status PROPOSED; department_review_id set"]

  - method: GET
    path: "/permit-applications/{appId}/conditions"
    description: "List conditions of an application"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PermitCondition[]"
    side_effects: []

  - method: GET
    path: "/permit-applications/{appId}/reviews/{reviewId}/conditions"
    description: "List conditions imposed by a specific review (reverse-reachability for PermitCondition.department_review_id)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PermitCondition[]"
    side_effects: []

  - method: POST
    path: "/permit-applications/{appId}/conditions/{conditionId}/acknowledge"
    description: "Applicant acknowledges a proposed condition"
    roles: [Applicant]
    code: 200
    input: []
    output: PermitCondition
    side_effects: ["status -> ACKNOWLEDGED"]

  # ---- InsuranceCertificate (child) ----
  - method: POST
    path: "/permit-applications/{appId}/coi"
    description: "Applicant submits a COI record"
    roles: [Applicant]
    code: 201
    input: [carrier, coverage_amount, expires_at]
    output: InsuranceCertificate
    side_effects: ["status SUBMITTED"]

  - method: GET
    path: "/permit-applications/{appId}/coi"
    description: "List COIs of an application (reverse-reachability for InsuranceCertificate.application_id)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "InsuranceCertificate[]"
    side_effects: []

  - method: POST
    path: "/permit-applications/{appId}/coi/{coiId}/accept"
    description: "Officer accepts a COI (coverage + expiry checks)"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: ["status -> ACCEPTED; prior ACCEPTED COI demoted to SUBMITTED; application.coi_on_file -> true"]

  - method: POST
    path: "/permit-applications/{appId}/coi/{coiId}/reject"
    description: "Officer rejects a COI"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: ["status -> REJECTED; coi_on_file recomputed"]

  # ---- Deposit (child) ----
  - method: POST
    path: "/permit-applications/{appId}/deposit"
    description: "Applicant pays the cleanup/damage deposit"
    roles: [Applicant]
    code: 201
    input: [amount]
    output: Deposit
    side_effects: ["status HELD; amount validated >= deposit_required"]

  - method: GET
    path: "/permit-applications/{appId}/deposit"
    description: "List deposit(s) of an application (reverse-reachability for Deposit.application_id)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Deposit[]"
    side_effects: []

  # ---- Invoice (child) ----
  - method: GET
    path: "/permit-applications/{appId}/invoice"
    description: "List invoice(s) of an application (reverse-reachability for Invoice.application_id)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  # ---- CleanupDebrief (child) ----
  - method: POST
    path: "/permit-applications/{appId}/debrief"
    description: "Officer opens a post-event cleanup/debrief record on an ISSUED application"
    roles: [PermitOfficer]
    code: 201
    input: [actual_attendance, "cleanup_charges?", "incident_count?"]
    output: CleanupDebrief
    side_effects: ["status OPEN"]

  - method: GET
    path: "/permit-applications/{appId}/debrief"
    description: "List debriefs of an application (reverse-reachability for CleanupDebrief.application_id)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CleanupDebrief[]"
    side_effects: []

  - method: POST
    path: "/permit-applications/{appId}/debrief/{debriefId}/finalize"
    description: "Officer finalizes debrief; trues-up invoice, reconciles deposit, releases segments, closes permit"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: CleanupDebrief
    side_effects: ["debrief FINALIZED; application ISSUED -> CLOSED; Invoice SETTLED with ACTUAL cost recovery; Deposit reconciled; ACTIVE segments RELEASED; Venue.version increments by 1"]

  # ---- top-level child collections (enable FK reverse-reachability via
  #      2-part single-resource GET + filtered list; children are also nested) ----
  - method: GET
    path: "/route-segments/{segmentId}"
    description: "Get a route segment by id (top-level; enables RouteSegment collection segment)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: []
    output: RouteSegment
    side_effects: []

  - method: GET
    path: "/department-reviews"
    description: "List department reviews filtered by application_id (reverse-reachability for DepartmentReview.application_id)"
    roles: [Applicant, PermitOfficer, DepartmentReviewer]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: "DepartmentReview[]"
    side_effects: []

  - method: GET
