      - name: cascading_side_effect_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ForfeitureProceeding.INITIATED_to_FINAL
          - state_machines.Permit.status.ISSUED_to_FORFEITED
          - state_machines.Operator.self_bond_status.QUALIFIED_to_DISQUALIFIED
          - state_machines.BondInstrument.ACCEPTED_to_SUBSTITUTION_REQUIRED
        excluded_because:
          difficulty_instance: transitive_cascade / forfeiture_finalize_cascade_reaches_second_permit_bond_deficiency
          rationale: "That §1.8 instance walks the full four-link chain (proceeding → permit → operator → the operator's other permit's self-bond instrument) and asserts every level, which is exactly this layer's end-to-end claim."

      - name: dual_variant_calculations_produce_distinct_results
        claim_type: dual_variant_calculation
        grounds:
          - calculations.bond_required_amount
          - calculations.operator_self_bond_capacity
        excluded_because:
          difficulty_instance: dual_variant_calc / bond_required_full_plan_vs_incremental_variant_divergence
          rationale: "Both variant families are probed there and in self_bond_capacity_net_worth_vs_fixed_asset_variant_divergence, each computing both variants over identical inputs and asserting the delta."

