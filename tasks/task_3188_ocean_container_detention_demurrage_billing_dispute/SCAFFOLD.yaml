# =============================================================================
# SCAFFOLD: Ocean Container Detention & Demurrage Billing Dispute (Matson-style)
# Expert-band scaffold: pricing engine x compliance/audit x ledger reconciliation
# =============================================================================

scenario: |
  Ocean Container Detention & Demurrage Billing Dispute (Matson): free time
  computation for containers at terminals and in customer possession with
  holiday and weekend rules, demurrage accrual at terminals versus detention
  accrual for equipment off-terminal with different rate schedules, terminal
  appointment availability and gate congestion affecting a customer's ability
  to retrieve containers, dispute submission with evidence of appointment
  unavailability, chassis shortage or customs hold, billing credits and waiver
  authority with documented justification, equipment return location
  assignment and empty return restrictions, contractual free time variations
  by service contract, aging receivable management and dispute backlog.

domain_name: ocean-detention-demurrage
api_prefix: /ocean-billing

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_code, type: string, source: input, description: "Unique customer account code (e.g. SCAC + numeric suffix); unique across all accounts" }
      - { name: legal_name, type: string, source: input, description: "Customer legal name" }
      - { name: credit_hold, type: boolean, source: system, default: false, description: "Set true when aging receivable posture forces new bookings to be blocked" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of balance_due_cents over this account's Invoices with status IN {ISSUED, PARTIALLY_PAID, DISPUTED}; recomputed on every invoice mutation" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED -> CLOSED; SUSPENDED when aging_bucket_61_plus_cents > 0 for CREDIT_HOLD_GRACE_DAYS consecutive days" }

  - name: ServiceContract
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: customer_account_id, type: string, source: system, description: "FK -> CustomerAccount.id; owning account" }
      - { name: contract_ref, type: string, source: input, description: "Human contract reference; unique across all contracts" }
      - { name: demurrage_free_days, type: integer, source: input, description: "Free working days at terminal before demurrage accrues; 0..30" }
      - { name: detention_free_days, type: integer, source: input, description: "Free working days off-terminal before detention accrues; 0..30" }
      - { name: saturday_counts_as_free_day, type: boolean, source: input, default: false, description: "When true, Saturdays consume free time; when false, Saturdays are skipped like Sundays" }
      - { name: demurrage_rate_schedule, type: enum, source: input, description: "STANDARD | EXTENDED_TIERED — selects demurrage tier table in calculations.demurrage_accrual" }
      - { name: detention_rate_schedule, type: enum, source: input, description: "STANDARD | EXTENDED_TIERED — selects detention tier table in calculations.detention_accrual" }
      - { name: effective_from, type: datetime, source: input, description: "Contract coverage start (UTC date, inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Contract coverage end (UTC date, inclusive); must be >= effective_from" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> EXPIRED; ACTIVE only when current date within [effective_from, effective_to] and activated by ContractManager" }

  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - { name: terminal_code, type: string, source: input, description: "Unique terminal code (e.g. OAK, HON)" }
      - { name: timezone, type: string, source: input, description: "IANA timezone used for gate-day boundary computation (e.g. Pacific/Honolulu)" }
      - { name: daily_appointment_capacity, type: integer, source: input, description: "Max gate-out appointment slots issuable per terminal working day; >= 1" }
      - { name: gate_closed_weekends, type: boolean, source: input, default: true, description: "When true, terminal gates are closed Sat/Sun and no appointments exist on those days" }

  - name: TerminalHoliday
    parent: Terminal
    common_fields: false
    fields:
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id; terminal observing the holiday" }
      - { name: holiday_date, type: datetime, source: input, description: "UTC calendar date of the holiday (time component ignored); unique per terminal" }
      - { name: name, type: string, source: input, description: "Holiday name (e.g. 'Labor Day')" }

  - name: TerminalAppointmentSlot
    parent: Terminal
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id; terminal offering the slot" }
      - { name: slot_date, type: datetime, source: input, description: "UTC calendar date of the appointment window" }
      - { name: slot_seq, type: integer, source: input, description: "Sequence number within the date; (terminal_id, slot_date, slot_seq) unique" }
      - { name: capacity, type: integer, source: input, description: "Total bookable appointments in this slot; >= 1" }
      - { name: booked_count, type: integer, source: system, default: 0, description: "Number of CONFIRMED bookings against this slot; invariant: 0 <= booked_count <= capacity" }
      - { name: status, type: enum, source: system, description: "OPEN -> FULL -> RELEASED; derived from booked_count vs capacity; RELEASED = administratively closed" }

  - name: EquipmentReturnLocation
    parent: null
    common_fields: true
    fields:
      - { name: location_code, type: string, source: input, description: "Unique return-depot code" }
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id; terminal whose empties this depot accepts" }
      - { name: accepts_equipment_types, type: array, source: input, description: "Array of equipment types accepted: any of DRY20 | DRY40 | DRY40HC | REEFER40 | FLATRACK40" }
      - { name: daily_empty_capacity, type: integer, source: input, description: "Max empty returns accepted per calendar day; >= 1" }
      - { name: status, type: enum, source: system, description: "OPEN | RESTRICTED | CLOSED — RESTRICTED refuses returns except containers assigned before restriction" }

  - name: Container
    parent: null
    common_fields: true
    fields:
      - { name: container_number, type: string, source: input, description: "ISO 6346 container number; unique" }
      - { name: equipment_type, type: enum, source: input, description: "DRY20 | DRY40 | DRY40HC | REEFER40 | FLATRACK40" }
      - { name: customer_account_id, type: string, source: system, description: "FK -> CustomerAccount.id; billed party" }
      - { name: service_contract_id, type: string, source: system, description: "FK -> ServiceContract.id; contract whose free-time/rate schedule governs this move; pinned at availability, immutable thereafter" }
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id; terminal of discharge" }
      - { name: discharge_ts, type: datetime, source: input, description: "UTC timestamp the container was discharged from vessel" }
      - { name: available_ts, type: datetime, source: input, description: "UTC timestamp container became available for pickup; demurrage free-time clock starts at the next terminal working day after available_ts" }
      - { name: gate_out_ts, type: datetime, source: system, default: null, description: "UTC timestamp of gate-out; detention free-time clock starts at the next working day after gate_out_ts" }
      - { name: empty_return_ts, type: datetime, source: system, default: null, description: "UTC timestamp of empty return acceptance; detention accrual stops" }
      - { name: assigned_return_location_id, type: string, source: system, default: null, description: "FK -> EquipmentReturnLocation.id; assigned at gate-out by selector policy, may be reassigned by EquipmentController" }
      - { name: hold_flags, type: array, source: system, default: "[]", description: "Array of active hold codes: any of CUSTOMS_HOLD | CHASSIS_SHORTAGE | USDA_HOLD; each entry {code, placed_ts, released_ts}; a hold with released_ts null is active" }
      - { name: demurrage_billable_days, type: integer, source: computed, default: 0, description: "Billable demurrage days accrued to date per calculations.demurrage_accrual" }
      - { name: detention_billable_days, type: integer, source: computed, default: 0, description: "Billable detention days accrued to date per calculations.detention_accrual" }
      - { name: demurrage_amount_cents, type: integer, source: computed, default: 0, description: "Provisional demurrage accrual in cents" }
      - { name: detention_amount_cents, type: integer, source: computed, default: 0, description: "Provisional detention accrual in cents" }
      - { name: status, type: enum, source: system, description: "DISCHARGED -> AVAILABLE -> GATE_OUT -> EMPTY_RETURNED -> BILLED; terminal sub-state CUSTOMS_HELD overlays AVAILABLE" }

  - name: ChargeAccrual
    parent: Container
    common_fields: false
    fields:
      - { name: container_id, type: string, source: system, description: "FK -> Container.id; container the charge belongs to" }
      - { name: charge_kind, type: enum, source: system, description: "DEMURRAGE | DETENTION" }
      - { name: billable_days, type: integer, source: system, description: "Days accrued in this accrual run" }
      - { name: amount_cents, type: integer, source: system, description: "Charge amount in cents" }
      - { name: rate_schedule, type: enum, source: system, description: "STANDARD | EXTENDED_TIERED — the schedule actually applied" }
      - { name: computed_at, type: datetime, source: system, description: "Logical-clock timestamp of accrual computation" }
      - { name: window_from, type: datetime, source: system, description: "First billable day (inclusive)" }
      - { name: window_to, type: datetime, source: system, description: "Last billable day (inclusive)" }
      - { name: voided, type: boolean, source: system, default: false, description: "True once superseded by a later accrual or zeroed by a credit; voided rows never enter invoice totals" }

  - name: Invoice
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: customer_account_id, type: string, source: system, description: "FK -> CustomerAccount.id; billed account" }
      - { name: container_id, type: string, source: system, description: "FK -> Container.id; exactly one invoice per container lifecycle" }
      - { name: demurrage_total_cents, type: integer, source: system, description: "Frozen demurrage total from non-voided ChargeAccrual rows at issuance" }
      - { name: detention_total_cents, type: integer, source: system, description: "Frozen detention total from non-voided ChargeAccrual rows at issuance" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "demurrage_total_cents + detention_total_cents" }
      - { name: credit_total_cents, type: integer, source: computed, default: 0, description: "Sum of CreditWaiver.amount_cents with status = APPLIED against this invoice" }
      - { name: paid_total_cents, type: integer, source: computed, default: 0, description: "Sum of Payment.amount_cents with status = SETTLED against this invoice" }
      - { name: balance_due_cents, type: integer, source: computed, description: "gross_amount_cents - credit_total_cents - paid_total_cents; invariant: >= 0" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp at issuance" }
      - { name: due_at, type: datetime, source: system, description: "issued_at + PAYMENT_TERMS_DAYS (30) calendar days" }
      - { name: aging_bucket, type: enum, source: computed, description: "CURRENT | DAYS_1_30 | DAYS_31_60 | DAYS_61_PLUS — derived from (current_clock - due_at) for unpaid balance; see calculations.aging_bucket" }
      - { name: status, type: enum, source: system, description: "ISSUED -> PARTIALLY_PAID -> PAID | ISSUED -> DISPUTED -> RESOLVED_* -> ...; see state machine" }

  - name: Dispute
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; disputed invoice" }
      - { name: filed_by_account_id, type: string, source: system, description: "FK -> CustomerAccount.id; must equal invoice.customer_account_id" }
      - { name: dispute_reason, type: enum, source: input, description: "APPOINTMENT_UNAVAILABLE | CHASSIS_SHORTAGE | CUSTOMS_HOLD | FREE_TIME_MISCALC | RATE_MISMATCH | OTHER" }
      - { name: contested_amount_cents, type: integer, source: input, description: "Amount under dispute; 1 <= contested_amount_cents <= invoice.balance_due_cents" }
      - { name: evidence_window_start, type: datetime, source: input, description: "Start of the period the customer claims was non-billable" }
      - { name: evidence_window_end, type: datetime, source: input, description: "End of the period the customer claims was non-billable; must be >= evidence_window_start" }
      - { name: evidence_summary, type: string, source: input, description: "Free-text justification; REQUIRED and non-empty for waiver credit decisions" }
      - { name: resolution_code, type: enum, source: system, default: null, description: "FULL_CREDIT | PARTIAL_CREDIT | DENIED | WITHDRAWN; set at resolution" }
      - { name: resolved_amount_cents, type: integer, source: system, default: 0, description: "Credited amount at resolution; 0 when DENIED/WITHDRAWN" }
      - { name: resolution_justification, type: string, source: system, default: null, description: "Documented justification REQUIRED when resolution_code IN {FULL_CREDIT, PARTIAL_CREDIT}" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }
      - { name: sla_due_at, type: datetime, source: system, description: "submitted_at + DISPUTE_SLA_DAYS (14) calendar days; drives backlog escalation" }
      - { name: escalated, type: boolean, source: system, default: false, description: "Set true by system when current clock passes sla_due_at while status IN {SUBMITTED, UNDER_REVIEW}" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> RESOLVED_* / ESCALATED_REVIEW cycle; see state machine" }

  - name: DisputeEvidence
    parent: Dispute
    common_fields: false
    fields:
      - { name: dispute_id, type: string, source: system, description: "FK -> Dispute.id; owning dispute" }
      - { name: evidence_type, type: enum, source: input, description: "APPOINTMENT_SCREENSHOT | CHASSIS_POOL_NOTICE | CUSTOMS_HOLD_NOTICE | APPOINTMENT_API_LOG | OTHER" }
      - { name: evidence_date, type: datetime, source: input, description: "Date the evidence pertains to; MUST fall within [dispute.evidence_window_start, dispute.evidence_window_end]" }
      - { name: reference_uri, type: string, source: input, description: "URI of the stored evidence artifact" }
      - { name: supersedes_evidence_id, type: string, source: input, default: null, description: "FK -> DisputeEvidence.id; optional self-reference when a corrected artifact replaces an earlier one; the replaced artifact remains queryable but excluded from verification totals" }

  - name: CreditWaiver
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; credited invoice" }
      - { name: dispute_id, type: string, source: system, default: null, description: "FK -> Dispute.id; set when the credit flows from dispute resolution; null for goodwill credits" }
      - { name: amount_cents, type: integer, source: input, description: "Credit amount; 1 <= amount_cents <= invoice.balance_due_cents at application time" }
      - { name: authority_tier, type: enum, source: computed, description: "TIER_1_AGENT (<= TIER1_LIMIT_CENTS) | TIER_2_SUPERVISOR (<= TIER2_LIMIT_CENTS) | TIER_3_DIRECTOR (unbounded) — derived from amount_cents, NOT chosen by the caller" }
      - { name: justification, type: string, source: input, description: "Documented justification; REQUIRED non-empty for every credit" }
      - { name: applied_by_user_id, type: string, source: system, description: "X-User-ID of the applying role; recorded for segregation-of-duties checks" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> APPLIED | REJECTED | REVERSED" }

  - name: Payment
    parent: Invoice
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; paid invoice" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; 1 <= amount_cents <= invoice.balance_due_cents" }
      - { name: tendered_at, type: datetime, source: system, description: "Logical-clock timestamp when tendered" }
      - { name: status, type: enum, source: system, description: "SETTLED (terminal; no reversal in v1)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CustomerAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic: aging posture sweep — see calculations.aging_posture)"
        actor: system
        preconditions:
          - "aging_bucket_61_plus exposure > 0 for at least CREDIT_HOLD_GRACE_DAYS consecutive logical days"
        side_effects:
          - "credit_hold = true"
          - "New container intake for this account rejected (ERR_ACCOUNT_CREDIT_HOLD)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic: all invoices leave DAYS_61_PLUS bucket via payment or credit)"
        actor: system
        preconditions:
          - "No invoice for this account has aging_bucket = DAYS_61_PLUS with balance_due_cents > 0"
        side_effects:
          - "credit_hold = false"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /ocean-billing/customer-accounts/{accountId}/close"
        actor: ContractManager
        preconditions:
          - "outstanding_balance_cents == 0 (ERR_ACCOUNT_BALANCE_OUTSTANDING)"
          - "No Container for this account in status IN {DISCHARGED, AVAILABLE, GATE_OUT} (ERR_ACCOUNT_CONTAINERS_ACTIVE)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /ocean-billing/customer-accounts/{accountId}/close"
        actor: ContractManager
        preconditions:
          - "outstanding_balance_cents == 0 (ERR_ACCOUNT_BALANCE_OUTSTANDING)"
          - "No Container for this account in status IN {DISCHARGED, AVAILABLE, GATE_OUT}"
        side_effects: []

  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /ocean-billing/service-contracts/{contractId}/activate"
        actor: ContractManager
        preconditions:
          - "effective_from <= current logical clock date <= effective_to (ERR_CONTRACT_NOT_IN_EFFECT)"
          - "Parent CustomerAccount.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when current logical clock date > effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "Containers already pinned to this contract KEEP the contract's schedule (grandfathered)"

  - entity: TerminalAppointmentSlot
    initial_state: OPEN
    terminal_states: [RELEASED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (automatic when booked_count == capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system (automatic when a booking is released and booked_count < capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: RELEASED
        trigger: "POST /ocean-billing/terminal-appointment-slots/{slotId}/release"
        actor: TerminalOperator
        preconditions: []
        side_effects:
          - "Subsequent booking attempts rejected (ERR_SLOT_RELEASED); booked_count preserved for congestion evidence queries"

  - entity: Container
    initial_state: DISCHARGED
    terminal_states: [BILLED]
    transitions:
      - from: DISCHARGED
        to: AVAILABLE
        trigger: "POST /ocean-billing/containers/{containerId}/mark-available"
        actor: TerminalOperator
        preconditions:
          - "available_ts >= discharge_ts (ERR_INVALID_REQUEST)"
        side_effects:
          - "Demurrage free-time clock anchors at first terminal working day strictly after available_ts (working day = not Sunday, not a TerminalHoliday for this terminal, and not Saturday unless contract.saturday_counts_as_free_day)"
      - from: AVAILABLE
        to: GATE_OUT
        trigger: "POST /ocean-billing/containers/{containerId}/gate-out"
        actor: TerminalOperator
        preconditions:
          - "No active CUSTOMS_HOLD or USDA_HOLD in hold_flags (ERR_CONTAINER_HELD)"
          - "A confirmed appointment booking exists for this container at this terminal on the gate-out day OR slot_override = true with documented reason (ERR_APPOINTMENT_REQUIRED)"
        side_effects:
          - "gate_out_ts set to current logical clock"
          - "Demurrage accrual finalizes: demurrage_billable_days and demurrage_amount_cents frozen; ChargeAccrual(kind=DEMURRAGE) row written"
          - "assigned_return_location_id selected by selector policy (see endpoints POST gate-out): eligible = EquipmentReturnLocation where terminal_id == container.terminal_id AND container.equipment_type IN accepts_equipment_types AND status IN {OPEN, RESTRICTED}; rank by daily_empty_capacity DESC; tie-break location_code ASC; empty pool -> ERR_NO_RETURN_LOCATION"
          - "Detention free-time clock anchors at first working day strictly after gate_out_ts (same working-day definition)"
      - from: GATE_OUT
        to: EMPTY_RETURNED
        trigger: "POST /ocean-billing/containers/{containerId}/return-empty"
        actor: EquipmentController
        preconditions:
          - "assigned_return_location_id is not null"
          - "assigned return location status != CLOSED (ERR_RETURN_LOCATION_CLOSED)"
          - "If assigned return location status == RESTRICTED: container must have been assigned BEFORE the restriction was set (ERR_RETURN_LOCATION_RESTRICTED)"
          - "Daily empty-return count at assigned location for the return date < daily_empty_capacity (ERR_RETURN_CAPACITY_EXCEEDED)"
        side_effects:
          - "empty_return_ts set to current logical clock"
          - "Detention accrual finalizes: detention_billable_days and detention_amount_cents frozen; ChargeAccrual(kind=DETENTION) row written"
      - from: EMPTY_RETURNED
        to: BILLED
        trigger: "POST /ocean-billing/containers/{containerId}/issue-invoice"
        actor: BillingAgent
        preconditions:
          - "CustomerAccount.status != CLOSED (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "Invoice created: demurrage_total_cents / detention_total_cents frozen from non-voided ChargeAccrual rows"
          - "Invoice.status = ISSUED; issued_at = logical clock; due_at = issued_at + 30 calendar days"
          - "CustomerAccount.outstanding_balance_cents += invoice.balance_due_cents"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /ocean-billing/invoices/{invoiceId}/payments (amount < balance_due_cents)"
        actor: BillingAgent
        preconditions:
          - "payment amount < balance_due_cents at tender time"
        side_effects:
          - "paid_total_cents += amount; balance_due_cents recomputed; CustomerAccount.outstanding_balance_cents -= amount"
      - from: ISSUED
        to: PAID
        trigger: "POST /ocean-billing/invoices/{invoiceId}/payments (amount == balance_due_cents)"
        actor: BillingAgent
        preconditions:
          - "payment amount == balance_due_cents at tender time"
        side_effects:
          - "balance_due_cents = 0; CustomerAccount.outstanding_balance_cents -= amount; aging posture sweep may unsuspend account"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /ocean-billing/invoices/{invoiceId}/payments (amount == balance_due_cents)"
        actor: BillingAgent
        preconditions: []
        side_effects:
          - "balance_due_cents = 0; CustomerAccount.outstanding_balance_cents -= amount"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /ocean-billing/invoices/{invoiceId}/disputes (create dispute)"
        actor: CustomerRep
        preconditions:
          - "No other Dispute for this invoice in status IN {SUBMITTED, UNDER_REVIEW} (ERR_DISPUTE_ALREADY_OPEN)"
        side_effects:
          - "Aging clock for the disputed portion is NOT frozen; aging_bucket continues to accrue on balance_due_cents (contested amount still ages)"
      - from: PARTIALLY_PAID
        to: DISPUTED
        trigger: "POST /ocean-billing/invoices/{invoiceId}/disputes"
        actor: CustomerRep
        preconditions:
          - "No other Dispute for this invoice in status IN {SUBMITTED, UNDER_REVIEW}"
        side_effects: []
      - from: DISPUTED
        to: PARTIALLY_PAID
        trigger: "system (automatic when dispute resolves DENIED or WITHDRAWN and paid_total_cents > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: ISSUED
        trigger: "system (automatic when dispute resolves DENIED or WITHDRAWN and paid_total_cents == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: PAID
        trigger: "system (automatic when dispute resolution credit + payments reduce balance_due_cents to 0)"
        actor: system
        preconditions: []
        side_effects:
          - "CustomerAccount.outstanding_balance_cents -= credited amount"
      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /ocean-billing/invoices/{invoiceId}/write-off"
        actor: CreditDirector
        preconditions:
          - "aging_bucket == DAYS_61_PLUS (ERR_INVOICE_NOT_AGED_ENOUGH)"
          - "justification provided (ERR_JUSTIFICATION_REQUIRED)"
        side_effects:
          - "balance_due_cents -> 0 via implicit write-off CreditWaiver (authority_tier = TIER_3_DIRECTOR) with dispute_id = null"
          - "CustomerAccount.outstanding_balance_cents -= written-off amount"
      - from: PARTIALLY_PAID
        to: WRITTEN_OFF
        trigger: "POST /ocean-billing/invoices/{invoiceId}/write-off"
        actor: CreditDirector
        preconditions:
          - "aging_bucket == DAYS_61_PLUS"
          - "justification provided"
        side_effects:
          - "Same as ISSUED -> WRITTEN_OFF"

  - entity: Dispute
    initial_state: SUBMITTED
    terminal_states: [RESOLVED_FULL_CREDIT, RESOLVED_PARTIAL_CREDIT, RESOLVED_DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /ocean-billing/disputes/{disputeId}/start-review"
        actor: BillingAgent
        preconditions:
          - "At least one DisputeEvidence attached (ERR_EVIDENCE_REQUIRED) when dispute_reason IN {APPOINTMENT_UNAVAILABLE, CHASSIS_SHORTAGE, CUSTOMS_HOLD}"
        side_effects:
          - "Reviewing agent's X-User-ID recorded as reviewing_user_id (for segregation of duties)"
      - from: UNDER_REVIEW
        to: SUBMITTED
        trigger: "POST /ocean-billing/disputes/{disputeId}/return-to-queue"
        actor: BillingAgent
        preconditions: []
        side_effects:
          - "reviewing_user_id cleared (revision loop — cyclic shape)"
      - from: UNDER_REVIEW
        to: RESOLVED_FULL_CREDIT
        trigger: "POST /ocean-billing/disputes/{disputeId}/resolve"
        actor: BillingAgent | CreditSupervisor | CreditDirector
        preconditions:
          - "payload.resolution_code == FULL_CREDIT"
          - "resolution_justification non-empty (ERR_JUSTIFICATION_REQUIRED)"
          - "resolved_amount_cents == dispute.contested_amount_cents"
          - "Actor's authority tier covers resolved_amount_cents per CreditWaiver tier derivation (ERR_WAIVER_AUTHORITY_EXCEEDED)"
          - "Segregation of duties: actor's X-User-ID != dispute's reviewing_user_id captured at start-review when actor is BillingAgent and the same user also filed evidence... enforced as: the resolving user MUST NOT equal the user who filed the dispute's evidence IF that user is a BillingAgent (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CreditWaiver created (dispute_id = this dispute, amount = resolved_amount_cents, status = APPLIED)"
          - "Invoice.credit_total_cents += amount; balance_due_cents recomputed; if 0 -> Invoice PAID, else back to ISSUED/PARTIALLY_PAID by paid_total_cents"
          - "CustomerAccount.outstanding_balance_cents -= amount"
          - "Voided-check: if credit covers full demurrage or detention amount, matching ChargeAccrual rows flagged voided = true"
      - from: UNDER_REVIEW
        to: RESOLVED_PARTIAL_CREDIT
        trigger: "POST /ocean-billing/disputes/{disputeId}/resolve"
        actor: BillingAgent | CreditSupervisor | CreditDirector
        preconditions:
          - "payload.resolution_code == PARTIAL_CREDIT"
          - "1 <= resolved_amount_cents < contested_amount_cents (ERR_RESOLVED_AMOUNT_INVALID)"
          - "resolution_justification non-empty"
          - "Actor's authority tier covers resolved_amount_cents"
        side_effects:
          - "Same credit cascade as FULL_CREDIT but for resolved_amount_cents"
      - from: UNDER_REVIEW
        to: RESOLVED_DENIED
        trigger: "POST /ocean-billing/disputes/{disputeId}/resolve"
        actor: BillingAgent | CreditSupervisor | CreditDirector
        preconditions:
          - "payload.resolution_code == DENIED"
          - "resolution_justification non-empty"
        side_effects:
          - "Invoice returns to ISSUED (paid_total == 0) or PARTIALLY_PAID (paid_total > 0); no credit created"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /ocean-billing/disputes/{disputeId}/withdraw"
        actor: CustomerRep
        preconditions:
          - "Actor's account == dispute.filed_by_account_id (ERR_FORBIDDEN)"
        side_effects:
          - "Invoice returns to ISSUED or PARTIALLY_PAID by paid_total_cents"

  - entity: CreditWaiver
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED, REVERSED]
    transitions:
      - from: PROPOSED
        to: APPLIED
        trigger: "POST /ocean-billing/credit-waivers/{waiverId}/approve"
        actor: CreditSupervisor | CreditDirector
        preconditions:
          - "Approver's tier >= waiver.authority_tier (TIER_3_DIRECTOR > TIER_2_SUPERVISOR > TIER_1_AGENT) (ERR_WAIVER_AUTHORITY_EXCEEDED)"
          - "Approver X-User-ID != waiver.applied_by_user_id (segregation of duties — proposer cannot approve own waiver) (ERR_SEGREGATION_OF_DUTIES)"
          - "amount_cents <= invoice.balance_due_cents at approval time (ERR_CREDIT_EXCEEDS_BALANCE)"
        side_effects:
          - "Invoice.credit_total_cents += amount_cents; balance_due_cents recomputed; PAID if 0"
          - "CustomerAccount.outstanding_balance_cents -= amount_cents"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /ocean-billing/credit-waivers/{waiverId}/reject"
        actor: CreditSupervisor | CreditDirector
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: REVERSED
        trigger: "POST /ocean-billing/credit-waivers/{waiverId}/reverse"
        actor: CreditDirector
        preconditions:
          - "Invoice.status != PAID (ERR_INVOICE_ALREADY_SETTLED)"
          - "Invoice.balance_due_cents + amount_cents <= invoice.gross_amount_cents - paid_total_cents (reversal cannot make paid_total exceed gross) (ERR_REVERSAL_EXCEEDS_NET)"
        side_effects:
          - "Invoice.credit_total_cents -= amount_cents; balance_due_cents recomputed"
          - "CustomerAccount.outstanding_balance_cents += amount_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: dispute-resolve-stale-dispute
    parent_entity: Dispute
    write_endpoint: "POST /ocean-billing/disputes/{disputeId}/resolve"
    occ_field: "expected_dispute_version"
    description: |
      Resolving a Dispute whose version has advanced since the client last
      observed it is rejected. Another writer may have returned the dispute to
      queue or attached evidence (bumping version), making the current
      resolver's view of the dispute stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: waiver-approve-stale-waiver
    parent_entity: CreditWaiver
    write_endpoint: "POST /ocean-billing/credit-waivers/{waiverId}/approve"
    occ_field: "expected_waiver_version"
    description: |
      Approving a CreditWaiver whose version has advanced since the client
      last observed it is rejected; the proposer or another supervisor may
      have amended the amount, making the approver's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: working_day_sequence
    trigger: "Referenced by free_time_window, demurrage_accrual, detention_accrual"
    algorithm: chronological
    formula: |
      working_days(terminal, contract, from_date_exclusive) =
        iterate calendar dates d = from_date + 1, from_date + 2, ...
        include d IFF:
          weekday(d) != Sunday
          AND NOT exists TerminalHoliday(terminal_id = terminal.id, holiday_date = d)
          AND (weekday(d) != Saturday OR contract.saturday_counts_as_free_day == true)
      All date arithmetic in the terminal's timezone; a date is a calendar date
      in terminal.timezone, not a 24h UTC window.
    input_set: "TerminalHoliday rows for the container's terminal; contract's saturday_counts_as_free_day flag"
    constants: {}
    precision: "whole days"

  - name: free_time_window
    trigger: "Demurrage: at mark-available. Detention: at gate-out."
    algorithm: chronological
    formula: |
      demurrage_free_window = first N working days strictly after available_ts,
        where N = contract.demurrage_free_days (N=0 -> empty window)
      detention_free_window = first M working days strictly after gate_out_ts,
        where M = contract.detention_free_days
      HOLD OVERLAY: any calendar day on which the container carried an active
      CUSTOMS_HOLD or USDA_HOLD (demurrage phase) or CHASSIS_SHORTAGE
      (detention phase) is EXCLUDED from both free and billable day counts
      (the clock stops; the day is neither free nor billable).
    input_set: "Container timestamps, active hold intervals from hold_flags, terminal working-day sequence"
    constants: {}
    precision: "whole days"

  - name: demurrage_accrual
    trigger: "At gate-out (final) AND at GET /containers/{id} (provisional, computed as-of current logical clock without persisting)"
    algorithm: tiered_pricing
    formula: |
      billable_days = working days strictly after the demurrage free window and
        on/before the accrual end (gate_out date for final; current logical
        date for provisional), EXCLUDING hold-overlay days.
      Tier table (schedule STANDARD):
        days 1-3:   15000 cents/day
        days 4-7:   30000 cents/day
        days 8+:    45000 cents/day
      Tier table (schedule EXTENDED_TIERED):
        days 1-5:   12000 cents/day
        days 6-10:  24000 cents/day
        days 11-15: 36000 cents/day
        days 16+:   50000 cents/day
      MARGINAL allocation: the k-th billable day is priced at the tier whose
      range contains k; days straddling a boundary split across tiers.
      amount_cents = sum over billable days of marginal rate.
      EVALUATION ORDER: compute billable_days FIRST (working-day sequence),
      then map day-index -> tier rate; the tier never changes which days count.
    input_set: "Containers in status AVAILABLE (provisional) or transitioning to GATE_OUT (final); contract demurrage_rate_schedule pinned on container"
    constants:
      STANDARD_T1_DAYS: 3
      STANDARD_T1_RATE: 15000
      STANDARD_T2_DAYS: 7
      STANDARD_T2_RATE: 30000
      STANDARD_T3_RATE: 45000
      EXTENDED_T1_DAYS: 5
      EXTENDED_T1_RATE: 12000
      EXTENDED_T2_DAYS: 10
      EXTENDED_T2_RATE: 24000
      EXTENDED_T3_DAYS: 15
      EXTENDED_T3_RATE: 36000
      EXTENDED_T4_RATE: 50000
    precision: "integer cents; no rounding needed (all rates whole cents)"
    variants:
      - name: provisional
        when: "GET read while container still at terminal (status AVAILABLE)"
        difference: "Accrual end = current logical date; result returned in computed fields but NOT persisted as ChargeAccrual; provisional and final diverge whenever the logical clock moves between reads"
      - name: final
        when: "gate-out transition"
        difference: "Accrual end = gate_out date; result frozen on container and persisted as a ChargeAccrual(kind=DEMURRAGE) row"

  - name: detention_accrual
    trigger: "At return-empty (final) AND provisionally at GET /containers/{id} while status == GATE_OUT"
    algorithm: tiered_pricing
    formula: |
      billable_days = working days strictly after the detention free window and
        on/before the accrual end (empty_return date for final; current
        logical date for provisional), EXCLUDING days with active
        CHASSIS_SHORTAGE hold.
      Tier table (schedule STANDARD) — DIFFERENT from demurrage:
        days 1-4:   9000 cents/day
        days 5-9:   18000 cents/day
        days 10+:   27000 cents/day
      Tier table (schedule EXTENDED_TIERED):
        days 1-6:    7000 cents/day
        days 7-13:  15000 cents/day
        days 14+:   22000 cents/day
      MARGINAL allocation, same day-index mapping rule as demurrage.
    input_set: "Containers in status GATE_OUT (provisional) or transitioning to EMPTY_RETURNED (final)"
    constants:
      DET_STANDARD_T1_DAYS: 4
      DET_STANDARD_T1_RATE: 9000
      DET_STANDARD_T2_DAYS: 9
      DET_STANDARD_T2_RATE: 18000
      DET_STANDARD_T3_RATE: 27000
      DET_EXTENDED_T1_DAYS: 6
      DET_EXTENDED_T1_RATE: 7000
      DET_EXTENDED_T2_DAYS: 13
      DET_EXTENDED_T2_RATE: 15000
      DET_EXTENDED_T3_RATE: 22000
    precision: "integer cents"
    variants:
      - name: provisional
        when: "GET read while container off-terminal (status GATE_OUT)"
        difference: "Accrual end = current logical date; not persisted"
      - name: final
        when: "return-empty transition"
        difference: "Accrual end = empty_return date; frozen and persisted as ChargeAccrual(kind=DETENTION)"

  - name: aging_bucket
    trigger: "Computed on every Invoice read and on aging posture sweep"
    algorithm: threshold
    formula: |
      days_past_due = calendar_days(current_logical_date - due_at)   # may be <= 0
      if balance_due_cents == 0:        bucket = CURRENT
      elif days_past_due <= 0:          bucket = CURRENT
      elif days_past_due <= 30:         bucket = DAYS_1_30
      elif days_past_due <= 60:         bucket = DAYS_31_60
      else:                             bucket = DAYS_61_PLUS
      Boundary: days_past_due == 30 -> DAYS_1_30; == 31 -> DAYS_31_60; == 60 -> DAYS_31_60; == 61 -> DAYS_61_PLUS
    input_set: "Invoices with balance_due_cents > 0 and status IN {ISSUED, PARTIALLY_PAID, DISPUTED}"
    constants:
      BUCKET_1_MAX: 30
      BUCKET_2_MAX: 60
    precision: "whole days"

  - name: aging_posture
    trigger: "System sweep on every logical-clock advance (POST /_clock/set_current_utc) and after every payment/credit mutation"
    algorithm: aggregation
    formula: |
      For each CustomerAccount:
        exposure_61_plus = sum(balance_due_cents) over invoices with
          aging_bucket == DAYS_61_PLUS and status IN {ISSUED, PARTIALLY_PAID, DISPUTED}
        Track consecutive_61_plus_days: incremented when exposure_61_plus > 0
          at a sweep, reset to 0 when exposure_61_plus == 0.
        If consecutive_61_plus_days >= CREDIT_HOLD_GRACE_DAYS and
          account.status == ACTIVE: transition to SUSPENDED (credit_hold=true).
        If exposure_61_plus == 0 and account.status == SUSPENDED:
          transition to ACTIVE (credit_hold=false).
    input_set: "All non-terminal invoices grouped by customer_account_id"
    constants:
      CREDIT_HOLD_GRACE_DAYS: 7
      PAYMENT_TERMS_DAYS: 30
      DISPUTE_SLA_DAYS: 14
    precision: "integer cents, whole days"

  - name: credit_waterfall
    trigger: "CreditWaiver approval or dispute-resolution credit application"
    algorithm: waterfall_allocation
    formula: |
      A credit of amount_cents offsets invoice components in fixed order:
        1. detention_total_cents (detention offsets first — equipment usage)
        2. demurrage_total_cents
      credited_detention = min(amount_cents, detention_total_cents - detention_credits_already_applied)
      credited_demurrage = min(amount_cents - credited_detention,
                               demurrage_total_cents - demurrage_credits_already_applied)
      If credited_detention + credited_demurrage < amount_cents the credit is
      REJECTED (ERR_CREDIT_EXCEEDS_BALANCE) — credits never produce negative
      balance_due_cents and never offset paid amounts.
      REMAINDER: none — rejection instead of remainder.
      ChargeAccrual voiding rule: when cumulative credits against a component
      reach exactly the component total, all non-voided ChargeAccrual rows of
      that kind for the container are flagged voided = true (ordered by
      computed_at ASC; never by id).
    input_set: "Invoice being credited; its prior APPLIED CreditWaivers; container's ChargeAccrual rows"
    constants: {}
    precision: "integer cents"

  - name: waiver_authority_tier
    trigger: "CreditWaiver creation and approval; dispute resolution"
    algorithm: threshold
    formula: |
      amount <= TIER1_LIMIT_CENTS          -> TIER_1_AGENT       (BillingAgent may propose AND apply within limit without supervisor)
      TIER1_LIMIT_CENTS < amount <= TIER2_LIMIT_CENTS
                                           -> TIER_2_SUPERVISOR  (requires CreditSupervisor or CreditDirector approval)
      amount > TIER2_LIMIT_CENTS           -> TIER_3_DIRECTOR    (requires CreditDirector approval)
      Boundary: exactly TIER1_LIMIT_CENTS -> TIER_1_AGENT; exactly TIER2_LIMIT_CENTS -> TIER_2_SUPERVISOR.
    input_set: "CreditWaiver.amount_cents or dispute resolved_amount_cents"
    constants:
      TIER1_LIMIT_CENTS: 50000
      TIER2_LIMIT_CENTS: 500000
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-template resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: business_constraint
    check: "Required request-body fields present; enums valid; numeric ranges valid (e.g. free days 0..30, amount_cents >= 1, evidence_window_end >= evidence_window_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 5
    category: state
    check: "Target resource in a state from which the requested transition exists (per-entity ERR_*_STATE errors)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action/transition endpoints

  - priority: 6
    category: business_safety
    check: "Container hold overlay: gate-out rejected while CUSTOMS_HOLD or USDA_HOLD active"
    error_id: ERR_CONTAINER_HELD
    http_status: 409
    applies_to: "POST /ocean-billing/containers/{containerId}/gate-out"

  - priority: 7
    category: business_temporal
    check: "Terminal working-day rules: appointments only on working days; slot_date must not be a TerminalHoliday / closed weekend; evidence_date within dispute evidence window"
    error_id: ERR_NOT_A_WORKING_DAY
    http_status: 422
    applies_to: "POST /ocean-billing/terminal-appointment-slots, POST /ocean-billing/containers/{id}/appointments, POST /ocean-billing/disputes/{id}/evidence"

  - priority: 8
    category: business_constraint
    check: "Capacity & uniqueness: slot booked_count < capacity; daily empty-return count < daily_empty_capacity; uniqueness on account_code, contract_ref, container_number, terminal_code, location_code, (terminal_id, holiday_date), (terminal_id, slot_date, slot_seq)"
    error_id: ERR_CAPACITY_OR_CONFLICT
    http_status: 409
    applies_to: "creation endpoints, appointment booking, return-empty"

  - priority: 9
    category: business_referential
    check: "Cross-entity state guards: contract ACTIVE at container availability pinning; return location accepts equipment_type and is not CLOSED; evidence belongs to the dispute's window; account not CLOSED for intake"
    error_id: ERR_REFERENTIAL_GUARD
    http_status: 409
    applies_to: "gate-out, return-empty, evidence attach, container registration"

  - priority: 10
    category: business_fiscal
    check: "Fiscal guards: contested/resolved/payment/credit amounts within balance_due_cents; waiver authority tier covers amount; segregation of duties (proposer != approver); OCC expected_*_version match"
    error_id: ERR_FISCAL_GUARD
    http_status: 422
    applies_to: "payments, credit waivers, dispute resolution, write-off"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/ocean-billing/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default is 2026-09-01T00:00:00Z and NEVER falls back to wall-clock; every aging, SLA, free-time, and posture rule reads this clock. Advancing the clock triggers the aging_posture sweep and dispute SLA escalation."
    roles: [TerminalOperator, BillingAgent, ContractManager, CreditSupervisor, CreditDirector, EquipmentController]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "aging_posture sweep runs (account suspend/unsuspend transitions)"
      - "Disputes past sla_due_at with status IN {SUBMITTED, UNDER_REVIEW}: escalated = true"
      - "ServiceContracts past effective_to: status -> EXPIRED"

  # --- CustomerAccount ---
  - method: POST
    path: "/ocean-billing/customer-accounts"
    description: "Register a customer account"
    roles: [ContractManager]
    code: 201
    input: [account_code, legal_name]
    output: CustomerAccount
    side_effects: ["status = ACTIVE, credit_hold = false, outstanding_balance_cents = 0"]

  - method: GET
    path: "/ocean-billing/customer-accounts"
    description: "List customer accounts"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CustomerAccount[]"
    side_effects: []

  - method: GET
    path: "/ocean-billing/customer-accounts/{accountId}"
    description: "Get one customer account"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

  - method: POST
    path: "/ocean-billing/customer-accounts/{accountId}/close"
    description: "Close an account with zero balance and no active containers"
    roles: [ContractManager]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status -> CLOSED"]

  # --- ServiceContract ---
  - method: POST
    path: "/ocean-billing/customer-accounts/{accountId}/service-contracts"
    description: "Create a service contract (DRAFT) for an account"
    roles: [ContractManager]
    code: 201
    input: [contract_ref, demurrage_free_days, detention_free_days, "saturday_counts_as_free_day?", demurrage_rate_schedule, detention_rate_schedule, effective_from, effective_to]
    output: ServiceContract
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/ocean-billing/customer-accounts/{id}/service-contracts"
    description: "List contracts for an account"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, CustomerRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ServiceContract[]"
    side_effects: []

  - method: GET
    path: "/ocean-billing/service-contracts/{contractId}"
    description: "Get one service contract"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, CustomerRep]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: POST
    path: "/ocean-billing/service-contracts/{contractId}/activate"
    description: "Activate a DRAFT contract (must be within effective window)"
    roles: [ContractManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> ACTIVE"]

  # --- Terminal / holidays / slots ---
  - method: POST
    path: "/ocean-billing/terminals"
    description: "Register a terminal"
    roles: [TerminalOperator]
    code: 201
    input: [terminal_code, timezone, daily_appointment_capacity, "gate_closed_weekends?"]
    output: Terminal
    side_effects: []

  - method: GET
    path: "/ocean-billing/terminals"
    description: "List terminals"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Terminal[]"
    side_effects: []

  - method: GET
    path: "/ocean-billing/terminals/{terminalId}"
    description: "Get one terminal"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  - method: POST
    path: "/ocean-billing/terminals/{terminalId}/holidays"
    description: "Declare a terminal holiday"
    roles: [TerminalOperator]
    code: 201
    input: [holiday_date, name]
    output: TerminalHoliday
    side_effects: []

  - method: GET
    path: "/ocean-billing/terminals/{id}/holidays"
    description: "List terminal holidays"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "TerminalHoliday[]"
    side_effects: []

  - method: POST
    path: "/ocean-billing/terminals/{terminalId}/appointment-slots"
    description: "Create an appointment slot for a working day"
    roles: [TerminalOperator]
    code: 201
    input: [slot_date, slot_seq, capacity]
    output: TerminalAppointmentSlot
    side_effects: ["status = OPEN, booked_count = 0"]

  - method: GET
    path: "/ocean-billing/terminals/{id}/appointment-slots"
    description: "List appointment slots (congestion evidence surface)"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: ["limit?", "offset?", "slot_date?", "status?"]
    output: "TerminalAppointmentSlot[]"
    side_effects: []

  - method: GET
    path: "/ocean-billing/terminal-appointment-slots/{slotId}"
    description: "Get one appointment slot"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: []
    output: TerminalAppointmentSlot
    side_effects: []

  - method: POST
    path: "/ocean-billing/terminal-appointment-slots/{slotId}/release"
    description: "Administratively release (close) a slot"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: TerminalAppointmentSlot
    side_effects: ["status -> RELEASED"]

  # --- EquipmentReturnLocation ---
  - method: POST
    path: "/ocean-billing/return-locations"
    description: "Register an empty-return location"
    roles: [EquipmentController]
    code: 201
    input: [location_code, terminal_id, accepts_equipment_types, daily_empty_capacity]
    output: EquipmentReturnLocation
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/ocean-billing/return-locations"
    description: "List return locations"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: ["limit?", "offset?", "terminal_id?", "status?"]
    output: "EquipmentReturnLocation[]"
    side_effects: []

  - method: GET
    path: "/ocean-billing/return-locations/{locationId}"
    description: "Get one return location"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: []
    output: EquipmentReturnLocation
    side_effects: []

  - method: POST
    path: "/ocean-billing/return-locations/{locationId}/set-status"
    description: "Set return location status (OPEN | RESTRICTED | CLOSED)"
    roles: [EquipmentController]
    code: 200
    input: [status]
    output: EquipmentReturnLocation
    side_effects: []

  # --- Container lifecycle ---
  - method: POST
    path: "/ocean-billing/containers"
    description: "Register a discharged container and pin its governing contract"
    roles: [TerminalOperator]
    code: 201
    input: [container_number, equipment_type, customer_account_id, service_contract_id, terminal_id, discharge_ts, available_ts]
    output: Container
    side_effects:
      - "status = DISCHARGED"
      - "service_contract pinned (must be ACTIVE; ERR_ACCOUNT_CREDIT_HOLD if account suspended)"

  - method: GET
    path: "/ocean-billing/containers"
    description: "List containers"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: ["limit?", "offset?", "customer_account_id?", "terminal_id?", "status?", "service_contract_id?", "assigned_return_location_id?"]
    output: "Container[]"
    side_effects: []

  - method: GET
    path: "/ocean-billing/containers/{containerId}"
    description: "Get one container; provisional accruals computed as-of the logical clock"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: []
    output: Container
    side_effects:
      - "Provisional demurrage/detention fields recomputed as-of logical clock (not persisted as ChargeAccrual)"

  - method: GET
    path: "/ocean-billing/containers/{id}/accruals"
    description: "List ChargeAccrual rows for a container"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, TerminalOperator, EquipmentController, CustomerRep]
    code: 200
    input: ["limit?", "offset?", "charge_kind?", "voided?"]
    output: "ChargeAccrual[]"
    side_effects: []

  - method: POST
    path: "/ocean-billing/containers/{containerId}/mark-available"
    description: "Transition DISCHARGED -> AVAILABLE"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: Container
    side_effects: ["Demurrage free-time anchor computed"]

  - method: POST
    path: "/ocean-billing/containers/{containerId}/holds"
    description: "Place or release a hold (CUSTOMS_HOLD | CHASSIS_SHORTAGE | USDA_HOLD)"
    roles: [TerminalOperator, EquipmentController]
    code: 200
    input: [hold_code, action]
    output: Container
    side_effects:
      - "action=PLACE appends {code, placed_ts=logical clock, released_ts=null}; action=RELEASE stamps released_ts on the active entry of that code"
      - "Placing CUSTOMS_HOLD/USDA_HOLD while AVAILABLE overlays container sub-state CUSTOMS_HELD"

  - method: POST
    path: "/ocean-billing/containers/{containerId}/appointments"
    description: "Book a gate-out appointment for the container against a slot"
    roles: [TerminalOperator, CustomerRep]
    code: 201
    input: [slot_id]
    output: { booking_id: string, slot_id: string, container_id: string, booked_date: string }
    side_effects:
      - "slot.booked_count += 1; slot FULL when booked_count == capacity"
      - "Rejects when slot FULL/RELEASED (ERR_CAPACITY_OR_CONFLICT / ERR_SLOT_RELEASED) — appointment unavailability is the core dispute evidence"

  - method: POST
    path: "/ocean-billing/containers/{containerId}/appointments/{bookingId}/cancel"
    description: "Cancel a confirmed appointment booking; decrements slot.booked_count and reopens a FULL slot"
    roles: [TerminalOperator, CustomerRep]
    code: 200
    input: []
    output: { booking_id: string, slot_id: string, container_id: string, booked_date: string }
    side_effects:
      - "slot.booked_count -= 1; slot FULL -> OPEN when booked_count < capacity"

  - method: POST
    path: "/ocean-billing/containers/{containerId}/gate-out"
    description: "Gate the container out of the terminal; finalizes demurrage"
    roles: [TerminalOperator]
    code: 200
    input: ["slot_override?", "slot_override_reason?"]
    output: Container
    side_effects:
      - "status AVAILABLE -> GATE_OUT; gate_out_ts = logical clock"
      - "Final demurrage accrual frozen; ChargeAccrual(kind=DEMURRAGE) written"
      - "assigned_return_location_id selected by selector policy"
      - "Detention free-time anchor computed"

  - method: POST
    path: "/ocean-billing/containers/{containerId}/reassign-return-location"
    description: "Reassign the empty-return location while GATE_OUT"
    roles: [EquipmentController]
    code: 200
    input: [assigned_return_location_id]
    output: Container
    side_effects: []

  - method: POST
    path: "/ocean-billing/containers/{containerId}/return-empty"
    description: "Accept empty return; finalizes detention"
    roles: [EquipmentController]
    code: 200
    input: []
    output: Container
    side_effects:
      - "status GATE_OUT -> EMPTY_RETURNED; empty_return_ts = logical clock"
      - "Final detention accrual frozen; ChargeAccrual(kind=DETENTION) written"
      - "Daily empty-return counter for the location/date incremented"

  - method: POST
    path: "/ocean-billing/containers/{containerId}/issue-invoice"
    description: "Issue the invoice for an EMPTY_RETURNED container"
    roles: [BillingAgent]
    code: 201
    input: []
    output: Invoice
    side_effects:
      - "Container -> BILLED"
      - "Invoice ISSUED; account outstanding_balance_cents += balance_due_cents"

  # --- Invoice ---
  - method: GET
    path: "/ocean-billing/invoices"
    description: "List invoices"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: ["limit?", "offset?", "customer_account_id?", "status?", "aging_bucket?", "container_id?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/ocean-billing/invoices/{invoiceId}"
    description: "Get one invoice (aging_bucket computed as-of logical clock)"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: []
    output: Invoice
    side_effects: ["aging_bucket recomputed as-of logical clock"]

  - method: POST
    path: "/ocean-billing/invoices/{invoiceId}/payments"
    description: "Tender a payment against an invoice"
    roles: [BillingAgent]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects:
      - "Invoice.paid_total_cents += amount; status ISSUED/PARTIALLY_PAID -> PAID when balance hits 0"
      - "CustomerAccount.outstanding_balance_cents -= amount"
      - "aging_posture sweep (may unsuspend account)"

  - method: POST
    path: "/ocean-billing/invoices/{invoiceId}/write-off"
    description: "Write off an invoice aged into DAYS_61_PLUS"
    roles: [CreditDirector]
    code: 200
    input: [justification]
    output: Invoice
    side_effects:
      - "Implicit TIER_3 CreditWaiver APPLIED for full balance; status -> WRITTEN_OFF"
      - "CustomerAccount.outstanding_balance_cents -= written-off balance"

  - method: GET
    path: "/ocean-billing/invoices/{id}/payments"
    description: "List payments for an invoice"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: GET
    path: "/ocean-billing/invoices/{id}/credit-waivers"
    description: "List credit waivers for an invoice"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CreditWaiver[]"
    side_effects: []

  # --- Disputes ---
  - method: POST
    path: "/ocean-billing/invoices/{invoiceId}/disputes"
    description: "Customer files a dispute against an ISSUED or PARTIALLY_PAID invoice"
    roles: [CustomerRep]
    code: 201
    input: [dispute_reason, contested_amount_cents, evidence_window_start, evidence_window_end, evidence_summary]
    output: Dispute
    side_effects:
      - "Invoice -> DISPUTED"
      - "submitted_at = logical clock; sla_due_at = submitted_at + 14 calendar days"
      - "filed_by_account_id = actor's account (must equal invoice.customer_account_id; ERR_FORBIDDEN otherwise)"

  - method: GET
    path: "/ocean-billing/disputes"
    description: "List disputes (backlog surface; escalated filter)"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: ["limit?", "offset?", "invoice_id?", "filed_by_account_id?", "status?", "escalated?"]
    output: "Dispute[]"
    side_effects: []

  - method: GET
    path: "/ocean-billing/disputes/{disputeId}"
    description: "Get one dispute"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/ocean-billing/dispute-evidence/{evidenceId}"
    description: "Get one evidence item by id"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: []
    output: DisputeEvidence
    side_effects: []

  - method: GET
    path: "/ocean-billing/dispute-evidence"
    description: "List evidence items across disputes (supersession chain traversal)"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: ["limit?", "offset?", "dispute_id?", "supersedes_evidence_id?"]
    output: "DisputeEvidence[]"
    side_effects: []

  - method: POST
    path: "/ocean-billing/disputes/{disputeId}/evidence"
    description: "Attach evidence to a dispute (window-validated)"
    roles: [CustomerRep, BillingAgent]
    code: 201
    input: [evidence_type, evidence_date, reference_uri, "supersedes_evidence_id?"]
    output: DisputeEvidence
    side_effects: ["Dispute.version += 1"]

  - method: GET
    path: "/ocean-billing/disputes/{id}/evidence"
    description: "List evidence for a dispute"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "DisputeEvidence[]"
    side_effects: []

  - method: POST
    path: "/ocean-billing/disputes/{disputeId}/start-review"
    description: "Move dispute SUBMITTED -> UNDER_REVIEW"
    roles: [BillingAgent]
    code: 200
    input: []
    output: Dispute
    side_effects: ["reviewing_user_id = actor X-User-ID"]

  - method: POST
    path: "/ocean-billing/disputes/{disputeId}/return-to-queue"
    description: "Return UNDER_REVIEW dispute to SUBMITTED (revision loop)"
    roles: [BillingAgent]
    code: 200
    input: []
    output: Dispute
    side_effects: ["reviewing_user_id cleared"]

  - method: POST
    path: "/ocean-billing/disputes/{disputeId}/resolve"
    description: "Resolve a dispute with FULL_CREDIT | PARTIAL_CREDIT | DENIED (OCC-guarded)"
    roles: [BillingAgent, CreditSupervisor, CreditDirector]
    code: 200
    input: [resolution_code, "resolved_amount_cents?", resolution_justification, expected_dispute_version]
    output: Dispute
    side_effects:
      - "increments Dispute.version by 1"
      - "FULL/PARTIAL: CreditWaiver APPLIED via credit_waterfall; invoice/account balances recomputed"
      - "DENIED: invoice reverts to ISSUED/PARTIALLY_PAID"

  - method: POST
    path: "/ocean-billing/disputes/{disputeId}/withdraw"
    description: "Customer withdraws a SUBMITTED dispute"
    roles: [CustomerRep]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Invoice reverts to ISSUED/PARTIALLY_PAID"]

  # --- Credit waivers (goodwill / non-dispute path) ---
  - method: GET
    path: "/ocean-billing/disputes/{id}/credit-waivers"
    description: "List credit waivers originating from a dispute"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "CreditWaiver[]"
    side_effects: []

  - method: POST
    path: "/ocean-billing/invoices/{invoiceId}/credit-waivers"
    description: "Propose a goodwill credit waiver (PROPOSED) outside dispute flow"
    roles: [BillingAgent, CreditSupervisor, CreditDirector]
    code: 201
    input: [amount_cents, justification]
    output: CreditWaiver
    side_effects:
      - "authority_tier derived from amount_cents"
      - "applied_by_user_id = proposer X-User-ID"
      - "TIER_1 amounts: auto-APPLIED immediately (propose+apply same actor, within limit); larger amounts stay PROPOSED pending approval"

  - method: GET
    path: "/ocean-billing/credit-waivers/{waiverId}"
    description: "Get one credit waiver"
    roles: [ContractManager, BillingAgent, CreditSupervisor, CreditDirector, CustomerRep]
    code: 200
    input: []
    output: CreditWaiver
    side_effects: []

  - method: POST
    path: "/ocean-billing/credit-waivers/{waiverId}/approve"
    description: "Approve a PROPOSED waiver (OCC-guarded; approver != proposer)"
    roles: [CreditSupervisor, CreditDirector]
    code: 200
    input: [expected_waiver_version]
    output: CreditWaiver
    side_effects:
      - "increments CreditWaiver.version by 1"
      - "Credit applied via credit_waterfall; invoice/account balances recomputed"

  - method: POST
    path: "/ocean-billing/credit-waivers/{waiverId}/reject"
    description: "Reject a PROPOSED waiver"
    roles: [CreditSupervisor, CreditDirector]
    code: 200
    input: []
    output: CreditWaiver
    side_effects: []

  - method: POST
    path: "/ocean-billing/credit-waivers/{waiverId}/reverse"
    description: "Reverse an APPLIED waiver on an unsettled invoice"
    roles: [CreditDirector]
    code: 200
    input: [justification]
    output: CreditWaiver
    side_effects:
      - "Credit unwound; invoice/account balances recomputed"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or CustomerRep acting on another account's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, out-of-range numeric, malformed timestamp, or end < start window" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Customer account CLOSED (or not ACTIVE where activation requires it)" }
  - { id: ERR_ACCOUNT_CREDIT_HOLD, http: 409, condition: "Container intake blocked: account SUSPENDED with credit_hold = true" }
  - { id: ERR_ACCOUNT_BALANCE_OUTSTANDING, http: 409, condition: "Account close blocked: outstanding_balance_cents != 0" }
  - { id: ERR_ACCOUNT_CONTAINERS_ACTIVE, http: 409, condition: "Account close blocked: containers in non-terminal lifecycle states exist" }
  - { id: ERR_CONTRACT_NOT_IN_EFFECT, http: 409, condition: "Contract activation outside [effective_from, effective_to] or contract not ACTIVE at container pinning" }
  - { id: ERR_CONTAINER_HELD, http: 409, condition: "Gate-out blocked by active CUSTOMS_HOLD or USDA_HOLD" }
  - { id: ERR_APPOINTMENT_REQUIRED, http: 409, condition: "Gate-out requires a confirmed appointment for the day unless slot_override with reason is supplied" }
  - { id: ERR_SLOT_RELEASED, http: 409, condition: "Appointment booking against a RELEASED slot" }
  - { id: ERR_NOT_A_WORKING_DAY, http: 422, condition: "Slot date or evidence date violates terminal working-day rules (Sunday, holiday, closed Saturday) or evidence outside dispute window" }
  - { id: ERR_CAPACITY_OR_CONFLICT, http: 409, condition: "Slot full, return-location daily capacity reached, or uniqueness violation on a declared unique key" }
  - { id: ERR_NO_RETURN_LOCATION, http: 422, condition: "Return-location selector pool empty: no location serves the terminal and equipment type with status OPEN/RESTRICTED" }
  - { id: ERR_RETURN_LOCATION_CLOSED, http: 409, condition: "Empty return against a CLOSED return location" }
  - { id: ERR_RETURN_LOCATION_RESTRICTED, http: 409, condition: "Empty return against a RESTRICTED location for a container assigned after restriction" }
  - { id: ERR_REFERENTIAL_GUARD, http: 409, condition: "Cross-entity guard: return location rejects equipment_type; evidence not owned by dispute; contract/account linkage broken" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "Invoice already has a dispute in SUBMITTED or UNDER_REVIEW" }
  - { id: ERR_EVIDENCE_REQUIRED, http: 422, condition: "start-review requires at least one attached evidence item for APPOINTMENT_UNAVAILABLE / CHASSIS_SHORTAGE / CUSTOMS_HOLD reasons" }
  - { id: ERR_JUSTIFICATION_REQUIRED, http: 422, condition: "Resolution, write-off, waiver, or reversal attempted without non-empty justification" }
  - { id: ERR_RESOLVED_AMOUNT_INVALID, http: 422, condition: "resolved_amount_cents missing, < 1, >= contested for PARTIAL, or != contested for FULL" }
  - { id: ERR_WAIVER_AUTHORITY_EXCEEDED, http: 403, condition: "Actor's authority tier does not cover the credit amount" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempting both sides of a segregated step (proposer == approver; resolver == evidence filer)" }
  - { id: ERR_CREDIT_EXCEEDS_BALANCE, http: 422, condition: "Credit or combined credits exceed creditable balance (gross - already-credited); would drive balance_due_cents negative" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment amount_cents > invoice.balance_due_cents" }
  - { id: ERR_INVOICE_NOT_AGED_ENOUGH, http: 409, condition: "Write-off requires aging_bucket == DAYS_61_PLUS" }
  - { id: ERR_INVOICE_ALREADY_SETTLED, http: 409, condition: "Payment, credit application, or reversal against a PAID or WRITTEN_OFF invoice" }
  - { id: ERR_REVERSAL_EXCEEDS_NET, http: 422, condition: "Reversal would make paid_total_cents exceed gross_amount_cents - credit_total_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the entity's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractManager
    description: "Owns customer accounts and service contracts"
    identity: opaque
    exclusive_operations:
      - "POST /ocean-billing/customer-accounts"
      - "POST /ocean-billing/customer-accounts/{accountId}/close"
      - "POST /ocean-billing/customer-accounts/{accountId}/service-contracts"
      - "POST /ocean-billing/service-contracts/{contractId}/activate"
    shared_operations:
      - "All GET endpoints"
      - "POST /ocean-billing/_clock/set_current_utc"

  - name: TerminalOperator
    description: "Runs terminals, holidays, appointment slots, container intake and gate moves"
    identity: opaque
    exclusive_operations:
      - "POST /ocean-billing/terminals"
      - "POST /ocean-billing/terminals/{terminalId}/holidays"
      - "POST /ocean-billing/terminals/{terminalId}/appointment-slots"
      - "POST /ocean-billing/terminal-appointment-slots/{slotId}/release"
      - "POST /ocean-billing/containers"
      - "POST /ocean-billing/containers/{containerId}/mark-available"
      - "POST /ocean-billing/containers/{containerId}/gate-out"
    shared_operations:
      - "All GET endpoints"
      - "POST /ocean-billing/containers/{containerId}/holds (place/release terminal-side holds)"
      - "POST /ocean-billing/containers/{containerId}/appointments"
      - "POST /ocean-billing/_clock/set_current_utc"

  - name: EquipmentController
    description: "Manages return locations, chassis holds, empty returns"
    identity: opaque
    exclusive_operations:
      - "POST /ocean-billing/return-locations"
      - "POST /ocean-billing/return-locations/{locationId}/set-status"
      - "POST /ocean-billing/containers/{containerId}/reassign-return-location"
      - "POST /ocean-billing/containers/{containerId}/return-empty"
    shared_operations:
      - "All GET endpoints"
      - "POST /ocean-billing/containers/{containerId}/holds (chassis shortage)"
      - "POST /ocean-billing/_clock/set_current_utc"

  - name: BillingAgent
    description: "Issues invoices, takes payments, reviews disputes, proposes small credits (TIER_1)"
    identity: opaque
    exclusive_operations:
      - "POST /ocean-billing/containers/{containerId}/issue-invoice"
      - "POST /ocean-billing/invoices/{invoiceId}/payments"
      - "POST /ocean-billing/disputes/{disputeId}/start-review"
      - "POST /ocean-billing/disputes/{disputeId}/return-to-queue"
    shared_operations:
      - "All GET endpoints"
      - "POST /ocean-billing/invoices/{invoiceId}/credit-waivers (TIER_1 auto-applies; larger stays PROPOSED)"
      - "POST /ocean-billing/disputes/{disputeId}/resolve (within TIER_1 limit)"
      - "POST /ocean-billing/disputes/{disputeId}/evidence"
      - "POST /ocean-billing/_clock/set_current_utc"

  - name: CreditSupervisor
    description: "Approves TIER_2 credits, resolves disputes within TIER_2"
    identity: opaque
    exclusive_operations:
      - "POST /ocean-billing/credit-waivers/{waiverId}/reject"
    shared_operations:
      - "All GET endpoints"
      - "POST /ocean-billing/credit-waivers/{waiverId}/approve (up to TIER_2)"
      - "POST /ocean-billing/invoices/{invoiceId}/credit-waivers"
      - "POST /ocean-billing/disputes/{disputeId}/resolve (within TIER_2)"
      - "POST /ocean-billing/_clock/set_current_utc"

  - name: CreditDirector
    description: "Unbounded credit authority, write-offs, waiver reversals"
    identity: opaque
    exclusive_operations:
      - "POST /ocean-billing/invoices/{invoiceId}/write-off"
      - "POST /ocean-billing/credit-waivers/{waiverId}/reverse"
    shared_operations:
      - "All GET endpoints"
      - "POST /ocean-billing/credit-waivers/{waiverId}/approve (any tier)"
      - "POST /ocean-billing/credit-waivers/{waiverId}/reject"
      - "POST /ocean-billing/invoices/{invoiceId}/credit-waivers"
      - "POST /ocean-billing/disputes/{disputeId}/resolve (any amount)"
      - "POST /ocean-billing/_clock/set_current_utc"

  - name: CustomerRep
    description: "External customer representative; files disputes and evidence against own account's invoices"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /ocean-billing/invoices/{invoiceId}/disputes"
      - "POST /ocean-billing/disputes/{disputeId}/withdraw"
    shared_operations:
      - "All GET endpoints (own account scope for disputes/invoices)"
      - "POST /ocean-billing/disputes/{disputeId}/evidence"
      - "POST /ocean-billing/containers/{containerId}/appointments"
