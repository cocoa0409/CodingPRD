  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: half_open_slot_overlap_adjacency_allowed
        grounds:
          - calculations.slot_interval_overlap
          - errors.ERR_SLOT_OVERLAP
        distinguishing_aspect: "Half-open interval semantics on AppointmentSlot: a new slot [600,660) is accepted adjacent to an existing [540,600) (touching endpoints do not overlap), while [570,630) is rejected — the boundary-precision of the interval arithmetic itself."
        test_recipe:
          setup:
            - "CARD service with an existing slot [540,600) on 2026-09-10."
          setup_api_calls:
            - *clock
            - *svc_card
            - *slot_c1
          trigger:
            - call: "POST /specialty-services/${svc_card_id}/slots"
              payload: { slot_date: "2026-09-10", start_min: 600, end_min: 660 }
              as: PlatformAdmin
              captures: { adj_slot: $.data.id }
            - call: "POST /specialty-services/${svc_card_id}/slots"
              payload: { slot_date: "2026-09-10", start_min: 570, end_min: 630 }
              as: PlatformAdmin
              captures: { err_ov: $.data.error_id }
          assert:
            - "the adjacent slot creation succeeds with HTTP 201 and status OPEN"
            - "the overlapping slot creation is rejected with HTTP 409 ERR_SLOT_OVERLAP"

      - name: aggregate_capacity_pool_consumption_distinct_from_intervals
        grounds:
          - calculations.capacity_utilization
          - errors.ERR_CAPACITY_EXHAUSTED
        distinguishing_aspect: "Different interval semantics on the same service entity: two NON-overlapping same-day slots (e.g. [540,600) and [660,720)) each consume one unit of the daily destination pool regardless of their time intervals — aggregate counting, not geometric intersection — so a third same-day hold fails on capacity even with zero time overlap."
        test_recipe:
          setup:
            - "CARD capacity 2; case A holds [540,600) and [600,660) on 2026-09-10 (adjacent, non-overlapping); case B (cleared) tries to hold [660,720) the same day."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *slot_c1
            - *slot_c2
            - *slot_c3
            - *ref_dom
            - *rec_1
            - *rec_verify
            - *ref_submit
            - *case_create
            - *case_approve
            - *case_v_after_approve
            - *deposit
            - *case_v_after_deposit
            - *hold_1
            - *case_v_after_hold1
            - *hold_2
            - *ref_b
            - *b_rec
            - call: "POST /referrals/${ref_b_id}/medical-records/${b_rec_id}/verify"
              payload: {}
              as: CaseReviewer
              as_user_id: "cr-boris"
            - call: "POST /referrals/${ref_b_id}/submit-review"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-drew"
            - *case_b_create
            - call: "POST /visit-cases/${case_b_id}/reviews"
              payload: { outcome: "APPROVE", notes: "ok" }
              as: CaseReviewer
              as_user_id: "cr-boris"
            - call: "POST /visit-cases/${case_b_id}/billing-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 60000 }
              as: FinancialCounselor
              as_user_id: "fc-cora"
            - call: "GET /visit-cases/${case_b_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-drew"
              captures: { case_b_v2: $.data.version }
          trigger:
            - call: "POST /visit-cases/${case_b_id}/slot-holds"
              payload: { appointment_slot_id: "${slot_c3}", visit_type: "CONSULT", listed_price_cents: 100000, sequencing_priority: 1, expected_case_version: "${case_b_v2}" }
              as: IntakeCoordinator
              as_user_id: "ic-drew"
              captures: { err_cap2: $.data.error_id }
          assert:
            - "rejected with ERR_CAPACITY_EXHAUSTED despite zero interval overlap with either existing slot"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_refund_restores_clearance_balance
        grounds:
          - state_machines.FinancialClearance
          - entities.FinancialClearance.fields.deposit_paid_cents
          - entities.BillingTransaction.fields.status
        distinguishing_aspect: "Conserved quantity: FinancialClearance.deposit_paid_cents. A DEPOSIT of 60000 followed by a REFUND of the same amount must return deposit_paid_cents to exactly 0, flip the clearance back to PENDING, and void the source transaction — no drift in the conserved balance."
        test_recipe:
          setup:
            - "DESTINATION case approved; 60000 deposit posted (clearance CLEARED)."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *ref_dom
            - *rec_1
            - *rec_verify
            - *ref_submit
            - *case_create
            - *case_approve
            - &dep_60k
              call: "POST /visit-cases/${case_id}/billing-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 60000 }
              as: FinancialCounselor
              as_user_id: "fc-cora"
              captures: { dep_txn: $.data.id }
          trigger:
            - call: "POST /visit-cases/${case_id}/billing-transactions"
              payload: { txn_type: "REFUND", amount_cents: 60000 }
              as: FinancialCounselor
              as_user_id: "fc-cora"
            - call: "GET /visit-cases/${case_id}/financial-clearance"
              payload: {}
              as: FinancialCounselor
              as_user_id: "fc-cora"
          assert:
            - "FinancialClearance.deposit_paid_cents == 0 after the refund"
            - "FinancialClearance.status returns to PENDING"
            - "the source BillingTransaction.${dep_txn}.status == VOID"

      - name: visit_cancel_release_restores_capacity_pool
        grounds:
          - calculations.capacity_utilization
          - state_machines.AppointmentSlot
          - entities.Itinerary.fields.revision
        distinguishing_aspect: "Different conserved quantity: per-service-per-date capacity usage count (HELD + CONFIRMED). A hold consumes one unit; releasing the held slot returns the count to its pre-hold value, while Itinerary.revision increments exactly once — the compensating pair leaves the pool invariant but the revision permanently advanced (proving the release actually happened)."
        test_recipe:
          setup:
            - "CARD capacity 2, one slot held by the case (used == 1)."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *slot_c1
            - *ref_dom
            - *rec_1
            - *rec_verify
            - *ref_submit
            - *case_create
            - *case_approve
            - *case_v_after_approve
            - *deposit
            - *case_v_after_deposit
            - *hold_1
          trigger:
            - call: "POST /slots/${slot_c1}/release"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "GET /specialty-services/${svc_card_id}/slots"
              payload: { slot_date: "2026-09-10", status: "HELD" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          assert:
            - "AppointmentSlot.${slot_c1}.status == RELEASED"
            - "HELD-slot count for CARD on 2026-09-10 returns to 0 (pre-hold value)"
            - "Itinerary.revision == 2 (incremented exactly once by the release)"
            - "a fresh hold on a new slot for the same service+date now succeeds (capacity restored)"
