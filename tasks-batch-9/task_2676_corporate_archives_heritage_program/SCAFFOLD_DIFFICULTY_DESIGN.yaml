            - call: "POST /retention-schedules"
              payload: { code: "BND-B", retention_years: 10, disposition_action: "REVIEW", legal_citation: "Appraisal Policy 3.7(b)", min_appraisal_score_for_permanent: 58.01 }
              as: ArchivesDirector
              captures: { schedB_id: $.data.id }
            - call: "POST /record-series"
