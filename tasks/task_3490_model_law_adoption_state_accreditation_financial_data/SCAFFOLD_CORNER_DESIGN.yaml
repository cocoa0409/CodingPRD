            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca}" }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "NV", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_nv}" }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "OR", vote: "NAY" }, as: StateRegulator, as_user_id: "${s_or}" }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "WA", vote: "NAY" }, as: StateRegulator, as_user_id: "${s_wa}" }
