# =============================================================================
# Standardized Test Registration Management (SAT / ACT / AP) — Scaffold
# Difficulty band: Expert (§0.4) — 10 entities, 41 endpoints.
# Flat topology: every collection is a top-level resource, so api_prefix is ""
# and FK reverse-reachability is served by filtered-list / sub-resource GETs.
# Endpoint count sits above the Expert ceiling (32) because the 16 FK fields
# across 10 entities each demand a reverse-reachability GET (lint check (f)) on
# top of a 14-transition state-machine action surface spanning 7 distinct
# regulated sub-features (capacity, accommodations, super score, tiered refund,
# standby, ID verification, CLEP). The overage is FK-forced, not padding.
# =============================================================================

scenario: |
  Standardized Test Registration Management (SAT/ACT/AP): test center capacity,
  accommodation requests (504/IEP), Super Score score reporting, tiered refund,
  Stand-by alternates, cross-state ID verification, CLEP credit recognition

domain_name: standardized-test-registration
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - rate_threshold_triggers      # tiered refund breakpoints, capacity thresholds
    - cascading_side_effects       # cancel -> seat freed -> standby promotion -> hold reg
    - dual_variant_calculation     # super score (section-best vs sitting-best); refund tier basis
    - optimistic_concurrency       # seat reservation against TestSession.version (CREATE-supersede)
    - selector_policy              # which StandbyEntry is promoted when a seat frees

  entity_topology: flat
  # Peer entities joined by foreign keys; no deep URL nesting. TestSession,
  # Candidate, Registration, AccommodationRequest, StandbyEntry, ScoreReport,
  # ScoreSend, CLEPClaim, IDVerification are all top-level collections
  # cross-linked by FK fields carried in request bodies.

  state_machine_shape: parallel
  # Registration carries two independent state axes (lifecycle_status x
  # score_status). AccommodationRequest is branching-with-cycle. StandbyEntry is
  # linear-with-revert. The scaffold therefore mixes parallel, branching/cyclic,
  # and linear shapes across different entities.

  relationship_patterns:
    - one_to_many        # TestSession -> Registration[]; Candidate -> Registration[]
    - cross_aggregate    # ScoreReport reads across a Candidate's Registrations for super score
    - self_referential   # StandbyEntry.promoted_from_entry_id chains re-queued alternates

  role_model: peer_roles
  # Candidate owns own registrations/standby/CLEP; TestCenterAdmin owns sessions
  # and check-in/ID verification; AccommodationReviewer owns the 504/IEP review
  # queue; ScoreOps owns score release and score sends. No single role supersets
  # the others; each owns a disjoint slice of the surface.

  consistency_model: immediate
  # All cascades (seat release -> standby promotion -> offer-hold registration;
  # accommodation approval -> registration minutes recompute) settle inside the
  # triggering request's response. No deferred reconciliation.

# =============================================================================
# 1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TestCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Test center display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state where the center physically sits (e.g. CA, NY)" }
      - { name: room_capacity_standard, type: integer, source: input, description: "Standard-room seat count available per session at this center" }
      - { name: room_capacity_accommodated, type: integer, source: input, description: "Separate-room (extended time) seat count available per session at this center" }
      - { name: net_revenue_cents, type: integer, source: computed, default: 0, description: "Conserved money ledger: sum of captured registration fees minus sum of issued refunds across all sessions at this center" }

  - name: TestSession
    parent: null
    common_fields: true
    fields:
      - { name: test_center_id, type: string, source: input, description: "FK -> TestCenter.id; center hosting this session" }
      - { name: exam_type, type: enum, source: input, description: "SAT | ACT | AP — exam family for this session" }
      - { name: exam_subject, type: string, source: input, description: "Subject label; for AP the AP subject (e.g. AP_CALC_BC), 'GENERAL' for SAT/ACT" }
      - { name: test_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the session is administered" }
      - { name: window_start_utc, type: datetime, source: input, description: "ISO 8601 UTC start of the administration window" }
      - { name: window_end_utc, type: datetime, source: input, description: "ISO 8601 UTC end of the administration window (half-open [start,end))" }
      - { name: base_fee_cents, type: integer, source: input, description: "Base registration fee for one seat in this session, in cents" }
      - { name: standard_seats_reserved, type: integer, source: computed, default: 0, description: "Conserved seat count: registrations on this session with seat_kind=STANDARD and lifecycle_status IN {RESERVED, CONFIRMED, CHECKED_IN}" }
      - { name: accommodated_seats_reserved, type: integer, source: computed, default: 0, description: "Conserved seat count: registrations on this session with seat_kind=ACCOMMODATED and lifecycle_status IN {RESERVED, CONFIRMED, CHECKED_IN}" }
      - { name: registration_status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED — CLOSED once test_date has passed (set by /_clock-driven close action); blocks new registrations" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: legal_first_name, type: string, source: input, description: "Legal first name as it appears on government ID" }
      - { name: legal_last_name, type: string, source: input, description: "Legal last name as it appears on government ID" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date (YYYY-MM-DD)" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter US state of legal residence (e.g. NY)" }
      - { name: id_document_state_code, type: string, source: input, description: "Two-letter US state that issued the candidate's government photo ID" }
      - { name: has_active_504_iep, type: boolean, source: input, default: false, description: "Candidate has an active 504 plan or IEP on file (gates accommodation eligibility)" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: test_session_id, type: string, source: input, description: "FK -> TestSession.id; session being registered for" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; candidate registering" }
      - { name: accommodation_request_id, type: string, source: computed, default: null, description: "FK -> AccommodationRequest.id; the APPROVED accommodation bound to this registration, null if standard" }
      - { name: seat_kind, type: enum, source: computed, default: "STANDARD", description: "STANDARD | ACCOMMODATED — ACCOMMODATED once an APPROVED accommodation is bound; determines which capacity pool the seat draws from" }
      - { name: allotted_minutes, type: integer, source: computed, description: "Total test minutes the candidate is granted (base_minutes scaled by approved accommodation time multiplier); see allotted_minutes calc" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Fee captured for this registration in cents (per ap_fee_settlement at reservation time)" }
      - { name: amount_refunded_cents, type: integer, source: computed, default: 0, description: "Total refunded to the candidate for this registration in cents" }
      - { name: refund_tier, type: string, source: computed, default: null, description: "Tier label applied on cancel: FULL | PARTIAL_75 | PARTIAL_50 | NONE; null until cancelled (tiered_refund calc)" }
      - { name: lifecycle_status, type: enum, source: system, default: "RESERVED", description: "Axis 1: RESERVED | CONFIRMED | CHECKED_IN | CANCELLED | NO_SHOW — seat/attendance lifecycle" }
      - { name: score_status, type: enum, source: system, default: "PENDING", description: "Axis 2 (independent of lifecycle): PENDING | SCORED | RELEASED | CANCELLED_SCORE — scoring lifecycle" }
      - { name: is_standby_origin, type: boolean, source: computed, default: false, description: "True when this registration was created by promoting a StandbyEntry (offer-hold)" }

  - name: AccommodationRequest
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; candidate requesting accommodations" }
      - { name: target_registration_id, type: string, source: input, description: "FK -> Registration.id; the registration the accommodation will bind to once approved" }
      - { name: accommodation_type, type: enum, source: input, description: "EXTENDED_TIME_50 | EXTENDED_TIME_100 | SEPARATE_ROOM | BREAKS_ONLY — drives the time multiplier and seat pool" }
      - { name: basis, type: enum, source: input, description: "PLAN_504 | IEP — documentation basis for the request" }
      - { name: reviewer_note, type: string, source: input, default: null, description: "Reviewer's note attached on a MORE_INFO_NEEDED or DENIED decision" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | UNDER_REVIEW | MORE_INFO_NEEDED | APPROVED | DENIED — branching review machine with a MORE_INFO_NEEDED -> UNDER_REVIEW cycle" }

  - name: StandbyEntry
    parent: null
    common_fields: true
    fields:
      - { name: test_session_id, type: string, source: input, description: "FK -> TestSession.id; full session the alternate is waiting on" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; the alternate candidate" }
      - { name: priority_tier, type: enum, source: input, description: "FEE_WAIVER | SCHOOL_DAY | GENERAL — eligibility tier feeding the promotion ranking" }
      - { name: promoted_from_entry_id, type: string, source: computed, default: null, description: "FK -> StandbyEntry.id; self-reference set when this entry re-queues a declined upstream offer (chain audit)" }
      - { name: promotion_score, type: number, source: computed, description: "Computed ranking score used to pick the next promotion; see standby_promotion_score calc" }
      - { name: offered_registration_id, type: string, source: computed, default: null, description: "FK -> Registration.id; the offer-hold registration minted when this entry is promoted" }
      - { name: status, type: enum, source: system, default: "WAITING", description: "WAITING | OFFERED | CLAIMED | DECLINED | EXPIRED — alternate lifecycle (linear with a DECLINED revert that re-opens the seat)" }

  - name: ScoreReport
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the sitting these raw scores belong to" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; owning candidate (denormalized for super-score sweep)" }
      - { name: exam_type, type: enum, source: input, description: "SAT | ACT — only sectioned exams carry a ScoreReport" }
      - { name: section_scores, type: object, source: input, description: "Map of section label -> integer raw score for this sitting (e.g. {READING_WRITING: 700, MATH: 680} for SAT)" }
      - { name: sitting_composite, type: integer, source: computed, description: "Composite for THIS sitting only (sum of this sitting's section_scores for SAT; average rounded for ACT); see sitting_composite calc" }
      - { name: super_composite, type: integer, source: computed, description: "Super Score composite across the candidate's RELEASED sittings of the same exam_type (best per section); see super_score calc" }

  - name: ScoreSend
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; sitting whose scores are being sent" }
      - { name: recipient_code, type: string, source: input, description: "College Board / ACT recipient (college) code" }
      - { name: use_super_score, type: boolean, source: input, default: false, description: "When true, the send transmits the candidate's super_composite; when false, the sitting_composite" }
      - { name: sent_composite, type: integer, source: computed, description: "The composite actually transmitted, frozen at send time (super_composite or sitting_composite per use_super_score)" }
      - { name: status, type: enum, source: system, default: "QUEUED", description: "QUEUED | SENT — score send lifecycle" }

  - name: CLEPClaim
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; candidate claiming CLEP credit" }
      - { name: clep_subject, type: string, source: input, description: "CLEP exam subject label (e.g. COLLEGE_ALGEBRA)" }
      - { name: clep_scaled_score, type: integer, source: input, description: "Reported CLEP scaled score (20-80 range)" }
      - { name: recommended_credit_hours, type: integer, source: computed, default: 0, description: "Credit hours granted per the ACE recognition table and the passing threshold; see clep_credit calc" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | RECOGNIZED | REJECTED — CLEP recognition lifecycle" }

  - name: IDVerification
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the registration being verified at check-in" }
      - { name: presented_first_name, type: string, source: input, description: "First name printed on the ID presented at the center" }
      - { name: presented_last_name, type: string, source: input, description: "Last name printed on the ID presented at the center" }
      - { name: presented_id_state_code, type: string, source: input, description: "Two-letter state that issued the presented ID" }
      - { name: cross_state, type: boolean, source: computed, description: "True when presented_id_state_code differs from the session center's state_code (flags cross-state ID for stricter match)" }
      - { name: outcome, type: enum, source: computed, description: "MATCH | MISMATCH — name/state verification result; see id_verification calc" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Registration AXIS 1: lifecycle_status -----
  - entity: Registration
    initial_state: RESERVED
    terminal_states: [CANCELLED, NO_SHOW]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /registrations/{id}/confirm"
        actor: Candidate
        preconditions:
          - "Registration.lifecycle_status == RESERVED"
          - "TestSession.registration_status == OPEN"
        side_effects:
          - "No seat-count change (seat already counted at RESERVED)"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /registrations/{id}/check-in"
        actor: TestCenterAdmin
        preconditions:
          - "Registration.lifecycle_status == CONFIRMED"
          - "An IDVerification for this registration exists with outcome == MATCH (cross-entity; see Rule 7)"
          - "If Registration.seat_kind == ACCOMMODATED, its bound AccommodationRequest.status == APPROVED (cross-entity; see Rule 7)"
        side_effects:
          - "No seat-count change"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /registrations/{id}/cancel"
        actor: Candidate
        preconditions:
          - "Registration.lifecycle_status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "Compute tiered refund (tiered_refund calc) using days = test_date - clock_now"
          - "amount_refunded_cents += refund_amount; set Registration.refund_tier to the applied tier"
          - "TestCenter.net_revenue_cents -= refund_amount (conserved-money invariant)"
          - "Decrement the matching session seat pool: standard_seats_reserved or accommodated_seats_reserved -= 1"
          - "increments TestSession.version by 1"
          - "CASCADE: if the freed pool is STANDARD and a WAITING StandbyEntry exists for the session, promote the top-ranked entry (StandbyEntry WAITING->OFFERED), which itself mints an offer-hold Registration (depth-3 cascade; see Rule 4)"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /registrations/{id}/cancel"
        actor: Candidate
        preconditions:
          - "Registration.lifecycle_status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "Same as RESERVED->CANCELLED (refund, seat release, version bump, standby cascade)"

      - from: CHECKED_IN
        to: NO_SHOW
        trigger: "POST /test-sessions/{id}/close"
        actor: TestCenterAdmin
        note: "Reachable only for CONFIRMED registrations at close; CHECKED_IN candidates that never receive a score are also swept to NO_SHOW. Listed for completeness."
        preconditions:
          - "TestSession.test_date has passed clock_now"
        side_effects: []

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /test-sessions/{id}/close"
        actor: TestCenterAdmin
        preconditions:
          - "TestSession.test_date has passed clock_now"
          - "Registration was never CHECKED_IN"
        side_effects:
          - "Release seat: matching session seat pool -= 1 (no refund — forfeited)"
          - "increments TestSession.version by 1"

  # ----- Registration AXIS 2: score_status (independent of lifecycle) -----
  - entity: Registration
    initial_state: PENDING
    terminal_states: [CANCELLED_SCORE]
    transitions:
      - from: PENDING
        to: SCORED
        trigger: "POST /registrations/{id}/score-reports"
        actor: ScoreOps
        preconditions:
          - "Registration.score_status == PENDING"
          - "Registration.lifecycle_status == CHECKED_IN (cross-entity dependency between the two axes)"
        side_effects:
          - "Create ScoreReport; compute sitting_composite"

      - from: SCORED
        to: RELEASED
        trigger: "POST /registrations/{id}/release-score"
        actor: ScoreOps
        preconditions:
          - "Registration.score_status == SCORED"
        side_effects:
          - "ScoreReport becomes eligible for the candidate's super-score sweep"
          - "Recompute super_composite for every RELEASED ScoreReport of the same candidate+exam_type (cross-aggregate)"

      - from: SCORED
        to: CANCELLED_SCORE
        trigger: "POST /registrations/{id}/cancel-score"
        actor: Candidate
        preconditions:
          - "Registration.score_status == SCORED"
        side_effects:
          - "ScoreReport excluded from super-score sweeps going forward"
          - "Recompute super_composite for the candidate's remaining RELEASED sittings"

      - from: RELEASED
        to: CANCELLED_SCORE
        trigger: "POST /registrations/{id}/cancel-score"
        actor: Candidate
        preconditions:
          - "Registration.score_status == RELEASED"
        side_effects:
          - "Same recompute as SCORED->CANCELLED_SCORE"

  # ----- AccommodationRequest: branching with MORE_INFO cycle -----
  - entity: AccommodationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /accommodation-requests/{id}/begin-review"
        actor: AccommodationReviewer
        preconditions:
          - "AccommodationRequest.status == SUBMITTED"
          - "Candidate.has_active_504_iep == true (cross-entity precondition)"
        side_effects: []

      - from: UNDER_REVIEW
        to: MORE_INFO_NEEDED
        trigger: "POST /accommodation-requests/{id}/request-info"
        actor: AccommodationReviewer
        preconditions:
          - "AccommodationRequest.status == UNDER_REVIEW"
        side_effects:
          - "reviewer_note recorded"

      - from: MORE_INFO_NEEDED
        to: UNDER_REVIEW
        trigger: "POST /accommodation-requests/{id}/resubmit"
        actor: Candidate
        note: "Cycle edge — request returns to review after candidate supplies info"
        preconditions:
          - "AccommodationRequest.status == MORE_INFO_NEEDED"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /accommodation-requests/{id}/approve"
        actor: AccommodationReviewer
        preconditions:
          - "AccommodationRequest.status == UNDER_REVIEW"
          - "target Registration.lifecycle_status IN {RESERVED, CONFIRMED} (not yet CHECKED_IN)"
          - "accommodated capacity available: TestSession.accommodated_seats_reserved < TestCenter.room_capacity_accommodated"
        side_effects:
          - "Bind: target Registration.accommodation_request_id = this.id; Registration.seat_kind = ACCOMMODATED"
          - "Move the seat between pools: standard_seats_reserved -= 1, accommodated_seats_reserved += 1"
          - "CASCADE depth-2: recompute Registration.allotted_minutes from the approved time multiplier (allotted_minutes calc)"
          - "increments TestSession.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /accommodation-requests/{id}/deny"
        actor: AccommodationReviewer
        preconditions:
          - "AccommodationRequest.status == UNDER_REVIEW"
        side_effects:
          - "reviewer_note recorded; target registration stays STANDARD"

  # ----- StandbyEntry: linear with DECLINED revert -----
  - entity: StandbyEntry
    initial_state: WAITING
    terminal_states: [CLAIMED, EXPIRED]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "system (cascade from a STANDARD seat freed by Registration cancel/no-show)"
        actor: system
        preconditions:
          - "StandbyEntry.status == WAITING"
          - "This entry is the top-ranked WAITING entry for the session (standby_promotion_score, created_at ASC tie-break)"
          - "A STANDARD seat is free: standard_seats_reserved < room_capacity_standard"
        side_effects:
          - "Mint offer-hold Registration (lifecycle_status=RESERVED, seat_kind=STANDARD, is_standby_origin=true); set offered_registration_id"
          - "standard_seats_reserved += 1 (the freed seat is re-taken by the hold)"
          - "increments TestSession.version by 1"

      - from: OFFERED
        to: CLAIMED
        trigger: "POST /standby-entries/{id}/claim"
        actor: Candidate
        preconditions:
          - "expected_test_session_version matches TestSession.version (OCC; else ERR_STALE_SESSION_VERSION)"
          - "StandbyEntry.status == OFFERED"
          - "offered_registration_id Registration.lifecycle_status == RESERVED"
        side_effects:
          - "Offer-hold Registration -> CONFIRMED; capture fee (amount_paid_cents = session base_fee_cents)"
          - "TestCenter.net_revenue_cents += base_fee_cents"
          - "increments TestSession.version by 1 (settles the OCC token so a stale re-claim fails)"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /standby-entries/{id}/decline"
        actor: Candidate
        note: "Revert edge — declining frees the held seat and re-runs promotion for the next alternate"
        preconditions:
          - "StandbyEntry.status == OFFERED"
        side_effects:
          - "Cancel the offer-hold Registration (lifecycle_status -> CANCELLED, no refund since unpaid)"
          - "standard_seats_reserved -= 1 (seat released again)"
          - "increments TestSession.version by 1"
          - "CASCADE: promote next top-ranked WAITING entry (sets its promoted_from_entry_id = this.id)"

      - from: WAITING
        to: EXPIRED
        trigger: "POST /test-sessions/{id}/close"
        actor: TestCenterAdmin
        preconditions:
          - "TestSession.test_date has passed clock_now"
        side_effects: []

  # ----- CLEPClaim: linear recognition -----
  - entity: CLEPClaim
    initial_state: PENDING
    terminal_states: [RECOGNIZED, REJECTED]
    transitions:
      - from: PENDING
        to: RECOGNIZED
        trigger: "POST /clep-claims/{id}/adjudicate"
        actor: ScoreOps
        preconditions:
          - "CLEPClaim.status == PENDING"
          - "clep_scaled_score >= CLEP_PASS_THRESHOLD (50)"
        side_effects:
          - "Compute recommended_credit_hours (clep_credit calc)"

      - from: PENDING
        to: REJECTED
        trigger: "POST /clep-claims/{id}/adjudicate"
        actor: ScoreOps
        preconditions:
          - "CLEPClaim.status == PENDING"
          - "clep_scaled_score < CLEP_PASS_THRESHOLD (50)"
        side_effects:
          - "recommended_credit_hours stays 0"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: standby-claim-stale-session
    parent_entity: TestSession
    write_endpoint: "POST /standby-entries/{id}/claim"
    occ_field: "expected_test_session_version"
    description: |
      Claiming a standby offer carries the session version the candidate last
      observed on their offer. If the session version has advanced since (another
      cancel/promotion cascade re-took the freed seat and bumped the version),
      the claim is rejected on stale version. This is the CREATE-with-supersede
      case: the seat the claimant expects to take may already have been
      legitimately re-allocated, so the claim's view of the session is stale.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

  - rule_id: register-stale-session
    parent_entity: TestSession
    write_endpoint: "POST /registrations"
    occ_field: "expected_test_session_version"
    description: |
      Creating a Registration carries the session version the client last
      observed. When the version has advanced since (a prior registration or a
      standby promotion took the last free seat and bumped the version), the new
      registration is rejected on stale version rather than silently overbooking.
      This is CREATE-with-supersede: the same empty-seat slot the client meant to
      take has been legitimately consumed by an intervening write.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sitting_composite
    trigger: "POST /registrations/{id}/score-reports (ScoreReport creation)"
    algorithm: aggregation
    formula: |
      # Composite for THIS sitting only.
      if exam_type == SAT:
        sitting_composite = section_scores[READING_WRITING] + section_scores[MATH]
      elif exam_type == ACT:
        # ACT composite = round_half_up(mean of the four section scores)
        sitting_composite = round_half_up(
          (section_scores[ENGLISH] + section_scores[MATH]
           + section_scores[READING] + section_scores[SCIENCE]) / 4 )
    input_set: "Exactly the section_scores supplied on this ScoreReport; no cross-sitting data."
    precision: "integer; ACT mean rounded half up"

  - name: super_score
    trigger: "RELEASED transition on Registration AXIS 2; recomputed on CANCELLED_SCORE; read on ScoreSend with use_super_score=true"
    algorithm: aggregation
    formula: |
      # Super Score = best per-section across the candidate's qualifying sittings,
      # then composited. QUALIFYING = ScoreReports whose Registration has
      # score_status == RELEASED AND same candidate_id AND same exam_type.
      for each section S in the exam's section set:
        best[S] = max(section_scores[S] over qualifying sittings)
      if exam_type == SAT:
        super_composite = best[READING_WRITING] + best[MATH]
      elif exam_type == ACT:
        super_composite = round_half_up((best[ENGLISH]+best[MATH]+best[READING]+best[SCIENCE]) / 4)
      # Tie / single sitting: if exactly one qualifying sitting, super_composite == that sitting_composite.
    input_set: "ScoreReports where Registration.score_status == RELEASED, same candidate_id, same exam_type. CANCELLED_SCORE and PENDING/SCORED sittings excluded."
    precision: "integer; per-section max then composite (NOT max of composites)"
    variants:
      - name: section_best_super
        when: "Super Score (use_super_score=true on ScoreSend, or the super_composite field)"
        difference: "Takes the max per section across sittings, THEN composites — can exceed any single sitting's composite."
      - name: sitting_best_naive
        when: "A naive 'best sitting' reading would composite each sitting then take the max composite"
        difference: "max over sittings of sitting_composite — never mixes sections, so it is <= section_best_super whenever the best sections fall in different sittings. The scaffold mandates section_best_super; the divergence is the test."

  - name: tiered_refund
    trigger: "POST /registrations/{id}/cancel"
    algorithm: tiered_pricing
    formula: |
      days_before = floor( (TestSession.test_date 00:00:00Z - clock_now) / 86400 seconds )
      # Tier by days_before, boundaries are inclusive on the lower edge (>=):
      if days_before >= 60:    tier = FULL;        refund = amount_paid_cents
      elif days_before >= 14:  tier = PARTIAL_75;  refund = round_half_up(amount_paid_cents * 0.75)
      elif days_before >= 1:   tier = PARTIAL_50;  refund = round_half_up(amount_paid_cents * 0.50)
      else:                    tier = NONE;        refund = 0      # days_before <= 0 (test day or past)
      refund_amount = refund
    input_set: "Single Registration's amount_paid_cents and its session's test_date vs the simulated clock."
    constants:
      FULL_REFUND_DAYS: 60
      PARTIAL_75_DAYS: 14
      PARTIAL_50_DAYS: 1
      PCT_75: 0.75
      PCT_50: 0.50
    precision: "cents integer, round_half_up on the percentage products"
    variants:
      - name: days_before_test_date
        when: "Mandated basis"
        difference: "Tier keyed on days between clock_now and the session test_date (the official cutoff)."
      - name: days_since_registration_naive
        when: "A naive reading keyed on days since the registration was created"
        difference: "Would tier on (clock_now - registration.created_at), producing a different tier for the same cancel. The scaffold mandates days_before_test_date."

  - name: standby_promotion_score
    trigger: "Recomputed whenever a STANDARD seat frees on a session (cancel / no-show / decline cascade)"
    algorithm: weighted_scoring
    formula: |
      # >= 3 inputs, non-linear: tier weight selected by a branch, blended with a
      # bounded recency term, then floored.
      TIER_WEIGHT = { FEE_WAIVER: 300, SCHOOL_DAY: 200, GENERAL: 100 }[priority_tier]
      waited_hours = floor( (clock_now - StandbyEntry.created_at) / 3600 seconds )
      recency_bonus = min(waited_hours, 48)          # capped at 48
      promotion_score = TIER_WEIGHT + max(recency_bonus, 0)
      # Selection: highest promotion_score wins; tie-break created_at ASC (oldest entry first).
      # Empty candidate set: no promotion fires; the freed seat simply stays free.
    input_set: "WAITING StandbyEntry rows for the session (status==WAITING)."
    constants:
      TIER_WEIGHT_FEE_WAIVER: 300
      TIER_WEIGHT_SCHOOL_DAY: 200
      TIER_WEIGHT_GENERAL: 100
      RECENCY_CAP_HOURS: 48
    precision: "integer score; selection deterministic by (promotion_score DESC, created_at ASC)"

  - name: allotted_minutes
    trigger: "AccommodationRequest UNDER_REVIEW->APPROVED (depth-2 cascade onto the bound Registration)"
    algorithm: threshold
    formula: |
      BASE_MINUTES = { SAT: 134, ACT: 175, AP: 180 }[TestSession.exam_type]
      multiplier per accommodation_type:
        EXTENDED_TIME_50:  1.5
        EXTENDED_TIME_100: 2.0
        SEPARATE_ROOM:     1.0    # separate room, standard time
        BREAKS_ONLY:       1.0
      allotted_minutes = floor(BASE_MINUTES * multiplier)
      # Standard (no approved accommodation): allotted_minutes = BASE_MINUTES (multiplier 1.0).
    input_set: "The bound Registration's session exam_type and the approved AccommodationRequest.accommodation_type."
    constants:
      BASE_SAT: 134
      BASE_ACT: 175
      BASE_AP: 180
      MULT_ET50: 1.5
      MULT_ET100: 2.0

  - name: ap_fee_settlement
    trigger: "POST /registrations (AP exam reservation) and POST /registrations/{id}/cancel"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): rounding ORDER matters and is pinned.
      # An AP order can bundle multiple AP exams (exam line items). Each line item
      # has the session base_fee_cents; a per-order fee_reduction_pct may apply
      # (fee waiver). The scaffold mandates: apply the reduction PER LINE ITEM,
      # round each line to whole cents (round_half_up), THEN sum.
      per_line_paid = round_half_up(base_fee_cents * (1 - fee_reduction_pct))   # per item
      amount_paid_cents = sum(per_line_paid over all line items)                 # then sum
      # The forbidden alternative (sum then round): round_half_up(sum(base_fee_cents) * (1 - pct))
      # yields a different total when the per-line product has a .5 cent remainder.
    input_set: "AP registration line items (each carries session base_fee_cents) and the order's fee_reduction_pct."
    constants:
      DEFAULT_FEE_REDUCTION_PCT: 0.0
    precision: "round_half_up PER LINE then sum (pinned order); NOT sum-then-round"

  - name: id_verification
    trigger: "POST /registrations/{id}/id-verifications"
    algorithm: threshold
    formula: |
      cross_state = (presented_id_state_code != session_center.state_code)
      name_exact = (presented_first_name == candidate.legal_first_name
                    AND presented_last_name == candidate.legal_last_name)
      # Cross-state IDs require an EXACT (case-sensitive) legal-name match.
      # Same-state IDs allow a case-insensitive match.
      if cross_state:
        outcome = MATCH if name_exact else MISMATCH
      else:
        name_ci = (lower(presented_first_name)==lower(candidate.legal_first_name)
                   AND lower(presented_last_name)==lower(candidate.legal_last_name))
        outcome = MATCH if name_ci else MISMATCH
    input_set: "One IDVerification's presented fields vs the candidate's legal name and the session center's state_code."

  - name: clep_credit
    trigger: "POST /clep-claims/{id}/adjudicate (PENDING->RECOGNIZED)"
    algorithm: threshold
    formula: |
      # ACE-style recognition: passing threshold 50; credit hours step with score.
      if clep_scaled_score < 50:  recommended_credit_hours = 0      # rejected, not recognized
      elif clep_scaled_score < 60: recommended_credit_hours = 3
      elif clep_scaled_score < 70: recommended_credit_hours = 6
      else:                        recommended_credit_hours = 9     # >= 70
    input_set: "One CLEPClaim.clep_scaled_score."
    constants:
      CLEP_PASS_THRESHOLD: 50
      HOURS_TIER_1: 3
      HOURS_TIER_2: 6
      HOURS_TIER_3: 9

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, scores in numeric bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT"

  - priority: 5
    category: state
    check: "OCC: expected_test_session_version matches current TestSession.version"
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST /registrations, POST /standby-entries/{id}/claim"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Accommodation eligibility: candidate must have has_active_504_iep == true to begin review"
    error_id: ERR_NOT_504_IEP_ELIGIBLE
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/begin-review"

  - priority: 8
    category: business_safety
    check: "ID verification: check-in requires an existing IDVerification with outcome == MATCH for the registration"
    error_id: ERR_ID_VERIFICATION_FAILED
    http_status: 422
    applies_to: "POST /registrations/{id}/check-in"

  - priority: 9
    category: business_referential
    check: "Accommodation approval requires the target registration not yet CHECKED_IN and bound to the requesting candidate"
    error_id: ERR_ACCOMMODATION_NOT_BINDABLE
    http_status: 409
    applies_to: "POST /accommodation-requests/{id}/approve"

  - priority: 10
    category: business_temporal
    check: "Session window must not overlap an existing session at the same center on the same date (half-open [start,end))"
    error_id: ERR_SESSION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /test-sessions"

  - priority: 11
    category: business_temporal
    check: "A candidate's two ACCOMMODATED sittings must have a rest gap of >= REST_BUFFER_HOURS (3) between the earlier session's window_end_utc and the later session's window_start_utc; a gap < 3h (including overlapping or back-to-back windows) is rejected. Gap semantics: required_gap_seconds = later.window_start_utc - earlier.window_end_utc; reject when required_gap_seconds < 3*3600. This buffer rule differs from the half-open center-slot overlap rule (priority 10), which has no buffer and permits exact adjacency."
    error_id: ERR_CANDIDATE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /accommodation-requests/{id}/approve (the binding that makes a sitting ACCOMMODATED)"

  - priority: 12
    category: business_constraint
    check: "Registration must not be created on a CLOSED session"
    error_id: ERR_SESSION_CLOSED
    http_status: 409
    applies_to: "POST /registrations"

  - priority: 13
    category: business_fiscal
    check: "Standard-pool capacity: standard_seats_reserved < room_capacity_standard, else the candidate must use standby"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /registrations (standard seat)"

  - priority: 14
    category: business_fiscal
    check: "Accommodated-pool capacity: accommodated_seats_reserved < room_capacity_accommodated"
    error_id: ERR_ACCOMMODATED_FULL
    http_status: 409
    applies_to: "POST /accommodation-requests/{id}/approve"

  - priority: 15
    category: business_fiscal
    check: "Refund window: cancel after test_date (days_before <= 0) yields tier NONE (no refund) but the cancel itself still succeeds"
    error_id: ERR_REFUND_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /registrations/{id}/cancel (only when caller asserts a refund via expected behavior; otherwise informational tier=NONE)"

  - priority: 16
    category: business_constraint
    check: "Standby claim only valid while the offered registration is still RESERVED (not auto-cancelled)"
    error_id: ERR_OFFER_NO_LONGER_VALID
    http_status: 409
    applies_to: "POST /standby-entries/{id}/claim"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- TestCenter ----------
  - method: POST
    path: "/test-centers"
    description: "Create a test center"
    roles: [TestCenterAdmin]
    code: 201
    input: [name, state_code, room_capacity_standard, room_capacity_accommodated]
    output: TestCenter
    side_effects: ["net_revenue_cents = 0"]

  - method: GET
    path: "/test-centers/{id}"
    description: "Get a test center"
    roles: [TestCenterAdmin, Candidate, ScoreOps, AccommodationReviewer]
    code: 200
    input: []
    output: TestCenter
    side_effects: []

  # ---------- TestSession ----------
  - method: POST
    path: "/test-sessions"
    description: "Create a test session at a center"
    roles: [TestCenterAdmin]
    code: 201
    input: [test_center_id, exam_type, exam_subject, test_date, window_start_utc, window_end_utc, base_fee_cents]
    output: TestSession
    side_effects:
      - "standard_seats_reserved=0, accommodated_seats_reserved=0, registration_status=OPEN, version=1"
      - "Reject if window overlaps an existing session at same center on same date (ERR_SESSION_WINDOW_OVERLAP)"

  - method: GET
    path: "/test-sessions/{id}"
    description: "Get a test session"
    roles: [TestCenterAdmin, Candidate, ScoreOps, AccommodationReviewer]
    code: 200
    input: []
    output: TestSession
    side_effects: []

  - method: GET
    path: "/test-sessions"
    description: "List/filter test sessions"
    roles: [TestCenterAdmin, Candidate, ScoreOps, AccommodationReviewer]
    code: 200
    input: ["test_center_id?", "exam_type?", "limit?", "offset?"]
    output: TestSession[]
    side_effects: []

  - method: POST
    path: "/test-sessions/{id}/close"
    description: "Close a session after its test_date: sweep CONFIRMED->NO_SHOW, expire WAITING standby"
    roles: [TestCenterAdmin]
    code: 200
    input: []
    output: TestSession
    side_effects:
      - "registration_status -> CLOSED"
      - "CONFIRMED (never CHECKED_IN) registrations -> NO_SHOW, release their seat (version bump per release)"
      - "WAITING StandbyEntry for session -> EXPIRED"

  # ---------- Candidate ----------
  - method: POST
    path: "/candidates"
    description: "Create a candidate"
    roles: [Candidate]
    code: 201
    input: [legal_first_name, legal_last_name, date_of_birth, home_state_code, id_document_state_code, "has_active_504_iep?"]
    output: Candidate
    side_effects: []

  - method: GET
    path: "/candidates/{id}"
    description: "Get a candidate"
    roles: [Candidate, TestCenterAdmin, ScoreOps, AccommodationReviewer]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: GET
    path: "/candidates/{id}/clep-claims"
    description: "List a candidate's CLEP claims (sub-resource reverse-reachability for CLEPClaim.candidate_id)"
    roles: [Candidate, ScoreOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CLEPClaim[]
    side_effects: []

  # ---------- Registration ----------
  - method: POST
    path: "/registrations"
    description: "Reserve a seat (registration) for a candidate on a session"
    roles: [Candidate]
    code: 201
    input: [test_session_id, candidate_id, expected_test_session_version, "fee_reduction_pct?"]
    output: Registration
    side_effects:
      - "lifecycle_status=RESERVED, score_status=PENDING, seat_kind=STANDARD, allotted_minutes=BASE (allotted_minutes calc)"
      - "amount_paid_cents per ap_fee_settlement (single line item unless AP bundle); TestCenter.net_revenue_cents += amount_paid_cents"
      - "standard_seats_reserved += 1; increments TestSession.version by 1"
      - "Reject ERR_SESSION_CLOSED / ERR_SESSION_FULL / ERR_STALE_SESSION_VERSION per validations"

  - method: GET
    path: "/registrations/{id}"
    description: "Get a registration"
    roles: [Candidate, TestCenterAdmin, ScoreOps, AccommodationReviewer]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: "/registrations"
    description: "List/filter registrations by session or candidate (FK reverse-reachability)"
    roles: [Candidate, TestCenterAdmin, ScoreOps, AccommodationReviewer]
    code: 200
    input: ["test_session_id?", "candidate_id?", "accommodation_request_id?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []

  - method: POST
    path: "/registrations/{id}/confirm"
    description: "Confirm a reserved registration"
    roles: [Candidate]
    code: 200
    input: []
    output: Registration
    side_effects: ["lifecycle_status RESERVED->CONFIRMED"]

  - method: POST
    path: "/registrations/{id}/cancel"
    description: "Cancel a registration; compute tiered refund; release seat; cascade standby promotion"
    roles: [Candidate]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "lifecycle_status -> CANCELLED"
      - "tiered_refund computed; amount_refunded_cents += refund; refund_tier set; TestCenter.net_revenue_cents -= refund"
      - "seat pool -= 1; increments TestSession.version by 1"
      - "CASCADE: STANDARD seat freed -> promote top WAITING StandbyEntry (mints offer-hold Registration)"

  - method: POST
    path: "/registrations/{id}/check-in"
    description: "Check a candidate in on test day"
    roles: [TestCenterAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["lifecycle_status CONFIRMED->CHECKED_IN (requires MATCH IDVerification + APPROVED accommodation if accommodated)"]

  # ---------- Registration AXIS 2: scoring ----------
  - method: POST
    path: "/registrations/{id}/score-reports"
    description: "Record raw section scores for a checked-in sitting"
    roles: [ScoreOps]
    code: 201
    input: [exam_type, section_scores]
    output: ScoreReport
    side_effects:
      - "Create ScoreReport; compute sitting_composite (sitting_composite calc)"
      - "Registration.score_status PENDING->SCORED (requires lifecycle_status==CHECKED_IN)"

  - method: POST
    path: "/registrations/{id}/release-score"
    description: "Release a scored sitting; recompute super score across candidate's released sittings"
    roles: [ScoreOps]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "score_status SCORED->RELEASED"
      - "Recompute super_composite for every RELEASED ScoreReport of same candidate+exam_type (super_score calc)"

  - method: POST
    path: "/registrations/{id}/cancel-score"
    description: "Candidate cancels a sitting's score; recompute super score"
    roles: [Candidate]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "score_status -> CANCELLED_SCORE"
      - "Recompute super_composite for the candidate's remaining RELEASED sittings"

  - method: GET
    path: "/registrations/{id}/id-verifications"
    description: "List ID verifications for a registration (FK reverse-reachability for IDVerification.registration_id)"
    roles: [TestCenterAdmin, Candidate]
    code: 200
    input: []
    output: IDVerification[]
    side_effects: []

  # ---------- AccommodationRequest ----------
  - method: POST
    path: "/accommodation-requests"
    description: "Submit a 504/IEP accommodation request bound to a target registration"
    roles: [Candidate]
    code: 201
    input: [candidate_id, target_registration_id, accommodation_type, basis]
    output: AccommodationRequest
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/accommodation-requests/{id}"
    description: "Get an accommodation request"
    roles: [Candidate, AccommodationReviewer, TestCenterAdmin]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: []

  - method: GET
    path: "/accommodation-requests"
    description: "List/filter accommodation requests by candidate (FK reverse-reachability)"
    roles: [Candidate, AccommodationReviewer, TestCenterAdmin]
    code: 200
    input: ["candidate_id?", "target_registration_id?", "status?", "limit?", "offset?"]
    output: AccommodationRequest[]
    side_effects: []

  - method: POST
    path: "/accommodation-requests/{id}/begin-review"
    description: "Reviewer opens an accommodation request for review"
    roles: [AccommodationReviewer]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: ["status SUBMITTED->UNDER_REVIEW (requires candidate has_active_504_iep)"]

  - method: POST
    path: "/accommodation-requests/{id}/request-info"
    description: "Reviewer requests more documentation"
    roles: [AccommodationReviewer]
    code: 200
    input: [reviewer_note]
    output: AccommodationRequest
    side_effects: ["status UNDER_REVIEW->MORE_INFO_NEEDED; reviewer_note recorded"]

  - method: POST
    path: "/accommodation-requests/{id}/resubmit"
    description: "Candidate resubmits after providing more info (cycle back to review)"
    roles: [Candidate]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: ["status MORE_INFO_NEEDED->UNDER_REVIEW"]

  - method: POST
    path: "/accommodation-requests/{id}/approve"
    description: "Approve; bind to registration; move seat to accommodated pool; recompute minutes"
    roles: [AccommodationReviewer]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects:
      - "status UNDER_REVIEW->APPROVED"
      - "Bind Registration.accommodation_request_id, seat_kind=ACCOMMODATED"
      - "standard_seats_reserved -= 1, accommodated_seats_reserved += 1; increments TestSession.version by 1"
      - "CASCADE depth-2: recompute Registration.allotted_minutes (allotted_minutes calc)"

  - method: POST
    path: "/accommodation-requests/{id}/deny"
    description: "Deny the accommodation request"
    roles: [AccommodationReviewer]
    code: 200
    input: [reviewer_note]
    output: AccommodationRequest
    side_effects: ["status UNDER_REVIEW->DENIED; registration stays STANDARD"]

  # ---------- StandbyEntry ----------
  - method: POST
    path: "/standby-entries"
    description: "Join the standby waitlist for a full session"
    roles: [Candidate]
    code: 201
    input: [test_session_id, candidate_id, priority_tier]
    output: StandbyEntry
    side_effects: ["status=WAITING; compute promotion_score (standby_promotion_score calc)"]

  - method: GET
    path: "/standby-entries/{id}"
    description: "Get a standby entry"
    roles: [Candidate, TestCenterAdmin]
    code: 200
    input: []
    output: StandbyEntry
    side_effects: []

  - method: GET
    path: "/standby-entries"
    description: "List/filter standby entries by session or candidate (FK reverse-reachability incl. self-ref promoted_from_entry_id)"
    roles: [Candidate, TestCenterAdmin]
    code: 200
    input: ["test_session_id?", "candidate_id?", "promoted_from_entry_id?", "offered_registration_id?", "status?", "limit?", "offset?"]
    output: StandbyEntry[]
    side_effects: []

  - method: POST
    path: "/standby-entries/{id}/claim"
    description: "Claim a standby offer (OCC against session version)"
    roles: [Candidate]
    code: 200
    input: [expected_test_session_version]
    output: StandbyEntry
    side_effects:
      - "status OFFERED->CLAIMED; offer-hold Registration RESERVED->CONFIRMED; capture fee"
      - "TestCenter.net_revenue_cents += base_fee_cents"
      - "increments TestSession.version by 1"
      - "Reject ERR_STALE_SESSION_VERSION when expected_test_session_version != TestSession.version"

  - method: POST
    path: "/standby-entries/{id}/decline"
    description: "Decline a standby offer; release seat; promote next alternate (revert + cascade)"
    roles: [Candidate]
    code: 200
    input: []
    output: StandbyEntry
    side_effects:
      - "status OFFERED->DECLINED; cancel offer-hold Registration; standard_seats_reserved -= 1; increments TestSession.version by 1"
      - "CASCADE: promote next top WAITING entry (sets promoted_from_entry_id)"

  # ---------- ScoreReport ----------
  - method: GET
    path: "/score-reports/{id}"
    description: "Get a score report (sitting + super composite)"
    roles: [Candidate, ScoreOps]
    code: 200
    input: []
    output: ScoreReport
    side_effects: []

  - method: GET
    path: "/score-reports"
    description: "List/filter score reports by registration or candidate (FK reverse-reachability for both ScoreReport FKs)"
    roles: [Candidate, ScoreOps]
    code: 200
    input: ["registration_id?", "candidate_id?", "limit?", "offset?"]
    output: ScoreReport[]
    side_effects: []

  # ---------- ScoreSend ----------
  - method: POST
    path: "/score-sends"
    description: "Queue a score send to a college; freeze the transmitted composite (super or sitting)"
    roles: [Candidate]
    code: 201
    input: [registration_id, recipient_code, "use_super_score?"]
    output: ScoreSend
    side_effects:
      - "status=QUEUED; sent_composite frozen = super_composite if use_super_score else sitting_composite"
      - "Requires Registration.score_status == RELEASED (cross-entity dependency)"

  - method: GET
    path: "/registrations/{id}/score-sends"
    description: "List score sends for a registration (FK reverse-reachability for ScoreSend.registration_id)"
    roles: [Candidate, ScoreOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScoreSend[]
    side_effects: []

  # ---------- CLEPClaim ----------
  - method: POST
    path: "/clep-claims"
    description: "File a CLEP credit recognition claim"
    roles: [Candidate]
    code: 201
    input: [candidate_id, clep_subject, clep_scaled_score]
    output: CLEPClaim
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/clep-claims/{id}"
    description: "Get a CLEP claim"
    roles: [Candidate, ScoreOps]
    code: 200
    input: []
    output: CLEPClaim
    side_effects: []

  - method: POST
    path: "/clep-claims/{id}/adjudicate"
    description: "Adjudicate a CLEP claim: RECOGNIZED (>=50, credit hours) or REJECTED (<50)"
    roles: [ScoreOps]
    code: 200
    input: []
    output: CLEPClaim
    side_effects: ["status->RECOGNIZED|REJECTED; recommended_credit_hours per clep_credit calc"]

  # ---------- IDVerification ----------
  - method: POST
    path: "/registrations/{id}/id-verifications"
    description: "Record a cross-state ID verification attempt for a registration"
    roles: [TestCenterAdmin]
    code: 201
    input: [presented_first_name, presented_last_name, presented_id_state_code]
    output: IDVerification
    side_effects: ["compute cross_state and outcome (id_verification calc)"]

  # ---------- Test-driving ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the simulated current UTC clock (test-driving)"
    roles: [TestCenterAdmin, ScoreOps, Candidate, AccommodationReviewer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["clock_now := to_iso8601 for all subsequent day/hour-difference calculations"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range score" }
  - { id: ERR_STALE_SESSION_VERSION, http: 412, condition: "expected_test_session_version does not match current TestSession.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_NOT_504_IEP_ELIGIBLE, http: 422, condition: "Accommodation review begun for a candidate without an active 504/IEP" }
  - { id: ERR_ID_VERIFICATION_FAILED, http: 422, condition: "Check-in attempted without a MATCH IDVerification for the registration" }
  - { id: ERR_ACCOMMODATION_NOT_BINDABLE, http: 409, condition: "Approve target registration already CHECKED_IN or not owned by the requesting candidate" }
  - { id: ERR_SESSION_WINDOW_OVERLAP, http: 409, condition: "New session window overlaps an existing session at the same center on the same date" }
  - { id: ERR_CANDIDATE_SCHEDULE_CONFLICT, http: 409, condition: "Candidate's accommodated sittings violate the rest-buffer separation" }
  - { id: ERR_SESSION_CLOSED, http: 409, condition: "Registration attempted on a CLOSED session" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "Standard pool full; candidate must join standby" }
  - { id: ERR_ACCOMMODATED_FULL, http: 409, condition: "Accommodated pool full; approval cannot move the seat" }
  - { id: ERR_REFUND_WINDOW_CLOSED, http: 409, condition: "Refund expected but the cancel falls in the NONE tier (days_before <= 0)" }
  - { id: ERR_OFFER_NO_LONGER_VALID, http: 409, condition: "Standby claim attempted after the offer-hold registration was cancelled" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Candidate
    description: "A test-taker. Owns their own candidate record, registrations, standby entries, accommodation requests (as requester), score cancels/sends, and CLEP claims."
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /candidates"
      - "POST /registrations"
      - "POST /registrations/{id}/confirm"
      - "POST /registrations/{id}/cancel"
      - "POST /registrations/{id}/cancel-score"
      - "POST /accommodation-requests"
      - "POST /accommodation-requests/{id}/resubmit"
      - "POST /standby-entries"
      - "POST /standby-entries/{id}/claim"
      - "POST /standby-entries/{id}/decline"
      - "POST /score-sends"
      - "POST /clep-claims"
    shared_operations:
      - "GET reads (candidates, registrations, sessions, score-reports, score-sends, standby-entries, accommodation-requests, clep-claims, payment-txns, id-verifications)"
      - "POST /_clock/set_current_utc"

  - name: TestCenterAdmin
    description: "Center operator. Owns centers, sessions, check-in, ID verification, and session close."
    identity: "opaque"
    exclusive_operations:
      - "POST /test-centers"
      - "POST /test-sessions"
      - "POST /test-sessions/{id}/close"
      - "POST /registrations/{id}/check-in"
      - "POST /registrations/{id}/id-verifications"
    shared_operations:
      - "GET reads across the surface"
      - "POST /_clock/set_current_utc"

  - name: AccommodationReviewer
    description: "504/IEP reviewer. Owns the accommodation review queue."
    identity: "opaque"
    exclusive_operations:
      - "POST /accommodation-requests/{id}/begin-review"
      - "POST /accommodation-requests/{id}/request-info"
      - "POST /accommodation-requests/{id}/approve"
      - "POST /accommodation-requests/{id}/deny"
    shared_operations:
      - "GET reads across the surface"
      - "POST /_clock/set_current_utc"

  - name: ScoreOps
    description: "Scoring operations. Owns score recording, release, and CLEP adjudication."
    identity: "opaque"
    exclusive_operations:
      - "POST /registrations/{id}/score-reports"
      - "POST /registrations/{id}/release-score"
      - "POST /clep-claims/{id}/adjudicate"
    shared_operations:
      - "GET reads across the surface"
      - "POST /_clock/set_current_utc"
