          - entities.DeclarationPackage.fields.allocated_bp_total
        excluded_because:
          difficulty_instance: undivided_share_bp_restored_byte_identically_by_withdraw_then_reinstate
          rationale: "The §1.8 instance withdraws and then reinstates a unit and asserts that every
            individual percentage_interest_bp - not merely the 10000 total - returns to its exact prior
            value, which is the whole reinstate side-effect claim."
      - name: unit_list_filters_and_offset_compose_over_one_page
        claim_type: standard_crud
        grounds:
          - endpoints[GET /units]
          - endpoints[GET /declaration-packages/{id}/units]
          - response_envelope.pagination_fields
          - entities.Unit.fields.declaration_status
        distinguishing_aspect: "declaration_status filtering and offset paging COMPOSE: total_count is the
          count of the FILTERED set (2), not of the collection (3), has_more follows the filtered total,
          and the withdrawn unit never appears on a page of the INCLUDED filter. With no filter the
          package listing still returns all three rows, so withdrawal is not a soft delete."
        test_recipe:
          setup:
            - "One package with units 101, 102 INCLUDED and unit 103 WITHDRAWN."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 3, sponsor_user_id: "sponsor-1" }
