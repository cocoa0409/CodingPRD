  - rule_id: compensating_invariant
    instances:
      - name: draw_money_conservation_paid_plus_due_equals_contract
        grounds:
          - state_machines.Draw.INVOICED_to_PAID
          - entities.Project.fields.draws_paid_total
          - entities.Project.fields.balance_due
          - entities.Project.fields.contract_total
        distinguishing_aspect: |
          Conserved quantity = contract dollars: after the forward action (pay DEPOSIT draw 4321.01),
          the identity draws_paid_total + balance_due == contract_total holds exactly
          (4321.01 + 17284.03 == 21605.04), no drift.
        test_recipe:
          setup:
            - "Accepted estimate (fence 120 + deck 200), contract_total 21605.04; DEPOSIT draw INVOICED; project SCHEDULED"
            - "Full chain to SCHEDULED: site measure approved, permit issued, material delivered, crew confirmed"
