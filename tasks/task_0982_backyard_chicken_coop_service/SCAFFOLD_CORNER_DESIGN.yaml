  - section: calculations
    instances:
      - name: visit_overtime_started_block_rounding
        claim_type: correct_result
        grounds: [calculations.visit_final_price]
        distinguishing_aspect: "Overtime bills each STARTED 15-minute block via ceil: 15 extra minutes = 1 block (+700), 16 extra minutes = 2 blocks (+1400) — 16 rounds UP, not down."
        test_recipe:
          setup:
            - "URBAN household; coop capacity 4 (flock tier 0) INSTALLED via SETUP_INSTALL completed in exactly 195 minutes (15 over standard 180 -> 1 block)"
            - "Second COOP_CLEANING visit completed in 76 minutes (16 over standard 60 -> 2 blocks)"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H OT", email: "hot@x.com", address: "34 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 4 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_i: $.data.id }
            - call: "POST /coopcare/service-visits/${v_i}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_i}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_i}/complete"
              payload: { observed_flock_size: 4, actual_duration_minutes: 195 }
              as: ServiceTech
              as_user_id: "tech-1"
              captures: { fin1: $.data.final_price_cents }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "COOP_CLEANING", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_c: $.data.id }
            - call: "POST /coopcare/service-visits/${v_c}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_c}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /coopcare/service-visits/${v_c}/complete"
              payload: { observed_flock_size: 4, actual_duration_minutes: 76 }
              as: ServiceTech
              as_user_id: "tech-1"
              captures: { fin2: $.data.final_price_cents }
          assert:
            - "ServiceVisit.${v_i}.final_price_cents == 25700 (25000 + 0 tier + ceil(15/15)*700)"
            - "ServiceVisit.${v_c}.final_price_cents == 9400 (8000 + 0 tier + ceil(16/15)*700 = 2*700)"

