              as_user_id: "admin-1"
              captures: { site_cap1: "$.data.id" }
            - call: "POST /radio-system/sites"
              payload: { site_code: "CAP-2", name: "Cap Two", channel_capacity: 4, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_cap2: "$.data.id" }
            - call: "POST /radio-system/sites"
              payload: { site_code: "CAP-3", name: "Cap Three", channel_capacity: 4, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_cap3: "$.data.id" }
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_cap1}", event_class: "PLANNED_MAINTENANCE", cause: "SCHEDULED_WORK", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { event_cap1: "$.data.id" }
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_cap2}", event_class: "PLANNED_MAINTENANCE", cause: "SCHEDULED_WORK", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { event_cap2: "$.data.id" }
          trigger:
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_cap3}", event_class: "PLANNED_MAINTENANCE", cause: "SCHEDULED_WORK", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T14:00:00Z" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { cap_error_id: "$.data.error_id" }
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_cap3}", event_class: "PLANNED_MAINTENANCE", cause: "SCHEDULED_WORK", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T16:00:00Z" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { event_cap3: "$.data.id" }
          assert:
            - "trigger[0] returns HTTP 409 with data.error_id == ERR_MAINTENANCE_CONCURRENCY_CAP"
            - "GET /radio-system/site-events?site_id=${site_cap3} returns total_count == 1 after both triggers"
            - "trigger[1] returns HTTP 201 (its half-open [12:00, 16:00) window does not intersect the two [08:00, 12:00) windows) and SiteEvent.${event_cap3}.status == OPEN"
            - "Site.${site_cap1}.status == IN_SERVICE and Site.${site_cap3}.status == IN_SERVICE (scheduling a window does not start it)"

