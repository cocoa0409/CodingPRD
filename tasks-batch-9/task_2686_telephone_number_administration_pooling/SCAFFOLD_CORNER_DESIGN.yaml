  - section: calculations
    instances:
      - name: filing_utilization_denominator_excludes_administrative_and_aging
        claim_type: Input Set Filtering
        grounds: ["calculations.filing_utilization_pct", "calculations.filing_utilization_pct.input_set"]
        distinguishing_aspect: "Administrative and aging numbers leave the denominator but never enter the numerator: 2 blocks with 200 administrative and 300 aging give a denominator of 1500, so 1000 assigned reads 66.67 and not the naive 1000/2000 = 50.00."
        test_recipe:
          setup: ["Carrier A holds a GRANTED licence. NPA 614 carries rate center COLUMBUS. A DRAFT 2026-H1 filing reports blocks_held 2, assigned 1000, intermediate 0, reserved 0, administrative 200, aging 300."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", reporting_period: "2026-H1", numbers_assigned: 1000, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 300, numbers_administrative: 200, blocks_held_at_period_end: 2, forecast_quarters: [600, 600, 600, 600] }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
