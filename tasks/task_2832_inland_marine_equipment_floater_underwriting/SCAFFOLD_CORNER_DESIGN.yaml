              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "AGREED_VALUE", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 100000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cpA: $.data.id }
            - call: "GET /inland-marine/policies/${polA}"
              payload: {}
              as: Underwriter
              captures: { polA_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cpA}/equipment-items"
              payload: { description: "Crane At Threshold", equipment_type: "CRANE", model_year: 2024, original_cost_cents: 50000000, ownership: "OWNED", stated_value_cents: 50000000, expected_policy_version: "${polA_v1}" }
              as: Underwriter
              captures: { itA: $.data.id }
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "One Cent Over Cranes", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { polB: $.data.id }
            - call: "POST /inland-marine/policies/${polB}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "AGREED_VALUE", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 100000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cpB: $.data.id }
            - call: "GET /inland-marine/policies/${polB}"
              payload: {}
              as: Underwriter
              captures: { polB_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cpB}/equipment-items"
              payload: { description: "Crane One Cent Over", equipment_type: "CRANE", model_year: 2024, original_cost_cents: 50000001, ownership: "OWNED", stated_value_cents: 50000001, expected_policy_version: "${polB_v1}" }
              as: Underwriter
              captures: { itB: $.data.id }
          trigger:
            - call: "POST /inland-marine/policies/${polA}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${polB}/quote"
              payload: {}
              as: Underwriter
            - call: "DELETE /inland-marine/equipment-items/${itB}"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${polB}/quote"
              payload: {}
              as: Underwriter
          assert:
            - "trigger[0] response Policy.${polA}.total_insured_value_cents == 50000000, sum_of_part_premiums_cents == 2131250, written_premium_cents == 2216500, referral_required == false (the TIV test is > and 50000000 is not > 50000000; the premium test is >= but 2216500 < 5000000)"
            - "trigger[1] response Policy.${polB}.total_insured_value_cents == 50000001, sum_of_part_premiums_cents == 2131250, written_premium_cents == 2216500, referral_required == true"
            - "the two policies carry the IDENTICAL premium literals - one cent of insured value crosses the trigger without moving the premium at all, so the trigger cannot be inferred from the premium"
            - "attempting POST /inland-marine/policies/${polB}/bind at this point returns 422 ERR_REFERRAL_REQUIRED while the same call on ${polA} would return 200"
            - "trigger[2] HTTP status == 200; EquipmentItem.${itB}.status == REMOVED and no ledger entry is written (policy still QUOTED)"
            - "trigger[3] response Policy.${polB}.total_insured_value_cents == 0, sum_of_part_premiums_cents == 0, written_premium_cents == 100000 and referral_required == false - the trigger RESETS when the driver falls back below the threshold"

      - name: corner_referral_premium_threshold_is_inclusive_and_can_be_tripped_by_the_minimum
        claim_type: Rate Threshold Trigger
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.policy_written_premium.constants.REFERRAL_PREMIUM_THRESHOLD_CENTS
          - entities.Policy.fields.minimum_premium_cents
        distinguishing_aspect: "The premium trigger is inclusive and reads the FLOORED written premium, so an itemless policy whose minimum_premium_cents is exactly 5000000 quotes to referral_required true while one at 4999999 quotes to false - with zero insured value on both."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "Two DRAFT T2_URBAN policies, each with one empty ACTIVE SCHEDULED_EQUIPMENT part so the quote is not barred by ERR_NO_RATABLE_COVERAGE, differing only in minimum_premium_cents: 5000000 versus 4999999."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Minimum At Threshold Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 5000000 }
              as: Underwriter
              captures: { polA: $.data.id }
            - call: "POST /inland-marine/policies/${polA}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cpA: $.data.id }
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Minimum One Cent Under Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 4999999 }
              as: Underwriter
              captures: { polB: $.data.id }
            - call: "POST /inland-marine/policies/${polB}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cpB: $.data.id }
          trigger:
            - call: "POST /inland-marine/policies/${polA}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${polB}/quote"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/${polA}/premium-summary"
              payload: {}
              as: Underwriter
          assert:
            - "trigger[0] response Policy.${polA}.sum_of_part_premiums_cents == 0, written_premium_cents == 5000000, total_insured_value_cents == 0, referral_required == true (5000000 >= 5000000)"
            - "trigger[1] response Policy.${polB}.sum_of_part_premiums_cents == 0, written_premium_cents == 4999999, referral_required == false"
            - "trigger[2] response minimum_premium_applied == true and written_premium_cents == 5000000, confirming the trigger reads the post-floor figure and not the 0 loaded sum"
            - "POST /inland-marine/policies/${polA}/refer returns 200 (referral_required is true) while the same call on ${polB} returns 409 ERR_POLICY_NOT_REFERRABLE"
            - "neither policy has any insured value, so this instance isolates the premium trigger from the TIV trigger completely"

      - name: corner_scheduled_versus_blanket_dual_variant
        claim_type: Dual Variant Calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.coverage_part_equipment_premium
        excluded_because:
          difficulty_instance: dual_variant_calc / scheduled_versus_blanket_equipment_basis_divergence
          rationale: "Both variants, the switch of rating_basis and the exact policy-level delta are asserted there; the corner-level premium-summary instance above only reads the two roll-ups side by side."

  # =========================================================================
  - section: consistency_model
    instances:

      - name: corner_immediate_visibility_of_rating_inside_the_writing_response
        claim_type: Immediate Consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /inland-marine/coverage-parts/{id}/equipment-items]
          - endpoints[POST /inland-marine/policies/{id}/quote]
        distinguishing_aspect: "Every derived figure is present in the response of the request that caused it: the item-create response already carries insured_value_cents 8160000 and rated_premium_cents 173318, and the quote response already carries written_premium_cents 180251 - no follow-up read is needed for any of them."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One DRAFT T2_URBAN policy (minimum 100000) with one empty SCHEDULED_EQUIPMENT part."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Immediate Read Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
            - call: "GET /inland-marine/coverage-parts/${cp}"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
          assert:
            - "trigger[0] response body (201) already contains age_years_at_rating == 4, insured_value_cents == 8160000, applied_rate_rule_id == ${rr}, applied_base_rate_bp == 180, applied_credit_bp == 0, rated_premium_cents == 173318 and status RATED - rating is synchronous, never deferred to the quote"
            - "trigger[1] response CoveragePart.${cp}.rated_premium_cents == 173318 - the part roll-up was already committed by the create, before any quote ran"
            - "trigger[2] response body (200) already contains sum_of_part_premiums_cents == 173318, written_premium_cents == 180251, scheduled_basis_premium_cents == 180251, total_insured_value_cents == 8160000 and status QUOTED - the quote never returns a pre-recomputation snapshot"
            - "no read in this recipe ever returns a stale value: the figure asserted from a write response is byte-identical to the figure the following GET returns"

      - name: corner_immediate_visibility_of_the_capacity_drawdown_and_its_restoration
        claim_type: Immediate Consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /inland-marine/claims/{id}/settle]
          - endpoints[POST /inland-marine/claims/{id}/salvage-recovery]
        distinguishing_aspect: "A total-loss settlement of 8060000 draws the part aggregate to 191940000 and takes the item off risk within the settling request, and a 1500000 salvage recovery restores it to 193440000 within its own request - both visible to the immediately following read with no intervening action."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One IN_FORCE T2_URBAN policy (minimum 100000, written 180251) with one ACTIVE ACV excavator insured at 8160000 on a SCHEDULED_EQUIPMENT part: deductible 100000, per_item_limit 20000000, aggregate 200000000. One claim on that item, inspected at repair_estimate 7000000 (above the 6120000 constructive-total-loss threshold) and adjusted TOTAL_LOSS by adj-1."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Drawdown Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${it1}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-08-01", loss_type: "FIRE", equipment_item_id: "${it1}" }
              as: Underwriter
              captures: { clm: $.data.id }
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 7000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/adjust"
              payload: { adjustment_basis: "TOTAL_LOSS" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "POST /inland-marine/claims/${clm}/settle"
              payload: {}
              as: UnderwritingManager
              as_user_id: "mgr-1"
            - call: "GET /inland-marine/coverage-parts/${cp}"
              payload: {}
              as: UnderwritingManager
            - call: "POST /inland-marine/claims/${clm}/salvage-recovery"
              payload: { salvage_proceeds_cents: 1500000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "GET /inland-marine/coverage-parts/${cp}"
              payload: {}
              as: UnderwritingManager
            - call: "GET /inland-marine/policies/${pol}/ledger-entries"
              payload: { ledger: "LOSS", limit: 100, offset: 0 }
              as: UnderwritingManager
          assert:
            - "after setup: Claim.${clm}.constructive_total_loss_threshold_cents == 6120000, adjustment_status == TOTAL_LOSS_DECLARED, salvage_status == PENDING, settlement_amount_cents == 8060000"
            - "trigger[0] response body already contains settlement_paid_cents == 8060000, settled_by_user_id == mgr-1, adjustment_status == SETTLED and salvage_status == PENDING (the total-loss branch stops at SETTLED)"
            - "trigger[1] response CoveragePart.${cp}.aggregate_paid_net_cents == 8060000 and aggregate_available_cents == 191940000, already committed by trigger[0]"
            - "trigger[1] response CoveragePart.${cp}.rated_premium_cents == 0 - the cascade took the item off risk inside the settling request"
            - "after trigger[0]: EquipmentItem.${it1}.status == TOTALED, Policy.${pol}.incurred_loss_cents == 8060000, written_premium_cents == 100000 (back to the floor), total_insured_value_cents == 0, and premium_balance_cents == 6933 (180251 initial minus a full-term 173318 ENDORSEMENT_RETURN, remaining_days 365 of 365)"
            - "trigger[2] response body already contains salvage_status == RECOVERED, salvage_credit_cents == 1500000 and adjustment_status == CLOSED (the two axes join)"
            - "trigger[3] response CoveragePart.${cp}.aggregate_available_cents == 193440000 and aggregate_paid_net_cents == 6560000"
            - "after trigger[2]: Policy.${pol}.incurred_loss_cents == 6560000"
            - "trigger[4] response: 2 rows in created_at ASC order - CLAIM_SETTLEMENT +8060000 then SALVAGE_RECOVERY -1500000, both carrying claim_id ${clm}"
            - "aggregate_limit_cents == aggregate_available_cents + aggregate_paid_net_cents holds at every observation: 200000000 == 191940000 + 8060000 == 193440000 + 6560000"
