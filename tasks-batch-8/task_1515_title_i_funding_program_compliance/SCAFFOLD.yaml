# =============================================================================
# Task 1515: Title I Funding & Program Compliance (district federal programs office)
# =============================================================================

scenario: |
  Title I Funding & Program Compliance (district federal programs office): poverty measure & school ranking for allocation, schoolwide vs targeted-assistance program determination, set-aside calculations (parent engagement/homeless/PD), supplement-not-supplant documentation, private-school equitable services consultation, allowable-cost review & budget amendment, carryover limit & waiver, monitoring visit & finding resolution

domain_name: title-i-program-compliance
api_prefix: /title-i

# Expert+ calibration: the scenario names eight distinct federal-compliance
# workflows, so the endpoint/error surface intentionally exceeds the Expert
# guideline band (20-32 endpoints, 18-30 errors). Difficulty is concentrated
# in the calculation rules, cascades, and cross-entity state gates per §0.4.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency      # OCC on DistrictGrant.version for re-baselining writes
    - cascading_side_effects      # snapshot recertify depth-3 cascade; CAP acceptance depth-3 bubble-up
    - rate_threshold_triggers     # 40% schoolwide, 75% must-serve, 35% eligible, 15% carryover, $500k PE, 90% PE distribution
    - dual_variant_calculation    # equitable share (agreed vs verified); carryover (provisional vs final)
  entity_topology: flat           # peer entities joined by FK references in bodies; no nested mutation paths
  state_machine_shape: branching  # cyclic revision loops (finding, SNS, consultation) + parallel dims on DistrictGrant
  relationship_patterns:
    - one_to_many                 # grant -> snapshots/allocations/set-asides/expenditures/amendments/visits
    - cross_aggregate             # SNS doc -> allocation; consultation -> private school + grant; finding -> visit
  role_model: segregation_of_duties   # submitter != approver on amendments, SNS reviews, expenditure reviews
  consistency_model: immediate    # all side effects atomic within the triggering request

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: DistrictGrant
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Federal fiscal year of the award (funds period runs July 1 of fiscal_year-1 through June 30 of fiscal_year)", constraints: "unique across all grants; 2020..2100" }
      - { name: total_allocation_cents, type: integer, source: input, description: "LEA Title I Part A total allocation in cents", constraints: "> 0" }
      - { name: carryover_in_cents, type: integer, source: input, default: 0, description: "Carryover funds from the prior fiscal year, in cents", constraints: ">= 0" }
      - { name: admin_reserve_cents, type: integer, source: input, default: 0, description: "District-level administration reserve taken off the top, in cents", constraints: ">= 0 and <= total_allocation_cents + carryover_in_cents" }
      - { name: poverty_measure, type: enum, source: input, description: "CENSUS_SAIPE | FREE_REDUCED_LUNCH | MEDICAID_DIRECT_CERT | COMPOSITE — poverty measure the ranking snapshot must use" }
      - { name: equitable_count_method, type: enum, source: input, default: CONSULTATION_AGREED, description: "CONSULTATION_AGREED | VERIFIED_COUNT — selects the equitable-services share variant" }
      - { name: status, type: enum, source: system, description: "SETUP | RANKING_LOCKED | ALLOCATED | CLOSED_OUT (state machine dimension 1)" }
      - { name: carryover_waiver_status, type: enum, source: system, default: NONE, description: "NONE | REQUESTED | GRANTED | DENIED (state machine dimension 2, parallel to status)" }
      - { name: carryover_waiver_justification, type: string, source: system, description: "Justification recorded on the latest waiver request" }
      - { name: carryover_waiver_decided_at, type: datetime, source: system, description: "Timestamp of the SEA waiver decision, null while undecided" }
      - { name: net_allocable_cents, type: integer, source: computed, description: "= total_allocation_cents + carryover_in_cents - admin_reserve_cents" }
      - { name: ranking_version, type: integer, source: system, default: 0, description: "Generation counter, incremented by every successful lock-rankings and every snapshot recertification" }
      - { name: liquidated_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this grant's expenditures with status ALLOWED" }
      - { name: pending_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this grant's expenditures with status PENDING_REVIEW" }
      - { name: provisional_carryover_cents, type: integer, source: computed, description: "PROVISIONAL variant: net_allocable_cents - liquidated_cents - pending_cents (pending treated as encumbered at face value)" }
      - { name: provisional_carryover_pct_bp, type: integer, source: computed, description: "= round_half_up(provisional_carryover_cents * 10000 / total_allocation_cents)" }
      - { name: final_carryover_cents, type: integer, source: computed, description: "FINAL variant: net_allocable_cents - liquidated_cents; stamped at close-out" }
      - { name: final_carryover_pct_bp, type: integer, source: computed, description: "= round_half_up(final_carryover_cents * 10000 / total_allocation_cents); stamped at close-out" }
      - { name: monitoring_clearance, type: enum, source: computed, default: NOT_MONITORED, description: "NOT_MONITORED | FINDINGS_OPEN | CLEARED — derived from this grant's visits/findings" }

  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School name" }
      - { name: nces_id, type: string, source: input, description: "NCES identifier", constraints: "unique" }
      - { name: grade_span_low, type: integer, source: input, description: "Lowest grade served (0 = pre-K)", constraints: "0..12" }
      - { name: grade_span_high, type: integer, source: input, description: "Highest grade served", constraints: "grade_span_low <= grade_span_high <= 12" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Active schools must appear in every certified poverty snapshot" }

  - name: PrivateSchool
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Private school name" }
      - { name: nonprofit_verified, type: boolean, source: input, default: false, description: "Nonprofit status verified; required before equitable-services consultation may be opened" }
      - { name: low_income_resident_count, type: integer, source: input, description: "Count of low-income children residing in the district who attend this school (verified count source)", constraints: ">= 0" }
      - { name: contact_email, type: string, source: input, description: "Ombudsman/contact email" }

  - name: PovertyDataSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> DistrictGrant.id; the grant whose ranking this snapshot drives" }
      - { name: measure, type: enum, source: input, description: "CENSUS_SAIPE | FREE_REDUCED_LUNCH | MEDICAID_DIRECT_CERT | COMPOSITE — must equal grant.poverty_measure" }
      - { name: entries, type: array, source: input, description: "Array of {school_id, low_income_student_count, total_student_count}; must cover every School with is_active=true exactly once; 0 <= low_income <= total; total > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | CERTIFIED | SUPERSEDED" }
      - { name: certified_at, type: datetime, source: system, description: "Server timestamp of certification" }

  - name: SchoolAllocation
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> DistrictGrant.id" }
      - { name: school_id, type: string, source: system, description: "FK -> School.id" }
      - { name: snapshot_id, type: string, source: system, description: "FK -> PovertyDataSnapshot.id; snapshot generation that produced this row's figures" }
      - { name: low_income_student_count, type: integer, source: system, description: "Copied from the certified snapshot entry (version-pinned)" }
      - { name: total_student_count, type: integer, source: system, description: "Copied from the certified snapshot entry (version-pinned)" }
      - { name: poverty_pct_bp, type: integer, source: computed, description: "= round_half_up(low_income_student_count * 10000 / total_student_count)" }
      - { name: rank_position, type: integer, source: computed, description: "1 = highest poverty. Sort poverty_pct_bp DESC, tie-break low_income_student_count DESC, then School.created_at ASC" }
      - { name: eligibility_flag, type: enum, source: computed, description: "MUST_SERVE (pct >= 7500 bp) | ELIGIBLE (>= 3500 bp) | BELOW_THRESHOLD (< 3500 bp)" }
      - { name: program_model, type: enum, source: computed, description: "SCHOOLWIDE when poverty_pct_bp >= 4000; otherwise TARGETED_ASSISTANCE" }
      - { name: serve_elected, type: boolean, source: system, default: false, description: "True when a BELOW_THRESHOLD school was elected into the served set at finalize-allocations" }
      - { name: served, type: boolean, source: computed, description: "True when eligibility_flag != BELOW_THRESHOLD or serve_elected = true" }
      - { name: per_pupil_cents, type: integer, source: computed, default: 0, description: "Per low-income-pupil amount from the allocation waterfall (0 until finalize)" }
      - { name: allocation_amount_cents, type: integer, source: computed, default: 0, description: "= per_pupil_cents * low_income_student_count after remainder reconciliation (0 until finalize)" }
      - { name: liquidated_cents, type: integer, source: computed, default: 0, description: "Sum of ALLOWED expenditure amounts charged to this allocation" }
      - { name: pending_cents, type: integer, source: computed, default: 0, description: "Sum of PENDING_REVIEW expenditure amounts charged to this allocation" }
      - { name: supplement_ok, type: boolean, source: computed, default: false, description: "True when an ACCEPTED SupplementDocumentation row exists for this allocation" }
      - { name: status, type: enum, source: system, description: "PENDING | CERTIFIED (CERTIFIED -> PENDING on snapshot recertification cascade)" }

  - name: SetAside
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> DistrictGrant.id" }
      - { name: category, type: enum, source: system, description: "PARENT_ENGAGEMENT | HOMELESS_SERVICES | PROFESSIONAL_DEVELOPMENT | EQUITABLE_SERVICES" }
      - { name: minimum_cents, type: integer, source: computed, description: "Regulatory floor per set_aside_minimums / equitable_services_share" }
      - { name: reserved_cents, type: integer, source: system, description: "Currently reserved amount; initialized to minimum_cents at finalize; adjustable upward via adjust" }
      - { name: school_distributed_minimum_cents, type: integer, source: computed, default: 0, description: "PARENT_ENGAGEMENT only: round_half_up(0.90 * reserved_cents); 0 for other categories; recomputed on every adjust" }
      - { name: liquidated_cents, type: integer, source: computed, default: 0, description: "Sum of ALLOWED expenditure amounts charged to this set-aside" }

  - name: SupplementDocumentation
    parent: null
    common_fields: true
    fields:
      - { name: school_allocation_id, type: string, source: input, description: "FK -> SchoolAllocation.id; allocation this methodology covers" }
      - { name: methodology, type: enum, source: input, description: "PER_SCHOOL_DISTRIBUTION | GRADE_SPAN_GROUPING | PER_PUPIL_FORMULA" }
      - { name: coverage_start_date, type: string, source: input, description: "ISO date; half-open window start (inclusive)" }
      - { name: coverage_end_date, type: string, source: input, description: "ISO date; half-open window end (exclusive); must be > coverage_start_date" }
      - { name: narrative, type: string, source: input, description: "Methodology narrative", constraints: ">= 50 characters" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | RETURNED | STALE (ACCEPTED -> STALE when the allocation is recomputed)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the most recent submitter (SoD anchor)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewer" }
      - { name: review_note, type: string, source: system, description: "Reviewer note; required when decision is RETURN" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Number of times this document has been submitted" }

  - name: EquitableServicesConsultation
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> DistrictGrant.id" }
      - { name: private_school_id, type: string, source: input, description: "FK -> PrivateSchool.id", constraints: "unique per (grant_id, private_school_id)" }
      - { name: status, type: enum, source: system, description: "INITIATED | CONSULTING | AFFIRMATION_SIGNED | DISPUTED | COMPLAINT_FILED" }
      - { name: sessions, type: array, source: system, description: "Append-only [{session_date, topics, attendee_count}] logged by record-session" }
      - { name: sessions_count, type: integer, source: computed, default: 0, description: "= len(sessions)" }
      - { name: agreed_low_income_count, type: integer, source: system, description: "Low-income resident count agreed in consultation; recorded at sign-affirmation", constraints: ">= 0" }
      - { name: affirmation_signed_at, type: datetime, source: system, description: "Timestamp of affirmation signature" }
      - { name: affirmation_signer_id, type: string, source: system, description: "X-User-ID of the ombudsman who signed" }
      - { name: dispute_reason, type: string, source: system, description: "Reason recorded on the latest dispute" }
      - { name: complaint_determination, type: string, source: system, description: "SEA determination text recorded at resolve-complaint" }

  - name: Expenditure
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> DistrictGrant.id" }
      - { name: school_allocation_id, type: string, source: input, description: "FK -> SchoolAllocation.id; mutually exclusive with set_aside_id", constraints: "exactly one of school_allocation_id / set_aside_id required" }
      - { name: set_aside_id, type: string, source: input, description: "FK -> SetAside.id; mutually exclusive with school_allocation_id" }
      - { name: amount_cents, type: integer, source: input, description: "Charged amount in cents", constraints: "> 0" }
      - { name: function_code, type: enum, source: input, description: "INSTRUCTION | PD | PARENT_ENGAGEMENT | HOMELESS_SUPPORT | EQUITABLE_SERVICES; school charges must use INSTRUCTION; set-aside charges must match the set-aside category (PD->PROFESSIONAL_DEVELOPMENT, PARENT_ENGAGEMENT->PARENT_ENGAGEMENT, HOMELESS_SUPPORT->HOMELESS_SERVICES, EQUITABLE_SERVICES->EQUITABLE_SERVICES)" }
      - { name: description, type: string, source: input, description: "Cost description" }
      - { name: incurred_date, type: string, source: input, description: "ISO date the cost was incurred; must fall inside the grant's funds period [July 1 of fiscal_year-1, June 30 of fiscal_year]" }
      - { name: supplant_screen, type: boolean, source: input, default: false, description: "True when the cost could supplant state/local funds; requires ACCEPTED SNS documentation for the charged school allocation" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | ALLOWED | DISALLOWED | RECLASSIFIED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitter (SoD anchor)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewer" }
      - { name: review_note, type: string, source: system, description: "Reviewer note" }
      - { name: disallow_reason, type: enum, source: system, description: "SUPPLANT_RISK | UNALLOWABLE_COST | INSUFFICIENT_DOCUMENTATION | SNS_STALE_CASCADE; required when decision is DISALLOW" }
      - { name: reclassified_to_fund_source, type: enum, source: system, description: "NON_TITLE_I_STATE | NON_TITLE_I_LOCAL; set by reclassify" }

  - name: BudgetAmendment
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> DistrictGrant.id" }
      - { name: lines, type: array, source: input, description: "Array of {target_type: SCHOOL_ALLOCATION|SET_ASIDE, target_id, new_amount_cents}; absolute post-amendment values. Sum of (new_amount_cents - current value) over all lines MUST equal 0" }
      - { name: prior_amounts, type: array, source: system, description: "Snapshot of [{target_id, prior_amount_cents}] captured at approval; restored verbatim by void" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | VOIDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitter (SoD anchor)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the approver/rejecter/voider" }
      - { name: decision_note, type: string, source: system, description: "Decision note; required on reject" }

  - name: MonitoringVisit
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> DistrictGrant.id" }
      - { name: visit_start_date, type: string, source: input, description: "ISO date, inclusive interval start" }
      - { name: visit_end_date, type: string, source: input, description: "ISO date, inclusive interval end; >= visit_start_date" }
      - { name: scope, type: enum, source: input, description: "PROGRAMMATIC | FISCAL | COMPREHENSIVE" }
      - { name: lead_monitor_id, type: string, source: system, description: "X-User-ID of the creating SEAMonitor" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | REPORT_ISSUED | CLOSED" }
      - { name: report_issued_at, type: datetime, source: system, description: "Timestamp of issue-report" }

  - name: MonitoringFinding
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> MonitoringVisit.id" }
      - { name: citation, type: string, source: input, description: "Regulatory citation, e.g. '34 CFR 200.77'" }
      - { name: severity, type: enum, source: input, description: "OBSERVATION | FINDING | SYSTEMIC" }
      - { name: description, type: string, source: input, description: "Finding description" }
      - { name: cap_due_date, type: string, source: input, description: "ISO date; corrective action due date; must be strictly after the visit's visit_end_date" }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | CAP_SUBMITTED | CAP_RETURNED | VERIFIED | CLOSED_NO_ACTION" }
      - { name: cap_narrative, type: string, source: system, description: "Corrective action narrative from the latest submission", constraints: ">= 50 characters" }
      - { name: cap_attempt_count, type: integer, source: system, default: 0, description: "Number of CAP submissions on this finding" }
      - { name: cap_submitted_by_user_id, type: string, source: system, description: "X-User-ID of the latest CAP submitter" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the SEAMonitor who accepted/returned/closed" }
      - { name: return_note, type: string, source: system, description: "Required when a CAP is returned" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: DistrictGrant
    initial_state: SETUP
    terminal_states: [CLOSED_OUT]
    note: "Two parallel state dimensions on one row: status (SETUP->RANKING_LOCKED->ALLOCATED->CLOSED_OUT) and carryover_waiver_status (NONE->REQUESTED->GRANTED|DENIED, DENIED->REQUESTED re-request loop). Both must satisfy their own preconditions independently."
    transitions:
      - from: SETUP
        to: RANKING_LOCKED
        trigger: "POST /title-i/grants/{id}/lock-rankings"
        actor: FederalProgramsDirector
        preconditions:
          - "grant.status == SETUP (ERR_GRANT_INVALID_STATE)"
          - "a PovertyDataSnapshot with status == CERTIFIED exists for this grant (ERR_NO_CERTIFIED_SNAPSHOT)"
        side_effects:
          - "create one SchoolAllocation row per snapshot entry: snapshot ids and counts pinned, poverty_pct_bp / rank_position / eligibility_flag / program_model computed (school_ranking calculation), status PENDING, amounts 0"
          - "grant.ranking_version += 1; grant.version += 1"

      - from: RANKING_LOCKED
        to: ALLOCATED
        trigger: "POST /title-i/grants/{id}/finalize-allocations"
        actor: FederalProgramsDirector
        preconditions:
          - "grant.status == RANKING_LOCKED (ERR_GRANT_INVALID_STATE)"
          - "if grant.equitable_count_method == CONSULTATION_AGREED: every PrivateSchool with nonprofit_verified == true has an EquitableServicesConsultation for this grant with status == AFFIRMATION_SIGNED (ERR_CONSULTATION_INCOMPLETE)"
        side_effects:
          - "create 4 SetAside rows (PARENT_ENGAGEMENT, HOMELESS_SERVICES, PROFESSIONAL_DEVELOPMENT, EQUITABLE_SERVICES) with minimum_cents per set_aside_minimums and equitable_services_share; reserved_cents = minimum_cents; school_distributed_minimum_cents per pe_school_distribution_minimum"
          - "run school_allocation_waterfall: fill per_pupil_cents and allocation_amount_cents on every served SchoolAllocation"
          - "grant.version += 1"

      - from: ALLOCATED
        to: CLOSED_OUT
        trigger: "POST /title-i/grants/{id}/close-out"
        actor: FederalProgramsDirector
        preconditions:
          - "grant.status == ALLOCATED (ERR_GRANT_INVALID_STATE)"
          - "no MonitoringFinding of any visit of this grant in {OPEN, ESCALATED, CAP_SUBMITTED, CAP_RETURNED} (ERR_OPEN_FINDINGS_BLOCK_CLOSEOUT — business_safety)"
          - "no Expenditure with status == PENDING_REVIEW (ERR_UNRESOLVED_EXPENDITURES — business_fiscal)"
          - "no BudgetAmendment with status in {DRAFT, SUBMITTED} (ERR_UNRESOLVED_AMENDMENTS — business_fiscal)"
          - "final carryover (carryover_computation FINAL variant) pct_bp <= 1500 OR grant.carryover_waiver_status == GRANTED (ERR_CARRYOVER_LIMIT_EXCEEDED)"
        side_effects:
          - "stamp final_carryover_cents and final_carryover_pct_bp"
          - "grant.version += 1"

      - from: NONE
        to: REQUESTED
        trigger: "POST /title-i/grants/{id}/request-carryover-waiver (carryover_waiver_status dimension)"
        actor: FederalProgramsDirector
        preconditions:
          - "grant.status == ALLOCATED (ERR_GRANT_INVALID_STATE)"
          - "carryover_waiver_status in {NONE, DENIED} (ERR_WAIVER_INVALID_STATE)"
          - "provisional_carryover_pct_bp > 1500 (ERR_CARRYOVER_WITHIN_LIMIT)"
          - "no other DistrictGrant G' has carryover_waiver_status == GRANTED and G'.fiscal_year in {fiscal_year-3, fiscal_year-2, fiscal_year-1} (ERR_CARRYOVER_WAIVER_WITHIN_3_YEARS)"
        side_effects:
          - "record carryover_waiver_justification; grant.version += 1"

      - from: DENIED
        to: REQUESTED
        trigger: "POST /title-i/grants/{id}/request-carryover-waiver (re-request loop)"
        actor: FederalProgramsDirector
        preconditions:
          - "same as NONE -> REQUESTED"
        side_effects:
          - "record carryover_waiver_justification; grant.version += 1"

      - from: REQUESTED
        to: GRANTED
        trigger: "POST /title-i/grants/{id}/decide-carryover-waiver with decision=GRANT"
        actor: SEAMonitor
        preconditions:
          - "carryover_waiver_status == REQUESTED (ERR_WAIVER_INVALID_STATE)"
        side_effects:
          - "stamp carryover_waiver_decided_at; grant.version += 1"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /title-i/grants/{id}/decide-carryover-waiver with decision=DENY"
        actor: SEAMonitor
        preconditions:
          - "carryover_waiver_status == REQUESTED (ERR_WAIVER_INVALID_STATE)"
        side_effects:
          - "stamp carryover_waiver_decided_at; grant.version += 1"

  - entity: PovertyDataSnapshot
    initial_state: DRAFT
    terminal_states: [CERTIFIED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /title-i/poverty-snapshots/{id}/certify"
        actor: FederalProgramsDirector
        preconditions:
          - "snapshot.status == DRAFT (ERR_SNAPSHOT_NOT_CERTIFIABLE)"
          - "grant.status in {SETUP, RANKING_LOCKED, ALLOCATED} (ERR_GRANT_INVALID_STATE)"
          - "entries cover every School with is_active == true exactly once (ERR_SNAPSHOT_INCOMPLETE_COVERAGE)"
          - "snapshot.measure == grant.poverty_measure (ERR_INVALID_REQUEST)"
          - "OCC: request expected_grant_version == grant.version (ERR_STALE_GRANT_VERSION, 412)"
        side_effects:
          - "link B (depth 1): any other snapshot of this grant with status CERTIFIED flips to SUPERSEDED (certified-cardinality invariant)"
          - "link C (depth 2): if grant.status in {RANKING_LOCKED, ALLOCATED}, every SchoolAllocation row of the grant is recomputed in place from the new snapshot (school_ranking; when ALLOCATED also school_allocation_waterfall + equitable_services_share + set_aside_minimums) and any allocation in CERTIFIED flips to PENDING; allocations for schools absent from the new entries are impossible because coverage is total over active schools; new active schools get fresh PENDING rows"
          - "link D (depth 3): every SupplementDocumentation with status ACCEPTED whose allocation flipped CERTIFIED -> PENDING flips to STALE, and every Expenditure with status PENDING_REVIEW and supplant_screen == true on such an allocation flips to DISALLOWED with disallow_reason SNS_STALE_CASCADE"
          - "grant.ranking_version += 1; grant.version += 1"

  - entity: SchoolAllocation
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /title-i/school-allocations/{id}/certify"
        actor: FederalProgramsDirector
        preconditions:
          - "allocation.status == PENDING (ERR_ALLOCATION_NOT_PENDING)"
          - "grant.status == ALLOCATED (ERR_GRANT_INVALID_STATE) — cross-entity dependency SchoolAllocation -> DistrictGrant"
        side_effects:
          - "allocation.version += 1"

      - from: CERTIFIED
        to: PENDING
        trigger: "system (snapshot recertification cascade, see PovertyDataSnapshot DRAFT->CERTIFIED link C)"
        actor: system
        preconditions: []
        side_effects:
          - "figures recomputed in place; triggers SNS STALE cascade (link D)"

  - entity: SupplementDocumentation
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /title-i/supplement-documentation/{id}/submit"
        actor: ComplianceAnalyst | FederalProgramsDirector
        preconditions:
          - "status in {DRAFT, RETURNED, STALE} (ERR_SNS_NOT_SUBMITTABLE)"
          - "allocation.status == CERTIFIED (ERR_ALLOCATION_NOT_CERTIFIED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID; attempt_count += 1"

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /title-i/supplement-documentation/{id}/submit (revision loop)"
        actor: ComplianceAnalyst | FederalProgramsDirector
        preconditions:
          - "status in {DRAFT, RETURNED, STALE} (ERR_SNS_NOT_SUBMITTABLE)"
          - "allocation.status == CERTIFIED (ERR_ALLOCATION_NOT_CERTIFIED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID; attempt_count += 1"

      - from: STALE
        to: SUBMITTED
        trigger: "POST /title-i/supplement-documentation/{id}/submit (re-baseline loop)"
        actor: ComplianceAnalyst | FederalProgramsDirector
        preconditions:
          - "status in {DRAFT, RETURNED, STALE} (ERR_SNS_NOT_SUBMITTABLE)"
          - "allocation.status == CERTIFIED (ERR_ALLOCATION_NOT_CERTIFIED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID; attempt_count += 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /title-i/supplement-documentation/{id}/review with decision=ACCEPT"
        actor: FederalProgramsDirector
        preconditions:
          - "status == SUBMITTED (ERR_SNS_NOT_REVIEWABLE)"
          - "reviewer X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID; allocation.supplement_ok recomputed (true)"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /title-i/supplement-documentation/{id}/review with decision=RETURN"
        actor: FederalProgramsDirector
        preconditions:
          - "status == SUBMITTED (ERR_SNS_NOT_REVIEWABLE)"
          - "reviewer X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "review_note present (ERR_INVALID_REQUEST)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"

      - from: ACCEPTED
        to: STALE
        trigger: "system (snapshot recertification cascade, link D)"
        actor: system
        preconditions: []
        side_effects:
          - "allocation.supplement_ok recomputed (false)"

  - entity: EquitableServicesConsultation
    initial_state: INITIATED
    terminal_states: []
    transitions:
      - from: INITIATED
        to: CONSULTING
        trigger: "POST /title-i/equitable-services-consultations/{id}/record-session (first session)"
        actor: ComplianceAnalyst
        preconditions:
          - "status in {INITIATED, CONSULTING, DISPUTED} (ERR_CONSULTATION_INVALID_STATE)"
          - "session_date <= current clock date (ERR_SESSION_DATE_IN_FUTURE)"
        side_effects:
          - "append session; sessions_count += 1"

      - from: CONSULTING
        to: CONSULTING
        trigger: "POST /title-i/equitable-services-consultations/{id}/record-session (self-loop)"
        actor: ComplianceAnalyst
        preconditions:
          - "status in {INITIATED, CONSULTING, DISPUTED} (ERR_CONSULTATION_INVALID_STATE)"
          - "session_date <= current clock date (ERR_SESSION_DATE_IN_FUTURE)"
        side_effects:
          - "append session; sessions_count += 1"

      - from: DISPUTED
        to: CONSULTING
        trigger: "POST /title-i/equitable-services-consultations/{id}/record-session (resume loop)"
        actor: ComplianceAnalyst
        preconditions:
          - "status in {INITIATED, CONSULTING, DISPUTED} (ERR_CONSULTATION_INVALID_STATE)"
          - "session_date <= current clock date (ERR_SESSION_DATE_IN_FUTURE)"
        side_effects:
          - "append session; sessions_count += 1"

      - from: CONSULTING
        to: AFFIRMATION_SIGNED
        trigger: "POST /title-i/equitable-services-consultations/{id}/sign-affirmation"
        actor: PrivateSchoolOmbudsman
        preconditions:
          - "status == CONSULTING (ERR_CONSULTATION_INVALID_STATE)"
          - "sessions_count >= 2 (ERR_INSUFFICIENT_CONSULTATION_SESSIONS)"
          - "grant.status in {SETUP, RANKING_LOCKED} (ERR_GRANT_INVALID_STATE) — affirmations lock before allocation"
        side_effects:
          - "record agreed_low_income_count, affirmation_signed_at, affirmation_signer_id"

      - from: CONSULTING
        to: DISPUTED
        trigger: "POST /title-i/equitable-services-consultations/{id}/dispute"
        actor: PrivateSchoolOmbudsman
        preconditions:
          - "status == CONSULTING (ERR_CONSULTATION_INVALID_STATE)"
        side_effects:
          - "record dispute_reason"

      - from: DISPUTED
        to: COMPLAINT_FILED
        trigger: "POST /title-i/equitable-services-consultations/{id}/file-complaint"
        actor: PrivateSchoolOmbudsman
        preconditions:
          - "status == DISPUTED (ERR_CONSULTATION_INVALID_STATE)"
        side_effects: []

      - from: COMPLAINT_FILED
        to: CONSULTING
        trigger: "POST /title-i/equitable-services-consultations/{id}/resolve-complaint"
        actor: SEAMonitor
        preconditions:
          - "status == COMPLAINT_FILED (ERR_CONSULTATION_INVALID_STATE)"
        side_effects:
          - "record complaint_determination"

  - entity: Expenditure
    initial_state: PENDING_REVIEW
    terminal_states: [ALLOWED, RECLASSIFIED]
    transitions:
      - from: PENDING_REVIEW
        to: ALLOWED
        trigger: "POST /title-i/expenditures/{id}/review with decision=ALLOW"
        actor: FederalProgramsDirector
        preconditions:
          - "status == PENDING_REVIEW (ERR_EXPENDITURE_NOT_REVIEWABLE)"
          - "reviewer X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "grant.status == ALLOCATED (ERR_GRANT_INVALID_STATE)"
        side_effects:
          - "grant.liquidated_cents and target liquidated_cents recomputed (ledger_aggregation); grant.version += 1"

      - from: PENDING_REVIEW
        to: DISALLOWED
        trigger: "POST /title-i/expenditures/{id}/review with decision=DISALLOW"
        actor: FederalProgramsDirector
        preconditions:
          - "status == PENDING_REVIEW (ERR_EXPENDITURE_NOT_REVIEWABLE)"
          - "reviewer X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "disallow_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "pending balances recomputed; grant.version += 1"

      - from: PENDING_REVIEW
        to: DISALLOWED
        trigger: "system (snapshot recertification cascade, link D — SNS_STALE_CASCADE)"
        actor: system
        preconditions:
          - "supplant_screen == true and charged allocation left CERTIFIED via cascade"
        side_effects:
          - "disallow_reason := SNS_STALE_CASCADE; pending balances recomputed"

      - from: DISALLOWED
        to: RECLASSIFIED
        trigger: "POST /title-i/expenditures/{id}/reclassify"
        actor: ComplianceAnalyst
        preconditions:
          - "status == DISALLOWED (ERR_EXPENDITURE_NOT_RECLASSIFIABLE)"
        side_effects:
          - "record reclassified_to_fund_source; compensating bookkeeping — grant.liquidated_cents unchanged (already excluded at disallow)"

  - entity: BudgetAmendment
    initial_state: DRAFT
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /title-i/budget-amendments/{id}/submit"
        actor: ComplianceAnalyst | FederalProgramsDirector
        preconditions:
          - "status == DRAFT (ERR_AMENDMENT_INVALID_STATE)"
        side_effects:
          - "submitted_by_user_id := X-User-ID"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /title-i/budget-amendments/{id}/approve"
        actor: FederalProgramsDirector
        preconditions:
          - "status == SUBMITTED (ERR_AMENDMENT_INVALID_STATE)"
          - "decider X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "grant.status == ALLOCATED (ERR_GRANT_INVALID_STATE)"
          - "every line's new_amount_cents still satisfies its floor: set-aside >= minimum_cents (ERR_SET_ASIDE_BELOW_MINIMUM); allocation >= liquidated_cents + pending_cents on that allocation (ERR_AMENDMENT_BELOW_LIQUIDATED); set-aside >= liquidated_cents on that set-aside (ERR_AMENDMENT_BELOW_LIQUIDATED)"
        side_effects:
          - "capture prior_amounts; write each line's new_amount_cents onto its target (allocation_amount_cents or reserved_cents); recompute school_distributed_minimum_cents for PARENT_ENGAGEMENT if touched"
          - "grant.version += 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /title-i/budget-amendments/{id}/reject"
        actor: FederalProgramsDirector
        preconditions:
          - "status == SUBMITTED (ERR_AMENDMENT_INVALID_STATE)"
          - "decider X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "decision_note present (ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_by_user_id := X-User-ID"

      - from: APPROVED
        to: VOIDED
        trigger: "POST /title-i/budget-amendments/{id}/void"
        actor: FederalProgramsDirector
        preconditions:
          - "status == APPROVED (ERR_AMENDMENT_INVALID_STATE)"
          - "decider X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "grant.status == ALLOCATED (ERR_GRANT_INVALID_STATE)"
        side_effects:
          - "restore prior_amounts verbatim onto targets (compensating action: money-conservation invariant); recompute school_distributed_minimum_cents if PARENT_ENGAGEMENT touched"
          - "grant.version += 1"

  - entity: MonitoringVisit
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /title-i/monitoring-visits/{id}/start"
        actor: SEAMonitor
        preconditions:
          - "status == SCHEDULED (ERR_VISIT_INVALID_STATE)"
          - "visit_start_date <= current clock date <= visit_end_date (ERR_VISIT_WINDOW_MISSED)"
        side_effects: []

      - from: IN_PROGRESS
        to: REPORT_ISSUED
        trigger: "POST /title-i/monitoring-visits/{id}/issue-report"
        actor: SEAMonitor
        preconditions:
          - "status == IN_PROGRESS (ERR_VISIT_INVALID_STATE)"
        side_effects:
          - "stamp report_issued_at"
          - "if the visit has zero findings, the visit immediately auto-transitions REPORT_ISSUED -> CLOSED and grant.monitoring_clearance is recomputed (empty-set closure)"

      - from: REPORT_ISSUED
        to: CLOSED
        trigger: "system (bubble-up: fires the moment the last non-terminal finding of this visit reaches VERIFIED or CLOSED_NO_ACTION)"
        actor: system
        preconditions:
          - "every MonitoringFinding of this visit has status in {VERIFIED, CLOSED_NO_ACTION}"
        side_effects:
          - "grant.monitoring_clearance recomputed (CLEARED when no non-terminal findings remain on any visit of the grant); grant.version += 1"

  - entity: MonitoringFinding
    initial_state: OPEN
    terminal_states: [VERIFIED, CLOSED_NO_ACTION]
    transitions:
      - from: OPEN
        to: CAP_SUBMITTED
        trigger: "POST /title-i/monitoring-findings/{id}/submit-cap"
        actor: ComplianceAnalyst | FederalProgramsDirector
        preconditions:
          - "status in {OPEN, ESCALATED, CAP_RETURNED} (ERR_FINDING_INVALID_STATE)"
          - "cap_narrative >= 50 characters (ERR_NARRATIVE_TOO_SHORT)"
        side_effects:
          - "cap_submitted_by_user_id := X-User-ID; cap_attempt_count += 1"

      - from: ESCALATED
        to: CAP_SUBMITTED
        trigger: "POST /title-i/monitoring-findings/{id}/submit-cap"
        actor: ComplianceAnalyst | FederalProgramsDirector
        preconditions:
          - "status in {OPEN, ESCALATED, CAP_RETURNED} (ERR_FINDING_INVALID_STATE)"
          - "cap_narrative >= 50 characters (ERR_NARRATIVE_TOO_SHORT)"
        side_effects:
          - "cap_submitted_by_user_id := X-User-ID; cap_attempt_count += 1"

      - from: CAP_RETURNED
        to: CAP_SUBMITTED
        trigger: "POST /title-i/monitoring-findings/{id}/submit-cap (revision cycle)"
        actor: ComplianceAnalyst | FederalProgramsDirector
        preconditions:
          - "status in {OPEN, ESCALATED, CAP_RETURNED} (ERR_FINDING_INVALID_STATE)"
          - "cap_narrative >= 50 characters (ERR_NARRATIVE_TOO_SHORT)"
        side_effects:
          - "cap_submitted_by_user_id := X-User-ID; cap_attempt_count += 1"

      - from: CAP_SUBMITTED
        to: VERIFIED
        trigger: "POST /title-i/monitoring-findings/{id}/accept-cap"
        actor: SEAMonitor
        preconditions:
          - "status == CAP_SUBMITTED (ERR_FINDING_INVALID_STATE)"
          - "decider X-User-ID != cap_submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "link B (depth 1 of bubble-up): decided_by_user_id := X-User-ID"
          - "link C (depth 2): when this was the visit's last non-terminal finding, the visit auto-transitions REPORT_ISSUED -> CLOSED"
          - "link D (depth 3): grant.monitoring_clearance recomputed; grant.version += 1"

      - from: CAP_SUBMITTED
        to: CAP_RETURNED
        trigger: "POST /title-i/monitoring-findings/{id}/return-cap"
        actor: SEAMonitor
        preconditions:
          - "status == CAP_SUBMITTED (ERR_FINDING_INVALID_STATE)"
          - "decider X-User-ID != cap_submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "return_note present (ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_by_user_id := X-User-ID"

      - from: OPEN
        to: CLOSED_NO_ACTION
        trigger: "POST /title-i/monitoring-findings/{id}/close-no-action"
        actor: SEAMonitor
        preconditions:
          - "status == OPEN (ERR_FINDING_INVALID_STATE)"
          - "severity == OBSERVATION (ERR_FINDING_INVALID_STATE)"
        side_effects:
          - "bubble-up check identical to accept-cap links C and D"

      - from: OPEN
        to: ESCALATED
        trigger: "system (clock sweep: POST /title-i/_clock/set_current_utc flips every finding with cap_due_date < new current date and status in {OPEN, CAP_RETURNED})"
        actor: system
        preconditions: []
        side_effects: []

      - from: CAP_RETURNED
        to: ESCALATED
        trigger: "system (clock sweep, as above)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on DistrictGrant.version)
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-grant
    parent_entity: DistrictGrant
    write_endpoint: "POST /title-i/budget-amendments"
    occ_field: expected_grant_version
    description: |
      Creating a BudgetAmendment pins the grant's allocation baseline as the
      client last observed it; because amendment lines are absolute post-values,
      a creation carrying an expected_grant_version that no longer matches the
      grant's current version is rejected as stale. A prior writer's successful
      amendment create/approve/void (or a snapshot certification) advanced the
      grant version, so the current writer's baseline is provably out of date.
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412
  - rule_id: snapshot-certify-stale-grant
    parent_entity: DistrictGrant
    write_endpoint: "POST /title-i/poverty-snapshots/{id}/certify"
    occ_field: expected_grant_version
    description: |
      Certifying a PovertyDataSnapshot supersedes the grant's current certified
      snapshot and re-baselines every SchoolAllocation; a certification request
      carrying an expected_grant_version that no longer matches the grant's
      current version is rejected as stale because a prior certification or
      amendment has already advanced the baseline the client observed.
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: school_ranking
    trigger: "lock-rankings; snapshot recertification (in-place recompute)"
    algorithm: threshold
    formula: |
      For each snapshot entry (school s):
        poverty_pct_bp(s) = round_half_up(low_income_student_count(s) * 10000 / total_student_count(s))
      Rank all schools in the snapshot by:
        1. poverty_pct_bp DESC
        2. tie-break: low_income_student_count DESC
        3. final tie-break: School.created_at ASC (UUID id is NEVER used)
      rank_position is 1-based in that order.
      Thresholds (>= semantics, evaluated on the rounded bp value):
        pct >= 7500 bp -> eligibility_flag = MUST_SERVE
        3500 <= pct < 7500 -> ELIGIBLE
        pct < 3500 -> BELOW_THRESHOLD
        pct >= 4000 bp -> program_model = SCHOOLWIDE else TARGETED_ASSISTANCE
    input_set: "entries of the CERTIFIED snapshot for the grant; all schools with is_active == true exactly once"
    precision: "integer basis points, round_half_up at the division"
    constants:
      MUST_SERVE_BP: 7500
      ELIGIBLE_BP: 3500
      SCHOOLWIDE_BP: 4000

  - name: set_aside_minimums
    trigger: "finalize-allocations; snapshot recertification while ALLOCATED"
    algorithm: tiered_pricing
    formula: |
      net = grant.net_allocable_cents                      # total + carryover_in - admin_reserve
      PARENT_ENGAGEMENT.min   = (grant.total_allocation_cents > PE_THRESHOLD_CENTS)
                                ? round_half_up(PE_RATE * grant.total_allocation_cents) : 0
      HOMELESS_SERVICES.min   = max(HOMELESS_FLOOR_CENTS, round_half_up(HOMELESS_RATE * net))
      PROFESSIONAL_DEVELOPMENT.min = round_half_up(PD_RATE * net)
      Non-linear interaction: three independent inputs (total, carryover_in, admin_reserve)
      feed net; PE branches on total only; HOMELESS takes a nested max of floor vs rate-of-net.
    input_set: "the DistrictGrant row"
    precision: "integer cents, round_half_up"
    constants:
      PE_THRESHOLD_CENTS: 50000000     # $500,000.00 — strictly greater than
      PE_RATE: 0.01
      HOMELESS_FLOOR_CENTS: 500000     # $5,000.00
      HOMELESS_RATE: 0.005
      PD_RATE: 0.05

  - name: equitable_services_share
    trigger: "finalize-allocations; snapshot recertification while ALLOCATED"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is PINNED (breaks the circular dependency between the
      equitable share and the school pool):
        1. non-equitable set-aside minimums (set_aside_minimums) -> P = net_allocable_cents
           - PE.min - HOMELESS.min - PD.min
        2. LIp = variant-dependent private-school low-income count (below)
        3. LIpub = sum of low_income_student_count over SERVED SchoolAllocation rows
        4. EQUITABLE_SERVICES.min = round_half_up(P * LIp / (LIpub + LIp)); if LIp == 0 -> 0
        5. school_pool = P - EQUITABLE_SERVICES.min
      i.e. the equitable share is computed on P (net of non-equitable set-asides),
      NOT on net_allocable_cents directly, and NOT on the post-share school pool.
    input_set: "served SchoolAllocation rows; private-school counts per variant"
    precision: "integer cents, round_half_up"
    variants:
      - name: CONSULTATION_AGREED
        when: "grant.equitable_count_method == CONSULTATION_AGREED"
        difference: "LIp = sum of agreed_low_income_count over this grant's EquitableServicesConsultation rows with status == AFFIRMATION_SIGNED; unsigned consultations contribute 0"
      - name: VERIFIED_COUNT
        when: "grant.equitable_count_method == VERIFIED_COUNT"
        difference: "LIp = sum of low_income_resident_count over ALL PrivateSchool rows with nonprofit_verified == true (consultation status irrelevant)"

  - name: school_allocation_waterfall
    trigger: "finalize-allocations; snapshot recertification while ALLOCATED"
    algorithm: waterfall_allocation
    formula: |
      Served set S = allocations with eligibility_flag != BELOW_THRESHOLD, plus
      BELOW_THRESHOLD allocations whose ids were passed in finalize's
      serve_below_threshold_school_ids (those get serve_elected = true).
      Weight w(s): pct >= 7500 bp -> 150 ; 4000..7499 -> 125 ; 3500..3999 -> 100 ;
                   serve_elected (< 3500) -> 125   # the 125% rule; it overrides
                   # non-increasing order WITHIN the elected band only
      raw(s) = w(s) * low_income_student_count(s)
      unit   = school_pool_cents / sum(raw)        # exact rational
      ROUNDING ORDER IS PINNED (per-school first, then reconcile):
        per_pupil_cents(s)   = round_half_up(unit * w(s))          # round per school
        allocation_cents(s)  = per_pupil_cents(s) * li(s)          # exact integer
        R = school_pool_cents - sum(allocation_cents)              # may be negative
        if R > 0: add 1 cent at a time cycling allocations in rank_position ASC order
        if R < 0: subtract 1 cent at a time cycling in rank_position DESC order
      Unserved allocations keep per_pupil_cents = 0, allocation_amount_cents = 0.
    input_set: "SchoolAllocation rows of the grant; school_pool from equitable_services_share step 5"
    precision: "integer cents; round_half_up per school BEFORE remainder reconciliation"
    constants:
      TIER_MUST_SERVE_WEIGHT: 150
      TIER_SCHOOLWIDE_WEIGHT: 125
      TIER_TARGETED_WEIGHT: 100
      TIER_ELECTED_WEIGHT: 125

  - name: pe_school_distribution_minimum
    trigger: "finalize-allocations; every set-aside adjust; amendment approve/void touching PARENT_ENGAGEMENT"
    algorithm: aggregation
    formula: |
      For the PARENT_ENGAGEMENT set-aside:
        school_distributed_minimum_cents = round_half_up(0.90 * reserved_cents)
      All other categories: school_distributed_minimum_cents = 0.
      Recomputed whenever reserved_cents changes (including amendment approve and void).
    input_set: "the PARENT_ENGAGEMENT SetAside row of the grant"
    precision: "integer cents, round_half_up"
    constants:
      PE_SCHOOL_SHARE: 0.90

  - name: carryover_computation
    trigger: "provisional: recomputed on every expenditure create/review/reclassify and amendment approve/void; final: stamped at close-out"
    algorithm: forward_looking
    formula: |
      PROVISIONAL (forward-looking, pre-close-out):
        provisional_carryover_cents = net_allocable_cents - liquidated_cents - pending_cents
        (PENDING_REVIEW expenditures count as encumbered at face value)
      FINAL (chronological, at close-out):
        final_carryover_cents = net_allocable_cents - liquidated_cents
        (only ALLOWED expenditures; DISALLOWED/RECLASSIFIED excluded; PENDING_REVIEW
         cannot exist at close-out because ERR_UNRESOLVED_EXPENDITURES blocks it)
      pct_bp = round_half_up(carryover_cents * 10000 / total_allocation_cents)
      NOTE the denominator is total_allocation_cents, NOT net_allocable_cents.
      The 15% limit is evaluated on the ROUNDED basis-point value:
      pct_bp > 1500 requires a GRANTED waiver at close-out.
    input_set: "expenditures of the grant in the stated status sets"
    precision: "integer cents; integer basis points, round_half_up"
    constants:
      CARRYOVER_LIMIT_BP: 1500
    variants:
      - name: PROVISIONAL
        when: "any read of the grant before close-out"
        difference: "subtracts pending_cents as well as liquidated_cents"
      - name: FINAL
        when: "close-out"
        difference: "subtracts liquidated_cents only; stamped on the grant"

  - name: ledger_aggregation
    trigger: "expenditure review (allow/disallow), reclassify, amendment approve/void"
    algorithm: aggregation
    formula: |
      grant.liquidated_cents = sum(amount_cents) over expenditures of the grant with status == ALLOWED
      grant.pending_cents    = sum(amount_cents) over expenditures of the grant with status == PENDING_REVIEW
      allocation.liquidated_cents / pending_cents: same sums restricted to that allocation
      set_aside.liquidated_cents: same, restricted to that set-aside
      Recomputed eagerly inside the triggering request (immediate consistency).
    input_set: "expenditures filtered by grant and status in {ALLOWED} resp. {PENDING_REVIEW}"
    precision: "integer cents"

  - name: waiver_lookback
    trigger: "request-carryover-waiver"
    algorithm: threshold
    formula: |
      eligible iff NOT EXISTS DistrictGrant G' with
        G'.id != G.id AND G'.carryover_waiver_status == GRANTED
        AND G'.fiscal_year IN {G.fiscal_year - 3, G.fiscal_year - 2, G.fiscal_year - 1}
      (a GRANTED waiver blocks requests for the following three fiscal years;
       DENIED waivers never block; a GRANTED waiver's own year is the anchor)
    input_set: "all DistrictGrant rows"
    precision: "integer fiscal years"

  - name: monitoring_clearance
    trigger: "finding created; finding reaches terminal status; visit closes"
    algorithm: aggregation
    formula: |
      grant.monitoring_clearance =
        FINDINGS_OPEN  if any finding of any visit of the grant is in
                       {OPEN, ESCALATED, CAP_SUBMITTED, CAP_RETURNED}
        CLEARED        if the grant has at least one CLOSED visit and no such finding
        NOT_MONITORED  otherwise
    input_set: "MonitoringFinding rows joined through MonitoringVisit.grant_id"
    precision: "n/a (enum)"

  - name: snapshot_escalation_sweep
    trigger: "POST /title-i/_clock/set_current_utc"
    algorithm: chronological
    formula: |
      On every clock set to instant T (date D = date(T)):
        every MonitoringFinding with cap_due_date < D and status in {OPEN, CAP_RETURNED}
          -> ESCALATED (in created_at ASC order; updated_at refreshed)
      Findings in CAP_SUBMITTED, VERIFIED, CLOSED_NO_ACTION are never escalated.
    input_set: "MonitoringFinding rows with status in {OPEN, CAP_RETURNED}"
    precision: "date granularity"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every resource id in the path and every FK id in the body exists (validated left-to-right: path first, then body fields in declared order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "Request body schema: required fields present, types correct, enum membership, amount_cents > 0, no unknown or read-only fields supplied; date-range inversions yield ERR_INVALID_DATE_RANGE; sub-minimum narratives yield ERR_NARRATIVE_TOO_SHORT"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_DATE_RANGE | ERR_NARRATIVE_TOO_SHORT"
    http_status: 400
    applies_to: all
  - priority: 4.5
    category: existence
    check: "Body-level structural conflicts: duplicate fiscal_year on grant create; duplicate nces_id; duplicate school_id inside snapshot entries; second consultation for the same (grant_id, private_school_id)"
    error_id: "ERR_DUPLICATE_FISCAL_YEAR | ERR_INVALID_REQUEST | ERR_DUPLICATE_SCHOOL_ENTRY | ERR_DUPLICATE_CONSULTATION"
    http_status: 409
    applies_to: "POST grants, POST schools, POST poverty-snapshots, POST equitable-services-consultations"
  - priority: 5
    category: state
    check: "Target entity's state machine permits the requested transition (grant status gates, allocation PENDING/CERTIFIED, snapshot DRAFT, SNS/amendment/expenditure/visit/finding/waiver state preconditions)"
    error_id: "ERR_GRANT_INVALID_STATE | ERR_SNAPSHOT_NOT_CERTIFIABLE | ERR_ALLOCATION_NOT_PENDING | ERR_ALLOCATION_NOT_CERTIFIED | ERR_SNS_NOT_SUBMITTABLE | ERR_SNS_NOT_REVIEWABLE | ERR_CONSULTATION_INVALID_STATE | ERR_EXPENDITURE_NOT_REVIEWABLE | ERR_EXPENDITURE_NOT_RECLASSIFIABLE | ERR_AMENDMENT_INVALID_STATE | ERR_VISIT_INVALID_STATE | ERR_VISIT_NOT_ACCEPTING_FINDINGS | ERR_FINDING_INVALID_STATE | ERR_WAIVER_INVALID_STATE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5.5
    category: state
    check: "OCC: expected_grant_version equals the grant's current version (budget-amendment create, snapshot certify)"
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412
    applies_to: "POST budget-amendments, POST poverty-snapshots/{id}/certify"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: decider X-User-ID must differ from the resource's submitted_by_user_id / cap_submitted_by_user_id (amendment approve/reject/void, SNS review, expenditure review, finding accept/return)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "review/approve/reject/void/accept-cap/return-cap endpoints"
  - priority: 7
    category: business_safety
    check: "Supplement-not-supplant gate: expenditure with supplant_screen=true requires an ACCEPTED SupplementDocumentation for the charged school allocation; close-out blocked while any finding is non-terminal"
    error_id: "ERR_SUPPLANT_RISK_UNRESOLVED | ERR_OPEN_FINDINGS_BLOCK_CLOSEOUT"
    http_status: 403
    applies_to: "POST expenditures, POST grants/{id}/close-out"
  - priority: 8
    category: business_referential
    check: "Cross-entity consistency: snapshot entries cover exactly the active schools; consultation target school nonprofit_verified; finalize consultation completeness under CONSULTATION_AGREED; charge target belongs to the same grant; function_code matches target type/category; exactly one charge target"
    error_id: "ERR_SNAPSHOT_INCOMPLETE_COVERAGE | ERR_PRIVATE_SCHOOL_NOT_VERIFIED | ERR_CONSULTATION_INCOMPLETE | ERR_CHARGE_TARGET_AMBIGUOUS | ERR_FUNCTION_TARGET_MISMATCH | ERR_SCHOOL_LOCKED_BY_SNAPSHOT | ERR_NOT_FOUND"
    http_status: 422
    applies_to: "POST poverty-snapshots(+certify), POST equitable-services-consultations, POST grants/{id}/finalize-allocations, POST expenditures, PATCH schools/{id}"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: incurred_date inside the funds period; session_date not after current clock date; visit start within [visit_start_date, visit_end_date] by clock; monitoring visits of one grant must not overlap as CLOSED day intervals (shared boundary day = overlap); SNS coverage windows of one allocation must not overlap as HALF-OPEN intervals [start, end) (touching endpoints allowed); cap_due_date strictly after visit_end_date"
    error_id: "ERR_COST_OUTSIDE_FISCAL_PERIOD | ERR_SESSION_DATE_IN_FUTURE | ERR_VISIT_WINDOW_MISSED | ERR_MONITORING_VISIT_OVERLAP | ERR_SNS_WINDOW_OVERLAP | ERR_INVALID_DATE_RANGE"
    http_status: 409
    applies_to: "POST expenditures, record-session, POST/start monitoring-visits, POST supplement-documentation, POST monitoring-findings"
  - priority: 10
    category: business_fiscal
    check: "Money rules: set-aside reserved never below minimum_cents; amendment lines net-zero against current values; post-amendment floors (allocation >= liquidated + pending, set-aside >= liquidated); charge amount <= target remaining balance (allocation/reserved minus ALLOWED minus PENDING_REVIEW); waiver only when provisional pct > 1500 bp and no GRANTED waiver in the prior 3 fiscal years; close-out carryover pct <= 1500 bp unless waiver GRANTED"
    error_id: "ERR_SET_ASIDE_BELOW_MINIMUM | ERR_AMENDMENT_NOT_NET_ZERO | ERR_AMENDMENT_BELOW_LIQUIDATED | ERR_INSUFFICIENT_ALLOCATION_BALANCE | ERR_CARRYOVER_WITHIN_LIMIT | ERR_CARRYOVER_WAIVER_WITHIN_3_YEARS | ERR_CARRYOVER_LIMIT_EXCEEDED | ERR_UNRESOLVED_EXPENDITURES | ERR_UNRESOLVED_AMENDMENTS"
    http_status: 422
    applies_to: "set-aside adjust, amendment create/approve, expenditure create, waiver request, close-out"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- DistrictGrant ---
  - method: POST
    path: "/title-i/grants"
    description: "Create a district Title I grant for a fiscal year"
    roles: [FederalProgramsDirector]
    code: 201
    input: [fiscal_year, total_allocation_cents, poverty_measure, "carryover_in_cents?", "admin_reserve_cents?", "equitable_count_method?"]
    output: DistrictGrant
    side_effects: ["status SETUP; carryover_waiver_status NONE; net_allocable_cents computed"]
  - method: GET
    path: "/title-i/grants"
    description: "List grants"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
    code: 200
    input: ["fiscal_year?", "status?", "limit?", "offset?"]
    output: "DistrictGrant[]"
    side_effects: []
  - method: GET
    path: "/title-i/grants/{id}"
    description: "Get one grant (all computed ledger/carryover fields)"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
    code: 200
    input: []
    output: DistrictGrant
    side_effects: []
  - method: POST
    path: "/title-i/grants/{id}/lock-rankings"
    description: "Lock rankings from the certified snapshot; creates SchoolAllocation rows"
    roles: [FederalProgramsDirector]
    code: 200
    input: []
    output: DistrictGrant
    side_effects: ["grant SETUP->RANKING_LOCKED; SchoolAllocation rows created; ranking_version += 1; version += 1"]
  - method: POST
    path: "/title-i/grants/{id}/finalize-allocations"
    description: "Compute set-asides, equitable share, and the school allocation waterfall"
    roles: [FederalProgramsDirector]
    code: 200
    input: ["serve_below_threshold_school_ids?"]
    output: DistrictGrant
    side_effects: ["grant RANKING_LOCKED->ALLOCATED; 4 SetAside rows created; allocation amounts filled; version += 1"]
  - method: POST
    path: "/title-i/grants/{id}/close-out"
    description: "Close the fiscal year; stamps final carryover; enforces the 15% carryover limit / waiver"
    roles: [FederalProgramsDirector]
    code: 200
    input: []
    output: DistrictGrant
    side_effects: ["grant ALLOCATED->CLOSED_OUT; final_carryover_cents and final_carryover_pct_bp stamped; version += 1"]
  - method: POST
    path: "/title-i/grants/{id}/request-carryover-waiver"
    description: "Request an SEA carryover waiver (carryover_waiver_status NONE|DENIED -> REQUESTED)"
    roles: [FederalProgramsDirector]
    code: 200
    input: [justification]
    output: DistrictGrant
    side_effects: ["carryover_waiver_status -> REQUESTED; justification recorded; version += 1"]
  - method: POST
    path: "/title-i/grants/{id}/decide-carryover-waiver"
    description: "SEA grants or denies a requested carryover waiver"
    roles: [SEAMonitor]
    code: 200
    input: [decision, "decision_note?"]
    output: DistrictGrant
    side_effects: ["carryover_waiver_status -> GRANTED|DENIED; decided_at stamped; version += 1"]

  # --- School / PrivateSchool ---
  - method: POST
    path: "/title-i/schools"
    description: "Register a public school"
    roles: [ComplianceAnalyst]
    code: 201
    input: [name, nces_id, grade_span_low, grade_span_high, "is_active?"]
    output: School
    side_effects: []
  - method: GET
    path: "/title-i/schools"
    description: "List schools"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
    code: 200
    input: ["is_active?", "limit?", "offset?"]
    output: "School[]"
    side_effects: []
  - method: PATCH
    path: "/title-i/schools/{id}"
    description: "Update school flags (is_active); a school already covered by a certified snapshot cannot be deactivated"
    roles: [ComplianceAnalyst]
    code: 200
    input: ["is_active?"]
    output: School
    side_effects: ["ERR_SCHOOL_LOCKED_BY_SNAPSHOT when deactivating a school present in any CERTIFIED snapshot"]
  - method: POST
    path: "/title-i/private-schools"
    description: "Register a participating private school"
    roles: [ComplianceAnalyst]
    code: 201
    input: [name, low_income_resident_count, contact_email, "nonprofit_verified?"]
    output: PrivateSchool
    side_effects: []
  - method: GET
    path: "/title-i/private-schools"
    description: "List private schools"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
    code: 200
    input: ["nonprofit_verified?", "limit?", "offset?"]
    output: "PrivateSchool[]"
    side_effects: []

  # --- PovertyDataSnapshot ---
  - method: POST
    path: "/title-i/poverty-snapshots"
    description: "Create a poverty data snapshot (DRAFT) for a grant"
    roles: [ComplianceAnalyst]
    code: 201
    input: [grant_id, measure, entries]
    output: PovertyDataSnapshot
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/title-i/poverty-snapshots"
    description: "List snapshots (FK reverse lookup from DistrictGrant)"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
    code: 200
    input: ["grant_id?", "status?", "limit?", "offset?"]
    output: "PovertyDataSnapshot[]"
    side_effects: []
  - method: GET
    path: "/title-i/poverty-snapshots/{id}"
    description: "Get one snapshot"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
    code: 200
    input: []
    output: PovertyDataSnapshot
    side_effects: []
  - method: POST
    path: "/title-i/poverty-snapshots/{id}/certify"
    description: "Certify a snapshot; supersedes the prior certified snapshot; re-baselines allocations when the grant is RANKING_LOCKED or ALLOCATED (OCC on grant version)"
    roles: [FederalProgramsDirector]
    code: 200
    input: [expected_grant_version]
    output: PovertyDataSnapshot
    side_effects: ["snapshot DRAFT->CERTIFIED; prior CERTIFIED -> SUPERSEDED; allocation recompute cascade (links B,C,D); grant.ranking_version += 1; increments DistrictGrant.version by 1"]

  # --- SchoolAllocation ---
  - method: GET
