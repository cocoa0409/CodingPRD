            - "FederalGrant.${g3_id}.committed_match_cents == 0 and match_status == UNMET"
            - "Agency.${ag_id}.federal_compliance_flag == CLEAR, because UNMET is neither SHORTFALL nor AT_RISK"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: recall_restores_released_cash_conservation_across_all_three_ledger_terms
        grounds:
          - invariants.released_authority_conservation
          - state_machines.Allotment.RELEASED_to_RECALLED
          - entities.BudgetCycle.fields.total_released_cents
          - entities.Appropriation.fields.released_cents
          - validations[priority=11]
        distinguishing_aspect: |
          The compensating action is allotment recall and the conserved quantity is released
          cash, checked simultaneously at all three levels of the released_authority_conservation
          invariant (Allotment.released_cents, Appropriation.released_cents,
          BudgetCycle.total_released_cents), including the derived cash_status and
          cash_posture that were moved by the release; a second recall is refused with
          ERR_INVALID_STATE so the compensation cannot be double-applied.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 driven to phase EXECUTION with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 enacted 2000000000, nothing released yet"
            - "One Allotment on P100 quarter 1 requesting 400000000 cents, prepared by analyst-1 and approved by director-1"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 1, requested_cents: 400000000, allow_partial: false }
              as: BudgetAnalyst
              captures: { allot_id: $.data.id }
            - call: "POST /fiscal/allotments/${allot_id}/prepare"
              payload: {}
              as: BudgetAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fiscal/allotments/${allot_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "director-1"
          trigger:
            - call: "POST /fiscal/allotments/${allot_id}/release"
              payload: {}
              as: StateController
            - call: "POST /fiscal/allotments/${allot_id}/recall"
              payload: { reason: "cash forecast deteriorated" }
              as: StateController
            - call: "POST /fiscal/allotments/${allot_id}/recall"
              payload: { reason: "duplicate recall attempt" }
              as: StateController
          assert:
            - "after the release: Allotment.${allot_id}.status == RELEASED and released_cents == 400000000"
            - "after the release: Appropriation.${appr_id}.released_cents == 400000000 and cash_status == PARTIALLY_RELEASED"
            - "after the release: BudgetCycle.${cyc_id}.total_released_cents == 400000000"
            - "after the recall: Allotment.${allot_id}.status == RECALLED and released_cents == 0"
            - "after the recall: Appropriation.${appr_id}.released_cents == 0 and cash_status == UNRELEASED"
            - "after the recall: BudgetCycle.${cyc_id}.total_released_cents == 0 and cash_posture == NORMAL"
            - "after the recall: GET /fiscal/appropriations/${appr_id}/balance-summary reports available_cash_cents == 0 and available_authority_cents == 2000000000, identical to the pre-release reading"
            - "the second POST /fiscal/allotments/${allot_id}/recall returns HTTP 409 with error_id == ERR_INVALID_STATE and leaves every term at 0"

      - name: reverse_restores_cycle_authority_conservation_after_an_executed_transfer
        grounds:
          - invariants.transfer_authority_conservation
          - state_machines.BudgetTransfer.EXECUTED_to_REVERSED
          - entities.Appropriation.fields.transfers_in_cents
          - entities.Appropriation.fields.transfers_out_cents
          - calculations.appropriation_available_balance
          - concurrency_rules.transfer-propose-stale-source
        distinguishing_aspect: |
          A different compensating action (transfer reverse) over a different conserved
          quantity (cycle-wide spending authority, which the transfer redistributes rather
          than creates): the pair sum stays 2000000000 both before and after reversal while
          the individual authority-basis balances move 1000000000/1000000000 ->
          900000000/1100000000 -> 1000000000/1000000000, and transfers_in_cents and
          transfers_out_cents both return to 0 rather than being left as offsetting
          non-zero history.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 driven to phase EXECUTION with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "Two GENERAL Appropriations of the same agency, P100 (source) and P200 (target), each enacted 1000000000, so the 0.10 transfer-authority cap on the source is exactly 100000000"
            - "One BudgetTransfer of 100000000 cents proposed INTRA_AGENCY by analyst-1 and approved by director-1"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
