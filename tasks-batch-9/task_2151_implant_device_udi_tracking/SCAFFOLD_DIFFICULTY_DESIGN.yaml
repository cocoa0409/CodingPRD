            - "Before the post, SurgicalCase.${case_id}.total_posted_charge_cents == 0"
            - "After the post, SurgicalCase.${case_id}.total_posted_charge_cents == 792000 and readiness_status == BLOCKED_CHARGE"
            - "After the void, SurgicalCase.${case_id}.total_posted_charge_cents == 0 and readiness_status == READY"
            - "ChargeCapture.${ch_id}.status == VOIDED"
            - "ChargeCapture.${ch_id}.final_charge_cents == null and variance_cents == null"
