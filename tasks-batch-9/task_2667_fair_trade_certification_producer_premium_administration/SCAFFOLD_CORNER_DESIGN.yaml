  # ===================================================================
  - section: calculations
    instances:
      - name: license_fee_straddles_all_three_marginal_tiers_at_600000_kg
        claim_type: correct_result
        grounds:
          - calculations.label_license_fee
          - endpoints.POST_/fairtrade/certificate-holders/{id}/label-license
          - endpoints.POST_/fairtrade/certificate-holders/{id}/label-license/payments
        distinguishing_aspect: "A 600000 kg licence fills all three marginal bands (100000 @ 1.2, 400000 @ 0.8, 100000 @ 0.45) for a volume fee of 485000, a 735000 subtotal and a 25725 surcharge, giving license_fee_cents 760725 and license_tier TIER_3 — not the 720000 an average-rate reading would produce."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one CERTIFIED BRAND holder with no licence yet"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
          trigger:
            - call: "POST /fairtrade/certificate-holders/${brand_id}/label-license"
              payload: { license_year: 2026, licensed_volume_kg: 600000 }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders/${brand_id}/label-license/payments"
              payload: { amount_cents: 760724 }
              as: BrandLicensee
              as_user_id: "${brand_id}"
            - call: "POST /fairtrade/certificate-holders/${brand_id}/label-license/payments"
              payload: { amount_cents: 1 }
              as: BrandLicensee
              as_user_id: "${brand_id}"
          assert:
            - "after the licence call CertificateHolder.${brand_id}.license_fee_cents == 760725"
            - "CertificateHolder.${brand_id}.license_tier == TIER_3 and label_license_status == ACTIVE and license_year == 2026"
            - "CertificateHolder.${brand_id}.licensed_volume_kg == 600000 and license_fee_paid_cents == 0 immediately after the licence call"
            - "after the 760724 payment license_fee_paid_cents == 760724 and license_fee_settled == false, because settlement uses >= against 760725"
            - "after the further 1 cent payment license_fee_paid_cents == 760725 and license_fee_settled == true"

      - name: compliance_score_excludes_closed_findings_and_observation_grade
        claim_type: input_set_filtering
        grounds:
          - calculations.holder_compliance_score_and_deadline
          - endpoints.POST_/fairtrade/audits/{id}/nonconformities
        distinguishing_aspect: "The open_filter drops CLOSED findings and OBSERVATION carries weight 0, so after a MAJOR finding is closed the next finding is scored against 100 (multiplier 1.5, grace 14) and the holder's compliance_score stays 100 even with an open OBSERVATION on the books."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED producer with an IN_PROGRESS audit run by auditor-1 over 2026-08-01..2026-08-08"
            - "one MAJOR finding already raised, corrected and CLOSED by officer-1"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/audits"
              payload: { holder_id: "${prod_id}", auditor_user_id: "auditor-1", audit_type: "INITIAL", window_start: "2026-08-01", window_end: "2026-08-08" }
              as: CertificationOfficer
              captures: { audit_id: $.data.id }
            - call: "POST /fairtrade/audits/${audit_id}/start"
              payload: {}
              as: Auditor
              as_user_id: "auditor-1"
            - call: "POST /fairtrade/audits/${audit_id}/nonconformities"
              payload: { clause_code: "4.2.1", grade: "MAJOR", description: "Wage records incomplete" }
              as: Auditor
              as_user_id: "auditor-1"
              captures: { nc1_id: $.data.id }
            - call: "POST /fairtrade/nonconformities/${nc1_id}/cap-submissions"
              payload: { narrative: "Records reconstructed and archived" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
            - call: "POST /fairtrade/nonconformities/${nc1_id}/cap-review"
              payload: { decision: "ACCEPT", review_note: "Evidence sufficient" }
              as: CertificationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /fairtrade/audits/${audit_id}/nonconformities"
              payload: { clause_code: "6.1.0", grade: "OBSERVATION", description: "Signage faded" }
              as: Auditor
              as_user_id: "auditor-1"
              captures: { nc2_id: $.data.id }
          assert:
            - "Nonconformity.${nc1_id}.deadline_at == 2026-09-15T00:00:00Z, from BASE_CAP_DAYS[MAJOR] 30 * multiplier 1.5 at score 100"
            - "Nonconformity.${nc1_id}.status == CLOSED with compliance_score_at_raise == 100 and escalation_grace_days == 14"
            - "Nonconformity.${nc2_id}.compliance_score_at_raise == 100, because the CLOSED MAJOR finding is outside the open_filter"
            - "Nonconformity.${nc2_id}.deadline_at == 2027-04-28T00:00:00Z, from BASE_CAP_DAYS[OBSERVATION] 180 * multiplier 1.5 = 270 days"
            - "Nonconformity.${nc2_id}.escalation_grace_days == 14 and status == OPEN"
            - "CertificateHolder.${prod_id}.compliance_score == 100 with open_critical_count == 0, open_major_count == 0 and open_minor_count == 0, since OBSERVATION carries SCORE_WEIGHT_OBSERVATION 0"
            - "Audit.${audit_id}.nonconformity_count == 2 and open_nonconformity_count == 1"
            - "CertificateHolder.${prod_id}.next_audit_due_at == null, because no audit of this holder is CLOSED so the cadence anchor is null"

