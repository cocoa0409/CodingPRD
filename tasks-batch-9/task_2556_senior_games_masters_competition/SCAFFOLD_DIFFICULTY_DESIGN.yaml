              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 2, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Frost", email: "ada.frost@example.com", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_a_id: $.data.id }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Bruno Vega", email: "bruno.vega@example.com", date_of_birth: "1963-07-18", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_b_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_a_id}", sport_event_id: "${ev_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_a_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_b_id}", sport_event_id: "${ev_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_b_id: $.data.id }
            - call: "POST /senior-games/athletes/${ath_a_id}/pay-fees"
