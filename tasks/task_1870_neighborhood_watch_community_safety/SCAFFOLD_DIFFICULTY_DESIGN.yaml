            - "p1 == PARTIAL and d1 == SENT (ack axis moves, distribution axis untouched)"
            - "p2 == MAJORITY (ack_count 2 >= floor(3/2)+1 == 2)"
            - "p3 == FULL and acks == 3 and d3 == SENT (dimensions remain independent)"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers, depths 3 and 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: member_suspend_cascades_captain_posture_alert_hold
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.WatchGroup.OPERATIONAL_to_DEGRADED
          - state_machines.Alert.QUEUED_to_SENT
        distinguishing_aspect: |
          Depth-3 chain from the suspend trigger: member suspend (link 1) revokes
          the member's ACTIVE captain assignment (link 2, caused by link 1), the
          vacancy forces WatchGroup posture OPERATIONAL -> DEGRADED (link 3,
          caused by link 2), and DEGRADED posture rejects a queued alert's send
          with ERR_POSTURE_GATED (link 4 observable through a distinct endpoint).
        test_recipe:
          setup:
            - "OPERATIONAL group, 1 REGISTERED block, 2 ACTIVE members; m1 is captain; a GROUP SAFETY_TIP alert is QUEUED with scheduled_send_at 2026-08-09T12:00:00Z; clock at that instant."
