  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: full_time_threshold_boundary_12_credits
        grounds:
          - calculations.enrollment_status_determination
          - errors[ERR_UNRESOLVED_ROWS]
        distinguishing_aspect: |
          Metric credit_hours at the exact UNDERGRAD full-time edge, reached via
          POST /enrollment-files row screening: 11.99 -> HALF_TIME, exactly
          12.0 -> FULL_TIME (>= semantics, not >).
        test_recipe:
          setup:
            - "Compliant institution, OPEN Fall 2026 period; file with two UNDERGRAD rows: 11.99 and 12.0 credits; certified at 2026-11-15"
          setup_api_calls:
