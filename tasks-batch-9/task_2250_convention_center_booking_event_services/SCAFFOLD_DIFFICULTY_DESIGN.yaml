  - rule_id: boundary_precision_check
    instances:
      - name: facility_fee_tier_boundary_at_exactly_five_million_subtotal_takes_mid_rate
        grounds:
          - calculations.facility_service_fee
          - endpoints[POST /convention-center/settlements/{id}/issue]
          - entities.EventSettlement.fields.facility_service_fee_cents
        distinguishing_aspect: |
          Boundary on line_subtotal_cents at the POST issue endpoint. FEE_TIER_1_CENTS is
          compared with strict less-than, so a subtotal of exactly 5000000 takes FEE_PCT_MID
          0.07 and yields 350000, not FEE_PCT_LOW 0.09 and 450000. An off-by-one in the
          comparison direction is worth 100000 cents on this single row.
        test_recipe:
          setup:
            - "Ballroom C has daily_base_rate_cents 1250000 and the CONSUMER_SHOW window has rental_discount_pct 0.0"
            - "the booking runs move-in 2027-06-09, show 2027-06-10 to 2027-06-12, move-out 2027-06-13, so billable_units is exactly 4 and contracted_rental_cents is exactly 5000000"
            - "deposit_required_cents is 1250000 and the client has paid 1300000"
            - "the booking is CLOSED at logical clock 2027-06-14T09:00:00Z and a CONTRACTED settlement carries a single RENTAL line of 5000000"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom C", space_class: "BALLROOM", rentable_sqft: 42000, daily_base_rate_cents: 1250000 }
