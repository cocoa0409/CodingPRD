          - entities.BrandPolicy.fields.embargo_end_at
          - errors[ERR_BRAND_EMBARGO_ACTIVE]
        distinguishing_aspect: >
          The embargo interval is closed at both ends and is compared against the whole listing
          window, not the current clock: a window starting exactly at embargo_end_at
          2026-08-10T00:00:00Z still intersects and is rejected, while a window starting one
          second later publishes.
        test_recipe:
          setup:
            - "BrandPolicy BPM (brand MERIDIAN) permits MARKETPLACE_RESALE and carries the embargo interval [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z]."
            - "Lot E carries BPM with an APPROVED manifest and two DRAFT listings whose windows start at the embargo end instant and one second after it."
