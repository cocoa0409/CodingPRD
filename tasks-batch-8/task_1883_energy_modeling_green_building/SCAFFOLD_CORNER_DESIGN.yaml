          assert: ["HTTP 409, captured err == ERR_DUPLICATE_CREDIT_ATTEMPT"]

      - name: re_add_dropped_credit_allowed
        claim_type: satisfaction_pass
        grounds: ["validations[priority=7]", "state_machines.CreditAttempt.SELECTED_to_DROPPED"]
        distinguishing_aspect: "DROPPED attempts are excluded from the uniqueness input set: re-adding the same credit_code after a drop succeeds."
