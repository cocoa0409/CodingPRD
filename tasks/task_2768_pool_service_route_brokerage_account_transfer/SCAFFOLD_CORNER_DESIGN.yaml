      - name: publish_without_accounts_or_listed_valuation_precondition_enforced
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=70]"
          - "errors.ERR_LISTING_NOT_PUBLISHABLE"
          - "endpoints[POST /route-listings/{id}/publish]"
          - "state_machines.RouteListing[DRAFT -> LISTED]"
        distinguishing_aspect: "Publication has two independent preconditions and both are proved on their own: listing PUB-A has neither accounts nor a valuation, listing PUB-B has an account but no LISTED_BASIS valuation, and only after the valuation is created does PUB-B publish -- so neither precondition is silently subsumed by the other."
