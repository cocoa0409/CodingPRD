              as: ServiceStandardsAdmin
              captures: { q_non: $.data.id }
          assert:
            - "CONTIGUOUS query (Saturday acceptance, 1 day): committed_delivery_date == \"2026-09-06\" — Sunday counts for PRIORITY in the contiguous variant"
            - "NON_CONTIGUOUS query (same inputs, extra 0): committed_delivery_date == \"2026-09-07\" — Sunday never counts in the non-contiguous variant even for PRIORITY"
            - "ServiceStandardQuery.${q_non}.variant_used == NON_CONTIGUOUS despite non_contiguous_extra_days == 0 (variant selection is region-driven, not extra-days-driven)"

