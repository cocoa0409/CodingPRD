  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_oop_accumulation_settle_then_void
        grounds:
          - state_machines.Estimate.ACCEPTED_to_SETTLED
          - state_machines.Estimate.SETTLED_to_VOID
          - entities.Patient.fields.oop_met_cents
          - entities.Patient.fields.deductible_met_cents
        distinguishing_aspect: "Conserved quantity #1 = Patient.oop_met_cents (a running accumulator): settling adds patient_responsibility_cents=122500 (oop_met 0->122500) and voiding the SETTLED estimate subtracts exactly the same amount (122500->0); the settle+void pair leaves oop_met_cents and deductible_met_cents unchanged from their pre-settlement values."
        test_recipe:
          setup:
            - "A GFE_INSURED estimate (allowed 200000) accepted with an appointment; complete the appointment to settle it (oop_met 122500, deductible_met 100000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500, in_network: true }
              as: PayerAnalyst
