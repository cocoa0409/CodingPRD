      - "Recompute Complaint.timeliness_score (qa_bonus input changed)"
      - "Append IntakeEvent(QA_PASSED | QA_FAILED)"
      - "increments QualityReview.version by 1"
      - "ERR_SOD_SELF_REVIEW when acting user == complaint.owner_user_id"
      - "ERR_REVIEW_NOT_OWNED when acting user != reviewer_user_id"

  - method: POST
    path: "/complaint-office/quality-reviews/{reviewId}/cancel"
    description: "OPEN -> CANCELLED"
    roles: [QAReviewer, ComplaintManager]
    code: 200
    input: []
    output: QualityReview
    side_effects: ["status -> CANCELLED", "increments QualityReview.version by 1", "ERR_REVIEW_NOT_OWNED for QAReviewer acting on another's review"]

