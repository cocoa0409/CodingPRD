            - "call 2 returns HTTP 403 with data.error_id == \"ERR_OWNERSHIP_VIOLATION\" — the identity resolves to SB-002 but the payload names NG-001"
            - "call 3 returns HTTP 403 with data.error_id == \"ERR_OWNERSHIP_VIOLATION\" — a site lead may not read another site's mentor"
