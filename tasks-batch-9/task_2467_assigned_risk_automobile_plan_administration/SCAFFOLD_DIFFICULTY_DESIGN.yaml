              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app2_id}/mvr-verification"
              payload: { verified_violations: [{ code: "SPEEDING_MAJOR", conviction_date: "2025-03-10T00:00:00Z" }] }
              as: ComplianceExaminer
              as_user_id: "EX-1"
            - call: "POST /plan/applications/${app2_id}/deposit"
