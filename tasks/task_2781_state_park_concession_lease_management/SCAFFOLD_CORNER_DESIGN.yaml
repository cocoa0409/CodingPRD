      - name: duplicate_and_panel_capacity_guards_are_distinct_from_the_status_guards
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_PROPOSAL]
          - errors[ERR_DUPLICATE_PANELIST_EVALUATION]
          - errors[ERR_PANEL_ALREADY_COMPLETE]
          - errors[ERR_EVALUATION_ALREADY_STARTED]
        distinguishing_aspect: "Four 409s that all look like \"you already did that\" but key off four different things: another live proposal by the same offeror on the same prospectus, another score sheet by the same panelist on the same proposal, the panel counter already at REQUIRED_PANELIST_COUNT, and the mere existence of a score sheet foreclosing a revision request. The panel-capacity guard sits at a higher rung than the per-panelist duplicate guard, so a third panelist arriving after the panel filled must hear ERR_PANEL_ALREADY_COMPLETE, not a duplicate complaint about a sheet they never filed."
