  - section: rbac
    instances:
      - name: ngb_admin_exclusive_writes_are_refused_to_every_other_role
        claim_type: role_exclusive_operations
        grounds:
          - roles[NgbAdmin].exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Chartering a club, publishing a course, registering an investigating body and voiding a
          screening order are NgbAdmin-only, and each is attempted by a different other role so
          that no single wrong-role rejection can stand in for the rest; the same void then
          succeeds for NgbAdmin and returns the escrow to its pre-order balance.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow 500000 and member m_ex, for whom one screening order was placed"
