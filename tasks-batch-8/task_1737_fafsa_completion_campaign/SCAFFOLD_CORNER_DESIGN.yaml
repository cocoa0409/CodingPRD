      - name: expert_assignment_requires_aid_expert_capability
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STAFF_LACKS_CAPABILITY]
        distinguishing_aspect: "assigned_role EXPERT with capabilities lacking AID_EXPERT is rejected at create; the same create with a capable profile succeeds."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; DRAFT event; staff with capabilities [EVENT_STAFF] only"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
