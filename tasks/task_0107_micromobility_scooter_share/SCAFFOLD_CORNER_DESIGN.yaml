              payload: { vehicle_type: "SCOOTER", qr_code: "QR-ER1", battery_pct: 100, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "er1@x.com", full_name: "ER1", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { rider_a_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "er2@x.com", full_name: "ER2", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { rider_b_id: $.data.id }
            - call: "POST /api/riders/${rider_a_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_a_id}"
            - call: "POST /api/riders/${rider_b_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_b_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_a_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_a_id}"
              captures: { trip_a_id: $.data.id }
          trigger:
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_b_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VEHICLE_NOT_AVAILABLE (409)"

  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_vehicle_version_on_task_create_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[task-create-stale-vehicle]", "errors[ERR_STALE_VEHICLE_VERSION]", "endpoints"]
        distinguishing_aspect: "After the vehicle's version advances (a first task create bumps it), a second create still carrying the pre-advance expected_vehicle_version is rejected with ERR_STALE_VEHICLE_VERSION (412)."
        test_recipe:
          setup: ["a vehicle observed at version v; a first task create against it advances version to v+1"]
          setup_api_calls:
            - call: "POST /api/zones"
              payload: { name: "Z27", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-OCC1", battery_pct: 50, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /api/rebalancing-tasks"
              payload: { vehicle_id: "${veh_id}", task_type: "MOVE", target_zone_id: "${zone_id}", window_start: "2026-07-21T10:00:00Z", window_end: "2026-07-21T11:00:00Z", expected_vehicle_version: "${veh_v}" }
              as: PlatformAdmin
              captures: { task1_id: $.data.id }
          trigger:
            - call: "POST /api/rebalancing-tasks"
              payload: { vehicle_id: "${veh_id}", task_type: "MOVE", target_zone_id: "${zone_id}", window_start: "2026-07-21T14:00:00Z", window_end: "2026-07-21T15:00:00Z", expected_vehicle_version: "${veh_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VEHICLE_VERSION (412): the first create bumped the vehicle to version ${veh_v}+1, so the second create's expected_vehicle_version ${veh_v} is stale"

      - name: occ_stale_rider_version_on_change_plan_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-switch-stale-rider]", "errors[ERR_STALE_RIDER_VERSION]", "endpoints"]
        distinguishing_aspect: "A topup bumps the rider's version after it was read; a change-plan carrying the pre-topup expected_rider_version is rejected with ERR_STALE_RIDER_VERSION (412)."
        test_recipe:
          setup: ["a rider read at version v0; a topup advances version; an approved LOW_INCOME application exists so the only failing check is the stale version"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/plans"
              payload: { code: "LOW_INCOME", unlock_fee_cents: 50, per_minute_cents: 15, daily_cap_cents: 500, slow_zone_discount_pct: 0.50 }
              as: PlatformAdmin
              captures: { li_plan_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "occ2@x.com", full_name: "OCC2", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id, rider_v0: $.data.version }
            - call: "POST /api/low-income-applications"
              payload: { rider_id: "${rider_id}", household_size: 1, annual_income_cents: 2000000 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/low-income-applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 1000 }
              as: Rider
              as_user_id: "${rider_id}"
          trigger:
            - call: "POST /api/riders/${rider_id}/change-plan"
              payload: { plan_id: "${li_plan_id}", expected_rider_version: "${rider_v0}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_RIDER_VERSION (412): the topup advanced the rider past version ${rider_v0}"

      - name: occ_correct_vehicle_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[task-create-stale-vehicle]", "entities.Vehicle.fields.version"]
        distinguishing_aspect: "A task create carrying the current expected_vehicle_version succeeds (201) and bumps Vehicle.version by 1."
        test_recipe:
          setup: ["a freshly registered vehicle at version 1"]
          setup_api_calls:
            - call: "POST /api/zones"
              payload: { name: "Z28", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-OCC3", battery_pct: 50, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id, veh_v: $.data.version }
          trigger:
            - call: "POST /api/rebalancing-tasks"
              payload: { vehicle_id: "${veh_id}", task_type: "MOVE", target_zone_id: "${zone_id}", window_start: "2026-07-22T10:00:00Z", window_end: "2026-07-22T11:00:00Z", expected_vehicle_version: "${veh_v}" }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
            - call: "GET /api/vehicles/${veh_id}"
              payload: {}
              as: PlatformAdmin
              captures: { veh_v_after: $.data.version }
          assert:
            - "task create returns 201"
            - "Vehicle.${veh_id}.version == 2 after the create (was 1)"

      - name: derived_outstanding_fine_cents_reconciles_after_waive
        claim_type: derived_field_reconciliation
        grounds: [entities.Rider.fields.outstanding_fine_cents, state_machines.Fine.DISPUTED_to_WAIVED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / fine_disputed_branches_to_waived_or_pending
          rationale: "outstanding_fine_cents == 0 after waive is asserted in the named §1.8 instance; the conserved-money invariant is asserted in compensating_invariant / fine_charge_then_waive_refund_conserves_wallet_money."

      - name: rate_threshold_daily_cap_clamps_above_cap
        claim_type: rate_threshold_triggers
        grounds: [calculations.trip_final_fare, entities.Plan.fields.daily_cap_cents]
        distinguishing_aspect: "A LOW_INCOME trip of 31 billable minutes has gross 50 + 31*15 = 515, which the daily_cap min() clamps to 500; this exercises the threshold ABOVE the cap (complement of the §1.9 calculations instance that lands exactly AT the cap)."
        test_recipe:
          setup: ["a LOW_INCOME rider (via approved application) riding 31 billable minutes"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/plans"
              payload: { code: "LOW_INCOME", unlock_fee_cents: 50, per_minute_cents: 15, daily_cap_cents: 500, slow_zone_discount_pct: 0.50 }
              as: PlatformAdmin
              captures: { li_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Z29", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-CAP2", battery_pct: 100, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "cap2@x.com", full_name: "Cap2", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id, rider_v0: $.data.version }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { rider_v1: $.data.version }
            - call: "POST /api/low-income-applications"
              payload: { rider_id: "${rider_id}", household_size: 1, annual_income_cents: 2000000 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/low-income-applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/riders/${rider_id}/change-plan"
              payload: { plan_id: "${li_plan_id}", expected_rider_version: "${rider_v1}" }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-23T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-23T00:31:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { fare: $.data.final_fare_cents, bmin: $.data.billable_minutes }
          assert:
            - "Trip.${trip_id}.billable_minutes == 31"
            - "Trip.${trip_id}.final_fare_cents == 500 (gross 515 clamped to cap 500)"

  # =========================================================================
  - section: consistency_model
    instances:
      - name: trip_end_cascade_visible_in_same_response_immediate
        claim_type: immediate
        grounds: [state_machines.Trip.ACTIVE_to_COMPLETED, entities.Rider.fields.wallet_balance_cents]
        excluded_because:
          difficulty_instance: transitive_cascade / trip_end_in_no_park_charges_then_fines_then_debits_wallet
          rationale: "The immediate visibility of the trip-end charge/fine cascade (wallet and outstanding updated synchronously) is asserted in the named §1.8 cascade instance."
