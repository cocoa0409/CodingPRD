      - name: cascade_from_suspend_drains_queue_and_voids_payments
        claim_type: cascading_side_effects
        grounds:
          - state_machines.OperatorAgreement.ACTIVE_to_SUSPENDED
          - state_machines.Stand.THROTTLED_to_SUSPENDED
        distinguishing_aspect: "The same cascade fires from suspend (not just terminate covered in §1.8) and from the THROTTLED posture: a throttled stand with a MERGED authorized order is suspended, its order ABANDONED and payment VOIDED, and the lane occupancy returns to zero."
        test_recipe:
          setup: ["Stand THROTTLED with one MERGED window order whose payment is AUTHORIZED."]
          setup_api_calls:
            - *k_clock
