              as: Homeowner
              as_user_id: "${h1}"
          assert:
            - "PRE-TRIGGER LEDGER: after the setup auto-shutoff, GET /devices/${d1} returns valve_state == CLOSED, close_count == 1, reopen_count == 0, so close_count - reopen_count == 1, and GET /properties/${p1}/irrigation-windows returns $.data[0].status == SUSPENDED_BY_SHUTOFF with $.data[0].suspended_at == 2026-08-01T07:00:00Z"
            - "AFTER THE FIRST OPEN: Device.${d1}.valve_state == OPEN, close_count == 1, reopen_count == 1, so close_count - reopen_count == 0 — the parity ledger is balanced by an INCREMENT of reopen_count, never by decrementing close_count"
            - "THE COMPENSATION IS COMPLETE, NOT PARTIAL: GET /properties/${p1}/irrigation-windows returns $.data[0].status == ACTIVE AND $.data[0].suspended_at == null; an implementation that flips status back but leaves suspended_at == 2026-08-01T07:00:00Z fails this assert"
            - "AFTER THE MANUAL CLOSE: Device.${d1}.valve_state == CLOSED, close_count == 2, reopen_count == 1, so close_count - reopen_count == 1 again, and $.data[0].status == SUSPENDED_BY_SHUTOFF with $.data[0].suspended_at == 2026-08-01T07:00:00Z (the clock has not advanced during the trigger sequence, so the re-suspend stamps the same instant)"
            - "AFTER THE SECOND OPEN: Device.${d1}.valve_state == OPEN, close_count == 2, reopen_count == 2, so close_count - reopen_count == 0, and $.data[0].status == ACTIVE with $.data[0].suspended_at == null — two full cycles leave both the parity ledger and the irrigation row exactly as they started, with zero drift"
            - "NO COUNTER REWRITING: the observed sequence of (close_count, reopen_count) is (1,0) -> (1,1) -> (2,1) -> (2,2); both counters are monotonically non-decreasing, so an implementation that compensates by decrementing close_count would return close_count == 1 after the second OPEN and fail"
            - "Device.${d1}.last_shutoff_at == 2026-08-01T07:00:00Z after every step and AnomalyEvent.${ev1}.override_reopen_at == 2026-08-01T07:00:00Z with mitigation_credited == false: the first override is recorded once and the second OPEN does not double-book it"
