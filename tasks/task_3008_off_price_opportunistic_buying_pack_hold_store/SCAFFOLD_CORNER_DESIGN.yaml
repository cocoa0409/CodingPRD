              captures: { wh_b270_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_b270_id}", warehouse_id: "${wh_b270_id}", pallet_count: 1, release_window_start: "2027-07-01T00:00:00Z", release_window_end: "2027-08-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_b270_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-28T00:00:00Z" }
              as: PlanningLead
            - call: "GET /packaway-holds/${hold_b270_id}"
              payload: {}
              as: InventoryPlanner
              captures: { bucket269: $.data.age_bucket }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-29T00:00:00Z" }
              as: PlanningLead
            - call: "GET /packaway-holds/${hold_b270_id}"
              payload: {}
              as: InventoryPlanner
              captures: { bucket270: $.data.age_bucket }
          assert:
            - "at 2027-05-28 (269 days) age_bucket == AGING"
            - "at 2027-05-29 (exactly 270 days) age_bucket == STALE (>= boundary on the second threshold)"

      - name: shrink_valuation_high_value_sort_merge_on_mixed_lot
        claim_type: Variant Divergence
        grounds:
          - calculations.shrink_valuation
          - entities.Lot.fields.mixed_lot
        distinguishing_aspect: "On a mixed lot the HIGH_VALUE_SORT merge draws untraceable units from the highest compare-at lines first: 3 untraceable units value at 3 * 90000 (the high-value line), not the FIFO order's cheaper lines."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor STANDARD zone MT. Mixed lot (mixed_lot true) accepted with landed 1150000 and two lines: cheap line (compare_at 15000, unit_cost 11500, qty 50, created first) and dear line (compare_at 150000, unit_cost 90000, qty 50, created second). Store ST-M."
          setup_api_calls:
            - *k_clock
