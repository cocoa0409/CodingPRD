      - name: user_holdout_measurement_diverges_on_scaled_control_sales
        claim_type: variant_divergence
        grounds:
          - calculations.incremental_sales_lift.variants.USER_HOLDOUT
          - calculations.incremental_sales_lift
          - entities.IncrementalityStudy.design_method
