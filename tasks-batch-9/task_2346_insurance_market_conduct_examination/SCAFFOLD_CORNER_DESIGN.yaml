          - entities.Criticism.fields.issued_by_user_id
          - complexity_profile.role_model
        distinguishing_aspect: |
          Segregation of duties is keyed on the identity that issued the criticism, not on the role
          claimed at finalisation, so the very same person holding a supervisory role is still refused
          while a different supervisor is allowed. issued_by_user_id is captured at issuance and never
          client-supplied, and the refusal leaves the criticism in RESPONDED so a clean finaliser can
          still act.
