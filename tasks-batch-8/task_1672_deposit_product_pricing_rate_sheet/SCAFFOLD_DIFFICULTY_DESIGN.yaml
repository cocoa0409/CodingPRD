            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_dld}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: OperationsAdmin }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_dld}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id", n0_req: "$.data[0].required_by_date" } }
          trigger:
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer, captures: { n0_late: $.data.is_late, n0_st: $.data.status } }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
