scenario: |
  Bonded Warehouse & Foreign-Trade Zone Operations (FTZ zone operator): zone
  admission & entry documentation, duty deferral & inventory attribution by
  status, manipulation/assembly in zone & value change, withdrawal for
  consumption vs export, annual reconciliation & CBP reporting, inventory
  control & recordkeeping audit, security & access control, weekly entry &
  merchandise processing fee savings.

domain_name: bonded-warehouse-ftz
api_prefix: /zones

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat            # peer collections under /zones, joined by FK references in bodies/filters
  state_machine_shape: branching   # fork/join withdrawals & entries, with revert cycles on admissions/badges
  relationship_patterns:
    - one_to_many                  # Zone -> admissions/lots/withdrawals/entries/reconciliations/badges/events
    - cross_aggregate              # Withdrawal -> WeeklyEntry; ManipulationOrder <-> InventoryLot
  role_model: peer_roles           # ZoneOperator / Importer / CustomsOfficer / GateOfficer own disjoint write surfaces
  consistency_model: immediate     # every mutation + cascade is visible in the same request's response and subsequent reads

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# Money is integer cents. Duty rates are decimal fractions. All rounding is
# round_half_up to integer cents unless a calculation says otherwise.
# =============================================================================
entities:
  - name: Zone
    parent: null
    common_fields: true            # id (uuid, identity only), created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Human-readable zone name" }
      - { name: zone_code, type: string, source: input, description: "Operator-assigned zone code (free text, informational)" }
      - { name: bond_coverage_cents, type: integer, source: input, description: "Surety bond amount capping total deferred duty exposure; >= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Operator-controlled lifecycle: ACTIVE | SUSPENDED | DEACTIVATED" , constraints: "initial ACTIVE; DEACTIVATED terminal" }
      - { name: compliance_posture, type: enum, source: computed, default: NORMAL, description: "Derived posture: NORMAL | AUDIT_HOLD; set by annual reconciliation breach, cleared by reconciliation acceptance" }
      - { name: deferred_duty_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of deferred duty estimates over all lots with status IN_ZONE (see deferred_duty_exposure calculation)" }
      - { name: active_lot_count, type: integer, source: computed, default: 0, description: "Count of InventoryLot rows in this zone with status IN_ZONE" }

  - name: Admission
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; zone receiving the merchandise" }
      - { name: importer_ref, type: string, source: system, description: "Set from X-User-ID of the creating Importer; ownership anchor" }
      - { name: description, type: string, source: input, description: "Merchandise description" }
      - { name: hts_code, type: string, source: input, description: "Harmonized Tariff Schedule code; must exist in HTS_RATE_TABLE at admission time" }
      - { name: quantity, type: integer, source: input, description: "Admitted units; >= 1" }
      - { name: unit_value_cents, type: integer, source: input, description: "Declared value per unit in cents; >= 0" }
      - { name: zone_status, type: enum, source: input, description: "Status designation: PRIVILEGED_FOREIGN | NON_PRIVILEGED_FOREIGN | DOMESTIC | ZONE_RESTRICTED" }
      - { name: admission_date, type: datetime, source: system, description: "Logical-clock timestamp stamped at the ADMITTED transition; null before admission" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ADMITTED | CANCELLED" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: system, description: "FK -> Zone.id; copied from the originating admission or manipulation order" }
      - { name: admission_id, type: string, source: system, description: "FK -> Admission.id; null for lots produced by a manipulation order" , constraints: "nullable" }
      - { name: source_manipulation_id, type: string, source: system, description: "FK -> ManipulationOrder.id; set only on lots produced by a manipulation completion" , constraints: "nullable" }
      - { name: importer_ref, type: string, source: system, description: "Owner ref inherited from the originating admission (or source lot for manipulated output)" }
      - { name: hts_code, type: string, source: system, description: "HTS code of the merchandise in this lot (output code for manipulated lots)" }
      - { name: zone_status, type: enum, source: system, description: "PRIVILEGED_FOREIGN | NON_PRIVILEGED_FOREIGN | DOMESTIC | ZONE_RESTRICTED; manipulated output lots inherit the source lot's zone_status" }
      - { name: admitted_quantity, type: integer, source: system, description: "Original lot quantity (admission quantity or manipulation output_quantity)" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "Units physically in zone; includes any reserved units until consumption completes" }
      - { name: reserved_quantity, type: integer, source: computed, default: 0, description: "Units reserved by APPROVED (not yet completed) manipulation orders" }
      - { name: cumulative_withdrawn, type: integer, source: computed, default: 0, description: "Units withdrawn via FILED/DUTY_PAID/EXPORTED withdrawals" }
      - { name: cumulative_consumed, type: integer, source: computed, default: 0, description: "Units consumed by COMPLETED manipulation orders" }
      - { name: unit_value_cents, type: integer, source: system, description: "Per-unit dutiable value basis; for manipulation output lots computed by manipulation_output_valuation" }
      - { name: duty_rate, type: number, source: computed, description: "Applicable ad valorem rate: 0 for DOMESTIC; HTS_RATE_TABLE[hts_code] otherwise; PRIVILEGED_FOREIGN output lots keep the source lot's locked rate" }
      - { name: status, type: enum, source: system, default: IN_ZONE, description: "IN_ZONE | DEPLETED (auto when quantity_on_hand reaches 0)" }

  - name: ManipulationOrder
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id" }
      - { name: importer_ref, type: string, source: system, description: "Set from X-User-ID of the creating Importer" }
      - { name: source_lot_id, type: string, source: input, description: "FK -> InventoryLot.id; lot whose units are manipulated/assembled" }
      - { name: input_quantity, type: integer, source: input, description: "Units of source lot consumed; >= 1" }
      - { name: output_hts_code, type: string, source: input, description: "HTS code of the finished good; must exist in HTS_RATE_TABLE at approval" }
      - { name: output_quantity, type: integer, source: input, description: "Units of finished good produced; >= 1" }
      - { name: value_added_cents, type: integer, source: input, description: "Value added by the in-zone manipulation/assembly; >= 0" }
      - { name: output_description, type: string, source: input, description: "Description of the finished good" }
      - { name: output_lot_id, type: string, source: system, description: "FK -> InventoryLot.id; lot created at completion; null until COMPLETED" , constraints: "nullable" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | COMPLETED | REJECTED | CANCELLED" }

  - name: Withdrawal
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; must equal the lot's zone" }
      - { name: importer_ref, type: string, source: system, description: "Set from X-User-ID; must equal the lot owner" }
      - { name: lot_id, type: string, source: input, description: "FK -> InventoryLot.id" }
      - { name: weekly_entry_id, type: string, source: input, description: "FK -> WeeklyEntry.id; optional attach-at-create for CONSUMPTION withdrawals; cleared by system on entry freeze", constraints: "nullable; only settable at creation" }
      - { name: withdrawal_type, type: enum, source: input, description: "CONSUMPTION | EXPORT" }
      - { name: quantity, type: integer, source: input, description: "Units to withdraw; >= 1; checked against available quantity at filing" }
      - { name: estimated_duty_cents, type: integer, source: computed, description: "Provisional duty computed at creation via duty_assessment (estimate variant)" }
      - { name: assessed_duty_cents, type: integer, source: computed, description: "Final duty computed at filing via duty_assessment (assess variant); null while DRAFT" , constraints: "nullable" }
      - { name: withdrawal_date, type: datetime, source: system, description: "Logical-clock timestamp stamped at filing; null while DRAFT", constraints: "nullable" }
      - { name: duty_outcome, type: enum, source: computed, default: PENDING, description: "PENDING (DRAFT/FILED) | COLLECTED (DUTY_PAID) | EXTINGUISHED (EXPORTED) | NONE (CANCELLED)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FILED | DUTY_PAID | EXPORTED | CANCELLED" }

  - name: WeeklyEntry
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id" }
      - { name: importer_ref, type: string, source: system, description: "Set from X-User-ID of the creating Importer; entry covers only this importer's withdrawals" }
      - { name: week_start_date, type: datetime, source: input, description: "Inclusive start of the entry week" }
      - { name: week_end_date, type: datetime, source: computed, description: "week_start_date + 7 days; the week is the half-open interval [week_start_date, week_end_date)" }
      - { name: entered_value_cents, type: integer, source: computed, default: 0, description: "Sum of member withdrawal values (see weekly_entry_settlement); live-recomputed on membership changes" }
      - { name: duty_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-line rounded member duties (rounding order pinned in weekly_entry_settlement)" }
      - { name: mpf_uncapped_cents, type: integer, source: computed, default: 0, description: "Rounded ad valorem merchandise processing fee BEFORE min/max caps" }
      - { name: mpf_cents, type: integer, source: computed, default: 0, description: "Consolidated MPF after min/max caps; 0 when no qualifying members" }
      - { name: per_shipment_mpf_cents, type: integer, source: computed, default: 0, description: "Hypothetical sum of per-withdrawal MPFs had each shipment been entered separately" }
      - { name: mpf_savings_cents, type: integer, source: computed, default: 0, description: "per_shipment_mpf_cents - mpf_cents" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FILED | ACCEPTED | FROZEN (FROZEN only via AUDIT_HOLD cascade)" }

  - name: AnnualReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id" }
      - { name: zone_year, type: integer, source: input, description: "Calendar zone year; the reconciliation window is [zone_year-01-01T00:00:00Z, (zone_year+1)-01-01T00:00:00Z)" }
      - { name: beginning_value_cents, type: integer, source: input, description: "Operator-attested beginning inventory value; >= 0" }
      - { name: physical_ending_value_cents, type: integer, source: input, description: "Physical count ending inventory value; >= 0" }
      - { name: book_receipts_value_cents, type: integer, source: computed, description: "Sum of admitted admission values in the zone-year window; computed at submit", constraints: "null until SUBMITTED" }
      - { name: book_withdrawals_value_cents, type: integer, source: computed, description: "Sum of in-window withdrawal values (statuses FILED/DUTY_PAID/EXPORTED); computed at submit", constraints: "null until SUBMITTED" }
      - { name: book_ending_value_cents, type: integer, source: computed, description: "beginning + receipts - withdrawals; computed at submit", constraints: "null until SUBMITTED" }
      - { name: discrepancy_cents, type: integer, source: computed, description: "physical_ending_value_cents - book_ending_value_cents", constraints: "null until SUBMITTED" }
      - { name: discrepancy_pct, type: number, source: computed, description: "|discrepancy| / book_ending x 100, 4 decimal places round_half_up; if book_ending == 0 then 0 when physical == 0 else 100", constraints: "null until SUBMITTED" }
      - { name: audit_flagged, type: boolean, source: computed, description: "true when discrepancy_pct > AUDIT_THRESHOLD_PCT (strictly greater)", constraints: "null until SUBMITTED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | SUPERSEDED" }

  - name: AccessBadge
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id" }
      - { name: holder_name, type: string, source: input, description: "Badge holder full name; uniqueness scope for the validity-window overlap rule" }
      - { name: employer_ref, type: string, source: input, description: "Optional employer reference", constraints: "optional" }
      - { name: valid_from, type: datetime, source: input, description: "Inclusive start of badge validity (closed interval)" }
      - { name: valid_until, type: datetime, source: input, description: "Inclusive end of badge validity (closed interval); must be strictly after valid_from" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | REVOKED" }

  - name: ZoneAccessEvent
    parent: null
    common_fields: false           # append-only audit log: id + created_at only; immutable, no version
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id" }
      - { name: badge_id, type: string, source: input, description: "FK -> AccessBadge.id" }
      - { name: direction, type: enum, source: input, description: "IN | OUT" }
      - { name: occurred_at, type: datetime, source: input, description: "Event timestamp; optional, defaults to the logical clock's current UTC", constraints: "optional; default = logical clock now" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Zone
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /zones/{zoneId}/transition {to_status: SUSPENDED}"
        actor: ZoneOperator
        preconditions:
          - "zone.status == ACTIVE (ERR_ZONE_INVALID_TRANSITION)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /zones/{zoneId}/transition {to_status: ACTIVE}"
        actor: ZoneOperator
        preconditions:
          - "zone.status == SUSPENDED (ERR_ZONE_INVALID_TRANSITION)"
        side_effects: []
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /zones/{zoneId}/transition {to_status: DEACTIVATED}"
        actor: ZoneOperator
        preconditions:
          - "zone.status in {ACTIVE, SUSPENDED} (ERR_ZONE_INVALID_TRANSITION)"
          - "zone.active_lot_count == 0 (ERR_ZONE_NOT_EMPTY)"
        side_effects: []
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /zones/{zoneId}/transition {to_status: DEACTIVATED}"
        actor: ZoneOperator
        preconditions:
          - "zone.status in {ACTIVE, SUSPENDED} (ERR_ZONE_INVALID_TRANSITION)"
          - "zone.active_lot_count == 0 (ERR_ZONE_NOT_EMPTY)"
        side_effects: []
      # --- parallel dimension: compliance_posture (system-driven) ---
      - from: NORMAL
        to: AUDIT_HOLD
        trigger: "system (AnnualReconciliation submit computes audit_flagged == true)"
        actor: system
        preconditions:
          - "submitted reconciliation.audit_flagged == true"
        side_effects:
          - "HOP 1: zone.compliance_posture -> AUDIT_HOLD"
          - "HOP 2 (caused by HOP 1): every WeeklyEntry in this zone with status OPEN -> FROZEN"
          - "HOP 3 (caused by HOP 2): every withdrawal attached to a freezing entry with status FILED -> DRAFT, weekly_entry_id cleared to null, and its quantity restored to the lot (quantity_on_hand += withdrawal.quantity, cumulative_withdrawn -= withdrawal.quantity)"
          - "HOP 4 (caused by HOP 3): any lot restored from 0 on-hand transitions DEPLETED -> IN_ZONE, and zone.active_lot_count / zone.deferred_duty_exposure_cents are recomputed"
      - from: AUDIT_HOLD
        to: NORMAL
        trigger: "system (AnnualReconciliation accept while zone posture is AUDIT_HOLD)"
        actor: system
        preconditions:
          - "an AnnualReconciliation for this zone transitions SUBMITTED -> ACCEPTED"
        side_effects:
          - "HOP 1: zone.compliance_posture -> NORMAL"
          - "HOP 2 (caused by HOP 1): every WeeklyEntry in this zone with status FROZEN -> OPEN (withdrawals detached earlier stay DRAFT and are NOT re-attached)"

  - entity: Admission
    initial_state: DRAFT
    terminal_states: [ADMITTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /zones/admissions/{admissionId}/submit"
        actor: Importer
        preconditions:
          - "admission.status == DRAFT (ERR_ADMISSION_INVALID_TRANSITION)"
          - "acting importer_ref == admission.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE) and zone.compliance_posture == NORMAL (ERR_ZONE_AUDIT_HOLD)"
        side_effects: []
      - from: SUBMITTED
        to: ADMITTED
        trigger: "POST /zones/admissions/{admissionId}/admit"
        actor: CustomsOfficer
        preconditions:
          - "admission.status == SUBMITTED (ERR_ADMISSION_INVALID_TRANSITION)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE) and zone.compliance_posture == NORMAL (ERR_ZONE_AUDIT_HOLD)"
          - "admission.hts_code exists in HTS_RATE_TABLE (ERR_UNKNOWN_HTS_CODE)"
          - "projected exposure: zone.deferred_duty_exposure_cents + new lot deferred estimate <= zone.bond_coverage_cents (ERR_BOND_CAPACITY_EXCEEDED; equality is allowed)"
        side_effects:
          - "admission.admission_date := logical clock now"
          - "HOP 1: create InventoryLot (status IN_ZONE, admitted_quantity = quantity_on_hand = admission.quantity, unit_value_cents and duty_rate per lot-valuation rules, zone_status copied from admission)"
          - "HOP 2 (caused by HOP 1): recompute zone.deferred_duty_exposure_cents and zone.active_lot_count (deferred_duty_exposure calculation)"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /zones/admissions/{admissionId}/return"
        actor: CustomsOfficer
        preconditions:
          - "admission.status == SUBMITTED (ERR_ADMISSION_INVALID_TRANSITION)"
        side_effects: []
        note: "Customs returns the admission documentation for correction; the DRAFT<->SUBMITTED loop may repeat"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /zones/admissions/{admissionId}/cancel"
        actor: Importer
        preconditions:
          - "admission.status in {DRAFT, SUBMITTED} (ERR_ADMISSION_INVALID_TRANSITION)"
          - "acting importer_ref == admission.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /zones/admissions/{admissionId}/cancel"
        actor: Importer
        preconditions:
          - "admission.status in {DRAFT, SUBMITTED} (ERR_ADMISSION_INVALID_TRANSITION)"
          - "acting importer_ref == admission.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
        side_effects: []

  - entity: InventoryLot
    initial_state: IN_ZONE
    terminal_states: [DEPLETED]
    transitions:
      - from: IN_ZONE
        to: DEPLETED
        trigger: "system (quantity_on_hand reaches exactly 0 via withdrawal filing or manipulation completion)"
        actor: system
        preconditions:
          - "quantity_on_hand == 0"
        side_effects:
          - "zone.active_lot_count recomputed (decremented by this lot's departure from IN_ZONE)"
      - from: DEPLETED
        to: IN_ZONE
        trigger: "system (a FILED withdrawal is cancelled or detached-by-freeze, restoring quantity to a lot at 0 on-hand)"
        actor: system
        preconditions:
          - "quantity_on_hand restored above 0"
        side_effects:
          - "zone.active_lot_count recomputed (incremented by this lot's return to IN_ZONE)"

  - entity: ManipulationOrder
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /zones/manipulation-orders/{orderId}/approve"
        actor: ZoneOperator
        preconditions:
          - "order.status == REQUESTED (ERR_ORDER_INVALID_TRANSITION)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE) and zone.compliance_posture == NORMAL (ERR_ZONE_AUDIT_HOLD)"
          - "source lot exists and lot.status == IN_ZONE (ERR_LOT_NOT_IN_ZONE)"
          - "source lot.zone_status != ZONE_RESTRICTED (ERR_MANIPULATION_NOT_PERMITTED; zone-restricted merchandise may not be manipulated)"
          - "source lot.reserved_quantity == 0, i.e. lot is not busy under another APPROVED order (ERR_LOT_BUSY)"
          - "order.input_quantity <= lot.quantity_on_hand - lot.reserved_quantity (ERR_INSUFFICIENT_QUANTITY)"
          - "order.output_hts_code exists in HTS_RATE_TABLE (ERR_UNKNOWN_HTS_CODE)"
        side_effects:
          - "source lot.reserved_quantity += order.input_quantity (units stay on-hand but unavailable)"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /zones/manipulation-orders/{orderId}/complete"
        actor: Importer
        preconditions:
          - "order.status == APPROVED (ERR_ORDER_INVALID_TRANSITION)"
          - "acting importer_ref == order.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE) and zone.compliance_posture == NORMAL (ERR_ZONE_AUDIT_HOLD)"
        side_effects:
          - "HOP 1: source lot: quantity_on_hand -= input_quantity, reserved_quantity -= input_quantity, cumulative_consumed += input_quantity"
          - "HOP 2 (caused by HOP 1): if source lot.quantity_on_hand == 0 then source lot -> DEPLETED; create output InventoryLot (status IN_ZONE, admitted_quantity = quantity_on_hand = output_quantity, zone_status inherited from source lot, unit_value_cents per manipulation_output_valuation, duty_rate per lot-valuation rules, source_manipulation_id = this order, admission_id = null); order.output_lot_id := new lot id"
          - "HOP 3 (caused by HOP 2): recompute zone.active_lot_count and zone.deferred_duty_exposure_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /zones/manipulation-orders/{orderId}/reject"
        actor: ZoneOperator
        preconditions:
          - "order.status == REQUESTED (ERR_ORDER_INVALID_TRANSITION)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /zones/manipulation-orders/{orderId}/cancel"
        actor: Importer
        preconditions:
          - "order.status in {REQUESTED, APPROVED} (ERR_ORDER_INVALID_TRANSITION)"
          - "acting importer_ref == order.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /zones/manipulation-orders/{orderId}/cancel"
        actor: Importer
        preconditions:
          - "order.status in {REQUESTED, APPROVED} (ERR_ORDER_INVALID_TRANSITION)"
          - "acting importer_ref == order.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
        side_effects:
          - "source lot.reserved_quantity -= order.input_quantity (reservation released; quantity_on_hand unchanged)"

  - entity: Withdrawal
    initial_state: DRAFT
    terminal_states: [DUTY_PAID, EXPORTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /zones/withdrawals/{withdrawalId}/file"
        actor: Importer
        preconditions:
          - "withdrawal.status == DRAFT (ERR_WITHDRAWAL_INVALID_TRANSITION)"
          - "acting importer_ref == withdrawal.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE) and zone.compliance_posture == NORMAL (ERR_ZONE_AUDIT_HOLD)"
          - "lot.status == IN_ZONE (ERR_LOT_NOT_IN_ZONE)"
          - "withdrawal.quantity <= lot.quantity_on_hand - lot.reserved_quantity (ERR_INSUFFICIENT_QUANTITY; exact equality is allowed and depletes the lot)"
          - "if weekly_entry_id is set: entry.status == OPEN (ERR_ENTRY_NOT_OPEN) and logical clock now in [entry.week_start_date, entry.week_end_date) (ERR_WITHDRAWAL_OUTSIDE_ENTRY_WEEK)"
        side_effects:
          - "withdrawal.withdrawal_date := logical clock now; assessed_duty_cents computed (duty_assessment, assess variant)"
          - "HOP 1: lot.quantity_on_hand -= quantity; lot.cumulative_withdrawn += quantity"
          - "HOP 2 (caused by HOP 1): if lot.quantity_on_hand == 0 then lot -> DEPLETED"
          - "HOP 3 (caused by HOP 2): recompute zone.active_lot_count and zone.deferred_duty_exposure_cents"
          - "if attached to a weekly entry: recompute entry totals (weekly_entry_settlement)"
      - from: FILED
        to: DUTY_PAID
        trigger: "POST /zones/withdrawals/{withdrawalId}/pay-duty"
        actor: Importer
        preconditions:
          - "withdrawal.status == FILED (ERR_WITHDRAWAL_INVALID_TRANSITION)"
          - "withdrawal.withdrawal_type == CONSUMPTION (ERR_WRONG_WITHDRAWAL_TYPE)"
          - "acting importer_ref == withdrawal.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE) and zone.compliance_posture == NORMAL (ERR_ZONE_AUDIT_HOLD)"
        side_effects:
          - "withdrawal.duty_outcome := COLLECTED"
      - from: FILED
        to: EXPORTED
        trigger: "POST /zones/withdrawals/{withdrawalId}/confirm-export"
        actor: CustomsOfficer
        preconditions:
          - "withdrawal.status == FILED (ERR_WITHDRAWAL_INVALID_TRANSITION)"
          - "withdrawal.withdrawal_type == EXPORT (ERR_WRONG_WITHDRAWAL_TYPE)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE) and zone.compliance_posture == NORMAL (ERR_ZONE_AUDIT_HOLD)"
        side_effects:
          - "withdrawal.duty_outcome := EXTINGUISHED (export extinguishes the deferred duty; no duty collected)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /zones/withdrawals/{withdrawalId}/cancel"
        actor: Importer
        preconditions:
          - "withdrawal.status in {DRAFT, FILED} (ERR_WITHDRAWAL_INVALID_TRANSITION)"
          - "acting importer_ref == withdrawal.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
          - "if weekly_entry_id is set: entry.status == OPEN (ERR_ENTRY_NOT_OPEN)"
        side_effects:
          - "withdrawal.duty_outcome := NONE"
      - from: FILED
        to: CANCELLED
        trigger: "POST /zones/withdrawals/{withdrawalId}/cancel"
        actor: Importer
        preconditions:
          - "withdrawal.status in {DRAFT, FILED} (ERR_WITHDRAWAL_INVALID_TRANSITION)"
          - "acting importer_ref == withdrawal.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
          - "if weekly_entry_id is set: entry.status == OPEN (ERR_ENTRY_NOT_OPEN)"
        side_effects:
          - "withdrawal.duty_outcome := NONE"
          - "COMPENSATION of the filing: lot.quantity_on_hand += quantity; lot.cumulative_withdrawn -= quantity; if lot was DEPLETED it returns to IN_ZONE; recompute zone.active_lot_count and zone.deferred_duty_exposure_cents; recompute attached entry totals (weekly_entry_settlement)"

  - entity: WeeklyEntry
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: FILED
        trigger: "POST /zones/weekly-entries/{entryId}/file"
        actor: Importer
        preconditions:
          - "entry.status == OPEN (ERR_ENTRY_INVALID_TRANSITION)"
          - "acting importer_ref == entry.importer_ref (ERR_NOT_RESOURCE_OWNER)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE) and zone.compliance_posture == NORMAL (ERR_ZONE_AUDIT_HOLD)"
          - "at least one attached CONSUMPTION withdrawal with status in {FILED, DUTY_PAID} (ERR_ENTRY_NO_LINE_ITEMS)"
        side_effects:
          - "entry totals computed and stored (weekly_entry_settlement: entered_value_cents, duty_total_cents, mpf_uncapped_cents, mpf_cents, per_shipment_mpf_cents, mpf_savings_cents)"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /zones/weekly-entries/{entryId}/transition {to_status: ACCEPTED}"
        actor: CustomsOfficer
        preconditions:
          - "entry.status == FILED (ERR_ENTRY_INVALID_TRANSITION)"
        side_effects: []
      - from: FILED
        to: OPEN
        trigger: "POST /zones/weekly-entries/{entryId}/transition {to_status: OPEN}"
        actor: CustomsOfficer
        preconditions:
          - "entry.status == FILED (ERR_ENTRY_INVALID_TRANSITION)"
        side_effects: []
        note: "Customs returns the entry for correction; the OPEN<->FILED loop may repeat"
      - from: OPEN
        to: FROZEN
        trigger: "system (zone.compliance_posture NORMAL -> AUDIT_HOLD)"
        actor: system
        preconditions:
          - "owning zone enters AUDIT_HOLD"
        side_effects:
          - "attached FILED withdrawals -> DRAFT with weekly_entry_id cleared and lot quantity restored (see Zone posture transition HOP 3)"
      - from: FROZEN
        to: OPEN
        trigger: "system (zone.compliance_posture AUDIT_HOLD -> NORMAL)"
        actor: system
        preconditions:
          - "owning zone exits AUDIT_HOLD"
        side_effects: []

  - entity: AnnualReconciliation
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /zones/annual-reconciliations/{reconId}/submit"
        actor: ZoneOperator
        preconditions:
          - "reconciliation.status == DRAFT (ERR_RECONCILIATION_INVALID_TRANSITION)"
        side_effects:
          - "compute book_receipts_value_cents, book_withdrawals_value_cents, book_ending_value_cents, discrepancy_cents, discrepancy_pct, audit_flagged (reconciliation_variance)"
          - "if audit_flagged == true: trigger Zone compliance_posture NORMAL -> AUDIT_HOLD cascade (see Zone posture transition)"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /zones/annual-reconciliations/{reconId}/accept"
        actor: CustomsOfficer
        preconditions:
          - "reconciliation.status == SUBMITTED (ERR_RECONCILIATION_INVALID_TRANSITION)"
        side_effects:
          - "if zone.compliance_posture == AUDIT_HOLD: trigger Zone compliance_posture AUDIT_HOLD -> NORMAL cascade (frozen entries return to OPEN)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new AnnualReconciliation is created for the same (zone_id, zone_year) while this one is DRAFT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AccessBadge
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /zones/access-badges/{badgeId}/transition {to_status: SUSPENDED}"
        actor: ZoneOperator
        preconditions:
          - "badge.status == ACTIVE (ERR_BADGE_INVALID_TRANSITION)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /zones/access-badges/{badgeId}/transition {to_status: ACTIVE}"
        actor: ZoneOperator
        preconditions:
          - "badge.status == SUSPENDED (ERR_BADGE_INVALID_TRANSITION)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /zones/access-badges/{badgeId}/transition {to_status: REVOKED}"
        actor: ZoneOperator
        preconditions:
          - "badge.status in {ACTIVE, SUSPENDED} (ERR_BADGE_INVALID_TRANSITION)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
        side_effects: []
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /zones/access-badges/{badgeId}/transition {to_status: REVOKED}"
        actor: ZoneOperator
        preconditions:
          - "badge.status in {ACTIVE, SUSPENDED} (ERR_BADGE_INVALID_TRANSITION)"
          - "zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; see SKILL.md)
# =============================================================================
concurrency_rules:
  - rule_id: reconciliation-create-stale-zone
    parent_entity: Zone
    write_endpoint: "POST /zones/annual-reconciliations"
    occ_field: expected_zone_version
    description: |
      Creating an AnnualReconciliation for a (zone_id, zone_year) that already
      has a DRAFT reconciliation legitimately supersedes that draft, so a client
      holding a stale observation of the Zone cannot be rejected from observed
      state alone. The create is therefore guarded by expected_zone_version: if
      the Zone's current version does not equal expected_zone_version, the
      create is rejected as operating on a stale read of the zone.
    error_id: ERR_STALE_ZONE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All monetary arithmetic uses decimal math; rounding is round_half_up to
# integer cents at the steps each formula pins. Global constants:
#   HTS_RATE_TABLE: { "0401.10": 0.05, "8542.31": 0.04, "9503.00": 0.12, "8708.29": 0.025 }
#   MPF_AD_VALOREM_RATE: 0.003464 ; MPF_MIN_CENTS: 3000 ; MPF_MAX_CENTS: 60000
#   ENTRY_WEEK_DAYS: 7 ; AUDIT_THRESHOLD_PCT: 0.5
# =============================================================================
calculations:
  - name: duty_assessment
    trigger: "withdrawal creation (estimate variant -> estimated_duty_cents) and withdrawal filing (assess variant -> assessed_duty_cents)"
    algorithm: conditional_branch
    formula: |
      duty = round_half_up(quantity x lot.unit_value_cents x lot.duty_rate)
      where lot.unit_value_cents and lot.duty_rate are resolved per lot:
        DOMESTIC lot:            duty_rate = 0                                  -> duty 0
        PRIVILEGED_FOREIGN lot:  duty_rate and unit value basis are those
                                 locked at admission; for a manipulation output
                                 lot the basis/rate come from the SOURCE lot
                                 (locked component valuation)
        NON_PRIVILEGED_FOREIGN:  duty_rate = HTS_RATE_TABLE[lot.hts_code] at the
                                 lot's current code; for a manipulation output
                                 lot the basis includes value added in zone
        ZONE_RESTRICTED lot:     same as NON_PRIVILEGED_FOREIGN (duty deferred;
                                 consumption withdrawal is separately forbidden)
      Inputs (>= 3): withdrawal.quantity, lot.unit_value_cents, lot.duty_rate,
      with conditional branches on lot.zone_status and lot provenance
      (admission_id vs source_manipulation_id).
    input_set: "the single withdrawal line and its referenced lot"
    constants:
      HTS_RATE_TABLE: { "0401.10": 0.05, "8542.31": 0.04, "9503.00": 0.12, "8708.29": 0.025 }
    precision: "integer cents, round_half_up (decimal arithmetic)"
    variants:
      - name: privileged_foreign_locked
        when: "lot.zone_status == PRIVILEGED_FOREIGN"
        difference: "rate and value basis are locked at admission (components' basis for manipulated output); insensitive to in-zone value change"
      - name: non_privileged_foreign_current
        when: "lot.zone_status in {NON_PRIVILEGED_FOREIGN, ZONE_RESTRICTED}"
        difference: "rate and value basis are those of the merchandise as withdrawn (finished-good code and value-added basis for manipulated output)"

  - name: manipulation_output_valuation
    trigger: "manipulation order completion (creates the output lot)"
    algorithm: aggregation
    formula: |
      input_share_cents   = round_half_up(input_quantity x source_lot.unit_value_cents)
      output_basis_cents  = input_share_cents + value_added_cents
      output unit_value_cents = round_half_up(output_basis_cents / output_quantity)
      output duty_rate:
        source PRIVILEGED_FOREIGN -> source_lot.duty_rate (locked rate carries over)
        source NON_PRIVILEGED_FOREIGN or ZONE_RESTRICTED -> HTS_RATE_TABLE[output_hts_code]
        source DOMESTIC -> 0
      Rounding order is pinned: round the input share first, add value_added,
      then round the per-unit division. Reversing this order yields different
      cents and is non-conformant.
    input_set: "the completing ManipulationOrder and its source lot"
    constants:
      HTS_RATE_TABLE: { "0401.10": 0.05, "8542.31": 0.04, "9503.00": 0.12, "8708.29": 0.025 }
    precision: "integer cents, round_half_up at each pinned step"

  - name: deferred_duty_exposure
    trigger: "admission ADMITTED transition, withdrawal filing, withdrawal cancellation, manipulation completion (any mutation of a lot's on-hand quantity or membership in IN_ZONE)"
    algorithm: aggregation
    formula: |
      zone.deferred_duty_exposure_cents =
        sum over lots with status IN_ZONE of
          round_half_up(lot.quantity_on_hand x lot.unit_value_cents x lot.duty_rate)
      zone.active_lot_count = count of lots with status IN_ZONE
    input_set: "all InventoryLot rows of the zone with status IN_ZONE (DEPLETED lots contribute 0 and are excluded from the count)"
    constants:
      HTS_RATE_TABLE: { "0401.10": 0.05, "8542.31": 0.04, "9503.00": 0.12, "8708.29": 0.025 }
    precision: "integer cents, round_half_up per lot then summed"

  - name: weekly_entry_settlement
    trigger: "weekly entry filing, and live recompute whenever membership or member status changes (withdrawal filing/cancellation, freeze-detach)"
    algorithm: tiered_pricing
    formula: |
      members = attached withdrawals (weekly_entry_id == entry.id) with
                withdrawal_type == CONSUMPTION and status in {FILED, DUTY_PAID}
      If no members: entered_value_cents = duty_total_cents = mpf_uncapped_cents
        = mpf_cents = per_shipment_mpf_cents = mpf_savings_cents = 0. Stop.
      line value(i)  = quantity(i) x lot(i).unit_value_cents            (exact integer cents)
      line duty(i)   = round_half_up(line value(i) x lot(i).duty_rate)  (round per line FIRST)
      entered_value_cents = sum of line value(i)
      duty_total_cents    = sum of line duty(i)     (sum of rounded lines;
                            summing exact duties then rounding once is NON-CONFORMANT)
      mpf_uncapped_cents  = round_half_up(entered_value_cents x MPF_AD_VALOREM_RATE)
      mpf_cents           = min(max(mpf_uncapped_cents, MPF_MIN_CENTS), MPF_MAX_CENTS)
      per_shipment_mpf_cents = sum over i of
        min(max(round_half_up(line value(i) x MPF_AD_VALOREM_RATE), MPF_MIN_CENTS), MPF_MAX_CENTS)
      mpf_savings_cents   = per_shipment_mpf_cents - mpf_cents
    input_set: "attached withdrawals with type CONSUMPTION and status in {FILED, DUTY_PAID}; EXPORT and DRAFT/CANCELLED withdrawals are excluded"
    constants:
      MPF_AD_VALOREM_RATE: 0.003464
      MPF_MIN_CENTS: 3000
      MPF_MAX_CENTS: 60000
    precision: "integer cents, round_half_up; per-line-then-sum order pinned above"

  - name: reconciliation_variance
    trigger: "annual reconciliation submit"
    algorithm: chronological
    formula: |
      window = [zone_year-01-01T00:00:00Z, (zone_year+1)-01-01T00:00:00Z)
      book_receipts_value_cents = sum over admissions with status ADMITTED and
        admission_date in window of (quantity x unit_value_cents)
      book_withdrawals_value_cents = sum over withdrawals with status in
        {FILED, DUTY_PAID, EXPORTED} and withdrawal_date in window of
        (quantity x lot.unit_value_cents)   [DRAFT and CANCELLED excluded]
      book_ending_value_cents = beginning_value_cents + receipts - withdrawals
      discrepancy_cents = physical_ending_value_cents - book_ending_value_cents
      discrepancy_pct = if book_ending == 0 then (0 if physical == 0 else 100)
                        else round_half_up(|discrepancy| / book_ending x 100, 4 dp)
      audit_flagged = discrepancy_pct > AUDIT_THRESHOLD_PCT   (strictly greater;
                        exactly 0.5 does NOT flag)
    input_set: "admissions ADMITTED with admission_date in window; withdrawals in {FILED, DUTY_PAID, EXPORTED} with withdrawal_date in window"
    constants:
      AUDIT_THRESHOLD_PCT: 0.5
    precision: "values integer cents; discrepancy_pct 4 decimal places round_half_up"
    variants:
      - name: book_derived_ending
        when: "always computed"
        difference: "forward book value: beginning + receipts - withdrawals from system records"
      - name: physical_count_ending
        when: "operator-supplied physical_ending_value_cents input"
        difference: "independent physical count; the two algorithms legitimately diverge and discrepancy_cents/discrepancy_pct expose the delta"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "role is listed on the endpoint (endpoint-level permission)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "path ids exist, validated left-to-right; then body FK targets exist (zone_id, lot_id, source_lot_id, weekly_entry_id, badge_id)"
    error_id: "ERR_ZONE_NOT_FOUND | ERR_ADMISSION_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_MANIPULATION_ORDER_NOT_FOUND | ERR_WITHDRAWAL_NOT_FOUND | ERR_WEEKLY_ENTRY_NOT_FOUND | ERR_RECONCILIATION_NOT_FOUND | ERR_BADGE_NOT_FOUND | ERR_ACCESS_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "request body schema: required fields present, types correct, enum members valid, quantity >= 1, unit_value_cents >= 0, value_added_cents >= 0, bond_coverage_cents >= 0, valid_from strictly before valid_until; unknown fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a request body
  - priority: 5
    category: auth
    check: "ownership: acting importer_ref equals the resource's importer_ref (admission submit/cancel; manipulation complete/cancel; withdrawal file/pay-duty/cancel; entry file); withdrawal/manipulation creation requires acting importer_ref equals the referenced lot's importer_ref; attaching a weekly entry requires entry.importer_ref equals the acting importer"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "mutating endpoints on Importer-owned resources"
  - priority: 6
    category: state
    check: "state preconditions: target resource in a valid from-state (ERR_*_INVALID_TRANSITION, ERR_LOT_NOT_IN_ZONE); zone gates: zone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE) and zone.compliance_posture == NORMAL (ERR_ZONE_AUDIT_HOLD) where declared; zone deactivation requires active_lot_count == 0 (ERR_ZONE_NOT_EMPTY); withdrawal type matches action (ERR_WRONG_WITHDRAWAL_TYPE); attached entry OPEN where declared (ERR_ENTRY_NOT_OPEN); OCC: expected_zone_version equals Zone.version on reconciliation create (ERR_STALE_ZONE_VERSION)"
    error_id: "state-category errors (409) and ERR_STALE_ZONE_VERSION (412)"
    http_status: 409
    applies_to: "transition endpoints, creation endpoints gated on zone state, POST /zones/annual-reconciliations"
  - priority: 7
    category: business_safety
    check: "customs/security prohibitions: CONSUMPTION withdrawal on a ZONE_RESTRICTED lot (ERR_ZR_CONSUMPTION_FORBIDDEN, checked at withdrawal creation); manipulation order on a ZONE_RESTRICTED source lot (ERR_MANIPULATION_NOT_PERMITTED, checked at approval); gate event on a badge whose status != ACTIVE (ERR_BADGE_ACCESS_DENIED)"
    error_id: "ERR_ZR_CONSUMPTION_FORBIDDEN | ERR_MANIPULATION_NOT_PERMITTED | ERR_BADGE_ACCESS_DENIED"
    http_status: 422
    applies_to: "POST /zones/withdrawals, POST /zones/manipulation-orders/{id}/approve, POST /zones/access-events"
  - priority: 8
    category: business_temporal
    check: "interval/sequence rules: weekly entry window overlap on same zone (ERR_WEEK_WINDOW_OVERLAP; half-open [start, end), adjacency allowed); badge validity overlap for same (zone_id, holder_name) among badges with status in {ACTIVE, SUSPENDED} (ERR_BADGE_WINDOW_OVERLAP; CLOSED interval, touching bounds conflict); filing date within attached entry week (ERR_WITHDRAWAL_OUTSIDE_ENTRY_WEEK); gate event occurred_at within badge [valid_from, valid_until] inclusive (ERR_BADGE_WINDOW_VIOLATION); gate events strictly alternate per badge starting with IN (ERR_GATE_SEQUENCE_VIOLATION)"
    error_id: "ERR_WEEK_WINDOW_OVERLAP (409) | ERR_BADGE_WINDOW_OVERLAP (409) | ERR_WITHDRAWAL_OUTSIDE_ENTRY_WEEK (422) | ERR_BADGE_WINDOW_VIOLATION (422) | ERR_GATE_SEQUENCE_VIOLATION (422)"
    http_status: 422
    applies_to: "POST /zones/weekly-entries, POST /zones/access-badges, POST /zones/withdrawals/{id}/file, POST /zones/access-events"
  - priority: 9
    category: business_constraint
    check: "resource constraints: withdrawal quantity <= lot.quantity_on_hand - lot.reserved_quantity (ERR_INSUFFICIENT_QUANTITY); manipulation input availability at approval (ERR_INSUFFICIENT_QUANTITY); lot not busy under another APPROVED manipulation order (ERR_LOT_BUSY); entry has at least one qualifying member line at filing (ERR_ENTRY_NO_LINE_ITEMS); no existing SUBMITTED reconciliation for the same (zone_id, zone_year) (ERR_RECONCILIATION_ALREADY_SUBMITTED)"
    error_id: "ERR_INSUFFICIENT_QUANTITY (422) | ERR_LOT_BUSY (422) | ERR_ENTRY_NO_LINE_ITEMS (422) | ERR_RECONCILIATION_ALREADY_SUBMITTED (409)"
    http_status: 422
    applies_to: "withdrawal file, manipulation approve, weekly entry file, reconciliation create"
  - priority: 10
    category: business_referential
    check: "referential consistency: hts_code / output_hts_code exists in HTS_RATE_TABLE at admission/approval (ERR_UNKNOWN_HTS_CODE); withdrawal.zone_id equals lot.zone_id and (when set) weekly entry zone_id equals withdrawal zone_id (ERR_CROSS_ZONE_REFERENCE); gate event zone_id equals badge.zone_id (ERR_CROSS_ZONE_REFERENCE)"
    error_id: "ERR_UNKNOWN_HTS_CODE | ERR_CROSS_ZONE_REFERENCE"
    http_status: 422
    applies_to: "admission admit, manipulation approve, withdrawal create, access event create"
  - priority: 11
    category: business_fiscal
    check: "bond capacity: at admission admit, zone.deferred_duty_exposure_cents + new lot's deferred estimate <= zone.bond_coverage_cents (equality allowed)"
    error_id: ERR_BOND_CAPACITY_EXCEEDED
    http_status: 402
    applies_to: "POST /zones/admissions/{id}/admit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Zone ---
  - method: POST
    path: "/zones"
    description: "Create a zone (status ACTIVE, compliance_posture NORMAL, exposure 0)"
    roles: [ZoneOperator]
    code: 201
    input: [name, zone_code, bond_coverage_cents]
    output: Zone
    side_effects: ["status = ACTIVE", "compliance_posture = NORMAL", "deferred_duty_exposure_cents = 0", "active_lot_count = 0"]
  - method: GET
    path: "/zones"
    description: "List zones (paginated)"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Zone[]"
    side_effects: []
  - method: GET
    path: "/zones/{zoneId}"
    description: "Get one zone"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: []
    output: Zone
    side_effects: []
  - method: POST
    path: "/zones/{zoneId}/transition"
    description: "Operator lifecycle transition: to_status in {SUSPENDED, ACTIVE, DEACTIVATED}"
    roles: [ZoneOperator]
    code: 200
    input: [to_status]
    output: Zone
    side_effects: ["zone.status transition per state machine", "increments Zone.version by 1"]
  # --- Admission ---
  - method: POST
    path: "/zones/admissions"
    description: "Create admission documentation (DRAFT); importer_ref set from X-User-ID"
    roles: [Importer]
    code: 201
    input: [zone_id, description, hts_code, quantity, unit_value_cents, zone_status]
    output: Admission
    side_effects: ["status = DRAFT", "importer_ref := X-User-ID"]
  - method: GET
    path: "/zones/admissions"
    description: "List admissions with optional filters"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: ["zone_id?", "importer_ref?", "status?", "zone_status?", "limit?", "offset?"]
    output: "Admission[]"
    side_effects: []
  - method: GET
    path: "/zones/admissions/{admissionId}"
    description: "Get one admission"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: []
    output: Admission
    side_effects: []
  - method: POST
    path: "/zones/admissions/{admissionId}/submit"
    description: "Submit admission for customs review (DRAFT -> SUBMITTED)"
    roles: [Importer]
    code: 200
    input: []
    output: Admission
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/zones/admissions/{admissionId}/admit"
    description: "Customs admits merchandise into the zone (SUBMITTED -> ADMITTED); creates the inventory lot"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: Admission
    side_effects: ["status -> ADMITTED", "admission_date := logical clock now", "create InventoryLot IN_ZONE", "recompute zone.deferred_duty_exposure_cents and zone.active_lot_count"]
  - method: POST
    path: "/zones/admissions/{admissionId}/return"
    description: "Customs returns admission for correction (SUBMITTED -> DRAFT)"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: Admission
    side_effects: ["status -> DRAFT"]
  - method: POST
    path: "/zones/admissions/{admissionId}/cancel"
    description: "Importer cancels a DRAFT or SUBMITTED admission"
    roles: [Importer]
    code: 200
    input: []
    output: Admission
    side_effects: ["status -> CANCELLED"]
  # --- InventoryLot (read-only; mutated via admission/manipulation/withdrawal flows) ---
  - method: GET
    path: "/zones/lots"
    description: "List inventory lots with optional filters"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: ["zone_id?", "admission_id?", "source_manipulation_id?", "status?", "hts_code?", "limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []
  - method: GET
    path: "/zones/lots/{lotId}"
    description: "Get one inventory lot"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  # --- ManipulationOrder ---
  - method: POST
    path: "/zones/manipulation-orders"
    description: "Request an in-zone manipulation/assembly order (REQUESTED)"
    roles: [Importer]
    code: 201
    input: [zone_id, source_lot_id, input_quantity, output_hts_code, output_quantity, value_added_cents, output_description]
    output: ManipulationOrder
    side_effects: ["status = REQUESTED", "importer_ref := X-User-ID"]
  - method: GET
    path: "/zones/manipulation-orders"
    description: "List manipulation orders with optional filters"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: ["zone_id?", "source_lot_id?", "output_lot_id?", "status?", "limit?", "offset?"]
    output: "ManipulationOrder[]"
    side_effects: []
  - method: GET
    path: "/zones/manipulation-orders/{orderId}"
    description: "Get one manipulation order"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: []
    output: ManipulationOrder
    side_effects: []
  - method: POST
    path: "/zones/manipulation-orders/{orderId}/approve"
    description: "Zone operator approves a manipulation order; reserves the input quantity on the source lot"
    roles: [ZoneOperator]
    code: 200
    input: []
    output: ManipulationOrder
    side_effects: ["status -> APPROVED", "source lot.reserved_quantity += input_quantity"]
  - method: POST
    path: "/zones/manipulation-orders/{orderId}/complete"
    description: "Complete an approved manipulation: consume input units, create the output lot, recompute zone aggregates"
    roles: [Importer]
    code: 200
    input: []
    output: ManipulationOrder
    side_effects: ["status -> COMPLETED", "source lot debit per state machine (possible DEPLETED)", "create output InventoryLot", "recompute zone aggregates"]
  - method: POST
    path: "/zones/manipulation-orders/{orderId}/reject"
    description: "Zone operator rejects a requested manipulation order"
    roles: [ZoneOperator]
    code: 200
    input: []
    output: ManipulationOrder
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/zones/manipulation-orders/{orderId}/cancel"
    description: "Importer cancels a REQUESTED or APPROVED order; an APPROVED cancellation releases the lot reservation"
    roles: [Importer]
    code: 200
    input: []
    output: ManipulationOrder
    side_effects: ["status -> CANCELLED", "if was APPROVED: source lot.reserved_quantity -= input_quantity"]
  # --- Withdrawal ---
  - method: POST
    path: "/zones/withdrawals"
    description: "Create a withdrawal (DRAFT); optional weekly_entry_id attaches a CONSUMPTION withdrawal to an OPEN entry at creation"
    roles: [Importer]
    code: 201
    input: [zone_id, lot_id, withdrawal_type, quantity, "weekly_entry_id?"]
    output: Withdrawal
    side_effects: ["status = DRAFT", "importer_ref := X-User-ID", "estimated_duty_cents computed (duty_assessment estimate variant)"]
  - method: GET
    path: "/zones/withdrawals"
    description: "List withdrawals with optional filters"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: ["zone_id?", "lot_id?", "weekly_entry_id?", "status?", "withdrawal_type?", "limit?", "offset?"]
    output: "Withdrawal[]"
    side_effects: []
  - method: GET
    path: "/zones/withdrawals/{withdrawalId}"
    description: "Get one withdrawal"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: []
    output: Withdrawal
    side_effects: []
  - method: POST
    path: "/zones/withdrawals/{withdrawalId}/file"
    description: "File the withdrawal with customs (DRAFT -> FILED); debits the lot and assesses duty"
    roles: [Importer]
    code: 200
    input: []
    output: Withdrawal
    side_effects: ["status -> FILED", "withdrawal_date := logical clock now", "assessed_duty_cents computed", "lot debit cascade per state machine", "recompute zone aggregates", "recompute attached entry totals"]
  - method: POST
    path: "/zones/withdrawals/{withdrawalId}/pay-duty"
    description: "Pay assessed duty on a FILED CONSUMPTION withdrawal (-> DUTY_PAID)"
    roles: [Importer]
    code: 200
    input: []
    output: Withdrawal
    side_effects: ["status -> DUTY_PAID", "duty_outcome := COLLECTED"]
  - method: POST
    path: "/zones/withdrawals/{withdrawalId}/confirm-export"
    description: "Customs confirms export of a FILED EXPORT withdrawal (-> EXPORTED); deferred duty extinguished"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: Withdrawal
    side_effects: ["status -> EXPORTED", "duty_outcome := EXTINGUISHED"]
  - method: POST
    path: "/zones/withdrawals/{withdrawalId}/cancel"
    description: "Cancel a DRAFT or FILED withdrawal; cancelling a FILED withdrawal restores the lot quantity and entry totals"
    roles: [Importer]
    code: 200
    input: []
    output: Withdrawal
    side_effects: ["status -> CANCELLED", "duty_outcome := NONE", "if was FILED: lot restoration + aggregate recompute per state machine"]
  # --- WeeklyEntry ---
  - method: POST
    path: "/zones/weekly-entries"
    description: "Open a weekly consolidated entry for a zone; week_end_date = week_start_date + 7 days (half-open)"
    roles: [Importer]
    code: 201
    input: [zone_id, week_start_date]
    output: WeeklyEntry
    side_effects: ["status = OPEN", "importer_ref := X-User-ID", "all totals initialized to 0"]
  - method: GET
    path: "/zones/weekly-entries"
    description: "List weekly entries with optional filters"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: ["zone_id?", "status?", "limit?", "offset?"]
    output: "WeeklyEntry[]"
    side_effects: []
  - method: GET
    path: "/zones/weekly-entries/{entryId}"
    description: "Get one weekly entry"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: []
    output: WeeklyEntry
    side_effects: []
  - method: POST
    path: "/zones/weekly-entries/{entryId}/file"
    description: "File the weekly entry (OPEN -> FILED); computes entered value, duty total, MPF with caps, and MPF savings"
    roles: [Importer]
    code: 200
    input: []
    output: WeeklyEntry
    side_effects: ["status -> FILED", "weekly_entry_settlement computed and stored"]
  - method: POST
    path: "/zones/weekly-entries/{entryId}/transition"
    description: "Customs transition on a FILED entry: to_status ACCEPTED accepts, to_status OPEN returns it for correction"
    roles: [CustomsOfficer]
    code: 200
    input: [to_status]
    output: WeeklyEntry
    side_effects: ["status -> ACCEPTED or OPEN per state machine"]
  # --- AnnualReconciliation ---
  - method: POST
    path: "/zones/annual-reconciliations"
    description: "Create an annual reconciliation (DRAFT). If a DRAFT reconciliation already exists for the same (zone_id, zone_year) it is superseded. Guarded by OCC on the Zone version."
    roles: [ZoneOperator]
    code: 201
    input: [zone_id, zone_year, beginning_value_cents, physical_ending_value_cents, expected_zone_version]
    output: AnnualReconciliation
    side_effects: ["status = DRAFT", "existing DRAFT reconciliation for same (zone_id, zone_year) -> SUPERSEDED", "increments Zone.version by 1"]
  - method: GET
    path: "/zones/annual-reconciliations"
    description: "List annual reconciliations with optional filters"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: ["zone_id?", "zone_year?", "status?", "limit?", "offset?"]
    output: "AnnualReconciliation[]"
    side_effects: []
  - method: GET
    path: "/zones/annual-reconciliations/{reconId}"
    description: "Get one annual reconciliation"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: []
    output: AnnualReconciliation
    side_effects: []
  - method: POST
    path: "/zones/annual-reconciliations/{reconId}/submit"
    description: "Submit reconciliation (DRAFT -> SUBMITTED); computes book vs physical variance and may trigger the AUDIT_HOLD cascade"
    roles: [ZoneOperator]
    code: 200
    input: []
    output: AnnualReconciliation
    side_effects: ["status -> SUBMITTED", "reconciliation_variance computed", "if audit_flagged: zone compliance_posture -> AUDIT_HOLD cascade"]
  - method: POST
    path: "/zones/annual-reconciliations/{reconId}/accept"
    description: "Customs accepts a SUBMITTED reconciliation (-> ACCEPTED); clears AUDIT_HOLD if set"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: AnnualReconciliation
    side_effects: ["status -> ACCEPTED", "if zone.compliance_posture == AUDIT_HOLD: posture -> NORMAL cascade (FROZEN entries -> OPEN)"]
  # --- AccessBadge ---
  - method: POST
    path: "/zones/access-badges"
    description: "Issue a zone access badge (ACTIVE); validity window is the CLOSED interval [valid_from, valid_until]"
    roles: [ZoneOperator]
    code: 201
    input: [zone_id, holder_name, "employer_ref?", valid_from, valid_until]
    output: AccessBadge
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/zones/access-badges"
    description: "List access badges with optional filters"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: ["zone_id?", "holder_name?", "status?", "limit?", "offset?"]
    output: "AccessBadge[]"
    side_effects: []
  - method: GET
    path: "/zones/access-badges/{badgeId}"
    description: "Get one access badge"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: []
    output: AccessBadge
    side_effects: []
  - method: POST
    path: "/zones/access-badges/{badgeId}/transition"
    description: "Badge lifecycle transition: to_status in {SUSPENDED, ACTIVE, REVOKED}"
    roles: [ZoneOperator]
    code: 200
    input: [to_status]
    output: AccessBadge
    side_effects: ["badge.status transition per state machine"]
  # --- ZoneAccessEvent (append-only) ---
  - method: POST
    path: "/zones/access-events"
    description: "Record a gate entry/exit event; badge must be ACTIVE and occurred_at within its validity window; events strictly alternate IN/OUT per badge"
    roles: [GateOfficer]
    code: 201
    input: [zone_id, badge_id, direction, "occurred_at?"]
    output: ZoneAccessEvent
    side_effects: []
  - method: GET
    path: "/zones/access-events"
    description: "List access events with optional filters"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: ["zone_id?", "badge_id?", "direction?", "limit?", "offset?"]
    output: "ZoneAccessEvent[]"
    side_effects: []
  - method: GET
    path: "/zones/access-events/{eventId}"
    description: "Get one access event"
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: []
    output: ZoneAccessEvent
    side_effects: []
  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock time."
    roles: [ZoneOperator, Importer, CustomsOfficer, GateOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role is not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "role is not listed on the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "acting importer_ref does not match the resource's (or referenced lot's/entry's) importer_ref" }
  # --- existence ---
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "referenced zone does not exist" }
  - { id: ERR_ADMISSION_NOT_FOUND, http: 404, condition: "referenced admission does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "referenced inventory lot does not exist" }
  - { id: ERR_MANIPULATION_ORDER_NOT_FOUND, http: 404, condition: "referenced manipulation order does not exist" }
  - { id: ERR_WITHDRAWAL_NOT_FOUND, http: 404, condition: "referenced withdrawal does not exist" }
  - { id: ERR_WEEKLY_ENTRY_NOT_FOUND, http: 404, condition: "referenced weekly entry does not exist" }
  - { id: ERR_RECONCILIATION_NOT_FOUND, http: 404, condition: "referenced annual reconciliation does not exist" }
  - { id: ERR_BADGE_NOT_FOUND, http: 404, condition: "referenced access badge does not exist" }
  - { id: ERR_ACCESS_EVENT_NOT_FOUND, http: 404, condition: "referenced access event does not exist" }
  # --- request schema ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, invalid enum member, non-positive quantity, negative money, valid_from >= valid_until, or unknown field in body" }
  # --- state ---
  - { id: ERR_ZONE_NOT_ACTIVE, http: 409, condition: "operation requires zone.status == ACTIVE" }
  - { id: ERR_ZONE_AUDIT_HOLD, http: 409, condition: "operation requires zone.compliance_posture == NORMAL but zone is in AUDIT_HOLD" }
  - { id: ERR_ZONE_INVALID_TRANSITION, http: 409, condition: "requested zone status transition is not allowed from the current status" }
  - { id: ERR_ZONE_NOT_EMPTY, http: 409, condition: "zone deactivation requires active_lot_count == 0" }
  - { id: ERR_ADMISSION_INVALID_TRANSITION, http: 409, condition: "admission action not allowed from its current status" }
  - { id: ERR_LOT_NOT_IN_ZONE, http: 409, condition: "operation requires lot.status == IN_ZONE" }
  - { id: ERR_ORDER_INVALID_TRANSITION, http: 409, condition: "manipulation order action not allowed from its current status" }
  - { id: ERR_WITHDRAWAL_INVALID_TRANSITION, http: 409, condition: "withdrawal action not allowed from its current status (incl. acting on a terminal withdrawal)" }
  - { id: ERR_WRONG_WITHDRAWAL_TYPE, http: 409, condition: "pay-duty requires CONSUMPTION type; confirm-export requires EXPORT type" }
  - { id: ERR_ENTRY_INVALID_TRANSITION, http: 409, condition: "weekly entry action not allowed from its current status" }
  - { id: ERR_ENTRY_NOT_OPEN, http: 409, condition: "operation requires the attached weekly entry to be OPEN" }
  - { id: ERR_RECONCILIATION_INVALID_TRANSITION, http: 409, condition: "reconciliation action not allowed from its current status" }
  - { id: ERR_BADGE_INVALID_TRANSITION, http: 409, condition: "badge action not allowed from its current status" }
  # --- business safety ---
  - { id: ERR_ZR_CONSUMPTION_FORBIDDEN, http: 422, condition: "CONSUMPTION withdrawal created against a ZONE_RESTRICTED lot" }
  - { id: ERR_MANIPULATION_NOT_PERMITTED, http: 422, condition: "manipulation order approved against a ZONE_RESTRICTED source lot" }
  - { id: ERR_BADGE_ACCESS_DENIED, http: 422, condition: "gate event references a badge whose status is not ACTIVE" }
  # --- business temporal ---
  - { id: ERR_WEEK_WINDOW_OVERLAP, http: 409, condition: "new weekly entry's half-open [week_start, week_start+7d) window intersects an existing entry's window on the same zone" }
  - { id: ERR_BADGE_WINDOW_OVERLAP, http: 409, condition: "new badge's closed validity window intersects another badge for the same (zone_id, holder_name) with status in {ACTIVE, SUSPENDED}; touching bounds conflict" }
  - { id: ERR_WITHDRAWAL_OUTSIDE_ENTRY_WEEK, http: 422, condition: "filing time (logical clock) falls outside the attached entry's [week_start_date, week_end_date)" }
  - { id: ERR_BADGE_WINDOW_VIOLATION, http: 422, condition: "gate event occurred_at falls outside the badge's closed [valid_from, valid_until] window" }
  - { id: ERR_GATE_SEQUENCE_VIOLATION, http: 422, condition: "gate events for a badge must strictly alternate starting with IN: IN requires count(IN) == count(OUT); OUT requires count(IN) == count(OUT) + 1" }
  # --- business constraint ---
  - { id: ERR_INSUFFICIENT_QUANTITY, http: 422, condition: "requested quantity exceeds lot.quantity_on_hand - lot.reserved_quantity (exact equality allowed)" }
  - { id: ERR_LOT_BUSY, http: 422, condition: "source lot is reserved under another APPROVED manipulation order (reserved_quantity > 0)" }
  - { id: ERR_ENTRY_NO_LINE_ITEMS, http: 422, condition: "weekly entry filing requires at least one attached CONSUMPTION withdrawal in {FILED, DUTY_PAID}" }
  - { id: ERR_RECONCILIATION_ALREADY_SUBMITTED, http: 409, condition: "a SUBMITTED reconciliation already exists for the same (zone_id, zone_year)" }
  # --- business referential ---
  - { id: ERR_UNKNOWN_HTS_CODE, http: 422, condition: "hts_code / output_hts_code not present in HTS_RATE_TABLE at admission/approval time" }
  - { id: ERR_CROSS_ZONE_REFERENCE, http: 422, condition: "body references a child resource (lot, weekly entry, badge) whose zone_id differs from the request's zone_id" }
  # --- business fiscal ---
  - { id: ERR_BOND_CAPACITY_EXCEEDED, http: 402, condition: "admitting would push zone.deferred_duty_exposure_cents above zone.bond_coverage_cents" }
  # --- OCC ---
  - { id: ERR_STALE_ZONE_VERSION, http: 412, condition: "expected_zone_version does not equal the Zone's current version on reconciliation create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ZoneOperator
    description: "FTZ zone operator staff: runs the zone, approves manipulations, files annual reconciliations, issues badges"
    identity: opaque
    exclusive_operations:
      - "POST /zones"
      - "POST /zones/{zoneId}/transition"
      - "POST /zones/manipulation-orders/{orderId}/approve"
      - "POST /zones/manipulation-orders/{orderId}/reject"
      - "POST /zones/annual-reconciliations"
      - "POST /zones/annual-reconciliations/{reconId}/submit"
      - "POST /zones/access-badges"
      - "POST /zones/access-badges/{badgeId}/transition"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: Importer
    description: "Zone user (importer of record): files admission documentation, requests manipulations, creates and files withdrawals and weekly entries for owned merchandise"
    identity: opaque
    exclusive_operations:
      - "POST /zones/admissions"
      - "POST /zones/admissions/{admissionId}/submit"
      - "POST /zones/admissions/{admissionId}/cancel"
      - "POST /zones/manipulation-orders"
      - "POST /zones/manipulation-orders/{orderId}/complete"
      - "POST /zones/manipulation-orders/{orderId}/cancel"
      - "POST /zones/withdrawals"
      - "POST /zones/withdrawals/{withdrawalId}/file"
      - "POST /zones/withdrawals/{withdrawalId}/pay-duty"
      - "POST /zones/withdrawals/{withdrawalId}/cancel"
      - "POST /zones/weekly-entries"
      - "POST /zones/weekly-entries/{entryId}/file"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: CustomsOfficer
    description: "CBP officer: admits merchandise, returns admission documentation, confirms exports, adjudicates weekly entries and annual reconciliations"
    identity: opaque
    exclusive_operations:
      - "POST /zones/admissions/{admissionId}/admit"
      - "POST /zones/admissions/{admissionId}/return"
      - "POST /zones/withdrawals/{withdrawalId}/confirm-export"
      - "POST /zones/weekly-entries/{entryId}/transition"
      - "POST /zones/annual-reconciliations/{reconId}/accept"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: GateOfficer
    description: "Zone gate security officer: records access events; otherwise read-only"
    identity: opaque
    exclusive_operations:
      - "POST /zones/access-events"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
