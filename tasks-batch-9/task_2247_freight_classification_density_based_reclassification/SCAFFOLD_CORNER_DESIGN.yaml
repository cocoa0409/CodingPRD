            - "no Dispute row exists for CorrectionNotice.${n1}"
            - "CorrectionNotice.${n1}.dispute_round_count == 0 and supplement_request_count == 0"
            - "CorrectionNotice.${n1}.dispute_deadline_at == 2026-02-09T08:00:00Z (unchanged)"
            - "trigger[2] returns swept_count == 1 and CorrectionNotice.${n1}.status == UPHELD with resolved_at 2026-02-10T08:00:00Z"
