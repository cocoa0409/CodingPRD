            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "CLASSROOM", instructor_id: "${instr_id}", starts_at: "2026-03-10T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { cs_class: $.data.id }
