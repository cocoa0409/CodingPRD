      assert:
      - 'different-site overlap succeeds: DeliveryAppointment.${vm_appt2}.status == SCHEDULED'
      - 'same-site interior overlap rejected: error_id == ERR_APPOINTMENT_CONFLICT (http 409)'
      - PurchaseOrder.${vm_ord3}.status remains STRUCTURED
  - name: occ_stale_vehicle_version_on_reserve
    claim_type: occ_stale_version
    grounds:
    - concurrency_rules[order-reserve-stale-vehicle]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: A reserve carrying a vehicle version observed before an annotation recomputation bumped it is rejected with 412 ERR_STALE_VERSION.
    test_recipe:
      setup:
      - a LISTED vehicle; a DRAFT order against it; client observed version 3, then an annotation is added bumping version to 4
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Occ U
          email: occ@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          occ_cust: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 5XYK33AF0PG004001
          make: Kia
          model: Sportage
          year: 2023
          mileage: 8000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          occ_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${occ_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${occ_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${occ_veh}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${occ_cust}
        captures:
          occ_ord: $.data.id
      - call: POST /vehicle-hub/vehicles/${occ_veh}/annotations
        payload:
          area: door
          severity: MINOR
          deduction_cents: 30000
          image_count: 2
        as: ReconOperator
      trigger:
      - call: POST /vehicle-hub/orders/${occ_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${occ_cust}
        captures:
          occ_err: $.data.error_id
          vehicles_v1: $.data.version
      assert:
      - error_id == ERR_STALE_VERSION (http 412)
      - PurchaseOrder.${occ_ord}.status remains DRAFT
      - Vehicle.${occ_veh}.status remains LISTED with version 4
  - name: occ_stale_order_version_on_appointment_booking
    claim_type: occ_stale_version
    grounds:
    - concurrency_rules[appointment-book-stale-order]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: A booking carrying an order version observed before a fulfillment-choice switch bumped it is rejected with 412 ERR_STALE_VERSION.
    test_recipe:
      setup:
      - a STRUCTURED order; client observed version 3, then a fulfillment-choice switch bumps order version to 4
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Occ2 U
          email: occ2@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          oc2_cust: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 5XYK33AF0PG004002
          make: Kia
          model: Sportage
          year: 2023
          mileage: 8000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          oc2_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${oc2_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${oc2_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${oc2_veh}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${oc2_cust}
        captures:
          oc2_ord: $.data.id
      - call: POST /vehicle-hub/orders/${oc2_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${oc2_cust}
        captures:
          vehicles_v1: $.data.version
      - call: POST /vehicle-hub/orders/${oc2_ord}/structure
        payload: {}
        as: Customer
        as_user_id: ${oc2_cust}
      - call: POST /vehicle-hub/orders/${oc2_ord}/fulfillment-choice
        payload:
          fulfillment_choice: VENDING_MACHINE
        as: Customer
        as_user_id: ${oc2_cust}
      trigger:
      - call: POST /vehicle-hub/orders/${oc2_ord}/appointments
        payload:
          expected_order_version: ${orders_v1}
          market_code: ATL-A
          vending_site_code: ATL-VM-1
          start_at: '2026-09-02T10:00:00Z'
          end_at: '2026-09-02T11:00:00Z'
        as: Customer
        as_user_id: ${oc2_cust}
        captures:
          oc2_err: $.data.error_id
          orders_v1: $.data.version
      assert:
      - error_id == ERR_STALE_VERSION (http 412) — client view (3) lags the switched order (4)
      - no DeliveryAppointment created (GET /vehicle-hub/appointments?order_id=${oc2_ord} returns empty array)
      - PurchaseOrder.${oc2_ord}.delivery_status remains NOT_SCHEDULED
  - name: clock_default_startup_value
    claim_type: system_field_default
    grounds:
    - endpoints."POST /vehicle-hub/_clock/set_current_utc"
    distinguishing_aspect: Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z; a registration issued at the default clock expires 2026-10-01T00:00:00Z for IN_STATE.
    test_recipe:
      setup:
      - empty database; no clock call issued
      setup_api_calls: []
      trigger:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Clk U
          email: clk@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          clk_cust: $.data.id
      assert:
      - Customer.${clk_cust}.created_at == 2026-09-01T00:00:00Z (proves the startup default, not wall-clock time)
- section: entities
  instances:
  - name: listed_price_recomputed_on_annotation_lifecycle
    claim_type: computed_field_correctness
    grounds:
    - calculations.listed_price
    - entities.Vehicle.fields.listed_price_cents
    - entities.Vehicle.fields.annotation_count
    distinguishing_aspect: listed_price_cents = base - sum(ACTIVE deductions), floored at 100,000; adding an annotation on a LISTED vehicle and then retracting it restores the price and decrements annotation_count.
    test_recipe:
      setup:
      - a LISTED vehicle with base_price 200,000 (exactly at the floor after a 100,000 deduction); one ACTIVE annotation of 60,000
      setup_api_calls:
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 1N4BL4EV4KC100501
          make: Nissan
          model: Altima
          year: 2019
          mileage: 55000
          base_price_cents: 200000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          lp_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${lp_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${lp_veh}/annotations
        payload:
          area: bumper
          severity: MODERATE
          deduction_cents: 60000
          image_count: 4
        as: ReconOperator
        captures:
          lp_ann: $.data.id
      - call: POST /vehicle-hub/vehicles/${lp_veh}/list
        as: ReconOperator
      trigger:
      - call: POST /vehicle-hub/vehicles/${lp_veh}/annotations
        payload:
          area: roof
          severity: MAJOR
          deduction_cents: 90000
          image_count: 6
        as: PlatformAdmin
      - call: POST /vehicle-hub/annotations/${lp_ann}/retract
        as: PlatformAdmin
      assert:
      - 'after list: Vehicle.${lp_veh}.listed_price_cents == 140000 and annotation_count == 1'
      - 'after second annotation: listed_price_cents == 100000 (floor binding, not 50,000) and annotation_count == 2'
      - 'after retraction of ${lp_ann}: listed_price_cents == 100000 (100,000 = 200,000 - 90,000 floored... exactly 110,000 pre-floor: assert listed_price_cents == 110000) and annotation_count == 1'
      - 'final: listed_price_cents == 110000, annotation_count == 1'
    assert:
    - 'after list: Vehicle.${lp_veh}.listed_price_cents == 140000 and annotation_count == 1'
    - 'after second annotation: listed_price_cents == 100000 (floor binding, not 50,000) and annotation_count == 2'
    - 'after retraction of ${lp_ann}: listed_price_cents == 110000 (200,000 - 90,000, floor not binding) and annotation_count == 1'
  - name: fk_reverse_reachability_lists
    claim_type: fk_integrity
    grounds:
    - entities.PurchaseOrder.fields.vehicle_id
    - entities.DeliveryAppointment.fields.order_id
    - entities.ImperfectionAnnotation.fields.vehicle_id
    distinguishing_aspect: 'Every FK is reachable in reverse: vehicles list orders via orders?vehicle_id=, orders list appointments and title registrations via sub-resources, vehicles list annotations and
      recon intakes.'
    test_recipe:
      setup:
      - one vehicle with one annotation driven through LISTED and an order to APPOINTMENT_SET
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: FK U
          email: fk@x.com
