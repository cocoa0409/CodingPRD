      - name: zero_refund_full_deduction_posts_cleanly
        claim_type: boundary_precision
        grounds: [calculations.refund_settlement, state_machines.ReturnOrder.EXCEPTION_PENDING_to_RESOLVED]
        distinguishing_aspect: "Single WRONG_ITEM line yields refund_final_cents exactly 0; the order still reaches REFUND_POSTED and the ledger carries a FINAL entry of amount 0."
