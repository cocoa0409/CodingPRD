      - name: commitment_void_releases_exactly_the_encumbrance_and_cost_it_added
        grounds:
          - calculations.provider_capacity_encumbrance
          - calculations.plan_service_readiness
          - state_machines.ServiceCommitment.FULFILLED_to_VOIDED
          - state_machines.PlanOfServices.READY_to_PARTIAL
          - entities.PlanOfServices.fields.committed_cost_cents
        distinguishing_aspect: |
          Conserved quantities ServiceProvider.encumbered_capacity_days and
          PlanOfServices.committed_cost_cents on one provider: activation drives them 31 -> 61 days
          and 500,000 -> 1,200,000 cents, and voiding the WATER commitment must release exactly its
          own 30 days and 700,000 cents — returning to 31 and 500,000, never 30/61 days or a
          rounded-down cost — while the plan's readiness dimension steps READY -> PARTIAL because
          WATER leaves covered_service_types.
        test_recipe:
          setup:
            - "One StatuteProfile with required_service_types [POLICE, WATER]."
            - "One ServiceProvider covering POLICE and WATER with concurrent_project_capacity 1."
            - "One certified AnnexationCase with a PlanOfServices holding two DRAFT commitments on that provider: POLICE 2026-08-01..2026-08-31 (500,000 cents) and WATER 2026-09-01..2026-09-30 (700,000 cents), both with committed_account_count 0 so activation fulfils them immediately."
