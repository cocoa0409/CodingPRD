      - name: dispute_information_requests_are_capped_at_two_and_each_one_extends_the_deadline
        claim_type: conditional_validation
        grounds:
          - validations[priority=85]
          - errors[ERR_MAX_INFO_REQUESTS]
          - state_machines.Dispute.status.MERCHANT_RESPONDED_to_INFO_REQUESTED
          - state_machines.Dispute.status.MERCHANT_RESPONDED_to_RESOLVED_NO_FAULT
          - state_machines.Redemption.fulfillment_status.DISPUTED_to_FULFILLED
        distinguishing_aspect: |
          The MERCHANT_RESPONDED -> INFO_REQUESTED leg is available only while info_request_count
          is below 2 and it rewrites response_deadline_at to clock_now + 120 hours on each pass, so
          the third request is refused with ERR_MAX_INFO_REQUESTS even though the dispute sits in
          the same MERCHANT_RESPONDED state that admitted the first two.
