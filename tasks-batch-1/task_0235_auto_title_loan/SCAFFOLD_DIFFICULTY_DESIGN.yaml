scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: loan_payoff_redemption_vs_reinstatement_diverge
        grounds:
          - calculations.redemption_amount
          - calculations.reinstatement_amount
          - state_machines.Loan.OUTSTANDING_to_REDEEMED
          - entities.Loan.fields.principal_balance_cents
        distinguishing_aspect: |
          On the SAME delinquent Loan, redemption_amount (full principal+interest+fees = 640176)
          and reinstatement_amount (arrears+fees only = 434236) are two valid 'amount owed'
          algorithms that produce different cents; this dual-variant pair lives on the Loan domain.
        test_recipe:
          setup:
            - "CA profile (max_apr 3600, max_ltv 5000, AUCTION basis, term [3,24], max_renewals 2, grace 10 days)"
            - "Loan originated with principal 600000, apr 3600, 3-month schedule; seq1+seq2 PAST_DUE after delinquency assessment; delinquency_status=DELINQUENT, no repo order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ca1@x.com", full_name: "CA One", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { borrower_id: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${borrower_id}", vin: "VINCA0001", year: 2018, make: "Honda", model: "Civic", odometer_miles: 60000 }
              as: Appraiser
              captures: { vehicle_id: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${vehicle_id}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { appraisal_id: $.data.id }
            - call: "POST /atl/appraisals/${appraisal_id}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${borrower_id}", appraisal_id: "${appraisal_id}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /atl/applications/${application_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "underwriter-1"
              captures: { loan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/devices"
              payload: { vehicle_id: "${vehicle_id}", serial_number: "SER-CA-1" }
              as: LoanServicer
            - call: "POST /atl/loans/${loan_id}/assess-delinquency"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "GET /atl/loans/${loan_id}/payoff-quote"
              payload: {}
              as: LoanServicer
              captures: { redeem: $.data.redemption_amount_cents, reinstate: $.data.reinstatement_amount_cents }
          assert:
            - "payoff-quote redemption_amount_cents == 640176"
            - "payoff-quote reinstatement_amount_cents == 434236"
            - "redemption_amount_cents != reinstatement_amount_cents"

      - name: appraisal_basis_trade_in_vs_auction_diverge
        grounds:
          - calculations.appraisal_basis_value
          - calculations.max_principal_from_ltv
          - entities.Appraisal.fields.basis_value_cents
          - entities.RegulatoryProfile.state_code
        distinguishing_aspect: |
          Identical Appraisal inputs (trade_in 2000000, auction 1600000, GOOD) yield basis 1900000 /
          max_principal 950000 under a TRADE_IN-basis state but basis 1520000 / max_principal 760000
          under an AUCTION-basis state — dual-variant on the Appraisal/Vehicle domain, distinct from Rule-1 instance 1.
        test_recipe:
          setup:
            - "Two states: VA profile valuation_basis=TRADE_IN, CA profile valuation_basis=AUCTION; identical vehicles+appraisals"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "VA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "TRADE_IN" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "va1@x.com", full_name: "VA One", state_code: "VA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { borrower_va: $.data.id }
            - call: "POST /atl/borrowers"
              payload: { email: "ca2@x.com", full_name: "CA Two", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { borrower_ca: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${borrower_va}", vin: "VINVA0001", year: 2018, make: "Honda", model: "Civic", odometer_miles: 60000 }
              as: Appraiser
              captures: { veh_va: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${borrower_ca}", vin: "VINCA0002", year: 2018, make: "Honda", model: "Civic", odometer_miles: 60000 }
              as: Appraiser
              captures: { veh_ca: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${veh_va}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { appr_va: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${veh_ca}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { appr_ca: $.data.id }
            - call: "POST /atl/appraisals/${appr_va}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-2"
            - call: "POST /atl/appraisals/${appr_ca}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-2"
          trigger:
            - call: "GET /atl/appraisals/${appr_va}"
              payload: {}
              as: Appraiser
              captures: { basis_va: $.data.basis_value_cents, mp_va: $.data.max_principal_cents }
            - call: "GET /atl/appraisals/${appr_ca}"
              payload: {}
              as: Appraiser
              captures: { basis_ca: $.data.basis_value_cents, mp_ca: $.data.max_principal_cents }
          assert:
            - "VA appraisal basis_value_cents == 1900000 and max_principal_cents == 950000"
            - "CA appraisal basis_value_cents == 1520000 and max_principal_cents == 760000"
            - "VA max_principal_cents != CA max_principal_cents"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: appraisal_basis_nested_haircut_ltv_mode_a
        grounds:
          - calculations.appraisal_basis_value
          - calculations.max_principal_from_ltv
          - entities.Appraisal.fields.condition_grade
        distinguishing_aspect: |
          MODE (a): max_principal is a 3+-input non-linear chain — basis-selection (TRADE_IN vs AUCTION
          branch) -> condition haircut tier (GOOD=500bps) -> floor -> LTV multiply -> floor; result
          760000 depends on the conditional branch + tier selection, not a single linear term.
        test_recipe:
          setup:
            - "CA AUCTION-basis profile; appraisal trade_in 2000000 / auction 1600000 / GOOD finalized"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ca3@x.com", full_name: "CA Three", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b3: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b3}", vin: "VINCA0003", year: 2019, make: "Toyota", model: "Corolla", odometer_miles: 40000 }
              as: Appraiser
              captures: { v3: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v3}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a3: $.data.id }
          trigger:
            - call: "POST /atl/appraisals/${a3}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-3"
              captures: { basis: $.data.basis_value_cents, mp: $.data.max_principal_cents }
          assert:
            - "Appraisal.basis_value_cents == 1520000"
            - "Appraisal.max_principal_cents == 760000"

      - name: amortization_round_per_installment_then_sum_mode_b
        grounds:
          - calculations.amortization_schedule
          - entities.Installment.fields.interest_due_cents
          - state_machines.LoanApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          MODE (b): interest is rounded per installment THEN summed and the final installment absorbs
          residue, so sum(interest_due)=36354 and sum(principal_due)=600000 exactly; a 'sum-then-round'
          order would put different cents on the last row. The scaffold pins per-installment rounding.
        test_recipe:
          setup:
            - "CA profile; loan originated principal 600000 apr 3600 term 3; schedule generated at approve"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ca4@x.com", full_name: "CA Four", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b4: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b4}", vin: "VINCA0004", year: 2019, make: "Toyota", model: "Corolla", odometer_miles: 40000 }
              as: Appraiser
              captures: { v4: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v4}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a4: $.data.id }
            - call: "POST /atl/appraisals/${a4}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-4"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b4}", appraisal_id: "${a4}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app4: $.data.id }
            - call: "POST /atl/applications/${app4}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "underwriter-2"
              captures: { loan4: $.data.id }
          trigger:
            - call: "GET /atl/loans/${loan4}/installments"
              payload: {}
              as: LoanServicer
          assert:
            - "installments[0].principal_due_cents == 194118 and installments[0].interest_due_cents == 18000"
            - "installments[1].principal_due_cents == 199942 and installments[1].interest_due_cents == 12176"
            - "installments[2].principal_due_cents == 205940 and installments[2].interest_due_cents == 6178"
            - "sum of principal_due_cents over the 3 installments == 600000"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_delinquency_cycle_current_delinquent_current
        grounds:
          - state_machines.Loan.CURRENT_to_DELINQUENT
          - state_machines.Loan.DELINQUENT_to_CURRENT
          - calculations.reinstatement_amount
        distinguishing_aspect: |
          The Loan delinquency dimension is CYCLIC: CURRENT -> DELINQUENT (assess) -> CURRENT
          (REINSTATEMENT payment of 434236) — the entity returns to a prior state, which a linear
          pipeline cannot. Cycle lives on Loan.
        test_recipe:
          setup:
            - "CA loan originated principal 600000; seq1+seq2 PAST_DUE; delinquency_status=DELINQUENT (no default yet)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ca5@x.com", full_name: "CA Five", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b5: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b5}", vin: "VINCA0005", year: 2017, make: "Ford", model: "Focus", odometer_miles: 80000 }
              as: Appraiser
              captures: { v5: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v5}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a5: $.data.id }
            - call: "POST /atl/appraisals/${a5}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-5"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b5}", appraisal_id: "${a5}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app5: $.data.id }
            - call: "POST /atl/applications/${app5}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "underwriter-3"
              captures: { loan5: $.data.id }
            - call: "POST /atl/devices"
              payload: { vehicle_id: "${v5}", serial_number: "SER-CA-5" }
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/loans/${loan5}/assess-delinquency"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /atl/loans/${loan5}/payments"
              payload: { amount_cents: 434236, payment_type: "REINSTATEMENT" }
              as: LoanServicer
          assert:
            - "Loan.${loan5}.delinquency_status == CURRENT"
            - "Loan.${loan5}.fees_balance_cents == 0"

      - name: repossession_branching_recovered_to_sold_vs_cancelled
        grounds:
          - state_machines.RepossessionOrder.ORDERED_to_ASSIGNED
          - state_machines.RepossessionOrder.RECOVERED_to_SOLD
          - state_machines.RepossessionOrder.ORDERED_to_CANCELLED
        distinguishing_aspect: |
          RepossessionOrder is BRANCHING fork-join: from RECOVERED it can go to SOLD (deficiency
          recorded, loan CHARGED_OFF) OR be CANCELLED (no deficiency, collateral returned) — divergent
          side-effect sets on a different entity than Rule-3 instance 1.
        test_recipe:
          setup:
            - "CA loan in DEFAULT with a RepossessionOrder RECOVERED after grace; clock past redemption_deadline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ca6@x.com", full_name: "CA Six", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b6: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b6}", vin: "VINCA0006", year: 2016, make: "Nissan", model: "Sentra", odometer_miles: 90000 }
              as: Appraiser
              captures: { v6: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v6}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a6: $.data.id }
            - call: "POST /atl/appraisals/${a6}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-6"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b6}", appraisal_id: "${a6}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app6: $.data.id }
            - call: "POST /atl/applications/${app6}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "underwriter-4"
              captures: { loan6: $.data.id }
            - call: "POST /atl/devices"
              payload: { vehicle_id: "${v6}", serial_number: "SER-CA-6" }
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/loans/${loan6}/assess-delinquency"
              payload: {}
              as: LoanServicer
            - call: "POST /atl/loans/${loan6}/declare-default"
              payload: {}
              as: LoanServicer
            - call: "GET /atl/loans/${loan6}/repossession-orders"
              payload: {}
              as: RecoveryManager
              captures: { repo6: "$.data[0].id" }
            - call: "POST /atl/repossession-orders/${repo6}/assignments"
              payload: { agent_name: "Agent A", window_start: "2026-03-16T08:00:00.000Z", window_end: "2026-03-16T12:00:00.000Z" }
              as: RecoveryManager
            - call: "POST /atl/repossession-orders/${repo6}/assign"
              payload: {}
              as: RecoveryManager
            - call: "POST /atl/repossession-orders/${repo6}/recover"
              payload: {}
              as: RecoveryManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-30T00:00:00.000Z" }
              as: ComplianceAdmin
          trigger:
            - call: "POST /atl/repossession-orders/${repo6}/sell"
              payload: { sale_proceeds_cents: 500000 }
              as: RecoveryManager
          assert:
            - "RepossessionOrder.${repo6}.status == SOLD"
            - "RepossessionOrder.${repo6}.deficiency_cents == 195176"
            - "Loan.${loan6}.payoff_status == CHARGED_OFF"

  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: declare_default_to_repo_to_device_disable_depth3
        grounds:
          - state_machines.Loan.DELINQUENT_to_DEFAULT
          - state_machines.RepossessionOrder.ORDERED_to_ASSIGNED
          - state_machines.Device.ENABLED_to_DISABLED
          - entities.Device.fields.active_disable_count
        distinguishing_aspect: |
          DEPTH-3 chain from declare-default: declare-default mutates Loan (A) -> creating that DEFAULT
          itself spawns RepossessionOrder ORDERED (B) -> the ORDERED repo itself issues a
          STARTER_DISABLE DeviceCommand setting Device DISABLED (C). Each link caused by the prior link.
        test_recipe:
          setup:
            - "CA loan DELINQUENT with device ENABLED; assess-delinquency already issued one DISABLE (count=1, then we ENABLE to isolate the chain)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ca7@x.com", full_name: "CA Seven", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b7: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b7}", vin: "VINCA0007", year: 2018, make: "Honda", model: "Accord", odometer_miles: 55000 }
              as: Appraiser
              captures: { v7: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v7}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a7: $.data.id }
            - call: "POST /atl/appraisals/${a7}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-7"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b7}", appraisal_id: "${a7}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app7: $.data.id }
            - call: "POST /atl/applications/${app7}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "underwriter-5"
              captures: { loan7: $.data.id }
            - call: "POST /atl/devices"
              payload: { vehicle_id: "${v7}", serial_number: "SER-CA-7" }
              as: LoanServicer
              captures: { dev7: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/loans/${loan7}/assess-delinquency"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /atl/loans/${loan7}/declare-default"
              payload: {}
              as: LoanServicer
            - call: "GET /atl/devices/${dev7}"
              payload: {}
              as: LoanServicer
              captures: { st: $.data.starter_state, cnt: $.data.active_disable_count }
            - call: "GET /atl/loans/${loan7}/repossession-orders"
              payload: {}
              as: RecoveryManager
              captures: { repo7: "$.data[0].id" }
          assert:
            - "Loan.${loan7}.delinquency_status == DEFAULT"
            - "a RepossessionOrder with status ORDERED exists for loan ${loan7}"
            - "Device.${dev7}.starter_state == DISABLED and Device.${dev7}.active_disable_count == 2"

      - name: redemption_to_lien_release_to_vehicle_clear_depth2
        grounds:
          - state_machines.Loan.OUTSTANDING_to_REDEEMED
          - state_machines.TitleLien.FILED_to_RELEASED
