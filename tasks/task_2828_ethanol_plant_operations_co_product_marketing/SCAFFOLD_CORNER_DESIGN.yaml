      - name: permit_rolling_average_excludes_the_reading_at_the_window_start
        claim_type: correct_result
        grounds:
          - calculations.permit_rolling_average
          - entities.PermitCondition.fields.readings_in_window
          - entities.PermitCondition.fields.exceedance_count
        distinguishing_aspect: |
          The window is start-exclusive and end-inclusive: with the clock at
          2026-09-05T00:00:00Z and a 24 hour period, readings of 13.000 and
          12.400 inside the window average 12.700 and exceed the 12.500 limit,
          while a 2.000 reading measured exactly at 2026-09-04T00:00:00Z is
          excluded — including it would give 9.133 and no exceedance at all.
          exceedance_count also stays 1, because it only increments on the
          COMPLIANT to EXCEEDANCE crossing.
        test_recipe:
          setup:
            - "Plant exists; permit condition VOC-1 is AIR_EMISSIONS, MINOR, limit 12.500 lb/hr over 24 hours; the clock is 2026-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/permit-conditions"
              payload: { condition_code: "VOC-1", permit_type: "AIR_EMISSIONS", parameter_name: "VOC", limit_value: 12.500, unit: "lb/hr", averaging_period_hours: 24, severity: "MINOR" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { pc1_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/permit-conditions/${pc1_id}/readings"
              payload: { value: 13.000, measured_at: "2026-09-04T12:00:00Z", sample_reference: "R-1" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { r1_id: $.data.id }
            - call: "POST /ethanol-ops/permit-conditions/${pc1_id}/readings"
              payload: { value: 12.400, measured_at: "2026-09-04T18:00:00Z", sample_reference: "R-2" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { r2_id: $.data.id }
            - call: "POST /ethanol-ops/permit-conditions/${pc1_id}/readings"
              payload: { value: 2.000, measured_at: "2026-09-04T00:00:00Z", sample_reference: "R-3" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { r3_id: $.data.id }
            - call: "GET /ethanol-ops/permit-conditions/${pc1_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { st: $.data.status, rav: $.data.rolling_average_value, riw: $.data.readings_in_window, ec: $.data.exceedance_count, lea: $.data.last_exceedance_at }
          assert:
            - "All three appends return HTTP 201 and GET .../readings returns 3 rows, including ${r3_id}"
            - "${riw} == 2 — ${r3_id} sits exactly on the window start and is outside it"
            - "${rav} == 12.700 (not 9.133)"
            - "${st} == EXCEEDANCE and ${ec} == 1 (the second and third appends did not re-increment it)"
            - "${lea} == 2026-09-05T00:00:00Z"
            - "Plant.${plant_id}.compliance_posture == RESTRICTED and daily_grind_cap_bushels == 81000 (floor(120000 * 0.90 * 0.75), the empty contract book being SHORT)"

      - name: ci_waterfall_truncates_the_straddling_project_and_zeroes_the_rest
        claim_type: waterfall_allocation
        grounds:
          - calculations.plant_ci_score
          - entities.CarbonProject.fields.credited_reduction_g_per_mj
          - entities.Plant.fields.lcfs_credit_tonnes_per_million_gal
        distinguishing_aspect: |
          The 12.0 g/MJ cap is consumed in certification order: 8.000 for the
          FULL project, 2.100 for the PROVISIONAL one stacked on a predecessor
          (6.0 * 0.70 * 0.50), only the remaining 1.900 of a 5.000 claim for the
          third, and 0.000 for the fourth. The plant lands on ci_score 48.000
          and 2587.943 LCFS tonnes per million gallons; the projects' own
          claimed_reduction_g_per_mj values never enter the sum.
        test_recipe:
          setup:
            - "Plant exists with baseline_ci_g_per_mj 60.0; CP-1 (FULL) is CERTIFIED at 8.0, CP-2 (PROVISIONAL, predecessor CP-1) at 6.0, CP-3 (FULL) at 5.0; CP-4 (FULL) is SUBMITTED."
