              as: LicensingAgent
            - call: "POST /music-library/licenses"
              payload: { license_mode: "BLANKET", expected_composition_version: "${comp1_v1}", composition_id: "${comp1}", blanket_agreement_id: "${ba1}", tier_id: "${tierBlk}", media_type: "BROADCAST_TV", distribution_scale: "NATIONAL", term_start: "2026-08-01T00:00:00Z", term_months: 12 }
              as: LicensingAgent
              captures: { licBlk: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: LicensingAgent
            - call: "GET /music-library/compositions/${comp1}"
              payload: {}
              as: LicensingAgent
              captures: { comp1_v2: $.data.version }
            - call: "POST /music-library/licenses"
              payload: { license_mode: "BLANKET", expected_composition_version: "${comp1_v2}", composition_id: "${comp1}", blanket_agreement_id: "${ba1}", tier_id: "${tierBlk}", media_type: "BROADCAST_TV", distribution_scale: "NATIONAL", term_start: "2026-09-16T00:00:00Z", term_months: 6 }
              as: LicensingAgent
          assert:
            - "the first issuance returns error_id == ERR_BLANKET_NOT_ACTIVE with status 409 while BlanketAgreement.${ba1}.coverage_status == DRAFT"
            - "after activate: BlanketAgreement.${ba1}.coverage_status == ACTIVE and reporting_status == COMPLIANT"
            - "the second issuance returns 201 with License.${licBlk}.license_mode == BLANKET, final_fee_cents == 0, is_exclusive == false, licensee_id == ${lee1}"
            - "License.${licBlk}.term_start == 2026-08-01T00:00:00Z, term_months == 12, term_end == 2027-07-31T00:00:00Z"
            - "no SYNC_FEE RoyaltyLedgerEntry is appended for ${c1} because composer_sync_share_cents == 0 on a blanket licence"
            - "the clock-set response lists ${ba1} in delinquent_blanket_agreement_ids"
            - "after the clock move: BlanketAgreement.${ba1}.reporting_status == DELINQUENT, delinquent_since == 2026-09-16T00:00:00Z, coverage_status still ACTIVE"
            - "the third issuance returns error_id == ERR_BLANKET_NOT_ACTIVE with status 409, this time caused by the reporting axis alone"
            - "License.${licBlk}.status == ISSUED and Composition.${comp1}.active_license_count == 1 (the two failed calls created nothing)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: exclusive_holdback_block_day_inclusive_on_composition
        grounds:
          - validations[priority=17]
          - errors[ERR_EXCLUSIVE_WINDOW_CONFLICT]
          - entities.License.fields.exclusive_block_until
          - entities.Composition.fields.exclusive_block_until
          - entities.ComposerAgreement.fields.holdback_days
          - entities.License.fields.term_end
        distinguishing_aspect: |
          Interval semantics A on the Composition resource: a CLOSED occupation extended by a 90-day
          holdback buffer, where the block day itself is still occupied. An exclusive licence running
          2026-09-01..2028-08-31 pushes Composition.exclusive_block_until to 2028-11-29, so a new term
          starting exactly on 2028-11-29 is refused and 2028-11-30 is accepted.
        test_recipe:
          setup:
            - "Composer with an ACTIVE EXCLUSIVE agreement carrying holdback_days 90."
            - "One CATALOGED composition under that agreement."
            - "BROADCAST_TV tier base_rate_cents 300000, scales LOCAL/NATIONAL/WORLDWIDE, term range 1-120."
            - "Licensee with credit_limit_cents 5000000."
            - "An exclusive PER_USE License already ISSUED for term_start 2026-09-01 over 24 months (fee 886421)."
            - "Two further ACCEPTED sync requests on the same work: one with requested_term_start 2028-11-29 and one with 2028-11-30, both non-exclusive, 12 months."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Lucía Ferrer", pro_affiliation: "SESAC", payee_country: "US", tax_withholding_pct: 0.30 }
