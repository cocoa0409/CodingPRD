      - name: cooling_capacity_gate_blocks_energization
        excluded_because:
          difficulty_instance: cooling_load_at_exact_capacity_is_admitted_one_step_beyond_is_refused
          rationale: "§1.8 already drives ERR_COOLING_CAPACITY_EXCEEDED at the exact-equality boundary and one step past it, covering both the violation and the satisfaction side of priority 25."

      - name: row_density_ceiling_gate_blocks_energization
        excluded_because:
          difficulty_instance: energize_cascade_depth_five_density_capped_blocks_neighbour_circuit
          rationale: "§1.8 refuses a 17.600 kW projection against the 16.000 kW density ceiling and asserts the DENSITY_CAPPED posture that follows, covering priority 29 end to end."

      - name: row_not_accepting_space_gate_blocks_cabinet_reservation
        excluded_because:
          difficulty_instance: cabinet_space_and_power_both_follow_the_row_decommission_flag
          rationale: "§1.8 flips decommission_flag and asserts ERR_ROW_NOT_ACCEPTING_SPACE on both the cabinet-reservation and the energize path, covering priority 19."

      - name: route_revision_limit_gate
        excluded_because:
          difficulty_instance: route_revision_cycle_bounded_at_two_conserves_port_pool
          rationale: "§1.8 walks the cycle to revision_count 2 and asserts ERR_REVISION_LIMIT_REACHED on the third request-changes, covering priority 17."

      - name: dispatch_requires_ticket_authorization
        excluded_because:
          difficulty_instance: revoke_authorization_cancels_dispatched_execution_dimension
          rationale: "§1.8 dispatches an unauthorized ticket and asserts ERR_TICKET_NOT_AUTHORIZED before authorizing it, covering priority 16."

      - name: invoice_line_double_reversal_gate
        excluded_because:
          difficulty_instance: remote_hands_reversal_restores_both_money_and_bundled_minutes
          rationale: "§1.8 reverses a labour line and then attempts the same adjustment again, asserting ERR_LINE_ALREADY_REVERSED, covering priority 14."

      - name: visit_window_conflict_gate
        excluded_because:
          difficulty_instance: cabinet_visit_windows_are_half_open_so_touching_windows_coexist
          rationale: "§1.8 asserts both the ERR_VISIT_WINDOW_CONFLICT overlap and the touching-window acceptance on the same cabinet, covering priority 35."

      - name: escort_capacity_gate
        excluded_because:
          difficulty_instance: row_escort_capacity_is_closed_interval_so_touching_windows_collide
          rationale: "§1.8 asserts ERR_ESCORT_CAPACITY_EXCEEDED for touching escort windows in one row, covering priority 36 and its deliberately closed-interval semantics."

      - name: credit_hold_gate_on_order_intake
        excluded_because:
          difficulty_instance: contract_lifecycle_gate_outranks_credit_hold_gate_on_order_intake
          rationale: "§1.8 raises an order against a credit-held contract and asserts ERR_CREDIT_HOLD_ACTIVE once the higher-priority lifecycle gate is satisfied, covering priority 38 and the 18-before-38 ordering."

  # ===========================================================================
  # From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_endpoint_echoes_the_logical_now_and_mutates_no_entity
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/colocation/_clock/set_current_utc
          - complexity_profile.consistency_model
        distinguishing_aspect: "The clock endpoint returns a bare { current_utc } payload rather than an entity, mutates nothing by itself, and yet every later system timestamp reads from it — proving the harness controls time deterministically without any wall-clock dependency."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with one customer and one NOT_ENROLLED contact."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Dune Ledger", account_code: "DLG" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/contacts"
              payload: { customer_id: "${cust_id}", full_name: "Wren Halloway", authorization_scopes: ["SITE_ACCESS"], access_level: "UNESCORTED" }
              as: SecurityOfficer
              captures: { contact_id: $.data.id }
          trigger:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T12:00:00Z" }
              as: BillingOperator
            - call: "POST /colocation/contacts/${contact_id}/biometric-state"
              payload: { to_state: "ENROLLED" }
              as: SecurityOfficer
          assert:
            - "First trigger call returns 200 with data.current_utc == 2026-09-15T12:00:00Z"
            - "Second call returns 200 with data.biometric_state == ENROLLED and data.enrolled_at == 2026-09-15T12:00:00Z — the system timestamp is drawn from the logical clock, never from wall time"
            - "GET /colocation/customers/${cust_id} still shows the created_at recorded under the OLD clock, 2026-08-01T00:00:00Z — setting the clock rewrites nothing already stored"

      - name: credit_hold_toggle_flips_the_flag_without_changing_contract_status
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/colocation/contracts/{contract_id}/credit-hold
          - entities.Contract.fields.credit_hold
          - validations.priority_38
        distinguishing_aspect: "credit_hold is an orthogonal commercial dimension: raising it leaves the contract ACTIVE (no lifecycle transition happens) and retro-actively cancels nothing, and clearing it restores intake — the flag gates future writes only."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract ACTIVE with one RESERVED cabinet and credit_hold false."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Dune Ledger", account_code: "DLG" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H7", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9501", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
          trigger:
            - call: "POST /colocation/contracts/${ctr_id}/credit-hold"
              payload: { credit_hold: true }
              as: BillingOperator
            - call: "POST /colocation/contracts/${ctr_id}/credit-hold"
              payload: { credit_hold: false }
              as: BillingOperator
          assert:
            - "First trigger call returns 200 with data.credit_hold == true AND data.status == ACTIVE — no lifecycle transition is implied"
            - "Second call returns 200 with data.credit_hold == false and data.status still ACTIVE"
            - "GET /colocation/cabinets?contract_id=${ctr_id} still returns the RESERVED cabinet — the hold cancels nothing already provisioned"

      - name: row_repricing_recomputes_ceilings_and_bumps_the_row_version
        claim_type: computed_read
        grounds:
          - endpoints.PATCH_/colocation/rows/{row_id}
          - calculations.row_capacity_and_posture
        distinguishing_aspect: "PATCH on the row changes no cabinet and no circuit, yet density_ceiling_kw (design_density x occupied slots), effective_ceiling_kw (the three-way min) and both stranded views are all re-derived and the version bumps — so the ceilings are genuinely computed, never stored client values."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row R2 with design_density 10.0, max_row_power 200.0, cooling_capacity 60.0 and two RESERVED cabinets, so density_ceiling_kw == 20.000 and effective_ceiling_kw == 20.000."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Dune Ledger", account_code: "DLG" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H7", row_code: "R2", cabinet_slot_count: 8, design_density_kw_per_cabinet: 10.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9502", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 2, power_commit_kw: 40.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab1_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C02", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab2_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab2_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv1: $.data.version }
          trigger:
            - call: "PATCH /colocation/rows/${row_id}"
              payload: { design_density_kw_per_cabinet: 30.0 }
              as: FacilityManager
            - call: "PATCH /colocation/rows/${row_id}"
              payload: { cooling_capacity_kw: 15.0 }
              as: FacilityManager
          assert:
            - "Before the PATCH the row reported density_ceiling_kw == 20.000, effective_ceiling_kw == 20.000 and stranded_nameplate_kw == 20.000"
            - "First trigger call returns 200 with density_ceiling_kw == 60.000, effective_ceiling_kw == 60.000 (min of 200.0, 60.000, 60.0), stranded_nameplate_kw == 60.000 and row_status == OPEN"
            - "Second call returns 200 with effective_ceiling_kw == 15.000 — cooling capacity is now the binding constraint — and stranded_nameplate_kw == 15.000, row_status still OPEN because cooling_load_kw 0.000 < 13.500"
            - "version is exactly ${rv1} + 2 after the two PATCHes, and occupied_slot_count is unchanged at 2"

      - name: meter_readings_are_appended_in_request_order_and_refresh_the_measured_view
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/colocation/power-circuits/{circuit_id}/readings
          - calculations.row_capacity_and_posture.variants.measured_view
        distinguishing_aspect: "Readings are an append-only log with NO state gate on the circuit — a DESIGNED circuit accepts them — and they are stored in REQUEST order, not chronological order, while measured_peak_kw is order-independent because it is a max over the trailing window."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z (30-day window opens 2026-07-02T00:00:00Z)."
            - "Row R3 with design_density 25.0, one RESERVED cabinet (density_ceiling 25.000, effective_ceiling 25.000) and one DESIGNED circuit."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Dune Ledger", account_code: "DLG" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H7", row_code: "R3", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9503", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 50, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_id: $.data.id }
          trigger:
            - call: "POST /colocation/power-circuits/${cir_id}/readings"
              payload: { interval_start: "2026-07-25T00:00:00Z", interval_end: "2026-07-26T00:00:00Z", kwh: 100.0, peak_kw: 7.0 }
              as: BillingOperator
            - call: "POST /colocation/power-circuits/${cir_id}/readings"
              payload: { interval_start: "2026-07-15T00:00:00Z", interval_end: "2026-07-16T00:00:00Z", kwh: 100.0, peak_kw: 11.0 }
              as: BillingOperator
            - call: "POST /colocation/power-circuits/${cir_id}/readings"
              payload: { interval_start: "2026-07-20T00:00:00Z", interval_end: "2026-07-21T00:00:00Z", kwh: 100.0, peak_kw: 4.0 }
              as: BillingOperator
          assert:
            - "All three calls return 201 even though the circuit is only DESIGNED — readings carry no state gate"
            - "data.meter_intervals holds the three rows in REQUEST order with peak_kw 7.0, 11.0, 4.0 — deliberately not sorted by interval_start"
            - "GET /colocation/rows/${row_id} shows measured_peak_kw == 11.000 and stranded_measured_kw == 14.000 (25.000 - 11.000)"
            - "The same row still reports stranded_nameplate_kw == 25.000 because no circuit is ENERGIZED — the two variants diverge on identical data"

      - name: billing_close_computed_read
        excluded_because:
          difficulty_instance: power_billing_metered_final_versus_deemed_capacity
          rationale: "§1.8 exercises POST /colocation/contracts/{contract_id}/billing-close end to end for both billing variants, asserting every appended InvoiceLine and the refreshed rollups, so a separate endpoint-level happy path would duplicate it."

      - name: invoice_adjustment_cross_reference_link
        excluded_because:
          difficulty_instance: remote_hands_reversal_restores_both_money_and_bundled_minutes
          rationale: "§1.8 posts POST /colocation/contracts/{contract_id}/invoice-adjustments against a labour line and asserts the reversal line plus the restored bundle, covering this endpoint's link semantics and side effects."

  # ===========================================================================
  # From Table 6 (Errors) — every catalogued error must be triggerable.
  # The four remaining NOT_FOUND codes for Customer, Contract, FloorRow and
  # AuthorizedContact are already driven in the `entities` section above; the
  # eight below close the catalogue. Each uses a syntactically valid UUID that
  # was never issued, so the 404 is a lookup miss and not ERR_INVALID_REQUEST.
  # ===========================================================================
  - section: errors
    instances:
      - name: cabinet_get_with_unissued_uuid_returns_not_found
        claim_type: error_triggerability
        grounds:
          - errors[ERR_CABINET_NOT_FOUND]
          - endpoints.GET_/colocation/cabinets/{cabinet_id}
        distinguishing_aspect: "A well-formed but never-issued UUID must reach the lookup and miss (404), which distinguishes ERR_CABINET_NOT_FOUND from the malformed-input error at priority 11."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no cabinet has ever been created."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/cabinets/8c1f0d2a-4b7e-4a91-9d33-51ac0e6b7f10"
              as: FacilityManager
          assert:
            - "Response is 404 and data.error_id == ERR_CABINET_NOT_FOUND"

      - name: power_circuit_get_with_unissued_uuid_returns_not_found
        claim_type: error_triggerability
        grounds:
          - errors[ERR_CIRCUIT_NOT_FOUND]
          - endpoints.GET_/colocation/power-circuits/{circuit_id}
        distinguishing_aspect: "The circuit lookup miss is reported by its own code rather than being folded into the parent cabinet's NOT_FOUND, keeping the 404 vocabulary per-entity."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no power circuit exists."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/power-circuits/2f6b95c4-1d08-4c7a-8e52-b0a4d9137c6e"
              as: ProvisioningEngineer
          assert:
            - "Response is 404 and data.error_id == ERR_CIRCUIT_NOT_FOUND"

      - name: patch_panel_port_get_with_unissued_uuid_returns_not_found
        claim_type: error_triggerability
        grounds:
          - errors[ERR_PORT_NOT_FOUND]
          - endpoints.GET_/colocation/patch-panel-ports/{port_id}
        distinguishing_aspect: "Ports are looked up independently of any order, so the miss is ERR_PORT_NOT_FOUND and never ERR_PORT_UNAVAILABLE — an unknown port is not an occupied port."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no patch panel port exists."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/patch-panel-ports/be0c5a71-9f42-4d68-b1c7-3e8f5206ad94"
              as: ProvisioningEngineer
          assert:
            - "Response is 404 and data.error_id == ERR_PORT_NOT_FOUND"

      - name: cross_connect_order_get_with_unissued_uuid_returns_not_found
        claim_type: error_triggerability
        grounds:
          - errors[ERR_CROSS_CONNECT_ORDER_NOT_FOUND]
          - endpoints.GET_/colocation/cross-connect-orders/{order_id}
        distinguishing_aspect: "The path-id miss is resolved at priority 3, ahead of every route, port and contract gate that the order's action endpoints would otherwise apply."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no cross-connect order exists."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/cross-connect-orders/5a7d3e18-6c20-4b9f-a4d1-7f92c8b03e56"
              as: ProvisioningEngineer
          assert:
            - "Response is 404 and data.error_id == ERR_CROSS_CONNECT_ORDER_NOT_FOUND"

      - name: remote_hands_ticket_get_with_unissued_uuid_returns_not_found
        claim_type: error_triggerability
        grounds:
          - errors[ERR_TICKET_NOT_FOUND]
          - endpoints.GET_/colocation/remote-hands-tickets/{ticket_id}
        distinguishing_aspect: "An unknown ticket id yields ERR_TICKET_NOT_FOUND rather than ERR_TICKET_NOT_AUTHORIZED — the authorization dimension is only consulted once the ticket resolves."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no remote-hands ticket exists."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/remote-hands-tickets/c93a41f7-08d5-4e62-9b1a-6d27e5f0ac38"
              as: ProvisioningEngineer
          assert:
            - "Response is 404 and data.error_id == ERR_TICKET_NOT_FOUND"

      - name: access_visit_get_with_unissued_uuid_returns_not_found
        claim_type: error_triggerability
        grounds:
          - errors[ERR_VISIT_NOT_FOUND]
          - endpoints.GET_/colocation/access-visits/{visit_id}
        distinguishing_aspect: "The visit miss precedes the biometric, escort and window gates entirely, so a SecurityOfficer reading an unknown visit gets a plain 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no access visit exists."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/access-visits/7b4e26d0-3af9-41c5-8e07-92b6c1d4508a"
              as: SecurityOfficer
          assert:
            - "Response is 404 and data.error_id == ERR_VISIT_NOT_FOUND"

      - name: decommission_order_get_with_unissued_uuid_returns_not_found
        claim_type: error_triggerability
        grounds:
          - errors[ERR_DECOMMISSION_ORDER_NOT_FOUND]
          - endpoints.GET_/colocation/decommission-orders/{order_id}
        distinguishing_aspect: "Decommission orders have their own 404 code, so a mistyped id can never be confused with the cross-connect order namespace even though both use /{order_id}."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no decommission order exists."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/decommission-orders/1d8fa350-72b6-4c98-b3e5-0a4197df62cb"
              as: ProvisioningEngineer
          assert:
            - "Response is 404 and data.error_id == ERR_DECOMMISSION_ORDER_NOT_FOUND"

      - name: invoice_line_get_with_unissued_uuid_returns_not_found
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INVOICE_LINE_NOT_FOUND]
          - endpoints.GET_/colocation/invoice-lines/{invoice_line_id}
        distinguishing_aspect: "InvoiceLine is the one entity without common_fields, yet it still owns a NOT_FOUND code — immutability does not exempt it from the standard lookup contract."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no billing period has been closed, so no invoice line exists."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/invoice-lines/e4c07b96-58d1-4a23-9f60-b8d3e2915a47"
              as: BillingOperator
          assert:
            - "Response is 404 and data.error_id == ERR_INVOICE_LINE_NOT_FOUND"

  # ===========================================================================
  # From Table 7 (RBAC) — five roles, role_model: segregation_of_duties
  # ===========================================================================
  - section: rbac
    instances:
      - name: unknown_role_header_is_unauthenticated
        claim_type: authentication
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations.priority_1
          - roles
        distinguishing_aspect: "A header carrying a role name that is not one of the five declared roles is treated as unauthenticated (401), not as an authorization failure (403) — priority 1 runs before priority 2, so an unknown principal never reaches the permission table."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "POST /colocation/rows"
              payload: { hall_code: "H8", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0 }
              as: HallSupervisor
          assert:
            - "Response is 401 and data.error_id == ERR_UNAUTHENTICATED"
            - "GET /colocation/rows as FacilityManager returns 0 rows — the rejected request created nothing"

      - name: provisioning_engineer_cannot_create_a_floor_row
        claim_type: exclusive_operation_denied
        grounds:
          - roles.FacilityManager.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - endpoints.POST_/colocation/rows
        distinguishing_aspect: "Floor-row creation and repricing are the FacilityManager's only exclusive operations; the ProvisioningEngineer who otherwise owns power and routing cannot mint the space inventory it consumes."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
