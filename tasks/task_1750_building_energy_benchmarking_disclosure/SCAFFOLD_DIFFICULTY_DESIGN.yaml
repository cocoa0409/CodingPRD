            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/benchmark-reports/${rep1}/verification-records", payload: { verifier_id: "${v1}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { vr1: $.data.id } }
            - { call: "POST /v1/verification-records/${vr1}/sign-off", payload: {}, as: DataVerifier, as_user_id: "${v1}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2027-06-02T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/reporting-cycles/${c27}/close-filing", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/reporting-cycles/${c27}/disclosure-publications", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1", captures: { pub1: $.data.id } }
            - { call: "POST /v1/disclosure-publications/${pub1}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /v1/usage-records/${ur1}/void", payload: { reason: "Meter misread; full-year correction pending" }, as: UtilityAgent }
            - { call: "GET /v1/benchmark-reports/${rep1}", as: ComplianceOfficer, captures: { r_status: $.data.status, r_agg: $.data.aggregated_kbtu, r_eui: $.data.site_eui } }
            - { call: "GET /v1/anomaly-flags", payload: { report_id: "${rep1}", status: "OPEN" }, as: ComplianceOfficer, captures: { af_type: "$.data[0].anomaly_type" } }
            - { call: "GET /v1/disclosure-publications", payload: { cycle_id: "${c27}", status: "SUPERSEDED" }, as: ComplianceOfficer, captures: { pub_old_v: "$.data[0].publication_version" } }
            - { call: "GET /v1/disclosure-publications", payload: { cycle_id: "${c27}", status: "DRAFT" }, as: ComplianceOfficer, captures: { pub_new_v: "$.data[0].publication_version" } }
          assert:
            - "UsageRecord.${ur1}.status == VOIDED"
            - "link 1: BenchmarkReport.${rep1}.aggregated_kbtu == 0 and site_eui == 0.00 (recomputed without the voided record)"
            - "link 2: report downgraded VERIFIED -> FLAGGED (delta |0.00 - 81.89|/81.89 = 100.00 > tolerance 5); exactly one OPEN AnomalyFlag with anomaly_type == VERIFICATION_REOPENED"
            - "link 3: the PUBLISHED publication is SUPERSEDED (publication_version 1) and a replacement DRAFT with publication_version == 2 exists"

      - name: close_filing_creates_fines_and_restricts_owner
        grounds:
          - state_machines.ReportingCycle.OPEN_to_FILING_CLOSED
          - calculations.owner_fine_exposure
          - entities.FineAssessment.fields.fine_type
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST close-filing): the cycle
          sweep creates a NON_COMPLIANCE FineAssessment for each covered building
          lacking verification (link 1), and each fine creation recomputes
          owner_fine_exposure, flipping the owner to RESTRICTED (link 2) — while
          a verified peer building in the same sweep gets nothing.
        test_recipe:
          setup:
            - "Owners oV and oN; verifier v1; cycle c27 OPEN (standard constants)"
            - "bV (oV): 50000 sqft OFFICE, full consents (units 20000/15000/5000, u1+u2 granted), one 1200000 kWh record, report submitted on time and VERIFIED (eui 81.89, target 90.00, no performance fine)"
            - "bN (oN): 30000 sqft OFFICE, covered, NO report at all"
            - "Clock 2027-06-02T00:00:00Z (past deadline)"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner V", contact_email: "ov@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { oV: $.data.id } }
            - { call: "POST /v1/owners", payload: { name: "Owner N", contact_email: "on@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { oN: $.data.id } }
            - { call: "POST /v1/verifiers", payload: { name: "Verifier I", license_number: "LIC-I" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "10 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${oV}", captures: { bV: $.data.id } }
            - { call: "POST /v1/buildings/${bV}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${oV}", captures: { uv1: $.data.id } }
            - { call: "POST /v1/buildings/${bV}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${oV}", captures: { uv2: $.data.id } }
            - { call: "POST /v1/buildings/${bV}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${oV}" }
            - { call: "POST /v1/tenant-units/${uv1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${oV}", captures: { cgv1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cgv1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${uv1}" }
            - { call: "POST /v1/tenant-units/${uv2}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${oV}", captures: { cgv2: $.data.id } }
            - { call: "POST /v1/consent-grants/${cgv2}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${uv2}" }
            - { call: "POST /v1/buildings/${bV}/utility-accounts", payload: { account_number: "E-1", commodity: "ELECTRICITY" }, as: BuildingOwner, as_user_id: "${oV}", captures: { accV: $.data.id } }
            - { call: "POST /v1/utility-accounts/${accV}/usage-records", payload: { period_start: "2027-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", consumption_value: 1200000 }, as: UtilityAgent }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${bV}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${oV}", captures: { repV: $.data.id } }
            - { call: "POST /v1/benchmark-reports/${repV}/submit", payload: {}, as: BuildingOwner, as_user_id: "${oV}" }
            - { call: "POST /v1/benchmark-reports/${repV}/verification-records", payload: { verifier_id: "${v1}" }, as: BuildingOwner, as_user_id: "${oV}", captures: { vrV: $.data.id } }
            - { call: "POST /v1/verification-records/${vrV}/sign-off", payload: {}, as: DataVerifier, as_user_id: "${v1}" }
            - { call: "POST /v1/buildings", payload: { address: "11 Main St", gross_floor_area_sqft: 30000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${oN}", captures: { bN: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2027-06-02T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /v1/reporting-cycles/${c27}/close-filing", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1", captures: { cyc_status: $.data.status } }
            - { call: "GET /v1/fine-assessments", payload: { building_id: "${bN}" }, as: ComplianceOfficer, captures: { fN: "$.data[0].id", fN_type: "$.data[0].fine_type", fN_amt: "$.data[0].provisional_amount_cents" } }
            - { call: "GET /v1/fine-assessments", payload: { building_id: "${bV}" }, as: ComplianceOfficer }
            - { call: "GET /v1/owners/${oN}", as: ComplianceOfficer, captures: { oN_out: $.data.outstanding_fines_cents, oN_stand: $.data.standing } }
            - { call: "GET /v1/owners/${oV}", as: ComplianceOfficer, captures: { oV_out: $.data.outstanding_fines_cents, oV_stand: $.data.standing } }
          assert:
            - "cycle status == FILING_CLOSED"
            - "link 1: exactly one fine for ${bN}: fine_type == NON_COMPLIANCE, status == ASSESSED, provisional_amount_cents == 500000"
            - "verified peer: GET fines for ${bV} returns total_count == 0 (no NON_COMPLIANCE; eui 81.89 <= threshold 94.50 so no PERFORMANCE_SHORTFALL)"
            - "link 2: Owner.${oN}.outstanding_fines_cents == 500000 and standing == RESTRICTED (500000 > 100000)"
            - "Owner.${oV}.outstanding_fines_cents == 0 and standing == NORMAL"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_double_submit
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_OWNER_RESTRICTED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the second submit violates
          BOTH the report's from-state rule (SUBMITTED, not DRAFT|FLAGGED) AND
          the owner-standing fiscal gate (outstanding 120000 > 100000 after the
          first late submit); state (priority 7) must win over fiscal (11).
        test_recipe:
          setup:
            - "Owner o1; cycle c27 OPEN (standard constants); building b1 50000 sqft OFFICE; units 20000/15000/5000; consents u1,u2 (completeness 90.00)"
            - "Report rep1 DRAFT; clock 2027-06-25T00:00:00Z (24 days past deadline)"
            - "First submit succeeds: SUBMITTED + LATE_SUBMISSION fine 24*5000 = 120000 -> owner outstanding 120000 -> standing RESTRICTED"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner J", contact_email: "oj@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "12 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u2: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
            - { call: "POST /v1/tenant-units/${u2}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg2: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg2}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u2}" }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2027-06-25T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "GET /v1/owners/${o1}", as: ComplianceOfficer, captures: { o_stand: $.data.standing, o_out: $.data.outstanding_fines_cents } }
          trigger:
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { err: "$.data.error_id" } }
          assert:
            - "precondition held: Owner.${o1}.standing == RESTRICTED and outstanding_fines_cents == 120000 (fiscal violation genuinely armed)"
            - "second submit fails with err == ERR_INVALID_STATE_TRANSITION (409), NOT ERR_OWNER_RESTRICTED — state (priority 7) beats fiscal (priority 11)"

      - name: temporal_beats_constraint_on_late_incomplete_submit
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_FILING_CLOSED]
          - errors[ERR_DATA_COMPLETENESS_BELOW_THRESHOLD]
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint (different from
          the state-vs-fiscal pair): the submit violates BOTH the cycle gate
          (FILING_CLOSED) AND completeness (60.00 < 90); temporal (priority 8)
          must win over constraint (priority 10).
        test_recipe:
          setup:
            - "Owner o1; cycle c27 OPEN (standard constants); building b1 50000 sqft OFFICE; units 20000/15000/5000; consent ONLY for u1 -> completeness (10000+20000)/50000 = 60.00"
            - "Report rep1 DRAFT created while cycle OPEN; clock 2027-06-02T00:00:00Z; close-filing (also sweeps a NON_COMPLIANCE fine onto b1)"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner K", contact_email: "ok@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "13 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id, comp: $.data.data_completeness_pct } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2027-06-02T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/reporting-cycles/${c27}/close-filing", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { err: "$.data.error_id" } }
          assert:
            - "precondition held: report data_completeness_pct == 60.00 (< 90) AND cycle FILING_CLOSED"
            - "submit fails with err == ERR_FILING_CLOSED (409), NOT ERR_DATA_COMPLETENESS_BELOW_THRESHOLD — temporal (priority 8) beats constraint (priority 10)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
