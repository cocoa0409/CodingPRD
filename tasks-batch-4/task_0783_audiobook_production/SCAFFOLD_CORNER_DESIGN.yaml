scaffold_corner_design:
  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: create_title_returns_created_with_system_fields
        claim_type: Creation
        grounds: [entities.Title, endpoints]
        distinguishing_aspect: "POST /titles with all required fields returns 201 with status DRAFT, rights_status ACTIVE, finished_hours 0, version 1, and a server-minted id."
        test_recipe:
          setup:
            - "An onboarded Author."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AC1", email: "ac1@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
          trigger:
            - call: "POST /titles"
              payload: { title_name: "CT1", isbn: "C1", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
          assert:
            - "Title.${ti}.status == DRAFT"
            - "Title.${ti}.rights_status == ACTIVE"
            - "Title.${ti}.finished_hours == 0"
            - "Title.${ti}.version == 1"

      - name: get_nonexistent_title_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Title", "errors[ERR_TITLE_NOT_FOUND]"]
        distinguishing_aspect: "GET /titles/{id} with a well-formed but unknown UUID returns ERR_TITLE_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /titles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TITLE_NOT_FOUND"

      - name: create_contract_missing_deal_type_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Contract.fields.deal_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /contracts omitting the required deal_type field returns ERR_VALIDATION (400)."
        test_recipe:
          setup:
            - "A CASTING-eligible title with an ACCEPTED audition (title OPEN_FOR_AUDITION)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AC2", email: "ac2@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "NC2", email: "nc2@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "CT2", isbn: "C2", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/c2" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
          trigger:
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", royalty_share_pct: 0.30, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: narrator_active_booked_days_defaults_zero
        claim_type: Computed Fields
        grounds: [entities.Narrator.fields.active_booked_days]
        distinguishing_aspect: "A freshly created Narrator has computed active_booked_days == 0 and payout_balance_cents == 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /narrators"
              payload: { name: "NC3", email: "nc3@x.com", hourly_rate_cents: 15000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
          assert:
            - "Narrator.${na}.active_booked_days == 0"
            - "Narrator.${na}.payout_balance_cents == 0"

      - name: sales_event_defaults_zero_returns
        claim_type: Defaults
        grounds: [entities.SalesEvent.fields.units_returned]
        distinguishing_aspect: "POST /sales-events omitting units_returned applies the default 0."
        test_recipe:
          setup:
            - "A published title with an ACTIVE listing."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AC4", email: "ac4@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "NC4", email: "nc4@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "CT4", isbn: "C4", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/c4" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.30, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
            - call: "POST /production-milestones"
              payload: { contract_id: "${co}", milestone_type: "FULL", audio_url: "http://a/c4", finished_hours: 6.0 }
              as: Narrator
              as_user_id: "${na}"
              captures: { mi: $.data.id }
            - call: "POST /production-milestones/${mi}/qc-reviews"
              payload: { outcome: "PASS" }
              as: QCReviewer
            - call: "POST /titles/${ti}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /distribution-channels"
              payload: { name: "ChC4", supported_territories: ["US"], retailer_cut_pct: 0.40 }
              as: PlatformAdmin
              captures: { ch: $.data.id }
            - call: "POST /distribution-listings"
              payload: { title_id: "${ti}", channel_id: "${ch}", territory: "US", effective_from: "2026-03-01", effective_until: "2026-12-31" }
              as: PlatformAdmin
              captures: { li: $.data.id }
          trigger:
            - call: "POST /sales-events"
              payload: { listing_id: "${li}", units_sold: 5, unit_price_cents: 1000, occurred_at: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { se: $.data.id }
          assert:
            - "SalesEvent.${se}.units_returned == 0"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: open_non_draft_title_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Title.DRAFT_to_OPEN_FOR_AUDITION", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Opening a title already in OPEN_FOR_AUDITION (not DRAFT) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A title already OPEN_FOR_AUDITION."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AC5", email: "ac5@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "CT5", isbn: "C5", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
          trigger:
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: respond_on_non_offered_contract_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Contract.OFFERED_to_ACCEPTED", "errors[ERR_CONTRACT_NOT_OFFERED]"]
        distinguishing_aspect: "Responding to a contract already ACCEPTED returns ERR_CONTRACT_NOT_OFFERED (409); no state change."
        test_recipe:
          setup:
            - "A contract already ACCEPTED (title IN_PRODUCTION)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AC6", email: "ac6@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "NC6", email: "nc6@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "CT6", isbn: "C6", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/c6" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.30, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
          trigger:
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "DECLINE" }
              as: Narrator
              as_user_id: "${na}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONTRACT_NOT_OFFERED"
            - "Contract.${co}.status == ACCEPTED"

      - name: qc_review_on_non_submitted_milestone_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ProductionMilestone.SUBMITTED_to_APPROVED", "errors[ERR_MILESTONE_NOT_SUBMITTED]"]
        distinguishing_aspect: "A second QC review on an already APPROVED milestone returns ERR_MILESTONE_NOT_SUBMITTED (409)."
        test_recipe:
          setup:
            - "A FULL milestone already APPROVED via a PASS review."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AC7", email: "ac7@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "NC7", email: "nc7@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "CT7", isbn: "C7", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/c7" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.30, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
            - call: "POST /production-milestones"
              payload: { contract_id: "${co}", milestone_type: "FULL", audio_url: "http://a/c7", finished_hours: 6.0 }
              as: Narrator
              as_user_id: "${na}"
              captures: { mi: $.data.id }
            - call: "POST /production-milestones/${mi}/qc-reviews"
              payload: { outcome: "PASS" }
              as: QCReviewer
          trigger:
            - call: "POST /production-milestones/${mi}/qc-reviews"
              payload: { outcome: "FAIL", notes: "late" }
              as: QCReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MILESTONE_NOT_SUBMITTED"

      - name: revert_rights_on_reverted_title_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Title.PUBLISHED_to_REVERTED", "errors[ERR_TITLE_NOT_REVERTABLE]"]
        distinguishing_aspect: "Reverting rights on a title already REVERTED (terminal) returns ERR_TITLE_NOT_REVERTABLE (409)."
        test_recipe:
          setup:
            - "A title in REVERTED (previously published then reverted)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AC8", email: "ac8@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "NC8", email: "nc8@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "CT8", isbn: "C8", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/c8" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.30, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
            - call: "POST /production-milestones"
              payload: { contract_id: "${co}", milestone_type: "FULL", audio_url: "http://a/c8", finished_hours: 6.0 }
              as: Narrator
              as_user_id: "${na}"
              captures: { mi: $.data.id }
            - call: "POST /production-milestones/${mi}/qc-reviews"
              payload: { outcome: "PASS" }
              as: QCReviewer
            - call: "POST /titles/${ti}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /titles/${ti}/revert-rights"
              payload: {}
              as: Author
              as_user_id: "${au}"
          trigger:
            - call: "POST /titles/${ti}/revert-rights"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TITLE_NOT_REVERTABLE"

      - name: finalize_non_provisional_statement_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.RoyaltyStatement.PROVISIONAL_to_FINALIZED", "errors[ERR_STATEMENT_NOT_PROVISIONAL]"]
        distinguishing_aspect: "Finalizing a statement already FINALIZED returns ERR_STATEMENT_NOT_PROVISIONAL (409)."
        test_recipe:
          setup:
            - "A FINALIZED statement over an empty period (net 0, still finalizable)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AC9", email: "ac9@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "NC9", email: "nc9@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "CT9", isbn: "C9", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
