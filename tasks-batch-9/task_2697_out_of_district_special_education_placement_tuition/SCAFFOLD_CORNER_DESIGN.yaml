              payload: { placement_id: "${pl_id}", attendance_record_id: "${ar_id}", billing_period_start: "2026-10-05", billing_period_end: "2026-11-01", submitted_amount_cents: 654400, transport_days_billed: 0, expected_placement_version: "${pl_v}" }
              as: SchoolBillingAgent
