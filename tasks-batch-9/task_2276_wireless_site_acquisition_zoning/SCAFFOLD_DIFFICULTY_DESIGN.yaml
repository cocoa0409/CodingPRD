            - "the overlapping order returns 409 with error_id == ERR_PROVIDER_CAPACITY_EXCEEDED"
            - "UtilityProvider.${prov_id}.committed_crew_days == 7"
            - "GET /backhaul-orders with provider_id filter returns total_count == 2"

