  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: project_action_fork_join_informal_branch_converges_and_locks
        grounds:
          - state_machines[ProjectAction]
          - state_machines[ProjectAction].transitions["SCREENING -> INFORMAL_CONSULTATION"]
          - state_machines[ProjectAction].transitions["INFORMAL_CONSULTATION -> CONSULTATION_CONCLUDED"]
          - state_machines[ProjectAction].terminal_states
          - state_machines[Consultation].transitions["UNDER_REVIEW -> CONCLUDED_CONCURRENCE"]
          - complexity_profile.state_machine_shape
          - endpoints["POST /consultations/{id}/concurrence"]
        distinguishing_aspect: >-
          BRANCHING FORK-JOIN on ProjectAction. One trigger
          (POST /project-actions/{id}/effect-determination) forks into three
          mutually exclusive successor states with three DIFFERENT side-effect
          sets, and two of those branches later JOIN at CONSULTATION_CONCLUDED
          through different system triggers (concurrence on the informal branch,
          opinion issuance on the formal one). This instance walks branch 2 to
          the join and then proves the join point is one-way: the terminal
          CONCLUDED_CONCURRENCE consultation refuses every further trigger, and
          the state gate at validation priority 9 wins over the type gate at
          priority 14.
        test_recipe:
          setup:
            - "Only SP-T (THREATENED) is registered, so no candidate can exceed LISTING_RANK 2."
            - "The action has footprint_acres 200.00 and exactly one DATABASE_QUERY presence determination for SP-T with habitat_overlap_acres 10.00 -> presence_status PRESUMED_PRESENT, survey_in_season false."
            - "The effect determination therefore lands on fork branch 2 (overlap_pct 5.00, confirmed_present false, max_rank 2 -> NLAA) and creates an INFORMAL consultation with statutory_days 60 and deadline_at 2026-11-30."
            - "The biological assessment is submitted, moving the consultation DRAFT_BA -> UNDER_REVIEW with ba_revision_number 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Vireo bellii pusillus", common_name: "Least Bell's vireo", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.25, recovery_unit_population: 9000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_t_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_t_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 10.00}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {pd_status: "$.data.presence_status"}
            - call: "POST /project-actions/${action_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {consultation_id: "$.data.active_consultation_id", effect: "$.data.effect_determination", action_status_after_fork: "$.data.status"}
            - call: "POST /consultations/${consultation_id}/biological-assessment"
              payload: {ba_narrative: "Informal effects analysis for 10.00 acres of presumed-occupied habitat.", ba_effects_analysis_complete: true}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {cons_status_after_ba: "$.data.status", ba_rev: "$.data.ba_revision_number"}
          trigger:
            - call: "POST /consultations/${consultation_id}/concurrence"
              payload: {concurrence_note: "Agency concurs with the not-likely-to-adversely-affect determination."}
              as: WildlifeAgency
              as_user_id: "fws-user-reviewer"
          assert:
            - "the captured ${action_status_after_fork} == 'INFORMAL_CONSULTATION' and ${effect} == 'NLAA' — fork branch 2, not branch 1 (CLEARED_NO_EFFECT) and not branch 3 (FORMAL_CONSULTATION)"
            - "the captured ${cons_status_after_ba} == 'UNDER_REVIEW' and ${ba_rev} == 1"
            - "the trigger returns 200 and Consultation.status == 'CONCLUDED_CONCURRENCE', the entity's only terminal state"
            - "GET /project-actions/${action_id} then reports status == 'CONSULTATION_CONCLUDED' — the join was reached from the INFORMAL branch by a system trigger, with no explicit action-level call"
            - "the same GET still reports active_consultation_id == ${consultation_id}, effect_determination == 'NLAA', total_overlap_acres == 10.00 and overlap_pct == 5.00 (the join changes only status, updated_at and version)"
            - "GET /consultations/${consultation_id}/biological-opinions returns an empty list with total_count == 0 — the informal branch never produces a BiologicalOpinion"
            - "repeating POST /consultations/${consultation_id}/concurrence returns ERR_INVALID_STATE_TRANSITION (409): CONCLUDED_CONCURRENCE is terminal, so the trigger is not idempotent"
            - "POST /consultations/${consultation_id}/biological-opinion returns ERR_INVALID_STATE_TRANSITION (409), not ERR_CONSULTATION_TYPE_MISMATCH (422) — the state check at validation priority 9 precedes the consultation-type check at priority 14 even though both are violated"
            - "POST /consultations/${consultation_id}/information-request returns ERR_INVALID_STATE_TRANSITION (409)"
            - "POST /project-actions/${action_id}/effect-determination returns ERR_INVALID_STATE_TRANSITION (409) — SCREENING is no longer the action's state"
            - "POST /project-actions/${action_id}/habitat-conservation-plans now succeeds with 201, and the action's status becomes 'HCP_DEVELOPMENT': the join, not the branch taken to reach it, is what gates plan development"

      - name: consultation_info_request_cycle_tolls_deadline_twice_then_refuses
        grounds:
          - state_machines[Consultation].transitions["UNDER_REVIEW -> INFO_REQUESTED"]
          - state_machines[Consultation].transitions["INFO_REQUESTED -> UNDER_REVIEW"]
          - calculations.consultation_deadline
          - calculations.consultation_deadline.constants.MAX_INFO_REQUESTS
          - entities.Consultation.fields.tolled_days
          - entities.Consultation.fields.info_request_count
          - entities.Consultation.fields.ba_revision_number
          - endpoints["POST /consultations/{id}/information-request"]
        distinguishing_aspect: >-
          CYCLE on Consultation, a different entity from the fork-join instance:
          UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW is traversed twice, and
          each traversal is lossy in one direction only — tolled_days and
          ba_revision_number ratchet upward and the deadline slides later, so the
          entity never returns to a previously occupied field state. The cycle is
          bounded by MAX_INFO_REQUESTS rather than by a terminal state, which is
          what the trigger probes.
        test_recipe:
          setup:
            - "The canonical registry chain through the LAA effect determination at clock 2026-10-01, giving a FORMAL consultation with clock_started_at 2026-10-01, statutory_days 135, tolled_days 0 and deadline_at 2027-02-13."
            - "The biological assessment is submitted at 2026-10-01 (ba_revision_number 1, status UNDER_REVIEW)."
            - "Cycle 1: the clock advances to 2026-10-05 and the agency requests information; the clock advances to 2026-10-12 and a revised assessment is submitted, tolling exactly 7 days."
            - "Cycle 2: the clock advances to 2026-10-15 for a second information request; the clock advances to 2026-10-18 and a third assessment revision is submitted, tolling 3 more days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-1", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu1_id: "$.data.id"}
            - call: "POST /species"
              payload: {scientific_name: "Vireo bellii pusillus", common_name: "Least Bell's vireo", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.25, recovery_unit_population: 9000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_t_id: "$.data.id"}
            - call: "POST /conservation-banks"
              payload: {bank_name: "Mojave Habitat Bank", covered_species_id: "${species_e_id}", service_area_county_codes: ["06037"], credit_price_cents: 250000, credits_total_minted: 500.00}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {bank_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
