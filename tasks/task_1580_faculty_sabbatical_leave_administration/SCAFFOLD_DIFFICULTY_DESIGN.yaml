      - name: composite_score_per_product_rounding_order
        grounds:
          - calculations.committee_composite_score
          - entities.CommitteeReview.fields.weighted_total
          - entities.LeaveApplication.fields.composite_score
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode from instance 1's tiered formula): the scaffold
          pins round-per-product-then-sum. Three reviews of (10.5, 10.5, 10.5) yield per-review
          weighted_total 10.51 (4.73 + 3.68 + 2.10) and composite 10.51; the alternative
          sum-then-round order yields 10.50. One cent of rounding separates the two orders.
        test_recipe:
