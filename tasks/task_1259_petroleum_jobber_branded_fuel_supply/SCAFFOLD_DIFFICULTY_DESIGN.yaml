              as: Dispatcher
          trigger:
            - call: "POST /api/transport-drops/${d_id}/deliver"
              payload: { delivered_gallons: 5500 }
              as: Dispatcher
              captures: { inv_id: $.data.invoice_id }
            - call: "GET /api/dealer-stations/${s_id}"
              as: JobberAdmin
              captures: { expo_after_deliver: $.data.current_exposure_cents }
            - call: "POST /api/invoices/${inv_id}/void"
              as: CreditManager
            - call: "GET /api/dealer-stations/${s_id}"
              as: JobberAdmin
              captures: { expo_after_void: $.data.current_exposure_cents }
          assert:
            - "current_exposure_cents after deliver == 1948650 (forward action)"
            - "current_exposure_cents after void == 0 (compensating action restores the conserved quantity exactly)"
            - "Invoice status == VOID"

      - name: loss_verify_void_restores_book
        grounds:
          - calculations.book_inventory_gallons
          - state_machines.LossEvent.REPORTED_to_VERIFIED
          - state_machines.LossEvent.VERIFIED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: tank book_inventory_gallons (a gallons ledger —
          different quantity than the cents exposure invariant). Forward action
          (loss verify) deducts 500; compensating action (loss void) restores
          exactly 500, returning book to 10000 with no drift.
        test_recipe:
          setup:
            - "Station with a gasoline tank, opening physical 10000 (book 10000); no reconciliation open"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Loss", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 10000 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/loss-events"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", loss_type: "SPILL", gallons: 500, occurred_at: "2026-05-03T09:00:00Z" }
              as: DealerOperator
              as_user_id: "${s_id}"
              captures: { loss_id: $.data.id }
          trigger:
            - call: "POST /api/loss-events/${loss_id}/verify"
              as: JobberAdmin
            - call: "GET /api/storage-tanks/${t_id}"
              as: JobberAdmin
              captures: { book_after_verify: $.data.book_inventory_gallons }
            - call: "POST /api/loss-events/${loss_id}/void"
              as: JobberAdmin
            - call: "GET /api/storage-tanks/${t_id}"
              as: JobberAdmin
              captures: { book_after_void: $.data.book_inventory_gallons }
          assert:
            - "book_inventory_gallons after verify == 9500 (10000 - 500)"
            - "book_inventory_gallons after void == 10000 (compensation restores the conserved gallons exactly)"
            - "LossEvent status == VOIDED"
