      - name: the_two_segregation_axes_are_independent_of_each_other
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 4]
          - complexity_profile.role_model
        distinguishing_aspect: |
          Priority 4 names exactly TWO pairings — certify versus
          initiated_by_user_id, and dispute-decide versus reviewed_by_user_id —
          and nothing more. So the user who INITIATED a recalculation may still
          DECIDE a dispute against it, and the user who REVIEWED that dispute may
          still CERTIFY the recalculation. Both succeed here, which is the
          falsifying pair for an implementation that separates duties globally
          (for instance by refusing any actor who already touched the aggregate)
          rather than on the two declared field comparisons. Role identity is
          opaque, so the same user id deliberately appears under two different
          roles.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00.000Z."
