            - "SubserviceOrganization.${ss_b}.csoc_articulated == false"
            - "SubserviceOrganization.${ss_c}.method == INCLUSIVE"
            - "GET /soc/subservice-organizations?engagement_id=${eng}&method=INCLUSIVE returns total_count == 2"

  - rule_id: compensating_invariant
    instances:
      - name: mapping_create_then_retire_conserves_covered_criteria_count
        grounds:
          - state_machines.CriteriaMapping.ACTIVE_to_RETIRED
          - calculations.criteria_coverage
          - calculations.readiness_score
          - entities.Engagement.fields.covered_criteria_count_readiness
          - entities.Control.fields.active_mapping_count
        distinguishing_aspect: |
          Conserved quantity 1 — the DISTINCT-CRITERION COUNT
          covered_criteria_count_readiness = COUNT(DISTINCT c in in_scope_criteria with
          covered_readiness(c)). Creating mapping m2 raises it 1 -> 2 and retiring m2 must return it
          to exactly 1, with criteria_coverage_pct_readiness back at 50.00, readiness_score back at
          50.00 and Control.active_mapping_count back at 1 — no drift in any of them.
        test_recipe:
          setup:
            - "Engagement 'Consolidated' is in status SCOPING, SOC_2_TYPE_2, required_criteria_categories [SECURITY]."
            - "Two in-scope criteria CC1.1 and CC6.1, each with min_primary_controls 1."
            - "Control K-01 is DESIGN_MAPPED with exactly one ACTIVE PRIMARY mapping to CC1.1, so covered_criteria_count_readiness is 1 and criteria_coverage_pct_readiness is 50.00."
          setup_api_calls:
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC1.1", category: "SECURITY", title: "Control environment", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { cc11: $.data.id }
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC6.1", category: "SECURITY", title: "Logical access", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { cc61: $.data.id }
            - call: "POST /soc/engagements"
              payload: { client_name: "Consolidated", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 5 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "K-01", title: "Access provisioning", frequency: "MONTHLY", automation: "MANUAL", risk_rating: "MODERATE", population_size: 20 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { k01: $.data.id }
            - call: "POST /soc/criteria-mappings"
              payload: { control_id: "${k01}", trust_criterion_id: "${cc11}", mapping_type: "PRIMARY" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { m1: $.data.id }
            - call: "GET /soc/engagements/${eng}/readiness-summary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { cov_pre: $.data.covered_criteria_count_readiness, pct_pre: $.data.criteria_coverage_pct_readiness, score_pre: $.data.readiness_score }
          trigger:
            - call: "POST /soc/criteria-mappings"
              payload: { control_id: "${k01}", trust_criterion_id: "${cc61}", mapping_type: "PRIMARY" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { m2: $.data.id }
            - call: "GET /soc/engagements/${eng}/readiness-summary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { cov_mid: $.data.covered_criteria_count_readiness, pct_mid: $.data.criteria_coverage_pct_readiness }
            - call: "DELETE /soc/criteria-mappings/${m2}"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "GET /soc/engagements/${eng}/readiness-summary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { cov_post: $.data.covered_criteria_count_readiness, pct_post: $.data.criteria_coverage_pct_readiness, score_post: $.data.readiness_score }
          assert:
            - "${cov_pre} == 1"
            - "${pct_pre} == 50.00"
            - "${score_pre} == 50.00"
            - "${cov_mid} == 2"
            - "${pct_mid} == 100.00"
            - "${cov_post} == 1"
            - "${pct_post} == 50.00"
            - "${score_post} == 50.00"
            - "CriteriaMapping.${m2}.status == RETIRED"
            - "CriteriaMapping.${m1}.status == ACTIVE"
            - "Control.${k01}.active_mapping_count == 1"
            - "Control.${k01}.primary_mapping_count == 1"
            - "Control.${k01}.design_status == DESIGN_MAPPED"
            - "GET /soc/criteria-mappings?control_id=${k01}&status=ACTIVE returns total_count == 1"

      - name: gap_reopen_then_reremediate_conserves_engagement_debt_points
        grounds:
          - state_machines.Gap.VERIFIED_to_REOPENED
          - state_machines.Gap.PLANNED_to_REMEDIATED
          - calculations.gap_debt_points
          - entities.Gap.fields.reopen_count
          - entities.Gap.fields.debt_points
        distinguishing_aspect: |
          Conserved quantity 2 — the WEIGHTED DEBT TOTAL
          gap_debt_points = round_half_up(base_debt + round_half_up(base_debt * tier_rate, 2), 2)
          over gaps in {OPEN, PLANNED, REOPENED}. A reopen of the verified HIGH gap raises it from
          2.00 back to 10.00, and completing PLAN -> REMEDIATE -> VERIFY a second time must return it
          to exactly 2.00 while reopen_count settles at 1 — a different kind of conserved quantity
          from the distinct-criterion count above.
        test_recipe:
          setup:
            - "Engagement 'Dogwood' is in status SCOPING with three MANUAL gaps: one HIGH and two LOW, all OPEN, so base_debt is 10 and gap_debt_points is 10.00 with gap_posture OPEN."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Dogwood", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 5 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/gaps"
              payload: { engagement_id: "${eng}", severity: "HIGH", description: "Privileged access not reviewed" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { g_hi: $.data.id }
            - call: "POST /soc/gaps"
              payload: { engagement_id: "${eng}", severity: "LOW", description: "Asset tagging incomplete" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { g_lo1: $.data.id }
            - call: "POST /soc/gaps"
              payload: { engagement_id: "${eng}", severity: "LOW", description: "Runbook out of date" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { g_lo2: $.data.id }
            - call: "POST /soc/gaps/${g_hi}/transitions"
              payload: { action: "PLAN", remediation_owner_user_id: "own-7", remediation_due_date: "2026-10-01T00:00:00.000Z" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/gaps/${g_hi}/transitions"
              payload: { action: "REMEDIATE" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/gaps/${g_hi}/transitions"
              payload: { action: "VERIFY" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "GET /soc/engagements/${eng}/readiness-summary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { debt_pre: $.data.gap_debt_points, base_pre: $.data.base_debt_points }
          trigger:
            - call: "POST /soc/gaps/${g_hi}/transitions"
              payload: { action: "REOPEN", reason: "Regression found in Q4 sample" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "GET /soc/engagements/${eng}/readiness-summary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { debt_mid: $.data.gap_debt_points, base_mid: $.data.base_debt_points }
            - call: "POST /soc/gaps/${g_hi}/transitions"
              payload: { action: "PLAN", remediation_owner_user_id: "own-7", remediation_due_date: "2026-11-01T00:00:00.000Z" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/gaps/${g_hi}/transitions"
              payload: { action: "REMEDIATE" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/gaps/${g_hi}/transitions"
              payload: { action: "VERIFY" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "GET /soc/engagements/${eng}/readiness-summary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { debt_post: $.data.gap_debt_points, base_post: $.data.base_debt_points, posture_post: $.data.gap_posture }
          assert:
            - "${base_pre} == 2"
            - "${debt_pre} == 2.00"
            - "${base_mid} == 10"
            - "${debt_mid} == 10.00"
            - "${base_post} == 2"
            - "${debt_post} == 2.00"
            - "${posture_post} == OPEN"
            - "Gap.${g_hi}.status == VERIFIED"
            - "Gap.${g_hi}.reopen_count == 1"
            - "Gap.${g_hi}.debt_points == 0"
            - "Gap.${g_lo1}.debt_points == 1"
            - "Gap.${g_lo2}.debt_points == 1"

      - name: sample_void_conserves_engagement_open_exception_count
        grounds:
          - state_machines.AuditSample.CONCLUDED_EXCEPTIONS_to_VOIDED
          - state_machines.AuditException.UNEVALUATED_to_VOIDED
          - entities.Engagement.fields.open_exception_count
          - calculations.engagement_gap_posture
          - entities.Gap.fields.audit_exception_id
        distinguishing_aspect: |
          Conserved quantity 3 — the LIVE EXCEPTION COUNT
          open_exception_count = COUNT(AuditException whose control belongs to the engagement and
          whose disposition != VOIDED). Concluding with exceptions raises it 0 -> 1 and voiding the
          sample must return it to exactly 0, and also restores gap_debt_points to 0.00,
          gap_posture to OPEN and Control.operating_status to IN_OBSERVATION — a count of live
          findings, not a coverage count and not a weighted debt.
        test_recipe:
          setup:
            - "Engagement 'Elmwood' (SOC_2_TYPE_2, categories [SECURITY]) is in FIELDWORK with zero gaps, open_exception_count 0 and gap_posture OPEN."
            - "Control S-01 (QUARTERLY / MANUAL / MODERATE, population_size 20) is DESIGN_APPROVED and IN_OBSERVATION."
            - "Its AuditSample has sample_size 4 and allowed_deviations 0, with three PASS items and one FAIL item recorded."
