        distinguishing_aspect: "The SCORING -> CLOSED cycle edge sweeps submissions still in SCORING or ADJUDICATION_REQUIRED to EXPIRED (final scoring must land before the cycle closes); an EXPIRED attempt then rejects a further submit with 409 ERR_SUBMISSION_NOT_SUBMITTABLE."
