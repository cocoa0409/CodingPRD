        excluded_because:
          difficulty_instance: forecast_basis_commitment_vs_run_rate_diverges_82500_to_8750
          rationale: "remaining_eligible_days 16, elapsed_eligible_days 6 and total_eligible_days 21 are all asserted there from a mid-month clock, which is the forward-looking claim."

      - name: corner_group_windows_are_merged_as_half_open_intervals
        claim_type: interval_merge
        grounds:
          - validations[priority=21]
          - validations[priority=20]
        excluded_because:
          difficulty_instance: restaurant_capacity_half_open_windows_touch_at_1230_without_overlapping
          rationale: "Touching-but-not-overlapping windows are the discriminating case for interval logic and the §1.8 instance asserts both the admitted touch and the rejected overlap."

      - name: corner_imputed_method_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.imputed_income_accrual.variants
        excluded_because:
          difficulty_instance: imputed_taxable_method_pinned_per_record_diverges_by_2000
          rationale: "Both variants are run on the same employer share there, giving the 500 vs 2500 divergence that this claim asks for."

      - name: corner_forecast_basis_selects_the_variant
        claim_type: variant_selection
        grounds:
          - entities.MealProgram.fields.forecast_basis
          - calculations.program_cost_forecast.variants
        excluded_because:
          difficulty_instance: forecast_basis_commitment_vs_run_rate_diverges_82500_to_8750
          rationale: "Variant selection there is driven by PATCHing MealProgram.forecast_basis between two reads of the same forecast endpoint, which is exactly the selection claim."

      - name: corner_refund_reconciles_the_imputed_record
        claim_type: reconciliation
        grounds:
          - calculations.imputed_income_accrual
          - entities.Employee.fields.ytd_imputed_cents
        excluded_because:
          difficulty_instance: refund_pulls_ytd_imputed_back_below_threshold_and_restores_flag_to_none
          rationale: "Reconciliation of the record and the employee rollup after a refund, including the un-latching of tax_treatment_flag, is the whole subject of that §1.8 instance."

  # =========================================================================
  - section: validations
    instances:

      - name: daily_meal_limit_counts_live_orders_per_utc_day_and_a_cancel_frees_the_slot
        claim_type: aggregate_validation
        grounds:
          - validations[priority=32]
          - errors.ERR_DAILY_MEAL_LIMIT_EXCEEDED
          - entities.BudgetRule.fields.daily_meal_limit
        distinguishing_aspect: "The limit aggregates the employee's PLACED, CONFIRMED and DELIVERED orders for the requested UTC date only: a second Monday order is refused with 409 ERR_DAILY_MEAL_LIMIT_EXCEEDED, cancelling the first order frees the slot so the retry succeeds, and a Tuesday order was never affected."
        test_recipe:
          setup:
            - "Acme Corp program; Engineering rule with daily_meal_limit 1 (cap 2500, allocation 50000, weekdays 1-5, window 660-840); HQ Lobby; Thai Garden; Ada with a personal card; OPEN 2026-08 period."
            - "Order 1 for Monday 2026-08-03 12:00Z is already PLACED; order 2 for Monday 13:00Z and order 3 for Tuesday 2026-08-04 12:00Z are DRAFT."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 3 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id, per_v1: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord1_id: $.data.id } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T13:00:00Z", lines: [ { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord2_id: $.data.id } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-04T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord3_id: $.data.id } }
            - { call: "POST /orders/${ord1_id}/place", payload: { expected_benefit_period_version: "${per_v1}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "GET /benefit-periods/${per_id}", as: ProgramAdmin, captures: { per_v2: $.data.version } }
          trigger:
            - { call: "POST /orders/${ord2_id}/place", payload: { expected_benefit_period_version: "${per_v2}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /orders/${ord3_id}/place", payload: { expected_benefit_period_version: "${per_v2}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /orders/${ord1_id}/cancel", as: Employee, as_user_id: "${emp_id}" }
            - { call: "GET /benefit-periods/${per_id}", as: ProgramAdmin, captures: { per_v4: $.data.version } }
            - { call: "POST /orders/${ord2_id}/place", payload: { expected_benefit_period_version: "${per_v4}" }, as: Employee, as_user_id: "${emp_id}" }
          assert:
            - "the first attempt on ${ord2_id} is 409 with data.error_id == ERR_DAILY_MEAL_LIMIT_EXCEEDED"
            - "the Tuesday order ${ord3_id} places successfully, so the count is per UTC date and not per period"
            - "after ${ord1_id} is cancelled the retry on ${ord2_id} succeeds with fulfillment_status PLACED"
            - "Order.${ord1_id}.fulfillment_status == CANCELLED and settlement_status == VOIDED"
            - "BenefitPeriod.${per_id}.reserved_cents == 3574 at the end: the Tuesday order plus the retried Monday order"

      - name: credit_claim_line_index_rules_depend_on_claim_type_and_win_over_the_amount_check
        claim_type: conditional_validation
        grounds:
          - validations[priority=35]
          - validations[priority=36]
          - errors.ERR_LINE_INDEX_INVALID
          - errors.ERR_CLAIM_EXCEEDS_ORDER
        distinguishing_aspect: "line_index is mandatory and in-range for MISSING_ITEM and forbidden for NEVER_DELIVERED; when the index is bad and the amount is also impossible, priority 35 wins so the response is ERR_LINE_INDEX_INVALID and never ERR_CLAIM_EXCEEDS_ORDER."
        test_recipe:
          setup:
            - "Acme Corp program; Engineering rule (cap 2500, daily 1, allocation 50000); Ada with a personal card; OPEN 2026-08 period."
            - "A two-line order (1000 Pad Thai + 500 Spring Rolls) for 2026-08-03 is placed, confirmed and delivered: subtotal 1500, tax 132, delivery 599, service 150, covered_base 2381, fully employer-covered."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 3 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_id: $.data.id, per_v1: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_id}", benefit_period_id: "${per_id}", restaurant_id: "${rest_id}", delivery_location_id: "${loc_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Spring Rolls", unit_price_cents: 500, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /orders/${ord_id}/place", payload: { expected_benefit_period_version: "${per_v1}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /orders/${ord_id}/confirm", as: Restaurant, as_user_id: "${rest_id}" }
            - { call: "POST /orders/${ord_id}/deliver", as: Restaurant, as_user_id: "${rest_id}" }
          trigger:
            - { call: "POST /credit-claims", payload: { order_id: "${ord_id}", claim_type: "MISSING_ITEM", claimed_cents: 544 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /credit-claims", payload: { order_id: "${ord_id}", claim_type: "MISSING_ITEM", claimed_cents: 544, line_index: 7 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /credit-claims", payload: { order_id: "${ord_id}", claim_type: "MISSING_ITEM", claimed_cents: 9999, line_index: 7 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /credit-claims", payload: { order_id: "${ord_id}", claim_type: "NEVER_DELIVERED", claimed_cents: 2381, line_index: 0 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /credit-claims", payload: { order_id: "${ord_id}", claim_type: "MISSING_ITEM", claimed_cents: 9999, line_index: 1 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /credit-claims", payload: { order_id: "${ord_id}", claim_type: "MISSING_ITEM", claimed_cents: 544, line_index: 1 }, as: Employee, as_user_id: "${emp_id}", captures: { claim_id: $.data.id } }
            - { call: "GET /credit-claims", payload: { order_id: "${ord_id}" }, as: BenefitsController }
          assert:
            - "the MISSING_ITEM claim with no line_index is 422 with data.error_id == ERR_LINE_INDEX_INVALID"
            - "the MISSING_ITEM claim with line_index 7 is 422 ERR_LINE_INDEX_INVALID because the order has only 2 lines"
            - "the claim with line_index 7 and claimed_cents 9999 is also 422 ERR_LINE_INDEX_INVALID, not ERR_CLAIM_EXCEEDS_ORDER, because priority 35 precedes priority 36"
            - "the NEVER_DELIVERED claim carrying line_index 0 is 422 ERR_LINE_INDEX_INVALID"
            - "the MISSING_ITEM claim for line_index 1 with claimed_cents 9999 is 422 ERR_CLAIM_EXCEEDS_ORDER because 9999 exceeds the 544 line base plus tax"
            - "the final claim is 201 with CreditClaim.${claim_id}.status == SUBMITTED, claimed_cents == 544 and approved_cents null"
            - "the claim listing filtered by order_id ${ord_id} returns total_count 1, so none of the five rejected attempts persisted a row"

      - name: case_insensitive_uniqueness_violations_return_the_duplicate_errors
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - validations[priority=28]
          - errors.ERR_DUPLICATE_NAME
          - errors.ERR_DUPLICATE_PERIOD_MONTH
        distinguishing_aspect: "Group name, employee email and dock label are unique per program case-insensitively, and period_month is unique per employee: 'engineering', 'ADA@ACME.TEST' and 'hq lobby' all collide with 409 ERR_DUPLICATE_NAME, while a second 2026-08 period for Ada is 409 ERR_DUPLICATE_PERIOD_MONTH."
        test_recipe:
          setup:
            - "Acme Corp program with an Engineering group holding an ACTIVE rule, a HQ Lobby dock, Ada enrolled and an OPEN 2026-08 period."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI"] }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 3 }, as: ProgramAdmin, captures: { grp_id: $.data.id, grp_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_id: $.data.id } }
