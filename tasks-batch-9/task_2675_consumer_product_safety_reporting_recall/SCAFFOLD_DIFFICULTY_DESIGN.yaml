  - rule_id: resource_temporal_overlap
    instances:

      - name: audit_visit_half_open_window_plus_travel_buffer_conflicts_at_same_retailer
        grounds:
          - validations[19].ERR_AUDIT_WINDOW_CONFLICT
          - entities.AuditVisit.fields.window_start
          - entities.AuditVisit.fields.window_end
          - entities.Retailer
          - endpoints["POST /product-safety/audit-visits"]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [window_start, window_end) inflated by a
          24-hour travel buffer on each side. Contested resource: the RETAILER's
          store (the comparison set is every SCHEDULED visit whose notification
          belongs to the same retailer_id, across all recalls), not the recall.
          The new window 2026-03-18T16:00:00Z..20:00:00Z is a full day clear of the
          existing 09:00..17:00 window on 2026-03-17 and yet must be rejected,
          because 2026-03-18T16:00:00Z < 2026-03-17T17:00:00Z + 24h by one hour —
          the buffer, not the raw window, is what overlaps.
        test_recipe:
          setup:
            - "an approved recall whose RetailerNotification at MegaMart is ISSUED and whose retailer posture is STOP_SALE_ACTIVE"
            - "one SCHEDULED AuditVisit covering [2026-03-17T09:00:00Z, 2026-03-17T17:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
