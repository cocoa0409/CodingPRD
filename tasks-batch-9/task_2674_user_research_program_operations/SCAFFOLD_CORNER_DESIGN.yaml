          - roles[Stakeholder].exclusive_operations
          - roles[ResearchLead].exclusive_operations
          - roles[PrivacyOfficer].exclusive_operations
          - roles[ResearchOpsAdmin].exclusive_operations
          - validations[priority 2] ERR_UNAUTHORIZED
        distinguishing_aspect: "Each denial names an operation that is exclusive to exactly one role, and every refused call is otherwise perfectly well formed - same body, same target, only the X-User-Role differs from the accepted one."
        test_recipe:
          setup:
            - "A fielded study, a pool with one participant and one granted consent record, so every denied call has a live target"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
