  - rule_id: boundary_precision_check
    instances:
      - name: detention_free_minutes_exact_boundary
        grounds:
          - calculations.detention_billing
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
          - errors[ERR_DUPLICATE_ACCESSORIAL_TYPE]
        distinguishing_aspect: |
          Boundary on MINUTES via the check-call endpoint: pickup leg dwell exactly 120
          minutes from max(arrival, appointment) -> 0 billable (no charge created), while
          the delivery leg dwell of 181 minutes -> 61 billable -> ceil(61/15)=5 -> 7500.
          Tests '> 120' vs '>= 120' on the same formula, both legs, one trigger.
        test_recipe:
          setup:
            - "F1 chain; pickup: arrive 08:00 (= appt), depart 10:00 (exactly 120); delivery: arrive 18:00 (= appt), DELIVERED 20:01 (181 elapsed)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
