scenario: "634. Aquarium & Pond Maintenance Service: tank/system profile & livestock inventory, recurring service route & water-test/dosing log, equipment repair & filter/media schedule, livestock health & quarantine, setup/install project, emergency call, per-visit billing & contract, vacation feeding"
domain_name: "aquarium-pond-maintenance"
api_prefix: "/aquatics"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_actions

  entity_topology: hybrid
  # ServiceContract is the billing root; SystemProfile hangs under it; Livestock,
  # Equipment hang under SystemProfile (hierarchy). ServiceVisit, RepairOrder,
  # QuarantineRecord, InstallProject, EmergencyCall, Invoice, VacationFeedingPlan are
  # flat peers referencing those via FK + a shared Technician calendar resource
  # (cross-cutting association) — hence hybrid.

  state_machine_shape: cyclic
  # ServiceVisit has a revision cycle (DISPUTED -> IN_PROGRESS rework loop); RepairOrder
  # has a parts-backorder cycle (AWAITING_PARTS -> DIAGNOSED -> AWAITING_PARTS). Livestock
  # carries parallel dimensions (lifecycle status + quarantine flag derived from records).

  relationship_patterns:
    - one_to_many        # ServiceContract -> SystemProfile -> {Livestock, Equipment}
    - cross_aggregate    # ServiceVisit references SystemProfile and Technician across aggregates
    - polymorphic        # Invoice.source_kind + source_id references a Visit / Install / Emergency

  role_model: peer_roles
  # FieldTech owns service/repair execution; AccountManager owns contracts/invoices/projects;
  # CustomerOwner (entity_backed:ServiceContract) owns dispute/approval on their own resources;
  # Dispatcher owns scheduling/route/emergency assignment. Operations are non-overlapping.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# ===========================================================================
entities:
  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - name: customer_name
        type: string
        source: input
        description: "Account holder name."
        constraints: "non-empty"
      - name: customer_user_id
        type: string
        source: input
        description: "Opaque CustomerOwner login id; X-User-ID of the CustomerOwner who owns this contract (identity anchor for entity_backed:ServiceContract)."
        constraints: "non-empty"
      - name: service_tier
        type: enum
        source: input
        description: "Billing tier governing visit base rate, included labor minutes, and plan discount."
        constraints: "one of BASIC, PLUS, PREMIUM"
      - name: status
        type: enum
        source: system
        description: "Contract lifecycle."
        default: "DRAFT"
        constraints: "one of DRAFT, ACTIVE, SUSPENDED, TERMINATED"
      - name: route_day
        type: enum
        source: input
        description: "Weekday the recurring service route visits this account."
        constraints: "one of MON, TUE, WED, THU, FRI, SAT"
      - name: account_balance_cents
        type: integer
        source: computed
        description: "Derived: sum of total_cents minus amount_paid_cents over this contract's Invoices whose status IN {ISSUED, OVERDUE}. Recomputed on every invoice mutation. See calculations.account_balance."
        default: 0
      - name: alive_livestock_count
        type: integer
        source: computed
        description: "Derived: COUNT of Livestock under this contract's SystemProfiles whose status == ALIVE. See calculations.alive_livestock_count."
        default: 0

  - name: SystemProfile
    parent: ServiceContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ServiceContract.id; the owning account."
        constraints: "must reference an existing ServiceContract"
      - name: label
        type: string
        source: input
        description: "Human label for the tank/pond."
        constraints: "non-empty"
      - name: system_kind
        type: enum
        source: input
        description: "Physical system type."
        constraints: "one of REEF, FRESHWATER, POND, PALUDARIUM"
      - name: nominal_volume_l
        type: number
        source: input
        description: "Nominal water volume in liters."
        constraints: "> 0"
      - name: substrate_displacement_pct
        type: number
        source: input
        description: "Fraction of nominal volume displaced by rock/substrate (effective_volume_l = nominal_volume_l * (1 - this))."
        default: 0.0
        constraints: ">= 0 and < 1"
      - name: status
        type: enum
        source: system
        description: "System operational posture; gates which visits may run against it."
        default: "PROVISIONING"
        constraints: "one of PROVISIONING, ACTIVE, SUSPENDED, DECOMMISSIONED"
      - name: bioload_index
        type: number
        source: computed
        description: "Derived stocking-density risk score (2 dp). See calculations.bioload_index."
        default: 0.0
      - name: stocking_posture
        type: enum
        source: computed
        description: "Derived from bioload_index: NORMAL if <= 100.0, OVERSTOCKED if > 100.0. Gates livestock additions. See calculations.bioload_index."
        default: "NORMAL"

  - name: Livestock
    parent: SystemProfile
    common_fields: true
    fields:
      - name: system_id
        type: string
        source: input
        description: "FK -> SystemProfile.id; the tank/pond this animal lives in."
        constraints: "must reference an existing SystemProfile"
      - name: common_name
        type: string
        source: input
        description: "Animal common name."
        constraints: "non-empty"
      - name: species_class
        type: enum
        source: input
        description: "Bioload classification driving waste_factor in bioload_index."
        constraints: "one of COMMUNITY, CICHLID, GOLDFISH, PREDATOR, INVERT"
      - name: adult_length_cm
        type: number
        source: input
        description: "Adult length in cm; bioload input."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status. ALIVE animals count toward bioload; QUARANTINED and DECEASED do not."
        default: "ALIVE"
        constraints: "one of ALIVE, QUARANTINED, DECEASED"

  - name: Equipment
    parent: SystemProfile
    common_fields: true
    fields:
      - name: system_id
        type: string
        source: input
        description: "FK -> SystemProfile.id; the system this device serves."
        constraints: "must reference an existing SystemProfile"
      - name: device_kind
        type: enum
        source: input
        description: "Equipment category."
        constraints: "one of FILTER, PUMP, HEATER, UV_STERILIZER, SKIMMER"
      - name: media_interval_days
        type: integer
        source: input
        description: "Days between scheduled filter/media replacements."
        constraints: ">= 1"
      - name: last_serviced_on
        type: datetime
        source: system
        description: "ISO date of the most recent media replacement; advanced by a service visit that lists this device. Null until first serviced."
        default: null
      - name: media_due_on
        type: datetime
        source: computed
        description: "Derived next-due date = last_serviced_on + media_interval_days (or system install date if never serviced). See calculations.media_due_on."
        default: null
      - name: status
        type: enum
        source: system
        description: "Operational state of the device."
        default: "OPERATIONAL"
        constraints: "one of OPERATIONAL, DEGRADED, OUT_OF_SERVICE"

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: tech_user_id
        type: string
        source: input
        description: "Opaque FieldTech login id; X-User-ID of the FieldTech who acts as this technician (identity anchor for entity_backed:Technician)."
        constraints: "non-empty, unique among technicians"
      - name: full_name
        type: string
        source: input
        description: "Technician display name."
        constraints: "non-empty"
      - name: certified_for_reef
        type: boolean
        source: input
        description: "Whether this tech may be assigned to REEF systems."
        default: false
      - name: active
        type: boolean
        source: input
        description: "Whether the technician is on the roster and assignable."
        default: true

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - name: system_id
        type: string
        source: input
        description: "FK -> SystemProfile.id; the system being serviced."
        constraints: "must reference an existing SystemProfile"
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the assigned tech."
        constraints: "must reference an existing Technician"
      - name: visit_kind
        type: enum
        source: input
        description: "ROUTINE recurring-route visit or EMERGENCY dispatched visit (set EMERGENCY only when created from an EmergencyCall)."
        default: "ROUTINE"
        constraints: "one of ROUTINE, EMERGENCY"
      - name: emergency_call_id
        type: string
        source: input
        description: "FK -> EmergencyCall.id; set only for EMERGENCY visits, null otherwise."
        default: null
        constraints: "required iff visit_kind == EMERGENCY"
      - name: scheduled_start
        type: datetime
        source: input
        description: "ISO8601 start of the booked service window."
      - name: scheduled_end
        type: datetime
        source: input
        description: "ISO8601 end of the booked service window; half-open interval [scheduled_start, scheduled_end)."
      - name: labor_minutes
        type: integer
        source: input
        description: "Actual on-site labor minutes recorded at completion; billed over the tier's included minutes."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, IN_PROGRESS, COMPLETED, DISPUTED, CANCELLED"
      - name: total_cents
        type: integer
        source: computed
        description: "Final billed amount in cents, computed at completion. See calculations.visit_billing."
        default: 0
      - name: invoice_id
        type: string
        source: system
        description: "Back-reference to the Invoice generated when this visit COMPLETED (the canonical link is Invoice.source_kind=VISIT/EMERGENCY_TRIP + Invoice.source_id=this visit); null until completed, cleared on rework."
        default: null

  - name: WaterTest
    parent: ServiceVisit
    common_fields: false
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> ServiceVisit.id; the visit this reading belongs to."
        constraints: "must reference an existing ServiceVisit in IN_PROGRESS"
      - name: parameter
        type: enum
        source: input
        description: "Measured water parameter."
        constraints: "one of ALKALINITY, NITRATE, PHOSPHATE, PH, AMMONIA"
      - name: measured_value
        type: number
        source: input
        description: "Measured reading for the parameter."
        constraints: ">= 0"
      - name: target_value
        type: number
        source: input
        description: "Desired target reading for the parameter on this system."
        constraints: ">= 0"
      - name: product_strength_ppm_per_ml
        type: number
        source: input
        description: "Dosing product potency: ppm a single mL raises in 1 liter."
        constraints: "> 0"
      - name: recommended_dose_ml
        type: number
        source: computed
        description: "Derived dose volume in mL (rounded up to 0.1 mL). See calculations.dose_volume_ml."
        default: 0.0

  - name: Invoice
    parent: ServiceContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ServiceContract.id; the billed account."
        constraints: "must reference an existing ServiceContract"
      - name: source_kind
        type: enum
        source: input
        description: "Polymorphic billable source type."
        constraints: "one of VISIT, INSTALL, EMERGENCY_TRIP"
      - name: source_id
        type: string
        source: input
        description: "Id of the source record (ServiceVisit / InstallProject / EmergencyCall) named by source_kind; resolved by source_kind, not a hard FK."
        constraints: "must reference an existing record of the type named by source_kind"
      - name: total_cents
        type: integer
        source: input
        description: "Invoice face amount in cents (copied from the source's computed total at issuance)."
        constraints: ">= 0"
      - name: amount_paid_cents
        type: integer
        source: system
        description: "Cumulative payments applied; advances on POST payments."
        default: 0
        constraints: ">= 0 and <= total_cents"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle."
        default: "ISSUED"
        constraints: "one of ISSUED, OVERDUE, PAID, VOID"
      - name: due_on
        type: datetime
        source: input
        description: "ISO date the invoice is due; past this date (per logical clock) an ISSUED invoice may be flagged OVERDUE."

  - name: InstallProject
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ServiceContract.id; account commissioning the build."
        constraints: "must reference an existing ServiceContract"
      - name: system_id
        type: string
        source: input
        description: "FK -> SystemProfile.id; the system being installed (must be PROVISIONING)."
        constraints: "must reference an existing SystemProfile"
      - name: labor_estimate_cents
        type: integer
        source: input
        description: "Quoted labor cost in cents."
        constraints: ">= 0"
      - name: equipment_estimate_cents
        type: integer
        source: input
        description: "Quoted equipment cost in cents."
        constraints: ">= 0"
      - name: actual_labor_minutes
        type: integer
        source: input
        description: "Actual labor minutes recorded at handoff; billed in 15-min blocks."
        default: 0
        constraints: ">= 0"
      - name: actual_equipment_cents
        type: integer
        source: input
        description: "Actual equipment cost in cents recorded at handoff."
        default: 0
        constraints: ">= 0"
      - name: change_order_cents
        type: integer
        source: input
        description: "Approved scope-change cost in cents added to the final total."
        default: 0
        constraints: ">= 0"
      - name: quote_total_cents
        type: integer
        source: computed
        description: "Provisional total at quote = labor_estimate_cents + equipment_estimate_cents. See calculations.install_billing (PROVISIONAL variant)."
        default: 0
      - name: deposit_cents
        type: integer
        source: computed
        description: "Deposit collected at approval = round_half_up(quote_total_cents * DEPOSIT_RATE). See calculations.install_billing."
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Actual total at handoff. See calculations.install_billing (FINAL variant)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Project lifecycle."
        default: "QUOTED"
        constraints: "one of QUOTED, APPROVED, IN_BUILD, HANDED_OFF, CANCELLED"

  - name: EmergencyCall
    parent: null
    common_fields: true
    fields:
      - name: system_id
        type: string
        source: input
        description: "FK -> SystemProfile.id; the system in distress."
        constraints: "must reference an existing SystemProfile"
      - name: severity
        type: enum
        source: input
        description: "Triage severity."
        constraints: "one of LOW, HIGH, CRITICAL"
      - name: reported_at
        type: datetime
        source: input
        description: "ISO8601 time the emergency was reported."
      - name: trip_fee_cents
        type: integer
        source: input
        description: "Flat dispatch trip fee billed regardless of work performed."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Emergency lifecycle."
        default: "OPEN"
        constraints: "one of OPEN, DISPATCHED, RESOLVED, CANCELLED"
      - name: dispatched_visit_id
        type: string
        source: system
        description: "Back-reference to the EMERGENCY ServiceVisit created on dispatch (the canonical FK is ServiceVisit.emergency_call_id -> EmergencyCall.id); null until dispatched."
        default: null

  - name: RepairOrder
    parent: Equipment
    common_fields: true
    fields:
      - name: equipment_id
        type: string
        source: input
        description: "FK -> Equipment.id; the device under repair."
        constraints: "must reference an existing Equipment"
      - name: reported_symptom
        type: string
        source: input
        description: "Free-text fault description."
        constraints: "non-empty"
      - name: parts_needed
        type: boolean
        source: input
        description: "Whether the repair requires ordered parts; gates the order-parts transition."
        default: false
      - name: status
        type: enum
        source: system
        description: "Repair lifecycle."
        default: "REPORTED"
        constraints: "one of REPORTED, DIAGNOSED, AWAITING_PARTS, CLOSED, SCRAPPED"

  - name: QuarantineRecord
    parent: Livestock
    common_fields: true
    fields:
      - name: livestock_id
        type: string
        source: input
        description: "FK -> Livestock.id; the animal under quarantine."
        constraints: "must reference an existing Livestock"
      - name: quarantine_tank_id
        type: string
        source: input
        description: "FK -> SystemProfile.id; a SystemProfile of system_kind FRESHWATER used as the QT tank."
        constraints: "must reference an existing SystemProfile"
      - name: window_start
        type: datetime
        source: input
        description: "ISO8601 start of the quarantine occupancy; closed interval [window_start, window_end] (both endpoints inclusive — adjacency at a shared endpoint is a conflict)."
      - name: window_end
        type: datetime
        source: input
        description: "ISO8601 end of the quarantine occupancy; closed interval."
      - name: status
        type: enum
        source: system
        description: "Quarantine lifecycle."
        default: "ACTIVE"
        constraints: "one of ACTIVE, CLEARED, ABORTED"

  - name: VacationFeedingPlan
    parent: SystemProfile
    common_fields: true
    fields:
      - name: system_id
        type: string
        source: input
        description: "FK -> SystemProfile.id; the system to auto-feed while owner is away."
        constraints: "must reference an existing SystemProfile"
      - name: window_start
        type: datetime
        source: input
        description: "ISO8601 first feeding date."
      - name: window_end
        type: datetime
        source: input
        description: "ISO8601 last feeding date; half-open interval [window_start, window_end)."
      - name: feedings_per_day
        type: integer
        source: input
        description: "Auto-feed events per day."
        constraints: ">= 1 and <= 6"
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, ACTIVE, COMPLETED, CANCELLED"

# ===========================================================================
# §1.2 STATE MACHINE TABLE
# ===========================================================================
state_machines:
  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /aquatics/contracts/{id}/activate"
        actor: AccountManager
        preconditions:
          - "contract has at least one SystemProfile"
        side_effects:
          - "contract.status = ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /aquatics/contracts/{id}/suspend"
        actor: AccountManager
        preconditions:
          - "account_balance_cents > 0 (suspension is for non-payment)"
        side_effects:
          - "contract.status = SUSPENDED"
          - "each SystemProfile under this contract whose status == ACTIVE transitions to SUSPENDED (cascade down)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /aquatics/contracts/{id}/activate"
        actor: AccountManager
        preconditions:
          - "account_balance_cents == 0 (balance cleared)"
        side_effects:
          - "contract.status = ACTIVE"
          - "each SystemProfile under this contract whose status == SUSPENDED transitions to ACTIVE (cascade down)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /aquatics/contracts/{id}/terminate"
        actor: AccountManager
        preconditions:
          - "no ServiceVisit referencing this contract's systems is in SCHEDULED or IN_PROGRESS"
        side_effects:
          - "contract.status = TERMINATED"
          - "each SystemProfile under this contract that is not DECOMMISSIONED transitions to DECOMMISSIONED (cascade down)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /aquatics/contracts/{id}/terminate"
        actor: AccountManager
        preconditions:
          - "no ServiceVisit referencing this contract's systems is in SCHEDULED or IN_PROGRESS"
        side_effects:
          - "contract.status = TERMINATED"
          - "each SystemProfile under this contract that is not DECOMMISSIONED transitions to DECOMMISSIONED (cascade down)"

  - entity: SystemProfile
    initial_state: PROVISIONING
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PROVISIONING
        to: ACTIVE
        trigger: "POST /aquatics/systems/{id}/commission"
        actor: AccountManager
        preconditions:
          - "owning ServiceContract.status == ACTIVE"
          - "no InstallProject for this system is in QUOTED, APPROVED, or IN_BUILD (any open install must be HANDED_OFF or CANCELLED)"
        side_effects:
          - "system.status = ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: owning contract suspended (cascade down)"
        actor: system
        preconditions:
          - "owning ServiceContract transitioned ACTIVE -> SUSPENDED"
        side_effects:
          - "system.status = SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: owning contract reactivated (cascade down)"
        actor: system
        preconditions:
          - "owning ServiceContract transitioned SUSPENDED -> ACTIVE"
        side_effects:
          - "system.status = ACTIVE"
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "system event: owning contract terminated, OR POST /aquatics/systems/{id}/decommission"
        actor: system
        preconditions:
          - "no ServiceVisit on this system is SCHEDULED or IN_PROGRESS"
        side_effects:
          - "system.status = DECOMMISSIONED"
          - "each Livestock under this system whose status == ALIVE transitions to DECEASED (cascade down)"
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "system event: owning contract terminated"
        actor: system
        preconditions: []
        side_effects:
          - "system.status = DECOMMISSIONED"
          - "each Livestock under this system whose status == ALIVE transitions to DECEASED (cascade down)"

  - entity: ServiceVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /aquatics/visits/{id}/start"
        actor: FieldTech
        preconditions:
          - "target SystemProfile.status == ACTIVE"
          - "acting FieldTech.id == visit.technician_id"
          - "if SystemProfile.system_kind == REEF then assigned Technician.certified_for_reef == true"
        side_effects:
          - "visit.status = IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /aquatics/visits/{id}/complete"
        actor: FieldTech
        preconditions:
          - "labor_minutes provided and >= 0"
        side_effects:
          - "compute visit.total_cents via calculations.visit_billing"
          - "create an Invoice (source_kind VISIT for ROUTINE, EMERGENCY_TRIP for EMERGENCY) with total_cents = visit.total_cents, status ISSUED; set visit.invoice_id (cascade: Invoice create -> contract.account_balance_cents recomputed)"
          - "for each Equipment listed in the request's serviced_equipment_ids: set Equipment.last_serviced_on = visit completion date and recompute Equipment.media_due_on (cross-entity cascade)"
          - "if visit_kind == EMERGENCY: set the linked EmergencyCall.status = RESOLVED"
      - from: COMPLETED
        to: DISPUTED
        trigger: "POST /aquatics/visits/{id}/dispute"
        actor: CustomerOwner
        preconditions:
          - "acting CustomerOwner owns the contract of visit's system"
          - "the visit's Invoice.status != PAID"
        side_effects:
          - "visit.status = DISPUTED"
          - "the visit's Invoice.status = VOID (cascade: Invoice void -> contract.account_balance_cents recomputed, removing this invoice's contribution)"
      - from: DISPUTED
        to: IN_PROGRESS
        trigger: "POST /aquatics/visits/{id}/rework"
        actor: FieldTech
        preconditions:
          - "acting FieldTech.id == visit.technician_id"
        side_effects:
          - "visit.status = IN_PROGRESS (cyclic rework loop; on next complete a fresh Invoice is issued)"
          - "clear visit.invoice_id and reset visit.total_cents = 0"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /aquatics/visits/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "visit.status = CANCELLED"
          - "if visit_kind == EMERGENCY and linked EmergencyCall.status == DISPATCHED: set EmergencyCall.status = OPEN and clear EmergencyCall.dispatched_visit_id (compensation)"

  - entity: RepairOrder
    initial_state: REPORTED
    terminal_states: [CLOSED, SCRAPPED]
    transitions:
      - from: REPORTED
        to: DIAGNOSED
        trigger: "POST /aquatics/repairs/{id}/diagnose"
        actor: FieldTech
        preconditions:
          - "target Equipment exists"
        side_effects:
          - "repair.status = DIAGNOSED"
          - "set Equipment.status = DEGRADED (cross-entity)"
      - from: DIAGNOSED
        to: AWAITING_PARTS
        trigger: "POST /aquatics/repairs/{id}/order-parts"
        actor: FieldTech
        preconditions:
          - "parts_needed == true on the repair"
        side_effects:
          - "repair.status = AWAITING_PARTS"
      - from: AWAITING_PARTS
        to: DIAGNOSED
        trigger: "POST /aquatics/repairs/{id}/parts-arrived"
        actor: FieldTech
        preconditions: []
        side_effects:
          - "repair.status = DIAGNOSED (parts-backorder cycle; may loop if re-diagnosis finds further parts)"
      - from: DIAGNOSED
        to: CLOSED
        trigger: "POST /aquatics/repairs/{id}/close"
        actor: FieldTech
        preconditions:
          - "Equipment.status != OUT_OF_SERVICE"
        side_effects:
          - "repair.status = CLOSED"
          - "set Equipment.status = OPERATIONAL (cross-entity)"
      - from: DIAGNOSED
        to: SCRAPPED
        trigger: "POST /aquatics/repairs/{id}/scrap"
        actor: FieldTech
        preconditions: []
        side_effects:
          - "repair.status = SCRAPPED"
          - "set Equipment.status = OUT_OF_SERVICE (cross-entity)"

  - entity: InstallProject
    initial_state: QUOTED
    terminal_states: [HANDED_OFF, CANCELLED]
    transitions:
      - from: QUOTED
        to: APPROVED
        trigger: "POST /aquatics/installs/{id}/approve"
        actor: CustomerOwner
        preconditions:
          - "acting CustomerOwner owns install.contract_id"
          - "owning ServiceContract.status == ACTIVE"
        side_effects:
          - "compute quote_total_cents and deposit_cents via calculations.install_billing (PROVISIONAL)"
          - "create a deposit Invoice (source_kind INSTALL, total_cents = deposit_cents, status ISSUED) (cascade: contract.account_balance_cents recomputed)"
          - "install.status = APPROVED"
      - from: APPROVED
        to: IN_BUILD
        trigger: "POST /aquatics/installs/{id}/start-build"
        actor: FieldTech
        preconditions:
          - "target SystemProfile.status == PROVISIONING"
        side_effects:
          - "install.status = IN_BUILD"
      - from: IN_BUILD
        to: HANDED_OFF
        trigger: "POST /aquatics/installs/{id}/handoff"
        actor: AccountManager
        preconditions:
          - "actual_labor_minutes and actual_equipment_cents provided"
        side_effects:
          - "compute final_total_cents via calculations.install_billing (FINAL)"
          - "create a balance Invoice (source_kind INSTALL, total_cents = final_total_cents - deposit_cents, status ISSUED) (cascade: contract.account_balance_cents recomputed)"
          - "install.status = HANDED_OFF"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /aquatics/installs/{id}/cancel"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "install.status = CANCELLED"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /aquatics/installs/{id}/cancel"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "install.status = CANCELLED"
          - "void the deposit Invoice for this install (status -> VOID) (compensation: contract.account_balance_cents recomputed, deposit contribution removed)"

  - entity: EmergencyCall
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /aquatics/emergencies/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "target SystemProfile.status == ACTIVE"
          - "assigned Technician.active == true"
          - "if SystemProfile.system_kind == REEF then Technician.certified_for_reef == true"
        side_effects:
          - "create an EMERGENCY ServiceVisit (visit_kind EMERGENCY, emergency_call_id = this call) in SCHEDULED"
          - "set emergency.dispatched_visit_id and emergency.status = DISPATCHED"
      - from: DISPATCHED
        to: RESOLVED
        trigger: "system event: the dispatched EMERGENCY visit COMPLETED"
        actor: system
        preconditions:
          - "dispatched ServiceVisit.status == COMPLETED"
        side_effects:
          - "emergency.status = RESOLVED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /aquatics/emergencies/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "emergency.status = CANCELLED"

  - entity: QuarantineRecord
    initial_state: ACTIVE
    terminal_states: [CLEARED, ABORTED]
    transitions:
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /aquatics/quarantines/{id}/clear"
        actor: FieldTech
        preconditions:
          - "the linked Livestock.status == QUARANTINED"
        side_effects:
          - "quarantine.status = CLEARED"
          - "linked Livestock.status = ALIVE (cross-entity; bubble-up: home SystemProfile.bioload_index and stocking_posture recomputed, contract.alive_livestock_count recomputed)"
      - from: ACTIVE
        to: ABORTED
        trigger: "POST /aquatics/quarantines/{id}/abort"
        actor: FieldTech
        preconditions: []
        side_effects:
          - "quarantine.status = ABORTED"
          - "linked Livestock.status = DECEASED (cross-entity; contract.alive_livestock_count unchanged because a QUARANTINED animal was already excluded)"

  - entity: VacationFeedingPlan
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system event: logical clock reaches window_start (advanced by POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current_utc >= window_start"
          - "home SystemProfile.status == ACTIVE"
        side_effects:
          - "plan.status = ACTIVE"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system event: logical clock reaches window_end"
        actor: system
        preconditions:
          - "current_utc >= window_end"
        side_effects:
          - "plan.status = COMPLETED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /aquatics/feeding-plans/{id}/cancel"
        actor: CustomerOwner
        preconditions:
          - "acting CustomerOwner owns the contract of the plan's system"
        side_effects:
          - "plan.status = CANCELLED"

# ===========================================================================
# §1.2.1 CONCURRENCY RULES
# ===========================================================================
concurrency_rules:
  - rule_id: visit-create-stale-system
    parent_entity: SystemProfile
    write_endpoint: "POST /aquatics/visits"
    occ_field: "expected_system_version"
    description: |
      Scheduling a ServiceVisit against a SystemProfile whose version has advanced
      since the client last observed it is rejected. A routing client books a recurring
      visit on a view of the system that another operator has since changed (e.g. an
      install start moved the system out of an eligible posture, or another visit was
      booked changing route state). The stale-version check rejects the create so the
      booking is re-derived from current system state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: quarantine-create-stale-tank
    parent_entity: SystemProfile
    write_endpoint: "POST /aquatics/quarantines"
    occ_field: "expected_tank_version"
    description: |
      Opening a QuarantineRecord against a quarantine-tank SystemProfile whose version
      has advanced since the client last observed it is rejected. Another writer may
      have just opened a quarantine occupancy on the same tank (legitimately changing
      its occupancy state); the current writer's view is therefore stale and the create
      is rejected on the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 CALCULATION RULES TABLE
# ===========================================================================
calculations:
  - name: visit_billing
    trigger: "ServiceVisit IN_PROGRESS -> COMPLETED (POST /aquatics/visits/{id}/complete)"
    algorithm: tiered_pricing
    formula: |
      tier = owning ServiceContract.service_tier   # resolved via system.contract_id
      base = TIER_BASE_CENTS[tier]
      included = TIER_INCLUDED_MINUTES[tier]
      overage_minutes = max(0, labor_minutes - included)
      blocks = ceil(overage_minutes / 15)            # any partial 15-min block bills in full
      labor_overage = blocks * PER_BLOCK_CENTS
      line_items = sum(line.qty * line.unit_price_cents for line in request.consumable_lines)
      subtotal = base + labor_overage + line_items
      plan_discount = round_half_up(subtotal * TIER_DISCOUNT_RATE[tier])   # discount on subtotal
      after_discount = subtotal - plan_discount
      surcharge = round_half_up(after_discount * EMERGENCY_SURCHARGE_RATE) if visit_kind == EMERGENCY else 0
      total_cents = after_discount + surcharge
    input_set: "consumable_lines supplied on the complete request; labor_minutes on the visit; tier from the owning contract"
    constants:
      TIER_BASE_CENTS: { BASIC: 6000, PLUS: 9000, PREMIUM: 13000 }
      TIER_INCLUDED_MINUTES: { BASIC: 30, PLUS: 45, PREMIUM: 60 }
      TIER_DISCOUNT_RATE: { BASIC: 0.00, PLUS: 0.10, PREMIUM: 0.15 }
      PER_BLOCK_CENTS: 2000
      EMERGENCY_SURCHARGE_RATE: 0.25
    precision: "integer cents; round_half_up applied to discount and surcharge before they are subtracted/added"
    variants:
      - name: routine
        when: "visit_kind == ROUTINE"
        difference: "no emergency surcharge; surcharge term is 0"
      - name: emergency
        when: "visit_kind == EMERGENCY"
        difference: "surcharge = round_half_up(after_discount * 0.25) added; produces a strictly higher total than the routine variant for identical labor/lines"

  - name: install_billing
    trigger: "InstallProject QUOTED -> APPROVED (PROVISIONAL: quote_total_cents, deposit_cents) and IN_BUILD -> HANDED_OFF (FINAL: final_total_cents)"
    algorithm: tiered_pricing
    formula: |
      # PROVISIONAL (at approve):
      quote_total_cents = labor_estimate_cents + equipment_estimate_cents
      deposit_cents = round_half_up(quote_total_cents * DEPOSIT_RATE)
      # FINAL (at handoff):
      actual_blocks = ceil(actual_labor_minutes / 15)
      actual_labor_cents = actual_blocks * PER_BLOCK_CENTS
      final_total_cents = actual_labor_cents + actual_equipment_cents + change_order_cents
      balance_invoice_cents = final_total_cents - deposit_cents   # may be negative-guarded to 0 by validation
    input_set: "labor/equipment estimates at quote; actual_labor_minutes, actual_equipment_cents, change_order_cents at handoff"
    constants:
      DEPOSIT_RATE: 0.30
      PER_BLOCK_CENTS: 2000
    precision: "integer cents; round_half_up on deposit"
    variants:
      - name: provisional
        when: "at APPROVED"
        difference: "billed from estimates; deposit only"
      - name: final
        when: "at HANDED_OFF"
        difference: "billed from actuals + change orders; balance invoice = final_total - deposit. Same project, two algorithms, different amounts."

  - name: dose_volume_ml
    trigger: "POST /aquatics/visits/{id}/water-tests (WaterTest created on an IN_PROGRESS visit)"
    algorithm: threshold
    formula: |
      eff_volume_l = system.nominal_volume_l * (1 - system.substrate_displacement_pct)
      if measured_value >= target_value:
        recommended_dose_ml = 0.0
      else:
        raw_ml = (target_value - measured_value) * eff_volume_l / product_strength_ppm_per_ml
        recommended_dose_ml = ceil(raw_ml * 10) / 10.0     # round UP to nearest 0.1 mL (never under-dose)
    input_set: "the WaterTest reading plus the home system's effective volume"
    constants: {}
    precision: "0.1 mL, round half away handled by ceil-up; values at or above target dose 0"
    variants:
      - name: at_or_above_target
        when: "measured_value >= target_value"
        difference: "dose is exactly 0.0 (boundary: measured == target doses 0, not a tiny positive)"
      - name: below_target
        when: "measured_value < target_value"
        difference: "positive dose rounded UP to 0.1 mL"

  - name: bioload_index
    trigger: "Livestock create/status-change, SystemProfile volume update, QuarantineRecord clear/abort"
    algorithm: aggregation
    formula: |
      eff_volume_l = nominal_volume_l * (1 - substrate_displacement_pct)
      raw = sum( l.adult_length_cm * WASTE_FACTOR[l.species_class]
                 for l in Livestock where l.system_id == system.id and l.status == ALIVE )
      bioload_index = round_half_up( raw / eff_volume_l * 100 , 2 )
      stocking_posture = OVERSTOCKED if bioload_index > 100.0 else NORMAL   # strict >
    input_set: "only Livestock with status == ALIVE on this system; QUARANTINED and DECEASED excluded"
    constants:
      WASTE_FACTOR: { COMMUNITY: 1.0, CICHLID: 1.5, GOLDFISH: 2.0, PREDATOR: 2.5, INVERT: 0.5 }
    precision: "2 decimal places, round_half_up; threshold is strict (> 100.0 overstocked, == 100.0 normal)"

  - name: account_balance
    trigger: "any Invoice create / void / payment posting"
    algorithm: aggregation
    formula: |
      account_balance_cents = sum( i.total_cents - i.amount_paid_cents
                                   for i in Invoice
                                   where i.contract_id == contract.id
                                   and i.status in {ISSUED, OVERDUE} )
    input_set: "Invoices whose status IN {ISSUED, OVERDUE}; PAID and VOID invoices excluded"
    constants: {}
    precision: "integer cents"

  - name: media_due_on
    trigger: "Equipment create; ServiceVisit complete that lists the equipment in serviced_equipment_ids"
    algorithm: chronological
    formula: |
      base_date = last_serviced_on if last_serviced_on is not null
                  else owning SystemProfile.created_at (date component)
      media_due_on = base_date + media_interval_days   # date arithmetic, days
    input_set: "the device's last_serviced_on and media_interval_days"
    constants: {}
    precision: "whole-day date arithmetic"

  - name: alive_livestock_count
    trigger: "Livestock create / status-change; SystemProfile decommission cascade; QuarantineRecord clear/abort"
    algorithm: aggregation
    formula: |
      alive_livestock_count = count( l for l in Livestock
                                     where l.system_id in (systems of this contract)
                                     and l.status == ALIVE )
    input_set: "Livestock with status == ALIVE across all of the contract's systems"
    constants: {}
    precision: "integer count"

# ===========================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Ownership: a CustomerOwner acting on a contract/visit/install/feeding-plan must own the underlying ServiceContract (X-User-ID == ServiceContract.customer_user_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /aquatics/visits/{id}/dispute, POST /aquatics/installs/{id}/approve, POST /aquatics/feeding-plans/{id}/cancel"

  - priority: 4
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "On visit start by a FieldTech, the acting tech id must equal visit.technician_id; on rework likewise"
    error_id: ERR_TECH_MISMATCH
    http_status: 403
    applies_to: "POST /aquatics/visits/{id}/start, POST /aquatics/visits/{id}/rework"

  - priority: 7
    category: business_safety
    check: "REEF system work requires the assigned/acting Technician.certified_for_reef == true (visit start, emergency dispatch)"
    error_id: ERR_TECH_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /aquatics/visits/{id}/start, POST /aquatics/emergencies/{id}/dispatch"

  - priority: 8
    category: business_safety
    check: "Adding a Livestock or clearing a quarantine into a system whose stocking_posture would become OVERSTOCKED ( resulting bioload_index > 100.0 ) is rejected"
    error_id: ERR_OVERSTOCKED
    http_status: 422
    applies_to: "POST /aquatics/livestock, POST /aquatics/quarantines/{id}/clear"

  - priority: 9
    category: business_temporal
    check: "A ServiceVisit window [scheduled_start, scheduled_end) must not overlap another non-terminal (SCHEDULED/IN_PROGRESS) ServiceVisit for the SAME Technician; half-open intervals — touching endpoints do NOT conflict"
    error_id: ERR_TECH_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /aquatics/visits, POST /aquatics/emergencies/{id}/dispatch"

  - priority: 10
    category: business_temporal
    check: "A QuarantineRecord window [window_start, window_end] must not overlap another ACTIVE QuarantineRecord on the same quarantine_tank_id; CLOSED intervals — sharing an endpoint (window_end_A == window_start_B) IS a conflict (no zero-gap adjacency on a physical tank)"
    error_id: ERR_QT_TANK_OCCUPIED
    http_status: 409
    applies_to: "POST /aquatics/quarantines"

  - priority: 11
    category: business_constraint
    check: "QuarantineRecord.quarantine_tank_id must reference a SystemProfile of system_kind == FRESHWATER"
    error_id: ERR_INVALID_QT_TANK
    http_status: 422
    applies_to: "POST /aquatics/quarantines"

  - priority: 12
    category: business_constraint
    check: "EMERGENCY visit creation requires emergency_call_id; ROUTINE visit must omit it"
    error_id: ERR_VISIT_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /aquatics/visits"

  - priority: 13
    category: business_temporal
    check: "Window ordering: scheduled_start < scheduled_end (visits, half-open); window_start <= window_end (quarantine, closed); window_start < window_end (feeding plan)"
    error_id: ERR_BAD_WINDOW
    http_status: 422
    applies_to: "POST /aquatics/visits, POST /aquatics/quarantines, POST /aquatics/feeding-plans"

  - priority: 14
    category: business_fiscal
    check: "Payment amount must be > 0 and must not drive amount_paid_cents above total_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /aquatics/invoices/{id}/payments"

  - priority: 15
    category: business_constraint
    check: "Optimistic concurrency: expected_<parent>_version must equal the live parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /aquatics/visits, POST /aquatics/quarantines"

  - priority: 16
    category: business_constraint
    check: "Required input fields present and well-typed; enum values within declared domain; numeric ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"

# ===========================================================================
# §1.5 API ENDPOINT TABLE
# ===========================================================================
endpoints:
  # ---- ServiceContract ----
  - method: POST
    path: "/aquatics/contracts"
    description: "Create a service contract (DRAFT)."
    roles: [AccountManager]
    code: 201
    input: [customer_name, customer_user_id, service_tier, route_day]
    output: ServiceContract
    side_effects: []
  - method: GET
    path: "/aquatics/contracts"
    description: "List contracts (paginated)."
    roles: [AccountManager, Dispatcher]
    code: 200
    input: ["status?", "route_day?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []
  - method: GET
    path: "/aquatics/contracts/{id}"
    description: "Fetch a contract incl. derived account_balance_cents and alive_livestock_count."
    roles: [AccountManager, Dispatcher, CustomerOwner]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []
  - method: POST
    path: "/aquatics/contracts/{id}/activate"
    description: "Activate a DRAFT or reactivate a SUSPENDED contract."
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["contract.status -> ACTIVE", "on reactivation, cascade SUSPENDED systems -> ACTIVE"]
  - method: POST
    path: "/aquatics/contracts/{id}/suspend"
    description: "Suspend an ACTIVE contract for non-payment."
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["contract.status -> SUSPENDED", "cascade ACTIVE systems -> SUSPENDED"]
  - method: POST
    path: "/aquatics/contracts/{id}/terminate"
    description: "Terminate a contract; decommission its systems."
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["contract.status -> TERMINATED", "cascade systems -> DECOMMISSIONED -> live livestock DECEASED"]

  # ---- SystemProfile ----
  - method: POST
    path: "/aquatics/systems"
    description: "Create a system profile (PROVISIONING) under a contract."
    roles: [AccountManager]
    code: 201
    input: ["contract_id", "label", "system_kind", "nominal_volume_l", "substrate_displacement_pct?"]
    output: SystemProfile
    side_effects: []
  - method: GET
    path: "/aquatics/systems/{id}"
    description: "Fetch a system incl. derived bioload_index and stocking_posture."
    roles: [AccountManager, Dispatcher, FieldTech, CustomerOwner]
    code: 200
    input: []
    output: SystemProfile
    side_effects: []
  - method: GET
    path: "/aquatics/contracts/{id}/systems"
    description: "List systems under a contract (FK reverse-reachability for SystemProfile.contract_id)."
    roles: [AccountManager, Dispatcher, CustomerOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: SystemProfile[]
    side_effects: []
  - method: POST
    path: "/aquatics/systems/{id}/commission"
    description: "Move a PROVISIONING system to ACTIVE."
    roles: [AccountManager]
    code: 200
    input: []
    output: SystemProfile
    side_effects: ["system.status -> ACTIVE"]
  - method: POST
    path: "/aquatics/systems/{id}/decommission"
    description: "Decommission an ACTIVE/SUSPENDED system; cascade live livestock to DECEASED."
    roles: [AccountManager]
    code: 200
    input: []
    output: SystemProfile
    side_effects: ["system.status -> DECOMMISSIONED", "cascade ALIVE livestock -> DECEASED"]

  # ---- Livestock ----
  - method: POST
    path: "/aquatics/livestock"
    description: "Add a livestock item to a system (ALIVE); recompute bioload."
    roles: [FieldTech, AccountManager]
    code: 201
    input: [system_id, common_name, species_class, adult_length_cm]
    output: Livestock
    side_effects: ["recompute system.bioload_index + stocking_posture; recompute contract.alive_livestock_count"]
  - method: GET
    path: "/aquatics/systems/{id}/livestock"
    description: "List livestock under a system (FK reverse-reachability for Livestock.system_id)."
    roles: [AccountManager, Dispatcher, FieldTech, CustomerOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Livestock[]
    side_effects: []
  - method: GET
    path: "/aquatics/livestock/{id}"
    description: "Fetch a single livestock item."
    roles: [AccountManager, Dispatcher, FieldTech, CustomerOwner]
    code: 200
    input: []
    output: Livestock
    side_effects: []

  # ---- Equipment ----
  - method: POST
    path: "/aquatics/equipment"
    description: "Register a device on a system; compute first media_due_on."
    roles: [FieldTech, AccountManager]
    code: 201
    input: [system_id, device_kind, media_interval_days]
    output: Equipment
    side_effects: ["compute media_due_on from system created date"]
  - method: GET
    path: "/aquatics/systems/{id}/equipment"
    description: "List equipment under a system (FK reverse-reachability for Equipment.system_id)."
    roles: [AccountManager, Dispatcher, FieldTech, CustomerOwner]
    code: 200
    input: ["device_kind?", "limit?", "offset?"]
    output: Equipment[]
    side_effects: []
  - method: GET
    path: "/aquatics/equipment/{id}"
    description: "Fetch a single device incl. media_due_on."
    roles: [AccountManager, Dispatcher, FieldTech, CustomerOwner]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  # ---- Technician ----
  - method: POST
    path: "/aquatics/technicians"
    description: "Add a technician to the roster."
    roles: [Dispatcher]
    code: 201
    input: ["tech_user_id", "full_name", "certified_for_reef?", "active?"]
    output: Technician
    side_effects: []
  - method: GET
    path: "/aquatics/technicians/{id}"
    description: "Fetch a technician."
    roles: [Dispatcher, AccountManager, FieldTech]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # ---- ServiceVisit ----
  - method: POST
    path: "/aquatics/visits"
    description: "Book a ROUTINE service visit (OCC on the system version)."
    roles: [Dispatcher]
    code: 201
    input: ["system_id", "technician_id", "scheduled_start", "scheduled_end", "expected_system_version", "visit_kind?", "emergency_call_id?"]
    output: ServiceVisit
    side_effects: ["increments SystemProfile.version by 1", "double-booking + window checks"]
  - method: GET
    path: "/aquatics/visits/{id}"
    description: "Fetch a visit incl. total_cents and invoice_id."
    roles: [AccountManager, Dispatcher, FieldTech, CustomerOwner]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []
  - method: GET
    path: "/aquatics/visits"
    description: "List visits; filter by system, technician, or emergency call (FK reverse-reachability for visit.system_id, visit.technician_id, visit.emergency_call_id)."
    roles: [AccountManager, Dispatcher, FieldTech]
    code: 200
    input: ["system_id?", "technician_id?", "emergency_call_id?", "status?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: POST
    path: "/aquatics/visits/{id}/start"
    description: "Start a SCHEDULED visit (FieldTech == assigned tech; reef cert gate)."
    roles: [FieldTech]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["visit.status -> IN_PROGRESS"]
  - method: POST
    path: "/aquatics/visits/{id}/complete"
    description: "Complete an IN_PROGRESS visit; bill it and issue an invoice."
    roles: [FieldTech]
    code: 200
    input: ["labor_minutes", "consumable_lines?", "serviced_equipment_ids?"]
    output: ServiceVisit
    side_effects: ["compute total_cents (visit_billing)", "create Invoice + recompute account_balance", "advance serviced equipment media schedules", "resolve linked EmergencyCall"]
  - method: POST
    path: "/aquatics/visits/{id}/dispute"
    description: "Owner disputes a COMPLETED visit; voids its invoice."
    roles: [CustomerOwner]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["visit.status -> DISPUTED", "invoice -> VOID + recompute account_balance"]
  - method: POST
    path: "/aquatics/visits/{id}/rework"
    description: "Tech reopens a DISPUTED visit for rework (cyclic)."
    roles: [FieldTech]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["visit.status -> IN_PROGRESS", "clear invoice_id, reset total_cents"]
  - method: POST
    path: "/aquatics/visits/{id}/cancel"
    description: "Cancel a SCHEDULED visit."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["visit.status -> CANCELLED", "if EMERGENCY: revert EmergencyCall to OPEN (compensation)"]

  # ---- WaterTest / dosing ----
  - method: POST
    path: "/aquatics/visits/{id}/water-tests"
    description: "Log a water test on an IN_PROGRESS visit; compute recommended dose."
    roles: [FieldTech]
    code: 201
    input: [parameter, measured_value, target_value, product_strength_ppm_per_ml]
    output: WaterTest
    side_effects: ["compute recommended_dose_ml (dose_volume_ml)"]
  - method: GET
    path: "/aquatics/visits/{id}/water-tests"
    description: "List water tests for a visit (FK reverse-reachability for WaterTest.visit_id)."
    roles: [AccountManager, Dispatcher, FieldTech, CustomerOwner]
    code: 200
    input: ["parameter?", "limit?", "offset?"]
    output: WaterTest[]
    side_effects: []

  # ---- Invoice ----
  - method: GET
    path: "/aquatics/invoices/{id}"
    description: "Fetch an invoice."
    roles: [AccountManager, CustomerOwner]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/aquatics/contracts/{id}/invoices"
    description: "List invoices for a contract (FK reverse-reachability for Invoice.contract_id)."
    roles: [AccountManager, CustomerOwner]
    code: 200
    input: ["status?", "source_kind?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/aquatics/invoices/{id}/payments"
    description: "Apply a payment to an ISSUED/OVERDUE invoice."
    roles: [AccountManager]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["advance amount_paid_cents", "if fully paid status -> PAID", "recompute account_balance"]
  - method: POST
    path: "/aquatics/invoices/{id}/flag-overdue"
    description: "Flag an ISSUED invoice past its due_on as OVERDUE (per logical clock)."
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> OVERDUE (no balance change; ISSUED and OVERDUE both count)"]

  # ---- InstallProject ----
  - method: POST
    path: "/aquatics/installs"
    description: "Create an install project quote (QUOTED)."
    roles: [AccountManager]
    code: 201
    input: [contract_id, system_id, labor_estimate_cents, equipment_estimate_cents]
    output: InstallProject
    side_effects: []
  - method: GET
    path: "/aquatics/installs/{id}"
    description: "Fetch an install project incl. quote/deposit/final totals."
    roles: [AccountManager, FieldTech, CustomerOwner]
    code: 200
    input: []
    output: InstallProject
    side_effects: []
  - method: GET
    path: "/aquatics/contracts/{id}/installs"
    description: "List install projects for a contract (FK reverse-reachability for InstallProject.contract_id)."
    roles: [AccountManager, CustomerOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InstallProject[]
    side_effects: []
  - method: GET
    path: "/aquatics/systems/{id}/installs"
    description: "List install projects for a system (FK reverse-reachability for InstallProject.system_id)."
    roles: [AccountManager, FieldTech, CustomerOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InstallProject[]
    side_effects: []
  - method: POST
    path: "/aquatics/installs/{id}/approve"
    description: "Owner approves a QUOTED project; computes deposit, issues deposit invoice."
    roles: [CustomerOwner]
    code: 200
    input: []
    output: InstallProject
    side_effects: ["compute quote_total + deposit", "issue deposit Invoice + recompute account_balance", "status -> APPROVED"]
  - method: POST
    path: "/aquatics/installs/{id}/start-build"
    description: "Begin the build on an APPROVED project."
    roles: [FieldTech]
    code: 200
    input: []
    output: InstallProject
    side_effects: ["status -> IN_BUILD"]
  - method: POST
    path: "/aquatics/installs/{id}/handoff"
    description: "Hand off an IN_BUILD project; bill final; issue balance invoice."
    roles: [AccountManager]
    code: 200
    input: ["actual_labor_minutes", "actual_equipment_cents", "change_order_cents?"]
    output: InstallProject
    side_effects: ["compute final_total", "issue balance Invoice + recompute account_balance", "status -> HANDED_OFF"]
  - method: POST
    path: "/aquatics/installs/{id}/cancel"
    description: "Cancel a QUOTED/APPROVED project; void deposit invoice if any (compensation)."
    roles: [AccountManager]
    code: 200
    input: []
    output: InstallProject
    side_effects: ["status -> CANCELLED", "if APPROVED: void deposit Invoice + recompute account_balance"]

  # ---- EmergencyCall ----
  - method: POST
    path: "/aquatics/emergencies"
    description: "Open an emergency call (OPEN)."
    roles: [Dispatcher, AccountManager]
    code: 201
    input: [system_id, severity, reported_at, trip_fee_cents]
    output: EmergencyCall
    side_effects: []
  - method: GET
    path: "/aquatics/emergencies/{id}"
    description: "Fetch an emergency call."
    roles: [Dispatcher, AccountManager, FieldTech]
    code: 200
    input: []
    output: EmergencyCall
    side_effects: []
  - method: GET
    path: "/aquatics/systems/{id}/emergencies"
    description: "List emergency calls for a system (FK reverse-reachability for EmergencyCall.system_id)."
    roles: [Dispatcher, AccountManager, FieldTech]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EmergencyCall[]
    side_effects: []
  - method: POST
    path: "/aquatics/emergencies/{id}/dispatch"
    description: "Dispatch a tech; auto-creates an EMERGENCY ServiceVisit (OCC-free; double-booking checked)."
    roles: [Dispatcher]
    code: 200
    input: [technician_id, scheduled_start, scheduled_end]
    output: EmergencyCall
    side_effects: ["create EMERGENCY ServiceVisit (SCHEDULED)", "set dispatched_visit_id; status -> DISPATCHED"]
  - method: POST
    path: "/aquatics/emergencies/{id}/cancel"
    description: "Cancel an OPEN emergency call."
    roles: [Dispatcher]
    code: 200
    input: []
    output: EmergencyCall
    side_effects: ["status -> CANCELLED"]

  # ---- QuarantineRecord ----
  - method: POST
    path: "/aquatics/quarantines"
    description: "Open a quarantine on a livestock item in a FRESHWATER QT tank (OCC on tank version); moves animal to QUARANTINED."
    roles: [FieldTech]
    code: 201
    input: [livestock_id, quarantine_tank_id, window_start, window_end, expected_tank_version]
    output: QuarantineRecord
    side_effects: ["increments SystemProfile.version (tank) by 1", "Livestock.status -> QUARANTINED; recompute home system bioload + contract.alive_livestock_count", "tank-occupancy overlap check"]
  - method: GET
    path: "/aquatics/quarantines/{id}"
    description: "Fetch a quarantine record."
    roles: [FieldTech, AccountManager, Dispatcher]
    code: 200
    input: []
    output: QuarantineRecord
    side_effects: []
  - method: GET
    path: "/aquatics/livestock/{id}/quarantines"
    description: "List quarantine records for a livestock item (FK reverse-reachability for QuarantineRecord.livestock_id)."
    roles: [FieldTech, AccountManager, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: QuarantineRecord[]
    side_effects: []
  - method: GET
    path: "/aquatics/systems/{id}/quarantines"
    description: "List quarantine records using a system as the QT tank (FK reverse-reachability for QuarantineRecord.quarantine_tank_id)."
    roles: [FieldTech, AccountManager, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: QuarantineRecord[]
    side_effects: []
  - method: POST
    path: "/aquatics/quarantines/{id}/clear"
    description: "Clear a quarantine; return the animal to ALIVE (overstock-gated)."
    roles: [FieldTech]
    code: 200
    input: []
    output: QuarantineRecord
    side_effects: ["status -> CLEARED", "Livestock.status -> ALIVE; recompute bioload + alive_livestock_count"]
  - method: POST
    path: "/aquatics/quarantines/{id}/abort"
    description: "Abort a quarantine; animal becomes DECEASED."
    roles: [FieldTech]
    code: 200
    input: []
    output: QuarantineRecord
    side_effects: ["status -> ABORTED", "Livestock.status -> DECEASED"]

  # ---- RepairOrder ----
  - method: POST
    path: "/aquatics/repairs"
    description: "Open a repair order for a device (REPORTED)."
    roles: [FieldTech, AccountManager]
    code: 201
    input: ["equipment_id", "reported_symptom", "parts_needed?"]
    output: RepairOrder
    side_effects: []
  - method: GET
    path: "/aquatics/repairs/{id}"
    description: "Fetch a repair order."
    roles: [FieldTech, AccountManager]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: GET
    path: "/aquatics/equipment/{id}/repairs"
    description: "List repair orders for a device (FK reverse-reachability for RepairOrder.equipment_id)."
    roles: [FieldTech, AccountManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: POST
    path: "/aquatics/repairs/{id}/diagnose"
    description: "Diagnose a REPORTED repair; device -> DEGRADED."
    roles: [FieldTech]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> DIAGNOSED", "Equipment.status -> DEGRADED"]
  - method: POST
    path: "/aquatics/repairs/{id}/order-parts"
    description: "Order parts for a DIAGNOSED repair (parts_needed)."
    roles: [FieldTech]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> AWAITING_PARTS"]
  - method: POST
    path: "/aquatics/repairs/{id}/parts-arrived"
    description: "Parts arrived; return to DIAGNOSED (cyclic)."
    roles: [FieldTech]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> DIAGNOSED"]
  - method: POST
    path: "/aquatics/repairs/{id}/close"
    description: "Close a DIAGNOSED repair; device -> OPERATIONAL."
    roles: [FieldTech]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> CLOSED", "Equipment.status -> OPERATIONAL"]
  - method: POST
    path: "/aquatics/repairs/{id}/scrap"
    description: "Scrap a DIAGNOSED repair; device -> OUT_OF_SERVICE."
    roles: [FieldTech]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> SCRAPPED", "Equipment.status -> OUT_OF_SERVICE"]

  # ---- VacationFeedingPlan ----
  - method: POST
    path: "/aquatics/feeding-plans"
    description: "Schedule a vacation feeding plan on an ACTIVE system."
    roles: [CustomerOwner, AccountManager]
    code: 201
    input: [system_id, window_start, window_end, feedings_per_day]
    output: VacationFeedingPlan
    side_effects: []
  - method: GET
    path: "/aquatics/feeding-plans/{id}"
    description: "Fetch a feeding plan."
    roles: [CustomerOwner, AccountManager, Dispatcher]
    code: 200
    input: []
    output: VacationFeedingPlan
    side_effects: []
  - method: GET
    path: "/aquatics/systems/{id}/feeding-plans"
    description: "List feeding plans for a system (FK reverse-reachability for VacationFeedingPlan.system_id)."
    roles: [CustomerOwner, AccountManager, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VacationFeedingPlan[]
    side_effects: []
  - method: POST
    path: "/aquatics/feeding-plans/{id}/cancel"
    description: "Owner cancels a SCHEDULED feeding plan."
    roles: [CustomerOwner]
    code: 200
    input: []
    output: VacationFeedingPlan
    side_effects: ["status -> CANCELLED"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock used for overdue flagging, feeding-plan activation/completion, and emergency reported_at semantics. Server startup default is 2026-01-01T00:00:00Z; before any set call the logical clock reads exactly this default and never falls back to wall-clock time. Advancing the clock auto-evaluates scheduled feeding-plan transitions (SCHEDULED->ACTIVE at window_start, ACTIVE->COMPLETED at window_end)."
    roles: [AccountManager, Dispatcher]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance logical clock", "auto-transition feeding plans whose window boundaries are crossed"]

# ===========================================================================
# §1.6 ERROR CODE CATALOG
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role is not permitted for this endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "CustomerOwner X-User-ID does not own the underlying ServiceContract."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced contract/system/livestock/equipment/visit/invoice/install/emergency/quarantine/repair/feeding-plan/technician does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the entity's current state."
  - id: ERR_TECH_MISMATCH
    http: 403
    condition: "Acting FieldTech id != visit.technician_id on start/rework."
  - id: ERR_TECH_NOT_CERTIFIED
    http: 422
    condition: "REEF system work attempted with a technician whose certified_for_reef is false."
  - id: ERR_OVERSTOCKED
    http: 422
    condition: "Adding livestock or clearing a quarantine would push the home system's bioload_index above 100.0."
  - id: ERR_TECH_DOUBLE_BOOKED
    http: 409
    condition: "The booked visit window overlaps another SCHEDULED/IN_PROGRESS visit for the same technician (half-open intervals)."
  - id: ERR_QT_TANK_OCCUPIED
    http: 409
    condition: "The quarantine window collides with another ACTIVE quarantine on the same tank (closed intervals; shared endpoint conflicts)."
  - id: ERR_INVALID_QT_TANK
    http: 422
    condition: "quarantine_tank_id does not reference a FRESHWATER system."
  - id: ERR_VISIT_KIND_MISMATCH
    http: 422
    condition: "EMERGENCY visit missing emergency_call_id, or ROUTINE visit supplying one."
  - id: ERR_BAD_WINDOW
    http: 422
    condition: "Window endpoints out of order for the entity's interval semantics."
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment <= 0 or would push amount_paid_cents above total_cents."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the live parent version (OCC)."
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 422
    condition: "Operation requires the owning ServiceContract.status == ACTIVE (system commission, install approve)."
  - id: ERR_SYSTEM_NOT_PROVISIONING
    http: 422
    condition: "Install start-build requires the target system to be PROVISIONING."
  - id: ERR_OPEN_INSTALL_BLOCKS_COMMISSION
    http: 409
    condition: "System commission blocked by an open InstallProject (QUOTED/APPROVED/IN_BUILD)."
  - id: ERR_BALANCE_OUTSTANDING
    http: 422
    condition: "Reactivating a SUSPENDED contract requires account_balance_cents == 0."
  - id: ERR_VISIT_IN_FLIGHT
    http: 409
    condition: "Contract terminate / system decommission blocked by a SCHEDULED or IN_PROGRESS visit."
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "Payment attempted on a non-ISSUED/non-OVERDUE invoice (PAID or VOID)."
  - id: ERR_NO_SYSTEM_ON_CONTRACT
    http: 422
    condition: "Activating a DRAFT contract with no SystemProfile."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad enum, or out-of-range numeric value."

# ===========================================================================
# §1.7 RBAC MATRIX
# ===========================================================================
roles:
  - name: AccountManager
    description: "Owns contracts, systems, installs, invoices, and final billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /aquatics/contracts (+activate/suspend/terminate)"
      - "POST /aquatics/systems (+commission/decommission)"
      - "POST /aquatics/installs (+handoff/cancel)"
      - "POST /aquatics/invoices/{id}/payments"
      - "POST /aquatics/invoices/{id}/flag-overdue"
    shared_operations:
      - "POST /aquatics/livestock, POST /aquatics/equipment, POST /aquatics/repairs (with FieldTech)"
      - "POST /aquatics/emergencies (with Dispatcher)"
      - "POST /aquatics/feeding-plans (with CustomerOwner)"
      - "GET reads on contracts/systems/livestock/equipment/visits/invoices/installs/emergencies/quarantines/repairs/feeding-plans"

  - name: FieldTech
    description: "Executes service visits, water tests, quarantines, and repairs."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /aquatics/visits/{id}/start, /complete, /rework"
      - "POST /aquatics/visits/{id}/water-tests"
      - "POST /aquatics/quarantines (+clear/abort)"
      - "POST /aquatics/repairs/{id}/diagnose, /order-parts, /parts-arrived, /close, /scrap"
      - "POST /aquatics/installs/{id}/start-build"
    shared_operations:
      - "POST /aquatics/livestock, POST /aquatics/equipment, POST /aquatics/repairs (with AccountManager)"
      - "GET reads on systems/livestock/equipment/visits/installs/emergencies/quarantines/repairs"

  - name: Dispatcher
    description: "Schedules the recurring route, books visits, dispatches emergencies."
    identity: "opaque"
    exclusive_operations:
      - "POST /aquatics/visits (book)"
      - "POST /aquatics/visits/{id}/cancel"
      - "POST /aquatics/technicians"
      - "POST /aquatics/emergencies/{id}/dispatch, /cancel"
    shared_operations:
      - "POST /aquatics/emergencies (with AccountManager)"
      - "GET reads on contracts/systems/livestock/equipment/visits/emergencies/quarantines/feeding-plans"

  - name: CustomerOwner
    description: "Account owner; approves installs, disputes visits, cancels own feeding plans."
    identity: "entity_backed:ServiceContract"
    exclusive_operations:
      - "POST /aquatics/visits/{id}/dispute"
      - "POST /aquatics/installs/{id}/approve"
      - "POST /aquatics/feeding-plans/{id}/cancel"
    shared_operations:
      - "POST /aquatics/feeding-plans (with AccountManager)"
      - "GET reads on own contract/systems/livestock/equipment/visits/invoices/installs/quarantines/feeding-plans"
