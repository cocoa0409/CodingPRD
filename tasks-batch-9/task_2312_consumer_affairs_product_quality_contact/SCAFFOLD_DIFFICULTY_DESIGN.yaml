  # ===========================================================================
  - rule_id: boundary_precision_check
    rule_summary: "Behaviour is pinned at an exact boundary value and at the value one step away, so an off-by-one comparison or a rounding slip is caught."
    instances:

      - name: severity_band_boundary_at_exactly_ninety
        grounds: "§1.3 complaint_severity_score constants BAND_S1_MIN 90, BAND_S2_MIN 60; SYMPTOM_CODE_CAP 4"
        distinguishing_aspect: "Band classification boundary, tested at exactly 90.00 and at 89.00, with both severity multipliers deliberately inert (non-regulated product, no vulnerability) so the additive total is the whole story. Also pins SYMPTOM_CODE_CAP by showing 6 symptom codes score identically to 4."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1 and SUP1 (TIER_3) exist."
            - "Consumer C-1 exists with is_vulnerable_flag explicitly false, so the VULNERABLE_MULTIPLIER can never fire."
            - "The product SKU-MUG has is_regulated_food false, so the REGULATED_MULTIPLIER can never fire either and the additive total is the whole score."
            - "ProductionLot LOT-N is RELEASED with 200000 units_produced on line L-01 of plant P-CHI, and no Complaint exists on it yet."
            - "One Contact of channel WEB exists to parent the three complaints created in the trigger."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601", is_vulnerable_flag: false }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-MUG", name: "Ceramic Mug", category: HOUSEWARE, is_regulated_food: false, unit_retail_price_cents: 1800, units_per_case: 6 }, captures: { pr2: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr2}", production_line_id: "${ln1}", batch_code: "LOT-N", code_date: "2026-07-12T00:00:00Z", units_produced: 200000 }, captures: { lotn: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: WEB, received_at: "2026-08-01T00:00:00Z", raw_message: "Three separate incidents with this batch." }, captures: { ct1: "$.data.id" } }
          trigger:
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "LOTN", foreign_object_class: HARD_BLUNT, hospitalization: true, vulnerable_consumer: false }, captures: { cpa: "$.data.id", sa: "$.data.provisional_severity_score", ba: "$.data.provisional_severity_band" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: PACKAGING, reported_batch_code: "LOTN", foreign_object_class: HARD_SHARP, medical_attention_sought: true, symptom_codes: [CUT, PAIN, SWELLING, BLEEDING], vulnerable_consumer: false }, captures: { cpb: "$.data.id", sb: "$.data.provisional_severity_score", bb: "$.data.provisional_severity_band" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: PACKAGING, reported_batch_code: "LOTN", foreign_object_class: HARD_SHARP, medical_attention_sought: true, symptom_codes: [CUT, PAIN, SWELLING, BLEEDING, NAUSEA, HEADACHE], vulnerable_consumer: false }, captures: { cpc: "$.data.id", sc: "$.data.provisional_severity_score", bc: "$.data.provisional_severity_band" } }
            - { call: "POST /complaints/${cpa}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Boundary case, exactly at the S1 line." }, captures: { aa: "$.data.adjudicated_severity_score", aba: "$.data.adjudicated_severity_band" } }
            - { call: "POST /complaints/${cpb}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "One point below the S1 line." }, captures: { ab: "$.data.adjudicated_severity_score", abb: "$.data.adjudicated_severity_band" } }
          assert:
            - "cpa: provisional_severity_score == 90.00 (40 + 15 + 35) and provisional_severity_band == \"S1\" — the boundary is INCLUSIVE"
            - "cpb: provisional_severity_score == 89.00 (20 + 30 + 25 + 3.5*4) and provisional_severity_band == \"S2\" — one point below flips the band"
            - "cpc: provisional_severity_score == 89.00 and provisional_severity_band == \"S2\", identical to cpb, because SYMPTOM_CODE_CAP 4 discards the 5th and 6th symptom codes"
            - "cpa after triage: adjudicated_severity_score == 90.00 and adjudicated_severity_band == \"S1\" — both multipliers are inert (product is_regulated_food false, vulnerable_consumer false, Consumer.is_vulnerable_flag false)"
            - "cpb after triage: adjudicated_severity_score == 89.00, band \"S2\""
            - "GET /production-lots/${lotn} release_status == \"HOLD\", held by the S1 adjudication of cpa alone"

      - name: zero_unit_denominator_returns_undefined_not_error
        grounds: "§1.3 lot_complaint_rate_ppm: units_produced == 0 yields rate_ppm 0.00 with rate_undefined true; §1.1 ProductionLot.units_produced constraint >= 0"
        distinguishing_aspect: "Degenerate-DENOMINATOR boundary rather than a band cut-point: the interesting value is zero on the divisor, and the specified behaviour is a sentinel flag rather than an error or a division. Different entity and different algorithm family (aggregation) from the severity band boundary."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1 and SUP1 (TIER_3) exist; Consumer C-1 exists."
            - "ProductionLot LOT-ZERO is RELEASED with units_produced exactly 0 (the degenerate denominator, allowed by the >= 0 constraint)."
            - "ProductionLot LOT-ONE is RELEASED with units_produced exactly 1 (the smallest non-zero denominator)."
            - "Exactly one QUALITY Complaint resolves to each lot, both in handling_status INTAKE, so each lot has numerator 1 under the provisional variant."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "LOT-ZERO", code_date: "2026-07-13T00:00:00Z", units_produced: 0 }, captures: { lotz: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "LOT-ONE", code_date: "2026-07-14T00:00:00Z", units_produced: 1 }, captures: { loto: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: EMAIL, received_at: "2026-08-01T00:00:00Z", raw_message: "Complaints on two pilot batches." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "LOTZERO" }, captures: { cpz: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "LOTONE" }, captures: { cpo: "$.data.id" } }
          trigger:
            - { call: "GET /production-lots/${lotz}/complaint-rate", as: CareSupervisor, as_user_id: "${sup1}", payload: { variant: provisional }, captures: { zr: "$.data.rate_ppm", zu: "$.data.rate_undefined" } }
            - { call: "GET /production-lots/${loto}/complaint-rate", as: CareSupervisor, as_user_id: "${sup1}", payload: { variant: provisional }, captures: { orr: "$.data.rate_ppm", ou: "$.data.rate_undefined" } }
          assert:
            - "LOT-ZERO read: numerator == 1, units_produced == 0, rate_ppm == 0.00, rate_undefined == true, HTTP 200 — no error and no division"
            - "LOT-ONE read: numerator == 1, units_produced == 1, rate_ppm == 1000000.00, rate_undefined == false — the smallest non-zero denominator produces the largest finite rate"
            - "the zero-denominator lot reports rate_ppm 0.00, i.e. the SAME number a clean lot reports, so rate_undefined is the only field that distinguishes them"

      - name: ops_run_fires_at_exact_weighted_count_and_exact_threshold_ppm
        grounds: "§1.3 trend_signal_evaluation constants MIN_WEIGHTED_COUNT 3.0 and THRESHOLD_PPM.LOT 25.0, both compared with >=; half-open window [clock - 30d, clock)"
        distinguishing_aspect: "Two inclusive thresholds exercised together within one ops run, each on a different lot, plus a third lot that sits below one of them. Unlike the other two instances this boundary is only observable through an aggregate side effect (signals_created_count) rather than a field on the row that was written."
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-08-02T00:00:00Z before the run, so every complaint falls inside the half-open window [2026-07-03T00:00:00Z, 2026-08-02T00:00:00Z)."
