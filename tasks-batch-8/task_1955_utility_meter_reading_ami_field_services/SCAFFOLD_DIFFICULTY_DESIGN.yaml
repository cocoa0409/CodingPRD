            - { call: "POST /meters", payload: { serial_number: "SN-Y-2", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { m2: $.data.id } }
            - { call: "POST /meters/${m1}/install", payload: { service_account_id: "${acct_1}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${m2}/install", payload: { service_account_id: "${acct_2}" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-02T00:00:00Z" }, as: MeterOpsAdmin }
