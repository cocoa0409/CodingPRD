  # ===================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: device_command_closed_interval_adjacency_overlaps
        grounds:
          - validations[priority=15]
          - state_machines.Device.ENABLED_to_DISABLED
          - entities.DeviceCommand.fields.effective_start
        distinguishing_aspect: |
          CLOSED-interval semantics on the Device resource: a second STARTER_DISABLE whose
          effective_start equals the prior command's effective_end (adjacency touch at 2026-04-01) is
          rejected with ERR_COMMAND_WINDOW_OVERLAP, because closed intervals share the endpoint.
        test_recipe:
          setup:
            - "CA loan DELINQUENT; cascade DISABLE (zero-length point 03-15) issued by assessment; device re-ENABLED; one manual STARTER_DISABLE [03-25 .. 04-01] ISSUED then device re-ENABLED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ca15@x.com", full_name: "CA Fifteen", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b15: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b15}", vin: "VINCA0015", year: 2017, make: "Hyundai", model: "Elantra", odometer_miles: 85000 }
              as: Appraiser
              captures: { v15: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v15}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a15: $.data.id }
            - call: "POST /atl/appraisals/${a15}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-15"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b15}", appraisal_id: "${a15}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app15: $.data.id }
            - call: "POST /atl/applications/${app15}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "underwriter-12"
              captures: { loan15: $.data.id }
            - call: "POST /atl/devices"
              payload: { vehicle_id: "${v15}", serial_number: "SER-CA-15" }
              as: LoanServicer
              captures: { dev15: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/loans/${loan15}/assess-delinquency"
              payload: {}
              as: LoanServicer
            - call: "POST /atl/devices/${dev15}/commands"
              payload: { command_type: "STARTER_ENABLE", effective_start: "2026-03-15T00:00:00.000Z", effective_end: "2026-03-15T00:00:00.000Z" }
              as: LoanServicer
            - call: "POST /atl/devices/${dev15}/commands"
              payload: { command_type: "STARTER_DISABLE", effective_start: "2026-03-25T00:00:00.000Z", effective_end: "2026-04-01T00:00:00.000Z" }
              as: LoanServicer
            - call: "POST /atl/devices/${dev15}/commands"
              payload: { command_type: "STARTER_ENABLE", effective_start: "2026-03-25T00:00:00.000Z", effective_end: "2026-03-25T00:00:00.000Z" }
              as: LoanServicer
          trigger:
            - call: "POST /atl/devices/${dev15}/commands"
              payload: { command_type: "STARTER_DISABLE", effective_start: "2026-04-01T00:00:00.000Z", effective_end: "2026-04-08T00:00:00.000Z" }
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COMMAND_WINDOW_OVERLAP (409)"

      - name: assignment_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=16]
          - entities.RepossessionAssignment.fields.window_start
          - state_machines.RepossessionOrder.ORDERED_to_ASSIGNED
        distinguishing_aspect: |
          HALF-OPEN [start,end) semantics on a DIFFERENT resource (RepossessionOrder assignments):
          a second window whose start equals the first window's end is ACCEPTED (no shared point),
          while a truly overlapping window is rejected with ERR_ASSIGNMENT_WINDOW_OVERLAP — opposite
          adjacency treatment from the closed-interval device rule.
        test_recipe:
          setup:
            - "CA loan DEFAULT with RepossessionOrder ORDERED; first assignment window [08:00 .. 12:00)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
