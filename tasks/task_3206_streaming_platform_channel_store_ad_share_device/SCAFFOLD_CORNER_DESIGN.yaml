            - call: "POST /os-updates"
              payload: { version_tag: "16.0.0", mandatory: true, rollout_start: "2026-09-02T00:00:00Z", compliance_deadline: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { upd: $.data.id }
            - call: "POST /os-updates/${upd}/withdraw"
