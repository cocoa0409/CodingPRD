            - "PaymentPlan.${plan_id}.status == \"ACTIVE\""
            - "AmnestyProgram.${prog_id}.collected_cents == 305000"

      - name: dual_variant_accrual_cutoff_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.return_statutory_liability.variants
        excluded_because:
          difficulty_instance: statutory_vs_negotiated_accrual_cutoff_divergence
          rationale: |
            That instance files an identical return under both variants and asserts the
            full divergence chain (days_late 400 vs 328, rate 0.25 vs 0.15, balance
            1050000 vs 1041000), which is the Variant Divergence and Variant Selection
            rows in one fixture.

      - name: dual_variant_score_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.taxpayer_compliance_behavior_score.variants
        excluded_because:
          difficulty_instance: historical_vs_program_adjusted_behavior_score_divergence
          rationale: |
            That instance pins historical_score 70 against program_adjusted_score 98 on
            the same facts and asserts that the persisted field holds the HISTORICAL
            value, covering both variants and the persistence rule.

      - name: haircut_threshold_boundary_and_resolution_order
        claim_type: threshold
        grounds:
          - calculations.agreement_effective_waiver_resolution.constants.HAIRCUT_TIER_1_MIN_CENTS
        excluded_because:
          difficulty_instance: haircut_resolution_order_revises_previously_filed_returns
          rationale: |
            That instance lands the aggregate on exactly 5000000 cents, the inclusive
            tier-1 threshold, and shows the haircut retroactively revising the two
            earlier returns — the threshold boundary and the resolution-order claim
            together.

      - name: rounding_precision_of_the_waiver_rollup
        claim_type: Precision
        grounds:
          - calculations.agreement_waiver_rollup.rounding
        excluded_because:
          difficulty_instance: waiver_rollup_sums_per_return_rounded_components
          rationale: |
            That instance is built specifically so sum-of-rounded (40736) and
            round-of-sum (40735) disagree, which is the strongest possible form of the
            Precision claim.

      - name: aggregation_correct_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.payment_waterfall_allocation
          - entities.AmnestyProgram.fields.collected_cents
        excluded_because:
          difficulty_instance: payment_reversal_restores_the_cash_ledger_without_touching_the_down_payment
          rationale: |
            That instance reverses a payment and asserts the whole cash ledger — paid
            totals, installment paid_cents, unapplied credit and the program's
            collected_cents — returns to its pre-payment values.

      - name: realization_rounding_before_comparison
        claim_type: Precision
        grounds:
          - calculations.program_revenue_realization.rounding
        excluded_because:
          difficulty_instance: realization_rounds_to_four_places_before_the_forecast_comparison
          rationale: |
            That instance is the round-then-compare fixture (raw 0.89999974 -> 0.9000 ->
            ON_TRACK) and also freezes final_realization_pct, covering both the Precision
            row and the forecast_status thresholds.

