      - name: the_funder_report_recomputes_both_bases_from_live_program_state
        claim_type: computed_read
        grounds:
          - endpoints.GET_/iz-compliance/funder-reports
          - calculations.funder_report_metrics
        distinguishing_aspect: |
          The report is a pure read with no stored row behind it, and the two bases disagree about
          what "delivered" means for a project that discharges half its obligation with an
          assessment: ENTITLEMENT credits the assessed fee and reports a full 10000 bps ratio while
          OCCUPANCY credits only housed households and reports 5000 bps. Issuing a finding against
          the one occupied unit then moves the OCCUPANCY ratio to 0 and the open_findings_count to
          1 WITHOUT touching the ENTITLEMENT ratio, because occupied_equivalents_bps counts only
          units that are both OCCUPIED and COMPLIANT. The fee columns keep reporting the assessed
          total even after the sweep turns the assessment DELINQUENT, since only SUPERSEDED
          assessments drop out.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (R-2, 20 units, dev-1) screened SUBJECT (20000 bps), ONSITE, agreement recorded, one RENTAL 2br unit FR-101 occupied by household H1 (size 3, 6000000) at rent 140000, so the ceiling is 143872."
            - "A FULL assessment covers the remaining 10000 bps: assessed 24467400, due 2026-09-15, with a single partial payment of 1000000 leaving it PARTIALLY_PAID."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Funder Facing", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-FR-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "FR-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h1_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "GET /iz-compliance/projects/${p_id}", payload: {}, as: ProgramAdministrator, captures: { p_v: $.data.version } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${p_id}", basis: "FULL", expected_project_version: "${p_v}" }, as: ProgramAdministrator, captures: { f_id: $.data.id } }
            - { call: "POST /iz-compliance/in-lieu-fees/${f_id}/payments", payload: { amount_cents: 1000000 }, as: Developer, as_user_id: "dev-1" }
          trigger:
            - { call: "GET /iz-compliance/funder-reports", payload: { project_id: "${p_id}", basis: "ENTITLEMENT" }, as: FundAuditor, as_user_id: "aud-1" }
            - { call: "GET /iz-compliance/funder-reports", payload: { project_id: "${p_id}", basis: "OCCUPANCY" }, as: FundAuditor, as_user_id: "aud-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-03-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/monitoring-reviews", payload: { unit_id: "${u_id}", review_year: 2027, reported_rent_cents: 165000, reported_income_cents: 6000000, occupancy_verified: true }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { mv_id: $.data.id } }
            - { call: "GET /iz-compliance/funder-reports", payload: { project_id: "${p_id}", basis: "ENTITLEMENT" }, as: ProgramAdministrator }
            - { call: "GET /iz-compliance/funder-reports", payload: { project_id: "${p_id}", basis: "OCCUPANCY" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
          assert:
            - "the ENTITLEMENT read returns 200 with project_id ${p_id}, basis ENTITLEMENT, total_obligation_bps 20000, delivered_equivalents_bps 20000, occupied_equivalents_bps 10000, compliance_ratio_bps 10000, open_findings_count 0, total_fees_assessed_cents 24467400 and total_fees_paid_cents 1000000"
            - "the OCCUPANCY read at the same instant returns the SAME delivered_equivalents_bps 20000 and occupied_equivalents_bps 10000 but compliance_ratio_bps 5000 — only the numerator selection differs"
            - "after the finding is issued the ENTITLEMENT ratio is still 10000 while the OCCUPANCY ratio drops to 0, because the unit is OCCUPIED but no longer COMPLIANT"
            - "both post-finding reads report open_findings_count 1, and MonitoringReview.${mv_id}.state is FINDING_ISSUED"
            - "the clock advance turned InLieuFee.${f_id} DELINQUENT, yet total_fees_assessed_cents is still 24467400 and total_fees_paid_cents still 1000000 — only SUPERSEDED assessments leave the report"
            - "no write occurred on any read: Project.${p_id}.version is identical before and after all four report calls"

      - name: the_rofr_decision_endpoint_branches_on_exercise_versus_waive
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/iz-compliance/resale-transactions/{resale_transaction_id}/rofr-decision
          - state_machines.ResaleTransaction.ROFR_EXERCISED_to_CITY_PURCHASE_CLOSED
        distinguishing_aspect: |
          One endpoint with one enum field takes two disjoint paths. EXERCISE first consults the
          trust-fund ledger and, on success, lands the transaction in ROFR_EXERCISED — but it
          creates no TrustFundDisbursement row, so the ledger check is a precondition and
          unencumbered_balance_cents does not move. Closing from ROFR_EXERCISED then produces
          CITY_PURCHASE_CLOSED and vacates the unit, whereas closing from BUYER_CERTIFIED produces
          CLOSED and re-occupies it: the same close endpoint has two terminal states chosen by how
          the ROFR was decided. WAIVE takes neither branch and needs no fund at all.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Funding project PF (C-2, 40 units, dev-2) elects IN_LIEU_FEE and pays its FULL 80000 bps assessment of 189120000 in one payment, so the trust fund holds 189120000 unencumbered."
            - "Project P (R-2, 20 units, dev-1) screened SUBJECT, ONSITE, agreement recorded, with OWNERSHIP 2br units RF-101 and RF-201 restricted at 32500000 and sellers H1 and H2 (each size 3, 6000000) certified into them at rent 0."
            - "Both units have a resale submitted at proposed 32000000 with broker_fee_cents 1000000 and no improvements, and both prices are approved by hco-1 on 2026-08-01, giving each a rofr_deadline of 2026-08-31T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
