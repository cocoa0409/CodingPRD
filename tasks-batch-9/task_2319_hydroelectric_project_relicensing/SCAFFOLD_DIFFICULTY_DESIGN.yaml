  - rule_id: cross_entity_state_dependency
    instances:
      - name: settlement_execution_blocked_by_unapproved_study_plan_state
        grounds:
          - validations[priority=51]
          - state_machines.Settlement.CIRCULATED_to_EXECUTED
          - state_machines.StudyPlan.UNDER_AGENCY_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The settlement carries ample support (75.00 against a 66.67 threshold) and no veto, yet the
          EXECUTE transition depends on the state of an unrelated aggregate: StudyPlan.status must be
          APPROVED. Nothing about the Settlement or its signatures changes between the rejection and
          the success; only the sibling entity's state does.
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a study plan in UNDER_AGENCY_REVIEW (submitted, not yet determined)."
            - "Four parties of vote_weight 1 (agency with conditioning authority, tribe, and two NGOs); total_vote_weight 4."
            - "A CIRCULATED settlement in round 1 with SUPPORT signatures from the agency, the tribe and one NGO."
