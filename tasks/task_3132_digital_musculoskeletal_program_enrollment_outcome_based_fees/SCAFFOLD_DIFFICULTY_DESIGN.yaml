# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task: task_3132_digital_musculoskeletal_program_enrollment_outcome_based_fees
#
# Every instance grounds in an element already declared in SCAFFOLD.yaml
# §1.1–§1.7. Every setup_api_calls / trigger chain is executable against §1.5.
# Logical clock default: 2026-09-01T00:00:00Z. Week 1 begins 2026-09-07T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: roster_fee_actual_vs_expected_payability_variance
        grounds:
          - calculations.roster_fee_payability_weighted
          - entities.EligibilityFile.fields.total_monthly_fee_cents
          - entities.EligibilityFile.fields.provisional_total_monthly_fee_cents
          - entities.EligibilityFile.fields.fee_variance_cents
          - endpoints.POST_/msk/eligibility-files/{id}/screen
        distinguishing_aspect: "The chronological variant divides the weighted numerator by the two members who actually screened ELIGIBLE, while the forward-looking variant divides the identical numerator by member_row_count * expected_monthly_engagement_rate = 3 * 0.60, so the same three-row roster yields 1125000 and 1250000 cents respectively."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client with expected_monthly_engagement_rate 0.60 and its ACUTE track at 9000 cents per member week. One roster file for 2026-09 carrying three member rows: two with a musculoskeletal condition code and one with OTHER."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Northwind Logistics", client_type: "EMPLOYER", billing_model: "ENGAGEMENT_MILESTONE", expected_monthly_engagement_rate: 0.60 }
              as: ClinicalOps
              captures: { nw_id: $.data.id, nw_v: $.data.version }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "ACUTE", base_fee_per_member_cents: 9000, expected_sessions_per_week: 3, pain_reduction_target_points: 2.0, function_gain_target_points: 15.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_acute: $.data.id }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "CHRONIC", base_fee_per_member_cents: 12000, expected_sessions_per_week: 3, pain_reduction_target_points: 3.0, function_gain_target_points: 20.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_chronic: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${nw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${nw_id}", eligibility_file_id: "${f_id}", external_member_ref: "NW-0001", full_name: "Ana Ruiz", date_of_birth: "1985-04-12T00:00:00Z", musculo_condition_code: "KNEE_OA", baseline_pain_score: 7.5, baseline_function_score: 45.0, red_flag_multipliers: [1.15] }
              as: EnrollmentOps
              captures: { m_a: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${nw_id}", eligibility_file_id: "${f_id}", external_member_ref: "NW-0002", full_name: "Ben Okafor", date_of_birth: "1979-11-02T00:00:00Z", musculo_condition_code: "LOW_BACK", baseline_pain_score: 6.0, baseline_function_score: 55.0, red_flag_multipliers: [1.15, 1.15] }
              as: EnrollmentOps
              captures: { m_b: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${nw_id}", eligibility_file_id: "${f_id}", external_member_ref: "NW-0003", full_name: "Cleo Marsh", date_of_birth: "1990-06-30T00:00:00Z", musculo_condition_code: "OTHER", baseline_pain_score: 1.0, baseline_function_score: 90.0, red_flag_multipliers: [] }
              as: EnrollmentOps
              captures: { m_c: $.data.id }
          trigger:
            - call: "POST /msk/eligibility-files/${f_id}/screen"
              payload: {}
              as: EnrollmentOps
              captures: { f_v1: $.data.version }
          assert:
            - "EligibilityFile.${f_id}.member_row_count == 3"
            - "EligibilityFile.${f_id}.eligible_member_count == 2 and ineligible_member_count == 1 and screened_member_count == 3"
            - "EligibilityFile.${f_id}.total_monthly_fee_cents == 1125000"
            - "EligibilityFile.${f_id}.provisional_total_monthly_fee_cents == 1250000"
            - "EligibilityFile.${f_id}.fee_variance_cents == -125000"
            - "the two variants disagree on the identical roster, which is the whole point: 1125000 != 1250000"

      - name: outcome_savings_window_end_vs_invoice_creation_evaluation
        grounds:
          - calculations.attributed_savings_severity_bucket
          - entities.OutcomeMeasurement.fields.attributed_savings_cents
          - entities.FeeInvoice.fields.savings_share_component_cents
          - endpoints.POST_/msk/fee-invoices
        distinguishing_aspect: "The version-pinned reading fixes each window's savings at the engagement rate in force at window_end_week, while the billing-time reading recomputes the same window at the invoice-creation instant, so a sale whose adherence falls after week 4 reports 200000 cents on the enrollment and 160000 cents inside the invoice's savings component."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client at savings_share_rate 0.30, ACUTE track at 9000 cents. One member enrolled and activated in week 1, four completed sessions in weeks 1-4, one HIGH-severity claim line of 400000 cents in week 2, and one outcome measurement recorded in week 4 with its 4-week window spanning weeks 1-4. The clock is then advanced to week 6, a fifth week is missed, and the enrollment is still ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Cedar Health Plan", client_type: "HEALTH_PLAN", billing_model: "OUTCOME_SHARED_SAVINGS", savings_share_rate: 0.30, expected_monthly_engagement_rate: 0.60 }
              as: ClinicalOps
              captures: { chp_id: $.data.id, chp_v: $.data.version }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "ACUTE", base_fee_per_member_cents: 9000, expected_sessions_per_week: 3, pain_reduction_target_points: 2.0, function_gain_target_points: 15.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_acute: $.data.id }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "CHRONIC", base_fee_per_member_cents: 12000, expected_sessions_per_week: 3, pain_reduction_target_points: 3.0, function_gain_target_points: 20.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_chronic: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${chp_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${chp_id}", eligibility_file_id: "${f_id}", external_member_ref: "CHP-0001", full_name: "Dita Alvarez", date_of_birth: "1982-02-19T00:00:00Z", musculo_condition_code: "KNEE_OA", baseline_pain_score: 8.0, baseline_function_score: 40.0, red_flag_multipliers: [1.10] }
              as: EnrollmentOps
              captures: { m_d: $.data.id }
            - call: "POST /msk/eligibility-files/${f_id}/screen"
              payload: {}
              as: EnrollmentOps
            - call: "POST /msk/eligibility-files/${f_id}/assign-tracks"
              payload: { expected_client_account_version: "${chp_v}" }
              as: EnrollmentOps
              captures: { f_v: $.data.version }
            - call: "POST /msk/clinicians"
              payload: { full_name: "Dana Whitfield", discipline: "PHYSICAL_THERAPIST", license_number: "PT-88123", weekly_capacity_slots: 20 }
              as: ClinicalOps
              captures: { dana_id: $.data.id }
            - call: "POST /msk/clinicians"
              payload: { full_name: "Leo Farrow", discipline: "PHYSICIAN", license_number: "MD-44120", weekly_capacity_slots: 12 }
              as: ClinicalOps
              captures: { leo_id: $.data.id }
            - call: "GET /msk/enrollments"
              payload: { member_id: "${m_d}" }
              as: EnrollmentOps
              captures: { e_d: "$.data[0].id" }
            - call: "POST /msk/clinical-reviews"
              payload: { enrollment_id: "${e_d}", reviewer_id: "${dana_id}", review_notes: "Chronic knee OA, conservative track appropriate" }
              as: EnrollmentOps
              captures: { cr_d: $.data.id }
            - call: "POST /msk/clinical-reviews/${cr_d}/conduct"
              payload: { review_decision: "APPROVE", reviewed_track_id: "${tr_acute}" }
              as: Clinician
              as_user_id: "${dana_id}"
            - call: "POST /msk/transition-reviews/${e_d}/approve"
              payload: { approving_clinician_id: "${leo_id}", expected_eligibility_file_version: "${f_v}" }
              as: Clinician
              as_user_id: "${leo_id}"
            - call: "POST /msk/clients/${chp_id}/run-weekly-reconciliation"
              payload: {}
              as: ClinicalOps
            - call: "POST /msk/enrollments/${e_d}/sessions"
              payload: { session_date: "2026-09-08T09:00:00Z", session_week: 1, recorded_via: "SENSOR", planned_reps: 15, planned_minutes: 20 }
              as: EnrollmentOps
              captures: { s1: $.data.id }
            - call: "POST /msk/enrollments/${e_d}/sessions"
              payload: { session_date: "2026-09-15T09:00:00Z", session_week: 2, recorded_via: "CAMERA", planned_reps: 15, planned_minutes: 20 }
              as: EnrollmentOps
              captures: { s2: $.data.id }
            - call: "POST /msk/enrollments/${e_d}/sessions"
              payload: { session_date: "2026-09-22T09:00:00Z", session_week: 3, recorded_via: "SENSOR", planned_reps: 15, planned_minutes: 20 }
              as: EnrollmentOps
              captures: { s3: $.data.id }
            - call: "POST /msk/enrollments/${e_d}/sessions"
              payload: { session_date: "2026-09-29T09:00:00Z", session_week: 4, recorded_via: "CAMERA", planned_reps: 15, planned_minutes: 20 }
              as: EnrollmentOps
              captures: { s4: $.data.id }
            - call: "POST /msk/exercise-sessions/${s1}/complete"
              payload: { completed_denominator_units: 1, pain_score_after: 7.5 }
              as: Member
              as_user_id: "${m_d}"
            - call: "POST /msk/exercise-sessions/${s2}/complete"
              payload: { completed_denominator_units: 1, pain_score_after: 7.0 }
              as: Member
              as_user_id: "${m_d}"
            - call: "POST /msk/exercise-sessions/${s3}/complete"
              payload: { completed_denominator_units: 1, pain_score_after: 6.5 }
              as: Member
              as_user_id: "${m_d}"
            - call: "POST /msk/claim-lines"
              payload: { enrollment_id: "${e_d}", claim_service_date: "2026-09-14T00:00:00Z", claim_service_week: 2, claim_severity: "HIGH", amount_cents: 400000, claim_source: "MEDICAL" }
              as: EnrollmentOps
              captures: { ln_1: $.data.id }
            - call: "POST /msk/outcome-measurements"
              payload: { enrollment_id: "${e_d}", measurement_week: 4, pain_score: 4.0, function_score: 70.0 }
              as: Member
              as_user_id: "${m_d}"
              captures: { om_d: $.data.id }
            - call: "POST /msk/clients/${chp_id}/run-weekly-reconciliation"
              payload: {}
              as: ClinicalOps
            - call: "POST /msk/exercise-sessions/${s4}/complete"
              payload: { completed_denominator_units: 1, pain_score_after: 3.5 }
              as: Member
              as_user_id: "${m_d}"
            - call: "POST /msk/enrollments/${e_d}/sessions"
              payload: { session_date: "2026-10-06T09:00:00Z", session_week: 5, recorded_via: "SENSOR", planned_reps: 15, planned_minutes: 20 }
              as: EnrollmentOps
              captures: { s5: $.data.id }
            - call: "POST /msk/clients/${chp_id}/run-weekly-reconciliation"
              payload: {}
              as: ClinicalOps
          trigger:
            - call: "POST /msk/fee-invoices"
              payload: { client_account_id: "${chp_id}", billing_period: "2026-09" }
              as: BillingOps
              captures: { inv_d: $.data.id }
          assert:
            - "GET /msk/outcome-measurements/${om_d} reports attributed_savings_cents == 200000 (400000 * 0.5 * the week-1-through-week-4 rate of 1.00, pinned at window_end_week 4)"
            - "GET /msk/enrollments/${e_d} reports attributed_savings_cents == 200000, matching the version-pinned window reading"
            - "FeeInvoice.${inv_d}.savings_share_component_cents == 48000 (400000 * 0.5 * the invoice-instant rate of 0.80, times savings_share_rate 0.30)"
            - "the two variants disagree on the identical window: 200000 != 160000 before the client share is applied"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: roster_fee_nested_rounding_legacy_roster
        grounds:
          - calculations.roster_fee_payability_weighted
          - entities.EligibilityFile.fields.total_monthly_fee_cents
          - endpoints.POST_/msk/eligibility-files
          - validations[priority=10]
        distinguishing_aspect: "Mode (b): the LEGACY roster multiplier is floored per member row before the weighted sum, so a roster whose members straddle a base fee that is not an exact multiple of 4 returns different cents from flooring the already-summed total."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client. ACUTE track at 9002 cents per member week. A LEGACY roster carrying two member rows, both with a musculoskeletal condition code."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Ridgeway Foods", client_type: "EMPLOYER", billing_model: "ENGAGEMENT_MILESTONE", expected_monthly_engagement_rate: 0.50 }
              as: ClinicalOps
              captures: { rw_id: $.data.id, rw_v: $.data.version }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "ACUTE", base_fee_per_member_cents: 9002, expected_sessions_per_week: 2, pain_reduction_target_points: 2.0, function_gain_target_points: 12.0, min_adherence_rate: 0.50, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_acute: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${rw_id}", file_period: "2026-09", roster_format: "LEGACY" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${rw_id}", eligibility_file_id: "${f_id}", external_member_ref: "RW-0001", full_name: "Pia Nkemdi", date_of_birth: "1974-08-08T00:00:00Z", musculo_condition_code: "SHOULDER", baseline_pain_score: 6.5, baseline_function_score: 50.0, red_flag_multipliers: [] }
              as: EnrollmentOps
              captures: { m_a: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${rw_id}", eligibility_file_id: "${f_id}", external_member_ref: "RW-0002", full_name: "Quinn Adeyemi", date_of_birth: "1988-01-25T00:00:00Z", musculo_condition_code: "NECK", baseline_pain_score: 5.0, baseline_function_score: 60.0, red_flag_multipliers: [1.15, 1.15] }
              as: EnrollmentOps
              captures: { m_b: $.data.id }
          trigger:
            - call: "POST /msk/eligibility-files/${f_id}/screen"
              payload: {}
              as: EnrollmentOps
          assert:
            - "EligibilityFile.${f_id}.eligible_member_count == 2"
            - "the per-member LEGACY base is floor(9002 * 0.75) == 6751, applied twice before summing"
            - "EligibilityFile.${f_id}.total_monthly_fee_cents == 675100"
            - "flooring the summed total instead would give floor(13502 * 0.75) == 10126 per member and 1012600 cents, so the pinned order is observable: 675100 != 1012600"

      - name: invoice_milestone_rounding_order_and_straddled_component
        grounds:
          - calculations.invoice_milestone_time_allocation
          - entities.FeeInvoice.fields.recalculated_component_cents
          - entities.FeeInvoice.fields.net_delta_cents
          - endpoints.POST_/msk/fee-invoices/{id}/finalize
        distinguishing_aspect: "Mode (c): each enrollment's pinned share and trailing week delta are rounded independently and only then summed, so the finalize-time total lands on 22511 cents where rounding the combined raw total once would land on 22510."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client at savings_share_rate 0.0 so no savings component disturbs the milestone arithmetic, with an ACUTE track at 9002 cents and a CHRONIC track at 9006 cents. Two members, each enrolled in week 1 and activated. The clock is then advanced to week 6 so both enrollments are five weeks old."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Kestrel Manufacturing", client_type: "EMPLOYER", billing_model: "OUTCOME_SHARED_SAVINGS", savings_share_rate: 0.0, expected_monthly_engagement_rate: 0.60 }
              as: ClinicalOps
              captures: { ks_id: $.data.id, ks_v: $.data.version }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "ACUTE", base_fee_per_member_cents: 9002, expected_sessions_per_week: 3, pain_reduction_target_points: 2.0, function_gain_target_points: 12.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_acute: $.data.id }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "CHRONIC", base_fee_per_member_cents: 9006, expected_sessions_per_week: 3, pain_reduction_target_points: 3.0, function_gain_target_points: 18.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_chronic: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${ks_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${ks_id}", eligibility_file_id: "${f_id}", external_member_ref: "KS-0001", full_name: "Rosa Lindqvist", date_of_birth: "1981-03-14T00:00:00Z", musculo_condition_code: "KNEE_OA", baseline_pain_score: 7.0, baseline_function_score: 48.0, red_flag_multipliers: [] }
              as: EnrollmentOps
              captures: { m_a: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${ks_id}", eligibility_file_id: "${f_id}", external_member_ref: "KS-0002", full_name: "Tomas Behr", date_of_birth: "1976-09-09T00:00:00Z", musculo_condition_code: "HIP", baseline_pain_score: 6.0, baseline_function_score: 52.0, red_flag_multipliers: [] }
              as: EnrollmentOps
              captures: { m_b: $.data.id }
            - call: "POST /msk/eligibility-files/${f_id}/screen"
              payload: {}
              as: EnrollmentOps
            - call: "POST /msk/eligibility-files/${f_id}/assign-tracks"
              payload: { expected_client_account_version: "${ks_v}" }
              as: EnrollmentOps
              captures: { f_v: $.data.version }
            - call: "POST /msk/clinicians"
              payload: { full_name: "Dana Whitfield", discipline: "PHYSICAL_THERAPIST", license_number: "PT-88123", weekly_capacity_slots: 20 }
              as: ClinicalOps
              captures: { dana_id: $.data.id }
            - call: "POST /msk/clinicians"
