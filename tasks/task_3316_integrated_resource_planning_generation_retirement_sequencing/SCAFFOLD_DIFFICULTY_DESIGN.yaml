  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: commitment_requires_plan_approved
        grounds:
          - state_machines.ProcurementCommitment
          - validations[priority=4]
          - endpoints.POST_/plans/{planId}/procurement-commitments
        distinguishing_aspect: |
          Entity pair ProcurementCommitment -> ResourcePlan: issuing a commitment is
          gated on the OWNING plan's status being APPROVED/APPROVED_WITH_CONDITIONS;
          against an UNDER_REVIEW plan the same well-formed payload fails with
          ERR_PLAN_NOT_APPROVED.
        test_recipe:
          setup:
