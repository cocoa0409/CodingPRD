# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cottage-Food & Farmers-Market Vendor Permit — Expert
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: sales_cap_provisional_vs_audited
        grounds:
          - calculations.sales_cap_utilization
          - entities.Producer.fields.ytd_gross_sales_cents
          - entities.SalesRecord.fields.gross_amount_cents
        distinguishing_aspect: |
          Operates on the Producer sales ledger: provisional_ytd (all RECORDED sales, 500000)
          diverges from audited_ytd (only CHECKED_IN-manifest sales 300000 minus the
          50000 sampling exemption = 250000).
        test_recipe:
          setup:
            - "REGISTERED producer with an ISSUED CLASS_A permit and an APPROVED+LABEL_APPROVED product"
            - "manifest M1 CHECKED_IN (sale 300000) and manifest M2 only APPROVED (sale 200000) at the same market on two dates"
          setup_api_calls:
            - call: "POST /cottage-food/allowed-food-policies"
              payload: { food_category: "BAKED_GOODS", is_cottage_allowed: true, class_b_required: false, requires_allergen_label: false }
              as: HealthAdmin
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Sunny Bakes", operator_name: "Sun Lee", contact_email: "sun@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_A" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /cottage-food/products"
              payload: { producer_id: "${prod_id}", name: "Sourdough", food_category: "BAKED_GOODS", requires_refrigeration: false, unit_price_cents: 800 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { product_id: $.data.id }
            - call: "POST /cottage-food/products/${product_id}/review-food"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/products/${product_id}/review-label"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/farmers-markets"
              payload: { name: "Downtown FM", county: "Alameda", venue_type: "CERTIFIED_FM", max_vendors_per_day: 5, allowed_classes: ["CLASS_A", "CLASS_B"] }
              as: HealthAdmin
              captures: { market_id: $.data.id, mv0: $.data.version }
            - call: "POST /cottage-food/market-manifests"
              payload: { producer_id: "${prod_id}", market_id: "${market_id}", permit_id: "${permit_id}", event_date: "2026-06-15", product_ids: ["${product_id}"] }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { m1: $.data.id }
            - call: "POST /cottage-food/market-manifests/${m1}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/market-manifests/${m1}/approve"
              payload: { expected_market_version: "${mv0}" }
              as: MarketManager
              as_user_id: "${market_id}"
            - call: "GET /cottage-food/farmers-markets/${market_id}"
              payload: {}
              as: HealthAdmin
              captures: { mv1: $.data.version }
            - call: "POST /cottage-food/market-manifests"
              payload: { producer_id: "${prod_id}", market_id: "${market_id}", permit_id: "${permit_id}", event_date: "2026-06-16", product_ids: ["${product_id}"] }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { m2: $.data.id }
            - call: "POST /cottage-food/market-manifests/${m2}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/market-manifests/${m2}/approve"
              payload: { expected_market_version: "${mv1}" }
              as: MarketManager
              as_user_id: "${market_id}"
            - call: "POST /cottage-food/market-manifests/${m1}/check-in"
              payload: {}
              as: MarketManager
              as_user_id: "${market_id}"
            - call: "POST /cottage-food/sales-records"
              payload: { manifest_id: "${m1}", gross_amount_cents: 300000 }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/sales-records"
              payload: { manifest_id: "${m2}", gross_amount_cents: 200000 }
              as: Producer
              as_user_id: "${prod_id}"
          trigger:
            - call: "GET /cottage-food/producers/${prod_id}/compliance-summary"
              payload: {}
              as: HealthInspector
              captures: { prov: $.data.provisional_ytd_cents, aud: $.data.audited_ytd_cents }
          assert:
            - "compliance-summary.provisional_ytd_cents == 500000"
            - "compliance-summary.audited_ytd_cents == 250000"
            - "compliance-summary.provisional_ytd_cents != compliance-summary.audited_ytd_cents"

      - name: recall_estimated_vs_final_liability
        grounds:
          - calculations.recall_liability
          - entities.RecallEvent.fields.estimated_liability_cents
          - entities.RecallEvent.fields.final_liability_cents
        distinguishing_aspect: |
          Operates on the RecallEvent/Product domain: estimated_liability uses severity-projected
          units (HIGH=200 -> 160000) while final_liability uses actual recalled_units (25 -> 20000).
        test_recipe:
          setup:
            - "APPROVED product with unit_price_cents=800 belonging to a REGISTERED producer with an ISSUED permit"
            - "recall INITIATED at severity HIGH then RESOLVED with 25 units"
          setup_api_calls:
            - call: "POST /cottage-food/allowed-food-policies"
              payload: { food_category: "BAKED_GOODS", is_cottage_allowed: true, class_b_required: false, requires_allergen_label: false }
              as: HealthAdmin
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Jam Co", operator_name: "Jo Jam", contact_email: "jo@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_A" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /cottage-food/products"
              payload: { producer_id: "${prod_id}", name: "Strawberry Jam", food_category: "BAKED_GOODS", requires_refrigeration: false, unit_price_cents: 800 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { product_id: $.data.id }
            - call: "POST /cottage-food/products/${product_id}/review-food"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/recall-events"
              payload: { producer_id: "${prod_id}", product_id: "${product_id}", reason: "ILLNESS_OUTBREAK", severity: "HIGH" }
              as: HealthAdmin
              captures: { recall_id: $.data.id, est: $.data.estimated_liability_cents }
          trigger:
            - call: "POST /cottage-food/recall-events/${recall_id}/resolve"
              payload: { recalled_units: 25 }
              as: HealthAdmin
              captures: { fin: $.data.final_liability_cents }
          assert:
            - "RecallEvent.${recall_id}.estimated_liability_cents == 160000"
            - "RecallEvent.${recall_id}.final_liability_cents == 20000"
            - "RecallEvent.${recall_id}.estimated_liability_cents != RecallEvent.${recall_id}.final_liability_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: permit_fee_class_b_three_input_tiered
        grounds:
          - calculations.permit_fee
          - state_machines.Permit.UNDER_INSPECTION_to_ISSUED
          - entities.Permit.fields.fee_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with branch selection — base(CLASS_B=7500) + cap-tier(15000000 -> 5000)
          + inspection surcharge(3000) = 15500, non-linear tier lookup.
        test_recipe:
          setup:
            - "REGISTERED producer, CLASS_B permit SUBMITTED then UNDER_INSPECTION with a PASSED inspection"
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Pickle Pros", operator_name: "Pat Pick", contact_email: "pat@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_B" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/inspections"
              payload: { permit_id: "${permit_id}", inspection_type: "ROUTINE", scheduled_for: "2026-05-10T09:00:00Z" }
              as: HealthInspector
              captures: { insp_id: $.data.id }
            - call: "POST /cottage-food/inspections/${insp_id}/close"
              payload: { result: "PASS", violation_count: 0 }
              as: HealthInspector
          trigger:
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
              captures: { fee: $.data.fee_cents }
          assert:
            - "Permit.${permit_id}.status == ISSUED"
            - "Permit.${permit_id}.fee_cents == 15500"

      - name: booth_fee_round_per_line_then_sum
        grounds:
          - calculations.event_settlement_fee
          - entities.MarketManifest.fields.booth_fee_cents
          - state_machines.SalesRecord.RECORDED_to_RECORDED
        distinguishing_aspect: |
          Mode (b): per-line rounding pinned — two 908-cent sales -> round(54.48)=54 each -> 108,
          which differs from sum-then-round round(1816*0.06)=round(108.96)=109.
        test_recipe:
          setup:
            - "REGISTERED producer, ISSUED permit, APPROVED product, market, manifest APPROVED with two RECORDED sales of 908 cents"
          setup_api_calls:
            - call: "POST /cottage-food/allowed-food-policies"
              payload: { food_category: "BAKED_GOODS", is_cottage_allowed: true, class_b_required: false, requires_allergen_label: false }
              as: HealthAdmin
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Muffin Man", operator_name: "Moe M", contact_email: "moe@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_A" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /cottage-food/products"
              payload: { producer_id: "${prod_id}", name: "Muffin", food_category: "BAKED_GOODS", requires_refrigeration: false, unit_price_cents: 500 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { product_id: $.data.id }
            - call: "POST /cottage-food/products/${product_id}/review-food"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/products/${product_id}/review-label"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/farmers-markets"
              payload: { name: "Uptown FM", county: "Alameda", venue_type: "CERTIFIED_FM", max_vendors_per_day: 5, allowed_classes: ["CLASS_A"] }
              as: HealthAdmin
              captures: { market_id: $.data.id, mv0: $.data.version }
            - call: "POST /cottage-food/market-manifests"
              payload: { producer_id: "${prod_id}", market_id: "${market_id}", permit_id: "${permit_id}", event_date: "2026-06-15", product_ids: ["${product_id}"] }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { m1: $.data.id }
            - call: "POST /cottage-food/market-manifests/${m1}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/market-manifests/${m1}/approve"
              payload: { expected_market_version: "${mv0}" }
              as: MarketManager
              as_user_id: "${market_id}"
            - call: "POST /cottage-food/sales-records"
              payload: { manifest_id: "${m1}", gross_amount_cents: 908 }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/sales-records"
              payload: { manifest_id: "${m1}", gross_amount_cents: 908 }
              as: Producer
              as_user_id: "${prod_id}"
          trigger:
            - call: "GET /cottage-food/market-manifests/${m1}"
              payload: {}
              as: MarketManager
              as_user_id: "${market_id}"
              captures: { fee: $.data.booth_fee_cents }
          assert:
            - "MarketManifest.${m1}.booth_fee_cents == 108"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: product_parallel_axes_independent
        grounds:
          - state_machines.Product.DECLARED_to_APPROVED
          - state_machines.Product.LABEL_DRAFT_to_LABEL_REJECTED
          - entities.Product.fields.compliance_status
          - entities.Product.fields.label_status
        distinguishing_aspect: |
          One Product entity carries two independent status axes: review-food drives compliance_status
          to APPROVED while review-label independently drives label_status to LABEL_REJECTED.
        test_recipe:
          setup:
            - "A DECLARED / LABEL_DRAFT product for a producer, with an allowed-food policy present"
          setup_api_calls:
            - call: "POST /cottage-food/allowed-food-policies"
              payload: { food_category: "BAKED_GOODS", is_cottage_allowed: true, class_b_required: false, requires_allergen_label: false }
              as: HealthAdmin
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Cookie Corner", operator_name: "Cee C", contact_email: "cee@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/products"
              payload: { producer_id: "${prod_id}", name: "Cookie", food_category: "BAKED_GOODS", requires_refrigeration: false, unit_price_cents: 300 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { product_id: $.data.id }
          trigger:
            - call: "POST /cottage-food/products/${product_id}/review-food"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/products/${product_id}/review-label"
              payload: { decision: "REJECT", reject_reason: "missing allergen line" }
              as: HealthInspector
          assert:
            - "Product.${product_id}.compliance_status == APPROVED"
            - "Product.${product_id}.label_status == LABEL_REJECTED"

      - name: permit_renewal_cycle_returns_to_issued
        grounds:
          - state_machines.Permit.ISSUED_to_RENEWAL_PENDING
          - state_machines.Permit.RENEWAL_PENDING_to_ISSUED
          - entities.Permit.fields.renewal_count
        distinguishing_aspect: |
          Permit is cyclic: ISSUED -> RENEWAL_PENDING -> ISSUED, distinct entity from Product's
          parallel axes; renewal_count increments to 1 after one full cycle.
        test_recipe:
          setup:
            - "REGISTERED producer with an ISSUED CLASS_A permit"
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Bread Basket", operator_name: "Bo B", contact_email: "bo@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_A" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /cottage-food/permits/${permit_id}/renew"
              payload: { expected_permit_version: "${pv}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
              captures: { rc: $.data.renewal_count }
          assert:
            - "Permit.${permit_id}.status == ISSUED"
            - "Permit.${permit_id}.renewal_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: recall_initiate_depth3_cascade
        grounds:
          - state_machines.RecallEvent.INITIATED_to_INITIATED
          - state_machines.Product.APPROVED_to_RECALLED
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - state_machines.MarketManifest.APPROVED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 chain rooted at recall create: Product -> RECALLED (link1) causes Permit -> SUSPENDED
          (link2) causes bound Manifest -> VOIDED (link3); each hop is caused by the previous.
        test_recipe:
          setup:
            - "REGISTERED producer, ISSUED permit, APPROVED product, market, manifest APPROVED"
          setup_api_calls:
            - call: "POST /cottage-food/allowed-food-policies"
              payload: { food_category: "BAKED_GOODS", is_cottage_allowed: true, class_b_required: false, requires_allergen_label: false }
              as: HealthAdmin
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Cascade Kitchen", operator_name: "Ka C", contact_email: "ka@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_A" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /cottage-food/products"
              payload: { producer_id: "${prod_id}", name: "Banana Bread", food_category: "BAKED_GOODS", requires_refrigeration: false, unit_price_cents: 700 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { product_id: $.data.id }
            - call: "POST /cottage-food/products/${product_id}/review-food"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/products/${product_id}/review-label"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/farmers-markets"
              payload: { name: "Bay FM", county: "Alameda", venue_type: "CERTIFIED_FM", max_vendors_per_day: 5, allowed_classes: ["CLASS_A"] }
              as: HealthAdmin
              captures: { market_id: $.data.id, mv0: $.data.version }
            - call: "POST /cottage-food/market-manifests"
              payload: { producer_id: "${prod_id}", market_id: "${market_id}", permit_id: "${permit_id}", event_date: "2026-06-15", product_ids: ["${product_id}"] }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { m1: $.data.id }
            - call: "POST /cottage-food/market-manifests/${m1}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/market-manifests/${m1}/approve"
              payload: { expected_market_version: "${mv0}" }
              as: MarketManager
              as_user_id: "${market_id}"
          trigger:
            - call: "POST /cottage-food/recall-events"
              payload: { producer_id: "${prod_id}", product_id: "${product_id}", reason: "CONTAMINATION", severity: "MEDIUM" }
              as: HealthAdmin
              captures: { recall_id: $.data.id }
          assert:
            - "Product.${product_id}.compliance_status == RECALLED"
            - "Permit.${permit_id}.status == SUSPENDED"
            - "MarketManifest.${m1}.status == VOIDED"

      - name: salescap_breach_depth_cascade
        grounds:
          - state_machines.SalesRecord.RECORDED_to_RECORDED
          - calculations.cap_breach_check
          - state_machines.Producer.REGISTERED_to_SUSPENDED
          - state_machines.MarketManifest.APPROVED_to_VOIDED
        distinguishing_aspect: |
          Rooted at a different trigger (sales-record create): ledger crosses cap (link1) causes
          Producer -> SUSPENDED (link2) causes non-terminal Manifest -> VOIDED (link3).
        test_recipe:
          setup:
            - "REGISTERED producer, ISSUED CLASS_A permit (cap 7500000), APPROVED product, manifest APPROVED, one sale of exactly 7500000 already RECORDED (producer still REGISTERED)"
          setup_api_calls:
            - call: "POST /cottage-food/allowed-food-policies"
              payload: { food_category: "BAKED_GOODS", is_cottage_allowed: true, class_b_required: false, requires_allergen_label: false }
              as: HealthAdmin
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Cap Cakes", operator_name: "Cap C", contact_email: "cap@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
