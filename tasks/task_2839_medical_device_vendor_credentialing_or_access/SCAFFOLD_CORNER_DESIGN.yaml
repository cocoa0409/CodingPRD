            - "KioskCheckIn.${ci_xr_second_id}.badge_status == ISSUED with issued_at_utc == 2026-08-28T10:15:00Z and valid_until_utc == 2026-08-28T11:30:00Z"

      - name: receive_without_delivered_at_defaults_to_the_logical_clock
        claim_type: conditional_action
        grounds:
          - endpoints[POST /vendor-access/loaner-sets/{id}/receive]
          - calculations.loaner_late_minutes
        distinguishing_aspect: "The optional body field is what changes behaviour: with delivered_at_utc omitted the server substitutes the logical clock, and because the clock sits exactly on the 2026-10-06T02:00:00Z deadline the set lands DELIVERED_ON_TIME with 0 late minutes instead of taking any late branch."
        test_recipe:
          setup:
            - "Facility CN-52 has spd_turnaround_hours 4 and spd_bay_count 2; vendor CONDV owns one ACTIVE non-implant product."
            - "Case CASE-15090 runs 2026-10-06T08:00:00Z to 10:00:00Z; its 2-tray SIMPLE set has 6 lead hours and deadline 2026-10-06T02:00:00Z."
            - "The logical clock is moved to exactly 2026-10-06T02:00:00Z before the receive call."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Conditional Action Hospital", code: "CN-52", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_cn_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Conditional Devices", vendor_code: "CONDV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_condv_id: $.data.id, v_condv_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_condv_id}", facility_id: "${f_cn_id}", product_name: "Conditional Basin Set", product_catalog_number: "CB-1400", manufacturer: "Condv", is_implant: false, unit_cost_cents: 30000, expected_vendor_version: "${v_condv_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_condv_id}"
              captures: { pir_cb_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_cb_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_condv_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_cb_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_cb_id}/value-analysis-decision"
              payload: { decision: "APPROVE" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "GET /vendor-access/approved-products?product_introduction_request_id=${pir_cb_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ap_cb_id: "$.data[0].id" }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_cn_id}", case_number: "CASE-15090", procedure_name: "Conditional Action Case", scheduled_start_utc: "2026-10-06T08:00:00Z", scheduled_end_utc: "2026-10-06T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15090_id: $.data.id, case_15090_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_15090_id}", approved_product_id: "${ap_cb_id}", tray_count: 2, reprocessing_complexity: "SIMPLE", expected_case_version: "${case_15090_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_15090_id: $.data.id }
            - call: "POST /vendor-access/_clock/set_current_utc"
              payload: { current_utc: "2026-10-06T02:00:00Z" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
          trigger:
            - call: "POST /vendor-access/loaner-sets/${ls_15090_id}/receive"
              payload: {}
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_15090_delivered: $.data.delivered_at_utc, ls_15090_status: $.data.status }
          assert:
            - "HTTP status is 200"
            - "${ls_15090_delivered} == 2026-10-06T02:00:00Z — the omitted field was filled from the clock, not left null"
            - "${ls_15090_status} == DELIVERED_ON_TIME"
            - "LoanerSet.${ls_15090_id}.late_minutes_current_basis == 0, late_minutes_pinned_basis == 0, assessed_late_fee_cents == 0 and fee_status == NONE"
            - "Vendor.${v_condv_id}.late_fee_balance_cents == 0 with adjudicated_compliance_score == 100"
            - "SurgicalCase.${case_15090_id}.implant_readiness_status == NOT_APPLICABLE (the case does not require an implant)"

  - section: errors
    instances:

      - name: missing_identity_headers_returns_401
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations.priority_1
        distinguishing_aspect: "Authentication is checked before authorization and before any body validation: with X-User-ID and X-User-Role both omitted the response is 401 ERR_UNAUTHENTICATED even though the payload is perfectly valid and would have been accepted."
        test_recipe:
          setup:
            - "No setup is required; the request carries a valid facility payload but no identity headers at all."
          setup_api_calls: []
          trigger:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Anonymous Hospital", code: "AN-55", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: NONE
              as_user_id: NONE
              captures: { unauth_err: $.data.error_id }
          assert:
            - "the request is sent with neither X-User-ID nor X-User-Role"
            - "HTTP status is 401 and ${unauth_err} == ERR_UNAUTHENTICATED"
            - "GET /vendor-access/facilities?code=AN-55 as CredentialingOfficer user_credentialing_1 returns total_count == 0 — nothing was created"

      - name: approval_of_an_uncredentialed_rep_returns_422
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REP_CREDENTIALS_NOT_COMPLIANT]
          - validations.priority_24
        distinguishing_aspect: "This is the loser of the §1.8 priority pair seen from the other side: with no state violation in play, an INCOMPLETE posture on its own produces 422 ERR_REP_CREDENTIALS_NOT_COMPLIANT at approval time."
        test_recipe:
          setup:
            - "Facility NC-56, vendor NOCV and rep Nora exist; Nora holds no credentials at all, so her posture is INCOMPLETE."
            - "Case CASE-15130 is STANDARD and non-implant with one REQUESTED authorization for Nora."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Not Compliant Hospital", code: "NC-56", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_nc_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Not Compliant Devices", vendor_code: "NOCV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_nocv_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_nocv_id}", full_name: "Nora Nocred", email: "nora@nocv.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_nora_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_nc_id}", case_number: "CASE-15130", procedure_name: "Uncredentialed Rep Case", scheduled_start_utc: "2026-09-16T08:00:00Z", scheduled_end_utc: "2026-09-16T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15130_id: $.data.id }
            - call: "POST /vendor-access/case-rep-authorizations"
              payload: { surgical_case_id: "${case_15130_id}", vendor_rep_id: "${rep_nora_id}", requested_role: "OBSERVATION" }
              as: VendorAdmin
              as_user_id: "${v_nocv_id}"
              captures: { auth_15130_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/case-rep-authorizations/${auth_15130_id}/decide"
              payload: { decision: "APPROVE" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { not_compliant_err: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${not_compliant_err} == ERR_REP_CREDENTIALS_NOT_COMPLIANT"
            - "VendorRep.${rep_nora_id}.credential_posture == INCOMPLETE and access_status == PENDING"
            - "CaseRepAuthorization.${auth_15130_id}.status is still REQUESTED"
            - "Vendor.${v_nocv_id}.authorizations_used_epoch == 0"

      - name: submitting_another_vendors_request_returns_403
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VENDOR_SCOPE_VIOLATION]
          - validations.priority_7
        distinguishing_aspect: "Scope is narrower than role: the caller is a legitimate VendorAdmin, so the RBAC check passes, and the 403 comes from ERR_VENDOR_SCOPE_VIOLATION because the request belongs to a different vendor."
        test_recipe:
          setup:
            - "Facility VS-57 exists; vendors OWNV and OTHV are both registered."
            - "OWNV has one DRAFT product-introduction request."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Vendor Scope Hospital", code: "VS-57", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_vs_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Owning Devices", vendor_code: "OWNV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_ownv_id: $.data.id, v_ownv_ver0: $.data.version }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Other Devices", vendor_code: "OTHV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_othv_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_ownv_id}", facility_id: "${f_vs_id}", product_name: "Owned Cutting Block", product_catalog_number: "OC-1500", manufacturer: "Ownv", is_implant: false, unit_cost_cents: 47000, expected_vendor_version: "${v_ownv_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_ownv_id}"
              captures: { pir_oc_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/product-introduction-requests/${pir_oc_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_othv_id}"
              captures: { scope_err: $.data.error_id }
          assert:
            - "HTTP status is 403 and ${scope_err} == ERR_VENDOR_SCOPE_VIOLATION, not ERR_UNAUTHORIZED"
            - "ProductIntroductionRequest.${pir_oc_id}.status is still DRAFT"
            - "the same call as VendorAdmin ${v_ownv_id} succeeds and moves the request to SUBMITTED"

      - name: appeal_for_a_rep_that_is_not_revoked_returns_409
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REP_NOT_REVOKED]
          - validations.priority_22
        distinguishing_aspect: "The appeal channel exists only for REVOKED reps: filing for a rep whose access_status is PENDING is refused 409 ERR_REP_NOT_REVOKED, which outranks the appeal-window check because there is no revocation instant to measure from."
        test_recipe:
          setup:
            - "Vendor NRV has rep Nick, never revoked (access_status PENDING)."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Not Revoked Devices", vendor_code: "NRV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_nrv_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_nrv_id}", full_name: "Nick NotRevoked", email: "nick@nrv.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_nick_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/access-appeals"
              payload: { vendor_rep_id: "${rep_nick_id}", grounds: "Pre-emptive appeal against a revocation that has not happened" }
              as: VendorAdmin
              as_user_id: "${v_nrv_id}"
              captures: { not_revoked_err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${not_revoked_err} == ERR_REP_NOT_REVOKED"
            - "GET /vendor-access/vendor-reps/${rep_nick_id}/access-appeals returns total_count == 0"
            - "VendorRep.${rep_nick_id}.access_status is still PENDING with revoked_at_utc null"

      - name: second_investigate_on_the_same_incident_returns_409
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INCIDENT_INVALID_STATE]
          - validations.priority_20
        distinguishing_aspect: "investigate is admissible only from REPORTED: the second call finds the incident already UNDER_INVESTIGATION and is refused 409, leaving the first investigator's stamps untouched."
        test_recipe:
          setup:
            - "Facility IN-58, vendor INCV and rep Ivan exist; case CASE-15140 carries one REPORTED MINOR incident."
            - "The incident has already been moved to UNDER_INVESTIGATION once."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Incident State Hospital", code: "IN-58", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_in_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Incident State Devices", vendor_code: "INCV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_incv_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_incv_id}", full_name: "Ivan Incident", email: "ivan@incv.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_ivan_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_in_id}", case_number: "CASE-15140", procedure_name: "Incident State Case", scheduled_start_utc: "2026-09-18T08:00:00Z", scheduled_end_utc: "2026-09-18T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15140_id: $.data.id }
            - call: "POST /vendor-access/incidents"
              payload: { surgical_case_id: "${case_15140_id}", vendor_rep_id: "${rep_ivan_id}", incident_type: "ESCORT_VIOLATION", severity: "MINOR", narrative: "Rep entered the sub-sterile corridor ahead of the escort" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { inc_15140_id: $.data.id }
            - call: "POST /vendor-access/incidents/${inc_15140_id}/investigate"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
          trigger:
            - call: "POST /vendor-access/incidents/${inc_15140_id}/investigate"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { incident_state_err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${incident_state_err} == ERR_INCIDENT_INVALID_STATE"
            - "Incident.${inc_15140_id}.status is still UNDER_INVESTIGATION with adjudicated_outcome null"
            - "Vendor.${v_incv_id}.provisional_compliance_score == 97 and adjudicated_compliance_score == 100 (an open MINOR incident counts only in the provisional variant)"

      - name: reschedule_of_a_cancelled_case_returns_409
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CASE_NOT_SCHEDULED]
          - validations.priority_15
        distinguishing_aspect: "CANCELLED is a terminal case state: the reschedule is refused 409 ERR_CASE_NOT_SCHEDULED and reschedule_count stays 0, so the cancellation cannot be undone by re-timing the case."
        test_recipe:
          setup:
            - "Facility CX-59 exists; case CASE-15150 has been cancelled."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Cancelled Case Hospital", code: "CX-59", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_cx_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_cx_id}", case_number: "CASE-15150", procedure_name: "Cancelled Case", scheduled_start_utc: "2026-09-22T08:00:00Z", scheduled_end_utc: "2026-09-22T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15150_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases/${case_15150_id}/cancel"
              payload: { cancellation_reason: "Patient deferred the procedure" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
          trigger:
            - call: "POST /vendor-access/surgical-cases/${case_15150_id}/reschedule"
              payload: { new_scheduled_start_utc: "2026-09-24T08:00:00Z", new_scheduled_end_utc: "2026-09-24T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_state_err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${case_state_err} == ERR_CASE_NOT_SCHEDULED"
            - "SurgicalCase.${case_15150_id}.status is still CANCELLED with scheduled_start_utc == 2026-09-22T08:00:00Z and reschedule_count == 0"

      - name: second_submit_of_the_same_request_returns_409
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PIR_INVALID_STATE]
          - validations.priority_16
        distinguishing_aspect: "submit is admissible only from DRAFT (and from REVISION_REQUESTED): a second submit on a SUBMITTED request is refused 409 and Vendor.open_pir_count is not double-counted."
        test_recipe:
          setup:
            - "Facility PS-60 and vendor PIRSV exist; one request has already been submitted."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Pir State Hospital", code: "PS-60", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_ps_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Pir State Devices", vendor_code: "PIRSV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_pirsv_id: $.data.id, v_pirsv_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
