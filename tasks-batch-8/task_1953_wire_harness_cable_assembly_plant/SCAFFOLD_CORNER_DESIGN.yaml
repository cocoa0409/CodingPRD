  - section: validations
    instances:
      - name: c_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role or existence check runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-V1", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: c_forbidden_role_on_drawing_create
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_FORBIDDEN]"
          - roles.HarnessEngineer
        distinguishing_aspect: "MaterialsClerk is not in the endpoint's roles; POST /plant/drawings is denied 403 ERR_FORBIDDEN even with a well-formed body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-V2", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: MaterialsClerk, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN (HTTP 403)"

      - name: c_existence_priority_not_found_before_state
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=7]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Dual failure: bogus harness id (existence) plus an uncertified operator (business_safety); existence at priority 4 wins -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["One operator with no certifications"]
          setup_api_calls:
            - { call: "POST /plant/operators", payload: { operator_name: "NC V3", badge_no: "B-NC-V3" }, as: QualityManager, captures: { nc: $.data.id } }
          trigger:
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "00000000-0000-0000-0000-000000000000", test_type: "CONTINUITY", opens_count: 0 }, as: QualityInspector, as_user_id: "${nc}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND   # existence (4) precedes state (6) and safety (7)"

