scaffold_corner_design:

  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: create_borrower_returns_201_with_active_status
        claim_type: Creation
        grounds: [entities.Borrower.fields.status]
        distinguishing_aspect: "POST /borrowers with business_name, ein, state_code returns 201 and status ACTIVE with a system-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /borrowers"
              payload: { business_name: "New Biz", ein: "10-1000001", state_code: "CA" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          assert:
            - "response status == 201"
            - "Borrower.${b_id}.status == ACTIVE"
            - "Borrower.${b_id}.business_name == New Biz"

      - name: get_borrower_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Borrower
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /borrowers/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /borrowers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: create_loan_application_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.LoanApplication.fields.requested_principal_cents
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /loan-applications missing requested_principal_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["a borrower exists"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "Biz V", ein: "10-1000002", state_code: "CA" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_VALIDATION"

      - name: investor_max_single_loan_pct_default_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Investor.fields.max_single_loan_pct]
        distinguishing_aspect: "POST /investors without max_single_loan_pct applies the default 0.25."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /investors"
              payload: { display_name: "Default Inv" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "response status == 201"
            - "Investor.${inv_id}.max_single_loan_pct == 0.25"
            - "Investor.${inv_id}.capital_base_cents == 0 and Investor.${inv_id}.committed_capital_cents == 0"

      - name: loan_application_computed_fields_null_before_scoring
        claim_type: Computed Fields
        grounds: [entities.LoanApplication.fields.credit_score, entities.LoanApplication.fields.risk_grade, entities.LoanApplication.fields.offered_apr]
        distinguishing_aspect: "A freshly submitted application has credit_score, risk_grade, offered_apr all null and status SUBMITTED; client cannot set them."
        test_recipe:
          setup: ["a borrower exists"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "Biz C", ein: "10-1000003", state_code: "CA" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
          assert:
            - "LoanApplication.${app_id}.status == SUBMITTED"
            - "LoanApplication.${app_id}.credit_score == null and risk_grade == null and offered_apr == null"

      - name: loan_application_invalid_term_months_enum_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.LoanApplication.fields.term_months
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "term_months not in {12,24,36,60} (e.g. 18) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["a borrower exists"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "Biz T", ein: "10-1000004", state_code: "CA" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 18, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_VALIDATION"

      - name: borrower_id_system_field_ignored_on_application_create
        claim_type: System Fields
        grounds: [entities.LoanApplication.fields.status, entities.LoanApplication.fields.scored_by_user_id]
        distinguishing_aspect: "Client-supplied status/scored_by_user_id on POST /loan-applications are rejected as unknown fields (not in input schema), so the server controls them."
        test_recipe:
          setup: ["a borrower exists"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "Biz S", ein: "10-1000005", state_code: "CA" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
          assert:
            - "LoanApplication.${app_id}.status == SUBMITTED (system-controlled)"
            - "LoanApplication.${app_id}.scored_by_user_id == null"

      - name: repayment_allocation_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.RepaymentAllocation]
        distinguishing_aspect: "RepaymentAllocation has common_fields:false — only id and created_at; no version, no update endpoint; discoverable only via reverse-reachability GET."
        test_recipe:
          setup: ["a scheduled repayment has produced allocation rows on a disbursed two-investor loan"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { business_name: "AllocImm", ein: "10-1000006", state_code: "CA" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id, l_v0: $.data.0.version }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${l_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /investors"
              payload: { display_name: "Inv X", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invx_id: $.data.id }
            - call: "POST /investors/${invx_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investors"
              payload: { display_name: "Inv Y", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invy_id: $.data.id }
            - call: "POST /investors/${invy_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${invx_id}", loan_id: "${l_id}", amount_cents: 800000, expected_loan_version: "${l_v0}" }
              as: Investor
              as_user_id: "${invx_id}"
            - call: "GET /loans/${l_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_v1: $.data.version }
            - call: "POST /investments"
              payload: { investor_id: "${invy_id}", loan_id: "${l_id}", amount_cents: 400000, expected_loan_version: "${l_v1}" }
              as: Investor
              as_user_id: "${invy_id}"
            - call: "POST /loans/${l_id}/disburse"
              payload: {}
              as: PlatformAdmin
            - call: "POST /loans/${l_id}/repayments"
              payload: { loan_id: "${l_id}", amount_cents: 103274, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "GET /repayments/${rep_id}/allocations"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GET /repayments/${rep_id}/allocations returns 2 rows, each with id and created_at but no version field"

      - name: application_wrong_parent_borrower_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.LoanApplication.fields.borrower_id
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /loan-applications with a borrower_id that does not exist returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /loan-applications"
              payload: { borrower_id: "00000000-0000-4000-8000-000000000001", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: flat_fk_integrity_investment_unknown_loan_not_found
        claim_type: Not Found
        grounds:
          - entities.Investment.fields.loan_id
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Flat-topology FK integrity: POST /investments referencing a non-existent loan_id returns ERR_NOT_FOUND (404) at the existence check, before the OCC check is reached."
        test_recipe:
          setup: ["an investor with capital exists; a real loan exists only to source a real version token"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "FKBiz", ein: "10-1000007", state_code: "CA" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { real_v0: $.data.0.version }
            - call: "POST /investors"
              payload: { display_name: "Inv FK", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /investments"
              payload: { investor_id: "${inv_id}", loan_id: "00000000-0000-4000-8000-000000000002", amount_cents: 400000, expected_loan_version: "${real_v0}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: score_application_from_already_scored_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LoanApplication.SUBMITTED_to_SCORED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Re-scoring an application already in SCORED is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a scored application"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "ReScore", ein: "20-2000001", state_code: "TX" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
          trigger:
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: approve_terminal_rejected_application_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.LoanApplication.SCORED_to_REJECTED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Approving an application already in terminal REJECTED is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a rejected application"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "RejTerm", ein: "20-2000002", state_code: "TX" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/reject"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
          trigger:
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: new_loan_starts_in_funding_initial_state
        claim_type: Initial State
        grounds: [state_machines.Loan.FUNDING_to_ACTIVE, entities.Loan.fields.status]
        distinguishing_aspect: "An originated Loan starts in FUNDING with committed_cents 0 and outstanding_principal_cents 0."
        test_recipe:
          setup: ["an approved application originates a loan"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "InitLoan", ein: "20-2000003", state_code: "TX" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
          trigger:
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id }
          assert:
            - "the single returned Loan has status == FUNDING, committed_cents == 0, outstanding_principal_cents == 0, apr == 0.0599"

      - name: disburse_underfunded_loan_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Loan.FUNDING_to_ACTIVE
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Disburse on a loan whose committed_cents (400000) is below principal_cents (1,200,000) is rejected with ERR_INVALID_STATE (409) even with a filed prospectus."
        test_recipe:
          setup: ["loan funded only 400000 of 1,200,000, prospectus filed"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "UnderFund", ein: "20-2000004", state_code: "TX" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id, l_v0: $.data.0.version }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${l_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /investors"
              payload: { display_name: "Inv U", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${inv_id}", loan_id: "${l_id}", amount_cents: 400000, expected_loan_version: "${l_v0}" }
              as: Investor
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /loans/${l_id}/disburse"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"
            - "Loan.${l_id}.status == FUNDING"

      - name: disburse_bubble_up_sets_investment_outstanding_and_repayment_state
        claim_type: Side Effect Execution
        grounds: [state_machines.Loan.FUNDING_to_ACTIVE, state_machines.Loan.ACTIVE_to_REPAYMENT, entities.Investment.fields.outstanding_principal_cents]
        distinguishing_aspect: "Disburse stamps each Investment.outstanding_principal_cents = amount_cents, sets current_period_index=1, funded_at, and auto-transitions the loan through ACTIVE to REPAYMENT in one request."
        test_recipe:
          setup: ["fully funded loan with prospectus, single investor 1,200,000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { business_name: "DisbSE", ein: "20-2000005", state_code: "TX" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id, l_v0: $.data.0.version }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${l_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /investors"
              payload: { display_name: "Inv D", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${inv_id}", loan_id: "${l_id}", amount_cents: 1200000, expected_loan_version: "${l_v0}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { inv_inv_id: $.data.id }
          trigger:
            - call: "POST /loans/${l_id}/disburse"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Loan.${l_id}.status == REPAYMENT and Loan.${l_id}.current_period_index == 1 and Loan.${l_id}.outstanding_principal_cents == 1200000"
            - "Investment.${inv_inv_id}.outstanding_principal_cents == 1200000"

      - name: charge_off_from_repayment_without_default_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Loan.DEFAULTED_to_CHARGED_OFF
          - "errors[ERR_INVALID_STATE]"
