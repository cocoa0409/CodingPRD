              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_sd_id}"
            - call: "POST /committee-panels"
              payload: { cycle_id: "${cyc_id}", panel_label: "SD ELA Panel A", session_start_at: "2026-10-25T14:00:00Z", session_end_at: "2026-10-25T18:00:00Z", member_count: 3, quorum_required: 2 }
