            - call: "POST /exercises/${exX_id}/impact-submissions"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exX_id}/impact-decisions"
              payload: { action: "APPROVE" }
              as: RiskApprover
              as_user_id: "${ra3_id}"
            - call: "POST /exercises/${exX_id}/schedule"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exX_id}/execution-transitions"
              payload: { action: "START" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exX_id}/step-executions"
