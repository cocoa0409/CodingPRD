            - "SponsorshipDeal.${dl_l}.fulfillment_status is unchanged and Exhibitor.${ex_h}.penalty_points == 0"
            - "Exhibitor.${ex_n}.status == ACTIVE (20 < SUSPENSION_PENALTY_THRESHOLD 30)"

      - name: bounded_negotiation_cycle_terminates
        claim_type: cyclic
        grounds:
          - state_machines[SpaceContract].transitions[OFFERED->COUNTERED]
          - state_machines[SpaceContract].transitions[COUNTERED->OFFERED]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: space_contract_bounded_negotiation_cycle_exhausts_on_fourth_counter
          rationale: "§1.8 already walks the OFFERED <-> COUNTERED loop three full times and proves the fourth COUNTER is refused with ERR_NEGOTIATION_ROUNDS_EXHAUSTED while a REOFFER never consumes the budget. A second cyclic instance here would re-assert the same loop-termination condition."

      - name: two_sponsorship_axes_move_independently
        claim_type: parallel
        grounds:
          - state_machines[SponsorshipDeal:deal_status]
          - state_machines[SponsorshipDeal:fulfillment_status]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: sponsorship_deal_two_axes_advance_independently
          rationale: "§1.8 drives deal_status and fulfillment_status through four distinct combined states on one deal and asserts each axis after every write, which is exactly the parallel-shape claim."

      - name: venue_termination_cascades_down_the_tree
        claim_type: cascade_down
        grounds:
          - state_machines[VenueContract].transitions[EXECUTED->TERMINATED].side_effects
          - state_machines[Show].transitions[*->CANCELLED].side_effects
        excluded_because:
          difficulty_instance: venue_termination_cascades_four_levels_to_booth_and_service_order_release
          rationale: "§1.8 verifies the full four-level chain (VenueContract -> Show -> SpaceContract -> Booth/ServiceOrder) end to end, including that only non-terminal children are touched. A duplicate here adds no coverage."

      - name: last_resolved_obligation_bubbles_up_to_the_deal
        claim_type: bubble_up
        grounds:
          - state_machines[SponsorshipDeal:fulfillment_status].transitions[PARTIAL->COMPLETE].side_effects
          - calculations.sponsorship_fulfillment_status
        excluded_because:
          difficulty_instance: last_obligation_delivery_cascades_to_priority_tier_upgrade
          rationale: "§1.8 already proves that resolving the final child obligation flips the parent deal to COMPLETE and then credits priority_point_value exactly once, which is the bubble-up claim plus its guard."

      - name: obligation_miss_reaches_across_to_the_exhibitor
        claim_type: cross_entity
        grounds:
          - state_machines[SponsorshipDeal:fulfillment_status].transitions[PARTIAL->BREACHED].side_effects
          - entities.Exhibitor.fields.status
        excluded_because:
          difficulty_instance: show_close_cascades_missed_obligation_into_exhibitor_suspension
          rationale: "§1.8 carries the Show -> Obligation -> Deal -> Exhibitor chain all the way to ACTIVE -> SUSPENDED at the penalty threshold; the conditional_cascade instance above already covers the non-suspending variant of the same edge."

      - name: cancelling_a_signed_contract_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines[SpaceContract].transitions[SIGNED->CANCELLED].side_effects
          - calculations.show_booth_area_conservation
        excluded_because:
          difficulty_instance: sign_then_cancel_returns_every_square_foot_to_the_floor
          rationale: "§1.8 asserts the full compensating trio (booths back to AVAILABLE, service orders CANCELLED, points_awarded unwound) with before/after ledgers, so an undo claim here would be a copy."

