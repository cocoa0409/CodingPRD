  # ===================================================================== RBAC
  - section: rbac
    instances:
      - name: warehouse_operator_cannot_create_catalog_item
        claim_type: violation_to_error
        grounds: [roles]
        distinguishing_aspect: "WarehouseOperator is excluded from the catalog create roles (PlatformAdmin exclusive) -> ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PART", name: "X", sku: "X-1", unit_price_cents: 100 }
              as: WarehouseOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and http status == 403"

      - name: member_cannot_create_catalog_item
        claim_type: violation_to_error
        grounds: [roles]
        distinguishing_aspect: "Member role (even with a valid member id) cannot write the catalog -> ERR_FORBIDDEN."
        test_recipe:
          setup: ["member exists"]
          setup_api_calls:
            - call: "POST /dme/members"
              payload: { full_name: "Rb2 Mem", email: "rb2@x.com", date_of_birth: "1990-01-01", shipping_address: "18 V St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PART", name: "Y", sku: "Y-1", unit_price_cents: 100 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and http status == 403"

      - name: billing_specialist_cannot_submit_claim
        claim_type: violation_to_error
        grounds: [roles]
        distinguishing_aspect: "Claim creation is InsuranceSpecialist-exclusive; BillingSpecialist gets ERR_FORBIDDEN (role check precedes existence checks on the FK)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dme/claims"
              payload: { pump_order_id: "00000000-0000-0000-0000-000000000000" }
              as: BillingSpecialist
              as_user_id: "bill-9"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and http status == 403"

      - name: member_creates_and_patches_own_order
        claim_type: satisfaction_pass
        grounds: [roles, "concurrency_rules[pump-order-patch-stale-version]"]
        distinguishing_aspect: "Positive ownership path: a Member creates an order for themself (member_id == X-User-ID) and PATCHes it with the captured version; version increments by exactly 1."
        test_recipe:
          setup: ["member, policy, verified prescription, and a second STANDARD pump model exist"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "AltPump", sku: "PUMP-ALT", unit_price_cents: 32000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { alt_pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Self Mem", email: "self@x.com", date_of_birth: "1990-01-01", shipping_address: "19 V St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "19 V St" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "PATCH /dme/pump-orders/${o_id}"
              payload: { pump_item_id: "${alt_pump_id}", expected_pump_order_version: "${o_v}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "PumpOrder.${o_id}.pump_item_id == ${alt_pump_id}"
            - "PumpOrder.${o_id}.version == ${o_v} + 1"
            - "PumpOrder.${o_id}.merchandise_subtotal_cents == 32000 (primary line re-priced)"

  # ================================================= Cross-cutting layers (OCC)
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_pump_order_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pump-order-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second PATCH carrying the pre-mutation version is rejected with 412 ERR_STALE_VERSION; the first PATCH (current version) succeeded and bumped the version."
        test_recipe:
          setup: ["order created; version captured from the create response"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Oc Mem", email: "oc@x.com", date_of_birth: "1990-01-01", shipping_address: "20 V St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "20 V St" }
              as: CareCoordinator
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "PATCH /dme/pump-orders/${o_id}"
              payload: { shipping_address: "20 V St Apt 2", expected_pump_order_version: "${o_v}" }
              as: CareCoordinator
            - call: "PATCH /dme/pump-orders/${o_id}"
              payload: { shipping_address: "20 V St Apt 3", expected_pump_order_version: "${o_v}" }
              as: CareCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "first PATCH succeeds with 200 and shipping_address == '20 V St Apt 2'"
            - "second PATCH returns error_id == ERR_STALE_VERSION and http status == 412"
            - "PumpOrder.${o_id}.version == ${o_v} + 1 and shipping_address == '20 V St Apt 2'"

      - name: occ_stale_version_on_schedule_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[resupply-schedule-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A resupply order created between the client's read and its PATCH bumps the schedule version, so the PATCH with the pre-order version is rejected with 412."
        test_recipe:
          setup: ["pump order DELIVERED 2026-05-01; PART VALVE schedule version captured; clock 2026-07-30; a resupply order is then created (bumps schedule version)"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PART", name: "Valve", sku: "PART-VALVE", unit_price_cents: 500, covered_under_resupply: true, max_qty_per_frequency: 4 }
              as: PlatformAdmin
              captures: { part_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Sv Mem", email: "sv@x.com", date_of_birth: "1990-01-01", shipping_address: "21 V St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", resupply_frequency_days: 90 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "21 V St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_id}", carrier: "UPS", tracking_number: "1Z-V7" }
              as: WarehouseOperator
              captures: { sh_id: $.data.id }
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "IN_TRANSIT" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "OUT_FOR_DELIVERY" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: WarehouseOperator
            - call: "GET /dme/resupply-schedules"
              payload: { member_id: "${m_id}", catalog_item_id: "${part_id}" }
              as: CareCoordinator
              captures: { sched_id: "$.data[0].id", s_v: "$.data[0].version" }
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/resupply-orders"
              payload: { schedule_id: "${sched_id}", member_id: "${m_id}", quantity: 1 }
              as: CareCoordinator
          trigger:
            - call: "PATCH /dme/resupply-schedules/${sched_id}"
              payload: { frequency_days: 60, expected_schedule_version: "${s_v}" }
              as: CareCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION and http status == 412"
            - "ResupplySchedule.${sched_id}.frequency_days == 90 (unchanged)"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: delivery_cascade_order_to_schedules_to_member
          rationale: "N-level chain verified end-to-end there; warranty replacement chain in warranty_replace_cascade_to_shipment_and_order_posture."
      - name: dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: provisional_vs_adjudicated_patient_responsibility
          rationale: "Both variants and their delta asserted there; schedule-mode variants in rolling_vs_calendar_anchored_resupply_cadence."
      - name: rate_threshold_triggers_covered
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: prior_auth_threshold_inclusive_boundary
          rationale: "Cumulative/instantaneous threshold boundaries asserted there and in garment_allowance_exactly_at_cap and warranty_replace_cascade_to_shipment_and_order_posture."
      - name: derived_field_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds: [entities.Member.fields.next_resupply_date]
        excluded_because:
          difficulty_instance: delivery_cascade_order_to_schedules_to_member
          rationale: "Member aggregates recomputed on schedule creation asserted there; suspension/termination recompute asserted in policy_terminate_ends_schedules."

  # ============================================================ Consistency
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_qualify
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, calculations.provisional_patient_responsibility]
        distinguishing_aspect: "Immediate consistency: the qualify response itself carries the computed provisional fields — no re-read or delay is needed to observe them."
        test_recipe:
          setup: ["order PENDING_QUALIFICATION; policy deductible 50000, coinsurance 0.20"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Im Mem", email: "im@x.com", date_of_birth: "1990-01-01", shipping_address: "22 V St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", deductible_cents: 50000, coinsurance_pct: 0.2 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "22 V St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
              captures: { q_patient: $.data.provisional_patient_cents, q_status: $.data.fulfillment_status }
          assert:
            - "qualify response data.fulfillment_status == QUALIFIED"
            - "qualify response data.provisional_patient_cents == 30000 (30000 deductible-applied + 0 coinsurance, visible in the same response)"
            - "qualify response data.prior_auth_required == false"
