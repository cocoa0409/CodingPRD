scenario: |
  2894. Runaway & Homeless Youth Services (youth shelter and outreach program): street outreach with engagement protocols and basic needs provision to build trust, emergency shelter admission with age criteria, parental notification requirements and runaway reporting obligations, family reunification services with mediation and aftercare planning where safe and appropriate, transitional living program placement with duration limits, life skills curriculum and savings requirements, education and employment support with school enrollment rights for unaccompanied youth, safety screening for trafficking and exploitation with specialized response protocols, positive youth development programming with youth voice in program governance, federal program compliance including bed capacity limits, stay duration and outcome reporting

domain_name: runaway-homeless-youth-services
api_prefix: "/ryhs"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # flat: peer entities linked by explicit foreign keys; only two URL nesting levels
  # exist and they are read/creation conveniences, never ownership chains. Youth,
  # ShelterProgram, Admission, ReunificationCase, TlpPlacement and GovernanceProposal
  # are all top-level collections addressed by their own id.

  state_machine_shape: cyclic
  # ReunificationCase loops MEDIATION_HELD -> MEDIATION_SCHEDULED -> MEDIATION_HELD
  # (bounded by max_mediation_rounds) and branches HOME_ASSESSMENT -> {APPROVED, DECLINED}
  # with divergent side-effect sets. SafetyScreening loops CLEARED <-> ESCALATED.
  # GuardianNotification self-loops ATTEMPTED -> ATTEMPTED. TlpPlacement carries two
  # independent dimensions (tenancy_status x compliance_status) on one row.

  relationship_patterns:
    - one_to_many          # Youth -> Admission, TlpPlacement -> SavingsLedgerEntry
    - cross_aggregate      # GovernanceVote spans Youth and GovernanceProposal
    - polymorphic          # ShelterProgram.program_type selects which child occupies its beds

  role_model: segregation_of_duties
  # Six operational roles. Two hard segregation rules: the specialist who recorded a
  # mediation outcome may not decide the case, and the ProgramAdmin who waives a
  # parental notification may not be the case manager who admitted the youth.

  consistency_model: immediate

entities:
  - name: ShelterProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: licensed program name
        constraints: 1..120 chars
      - name: program_type
        type: enum
        source: input
        description: which child entity occupies this program's beds
        constraints: EMERGENCY_SHELTER | TRANSITIONAL_LIVING
      - name: licensed_bed_capacity
        type: integer
        source: input
        description: federally licensed bed count; hard ceiling on occupied_beds
        constraints: ">= 1"
      - name: min_age_years
        type: integer
        source: input
        description: youngest admissible age, inclusive
        constraints: 0..24
      - name: max_age_years
        type: integer
        source: input
        description: oldest admissible age, inclusive
        constraints: min_age_years..24
      - name: max_stay_nights
        type: integer
        source: input
        description: federal emergency-shelter stay ceiling in billable nights
        constraints: ">= 1"
      - name: max_placement_days
        type: integer
        source: input
        description: federal transitional-living base duration ceiling in days
        constraints: ">= 1"
      - name: savings_match_rate_bp
        type: integer
        source: input
        description: basis points of each youth deposit the program matches
        constraints: 0..10000
      - name: required_savings_rate_bp
        type: integer
        source: input
        description: basis points of documented monthly income a TLP youth must bank
        constraints: 0..10000
      - name: occupied_beds
        type: integer
        source: computed
        description: live bed count; see calculations.program_posture for the exact filter
        default: 0
      - name: waitlisted_count
        type: integer
        source: computed
        description: count of Admission rows for this program with status == WAITLISTED
        default: 0
      - name: overdue_notification_count
        type: integer
        source: computed
        description: count of GuardianNotification rows with status == OVERDUE whose Admission.program_id equals this program
        default: 0
      - name: utilization_bp
        type: integer
        source: computed
        description: floor(occupied_beds * 10000 / licensed_bed_capacity)
        default: 0
      - name: posture
        type: enum
        source: computed
        description: derived gate over all child operations; see calculations.program_posture
        default: OPEN
        constraints: OPEN | RESTRICTED | FROZEN

  - name: Youth
    parent: null
    common_fields: true
    fields:
      - name: legal_first_name
        type: string
        source: input
        description: legal first name
        constraints: 1..80 chars
      - name: legal_last_name
        type: string
        source: input
        description: legal last name
        constraints: 1..80 chars
      - name: date_of_birth
        type: string
        source: input
        description: birth date as YYYY-MM-DD; drives age_years against the logical clock
        constraints: ISO calendar date, no time component
      - name: unaccompanied
        type: boolean
        source: input
        description: true when the youth presents with no accompanying adult; unlocks immediate school enrollment
        default: true
      - name: age_years
        type: integer
        source: computed
        description: whole years between date_of_birth and the logical clock; see calculations.youth_age_years
      - name: status
        type: enum
        source: computed
        description: lifecycle position; see state_machines.Youth
        default: PROSPECT
        constraints: PROSPECT | ENGAGED | SHELTERED | TLP_ENROLLED | REUNIFIED_PENDING | REUNIFIED | EXITED
      - name: risk_posture
        type: enum
        source: computed
        description: derived per-youth gate; see calculations.youth_risk_posture
        default: OPEN
        constraints: OPEN | RESTRICTED | FROZEN
      - name: trafficking_risk_score
        type: integer
        source: computed
        description: outreach_history variant of calculations.trafficking_risk_score, 0..100
        default: 0
      - name: trafficking_risk_tier
        type: enum
        source: computed
        description: tier of trafficking_risk_score at thresholds 30 and 60
        default: LOW
        constraints: LOW | ELEVATED | CRITICAL
      - name: engagement_contact_count
        type: integer
        source: computed
        description: count of OutreachContact rows for this youth
        default: 0
      - name: basic_needs_provision_count
        type: integer
        source: computed
        description: total number of basic_needs_provided entries summed over the youth's OutreachContact rows
        default: 0
      - name: cumulative_shelter_nights
        type: integer
        source: computed
        description: sum of final_billable_nights over the youth's DISCHARGED Admission rows
        default: 0
      - name: lifetime_savings_deposited_cents
        type: integer
        source: computed
        description: sum of DEPOSIT amount_cents minus REVERSAL amount_cents over every SavingsLedgerEntry of every TlpPlacement of this youth
        default: 0
      - name: governance_vote_eligible
        type: boolean
        source: computed
        description: true when status IN {SHELTERED, TLP_ENROLLED} and engagement_contact_count >= 1
        default: false
      - name: intake_worker_user_id
        type: string
        source: system
        description: X-User-ID of the OutreachWorker who created this Youth row

  - name: OutreachContact
    parent: null
    common_fields: false
    fields:
      - name: youth_id
        type: string
        source: input
        description: FK -> Youth.id; the youth engaged on the street
      - name: contacted_at
        type: datetime
        source: system
        description: logical-clock instant of the encounter, ISO 8601 UTC with three fractional digits
      - name: engagement_stage
        type: enum
        source: input
        description: protocol stage reached in this encounter
        constraints: FIRST_CONTACT | RAPPORT_BUILDING | SERVICE_OFFER | TRUST_ESTABLISHED
      - name: basic_needs_provided
        type: array
        source: input
        description: basic-needs items handed over during the encounter
        constraints: subset of [FOOD, HYGIENE_KIT, CLOTHING, TRANSIT_PASS, MEDICAL_REFERRAL], no duplicates, may be empty
      - name: indicator_flags
        type: array
        source: input
        description: trafficking/exploitation indicator codes observed during the encounter
        constraints: subset of [THIRD_PARTY_CONTROL, QUOTA_DEBT, COMMERCIAL_SEX, DOCUMENT_WITHHELD, RECRUITER_PRESENT, CURFEW_ENFORCED], no duplicates, may be empty
      - name: worker_user_id
        type: string
        source: system
        description: X-User-ID of the OutreachWorker who logged the encounter

  - name: Admission
    parent: null
    common_fields: true
    fields:
      - name: youth_id
        type: string
        source: input
        description: FK -> Youth.id; the admitted youth
      - name: program_id
        type: string
        source: input
        description: FK -> ShelterProgram.id; must have program_type == EMERGENCY_SHELTER
      - name: status
        type: enum
        source: computed
        description: admission lifecycle; see state_machines.Admission
        default: PENDING_SCREENING
        constraints: PENDING_SCREENING | WAITLISTED | ACTIVE | EXTENDED | DISCHARGE_SCHEDULED | DISCHARGED | DENIED
      - name: requested_at
        type: datetime
        source: system
        description: logical-clock instant the admission request was accepted
      - name: admitted_at
        type: datetime
        source: system
        description: logical-clock instant the youth first occupied a bed; null while PENDING_SCREENING or WAITLISTED
      - name: planned_discharge_at
        type: datetime
        source: input
        description: caller-declared planned exit instant; upper bound of the projected occupancy interval
        constraints: strictly after the logical clock at request time
      - name: discharged_at
        type: datetime
        source: system
        description: logical-clock instant of discharge; null until DISCHARGED
      - name: priority_score
        type: integer
        source: computed
        description: 0..100 from calculations.admission_priority_score, frozen at request time and used as the waitlist ranking key
        default: 0
      - name: projected_billable_nights
        type: integer
        source: computed
        description: forward_projected variant of calculations.admission_billable_nights
        default: 0
      - name: final_billable_nights
        type: integer
        source: computed
        description: chronological_actual variant of calculations.admission_billable_nights; null until DISCHARGED
      - name: extension_count
        type: integer
        source: computed
        description: number of accepted extend calls on this admission
        default: 0
      - name: capacity_blocked
        type: boolean
        source: computed
        description: true while this admission is WAITLISTED because the program posture was FROZEN
        default: false
      - name: exit_destination
        type: enum
        source: system
        description: federally reported exit destination; null until DISCHARGED
        constraints: FAMILY_REUNIFIED | TRANSITIONAL_LIVING | INDEPENDENT_HOUSING | OTHER_SHELTER | UNKNOWN
      - name: outcome_positive
        type: boolean
        source: computed
        description: true when exit_destination IN {FAMILY_REUNIFIED, TRANSITIONAL_LIVING, INDEPENDENT_HOUSING}; null until DISCHARGED
      - name: admitting_user_id
        type: string
        source: system
        description: X-User-ID of the ShelterCaseManager who created this admission; segregation input for notification waivers

  - name: GuardianNotification
    parent: null
    common_fields: true
    fields:
      - name: admission_id
        type: string
        source: system
        description: FK -> Admission.id; the admission whose 24-hour parental notification obligation this row tracks
      - name: status
        type: enum
        source: computed
        description: notification obligation lifecycle; see state_machines.GuardianNotification
        default: PENDING
        constraints: PENDING | ATTEMPTED | CONTACTED | WAIVED | OVERDUE | LAW_ENFORCEMENT_REPORTED
      - name: due_at
        type: datetime
        source: computed
        description: admitted_at plus NOTIFICATION_DUE_HOURS (24); the census marks the row OVERDUE strictly after this instant
      - name: attempt_count
        type: integer
        source: computed
        description: number of accepted attempt calls
        default: 0
      - name: last_attempt_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent attempt; null while PENDING
      - name: attempt_channel
        type: enum
        source: input
        description: channel of the most recent attempt
        constraints: PHONE | IN_PERSON | CERTIFIED_MAIL | EMAIL
      - name: waiver_reason
        type: enum
        source: input
        description: statutory basis for suppressing guardian contact; null unless status == WAIVED
        constraints: ABUSE_DISCLOSED | TRAFFICKING_RISK | COURT_ORDER
      - name: runaway_report_filed_at
        type: datetime
        source: system
        description: logical-clock instant the runaway report was filed with law enforcement; null unless status == LAW_ENFORCEMENT_REPORTED
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant the obligation reached CONTACTED, WAIVED or LAW_ENFORCEMENT_REPORTED
      - name: resolving_user_id
        type: string
        source: system
        description: X-User-ID that resolved the obligation; must differ from the Admission's admitting_user_id when the outcome is WAIVED

  - name: SafetyScreening
    parent: null
    common_fields: true
    fields:
      - name: youth_id
        type: string
        source: input
        description: FK -> Youth.id; the screened youth
      - name: screened_at
        type: datetime
        source: system
        description: logical-clock instant the screening was submitted
      - name: indicator_codes
        type: array
        source: input
        description: trafficking/exploitation indicators recorded by the screener
        constraints: subset of [THIRD_PARTY_CONTROL, QUOTA_DEBT, COMMERCIAL_SEX, DOCUMENT_WITHHELD, RECRUITER_PRESENT, CURFEW_ENFORCED], no duplicates, may be empty
      - name: score
        type: integer
        source: computed
        description: screening_time variant of calculations.trafficking_risk_score, 0..100
        default: 0
      - name: tier
        type: enum
        source: computed
        description: tier of score at thresholds 30 and 60
        default: LOW
        constraints: LOW | ELEVATED | CRITICAL
      - name: status
        type: enum
        source: computed
        description: screening disposition; see state_machines.SafetyScreening
        default: SUBMITTED
        constraints: SUBMITTED | ESCALATED | CLEARED
      - name: specialized_response_code
        type: enum
        source: input
        description: specialized anti-trafficking response attached at disposition time
        default: NONE
        constraints: NONE | ADVOCATE_ASSIGNED | LAW_ENFORCEMENT_LIAISON | EMERGENCY_RELOCATION
      - name: screener_user_id
        type: string
        source: system
        description: X-User-ID that submitted the screening
      - name: disposition_user_id
        type: string
        source: system
        description: X-User-ID that dispositioned the screening; null while SUBMITTED

  - name: ReunificationCase
    parent: null
    common_fields: true
    fields:
      - name: youth_id
        type: string
        source: input
        description: FK -> Youth.id; the youth whose family reunification is being pursued
      - name: guardian_household_label
        type: string
        source: input
        description: opaque label of the household under mediation; two cases for the same youth may name different households
        constraints: 1..120 chars
      - name: status
        type: enum
        source: computed
        description: reunification lifecycle; see state_machines.ReunificationCase
        default: OPENED
        constraints: OPENED | MEDIATION_SCHEDULED | MEDIATION_HELD | HOME_ASSESSMENT | APPROVED | DECLINED | AFTERCARE | CLOSED | SUPERSEDED
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock instant the case was opened
      - name: mediation_round
        type: integer
        source: computed
        description: number of MediationSession rows recorded as held on this case
        default: 0
      - name: max_mediation_rounds
        type: integer
        source: system
        description: hard ceiling on mediation_round
        default: 3
      - name: safety_assessment_result
        type: enum
        source: input
        description: home assessment verdict; null until the HOME_ASSESSMENT transition
        constraints: SAFE | CONDITIONAL | UNSAFE
      - name: aftercare_plan_due_at
        type: datetime
        source: computed
        description: approval instant plus AFTERCARE_PLAN_HOURS (72); null unless the case reached APPROVED
      - name: aftercare_contacts_completed
        type: integer
        source: computed
        description: number of aftercare contacts logged after approval
        default: 0
      - name: decision_user_id
        type: string
        source: system
        description: X-User-ID that decided the case; must differ from the recorded_by_user_id of the latest held MediationSession
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the case reached CLOSED or SUPERSEDED

  - name: MediationSession
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> ReunificationCase.id; the case this mediation round belongs to
      - name: scheduled_start_at
        type: datetime
        source: input
        description: start of the scheduled mediation window, inclusive
        constraints: strictly after the logical clock at scheduling time
      - name: scheduled_end_at
        type: datetime
        source: input
        description: end of the scheduled mediation window, inclusive
        constraints: strictly after scheduled_start_at
      - name: round_number
        type: integer
        source: computed
        description: case.mediation_round + 1 at scheduling time
      - name: outcome
        type: enum
        source: input
        description: mediation result recorded when the session is held; null while scheduled
        constraints: PROGRESS | IMPASSE | GUARDIAN_NO_SHOW | AGREEMENT
      - name: held_at
        type: datetime
        source: system
        description: logical-clock instant the outcome was recorded; null while scheduled
      - name: scheduler_user_id
        type: string
        source: system
        description: X-User-ID that scheduled the session
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID that recorded the outcome; segregation input for the case decision

  - name: TlpPlacement
    parent: null
    common_fields: true
    fields:
      - name: youth_id
        type: string
        source: input
        description: FK -> Youth.id; the youth placed in transitional living
      - name: program_id
        type: string
        source: input
        description: FK -> ShelterProgram.id; must have program_type == TRANSITIONAL_LIVING
      - name: tenancy_status
        type: enum
        source: computed
        description: occupancy dimension; evolves independently of compliance_status
        default: PLACED
        constraints: PLACED | NOTICE_GIVEN | EXITED
      - name: compliance_status
        type: enum
        source: computed
        description: savings-compliance dimension; evolves independently of tenancy_status
        default: IN_COMPLIANCE
        constraints: IN_COMPLIANCE | SAVINGS_DEFICIENT | PROBATION
      - name: placed_at
        type: datetime
        source: system
        description: logical-clock instant of placement
      - name: documented_monthly_income_cents
        type: integer
        source: input
        description: verified monthly earned income used by calculations.required_savings
        default: 0
        constraints: ">= 0"
      - name: days_elapsed
        type: integer
        source: computed
        description: floor((logical clock - placed_at) / 86400 seconds), recomputed on every read and on every census run
        default: 0
      - name: base_allowance_days
        type: integer
        source: computed
        description: copied from program.max_placement_days at placement time
      - name: earned_bonus_days
        type: integer
        source: computed
        description: life-skills bonus from calculations.tlp_duration_allowance
        default: 0
      - name: allowance_days
        type: integer
        source: computed
        description: base_allowance_days + earned_bonus_days per the pinned evaluation order in calculations.tlp_duration_allowance
      - name: consumed_ratio_bp
        type: integer
        source: computed
        description: floor(days_elapsed * 10000 / base_allowance_days); computed against the BASE allowance only
        default: 0
      - name: life_skills_credit_hours
        type: integer
        source: computed
        description: sum of credit_hours over this placement's LifeSkillsCompletion rows
        default: 0
      - name: required_savings_cents
        type: integer
        source: computed
        description: output of calculations.required_savings
        default: 0
      - name: savings_balance_cents
        type: integer
        source: computed
        description: conserved quantity; see calculations.savings_match_award for the exact identity
        default: 0
      - name: match_awarded_cents
        type: integer
        source: computed
        description: capped per-entry match sum from calculations.savings_match_award
        default: 0
      - name: consecutive_probation_reviews
        type: integer
        source: computed
        description: number of consecutive compliance reviews that landed on PROBATION; reset to 0 by any non-PROBATION review
        default: 0
      - name: exited_at
        type: datetime
        source: system
        description: logical-clock instant tenancy_status became EXITED
      - name: exit_reason
        type: enum
        source: input
        description: reason tenancy ended; null while tenancy_status != EXITED
        constraints: DURATION_LIMIT | INDEPENDENT_HOUSING | REUNIFIED | NONCOMPLIANCE | YOUTH_INITIATED
      - name: coordinator_user_id
        type: string
        source: system
        description: X-User-ID of the TlpCoordinator who created the placement

  - name: SavingsLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> TlpPlacement.id; the placement whose savings account this entry posts to
      - name: entry_type
        type: enum
        source: input
        description: direction of the posting
        constraints: DEPOSIT | WITHDRAWAL | REVERSAL
      - name: amount_cents
        type: integer
        source: input
        description: magnitude of the posting, always positive
        constraints: ">= 1"
      - name: signed_amount_cents
        type: integer
        source: computed
        description: +amount_cents for DEPOSIT, -amount_cents for WITHDRAWAL and REVERSAL
      - name: match_component_cents
        type: integer
        source: computed
        description: per-entry program match; +round_half_up(amount_cents * savings_match_rate_bp / 10000) for DEPOSIT, the exact negation for REVERSAL, 0 for WITHDRAWAL
        default: 0
      - name: balance_after_cents
        type: integer
        source: computed
        description: placement.savings_balance_cents immediately after this entry posted
      - name: posted_at
        type: datetime
        source: system
        description: logical-clock instant the entry posted
      - name: source_note
        type: string
        source: input
        description: free-text provenance note
        constraints: 0..200 chars
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID that posted the entry

  - name: LifeSkillsCompletion
    parent: null
    common_fields: false
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> TlpPlacement.id; the placement earning the credit
      - name: module_code
        type: enum
        source: input
        description: life-skills curriculum module completed
        constraints: BUDGETING | TENANCY | EMPLOYMENT_READINESS | HEALTH_LITERACY | CONFLICT_RESOLUTION | CIVIC_ENGAGEMENT
      - name: credit_hours
        type: integer
        source: input
        description: verified curriculum hours credited
        constraints: 1..40
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant the completion was verified
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID that verified the completion

  - name: EducationEnrollment
    parent: null
    common_fields: true
    fields:
      - name: youth_id
        type: string
        source: input
        description: FK -> Youth.id; the enrolled youth
      - name: school_name
        type: string
        source: input
        description: receiving school or program name
        constraints: 1..120 chars
      - name: enrollment_type
        type: enum
        source: input
        description: education or employment-track placement
        constraints: PUBLIC_K12 | GED_PROGRAM | POSTSECONDARY | VOCATIONAL
      - name: status
        type: enum
        source: computed
        description: enrollment lifecycle
        default: IMMEDIATE_ENROLLMENT
        constraints: IMMEDIATE_ENROLLMENT | VERIFIED
      - name: records_waived
        type: boolean
        source: computed
        description: true when the youth was unaccompanied at enrollment time, recording that guardian-held records were waived under the school-enrollment right
        default: false
      - name: enrolled_at
        type: datetime
        source: system
        description: logical-clock instant of enrollment
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant records verification completed; null while IMMEDIATE_ENROLLMENT
      - name: liaison_user_id
        type: string
        source: system
        description: X-User-ID of the staff member who enrolled the youth

  - name: GovernanceProposal
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> ShelterProgram.id; the program whose residents form the electorate
      - name: title
        type: string
        source: input
        description: proposal title
        constraints: 1..160 chars
      - name: category
        type: enum
        source: input
        description: governance domain the proposal touches
        constraints: HOUSE_RULES | PROGRAMMING | GRIEVANCE_PROCESS | FOOD_SERVICE
      - name: status
        type: enum
        source: computed
        description: proposal lifecycle; see state_machines.GovernanceProposal
        default: OPEN_FOR_VOTE
        constraints: OPEN_FOR_VOTE | ADOPTED | REJECTED
      - name: voting_closes_at
        type: datetime
        source: input
        description: instant after which no vote may be cast
        constraints: strictly after the logical clock at creation time
      - name: support_vote_count
        type: integer
        source: computed
        description: conserved tally; count of GovernanceVote rows with stance == SUPPORT and status == COUNTED
        default: 0
      - name: oppose_vote_count
        type: integer
        source: computed
        description: count of GovernanceVote rows with stance == OPPOSE and status == COUNTED
        default: 0
      - name: eligible_electorate_size
        type: integer
        source: computed
        description: electorate size frozen at close-vote time; see calculations.governance_adoption_tally
        default: 0
      - name: support_ratio_bp
        type: integer
        source: computed
        description: floor(support_vote_count * 10000 / eligible_electorate_size), 0 when the electorate is empty
        default: 0
      - name: adopted_at
        type: datetime
        source: system
        description: logical-clock instant the proposal was adopted; null unless status == ADOPTED
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID that closed the vote

  - name: GovernanceVote
    parent: null
    common_fields: true
    fields:
      - name: proposal_id
        type: string
        source: system
        description: FK -> GovernanceProposal.id; the proposal voted on
      - name: youth_id
        type: string
        source: system
        description: FK -> Youth.id; taken from the voting YouthMember's X-User-ID, never from the request body
      - name: stance
        type: enum
        source: input
        description: direction of the vote
        constraints: SUPPORT | OPPOSE
      - name: status
        type: enum
        source: computed
        description: whether the vote still counts toward the tally
        default: COUNTED
        constraints: COUNTED | RETRACTED
      - name: cast_at
        type: datetime
        source: system
        description: logical-clock instant the vote was cast
      - name: retracted_at
        type: datetime
        source: system
        description: logical-clock instant the vote was retracted; null while COUNTED

state_machines:
  - entity: Youth
    initial_state: PROSPECT
    terminal_states: [REUNIFIED, EXITED]
    transitions:
      - from: PROSPECT
        to: ENGAGED
        trigger: "POST /ryhs/youths/{id}/outreach-contacts"
        actor: OutreachWorker
        preconditions:
          - "Youth exists"
          - "Youth.status IN {PROSPECT, ENGAGED}"
        side_effects:
          - "engagement_contact_count += 1"
          - "basic_needs_provision_count += size(basic_needs_provided)"
          - "recompute Youth.trafficking_risk_score via calculations.trafficking_risk_score variant outreach_history, then Youth.trafficking_risk_tier"
          - "recompute Youth.risk_posture via calculations.youth_risk_posture"
          - "recompute Youth.governance_vote_eligible"
          - "increments Youth.version by 1"
      - from: ENGAGED
        to: ENGAGED
        trigger: "POST /ryhs/youths/{id}/outreach-contacts (repeat encounter, self-loop)"
        actor: OutreachWorker
        preconditions:
          - "Youth.status == ENGAGED"
        side_effects:
          - "same side effects as PROSPECT->ENGAGED; each contact re-decays the outreach_history score against the current logical clock"
          - "increments Youth.version by 1"
      - from: ENGAGED
        to: SHELTERED
        trigger: "system: an Admission of this Youth reaches ACTIVE"
        actor: system
        preconditions:
          - "Youth.status IN {PROSPECT, ENGAGED}"
        side_effects:
          - "recompute Youth.governance_vote_eligible (becomes true when engagement_contact_count >= 1)"
          - "recompute Youth.risk_posture (the cascaded GuardianNotification is PENDING, so posture becomes RESTRICTED)"
          - "increments Youth.version by 1"
        note: "PROSPECT -> SHELTERED is also legal for a youth admitted without any prior outreach contact; governance_vote_eligible then stays false."
      - from: PROSPECT
        to: SHELTERED
        trigger: "system: an Admission of this Youth reaches ACTIVE with engagement_contact_count == 0"
        actor: system
        preconditions:
          - "Youth.status == PROSPECT"
        side_effects:
          - "Youth.governance_vote_eligible stays false because engagement_contact_count == 0"
          - "increments Youth.version by 1"
      - from: SHELTERED
        to: TLP_ENROLLED
        trigger: "POST /ryhs/tlp-placements"
        actor: TlpCoordinator
        preconditions:
          - "Youth.status == SHELTERED"
          - "Youth.risk_posture == OPEN"
        side_effects:
          - "recompute Youth.governance_vote_eligible (stays true)"
          - "increments Youth.version by 1"
      - from: SHELTERED
        to: REUNIFIED_PENDING
        trigger: "system: a ReunificationCase of this Youth reaches APPROVED"
        actor: system
        preconditions:
          - "Youth.status == SHELTERED"
        side_effects:
          - "cascade hop 3: every Admission of this Youth with status IN {ACTIVE, EXTENDED} transitions to DISCHARGE_SCHEDULED"
          - "increments Youth.version by 1"
      - from: REUNIFIED_PENDING
        to: SHELTERED
        trigger: "system: a newer ReunificationCase supersedes the APPROVED case (POST /ryhs/reunification-cases)"
        actor: system
        preconditions:
          - "Youth.status == REUNIFIED_PENDING"
          - "the prior case's status IN {APPROVED, AFTERCARE}"
        side_effects:
          - "prior ReunificationCase.status -> SUPERSEDED, closed_at = clock"
          - "every Admission of this Youth with status == DISCHARGE_SCHEDULED reverts to ACTIVE (extension_count and admitted_at unchanged)"
          - "increments Youth.version by 1"
        note: "This is the revision cycle: SHELTERED -> REUNIFIED_PENDING -> SHELTERED. Reunification is retried against a different guardian household."
      - from: REUNIFIED_PENDING
        to: REUNIFIED
        trigger: "POST /ryhs/admissions/{id}/discharge with exit_destination == FAMILY_REUNIFIED"
        actor: ShelterCaseManager
        preconditions:
          - "Youth.status == REUNIFIED_PENDING"
        side_effects:
          - "cumulative_shelter_nights += Admission.final_billable_nights"
          - "recompute Youth.governance_vote_eligible (becomes false)"
          - "increments Youth.version by 1"
      - from: SHELTERED
        to: EXITED
        trigger: "POST /ryhs/admissions/{id}/discharge with exit_destination != FAMILY_REUNIFIED"
        actor: ShelterCaseManager
        preconditions:
          - "Youth.status == SHELTERED"
        side_effects:
          - "cumulative_shelter_nights += Admission.final_billable_nights"
          - "recompute Youth.governance_vote_eligible (becomes false)"
          - "increments Youth.version by 1"
      - from: TLP_ENROLLED
        to: EXITED
        trigger: "POST /ryhs/tlp-placements/{id}/exit"
        actor: TlpCoordinator
        preconditions:
          - "Youth.status == TLP_ENROLLED"
        side_effects:
          - "recompute Youth.governance_vote_eligible (becomes false)"
          - "increments Youth.version by 1"

  - entity: Admission
    initial_state: PENDING_SCREENING
    terminal_states: [DISCHARGED, DENIED]
    transitions:
      - from: PENDING_SCREENING
        to: ACTIVE
        trigger: "POST /ryhs/admissions (short-circuit evaluated inside the creating request)"
        actor: ShelterCaseManager
        preconditions:
          - "program.program_type == EMERGENCY_SHELTER"
          - "program.posture != FROZEN"
          - "youth.age_years BETWEEN program.min_age_years AND program.max_age_years, both inclusive"
          - "the youth's most recent SafetyScreening by created_at DESC exists and has status == CLEARED"
          - "no other Admission of this youth with status IN {PENDING_SCREENING, WAITLISTED, ACTIVE, EXTENDED, DISCHARGE_SCHEDULED} whose occupancy interval overlaps [clock, planned_discharge_at) per validations priority 27"
          - "if program.posture == RESTRICTED then priority_score >= RESTRICTED_PRIORITY_FLOOR (60)"
        side_effects:
          - "cascade hop 1: admitted_at = clock; priority_score = calculations.admission_priority_score; projected_billable_nights = calculations.admission_billable_nights variant forward_projected"
          - "cascade hop 2a: program.occupied_beds += 1, which itself forces cascade hop 3a: program.utilization_bp and program.posture recomputed via calculations.program_posture"
          - "cascade hop 2b: a GuardianNotification row is created with status PENDING, attempt_count 0 and due_at = admitted_at + NOTIFICATION_DUE_HOURS (24)"
          - "cascade hop 3b: because a PENDING GuardianNotification now exists, Youth.risk_posture is recomputed to RESTRICTED, which in turn (cascade hop 4) blocks POST /ryhs/tlp-placements for that youth with ERR_YOUTH_POSTURE_RESTRICTED until the obligation is resolved"
          - "Youth.status -> SHELTERED, increments Youth.version by 1"
      - from: PENDING_SCREENING
        to: WAITLISTED
        trigger: "POST /ryhs/admissions (short-circuit evaluated inside the creating request) while program.posture == FROZEN and waitlist_opt_out is absent or false"
        actor: ShelterCaseManager
        preconditions:
          - "program.program_type == EMERGENCY_SHELTER"
          - "program.posture == FROZEN"
          - "youth.age_years BETWEEN program.min_age_years AND program.max_age_years, both inclusive"
        side_effects:
          - "capacity_blocked = true; admitted_at stays null; priority_score = calculations.admission_priority_score"
          - "program.waitlisted_count += 1"
          - "no bed is consumed, so program.occupied_beds, program.utilization_bp and program.posture are unchanged"
          - "no GuardianNotification row is created; Youth.status is unchanged"
        note: "The FROZEN-capacity branch is evaluated BEFORE the screening branch: a youth with no CLEARED screening arriving at a FROZEN program lands in WAITLISTED, never PENDING_SCREENING."
      - from: PENDING_SCREENING
        to: ACTIVE
        trigger: "POST /ryhs/safety-screenings/{id}/disposition with disposition == CLEARED (system cascade)"
        actor: system
        preconditions:
          - "the dispositioned screening's youth_id equals this admission's youth_id"
          - "program.posture != FROZEN at disposition time"
        side_effects:
          - "identical hop set to PENDING_SCREENING -> ACTIVE above: admitted_at = clock, priority_score and projected_billable_nights computed, program.occupied_beds += 1 -> program.posture recomputed, GuardianNotification created PENDING -> Youth.risk_posture -> RESTRICTED"
          - "Youth.status -> SHELTERED, increments Youth.version by 1"
        note: "Activation order when several PENDING_SCREENING admissions of the same youth exist is created_at ASC; only the first is activated and the rest are left PENDING_SCREENING."
      - from: PENDING_SCREENING
        to: DENIED
        trigger: "POST /_ops/nightly-census"
        actor: system
        preconditions:
          - "clock - requested_at > PENDING_SCREENING_TTL_HOURS (72)"
        side_effects:
          - "no bed accounting changes; Youth.status unchanged"
      - from: WAITLISTED
        to: ACTIVE
        trigger: "system waitlist promotion, fired by POST /ryhs/admissions/{id}/discharge or POST /_ops/nightly-census"
        actor: system
        preconditions:
          - "program.posture != FROZEN immediately after the freeing event"
          - "this admission is the selector winner per the waitlist selector policy pinned here: eligibility status == WAITLISTED and program_id matches; ranking priority_score DESC; tie-break created_at ASC; empty candidate set is a no-op"
          - "youth.age_years still BETWEEN program.min_age_years AND program.max_age_years"
        side_effects:
          - "capacity_blocked = false; admitted_at = clock; projected_billable_nights recomputed against the ORIGINAL planned_discharge_at"
          - "program.waitlisted_count -= 1; program.occupied_beds += 1, which forces program.utilization_bp and program.posture to be recomputed (this is the fourth hop of the discharge cascade and can drive the program straight back to FROZEN)"
          - "a GuardianNotification row is created with status PENDING and due_at = admitted_at + 24h (fifth hop), which flips Youth.risk_posture to RESTRICTED (sixth hop)"
          - "Youth.status -> SHELTERED, increments Youth.version by 1"
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /ryhs/admissions/{id}/extend"
        actor: ShelterCaseManager
        preconditions:
          - "extension_count < MAX_EXTENSIONS (2)"
          - "the extended projected_billable_nights <= program.max_stay_nights"
          - "the youth has no GuardianNotification with status == OVERDUE"
        side_effects:
          - "planned_discharge_at = new_planned_discharge_at; extension_count += 1; projected_billable_nights recomputed via variant forward_projected"
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /ryhs/admissions/{id}/extend (self-loop, second extension)"
        actor: ShelterCaseManager
        preconditions:
          - "extension_count < MAX_EXTENSIONS (2)"
          - "the extended projected_billable_nights <= program.max_stay_nights"
        side_effects:
          - "planned_discharge_at = new_planned_discharge_at; extension_count += 1; projected_billable_nights recomputed"
      - from: ACTIVE
        to: DISCHARGE_SCHEDULED
        trigger: "system: the youth's ReunificationCase reaches APPROVED"
        actor: system
        preconditions:
          - "Admission.status IN {ACTIVE, EXTENDED}"
        side_effects:
          - "the bed is still held, so program.occupied_beds is unchanged"
          - "this admission's GuardianNotification, if status IN {PENDING, ATTEMPTED, OVERDUE}, transitions to WAIVED with waiver_reason = COURT_ORDER, resolved_at = clock (fourth hop of the approval cascade), which forces program.overdue_notification_count and program.posture to be recomputed"
      - from: EXTENDED
        to: DISCHARGE_SCHEDULED
        trigger: "system: the youth's ReunificationCase reaches APPROVED"
        actor: system
        preconditions:
          - "Admission.status IN {ACTIVE, EXTENDED}"
        side_effects:
          - "identical to ACTIVE -> DISCHARGE_SCHEDULED"
      - from: DISCHARGE_SCHEDULED
        to: ACTIVE
        trigger: "system: the APPROVED case is superseded by a newer ReunificationCase"
        actor: system
        preconditions:
          - "Admission.status == DISCHARGE_SCHEDULED"
        side_effects:
          - "no bed accounting change; the WAIVED GuardianNotification is NOT reopened"
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /ryhs/admissions/{id}/discharge"
        actor: ShelterCaseManager
        preconditions:
          - "Admission.status IN {ACTIVE, EXTENDED, DISCHARGE_SCHEDULED}"
          - "the admission's GuardianNotification is NOT in status OVERDUE, or a runaway report has already been filed (runaway_report_filed_at is not null)"
        side_effects:
          - "cascade hop 1: discharged_at = clock; exit_destination stored; final_billable_nights = calculations.admission_billable_nights variant chronological_actual; outcome_positive derived; Youth.cumulative_shelter_nights += final_billable_nights; Youth.status -> REUNIFIED or EXITED"
          - "cascade hop 2: because the admission left {ACTIVE, EXTENDED, DISCHARGE_SCHEDULED}, program.occupied_beds -= 1"
          - "cascade hop 3: because occupied_beds changed, program.utilization_bp and program.posture are recomputed via calculations.program_posture"
          - "cascade hop 4: because the posture left FROZEN, the waitlist selector promotes exactly one WAITLISTED admission of that program to ACTIVE (see WAITLISTED -> ACTIVE), which itself re-increments occupied_beds and re-recomputes the posture"
          - "cascade hop 5: the promoted admission's own GuardianNotification row is created PENDING, which flips that youth's risk_posture to RESTRICTED"
      - from: EXTENDED
        to: DISCHARGED
        trigger: "POST /ryhs/admissions/{id}/discharge"
        actor: ShelterCaseManager
        preconditions:
          - "same as ACTIVE -> DISCHARGED"
        side_effects:
          - "same five-hop cascade as ACTIVE -> DISCHARGED"
      - from: DISCHARGE_SCHEDULED
        to: DISCHARGED
        trigger: "POST /ryhs/admissions/{id}/discharge"
        actor: ShelterCaseManager
        preconditions:
          - "same as ACTIVE -> DISCHARGED"
        side_effects:
          - "same five-hop cascade as ACTIVE -> DISCHARGED"
          - "if exit_destination == FAMILY_REUNIFIED then the youth's APPROVED or AFTERCARE ReunificationCase is untouched and Youth.status -> REUNIFIED"

  - entity: GuardianNotification
    initial_state: PENDING
    terminal_states: [CONTACTED, WAIVED, LAW_ENFORCEMENT_REPORTED]
    transitions:
      - from: PENDING
        to: ATTEMPTED
        trigger: "POST /ryhs/guardian-notifications/{id}/attempt"
        actor: ShelterCaseManager
        preconditions:
          - "status IN {PENDING, ATTEMPTED, OVERDUE}"
        side_effects:
          - "attempt_count += 1; last_attempt_at = clock; attempt_channel stored"
      - from: ATTEMPTED
        to: ATTEMPTED
        trigger: "POST /ryhs/guardian-notifications/{id}/attempt (self-loop, repeat attempt)"
        actor: ShelterCaseManager
        preconditions:
          - "status == ATTEMPTED"
        side_effects:
          - "attempt_count += 1; last_attempt_at = clock; attempt_channel overwritten"
      - from: PENDING
        to: OVERDUE
        trigger: "POST /_ops/nightly-census"
        actor: system
        preconditions:
          - "clock > due_at"
          - "status IN {PENDING, ATTEMPTED}"
        side_effects:
          - "program.overdue_notification_count += 1, which forces program.posture to be recomputed via calculations.program_posture (a second OVERDUE row on the same program drives posture to FROZEN)"
          - "Youth.risk_posture recomputed (stays RESTRICTED)"
      - from: ATTEMPTED
        to: OVERDUE
        trigger: "POST /_ops/nightly-census"
        actor: system
        preconditions:
          - "clock > due_at"
        side_effects:
          - "same as PENDING -> OVERDUE"
      - from: ATTEMPTED
        to: CONTACTED
        trigger: "POST /ryhs/guardian-notifications/{id}/resolve with outcome == CONTACTED"
        actor: ShelterCaseManager
        preconditions:
          - "attempt_count >= 1"
          - "the youth's risk_posture != FROZEN (an ESCALATED screening forbids guardian contact)"
        side_effects:
          - "resolved_at = clock; resolving_user_id = X-User-ID"
          - "Youth.risk_posture recomputed; with no unresolved obligation left it drops to OPEN, which unblocks POST /ryhs/tlp-placements"
      - from: OVERDUE
        to: CONTACTED
        trigger: "POST /ryhs/guardian-notifications/{id}/resolve with outcome == CONTACTED"
        actor: ShelterCaseManager
        preconditions:
          - "attempt_count >= 1"
          - "the youth's risk_posture != FROZEN"
        side_effects:
          - "resolved_at = clock; program.overdue_notification_count -= 1, which forces program.posture to be recomputed"
          - "Youth.risk_posture recomputed"
      - from: PENDING
        to: WAIVED
        trigger: "POST /ryhs/guardian-notifications/{id}/resolve with outcome == WAIVED"
        actor: ProgramAdmin
        preconditions:
          - "waiver_reason is supplied"
          - "X-User-ID != the Admission's admitting_user_id (segregation of duties)"
        side_effects:
          - "resolved_at = clock; resolving_user_id = X-User-ID"
          - "Youth.risk_posture recomputed and drops to OPEN unless a screening keeps it FROZEN"
      - from: ATTEMPTED
        to: WAIVED
        trigger: "POST /ryhs/guardian-notifications/{id}/resolve with outcome == WAIVED"
        actor: ProgramAdmin
        preconditions:
          - "waiver_reason is supplied"
          - "X-User-ID != the Admission's admitting_user_id"
        side_effects:
          - "same as PENDING -> WAIVED"
      - from: OVERDUE
        to: WAIVED
        trigger: "POST /ryhs/guardian-notifications/{id}/resolve with outcome == WAIVED"
        actor: ProgramAdmin
        preconditions:
          - "waiver_reason is supplied"
          - "X-User-ID != the Admission's admitting_user_id"
        side_effects:
          - "resolved_at = clock; program.overdue_notification_count -= 1 -> program.posture recomputed"
      - from: PENDING
        to: WAIVED
        trigger: "system: the youth's ReunificationCase reaches APPROVED"
        actor: system
        preconditions:
          - "status IN {PENDING, ATTEMPTED, OVERDUE}"
        side_effects:
          - "waiver_reason = COURT_ORDER; resolved_at = clock; resolving_user_id = the case's decision_user_id"
          - "if the row was OVERDUE then program.overdue_notification_count -= 1 -> program.posture recomputed"
      - from: OVERDUE
        to: LAW_ENFORCEMENT_REPORTED
        trigger: "POST /ryhs/guardian-notifications/{id}/resolve with outcome == LAW_ENFORCEMENT_REPORTED"
        actor: ShelterCaseManager
        preconditions:
          - "status == OVERDUE"
          - "attempt_count >= 1"
        side_effects:
          - "runaway_report_filed_at = clock; resolved_at = clock"
          - "program.overdue_notification_count -= 1 -> program.posture recomputed"
          - "the admission's discharge gate is satisfied from now on (validations priority 21 passes)"

  - entity: SafetyScreening
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /ryhs/safety-screenings/{id}/disposition with disposition == CLEARED"
        actor: ProgramAdmin
        preconditions:
          - "X-User-ID != screener_user_id (segregation of duties)"
          - "tier != CRITICAL"
        side_effects:
          - "disposition_user_id = X-User-ID; specialized_response_code stored"
          - "Youth.risk_posture recomputed"
          - "cascade: the youth's oldest Admission with status == PENDING_SCREENING (created_at ASC) transitions to ACTIVE, which increments program.occupied_beds and recomputes program.posture, and creates that admission's GuardianNotification"
      - from: SUBMITTED
        to: ESCALATED
        trigger: "POST /ryhs/safety-screenings/{id}/disposition with disposition == ESCALATED"
        actor: ProgramAdmin
        preconditions:
          - "specialized_response_code != NONE"
          - "X-User-ID != screener_user_id"
        side_effects:
          - "disposition_user_id = X-User-ID"
          - "Youth.risk_posture -> FROZEN, which blocks POST /ryhs/reunification-cases and guardian CONTACTED resolutions for that youth"
      - from: ESCALATED
        to: CLEARED
        trigger: "POST /ryhs/safety-screenings/{id}/disposition with disposition == CLEARED"
        actor: ProgramAdmin
        preconditions:
          - "specialized_response_code on the ESCALATED row is not NONE (a specialized response ran)"
          - "tier != CRITICAL"
          - "X-User-ID != screener_user_id"
        side_effects:
          - "Youth.risk_posture recomputed and leaves FROZEN"
          - "cascade: same PENDING_SCREENING admission activation as SUBMITTED -> CLEARED"
      - from: CLEARED
        to: ESCALATED
        trigger: "POST /ryhs/safety-screenings/{id}/disposition with disposition == ESCALATED"
        actor: ProgramAdmin
        preconditions:
          - "specialized_response_code != NONE"
          - "X-User-ID != screener_user_id"
        side_effects:
          - "Youth.risk_posture -> FROZEN"
        note: "CLEARED <-> ESCALATED is a genuine cycle: a screening may be re-escalated when new indicators surface, and re-cleared after the specialized response completes."

  - entity: ReunificationCase
    initial_state: OPENED
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: OPENED
        to: MEDIATION_SCHEDULED
        trigger: "POST /ryhs/reunification-cases/{id}/mediation-sessions"
        actor: ReunificationSpecialist
        preconditions:
          - "status IN {OPENED, MEDIATION_HELD}"
          - "mediation_round < max_mediation_rounds"
          - "scheduled window satisfies validations priorities 28 and 29 (closed-interval overlap and 72h cooldown)"
        side_effects:
          - "a MediationSession row is created with round_number = mediation_round + 1, outcome null"
      - from: MEDIATION_SCHEDULED
        to: MEDIATION_HELD
        trigger: "POST /ryhs/mediation-sessions/{id}/record-outcome"
        actor: ReunificationSpecialist
        preconditions:
          - "the session's outcome is null"
          - "clock >= session.scheduled_start_at"
        side_effects:
          - "session.outcome stored; session.held_at = clock; session.recorded_by_user_id = X-User-ID"
          - "case.mediation_round += 1"
      - from: MEDIATION_HELD
        to: MEDIATION_SCHEDULED
        trigger: "POST /ryhs/reunification-cases/{id}/mediation-sessions (next round)"
        actor: ReunificationSpecialist
        preconditions:
          - "mediation_round < max_mediation_rounds"
          - "scheduled_start_at >= latest held session.held_at + MEDIATION_COOLDOWN_HOURS (72)"
        side_effects:
          - "a MediationSession row is created with round_number = mediation_round + 1"
        note: "This is the negotiation loop MEDIATION_HELD -> MEDIATION_SCHEDULED -> MEDIATION_HELD, bounded by max_mediation_rounds = 3."
      - from: MEDIATION_HELD
        to: HOME_ASSESSMENT
        trigger: "POST /ryhs/reunification-cases/{id}/home-assessment"
        actor: ReunificationSpecialist
        preconditions:
          - "status == MEDIATION_HELD"
          - "the latest held session's outcome IN {PROGRESS, AGREEMENT}"
        side_effects:
          - "safety_assessment_result stored"
      - from: HOME_ASSESSMENT
        to: APPROVED
        trigger: "POST /ryhs/reunification-cases/{id}/decision with decision == APPROVE"
        actor: ReunificationSpecialist
        preconditions:
          - "safety_assessment_result IN {SAFE, CONDITIONAL}"
          - "youth.risk_posture != FROZEN"
          - "every GuardianNotification of the youth's ACTIVE/EXTENDED admissions is resolvable (see validations priority 23)"
          - "X-User-ID != the latest held MediationSession.recorded_by_user_id (segregation of duties)"
        side_effects:
          - "cascade hop 1: aftercare_plan_due_at = clock + AFTERCARE_PLAN_HOURS (72); decision_user_id = X-User-ID"
          - "cascade hop 2: because the case became APPROVED, Youth.status -> REUNIFIED_PENDING and Youth.risk_posture is recomputed"
          - "cascade hop 3: because Youth.status became REUNIFIED_PENDING, every Admission of the youth with status IN {ACTIVE, EXTENDED} transitions to DISCHARGE_SCHEDULED"
          - "cascade hop 4: because that admission left ACTIVE/EXTENDED, its GuardianNotification with status IN {PENDING, ATTEMPTED, OVERDUE} transitions to WAIVED with waiver_reason COURT_ORDER, which recomputes program.overdue_notification_count and program.posture"
      - from: HOME_ASSESSMENT
        to: DECLINED
        trigger: "POST /ryhs/reunification-cases/{id}/decision with decision == DECLINE"
        actor: ReunificationSpecialist
        preconditions:
          - "X-User-ID != the latest held MediationSession.recorded_by_user_id"
        side_effects:
          - "decision_user_id = X-User-ID; aftercare_plan_due_at stays null"
          - "Youth.status is NOT changed; no admission or notification is touched"
        note: "Divergent branch: APPROVE fires a four-hop cascade, DECLINE fires none. This is the fork-join divergence required of a branching machine."
      - from: APPROVED
        to: AFTERCARE
        trigger: "POST /ryhs/reunification-cases/{id}/aftercare-contacts"
        actor: ReunificationSpecialist
        preconditions:
          - "status IN {APPROVED, AFTERCARE}"
          - "clock <= aftercare_plan_due_at for the FIRST contact"
        side_effects:
          - "aftercare_contacts_completed += 1"
      - from: AFTERCARE
        to: AFTERCARE
        trigger: "POST /ryhs/reunification-cases/{id}/aftercare-contacts (self-loop)"
        actor: ReunificationSpecialist
        preconditions:
          - "aftercare_contacts_completed < AFTERCARE_CONTACTS_REQUIRED (3)"
        side_effects:
          - "aftercare_contacts_completed += 1"
      - from: AFTERCARE
        to: CLOSED
        trigger: "POST /ryhs/reunification-cases/{id}/aftercare-contacts (third contact)"
        actor: ReunificationSpecialist
        preconditions:
          - "aftercare_contacts_completed == AFTERCARE_CONTACTS_REQUIRED - 1 (i.e. this call is the third)"
        side_effects:
          - "aftercare_contacts_completed = 3; closed_at = clock"
      - from: DECLINED
        to: CLOSED
        trigger: "POST /_ops/nightly-census"
        actor: system
        preconditions:
          - "clock - updated_at >= CASE_CLOSE_LAG_HOURS (168)"
        side_effects:
          - "closed_at = clock"
      - from: OPENED
        to: SUPERSEDED
        trigger: "POST /ryhs/reunification-cases (a newer case for the same youth)"
        actor: ReunificationSpecialist
        preconditions:
          - "status NOT IN {CLOSED, SUPERSEDED}"
        side_effects:
          - "closed_at = clock; every scheduled MediationSession of this case keeps outcome null and can never be recorded"
      - from: MEDIATION_SCHEDULED
        to: SUPERSEDED
        trigger: "POST /ryhs/reunification-cases (a newer case for the same youth)"
        actor: ReunificationSpecialist
        preconditions:
          - "status NOT IN {CLOSED, SUPERSEDED}"
        side_effects:
          - "closed_at = clock"
      - from: MEDIATION_HELD
        to: SUPERSEDED
        trigger: "POST /ryhs/reunification-cases (a newer case for the same youth)"
        actor: ReunificationSpecialist
        preconditions:
          - "status NOT IN {CLOSED, SUPERSEDED}"
        side_effects:
          - "closed_at = clock"
      - from: HOME_ASSESSMENT
        to: SUPERSEDED
        trigger: "POST /ryhs/reunification-cases (a newer case for the same youth)"
        actor: ReunificationSpecialist
        preconditions:
          - "status NOT IN {CLOSED, SUPERSEDED}"
        side_effects:
          - "closed_at = clock"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /ryhs/reunification-cases (a newer case for the same youth)"
        actor: ReunificationSpecialist
        preconditions:
          - "status IN {APPROVED, AFTERCARE}"
        side_effects:
          - "closed_at = clock; Youth.status REUNIFIED_PENDING -> SHELTERED; every DISCHARGE_SCHEDULED admission of the youth reverts to ACTIVE"
      - from: AFTERCARE
        to: SUPERSEDED
        trigger: "POST /ryhs/reunification-cases (a newer case for the same youth)"
        actor: ReunificationSpecialist
        preconditions:
          - "status IN {APPROVED, AFTERCARE}"
        side_effects:
          - "same as APPROVED -> SUPERSEDED"

  - entity: TlpPlacement
    initial_state: PLACED
    terminal_states: [EXITED]
    transitions:
      - from: PLACED
        to: NOTICE_GIVEN
        trigger: "POST /_ops/nightly-census"
        actor: system
        preconditions:
          - "tenancy_status == PLACED"
          - "days_elapsed >= allowance_days - NOTICE_LEAD_DAYS (30)"
        side_effects:
          - "no change to compliance_status; the savings dimension keeps evolving independently"
      - from: PLACED
        to: NOTICE_GIVEN
        trigger: "POST /ryhs/tlp-placements/{id}/compliance-review (second consecutive PROBATION review)"
        actor: TlpCoordinator
        preconditions:
          - "tenancy_status == PLACED"
          - "consecutive_probation_reviews reaches 2"
        side_effects:
          - "tenancy_status -> NOTICE_GIVEN while compliance_status stays PROBATION"
        note: "The only coupling between the two dimensions: two consecutive PROBATION reviews give notice. The reverse never holds - a tenancy change never alters compliance_status."
      - from: PLACED
        to: EXITED
        trigger: "POST /ryhs/tlp-placements/{id}/exit"
        actor: TlpCoordinator
        preconditions:
          - "tenancy_status IN {PLACED, NOTICE_GIVEN}"
        side_effects:
          - "exited_at = clock; exit_reason stored; program.occupied_beds -= 1 -> program.utilization_bp and program.posture recomputed"
          - "Youth.status TLP_ENROLLED -> EXITED, increments Youth.version by 1"
          - "compliance_status is frozen at its current value and no longer reviewable"
      - from: NOTICE_GIVEN
        to: EXITED
        trigger: "POST /ryhs/tlp-placements/{id}/exit"
        actor: TlpCoordinator
        preconditions:
          - "tenancy_status == NOTICE_GIVEN"
        side_effects:
          - "same as PLACED -> EXITED"
      - from: NOTICE_GIVEN
        to: EXITED
        trigger: "POST /_ops/nightly-census"
        actor: system
        preconditions:
          - "days_elapsed >= allowance_days"
        side_effects:
          - "exit_reason = DURATION_LIMIT; exited_at = clock; program.occupied_beds -= 1 -> program.posture recomputed; Youth.status -> EXITED"
      - from: IN_COMPLIANCE
        to: SAVINGS_DEFICIENT
        trigger: "POST /ryhs/tlp-placements/{id}/compliance-review"
        actor: TlpCoordinator
        preconditions:
          - "tenancy_status != EXITED"
          - "savings_balance_cents < required_savings_cents AND savings_balance_cents >= floor(required_savings_cents / 2)"
        side_effects:
          - "consecutive_probation_reviews = 0; tenancy_status unchanged"
        note: "compliance_status is the SECOND, independent dimension of this entity. The from/to values in this block belong to compliance_status, not tenancy_status."
      - from: IN_COMPLIANCE
        to: PROBATION
        trigger: "POST /ryhs/tlp-placements/{id}/compliance-review"
        actor: TlpCoordinator
        preconditions:
          - "savings_balance_cents < floor(required_savings_cents / 2)"
        side_effects:
          - "consecutive_probation_reviews += 1; withdrawals are blocked from now on with ERR_SAVINGS_WITHDRAWAL_BLOCKED"
      - from: SAVINGS_DEFICIENT
        to: IN_COMPLIANCE
        trigger: "POST /ryhs/tlp-placements/{id}/compliance-review"
        actor: TlpCoordinator
        preconditions:
          - "savings_balance_cents >= required_savings_cents"
        side_effects:
          - "consecutive_probation_reviews = 0"
      - from: SAVINGS_DEFICIENT
        to: PROBATION
        trigger: "POST /ryhs/tlp-placements/{id}/compliance-review"
        actor: TlpCoordinator
        preconditions:
          - "savings_balance_cents < floor(required_savings_cents / 2)"
        side_effects:
          - "consecutive_probation_reviews += 1"
      - from: PROBATION
        to: IN_COMPLIANCE
        trigger: "POST /ryhs/tlp-placements/{id}/compliance-review"
        actor: TlpCoordinator
        preconditions:
          - "savings_balance_cents >= required_savings_cents"
        side_effects:
          - "consecutive_probation_reviews = 0; withdrawals are unblocked"
        note: "PROBATION -> IN_COMPLIANCE -> PROBATION is a genuine cycle on the compliance dimension."
      - from: PROBATION
        to: SAVINGS_DEFICIENT
        trigger: "POST /ryhs/tlp-placements/{id}/compliance-review"
        actor: TlpCoordinator
        preconditions:
          - "savings_balance_cents < required_savings_cents AND savings_balance_cents >= floor(required_savings_cents / 2)"
        side_effects:
          - "consecutive_probation_reviews = 0; withdrawals are unblocked"

  - entity: GovernanceProposal
    initial_state: OPEN_FOR_VOTE
    terminal_states: [ADOPTED, REJECTED]
    transitions:
      - from: OPEN_FOR_VOTE
        to: ADOPTED
        trigger: "POST /ryhs/governance-proposals/{id}/close-vote"
        actor: ProgramAdmin
        preconditions:
          - "eligible_electorate_size > 0 (an empty electorate is rejected with ERR_NO_ELIGIBLE_ELECTORATE and leaves the proposal OPEN_FOR_VOTE)"
          - "support_ratio_bp >= ADOPTION_RATIO_BP (5000)"
          - "support_vote_count >= ADOPTION_MIN_SUPPORT (2)"
        side_effects:
          - "eligible_electorate_size and support_ratio_bp frozen onto the row; adopted_at = clock; decided_by_user_id = X-User-ID"
      - from: OPEN_FOR_VOTE
        to: REJECTED
        trigger: "POST /ryhs/governance-proposals/{id}/close-vote"
        actor: ProgramAdmin
        preconditions:
          - "eligible_electorate_size > 0"
          - "support_ratio_bp < ADOPTION_RATIO_BP OR support_vote_count < ADOPTION_MIN_SUPPORT"
        side_effects:
          - "eligible_electorate_size and support_ratio_bp frozen onto the row; adopted_at stays null"

concurrency_rules:
  - rule_id: case-open-stale-youth
    parent_entity: Youth
    write_endpoint: "POST /ryhs/reunification-cases"
    occ_field: "expected_youth_version"
    description: |
      Opening a ReunificationCase against a Youth whose version has advanced since
      the client last observed it is rejected with a stale-version error. A new case
      legitimately supersedes any earlier non-terminal case for that youth (see
      state_machines.ReunificationCase OPENED -> SUPERSEDED), so a second sequential
      open would otherwise succeed and silently discard mediation history the client
      never saw. The OCC check turns that into a deterministic 412 whenever the
      caller's view of the youth is out of date.
    error_id: ERR_STALE_YOUTH_VERSION
    http_status: 412
  - rule_id: savings-entry-stale-placement
    parent_entity: TlpPlacement
    write_endpoint: "POST /ryhs/tlp-placements/{id}/savings-entries"
    occ_field: "expected_placement_version"
    description: |
      Posting a savings entry against a TlpPlacement whose version has advanced since
      the client last read it is rejected with a stale-version error. Deposits are
      inherently repeatable - a second identical deposit is a legitimate business
      operation, not a state violation - so no state precondition can catch a caller
      that is posting against an out-of-date balance, compliance_status or
      match_awarded_cents. The OCC check on the placement version is the only guard.
    error_id: ERR_STALE_PLACEMENT_VERSION
    http_status: 412

calculations:
  - name: youth_age_years
    trigger: "on every read of a Youth row and on every gate that names youth.age_years (POST /ryhs/admissions, POST /ryhs/tlp-placements)"
    algorithm: threshold
    formula: |
      clock  = logical clock (UTC), default 2026-08-01T00:00:00Z until POST /_clock/set_current_utc moves it
      dob    = date_of_birth (calendar date, no time component)
      had_birthday = (clock.month, clock.day) >= (dob.month, dob.day)
      age_years = clock.year - dob.year - (0 if had_birthday else 1)
    input_set: "the Youth row and the logical clock only; no other entity participates"
    constants:
      DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
    precision: "whole years, floor semantics; the birthday itself counts as the new age (>=, not >)"

  - name: admission_billable_nights
    trigger: "variant forward_projected on POST /ryhs/admissions success, on WAITLISTED -> ACTIVE promotion and on POST /ryhs/admissions/{id}/extend; variant chronological_actual on POST /ryhs/admissions/{id}/discharge"
    algorithm: chronological
    formula: |
      date(t) = the UTC calendar date of instant t
      day_span(a, b) = number of whole calendar days from date(a) to date(b) = (date(b) - date(a)).days

      variant forward_projected  ->  Admission.projected_billable_nights
        projected_billable_nights = day_span(admitted_at, planned_discharge_at)
        # the planned discharge DATE is never itself a billable night, and the
        # clock-time component of either instant is ignored entirely.

      variant chronological_actual  ->  Admission.final_billable_nights
        base = day_span(admitted_at, discharged_at)
        final_billable_nights = base + (1 if hour(discharged_at) >= NOON_CUTOFF_UTC_HOUR else 0)
        # a youth still in the bed at or after 12:00:00Z on the discharge date has
        # occupied that night's bed for federal reporting purposes.

      Youth.cumulative_shelter_nights += final_billable_nights at discharge time.
    input_set: "one Admission row; admitted_at is the promotion instant for admissions that passed through WAITLISTED, never requested_at"
    constants:
      NOON_CUTOFF_UTC_HOUR: 12
    precision: "integer nights, no rounding; both variants are pure calendar arithmetic"
    variants:
      - name: forward_projected
        when: "at admission, at waitlist promotion and after every extension - the only value available before the youth actually leaves"
        difference: "counts the interval admitted_at -> planned_discharge_at and ignores clock times entirely, so it can never award the noon-cutoff night"
      - name: chronological_actual
        when: "at discharge, and the only variant that reaches the federal report"
        difference: "counts the interval admitted_at -> discharged_at and adds one night when the discharge instant is at or after 12:00:00Z; for a youth discharged on the planned date at 15:00Z it is exactly projected + 1"

  - name: trafficking_risk_score
    trigger: "variant screening_time on POST /ryhs/youths/{id}/safety-screenings; variant outreach_history on POST /ryhs/youths/{id}/outreach-contacts and on POST /_ops/nightly-census"
    algorithm: weighted_scoring
    formula: |
      INDICATOR_WEIGHTS = { THIRD_PARTY_CONTROL: 30, QUOTA_DEBT: 25, COMMERCIAL_SEX: 40,
                            DOCUMENT_WITHHELD: 20, RECRUITER_PRESENT: 15, CURFEW_ENFORCED: 10 }
      raw(codes) = sum(INDICATOR_WEIGHTS[c] for c in distinct(codes))

      variant screening_time  ->  SafetyScreening.score
        score = min(100, raw(screening.indicator_codes))

      variant outreach_history  ->  Youth.trafficking_risk_score
        total = 0
        for contact in OutreachContact rows of this youth ordered by created_at ASC:
            age_days   = floor((clock - contact.contacted_at) / 86400 seconds)
            weeks      = floor(age_days / 7)
            decay_pct  = max(0, 100 - DECAY_PCT_PER_WEEK * weeks)
            total     += floor(raw(contact.indicator_flags) * decay_pct / 100)
        trafficking_risk_score = min(100, total)

      tier(score) = CRITICAL if score >= CRITICAL_THRESHOLD
                    ELEVATED if score >= ELEVATED_THRESHOLD
                    LOW      otherwise
      SafetyScreening.tier uses the screening_time score; Youth.trafficking_risk_tier uses the outreach_history score.
    input_set: "screening_time reads exactly one SafetyScreening row; outreach_history reads every OutreachContact row of the youth with no status filter (contacts are immutable and never excluded) plus the logical clock"
    constants:
      DECAY_PCT_PER_WEEK: 10
      ELEVATED_THRESHOLD: 30
      CRITICAL_THRESHOLD: 60
    precision: "integer points; per-contact decay is floored BEFORE summation, never after - summing raw scores and decaying the total is the rejected alternative"
    variants:
      - name: screening_time
        when: "a screener submits indicators; the number is frozen onto the SafetyScreening row and never re-decayed"
        difference: "undecayed snapshot of one indicator set; gates the disposition (tier == CRITICAL forbids CLEARED)"
      - name: outreach_history
        when: "the youth-level standing risk figure, recomputed on every outreach contact and every census"
        difference: "decays each contact's contribution by 10 percentage points per completed week and floors per contact before summing, so identical indicator sets score strictly lower than the screening variant once any contact is at least 7 days old; this is the number that feeds admission_priority_score and youth_risk_posture"

  - name: savings_match_award
    trigger: "on POST /ryhs/tlp-placements/{id}/savings-entries for every entry_type"
    algorithm: aggregation
    formula: |
      rate_bp = the placement's program.savings_match_rate_bp

      per-entry:
        DEPOSIT:     signed_amount_cents = +amount_cents
                     match_component_cents = +round_half_up(amount_cents * rate_bp / 10000)
        REVERSAL:    signed_amount_cents = -amount_cents
                     match_component_cents = -round_half_up(amount_cents * rate_bp / 10000)
        WITHDRAWAL:  signed_amount_cents = -amount_cents
                     match_component_cents = 0

      # PINNED ROUNDING ORDER: round each entry's match to whole cents FIRST, then sum.
      raw_match = sum(match_component_cents over every SavingsLedgerEntry of the placement)
      match_awarded_cents = min(MATCH_CAP_CENTS, max(0, raw_match))
      savings_balance_cents = sum(signed_amount_cents over every entry) + match_awarded_cents
      balance_after_cents on the new entry = savings_balance_cents immediately after it posted
      Youth.lifetime_savings_deposited_cents = sum(amount_cents of DEPOSIT entries) - sum(amount_cents of REVERSAL entries)
                                               over every placement of that youth

      REJECTED ALTERNATIVE (produces different cents): round_half_up(sum(deposit amount_cents) * rate_bp / 10000).
      With rate_bp = 2500 and three deposits of 1010 cents the pinned order yields 253+253+253 = 759
      while the rejected order yields round_half_up(3030 * 0.25) = round_half_up(757.5) = 758.
    input_set: "every SavingsLedgerEntry of the placement, no status filter (entries are immutable); the cap is applied to the summed per-entry matches, and surplus above the cap is never carried forward"
    constants:
      MATCH_CAP_CENTS: 50000
    precision: "whole cents, round_half_up per entry; the cap comparison happens after summation"

  - name: required_savings
    trigger: "on POST /ryhs/tlp-placements/{id}/compliance-review and on every read of a TlpPlacement row"
    algorithm: threshold
    formula: |
      months_elapsed_full = floor(days_elapsed / DAYS_PER_SAVINGS_MONTH)
      monthly_requirement_cents = floor(documented_monthly_income_cents * program.required_savings_rate_bp / 10000)
      required_savings_cents = monthly_requirement_cents * months_elapsed_full

      review outcome (writes compliance_status):
        savings_balance_cents >= required_savings_cents                      -> IN_COMPLIANCE
        savings_balance_cents >= floor(required_savings_cents / 2)            -> SAVINGS_DEFICIENT
        otherwise                                                            -> PROBATION
    input_set: "one TlpPlacement row, its program's required_savings_rate_bp, and savings_balance_cents from savings_match_award"
    constants:
      DAYS_PER_SAVINGS_MONTH: 30
    precision: "whole cents, floor at both the monthly-requirement step and the half-requirement step; the >= comparisons are inclusive so an exactly-met requirement is IN_COMPLIANCE"

  - name: tlp_duration_allowance
    trigger: "on POST /ryhs/tlp-placements, on POST /ryhs/tlp-placements/{id}/life-skills-completions, on POST /_ops/nightly-census and on every read of a TlpPlacement row"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 - consumed ratio, computed against the BASE allowance only.
      base_allowance_days = program.max_placement_days   (copied at placement time)
      consumed_ratio_bp   = floor(days_elapsed * 10000 / base_allowance_days)

      # STEP 2 - life-skills bonus, then the late-stage haircut keyed on STEP 1's ratio.
      hours = life_skills_credit_hours
      milestone_bonus = 90 if hours >= 60
                        60 if hours >= 40
                        30 if hours >= 20
                        0  otherwise
      earned_bonus_days = floor(milestone_bonus / 2) if consumed_ratio_bp >= HAIRCUT_RATIO_BP else milestone_bonus

      # STEP 3 - final allowance.
      allowance_days = base_allowance_days + earned_bonus_days

      # The dependency LOOKS circular: allowance_days depends on earned_bonus_days, which
      # depends on consumed_ratio_bp, which is a ratio of elapsed days to an allowance.
      # The order above is PINNED: STEP 1 always divides by base_allowance_days.
      # REJECTED ALTERNATIVE: recomputing consumed_ratio_bp against allowance_days after
      # STEP 3, which would drop the ratio below HAIRCUT_RATIO_BP and hand back the full
      # bonus. For base 540, days_elapsed 420 and hours 40 the pinned order gives
      # ratio 7777 -> haircut -> bonus 30 -> allowance 570, while the rejected order gives
      # bonus 60 -> allowance 600 -> ratio 7000 -> no haircut -> allowance 600.
    input_set: "one TlpPlacement row, its LifeSkillsCompletion rows (all of them; completions are immutable), and its program's max_placement_days"
    constants:
      HAIRCUT_RATIO_BP: 7500
      NOTICE_LEAD_DAYS: 30
    precision: "whole days, floor at the ratio step and at the haircut step"

  - name: admission_priority_score
    trigger: "on POST /ryhs/admissions (frozen onto the row) and re-read by the waitlist selector at promotion time"
    algorithm: weighted_scoring
    formula: |
      age_component        = max(0, (ADULT_AGE - youth.age_years)) * AGE_WEIGHT
      risk_component       = min(RISK_CAP, youth.trafficking_risk_score)
      engagement_component = min(ENGAGEMENT_CAP, youth.engagement_contact_count * ENGAGEMENT_STEP)
      exposure_component   = EXPOSURE_BASE if youth.cumulative_shelter_nights == 0
                             else max(0, EXPOSURE_BASE - youth.cumulative_shelter_nights)
      subtotal = age_component + risk_component + engagement_component + exposure_component
      subtotal = subtotal + CRITICAL_BUMP if youth.trafficking_risk_tier == CRITICAL else subtotal
      priority_score = min(100, subtotal)
    input_set: "one Youth row as it stands at admission-request time; the score is frozen onto the Admission and is NOT recomputed when the youth's fields later change"
    constants:
      ADULT_AGE: 18
      AGE_WEIGHT: 4
      RISK_CAP: 40
      ENGAGEMENT_CAP: 20
      ENGAGEMENT_STEP: 5
      EXPOSURE_BASE: 15
      CRITICAL_BUMP: 10
      RESTRICTED_PRIORITY_FLOOR: 60
    precision: "integer points; nested min/max are evaluated innermost-first and the CRITICAL bump is applied before the final min(100, .) clamp"

  - name: program_posture
    trigger: "on every mutation of ShelterProgram.occupied_beds or ShelterProgram.overdue_notification_count, and on POST /_ops/nightly-census"
    algorithm: threshold
    formula: |
      occupied_beds =
        if program_type == EMERGENCY_SHELTER:
           count(Admission where program_id == P and status IN {ACTIVE, EXTENDED, DISCHARGE_SCHEDULED})
        if program_type == TRANSITIONAL_LIVING:
           count(TlpPlacement where program_id == P and tenancy_status IN {PLACED, NOTICE_GIVEN})
      waitlisted_count          = count(Admission where program_id == P and status == WAITLISTED)
      overdue_notification_count = count(GuardianNotification where status == OVERDUE
                                         and its Admission.program_id == P)
      utilization_bp = floor(occupied_beds * 10000 / licensed_bed_capacity)

      posture = FROZEN     if occupied_beds >= licensed_bed_capacity
                           or overdue_notification_count >= FROZEN_OVERDUE_COUNT
                RESTRICTED if utilization_bp >= RESTRICTED_UTILIZATION_BP
                           or overdue_notification_count == 1
                OPEN       otherwise

      Gates: FROZEN routes new admissions to WAITLISTED (or to ERR_BED_CAPACITY_EXCEEDED when
      waitlist_opt_out is true) and blocks POST /ryhs/tlp-placements with
      ERR_BED_CAPACITY_EXCEEDED whenever the FROZEN posture comes from occupied_beds >=
      licensed_bed_capacity (validations priority 43); an overdue-driven FROZEN posture leaves
      placements alone. RESTRICTED admits only youth whose priority_score is
      >= RESTRICTED_PRIORITY_FLOOR (60) and otherwise raises ERR_PROGRAM_RESTRICTED_PRIORITY.
    input_set: "all Admission rows of the program with the status filter above, all TlpPlacement rows with the tenancy filter above, and all GuardianNotification rows whose admission belongs to the program"
    constants:
      RESTRICTED_UTILIZATION_BP: 9000
      FROZEN_OVERDUE_COUNT: 2
      RESTRICTED_PRIORITY_FLOOR: 60
    precision: "integer basis points, floor; the utilization comparison is >= so a 10-bed program with 9 beds filled (exactly 9000 bp) is RESTRICTED"

  - name: youth_risk_posture
    trigger: "on every mutation of a SafetyScreening or GuardianNotification touching the youth, on POST /ryhs/youths/{id}/outreach-contacts, and on POST /_ops/nightly-census"
    algorithm: threshold
    formula: |
      latest_screening = the youth's SafetyScreening row with the greatest created_at
                         (tie-break: none needed, one screening per request)
      has_open_obligation = exists GuardianNotification with status IN {PENDING, ATTEMPTED, OVERDUE}
                            whose Admission.youth_id == youth.id

      risk_posture = FROZEN     if latest_screening exists and latest_screening.status == ESCALATED
                     RESTRICTED if has_open_obligation or youth.trafficking_risk_tier == CRITICAL
                     OPEN       otherwise

      Gates: FROZEN blocks POST /ryhs/reunification-cases (ERR_YOUTH_POSTURE_FROZEN), blocks the
      HOME_ASSESSMENT -> APPROVED decision, and blocks resolving a guardian notification as
      CONTACTED (ERR_NOTIFICATION_UNSAFE_CONTACT). RESTRICTED blocks POST /ryhs/tlp-placements
      (ERR_YOUTH_POSTURE_RESTRICTED). Neither posture ever blocks
      POST /ryhs/youths/{id}/education-enrollments - the school-enrollment right of an
      unaccompanied youth is unconditional.
    input_set: "every SafetyScreening row of the youth (latest by created_at wins), every GuardianNotification reachable through the youth's admissions with the status filter above, and youth.trafficking_risk_tier"
    constants: {}
    precision: "enum, evaluated top to bottom; the first matching clause wins"

  - name: governance_adoption_tally
    trigger: "on POST /ryhs/governance-proposals/{id}/close-vote"
    algorithm: threshold
    formula: |
      support_vote_count = count(GovernanceVote where proposal_id == P and stance == SUPPORT and status == COUNTED)
      oppose_vote_count  = count(GovernanceVote where proposal_id == P and stance == OPPOSE  and status == COUNTED)

      eligible_electorate_size = count(Youth Y where Y.governance_vote_eligible == true and (
            exists Admission(youth_id == Y.id, program_id == proposal.program_id,
                             status IN {ACTIVE, EXTENDED, DISCHARGE_SCHEDULED})
         or exists TlpPlacement(youth_id == Y.id, program_id == proposal.program_id,
                                tenancy_status IN {PLACED, NOTICE_GIVEN})))
      # evaluated at close-vote time, then frozen onto the row

      support_ratio_bp = 0 if eligible_electorate_size == 0
                         else floor(support_vote_count * 10000 / eligible_electorate_size)

      eligible_electorate_size == 0                     -> ERR_NO_ELIGIBLE_ELECTORATE (422), no state change
      support_ratio_bp >= ADOPTION_RATIO_BP
        and support_vote_count >= ADOPTION_MIN_SUPPORT  -> ADOPTED
      otherwise                                         -> REJECTED
    input_set: "every COUNTED GovernanceVote of the proposal (RETRACTED votes are excluded) and every Youth resident of the proposal's program per the filter above"
    constants:
      ADOPTION_RATIO_BP: 5000
      ADOPTION_MIN_SUPPORT: 2
    precision: "integer basis points, floor; the ratio comparison is >= so an electorate of 4 with exactly 2 support votes (5000 bp) is ADOPTED"

  - name: federal_compliance_report
    trigger: "on GET /ryhs/shelter-programs/{id}/compliance-report"
    algorithm: aggregation
    formula: |
      discharged = Admission rows where program_id == P and status == DISCHARGED, ordered by created_at ASC
      billable_nights_total     = sum(final_billable_nights over discharged)
      discharged_count          = count(discharged)
      over_limit_admission_count = count(discharged where final_billable_nights > program.max_stay_nights)
      positive_outcome_count    = count(discharged where outcome_positive == true)
      positive_outcome_rate_bp  = 0 if discharged_count == 0
                                  else floor(positive_outcome_count * 10000 / discharged_count)
      average_stay_nights_bp    = 0 if discharged_count == 0
                                  else floor(billable_nights_total * 100 / discharged_count)
      waived_notification_count = count(GuardianNotification with status == WAIVED whose Admission.program_id == P)
      runaway_report_count      = count(GuardianNotification with status == LAW_ENFORCEMENT_REPORTED whose Admission.program_id == P)
      bed_capacity_compliant    = (occupied_beds <= licensed_bed_capacity)
      plus the live fields licensed_bed_capacity, occupied_beds, waitlisted_count,
      utilization_bp, posture and overdue_notification_count copied from the program row.
    input_set: "only DISCHARGED admissions of this program enter the outcome and stay-duration aggregates; ACTIVE, EXTENDED, DISCHARGE_SCHEDULED, WAITLISTED, PENDING_SCREENING and DENIED rows are excluded, and rows of other programs never enter"
    constants: {}
    precision: "integer counts; rates in basis points with floor; average_stay_nights_bp is nights x 100 floored, so 8 nights over 3 discharges is 266"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the six roles declared in the RBAC matrix"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "a YouthMember acts only on its own resources: X-User-ID equals the Youth.id addressed in the path, the youth_id of the GovernanceVote addressed in the path, or the youth the vote is being cast for"
    error_id: ERR_NOT_VOTE_OWNER
    http_status: 403
    applies_to: "GET /ryhs/youths/{id}, GET /ryhs/youths/{id}/governance-votes, POST /ryhs/governance-proposals/{id}/votes, POST /ryhs/governance-votes/{id}/retract"
  - priority: 4
    category: existence
    check: "every id in the path resolves, validated left to right"
    error_id: ERR_YOUTH_NOT_FOUND
    http_status: 404
    applies_to: "all path-templated endpoints; the error_id is the one matching the failing segment: ERR_YOUTH_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_ADMISSION_NOT_FOUND, ERR_SCREENING_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_PROPOSAL_NOT_FOUND, ERR_VOTE_NOT_FOUND"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves, validated in the order the endpoint's input list declares"
    error_id: ERR_YOUTH_NOT_FOUND
    http_status: 404
    applies_to: "POST /ryhs/admissions (youth_id then program_id), POST /ryhs/tlp-placements (youth_id then program_id), POST /ryhs/reunification-cases (youth_id)"
  - priority: 6
    category: business_constraint
    check: "request body shape: required fields present, enum members legal, integers within their declared constraints, arrays free of duplicates and drawn from their declared code sets, datetimes parseable as ISO 8601 UTC, and limit/offset within the pagination defaults"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 7
    category: state
    check: "expected_youth_version equals the current Youth.version"
    error_id: ERR_STALE_YOUTH_VERSION
    http_status: 412
    applies_to: "POST /ryhs/reunification-cases"
  - priority: 8
    category: state
    check: "expected_placement_version equals the current TlpPlacement.version"
    error_id: ERR_STALE_PLACEMENT_VERSION
    http_status: 412
    applies_to: "POST /ryhs/tlp-placements/{id}/savings-entries"
  - priority: 9
    category: state
    check: "the admission is in an operable state for the requested action; this rule is scoped to NON-TERMINAL admissions only (PENDING_SCREENING, WAITLISTED, ACTIVE, EXTENDED, DISCHARGE_SCHEDULED): extend requires status IN {ACTIVE, EXTENDED}; discharge requires status IN {ACTIVE, EXTENDED, DISCHARGE_SCHEDULED}. A DISCHARGED or DENIED admission is out of scope here and is caught by priority 10 instead, so the two errors never shadow each other"
    error_id: ERR_ADMISSION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ryhs/admissions/{id}/extend, POST /ryhs/admissions/{id}/discharge"
  - priority: 10
    category: state
    check: "the admission has not already reached a terminal state (DISCHARGED or DENIED)"
    error_id: ERR_ADMISSION_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /ryhs/admissions/{id}/extend, POST /ryhs/admissions/{id}/discharge"
  - priority: 11
    category: state
    check: "the youth has no other Admission with status IN {ACTIVE, EXTENDED, DISCHARGE_SCHEDULED} at the same program"
    error_id: ERR_YOUTH_ALREADY_SHELTERED
    http_status: 409
    applies_to: "POST /ryhs/admissions"
  - priority: 12
    category: state
    check: "the guardian notification is not already in a terminal status (CONTACTED, WAIVED, LAW_ENFORCEMENT_REPORTED)"
    error_id: ERR_NOTIFICATION_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /ryhs/guardian-notifications/{id}/attempt, POST /ryhs/guardian-notifications/{id}/resolve"
  - priority: 13
    category: state
    check: "the requested screening disposition is a declared transition: SUBMITTED -> {CLEARED, ESCALATED}, ESCALATED -> CLEARED, CLEARED -> ESCALATED; ESCALATED -> ESCALATED and CLEARED -> CLEARED are not"
    error_id: ERR_SCREENING_INVALID_TRANSITION
    http_status: 409
    applies_to: "POST /ryhs/safety-screenings/{id}/disposition"
  - priority: 14
    category: state
    check: "the reunification case is in the state the requested action declares: scheduling requires status IN {OPENED, MEDIATION_HELD}; home-assessment requires MEDIATION_HELD; decision requires HOME_ASSESSMENT; aftercare-contacts requires status IN {APPROVED, AFTERCARE}"
    error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    applies_to: "POST /ryhs/reunification-cases/{id}/mediation-sessions, POST /ryhs/reunification-cases/{id}/home-assessment, POST /ryhs/reunification-cases/{id}/decision, POST /ryhs/reunification-cases/{id}/aftercare-contacts"
  - priority: 15
    category: state
    check: "the mediation session has not already had its outcome recorded (outcome is null) and its case is not SUPERSEDED or CLOSED"
    error_id: ERR_SESSION_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /ryhs/mediation-sessions/{id}/record-outcome"
  - priority: 16
    category: state
    check: "the placement's tenancy_status is not EXITED"
    error_id: ERR_PLACEMENT_ALREADY_EXITED
    http_status: 409
    applies_to: "POST /ryhs/tlp-placements/{id}/savings-entries, POST /ryhs/tlp-placements/{id}/life-skills-completions, POST /ryhs/tlp-placements/{id}/compliance-review, POST /ryhs/tlp-placements/{id}/exit"
  - priority: 17
    category: state
    check: "the proposal is still OPEN_FOR_VOTE"
    error_id: ERR_PROPOSAL_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /ryhs/governance-proposals/{id}/close-vote, POST /ryhs/governance-proposals/{id}/votes, POST /ryhs/governance-votes/{id}/retract"
  - priority: 18
    category: business_safety
    check: "a screening whose tier is CRITICAL may not be dispositioned CLEARED; the specialized response must run and a fresh screening must be submitted"
    error_id: ERR_SCREENING_CRITICAL_TIER
    http_status: 422
    applies_to: "POST /ryhs/safety-screenings/{id}/disposition"
  - priority: 19
    category: business_safety
    check: "the youth's most recent SafetyScreening by created_at DESC does not have status == ESCALATED"
    error_id: ERR_SCREENING_ESCALATED_BLOCKS_ACTION
    http_status: 422
    applies_to: "POST /ryhs/admissions, POST /ryhs/tlp-placements"
  - priority: 20
    category: business_safety
    check: "the youth's risk_posture is not FROZEN"
    error_id: ERR_YOUTH_POSTURE_FROZEN
    http_status: 422
    applies_to: "POST /ryhs/reunification-cases, POST /ryhs/reunification-cases/{id}/decision"
  - priority: 21
    category: business_safety
    check: "the admission's GuardianNotification is not in status OVERDUE unless runaway_report_filed_at is already set - the runaway reporting obligation must be discharged before the youth is"
    error_id: ERR_RUNAWAY_REPORT_REQUIRED
    http_status: 422
    applies_to: "POST /ryhs/admissions/{id}/discharge"
  - priority: 22
    category: business_safety
    check: "a notification may not be resolved as CONTACTED while the youth's risk_posture is FROZEN, and may not be resolved as CONTACTED with attempt_count == 0"
    error_id: ERR_NOTIFICATION_UNSAFE_CONTACT
    http_status: 422
    applies_to: "POST /ryhs/guardian-notifications/{id}/resolve"
  - priority: 23
    category: business_safety
    check: "approving a reunification case requires every GuardianNotification of the youth's ACTIVE/EXTENDED admissions to be in status IN {ATTEMPTED, CONTACTED, WAIVED, LAW_ENFORCEMENT_REPORTED}; a still-PENDING obligation with attempt_count == 0 blocks approval"
    error_id: ERR_NOTIFICATION_UNRESOLVED
    http_status: 422
    applies_to: "POST /ryhs/reunification-cases/{id}/decision"
  - priority: 24
    category: business_safety
    check: "segregation of duties: the decision X-User-ID differs from the latest held MediationSession.recorded_by_user_id; the WAIVED resolution X-User-ID differs from the Admission.admitting_user_id; the disposition X-User-ID differs from the SafetyScreening.screener_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ryhs/reunification-cases/{id}/decision, POST /ryhs/guardian-notifications/{id}/resolve, POST /ryhs/safety-screenings/{id}/disposition"
  - priority: 25
    category: business_constraint
    check: "youth.age_years is between program.min_age_years and program.max_age_years, both bounds inclusive, evaluated against the logical clock at request time"
    error_id: ERR_AGE_OUTSIDE_PROGRAM_BAND
    http_status: 422
    applies_to: "POST /ryhs/admissions, POST /ryhs/tlp-placements"
  - priority: 26
    category: business_referential
    check: "program.program_type matches the requested operation: EMERGENCY_SHELTER for admissions, TRANSITIONAL_LIVING for TLP placements"
    error_id: ERR_PROGRAM_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /ryhs/admissions, POST /ryhs/tlp-placements"
  - priority: 27
    category: business_temporal
    check: "HALF-OPEN interval semantics with zero buffer and capacity 1 on the Youth: the new occupancy interval [clock, planned_discharge_at) must not intersect the interval [coalesce(admitted_at, requested_at), coalesce(discharged_at, planned_discharge_at)) of any other Admission of the same youth with status IN {PENDING_SCREENING, WAITLISTED, ACTIVE, EXTENDED, DISCHARGE_SCHEDULED}. Exact adjacency (new start == prior end) is legal."
    error_id: ERR_ADMISSION_OVERLAP
    http_status: 409
    applies_to: "POST /ryhs/admissions"
  - priority: 28
    category: business_temporal
    check: "CLOSED interval semantics on the ReunificationCase: the new session window [scheduled_start_at, scheduled_end_at] must not intersect the window of any other MediationSession of the same case, and touching endpoints DO collide (new start == prior end is rejected, unlike the admission rule)"
    error_id: ERR_MEDIATION_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /ryhs/reunification-cases/{id}/mediation-sessions"
  - priority: 29
    category: business_temporal
    check: "BUFFER semantics on the ReunificationCase: scheduled_start_at must be at least MEDIATION_COOLDOWN_HOURS (72) after the held_at of the case's most recent held MediationSession; the buffer is measured from held_at, not from the previous window's end"
    error_id: ERR_MEDIATION_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /ryhs/reunification-cases/{id}/mediation-sessions"
  - priority: 30
    category: business_referential
    check: "the youth's most recent SafetyScreening exists and has status == CLEARED"
    error_id: ERR_SCREENING_REQUIRED
    http_status: 422
    applies_to: "POST /ryhs/tlp-placements"
  - priority: 31
    category: business_temporal
    check: "POINT-IN-TIME exclusivity with an open-ended interval [placed_at, infinity) on the Youth: the youth has no other TlpPlacement with tenancy_status IN {PLACED, NOTICE_GIVEN}; no end instant participates, so no adjacency case exists at all"
    error_id: ERR_PLACEMENT_OVERLAP
    http_status: 409
    applies_to: "POST /ryhs/tlp-placements"
  - priority: 32
    category: business_temporal
    check: "caller-supplied instants lie in the future relative to the logical clock and are internally ordered: planned_discharge_at > clock; scheduled_end_at > scheduled_start_at > clock; voting_closes_at > clock; new_planned_discharge_at > the current planned_discharge_at"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /ryhs/admissions, POST /ryhs/admissions/{id}/extend, POST /ryhs/reunification-cases/{id}/mediation-sessions, POST /ryhs/shelter-programs/{id}/governance-proposals"
  - priority: 33
    category: business_temporal
    check: "the logical clock never moves backwards: to_iso8601 must be strictly greater than the current clock value"
    error_id: ERR_CLOCK_MONOTONIC_VIOLATION
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 34
    category: business_constraint
    check: "the projected_billable_nights recomputed against new_planned_discharge_at is <= program.max_stay_nights; exactly max_stay_nights is allowed"
    error_id: ERR_MAX_STAY_EXCEEDED
    http_status: 422
    applies_to: "POST /ryhs/admissions/{id}/extend"
  - priority: 35
    category: business_constraint
    check: "extension_count < MAX_EXTENSIONS (2)"
    error_id: ERR_MAX_EXTENSIONS_REACHED
    http_status: 422
    applies_to: "POST /ryhs/admissions/{id}/extend"
  - priority: 36
    category: business_constraint
    check: "case.mediation_round < case.max_mediation_rounds (3)"
    error_id: ERR_MEDIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /ryhs/reunification-cases/{id}/mediation-sessions"
  - priority: 37
    category: business_constraint
    check: "days_elapsed < allowance_days; a placement that has consumed its full duration allowance cannot accept new life-skills completions or compliance reviews and must be exited"
    error_id: ERR_DURATION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /ryhs/tlp-placements/{id}/life-skills-completions, POST /ryhs/tlp-placements/{id}/compliance-review"
  - priority: 38
    category: business_constraint
    check: "the youth has no existing GovernanceVote with status == COUNTED on this proposal; a RETRACTED vote does not block a new one"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /ryhs/governance-proposals/{id}/votes"
  - priority: 39
    category: business_constraint
    check: "youth.governance_vote_eligible is true and the youth is a resident of the proposal's program per the electorate filter in calculations.governance_adoption_tally"
    error_id: ERR_YOUTH_NOT_VOTE_ELIGIBLE
    http_status: 422
    applies_to: "POST /ryhs/governance-proposals/{id}/votes, POST /ryhs/shelter-programs/{id}/governance-proposals"
  - priority: 40
    category: business_temporal
    check: "the logical clock is at or before proposal.voting_closes_at"
    error_id: ERR_PROPOSAL_VOTE_CLOSED
    http_status: 409
    applies_to: "POST /ryhs/governance-proposals/{id}/votes, POST /ryhs/governance-votes/{id}/retract"
  - priority: 41
    category: business_constraint
    check: "eligible_electorate_size computed at close-vote time is greater than zero; an empty electorate leaves the proposal OPEN_FOR_VOTE"
    error_id: ERR_NO_ELIGIBLE_ELECTORATE
    http_status: 422
    applies_to: "POST /ryhs/governance-proposals/{id}/close-vote"
  - priority: 42
    category: business_fiscal
    check: "when program.posture == RESTRICTED the admission's priority_score must be >= RESTRICTED_PRIORITY_FLOOR (60)"
    error_id: ERR_PROGRAM_RESTRICTED_PRIORITY
    http_status: 422
    applies_to: "POST /ryhs/admissions"
  - priority: 43
    category: business_fiscal
    check: "on POST /ryhs/admissions, when program.posture == FROZEN and waitlist_opt_out is true the request is refused instead of being waitlisted; on POST /ryhs/tlp-placements, occupied_beds < licensed_bed_capacity is required and there is no waitlist at all. The licensed bed capacity is a hard federal ceiling."
    error_id: ERR_BED_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /ryhs/admissions, POST /ryhs/tlp-placements"
  - priority: 44
    category: business_fiscal
    check: "a WITHDRAWAL's amount_cents does not exceed the placement's current savings_balance_cents"
    error_id: ERR_SAVINGS_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /ryhs/tlp-placements/{id}/savings-entries"
  - priority: 45
    category: business_fiscal
    check: "a WITHDRAWAL is refused while compliance_status == PROBATION"
    error_id: ERR_SAVINGS_WITHDRAWAL_BLOCKED
    http_status: 422
    applies_to: "POST /ryhs/tlp-placements/{id}/savings-entries"
  - priority: 46
    category: business_fiscal
    check: "a REVERSAL's amount_cents is less than or equal to sum(DEPOSIT amount_cents) - sum(prior REVERSAL amount_cents) on that placement, so a reversal can never invent savings that were never deposited"
    error_id: ERR_SAVINGS_REVERSAL_UNMATCHED
    http_status: 422
    applies_to: "POST /ryhs/tlp-placements/{id}/savings-entries"
  - priority: 47
    category: business_temporal
    check: "the FIRST aftercare contact is logged at or before case.aftercare_plan_due_at (approval instant + 72h); later contacts are unconstrained"
    error_id: ERR_AFTERCARE_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /ryhs/reunification-cases/{id}/aftercare-contacts"
  - priority: 48
    category: business_safety
    check: "the youth's risk_posture is OPEN at transitional-living placement time; a RESTRICTED posture (an unresolved parental-notification obligation on any of the youth's admissions, or a CRITICAL trafficking tier) blocks the placement until the obligation is resolved. This is the lowest-priority gate, so every other placement check above wins over it."
    error_id: ERR_YOUTH_POSTURE_RESTRICTED
    http_status: 422
    applies_to: "POST /ryhs/tlp-placements"

endpoints:
  - method: POST
    path: "/ryhs/shelter-programs"
    description: "license a shelter or transitional-living program"
    roles: [ProgramAdmin]
    code: 201
    input: [name, program_type, licensed_bed_capacity, min_age_years, max_age_years, max_stay_nights, max_placement_days, savings_match_rate_bp, required_savings_rate_bp]
    output: ShelterProgram
    side_effects:
      - "occupied_beds, waitlisted_count and overdue_notification_count start at 0; utilization_bp 0; posture computed as OPEN via calculations.program_posture"
  - method: GET
    path: "/ryhs/shelter-programs/{id}"
    description: "read one program including its live posture and bed counters"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist, TlpCoordinator, OutreachWorker]
    code: 200
    input: []
    output: ShelterProgram
    side_effects: []
  - method: GET
    path: "/ryhs/shelter-programs"
    description: "list programs with pagination"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist, TlpCoordinator, OutreachWorker]
    code: 200
    input: ["program_type?", "posture?", "limit?", "offset?"]
    output: ShelterProgram[]
    side_effects: []
  - method: GET
    path: "/ryhs/shelter-programs/{id}/compliance-report"
    description: "federal compliance and outcome report for one program; computed read, see calculations.federal_compliance_report"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ licensed_bed_capacity: integer, occupied_beds: integer, waitlisted_count: integer, utilization_bp: integer, posture: string, bed_capacity_compliant: boolean, discharged_count: integer, billable_nights_total: integer, average_stay_nights_bp: integer, over_limit_admission_count: integer, positive_outcome_count: integer, positive_outcome_rate_bp: integer, overdue_notification_count: integer, waived_notification_count: integer, runaway_report_count: integer }"
    side_effects: []
  - method: POST
    path: "/ryhs/shelter-programs/{id}/governance-proposals"
    description: "open a youth-governance proposal for a program's residents to vote on"
    roles: [ProgramAdmin, YouthMember]
    code: 201
    input: [title, category, voting_closes_at]
    output: GovernanceProposal
    side_effects:
      - "status OPEN_FOR_VOTE; support_vote_count and oppose_vote_count 0; eligible_electorate_size stays 0 until close-vote freezes it"
      - "when the caller is a YouthMember, validations priority 39 requires that youth to be a vote-eligible resident of the program"
  - method: GET
    path: "/ryhs/shelter-programs/{id}/governance-proposals"
    description: "list a program's governance proposals"
    roles: [ProgramAdmin, ShelterCaseManager, TlpCoordinator, OutreachWorker, ReunificationSpecialist, YouthMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GovernanceProposal[]
    side_effects: []
  - method: POST
    path: "/ryhs/youths"
    description: "intake a youth encountered through street outreach"
    roles: [OutreachWorker]
    code: 201
    input: [legal_first_name, legal_last_name, date_of_birth, "unaccompanied?"]
    output: Youth
    side_effects:
      - "status PROSPECT, risk_posture OPEN, trafficking_risk_score 0, trafficking_risk_tier LOW, version 1"
      - "intake_worker_user_id = X-User-ID"
  - method: GET
    path: "/ryhs/youths/{id}"
    description: "read one youth including computed age_years, postures and counters"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist, TlpCoordinator, OutreachWorker, YouthMember]
    code: 200
    input: []
    output: Youth
    side_effects: []
  - method: GET
    path: "/ryhs/youths"
    description: "list youths with filtering and pagination"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist, TlpCoordinator, OutreachWorker]
    code: 200
    input: ["status?", "trafficking_risk_tier?", "risk_posture?", "limit?", "offset?"]
    output: Youth[]
    side_effects: []
  - method: POST
    path: "/ryhs/youths/{id}/outreach-contacts"
    description: "log a street-outreach encounter with engagement stage, basic needs provided and observed indicators"
    roles: [OutreachWorker]
    code: 201
    input: [engagement_stage, basic_needs_provided, indicator_flags]
    output: OutreachContact
    side_effects:
      - "contacted_at = logical clock; worker_user_id = X-User-ID"
      - "Youth.engagement_contact_count += 1; Youth.basic_needs_provision_count += size(basic_needs_provided)"
      - "recompute Youth.trafficking_risk_score / trafficking_risk_tier via calculations.trafficking_risk_score variant outreach_history"
      - "recompute Youth.risk_posture and Youth.governance_vote_eligible; Youth.status PROSPECT -> ENGAGED; increments Youth.version by 1"
  - method: GET
    path: "/ryhs/youths/{id}/outreach-contacts"
    description: "list a youth's outreach encounters"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist, TlpCoordinator, OutreachWorker]
    code: 200
    input: ["limit?", "offset?"]
    output: OutreachContact[]
    side_effects: []
  - method: POST
    path: "/ryhs/youths/{id}/safety-screenings"
    description: "submit a trafficking and exploitation safety screening"
    roles: [OutreachWorker, ShelterCaseManager]
    code: 201
    input: [indicator_codes]
    output: SafetyScreening
    side_effects:
      - "screened_at = logical clock; screener_user_id = X-User-ID; status SUBMITTED"
      - "score and tier computed via calculations.trafficking_risk_score variant screening_time"
      - "recompute Youth.risk_posture (a SUBMITTED screening never freezes the youth on its own)"
  - method: GET
    path: "/ryhs/youths/{id}/safety-screenings"
    description: "list a youth's safety screenings"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist, TlpCoordinator, OutreachWorker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SafetyScreening[]
    side_effects: []
  - method: POST
    path: "/ryhs/safety-screenings/{id}/disposition"
    description: "disposition a screening as CLEARED or ESCALATED and attach the specialized anti-trafficking response"
    roles: [ProgramAdmin]
    code: 200
    input: [disposition, "specialized_response_code?"]
    output: SafetyScreening
    side_effects:
      - "disposition_user_id = X-User-ID; specialized_response_code stored (defaults to NONE, which ESCALATED forbids)"
      - "CLEARED: recompute Youth.risk_posture, then activate the youth's oldest PENDING_SCREENING Admission (created_at ASC), which increments that program's occupied_beds, recomputes its posture and creates a PENDING GuardianNotification"
      - "ESCALATED: Youth.risk_posture -> FROZEN"
  - method: POST
    path: "/ryhs/admissions"
    description: "request emergency shelter admission for a youth; the response status is ACTIVE, PENDING_SCREENING or WAITLISTED per state_machines.Admission"
    roles: [ShelterCaseManager]
    code: 201
    input: [youth_id, program_id, planned_discharge_at, "waitlist_opt_out?"]
    output: Admission
    side_effects:
      - "requested_at = logical clock; admitting_user_id = X-User-ID; priority_score via calculations.admission_priority_score"
      - "ACTIVE branch: admitted_at = clock, projected_billable_nights computed, program.occupied_beds += 1 -> program.utilization_bp and posture recomputed, GuardianNotification created PENDING with due_at = admitted_at + 24h -> Youth.risk_posture -> RESTRICTED, Youth.status -> SHELTERED, increments Youth.version by 1"
      - "WAITLISTED branch: capacity_blocked = true, program.waitlisted_count += 1, no bed consumed, no notification created"
      - "PENDING_SCREENING branch: nothing else changes until a screening is dispositioned CLEARED"
  - method: GET
    path: "/ryhs/admissions/{id}"
    description: "read one admission with both billable-night variants"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist, TlpCoordinator]
    code: 200
    input: []
    output: Admission
    side_effects: []
  - method: GET
    path: "/ryhs/admissions"
    description: "list admissions filtered by youth, program or status"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist, TlpCoordinator]
    code: 200
    input: ["youth_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Admission[]
    side_effects: []
  - method: POST
    path: "/ryhs/admissions/{id}/extend"
    description: "extend a stay to a later planned discharge instant, bounded by the federal stay ceiling"
    roles: [ShelterCaseManager]
    code: 200
    input: [new_planned_discharge_at]
    output: Admission
    side_effects:
      - "planned_discharge_at replaced; extension_count += 1; projected_billable_nights recomputed via variant forward_projected"
      - "status ACTIVE -> EXTENDED, or EXTENDED -> EXTENDED on the second extension"
  - method: POST
    path: "/ryhs/admissions/{id}/discharge"
    description: "discharge a youth, computing the federal billable-night total and firing the bed-release cascade"
    roles: [ShelterCaseManager]
    code: 200
    input: [exit_destination]
    output: Admission
    side_effects:
      - "discharged_at = clock; final_billable_nights via calculations.admission_billable_nights variant chronological_actual; outcome_positive derived; Youth.cumulative_shelter_nights += final_billable_nights; Youth.status -> REUNIFIED or EXITED; increments Youth.version by 1"
      - "program.occupied_beds -= 1 -> program.utilization_bp and program.posture recomputed"
      - "if the posture left FROZEN, the waitlist selector promotes exactly one WAITLISTED admission to ACTIVE, which re-increments occupied_beds, re-recomputes the posture and creates that admission's PENDING GuardianNotification"
  - method: GET
    path: "/ryhs/admissions/{id}/guardian-notifications"
    description: "list the parental-notification obligations of one admission; the only discovery channel for the cascade-created row"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GuardianNotification[]
    side_effects: []
  - method: POST
    path: "/ryhs/guardian-notifications/{id}/attempt"
    description: "record one parental-notification attempt"
    roles: [ShelterCaseManager]
    code: 200
    input: [attempt_channel]
    output: GuardianNotification
    side_effects:
      - "attempt_count += 1; last_attempt_at = clock; attempt_channel stored; status PENDING -> ATTEMPTED (or ATTEMPTED -> ATTEMPTED, or stays OVERDUE)"
  - method: POST
    path: "/ryhs/guardian-notifications/{id}/resolve"
    description: "resolve the notification obligation as CONTACTED, WAIVED or LAW_ENFORCEMENT_REPORTED (the runaway report)"
    roles: [ShelterCaseManager, ProgramAdmin]
    code: 200
    input: [outcome, "waiver_reason?"]
    output: GuardianNotification
    side_effects:
      - "resolved_at = clock; resolving_user_id = X-User-ID; LAW_ENFORCEMENT_REPORTED also sets runaway_report_filed_at = clock"
      - "if the row was OVERDUE, program.overdue_notification_count -= 1 -> program.posture recomputed"
      - "recompute Youth.risk_posture, which drops to OPEN once no unresolved obligation and no ESCALATED screening remain"
  - method: POST
    path: "/ryhs/reunification-cases"
    description: "open a family reunification case against a named guardian household, superseding any earlier non-terminal case for that youth"
    roles: [ReunificationSpecialist]
    code: 201
    input: [youth_id, guardian_household_label, expected_youth_version]
    output: ReunificationCase
    side_effects:
      - "status OPENED; opened_at = clock; mediation_round 0; max_mediation_rounds 3"
      - "every earlier non-terminal ReunificationCase of that youth -> SUPERSEDED with closed_at = clock; if the superseded case was APPROVED or AFTERCARE then Youth.status REUNIFIED_PENDING -> SHELTERED and every DISCHARGE_SCHEDULED admission of the youth reverts to ACTIVE"
      - "increments Youth.version by 1"
  - method: GET
    path: "/ryhs/reunification-cases/{id}"
    description: "read one reunification case"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist]
    code: 200
    input: []
    output: ReunificationCase
    side_effects: []
  - method: GET
    path: "/ryhs/youths/{id}/reunification-cases"
    description: "list a youth's reunification cases, including superseded ones"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReunificationCase[]
    side_effects: []
  - method: POST
    path: "/ryhs/reunification-cases/{id}/mediation-sessions"
    description: "schedule the next mediation round"
    roles: [ReunificationSpecialist]
    code: 201
    input: [scheduled_start_at, scheduled_end_at]
    output: MediationSession
    side_effects:
      - "round_number = case.mediation_round + 1; scheduler_user_id = X-User-ID; outcome null"
      - "case.status OPENED -> MEDIATION_SCHEDULED, or MEDIATION_HELD -> MEDIATION_SCHEDULED for a later round"
  - method: GET
    path: "/ryhs/reunification-cases/{id}/mediation-sessions"
    description: "list a case's mediation sessions in creation order"
    roles: [ProgramAdmin, ShelterCaseManager, ReunificationSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: MediationSession[]
    side_effects: []
  - method: POST
    path: "/ryhs/mediation-sessions/{id}/record-outcome"
    description: "record the outcome of a held mediation session"
    roles: [ReunificationSpecialist]
    code: 200
    input: [outcome]
    output: MediationSession
    side_effects:
      - "outcome stored; held_at = clock; recorded_by_user_id = X-User-ID (the segregation-of-duties input for the case decision)"
      - "case.mediation_round += 1; case.status MEDIATION_SCHEDULED -> MEDIATION_HELD"
  - method: POST
    path: "/ryhs/reunification-cases/{id}/home-assessment"
    description: "record the home safety assessment verdict"
    roles: [ReunificationSpecialist]
    code: 200
    input: [safety_assessment_result]
    output: ReunificationCase
    side_effects:
      - "safety_assessment_result stored; status MEDIATION_HELD -> HOME_ASSESSMENT"
  - method: POST
    path: "/ryhs/reunification-cases/{id}/decision"
    description: "approve or decline reunification; APPROVE fires the four-hop reunification cascade"
    roles: [ReunificationSpecialist]
    code: 200
    input: [decision]
    output: ReunificationCase
    side_effects:
      - "decision_user_id = X-User-ID"
      - "APPROVE: aftercare_plan_due_at = clock + 72h; status -> APPROVED; Youth.status -> REUNIFIED_PENDING (increments Youth.version by 1); every ACTIVE/EXTENDED admission of the youth -> DISCHARGE_SCHEDULED; each such admission's PENDING/ATTEMPTED/OVERDUE GuardianNotification -> WAIVED with waiver_reason COURT_ORDER, which recomputes program.overdue_notification_count and program.posture"
      - "DECLINE: status -> DECLINED and nothing else is touched"
  - method: POST
    path: "/ryhs/reunification-cases/{id}/aftercare-contacts"
    description: "log an aftercare-plan contact; the third contact closes the case"
    roles: [ReunificationSpecialist]
    code: 200
    input: ["contact_note?"]
    output: ReunificationCase
    side_effects:
      - "aftercare_contacts_completed += 1; status APPROVED -> AFTERCARE, then AFTERCARE -> AFTERCARE, then AFTERCARE -> CLOSED with closed_at = clock on the third contact"
  - method: POST
    path: "/ryhs/tlp-placements"
    description: "place a youth in a transitional living program"
    roles: [TlpCoordinator]
    code: 201
    input: [youth_id, program_id, "documented_monthly_income_cents?"]
    output: TlpPlacement
    side_effects:
      - "placed_at = clock; coordinator_user_id = X-User-ID; tenancy_status PLACED; compliance_status IN_COMPLIANCE"
      - "base_allowance_days copied from program.max_placement_days; allowance_days, consumed_ratio_bp and earned_bonus_days computed via calculations.tlp_duration_allowance"
      - "program.occupied_beds += 1 -> program.utilization_bp and program.posture recomputed"
      - "Youth.status SHELTERED -> TLP_ENROLLED; increments Youth.version by 1"
  - method: GET
    path: "/ryhs/tlp-placements/{id}"
    description: "read one placement with both state dimensions, the duration allowance and the savings figures"
    roles: [ProgramAdmin, TlpCoordinator, ShelterCaseManager]
    code: 200
    input: []
    output: TlpPlacement
    side_effects: []
  - method: GET
    path: "/ryhs/tlp-placements"
    description: "list placements filtered by youth or program"
    roles: [ProgramAdmin, TlpCoordinator, ShelterCaseManager]
    code: 200
    input: ["youth_id?", "program_id?", "tenancy_status?", "compliance_status?", "limit?", "offset?"]
    output: TlpPlacement[]
    side_effects: []
  - method: POST
    path: "/ryhs/tlp-placements/{id}/savings-entries"
    description: "post a deposit, withdrawal or reversal to the placement's savings account"
    roles: [TlpCoordinator]
    code: 201
    input: [entry_type, amount_cents, expected_placement_version, "source_note?"]
    output: SavingsLedgerEntry
    side_effects:
      - "posted_at = clock; recorded_by_user_id = X-User-ID; signed_amount_cents and match_component_cents per calculations.savings_match_award"
      - "placement.match_awarded_cents and placement.savings_balance_cents recomputed; balance_after_cents stamped onto the entry"
      - "Youth.lifetime_savings_deposited_cents recomputed; increments TlpPlacement.version by 1"
  - method: GET
    path: "/ryhs/tlp-placements/{id}/savings-entries"
    description: "list a placement's savings ledger in posting order"
    roles: [ProgramAdmin, TlpCoordinator]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: SavingsLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/ryhs/tlp-placements/{id}/life-skills-completions"
    description: "credit a completed life-skills curriculum module"
    roles: [TlpCoordinator]
    code: 201
    input: [module_code, credit_hours]
    output: LifeSkillsCompletion
    side_effects:
      - "completed_at = clock; verified_by_user_id = X-User-ID"
      - "placement.life_skills_credit_hours += credit_hours, then earned_bonus_days and allowance_days recomputed via calculations.tlp_duration_allowance; increments TlpPlacement.version by 1"
  - method: GET
    path: "/ryhs/tlp-placements/{id}/life-skills-completions"
    description: "list a placement's life-skills completions"
    roles: [ProgramAdmin, TlpCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: LifeSkillsCompletion[]
    side_effects: []
  - method: POST
    path: "/ryhs/tlp-placements/{id}/compliance-review"
    description: "run a savings-compliance review, moving only the compliance_status dimension"
    roles: [TlpCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: TlpPlacement
    side_effects:
      - "required_savings_cents recomputed via calculations.required_savings; compliance_status set to IN_COMPLIANCE, SAVINGS_DEFICIENT or PROBATION; consecutive_probation_reviews incremented or reset"
      - "tenancy_status PLACED -> NOTICE_GIVEN when consecutive_probation_reviews reaches 2"
      - "increments TlpPlacement.version by 1"
  - method: POST
    path: "/ryhs/tlp-placements/{id}/exit"
    description: "end a transitional-living tenancy"
    roles: [TlpCoordinator]
    code: 200
    input: [exit_reason]
    output: TlpPlacement
    side_effects:
      - "tenancy_status -> EXITED; exited_at = clock; exit_reason stored; compliance_status frozen"
      - "program.occupied_beds -= 1 -> program.utilization_bp and program.posture recomputed"
      - "Youth.status TLP_ENROLLED -> EXITED; increments Youth.version by 1"
  - method: POST
    path: "/ryhs/youths/{id}/education-enrollments"
    description: "enroll a youth in school or an employment track; never gated by either posture"
    roles: [TlpCoordinator, ShelterCaseManager]
    code: 201
    input: [school_name, enrollment_type]
    output: EducationEnrollment
    side_effects:
      - "enrolled_at = clock; liaison_user_id = X-User-ID; status IMMEDIATE_ENROLLMENT"
      - "records_waived = youth.unaccompanied at enrollment time"
  - method: GET
    path: "/ryhs/youths/{id}/education-enrollments"
    description: "list a youth's education and employment-track enrollments"
    roles: [ProgramAdmin, ShelterCaseManager, TlpCoordinator, OutreachWorker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EducationEnrollment[]
    side_effects: []
  - method: POST
    path: "/ryhs/education-enrollments/{id}/verify-records"
    description: "record that the receiving school verified the youth's records after immediate enrollment"
    roles: [TlpCoordinator, ShelterCaseManager]
    code: 200
    input: []
    output: EducationEnrollment
    side_effects:
      - "status IMMEDIATE_ENROLLMENT -> VERIFIED; verified_at = clock"
  - method: GET
    path: "/ryhs/governance-proposals/{id}"
    description: "read one governance proposal with its live tally"
    roles: [ProgramAdmin, ShelterCaseManager, TlpCoordinator, ReunificationSpecialist, OutreachWorker, YouthMember]
    code: 200
    input: []
    output: GovernanceProposal
    side_effects: []
  - method: POST
    path: "/ryhs/governance-proposals/{id}/votes"
    description: "cast a youth vote on a governance proposal"
    roles: [YouthMember]
    code: 201
    input: [stance]
    output: GovernanceVote
    side_effects:
      - "youth_id = X-User-ID; cast_at = clock; status COUNTED"
      - "proposal.support_vote_count or proposal.oppose_vote_count += 1"
  - method: GET
    path: "/ryhs/governance-proposals/{id}/votes"
    description: "list the votes cast on a proposal"
    roles: [ProgramAdmin, ShelterCaseManager, TlpCoordinator, ReunificationSpecialist, YouthMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GovernanceVote[]
    side_effects: []
  - method: GET
    path: "/ryhs/youths/{id}/governance-votes"
    description: "list the votes a youth has cast"
    roles: [ProgramAdmin, ShelterCaseManager, TlpCoordinator, YouthMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GovernanceVote[]
    side_effects: []
  - method: POST
    path: "/ryhs/governance-votes/{id}/retract"
    description: "retract a vote the youth previously cast"
    roles: [YouthMember]
    code: 200
    input: []
    output: GovernanceVote
    side_effects:
      - "status COUNTED -> RETRACTED; retracted_at = clock"
      - "proposal.support_vote_count or proposal.oppose_vote_count -= 1, restoring the pre-vote tally exactly"
  - method: POST
    path: "/ryhs/governance-proposals/{id}/close-vote"
    description: "close voting and adopt or reject the proposal against the youth electorate"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: GovernanceProposal
    side_effects:
      - "eligible_electorate_size and support_ratio_bp computed and frozen via calculations.governance_adoption_tally; decided_by_user_id = X-User-ID"
      - "status -> ADOPTED with adopted_at = clock, or -> REJECTED; an empty electorate raises ERR_NO_ELIGIBLE_ELECTORATE and changes nothing"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: move the logical clock forward. The server starts with the logical clock fixed at 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every age, due_at, cooldown, decay and duration rule reads this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects:
      - "the logical clock moves to to_iso8601; no entity is mutated and no census runs"
  - method: POST
    path: "/_ops/nightly-census"
    description: "test-driving endpoint: run the nightly census epoch - mark overdue notifications, deny stale screening-pending admissions, promote from the waitlist, give TLP notice, exit duration-expired placements, close declined cases and recompute every posture"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ overdue_marked: integer, admissions_denied: integer, admissions_promoted: integer, placements_noticed: integer, placements_exited: integer, cases_closed: integer, postures_recomputed: integer }"
    side_effects:
      - "GuardianNotification PENDING/ATTEMPTED -> OVERDUE when clock > due_at, then program.overdue_notification_count and program.posture recomputed"
      - "Admission PENDING_SCREENING -> DENIED when clock - requested_at > 72h"
      - "waitlist promotion for every program whose posture is not FROZEN, one admission per program per census, ranked priority_score DESC with created_at ASC tie-break"
      - "TlpPlacement PLACED -> NOTICE_GIVEN at days_elapsed >= allowance_days - 30, NOTICE_GIVEN -> EXITED with exit_reason DURATION_LIMIT at days_elapsed >= allowance_days"
      - "ReunificationCase DECLINED -> CLOSED after 168h; Youth.trafficking_risk_score re-decayed via calculations.trafficking_risk_score variant outreach_history"

errors:
  - code: ERR_MISSING_AUTH_HEADERS
    status: 401
    message: "Authentication headers are required"
    trigger: "X-User-ID or X-User-Role absent, empty or whitespace-only on any endpoint (validations priority 1)"
  - code: ERR_UNAUTHORIZED_ROLE
    status: 403
    message: "Role is not permitted to perform this operation"
    trigger: "X-User-Role is not in the endpoint's roles list (validations priority 2)"
  - code: ERR_NOT_VOTE_OWNER
    status: 403
    message: "A vote may only be retracted by the youth who cast it"
    trigger: "POST /ryhs/governance-votes/{id}/retract where vote.youth_id != X-User-ID (validations priority 3)"
  - code: ERR_SEGREGATION_OF_DUTIES
    status: 403
    message: "The reunification decision must be made by a different user than the one who recorded the mediation outcome"
    trigger: "the decision X-User-ID equals the latest held MediationSession.recorded_by_user_id, a WAIVED resolution X-User-ID equals Admission.admitting_user_id, or a disposition X-User-ID equals SafetyScreening.screener_user_id (validations priority 24)"
  - code: ERR_PROGRAM_NOT_FOUND
    status: 404
    message: "Shelter program not found"
    trigger: "unknown {id} on any /ryhs/shelter-programs/{id}... path, or unknown program_id in a POST body (validations priority 4 and 5)"
  - code: ERR_YOUTH_NOT_FOUND
    status: 404
    message: "Youth not found"
    trigger: "unknown {id} on any /ryhs/youths/{id}... path, or unknown youth_id in a POST body (validations priority 4 and 5)"
  - code: ERR_ADMISSION_NOT_FOUND
    status: 404
    message: "Admission not found"
    trigger: "unknown {id} on /ryhs/admissions/{id}, its sub-resources or its action endpoints (validations priority 4)"
  - code: ERR_NOTIFICATION_NOT_FOUND
    status: 404
    message: "Guardian notification not found"
    trigger: "unknown {id} on /ryhs/guardian-notifications/{id}/attempt or /resolve (validations priority 4)"
  - code: ERR_SCREENING_NOT_FOUND
    status: 404
    message: "Safety screening not found"
    trigger: "unknown {id} on /ryhs/safety-screenings/{id}/disposition (validations priority 4)"
  - code: ERR_CASE_NOT_FOUND
    status: 404
    message: "Reunification case not found"
    trigger: "unknown {id} on /ryhs/reunification-cases/{id} or any of its sub-resources and actions (validations priority 4)"
  - code: ERR_SESSION_NOT_FOUND
    status: 404
    message: "Mediation session not found"
    trigger: "unknown {id} on /ryhs/mediation-sessions/{id}/record-outcome (validations priority 4)"
  - code: ERR_PLACEMENT_NOT_FOUND
    status: 404
    message: "Transitional living placement not found"
    trigger: "unknown {id} on /ryhs/tlp-placements/{id}, its sub-resources or its action endpoints (validations priority 4)"
  - code: ERR_ENROLLMENT_NOT_FOUND
    status: 404
    message: "Education enrollment not found"
    trigger: "unknown {id} on /ryhs/education-enrollments/{id}/verify-records (validations priority 4)"
  - code: ERR_PROPOSAL_NOT_FOUND
    status: 404
    message: "Governance proposal not found"
    trigger: "unknown {id} on /ryhs/governance-proposals/{id}, /votes or /close-vote (validations priority 4)"
  - code: ERR_VOTE_NOT_FOUND
    status: 404
    message: "Governance vote not found"
    trigger: "unknown {id} on /ryhs/governance-votes/{id}/retract (validations priority 4)"
  - code: ERR_INVALID_REQUEST
    status: 400
    message: "Request body is invalid"
    trigger: "missing required field, wrong JSON type, unknown enum member, non-ISO-8601 instant, negative or zero amount_cents, licensed_bed_capacity < 1, or a rate in basis points outside 0..10000 (validations priority 6)"
  - code: ERR_STALE_YOUTH_VERSION
    status: 412
    message: "Youth has been modified by another writer"
    trigger: "POST /ryhs/reunification-cases where expected_youth_version != Youth.version (validations priority 7, concurrency_rules.case-open-stale-youth)"
  - code: ERR_STALE_PLACEMENT_VERSION
    status: 412
    message: "Placement has been modified by another writer"
    trigger: "POST /ryhs/tlp-placements/{id}/savings-entries where expected_placement_version != TlpPlacement.version (validations priority 8, concurrency_rules.savings-entry-stale-placement)"
  - code: ERR_ADMISSION_NOT_ACTIVE
    status: 409
    message: "Admission is not in an active stay"
    trigger: "extend or discharge on an admission whose status is PENDING_SCREENING or WAITLISTED (validations priority 9)"
  - code: ERR_ADMISSION_ALREADY_TERMINAL
    status: 409
    message: "Admission has already reached a terminal state"
    trigger: "extend or discharge on a DISCHARGED or DENIED admission (validations priority 10)"
  - code: ERR_YOUTH_ALREADY_SHELTERED
    status: 409
    message: "Youth already holds a non-terminal admission"
    trigger: "POST /ryhs/admissions for a youth who already holds another Admission at the same program with status IN {ACTIVE, EXTENDED, DISCHARGE_SCHEDULED} (validations priority 11)"
  - code: ERR_NOTIFICATION_ALREADY_RESOLVED
    status: 409
    message: "Guardian notification has already been resolved"
    trigger: "attempt or resolve on a CONTACTED, WAIVED or LAW_ENFORCEMENT_REPORTED notification (validations priority 12)"
  - code: ERR_SCREENING_INVALID_TRANSITION
    status: 409
    message: "Screening disposition is not available from the current status"
    trigger: "dispositioning a screening CLEARED when it is already CLEARED, or ESCALATED when it is already ESCALATED (validations priority 13)"
  - code: ERR_CASE_INVALID_STATE
    status: 409
    message: "Reunification case is not in a state that allows this step"
    trigger: "scheduling mediation, recording a home assessment, deciding or logging aftercare out of the state_machines.ReunificationCase order, or acting on a CLOSED, DECLINED or SUPERSEDED case (validations priority 14)"
  - code: ERR_SESSION_ALREADY_RECORDED
    status: 409
    message: "Mediation session outcome has already been recorded"
    trigger: "POST /ryhs/mediation-sessions/{id}/record-outcome twice on the same session (validations priority 15)"
  - code: ERR_PLACEMENT_ALREADY_EXITED
    status: 409
    message: "Placement tenancy has already ended"
    trigger: "savings entry, life-skills credit, compliance review or exit on a placement whose tenancy_status is EXITED (validations priority 16)"
  - code: ERR_PROPOSAL_ALREADY_DECIDED
    status: 409
    message: "Governance proposal has already been decided"
    trigger: "close-vote on an ADOPTED or REJECTED proposal (validations priority 17)"
  - code: ERR_PROPOSAL_VOTE_CLOSED
    status: 409
    message: "Voting on this proposal is closed"
    trigger: "casting or retracting a vote when the logical clock is strictly after proposal.voting_closes_at (validations priority 40); a decided proposal is caught earlier by ERR_PROPOSAL_ALREADY_DECIDED"
  - code: ERR_DUPLICATE_VOTE
    status: 409
    message: "This youth has already cast a counted vote on this proposal"
    trigger: "POST /ryhs/governance-proposals/{id}/votes twice from the same youth without retracting (validations priority 38)"
  - code: ERR_ADMISSION_OVERLAP
    status: 409
    message: "Requested stay overlaps an existing stay for this youth"
    trigger: "POST /ryhs/admissions whose [requested_at, planned_discharge_at) half-open interval overlaps a non-terminal admission of the same youth; adjacency where one ends exactly when the next begins is legal (validations priority 27)"
  - code: ERR_MEDIATION_SESSION_OVERLAP
    status: 409
    message: "Mediation session overlaps another session for this case"
    trigger: "POST /ryhs/reunification-cases/{id}/mediation-sessions whose closed [scheduled_start_at, scheduled_end_at] interval touches or overlaps another session of the same case (validations priority 28)"
  - code: ERR_MEDIATION_COOLDOWN_ACTIVE
    status: 409
    message: "A 72 hour cooldown applies after the previous mediation session"
    trigger: "scheduling a session whose scheduled_start_at is less than 72 hours after the previous session's held_at (validations priority 29)"
  - code: ERR_PLACEMENT_OVERLAP
    status: 409
    message: "Youth already holds an open transitional living placement"
    trigger: "POST /ryhs/tlp-placements for a youth whose existing placement has tenancy_status PLACED or NOTICE_GIVEN, an open-ended interval that contains every later instant (validations priority 31)"
  - code: ERR_BED_CAPACITY_EXCEEDED
    status: 409
    message: "Program has no licensed bed available"
    trigger: "POST /ryhs/admissions with waitlist_opt_out true against a FROZEN program, or POST /ryhs/tlp-placements when program.occupied_beds is already at licensed_bed_capacity (validations priority 43)"
  - code: ERR_SCREENING_CRITICAL_TIER
    status: 422
    message: "Youth is in the critical trafficking risk tier and requires the specialized response pathway"
    trigger: "POST /ryhs/safety-screenings/{id}/disposition with disposition CLEARED on a screening whose tier is CRITICAL (validations priority 18)"
  - code: ERR_SCREENING_ESCALATED_BLOCKS_ACTION
    status: 422
    message: "An escalated safety screening blocks this action"
    trigger: "POST /ryhs/admissions or POST /ryhs/tlp-placements while the youth's most recent SafetyScreening by created_at has status ESCALATED (validations priority 19)"
  - code: ERR_YOUTH_POSTURE_FROZEN
    status: 422
    message: "Youth posture is FROZEN and only safety operations are permitted"
    trigger: "POST /ryhs/reunification-cases or POST /ryhs/reunification-cases/{id}/decision while the youth's risk_posture is FROZEN (validations priority 20)"
  - code: ERR_RUNAWAY_REPORT_REQUIRED
    status: 422
    message: "A law enforcement runaway report must be filed before this step"
    trigger: "POST /ryhs/admissions/{id}/discharge while that admission's GuardianNotification is OVERDUE with runaway_report_filed_at still null (validations priority 21)"
  - code: ERR_NOTIFICATION_UNSAFE_CONTACT
    status: 422
    message: "Guardian contact is unsafe for this youth"
    trigger: "resolving a notification as CONTACTED while the youth's risk_posture is FROZEN, or as CONTACTED while attempt_count == 0 (validations priority 22)"
  - code: ERR_NOTIFICATION_UNRESOLVED
    status: 422
    message: "The parental notification obligation must be resolved first"
    trigger: "POST /ryhs/reunification-cases/{id}/decision with decision APPROVE while a GuardianNotification of one of the youth's ACTIVE or EXTENDED admissions is still PENDING with attempt_count == 0 (validations priority 23)"
  - code: ERR_AGE_OUTSIDE_PROGRAM_BAND
    status: 422
    message: "Youth age is outside the program's licensed age band"
    trigger: "POST /ryhs/admissions or POST /ryhs/tlp-placements where the youth's age in whole years at the logical clock is below min_age_years or above max_age_years; both bounds are inclusive (validations priority 25)"
  - code: ERR_PROGRAM_TYPE_MISMATCH
    status: 422
    message: "Program type does not support this placement"
    trigger: "POST /ryhs/admissions against a TRANSITIONAL_LIVING program, or POST /ryhs/tlp-placements against an EMERGENCY_SHELTER program (validations priority 26)"
  - code: ERR_SCREENING_REQUIRED
    status: 422
    message: "A safety screening is required before this action"
    trigger: "POST /ryhs/tlp-placements for a youth whose most recent SafetyScreening is missing or is not CLEARED (validations priority 30)"
  - code: ERR_INVALID_INTERVAL
    status: 422
    message: "Interval endpoints are not ordered correctly"
    trigger: "planned_discharge_at at or before the logical clock, new_planned_discharge_at at or before the current planned_discharge_at, scheduled_end_at at or before scheduled_start_at, or voting_closes_at at or before the logical clock (validations priority 32)"
  - code: ERR_CLOCK_MONOTONIC_VIOLATION
    status: 422
    message: "The logical clock may only move forward"
    trigger: "POST /_clock/set_current_utc with to_iso8601 at or before the current logical clock (validations priority 33)"
  - code: ERR_MAX_STAY_EXCEEDED
    status: 422
    message: "Requested stay exceeds the program's federal maximum stay"
    trigger: "POST /ryhs/admissions/{id}/extend whose recomputed forward_projected billable nights exceed program.max_stay_nights (validations priority 34)"
  - code: ERR_MAX_EXTENSIONS_REACHED
    status: 422
    message: "This stay has already been extended the maximum number of times"
    trigger: "a third POST /ryhs/admissions/{id}/extend on the same admission (validations priority 35)"
  - code: ERR_MEDIATION_ROUNDS_EXHAUSTED
    status: 422
    message: "The case has used all permitted mediation rounds"
    trigger: "scheduling a session when case.mediation_round is already at max_mediation_rounds of 3 (validations priority 36)"
  - code: ERR_DURATION_LIMIT_REACHED
    status: 422
    message: "Placement has reached its transitional living duration allowance"
    trigger: "POST /ryhs/tlp-placements/{id}/life-skills-completions or POST /ryhs/tlp-placements/{id}/compliance-review when days_elapsed is at or beyond placement.allowance_days (validations priority 37)"
  - code: ERR_YOUTH_NOT_VOTE_ELIGIBLE
    status: 422
    message: "Youth is not eligible to participate in program governance"
    trigger: "casting a vote, or opening a proposal as a YouthMember, when the youth's governance_vote_eligible is false or the youth is not resident in the proposal's program (validations priority 39)"
  - code: ERR_NO_ELIGIBLE_ELECTORATE
    status: 422
    message: "The program has no eligible youth electorate"
    trigger: "POST /ryhs/governance-proposals/{id}/close-vote when the program has zero vote-eligible residents (validations priority 41, calculations.governance_adoption_tally)"
  - code: ERR_PROGRAM_RESTRICTED_PRIORITY
    status: 422
    message: "Program posture is RESTRICTED and only high priority admissions are accepted"
    trigger: "POST /ryhs/admissions whose priority_score is below RESTRICTED_PRIORITY_FLOOR of 60 while program.posture is RESTRICTED (validations priority 42)"
  - code: ERR_SAVINGS_INSUFFICIENT_BALANCE
    status: 422
    message: "Savings balance is insufficient for this withdrawal"
    trigger: "a WITHDRAWAL whose amount_cents exceeds placement.savings_balance_cents (validations priority 44)"
  - code: ERR_SAVINGS_WITHDRAWAL_BLOCKED
    status: 422
    message: "Withdrawals are blocked while the placement is on savings probation"
    trigger: "a WITHDRAWAL while placement.compliance_status is PROBATION (validations priority 45)"
  - code: ERR_SAVINGS_REVERSAL_UNMATCHED
    status: 422
    message: "Reversal exceeds the deposits recorded on this placement"
    trigger: "a REVERSAL whose amount_cents exceeds sum(DEPOSIT amount_cents) - sum(prior REVERSAL amount_cents) on that placement (validations priority 46)"
  - code: ERR_YOUTH_POSTURE_RESTRICTED
    status: 422
    message: "Youth posture is RESTRICTED and transitional living placement is not available"
    trigger: "POST /ryhs/tlp-placements for a youth whose risk_posture is RESTRICTED because a PENDING, ATTEMPTED or OVERDUE guardian notification is still open, or because the trafficking tier is CRITICAL (validations priority 48)"
  - code: ERR_AFTERCARE_WINDOW_MISSED
    status: 422
    message: "The aftercare planning window has expired"
    trigger: "the FIRST POST /ryhs/reunification-cases/{id}/aftercare-contacts logged after the logical clock passes case.aftercare_plan_due_at (validations priority 47)"

roles:
  - name: OutreachWorker
    identity: opaque
    description: "street outreach staff; intakes youths, logs engagement contacts and basic needs, and submits safety screenings"
    exclusive_operations:
      - "POST /ryhs/youths"
      - "POST /ryhs/youths/{id}/outreach-contacts"
    shared_operations:
      - "POST /ryhs/youths/{id}/safety-screenings (with ShelterCaseManager)"
      - "read endpoints on programs, youths, outreach contacts, screenings, education enrollments and governance proposals"
  - name: ShelterCaseManager
    identity: opaque
    description: "emergency shelter staff; admits, extends and discharges youths and works the parental notification obligations"
    exclusive_operations:
      - "POST /ryhs/admissions"
      - "POST /ryhs/admissions/{id}/extend"
      - "POST /ryhs/admissions/{id}/discharge"
      - "POST /ryhs/guardian-notifications/{id}/attempt"
    shared_operations:
      - "POST /ryhs/youths/{id}/safety-screenings (with OutreachWorker)"
      - "POST /ryhs/guardian-notifications/{id}/resolve (with ProgramAdmin)"
      - "POST /ryhs/youths/{id}/education-enrollments and POST /ryhs/education-enrollments/{id}/verify-records (with TlpCoordinator)"
      - "read endpoints on programs, youths, admissions, notifications, cases, placements, enrollments, proposals and votes"
  - name: ReunificationSpecialist
    identity: opaque
    description: "family reunification staff; opens cases, runs mediation, records home assessments, decides and delivers aftercare"
    exclusive_operations:
      - "POST /ryhs/reunification-cases"
      - "POST /ryhs/reunification-cases/{id}/mediation-sessions"
      - "POST /ryhs/mediation-sessions/{id}/record-outcome"
      - "POST /ryhs/reunification-cases/{id}/home-assessment"
      - "POST /ryhs/reunification-cases/{id}/decision"
      - "POST /ryhs/reunification-cases/{id}/aftercare-contacts"
    shared_operations:
      - "read endpoints on programs, youths, admissions, notifications, cases, mediation sessions, proposals and votes"
    notes: "segregation_of_duties: the user who records a mediation outcome may not be the user who decides that case (validations priority 24)"
  - name: TlpCoordinator
    identity: opaque
    description: "transitional living staff; places youths, runs the savings and life-skills programs and exits tenancies"
    exclusive_operations:
      - "POST /ryhs/tlp-placements"
      - "POST /ryhs/tlp-placements/{id}/savings-entries"
      - "POST /ryhs/tlp-placements/{id}/life-skills-completions"
      - "POST /ryhs/tlp-placements/{id}/exit"
    shared_operations:
      - "POST /ryhs/tlp-placements/{id}/compliance-review (with ProgramAdmin)"
      - "POST /ryhs/youths/{id}/education-enrollments and POST /ryhs/education-enrollments/{id}/verify-records (with ShelterCaseManager)"
      - "read endpoints on programs, youths, admissions, placements, savings entries, life-skills completions, enrollments, proposals and votes"
  - name: ProgramAdmin
    identity: opaque
    description: "program administrator; licenses programs, dispositions safety screenings, closes governance votes, reads the federal compliance report and drives the test clock and nightly census"
    exclusive_operations:
      - "POST /ryhs/shelter-programs"
      - "POST /ryhs/safety-screenings/{id}/disposition"
      - "POST /ryhs/governance-proposals/{id}/close-vote"
      - "GET /ryhs/shelter-programs/{id}/compliance-report"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/nightly-census"
    shared_operations:
      - "POST /ryhs/guardian-notifications/{id}/resolve (with ShelterCaseManager)"
      - "POST /ryhs/tlp-placements/{id}/compliance-review (with TlpCoordinator)"
      - "POST /ryhs/shelter-programs/{id}/governance-proposals (with YouthMember)"
      - "every read endpoint"
  - name: YouthMember
    identity: "entity_backed:Youth"
    description: "a resident youth acting in program governance; X-User-ID is the Youth.id"
    exclusive_operations:
      - "POST /ryhs/governance-proposals/{id}/votes"
      - "POST /ryhs/governance-votes/{id}/retract"
    shared_operations:
      - "POST /ryhs/shelter-programs/{id}/governance-proposals (with ProgramAdmin)"
      - "GET /ryhs/youths/{id}, GET /ryhs/youths/{id}/governance-votes, GET /ryhs/shelter-programs/{id}/governance-proposals, GET /ryhs/governance-proposals/{id} and GET /ryhs/governance-proposals/{id}/votes"
    notes: "a YouthMember has no access to any other read or write endpoint; casting or proposing additionally requires governance_vote_eligible (validations priority 39)"
