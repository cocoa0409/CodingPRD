  # ===========================================================================
  - section: rbac
    instances:
      - name: each_role_can_perform_its_own_exclusive_and_shared_operations
        claim_type: Can perform exclusive_operations and shared_operations
        grounds:
          - roles.OrderDesk.exclusive_operations
          - roles.ComplianceReviewer.shared_operations
          - roles.Employee.shared_operations
          - roles.PayrollProcessor.shared_operations
        distinguishing_aspect: "The permit half of the matrix: OrderDesk's two catalogue/batch creates, the ComplianceReviewer's shared ordinance assessment, the Employee's own-record election create and the PayrollProcessor's shared election read must ALL succeed against the same employer - an over-tight RBAC gate that rejects any one of them fails here even though every denial test still passes."
        test_recipe:
          setup:
            - "Employer 'Permit Matrix Co' is ACTIVE in US-TX-AUS with transit_group_limit_cents 30000 and an ACTIVE pre-tax TRANSIT_PASS category."
            - "One ACTIVE employee hired 2026-02-01 in US-TX-AUS holds a BenefitAccount, and the 2026-08 window is OPEN with cutoff 2026-08-20."
