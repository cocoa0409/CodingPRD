        distinguishing_aspect: |
          Executing a WITHDRAW against North reaches a championship event hosted by
          South, a member the request never mentions, through five hops: North DEPARTED
          -> the South-North game CANCELLED -> the Border Trophy rivalry LAPSED ->
          South's compliance score recomputed from 95 to 85 -> South's SCHEDULED
          championship event flipped to HOST_AT_RISK because 85 is below the 90 minimum.
