            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
