      - name: error_program_at_capacity_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROGRAM_AT_CAPACITY]"]
        excluded_because: { difficulty_instance: "hipo_enrollment_capacity_boundary", rationale: "Second enroll at capacity asserts ERR_PROGRAM_AT_CAPACITY." }
      - name: error_consent_window_closed_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONSENT_WINDOW_CLOSED]"]
        excluded_because: { difficulty_instance: "consent_deadline_exact_instant_rejected", rationale: "Consent at exactly the deadline asserts ERR_CONSENT_WINDOW_CLOSED." }
      - name: error_posting_invalid_state_covered
