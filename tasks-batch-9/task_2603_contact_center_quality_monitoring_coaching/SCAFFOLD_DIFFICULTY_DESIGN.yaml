  - rule_id: boundary_precision_check
    instances:
      - name: boundary_analytics_priority_tier_exactly_at_seventy
        grounds:
          - calculations.analytics_priority_score
          - calculations.analytics_priority_score.constants.TIER_P1_MIN
          - concurrency_rules[analytics-scan-create-stale-interaction]
          - state_machines.AnalyticsScan.CURRENT_to_SUPERSEDED
        distinguishing_aspect: |
          NUMERIC threshold boundary with a 0.45-per-point lever: one silence_pct point (39.00 vs
          40.00) moves risk_score across TIER_P1_MIN by 0.45, giving 69.55 -> P2 and exactly 70.00
          -> P1. The comparison is >= so the exact-boundary value must land in P1, and because the
          intermediate terms (17.55 / 18.00, 7.00, 45) are only rounded once at the end, an
          implementation that rounds `base` early still reads 70.00 and hides the bug -- so the
          pair is checked with the 0.45 step rather than a single value.
        test_recipe:
          setup:
            - "clock 2026-08-05T09:00:00Z; agent A-1001"
            - "CHAT interaction I1 (channel multiplier 1.00) with required_disclosures [RECORDING] and consent VERIFIED capturing RECORDING, so DISCLOSURE_GAP_BONUS is 0"
            - "the interaction version read back after the consent review for the OCC-guarded scan create"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "CHAT", started_at: "2026-08-04T09:00:00Z", ended_at: "2026-08-04T09:20:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 3, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id }
            - call: "POST /interactions/${i1}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "GET /interactions/${i1}"
              payload: {}
              as: QualityManager
              captures: { iv1: $.data.version }
          trigger:
            - call: "POST /analytics-scans"
              payload: { interaction_id: "${i1}", silence_pct: 39.00, sentiment_delta: -0.20, flagged_categories: ["NO_DISCLOSURE", "ESCALATION_REQUEST"], expected_interaction_version: "${iv1}" }
              as: QualityManager
              captures: { scan_lo: $.data.id }
            - call: "GET /interactions/${i1}"
              payload: {}
              as: QualityManager
              captures: { iv2: $.data.version }
            - call: "POST /analytics-scans"
              payload: { interaction_id: "${i1}", silence_pct: 40.00, sentiment_delta: -0.20, flagged_categories: ["NO_DISCLOSURE", "ESCALATION_REQUEST"], expected_interaction_version: "${iv2}" }
              as: QualityManager
              captures: { scan_hi: $.data.id }
          assert:
            - "AnalyticsScan.${scan_lo}.risk_score == 69.55 (17.55 + 7.00 + 45 = 69.55, times CHAT 1.00, no disclosure bonus)"
            - "AnalyticsScan.${scan_lo}.priority_tier == P2 -- one 0.45 step below the boundary"
            - "AnalyticsScan.${scan_hi}.risk_score == 70.00 (18.00 + 7.00 + 45)"
            - "AnalyticsScan.${scan_hi}.priority_tier == P1 -- the boundary value itself is P1 because the test is risk_score >= 70.00"
            - "AnalyticsScan.${scan_lo}.status == SUPERSEDED and AnalyticsScan.${scan_hi}.status == CURRENT"
            - "Interaction.${i1}.version == ${iv1} + 2 (one bump per accepted scan)"
            - "GET /analytics-scans?interaction_id=${i1} returns the 70.00 scan first (risk_score DESC)"
      - name: boundary_quality_summary_empty_then_single_sided_partitions
        grounds:
          - calculations.agent_quality_correlation
          - calculations.agent_quality_correlation.constants.HIGH_SCORE_FLOOR
          - calculations.agent_quality_index
          - endpoints[GET /agents/{id}/quality-summary]
        distinguishing_aspect: |
          CARDINALITY / empty-set boundary instead of a numeric threshold, and it separates two
          different reasons for a null: at n == 0 every aggregate including repeat_contact_rate is
          null, while at n == 1 the denominator exists so repeat_contact_rate becomes 0.00 and only
          the csat gaps stay null because the `high` partition (effective_score >= 85.00) is empty.
          A DRAFT evaluation is present the whole time, so the test also pins that the input_set
          status filter -- not the absence of rows -- is what produces the n == 0 reading.
        test_recipe:
          setup:
            - "clock 2026-08-05T09:00:00Z; ACTIVE form F1; agent A-1001; evaluator Eve"
            - "interaction I1 (csat 4, repeat_contact_within_72h false) consent VERIFIED"
            - "OPEN plan pl1; selection sel1 assigned to Eve; evaluation e1 created and left in DRAFT"
