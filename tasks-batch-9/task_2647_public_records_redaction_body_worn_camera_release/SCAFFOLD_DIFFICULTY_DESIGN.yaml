            - "ResponsiveRecord.${rec_id}.inclusion_status == WITHHELD_IN_FULL"
            - "RedactionTask.${task_kept_id}.approved_labor_minutes == 8 (the FULL_WITHHOLD cascade cancels only DRAFT / QA_PENDING / QA_REJECTED tasks)"
            - "PublicRecordsRequest.${req_id}.billable_labor_minutes == 8"
            - "GET /records/redaction-tasks?responsive_record_id=${rec_id} returns total_count == 1 (no task row was created by the rejected call)"
            - "PublicRecordsRequest.${req_id}.processing_status == EXEMPTION_REVIEW (no RESPONSIVE record remains, so neither EXEMPTION_REVIEW auto-advance can fire)"
  - rule_id: boundary_precision_check
    instances:
      - name: deposit_threshold_exact_versus_one_step_over
        grounds:
          - calculations.fee_estimate_total
          - calculations.fee_estimate_total.constants.DEPOSIT_THRESHOLD_CENTS
          - calculations.fee_estimate_total.constants.DEPOSIT_PCT
          - state_machines.PublicRecordsRequest.fee_status.NOT_ASSESSED_to_ESTIMATED
          - state_machines.PublicRecordsRequest.fee_status.NOT_ASSESSED_to_DEPOSIT_DUE
          - endpoints[POST /records/requests/{id}/fee-estimates]
        distinguishing_aspect: |
          Metric = deposit_required_cents at DEPOSIT_THRESHOLD_CENTS (3500), measured on
          POST /records/requests/{id}/fee-estimates: an estimated_total_cents of EXACTLY 3500
          must yield deposit 0 and fee_status ESTIMATED (step 11 uses strict `>`), while the
          smallest reachable step over - 3640, one extra billable minute pair - must yield
          deposit 1820 and fee_status DEPOSIT_DUE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One COUNSEL StaffMember (level 3) and one GENERAL_PUBLIC Requester (fee_waiver_pct 0.00)."
            - "Two VideoAssets on incident INC-2026-0511: A1 duration_ms 2400000 (40 min) USE_OF_FORCE, A2 duration_ms 60000 (1 min) ROUTINE."
            - "The request is scope-clarified, A1 is RESPONSIVE, and an ASSERTED MEDICAL PARTIAL_REDACT claim sits on it: estimated_review_minutes 80, presumptive_burden_minutes 30 (baseline 10 + 0.50 x 40)."
            - "A2 is attached only during the trigger sequence so the two estimates differ by exactly one minute of source video."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RecordsSupervisor
              as_user_id: "supv-1"
