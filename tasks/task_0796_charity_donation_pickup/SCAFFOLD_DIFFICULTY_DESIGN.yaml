              as: Dispatcher
              captures: { route1_id: $.data.id }
          trigger:
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T11:00:00Z", window_end: "2026-03-15T13:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROUTE_WINDOW_CONFLICT"

