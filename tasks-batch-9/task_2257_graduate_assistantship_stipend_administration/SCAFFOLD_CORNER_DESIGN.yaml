# =============================================================================
# 1.9 Scaffold Corner Design - graduate-assistantship-stipend-administration
#
# Breadth probe over §1.1-§1.7. Walks references/claim-extraction-guide.md
# section by section. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an `excluded_because:` stub instead of a test_recipe.
#
# Fixed actor ids used throughout (same convention as §1.8):
#   GradSchoolAdmin   -> user-gs-1   (second admin: user-gs-2)
#   DepartmentAdmin   -> user-dept-1
#   GrantAccountant   -> user-ga-1
#   FacultySupervisor -> user-fac-7
#   StudentUser       -> the GraduateStudent row id
#
# Logical clock startup default is exactly 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Table 1 - Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: term_creation_and_retrieval_round_trip
        claim_type: creation
        grounds:
          - entities.AcademicTerm
          - endpoints[POST /academic-terms]
          - endpoints[GET /academic-terms/{id}]
        distinguishing_aspect: "POST /academic-terms with the seven declared inputs returns 201 with status == PLANNING and pay_period_count == 0, and a subsequent GET returns byte-identical stored values."
        test_recipe:
          setup: ["Empty database. No terms exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /academic-terms"
              payload: { term_code: "FALL2026", term_start: "2026-09-01", term_end: "2026-12-31", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-09-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { term_id: "$.data.id" }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
          assert:
            - "POST /academic-terms returns HTTP 201"
            - "AcademicTerm.${term_id}.status == PLANNING"
            - "AcademicTerm.${term_id}.pay_period_count == 0"
            - "AcademicTerm.${term_id}.locked_at == null"
            - "AcademicTerm.${term_id}.closed_at == null"
            - "AcademicTerm.${term_id}.term_code == FALL2026"
            - "AcademicTerm.${term_id}.proration_method == CALENDAR_DAY"
            - "AcademicTerm.${term_id}.tax_calendar_year == 2026"
            - "GET /academic-terms/${term_id} returns the same term_start 2026-09-01 and term_end 2026-12-31"

      - name: student_retrieval_returns_zeroed_aggregates
        claim_type: retrieval
        grounds:
          - entities.GraduateStudent
          - endpoints[POST /students]
          - endpoints[GET /students/{id}]
        distinguishing_aspect: "A freshly registered student reads back with all four computed aggregates at 0 and sap_status SATISFACTORY, proving the aggregates are stored-and-served rather than absent."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /students"
              payload: { student_number: "GS-1001", full_name: "Ada Vance", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.60, enrolled_credit_hours: 9 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { student_id: "$.data.id" }
          trigger:
            - call: "GET /students/${student_id}"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
          assert:
            - "GraduateStudent.${student_id}.total_effort_pct == 0"
            - "GraduateStudent.${student_id}.assigned_hours_per_week == 0.0"
            - "GraduateStudent.${student_id}.tuition_benefit_ytd_cents == 0"
            - "GraduateStudent.${student_id}.taxable_tuition_benefit_ytd_cents == 0"
            - "GraduateStudent.${student_id}.sap_status == SATISFACTORY"
            - "GraduateStudent.${student_id}.enrolled_credit_hours == 9"

      - name: funding_source_listing_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /funding-sources]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three sources present, GET /funding-sources with limit 2 offset 0 returns exactly 2 rows, total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One department and three ACTIVE funding sources of that department."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "CHEM", name: "Chemistry" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { dept_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { department_id: "${dept_id}", source_code: "NSF-A", source_type: "GRANT", authorized_amount_cents: 5000000, budget_period_start: "2026-07-01", budget_period_end: "2027-06-30", allows_tuition_remission: true }
              as: GrantAccountant
              as_user_id: "user-ga-1"
            - call: "POST /funding-sources"
              payload: { department_id: "${dept_id}", source_code: "DEPT-B", source_type: "DEPARTMENTAL_BUDGET", authorized_amount_cents: 3000000, budget_period_start: "2026-07-01", budget_period_end: "2027-06-30", allows_tuition_remission: true }
              as: GrantAccountant
              as_user_id: "user-ga-1"
            - call: "POST /funding-sources"
              payload: { department_id: "${dept_id}", source_code: "FELL-C", source_type: "FELLOWSHIP", authorized_amount_cents: 1000000, budget_period_start: "2026-07-01", budget_period_end: "2027-06-30", allows_tuition_remission: false }
              as: GrantAccountant
              as_user_id: "user-ga-1"
          trigger:
            - call: "GET /funding-sources"
              payload: { limit: 2, offset: 0 }
              as: GrantAccountant
              as_user_id: "user-ga-1"
            - call: "GET /funding-sources"
              payload: { limit: 2, offset: 2 }
              as: GrantAccountant
              as_user_id: "user-ga-1"
          assert:
            - "first response: response_type == array, len(data) == 2, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "second response: len(data) == 1, total_count == 3, offset == 2, has_more == false"
            - "the union of ids across the two pages contains all three sources exactly once"

      - name: unknown_path_ids_return_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_TERM_NOT_FOUND]
          - errors[ERR_DEPARTMENT_NOT_FOUND]
          - errors[ERR_STUDENT_NOT_FOUND]
          - errors[ERR_FUNDING_SOURCE_NOT_FOUND]
          - errors[ERR_APPOINTMENT_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_DISBURSEMENT_NOT_FOUND]
          - errors[ERR_RENEWAL_DECISION_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
        distinguishing_aspect: "The same nonexistent uuid produces nine DIFFERENT 404 error_ids, one per addressed collection - a single generic ERR_NOT_FOUND for all nine fails this test."
        test_recipe:
          setup: ["Empty database. The uuid 00000000-0000-0000-0000-0000000000ff exists in no collection."]
          setup_api_calls: []
          trigger:
            - call: "GET /academic-terms/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /departments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /students/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /funding-sources/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /appointments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /funding-allocations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /stipend-disbursements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /renewal-decisions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /tax-assessments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
          assert:
            - "all nine responses return HTTP 404 with response_type == error"
            - "error_id sequence == [ERR_TERM_NOT_FOUND, ERR_DEPARTMENT_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_FUNDING_SOURCE_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_DISBURSEMENT_NOT_FOUND, ERR_RENEWAL_DECISION_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND]"

      - name: student_creation_missing_required_degree_level_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /students]
        distinguishing_aspect: "Omitting degree_level (an input field with no declared default) returns 422 ERR_INVALID_REQUEST and persists no GraduateStudent row."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { student_number: "GS-1002", full_name: "No Degree", is_international: false, cumulative_gpa: 3.10 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
          assert:
            - "HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "no GraduateStudent row with student_number GS-1002 exists afterwards"

      - name: department_and_student_omitted_optionals_use_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Department.non_renewal_notice_days
          - entities.GraduateStudent.effort_cap_pct
          - entities.GraduateStudent.visa_type
          - entities.GraduateStudent.external_weekly_hours
          - entities.StipendPolicy.insurance_min_effort_pct
          - entities.StipendPolicy.min_insurance_duration_days
          - entities.StipendPolicy.tuition_tax_exempt_cap_cents
          - entities.FundingSource.grant_effort_cap_pct
        distinguishing_aspect: "Creating department, student, policy and source with every optional input omitted yields exactly non_renewal_notice_days 60, effort_cap_pct 75, visa_type NONE, external_weekly_hours 0, insurance_min_effort_pct 50, min_insurance_duration_days 90, tuition_tax_exempt_cap_cents 525000 and grant_effort_cap_pct 100."
        test_recipe:
          setup: ["Empty database; a PLANNING term exists so the policy can be declared."]
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "FALL2026", term_start: "2026-09-01", term_end: "2026-12-31", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-09-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { term_id: "$.data.id" }
          trigger:
            - call: "POST /departments"
              payload: { code: "CHEM", name: "Chemistry" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { dept_id: "$.data.id" }
            - call: "POST /students"
              payload: { student_number: "GS-1003", full_name: "Default Dana", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.40 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { student_id: "$.data.id" }
            - call: "POST /stipend-policies"
              payload: { term_id: "${term_id}", assistantship_type: "RESEARCH", degree_level: "DOCTORAL", min_fte_monthly_stipend_cents: 400000, per_credit_tuition_cents: 50000, max_remission_cents_per_term: 900000, term_insurance_premium_cents: 600000 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { policy_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { department_id: "${dept_id}", source_code: "NSF-A", source_type: "GRANT", authorized_amount_cents: 5000000, budget_period_start: "2026-07-01", budget_period_end: "2027-06-30", allows_tuition_remission: true }
              as: GrantAccountant
              as_user_id: "user-ga-1"
              captures: { src_id: "$.data.id" }
          assert:
            - "Department.${dept_id}.non_renewal_notice_days == 60"
            - "GraduateStudent.${student_id}.effort_cap_pct == 75"
            - "GraduateStudent.${student_id}.visa_type == NONE"
            - "GraduateStudent.${student_id}.external_weekly_hours == 0.0"
            - "GraduateStudent.${student_id}.enrolled_credit_hours == 0"
            - "StipendPolicy.${policy_id}.insurance_min_effort_pct == 50"
            - "StipendPolicy.${policy_id}.min_insurance_duration_days == 90"
            - "StipendPolicy.${policy_id}.tuition_tax_exempt_cap_cents == 525000"
            - "FundingSource.${src_id}.grant_effort_cap_pct == 100"
            - "FundingSource.${src_id}.available_amount_cents == 5000000 and committed_amount_cents == 0 and expended_amount_cents == 0"

      - name: appointment_computed_money_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Appointment.weekly_hours
          - entities.Appointment.tuition_remission_pct
          - entities.Appointment.total_stipend_cents
          - calculations.appointment_effort_profile
          - endpoints[POST /appointments]
        distinguishing_aspect: "Client-supplied weekly_hours 40.0, tuition_remission_pct 100 and total_stipend_cents 9999999 are discarded: the row stores 24.0, 75 and 0 as derived by appointment_effort_profile at effort_pct 60."
        test_recipe:
          setup: ["An OPEN term FALL2026 (2026-09-01..2026-12-31, CALENDAR_DAY) with one RESEARCH/DOCTORAL policy and one pay period; a domestic doctoral student; department CHEM."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "CHEM", name: "Chemistry" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { dept_id: "$.data.id" }
            - call: "POST /academic-terms"
              payload: { term_code: "FALL2026", term_start: "2026-09-01", term_end: "2026-12-31", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-09-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { term_id: "$.data.id" }
            - call: "POST /stipend-policies"
              payload: { term_id: "${term_id}", assistantship_type: "RESEARCH", degree_level: "DOCTORAL", min_fte_monthly_stipend_cents: 400000, per_credit_tuition_cents: 50000, max_remission_cents_per_term: 900000, term_insurance_premium_cents: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /pay-periods"
              payload: { term_id: "${term_id}", sequence_no: 1, period_start: "2026-09-01", period_end_exclusive: "2027-01-01", pay_date: "2027-01-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms/${term_id}/open"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /students"
              payload: { student_number: "GS-1004", full_name: "Ada Vance", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.60, enrolled_credit_hours: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { student_id: "$.data.id" }
          trigger:
            - call: "POST /appointments"
              payload: { student_id: "${student_id}", department_id: "${dept_id}", term_id: "${term_id}", assistantship_type: "RESEARCH", effort_pct: 60, start_date: "2026-09-01", end_date: "2026-12-31", monthly_stipend_cents: 300000, supervisor_user_id: "user-fac-7", weekly_hours: 40.0, tuition_remission_pct: 100, total_stipend_cents: 9999999, duration_days: 1 }
              as: DepartmentAdmin
              as_user_id: "user-dept-1"
              captures: { appt_id: "$.data.id" }
          assert:
            - "HTTP 201; the four client-supplied computed fields are ignored"
            - "Appointment.${appt_id}.weekly_hours == 24.0"
            - "Appointment.${appt_id}.duration_days == 122"
            - "Appointment.${appt_id}.tuition_remission_pct == 75"
            - "Appointment.${appt_id}.insurance_eligible == true"
            - "Appointment.${appt_id}.total_stipend_cents == 0"
            - "Appointment.${appt_id}.tuition_remission_cents == 0"
            - "Appointment.${appt_id}.net_term_stipend_cents == 0"

      - name: system_fields_generated_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Department
          - entities.GraduateStudent
          - response_envelope.success
        distinguishing_aspect: "A client-supplied id/version/created_at on POST /departments is discarded: the response id is server-minted (not the supplied literal) and version == 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /departments"
              payload: { code: "PHYS", name: "Physics", id: "00000000-0000-0000-0000-0000000000aa", version: 77, created_at: "2000-01-01T00:00:00Z" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { dept_id: "$.data.id" }
          assert:
            - "HTTP 201; Department.${dept_id}.id != 00000000-0000-0000-0000-0000000000aa"
            - "Department.${dept_id}.version == 1"
            - "Department.${dept_id}.created_at != 2000-01-01T00:00:00Z"
            - "meta.api_request_id and meta.api_request_timestamp are present in the response envelope"

      - name: term_invalid_enum_and_reversed_dates_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=6]
          - entities.AcademicTerm.session_type
          - entities.AcademicTerm.proration_method
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An out-of-domain session_type (SUMMER_BREAKS), an out-of-domain proration_method (HOURLY) and term_end < term_start each independently return 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /academic-terms"
              payload: { term_code: "BAD1", term_start: "2026-09-01", term_end: "2026-12-31", tax_calendar_year: 2026, session_type: "SUMMER_BREAKS", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-09-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms"
              payload: { term_code: "BAD2", term_start: "2026-09-01", term_end: "2026-12-31", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "HOURLY", remission_drop_deadline: "2026-09-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms"
              payload: { term_code: "BAD3", term_start: "2026-12-31", term_end: "2026-09-01", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-09-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
          assert:
            - "all three responses are HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "no AcademicTerm row exists with term_code in {BAD1, BAD2, BAD3}"

      - name: stipend_policy_and_pay_period_with_unknown_term_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - entities.StipendPolicy.term_id
          - entities.PayPeriod.term_id
          - errors[ERR_TERM_NOT_FOUND]
        distinguishing_aspect: "Body FK term_id pointing at a nonexistent uuid returns 404 ERR_TERM_NOT_FOUND for both POST /stipend-policies and POST /pay-periods, ahead of any 422 field validation."
        test_recipe:
          setup: ["Empty database. No AcademicTerm rows exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /stipend-policies"
              payload: { term_id: "00000000-0000-0000-0000-0000000000ff", assistantship_type: "RESEARCH", degree_level: "DOCTORAL", min_fte_monthly_stipend_cents: 400000, per_credit_tuition_cents: 50000, max_remission_cents_per_term: 900000, term_insurance_premium_cents: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /pay-periods"
              payload: { term_id: "00000000-0000-0000-0000-0000000000ff", sequence_no: 1, period_start: "2026-09-01", period_end_exclusive: "2026-10-01", pay_date: "2026-10-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
          assert:
            - "both responses are HTTP 404 with error_id == ERR_TERM_NOT_FOUND"
            - "no StipendPolicy row and no PayPeriod row are created"

      - name: appointment_creation_with_unknown_student_and_department_not_found
        claim_type: foreign_key_integrity
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=5]
          - errors[ERR_STUDENT_NOT_FOUND]
          - errors[ERR_DEPARTMENT_NOT_FOUND]
        distinguishing_aspect: "Flat topology: POST /appointments resolves body FKs in declaration order term_id -> department_id -> student_id, so an unknown department_id with a valid student_id returns ERR_DEPARTMENT_NOT_FOUND while an unknown student_id with valid term and department returns ERR_STUDENT_NOT_FOUND."
        test_recipe:
          setup: ["An OPEN term with a RESEARCH/DOCTORAL policy and one pay period; department CHEM; student GS-1005."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "CHEM", name: "Chemistry" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { dept_id: "$.data.id" }
            - call: "POST /academic-terms"
              payload: { term_code: "FALL2026", term_start: "2026-09-01", term_end: "2026-12-31", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-09-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { term_id: "$.data.id" }
            - call: "POST /stipend-policies"
              payload: { term_id: "${term_id}", assistantship_type: "RESEARCH", degree_level: "DOCTORAL", min_fte_monthly_stipend_cents: 400000, per_credit_tuition_cents: 50000, max_remission_cents_per_term: 900000, term_insurance_premium_cents: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /pay-periods"
              payload: { term_id: "${term_id}", sequence_no: 1, period_start: "2026-09-01", period_end_exclusive: "2027-01-01", pay_date: "2027-01-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms/${term_id}/open"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /students"
              payload: { student_number: "GS-1005", full_name: "Ada Vance", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.60, enrolled_credit_hours: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { student_id: "$.data.id" }
          trigger:
            - call: "POST /appointments"
