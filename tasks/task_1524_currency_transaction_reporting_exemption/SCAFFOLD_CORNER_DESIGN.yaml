            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 500000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - call: "GET /audit-events"
              payload: {}
              as: BSAOfficer
              captures: { n: $.meta.total_count, seq0: "$.data[0].sequence_no", prev0: "$.data[0].prev_hash" }
            - call: "GET /audit-events/verify-chain"
              as: BSAOfficer
              captures: { ok: $.data.chain_valid, checked: $.data.events_checked }
          assert:
