            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-08", index_points: 115.0 }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "GET /v1/invoices", payload: { order_id: "${o_id}" }, as: Dispatcher, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /v1/invoices/${inv_id}/issue", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /v1/invoices/${inv_id}/dispute", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /v1/invoices/${inv_id}/adjust", payload: { adjustment_lines: [ { description: "wait dispute uplift", amount_cents: 1000 } ] }, as: PlantManager }
            - { call: "POST /v1/invoices/${inv_id}/dispute", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /v1/invoices/${inv_id}/adjust", payload: { adjustment_lines: [ { description: "goodwill", amount_cents: -500 } ] }, as: PlantManager }
            - { call: "POST /v1/invoices/${inv_id}/pay", payload: { amount_cents: 159800 }, as: Customer, as_user_id: "${c_id}" }
          assert:
            - "Invoice.${inv_id}.status after first adjust == ISSUED with total_cents == 160300 (159300 + 1000)"
            - "Second dispute succeeds from the re-ISSUED state (cycle iterated twice)"
