  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: seat_point_occupancy_collision_on_performance
        grounds:
          - validations[priority=6]
          - errors[ERR_SEAT_ALREADY_TAKEN]
          - entities.Ticket.fields.seat_id
        distinguishing_aspect: |
          Seat occupancy uses point-collision interval semantics: a seat admits at most one non-VOID Ticket per
          performance, no buffer or pooling; a second hold on the same (seat, performance) is rejected with
          ERR_SEAT_ALREADY_TAKEN — exact-point overlap on the Seat resource.
        test_recipe:
          setup:
