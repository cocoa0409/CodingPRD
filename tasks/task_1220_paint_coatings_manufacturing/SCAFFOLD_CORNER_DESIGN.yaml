  # ==================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a mutation is visible in the mutating response itself and in the very next GET — no stale reads, no reconciliation lag."
        test_recipe:
          setup: ["TB1, C1 exist; F1 created DRAFT"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
          trigger:
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician, captures: { st_resp: $.data.status } }
            - { call: "GET /coatings/formulas/${f1}", payload: {}, as: Dealer, captures: { st_get: $.data.status } }
          assert:
            - "st_resp == ACTIVE (mutation visible in the same response)"
            - "st_get == ACTIVE on the immediately following GET (no eventual-consistency lag)"
            - "Formula.${f1}.activated_at == 2026-05-01T00:00:00Z (logical clock)"
