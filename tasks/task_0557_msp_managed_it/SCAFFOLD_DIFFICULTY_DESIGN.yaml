  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_create_requires_active_contract
        grounds:
          - validations[priority=6]
          - state_machines.Contract.DRAFT_to_ACTIVE
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: "Pair Ticket->Contract: opening a ticket against a DRAFT contract is rejected ERR_CONTRACT_NOT_ACTIVE; after the contract activates the identical create succeeds (status NEW)."
        test_recipe:
          setup:
            - "Client active; SILVER contract still DRAFT (not activated)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Nu", primary_contact_email: "n@nu.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { client_id: "${client_id}", contract_id: "${contract_id}", priority: "P3", subject: "early" }
              as: ServiceManager
              captures: { err_id: $.data.error_id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /tickets"
              payload: { client_id: "${client_id}", contract_id: "${contract_id}", priority: "P3", subject: "later" }
              as: ServiceManager
              captures: { ok_status: $.data.status }
          assert:
            - "Ticket create against DRAFT contract: error_id == ERR_CONTRACT_NOT_ACTIVE"
            - "After activation: identical create returns Ticket.status == NEW"

      - name: patch_create_requires_monitored_asset
        grounds:
          - validations[priority=6]
          - state_machines.Asset.UNMONITORED_to_ACTIVE
          - errors[ERR_ASSET_NOT_MONITORED]
        distinguishing_aspect: "Pair PatchJob->Asset (a different pair from Ticket->Contract): scheduling a patch job on an UNMONITORED asset is rejected ERR_ASSET_NOT_MONITORED; after assign-contract makes it ACTIVE the create succeeds (status SCHEDULED)."
        test_recipe:
          setup:
            - "Client active; site; SILVER contract active; asset UNMONITORED (not yet assigned)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Xi", primary_contact_email: "x@xi.test" }
              as: ServiceManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", label: "Site", address: "3 Oak" }
              as: ServiceManager
              captures: { site_id: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${client_id}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /assets"
              payload: { client_id: "${client_id}", site_id: "${site_id}", asset_type: "SERVER", hostname: "srv-01" }
              as: ServiceManager
              captures: { asset_id: $.data.id }
          trigger:
            - call: "POST /assets/${asset_id}/patch-jobs"
              payload: { window_start: "2026-05-05T00:00:00Z", window_end: "2026-05-05T01:00:00Z" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
            - call: "POST /assets/${asset_id}/assign-contract"
              payload: { contract_id: "${contract_id}" }
              as: ServiceManager
            - call: "POST /assets/${asset_id}/patch-jobs"
              payload: { window_start: "2026-05-05T00:00:00Z", window_end: "2026-05-05T01:00:00Z" }
              as: Dispatcher
              captures: { ok_status: $.data.status }
          assert:
