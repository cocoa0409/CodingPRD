            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "204", floor: 2, stack_index: 4, bedrooms: 1 }, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "205", floor: 2, stack_index: 5, bedrooms: 1 }, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "206", floor: 2, stack_index: 6, bedrooms: 1 }, as: ProgramAdmin }
