            - "the 2-slot submission returns 422 with data.error_id == 'ERR_ILLEGAL_LINEUP' - a lineup must carry exactly league.lineup_positions slots, now 3"
            - "the submission with positions 1, 2 and 2 returns 422 with data.error_id == 'ERR_ILLEGAL_LINEUP' - the slot count is right but position 3 is missing and position 2 is used twice"
            - "the all-VACANCY submission returns 422 with data.error_id == 'ERR_ILLEGAL_LINEUP', not ERR_VACANCY_LIMIT_EXCEEDED - it has 0 bowling slots against legal_lineup_minimum 1, and priority 32 is consulted before priority 33 even though it also breaks the vacancy cap"
            - "the REGULAR + VACANCY + ABSENTEE submission returns 422 with data.error_id == 'ERR_VACANCY_LIMIT_EXCEEDED' - it clears priority 32 (1 bowling slot >= legal_lineup_minimum 1) and then fails priority 33 with 2 non-bowling slots against max_vacancy_slots_per_lineup 1, which proves ABSENTEE counts against the same cap as VACANCY"
            - "the submission naming ${ms1_id} at positions 1 and 2 returns 422 with data.error_id == 'ERR_DUPLICATE_BOWLER_IN_LINEUP'"
            - "the submission with SUBSTITUTE ${ms3_id} returns 422 with data.error_id == 'ERR_SUBSTITUTE_NOT_ELIGIBLE' - ${ms3_id} is SANCTIONED in this league and clears priority 23, but its team_id is ${t2_id}, the opposing side of ${mt2_id}"
            - "the submission that both duplicates ${ms1_id} and names the ineligible substitute ${ms3_id} returns 422 with data.error_id == 'ERR_DUPLICATE_BOWLER_IN_LINEUP' - priority 34 decides, and ERR_SUBSTITUTE_NOT_ELIGIBLE is never reported"
            - "GET /series-entries?match_id=${mt2_id} returns 0 rows after all six refusals - no partial slot set was ever written"
            - "Match.${mt2_id}.version is still ${mt2_v1} and status is still 'SCHEDULED' after all six refusals, which is why every attempt could reuse the same expected_match_version"
            - "the final submission returns 200 with data.status == 'SCHEDULED' (only one side has slots, so the match does not reach LINEUPS_SUBMITTED), data.version == ${mt2_v1} + 1 and data.away_team_handicap_per_game == 114 == 36 + 18 + 60"
            - "the 60 is the VACANCY substitution min(60, floor((220 - 120) * 0.90)) == min(60, 90), so the away side's frozen handicap exceeds Team.${t1_id}.team_handicap_per_game 54 by a bowler who does not exist"
            - "GET /series-entries?match_id=${mt2_id}&team_id=${t1_id} returns exactly 3 rows at positions 1, 2 and 3 with handicap_per_game_applied 36, 18 and 60, counts_toward_average true, true and false, and membership_id ${ms1_id}, ${ms2_id} and null"
            - "Match.${mt2_id}.home_team_handicap_per_game is still 0 - the opposing side never submitted"

      - name: corner_award_application_referential_gates_run_shape_then_league_then_relationship
        claim_type: priority_ordering
