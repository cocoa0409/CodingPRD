            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V5002", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /vessels/${v}/voyages/${vy}/inspections"
              payload: { inspection_kind: PORT_STATE_CONTROL, sampled_at: "2026-07-29T00:00:00Z", sampled_by_role: PSC_OFFICER, indicator_organism_concentration: 12.0, tss_mg_per_l: 10.0, findings: ["BWMS-03"] }
              as: PSCOfficer
              as_user_id: "psc-1"
              captures: { i1: "$.data.id" }
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i1}/evaluate"
              as: FlagSurveyor
              as_user_id: "fs-1"
            - call: "GET /vessels/${v}"
              as: ShoreComplianceOfficer
              captures: { posture1: "$.data.compliance_posture" }
            - call: "GET /vessels/${v}/deficiencies"
              as: VesselMaster
              captures: { def: "$.data[0].id", def_p1: "$.data[0].is_priority_one" }
            - call: "POST /vessels/${v}/deficiencies/${def}/begin-rectification"
              as: VesselMaster
            - call: "GET /vessels/${v}/deficiencies"
              as: VesselMaster
              captures: { def_v: "$.data[0].version" }
            - call: "POST /vessels/${v}/deficiencies/${def}/claim-rectified"
              payload: { expected_deficiency_version: "${def_v}" }
              as: VesselMaster
              as_user_id: "master-1"
          trigger:
            - call: "POST /vessels/${v}/deficiencies/${def}/verify"
              as: PSCOfficer
              as_user_id: "psc-9"
              captures: { def_status: "$.data.rectification_status", def_verified: "$.data.verified_at" }
            - call: "GET /vessels/${v}"
              as: ShoreComplianceOfficer
              captures: { posture2: "$.data.compliance_posture" }
          assert:
            - "${def_p1} == true (A15 is priority-one)"
            - "${posture1} == RESTRICTED (P1 OPEN after evaluate)"
            - "${def_status} == VERIFIED"
            - "${def_verified} == 2026-08-01T00:00:00Z (current logical clock)"
            - "${posture2} == OPEN (rollup: p1_open == 0 after verify; MAJOR sampling record does not gate posture)"

  # ============================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: authorization_beats_segregation_of_duties
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Category pair auth vs business_safety: the verify call is made by a role that may never verify
          (VesselMaster, fails priority 2) AND with the same X-User-ID that claimed rectification
          (master-1, would fail priority 5 SoD). Priority 2 wins: ERR_UNAUTHORIZED, not
          ERR_SEGREGATION_OF_DUTIES — both are HTTP 403, so the error_id is the discriminating observable.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V6001 IN_PROGRESS"
            - "PSC deficiency in RECTIFIED state, claimed by X-User-ID master-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000011", vessel_name: "MV Kestrel", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V6001", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /vessels/${v}/voyages/${vy}/inspections"
              payload: { inspection_kind: PORT_STATE_CONTROL, sampled_at: "2026-07-29T00:00:00Z", sampled_by_role: PSC_OFFICER, indicator_organism_concentration: 12.0, tss_mg_per_l: 10.0, findings: ["BWMS-04"] }
              as: PSCOfficer
              as_user_id: "psc-1"
              captures: { i1: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i1}/evaluate"
              as: FlagSurveyor
              as_user_id: "fs-1"
            - call: "GET /vessels/${v}/deficiencies"
              as: VesselMaster
              captures: { def: "$.data[0].id" }
            - call: "POST /vessels/${v}/deficiencies/${def}/begin-rectification"
              as: VesselMaster
            - call: "GET /vessels/${v}/deficiencies"
              as: VesselMaster
              captures: { def_v: "$.data[0].version" }
            - call: "POST /vessels/${v}/deficiencies/${def}/claim-rectified"
              payload: { expected_deficiency_version: "${def_v}" }
              as: VesselMaster
              as_user_id: "master-1"
          trigger:
            - call: "POST /vessels/${v}/deficiencies/${def}/verify"
              as: VesselMaster
              as_user_id: "master-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_UNAUTHORIZED (priority 2 auth beats priority 5 business_safety SoD)"
            - "HTTP status == 403"
            - "PortStateControlDeficiency.${def}.rectification_status unchanged == RECTIFIED"

      - name: event_window_beats_volume_capacity
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_EVENT_OUT_OF_WINDOW]
          - errors[ERR_VOLUME_EXCEEDS_CAPACITY]
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal: one ballast-event POST violates both
          priority 7 (occurred_at 2026-08-05 is after the logical clock 2026-08-01 — future event) and
          priority 16 (volume 31000 > capacity 30000). Priority 7 wins: ERR_EVENT_OUT_OF_WINDOW (422).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V6002 IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000012", vessel_name: "MV Lark", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V6002", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w1: $.data.version }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-08-05T00:00:00Z", tank_id: "T1", volume_m3: 31000, salinity_ppt: 32.0, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_EVENT_OUT_OF_WINDOW (priority 7 business_temporal beats priority 16 business_fiscal)"
            - "HTTP status == 422"
            - "GET ballast-events for voyage returns total_count == 0 (rejected event not persisted)"

      - name: existence_beats_state_on_hierarchy_mismatch
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair existence vs state: the target report is in SUBMITTED state (a second submit
          would violate the state machine) AND it is addressed under the WRONG vessel (ancestor chain
          vessel B -> voyage-of-A -> report-of-A fails existence). Priority 3 wins: ERR_NOT_FOUND (404),
          not ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessels A (MV Merlin) and B (MV Nighthawk), each with APPROVED plan"
            - "Voyage V6003 under vessel A, IN_PROGRESS; its PRE_ARRIVAL report already SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000013", vessel_name: "MV Merlin", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { vA: $.data.id, vA_ver: $.data.version }
            - call: "POST /vessels/${vA}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${vA_ver}" }
              as: ShoreComplianceOfficer
              captures: { pA: $.data.id }
            - call: "POST /vessels/${vA}/plans/${pA}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${vA}/plans/${pA}/approve"
              as: FlagSurveyor
            - call: "POST /vessels"
              payload: { imo_number: "9000014", vessel_name: "MV Nighthawk", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { vB: $.data.id }
            - call: "POST /vessels/${vA}/voyages"
              payload: { voyage_number: "V6003", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-10T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vyA: $.data.id }
            - call: "POST /vessels/${vA}/voyages/${vyA}/depart"
              as: VesselMaster
            - call: "GET /vessels/${vA}/voyages/${vyA}/reports"
              payload: { report_type: PRE_ARRIVAL }
              as: VesselMaster
              captures: { repA: "$.data[0].id" }
            - call: "POST /vessels/${vA}/voyages/${vyA}/reports/${repA}/submit"
              payload: { payload_summary: { note: "pre-arrival" } }
              as: VesselMaster
          trigger:
            - call: "POST /vessels/${vB}/voyages/${vyA}/reports/${repA}/submit"
              payload: { payload_summary: { note: "duplicate under wrong vessel" } }
              as: VesselMaster
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_NOT_FOUND (priority 3 existence beats priority 4 state)"
            - "HTTP status == 404"
            - "BallastWaterReport.${repA}.status unchanged == SUBMITTED"

  # ============================================================
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sampling_organism_exactly_at_limit_exceeded
        grounds:
          - calculations.sampling_exceedance_threshold
          - state_machines.SamplingInspection.RECORDED_to_EVALUATED
        distinguishing_aspect: |
          Metric indicator_organism_concentration via POST .../inspections/{id}/evaluate: the comparison
          is >= (not >) — a reading of exactly 10.0 cfu/100mL IS an exceedance, 9.999 is not. Asserted on
          two identical inspections differing only in the 0.001 around the limit.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V7001 IN_PROGRESS"
            - "I1: FLAG_STATE organism 10.0 tss 10.0; I2: FLAG_STATE organism 9.999 tss 10.0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000015", vessel_name: "MV Osprey", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V7001", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /vessels/${v}/voyages/${vy}/inspections"
              payload: { inspection_kind: FLAG_STATE, sampled_at: "2026-07-29T00:00:00Z", sampled_by_role: FLAG_SURVEYOR, indicator_organism_concentration: 10.0, tss_mg_per_l: 10.0, findings: [] }
              as: FlagSurveyor
              as_user_id: "fs-rec-3"
              captures: { i1: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/inspections"
              payload: { inspection_kind: FLAG_STATE, sampled_at: "2026-07-29T01:00:00Z", sampled_by_role: FLAG_SURVEYOR, indicator_organism_concentration: 9.999, tss_mg_per_l: 10.0, findings: [] }
              as: FlagSurveyor
              as_user_id: "fs-rec-3"
              captures: { i2: $.data.id }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i1}/evaluate"
              as: FlagSurveyor
              as_user_id: "fs-eval-3"
              captures: { ex1: $.data.exceeded }
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i2}/evaluate"
              as: FlagSurveyor
              as_user_id: "fs-eval-3"
              captures: { ex2: $.data.exceeded }
          assert:
            - "${ex1} == true (organism 10.0 >= ORGANISM_LIMIT 10 — boundary is inclusive)"
            - "${ex2} == false (organism 9.999 < 10)"
            - "Exactly one SAMPLING_EXCEEDANCE NoncomplianceRecord exists (from I1 only)"

      - name: sulfur_eca_exactly_at_limit_compliant
        grounds:
          - calculations.sulfur_compliance_evaluation
          - state_machines.EmissionsFuelRecord.PENDING_EVAL_to_COMPLIANT
          - state_machines.EmissionsFuelRecord.PENDING_EVAL_to_NONCOMPLIANT
        distinguishing_aspect: |
          Metric sulfur_content_pct via POST .../emissions/{id}/evaluate (distinct endpoint and metric
          from the sibling): the ECA boundary uses <= — sulfur exactly 0.10% with inside_eca_hours=10 is
          COMPLIANT; 0.101% is NONCOMPLIANT and spawns a DETERMINATION_NONCOMPLIANT record (severity MAJOR
          per the transition's declared side effect).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V7002 IN_PROGRESS"
            - "E1: VLSFO sulfur 0.10, inside 10 / outside 5, scrubber=false; E2: same but sulfur 0.101"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000016", vessel_name: "MV Petrel", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V7002", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /vessels/${v}/voyages/${vy}/emissions"
              payload: { fuel_type: VLSFO, sulfur_content_pct: 0.10, consumed_volume_mt: 600, inside_eca_hours: 10, outside_eca_hours: 5, scrubber_installed: false }
              as: VesselMaster
              captures: { e1: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/emissions"
              payload: { fuel_type: VLSFO, sulfur_content_pct: 0.101, consumed_volume_mt: 600, inside_eca_hours: 10, outside_eca_hours: 5, scrubber_installed: false }
              as: VesselMaster
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/emissions/${e1}/evaluate"
              as: ShoreComplianceOfficer
              captures: { s1: $.data.compliance_status }
            - call: "POST /vessels/${v}/voyages/${vy}/emissions/${e2}/evaluate"
              as: ShoreComplianceOfficer
              captures: { s2: $.data.compliance_status }
            - call: "GET /vessels/${v}/voyages/${vy}/noncompliance"
              as: ShoreComplianceOfficer
              captures: { nc_sev: "$.data[0].severity" }
          assert:
            - "${s1} == COMPLIANT (sulfur 0.10 <= ECA_LIMIT 0.10 — boundary is inclusive)"
            - "${s2} == NONCOMPLIANT (0.101 > 0.10 with inside_eca_hours > 0)"
            - "${nc_sev} == MAJOR (side effect of PENDING_EVAL -> NONCOMPLIANT pins severity=MAJOR)"

      - name: exchange_distance_exactly_at_plan_minimum
        grounds:
          - calculations.exchange_vs_treatment_determination
        distinguishing_aspect: |
          Metric distance_from_shore_nm via POST .../ballast-events (determination recompute): exchange
          credit requires distance >= governing plan.exchange_distance_nm (200) — an EXCHANGE_COMPLETE at
          exactly 200.0 nm makes the voyage EXCHANGE_COMPLIANT; at 199.999 nm the same volumes fall to
          NONCOMPLIANT_NO_METHOD. Two voyages differ only in the 0.001 nm around the threshold.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; EXCHANGE_ONLY vessel with APPROVED plan (exchange_distance_nm=200)"
            - "Voyage V7003A: UPTAKE 400, EXCHANGE_COMPLETE @200.0nm, DISCHARGE 400"
            - "Voyage V7003B: UPTAKE 400, EXCHANGE_COMPLETE @199.999nm, DISCHARGE 400"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000017", vessel_name: "MV Razorbill", bwms_type: EXCHANGE_ONLY, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V7003A", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vyA: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vyA}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vyA}"
              as: VesselMaster
              captures: { wa1: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vyA}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T1", volume_m3: 400, salinity_ppt: 32.0, source_port_locode: USNYC, expected_voyage_version: "${wa1}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vyA}"
              as: VesselMaster
              captures: { wa2: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vyA}/ballast-events"
              payload: { event_kind: EXCHANGE_COMPLETE, occurred_at: "2026-07-29T06:00:00Z", tank_id: "T1", volume_m3: 400, latitude: 30.0, longitude: -150.0, distance_from_shore_nm: 200.0, expected_voyage_version: "${wa2}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vyA}"
              as: VesselMaster
              captures: { wa3: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vyA}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-30T06:00:00Z", tank_id: "T1", volume_m3: 400, latitude: 33.7, longitude: -118.2, distance_from_shore_nm: 250, expected_voyage_version: "${wa3}" }
