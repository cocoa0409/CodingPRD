            - { call: "POST /reservations/${rb}/confirm", payload: {}, as: Member, as_user_id: "${m2}", captures: { err_overlap: "$.data.error_id" } }
            - { call: "POST /reservations/${rb}/cancel", payload: {}, as: Member, as_user_id: "${m2}" }
            - { call: "POST /reservations", payload: { member_id: "${m2}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T12:00:00Z", end_time: "2026-05-05T14:00:00Z" }, as: Member, as_user_id: "${m2}", captures: { rd: "$.data.id" } }
