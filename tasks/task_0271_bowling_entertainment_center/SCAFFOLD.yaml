# =============================================================================
# Scaffold: Bowling & Entertainment Center Booking (task_0271)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  Bowling & Entertainment Center Booking: lane/bay reservation, time-block &
  per-game/per-hour pricing, party package & food add-on, shoe/equipment rental,
  league-night scheduling, walk-in vs reservation, deposit, cancellation

domain_name: bowling-entertainment-center
api_prefix: ""
# Flat peer topology: entities live at their own top-level collection paths
# (/lanes, /bays, /customers, /reservations, /leagues, …) rather than nested
# under one resource, so api_prefix is empty and each collection segment is the
# entity's own path root.

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Flat peer entities (Lane, Bay, Reservation, League, …) linked by foreign keys;
  # no nesting of reservation-owned resources inside lane/bay URL paths.

  state_machine_shape: cyclic
  # Reservation carries a revision loop (CONFIRMED -> HELD -> CONFIRMED);
  # LeagueNight branches SCHEDULED -> {PLAYED, FORFEITED, RAINED_OUT} with
  # divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # Lane 1->* Reservation, League 1->* LeagueNight
    - cross_aggregate    # Reservation references Lane/Bay across aggregate boundary
    - polymorphic        # Reservation.resource_kind selects Lane vs Bay target

  role_model: peer_roles
  # Customer owns its own reservations; FrontDesk operates the floor;
  # LeagueAdmin owns leagues; CenterManager owns resource/pricing config.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration: rate card ---------------------------------------------
  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Rate-card label" }
      - { name: per_game_cents, type: integer, source: input, description: "Price per game per bowler", constraints: ">= 0" }
      - { name: per_hour_cents, type: integer, source: input, description: "Price per lane-hour block", constraints: ">= 0" }
      - { name: block_minutes, type: integer, source: input, description: "Length of one billable per-hour block", default: 60, constraints: "> 0" }
      - { name: peak_multiplier_bps, type: integer, source: input, description: "Basis-point surcharge applied to per-hour pricing during peak windows (10000 = x1.0)", default: 10000, constraints: ">= 10000" }
      - { name: peak_start_hour, type: integer, source: input, description: "Local hour [0-23] at which the peak window opens (inclusive)", default: 18, constraints: "0..23" }
      - { name: peak_end_hour, type: integer, source: input, description: "Local hour [0-23] at which the peak window closes (exclusive)", default: 23, constraints: "0..23" }
      - { name: deposit_pct_bps, type: integer, source: input, description: "Deposit as basis points of quoted subtotal (2000 = 20%)", default: 2000, constraints: "0..10000" }

  # --- Resource: bowling lane -----------------------------------------------
  - name: Lane
    parent: null
    common_fields: true
    fields:
      - { name: number, type: integer, source: input, description: "Physical lane number, unique", constraints: ">= 1, unique" }
      - { name: max_bowlers, type: integer, source: input, description: "Seating/scoring cap on this lane", default: 6, constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | OUT_OF_SERVICE", default: IN_SERVICE, constraints: "IN_SERVICE | OUT_OF_SERVICE" }

  # --- Resource: arcade / activity bay --------------------------------------
  - name: Bay
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Bay label (e.g. Laser Tag A)", constraints: "unique" }
      - { name: capacity, type: integer, source: input, description: "Maximum guests in the bay at once", default: 12, constraints: ">= 1" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, description: "Mandatory idle gap required after each booking before the next may start", default: 15, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | OUT_OF_SERVICE", default: IN_SERVICE, constraints: "IN_SERVICE | OUT_OF_SERVICE" }

  # --- Actor: customer account ----------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email, unique", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: deposit_balance_cents, type: integer, source: computed, description: "Held deposits attributable to this customer; equals sum of held_deposit_cents over reservations in {HELD, CONFIRMED, CHECKED_IN}", default: 0 }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refundable credit accumulated from refunded deposits", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }

  # --- Party package configuration ------------------------------------------
  - name: PartyPackage
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Package label (e.g. Birthday Bash)" }
      - { name: base_cents, type: integer, source: input, description: "Flat package base price", constraints: ">= 0" }
      - { name: included_guests, type: integer, source: input, description: "Guests covered by base price", constraints: ">= 1" }
      - { name: extra_guest_cents, type: integer, source: input, description: "Per-guest charge beyond included_guests", constraints: ">= 0" }
      - { name: max_guests, type: integer, source: input, description: "Hard cap on guests this package admits", constraints: ">= included_guests" }
      - { name: included_lane_hours, type: integer, source: input, description: "Lane-hours bundled into the package at no extra lane charge", default: 2, constraints: ">= 0" }

  # --- Food add-on catalog item ---------------------------------------------
  - name: FoodItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Menu item name" }
      - { name: unit_cents, type: integer, source: input, description: "Per-unit price before tax", constraints: ">= 0" }
      - { name: taxable, type: boolean, source: input, description: "Whether sales tax applies to this item", default: true }

  # --- Rental inventory item (shoes / balls / bumpers) ----------------------
  - name: RentalItem
    parent: null
    common_fields: true
    fields:
      - { name: kind, type: enum, source: input, description: "SHOES | BALL | BUMPER", constraints: "SHOES | BALL | BUMPER" }
      - { name: label, type: string, source: input, description: "Size/variant label (e.g. Mens 10)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit rental price", constraints: ">= 0" }
      - { name: total_count, type: integer, source: input, description: "Total physical units owned (conserved quantity)", constraints: ">= 0" }
      - { name: out_on_rent_count, type: integer, source: computed, description: "Units currently assigned to OPEN rental lines", default: 0 }
      - { name: available_count, type: integer, source: computed, description: "total_count - out_on_rent_count; never negative", default: 0 }

  # --- Reservation (lane or bay booking) ------------------------------------
  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the booking owner" }
      - { name: rate_card_id, type: string, source: input, description: "FK -> RateCard.id; rate card pinned at quote time" }
      - { name: resource_kind, type: enum, source: input, description: "LANE | BAY", constraints: "LANE | BAY" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; set when resource_kind=LANE, else null" }
      - { name: bay_id, type: string, source: input, description: "FK -> Bay.id; set when resource_kind=BAY, else null" }
      - { name: party_package_id, type: string, source: input, description: "FK -> PartyPackage.id; null for a plain booking" }
      - { name: origin, type: enum, source: input, description: "RESERVATION (booked ahead) | WALK_IN (same-day floor)", default: RESERVATION, constraints: "RESERVATION | WALK_IN" }
      - { name: pricing_mode, type: enum, source: input, description: "PER_GAME | PER_HOUR — which quote variant governs the lane charge", constraints: "PER_GAME | PER_HOUR" }
      - { name: start_at, type: datetime, source: input, description: "Block start (ISO8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Block end (ISO8601 UTC), strictly after start_at" }
      - { name: bowler_count, type: integer, source: input, description: "Number of bowlers/guests", constraints: ">= 1" }
      - { name: game_count, type: integer, source: input, description: "Games per bowler (PER_GAME mode only)", default: 0, constraints: ">= 0" }
      - { name: guest_count, type: integer, source: input, description: "Party guests (party_package bookings only)", default: 0, constraints: ">= 0" }
      - { name: lane_subtotal_cents, type: integer, source: computed, description: "Lane/bay time charge from the chosen pricing_mode variant" }
      - { name: package_subtotal_cents, type: integer, source: computed, description: "Party package charge; 0 when no package" }
      - { name: food_subtotal_cents, type: integer, source: computed, description: "Food add-on charge incl. tax (rounding order pinned in §1.3)" }
      - { name: rental_subtotal_cents, type: integer, source: computed, description: "Sum of OPEN rental line charges" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "lane + package + food + rental subtotals" }
      - { name: held_deposit_cents, type: integer, source: computed, description: "Deposit captured at HOLD; 0 once CANCELLED/refunded" }
      - { name: refund_cents, type: integer, source: computed, description: "Refund credited on cancellation per notice tier; 0 until CANCELLED", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | HELD | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | EXPIRED | NO_SHOW", default: DRAFT, constraints: "DRAFT | HELD | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | EXPIRED | NO_SHOW" }
      - { name: cancelled_at, type: datetime, source: system, description: "When the booking was cancelled; null otherwise" }

  # --- Food line attached to a reservation ----------------------------------
  - name: FoodOrderLine
    parent: null
    common_fields: false
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; owning booking" }
      - { name: food_item_id, type: string, source: input, description: "FK -> FoodItem.id; menu item ordered" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: unit_cents_snapshot, type: integer, source: system, description: "FoodItem.unit_cents copied at line creation" }
      - { name: taxable_snapshot, type: boolean, source: system, description: "FoodItem.taxable copied at line creation" }
      - { name: line_total_cents, type: integer, source: computed, description: "Per-line charge incl. tax, rounded per §1.3 food_total rule" }

  # --- Rental line attached to a reservation --------------------------------
  - name: RentalLine
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; owning booking" }
      - { name: rental_item_id, type: string, source: input, description: "FK -> RentalItem.id; item rented" }
      - { name: quantity, type: integer, source: input, description: "Units taken", constraints: ">= 1" }
      - { name: unit_price_snapshot, type: integer, source: system, description: "RentalItem.unit_price_cents copied at line creation" }
      - { name: line_total_cents, type: computed, source: computed, description: "quantity * unit_price_snapshot" }
      - { name: status, type: enum, source: system, description: "OPEN (units out) | RETURNED (units back)", default: OPEN, constraints: "OPEN | RETURNED" }

  # --- League ---------------------------------------------------------------
  - name: League
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "League name" }
      - { name: rate_card_id, type: string, source: input, description: "FK -> RateCard.id; rate card used to price league nights" }
      - { name: season_night_count, type: integer, source: input, description: "Planned number of league nights in the season", constraints: ">= 1" }
      - { name: lanes_per_night, type: integer, source: input, description: "Lanes reserved for each night", constraints: ">= 1" }
      - { name: weekly_fee_cents, type: integer, source: input, description: "Flat per-night league fee charged to the league", constraints: ">= 0" }
      - { name: season_fee_quote_cents, type: integer, source: computed, description: "Forward-looking projected total season fee (see §1.3 league_fee variants)" }
      - { name: season_fee_accrued_cents, type: integer, source: computed, description: "Chronological accrued fee from nights actually PLAYED (see §1.3)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED", default: DRAFT, constraints: "DRAFT | ACTIVE | CLOSED" }

  # --- League night (one scheduled night, reserves lanes) -------------------
  - name: LeagueNight
    parent: null
    common_fields: true
    fields:
      - { name: league_id, type: string, source: input, description: "FK -> League.id; owning league" }
      - { name: night_index, type: integer, source: input, description: "1-based ordinal of this night within the season", constraints: ">= 1, unique per league" }
      - { name: start_at, type: datetime, source: input, description: "Night start (ISO8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Night end (ISO8601 UTC), strictly after start_at" }
      - { name: reserved_lane_ids, type: array, source: system, description: "Lane ids blocked for this night" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PLAYED | FORFEITED | RAINED_OUT", default: SCHEDULED, constraints: "SCHEDULED | PLAYED | FORFEITED | RAINED_OUT" }
      - { name: night_fee_cents, type: computed, source: computed, description: "Fee booked for this night; weekly_fee_cents on PLAYED/FORFEITED, 0 on RAINED_OUT" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Reservation: cyclic revision loop (non-linear) -----------------------
  - entity: Reservation
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, EXPIRED, NO_SHOW]
    transitions:
      - from: DRAFT
        to: HELD
        trigger: "POST /reservations/{id}/hold"
        actor: Customer
        preconditions:
          - "Customer.status == ACTIVE"
          - "Target resource exists and status == IN_SERVICE (Lane when resource_kind=LANE, Bay when resource_kind=BAY)"
          - "No temporal-overlap conflict on the target resource (§1.4 P50/P51)"
          - "bowler_count <= Lane.max_bowlers (LANE) or bowler_count <= Bay.capacity (BAY)"
        side_effects:
          - "Recompute quoted_total_cents via §1.3 reservation_quote + party_package_total + food_total + rental_total"
          - "held_deposit_cents = §1.3 deposit_amount over quoted_total_cents; sets Customer.deposit_balance_cents += held_deposit_cents (Rule 9 deposit_ledger)"
          - "Increments Reservation.version by 1"

      - from: HELD
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: Customer
        preconditions:
          - "expected_reservation_version matches current Reservation.version (OCC, §1.2.1)"
          - "Target resource status == IN_SERVICE (cross-entity dep, §1.4 P40 Reservation->Lane/Bay)"
          - "Still no temporal-overlap conflict on the target resource"
        side_effects:
          - "status -> CONFIRMED; deposit remains held"
          - "Increments Reservation.version by 1"

      - from: CONFIRMED
        to: HELD
        trigger: "POST /reservations/{id}/revise"
        actor: Customer
        note: "Revision loop — re-opens a confirmed booking to change time/mode/party; this is the cyclic edge."
        preconditions:
          - "expected_reservation_version matches current Reservation.version (OCC)"
          - "Reservation is not CHECKED_IN"
        side_effects:
          - "Applies new start_at/end_at/pricing_mode/bowler_count/game_count from body"
          - "Re-runs temporal-overlap check on the (possibly new) window"
          - "Recompute quoted_total_cents and held_deposit_cents; reconcile Customer.deposit_balance_cents by the delta (Rule 9 deposit_ledger)"
          - "status -> HELD; Increments Reservation.version by 1"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check-in"
        actor: FrontDesk
        note: "CHECKIN_WINDOW_MINUTES = 30 (a guest may check in up to 30 minutes before start_at)."
        preconditions:
          - "current_utc >= start_at - CHECKIN_WINDOW_MINUTES(=30) and current_utc <= end_at"
        side_effects:
          - "status -> CHECKED_IN; Increments Reservation.version by 1"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /reservations/{id}/complete"
        actor: FrontDesk
        preconditions:
          - "All RentalLine for this reservation are RETURNED (cross-entity dep, §1.4 P41 Reservation->RentalLine)"
        side_effects:
          - "status -> COMPLETED; deposit applied to bill, Customer.deposit_balance_cents -= held_deposit_cents"
          - "Increments Reservation.version by 1"

      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: "Customer or FrontDesk"
        preconditions:
          - "Reservation.status in {HELD, CONFIRMED} (cannot cancel after CHECKED_IN — §1.4 P30 state beats fiscal)"
        side_effects:
          - "refund_cents = §1.3 cancellation_refund(notice tier over held_deposit_cents)"
          - "Customer.deposit_balance_cents -= held_deposit_cents; Customer.wallet_credit_cents += refund_cents (Rule 9 deposit_ledger compensation)"
          - "All OPEN RentalLine on this reservation -> RETURNED, restoring RentalItem availability (Rule 9 rental_inventory compensation)"
          - "Releases the resource time-block; CASCADE: promote the earliest eligible WAITLISTED reservation on the same resource+window (see waitlist_promotion below)"
          - "status -> CANCELLED; cancelled_at = current_utc; Increments Reservation.version by 1"

      - from: HELD
        to: EXPIRED
        trigger: "system (Customer suspended) or POST /_clock/advance crossing hold TTL"
        actor: system
        note: "Cascade target: customer suspension expires their HELD bookings. HOLD_TTL_MINUTES = 60: a HELD reservation whose hold has aged >= 60 minutes (current_utc - updated_at-of-hold) is expired by a /_clock/advance sweep."
        preconditions:
          - "Reservation.status == HELD"
        side_effects:
          - "refund_cents = held_deposit_cents (full forfeit waiver on system expiry)"
          - "Customer.deposit_balance_cents -= held_deposit_cents; Customer.wallet_credit_cents += refund_cents"
          - "All OPEN RentalLine -> RETURNED, restoring availability"
          - "status -> EXPIRED; Increments Reservation.version by 1"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /reservations/{id}/no-show"
        actor: FrontDesk
        preconditions:
          - "current_utc > end_at"
          - "Reservation never reached CHECKED_IN"
        side_effects:
          - "refund_cents = 0 (deposit forfeited entirely)"
          - "Customer.deposit_balance_cents -= held_deposit_cents; no wallet credit"
          - "Releases the resource time-block (no waitlist promotion: window has passed)"
          - "status -> NO_SHOW; Increments Reservation.version by 1"

  # --- Reservation waitlist sub-state (promotion target of cancel cascade) ---
  - entity: Reservation
    initial_state: WAITLISTED
    terminal_states: []
    note: "A Reservation created via POST /reservations/{id}/waitlist enters WAITLISTED on a contended window; it is NOT in the main lifecycle until promoted. Promotion is a system transition fired by the cancel/expire cascade."
    transitions:
      - from: WAITLISTED
        to: HELD
        trigger: "system (cancel/expire of a blocking reservation frees the window — waitlist_promotion)"
        actor: system
        preconditions:
          - "Freed window now has no temporal-overlap conflict for this waitlisted reservation"
          - "This reservation is the earliest WAITLISTED by created_at ASC among candidates on the same resource+window"
        side_effects:
          - "Recompute quoted_total_cents and held_deposit_cents"
          - "held_deposit_cents debited: Customer.deposit_balance_cents += held_deposit_cents (Rule 9 deposit_ledger — cascade depth-3 final hop)"
          - "status -> HELD; Increments Reservation.version by 1"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: "Customer or FrontDesk"
        preconditions: []
        side_effects:
          - "No deposit was held while WAITLISTED, so no ledger change"
          - "status -> CANCELLED; cancelled_at = current_utc; Increments Reservation.version by 1"

  # --- Customer: linear with suspension fork --------------------------------
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{id}/suspend"
        actor: CenterManager
        preconditions: []
        side_effects:
          - "CASCADE depth-3: every HELD reservation of this customer -> EXPIRED; each EXPIRED transition releases that reservation's held deposit (deposit_balance debit + wallet credit) AND returns its OPEN rental lines (RentalItem.available_count restored)"
          - "Increments Customer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /customers/{id}/reinstate"
        actor: CenterManager
        preconditions: []
        side_effects:
          - "Increments Customer.version by 1"

  # --- League: linear lifecycle ---------------------------------------------
  - entity: League
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /leagues/{id}/activate"
        actor: LeagueAdmin
        preconditions:
          - "League has at least one LeagueNight scheduled"
        side_effects:
          - "season_fee_quote_cents recomputed via §1.3 league_fee forward_looking variant"
          - "Increments League.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /leagues/{id}/close"
        actor: LeagueAdmin
        preconditions:
          - "No LeagueNight remains SCHEDULED"
        side_effects:
          - "season_fee_accrued_cents finalised via §1.3 league_fee chronological variant"
          - "Increments League.version by 1"

  # --- LeagueNight: branching fork-join (non-linear) ------------------------
  - entity: LeagueNight
    initial_state: SCHEDULED
    terminal_states: [PLAYED, FORFEITED, RAINED_OUT]
    transitions:
      - from: SCHEDULED
        to: PLAYED
        trigger: "POST /league-nights/{id}/mark-played"
        actor: LeagueAdmin
        preconditions:
          - "Parent League.status == ACTIVE (cross-entity dep, §1.4 P42 LeagueNight->League)"
          - "current_utc >= start_at"
        side_effects:
          - "night_fee_cents = League.weekly_fee_cents"
          - "League.season_fee_accrued_cents += night_fee_cents (chronological accrual)"
          - "Releases reserved_lane_ids blocks (lanes free for that past window)"
          - "Increments LeagueNight.version by 1"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "POST /league-nights/{id}/forfeit"
        actor: LeagueAdmin
        preconditions:
          - "Parent League.status == ACTIVE"
        side_effects:
          - "night_fee_cents = League.weekly_fee_cents (forfeit still owes the fee)"
          - "League.season_fee_accrued_cents += night_fee_cents"
          - "Releases reserved_lane_ids blocks"
          - "Increments LeagueNight.version by 1"
      - from: SCHEDULED
        to: RAINED_OUT
        trigger: "POST /league-nights/{id}/rain-out"
        actor: LeagueAdmin
        preconditions:
          - "Parent League.status == ACTIVE"
        side_effects:
          - "night_fee_cents = 0 (no fee accrues for a rained-out night — divergent side-effect branch)"
          - "League.season_fee_accrued_cents unchanged"
          - "Releases reserved_lane_ids blocks"
          - "Increments LeagueNight.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: confirm-stale-reservation
    parent_entity: Reservation
    write_endpoint: "POST /reservations/{id}/confirm"
    occ_field: "expected_reservation_version"
    description: |
      Confirming a Reservation whose version has advanced since the client last
      observed it is rejected. A revise that re-priced the booking (or a system
      expiry) legitimately advances the reservation between the client's read and
      this confirm; the client's view is therefore stale and the confirm is
      rejected on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: revise-stale-reservation
    parent_entity: Reservation
    write_endpoint: "POST /reservations/{id}/revise"
    occ_field: "expected_reservation_version"
    description: |
      Revising a CONFIRMED Reservation whose version has advanced since the
      client last observed it is rejected. Another revise legitimately supersedes
      the prior under the revision-loop semantics, advancing the version; the
      current writer's view is stale and the revise is rejected on the mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Lane charge: dual pricing variant (Rule 1 instance A; Rule 2(a) & Rule 6 boundary) ---
  - name: reservation_quote
    trigger: "Reservation hold, revise, waitlist promotion"
    algorithm: tiered_pricing
    formula: |
      duration_minutes = (end_at - start_at) in whole minutes
      # PER_GAME variant:
      per_game_charge = per_game_cents * game_count * bowler_count
      # PER_HOUR variant (block-rounded, peak-aware):
      blocks = ceil(duration_minutes / block_minutes)          # boundary: 60 min -> 1 block, 61 -> 2
      peak = TRUE if any minute of [start_at, end_at) falls in [peak_start_hour, peak_end_hour) local
      hourly_rate = per_hour_cents * (peak_multiplier_bps / 10000 if peak else 1)
      per_hour_charge = round_half_up(blocks * hourly_rate)
      lane_subtotal_cents =
        per_game_charge   if pricing_mode == PER_GAME
        per_hour_charge   if pricing_mode == PER_HOUR
      # Party-package bundling: if a package supplies included_lane_hours,
      # the first ceil-equivalent (included_lane_hours*60 / block_minutes) blocks
      # are free; only excess blocks bill in PER_HOUR mode.
    input_set: "single reservation; rate fields read from the pinned RateCard"
    constants:
      BPS_DENOM: 10000
    precision: "integer cents, round_half_up on the multiplier product"
    variants:
      - name: per_game
        when: "pricing_mode == PER_GAME"
        difference: "Charges games*bowlers at per_game_cents; ignores duration and peak multiplier entirely."
      - name: per_hour
        when: "pricing_mode == PER_HOUR"
        difference: "Charges ceil(duration/block) blocks at peak-adjusted per_hour_cents; ignores game_count. Identical (lane,time,party) inputs yield a different total than per_game."

  # --- Party package total (Rule 2 mode (a): >=3 inputs, nested min/max, tiered) ---
  - name: party_package_total
    trigger: "Reservation hold/revise when party_package_id is set"
    algorithm: tiered_pricing
    formula: |
      billable_guests = max(0, min(guest_count, max_guests) - included_guests)
      package_subtotal_cents = base_cents + billable_guests * extra_guest_cents
      # guest_count is clamped to max_guests BEFORE subtracting included_guests,
      # so guests above max_guests are rejected at validation, never billed.
    input_set: "single reservation + its PartyPackage config"
    constants: {}
    precision: "integer cents, exact"
    variants: []

  # --- Food total: nested rounding order pinned (Rule 2 mode (b)) ------------
  - name: food_total
    trigger: "FoodOrderLine create/delete; Reservation hold/revise"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round per-line, THEN sum. (round-then-sum,
      # NOT sum-then-round — these differ in cents when multiple taxable lines
      # each carry a fractional tax cent.)
      for each FoodOrderLine L on the reservation:
        gross = L.unit_cents_snapshot * L.quantity
        tax   = round_half_up(gross * SALES_TAX_BPS / 10000) if L.taxable_snapshot else 0
        L.line_total_cents = gross + tax
      food_subtotal_cents = sum(L.line_total_cents for all lines)   # sum of already-rounded lines
    input_set: "all FoodOrderLine rows whose reservation_id == this reservation"
    constants:
      SALES_TAX_BPS: 825        # 8.25% sales tax
    precision: "integer cents, round_half_up per line BEFORE summing"
    variants: []

  # --- Rental total (Rule 9 rental_inventory conservation reference) --------
  - name: rental_total
    trigger: "RentalLine create/return; Reservation hold/revise"
    algorithm: aggregation
    formula: |
      rental_subtotal_cents = sum(L.unit_price_snapshot * L.quantity
                                  for RentalLine L where reservation_id == this and status == OPEN)
      # RentalItem invariant (conserved): for each item,
      #   total_count == available_count + out_on_rent_count
      # out_on_rent_count = sum(L.quantity for OPEN RentalLine referencing the item across all reservations)
    input_set: "OPEN RentalLine rows on the reservation"
    constants: {}
    precision: "integer cents, exact"
    variants: []

  - name: quoted_total
    trigger: "Reservation hold/revise/waitlist promotion, any subtotal change"
    algorithm: aggregation
    formula: |
      quoted_total_cents = lane_subtotal_cents + package_subtotal_cents
                         + food_subtotal_cents + rental_subtotal_cents
    input_set: "the four reservation subtotals"
    constants: {}
    precision: "integer cents, exact"
    variants: []

  # --- Deposit (Rule 6 percentage threshold; Rule 9 deposit_ledger source) --
  - name: deposit_amount
    trigger: "Reservation hold / waitlist promotion"
    algorithm: threshold
    formula: |
      held_deposit_cents = round_half_up(quoted_total_cents * deposit_pct_bps / 10000)
    input_set: "reservation quoted_total + pinned RateCard.deposit_pct_bps"
    constants:
      BPS_DENOM: 10000
    precision: "integer cents, round_half_up"
    variants: []

  # --- Cancellation refund (Rule 6 notice-window boundary; Rule 9 compensation) ---
  - name: cancellation_refund
    trigger: "POST /reservations/{id}/cancel"
    algorithm: threshold
    formula: |
      notice_minutes = (start_at - cancelled_at) in whole minutes   # cancelled_at == current_utc
      # BOUNDARY PINNED with >= : exactly FULL_REFUND_NOTICE_MINUTES of notice -> full refund.
      if notice_minutes >= FULL_REFUND_NOTICE_MINUTES:
        refund_cents = held_deposit_cents                 # 100%
      elif notice_minutes >= PARTIAL_REFUND_NOTICE_MINUTES:
        refund_cents = round_half_up(held_deposit_cents * PARTIAL_REFUND_BPS / 10000)   # 50%
      else:
        refund_cents = 0                                  # forfeit
    input_set: "single reservation: held_deposit_cents, start_at, cancelled_at"
    constants:
      FULL_REFUND_NOTICE_MINUTES: 1440      # 24h
      PARTIAL_REFUND_NOTICE_MINUTES: 120    # 2h
      PARTIAL_REFUND_BPS: 5000              # 50%
      BPS_DENOM: 10000
    precision: "integer cents, round_half_up on partial tier"
    variants: []

  # --- League fee: dual variant on a DIFFERENT entity domain (Rule 1 instance B) ---
  - name: league_fee
    trigger: "League activate (forward_looking) / League close (chronological)"
    algorithm: forward_looking
    formula: |
      # season_fee_quote_cents (forward-looking, at activation):
      season_fee_quote_cents = weekly_fee_cents * season_night_count
      # season_fee_accrued_cents (chronological, accrues per night actually resolved):
      season_fee_accrued_cents = sum(night_fee_cents for LeagueNight in {PLAYED, FORFEITED})
        # PLAYED and FORFEITED nights each accrue weekly_fee_cents; RAINED_OUT accrues 0.
        # So accrued can diverge from the quote whenever any night is RAINED_OUT.
    input_set: "League + its LeagueNight rows"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: forward_looking_quote
        when: "League activation"
        difference: "Projects weekly_fee_cents * season_night_count assuming every planned night accrues; ignores per-night outcomes."
      - name: chronological_accrual
        when: "League close"
        difference: "Sums night_fee_cents only over nights actually PLAYED/FORFEITED; RAINED_OUT nights contribute 0, so accrual < quote whenever any night rains out — different result on the League entity for identical season size."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for the requested operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Entity-backed actor owns the target resource (Customer acting on a Reservation must equal Reservation.customer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-initiated reservation mutations"

  - priority: 10
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 20
    category: business_constraint
    check: "Request body well-formed; required fields present; enums in range; start_at < end_at; bowler_count >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/mutate endpoints"

  # State preconditions (P30..P32) sit ABOVE fiscal/temporal to encode Rule-5 conflicts
  - priority: 30
    category: state
    check: "Reservation in a state that admits the requested transition; cancel rejected once CHECKED_IN/COMPLETED/terminal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "reservation transition endpoints"

  - priority: 31
    category: state
    check: "OCC: expected_reservation_version equals current Reservation.version on confirm/revise"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reservations/{id}/confirm, POST /reservations/{id}/revise"

  - priority: 32
    category: state
    check: "LeagueNight transition requires SCHEDULED; League transition requires correct source state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "league + league-night transition endpoints"

  # Cross-entity dependencies (P40..P42) — Rule 7
  - priority: 40
    category: business_referential
    check: "Reservation->resource: target Lane/Bay status == IN_SERVICE for hold/confirm"
    error_id: ERR_RESOURCE_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /reservations/{id}/hold, POST /reservations/{id}/confirm"

  - priority: 41
    category: business_referential
    check: "Reservation->RentalLine: complete requires all RentalLine RETURNED"
    error_id: ERR_RENTALS_OUTSTANDING
    http_status: 409
    applies_to: "POST /reservations/{id}/complete"

  - priority: 42
    category: business_referential
    check: "LeagueNight->League: mark-played/forfeit/rain-out require parent League.status == ACTIVE"
    error_id: ERR_LEAGUE_NOT_ACTIVE
    http_status: 409
    applies_to: "league-night transition endpoints"

  # Safety / capacity (P50..P53)
  - priority: 50
    category: business_temporal
    check: "Lane temporal overlap: half-open [start,end) intervals; reject when new window overlaps an existing blocking reservation on the same lane (back-to-back end==start allowed)"
    error_id: ERR_LANE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /reservations/{id}/hold, /revise (resource_kind=LANE)"

  - priority: 51
    category: business_temporal
    check: "Bay temporal overlap: closed intervals plus cleanup_buffer_minutes; reject when new window starts before prior_end + buffer or ends after next_start - buffer on the same bay"
    error_id: ERR_BAY_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /reservations/{id}/hold, /revise (resource_kind=BAY)"

  - priority: 52
    category: business_constraint
    check: "bowler_count <= Lane.max_bowlers (LANE) or guest_count/bowler_count <= Bay.capacity (BAY); party guest_count <= PartyPackage.max_guests"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /reservations/{id}/hold, /revise"

  - priority: 53
    category: business_constraint
    check: "RentalLine.quantity <= RentalItem.available_count at line creation"
    error_id: ERR_RENTAL_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rental-lines"

  - priority: 60
    category: business_fiscal
    check: "Customer.status == ACTIVE to hold a reservation or take a rental"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    applies_to: "POST /reservations/{id}/hold, POST /rental-lines"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- RateCard ----
  - { method: POST, path: "/rate-cards", description: "Create a rate card", roles: [CenterManager], code: 201,
      input: [name, per_game_cents, per_hour_cents, "block_minutes?", "peak_multiplier_bps?", "peak_start_hour?", "peak_end_hour?", "deposit_pct_bps?"],
      output: RateCard, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/rate-cards/{id}", description: "Get a rate card", roles: [CenterManager, FrontDesk, LeagueAdmin, Customer], code: 200, input: [], output: RateCard, side_effects: [] }
  - { method: GET, path: "/rate-cards", description: "List rate cards", roles: [CenterManager, FrontDesk, LeagueAdmin, Customer], code: 200, input: ["limit?", "offset?"], output: "RateCard[]", side_effects: [] }

  # ---- Lane ----
  - { method: POST, path: "/lanes", description: "Create a lane", roles: [CenterManager], code: 201, input: [number, "max_bowlers?"], output: Lane, side_effects: ["status=IN_SERVICE"] }
  - { method: GET, path: "/lanes/{id}", description: "Get a lane", roles: [CenterManager, FrontDesk, Customer, LeagueAdmin], code: 200, input: [], output: Lane, side_effects: [] }
  - { method: GET, path: "/lanes", description: "List lanes", roles: [CenterManager, FrontDesk, Customer, LeagueAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Lane[]", side_effects: [] }
  - { method: POST, path: "/lanes/{id}/set-status", description: "Put a lane in or out of service", roles: [CenterManager], code: 200, input: [status], output: Lane, side_effects: ["status -> IN_SERVICE|OUT_OF_SERVICE; increments Lane.version by 1"] }

  # ---- Bay ----
  - { method: POST, path: "/bays", description: "Create a bay", roles: [CenterManager], code: 201, input: [name, "capacity?", "cleanup_buffer_minutes?"], output: Bay, side_effects: ["status=IN_SERVICE"] }
  - { method: GET, path: "/bays/{id}", description: "Get a bay", roles: [CenterManager, FrontDesk, Customer, LeagueAdmin], code: 200, input: [], output: Bay, side_effects: [] }
  - { method: GET, path: "/bays", description: "List bays", roles: [CenterManager, FrontDesk, Customer, LeagueAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Bay[]", side_effects: [] }
  - { method: POST, path: "/bays/{id}/set-status", description: "Put a bay in or out of service", roles: [CenterManager], code: 200, input: [status], output: Bay, side_effects: ["status -> IN_SERVICE|OUT_OF_SERVICE; increments Bay.version by 1"] }

  # ---- Customer ----
  - { method: POST, path: "/customers", description: "Register a customer", roles: [FrontDesk, CenterManager], code: 201, input: [email, full_name], output: Customer, side_effects: ["status=ACTIVE, deposit_balance_cents=0, wallet_credit_cents=0"] }
  - { method: GET, path: "/customers/{id}", description: "Get a customer", roles: [CenterManager, FrontDesk, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: GET, path: "/customers", description: "List customers", roles: [CenterManager, FrontDesk], code: 200, input: ["status?", "limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: POST, path: "/customers/{id}/suspend", description: "Suspend a customer (cascade-expires HELD reservations)", roles: [CenterManager], code: 200, input: [],
      output: Customer, side_effects: ["status -> SUSPENDED", "CASCADE: HELD reservations -> EXPIRED, releasing deposits and returning rentals", "increments Customer.version by 1"] }
  - { method: POST, path: "/customers/{id}/reinstate", description: "Reinstate a suspended customer", roles: [CenterManager], code: 200, input: [], output: Customer, side_effects: ["status -> ACTIVE; increments Customer.version by 1"] }

  # ---- PartyPackage ----
  - { method: POST, path: "/party-packages", description: "Create a party package", roles: [CenterManager], code: 201, input: [name, base_cents, included_guests, extra_guest_cents, max_guests, "included_lane_hours?"], output: PartyPackage, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/party-packages/{id}", description: "Get a party package", roles: [CenterManager, FrontDesk, Customer], code: 200, input: [], output: PartyPackage, side_effects: [] }
  - { method: GET, path: "/party-packages", description: "List party packages", roles: [CenterManager, FrontDesk, Customer], code: 200, input: ["limit?", "offset?"], output: "PartyPackage[]", side_effects: [] }

  # ---- FoodItem ----
  - { method: POST, path: "/food-items", description: "Create a menu item", roles: [CenterManager], code: 201, input: [name, unit_cents, "taxable?"], output: FoodItem, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/food-items/{id}", description: "Get a menu item", roles: [CenterManager, FrontDesk, Customer], code: 200, input: [], output: FoodItem, side_effects: [] }
  - { method: GET, path: "/food-items", description: "List menu items", roles: [CenterManager, FrontDesk, Customer], code: 200, input: ["limit?", "offset?"], output: "FoodItem[]", side_effects: [] }

  # ---- RentalItem ----
  - { method: POST, path: "/rental-items", description: "Create a rental inventory item", roles: [CenterManager], code: 201, input: [kind, label, unit_price_cents, total_count], output: RentalItem, side_effects: ["out_on_rent_count=0, available_count=total_count"] }
  - { method: GET, path: "/rental-items/{id}", description: "Get a rental item", roles: [CenterManager, FrontDesk, Customer], code: 200, input: [], output: RentalItem, side_effects: [] }
  - { method: GET, path: "/rental-items", description: "List rental items", roles: [CenterManager, FrontDesk, Customer], code: 200, input: ["kind?", "limit?", "offset?"], output: "RentalItem[]", side_effects: [] }

  # ---- Reservation core ----
  - { method: POST, path: "/reservations", description: "Create a DRAFT reservation (lane or bay)", roles: [Customer, FrontDesk], code: 201,
      input: [customer_id, rate_card_id, resource_kind, "lane_id?", "bay_id?", "party_package_id?", "origin?", pricing_mode, start_at, end_at, bowler_count, "game_count?", "guest_count?"],
      output: Reservation, side_effects: ["status=DRAFT; subtotals computed=0 until hold"] }
  - { method: GET, path: "/reservations/{id}", description: "Get a reservation", roles: [Customer, FrontDesk, CenterManager], code: 200, input: [], output: Reservation, side_effects: [] }
  - { method: GET, path: "/reservations", description: "List/filter reservations (reverse-reachability for customer/lane/bay/rate_card/party_package FKs)", roles: [Customer, FrontDesk, CenterManager], code: 200,
      input: ["customer_id?", "lane_id?", "bay_id?", "rate_card_id?", "party_package_id?", "status?", "limit?", "offset?"], output: "Reservation[]", side_effects: [] }
  - { method: POST, path: "/reservations/{id}/hold", description: "Place the reservation on HELD, pricing it and capturing a deposit", roles: [Customer, FrontDesk], code: 200, input: [],
      output: Reservation, side_effects: ["status DRAFT->HELD", "recompute subtotals + quoted_total + held_deposit", "Customer.deposit_balance_cents += held_deposit_cents", "increments Reservation.version by 1"] }
  - { method: POST, path: "/reservations/{id}/confirm", description: "Confirm a HELD reservation (OCC-guarded)", roles: [Customer, FrontDesk], code: 200,
      input: [expected_reservation_version], output: Reservation, side_effects: ["status HELD->CONFIRMED", "increments Reservation.version by 1"] }
  - { method: POST, path: "/reservations/{id}/revise", description: "Re-open a CONFIRMED reservation to HELD with new terms (OCC-guarded, cyclic edge)", roles: [Customer, FrontDesk], code: 200,
      input: [expected_reservation_version, "start_at?", "end_at?", "pricing_mode?", "bowler_count?", "game_count?", "guest_count?"],
      output: Reservation, side_effects: ["status CONFIRMED->HELD", "re-run overlap check", "recompute subtotals/deposit; reconcile Customer.deposit_balance_cents by delta", "increments Reservation.version by 1"] }
  - { method: POST, path: "/reservations/{id}/check-in", description: "Check a CONFIRMED reservation in at the desk", roles: [FrontDesk], code: 200, input: [], output: Reservation, side_effects: ["status CONFIRMED->CHECKED_IN", "increments Reservation.version by 1"] }
  - { method: POST, path: "/reservations/{id}/complete", description: "Complete a CHECKED_IN reservation", roles: [FrontDesk], code: 200, input: [],
      output: Reservation, side_effects: ["status CHECKED_IN->COMPLETED (requires all rentals RETURNED)", "Customer.deposit_balance_cents -= held_deposit_cents", "increments Reservation.version by 1"] }
  - { method: POST, path: "/reservations/{id}/cancel", description: "Cancel a HELD/CONFIRMED/WAITLISTED reservation", roles: [Customer, FrontDesk], code: 200, input: [],
      output: Reservation, side_effects: ["status -> CANCELLED", "refund_cents per notice tier; deposit_balance debit + wallet credit", "OPEN rentals -> RETURNED restoring availability", "CASCADE: promote earliest WAITLISTED on freed window", "increments Reservation.version by 1"] }
  - { method: POST, path: "/reservations/{id}/no-show", description: "Mark a CONFIRMED past-window reservation a no-show (deposit forfeit)", roles: [FrontDesk], code: 200, input: [],
      output: Reservation, side_effects: ["status CONFIRMED->NO_SHOW", "refund_cents=0; deposit_balance debit, no wallet credit", "increments Reservation.version by 1"] }
  - { method: POST, path: "/reservations/{id}/waitlist", description: "Join the waitlist for a contended resource window (no deposit yet)", roles: [Customer, FrontDesk], code: 201, input: [],
      output: Reservation, side_effects: ["status DRAFT->WAITLISTED; no deposit captured"] }

  # ---- Food order lines (addable only while owning Reservation is DRAFT or HELD) ----
  - { method: POST, path: "/food-lines", description: "Add a food add-on line to a reservation (DRAFT or HELD only)", roles: [Customer, FrontDesk], code: 201, input: [reservation_id, food_item_id, quantity],
      output: FoodOrderLine, side_effects: ["snapshot unit_cents/taxable", "recompute reservation food_subtotal + quoted_total + held_deposit if HELD", "increments owning Reservation.version by 1"] }
  - { method: GET, path: "/food-lines/{id}", description: "Get a food line", roles: [Customer, FrontDesk, CenterManager], code: 200, input: [], output: FoodOrderLine, side_effects: [] }
  - { method: GET, path: "/food-lines", description: "List food lines (reverse-reachability for reservation_id & food_item_id FKs)", roles: [Customer, FrontDesk, CenterManager], code: 200,
      input: ["reservation_id?", "food_item_id?", "limit?", "offset?"], output: "FoodOrderLine[]", side_effects: [] }
  - { method: DELETE, path: "/food-lines/{id}", description: "Remove a food line (DRAFT or HELD only)", roles: [Customer, FrontDesk], code: 200, input: [], output: FoodOrderLine, side_effects: ["recompute reservation food_subtotal + quoted_total", "increments owning Reservation.version by 1"] }

  # ---- Rental lines (takeable only while owning Reservation is DRAFT, HELD, or CHECKED_IN) ----
  - { method: POST, path: "/rental-lines", description: "Take a rental (shoes/ball/bumper) against a reservation", roles: [Customer, FrontDesk], code: 201, input: [reservation_id, rental_item_id, quantity],
      output: RentalLine, side_effects: ["status=OPEN", "RentalItem.out_on_rent_count += quantity; available_count recomputed", "recompute reservation rental_subtotal + quoted_total", "increments owning Reservation.version by 1"] }
  - { method: GET, path: "/rental-lines/{id}", description: "Get a rental line", roles: [Customer, FrontDesk, CenterManager], code: 200, input: [], output: RentalLine, side_effects: [] }
  - { method: GET, path: "/rental-lines", description: "List rental lines (reverse-reachability for reservation_id & rental_item_id FKs)", roles: [Customer, FrontDesk, CenterManager], code: 200,
      input: ["reservation_id?", "rental_item_id?", "status?", "limit?", "offset?"], output: "RentalLine[]", side_effects: [] }
  - { method: POST, path: "/rental-lines/{id}/return", description: "Return a rental line", roles: [Customer, FrontDesk], code: 200, input: [], output: RentalLine,
      side_effects: ["status OPEN->RETURNED", "RentalItem.out_on_rent_count -= quantity; available_count restored (Rule 9 rental_inventory)", "increments RentalLine.version by 1"] }

  # ---- League ----
  - { method: POST, path: "/leagues", description: "Create a league", roles: [LeagueAdmin], code: 201, input: [name, rate_card_id, season_night_count, lanes_per_night, weekly_fee_cents], output: League, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/leagues/{id}", description: "Get a league", roles: [LeagueAdmin, CenterManager], code: 200, input: [], output: League, side_effects: [] }
  - { method: GET, path: "/leagues", description: "List leagues (reverse-reachability for rate_card_id FK)", roles: [LeagueAdmin, CenterManager], code: 200, input: ["rate_card_id?", "status?", "limit?", "offset?"], output: "League[]", side_effects: [] }
  - { method: POST, path: "/leagues/{id}/activate", description: "Activate a DRAFT league", roles: [LeagueAdmin], code: 200, input: [], output: League, side_effects: ["status DRAFT->ACTIVE", "season_fee_quote_cents computed (forward_looking)", "increments League.version by 1"] }
  - { method: POST, path: "/leagues/{id}/close", description: "Close an ACTIVE league (no SCHEDULED nights left)", roles: [LeagueAdmin], code: 200, input: [], output: League, side_effects: ["status ACTIVE->CLOSED", "season_fee_accrued_cents finalised (chronological)", "increments League.version by 1"] }

  # ---- LeagueNight ----
  - { method: POST, path: "/league-nights", description: "Schedule a league night (reserves lanes_per_night lanes for the window)", roles: [LeagueAdmin], code: 201, input: [league_id, night_index, start_at, end_at],
      output: LeagueNight, side_effects: ["status=SCHEDULED", "reserved_lane_ids assigned from available IN_SERVICE lanes; lane overlap checked"] }
  - { method: GET, path: "/league-nights/{id}", description: "Get a league night", roles: [LeagueAdmin, CenterManager], code: 200, input: [], output: LeagueNight, side_effects: [] }
  - { method: GET, path: "/league-nights", description: "List league nights (reverse-reachability for league_id FK)", roles: [LeagueAdmin, CenterManager], code: 200, input: ["league_id?", "status?", "limit?", "offset?"], output: "LeagueNight[]", side_effects: [] }
  - { method: POST, path: "/league-nights/{id}/mark-played", description: "Mark a night PLAYED", roles: [LeagueAdmin], code: 200, input: [], output: LeagueNight, side_effects: ["status SCHEDULED->PLAYED", "night_fee_cents=weekly_fee_cents; League.season_fee_accrued_cents += night_fee_cents", "releases reserved lanes", "increments LeagueNight.version by 1"] }
  - { method: POST, path: "/league-nights/{id}/forfeit", description: "Mark a night FORFEITED (fee still owed)", roles: [LeagueAdmin], code: 200, input: [], output: LeagueNight, side_effects: ["status SCHEDULED->FORFEITED", "night_fee_cents=weekly_fee_cents; League.season_fee_accrued_cents += night_fee_cents", "releases reserved lanes", "increments LeagueNight.version by 1"] }
  - { method: POST, path: "/league-nights/{id}/rain-out", description: "Mark a night RAINED_OUT (no fee)", roles: [LeagueAdmin], code: 200, input: [], output: LeagueNight, side_effects: ["status SCHEDULED->RAINED_OUT", "night_fee_cents=0; accrual unchanged", "releases reserved lanes", "increments LeagueNight.version by 1"] }

  # ---- Test-driving clock (deterministic time control) ----
  - { method: POST, path: "/_clock/set", description: "Set the server's current UTC clock (test-driving)", roles: [CenterManager, FrontDesk], code: 200, input: [now_utc], output: null, side_effects: ["sets current_utc used by check-in/no-show/cancellation windows"] }
  - { method: POST, path: "/_clock/advance", description: "Advance the server clock by minutes; fires hold-TTL expiry sweep (test-driving)", roles: [CenterManager, FrontDesk], code: 200, input: [minutes], output: null, side_effects: ["current_utc += minutes", "HELD reservations past hold TTL -> EXPIRED with deposit release + rental return"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the requested operation per §1.7" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer acting on a reservation that is not theirs (X-User-ID != Reservation.customer_id)" }
  # --- existence / request ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, start_at >= end_at, or non-positive count" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that admits the requested transition (e.g. cancel after CHECKED_IN, confirm a non-HELD, mark-played a non-SCHEDULED night)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_reservation_version does not match current Reservation.version on confirm/revise (OCC)" }
  # --- cross-entity referential ---
  - { id: ERR_RESOURCE_OUT_OF_SERVICE, http: 409, condition: "Target Lane/Bay is OUT_OF_SERVICE when holding/confirming" }
  - { id: ERR_RENTALS_OUTSTANDING, http: 409, condition: "Completing a reservation while OPEN rental lines remain" }
  - { id: ERR_LEAGUE_NOT_ACTIVE, http: 409, condition: "League-night transition while parent League is not ACTIVE" }
  - { id: ERR_LEAGUE_HAS_SCHEDULED_NIGHTS, http: 409, condition: "Closing a league while SCHEDULED nights remain" }
  - { id: ERR_LEAGUE_NO_NIGHTS, http: 409, condition: "Activating a league with no scheduled nights" }
  # --- temporal / capacity ---
  - { id: ERR_LANE_TIME_CONFLICT, http: 409, condition: "Lane window overlaps a blocking reservation (half-open [start,end))" }
  - { id: ERR_BAY_TIME_CONFLICT, http: 409, condition: "Bay window violates cleanup_buffer_minutes gap against a neighboring booking (closed interval + buffer)" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "bowler_count/guest_count exceeds Lane.max_bowlers, Bay.capacity, or PartyPackage.max_guests" }
  - { id: ERR_RENTAL_UNAVAILABLE, http: 409, condition: "Requested rental quantity exceeds RentalItem.available_count" }
  # --- fiscal / lifecycle ---
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Suspended customer attempts to hold a reservation or take a rental" }
  - { id: ERR_NOT_WAITLISTED, http: 409, condition: "Waitlist join requested on a window with no active overlap (use /hold directly)" }
  - { id: ERR_DUPLICATE_LANE_NUMBER, http: 409, condition: "Creating a lane with a number already in use" }
  - { id: ERR_DUPLICATE_NIGHT_INDEX, http: 409, condition: "Scheduling a night with a night_index already used in the league" }
  - { id: ERR_PARTY_GUESTS_EXCEED_MAX, http: 409, condition: "Party guest_count exceeds PartyPackage.max_guests" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset out of allowed range" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End user who books and manages their own reservations, food, and rentals."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /reservations (own customer_id)"
      - "POST /reservations/{id}/hold|confirm|revise|cancel|waitlist (own reservation)"
      - "POST /food-lines, DELETE /food-lines/{id} (own reservation)"
      - "POST /rental-lines, POST /rental-lines/{id}/return (own reservation)"
      - "GET reads on catalogs, own reservations, own lines"

  - name: FrontDesk
    description: "Floor staff operating the desk: walk-ins, check-in, completion, no-show, cancellations."
    identity: "opaque"
    exclusive_operations:
      - "POST /reservations/{id}/check-in"
      - "POST /reservations/{id}/complete"
      - "POST /reservations/{id}/no-show"
      - "POST /customers (register at desk)"
    shared_operations:
      - "POST /reservations and lifecycle holds/confirms/revises/cancels (on behalf of any customer)"
      - "POST /food-lines, /rental-lines and their reversals"
      - "POST /_clock/set, /_clock/advance"
      - "GET reads across customers, reservations, lines, catalogs"

  - name: LeagueAdmin
    description: "Manages leagues and league-night scheduling/outcomes."
    identity: "opaque"
    exclusive_operations:
      - "POST /leagues, /leagues/{id}/activate, /leagues/{id}/close"
      - "POST /league-nights and /league-nights/{id}/mark-played|forfeit|rain-out"
    shared_operations:
      - "GET reads on leagues, league-nights, rate-cards, lanes"

  - name: CenterManager
    description: "Owns physical-resource and pricing configuration; suspends/reinstates customers."
    identity: "opaque"
    exclusive_operations:
      - "POST /rate-cards, /lanes, /bays, /party-packages, /food-items, /rental-items"
      - "POST /lanes/{id}/set-status, /bays/{id}/set-status"
      - "POST /customers/{id}/suspend, /customers/{id}/reinstate"
    shared_operations:
      - "POST /_clock/set, /_clock/advance"
      - "GET reads across all resources"
