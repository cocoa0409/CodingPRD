        distinguishing_aspect: "Build certification is exclusive to InterfaceAnalyst, so a CourierCoordinator is refused with ERR_INSUFFICIENT_PERMISSIONS while the analyst certifies the same IN_BUILD row and the client's derived interface_status moves to CERTIFIED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one registered client and one interface build in status IN_BUILD."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_ib
            - *k_ibs
            - call: "GET /reference-lab/client-laboratories/${kc2_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { k_if_before: $.data.interface_status }
          trigger:
            - call: "POST /reference-lab/interface-builds/${kib_id}/certify"
              payload: {}
              as: CourierCoordinator
              captures: { k_err_cert: $.data.error_id }
            - call: "POST /reference-lab/interface-builds/${kib_id}/certify"
              payload: {}
              as: InterfaceAnalyst
              captures: { kib_status: $.data.status, kib_cert_at: $.data.certified_at }
            - call: "GET /reference-lab/client-laboratories/${kc2_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { k_if_after: $.data.interface_status }
          assert:
            - "ClientLaboratory.${kc2_id}.interface_status == IN_BUILD before certification"
            - "the CourierCoordinator request returns 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "the InterfaceAnalyst request succeeds and InterfaceBuild.${kib_id}.status == CERTIFIED with a non-null certified_at"
            - "ClientLaboratory.${kc2_id}.interface_status == CERTIFIED afterwards, recomputed from the highest-status build"

  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: result_entry_against_a_stale_order_version_returns_stale_version
        claim_type: idempotency
        grounds:
          - concurrency_rules[enter-results-stale-send-out-order]
          - validations.priority_4.5_existence
          - entities.SendOutOrder.fields.version
        distinguishing_aspect: "OCC is observed on strictly sequential calls: the first entry succeeds against the observed order version, the order's version then advances, and the same payload replaying the older version is refused with 412 ERR_STALE_VERSION before any business rule runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client with a certified build, a published ferritin entry and an order in IN_TESTING."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_t1
            - *k_pub
            - *k_ib
            - *k_ibs
            - *k_ibc
            - *k_clv
            - *k_run
            - *k_pr
            - *k_act
            - *k_spec
            - *k_ord
            - call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${kt1_id}", instrument_code: "IMM-20", section: "CORE", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T00:00:00Z", reserved_end_at: "2026-09-01T04:00:00Z" }
              as: MedicalTechnologist
            - call: "POST /reference-lab/specimens/${ksp_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/send-out-orders/${kord_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/specimens/${ksp_id}/begin-testing"
              payload: {}
              as: MedicalTechnologist
            - call: "GET /reference-lab/order-test-lines"
              payload: { send_out_order_id: "${kord_id}", limit: 1 }
              as: MedicalTechnologist
              captures: { kord_locc: "$.data[0].id" }
            - call: "GET /reference-lab/send-out-orders/${kord_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { kord_occ_v: $.data.version }
          trigger:
            - call: "POST /reference-lab/send-out-orders/${kord_id}/enter-results"
              payload: { expected_send_out_order_version: "${kord_occ_v}", result_lines: [{ order_test_line_id: "${kord_locc}", result_value: 250.0, result_units: "ng/mL", critical_value_notified_to: null, critical_value_notified_at: null }] }
              as: MedicalTechnologist
              captures: { kord_occ_v2: $.data.version }
            - call: "POST /reference-lab/send-out-orders/${kord_id}/enter-results"
              payload: { expected_send_out_order_version: "${kord_occ_v}", result_lines: [{ order_test_line_id: "${kord_locc}", result_value: 300.0, result_units: "ng/mL", critical_value_notified_to: null, critical_value_notified_at: null }] }
              as: MedicalTechnologist
              captures: { k_err_occ: $.data.error_id }
          assert:
            - "the first entry returns 200 and SendOutOrder.${kord_id}.version advances to ${kord_occ_v2}, one greater than the observed ${kord_occ_v}"
            - "the second entry returns 412 with error_id == ERR_STALE_VERSION"
            - "OrderTestLine.${kord_locc}.result_value == 250.0, so the stale write changed nothing"
            - "SendOutOrder.${kord_id}.version == ${kord_occ_v2}, unchanged by the rejected request"

      - name: interface_message_queue_against_a_stale_order_version_returns_stale_version
        claim_type: idempotency
        grounds:
          - concurrency_rules[interface-message-stale-send-out-order]
          - validations.priority_4.5_existence
          - entities.SendOutOrder.fields.version
        distinguishing_aspect: "This OCC rule sits on a different write endpoint from the result-entry rule, and the order's version advances on the successful queue itself, so the replay of the pre-queue version is deterministically refused."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client with a certified dual-direction build, a published ferritin entry and an order in IN_TESTING."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_t1
            - *k_pub
            - *k_ib
            - *k_ibs
            - *k_ibc
            - *k_clv
            - *k_run
            - *k_pr
            - *k_act
            - *k_spec
            - *k_ord
            - call: "GET /reference-lab/send-out-orders/${kord_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { kord_m_v: $.data.version }
          trigger:
            - call: "POST /reference-lab/result-interface-messages"
              payload: { send_out_order_id: "${kord_id}", interface_build_id: "${kib_id}", message_type: "ORDER", control_id: "CTL-6001", expected_send_out_order_version: "${kord_m_v}" }
              as: InterfaceAnalyst
              captures: { kmsg_occ: $.data.id }
            - call: "POST /reference-lab/result-interface-messages"
              payload: { send_out_order_id: "${kord_id}", interface_build_id: "${kib_id}", message_type: "ORDER", control_id: "CTL-6002", expected_send_out_order_version: "${kord_m_v}" }
              as: InterfaceAnalyst
              captures: { k_err_occ2: $.data.error_id }
          assert:
            - "the first queue returns 201 and ResultInterfaceMessage.${kmsg_occ}.status == QUEUED"
            - "the second queue returns 412 with error_id == ERR_STALE_VERSION"
            - "GET /reference-lab/result-interface-messages?send_out_order_id=${kord_id} returns exactly 1 row, so the stale queue created nothing"
            - "SendOutOrder.${kord_id}.version advanced by exactly 1 across the recipe"

      - name: courier_run_booking_stale_client_version_is_rejected_and_fresh_succeeds
        claim_type: idempotency
        grounds:
          - concurrency_rules[courier-run-create-stale-client-laboratory]
          - validations.priority_4.5_existence
          - entities.ClientLaboratory.fields.version
        distinguishing_aspect: "The guarded parent here is ClientLaboratory rather than SendOutOrder, and every successful booking bumps the client's version, so two sequential bookings each need a refreshed version and a replay of the first one is refused."
        test_recipe:
