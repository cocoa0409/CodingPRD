    roles: [RoyaltyAccountant]
    input: [payment_reference]
    output: RoyaltyStatement
    status_code: 200
    side_effects: ["FINALIZED → PAID, records paid_by_user_id and paid_at, and raises Composer.lifetime_paid_cents by net_payable_cents"]

  - method: POST
    path: /music-library/royalty-ledger-entries
    roles: [RoyaltyAccountant]
    input: [composer_id, source_type, amount_cents, memo]
    output: RoyaltyLedgerEntry
    status_code: 201
    description: "Manual ledger append, restricted to source_type ADJUSTMENT; every other source_type is produced only by the workflows in §1.2 and is refused here with ERR_LEDGER_SOURCE_NOT_MANUAL (422)."
    side_effects: ["appends the entry with accrual_recognized_at = cash_recognized_at = clock, statement_id null, and increments Composer.version"]

  - method: GET
    path: /music-library/royalty-ledger-entries/{entry_id}
    roles: [RoyaltyAccountant, Composer]
    input: []
    output: RoyaltyLedgerEntry
    status_code: 200
    side_effects: []

  - method: GET
    path: /music-library/royalty-ledger-entries
    roles: [RoyaltyAccountant, Composer]
    input: ["composer_id?", "statement_id?", "source_type?", "limit?", "offset?"]
    output: RoyaltyLedgerEntry[]
    status_code: 200
    description: "Reverse lookup for RoyaltyLedgerEntry.composer_id and RoyaltyLedgerEntry.statement_id."
    side_effects: []

# =============================================================================
# §1.6 Error Catalog — every id is reachable from at least one endpoint
# =============================================================================
errors:

  # -- schema / request shape (422) -------------------------------------------
  - { error_id: ERR_VALIDATION, status_code: 422, raised_by: "every write endpoint", meaning: "missing required field, wrong type, unknown enum member, numeric value out of range, or array bounds violated" }
  - { error_id: ERR_LICENSE_MODE_FIELDS_INVALID, status_code: 422, raised_by: "POST /music-library/licenses", meaning: "PER_USE without sync_request_id, or BLANKET without composition_id, blanket_agreement_id, tier_id, media_type, distribution_scale, term_start and term_months, or a PER_USE request that also supplies blanket_agreement_id" }
  - { error_id: ERR_CLOCK_REWIND, status_code: 422, raised_by: "POST /_clock/set_current_utc", meaning: "to_iso8601 is earlier than the current logical clock; time only moves forward" }
  - { error_id: ERR_TIER_CODE_DUPLICATE, status_code: 409, raised_by: "POST /music-library/license-tiers", meaning: "another LicenseTier already uses this code" }
  - { error_id: ERR_LEDGER_SOURCE_NOT_MANUAL, status_code: 422, raised_by: "POST /music-library/royalty-ledger-entries", meaning: "source_type is not ADJUSTMENT; every other source_type is produced only by a workflow transition" }

  # -- existence (404) --------------------------------------------------------
  - { error_id: ERR_COMPOSER_NOT_FOUND, status_code: 404, raised_by: "every endpoint addressing or referencing a Composer", meaning: "no Composer with that id" }
  - { error_id: ERR_COMPOSER_AGREEMENT_NOT_FOUND, status_code: 404, raised_by: "agreement endpoints and POST /music-library/compositions", meaning: "no ComposerAgreement with that id" }
  - { error_id: ERR_COMPOSITION_NOT_FOUND, status_code: 404, raised_by: "composition endpoints, POST /music-library/sync-requests, POST /music-library/cue-sheets (per cues[] element), POST /music-library/fingerprint-matches", meaning: "no Composition with that id" }
  - { error_id: ERR_SEARCH_PROFILE_NOT_FOUND, status_code: 404, raised_by: "GET /music-library/search-profile and GET /music-library/compositions/search", meaning: "the singleton CatalogSearchProfile has never been written" }
  - { error_id: ERR_LICENSE_TIER_NOT_FOUND, status_code: 404, raised_by: "GET /music-library/license-tiers/{tier_id}, POST /music-library/sync-requests, POST /music-library/licenses", meaning: "no LicenseTier with that id" }
  - { error_id: ERR_LICENSEE_NOT_FOUND, status_code: 404, raised_by: "licensee, sync-request and blanket endpoints", meaning: "no Licensee with that id" }
  - { error_id: ERR_SYNC_REQUEST_NOT_FOUND, status_code: 404, raised_by: "sync-request endpoints and POST /music-library/licenses", meaning: "no SyncRequest with that id" }
  - { error_id: ERR_LICENSE_NOT_FOUND, status_code: 404, raised_by: "license endpoints and POST /music-library/cue-sheets", meaning: "no License with that id" }
  - { error_id: ERR_BLANKET_AGREEMENT_NOT_FOUND, status_code: 404, raised_by: "blanket endpoints, POST /music-library/usage-reports, POST /music-library/licenses", meaning: "no BlanketAgreement with that id" }
  - { error_id: ERR_USAGE_REPORT_NOT_FOUND, status_code: 404, raised_by: "usage-report endpoints and POST /music-library/cue-sheets", meaning: "no UsageReport with that id" }
  - { error_id: ERR_CUE_SHEET_NOT_FOUND, status_code: 404, raised_by: "cue-sheet endpoints", meaning: "no CueSheet with that id" }
  - { error_id: ERR_FINGERPRINT_MATCH_NOT_FOUND, status_code: 404, raised_by: "POST /music-library/infringement-claims", meaning: "no FingerprintMatch with that id" }
  - { error_id: ERR_INFRINGEMENT_CLAIM_NOT_FOUND, status_code: 404, raised_by: "claim endpoints", meaning: "no InfringementClaim with that id" }
  - { error_id: ERR_ROYALTY_STATEMENT_NOT_FOUND, status_code: 404, raised_by: "statement endpoints", meaning: "no RoyaltyStatement with that id" }
  - { error_id: ERR_ROYALTY_LEDGER_ENTRY_NOT_FOUND, status_code: 404, raised_by: "GET /music-library/royalty-ledger-entries/{entry_id}", meaning: "no RoyaltyLedgerEntry with that id" }

  # -- authorization (403) ----------------------------------------------------
  - { error_id: ERR_UNAUTHORIZED, status_code: 403, raised_by: "every endpoint", meaning: "X-User-Role is absent or not listed in the endpoint's roles" }
  - { error_id: ERR_LICENSEE_MISMATCH, status_code: 403, raised_by: "sync-request create/accept/request-revision, usage-report create/submit, cue-sheet create", meaning: "role Licensee acting on another licensee's row" }
  - { error_id: ERR_COMPOSER_IDENTITY_MISMATCH, status_code: 403, raised_by: "agreement sign, amendment-decision, royalty-preview, ledger and statement reads", meaning: "role Composer acting on another composer's row" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, status_code: 403, raised_by: "POST /music-library/royalty-statements/{statement_id}/pay", meaning: "the paying user is the user who finalized the statement" }

  # -- optimistic concurrency (412) ------------------------------------------
  - { error_id: ERR_COMPOSITION_VERSION_CONFLICT, status_code: 412, raised_by: "POST /music-library/licenses", meaning: "expected_composition_version does not match the Composition's current version" }
  - { error_id: ERR_COMPOSER_VERSION_CONFLICT, status_code: 412, raised_by: "POST /music-library/royalty-statements", meaning: "expected_composer_version does not match the Composer's current version" }

  # -- state preconditions (409) --------------------------------------------
  - { error_id: ERR_AGREEMENT_STATE_INVALID, status_code: 409, raised_by: "agreement action endpoints", meaning: "the agreement is not in a state this transition accepts (includes repeating a transition and acting on a TERMINATED agreement)" }
  - { error_id: ERR_COMPOSITION_STATE_INVALID, status_code: 409, raised_by: "POST /music-library/compositions/{composition_id}/catalog, /retire", meaning: "the work is not in a state this transition accepts (already CATALOGED, already RETIRED)" }
  - { error_id: ERR_SYNC_REQUEST_STATE_INVALID, status_code: 409, raised_by: "sync-request action endpoints", meaning: "the request is not in a state this transition accepts (includes any action on DELIVERED or DECLINED)" }
  - { error_id: ERR_LICENSE_STATE_INVALID, status_code: 409, raised_by: "license action endpoints", meaning: "the license is not in a state this transition accepts (includes activating or revoking an EXPIRED or REVOKED license)" }
  - { error_id: ERR_BLANKET_STATE_INVALID, status_code: 409, raised_by: "blanket action endpoints", meaning: "the agreement is not in a state this transition accepts (activating a non-DRAFT row, terminating an EXPIRED or TERMINATED row)" }
  - { error_id: ERR_REPORT_STATE_INVALID, status_code: 409, raised_by: "usage-report action endpoints", meaning: "the report is not in a state this transition accepts (submitting a SUBMITTED report, accepting a DUE or ACCEPTED report)" }
  - { error_id: ERR_CUE_SHEET_STATE_INVALID, status_code: 409, raised_by: "cue-sheet action endpoints", meaning: "the sheet is not in a state this transition accepts (registering a REGISTERED sheet, deciding on a COLLECTED sheet)" }
  - { error_id: ERR_CLAIM_STATE_INVALID, status_code: 409, raised_by: "claim action endpoints", meaning: "the claim is not in a state this transition accepts (noticing twice, escalating a NOTICED claim, any action on SETTLED or ESCALATED)" }
  - { error_id: ERR_STATEMENT_STATE_INVALID, status_code: 409, raised_by: "statement action endpoints", meaning: "the statement is not in a state this transition accepts (finalizing twice, paying a DRAFT statement, any action on PAID)" }

  # -- business rules ---------------------------------------------------------
  - { error_id: ERR_SHARE_SPLIT_NOT_100, status_code: 422, raised_by: "agreement create and amendments", meaning: "writer share plus publisher share is not exactly 100.00" }
  - { error_id: ERR_WORK_FOR_HIRE_TERMS_INVALID, status_code: 422, raised_by: "POST /music-library/composer-agreements", meaning: "work-for-hire terms carry a sync-fee share or no buyout, or a royalty-split agreement carries a buyout" }
  - { error_id: ERR_AGREEMENT_NOT_ACTIVE, status_code: 409, raised_by: "composition catalog, sync-request quote", meaning: "the governing ComposerAgreement is not ACTIVE" }
  - { error_id: ERR_COMPOSITION_NOT_LICENSABLE, status_code: 409, raised_by: "sync-request create and quote, license create", meaning: "the work is not CATALOGED or is WITHDRAWN" }
  - { error_id: ERR_ACTIVE_CLAIM_BLOCKS_LICENSE, status_code: 409, raised_by: "POST /music-library/licenses", meaning: "an exclusive license was requested while the work has a claim in NOTICED or DISPUTED" }
  - { error_id: ERR_QUOTE_EXPIRED, status_code: 409, raised_by: "sync-request accept, license create", meaning: "the logical clock has passed quote_expires_at" }
  - { error_id: ERR_EXCLUSIVE_WINDOW_CONFLICT, status_code: 409, raised_by: "POST /music-library/licenses", meaning: "the new term starts on or before the work's exclusive_block_until" }
  - { error_id: ERR_TERM_OUTSIDE_COVERAGE, status_code: 422, raised_by: "POST /music-library/licenses", meaning: "a BLANKET license term starts outside the blanket coverage interval" }
  - { error_id: ERR_BLANKET_NOT_ACTIVE, status_code: 409, raised_by: "POST /music-library/licenses, POST /music-library/usage-reports/{usage_report_id}/accept", meaning: "the blanket agreement is not ACTIVE, or is DELINQUENT at issuance time" }
  - { error_id: ERR_BLANKET_COVERAGE_OVERLAP, status_code: 409, raised_by: "POST /music-library/blanket-agreements", meaning: "the coverage interval overlaps another DRAFT or ACTIVE agreement for the same licensee" }
  - { error_id: ERR_COVERAGE_DATES_INVALID, status_code: 422, raised_by: "POST /music-library/blanket-agreements", meaning: "coverage_end is not after coverage_start" }
  - { error_id: ERR_COVERAGE_WINDOW_PASSED, status_code: 409, raised_by: "POST /music-library/blanket-agreements/{blanket_agreement_id}/activate", meaning: "the logical clock has reached coverage_end" }
  - { error_id: ERR_REPORT_PERIOD_INVALID, status_code: 422, raised_by: "POST /music-library/usage-reports", meaning: "the period is not a cadence period derived from coverage_start, or falls outside coverage" }
  - { error_id: ERR_REPORT_PERIOD_DUPLICATE, status_code: 409, raised_by: "POST /music-library/usage-reports", meaning: "a DUE, SUBMITTED or ACCEPTED report already covers this period" }
  - { error_id: ERR_REPORT_HAS_NO_CUE_SHEETS, status_code: 409, raised_by: "POST /music-library/usage-reports/{usage_report_id}/submit", meaning: "no cue sheet is attached to the report" }
  - { error_id: ERR_CUE_SHEET_PARENT_INVALID, status_code: 422, raised_by: "POST /music-library/cue-sheets", meaning: "neither or both of license_id and usage_report_id were supplied" }
  - { error_id: ERR_CUE_COMPOSITION_NOT_COVERED, status_code: 409, raised_by: "POST /music-library/cue-sheets", meaning: "a cue cites a work the parent does not cover, a WITHDRAWN work, or a work whose agreement opted out of blanket" }
  - { error_id: ERR_CUE_SHEET_HAS_NO_CREDITS, status_code: 409, raised_by: "POST /music-library/cue-sheets/{cue_sheet_id}/register", meaning: "total_credits is 0.00 so there is nothing to register" }
  - { error_id: ERR_COMPOSER_NOT_AFFILIATED, status_code: 409, raised_by: "POST /music-library/cue-sheets/{cue_sheet_id}/register", meaning: "a credited composer has pro_affiliation NONE and cannot be registered with a society" }
  - { error_id: ERR_TIER_INCOMPATIBLE, status_code: 422, raised_by: "POST /music-library/licenses", meaning: "the tier does not permit the requested license_mode" }
  - { error_id: ERR_SCALE_NOT_ALLOWED_FOR_TIER, status_code: 422, raised_by: "sync-request create and request-revision", meaning: "the distribution scale is not in the tier's allowed_scales, or the media type does not match the tier" }
  - { error_id: ERR_TERM_OUTSIDE_TIER_RANGE, status_code: 422, raised_by: "POST /music-library/sync-requests/{sync_request_id}/quote", meaning: "the requested term is outside the tier's min/max term months" }
  - { error_id: ERR_CREDIT_LIMIT_EXCEEDED, status_code: 409, raised_by: "sync-request quote, license create", meaning: "committed plus reserved plus this amount would pass the licensee's credit limit" }
  - { error_id: ERR_REVISION_LIMIT_REACHED, status_code: 409, raised_by: "POST /music-library/sync-requests/{sync_request_id}/request-revision", meaning: "three revisions have already been requested" }
  - { error_id: ERR_AMENDMENT_LIMIT_REACHED, status_code: 409, raised_by: "POST /music-library/composer-agreements/{agreement_id}/amendments", meaning: "three amendments have already been accepted" }
  - { error_id: ERR_NO_EDIT_WORK_REQUESTED, status_code: 409, raised_by: "POST /music-library/sync-requests/{sync_request_id}/start-edit", meaning: "no custom edit, stems or alternate lengths were requested" }
  - { error_id: ERR_EDIT_PASS_REQUIRED, status_code: 409, raised_by: "POST /music-library/sync-requests/{sync_request_id}/deliver", meaning: "delivery was attempted straight from ACCEPTED although edit work was requested" }
  - { error_id: ERR_LICENSE_NOT_ISSUED, status_code: 409, raised_by: "POST /music-library/sync-requests/{sync_request_id}/deliver", meaning: "no License has been issued from the request yet" }
  - { error_id: ERR_DELIVERABLE_COUNT_SHORT, status_code: 422, raised_by: "POST /music-library/sync-requests/{sync_request_id}/deliver", meaning: "delivered_asset_count is below the master plus stems plus alternate lengths" }
  - { error_id: ERR_METADATA_INCOMPLETE, status_code: 409, raised_by: "POST /music-library/compositions/{composition_id}/catalog", meaning: "mood_tags or instrumentation is empty" }
  - { error_id: ERR_COMPOSITION_HAS_ACTIVE_LICENSES, status_code: 409, raised_by: "POST /music-library/compositions/{composition_id}/retire", meaning: "the work still has ISSUED or ACTIVE licenses" }
  - { error_id: ERR_TERM_NOT_STARTED, status_code: 409, raised_by: "POST /music-library/licenses/{license_id}/activate", meaning: "the logical clock has not reached term_start" }
  - { error_id: ERR_PAYMENT_EXCEEDS_FEE, status_code: 422, raised_by: "POST /music-library/licenses/{license_id}/record-payment", meaning: "the payment is not positive or would collect more than final_fee_cents" }
  - { error_id: ERR_CONFIDENCE_BELOW_CLAIM_THRESHOLD, status_code: 422, raised_by: "POST /music-library/infringement-claims", meaning: "the match confidence is below 70.0 so no claim may be built" }
  - { error_id: ERR_CONFIDENCE_BELOW_NOTICE_THRESHOLD, status_code: 409, raised_by: "POST /music-library/infringement-claims/{claim_id}/notice", meaning: "the match confidence is below 85.0 so no takedown notice may be sent" }
  - { error_id: ERR_MATCH_ALREADY_CLAIMED, status_code: 409, raised_by: "POST /music-library/infringement-claims", meaning: "another claim already cites this fingerprint match" }
  - { error_id: ERR_SETTLEMENT_BELOW_FLOOR, status_code: 422, raised_by: "POST /music-library/infringement-claims/{claim_id}/settle", meaning: "a negotiated settlement is below settlement_floor_cents or omits the amount" }
  - { error_id: ERR_STATEMENT_PERIOD_OVERLAP, status_code: 409, raised_by: "POST /music-library/royalty-statements", meaning: "another statement for this composer covers an overlapping period" }
  - { error_id: ERR_STATEMENT_NO_ACTIVITY, status_code: 409, raised_by: "POST /music-library/royalty-statements/{statement_id}/finalize", meaning: "the statement swept nothing (payout_status NO_ACTIVITY)" }
  - { error_id: ERR_STATEMENT_NOT_PAYABLE, status_code: 409, raised_by: "POST /music-library/royalty-statements/{statement_id}/pay", meaning: "payout_status is HELD_BELOW_MINIMUM or NO_ACTIVITY" }
  - { error_id: ERR_WEIGHTS_NOT_100, status_code: 422, raised_by: "PUT /music-library/search-profile", meaning: "the four facet weights do not sum to 100" }

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# X-User-Role selects the role; X-User-ID identifies the acting user and is
# compared against entity ownership for the two entity-backed roles and against
# RoyaltyStatement.finalized_by_user_id for the payment separation rule.
# =============================================================================
roles:

  - name: CatalogAdmin
    identity: opaque
    description: "Owns catalog metadata, the search profile, the rate card and creative delivery."
    exclusive_operations:
      - "POST /music-library/compositions"
      - "PATCH /music-library/compositions/{composition_id}"
      - "POST /music-library/compositions/{composition_id}/catalog"
      - "POST /music-library/compositions/{composition_id}/retire"
      - "PUT /music-library/search-profile"
      - "POST /music-library/license-tiers"
      - "POST /music-library/sync-requests/{sync_request_id}/start-edit"
      - "POST /music-library/sync-requests/{sync_request_id}/deliver"
      - "POST /music-library/fingerprint-matches"
    shared_operations:
      - "POST /music-library/composers (with RightsManager)"
      - "GET /music-library/compositions/search (with LicensingAgent, Licensee)"
      - "read endpoints for compositions, licenses, sync-requests, claims"
      - "POST /_clock/set_current_utc (with every non-entity-backed role)"

  - name: RightsManager
    identity: opaque
    description: "Owns composer agreements, society traffic, infringement claims and revocation."
    exclusive_operations:
      - "POST /music-library/composer-agreements"
      - "POST /music-library/composer-agreements/{agreement_id}/submit-for-signature"
      - "POST /music-library/composer-agreements/{agreement_id}/amendments"
      - "POST /music-library/composer-agreements/{agreement_id}/terminate"
      - "POST /music-library/licenses/{license_id}/revoke"
      - "POST /music-library/usage-reports/{usage_report_id}/accept"
      - "POST /music-library/usage-reports/{usage_report_id}/reject"
      - "POST /music-library/cue-sheets/{cue_sheet_id}/register"
      - "POST /music-library/cue-sheets/{cue_sheet_id}/society-decision"
      - "POST /music-library/infringement-claims"
      - "POST /music-library/infringement-claims/{claim_id}/notice"
      - "POST /music-library/infringement-claims/{claim_id}/dispute"
      - "POST /music-library/infringement-claims/{claim_id}/settle"
      - "POST /music-library/infringement-claims/{claim_id}/escalate"
    shared_operations:
      - "POST /music-library/composers (with CatalogAdmin)"
      - "read endpoints for composers, agreements, compositions, licenses, blankets, reports, cue sheets, claims"

  - name: LicensingAgent
    identity: opaque
    description: "Owns licensees, quoting, issuance and blanket deals; may never accept a quote on the licensee's behalf."
    exclusive_operations:
      - "POST /music-library/licensees"
      - "POST /music-library/sync-requests/{sync_request_id}/review"
      - "POST /music-library/sync-requests/{sync_request_id}/quote"
      - "POST /music-library/sync-requests/{sync_request_id}/decline"
      - "POST /music-library/licenses"
      - "POST /music-library/licenses/{license_id}/activate"
      - "POST /music-library/blanket-agreements"
      - "POST /music-library/blanket-agreements/{blanket_agreement_id}/activate"
      - "POST /music-library/blanket-agreements/{blanket_agreement_id}/terminate"
    shared_operations:
      - "POST /music-library/sync-requests (with Licensee)"
      - "POST /music-library/usage-reports (with Licensee)"
      - "POST /music-library/cue-sheets (with Licensee)"
      - "GET /music-library/compositions/search (with CatalogAdmin, Licensee)"
      - "read endpoints for tiers, licensees, sync-requests, licenses, blankets, reports, cue sheets"

  - name: RoyaltyAccountant
    identity: opaque
    description: "Owns cash collection and composer statements. The user who finalizes a statement may not pay it."
    exclusive_operations:
      - "POST /music-library/licenses/{license_id}/record-payment"
      - "POST /music-library/royalty-statements"
      - "POST /music-library/royalty-statements/{statement_id}/finalize"
      - "POST /music-library/royalty-statements/{statement_id}/pay"
      - "POST /music-library/royalty-ledger-entries"
    shared_operations:
      - "GET /music-library/composers/{composer_id}/royalty-preview (with Composer)"
      - "GET /music-library/royalty-statements and /royalty-ledger-entries (with Composer)"
      - "read endpoints for composers, compositions, licenses, blankets, reports, cue sheets, claims"
    segregation_of_duties:
      - "POST /music-library/royalty-statements/{statement_id}/pay requires X-User-ID != RoyaltyStatement.finalized_by_user_id (ERR_SEGREGATION_OF_DUTIES). Two distinct RoyaltyAccountant user ids are therefore required to move a statement from DRAFT to PAID."

  - name: Composer
    identity: entity_backed:Composer
    description: "The signing counterparty. X-User-ID must equal the Composer.id being acted on or read."
    exclusive_operations:
      - "POST /music-library/composer-agreements/{agreement_id}/sign"
      - "POST /music-library/composer-agreements/{agreement_id}/amendment-decision"
    shared_operations:
      - "GET /music-library/composers/{composer_id} and GET /music-library/composer-agreements (own rows only)"
      - "GET /music-library/composers/{composer_id}/royalty-preview (own rows only, with RoyaltyAccountant)"
      - "GET /music-library/royalty-statements, /royalty-ledger-entries and /cue-sheets/{cue_sheet_id} (own rows only)"
    ownership_rule: "Any Composer-role request addressing a composer other than X-User-ID is refused with ERR_COMPOSER_IDENTITY_MISMATCH (403), which outranks every state and business check."

  - name: Licensee
    identity: entity_backed:Licensee
    description: "The buying counterparty. X-User-ID must equal the Licensee.id that owns the row."
    exclusive_operations:
      - "POST /music-library/sync-requests/{sync_request_id}/accept"
      - "POST /music-library/sync-requests/{sync_request_id}/request-revision"
      - "POST /music-library/usage-reports/{usage_report_id}/submit"
    shared_operations:
      - "POST /music-library/sync-requests (with LicensingAgent, own licensee_id only)"
      - "POST /music-library/usage-reports (with LicensingAgent, own agreements only)"
      - "POST /music-library/cue-sheets (with LicensingAgent, own parents only)"
      - "GET /music-library/compositions/search (with CatalogAdmin, LicensingAgent)"
      - "read endpoints for own licensee, sync-requests, licenses, blankets, reports and cue sheets"
    ownership_rule: "Any Licensee-role request touching another licensee's row is refused with ERR_LICENSEE_MISMATCH (403). A Licensee may never quote, issue, decline, review, accept a report or touch royalty accounting."
