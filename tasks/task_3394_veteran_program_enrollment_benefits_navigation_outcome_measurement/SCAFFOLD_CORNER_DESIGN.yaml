# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3394_veteran_program_enrollment_benefits_navigation_outcome_measurement
# Breadth probe over §1.1–§1.7 claims not exercised by §1.8. Instance names are
# unique across both design files. Logical clock default: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: member_create_returns_declared_fields
        claim_type: Creation
        grounds:
          - entities.Member
          - endpoints.POST_/veteran-services/members
        distinguishing_aspect: "A member created with the four required inputs returns 201 with system fields populated, verification_status UNVERIFIED, engagement_status INACTIVE, total_monthly_compensation_cents 0, version 1 — and the success envelope carries meta.api_request_id and meta.api_request_timestamp."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /veteran-services/members"
              payload: { full_name: "Jordan Lee", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id" }
          assert:
            - "the response status is 201 and response_type is object"
            - "Member.${m_id}.full_name == \"Jordan Lee\" and branch_of_service == ARMY"
            - "Member.${m_id}.verification_status == UNVERIFIED and engagement_status == INACTIVE"
            - "Member.${m_id}.total_monthly_compensation_cents == 0 and version == 1"
            - "verified_service_era and verified_injury_connection are null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: member_create_ignores_system_field_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Member.fields.verification_status
          - endpoints.POST_/veteran-services/members
        distinguishing_aspect: "Client-supplied verification_status=VERIFIED and version=99 are not declared inputs and are ignored: the row is created UNVERIFIED at version 1."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /veteran-services/members"
              payload: { full_name: "Sneaky Sam", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "NAVY", verification_status: "VERIFIED", version: 99 }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_status: "$.data.verification_status", m_v: "$.data.version" }
          assert:
            - "the response status is 201"
            - "m_status == UNVERIFIED and m_v == 1 (client-injected system fields ignored)"

      - name: claim_create_defaults_dependent_count_zero
        claim_type: Defaults
        grounds:
          - entities.BenefitsClaim.fields.dependent_count
          - calculations.compensation_monthly
        distinguishing_aspect: "dependent_count omitted at filing defaults to 0, so the final award at rating 30 carries no dependent allowance: round_half_up(52400 * 1.025) == 53710, not 85485."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One VERIFIED veteran; claim filed without dependent_count."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Default Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/claims"
              payload: { member_id: "${m_id}", claim_type: "DISABILITY_COMPENSATION", claimed_rating_pct: 30 }
              as: AccreditedRepresentative
              captures: { claim_id: "$.data.id", dep: "$.data.dependent_count" }
          trigger:
            - call: "POST /veteran-services/claims/${claim_id}/decide"
              payload: { outcome: "GRANTED", decided_rating_pct: 30 }
              as: BenefitsOfficer
              as_user_id: "officer-a"
              captures: { fin: "$.data.final_monthly_cents" }
          assert:
            - "dep == 0 (default applied at creation)"
            - "fin == 53710 (round_half_up((52400 + 0) * 1.025)) — no dependent allowance at dependent_count 0"

      - name: survey_submit_ignores_client_wellbeing_score_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.OutcomeSurvey.fields.wellbeing_score
          - calculations.wellbeing_score
        distinguishing_aspect: "wellbeing_score is computed, never client-set: a submit smuggling wellbeing_score=1 still stores (3+3+2+3+3)*4 == 56."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. VERIFIED veteran with an INTAKE enrollment; clock nudged so the BASELINE wave is OPEN."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 5 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Survey Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { e_id: "$.data.id" }
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /veteran-services/enrollments/${e_id}/surveys"
              payload: { wave: "BASELINE" }
              as: OutcomeAnalyst
              captures: { sv: "$.data[0].id" }
          trigger:
            - call: "POST /veteran-services/surveys/${sv}/submit"
              payload: { q1: 3, q2: 3, q3: 2, q4: 3, q5: 3, wellbeing_score: 1 }
              as: ProgramMember
              as_user_id: "${m_id}"
              captures: { score: "$.data.wellbeing_score" }
          assert:
            - "score == 56 ((3+3+2+3+3)*4); the smuggled wellbeing_score=1 was ignored"
            - "OutcomeSurvey.${sv}.status == SUBMITTED"

      - name: assessment_rows_carry_no_version
        claim_type: Immutability
        grounds:
          - entities.Assessment
        distinguishing_aspect: "Assessment declares common_fields: false — the created row carries id and created_at but no version and no updated_at, and no update endpoint exists for it."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. VERIFIED veteran with an INTAKE enrollment."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 5 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Immutable Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { e_id: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/enrollments/${e_id}/assessments"
              payload: { psych_score: 6, phys_score: 6, voc_score: 6, soc_score: 6 }
              as: IntakeCoordinator
              captures: { a_id: "$.data.id" }
          assert:
            - "the 201 response row carries id and created_at"
            - "the response row has NO version field and NO updated_at field (common_fields: false)"
            - "GET /veteran-services/enrollments/${e_id}/assessments returns the same shape without version"

      - name: claim_create_out_of_step_rating_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.BenefitsClaim.fields.claimed_rating_pct
          - validations[priority=2]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "claimed_rating_pct must be a multiple of 10 in 0..100; 55 is rejected at priority 2 with 400 ERR_INVALID_REQUEST before any existence or state check runs."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One VERIFIED veteran."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Rating Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /veteran-services/claims"
              payload: { member_id: "${m_id}", claim_type: "DISABILITY_COMPENSATION", claimed_rating_pct: 55 }
              as: AccreditedRepresentative
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /veteran-services/members/${m_id}/claims returns 0 rows"

      - name: member_create_family_with_branch_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Member.fields.branch_of_service
          - validations[priority=2]
        distinguishing_aspect: "branch_of_service must be null for FAMILY_SUPPORT members; supplying ARMY with member_type FAMILY_SUPPORT is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /veteran-services/members"
              payload: { full_name: "Branch Fam", member_type: "FAMILY_SUPPORT", service_era_claimed: "POST_911", injury_connection_claimed: "NON_SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"

      - name: get_referral_with_unknown_id_returns_referral_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/veteran-services/referrals/{referral_id}
          - errors.ERR_REFERRAL_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated referral id returns the entity-specific 404 ERR_REFERRAL_NOT_FOUND, not a generic 404 and not 400."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. No referrals exist."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /veteran-services/referrals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404 and err == ERR_REFERRAL_NOT_FOUND"
            - "response_type is error and data carries error_id and message"

      - name: enrollment_create_with_unknown_track_returns_track_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Enrollment.fields.program_track_id
          - validations[priority=4]
          - errors.ERR_PROGRAM_TRACK_NOT_FOUND
        distinguishing_aspect: "Flat topology puts program_track_id in the body; an unknown track id is a 404 ERR_PROGRAM_TRACK_NOT_FOUND (existence, priority 4) even when the member is VERIFIED."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One VERIFIED veteran; no tracks exist."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Orphan Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "00000000-0000-4000-8000-000000000000" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404 and err == ERR_PROGRAM_TRACK_NOT_FOUND"
            - "GET /veteran-services/enrollments?member_id=${m_id} returns 0 rows"

      - name: enrollments_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/veteran-services/enrollments
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three enrollments on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; total_count counts the whole filtered set."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. MENTAL_HEALTH track capacity 10; three VERIFIED veterans each enrolled."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 10 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Page One", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${p1}", expected_member_version: "${p1_v}" }
              as: IntakeCoordinator
              captures: { pc1: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${pc1}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${p1}", program_track_id: "${trk}" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/members"
              payload: { full_name: "Page Two", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "NAVY" }
              as: IntakeCoordinator
              captures: { p2: "$.data.id", p2_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${p2}", expected_member_version: "${p2_v}" }
              as: IntakeCoordinator
              captures: { pc2: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${pc2}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${p2}", program_track_id: "${trk}" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/members"
              payload: { full_name: "Page Three", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "MARINES" }
              as: IntakeCoordinator
              captures: { p3: "$.data.id", p3_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${p3}", expected_member_version: "${p3_v}" }
              as: IntakeCoordinator
              captures: { pc3: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${pc3}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${p3}", program_track_id: "${trk}" }
              as: IntakeCoordinator
          trigger:
            - call: "GET /veteran-services/enrollments"
              payload: { program_track_id: "${trk}", limit: 2, offset: 0 }
              as: IntakeCoordinator
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /veteran-services/enrollments?program_track_id=${trk}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /veteran-services/enrollments with no parameters returns 3 rows with the default limit 10 and offset 0"

  - section: state_machines
    instances:
      - name: eligibility_case_starts_under_review
        claim_type: Initial State
        grounds:
          - state_machines.EligibilityCase
          - endpoints.POST_/veteran-services/eligibility-cases
        distinguishing_aspect: "A newly created case is UNDER_REVIEW (not SUBMITTED or PENDED) at version 1, with null decided_at, and superseding it flips it to SUPERSEDED."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One member at version 1."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Init Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
          trigger:
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { c_id: "$.data.id", c_status: "$.data.status", c_v: "$.data.version" }
          assert:
            - "c_status == UNDER_REVIEW and c_v == 1"
            - "EligibilityCase.${c_id}.decided_at is null"

      - name: enrollment_intake_cannot_complete_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Enrollment
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "COMPLETED is only reachable from ACTIVE; an INTAKE enrollment (no assessment yet) rejects target_status=COMPLETED with 409 ERR_INVALID_STATE and stays INTAKE."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. VERIFIED veteran with an INTAKE enrollment."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 5 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Skip Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { e_id: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/enrollments/${e_id}/transition"
              payload: { target_status: "COMPLETED" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
