      - name: session_no_show_credit_not_refunded
        claim_type: Side Effect Execution
        grounds: [state_machines.CounselingSession.SCHEDULED_to_NO_SHOW, calculations.session_credit_ledger]
        distinguishing_aspect: "A NO_SHOW keeps the credit consumed: after book+no-show, sessions_used stays 1 and sessions_remaining stays covered_sessions-1 (contrast with cancel which refunds)."
        test_recipe:
          setup: ["Case covered_sessions=2; one booked session"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred N", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC AE", npi: "2000000014" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 2 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
