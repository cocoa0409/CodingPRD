  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: recertification_threshold_exact_equality
        grounds:
          - calculations.recertification_outcome
          - entities.RecertificationRecord.fields.official_service_hours
        distinguishing_aspect: |
          Boundary on the APPROVED-HOURS metric via POST /program-cycles/{id}/close:
          official_service_hours exactly 40.0 against requirement 40.0 RECERTIFIES
          (>= semantics), while 39.75 — one 0.25 quantum below — SHORTFALLS.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteers V1 and V2 both ACTIVE"
            - "V1: approved SERVICE 12+12+12+4.0 = 40.0 and approved CE 10.0; V2: approved SERVICE 12+12+12+3.75 = 39.75 and approved CE 10.0"
            - "Clock 2026-11-02; cycle in RECERTIFICATION"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app1: "$.data.id" } }
            - { call: "POST /applications/${app1}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app1}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app1}", as: ProgramCoordinator, captures: { vol1: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol1}" }, as: ProgramCoordinator, captures: { enr1: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr1}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr1}/complete", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Bob Birch", email: "bob@example.org", county: "Cecil", prior_gardening_years: 3 }, as: ProgramCoordinator, captures: { app2: "$.data.id" } }
            - { call: "POST /applications/${app2}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app2}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app2}", as: ProgramCoordinator, captures: { vol2: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol2}" }, as: ProgramCoordinator, captures: { enr2: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr2}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr2}/complete", as: ProgramCoordinator }
            - { call: "GET /recertification-records?volunteer_id=${vol1}&cycle_id=${cyc}", as: ProgramCoordinator, captures: { rec1: "$.data[0].id" } }
            - { call: "GET /recertification-records?volunteer_id=${vol2}&cycle_id=${cyc}", as: ProgramCoordinator, captures: { rec2: "$.data[0].id" } }
            - { call: "POST /volunteers/${vol1}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 12.0 }, as: Volunteer, as_user_id: "${vol1}", captures: { a1: "$.data.id" } }
            - { call: "POST /credit-entries/${a1}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol1}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-06", hours: 12.0 }, as: Volunteer, as_user_id: "${vol1}", captures: { a2: "$.data.id" } }
            - { call: "POST /credit-entries/${a2}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol1}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-07", hours: 12.0 }, as: Volunteer, as_user_id: "${vol1}", captures: { a3: "$.data.id" } }
            - { call: "POST /credit-entries/${a3}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol1}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-08", hours: 4.0 }, as: Volunteer, as_user_id: "${vol1}", captures: { a4: "$.data.id" } }
            - { call: "POST /credit-entries/${a4}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol1}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "CONTINUING_ED", activity_date: "2026-09-01", hours: 10.0, provider: "Extension College", title: "Advanced IPM" }, as: Volunteer, as_user_id: "${vol1}", captures: { a5: "$.data.id" } }
            - { call: "POST /credit-entries/${a5}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol2}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 12.0 }, as: Volunteer, as_user_id: "${vol2}", captures: { b1: "$.data.id" } }
            - { call: "POST /credit-entries/${b1}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol2}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-06", hours: 12.0 }, as: Volunteer, as_user_id: "${vol2}", captures: { b2: "$.data.id" } }
            - { call: "POST /credit-entries/${b2}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol2}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-07", hours: 12.0 }, as: Volunteer, as_user_id: "${vol2}", captures: { b3: "$.data.id" } }
            - { call: "POST /credit-entries/${b3}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol2}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-08", hours: 3.75 }, as: Volunteer, as_user_id: "${vol2}", captures: { b4: "$.data.id" } }
            - { call: "POST /credit-entries/${b4}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol2}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "CONTINUING_ED", activity_date: "2026-09-01", hours: 10.0, provider: "Extension College", title: "Advanced IPM" }, as: Volunteer, as_user_id: "${vol2}", captures: { b5: "$.data.id" } }
            - { call: "POST /credit-entries/${b5}/approve", as: ProgramCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program-cycles/${cyc}/begin-recertification", as: ProgramCoordinator }
          trigger:
            - { call: "POST /program-cycles/${cyc}/close", as: ProgramCoordinator }
          assert:
            - "RecertificationRecord.${rec1}.status == RECERTIFIED   (40.0 >= 40.0: equality passes)"
            - "RecertificationRecord.${rec2}.status == SHORTFALL   (39.75 < 40.0: one quantum below fails)"
            - "Volunteer.${vol1}.status == ACTIVE and consecutive_shortfall_cycles == 0"
            - "Volunteer.${vol2}.status == INACTIVE and consecutive_shortfall_cycles == 1"

      - name: shift_capacity_exact_full_boundary
        grounds:
          - state_machines.Shift.OPEN_to_FULL
          - calculations.overlap_rules
          - entities.Shift.fields.filled_count
        distinguishing_aspect: |
          Boundary on the SEAT-COUNT metric via POST /shifts/{id}/signups (a
          different metric and endpoint than recertification hours): with
          capacity 1 the first signup at filled_count == 0 succeeds and flips
          the shift FULL; the second signup at filled_count == capacity fails.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteers V1 and V2 ACTIVE; shift 2026-08-20 09:00-12:00 capacity 1"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app1: "$.data.id" } }
            - { call: "POST /applications/${app1}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app1}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app1}", as: ProgramCoordinator, captures: { vol1: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol1}" }, as: ProgramCoordinator, captures: { enr1: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr1}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr1}/complete", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Bob Birch", email: "bob@example.org", county: "Cecil", prior_gardening_years: 3 }, as: ProgramCoordinator, captures: { app2: "$.data.id" } }
            - { call: "POST /applications/${app2}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app2}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app2}", as: ProgramCoordinator, captures: { vol2: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol2}" }, as: ProgramCoordinator, captures: { enr2: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr2}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr2}/complete", as: ProgramCoordinator }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-20T09:00:00Z", end_time: "2026-08-20T12:00:00Z", capacity: 1 }, as: ProgramCoordinator, captures: { sh: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol1}" }, as: Volunteer, as_user_id: "${vol1}", captures: { su1: "$.data.id" } }
            - { call: "GET /shifts/${sh}", as: ProgramCoordinator, captures: { mid_status: "$.data.status", mid_filled: "$.data.filled_count" } }
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol2}" }, as: Volunteer, as_user_id: "${vol2}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured mid_filled == 1 and mid_status == FULL   (filled_count == capacity flipped the shift)"
            - "captured err == ERR_SHIFT_NOT_OPEN   (signup at filled_count == capacity rejected)"
            - "ShiftSignup.${su1}.status == SIGNED_UP"

