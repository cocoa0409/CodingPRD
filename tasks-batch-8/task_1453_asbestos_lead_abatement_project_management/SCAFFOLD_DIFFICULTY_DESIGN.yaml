    instances:
      - name: clearance_threshold_exactly_010_fails
        grounds:
          - calculations.clearance_threshold_outcome
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Boundary on the concentration metric via POST
          /abatement/air-tests/{id}/result: the criterion is result_f_cc <
          0.010, so 0.009 is PASS while exactly 0.010 is FAIL — strict
          inequality, no tolerance.
        test_recipe:
          setup:
            - "Project P IN_PROGRESS (canonical chain); work completed -> AWAITING_CLEARANCE; CLEARANCE tests T1 (collected 2026-08-12T08:00:00Z) and T2 (collected 2026-08-12T09:00:00Z) created by hygienist ih_1 (containment verified by supervisor ${w_sup}, so no SoD conflict)"
