# =============================================================================
# §1.9 Scaffold Corner Design (Breadth / Non-Difficulty Coverage) — task_0485
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# section: / claim_type: values come verbatim from that guide.
# excluded_because stubs cite a §1.8 instance by name (no test_recipe).
# Default clock = 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_servicerequest_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.ServiceRequest, endpoints]
        distinguishing_aspect: "POST /service-requests with all required fields returns 201, status=DRAFT, server-minted id, version=1."
        test_recipe:
          setup: ["County and Client exist."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Kern", state_code: "CA" }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /clients"
              payload: { firm_name: "Cre Law", email: "c@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "1 St", service_lat: 35.3, service_lng: -119.0 }
              as: Dispatcher
              captures: { sr_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response status == 201"
            - "ServiceRequest.${sr_id}.status == DRAFT"
            - "ServiceRequest.${sr_id}.version == 1"
            - "ServiceRequest.${sr_id}.final_fee_cents == 0"

      - name: get_servicerequest_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.ServiceRequest, endpoints]
        distinguishing_aspect: "GET /service-requests/{id} returns the matching stored request with recipient_name echoed."
        test_recipe:
          setup: ["A request exists."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Kings", state_code: "CA" }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /clients"
              payload: { firm_name: "Ret Law", email: "r@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "Jane Q", service_address: "2 St", service_lat: 36.0, service_lng: -119.8 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
          trigger:
            - call: "GET /service-requests/${sr_id}"
              payload: {}
              as: Dispatcher
              captures: { rn: $.data.recipient_name }
          assert:
            - "response status == 200"
            - "ServiceRequest.${sr_id}.recipient_name == Jane Q"

      - name: list_servicerequests_paginated_envelope
        claim_type: Listing
        grounds: [entities.ServiceRequest, endpoints]
        distinguishing_aspect: "GET /service-requests returns an array response_type with total_count and has_more in pagination."
        test_recipe:
          setup: ["At least one request exists."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Tulare", state_code: "CA" }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /clients"
              payload: { firm_name: "Lst Law", email: "l@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "3 St", service_lat: 36.2, service_lng: -119.3 }
              as: Dispatcher
          trigger:
            - call: "GET /service-requests"
              payload: { client_id: "${client_id}", limit: 10, offset: 0 }
              as: Dispatcher
          assert:
            - "response_type == array"
            - "pagination total_count >= 1"
            - "has_more == false"

      - name: get_servicerequest_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /service-requests/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /service-requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_servicerequest_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.ServiceRequest, endpoints]
        distinguishing_aspect: "POST /service-requests missing recipient_name returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["County and Client exist."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Fresno", state_code: "CA" }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /clients"
              payload: { firm_name: "Mis Law", email: "m@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", service_address: "4 St", service_lat: 36.7, service_lng: -119.7 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_county_omitting_defaults_applies_defaults
        claim_type: Defaults
        grounds: [entities.County.fields.min_diligent_attempts, entities.County.fields.e_file_enabled, endpoints]
        distinguishing_aspect: "POST /counties without optional flags applies defaults: e_file_enabled=false, min_diligent_attempts=3, filing_fee_cents=4000, max_concurrent_filings=2."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /counties"
              payload: { name: "Madera", state_code: "CA" }
              as: Admin
              captures: { cid: $.data.id, ef: $.data.e_file_enabled, mda: $.data.min_diligent_attempts }
          assert:
            - "County.${cid}.e_file_enabled == false"
            - "County.${cid}.min_diligent_attempts == 3"
            - "County.${cid}.filing_fee_cents == 4000"
            - "County.${cid}.max_concurrent_filings == 2"

      - name: servicerequest_quoted_fee_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.ServiceRequest.fields.quoted_fee_cents, calculations.service_fee, endpoints]
        distinguishing_aspect: "quoted_fee_cents is server-computed at submit (7575 for a 3-page non-rush request); it cannot be supplied by the client."
        test_recipe:
          setup: ["County, Client, 3-page request submitted."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Merced", state_code: "CA", min_diligent_attempts: 1 }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /clients"
              payload: { firm_name: "Cmp Law", email: "p@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "5 St", service_lat: 37.3, service_lng: -120.5 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUMMONS", page_count: 3 }
              as: Dispatcher
          trigger:
            - call: "POST /service-requests/${sr_id}/submit"
              payload: {}
              as: Dispatcher
              captures: { q: $.data.quoted_fee_cents }
          assert:
            - "ServiceRequest.${sr_id}.quoted_fee_cents == 7575"

      - name: create_document_invalid_enum_doc_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Document.fields.doc_type, "errors[ERR_INVALID_REQUEST]", endpoints]
        distinguishing_aspect: "POST /service-requests/{id}/documents with doc_type=BANANA (not in enum) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["A DRAFT request exists."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Stanislaus", state_code: "CA" }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /clients"
              payload: { firm_name: "Enm Law", email: "e@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "6 St", service_lat: 37.6, service_lng: -121.0 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
          trigger:
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "BANANA", page_count: 2 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_document_page_count_zero_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Document.fields.page_count, "errors[ERR_INVALID_REQUEST]", endpoints]
        distinguishing_aspect: "page_count must be >=1; page_count=0 returns ERR_INVALID_REQUEST 422 (a numeric-range constraint distinct from the enum case)."
        test_recipe:
          setup: ["A DRAFT request exists."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "SanJoaquin", state_code: "CA" }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /clients"
              payload: { firm_name: "Pg Law", email: "g@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "7 St", service_lat: 37.9, service_lng: -121.3 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
          trigger:
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUMMONS", page_count: 0 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: servicerequest_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.ServiceRequest, endpoints]
        distinguishing_aspect: "id/created_at/version are system-generated; status is forced to DRAFT on create regardless of body."
        test_recipe:
          setup: ["County and Client exist."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Mariposa", state_code: "CA" }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /clients"
              payload: { firm_name: "Sys Law", email: "s@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "8 St", service_lat: 37.5, service_lng: -119.9 }
              as: Dispatcher
              captures: { sr_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "ServiceRequest.${sr_id}.status == DRAFT"
            - "ServiceRequest.${sr_id}.version == 1"

      - name: create_servicerequest_wrong_parent_county_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.ServiceRequest.fields.county_id, "errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "POST /service-requests with a county_id that does not exist returns ERR_NOT_FOUND 404 (FK existence)."
        test_recipe:
          setup: ["A Client exists; county_id is bogus."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { firm_name: "Fk Law", email: "f@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "00000000-0000-4000-8000-000000000999", recipient_name: "R", service_address: "9 St", service_lat: 37.0, service_lng: -120.0 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: serverterritory_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ServerTerritory, endpoints]
        distinguishing_aspect: "ServerTerritory has common_fields:false (id+created_at only); created via POST /servers/{id}/territories and never updated, carries no version field."
        test_recipe:
          setup: ["A Server and County exist."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Amador", state_code: "CA" }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "Imm Utable", license_no: "PS-IMM1" }
              as: Admin
              captures: { server_id: $.data.id }
          trigger:
            - call: "POST /servers/${server_id}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
              captures: { tid: $.data.id }
          assert:
            - "response status == 201"
            - "ServerTerritory.${tid}.id present and created_at present; no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_request_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceRequest, "errors[ERR_INVALID_STATE]", endpoints]
        distinguishing_aspect: "A CANCELLED request cancelled again returns ERR_INVALID_STATE 409; no further cascade fires."
        test_recipe:
          setup: ["A DRAFT request cancelled once (now CANCELLED)."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Calaveras", state_code: "CA" }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /clients"
              payload: { firm_name: "Cn Law", email: "n@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "1 St", service_lat: 38.2, service_lng: -120.6 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/cancel"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-requests/${sr_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: newly_created_servicerequest_initial_state_draft
        claim_type: Initial State
        grounds: [state_machines.ServiceRequest, endpoints]
        distinguishing_aspect: "A freshly created ServiceRequest is in initial_state DRAFT."
        test_recipe:
          setup: ["County and Client exist."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Alpine", state_code: "CA" }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /clients"
              payload: { firm_name: "In Law", email: "ii@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "2 St", service_lat: 38.6, service_lng: -119.8 }
              as: Dispatcher
              captures: { sr_id: $.data.id, st: $.data.status }
          assert:
            - "ServiceRequest.${sr_id}.status == DRAFT"

      - name: complete_from_terminal_completed_request_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceRequest, "errors[ERR_INVALID_STATE]", endpoints]
        distinguishing_aspect: "From terminal COMPLETED, POST /service-requests/{id}/complete returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A request driven to NON_EST then COMPLETED."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Trinity", state_code: "CA", min_diligent_attempts: 1 }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "Term Inal", license_no: "PS-TRM1" }
              as: Admin
              captures: { server_id: $.data.id }
            - call: "POST /servers/${server_id}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Tm Law", email: "tm@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/deposits"
              payload: { amount_cents: 50000 }
              as: Admin
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "3 St", service_lat: 40.6, service_lng: -123.0 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUMMONS", page_count: 1 }
              as: Dispatcher
            - call: "POST /service-requests/${sr_id}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr_v: $.data.version }
            - call: "POST /service-requests/${sr_id}/assignments"
              payload: { server_id: "${server_id}", expected_service_request_version: "${sr_v}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/attempts"
              payload: { attempted_at_utc: "2026-01-01T09:00:00Z", gps_lat: 40.6, gps_lng: -123.0, outcome: "NO_ANSWER" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /service-requests/${sr_id}/non-est"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /service-requests/${sr_id}/complete"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-requests/${sr_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "ServiceRequest.${sr_id}.status == COMPLETED"

      - name: accept_offer_twice_idempotency_second_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Assignment, "errors[ERR_INVALID_STATE]", endpoints]
        distinguishing_aspect: "Accepting an already-ACTIVE assignment a second time returns ERR_INVALID_STATE 409 (no longer OFFERED)."
        test_recipe:
          setup: ["An assignment accepted once (now ACTIVE)."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Shasta", state_code: "CA", min_diligent_attempts: 1 }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "Id Em", license_no: "PS-IDM1" }
              as: Admin
              captures: { server_id: $.data.id }
            - call: "POST /servers/${server_id}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Idm Law", email: "id@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "4 St", service_lat: 40.6, service_lng: -122.4 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUMMONS", page_count: 1 }
              as: Dispatcher
            - call: "POST /service-requests/${sr_id}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr_v: $.data.version }
            - call: "POST /service-requests/${sr_id}/assignments"
              payload: { server_id: "${server_id}", expected_service_request_version: "${sr_v}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
          trigger:
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: skiptrace_located_updates_request_address_bubble
        claim_type: Side Effect Execution
        grounds: [state_machines.SkipTrace.IN_PROGRESS_to_LOCATED, entities.ServiceRequest.fields.service_address, endpoints]
        distinguishing_aspect: "SkipTrace LOCATED side-effect sets located_address and overwrites ServiceRequest.service_address to that value."
        test_recipe:
          setup: ["A request with a skip-trace having candidate_addresses; skip-trace IN_PROGRESS."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Lassen", state_code: "CA", min_diligent_attempts: 1 }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "Loc Ate", license_no: "PS-LOC1" }
              as: Admin
              captures: { server_id: $.data.id }
            - call: "POST /servers/${server_id}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Lc Law", email: "lc@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "old addr", service_lat: 40.4, service_lng: -120.6, skip_trace_requested: true }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/skip-traces"
              payload: { candidate_addresses: ["123 Found Ln", "999 Other Rd"] }
              as: Dispatcher
              captures: { st_id: $.data.id }
            - call: "POST /skip-traces/${st_id}/state"
              payload: { to_status: "IN_PROGRESS" }
              as: Server
              as_user_id: "${server_id}"
          trigger:
            - call: "POST /skip-traces/${st_id}/state"
              payload: { to_status: "LOCATED", located_address: "123 Found Ln" }
              as: Server
              as_user_id: "${server_id}"
              captures: { la: $.data.located_address }
          assert:
            - "SkipTrace.${st_id}.status == LOCATED"
            - "SkipTrace.${st_id}.located_address == 123 Found Ln"
            - "ServiceRequest.${sr_id}.service_address == 123 Found Ln"

      - name: skiptrace_located_address_not_candidate_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.SkipTrace.IN_PROGRESS_to_LOCATED, "errors[ERR_ADDRESS_NOT_CANDIDATE]", endpoints]
        distinguishing_aspect: "LOCATED with located_address not in candidate_addresses returns ERR_ADDRESS_NOT_CANDIDATE 409."
        test_recipe:
          setup: ["A skip-trace IN_PROGRESS with candidate_addresses=['A St']."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Siskiyou", state_code: "CA", min_diligent_attempts: 1 }
              as: Admin
              captures: { county_id: $.data.id }
