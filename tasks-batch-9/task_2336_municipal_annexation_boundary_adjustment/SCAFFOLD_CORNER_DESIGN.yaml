              as_user_id: "${muni_r6}"
              captures: { ow_r6a: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ben Olsen", contact_email: "ben@example.test" }
              as: CityClerk
              as_user_id: "${muni_r6}"
              captures: { ow_r6b: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_r6}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 2, developed_lot_count: 2, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_r6}"
              captures: { case_r6: $.data.id }
            - call: "POST /annexation-cases/${case_r6}/parcels"
              payload: { primary_owner_id: "${ow_r6a}", parcel_apn: "R6-1", assessed_value_cents: 50000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_r6}"
              captures: { parcel_r6a: $.data.id }
            - call: "POST /annexation-cases/${case_r6}/parcels"
              payload: { primary_owner_id: "${ow_r6b}", parcel_apn: "R6-2", assessed_value_cents: 50000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_r6}"
              captures: { parcel_r6b: $.data.id }
            - call: "POST /annexation-cases/${case_r6}/certify-territory"
              payload: {}
              as: MunicipalPlanner
