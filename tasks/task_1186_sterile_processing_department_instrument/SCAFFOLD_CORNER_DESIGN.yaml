            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${ta}", captures: { ld: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${ld}/trays", payload: { tray_id: "${s2}" }, as: SpdTechnician, as_user_id: "${ta}" }
