        distinguishing_aspect: "The duplicate check at 920 outranks the channel check at 921, so re-adding an already-present SKU is a duplicate error even when that SKU would also violate the channel rule; a distinct PROFESSIONAL SKU appended to a BRANDED pack yields the channel error, and PRIVATE_LABEL is likewise refused."
