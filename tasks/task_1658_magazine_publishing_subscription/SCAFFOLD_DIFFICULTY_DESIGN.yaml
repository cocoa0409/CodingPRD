              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "s1@x.com", full_name: "S1", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { s1: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "s2@x.com", full_name: "S2", address_line1: "2 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { s2: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "s3@x.com", full_name: "S3", address_line1: "3 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { s3: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${s1}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { ss1: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${s2}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { ss2: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${s3}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { ss3: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${ss1}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${ss2}/activate"
              payload: {}
