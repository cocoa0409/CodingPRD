              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer_a: $.data.id }
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { lease_v2: $.data.version }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "BALANCED", expected_lease_version: "${lease_v}" }
