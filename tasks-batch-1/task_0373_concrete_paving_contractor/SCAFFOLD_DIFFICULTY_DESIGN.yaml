scaffold_difficulty_design:
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cubic_yards_provisional_vs_material_order_variant
        grounds:
          - calculations.estimate_cubic_yards
          - calculations.material_order_cubic_yards
          - entities.Estimate.fields.provisional_cubic_yards
          - entities.MaterialOrder.fields.order_cubic_yards
        distinguishing_aspect: |
          Same five 150-sqft @ 4in segments yield provisional_cubic_yards == 11 (sum-then-ceil on the Estimate)
          but order_cubic_yards == 12 (per-segment ceil-to-0.25-yd-then-sum-then-ceil on the MaterialOrder) — the
          two variants live on different entity domains (Estimate volume vs MaterialOrder ticket volume).
        test_recipe:
          setup:
            - "A DRAFT project with five FlatworkSegments, each 150 sqft @ 4 in, BROOM/NONE."
            - "An estimate created (so provisional_cubic_yards is computed); estimate approved so a material order can be placed."
            - "A material order placed (so order_cubic_yards is computed)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Lot 5", client_name: "Acme" }
              as: Estimator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "s1", area_sqft: 150, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "s2", area_sqft: 150, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "s3", area_sqft: 150, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "s4", area_sqft: 150, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "s5", area_sqft: 150, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id, prov_cy: $.data.provisional_cubic_yards }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj_id}/approve-estimate"
              payload: { estimate_id: "${est_id}", expected_project_version: "${pv}" }
              as: ProjectManager
          trigger:
            - call: "POST /projects/${proj_id}/material-orders"
              payload: { mix_type: "STANDARD", pour_scheduled_start: "2026-07-01T12:00:00Z", pour_duration_hours: 4 }
              as: ProjectManager
              captures: { order_cy: $.data.order_cubic_yards }
          assert:
            - "Estimate.${est_id}.provisional_cubic_yards == 11"
            - "MaterialOrder.order_cubic_yards == 12"
            - "MaterialOrder.order_cubic_yards > Estimate.${est_id}.provisional_cubic_yards"

      - name: contract_value_provisional_vs_committed_variant
        grounds:
          - calculations.provisional_contract_value
          - calculations.committed_contract_value
          - entities.Project.fields.provisional_contract_value
          - entities.Project.fields.committed_contract_value
          - state_machines.ChangeOrder.transitions.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          With base 12452.50, one APPROVED +1500.00 CO and one UNDER_REVIEW -300.00 CO, provisional_contract_value
          == 13652.50 (forward-looking, includes UNDER_REVIEW) while committed_contract_value == 13952.50 (approved-only) —
          the two variants diverge on the Project fiscal domain, a different domain from the cubic-yard volume variant.
        test_recipe:
          setup:
            - "An APPROVED project whose base_contract_amount == 12452.50 (840 sqft: 600@4 BROOM/REBAR + 240@5 STAMPED/REBAR)."
            - "One change order APPROVED with delta_amount +1500.00 and one change order UNDER_REVIEW with delta_amount -300.00."
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Drive A", client_name: "Beta" }
              as: Estimator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "driveway", area_sqft: 600, thickness_in: 4, finish_grade: "BROOM", reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "patio", area_sqft: 240, thickness_in: 5, finish_grade: "STAMPED", reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id, est_total: $.data.estimate_total }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv0: $.data.version }
            - call: "POST /projects/${proj_id}/approve-estimate"
              payload: { estimate_id: "${est_id}", expected_project_version: "${pv0}" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/change-orders"
              payload: { description: "add curb", delta_amount: 1500.00 }
              as: FinanceOfficer
              as_user_id: "fin_1"
              captures: { co1_id: $.data.id }
            - call: "POST /change-orders/${co1_id}/start-review"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin_1"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin_1"
              captures: { pv1: $.data.version }
            - call: "POST /change-orders/${co1_id}/approve"
              payload: { expected_project_version: "${pv1}" }
              as: FinanceOfficer
              as_user_id: "fin_1"
            - call: "POST /projects/${proj_id}/change-orders"
              payload: { description: "remove drain", delta_amount: -300.00 }
              as: FinanceOfficer
              as_user_id: "fin_1"
              captures: { co2_id: $.data.id }
            - call: "POST /change-orders/${co2_id}/start-review"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin_1"
          trigger:
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { prov: $.data.provisional_contract_value, comm: $.data.committed_contract_value }
          assert:
            - "Project.${proj_id}.base_contract_amount == 12452.50"
            - "Project.${proj_id}.provisional_contract_value == 13652.50"
            - "Project.${proj_id}.committed_contract_value == 13952.50"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: estimate_total_tiered_finish_reinforcement_mode_a
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.estimate_total
          - entities.FlatworkSegment.fields.finish_grade
          - entities.FlatworkSegment.fields.reinforcement
        distinguishing_aspect: |
          MODE (a): estimate_total combines >=3 inputs with non-linear interaction — marginal tiered per-sqft labor
          (9.00/7.50/6.00 across 500/1000/rest breakpoints), a finish multiplier (max over segments = 1.35 STAMPED),
          and an additive per-sqft reinforcement charge (REBAR 1.25) — producing 12452.50 for the 840-sqft project.
        test_recipe:
          setup:
            - "A DRAFT project with 600@4 BROOM/REBAR and 240@5 STAMPED/REBAR segments (total 840 sqft, prov_cy 13)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Combo A", client_name: "Gamma" }
              as: Estimator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "driveway", area_sqft: 600, thickness_in: 4, finish_grade: "BROOM", reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "patio", area_sqft: 240, thickness_in: 5, finish_grade: "STAMPED", reinforcement: "REBAR" }
              as: Estimator
          trigger:
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id, et: $.data.estimate_total, ls: $.data.labor_subtotal, ms: $.data.material_subtotal }
          assert:
            - "Estimate.labor_subtotal == 10567.50"
            - "Estimate.material_subtotal == 1885.00"
            - "Estimate.estimate_total == 12452.50"

      - name: cubic_yards_rounding_order_mode_b
        grounds:
          - calculations.estimate_cubic_yards
          - calculations.material_order_cubic_yards
          - entities.MaterialOrder.fields.order_cubic_yards
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters — sum-then-ceil (provisional == 11) vs per-segment
          ceil-to-0.25-then-sum-then-ceil (order == 12) on identical five 150-sqft @ 4in segments; the scaffold pins
          per-segment-first for the material order, a distinct combinatorial axis from the mode-(a) tiered formula.
        test_recipe:
          setup:
            - "An APPROVED project with five 150-sqft @ 4in segments so both volume variants are computable."
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Round B", client_name: "Delta" }
              as: Estimator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "s1", area_sqft: 150, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "s2", area_sqft: 150, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "s3", area_sqft: 150, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "s4", area_sqft: 150, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "s5", area_sqft: 150, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id, prov_cy: $.data.provisional_cubic_yards }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj_id}/approve-estimate"
              payload: { estimate_id: "${est_id}", expected_project_version: "${pv}" }
              as: ProjectManager
          trigger:
            - call: "POST /projects/${proj_id}/material-orders"
              payload: { mix_type: "STANDARD", pour_scheduled_start: "2026-07-01T12:00:00Z", pour_duration_hours: 4 }
              as: ProjectManager
              captures: { order_cy: $.data.order_cubic_yards }
          assert:
            - "Estimate.${est_id}.provisional_cubic_yards == 11"
            - "MaterialOrder.order_cubic_yards == 12"

  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: change_order_revision_cycle_loop
        grounds:
          - state_machines.ChangeOrder.transitions.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.ChangeOrder.transitions.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.ChangeOrder.transitions.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          ChangeOrder is cyclic: UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW re-enters review with a
          new delta_amount, a true loop on the ChangeOrder entity (distinct entity from the Warranty self-loop instance).
        test_recipe:
          setup:
            - "An APPROVED project (12452.50) with a SUBMITTED change order delta +1000.00."
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Cyc A", client_name: "Eps" }
              as: Estimator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "driveway", area_sqft: 600, thickness_in: 4, finish_grade: "BROOM", reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "patio", area_sqft: 240, thickness_in: 5, finish_grade: "STAMPED", reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv0: $.data.version }
            - call: "POST /projects/${proj_id}/approve-estimate"
              payload: { estimate_id: "${est_id}", expected_project_version: "${pv0}" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/change-orders"
              payload: { description: "scope tweak", delta_amount: 1000.00 }
              as: FinanceOfficer
              as_user_id: "fin_1"
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/start-review"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin_1"
            - call: "POST /change-orders/${co_id}/request-revision"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin_1"
            - call: "POST /change-orders/${co_id}/resubmit"
              payload: { delta_amount: 2200.00 }
              as: FinanceOfficer
              as_user_id: "fin_1"
          trigger:
            - call: "POST /change-orders/${co_id}/start-review"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin_1"
              captures: { st: $.data.status, da: $.data.delta_amount }
          assert:
            - "ChangeOrder.${co_id}.status == UNDER_REVIEW"
            - "ChangeOrder.${co_id}.delta_amount == 2200.00"

      - name: warranty_claim_open_self_loop_and_revert
        grounds:
          - state_machines.Warranty.transitions.ACTIVE_to_CLAIM_OPEN
          - state_machines.Warranty.transitions.CLAIM_OPEN_to_CLAIM_OPEN
          - state_machines.Warranty.transitions.CLAIM_OPEN_to_ACTIVE
        distinguishing_aspect: |
          Warranty has a self-loop CLAIM_OPEN -> CLAIM_OPEN (a second claim increments defect_claims_count to 2 without
          changing state) and a revert CLAIM_OPEN -> ACTIVE on resolve — non-linear on the Warranty entity (distinct from
          the ChangeOrder cyclic instance).
        test_recipe:
          setup:
            - "A COMPLETED project with an ACTIVE warranty, then one claim filed (CLAIM_OPEN, count 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /projects"
              payload: { site_name: "War A", client_name: "Zeta" }
              as: Estimator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "slab", area_sqft: 400, thickness_in: 4, reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv0: $.data.version }
            - call: "POST /projects/${proj_id}/approve-estimate"
              payload: { estimate_id: "${est_id}", expected_project_version: "${pv0}" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/permits"
              payload: { jurisdiction: "City", permit_number: "P-1" }
              as: ProjectManager
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/issue"
              payload: {}
              as: Inspector
            - call: "POST /projects/${proj_id}/material-orders"
              payload: { mix_type: "HIGH_EARLY", pour_scheduled_start: "2026-06-01T06:00:00Z", pour_duration_hours: 4 }
              as: ProjectManager
              captures: { mo_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "C1", skill: "FLATWORK", headcount: 4 }
              as: ProjectManager
              captures: { crew_id: $.data.id }
            - call: "POST /projects/${proj_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", window_start: "2026-06-01T06:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/warranties"
              payload: { term_months: 12 }
              as: ProjectManager
              captures: { war_id: $.data.id }
            - call: "POST /projects/${proj_id}/schedule"
              payload: {}
              as: ProjectManager
            - call: "POST /material-orders/${mo_id}/start-pour"
              payload: {}
              as: ProjectManager
            - call: "POST /material-orders/${mo_id}/complete-pour"
              payload: { completed_at: "2026-06-01T10:00:00Z" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/begin-cure"
              payload: {}
              as: ProjectManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/complete"
              payload: {}
              as: ProjectManager
            - call: "POST /warranties/${war_id}/claims"
              payload: { defect_note: "crack at joint" }
              as: Inspector
          trigger:
            - call: "POST /warranties/${war_id}/claims"
              payload: { defect_note: "spalling near drain" }
              as: Inspector
              captures: { st: $.data.status, cnt: $.data.defect_claims_count }
          assert:
            - "Warranty.${war_id}.status == CLAIM_OPEN"
            - "Warranty.${war_id}.defect_claims_count == 2"

  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_pour_depth3_cascade
        grounds:
          - state_machines.MaterialOrder.transitions.POURING_to_POURED
          - state_machines.Project.transitions.SCHEDULED_to_POURED
          - calculations.warranty_risk_score
          - entities.Project.fields.warranty_risk_score
        distinguishing_aspect: |
          Depth-3 chain from complete-pour: MaterialOrder POURING->POURED (link1) causes Project SCHEDULED->POURED (link2)
          which causes Project.warranty_risk_score recompute (link3). Originates from the complete-pour transition.
        test_recipe:
          setup:
            - "A SCHEDULED project whose only material order is POURING (HIGH_EARLY mix), with one NONE-reinforcement segment so the no-reinforcement risk contribution (10) applies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /projects"
              payload: { site_name: "Casc A", client_name: "Eta" }
              as: Estimator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "slab", area_sqft: 400, thickness_in: 4, reinforcement: "NONE" }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv0: $.data.version }
            - call: "POST /projects/${proj_id}/approve-estimate"
              payload: { estimate_id: "${est_id}", expected_project_version: "${pv0}" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/permits"
              payload: { jurisdiction: "City", permit_number: "P-2" }
              as: ProjectManager
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/issue"
              payload: {}
              as: Inspector
            - call: "POST /projects/${proj_id}/material-orders"
              payload: { mix_type: "HIGH_EARLY", pour_scheduled_start: "2026-06-01T06:00:00Z", pour_duration_hours: 4 }
              as: ProjectManager
              captures: { mo_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "C2", skill: "FLATWORK", headcount: 4 }
              as: ProjectManager
              captures: { crew_id: $.data.id }
            - call: "POST /projects/${proj_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", window_start: "2026-06-01T06:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/schedule"
              payload: {}
              as: ProjectManager
            - call: "POST /material-orders/${mo_id}/start-pour"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /material-orders/${mo_id}/complete-pour"
              payload: { completed_at: "2026-06-01T10:00:00Z" }
              as: ProjectManager
              captures: { mo_status: $.data.status, cwe: $.data.cure_window_end }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { p_status: $.data.status, risk: $.data.warranty_risk_score }
          assert:
            - "MaterialOrder.${mo_id}.status == POURED"
            - "MaterialOrder.${mo_id}.cure_window_end == 2026-06-04T10:00:00Z"
            - "Project.${proj_id}.status == POURED"
            - "Project.${proj_id}.warranty_risk_score == 10"

      - name: permit_revoke_depth2_forces_hold
        grounds:
          - state_machines.Permit.transitions.ISSUED_to_REVOKED
          - state_machines.Project.transitions.SCHEDULED_to_ON_HOLD
          - entities.Project.fields.status_before_hold
        distinguishing_aspect: |
          Depth-2 chain from permit revoke: Permit ISSUED->REVOKED (link1) causes Project SCHEDULED->ON_HOLD with
          status_before_hold=SCHEDULED (link2). Originates from the permit-revoke transition, a different trigger from complete-pour.
        test_recipe:
          setup:
            - "A SCHEDULED project with an ISSUED permit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /projects"
              payload: { site_name: "Rev A", client_name: "Theta" }
              as: Estimator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/segments"
              payload: { label: "slab", area_sqft: 400, thickness_in: 4, reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv0: $.data.version }
            - call: "POST /projects/${proj_id}/approve-estimate"
              payload: { estimate_id: "${est_id}", expected_project_version: "${pv0}" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/permits"
              payload: { jurisdiction: "City", permit_number: "P-3" }
              as: ProjectManager
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/issue"
              payload: {}
              as: Inspector
            - call: "POST /projects/${proj_id}/material-orders"
              payload: { mix_type: "STANDARD", pour_scheduled_start: "2026-06-02T12:00:00Z", pour_duration_hours: 4 }
              as: ProjectManager
            - call: "POST /crews"
              payload: { crew_name: "C3", skill: "FLATWORK", headcount: 4 }
              as: ProjectManager
              captures: { crew_id: $.data.id }
            - call: "POST /projects/${proj_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", window_start: "2026-06-02T12:00:00Z", window_end: "2026-06-02T18:00:00Z" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/schedule"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /permits/${perm_id}/revoke"
              payload: {}
              as: Inspector
              captures: { perm_status: $.data.status }
