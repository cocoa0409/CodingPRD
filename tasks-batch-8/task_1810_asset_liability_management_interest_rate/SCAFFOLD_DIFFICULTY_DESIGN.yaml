  - rule_id: resource_temporal_overlap
    instances:
      - name: hedge_windows_half_open_adjacency
        grounds:
          - validations[priority=8]
          - state_machines.HedgeRelationship.PROPOSED_to_DESIGNATED
        distinguishing_aspect: |
          Interval semantics HALF-OPEN on resource Position: hedge windows
          [start_month, end_month) on the same position may touch —
          [2026-08,2027-08) followed by [2027-08,2028-08) is legal — while
          [2027-06,2028-06) overlaps and is rejected. The sibling instance
          uses a different semantics (mandatory >= 1 month gap) on a different
          resource (AssumptionSet).
        test_recipe:
          setup:
            - "Book1 ACTIVE with L1; H1 DESIGNATED [2026-08,2027-08); H2 and H3 PROPOSED on L1"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: PAYER_SWAP, designation_type: FAIR_VALUE, notional_cents: 60000000, fixed_rate_bps: 350 }, as: TreasuryAnalyst, captures: { h1: $.data.id } }
            - { call: "POST /hedges/${h1}/designate", payload: { start_month: "2026-08", end_month: "2027-08", effectiveness_method: DOLLAR_OFFSET }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: RECEIVER_SWAP, designation_type: CASH_FLOW, notional_cents: 30000000, fixed_rate_bps: 300 }, as: TreasuryAnalyst, captures: { h2: $.data.id } }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: CAP, designation_type: CASH_FLOW, notional_cents: 20000000, fixed_rate_bps: 500 }, as: TreasuryAnalyst, captures: { h3: $.data.id } }
          trigger:
            - call: "POST /hedges/${h2}/designate"
              payload: { start_month: "2027-06", end_month: "2028-06", effectiveness_method: DOLLAR_OFFSET }
              as: ALCOChair
              as_user_id: ch-1
              captures: { err: $.data.error_id }
            - { call: "POST /hedges/${h3}/designate", payload: { start_month: "2027-08", end_month: "2028-08", effectiveness_method: DOLLAR_OFFSET }, as: ALCOChair, as_user_id: ch-1 }
          assert:
            - "error_id == ERR_HEDGE_WINDOW_OVERLAP"
            - "HedgeRelationship.${h2}.status == PROPOSED"
            - "HedgeRelationship.${h3}.status == DESIGNATED"

      - name: backtest_windows_require_one_month_gap
        grounds:
          - validations[priority=8]
          - calculations.backtest_deviation
        distinguishing_aspect: |
          Interval semantics GAP-BUFFER on resource AssumptionSet: review
          windows on the same set may NOT even touch — after [2026-08,+3mo)
          (end 2026-11), a start of 2026-11 (adjacent, gap 0) is rejected and
          only 2026-12 (gap 1 month) is accepted. Different semantics
          (buffer vs half-open adjacency) and different resource than the
          hedge sibling.
        test_recipe:
          setup:
            - "Book1 ACTIVE; PREPAYMENT set APPROVED (base_cpr 10.0); clock advanced to 2027-02-01; review R1 [2026-08,3mo) created WITHIN_TOLERANCE (observed 12.0)"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: ModelRiskValidator }
            - { call: "POST /books/${b}/backtests", payload: { assumption_set_id: "${ps}", start_month: "2026-08", observation_months: 3, observed_value_pct: 12.0 }, as: ModelRiskValidator, captures: { r1: $.data.id } }
          trigger:
            - call: "POST /books/${b}/backtests"
              payload: { assumption_set_id: "${ps}", start_month: "2026-10", observation_months: 2, observed_value_pct: 11.0 }
              as: ModelRiskValidator
              captures: { err_overlap: $.data.error_id }
            - call: "POST /books/${b}/backtests"
              payload: { assumption_set_id: "${ps}", start_month: "2026-11", observation_months: 1, observed_value_pct: 11.0 }
              as: ModelRiskValidator
              captures: { err_adjacent: $.data.error_id }
            - { call: "POST /books/${b}/backtests", payload: { assumption_set_id: "${ps}", start_month: "2026-12", observation_months: 1, observed_value_pct: 11.0 }, as: ModelRiskValidator, captures: { r2: $.data.id } }
          assert:
            - "err_overlap == ERR_BACKTEST_WINDOW_OVERLAP"
            - "err_adjacent == ERR_BACKTEST_WINDOW_OVERLAP"
            - "BacktestReview.${r2}.outcome == WITHIN_TOLERANCE"
            - "BacktestReview.${r1}.outcome == WITHIN_TOLERANCE"

  - rule_id: compensating_invariant
    instances:
      - name: hedge_designate_dedesignate_notional_conserved
        grounds:
          - state_machines.HedgeRelationship.PROPOSED_to_DESIGNATED
          - state_machines.HedgeRelationship.DESIGNATED_to_DEDESIGNATED
          - entities.AlmBook.fields.hedged_notional_cents
        distinguishing_aspect: |
          Conserved quantity MONETARY NOTIONAL: AlmBook.hedged_notional_cents
          must always equal the sum of notional_cents over hedges in
          {DESIGNATED, ACTIVE}. Designating H2 (60M -> 90M) followed by its
          compensating dedesignation returns the book to exactly 60,000,000 —
          no drift. Sibling invariant conserves a CARDINALITY, not money.
        test_recipe:
          setup:
            - "Book1 ACTIVE (floor 0); H1 ACTIVE 60,000,000 [2026-08,2027-08) on L1 (hedged_notional 60,000,000); H2 PROPOSED 30,000,000 on L1"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: PAYER_SWAP, designation_type: FAIR_VALUE, notional_cents: 60000000, fixed_rate_bps: 350 }, as: TreasuryAnalyst, captures: { h1: $.data.id } }
            - { call: "POST /hedges/${h1}/designate", payload: { start_month: "2026-08", end_month: "2027-08", effectiveness_method: DOLLAR_OFFSET }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /hedges/${h1}/activate", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: RECEIVER_SWAP, designation_type: CASH_FLOW, notional_cents: 30000000, fixed_rate_bps: 300 }, as: TreasuryAnalyst, captures: { h2: $.data.id } }
          trigger:
            - { call: "POST /hedges/${h2}/designate", payload: { start_month: "2027-08", end_month: "2028-08", effectiveness_method: REGRESSION }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { hn_mid: $.data.hedged_notional_cents } }
            - { call: "POST /hedges/${h2}/dedesignate", payload: { reason: "Exposure reduced" }, as: ALCOChair, as_user_id: ch-1 }
          assert:
            - "hn_mid == 90000000"
            - "AlmBook.${b}.hedged_notional_cents == 60000000"
            - "HedgeRelationship.${h2}.status == DEDESIGNATED"
            - "GET /breaches?book_id=${b} returns 0 rows (floor 0 never breached)"

      - name: approve_approve_keeps_single_approved_per_domain
        grounds:
          - state_machines.AssumptionSet.SUBMITTED_to_APPROVED
          - state_machines.AssumptionSet.APPROVED_to_SUPERSEDED
        distinguishing_aspect: |
          Conserved quantity CARDINALITY: the count of APPROVED AssumptionSets
          per (book, domain) is invariant at exactly 1 — approving B
          supersedes A, so the forward action (approve A) paired with the
          compensating supersede (approve B) keeps the count at 1, and runs
          pinning A are flagged assumption_stale. Different conserved quantity
          than the notional sibling.
        test_recipe:
          setup:
            - "Book1 ACTIVE; set A (PREPAYMENT) APPROVED; DECAY/BETA approved; one run pins A; set B (PREPAYMENT, cpr 12.0) SUBMITTED"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { sa: $.data.id } }
            - { call: "POST /assumption-sets/${sa}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${sa}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${sa}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv}" }, as: TreasuryAnalyst, captures: { run: $.data.id } }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 12.0, prepay_sensitivity_per_100bps: 2.5 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { sb: $.data.id } }
            - { call: "POST /assumption-sets/${sb}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
          trigger:
            - { call: "POST /assumption-sets/${sb}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
          assert:
            - "AssumptionSet.${sa}.status == SUPERSEDED"
            - "AssumptionSet.${sb}.status == APPROVED"
            - "GET /books/${b}/assumption-sets?domain=PREPAYMENT&status=APPROVED returns exactly 1 row (${sb})"
            - "SimulationRun.${run}.assumption_stale == true"
