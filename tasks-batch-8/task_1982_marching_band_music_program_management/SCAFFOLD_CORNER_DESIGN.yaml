      - name: program_posture_gates_child_creation
        claim_type: violation_to_error
        grounds: [calculations.program_posture_gate, "errors[ERR_PROGRAM_NOT_IN_REQUIRED_STATE]"]
        distinguishing_aspect: "Creating a student while the program is still SETUP → ERR_PROGRAM_NOT_IN_REQUIRED_STATE; after advance to ENROLLMENT_OPEN creation succeeds."
        test_recipe:
