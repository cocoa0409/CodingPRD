              captures: { o2_status: $.data.status, o2_allocated: $.data.allocated_units }
            - call: "POST /allocations/${alloc_1_id}/cancel"
              payload: { reason: "duplicate cancellation" }
              as: DistributionPlanner
              as_user_id: "dp-01"
              captures: { err_second_cancel: $.data.error_id }
          assert:
            - "after the first allocate the lot reads available_units 300, allocated_units 200, shipped_units 0, quarantined_units 0 with 500 == 300 + 200 + 0 + 0, and order 1 is ALLOCATED with allocated_units 200 and shortfall_units 0"
            - "the created Allocation has allocated_units 200 and sequence_index 1"
            - "the cancel returns Allocation.status CANCELLED and restores the lot to available_units 500, allocated_units 0, shipped_units 0, quarantined_units 0 — exactly the pre-allocation figures"
            - "the CANCELLED row is retained with allocated_units still 200 and contributes to none of the four buckets, which is precisely why the invariant closes"
            - "order 1 recomputes to allocated_units 0 and shortfall_units 200 and drops ALLOCATED -> PARTIALLY_ALLOCATED; it is NOT returned to DRAFT, so the cancelled order cannot be re-allocated"
            - "allocating order 2 replays the identical draw: one Allocation on the same lot with allocated_units 200 and sequence_index 1, order 2 ALLOCATED with shortfall_units 0, and the lot back at available_units 300 / allocated_units 200"
            - "the replay is only possible because the cancel returned units to available_units — a cancel that merely zeroed allocated_units would leave the FEFO pool at 300 and make order 2's draw differ"
            - "the second cancel of the same allocation returns HTTP 409 with error_id ERR_ALLOCATION_STATE_INVALID and changes nothing: CANCELLED is terminal, so the compensation cannot be applied twice"
