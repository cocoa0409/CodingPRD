        grounds: ["state_machines.Job.AWARDED_to_FABRICATING", "errors[ERR_DRAWING_NOT_APPROVED]"]
        distinguishing_aspect: "start-fabrication with zero APPROVED drawings fails with ERR_DRAWING_NOT_APPROVED even when a drawing exists in DRAFT."
