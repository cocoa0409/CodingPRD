            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "South 20", total_acres: 20.0, distance_to_water_ft: 900, has_tile_inlet: false, slope_pct: 2.0, water_frontage_ft: 0 }
