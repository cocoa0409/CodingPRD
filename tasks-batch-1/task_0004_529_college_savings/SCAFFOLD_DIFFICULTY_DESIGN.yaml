  # ============================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_fiscal_on_revise_after_three_rejections
        grounds:
          - validations[priority=6]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair: state (priority 6) vs business_fiscal (priority 16).
          A withdrawal in APPROVED status with rejection_count==3 has its /revise
          call simultaneously violating ERR_INVALID_STATE (not from REJECTED) AND
          ERR_REVISION_LIMIT_EXCEEDED (count >= 3). State wins (priority 6 < 16).
        test_recipe:
          setup:
            - "Withdrawal w in APPROVED status with rejection_count=3 (cycled three full reject/revise/submit loops then finally approved on the fourth submit)."
            - "Wait — REJECTED→DRAFT requires rejection_count<3; the third REJECTED→DRAFT will be blocked. So we end up in REJECTED with count=3. We then attempt /revise from REJECTED expecting both ERR_REVISION_LIMIT_EXCEEDED (count>=3) and ERR_INVALID_STATE could fire? No — from REJECTED, /revise is valid by state. So instead: attempt /revise from APPROVED with count=3."
            - "Concretely: cycle two reject+revise+submit rounds (count=2 after second reject). Then a third /reject → count=3, withdrawal in REJECTED. Then /revise tried — count >= 3 so ERR_REVISION_LIMIT_EXCEEDED fires. Then to also trigger ERR_INVALID_STATE, we move it to APPROVED via a fresh approve path. But to leave REJECTED requires /revise. So: from REJECTED count=3, we now have state precondition OK (REJECTED) and count check failing — only ERR_REVISION_LIMIT_EXCEEDED. Single violation."
            - "To produce dual violation: approve a different withdrawal w2 (status=APPROVED), then call /revise on w2 where rejection_count=0. State fails (not REJECTED) AND a separate withdrawal with count=3 in REJECTED also exists. But /revise only checks ITS OWN withdrawal."
            - "RE-DESIGN: pick a single endpoint where two checks on the SAME entity can both fail."
            - "Use /withdrawals/{id}/approve: from a withdrawal in DRAFT (not SUBMITTED) AND with amount_cents > Account.account_balance_cents. ERR_INVALID_STATE (priority 6) wins over ERR_INSUFFICIENT_BALANCE (priority 15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D7", state_code: "CA", federal_tax_id_last4: "1111", email: "d7@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B7", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 100000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
              captures: { a_v: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 500000, expense_class: "HIGHER_ED_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /withdrawals/${w_id}/approve"
              payload: { expected_account_version: "${a_v}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: auth_segregation_beats_state_occ_on_beneficiary_change_approve
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_STALE_ACCOUNT_VERSION]
        distinguishing_aspect: |
          Different error-category pair from instance 1: auth (priority 3,
          ERR_SEGREGATION_OF_DUTIES) vs state (priority 7, ERR_STALE_ACCOUNT_VERSION).
          Same X-User-ID created the BeneficiaryChange and now tries to approve it
          AND the expected_account_version is stale. Auth wins (3 < 7).
        test_recipe:
          setup:
            - "Donor d acting as both AccountOwner (creating bc) and ComplianceOfficer with same X-User-ID."
            - "Account a OPEN at version 1, then bumped to version 2 by /restrict + /release."
            - "BeneficiaryChange bc PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D8", state_code: "CA", federal_tax_id_last4: "1111", email: "d8@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B8a", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b1_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B8b", date_of_birth: "2010-06-01", relationship_class: "CHILD", federal_tax_id_last4: "3333" }
              as: CustodianAgent
              captures: { b2_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b1_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id, a_v0: $.data.version }
            - call: "POST /beneficiary-changes"
              payload: { account_id: "${a_id}", to_beneficiary_id: "${b2_id}" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { bc_id: $.data.id }
            - call: "POST /accounts/${a_id}/restrict"
              payload: {}
              as: ComplianceOfficer
              captures: { a_v1: $.data.version }
            - call: "POST /accounts/${a_id}/release"
              payload: {}
              as: ComplianceOfficer
              captures: { a_v2: $.data.version }
          trigger:
            - call: "POST /beneficiary-changes/${bc_id}/approve"
              payload: { expected_account_version: "${a_v0}" }
              as: ComplianceOfficer
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 403"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

