            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { v4: $.data.version }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_id}", program_id: "${prog_id}", claimed_amount_cents: 100000, expected_program_version: "${v4}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { c4: $.data.id, c4_vs: $.data.validation_status }
            - call: "GET /incentives/claims"
              payload: { delivery_id: "${del_id}" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { first_claim_id: "$.data[0].id" }
          assert:
            - "${c1_vs} == REJECTED and ${c1_rej} == ERR_NO_ELIGIBLE_PROGRAM"
            - "${c2_vs} == SUBMITTED at creation: the REJECTED predecessor does not block the pair, because the rule only counts claims with validation_status != REJECTED"
            - "${c2_amt} == 100000, the claim is now VALIDATED and ${c2_ps} == UNPAID"
            - "${err_dupe} == ERR_DUPLICATE_CLAIM (409) — one live claim on the pair is enough to refuse the third submission"
            - "${sched_count} == 1, ${locked} == LOCKED and ${disbursed} == DISBURSED"
            - "${cb_status} == PENDING, ${cb_reason} == UNWOUND_DEAL and ${cb_amt} == 100000 — the chargeback opens for the full paid amount"
            - "${c2_ps_after} == CHARGED_BACK"
            - "${c4_vs} == SUBMITTED: the pair is claimable again, this time because payment_status == CHARGED_BACK satisfies the second half of the filter"
            - "${first_claim_id} is one of the four claim ids — all four rows persist and are listable; the rule filters, it never deletes"
            - "the second and fourth submissions are the satisfaction-side proof: an implementation using a unique constraint on (delivery_id, program_id) fails both"

      - name: objective_creation_requires_the_owning_program_to_be_active
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=11]
        excluded_because:
          difficulty_instance: objective_creation_requires_an_active_owning_program
          rationale: "That §1.8 cross_entity_dependency instance already drives POST /incentives/programs/{id}/objectives against a DRAFT, a PENDING_APPROVAL, an ACTIVE and a CLOSED program and asserts ERR_PROGRAM_NOT_ACTIVE for every non-ACTIVE state, which is exactly the both-valid-and-invalid pairing this pattern asks for."

      - name: settlement_buffer_gap_between_adjacent_pay_periods
        claim_type: temporal_validation
        grounds:
          - validations[priority=13]
          - validations[priority=14]
        excluded_because:
          difficulty_instance: closed_batch_periods_need_a_strictly_greater_than_one_day_settlement_gap
          rationale: "That §1.8 boundary_precision_check instance already separates the closed-interval overlap rule at priority 13 from the buffer rule at priority 14, testing a touching period, a one-day gap and a two-day gap, and asserting the distinct error ids."

      - name: state_error_outranks_budget_exhaustion_on_adjudication
        claim_type: priority_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=31]
        excluded_because:
          difficulty_instance: closed_program_state_error_outranks_live_budget_exhaustion
          rationale: "That §1.8 error_priority_conflict instance constructs a claim that simultaneously violates the state rule and the budget rule and pins the lower-numbered error, then removes the state violation to reveal the 402."

      - name: sale_date_window_outranks_the_stack_edge_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=15]
          - validations[priority=22]
        excluded_because:
          difficulty_instance: sale_date_window_error_outranks_forbidden_stack_edge
          rationale: "That §1.8 error_priority_conflict instance already submits a claim that is both outside the program window and forbidden by a stack edge, asserting ERR_SALE_DATE_OUTSIDE_PROGRAM_WINDOW and then, after the sale date is brought inside, ERR_STACK_COMBINATION_FORBIDDEN."

      - name: back_dated_sale_blocks_validation
        claim_type: violation_error
        grounds:
          - validations[priority=16]
        excluded_because:
          difficulty_instance: reporting_lag_boundary_is_strictly_greater_than_ten_days
          rationale: "That §1.8 boundary_precision_check instance sets back_dated_flag through the reporting-lag boundary and asserts ERR_BACK_DATED_SALE_DETECTED on the validate call for the flagged delivery, together with the clean case at exactly ten days."

      - name: terminated_dealer_standing_blocks_writes
        claim_type: violation_error
        grounds:
          - validations[priority=17]
        excluded_because:
          difficulty_instance: terminated_dealer_standing_blocks_delivery_reporting_and_claim_submission
          rationale: "That §1.8 instance covers all three applies_to sites for ERR_DEALER_NOT_IN_GOOD_STANDING and additionally pins that SUSPENDED is NOT blocked there, which is the discriminating half of the rule."

      - name: adjudication_requires_a_validated_delivery
        claim_type: violation_error
        grounds:
          - validations[priority=18]
        excluded_because:
          difficulty_instance: claim_adjudication_blocked_until_its_delivery_is_validated
          rationale: "That §1.8 instance asserts ERR_DELIVERY_NOT_VALIDATED on a REPORTED delivery's claim and then the successful adjudication after validation, covering both polarities of this rule."

      - name: protest_round_limit_refuses_the_third_protest
        claim_type: violation_error
        grounds:
          - validations[priority=24]
        excluded_because:
          difficulty_instance: objective_protest_cycle_with_denied_destination_pinned_by_round_index
          rationale: "That §1.8 cyclic-loop instance walks protest_round 0, 1 and 2 and asserts ERR_PROTEST_LIMIT_REACHED on the third filing, which is the loop-termination condition for this rule."

      - name: stack_cap_boundary_is_accepted_at_the_cap
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=23]
        excluded_because:
          difficulty_instance: stacked_total_landing_exactly_on_the_pair_cap_is_accepted
          rationale: "That §1.8 boundary_precision_check instance tests a stacked total one cent under, exactly on and one cent over the pair cap, covering both the satisfaction and the violation side of ERR_STACK_CAP_EXCEEDED."

  - section: endpoints
    instances:
      - name: dealer_status_write_is_the_only_mutating_crud_endpoint_and_round_trips
        claim_type: standard_crud
        grounds:
          - endpoints.POST_dealers
          - endpoints.GET_dealers_id
          - endpoints.POST_dealers_id_status
          - entities.Dealer
        distinguishing_aspect: "The whole API offers create-plus-action and exactly one field-mutating write: POST /incentives/dealers/{id}/status. It is walked ACTIVE -> SUSPENDED -> TERMINATED -> ACTIVE with a note each time, proving the field is freely re-settable (no state machine guards Dealer.status) while every derived money field on the dealer stays put."
        test_recipe:
          setup:
            - "One dealer created with historical_volume_units 6 and market_opportunity_bps 1500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "CRN-D-CRUD", name: "Crud Motors", region_code: "WEST", historical_volume_units: 6, market_opportunity_bps: 1500 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id, st0: $.data.status, paid0: $.data.paid_cents, open0: $.data.open_chargeback_cents, v0: $.data.version }
          trigger:
            - call: "GET /incentives/dealers/${dealer_id}"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { get_code: $.data.dealer_code, get_hist: $.data.historical_volume_units, get_mkt: $.data.market_opportunity_bps, get_st: $.data.status }
            - call: "POST /incentives/dealers/${dealer_id}/status"
              payload: { status: "SUSPENDED", note: "audit hold" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { st1: $.data.status, v1: $.data.version }
            - call: "POST /incentives/dealers/${dealer_id}/status"
              payload: { status: "TERMINATED" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { st2: $.data.status, v2: $.data.version }
            - call: "POST /incentives/dealers/${dealer_id}/status"
              payload: { status: "ACTIVE", note: "reinstated" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { st3: $.data.status, v3: $.data.version, paid3: $.data.paid_cents, open3: $.data.open_chargeback_cents }
            - call: "POST /incentives/dealers/${dealer_id}/status"
              payload: { status: "REVOKED" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { err_enum: $.data.error_id }
            - call: "GET /incentives/dealers/${dealer_id}"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { st_final: $.data.status, v_final: $.data.version }
          assert:
            - "${st0} == ACTIVE, ${paid0} == 0, ${open0} == 0 and ${v0} == 1"
            - "${get_code} == CRN-D-CRUD, ${get_hist} == 6 and ${get_mkt} == 1500 — the read returns what was written verbatim"
            - "${get_st} == ${st0} — the GET adds nothing and changes nothing"
            - "${st1} == SUSPENDED, ${st2} == TERMINATED and ${st3} == ACTIVE: TERMINATED is NOT a terminal state on the Dealer, unlike the true state machines in §1.2"
            - "${v1} == 2, ${v2} == 3 and ${v3} == 4 — every accepted status write bumps version by exactly one"
            - "${err_enum} == ERR_INVALID_REQUEST (400) and ${v_final} == ${v3} == 4: the rejected write did not bump the version"
            - "${st_final} == ACTIVE, ${paid3} == 0 and ${open3} == 0 — the status endpoint touches status only and never the money fields"
            - "the note input is optional and write-only: it is accepted, and omitting it on the TERMINATED write is equally fine"

