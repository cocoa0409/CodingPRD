            - "at creation QualificationItem.${qi}.allowance_unit_rate == 60.0000 (90000.00 / 1500 at four decimals), remaining_units == 1500, reconciled_units == 0, status == OPEN, last_action == NONE"
            - "the response code is 200 with reconciled_amount == 25000.00 (400 * 62.5000)"
            - "QualificationItem.${qi}.variance_amount == 1000.00 (25000.00 booked less the 24000.00 expected at the allowance rate)"
            - "QualificationItem.${qi}.reconciled_units == 400 and remaining_units == 1100, so allocated_units 1500 == 1100 + 400"
            - "QualificationItem.${qi}.status == PARTIALLY_RECONCILED, reconciliation_seq == 1 and last_action == RECONCILE"

