            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line1: $.data.id, lv1: $.data.version }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { visit: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/service-visits/${visit}/start"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
            - call: "POST /draft-service/balance-records"
              payload: { visit_id: "${visit}", line_id: "${line1}", measured_temp_f: 40.0, proposed_applied_psi: 13.6, proposed_co2_pct: 59.2, expected_line_version: "${lv1}" }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { rec1: $.data.id }
          trigger:
            - call: "POST /draft-service/balance-records"
              payload: { visit_id: "${visit}", line_id: "${line1}", measured_temp_f: 40.0, proposed_applied_psi: 13.6, proposed_co2_pct: 59.2, expected_line_version: "${lv1}" }
              as: ServiceTechnician
