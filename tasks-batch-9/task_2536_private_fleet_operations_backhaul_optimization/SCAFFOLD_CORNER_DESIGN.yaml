      - name: pm_work_order_start_and_complete_reset_the_tractor_pm_counters
        claim_type: Side Effect Execution
        grounds:
          - state_machines[MaintenanceWorkOrder]
          - state_machines[Tractor]
          - entities.Tractor.miles_since_pm
        distinguishing_aspect: "Start and complete are the only two triggers that move a Tractor through IN_SHOP, and only complete on a PM_A/PM_B order rewrites the PM counters: pm_last_service_odometer jumps to the current odometer and miles_since_pm collapses from 10000 to 0. An INSPECTION order completing on the same tractor leaves those counters alone."
        test_recipe:
          setup:
            - "Tractor TR-SM5 exists with odometer_miles 50000, pm_interval_miles 25000, pm_last_service_odometer 40000, so miles_since_pm is 10000 and pm_hold is false. Two manual work orders exist for it: an INSPECTION and a PM_A, on non-colliding windows."
