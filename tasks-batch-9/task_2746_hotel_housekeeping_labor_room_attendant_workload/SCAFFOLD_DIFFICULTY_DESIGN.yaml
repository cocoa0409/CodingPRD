          Room.cleanliness_status is a genuine CYCLE: the same row visits IN_SERVICE twice and CLEAN
          twice for a single guest departure, travelling DIRTY -> IN_SERVICE -> CLEAN ->
          RECLEAN_REQUIRED -> IN_SERVICE -> CLEAN, and the loop is bounded only by reclean_generation
