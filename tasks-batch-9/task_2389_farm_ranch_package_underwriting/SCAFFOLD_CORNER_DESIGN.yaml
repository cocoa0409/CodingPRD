        grounds: ["errors.ERR_BUYBACK_INSPECTION_REQUIRED", "errors.ERR_BUYBACK_HAZARD_TOO_HIGH"]
        excluded_because:
          difficulty_instance: buyback_approval_gated_by_latest_inspection_hazard
          rationale: "The §1.8 cross_entity_state_guard instance already approves a buy-back with no COMPLETED inspection and then with a hazard score of 36 against the inclusive 35 ceiling, pinning both errors in priority order."

      - name: corner_error_inspector_window_conflict_covered_by_difficulty
        claim_type: triggerability
        grounds: ["errors.ERR_INSPECTOR_WINDOW_CONFLICT"]
        excluded_because:
          difficulty_instance: inspector_half_open_window_with_travel_buffer
          rationale: "The §1.8 resource_temporal_overlap instance already probes the exact buffer boundary in both directions and pins ERR_INSPECTOR_WINDOW_CONFLICT."

      - name: corner_error_overlapping_policy_term_covered_by_difficulty
        claim_type: triggerability
        grounds: ["errors.ERR_OVERLAPPING_POLICY_TERM"]
        excluded_because:
          difficulty_instance: policy_term_closed_closed_overlap_on_account
          rationale: "The §1.8 resource_temporal_overlap instance already creates a term that touches an existing RATED term on one day and pins ERR_OVERLAPPING_POLICY_TERM, including the DRAFT/DECLINED exclusions."

  - section: rbac
    instances:

      - name: corner_platform_admin_owns_all_reference_data_writes
        claim_type: exclusive_operations
        grounds: ["rbac.PlatformAdmin.exclusive_operations", "endpoints.POST_/agents", "endpoints.POST_/inspectors", "endpoints.POST_/cat-capacity-pools"]
        distinguishing_aspect: "Every reference-data write is PlatformAdmin-only: the three creates and the three PATCHes all succeed for PlatformAdmin, while an Underwriter and an Agent are refused ERR_FORBIDDEN_ROLE (403) on the same routes."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /agents"
              payload: { agency_name: "Reference Data Agency", license_state: "KS", appointment_status: "ACTIVE", authority_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { ref_ag: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Reed Alba", region_code: "KS-CENTRAL", status: "ACTIVE", daily_capacity_minutes: 480 }
              as: PlatformAdmin
              captures: { ref_insp: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-9", peril: "HAIL", participation_pct: 0.50, total_capacity_cents: 200000000 }
              as: PlatformAdmin
              captures: { ref_pool: $.data.id, ref_pool_v: $.data.version }
            - call: "PATCH /agents/${ref_ag}"
              payload: { appointment_status: "SUSPENDED" }
              as: PlatformAdmin
              captures: { ref_ag_status: $.data.appointment_status }
            - call: "PATCH /inspectors/${ref_insp}"
              payload: { daily_capacity_minutes: 240 }
              as: PlatformAdmin
              captures: { ref_insp_cap: $.data.daily_capacity_minutes }
            - call: "PATCH /cat-capacity-pools/${ref_pool}"
              payload: { expected_pool_version: "${ref_pool_v}", status: "FROZEN" }
              as: PlatformAdmin
              captures: { ref_pool_status: $.data.status }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-9", peril: "WIND", participation_pct: 0.30, total_capacity_cents: 200000000 }
              as: Underwriter
              captures: { e_rbac_pool: $.data.error_id }
            - call: "POST /inspectors"
              payload: { full_name: "Rogue Inspector", region_code: "KS-WEST" }
              as: Agent
              as_user_id: "${ref_ag}"
              captures: { e_rbac_insp: $.data.error_id }
          assert:
            - "all six PlatformAdmin calls succeed; the agent lands with appointment_status SUSPENDED, the inspector with daily_capacity_minutes 240 and the pool FROZEN at version 2"
            - "both non-admin attempts return HTTP 403 ERR_FORBIDDEN_ROLE and write nothing"
            - "GET /cat-capacity-pools?zone_code=ZN-9 returns exactly 1 pool"
            - "the new pool was created with reserved_cents 0, committed_cents 0 and available_cents 200000000"

      - name: corner_lifecycle_writes_are_forbidden_to_the_wrong_roles
        claim_type: forbidden_operations
        grounds: ["rbac", "errors.ERR_FORBIDDEN_ROLE", "validations[priority=2]"]
        distinguishing_aspect: "Six lifecycle routes are probed by a role that owns an adjacent step — an Agent rating, an Underwriter deciding a referral or completing an inspection, a LossControlSpecialist reviewing evidence — and every one is ERR_FORBIDDEN_ROLE (403), including on rows whose state would otherwise allow the action."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one DRAFT policy with an RC DWELLING, one Inspector, one SCHEDULED inspection, one all-zero labor profile"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
            - *k_item
            - *k_labor_zero
            - *k_inspector
            - *k_inspection
            - *k_rate_get
          trigger:
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_rb1: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/referral-decisions"
              payload: { decision: "APPROVE" }
              as: Underwriter
              captures: { e_rb2: $.data.error_id }
            - call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "underwriter tries to close its own survey", findings: [] }
              as: Underwriter
              captures: { e_rb3: $.data.error_id }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-20T09:00:00Z", duration_minutes: 60 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_rb4: $.data.error_id }
            - call: "POST /compliance-sweeps"
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_rb5: $.data.error_id }
            - call: "POST /labor-profiles/${lab_id}/wc-verification"
              payload: { note: "loss control tries to verify a certificate" }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { e_rb6: $.data.error_id }
          assert:
            - "all six calls return HTTP 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "the referral-decision refusal is a role refusal, not a state refusal: the policy is DRAFT, yet ERR_POLICY_NOT_REFERRED never appears because priority 2 runs first"
            - "the inspection is still SCHEDULED with hazard_score null, the policy still DRAFT at version 1 with all premiums 0, and the labor profile still NOT_REQUIRED"
            - "no compliance sweep counter is returned to the Agent at all"

      - name: corner_shared_operations_accept_either_authorized_role
        claim_type: shared_operations
        grounds: ["rbac.Underwriter.shared_operations", "rbac.SeniorUnderwriter.shared_operations", "rbac.ComplianceOfficer.shared_operations"]
        distinguishing_aspect: "Rating works for both Underwriter and SeniorUnderwriter on two sibling policies, inspection scheduling works for both Underwriter and ComplianceOfficer, and every one of the six roles can read the same policy — so the shared sets are genuinely shared and not silently narrowed."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, two DRAFT policies on two accounts of the same agent, each with an RC DWELLING at 40000000, one ACTIVE Inspector"
