scenario: |
  Enterprise carbon footprint accounting system: organizational boundary setting with
  consolidation approach (equity-share/financial-control/operational-control), subsidiary
  and facility list, boundary-change history, reporting-period configuration, and
  boundary-disclosure documentation; emission source identification with source-category
  mapping (stationary-combustion/mobile-combustion/process/fugitive/purchased-energy/
  value-chain), source-inventory completeness check, materiality threshold, and
  source-change tracking; activity data collection with data-source classification
  (meter-reading/invoice/supplier-data/estimation), data-collection frequency,
  data-quality scoring, data-gap handling and estimation rules, and historical-data
  archiving; emission factor management with factor library (IPCC default/
  national-published/supplier-specific/measured), factor-version effective-date,
  factor-uncertainty rating, factor-update workflow, and factor-traceability
  documentation; accounting (scope 1/2/3) with scope-1 direct emissions calculation,
  scope-2 location-based and market-based dual reporting, scope-3 fifteen-category
  accounting, GWP-factor application by gas type, multi-year comparability adjustment,
  and intensity-indicator calculation (per revenue/per employee/per unit-output);
  emission-reduction project offset with internal-reduction project accounting,
  external carbon-credit (VCS/Gold Standard/CCER) purchase and retirement,
  offset-eligibility rules, double-counting prevention, and net-emission calculation;
  report generation with multi-standard report templates (GHG Protocol/ISO 14064/CDP/
  TCFD/local mandatory disclosure), assurance-readiness checklist, third-party
  verification coordination, public disclosure document generation, and report-version
  archiving; event-driven synchronization with ERP, energy-metering, supplier-data
  exchange, and carbon-market platforms; audit logging for data-entry and factor-change
  records.

domain_name: "carbon-accounting"
api_prefix: "/organizations"

complexity_profile:
  primary_archetype: "compliance / audit"
  secondary_archetype: "pricing engine"
  complexity_layers:
    - "dual-variant calculation"          # location-based vs market-based Scope 2; gross vs net
    - "version-pinning on approval"       # factor versions pinned at report verification
    - "cascading side effects"            # factor supersession → invalidate dependent records → reports drift to STALE
    - "derived field reconciliation"      # intensity indicators, gross/net totals on reports

  entity_topology: "graph"
  # Organization → Facility (1:n) and Organization → ReportingPeriod (1:n), but EmissionFactor
  # is shared across sources via FK, CarbonCredit is many-to-many with ReductionProject offsetting,
  # and BoundaryChange events form a self-referential history chain.

  state_machine_shape: "branching"
  # Report has a branching review cycle (draft → under_review → {verified | revisions_required → draft}),
  # CarbonCredit lifecycle branches (purchased → {retired | transferred}), EmissionFactor has revision cycles.

  relationship_patterns:
    - one_to_many                          # Organization → Facility, Organization → ReportingPeriod
    - many_to_many                         # ReductionProject ↔ CarbonCredit via offset application
    - self_referential                     # BoundaryChange.previous_change_id chains history
    - cross_aggregate                      # EmissionRecord references both EmissionSource and EmissionFactor across aggregates

  role_model: "segregation_of_duties"
  # DataSteward enters activity data; FactorManager curates factors; Verifier reviews and signs off;
  # Discloser publishes. Same user cannot both enter activity data AND verify a report covering it.

  consistency_model: "immediate"
  # All mutations are atomic. Factor supersession synchronously marks dependent EmissionRecords as STALE
  # and any DRAFT/UNDER_REVIEW Reports as RECOMPUTE_REQUIRED in the same transaction.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Organization
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the reporting organization."
        constraints: "1..200 chars, non-empty after trim"
      - name: consolidation_approach
        type: enum
        source: input
        description: "GHG-Protocol consolidation approach selected for the organization."
        constraints: "one of {EQUITY_SHARE, FINANCIAL_CONTROL, OPERATIONAL_CONTROL}"
      - name: base_year
        type: integer
        source: input
        description: "Base year for multi-year comparability adjustments."
        constraints: "1990 <= base_year <= 2100"
      - name: functional_currency
        type: string
        source: input
        description: "ISO 4217 currency code used for revenue intensity."
        constraints: "exactly 3 uppercase letters"
      - name: materiality_threshold_pct
        type: number
        source: input
        description: "Source-inventory materiality threshold in percent of organizational total. Sources below this share may be flagged but not excluded; the completeness report references this value."
        default: 1.0
        constraints: "0.0 <= materiality_threshold_pct <= 5.0, two decimal places"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status for the organization profile."
        default: ACTIVE
        constraints: "one of {ACTIVE, ARCHIVED}"

  - name: Facility
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "Owning organization id."
      - name: name
        type: string
        source: input
        description: "Human-readable facility name."
        constraints: "1..200 chars"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country code; used to pick location-based grid factors."
        constraints: "exactly 2 uppercase letters"
      - name: ownership_share_pct
        type: number
        source: input
        description: "Equity ownership share. Drives consolidation weight when Organization.consolidation_approach == EQUITY_SHARE."
        constraints: "0.0 <= ownership_share_pct <= 100.0, two decimal places"
      - name: financial_control
        type: boolean
        source: input
        description: "True iff organization has financial control of the facility; included under FINANCIAL_CONTROL approach."
      - name: operational_control
        type: boolean
        source: input
        description: "True iff organization has operational control; included under OPERATIONAL_CONTROL approach."
      - name: included_in_boundary
        type: boolean
        source: computed
        description: "Derived from consolidation_approach and the three control/share fields; recomputed on every boundary change."
      - name: status
        type: enum
        source: system
        description: "Facility lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: BoundaryChange
    parent: Organization
    common_fields: false
    fields:
      - name: organization_id
        type: string
        source: input
        description: "Owning organization id."
      - name: previous_change_id
        type: string
        source: system
        description: "Self-referential pointer to the prior BoundaryChange for this organization; null for the first change."
      - name: change_type
        type: enum
        source: input
        description: "Type of boundary change."
        constraints: "one of {ADD_FACILITY, REMOVE_FACILITY, APPROACH_SWITCH, OWNERSHIP_ADJUSTMENT}"
      - name: facility_id
        type: string
        source: input
        description: "Affected facility id, or null when change_type == APPROACH_SWITCH."
      - name: from_approach
        type: enum
        source: input
        description: "Prior consolidation approach (only set when change_type == APPROACH_SWITCH)."
        constraints: "one of {EQUITY_SHARE, FINANCIAL_CONTROL, OPERATIONAL_CONTROL} or null"
      - name: to_approach
        type: enum
        source: input
        description: "Resulting consolidation approach (only set when change_type == APPROACH_SWITCH)."
        constraints: "one of {EQUITY_SHARE, FINANCIAL_CONTROL, OPERATIONAL_CONTROL} or null"
      - name: effective_date
        type: datetime
        source: input
        description: "Effective date (UTC, ISO 8601). Must be strictly greater than the effective_date of previous_change_id, if present."
      - name: rationale
        type: string
        source: input
        description: "Disclosure narrative for the change."
        constraints: "5..1000 chars"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "User who recorded the change (taken from X-User-ID)."

  - name: ReportingPeriod
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "Owning organization id."
      - name: label
        type: string
        source: input
        description: "Human label, e.g. 'FY2025'."
        constraints: "1..50 chars, unique within organization"
      - name: start_date
        type: datetime
        source: input
        description: "Inclusive start (UTC, ISO 8601, midnight)."
      - name: end_date
        type: datetime
        source: input
        description: "Exclusive end. Must satisfy end_date > start_date; period must NOT overlap any other ReportingPeriod of the same organization with status != CANCELLED."
      - name: revenue
        type: number
        source: input
        description: "Total revenue in functional_currency for the period; used as denominator for revenue intensity."
        constraints: ">= 0, two decimal places"
      - name: headcount
        type: integer
        source: input
        description: "Average FTE headcount for the period."
        constraints: ">= 0"
      - name: unit_output
        type: number
        source: input
        description: "Physical unit-output (e.g. tonnes of product); denominator for unit-output intensity."
        constraints: ">= 0, four decimal places"
      - name: status
        type: enum
        source: system
        description: "Period lifecycle."
        default: OPEN
        constraints: "one of {OPEN, CLOSED, CANCELLED}"

  - name: EmissionSource
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "Owning organization id."
      - name: facility_id
        type: string
        source: input
        description: "Facility this source belongs to (must be ACTIVE and included_in_boundary == true at creation)."
      - name: code
        type: string
        source: input
        description: "Source code, e.g. 'SC1-DIESEL-GEN-A'. Unique within organization."
        constraints: "1..50 chars, [A-Z0-9_-]+"
      - name: category
        type: enum
        source: input
        description: "GHG source category."
        constraints: "one of {STATIONARY_COMBUSTION, MOBILE_COMBUSTION, PROCESS, FUGITIVE, PURCHASED_ENERGY, VALUE_CHAIN}"
      - name: scope
        type: enum
        source: computed
        description: "Derived from category: STATIONARY_COMBUSTION/MOBILE_COMBUSTION/PROCESS/FUGITIVE → SCOPE_1; PURCHASED_ENERGY → SCOPE_2; VALUE_CHAIN → SCOPE_3."
        constraints: "one of {SCOPE_1, SCOPE_2, SCOPE_3}"
      - name: scope3_category
        type: integer
        source: input
        description: "GHG-Protocol Scope-3 category number (1..15); required iff category == VALUE_CHAIN, otherwise null."
        constraints: "1 <= scope3_category <= 15 or null"
      - name: gas_type
        type: enum
        source: input
        description: "Greenhouse gas emitted by this source. Drives GWP application."
        constraints: "one of {CO2, CH4, N2O, HFC, PFC, SF6, NF3}"
      - name: factor_code
        type: string
        source: input
        description: "EmissionFactor.code that this source resolves to at activity-entry time (the ACTIVE version whose effective_from <= activity_start is pinned). MUST refer to a factor in the same Organization whose gas_type matches this source's gas_type."
        constraints: "1..50 chars, [A-Z0-9_-]+"
      - name: status
        type: enum
        source: system
        description: "Source lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: EmissionFactor
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "Owning organization id."
      - name: code
        type: string
        source: input
        description: "Factor code (groups versions). Unique within organization across active+superseded; new versions reuse the code."
        constraints: "1..50 chars, [A-Z0-9_-]+"
      - name: version
        type: integer
        source: system
        description: "Factor version number; first publication is 1, then 2, 3, … increasing strictly per code."
        constraints: ">= 1"
      - name: library
        type: enum
        source: input
        description: "Source library for the factor."
        constraints: "one of {IPCC_DEFAULT, NATIONAL_PUBLISHED, SUPPLIER_SPECIFIC, MEASURED}"
      - name: gas_type
        type: enum
        source: input
        description: "Gas this factor converts to."
        constraints: "one of {CO2, CH4, N2O, HFC, PFC, SF6, NF3}"
      - name: scope2_method
        type: enum
        source: input
        description: "For PURCHASED_ENERGY sources only: LOCATION_BASED uses grid-average; MARKET_BASED uses contractual instruments. Null for non-PURCHASED_ENERGY factors."
        constraints: "one of {LOCATION_BASED, MARKET_BASED} or null"
      - name: kg_per_unit
        type: number
        source: input
        description: "Emission factor in kg of gas per unit of activity."
        constraints: ">= 0, six decimal places"
      - name: uncertainty_rating
        type: enum
        source: input
        description: "Uncertainty grade."
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: effective_from
        type: datetime
        source: input
        description: "Earliest activity_period date for which this version applies (UTC, ISO 8601)."
      - name: effective_to
        type: datetime
        source: system
        description: "Exclusive upper bound, set when this version is superseded by a newer one with strictly greater effective_from. Null while ACTIVE."
      - name: status
        type: enum
        source: system
        description: "Factor version lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED, RETIRED}"
      - name: traceability_url
        type: string
        source: input
        description: "URL or DOI citation for traceability documentation."
        constraints: "1..500 chars"
      - name: approved_by_user_id
        type: string
        source: system
        description: "User who approved (published) this version; set on DRAFT→ACTIVE."

  - name: ActivityData
    parent: ReportingPeriod
    common_fields: true
    fields:
      - name: reporting_period_id
        type: string
        source: input
        description: "Owning reporting period (must be OPEN at entry time)."
      - name: emission_source_id
        type: string
        source: input
        description: "Source this activity record belongs to."
      - name: data_source
        type: enum
        source: input
        description: "Classification of how the value was obtained."
        constraints: "one of {METER_READING, INVOICE, SUPPLIER_DATA, ESTIMATION}"
      - name: quantity
        type: number
        source: input
        description: "Activity quantity (e.g. litres, kWh, tonne-km)."
        constraints: ">= 0, four decimal places"
      - name: unit
        type: string
        source: input
        description: "Unit string (e.g. 'L', 'kWh', 't-km')."
        constraints: "1..20 chars"
      - name: activity_start
        type: datetime
        source: input
        description: "Activity window start. Must satisfy ReportingPeriod.start_date <= activity_start."
      - name: activity_end
        type: datetime
        source: input
        description: "Activity window end. Must satisfy activity_end <= ReportingPeriod.end_date and activity_end > activity_start."
      - name: data_quality_score
        type: number
        source: computed
        description: "Score in [0.0, 1.0] derived from data_source: METER_READING=1.00, INVOICE=0.80, SUPPLIER_DATA=0.65, ESTIMATION=0.40."
      - name: estimation_basis
        type: string
        source: input
        description: "Free-text basis when data_source == ESTIMATION; required in that case, must be null otherwise."
        constraints: "5..500 chars when present"
      - name: entered_by_user_id
        type: string
        source: system
        description: "User who entered this record (X-User-ID at POST time)."
      - name: status
        type: enum
        source: system
        description: "Activity record lifecycle."
        default: RECORDED
        constraints: "one of {RECORDED, ARCHIVED}"

  - name: EmissionRecord
    parent: ReportingPeriod
    common_fields: true
    fields:
      - name: reporting_period_id
        type: string
        source: input
        description: "Owning reporting period."
      - name: activity_data_id
        type: string
        source: input
        description: "Activity record this emission row derives from."
      - name: emission_factor_id
        type: string
        source: system
        description: "Factor version pinned at compute time (the ACTIVE version whose effective_from <= ActivityData.activity_start)."
      - name: gas_type
        type: enum
        source: system
        description: "Copied from EmissionSource.gas_type at compute time."
        constraints: "one of {CO2, CH4, N2O, HFC, PFC, SF6, NF3}"
      - name: gwp_factor
        type: number
        source: system
        description: "GWP-100 applied: CO2=1, CH4=28, N2O=265, HFC=1430, PFC=7390, SF6=23500, NF3=16100."
      - name: kg_co2e
        type: number
        source: computed
        description: "kg CO2e emitted = quantity * factor.kg_per_unit * gwp_factor, rounded HALF_UP to four decimals."
      - name: scope2_method
        type: enum
        source: system
        description: "For SCOPE_2 records this distinguishes location-based vs market-based; copied from EmissionFactor.scope2_method. Null for SCOPE_1/SCOPE_3."
        constraints: "one of {LOCATION_BASED, MARKET_BASED} or null"
      - name: status
        type: enum
        source: system
        description: "Record lifecycle. FRESH = pinned factor is still ACTIVE; STALE = pinned factor has been SUPERSEDED since pinning; ARCHIVED = parent period closed."
        default: FRESH
        constraints: "one of {FRESH, STALE, ARCHIVED}"

  - name: ReductionProject
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "Owning organization id."
      - name: name
        type: string
        source: input
        description: "Project name."
        constraints: "1..200 chars"
      - name: project_type
        type: enum
        source: input
        description: "Internal reduction vs external offset purchase."
        constraints: "one of {INTERNAL_REDUCTION, EXTERNAL_OFFSET}"
      - name: facility_id
        type: string
        source: input
        description: "Facility whose emissions the internal project reduces; required iff project_type == INTERNAL_REDUCTION, null otherwise."
      - name: reduction_kg_co2e
        type: number
        source: input
        description: "Expected/realised reduction (kg CO2e) attributable to the project for the linked ReportingPeriod."
        constraints: ">= 0, four decimal places"
      - name: reporting_period_id
        type: string
        source: input
        description: "Reporting period this project reduces."
      - name: status
        type: enum
        source: system
        description: "Project lifecycle."
        default: PLANNED
        constraints: "one of {PLANNED, ACTIVE, COMPLETED, CANCELLED}"

  - name: CarbonCredit
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "Owning organization id."
      - name: registry
        type: enum
        source: input
        description: "Registry standard."
        constraints: "one of {VCS, GOLD_STANDARD, CCER}"
      - name: serial_number
        type: string
        source: input
        description: "Registry-issued serial number. Globally unique across all CarbonCredit rows of all organizations to prevent double counting."
        constraints: "1..100 chars"
      - name: vintage_year
        type: integer
        source: input
        description: "Vintage year of the credit."
        constraints: "1990 <= vintage_year <= reporting period year (year of ReportingPeriod.end_date)"
      - name: quantity_kg_co2e
        type: number
        source: input
        description: "Total credit quantity in kg CO2e."
        constraints: "> 0, four decimal places"
      - name: linked_reduction_project_id
        type: string
        source: input
        description: "ReductionProject row this credit is purchased into; must have project_type == EXTERNAL_OFFSET."
      - name: reporting_period_id
        type: string
        source: input
        description: "Reporting period this credit is applied against."
      - name: retired_at
        type: datetime
        source: system
        description: "Timestamp when credit was retired (set on PURCHASED→RETIRED). Null while PURCHASED."
      - name: retirement_certificate_url
        type: string
        source: input
        description: "Public retirement certificate URL provided at retirement time."
        constraints: "1..500 chars when retired"
      - name: status
        type: enum
        source: system
        description: "Credit lifecycle."
        default: PURCHASED
        constraints: "one of {PURCHASED, RETIRED, TRANSFERRED}"

  - name: Report
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "Owning organization id."
      - name: reporting_period_id
        type: string
        source: input
        description: "Reporting period the report covers."
      - name: standard
        type: enum
        source: input
        description: "Disclosure standard template."
        constraints: "one of {GHG_PROTOCOL, ISO_14064, CDP, TCFD, LOCAL_MANDATORY}"
      - name: gross_scope1_kg_co2e
        type: number
        source: computed
        description: "Sum of FRESH EmissionRecord.kg_co2e where scope == SCOPE_1, weighted by Facility consolidation share; pinned at COMPILE."
      - name: gross_scope2_location_kg_co2e
        type: number
        source: computed
        description: "Sum of FRESH EmissionRecord.kg_co2e where scope == SCOPE_2 AND scope2_method == LOCATION_BASED; pinned at COMPILE."
      - name: gross_scope2_market_kg_co2e
        type: number
        source: computed
        description: "Sum of FRESH EmissionRecord.kg_co2e where scope == SCOPE_2 AND scope2_method == MARKET_BASED; pinned at COMPILE."
      - name: gross_scope3_kg_co2e
        type: number
        source: computed
        description: "Sum of FRESH EmissionRecord.kg_co2e where scope == SCOPE_3."
      - name: applied_offsets_kg_co2e
        type: number
        source: computed
        description: "Sum of RETIRED CarbonCredit.quantity_kg_co2e + sum of COMPLETED ReductionProject.reduction_kg_co2e for the reporting_period_id."
      - name: net_emissions_kg_co2e
        type: number
        source: computed
        description: "gross_scope1 + gross_scope2_market (note: market-based is canonical for net) + gross_scope3 - applied_offsets, floor 0."
      - name: intensity_per_revenue
        type: number
        source: computed
        description: "net_emissions_kg_co2e / ReportingPeriod.revenue, rounded HALF_UP to four decimals. Zero when revenue == 0."
      - name: intensity_per_employee
        type: number
        source: computed
        description: "net_emissions_kg_co2e / ReportingPeriod.headcount, rounded HALF_UP to four decimals. Zero when headcount == 0."
      - name: intensity_per_unit_output
        type: number
        source: computed
        description: "net_emissions_kg_co2e / ReportingPeriod.unit_output, rounded HALF_UP to four decimals. Zero when unit_output == 0."
      - name: completeness_pct
        type: number
        source: computed
        description: "Share of identified ACTIVE EmissionSources for the org that have at least one FRESH EmissionRecord in the reporting period; 0..100."
      - name: completeness_passes
        type: boolean
        source: computed
        description: "True iff completeness_pct >= 100 - Organization.materiality_threshold_pct (rounded HALF_UP to two decimals on both sides)."
      - name: assurance_ready
        type: boolean
        source: computed
        description: "True iff completeness_passes AND no STALE EmissionRecord references this period AND ReportingPeriod.status in {OPEN, CLOSED}."
      - name: compiled_at
        type: datetime
        source: system
        description: "Timestamp at which totals were pinned (DRAFT→UNDER_REVIEW transition)."
      - name: verified_at
        type: datetime
        source: system
        description: "Timestamp at which a Verifier signed off (UNDER_REVIEW→VERIFIED)."
      - name: verifier_user_id
        type: string
        source: system
        description: "User who verified (set on UNDER_REVIEW→VERIFIED). Must differ from every entered_by_user_id of every ActivityData row consumed."
      - name: published_at
        type: datetime
        source: system
        description: "Timestamp at which a Discloser published (VERIFIED→PUBLISHED)."
      - name: status
        type: enum
        source: system
        description: "Report lifecycle. RECOMPUTE_REQUIRED is set automatically when a pinned factor is superseded while the report is in DRAFT or UNDER_REVIEW."
        default: DRAFT
        constraints: "one of {DRAFT, UNDER_REVIEW, REVISIONS_REQUIRED, VERIFIED, PUBLISHED, RECOMPUTE_REQUIRED}"

  - name: AuditLog
    parent: Organization
    common_fields: false
    fields:
      - name: organization_id
        type: string
        source: input
        description: "Owning organization id."
      - name: actor_user_id
        type: string
        source: system
        description: "User id from X-User-ID at the time of the change."
      - name: actor_role
        type: string
        source: system
        description: "Role from X-User-Role at the time of the change."
      - name: event_type
        type: enum
        source: system
        description: "Audit category."
        constraints: "one of {ACTIVITY_ENTRY, ACTIVITY_ARCHIVE, FACTOR_APPROVE, FACTOR_SUPERSEDE, REPORT_COMPILE, REPORT_VERIFY, REPORT_PUBLISH, BOUNDARY_CHANGE, CREDIT_RETIRE, EXTERNAL_SYNC}"
      - name: target_entity
        type: string
        source: system
        description: "Entity type of the affected row."
      - name: target_id
        type: string
        source: system
        description: "Affected row id."
      - name: payload_json
        type: object
        source: system
        description: "Frozen snapshot of the relevant fields before/after the change."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ReportingPeriod
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /organizations/{org_id}/reporting-periods/{id}/close"
        actor: DataSteward
        preconditions:
          - "ReportingPeriod.status == OPEN"
          - "Now (server clock) >= ReportingPeriod.end_date (use POST /_clock/advance in tests)"
          - "Every ACTIVE EmissionSource of the organization has at least one ActivityData row whose activity_start..activity_end lies inside the period (completeness_pct will be 100.0 modulo materiality)"
        side_effects:
          - "All ActivityData rows whose reporting_period_id == this row are mass-updated status RECORDED→ARCHIVED (cascade hop 1)."
          - "All EmissionRecord rows whose reporting_period_id == this row are mass-updated status FRESH→ARCHIVED, and STALE→ARCHIVED (cascade hop 2)."
          - "All DRAFT and UNDER_REVIEW Report rows whose reporting_period_id == this row are auto-transitioned to REVISIONS_REQUIRED (cascade hop 3)."
          - "AuditLog row appended with event_type == ACTIVITY_ARCHIVE."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /organizations/{org_id}/reporting-periods/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "ReportingPeriod.status == OPEN"
          - "No PUBLISHED Report references this period"
        side_effects:
          - "ActivityData rows of this period are mass-archived (RECORDED→ARCHIVED)."
          - "EmissionRecord rows of this period are mass-archived."

  - entity: EmissionFactor
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /organizations/{org_id}/factors/{id}/approve"
        actor: FactorManager
        preconditions:
          - "EmissionFactor.status == DRAFT"
          - "If a prior version exists for the same code with status == ACTIVE, that version's effective_from < this version's effective_from"
          - "approved_by_user_id (X-User-ID) is set on the row"
        side_effects:
          - "Any prior ACTIVE EmissionFactor with same code is transitioned ACTIVE→SUPERSEDED, its effective_to set equal to this row's effective_from (cascade hop 1)."
          - "Every EmissionRecord whose emission_factor_id == the superseded row AND parent ReportingPeriod.status == OPEN flips FRESH→STALE (cascade hop 2)."
          - "Every Report whose status in {DRAFT, UNDER_REVIEW} AND reporting_period_id is among the affected periods flips to RECOMPUTE_REQUIRED (cascade hop 3)."
          - "AuditLog rows appended: FACTOR_APPROVE for the new row, FACTOR_SUPERSEDE for the predecessor."
      - from: DRAFT
        to: RETIRED
        trigger: "DELETE /organizations/{org_id}/factors/{id}"
        actor: FactorManager
        preconditions:
          - "EmissionFactor.status == DRAFT"
          - "No EmissionRecord references this factor"
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (cascade from approval of newer version)"
        actor: system
        preconditions:
          - "A newer version with strictly greater effective_from has been approved"
        side_effects:
          - "effective_to is set to the newer version's effective_from."

  - entity: CarbonCredit
    initial_state: PURCHASED
    terminal_states: [RETIRED, TRANSFERRED]
    transitions:
      - from: PURCHASED
        to: RETIRED
        trigger: "POST /organizations/{org_id}/credits/{id}/retire"
        actor: Discloser
        preconditions:
          - "CarbonCredit.status == PURCHASED"
          - "ReductionProject referenced by linked_reduction_project_id has status == ACTIVE"
          - "retirement_certificate_url is provided in the request body"
          - "vintage_year <= year(ReportingPeriod.end_date)"
        side_effects:
          - "retired_at = now()."
          - "If parent ReportingPeriod has any DRAFT/UNDER_REVIEW Report, that Report's applied_offsets_kg_co2e and net_emissions_kg_co2e are recomputed and updated_at refreshed (cascade hop 1)."
          - "AuditLog event CREDIT_RETIRE appended."
      - from: PURCHASED
        to: TRANSFERRED
        trigger: "POST /organizations/{org_id}/credits/{id}/transfer"
        actor: Discloser
        preconditions:
          - "CarbonCredit.status == PURCHASED"
          - "Parent ReportingPeriod.status == OPEN"
        side_effects: []

  - entity: Report
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /organizations/{org_id}/reports/{id}/compile"
        actor: DataSteward
        preconditions:
          - "Report.status == DRAFT"
          - "ReportingPeriod.status in {OPEN, CLOSED}"
          - "No EmissionRecord whose reporting_period_id == Report.reporting_period_id has status == STALE"
        side_effects:
          - "compiled_at = now()."
          - "gross_scope1_kg_co2e, gross_scope2_location_kg_co2e, gross_scope2_market_kg_co2e, gross_scope3_kg_co2e, applied_offsets_kg_co2e, net_emissions_kg_co2e, intensity_per_revenue, intensity_per_employee, intensity_per_unit_output, completeness_pct, completeness_passes, assurance_ready are computed and pinned."
          - "AuditLog event REPORT_COMPILE appended."
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /organizations/{org_id}/reports/{id}/verify"
        actor: Verifier
        preconditions:
          - "Report.status == UNDER_REVIEW"
          - "Report.assurance_ready == true"
          - "X-User-ID does NOT equal any ActivityData.entered_by_user_id whose reporting_period_id == Report.reporting_period_id (segregation of duties)"
        side_effects:
          - "verified_at = now(), verifier_user_id = X-User-ID."
          - "AuditLog event REPORT_VERIFY appended."
      - from: UNDER_REVIEW
        to: REVISIONS_REQUIRED
        trigger: "POST /organizations/{org_id}/reports/{id}/request-revisions"
        actor: Verifier
        preconditions:
          - "Report.status == UNDER_REVIEW"
        side_effects: []
      - from: REVISIONS_REQUIRED
        to: DRAFT
        trigger: "POST /organizations/{org_id}/reports/{id}/reopen"
        actor: DataSteward
        preconditions:
          - "Report.status == REVISIONS_REQUIRED"
        side_effects:
          - "compiled_at = null, all pinned totals reset to null."
      - from: RECOMPUTE_REQUIRED
        to: DRAFT
        trigger: "POST /organizations/{org_id}/reports/{id}/reopen"
        actor: DataSteward
        preconditions:
          - "Report.status == RECOMPUTE_REQUIRED"
        side_effects:
          - "compiled_at = null, all pinned totals reset to null."
      - from: VERIFIED
        to: PUBLISHED
        trigger: "POST /organizations/{org_id}/reports/{id}/publish"
        actor: Discloser
        preconditions:
          - "Report.status == VERIFIED"
          - "No CarbonCredit referenced by an INTERNAL_REDUCTION linkage is in PURCHASED state for this period (i.e. all offsets fully retired)"
        side_effects:
          - "published_at = now()."
          - "AuditLog event REPORT_PUBLISH appended."
      - from: DRAFT
        to: RECOMPUTE_REQUIRED
        trigger: "system (cascade from EmissionFactor DRAFT→ACTIVE supersedure)"
        actor: system
        preconditions:
          - "An ActiveEmissionRecord pinned to this report's period has had its factor superseded"
        side_effects: []
      - from: UNDER_REVIEW
        to: RECOMPUTE_REQUIRED
        trigger: "system (cascade from EmissionFactor DRAFT→ACTIVE supersedure)"
        actor: system
        preconditions:
          - "An EmissionRecord pinned to this report's period has had its factor superseded"
        side_effects: []

  - entity: ReductionProject
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /organizations/{org_id}/projects/{id}/activate"
        actor: DataSteward
        preconditions:
          - "ReductionProject.status == PLANNED"
          - "Parent ReportingPeriod.status == OPEN"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /organizations/{org_id}/projects/{id}/complete"
        actor: DataSteward
        preconditions:
          - "ReductionProject.status == ACTIVE"
          - "Parent ReportingPeriod.status in {OPEN, CLOSED}"
          - "If project_type == EXTERNAL_OFFSET, every linked CarbonCredit has status == RETIRED"
        side_effects:
          - "applied_offsets_kg_co2e of any DRAFT/UNDER_REVIEW Report on the same period is recomputed."
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /organizations/{org_id}/projects/{id}/cancel"
        actor: DataSteward
        preconditions:
          - "ReductionProject.status in {PLANNED, ACTIVE}"
          - "No CarbonCredit with status == RETIRED references this project"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /organizations/{org_id}/projects/{id}/cancel"
        actor: DataSteward
        preconditions:
          - "ReductionProject.status in {PLANNED, ACTIVE}"
          - "No CarbonCredit with status == RETIRED references this project"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two managers approve two DRAFT factor versions for the same code at the same time"
    guarantee: "At most one DRAFT→ACTIVE transition succeeds per code; the second is rejected because the predecessor is no longer ACTIVE on the latest snapshot"
    error_id: ERR_FACTOR_VERSION_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on EmissionFactor.code; loser sees the freshly SUPERSEDED predecessor"

  - scenario: "Two stewards retire the same CarbonCredit simultaneously"
    guarantee: "Exactly one retirement succeeds; the loser is rejected with state error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on CarbonCredit.status"

  - scenario: "A Verifier verifies a Report while a system cascade flips it to RECOMPUTE_REQUIRED due to factor supersession"
    guarantee: "The verify and the cascade are serialized on the Report row; if cascade wins, verify is rejected with state error; if verify wins, cascade is rejected with version conflict on the Report row"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Report.status using Report.version"

  - scenario: "Two ActivityData rows posted for the same EmissionSource with overlapping activity_start..activity_end intervals"
    guarantee: "Half-open interval overlap detection on (EmissionSource, [activity_start, activity_end)); second writer rejected"
    error_id: ERR_ACTIVITY_INTERVAL_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on EmissionSource activity window"

  - scenario: "Two organizations attempt to record a CarbonCredit with the same registry serial_number"
    guarantee: "Global uniqueness of CarbonCredit.serial_number prevents double counting; second creator rejected"
    error_id: ERR_CREDIT_DOUBLE_COUNTED
    http_status: 409
    serialization: "First-writer-wins on CarbonCredit.serial_number across all organizations"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: emission_record_kg_co2e
    trigger: "POST /organizations/{org_id}/reporting-periods/{period_id}/activity-data (creates ActivityData and an EmissionRecord row in the same transaction)"
    algorithm: weighted_scoring
    formula: |
      # Pin factor:
      F = the EmissionFactor whose:
          status == ACTIVE
          code linked via EmissionSource.factor_code  (selector pins this code at source creation)
          effective_from <= ActivityData.activity_start
          (effective_to is null OR effective_to > ActivityData.activity_start)
      # If no F exists → ERR_NO_APPLICABLE_FACTOR (validation P4).
      gwp = GWP_TABLE[source.gas_type]                     # constants below
      kg_co2e = round_half_up(quantity * F.kg_per_unit * gwp, 4)
    input_set: "Exactly one ActivityData row, the single EmissionFactor pinned via the selector above, and the EmissionSource (for gas_type)."
    constants:
      GWP_TABLE:
        CO2: 1
        CH4: 28
        N2O: 265
        HFC: 1430
        PFC: 7390
        SF6: 23500
        NF3: 16100
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: report_compile_totals
    trigger: "POST /organizations/{org_id}/reports/{id}/compile (DRAFT→UNDER_REVIEW)"
    algorithm: aggregation
    formula: |
      # Inclusion set:
      ER = EmissionRecord rows where:
           reporting_period_id == Report.reporting_period_id
           AND status == FRESH
           AND EmissionSource.facility_id satisfies Facility.included_in_boundary == true
      # Consolidation weight per Facility:
      if Org.consolidation_approach == EQUITY_SHARE:
          w(facility) = Facility.ownership_share_pct / 100.0
      elif Org.consolidation_approach == FINANCIAL_CONTROL:
          w(facility) = 1.0 if Facility.financial_control else 0.0
      else:  # OPERATIONAL_CONTROL
          w(facility) = 1.0 if Facility.operational_control else 0.0
      # Per-record contribution:
      contrib(er) = er.kg_co2e * w(EmissionSource(er).facility_id)
      # Rounding order: round per facility-scope subtotal first, then sum subtotals (combinatorial mode (b))
      gross_scope1                = round_half_up(sum_per_facility(contrib, scope==SCOPE_1), 4)
      gross_scope2_location       = round_half_up(sum_per_facility(contrib, scope==SCOPE_2 AND scope2_method==LOCATION_BASED), 4)
      gross_scope2_market         = round_half_up(sum_per_facility(contrib, scope==SCOPE_2 AND scope2_method==MARKET_BASED),   4)
      gross_scope3                = round_half_up(sum_per_facility(contrib, scope==SCOPE_3), 4)
    input_set: "FRESH EmissionRecord rows of this period whose source's facility is included_in_boundary == true; STALE and ARCHIVED records are excluded."
    constants: {}
    precision: "4 decimal places, round_half_up; rounding is applied per facility-scope subtotal, then subtotals are summed (NOT round-once-at-end)."
    variants:
      - name: scope2_location_based
        when: "Computing gross_scope2_location_kg_co2e"
        difference: "Inclusion filter restricts to EmissionRecord.scope2_method == LOCATION_BASED, which references grid-average factors."
      - name: scope2_market_based
        when: "Computing gross_scope2_market_kg_co2e"
        difference: "Inclusion filter restricts to EmissionRecord.scope2_method == MARKET_BASED, which references contractual instruments and can produce a strictly different total for identical underlying activity data."

  - name: report_net_emissions
    trigger: "POST /organizations/{org_id}/reports/{id}/compile and cascade recomputes from CarbonCredit retire / ReductionProject complete while Report is DRAFT/UNDER_REVIEW"
    algorithm: threshold
    formula: |
      # Inputs already pinned by report_compile_totals.
      # Offset side:
      retired_offsets   = sum(CarbonCredit.quantity_kg_co2e where status == RETIRED AND reporting_period_id == Report.reporting_period_id)
      internal_offsets  = sum(ReductionProject.reduction_kg_co2e where status == COMPLETED AND project_type == INTERNAL_REDUCTION AND reporting_period_id == Report.reporting_period_id)
      applied_offsets   = round_half_up(retired_offsets + internal_offsets, 4)
      # Canonical net uses market-based scope 2 (per GHG Protocol Scope 2 Guidance).
      gross_total       = gross_scope1 + gross_scope2_market + gross_scope3
      net_emissions     = max(0.0, round_half_up(gross_total - applied_offsets, 4))   # threshold at 0; no negative net
      # Intensity calculations (note: each denominator independently checked for zero — boundary on different metrics):
      intensity_per_revenue     = 0 if revenue == 0     else round_half_up(net_emissions / revenue, 4)
      intensity_per_employee    = 0 if headcount == 0   else round_half_up(net_emissions / headcount, 4)
      intensity_per_unit_output = 0 if unit_output == 0 else round_half_up(net_emissions / unit_output, 4)
    input_set: "gross_scopeN_* already pinned on this Report; RETIRED CarbonCredit + COMPLETED INTERNAL_REDUCTION ReductionProject rows for the same period."
    constants: {}
    precision: "4 decimal places, round_half_up; net floored at 0.0."
    variants:
      - name: net_with_market_scope2
        when: "Canonical net (used for status PUBLISHED dashboards and intensity indicators)"
        difference: "Uses gross_scope2_market_kg_co2e in the sum, reflecting contractual instruments."
      - name: net_with_location_scope2
        when: "Dual-reporting parallel calculation exposed via GET /reports/{id}/dual-scope2"
        difference: "Uses gross_scope2_location_kg_co2e in the sum; for identical underlying activity data the two variants produce DIFFERENT net totals."

  - name: completeness_check
    trigger: "POST /organizations/{org_id}/reports/{id}/compile and POST /organizations/{org_id}/reporting-periods/{id}/close"
    algorithm: threshold
    formula: |
      # Inclusion set: ACTIVE EmissionSource rows of the organization whose facility is included_in_boundary == true.
      identified_sources       = count(ACTIVE EmissionSource where facility included_in_boundary)
      covered_sources          = count(distinct EmissionSource referenced by at least one FRESH EmissionRecord in this period)
      if identified_sources == 0:
          completeness_pct = 0.00
      else:
          completeness_pct = round_half_up(100.0 * covered_sources / identified_sources, 2)
      threshold_pct            = round_half_up(100.0 - Organization.materiality_threshold_pct, 2)
      completeness_passes      = (completeness_pct >= threshold_pct)         # boundary precision: >= NOT >
    input_set: "ACTIVE EmissionSource rows whose Facility.included_in_boundary == true; FRESH EmissionRecord rows of the period."
    constants: {}
    precision: "2 decimal places, round_half_up; threshold comparison uses >= (boundary mode)."
    variants: []

  - name: facility_inclusion_resolver
    trigger: "POST /organizations/{org_id}/facilities, PATCH /organizations/{org_id}/facilities/{id}, POST /organizations/{org_id}/boundary-changes (every mutation of Organization.consolidation_approach or Facility.ownership_share_pct/financial_control/operational_control)"
    algorithm: constraint_propagation
    formula: |
      # For each Facility row of the organization:
      approach = Organization.consolidation_approach
      if approach == EQUITY_SHARE:
          included = (Facility.ownership_share_pct > 0.0)            # strict >, NOT >=
      elif approach == FINANCIAL_CONTROL:
          included = bool(Facility.financial_control)
      else:                                                          # OPERATIONAL_CONTROL
          included = bool(Facility.operational_control)
      Facility.included_in_boundary = included
      # Cascade: any EmissionSource whose facility flipped from included==true to false has its status set to RETIRED
      # automatically, and any FRESH EmissionRecord on that source flips to STALE in the same transaction.
    input_set: "All Facility rows of the organization; consolidation_approach of the organization."
    constants: {}
    precision: "Boolean."
    variants:
      - name: equity_share_inclusion
        when: "Organization.consolidation_approach == EQUITY_SHARE"
        difference: "Strict >0 on ownership_share_pct; a facility with 0.00 share is excluded even if financial_control is true."
      - name: financial_control_inclusion
        when: "Organization.consolidation_approach == FINANCIAL_CONTROL"
        difference: "Inclusion is driven entirely by Facility.financial_control; ownership_share_pct is ignored. For identical Facility rows, switching the approach can flip included_in_boundary from true to false and produce a strictly different scope-1 total."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role permitted for the requested endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources resolve left-to-right (organization, then reporting-period, then nested resource); the first missing id wins"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested action (e.g. CANNOT compile a Report whose period.status == CANCELLED, CANNOT retire a CarbonCredit whose status != PURCHASED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /reports/{id}/compile, POST /reports/{id}/verify, POST /reports/{id}/publish, POST /credits/{id}/retire, POST /factors/{id}/approve, POST /reporting-periods/{id}/close"

  - priority: 5
    category: state
    check: "OCC version match: every mutation accepts optional version; mismatch is rejected before any business check"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH and POST action endpoints on versioned entities"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: when an actor attempts to verify a Report (POST /reports/{id}/verify), X-User-ID MUST NOT equal any ActivityData.entered_by_user_id of any row referenced (directly or via EmissionRecord) by the report's reporting period"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reports/{id}/verify"

  - priority: 7
    category: business_safety
    check: "Double-counting prevention: CarbonCredit.serial_number is globally unique across ALL organizations; vintage_year must satisfy vintage_year <= year(ReportingPeriod.end_date)"
    error_id: ERR_CREDIT_DOUBLE_COUNTED
    http_status: 409
    applies_to: "POST /organizations/{org_id}/credits"

  - priority: 8
    category: business_referential
    check: "Factor traceability: at compile time, every FRESH EmissionRecord MUST reference an EmissionFactor whose status in {ACTIVE, SUPERSEDED} AND whose traceability_url is non-empty"
    error_id: ERR_TRACEABILITY_MISSING
    http_status: 422
    applies_to: "POST /reports/{id}/compile"

  - priority: 9
    category: business_temporal
    check: "ActivityData.activity_start..activity_end falls inside ReportingPeriod.[start_date, end_date) and activity_end > activity_start"
    error_id: ERR_ACTIVITY_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST /organizations/{org_id}/reporting-periods/{id}/activity-data"

  - priority: 10
    category: business_temporal
    check: "Two ActivityData rows for the same EmissionSource MUST NOT have overlapping half-open intervals [activity_start, activity_end)"
    error_id: ERR_ACTIVITY_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /organizations/{org_id}/reporting-periods/{id}/activity-data"

  - priority: 11
    category: business_temporal
    check: "ReportingPeriod intervals [start_date, end_date) within an organization MUST NOT overlap any other ReportingPeriod with status != CANCELLED"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /organizations/{org_id}/reporting-periods, PATCH /organizations/{org_id}/reporting-periods/{id}"

  - priority: 12
    category: business_referential
    check: "When posting ActivityData, an ACTIVE EmissionFactor MUST exist for the source's factor_code whose effective_from <= activity_start (otherwise no applicable factor)"
    error_id: ERR_NO_APPLICABLE_FACTOR
    http_status: 422
    applies_to: "POST /organizations/{org_id}/reporting-periods/{id}/activity-data"

  - priority: 13
    category: business_constraint
    check: "When data_source == ESTIMATION, estimation_basis MUST be non-null and 5..500 chars; when data_source != ESTIMATION, estimation_basis MUST be null"
    error_id: ERR_ESTIMATION_BASIS_REQUIRED
    http_status: 422
    applies_to: "POST /organizations/{org_id}/reporting-periods/{id}/activity-data"

  - priority: 14
    category: business_referential
    check: "Boundary inclusion: at ActivityData entry time, EmissionSource.facility must satisfy Facility.included_in_boundary == true AND Facility.status == ACTIVE"
    error_id: ERR_FACILITY_OUT_OF_BOUNDARY
    http_status: 422
    applies_to: "POST /organizations/{org_id}/reporting-periods/{id}/activity-data, POST /organizations/{org_id}/sources"

  - priority: 15
    category: business_safety
    check: "Assurance readiness: Report.assurance_ready MUST be true at verify time (completeness passes AND no STALE EmissionRecord on the period)"
    error_id: ERR_ASSURANCE_NOT_READY
    http_status: 422
    applies_to: "POST /reports/{id}/verify"

  - priority: 16
    category: business_referential
    check: "BoundaryChange.effective_date MUST be strictly greater than the effective_date of the latest existing BoundaryChange for the same organization"
    error_id: ERR_BOUNDARY_CHANGE_ORDER
    http_status: 422
    applies_to: "POST /organizations/{org_id}/boundary-changes"

  - priority: 17
    category: business_temporal
    check: "EmissionFactor effective-window chain: when approving a new version for a code, the new version's effective_from MUST be strictly greater than the predecessor ACTIVE version's effective_from (zero-length windows and reverse-time approvals are rejected). The predecessor's effective_to is then auto-set equal to the new version's effective_from (adjacency-allowed, half-open chain)."
    error_id: ERR_FACTOR_EFFECTIVE_FROM_ORDER
    http_status: 422
    applies_to: "POST /organizations/{org_id}/factors/{id}/approve"

  - priority: 18
    category: business_fiscal
    check: "Materiality threshold: 0.0 <= Organization.materiality_threshold_pct <= 5.0 (two decimals)"
    error_id: ERR_MATERIALITY_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /organizations, PATCH /organizations/{org_id}"

  - priority: 19
    category: business_constraint
    check: "Scope-3 category required iff source.category == VALUE_CHAIN; scope3_category MUST be in 1..15 when present and null otherwise"
    error_id: ERR_SCOPE3_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /organizations/{org_id}/sources, PATCH /organizations/{org_id}/sources/{id}"

  - priority: 20
    category: business_fiscal
    check: "ReportingPeriod denominators non-negative: revenue >= 0, headcount >= 0, unit_output >= 0; revenue precision = 2dp, unit_output precision = 4dp"
    error_id: ERR_DENOMINATOR_INVALID
    http_status: 422
    applies_to: "POST /organizations/{org_id}/reporting-periods, PATCH /organizations/{org_id}/reporting-periods/{id}"

  - priority: 21
    category: business_constraint
    check: "Multi-tenancy isolation: every reference (facility_id, reporting_period_id, emission_source_id, linked_reduction_project_id, etc.) MUST belong to the same Organization in the URL path"
    error_id: ERR_CROSS_ORG_REFERENCE
    http_status: 403
    applies_to: "all mutation endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Organizations ----
  - method: POST
    path: "/organizations"
    description: "Create organization profile."
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "consolidation_approach", "base_year", "functional_currency", "materiality_threshold_pct?"]
    output: Organization
    side_effects: []

  - method: GET
    path: "/organizations/{org_id}"
    description: "Read organization profile."
    roles: [PlatformAdmin, DataSteward, FactorManager, Verifier, Discloser]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: PATCH
    path: "/organizations/{org_id}"
    description: "Update consolidation_approach, materiality_threshold_pct, or other mutable fields."
    roles: [PlatformAdmin]
    code: 200
    input: ["legal_name?", "consolidation_approach?", "materiality_threshold_pct?", "version?"]
    output: Organization
    side_effects: ["facility_inclusion_resolver runs for every Facility; cascade may set EmissionSource.status=RETIRED and EmissionRecord.status=STALE"]

  # ---- Facilities ----
  - method: POST
    path: "/organizations/{org_id}/facilities"
    description: "Add facility to organization."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "country_code", "ownership_share_pct", "financial_control", "operational_control"]
    output: Facility
    side_effects: ["facility_inclusion_resolver computes included_in_boundary"]

  - method: PATCH
    path: "/organizations/{org_id}/facilities/{id}"
    description: "Adjust ownership share or control flags."
    roles: [PlatformAdmin]
    code: 200
    input: ["name?", "ownership_share_pct?", "financial_control?", "operational_control?", "version?"]
    output: Facility
    side_effects: ["facility_inclusion_resolver re-evaluates; cascades to sources and records if exclusion changes"]

  - method: GET
    path: "/organizations/{org_id}/facilities"
    description: "List facilities."
    roles: [PlatformAdmin, DataSteward, FactorManager, Verifier, Discloser]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Facility[]"
    side_effects: []

  # ---- Boundary changes ----
  - method: POST
    path: "/organizations/{org_id}/boundary-changes"
    description: "Record a boundary change (add/remove facility, approach switch, ownership adjustment)."
    roles: [PlatformAdmin]
    code: 201
    input: ["change_type", "facility_id?", "from_approach?", "to_approach?", "effective_date", "rationale"]
    output: BoundaryChange
    side_effects: ["facility_inclusion_resolver may run; previous_change_id linked to chain head"]

  - method: GET
    path: "/organizations/{org_id}/boundary-changes"
    description: "List boundary-change history (most-recent first)."
    roles: [PlatformAdmin, DataSteward, Verifier, Discloser]
    code: 200
    input: ["limit?", "offset?"]
    output: "BoundaryChange[]"
    side_effects: []

  # ---- Reporting periods ----
  - method: POST
    path: "/organizations/{org_id}/reporting-periods"
    description: "Create reporting period."
    roles: [DataSteward, PlatformAdmin]
    code: 201
    input: ["label", "start_date", "end_date", "revenue", "headcount", "unit_output"]
    output: ReportingPeriod
    side_effects: []

  - method: PATCH
    path: "/organizations/{org_id}/reporting-periods/{id}"
    description: "Update denominator fields (revenue/headcount/unit_output) on an OPEN period."
    roles: [DataSteward, PlatformAdmin]
    code: 200
    input: ["revenue?", "headcount?", "unit_output?", "version?"]
    output: ReportingPeriod
    side_effects: []

  - method: POST
    path: "/organizations/{org_id}/reporting-periods/{id}/close"
    description: "Close a reporting period after end_date has passed."
    roles: [DataSteward, PlatformAdmin]
    code: 200
    input: ["version?"]
    output: ReportingPeriod
    side_effects: ["mass-archive ActivityData and EmissionRecord; auto-transition Reports to REVISIONS_REQUIRED if still in DRAFT/UNDER_REVIEW"]

  - method: POST
    path: "/organizations/{org_id}/reporting-periods/{id}/cancel"
    description: "Cancel a reporting period (admin only)."
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: ReportingPeriod
    side_effects: []

  # ---- Emission sources ----
  - method: POST
    path: "/organizations/{org_id}/sources"
    description: "Create emission source."
    roles: [DataSteward]
    code: 201
    input: ["facility_id", "code", "category", "scope3_category?", "gas_type", "factor_code"]
    output: EmissionSource
    side_effects: ["scope is derived from category"]

  - method: PATCH
    path: "/organizations/{org_id}/sources/{id}"
    description: "Update mutable fields of a source."
    roles: [DataSteward]
    code: 200
    input: ["category?", "scope3_category?", "gas_type?", "factor_code?", "version?"]
    output: EmissionSource
    side_effects: []

  - method: GET
    path: "/organizations/{org_id}/sources"
    description: "List sources."
    roles: [DataSteward, FactorManager, Verifier, Discloser]
    code: 200
    input: ["limit?", "offset?", "facility_id?", "category?", "status?"]
    output: "EmissionSource[]"
    side_effects: []

  # ---- Emission factors ----
  - method: POST
    path: "/organizations/{org_id}/factors"
    description: "Create a DRAFT factor version (auto-incremented version per code)."
    roles: [FactorManager]
    code: 201
    input: ["code", "library", "gas_type", "scope2_method?", "kg_per_unit", "uncertainty_rating", "effective_from", "traceability_url"]
    output: EmissionFactor
    side_effects: []

  - method: POST
    path: "/organizations/{org_id}/factors/{id}/approve"
    description: "Approve a DRAFT factor (DRAFT→ACTIVE), supersede previous version, cascade to records and reports."
    roles: [FactorManager]
    code: 200
    input: ["version?"]
    output: EmissionFactor
    side_effects: ["predecessor ACTIVE→SUPERSEDED", "EmissionRecord FRESH→STALE", "Report DRAFT/UNDER_REVIEW → RECOMPUTE_REQUIRED"]

  - method: DELETE
    path: "/organizations/{org_id}/factors/{id}"
    description: "Retire an unused DRAFT factor (DRAFT→RETIRED)."
    roles: [FactorManager]
    code: 204
    input: ["version?"]
    output: null
    side_effects: []

  - method: GET
    path: "/organizations/{org_id}/factors"
    description: "List factors by code with version history."
    roles: [FactorManager, DataSteward, Verifier]
    code: 200
    input: ["limit?", "offset?", "code?", "status?"]
    output: "EmissionFactor[]"
    side_effects: []

  # ---- Activity data ----
  - method: POST
    path: "/organizations/{org_id}/reporting-periods/{period_id}/activity-data"
    description: "Enter activity data; emission record is computed and pinned in the same transaction."
    roles: [DataSteward]
    code: 201
    input: ["emission_source_id", "data_source", "quantity", "unit", "activity_start", "activity_end", "estimation_basis?"]
    output: ActivityData
    side_effects: ["EmissionRecord row created via emission_record_kg_co2e calculation", "AuditLog event ACTIVITY_ENTRY appended"]

  - method: GET
    path: "/organizations/{org_id}/reporting-periods/{period_id}/activity-data"
    description: "List activity data rows."
    roles: [DataSteward, Verifier]
    code: 200
    input: ["limit?", "offset?", "emission_source_id?", "data_source?", "status?"]
    output: "ActivityData[]"
    side_effects: []

  - method: GET
    path: "/organizations/{org_id}/reporting-periods/{period_id}/emission-records"
    description: "List computed emission records (FRESH/STALE/ARCHIVED)."
    roles: [DataSteward, Verifier, Discloser]
    code: 200
    input: ["limit?", "offset?", "status?", "scope?"]
    output: "EmissionRecord[]"
    side_effects: []

  # ---- Reduction projects & credits ----
  - method: POST
    path: "/organizations/{org_id}/projects"
    description: "Create ReductionProject."
    roles: [DataSteward]
    code: 201
    input: ["name", "project_type", "facility_id?", "reduction_kg_co2e", "reporting_period_id"]
    output: ReductionProject
    side_effects: []

  - method: POST
    path: "/organizations/{org_id}/projects/{id}/activate"
    description: "PLANNED→ACTIVE."
    roles: [DataSteward]
    code: 200
    input: ["version?"]
    output: ReductionProject
    side_effects: []

  - method: POST
    path: "/organizations/{org_id}/projects/{id}/complete"
    description: "ACTIVE→COMPLETED."
    roles: [DataSteward]
    code: 200
    input: ["version?"]
    output: ReductionProject
    side_effects: ["recompute report applied_offsets/net for DRAFT/UNDER_REVIEW reports on the period"]

  - method: POST
    path: "/organizations/{org_id}/projects/{id}/cancel"
    description: "PLANNED|ACTIVE→CANCELLED."
    roles: [DataSteward]
    code: 200
    input: ["version?"]
    output: ReductionProject
    side_effects: []

  - method: POST
    path: "/organizations/{org_id}/credits"
    description: "Record an external carbon credit purchase."
    roles: [Discloser]
    code: 201
    input: ["registry", "serial_number", "vintage_year", "quantity_kg_co2e", "linked_reduction_project_id", "reporting_period_id"]
    output: CarbonCredit
    side_effects: []

  - method: POST
    path: "/organizations/{org_id}/credits/{id}/retire"
    description: "Retire a credit (PURCHASED→RETIRED)."
    roles: [Discloser]
    code: 200
    input: ["retirement_certificate_url", "version?"]
    output: CarbonCredit
    side_effects: ["recompute applied_offsets/net for DRAFT/UNDER_REVIEW reports on the period"]

  - method: POST
    path: "/organizations/{org_id}/credits/{id}/transfer"
    description: "Transfer a credit out (PURCHASED→TRANSFERRED)."
    roles: [Discloser]
    code: 200
    input: ["version?"]
    output: CarbonCredit
    side_effects: []

  # ---- Reports ----
  - method: POST
    path: "/organizations/{org_id}/reports"
    description: "Create a Report for a reporting period under a chosen standard."
    roles: [DataSteward]
    code: 201
    input: ["reporting_period_id", "standard"]
    output: Report
    side_effects: []

  - method: POST
    path: "/organizations/{org_id}/reports/{id}/compile"
    description: "DRAFT→UNDER_REVIEW; pin all totals."
    roles: [DataSteward]
    code: 200
    input: ["version?"]
    output: Report
    side_effects: ["pin gross/net/intensity totals via report_compile_totals and report_net_emissions calculations"]

  - method: POST
    path: "/organizations/{org_id}/reports/{id}/verify"
    description: "UNDER_REVIEW→VERIFIED."
    roles: [Verifier]
    code: 200
    input: ["version?"]
    output: Report
    side_effects: []

  - method: POST
    path: "/organizations/{org_id}/reports/{id}/request-revisions"
    description: "UNDER_REVIEW→REVISIONS_REQUIRED."
    roles: [Verifier]
    code: 200
    input: ["version?"]
    output: Report
    side_effects: []

  - method: POST
    path: "/organizations/{org_id}/reports/{id}/reopen"
    description: "REVISIONS_REQUIRED|RECOMPUTE_REQUIRED → DRAFT; reset pinned totals."
    roles: [DataSteward]
    code: 200
    input: ["version?"]
    output: Report
    side_effects: []

  - method: POST
    path: "/organizations/{org_id}/reports/{id}/publish"
    description: "VERIFIED→PUBLISHED."
    roles: [Discloser]
    code: 200
    input: ["version?"]
    output: Report
    side_effects: []

  - method: GET
    path: "/organizations/{org_id}/reports/{id}"
    description: "Read Report including pinned totals."
    roles: [DataSteward, FactorManager, Verifier, Discloser]
    code: 200
    input: []
    output: Report
    side_effects: []

  - method: GET
    path: "/organizations/{org_id}/reports/{id}/dual-scope2"
    description: "Return both location-based and market-based net emissions for the report (variants of report_net_emissions)."
    roles: [DataSteward, Verifier, Discloser]
    code: 200
    input: []
    output: "object with fields {net_with_location_scope2, net_with_market_scope2, delta_kg_co2e}"
    side_effects: []

  # ---- Audit log ----
  - method: GET
    path: "/organizations/{org_id}/audit-log"
    description: "List audit-log events (append-only)."
    roles: [PlatformAdmin, Verifier]
    code: 200
    input: ["limit?", "offset?", "event_type?", "target_entity?"]
    output: "AuditLog[]"
    side_effects: []

  # ---- External sync (event-driven integration) ----
  - method: POST
    path: "/_events/emit"
    description: "Test-only: emit an external sync event from ERP / energy meter / supplier portal / carbon-market registry."
    roles: [PlatformAdmin]
    code: 200
    input: ["source_system", "payload"]
    output: "object"
    side_effects: ["AuditLog event EXTERNAL_SYNC appended"]

  # ---- Clock control ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance server clock for time-gated checks (e.g. closing reporting periods)."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_timestamp"]
    output: "object with current_time"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or empty X-User-ID/X-User-Role headers."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role is not authorized for the endpoint."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (organization, facility, period, source, factor, project, credit, report, etc.) does not exist."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that allows the requested action."

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency: supplied version != current version."

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Verifier attempted to verify a Report whose period contains ActivityData entered by the same user."

  - id: ERR_CREDIT_DOUBLE_COUNTED
    http: 409
    condition: "CarbonCredit.serial_number already exists across any organization, OR vintage_year > year(reporting_period.end_date)."

  - id: ERR_TRACEABILITY_MISSING
    http: 422
    condition: "A FRESH EmissionRecord references an EmissionFactor without a non-empty traceability_url at compile time."

  - id: ERR_ACTIVITY_OUTSIDE_PERIOD
    http: 422
    condition: "ActivityData.activity_start/activity_end falls outside parent ReportingPeriod, or end <= start."

  - id: ERR_ACTIVITY_INTERVAL_OVERLAP
    http: 409
    condition: "Two ActivityData rows for the same EmissionSource overlap on half-open intervals."

  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "Two ReportingPeriods of the same organization (status != CANCELLED) overlap."

  - id: ERR_NO_APPLICABLE_FACTOR
    http: 422
    condition: "No ACTIVE EmissionFactor exists whose effective_from <= ActivityData.activity_start for the source's factor_code."

  - id: ERR_ESTIMATION_BASIS_REQUIRED
    http: 422
    condition: "estimation_basis missing when data_source == ESTIMATION, or present when data_source != ESTIMATION."

  - id: ERR_FACILITY_OUT_OF_BOUNDARY
    http: 422
    condition: "Source or activity data references a facility whose Facility.included_in_boundary == false."

  - id: ERR_ASSURANCE_NOT_READY
    http: 422
    condition: "Report.assurance_ready == false at verify time (completeness failed or STALE records present)."

  - id: ERR_BOUNDARY_CHANGE_ORDER
    http: 422
    condition: "BoundaryChange.effective_date is not strictly greater than the latest existing change's effective_date."

  - id: ERR_FACTOR_EFFECTIVE_FROM_ORDER
    http: 422
    condition: "Approving a factor version whose effective_from <= predecessor ACTIVE version's effective_from (no zero-length window, no reverse-time approval)."

  - id: ERR_MATERIALITY_OUT_OF_RANGE
    http: 422
    condition: "Organization.materiality_threshold_pct is out of [0.0, 5.0]."

  - id: ERR_SCOPE3_CATEGORY_MISMATCH
    http: 422
    condition: "scope3_category provided for non-VALUE_CHAIN source, or absent for VALUE_CHAIN source, or outside 1..15."

  - id: ERR_DENOMINATOR_INVALID
    http: 422
    condition: "Negative revenue, headcount, or unit_output, or wrong precision."

  - id: ERR_CROSS_ORG_REFERENCE
    http: 403
    condition: "Referenced resource belongs to a different organization than the URL path."

  - id: ERR_FACTOR_VERSION_CONFLICT
    http: 409
    condition: "Two managers attempted to approve overlapping factor versions for the same code; the predecessor is no longer ACTIVE."

  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "Generic input validation failure (missing required field, wrong type, length out of range) that does not match a more specific code."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operates the carbon-accounting platform; manages organizations, facilities, and runs maintenance."
    identity: "opaque"
    exclusive_operations:
      - "POST /organizations"
      - "PATCH /organizations/{org_id}"
      - "POST /organizations/{org_id}/facilities"
      - "PATCH /organizations/{org_id}/facilities/{id}"
      - "POST /organizations/{org_id}/boundary-changes"
      - "POST /organizations/{org_id}/reporting-periods/{id}/cancel"
      - "POST /_clock/advance"
      - "POST /_events/emit"
    shared_operations:
      - "POST /organizations/{org_id}/reporting-periods (with DataSteward)"
      - "PATCH /organizations/{org_id}/reporting-periods/{id} (with DataSteward)"
      - "POST /organizations/{org_id}/reporting-periods/{id}/close (with DataSteward)"
      - "GET /organizations/{org_id}/audit-log (with Verifier)"

  - name: DataSteward
    description: "Enters activity data, manages reporting periods, sources, and reduction projects."
    identity: "opaque"
    exclusive_operations:
      - "POST /organizations/{org_id}/sources"
      - "PATCH /organizations/{org_id}/sources/{id}"
      - "POST /organizations/{org_id}/reporting-periods/{period_id}/activity-data"
      - "POST /organizations/{org_id}/projects"
      - "POST /organizations/{org_id}/projects/{id}/activate"
      - "POST /organizations/{org_id}/projects/{id}/complete"
      - "POST /organizations/{org_id}/projects/{id}/cancel"
      - "POST /organizations/{org_id}/reports"
      - "POST /organizations/{org_id}/reports/{id}/compile"
      - "POST /organizations/{org_id}/reports/{id}/reopen"
    shared_operations:
      - "POST /organizations/{org_id}/reporting-periods (with PlatformAdmin)"
      - "PATCH /organizations/{org_id}/reporting-periods/{id} (with PlatformAdmin)"
      - "POST /organizations/{org_id}/reporting-periods/{id}/close (with PlatformAdmin)"
      - "GET /organizations/{org_id}/* read-only (with all other roles)"

  - name: FactorManager
    description: "Curates the emission-factor library; approves DRAFT factor versions, retires unused drafts."
    identity: "opaque"
    exclusive_operations:
      - "POST /organizations/{org_id}/factors"
      - "POST /organizations/{org_id}/factors/{id}/approve"
      - "DELETE /organizations/{org_id}/factors/{id}"
    shared_operations:
      - "GET /organizations/{org_id}/factors (with DataSteward, Verifier)"
      - "GET /organizations/{org_id}/* read-only"

  - name: Verifier
    description: "Third-party / internal verifier; reviews compiled reports, signs off or requests revisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /organizations/{org_id}/reports/{id}/verify"
      - "POST /organizations/{org_id}/reports/{id}/request-revisions"
    shared_operations:
      - "GET /organizations/{org_id}/audit-log (with PlatformAdmin)"
      - "GET /organizations/{org_id}/* read-only"

  - name: Discloser
    description: "Publishes verified reports and manages external carbon-credit lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /organizations/{org_id}/credits"
      - "POST /organizations/{org_id}/credits/{id}/retire"
      - "POST /organizations/{org_id}/credits/{id}/transfer"
      - "POST /organizations/{org_id}/reports/{id}/publish"
    shared_operations:
      - "GET /organizations/{org_id}/* read-only"
