              payload: { eras_id: "E-5002", full_name: "Omar Diaz", medical_school_type: "IMG", visa_status: "NEEDS_J1", step2_score: 244, pipeline_program_alum: false, self_identified_group: "GROUP_B" }
              as: NrmpAdmin
              captures: { cand2_id: $.data.id }
            - call: "POST /applicants"
              payload: { eras_id: "E-5003", full_name: "Priya Rao", medical_school_type: "US_DO", visa_status: "US_CITIZEN", step2_score: 232, pipeline_program_alum: false }
              as: NrmpAdmin
              captures: { cand3_id: $.data.id }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
