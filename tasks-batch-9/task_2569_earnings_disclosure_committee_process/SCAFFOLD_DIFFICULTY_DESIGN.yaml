        distinguishing_aspect: |
          Three rules are violated by one request and the winner is the LOWEST priority number: the
          certification is still BLOCKED (priority 13), the cycle carries sub-certifications so the
          empty-scope rule at priority 42 is satisfied, and coverage stands at 54.55 rather than 100.00
          (priority 43). The response must be ERR_INVALID_STATE (409), not ERR_CERT_COVERAGE_INSUFFICIENT,
          even though the coverage shortfall is the reason the row never became ELIGIBLE. An
          implementation that checks the business gates before the state gate reports the wrong code.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 2, required_functions [FINANCE, LEGAL]) with a non-officer FINANCE member, a non-officer LEGAL member and one officer FINANCE member."
            - "A ReportingCycle in CERTIFICATION_OPEN whose CLOSE and REVIEW milestones are COMPLETE and which carries an APPROVED PERIODIC_FILING document."
            - "Two sub-certifications: a SUBMITTED REVENUE row weighted 30.00 and a PENDING LEGAL_CONTINGENCY row weighted 25.00, so certification_coverage_pct is 54.55."
