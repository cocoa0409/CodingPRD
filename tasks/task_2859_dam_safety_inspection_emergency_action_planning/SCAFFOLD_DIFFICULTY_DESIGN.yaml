              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 9000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-A" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a1_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /permits"
              payload: { dam_id: "${dam_id}", permit_type: "CONSTRUCTION", scope_description: "New outlet works and stilling basin.", estimated_project_cost_cents: 40000000, proposed_start_date: "2026-10-01T00:00:00Z" }
              as: DamOwner
              as_user_id: "${owner_id}"
              captures: { permit_id: "$.data.id", first_total: "$.data.total_fee_cents" }
            - call: "POST /permits/${permit_id}/assign-review"
              payload: { review_engineer_id: "${eng_a_id}" }
              as: ProgramAdmin
            - call: "POST /permits/${permit_id}/decision"
              payload: { decision: "RETURN", findings: "Stilling basin hydraulics not demonstrated for the PMF." }
