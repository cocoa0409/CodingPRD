            - "ProductionRun.${run_id}.final_unit_cost_usd_per_ton == 181.10"
            - "ProductionRun.${run_id}.consumed_gas_mmbtu == 0"
            - "ProductionOrder.${order_id}.security_status == EXEMPT"
            - "ProductionOrder.${order_id}.allocation_status == CONSUMED"
            - "ProductionOrder.${order_id}.produced_tons == 1000.000"
            - "ProductionOrder.${order_id}.landed_cost_usd == 144371.00"
            - "StorageAsset.${tank_id}.on_hand_tons == 1000.000"
            - "StorageAsset.${tank_id}.available_tons == 1000.000"
            - "CatalystCharge.${charge_id}.cumulative_operating_hours == 240"
            - "CatalystCharge.${charge_id}.activity_pct == 99.40"

      - name: catalyst_variants_diverge_on_identical_hours
        claim_type: variant_divergence
        grounds:
          - calculations.catalyst_activity_pct
          - entities.CatalystCharge.fields.calendar_activity_pct
          - entities.CatalystCharge.fields.activity_pct
        excluded_because:
          difficulty_instance: dual_variant_calc / catalyst_calendar_vs_severity_adjusted_activity_diverge_after_regeneration
          rationale: "That instance asserts both variants on identical hours before and after a regeneration, including the 5.93-point delta that puts SEVERITY_ADJUSTED above CALENDAR."

      - name: unit_cost_variant_selected_by_the_calling_transition
        claim_type: variant_selection
        grounds:
          - calculations.run_ammonia_unit_cost
          - endpoints[POST /nitrogen-ops/production-runs/{id}/approve]
          - endpoints[POST /nitrogen-ops/production-runs/{id}/complete]
        excluded_because:
          difficulty_instance: dual_variant_calc / run_unit_cost_provisional_month_match_vs_final_chronological_waterfall
          rationale: "PROVISIONAL is asserted on the approve response and FINAL on the complete response in that instance, including the non-destructive versus destructive lot treatment."

      - name: final_settlement_delta_reconciles_the_hedge_ledger
        claim_type: reconciliation
        grounds:
          - calculations.run_ammonia_unit_cost
          - entities.GasHedgeLot.fields.consumed_mmbtu
          - entities.Plant.fields.hedged_blend_usd_per_mmbtu
        excluded_because:
          difficulty_instance: compensating_invariant / hedged_gas_volume_conserved_across_complete_and_reopen
          rationale: "The switch away from the FINAL variant is asserted there as an exact ledger reversal — every drawn lot back to its contracted volume with the blend restored to 2.7143."

      - name: hedge_waterfall_fills_the_first_bucket_before_the_second
        claim_type: waterfall_allocation
        grounds:
          - calculations.run_ammonia_unit_cost
          - entities.GasHedgeLot.fields.remaining_mmbtu
        excluded_because:
          difficulty_instance: dual_variant_calc / run_unit_cost_provisional_month_match_vs_final_chronological_waterfall
          rationale: "That instance draws 165000 MMBtu across three lots in chronological order and asserts the per-lot remainders (0 / 0 / 185000) plus the spot top-up behaviour."

      - name: freight_surcharge_tier_boundaries_are_half_open
        claim_type: tiered_pricing
        grounds:
          - calculations.shipment_freight_total
          - entities.Shipment.fields.fuel_surcharge_usd
        excluded_because:
          difficulty_instance: combinatorial_formula / freight_surcharge_tier_selected_from_pre_surcharge_base
          rationale: "Tier selection from the pre-surcharge base — and the fact that crossing a boundary after the surcharge does not re-select — is the whole subject of that instance."

      - name: emissions_threshold_tested_at_the_permit_limit
        claim_type: threshold
        grounds:
          - calculations.emissions_rolling_30d
          - calculations.plant_operating_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / emissions_rolling_exactly_at_permit_limit_is_not_an_exceedance
          rationale: "Exactly-at-limit, just-over-limit and the resulting posture flip are all asserted there."

      - name: storage_aggregate_running_total_after_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.storage_position
          - entities.StorageAsset.fields.reserved_tons
        excluded_because:
          difficulty_instance: resource_temporal_overlap / storage_outbound_bookings_overlap_only_within_available_tonnage
          rationale: "The running reserved_tons total across successive bookings, and the negative available_tons it can legally produce, are asserted there."

      - name: posture_change_propagates_through_the_child_chain
        claim_type: constraint_propagation
        grounds:
          - calculations.plant_operating_posture
          - state_machines.ProductionRun.APPROVED_to_PLANNED
        excluded_because:
          difficulty_instance: transitive_cascade / outage_start_cascades_five_levels_to_storage_position
          rationale: "That instance follows one write through five levels of dependent state and asserts the chain reaches a fixed point with no further movement."

  # ===========================================================================
