            - "Household.${h5_id}.linked_member_count == 0"
            - "Household.${h5_id}.cross_banner_member_ids == []"
            - "Household.${h5_id}.aggregate_available_points == 0"
            - "FuelRedemption.${r8_id}.authorization_status == \"VOIDED\""
            - "GET /point-ledger-entries?member_id=${m8_id}&entry_type=REDEMPTION_RELEASE returns meta total_count == 1 and data[0].points_delta == 300"
            - "Member.${m8_id}.available_points == 300"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different priority pairs)
  #   * 42 (state) beats 72 (business_fiscal)      on POST /fuel-redemptions
  #   * 50 (business_safety) beats 62 (business_referential) on POST /point-transfers
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: frozen_household_outranks_insufficient_points_on_fuel_redemption
        grounds:
          - validations[priority=42]
          - validations[priority=72]
          - errors[ERR_HOUSEHOLD_FROZEN]
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: |
          Both rules are violated by one request: the acting member's household is
          FROZEN (priority 42, state) and the member has 0 of the 500 points asked
          for (priority 72, business_fiscal). Only ERR_HOUSEHOLD_FROZEN with HTTP
          409 may be returned; an implementation that checks the balance first
          answers ERR_INSUFFICIENT_POINTS with 422 and fails. This is the 42-vs-72
          pair on POST /fuel-redemptions, distinct from this rule's 50-vs-62 pair.
        test_recipe:
          setup:
            - "Banner B_PRI on defaults (min_points_per_redemption 100); cycles 2026-08 (OPEN) and 2026-09 exist; clock at 2026-08-05T10:00:00Z."
            - "Owned fuel center F9 ACTIVE under B_PRI."
            - "Member M9 with available_points 0 (no purchases at all)."
            - "Household H9 holding an ACTIVE PRIMARY link to M9, then manually frozen by a supervisor, so status is FROZEN with frozen_reason MANUAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "PRI", name: "Priority Banner" }
              as: ProgramAdmin
              captures: { bpr_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bpr_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cpr_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bpr_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cpr_sep_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bpr_id}", site_number: "F-009", site_type: "OWNED_FUEL_CENTER" }
              as: ProgramAdmin
              captures: { f9_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${bpr_id}", alt_id: "5550000009", card_number: "4000000000000009", full_name: "Ivy Frozen" }
              as: ProgramAdmin
              captures: { m9_id: $.data.id }
            - call: "POST /households"
              payload: { banner_id: "${bpr_id}", household_code: "HH-PRI-1" }
              as: LoyaltyAnalyst
              captures: { h9_id: $.data.id }
            - call: "POST /household-links"
              payload: { household_id: "${h9_id}", member_id: "${m9_id}", link_role: "PRIMARY" }
              as: LoyaltyAnalyst
              captures: { l9_id: $.data.id }
            - call: "POST /household-links/${l9_id}/activate"
              payload: {}
              as: LoyaltyAnalyst
            - call: "POST /households/${h9_id}/freeze"
              payload: {}
              as: LoyaltySupervisor
            - call: "GET /members/${m9_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${f9_id}"
              captures: { mv9: $.data.version }
          trigger:
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${m9_id}", site_id: "${f9_id}", alt_id_presented: "5550000009", points_committed: 500, expected_member_version: "${mv9}" }
              as: PumpTerminal
              as_user_id: "${f9_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err_id} == \"ERR_HOUSEHOLD_FROZEN\""
            - "${err_id} != \"ERR_INSUFFICIENT_POINTS\""
            - "Household.${h9_id}.status == \"FROZEN\" and Household.${h9_id}.frozen_reason == \"MANUAL\""
            - "GET /fuel-redemptions?member_id=${m9_id} returns meta total_count == 0"
            - "Member.${m9_id}.available_points == 0"
            - "Member.${m9_id}.version == ${mv9} (the rejected request advanced no version)"

      - name: transfer_fraud_lock_outranks_recipient_not_in_household
        grounds:
          - validations[priority=50]
          - validations[priority=62]
          - errors[ERR_TRANSFER_FRAUD_LOCK]
          - errors[ERR_RECIPIENT_NOT_IN_HOUSEHOLD]
        distinguishing_aspect: |
          One transfer violates both the safety lock (an OPEN RAPID_TRANSFER
          signal sits on the sender's household, priority 50) and referential
          membership (the recipient holds no ACTIVE link to that household,
          priority 62). Only ERR_TRANSFER_FRAUD_LOCK with HTTP 403 is correct.
          The signal weight is deliberately 10, far below freeze_threshold_score
          60, so the household stays ACTIVE and priority 42 cannot mask the pair.
          This is the 50-vs-62 pair on POST /point-transfers.
        test_recipe:
          setup:
            - "Banner B_TR on defaults (max_transfers_per_cycle 3, freeze_threshold_score 60); cycles 2026-08 (OPEN) and 2026-09 exist; clock at 2026-08-05T10:00:00Z."
            - "Grocery site G10; Member M10 with 300 accrued points; Member M11 with no household link at all."
            - "Household H10 holding an ACTIVE PRIMARY link to M10 and exactly one OPEN RAPID_TRANSFER signal of weight 10, so fraud_score is 10 and H10.status is ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "TR", name: "Transfer Banner" }
              as: ProgramAdmin
              captures: { btr_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${btr_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { ctr_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${btr_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { ctr_sep_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${btr_id}", site_number: "G-010", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g10_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${btr_id}", alt_id: "5550000010", card_number: "4000000000000010", full_name: "Jo Sender" }
              as: ProgramAdmin
              captures: { m10_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${btr_id}", alt_id: "5550000011", card_number: "4000000000000011", full_name: "Kim Outsider" }
              as: ProgramAdmin
              captures: { m11_id: $.data.id }
            - call: "POST /households"
              payload: { banner_id: "${btr_id}", household_code: "HH-TR-1" }
              as: LoyaltyAnalyst
              captures: { h10_id: $.data.id }
            - call: "POST /household-links"
              payload: { household_id: "${h10_id}", member_id: "${m10_id}", link_role: "PRIMARY" }
              as: LoyaltyAnalyst
              captures: { l10_id: $.data.id }
            - call: "POST /household-links/${l10_id}/activate"
              payload: {}
              as: LoyaltyAnalyst
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m10_id}", site_id: "${g10_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g10_id}"
              captures: { t10_id: $.data.id }
            - call: "POST /purchase-transactions/${t10_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g10_id}"
            - call: "POST /fraud-signals"
              payload: { household_id: "${h10_id}", signal_type: "RAPID_TRANSFER", severity_weight: 10 }
              as: LoyaltyAnalyst
              captures: { sig10_id: $.data.id }
          trigger:
            - call: "POST /point-transfers"
              payload: { member_id: "${m10_id}", recipient_member_id: "${m11_id}", points: 100 }
              as: Member
              as_user_id: "${m10_id}"
              captures: { err_id2: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err_id2} == \"ERR_TRANSFER_FRAUD_LOCK\""
            - "${err_id2} != \"ERR_RECIPIENT_NOT_IN_HOUSEHOLD\""
            - "Household.${h10_id}.status == \"ACTIVE\" and Household.${h10_id}.fraud_score == 10"
            - "GET /point-ledger-entries?member_id=${m10_id}&entry_type=TRANSFER_OUT returns meta total_count == 0"
            - "GET /point-ledger-entries?member_id=${m11_id}&entry_type=TRANSFER_IN returns meta total_count == 0"
            - "Member.${m10_id}.available_points == 300 and Member.${m11_id}.available_points == 0"

  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  #   * half-open promo window boundary  on POST /purchase-transactions/{id}/post
  #   * empty expiring-lot set (zero rows) on POST /point-cycles/{id}/close
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: promo_window_includes_starts_at_instant_and_excludes_ends_at_instant
        grounds:
          - calculations.promo_multiplier_stack
          - entities.PromoEvent.fields.starts_at
          - entities.PromoEvent.fields.ends_at
          - calculations.purchase_point_accrual
        distinguishing_aspect: |
          Two baskets differing only in transacted_at land on the two ends of the
          half-open window [starts_at, ends_at): the 2026-08-10T00:00:00Z basket
          earns the doubled 20 points, the 2026-08-20T00:00:00Z basket earns the
          base 10. A closed-interval implementation gives 20 for both and a
          fully-open one gives 10 for both, so the pair pins the boundary in both
          directions. The measured quantity is a timestamp-inclusion boundary.
        test_recipe:
          setup:
            - "Banner B_WIN on defaults; cycles 2026-08 (OPEN) and 2026-09 exist."
            - "Grocery site G12; Member M12 with zero points."
            - "ACTIVE promo P_WIN: multiplier 2, applies_to_categories [GROCERY], starts_at 2026-08-10T00:00:00Z, ends_at 2026-08-20T00:00:00Z, stack_priority 10."
            - "Two RECORDED baskets, each a single GROCERY line of 1000 cents, one transacted at 2026-08-10T00:00:00Z and one at 2026-08-20T00:00:00Z; logical clock at 2026-08-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "WIN", name: "Window Banner" }
              as: ProgramAdmin
              captures: { bw_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bw_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cw_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bw_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cw_sep_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bw_id}", site_number: "G-012", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g12_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${bw_id}", alt_id: "5550000012", card_number: "4000000000000012", full_name: "Lee Boundary" }
              as: ProgramAdmin
              captures: { m12_id: $.data.id }
            - call: "POST /promo-events"
              payload: { banner_id: "${bw_id}", promo_code: "P_WIN", multiplier: 2, applies_to_categories: ["GROCERY"], starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z", stack_priority: 10 }
              as: ProgramAdmin
              captures: { p_win_id: $.data.id }
            - call: "POST /promo-events/${p_win_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m12_id}", site_id: "${g12_id}", transacted_at: "2026-08-10T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 1000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g12_id}"
              captures: { t_start_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m12_id}", site_id: "${g12_id}", transacted_at: "2026-08-20T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 1000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g12_id}"
              captures: { t_end_id: $.data.id }
          trigger:
            - call: "POST /purchase-transactions/${t_start_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g12_id}"
              captures: { start_points: $.data.gross_points_awarded, start_promos: $.data.applied_promo_event_ids }
            - call: "POST /purchase-transactions/${t_end_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g12_id}"
              captures: { end_points: $.data.gross_points_awarded, end_promos: $.data.applied_promo_event_ids }
          assert:
            - "${start_points} == 20"
            - "${start_promos} == [\"${p_win_id}\"]"
            - "${end_points} == 10"
            - "${end_promos} == []"
            - "Member.${m12_id}.available_points == 30"
            - "Member.${m12_id}.lifetime_points == 30"

      - name: cycle_close_with_empty_expiring_lot_set_writes_zero_ledger_rows
        grounds:
          - calculations.point_expiry_sweep
          - state_machines.PointCycle.CLOSING_to_CLOSED
          - entities.PointCycle.fields.expired_points_total
          - entities.PointCycle.fields.rolled_over_points_total
        distinguishing_aspect: |
          The empty-set boundary of the sweep: the only lot in existence expires
          2026-09-30, one full cycle beyond the cycle being closed, so the
          expiring-lot set is empty and the close must write zero EXPIRY and zero
          ROLLOVER rows rather than a cosmetic 0-delta row. The measured quantity
          is a row count on an empty input set, and the endpoint under test is
          POST /point-cycles/{id}/close, not the accrual endpoint used by this
          rule's other instance.
        test_recipe:
          setup:
            - "Banner B_ZERO on defaults (rollover_cap_points 500); cycles 2026-08, 2026-09 and 2026-10 exist."
            - "Grocery site G13; Member M13 with one 226-point ACCRUAL lot earned in August whose lot_expires_at is 2026-09-30T23:59:59.999Z, and no redemptions."
            - "The 2026-08 cycle has been moved to CLOSING with the logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "ZERO", name: "Zero Sweep Banner" }
              as: ProgramAdmin
              captures: { bz_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bz_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cz_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bz_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cz_sep_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bz_id}", cycle_month: "2026-10", opens_at: "2026-10-01T00:00:00Z", closes_at: "2026-10-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cz_oct_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bz_id}", site_number: "G-013", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g13_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${bz_id}", alt_id: "5550000013", card_number: "4000000000000013", full_name: "Moe Zero" }
              as: ProgramAdmin
              captures: { m13_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m13_id}", site_id: "${g13_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 22600, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g13_id}"
              captures: { t13_id: $.data.id }
            - call: "POST /purchase-transactions/${t13_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g13_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /point-cycles/${cz_aug_id}/begin-close"
              payload: {}
              as: LoyaltySupervisor
          trigger:
            - call: "POST /point-cycles/${cz_aug_id}/close"
              payload: {}
              as: LoyaltySupervisor
              captures: { z_expired: $.data.expired_points_total, z_rolled: $.data.rolled_over_points_total, z_swept: $.data.swept_member_count, z_closed_at: $.data.closed_at }
          assert:
            - "${z_expired} == 0"
            - "${z_rolled} == 0"
            - "${z_swept} == 0"
            - "${z_closed_at} == \"2026-09-01T00:00:00Z\""
            - "PointCycle.${cz_aug_id}.status == \"CLOSED\""
            - "GET /point-ledger-entries?point_cycle_id=${cz_aug_id}&entry_type=EXPIRY returns meta total_count == 0"
            - "GET /point-ledger-entries?point_cycle_id=${cz_aug_id}&entry_type=ROLLOVER returns meta total_count == 0"
            - "GET /point-ledger-entries?member_id=${m13_id} returns meta total_count == 1"
            - "Member.${m13_id}.available_points == 226"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  #   * FuelRedemption gated by HouseholdLink.status
  #   * PurchaseTransaction posting gated by Site.status
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cross_banner_redemption_gated_by_household_link_active_state
        grounds:
          - validations[priority=54]
          - state_machines.HouseholdLink.ACTIVE_to_SUSPENDED
          - entities.Household.fields.cross_banner_member_ids
          - errors[ERR_CROSS_BANNER_LINK_REQUIRED]
        distinguishing_aspect: |
          Nothing about the member, the site or the point balance changes between
          the two attempts — only HouseholdLink.status moves ACTIVE -> SUSPENDED,
          and that alone flips the identical cross-banner redemption from 201 to
          422 ERR_CROSS_BANNER_LINK_REQUIRED. The pair also pins that SUSPENDED,
          unlike REVOKED, does not void the already-AUTHORIZED redemption. The
          gating pair here is FuelRedemption x HouseholdLink.
