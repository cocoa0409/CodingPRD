          - entities.Dealer.fields.status
          - endpoints.POST_dealers_id_status
          - state_machines.RetailDelivery.REPORTED_to_VALIDATED
        distinguishing_aspect: |
          A different entity pair (RetailDelivery, Dealer) and a different direction of dependency:
          here the blocking entity is the PARENT of the write, not a sibling reference, and the
          gate is a plain status field with no state machine of its own. SUSPENDED is included as
          the discriminating middle state — it does NOT block reporting or claiming (only
          disbursement), so a naive "status != ACTIVE" implementation fails this instance.
        test_recipe:
          setup:
            - "One ACTIVE CUSTOMER_CASH program STD-CASH, per_unit_amount_cents 125000, budget 40000000, window [2026-08-01, 2026-09-01), MX5/WEST/CASH eligibility."
            - "Dealer D-870, initially ACTIVE, region WEST."
            - "The dealer is walked ACTIVE -> SUSPENDED -> TERMINATED, reporting one delivery in each of the first two standings."
            - "Logical clock pinned to 2026-08-12 for every report so back_dated_flag stays false throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "D-870", name: "Ridgemont Auto Sales", region_code: "WEST", historical_volume_units: 3, market_opportunity_bps: 0 }
