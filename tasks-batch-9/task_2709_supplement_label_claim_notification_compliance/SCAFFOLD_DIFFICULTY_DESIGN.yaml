            - call: "POST /supplement-compliance/substantiation-dossiers"
              payload: { claim_id: "${claim_a_id}", expected_claim_version: "${claim_a_v}", dossier_summary: "Immune support evidence package A" }
              as: RegulatoryAffairsSpecialist
