        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): one markdown request violates priority 8
          (ERR_LOT_NOT_PRICEABLE, 409) because the lot is WITHDRAWN and priority 42
          (ERR_PRICE_BELOW_COST_FLOOR, 422) because override_price_cents 160 is under the 168-cent
