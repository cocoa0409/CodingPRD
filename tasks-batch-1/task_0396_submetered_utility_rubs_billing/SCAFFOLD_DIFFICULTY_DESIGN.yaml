# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Submetered Utility & RUBS Tenant Billing — Expert band
# Grounds reference ONLY elements declared in SCAFFOLD.yaml §1.1–§1.7.
# Worked numeric literals were executed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- instance 1: VendorBill recovery — cap ceiling vs common-area deduction
      - name: vendor_recoverable_cap_binds_vs_deduction_binds
        grounds:
          - calculations.vendor_recoverable
          - state_machines.VendorBill.RECEIVED_to_APPROVED
          - entities.VendorBill.fields.recoverable_cents
          - entities.Property.fields.recovery_cap_pct
          - entities.Property.fields.common_area_pct
        distinguishing_aspect: |
          Same approval formula on the VendorBill cost-accounting domain yields a
          DIFFERENT recoverable_cents depending on which ceiling binds: state-law
          cap (recoverable = cap_cents) vs common-area deduction (recoverable =
          total - common_area). This is the recovery-engine domain, distinct from
          the allocation-engine domain in instance 2.
        test_recipe:
          setup:
            - "Property P_cap with recovery_cap_pct=0.85, common_area_pct=0.10."
            - "Property P_ded with recovery_cap_pct=0.95, common_area_pct=0.10."
            - "Each has a WATER/CONSUMPTION Utility and a RECEIVED VendorBill of total_cost_cents=100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "P_cap", state_code: "CA", recovery_cap_pct: 0.85, common_area_pct: 0.10 }
              as: PropertyManager
              captures: { p_cap_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${p_cap_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { u_cap_id: $.data.id }
            - call: "POST /vendor-bills"
              payload: { property_id: "${p_cap_id}", utility_id: "${u_cap_id}", period_label: "2026-06", total_cost_cents: 100000 }
              as: PropertyManager
              captures: { vb_cap_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "P_ded", state_code: "CA", recovery_cap_pct: 0.95, common_area_pct: 0.10 }
              as: PropertyManager
              captures: { p_ded_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${p_ded_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { u_ded_id: $.data.id }
            - call: "POST /vendor-bills"
              payload: { property_id: "${p_ded_id}", utility_id: "${u_ded_id}", period_label: "2026-06", total_cost_cents: 100000 }
              as: PropertyManager
              captures: { vb_ded_id: $.data.id }
          trigger:
            - call: "POST /vendor-bills/${vb_cap_id}/approve"
              payload: {}
              as: PropertyManager
            - call: "POST /vendor-bills/${vb_ded_id}/approve"
              payload: {}
              as: PropertyManager
          assert:
            - "VendorBill ${vb_cap_id}.common_area_cents == 10000"
            - "VendorBill ${vb_cap_id}.cap_cents == 85000"
            - "VendorBill ${vb_cap_id}.recoverable_cents == 85000  # cap binds (90000 > 85000)"
            - "VendorBill ${vb_ded_id}.common_area_cents == 10000"
            - "VendorBill ${vb_ded_id}.cap_cents == 95000"
            - "VendorBill ${vb_ded_id}.recoverable_cents == 90000  # deduction binds (90000 <= 95000)"

      # --- instance 2: allocation — consumption-weighted vs occupant-ratio (RUBS)
      - name: consumption_vs_rubs_allocation_diverge_same_pool
        grounds:
          - calculations.consumption_allocation
          - calculations.rubs_allocation
          - state_machines.BillingCycle.READS_LOCKED_to_ALLOCATED
          - entities.TenantStatement.fields.utility_charge_cents
          - entities.Utility.fields.allocation_method
        distinguishing_aspect: |
          The SAME recoverable_cents pool (10000) over the SAME two units splits
          DIFFERENTLY: CONSUMPTION weights by metered MeterRead.consumption (2 vs 1
          -> 6667/3333) while RUBS ignores meters entirely and weights by Lease
          occupant_count (3 vs 2 -> 6000/4000). This is the BillingCycle allocation
          domain, distinct from the VendorBill recovery domain in instance 1.
        test_recipe:
          setup:
            - "CONSUMPTION property: two units (A consumption 2, B consumption 1), recoverable_cents=10000 -> A=6667, B=3333."
            - "RUBS property: two units (A occupant_count 3, B occupant_count 2), recoverable_cents=10000 -> A=6000, B=4000."
          setup_api_calls:
            # ---------- CONSUMPTION property ----------
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "Pc", state_code: "CA", recovery_cap_pct: 0.85, common_area_pct: 0.10 }
              as: PropertyManager
              captures: { pc_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pc_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { uc_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pc_id}", unit_number: "A", square_feet: 800 }
              as: PropertyManager
              captures: { ca_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pc_id}", unit_number: "B", square_feet: 800 }
              as: PropertyManager
              captures: { cb_id: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${ca_id}", property_id: "${pc_id}", tenant_user_id: "tA", occupant_count: 1, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { la_id: $.data.id }
            - call: "POST /leases/${la_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${cb_id}", property_id: "${pc_id}", tenant_user_id: "tB", occupant_count: 1, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { lb_id: $.data.id }
            - call: "POST /leases/${lb_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /meters"
              payload: { property_id: "${pc_id}", utility_id: "${uc_id}", serial_number: "MA" }
              as: PropertyManager
              captures: { ma_id: $.data.id }
            - call: "POST /meters/${ma_id}/assign"
              payload: { unit_id: "${ca_id}", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /meters"
              payload: { property_id: "${pc_id}", utility_id: "${uc_id}", serial_number: "MB" }
              as: PropertyManager
              captures: { mb_id: $.data.id }
            - call: "POST /meters/${mb_id}/assign"
              payload: { unit_id: "${cb_id}", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pc_id}", utility_id: "${uc_id}", period_label: "2026-06", total_cost_cents: 11765 }
              as: PropertyManager
              captures: { vbc_id: $.data.id }
            - call: "POST /vendor-bills/${vbc_id}/approve"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles"
              payload: { property_id: "${pc_id}", utility_id: "${uc_id}", vendor_bill_id: "${vbc_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { bcc_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${ma_id}", property_id: "${pc_id}", period_label: "2026-06", reading_value: 2 }
              as: MeterTech
              captures: { ra_id: $.data.id }
            - call: "POST /meter-reads/${ra_id}/submit"
              payload: {}
              as: MeterTech
            - call: "POST /meter-reads/${ra_id}/validate"
              payload: {}
              as: PropertyManager
            - call: "POST /meter-reads"
              payload: { meter_id: "${mb_id}", property_id: "${pc_id}", period_label: "2026-06", reading_value: 1 }
              as: MeterTech
              captures: { rb_id: $.data.id }
            - call: "POST /meter-reads/${rb_id}/submit"
              payload: {}
              as: MeterTech
            - call: "POST /meter-reads/${rb_id}/validate"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${bcc_id}/lock-reads"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${bcc_id}/allocate"
              payload: {}
              as: PropertyManager
            # ---------- RUBS property ----------
            - call: "POST /properties"
              payload: { name: "Pr", state_code: "CA", recovery_cap_pct: 0.85, common_area_pct: 0.10 }
              as: PropertyManager
              captures: { pr_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pr_id}", utility_type: "WATER", allocation_method: "RUBS", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { ur_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pr_id}", unit_number: "A", square_feet: 800 }
              as: PropertyManager
              captures: { ra_unit_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pr_id}", unit_number: "B", square_feet: 800 }
              as: PropertyManager
              captures: { rb_unit_id: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${ra_unit_id}", property_id: "${pr_id}", tenant_user_id: "rA", occupant_count: 3, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { rla_id: $.data.id }
            - call: "POST /leases/${rla_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${rb_unit_id}", property_id: "${pr_id}", tenant_user_id: "rB", occupant_count: 2, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { rlb_id: $.data.id }
            - call: "POST /leases/${rlb_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pr_id}", utility_id: "${ur_id}", period_label: "2026-06", total_cost_cents: 11765 }
              as: PropertyManager
              captures: { vbr_id: $.data.id }
            - call: "POST /vendor-bills/${vbr_id}/approve"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles"
              payload: { property_id: "${pr_id}", utility_id: "${ur_id}", vendor_bill_id: "${vbr_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { bcr_id: $.data.id }
            - call: "POST /billing-cycles/${bcr_id}/lock-reads"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${bcr_id}/allocate"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /billing-cycles/${bcc_id}/issue-statements"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${bcr_id}/issue-statements"
              payload: {}
              as: PropertyManager
          assert:
            - "CONSUMPTION: TenantStatement for unit ${ca_id} has utility_charge_cents == 6667"
            - "CONSUMPTION: TenantStatement for unit ${cb_id} has utility_charge_cents == 3333"
            - "RUBS: TenantStatement for unit ${ra_unit_id} has utility_charge_cents == 6000"
            - "RUBS: TenantStatement for unit ${rb_unit_id} has utility_charge_cents == 4000"
            - "Both allocate exactly recoverable_cents=10000; consumption split != RUBS split for the same pool"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- instance 1: mode (a) — late_fee, >=3 inputs with nested min/max ladder
      - name: late_fee_nested_min_max_ladder
        grounds:
          - calculations.late_fee
          - state_machines.TenantStatement.payment_UNPAID_to_DELINQUENT
          - entities.TenantStatement.fields.late_fee_cents
        distinguishing_aspect: |
          MODE (a): late_fee combines >=3 inputs (LATE_FEE_PCT, LATE_FEE_FLAT_CENTS,
          LATE_FEE_MAX_CENTS, LATE_FEE_MAX_PCT) through a fixed nested max/min ladder;
          balance 42501 selects the pct-base rung (2126) where neither flat floor,
          absolute cap, nor state-law pct cap binds. Distinct mode from instance 2's
          rounding-order axis.
        test_recipe:
          setup:
            - "An ISSUED, UNPAID TenantStatement with balance_due_cents == 42501."
            - "Clock advanced past due_date + GRACE_DAYS so assess-late-fee is permitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "PF", state_code: "CA", recovery_cap_pct: 0.85, common_area_pct: 0.00 }
              as: PropertyManager
              captures: { pf_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pf_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL", monthly_admin_fee_cents: 0 }
              as: PropertyManager
              captures: { uf_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pf_id}", unit_number: "F1", square_feet: 800 }
              as: PropertyManager
              captures: { fu_id: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${fu_id}", property_id: "${pf_id}", tenant_user_id: "tF", occupant_count: 1, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { fl_id: $.data.id }
            - call: "POST /leases/${fl_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /meters"
              payload: { property_id: "${pf_id}", utility_id: "${uf_id}", serial_number: "FS" }
              as: PropertyManager
              captures: { fm_id: $.data.id }
            - call: "POST /meters/${fm_id}/assign"
              payload: { unit_id: "${fu_id}", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pf_id}", utility_id: "${uf_id}", period_label: "2026-06", total_cost_cents: 50002 }
              as: PropertyManager
              captures: { fvb_id: $.data.id }
            - call: "POST /vendor-bills/${fvb_id}/approve"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles"
              payload: { property_id: "${pf_id}", utility_id: "${uf_id}", vendor_bill_id: "${fvb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { fbc_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${fm_id}", property_id: "${pf_id}", period_label: "2026-06", reading_value: 100 }
              as: MeterTech
              captures: { fr_id: $.data.id }
            - call: "POST /meter-reads/${fr_id}/submit"
              payload: {}
              as: MeterTech
            - call: "POST /meter-reads/${fr_id}/validate"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${fbc_id}/lock-reads"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${fbc_id}/allocate"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${fbc_id}/issue-statements"
              payload: {}
              as: PropertyManager
            - call: "GET /statements"
              payload: { billing_cycle_id: "${fbc_id}" }
              as: PropertyManager
              captures: { fst_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /statements/${fst_id}/assess-late-fee"
              payload: {}
              as: PropertyManager
          assert:
            - "TenantStatement ${fst_id}.balance_due_cents was 42501 before assessment (single unit gets full recoverable_cents = floor(50002*0.85)=42501; common_area_pct=0 -> deduction 0)"
            - "TenantStatement ${fst_id}.late_fee_cents == 2126  # ceil(0.05*42501)=2126, above 500 flat, below 5000 cap, below floor(0.10*42501)=4250"
            - "TenantStatement ${fst_id}.payment_status == DELINQUENT"

      # --- instance 2: mode (b) — allocation rounding ORDER (floor-then-distribute)
      - name: allocation_rounding_order_floor_then_largest_remainder
        grounds:
          - calculations.consumption_allocation
          - entities.TenantStatement.fields.utility_charge_cents
          - state_machines.BillingCycle.READS_LOCKED_to_ALLOCATED
        distinguishing_aspect: |
          MODE (b): the pinned order is "floor each unit's share, THEN distribute the
          leftover cents one-by-one by (consumption DESC, created_at ASC)" — NOT "sum
          raw shares then floor". With recoverable 10000 and consumptions 2/1 the
          floors are 6666/3333 (sum 9999) and the single remainder cent goes to the
          higher-consumption unit -> 6667/3333; a sum-then-round reading would give
          6667/3333 vs 6666/3334, a different cents split. Distinct mode from
          instance 1's input-interaction axis.
        test_recipe:
          setup:
            - "CONSUMPTION property, two units A (consumption 2) and B (consumption 1), recoverable_cents=10000."
            - "Remainder of 1 cent after flooring; tie-break order is (consumption DESC, created_at ASC)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "PR2", state_code: "CA", recovery_cap_pct: 0.85, common_area_pct: 0.10 }
              as: PropertyManager
              captures: { pr2_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pr2_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { ur2_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pr2_id}", unit_number: "A", square_feet: 800 }
              as: PropertyManager
              captures: { a2_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pr2_id}", unit_number: "B", square_feet: 800 }
              as: PropertyManager
              captures: { b2_id: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${a2_id}", property_id: "${pr2_id}", tenant_user_id: "a2", occupant_count: 1, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { la2_id: $.data.id }
            - call: "POST /leases/${la2_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${b2_id}", property_id: "${pr2_id}", tenant_user_id: "b2", occupant_count: 1, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { lb2_id: $.data.id }
            - call: "POST /leases/${lb2_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /meters"
              payload: { property_id: "${pr2_id}", utility_id: "${ur2_id}", serial_number: "A2" }
              as: PropertyManager
              captures: { ma2_id: $.data.id }
            - call: "POST /meters/${ma2_id}/assign"
              payload: { unit_id: "${a2_id}", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /meters"
              payload: { property_id: "${pr2_id}", utility_id: "${ur2_id}", serial_number: "B2" }
              as: PropertyManager
              captures: { mb2_id: $.data.id }
            - call: "POST /meters/${mb2_id}/assign"
              payload: { unit_id: "${b2_id}", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pr2_id}", utility_id: "${ur2_id}", period_label: "2026-06", total_cost_cents: 11765 }
              as: PropertyManager
              captures: { vb2_id: $.data.id }
            - call: "POST /vendor-bills/${vb2_id}/approve"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles"
              payload: { property_id: "${pr2_id}", utility_id: "${ur2_id}", vendor_bill_id: "${vb2_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { bc2_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${ma2_id}", property_id: "${pr2_id}", period_label: "2026-06", reading_value: 2 }
              as: MeterTech
              captures: { rda_id: $.data.id }
            - call: "POST /meter-reads/${rda_id}/submit"
              payload: {}
              as: MeterTech
            - call: "POST /meter-reads/${rda_id}/validate"
              payload: {}
              as: PropertyManager
            - call: "POST /meter-reads"
              payload: { meter_id: "${mb2_id}", property_id: "${pr2_id}", period_label: "2026-06", reading_value: 1 }
              as: MeterTech
              captures: { rdb_id: $.data.id }
            - call: "POST /meter-reads/${rdb_id}/submit"
              payload: {}
              as: MeterTech
            - call: "POST /meter-reads/${rdb_id}/validate"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${bc2_id}/lock-reads"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /billing-cycles/${bc2_id}/allocate"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${bc2_id}/issue-statements"
              payload: {}
              as: PropertyManager
          assert:
            - "TenantStatement for unit ${a2_id} (consumption 2): utility_charge_cents == 6667  # 6666 floor + 1 remainder"
            - "TenantStatement for unit ${b2_id} (consumption 1): utility_charge_cents == 3333  # 3333 floor + 0 remainder"
            - "Sum of utility_charge_cents == 10000 (== recoverable_cents); no cent lost or created by the rounding order"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- instance 1: MeterRead re-read CYCLE
      - name: meter_read_re_read_cycle_flagged_rereadrequested_submitted
        grounds:
          - state_machines.MeterRead.SUBMITTED_to_FLAGGED
          - state_machines.MeterRead.FLAGGED_to_RE_READ_REQUESTED
          - state_machines.MeterRead.RE_READ_REQUESTED_to_SUBMITTED
          - entities.MeterRead.fields.re_read_count
        distinguishing_aspect: |
          MeterRead is a CYCLE, not a linear pipeline: SUBMITTED -> FLAGGED ->
          RE_READ_REQUESTED -> SUBMITTED returns to a previously-visited state and
          re_read_count increments each loop. This non-linear machine lives on the
          MeterRead entity, distinct from instance 2's parallel-dimension machine on
          TenantStatement.
        test_recipe:
          setup:
            - "A SUBMITTED MeterRead in an OPEN BillingCycle that the PM flags."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
