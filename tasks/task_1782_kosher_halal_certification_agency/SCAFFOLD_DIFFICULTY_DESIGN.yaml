  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ingredient_change_notice_reapproval_cycle
        grounds:
          - state_machines.Ingredient.APPROVED_to_CHANGE_PENDING
          - state_machines.Ingredient.CHANGE_PENDING_to_UNDER_REVIEW
          - state_machines.Ingredient.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "Cyclic machine on Ingredient (distinct from the Certificate cycle and EquipmentLine parallel dimensions in the sibling instances): APPROVED -> CHANGE_PENDING -> UNDER_REVIEW -> APPROVED -> CHANGE_PENDING is traversed twice, proving the loop (not a one-way pipeline) and that re-approval after a change notice is repeatable."
        test_recipe:
          setup:
            - "Client exists; ingredient ing (PLANT) has reached APPROVED once via start-review + approve"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Cycle Co", certification_scheme: "KOSHER", contact_email: "c@x.com" }, as: AccountManager, captures: { cC: $.data.id } }
            - { call: "POST /api/ingredients", payload: { client_id: "${cC}", name: "IngC1", manufacturer: "M1", source_category: "PLANT" }, as: ClientContact, as_user_id: "${cC}", captures: { iC1: $.data.id } }
            - { call: "POST /api/ingredients/${iC1}/start-review", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${iC1}/approve", as: CertificationReviewer }
          trigger:
            - { call: "POST /api/ingredients/${iC1}/change-notices", payload: { change_summary: "supplier plant move" }, as: ClientContact, as_user_id: "${cC}" }
            - { call: "POST /api/ingredients/${iC1}/resubmit", as: ClientContact, as_user_id: "${cC}" }
            - { call: "POST /api/ingredients/${iC1}/approve", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${iC1}/change-notices", payload: { change_summary: "second formulation tweak" }, as: ClientContact, as_user_id: "${cC}", captures: { iC1_state: $.data.status } }
          assert:
            - "After notice 1: status == CHANGE_PENDING and change_summary == 'supplier plant move'"
            - "After resubmit: status == UNDER_REVIEW"
            - "After re-approve: status == APPROVED"
            - "Second change-notice succeeds (loop is cyclic): status == CHANGE_PENDING and change_summary == 'second formulation tweak'"

      - name: certificate_suspend_reinstate_cycle_terminal_lockdown
        grounds:
          - state_machines.Certificate.ACTIVE_to_SUSPENDED
          - state_machines.Certificate.SUSPENDED_to_ACTIVE
          - state_machines.Certificate.SUSPENDED_to_REVOKED
        distinguishing_aspect: "Cyclic machine on Certificate (distinct entity from Ingredient): ACTIVE -> SUSPENDED -> ACTIVE -> SUSPENDED -> REVOKED with client status bubbling (CERTIFIED -> SUSPENDED -> CERTIFIED -> SUSPENDED) at every hop, and REVOKED terminal lockdown rejects a further reinstate with ERR_CERTIFICATE_INVALID_STATE."
        test_recipe:
          setup:
            - "Fully certified client: facility APPROVED, agreement ACTIVE, annual fee PAID by am-1, certificate ACTIVE (client CERTIFIED), no findings, no overdue invoices"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Cyc Cert Co", certification_scheme: "KOSHER", contact_email: "cc@x.com" }, as: AccountManager, captures: { cX: $.data.id } }
            - { call: "POST /api/clients/${cX}/submit-application", as: ClientContact, as_user_id: "${cX}", captures: { cX_v: $.data.version } }
            - { call: "POST /api/facilities", payload: { client_id: "${cX}", name: "X Plant", address: "6 Rd", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cX}", captures: { fX: $.data.id } }
            - { call: "POST /api/equipment-lines", payload: { facility_id: "${fX}", designation: "L1" }, as: ClientContact, as_user_id: "${cX}", captures: { eX: $.data.id } }
            - { call: "POST /api/equipment-lines/${eX}/assess", payload: { dedication_status: "DEDICATED" }, as: CertificationReviewer }
            - { call: "POST /api/visits", payload: { facility_id: "${fX}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: AccountManager, captures: { vX: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vX}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vX}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/facilities/${fX}/approve", as: CertificationReviewer }
            - { call: "POST /api/agreements", payload: { client_id: "${cX}", scheme: "KOSHER", billing_cycle: "ANNIVERSARY", term_start_date: "2026-04-01", per_product_fee_cents: 73000, expected_client_version: "${cX_v}" }, as: AccountManager, captures: { aX: $.data.id } }
            - { call: "POST /api/agreements/${aX}/activate", as: AccountManager }
            - { call: "POST /api/invoices", payload: { client_id: "${cX}", invoice_type: "ANNUAL_CERTIFICATION", agreement_id: "${aX}" }, as: AccountManager, captures: { invX: $.data.id } }
            - { call: "POST /api/invoices/${invX}/record-payment", as: AccountManager, as_user_id: "am-1" }
            - { call: "POST /api/ingredients", payload: { client_id: "${cX}", name: "IngX1", manufacturer: "M1", source_category: "PLANT" }, as: ClientContact, as_user_id: "${cX}", captures: { iX1: $.data.id } }
            - { call: "POST /api/ingredients/${iX1}/start-review", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${iX1}/approve", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${cX}", brand: "BX", name: "PX1", ingredient_ids: ["${iX1}"] }, as: ClientContact, as_user_id: "${cX}", captures: { pX1: $.data.id } }
            - { call: "POST /api/products/${pX1}/submit-review", as: ClientContact, as_user_id: "${cX}" }
            - { call: "POST /api/products/${pX1}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/certificates", payload: { client_id: "${cX}", scheme: "KOSHER", term_type: "ANNUAL", facility_ids: ["${fX}"], product_ids: ["${pX1}"] }, as: CertificateOfficer, captures: { certX: $.data.id } }
            - { call: "POST /api/certificates/${certX}/issue", as: CertificateOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /api/certificates/${certX}/suspend", as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "POST /api/certificates/${certX}/reinstate", as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "POST /api/certificates/${certX}/suspend", as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "POST /api/certificates/${certX}/revoke", as: CertificateOfficer, as_user_id: "co-1" }
            - { call: "POST /api/certificates/${certX}/reinstate", as: CertificateOfficer, as_user_id: "co-1", captures: { errX: $.data.error_id } }
          assert:
            - "After suspend 1: certificate SUSPENDED and client SUSPENDED (bubble-up on zero ACTIVE)"
            - "After reinstate: certificate ACTIVE (valid_until unchanged) and client CERTIFIED (cycle closed)"
            - "After suspend 2 + revoke: certificate REVOKED and client SUSPENDED"
            - "Reinstate on REVOKED -> errX == ERR_CERTIFICATE_INVALID_STATE (terminal lockdown)"

      - name: equipment_line_parallel_dedication_kosherization_dimensions
        grounds:
          - state_machines.EquipmentLine
          - entities.EquipmentLine.fields.dedication_status
          - entities.EquipmentLine.fields.kosherization_state
        distinguishing_aspect: "Parallel state dimensions on one entity (distinct non-linear shape from the Ingredient and Certificate cycles): dedication_status stays pinned at SHARED while kosherization_state independently cycles NONE -> EXPIRED -> VALID -> COMPROMISED -> VALID, and kosherized_valid_until is recomputed per kosherization event."
        test_recipe:
          setup:
            - "Client + facility; line L created (UNASSESSED / NONE); facility taken to APPROVED (line assessed SHARED first, then INITIAL visit completed; EXPIRED lines do not block approval, only COMPROMISED ones do)"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Equip Co", certification_scheme: "KOSHER", contact_email: "e@x.com" }, as: AccountManager, captures: { cE: $.data.id } }
            - { call: "POST /api/facilities", payload: { client_id: "${cE}", name: "E Plant", address: "7 Rd", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cE}", captures: { fE: $.data.id } }
            - { call: "POST /api/equipment-lines", payload: { facility_id: "${fE}", designation: "L1" }, as: ClientContact, as_user_id: "${cE}", captures: { eE: $.data.id } }
            - { call: "POST /api/equipment-lines/${eE}/assess", payload: { dedication_status: "SHARED" }, as: CertificationReviewer }
            - { call: "POST /api/visits", payload: { facility_id: "${fE}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: AccountManager, captures: { vE: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vE}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vE}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/facilities/${fE}/approve", as: CertificationReviewer }
          trigger:
            - { call: "POST /api/equipment-lines/${eE}/assess", payload: { dedication_status: "DEDICATED" }, as: CertificationReviewer, captures: { errE1: $.data.error_id } }
            - { call: "POST /api/equipment-lines/${eE}/kosherization-events", as: FieldSupervisor, as_user_id: "sup-1", captures: { kv1: $.data.kosherized_valid_until } }
            - { call: "POST /api/equipment-lines/${eE}/report-compromise", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/equipment-lines/${eE}/kosherization-events", as: FieldSupervisor, as_user_id: "sup-1", captures: { kv2: $.data.kosherized_valid_until } }
          assert:
            - "After assess SHARED: dedication_status == SHARED and kosherization_state == EXPIRED (NONE -> EXPIRED side effect for SHARED lines)"
            - "errE1 == ERR_EQUIPMENT_LINE_INVALID_STATE (re-assess of an assessed line rejected)"
            - "After kosherize 1: dedication_status STILL == SHARED (dimension 1 untouched), kosherization_state == VALID, kv1 == 2026-06-04T10:00:00Z (clock 2026-06-01T10:00:00Z + 72h)"
            - "After report-compromise: dedication_status == SHARED, kosherization_state == COMPROMISED, kosherized_valid_until == null"
            - "After kosherize 2: kosherization_state == VALID again and kv2 == 2026-06-04T10:00:00Z (cycle on dimension 2)"

