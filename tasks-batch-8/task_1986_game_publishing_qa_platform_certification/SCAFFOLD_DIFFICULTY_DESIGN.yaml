            - "8h assignment at cumulative 40 == capacity is CREATED (equality allowed)"
            - "further 1h assignment (41 > 40) fails: error_id == ERR_VENDOR_CAPACITY_EXCEEDED, http 409"
            - "vendor.committed_hours_current_week == 40 and available_hours_current_week == 0"

  # ---------------------------------------------------------------- rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: package_create_requires_candidate_build
        grounds:
          - state_machines.SubmissionPackage
          - state_machines.Build.TEST_PASSED_to_CANDIDATE
          - errors[ERR_BUILD_NOT_CANDIDATE]
        distinguishing_aspect: |
          Entity pair SubmissionPackage -> Build: assembly is legal only while the
          referenced build is CANDIDATE; a TEST_PASSED build rejects the create with
          ERR_BUILD_NOT_CANDIDATE, and the same create succeeds after the build's
          promotion. Different entity pair from
          window_confirm_requires_cert_approved_title (ReleaseWindow -> GameTitle).
        test_recipe:
          setup:
            - "Title T (PS5) IN_DEVELOPMENT; plan APPROVED; build B1 in TEST_PASSED (deliberately not promoted)"
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "XDEP-BLD", name: "Xdep Bld", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 500000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorD", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b1}", test_plan_id: "${pid}", expected_title_version: "${tv}" }
              as: CertificationLead
              captures: { err: $.data.error_id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv2: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b1}", test_plan_id: "${pid}", expected_title_version: "${tv2}" }
              as: CertificationLead
              captures: { pkg: $.data.id, rd: $.data.round }
          assert:
            - "first create (build TEST_PASSED): error_id == ERR_BUILD_NOT_CANDIDATE, http 409"
            - "after build promotion to CANDIDATE, the identical create succeeds: round == 1"
            - "plan.status == LOCKED after the successful create (GET /qa-cert/test-plans/${pid})"

      - name: window_confirm_requires_cert_approved_title
        grounds:
          - state_machines.ReleaseWindow.RESERVED_to_CONFIRMED
          - state_machines.GameTitle.CERTIFICATION_to_CERT_APPROVED
          - errors[ERR_TITLE_NOT_CERT_APPROVED]
          - calculations.window_demand_fee
        distinguishing_aspect: |
          Entity pair ReleaseWindow -> GameTitle: a LAUNCH window cannot CONFIRM
          while its title is CERTIFICATION (ERR_TITLE_NOT_CERT_APPROVED); after the
          title earns CERT_APPROVED (driven by an APPROVED package) the same confirm
          succeeds and charges 40000 cents (8h, LOW tier). Different entity pair from
          package_create_requires_candidate_build (SubmissionPackage -> Build).
        test_recipe:
          setup:
            - "Title T (PS5), budget 1000000, advanced to CERTIFICATION"
            - "W: LAUNCH window PS5 [2026-08-10T09:00Z, 2026-08-10T17:00Z) RESERVED (created while clock is the 2026-08-01 default — start strictly in the future)"
            - "Then the full approved-package chain runs (plan, build, ESRB rating, checklist, submit Monday 2026-08-03T10:00:00Z, approve by a different user) and the title reaches CERT_APPROVED"
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "XDEP-WIN", name: "Xdep Win", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "CERTIFICATION" }, as: ReleaseManager }
            - call: "POST /qa-cert/release-windows"
              payload: { title_id: "${tid}", platform_code: "PS5", kind: "LAUNCH", start_utc: "2026-08-10T09:00:00Z", end_utc: "2026-08-10T17:00:00Z" }
              as: ReleaseManager
              captures: { win: $.data.id }
          trigger:
            - call: "POST /qa-cert/release-windows/${win}/transition"
              payload: { to_status: "CONFIRMED" }
              as: ReleaseManager
              captures: { err: $.data.error_id }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorG", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "ESRB", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { fid: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "GRANTED" }, as: PlatformReviewer }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b1}", test_plan_id: "${pid}", expected_title_version: "${tv}" }
              as: CertificationLead
              captures: { pkg: $.data.id, cid: $.data.checklist_id }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-01", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-02", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-03", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-04", result: "NA" }, as: ComplianceManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /qa-cert/submission-packages/${pkg}/transition", payload: { to_status: "SUBMITTED" }, as: CertificationLead, as_user_id: "cl-1" }
            - { call: "POST /qa-cert/submission-packages/${pkg}/transition", payload: { to_status: "IN_REVIEW" }, as: PlatformReviewer }
            - { call: "POST /qa-cert/submission-packages/${pkg}/transition", payload: { to_status: "APPROVED" }, as: PlatformReviewer, as_user_id: "pr-1" }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "CERT_APPROVED" }, as: ReleaseManager }
            - call: "POST /qa-cert/release-windows/${win}/transition"
              payload: { to_status: "CONFIRMED" }
              as: ReleaseManager
              captures: { fee: $.data.fee_cents, wst: $.data.status }
          assert:
            - "first confirm (title CERTIFICATION): error_id == ERR_TITLE_NOT_CERT_APPROVED, http 409"
            - "after the title reaches CERT_APPROVED: status == CONFIRMED"
            - "window.fee_cents == 40000 (8h x 5000 x 1.00; only PS5 window in ISO week 33, tier LOW)"

  # ---------------------------------------------------------------- rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: release_window_half_open_adjacency
        grounds:
          - calculations.release_window_overlap
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the ReleaseWindow resource: a window whose
          start equals an existing window's end ([17:00, next-day 09:00) after
          [09:00, 17:00)) does NOT collide, while a window straddling the boundary
          ([16:00, 18:00)) is rejected with ERR_WINDOW_OVERLAP. Different interval
          semantics and different resource entity from
          blackout_closed_interval_with_buffer (closed interval + buffer on
          CertBlackoutWindow).
        test_recipe:
          setup:
            - "Title T exists (no status requirement for window creation); clock is the 2026-08-01T00:00:00Z default so all starts are in the future"
            - "W1 PC [2026-08-10T09:00Z, 2026-08-10T17:00Z) RESERVED"
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "OVL-WIN", name: "Ovl Win", platform_codes: ["PC"], target_launch_date: "2026-11-01", cert_budget_total_cents: 500000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/release-windows"
              payload: { title_id: "${tid}", platform_code: "PC", kind: "LAUNCH", start_utc: "2026-08-10T09:00:00Z", end_utc: "2026-08-10T17:00:00Z" }
              as: ReleaseManager
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /qa-cert/release-windows"
              payload: { title_id: "${tid}", platform_code: "PC", kind: "DAY_ONE_PATCH", start_utc: "2026-08-10T17:00:00Z", end_utc: "2026-08-11T09:00:00Z" }
              as: ReleaseManager
              captures: { w2: $.data.id }
            - call: "POST /qa-cert/release-windows"
              payload: { title_id: "${tid}", platform_code: "PC", kind: "HOTFIX_DEPLOY", start_utc: "2026-08-10T16:00:00Z", end_utc: "2026-08-10T18:00:00Z" }
              as: ReleaseManager
              captures: { err: $.data.error_id }
          assert:
            - "adjacent window (start == W1.end) is CREATED — half-open semantics: touching is not overlap"
            - "straddling window [16:00, 18:00) fails: error_id == ERR_WINDOW_OVERLAP, http 409"
            - "exactly 2 non-terminal windows exist for PC afterwards (GET /qa-cert/release-windows?platform_code=PC -> total_count == 2)"

      - name: blackout_closed_interval_with_buffer
        grounds:
          - calculations.blackout_buffered_exclusion
          - errors[ERR_SUBMISSION_BLACKOUT_ACTIVE]
        distinguishing_aspect: |
          Closed-interval-with-buffer semantics on the CertBlackoutWindow resource:
          blackout [2026-08-10T00:00Z, 2026-08-12T00:00Z] with buffer_hours 24 blocks
          submits at every t in [2026-08-09T00:00Z, 2026-08-13T00:00Z] INCLUSIVE — a
          submit exactly at end+buffer (2026-08-13T00:00:00Z) is rejected, and one
          second later it succeeds. Different geometry (inclusive bounds + buffer)
          and different resource entity than release_window_half_open_adjacency.
        test_recipe:
          setup:
            - "Title T (PS5), budget 1000000, IN_DEVELOPMENT; plan APPROVED->LOCKED; build CANDIDATE; ESRB GRANTED; PKG ASSEMBLING with fully verified checklist"
            - "Blackout on PS5: [2026-08-10T00:00:00Z, 2026-08-12T00:00:00Z], buffer_hours 24"
            - "Clock first set to exactly 2026-08-13T00:00:00Z (end + buffer), then advanced one second"
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "OVL-BLK", name: "Ovl Blk", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorK", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "ESRB", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { fid: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "GRANTED" }, as: PlatformReviewer }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b1}", test_plan_id: "${pid}", expected_title_version: "${tv}" }
              as: CertificationLead
              captures: { pkg: $.data.id, cid: $.data.checklist_id }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-01", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-02", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-03", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-04", result: "NA" }, as: ComplianceManager }
            - { call: "POST /qa-cert/cert-blackout-windows", payload: { platform_code: "PS5", start_utc: "2026-08-10T00:00:00Z", end_utc: "2026-08-12T00:00:00Z", buffer_hours: 24, reason: "platform cert freeze" }, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /qa-cert/submission-packages/${pkg}/transition"
              payload: { to_status: "SUBMITTED" }
              as: CertificationLead
              as_user_id: "cl-1"
              captures: { err: $.data.error_id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:01Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/submission-packages/${pkg}/transition"
              payload: { to_status: "SUBMITTED" }
              as: CertificationLead
              as_user_id: "cl-1"
              captures: { st: $.data.status, fee: $.data.fee_cents }
          assert:
            - "at t == end_utc + buffer exactly: error_id == ERR_SUBMISSION_BLACKOUT_ACTIVE (closed bound is inclusive), http 409"
            - "at t == end_utc + buffer + 1s: submit succeeds, status == SUBMITTED"
            - "fee_cents == 120000 (round 1, Thursday, not expedited)"

  # ---------------------------------------------------------------- rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: vendor_hours_cancel_conservation
        grounds:
          - calculations.vendor_weekly_capacity_ledger
          - state_machines.TestAssignment
          - entities.QaVendor.fields.available_hours_current_week
        distinguishing_aspect: |
          Conserved quantity = vendor weekly capacity-HOURS: create (15h) then cancel
          restores the bucket exactly, and a later create (20h) + complete cycle frees
          the reservation again — committed + available == 40 at all four checkpoints.
          Different conserved quantity from cert_budget_submit_decide_withdraw_conservation
          (budget cents).
        test_recipe:
          setup:
            - "Logical clock 2026-08-04T00:00:00Z (ISO week of Monday 2026-08-03)"
            - "Vendor V cap 40 rate 5000; plan with entry COMBAT (1h)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "INV-HRS", name: "Inv Hrs", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 500000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorInv", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
