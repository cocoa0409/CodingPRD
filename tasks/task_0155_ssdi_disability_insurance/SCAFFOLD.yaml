# =============================================================================
# SSDI Disability Insurance Application — Scaffold (v1)
# =============================================================================

scenario: |
  SSDI Disability Insurance Application: work credit requirement (QC), medical
  evidence, Listings/RFC, ALJ hearing scheduling, Back Pay, SSI supplemental,
  child auxiliary, CDR periodic review.

domain_name: ssdi-disability-insurance
api_prefix: /claimants

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  # Claimant is the top hierarchy root; QuarterCredit, MedicalEvidence, Application
  # nest under Claimant. ChildAuxiliary is a peer entity referencing the parent
  # Application (cross-aggregate). HearingSlot is a flat resource with FK
  # references (peer). SSISupplement is computed alongside Application.

  state_machine_shape: cyclic
  # Application moves INITIAL -> RECONSIDERATION -> ALJ -> APPEALS_COUNCIL with
  # a remand cycle ALJ -> RECONSIDERATION on remand. CDR cycle CONTINUE_REVIEW
  # -> SCHEDULED -> COMPLETED -> CONTINUE_REVIEW. Combined with branching
  # forks (APPROVED vs DENIED) and compound parent->child cascades.

  relationship_patterns:
    - one_to_many       # Claimant -> QuarterCredit; Application -> ChildAuxiliary
    - cross_aggregate   # ChildAuxiliary references Application across aggregate boundaries
    - polymorphic       # MedicalEvidence.source_type discriminates Listing vs RFC items

  role_model: segregation_of_duties
  # Claimant submits; DDS_Examiner adjudicates initial/reconsideration; ALJ
  # adjudicates hearings; CDR_Reviewer handles periodic reviews. A
  # DDS_Examiner who issued the initial determination cannot also issue the
  # reconsideration (SoD).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Claimant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Claimant legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO date; used for QC requirement tier and child eligibility" }
      - { name: filing_date, type: datetime, source: input, description: "ISO date when initial SSDI claim filed; pins the QC lookback window" }
      - { name: alleged_onset_date, type: datetime, source: input, description: "Alleged date disability began (AOD); MUST be on or before filing_date" }
      - { name: established_onset_date, type: datetime, source: computed, description: "Final EOD set by adjudicator; null until first determination; may be later than AOD" }
      - { name: total_qc_earned, type: integer, source: computed, description: "Sum of QuarterCredit.qc_count for credited quarters in lookback; recomputed on QC mutation" }
      - { name: qc_required, type: integer, source: computed, description: "QCs required given age at AOD; see calc qc_requirement_lookup" }
      - { name: qc_recent_window, type: integer, source: computed, description: "QCs earned in 40-quarter window ending at AOD (recent-work test)" }
      - { name: qc_recent_required, type: integer, source: computed, description: "Recent-work QCs required given age at AOD" }
      - { name: insured_status, type: enum, source: computed, description: "INSURED | NOT_INSURED — TRUE iff total_qc_earned>=qc_required AND qc_recent_window>=qc_recent_required" }
      - { name: ssn_last4, type: string, source: input, description: "Last 4 of SSN, format ^[0-9]{4}$" }

  - name: QuarterCredit
    parent: Claimant
    common_fields: false   # immutable ledger entry; only id + created_at
    fields:
      - { name: claimant_id, type: string, source: system, description: "Parent claimant id" }
      - { name: year, type: integer, source: input, description: "Calendar year 1978..2100" }
      - { name: quarter, type: integer, source: input, description: "1..4 (Q1..Q4)" }
      - { name: earnings_cents, type: integer, source: input, description: "Earnings in that quarter, cents; non-negative" }
      - { name: qc_count, type: integer, source: computed, description: "0..1 — 1 iff earnings_cents >= QC_EARNINGS_THRESHOLD_CENTS for that year (constants.QC_EARNINGS_THRESHOLD_CENTS_BY_YEAR), capped at 4 per year via aggregation" }
      - { name: credited, type: boolean, source: computed, description: "TRUE iff (year,quarter) is within the lookback window ending at the claimant's AOD" }

  - name: MedicalEvidence
    parent: Claimant
    common_fields: true
    fields:
      - { name: claimant_id, type: string, source: system, description: "Parent claimant id" }
      - { name: source_type, type: enum, source: input, description: "LISTING_MATCH | RFC_ASSESSMENT — discriminator for medical evidence" }
      - { name: listing_code, type: string, source: input, description: "e.g. '1.15' (musculoskeletal) — required when source_type=LISTING_MATCH, else null" }
      - { name: rfc_exertional_level, type: enum, source: input, description: "SEDENTARY | LIGHT | MEDIUM | HEAVY — required when source_type=RFC_ASSESSMENT, else null" }
      - { name: rfc_skill_level, type: enum, source: input, description: "UNSKILLED | SEMI_SKILLED | SKILLED — required when source_type=RFC_ASSESSMENT, else null" }
      - { name: age_category_at_decision, type: enum, source: input, description: "YOUNGER | CLOSELY_APPROACHING | ADVANCED — grid-rule input, required when source_type=RFC_ASSESSMENT" }
      - { name: education_level, type: enum, source: input, description: "ILLITERATE | LIMITED | HIGH_SCHOOL_OR_MORE — required when source_type=RFC_ASSESSMENT" }
      - { name: medical_findings, type: string, source: input, description: "Free-text clinical findings; min length 20 chars" }
      - { name: evidence_date, type: datetime, source: input, description: "ISO date evidence was obtained; MUST be on or after AOD and on or before filing_date+730 days" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED — adjudicator-set" }

  - name: Application
    parent: Claimant
    common_fields: true
    fields:
      - { name: claimant_id, type: string, source: system, description: "Parent claimant id" }
      - { name: status, type: enum, source: system, description: "DRAFT | INITIAL_REVIEW | INITIAL_DENIED | RECONSIDERATION | RECON_DENIED | ALJ_PENDING | ALJ_APPROVED | ALJ_DENIED | APPEALS_COUNCIL | APPROVED | CLOSED_DENIED" }
      - { name: medical_decision, type: enum, source: computed, description: "MEETS_LISTING | EQUALS_LISTING | DISABLED_BY_RFC | NOT_DISABLED | null — set per determination" }
      - { name: last_initial_examiner_id, type: string, source: system, description: "DDS_Examiner who issued the most recent INITIAL_REVIEW decision; used to enforce SoD on reconsideration" }
      - { name: pia_cents, type: integer, source: computed, description: "Primary Insurance Amount in cents; computed on APPROVAL transition from AIME bend-point formula" }
      - { name: aime_cents, type: integer, source: computed, description: "Average Indexed Monthly Earnings in cents; intermediate output of pia calculation" }
      - { name: family_max_cents, type: integer, source: computed, description: "Family Maximum Benefit cents; bend-point formula over PIA" }
      - { name: monthly_benefit_cents, type: integer, source: computed, description: "Worker's monthly DIB after family-max prorating; equals pia_cents pre-auxiliary, prorated post-auxiliary" }
      - { name: entitlement_date, type: datetime, source: computed, description: "EOD + 5 full calendar months (statutory waiting period); the first month benefits accrue" }
      - { name: back_pay_cents, type: integer, source: computed, description: "Retroactive lump sum from entitlement_date through approval month; capped at 12 months of pre-filing retro" }
      - { name: approval_date, type: datetime, source: computed, description: "Timestamp of transition into APPROVED; pins the back-pay end month" }
      - { name: next_cdr_due_date, type: datetime, source: computed, description: "Approval date + diary_months (per cdr_diary_lookup)" }
      - { name: cdr_diary, type: enum, source: computed, description: "MIE | MIP | MINE — Medical Improvement Expected/Possible/Not Expected; pins CDR cadence" }

  - name: HearingSlot
    parent: null
    common_fields: true
    fields:
      - { name: alj_id, type: string, source: input, description: "ALJ user id assigned to this slot (role=ALJ)" }
      - { name: hearing_office, type: string, source: input, description: "OHO office code, e.g. 'OHO_BOSTON'" }
      - { name: start_at, type: datetime, source: input, description: "ISO datetime UTC start of the hearing slot" }
      - { name: end_at, type: datetime, source: input, description: "ISO datetime UTC end (exclusive); MUST equal start_at + 60 minutes" }
      - { name: application_id, type: string, source: computed, description: "Foreign key to Application once booked; null while OPEN" }
      - { name: status, type: enum, source: system, description: "OPEN | BOOKED | HELD | NO_SHOW | RESCHEDULED" }

  - name: ChildAuxiliary
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "Parent worker's application id (cross-aggregate FK)" }
      - { name: child_name, type: string, source: input, description: "Child legal name" }
      - { name: child_date_of_birth, type: datetime, source: input, description: "ISO date" }
      - { name: child_relationship, type: enum, source: input, description: "BIOLOGICAL | ADOPTED | STEPCHILD | DEPENDENT_GRANDCHILD" }
      - { name: is_full_time_student, type: boolean, source: input, description: "Required for children aged 18..<19 in secondary school" }
      - { name: is_disabled_before_22, type: boolean, source: input, description: "TRUE iff child became disabled before age 22 (DAC eligibility)" }
      - { name: status, type: enum, source: system, description: "PENDING | ENTITLED | TERMINATED" }
      - { name: termination_reason, type: enum, source: system, description: "AGE_OUT | NO_LONGER_DISABLED | PARENT_BENEFIT_ENDED | null" }
      - { name: monthly_benefit_cents, type: integer, source: computed, description: "= floor(0.50 * worker_pia_cents) before family-max prorating; reduced by family_max waterfall" }

  - name: SSISupplement
    parent: null
    common_fields: true
    fields:
      - { name: claimant_id, type: string, source: input, description: "Parent claimant id" }
      - { name: countable_income_cents, type: integer, source: input, description: "Monthly countable income in cents (post-exclusions)" }
      - { name: countable_resources_cents, type: integer, source: input, description: "Snapshot resources cents; must be <= SSI_RESOURCE_LIMIT_CENTS" }
      - { name: living_arrangement, type: enum, source: input, description: "OWN_HOUSEHOLD | ANOTHER_HOUSEHOLD | INSTITUTION" }
      - { name: ssi_payment_cents, type: integer, source: computed, description: "Computed via fbr - countable_income_after_exclusions; floored at 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | TERMINATED_RESOURCES | TERMINATED_INCOME | TERMINATED_DIB_OFFSET" }

  - name: CDRReview
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "Parent application id" }
      - { name: review_due_date, type: datetime, source: input, description: "Date the review is due; set on creation from application.next_cdr_due_date" }
      - { name: scheduled_at, type: datetime, source: system, description: "When review was scheduled (CDR_Reviewer claimed it)" }
      - { name: completed_at, type: datetime, source: system, description: "When review concluded (CONTINUE or CEASE)" }
      - { name: outcome, type: enum, source: system, description: "CONTINUE | CEASE | null — null while not COMPLETED" }
      - { name: medical_improvement_found, type: boolean, source: input, description: "TRUE iff the reviewer finds Medical Improvement related to ability to work (MIRA)" }
      - { name: working_at_sga, type: boolean, source: input, description: "TRUE iff claimant currently working at Substantial Gainful Activity" }
      - { name: status, type: enum, source: system, description: "PENDING | SCHEDULED | COMPLETED" }

  - name: Determination
    parent: Application
    common_fields: false  # immutable ledger entry; id + created_at only
    fields:
      - { name: application_id, type: string, source: system, description: "Parent application id" }
      - { name: level, type: enum, source: system, description: "INITIAL | RECONSIDERATION | ALJ | APPEALS_COUNCIL — adjudication tier" }
      - { name: examiner_id, type: string, source: system, description: "Acting adjudicator (X-User-ID)" }
      - { name: examiner_role, type: enum, source: system, description: "DDS_Examiner | ALJ | AppealsCouncil — role at time of determination" }
      - { name: decision, type: enum, source: system, description: "ALLOW | DENY | REMAND — REMAND only valid at APPEALS_COUNCIL" }
      - { name: medical_basis, type: enum, source: system, description: "MEETS_LISTING | EQUALS_LISTING | DISABLED_BY_RFC | NOT_DISABLED | NOT_REACHED" }
      - { name: established_onset_date, type: datetime, source: system, description: "EOD set by this determination; copied to Application.established_onset_date on ALLOW" }
      - { name: rationale, type: string, source: system, description: "Free-text rationale, min 50 chars" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [CLOSED_DENIED]   # APPROVED is a long-lived live state, not terminal (subject to CDR cessation)
    transitions:
      - from: DRAFT
        to: INITIAL_REVIEW
        trigger: "POST /claimants/{claimantId}/applications/{appId}/submit"
        actor: Claimant
        preconditions:
          - "Claimant.insured_status == INSURED (ERR_QC_INSUFFICIENT)"
          - "At least one MedicalEvidence row with status=ACCEPTED (ERR_EVIDENCE_INSUFFICIENT)"
          - "alleged_onset_date <= filing_date (ERR_AOD_AFTER_FILING)"
        side_effects:
          - "Compute Claimant.qc fields (qc_requirement_lookup + qc_recent_window)"

      - from: INITIAL_REVIEW
        to: APPROVED
        trigger: "POST /claimants/{claimantId}/applications/{appId}/determinations  (level=INITIAL, decision=ALLOW)"
        actor: DDS_Examiner
        preconditions:
          - "Application.status == INITIAL_REVIEW (ERR_INVALID_STATE)"
          - "Determination.medical_basis IN {MEETS_LISTING, EQUALS_LISTING, DISABLED_BY_RFC}"
        side_effects:
          - "Application.established_onset_date := Determination.established_onset_date"
          - "Application.entitlement_date := EOD + 5 full months (waiting_period_calc)"
          - "Application.pia_cents := pia_calc; family_max_cents := family_max_calc"
          - "Application.back_pay_cents := back_pay_calc(approval_method=PROVISIONAL until ALJ, FINAL on ALLOW)"
          - "Application.approval_date := now()"
          - "Application.cdr_diary := cdr_diary_lookup; next_cdr_due_date := approval_date + diary_months"
          - "Application.last_initial_examiner_id := acting examiner id"
          - "Determination row appended (level=INITIAL, decision=ALLOW)"
          - "Auto-create one CDRReview row with review_due_date = next_cdr_due_date, status=PENDING"

      - from: INITIAL_REVIEW
        to: INITIAL_DENIED
        trigger: "POST /claimants/{claimantId}/applications/{appId}/determinations (level=INITIAL, decision=DENY)"
        actor: DDS_Examiner
        preconditions:
          - "Application.status == INITIAL_REVIEW"
        side_effects:
          - "Application.last_initial_examiner_id := acting examiner id"
          - "Determination row appended (level=INITIAL, decision=DENY)"

      - from: INITIAL_DENIED
        to: RECONSIDERATION
        trigger: "POST /claimants/{claimantId}/applications/{appId}/appeal  (target_level=RECONSIDERATION)"
        actor: Claimant
        preconditions:
          - "now() <= initial_determination.created_at + APPEAL_WINDOW_DAYS (60) (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects: []

      - from: RECONSIDERATION
        to: APPROVED
        trigger: "POST /claimants/{claimantId}/applications/{appId}/determinations (level=RECONSIDERATION, decision=ALLOW)"
        actor: DDS_Examiner
        preconditions:
          - "examiner_id != Application.last_initial_examiner_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Same APPROVAL cascade as INITIAL_REVIEW -> APPROVED"

      - from: RECONSIDERATION
        to: RECON_DENIED
        trigger: "POST /claimants/{claimantId}/applications/{appId}/determinations (level=RECONSIDERATION, decision=DENY)"
        actor: DDS_Examiner
        preconditions:
          - "examiner_id != Application.last_initial_examiner_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: RECON_DENIED
        to: ALJ_PENDING
        trigger: "POST /claimants/{claimantId}/applications/{appId}/appeal  (target_level=ALJ)"
        actor: Claimant
        preconditions:
          - "now() <= recon_determination.created_at + APPEAL_WINDOW_DAYS (60)"
        side_effects: []

      - from: ALJ_PENDING
        to: ALJ_APPROVED
        trigger: "POST /claimants/{claimantId}/applications/{appId}/determinations (level=ALJ, decision=ALLOW)"
        actor: ALJ
        preconditions:
          - "An associated HearingSlot exists with status=HELD for this application_id (ERR_HEARING_NOT_HELD)"
        side_effects:
          - "Same APPROVAL cascade as INITIAL_REVIEW -> APPROVED, but back_pay_calc uses FINAL variant (12-month pre-filing retro cap)"

      - from: ALJ_PENDING
        to: ALJ_DENIED
        trigger: "POST /claimants/{claimantId}/applications/{appId}/determinations (level=ALJ, decision=DENY)"
        actor: ALJ
        preconditions:
          - "Associated HearingSlot.status == HELD"
        side_effects: []

      - from: ALJ_DENIED
        to: APPEALS_COUNCIL
        trigger: "POST /claimants/{claimantId}/applications/{appId}/appeal (target_level=APPEALS_COUNCIL)"
        actor: Claimant
        preconditions:
          - "now() <= alj_determination.created_at + APPEAL_WINDOW_DAYS (60)"
        side_effects: []

      - from: APPEALS_COUNCIL
        to: RECONSIDERATION
        trigger: "POST /claimants/{claimantId}/applications/{appId}/determinations (level=APPEALS_COUNCIL, decision=REMAND)"
        actor: AppealsCouncil
        preconditions: []
        side_effects:
          - "Cycle: application returns to RECONSIDERATION for new examiner action"
          - "Application.last_initial_examiner_id retained — SoD still binds the remand path"

      - from: APPEALS_COUNCIL
        to: CLOSED_DENIED
        trigger: "POST /claimants/{claimantId}/applications/{appId}/determinations (level=APPEALS_COUNCIL, decision=DENY)"
        actor: AppealsCouncil
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: CLOSED_DENIED
        trigger: "POST /claimants/{claimantId}/applications/{appId}/cdr-cease  (system-emitted on CDRReview outcome=CEASE)"
        actor: system
        preconditions:
          - "Associated CDRReview.outcome == CEASE"
        side_effects:
          - "Application.back_pay_cents recouped: a Determination row appended with negative entitlement_delta (compensating invariant total_lifetime_paid_cents balance)"
          - "All ChildAuxiliary rows with application_id=this and status=ENTITLED -> status=TERMINATED, termination_reason=PARENT_BENEFIT_ENDED"
          - "Any SSISupplement with claimant_id matching this application's claimant where status=TERMINATED_DIB_OFFSET is recomputed (DIB offset removed)"

  - entity: ChildAuxiliary
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ENTITLED
        trigger: "POST /child-auxiliaries/{id}/entitle  (system-emitted on parent Application APPROVED)"
        actor: system
        preconditions:
          - "Parent Application.status IN {APPROVED, ALJ_APPROVED} (ERR_PARENT_NOT_APPROVED)"
          - "Child age at entitlement < 18, OR (18 <= age < 19 AND is_full_time_student), OR is_disabled_before_22 (ERR_CHILD_INELIGIBLE)"
        side_effects:
          - "ChildAuxiliary.monthly_benefit_cents := child_aux_calc (50% PIA pre-prorate, then family-max waterfall)"
          - "All sibling ChildAuxiliary rows for the same parent recomputed (family-max waterfall side-effect)"

      - from: ENTITLED
        to: TERMINATED
        trigger: "POST /child-auxiliaries/{id}/terminate  (system-emitted on age-out, no-longer-student, or parent cessation)"
        actor: system
        preconditions: []
        side_effects:
          - "ChildAuxiliary.termination_reason := AGE_OUT | NO_LONGER_DISABLED | PARENT_BENEFIT_ENDED"
          - "All sibling ChildAuxiliary rows recomputed (family-max waterfall redistribution to surviving children)"

  - entity: CDRReview
    initial_state: PENDING
    terminal_states: []   # CDRReview is not terminal — closing one schedules the next per cdr_diary
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /cdr-reviews/{id}/schedule"
        actor: CDR_Reviewer
        preconditions:
          - "now() >= review_due_date - 60 days (ERR_CDR_NOT_DUE)"
        side_effects:
          - "CDRReview.scheduled_at := now()"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /cdr-reviews/{id}/complete"
        actor: CDR_Reviewer
        preconditions:
          - "request body provides medical_improvement_found and working_at_sga"
        side_effects:
          - "outcome := CEASE iff (medical_improvement_found AND can_work_post_MIRA) OR working_at_sga; else CONTINUE"
          - "If outcome=CEASE: emit POST /applications/{appId}/cdr-cease (cascades into Application APPROVED -> CLOSED_DENIED transition)"
          - "If outcome=CONTINUE: auto-create next CDRReview with review_due_date = now() + diary_months (per Application.cdr_diary)"

  - entity: HearingSlot
    initial_state: OPEN
    terminal_states: []   # slots can cycle OPEN <-> BOOKED on reschedule
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "POST /hearing-slots/{slotId}/book"
        actor: ALJ
        preconditions:
          - "Application.status == ALJ_PENDING (ERR_INVALID_STATE)"
          - "No other HearingSlot with same alj_id whose [start_at, end_at) intersects this slot's [start_at, end_at) at status IN {BOOKED, HELD} (ERR_HEARING_SLOT_CONFLICT)"
          - "No other HearingSlot with same application_id and status IN {BOOKED, HELD} (ERR_APPLICATION_ALREADY_SCHEDULED)"
        side_effects:
          - "HearingSlot.application_id := request body application_id"

      - from: BOOKED
        to: HELD
        trigger: "POST /hearing-slots/{slotId}/hold"
        actor: ALJ
        preconditions:
          - "now() >= start_at (ERR_HEARING_NOT_REACHED)"
        side_effects: []

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /hearing-slots/{slotId}/no-show"
        actor: ALJ
        preconditions:
          - "now() >= end_at"
        side_effects:
          - "Associated Application stays in ALJ_PENDING; a new HearingSlot must be booked"

      - from: BOOKED
        to: RESCHEDULED
        trigger: "POST /hearing-slots/{slotId}/reschedule  (body: new_slot_id)"
        actor: ALJ
        preconditions:
          - "now() < start_at (ERR_HEARING_ALREADY_REACHED)"
          - "new_slot_id refers to an OPEN slot"
        side_effects:
          - "new_slot_id transitions OPEN -> BOOKED, inheriting application_id"
          - "This slot's application_id is cleared"

  - entity: SSISupplement
    initial_state: DRAFT
    terminal_states: [TERMINATED_RESOURCES, TERMINATED_INCOME, TERMINATED_DIB_OFFSET]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /ssi-supplements/{id}/activate"
        actor: DDS_Examiner
        preconditions:
          - "countable_resources_cents <= SSI_RESOURCE_LIMIT_CENTS (ERR_SSI_RESOURCES_EXCEEDED)"
        side_effects:
          - "ssi_payment_cents := ssi_calc; if ssi_payment_cents == 0 and DIB benefit exists -> status := TERMINATED_DIB_OFFSET instead of ACTIVE"

      - from: ACTIVE
        to: TERMINATED_RESOURCES
        trigger: "PATCH /ssi-supplements/{id}  (countable_resources_cents > limit)"
        actor: DDS_Examiner
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED_INCOME
        trigger: "PATCH /ssi-supplements/{id}  (ssi_payment_cents drops to 0 due to income)"
        actor: DDS_Examiner
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two DDS_Examiners simultaneously issue ALLOW and DENY at INITIAL_REVIEW on the same application"
    guarantee: "Exactly one determination wins; the loser's POST is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Application.status transition; loser sees status already advanced"

  - scenario: "Two ALJs book the same HearingSlot simultaneously"
    guarantee: "At most one booking succeeds; the second is rejected"
    error_id: ERR_HEARING_SLOT_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on HearingSlot.status OPEN->BOOKED"

  - scenario: "Two CDR_Reviewers simultaneously schedule the same CDRReview"
    guarantee: "Exactly one reviewer wins; the loser's POST is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on CDRReview.status PENDING->SCHEDULED"

  - scenario: "An ALJ books a slot for an application that another examiner is concurrently approving at reconsideration"
    guarantee: "If application advances to APPROVED first, the booking is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "Application.status read at booking time must be ALJ_PENDING"

  - scenario: "Two POSTs to the same Application's /appeal endpoint after a denial"
    guarantee: "Exactly one transition succeeds; the loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Application.status advance"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: qc_requirement_lookup
    trigger: "On Application DRAFT->INITIAL_REVIEW; recomputed when Claimant.alleged_onset_date or any QuarterCredit mutates"
    algorithm: threshold
    formula: |
      age_at_aod = year_diff(alleged_onset_date, date_of_birth)  # integer years, floor
      # Fully-insured (lifetime) QCs required:
      if age_at_aod < 24:                qc_required = 6
      elif age_at_aod <= 30:             qc_required = 2 * (age_at_aod - 21)        # 24->6, 25->8, 26->10, ... 30->18
      elif age_at_aod <= 42:             qc_required = 20
      elif age_at_aod <= 61:             qc_required = 20 + (age_at_aod - 42)       # +1 per year above 42
      else:                              qc_required = 40
      # Recent-work test:
      if age_at_aod < 24:                qc_recent_required = 6   # within 12-quarter window before AOD
      elif age_at_aod < 31:              qc_recent_required = ceil((age_at_aod - 21) * 2)  # within (age - 21)*2 quarters
      else:                              qc_recent_required = 20  # within 40-quarter window before AOD
    input_set: "Claimant.date_of_birth + alleged_onset_date"
    constants:
      QC_EARNINGS_THRESHOLD_CENTS_BY_YEAR:
        2024: 173000   # $1,730/QC in 2024
        2025: 181000   # $1,810/QC in 2025 (illustrative)
    precision: "integer QC count; floor on age years"

  - name: pia_calc
    trigger: "On any Application transition into APPROVED (INITIAL, RECONSIDERATION, ALJ)"
    algorithm: tiered_pricing
    formula: |
      # Step 1: AIME — sum highest-35 indexed annual earnings (capped per year), divide by 420 months.
      # Step 2: PIA via bend points (2024):
      pia_cents = floor(
        0.90 * min(aime_cents, BEND_POINT_1)
      + 0.32 * max(0, min(aime_cents, BEND_POINT_2) - BEND_POINT_1)
      + 0.15 * max(0, aime_cents - BEND_POINT_2)
      )
      # PIA is rounded DOWN to the next dime: pia_cents = (pia_cents // 10) * 10
    input_set: "Indexed earnings ledger (QuarterCredit rolled up by year), capped at YEARLY_CAP_BY_YEAR"
    constants:
      BEND_POINT_1: 117400   # $1,174 in cents (2024)
      BEND_POINT_2: 707800   # $7,078 in cents (2024)
      YEARLY_CAP_BY_YEAR:
        2024: 16820000       # $168,200 (Social Security wage base 2024) in cents
    precision: "cents; rounded down to nearest 10 cents per the SSA dime-round rule"
    variants:
      - name: provisional_dib
        when: "Used at INITIAL_REVIEW and RECONSIDERATION ALLOW: AIME computed over claimant's filed earnings record only, including the year-of-AOD truncated at the latest completed quarter"
        difference: "Year-of-AOD earnings included only up to last completed QuarterCredit; later partial quarters dropped"
      - name: final_dib
        when: "Used at ALJ ALLOW: AIME includes full year-of-AOD earnings as a single annual figure (no quarter truncation)"
        difference: "Year-of-AOD earnings included in full; can change pia_cents by up to 32% of the year's contribution depending on bend-point tier"

  - name: family_max_calc
    trigger: "Co-runs with pia_calc on APPROVAL; also recomputed when any ChildAuxiliary transitions or terminates"
    algorithm: tiered_pricing
    formula: |
      # Family Maximum tiered bend points (2024 DIB):
      # Below FMB_BP1: 150% of PIA; FMB_BP1..FMB_BP2: 272%; FMB_BP2..FMB_BP3: 134%; above FMB_BP3: 175%
      family_max_cents = floor(
        1.50 * min(pia_cents, FMB_BP1)
      + 2.72 * max(0, min(pia_cents, FMB_BP2) - FMB_BP1)
      + 1.34 * max(0, min(pia_cents, FMB_BP3) - FMB_BP2)
      + 1.75 * max(0, pia_cents - FMB_BP3)
      )
      family_max_cents = (family_max_cents // 10) * 10  # dime-round-down
      # DIB special floor: family_max_cents = clamp(family_max_cents, 1.50 * pia_cents, 1.85 * pia_cents)
      # Waterfall: worker gets full pia_cents; remaining (family_max_cents - pia_cents) is distributed across ENTITLED ChildAuxiliary rows.
      # Per-child gross = floor(0.50 * pia_cents).
      # If sum(per-child gross) > (family_max_cents - pia_cents):
      #   pool = family_max_cents - pia_cents
      #   each child = floor(pool / count(entitled_children))
      #   remainder = pool - count*each; distributed to oldest entitled children first (date_of_birth ASC, ties broken by created_at ASC)
    input_set: "Application.pia_cents + count of ChildAuxiliary where status=ENTITLED"
    constants:
      FMB_BP1: 150000        # $1,500 (cents)
      FMB_BP2: 216500        # $2,165 (cents)
      FMB_BP3: 282500        # $2,825 (cents)
    precision: "cents; dime-round-down then DIB clamp"

  - name: back_pay_calc
    trigger: "On Application transition into APPROVED (INITIAL, RECON, or ALJ ALLOW)"
    algorithm: chronological
    formula: |
      # Months of retroactive benefits = full calendar months from entitlement_date through approval_month-1 (exclusive).
      # entitlement_date = EOD + 5 full calendar months (waiting period).
      months_retro = month_diff_exclusive(approval_date, entitlement_date)
      back_pay_cents = months_retro * monthly_benefit_cents
    input_set: "Application.entitlement_date, Application.approval_date, Application.monthly_benefit_cents"
    constants:
      MAX_PRE_FILING_RETRO_MONTHS: 12
    precision: "integer cents"
    variants:
      - name: provisional_back_pay
        when: "At INITIAL_REVIEW and RECONSIDERATION ALLOW"
        difference: "Pre-filing retro months capped at min(12, months_between(filing_date, entitlement_date)); examiner may NOT extend further"
      - name: final_back_pay
        when: "At ALJ ALLOW"
        difference: "Pre-filing retro months capped at 12 absolute (12 full months prior to filing_date), regardless of intervening denial windows; this can yield a different total back_pay_cents than the provisional variant when entitlement_date precedes filing_date by more than 12 months but adjudication delays compressed earlier retro windows"

  - name: ssi_calc
    trigger: "On SSISupplement DRAFT->ACTIVE; recomputed on PATCH"
    algorithm: aggregation
    formula: |
      # Step 1: Compute exclusions
      earned_income_cents = claimant_earned_income_cents
      unearned_income_cents = claimant_unearned_income_cents  # includes DIB benefit
      excluded_unearned = min(unearned_income_cents, GENERAL_INCOME_EXCLUSION)
      remaining_unearned = unearned_income_cents - excluded_unearned
      earned_exclusion_remaining = GENERAL_INCOME_EXCLUSION - excluded_unearned  # spillover
      excluded_earned = earned_exclusion_remaining + EARNED_INCOME_EXCLUSION
      remaining_earned = max(0, earned_income_cents - excluded_earned)
      countable_earned_after_half = remaining_earned // 2  # one-half exclusion
      countable_income = remaining_unearned + countable_earned_after_half
      # Step 2: FBR by living arrangement
      fbr_cents = FBR_BY_LIVING_ARRANGEMENT[living_arrangement]
      # Step 3: SSI payment
      ssi_payment_cents = max(0, fbr_cents - countable_income)
    input_set: "SSISupplement.countable_income_cents (split into earned vs unearned) + living_arrangement"
    constants:
      GENERAL_INCOME_EXCLUSION: 2000      # $20 (cents)
      EARNED_INCOME_EXCLUSION: 6500       # $65 (cents)
      FBR_BY_LIVING_ARRANGEMENT:
        OWN_HOUSEHOLD: 96700              # $967 (cents) — 2024
        ANOTHER_HOUSEHOLD: 64470          # $644.70 reduced by one-third
        INSTITUTION: 3000                 # $30 personal needs allowance
      SSI_RESOURCE_LIMIT_CENTS: 200000    # $2,000 individual
    precision: "integer cents; integer division on earned-income half"

  - name: child_aux_calc
    trigger: "On ChildAuxiliary PENDING->ENTITLED; recomputed when a sibling terminates or a new sibling enters ENTITLED"
    algorithm: waterfall_allocation
    formula: |
      # Per-child gross monthly benefit
      gross_per_child = floor(0.50 * parent_pia_cents)
      pool = family_max_cents - parent_pia_cents
      n = count(ChildAuxiliary where application_id=parent and status=ENTITLED)
      if n == 0:
        return 0
      if n * gross_per_child <= pool:
        return gross_per_child
      else:
        each_share = pool // n
        remainder = pool - each_share * n
        # remainder distributed to oldest entitled children: ORDER BY date_of_birth ASC, created_at ASC
        # Each of the first `remainder` children gets each_share + 1; rest get each_share.
        return each_share or each_share + 1 (per ranking)
    input_set: "Application.pia_cents, Application.family_max_cents, count of ENTITLED ChildAuxiliary"
    constants: {}
    precision: "integer cents"

  - name: waiting_period_calc
    trigger: "On Application APPROVAL"
    algorithm: chronological
    formula: |
      # Statutory 5-month waiting period: entitlement_date is the first day of the
      # 6th full calendar month after EOD. If EOD is mid-month, count from the FOLLOWING month-1.
      eod_anchor_month = first_day_of_month(EOD) if day_of_month(EOD) == 1 else first_day_of_month(EOD + 1 month)
      entitlement_date = eod_anchor_month + 5 months
    input_set: "Application.established_onset_date"
    constants:
      WAITING_PERIOD_MONTHS: 5
    precision: "ISO date (UTC)"

  - name: cdr_diary_lookup
    trigger: "On Application APPROVAL; pins next_cdr_due_date"
    algorithm: threshold
    formula: |
      # Diary determined by medical_basis and (when DISABLED_BY_RFC) age_category_at_decision:
      if medical_basis == MEETS_LISTING:
        if listing_code starts with '1.' or '11.': cdr_diary = MIP; diary_months = 36
        else:                                       cdr_diary = MINE; diary_months = 84
      elif medical_basis == EQUALS_LISTING:        cdr_diary = MIE; diary_months = 18
      elif medical_basis == DISABLED_BY_RFC:
        if age_category_at_decision == ADVANCED:    cdr_diary = MINE; diary_months = 84
        else:                                       cdr_diary = MIP; diary_months = 36
    input_set: "Determination.medical_basis (most recent ALLOW) + MedicalEvidence.listing_code + age_category_at_decision"
    constants:
      MIE_DIARY_MONTHS: 18
      MIP_DIARY_MONTHS: 36
      MINE_DIARY_MONTHS: 84
    precision: "integer months"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Claimant, DDS_Examiner, ALJ, AppealsCouncil, CDR_Reviewer, PlatformAdmin}"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role is permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "When role is entity_backed (Claimant), X-User-ID equals the Claimant.id in the URL path; cross-claimant access denied"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "/claimants/{claimantId}/**"

  - priority: 5
    category: existence
    check: "Claimant referenced in path exists"
    error_id: ERR_CLAIMANT_NOT_FOUND
    http_status: 404
    applies_to: "/claimants/{claimantId}/**"

  - priority: 6
    category: existence
    check: "Application referenced in path exists and belongs to the path claimant"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "/claimants/{claimantId}/applications/{appId}/**"

  - priority: 7
    category: existence
    check: "MedicalEvidence / QuarterCredit / Determination / HearingSlot / ChildAuxiliary / SSISupplement / CDRReview referenced in path exists"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 8
    category: state
    check: "Target entity is in a state that permits this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"

  - priority: 9
    category: business_safety
    check: "Reconsideration determination: examiner_id != Application.last_initial_examiner_id (Segregation of Duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST .../determinations when level=RECONSIDERATION"

  - priority: 10
    category: business_referential
    check: "HearingSlot booking: no overlapping [start_at, end_at) on same alj_id at status IN {BOOKED, HELD} (closed-open interval semantics)"
    error_id: ERR_HEARING_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /hearing-slots/{slotId}/book"

  - priority: 11
    category: business_referential
    check: "HearingSlot booking: no existing BOOKED/HELD slot for the same application_id"
    error_id: ERR_APPLICATION_ALREADY_SCHEDULED
    http_status: 409
    applies_to: "POST /hearing-slots/{slotId}/book"

  - priority: 12
    category: business_safety
    check: "Court-ordered cascade — CDR cease cannot terminate ChildAuxiliary rows where is_disabled_before_22 AND parent application was approved on MEETS_LISTING basis is NOT a court-ordered restriction here (no such SSDI rule); placeholder retained for symmetry"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "internal cease cascade"

  - priority: 13
    category: business_temporal
    check: "Appeal POST: now() <= last_determination.created_at + APPEAL_WINDOW_DAYS (60)"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /applications/{appId}/appeal"

  - priority: 14
    category: business_temporal
    check: "alleged_onset_date <= filing_date"
    error_id: ERR_AOD_AFTER_FILING
    http_status: 422
    applies_to: "POST /claimants, PATCH /claimants/{id}"

  - priority: 15
    category: business_constraint
    check: "QC test — Claimant.total_qc_earned >= qc_required AND Claimant.qc_recent_window >= qc_recent_required"
    error_id: ERR_QC_INSUFFICIENT
    http_status: 422
    applies_to: "POST /applications/{appId}/submit"

  - priority: 16
    category: business_constraint
    check: "MedicalEvidence presence — at least one MedicalEvidence row with status=ACCEPTED for the claimant"
    error_id: ERR_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /applications/{appId}/submit"

  - priority: 17
    category: business_constraint
    check: "ChildAuxiliary entitle: age and student/disabled-before-22 rules"
    error_id: ERR_CHILD_INELIGIBLE
    http_status: 422
    applies_to: "POST /child-auxiliaries/{id}/entitle (system)"

  - priority: 18
    category: business_fiscal
    check: "SSI resource limit — countable_resources_cents <= SSI_RESOURCE_LIMIT_CENTS (2000_00)"
    error_id: ERR_SSI_RESOURCES_EXCEEDED
    http_status: 422
    applies_to: "POST /ssi-supplements/{id}/activate"

  - priority: 19
    category: business_temporal
    check: "CDR scheduling: now() >= review_due_date - 60 days"
    error_id: ERR_CDR_NOT_DUE
    http_status: 422
    applies_to: "POST /cdr-reviews/{id}/schedule"

  - priority: 20
    category: business_temporal
    check: "HearingSlot hold: now() >= start_at; reschedule: now() < start_at"
    error_id: ERR_HEARING_NOT_REACHED
    http_status: 422
    applies_to: "POST /hearing-slots/{slotId}/hold, /reschedule"

  - priority: 21
    category: business_referential
    check: "Determination at level=ALJ requires associated HearingSlot with status=HELD"
    error_id: ERR_HEARING_NOT_HELD
    http_status: 422
    applies_to: "POST /determinations when level=ALJ"

  - priority: 22
    category: business_fiscal
    check: "Optimistic concurrency: version provided in body matches stored version on PATCH"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "all PATCH endpoints"

  - priority: 23
    category: business_constraint
    check: "Pagination params: limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

  - priority: 24
    category: business_constraint
    check: "Request body shape: required fields present, types correct, enums valid"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ------ Claimant ------
  - method: POST
    path: "/claimants"
    description: "Register a new claimant"
    roles: [Claimant, PlatformAdmin]
    code: 201
    input: [full_name, date_of_birth, filing_date, alleged_onset_date, ssn_last4]
    output: Claimant
    side_effects: ["compute qc_required, qc_recent_required (qc_requirement_lookup)"]

  - method: GET
    path: "/claimants/{claimantId}"
    description: "Get one claimant"
    roles: [Claimant, DDS_Examiner, ALJ, AppealsCouncil, CDR_Reviewer, PlatformAdmin]
    code: 200
    input: []
    output: Claimant
    side_effects: []

  - method: PATCH
    path: "/claimants/{claimantId}"
    description: "Update claimant fields"
    roles: [Claimant, PlatformAdmin]
    code: 200
    input: ["full_name?", "alleged_onset_date?", "version"]
    output: Claimant
    side_effects: ["recompute qc fields if alleged_onset_date changed"]

  # ------ QuarterCredit ------
  - method: POST
    path: "/claimants/{claimantId}/quarter-credits"
    description: "Append a quarter of earnings (immutable)"
    roles: [Claimant, PlatformAdmin]
    code: 201
    input: [year, quarter, earnings_cents]
    output: QuarterCredit
    side_effects: ["recompute Claimant.total_qc_earned, qc_recent_window"]

  - method: GET
    path: "/claimants/{claimantId}/quarter-credits"
    description: "List quarter credits (filter by year_min, year_max; supports pagination)"
    roles: [Claimant, DDS_Examiner, PlatformAdmin]
    code: 200
    input: ["year_min?", "year_max?", "limit?", "offset?"]
    output: "QuarterCredit[]"
    side_effects: []

  # ------ MedicalEvidence ------
  - method: POST
    path: "/claimants/{claimantId}/medical-evidence"
    description: "Submit medical evidence (status=SUBMITTED)"
    roles: [Claimant]
    code: 201
    input: [source_type, "listing_code?", "rfc_exertional_level?", "rfc_skill_level?", "age_category_at_decision?", "education_level?", medical_findings, evidence_date]
    output: MedicalEvidence
    side_effects: []

  - method: POST
    path: "/claimants/{claimantId}/medical-evidence/{evidenceId}/accept"
    description: "DDS examiner accepts evidence (SUBMITTED -> ACCEPTED)"
    roles: [DDS_Examiner]
    code: 200
    input: []
    output: MedicalEvidence
    side_effects: []

  - method: POST
    path: "/claimants/{claimantId}/medical-evidence/{evidenceId}/reject"
    description: "DDS examiner rejects evidence (SUBMITTED -> REJECTED)"
    roles: [DDS_Examiner]
    code: 200
    input: []
    output: MedicalEvidence
    side_effects: []

  # ------ Application ------
  - method: POST
    path: "/claimants/{claimantId}/applications"
    description: "Create an application in DRAFT status"
    roles: [Claimant]
    code: 201
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/claimants/{claimantId}/applications/{appId}/submit"
    description: "Submit DRAFT -> INITIAL_REVIEW after QC + evidence checks"
    roles: [Claimant]
    code: 200
    input: []
    output: Application
    side_effects: ["enforce qc_insufficient + evidence_insufficient", "transition Application.status"]

  - method: POST
    path: "/claimants/{claimantId}/applications/{appId}/determinations"
    description: "Issue a determination (level + decision; ALLOW/DENY at INITIAL/RECON/ALJ/APPEALS_COUNCIL; REMAND only at APPEALS_COUNCIL)"
    roles: [DDS_Examiner, ALJ, AppealsCouncil]
    code: 201
    input: [level, decision, "medical_basis?", "established_onset_date?", "rationale"]
    output: Determination
    side_effects: ["state transition on Application", "On ALLOW: pia_calc, family_max_calc, back_pay_calc, waiting_period_calc, cdr_diary_lookup; auto-create CDRReview; recompute ChildAuxiliary monthly_benefit_cents", "SoD check at RECONSIDERATION (examiner_id != last_initial_examiner_id)"]

  - method: POST
    path: "/claimants/{claimantId}/applications/{appId}/appeal"
    description: "Advance a denial to the next adjudication level"
    roles: [Claimant]
    code: 200
    input: [target_level]
    output: Application
    side_effects: ["enforce APPEAL_WINDOW_DAYS"]

  - method: GET
    path: "/claimants/{claimantId}/applications/{appId}"
    description: "Read an application"
    roles: [Claimant, DDS_Examiner, ALJ, AppealsCouncil, CDR_Reviewer, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/claimants/{claimantId}/applications/{appId}/determinations"
    description: "List determinations for an application"
    roles: [Claimant, DDS_Examiner, ALJ, AppealsCouncil, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Determination[]"
    side_effects: []

  # ------ HearingSlot ------
  - method: POST
    path: "/hearing-slots"
    description: "Create an OPEN hearing slot"
    roles: [ALJ, PlatformAdmin]
    code: 201
    input: [alj_id, hearing_office, start_at, end_at]
    output: HearingSlot
    side_effects: []

  - method: GET
    path: "/hearing-slots"
    description: "List hearing slots (filter by alj_id, status, range; pagination)"
    roles: [ALJ, AppealsCouncil, Claimant, PlatformAdmin]
    code: 200
    input: ["alj_id?", "status?", "from?", "to?", "limit?", "offset?"]
    output: "HearingSlot[]"
    side_effects: []

  - method: POST
    path: "/hearing-slots/{slotId}/book"
    description: "Book a slot for an application (OPEN -> BOOKED)"
    roles: [ALJ]
    code: 200
    input: [application_id]
    output: HearingSlot
    side_effects: ["check no ALJ-time overlap [start,end); check no double-book of application"]

  - method: POST
    path: "/hearing-slots/{slotId}/hold"
    description: "Mark BOOKED -> HELD once start_at reached"
    roles: [ALJ]
    code: 200
    input: []
    output: HearingSlot
    side_effects: []

  - method: POST
    path: "/hearing-slots/{slotId}/no-show"
    description: "Mark BOOKED -> NO_SHOW after end_at"
    roles: [ALJ]
    code: 200
    input: []
    output: HearingSlot
    side_effects: []

  - method: POST
    path: "/hearing-slots/{slotId}/reschedule"
    description: "Move application from this slot to another OPEN slot (BOOKED -> RESCHEDULED, target OPEN -> BOOKED)"
    roles: [ALJ]
    code: 200
    input: [new_slot_id]
    output: HearingSlot
    side_effects: ["application_id moved across slots"]

  # ------ ChildAuxiliary ------
  - method: POST
    path: "/child-auxiliaries"
    description: "Create a ChildAuxiliary in PENDING state"
    roles: [Claimant, DDS_Examiner]
    code: 201
    input: [application_id, child_name, child_date_of_birth, child_relationship, "is_full_time_student?", "is_disabled_before_22?"]
    output: ChildAuxiliary
    side_effects: []

  - method: POST
    path: "/child-auxiliaries/{id}/entitle"
    description: "System endpoint to entitle a child (PENDING -> ENTITLED)"
    roles: [DDS_Examiner, PlatformAdmin]
    code: 200
    input: []
    output: ChildAuxiliary
    side_effects: ["recompute family-max waterfall across all entitled siblings"]

  - method: POST
    path: "/child-auxiliaries/{id}/terminate"
    description: "Terminate a ChildAuxiliary (ENTITLED -> TERMINATED) with explicit reason"
    roles: [DDS_Examiner, PlatformAdmin]
    code: 200
    input: [termination_reason]
    output: ChildAuxiliary
    side_effects: ["recompute family-max waterfall across remaining entitled siblings"]

  - method: GET
    path: "/child-auxiliaries"
    description: "List ChildAuxiliary rows (filter by application_id, status; pagination)"
    roles: [Claimant, DDS_Examiner, PlatformAdmin]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: "ChildAuxiliary[]"
    side_effects: []

  # ------ SSISupplement ------
  - method: POST
    path: "/ssi-supplements"
    description: "Create an SSI supplement (DRAFT) for a claimant"
    roles: [Claimant, DDS_Examiner]
    code: 201
    input: [claimant_id, countable_income_cents, countable_resources_cents, living_arrangement]
    output: SSISupplement
    side_effects: []

  - method: POST
    path: "/ssi-supplements/{id}/activate"
    description: "Activate SSI (DRAFT -> ACTIVE or TERMINATED_DIB_OFFSET if ssi_payment_cents==0 and DIB exists)"
    roles: [DDS_Examiner]
    code: 200
    input: []
    output: SSISupplement
    side_effects: ["ssi_calc"]

  - method: PATCH
    path: "/ssi-supplements/{id}"
    description: "Update countable income/resources; may trigger termination"
    roles: [DDS_Examiner, Claimant]
    code: 200
    input: ["countable_income_cents?", "countable_resources_cents?", "living_arrangement?", "version"]
    output: SSISupplement
    side_effects: ["ssi_calc; may transition into TERMINATED_RESOURCES or TERMINATED_INCOME"]

  # ------ CDRReview ------
  - method: GET
    path: "/cdr-reviews"
    description: "List CDR reviews due (filter by status, due_before)"
    roles: [CDR_Reviewer, PlatformAdmin]
    code: 200
    input: ["status?", "due_before?", "limit?", "offset?"]
    output: "CDRReview[]"
    side_effects: []

  - method: POST
    path: "/cdr-reviews/{id}/schedule"
    description: "Schedule a pending CDR (PENDING -> SCHEDULED)"
    roles: [CDR_Reviewer]
    code: 200
    input: []
    output: CDRReview
    side_effects: []

  - method: POST
    path: "/cdr-reviews/{id}/complete"
    description: "Complete a scheduled CDR with outcome (CONTINUE/CEASE)"
    roles: [CDR_Reviewer]
    code: 200
    input: [medical_improvement_found, working_at_sga]
    output: CDRReview
    side_effects: ["on CEASE: cascade Application APPROVED -> CLOSED_DENIED, recoup back_pay (compensating invariant), terminate ChildAuxiliaries with reason PARENT_BENEFIT_ENDED, recompute SSI offset; on CONTINUE: schedule next CDRReview with diary_months ahead"]

  # ------ Test-driving clock endpoint (per §1.5 testability completeness) ------
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock for tests (no-op in production); body { to: ISO8601 }"
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: null
    side_effects: ["server now() shifted forward (never backward); used to test APPEAL_WINDOW_EXPIRED, hold/reschedule windows, CDR_NOT_DUE"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_AUTH_REQUIRED,                http: 401, condition: "Missing or empty X-User-Role / X-User-ID header" }
  - { id: ERR_INVALID_ROLE,                 http: 401, condition: "X-User-Role not in allowed set" }
  - { id: ERR_FORBIDDEN,                    http: 403, condition: "Role not permitted on this endpoint, or entity-backed identity mismatch" }
  - { id: ERR_SEGREGATION_OF_DUTIES,        http: 403, condition: "Reconsideration examiner equals the initial-review examiner on the same application" }
  - { id: ERR_CLAIMANT_NOT_FOUND,           http: 404, condition: "Claimant in path does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND,        http: 404, condition: "Application in path does not exist or belongs to a different claimant" }
  - { id: ERR_RESOURCE_NOT_FOUND,           http: 404, condition: "Any other referenced resource (evidence, QC, slot, child-aux, SSI, CDR review) not found" }
  - { id: ERR_INVALID_STATE,                http: 409, condition: "Operation not valid in current entity state" }
  - { id: ERR_VERSION_MISMATCH,             http: 409, condition: "PATCH body version != stored version (OCC)" }
  - { id: ERR_HEARING_SLOT_CONFLICT,        http: 409, condition: "Booking would overlap another BOOKED/HELD slot for the same ALJ over [start, end)" }
  - { id: ERR_APPLICATION_ALREADY_SCHEDULED,http: 409, condition: "Application already booked into another HearingSlot at status BOOKED or HELD" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED,        http: 409, condition: "Appeal posted after 60 days since the last determination" }
  - { id: ERR_HEARING_NOT_REACHED,          http: 422, condition: "Hold called before start_at, or reschedule after start_at" }
  - { id: ERR_HEARING_NOT_HELD,             http: 422, condition: "ALJ determination posted without an associated HearingSlot.status=HELD" }
  - { id: ERR_QC_INSUFFICIENT,              http: 422, condition: "Claimant fails fully-insured or recent-work QC test" }
  - { id: ERR_EVIDENCE_INSUFFICIENT,        http: 422, condition: "No accepted MedicalEvidence row at submit time" }
  - { id: ERR_AOD_AFTER_FILING,             http: 422, condition: "alleged_onset_date is after filing_date" }
  - { id: ERR_CHILD_INELIGIBLE,             http: 422, condition: "Child age/student/disabled-before-22 rules fail at entitle time" }
  - { id: ERR_SSI_RESOURCES_EXCEEDED,       http: 422, condition: "countable_resources_cents exceeds SSI_RESOURCE_LIMIT_CENTS" }
  - { id: ERR_CDR_NOT_DUE,                  http: 422, condition: "Attempt to schedule CDR earlier than (due_date - 60 days)" }
  - { id: ERR_INVALID_PAGINATION,           http: 422, condition: "limit out of [1,100] or offset < 0" }
  - { id: ERR_BAD_REQUEST,                  http: 400, condition: "Malformed body, missing required field, or invalid enum value" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Claimant
    description: "The disability applicant; owns their own claimant record and applications"
    identity: "entity_backed:Claimant"
    exclusive_operations:
      - "POST /claimants/{claimantId}/applications/{appId}/submit"
      - "POST /claimants/{claimantId}/applications/{appId}/appeal"
      - "POST /claimants/{claimantId}/medical-evidence"
    shared_operations:
      - "POST /claimants (shared with PlatformAdmin)"
      - "GET /claimants/{claimantId} (shared with DDS_Examiner, ALJ, AppealsCouncil, CDR_Reviewer)"
      - "POST /child-auxiliaries (shared with DDS_Examiner)"
      - "POST /ssi-supplements (shared with DDS_Examiner)"
      - "PATCH /ssi-supplements/{id} (shared with DDS_Examiner)"

  - name: DDS_Examiner
    description: "Disability Determination Services examiner who adjudicates INITIAL and RECONSIDERATION"
    identity: "opaque"
    exclusive_operations:
      - "POST /claimants/{claimantId}/medical-evidence/{evidenceId}/accept"
      - "POST /claimants/{claimantId}/medical-evidence/{evidenceId}/reject"
      - "POST /claimants/{claimantId}/applications/{appId}/determinations (level IN {INITIAL, RECONSIDERATION})"
      - "POST /ssi-supplements/{id}/activate"
    shared_operations:
      - "POST /child-auxiliaries/{id}/entitle (shared with PlatformAdmin)"
      - "POST /child-auxiliaries/{id}/terminate (shared with PlatformAdmin)"

  - name: ALJ
    description: "Administrative Law Judge — adjudicates ALJ-level hearings and manages hearing slots"
    identity: "opaque"
    exclusive_operations:
      - "POST /hearing-slots/{slotId}/book"
      - "POST /hearing-slots/{slotId}/hold"
      - "POST /hearing-slots/{slotId}/no-show"
      - "POST /hearing-slots/{slotId}/reschedule"
      - "POST /claimants/{claimantId}/applications/{appId}/determinations (level=ALJ)"
    shared_operations:
      - "POST /hearing-slots (shared with PlatformAdmin)"
      - "GET /hearing-slots (shared with AppealsCouncil, Claimant, PlatformAdmin)"

  - name: AppealsCouncil
    description: "Appeals Council reviewer — adjudicates APPEALS_COUNCIL level (DENY or REMAND)"
    identity: "opaque"
    exclusive_operations:
      - "POST /claimants/{claimantId}/applications/{appId}/determinations (level=APPEALS_COUNCIL)"
    shared_operations:
      - "GET /hearing-slots"

  - name: CDR_Reviewer
    description: "Continuing Disability Review reviewer — schedules and completes CDR reviews"
    identity: "opaque"
    exclusive_operations:
      - "POST /cdr-reviews/{id}/schedule"
      - "POST /cdr-reviews/{id}/complete"
    shared_operations:
      - "GET /cdr-reviews (shared with PlatformAdmin)"

  - name: PlatformAdmin
    description: "Operator with override and test-driving capability"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
    shared_operations:
      - "Most read endpoints, plus POST /claimants and create/terminate ChildAuxiliary"
