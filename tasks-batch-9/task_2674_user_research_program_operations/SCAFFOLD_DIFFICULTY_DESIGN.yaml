          Entity pair Readout -> Finding: the write target is a Readout but the gate is the state of the
          Findings it cites. Delivery is refused while the cited finding is only EVIDENCE_LOCKED and
          becomes possible the moment a second user publishes it, which also proves the guard reads the
          cited finding's live state rather than a flag copied onto the readout at draft time.
