            - { call: "POST /fsa/staff-engagements/${eng_i}/classification-review", payload: { approved_type: "CONTRACTOR", rationale: "independent" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/staff-engagements/${eng_i}/activate", payload: {}, as: ProjectLead, as_user_id: "${p_i}" }
