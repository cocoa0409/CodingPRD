              captures: { pl1: $.data.id, tiv1: $.data.insured_tiv_cents }
          assert:
            - "eid1 == ERR_DATE_RANGE_INVALID with HTTP 422 - priority 45 beats both the 412 and the 422 that the same body also earns"
            - "eid2 == ERR_STALE_PROJECT_VERSION with HTTP 412 - with the dates fixed, priority 50 beats priority 70"
            - "eid3 == ERR_EXISTING_STRUCTURE_NOT_APPLICABLE with HTTP 422 - the last remaining defect"
            - "the fourth call returns HTTP 201 with tiv1 == 400000000 - the uninsured existing structure drops out of insured_tiv_cents"
            - "GET /builders-risk/projects/${p1} reports version == p1v + 1 after the whole sequence, so none of the three rejections bumped the project version"

      - name: corner_manager_approval_gate_versus_endorsement_state
        claim_type: priority_conflict
        grounds:
          - validations[priority 24].ERR_MANAGER_APPROVAL_REQUIRED
          - validations[priority 55].ERR_INVALID_ENDORSEMENT_STATE
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / manager_approval_gate_outranks_endorsement_state_and_rejects_decision"
          rationale: "The §1.8 instance decides an already-DECLINED endorsement whose additional_premium_cents is above 500000 as a plain Underwriter, so both rules are live and the priority-24 error is asserted; a second §1.9 instance would repeat that exact pair."

      - name: corner_payee_referential_check_versus_the_reserve_ceiling
        claim_type: priority_conflict
        grounds:
          - validations[priority 100].ERR_PAYEE_NOT_ON_POLICY
          - validations[priority 114].ERR_PAYMENT_EXCEEDS_RESERVE
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / payee_referential_check_outranks_reserve_ceiling_and_rejects_payment"
          rationale: "That instance pays a foreign policy's loss payee an amount that also blows the reserve and asserts the priority-100 error, which is exactly the pair this row would cover."

      - name: corner_loss_date_bounds_against_the_extended_term
        claim_type: temporal_validation
        grounds:
          - validations[priority 82].ERR_LOSS_DATE_OUTSIDE_TERM
          - entities.BuildersRiskPolicy.term_end_date
        excluded_because:
          difficulty_instance: "boundary_precision_check / loss_date_inclusive_bounds_against_the_extended_term_reject_one_day_out"
          rationale: "Both inclusive bounds, and the fact that they move with an approved extension, are pinned there with a one-day-out rejection on each side."

      - name: corner_testing_notice_state_gates_the_testing_allocation
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 97].ERR_TESTING_NOTICE_REQUIRED
          - entities.TestingCommissioningNotice.status
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / testing_commissioning_allocation_requires_approved_notice_covering_the_loss_date"
          rationale: "SCHEDULED, REJECTED and APPROVED-but-not-covering notices are each walked there against the same claim, so the valid/invalid pair for this rule is fully covered."

      - name: corner_facility_state_gates_the_storage_assignment
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 60].ERR_FACILITY_SUSPENDED
          - entities.StorageFacility.status
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / storage_assignment_requires_active_facility_and_rejects_suspended_one"
          rationale: "The SUSPENDED-facility rejection and the reinstatement that lets the identical request through are both asserted there."

      - name: corner_facility_capacity_aggregate_validation
        claim_type: aggregate_validation
        grounds:
          - validations[priority 110].ERR_FACILITY_CAPACITY_EXCEEDED
          - calculations.facility_overlap_exposure
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / facility_capacity_uses_peak_overlap_and_admits_adjacent_handoffs"
          rationale: "Individually admissible assignments that collectively exceed the facility capacity at one instant, plus the equality-passes boundary, are asserted there."

      - name: corner_testing_window_conflict_temporal_validation
        claim_type: temporal_validation
        grounds:
          - validations[priority 80].ERR_TESTING_WINDOW_CONFLICT
          - calculations.testing_window_separation
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / testing_window_hot_work_buffer_is_symmetric_and_rejects_a_one_second_shortfall"
          rationale: "The operation-valid-now-but-conflicting-later detection for testing windows, including the hot-work buffer in both directions, is pinned there."

  - section: errors
    instances:
      - name: corner_every_not_found_error_id_is_reachable_from_an_empty_database
        claim_type: not_found
        grounds:
          - validations[priority 30].path-parameter not-found
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_COVERAGE_PART_NOT_FOUND]
          - errors[ERR_INTEREST_NOT_FOUND]
          - errors[ERR_ENDORSEMENT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_PAYMENT_NOT_FOUND]
          - errors[ERR_NOTICE_NOT_FOUND]
          - errors[ERR_FACILITY_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
        distinguishing_aspect: "Each of the ten entity families returns its OWN not-found error id for the same syntactically valid but unknown UUID - a shared generic ERR_NOT_FOUND would fail all ten assertions - and every one of them is a 404 even though the database is completely empty."
        test_recipe:
          setup:
            - "Empty database; no calls other than the reads below."
          setup_api_calls: []
          trigger:
