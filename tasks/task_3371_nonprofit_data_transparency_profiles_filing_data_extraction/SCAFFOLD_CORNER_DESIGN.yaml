              as: DataConsumer
              as_user_id: "${k_id}"
              captures: { g_prefix: "$.data.id" }
          assert:
            - "Grant.${g_exact}.match_score == 30 and recipient_match_status == UNMATCHED — the exact-name points alone stay below the 40 AMBIGUOUS floor"
            - "Grant.${g_prefix}.match_score == 18 and recipient_match_status == UNMATCHED — the 12-character prefix rule is worth less than the exact rule"
            - "Grant.${g_exact}.match_score > Grant.${g_prefix}.match_score"

      - name: funder_prospects_rank_by_score_then_history_then_created_at
        claim_type: Correct Result
        grounds:
