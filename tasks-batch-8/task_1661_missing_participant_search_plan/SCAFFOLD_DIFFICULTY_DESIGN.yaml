            - "Case in DISTRIBUTION_IN_PROGRESS with one participant (250000, vested 100%). Blackout [2026-11-01, 2026-11-05) scheduled after begin-distributions; BLACKOUT_ADVISORY issued 2026-10-01 (31 days before start, within the [60,30]-day window measured backwards from 2026-11-01); blackout activated at 2026-11-02."
