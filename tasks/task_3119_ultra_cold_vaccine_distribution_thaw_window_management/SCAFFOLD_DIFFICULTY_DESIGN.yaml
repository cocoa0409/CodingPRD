              as: DistributionPlanner
            - call: "POST /vaccine-distribution/dispatches"
              payload: { site_order_id: "${order2_id}", storage_site_id: "${site2_id}", entry_route: "DIRECT_ULTRA_COLD" }
              as: LogisticsOperator
              captures: { disp2_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-orders"
              payload: { allocation_entitlement_id: "${ent_id}", storage_site_id: "${site2_id}", requested_cartons: 1, requested_doses: 0 }
              as: SiteCoordinator
              as_user_id: "${site2_id}"
              captures: { order3_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-orders/${order3_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site2_id}"
          trigger:
            - call: "POST /vaccine-distribution/dispatches/${disp2_id}/pack"
              payload: {}
              as: LogisticsOperator
              captures: { state_error: "$.data.error_id" }
            - call: "POST /vaccine-distribution/dispatches/${disp2_id}/deliver"
