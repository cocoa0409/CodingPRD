# =============================================================================
# PRD Benchmark Scaffold — Busy Season Resource Scheduling (public accounting firm)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in sibling files.
# =============================================================================

scenario: |
  2306. Busy Season Resource Scheduling (public accounting firm): engagement inventory with expected hours by phase, deadline and required skill or industry specialization, staff availability accounting for time off, licensure study leave and training commitments, scheduling optimization across concurrent deadlines with partner and manager review capacity as constraints, independence and rotation requirements limiting who may serve certain clients, real-time reschedule when client readiness slips or scope expands, overtime, burnout and turnover risk monitoring with workload caps, offshore and shared service center work allocation with review responsibility, realization analysis by engagement and staffing model

domain_name: busy-season-resource-scheduling
api_prefix: /scheduling

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no nested ownership URLs except
  # the two reverse-reachability sub-resource reads (time-entries, availability-exceptions).

  state_machine_shape: parallel
  # Assignment carries two INDEPENDENT dimensions (staffing_status x review_status);
  # review_status is cyclic (IN_REVIEW -> REWORK_REQUESTED -> IN_REVIEW);
  # Engagement is cyclic (IN_FIELDWORK -> CLIENT_BLOCKED -> IN_FIELDWORK) and
  # EngagementPhase.staffing_status is compound (derived from child Assignment rows).

  relationship_patterns:
    - one_to_many          # Engagement -> EngagementPhase -> Assignment
    - self_referential     # Assignment.review_owner_staff_id and Assignment.staff_member_id both point at StaffMember; a StaffMember reviews another StaffMember's work
    - cross_aggregate      # Assignment charges ReviewCapacityWindow (a StaffMember-owned aggregate) and WorkloadWaiver spans StaffMember x Engagement

  role_model: segregation_of_duties
  # The executing staff of an Assignment may never review it; the approver of a
  # WorkloadWaiver may never be its beneficiary.

  consistency_model: immediate

  difficulty: expert_plus
  # Above the Expert band of §0.4 by deliberate instruction: 11 entities, 7 state
  # machines (2 on one entity), 13 calculations with 2 cross-domain dual-variant
  # pairs, 2 OCC rules, and a 4-deep cascade. Density, not padding: every entity
  # participates in at least one calculation AND one cross-entity precondition.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, required: true, description: "Client legal name.", constraints: "1..120 chars" }
      - { name: industry_code, type: enum, source: input, required: true, description: "Industry the client operates in; matched against StaffMember.industry_specialization.", constraints: "FINANCIAL_SERVICES | MANUFACTURING | GOVERNMENT | TECHNOLOGY | HEALTHCARE" }
      - { name: public_interest_entity, type: boolean, source: input, required: false, default: false, description: "True for listed/PIE clients; shortens the partner rotation limit." }
      - { name: fiscal_year_end, type: string, source: input, required: true, description: "Client fiscal year end, ISO date (YYYY-MM-DD)." }
      - { name: partner_rotation_limit_years, type: integer, source: computed, required: true, description: "5 when public_interest_entity is true, else 7. See calculations.partner_rotation_check." }
      - { name: engagement_count, type: integer, source: computed, required: true, description: "Count of Engagement rows with client_id == this Client.id and status != DELIVERED." }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, required: true, description: "Staff member name.", constraints: "1..120 chars" }
      - { name: level, type: enum, source: input, required: true, description: "Grade in the firm hierarchy; matched against EngagementPhase.required_level.", constraints: "STAFF | SENIOR | MANAGER | PARTNER" }
      - { name: service_center, type: enum, source: input, required: true, description: "Delivery location; OFFSHORE work must carry a domestic review owner.", constraints: "DOMESTIC | OFFSHORE" }
      - { name: industry_specialization, type: enum, source: input, required: true, description: "Specialization matched against EngagementPhase.required_industry_specialization.", constraints: "FINANCIAL_SERVICES | MANUFACTURING | GOVERNMENT | TECHNOLOGY | HEALTHCARE" }
      - { name: cpa_licensed, type: boolean, source: input, required: true, description: "True when the staff member holds an active CPA licence." }
      - { name: base_weekly_cap_hours, type: number, source: input, required: true, description: "Contracted weekly hour cap before tier multiplier and waivers.", constraints: "20.00 <= x <= 60.00, 2 decimals" }
      - { name: hourly_bill_rate, type: number, source: input, required: true, description: "Standard hourly billing rate used by calculations.engagement_realization.", constraints: "50.00 <= x <= 900.00, 2 decimals" }
      - { name: review_capable, type: boolean, source: computed, required: true, description: "True when level IN {MANAGER, PARTNER} AND service_center == DOMESTIC." }
      - { name: committed_hours_current_week, type: number, source: computed, required: true, description: "calculations.weekly_committed_hours for the ISO week containing the logical clock date." }
      - { name: effective_weekly_cap_hours, type: number, source: computed, required: true, description: "calculations.effective_weekly_cap for the ISO week containing the logical clock date." }
      - { name: daily_capacity_hours, type: number, source: computed, required: true, description: "round_half_up(effective_weekly_cap_hours / 5, 2); baseline for the per-date aggregate check (calculations.staff_daily_capacity)." }
      - { name: workload_status, type: enum, source: computed, required: true, description: "GREEN when committed_hours_current_week <= base_weekly_cap_hours; AMBER when it exceeds base_weekly_cap_hours but <= effective_weekly_cap_hours; RED when it exceeds effective_weekly_cap_hours.", constraints: "GREEN | AMBER | RED" }
      - { name: burnout_risk_score_actual, type: number, source: computed, required: true, description: "calculations.burnout_risk_score variant actual_trailing." }
      - { name: burnout_risk_score_committed, type: number, source: computed, required: true, description: "calculations.burnout_risk_score variant committed_forward." }
      - { name: turnover_risk_band, type: enum, source: computed, required: true, description: "Band over max(burnout_risk_score_actual, burnout_risk_score_committed): LOW < 3.00, ELEVATED 3.00..5.99, HIGH >= 6.00.", constraints: "LOW | ELEVATED | HIGH" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, required: true, description: "FK -> Client.id; the client served by this engagement." }
      - { name: engagement_partner_staff_id, type: string, source: input, required: true, description: "FK -> StaffMember.id; must have level == PARTNER and service_center == DOMESTIC." }
      - { name: service_line, type: enum, source: input, required: true, description: "Service line of the engagement.", constraints: "AUDIT | TAX | ADVISORY" }
      - { name: busy_season_year, type: integer, source: input, required: true, description: "Busy season the engagement belongs to; consecutive years for the same (client, partner) drive rotation.", constraints: "2020 <= x <= 2035" }
      - { name: deadline_date, type: string, source: input, required: true, description: "Statutory/agreed delivery deadline, ISO date. No EngagementPhase.window_end_date may fall after it." }
      - { name: budget_fee_amount, type: number, source: input, required: true, description: "Agreed fee for the engagement; numerator of calculations.engagement_realization.", constraints: "> 0, 2 decimals" }
      - { name: status, type: enum, source: system, required: true, default: SETUP, description: "Lifecycle state; see state_machines.Engagement.", constraints: "SETUP | SCHEDULED | IN_FIELDWORK | CLIENT_BLOCKED | DELIVERED" }
      - { name: pre_block_status, type: enum, source: system, required: false, default: null, description: "Status the engagement held immediately before entering CLIENT_BLOCKED; the clear-client-block transition returns to it. Null whenever status != CLIENT_BLOCKED.", constraints: "SCHEDULED | IN_FIELDWORK | null" }
      - { name: client_block_count, type: integer, source: computed, required: true, default: 0, description: "Number of completed IN_FIELDWORK/SCHEDULED -> CLIENT_BLOCKED transitions on this engagement." }
      - { name: scope_change_count, type: integer, source: computed, required: true, default: 0, description: "Number of successful expand-scope calls across this engagement's phases." }
      - { name: staffing_completion_pct, type: number, source: computed, required: true, description: "calculations.engagement_staffing_completion." }
      - { name: schedule_risk_band, type: enum, source: computed, required: true, description: "calculations.engagement_schedule_risk.", constraints: "LOW | MEDIUM | HIGH" }
      - { name: realization_pct_provisional, type: number, source: computed, required: true, description: "calculations.engagement_realization variant provisional_committed." }
      - { name: realization_pct_final, type: number, source: computed, required: true, description: "calculations.engagement_realization variant final_logged." }

  - name: EngagementPhase
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, required: true, description: "FK -> Engagement.id; owning engagement." }
      - { name: phase_type, type: enum, source: input, required: true, description: "Phase of the engagement inventory.", constraints: "PLANNING | INTERIM | FIELDWORK | REVIEW | WRAP_UP" }
      - { name: expected_hours, type: number, source: input, required: true, description: "Hours the phase is expected to consume; grows with expand-scope.", constraints: "> 0, 2 decimals" }
      - { name: window_start_date, type: string, source: input, required: true, description: "First calendar date of the phase window, ISO date. Window is CLOSED-INCLUSIVE on both ends." }
      - { name: window_end_date, type: string, source: input, required: true, description: "Last calendar date of the phase window, ISO date, inclusive; must be >= window_start_date and <= Engagement.deadline_date." }
      - { name: required_level, type: enum, source: input, required: true, description: "Exact StaffMember.level an Assignment on this phase must have.", constraints: "STAFF | SENIOR | MANAGER | PARTNER" }
      - { name: required_industry_specialization, type: enum, source: input, required: false, default: null, description: "When non-null, the assigned StaffMember.industry_specialization must equal it.", constraints: "FINANCIAL_SERVICES | MANUFACTURING | GOVERNMENT | TECHNOLOGY | HEALTHCARE | null" }
      - { name: requires_cpa_licensed, type: boolean, source: input, required: false, default: false, description: "When true, only StaffMember rows with cpa_licensed == true may be assigned." }
      - { name: staffing_status, type: enum, source: system, required: true, default: NOT_STAFFED, description: "Compound state derived from child Assignment rows until explicitly started; see state_machines.EngagementPhase.", constraints: "NOT_STAFFED | PARTIALLY_STAFFED | FULLY_STAFFED | IN_PROGRESS | COMPLETE" }
      - { name: staffed_hours, type: number, source: computed, required: true, description: "calculations.phase_staffing_derivation output: sum of allocated_hours over non-RELEASED Assignment rows." }
      - { name: unstaffed_hours, type: number, source: computed, required: true, description: "calculations.phase_staffing_derivation output: round_half_up(max(0, expected_hours - staffed_hours), 2)." }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: engagement_phase_id, type: string, source: input, required: true, description: "FK -> EngagementPhase.id; phase the work is booked against." }
      - { name: staff_member_id, type: string, source: input, required: true, description: "FK -> StaffMember.id; the staff member executing the work." }
      - { name: start_date, type: string, source: input, required: true, description: "First occupied calendar date, ISO date. Occupation interval is HALF-OPEN [start_date, end_date)." }
      - { name: end_date, type: string, source: input, required: true, description: "Exclusive upper bound of the occupation interval, ISO date; must be > start_date. Last worked day is end_date minus one day." }
      - { name: allocated_hours, type: number, source: input, required: true, description: "Hours booked for this assignment.", constraints: "> 0, <= 400.00, 2 decimals" }
      - { name: review_owner_staff_id, type: string, source: input, required: false, default: null, description: "FK -> StaffMember.id; domestic reviewer accountable for this work. Required when rate_model == OFFSHORE_SHARED_SERVICE, forbidden otherwise." }
      - { name: review_capacity_window_id, type: string, source: computed, required: false, default: null, description: "FK -> ReviewCapacityWindow.id; the reviewer's weekly window charged by this assignment, selected by calculations.offshore_review_charge. Null when review_hours_charged == 0." }
      - { name: daily_hours, type: number, source: computed, required: true, description: "calculations.assignment_daily_hours: round_half_up(allocated_hours / calendar_day_count, 2)." }
      - { name: calendar_day_count, type: integer, source: computed, required: true, description: "(end_date - start_date) in days; >= 1 by validation." }
      - { name: rate_model, type: enum, source: computed, required: true, description: "ONSHORE_STANDARD when the staff member's service_center == DOMESTIC, OFFSHORE_SHARED_SERVICE when OFFSHORE.", constraints: "ONSHORE_STANDARD | OFFSHORE_SHARED_SERVICE" }
      - { name: review_hours_charged, type: number, source: computed, required: true, default: 0, description: "calculations.offshore_review_charge output charged against review_capacity_window_id." }
      - { name: fit_score, type: number, source: computed, required: true, description: "calculations.staff_fit_score at creation time; 0.00 for assignments created without the selector." }
      - { name: staffing_status, type: enum, source: system, required: true, default: PROPOSED, description: "Staffing dimension; see state_machines.Assignment.staffing_status.", constraints: "PROPOSED | CONFIRMED | ACTIVE | COMPLETED | RELEASED" }
      - { name: review_status, type: enum, source: system, required: true, description: "Review dimension, independent of staffing_status; initialised to PENDING_REVIEW when rate_model == OFFSHORE_SHARED_SERVICE else NOT_REQUIRED. See state_machines.Assignment.review_status.", constraints: "NOT_REQUIRED | PENDING_REVIEW | IN_REVIEW | REWORK_REQUESTED | REVIEW_ACCEPTED" }
      - { name: rework_cycles, type: integer, source: computed, required: true, default: 0, description: "Count of IN_REVIEW -> REWORK_REQUESTED transitions on this assignment; capped by MAX_REWORK_CYCLES." }
      - { name: superseded_by_assignment_id, type: string, source: system, required: false, default: null, description: "FK -> Assignment.id; set on the old assignment when reassign creates its replacement (self-referential)." }

  - name: AvailabilityException
    parent: null
    common_fields: false
    fields:
      - { name: staff_member_id, type: string, source: input, required: true, description: "FK -> StaffMember.id; staff member whose availability is reduced." }
      - { name: exception_type, type: enum, source: input, required: true, description: "Reason for reduced availability.", constraints: "PTO | LICENSURE_STUDY_LEAVE | TRAINING | FIRM_HOLIDAY" }
      - { name: start_date, type: string, source: input, required: true, description: "First affected calendar date, ISO date. Window is CLOSED-INCLUSIVE on both ends." }
      - { name: end_date, type: string, source: input, required: true, description: "Last affected calendar date, ISO date, inclusive; must be >= start_date." }
      - { name: available_hours_per_day, type: number, source: input, required: true, description: "Hours the staff member can still work on each covered date; 0.00 means fully unavailable.", constraints: "0.00 <= x <= 8.00, 2 decimals" }

  - name: TimeEntry
    parent: null
    common_fields: false
    fields:
      - { name: assignment_id, type: string, source: input, required: true, description: "FK -> Assignment.id; assignment the hours are logged against." }
      - { name: work_date, type: string, source: input, required: true, description: "Date the hours were worked, ISO date; must satisfy start_date <= work_date < end_date of the assignment." }
      - { name: hours, type: number, source: input, required: true, description: "Hours logged on work_date.", constraints: "0.25 <= x <= 16.00, 2 decimals" }
      - { name: entry_type, type: enum, source: input, required: true, description: "Nature of the logged hours; all three types count toward logged hours in calculations.", constraints: "EXECUTION | REVIEW | REWORK" }

  - name: IndependenceRestriction
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, required: true, description: "FK -> Client.id; client the staff member may not serve." }
      - { name: staff_member_id, type: string, source: input, required: true, description: "FK -> StaffMember.id; restricted staff member." }
      - { name: restriction_type, type: enum, source: input, required: true, description: "Independence or rotation ground for the restriction.", constraints: "FINANCIAL_INTEREST | EMPLOYMENT_NEGOTIATION | ROTATION_COOLING_OFF | RELATIVE_EMPLOYED" }
      - { name: effective_start_date, type: string, source: input, required: true, description: "First date the restriction bites, ISO date. Window is CLOSED-INCLUSIVE on both ends." }
      - { name: effective_end_date, type: string, source: input, required: true, description: "Last date the restriction bites, ISO date, inclusive; must be >= effective_start_date." }
      - { name: status, type: enum, source: system, required: true, default: ACTIVE, description: "See state_machines.IndependenceRestriction.", constraints: "ACTIVE | LIFTED" }
      - { name: released_assignment_count, type: integer, source: computed, required: true, default: 0, description: "Number of Assignment rows this restriction forced to RELEASED when it was created." }

  - name: ReviewCapacityWindow
    parent: null
    common_fields: true
    fields:
      - { name: reviewer_staff_id, type: string, source: input, required: true, description: "FK -> StaffMember.id; must have review_capable == true." }
      - { name: week_start_date, type: string, source: input, required: true, description: "Monday that starts the ISO week this window covers, ISO date; must be a Monday." }
      - { name: review_capacity_hours, type: number, source: input, required: true, description: "Reviewer hours available for review work in this ISO week.", constraints: "> 0, <= 40.00, 2 decimals" }
      - { name: committed_review_hours, type: number, source: computed, required: true, default: 0, description: "calculations.review_window_load output: sum of review_hours_charged over Assignment rows whose review_capacity_window_id is this window and staffing_status != RELEASED." }
      - { name: remaining_review_hours, type: number, source: computed, required: true, description: "round_half_up(review_capacity_hours - committed_review_hours, 2)." }

  - name: ReschedulePlan
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, required: true, description: "FK -> Engagement.id; engagement being rescheduled." }
      - { name: trigger_reason, type: enum, source: input, required: true, description: "Why the reschedule is needed.", constraints: "CLIENT_READINESS_SLIP | SCOPE_EXPANSION | STAFF_ATTRITION" }
      - { name: shift_days, type: integer, source: input, required: true, description: "Whole days every phase window of the engagement moves later.", constraints: "0 <= x <= 60" }
      - { name: added_hours, type: number, source: input, required: false, default: 0, description: "Extra expected hours added to the target phase on apply.", constraints: "0 <= x <= 400.00, 2 decimals" }
      - { name: status, type: enum, source: system, required: true, default: DRAFT, description: "See state_machines.ReschedulePlan.", constraints: "DRAFT | SIMULATED | APPLIED | SUPERSEDED" }
      - { name: target_phase_id, type: string, source: computed, required: false, default: null, description: "FK -> EngagementPhase.id; phase that receives added_hours, selected by calculations.reschedule_projection. Null until simulate runs." }
      - { name: simulated_at_engagement_version, type: integer, source: computed, required: false, default: null, description: "Engagement.version observed when simulate ran; null until simulate runs." }
      - { name: simulation_stale, type: boolean, source: computed, required: true, default: true, description: "True when simulated_at_engagement_version is null or != the current Engagement.version." }
      - { name: projected_unstaffed_hours, type: number, source: computed, required: false, default: null, description: "calculations.reschedule_projection output." }
      - { name: projected_dropped_assignment_count, type: integer, source: computed, required: false, default: null, description: "calculations.reschedule_projection output." }
      - { name: projected_cap_breach_count, type: integer, source: computed, required: false, default: null, description: "calculations.reschedule_projection output." }
      - { name: projected_realization_pct, type: number, source: computed, required: false, default: null, description: "calculations.reschedule_projection output." }

  - name: WorkloadWaiver
    parent: null
    common_fields: true
    fields:
      - { name: staff_member_id, type: string, source: input, required: true, description: "FK -> StaffMember.id; beneficiary of the extra weekly allowance." }
      - { name: engagement_id, type: string, source: input, required: true, description: "FK -> Engagement.id; engagement justifying the overtime." }
      - { name: week_start_date, type: string, source: input, required: true, description: "Monday of the ISO week the allowance applies to, ISO date; must be a Monday." }
      - { name: extra_hours_allowance, type: number, source: input, required: true, description: "Additional hours added to the weekly cap for that ISO week when status == APPROVED.", constraints: "0.25 <= x <= 10.00, 2 decimals" }
      - { name: status, type: enum, source: system, required: true, default: REQUESTED, description: "See state_machines.WorkloadWaiver.", constraints: "REQUESTED | APPROVED | DENIED | EXPIRED" }
      - { name: approved_by_user_id, type: string, source: system, required: false, default: null, description: "X-User-ID of the EngagementPartner who approved or denied; never equal to staff_member_id (segregation of duties)." }
      - { name: expiry_reason, type: enum, source: system, required: false, default: null, description: "Why an APPROVED waiver expired.", constraints: "ENGAGEMENT_BLOCKED | RESTRICTION_IMPOSED | null" }

# =============================================================================
# §1.2 State Machine Table
# 7 machines over 6 entities. Assignment carries TWO independent dimensions
# (staffing_status x review_status); review_status and Engagement are cyclic;
# EngagementPhase.staffing_status is compound (derived from Assignment children).
# =============================================================================
state_machines:

  - entity: Engagement
    dimension: status
    initial_state: SETUP
    terminal_states: [DELIVERED]
    transitions:
      - from: SETUP
        to: SCHEDULED
        trigger: "POST /scheduling/engagements/{engagement_id}/schedule"
        actor: SchedulingManager
        preconditions:
          - "Engagement.status == SETUP"
          - "At least one EngagementPhase exists with engagement_id == Engagement.id"
          - "Every EngagementPhase with engagement_id == Engagement.id has staffing_status IN {PARTIALLY_STAFFED, FULLY_STAFFED}"
        side_effects:
          - "Recompute Engagement.staffing_completion_pct (calculations.engagement_staffing_completion)"
          - "Recompute Engagement.schedule_risk_band (calculations.engagement_schedule_risk)"
          - "Increment Engagement.version by 1"

      - from: SCHEDULED
        to: SETUP
        trigger: "system: last non-RELEASED Assignment of every EngagementPhase of this Engagement becomes RELEASED (cascade from POST /scheduling/independence-restrictions or POST /scheduling/assignments/{assignment_id}/release)"
        actor: system
        preconditions:
          - "Engagement.status == SCHEDULED"
          - "Every EngagementPhase with engagement_id == Engagement.id has staffing_status == NOT_STAFFED"
        side_effects:
          - "Set Engagement.staffing_completion_pct to 0.00 (calculations.engagement_staffing_completion)"
          - "Recompute Engagement.schedule_risk_band (calculations.engagement_schedule_risk)"
          - "Increment Engagement.version by 1"
        note: "Revert edge — this is what makes the Engagement machine cyclic on the SETUP<->SCHEDULED pair and is hop 3 of cascade restriction_release_downgrade."

      - from: SCHEDULED
        to: IN_FIELDWORK
        trigger: "POST /scheduling/engagements/{engagement_id}/start-fieldwork"
        actor: SchedulingManager
        preconditions:
          - "Engagement.status == SCHEDULED"
          - "Engagement.staffing_completion_pct >= 50.00"
        side_effects:
          - "Recompute Engagement.schedule_risk_band (calculations.engagement_schedule_risk)"
          - "Increment Engagement.version by 1"

      - from: IN_FIELDWORK
        to: CLIENT_BLOCKED
        trigger: "POST /scheduling/engagements/{engagement_id}/report-client-block"
        actor: SchedulingManager
        preconditions:
          - "Engagement.status IN {SCHEDULED, IN_FIELDWORK}"
        side_effects:
          - "Set Engagement.pre_block_status to the status held immediately before this transition"
          - "Increment Engagement.client_block_count by 1"
          - "Cascade hop 1: every Assignment whose engagement_phase_id belongs to this Engagement and whose staffing_status IN {PROPOSED, CONFIRMED} transitions to RELEASED"
          - "Cascade hop 2: each such release recomputes StaffMember.committed_hours_current_week, StaffMember.workload_status, StaffMember.burnout_risk_score_committed and StaffMember.turnover_risk_band for the released assignment's staff member (calculations.weekly_committed_hours, calculations.burnout_risk_score)"
          - "Cascade hop 3: for each staff member whose recomputed committed_hours_current_week <= base_weekly_cap_hours, every WorkloadWaiver with that staff_member_id, engagement_id == this Engagement.id and status == APPROVED transitions to EXPIRED with expiry_reason == ENGAGEMENT_BLOCKED"
          - "Cascade hop 4: each waiver expiry recomputes StaffMember.effective_weekly_cap_hours and StaffMember.daily_capacity_hours (calculations.effective_weekly_cap), dropping the withdrawn allowance"
          - "Recompute EngagementPhase.staffed_hours, unstaffed_hours and staffing_status for every phase of this Engagement (calculations.phase_staffing_derivation)"
          - "Recompute Engagement.staffing_completion_pct and Engagement.schedule_risk_band"
          - "Increment Engagement.version by 1"
        note: "Cascade name: client_block_release_relax_expire (depth 4). Hop N is caused by hop N-1, not by the original call."

      - from: CLIENT_BLOCKED
        to: IN_FIELDWORK
        trigger: "POST /scheduling/engagements/{engagement_id}/clear-client-block"
        actor: EngagementPartner
        preconditions:
          - "Engagement.status == CLIENT_BLOCKED"
          - "Engagement.pre_block_status == IN_FIELDWORK"
          - "X-User-ID == Engagement.engagement_partner_staff_id"
        side_effects:
          - "Set Engagement.pre_block_status to null"
          - "Recompute Engagement.schedule_risk_band (calculations.engagement_schedule_risk)"
          - "Increment Engagement.version by 1"
        note: "Cycle closure IN_FIELDWORK -> CLIENT_BLOCKED -> IN_FIELDWORK. Released assignments are NOT restored; re-staffing is an explicit new booking."

      - from: CLIENT_BLOCKED
        to: SCHEDULED
        trigger: "POST /scheduling/engagements/{engagement_id}/clear-client-block"
        actor: EngagementPartner
        preconditions:
          - "Engagement.status == CLIENT_BLOCKED"
          - "Engagement.pre_block_status == SCHEDULED"
          - "X-User-ID == Engagement.engagement_partner_staff_id"
        side_effects:
          - "Set Engagement.pre_block_status to null"
          - "Recompute Engagement.schedule_risk_band (calculations.engagement_schedule_risk)"
          - "Increment Engagement.version by 1"

      - from: IN_FIELDWORK
        to: DELIVERED
        trigger: "POST /scheduling/engagements/{engagement_id}/deliver"
        actor: EngagementPartner
        preconditions:
          - "Engagement.status == IN_FIELDWORK"
          - "Every EngagementPhase with engagement_id == Engagement.id has staffing_status == COMPLETE"
          - "X-User-ID == Engagement.engagement_partner_staff_id"
        side_effects:
          - "Recompute Engagement.realization_pct_provisional and Engagement.realization_pct_final (calculations.engagement_realization, both variants)"
          - "Every WorkloadWaiver with engagement_id == this Engagement.id and status == APPROVED transitions to EXPIRED with expiry_reason == ENGAGEMENT_BLOCKED"
          - "Increment Engagement.version by 1"

  - entity: EngagementPhase
    dimension: staffing_status
    initial_state: NOT_STAFFED
    terminal_states: [COMPLETE]
    transitions:
      - from: NOT_STAFFED
        to: PARTIALLY_STAFFED
        trigger: "system: Assignment created (POST /scheduling/assignments, POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff or POST /scheduling/assignments/{assignment_id}/reassign) leaving 0 < staffed_hours < expected_hours"
        actor: system
        preconditions:
          - "EngagementPhase.staffing_status IN {NOT_STAFFED, PARTIALLY_STAFFED, FULLY_STAFFED}"
          - "calculations.phase_staffing_derivation yields 0 < staffed_hours < expected_hours"
        side_effects:
          - "Recompute EngagementPhase.staffed_hours and EngagementPhase.unstaffed_hours"
          - "Recompute Engagement.staffing_completion_pct and Engagement.schedule_risk_band"
          - "Increment EngagementPhase.version by 1"

      - from: PARTIALLY_STAFFED
        to: FULLY_STAFFED
        trigger: "system: Assignment created or expanded leaving staffed_hours >= expected_hours"
        actor: system
        preconditions:
          - "EngagementPhase.staffing_status IN {NOT_STAFFED, PARTIALLY_STAFFED}"
          - "calculations.phase_staffing_derivation yields staffed_hours >= expected_hours"
        side_effects:
          - "Recompute EngagementPhase.staffed_hours and EngagementPhase.unstaffed_hours (unstaffed_hours becomes 0.00)"
          - "Recompute Engagement.staffing_completion_pct and Engagement.schedule_risk_band"
          - "Increment EngagementPhase.version by 1"

      - from: FULLY_STAFFED
        to: PARTIALLY_STAFFED
        trigger: "system: Assignment released (POST /scheduling/assignments/{assignment_id}/release, cascade from report-client-block, cascade from POST /scheduling/independence-restrictions) or POST /scheduling/engagement-phases/{engagement_phase_id}/expand-scope leaving 0 < staffed_hours < expected_hours"
        actor: system
        preconditions:
          - "EngagementPhase.staffing_status IN {FULLY_STAFFED, PARTIALLY_STAFFED}"
          - "calculations.phase_staffing_derivation yields 0 < staffed_hours < expected_hours"
        side_effects:
          - "Recompute EngagementPhase.staffed_hours and EngagementPhase.unstaffed_hours"
          - "Recompute Engagement.staffing_completion_pct and Engagement.schedule_risk_band"
          - "Increment EngagementPhase.version by 1"

      - from: FULLY_STAFFED
        to: NOT_STAFFED
        trigger: "system: last non-RELEASED Assignment of the phase becomes RELEASED"
        actor: system
        preconditions:
          - "EngagementPhase.staffing_status IN {FULLY_STAFFED, PARTIALLY_STAFFED}"
          - "calculations.phase_staffing_derivation yields staffed_hours == 0.00"
        side_effects:
          - "Set EngagementPhase.staffed_hours to 0.00 and EngagementPhase.unstaffed_hours to expected_hours"
          - "Recompute Engagement.staffing_completion_pct and Engagement.schedule_risk_band"
          - "Bubble up: when every EngagementPhase of the Engagement has staffing_status == NOT_STAFFED and Engagement.status == SCHEDULED, the Engagement transitions SCHEDULED -> SETUP"
          - "Increment EngagementPhase.version by 1"

      - from: PARTIALLY_STAFFED
        to: NOT_STAFFED
        trigger: "system: last non-RELEASED Assignment of the phase becomes RELEASED"
        actor: system
        preconditions:
          - "EngagementPhase.staffing_status == PARTIALLY_STAFFED"
          - "calculations.phase_staffing_derivation yields staffed_hours == 0.00"
        side_effects:
          - "Set EngagementPhase.staffed_hours to 0.00 and EngagementPhase.unstaffed_hours to expected_hours"
          - "Recompute Engagement.staffing_completion_pct and Engagement.schedule_risk_band"
          - "Bubble up: when every EngagementPhase of the Engagement has staffing_status == NOT_STAFFED and Engagement.status == SCHEDULED, the Engagement transitions SCHEDULED -> SETUP"
          - "Increment EngagementPhase.version by 1"

      - from: FULLY_STAFFED
        to: IN_PROGRESS
        trigger: "POST /scheduling/engagement-phases/{engagement_phase_id}/start"
        actor: SchedulingManager
        preconditions:
          - "EngagementPhase.staffing_status IN {PARTIALLY_STAFFED, FULLY_STAFFED}"
          - "Engagement.status == IN_FIELDWORK for the phase's engagement_id"
          - "At least one Assignment with engagement_phase_id == EngagementPhase.id has staffing_status == CONFIRMED"
        side_effects:
          - "Freeze derivation: staffing_status is no longer re-derived from staffed_hours while IN_PROGRESS or COMPLETE"
          - "Increment EngagementPhase.version by 1"

      - from: PARTIALLY_STAFFED
        to: IN_PROGRESS
        trigger: "POST /scheduling/engagement-phases/{engagement_phase_id}/start"
        actor: SchedulingManager
        preconditions:
          - "EngagementPhase.staffing_status == PARTIALLY_STAFFED"
          - "Engagement.status == IN_FIELDWORK for the phase's engagement_id"
          - "At least one Assignment with engagement_phase_id == EngagementPhase.id has staffing_status == CONFIRMED"
        side_effects:
          - "Freeze derivation: staffing_status is no longer re-derived from staffed_hours while IN_PROGRESS or COMPLETE"
          - "Increment EngagementPhase.version by 1"

      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /scheduling/engagement-phases/{engagement_phase_id}/complete"
        actor: SchedulingManager
        preconditions:
          - "EngagementPhase.staffing_status == IN_PROGRESS"
          - "At least one Assignment with engagement_phase_id == EngagementPhase.id has staffing_status == ACTIVE"
          - "Every Assignment with engagement_phase_id == EngagementPhase.id and staffing_status == ACTIVE has review_status IN {NOT_REQUIRED, REVIEW_ACCEPTED}"
        side_effects:
          - "Every Assignment with engagement_phase_id == EngagementPhase.id and staffing_status == ACTIVE transitions to COMPLETED"
          - "Recompute Engagement.realization_pct_provisional and Engagement.realization_pct_final (calculations.engagement_realization)"
          - "Increment EngagementPhase.version by 1"

  - entity: Assignment
    dimension: staffing_status
    initial_state: PROPOSED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /scheduling/assignments/{assignment_id}/confirm"
        actor: SchedulingManager
        preconditions:
          - "Assignment.staffing_status == PROPOSED"
          - "Engagement.status IN {SETUP, SCHEDULED, IN_FIELDWORK} for the assignment's phase (a CLIENT_BLOCKED engagement rejects with ERR_ENGAGEMENT_BLOCKED)"
          - "No IndependenceRestriction with status == ACTIVE exists for (client_id of the engagement, Assignment.staff_member_id) whose [effective_start_date, effective_end_date] intersects [Assignment.start_date, Assignment.end_date - 1 day]"
          - "StaffMember.turnover_risk_band != HIGH, OR a WorkloadWaiver with status == APPROVED exists for (Assignment.staff_member_id, the ISO week containing Assignment.start_date)"
        side_effects:
          - "Recompute StaffMember.committed_hours_current_week and StaffMember.workload_status"
          - "Increment Assignment.version by 1"

      - from: CONFIRMED
        to: ACTIVE
        trigger: "POST /scheduling/assignments/{assignment_id}/activate"
        actor: SchedulingManager
        preconditions:
          - "Assignment.staffing_status == CONFIRMED"
          - "EngagementPhase.staffing_status == IN_PROGRESS for Assignment.engagement_phase_id"
        side_effects:
          - "Time entries become loggable against this assignment"
          - "Increment Assignment.version by 1"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system: POST /scheduling/engagement-phases/{engagement_phase_id}/complete on the assignment's phase"
        actor: system
        preconditions:
          - "Assignment.staffing_status == ACTIVE"
          - "Assignment.review_status IN {NOT_REQUIRED, REVIEW_ACCEPTED}"
        side_effects:
          - "Recompute Engagement.realization_pct_provisional and Engagement.realization_pct_final"
          - "Increment Assignment.version by 1"

      - from: PROPOSED
        to: RELEASED
        trigger: "POST /scheduling/assignments/{assignment_id}/release, or system cascade from POST /scheduling/engagements/{engagement_id}/report-client-block, POST /scheduling/independence-restrictions, POST /scheduling/assignments/{assignment_id}/reassign"
        actor: SchedulingManager
        preconditions:
          - "Assignment.staffing_status IN {PROPOSED, CONFIRMED}"
        side_effects:
          - "Compensation: StaffMember.committed_hours_current_week loses exactly this assignment's contribution (calculations.weekly_committed_hours re-run); StaffMember.workload_status, burnout_risk_score_committed and turnover_risk_band recomputed"
          - "ReviewCapacityWindow.committed_review_hours and remaining_review_hours recomputed for Assignment.review_capacity_window_id when non-null (calculations.review_window_load)"
          - "Recompute EngagementPhase.staffed_hours, unstaffed_hours and staffing_status (calculations.phase_staffing_derivation)"
          - "Recompute Engagement.staffing_completion_pct, schedule_risk_band, realization_pct_provisional"
          - "Increment Assignment.version by 1"

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /scheduling/assignments/{assignment_id}/release, or system cascade from POST /scheduling/engagements/{engagement_id}/report-client-block, POST /scheduling/independence-restrictions, POST /scheduling/assignments/{assignment_id}/reassign"
        actor: SchedulingManager
        preconditions:
          - "Assignment.staffing_status IN {PROPOSED, CONFIRMED}"
        side_effects:
          - "Compensation: StaffMember.committed_hours_current_week loses exactly this assignment's contribution; workload_status, burnout_risk_score_committed and turnover_risk_band recomputed"
          - "ReviewCapacityWindow.committed_review_hours and remaining_review_hours recomputed when review_capacity_window_id is non-null"
          - "Recompute EngagementPhase.staffed_hours, unstaffed_hours and staffing_status"
          - "Recompute Engagement.staffing_completion_pct, schedule_risk_band, realization_pct_provisional"
          - "Set Assignment.review_status to NOT_REQUIRED when it was PENDING_REVIEW, IN_REVIEW or REWORK_REQUESTED"
          - "Increment Assignment.version by 1"

  - entity: Assignment
    dimension: review_status
    initial_state: PENDING_REVIEW
    terminal_states: [REVIEW_ACCEPTED, NOT_REQUIRED]
    transitions:
      - from: PENDING_REVIEW
        to: IN_REVIEW
        trigger: "POST /scheduling/assignments/{assignment_id}/start-review"
        actor: EngagementPartner
        preconditions:
          - "Assignment.review_status IN {PENDING_REVIEW, REWORK_REQUESTED}"
          - "Assignment.staffing_status IN {CONFIRMED, ACTIVE}"
          - "X-User-ID == Assignment.review_owner_staff_id"
          - "X-User-ID != Assignment.staff_member_id (segregation of duties)"
        side_effects:
          - "Increment Assignment.version by 1"
        note: "staffing_status is untouched — the two dimensions advance independently."

      - from: IN_REVIEW
        to: REWORK_REQUESTED
        trigger: "POST /scheduling/assignments/{assignment_id}/request-rework"
        actor: EngagementPartner
        preconditions:
          - "Assignment.review_status == IN_REVIEW"
          - "Assignment.rework_cycles < MAX_REWORK_CYCLES (2)"
          - "X-User-ID == Assignment.review_owner_staff_id"
          - "calculations.offshore_review_charge recomputed with rework_cycles + 1 keeps ReviewCapacityWindow.committed_review_hours <= review_capacity_hours"
        side_effects:
          - "Increment Assignment.rework_cycles by 1"
          - "Recompute Assignment.review_hours_charged (calculations.offshore_review_charge) — adds REWORK_REVIEW_HOURS to the same review_capacity_window_id"
          - "Recompute ReviewCapacityWindow.committed_review_hours and remaining_review_hours (calculations.review_window_load)"
          - "Increment Assignment.version by 1"

      - from: REWORK_REQUESTED
        to: IN_REVIEW
        trigger: "POST /scheduling/assignments/{assignment_id}/start-review"
        actor: EngagementPartner
        preconditions:
          - "Assignment.review_status == REWORK_REQUESTED"
          - "Assignment.staffing_status IN {CONFIRMED, ACTIVE}"
          - "X-User-ID == Assignment.review_owner_staff_id"
        side_effects:
          - "Increment Assignment.version by 1"
        note: "Cycle closure IN_REVIEW -> REWORK_REQUESTED -> IN_REVIEW."

      - from: IN_REVIEW
        to: REVIEW_ACCEPTED
        trigger: "POST /scheduling/assignments/{assignment_id}/accept-review"
        actor: EngagementPartner
        preconditions:
          - "Assignment.review_status == IN_REVIEW"
          - "X-User-ID == Assignment.review_owner_staff_id"
          - "X-User-ID != Assignment.staff_member_id (segregation of duties)"
        side_effects:
          - "Increment Assignment.version by 1"

  - entity: IndependenceRestriction
    dimension: status
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /scheduling/independence-restrictions (creation)"
        actor: IndependenceOfficer
        preconditions:
          - "No IndependenceRestriction with status == ACTIVE already exists for the same (client_id, staff_member_id)"
        side_effects:
          - "Cascade hop 1: every Assignment with staffing_status IN {PROPOSED, CONFIRMED} whose staff_member_id == this staff member and whose phase belongs to an Engagement with client_id == this client, and whose [start_date, end_date - 1 day] intersects [effective_start_date, effective_end_date], transitions to RELEASED; released_assignment_count is set to the number released"
          - "Cascade hop 2: each release recomputes EngagementPhase.staffed_hours / unstaffed_hours / staffing_status, downgrading FULLY_STAFFED -> NOT_STAFFED when staffed_hours reaches 0.00 (calculations.phase_staffing_derivation)"
          - "Cascade hop 3: when the downgrade leaves every phase of the engagement NOT_STAFFED and Engagement.status == SCHEDULED, the Engagement transitions SCHEDULED -> SETUP"
          - "Every WorkloadWaiver with this staff_member_id, status == APPROVED and engagement_id among the affected engagements transitions to EXPIRED with expiry_reason == RESTRICTION_IMPOSED"
        note: "Cascade name: restriction_release_downgrade (depth 3). Creation is modelled as the machine's entry transition so the cascade has a home."

      - from: ACTIVE
        to: LIFTED
        trigger: "POST /scheduling/independence-restrictions/{independence_restriction_id}/lift"
        actor: IndependenceOfficer
        preconditions:
          - "IndependenceRestriction.status == ACTIVE"
        side_effects:
          - "Assignments already RELEASED are NOT restored; re-staffing is an explicit new booking"
          - "Increment IndependenceRestriction.version by 1"

  - entity: ReschedulePlan
    dimension: status
    initial_state: DRAFT
    terminal_states: [APPLIED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SIMULATED
        trigger: "POST /scheduling/reschedule-plans/{reschedule_plan_id}/simulate"
        actor: SchedulingManager
        preconditions:
          - "ReschedulePlan.status == DRAFT"
          - "Engagement.status IN {SCHEDULED, IN_FIELDWORK, CLIENT_BLOCKED} for ReschedulePlan.engagement_id"
        side_effects:
          - "Compute ReschedulePlan.target_phase_id, projected_unstaffed_hours, projected_dropped_assignment_count, projected_cap_breach_count and projected_realization_pct (calculations.reschedule_projection)"
          - "Set ReschedulePlan.simulated_at_engagement_version to the current Engagement.version and simulation_stale to false"
          - "Increment ReschedulePlan.version by 1"
        note: "Read-only projection — no phase, assignment or engagement row is mutated."

      - from: SIMULATED
        to: SIMULATED
        trigger: "POST /scheduling/reschedule-plans/{reschedule_plan_id}/simulate (re-simulation after the engagement moved)"
        actor: SchedulingManager
        preconditions:
          - "ReschedulePlan.status == SIMULATED"
        side_effects:
          - "Recompute all projected_* fields (calculations.reschedule_projection)"
          - "Refresh ReschedulePlan.simulated_at_engagement_version and set simulation_stale to false"
          - "Increment ReschedulePlan.version by 1"

      - from: SIMULATED
        to: APPLIED
        trigger: "POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"
        actor: SchedulingManager
        preconditions:
          - "ReschedulePlan.status == SIMULATED"
          - "ReschedulePlan.simulation_stale == false"
          - "Request body expected_engagement_version == Engagement.version (OCC, concurrency_rules.reschedule-apply-stale-engagement)"
        side_effects:
          - "Every EngagementPhase of the engagement has window_start_date and window_end_date moved later by shift_days"
          - "ReschedulePlan.added_hours is added to EngagementPhase.expected_hours of target_phase_id and increments Engagement.scope_change_count by 1 when added_hours > 0"
          - "Every Assignment with staffing_status IN {PROPOSED, CONFIRMED} that no longer fits its shifted phase window transitions to RELEASED (cascading into phase staffing derivation and, when all phases reach NOT_STAFFED with Engagement.status == SCHEDULED, into Engagement SCHEDULED -> SETUP)"
          - "Recompute EngagementPhase.staffed_hours / unstaffed_hours / staffing_status for every phase"
          - "Recompute Engagement.staffing_completion_pct, schedule_risk_band, realization_pct_provisional"
          - "Every other ReschedulePlan of the same engagement with status IN {DRAFT, SIMULATED} transitions to SUPERSEDED"
          - "Increments Engagement.version by 1"
          - "Increment ReschedulePlan.version by 1"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: another ReschedulePlan on the same engagement_id reaches APPLIED"
        actor: system
        preconditions:
          - "ReschedulePlan.status IN {DRAFT, SIMULATED}"
        side_effects:
          - "Set ReschedulePlan.simulation_stale to true"
          - "Increment ReschedulePlan.version by 1"

      - from: SIMULATED
        to: SUPERSEDED
        trigger: "system: another ReschedulePlan on the same engagement_id reaches APPLIED"
        actor: system
        preconditions:
          - "ReschedulePlan.status IN {DRAFT, SIMULATED}"
        side_effects:
          - "Set ReschedulePlan.simulation_stale to true"
          - "Increment ReschedulePlan.version by 1"

  - entity: WorkloadWaiver
    dimension: status
    initial_state: REQUESTED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /scheduling/workload-waivers/{workload_waiver_id}/approve"
        actor: EngagementPartner
        preconditions:
          - "WorkloadWaiver.status == REQUESTED"
          - "X-User-ID == Engagement.engagement_partner_staff_id for WorkloadWaiver.engagement_id"
          - "X-User-ID != WorkloadWaiver.staff_member_id (segregation of duties)"
          - "Engagement.status != DELIVERED"
        side_effects:
          - "Set WorkloadWaiver.approved_by_user_id to X-User-ID"
          - "Recompute StaffMember.effective_weekly_cap_hours and StaffMember.daily_capacity_hours (calculations.effective_weekly_cap) for the waiver's ISO week"
          - "Recompute StaffMember.workload_status"
          - "Increment WorkloadWaiver.version by 1"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /scheduling/workload-waivers/{workload_waiver_id}/deny"
        actor: EngagementPartner
        preconditions:
          - "WorkloadWaiver.status == REQUESTED"
          - "X-User-ID == Engagement.engagement_partner_staff_id for WorkloadWaiver.engagement_id"
          - "X-User-ID != WorkloadWaiver.staff_member_id (segregation of duties)"
        side_effects:
          - "Set WorkloadWaiver.approved_by_user_id to X-User-ID"
          - "Increment WorkloadWaiver.version by 1"

      - from: APPROVED
        to: EXPIRED
        trigger: "system: cascade hop 3 of report-client-block, cascade of POST /scheduling/independence-restrictions, or POST /scheduling/engagements/{engagement_id}/deliver"
        actor: system
        preconditions:
          - "WorkloadWaiver.status == APPROVED"
        side_effects:
          - "Set WorkloadWaiver.expiry_reason to ENGAGEMENT_BLOCKED (client block / delivery) or RESTRICTION_IMPOSED (independence restriction)"
          - "Recompute StaffMember.effective_weekly_cap_hours and StaffMember.daily_capacity_hours, removing the allowance"
          - "Increment WorkloadWaiver.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent's `version` only.
# Both entries are CREATE-with-supersede patterns: a strictly sequential second
# request that carries a version the client observed earlier is rejected with 412.
# =============================================================================
concurrency_rules:
  - rule_id: assignment-reassign-stale-phase
    parent_entity: EngagementPhase
    write_endpoint: "POST /scheduling/assignments/{assignment_id}/reassign"
    occ_field: "expected_phase_version"
    description: |
      Reassigning an Assignment creates a replacement Assignment on the same
      EngagementPhase and releases the original, so the phase's staffing
      composition changes. A reassign whose expected_phase_version no longer
      matches EngagementPhase.version is rejected: the caller's view of the
      phase predates another writer's staffing change, and applying the
      replacement on that stale view would book hours against capacity the
      caller never saw.
    error_id: ERR_STALE_PHASE_VERSION
    http_status: 412

  - rule_id: reschedule-apply-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"
    occ_field: "expected_engagement_version"
    description: |
      Applying a ReschedulePlan shifts every phase window of the engagement and
      legitimately supersedes any other plan on the same engagement. An apply
      whose expected_engagement_version no longer matches Engagement.version is
      rejected, because the projection the caller approved was computed against
      an engagement state that has since advanced.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Shared vocabulary used by every formula below:
#   current_date      = date part of the logical clock (POST /scheduling/_clock/set_current_utc;
#                       startup default 2026-08-01T00:00:00Z)
#   iso_week_start(D) = the Monday on or before date D (ISO weeks start Monday)
#   iso_week_of(D)    = the closed 7-day range [iso_week_start(D), iso_week_start(D) + 6 days]
#   occupied_dates(A) = the HALF-OPEN range [A.start_date, A.end_date) — A.end_date is NOT occupied
#   last_worked_day(A)= A.end_date - 1 day
#   covered_dates(X)  = the CLOSED-INCLUSIVE range [X.start_date, X.end_date] for
#                       AvailabilityException, [X.window_start_date, X.window_end_date] for
#                       EngagementPhase, [X.effective_start_date, X.effective_end_date] for
#                       IndependenceRestriction
#   round_half_up(v,n)= decimal rounding, half away from zero, n fractional digits
# Review hours are tracked EXCLUSIVELY on ReviewCapacityWindow; they never enter
# StaffMember.committed_hours_current_week.
# =============================================================================
calculations:

  - name: assignment_daily_hours
    description: "Flattens an assignment's booked hours into a per-date load used by every capacity check."
    trigger: "POST /scheduling/assignments; POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff; POST /scheduling/assignments/{assignment_id}/reassign"
    algorithm: aggregation
    input_set: "The single Assignment being created; no other rows are read."
    formula: |
      calendar_day_count = (Assignment.end_date - Assignment.start_date) in whole days   # half-open, >= 1
      daily_hours        = round_half_up(Assignment.allocated_hours / calendar_day_count, 2)
    constants:
      MIN_CALENDAR_DAY_COUNT: 1
    precision: "2 decimal places, round_half_up"
    note: "Rounding happens ONCE here, per assignment. Every downstream weekly figure multiplies this rounded daily_hours by a day count, so a 7-day booking of 50.00 hours commits 7 * 7.14 = 49.98 hours, NOT 50.00. This order is pinned and MUST NOT be replaced by allocated_hours * (days_in_week / calendar_day_count)."

  - name: staff_daily_capacity
    description: "The hours a staff member may be booked for on one specific calendar date, honouring time off, licensure study leave and training."
    trigger: "POST /scheduling/assignments; POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff; POST /scheduling/assignments/{assignment_id}/reassign; GET /scheduling/staff-members/{staff_member_id}/workload"
    algorithm: threshold
    input_set: "AvailabilityException rows with staff_member_id == the staff member (at most one may cover any date — validations priority 20 forbids overlap); the staff member's effective_weekly_cap_hours for iso_week_of(date)."
    formula: |
      baseline(date)  = round_half_up(effective_weekly_cap(staff, iso_week_start(date))
                                      / STANDARD_WORK_DAYS_PER_WEEK, 2)
      exception(date) = the AvailabilityException E with E.staff_member_id == staff and
                        date IN covered_dates(E)   # at most one exists by validation
      capacity(date)  = exception(date).available_hours_per_day if such E exists else baseline(date)

      booked(date)    = round_half_up(
                          sum over Assignment A where A.staff_member_id == staff
                            and A.staffing_status IN {PROPOSED, CONFIRMED, ACTIVE, COMPLETED}
                            and date IN occupied_dates(A)
                          of A.daily_hours
                        , 2)
      # aggregate admission test for a candidate assignment N:
      admissible = for EVERY date IN occupied_dates(N): booked(date) + N.daily_hours <= capacity(date)
    constants:
      STANDARD_WORK_DAYS_PER_WEEK: 5
      FULLY_UNAVAILABLE_HOURS: 0.00
    precision: "2 decimal places, round_half_up; comparison is <= (exact equality is admissible)"
    note: "Interval semantics: assignment occupation is HALF-OPEN, so [2026-08-03, 2026-08-10) and [2026-08-10, 2026-08-17) share no date and never aggregate. Availability windows are CLOSED-INCLUSIVE. Capacity is an AGGREGATE per date, not a pairwise overlap ban: two assignments may share dates as long as the summed daily_hours fits."

  - name: effective_weekly_cap
    description: "The weekly hour cap actually enforced for a staff member in one ISO week: base cap scaled by a burnout tier read from the PRIOR week's actuals, plus approved waiver allowance, clamped by an absolute ceiling."
    trigger: "POST /scheduling/assignments; POST /scheduling/assignments/{assignment_id}/reassign; POST /scheduling/workload-waivers/{workload_waiver_id}/approve; WorkloadWaiver APPROVED -> EXPIRED; GET /scheduling/staff-members/{staff_member_id}/workload"
    algorithm: constraint_propagation
    input_set: "TimeEntry rows whose work_date falls in iso_week_of(week_start_date - 7 days) and whose assignment has staff_member_id == the staff member and staffing_status != RELEASED (all entry_types); WorkloadWaiver rows with the same staff_member_id, week_start_date == this week and status == APPROVED."
    formula: |
      prior_week_start = week_start_date - 7 days
      prior_logged     = round_half_up(sum of TimeEntry.hours in iso_week_of(prior_week_start), 2)
      utilization      = round_half_up(prior_logged / base_weekly_cap_hours, 4)

      tier  = GREEN if utilization <= 1.0000
              AMBER if 1.0000 <  utilization <= 1.2500
              RED   if utilization >  1.2500
      multiplier = TIER_MULTIPLIER[tier]

      allowance = round_half_up(sum of WorkloadWaiver.extra_hours_allowance where status == APPROVED, 2)
      raw_cap   = round_half_up(base_weekly_cap_hours * multiplier, 2)
      ceiling   = round_half_up(base_weekly_cap_hours * ABSOLUTE_CEILING_MULTIPLIER, 2)
      effective_weekly_cap_hours = round_half_up(min(raw_cap + allowance, ceiling), 2)
    constants:
      TIER_MULTIPLIER: { GREEN: 1.25, AMBER: 1.15, RED: 1.00 }
      ABSOLUTE_CEILING_MULTIPLIER: 1.40
    precision: "utilization 4 decimals, hours 2 decimals, round_half_up; tier boundaries are <= (1.0000 is GREEN, 1.2500 is AMBER)"
    note: "Evaluation order is pinned to break the apparent circularity: the tier depends on LOGGED hours of the PRIOR ISO week, never on committed hours of the week being capped. A naive reading (tier from this week's committed hours, which are themselves gated by the cap) is undefined and is explicitly rejected."

  - name: weekly_committed_hours
    description: "Forward-looking committed load of a staff member in one ISO week, used for the weekly cap gate and for the committed_forward burnout variant."
    trigger: "POST /scheduling/assignments; POST /scheduling/assignments/{assignment_id}/confirm; Assignment -> RELEASED; POST /scheduling/assignments/{assignment_id}/reassign; GET /scheduling/staff-members/{staff_member_id}/workload"
    algorithm: aggregation
    input_set: "Assignment rows with staff_member_id == the staff member and staffing_status IN {PROPOSED, CONFIRMED, ACTIVE, COMPLETED}; RELEASED rows are excluded. Review hours are excluded by design."
    formula: |
      overlap_days(A, week) = count of dates in occupied_dates(A) that fall inside iso_week_of(week_start_date)
      committed(week) = round_half_up(sum over included A of (A.daily_hours * overlap_days(A, week)), 2)
      # weekly cap gate for a candidate assignment N, evaluated for EVERY ISO week N touches:
      admissible = committed(week) + (N.daily_hours * overlap_days(N, week)) <= effective_weekly_cap(staff, week)
    constants:
      DAYS_PER_WEEK: 7
    precision: "2 decimal places, round_half_up; comparison is <= (exact equality is admissible)"

  - name: offshore_review_charge
    description: "Review hours an offshore/shared-service-center assignment consumes from its domestic review owner's weekly review capacity, including rework."
    trigger: "POST /scheduling/assignments; POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff; POST /scheduling/assignments/{assignment_id}/reassign; POST /scheduling/assignments/{assignment_id}/request-rework"
    algorithm: threshold
    input_set: "The single Assignment; the ReviewCapacityWindow rows with reviewer_staff_id == Assignment.review_owner_staff_id."
    formula: |
      if Assignment.rate_model != OFFSHORE_SHARED_SERVICE:
        review_hours_charged     = 0.00
        review_capacity_window_id = null
      else:
        base   = max(round_half_up(Assignment.allocated_hours * OFFSHORE_REVIEW_RATIO, 2), MIN_REVIEW_BLOCK_HOURS)
        review_hours_charged = round_half_up(base + Assignment.rework_cycles * REWORK_REVIEW_HOURS, 2)
        charge_week = iso_week_start(last_worked_day(Assignment))     # = end_date - 1 day
        review_capacity_window_id = the ReviewCapacityWindow W with
              W.reviewer_staff_id == Assignment.review_owner_staff_id
          AND W.week_start_date == charge_week
        # exactly one such W can exist (uniqueness validation priority 21); when none
        # exists the write is rejected with ERR_REVIEW_WINDOW_MISSING
    constants:
      OFFSHORE_REVIEW_RATIO: 0.20
      MIN_REVIEW_BLOCK_HOURS: 2.00
      REWORK_REVIEW_HOURS: 1.00
    precision: "2 decimal places, round_half_up"
    note: "Interval semantics differ from staff_daily_capacity: the whole charge lands in ONE weekly bucket, keyed by the assignment's LAST WORKED DAY (end_date - 1 day), regardless of how many ISO weeks the assignment spans. A minimum block floors the charge, so a 6.00-hour booking charges 2.00 review hours, not 1.20."

  - name: review_window_load
    description: "Aggregate load on a reviewer's weekly review capacity window."
    trigger: "POST /scheduling/assignments; POST /scheduling/assignments/{assignment_id}/reassign; POST /scheduling/assignments/{assignment_id}/request-rework; Assignment -> RELEASED; POST /scheduling/review-capacity-windows"
    algorithm: aggregation
    input_set: "Assignment rows with review_capacity_window_id == this window and staffing_status IN {PROPOSED, CONFIRMED, ACTIVE, COMPLETED}; RELEASED rows are excluded."
    formula: |
      committed_review_hours = round_half_up(sum of Assignment.review_hours_charged over included rows, 2)
      remaining_review_hours = round_half_up(review_capacity_hours - committed_review_hours, 2)
      admissible = committed_review_hours + candidate.review_hours_charged <= review_capacity_hours
    constants: {}
    precision: "2 decimal places, round_half_up; comparison is <= (exact equality is admissible)"

  - name: staff_fit_score
    description: "Ranking score of a candidate staff member for the auto-staffing selector."
    trigger: "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"
    algorithm: weighted_scoring
    input_set: |
      ELIGIBILITY FILTER (candidate pool = every StaffMember satisfying ALL of):
        (1) StaffMember.level == EngagementPhase.required_level
        (2) EngagementPhase.required_industry_specialization IS null
            OR StaffMember.industry_specialization == EngagementPhase.required_industry_specialization
        (3) EngagementPhase.requires_cpa_licensed == false OR StaffMember.cpa_licensed == true
        (4) StaffMember.service_center == DOMESTIC
        (5) no IndependenceRestriction with status == ACTIVE for
            (Engagement.client_id of the phase, StaffMember.id) whose covered_dates intersect
            [requested start_date, requested end_date - 1 day]
        (6) StaffMember.turnover_risk_band != HIGH
        (7) for EVERY date in [requested start_date, requested end_date):
            booked(date) + candidate_daily_hours <= capacity(date)   (calculations.staff_daily_capacity)
        (8) for EVERY ISO week touched: committed(week) + candidate contribution
            <= effective_weekly_cap(staff, week)                     (calculations.weekly_committed_hours)
    formula: |
      candidate_daily_hours = round_half_up(requested_allocated_hours / calendar_day_count, 2)
      remaining_week = round_half_up(
          effective_weekly_cap(staff, iso_week_start(requested start_date))
        - committed(iso_week_start(requested start_date)), 2)
      slack_ratio  = min(1.0000, round_half_up(remaining_week / EngagementPhase.unstaffed_hours, 4))
                     # unstaffed_hours > 0 is guaranteed: a FULLY_STAFFED phase rejects auto-staff
      fit_score    = round_half_up(
                        LEVEL_MATCH_WEIGHT                                       # always earned: filter (1)
                      + (INDUSTRY_WEIGHT if EngagementPhase.required_industry_specialization IS NOT null else 0)
                      + SLACK_WEIGHT * slack_ratio
                     , 2)

      RANKING:   fit_score DESC
      TIE-BREAK: 1st StaffMember.hourly_bill_rate ASC (cheaper staff first)
                 2nd StaffMember.created_at ASC       (never id)
      SELECTED:  the first candidate under that ordering
      EMPTY POOL: reject with ERR_NO_ELIGIBLE_STAFF (422); no Assignment row is created
    constants:
      LEVEL_MATCH_WEIGHT: 40
      INDUSTRY_WEIGHT: 30
      SLACK_WEIGHT: 30
    precision: "slack_ratio 4 decimals, fit_score 2 decimals, round_half_up"

  - name: engagement_realization
    description: "Realization percentage of an engagement: agreed fee over standard value of the work, computed two ways that diverge on identical data."
    trigger: "POST /scheduling/engagements/{engagement_id}/deliver; POST /scheduling/engagement-phases/{engagement_phase_id}/complete; Assignment -> RELEASED; GET /scheduling/engagements/{engagement_id}/realization"
    algorithm: aggregation
    input_set: |
      provisional_committed: Assignment rows whose engagement_phase_id belongs to this Engagement and
        whose staffing_status IN {PROPOSED, CONFIRMED, ACTIVE, COMPLETED} (RELEASED excluded).
      final_logged: TimeEntry rows whose assignment_id belongs to this Engagement and whose
        assignment.staffing_status IN {CONFIRMED, ACTIVE, COMPLETED} (RELEASED excluded); all
        entry_types (EXECUTION, REVIEW, REWORK) are included.
    formula: |
      effective_rate(A) = round_half_up(StaffMember(A.staff_member_id).hourly_bill_rate
                                        * RATE_MODEL_FACTOR[A.rate_model], 2)

      # variant provisional_committed — one line per ASSIGNMENT
      standard_value_provisional = round_half_up(
          sum over included A of round_half_up(A.allocated_hours * effective_rate(A), 2), 2)
      realization_pct_provisional = round_half_up(
          Engagement.budget_fee_amount / standard_value_provisional * 100, 2)

      # variant final_logged — one line per TIME ENTRY
      standard_value_final = round_half_up(
          sum over included T of round_half_up(T.hours * effective_rate(T.assignment), 2), 2)
      realization_pct_final = round_half_up(
          Engagement.budget_fee_amount / standard_value_final * 100, 2)

      # both variants: when the standard value is 0.00 the percentage is 0.00 (no division)
    constants:
      RATE_MODEL_FACTOR: { ONSHORE_STANDARD: 1.00, OFFSHORE_SHARED_SERVICE: 0.55 }
      PERCENT_SCALE: 100
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_committed
        when: "Any read before the engagement's phases complete, and the value stored in Engagement.realization_pct_provisional."
        difference: "Values the BOOKED allocated_hours of non-released assignments; ignores what was actually logged."
      - name: final_logged
        when: "Engagement.realization_pct_final, refreshed on phase completion and delivery."
        difference: "Values the LOGGED TimeEntry hours; diverges from provisional whenever actual hours differ from booked hours."
    note: "ROUNDING ORDER IS PINNED: round each line (per assignment for provisional, per time entry for final) to 2 decimals FIRST, then sum. Summing raw products and rounding once at the end is a different, rejected reading: 3 entries of 3.33 h at 183.75 give 3 * 611.89 = 1835.67 per-line, but 1835.66 sum-then-round, which shifts the reported percentage."

  - name: burnout_risk_score
    description: "Decay-weighted overtime pressure on a staff member, computed two ways that diverge on identical data: backward over logged hours and forward over committed hours."
    trigger: "POST /scheduling/assignments; POST /scheduling/assignments/{assignment_id}/confirm; POST /scheduling/time-entries; Assignment -> RELEASED; GET /scheduling/staff-members/{staff_member_id}/workload"
    algorithm: decay_function
    input_set: |
      actual_trailing: TimeEntry rows whose assignment.staff_member_id == this staff member and whose
        assignment.staffing_status != RELEASED, bucketed by iso_week_of(work_date), over the 4 ISO
        weeks W0..W3 where W0 = iso_week_start(current_date) and Wi = W0 - (7 * i) days.
      committed_forward: Assignment rows with staff_member_id == this staff member and
        staffing_status IN {PROPOSED, CONFIRMED, ACTIVE, COMPLETED}, bucketed by ISO week over the
        4 ISO weeks W0..W3 where W0 = iso_week_start(current_date) and Wi = W0 + (7 * i) days.
    formula: |
      # variant actual_trailing
      logged(Wi)  = round_half_up(sum of TimeEntry.hours in iso_week_of(Wi), 2)
      overage(Wi) = max(0.00, round_half_up(logged(Wi) - base_weekly_cap_hours, 2))

      # variant committed_forward
      overage(Wi) = max(0.00, round_half_up(committed(Wi) - base_weekly_cap_hours, 2))
                    # committed() per calculations.weekly_committed_hours

      # both variants, same weights, i = 0 is the CURRENT ISO week in both directions
      score = round_half_up(
                (overage(W0)*1.00 + overage(W1)*0.75 + overage(W2)*0.50 + overage(W3)*0.25)
                / DECAY_WEIGHT_SUM
              , 2)

      turnover_risk_band = LOW      if max(score_actual, score_committed) <  3.00
                           ELEVATED if 3.00 <= max(score_actual, score_committed) < 6.00
                           HIGH     if max(score_actual, score_committed) >= 6.00
    constants:
      DECAY_WEIGHTS: [1.00, 0.75, 0.50, 0.25]
      DECAY_WEIGHT_SUM: 2.50
      BAND_ELEVATED_AT: 3.00
      BAND_HIGH_AT: 6.00
      WEEK_WINDOW: 4
    precision: "2 decimal places, round_half_up; band boundaries are >= (exactly 3.00 is ELEVATED, exactly 6.00 is HIGH)"
    variants:
      - name: actual_trailing
        when: "StaffMember.burnout_risk_score_actual — retrospective monitoring."
        difference: "Walks the 4 ISO weeks ENDING at the current week and sums logged TimeEntry hours; a staff member with no logged history scores 0.00 however heavily booked."
      - name: committed_forward
        when: "StaffMember.burnout_risk_score_committed — pre-emptive monitoring that gates confirmation."
        difference: "Walks the 4 ISO weeks STARTING at the current week and sums committed assignment hours; a staff member who has logged nothing but is booked over cap scores above 0.00."

  - name: phase_staffing_derivation
    description: "Derives a phase's staffed/unstaffed hours and its compound staffing_status from its assignment rows."
    trigger: "POST /scheduling/assignments; POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff; POST /scheduling/assignments/{assignment_id}/reassign; Assignment -> RELEASED; POST /scheduling/engagement-phases/{engagement_phase_id}/expand-scope; POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"
    algorithm: aggregation
    input_set: "Assignment rows with engagement_phase_id == this phase and staffing_status IN {PROPOSED, CONFIRMED, ACTIVE, COMPLETED}; RELEASED rows are excluded."
    formula: |
      staffed_hours   = round_half_up(sum of Assignment.allocated_hours over included rows, 2)
      unstaffed_hours = round_half_up(max(0.00, EngagementPhase.expected_hours - staffed_hours), 2)

      if EngagementPhase.staffing_status IN {IN_PROGRESS, COMPLETE}: status is NOT re-derived
      else: staffing_status = NOT_STAFFED       if staffed_hours == 0.00
                              FULLY_STAFFED     if staffed_hours >= EngagementPhase.expected_hours
                              PARTIALLY_STAFFED otherwise
    constants: {}
    precision: "2 decimal places, round_half_up; FULLY_STAFFED boundary is >= (exact equality is FULLY_STAFFED)"
    note: "CONSERVED QUANTITY: staffed_hours + unstaffed_hours == expected_hours holds exactly whenever staffed_hours <= expected_hours, across release, reassign and expand-scope."

  - name: engagement_staffing_completion
    description: "Share of an engagement's expected hours that is currently staffed."
    trigger: "Every EngagementPhase staffing_status transition; POST /scheduling/engagements/{engagement_id}/schedule; POST /scheduling/engagement-phases/{engagement_phase_id}/expand-scope; POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"
    algorithm: aggregation
    input_set: "Every EngagementPhase with engagement_id == this Engagement, in any staffing_status."
    formula: |
      expected_total = round_half_up(sum of EngagementPhase.expected_hours, 2)
      staffed_total  = round_half_up(sum of EngagementPhase.staffed_hours, 2)
      staffing_completion_pct = 0.00 if expected_total == 0.00
                                else round_half_up(min(staffed_total, expected_total)
                                                   / expected_total * 100, 2)
    constants:
      PERCENT_SCALE: 100
    precision: "2 decimal places, round_half_up; capped at 100.00 because over-staffed phases are clamped by min()"

  - name: engagement_schedule_risk
    description: "Risk band of missing an engagement deadline, from staffing completion and days remaining."
    trigger: "Every Engagement status transition; every EngagementPhase staffing_status transition; POST /scheduling/_clock/set_current_utc"
    algorithm: threshold
    input_set: "The Engagement row after staffing_completion_pct has been refreshed, plus the logical clock date."
    formula: |
      days_to_deadline = (Engagement.deadline_date - current_date) in whole days   # may be negative
      # FIRST MATCHING BRANCH WINS, evaluated top to bottom:
      if Engagement.client_block_count >= BLOCK_ESCALATION_COUNT:                        band = HIGH
      elif staffing_completion_pct <  HIGH_COMPLETION_PCT and days_to_deadline <= HIGH_DAYS:   band = HIGH
      elif staffing_completion_pct <  MEDIUM_COMPLETION_PCT and days_to_deadline <= MEDIUM_DAYS: band = MEDIUM
      else:                                                                             band = LOW
    constants:
      HIGH_COMPLETION_PCT: 60.00
      HIGH_DAYS: 30
      MEDIUM_COMPLETION_PCT: 90.00
      MEDIUM_DAYS: 60
      BLOCK_ESCALATION_COUNT: 2
    precision: "percentages 2 decimals; comparisons are strict < on completion and <= on days"

  - name: partner_rotation_check
    description: "Consecutive-years rotation test that decides whether a partner may serve a client for another busy season."
    trigger: "POST /scheduling/engagements"
    algorithm: chronological
    input_set: "Engagement rows with client_id == the requested client_id and engagement_partner_staff_id == the requested engagement_partner_staff_id, in ANY status, ordered by busy_season_year ASC (ties impossible: uniqueness validation priority 22 forbids two engagements on the same (client, partner, busy_season_year))."
    formula: |
      rotation_limit_years = ROTATION_LIMIT_PIE if Client.public_interest_entity else ROTATION_LIMIT_STANDARD
      run = 0
      y   = requested busy_season_year - 1
      while an Engagement exists with (client_id, engagement_partner_staff_id, busy_season_year == y):
          run = run + 1
          y   = y - 1
      consecutive_years_including_request = run + 1
      violation = consecutive_years_including_request > rotation_limit_years   # -> ERR_PARTNER_ROTATION_LIMIT
    constants:
      ROTATION_LIMIT_PIE: 5
      ROTATION_LIMIT_STANDARD: 7
    precision: "integer years; the run walks strictly backwards from busy_season_year - 1 and stops at the first missing year"
    note: "Only an UNBROKEN backwards run counts. A gap year resets the run, which is exactly what a cooling-off period achieves."

  - name: reschedule_projection
    description: "What-if projection of a reschedule: shifted windows, dropped bookings, cap breaches and realization, with no row mutated."
    trigger: "POST /scheduling/reschedule-plans/{reschedule_plan_id}/simulate"
    algorithm: forward_looking
    input_set: "Every EngagementPhase of the plan's engagement_id; every Assignment on those phases with staffing_status IN {PROPOSED, CONFIRMED} (ACTIVE and COMPLETED work is never dropped); the staff members of those assignments."
    formula: |
      target_phase_id = the EngagementPhase of this engagement with the greatest window_start_date;
                        tie-break created_at ASC (never id)
      for each phase P: shifted_start(P) = P.window_start_date + shift_days
                        shifted_end(P)   = P.window_end_date   + shift_days
      shifted_expected(P) = P.expected_hours + (added_hours if P.id == target_phase_id else 0.00)

      kept(A)    = shifted_start(phase of A) <= A.start_date
                   AND last_worked_day(A) <= shifted_end(phase of A)
      projected_dropped_assignment_count = count of included A where kept(A) is false

      projected_unstaffed_hours = round_half_up(
          sum over phases of max(0.00, shifted_expected(P)
              - round_half_up(sum of A.allocated_hours over kept, non-RELEASED A of P, 2)), 2)

      projected_cap_breach_count = count of DISTINCT (staff_member_id, iso_week_start) pairs where
          committed(week) computed over kept assignments only > effective_weekly_cap(staff, week)

      projected_realization_pct = 0.00 if projected standard value == 0.00 else round_half_up(
          Engagement.budget_fee_amount
          / round_half_up(sum over kept, non-RELEASED A of round_half_up(A.allocated_hours
                          * effective_rate(A), 2), 2) * 100, 2)
    constants:
      PERCENT_SCALE: 100
    precision: "hours and percentages 2 decimals, round_half_up; counts are integers"
    note: "Assignment windows are NOT shifted by the projection — only phase windows move, which is why bookings can fall outside their phase and be dropped on apply."

# =============================================================================
# §1.4 Validation Rules Table — evaluated STRICTLY in ascending priority order.
# The first rule that fails determines the response; no later rule is evaluated.
# Domain ordering: auth -> existence -> request shape -> ownership -> state ->
# independence/compliance (safety) -> skill constraints -> referential integrity
# -> temporal geometry -> fiscal capacity -> optimistic concurrency.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every id in the URL path resolves to an existing row, validated left to right"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_PHASE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_RESTRICTION_NOT_FOUND | ERR_REVIEW_WINDOW_NOT_FOUND | ERR_RESCHEDULE_PLAN_NOT_FOUND | ERR_WAIVER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: "Every foreign-key id in the request body resolves to an existing row, validated in the field order declared by the endpoint's input"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_PHASE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /scheduling/engagements, POST /scheduling/engagement-phases, POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/availability-exceptions, POST /scheduling/time-entries, POST /scheduling/independence-restrictions, POST /scheduling/review-capacity-windows, POST /scheduling/reschedule-plans, POST /scheduling/workload-waivers"

  - priority: 6
    category: business_constraint
    check: "All required input fields present; types match; enum values are declared members; numeric fields inside their declared constraints ranges (including EngagementPhase.expected_hours > 0 and Assignment.allocated_hours > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints with a request body"

  - priority: 7
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

  - priority: 8
    category: business_temporal
    check: "Date geometry is well formed: Assignment.end_date > Assignment.start_date (half-open, so calendar_day_count >= 1); EngagementPhase.window_end_date >= window_start_date; AvailabilityException.end_date >= start_date; IndependenceRestriction.effective_end_date >= effective_start_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /scheduling/engagement-phases, POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff, POST /scheduling/availability-exceptions, POST /scheduling/independence-restrictions"

  - priority: 9
    category: business_temporal
    check: "week_start_date is a Monday"
    error_id: ERR_NOT_WEEK_START
    http_status: 422
    applies_to: "POST /scheduling/review-capacity-windows, POST /scheduling/workload-waivers, GET /scheduling/staff-members/{staff_member_id}/workload"

  - priority: 10
    category: auth
    check: "For entity_backed roles acting on their own resource, X-User-ID equals the resource's owning foreign key: EngagementStaff on POST /scheduling/time-entries must equal Assignment.staff_member_id and on POST /scheduling/workload-waivers must equal the body staff_member_id; EngagementPartner on engagement-level actions must equal Engagement.engagement_partner_staff_id; EngagementPartner on review actions must equal Assignment.review_owner_staff_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /scheduling/time-entries, POST /scheduling/workload-waivers, POST /scheduling/engagements/{engagement_id}/clear-client-block, POST /scheduling/engagements/{engagement_id}/deliver, POST /scheduling/assignments/{assignment_id}/start-review, POST /scheduling/assignments/{assignment_id}/request-rework, POST /scheduling/assignments/{assignment_id}/accept-review, POST /scheduling/workload-waivers/{workload_waiver_id}/approve, POST /scheduling/workload-waivers/{workload_waiver_id}/deny"

  - priority: 11
    category: state
    check: "The target row is in a state the transition allows (per §1.2), including terminal-state lockdown"
    error_id: "ERR_ENGAGEMENT_INVALID_STATE | ERR_PHASE_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_REVIEW_INVALID_STATE | ERR_RESTRICTION_INVALID_STATE | ERR_PLAN_INVALID_STATE | ERR_WAIVER_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints; plus POST /scheduling/assignments (the targeted EngagementPhase must not be COMPLETE) and POST /scheduling/time-entries (the targeted Assignment must have staffing_status IN {ACTIVE, COMPLETED})"

  - priority: 12
    category: state
    check: "The Engagement owning the targeted phase/assignment has status IN {SETUP, SCHEDULED, IN_FIELDWORK} — a CLIENT_BLOCKED or DELIVERED engagement accepts no staffing write"
    error_id: ERR_ENGAGEMENT_BLOCKED
    http_status: 409
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/confirm, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/engagement-phases, POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff, POST /scheduling/engagement-phases/{engagement_phase_id}/expand-scope"

  - priority: 13
    category: state
    check: "EngagementPhase.staffing_status == IN_PROGRESS before an assignment on it may be activated or hours may be logged against it"
    error_id: ERR_PHASE_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /scheduling/assignments/{assignment_id}/activate, POST /scheduling/time-entries"

  - priority: 14
    category: business_safety
    check: "No IndependenceRestriction with status == ACTIVE exists for (the engagement's client_id, the target staff_member_id) whose [effective_start_date, effective_end_date] intersects [start_date, end_date - 1 day] of the booking"
    error_id: ERR_INDEPENDENCE_RESTRICTED
    http_status: 409
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/confirm, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"

  - priority: 15
    category: business_safety
    check: "calculations.partner_rotation_check yields consecutive_years_including_request <= Client.partner_rotation_limit_years"
    error_id: ERR_PARTNER_ROTATION_LIMIT
    http_status: 409
    applies_to: "POST /scheduling/engagements"

  - priority: 16
    category: business_safety
    check: "Segregation of duties: X-User-ID != Assignment.staff_member_id on review actions; X-User-ID != WorkloadWaiver.staff_member_id on waiver approve/deny; Assignment.review_owner_staff_id != Assignment.staff_member_id at booking time"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/assignments/{assignment_id}/start-review, POST /scheduling/assignments/{assignment_id}/accept-review, POST /scheduling/workload-waivers/{workload_waiver_id}/approve, POST /scheduling/workload-waivers/{workload_waiver_id}/deny"

  - priority: 17
    category: business_safety
    check: "StaffMember.turnover_risk_band != HIGH, unless a WorkloadWaiver with status == APPROVED exists for (that staff member, the ISO week containing Assignment.start_date)"
    error_id: ERR_TURNOVER_RISK_BLOCK
    http_status: 409
    applies_to: "POST /scheduling/assignments/{assignment_id}/confirm"

  - priority: 18
    category: business_constraint
    check: "StaffMember.level == EngagementPhase.required_level"
    error_id: ERR_LEVEL_MISMATCH
    http_status: 422
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign"

  - priority: 19
    category: business_constraint
    check: "EngagementPhase.required_industry_specialization IS null OR StaffMember.industry_specialization equals it"
    error_id: ERR_SPECIALIZATION_MISMATCH
    http_status: 422
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign"

  - priority: 20
    category: business_constraint
    check: "EngagementPhase.requires_cpa_licensed == false OR StaffMember.cpa_licensed == true"
    error_id: ERR_LICENSURE_REQUIRED
    http_status: 422
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign"

  - priority: 21
    category: business_referential
    check: "review_owner_staff_id is present when the assigned staff member's service_center == OFFSHORE, and absent when it is DOMESTIC"
    error_id: ERR_REVIEW_OWNER_REQUIRED
    http_status: 422
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign"

  - priority: 22
    category: business_referential
    check: "The referenced review owner has StaffMember.review_capable == true (level IN {MANAGER, PARTNER} AND service_center == DOMESTIC)"
    error_id: ERR_REVIEW_OWNER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign"

  - priority: 23
    category: business_referential
    check: "A ReviewCapacityWindow exists with reviewer_staff_id == review_owner_staff_id and week_start_date == iso_week_start(end_date - 1 day)"
    error_id: ERR_REVIEW_WINDOW_MISSING
    http_status: 422
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"

  - priority: 24
    category: business_referential
    check: "No Engagement already exists with the same (client_id, engagement_partner_staff_id, busy_season_year)"
    error_id: ERR_DUPLICATE_ENGAGEMENT_YEAR
    http_status: 409
    applies_to: "POST /scheduling/engagements"

  - priority: 25
    category: business_referential
    check: "No ReviewCapacityWindow already exists with the same (reviewer_staff_id, week_start_date)"
    error_id: ERR_DUPLICATE_REVIEW_WINDOW
    http_status: 409
    applies_to: "POST /scheduling/review-capacity-windows"

  - priority: 26
    category: business_referential
    check: "No WorkloadWaiver with status IN {REQUESTED, APPROVED} already exists for the same (staff_member_id, week_start_date)"
    error_id: ERR_DUPLICATE_WAIVER
    http_status: 409
    applies_to: "POST /scheduling/workload-waivers"

  - priority: 27
    category: business_referential
    check: "No IndependenceRestriction with status == ACTIVE already exists for the same (client_id, staff_member_id)"
    error_id: ERR_DUPLICATE_RESTRICTION
    http_status: 409
    applies_to: "POST /scheduling/independence-restrictions"

  - priority: 28
    category: business_temporal
    check: "EngagementPhase.window_end_date <= Engagement.deadline_date"
    error_id: ERR_PHASE_WINDOW_AFTER_DEADLINE
    http_status: 422
    applies_to: "POST /scheduling/engagement-phases"

  - priority: 29
    category: business_temporal
    check: "The booking sits inside its phase window: EngagementPhase.window_start_date <= start_date AND (end_date - 1 day) <= EngagementPhase.window_end_date"
    error_id: ERR_ASSIGNMENT_OUTSIDE_PHASE_WINDOW
    http_status: 422
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"

  - priority: 30
    category: business_temporal
    check: "The new AvailabilityException does not intersect any existing AvailabilityException of the same staff member (closed-inclusive windows), so at most one exception governs any date"
    error_id: ERR_EXCEPTION_OVERLAP
    http_status: 409
    applies_to: "POST /scheduling/availability-exceptions"

  - priority: 31
    category: business_temporal
    check: "No date in [start_date, end_date) of the booking is governed by an AvailabilityException with available_hours_per_day == 0.00 for that staff member"
    error_id: ERR_STAFF_UNAVAILABLE
    http_status: 409
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"

  - priority: 32
    category: business_temporal
    check: "For EVERY date in [start_date, end_date): booked(date) + candidate daily_hours <= capacity(date) (calculations.staff_daily_capacity aggregate test)"
    error_id: ERR_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"

  - priority: 33
    category: business_fiscal
    check: "For EVERY ISO week the booking touches: committed(week) + the booking's contribution <= effective_weekly_cap(staff, week) (calculations.weekly_committed_hours)"
    error_id: ERR_WORKLOAD_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"

  - priority: 34
    category: business_fiscal
    check: "committed_review_hours + the booking's review_hours_charged <= ReviewCapacityWindow.review_capacity_hours (calculations.review_window_load)"
    error_id: ERR_REVIEW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /scheduling/assignments, POST /scheduling/assignments/{assignment_id}/reassign, POST /scheduling/assignments/{assignment_id}/request-rework, POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"

  - priority: 35
    category: business_fiscal
    check: "Assignment.rework_cycles < 2 before another rework may be requested"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /scheduling/assignments/{assignment_id}/request-rework"

  - priority: 36
    category: business_temporal
    check: "TimeEntry.work_date satisfies Assignment.start_date <= work_date < Assignment.end_date (the ACTIVE / COMPLETED requirement on the assignment itself is enforced earlier, at priority 11)"
    error_id: ERR_TIME_ENTRY_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /scheduling/time-entries"

  - priority: 37
    category: business_fiscal
    check: "Sum of TimeEntry.hours for the assignment including the new entry <= Assignment.allocated_hours * 1.25"
    error_id: ERR_TIME_ENTRY_EXCEEDS_ALLOCATION
    http_status: 409
    applies_to: "POST /scheduling/time-entries"

  - priority: 38
    category: business_constraint
    check: "ReschedulePlan.simulation_stale == false (simulated_at_engagement_version equals the current Engagement.version)"
    error_id: ERR_SIMULATION_STALE
    http_status: 409
    applies_to: "POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"

  - priority: 39
    category: business_constraint
    check: "EngagementPhase.staffing_status IN {NOT_STAFFED, PARTIALLY_STAFFED} and unstaffed_hours > 0.00 before the selector runs"
    error_id: ERR_PHASE_FULLY_STAFFED
    http_status: 409
    applies_to: "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"

  - priority: 40
    category: business_constraint
    check: "The eligibility filter of calculations.staff_fit_score yields at least one candidate"
    error_id: ERR_NO_ELIGIBLE_STAFF
    http_status: 422
    applies_to: "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"

  - priority: 41
    category: business_constraint
    check: "expected_phase_version equals EngagementPhase.version (concurrency_rules.assignment-reassign-stale-phase)"
    error_id: ERR_STALE_PHASE_VERSION
    http_status: 412
    applies_to: "POST /scheduling/assignments/{assignment_id}/reassign"

  - priority: 42
    category: business_constraint
    check: "expected_engagement_version equals Engagement.version (concurrency_rules.reschedule-apply-stale-engagement)"
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"

  - priority: 43
    category: business_referential
    check: "The referenced engagement_partner_staff_id has StaffMember.level == PARTNER and service_center == DOMESTIC"
    error_id: ERR_PARTNER_LEVEL_REQUIRED
    http_status: 422
    applies_to: "POST /scheduling/engagements"

  - priority: 44
    category: business_referential
    check: "The referenced reviewer_staff_id has StaffMember.review_capable == true"
    error_id: ERR_REVIEW_OWNER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /scheduling/review-capacity-windows"

# =============================================================================
# §1.5 API Endpoint Table — every path sits under the /scheduling prefix.
# 55 endpoints. Two reverse-reachability reads use the sub-resource form
# (they MUST keep the literal {id} segment); every other FK is discoverable
# through a filtered list.
# =============================================================================
endpoints:

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/scheduling/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z (mandatory startup default); it never falls back to real wall-clock time. Every deadline, ISO-week bucket, burnout window and risk band is evaluated against this clock."
    roles: [FirmAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, current_date: string, iso_week_start_date: string }"
    side_effects:
      - "Recompute Engagement.schedule_risk_band for every engagement (calculations.engagement_schedule_risk)"
      - "Recompute StaffMember.committed_hours_current_week, effective_weekly_cap_hours, daily_capacity_hours, workload_status, burnout_risk_score_actual, burnout_risk_score_committed and turnover_risk_band for every staff member"

  # --- Client ---------------------------------------------------------------
  - method: POST
    path: "/scheduling/clients"
    description: "Registers a client of the firm."
    roles: [FirmAdmin]
    code: 201
    input: [name, industry_code, "public_interest_entity?", fiscal_year_end]
    output: Client
    side_effects:
      - "Set Client.partner_rotation_limit_years to 5 when public_interest_entity is true else 7"
      - "Set Client.engagement_count to 0"

  - method: GET
    path: "/scheduling/clients/{client_id}"
    description: "Reads one client."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, IndependenceOfficer]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/scheduling/clients"
    description: "Lists clients with pagination."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, IndependenceOfficer]
    code: 200
    input: ["industry_code?", "public_interest_entity?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  # --- StaffMember ----------------------------------------------------------
  - method: POST
    path: "/scheduling/staff-members"
    description: "Registers a staff member with grade, service center, specialization, licensure and contracted weekly cap."
    roles: [FirmAdmin]
    code: 201
    input: [full_name, level, service_center, industry_specialization, cpa_licensed, base_weekly_cap_hours, hourly_bill_rate]
    output: StaffMember
    side_effects:
      - "Set StaffMember.review_capable per level and service_center"
      - "Set StaffMember.committed_hours_current_week to 0.00 and compute effective_weekly_cap_hours and daily_capacity_hours (calculations.effective_weekly_cap; tier GREEN with no prior-week actuals)"
      - "Set StaffMember.workload_status to GREEN, both burnout scores to 0.00 and turnover_risk_band to LOW"

  - method: GET
    path: "/scheduling/staff-members/{staff_member_id}"
    description: "Reads one staff member including all computed workload and risk fields."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff, IndependenceOfficer]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/scheduling/staff-members"
    description: "Lists staff members, filterable by grade, service center, specialization and turnover risk band."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, IndependenceOfficer]
    code: 200
    input: ["level?", "service_center?", "industry_specialization?", "turnover_risk_band?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  - method: GET
    path: "/scheduling/staff-members/{staff_member_id}/workload"
    description: "Computed read: committed hours, effective cap, daily capacity, workload status and both burnout variants for one ISO week (defaults to the ISO week of the logical clock)."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff]
    code: 200
    input: ["week_start_date?"]
    output: "{ staff_member_id: string, week_start_date: string, committed_hours: number, logged_hours: number, effective_weekly_cap_hours: number, daily_capacity_hours: number, approved_waiver_hours: number, remaining_week_hours: number, workload_status: string, burnout_risk_score_actual: number, burnout_risk_score_committed: number, turnover_risk_band: string }"
    side_effects: []

  - method: GET
    path: "/scheduling/staff-members/{id}/availability-exceptions"
    description: "Reverse-reachability read (sub-resource form): every availability exception of one staff member."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff]
    code: 200
    input: ["exception_type?", "limit?", "offset?"]
    output: AvailabilityException[]
    side_effects: []

  # --- Engagement -----------------------------------------------------------
  - method: POST
    path: "/scheduling/engagements"
    description: "Creates an engagement in the busy-season inventory; runs the partner rotation test."
    roles: [SchedulingManager]
    code: 201
    input: [client_id, engagement_partner_staff_id, service_line, busy_season_year, deadline_date, budget_fee_amount]
    output: Engagement
    side_effects:
      - "Evaluate calculations.partner_rotation_check against prior engagements of the same (client_id, engagement_partner_staff_id)"
      - "Set Engagement.status to SETUP, client_block_count to 0, scope_change_count to 0"
      - "Set Engagement.staffing_completion_pct to 0.00 and compute schedule_risk_band (calculations.engagement_schedule_risk)"
      - "Set Engagement.realization_pct_provisional and realization_pct_final to 0.00"
      - "Increment Client.engagement_count by 1"

  - method: GET
    path: "/scheduling/engagements/{engagement_id}"
    description: "Reads one engagement including derived staffing, risk and realization fields."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff, IndependenceOfficer]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: GET
    path: "/scheduling/engagements"
    description: "Lists engagements, filterable by client, engagement partner, status and risk band."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, IndependenceOfficer]
    code: 200
    input: ["client_id?", "engagement_partner_staff_id?", "status?", "schedule_risk_band?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []

  - method: GET
    path: "/scheduling/engagements/{engagement_id}/realization"
    description: "Computed read: realization analysis of one engagement under both calculation variants, split by staffing model."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner]
    code: 200
    input: []
    output: "{ engagement_id: string, budget_fee_amount: number, committed_hours_total: number, logged_hours_total: number, standard_value_provisional: number, realization_pct_provisional: number, standard_value_final: number, realization_pct_final: number, onshore_standard_value: number, offshore_standard_value: number }"
    side_effects:
      - "Recompute Engagement.realization_pct_provisional and Engagement.realization_pct_final (calculations.engagement_realization, both variants)"

  - method: POST
    path: "/scheduling/engagements/{engagement_id}/schedule"
    description: "Moves a staffed engagement from SETUP to SCHEDULED."
    roles: [SchedulingManager]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "Engagement SETUP -> SCHEDULED"
      - "Recompute Engagement.staffing_completion_pct and schedule_risk_band"
      - "Increments Engagement.version by 1"

  - method: POST
    path: "/scheduling/engagements/{engagement_id}/start-fieldwork"
    description: "Moves a SCHEDULED engagement into fieldwork."
    roles: [SchedulingManager]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "Engagement SCHEDULED -> IN_FIELDWORK"
      - "Recompute Engagement.schedule_risk_band"
      - "Increments Engagement.version by 1"

  - method: POST
    path: "/scheduling/engagements/{engagement_id}/report-client-block"
    description: "Records that client readiness slipped; releases every pending booking and unwinds the workload relief it justified."
    roles: [SchedulingManager]
    code: 200
    input: [reason_note, "blocked_until_date?"]
    output: Engagement
    side_effects:
      - "Engagement {SCHEDULED, IN_FIELDWORK} -> CLIENT_BLOCKED; pre_block_status stored; client_block_count incremented"
      - "Cascade client_block_release_relax_expire hop 1: Assignments in {PROPOSED, CONFIRMED} -> RELEASED"
      - "Cascade hop 2: StaffMember.committed_hours_current_week, workload_status, burnout_risk_score_committed and turnover_risk_band recomputed"
      - "Cascade hop 3: APPROVED WorkloadWaiver rows of the relaxed staff on this engagement -> EXPIRED with expiry_reason ENGAGEMENT_BLOCKED"
      - "Cascade hop 4: StaffMember.effective_weekly_cap_hours and daily_capacity_hours recomputed without the expired allowance"
      - "EngagementPhase.staffed_hours / unstaffed_hours / staffing_status re-derived; Engagement.staffing_completion_pct and schedule_risk_band recomputed"
      - "Increments Engagement.version by 1"

  - method: POST
    path: "/scheduling/engagements/{engagement_id}/clear-client-block"
    description: "Engagement partner confirms the client is ready again; the engagement returns to the status it held before the block."
    roles: [EngagementPartner]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "Engagement CLIENT_BLOCKED -> pre_block_status (IN_FIELDWORK or SCHEDULED); pre_block_status cleared"
      - "Recompute Engagement.schedule_risk_band"
      - "Increments Engagement.version by 1"

  - method: POST
    path: "/scheduling/engagements/{engagement_id}/deliver"
    description: "Engagement partner delivers the engagement once every phase is COMPLETE."
    roles: [EngagementPartner]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "Engagement IN_FIELDWORK -> DELIVERED"
      - "Recompute Engagement.realization_pct_provisional and realization_pct_final"
      - "APPROVED WorkloadWaiver rows of this engagement -> EXPIRED with expiry_reason ENGAGEMENT_BLOCKED"
      - "Increments Engagement.version by 1"

  # --- EngagementPhase ------------------------------------------------------
  - method: POST
    path: "/scheduling/engagement-phases"
    description: "Adds a phase with expected hours, window and required skill profile to an engagement."
    roles: [SchedulingManager]
    code: 201
    input: [engagement_id, phase_type, expected_hours, window_start_date, window_end_date, required_level, "required_industry_specialization?", "requires_cpa_licensed?"]
    output: EngagementPhase
    side_effects:
      - "Set EngagementPhase.staffing_status to NOT_STAFFED, staffed_hours to 0.00, unstaffed_hours to expected_hours"
      - "Recompute Engagement.staffing_completion_pct and schedule_risk_band"
      - "Increments Engagement.version by 1"

  - method: GET
    path: "/scheduling/engagement-phases/{engagement_phase_id}"
    description: "Reads one phase including derived staffing figures."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff]
    code: 200
    input: []
    output: EngagementPhase
    side_effects: []

  - method: GET
    path: "/scheduling/engagement-phases"
    description: "Lists phases, filterable by engagement, phase type and staffing status."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff]
    code: 200
    input: ["engagement_id?", "phase_type?", "staffing_status?", "limit?", "offset?"]
    output: EngagementPhase[]
    side_effects: []

  - method: POST
    path: "/scheduling/engagement-phases/{engagement_phase_id}/expand-scope"
    description: "Client scope expands: raises the phase's expected hours, which re-derives staffing coverage downward."
    roles: [SchedulingManager]
    code: 200
    input: [additional_expected_hours, "reason_note?"]
    output: EngagementPhase
    side_effects:
      - "Increase EngagementPhase.expected_hours by additional_expected_hours"
      - "Recompute EngagementPhase.staffed_hours / unstaffed_hours / staffing_status (calculations.phase_staffing_derivation) — FULLY_STAFFED may downgrade to PARTIALLY_STAFFED"
      - "Increment Engagement.scope_change_count by 1"
      - "Recompute Engagement.staffing_completion_pct and schedule_risk_band"
      - "Increments EngagementPhase.version by 1"

  - method: POST
    path: "/scheduling/engagement-phases/{engagement_phase_id}/start"
    description: "Starts fieldwork on a phase, freezing its derived staffing status."
    roles: [SchedulingManager]
    code: 200
    input: []
    output: EngagementPhase
    side_effects:
      - "EngagementPhase {PARTIALLY_STAFFED, FULLY_STAFFED} -> IN_PROGRESS"
      - "Increments EngagementPhase.version by 1"

  - method: POST
    path: "/scheduling/engagement-phases/{engagement_phase_id}/complete"
    description: "Completes a phase once every active booking has passed review."
    roles: [SchedulingManager]
    code: 200
    input: []
    output: EngagementPhase
    side_effects:
      - "EngagementPhase IN_PROGRESS -> COMPLETE"
      - "Every ACTIVE Assignment of the phase -> COMPLETED"
      - "Recompute Engagement.realization_pct_provisional and realization_pct_final"
      - "Increments EngagementPhase.version by 1"

  - method: POST
    path: "/scheduling/engagement-phases/{engagement_phase_id}/auto-staff"
    description: "Selector: books the single best-fitting domestic candidate onto the phase for the requested window, per calculations.staff_fit_score (eligibility filter, fit_score DESC, hourly_bill_rate ASC, created_at ASC)."
    roles: [SchedulingManager]
    code: 201
    input: [start_date, end_date, allocated_hours]
    output: Assignment
    side_effects:
      - "Create one Assignment with staffing_status PROPOSED and fit_score set from calculations.staff_fit_score"
      - "Compute Assignment.daily_hours, calendar_day_count, rate_model, review_status"
      - "Recompute EngagementPhase.staffed_hours / unstaffed_hours / staffing_status"
      - "Recompute StaffMember.committed_hours_current_week, workload_status, burnout_risk_score_committed, turnover_risk_band"
      - "Recompute Engagement.staffing_completion_pct, schedule_risk_band, realization_pct_provisional"
      - "Increments EngagementPhase.version by 1"
      - "Rejects with ERR_NO_ELIGIBLE_STAFF when the candidate pool is empty"

  # --- Assignment -----------------------------------------------------------
  - method: POST
    path: "/scheduling/assignments"
    description: "Books a named staff member onto a phase for a half-open date interval."
    roles: [SchedulingManager]
    code: 201
    input: [engagement_phase_id, staff_member_id, start_date, end_date, allocated_hours, "review_owner_staff_id?"]
    output: Assignment
    side_effects:
      - "Create Assignment with staffing_status PROPOSED and fit_score 0.00"
      - "Compute daily_hours and calendar_day_count (calculations.assignment_daily_hours)"
      - "Compute rate_model from the staff member's service_center; set review_status to PENDING_REVIEW for OFFSHORE_SHARED_SERVICE else NOT_REQUIRED"
      - "Compute review_hours_charged and bind review_capacity_window_id (calculations.offshore_review_charge); recompute ReviewCapacityWindow.committed_review_hours and remaining_review_hours"
      - "Recompute EngagementPhase.staffed_hours / unstaffed_hours / staffing_status (calculations.phase_staffing_derivation)"
      - "Recompute StaffMember.committed_hours_current_week, workload_status, burnout_risk_score_committed, turnover_risk_band"
      - "Recompute Engagement.staffing_completion_pct, schedule_risk_band, realization_pct_provisional"
      - "Increments EngagementPhase.version by 1"

  - method: GET
    path: "/scheduling/assignments/{assignment_id}"
    description: "Reads one assignment including both status dimensions and all computed hours."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/scheduling/assignments"
    description: "Lists assignments; the filtered-list reverse-reachability read for every Assignment foreign key including the self-referential supersede link."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff]
    code: 200
    input: ["engagement_phase_id?", "staff_member_id?", "review_owner_staff_id?", "review_capacity_window_id?", "superseded_by_assignment_id?", "staffing_status?", "review_status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: GET
    path: "/scheduling/assignments/{id}/time-entries"
    description: "Reverse-reachability read (sub-resource form): every time entry logged against one assignment."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []

  - method: POST
    path: "/scheduling/assignments/{assignment_id}/confirm"
    description: "Confirms a proposed booking after re-running independence and turnover-risk gates."
    roles: [SchedulingManager]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment PROPOSED -> CONFIRMED"
      - "Recompute StaffMember.committed_hours_current_week and workload_status"
      - "Increments Assignment.version by 1"

  - method: POST
    path: "/scheduling/assignments/{assignment_id}/activate"
    description: "Activates a confirmed booking so hours can be logged against it; requires the phase to be IN_PROGRESS."
    roles: [SchedulingManager]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment CONFIRMED -> ACTIVE"
      - "Increments Assignment.version by 1"

  - method: POST
    path: "/scheduling/assignments/{assignment_id}/release"
    description: "Releases a proposed or confirmed booking, exactly reversing its capacity footprint."
    roles: [SchedulingManager]
    code: 200
    input: ["reason_note?"]
    output: Assignment
    side_effects:
      - "Assignment {PROPOSED, CONFIRMED} -> RELEASED; review_status reset to NOT_REQUIRED when it was under review"
      - "Compensation: StaffMember.committed_hours_current_week loses exactly this booking's contribution; workload_status, burnout_risk_score_committed and turnover_risk_band recomputed"
      - "ReviewCapacityWindow.committed_review_hours and remaining_review_hours recomputed when review_capacity_window_id was bound"
      - "Recompute EngagementPhase.staffed_hours / unstaffed_hours / staffing_status; possible bubble-up Engagement SCHEDULED -> SETUP"
      - "Recompute Engagement.staffing_completion_pct, schedule_risk_band, realization_pct_provisional"
      - "Increments Assignment.version by 1"

  - method: POST
    path: "/scheduling/assignments/{assignment_id}/reassign"
    description: "Replaces a booking with an equivalent booking on a different staff member: the original is released and a new PROPOSED assignment is created on the same phase. Guarded by OCC on the phase (concurrency_rules.assignment-reassign-stale-phase)."
    roles: [SchedulingManager]
    code: 201
    input: [expected_phase_version, staff_member_id, "start_date?", "end_date?", "allocated_hours?", "review_owner_staff_id?"]
    output: Assignment
    side_effects:
      - "Reject with ERR_STALE_PHASE_VERSION (412) when expected_phase_version != EngagementPhase.version"
      - "Original Assignment {PROPOSED, CONFIRMED} -> RELEASED with superseded_by_assignment_id set to the replacement's id"
      - "Create the replacement Assignment (staffing_status PROPOSED) inheriting start_date, end_date and allocated_hours of the original unless overridden"
      - "Compute the replacement's daily_hours, rate_model, review_status, review_hours_charged and review_capacity_window_id"
      - "Recompute both staff members' committed_hours_current_week, workload_status, burnout scores and turnover_risk_band"
      - "Recompute EngagementPhase.staffed_hours / unstaffed_hours / staffing_status and Engagement.staffing_completion_pct"
      - "increments EngagementPhase.version by 1"

  - method: POST
    path: "/scheduling/assignments/{assignment_id}/start-review"
    description: "Review owner opens (or reopens after rework) the review of an offshore booking. Independent of the staffing dimension."
    roles: [EngagementPartner]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment.review_status {PENDING_REVIEW, REWORK_REQUESTED} -> IN_REVIEW; staffing_status untouched"
      - "Increments Assignment.version by 1"

  - method: POST
    path: "/scheduling/assignments/{assignment_id}/request-rework"
    description: "Review owner sends work back; adds one rework block to the reviewer's weekly review capacity."
    roles: [EngagementPartner]
    code: 200
    input: ["reason_note?"]
    output: Assignment
    side_effects:
      - "Assignment.review_status IN_REVIEW -> REWORK_REQUESTED; rework_cycles incremented"
      - "Recompute Assignment.review_hours_charged (calculations.offshore_review_charge, + REWORK_REVIEW_HOURS)"
      - "Recompute ReviewCapacityWindow.committed_review_hours and remaining_review_hours"
      - "Increments Assignment.version by 1"

  - method: POST
    path: "/scheduling/assignments/{assignment_id}/accept-review"
    description: "Review owner accepts the work, clearing the phase to complete."
    roles: [EngagementPartner]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment.review_status IN_REVIEW -> REVIEW_ACCEPTED; staffing_status untouched"
      - "Increments Assignment.version by 1"

  # --- AvailabilityException ------------------------------------------------
  - method: POST
    path: "/scheduling/availability-exceptions"
    description: "Records time off, licensure study leave, training or a firm holiday that reduces a staff member's daily availability. Immutable."
    roles: [FirmAdmin]
    code: 201
    input: [staff_member_id, exception_type, start_date, end_date, available_hours_per_day]
    output: AvailabilityException
    side_effects:
      - "Reject with ERR_EXCEPTION_OVERLAP when it intersects an existing exception of the same staff member"
      - "Recompute StaffMember.daily_capacity_hours effects for the covered dates (calculations.staff_daily_capacity)"

  # --- TimeEntry ------------------------------------------------------------
  - method: POST
    path: "/scheduling/time-entries"
    description: "Logs actual hours against an active booking. Immutable, append-only."
    roles: [EngagementStaff]
    code: 201
    input: [assignment_id, work_date, hours, entry_type]
    output: TimeEntry
    side_effects:
      - "Recompute StaffMember.burnout_risk_score_actual and turnover_risk_band (calculations.burnout_risk_score, actual_trailing)"
      - "Recompute StaffMember.effective_weekly_cap_hours and daily_capacity_hours for the FOLLOWING ISO week (calculations.effective_weekly_cap reads prior-week actuals)"
      - "Recompute Engagement.realization_pct_final (calculations.engagement_realization, final_logged)"

  # --- IndependenceRestriction ---------------------------------------------
  - method: POST
    path: "/scheduling/independence-restrictions"
    description: "Independence officer bars a staff member from a client for a closed date window; immediately unwinds conflicting pending bookings."
    roles: [IndependenceOfficer]
    code: 201
    input: [client_id, staff_member_id, restriction_type, effective_start_date, effective_end_date]
    output: IndependenceRestriction
    side_effects:
      - "Create the restriction with status ACTIVE"
      - "Cascade restriction_release_downgrade hop 1: conflicting Assignments in {PROPOSED, CONFIRMED} -> RELEASED; released_assignment_count set"
      - "Cascade hop 2: EngagementPhase.staffed_hours / unstaffed_hours / staffing_status re-derived (FULLY_STAFFED may fall to NOT_STAFFED)"
      - "Cascade hop 3: Engagement SCHEDULED -> SETUP when every phase reached NOT_STAFFED"
      - "APPROVED WorkloadWaiver rows of that staff member on affected engagements -> EXPIRED with expiry_reason RESTRICTION_IMPOSED"
      - "Recompute the affected staff member's committed_hours_current_week, workload_status, burnout_risk_score_committed and turnover_risk_band"

  - method: GET
    path: "/scheduling/independence-restrictions/{independence_restriction_id}"
    description: "Reads one independence restriction."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, IndependenceOfficer]
    code: 200
    input: []
    output: IndependenceRestriction
    side_effects: []

  - method: GET
    path: "/scheduling/independence-restrictions"
    description: "Lists independence restrictions, filterable by client, staff member and status."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, IndependenceOfficer]
    code: 200
    input: ["client_id?", "staff_member_id?", "status?", "restriction_type?", "limit?", "offset?"]
    output: IndependenceRestriction[]
    side_effects: []

  - method: POST
    path: "/scheduling/independence-restrictions/{independence_restriction_id}/lift"
    description: "Lifts an active restriction; already-released bookings are not restored."
    roles: [IndependenceOfficer]
    code: 200
    input: []
    output: IndependenceRestriction
    side_effects:
      - "IndependenceRestriction ACTIVE -> LIFTED"
      - "Increments IndependenceRestriction.version by 1"

  # --- ReviewCapacityWindow -------------------------------------------------
  - method: POST
    path: "/scheduling/review-capacity-windows"
    description: "Declares how many review hours a manager or partner has available in one ISO week."
    roles: [FirmAdmin]
    code: 201
    input: [reviewer_staff_id, week_start_date, review_capacity_hours]
    output: ReviewCapacityWindow
    side_effects:
      - "Set committed_review_hours to 0.00 and remaining_review_hours to review_capacity_hours (calculations.review_window_load)"

  - method: GET
    path: "/scheduling/review-capacity-windows/{review_capacity_window_id}"
    description: "Reads one review capacity window including its committed and remaining hours."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner]
    code: 200
    input: []
    output: ReviewCapacityWindow
    side_effects: []

  - method: GET
    path: "/scheduling/review-capacity-windows"
    description: "Lists review capacity windows, filterable by reviewer and ISO week."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner]
    code: 200
    input: ["reviewer_staff_id?", "week_start_date?", "limit?", "offset?"]
    output: ReviewCapacityWindow[]
    side_effects: []

  # --- ReschedulePlan -------------------------------------------------------
  - method: POST
    path: "/scheduling/reschedule-plans"
    description: "Drafts a reschedule for an engagement whose client readiness slipped or whose scope expanded."
    roles: [SchedulingManager]
    code: 201
    input: [engagement_id, trigger_reason, shift_days, "added_hours?"]
    output: ReschedulePlan
    side_effects:
      - "Create the plan with status DRAFT, simulation_stale true and every projected_* field null"

  - method: GET
    path: "/scheduling/reschedule-plans/{reschedule_plan_id}"
    description: "Reads one reschedule plan including its projection and staleness flag."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner]
    code: 200
    input: []
    output: ReschedulePlan
    side_effects: []

  - method: GET
    path: "/scheduling/reschedule-plans"
    description: "Lists reschedule plans, filterable by engagement, target phase and status."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner]
    code: 200
    input: ["engagement_id?", "target_phase_id?", "status?", "limit?", "offset?"]
    output: ReschedulePlan[]
    side_effects: []

  - method: POST
    path: "/scheduling/reschedule-plans/{reschedule_plan_id}/simulate"
    description: "Runs the read-only projection of the reschedule and pins the engagement version it was computed against."
    roles: [SchedulingManager]
    code: 200
    input: []
    output: ReschedulePlan
    side_effects:
      - "ReschedulePlan DRAFT -> SIMULATED (or SIMULATED -> SIMULATED on re-simulation)"
      - "Compute target_phase_id, projected_unstaffed_hours, projected_dropped_assignment_count, projected_cap_breach_count and projected_realization_pct (calculations.reschedule_projection)"
      - "Set simulated_at_engagement_version to Engagement.version and simulation_stale to false"
      - "Increments ReschedulePlan.version by 1"

  - method: POST
    path: "/scheduling/reschedule-plans/{reschedule_plan_id}/apply"
    description: "Applies a fresh simulation: shifts every phase window, adds scope to the target phase and drops bookings that no longer fit. Guarded by OCC on the engagement (concurrency_rules.reschedule-apply-stale-engagement)."
    roles: [SchedulingManager]
    code: 200
    input: [expected_engagement_version]
    output: ReschedulePlan
    side_effects:
      - "Reject with ERR_STALE_ENGAGEMENT_VERSION (412) when expected_engagement_version != Engagement.version"
      - "ReschedulePlan SIMULATED -> APPLIED"
      - "Shift every EngagementPhase window by shift_days and add added_hours to target_phase_id"
      - "Bookings in {PROPOSED, CONFIRMED} that fall outside their shifted phase window -> RELEASED, cascading into phase derivation and possibly Engagement SCHEDULED -> SETUP"
      - "Other DRAFT/SIMULATED plans on the same engagement -> SUPERSEDED"
      - "increments Engagement.version by 1"
      - "Increments ReschedulePlan.version by 1"

  # --- WorkloadWaiver -------------------------------------------------------
  - method: POST
    path: "/scheduling/workload-waivers"
    description: "Staff member requests extra weekly hours allowance for one ISO week, justified by an engagement."
    roles: [EngagementStaff]
    code: 201
    input: [staff_member_id, engagement_id, week_start_date, extra_hours_allowance, "justification_note?"]
    output: WorkloadWaiver
    side_effects:
      - "Create the waiver with status REQUESTED; no cap changes yet"

  - method: GET
    path: "/scheduling/workload-waivers/{workload_waiver_id}"
    description: "Reads one workload waiver."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff]
    code: 200
    input: []
    output: WorkloadWaiver
    side_effects: []

  - method: GET
    path: "/scheduling/workload-waivers"
    description: "Lists workload waivers, filterable by staff member, engagement, ISO week and status."
    roles: [FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff]
    code: 200
    input: ["staff_member_id?", "engagement_id?", "status?", "week_start_date?", "limit?", "offset?"]
    output: WorkloadWaiver[]
    side_effects: []

  - method: POST
    path: "/scheduling/workload-waivers/{workload_waiver_id}/approve"
    description: "Engagement partner approves the overtime allowance for that ISO week; the beneficiary may never approve their own waiver."
    roles: [EngagementPartner]
    code: 200
    input: []
    output: WorkloadWaiver
    side_effects:
      - "WorkloadWaiver REQUESTED -> APPROVED; approved_by_user_id stamped"
      - "Recompute StaffMember.effective_weekly_cap_hours and daily_capacity_hours for that ISO week (calculations.effective_weekly_cap)"
      - "Recompute StaffMember.workload_status"
      - "Increments WorkloadWaiver.version by 1"

  - method: POST
    path: "/scheduling/workload-waivers/{workload_waiver_id}/deny"
    description: "Engagement partner denies the overtime allowance."
    roles: [EngagementPartner]
    code: 200
    input: []
    output: WorkloadWaiver
    side_effects:
      - "WorkloadWaiver REQUESTED -> DENIED; approved_by_user_id stamped"
      - "Increments WorkloadWaiver.version by 1"

# =============================================================================
# §1.6 Error Code Catalog — 56 codes. Every error_id named in §1.4 or in an
# endpoint side effect appears exactly once here, and every code below is
# reachable from at least one §1.8 or §1.9 instance.
# =============================================================================
errors:

  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-User-Role request header absent or empty (validations priority 1)"
    applies_to: ["all"]

  - id: ERR_INVALID_ROLE
    http_status: 401
    condition: "X-User-Role is not one of FirmAdmin, SchedulingManager, EngagementPartner, EngagementStaff, IndependenceOfficer (validations priority 2)"
    applies_to: ["all"]

  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "The presented role is not in the endpoint's roles list (validations priority 3)"
    applies_to: ["all"]

  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "An entity_backed role acts on a resource whose owning foreign key is not the caller's X-User-ID (validations priority 10)"
    applies_to: ["POST /scheduling/time-entries", "POST /scheduling/workload-waivers", "POST /scheduling/engagements/{engagement_id}/clear-client-block", "POST /scheduling/engagements/{engagement_id}/deliver", "POST /scheduling/assignments/{assignment_id}/start-review", "POST /scheduling/assignments/{assignment_id}/request-rework", "POST /scheduling/assignments/{assignment_id}/accept-review", "POST /scheduling/workload-waivers/{workload_waiver_id}/approve", "POST /scheduling/workload-waivers/{workload_waiver_id}/deny"]

  # --- existence ------------------------------------------------------------
  - id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    condition: "client_id in the path or body matches no Client row (validations priority 4-5)"
    applies_to: ["GET /scheduling/clients/{client_id}", "POST /scheduling/engagements", "POST /scheduling/independence-restrictions"]

  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http_status: 404
    condition: "staff_member_id, engagement_partner_staff_id, review_owner_staff_id or reviewer_staff_id matches no StaffMember row (validations priority 4-5)"
    applies_to: ["GET /scheduling/staff-members/{staff_member_id}", "GET /scheduling/staff-members/{staff_member_id}/workload", "GET /scheduling/staff-members/{id}/availability-exceptions", "POST /scheduling/engagements", "POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/availability-exceptions", "POST /scheduling/independence-restrictions", "POST /scheduling/review-capacity-windows", "POST /scheduling/workload-waivers"]

  - id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    condition: "engagement_id in the path or body matches no Engagement row (validations priority 4-5)"
    applies_to: ["GET /scheduling/engagements/{engagement_id}", "GET /scheduling/engagements/{engagement_id}/realization", "POST /scheduling/engagements/{engagement_id}/schedule", "POST /scheduling/engagements/{engagement_id}/start-fieldwork", "POST /scheduling/engagements/{engagement_id}/report-client-block", "POST /scheduling/engagements/{engagement_id}/clear-client-block", "POST /scheduling/engagements/{engagement_id}/deliver", "POST /scheduling/engagement-phases", "POST /scheduling/reschedule-plans", "POST /scheduling/workload-waivers"]

  - id: ERR_PHASE_NOT_FOUND
    http_status: 404
    condition: "engagement_phase_id in the path or body matches no EngagementPhase row (validations priority 4-5)"
    applies_to: ["GET /scheduling/engagement-phases/{engagement_phase_id}", "POST /scheduling/engagement-phases/{engagement_phase_id}/expand-scope", "POST /scheduling/engagement-phases/{engagement_phase_id}/start", "POST /scheduling/engagement-phases/{engagement_phase_id}/complete", "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff", "POST /scheduling/assignments"]

  - id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    condition: "assignment_id in the path or body matches no Assignment row (validations priority 4-5)"
    applies_to: ["GET /scheduling/assignments/{assignment_id}", "GET /scheduling/assignments/{id}/time-entries", "POST /scheduling/assignments/{assignment_id}/confirm", "POST /scheduling/assignments/{assignment_id}/activate", "POST /scheduling/assignments/{assignment_id}/release", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/assignments/{assignment_id}/start-review", "POST /scheduling/assignments/{assignment_id}/request-rework", "POST /scheduling/assignments/{assignment_id}/accept-review", "POST /scheduling/time-entries"]

  - id: ERR_RESTRICTION_NOT_FOUND
    http_status: 404
    condition: "independence_restriction_id matches no IndependenceRestriction row (validations priority 4)"
    applies_to: ["GET /scheduling/independence-restrictions/{independence_restriction_id}", "POST /scheduling/independence-restrictions/{independence_restriction_id}/lift"]

  - id: ERR_REVIEW_WINDOW_NOT_FOUND
    http_status: 404
    condition: "review_capacity_window_id matches no ReviewCapacityWindow row (validations priority 4)"
    applies_to: ["GET /scheduling/review-capacity-windows/{review_capacity_window_id}"]

  - id: ERR_RESCHEDULE_PLAN_NOT_FOUND
    http_status: 404
    condition: "reschedule_plan_id matches no ReschedulePlan row (validations priority 4)"
    applies_to: ["GET /scheduling/reschedule-plans/{reschedule_plan_id}", "POST /scheduling/reschedule-plans/{reschedule_plan_id}/simulate", "POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"]

  - id: ERR_WAIVER_NOT_FOUND
    http_status: 404
    condition: "workload_waiver_id matches no WorkloadWaiver row (validations priority 4)"
    applies_to: ["GET /scheduling/workload-waivers/{workload_waiver_id}", "POST /scheduling/workload-waivers/{workload_waiver_id}/approve", "POST /scheduling/workload-waivers/{workload_waiver_id}/deny"]

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http_status: 422
    condition: "A required field is missing, an enum value is unknown, a numeric field is <= 0 where positivity is required, or a date is not ISO-8601 (validations priority 6)"
    applies_to: ["all"]

  - id: ERR_INVALID_PAGINATION
    http_status: 422
    condition: "limit < 1, limit > 100 or offset < 0 (validations priority 7; defaults limit 10 / offset 0)"
    applies_to: ["GET /scheduling/clients", "GET /scheduling/staff-members", "GET /scheduling/staff-members/{id}/availability-exceptions", "GET /scheduling/engagements", "GET /scheduling/engagement-phases", "GET /scheduling/assignments", "GET /scheduling/assignments/{id}/time-entries", "GET /scheduling/independence-restrictions", "GET /scheduling/review-capacity-windows", "GET /scheduling/reschedule-plans", "GET /scheduling/workload-waivers"]

  - id: ERR_INVALID_DATE_RANGE
    http_status: 422
    condition: "For half-open intervals end_date <= start_date; for closed windows end_date < start_date (validations priority 8)"
    applies_to: ["POST /scheduling/engagement-phases", "POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/availability-exceptions", "POST /scheduling/independence-restrictions", "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"]

  - id: ERR_NOT_WEEK_START
    http_status: 422
    condition: "week_start_date is not a Monday (validations priority 9)"
    applies_to: ["POST /scheduling/review-capacity-windows", "POST /scheduling/workload-waivers", "GET /scheduling/staff-members/{staff_member_id}/workload"]

  # --- state ----------------------------------------------------------------
  - id: ERR_ENGAGEMENT_INVALID_STATE
    http_status: 409
    condition: "The Engagement is not in a state the requested transition allows, including DELIVERED terminal lockdown (validations priority 11)"
    applies_to: ["POST /scheduling/engagements/{engagement_id}/schedule", "POST /scheduling/engagements/{engagement_id}/start-fieldwork", "POST /scheduling/engagements/{engagement_id}/report-client-block", "POST /scheduling/engagements/{engagement_id}/clear-client-block", "POST /scheduling/engagements/{engagement_id}/deliver"]

  - id: ERR_PHASE_INVALID_STATE
    http_status: 409
    condition: "The EngagementPhase is not in a state the requested transition allows, including COMPLETE terminal lockdown (validations priority 11)"
    applies_to: ["POST /scheduling/engagement-phases/{engagement_phase_id}/expand-scope", "POST /scheduling/engagement-phases/{engagement_phase_id}/start", "POST /scheduling/engagement-phases/{engagement_phase_id}/complete", "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff", "POST /scheduling/assignments"]

  - id: ERR_ASSIGNMENT_INVALID_STATE
    http_status: 409
    condition: "The Assignment's staffing_status dimension does not allow the requested transition, including COMPLETED and RELEASED terminal lockdown, and a time entry logged against an Assignment that is not ACTIVE or COMPLETED (validations priority 11)"
    applies_to: ["POST /scheduling/assignments/{assignment_id}/confirm", "POST /scheduling/assignments/{assignment_id}/activate", "POST /scheduling/assignments/{assignment_id}/release", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/time-entries"]

  - id: ERR_REVIEW_INVALID_STATE
    http_status: 409
    condition: "The Assignment's review_status dimension does not allow the requested transition, including NOT_REQUIRED and REVIEW_ACCEPTED lockdown (validations priority 11)"
    applies_to: ["POST /scheduling/assignments/{assignment_id}/start-review", "POST /scheduling/assignments/{assignment_id}/request-rework", "POST /scheduling/assignments/{assignment_id}/accept-review"]

  - id: ERR_RESTRICTION_INVALID_STATE
    http_status: 409
    condition: "The IndependenceRestriction is already LIFTED (validations priority 11)"
    applies_to: ["POST /scheduling/independence-restrictions/{independence_restriction_id}/lift"]

  - id: ERR_PLAN_INVALID_STATE
    http_status: 409
    condition: "The ReschedulePlan is not in a state the requested transition allows, including APPLIED and SUPERSEDED lockdown (validations priority 11)"
    applies_to: ["POST /scheduling/reschedule-plans/{reschedule_plan_id}/simulate", "POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"]

  - id: ERR_WAIVER_INVALID_STATE
    http_status: 409
    condition: "The WorkloadWaiver is not REQUESTED, including APPROVED / DENIED / EXPIRED lockdown (validations priority 11)"
    applies_to: ["POST /scheduling/workload-waivers/{workload_waiver_id}/approve", "POST /scheduling/workload-waivers/{workload_waiver_id}/deny"]

  - id: ERR_ENGAGEMENT_BLOCKED
    http_status: 409
    condition: "A staffing write targets a phase whose Engagement.status is CLIENT_BLOCKED (validations priority 12)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/confirm", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/engagement-phases", "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff", "POST /scheduling/engagement-phases/{engagement_phase_id}/expand-scope"]

  - id: ERR_PHASE_NOT_IN_PROGRESS
    http_status: 409
    condition: "An assignment is activated, or hours are logged, while the owning EngagementPhase is not IN_PROGRESS (validations priority 13)"
    applies_to: ["POST /scheduling/assignments/{assignment_id}/activate", "POST /scheduling/time-entries"]

  # --- safety (independence, rotation, segregation, burnout) ----------------
  - id: ERR_INDEPENDENCE_RESTRICTED
    http_status: 409
    condition: "An ACTIVE IndependenceRestriction for the (client, staff member) pair covers any date of the requested booking interval (validations priority 14)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/confirm", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"]

  - id: ERR_PARTNER_ROTATION_LIMIT
    http_status: 409
    condition: "The requested engagement partner would exceed Client.partner_rotation_limit_years consecutive busy-season years on that client (validations priority 15; calculations.partner_rotation_check)"
    applies_to: ["POST /scheduling/engagements"]

  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "The approving X-User-ID equals the beneficiary staff member of the waiver, or the review_owner_staff_id equals the assigned staff_member_id (validations priority 16)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/assignments/{assignment_id}/start-review", "POST /scheduling/assignments/{assignment_id}/accept-review", "POST /scheduling/workload-waivers/{workload_waiver_id}/approve", "POST /scheduling/workload-waivers/{workload_waiver_id}/deny"]

  - id: ERR_TURNOVER_RISK_BLOCK
    http_status: 409
    condition: "A booking is confirmed for a staff member whose turnover_risk_band is HIGH and who has no APPROVED WorkloadWaiver for the ISO week containing Assignment.start_date (validations priority 17; calculations.burnout_risk_score)"
    applies_to: ["POST /scheduling/assignments/{assignment_id}/confirm"]

  # --- skill and review-owner constraints ----------------------------------
  - id: ERR_LEVEL_MISMATCH
    http_status: 422
    condition: "The staff member's level does not satisfy EngagementPhase.required_level (validations priority 18)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign"]

  - id: ERR_SPECIALIZATION_MISMATCH
    http_status: 422
    condition: "EngagementPhase.required_industry_specialization is set and the staff member's industry_specialization differs (validations priority 19)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign"]

  - id: ERR_LICENSURE_REQUIRED
    http_status: 422
    condition: "EngagementPhase.requires_cpa_licensed is true and the staff member's cpa_licensed is false (validations priority 20)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign"]

  - id: ERR_REVIEW_OWNER_REQUIRED
    http_status: 422
    condition: "review_owner_staff_id is omitted for a booking whose rate_model resolves to OFFSHORE_SHARED_SERVICE (validations priority 21)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign"]

  - id: ERR_REVIEW_OWNER_NOT_ELIGIBLE
    http_status: 422
    condition: "The nominated review owner or reviewer has review_capable false, i.e. is not a DOMESTIC MANAGER or PARTNER (validations priority 22 and 44)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/review-capacity-windows"]

  - id: ERR_REVIEW_WINDOW_MISSING
    http_status: 422
    condition: "No ReviewCapacityWindow exists for the review owner in the ISO week of the booking's last worked day (validations priority 23; calculations.offshore_review_charge)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign"]

  # --- uniqueness -----------------------------------------------------------
  - id: ERR_DUPLICATE_ENGAGEMENT_YEAR
    http_status: 409
    condition: "An Engagement already exists for the same (client_id, engagement_partner_staff_id, busy_season_year) (validations priority 24)"
    applies_to: ["POST /scheduling/engagements"]

  - id: ERR_DUPLICATE_REVIEW_WINDOW
    http_status: 409
    condition: "A ReviewCapacityWindow already exists for the same (reviewer_staff_id, week_start_date) (validations priority 25)"
    applies_to: ["POST /scheduling/review-capacity-windows"]

  - id: ERR_DUPLICATE_WAIVER
    http_status: 409
    condition: "A REQUESTED or APPROVED WorkloadWaiver already exists for the same (staff_member_id, week_start_date) (validations priority 26)"
    applies_to: ["POST /scheduling/workload-waivers"]

  - id: ERR_DUPLICATE_RESTRICTION
    http_status: 409
    condition: "An ACTIVE IndependenceRestriction already exists for the same (client_id, staff_member_id) (validations priority 27)"
    applies_to: ["POST /scheduling/independence-restrictions"]

  # --- temporal geometry ----------------------------------------------------
  - id: ERR_PHASE_WINDOW_AFTER_DEADLINE
    http_status: 422
    condition: "window_end_date is later than Engagement.deadline_date (validations priority 28)"
    applies_to: ["POST /scheduling/engagement-phases"]

  - id: ERR_ASSIGNMENT_OUTSIDE_PHASE_WINDOW
    http_status: 422
    condition: "The half-open booking interval is not contained in the phase's closed window, i.e. start_date < window_start_date or (end_date - 1 day) > window_end_date (validations priority 29)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"]

  - id: ERR_EXCEPTION_OVERLAP
    http_status: 409
    condition: "The new AvailabilityException's closed window intersects an existing exception of the same staff member (validations priority 30)"
    applies_to: ["POST /scheduling/availability-exceptions"]

  - id: ERR_STAFF_UNAVAILABLE
    http_status: 409
    condition: "An AvailabilityException with available_hours_per_day 0.00 covers a date of the requested booking interval (validations priority 31)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign"]

  - id: ERR_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    condition: "On some occupied date the staff member's aggregate assignment_daily_hours would exceed the effective daily capacity of that date (validations priority 32; calculations.staff_daily_capacity)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"]

  # --- fiscal / capacity ceilings ------------------------------------------
  - id: ERR_WORKLOAD_CAP_EXCEEDED
    http_status: 409
    condition: "In some ISO week the staff member's committed hours would exceed effective_weekly_cap_hours (validations priority 33; calculations.weekly_committed_hours and effective_weekly_cap)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"]

  - id: ERR_REVIEW_CAPACITY_EXCEEDED
    http_status: 409
    condition: "The review charge of the booking or rework cycle would push ReviewCapacityWindow.committed_review_hours above review_capacity_hours (validations priority 34; calculations.review_window_load)"
    applies_to: ["POST /scheduling/assignments", "POST /scheduling/assignments/{assignment_id}/reassign", "POST /scheduling/assignments/{assignment_id}/request-rework", "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"]

  - id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    condition: "rework_cycles has already reached MAX_REWORK_CYCLES for that assignment (validations priority 35)"
    applies_to: ["POST /scheduling/assignments/{assignment_id}/request-rework"]

  - id: ERR_TIME_ENTRY_OUT_OF_WINDOW
    http_status: 422
    condition: "work_date is not one of the assignment's occupied dates, i.e. outside [start_date, end_date) (validations priority 36)"
    applies_to: ["POST /scheduling/time-entries"]

  - id: ERR_TIME_ENTRY_EXCEEDS_ALLOCATION
    http_status: 409
    condition: "Logged hours plus this entry would exceed Assignment.allocated_hours * 1.25, the permitted overrun tolerance (validations priority 37)"
    applies_to: ["POST /scheduling/time-entries"]

  # --- plan and selector ----------------------------------------------------
  - id: ERR_SIMULATION_STALE
    http_status: 409
    condition: "ReschedulePlan.simulation_stale is true, i.e. the engagement changed after the projection was computed (validations priority 38)"
    applies_to: ["POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"]

  - id: ERR_PHASE_FULLY_STAFFED
    http_status: 409
    condition: "auto-staff is called on a phase whose staffing_status is already FULLY_STAFFED (validations priority 39)"
    applies_to: ["POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"]

  - id: ERR_NO_ELIGIBLE_STAFF
    http_status: 422
    condition: "The selector's eligibility filter yields an empty candidate pool (validations priority 40; calculations.staff_fit_score empty-pool fallback)"
    applies_to: ["POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"]

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_PHASE_VERSION
    http_status: 412
    condition: "expected_phase_version does not equal the parent EngagementPhase.version (validations priority 41; concurrency_rules.assignment-reassign-stale-phase)"
    applies_to: ["POST /scheduling/assignments/{assignment_id}/reassign"]

  - id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    condition: "expected_engagement_version does not equal the parent Engagement.version (validations priority 42; concurrency_rules.reschedule-apply-stale-engagement)"
    applies_to: ["POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"]

  # --- referential grade rules ---------------------------------------------
  - id: ERR_PARTNER_LEVEL_REQUIRED
    http_status: 422
    condition: "engagement_partner_staff_id references a staff member who is not a DOMESTIC PARTNER (validations priority 43)"
    applies_to: ["POST /scheduling/engagements"]

# =============================================================================
# §1.7 RBAC Permission Matrix — segregation_of_duties role model.
# Every request carries X-User-ID and X-Role. For entity_backed roles the
# X-User-ID is the StaffMember.id of the acting person; validations priority 10
# ties it to the owning foreign key of the target resource.
# =============================================================================
roles:

  - name: FirmAdmin
    description: "Firm operations back office. Owns reference data — clients, staff roster, availability exceptions, review capacity windows — and the logical clock. Never books work and never approves anything."
    identity: opaque
    exclusive_operations:
      - "POST /scheduling/_clock/set_current_utc"
      - "POST /scheduling/clients"
      - "POST /scheduling/staff-members"
      - "POST /scheduling/availability-exceptions"
      - "POST /scheduling/review-capacity-windows"
    shared_operations:
      - "GET /scheduling/clients/{client_id}"
      - "GET /scheduling/clients"
      - "GET /scheduling/staff-members/{staff_member_id}"
      - "GET /scheduling/staff-members"
      - "GET /scheduling/staff-members/{staff_member_id}/workload"
      - "GET /scheduling/staff-members/{id}/availability-exceptions"
      - "GET /scheduling/engagements/{engagement_id}"
      - "GET /scheduling/engagements"
      - "GET /scheduling/engagements/{engagement_id}/realization"
      - "GET /scheduling/engagement-phases/{engagement_phase_id}"
      - "GET /scheduling/engagement-phases"
      - "GET /scheduling/assignments/{assignment_id}"
      - "GET /scheduling/assignments"
      - "GET /scheduling/assignments/{id}/time-entries"
      - "GET /scheduling/independence-restrictions/{independence_restriction_id}"
      - "GET /scheduling/independence-restrictions"
      - "GET /scheduling/review-capacity-windows/{review_capacity_window_id}"
      - "GET /scheduling/review-capacity-windows"
      - "GET /scheduling/reschedule-plans/{reschedule_plan_id}"
      - "GET /scheduling/reschedule-plans"
      - "GET /scheduling/workload-waivers/{workload_waiver_id}"
      - "GET /scheduling/workload-waivers"

  - name: SchedulingManager
    description: "Resource management office. Builds the engagement inventory, books and reschedules work, drives the staffing and phase lifecycles. Cannot approve overtime allowances, cannot review offshore work and cannot impose independence restrictions."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /scheduling/engagements"
      - "POST /scheduling/engagements/{engagement_id}/schedule"
      - "POST /scheduling/engagements/{engagement_id}/start-fieldwork"
      - "POST /scheduling/engagements/{engagement_id}/report-client-block"
      - "POST /scheduling/engagement-phases"
      - "POST /scheduling/engagement-phases/{engagement_phase_id}/expand-scope"
      - "POST /scheduling/engagement-phases/{engagement_phase_id}/start"
      - "POST /scheduling/engagement-phases/{engagement_phase_id}/complete"
      - "POST /scheduling/engagement-phases/{engagement_phase_id}/auto-staff"
      - "POST /scheduling/assignments"
      - "POST /scheduling/assignments/{assignment_id}/confirm"
      - "POST /scheduling/assignments/{assignment_id}/activate"
      - "POST /scheduling/assignments/{assignment_id}/release"
      - "POST /scheduling/assignments/{assignment_id}/reassign"
      - "POST /scheduling/reschedule-plans"
      - "POST /scheduling/reschedule-plans/{reschedule_plan_id}/simulate"
      - "POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply"
    shared_operations:
      - "GET /scheduling/clients/{client_id}"
      - "GET /scheduling/clients"
      - "GET /scheduling/staff-members/{staff_member_id}"
      - "GET /scheduling/staff-members"
      - "GET /scheduling/staff-members/{staff_member_id}/workload"
      - "GET /scheduling/staff-members/{id}/availability-exceptions"
      - "GET /scheduling/engagements/{engagement_id}"
      - "GET /scheduling/engagements"
      - "GET /scheduling/engagements/{engagement_id}/realization"
      - "GET /scheduling/engagement-phases/{engagement_phase_id}"
      - "GET /scheduling/engagement-phases"
      - "GET /scheduling/assignments/{assignment_id}"
      - "GET /scheduling/assignments"
      - "GET /scheduling/assignments/{id}/time-entries"
      - "GET /scheduling/independence-restrictions/{independence_restriction_id}"
      - "GET /scheduling/independence-restrictions"
      - "GET /scheduling/review-capacity-windows/{review_capacity_window_id}"
      - "GET /scheduling/review-capacity-windows"
      - "GET /scheduling/reschedule-plans/{reschedule_plan_id}"
      - "GET /scheduling/reschedule-plans"
      - "GET /scheduling/workload-waivers/{workload_waiver_id}"
      - "GET /scheduling/workload-waivers"

  - name: EngagementPartner
    description: "Signing partner of the engagement. Clears client blocks, delivers the engagement, reviews offshore and shared-service work and approves or denies overtime allowances. Must be the engagement's own partner (or the assignment's review owner) and may never approve a waiver for themselves."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /scheduling/engagements/{engagement_id}/clear-client-block"
      - "POST /scheduling/engagements/{engagement_id}/deliver"
      - "POST /scheduling/assignments/{assignment_id}/start-review"
      - "POST /scheduling/assignments/{assignment_id}/request-rework"
      - "POST /scheduling/assignments/{assignment_id}/accept-review"
      - "POST /scheduling/workload-waivers/{workload_waiver_id}/approve"
      - "POST /scheduling/workload-waivers/{workload_waiver_id}/deny"
    shared_operations:
      - "GET /scheduling/clients/{client_id}"
      - "GET /scheduling/clients"
      - "GET /scheduling/staff-members/{staff_member_id}"
      - "GET /scheduling/staff-members"
      - "GET /scheduling/staff-members/{staff_member_id}/workload"
      - "GET /scheduling/staff-members/{id}/availability-exceptions"
      - "GET /scheduling/engagements/{engagement_id}"
      - "GET /scheduling/engagements"
      - "GET /scheduling/engagements/{engagement_id}/realization"
      - "GET /scheduling/engagement-phases/{engagement_phase_id}"
      - "GET /scheduling/engagement-phases"
      - "GET /scheduling/assignments/{assignment_id}"
      - "GET /scheduling/assignments"
      - "GET /scheduling/assignments/{id}/time-entries"
      - "GET /scheduling/independence-restrictions/{independence_restriction_id}"
      - "GET /scheduling/independence-restrictions"
      - "GET /scheduling/review-capacity-windows/{review_capacity_window_id}"
      - "GET /scheduling/review-capacity-windows"
      - "GET /scheduling/reschedule-plans/{reschedule_plan_id}"
      - "GET /scheduling/reschedule-plans"
      - "GET /scheduling/workload-waivers/{workload_waiver_id}"
      - "GET /scheduling/workload-waivers"

  - name: EngagementStaff
    description: "Any staff member charging time. Logs hours against their own active bookings and requests overtime allowances for themselves. Can never book, approve or review."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /scheduling/time-entries"
      - "POST /scheduling/workload-waivers"
    shared_operations:
      - "GET /scheduling/staff-members/{staff_member_id}"
      - "GET /scheduling/staff-members/{staff_member_id}/workload"
      - "GET /scheduling/staff-members/{id}/availability-exceptions"
      - "GET /scheduling/engagements/{engagement_id}"
      - "GET /scheduling/engagement-phases/{engagement_phase_id}"
      - "GET /scheduling/engagement-phases"
      - "GET /scheduling/assignments/{assignment_id}"
      - "GET /scheduling/assignments"
      - "GET /scheduling/assignments/{id}/time-entries"
      - "GET /scheduling/workload-waivers/{workload_waiver_id}"
      - "GET /scheduling/workload-waivers"

  - name: IndependenceOfficer
    description: "Independence and ethics function. Imposes and lifts client-level restrictions on individual staff. Has no scheduling, review or approval authority."
    identity: opaque
    exclusive_operations:
      - "POST /scheduling/independence-restrictions"
      - "POST /scheduling/independence-restrictions/{independence_restriction_id}/lift"
    shared_operations:
      - "GET /scheduling/clients/{client_id}"
      - "GET /scheduling/clients"
      - "GET /scheduling/staff-members/{staff_member_id}"
      - "GET /scheduling/staff-members"
      - "GET /scheduling/engagements/{engagement_id}"
      - "GET /scheduling/engagements"
      - "GET /scheduling/independence-restrictions/{independence_restriction_id}"
      - "GET /scheduling/independence-restrictions"


