              as: TalentBuyer
              captures: { fk_shp_id: $.data.id, fk_shp_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${fk_shp_id}", expected_show_version: "${fk_shp_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { fk_ofp_id: $.data.id }
            - call: "POST /offers/${fk_ofp_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${fk_ofp_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${fk_arp_id}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${fk_shp_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 400 }
