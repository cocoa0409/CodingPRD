            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "Q", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "NOTICED", notice_channel: "WEBSITE" }
              as: Clerk
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}", "${m2_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /meetings/${meeting_id}/agenda-items"
              payload: { title: "Q item", sequence: 1, item_type: "ACTION" }
              as: Clerk
              captures: { item_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /agenda-items/${item_id}/motions"
              payload: { text: "Q motion", moved_by_member_id: "${m1_id}", seconded_by_member_id: "${m2_id}" }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /motions/${mo_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /motions/${mo_id}/votes"
              payload: { member_id: "${m1_id}", value: "YEA" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /motions/${mo_id}/votes"
              payload: { member_id: "${m1_id}", value: "NAY" }
              as: BodyMember
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /motions/${mo_id}/votes"
              payload: { member_id: "${m2_id}", value: "YEA" }
              as: BodyMember
              as_user_id: "${m2_id}"
          assert:
            - "Motion.${mo_id}.yea_count == 1"
            - "Motion.${mo_id}.nay_count == 1"
            - "Motion.${mo_id}.ballot_count == 2"
