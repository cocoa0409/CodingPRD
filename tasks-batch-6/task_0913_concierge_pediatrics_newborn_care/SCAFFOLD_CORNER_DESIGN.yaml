      - name: corner_immunization_doses_filter_by_prior_valid_dose_id
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/peds/immunization-doses
          - entities.ImmunizationDose.fields.prior_valid_dose_id
        distinguishing_aspect: "The self-referential FK is reverse-reachable: filtering GET /peds/immunization-doses by prior_valid_dose_id returns exactly the doses whose nearest preceding VALID dose is that row, which is 1 for the first dose and 0 for the last."
