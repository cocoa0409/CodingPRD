              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep Y", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness S", scheduled_start: "2026-06-08T09:00:00Z", scheduled_end: "2026-06-08T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
              captures: { asg_id: $.data.id }
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
          trigger:
            - call: "POST /jobs/${job_id}/cancel"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: ScheduleCoordinator
          assert:
            - "Job.${job_id}.status == CANCELLED"
            - "Job.${job_id}.staffing_posture == UNSTAFFED"
            - "Assignment.${asg_id}.status == RELEASED"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_referential_on_assignment_create
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ROLE_KIND_MISMATCH]
        distinguishing_aspect: |
          On POST /jobs/{id}/assignments against an ADJOURNED job, sending a role that also
          mismatches the resource kind triggers BOTH a state precondition violation
          (category=state, priority 5) and a referential mismatch (category=business_referential,
          priority 6); the higher-priority state check wins so ERR_INVALID_STATE returns, not
          ERR_ROLE_KIND_MISMATCH.
        test_recipe:
          setup:
            - "An ADJOURNED job exists; a VIDEOGRAPHER resource exists. A REPORTER-role assignment with a videographer resource is attempted (kind mismatch) on the adjourned job."
          setup_api_calls:
