      - name: recover_at_exactly_the_recovery_deadline_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=18]
          - errors[ERR_RECOVERY_WINDOW_CLOSED]
          - entities.Cart.fields.recovery_deadline_at
        distinguishing_aspect: "The recovery window is half-open: the deadline instant itself is already closed, so a recover issued at exactly abandoned_at + 20 minutes returns 409 ERR_RECOVERY_WINDOW_CLOSED with the cart left ABANDONED and recovered_count 0."
        test_recipe:
          setup:
            - "Viewer 1 holds 2 units on a LIVE show and abandons at 18:10Z, so recovery_deadline_at is 18:30Z; the clock is then set to exactly 18:30Z while the offer window (to 19:00Z) is still open."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - *k_activate
            - *k_cart1
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 2 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itR: $.data.id }
            - call: "POST /carts/${ct1}/abandon"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T18:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carts/${ct1}/recover"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { err_rec: $.data.error_id }
          assert:
            - "HTTP 409 with ${err_rec} == ERR_RECOVERY_WINDOW_CLOSED"
            - "Cart.${ct1}: status == ABANDONED, recovered_count == 0, recovery_deadline_at == 2026-08-10T18:30:00Z, held_item_count == 0"
            - "CartItem.${itR}.state == RELEASED and FlashOffer.${o1}.held_qty == 0, remaining_qty == 10, status == ACTIVE"

      - name: checkout_of_empty_cart_with_current_version_returns_empty_cart
        claim_type: cascading_validation
        grounds:
          - validations[priority=28]
          - errors[ERR_EMPTY_CART]
          - concurrency_rules.cart-checkout-stale-cart
        distinguishing_aspect: "The OCC check runs before the basket check: a checkout that carries the CURRENT cart version passes priority 7 and is then refused by 422 ERR_EMPTY_CART, proving the two rules are ordered rather than conflated."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z; viewer 1 opens a cart and never adds a line. The cart version is read immediately before the checkout."
          setup_api_calls:
            - *k_clock_t0
