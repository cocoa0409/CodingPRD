            - "IFSPService.${svc_id}.units_committed == 24, units_pool_remaining == 72 and units_delivered == 0"

  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: service_unit_pool_conserved_across_authorize_revoke
        grounds:
          - calculations.service_unit_pool
          - state_machines.ProviderAuthorization[ACTIVE -> REVOKED]
          - entities.IFSPService.fields.units_committed
          - entities.IFSPService.fields.units_pool_remaining
          - endpoints[POST /ei/provider-authorizations/{authorizationId}/revoke]
        distinguishing_aspect: |
          The conserved quantity here is UNITS on one service line: revoking an authorization that has
          already delivered 2 of its 24 units must release exactly the 22 unconsumed units, leaving
          units_committed at 2 and units_pool_remaining at 94 so the two still sum to the 96 planned
          units. A naive compensation releases all 24 (pool 96, delivered units double-counted) or
          releases nothing (pool 72 forever). The other compensating_invariant instance conserves MONEY
          on the family ledger and, unlike this one, includes a compensation that must be REFUSED
          because it would break the identity.
        test_recipe:
          setup:
            - "An ACTIVE_SERVICES case whose ACTIVE plan carries one HOME SPEECH_THERAPY line of 96 planned units."
            - "An ACTIVE authorization for 24 units over 2026-03-21..2026-04-30, so units_committed is 24 and units_pool_remaining is 72."
            - "One 30-minute visit on 2026-03-23 already documented as DELIVERED for 2 units, so units_consumed is 2 and units_remaining is 22."
            - "No CostShare exists, so the delivered visit carries billing_status EXEMPT and the money ledger stays out of the way."
            - "Logical clock at 2026-03-24T12:00:00Z, inside the authorization window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-03-19", setting_code: "HOME" }
              as: Evaluator
              captures: { fam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/assessments/${eval_id}/complete"
              payload: { completion_date: "2026-03-18", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam_id}/complete"
              payload: { completion_date: "2026-03-19", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/referrals/${ref_id}/eligibility-determination"
              payload: { is_eligible: true, determination_date: "2026-03-20" }
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref_id}/entry-outcomes"
              payload: { measurement_date: "2026-03-20", rating_social: 3, rating_knowledge: 4, rating_needs: 3 }
              as: Evaluator
            - call: "GET /ei/referrals/${ref_id}"
              as: ProgramAdmin
              captures: { ref_v: $.data.version }
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref_id}", ifsp_type: "INITIAL", meeting_date: "2026-03-20", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref_v}" }
              as: ProgramAdmin
              captures: { ifsp_id: $.data.id }
            - call: "POST /ei/ifsp-services"
              payload: { ifsp_id: "${ifsp_id}", service_type: "SPEECH_THERAPY", setting_code: "HOME", frequency_per_month: 4, units_per_session: 2, unit_rate_cents: 6500, planned_units_total: 96 }
              as: ProgramAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /ei/ifsps/${ifsp_id}/consent"
              payload: { consent_scope: "FULL", consent_signed_date: "2026-03-20" }
              as: FamilyRepresentative
              as_user_id: "${child_id}"
            - call: "POST /ei/providers"
              payload: { agency_name: "Riverbend Pediatric Therapies", qualified_service_types: ["SPEECH_THERAPY"], credential_expiry_date: "2027-06-30" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ei/provider-authorizations"
              payload: { ifsp_service_id: "${svc_id}", provider_id: "${prov_id}", start_date: "2026-03-21", end_date: "2026-04-30", authorized_units: 24 }
              as: ProgramAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /ei/service-visits"
              payload: { provider_authorization_id: "${auth_id}", scheduled_start: "2026-03-23T09:00:00Z", scheduled_end: "2026-03-23T09:30:00Z", setting_code: "HOME" }
              as: ProgramAdmin
              captures: { visit1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-24T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-visits/${visit1_id}/document"
              payload: { visit_status: "DELIVERED", actual_units: 2, session_note: "Caregiver coaching on sound imitation during play." }
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /ei/provider-authorizations/${auth_id}/revoke"
              payload: { revocation_reason_code: "ADMIN_CORRECTION" }
              as: ProgramAdmin
          assert:
            - "ProviderAuthorization.${auth_id}.status == \"REVOKED\" with revocation_reason_code == \"ADMIN_CORRECTION\" and revoked_date == \"2026-03-24\""
            - "ProviderAuthorization.${auth_id}.units_released == 22, units_consumed == 2 and units_remaining == 0"
            - "IFSPService.${svc_id}.units_committed == 2 (authorized_units 24 minus units_released 22)"
            - "IFSPService.${svc_id}.units_pool_remaining == 94"
            - "units_committed + units_pool_remaining == 96 == IFSPService.${svc_id}.planned_units_total, so the pool identity holds after the compensation"
            - "IFSPService.${svc_id}.units_delivered == 2 is preserved and status stays \"IN_DELIVERY\""
            - "ServiceVisit.${visit1_id}.visit_status == \"DELIVERED\" with actual_units == 2, untouched by the revocation"

      - name: family_ledger_conserved_across_accrual_and_void
        grounds:
          - calculations.family_ledger
          - validations[priority 62 -> ERR_LEDGER_WOULD_UNBALANCE]
          - validations[priority 17 -> ERR_SEGREGATION_OF_DUTIES]
          - state_machines.ServiceVisit[billing_status ACCRUED -> REVERSED]
          - endpoints[POST /ei/service-visits/{visitId}/void]
          - endpoints[POST /ei/cost-shares/{costShareId}/waive]
        distinguishing_aspect: |
          The conserved quantity here is MONEY, and the decisive behaviour is a compensation that must
          be REFUSED: after two 650-cent accruals and a 200-cent waiver by a second fiscal officer,
          voiding the first visit leaves a consistent 650 == 450 + 200 ledger, but voiding the second
          would drive total_assessed to 0 against 200 already waived, so it must fail with
          ERR_LEDGER_WOULD_UNBALANCE and change nothing at all. The other compensating_invariant
          instance conserves units and has no refused branch.
        test_recipe:
          setup:
            - "An ACTIVE_SERVICES case with an ACTIVE plan, one HOME SPEECH_THERAPY line at 6500 cents per unit and an ACTIVE 24-unit authorization over 2026-03-21..2026-04-30."
            - "A PROVISIONAL CostShare for 2026-03 determined by fiscal-officer-1 at household size 4 and declared income 12,000,000 cents: TIER_1, coinsurance 0.05, cap 12000, assessed 2600."
            - "Two 30-minute HOME visits on 2026-03-23 and 2026-03-24 both documented as DELIVERED for 2 units, each accruing 650 cents (2 x 6500 x 0.05), so total_assessed_cents is 1300 and month_accrued_cents is 1300."
            - "fiscal-officer-2 has waived 200 cents for hardship, leaving family_balance_cents 1100 and family_waived_cents 200 against total_assessed_cents 1300."
            - "Logical clock at 2026-03-24T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-03-19", setting_code: "HOME" }
              as: Evaluator
              captures: { fam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/assessments/${eval_id}/complete"
              payload: { completion_date: "2026-03-18", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam_id}/complete"
              payload: { completion_date: "2026-03-19", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/referrals/${ref_id}/eligibility-determination"
              payload: { is_eligible: true, determination_date: "2026-03-20" }
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref_id}/entry-outcomes"
              payload: { measurement_date: "2026-03-20", rating_social: 3, rating_knowledge: 4, rating_needs: 3 }
              as: Evaluator
            - call: "GET /ei/referrals/${ref_id}"
              as: ProgramAdmin
              captures: { ref_v: $.data.version }
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref_id}", ifsp_type: "INITIAL", meeting_date: "2026-03-20", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref_v}" }
              as: ProgramAdmin
              captures: { ifsp_id: $.data.id }
            - call: "POST /ei/ifsp-services"
              payload: { ifsp_id: "${ifsp_id}", service_type: "SPEECH_THERAPY", setting_code: "HOME", frequency_per_month: 4, units_per_session: 2, unit_rate_cents: 6500, planned_units_total: 96 }
              as: ProgramAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /ei/ifsps/${ifsp_id}/consent"
              payload: { consent_scope: "FULL", consent_signed_date: "2026-03-20" }
              as: FamilyRepresentative
              as_user_id: "${child_id}"
            - call: "POST /ei/cost-shares"
              payload: { referral_id: "${ref_id}", effective_month: "2026-03", household_size: 4, declared_annual_gross_income_cents: 12000000, insurance_use_consent: false }
              as: FiscalOfficer
              as_user_id: "fiscal-officer-1"
              captures: { cs_id: $.data.id }
            - call: "POST /ei/providers"
              payload: { agency_name: "Riverbend Pediatric Therapies", qualified_service_types: ["SPEECH_THERAPY"], credential_expiry_date: "2027-06-30" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ei/provider-authorizations"
              payload: { ifsp_service_id: "${svc_id}", provider_id: "${prov_id}", start_date: "2026-03-21", end_date: "2026-04-30", authorized_units: 24 }
              as: ProgramAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /ei/service-visits"
              payload: { provider_authorization_id: "${auth_id}", scheduled_start: "2026-03-23T09:00:00Z", scheduled_end: "2026-03-23T09:30:00Z", setting_code: "HOME" }
              as: ProgramAdmin
              captures: { visit1_id: $.data.id }
            - call: "POST /ei/service-visits"
              payload: { provider_authorization_id: "${auth_id}", scheduled_start: "2026-03-24T09:00:00Z", scheduled_end: "2026-03-24T09:30:00Z", setting_code: "HOME" }
              as: ProgramAdmin
              captures: { visit2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-24T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-visits/${visit1_id}/document"
              payload: { visit_status: "DELIVERED", actual_units: 2, session_note: "Session one delivered in the family home." }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /ei/service-visits/${visit2_id}/document"
              payload: { visit_status: "DELIVERED", actual_units: 2, session_note: "Session two delivered in the family home." }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /ei/cost-shares/${cs_id}/waive"
              payload: { waive_amount_cents: 200, waiver_reason_code: "HARDSHIP" }
              as: FiscalOfficer
              as_user_id: "fiscal-officer-2"
          trigger:
            - call: "POST /ei/service-visits/${visit1_id}/void"
              payload: { void_reason_code: "DOCUMENTATION_ERROR" }
              as: ProgramAdmin
            - call: "POST /ei/service-visits/${visit2_id}/void"
              payload: { void_reason_code: "DOCUMENTATION_ERROR" }
              as: ProgramAdmin
          assert:
            - "First trigger call succeeds: ServiceVisit.${visit1_id}.visit_status == \"VOIDED\" with billing_status == \"REVERSED\""
            - "After the first void, CostShare.${cs_id}.total_assessed_cents == 650, family_balance_cents == 450, family_waived_cents == 200 and month_accrued_cents == 650, so total_assessed_cents == family_balance_cents + family_waived_cents"
            - "Second trigger call: response.error.error_id == \"ERR_LEDGER_WOULD_UNBALANCE\" with HTTP 409, because the reversal would leave 0 assessed against 200 waived"
            - "ServiceVisit.${visit2_id}.visit_status == \"DELIVERED\" with billing_status == \"ACCRUED\" and family_share_cents == 650, unchanged by the rejected void"
            - "CostShare.${cs_id}.total_assessed_cents == 650, family_balance_cents == 450, family_waived_cents == 200 and month_accrued_cents == 650 after the rejection"
            - "CostShare.${cs_id}.waiver_reason_code == \"HARDSHIP\" and determined_by_user_id == \"fiscal-officer-1\""
            - "ProviderAuthorization.${auth_id}.units_consumed == 2 and units_remaining == 22; IFSPService.${svc_id}.units_delivered == 2"
