            - "One BASIC customer owns two orders, each with a single 2-unit AMB-1 line and a CONFIRMED 2-unit booking: order_1 on slot 1 and order_2 on slot 2; order_1 is slotted into wave WA (slot 1) and order_2 into wave WB (slot 2)."
