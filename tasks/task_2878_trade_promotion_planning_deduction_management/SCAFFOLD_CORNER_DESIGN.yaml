          The portal user's one write is retailer-respond, and it is scoped by
          entity_backed:Customer: the other retailer's portal login is refused at priority 4
          with 403 ERR_CUSTOMER_SCOPE_VIOLATION even though the dispute is genuinely
          AWAITING_RETAILER, while the addressed retailer's reply moves it back to OPEN and
          records retailer_response without touching round_count.
        test_recipe:
          setup:
