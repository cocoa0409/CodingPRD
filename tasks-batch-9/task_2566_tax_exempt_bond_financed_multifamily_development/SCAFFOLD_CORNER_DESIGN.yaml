  - section: calculations
    instances:
      - name: qualified_basis_floors_per_unit_then_sums_and_the_annual_credit_rounds_half_up
        claim_type: correct_result
        grounds:
          - calculations.qualified_basis_and_annual_credit
          - entities.CreditAllocation.fields.qualified_basis_cents
          - entities.CreditAllocation.fields.applicable_fraction_bps
          - entities.CreditAllocation.fields.annual_credit_cents
          - entities.CreditAllocation.fields.total_credit_cents
          - endpoints[POST /credit-allocations]
        distinguishing_aspect: |
          The CF numbers are chosen so the pinned per-unit rounding order is the
          only way to the right answer. Certified eligible basis 355,000,000 over
          3400 total sqft: unit 101 gives floor(355,000,000*800/3400) = 83,529,411
          and unit 102 gives floor(355,000,000*900/3400) = 93,970,588, summing to
          177,499,999. The project-level shortcut floor(355,000,000*1700/3400)
          returns 177,500,000 - one cent too high. The annual credit then exercises
          the other half of the rule: round_half_up(177,499,999*400/10000) =
          round_half_up(7,099,999.96) = 7,100,000, so a floor here would report
          7,099,999 and a ten-year total of 70,999,990 instead of 71,000,000.
