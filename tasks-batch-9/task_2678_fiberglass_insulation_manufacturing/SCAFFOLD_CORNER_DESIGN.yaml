      - name: thermal_verdict_variants_diverge_on_identical_specimens
        claim_type: variant_selection
        grounds:
          - calculations.thermal_conformance_verdict.variants
          - entities.ThermalTest.fields.conformance_basis
        excluded_because:
          difficulty_instance: thermal_verdict_per_specimen_versus_lot_mean_on_identical_specimens
          rationale: "The §1.8 instance already runs one specimen vector through both a PER_SPECIMEN and a LOT_MEAN program, shows the opposite verdicts, and pins that the basis is captured onto the ThermalTest at creation so a later program change cannot retroactively flip a recorded result. Variant selection has no residue left to probe at breadth level."

      - name: changeover_scrap_switches_from_provisional_to_reconciled_at_close
        claim_type: reconciliation
        grounds:
          - calculations.changeover_scrap_accounting.variants
          - endpoints[POST /changeover-events/{changeoverId}/close]
        excluded_because:
          difficulty_instance: changeover_scrap_provisional_versus_reconciled_on_same_event
          rationale: "The §1.8 instance drives one ChangeoverEvent through both variants — the PROVISIONAL estimate from the density, width and facing deltas at creation, then the RECONCILED figure from the weighed trim at close — and checks the stored delta plus the CulletBatch minted from recovered_cullet_kg. A breadth instance would be the same call sequence with fewer assertions."

      - name: the_plant_glass_ledger_is_a_running_aggregate_over_every_charge
        claim_type: aggregation
        grounds:
          - calculations.cullet_charge_allocation
          - entities.Plant.fields.total_charge_kg_ytd
        excluded_because:
          difficulty_instance: cullet_charge_reversal_preserves_total_glass_mass
          rationale: "The §1.8 instance is the aggregation claim at depth: it adds charges, reverses them, and reconciles the running totals and the derived fraction after each step, including the ROUND_FLOOR cap and the recomputed cullet_on_hand_kg identity."

