  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cold_storage_capacity_aggregate_occupancy_overlap
        grounds:
          - validations[priority=11]
          - calculations.cold_storage_occupancy
          - entities.ColdStorageUnit.fields.stored_lbs
        distinguishing_aspect: |
          Aggregate-capacity overlap on the ColdStorageUnit resource: a new lot is rejected when
          stored_lbs + intake_lbs would exceed capacity_lbs — overlap measured as cumulative
          poundage occupancy (sum of co-resident {AVAILABLE,RESERVED} lots), not a time window.
        test_recipe:
          setup:
            - "A REFRIGERATED unit capacity 500 already holding two lots totalling 450 lbs; a third 100-lb lot would total 550."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 500 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 250, expiration_date: "2026-09-01T00:00:00.000Z" }
              as: FoodBankOperator
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "DAIRY", source_type: "DONATION", intake_lbs: 200, expiration_date: "2026-09-01T00:00:00.000Z" }
              as: FoodBankOperator
          trigger:
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 100, expiration_date: "2026-09-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COLD_STORAGE_CAPACITY_EXCEEDED (450+100 > 500)"
            - "ColdStorageUnit.${unit_id}.stored_lbs == 450.00 (unchanged)"

      - name: fefo_expiration_window_consumption_ordering
        grounds:
          - state_machines.InventoryLot.AVAILABLE_to_RESERVED
          - calculations.fair_share_cap
          - entities.OrderLine.fields.reserved_lot_id
        distinguishing_aspect: |
          FEFO consumption-window overlap on InventoryLot (a different resource and a different
          interval semantics — earliest-expiration ordering rather than aggregate capacity):
          when two PRODUCE lots can both satisfy a line, the FEFO-earliest expiration_date lot is
          consumed first; reserved_lot_id points to the earlier-expiring lot.
        test_recipe:
          setup:
            - "Two PRODUCE lots: lot-early exp 2026-07-01 (100 lbs), lot-late exp 2026-08-01 (100 lbs). An order line requests 60 lbs."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 100, expiration_date: "2026-08-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_late_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 100, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_early_id: $.data.id, lot_early_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry J", service_area: "County-10", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W33", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 60 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_early_v}" }
              as: AllocationManager
          assert:
            - "OrderLine.reserved_lot_id == ${lot_early_id} (FEFO: earliest expiration 2026-07-01 consumed first)"
            - "InventoryLot.${lot_early_id}.remaining_lbs == 40.00 and InventoryLot.${lot_late_id}.remaining_lbs == 100.00"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_conserves_lot_poundage
        grounds:
          - state_machines.AgencyOrder.APPROVED_to_CANCELLED
          - state_machines.InventoryLot.RESERVED_to_AVAILABLE
          - entities.InventoryLot.fields.remaining_lbs
        distinguishing_aspect: |
          Conserved quantity = total lot poundage: sum over the lot's remaining_lbs + reserved
          poundage is invariant. Approving reserves 200 (remaining 300->100); cancel releases 200
          (remaining 100->300), leaving remaining_lbs back at its pre-approval 300.00 with zero drift.
        test_recipe:
          setup:
            - "A 300-lb PRODUCE lot; an order reserves 200 lbs on approval, then is cancelled."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 300, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry K", service_area: "County-11", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W34", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 200 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
          trigger:
            - call: "POST /agency-orders/${order_id}/cancel"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
          assert:
            - "InventoryLot.${lot_id}.remaining_lbs == 300.00 (released poundage equals reserved; zero drift)"
            - "InventoryLot.${lot_id}.disposition == AVAILABLE"
            - "AgencyOrder.${order_id}.status == CANCELLED"

      - name: event_void_conserves_line_packed_poundage
        grounds:
          - state_machines.DistributionEvent.PACKED_to_VOIDED
          - entities.OrderLine.fields.line_status
          - entities.DistributionEvent.fields.planned_lbs
        distinguishing_aspect: |
          Conserved quantity = order's reserved-line poundage (a different conserved quantity than
          lot remaining_lbs): packing moves a 200-lb RESERVED line to PACKED and sets planned_lbs
          200; voiding the PACKED event reverts the line to RESERVED and planned_lbs to 0, so the
          order's total reserved_lbs is unchanged at 200.00.
        test_recipe:
          setup:
            - "A packed event (planned 200) whose order reserved 200 lbs; the event is then voided."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 300, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry L", service_area: "County-12", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W35", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 200 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 1, monthly_income_cents: 100000 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /distribution-events"
              payload: { agency_order_id: "${order_id}", client_household_id: "${hh_id}" }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /distribution-events/${ev_id}/pack"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
          trigger:
            - call: "POST /distribution-events/${ev_id}/void"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
          assert:
            - "DistributionEvent.${ev_id}.status == VOIDED and planned_lbs == 0.00"
            - "OrderLine.line_status == RESERVED (reverted from PACKED) and OrderLine.reserved_lbs == 200.00"
