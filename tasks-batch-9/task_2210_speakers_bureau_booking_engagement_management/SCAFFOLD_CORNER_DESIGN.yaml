  # RBAC (§1.7) — four peer roles under segregation of duties
  # =========================================================================
  - section: rbac
    instances:

      - name: each_role_executes_its_own_exclusive_operations_end_to_end
        claim_type: rbac_exclusive_allowed
        grounds:
          - rbac.BureauAdmin.exclusive_operations
          - rbac.BookingAgent.exclusive_operations
          - rbac.Speaker.exclusive_operations
          - rbac.Client.exclusive_operations
        distinguishing_aspect: |
          The happy path is only reachable if the four roles interlock: BureauAdmin creates the
          roster and the client, BookingAgent qualifies and quotes, Client selects, Speaker
          confirms, both sign their own leg, BookingAgent delivers and BureauAdmin remits. No
          single role can walk the workflow alone.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
