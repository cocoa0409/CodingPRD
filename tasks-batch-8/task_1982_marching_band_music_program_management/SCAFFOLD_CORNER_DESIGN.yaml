# =============================================================================
# §1.9 Scaffold Corner Design — Task 1982 marching band program
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: program_create_applies_defaults
        claim_type: defaults
        grounds: [entities.BandProgram.fields.rental_fee_mode, entities.BandProgram.fields.scoring_mode, entities.BandProgram.fields.delinquency_grace_cents, entities.BandProgram.fields.subsidy_pool_cents]
        distinguishing_aspect: "Omitting optional config fields yields FLAT, RAW_WEIGHTED, 2500, 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "Def", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
          trigger:
            - { call: "GET /band/programs/${prog}", payload: {}, as: Any }
          assert:
            - "BandProgram.${prog}.rental_fee_mode == FLAT, scoring_mode == RAW_WEIGHTED, delinquency_grace_cents == 2500, subsidy_pool_cents == 0"
            - "status == SETUP; music_spent_cents == 0; repair_spent_cents == 0; version == 1"
      - name: student_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Student.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting full_name (source input, no default) → ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["program in ENROLLMENT_OPEN"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "RF", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
          trigger:
            - { call: "POST /band/students", payload: { program_id: "${prog}", grade: 9, section: "BRASS" }, as: BandDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: student_create_with_invalid_section_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Student.fields.section]
        distinguishing_aspect: "section: STRINGS is outside {WOODWIND, BRASS, PERCUSSION, GUARD} → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["program in ENROLLMENT_OPEN"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "EN", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
          trigger:
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Bad", grade: 9, section: "STRINGS" }, as: BandDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: student_create_with_computed_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.Student.fields.account_balance_cents]
        distinguishing_aspect: "Supplying computed field account_balance_cents in a create payload is an unknown input → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["program in ENROLLMENT_OPEN"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "CF", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
          trigger:
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "X", grade: 9, section: "BRASS", account_balance_cents: 0 }, as: BandDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: get_nonexistent_student_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_STUDENT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID → 404 ERR_STUDENT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /band/students/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STUDENT_NOT_FOUND"
      - name: payment_immutable_append_only_no_update_endpoint
        claim_type: immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment has common_fields false: no PATCH/PUT/DELETE endpoint exists and no version field is exposed."
        test_recipe:
          setup: ["program; enrolled student with one MANUAL_DEBIT payment"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "IM", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Led", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
          trigger:
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "MANUAL_DEBIT", amount_cents: 700 }, as: BoosterTreasurer, captures: { pay: $.data.id } }
            - { call: "GET /band/payments/${pay}", payload: {}, as: Any }
          assert:
            - "Payment.${pay} exposes id and created_at but no version and no updated_at"
            - "No PATCH/PUT/DELETE /band/payments route exists in §1.5 (append-only)"
      - name: students_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and emits total_count + has_more."
        test_recipe:
          setup: ["program; 3 enrolled students"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "PG", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "P1", grade: 9, section: "BRASS" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "P2", grade: 10, section: "BRASS" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "P3", grade: 11, section: "BRASS" }, as: BandDirector }
          trigger:
            - { call: "GET /band/students", payload: { program_id: "${prog}", limit: 2, offset: 0 }, as: Any }
            - { call: "GET /band/students", payload: { program_id: "${prog}", limit: 2, offset: 2 }, as: Any }
          assert:
            - "First page: 2 items, total_count == 3, has_more == true"
            - "Second page: 1 item, total_count == 3, has_more == false"
      - name: instrument_serial_unique_per_program
        claim_type: type_constraints
        grounds: [entities.Instrument.fields.serial_number, "errors[ERR_SERIAL_NUMBER_TAKEN]"]
        distinguishing_aspect: "Duplicate serial_number inside one program → ERR_SERIAL_NUMBER_TAKEN; same serial in another program succeeds."
        test_recipe:
          setup: ["programs P1, P2 both ENROLLMENT_OPEN; instrument SN-DUP in P1"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "S1", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { p1: $.data.id } }
            - { call: "POST /band/programs/${p1}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/programs", payload: { season_name: "S2", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { p2: $.data.id } }
            - { call: "POST /band/programs/${p2}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${p1}", serial_number: "SN-DUP", instrument_type: "FLUTE", replacement_value_cents: 40000 }, as: EquipmentManager }
          trigger:
            - { call: "POST /band/instruments", payload: { program_id: "${p1}", serial_number: "SN-DUP", instrument_type: "OBOE", replacement_value_cents: 90000 }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /band/instruments", payload: { program_id: "${p2}", serial_number: "SN-DUP", instrument_type: "OBOE", replacement_value_cents: 90000 }, as: EquipmentManager, captures: { ok_id: $.data.id } }
          assert:
            - "err == ERR_SERIAL_NUMBER_TAKEN within P1"
            - "Instrument.${ok_id} created in P2 with the same serial (program-scoped uniqueness)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: retired_instrument_is_terminal_and_negative_space
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Instrument, "errors[ERR_INSTRUMENT_RETIRED]", "errors[ERR_INSTRUMENT_NOT_AVAILABLE]"]
        distinguishing_aspect: "RETIRED is irreversible: retire of a RETIRED instrument → ERR_INSTRUMENT_RETIRED; assignment of it → ERR_INSTRUMENT_NOT_AVAILABLE even when it is the only instrument of its type."
        test_recipe:
          setup: ["program ENROLLMENT_OPEN; enrolled student; instrument retired from AVAILABLE"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "RT", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "R", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-RT-1", instrument_type: "TUBA", replacement_value_cents: 90000 }, as: EquipmentManager, captures: { inst: $.data.id } }
            - { call: "POST /band/instruments/${inst}/retire", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /band/instruments/${inst}/retire", payload: {}, as: EquipmentManager, captures: { err1: $.data.error_id } }
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu}", instrument_id: "${inst}", due_date: "2026-08-20T00:00:00Z" }, as: EquipmentManager, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INSTRUMENT_RETIRED (terminal lockdown)"
            - "err2 == ERR_INSTRUMENT_NOT_AVAILABLE (negative space: a retired asset never becomes assignable)"
      - name: batch_send_requires_nonempty_batch
        claim_type: precondition_enforcement
        grounds: [state_machines.CleaningBatch.OPEN_to_SENT, "errors[ERR_BATCH_EMPTY]"]
        distinguishing_aspect: "send on an OPEN batch with garment_count == 0 → ERR_BATCH_EMPTY (empty-set precondition)."
        test_recipe:
          setup: ["program ENROLLMENT_OPEN; empty batch"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "BE", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/cleaning-batches", payload: { program_id: "${prog}" }, as: EquipmentManager, captures: { batch: $.data.id } }
          trigger:
            - { call: "POST /band/cleaning-batches/${batch}/send", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_BATCH_EMPTY; CleaningBatch.${batch}.status == OPEN"
      - name: arrangement_lifecycle_happy_path_and_budget_spend
        claim_type: valid_transition
        grounds: [state_machines.MusicArrangement, calculations.music_budget_check]
        distinguishing_aspect: "QUOTED → APPROVED → LICENSED_ACTIVE with music_spent_cents tracking; expiry at rights_end via clock."
        test_recipe:
          setup: ["program music budget 100000; arrangement cost 30000 rights_end 2026-09-01 created by AssistantDirector (user asst-1)"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "AR", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/arrangements", payload: { program_id: "${prog}", title: "Show Opener", arranger: "J. Smith", license_type: "CUSTOM_ARRANGEMENT", cost_cents: 30000, rights_end: "2026-09-01T00:00:00Z" }, as: AssistantDirector, as_user_id: "asst-1", captures: { arr: $.data.id } }
          trigger:
            - { call: "POST /band/arrangements/${arr}/approve", payload: {}, as: BandDirector, as_user_id: "dir-1" }
            - { call: "POST /band/arrangements/${arr}/purchase", payload: {}, as: BoosterTreasurer }
            - { call: "GET /band/programs/${prog}", payload: {}, as: Any }
            - { call: "POST /band/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: BandDirector }
            - { call: "GET /band/arrangements/${arr}", payload: {}, as: Any }
          assert:
            - "After approve: status == APPROVED, approver_user_id == dir-1"
            - "After purchase: status == LICENSED_ACTIVE; BandProgram.music_spent_cents == 30000"
            - "After clock passes rights_end: status == EXPIRED and music_spent_cents still == 30000"
      - name: assignment_auto_overdue_on_clock_advance
        claim_type: automatic_transition
        grounds: [state_machines.InstrumentAssignment.ACTIVE_to_OVERDUE]
        distinguishing_aspect: "Advancing the logical clock past due_date flips ACTIVE → OVERDUE without any client write to the assignment."
        test_recipe:
          setup: ["program; enrolled student; assignment due 2026-08-10T00:00:00Z; clock at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "OD", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Late", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-OD-1", instrument_type: "HORN", replacement_value_cents: 50000 }, as: EquipmentManager, captures: { inst: $.data.id } }
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu}", instrument_id: "${inst}", due_date: "2026-08-10T00:00:00Z" }, as: EquipmentManager, captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /band/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: BandDirector }
            - { call: "GET /band/instrument-assignments/${asg}", payload: {}, as: Any }
          assert:
            - "InstrumentAssignment.${asg}.status == OVERDUE after clock advance"
      - name: overdue_return_posts_late_fee
        claim_type: side_effect_execution
        grounds: [calculations.late_fee_accrual, state_machines.InstrumentAssignment.OVERDUE_to_RETURNED]
        distinguishing_aspect: "21 days overdue → ceil(21/7)=3 weeks × 500 = 1500 LATE_FEE_DEBIT posted at return."
        test_recipe:
          setup: ["program; enrolled student; assignment due 2026-08-10; clock moved to 2026-08-31 (21 days late)"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "LF", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Late2", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-LF-1", instrument_type: "HORN", replacement_value_cents: 50000 }, as: EquipmentManager, captures: { inst: $.data.id } }
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu}", instrument_id: "${inst}", due_date: "2026-08-10T00:00:00Z" }, as: EquipmentManager, captures: { asg: $.data.id } }
            - { call: "POST /band/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: BandDirector }
          trigger:
            - { call: "POST /band/instrument-assignments/${asg}/return", payload: { inspection_result: "PASS" }, as: EquipmentManager }
            - { call: "GET /band/students/${stu}/ledger", payload: {}, as: Any }
          assert:
            - "InstrumentAssignment.${asg}.late_fee_cents == 1500"
            - "Ledger contains LATE_FEE_DEBIT 1500 and RENTAL_FEE_DEBIT 15000; Student.${stu}.account_balance_cents == 16500"
            - "Instrument.${inst}.status == AVAILABLE (PASS inspection)"
      - name: event_postpone_reschedule_cycle
        claim_type: valid_transition
        grounds: [state_machines.Event.SCHEDULED_to_POSTPONED, state_machines.Event.POSTPONED_to_SCHEDULED]
        distinguishing_aspect: "Branching with revert: SCHEDULED → POSTPONED → SCHEDULED with a new window; the new window re-runs the facility conflict check."
        test_recipe:
          setup: ["program; outdoor event A STADIUM 10:00-12:00; event B STADIUM 13:00-15:00"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "PP", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "REHEARSAL", facility: "STADIUM", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt_a: $.data.id } }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "REHEARSAL", facility: "STADIUM", starts_at: "2026-08-10T13:00:00Z", ends_at: "2026-08-10T15:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt_b: $.data.id } }
          trigger:
            - { call: "POST /band/events/${evt_a}/postpone", payload: { new_starts_at: "2026-08-10T14:00:00Z", new_ends_at: "2026-08-10T16:00:00Z" }, as: BandDirector, captures: { err: $.data.error_id } }
            - { call: "POST /band/events/${evt_a}/postpone", payload: { new_starts_at: "2026-08-11T10:00:00Z", new_ends_at: "2026-08-11T12:00:00Z" }, as: BandDirector }
          assert:
            - "First reschedule collides with B → err == ERR_FACILITY_CONFLICT and A remains SCHEDULED (unchanged window)"
            - "Second reschedule succeeds: Event.${evt_a}.status == SCHEDULED with window 2026-08-11T10:00-12:00"
      - name: event_terminal_lockdown_cancel
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Event, "errors[ERR_EVENT_TERMINAL]"]
        distinguishing_aspect: "From CANCELLED, no further transitions: postpone/complete/cancel all fail with ERR_EVENT_TERMINAL."
        test_recipe:
          setup: ["program; event cancelled"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "TL", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "REHEARSAL", facility: "GYM", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", is_outdoor: false }, as: BandDirector, captures: { evt: $.data.id } }
            - { call: "POST /band/events/${evt}/cancel", payload: {}, as: BandDirector }
          trigger:
            - { call: "POST /band/events/${evt}/complete", payload: {}, as: BandDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_TERMINAL; Event.${evt}.status == CANCELLED"
      - name: invalid_from_state_return_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.InstrumentAssignment, "errors[ERR_ASSIGNMENT_NOT_ACTIVE]"]
        distinguishing_aspect: "Returning an already-RETURNED assignment → ERR_ASSIGNMENT_NOT_ACTIVE; idempotency via state machine, no double fee."
        test_recipe:
          setup: ["program; enrolled student; assignment returned PASS"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "IT", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Tw", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-IT-1", instrument_type: "HORN", replacement_value_cents: 50000 }, as: EquipmentManager, captures: { inst: $.data.id } }
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu}", instrument_id: "${inst}", due_date: "2026-08-20T00:00:00Z" }, as: EquipmentManager, captures: { asg: $.data.id } }
            - { call: "POST /band/instrument-assignments/${asg}/return", payload: { inspection_result: "PASS" }, as: EquipmentManager }
          trigger:
            - { call: "POST /band/instrument-assignments/${asg}/return", payload: { inspection_result: "PASS" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ASSIGNMENT_NOT_ACTIVE; Student.${stu}.account_balance_cents == 15000 (no double-posting)"
      - name: instrument_cyclic_shape_covered
        claim_type: shape_cyclic
        grounds: [state_machines.Instrument]
        excluded_because:
          difficulty_instance: instrument_cyclic_lifecycle_loop
          rationale: "Cycle traversal asserted end-to-end by the §1.8 instance."
      - name: trip_enrollment_parallel_shape_covered
        claim_type: shape_parallel
        grounds: [state_machines.TripEnrollment]
        excluded_because:
          difficulty_instance: trip_enrollment_parallel_state_dimensions
          rationale: "Parallel-dimension independence asserted by the §1.8 instance."
      - name: waitlist_promotion_on_excuse
        claim_type: automatic_transition
        grounds: [calculations.waitlist_promotion, state_machines.TripEnrollment.WAITLISTED_to_REGISTERED]
        distinguishing_aspect: "Capacity 1: first enrollment REGISTERED, second WAITLISTED; excusing the first promotes the second (earliest created_at) and recomputes its provisional share."
        test_recipe:
          setup: ["program; event; trip capacity 1 est 8000 departure 2026-09-15; students A (enrolled first) and B (waitlisted)"]
          setup_api_calls:
