          The entry fee is settled in instalments and both directions are
          policed: executing the approved ADMIT with 3000000 of 5000000 paid
          returns 402 ERR_ENTRY_FEE_OUTSTANDING, an instalment one cent over the
          balance returns 422 ERR_ENTRY_FEE_OVERPAYMENT leaving
          entry_fee_paid_cents untouched at 3000000, and only the exact
