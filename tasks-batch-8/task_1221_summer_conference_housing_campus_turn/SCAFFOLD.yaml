    output: { current_utc: string }
    side_effects: ["logical clock advanced; time-dependent computed flags (is_expired) reflect the new clock on next read"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unknown X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Acting role is not in the endpoint's roles list"
  - id: ERR_TURN_REWORK_ESCALATION
    http: 403
    condition: "HousekeepingSupervisor attempts to inspect a TurnTask with rework_count >= 2"
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "ClientCoordinator acts on a ConferenceGroup whose id != X-User-ID"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id does not reference an existing entity"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum member, malformed body, or body FK referencing a non-existent entity"
  - id: ERR_DATE_RANGE_INVALID
    http: 400
    condition: "end_date < start_date, checkout_at <= checkin_at, or departure_date <= arrival_date"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent entity's current version (OCC)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity's state machine does not permit the requested transition from its current state"
  - id: ERR_BUILDING_NOT_RELEASED
    http: 409
    condition: "Group confirm or assignment check-in attempted while the host building is not TURN_ACTIVE"
  - id: ERR_ROOM_NOT_RESERVABLE
    http: 409
    condition: "New assignment targets a room in NEEDS_TURN, IN_TURN, or OUT_OF_SERVICE"
  - id: ERR_GROUP_NOT_CANCELLABLE
    http: 409
    condition: "Cancel attempted on a group in IN_HOUSE, DEPARTED, CLOSED, or CANCELLED"
  - id: ERR_INVOICE_NOT_FINALIZABLE
    http: 409
    condition: "Finalize attempted on a non-PROVISIONAL invoice or while the group is not DEPARTED"
  - id: ERR_INVOICE_ALREADY_PAID
    http: 409
    condition: "record-payment attempted on an invoice already PAID (or VOID)"
  - id: ERR_DAMAGE_NOT_ASSESSED
    http: 409
    condition: "bill/dispute/assess/resolve attempted from a state that does not permit it"
  - id: ERR_REVISION_SUPERSEDED
    http: 409
    condition: "Operation references a StayAssignment or RoomingListRevision that has been superseded"
  - id: ERR_CHAPERONE_RATIO_UNMET
    http: 422
    condition: "Minor-flagged group lacks ceil(minors/10) non-minor chaperones at confirm"
  - id: ERR_SCREENING_NOT_CLEARED
    http: 422
    condition: "A CHAPERONE/STAFF participant of a minor-flagged group lacks a CLEARED screening at confirm"
  - id: ERR_SCREENING_EXPIRED
    http: 422
    condition: "The CLEARED screening's is_expired is true at confirm time"
  - id: ERR_SCREENING_NOT_REQUIRED
    http: 422
    condition: "Screening submitted for a participant with role_in_group ATTENDEE"
  - id: ERR_OCCUPANCY_OVERLAP
    http: 409
    condition: "New assignment's half-open interval intersects another non-cancelled assignment held by the SAME participant (double-booking)"
  - id: ERR_TURN_WINDOW_TOO_SHORT
    http: 422
    condition: "Gap to a neighboring assignment on the same room is below the required turn hours for the applicable linen tier"
  - id: ERR_MAINTENANCE_CONFLICT
    http: 409
    condition: "Maintenance blocked interval [start-buffer, end+buffer] (inclusive) intersects occupied nights or another open window"
  - id: ERR_FALL_DEADLINE_IMMINENT
    http: 422
    condition: "blocked_end_date is not strictly before the building's fall_opening_date"
  - id: ERR_OUTSIDE_CHECKIN_WINDOW
    http: 422
    condition: "Check-in outside [checkin_at, checkout_at), no-show before checkin_at+24h, or maintenance start before start_date"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "Damage dispute attempted more than 7 calendar days after assessed_at"
  - id: ERR_ROOMING_LIST_REQUIRED
    http: 422
    condition: "Confirm attempted without an ACTIVE revision containing at least one assignment"
  - id: ERR_CONTRACTED_BED_MISMATCH
    http: 422
    condition: "ACTIVE revision assignment count != contracted_bed_count at confirm"
  - id: ERR_ROOM_CAPACITY_EXCEEDED
    http: 422
    condition: "Overlapping non-cancelled assignments on the room already equal bed_count"
  - id: ERR_KEY_INVENTORY_EXHAUSTED
    http: 422
    condition: "Key issue attempted while building.available_key_count == 0"
  - id: ERR_LINEN_OVERRETURN
    http: 422
    condition: "Cumulative packs_returned + packs_damaged would exceed packs_issued"
  - id: ERR_DEPOSIT_INSUFFICIENT
    http: 422
    condition: "deposit_paid_cents < 25% of the provisional bed-night estimate at confirm"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "record-payment amount_cents != balance_due_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ConferenceServicesAdmin
    description: Campus conference services administrator; superset of every operational role (hierarchical override)
    identity: opaque
    exclusive_operations:
      - "create buildings and conference groups"
      - "confirm / return-for-revision / close-out groups"
      - "check-in / check-out / mark-no-show"
      - "cancel turn tasks; inspect escalated turn tasks (rework_count >= 2)"
      - "issue / activate / return / report-lost key credentials"
      - "set the logical clock"
    shared_operations:
      - "every operation available to any other role"
  - name: FacilitiesManager
    description: Housing facilities operator; owns building release lifecycle, rooms, maintenance windows, damage reporting/assessment
    identity: opaque
    exclusive_operations:
      - "building lifecycle transitions (initiate/confirm/abort release, begin turn season, begin fall prep, certify fall-ready, reopen academic)"
      - "create rooms"
      - "create / confirm / start / complete / cancel maintenance windows"
      - "report and assess damage"
    shared_operations:
      - "read buildings, rooms, groups, participants, assignments, turn tasks, windows, damage assessments"
  - name: HousekeepingSupervisor
    description: Turn and linen operations lead
    identity: opaque
    exclusive_operations:
      - "start / submit-for-inspection turn tasks"
      - "inspect turn tasks with rework_count < 2"
      - "issue linen and record returns"
    shared_operations:
      - "read buildings, rooms, groups, participants, assignments, turn tasks, windows, linen issues, key credentials"
  - name: FinanceOfficer
    description: Campus bursar representative for conference billing and revenue allocation
    identity: opaque
    exclusive_operations:
      - "record deposits"
      - "finalize invoices and record payments"
      - "bill and resolve damage assessments"
      - "create and lock allocation runs"
    shared_operations:
      - "read buildings, rooms, groups, participants, assignments, invoices, damage assessments, allocation runs, linen issues, key credentials"
  - name: ScreeningReviewer
    description: Background screening officer
    identity: opaque
    exclusive_operations:
      - "begin-review screenings"
      - "decide screenings (CLEAR / FLAG)"
      - "resolve appeals (CLEAR / DENY)"
    shared_operations:
      - "read buildings, rooms, participants, screenings"
  - name: ClientCoordinator
    description: External conference client contact; acts on exactly one ConferenceGroup (X-User-ID == group id)
    identity: "entity_backed:ConferenceGroup"
    exclusive_operations:
      - "submit / cancel own group"
      - "add participants to own group"
      - "create rooming-list revisions for own group"
      - "submit screenings for own participants; appeal FLAGGED screenings"
      - "cancel single RESERVED assignments of own group"
      - "dispute assessed damage of own group"
    shared_operations:
      - "read own group, its participants, revisions, assignments, screenings, damage assessments, buildings, rooms, windows"
