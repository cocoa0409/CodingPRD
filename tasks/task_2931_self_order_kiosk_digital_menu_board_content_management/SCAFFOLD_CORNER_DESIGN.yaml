            - "${s0} == SCHEDULED — SCHEDULE alone cannot activate a window that has not opened"
            - "${adv1} == 1 and ${s1} == ACTIVE exactly at window_start_utc (the interval is closed on the left)"
            - "${adv2} == 0 and ${s2} == ACTIVE exactly at window_end_utc — the closing instant still discounts orders"
            - "${adv3} == 1 and ${s3} == EXPIRED one second later, and EXPIRED is terminal"

      - name: availability_low_stock_threshold_corner
        claim_type: threshold
        grounds:
          - calculations.availability_rollup.constants
        excluded_because:
          difficulty_instance: boundary_condition / low_stock_threshold_inclusive_at_par_ratio_units
          rationale: "threshold-1 / threshold / threshold+1 for round_half_up(par_units x 2000/10000) and the inclusive <= comparison are all asserted there."

      - name: device_health_weighted_scoring_variant_corner
        claim_type: weighted_scoring
        grounds:
          - calculations.device_health_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calculation / rolling_versus_worst_case_device_health_score
          rationale: "The uncapped divergence between rolling_health_score and worst_case_health_score, and the QUARANTINE_MISS_FLOOR gate that withholds quarantine despite a sub-50 worst case, are asserted there."

      - name: order_number_aggregation_corner
        claim_type: aggregation
        grounds:
          - calculations.order_number_and_receipt
        excluded_because:
          difficulty_instance: compensating_invariant / order_void_conserves_reserved_units_but_retires_the_order_number
          rationale: "The running daily counter, its behaviour across a VOID and the open_order_count recount are asserted there."

      - name: board_versus_charge_price_variant_corner
        claim_type: variant_divergence
        grounds:
          - calculations.effective_zone_price.variants
        excluded_because:
          difficulty_instance: dual_variant_calculation / board_snapshot_price_versus_kiosk_charge_price
          rationale: "The same item priced 559 on the board and 599 at the till in one request pair is exactly that instance's subject."

      - name: price_rollback_reconciliation_corner
        claim_type: reconciliation
        grounds:
          - calculations.effective_zone_price
        excluded_because:
          difficulty_instance: compensating_invariant / price_rollback_restores_zone_override_total_and_cache_freshness
          rationale: "The ledger delta when the applied override is withdrawn — and the checksum/stale_flag reconciliation that follows — is asserted there."

      - name: per_line_discount_rounding_corner
        claim_type: precision
        grounds:
          - calculations.order_total_with_campaign_discount.variants
        excluded_because:
          difficulty_instance: ambiguity_trap / per_line_rounded_campaign_discount_mode_b
          rationale: "544 versus 545 on the two-line cart is the pinned per-line-rounding reading, asserted there with both candidate readings named."

      - name: uplift_evaluation_order_corner
        claim_type: constants_applied
        grounds:
          - calculations.price_uplift_and_approval_tier.constants
        excluded_because:
          difficulty_instance: ambiguity_trap / uplift_tier_pinned_evaluation_order_mode_c
          rationale: "DUAL_APPROVAL_UPLIFT_BP and max_uplift_bp against the raw-proposal uplift (1485 pass vs 1610 wrong-reading reject) are asserted there."

  - section: validations
    instances:

      - name: declared_natural_keys_reject_a_second_row_with_the_same_key
        claim_type: violation_to_error
        grounds:
          - validations.priority_8_ERR_DUPLICATE_NATURAL_KEY
          - validations.priority_25_ERR_DUPLICATE_AVAILABILITY
        distinguishing_aspect: "Two separate uniqueness rules fire on their own error ids: a repeated Store.store_code returns ERR_DUPLICATE_NATURAL_KEY (409) from priority 8, while a second StoreItemAvailability for the same (store_id, menu_item_id) returns the dedicated ERR_DUPLICATE_AVAILABILITY (409) from priority 25."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001, Item A and one availability row for (S001, Item A)."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 40, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { avail_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: 0, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { dup_store_err: $.data.error_id }
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 5, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { dup_avail_err: $.data.error_id }
          assert:
            - "the duplicate store returns HTTP 409 with ${dup_store_err} == ERR_DUPLICATE_NATURAL_KEY even though every other field differs"
            - "the duplicate availability returns HTTP 409 with ${dup_avail_err} == ERR_DUPLICATE_AVAILABILITY, not ERR_DUPLICATE_NATURAL_KEY"
            - "GET /kiosk-ops/stores?cluster_id=${cl_id} returns total_count 1 and StoreItemAvailability.${avail_id}.on_hand_units is still 40"

      - name: distinct_keys_satisfy_the_same_uniqueness_rules_and_are_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_8_ERR_DUPLICATE_NATURAL_KEY
          - validations.priority_25_ERR_DUPLICATE_AVAILABILITY
        distinguishing_aspect: "The mirror image of the violation case: a different store_code in the same cluster and a second availability row for a different menu item at the same store both succeed with 201, proving the uniqueness scope is (store_code) and (store_id, menu_item_id) rather than the cluster or the store alone."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001, Items A and B, and one availability row for (S001, Item A)."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-FRIES", display_name: "Fries", category: "SIDE", base_price_cents: 310, screen_reader_text: "Fries", contrast_ratio: 6.2 }
              as: ContentManager
              captures: { item_b_id: $.data.id }
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 40, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S002", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { s2_id: $.data.id, s2_posture: $.data.content_posture }
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_b_id}", on_hand_units: 12, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { b_avail_id: $.data.id, b_state: $.data.availability_state }
          assert:
            - "HTTP 201 for the second store; ${s2_posture} == OPEN at creation and ${s2_id} differs from ${store_id}"
            - "HTTP 201 for the second availability row with ${b_state} == AVAILABLE (12 available against a LOW threshold of 4)"
            - "GET /kiosk-ops/item-availabilities?store_id=${store_id} returns total_count 2 and includes ${b_avail_id}"

      - name: cluster_chain_deeper_than_the_declared_maximum_is_rejected
        claim_type: aggregate_validation
        grounds:
          - validations.priority_24_ERR_CLUSTER_CHAIN_INVALID
          - constants_global.MAX_CLUSTER_CHAIN_DEPTH
          - entities.StoreCluster.fields.chain_depth
        distinguishing_aspect: "Every individual parent link is valid, but the collective depth is not: clusters at chain_depth 0..5 are all accepted and only the seventh, which would sit at chain_depth 6, returns ERR_CLUSTER_CHAIN_INVALID (422)."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; a chain CL0 (root) -> CL1 -> CL2 -> CL3 -> CL4 -> CL5 already exists, each created with the previous one as parent."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL0", tier: "CHAIN" }
              as: PlatformAdmin
              captures: { c0: $.data.id, d0: $.data.chain_depth }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL1", tier: "REGION", parent_cluster_id: "${c0}" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL2", tier: "REGION", parent_cluster_id: "${c1}" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL3", tier: "REGION", parent_cluster_id: "${c2}" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL4", tier: "REGION", parent_cluster_id: "${c3}" }
              as: PlatformAdmin
              captures: { c4: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL5", tier: "REGION", parent_cluster_id: "${c4}" }
              as: PlatformAdmin
              captures: { c5: $.data.id, d5: $.data.chain_depth }
          trigger:
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL6", tier: "REGION", parent_cluster_id: "${c5}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${d0} == 0 for the root and ${d5} == 5, exactly at MAX_CLUSTER_CHAIN_DEPTH, so CL5 is accepted with HTTP 201"
            - "HTTP 422 with error_id == ERR_CLUSTER_CHAIN_INVALID for CL6, whose chain_depth would be 6"
            - "GET /kiosk-ops/store-clusters?parent_cluster_id=${c5} returns total_count 0 — the rejected cluster was not partially created"

      - name: pin_pad_firmware_is_required_only_for_kiosk_devices
        claim_type: conditional_validation
        grounds:
          - validations.priority_27_ERR_DEVICE_KIND_NOT_SUPPORTED
          - entities.Device.fields.device_kind
          - endpoints.POST_/kiosk-ops/devices/{device_id}/payment-attestation
        distinguishing_aspect: "The rule is conditional on device_kind in both directions: a KIOSK without pin_pad_firmware_version is rejected while a MENU_BOARD without it is created, and attesting a MENU_BOARD is rejected while the same call on a KIOSK succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "MENU_BOARD", device_code: "B001", offline_cache_capacity: 1 }
              as: PlatformAdmin
              captures: { board_id: $.data.id, board_pay: $.data.payment_compliance_state }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K001", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { kiosk_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K002", offline_cache_capacity: 2 }
              as: PlatformAdmin
              captures: { kiosk_err: $.data.error_id }
            - call: "POST /kiosk-ops/devices/${board_id}/payment-attestation"
              payload: { pin_pad_firmware_version: "1.4.2", p2pe_certified: true, attestation_expiry_utc: "2027-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { board_err: $.data.error_id }
            - call: "POST /kiosk-ops/devices/${kiosk_id}/payment-attestation"
              payload: { pin_pad_firmware_version: "1.4.2", p2pe_certified: true, attestation_expiry_utc: "2027-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { kiosk_pay: $.data.payment_compliance_state }
          assert:
            - "the MENU_BOARD was created without pin_pad_firmware_version and ${board_pay} == NOT_APPLICABLE"
            - "${kiosk_err} == ERR_DEVICE_KIND_NOT_SUPPORTED with HTTP 422 — a KIOSK must declare its pin pad firmware"
            - "${board_err} == ERR_DEVICE_KIND_NOT_SUPPORTED with HTTP 422 — attestation is meaningless for a board"
            - "${kiosk_pay} == COMPLIANT — the identical attestation payload succeeds on the KIOSK, so the payload is not what was rejected"

      - name: lapsed_store_certificate_blocks_only_the_kiosk_cache_sync
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_30_ERR_STORE_ACCESSIBILITY_LAPSED
          - entities.Store.fields.accessibility_certified_until_utc
          - endpoints.POST_/kiosk-ops/devices/{device_id}/cache-sync
        distinguishing_aspect: "Validity depends on a field of a different entity: with the store's certificate expired on 2026-08-01 and the clock at 2026-08-05, a KIOSK cache-sync of a perfectly PUBLISHED bundle returns ERR_STORE_ACCESSIBILITY_LAPSED (422) while the same sync to a MENU_BOARD of the same store succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST; store S001 has accessibility_certified_until_utc 2026-08-01T00:00:00Z (already lapsed)."
            - "A PUBLISHED bundle exists for CL_WEST; kiosk K001 and board B001 are both ONLINE after an all-true heartbeat."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id, cert: $.data.accessibility_certified_until_utc }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, bundle_ver: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bundle_ver}", daypart_code: "LUNCH", start_minute_of_day: 660, end_minute_of_day: 960, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "ACCESSIBILITY_AUDIT", audit_result: "PASS" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "VALIDATE" }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "PUBLISH" }
              as: ContentManager
              captures: { pub_state: $.data.state }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K001", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { kiosk_id: $.data.id }
            - call: "POST /kiosk-ops/devices/${kiosk_id}/heartbeat"
              payload: { printer_ok: true, touch_ok: true, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${kiosk_id}"
              captures: { kiosk_health: $.data.health_state }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "MENU_BOARD", device_code: "B001", offline_cache_capacity: 1 }
              as: PlatformAdmin
              captures: { board_id: $.data.id }
            - call: "POST /kiosk-ops/devices/${board_id}/heartbeat"
              payload: { printer_ok: true, touch_ok: true, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${board_id}"
          trigger:
            - call: "POST /kiosk-ops/devices/${kiosk_id}/cache-sync"
              payload: { bundle_id: "${bundle_id}" }
              as: DeviceAgent
              as_user_id: "${kiosk_id}"
              captures: { kiosk_err: $.data.error_id }
            - call: "POST /kiosk-ops/devices/${board_id}/cache-sync"
              payload: { bundle_id: "${bundle_id}" }
              as: DeviceAgent
              as_user_id: "${board_id}"
              captures: { board_cache: $.data.cache_state, board_ver: $.data.cached_bundle_version }
          assert:
            - "${cert} == 2026-08-01T00:00:00Z, ${pub_state} == PUBLISHED and ${kiosk_health} == ONLINE — nothing else is wrong with this setup"
            - "the kiosk sync returns HTTP 422 with ${kiosk_err} == ERR_STORE_ACCESSIBILITY_LAPSED, not ERR_BUNDLE_NOT_PUBLISHED"
            - "Device.${kiosk_id}.cache_state is still MISSING and cached_bundle_id is still null"
            - "${board_cache} == FRESH and ${board_ver} == 1 — the rule is scoped to KIOSK devices"

      - name: campaign_window_ending_before_it_starts_is_rejected_at_creation
        claim_type: temporal_validation
        grounds:
          - validations.priority_29_ERR_CAMPAIGN_WINDOW_EXPIRED
          - endpoints.POST_/kiosk-ops/campaign-versions
        distinguishing_aspect: "A temporal rule on the create endpoint: window_end_utc <= window_start_utc is rejected with ERR_CAMPAIGN_WINDOW_EXPIRED (422) rather than ERR_INVALID_REQUEST, even though both instants are well-formed and in the future."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; cluster CL_WEST exists."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/campaign-versions"
              payload: { campaign_code: "BACKWARDS", version_no: 1, cluster_id: "${cl_id}", discount_kind: "PERCENT_OFF", discount_value: 500, window_start_utc: "2026-09-10T00:00:00Z", window_end_utc: "2026-09-01T00:00:00Z", stacking_group: "BASE", priority_rank: 10 }
              as: ContentManager
              captures: { inverted_err: $.data.error_id }
            - call: "POST /kiosk-ops/campaign-versions"
              payload: { campaign_code: "STALE", version_no: 1, cluster_id: "${cl_id}", discount_kind: "PERCENT_OFF", discount_value: 500, window_start_utc: "2026-07-01T00:00:00Z", window_end_utc: "2026-08-01T00:00:00Z", stacking_group: "BASE", priority_rank: 10 }
              as: ContentManager
              captures: { past_err: $.data.error_id }
          assert:
            - "${inverted_err} == ERR_CAMPAIGN_WINDOW_EXPIRED with HTTP 422 for the inverted window"
            - "${past_err} == ERR_CAMPAIGN_WINDOW_EXPIRED with HTTP 422 for a window whose end is already behind the clock"
            - "GET /kiosk-ops/campaign-versions?cluster_id=${cl_id} returns total_count 0"

      - name: publish_gate_requires_the_audit_which_requires_ready_accessibility_copy
        claim_type: cascading_validation
        grounds:
          - validations.priority_19_ERR_ACCESSIBILITY_AUDIT_REQUIRED
          - validations.priority_20_ERR_SCREEN_READER_TEXT_MISSING
          - endpoints.POST_/kiosk-ops/menu-items/{menu_item_id}/accessibility-copy
          - constants_global.MIN_CONTRAST_RATIO
        distinguishing_aspect: "Check A depends on the result of check B: PUBLISH cannot pass until the audit has PASSED (ERR_ACCESSIBILITY_AUDIT_REQUIRED), and the audit cannot pass while a snapshot item's contrast_ratio 3.0 is below MIN_CONTRAST_RATIO 4.5 (ERR_SCREEN_READER_TEXT_MISSING) — the accessibility-copy fix unblocks them in that order."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001."
            - "Item A is created with screen_reader_text 'Classic burger' but contrast_ratio 3.0, so accessibility_state is not READY."
            - "A DRAFT bundle for CL_WEST has one LUNCH slot [660, 960) over category ENTREE and has been VALIDATEd."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 3.0 }
              as: ContentManager
              captures: { item_a_id: $.data.id, item_a_ver: $.data.version, acc_state: $.data.accessibility_state }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, bundle_ver: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bundle_ver}", daypart_code: "LUNCH", start_minute_of_day: 660, end_minute_of_day: 960, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "VALIDATE" }
              as: ContentManager
              captures: { validated: $.data.state }
          trigger:
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "PUBLISH" }
              as: ContentManager
              captures: { publish_err_1: $.data.error_id }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "ACCESSIBILITY_AUDIT", audit_result: "PASS" }
              as: ComplianceOfficer
              captures: { audit_err: $.data.error_id }
            - call: "POST /kiosk-ops/menu-items/${item_a_id}/accessibility-copy"
              payload: { expected_menu_item_version: "${item_a_ver}", screen_reader_text: "Classic burger with lettuce and tomato", contrast_ratio: 7.1 }
              as: ComplianceOfficer
              captures: { fixed_state: $.data.accessibility_state }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "ACCESSIBILITY_AUDIT", audit_result: "PASS" }
              as: ComplianceOfficer
              captures: { audit_state: $.data.accessibility_audit_state, state_after_audit: $.data.state }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "PUBLISH" }
              as: ContentManager
              captures: { final_state: $.data.state, snap_ver: $.data.bundle_version }
          assert:
            - "${acc_state} != READY at creation and ${validated} == VALIDATED — the technical branch never inspects accessibility"
            - "${publish_err_1} == ERR_ACCESSIBILITY_AUDIT_REQUIRED with HTTP 422 while accessibility_audit_state is PENDING"
            - "${audit_err} == ERR_SCREEN_READER_TEXT_MISSING with HTTP 422 — the audit itself is blocked by the sub-threshold contrast_ratio"
            - "${fixed_state} == READY after the accessibility-copy write, which also bumps MenuItem.version"
            - "${audit_state} == PASSED and ${state_after_audit} == VALIDATED — the audit does not move the technical state"
            - "${final_state} == PUBLISHED with ${snap_ver} == 1 once both branches are complete"

      - name: validation_priority_ladder_corner
        claim_type: priority_ordering
        grounds:
          - validations.priority_12_ERR_REQUEST_NOT_APPROVED
          - validations.priority_18_ERR_PAYMENT_DEVICE_NON_COMPLIANT
          - validations.priority_28_ERR_EFFECTIVE_DATE_IN_PAST
        excluded_because:
          difficulty_instance: validation_priority_pair / apply_unapproved_state_beats_dual_approval_shortfall
          rationale: "All three declared priority pairs are asserted in §1.8: P1 there, P2 in payment_noncompliance_beats_item_outside_published_bundle and P3 in past_effective_date_beats_uplift_cap_breach, each with both rules genuinely violated at once."

  - section: endpoints
    instances:

      - name: menu_item_list_endpoint_combines_a_filter_with_limit_and_offset
        claim_type: standard_crud
        grounds:
          - endpoints.GET_/kiosk-ops/menu-items
          - endpoints.POST_/kiosk-ops/menu-items
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list endpoint applies the category filter BEFORE paginating: with three ENTREE items and one SIDE item, limit 2 returns two ENTREE rows with total_count 3 and has_more true, and offset 2 returns the single remaining ENTREE row with has_more false."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; four MenuItems are created in order: ENTREE E1, ENTREE E2, SIDE F1, ENTREE E3."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-E1", display_name: "Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { e1: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-E2", display_name: "Chicken Sandwich", category: "ENTREE", base_price_cents: 540, screen_reader_text: "Chicken sandwich", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { e2: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-F1", display_name: "Fries", category: "SIDE", base_price_cents: 310, screen_reader_text: "Fries", contrast_ratio: 6.2 }
              as: ContentManager
              captures: { f1: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-E3", display_name: "Veggie Wrap", category: "ENTREE", base_price_cents: 480, screen_reader_text: "Veggie wrap", contrast_ratio: 7.4 }
              as: ContentManager
              captures: { e3: $.data.id }
          trigger:
            - call: "GET /kiosk-ops/menu-items?category=ENTREE&limit=2&offset=0"
              payload: {}
              as: ContentManager
              captures: { p1_first: "$.data[0].sku", p1_second: "$.data[1].sku" }
            - call: "GET /kiosk-ops/menu-items?category=ENTREE&limit=2&offset=2"
              payload: {}
              as: ContentManager
              captures: { p2_first: "$.data[0].sku" }
          assert:
            - "page 1 returns exactly 2 rows with ${p1_first} == SKU-E1 and ${p1_second} == SKU-E2, total_count 3, limit 2, offset 0 and has_more true"
            - "page 2 returns exactly 1 row with ${p2_first} == SKU-E3, total_count 3, offset 2 and has_more false"
            - "SKU-F1 never appears on either page — the category filter is applied before the window, so total_count is 3 and not 4"
            - "GET /kiosk-ops/menu-items with no query parameters returns all four rows with total_count 4"

      - name: availability_actions_endpoint_auto_eighty_sixes_a_depleted_sync
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/kiosk-ops/item-availabilities/{availability_id}/actions
          - constants_global.AUTO_86_HOLD_MINUTES
          - entities.StoreItemAvailability.fields.eighty_six_state
        distinguishing_aspect: "One action endpoint dispatches distinct verbs with distinct side-effect sets: SYNC_ON_HAND to 0 auto-86s the row (eighty_six_state AUTO_86, reason INVENTORY_DEPLETED, hold until clock + 120 minutes), and a following RESTORE relists it yet leaves availability_state UNAVAILABLE because the stock is still 0."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001, Item A with an availability row of 40 on hand, 0 reserved, par 20."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 40, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { avail_id: $.data.id, state0: $.data.availability_state }
          trigger:
            - call: "POST /kiosk-ops/item-availabilities/${avail_id}/actions"
              payload: { action: "SYNC_ON_HAND", on_hand_units: 0, reserved_units: 0 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { supply1: $.data.supply_state, listing1: $.data.listing_state, e86_1: $.data.eighty_six_state, reason1: $.data.eighty_six_reason, until1: $.data.eighty_six_until_utc, sync1: $.data.last_sync_utc }
            - call: "POST /kiosk-ops/item-availabilities/${avail_id}/actions"
              payload: { action: "RESTORE" }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { listing2: $.data.listing_state, e86_2: $.data.eighty_six_state, avail2: $.data.availability_state, until2: $.data.eighty_six_until_utc }
          assert:
            - "${state0} == AVAILABLE before the sync"
            - "${supply1} == DEPLETED, ${listing1} == EIGHTY_SIXED, ${e86_1} == AUTO_86, ${reason1} == INVENTORY_DEPLETED, ${until1} == 2026-08-05T19:00:00Z (clock + AUTO_86_HOLD_MINUTES 120) and ${sync1} == 2026-08-05T17:00:00Z"
            - "${listing2} == LISTED, ${e86_2} == NONE and ${until2} is null after RESTORE"
            - "${avail2} == UNAVAILABLE all the same, because supply_state is still DEPLETED — relisting does not invent stock"
            - "MenuItem.${item_a_id}.chainwide_availability_state == UNAVAILABLE throughout, since this is the item's only row"

