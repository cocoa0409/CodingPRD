            - call: "POST /audit-programs/${progb_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "B-MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
