# =============================================================================
# Task 0488 — Computer-Aided Dispatch (CAD / NG911) — Expert tier
# =============================================================================

scenario: |
  911 / Computer-Aided Dispatch (CAD, NG911): call intake & ANI/ALI location,
  incident type & priority, unit recommendation & status
  (dispatched/enroute/onscene/clear), nearest-unit & response time, multi-agency
  (police/fire/EMS), premise/hazard alert, disposition & call-for-service report,
  NENA/NFIRS reporting

domain_name: cad-911-dispatch
api_prefix: ""   # flat topology: many peer top-level collections (/agencies, /units, /incidents, ...); no single nesting prefix

# Selector / response-time / report calculations depend on a deterministic logical
# clock. The clock starts at 2026-01-01T00:00:00Z and is advanced only by the
# /_clock/set_current_utc test-driving endpoint (declared in §1.5). Every
# response-time, stale-recommendation, and report-window computation reads this
# clock — never wall-clock time — so the benchmark is run-time-independent.

# =============================================================================
# Table 0: Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: "Selector policy"          # nearest-available-unit recommendation
  secondary_archetype: "Workflow orchestration"  # multi-agency, multi-stage incident lifecycle
  complexity_layers:
    - "Optimistic concurrency"        # OCC on Incident.version for unit-dispatch races
    - "Cascading side effects"        # incident close cascades to assignments, units, reports
    - "Dual-variant calculation"      # response_time_seconds: dispatch-based vs call-receipt-based
    - "Rate / threshold triggers"     # priority escalation timer, response-time SLA breach

  entity_topology: graph
  # Incident, Unit, Agency, Station are peer entities joined through Assignment
  # (junction, many-to-many incident↔unit) and FK references; PremiseAlert/
  # HazardAlert are location-keyed satellites; reports are append-only children.

  state_machine_shape: parallel
  # Incident carries TWO independent state dimensions: lifecycle_status
  # (PENDING→DISPATCHED→ACTIVE→CLOSED…) and priority_level (P1..P5, can escalate
  # cyclically). Assignment runs a separate dispatched→enroute→onscene→clear
  # pipeline with a revert branch. Unit carries an availability dimension.

  relationship_patterns:
    - many_to_many        # Incident <-> Unit via Assignment
    - one_to_many         # Agency -> Unit, Station -> Unit, Incident -> Assignment
    - cross_aggregate     # Assignment preconditions read Unit + Incident + Agency
    - polymorphic         # Alert.scope_ref keys either a location address or a unit beat

  role_model: peer_roles
  # Calltaker (intake), Dispatcher (unit assignment), FieldUnit (status updates from
  # the field), Supervisor (override/escalate/reopen), Records (report generation).
  # SystemClock is a test-driving operator role.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Agency display name" }
      - { name: discipline, type: enum, source: input, description: "Service discipline", constraints: "one of {POLICE, FIRE, EMS}" }
      - { name: response_sla_seconds, type: integer, source: input, description: "Target on-scene SLA in seconds for this discipline", constraints: "integer >= 1" }
      - { name: status, type: enum, source: system, description: "Agency operational status", default: "ONLINE", constraints: "one of {ONLINE, MUTUAL_AID_ONLY, OFFLINE}" }

  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning agency" }
      - { name: name, type: string, source: input, description: "Station / house name" }
      - { name: grid_x, type: integer, source: input, description: "Integer grid X coordinate of the station", constraints: "0 <= grid_x <= 1000" }
      - { name: grid_y, type: integer, source: input, description: "Integer grid Y coordinate of the station", constraints: "0 <= grid_y <= 1000" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; discipline is inherited from this agency" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; home station, must belong to agency_id" }
      - { name: call_sign, type: string, source: input, description: "Radio call-sign, unique within an agency" }
      - { name: capability, type: enum, source: input, description: "Unit capability tier", constraints: "one of {PATROL, K9, SUPERVISOR_UNIT, ENGINE, LADDER, MEDIC_ALS, MEDIC_BLS}" }
      - { name: status, type: enum, source: system, description: "Field availability + assignment status", default: "AVAILABLE", constraints: "one of {AVAILABLE, DISPATCHED, ENROUTE, ONSCENE, CLEARING, OUT_OF_SERVICE}" }
      - { name: grid_x, type: integer, source: input, description: "Current integer grid X; defaults to station grid_x at creation", constraints: "0 <= grid_x <= 1000" }
      - { name: grid_y, type: integer, source: input, description: "Current integer grid Y; defaults to station grid_y at creation", constraints: "0 <= grid_y <= 1000" }
      - { name: active_incident_id, type: string, source: system, description: "FK -> Incident.id; incident this unit is committed to, null when AVAILABLE/OUT_OF_SERVICE", default: null }

  - name: PremiseAlert
    parent: null
    common_fields: true
    fields:
      - { name: grid_x, type: integer, source: input, description: "Grid X this standing alert is keyed to", constraints: "0 <= grid_x <= 1000" }
      - { name: grid_y, type: integer, source: input, description: "Grid Y this standing alert is keyed to", constraints: "0 <= grid_y <= 1000" }
      - { name: hazard_class, type: enum, source: input, description: "Hazard classification", constraints: "one of {WEAPONS, HAZMAT, COMBATIVE_SUBJECT, STRUCTURAL, MEDICAL_HISTORY, NONE}" }
      - { name: min_priority_floor, type: integer, source: input, description: "Floor that any incident at this grid is clamped to (lower number = higher urgency)", constraints: "1 <= min_priority_floor <= 5" }
      - { name: active, type: boolean, source: system, description: "Whether the alert is in force", default: true }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: incident_number, type: string, source: system, description: "Human CFS number, format CFS-YYYY-NNNNNN, monotonically minted at intake" }
      - { name: ani, type: string, source: input, description: "Automatic Number Identification (caller phone), 10 digits" }
      - { name: ali_grid_x, type: integer, source: input, description: "Automatic Location Identification grid X of the incident", constraints: "0 <= ali_grid_x <= 1000" }
      - { name: ali_grid_y, type: integer, source: input, description: "Automatic Location Identification grid Y of the incident", constraints: "0 <= ali_grid_y <= 1000" }
      - { name: ali_confidence, type: enum, source: input, description: "ALI fix confidence", default: "HIGH", constraints: "one of {HIGH, LOW, UNKNOWN}" }
      - { name: incident_type, type: enum, source: input, description: "Nature code; determines required disciplines and base priority", constraints: "one of {STRUCTURE_FIRE, MEDICAL_EMERGENCY, TRAFFIC_COLLISION, ASSAULT_IN_PROGRESS, ALARM, WELFARE_CHECK}" }
      - { name: priority_level, type: integer, source: system, description: "Effective priority 1 (highest) .. 5 (lowest); base from type, clamped by premise floor, may escalate", constraints: "1 <= priority_level <= 5" }
      - { name: base_priority_level, type: integer, source: system, description: "Priority from incident_type before premise clamp and escalation", constraints: "1 <= base_priority_level <= 5" }
      - { name: required_disciplines, type: array, source: system, description: "Set of agency disciplines required by incident_type, e.g. [FIRE, EMS]" }
      - { name: lifecycle_status, type: enum, source: system, description: "Incident lifecycle dimension", default: "PENDING", constraints: "one of {PENDING, DISPATCHED, ACTIVE, HELD, CLOSED, CANCELLED}" }
      - { name: premise_alert_id, type: string, source: system, description: "FK -> PremiseAlert.id; alert matched at intake on ALI grid, null if none", default: null }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock instant the incident was created at intake" }
      - { name: first_dispatch_at, type: datetime, source: system, description: "Logical-clock instant of the first DISPATCHED assignment, null until then", default: null }
      - { name: first_onscene_at, type: datetime, source: system, description: "Logical-clock instant the first unit went ONSCENE, null until then", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock instant of CLOSE/CANCEL, null until then", default: null }
      - { name: escalation_count, type: integer, source: system, description: "Number of times priority has escalated by timer", default: 0 }
      - { name: disposition_code, type: enum, source: system, description: "Final disposition; set at close", default: null, constraints: "one of {REPORT_TAKEN, ARREST, TRANSPORT, FIRE_OUT, UNFOUNDED, GONE_ON_ARRIVAL, CANCELLED, null}" }
      - { name: response_time_seconds, type: integer, source: computed, description: "Computed dispatch-based response time (first_onscene_at - first_dispatch_at)", default: null }
      - { name: total_handle_seconds, type: integer, source: computed, description: "Computed call-receipt-based handle time (first_onscene_at - received_at)", default: null }
      - { name: sla_breached, type: boolean, source: computed, description: "Whether total_handle_seconds exceeded the governing agency SLA", default: false }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; the incident this unit is assigned to" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the assigned unit" }
      - { name: recommended, type: boolean, source: system, description: "True if this unit was the server's nearest-unit recommendation at dispatch", default: false }
      - { name: travel_distance, type: integer, source: system, description: "Manhattan grid distance from unit position to incident ALI at dispatch" }
      - { name: status, type: enum, source: system, description: "Assignment lifecycle dimension", default: "DISPATCHED", constraints: "one of {DISPATCHED, ENROUTE, ONSCENE, CLEARED, CANCELLED}" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical-clock instant of dispatch" }
      - { name: enroute_at, type: datetime, source: system, description: "Logical-clock instant unit marked enroute, null until then", default: null }
      - { name: onscene_at, type: datetime, source: system, description: "Logical-clock instant unit marked onscene, null until then", default: null }
      - { name: cleared_at, type: datetime, source: system, description: "Logical-clock instant unit cleared, null until then", default: null }

  - name: Disposition
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; the incident being closed" }
      - { name: disposition_code, type: enum, source: input, description: "Outcome code recorded at close", constraints: "one of {REPORT_TAKEN, ARREST, TRANSPORT, FIRE_OUT, UNFOUNDED, GONE_ON_ARRIVAL, CANCELLED}" }
      - { name: narrative, type: string, source: input, description: "Free-text closing narrative" }
      - { name: requires_nfirs, type: boolean, source: system, description: "True when the incident required FIRE discipline (a NFIRS report is mandatory)", default: false }

  - name: CfsReport
    parent: null
    common_fields: false   # immutable append-only record: id, created_at only
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; incident this report covers" }
      - { name: report_standard, type: enum, source: input, description: "Reporting standard", constraints: "one of {NENA, NFIRS}" }
      - { name: response_time_seconds, type: integer, source: system, description: "Snapshot of Incident.response_time_seconds at generation time" }
      - { name: total_handle_seconds, type: integer, source: system, description: "Snapshot of Incident.total_handle_seconds at generation time" }
      - { name: sla_breached, type: boolean, source: system, description: "Snapshot of Incident.sla_breached at generation time" }
      - { name: unit_count, type: integer, source: system, description: "Number of CLEARED/ONSCENE assignments rolled into the report" }
      - { name: disposition_code, type: enum, source: system, description: "Snapshot of the incident disposition_code" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Incident — PARALLEL dimensions: lifecycle_status (workflow) and priority_level
  # (cyclic escalation). The two evolve independently on the same row.
  # ---------------------------------------------------------------------------
  - entity: Incident
    dimension: lifecycle_status
    initial_state: PENDING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /incidents/{id}/assignments (first accepted assignment)"
        actor: Dispatcher
        preconditions:
          - "Incident.lifecycle_status == PENDING"
          - "The assigned Unit's agency.discipline is in Incident.required_disciplines"
        side_effects:
          - "Incident.first_dispatch_at set to current clock"
          - "Assignment created in DISPATCHED; Unit.status -> DISPATCHED; Unit.active_incident_id = Incident.id"
          - "increments Incident.version by 1"

      - from: DISPATCHED
        to: ACTIVE
        trigger: "PATCH /assignments/{id}/status (first ONSCENE arrival)"
        actor: FieldUnit
        preconditions:
          - "Incident.lifecycle_status == DISPATCHED"
        side_effects:
          - "Incident.first_onscene_at set to current clock"
          - "Incident.response_time_seconds recomputed (response_time calc)"
          - "Incident.total_handle_seconds and sla_breached recomputed (handle_time + sla_breach calcs)"

      - from: ACTIVE
        to: HELD
        trigger: "POST /incidents/{id}/hold"
        actor: Supervisor
        preconditions:
          - "Incident.lifecycle_status == ACTIVE"
          - "At least one Assignment in {ONSCENE}"
        side_effects:
          - "Incident frozen; no new assignments may be added while HELD"

      - from: HELD
        to: ACTIVE
        trigger: "POST /incidents/{id}/resume"
        actor: Supervisor
        preconditions:
          - "Incident.lifecycle_status == HELD"
        side_effects:
          - "Incident unfrozen"

      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /incidents/{id}/dispositions"
        actor: Supervisor
        preconditions:
          - "Incident.lifecycle_status in {DISPATCHED, ACTIVE}"
          - "Every Assignment for this incident is in {CLEARED, CANCELLED}"
        side_effects:
          - "Incident.closed_at set; disposition_code set from Disposition"
          - "CASCADE: each non-terminal Assignment forced to CLEARED, its Unit.status -> AVAILABLE, Unit.active_incident_id cleared"
          - "increments Incident.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /incidents/{id}/dispositions"
        actor: Supervisor
        preconditions:
          - "Incident.lifecycle_status in {DISPATCHED, ACTIVE}"
          - "Every Assignment for this incident is in {CLEARED, CANCELLED}"
        side_effects:
          - "Incident.closed_at set; disposition_code set from Disposition"
          - "CASCADE: each non-terminal Assignment forced to CLEARED, its Unit.status -> AVAILABLE, Unit.active_incident_id cleared"
          - "increments Incident.version by 1"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /incidents/{id}/cancel"
        actor: "Calltaker or Supervisor"
        preconditions:
          - "Incident.lifecycle_status == PENDING"
          - "No Assignment exists for this incident"
        side_effects:
          - "Incident.closed_at set; disposition_code = CANCELLED"

      - from: HELD
        to: CLOSED
        trigger: "POST /incidents/{id}/dispositions"
        actor: Supervisor
        preconditions:
          - "Incident.lifecycle_status == HELD"
          - "Every Assignment for this incident is in {CLEARED, CANCELLED}"
        side_effects:
          - "Incident.closed_at set; disposition_code set from Disposition"
          - "increments Incident.version by 1"

  - entity: Incident
    dimension: priority_level
    initial_state: "BASE (priority_level = base_priority_level clamped by premise floor)"
    terminal_states: []
    note: "Cyclic escalation dimension — priority can ratchet up (toward 1) repeatedly while the incident is not terminal; resets only on CLOSE/CANCEL."
    transitions:
      - from: "priority_level = N"
        to: "priority_level = N-1"
        trigger: "POST /incidents/{id}/escalate (timer fired: no first_dispatch_at after SLA grace) OR Supervisor manual escalate"
        actor: "Supervisor or system"
        preconditions:
          - "Incident.lifecycle_status not in {CLOSED, CANCELLED}"
          - "Incident.priority_level > 1"
        side_effects:
          - "priority_level decremented by 1 (toward higher urgency)"
          - "Incident.escalation_count incremented by 1"
          - "increments Incident.version by 1"

  # ---------------------------------------------------------------------------
  # Assignment — dispatched -> enroute -> onscene -> cleared, with a CANCELLED
  # revert branch (non-linear: ONSCENE can revert to ENROUTE; any pre-clear state
  # can CANCEL).
  # ---------------------------------------------------------------------------
  - entity: Assignment
    dimension: status
    initial_state: DISPATCHED
    terminal_states: [CLEARED, CANCELLED]
    transitions:
      - from: DISPATCHED
        to: ENROUTE
        trigger: "PATCH /assignments/{id}/status (ENROUTE)"
        actor: FieldUnit
        preconditions:
          - "Assignment.status == DISPATCHED"
          - "Unit.id == Assignment.unit_id (acting unit owns the assignment)"
        side_effects:
          - "Assignment.enroute_at set; Unit.status -> ENROUTE"

      - from: ENROUTE
        to: ONSCENE
        trigger: "PATCH /assignments/{id}/status (ONSCENE)"
        actor: FieldUnit
        preconditions:
          - "Assignment.status == ENROUTE"
        side_effects:
          - "Assignment.onscene_at set; Unit.status -> ONSCENE; Unit.grid_x/grid_y set to incident ALI grid"
          - "BUBBLE-UP: if this is the incident's first ONSCENE, Incident.lifecycle_status DISPATCHED -> ACTIVE and response/handle/sla recomputed"

      - from: ONSCENE
        to: ENROUTE
        trigger: "PATCH /assignments/{id}/status (ENROUTE — re-stage / pulled off scene)"
        actor: FieldUnit
        preconditions:
          - "Assignment.status == ONSCENE"
          - "Incident.lifecycle_status != HELD"
        side_effects:
          - "Assignment.onscene_at cleared; Unit.status -> ENROUTE"
        note: "Cyclic revert — does NOT undo Incident.first_onscene_at (incident stays ACTIVE)."

      - from: ONSCENE
        to: CLEARED
        trigger: "PATCH /assignments/{id}/status (CLEAR)"
        actor: "FieldUnit or Dispatcher"
        preconditions:
          - "Assignment.status == ONSCENE"
        side_effects:
          - "Assignment.cleared_at set; Unit.status -> CLEARING then AVAILABLE; Unit.active_incident_id cleared"

      - from: ENROUTE
        to: CLEARED
        trigger: "PATCH /assignments/{id}/status (CLEAR)"
        actor: "FieldUnit or Dispatcher"
        preconditions:
          - "Assignment.status == ENROUTE"
        side_effects:
          - "Assignment.cleared_at set; Unit.status -> AVAILABLE; Unit.active_incident_id cleared"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "PATCH /assignments/{id}/status (CANCEL)"
        actor: "Dispatcher or Supervisor"
        preconditions:
          - "Assignment.status == DISPATCHED"
        side_effects:
          - "Unit.status -> AVAILABLE; Unit.active_incident_id cleared"
          - "CASCADE: if this was the only non-terminal assignment AND it carried the incident's first_dispatch and no ONSCENE ever occurred, Incident.lifecycle_status DISPATCHED -> PENDING and first_dispatch_at cleared"

      - from: ENROUTE
        to: CANCELLED
        trigger: "PATCH /assignments/{id}/status (CANCEL)"
        actor: "Dispatcher or Supervisor"
        preconditions:
          - "Assignment.status == ENROUTE"
        side_effects:
          - "Unit.status -> AVAILABLE; Unit.active_incident_id cleared"

  # ---------------------------------------------------------------------------
  # Unit availability — driven by assignment lifecycle + manual OOS toggle.
  # ---------------------------------------------------------------------------
  - entity: Unit
    dimension: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "PATCH /units/{id}/status (OUT_OF_SERVICE)"
        actor: "FieldUnit or Supervisor"
        preconditions:
          - "Unit.status == AVAILABLE"
        side_effects:
          - "Unit excluded from nearest-unit recommendation candidate pool"

      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "PATCH /units/{id}/status (AVAILABLE)"
        actor: "FieldUnit or Supervisor"
        preconditions:
          - "Unit.status == OUT_OF_SERVICE"
        side_effects: []

  # ---------------------------------------------------------------------------
  # Agency operational status.
  # ---------------------------------------------------------------------------
  - entity: Agency
    dimension: status
    initial_state: ONLINE
    terminal_states: []
    transitions:
      - from: ONLINE
        to: MUTUAL_AID_ONLY
        trigger: "PATCH /agencies/{id}/status (MUTUAL_AID_ONLY)"
        actor: Supervisor
        preconditions:
          - "Agency.status == ONLINE"
        side_effects:
          - "Agency units excluded from in-jurisdiction recommendation but eligible for mutual-aid fallback"

      - from: MUTUAL_AID_ONLY
        to: OFFLINE
        trigger: "PATCH /agencies/{id}/status (OFFLINE)"
        actor: Supervisor
        preconditions:
          - "Agency.status == MUTUAL_AID_ONLY"
        side_effects:
          - "Agency units excluded from all recommendation pools"

      - from: MUTUAL_AID_ONLY
        to: ONLINE
        trigger: "PATCH /agencies/{id}/status (ONLINE)"
        actor: Supervisor
        preconditions:
          - "Agency.status == MUTUAL_AID_ONLY"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-incident
    parent_entity: Incident
    write_endpoint: "POST /incidents/{id}/assignments"
    occ_field: "expected_incident_version"
    description: |
      Creating an Assignment against an Incident whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another dispatcher has just dispatched the recommended nearest unit
      (which bumps Incident.version and may flip lifecycle_status PENDING ->
      DISPATCHED), so the current dispatcher's view of the incident — and of
      which unit is still the nearest available recommendation — is stale.
    error_id: ERR_STALE_INCIDENT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: nearest_unit_recommendation
    trigger: "GET /incidents/{id}/recommendation, and to set Assignment.recommended at POST /incidents/{id}/assignments"
    algorithm: selector_policy
    formula: |
      Candidate pool = Units U where ALL hold:
        - U.status == AVAILABLE
        - U.agency.status == ONLINE         (mutual-aid agencies excluded from primary pass)
        - U.agency.discipline == requested_discipline (a discipline in Incident.required_disciplines
          that is not yet covered by a non-cancelled Assignment on this incident)
        - U.id is NOT already assigned to this incident via a non-CANCELLED Assignment
      Ranking (lexicographic, ascending — lower wins):
        1. travel_distance = |U.grid_x - Incident.ali_grid_x| + |U.grid_y - Incident.ali_grid_y|   (Manhattan)
        2. capability_rank for the discipline (incident-type preferred capability ranks 0, others rank 1)
        3. tie-break: Unit.created_at ASC      (NEVER Unit.id)
      Empty-pool fallback (waterfall):
        - If primary pass empty, repeat with U.agency.status IN {ONLINE, MUTUAL_AID_ONLY} (mutual-aid pass).
        - If still empty -> no recommendation; GET returns 200 with data.recommended_unit_id = null;
          POST with auto-select returns ERR_NO_UNIT_AVAILABLE (409).
    input_set: "All Units; filtered by status, agency status, discipline, and existing-assignment exclusion as above"
    constants:
      CAPABILITY_PREFERENCE:
        STRUCTURE_FIRE: [ENGINE, LADDER]
        MEDICAL_EMERGENCY: [MEDIC_ALS, MEDIC_BLS]
        TRAFFIC_COLLISION: [PATROL, MEDIC_BLS]
        ASSAULT_IN_PROGRESS: [PATROL, K9]
        ALARM: [PATROL, ENGINE]
        WELFARE_CHECK: [PATROL]
    precision: "Integer Manhattan distance; no rounding"

  - name: effective_priority_at_intake
    trigger: "POST /incidents (intake)"
    algorithm: constraint_propagation
    formula: |
      Step 1  base_priority_level = BASE_PRIORITY[incident_type]
      Step 2  matched = PremiseAlert P with P.active == true AND P.grid_x == ali_grid_x
              AND P.grid_y == ali_grid_y; if multiple, pick lowest P.min_priority_floor,
              tie-break created_at ASC.
      Step 3  if matched: premise_alert_id = P.id;
              priority_level = min(base_priority_level, P.min_priority_floor)   (clamp UP in urgency)
              else: premise_alert_id = null; priority_level = base_priority_level
      Step 4  if ali_confidence == UNKNOWN: priority_level = min(priority_level, 2)  (degrade-safe clamp)
      Evaluation order is fixed Step1->Step4; the confidence clamp is applied AFTER the premise clamp.
    input_set: "incident_type, ali grid, ali_confidence, active PremiseAlerts at that grid"
    constants:
      BASE_PRIORITY:
        STRUCTURE_FIRE: 1
        ASSAULT_IN_PROGRESS: 1
        MEDICAL_EMERGENCY: 2
        TRAFFIC_COLLISION: 3
        ALARM: 4
        WELFARE_CHECK: 5
      REQUIRED_DISCIPLINES:
        STRUCTURE_FIRE: [FIRE, EMS]
        MEDICAL_EMERGENCY: [EMS]
        TRAFFIC_COLLISION: [POLICE, EMS]
        ASSAULT_IN_PROGRESS: [POLICE]
        ALARM: [POLICE]
        WELFARE_CHECK: [POLICE]
    precision: "Integer priority levels 1..5"

  - name: response_time_dispatch_based
    trigger: "first ONSCENE arrival (Assignment ENROUTE->ONSCENE that flips Incident to ACTIVE), and snapshot at report generation"
    algorithm: chronological
    formula: |
      response_time_seconds = floor((first_onscene_at - first_dispatch_at) in seconds)
      Uses the DISPATCH instant as the clock start (excludes intake-to-dispatch queue time).
      Only defined once both first_dispatch_at and first_onscene_at are set; null otherwise.
    input_set: "Incident.first_dispatch_at, Incident.first_onscene_at"
    precision: "Integer seconds, floor"
    variants:
      - name: dispatch_based
        when: "Standard NENA response-time metric"
        difference: "clock starts at first_dispatch_at"

  - name: handle_time_call_receipt_based
    trigger: "first ONSCENE arrival, and snapshot at report generation"
    algorithm: chronological
    formula: |
      total_handle_seconds = floor((first_onscene_at - received_at) in seconds)
      Uses the CALL-RECEIPT instant as the clock start (INCLUDES intake-to-dispatch queue time).
      This is the SAME pair of subject timestamps' sibling metric but on a DIFFERENT start
      anchor than response_time_dispatch_based, so identical incidents yield different numbers
      whenever queue time > 0.
    input_set: "Incident.received_at, Incident.first_onscene_at"
    precision: "Integer seconds, floor"
    variants:
      - name: call_receipt_based
        when: "Total handle-time metric (NENA call-to-onscene)"
        difference: "clock starts at received_at instead of first_dispatch_at; diverges by the intake-to-dispatch queue delay"

  - name: sla_breach_evaluation
    trigger: "first ONSCENE arrival, and snapshot at report generation"
    algorithm: threshold
    formula: |
      governing_sla = max over Agency A of A.response_sla_seconds
        for each A whose discipline is in Incident.required_disciplines AND which has at least one
        non-CANCELLED Assignment on this incident. If no such agency, use the minimum response_sla_seconds
        across agencies of the required disciplines (strictest applicable target).
      sla_breached = total_handle_seconds > governing_sla        (STRICT '>' — equal handle time is NOT a breach)
    input_set: "Incident.total_handle_seconds, governing agencies' response_sla_seconds"
    constants: {}
    precision: "Boolean; strict greater-than comparison at the boundary"

  - name: incident_unit_count
    trigger: "report generation (POST /incidents/{id}/reports)"
    algorithm: aggregation
    formula: |
      unit_count = count of Assignment A on this incident where A.status IN {ONSCENE, CLEARED}
      (DISPATCHED, ENROUTE, and CANCELLED assignments are excluded — only units that actually
      reached the scene are rolled into the CFS report).
    input_set: "Assignments on the incident, filtered to ONSCENE or CLEARED status"
    precision: "Integer count"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All resource IDs in the path exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "All foreign-key IDs in the request body reference existing resources"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /incidents/{id}/assignments, POST /stations, POST /units, POST /incidents/{id}/dispositions, POST /incidents/{id}/reports"

  - priority: 5
    category: validation
    check: "Request body is well-formed: required fields present, enums valid, integers in range, ANI is 10 digits, grid within 0..1000"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: state
    check: "OCC: expected_incident_version matches current Incident.version on assignment create"
    error_id: ERR_STALE_INCIDENT_VERSION
    http_status: 412
    applies_to: "POST /incidents/{id}/assignments"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "Incident is HELD: no new assignments, no recommendation-driven dispatch while frozen"
    error_id: ERR_INCIDENT_HELD
    http_status: 409
    applies_to: "POST /incidents/{id}/assignments"

  - priority: 9
    category: business_safety
    check: "Assigned unit's agency.discipline must be one of Incident.required_disciplines"
    error_id: ERR_DISCIPLINE_MISMATCH
    http_status: 409
    applies_to: "POST /incidents/{id}/assignments"

  - priority: 10
    category: business_safety
    check: "Assigned unit's agency.status must be ONLINE for in-jurisdiction dispatch, or MUTUAL_AID_ONLY only when no ONLINE unit of that discipline exists"
    error_id: ERR_AGENCY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /incidents/{id}/assignments"

  - priority: 11
    category: business_constraint
    check: "Unit must be AVAILABLE to be dispatched (not already DISPATCHED/ENROUTE/ONSCENE/CLEARING/OUT_OF_SERVICE)"
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /incidents/{id}/assignments"

  - priority: 12
    category: business_constraint
    check: "Unit may not be assigned to the same incident twice via a non-CANCELLED assignment"
    error_id: ERR_DUPLICATE_ASSIGNMENT
    http_status: 409
    applies_to: "POST /incidents/{id}/assignments"

  - priority: 13
    category: business_constraint
    check: "Auto-select dispatch found no eligible unit in either the primary or mutual-aid pass"
    error_id: ERR_NO_UNIT_AVAILABLE
    http_status: 409
    applies_to: "POST /incidents/{id}/assignments (auto_select=true)"

  - priority: 14
    category: business_referential
    check: "Closing disposition: every Assignment on the incident must be CLEARED or CANCELLED"
    error_id: ERR_OPEN_ASSIGNMENTS
    http_status: 409
    applies_to: "POST /incidents/{id}/dispositions"

  - priority: 15
    category: business_referential
    check: "NFIRS report may only be generated for an incident that required FIRE discipline; report standard must match incident disciplines"
    error_id: ERR_REPORT_STANDARD_MISMATCH
    http_status: 409
    applies_to: "POST /incidents/{id}/reports"

  - priority: 16
    category: business_constraint
    check: "Reports may only be generated for a CLOSED incident"
    error_id: ERR_INCIDENT_NOT_CLOSED
    http_status: 409
    applies_to: "POST /incidents/{id}/reports"

  - priority: 17
    category: business_constraint
    check: "call_sign must be unique within the unit's agency"
    error_id: ERR_DUPLICATE_CALL_SIGN
    http_status: 409
    applies_to: "POST /units"

  - priority: 18
    category: business_constraint
    check: "Station referenced by a unit must belong to the same agency_id"
    error_id: ERR_STATION_AGENCY_MISMATCH
    http_status: 409
    applies_to: "POST /units"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Agency ---
  - method: POST
    path: "/agencies"
    description: "Create an agency (police/fire/EMS jurisdiction)"
    roles: [Supervisor]
    code: 201
    input: [name, discipline, response_sla_seconds]
    output: Agency
    side_effects: ["status initialized to ONLINE"]

  - method: GET
    path: "/agencies/{id}"
    description: "Get one agency"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: GET
    path: "/agencies"
    description: "List agencies"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: ["discipline?", "status?", "limit?", "offset?"]
    output: Agency[]
    side_effects: []

  - method: PATCH
    path: "/agencies/{id}/status"
    description: "Change agency operational status (ONLINE/MUTUAL_AID_ONLY/OFFLINE)"
    roles: [Supervisor]
    code: 200
    input: [status]
    output: Agency
    side_effects: ["affects nearest-unit candidate pools"]

  # --- Station ---
  - method: POST
    path: "/stations"
    description: "Create a station under an agency"
    roles: [Supervisor]
    code: 201
    input: [agency_id, name, grid_x, grid_y]
    output: Station
    side_effects: []

  - method: GET
    path: "/stations/{id}"
    description: "Get one station"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: GET
    path: "/stations"
    description: "List stations, optionally filtered by agency"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: ["agency_id?", "limit?", "offset?"]
    output: Station[]
    side_effects: []

  # --- Unit ---
  - method: POST
    path: "/units"
    description: "Create a field unit attached to an agency and home station"
    roles: [Supervisor]
    code: 201
    input: [agency_id, station_id, call_sign, capability, "grid_x?", "grid_y?"]
    output: Unit
    side_effects: ["status initialized AVAILABLE; grid defaults to station grid; active_incident_id null"]

  - method: GET
    path: "/units/{id}"
    description: "Get one unit"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/units"
    description: "List units, filterable by agency, station, status"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: ["agency_id?", "station_id?", "status?", "active_incident_id?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  - method: PATCH
    path: "/units/{id}/status"
    description: "Field unit toggles AVAILABLE/OUT_OF_SERVICE (not for assignment-driven transitions)"
    roles: [FieldUnit, Supervisor]
    code: 200
    input: [status]
    output: Unit
    side_effects: ["AVAILABLE<->OUT_OF_SERVICE; affects recommendation pool"]

  # --- PremiseAlert ---
  - method: POST
    path: "/premise-alerts"
    description: "Create a standing premise/hazard alert keyed to a grid location"
    roles: [Supervisor, Records]
    code: 201
    input: [grid_x, grid_y, hazard_class, min_priority_floor]
    output: PremiseAlert
    side_effects: ["active initialized true; future intakes at this grid clamp priority and link the alert"]

  - method: GET
    path: "/premise-alerts/{id}"
    description: "Get one premise alert"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: []
    output: PremiseAlert
    side_effects: []

  - method: GET
    path: "/premise-alerts"
    description: "List premise alerts, filterable by grid"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: ["grid_x?", "grid_y?", "active?", "limit?", "offset?"]
    output: PremiseAlert[]
    side_effects: []

  - method: PATCH
    path: "/premise-alerts/{id}"
    description: "Deactivate (or reactivate) a premise alert"
    roles: [Supervisor, Records]
    code: 200
    input: [active]
    output: PremiseAlert
    side_effects: ["toggling active does NOT retroactively re-clamp existing incidents"]

  # --- Incident (intake + lifecycle) ---
  - method: POST
    path: "/incidents"
    description: "Call intake: create incident from ANI/ALI, type; mints CFS number, computes priority + required disciplines"
    roles: [Calltaker, Supervisor]
    code: 201
    input: [ani, ali_grid_x, ali_grid_y, incident_type, "ali_confidence?"]
    output: Incident
    side_effects:
      - "incident_number minted; received_at = current clock; lifecycle_status = PENDING"
      - "effective_priority_at_intake calc sets base_priority_level, priority_level, premise_alert_id, required_disciplines"

  - method: GET
    path: "/incidents/{id}"
    description: "Get one incident (full computed state)"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/incidents"
    description: "List incidents, filterable by lifecycle_status and priority"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: ["lifecycle_status?", "priority_level?", "premise_alert_id?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: GET
    path: "/incidents/{id}/recommendation"
    description: "Nearest-unit recommendation for the next uncovered required discipline"
    roles: [Dispatcher, Supervisor]
    code: 200
    input: ["discipline?"]
    output: "{ recommended_unit_id: string, discipline: string, travel_distance: integer, candidate_count: integer }"
    side_effects: []

  - method: POST
    path: "/incidents/{id}/assignments"
    description: "Dispatch a unit to the incident (explicit unit_id, or auto_select=true to take the recommendation)"
    roles: [Dispatcher, Supervisor]
    code: 201
    input: [expected_incident_version, "unit_id?", "auto_select?", "discipline?"]
    output: Assignment
    side_effects:
      - "Assignment created DISPATCHED; recommended set; travel_distance computed; Unit -> DISPATCHED; Unit.active_incident_id set"
      - "If first assignment: Incident PENDING -> DISPATCHED; first_dispatch_at set"
      - "increments Incident.version by 1"

  - method: GET
    path: "/incidents/{id}/assignments"
    description: "List assignments for an incident (reverse lookup Incident -> Assignment)"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: POST
    path: "/incidents/{id}/escalate"
    description: "Escalate incident priority by one level (manual supervisor, or timer-driven via system actor)"
    roles: [Supervisor]
    code: 200
    input: ["reason?"]
    output: Incident
    side_effects:
      - "priority_level decremented toward 1; escalation_count incremented"
      - "increments Incident.version by 1"

  - method: POST
    path: "/incidents/{id}/hold"
    description: "Freeze an ACTIVE incident (supervisor hold)"
    roles: [Supervisor]
    code: 200
    input: ["reason?"]
    output: Incident
    side_effects: ["lifecycle_status ACTIVE -> HELD"]

  - method: POST
    path: "/incidents/{id}/resume"
    description: "Resume a HELD incident"
    roles: [Supervisor]
    code: 200
    input: []
    output: Incident
    side_effects: ["lifecycle_status HELD -> ACTIVE"]

  - method: POST
    path: "/incidents/{id}/cancel"
    description: "Cancel a PENDING incident that was never dispatched"
    roles: [Calltaker, Supervisor]
    code: 200
    input: ["reason?"]
    output: Incident
    side_effects: ["lifecycle_status PENDING -> CANCELLED; disposition_code = CANCELLED; closed_at set"]

  # --- Assignment status (field unit lifecycle) ---
  - method: GET
    path: "/assignments/{id}"
    description: "Get one assignment"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments, filterable by incident, unit, status (reverse lookup for Unit -> Assignment and Incident -> Assignment)"
    roles: [Calltaker, Dispatcher, FieldUnit, Supervisor, Records]
    code: 200
    input: ["incident_id?", "unit_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: PATCH
    path: "/assignments/{id}/status"
    description: "Field unit advances assignment status: ENROUTE/ONSCENE/CLEAR/CANCEL (also re-stage ONSCENE->ENROUTE)"
    roles: [FieldUnit, Dispatcher, Supervisor]
    code: 200
    input: [status]
    output: Assignment
    side_effects:
      - "Unit.status follows assignment; ONSCENE may bubble Incident DISPATCHED->ACTIVE and recompute response/handle/sla"
      - "CLEAR releases the unit; CANCEL may revert Incident DISPATCHED->PENDING if it was the only assignment pre-onscene"

  # --- Disposition / close ---
  - method: POST
    path: "/incidents/{id}/dispositions"
    description: "Close an incident with a disposition code (cascades to clear remaining assignments)"
    roles: [Supervisor]
    code: 201
    input: [disposition_code, narrative]
    output: Disposition
    side_effects:
      - "Incident -> CLOSED; closed_at set; disposition_code set"
      - "requires_nfirs computed from required_disciplines"
      - "CASCADE: non-terminal assignments forced CLEARED, units freed to AVAILABLE"
      - "increments Incident.version by 1"

  - method: GET
    path: "/incidents/{id}/dispositions"
    description: "List dispositions for an incident (reverse lookup Incident -> Disposition)"
    roles: [Calltaker, Dispatcher, Supervisor, Records]
    code: 200
    input: ["limit?", "offset?"]
    output: Disposition[]
    side_effects: []

  # --- Reports ---
  - method: POST
    path: "/incidents/{id}/reports"
    description: "Generate a NENA or NFIRS call-for-service report snapshot for a CLOSED incident"
    roles: [Records, Supervisor]
    code: 201
    input: [report_standard]
    output: CfsReport
    side_effects:
      - "Snapshots response_time_seconds, total_handle_seconds, sla_breached, disposition_code"
      - "unit_count computed (incident_unit_count calc); report is immutable"

  - method: GET
    path: "/incidents/{id}/reports"
    description: "List reports for an incident (reverse lookup Incident -> CfsReport)"
    roles: [Calltaker, Dispatcher, Supervisor, Records]
    code: 200
    input: ["report_standard?", "limit?", "offset?"]
    output: CfsReport[]
    side_effects: []

  - method: GET
    path: "/reports/{id}"
    description: "Get one report"
    roles: [Calltaker, Dispatcher, Supervisor, Records]
    code: 200
    input: []
    output: CfsReport
    side_effects: []

  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Default at startup (before any call) is 2026-01-01T00:00:00Z; the clock never falls back to wall-clock time. All received_at / dispatch / onscene / report timestamps read this clock."
    roles: [SystemClock]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; subsequent system timestamps use this value"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a recognized role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A resource ID in the path does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "A foreign-key ID in the request body references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range integer, ANI not 10 digits, grid outside 0..1000" }
  - { id: ERR_STALE_INCIDENT_VERSION, http: 412, condition: "expected_incident_version does not match current Incident.version on assignment create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_INCIDENT_HELD, http: 409, condition: "Incident is HELD; new assignments are blocked until resumed" }
  - { id: ERR_DISCIPLINE_MISMATCH, http: 409, condition: "Unit's agency discipline is not among the incident's required disciplines" }
  - { id: ERR_AGENCY_UNAVAILABLE, http: 409, condition: "Unit's agency is OFFLINE, or MUTUAL_AID_ONLY while an ONLINE unit of that discipline still exists" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Unit is not AVAILABLE (already committed or out of service)" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "Unit already has a non-CANCELLED assignment on this incident" }
  - { id: ERR_NO_UNIT_AVAILABLE, http: 409, condition: "Auto-select dispatch found no eligible unit in primary or mutual-aid pass" }
  - { id: ERR_OPEN_ASSIGNMENTS, http: 409, condition: "Cannot close: an assignment is still DISPATCHED/ENROUTE/ONSCENE" }
  - { id: ERR_REPORT_STANDARD_MISMATCH, http: 409, condition: "NFIRS requested for a non-fire incident, or report standard incompatible with incident disciplines" }
  - { id: ERR_INCIDENT_NOT_CLOSED, http: 409, condition: "Report requested for an incident that is not CLOSED" }
  - { id: ERR_DUPLICATE_CALL_SIGN, http: 409, condition: "call_sign already used by another unit in the same agency" }
  - { id: ERR_STATION_AGENCY_MISMATCH, http: 409, condition: "Referenced station does not belong to the unit's agency" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Calltaker
    description: "Call intake: creates incidents, may cancel pre-dispatch, read-only on everything else"
    identity: opaque
    exclusive_operations:
      - "POST /incidents — call intake"
    shared_operations:
      - "POST /incidents/{id}/cancel (shared with Supervisor)"
      - "GET on all resources"

  - name: Dispatcher
    description: "Unit recommendation and dispatch; can clear/cancel assignments"
    identity: opaque
    exclusive_operations:
      - "GET /incidents/{id}/recommendation"
      - "POST /incidents/{id}/assignments"
    shared_operations:
      - "PATCH /assignments/{id}/status (shared with FieldUnit, Supervisor)"
      - "GET on all resources"

  - name: FieldUnit
    description: "In-field unit reporting its own status and assignment progress"
    identity: entity_backed:Unit
    exclusive_operations: []
    shared_operations:
      - "PATCH /units/{id}/status (shared with Supervisor)"
      - "PATCH /assignments/{id}/status (shared with Dispatcher, Supervisor)"
      - "GET on all resources"

  - name: Supervisor
    description: "Override authority: escalate, hold/resume, close, manage agencies/stations/units/premise alerts"
    identity: opaque
    exclusive_operations:
      - "POST /agencies, PATCH /agencies/{id}/status"
      - "POST /stations, POST /units"
      - "POST /incidents/{id}/escalate"
      - "POST /incidents/{id}/hold, POST /incidents/{id}/resume"
      - "POST /incidents/{id}/dispositions"
    shared_operations:
      - "POST /incidents (shared with Calltaker)"
      - "POST /incidents/{id}/cancel (shared with Calltaker)"
      - "POST /incidents/{id}/assignments, GET /incidents/{id}/recommendation (shared with Dispatcher)"
      - "PATCH /units/{id}/status, PATCH /assignments/{id}/status"
      - "POST /premise-alerts, PATCH /premise-alerts/{id} (shared with Records)"
      - "POST /incidents/{id}/reports (shared with Records)"

  - name: Records
    description: "NENA/NFIRS report generation and premise-alert maintenance"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /incidents/{id}/reports (shared with Supervisor)"
      - "POST /premise-alerts, PATCH /premise-alerts/{id} (shared with Supervisor)"
      - "GET on all resources"

  - name: SystemClock
    description: "Test-driving operator that advances the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
