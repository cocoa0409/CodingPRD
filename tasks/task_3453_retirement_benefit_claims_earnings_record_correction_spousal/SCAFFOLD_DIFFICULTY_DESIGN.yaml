  - name: family_max_per_line_dime_reconciliation
    grounds:
    - calculations.family_maximum
    - calculations.spousal_computation
    - entities.BenefitClaim.fields.monthly_benefit_cents
    distinguishing_aspect: 'Mode (b): nested rounding order is pinned — each auxiliary''s share is dime-floored FIRST (ex 4110, cur 6320) and
      the stranded 10-cent residual goes to the earliest-created_at auxiliary (ex -> 4120). An implementation that sums-then-rounds leaves the
      ex-spouse at 4110 and the family 10 cents under the pool.'
    test_recipe:
      setup:
      - 'Worker q: born 1964-06, earnings 2019-2023 at AWI -> PIA 20880; family maximum FMAX = dime_floor(1.5*20880) = 31320'
      - 'Ex-spouse ex: DIVORCED_SPOUSE (marriage 1990-01-01..2010-01-01 = 240 months), entitlement 2026-06 at age 744 -> auxiliary 6780 before
        family max'
      - 'Current spouse cur: marriage 2020-01-01, entitlement 2031-06 at FRA -> auxiliary 10440 before family max'
      - Auxiliary sum 17220 exceeds pool (31320 - 20880 = 10440), so proportional reduction with per-line dime rounding applies
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Worker Q
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
