        distinguishing_aspect: |
          Boundary at the quota cap: region CTY_SM (population 30000, persons 30000)
          gives cap=1. The FIRST submit (available 1>0) succeeds and drives used to 1;
          a SECOND submit (available 0, not >0) is rejected with ERR_QUOTA_EXHAUSTED —
          pinning the strict `> 0` boundary at exactly the last slot.
        test_recipe:
          setup:
            - "Region CTY_SM cap=1 for ON_47; one application already SUBMITTED holding the only slot."
            - "A second DRAFT application la2_id for the same region+class by a different applicant."
