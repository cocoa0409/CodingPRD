# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_2292_post_election_audit_recount_administration
#
# Breadth probe over the nine sections of references/claim-extraction-guide.md.
# Every claim the §1.1-§1.7 surface declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml
# does not already exercise. Corners already covered by §1.8 appear as
# `excluded_because:` stubs and carry no test_recipe.
#
# Shared fixture vocabulary (all recipes start from an empty database and drive
# the logical clock explicitly):
#   E1  - Election ST-01 "2026 General Election", election_date 2026-11-03,
#         certification_deadline_at 2026-11-24T17:00:00Z, contest C1
#         (State Auditor, ALVAREZ / BRENNAN, ballots_cast 6000, cvr_available
#         true), six 1000-ballot batches B-001..B-006 in VAULT-1 each
#         machine-tabulated ALVAREZ 525 / BRENNAN 475 under SEAL-001..SEAL-006.
#         Canvass ALVAREZ 3150 / BRENNAN 2850 -> margin_votes 300,
#         margin_pct 5.0000, recount_request_deadline_at 2026-11-10T09:00:00Z.
#   A1  - RISK_LIMITING audit on C1, alpha 0.05, seed 0459231087,
#         planned_sample_size 3, round 1 selection [B-003, B-004, B-005].
#   T-1 - bipartisan tally team (u-dem-1 DEM LEAD, u-rep-1 REP COUNTER), ROOM-A.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: election_create_returns_declared_fields_and_starts_open
        claim_type: Creation
        grounds:
          - entities.Election
          - endpoints.POST_/elections
          - calculations.certification_timeline_projection
        distinguishing_aspect: |
          A registration carrying only the four input fields comes back 201 with every computed field
          initialised by the server: status OPEN, timeline_status ON_TRACK, both counters 0 and the two
          deadline windows derived from certification_deadline_at (+0 days extension, +10 days contest
          window). certified_at is null and version is 1.
        test_recipe:
          setup:
            - "Empty database. Logical clock pinned to 2026-11-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
          trigger:
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id", e1_v: "$.data.version" }
          assert:
            - "the response status is 201 and response_type is object"
            - "Election.${e1_id}.jurisdiction_code == ST-01 and election_name == 2026 General Election"
            - "Election.${e1_id}.election_date == 2026-11-03 and certification_deadline_at == 2026-11-24T17:00:00Z"
            - "Election.${e1_id}.status == OPEN and timeline_status == ON_TRACK and certification_risk_flag == false"
            - "Election.${e1_id}.open_audit_count == 0 and open_recount_count == 0 and certified_at == null"
            - "Election.${e1_id}.effective_certification_deadline_at == 2026-11-24T17:00:00Z"
            - "Election.${e1_id}.contest_window_ends_at == 2026-12-04T17:00:00Z"
            - "${e1_v} == 1 and the response carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"
      - name: contest_get_returns_stored_values_and_canvass_derivations
        claim_type: Retrieval
        grounds:
          - entities.Contest
          - endpoints.GET_/contests/{id}
          - calculations.contest_margin_canvass
        distinguishing_aspect: |
          Every field of a canvassed contest round-trips through GET: the client-supplied configuration
          unchanged, the reported_votes map exactly as posted, and the five derivations (winner, runner-up,
          margin_votes 300, margin_pct 5.0000, recount_request_deadline_at 2026-11-10T09:00:00Z) as
          computed at canvass, with version 2 after the single mutation.
        test_recipe:
          setup:
            - "E1 exists and contest C1 has been canvassed at 2026-11-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
              as: ElectionsDirector
              captures: { c1_v: "$.data.version" }
          trigger:
            - call: "GET /contests/${c1_id}"
              payload: { }
              as: AuditManager
          assert:
            - "the response status is 200 and response_type is object"
            - "Contest.${c1_id}.contest_label == C1 and office_name == State Auditor and contest_type == CANDIDATE"
            - "Contest.${c1_id}.candidate_names == [ALVAREZ, BRENNAN] and ballots_cast == 6000 and cvr_available == true"
            - "Contest.${c1_id}.reported_votes == { ALVAREZ: 3150, BRENNAN: 2850 }"
            - "Contest.${c1_id}.winner_name == ALVAREZ and runner_up_name == BRENNAN"
            - "Contest.${c1_id}.margin_votes == 300 and margin_pct == 5.0000"
            - "Contest.${c1_id}.automatic_recount_required == false and recount_request_deadline_at == 2026-11-10T09:00:00Z"
            - "Contest.${c1_id}.status == CANVASSED and canvassed_at == 2026-11-05T09:00:00Z and open_recount_count == 0"
            - "Contest.${c1_id}.version == 2"
      - name: ballot_batch_list_paginates_in_batch_label_order
        claim_type: Listing
        grounds:
          - endpoints.GET_/ballot-batches
          - response_envelope.pagination_fields
          - entities.BallotBatch
        distinguishing_aspect: |
          The six batches of C1 page in batch_label ASC order: limit 2 offset 0 returns B-001 and B-002
          with total_count 6 and has_more true, while limit 2 offset 4 returns B-005 and B-006 with the same
          total_count and has_more false - total_count counts the filtered set, not the page.
        test_recipe:
          setup:
            - "E1 exists with six batches B-001..B-006 on contest C1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
              as: ElectionsDirector
              captures: { c1_v: "$.data.version" }
          trigger:
            - call: "GET /ballot-batches"
              payload: { contest_id: "${c1_id}", limit: 2, offset: 0 }
              as: CustodyOfficer
              captures: { p1_first: "$.data[0].batch_label", p1_second: "$.data[1].batch_label" }
            - call: "GET /ballot-batches"
              payload: { contest_id: "${c1_id}", limit: 2, offset: 4 }
              as: CustodyOfficer
              captures: { p3_first: "$.data[0].batch_label", p3_second: "$.data[1].batch_label" }
          assert:
            - "the first response has response_type array, total_count == 6, has_more == true and exactly 2 rows"
            - "${p1_first} == B-001 and ${p1_second} == B-002"
            - "the second response has total_count == 6, has_more == false and exactly 2 rows"
            - "${p3_first} == B-005 and ${p3_second} == B-006"
            - "every returned row carries custody_status == SEALED and ballot_count == 1000"
      - name: audit_get_with_unknown_id_returns_audit_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/audits/{id}
          - validations[priority=4]
          - errors[ERR_AUDIT_NOT_FOUND]
        distinguishing_aspect: |
          A well-formed UUID that matches no stored audit yields the audit-specific 404 code, not a
          generic not-found: the existence check at priority 4 names one error per entity.
        test_recipe:
          setup:
            - "Empty database apart from the clock call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
          trigger:
            - call: "GET /audits/00000000-0000-4000-8000-000000000001"
              payload: { }
              as: AuditManager
              captures: { err_nf: "$.data.error_id" }
          assert:
            - "${err_nf} == ERR_AUDIT_NOT_FOUND with response status 404"
            - "response_type is error and data.message is a non-empty string"
            - "no Audit row exists"
      - name: election_create_missing_certification_deadline_is_rejected
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/elections
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          certification_deadline_at is an input field with no default, so omitting it fails the
          priority-3 body check with 422 and no Election row is created - the omission is not silently
          defaulted to the election_date.
        test_recipe:
          setup:
            - "Empty database apart from the clock call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
          trigger:
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03" }
              as: ElectionsDirector
              captures: { err_req: "$.data.error_id" }
            - call: "GET /elections"
              payload: { limit: 10 }
              as: ElectionsDirector
          assert:
            - "${err_req} == ERR_VALIDATION with response status 422"
            - "GET /elections returns total_count == 0"
            - "the error envelope carries response_type error and a data.message naming certification_deadline_at"
      - name: contest_create_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Contest.fields.cvr_available
          - entities.Contest.fields.reported_votes
          - endpoints.POST_/contests
        distinguishing_aspect: |
          Omitting cvr_available and reported_votes applies their declared defaults (false and null)
          rather than rejecting the request, and every canvass derivation stays null until the canvass
          runs: winner_name, margin_votes, margin_pct and recount_request_deadline_at are all null while
          automatic_recount_required starts false and open_recount_count starts 0.
        test_recipe:
          setup:
            - "E1's election row exists; no contest has been created yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
          trigger:
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000 }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id", c1_v: "$.data.version" }
          assert:
            - "the response status is 201"
            - "Contest.${c1_id}.cvr_available == false and reported_votes == null"
            - "Contest.${c1_id}.status == PENDING_CANVASS and canvassed_at == null"
            - "Contest.${c1_id}.winner_name == null and runner_up_name == null and margin_votes == null and margin_pct == null"
            - "Contest.${c1_id}.automatic_recount_required == false and recount_request_deadline_at == null"
            - "Contest.${c1_id}.open_recount_count == 0 and ${c1_v} == 1"
            - "Election.${e1_id}.status == OPEN (creating a contest does not canvass anything)"
      - name: audit_measure_variant_and_sample_size_are_computed_from_audit_type
        claim_type: Computed Fields
        grounds:
          - entities.Audit.fields.measure_variant
          - entities.Audit.fields.planned_sample_size
          - calculations.audit_sample_size
          - endpoints.POST_/audits
        distinguishing_aspect: |
          measure_variant is never client-supplied: RISK_LIMITING and FIXED_PERCENTAGE audits come back
          NET_MARGIN_SHIFT while COMPARISON comes back MAX_RELATIVE_OVERSTATEMENT, and planned_sample_size
          is derived at creation from the canvassed margin (3 / 2 / 2 batches) even though no round exists
          yet.
        test_recipe:
          setup:
            - "E1 with C1 canvassed (margin_votes 300, margin_pct 5.0000, six 1000-ballot batches, cvr_available true)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
              as: ElectionsDirector
              captures: { c1_v: "$.data.version" }
          trigger:
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "RISK_LIMITING", risk_limit_alpha: 0.05 }
              as: AuditManager
              captures: { a_rla: "$.data.id", v_rla: "$.data.measure_variant", n_rla: "$.data.planned_sample_size" }
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "COMPARISON", risk_limit_alpha: 0.05, prior_error_rate: 0.10 }
              as: AuditManager
              captures: { a_cmp: "$.data.id", v_cmp: "$.data.measure_variant", n_cmp: "$.data.planned_sample_size" }
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "FIXED_PERCENTAGE", fixed_percentage_pct: 5 }
              as: AuditManager
              captures: { a_fix: "$.data.id", v_fix: "$.data.measure_variant", n_fix: "$.data.planned_sample_size" }
          assert:
            - "${v_rla} == NET_MARGIN_SHIFT and ${n_rla} == 3"
            - "${v_cmp} == MAX_RELATIVE_OVERSTATEMENT and ${n_cmp} == 2"
            - "${v_fix} == NET_MARGIN_SHIFT and ${n_fix} == 2"
            - "Audit.${a_rla}.status == PLANNED and escalation_level == 0 and discrepancy_measure == 0.0"
            - "Audit.${a_rla}.random_seed == null and seed_published_at == null and sample_size_stale == false"
            - "Audit.${a_fix}.risk_limit_alpha == null and Audit.${a_rla}.fixed_percentage_pct == null"
            - "Election.${e1_id}.open_audit_count == 3"
      - name: custody_event_identity_and_sequence_are_server_assigned
        claim_type: System Fields
        grounds:
          - entities.CustodyEvent.fields.id
          - entities.CustodyEvent.fields.sequence_no
          - entities.CustodyEvent.fields.actor_user_id
          - endpoints.GET_/ballot-batches/{id}/custody-events
        distinguishing_aspect: |
          The client never supplies any part of a custody event: intake, selection authorisation and
          check-out land as sequence_no 1, 2 and 3 on B-003 with occurred_at all equal to the frozen clock,
          each stamped with the acting user and role, so sequence_no - not occurred_at and not id - is what
          orders the chain of custody.
        test_recipe:
          setup:
            - "E1 with audit A1 seeded and round 1 drawn ([B-003, B-004, B-005])."
            - "B-003 has been retrieved from VAULT-1 against SEAL-003 by CustodyOfficer u-custody-1."
            - "The clock never advances, so all three events share occurred_at 2026-11-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
              as: ElectionsDirector
              captures: { c1_v: "$.data.version" }
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "RISK_LIMITING", risk_limit_alpha: 0.05 }
              as: AuditManager
              captures: { a1_id: "$.data.id" }
