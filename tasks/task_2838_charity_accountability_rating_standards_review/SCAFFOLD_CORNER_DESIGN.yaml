            - call: "POST /public-comments"
              payload: { methodology_version_id: "${m1}", commenter_kind: "PUBLIC", body: "Filed on the deadline instant itself, which the rule admits" }
              as: PublicUser
              as_user_id: "public-3"
              captures: { pc3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
