            - { call: "POST /providers", payload: { legal_name: "Birch House", license_number: "LIC-4002", county_code: "DANE", region_code: "RURAL", licensed_capacity: 30, active_staff_fte: 4.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
