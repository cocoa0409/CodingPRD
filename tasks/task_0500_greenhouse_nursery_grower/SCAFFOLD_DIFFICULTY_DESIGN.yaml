  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- Instance 1: depth>=3 from shipment dispatch -----------------------
      - name: dispatch_cascade_batch_order_broker_depth3
        grounds:
          - state_machines.Shipment.DRAFT_to_DISPATCHED
          - state_machines.BrokerOrder.FULFILLING_to_SHIPPED
          - entities.Broker.fields.open_balance_cents
          - entities.PropagationBatch.fields.live_count
        distinguishing_aspect: |
          Depth-3 chain originating at shipment dispatch: dispatch mutates
          PropagationBatch.live_count (A->B); the line becoming fully shipped
          flips BrokerOrder CONFIRMED->FULFILLING->SHIPPED (B-caused->C); the
          order reaching SHIPPED debits Broker.open_balance_cents back to 0
