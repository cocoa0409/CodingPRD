              as: ServiceTechnician
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /fitness/service-orders/${so_id}/reserve-part"
              payload: { part_id: "${pi_id}", quantity: 1 }
              as: ServiceTechnician
              captures: { err_empty: $.data.error_id }
            - call: "POST /fitness/service-orders/${so_id}/schedule"
              payload: { scheduled_start_at: "2026-09-06T09:00:00Z", scheduled_end_at: "2026-09-06T11:00:00Z" }
              as: ServiceTechnician
              captures: { err_park: $.data.error_id }
          assert:
            - "PartsInventory.${pi_id}.on_hand_qty == 0 so the reservation fails with 409 ERR_PART_INSUFFICIENT (captured as ${err_empty})"
            - "ServiceOrder.${so_id}.status == DISPATCH_PENDING_PART after the failure, the cosmetic parking transition"
            - "the schedule attempt out of that state still fails with 409 ERR_PART_REQUIRED_FOR_SCHEDULING (captured as ${err_park}) because the fault is COSMETIC"
            - "Device.${d_id}.entitlement_lock stays false and Device.${d_id}.content_access_allowed stays true while a part is missing"
            - "ServiceOrder.${so_id}.safety_functions_maintained == true"

      - name: scheduling_a_repair_on_a_decommissioned_device_returns_not_operational
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DISPATCH_DEVICE_NOT_OPERATIONAL]
          - state_machines.Device.ACTIVE_to_DECOMMISSIONED
        distinguishing_aspect: "Once a device is decommissioned by membership termination, a repair for it cannot be scheduled, so the service surface and the entitlement surface agree on the device's terminal state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A membership with a verified OWNER and a delivered linked device, cancelled and then swept past the 180-day termination grace."
          setup_api_calls:
            - *c_clock
            - *c_m_create
