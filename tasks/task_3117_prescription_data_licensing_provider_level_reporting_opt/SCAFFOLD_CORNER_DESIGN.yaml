              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-JR", prescriber_ids: ["${p1_id}"], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 1 }
