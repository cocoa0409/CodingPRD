# =============================================================================
# Task 1961: Cheer & Dance Competition Management
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — 9 rules x 2 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: score_variants_trim_and_appeal_inclusion_diverge
        grounds:
          - calculations.performance_base_score
          - calculations.performance_final_score
          - state_machines.Performance.SCORED_to_OFFICIAL
        distinguishing_aspect: |
          Entity domain = Performance scoring. Identical sheet/deduction data yields
          provisional_score 78.15 vs official_score 76.75: the OFFICIAL variant trims one
          high/low per category (5-sheet panel) while PROVISIONAL never trims, and the
          deduction inclusion sets are equal here only because the appeal was resolved
          before confirmation — pinned literals below make both mechanisms observable.
        test_recipe:
          setup:
            - "Event REGISTRATION cycle completed; one division (level 3, limit 150s, judges j1..j5)"
            - "Team t1 (coach-1) CHECKED_IN; performance p1 PERFORMED with TIME deduction 3.50 pts (157s) and BOUNDARY deduction 0.75 pts (3 violations)"
            - "SAFETY deduction 2.00 pts on p1 applied by safety judge js, appealed by coach-1, then the appeal REJECTED by head judge jh (deduction UPHELD)"
            - "Five sheets submitted with per-judge (BD,BE,TD,OI): j1 (8.0,7.5,7.0,8.5), j2 (8.0,8.0,7.5,8.5), j3 (8.5,8.0,7.5,9.0), j4 (9.0,8.5,8.0,9.0), j5 (10.0,9.5,9.0,9.5)"
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J4", certified_levels: [3] }, as: EventDirector, captures: { j4: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J5", certified_levels: [3] }, as: EventDirector, captures: { j5: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "JS", certified_levels: [3] }, as: EventDirector, captures: { js: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "JH", certified_levels: [3] }, as: EventDirector, captures: { jh: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}", "${j4}", "${j5}"] }, as: EventDirector, captures: { dv: $.data.id, dv_v: $.data.version } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/athletes", payload: { full_name: "Ann", date_of_birth: "2010-05-01" }, as: TeamCoach, as_user_id: "coach-1", captures: { a1: $.data.id } }
            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv}", name: "T1", organization: "Gym1", category: "CHEER", level: 3, coach_user_id: "coach-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { t1: $.data.id } }
            - { call: "POST /api/roster-entries", payload: { team_id: "${t1}", athlete_id: "${a1}", bib_number: 1 }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/lock-roster", payload: {}, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/music-submissions", payload: { track_count: 3, license_provider: "ACM", license_reference: "LIC-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { ms: $.data.id } }
            - { call: "POST /api/music-submissions/${ms}/review", payload: { decision: "VERIFIED" }, as: MusicCompliance }
            - { call: "POST /api/events/${ev}/close-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/divisions/${dv}/generate-schedule", payload: { expected_division_version: "${dv_v}" }, as: EventDirector }
            - { call: "POST /api/events/${ev}/go-live", payload: {}, as: EventDirector }
            - { call: "POST /api/teams/${t1}/check-in", payload: { athlete_ids: ["${a1}"] }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "GET /api/teams/${t1}/performances", payload: {}, as: EventDirector, captures: { p1: "$.data[0].id" } }
            - { call: "POST /api/performances/${p1}/mark-performed", payload: { actual_duration_seconds: 157, boundary_violations: 3 }, as: SafetyJudge, as_user_id: "${js}" }
            - { call: "POST /api/performances/${p1}/deductions", payload: { type: "SAFETY", quantity: 1, skill_tier: 4 }, as: SafetyJudge, as_user_id: "${js}", captures: { ded: $.data.id } }
            - { call: "POST /api/deductions/${ded}/appeals", payload: { note: "skill was legal", video_ref: "vid-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { ap: $.data.id } }
            - { call: "POST /api/appeals/${ap}/resolve", payload: { decision: "REJECTED" }, as: HeadJudge, as_user_id: "${jh}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.0, building_execution: 7.5, tumbling_difficulty: 7.0, overall_impression: 8.5 }, as: Judge, as_user_id: "${j1}", captures: { s1: $.data.id } }
            - { call: "POST /api/score-sheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.0, building_execution: 8.0, tumbling_difficulty: 7.5, overall_impression: 8.5 }, as: Judge, as_user_id: "${j2}", captures: { s2: $.data.id } }
            - { call: "POST /api/score-sheets/${s2}/submit", payload: {}, as: Judge, as_user_id: "${j2}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.5, building_execution: 8.0, tumbling_difficulty: 7.5, overall_impression: 9.0 }, as: Judge, as_user_id: "${j3}", captures: { s3: $.data.id } }
            - { call: "POST /api/score-sheets/${s3}/submit", payload: {}, as: Judge, as_user_id: "${j3}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 9.0, building_execution: 8.5, tumbling_difficulty: 8.0, overall_impression: 9.0 }, as: Judge, as_user_id: "${j4}", captures: { s4: $.data.id } }
            - { call: "POST /api/score-sheets/${s4}/submit", payload: {}, as: Judge, as_user_id: "${j4}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 10.0, building_execution: 9.5, tumbling_difficulty: 9.0, overall_impression: 9.5 }, as: Judge, as_user_id: "${j5}", captures: { s5: $.data.id } }
            - { call: "POST /api/score-sheets/${s5}/submit", payload: {}, as: Judge, as_user_id: "${j5}" }
          trigger:
            - { call: "POST /api/performances/${p1}/confirm-official", payload: {}, as: HeadJudge, as_user_id: "${jh}" }
            - { call: "GET /api/performances/${p1}", payload: {}, as: HeadJudge, as_user_id: "${jh}", captures: { prov: "$.data.provisional_score", off: "$.data.official_score" } }
          assert:
            - "provisional_score == 78.15 (base 84.40 untrimmed minus 6.25 deductions incl. UPHELD 2.00)"
            - "official_score == 76.75 (base 83.00 after dropping one high+one low per category, minus 6.25)"
            - "provisional_score != official_score although raw sheet data is identical"

      - name: ticket_order_rounding_variants_diverge_in_cents
        grounds:
          - calculations.ticket_order_total
          - entities.TicketOrder.fields.total_cents
        distinguishing_aspect: |
          Entity domain = TicketOrder pricing (different domain from Performance scoring).
          The pinned ORDER_LEVEL variant yields 29137 cents for 25 ADVANCE tickets while the
          documented PER_UNIT interpretation would yield 29150 — identical inputs, different
          cents; the API must serve ORDER_LEVEL only.
        test_recipe:
          setup:
            - "Event (start_date 2026-09-05 -> ADVANCE cutoff 2026-08-22T00:00:00Z) REGISTRATION_OPEN; session cap 1000; clock at default 2026-08-01T00:00:00Z (ADVANCE tier)"
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Nationals", venue_name: "Dome", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/sessions", payload: { event_id: "${ev}", name: "Sat AM", starts_at: "2026-09-05T08:00:00Z", ends_at: "2026-09-05T12:00:00Z", capacity: 1000 }, as: EventDirector, captures: { se: $.data.id } }
          trigger:
            - { call: "POST /api/ticket-orders", payload: { session_id: "${se}", quantity: 25 }, as: Spectator, as_user_id: "spec-1", captures: { o1: $.data.id, tot: "$.data.total_cents", disc: "$.data.discount_cents", tier: "$.data.tier" } }
          assert:
            - "tier == ADVANCE (default clock 2026-08-01 <= cutoff 2026-08-22T00:00:00Z)"
            - "unit_price_cents == 1295"
            - "discount_cents == 3238 (round_half_up(32375 * 0.10) = round_half_up(3237.5))"
            - "total_cents == 29137 (subtotal 32375 - 3238), NOT 29150 (per-unit variant)"

  - rule_id: combinatorial_formula
    instances:
      - name: score_aggregation_branching_on_panel_size
        grounds:
          - calculations.performance_base_score
          - calculations.performance_final_score
          - calculations.deduction_points
        distinguishing_aspect: |
          Mode (a): the formula has >= 3 inputs with non-linear interaction — a conditional
          branch on sheet count (trim only when >= 5), per-category weight selection, and a
          deduction sum gated by deduction status. With a 3-judge panel (no trim) and
          TIME 3.50 + BOUNDARY 0.75 deductions, official_score must equal exactly 76.92.
        test_recipe:
          setup:
            - "3-judge panel division; team CHECKED_IN; performance PERFORMED with actual_duration_seconds 157 (limit 150) and boundary_violations 3"
            - "Sheets (BD,BE,TD,OI): j1 (8.0,7.5,7.0,8.0), j2 (8.5,8.0,7.5,8.0), j3 (9.0,8.5,8.0,9.0) all SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "JH", certified_levels: [3] }, as: EventDirector, captures: { jh: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "JS", certified_levels: [3] }, as: EventDirector, captures: { js: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"] }, as: EventDirector, captures: { dv: $.data.id, dv_v: $.data.version } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/athletes", payload: { full_name: "Ann", date_of_birth: "2010-05-01" }, as: TeamCoach, as_user_id: "coach-1", captures: { a1: $.data.id } }
            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv}", name: "T1", organization: "Gym1", category: "CHEER", level: 3, coach_user_id: "coach-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { t1: $.data.id } }
            - { call: "POST /api/roster-entries", payload: { team_id: "${t1}", athlete_id: "${a1}", bib_number: 1 }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/lock-roster", payload: {}, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/music-submissions", payload: { track_count: 2, license_provider: "ACM", license_reference: "LIC-9" }, as: TeamCoach, as_user_id: "coach-1", captures: { ms: $.data.id } }
            - { call: "POST /api/music-submissions/${ms}/review", payload: { decision: "VERIFIED" }, as: MusicCompliance }
            - { call: "POST /api/events/${ev}/close-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/divisions/${dv}/generate-schedule", payload: { expected_division_version: "${dv_v}" }, as: EventDirector }
            - { call: "POST /api/events/${ev}/go-live", payload: {}, as: EventDirector }
            - { call: "POST /api/teams/${t1}/check-in", payload: { athlete_ids: ["${a1}"] }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "GET /api/teams/${t1}/performances", payload: {}, as: EventDirector, captures: { p1: "$.data[0].id" } }
            - { call: "POST /api/performances/${p1}/mark-performed", payload: { actual_duration_seconds: 157, boundary_violations: 3 }, as: SafetyJudge, as_user_id: "${js}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.0, building_execution: 7.5, tumbling_difficulty: 7.0, overall_impression: 8.0 }, as: Judge, as_user_id: "${j1}", captures: { s1: $.data.id } }
            - { call: "POST /api/score-sheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 8.5, building_execution: 8.0, tumbling_difficulty: 7.5, overall_impression: 8.0 }, as: Judge, as_user_id: "${j2}", captures: { s2: $.data.id } }
            - { call: "POST /api/score-sheets/${s2}/submit", payload: {}, as: Judge, as_user_id: "${j2}" }
            - { call: "POST /api/performances/${p1}/score-sheets", payload: { building_difficulty: 9.0, building_execution: 8.5, tumbling_difficulty: 8.0, overall_impression: 9.0 }, as: Judge, as_user_id: "${j3}", captures: { s3: $.data.id } }
            - { call: "POST /api/score-sheets/${s3}/submit", payload: {}, as: Judge, as_user_id: "${j3}" }
          trigger:
            - { call: "POST /api/performances/${p1}/confirm-official", payload: {}, as: HeadJudge, as_user_id: "${jh}" }
          assert:
            - "TIME deduction points == 3.50 (7 s over x 0.5); BOUNDARY points == 0.75 (3 x 0.25)"
            - "base == 81.17 (straight means 8.5/8.0/7.5/8.3333... weighted 0.3/0.3/0.2/0.2, x10, one final round_half_up)"
            - "official_score == 76.92 (81.17 - 4.25); no trim applied because panel has only 3 sheets"

      - name: ticket_group_discount_rounding_order_and_qty_boundary
        grounds:
          - calculations.ticket_order_total
        distinguishing_aspect: |
          Mode (b): nested rounding order — discount rounded to whole cents on the SUBTOTAL
          before subtraction (pinned), plus the inclusive quantity boundary GROUP_MIN_QTY:
          20 tickets get discount_cents 2590 / total 23310; 19 tickets get discount 0 /
          total 24605. Different mode from the panel-size branching instance.
        test_recipe:
          setup: ["Event REGISTRATION_OPEN (start_date 2026-09-05, clock default 2026-08-01 -> ADVANCE); session cap 500"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Nationals", venue_name: "Dome", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/sessions", payload: { event_id: "${ev}", name: "Sat AM", starts_at: "2026-09-05T08:00:00Z", ends_at: "2026-09-05T12:00:00Z", capacity: 500 }, as: EventDirector, captures: { se: $.data.id } }
          trigger:
            - { call: "POST /api/ticket-orders", payload: { session_id: "${se}", quantity: 20 }, as: Spectator, as_user_id: "spec-1", captures: { t20: "$.data.total_cents", d20: "$.data.discount_cents" } }
            - { call: "POST /api/ticket-orders", payload: { session_id: "${se}", quantity: 19 }, as: Spectator, as_user_id: "spec-2", captures: { t19: "$.data.total_cents", d19: "$.data.discount_cents" } }
          assert:
            - "qty 20: discount_cents == 2590 and total_cents == 23310 (discount applies AT 20, inclusive)"
            - "qty 19: discount_cents == 0 and total_cents == 24605"

  - rule_id: non_linear_state_machine
    instances:
      - name: deduction_appeal_cycle_two_rounds
        grounds:
          - state_machines.Deduction
          - state_machines.Appeal
        distinguishing_aspect: |
          Cyclic machine on Deduction: APPLIED -> UNDER_APPEAL -> UPHELD -> UNDER_APPEAL
          (round-2 resubmit) -> OVERTURNED — a true cycle, distinct from the parallel
          dimensions instance on Team.
        test_recipe:
          setup:
            - "Performance p1 PERFORMED; SAFETY deduction (quantity 1, skill_tier 4 on level-3 division, 2.00 pts) APPLIED by js; clock default (inside 45-minute appeal window)"
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "JH", certified_levels: [3] }, as: EventDirector, captures: { jh: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "JS", certified_levels: [3] }, as: EventDirector, captures: { js: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"] }, as: EventDirector, captures: { dv: $.data.id, dv_v: $.data.version } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/athletes", payload: { full_name: "Ann", date_of_birth: "2010-05-01" }, as: TeamCoach, as_user_id: "coach-1", captures: { a1: $.data.id } }
            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv}", name: "T1", organization: "Gym1", category: "CHEER", level: 3, coach_user_id: "coach-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { t1: $.data.id } }
            - { call: "POST /api/roster-entries", payload: { team_id: "${t1}", athlete_id: "${a1}", bib_number: 1 }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/lock-roster", payload: {}, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/music-submissions", payload: { track_count: 2, license_provider: "ACM", license_reference: "LIC-9" }, as: TeamCoach, as_user_id: "coach-1", captures: { ms: $.data.id } }
            - { call: "POST /api/music-submissions/${ms}/review", payload: { decision: "VERIFIED" }, as: MusicCompliance }
            - { call: "POST /api/events/${ev}/close-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/divisions/${dv}/generate-schedule", payload: { expected_division_version: "${dv_v}" }, as: EventDirector }
            - { call: "POST /api/events/${ev}/go-live", payload: {}, as: EventDirector }
            - { call: "POST /api/teams/${t1}/check-in", payload: { athlete_ids: ["${a1}"] }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "GET /api/teams/${t1}/performances", payload: {}, as: EventDirector, captures: { p1: "$.data[0].id" } }
            - { call: "POST /api/performances/${p1}/mark-performed", payload: { actual_duration_seconds: 150, boundary_violations: 0 }, as: SafetyJudge, as_user_id: "${js}" }
            - { call: "POST /api/performances/${p1}/deductions", payload: { type: "SAFETY", quantity: 1, skill_tier: 4 }, as: SafetyJudge, as_user_id: "${js}", captures: { ded: $.data.id } }
          trigger:
            - { call: "POST /api/deductions/${ded}/appeals", payload: { note: "round 1", video_ref: "vid-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { ap1: $.data.id, r1: "$.data.round" } }
            - { call: "POST /api/appeals/${ap1}/resolve", payload: { decision: "REJECTED" }, as: HeadJudge, as_user_id: "${jh}" }
            - { call: "POST /api/appeals/${ap1}/resubmit", payload: { note: "round 2", video_ref: "vid-2" }, as: TeamCoach, as_user_id: "coach-1", captures: { ap2: $.data.id, r2: "$.data.round" } }
            - { call: "POST /api/appeals/${ap2}/resolve", payload: { decision: "ACCEPTED" }, as: HeadJudge, as_user_id: "${jh}" }
            - { call: "GET /api/deductions/${ded}", payload: {}, as: HeadJudge, as_user_id: "${jh}", captures: { dst: "$.data.status" } }
          assert:
            - "round-1 appeal r1 == 1; after REJECTED the deduction status == UPHELD"
            - "resubmit creates appeal r2 == 2 and deduction returns to UNDER_APPEAL (cycle)"
            - "after round-2 ACCEPTED the deduction status == OVERTURNED (terminal)"

      - name: team_parallel_dimensions_reg_and_music
        grounds:
          - state_machines.Team
          - state_machines.TeamMusic
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity (Team.reg_status x Team.music_status):
          music can reach VERIFIED while reg_status is still REGISTERED, and check-in
          (reg dimension) is gated by the music dimension — a different non-linear shape
          from the Deduction cycle.
        test_recipe:
          setup: ["Event REGISTRATION_OPEN; division created; team with one rostered athlete"]
