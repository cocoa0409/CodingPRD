      - name: screening_and_audit_variants_score_the_same_redemption_differently
        claim_type: weighted_scoring
        grounds:
          - calculations.fraud_risk_score
          - entities.Redemption.fields.screening_risk_score
          - entities.Redemption.fields.audit_risk_score
          - entities.Offer.fields.per_member_limit
        distinguishing_aspect: |
          On one subject redemption the two variants weigh different prior sets: SCREENING
          scores 23 (15 employment + 8 for the single PENDING prior in its 24-hour window) and
          AUDIT scores 49 (15 employment + 24 for three priors in its 168-hour window + 10
          amount points from floor(100000 / 10000)), and the stored screening_risk_score is not
          rewritten by verification.
