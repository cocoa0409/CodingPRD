          - entities.ClassSession.fields.trainer_id
        distinguishing_aspect: "Resource = Trainer, interval semantics = half-open [starts_at, ends_at) PLUS a TRAINER_BUFFER_MIN gap: a second session starting within the buffer after the first session ends is rejected ERR_TRAINER_DOUBLE_BOOKED — buffered adjacency is a conflict."
