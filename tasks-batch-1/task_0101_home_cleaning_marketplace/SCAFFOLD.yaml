scenario: |
  101. Home Cleaning Marketplace: cleaner onboarding/background check, recurring
  (weekly/biweekly) vs one-time booking, home-size/add-on pricing (deep clean/move-out),
  preferred-pro assignment, supplies-provided flag, reschedule/cancellation-window fee,
  in-app tip, satisfaction reclean guarantee

domain_name: home-cleaning-marketplace
api_prefix: /cleaning

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Peer entities linked by foreign keys (Customer, Cleaner, Booking, etc.);
  # no nesting of business identity in URL paths — every resource addressable
  # by its own collection + id, FKs carried in request bodies.

  state_machine_shape: branching
  # Cleaner onboarding forks APPLIED->{CHECK_PASSED, CHECK_FAILED}; Booking
  # has a revision loop (RESCHEDULED back to SCHEDULED) and a guarantee branch
  # (COMPLETED -> RECLEAN_REQUESTED -> RECLEAN_SCHEDULED). Multiple non-linear
  # machines on different entities.

  relationship_patterns:
    - one_to_many       # Customer 1:N Booking; BookingSeries 1:N Booking
    - many_to_many      # Customer N:M Cleaner via PreferredPro association
    - cross_aggregate   # Booking references Cleaner, Address, PricingPlan

  role_model: peer_roles
  # Customer owns bookings/addresses/tips; Cleaner owns availability and reclean
  # acceptance; PlatformAdmin (opaque) runs onboarding/background checks and
  # the clock; each role owns a non-overlapping operation set.

  consistency_model: immediate
  # All mutations and their cascades (ledger debits, series regeneration,
  # reclean credit) settle atomically within the triggering request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Login email; unique across customers.
        constraints: unique, lowercased
      - name: full_name
        type: string
        source: input
        description: Customer display name.
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: |
          Non-negative store credit balance in cents. Debited first when a
          booking is charged; credited by reclean-guarantee compensation and
          by cancellation refunds. Recomputed by every transition that touches
          the customer ledger.
        default: 0
        constraints: ">= 0"
      - name: lifetime_booking_count
        type: integer
        source: computed
        description: |
          Count of this customer's Bookings that have reached COMPLETED (and
          stayed there; a later reclean does not increment it again). Drives the
          loyalty discount tier in price_quote.
        default: 0

  - name: Address
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; the owner of this service address.
      - name: line1
        type: string
        source: input
        description: Street address line.
      - name: postal_code
        type: string
        source: input
        description: Postal code used for cleaner service-area matching.
      - name: home_size
        type: enum
        source: input
        description: |
          Home size band that anchors base price.
          STUDIO | ONE_BR | TWO_BR | THREE_BR | FOUR_PLUS_BR.
        constraints: "in {STUDIO, ONE_BR, TWO_BR, THREE_BR, FOUR_PLUS_BR}"
      - name: archived
        type: boolean
        source: computed
        description: |
          Soft-delete flag. Archived addresses are excluded from default address
          listings and may not anchor a new booking, but remain readable and keep
          historical bookings valid.
        default: false

  - name: Cleaner
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Login email; unique across cleaners.
        constraints: unique, lowercased
      - name: full_name
        type: string
        source: input
        description: Cleaner display name.
      - name: service_postal_codes
        type: array
        source: input
        description: List of postal codes this cleaner serves.
      - name: status
        type: enum
        source: system
        description: |
          Onboarding/availability lifecycle. See §1.2 Cleaner machine.
          APPLIED | CHECK_PENDING | CHECK_PASSED | ACTIVE | CHECK_FAILED | SUSPENDED.
        default: APPLIED
        constraints: "in {APPLIED, CHECK_PENDING, CHECK_PASSED, ACTIVE, CHECK_FAILED, SUSPENDED}"
      - name: rating_sum
        type: integer
        source: computed
        description: |
          Sum of star ratings (1..5) received on COMPLETED bookings. Used with
          rating_count to derive average rating for preferred-pro ranking.
        default: 0
      - name: rating_count
        type: integer
        source: computed
        description: Number of ratings received; denominator for average rating.
        default: 0
      - name: completed_job_count
        type: integer
        source: computed
        description: |
          Count of bookings this cleaner has driven to COMPLETED. Tie-break input
          for preferred-pro auto-assignment.
        default: 0

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - name: cleaner_id
        type: string
        source: input
        description: FK -> Cleaner.id; the cleaner under review.
      - name: provider_ref
        type: string
        source: input
        description: External screening vendor reference id.
      - name: result
        type: enum
        source: system
        description: |
          Screening outcome. PENDING until adjudicated, then CLEAR or ADVERSE.
        default: PENDING
        constraints: "in {PENDING, CLEAR, ADVERSE}"
      - name: adjudicated_at
        type: datetime
        source: system
        description: UTC timestamp when result moved off PENDING; null while PENDING.

  - name: PricingPlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human label for this rate card (e.g., "2026 Standard").
      - name: base_price_cents
        type: object
        source: input
        description: |
          Map of home_size -> base price in cents, e.g.
          { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }.
      - name: deep_clean_surcharge_pct
        type: number
        source: input
        description: Fractional surcharge applied to base when DEEP_CLEAN add-on present (e.g. 0.50).
      - name: move_out_surcharge_pct
        type: number
        source: input
        description: Fractional surcharge applied to base when MOVE_OUT add-on present (e.g. 0.75).
      - name: supplies_fee_cents
        type: integer
        source: input
        description: Flat fee added when the cleaner (not customer) provides supplies.
      - name: active
        type: boolean
        source: system
        description: |
          Whether this plan may anchor new bookings. Exactly one plan is active at
          a time; activating a new plan deactivates the prior active plan.
        default: false

  - name: BookingSeries
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; owner of the recurring series.
      - name: address_id
        type: string
        source: input
        description: FK -> Address.id; service location for every occurrence.
      - name: pricing_plan_id
        type: string
        source: input
        description: FK -> PricingPlan.id; rate card pinned at series creation.
      - name: cadence
        type: enum
        source: input
        description: |
          Recurrence interval. WEEKLY (7-day step) or BIWEEKLY (14-day step).
        constraints: "in {WEEKLY, BIWEEKLY}"
      - name: add_ons
        type: array
        source: input
        description: |
          Add-on codes applied to every occurrence; subset of {DEEP_CLEAN, MOVE_OUT}.
          MOVE_OUT is rejected on a recurring series (see §1.4).
        default: []
      - name: supplies_provided_by
        type: enum
        source: input
        description: |
          Who brings cleaning supplies. CUSTOMER (no fee) or CLEANER (supplies_fee_cents added).
        constraints: "in {CUSTOMER, CLEANER}"
        default: CUSTOMER
      - name: preferred_cleaner_id
        type: string
        source: input
        description: |
          FK -> Cleaner.id; optional preferred pro pinned for every occurrence.
          May be null, in which case occurrences are auto-assigned at generation.
      - name: status
        type: enum
        source: system
        description: |
          Series lifecycle. ACTIVE while generating occurrences; PAUSED stops new
          generation; CANCELLED is terminal. See §1.2 BookingSeries machine.
        default: ACTIVE
        constraints: "in {ACTIVE, PAUSED, CANCELLED}"
      - name: next_occurrence_date
        type: datetime
        source: computed
        description: |
          UTC date of the next un-generated occurrence; advances by cadence step
          each time the series generates a Booking. Null once CANCELLED.

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; owner of this booking.
      - name: address_id
        type: string
        source: input
        description: FK -> Address.id; service location.
      - name: pricing_plan_id
        type: string
        source: input
        description: FK -> PricingPlan.id; rate card pinned at booking creation.
      - name: series_id
        type: string
        source: system
        description: |
          FK -> BookingSeries.id; set when this booking was generated from a
          recurring series, null for one-time bookings.
      - name: cleaner_id
        type: string
        source: system
        description: |
          FK -> Cleaner.id; the assigned pro. Null until assignment; set by
          preferred-pro pin or auto-assignment selector at creation.
      - name: scheduled_start
        type: datetime
        source: input
        description: UTC start instant of the cleaning visit.
      - name: scheduled_end
        type: datetime
        source: computed
        description: |
          UTC end instant, computed as scheduled_start + visit_duration_minutes(home_size)
          (§1.3 visit_window). Re-pinned on reschedule. Defines the half-open visit
          interval [scheduled_start, scheduled_end) used for cleaner double-booking
          and address double-booking overlap checks (§1.4).
      - name: home_size
        type: enum
        source: system
        description: |
          Home size snapshot copied from Address at creation, so later address
          edits do not retro-change this booking's price.
        constraints: "in {STUDIO, ONE_BR, TWO_BR, THREE_BR, FOUR_PLUS_BR}"
      - name: add_ons
        type: array
        source: input
        description: "Add-on codes for this booking; subset of {DEEP_CLEAN, MOVE_OUT}."
        default: []
      - name: supplies_provided_by
        type: enum
        source: input
        description: "Who brings supplies: CUSTOMER or CLEANER."
        constraints: "in {CUSTOMER, CLEANER}"
        default: CUSTOMER
      - name: status
        type: enum
        source: system
        description: |
          Visit lifecycle. See §1.2 Booking machine. SCHEDULED | RESCHEDULED |
          COMPLETED | CANCELLED | RECLEAN_REQUESTED | RECLEAN_SCHEDULED.
        default: SCHEDULED
        constraints: "in {SCHEDULED, RESCHEDULED, COMPLETED, CANCELLED, RECLEAN_REQUESTED, RECLEAN_SCHEDULED}"
      - name: quoted_price_cents
        type: integer
        source: computed
        description: |
          Final amount charged for this visit, after add-on surcharges, supplies
          fee, loyalty discount, and (if applicable) move-out minimum. Computed by
          price_quote at creation and re-pinned on reschedule. Reclean visits quote 0.
        default: 0
      - name: change_fee_cents
        type: integer
        source: computed
        description: |
          Reschedule/cancellation window fee assessed on this booking, by
          reschedule_or_cancel_fee. 0 when outside the fee window.
        default: 0
      - name: is_reclean
        type: boolean
        source: system
        description: |
          True when this booking was generated as a guarantee reclean of a prior
          COMPLETED booking; such visits are priced at 0.
        default: false
      - name: reclean_of_booking_id
        type: string
        source: system
        description: |
          FK -> Booking.id; the original COMPLETED booking this reclean remedies.
          Null for non-reclean bookings.

  - name: PreferredPro
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; the customer adding a favorite.
      - name: cleaner_id
        type: string
        source: input
        description: FK -> Cleaner.id; the favorited pro.
      - name: priority
        type: integer
        source: input
        description: |
          Lower number = higher preference. Used as the primary sort key when the
          auto-assignment selector chooses among a customer's preferred pros.
        constraints: ">= 1"

  - name: Tip
    parent: null
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id; the COMPLETED booking being tipped.
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; tipper (must own the booking).
      - name: cleaner_id
        type: string
        source: system
        description: FK -> Cleaner.id; the booking's assigned cleaner, copied at tip creation.
      - name: amount_cents
        type: integer
        source: input
        description: Tip amount in cents.
        constraints: "> 0"

  - name: CleanerPayout
    parent: null
    common_fields: true
    fields:
      - name: cleaner_id
        type: string
        source: input
        description: FK -> Cleaner.id; payee.
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id; the COMPLETED booking generating this payout.
      - name: base_payout_cents
        type: integer
        source: computed
        description: |
          Cleaner's share of the visit price (commission split), computed by
          cleaner_payout at booking completion.
      - name: tip_cents
        type: integer
        source: computed
        description: |
          Tip portion attached to this payout; recomputed when a Tip is created
          for the same booking. Kept consistent with the booking's tip.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: base_payout_cents + tip_cents. Conserved against ledger; see §1.3.

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; the customer whose balance this entry moves.
      - name: booking_id
        type: string
        source: system
        description: FK -> Booking.id; originating booking, null for non-booking adjustments.
      - name: kind
        type: enum
        source: input
        description: |
          CHARGE (debit customer), REFUND (credit customer), RECLEAN_CREDIT
          (credit for guarantee), CHANGE_FEE (debit window fee).
        constraints: "in {CHARGE, REFUND, RECLEAN_CREDIT, CHANGE_FEE}"
      - name: amount_cents
        type: integer
        source: input
        description: |
          Signed amount in cents applied to the customer's wallet_credit_cents
          balance interplay; positive = credit to customer, negative = debit.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Cleaner
    initial_state: APPLIED
    terminal_states: [CHECK_FAILED]
    transitions:
      - from: APPLIED
        to: CHECK_PENDING
        trigger: "POST /cleaners/{id}/background-checks"
        actor: PlatformAdmin
        preconditions:
          - "cleaner.status == APPLIED"
        side_effects:
          - "create BackgroundCheck{cleaner_id, result=PENDING}"
          - "increments Cleaner.version by 1"
        note: "Forks the onboarding branch; adjudication decides CHECK_PASSED vs CHECK_FAILED."
      - from: CHECK_PENDING
        to: CHECK_PASSED
        trigger: "POST /background-checks/{id}/adjudicate (result=CLEAR)"
        actor: PlatformAdmin
        preconditions:
          - "cleaner.status == CHECK_PENDING"
          - "the cleaner's BackgroundCheck.result == PENDING at call time"
        side_effects:
          - "set BackgroundCheck.result=CLEAR, BackgroundCheck.adjudicated_at=now"
          - "increments Cleaner.version by 1"
      - from: CHECK_PENDING
        to: CHECK_FAILED
        trigger: "POST /background-checks/{id}/adjudicate (result=ADVERSE)"
        actor: PlatformAdmin
        preconditions:
          - "cleaner.status == CHECK_PENDING"
          - "the cleaner's BackgroundCheck.result == PENDING at call time"
        side_effects:
          - "set BackgroundCheck.result=ADVERSE, BackgroundCheck.adjudicated_at=now"
          - "increments Cleaner.version by 1"
        note: "Terminal failure branch; a CHECK_FAILED cleaner can never be activated."
      - from: CHECK_PASSED
        to: ACTIVE
        trigger: "POST /cleaners/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "cleaner.status == CHECK_PASSED"
        side_effects:
          - "cleaner becomes eligible for assignment"
          - "increments Cleaner.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cleaners/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "cleaner.status == ACTIVE"
        side_effects:
          - "cleaner removed from the assignable pool"
          - "increments Cleaner.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cleaners/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "cleaner.status == SUSPENDED"
        side_effects:
          - "cleaner re-enters the assignable pool"
          - "increments Cleaner.version by 1"
        note: "Reinstatement loop ACTIVE->SUSPENDED->ACTIVE; distinct from terminal CHECK_FAILED."

  - entity: BookingSeries
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /booking-series/{id}/generate"
        actor: PlatformAdmin
        preconditions:
          - "series.status == ACTIVE"
          - "series.next_occurrence_date <= current clock"
        side_effects:
          - "create Booking{series_id=series.id, scheduled_start=series.next_occurrence_date, add_ons=series.add_ons, supplies_provided_by=series.supplies_provided_by} in SCHEDULED"
          - "assign cleaner via preferred_cleaner_id pin or auto-assignment selector (§1.3 assign_cleaner)"
          - "run price_quote and pin the new Booking.quoted_price_cents"
          - "create LedgerEntry{kind=CHARGE} and debit Customer.wallet_credit_cents then accrue remainder"
          - "advance series.next_occurrence_date by cadence step (WEEKLY=+7d, BIWEEKLY=+14d)"
          - "increments BookingSeries.version by 1"
        note: "Self-loop occurrence generation; the only non-terminal cycle on the series."
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /booking-series/{id}/pause"
        actor: Customer
        preconditions:
          - "series.status == ACTIVE"
        side_effects:
          - "no further occurrences generated while PAUSED"
          - "increments BookingSeries.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /booking-series/{id}/resume"
        actor: Customer
        preconditions:
          - "series.status == PAUSED"
        side_effects:
          - "generation re-enabled from current next_occurrence_date"
          - "increments BookingSeries.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /booking-series/{id}/cancel"
        actor: Customer
        preconditions:
          - "series.status in {ACTIVE, PAUSED}"
        side_effects:
          - "cascade: every child Booking still in {SCHEDULED, RESCHEDULED} is cancelled (Booking SCHEDULED/RESCHEDULED -> CANCELLED), which itself runs each booking's cancellation refund/fee (transitive, see §1.4)"
          - "set series.next_occurrence_date=null"
          - "increments BookingSeries.version by 1"
        note: "Cascade-down to non-terminal children; COMPLETED/CANCELLED children untouched."
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /booking-series/{id}/cancel"
        actor: Customer
        preconditions:
          - "series.status in {ACTIVE, PAUSED}"
        side_effects:
          - "cascade: every child Booking still in {SCHEDULED, RESCHEDULED} is cancelled"
          - "set series.next_occurrence_date=null"
          - "increments BookingSeries.version by 1"

  - entity: Booking
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, RECLEAN_SCHEDULED]
    transitions:
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /bookings/{id}/reschedule"
        actor: Customer
        preconditions:
          - "booking.status in {SCHEDULED, RESCHEDULED}"
          - "the assigned cleaner (if pinned) serves the address postal_code"
        side_effects:
          - "compute change_fee_cents via reschedule_or_cancel_fee (RESCHEDULE branch) against hours-to-start"
          - "if change_fee_cents > 0: create LedgerEntry{kind=CHANGE_FEE, amount_cents=-change_fee_cents} and debit customer"
          - "set booking.scheduled_start to the new instant"
          - "re-run price_quote (re-pin quoted_price_cents if add-ons/supplies changed)"
          - "increments Booking.version by 1"
        note: "Revision loop: RESCHEDULED can reschedule again, returning to RESCHEDULED."
      - from: RESCHEDULED
        to: RESCHEDULED
        trigger: "POST /bookings/{id}/reschedule"
        actor: Customer
        preconditions:
          - "booking.status in {SCHEDULED, RESCHEDULED}"
        side_effects:
          - "same as SCHEDULED->RESCHEDULED"
          - "increments Booking.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: Cleaner
        preconditions:
          - "booking.status in {SCHEDULED, RESCHEDULED}"
          - "booking.cleaner_id == acting cleaner id"
          - "current clock >= booking.scheduled_start"
        side_effects:
          - "compute cleaner_payout and create CleanerPayout{booking_id, base_payout_cents, tip_cents=0}"
          - "if not is_reclean: increment Customer.lifetime_booking_count by 1 and Cleaner.completed_job_count by 1"
          - "increments Booking.version by 1"
      - from: RESCHEDULED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: Cleaner
        preconditions:
          - "booking.status in {SCHEDULED, RESCHEDULED}"
          - "booking.cleaner_id == acting cleaner id"
          - "current clock >= booking.scheduled_start"
        side_effects:
          - "same as SCHEDULED->COMPLETED"
          - "increments Booking.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Customer
        preconditions:
          - "booking.status in {SCHEDULED, RESCHEDULED}"
        side_effects:
          - "compute change_fee_cents via reschedule_or_cancel_fee (CANCEL branch)"
          - "create LedgerEntry{kind=REFUND, amount_cents=quoted_price_cents} crediting the customer wallet for the un-rendered visit"
          - "if change_fee_cents > 0: create LedgerEntry{kind=CHANGE_FEE, amount_cents=-change_fee_cents} debiting the customer; net refund = quoted_price_cents - change_fee_cents"
          - "increments Booking.version by 1"
        note: "Compensation: refund conserves the customer charge minus the window fee (§1.3 ledger invariant)."
      - from: RESCHEDULED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Customer
        preconditions:
          - "booking.status in {SCHEDULED, RESCHEDULED}"
        side_effects:
          - "same as SCHEDULED->CANCELLED"
          - "increments Booking.version by 1"
      - from: COMPLETED
        to: RECLEAN_REQUESTED
        trigger: "POST /bookings/{id}/request-reclean"
        actor: Customer
        preconditions:
          - "booking.status == COMPLETED"
          - "booking.is_reclean == false (a reclean cannot itself be recleaned)"
          - "current clock <= booking complete time + RECLEAN_WINDOW_HOURS"
        side_effects:
          - "increments Booking.version by 1"
        note: "Guarantee branch entry; opens the window for a free reclean."
      - from: RECLEAN_REQUESTED
        to: RECLEAN_SCHEDULED
        trigger: "POST /bookings/{id}/schedule-reclean"
        actor: PlatformAdmin
        preconditions:
          - "booking.status == RECLEAN_REQUESTED"
        side_effects:
          - "create Booking{reclean_of_booking_id=this.id, is_reclean=true, quoted_price_cents=0, cleaner_id=this.cleaner_id, status=SCHEDULED}"
          - "transitive: the new reclean Booking's creation runs assign_cleaner (pinned to original cleaner) and creates a LedgerEntry{kind=RECLEAN_CREDIT, amount_cents=0} marker; no customer charge"
          - "increments Booking.version by 1"
        note: "Branch divergence: COMPLETED -> {RECLEAN_REQUESTED -> RECLEAN_SCHEDULED} carries a different side-effect set than COMPLETED steady state."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: series-generate-stale-series
    parent_entity: BookingSeries
    write_endpoint: "POST /booking-series/{id}/generate"
    occ_field: "expected_series_version"
    description: |
      Generating an occurrence against a BookingSeries whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A prior generate call legitimately created a Booking, advanced
      next_occurrence_date, and bumped the series version; a second generate that
      still carries the previously observed version is therefore acting on a stale
      view of the series and must be refused so the same occurrence date is not
      double-generated.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-activate-stale-plan
    parent_entity: PricingPlan
    write_endpoint: "POST /pricing-plans/{id}/activate"
    occ_field: "expected_plan_version"
    description: |
      Activating a PricingPlan whose version has advanced since the client last
      read it is rejected. Activation deactivates the prior active plan and bumps
      this plan's version; a second activation carrying the stale version is
      refused so the single-active-plan invariant is resolved deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: price_quote
    trigger: "Booking creation (POST /bookings), series generation, and reschedule re-pin"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (mode (c): fee/discount keyed off a tier
      # derived from the running subtotal — order must be explicit).
      if booking.is_reclean: return 0
      base = pricing_plan.base_price_cents[booking.home_size]      # home-size band
      surcharge = 0
      if "DEEP_CLEAN" in add_ons: surcharge += round_half_up(base * deep_clean_surcharge_pct)
      if "MOVE_OUT"   in add_ons: surcharge += round_half_up(base * move_out_surcharge_pct)
      supplies = pricing_plan.supplies_fee_cents if supplies_provided_by == "CLEANER" else 0
      subtotal = base + surcharge + supplies
      # Loyalty discount tier is keyed off the customer's lifetime_booking_count
      # AT QUOTE TIME (this is the circular-looking dependency: the discount is a
      # function of a tier, the tier is a function of count, and the count is read
      # once, before this booking completes — never including the in-flight booking).
      tier_pct = loyalty_tier_pct(customer.lifetime_booking_count)   # see constants
      discount = round_half_up(subtotal * tier_pct)
      priced = subtotal - discount
      # Move-out floor: a MOVE_OUT visit never quotes below MOVE_OUT_MINIMUM_CENTS.
      if "MOVE_OUT" in add_ons: priced = max(priced, MOVE_OUT_MINIMUM_CENTS)
      return priced
    input_set: |
      Single booking: its home_size snapshot, its add_ons, its supplies_provided_by,
      its pinned pricing_plan, and the owning customer's lifetime_booking_count read
      at quote time (the in-flight booking is NOT counted toward its own tier).
    constants:
      LOYALTY_TIERS: "count<5 -> 0.00; 5<=count<15 -> 0.05; 15<=count<40 -> 0.10; count>=40 -> 0.15"
      MOVE_OUT_MINIMUM_CENTS: 20000
    precision: "cents are integers; each surcharge and the discount are round_half_up to whole cents BEFORE summing (per-component rounding, not sum-then-round)"
    variants:
      - name: one_time_quote
        when: "booking.series_id is null"
        difference: "loyalty tier read from the customer's current lifetime_booking_count at the single POST /bookings instant"
      - name: series_occurrence_quote
        when: "booking generated from a series"
        difference: |
          loyalty tier read at the generation instant — because the customer's
          lifetime_booking_count grows as earlier occurrences complete, two
          occurrences of the same series can quote different prices.

  - name: reschedule_or_cancel_fee
    trigger: "POST /bookings/{id}/reschedule and POST /bookings/{id}/cancel"
    algorithm: threshold
    formula: |
      hours_to_start = (booking.scheduled_start - current_clock) / 3600
      # Boundary is INCLUSIVE on the free side: exactly FREE_CANCEL_HOURS away => no fee.
      if hours_to_start >= FREE_CANCEL_HOURS: return 0                      # outside window
      if hours_to_start >= LATE_CANCEL_HOURS:                              # inside late band
          if action == RESCHEDULE: return RESCHEDULE_FEE_CENTS
          else:                    return round_half_up(booking.quoted_price_cents * LATE_CANCEL_PCT)
      # Inside the no-show band (hours_to_start < LATE_CANCEL_HOURS, includes past-start)
      if action == RESCHEDULE: return RESCHEDULE_FEE_CENTS
      else:                    return round_half_up(booking.quoted_price_cents * NOSHOW_CANCEL_PCT)
    input_set: "the single booking, its quoted_price_cents, and the clock at call time"
    constants:
      FREE_CANCEL_HOURS: 48
      LATE_CANCEL_HOURS: 12
      RESCHEDULE_FEE_CENTS: 1500
      LATE_CANCEL_PCT: 0.25
      NOSHOW_CANCEL_PCT: 0.50
    precision: "2 decimal places of a percent applied to integer cents, round_half_up"
    variants:
      - name: reschedule_fee
        when: "action == RESCHEDULE"
        difference: "flat RESCHEDULE_FEE_CENTS inside any fee band; never a percentage"
      - name: cancel_fee
        when: "action == CANCEL"
        difference: "percentage of quoted_price_cents that escalates from LATE_CANCEL_PCT to NOSHOW_CANCEL_PCT as start nears"

  - name: cleaner_payout
    trigger: "Booking SCHEDULED/RESCHEDULED -> COMPLETED (POST /bookings/{id}/complete)"
    algorithm: aggregation
    formula: |
      # Commission split: cleaner keeps PAYOUT_PCT of the visit price.
      base_payout_cents = round_half_up(booking.quoted_price_cents * PAYOUT_PCT)
      tip_cents = 0   # set/recomputed by tip_attach when a Tip lands
      total_cents = base_payout_cents + tip_cents
    input_set: "the single COMPLETED booking's quoted_price_cents plus any later Tip for the same booking"
    constants:
      PAYOUT_PCT: 0.70
    precision: "round_half_up to whole cents"
    variants:
      - name: reclean_payout
        when: "booking.is_reclean == true"
        difference: "quoted_price_cents is 0, so base_payout_cents is 0; the cleaner is not paid again for a guarantee reclean"

  - name: tip_attach
    trigger: "POST /tips creating a Tip for a COMPLETED booking"
    algorithm: aggregation
    formula: |
      # Recompute the booking's existing CleanerPayout to fold in the tip.
      payout = CleanerPayout where booking_id == tip.booking_id
      payout.tip_cents = tip.amount_cents
      payout.total_cents = payout.base_payout_cents + payout.tip_cents
    input_set: "the single Tip and the single CleanerPayout that shares its booking_id"
    constants: {}
    precision: "integer cents; no rounding (tip is already integer cents)"
    variants:
      - name: first_tip
        when: "no prior Tip exists for the booking"
        difference: "tip_cents moves from 0 to amount_cents; a second tip on the same booking is rejected by §1.4"

  - name: assign_cleaner
    trigger: "Booking creation/generation when no explicit cleaner is pinned"
    algorithm: weighted_scoring
    formula: |
      # Eligibility filter (candidate set): Cleaner.status == ACTIVE
      #   AND booking.address postal_code in cleaner.service_postal_codes.
      candidates = [c for c in Cleaners
                    if c.status == "ACTIVE"
                    and booking_postal_code in c.service_postal_codes]
      # If the customer has PreferredPro rows whose cleaner is in candidates,
      # restrict to those first.
      preferred = [c for c in candidates if exists PreferredPro(customer_id, c.id)]
      pool = preferred if preferred else candidates
      if not pool: -> ERR_NO_CLEANER_AVAILABLE
      # Ranking (over entity fields only; id never used):
      #   1. PreferredPro.priority ASC   (only when pool == preferred; lower = better)
      #   2. average_rating DESC          (rating_sum / rating_count; 0 when rating_count==0)
      #   3. completed_job_count DESC
      #   4. created_at ASC               (deterministic common-field tie-break; never id)
      return first(sort(pool, by the keys above))
    input_set: "all Cleaners (filtered to ACTIVE + serving the postal code) and the customer's PreferredPro rows"
    constants: {}
    precision: "average_rating compared as exact rational rating_sum/rating_count to avoid float ties"
    variants:
      - name: preferred_pin
        when: "BookingSeries.preferred_cleaner_id is set or POST /bookings supplies cleaner_id"
        difference: |
          selector is bypassed; the pinned cleaner is used if ACTIVE and serving the
          postal code. If the pin is not ACTIVE -> ERR_CLEANER_NOT_CLEARED; if the pin
          does not serve the postal code -> ERR_NO_CLEANER_AVAILABLE.
      - name: open_pool
        when: "no preferred pin and customer has no matching PreferredPro"
        difference: "ranking falls through to average_rating / completed_job_count / created_at over all ACTIVE serving cleaners"

  - name: visit_window
    trigger: "Booking creation, series generation, and reschedule (pins scheduled_end)"
    algorithm: interval_merge
    formula: |
      # Visit length is a fixed function of the snapshot home_size.
      duration = VISIT_MINUTES[booking.home_size]
      booking.scheduled_end = booking.scheduled_start + duration minutes
      # Half-open interval [scheduled_start, scheduled_end) is the resource occupation.
    input_set: "the single booking's home_size snapshot and scheduled_start"
    constants:
      VISIT_MINUTES: "STUDIO=90; ONE_BR=120; TWO_BR=150; THREE_BR=180; FOUR_PLUS_BR=240"
      TRAVEL_BUFFER_MIN: 30
      RECLEAN_WINDOW_HOURS: 72
    precision: "whole minutes; instants compared at second granularity"
    variants:
      - name: standard_visit
        when: "always"
        difference: "duration determined solely by home_size; add-ons do not change the interval length"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path/body id (customer_id, address_id, cleaner_id, booking_id, series_id, pricing_plan_id) resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "entity_backed actor owns the resource — acting Customer's X-User-ID equals the resource's customer_id; acting Cleaner's X-User-ID equals booking.cleaner_id"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "Customer/Cleaner resource mutations"

  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined (§1.2 from-set)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: |
      A cleaner pinned on a booking (POST /bookings cleaner_id, or
      BookingSeries.preferred_cleaner_id at generation) must have status == ACTIVE.
      A pinned cleaner who exists and serves the postal code but is not ACTIVE
      (e.g. SUSPENDED, or CHECK_PASSED but not yet activated) is rejected here —
      distinct from ERR_NO_CLEANER_AVAILABLE, which covers an empty candidate pool
      or a pin that does not serve the area.
    error_id: ERR_CLEANER_NOT_CLEARED
    http_status: 409
    applies_to: "POST /bookings, POST /booking-series/{id}/generate"

  - priority: 7
    category: business_referential
    check: "reclean may only be requested on a non-reclean COMPLETED booking, and a booking may have at most one open reclean (no second reclean of the same original)"
    error_id: ERR_RECLEAN_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /bookings/{id}/request-reclean, POST /bookings/{id}/schedule-reclean"

  - priority: 8
    category: business_temporal
    check: "reclean request must arrive within RECLEAN_WINDOW_HOURS of the booking's completion instant"
    error_id: ERR_RECLEAN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /bookings/{id}/request-reclean"

  - priority: 9
    category: business_constraint
    check: "MOVE_OUT add-on is not permitted on a recurring BookingSeries (one-time only)"
    error_id: ERR_ADDON_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /booking-series"

  - priority: 10
    category: business_constraint
    check: "a booking's address must not be archived; archived addresses cannot anchor a new booking or series"
    error_id: ERR_ADDRESS_ARCHIVED
    http_status: 409
    applies_to: "POST /bookings, POST /booking-series"

  - priority: 11
    category: business_constraint
    check: "assignment selector / pinned pro found no ACTIVE cleaner serving the address postal code"
    error_id: ERR_NO_CLEANER_AVAILABLE
    http_status: 409
    applies_to: "POST /bookings, POST /booking-series/{id}/generate"

  - priority: 12
    category: business_temporal
    check: |
      Cleaner double-booking: the assigned cleaner has no other non-terminal
      booking (status in {SCHEDULED, RESCHEDULED}) whose BUFFER-EXTENDED interval
      [scheduled_start - TRAVEL_BUFFER_MIN, scheduled_end + TRAVEL_BUFFER_MIN)
      overlaps this booking's half-open visit interval [scheduled_start,
      scheduled_end). Adjacency closer than TRAVEL_BUFFER_MIN counts as a
      collision (the cleaner needs travel time between jobs).
    error_id: ERR_CLEANER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /bookings, POST /booking-series/{id}/generate, POST /bookings/{id}/reschedule"

  - priority: 13
    category: business_temporal
    check: |
      Address double-booking: the service Address has no other non-terminal
      booking (status in {SCHEDULED, RESCHEDULED}) whose RAW half-open interval
      [scheduled_start, scheduled_end) overlaps this booking's half-open interval.
      Pure half-open geometry: back-to-back visits sharing exactly the boundary
      instant (gap == 0) do NOT collide; no travel buffer applies to a fixed location.
    error_id: ERR_ADDRESS_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /bookings, POST /booking-series/{id}/generate, POST /bookings/{id}/reschedule"

  - priority: 14
    category: business_referential
    check: "a tip may be created only on a COMPLETED booking, by its owning customer, and at most one tip per booking"
    error_id: ERR_TIP_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /tips"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /booking-series/{id}/generate, POST /pricing-plans/{id}/activate"

  - priority: 16
    category: business_constraint
    check: "request body field types/enums valid (home_size, cadence, add_ons subset, supplies_provided_by, amount_cents>0, priority>=1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Customers ---
  - method: POST
    path: "/cleaning/customers"
    description: "Register a customer."
    roles: [Anonymous]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: ["wallet_credit_cents initialized to 0", "lifetime_booking_count initialized to 0"]

  - method: GET
    path: "/cleaning/customers/{id}"
    description: "Read a customer (includes wallet_credit_cents, lifetime_booking_count)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/cleaning/customers/{id}/credit-adjustments"
    description: "Admin grants or revokes store credit (business admin surface for promos/comps)."
    roles: [PlatformAdmin]
    code: 201
    input: [amount_cents, "reason?"]
    output: Customer
    side_effects: ["adjust Customer.wallet_credit_cents by amount_cents (>=0 result)", "increments Customer.version by 1"]

  # --- Addresses ---
  - method: POST
    path: "/cleaning/addresses"
    description: "Create a service address for a customer."
    roles: [Customer]
    code: 201
    input: [customer_id, line1, postal_code, home_size]
    output: Address
    side_effects: []

  - method: GET
    path: "/cleaning/addresses/{id}"
    description: "Read an address."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Address
    side_effects: []

  - method: GET
    path: "/cleaning/addresses"
    description: "List addresses; filter by customer_id; archived excluded unless include_archived=true."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "include_archived?", "limit?", "offset?"]
    output: Address[]
    side_effects: []

  - method: POST
    path: "/cleaning/addresses/{id}/archive"
    description: "Soft-delete an address."
    roles: [Customer]
    code: 200
    input: []
    output: Address
    side_effects: ["set archived=true", "increments Address.version by 1"]

  # --- Cleaners & onboarding ---
  - method: POST
    path: "/cleaning/cleaners"
    description: "Register a cleaner applicant (status=APPLIED)."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, service_postal_codes]
    output: Cleaner
    side_effects: ["status set to APPLIED"]

  - method: GET
    path: "/cleaning/cleaners/{id}"
    description: "Read a cleaner."
    roles: [Cleaner, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Cleaner
    side_effects: []

  - method: GET
    path: "/cleaning/cleaners"
    description: "List cleaners; filter by status and serving postal_code."
    roles: [PlatformAdmin, Customer]
    code: 200
    input: ["status?", "postal_code?", "limit?", "offset?"]
    output: Cleaner[]
    side_effects: []

  - method: POST
    path: "/cleaning/cleaners/{id}/background-checks"
    description: "Open a background check; moves cleaner APPLIED -> CHECK_PENDING."
    roles: [PlatformAdmin]
    code: 201
    input: [provider_ref]
    output: BackgroundCheck
    side_effects: ["create BackgroundCheck(result=PENDING)", "cleaner -> CHECK_PENDING", "increments Cleaner.version by 1"]

  - method: GET
    path: "/cleaning/cleaners/{id}/background-checks"
    description: "Reverse-reachability: background checks for a cleaner."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BackgroundCheck[]
    side_effects: []

  - method: GET
    path: "/cleaning/background-checks/{id}"
    description: "Read a background check."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []

  - method: POST
    path: "/cleaning/background-checks/{id}/adjudicate"
    description: "Adjudicate CLEAR (-> cleaner CHECK_PASSED) or ADVERSE (-> cleaner CHECK_FAILED)."
    roles: [PlatformAdmin]
    code: 200
    input: [result]
    output: BackgroundCheck
    side_effects: ["set result + adjudicated_at", "cleaner -> CHECK_PASSED or CHECK_FAILED", "increments Cleaner.version by 1"]

  - method: POST
    path: "/cleaning/cleaners/{id}/activate"
    description: "Activate from CHECK_PASSED or reinstate from SUSPENDED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Cleaner
    side_effects: ["cleaner -> ACTIVE", "increments Cleaner.version by 1"]

  - method: POST
    path: "/cleaning/cleaners/{id}/suspend"
    description: "Suspend an ACTIVE cleaner."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Cleaner
    side_effects: ["cleaner -> SUSPENDED", "increments Cleaner.version by 1"]

  # --- Pricing plans ---
  - method: POST
    path: "/cleaning/pricing-plans"
    description: "Create a rate card (inactive)."
    roles: [PlatformAdmin]
    code: 201
    input: [name, base_price_cents, deep_clean_surcharge_pct, move_out_surcharge_pct, supplies_fee_cents]
    output: PricingPlan
    side_effects: ["active=false"]

  - method: GET
    path: "/cleaning/pricing-plans/{id}"
    description: "Read a pricing plan."
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: PricingPlan
    side_effects: []

  - method: POST
    path: "/cleaning/pricing-plans/{id}/activate"
    description: "Activate this plan; deactivates the prior active plan (OCC-guarded)."
    roles: [PlatformAdmin]
    code: 200
    input: [expected_plan_version]
    output: PricingPlan
    side_effects: ["active=true on this plan", "active=false on prior active plan", "increments PricingPlan.version by 1"]

  # --- Preferred pros ---
  - method: POST
    path: "/cleaning/preferred-pros"
    description: "Customer favorites a cleaner with a priority."
    roles: [Customer]
    code: 201
    input: [customer_id, cleaner_id, priority]
    output: PreferredPro
    side_effects: []

  - method: GET
    path: "/cleaning/preferred-pros/{id}"
    description: "Read a preferred-pro association."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: PreferredPro
    side_effects: []

  - method: GET
    path: "/cleaning/preferred-pros"
    description: "List preferred pros; filter by customer_id or cleaner_id (reverse-reachability)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "cleaner_id?", "limit?", "offset?"]
    output: PreferredPro[]
    side_effects: []

  # --- Booking series ---
  - method: POST
    path: "/cleaning/booking-series"
    description: "Create a recurring series (WEEKLY/BIWEEKLY)."
    roles: [Customer]
    code: 201
    input: [customer_id, address_id, pricing_plan_id, cadence, first_occurrence_date, "add_ons?", "supplies_provided_by?", "preferred_cleaner_id?"]
    output: BookingSeries
    side_effects: ["status=ACTIVE", "next_occurrence_date=first_occurrence_date"]

  - method: GET
    path: "/cleaning/booking-series/{id}"
    description: "Read a series."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: BookingSeries
    side_effects: []

  - method: GET
    path: "/cleaning/booking-series"
    description: "List series; filter by customer_id, address_id, pricing_plan_id, preferred_cleaner_id (reverse-reachability for all BookingSeries FKs)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "address_id?", "pricing_plan_id?", "preferred_cleaner_id?", "limit?", "offset?"]
    output: BookingSeries[]
    side_effects: []

  - method: POST
    path: "/cleaning/booking-series/{id}/generate"
    description: "Generate the next occurrence Booking (OCC-guarded on series.version)."
    roles: [PlatformAdmin]
    code: 201
    input: [expected_series_version]
    output: Booking
    side_effects: ["create Booking + assign + price + charge ledger", "advance next_occurrence_date by cadence", "increments BookingSeries.version by 1"]

  - method: POST
    path: "/cleaning/booking-series/{id}/pause"
    description: "Pause generation."
    roles: [Customer]
    code: 200
    input: []
    output: BookingSeries
    side_effects: ["status=PAUSED", "increments BookingSeries.version by 1"]

  - method: POST
    path: "/cleaning/booking-series/{id}/resume"
    description: "Resume generation."
    roles: [Customer]
    code: 200
    input: []
    output: BookingSeries
    side_effects: ["status=ACTIVE", "increments BookingSeries.version by 1"]

  - method: POST
    path: "/cleaning/booking-series/{id}/cancel"
    description: "Cancel series; cascade-cancels non-terminal child bookings."
    roles: [Customer]
    code: 200
    input: []
    output: BookingSeries
    side_effects: ["status=CANCELLED", "cascade child SCHEDULED/RESCHEDULED bookings -> CANCELLED (each with refund/fee)", "next_occurrence_date=null", "increments BookingSeries.version by 1"]

  # --- Bookings ---
  - method: POST
    path: "/cleaning/bookings"
    description: "Create a one-time booking; assigns cleaner, prices, charges customer."
    roles: [Customer]
    code: 201
    input: [customer_id, address_id, pricing_plan_id, scheduled_start, "add_ons?", "supplies_provided_by?", "cleaner_id?"]
    output: Booking
    side_effects: ["snapshot home_size", "assign_cleaner", "price_quote pins quoted_price_cents", "LedgerEntry CHARGE + wallet interplay"]

  - method: GET
    path: "/cleaning/bookings/{id}"
    description: "Read a booking."
    roles: [Customer, Cleaner, PlatformAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/cleaning/bookings"
    description: "List bookings; filter by customer_id, address_id, pricing_plan_id, cleaner_id, series_id, reclean_of_booking_id (reverse-reachability for all Booking FKs)."
    roles: [Customer, Cleaner, PlatformAdmin]
    code: 200
    input: ["customer_id?", "address_id?", "pricing_plan_id?", "cleaner_id?", "series_id?", "reclean_of_booking_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/cleaning/bookings/{id}/reschedule"
    description: "Move a SCHEDULED/RESCHEDULED booking; assesses window fee."
    roles: [Customer]
    code: 200
    input: [scheduled_start, "add_ons?", "supplies_provided_by?"]
    output: Booking
    side_effects: ["reschedule_or_cancel_fee (RESCHEDULE)", "re-pin quoted_price_cents", "status -> RESCHEDULED", "increments Booking.version by 1"]

  - method: POST
    path: "/cleaning/bookings/{id}/cancel"
    description: "Cancel a SCHEDULED/RESCHEDULED booking; refund minus window fee."
    roles: [Customer]
    code: 200
    input: []
    output: Booking
    side_effects: ["reschedule_or_cancel_fee (CANCEL)", "LedgerEntry REFUND + CHANGE_FEE", "status -> CANCELLED", "increments Booking.version by 1"]

  - method: POST
    path: "/cleaning/bookings/{id}/complete"
    description: "Cleaner marks the visit complete; creates payout, bumps loyalty counters."
    roles: [Cleaner]
    code: 200
    input: ["rating?"]
    output: Booking
    side_effects: ["cleaner_payout creates CleanerPayout", "if not reclean: lifetime_booking_count++ and completed_job_count++", "if rating: rating_sum/rating_count updated", "increments Booking.version by 1"]

  - method: POST
    path: "/cleaning/bookings/{id}/request-reclean"
    description: "Customer requests a guarantee reclean within the window."
    roles: [Customer]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> RECLEAN_REQUESTED", "increments Booking.version by 1"]

  - method: POST
    path: "/cleaning/bookings/{id}/schedule-reclean"
    description: "Admin schedules the free reclean visit; spawns a 0-priced reclean Booking."
    roles: [PlatformAdmin]
    code: 200
    input: [scheduled_start]
    output: Booking
    side_effects: ["status -> RECLEAN_SCHEDULED", "create reclean Booking (is_reclean=true, quoted_price_cents=0)", "increments Booking.version by 1"]

  # --- Tips ---
  - method: POST
    path: "/cleaning/tips"
    description: "Customer tips the cleaner on a COMPLETED booking; folds into the payout."
    roles: [Customer]
    code: 201
    input: [booking_id, customer_id, amount_cents]
    output: Tip
    side_effects: ["copy cleaner_id from booking", "tip_attach recomputes CleanerPayout.tip_cents/total_cents"]

  - method: GET
    path: "/cleaning/tips/{id}"
    description: "Read a tip."
    roles: [Customer, Cleaner, PlatformAdmin]
    code: 200
    input: []
    output: Tip
    side_effects: []

  - method: GET
    path: "/cleaning/tips"
    description: "List tips; filter by booking_id, customer_id, cleaner_id (reverse-reachability for Tip FKs)."
    roles: [Customer, Cleaner, PlatformAdmin]
    code: 200
    input: ["booking_id?", "customer_id?", "cleaner_id?", "limit?", "offset?"]
    output: Tip[]
    side_effects: []

  # --- Payouts ---
  - method: GET
    path: "/cleaning/cleaner-payouts/{id}"
    description: "Read a payout."
    roles: [Cleaner, PlatformAdmin]
    code: 200
    input: []
    output: CleanerPayout
    side_effects: []

  - method: GET
    path: "/cleaning/cleaner-payouts"
    description: "List payouts; filter by cleaner_id or booking_id (reverse-reachability for CleanerPayout FKs)."
    roles: [Cleaner, PlatformAdmin]
    code: 200
    input: ["cleaner_id?", "booking_id?", "limit?", "offset?"]
    output: CleanerPayout[]
    side_effects: []

  # --- Ledger ---
  - method: GET
    path: "/cleaning/ledger-entries/{id}"
    description: "Read a ledger entry."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/cleaning/ledger-entries"
    description: "List ledger entries; filter by customer_id or booking_id (reverse-reachability for LedgerEntry FKs)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "booking_id?", "kind?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/cleaning/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; gates window-fee and reclean-window logic)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current_clock = to_iso8601"]

  # --- Test-driving loyalty seed ---
  - method: POST
    path: "/cleaning/_loyalty/set_count"
    description: "Set a customer's lifetime_booking_count directly (test-driving; seeds loyalty-tier states that would otherwise require completing many bookings)."
    roles: [PlatformAdmin]
    code: 200
    input: [customer_id, lifetime_booking_count]
    output: Customer
    side_effects: ["set Customer.lifetime_booking_count", "increments Customer.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role is not permitted to perform this operation."
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "Entity-backed actor does not own the targeted resource."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource id does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_CLEANER_NOT_CLEARED
    http: 409
    condition: "A cleaner pinned on a booking exists and serves the area but is not ACTIVE (e.g., SUSPENDED or not-yet-activated)."
  - id: ERR_RECLEAN_NOT_ELIGIBLE
    http: 409
    condition: "Reclean requested/scheduled on a reclean booking, a non-COMPLETED booking, or an original that already has an open reclean."
  - id: ERR_RECLEAN_WINDOW_CLOSED
    http: 409
    condition: "Reclean requested after RECLEAN_WINDOW_HOURS from completion."
  - id: ERR_ADDON_NOT_ALLOWED
    http: 422
    condition: "MOVE_OUT add-on supplied on a recurring BookingSeries."
  - id: ERR_ADDRESS_ARCHIVED
    http: 409
    condition: "Booking or series anchored on an archived address."
  - id: ERR_NO_CLEANER_AVAILABLE
    http: 409
    condition: "No ACTIVE cleaner serves the address postal code, or the pinned pro is ineligible."
  - id: ERR_CLEANER_DOUBLE_BOOKED
    http: 409
    condition: "Assigned cleaner's buffer-extended interval overlaps another of their non-terminal bookings."
  - id: ERR_ADDRESS_DOUBLE_BOOKED
    http: 409
    condition: "Address has another non-terminal booking whose raw half-open interval overlaps this one."
  - id: ERR_TIP_NOT_ALLOWED
    http: 409
    condition: "Tip on a non-COMPLETED booking, by a non-owner, or a second tip on the same booking."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Body field missing, wrong type, bad enum, or out-of-range numeric (amount_cents<=0, priority<1, add_ons not a subset)."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Anonymous
    description: "Unauthenticated self-registration surface."
    identity: opaque
    exclusive_operations:
      - "POST /cleaning/customers"
      - "POST /cleaning/cleaners"
    shared_operations: []

  - name: Customer
    description: "End user who books and pays for cleanings."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /cleaning/addresses"
      - "POST /cleaning/addresses/{id}/archive"
      - "POST /cleaning/preferred-pros"
      - "POST /cleaning/booking-series"
      - "POST /cleaning/booking-series/{id}/pause"
      - "POST /cleaning/booking-series/{id}/resume"
      - "POST /cleaning/booking-series/{id}/cancel"
      - "POST /cleaning/bookings"
      - "POST /cleaning/bookings/{id}/reschedule"
      - "POST /cleaning/bookings/{id}/cancel"
      - "POST /cleaning/bookings/{id}/request-reclean"
      - "POST /cleaning/tips"
    shared_operations:
      - "GET reads on own customers/addresses/bookings/booking-series/preferred-pros/tips/ledger-entries/pricing-plans/cleaners"

  - name: Cleaner
    description: "Service provider; completes visits, reads own payouts."
    identity: "entity_backed:Cleaner"
    exclusive_operations:
      - "POST /cleaning/bookings/{id}/complete"
    shared_operations:
      - "GET reads on own cleaner record, own bookings, own cleaner-payouts, own tips"

  - name: PlatformAdmin
    description: "Operator: onboarding, background checks, plan activation, series generation, reclean scheduling, clock."
    identity: opaque
    exclusive_operations:
      - "POST /cleaning/customers/{id}/credit-adjustments"
      - "POST /cleaning/cleaners/{id}/background-checks"
      - "POST /cleaning/background-checks/{id}/adjudicate"
      - "POST /cleaning/cleaners/{id}/activate"
      - "POST /cleaning/cleaners/{id}/suspend"
      - "POST /cleaning/pricing-plans"
      - "POST /cleaning/pricing-plans/{id}/activate"
      - "POST /cleaning/booking-series/{id}/generate"
      - "POST /cleaning/bookings/{id}/schedule-reclean"
      - "POST /cleaning/_clock/set_current_utc"
    shared_operations:
      - "GET reads on all collections"
