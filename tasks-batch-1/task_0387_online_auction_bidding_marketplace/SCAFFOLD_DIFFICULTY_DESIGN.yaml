              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${a_id}", max_proxy_cents: 10000 }
              as: Buyer
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${bb_id}", max_proxy_cents: 10500 }
              as: Buyer
              as_user_id: "${bb_id}"
              captures: { bid_b: $.data.id }
          assert:
            - "Bid.${bid_b}.status == ACCEPTED"
            - "Bid.${bid_b}.is_winning == true"
            - "Listing.${lst_id}.current_price_cents == 10500"

      - name: snipe_extension_window_edge   # temporal-seconds boundary <= on /bids effective_end_at
        grounds:
          - calculations.snipe_extension
          - entities.Listing.fields.effective_end_at
          - state_machines.Listing.ACTIVE_to_ENDED_MET
        distinguishing_aspect: |
          A DIFFERENT metric (remaining-seconds-to-close, reachable through the same bid endpoint but distinct
          from the cents threshold above): a bid placed when remaining == SNIPE_TRIGGER_SECONDS (300) sits exactly
          on the inclusive edge and MUST push effective_end_at to current_clock + 300. With end at
          2026-06-10T00:05:00Z and clock set to 2026-06-10T00:00:00Z (remaining 300), the new effective_end_at
          becomes 2026-06-10T00:05:00Z (clock+300), not a stacked sum.
        test_recipe:
          setup:
            - "Seller S publishes AUCTION start 10000 ending 2026-06-10T00:05:00Z; clock advanced to 2026-06-10T00:00:00Z (remaining 300s)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s12@x.com", display_name: "S12", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
