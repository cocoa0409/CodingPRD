      - name: checkout_copy_unavailable_beats_loan_limit
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_COPY_NOT_AVAILABLE]
          - errors[ERR_LOAN_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_safety (priority 8, ERR_COPY_NOT_AVAILABLE) vs
          business_constraint (priority 13, ERR_LOAN_LIMIT_EXCEEDED): a member already at
          max_active_loans=1 checking out a copy that is NEEDS_MAINTENANCE fails both; the
          safety error wins, so error_id==ERR_COPY_NOT_AVAILABLE.
        test_recipe:
          setup:
            - "Member with max_active_loans=1 already holding one ACTIVE loan on copyA; copyB of the same item is NEEDS_MAINTENANCE via a manual ticket; clock 2026-03-01."
