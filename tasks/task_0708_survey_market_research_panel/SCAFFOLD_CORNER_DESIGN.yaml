      # --- attention-checks sub-resource reverse-reachability ---
      - name: list_attention_checks_for_participation
        claim_type: Cross-reference link
        grounds:
          - entities.AttentionCheck.fields.participation_id
          - endpoints
        distinguishing_aspect: "GET /participations/{id}/attention-checks returns the AttentionChecks for that participation (sub-resource reverse-reachability for AttentionCheck.participation_id)."
        test_recipe:
          setup: ["A participation with one recorded attention check."]
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "AC", irb_protocol_number: "IRB-AC", estimated_minutes: 10, base_incentive_points: 50, screener_min_age: 0 }
              as: ResearchManager
              captures: { sid: $.data.id }
            - call: "POST /studies/${sid}/quota-cells"
              payload: { segment_key: "SEG_AC", target_n: 2 }
              as: ResearchManager
              captures: { cid: $.data.id }
            - call: "POST /studies/${sid}/launch"
