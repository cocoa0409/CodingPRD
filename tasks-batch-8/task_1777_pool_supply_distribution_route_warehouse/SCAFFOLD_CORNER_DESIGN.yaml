      - name: occ_stale_lot_version_on_manual_allocate
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[backorder-allocate-stale-lot]", "errors[ERR_STALE_LOT_VERSION]"]
        distinguishing_aspect: "Manual allocate carrying a lot version observed before a subsequent replenish + order-confirm reservation advanced it is rejected with 412 ERR_STALE_LOT_VERSION; per the rule's pinned endpoint precedence (state → OCC → business qty), the stale version is reported even though the lot is also empty."
        test_recipe:
          setup:
            - "branch; account; PARTS product with shortage_freeze_threshold 1000; lot L qty 0"
            - "Order1 qty 4 confirmed → BO1 OPEN(4); lot version captured as v_stale"
            - "Replenish L by 6 → sweep grants 4 to BO1 (CLOSED), lot available 2, version advanced"
            - "Order2 qty 3 confirmed → allocates the remaining 2, BO2 OPEN(1), lot available 0, version advanced again"
            - "At trigger time BO2 is OPEN (state precondition passes); OCC observes the stale version and fires before the ERR_LOT_EMPTY business check"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: false, peak_season_start: "04-01", peak_season_end: "09-30" }
