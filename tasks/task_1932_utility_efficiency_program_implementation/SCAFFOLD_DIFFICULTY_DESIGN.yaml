  # ===========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: project_approve_requires_program_active
        grounds:
          - state_machines.Project.PROPOSED_to_APPROVED
          - entities.Program.fields.status
        distinguishing_aspect: |
          Project's PROPOSED -> APPROVED transition depends on Program.status == ACTIVE.
          Suspended or DRAFT program blocks project approval. Pair: Project -> Program.
        test_recipe:
          setup:
            - "Program in SUSPENDED state"
            - "Project in PROPOSED"
          setup_api_calls:
