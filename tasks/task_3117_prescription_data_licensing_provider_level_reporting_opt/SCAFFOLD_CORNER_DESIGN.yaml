            - "GET /data-acquisition-agreements/${ag_id} still shows status DRAFT"

      - name: data_acquisition_manager_cannot_verify_optout
        claim_type: RBAC Denial
        grounds:
          - roles.PrivacyOfficer
          - endpoints.POST_/prescriber-opt-outs/{id}/verify
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Segregation of duties: the acquisition role cannot perform the privacy role's opt-out verify — 403 ERR_UNAUTHORIZED_ROLE and the opt-out stays SUBMITTED."
        test_recipe:
          setup:
            - "Prescriber with a SUBMITTED opt-out."
          setup_api_calls:
