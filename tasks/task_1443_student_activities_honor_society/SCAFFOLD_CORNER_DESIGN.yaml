  # ============================================================
  # Section: cross_cutting_complexity_layers
  # ============================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_member_dismiss_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[member-dismiss-stale-member]", "errors[ERR_STALE_MEMBER_VERSION]"]
        distinguishing_aspect: "dismiss with stale expected_member_version returns 412 ERR_STALE_MEMBER_VERSION"
        test_recipe:
          setup: ["Chapter ACTIVE; Member with probation_strikes=2"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "OCC M High", charter_number: "NHS-127", advisor_user_id: "adv_127", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
            - call: "POST /chapters/${ch_id}/activate"
              payload: {}
              as: ActivitiesDirector
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "S3101", full_name: "S", email: "s@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
              as: Advisor
              captures: { m_id: $.data.id, m_v_orig: $.data.version }
            # Two confirmed probation cases => strikes=2
            - call: "POST /chapters/${ch_id}/members/${m_id}/probation-cases"
              payload: { opened_by_user_id: "adv_127", reason_code: "CONDUCT_VIOLATION", evidence_text: "x1" }
              as: Advisor
              captures: { pc1: $.data.id }
            - call: "POST /chapters/${ch_id}/members/${m_id}/probation-cases/${pc1}/resolve"
              payload: { outcome: "STANDARDS_VIOLATION_CONFIRMED", probation_end_date: "2026-12-01T00:00:00Z" }
              as: Advisor
            # Wait until probation ends, reinstate, then add second case
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters/${ch_id}/members/${m_id}/reinstate"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/members/${m_id}/probation-cases"
              payload: { opened_by_user_id: "adv_127", reason_code: "CONDUCT_VIOLATION", evidence_text: "x2" }
              as: Advisor
              captures: { pc2: $.data.id }
            - call: "POST /chapters/${ch_id}/members/${m_id}/probation-cases/${pc2}/resolve"
              payload: { outcome: "STANDARDS_VIOLATION_CONFIRMED", probation_end_date: "2027-03-01T00:00:00Z" }
              as: Advisor
          trigger:
            # Use the original version (now stale)
            - call: "POST /chapters/${ch_id}/members/${m_id}/dismiss"
              payload: { expected_member_version: "${m_v_orig}" }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "error_id == ERR_STALE_MEMBER_VERSION"

