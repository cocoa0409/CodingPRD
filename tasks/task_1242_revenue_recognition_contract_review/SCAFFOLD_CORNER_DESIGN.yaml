              as_user_id: "mgr-1"
          assert:
            - "different customers -> error_id == ERR_COMBINATION_CRITERIA_NOT_MET, http 422"
            - "same customer with neither side package-flagged would also fail; here C1 carries the flag so absorbing C1 into C3 succeeds (C1 ABSORBED, C3 fixed 170000) — the criterion is OR over the pair"

