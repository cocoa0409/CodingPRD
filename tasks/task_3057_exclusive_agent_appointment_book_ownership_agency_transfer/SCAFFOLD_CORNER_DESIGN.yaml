  - name: dual_failure_auth_precedes_existence
    claim_type: Priority Ordering
    grounds:
    - validations[priority=1]
    - validations[priority=3]
    - errors[ERR_UNAUTHENTICATED]
    - errors[ERR_AGENCY_NOT_FOUND]
    distinguishing_aspect: When a request both lacks the auth header and targets a missing agency, the priority-1 auth error wins over the priority-3 existence error.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. No agency created."
