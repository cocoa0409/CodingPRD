  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_overlap_half_open_backtoback_allowed_overlap_rejected
        grounds:
          - validations[priority=25]
          - calculations.project_run_window
          - entities.ProductionRun.fields.scheduled_end
        distinguishing_aspect: |
          ProductionLine interval semantics: [start, end) HALF-OPEN. A second run whose
          start equals the first's scheduled_end (back-to-back) is ACCEPTED; a run that
          starts one minute before the first's end is REJECTED with ERR_LINE_OVERLAP.
          With rated 50 u/h and 100 units, the first run window is 08:00-10:00 (no
          changeover, equal profiles).
        test_recipe:
          setup:
            - "Run1 SCHEDULED on Line A 08:00 (window 08:00-10:00); Crew uses huge buffer-free crews per run so crew never collides"
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cust_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { pouch_id: $.data.id }
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cust_id}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_id}", qty_per_unit: 2, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id }
            - call: "POST /copack/crews"
              payload: { name: "Crew 1", rest_buffer_minutes: 0 }
              as: Scheduler
              captures: { crew1: $.data.id }
            - call: "POST /copack/crews"
              payload: { name: "Crew 2", rest_buffer_minutes: 0 }
              as: Scheduler
              captures: { crew2: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew1}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run1: $.data.id }
          trigger:
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew2}", planned_units: 100, scheduled_start: "2026-06-01T10:00:00Z" }
              as: Scheduler
              captures: { run2: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew2}", planned_units: 100, scheduled_start: "2026-06-01T09:59:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "back-to-back run2 created (201) with scheduled_start == 2026-06-01T10:00:00.000Z"
            - "overlapping run at 09:59 rejected with error_id == ERR_LINE_OVERLAP (409)"

      - name: crew_overlap_closed_buffer_rejects_backtoback
        grounds:
          - validations[priority=26]
          - entities.Crew.fields.rest_buffer_minutes
          - calculations.project_run_window
        distinguishing_aspect: |
          Crew interval semantics differ from the line: the crew window is CLOSED and
          buffer-padded by rest_buffer_minutes=15 on BOTH sides, so a second run on the
          same crew that is exactly back-to-back on the LINE (start == run1.end) still
          collides on the crew (it falls inside [run1.start-15m, run1.end+15m]) and is
          rejected with ERR_CREW_OVERLAP — different resource entity, different geometry.
        test_recipe:
          setup:
            - "Run1 SCHEDULED on Line A 08:00-10:00 with Day Crew (rest 15m); second run on a different line but same crew at 10:00"
          setup_api_calls:
