            - "Call 4: HTTP 400 with ${err1} == \"ERR_INVALID_REQUEST\" - FINAL_CANVASS is a reconciliation basis, not a layout basis, and an unrecognized enum value is rejected instead of falling back to the default."
            - "None of the four reads mutates anything: BallotStyle.${st}.version is unchanged across the four calls."

