# =============================================================================
# PRD Benchmark Scaffold — task_2317_digital_ticket_access_control_fraud
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in the
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "2317. Digital Ticket Access Control & Fraud Prevention (venue ticketing operations): ticket issuance with rotating barcodes and device binding to reduce screenshot fraud, transfer and resale controls with limits, verified resale marketplaces and price caps where required, scan-in operations with gate throughput planning, offline scanning fallback and duplicate scan handling, will-call, complimentary and credential distribution with approval workflows and audit trail, counterfeit and unauthorized resale detection with denied-entry procedures and customer remediation, capacity and occupancy monitoring against fire code with real-time counts, access zone enforcement for premium areas and back-of-house credentials, post-event scan reconciliation with reported attendance"

domain_name: "ticket-access-control"

# Flat topology: every entity is a top-level collection (`/events`, `/tickets`,
# `/scan-events`, …) linked by foreign keys rather than by URL nesting, so the
# api_prefix is the server root and each §1.5 path carries its own collection.
api_prefix: ""

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: event_sourcing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: parallel        # Ticket carries two independent state dimensions; CredentialRequest adds a revision cycle, DeniedEntryIncident a fork-join
  relationship_patterns:
    - one_to_many
    - self_referential                # ResaleListing.superseded_listing_id -> ResaleListing.id
    - polymorphic                     # AuditLogEntry.subject_type + subject_id
    - cross_aggregate                 # ScanEvent -> Ticket (admission aggregate) and -> ScanSession (gate aggregate)
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: "expert_plus"     # 13 entities / 59 endpoints / 41 validations / 53 errors / 12 calculations / 10 state machines / 6 roles

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
  pagination_envelope_location: |
    On every list endpoint `data` is the JSON array of rows and the four pagination
    fields are siblings of `data` inside `meta`, so a client reads
    `$.meta.total_count`, `$.meta.has_more`, `$.meta.limit` and `$.meta.offset`
    while the rows themselves are `$.data[0]`, `$.data[1]`, ... `total_count` is the
    count of rows matching the filters BEFORE limit/offset are applied, and
    `has_more` is `offset + len(data) < total_count`.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Event title as printed on tickets
      - name: venue_name
        type: string
        source: input
        description: Venue the event is staged at
      - name: fire_code_capacity
        type: integer
        source: input
        description: Venue-wide fire-code occupancy ceiling for this event
        constraints: ">= 1"
      - name: barcode_anchor_at
        type: datetime
        source: input
        description: Epoch-0 anchor instant for rotating-barcode index computation (see calculations.rotating_barcode_token)
      - name: doors_open_at
        type: datetime
        source: input
        description: Advertised doors-open instant, used for gate-throughput projections
      - name: event_start_at
        type: datetime
        source: input
        description: Advertised start instant
      - name: transfer_window_closes_at
        type: datetime
        source: input
        description: Instant after which no TransferRequest may be created or accepted
      - name: price_cap_regime
        type: enum
        source: input
        description: Which resale price-cap rule applies to this event
        default: VENUE_POLICY
        constraints: "one of {STATUTORY, VENUE_POLICY, NONE}"
      - name: transfer_limit_per_ticket
        type: integer
        source: input
        description: Maximum accepted transfers allowed on any single Ticket of this event
        default: 2
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Operational lifecycle of the event
        default: DRAFT
        constraints: "one of {DRAFT, ON_SALE, DOORS_OPEN, IN_PROGRESS, CLOSED, RECONCILED}"
      - name: live_occupancy
        type: integer
        source: computed
        description: Real-time head count from ONLINE scan events only (calculations.live_occupancy variant GATE_LIVE)
        default: 0
      - name: peak_live_occupancy
        type: integer
        source: computed
        description: Highest value live_occupancy has reached since event creation
        default: 0
      - name: entitlements_outstanding
        type: integer
        source: computed
        description: Count of this event's Tickets with lifecycle_status IN {ISSUED, LISTED, TRANSFERRED, RESOLD}
        default: 0
      - name: settlement_pool_cents
        type: integer
        source: computed
        description: Venue-held cents from paid issuance plus resale royalties, reduced by remediation payouts
        default: 0

  - name: AccessZone
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this zone belongs to"
      - name: zone_code
        type: string
        source: input
        description: Short zone code
        constraints: "unique per event_id"
      - name: required_entitlement_level
        type: enum
        source: input
        description: Entitlement level a Ticket must carry to be admitted into this zone
        constraints: "one of {GA, PREMIUM, BACK_OF_HOUSE}"
      - name: fire_code_capacity
        type: integer
        source: input
        description: Fire-code occupancy ceiling for this zone
        constraints: ">= 1"
      - name: credential_capacity
        type: integer
        source: input
        description: Maximum credential head count admissible for any single instant, enforced across overlapping CredentialRequest validity windows
        default: 0
        constraints: ">= 0"
      - name: face_value_reference_cents
        type: integer
        source: input
        description: Reference face value used to price complimentary/credential give-aways in this zone
        constraints: ">= 0"
      - name: comp_discount_pct
        type: number
        source: input
        description: Discount fraction applied to face_value_reference_cents when a COMP or CREDENTIAL ticket is issued into this zone
        default: 0.85
        constraints: "0 <= value <= 1"
      - name: occupancy_count
        type: integer
        source: computed
        description: Real-time head count inside this zone from ONLINE scan events only
        default: 0
      - name: issued_entitlement_count
        type: integer
        source: computed
        description: Count of Tickets for this zone with lifecycle_status IN {ISSUED, LISTED, TRANSFERRED, RESOLD}
        default: 0
      - name: posture
        type: enum
        source: computed
        description: Issuance posture derived from issued_entitlement_count / fire_code_capacity (calculations.zone_posture)
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: comp_forgone_cents
        type: integer
        source: computed
        description: Accumulated forgone revenue from COMP/CREDENTIAL tickets issued into this zone
        default: 0

  - name: Gate
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; event this gate serves"
      - name: access_zone_id
        type: string
        source: input
        description: "FK -> AccessZone.id; zone this gate admits into"
      - name: gate_code
        type: string
        source: input
        description: Short gate code
        constraints: "unique per event_id"
      - name: throughput_per_minute
        type: integer
        source: input
        description: Rated admissions per minute for one open lane at this gate
        constraints: ">= 1"
      - name: lanes_open
        type: integer
        source: input
        description: Number of lanes staffed at this gate
        default: 1
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: IDLE when no ScanSession is OPEN on this gate, SCANNING while one is
        default: IDLE
        constraints: "one of {IDLE, SCANNING}"
      - name: last_session_closed_at
        type: datetime
        source: computed
        description: closed_at of the most recently CLOSED ScanSession on this gate, null when none
        default: null
      - name: admitted_scan_count
        type: integer
        source: computed
        description: Count of ScanEvents recorded through this gate with result == ADMITTED
        default: 0

  - name: Patron
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Patron account email
        constraints: "globally unique, case-insensitive"
      - name: display_name
        type: string
        source: input
        description: Patron display name
      - name: identity_verified
        type: boolean
        source: system
        description: True once a BoxOfficeAgent has recorded a government-ID check
        default: false
      - name: device_rebind_count
        type: integer
        source: computed
        description: Number of times this patron has bound a device to any ticket after the first binding on that ticket
        default: 0
      - name: strike_count
        type: integer
        source: computed
        description: Count of DeniedEntryIncidents ever opened against this patron
        default: 0
      - name: fraud_risk_score
        type: integer
        source: computed
        description: Persisted risk score, 0-100 (calculations.patron_fraud_risk_score)
        default: 0
      - name: fraud_risk_basis
        type: enum
        source: computed
        description: Which variant produced the persisted fraud_risk_score
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, ADJUDICATED}"
      - name: remediation_credit_cents
        type: integer
        source: computed
        description: Cents of goodwill credit owed to this patron from denied-entry remediation and refunded voids
        default: 0
      - name: payout_balance_cents
        type: integer
        source: computed
        description: Cents owed to this patron as a verified-resale seller
        default: 0

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; event the ticket admits to"
      - name: access_zone_id
        type: string
        source: input
        description: "FK -> AccessZone.id; zone the ticket entitles the holder to"
      - name: holder_patron_id
        type: string
        source: input
        description: "FK -> Patron.id; current holder of the entitlement"
      - name: credential_request_id
        type: string
        source: system
        description: "FK -> CredentialRequest.id; set when the ticket was auto-issued by a credential/comp approval, null for directly sold tickets"
        default: null
      - name: ticket_type
        type: enum
        source: input
        description: Commercial class of the entitlement
        constraints: "one of {PAID, COMP, WILL_CALL, CREDENTIAL}"
      - name: face_value_cents
        type: integer
        source: input
        description: Paid face value in cents; 0 for COMP and CREDENTIAL
        constraints: ">= 0"
      - name: barcode_seed
        type: string
        source: system
        description: Server-minted seed string that all rotating barcodes for this ticket are derived from
      - name: lifecycle_status
        type: enum
        source: system
        description: Commercial dimension of the ticket state, independent of admission_status
        default: ISSUED
        constraints: "one of {ISSUED, LISTED, TRANSFERRED, RESOLD, VOIDED}"
      - name: admission_status
        type: enum
        source: system
        description: Physical-presence dimension of the ticket state, independent of lifecycle_status
        default: NOT_ADMITTED
        constraints: "one of {NOT_ADMITTED, INSIDE, EXITED, DENIED_FLAGGED}"
      - name: transfer_count
        type: integer
        source: computed
        description: Number of TransferRequests on this ticket that reached ACCEPTED
        default: 0
      - name: bound_device_fingerprint
        type: string
        source: system
        description: Device fingerprint currently bound to this ticket, null when unbound
        default: null
      - name: device_binding_status
        type: enum
        source: system
        description: Binding dimension of the ticket
        default: UNBOUND
        constraints: "one of {UNBOUND, BOUND, RELEASED}"
      - name: last_admitted_at
        type: datetime
        source: computed
        description: recorded_at of the most recent ADMITTED ScanEvent on this ticket, null when never admitted
        default: null
      - name: last_exited_at
        type: datetime
        source: computed
        description: recorded_at of the most recent EXIT_RECORDED ScanEvent on this ticket, null when never exited
        default: null
      - name: admitted_scan_count
        type: integer
        source: computed
        description: Count of ADMITTED ScanEvents on this ticket across all sources
        default: 0
  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; entitlement being handed over"
      - name: from_patron_id
        type: string
        source: system
        description: "FK -> Patron.id; holder at request time, taken from the acting patron"
      - name: to_patron_id
        type: string
        source: input
        description: "FK -> Patron.id; intended recipient"
      - name: status
        type: enum
        source: system
        description: Handover workflow state
        default: PENDING
        constraints: "one of {PENDING, ACCEPTED, DECLINED}"
      - name: decided_at
        type: datetime
        source: computed
        description: Logical-clock instant the request was accepted or declined, null while PENDING
        default: null

  - name: ResaleListing
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; entitlement offered for resale"
      - name: seller_patron_id
        type: string
        source: system
        description: "FK -> Patron.id; holder at listing time, taken from the acting patron"
      - name: buyer_patron_id
        type: string
        source: system
        description: "FK -> Patron.id; buyer once SOLD, null otherwise"
        default: null
      - name: superseded_listing_id
        type: string
        source: system
        description: "FK -> ResaleListing.id; the DELISTED or SUSPENDED listing on the same ticket that this listing replaces, null for a first listing"
        default: null
      - name: marketplace
        type: enum
        source: input
        description: Marketplace channel the listing is published on
        constraints: "one of {VERIFIED_PRIMARY, VERIFIED_PARTNER, UNVERIFIED}"
      - name: ask_price_cents
        type: integer
        source: input
        description: Asking price in cents
        constraints: ">= 0"
      - name: cap_price_cents
        type: integer
        source: computed
        description: Maximum legal asking price for this ticket (calculations.resale_price_cap)
      - name: status
        type: enum
        source: system
        description: Listing state
        default: LISTED
        constraints: "one of {LISTED, SOLD, DELISTED, SUSPENDED}"
      - name: platform_fee_cents
        type: integer
        source: computed
        description: Platform fee withheld at sale, null while unsold
        default: null
      - name: venue_royalty_cents
        type: integer
        source: computed
        description: Venue royalty withheld at sale, null while unsold
        default: null
      - name: processing_fee_cents
        type: integer
        source: computed
        description: Payment processing fee withheld at sale, null while unsold
        default: null
      - name: seller_payout_cents
        type: integer
        source: computed
        description: Cents credited to the seller at sale, null while unsold
        default: null

  - name: ScanSession
    parent: null
    common_fields: true
    fields:
      - name: gate_id
        type: string
        source: input
        description: "FK -> Gate.id; gate this session scans for"
      - name: operator_device_id
        type: string
        source: input
        description: Handheld scanner identifier
      - name: mode
        type: enum
        source: input
        description: ONLINE sessions reject offline batch uploads; OFFLINE_CAPABLE sessions accept them
        constraints: "one of {ONLINE, OFFLINE_CAPABLE}"
      - name: status
        type: enum
        source: system
        description: Session state
        default: OPEN
        constraints: "one of {OPEN, SYNCING, CLOSED}"
      - name: opened_at
        type: datetime
        source: system
        description: Logical-clock instant the session opened
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant the session closed, null while not CLOSED
        default: null
      - name: online_scan_count
        type: integer
        source: computed
        description: Count of ScanEvents in this session with source == ONLINE
        default: 0
      - name: offline_uploaded_count
        type: integer
        source: computed
        description: Count of ScanEvents in this session with source == OFFLINE_BATCH
        default: 0
      - name: duplicate_suppressed_count
        type: integer
        source: computed
        description: Count of ScanEvents in this session with result == DENIED_DUPLICATE
        default: 0

  - name: ScanEvent
    parent: null
    common_fields: false
    fields:
      - name: scan_session_id
        type: string
        source: system
        description: "FK -> ScanSession.id; session that produced this scan"
      - name: ticket_id
        type: string
        source: system
        description: "FK -> Ticket.id; ticket the presented barcode seed resolved to, null when no ticket matches the seed"
        default: null
      - name: presented_barcode
        type: string
        source: input
        description: Barcode string presented at the gate, of the form <barcode_seed>-<epoch_index>
      - name: device_fingerprint
        type: string
        source: input
        description: Fingerprint of the device that rendered the barcode
      - name: direction
        type: enum
        source: input
        description: Whether the scan is an entry or an exit
        constraints: "one of {IN, OUT}"
      - name: scanned_at
        type: datetime
        source: input
        description: Client-clock instant of the scan; defaults to the logical clock for ONLINE scans, mandatory per item in an offline batch
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant the server persisted this scan
      - name: source
        type: enum
        source: system
        description: ONLINE for live gate scans, OFFLINE_BATCH for scans replayed from a scanner cache
        constraints: "one of {ONLINE, OFFLINE_BATCH}"
      - name: result
        type: enum
        source: system
        description: Adjudicated outcome of the scan
        constraints: "one of {ADMITTED, EXIT_RECORDED, DENIED_DUPLICATE, DENIED_COUNTERFEIT, DENIED_DEVICE_MISMATCH, DENIED_ZONE, DENIED_CAPACITY, DENIED_VOIDED, DENIED_STALE_BARCODE, DENIED_REENTRY_LOCKOUT}"
      - name: dedupe_key
        type: string
        source: input
        description: Scanner-generated key, unique per scan_session_id
      - name: denied_reason_code
        type: string
        source: computed
        description: error_id that the denial mapped to, null for ADMITTED and EXIT_RECORDED
        default: null

  - name: CredentialRequest
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; event the distribution is for"
      - name: access_zone_id
        type: string
        source: input
        description: "FK -> AccessZone.id; zone the issued entitlements admit into"
      - name: recipient_patron_id
        type: string
        source: input
        description: "FK -> Patron.id; patron who will hold every issued ticket"
      - name: distribution_type
        type: enum
        source: input
        description: Kind of non-sale distribution
        constraints: "one of {COMP, WILL_CALL, CREDENTIAL}"
      - name: quantity
        type: integer
        source: input
        description: Number of entitlements to issue on approval
        constraints: ">= 1 and <= 50"
      - name: valid_from
        type: datetime
        source: input
        description: Start of the credential validity window (inclusive)
      - name: valid_until
        type: datetime
        source: input
        description: End of the credential validity window (exclusive)
        constraints: "must be strictly after valid_from"
      - name: justification
        type: string
        source: input
        description: Business justification recorded in the audit trail
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the BoxOfficeAgent who submitted the request
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the TicketingApprover who approved or rejected it, null while undecided
        default: null
      - name: status
        type: enum
        source: system
        description: Approval workflow state; CHANGES_REQUESTED returns to SUBMITTED on resubmission
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, REJECTED}"
      - name: revision_count
        type: integer
        source: computed
        description: Number of times this request has re-entered SUBMITTED from CHANGES_REQUESTED
        default: 0
      - name: issued_ticket_count
        type: integer
        source: computed
        description: Number of Tickets auto-issued by the approval
        default: 0
      - name: forgone_revenue_cents
        type: integer
        source: computed
        description: Forgone revenue booked at approval (calculations.credential_forgone_revenue)
        default: 0

  - name: DeniedEntryIncident
    parent: null
    common_fields: true
    fields:
      - name: scan_event_id
        type: string
        source: system
        description: "FK -> ScanEvent.id; the denied scan that opened this incident"
      - name: ticket_id
        type: string
        source: system
        description: "FK -> Ticket.id; ticket involved, null when the barcode resolved to no ticket"
        default: null
      - name: patron_id
        type: string
        source: system
        description: "FK -> Patron.id; holder of the ticket at denial time, null when unknown"
        default: null
      - name: category
        type: enum
        source: system
        description: Fraud category derived from the denial result
        constraints: "one of {COUNTERFEIT, UNAUTHORIZED_RESALE, DUPLICATE, ZONE_VIOLATION, DEVICE_MISMATCH}"
      - name: status
        type: enum
        source: system
        description: Investigation state
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, REMEDIATED, DISMISSED}"
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the SecurityInvestigator who took the review, null while OPEN
        default: null
      - name: resolution_note
        type: string
        source: input
        description: Investigator note captured at remediation or dismissal
        default: null
      - name: remediation_credit_cents
        type: integer
        source: computed
        description: Goodwill credit granted at remediation (calculations.denied_entry_remediation_credit), null unless REMEDIATED
        default: null

  - name: ReconciliationReport
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; event being reconciled"
      - name: reported_attendance
        type: integer
        source: input
        description: Head count reported by venue operations
        constraints: ">= 0"
      - name: scan_derived_attendance
        type: integer
        source: computed
        description: Distinct tickets ever admitted, all scan sources (calculations.live_occupancy variant RECONCILED)
      - name: variance_count
        type: integer
        source: computed
        description: reported_attendance - scan_derived_attendance
      - name: variance_pct
        type: number
        source: computed
        description: Signed variance as a percentage of scan_derived_attendance (calculations.reconciliation_variance)
      - name: fire_code_breach
        type: boolean
        source: computed
        description: True when scan_derived_attendance exceeds the event's fire_code_capacity
        default: false
      - name: override_reason
        type: string
        source: input
        description: Justification permitting finalization despite an out-of-tolerance variance
        default: null
      - name: status
        type: enum
        source: system
        description: Report state; REOPENED returns to DRAFT semantics for a re-finalization
        default: DRAFT
        constraints: "one of {DRAFT, FINAL, REOPENED}"
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the VenueAdmin who finalized, null while not FINAL
        default: null

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: event_id
        type: string
        source: system
        description: "FK -> Event.id; event the audited action belongs to"
      - name: subject_type
        type: enum
        source: system
        description: Polymorphic discriminator for subject_id
        constraints: "one of {CREDENTIAL_REQUEST, TICKET, RESALE_LISTING, DENIED_ENTRY_INCIDENT, RECONCILIATION_REPORT}"
      - name: subject_id
        type: string
        source: system
        description: Identifier of the audited row, resolved together with subject_type; polymorphic, not a single-parent foreign key
      - name: action
        type: string
        source: system
        description: Action verb recorded, e.g. CREDENTIAL_REQUEST_APPROVED, TICKET_VOIDED
      - name: actor_role
        type: enum
        source: system
        description: X-User-Role of the actor
        constraints: "one of {Patron, BoxOfficeAgent, TicketingApprover, GateOperator, SecurityInvestigator, VenueAdmin}"
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the actor
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant of the audited action
      - name: detail
        type: string
        source: system
        description: Human-readable summary including amounts and state transition

