  - section: validations
    instances:
      - name: trend_create_missing_auth_returns_unauthenticated
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request sent without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role, shape, or existence check runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /trend-signals"
              payload: { source: "PRESTIGE_LAUNCH", platform: "runway", category: "EYES", mention_velocity_7d: 4000, engagement_growth_pct: 1.0, prestige_similarity: 0.75 }
              as: Anonymous
          assert:
            - "the response status is 401 and data.error_id == ERR_UNAUTHENTICATED  (headers absent — the as: marker is not sent)"
            - "GET /trend-signals returns 0 rows"

      - name: product_patch_unknown_id_returns_not_found_before_state_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors.ERR_PRODUCT_NOT_FOUND
        distinguishing_aspect: "PATCH on an unknown product id with a well-formed status payload resolves existence (priority 4) before the state machine (priority 7): the answer is 404 ERR_PRODUCT_NOT_FOUND, never 409."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "PATCH /products/00000000-0000-4000-8000-0000000000aa"
              payload: { status: "SOURCING" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { err_ord: $.data.error_id }
          assert:
            - "the response status is 404 and err_ord == ERR_PRODUCT_NOT_FOUND"

      - name: quote_create_with_stale_product_version_returns_412
        claim_type: Violation -> Error
        grounds:
          - concurrency_rules[quote-create-stale-product]
          - validations[priority=6]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on POST /cost-quotes: after quote A advances Product.version from 2 to 3, a second create still carrying expected_product_version == 2 is rejected 412 ERR_STALE_VERSION — a strictly sequential stale-write, no simultaneity involved."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in SOURCING (version 2 after the SOURCING transition); quote A already created (bumping the product to version 3)."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
            - *c_cm
            - *c_product
            - *c_fp
            - *c_fp_sample
            - *c_fp_approve
            - *c_prod_sourcing
            - *c_quote
          trigger:
            - call: "POST /cost-quotes"
              payload: { product_id: "${product_id}", contract_manufacturer_id: "${cm_id}", unit_cost_cents: 210, tooling_fee_cents: 10000, freight_total_cents: 40000, unit_weight_grams: 50, shipment_weight_grams: 500000, duty_rate: 0.10, initial_order_qty: 1000, valid_until: "2026-12-31T00:00:00Z", production_quarter: "2026-Q4", expected_product_version: "${product_v}" }
              as: ManufacturerRep
              as_user_id: "${cm_id}"
              captures: { err_occ: $.data.error_id }
          assert:
            - "the response status is 412 and err_occ == ERR_STALE_VERSION  (the client's ${product_v} == 2 is stale; current is 3)"
            - "GET /cost-quotes?product_id=${product_id} returns exactly 1 row (quote A) still SUBMITTED"

      - name: slot_create_with_stale_line_review_version_returns_412
        claim_type: Violation -> Error
        grounds:
          - concurrency_rules[slot-create-stale-line-review]
          - validations[priority=6]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on POST /planogram-slots with a different parent entity (LineReview): the first slot creation bumps the review 2 -> 3, so a second create carrying expected_line_review_version == 2 fails 412 before any occupancy or capacity check runs."
        test_recipe:
          setup:
            - "Full chain: product LAUNCH_READY; review SUBMISSION_OPEN at 2026-10-02; slot A created (review version now 3)."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
            - *c_cm
            - *c_product
            - *c_fp
            - *c_fp_sample
            - *c_fp_approve
            - *c_prod_sourcing
            - *c_quote
            - *c_quote_eval
            - *c_quote_accept
            - *c_prod_gate
            - *c_dossier
            - *c_rev_ing
            - *c_rev_claim
            - *c_rev_cert1
            - *c_rev_cert2
            - *c_rev_cert3
            - *c_rev_reg1
            - *c_rev_reg2
            - *c_pack
            - *c_prod_ready
            - *c_partner
            - *c_lr
            - *c_clock2
            - *c_lr_open
            - *c_slot
          trigger:
            - call: "POST /planogram-slots"
              payload: { line_review_id: "${lr_id}", product_id: "${product_id}", category: "EYES", position_code: "EYES-A2", facings: 2, occupancy_start: "2026-11-01T00:00:00Z", occupancy_end: "2027-01-31T00:00:00Z", expected_line_review_version: "${lr_v}" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { err_occ2: $.data.error_id }
          assert:
            - "the response status is 412 and err_occ2 == ERR_STALE_VERSION  (${lr_v} == 2 is stale; current is 3)"
            - "GET /planogram-slots?line_review_id=${lr_id} returns exactly 1 row"

      - name: discontinuation_approve_by_proposing_user_returns_forbidden
        claim_type: Violation -> Error
