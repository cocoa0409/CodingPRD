              as_user_id: "auditor_alice"
              captures: { vc_ud5_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "392.2LS", description: "Speeding less than 5 over the limit", basic_category: "UNSAFE_DRIVING", severity_weight: 3 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_ud3_id: $.data.id }
            - call: "POST /intervention-thresholds"
