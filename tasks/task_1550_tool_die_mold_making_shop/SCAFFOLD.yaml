# =============================================================================
# SCAFFOLD.yaml — Tool & Die / Mold Making Shop benchmark seed tables
# Sections §1.0–§1.7. Difficulty design and corner design live in sibling files.
# =============================================================================

scenario: |
  Tool & Die / Mold Making Shop (Midwest tool-and-die shop): tool design & revision, quote by die class & lead time, build milestone & progress billing, tryout/T1 sampling & buyoff, engineering change & tool rework authorization, spare-insert inventory, tool warranty by shot life, ownership & shipping/retention lien

domain_name: tool-die-mold-shop
api_prefix: ""   # flat topology: all resources root-mounted (e.g. /quotes/{id}, /build-jobs/{id})

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat            # peer entities joined by FK references; no nested URL paths
  state_machine_shape: cyclic      # dominant shape; also branching (BuildJob hold/resume), parallel (ToolAsset physical x ownership)
  relationship_patterns:
    - one_to_many
    - self_referential             # ToolDesign.supersedes_design_id
    - cross_aggregate              # WarrantyClaim/SpareInsert/ShotReport reference ToolAsset across the BuildJob aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; every FK is a plain field)
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal company name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit ceiling in cents; 0 means unlimited", default: 0, constraints: ">= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of balance_due_cents over this customer's ProgressInvoice with status IN {ISSUED, PARTIALLY_PAID}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED. SUSPENDED when any open invoice is > 10 days past due; restored when none remain", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }

  - name: ToolDesign
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: part_number, type: string, source: input, description: "Customer part number this tool produces" }
      - { name: tool_type, type: enum, source: input, description: "PROGRESSIVE_DIE | TRANSFER_DIE | INJECTION_MOLD | BLOW_MOLD | COMPRESSION_MOLD" }
      - { name: die_class, type: enum, source: input, description: "CLASS_101 | CLASS_102 | CLASS_103 | CLASS_104 | CLASS_105 (101 = >=1M-shot production, 105 = prototype)" }
      - { name: cavity_count, type: integer, source: input, description: "Number of cavities/stations", constraints: "1..64" }
      - { name: design_complexity_score, type: integer, source: input, description: "Engineering complexity 1..20 (slides, lifters, tolerances)" }
      - { name: revision_number, type: integer, source: system, description: "1 for the first design of a part; incremented per /revise chain", default: 1 }
      - { name: supersedes_design_id, type: string, source: system, description: "FK -> ToolDesign.id; set on revisions created by /revise; null otherwise", default: null }
      - { name: quoted_count, type: integer, source: computed, description: "Number of quotes created against this design; +1 per POST /quotes (bumps version)", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> RELEASED | SUPERSEDED; SUBMITTED -> DRAFT on rejection (revision loop)", default: DRAFT }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: tool_design_id, type: string, source: input, description: "FK -> ToolDesign.id; the design revision being priced" }
      - { name: quote_kind, type: enum, source: input, description: "BUDGETARY | FIRM" }
      - { name: requested_lead_weeks, type: integer, source: input, description: "Customer-requested lead time in whole weeks", constraints: ">= 1" }
      - { name: expedited, type: boolean, source: input, description: "Expedited shop scheduling flag", default: false }
      - { name: warranty_terms, type: enum, source: input, description: "LINEAR_PRORATION | DECLINING_BALANCE; copied onto the ToolAsset", default: LINEAR_PRORATION }
      - { name: base_price_cents, type: integer, source: computed, description: "class base + cavities*cavity rate + complexity*complexity rate" }
      - { name: surcharge_pct, type: number, source: computed, description: "lead-compression surcharge fraction (0.00..0.40)" }
      - { name: subtotal_cents, type: integer, source: computed, description: "base after surcharge and expedited multiplier, exact-decimal, pre-contingency" }
      - { name: contingency_pct, type: number, source: computed, description: "0.15 BUDGETARY | 0.05 FIRM" }
      - { name: total_price_cents, type: integer, source: computed, description: "final quote total, round_half_up to integer cents at final step only" }
      - { name: issued_at, type: datetime, source: system, description: "logical-clock timestamp when issued; null while DRAFT", default: null }
      - { name: valid_until, type: datetime, source: computed, description: "issued_at + 14 days (BUDGETARY) | + 30 days (FIRM); null while DRAFT", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> ACCEPTED | DECLINED | EXPIRED; ISSUED -> SUPERSEDED when a newer quote for the same design is issued", default: DRAFT }

  - name: BuildJob
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; unique — one job per accepted quote" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from the quote" }
      - { name: tool_design_id, type: string, source: system, description: "FK -> ToolDesign.id; denormalized from the quote" }
      - { name: die_class, type: enum, source: system, description: "Copied from the design at creation; immutable" }
      - { name: contract_value_cents, type: integer, source: computed, description: "Snapshot of quote.total_price_cents; re-baselined upward/downward by approved ECOs" }
      - { name: billed_cents, type: integer, source: computed, description: "Sum of amount_cents over ProgressInvoice of this job with status != VOID" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of Payment allocation applied_cents over all payments on this job" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Sum over milestones of max(0, milestone.paid_cents - milestone.planned_amount_cents)" }
      - { name: net_paid_cents, type: integer, source: computed, description: "paid_cents - credit_balance_cents" }
      - { name: outstanding_cents, type: integer, source: computed, description: "contract_value_cents - net_paid_cents" }
      - { name: open_eco_count, type: integer, source: computed, description: "Count of EngineeringChange on this job with status IN {SUBMITTED, IMPACT_ASSESSED, APPROVED}" }
      - { name: status, type: enum, source: system, description: "BOOKED -> IN_BUILD -> TRYOUT_PHASE -> BUYOFF_PASSED -> READY_TO_SHIP -> SHIPPED -> CLOSED; ON_HOLD branching; regression to IN_BUILD on ECO reopen", default: BOOKED }
      - { name: hold_return_state, type: enum, source: system, description: "State captured when put ON_HOLD; null otherwise", default: null }

  - name: BuildMilestone
    parent: null
    common_fields: true
    fields:
      - { name: build_job_id, type: string, source: system, description: "FK -> BuildJob.id" }
      - { name: seq, type: integer, source: system, description: "1..6 in canonical order" }
      - { name: code, type: enum, source: system, description: "1=DESIGN_COMPLETE 2=MATERIAL_STAGED 3=MACHINING_COMPLETE 4=T1_TRYOUT_DONE 5=BUYOFF_SIGNED 6=DELIVERY_ACCEPTED" }
      - { name: billing_pct, type: integer, source: system, description: "20 | 25 | 25 | 15 | 10 | 5 by seq" }
      - { name: planned_amount_cents, type: integer, source: computed, description: "round_half_up(contract*billing_pct/100) for seq 1..5; seq 6 absorbs the remainder so the six always sum to contract_value_cents; replanned on ECO approval" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of allocation applied_cents on this milestone's non-VOID invoices" }
      - { name: completed_at, type: datetime, source: system, description: "When EARNED (logical clock); cleared on REOPENED", default: null }
      - { name: status, type: enum, source: system, description: "PENDING -> EARNED -> INVOICED -> PAID; EARNED|INVOICED -> REOPENED -> EARNED rework loop", default: PENDING }

  - name: ProgressInvoice
    parent: null
    common_fields: true
    fields:
      - { name: build_job_id, type: string, source: system, description: "FK -> BuildJob.id" }
      - { name: build_milestone_id, type: string, source: system, description: "FK -> BuildMilestone.id" }
      - { name: invoice_number, type: string, source: system, description: "INV-<job-seq>-<n> server-minted" }
      - { name: amount_cents, type: integer, source: computed, description: "At issuance: milestone.planned_amount_cents - milestone.paid_cents (net-new billing after rework reopen)" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of Payment allocations applied to this invoice" }
      - { name: balance_due_cents, type: integer, source: computed, description: "amount_cents - paid_cents" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceAdmin who issued it; segregation-of-duties anchor" }
      - { name: due_date, type: datetime, source: computed, description: "issued_at (created_at) + 30 days" }
      - { name: void_reason, type: string, source: system, description: "Set when VOID (e.g. ECO_REWORK); null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "ISSUED -> PARTIALLY_PAID -> PAID; ISSUED|PARTIALLY_PAID -> VOID on ECO rework reopen", default: ISSUED }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: build_job_id, type: string, source: system, description: "FK -> BuildJob.id" }
      - { name: amount_cents, type: integer, source: input, description: "Total cash received, waterfall-allocated across open invoices", constraints: ">= 1" }
      - { name: allocations, type: array, source: computed, description: "[{invoice_id, applied_cents}] in allocation order (due_date ASC, created_at ASC)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceAdmin recording the payment" }

  - name: TryoutSample
    parent: null
    common_fields: true
    fields:
      - { name: build_job_id, type: string, source: input, description: "FK -> BuildJob.id" }
      - { name: press_reservation_id, type: string, source: input, description: "FK -> PressReservation.id; the tryout press window used" }
      - { name: round_number, type: integer, source: system, description: "1 on creation; +1 per initiate-rework (T1, T2, T3, ...)", default: 1 }
      - { name: sample_qty, type: integer, source: input, description: "Parts sampled; set at submit", default: null }
      - { name: shots_used, type: integer, source: input, description: "Press shots consumed this round; added to tool lifetime at submit", default: null }
      - { name: measured_report_ref, type: string, source: input, description: "Dimensional layout report reference; set at submit", default: null }
      - { name: defect_codes, type: array, source: input, description: "Required non-empty when buyoff decision is REJECTED", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> SUBMITTED -> BOUGHT_OFF | REJECTED; REJECTED -> SCHEDULED via initiate-rework (cyclic round loop)", default: SCHEDULED }

  - name: EngineeringChange
    parent: null
    common_fields: true
    fields:
      - { name: build_job_id, type: string, source: input, description: "FK -> BuildJob.id" }
      - { name: requested_by, type: enum, source: input, description: "SHOP (ToolingEngineer caller) | CUSTOMER (Customer caller)" }
      - { name: description, type: string, source: input, description: "Change description" }
      - { name: affects_from_milestone_seq, type: integer, source: input, description: "Reopen scope: milestones with seq >= this value are reopened/replanned on approval", constraints: "1..6" }
      - { name: rework_hours, type: number, source: input, description: "Set at assess; >= 0", default: null }
      - { name: scrapped_material_cost_cents, type: integer, source: input, description: "Set at assess; >= 0", default: null }
      - { name: lead_extension_weeks, type: integer, source: input, description: "Set at assess; >= 0", default: null }
      - { name: labor_cost_cents, type: integer, source: computed, description: "round_half_up(rework_hours * class labor rate)" }
      - { name: material_cost_cents, type: integer, source: computed, description: "round_half_up(scrapped_material_cost_cents * 1.15)" }
      - { name: impact_cost_cents, type: integer, source: computed, description: "labor_cost_cents + material_cost_cents" }
      - { name: schedule_penalty_cents, type: integer, source: computed, description: "0 if lead_extension_weeks <= 2 else round_half_up((lead_extension_weeks-2) * 0.01 * (contract_value_cents + impact_cost_cents))" }
      - { name: total_charge_cents, type: integer, source: computed, description: "impact_cost_cents + schedule_penalty_cents (pinned evaluation order — penalty base excludes the penalty itself)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> IMPACT_ASSESSED -> APPROVED | REJECTED; APPROVED -> VERIFIED", default: SUBMITTED }

  - name: ReworkAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: engineering_change_id, type: string, source: system, description: "FK -> EngineeringChange.id; 1:1, created on ECO approval" }
      - { name: build_job_id, type: string, source: system, description: "FK -> BuildJob.id; denormalized" }
      - { name: authorized_cost_cents, type: integer, source: system, description: "Snapshot of ECO.total_charge_cents at approval" }
      - { name: consumed_cost_cents, type: integer, source: input, description: "actual_cost_cents reported at complete", default: null }
      - { name: status, type: enum, source: system, description: "AUTHORIZED -> IN_PROGRESS -> COMPLETED; AUTHORIZED -> CANCELLED", default: AUTHORIZED }

  - name: ToolAsset
    parent: null
    common_fields: true
    fields:
      - { name: build_job_id, type: string, source: system, description: "FK -> BuildJob.id; unique — one tool per job" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized" }
      - { name: serial_number, type: string, source: system, description: "Server-minted serial TLT-<n>" }
      - { name: die_class, type: enum, source: system, description: "Copied from job" }
      - { name: warranty_terms, type: enum, source: system, description: "LINEAR_PRORATION | DECLINING_BALANCE; copied from quote" }
      - { name: warranty_shot_limit, type: integer, source: system, description: "By die class: 101=1000000, 102=500000, 103=250000, 104=100000, 105=10000" }
      - { name: warranty_expires_at, type: datetime, source: computed, description: "buyoff timestamp + 730 days; null until first BOUGHT_OFF", default: null }
      - { name: tryout_shots, type: integer, source: computed, description: "Sum of shots_used over all TryoutSample submits for the job", default: 0 }
      - { name: reported_shots, type: integer, source: computed, description: "Sum of shots_in_period over ACTIVE ShotReport rows", default: 0 }
      - { name: lifetime_shots, type: integer, source: computed, description: "tryout_shots + reported_shots", default: 0 }
      - { name: contract_snapshot_cents, type: integer, source: system, description: "contract_value_cents at job creation; caps warranty repair base" }
      - { name: carrier, type: string, source: input, description: "Set at ship", default: null }
      - { name: tracking_number, type: string, source: input, description: "Set at ship", default: null }
      - { name: shipped_at, type: datetime, source: system, description: "Set at ship", default: null }
      - { name: delivered_at, type: datetime, source: system, description: "Set at deliver", default: null }
      - { name: physical_status, type: enum, source: system, description: "IN_BUILD -> TRYOUT -> AWAITING_SHIPMENT -> IN_TRANSIT -> IN_PRODUCTION; IN_PRODUCTION -> RETURNED_FOR_REPAIR -> IN_PRODUCTION (warranty loop); regression to IN_BUILD on ECO reopen", default: IN_BUILD }
      - { name: ownership_status, type: enum, source: system, description: "SHOP_RETAINED -> TRANSFERRED (one-way; tooler's retention lien released only when net_paid_cents >= contract_value_cents AND physical_status == IN_PRODUCTION)", default: SHOP_RETAINED }

  - name: ShotReport
    parent: null
    common_fields: false
    fields:
      - { name: tool_asset_id, type: string, source: input, description: "FK -> ToolAsset.id" }
      - { name: report_period_end, type: datetime, source: input, description: "Period end date; must be strictly later than every prior ACTIVE report for this tool and <= current logical time" }
      - { name: shots_in_period, type: integer, source: input, description: "Shots produced in the period", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> REVERSED (compensating action)", default: ACTIVE }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: tool_asset_id, type: string, source: input, description: "FK -> ToolAsset.id" }
      - { name: defect_description, type: string, source: input, description: "Failure description" }
      - { name: estimated_repair_cost_cents, type: integer, source: input, description: "Claimed repair cost; credit base is min(this, tool.contract_snapshot_cents)", constraints: ">= 1" }
      - { name: claimed_at_shot_count, type: integer, source: computed, description: "tool.lifetime_shots snapshot at filing" }
      - { name: approved_credit_cents, type: integer, source: computed, description: "Proration credit per warranty_terms variant; set on APPROVE", default: null }
      - { name: denial_reason, type: string, source: input, description: "Required when review decision is DENY", default: null }
      - { name: status, type: enum, source: system, description: "FILED -> REPAIR_SCHEDULED | DENIED; REPAIR_SCHEDULED -> CLOSED", default: FILED }

  - name: SpareInsert
    parent: null
    common_fields: true
    fields:
      - { name: tool_asset_id, type: string, source: input, description: "FK -> ToolAsset.id" }
      - { name: insert_code, type: string, source: input, description: "Shop code for the spare insert/cavity/core" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Sell price per insert", constraints: ">= 0" }
      - { name: on_hand, type: integer, source: computed, description: "Initialized from initial_on_hand; mutated by allocate (-) and restock (+)", default: 0 }
      - { name: reorder_point, type: integer, source: input, description: "Reorder threshold", constraints: ">= 0" }
      - { name: reorder_needed, type: boolean, source: computed, description: "on_hand <= reorder_point (boundary inclusive)" }
      - { name: status, type: enum, source: system, description: "ACTIVE <-> DEPLETED (auto at on_hand == 0 / restock > 0) -> DISCONTINUED", default: ACTIVE }

  - name: PressReservation
    parent: null
    common_fields: true
    fields:
      - { name: build_job_id, type: string, source: input, description: "FK -> BuildJob.id" }
      - { name: press_id, type: enum, source: input, description: "PRESS_200T | PRESS_500T | PRESS_800T" }
      - { name: start_time, type: datetime, source: input, description: "Window start (logical clock); must be >= now at creation" }
      - { name: end_time, type: datetime, source: input, description: "Window end; must be > start_time" }
      - { name: status, type: enum, source: system, description: "RESERVED -> CANCELLED. Half-open interval [start,end): adjacent windows allowed", default: RESERVED }

  - name: MachineReservation
    parent: null
    common_fields: true
    fields:
      - { name: build_job_id, type: string, source: input, description: "FK -> BuildJob.id" }
      - { name: machine_id, type: enum, source: input, description: "CNC_1 | CNC_2 | EDM_1 | GRIND_1" }
      - { name: start_time, type: datetime, source: input, description: "Block start; must be >= now at creation" }
      - { name: end_time, type: datetime, source: input, description: "Block end; must be > start_time" }
      - { name: duration_hours, type: number, source: computed, description: "(end_time - start_time) in hours" }
      - { name: status, type: enum, source: system, description: "RESERVED -> CANCELLED. Each block occupies [start, end + 4h cool-down buffer); weekly capacity 45 h per machine", default: RESERVED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system sweep on POST /_clock/set_current_utc (credit-aging sweep)"
        actor: system
        preconditions:
          - "Exists ProgressInvoice of any of the customer's jobs with status IN {ISSUED, PARTIALLY_PAID} and now > due_date + 10 days"
        side_effects:
          - "customer.version incremented"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system sweep on POST /_clock/set_current_utc, or POST /build-jobs/{jobId}/payments that clears the last overdue-beyond-grace invoice"
        actor: system
        preconditions:
          - "No ProgressInvoice of the customer with status IN {ISSUED, PARTIALLY_PAID} and now > due_date + 10 days"
        side_effects: []

  - entity: ToolDesign
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /tool-designs/{designId}/submit
        actor: Customer
        preconditions:
          - "Caller owns the design (customer_id == X-User-ID, ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: SUBMITTED
        to: RELEASED
        trigger: POST /tool-designs/{designId}/review with decision=RELEASED
        actor: ToolingEngineer
        preconditions:
          - "No other ToolDesign with same (customer_id, part_number) is RELEASED unless that design is this design's supersedes chain head (ERR_DUPLICATE_RELEASED_DESIGN)"
        side_effects:
          - "The design this one supersedes (supersedes_design_id), if still RELEASED, transitions RELEASED -> SUPERSEDED (revision chain cascade)"
      - from: SUBMITTED
        to: DRAFT
        trigger: POST /tool-designs/{designId}/review with decision=REJECTED
        actor: ToolingEngineer
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: SUPERSEDED
        trigger: "system (when a revision of the same part is RELEASED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST /quotes/{quoteId}/issue
        actor: Estimator
        preconditions:
          - "quote_kind == FIRM requires ToolDesign.status == RELEASED (ERR_DESIGN_NOT_RELEASED); BUDGETARY accepts design status IN {SUBMITTED, RELEASED}"
        side_effects:
          - "issued_at = logical now; valid_until = now + 14d (BUDGETARY) or + 30d (FIRM)"
          - "Every other Quote with tool_design_id == this.tool_design_id and status == ISSUED transitions ISSUED -> SUPERSEDED (supersede cascade)"
      - from: ISSUED
        to: ACCEPTED
        trigger: POST /quotes/{quoteId}/respond with decision=ACCEPTED
        actor: Customer
        preconditions:
          - "Caller owns the quote (ERR_NOT_RESOURCE_OWNER)"
          - "now <= valid_until, else quote auto-transitions ISSUED -> EXPIRED and the call fails (ERR_QUOTE_EXPIRED)"
          - "Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "customer.credit_limit_cents == 0 OR customer.outstanding_balance_cents + total_price_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects: []
      - from: ISSUED
        to: DECLINED
        trigger: POST /quotes/{quoteId}/respond with decision=DECLINED
        actor: Customer
        preconditions:
          - "Caller owns the quote (ERR_NOT_RESOURCE_OWNER)"
          - "now <= valid_until, else quote auto-transitions to EXPIRED and the call fails (ERR_QUOTE_EXPIRED)"
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (evaluated lazily on respond when now > valid_until)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (when a newer quote for the same design is issued)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BuildJob
    initial_state: BOOKED
    terminal_states: [CLOSED]
    transitions:
      - from: BOOKED
        to: IN_BUILD
        trigger: POST /build-jobs/{jobId}/advance with target_state=IN_BUILD
        actor: ProjectManager
        preconditions:
          - "At least one MachineReservation for this job with status == RESERVED (ERR_NO_CAPACITY_RESERVED)"
        side_effects: []
      - from: IN_BUILD
        to: TRYOUT_PHASE
        trigger: "system (on POST /tryout-samples for this job)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TRYOUT_PHASE
        to: BUYOFF_PASSED
        trigger: "system (on first TryoutSample buyoff decision = BOUGHT_OFF)"
        actor: system
        preconditions: []
        side_effects:
          - "ToolAsset.physical_status TRYOUT -> AWAITING_SHIPMENT"
          - "ToolAsset.warranty_expires_at = now + 730 days"
      - from: BUYOFF_PASSED
        to: READY_TO_SHIP
        trigger: POST /build-jobs/{jobId}/advance with target_state=READY_TO_SHIP
        actor: ProjectManager
        preconditions:
          - "Milestones seq 1..5 all have status IN {EARNED, INVOICED, PAID} (ERR_MILESTONE_SEQUENCE_BLOCKED)"
        side_effects: []
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "system (on POST /tool-assets/{toolId}/ship)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: CLOSED
        trigger: "system (when ToolAsset.ownership_status becomes TRANSFERRED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: ON_HOLD
        trigger: POST /build-jobs/{jobId}/hold
        actor: ProjectManager
        preconditions: []
        side_effects: ["hold_return_state = BOOKED"]
      - from: IN_BUILD
        to: ON_HOLD
        trigger: POST /build-jobs/{jobId}/hold
        actor: ProjectManager
        preconditions: []
        side_effects: ["hold_return_state = IN_BUILD"]
      - from: TRYOUT_PHASE
        to: ON_HOLD
        trigger: POST /build-jobs/{jobId}/hold
        actor: ProjectManager
        preconditions: []
        side_effects: ["hold_return_state = TRYOUT_PHASE"]
      - from: BUYOFF_PASSED
        to: ON_HOLD
        trigger: POST /build-jobs/{jobId}/hold
        actor: ProjectManager
        preconditions: []
        side_effects: ["hold_return_state = BUYOFF_PASSED"]
      - from: READY_TO_SHIP
        to: ON_HOLD
        trigger: POST /build-jobs/{jobId}/hold
        actor: ProjectManager
        preconditions: []
        side_effects: ["hold_return_state = READY_TO_SHIP"]
      - from: ON_HOLD
        to: BOOKED
        trigger: POST /build-jobs/{jobId}/resume (when hold_return_state == BOOKED)
        actor: ProjectManager
        preconditions: []
        side_effects: ["hold_return_state = null"]
      - from: ON_HOLD
        to: IN_BUILD
        trigger: POST /build-jobs/{jobId}/resume (when hold_return_state == IN_BUILD)
        actor: ProjectManager
        preconditions: []
        side_effects: ["hold_return_state = null"]
      - from: ON_HOLD
        to: TRYOUT_PHASE
        trigger: POST /build-jobs/{jobId}/resume (when hold_return_state == TRYOUT_PHASE)
        actor: ProjectManager
        preconditions: []
        side_effects: ["hold_return_state = null"]
      - from: ON_HOLD
        to: BUYOFF_PASSED
        trigger: POST /build-jobs/{jobId}/resume (when hold_return_state == BUYOFF_PASSED)
        actor: ProjectManager
        preconditions: []
        side_effects: ["hold_return_state = null"]
      - from: ON_HOLD
        to: READY_TO_SHIP
        trigger: POST /build-jobs/{jobId}/resume (when hold_return_state == READY_TO_SHIP)
        actor: ProjectManager
        preconditions: []
        side_effects: ["hold_return_state = null"]
      - from: TRYOUT_PHASE
        to: IN_BUILD
        trigger: "system (ECO approval regression when >= 1 milestone reopened)"
        actor: system
        preconditions: []
        side_effects: ["ToolAsset.physical_status TRYOUT -> IN_BUILD"]
      - from: BUYOFF_PASSED
        to: IN_BUILD
        trigger: "system (ECO approval regression when >= 1 milestone reopened)"
        actor: system
        preconditions: []
        side_effects: ["ToolAsset.physical_status AWAITING_SHIPMENT -> IN_BUILD"]
      - from: READY_TO_SHIP
        to: IN_BUILD
        trigger: "system (ECO approval regression when >= 1 milestone reopened)"
        actor: system
        preconditions: []
        side_effects: ["ToolAsset.physical_status AWAITING_SHIPMENT -> IN_BUILD"]

  - entity: BuildMilestone
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: EARNED
        trigger: POST /build-milestones/{milestoneId}/complete
        actor: "ProjectManager (seq 1-4, 6) | Customer owner (seq 5)"
        preconditions:
          - "BuildJob.status != ON_HOLD (ERR_JOB_ON_HOLD)"
          - "All milestones with lower seq have status IN {EARNED, INVOICED, PAID} (ERR_MILESTONE_SEQUENCE_BLOCKED)"
          - "seq == 4 requires an existing TryoutSample for the job with status IN {SUBMITTED, BOUGHT_OFF} (ERR_INVALID_STATE)"
          - "seq == 5 requires an existing TryoutSample with status == BOUGHT_OFF and caller must be the owning Customer (ERR_MILESTONE_ACTOR_MISMATCH)"
          - "seq == 6 requires ToolAsset.physical_status == IN_PRODUCTION (ERR_INVALID_STATE)"
        side_effects:
          - "completed_at = now; earned amount locked at current planned_amount_cents"
      - from: REOPENED
        to: EARNED
        trigger: POST /build-milestones/{milestoneId}/complete
        actor: "ProjectManager (seq 1-4, 6) | Customer owner (seq 5)"
        preconditions: ["same as PENDING -> EARNED"]
        side_effects: ["completed_at = now"]
      - from: EARNED
        to: INVOICED
        trigger: POST /build-milestones/{milestoneId}/invoice
        actor: FinanceAdmin
        preconditions:
          - "milestone status must be EARNED (ERR_INVALID_STATE otherwise); computed amount (planned_amount_cents - paid_cents) is always >= 1 because ECO charges are non-negative and replan never lowers a milestone below its paid_cents"
        side_effects:
          - "ProgressInvoice created (status ISSUED, issued_by_user_id = caller, due_date = now + 30d)"
          - "BuildJob.billed_cents += invoice.amount_cents (recompute)"
      - from: INVOICED
        to: PAID
        trigger: "system (when the milestone's non-VOID invoices are all PAID via payment waterfall)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EARNED
        to: REOPENED
        trigger: "system (ECO approval with affects_from_milestone_seq <= seq)"
        actor: system
        preconditions: []
        side_effects: ["completed_at = null"]
      - from: INVOICED
        to: REOPENED
        trigger: "system (ECO approval with affects_from_milestone_seq <= seq)"
        actor: system
        preconditions: []
        side_effects:
          - "completed_at = null"
          - "Each ProgressInvoice of this milestone with status IN {ISSUED, PARTIALLY_PAID} transitions to VOID with void_reason=ECO_REWORK (invoice-void cascade)"
          - "BuildJob.billed_cents recomputed (drops voided amounts)"

  - entity: ProgressInvoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "system (payment waterfall allocates 0 < applied < balance_due_cents)"
        actor: system
        preconditions: []
        side_effects: ["paid_cents, balance_due_cents recomputed"]
      - from: ISSUED
        to: PAID
        trigger: "system (waterfall allocates applied == balance_due_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "paid_cents = amount_cents; balance_due_cents = 0"
          - "If all non-VOID invoices of the milestone are PAID, milestone INVOICED -> PAID (bubble-up)"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (waterfall covers remaining balance)"
        actor: system
        preconditions: []
        side_effects: ["same bubble-up as ISSUED -> PAID"]
      - from: ISSUED
        to: VOID
        trigger: "system (ECO approval reopens the parent milestone)"
        actor: system
        preconditions: []
        side_effects: ["void_reason = ECO_REWORK"]
      - from: PARTIALLY_PAID
        to: VOID
        trigger: "system (ECO approval reopens the parent milestone)"
        actor: system
        preconditions: []
        side_effects: ["void_reason = ECO_REWORK; its paid_cents remain attributed to the milestone (milestone.paid_cents) and may surface as BuildJob.credit_balance_cents"]

  - entity: TryoutSample
    initial_state: SCHEDULED
    terminal_states: [BOUGHT_OFF]
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: POST /tryout-samples/{sampleId}/submit
        actor: ProjectManager
        preconditions:
          - "BuildJob.status == TRYOUT_PHASE (ERR_JOB_PHASE_MISMATCH)"
          - "press reservation status == RESERVED (ERR_INVALID_STATE)"
          - "now within [reservation.start_time, reservation.end_time) (ERR_OUTSIDE_RESERVATION_WINDOW)"
        side_effects:
          - "ToolAsset.tryout_shots += shots_used; lifetime_shots recomputed"
          - "ToolAsset.physical_status IN_BUILD -> TRYOUT (first submit only)"
      - from: SUBMITTED
        to: BOUGHT_OFF
        trigger: POST /tryout-samples/{sampleId}/buyoff-decision with decision=BOUGHT_OFF
        actor: QualityManager
        preconditions: []
        side_effects:
          - "If BuildJob.status == TRYOUT_PHASE: BuildJob TRYOUT_PHASE -> BUYOFF_PASSED (bubble-up)"
          - "ToolAsset.physical_status TRYOUT -> AWAITING_SHIPMENT"
          - "ToolAsset.warranty_expires_at = now + 730 days"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /tryout-samples/{sampleId}/buyoff-decision with decision=REJECTED
        actor: QualityManager
        preconditions:
          - "defect_codes must be a non-empty array (ERR_DEFECT_CODES_REQUIRED)"
        side_effects: []
      - from: REJECTED
        to: SCHEDULED
        trigger: POST /tryout-samples/{sampleId}/initiate-rework
        actor: ProjectManager
        preconditions:
          - "BuildJob.status IN {TRYOUT_PHASE, IN_BUILD} and != ON_HOLD (ERR_JOB_ON_HOLD)"
          - "If round_number >= 3: rework_authorization_id is required and must reference a ReworkAuthorization of this job with status IN {AUTHORIZED, IN_PROGRESS} (ERR_REWORK_REQUIRES_AUTHORIZATION)"
        side_effects:
          - "round_number += 1; sample_qty, shots_used, measured_report_ref, defect_codes reset to null"
          - "If a rework_authorization_id was given and its status == AUTHORIZED: ReworkAuthorization -> IN_PROGRESS"
          - "If BuildJob.status == IN_BUILD: BuildJob IN_BUILD -> TRYOUT_PHASE"

  - entity: EngineeringChange
    initial_state: SUBMITTED
    terminal_states: [REJECTED, VERIFIED]
    transitions:
      - from: SUBMITTED
        to: IMPACT_ASSESSED
        trigger: POST /engineering-changes/{ecoId}/assess
        actor: ToolingEngineer
        preconditions: []
        side_effects:
          - "labor_cost_cents, material_cost_cents, impact_cost_cents, schedule_penalty_cents, total_charge_cents computed per eco_impact_reprice"
      - from: IMPACT_ASSESSED
        to: APPROVED
        trigger: POST /engineering-changes/{ecoId}/customer-decision with decision=APPROVED
        actor: Customer
        preconditions:
          - "Caller owns the job's customer (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "ReworkAuthorization created (hop 1: status AUTHORIZED, authorized_cost_cents = total_charge_cents, engineering_change_id + build_job_id set)"
          - "BuildJob re-baselined (hop 2): contract_value_cents += total_charge_cents; open_eco_count recomputed"
          - "Milestones with seq >= affects_from_milestone_seq and status IN {EARNED, INVOICED} transition to REOPENED (hop 2); PENDING milestones with seq >= affects_from_milestone_seq keep status but replan"
          - "Replan: milestones with status IN {PENDING, REOPENED} get planned_amount_cents = round_half_up(new contract_value_cents * billing_pct/100); the highest-seq replanned milestone absorbs the remainder so the six planned amounts sum exactly to the new contract_value_cents"
          - "Each reopened milestone's invoices with status IN {ISSUED, PARTIALLY_PAID} transition to VOID (hop 3: milestone -> invoice); BuildJob.billed_cents and credit_balance_cents recomputed"
          - "If >= 1 milestone was reopened and BuildJob.status IN {TRYOUT_PHASE, BUYOFF_PASSED, READY_TO_SHIP}: BuildJob regresses to IN_BUILD (hop 4: job -> tool) and ToolAsset.physical_status TRYOUT|AWAITING_SHIPMENT -> IN_BUILD"
      - from: IMPACT_ASSESSED
        to: REJECTED
        trigger: POST /engineering-changes/{ecoId}/customer-decision with decision=REJECTED
        actor: Customer
        preconditions:
          - "Caller owns the job's customer (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["BuildJob.open_eco_count recomputed"]
      - from: APPROVED
        to: VERIFIED
        trigger: POST /engineering-changes/{ecoId}/verify
        actor: ToolingEngineer
        preconditions:
          - "The linked ReworkAuthorization has status IN {COMPLETED, CANCELLED} (ERR_INVALID_STATE)"
        side_effects: ["BuildJob.open_eco_count recomputed"]

  - entity: ReworkAuthorization
    initial_state: AUTHORIZED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: AUTHORIZED
        to: IN_PROGRESS
        trigger: "POST /rework-authorizations/{raId}/start, or system via TryoutSample initiate-rework"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /rework-authorizations/{raId}/complete
        actor: ProjectManager
        preconditions:
          - "actual_cost_cents <= authorized_cost_cents (ERR_REWORK_COST_OVERRUN; boundary: equal is allowed)"
        side_effects: ["consumed_cost_cents = actual_cost_cents"]
      - from: AUTHORIZED
        to: CANCELLED
        trigger: POST /rework-authorizations/{raId}/cancel
        actor: ProjectManager
        preconditions: []
        side_effects: []

  - entity: ToolAsset
    initial_state: IN_BUILD
    terminal_states: []
    transitions:
      # --- physical_status dimension (independent axis) ---
      - from: IN_BUILD
        to: TRYOUT
        trigger: "system (first TryoutSample submit for the job)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TRYOUT
        to: AWAITING_SHIPMENT
        trigger: "system (TryoutSample BOUGHT_OFF)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TRYOUT
        to: IN_BUILD
        trigger: "system (ECO approval regression)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWAITING_SHIPMENT
        to: IN_BUILD
        trigger: "system (ECO approval regression)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWAITING_SHIPMENT
        to: IN_TRANSIT
        trigger: POST /tool-assets/{toolId}/ship
        actor: ProjectManager
        preconditions:
          - "BuildJob.status == READY_TO_SHIP (ERR_INVALID_STATE) — state check precedes the fiscal lien check"
          - "outstanding_cents <= floor(contract_value_cents * 0.15) (ERR_RETENTION_LIEN_BLOCK; boundary: equal is allowed)"
        side_effects:
          - "carrier, tracking_number, shipped_at set"
          - "BuildJob READY_TO_SHIP -> SHIPPED"
      - from: IN_TRANSIT
        to: IN_PRODUCTION
        trigger: POST /tool-assets/{toolId}/deliver
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "delivered_at set"
          - "Ownership evaluation: if net_paid_cents >= contract_value_cents then ownership_status SHOP_RETAINED -> TRANSFERRED and BuildJob SHIPPED -> CLOSED"
      - from: IN_PRODUCTION
        to: RETURNED_FOR_REPAIR
        trigger: "system (WarrantyClaim review APPROVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED_FOR_REPAIR
        to: IN_PRODUCTION
        trigger: "system (WarrantyClaim close)"
        actor: system
        preconditions: []
        side_effects: []
      # --- ownership_status dimension (independent axis, one-way) ---
      - from: SHOP_RETAINED
        to: TRANSFERRED
        trigger: "system (on POST /build-jobs/{jobId}/payments or deliver, when net_paid_cents >= contract_value_cents AND physical_status == IN_PRODUCTION)"
        actor: system
        preconditions: []
        side_effects:
          - "Retention lien released"
          - "BuildJob SHIPPED -> CLOSED"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [CLOSED, DENIED]
    transitions:
      - from: FILED
        to: REPAIR_SCHEDULED
        trigger: POST /warranty-claims/{claimId}/review with decision=APPROVE
        actor: QualityManager
        preconditions: []
        side_effects:
          - "approved_credit_cents computed per warranty_proration_credit (variant per ToolAsset.warranty_terms)"
          - "ToolAsset.physical_status IN_PRODUCTION -> RETURNED_FOR_REPAIR"
      - from: FILED
        to: DENIED
        trigger: POST /warranty-claims/{claimId}/review with decision=DENY
        actor: QualityManager
        preconditions:
          - "denial_reason must be non-empty (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: REPAIR_SCHEDULED
        to: CLOSED
        trigger: POST /warranty-claims/{claimId}/close
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "ToolAsset.physical_status RETURNED_FOR_REPAIR -> IN_PRODUCTION"

  - entity: SpareInsert
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (allocate drives on_hand to exactly 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (restock with quantity >= 1)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DISCONTINUED
        trigger: POST /spare-inserts/{insertId}/discontinue
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: DISCONTINUED
        trigger: POST /spare-inserts/{insertId}/discontinue
        actor: ProjectManager
        preconditions: []
        side_effects: []

  - entity: PressReservation
    initial_state: RESERVED
    terminal_states: [CANCELLED]
    transitions:
      - from: RESERVED
        to: CANCELLED
        trigger: POST /press-reservations/{resId}/cancel
        actor: ProjectManager
        preconditions:
          - "No TryoutSample references this reservation with status IN {SCHEDULED, SUBMITTED} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: MachineReservation
    initial_state: RESERVED
    terminal_states: [CANCELLED]
    transitions:
      - from: RESERVED
        to: CANCELLED
        trigger: POST /machine-reservations/{resId}/cancel
        actor: ProjectManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-design
    parent_entity: ToolDesign
    write_endpoint: "POST /quotes"
    occ_field: "expected_tool_design_version"
    description: |
      Creating a Quote against a ToolDesign whose version has advanced since the
      client last observed it (e.g. a revision was released, or another quote was
      created against the design, bumping quoted_count and version) is rejected;
      the quote prices a stale design baseline.
    error_id: ERR_STALE_TOOL_DESIGN_VERSION
    http_status: 412
  - rule_id: eco-create-stale-job
    parent_entity: BuildJob
    write_endpoint: "POST /engineering-changes"
    occ_field: "expected_build_job_version"
    description: |
      Creating an EngineeringChange against a BuildJob whose version has advanced
      since the client last observed it (e.g. a milestone completion or a payment
      re-baselined the job) is rejected; the change would be assessed against a
      stale contract baseline.
    error_id: ERR_STALE_BUILD_JOB_VERSION
    http_status: 412
  - rule_id: payment-post-stale-job
    parent_entity: BuildJob
    write_endpoint: "POST /build-jobs/{jobId}/payments"
    occ_field: "expected_build_job_version"
    description: |
      Recording a payment against a BuildJob whose version has advanced since the
      client last observed it (e.g. an ECO credit re-baselined invoice balances)
      is rejected; the waterfall allocation would run against stale balances.
    error_id: ERR_STALE_BUILD_JOB_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_price_calculation
    trigger: "POST /quotes (at creation; all computed price fields frozen on the quote thereafter)"
    algorithm: tiered_pricing
    formula: |
      Exact-decimal arithmetic throughout; round_half_up to integer cents ONLY at step 5.
      1. base_price_cents = CLASS_BASE_CENTS[die_class]
             + cavity_count * CAVITY_RATE_CENTS[die_class]
             + design_complexity_score * COMPLEXITY_RATE_CENTS
         (die_class, cavity_count, design_complexity_score read from the referenced ToolDesign)
      2. compression_weeks = max(0, STANDARD_LEAD_WEEKS[die_class] - requested_lead_weeks)
         surcharge_pct = min(0.04 * compression_weeks, 0.40)
      3. subtotal = base_price_cents * (1 + surcharge_pct)
         if expedited: subtotal = subtotal * 1.10
         subtotal_cents = round_half_up(subtotal)   # pinned sub-step rounding
      4. contingency_pct = 0.15 if quote_kind == BUDGETARY else 0.05
      5. total_price_cents = round_half_up(subtotal_cents * (1 + contingency_pct))
    input_set: "The referenced ToolDesign (any status allowed at create; FIRM gating happens at issue); quote inputs requested_lead_weeks, expedited, quote_kind"
    constants:
      CLASS_BASE_CENTS: {CLASS_101: 12000000, CLASS_102: 9000000, CLASS_103: 6500000, CLASS_104: 4000000, CLASS_105: 1800000}
      CAVITY_RATE_CENTS: {CLASS_101: 800000, CLASS_102: 650000, CLASS_103: 500000, CLASS_104: 350000, CLASS_105: 200000}
      COMPLEXITY_RATE_CENTS: 150000
      STANDARD_LEAD_WEEKS: {CLASS_101: 20, CLASS_102: 16, CLASS_103: 12, CLASS_104: 10, CLASS_105: 6}
      MIN_LEAD_WEEKS: {CLASS_101: 12, CLASS_102: 10, CLASS_103: 8, CLASS_104: 6, CLASS_105: 3}
      COMPRESSION_SURCHARGE_PER_WEEK: 0.05
      COMPRESSION_SURCHARGE_CAP: 0.40
      EXPEDITED_MULTIPLIER: 1.10
      CONTINGENCY: {BUDGETARY: 0.15, FIRM: 0.05}
      VALIDITY_DAYS: {BUDGETARY: 14, FIRM: 30}
    precision: "integer cents; round_half_up at steps 3 and 5 only"
    variants:
      - name: BUDGETARY
        when: "quote_kind == BUDGETARY"
        difference: "contingency_pct = 0.15 and valid_until = issued_at + 14 days"
      - name: FIRM
        when: "quote_kind == FIRM"
        difference: "contingency_pct = 0.05 and valid_until = issued_at + 30 days; additionally requires design RELEASED at issue time"

  - name: milestone_billing_schedule
    trigger: "POST /build-jobs (initial six milestones) and EngineeringChange APPROVED (replan of PENDING/REOPENED milestones)"
    algorithm: waterfall_allocation
    formula: |
      Canonical billing_pct by seq: [20, 25, 25, 15, 10, 5]; codes by seq:
      1 DESIGN_COMPLETE, 2 MATERIAL_STAGED, 3 MACHINING_COMPLETE,
      4 T1_TRYOUT_DONE, 5 BUYOFF_SIGNED, 6 DELIVERY_ACCEPTED.
      PINNED ROUNDING ORDER (order matters; this is the only sanctioned order):
      - For milestones seq 1..5 in the set being (re)planned:
        planned_amount_cents[i] = round_half_up(contract_value_cents * billing_pct[i] / 100)
      - The HIGHEST-seq milestone in the (re)planned set absorbs the remainder:
        planned_amount_cents[k] += contract_value_cents
            - SUM(planned over milestones NOT in the (re)planned set)
            - SUM(planned over the (re)planned set as computed above, before absorption)
      At creation the (re)planned set is all six, so milestone 6 = contract - SUM(seq 1..5).
      At ECO approval the (re)planned set is milestones with status IN {PENDING, REOPENED};
      milestones with status IN {EARNED, INVOICED, PAID} keep their locked planned_amount_cents,
      and the remainder is absorbed by the highest-seq milestone in the replanned set, so
      SUM(all six planned) == new contract_value_cents exactly.
    input_set: "BuildJob.contract_value_cents (post-re-baseline on ECO); the six BuildMilestone rows"
    constants:
      BILLING_PCT: [20, 25, 25, 15, 10, 5]
    precision: "integer cents; round_half_up per milestone line BEFORE remainder absorption"

  - name: payment_waterfall_allocation
    trigger: "POST /build-jobs/{jobId}/payments"
    algorithm: waterfall_allocation
    formula: |
      Eligible invoices: ProgressInvoice of the job with status IN {ISSUED, PARTIALLY_PAID}
      (VOID excluded; PAID excluded). Order: due_date ASC, tie-break created_at ASC.
      remaining = amount_cents
      For each eligible invoice in order:
        applied = min(invoice.balance_due_cents, remaining)
        record {invoice_id, applied_cents: applied} (skip if applied == 0)
        invoice.paid_cents += applied; balance_due_cents recomputed
        if balance_due_cents == 0: invoice -> PAID (and milestone bubble-up) else invoice -> PARTIALLY_PAID
        remaining -= applied
      Pre-check (before any allocation): if amount_cents > SUM(balance_due_cents over eligible
      invoices) the whole payment is rejected with ERR_OVERPAYMENT (atomic; nothing is applied).
      Segregation-of-duties pre-check runs BEFORE the overpayment check: simulate the allocation
      above over eligible invoices; if any invoice that would receive applied > 0 has
      issued_by_user_id == caller X-User-ID, reject with ERR_SEGREGATION_OF_DUTIES.
    input_set: "Job's ProgressInvoice rows with status IN {ISSUED, PARTIALLY_PAID}"
    constants: {}
    precision: "integer cents; exact, no rounding"

  - name: warranty_proration_credit
    trigger: "POST /warranty-claims/{claimId}/review with decision=APPROVE"
    algorithm: decay_function
    formula: |
      repair_base_cents = min(claim.estimated_repair_cost_cents, tool.contract_snapshot_cents)
      shots_used = claim.claimed_at_shot_count   (snapshot at filing)
      limit = tool.warranty_shot_limit
      LINEAR_PRORATION:
        approved_credit_cents = round_half_up(repair_base_cents * max(0, limit - shots_used) / limit)
      DECLINING_BALANCE:
        approved_credit_cents = round_half_up(repair_base_cents * max(0, (1 - shots_used/limit))^2)
      Filing eligibility (checked at POST /warranty-claims, NOT here):
        claimed_at_shot_count <= limit (boundary inclusive; ERR_WARRANTY_SHOT_LIMIT_EXCEEDED above)
        AND now <= tool.warranty_expires_at (ERR_WARRANTY_TIME_EXPIRED; time check wins ties).
    input_set: "The WarrantyClaim and its ToolAsset"
    constants:
      WARRANTY_SHOT_LIMIT: {CLASS_101: 1000000, CLASS_102: 500000, CLASS_103: 250000, CLASS_104: 100000, CLASS_105: 10000}
      WARRANTY_DAYS: 730
    precision: "integer cents; round_half_up final step"
    variants:
      - name: LINEAR_PRORATION
        when: "tool.warranty_terms == LINEAR_PRORATION"
        difference: "credit decays linearly with shot usage"
      - name: DECLINING_BALANCE
        when: "tool.warranty_terms == DECLINING_BALANCE"
        difference: "credit decays with the SQUARE of remaining life; identical inputs yield a strictly smaller credit whenever 0 < shots_used < limit"

  - name: eco_impact_reprice
    trigger: "POST /engineering-changes/{ecoId}/assess"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (the schedule penalty looks circular — its base includes the
      impact cost but MUST exclude the penalty itself; evaluate exactly in this order):
      1. labor_cost_cents = round_half_up(rework_hours * CLASS_LABOR_RATE_CENTS[job.die_class])
      2. material_cost_cents = round_half_up(scrapped_material_cost_cents * 1.15)
      3. impact_cost_cents = labor_cost_cents + material_cost_cents
      4. interim_value_cents = job.contract_value_cents + impact_cost_cents
      5. schedule_penalty_cents = 0 if lead_extension_weeks <= 2
         else round_half_up((lead_extension_weeks - 2) * 0.01 * interim_value_cents)
      6. total_charge_cents = impact_cost_cents + schedule_penalty_cents
      On customer APPROVED: job.contract_value_cents += total_charge_cents, then
      milestone_billing_schedule replan runs against the new value.
    input_set: "EngineeringChange assess inputs + BuildJob.die_class + BuildJob.contract_value_cents"
    constants:
      CLASS_LABOR_RATE_CENTS: {CLASS_101: 14500, CLASS_102: 13500, CLASS_103: 12500, CLASS_104: 11500, CLASS_105: 10500}
      MATERIAL_MARKUP: 1.15
      PENALTY_FREE_EXTENSION_WEEKS: 2
      PENALTY_PCT_PER_WEEK: 0.01
    precision: "integer cents; round_half_up at steps 1, 2, 5"

  - name: press_window_conflict_check
    trigger: "POST /press-reservations"
    algorithm: interval_merge
    formula: |
      Half-open interval semantics: a reservation occupies [start_time, end_time).
      Conflict iff another PressReservation with the same press_id and status == RESERVED has
        NOT (new.end_time <= existing.start_time OR new.start_time >= existing.end_time)
      Adjacency is allowed: new.start_time == existing.end_time does NOT conflict.
      end_time must be > start_time and start_time >= now (ERR_INVALID_TIME_WINDOW otherwise).
    input_set: "PressReservation rows with same press_id, status RESERVED"
    constants: {}
    precision: "second precision on ISO8601 datetimes"

  - name: machine_window_and_capacity_check
    trigger: "POST /machine-reservations"
    algorithm: interval_merge
    formula: |
      BUFFER-EXTENDED semantics (different from press windows): each machine reservation blocks
      [start_time, end_time + COOLDOWN_BUFFER_HOURS). Conflict iff another MachineReservation
      with same machine_id and status == RESERVED has
        NOT (new.start_time >= existing.end_time + 4h OR existing.start_time >= new.end_time + 4h)
      Therefore new.start_time == existing.end_time STILL CONFLICTS (inside the cool-down),
      while new.start_time == existing.end_time + 4h is allowed.
      PLUS aggregate capacity: for the ISO week (Monday 00:00 UTC bucket) containing
      new.start_time, SUM(duration_hours of RESERVED reservations of this machine starting in
      that week) + new.duration_hours <= 45.0 (boundary inclusive; ERR_MACHINE_CAPACITY_EXCEEDED).
    input_set: "MachineReservation rows with same machine_id, status RESERVED"
    constants:
      COOLDOWN_BUFFER_HOURS: 4
      WEEKLY_CAPACITY_HOURS: 45.0
    precision: "duration_hours to 0.01h; capacity comparison at exact boundary"

  - name: lien_release_threshold
    trigger: "POST /tool-assets/{toolId}/ship and ownership transfer evaluation"
    algorithm: threshold
    formula: |
      ship_allowed_outstanding_cents = floor(job.contract_value_cents * 0.15)
      Shipping requires job.outstanding_cents <= ship_allowed_outstanding_cents
      (boundary INCLUSIVE: outstanding == threshold ships; threshold + 1 is blocked).
      Ownership TRANSFERRED requires net_paid_cents >= contract_value_cents (exact-cent test)
      AND tool.physical_status == IN_PRODUCTION; evaluated after every payment and at deliver.
    input_set: "BuildJob computed fields + ToolAsset.physical_status"
    constants:
      SHIP_OUTSTANDING_PCT: 0.15
    precision: "integer cents; floor on the threshold"

  - name: tool_life_shot_accounting
    trigger: "TryoutSample submit (+shots), POST /shot-reports (+shots), POST /shot-reports/{id}/reverse (-shots)"
    algorithm: aggregation
    formula: |
      tryout_shots = SUM(TryoutSample.shots_used) over samples of the job with status != SCHEDULED
                     (shots_used is non-null exactly after submit)
      reported_shots = SUM(ShotReport.shots_in_period) over reports of the tool with status == ACTIVE
      lifetime_shots = tryout_shots + reported_shots
      CONSERVED QUANTITY (compensating invariant): a shot report of S shots followed by its
      reversal leaves lifetime_shots unchanged. Reversal is blocked (ERR_SHOT_REVERSAL_BLOCKED)
      when any WarrantyClaim of the tool with status IN {FILED, REPAIR_SCHEDULED} has
      claimed_at_shot_count > lifetime_shots - S.
    input_set: "TryoutSample rows of the job; ShotReport rows of the tool"
    constants: {}
    precision: "integer shots; exact"

  - name: spare_insert_reorder_flag
    trigger: "SpareInsert create / allocate / restock"
    algorithm: threshold
    formula: |
      allocate(q): requires tool.physical_status == IN_PRODUCTION (ERR_TOOL_NOT_IN_PRODUCTION),
        status != DISCONTINUED (ERR_INVALID_STATE), q >= 1, q <= on_hand (ERR_INSUFFICIENT_STOCK;
        boundary: q == on_hand succeeds and flips status ACTIVE -> DEPLETED)
      restock(q): q >= 1; on_hand += q; if on_hand > 0 and status == DEPLETED: -> ACTIVE
      reorder_needed = (on_hand <= reorder_point)  # boundary INCLUSIVE
    input_set: "The SpareInsert row + ToolAsset.physical_status"
    constants: {}
    precision: "integer units"

  - name: customer_credit_and_suspension
    trigger: "Quote respond ACCEPTED (credit check); clock-set sweep and payment recording (suspension)"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = SUM(balance_due_cents) over all ProgressInvoice of the
        customer's jobs with status IN {ISSUED, PARTIALLY_PAID}
      Credit gate (quote accept): credit_limit_cents == 0 (unlimited) OR
        outstanding_balance_cents + quote.total_price_cents <= credit_limit_cents
        (boundary INCLUSIVE; else ERR_CREDIT_LIMIT_EXCEEDED)
      Suspension sweep: customer -> SUSPENDED iff any open invoice has now > due_date + 10 days;
        -> ACTIVE when none remain (evaluated on clock-set sweep and after each payment).
    input_set: "ProgressInvoice rows joined through BuildJob.customer_id"
    constants:
      NET_TERMS_DAYS: 30
      GRACE_DAYS: 10
    precision: "integer cents; datetime comparisons to the second"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present, unknown payload keys rejected, enum values in-domain, integer/number ranges respected (cavity_count 1..64, design_complexity_score 1..20, requested_lead_weeks >= 1, affects_from_milestone_seq 1..6, amounts >= 0/1 as declared), defect_codes non-empty on buyoff REJECTED, denial_reason non-empty on claim DENY"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; then body FK references exist (customer_id, tool_design_id, quote_id, build_job_id, press_reservation_id, tool_asset_id, rework_authorization_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: auth
    check: "Entity-backed ownership: a Customer caller may only act on resources whose owning customer_id == X-User-ID (design submit, quote respond, ECO create/customer-decision, milestone seq-5 complete, shot reports, warranty claims)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-role endpoints"
  - priority: 6
    category: business_constraint
    check: "OCC: expected_tool_design_version (POST /quotes) / expected_build_job_version (POST /engineering-changes, POST /build-jobs/{id}/payments) must equal the parent's current version"
    error_id: "ERR_STALE_TOOL_DESIGN_VERSION | ERR_STALE_BUILD_JOB_VERSION"
    http_status: 412
    applies_to: "POST /quotes; POST /engineering-changes; POST /build-jobs/{jobId}/payments"
  - priority: 7
    category: state
    check: "Target resource state precondition per state machine (e.g. quote ISSUED for respond, milestone PENDING/REOPENED for complete, sample SUBMITTED for buyoff, job not ON_HOLD for operational actions ERR_JOB_ON_HOLD, job phase gates ERR_JOB_PHASE_MISMATCH, reservation RESERVED, claim FILED for review, rework authorization IN_PROGRESS for complete, tool AWAITING_SHIPMENT + job READY_TO_SHIP for ship)"
    error_id: "ERR_INVALID_STATE | ERR_JOB_ON_HOLD | ERR_JOB_PHASE_MISMATCH"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: the FinanceAdmin recording a payment must not be the issuer (issued_by_user_id) of any invoice that would receive an allocation (simulated waterfall)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /build-jobs/{jobId}/payments"
  - priority: 9
    category: business_temporal
    check: "Time rules: reservation end_time > start_time and start_time >= now (ERR_INVALID_TIME_WINDOW); tryout submit inside the press window (ERR_OUTSIDE_RESERVATION_WINDOW); quote respond before valid_until (ERR_QUOTE_EXPIRED, auto-expires the quote); warranty claim now <= warranty_expires_at (ERR_WARRANTY_TIME_EXPIRED — wins over the shot-limit check when both fail); shot report period_end <= now (ERR_INVALID_TIME_WINDOW)"
    error_id: "ERR_INVALID_TIME_WINDOW | ERR_OUTSIDE_RESERVATION_WINDOW | ERR_QUOTE_EXPIRED | ERR_WARRANTY_TIME_EXPIRED"
    http_status: 422
    applies_to: "reservation creates, tryout submit, quote respond, warranty claim filing, shot report"
  - priority: 10
    category: business_constraint
    check: "Resource/graph constraints: press half-open overlap (ERR_PRESS_DOUBLE_BOOKED); machine buffer-extended overlap (ERR_MACHINE_WINDOW_CONFLICT); machine weekly 45h capacity (ERR_MACHINE_CAPACITY_EXCEEDED); milestone completion in seq order (ERR_MILESTONE_SEQUENCE_BLOCKED); milestone actor rule seq 5 = owning Customer else ProjectManager (ERR_MILESTONE_ACTOR_MISMATCH); at most one RELEASED design per (customer_id, part_number) (ERR_DUPLICATE_RELEASED_DESIGN); one BuildJob per quote (ERR_JOB_ALREADY_EXISTS); shot report period strictly increasing per tool (ERR_NON_MONOTONIC_SHOT_PERIOD); shot reversal guard (ERR_SHOT_REVERSAL_BLOCKED); stock sufficiency (ERR_INSUFFICIENT_STOCK); rework at round >= 3 needs authorization (ERR_REWORK_REQUIRES_AUTHORIZATION); rework cost <= authorized (ERR_REWORK_COST_OVERRUN); requested_lead_weeks >= MIN_LEAD_WEEKS[die_class] (ERR_LEAD_TIME_INFEASIBLE)"
    error_id: "ERR_PRESS_DOUBLE_BOOKED | ERR_MACHINE_WINDOW_CONFLICT | ERR_MACHINE_CAPACITY_EXCEEDED | ERR_MILESTONE_SEQUENCE_BLOCKED | ERR_MILESTONE_ACTOR_MISMATCH | ERR_DUPLICATE_RELEASED_DESIGN | ERR_JOB_ALREADY_EXISTS | ERR_NON_MONOTONIC_SHOT_PERIOD | ERR_SHOT_REVERSAL_BLOCKED | ERR_INSUFFICIENT_STOCK | ERR_REWORK_REQUIRES_AUTHORIZATION | ERR_REWORK_COST_OVERRUN | ERR_LEAD_TIME_INFEASIBLE | ERR_NOTHING_TO_INVOICE"
    http_status: 409
    applies_to: "per-rule endpoints"
  - priority: 11
    category: business_referential
    check: "Cross-entity state gates: Customer.status == ACTIVE for quote create and quote accept (ERR_CUSTOMER_SUSPENDED); FIRM quote issue requires design RELEASED (ERR_DESIGN_NOT_RELEASED); tryout create requires job IN_BUILD|TRYOUT_PHASE; spare allocate, shot reports, warranty claims require tool physical_status IN_PRODUCTION (claims also allow RETURNED_FOR_REPAIR) (ERR_TOOL_NOT_IN_PRODUCTION); build job creation requires quote ACCEPTED (ERR_QUOTE_NOT_ACCEPTED)"
    error_id: "ERR_CUSTOMER_SUSPENDED | ERR_DESIGN_NOT_RELEASED | ERR_TOOL_NOT_IN_PRODUCTION | ERR_QUOTE_NOT_ACCEPTED"
    http_status: 409
    applies_to: "cross-entity gated endpoints"
  - priority: 12
    category: business_fiscal
    check: "Money gates (last): payment amount <= total eligible balance (ERR_OVERPAYMENT); ship outstanding <= floor(contract * 0.15) (ERR_RETENTION_LIEN_BLOCK); quote accept within credit limit (ERR_CREDIT_LIMIT_EXCEEDED)"
    error_id: "ERR_OVERPAYMENT | ERR_RETENTION_LIEN_BLOCK | ERR_CREDIT_LIMIT_EXCEEDED"
    http_status: 402
    applies_to: "payments, ship, quote respond"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (flat; list endpoints default-sort deterministically)
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Onboard a customer"
    roles: [ShopAdmin]
    code: 201
    input: [company_name, contact_email, "credit_limit_cents?"]
    output: Customer
    side_effects: ["status = ACTIVE; outstanding_balance_cents = 0"]
  - method: GET
    path: "/customers"
    description: "List customers (sort created_at ASC)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Customer[]"
    side_effects: []
  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer"
    roles: [Any]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- ToolDesign ---
  - method: POST
    path: "/tool-designs"
    description: "Customer submits part data for a new tool design (revision_number = 1)"
    roles: [Customer]
    code: 201
    input: [customer_id, part_number, tool_type, die_class, cavity_count, design_complexity_score]
    output: ToolDesign
    side_effects: ["status = DRAFT; customer_id must equal caller X-User-ID (ERR_NOT_RESOURCE_OWNER)"]
  - method: GET
    path: "/tool-designs"
    description: "List designs (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?", "part_number?"]
    output: "ToolDesign[]"
    side_effects: []
  - method: GET
    path: "/tool-designs/{designId}"
    description: "Get a design"
    roles: [Any]
    code: 200
    input: []
    output: ToolDesign
    side_effects: []
  - method: POST
    path: "/tool-designs/{designId}/submit"
    description: "Submit design for shop review (DRAFT -> SUBMITTED)"
    roles: [Customer]
    code: 200
    input: []
    output: ToolDesign
    side_effects: ["increments ToolDesign.version"]
  - method: POST
    path: "/tool-designs/{designId}/review"
    description: "Shop engineering review; decision RELEASED or REJECTED (REJECTED returns design to DRAFT)"
    roles: [ToolingEngineer]
    code: 200
    input: [decision, "review_note?"]
    output: ToolDesign
    side_effects: ["on RELEASED: supersede chain head if still RELEASED; increments version"]
  - method: POST
    path: "/tool-designs/{designId}/revise"
    description: "Create the next revision (new ToolDesign DRAFT, revision_number + 1, supersedes_design_id = this design); allowed from RELEASED or SUBMITTED"
    roles: [ToolingEngineer]
    code: 201
    input: ["cavity_count?", "design_complexity_score?", "die_class?", "tool_type?"]
    output: ToolDesign
    side_effects: ["new design inherits part_number/customer_id and any fields not overridden"]

  # --- Quote ---
  - method: POST
    path: "/quotes"
    description: "Create a quote (DRAFT) priced per quote_price_calculation; OCC-guarded against the design version"
    roles: [Estimator]
    code: 201
    input: [customer_id, tool_design_id, quote_kind, requested_lead_weeks, "expedited?", "warranty_terms?", expected_tool_design_version]
    output: Quote
    side_effects:
      - "computes base_price_cents, surcharge_pct, subtotal_cents, contingency_pct, total_price_cents"
      - "design.quoted_count += 1; increments ToolDesign.version by 1"
      - "lead feasibility: requested_lead_weeks >= MIN_LEAD_WEEKS[die_class] (ERR_LEAD_TIME_INFEASIBLE)"
      - "customer must be ACTIVE (ERR_CUSTOMER_SUSPENDED)"
  - method: GET
    path: "/quotes"
    description: "List quotes (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "tool_design_id?", "status?"]
    output: "Quote[]"
    side_effects: []
  - method: GET
    path: "/quotes/{quoteId}"
    description: "Get a quote"
    roles: [Any]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: POST
    path: "/quotes/{quoteId}/issue"
    description: "Issue a DRAFT quote (sets issued_at/valid_until from logical clock; supersedes other ISSUED quotes for the same design)"
    roles: [Estimator]
    code: 200
    input: []
    output: Quote
    side_effects: ["FIRM requires design RELEASED (ERR_DESIGN_NOT_RELEASED); older ISSUED quotes for same design -> SUPERSEDED"]
  - method: POST
    path: "/quotes/{quoteId}/respond"
    description: "Customer accepts or declines an ISSUED quote"
    roles: [Customer]
    code: 200
    input: [decision]
    output: Quote
    side_effects: ["on now > valid_until: quote -> EXPIRED and call fails ERR_QUOTE_EXPIRED; ACCEPTED runs credit gate"]

  # --- BuildJob ---
  - method: POST
    path: "/build-jobs"
    description: "Create a build job from an ACCEPTED quote; mints six milestones and the ToolAsset"
    roles: [ProjectManager]
    code: 201
    input: [quote_id]
    output: BuildJob
    side_effects:
      - "quote must be ACCEPTED (ERR_QUOTE_NOT_ACCEPTED); one job per quote (ERR_JOB_ALREADY_EXISTS)"
      - "creates 6 BuildMilestone rows per milestone_billing_schedule"
      - "creates ToolAsset (physical IN_BUILD, ownership SHOP_RETAINED, warranty fields from die class, contract_snapshot_cents = quote.total_price_cents, warranty_terms copied)"
  - method: GET
    path: "/build-jobs"
    description: "List build jobs (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?"]
    output: "BuildJob[]"
    side_effects: []
  - method: GET
    path: "/build-jobs/{jobId}"
    description: "Get a build job (all computed fields current)"
    roles: [Any]
    code: 200
    input: []
    output: BuildJob
    side_effects: []
  - method: POST
    path: "/build-jobs/{jobId}/advance"
    description: "Advance job status; legal targets: BOOKED->IN_BUILD, BUYOFF_PASSED->READY_TO_SHIP"
    roles: [ProjectManager]
    code: 200
    input: [target_state]
    output: BuildJob
    side_effects: ["increments BuildJob.version"]
  - method: POST
    path: "/build-jobs/{jobId}/hold"
    description: "Put an active job ON_HOLD (captures hold_return_state)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: BuildJob
    side_effects: ["increments BuildJob.version"]
  - method: POST
    path: "/build-jobs/{jobId}/resume"
    description: "Resume an ON_HOLD job back to hold_return_state"
    roles: [ProjectManager]
    code: 200
    input: []
    output: BuildJob
    side_effects: ["increments BuildJob.version"]
  - method: POST
    path: "/build-jobs/{jobId}/payments"
    description: "Record a customer payment; waterfall-allocates across open invoices; OCC-guarded"
    roles: [FinanceAdmin]
    code: 201
    input: [amount_cents, expected_build_job_version]
    output: Payment
    side_effects:
      - "payment_waterfall_allocation (SoD check ERR_SEGREGATION_OF_DUTIES, then ERR_OVERPAYMENT)"
      - "invoice -> PARTIALLY_PAID/PAID; milestone INVOICED -> PAID bubble-up"
      - "recomputes paid_cents, credit_balance_cents, net_paid_cents, outstanding_cents; increments BuildJob.version by 1"
      - "if net_paid_cents >= contract_value_cents and tool IN_PRODUCTION: ownership SHOP_RETAINED -> TRANSFERRED, job SHIPPED -> CLOSED"
      - "customer suspension re-evaluated"
  - method: GET
    path: "/build-jobs/{jobId}/summary"
    description: "Computed billing/lien summary for a job"
    roles: [Any]
    code: 200
    input: []
    output: {build_job_id: string, contract_value_cents: integer, billed_cents: integer, paid_cents: integer, credit_balance_cents: integer, net_paid_cents: integer, outstanding_cents: integer, ship_release_threshold_cents: integer, ship_release_allowed: boolean, open_eco_count: integer, ownership_status: string}
    side_effects: []

  # --- BuildMilestone ---
  - method: GET
    path: "/build-milestones"
    description: "List milestones (sort build_job_id ASC then seq ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "build_job_id?", "status?"]
    output: "BuildMilestone[]"
    side_effects: []
  - method: GET
    path: "/build-milestones/{milestoneId}"
    description: "Get a milestone"
    roles: [Any]
    code: 200
    input: []
    output: BuildMilestone
    side_effects: []
  - method: POST
    path: "/build-milestones/{milestoneId}/complete"
    description: "Mark a milestone EARNED (seq-ordered; seq 5 restricted to owning Customer; gates per state machine)"
    roles: [ProjectManager, Customer]
    code: 200
    input: ["completion_note?"]
    output: BuildMilestone
    side_effects: ["completed_at = now"]
  - method: POST
    path: "/build-milestones/{milestoneId}/invoice"
    description: "Issue a progress invoice for an EARNED milestone (amount = planned - already paid on milestone)"
    roles: [FinanceAdmin]
    code: 201
    input: []
    output: ProgressInvoice
    side_effects: ["milestone EARNED -> INVOICED; BuildJob.billed_cents recomputed; invoice issued_by_user_id = caller"]

  # --- ProgressInvoice / Payment reads ---
  - method: GET
    path: "/progress-invoices"
    description: "List invoices (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "build_job_id?", "status?"]
    output: "ProgressInvoice[]"
    side_effects: []
  - method: GET
    path: "/progress-invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [Any]
    code: 200
    input: []
    output: ProgressInvoice
    side_effects: []
  - method: GET
    path: "/payments"
    description: "List payments (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "build_job_id?"]
    output: "Payment[]"
    side_effects: []
  - method: GET
    path: "/payments/{paymentId}"
    description: "Get a payment (with allocations)"
    roles: [Any]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # --- TryoutSample ---
  - method: POST
    path: "/tryout-samples"
    description: "Schedule a tryout round against a RESERVED press reservation; first sample moves job IN_BUILD -> TRYOUT_PHASE"
    roles: [ProjectManager]
    code: 201
    input: [build_job_id, press_reservation_id]
    output: TryoutSample
    side_effects: ["job must be IN_BUILD or TRYOUT_PHASE (ERR_JOB_PHASE_MISMATCH); reservation must be RESERVED; on create job IN_BUILD -> TRYOUT_PHASE"]
  - method: GET
    path: "/tryout-samples"
    description: "List tryout samples (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "build_job_id?", "status?"]
    output: "TryoutSample[]"
    side_effects: []
  - method: GET
    path: "/tryout-samples/{sampleId}"
    description: "Get a tryout sample"
    roles: [Any]
    code: 200
    input: []
    output: TryoutSample
    side_effects: []
  - method: POST
    path: "/tryout-samples/{sampleId}/submit"
    description: "Submit sampled parts (SCHEDULED -> SUBMITTED) inside the press window; shots accrue to tool life"
    roles: [ProjectManager]
    code: 200
    input: [sample_qty, shots_used, measured_report_ref]
    output: TryoutSample
    side_effects: ["tool.tryout_shots += shots_used; lifetime_shots recomputed; tool IN_BUILD -> TRYOUT on first submit"]
  - method: POST
    path: "/tryout-samples/{sampleId}/buyoff-decision"
    description: "Quality buyoff: BOUGHT_OFF (bubbles job to BUYOFF_PASSED, tool to AWAITING_SHIPMENT, starts warranty clock) or REJECTED (defect_codes required)"
    roles: [QualityManager]
    code: 200
    input: [decision, "defect_codes?"]
    output: TryoutSample
    side_effects: ["see TryoutSample/BuildJob/ToolAsset transitions"]
  - method: POST
    path: "/tryout-samples/{sampleId}/initiate-rework"
    description: "Loop a REJECTED sample back to SCHEDULED with round_number + 1; rounds >= 3 require a rework authorization"
    roles: [ProjectManager]
    code: 200
    input: ["rework_authorization_id?"]
    output: TryoutSample
    side_effects: ["round_number += 1; per-round fields reset; linked authorization AUTHORIZED -> IN_PROGRESS; job IN_BUILD -> TRYOUT_PHASE if regressed"]

  # --- EngineeringChange / ReworkAuthorization ---
  - method: POST
    path: "/engineering-changes"
    description: "File an engineering change against a job (SUBMITTED); OCC-guarded against the job version"
    roles: [ToolingEngineer, Customer]
    code: 201
    input: [build_job_id, requested_by, description, affects_from_milestone_seq, expected_build_job_version]
    output: EngineeringChange
    side_effects:
      - "requested_by must be SHOP for ToolingEngineer callers and CUSTOMER for Customer callers (ERR_INVALID_REQUEST); Customer callers must own the job (ERR_NOT_RESOURCE_OWNER)"
      - "job must be in IN_BUILD, TRYOUT_PHASE, BUYOFF_PASSED, or READY_TO_SHIP and not ON_HOLD (ERR_INVALID_STATE / ERR_JOB_ON_HOLD)"
      - "increments BuildJob.version by 1; open_eco_count recomputed"
  - method: GET
    path: "/engineering-changes"
    description: "List ECOs (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "build_job_id?", "status?"]
    output: "EngineeringChange[]"
    side_effects: []
  - method: GET
    path: "/engineering-changes/{ecoId}"
    description: "Get an ECO"
    roles: [Any]
    code: 200
    input: []
    output: EngineeringChange
    side_effects: []
  - method: POST
    path: "/engineering-changes/{ecoId}/assess"
    description: "Tooling impact assessment (SUBMITTED -> IMPACT_ASSESSED); computes the eco_impact_reprice fields"
    roles: [ToolingEngineer]
    code: 200
    input: [rework_hours, scrapped_material_cost_cents, lead_extension_weeks]
    output: EngineeringChange
    side_effects: ["computes labor_cost_cents, material_cost_cents, impact_cost_cents, schedule_penalty_cents, total_charge_cents"]
  - method: POST
    path: "/engineering-changes/{ecoId}/customer-decision"
    description: "Customer approves or rejects an IMPACT_ASSESSED change; approval fires the full re-baseline cascade"
    roles: [Customer]
    code: 200
    input: [decision]
    output: EngineeringChange
    side_effects: ["on APPROVED: ReworkAuthorization created; contract re-baselined; milestones REOPENED/replanned; open invoices VOIDed; job/tool regression"]
  - method: POST
    path: "/engineering-changes/{ecoId}/verify"
    description: "Verify implemented rework (APPROVED -> VERIFIED); requires linked authorization COMPLETED or CANCELLED"
    roles: [ToolingEngineer]
    code: 200
    input: []
    output: EngineeringChange
    side_effects: ["open_eco_count recomputed"]
  - method: GET
    path: "/rework-authorizations"
    description: "List rework authorizations (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "build_job_id?", "engineering_change_id?", "status?"]
    output: "ReworkAuthorization[]"
    side_effects: []
  - method: GET
    path: "/rework-authorizations/{raId}"
    description: "Get a rework authorization"
    roles: [Any]
    code: 200
    input: []
    output: ReworkAuthorization
    side_effects: []
  - method: POST
    path: "/rework-authorizations/{raId}/start"
    description: "Start authorized rework (AUTHORIZED -> IN_PROGRESS)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ReworkAuthorization
    side_effects: []
  - method: POST
    path: "/rework-authorizations/{raId}/complete"
    description: "Complete rework with actual cost (IN_PROGRESS -> COMPLETED); overrun rejected"
    roles: [ProjectManager]
    code: 200
    input: [actual_cost_cents]
    output: ReworkAuthorization
    side_effects: ["consumed_cost_cents = actual_cost_cents; ERR_REWORK_COST_OVERRUN if > authorized_cost_cents"]
  - method: POST
    path: "/rework-authorizations/{raId}/cancel"
    description: "Cancel an unused authorization (AUTHORIZED -> CANCELLED)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ReworkAuthorization
    side_effects: []

  # --- ToolAsset / shipping & lien ---
  - method: GET
    path: "/tool-assets"
    description: "List tool assets (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "build_job_id?", "physical_status?", "ownership_status?"]
    output: "ToolAsset[]"
    side_effects: []
  - method: GET
    path: "/tool-assets/{toolId}"
    description: "Get a tool asset"
    roles: [Any]
    code: 200
    input: []
    output: ToolAsset
    side_effects: []
  - method: POST
    path: "/tool-assets/{toolId}/ship"
    description: "Ship the tool (AWAITING_SHIPMENT -> IN_TRANSIT); retention-lien fiscal gate applies after state gate"
    roles: [ProjectManager]
    code: 200
    input: [carrier, tracking_number]
    output: ToolAsset
    side_effects: ["shipped_at set; job READY_TO_SHIP -> SHIPPED; ERR_RETENTION_LIEN_BLOCK when outstanding > floor(contract*0.15)"]
  - method: POST
    path: "/tool-assets/{toolId}/deliver"
    description: "Mark delivered into production (IN_TRANSIT -> IN_PRODUCTION); evaluates ownership transfer"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ToolAsset
    side_effects: ["delivered_at set; if net_paid >= contract: ownership TRANSFERRED + job CLOSED"]

  # --- ShotReport ---
  - method: POST
    path: "/shot-reports"
    description: "Customer reports production shots for a period (monotonic per tool)"
    roles: [Customer]
    code: 201
    input: [tool_asset_id, report_period_end, shots_in_period]
    output: ShotReport
    side_effects: ["tool.reported_shots += shots_in_period; lifetime_shots recomputed"]
  - method: GET
    path: "/shot-reports"
    description: "List shot reports (sort report_period_end ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "tool_asset_id?"]
    output: "ShotReport[]"
    side_effects: []
  - method: GET
    path: "/shot-reports/{reportId}"
    description: "Get a shot report"
    roles: [Any]
    code: 200
    input: []
    output: ShotReport
    side_effects: []
  - method: POST
    path: "/shot-reports/{reportId}/reverse"
    description: "Reverse an ACTIVE shot report (compensating action); blocked when it would invalidate a filed claim"
    roles: [Customer]
    code: 200
    input: []
    output: ShotReport
    side_effects: ["status ACTIVE -> REVERSED; tool.reported_shots -= shots_in_period; lifetime_shots recomputed"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/warranty-claims"
    description: "File a warranty claim; snapshots claimed_at_shot_count; enforces shot-limit and time-limit gates"
    roles: [Customer]
    code: 201
    input: [tool_asset_id, defect_description, estimated_repair_cost_cents]
    output: WarrantyClaim
    side_effects: ["claimed_at_shot_count = tool.lifetime_shots; ERR_WARRANTY_TIME_EXPIRED checked before ERR_WARRANTY_SHOT_LIMIT_EXCEEDED"]
  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "tool_asset_id?", "status?"]
    output: "WarrantyClaim[]"
    side_effects: []
  - method: GET
    path: "/warranty-claims/{claimId}"
    description: "Get a warranty claim"
    roles: [Any]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{claimId}/review"
    description: "Quality review: APPROVE (computes proration credit, tool -> RETURNED_FOR_REPAIR) or DENY (reason required)"
    roles: [QualityManager]
    code: 200
    input: [decision, "denial_reason?"]
    output: WarrantyClaim
    side_effects: ["see WarrantyClaim/ToolAsset transitions"]
  - method: POST
    path: "/warranty-claims/{claimId}/close"
    description: "Close a repaired claim (REPAIR_SCHEDULED -> CLOSED); tool returns IN_PRODUCTION"
    roles: [ProjectManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["tool RETURNED_FOR_REPAIR -> IN_PRODUCTION"]

  # --- SpareInsert ---
  - method: POST
    path: "/spare-inserts"
    description: "Register a spare-insert SKU for a tool"
    roles: [ProjectManager]
    code: 201
    input: [tool_asset_id, insert_code, unit_cost_cents, initial_on_hand, reorder_point]
    output: SpareInsert
    side_effects: ["on_hand = initial_on_hand; status = ACTIVE (or DEPLETED when initial_on_hand == 0)"]
  - method: GET
    path: "/spare-inserts"
    description: "List spare inserts (sort created_at ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "tool_asset_id?", "status?"]
    output: "SpareInsert[]"
    side_effects: []
  - method: GET
    path: "/spare-inserts/{insertId}"
    description: "Get a spare insert"
    roles: [Any]
    code: 200
    input: []
    output: SpareInsert
    side_effects: []
  - method: POST
    path: "/spare-inserts/{insertId}/allocate"
    description: "Allocate/sell inserts to the customer; requires tool IN_PRODUCTION; quantity <= on_hand"
    roles: [ProjectManager]
    code: 200
    input: [quantity]
    output: SpareInsert
    side_effects: ["on_hand -= quantity; DEPLETED at 0; reorder_needed recomputed"]
  - method: POST
    path: "/spare-inserts/{insertId}/restock"
    description: "Restock inserts; DEPLETED -> ACTIVE when on_hand > 0"
    roles: [ProjectManager]
    code: 200
    input: [quantity]
    output: SpareInsert
    side_effects: ["on_hand += quantity; reorder_needed recomputed"]
  - method: POST
    path: "/spare-inserts/{insertId}/discontinue"
    description: "Discontinue a spare insert (ACTIVE|DEPLETED -> DISCONTINUED)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: SpareInsert
    side_effects: []

  # --- PressReservation / MachineReservation ---
  - method: POST
    path: "/press-reservations"
    description: "Book a tryout press window (half-open interval; adjacency allowed; no overlap per press)"
    roles: [ProjectManager]
    code: 201
    input: [build_job_id, press_id, start_time, end_time]
    output: PressReservation
    side_effects: ["press_window_conflict_check"]
  - method: GET
    path: "/press-reservations"
    description: "List press reservations (sort start_time ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "build_job_id?", "press_id?", "status?"]
    output: "PressReservation[]"
    side_effects: []
  - method: GET
    path: "/press-reservations/{resId}"
    description: "Get a press reservation"
    roles: [Any]
    code: 200
    input: []
    output: PressReservation
    side_effects: []
  - method: POST
    path: "/press-reservations/{resId}/cancel"
    description: "Cancel a RESERVED press window (blocked while referenced by an open tryout sample)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: PressReservation
    side_effects: []
  - method: POST
    path: "/machine-reservations"
    description: "Reserve a CNC/EDM/grind block (4h cool-down buffer; 45h weekly capacity per machine)"
    roles: [ProjectManager]
    code: 201
    input: [build_job_id, machine_id, start_time, end_time]
    output: MachineReservation
    side_effects: ["machine_window_and_capacity_check"]
  - method: GET
    path: "/machine-reservations"
    description: "List machine reservations (sort start_time ASC); filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "build_job_id?", "machine_id?", "status?"]
    output: "MachineReservation[]"
    side_effects: []
  - method: GET
    path: "/machine-reservations/{resId}"
    description: "Get a machine reservation"
    roles: [Any]
    code: 200
    input: []
    output: MachineReservation
    side_effects: []
  - method: POST
    path: "/machine-reservations/{resId}/cancel"
    description: "Cancel a RESERVED machine block"
    roles: [ProjectManager]
    code: 200
    input: []
    output: MachineReservation
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601, must not move backward). Startup default before any set call is exactly 2026-08-01T00:00:00Z — never the real wall clock. Each set triggers the customer credit-aging suspension sweep."
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: {current_utc: string}
    side_effects: ["customer suspension sweep per customer_credit_and_suspension"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role missing or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer caller does not own the target resource" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Payment recorder issued at least one invoice that would receive an allocation" }
  # --- shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, out-of-range value, or malformed payload (incl. empty defect_codes on REJECTED, empty denial_reason on DENY, amount_cents < 1, requested_by/caller-role mismatch)" }
  - { id: ERR_INVALID_ENUM_VALUE, http: 400, condition: "Enum field value not in the declared domain (die_class, tool_type, quote_kind, decision, target_state, press_id, machine_id, warranty_terms)" }
  # --- not found ---
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer_id does not exist" }
  - { id: ERR_TOOL_DESIGN_NOT_FOUND, http: 404, condition: "tool_design_id / designId does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "quote_id / quoteId does not exist" }
  - { id: ERR_BUILD_JOB_NOT_FOUND, http: 404, condition: "build_job_id / jobId does not exist" }
  - { id: ERR_BUILD_MILESTONE_NOT_FOUND, http: 404, condition: "milestoneId does not exist" }
  - { id: ERR_PROGRESS_INVOICE_NOT_FOUND, http: 404, condition: "invoiceId does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "paymentId does not exist" }
  - { id: ERR_TRYOUT_SAMPLE_NOT_FOUND, http: 404, condition: "sampleId does not exist" }
  - { id: ERR_ENGINEERING_CHANGE_NOT_FOUND, http: 404, condition: "ecoId does not exist" }
  - { id: ERR_REWORK_AUTHORIZATION_NOT_FOUND, http: 404, condition: "rework_authorization_id / raId does not exist" }
  - { id: ERR_TOOL_ASSET_NOT_FOUND, http: 404, condition: "tool_asset_id / toolId does not exist" }
  - { id: ERR_SHOT_REPORT_NOT_FOUND, http: 404, condition: "reportId does not exist" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "claimId does not exist" }
  - { id: ERR_SPARE_INSERT_NOT_FOUND, http: 404, condition: "insertId does not exist" }
  - { id: ERR_PRESS_RESERVATION_NOT_FOUND, http: 404, condition: "press_reservation_id / resId does not exist" }
  - { id: ERR_MACHINE_RESERVATION_NOT_FOUND, http: 404, condition: "resId (machine) does not exist" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure (wrong from-state, terminal-state lockdown, illegal advance target, double reverse, reservation not RESERVED, discontinued insert, sample-referenced reservation cancel, rework auth not COMPLETED at verify)" }
  - { id: ERR_JOB_ON_HOLD, http: 409, condition: "Operation not permitted while BuildJob is ON_HOLD" }
  - { id: ERR_JOB_PHASE_MISMATCH, http: 409, condition: "Tryout create/submit requires job IN_BUILD/TRYOUT_PHASE or TRYOUT_PHASE respectively" }
  - { id: ERR_QUOTE_NOT_ACCEPTED, http: 409, condition: "Build job creation requires quote status ACCEPTED" }
  - { id: ERR_JOB_ALREADY_EXISTS, http: 409, condition: "A build job already exists for this quote" }
  # --- temporal ---
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "end_time <= start_time, reservation start in the past, or shot report period_end in the future" }
  - { id: ERR_OUTSIDE_RESERVATION_WINDOW, http: 409, condition: "Tryout submit outside [start_time, end_time) of the linked press reservation" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Respond after valid_until; quote transitions ISSUED -> EXPIRED" }
  - { id: ERR_WARRANTY_TIME_EXPIRED, http: 422, condition: "Claim filed after warranty_expires_at (checked before shot limit)" }
  # --- business constraint ---
  - { id: ERR_WARRANTY_SHOT_LIMIT_EXCEEDED, http: 422, condition: "claimed_at_shot_count > warranty_shot_limit (boundary: == limit is covered)" }
  - { id: ERR_PRESS_DOUBLE_BOOKED, http: 409, condition: "Half-open press window overlaps another RESERVED window on the same press" }
  - { id: ERR_MACHINE_WINDOW_CONFLICT, http: 409, condition: "Buffer-extended machine window ([start, end+4h)) overlaps another RESERVED block on the same machine" }
  - { id: ERR_MACHINE_CAPACITY_EXCEEDED, http: 409, condition: "Machine's ISO-week RESERVED hours would exceed 45.0 (boundary: exactly 45.0 allowed)" }
  - { id: ERR_MILESTONE_SEQUENCE_BLOCKED, http: 409, condition: "A lower-seq milestone is not yet EARNED/INVOICED/PAID, or READY_TO_SHIP advance with milestones 1-5 not all EARNED+" }
  - { id: ERR_MILESTONE_ACTOR_MISMATCH, http: 403, condition: "Milestone seq 5 (BUYOFF_SIGNED) completed by non-owner or non-Customer; other seqs attempted by Customer" }
  - { id: ERR_DUPLICATE_RELEASED_DESIGN, http: 409, condition: "Releasing a design while another RELEASED design exists for the same (customer_id, part_number) outside the supersedes chain" }
  - { id: ERR_NON_MONOTONIC_SHOT_PERIOD, http: 409, condition: "report_period_end not strictly later than all prior ACTIVE reports for the tool" }
  - { id: ERR_SHOT_REVERSAL_BLOCKED, http: 409, condition: "Reversal would drop lifetime_shots below a filed claim's claimed_at_shot_count" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "allocate quantity > on_hand" }
  - { id: ERR_REWORK_REQUIRES_AUTHORIZATION, http: 409, condition: "initiate-rework at round_number >= 3 without a valid ReworkAuthorization" }
  - { id: ERR_REWORK_COST_OVERRUN, http: 422, condition: "actual_cost_cents > authorized_cost_cents (boundary: equal allowed)" }
  - { id: ERR_LEAD_TIME_INFEASIBLE, http: 422, condition: "requested_lead_weeks < MIN_LEAD_WEEKS[die_class] (boundary: == MIN allowed)" }
  - { id: ERR_NO_CAPACITY_RESERVED, http: 409, condition: "BOOKED -> IN_BUILD advance without any RESERVED MachineReservation" }
  # --- referential ---
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Customer is SUSPENDED (credit aging) — blocks quote create and quote accept" }
  - { id: ERR_DESIGN_NOT_RELEASED, http: 409, condition: "FIRM quote issue requires design RELEASED; BUDGETARY issue requires SUBMITTED or RELEASED" }
  - { id: ERR_TOOL_NOT_IN_PRODUCTION, http: 409, condition: "Spare allocate / shot report / warranty claim requires tool IN_PRODUCTION (claims also accept RETURNED_FOR_REPAIR)" }
  # --- fiscal ---
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount_cents exceeds the sum of eligible invoice balances (atomic rejection)" }
  - { id: ERR_RETENTION_LIEN_BLOCK, http: 402, condition: "Ship blocked: outstanding_cents > floor(contract_value_cents * 0.15) (tooler's lien)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Quote accept would push outstanding + total over credit_limit_cents (limit 0 = unlimited)" }
  # --- concurrency (OCC) ---
  - { id: ERR_STALE_TOOL_DESIGN_VERSION, http: 412, condition: "expected_tool_design_version != current ToolDesign.version at POST /quotes" }
  - { id: ERR_STALE_BUILD_JOB_VERSION, http: 412, condition: "expected_build_job_version != current BuildJob.version at POST /engineering-changes or POST /build-jobs/{jobId}/payments" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Shop system administrator; onboarding and clock control"
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: Estimator
    description: "Prepares and issues quotes"
    identity: opaque
    exclusive_operations:
      - "POST /quotes"
      - "POST /quotes/{quoteId}/issue"
    shared_operations: ["all GET endpoints"]
  - name: ToolingEngineer
    description: "Reviews/releases designs and revisions; assesses and verifies engineering changes"
    identity: opaque
    exclusive_operations:
      - "POST /tool-designs/{designId}/review"
      - "POST /tool-designs/{designId}/revise"
      - "POST /engineering-changes/{ecoId}/assess"
      - "POST /engineering-changes/{ecoId}/verify"
    shared_operations: ["POST /engineering-changes (requested_by=SHOP)", "all GET endpoints"]
  - name: ProjectManager
    description: "Runs build jobs: scheduling, milestones, tryouts, reservations, shipping, spares, rework execution, claim close-out"
    identity: opaque
    exclusive_operations:
      - "POST /build-jobs; advance / hold / resume"
      - "POST /tryout-samples and submit / initiate-rework"
      - "POST /press-reservations, /machine-reservations and their cancels"
      - "POST /tool-assets/{toolId}/ship and /deliver"
      - "POST /spare-inserts and allocate / restock / discontinue"
      - "POST /rework-authorizations/{raId}/start, /complete, /cancel"
      - "POST /warranty-claims/{claimId}/close"
    shared_operations: ["POST /build-milestones/{milestoneId}/complete (seq 1-4 and 6)", "all GET endpoints"]
  - name: QualityManager
    description: "Independent buyoff and warranty adjudication (segregated from ProjectManager)"
    identity: opaque
    exclusive_operations:
      - "POST /tryout-samples/{sampleId}/buyoff-decision"
      - "POST /warranty-claims/{claimId}/review"
    shared_operations: ["all GET endpoints"]
  - name: FinanceAdmin
    description: "Issues progress invoices and records payments; the same X-User-ID must never do both to the same invoice (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /build-milestones/{milestoneId}/invoice"
      - "POST /build-jobs/{jobId}/payments"
    shared_operations: ["all GET endpoints"]
  - name: Customer
    description: "The OEM/molder customer; owns its designs, quotes, ECO decisions, buyoff signature, shot reports, and warranty claims"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /tool-designs; POST /tool-designs/{designId}/submit"
      - "POST /quotes/{quoteId}/respond"
      - "POST /engineering-changes/{ecoId}/customer-decision"
      - "POST /shot-reports; POST /shot-reports/{reportId}/reverse"
      - "POST /warranty-claims"
    shared_operations: ["POST /engineering-changes (requested_by=CUSTOMER, own jobs only)", "POST /build-milestones/{milestoneId}/complete (seq 5 only, own jobs)", "all GET endpoints"]
  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
