            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 340, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { slot1: $.data.id, slot1_v: $.data.version } }
          trigger:
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 170, expected_slot_version: "${slot1_v}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "GET /packer-slots/${slot1}", payload: {}, as: FieldTech, captures: { slot_v2: $.data.version } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 170, expected_slot_version: "${slot_v2}" }, as: FieldTech, captures: { load2: $.data.id } }
            - { call: "GET /packer-slots/${slot1}", payload: {}, as: FieldTech, captures: { slot_v3: $.data.version, slot_state: $.data.slot_status, reserved: $.data.reserved_head } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 1, expected_slot_version: "${slot_v3}" }, as: FieldTech, captures: { err_id: $.data.error_id } }
          assert:
            - "Both 170-head bookings succeed (170 + 170 == 340 == capacity is allowed)"
            - "After exact fit: PackerSlot.reserved_head == 340 and slot_status == FULL (${reserved}, ${slot_state})"
            - "The 1-head booking is HTTP 409 ERR_SLOT_CAPACITY_EXCEEDED (${err_id})"
            - "PackerSlot.reserved_head remains 340 after the rejection"

      - name: mortality_threshold_exact_boundary
        grounds:
          - calculations.performance_bonus
          - calculations.group_head_reconciliation
        distinguishing_aspect: |
          Metric = mortality_pct percentage via mortality reports -> close -> settlement.
