      - name: out_of_warranty_repair_charge_is_capped_at_half_the_fee_schedule
        claim_type: Constants Applied
        grounds:
          - calculations.repair_billability
          - entities.RepairOrder.fields.repair_charge_cents
          - entities.RepairOrder.fields.labor_units
        distinguishing_aspect: |
          Labour is billed in whole 15-minute units rounded UP, and the total is capped at
          REPAIR_CAP_PCT of FEE_SCHEDULE_E0486_CENTS: 555 minutes is exactly 37 units and exactly
          92500 cents, while 556 minutes is 38 units, 95000 uncapped, and still 92500 after the cap.
