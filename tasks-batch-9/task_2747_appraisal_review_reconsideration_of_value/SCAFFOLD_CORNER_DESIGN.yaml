        grounds:
          - validations.priority_36_ERR_DUPLICATE_PANEL_MEMBERSHIP
          - errors.ERR_DUPLICATE_PANEL_MEMBERSHIP
          - entities.PanelMembership
          - endpoints.POST_panel_memberships
        distinguishing_aspect: "The junction uniqueness key is the (appraiser_id, amc_id, coverage_state) triple over ACTIVE rows: re-enrolling the same appraiser with the same AMC for CA is refused, while enrolling that same pair for NV is accepted -- so coverage_state is part of the key, not decoration."
        test_recipe:
          setup:
            - "One AMC and one appraiser, already holding an ACTIVE CA membership with that AMC."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Duplicate Panel AMC" }
