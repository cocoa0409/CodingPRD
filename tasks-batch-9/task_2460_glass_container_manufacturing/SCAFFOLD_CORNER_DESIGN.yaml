              payload: { customer_id: "${c}", code: "BD-X2", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
