# =============================================================================
# SCAFFOLD — Blow-Dry Bar & Styling (Drybar-style)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  639. Blow-Dry Bar & Styling (Drybar style): style menu & duration, stylist &
  chair scheduling, membership/package & prepay, add-on (updo/braid/extension),
  event/group/bridal block, product retail, tip & commission split,
  no-show/late

domain_name: blow-dry-bar
api_prefix: ""

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_deferred_actions

  entity_topology: flat
  # Peer entities linked by foreign keys (Member, Stylist, Chair, Appointment,
  # EventBlock, etc.) — no deep URL nesting; bookings reference resources by FK.

  state_machine_shape: parallel
  # Appointment carries two independent state axes: lifecycle_status
  # (booking lifecycle) and settlement_status (payment/commission lifecycle),
  # plus a cyclic EventBlock machine (HOLD<->CONFIRMED revision rounds).

  relationship_patterns:
    - one_to_many        # MembershipPlan -> Member; Member -> Appointment
    - many_to_many       # Appointment <-> AddOn via AppointmentAddOn junction
    - cross_aggregate    # Appointment references Chair + Stylist + Member + StyleService

  role_model: peer_roles
  # FrontDesk owns scheduling/retail, Stylist owns own service completion,
  # FinanceManager owns settlement/payouts, Member acts on own resources.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration: style menu ---
  - name: StyleService
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Menu item name (e.g. Classic Blowout)" }
      - { name: base_duration_minutes, type: integer, source: input, description: "Chair-time the service occupies", constraints: "multiple of 5, >= 15, <= 240" }
      - { name: base_price_cents, type: integer, source: input, description: "List price before discounts", constraints: ">= 0" }
      - { name: blowout_credit_cost, type: integer, source: input, default: 1, description: "How many membership/package blowout credits this service consumes", constraints: ">= 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether bookable; inactive services reject new appointments" }

  # --- Configuration: add-ons ---
  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Add-on name" }
      - { name: category, type: enum, source: input, description: "UPDO | BRAID | EXTENSION", constraints: "one of UPDO, BRAID, EXTENSION" }
      - { name: extra_duration_minutes, type: integer, source: input, description: "Minutes added to chair-time", constraints: "multiple of 5, >= 0, <= 120" }
      - { name: price_cents, type: integer, source: input, description: "Add-on surcharge before discount", constraints: ">= 0" }
      - { name: discount_eligible, type: boolean, source: input, default: false, description: "Whether membership discount applies to this add-on" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether attachable" }

  # --- Configuration: membership plan ---
  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: tier, type: enum, source: input, description: "BASIC | PLUS | VIP", constraints: "one of BASIC, PLUS, VIP" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring fee", constraints: ">= 0" }
      - { name: included_blowout_credits, type: integer, source: input, description: "Blowout credits granted per cycle", constraints: ">= 0" }
      - { name: member_discount_pct, type: number, source: input, description: "Discount on service + eligible add-ons (0..1)", constraints: ">= 0 and <= 1" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether new members may enroll" }

  # --- Resource: member (customer) ---
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: email, type: string, source: input, description: "Unique email", constraints: "unique across Member" }
      - { name: membership_plan_id, type: string, source: input, default: null, description: "FK -> MembershipPlan.id; null for walk-in (non-member)" }
      - { name: blowout_credit_balance, type: integer, source: computed, description: "Remaining blowout credits = granted (membership cycle + package purchases) - consumed by booked/completed appointments + refunded on cancellation", constraints: ">= 0" }
      - { name: prepay_balance_cents, type: integer, source: computed, description: "Stored-value prepay = sum(top-ups) - sum(charges) + sum(refunds); starts 0", constraints: ">= 0" }
      - { name: no_show_strikes, type: integer, source: computed, description: "Rolling count of NO_SHOW outcomes in trailing window; starts 0" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | SUSPENDED; SUSPENDED when no_show_strikes >= STRIKE_SUSPEND_THRESHOLD" }

  # --- Resource: stylist ---
  - name: Stylist
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Stylist name" }
      - { name: commission_tier, type: enum, source: input, description: "JUNIOR | SENIOR | MASTER", constraints: "one of JUNIOR, SENIOR, MASTER" }
      - { name: shift_start_minute, type: integer, source: input, description: "Minutes-from-midnight UTC when shift starts", constraints: ">= 0 and < 1440" }
      - { name: shift_end_minute, type: integer, source: input, description: "Minutes-from-midnight UTC when shift ends", constraints: "> shift_start_minute and <= 1440" }
      - { name: earned_commission_cents, type: integer, source: computed, description: "Sum of commission_amount_cents over this stylist's SETTLED appointments, minus retail commission reversed on voided sales; starts 0" }
      - { name: earned_tips_cents, type: integer, source: computed, description: "Sum of stylist_tip_cents over this stylist's SETTLED appointments; starts 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether assignable" }

  # --- Resource: chair (station) ---
  - name: Chair
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: label, type: string, source: input, description: "Chair label (e.g. Chair 3)" }
      - { name: open_minute, type: integer, source: input, description: "Minutes-from-midnight UTC the chair opens", constraints: ">= 0 and < 1440" }
      - { name: close_minute, type: integer, source: input, description: "Minutes-from-midnight UTC the chair closes", constraints: "> open_minute and <= 1440" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 10, description: "Cleaning buffer required AFTER each appointment before the next on this chair", constraints: ">= 0 and <= 60" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether bookable" }

  # --- Resource: appointment (booking) ---
  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: chair_id, type: string, source: input, description: "FK -> Chair.id" }
      - { name: stylist_id, type: string, source: input, description: "FK -> Stylist.id" }
      - { name: style_service_id, type: string, source: input, description: "FK -> StyleService.id" }
      - { name: event_block_id, type: string, source: input, default: null, description: "FK -> EventBlock.id; null for standalone walk-in/member bookings" }
      - { name: start_minute, type: integer, source: input, description: "Minutes-from-midnight UTC appointment starts (same logical day as the clock)", constraints: ">= 0 and < 1440" }
      - { name: scheduled_duration_minutes, type: integer, source: computed, description: "= StyleService.base_duration_minutes + sum(AddOn.extra_duration_minutes attached)" }
      - { name: end_minute, type: integer, source: computed, description: "= start_minute + scheduled_duration_minutes" }
      - { name: payment_method, type: enum, source: input, description: "CREDIT | PREPAY at booking time", constraints: "one of CREDIT, PREPAY" }
      - { name: list_amount_cents, type: integer, source: computed, description: "Pre-discount service+add-on list total" }
      - { name: discount_cents, type: integer, source: computed, description: "Membership discount applied (round-per-line then sum)" }
      - { name: service_charge_cents, type: integer, source: computed, description: "Net cash charge = list_amount_cents - discount_cents, reduced by blowout credits applied" }
      - { name: credits_applied, type: integer, source: computed, description: "Blowout credits consumed by this booking" }
      - { name: tip_cents, type: integer, source: input, default: 0, description: "Tip captured at settlement", constraints: ">= 0" }
      - { name: tip_pool_cents, type: integer, source: computed, description: "Portion of tip routed to shared pool" }
      - { name: stylist_tip_cents, type: integer, source: computed, description: "Portion of tip routed directly to the serving stylist" }
      - { name: commission_amount_cents, type: integer, source: computed, description: "Stylist commission on the settled service_charge_cents" }
      - { name: house_amount_cents, type: integer, source: computed, description: "House share = service_charge_cents - commission_amount_cents" }
      - { name: arrival_status, type: enum, source: input, default: ON_TIME, description: "Recorded at check-in: ON_TIME | LATE | NO_SHOW", constraints: "one of ON_TIME, LATE, NO_SHOW" }
      - { name: late_minutes, type: integer, source: input, default: 0, description: "Minutes late at check-in; drives late fee", constraints: ">= 0" }
      - { name: lifecycle_status, type: enum, source: computed, description: "BOOKED | CHECKED_IN | IN_SERVICE | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: settlement_status, type: enum, source: computed, description: "UNSETTLED | SETTLED | VOIDED (independent of lifecycle_status)" }

  # --- Junction: appointment add-on ---
  - name: AppointmentAddOn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id" }
      - { name: add_on_id, type: string, source: input, description: "FK -> AddOn.id" }
      - { name: captured_price_cents, type: integer, source: computed, description: "AddOn.price_cents snapshot at attach time" }
      - { name: captured_duration_minutes, type: integer, source: computed, description: "AddOn.extra_duration_minutes snapshot at attach time" }
      - { name: discount_applied_cents, type: integer, source: computed, description: "Per-line membership discount on this add-on (0 if not discount_eligible or member has no plan)" }

  # --- Resource: event/group/bridal block ---
  - name: EventBlock
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: organizer_member_id, type: string, source: input, description: "FK -> Member.id; the booking organizer" }
      - { name: block_type, type: enum, source: input, description: "GROUP | BRIDAL", constraints: "one of GROUP, BRIDAL" }
      - { name: window_start_minute, type: integer, source: input, description: "Minutes-from-midnight UTC the reserved window opens", constraints: ">= 0 and < 1440" }
      - { name: window_end_minute, type: integer, source: input, description: "Minutes-from-midnight UTC the reserved window closes", constraints: "> window_start_minute and <= 1440" }
      - { name: reserved_chair_ids, type: array, source: input, description: "Chair ids exclusively held for this block during the window" }
      - { name: party_size, type: integer, source: input, description: "Expected number of appointments in the block", constraints: ">= 2 and <= 20" }
      - { name: deposit_cents, type: integer, source: computed, description: "Required deposit = party_size * DEPOSIT_PER_HEAD_CENTS, BRIDAL adds surcharge" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Sum of deposit payments recorded against this block; starts 0" }
      - { name: gratuity_pct, type: number, source: input, default: 0.20, description: "Auto-gratuity applied to block appointment services at settlement (0..1)", constraints: ">= 0 and <= 1" }
      - { name: status, type: enum, source: computed, description: "HOLD | CONFIRMED | CHECKED_IN | CLOSED | CANCELLED" }

  # --- Configuration: retail product ---
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: sku, type: string, source: input, description: "Unique SKU", constraints: "unique across Product" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Retail price per unit", constraints: ">= 0" }
      - { name: stock_qty, type: integer, source: computed, description: "On-hand units = initial_stock + restocks - sum(quantity over non-VOIDED RetailSale)" }
      - { name: retail_commission_pct, type: number, source: input, default: 0.10, description: "Stylist commission rate on retail attributed to them (0..1)", constraints: ">= 0 and <= 1" }

  # --- Event/Resource: retail sale ---
  - name: RetailSale
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; buyer" }
      - { name: attributed_stylist_id, type: string, source: input, default: null, description: "FK -> Stylist.id; stylist credited with retail commission, null for unattributed" }
      - { name: quantity, type: integer, source: input, description: "Units sold", constraints: ">= 1" }
      - { name: gross_cents, type: integer, source: computed, description: "= Product.unit_price_cents * quantity" }
      - { name: retail_commission_cents, type: integer, source: computed, description: "Stylist retail commission on this sale" }
      - { name: status, type: enum, source: computed, description: "SOLD | VOIDED" }

  # --- Resource: prepaid package purchase ---
  - name: PackagePurchase
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: credits_purchased, type: integer, source: input, description: "Blowout credits in the package", constraints: ">= 1" }
      - { name: price_cents, type: integer, source: input, description: "Amount paid for the package", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | REFUNDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Appointment lifecycle (axis 1: parallel dimension) ----
  - entity: Appointment
    field: lifecycle_status
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in (arrival_status=ON_TIME|LATE)"
        actor: FrontDesk
        preconditions:
          - "Appointment.lifecycle_status == BOOKED (else ERR_APPOINTMENT_NOT_BOOKED)"
          - "Member.status == ACTIVE (else ERR_MEMBER_SUSPENDED)"
          - "arrival_status in {ON_TIME, LATE} (NO_SHOW uses the no-show trigger)"
        side_effects:
          - "If arrival_status==LATE and late_minutes > LATE_GRACE_MINUTES: late_fee_cents computed and added to service_charge_cents (calc: late_fee)"
          - "Sets Appointment.arrival_status and Appointment.late_minutes from request"

      - from: CHECKED_IN
        to: IN_SERVICE
        trigger: "POST /appointments/{id}/start"
        actor: Stylist
        preconditions:
          - "Appointment.lifecycle_status == CHECKED_IN (else ERR_APPOINTMENT_NOT_CHECKED_IN)"
          - "Acting stylist X-User-ID == Appointment.stylist_id (else ERR_NOT_ASSIGNED_STYLIST)"
        side_effects: []

      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Stylist
        preconditions:
          - "Appointment.lifecycle_status == IN_SERVICE (else ERR_APPOINTMENT_NOT_IN_SERVICE)"
          - "Acting stylist X-User-ID == Appointment.stylist_id (else ERR_NOT_ASSIGNED_STYLIST)"
        side_effects:
          - "Appointment becomes eligible for settlement (settlement_status remains UNSETTLED until settle)"

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: FrontDesk
        preconditions:
          - "Appointment.lifecycle_status == BOOKED (else ERR_APPOINTMENT_NOT_BOOKED)"
          - "Logical clock >= appointment start (current_minute >= start_minute, else ERR_NO_SHOW_TOO_EARLY)"
        side_effects:
          - "arrival_status set to NO_SHOW"
          - "Member.no_show_strikes incremented by 1 (calc: no_show_strikes) — CASCADE may flip Member.status BOOKED->... to SUSPENDED at threshold"
          - "Blowout credits reserved by this appointment are NOT refunded (credits_applied retained as forfeited)"
          - "settlement_status set to VOIDED (no commission, no charge captured)"
          - "Chair time window for this appointment is released for re-booking"

      - from: [BOOKED, CHECKED_IN]
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: [FrontDesk, Member]
        preconditions:
          - "Appointment.lifecycle_status in {BOOKED, CHECKED_IN} (else ERR_APPOINTMENT_NOT_CANCELLABLE)"
          - "If actor==Member: X-User-ID == Appointment.member_id (else ERR_NOT_OWNER)"
        side_effects:
          - "Blowout credits_applied refunded to Member.blowout_credit_balance (compensating)"
          - "Any PREPAY hold released back to Member.prepay_balance_cents (compensating)"
          - "settlement_status set to VOIDED"
          - "Chair time window released; if appointment belonged to an EventBlock, party_size accounting unaffected but the slot frees"

  # ---- Appointment settlement (axis 2: parallel dimension, independent) ----
  - entity: Appointment
    field: settlement_status
    initial_state: UNSETTLED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: UNSETTLED
        to: SETTLED
        trigger: "POST /appointments/{id}/settle (tip_cents)"
        actor: FinanceManager
        preconditions:
          - "Appointment.lifecycle_status == COMPLETED (else ERR_APPOINTMENT_NOT_COMPLETED) [cross-axis dependency]"
          - "Appointment.settlement_status == UNSETTLED (else ERR_ALREADY_SETTLED)"
          - "If payment_method==PREPAY: Member.prepay_balance_cents >= service_charge_cents (else ERR_INSUFFICIENT_PREPAY)"
        side_effects:
          - "tip split into tip_pool_cents + stylist_tip_cents (calc: tip_split)"
          - "commission_amount_cents + house_amount_cents computed (calc: commission_split)"
          - "If payment_method==PREPAY: Member.prepay_balance_cents debited by service_charge_cents (calc: prepay_balance, CASCADE recompute)"
          - "Stylist.earned_commission_cents and Stylist.earned_tips_cents recomputed (CASCADE derived-field reconciliation)"

      - from: UNSETTLED
        to: VOIDED
        trigger: "system (set by no-show or cancel lifecycle transitions)"
        actor: system
        preconditions:
          - "Driven by lifecycle transition to NO_SHOW or CANCELLED"
        side_effects:
          - "No commission, no charge captured; any held credits/prepay reconciled per lifecycle side_effects"

  # ---- EventBlock lifecycle (cyclic: HOLD <-> CONFIRMED revision rounds) ----
  - entity: EventBlock
    field: status
    initial_state: HOLD
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /event-blocks/{id}/confirm (expected_event_block_version)"
        actor: FrontDesk
        preconditions:
          - "EventBlock.status == HOLD (else ERR_EVENT_BLOCK_NOT_HOLD)"
          - "deposit_paid_cents >= deposit_cents (else ERR_DEPOSIT_NOT_MET)"
          - "expected_event_block_version matches current version (else ERR_STALE_VERSION)"
          - "Count of BOOKED appointments referencing this block >= 2 (else ERR_BLOCK_UNDERFILLED)"
        side_effects:
          - "Reserved chairs locked for the window; conflicting standalone bookings already rejected at booking time"
          - "increments EventBlock.version by 1"

      - from: CONFIRMED
        to: HOLD
        trigger: "POST /event-blocks/{id}/reopen (expected_event_block_version)"
        actor: FrontDesk
        preconditions:
          - "EventBlock.status == CONFIRMED (else ERR_EVENT_BLOCK_NOT_CONFIRMED)"
          - "No appointment in the block is CHECKED_IN/IN_SERVICE/COMPLETED (else ERR_BLOCK_IN_PROGRESS)"
          - "expected_event_block_version matches current version (else ERR_STALE_VERSION)"
        side_effects:
          - "Block returns to revision; chairs remain reserved; increments EventBlock.version by 1"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "system (first block appointment transitions to CHECKED_IN)"
        actor: system
        preconditions:
          - "EventBlock.status == CONFIRMED"
        side_effects:
          - "Block marked in progress (CHECKED_IN); reopen no longer permitted"

      - from: CHECKED_IN
        to: CLOSED
        trigger: "POST /event-blocks/{id}/close (expected_event_block_version)"
        actor: FrontDesk
        preconditions:
          - "EventBlock.status == CHECKED_IN (else ERR_EVENT_BLOCK_NOT_CLOSEABLE)"
          - "Every block appointment is in a terminal lifecycle_status {COMPLETED, NO_SHOW, CANCELLED} (else ERR_BLOCK_HAS_OPEN_APPOINTMENTS)"
          - "expected_event_block_version matches current version (else ERR_STALE_VERSION)"
        side_effects:
          - "Reserved chairs released for the window; increments EventBlock.version by 1"

      - from: [HOLD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /event-blocks/{id}/cancel (expected_event_block_version)"
        actor: FrontDesk
        preconditions:
          - "EventBlock.status in {HOLD, CONFIRMED} (else ERR_EVENT_BLOCK_NOT_CANCELLABLE)"
          - "expected_event_block_version matches current version (else ERR_STALE_VERSION)"
        side_effects:
          - "All BOOKED/CHECKED_IN appointments in the block CASCADE to CANCELLED (each runs its own cancel side_effects: credit + prepay refunds, settlement VOIDED, chair release)"
          - "Reserved chairs released; deposit_paid_cents retained as forfeited (not refunded)"
          - "increments EventBlock.version by 1"

  # ---- Member account (computed status from strike count) ----
  - entity: Member
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (no_show_strikes reaches STRIKE_SUSPEND_THRESHOLD via appointment NO_SHOW cascade)"
        actor: system
        preconditions:
          - "Member.no_show_strikes >= STRIKE_SUSPEND_THRESHOLD"
        side_effects:
          - "Member can no longer be checked in for new appointments (ERR_MEMBER_SUSPENDED on check-in)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{id}/reinstate (expected_member_version)"
        actor: FrontDesk
        preconditions:
          - "Member.status == SUSPENDED (else ERR_MEMBER_NOT_SUSPENDED)"
          - "expected_member_version matches current version (else ERR_STALE_VERSION)"
        side_effects:
          - "Member.no_show_strikes reset to 0; status -> ACTIVE; increments Member.version by 1"

  # ---- RetailSale ----
  - entity: RetailSale
    field: status
    initial_state: SOLD
    terminal_states: [VOIDED]
    transitions:
      - from: SOLD
        to: VOIDED
        trigger: "POST /retail-sales/{id}/void"
        actor: FrontDesk
        preconditions:
          - "RetailSale.status == SOLD (else ERR_SALE_NOT_VOIDABLE)"
        side_effects:
          - "Product.stock_qty incremented by quantity (CASCADE derived-field reconciliation)"
          - "retail_commission_cents reversed; attributed Stylist.earned_commission_cents recomputed (CASCADE)"

  # ---- PackagePurchase ----
  - entity: PackagePurchase
    field: status
    initial_state: ACTIVE
    terminal_states: [REFUNDED]
    transitions:
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /package-purchases/{id}/refund (expected_member_version)"
        actor: FinanceManager
        preconditions:
          - "PackagePurchase.status == ACTIVE (else ERR_PACKAGE_NOT_REFUNDABLE)"
          - "Member.blowout_credit_balance >= credits_purchased (unconsumed credits available, else ERR_CREDITS_ALREADY_USED)"
          - "expected_member_version matches current version (else ERR_STALE_VERSION)"
        side_effects:
          - "Member.blowout_credit_balance decremented by credits_purchased (compensating; invariant: net credits granted-by-this-package == 0 after refund)"
          - "Member.prepay_balance_cents credited by price_cents (refund to stored value)"
          - "increments Member.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appointment-book-stale-event-block
    parent_entity: EventBlock
    write_endpoint: "POST /appointments"
    occ_field: "expected_event_block_version"
    description: |
      Booking a new appointment into an EventBlock whose version has advanced
      since the client last observed it is rejected. A prior writer may have
      reopened or cancelled the block (legitimately superseding the prior
      arrangement), so the current writer's view of the block — its reserved
      chairs and window — is stale. OCC on the block version reduces this to a
      stale-version check triggerable by two strictly sequential requests.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: package-purchase-stale-member
    parent_entity: Member
    write_endpoint: "POST /package-purchases"
    occ_field: "expected_member_version"
    description: |
      Purchasing a prepaid credit package against a Member whose version has
      advanced since the client last observed it is rejected. Another writer
      may have just granted credits, refunded a prior package, or reinstated
      the member (each legitimately changing the credit/prepay ledger), so the
      current writer's view of the member balance is stale. OCC on the member
      version makes this a deterministic stale-version check under two strictly
      sequential requests.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- (A) Service pricing: per-line discount then sum (rounding-order mode b) ----
  - name: appointment_service_pricing
    trigger: "appointment booking (POST /appointments) and re-run on add-on attach/detach"
    algorithm: aggregation
    formula: |
      # list_amount: service list + each add-on captured list price
      list_amount_cents = StyleService.base_price_cents
                          + sum(AppointmentAddOn.captured_price_cents over attached add-ons)

      # Membership discount is applied PER LINE, rounded per line (round_half_up to
      # whole cents), THEN summed. Pinned order: round-per-line, then sum.
      if Member.membership_plan_id is null:
        discount_cents = 0
      else:
        d = MembershipPlan.member_discount_pct
        # service line always discount-eligible
        line_discounts = [ round_half_up(StyleService.base_price_cents * d) ]
        for each attached add-on a:
          if a.discount_eligible: line_discounts.append(round_half_up(a.captured_price_cents * d))
          else: line_discounts.append(0)
        discount_cents = sum(line_discounts)            # SUM AFTER per-line rounding

      net_after_discount = list_amount_cents - discount_cents

      # Blowout credits reduce cash charge: each credit covers up to
      # CREDIT_VALUE_CENTS of the discounted SERVICE line only (not add-ons).
      credits_applied = min(Member.blowout_credit_balance,
                            StyleService.blowout_credit_cost)
      credit_value = credits_applied * 0  # NOTE: credits cover the service line, see below
      # Service-line coverage: if credits_applied >= StyleService.blowout_credit_cost
      # AND StyleService.blowout_credit_cost > 0, the discounted service line is fully
      # covered (its discounted price removed from cash charge); add-ons + late fee remain cash.
      discounted_service_line = StyleService.base_price_cents - round_half_up(StyleService.base_price_cents * d_if_member_else_0)
      if credits_applied >= StyleService.blowout_credit_cost and StyleService.blowout_credit_cost > 0:
        service_charge_cents = net_after_discount - discounted_service_line
      else:
        credits_applied = 0
        service_charge_cents = net_after_discount
      # late_fee (calc: late_fee) is added at check-in, AFTER this base charge.
    input_set: "StyleService of the appointment; all AppointmentAddOn rows attached; the Member's plan if any"
    constants:
      CREDIT_VALUE_CENTS: 0   # credits cover the discounted service line directly, not a flat value
    precision: "whole cents, round_half_up; rounding done PER LINE before summing discount"
    note: |
      Rounding order is pinned: discount is rounded per-line then summed (mode b of Rule 2).
      'sum then round' would differ when multiple discount-eligible lines have half-cent residues.

  # ---- (B) Late fee threshold (threshold, boundary precision) ----
  - name: late_fee
    trigger: "appointment check-in with arrival_status=LATE (POST /appointments/{id}/check-in)"
    algorithm: threshold
    formula: |
      if arrival_status != LATE: late_fee_cents = 0
      elif late_minutes <= LATE_GRACE_MINUTES: late_fee_cents = 0      # <= grace is FREE
      else:
        billable = late_minutes - LATE_GRACE_MINUTES
        late_fee_cents = min(billable * LATE_FEE_PER_MIN_CENTS, LATE_FEE_CAP_CENTS)
      service_charge_cents += late_fee_cents
    input_set: "this appointment's arrival_status and late_minutes"
    constants:
      LATE_GRACE_MINUTES: 10
      LATE_FEE_PER_MIN_CENTS: 100
      LATE_FEE_CAP_CENTS: 2500
    precision: "whole cents"
    note: "Boundary: late_minutes == 10 -> fee 0 (<= grace, free); late_minutes == 11 -> fee 100. >= vs > matters."

  # ---- (C) Tip split: pooled vs direct (dual-variant on tip, mode-a combinatorial) ----
  - name: tip_split
    trigger: "appointment settlement (POST /appointments/{id}/settle)"
    algorithm: weighted_scoring
    formula: |
      # Standalone appointment: stylist keeps POOL_DIRECT_PCT_STANDALONE of the tip
      # directly; the remainder goes to the shared pool.
      # Event-block appointment: auto-gratuity context routes a larger share to the pool.
      if Appointment.event_block_id is null:
        stylist_tip_cents = round_half_up(tip_cents * TIP_DIRECT_PCT_STANDALONE)
      else:
        stylist_tip_cents = round_half_up(tip_cents * TIP_DIRECT_PCT_EVENT)
      tip_pool_cents = tip_cents - stylist_tip_cents     # remainder, no double-rounding
    input_set: "this appointment's tip_cents and event_block_id"
    constants:
      TIP_DIRECT_PCT_STANDALONE: 0.70
      TIP_DIRECT_PCT_EVENT: 0.50
    precision: "whole cents, round_half_up on the direct share; pool is the exact remainder"
    variants:
      - name: standalone_tip
        when: "Appointment.event_block_id is null"
        difference: "70% of tip goes directly to the serving stylist, 30% to pool"
      - name: event_block_tip
        when: "Appointment.event_block_id is not null"
        difference: "50% direct / 50% pool — auto-gratuity context shares more to the pool"

  # ---- (D) Commission split: tiered rate selection (mode-a combinatorial, nonlinear) ----
  - name: commission_split
    trigger: "appointment settlement (POST /appointments/{id}/settle)"
    algorithm: tiered_pricing
    formula: |
      # Rate selected by stylist commission_tier; an event-block appointment with
      # auto-gratuity gets a uniform house-favorable rate floor.
      base_rate = { JUNIOR: 0.35, SENIOR: 0.45, MASTER: 0.55 }[Stylist.commission_tier]
      if Appointment.event_block_id is not null:
        effective_rate = min(base_rate, EVENT_RATE_CAP)   # nonlinear: min() of two rates
      else:
        effective_rate = base_rate
      commission_amount_cents = round_half_up(Appointment.service_charge_cents * effective_rate)
      house_amount_cents = Appointment.service_charge_cents - commission_amount_cents
    input_set: "this appointment's final service_charge_cents (incl. late fee), the serving Stylist.commission_tier, event_block_id"
    constants:
      JUNIOR_RATE: 0.35
      SENIOR_RATE: 0.45
      MASTER_RATE: 0.55
      EVENT_RATE_CAP: 0.40
    precision: "whole cents, round_half_up on commission; house is exact remainder"
    note: "commission_amount + house_amount == service_charge_cents exactly (conserved-quantity invariant)."

  # ---- (E) Retail commission (different entity domain — dual-variant pair w/ commission_split) ----
  - name: retail_commission
    trigger: "retail sale (POST /retail-sales); reversed on void"
    algorithm: aggregation
    formula: |
      gross_cents = Product.unit_price_cents * quantity
      if attributed_stylist_id is null:
        retail_commission_cents = 0
      else:
        retail_commission_cents = round_half_up(gross_cents * Product.retail_commission_pct)
      # On void: subtract retail_commission_cents from attributed Stylist.earned_commission_cents
    input_set: "the RetailSale quantity, the Product unit_price + retail_commission_pct, attributed stylist"
    precision: "whole cents, round_half_up"
    note: |
      Dual-variant against commission_split: SAME conceptual output (stylist commission)
      computed on a DIFFERENT entity domain (RetailSale/Product) with a different rate basis
      (flat product rate vs tiered service rate). Different numbers for identical dollar gross.

  # ---- (F) Event block deposit (forward_looking projection, different entity) ----
  - name: event_block_deposit
    trigger: "event block creation (POST /event-blocks)"
    algorithm: forward_looking
    formula: |
      deposit_cents = party_size * DEPOSIT_PER_HEAD_CENTS
      if block_type == BRIDAL:
        deposit_cents += BRIDAL_SURCHARGE_CENTS
    input_set: "party_size and block_type at creation"
    constants:
      DEPOSIT_PER_HEAD_CENTS: 2000
      BRIDAL_SURCHARGE_CENTS: 10000
    precision: "whole cents"
    variants:
      - name: group_deposit
        when: "block_type == GROUP"
        difference: "deposit = party_size * 2000, no surcharge"
      - name: bridal_deposit
        when: "block_type == BRIDAL"
        difference: "deposit = party_size * 2000 + 10000 surcharge"

  # ---- (G) No-show strike accrual (chronological count, reset on reinstate) ----
  - name: no_show_strikes
    trigger: "appointment NO_SHOW (POST /appointments/{id}/no-show); reset on reinstate"
    algorithm: aggregation
    formula: |
      no_show_strikes = count(Appointment WHERE member_id == this.member_id
                                          AND arrival_status == NO_SHOW
                                          AND lifecycle_status == NO_SHOW)
                        - reinstate_resets
      # status SUSPENDED when no_show_strikes >= STRIKE_SUSPEND_THRESHOLD
    input_set: "all NO_SHOW appointments for the member since last reinstate"
    constants:
      STRIKE_SUSPEND_THRESHOLD: 3
    precision: "integer count"
    note: "Boundary: 2 strikes -> ACTIVE; 3rd strike (>=3) -> SUSPENDED. reinstate resets count to 0."

  # ---- (H) Prepay balance ledger (derived-field reconciliation) ----
  - name: prepay_balance
    trigger: "prepay top-up, PREPAY settlement debit, cancellation refund, package refund credit"
    algorithm: aggregation
    formula: |
      prepay_balance_cents = sum(top_up amounts via POST /members/{id}/prepay)
                           - sum(service_charge_cents over SETTLED PREPAY appointments)
                           + sum(price_cents over REFUNDED PackagePurchase)
                           + sum(refunds from cancelled PREPAY appointments holds)
      # never negative; settlement rejected if insufficient (ERR_INSUFFICIENT_PREPAY)
    input_set: "all prepay ledger events for the member"
    precision: "whole cents"

  # ---- (I) Blowout credit balance (waterfall: membership then package) ----
  - name: blowout_credit_balance
    trigger: "membership grant, package purchase, booking consume, cancel refund, package refund"
    algorithm: waterfall_allocation
    formula: |
      granted = (MembershipPlan.included_blowout_credits if member has plan else 0)
              + sum(PackagePurchase.credits_purchased over ACTIVE packages)
      consumed = sum(Appointment.credits_applied over appointments NOT in {CANCELLED})
      # NO_SHOW retains credits_applied as forfeited (still counted as consumed);
      # CANCELLED refunds (credits_applied excluded from consumed).
      blowout_credit_balance = granted - consumed
      # When booking consumes credits, draw from membership grant FIRST, then packages.
    input_set: "membership grant + ACTIVE packages minus consumed (non-CANCELLED) appointments"
    constants: {}
    precision: "integer; never negative. credits_applied = min(balance, blowout_credit_cost) at booking, so a member with too few credits simply applies fewer (or zero) and pays cash — never rejected for credits."
    note: "Waterfall draw order: membership grant before package credits. NO_SHOW forfeits (stays consumed), CANCELLED refunds."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: "all endpoints except GET /_health"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right; member_id, then chair_id, stylist_id, style_service_id, event_block_id, add_on_id, product_id)"
    error_id: "ERR_MEMBER_NOT_FOUND / ERR_CHAIR_NOT_FOUND / ERR_STYLIST_NOT_FOUND / ERR_STYLE_SERVICE_NOT_FOUND / ERR_EVENT_BLOCK_NOT_FOUND / ERR_ADD_ON_NOT_FOUND / ERR_PRODUCT_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_SALE_NOT_FOUND / ERR_PACKAGE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enum values legal, integers within declared constraints (durations multiple of 5, etc.)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT/PATCH"

  - priority: 5
    category: business_referential
    check: "Ownership: Member acting on a resource must own it (X-User-ID == resource.member_id); Stylist acting on appointment must be assigned (X-User-ID == appointment.stylist_id)"
    error_id: "ERR_NOT_OWNER / ERR_NOT_ASSIGNED_STYLIST"
    http_status: 403
    applies_to: "Member-cancel, Stylist start/complete"

  - priority: 6
    category: state
    check: "Target resource in correct state for the operation (lifecycle_status / settlement_status / EventBlock.status / Member.status / RetailSale.status / PackagePurchase.status preconditions)"
    error_id: "ERR_APPOINTMENT_NOT_BOOKED / ERR_APPOINTMENT_NOT_CHECKED_IN / ERR_APPOINTMENT_NOT_IN_SERVICE / ERR_APPOINTMENT_NOT_COMPLETED / ERR_APPOINTMENT_NOT_CANCELLABLE / ERR_ALREADY_SETTLED / ERR_EVENT_BLOCK_NOT_HOLD / ERR_EVENT_BLOCK_NOT_CONFIRMED / ERR_EVENT_BLOCK_NOT_CLOSEABLE / ERR_EVENT_BLOCK_NOT_CANCELLABLE / ERR_BLOCK_IN_PROGRESS / ERR_MEMBER_SUSPENDED / ERR_MEMBER_NOT_SUSPENDED / ERR_SALE_NOT_VOIDABLE / ERR_PACKAGE_NOT_REFUNDABLE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_temporal
    check: "Appointment must lie within both Chair [open_minute,close_minute) and Stylist [shift_start_minute,shift_end_minute) windows"
    error_id: ERR_OUTSIDE_OPERATING_WINDOW
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 8
    category: business_temporal
    check: "Chair overlap: the [start_minute, end_minute + Chair.turnover_buffer_minutes) interval must not overlap any non-terminal appointment on that chair (half-open with trailing buffer). Buffer applies AFTER each appointment."
    error_id: ERR_CHAIR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 9
    category: business_temporal
    check: "Stylist overlap: the [start_minute, end_minute) interval must not overlap any non-terminal appointment for that stylist (half-open, NO buffer — back-to-back allowed)"
    error_id: ERR_STYLIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 10
    category: business_constraint
    check: "Event-block booking: if event_block_id supplied, chair_id must be in EventBlock.reserved_chair_ids and [start,end) within block window; block must be HOLD or CONFIRMED"
    error_id: ERR_BLOCK_CHAIR_OR_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /appointments (with event_block_id)"

  - priority: 11
    category: business_constraint
    check: "Standalone booking on a chair reserved by a CONFIRMED EventBlock during its window is rejected (block holds exclusive chair time)"
    error_id: ERR_CHAIR_RESERVED_FOR_BLOCK
    http_status: 409
    applies_to: "POST /appointments (without matching event_block_id)"

  - priority: 12
    category: business_constraint
    check: "Service/add-on bookability: StyleService.active and every attached AddOn.active must be true at booking; member must be ACTIVE to be the subject of a booking"
    error_id: ERR_SERVICE_OR_ADDON_INACTIVE
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/add-ons"

  - priority: 13
    category: business_fiscal
    check: "Retail stock: RetailSale.quantity <= Product.stock_qty at sale time"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /retail-sales"

  - priority: 14
    category: business_fiscal
    check: "PREPAY settlement: Member.prepay_balance_cents >= service_charge_cents"
    error_id: ERR_INSUFFICIENT_PREPAY
    http_status: 402
    applies_to: "POST /appointments/{id}/settle (payment_method==PREPAY)"

