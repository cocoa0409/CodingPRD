            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - &c_case_budget
              call: "POST /carriers/support-cases"
              payload: { subscriber_id: "${sub_id}", topic_code: "PORT_STATUS" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /carriers/support-cases/${case_id}/resolve_self_service"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first attempt within 60 seconds of case creation is refused with ERR_SELF_SERVICE_TOO_EARLY and status 409"
            - "after advancing the clock 61 seconds the same call succeeds and leaves handling_seconds == 0"
            - "Subscriber.${sub_id}.self_service_deflection_count == 1 and support_seconds_used == 0"
            - "a later agent-resolved case books its agent_seconds into support_seconds_used, so the budget is consumed only by agent work"
            - "a support top-up of 300 seconds raises support_seconds_budget to 900"
            - "the deflection count excludes any case that was ever escalated"

      - name: wholesale_volume_tier_breakpoint_behaviour
        claim_type: Correct Result
        grounds:
          - calculations.wholesale_volume_tier_cost
          - entities.CapacityAgreement.fields.committed_data_mb
        distinguishing_aspect: "Below the breakpoint the marginal and retroactive readings agree exactly, and above it the marginal reading charges the undiscounted rate below TIER1_DATA_MB."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Two agreements with the same rate card at 200000 and 250000 megabytes."
          setup_api_calls:
            - *c_clock
            - &c_ag_below
              call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "Below Breakpoint Host", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 200000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { ag_below_id: $.data.id }
            - &c_ag_on
              call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "On Breakpoint Host", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 250000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { ag_on_id: $.data.id }
          trigger:
            - call: "POST /carriers/capacity-agreements/${ag_below_id}/resolve-purchase"
              payload: {}
              as: CapacityPlanner
          assert:
            - "the 200000-megabyte agreement reports data_volume_cost_microcents == 247400000, which is 200000 * 1237"
            - "the 250000-megabyte agreement reports data_volume_cost_microcents == 309250000, which is exactly on the breakpoint and still undiscounted"
            - "below and on TIER1_DATA_MB the marginal and retroactive readings are equal"
            - "no discount is applied until the volume strictly exceeds TIER1_DATA_MB 250000"
            - "the reported marginal_tier_rate_microcents is 1139 at every volume, whether or not the tier is reached"

      - name: breakage_rate_is_integer_reported_parts_per_million
        claim_type: Precision
        grounds:
          - calculations.breakage_revenue
          - entities.CapacityAgreement.fields.committed_data_mb
          - endpoints.GET_/carriers/capacity-agreements/{id}/usage-summary
        distinguishing_aspect: "breakage_rate_ppm is reported as an integer with no decimal point, and a single expired term with full breakage reports exactly 1000000."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with one expired term carrying a known breakage amount."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
