              as_user_id: "u_compliance_1"
          assert:
            - "self-review response status == 409"
            - "self-review response data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Offer.${offer_id}.created_by_user_id == u_designer_1"
            - "Offer.${offer_id}.approval_status == IN_REVIEW immediately after the blocked review"
