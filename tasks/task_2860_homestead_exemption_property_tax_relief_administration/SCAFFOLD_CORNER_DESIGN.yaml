            - "The taxpayer's PRIMARY_RESIDENCE occupancy runs on P1 over [2019-06-01, 2026-03-01) and on P3 from 2026-03-01 open-ended, so the intervals touch without overlapping and the transfer date 2026-04-01 falls inside the P3 interval."
