        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair: state (ERR_INVALID_STATE, priority 6) vs
          business_safety (ERR_SEGREGATION_OF_DUTIES, priority 7). A
          request that violates both — concern still in DRAFT AND acting
          HRBP is the concern's raising manager — must surface
          ERR_INVALID_STATE because state preconditions outrank SoD in
          the standard priority grouping.
        test_recipe:
          setup:
            - "Concern C1 exists in DRAFT, raised_by_manager_id == M1"
            - "M1 happens to also hold the HRBusinessPartner role (dual-hat edge case)"
          setup_api_calls:
