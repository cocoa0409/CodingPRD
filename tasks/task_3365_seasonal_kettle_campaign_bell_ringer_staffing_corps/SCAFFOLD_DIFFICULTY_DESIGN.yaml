              as: TerritorialCommander
              captures: { campaign_v: "$.data.version" }
            - call: "POST /api/campaigns/${campaign_id}/activate"
              payload: { expected_campaign_version: "${campaign_v}" }
              as: TerritorialCommander
            - call: "POST /api/kettle-locations"
              payload: { host_site_id: "${host_id}", campaign_id: "${campaign_id}", location_code: "K-114-A", placement: "OUTDOOR", placement_starts_on: "2026-11-01T00:00:00Z", placement_ends_on: "2026-12-24T00:00:00Z", daily_required_minutes: 480 }
              as: KettleCoordinator
              captures: { loc_id: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/kettle-locations/${loc_id}/activate"
              payload: { expected_kettle_location_version: "${loc_v}" }
              as: KettleCoordinator
            - call: "POST /api/digital-givings"
              payload: { campaign_id: "${campaign_id}", unit_id: "${unit_id}", amount_cents: 25000, channel: "QR", occurred_at: "2026-11-14T12:00:00Z", external_ref: "DG-2026-1001" }
              as: DigitalGivingProcessor
              captures: { g1: "$.data.id" }
            - call: "POST /api/digital-givings/${g1}/attribute"
              payload: { kettle_location_id: "${loc_id}" }
              as: DigitalGivingProcessor
            - call: "POST /api/digital-givings"
              payload: { campaign_id: "${campaign_id}", unit_id: "${unit_id}", amount_cents: 10000, channel: "SMS", occurred_at: "2026-11-14T13:00:00Z", external_ref: "DG-2026-1002" }
              as: DigitalGivingProcessor
              captures: { g2: "$.data.id" }
            - call: "GET /api/campaigns/${campaign_id}"
              as: FinanceOfficer
              captures: { baseline: "$.data.total_raised_cents" }
          trigger:
            - call: "POST /api/digital-givings/${g2}/attribute"
              payload: { kettle_location_id: "${loc_id}" }
              as: DigitalGivingProcessor
              captures: { after_attr: "$.data.attributed_cents" }
            - call: "GET /api/campaigns/${campaign_id}"
              as: FinanceOfficer
              captures: { total_after_attr: "$.data.total_raised_cents" }
            - call: "POST /api/digital-givings/${g2}/reverse"
              payload: { reason: "duplicate processor capture" }
