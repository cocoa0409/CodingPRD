# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0892
# 9 rule_ids x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: claim_provisional_vs_final_net
        grounds:
          - calculations.claim_net
          - calculations.claim_assessed_base
          - state_machines.Claim.SUBMITTED_to_UNDER_REVIEW
          - entities.Claim.fields.net_claim_cents
        distinguishing_aspect: "Same Claim: provisional net (at SUBMITTED) offsets DECLARED+CONFIRMED collateral against claimed_amount; final net (at APPROVED) offsets CONFIRMED-only against verified_amount — different numbers on the Claim entity domain."
        test_recipe:
          setup:
            - "OPEN program; case ELIGIBLE; MEDICAL claim claimed=2,000,000; collateral s1=500,000 (to be CONFIRMED) and s2=300,000 (to be WAIVED); claim SUBMITTED so provisional net computed."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 2000000 }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
            - call: "POST /compensation/collateral-sources"
              payload: { claim_id: "${claim_id}", source_type: "HEALTH_INSURANCE", amount_cents: 500000 }
              as: IntakeCounselor
              captures: { cs1_id: $.data.id }
            - call: "POST /compensation/collateral-sources"
              payload: { claim_id: "${claim_id}", source_type: "EMPLOYER_BENEFIT", amount_cents: 300000 }
              as: IntakeCounselor
              captures: { cs2_id: $.data.id }
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
              captures: { prov_net: $.data.net_claim_cents, prov_offset: $.data.collateral_offset_cents }
          trigger:
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/collateral-sources/${cs1_id}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Adjudicator
            - call: "POST /compensation/collateral-sources/${cs2_id}/transition"
              payload: { to_status: "WAIVED" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 2000000 }
              as: Adjudicator
              captures: { final_net: $.data.net_claim_cents, final_offset: $.data.collateral_offset_cents }
          assert:
            - "${prov_net} == 1200000"
            - "${prov_offset} == 800000"
            - "${final_net} == 1500000"
            - "${final_offset} == 500000"

      - name: program_committed_vs_disbursed
        grounds:
          - calculations.program_budget_ledger
          - entities.Program.fields.budget_committed_cents
          - entities.Program.fields.budget_disbursed_cents
          - state_machines.Disbursement.SCHEDULED_to_PAID
        distinguishing_aspect: "Same Program: budget_committed (forward-looking, sums net_award of non-void Awards) stays 1,000,000 while budget_disbursed (chronological, sums PAID disbursements) is only 600,000 — dual-variant on the Program domain, distinct from the Claim-domain variant."
        test_recipe:
          setup:
            - "OPEN program; ELIGIBLE case with one APPROVED MEDICAL claim net=1,000,000; Award net=1,000,000 APPROVED then FINALIZED; disbursement of 600,000 scheduled."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 1000000 }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 1000000 }
              as: Adjudicator
            - call: "POST /compensation/awards"
              payload: { case_id: "${case_id}", expected_program_version: "${prog_v}" }
              as: Adjudicator
              captures: { award_id: $.data.id }
            - call: "POST /compensation/awards/${award_id}/transition"
              payload: { to_status: "APPROVED" }
              as: Adjudicator
            - call: "POST /compensation/awards/${award_id}/transition"
              payload: { to_status: "FINALIZED" }
              as: FinanceOfficer
            - call: "POST /compensation/disbursements"
              payload: { award_id: "${award_id}", payee_type: "VICTIM", amount_cents: 600000, pay_run_date: "2026-05-10" }
              as: FinanceOfficer
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /compensation/disbursements/${disb_id}/transition"
              payload: { to_status: "PAID" }
              as: FinanceOfficer
            - call: "GET /compensation/programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              captures: { committed: $.data.budget_committed_cents, disbursed: $.data.budget_disbursed_cents }
          assert:
            - "${committed} == 1000000"
            - "${disbursed} == 600000"

  - rule_id: combinatorial_formula
    instances:
      - name: award_net_nested_category_and_overall_caps
        grounds:
          - calculations.award_net
          - entities.Program.fields.medical_cap_cents
          - entities.Program.fields.funeral_cap_cents
          - entities.Award.fields.net_award_cents
        distinguishing_aspect: "Mode (a): net_award = min(sum_cat min(cat_total, cat_cap), overall_cap) — nested min over >=3 inputs; medical total 3,500,000 caps to 3,000,000, funeral total 1,200,000 caps to 1,000,000, overall cap 5,000,000 non-binding => 4,000,000."
        test_recipe:
          setup:
            - "ELIGIBLE case with three APPROVED claims: MEDICAL 1,500,000 + MEDICAL 2,000,000 (cat total 3,500,000 > medical_cap 3,000,000) and FUNERAL 1,200,000 (> funeral_cap 1,000,000)."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "HOMICIDE", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 1500000 }
              as: IntakeCounselor
              captures: { claim_a: $.data.id }
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 2000000 }
              as: IntakeCounselor
              captures: { claim_b: $.data.id }
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "FUNERAL", claimed_amount_cents: 1200000 }
              as: IntakeCounselor
              captures: { claim_c: $.data.id }
            - call: "POST /compensation/claims/${claim_a}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_a}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_a}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 1500000 }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_b}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_b}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_b}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 2000000 }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_c}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_c}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_c}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 1200000 }
              as: Adjudicator
          trigger:
            - call: "POST /compensation/awards"
              payload: { case_id: "${case_id}", expected_program_version: "${prog_v}" }
              as: Adjudicator
              captures: { net: $.data.net_award_cents, gross: $.data.gross_award_cents }
          assert:
            - "${net} == 4000000"
            - "${gross} == 4000000"

      - name: lost_wage_round_per_week_then_multiply
        grounds:
          - calculations.claim_assessed_base
          - entities.Claim.fields.assessed_base_cents
          - state_machines.Claim.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Mode (b): round_half_up the per-week benefit (66,671) BEFORE multiplying by 3 weeks => 200,013; sum-then-round would give 200,012 — pinned rounding order decides the cent."
        test_recipe:
          setup:
            - "ELIGIBLE case; LOST_WAGE claim weekly_wage=100,001, num_weeks=3, disability period [2026-01-01,2026-01-22); WAGE_REPLACEMENT_RATE=0.6667, WEEKLY_MAX=120,000 non-binding."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "DUI", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "LOST_WAGE", weekly_wage_cents: 100001, num_weeks: 3, disability_start_date: "2026-01-01", disability_end_date: "2026-01-22" }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
              captures: { base: $.data.assessed_base_cents, net: $.data.net_claim_cents }
          assert:
            - "${base} == 200013"
            - "${net} == 200013"

  - rule_id: non_linear_state_machine
    instances:
      - name: case_cyclic_reopen_on_appeal_grant
        grounds:
          - state_machines.VictimCase.INELIGIBLE_to_UNDER_REVIEW
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
          - entities.VictimCase.fields.eligibility_status
        distinguishing_aspect: "VictimCase makes an INELIGIBLE -> UNDER_REVIEW backward edge on appeal grant (a cycle), so the case machine is not a forward-only pipeline; entity is VictimCase."
        test_recipe:
          setup:
            - "Case determined INELIGIBLE by adjudicator adj-1 at clock default 2026-05-01; appeal filed and moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ROBBERY", reported_to_le: false, cooperation_status: "NONCOOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "INELIGIBLE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /compensation/appeals"
              payload: { case_id: "${case_id}", appeal_reason: "New police report obtained" }
              as: IntakeCounselor
              captures: { appeal_id: $.data.id }
            - call: "POST /compensation/appeals/${appeal_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: AppealsOfficer
              as_user_id: "appeals-1"
          trigger:
            - call: "POST /compensation/appeals/${appeal_id}/transition"
              payload: { to_status: "GRANTED" }
              as: AppealsOfficer
              as_user_id: "appeals-1"
            - call: "GET /compensation/cases/${case_id}"
              payload: {}
              as: Adjudicator
              captures: { case_status: $.data.status, elig: $.data.eligibility_status }
          assert:
            - "${case_status} == UNDER_REVIEW"
            - "${elig} == UNDETERMINED"

      - name: award_parallel_approval_and_payment_axes
        grounds:
          - state_machines.Award.APPROVED_to_FINALIZED
          - state_machines.Award.UNPAID_to_PARTIALLY_PAID
          - entities.Award.fields.approval_status
          - entities.Award.fields.payment_status
        distinguishing_aspect: "On one Award, approval_status reaches FINALIZED while payment_status is independently PARTIALLY_PAID (400,000 of 1,000,000) — two parallel state axes on the same row; entity is Award (distinct from VictimCase)."
        test_recipe:
          setup:
            - "ELIGIBLE case, APPROVED claim net=1,000,000, Award APPROVED then FINALIZED, one 400,000 disbursement scheduled."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 1000000 }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 1000000 }
              as: Adjudicator
            - call: "POST /compensation/awards"
              payload: { case_id: "${case_id}", expected_program_version: "${prog_v}" }
              as: Adjudicator
              captures: { award_id: $.data.id }
            - call: "POST /compensation/awards/${award_id}/transition"
              payload: { to_status: "APPROVED" }
              as: Adjudicator
            - call: "POST /compensation/awards/${award_id}/transition"
              payload: { to_status: "FINALIZED" }
              as: FinanceOfficer
            - call: "POST /compensation/disbursements"
              payload: { award_id: "${award_id}", payee_type: "VICTIM", amount_cents: 400000, pay_run_date: "2026-05-10" }
              as: FinanceOfficer
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /compensation/disbursements/${disb_id}/transition"
              payload: { to_status: "PAID" }
              as: FinanceOfficer
            - call: "GET /compensation/awards/${award_id}"
              payload: {}
              as: FinanceOfficer
              captures: { appr: $.data.approval_status, pay: $.data.payment_status, paid: $.data.amount_paid_cents }
          assert:
            - "${appr} == FINALIZED"
            - "${pay} == PARTIALLY_PAID"
            - "${paid} == 400000"

  - rule_id: transitive_cascade
    instances:
      - name: appeal_grant_reopens_case_then_claim_depth3
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
          - state_machines.VictimCase.INELIGIBLE_to_UNDER_REVIEW
          - state_machines.Claim.DENIED_to_UNDER_REVIEW
          - entities.Notification.fields.event_type
        distinguishing_aspect: "Appeal GRANTED -> Case INELIGIBLE->UNDER_REVIEW -> that reopen mutates each DENIED Claim -> UNDER_REVIEW and clears its denial fields; a 3-hop chain where each link is caused by the previous (origin: appeal grant)."
        test_recipe:
          setup:
            - "Case with a DENIED claim (denied by adj-1), case determined INELIGIBLE by adj-1, appeal filed and UNDER_REVIEW; clock default 2026-05-01."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 500000 }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "DENIED" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "INELIGIBLE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /compensation/appeals"
              payload: { case_id: "${case_id}", appeal_reason: "Documentation corrected" }
              as: IntakeCounselor
              captures: { appeal_id: $.data.id }
            - call: "POST /compensation/appeals/${appeal_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: AppealsOfficer
              as_user_id: "appeals-1"
          trigger:
            - call: "POST /compensation/appeals/${appeal_id}/transition"
              payload: { to_status: "GRANTED" }
              as: AppealsOfficer
              as_user_id: "appeals-1"
            - call: "GET /compensation/cases/${case_id}"
              payload: {}
              as: Adjudicator
              captures: { case_status: $.data.status }
            - call: "GET /compensation/claims/${claim_id}"
              payload: {}
              as: Adjudicator
              captures: { claim_status: $.data.status, claim_denier: $.data.denied_by_user_id }
          assert:
            - "${case_status} == UNDER_REVIEW"
