            - "the 5500-point call returns 422 with error_id ERR_TRANSFER_INCREMENT_INVALID"
            - "the 5000-point call returns 201"
            - "TransferRequest.${tr_id}.points_out == 5000 and status == SUBMITTED"
            - "Account.${a_id}.points_balance == 5000 and points_pending_redemption == 5000"
            - "GET /rewards/transfer-requests with account_id ${a_id} returns total_count 1"

