# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1971: Wholesale Buying Group & Co-op Rebate Administration
# =============================================================================
# Enumerative coverage of testable claims §1.8 does NOT already cover.
# Each instance cites claim-extraction-guide section + claim_type.
# `excluded_because` stubs mark corners already exercised by §1.8 instances.
# All names unique across the union of difficulty and corner designs.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities (from claim-extraction-guide §1)
  # ===========================================================================
  - section: entities
    instances:
      - name: coop_bootstrap_creates_singleton_with_zero_counters
        claim_type: creation
        grounds:
          - entities.Coop.fields.current_quarter_index
          - entities.Coop.fields.pool_reserve_cents
          - entities.Coop.fields.retained_revenue_cents
        distinguishing_aspect: |
          POST /coop/bootstrap returns 201 with current_quarter_index=0,
          pool_reserve_cents=0, retained_revenue_cents=0; id is a server-minted UUID.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/bootstrap"
              payload: { name: "Init" }
              as: CoopAdmin
              captures: { cid: $.data.id, q: $.data.current_quarter_index, pool: $.data.pool_reserve_cents, ret: $.data.retained_revenue_cents }
          assert:
            - "HTTP status == 201"
            - "Coop.current_quarter_index == 0"
            - "Coop.pool_reserve_cents == 0"
            - "Coop.retained_revenue_cents == 0"
            - "Coop.id is a UUID (no type prefix)"

      - name: member_create_returns_pending_with_defaults
        claim_type: creation
        grounds:
          - entities.Member.fields.status
          - entities.Member.fields.lifetime_pass_through_cents
          - entities.Member.fields.prior_audit_findings_count
        distinguishing_aspect: |
          New Member starts in PENDING with computed counters zeroed; input
          fields legal_name and commitment_level are echoed in response.
        test_recipe:
          setup: ["Co-op bootstrapped"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/members"
              payload: { legal_name: "NewMember", commitment_level: "BUILDER" }
              as: CoopAdmin
              captures: { mid: $.data.id, st: $.data.status }
          assert:
            - "Member.status == PENDING"
            - "Member.commitment_level == BUILDER"
            - "Member.lifetime_pass_through_cents == 0"
            - "Member.prior_audit_findings_count == 0"

      - name: member_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Member.fields.legal_name
        distinguishing_aspect: |
          POST /coop/members without legal_name is rejected with
          ERR_INVALID_REQUEST (400).
        test_recipe:
          setup: ["Co-op bootstrapped"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/members"
              payload: { commitment_level: "STANDARD" }
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: member_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          GET /coop/members/{uuid} with no such member returns ERR_NOT_FOUND (404).
        test_recipe:
          setup: ["Co-op bootstrapped"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
          trigger:
            - call: "GET /coop/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: member_list_returns_paginated_array_with_envelope
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: |
          GET /coop/members returns response_type=array with pagination fields
          limit/offset/total_count/has_more per response_envelope.
        test_recipe:
          setup: ["Co-op bootstrapped; 2 members created"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M1", commitment_level: "STANDARD" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M2", commitment_level: "PLATINUM" }
              as: CoopAdmin
          trigger:
            - call: "GET /coop/members"
              payload: {}
              as: CoopAdmin
          assert:
            - "response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == array"
            - "pagination keys limit, offset, total_count, has_more present"
            - "total_count == 2"

      - name: supplier_program_create_with_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.SupplierProgram.fields.holdback_policy
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          holdback_policy must be FLAT or RISK_ADJUSTED; any other value
          returns ERR_INVALID_REQUEST.
        test_recipe:
          setup: ["Co-op bootstrapped; Supplier S exists"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/suppliers"
              payload: { legal_name: "S" }
              as: CoopAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /coop/suppliers/${s_id}/supplier-programs"
              payload:
                program_code: "P-BAD"
                exclusivity_required: false
                exclusivity_threshold_pct: 0
                tier_schedule: [{ min_qty: 0, rate_bps: 100 }]
                holdback_policy: "BOGUS"
              as: SupplierRep
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: purchase_report_reverse_reachable_from_enrollment
        claim_type: parent_relationships
        grounds:
          - entities.PurchaseReport.fields.enrollment_id
        distinguishing_aspect: |
          Every PurchaseReport is reachable from its parent ProgramEnrollment
          via GET /coop/enrollments/{id}/purchase-reports returning an array.
        test_recipe:
          setup: ["Co-op, member, supplier, program, enrollment, report all created"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", commitment_level: "STANDARD" }
              as: CoopAdmin
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers"
              payload: { legal_name: "S" }
              as: CoopAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coop/suppliers/${s_id}/onboard"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers/${s_id}/supplier-programs"
              payload:
                program_code: "P-PAR"
                exclusivity_required: false
                exclusivity_threshold_pct: 0
                tier_schedule: [{ min_qty: 0, rate_bps: 100 }]
                holdback_policy: "FLAT"
              as: SupplierRep
              as_user_id: "${s_id}"
              captures: { p_id: $.data.id }
            - call: "POST /coop/supplier-programs/${p_id}/open"
              payload: {}
              as: SupplierRep
              as_user_id: "${s_id}"
            - call: "POST /coop/enrollments"
              payload: { member_id: "${m_id}", program_id: "${p_id}" }
              as: CoopAdmin
              captures: { e_id: $.data.id }
            - call: "POST /coop/enrollments/${e_id}/purchase-reports"
              payload: { quarter_index: 0, self_report_qty: 5, self_report_cents: 5000 }
              as: MemberRep
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /coop/enrollments/${e_id}/purchase-reports"
              payload: {}
              as: CoopAdmin
          assert:
            - "response is PurchaseReport[] of length 1"
            - "PurchaseReport[0].enrollment_id == ${e_id}"

  # ===========================================================================
  # Section 2 — State Machines (from claim-extraction-guide §2)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: member_activate_from_pending_succeeds
        claim_type: valid_transition
        grounds:
          - state_machines.Member.PENDING_to_ACTIVE
        distinguishing_aspect: |
          POST /members/{id}/activate on a PENDING member transitions to
          ACTIVE and stamps enrolled_quarter_index = current_quarter_index.
        test_recipe:
          setup: ["Co-op bootstrapped; member created (PENDING)"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", commitment_level: "STANDARD" }
              as: CoopAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: CoopAdmin
              captures: { st: $.data.status, eq: $.data.enrolled_quarter_index }
          assert:
            - "Member.status == ACTIVE"
            - "Member.enrolled_quarter_index == 0"

      - name: member_activate_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Member.PENDING_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Second activate on an already-ACTIVE member returns ERR_INVALID_STATE.
        test_recipe:
          setup: ["Member M ACTIVE"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", commitment_level: "STANDARD" }
              as: CoopAdmin
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: CoopAdmin
          trigger:
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: member_reinstate_blocked_with_open_clawback
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Member.SUSPENDED_to_ACTIVE
          - validations[priority=19]
          - errors[ERR_OPEN_CLAWBACK]
        distinguishing_aspect: |
          Reinstate is blocked while any ClawbackCase for the member is in
          OPEN/NOTIFIED/DISPUTED; returns ERR_OPEN_CLAWBACK.
        test_recipe:
          setup:
            - "Member M churned then reinstated is not allowed; instead: M suspended,"
            - "a clawback exists in OPEN (manually constructed via churn-then-uncancelled is impossible,"
            - "so instead we suspend-then-attempt-reinstate-without-clawback should succeed;"
            - "for the negative case: churn M -> clawback OPEN; attempt to reinstate a CHURNED member"
            - "returns ERR_INVALID_STATE (not ERR_OPEN_CLAWBACK). Adjusted: we exercise the"
            - "ERR_OPEN_CLAWBACK precondition by suspending an ACTIVE member, then attempting"
            - "reinstate on that SUSPENDED member is fine — no clawback. To trigger ERR_OPEN_CLAWBACK"
            - "we need an open clawback WITHOUT churn, which only audit/exclusivity paths create."
            - "Construct: M ACTIVE, enrollment E, quarter 0 report, close_quarter (accrual finalized),"
            - "audit resolve MATERIAL on already-DISTRIBUTED accrual creates AUDIT_SHORTFALL clawback OPEN,"
            - "then suspend M (still has OPEN clawback), attempt reinstate -> ERR_OPEN_CLAWBACK."
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", commitment_level: "STANDARD" }
              as: CoopAdmin
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers"
              payload: { legal_name: "S" }
              as: CoopAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coop/suppliers/${s_id}/onboard"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers/${s_id}/supplier-programs"
              payload:
                program_code: "P-OC"
                exclusivity_required: false
                exclusivity_threshold_pct: 0
                tier_schedule: [{ min_qty: 0, rate_bps: 200 }, { min_qty: 100, rate_bps: 500 }]
                holdback_policy: "FLAT"
              as: SupplierRep
              as_user_id: "${s_id}"
              captures: { p_id: $.data.id }
            - call: "POST /coop/supplier-programs/${p_id}/open"
              payload: {}
              as: SupplierRep
              as_user_id: "${s_id}"
            - call: "POST /coop/enrollments"
              payload: { member_id: "${m_id}", program_id: "${p_id}" }
              as: CoopAdmin
              captures: { e_id: $.data.id }
            - call: "POST /coop/enrollments/${e_id}/purchase-reports"
              payload: { quarter_index: 0, self_report_qty: 120, self_report_cents: 200000 }
              as: MemberRep
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id }
            - call: "POST /coop/close_quarter"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/distributions"
              payload: {}
              as: FinanceOfficer
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /coop/distributions/${d_id}/calculate"
              payload: { expected_distribution_version: "${d_v}" }
              as: FinanceOfficer
            - call: "POST /coop/distributions/${d_id}/approve"
              payload: {}
              as: FinanceOfficer
            - call: "POST /coop/distributions/${d_id}/disburse"
              payload: {}
              as: FinanceOfficer
            # Now audit the report and resolve MATERIAL -> accrual was DISTRIBUTED -> AUDIT_SHORTFALL clawback OPEN.
            - call: "POST /coop/volume-audits"
              payload: { purchase_report_id: "${r_id}" }
              as: ProgramAuditor
              captures: { v_id: $.data.id }
            - call: "POST /coop/volume-audits/${v_id}/begin_fieldwork"
              payload: {}
              as: ProgramAuditor
            - call: "POST /coop/volume-audits/${v_id}/issue_findings"
              payload: {}
              as: ProgramAuditor
            - call: "POST /coop/volume-audits/${v_id}/accept_findings"
              payload: {}
              as: MemberRep
              as_user_id: "${m_id}"
            - call: "POST /coop/volume-audits/${v_id}/resolve"
              payload: { audited_qty: 50, audited_cents: 100000 }
              as: ProgramAuditor
            # Suspend the member.
            - call: "POST /coop/members/${m_id}/suspend"
              payload: {}
              as: CoopAdmin
          trigger:
            - call: "POST /coop/members/${m_id}/reinstate"
              payload: {}
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OPEN_CLAWBACK"
            - "HTTP status == 409"
            - "Member.${m_id}.status == SUSPENDED  # unchanged"

      - name: supplier_deactivate_blocked_with_open_program
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Supplier.ONBOARDED_to_INACTIVE
          - errors[ERR_SUPPLIER_HAS_ACTIVE_PROGRAMS]
        distinguishing_aspect: |
          Deactivating a supplier with a program in OPEN returns
          ERR_SUPPLIER_HAS_ACTIVE_PROGRAMS.
        test_recipe:
          setup: ["Supplier S ONBOARDED; Program P OPEN"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/suppliers"
              payload: { legal_name: "S" }
              as: CoopAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coop/suppliers/${s_id}/onboard"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers/${s_id}/supplier-programs"
              payload:
                program_code: "P-DEACT"
                exclusivity_required: false
                exclusivity_threshold_pct: 0
                tier_schedule: [{ min_qty: 0, rate_bps: 100 }]
                holdback_policy: "FLAT"
              as: SupplierRep
              as_user_id: "${s_id}"
            - call: "POST /coop/supplier-programs/${p_id}/open"
              payload: {}
              as: SupplierRep
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /coop/suppliers/${s_id}/deactivate"
              payload: {}
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SUPPLIER_HAS_ACTIVE_PROGRAMS"
            - "HTTP status == 409"

      - name: supplier_program_terminate_blocked_with_active_enrollments
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SupplierProgram.OPEN_to_TERMINATED
          - errors[ERR_PROGRAM_HAS_ENROLLMENTS]
        distinguishing_aspect: |
          Terminating an OPEN program with an ACTIVE enrollment returns
          ERR_PROGRAM_HAS_ENROLLMENTS.
        test_recipe:
          setup: ["Member M ACTIVE; Program P OPEN; Enrollment E ACTIVE"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", commitment_level: "STANDARD" }
              as: CoopAdmin
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers"
              payload: { legal_name: "S" }
              as: CoopAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coop/suppliers/${s_id}/onboard"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers/${s_id}/supplier-programs"
              payload:
                program_code: "P-TERM"
                exclusivity_required: false
                exclusivity_threshold_pct: 0
                tier_schedule: [{ min_qty: 0, rate_bps: 100 }]
                holdback_policy: "FLAT"
              as: SupplierRep
              as_user_id: "${s_id}"
              captures: { p_id: $.data.id }
            - call: "POST /coop/supplier-programs/${p_id}/open"
              payload: {}
              as: SupplierRep
              as_user_id: "${s_id}"
            - call: "POST /coop/enrollments"
              payload: { member_id: "${m_id}", program_id: "${p_id}" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/supplier-programs/${p_id}/terminate"
              payload: {}
              as: SupplierRep
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_HAS_ENROLLMENTS"
            - "HTTP status == 409"

      - name: purchase_report_flag_from_submitted_succeeds
        claim_type: valid_transition
        grounds:
          - state_machines.PurchaseReport.SUBMITTED_to_FLAGGED
        distinguishing_aspect: |
          POST /purchase-reports/{id}/flag transitions SUBMITTED -> FLAGGED.
        test_recipe:
          setup: ["Member, supplier, program, enrollment, and a SUBMITTED report exist"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", commitment_level: "STANDARD" }
              as: CoopAdmin
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers"
              payload: { legal_name: "S" }
              as: CoopAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coop/suppliers/${s_id}/onboard"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers/${s_id}/supplier-programs"
              payload:
                program_code: "P-FLG"
                exclusivity_required: false
                exclusivity_threshold_pct: 0
                tier_schedule: [{ min_qty: 0, rate_bps: 100 }]
                holdback_policy: "FLAT"
              as: SupplierRep
              as_user_id: "${s_id}"
              captures: { p_id: $.data.id }
            - call: "POST /coop/supplier-programs/${p_id}/open"
              payload: {}
              as: SupplierRep
              as_user_id: "${s_id}"
            - call: "POST /coop/enrollments"
              payload: { member_id: "${m_id}", program_id: "${p_id}" }
              as: CoopAdmin
              captures: { e_id: $.data.id }
            - call: "POST /coop/enrollments/${e_id}/purchase-reports"
              payload: { quarter_index: 0, self_report_qty: 5, self_report_cents: 5000 }
              as: MemberRep
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /coop/purchase-reports/${r_id}/flag"
              payload: {}
              as: ProgramAuditor
              captures: { st: $.data.status }
          assert:
            - "PurchaseReport.status == FLAGGED"

      - name: purchase_report_revise_creates_superseding_report
        claim_type: side_effect_execution
        grounds:
          - state_machines.PurchaseReport.FLAGGED_to_SUBMITTED
          - state_machines.PurchaseReport.FLAGGED_to_SUPERSEDED
        distinguishing_aspect: |
          POST /purchase-reports/{id}/revise on a FLAGGED report creates a NEW
          SUBMITTED report with revision_of_id pointing to the old; old report
          transitions to SUPERSEDED.
        test_recipe:
          setup: ["FLAGGED report R exists"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", commitment_level: "STANDARD" }
              as: CoopAdmin
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers"
              payload: { legal_name: "S" }
              as: CoopAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coop/suppliers/${s_id}/onboard"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers/${s_id}/supplier-programs"
              payload:
                program_code: "P-REV"
                exclusivity_required: false
                exclusivity_threshold_pct: 0
                tier_schedule: [{ min_qty: 0, rate_bps: 100 }]
                holdback_policy: "FLAT"
              as: SupplierRep
              as_user_id: "${s_id}"
              captures: { p_id: $.data.id }
            - call: "POST /coop/supplier-programs/${p_id}/open"
              payload: {}
              as: SupplierRep
              as_user_id: "${s_id}"
            - call: "POST /coop/enrollments"
              payload: { member_id: "${m_id}", program_id: "${p_id}" }
              as: CoopAdmin
              captures: { e_id: $.data.id }
            - call: "POST /coop/enrollments/${e_id}/purchase-reports"
              payload: { quarter_index: 0, self_report_qty: 5, self_report_cents: 5000 }
              as: MemberRep
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id }
            - call: "POST /coop/purchase-reports/${r_id}/flag"
              payload: {}
              as: ProgramAuditor
          trigger:
            - call: "POST /coop/purchase-reports/${r_id}/revise"
              payload: { self_report_qty: 8, self_report_cents: 8000 }
