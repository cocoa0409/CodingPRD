            - "exactly one PlatformRequest exists after the five calls (GET /platform-requests filtered by estate_id ${est_a_id} returns 1 row)"
            - "GET /documents filtered by estate_id ${est_a_id} returns 2 rows and by estate_id ${est_b_id} returns 1 row (FK reverse-reachability)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: verifying_the_letters_document_issues_authority_and_lifts_the_phase
        claim_type: Valid Transition
        grounds:
          - state_machines.Document.transitions[PENDING->VERIFIED]
          - entities.Fiduciary.fields.letters_status
          - calculations.estate_administration_phase
        distinguishing_aspect: |
          Verifying the death certificate alone leaves the estate in INTAKE; only when the
          LETTERS_OF_AUTHORITY document is verified does the named Fiduciary flip PENDING -> ISSUED
          and the estate reach AUTHORIZED. The two hops are ordered — the phase is re-derived from
          the letters_status change, not from the document row.
        test_recipe:
          setup:
            - "one Estate with one EXECUTOR Fiduciary"
            - "one PENDING DEATH_CERTIFICATE and one PENDING LETTERS_OF_AUTHORITY naming that fiduciary"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C09" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C09" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-C09", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-C09", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
          trigger:
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
              captures: { dc_state: $.data.verification_status }
            - call: "GET /estates/${est_id}"
              payload: {}
              as: CourtRegistrar
              captures: { phase_after_dc: $.data.administration_phase }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
              captures: { loa_state: $.data.verification_status }
            - call: "GET /fiduciaries/${fid1_id}"
              payload: {}
              as: CourtRegistrar
              captures: { letters_state: $.data.letters_status }
            - call: "GET /estates/${est_id}"
              payload: {}
              as: CourtRegistrar
              captures: { phase_after_loa: $.data.administration_phase }
          assert:
            - "${dc_state} == VERIFIED"
            - "${phase_after_dc} == INTAKE (a verified certificate without issued letters is not enough)"
            - "${loa_state} == VERIFIED"
            - "${letters_state} == ISSUED"
            - "${phase_after_loa} == AUTHORIZED"
            - "Fiduciary.${fid1_id}.version == 2 (creation 1, one letters_status write)"
            - "Estate.${est_id}.disclosed_asset_count == 0 and inventory_total_count == 0"
            - "Document.${loa_id}.verified_at == 2026-08-01T00:00:00Z"
            - "verifying a LETTERS_OF_AUTHORITY document created without fiduciary_id leaves every Fiduciary at letters_status PENDING and the estate at INTAKE"

      - name: platform_request_approval_creates_the_grant_and_discloses_the_catalog
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PlatformRequest.transitions[UNDER_REVIEW->APPROVED]
        excluded_because:
          difficulty_instance: approval_cascades_grant_to_disclosure_to_cancellation_order_to_estate_counters
          rationale: "The four-hop approval side-effect chain (grant -> asset disclosure -> auto-created cancellation order -> estate counters and phase) is asserted hop by hop by the named §1.8 instance."

      - name: submitting_a_request_requires_the_named_fiduciary_to_hold_issued_letters
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=41]
          - state_machines.PlatformRequest.transitions[DRAFT->SUBMITTED]
        distinguishing_aspect: |
          With a VERIFIED death certificate but a still-PENDING letters document, SUBMIT is refused
          with ERR_LETTERS_NOT_ISSUED (409) even though the request row itself is a perfectly valid
          DRAFT; verifying the letters document afterwards makes the identical call succeed, proving
          the check reads the Fiduciary's letters_status rather than the request's own fields.
        test_recipe:
          setup:
            - "one Platform, one Estate, one Fiduciary"
            - "a VERIFIED DEATH_CERTIFICATE and a PENDING LETTERS_OF_AUTHORITY naming that fiduciary"
            - "one DRAFT CATALOG_ACCESS request referencing both documents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C10" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C10" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-C10", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-C10", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_cloud_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "CV-FORM-1" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { err_letters: $.data.error_id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { status_ok: $.data.status, win_start: $.data.review_window_start }
          assert:
            - "${err_letters} == ERR_LETTERS_NOT_ISSUED with HTTP 409"
            - "after the refusal PlatformRequest.${req_id}.status == DRAFT and review_window_start is null"
            - "${status_ok} == SUBMITTED"
            - "${win_start} == 2026-08-01T00:00:00Z and review_window_end == 2026-08-15T00:00:00Z"
            - "Fiduciary.${fid1_id}.letters_status == ISSUED at the moment of the successful SUBMIT"
            - "Estate.${est_id}.administration_phase == AUTHORIZED"

      - name: platform_request_actions_from_a_wrong_source_state_are_rejected
        claim_type: Invalid Transitions
        grounds:
          - validations[priority=30]
          - state_machines.PlatformRequest.transitions[SUBMITTED->UNDER_REVIEW]
          - state_machines.PlatformRequest.transitions[UNDER_REVIEW->APPROVED]
          - state_machines.PlatformRequest.transitions[SUBMITTED->WITHDRAWN]
        distinguishing_aspect: |
          Each action is defined from exactly one source state: START_REVIEW and RESUBMIT are refused
          on a DRAFT request, DECIDE and a second SUBMIT are refused on a SUBMITTED one, and WITHDRAW
          is refused once the request reached UNDER_REVIEW — all with ERR_INVALID_REQUEST_STATE (409)
          and with no status or window field mutated by the refusal.
        test_recipe:
          setup:
            - "one Platform, one Estate, one Fiduciary with ISSUED letters and a VERIFIED death certificate"
            - "one DRAFT CATALOG_ACCESS request"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
