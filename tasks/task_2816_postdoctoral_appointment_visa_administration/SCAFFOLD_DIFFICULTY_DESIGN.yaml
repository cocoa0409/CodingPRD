  - rule_id: resource_temporal_overlap
    instances:

      - name: successive_appointment_terms_treat_a_touching_endpoint_as_an_overlap
        grounds:
          - validations.priority_25_ERR_APPOINTMENT_TERM_OVERLAP
          - calculations.months_in_rank_ledger
          - entities.Appointment.fields.term_start_date
          - entities.Appointment.fields.term_end_date
        distinguishing_aspect: |
          Resource: a single scholar's appointment timeline (the contended resource
          is the person, and the guarded quantity is "at most one live term").
          Interval semantics: fully CLOSED on both ends, with no buffer, so a new
          term starting on the incumbent term's last day is a conflict even though
          the intervals share exactly one calendar day. Only appointments in
          {OFFER_ISSUED, OFFER_ACCEPTED, ACTIVE} count, so the incumbent is held at
          OFFER_ISSUED to prove the filter is on status and not on "any row".
        test_recipe:
          setup:
            - "One US-citizen scholar with no prior rank months, one mentor with valid training, one VERIFIED NIH_SCALE FEDERAL_GRANT covering 2026-09-01 to 2028-12-31 with a 600000.00 budget."
