scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_course_returns_201_draft_with_all_fields
        claim_type: Creation
        grounds: [entities.Course, endpoints]
        distinguishing_aspect: "POST /courses with all required fields returns 201, status DRAFT, and echoes every input field plus system id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB; Registrar authenticated."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /courses"
              payload: { exam_type: "MCAT", format: "ONLINE", title: "MCAT Online", list_price_cents: 250000, baseline_scale_max: 528, guarantee_min_delta: 10, required_practice_tests: 3, required_attendance_pct: 0.7, materials_access_days: 180 }
              as: Registrar
              captures: { course_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Course.${course_id}.status == DRAFT"
            - "Course.${course_id}.version == 1"
            - "Course.${course_id}.baseline_scale_max == 528"

      - name: get_course_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Course, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /courses/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /courses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_course_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Course, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /courses omitting baseline_scale_max (required, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB; Registrar authenticated."]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { exam_type: "LSAT", format: "LIVE", title: "LSAT", list_price_cents: 90000, guarantee_min_delta: 7, required_practice_tests: 2, required_attendance_pct: 0.8, materials_access_days: 60 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_course_invalid_enum_exam_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Course, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "exam_type outside {SAT,ACT,MCAT,LSAT} (e.g. GMAT) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB; Registrar authenticated."]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { exam_type: "GMAT", format: "LIVE", title: "X", list_price_cents: 90000, baseline_scale_max: 800, guarantee_min_delta: 50, required_practice_tests: 2, required_attendance_pct: 0.8, materials_access_days: 60 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: cohort_ends_before_starts_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Cohort.fields.ends_at, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cohorts with ends_at <= starts_at violates the declared constraint and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A published SAT course exists."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "LIVE", title: "SAT", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.5, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-30T00:00:00Z", ends_at: "2026-06-01T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: practice_attempt_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.PracticeAttempt]
        distinguishing_aspect: "PracticeAttempt has common_fields:false — its GET response exposes id and created_at but NO version/updated_at field, and there is no PUT/PATCH endpoint for it."
        test_recipe:
          setup: ["An enrollment with a STARTED practice attempt exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "SELF", title: "SAT", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.0, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "im@x.com", full_name: "IM" }
              as: Anonymous
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /installment-plans"
              payload: { enrollment_id: "${enr_id}", num_installments: 1 }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /installment-plans/${plan_id}/payments"
              payload: { amount_cents: 100000 }
              as: Registrar
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "PRACTICE", raw_correct: 400, total_items: 800 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att_id: $.data.id }
          trigger:
            - call: "GET /practice-attempts/${att_id}"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          assert:
            - "PracticeAttempt.${att_id}.status == STARTED"
            - "PracticeAttempt response has no 'version' field"

      - name: cohort_create_wrong_parent_course_not_found
        claim_type: Parent Relationships
        grounds: [entities.Cohort.fields.course_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /cohorts referencing a non-existent course_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; Registrar authenticated."]
          setup_api_calls: []
          trigger:
            - call: "POST /cohorts"
              payload: { course_id: "00000000-0000-4000-8000-000000000999", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: student_diagnostic_score_is_system_computed_not_input
        claim_type: System Fields
        grounds: [entities.Student.fields.diagnostic_score]
        distinguishing_aspect: "POST /students/register accepts only email/full_name; diagnostic_score is system and starts null regardless of any client attempt."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /students/register"
              payload: { email: "sys@x.com", full_name: "Sys" }
              as: Anonymous
              captures: { stu_id: $.data.id, ds: $.data.diagnostic_score }
          assert:
            - "Student.${stu_id}.diagnostic_score == null"
            - "HTTP status == 201"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: conclude_before_window_returns_window_not_open
        claim_type: Precondition Enforcement
        grounds: [state_machines.Cohort.IN_SESSION_to_CONCLUDED, "errors[ERR_COHORT_WINDOW_NOT_OPEN]"]
        distinguishing_aspect: "Concluding an IN_SESSION cohort while logical clock < ends_at returns ERR_COHORT_WINDOW_NOT_OPEN (409)."
        test_recipe:
          setup: ["A cohort started (IN_SESSION) but the clock is still before ends_at."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "LIVE", title: "SAT", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.5, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: Registrar
            - call: "POST /cohorts/${cohort_id}/start"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /cohorts/${cohort_id}/conclude"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COHORT_WINDOW_NOT_OPEN"
            - "Cohort.${cohort_id}.status == IN_SESSION"

      - name: start_cohort_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Cohort, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /cohorts/{id}/start on a DRAFT cohort (no SCHEDULED) returns ERR_INVALID_STATE (409); start is only defined from SCHEDULED."
        test_recipe:
          setup: ["A DRAFT cohort under a published course (never scheduled)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "LIVE", title: "SAT", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.5, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
          trigger:
            - call: "POST /cohorts/${cohort_id}/start"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Cohort.${cohort_id}.status == DRAFT"

      - name: conclude_concluded_cohort_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Cohort, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CONCLUDED cohort (terminal) rejects a second conclude with ERR_INVALID_STATE (409); no transition out of terminal states."
        test_recipe:
          setup: ["A cohort fully concluded."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "SELF", title: "SAT", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.0, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: Registrar
            - call: "POST /cohorts/${cohort_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /cohorts/${cohort_id}/conclude"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /cohorts/${cohort_id}/conclude"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Cohort.${cohort_id}.status == CONCLUDED"

      - name: void_completed_attempt_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.PracticeAttempt, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding an already-COMPLETED attempt returns ERR_INVALID_STATE (409); void is only defined from STARTED."
        test_recipe:
          setup: ["A COMPLETED practice attempt."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "SELF", title: "SAT", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.0, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "vc@x.com", full_name: "VC" }
              as: Anonymous
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /installment-plans"
              payload: { enrollment_id: "${enr_id}", num_installments: 1 }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /installment-plans/${plan_id}/payments"
              payload: { amount_cents: 100000 }
              as: Registrar
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "PRACTICE", raw_correct: 400, total_items: 800 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att_id: $.data.id }
            - call: "POST /practice-attempts/${att_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "POST /practice-attempts/${att_id}/void"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "PracticeAttempt.${att_id}.status == COMPLETED"

      - name: diagnostic_score_set_on_first_diagnostic_side_effect
        claim_type: Side Effect Execution
        grounds: [state_machines.PracticeAttempt.STARTED_to_COMPLETED, entities.Student.fields.diagnostic_score]
        distinguishing_aspect: "Scoring the first DIAGNOSTIC attempt sets Student.diagnostic_score to the computed scaled_score (50/80 of 1600 = 1000)."
        test_recipe:
          setup: ["Active enrollment with a STARTED DIAGNOSTIC attempt (raw 50/80)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "SELF", title: "SAT", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.0, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "dg@x.com", full_name: "DG" }
              as: Anonymous
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /installment-plans"
              payload: { enrollment_id: "${enr_id}", num_installments: 1 }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /installment-plans/${plan_id}/payments"
              payload: { amount_cents: 100000 }
              as: Registrar
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "DIAGNOSTIC", raw_correct: 50, total_items: 80 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { diag_id: $.data.id }
          trigger:
            - call: "POST /practice-attempts/${diag_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { sc: $.data.scaled_score }
          assert:
            - "PracticeAttempt.${diag_id}.scaled_score == 1000"
            - "Student.${stu_id}.diagnostic_score == 1000"

      - name: cohort_cancel_cascades_enrollment_cancel
        claim_type: Side Effect Execution
        grounds: [state_machines.Cohort.SCHEDULED_to_CANCELLED, state_machines.Enrollment.PENDING_PAYMENT_to_CANCELLED]
        distinguishing_aspect: "Cancelling a SCHEDULED cohort cascades: a PENDING_PAYMENT enrollment on it becomes CANCELLED and the assigned instructor's active_cohort_count drops by 1."
        test_recipe:
          setup: ["A SCHEDULED cohort with one PENDING_PAYMENT enrollment; assigned instructor active_cohort_count 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "LIVE", title: "SAT", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.5, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "cc@x.com", full_name: "CC" }
              as: Anonymous
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${stu_id}"
