          - state_machines.AuditCase.ISSUED_to_ABATED.side_effects
        distinguishing_aspect: "Abatement is all-or-nothing, so it is refused once the licensee has retired part of the assessed liability: a 275250-cent assessment against which 100000 has been paid cannot be reversed in full without minting a credit, while the identical untouched assessment on a sibling licensee abates cleanly."
        test_recipe:
          setup:
            - "Two DISTRIBUTORs with no returns and zero balances; AuditManager aud-01 opened a MANUAL_REFERRAL case over 2026-08..2026-08 on each and advanced both to PRELIM_FINDINGS."
            - "Clock moved to 2026-09-25T00:00:00Z, 4 whole days past the 2026-09-20T23:59:59Z due instant, then TaxSupervisor sup-01 issued a 250000-cent assessment with evasion_indicator false on each case: penalty 25000, interest 250, assessed_total 275250."
            - "Distributor one then paid 100000 cents, leaving balance_cents 175250; distributor two paid nothing."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Abate One Distribution Inc", fein: "41-8200001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
