  - section: rbac
    instances:
      - name: corner_missing_identity_headers_are_unauthenticated
        claim_type: authentication_required
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - response_envelope
        distinguishing_aspect: "The identity rung sits above every other check: a request with no X-User-Role / X-User-ID pair is refused 401 ERR_UNAUTHENTICATED even when it targets a plainly non-existent id, so authentication is resolved before path existence (404) and before role authorisation (403)."
        test_recipe:
          setup:
            - "Empty database; no identity headers are sent on the trigger calls."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /compliance/vendors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: none
              captures: { e_get: $.data.error_id }
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2065", legal_name: "Anonymous Attempt", payment_terms_days: 30 }
              as: none
              captures: { e_post: $.data.error_id }
          assert:
            - "Both trigger calls omit the X-User-Role and X-User-ID headers entirely"
            - "First trigger call returns HTTP 401 with $.data.error_id == ERR_UNAUTHENTICATED (not 404)"
            - "Second trigger call returns HTTP 401 with $.data.error_id == ERR_UNAUTHENTICATED"
            - "GET /compliance/vendors as ComplianceOfficer co-1 returns total_count == 0"

      - name: corner_cross_role_exclusive_operations_are_forbidden
        claim_type: role_denial
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
          - roles.ComplianceOfficer.exclusive_operations
          - roles.DCInspector.exclusive_operations
          - roles.Vendor.exclusive_operations
          - roles.APAccountant.exclusive_operations
          - roles.CategoryBuyer.exclusive_operations
        distinguishing_aspect: "Every peer role is refused 403 ERR_UNAUTHORIZED on another role's exclusive write, and because the authorisation rung (priority 2) precedes path existence (priority 4) the refusal arrives even for a non-existent target id - no role model collapses into a superuser, not even ComplianceOfficer, which cannot create a shipment."
        test_recipe:
          setup:
            - "Empty database; every trigger call targets the non-existent id 00000000-0000-4000-8000-000000000000 so that only the role check can decide the outcome."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /compliance/violations/00000000-0000-4000-8000-000000000000/assess"
              payload: { assessment_note: "Inspector trying to assess." }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { e_insp: $.data.error_id }
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "00000000-0000-4000-8000-000000000000", po_number: "PO-X", ordered_units: 10, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: Vendor
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e_vendor: $.data.error_id }
            - call: "POST /compliance/routing-guides/00000000-0000-4000-8000-000000000000/publish"
              payload: {}
              as: APAccountant
              as_user_id: "ap-1"
              captures: { e_ap: $.data.error_id }
            - call: "POST /compliance/deductions/00000000-0000-4000-8000-000000000000/post"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { e_buyer: $.data.error_id }
            - call: "POST /compliance/purchase-orders/00000000-0000-4000-8000-000000000000/shipments"
              payload: { asn_number: "ASN-X", shipped_units: 10, carton_count: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_co: $.data.error_id }
          assert:
            - "Every trigger call returns HTTP 403 with $.data.error_id == ERR_UNAUTHORIZED"
            - "No trigger call returns 404, proving priority 2 is evaluated before priority 4"
            - "No entity of any kind is created by the five calls"

      - name: corner_each_role_can_perform_its_own_exclusive_writes
        claim_type: role_capability
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - roles.CategoryBuyer.exclusive_operations
          - roles.Vendor.exclusive_operations
          - roles.DCInspector.exclusive_operations
          - roles.APAccountant.exclusive_operations
          - roles.ComplianceOfficer.shared_operations
        distinguishing_aspect: "The five peer roles each complete their own exclusive write in one chain (officer creates the vendor, buyer the order, vendor the shipment, inspector the receipt, accountant the deduction draft), and the shared read surface is genuinely shared: the same GET of the vendor returns 200 for all five roles rather than being visible only to its author."
