  # ------------------------------------------------------------- Rule 5 ----
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_held_batch_flavoring
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_BATCH_NOT_FLAVORABLE]
          - errors[ERR_SYNTHETIC_ON_ORGANIC]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: one apply-flavoring
          request that violates BOTH (batch ON_HOLD after lot recall; flavoring
          synthetic on an ORGANIC recipe) MUST return the state error
          ERR_BATCH_NOT_FLAVORABLE, not ERR_SYNTHETIC_ON_ORGANIC.
        test_recipe:
          setup:
            - "Supplier ACTIVE; GREEN lot 30.0 kg RELEASED; flavoring f1 synthetic (natural_certified false, allergen [TREE_NUT]) ACTIVE; ORGANIC TEA_BAG recipe [{GREEN,C,95.0}] + 5% f1 ACTIVE; batch target 20.0 in BLENDED, then cascaded to ON_HOLD by recalling its lot"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Priority Co", origin_region: "Nilgiri" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-01", weight_kg: 30.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 90, briskness_score: 88, appearance_score: 92 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/flavorings", payload: { name: "Nut Crunch", allergen_tags: ["TREE_NUT"], natural_certified: false, cost_per_kg_cents: 2500 }, as: BlendMaster, as_user_id: "bm-1", captures: { f1: $.data.id } }
            - { call: "POST /tea-ops/recipes", payload: { name: "R9", certification_target: "ORGANIC", pack_format: "TEA_BAG", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 95.0 }], flavoring_id: "${f1}", flavoring_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { r9: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r9}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r9}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 19.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 6.0 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/recall", payload: {}, as: QAManager, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /tea-ops/batches/${b}/apply-flavoring", payload: { flavoring_id: "${f1}", applied_kg: 1.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BATCH_NOT_FLAVORABLE — state precondition (priority 6) outranks the synthetic-on-organic safety violation (priority 8)"
            - "no FlavoringApplication is created: GET /tea-ops/batches/${b}/flavoring-applications returns total_count == 0"

      - name: temporal_beats_fiscal_on_run_create
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_LINE_WINDOW_CONFLICT]
          - errors[ERR_PRIVATE_LABEL_MINIMUM_UNMET]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_fiscal (different
          pair from instance 1): one run-create request that BOTH overlaps an
          existing line window AND under-runs the contract minimum MUST return
