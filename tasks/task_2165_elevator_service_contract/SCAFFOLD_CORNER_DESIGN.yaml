              as_user_id: "pa-1"
              captures: { car_e2a: $.data.id }
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${ep2_id}", car_code: "CAR-E2B", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car_e2b: $.data.id }
            - call: "POST /elevator-program/projects"
              payload: { contract_id: "${ep2_id}", title: "Staged modernization", budget_cents: 8000000, target_completion_date: "2026-11-30" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { prj_e2: $.data.id }
            - call: "POST /elevator-program/projects/${prj_e2}/approve"
              payload: {}
              as: BuildingManager
              as_user_id: "bm-e2"
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${car_e2a}", window_type: "MODERNIZATION", window_start: "2026-11-02T08:00:00Z", window_end: "2026-11-04T08:00:00Z", project_id: "${prj_e2}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { w_e2a1: $.data.id }
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${car_e2a}", window_type: "REPAIR", window_start: "2026-11-10T08:00:00Z", window_end: "2026-11-10T12:00:00Z" }
              as: ProgramAdministrator
