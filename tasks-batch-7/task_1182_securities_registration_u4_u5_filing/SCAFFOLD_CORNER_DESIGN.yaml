              as: RegistrationPrincipal
              captures: { req_oc2_id: $.data.id, req_oc2_v: $.data.version }
            - call: "PATCH /registration-desk/registration-requests/${req_oc2_id}"
              payload: { registration_category: "IA", expected_registration_request_version: "${req_oc2_v}" }
              as: RegistrationPrincipal
          trigger:
            - call: "PATCH /registration-desk/registration-requests/${req_oc2_id}"
              payload: { registration_category: "PRINCIPAL", expected_registration_request_version: "${req_oc2_v}" }
              as: RegistrationPrincipal
              captures: { err_oc2: $.data.error_id }
          assert:
            - "first PATCH succeeded (RR -> IA, version bumped beyond captured)"
            - "second PATCH captured err_oc2 == ERR_STALE_VERSION with http 412"

      - name: scheduled_deferred_activation_rollover
        claim_type: scheduled_actions
        grounds:
          - state_machines.RegistrationRequest.APPROVED_to_ACTIVE
          - complexity_profile
        distinguishing_aspect: "The APPROVED -> ACTIVE transition is deferred: at clock 2026-06-02T23:59:59Z (same calendar day as approval) the request is still APPROVED; at 2026-06-03T00:00:00Z it is ACTIVE — the rollover fires on date change, not on wall-clock elapsed time."
        test_recipe:
          setup: ["request approved 2026-06-02 (all gates passed); clock parked at end of approval day, then advanced to next day"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3705", legal_name: "Sched Firm" }
              as: SystemOperator
              captures: { firm_sc_id: $.data.id }
            - call: "POST /registration-desk/applicants"
