              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm: $.data.id }
            - call: "POST /rebuild/assessments/${asm}/complete"
              payload: { safety_hazard_max_severity: 0, accessibility_needs_count: 0, scope_items: [{ category: "GENERAL", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 100000, est_high_cents: 100000, description: "paint" }] }
              as: Assessor
            - call: "PATCH /rebuild/assessments/${asm}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/funding-cycles/${cyc}"
              payload: { status: "SELECTION_OPEN" }
              as: PlatformAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /rebuild/funding-cycles/${cyc}/selection-runs"
              payload: { expected_funding_cycle_version: "${cyc_v}" }
              as: AffiliateStaff
              captures: { run: $.data.id }
            - call: "POST /rebuild/selection-runs/${run}/apply"
              payload: {}
              as: AffiliateStaff
            - call: "GET /rebuild/funding-cycles/${cyc}"
              payload: {}
              as: Any
              captures: { avail1: $.data.available_cents, resv1: $.data.reserved_cents, spent1: $.data.spent_cents }
            - call: "GET /rebuild/projects"
              payload: { application_id: "${app}" }
              as: Any
              captures: { proj: "$.data[0].id" }
            - call: "POST /rebuild/material-orders"
              payload: { project_id: "${proj}", lines: [{ item_name: "brackets", quantity: 1, unit_price_dollars: 10.005 }, { item_name: "sealant", quantity: 1, unit_price_dollars: 7.255 }] }
              as: AffiliateStaff
              captures: { mo: $.data.id }
            - call: "PATCH /rebuild/material-orders/${mo}"
              payload: { status: "STAGED" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/material-orders/${mo}"
              payload: { status: "DELIVERED" }
              as: AffiliateStaff
            - call: "GET /rebuild/funding-cycles/${cyc}"
              payload: {}
              as: Any
              captures: { avail2: $.data.available_cents, resv2: $.data.reserved_cents, spent2: $.data.spent_cents }
          trigger:
            - call: "PATCH /rebuild/material-orders/${mo}"
              payload: { status: "RETURNED" }
              as: AffiliateStaff
            - call: "GET /rebuild/funding-cycles/${cyc}"
              payload: {}
              as: Any
              captures: { avail3: $.data.available_cents, spent3: $.data.spent_cents }
            - call: "PATCH /rebuild/projects/${proj}"
              payload: { status: "CANCELLED", cancellation_reason: "STAFF_DECISION" }
