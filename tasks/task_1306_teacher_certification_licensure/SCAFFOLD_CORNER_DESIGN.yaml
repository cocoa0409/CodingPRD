scaffold_corner_design:
  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: applicant_creation_defaults
        claim_type: creation
        grounds: [entities.Applicant, entities.Applicant.fields.status]
        distinguishing_aspect: "POST with all required fields returns 201 with status REGISTERED, version 1, server-minted id/created_at."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensure/applicants", payload: { full_name: "Tia Ti", email: "tia@x.com", date_of_birth: "1997-01-01T00:00:00Z", ssn_last4: "4321", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id, ap_v: $.data.version } }
          assert:
            - "Applicant.${ap}.status == 'REGISTERED'"
            - "Applicant.${ap}.version == 1"

      - name: applicant_missing_required_email_returns_invalid_request
        claim_type: required_field
        grounds: [entities.Applicant.fields.email, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input field email is rejected with ERR_VALIDATION (400) before any state change."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensure/applicants", payload: { full_name: "Uma Um", date_of_birth: "1997-02-02T00:00:00Z", ssn_last4: "4322", moral_character_attestation: true }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_VALIDATION'"

      - name: application_fee_computed_input_ignored
        claim_type: computed_field
        grounds: [entities.CredentialApplication.fields.fee_cents, calculations.application_fee]
        distinguishing_aspect: "fee_cents is computed: RECIPROCITY base 20000 + 2 transcripts x 2500 = 25000, expedite surcharge 20% = 5000 -> 30000; a client-supplied fee_cents of 999 is ignored."
        test_recipe:
          setup: ["applicant registered"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Val Va", email: "val@x.com", date_of_birth: "1990-01-01T00:00:00Z", ssn_last4: "1111", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12", expedite_requested: true, fee_cents: 999 }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "A U", degree_level: "BACHELORS", total_semester_hours: 120, courses: [ { course_code: "M1", credit_hours: 3, letter_grade: "A" } ] }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "B U", degree_level: "MASTERS", total_semester_hours: 30, courses: [ { course_code: "M2", credit_hours: 3, letter_grade: "B" } ] }, as: Applicant, as_user_id: "${ap}" }
            - { call: "GET /licensure/applications/${app}", payload: {}, as: CredentialEvaluator, captures: { fee: $.data.fee_cents } }
          assert:
            - "CredentialApplication.${app}.fee_cents == 30000"
            - "client-supplied fee_cents 999 was ignored"

      - name: get_nonexistent_application_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown application id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /licensure/applications/00000000-0000-4000-8000-000000000000", payload: {}, as: IntakeOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_NOT_FOUND'"

      - name: transcript_invalid_enum_rejected
        claim_type: type_constraint
        grounds: [entities.Transcript.fields.degree_level, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "degree_level 'PHD' is not in the declared enum and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["applicant with a SUBMITTED application"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Wes We", email: "wes@x.com", date_of_birth: "1990-03-03T00:00:00Z", ssn_last4: "2223", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "A U", degree_level: "PHD", total_semester_hours: 120, courses: [] }, as: Applicant, as_user_id: "${ap}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_VALIDATION'"

      - name: applicants_list_pagination_boundaries
        claim_type: listing
        grounds: [response_envelope.pagination_fields, "endpoints.GET /licensure/applicants"]
        distinguishing_aspect: "Pagination envelope: 3 applicants, limit 2 -> total_count 3, has_more true; offset 2 -> 1 row, has_more false."
        test_recipe:
          setup: ["three applicants registered"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "P1", email: "p1@x.com", date_of_birth: "1990-01-01T00:00:00Z", ssn_last4: "0001", moral_character_attestation: true }, as: Anonymous }
            - { call: "POST /licensure/applicants", payload: { full_name: "P2", email: "p2@x.com", date_of_birth: "1990-01-02T00:00:00Z", ssn_last4: "0002", moral_character_attestation: true }, as: Anonymous }
            - { call: "POST /licensure/applicants", payload: { full_name: "P3", email: "p3@x.com", date_of_birth: "1990-01-03T00:00:00Z", ssn_last4: "0003", moral_character_attestation: true }, as: Anonymous }
          trigger:
            - { call: "GET /licensure/applicants?limit=2&offset=0", payload: {}, as: IntakeOfficer }
            - { call: "GET /licensure/applicants?limit=2&offset=2", payload: {}, as: IntakeOfficer }
          assert:
            - "page 1: total_count == 3, has_more == true, 2 rows"
            - "page 2: has_more == false, 1 row"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: surrendered_license_rejects_renewal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.License, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SURRENDERED is terminal: a renew call on a surrendered license fails ERR_INVALID_STATE regardless of window/audit."
        test_recipe:
          setup: ["License ACTIVE (RECIPROCITY FULL chain), then surrendered by owner"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Xan Xa", email: "xan@x.com", date_of_birth: "1980-01-01T00:00:00Z", ssn_last4: "1001", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/reciprocity-evaluations", payload: { source_state: "TX", source_license_type: "STANDARD", years_teaching: 5 }, as: CredentialEvaluator, captures: { re: $.data.id } }
            - { call: "POST /licensure/reciprocity-evaluations/${re}/finalize", payload: { mapping_mode: "DETERMINISTIC" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "TX State", degree_level: "BACHELORS", total_semester_hours: 120, courses: [ { course_code: "MATH101", credit_hours: 3, letter_grade: "A" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 18 }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "BACKGROUND_REVIEW" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "PENDING_DECISION" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "APPROVED" }, as: CredentialEvaluator }
            - { call: "GET /licensure/licenses?application_id=${app}", payload: {}, as: CredentialEvaluator, captures: { lic: "$.data[0].id" } }
            - { call: "POST /licensure/licenses/${lic}/surrender", payload: {}, as: Applicant, as_user_id: "${ap}" }
          trigger:
            - { call: "POST /licensure/licenses/${lic}/renew", payload: { payment_token: "tok_2" }, as: Applicant, as_user_id: "${ap}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
            - "License.${lic}.status == 'SURRENDERED'"

      - name: background_check_auto_clears_with_zero_risk
        claim_type: side_effect_execution
        grounds: [state_machines.BackgroundCheck.INITIATED_to_PRINTS_SUBMITTED, calculations.background_risk_score]
        distinguishing_aspect: "PRINTS_SUBMITTED auto-branches: only DISMISSED findings -> risk_score 0 < 40 and no forced flag -> lands CLEARED in one call."
        test_recipe:
          setup: ["RECIPROCITY application exists; background check with one DISMISSED misdemeanor"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Yol Yo", email: "yol@x.com", date_of_birth: "1991-04-04T00:00:00Z", ssn_last4: "1002", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [ { offense_category: "MISDEMEANOR_OTHER", offense_date: "2020-01-01T00:00:00Z", disposition: "DISMISSED" } ] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
          trigger:
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator, captures: { risk: $.data.risk_score, st: $.data.status } }
          assert:
            - "BackgroundCheck.${bg}.status == 'CLEARED'"
            - "BackgroundCheck.${bg}.risk_score == 0"

      - name: endorsement_activate_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Endorsement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACTIVE -> ACTIVE is not a declared transition; second activation returns ERR_INVALID_STATE with no state change."
        test_recipe:
          setup: ["License ACTIVE with one ACTIVE SPECIAL_EDUCATION endorsement"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Zoe Zo", email: "zoe@x.com", date_of_birth: "1988-08-08T00:00:00Z", ssn_last4: "1003", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/reciprocity-evaluations", payload: { source_state: "TX", source_license_type: "STANDARD", years_teaching: 5 }, as: CredentialEvaluator, captures: { re: $.data.id } }
            - { call: "POST /licensure/reciprocity-evaluations/${re}/finalize", payload: { mapping_mode: "DETERMINISTIC" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "TX State", degree_level: "BACHELORS", total_semester_hours: 120, courses: [ { course_code: "MATH101", credit_hours: 3, letter_grade: "A" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 18 }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "BACKGROUND_REVIEW" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "PENDING_DECISION" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "APPROVED" }, as: CredentialEvaluator }
            - { call: "GET /licensure/licenses?application_id=${app}", payload: {}, as: CredentialEvaluator, captures: { lic: "$.data[0].id" } }
            - { call: "POST /licensure/licenses/${lic}/endorsements", payload: { subject_area: "SPECIAL_EDUCATION", grade_band: "PK_6" }, as: Applicant, as_user_id: "${ap}", captures: { end1: $.data.id } }
            - { call: "POST /licensure/endorsements/${end1}/state", payload: { to_status: "ACTIVE" }, as: CredentialEvaluator }
          trigger:
            - { call: "POST /licensure/endorsements/${end1}/state", payload: { to_status: "ACTIVE" }, as: CredentialEvaluator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
            - "Endorsement.${end1}.status == 'ACTIVE'"

      - name: double_verify_test_score_rejected
        claim_type: idempotency
        grounds: [state_machines.TestScore, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Verifying an already-VERIFIED score is not idempotent: the second verify is rejected ERR_INVALID_STATE and scaled_score is unchanged."
        test_recipe:
          setup: ["application with one VERIFIED PRAXIS_SUBJECT score (raw 60 -> scaled 160)"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Amy Am", email: "amy@x.com", date_of_birth: "1992-02-02T00:00:00Z", ssn_last4: "1004", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/test-scores", payload: { exam_code: "PRAXIS_SUBJECT", raw_score: 60, tested_on: "2026-07-01T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { ts: $.data.id } }
            - { call: "POST /licensure/test-scores/${ts}/verify", payload: { verification_status: "VERIFIED" }, as: CredentialEvaluator }
          trigger:
            - { call: "POST /licensure/test-scores/${ts}/verify", payload: { verification_status: "VERIFIED" }, as: CredentialEvaluator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
            - "TestScore.${ts}.scaled_score == 160"

      - name: plan_default_then_extension_resumes
        claim_type: valid_transition
        grounds: [state_machines.DeficiencyPlan.IN_PROGRESS_to_DEFAULTED, state_machines.DeficiencyPlan.DEFAULTED_to_EXTENDED, entities.DeficiencyPlan.fields.extension_used]
        distinguishing_aspect: "Clock past the 730-day deadline sweeps an under-complete IN_PROGRESS plan to DEFAULTED; EXTENDED sets extension_used=true and pushes deadline +365 days; next evidence post resumes IN_PROGRESS."
        test_recipe:
          setup: ["ALTERNATIVE SCIENCE application DEFICIENCY_PENDING; plan (required 30) ACCEPTED then IN_PROGRESS with 1 hour posted"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Bob Bo", email: "bob@x.com", date_of_birth: "1993-03-03T00:00:00Z", ssn_last4: "1005", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "ALTERNATIVE", subject_area: "SCIENCE", grade_band: "G5_8" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "DEFICIENCY_PENDING" }, as: CredentialEvaluator, captures: { app_v: $.data.version } }
            - { call: "POST /licensure/applications/${app}/deficiency-plans", payload: { expected_application_version: "${app_v}" }, as: CredentialEvaluator, captures: { plan: $.data.id } }
            - { call: "POST /licensure/deficiency-plans/${plan}/state", payload: { to_status: "ACCEPTED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/deficiency-plans/${plan}/evidence", payload: { hours: 1 }, as: CredentialEvaluator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /licensure/deficiency-plans/${plan}/state", payload: { to_status: "EXTENDED" }, as: CredentialEvaluator, captures: { ext_used: $.data.extension_used, dl: $.data.deadline } }
            - { call: "POST /licensure/deficiency-plans/${plan}/evidence", payload: { hours: 1 }, as: CredentialEvaluator, captures: { st: $.data.status } }
          assert:
            - "after clock sweep DeficiencyPlan.${plan}.status was DEFAULTED"
            - "DeficiencyPlan.${plan}.extension_used == true"
            - "DeficiencyPlan.${plan}.deadline == '2029-07-31T00:00:00Z'"
            - "after resuming evidence DeficiencyPlan.${plan}.status == 'IN_PROGRESS'"

      - name: plan_second_default_denies_application_and_blocks_extend
        claim_type: cross_entity
        grounds: [state_machines.DeficiencyPlan.IN_PROGRESS_to_DEFAULTED, state_machines.CredentialApplication, "errors[ERR_PLAN_DEADLINE_PASSED]"]
        distinguishing_aspect: "A plan defaulting after its one extension cascades: linked application in DEFICIENCY_PENDING -> DENIED; a further extend attempt fails ERR_PLAN_DEADLINE_PASSED."
        test_recipe:
          setup: ["ALTERNATIVE SCIENCE application DEFICIENCY_PENDING; plan ACCEPTED, IN_PROGRESS with 1 hour, extended once and resumed"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Cid Ci", email: "cid@x.com", date_of_birth: "1994-04-04T00:00:00Z", ssn_last4: "1006", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "ALTERNATIVE", subject_area: "SCIENCE", grade_band: "G5_8" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "DEFICIENCY_PENDING" }, as: CredentialEvaluator, captures: { app_v: $.data.version } }
            - { call: "POST /licensure/applications/${app}/deficiency-plans", payload: { expected_application_version: "${app_v}" }, as: CredentialEvaluator, captures: { plan: $.data.id } }
            - { call: "POST /licensure/deficiency-plans/${plan}/state", payload: { to_status: "ACCEPTED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/deficiency-plans/${plan}/evidence", payload: { hours: 1 }, as: CredentialEvaluator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /licensure/deficiency-plans/${plan}/state", payload: { to_status: "EXTENDED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/deficiency-plans/${plan}/evidence", payload: { hours: 1 }, as: CredentialEvaluator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2029-08-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /licensure/deficiency-plans/${plan}/state", payload: { to_status: "EXTENDED" }, as: CredentialEvaluator, captures: { err: $.data.error_id } }
          assert:
            - "DeficiencyPlan.${plan}.status == 'DEFAULTED'"
            - "CredentialApplication.${app}.status == 'DENIED'"
            - "extend attempt error_id == 'ERR_PLAN_DEADLINE_PASSED'"

      - name: program_withdrawal_forces_application_into_deficiency
        claim_type: conditional_cascade
        grounds: [state_machines.EducatorPrepProgram.PROBATION_to_APPROVAL_WITHDRAWN, state_machines.CredentialApplication.EVALUATION_to_DEFICIENCY_PENDING]
        distinguishing_aspect: "Program approval withdrawal cascades: a TRADITIONAL application in EVALUATION with deficiency 18 is forced to DEFICIENCY_PENDING and its deficiency recomputes to min(30, 18+12) == 30."
        test_recipe:
          setup: ["Program APPROVED covering MATHEMATICS; TRADITIONAL application in EVALUATION with one VERIFIED transcript (18 subject hours) and no exams -> deficiency 18"]
          setup_api_calls:
            - { call: "POST /licensure/educator-prep-programs", payload: { institution_name: "State Teachers College", program_code: "STC-MATH", approved_subject_areas: ["MATHEMATICS"] }, as: ProgramApprovalOfficer, captures: { prog: $.data.id } }
            - { call: "POST /licensure/educator-prep-programs/${prog}/state", payload: { to_status: "UNDER_REVIEW" }, as: ProgramApprovalOfficer }
            - { call: "POST /licensure/educator-prep-programs/${prog}/state", payload: { to_status: "APPROVED" }, as: ProgramApprovalOfficer }
            - { call: "POST /licensure/applicants", payload: { full_name: "Dot Do", email: "dot@x.com", date_of_birth: "1995-05-05T00:00:00Z", ssn_last4: "1007", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
