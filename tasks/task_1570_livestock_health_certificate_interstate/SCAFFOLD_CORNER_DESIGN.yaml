          - errors[ERR_CERTIFICATE_NOT_TRANSMITTABLE]
          - errors[ERR_CERTIFICATE_NOT_VOIDABLE]
        distinguishing_aspect: |
          LAPSED is terminal and blocks downstream work: a REQUESTED permit
