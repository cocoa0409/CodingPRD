        distinguishing_aspect: |
          Trigger = syllabus activation (different from the discipline-sanction
          trigger). Depth 4 chain: activate v2 -> v1 RETIRED -> exam P RETIRED ->
          its REGISTRATION_OPEN window CANCELLED -> registration CANCELLED with
          cancel_reason SYLLABUS_RETIREMENT and a full 30450 refund; no waitlist
          promotion fires from a CANCELLED window.
        test_recipe:
