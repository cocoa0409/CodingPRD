          - "response_envelope"
          - "errors[ERR_RESOURCE_NOT_FOUND]"
        distinguishing_aspect: "The error envelope carries meta.api_request_id, meta.api_request_timestamp, response_type == error, and data with both error_id and message keys."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: [*seed_clock]
          trigger:
            - call: "GET /bottler/territories/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
          assert:
            - "response_type == \"error\""
            - "data.error_id == ERR_RESOURCE_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

  # ===========================================================================
  - section: errors
    instances:

      - name: error_service_window_overlap_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SERVICE_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / service_window_overlap_and_budget_breach_temporal_wins
          rationale: "Asserted as the winning error of the priority-conflict instance and again in service_windows_half_open_adjacency_allowed."

      - name: error_price_deviation_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PRICE_DEVIATION_EXCEEDS_BAND]"
        excluded_because:
          difficulty_instance: boundary_precision_check / nca_price_band_exactly_five_percent_allowed
          rationale: "Asserted on the c_bad enrollment in the boundary instance."

      - name: error_zero_quantity_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ZERO_QUANTITY]"
        excluded_because:
          difficulty_instance: boundary_precision_check / syrup_delivery_zero_gallons_rejected_one_gallon_ok
          rationale: "Asserted on the zero-gallon trigger of the boundary instance."

      - name: error_transfer_customers_disputed_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TRANSFER_CUSTOMERS_DISPUTED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / transfer_approve_blocked_by_disputed_customer
          rationale: "Asserted on the blocked approve call."

      - name: error_equipment_placement_overlap_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_EQUIPMENT_PLACEMENT_OVERLAP]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / equipment_placement_closed_interval_touching_dates_conflict
          rationale: "Asserted on the touching-dates placement."

      - name: error_clawback_exceeds_accrual_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CLAWBACK_EXCEEDS_ACCRUAL]"
        excluded_because:
          difficulty_instance: compensating_invariant / marketing_fund_accrual_then_equal_clawback_restores_balance
          rationale: "Asserted on the oversized clawback."

      - name: error_agreement_not_active_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_AGREEMENT_NOT_ACTIVE]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cpo_requires_active_agreement
          rationale: "Asserted on DRAFT and SUSPENDED agreement CPO attempts."

      - name: enroll_nca_against_draft_nca_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NCA_NOT_PUBLISHED]"
        distinguishing_aspect: "enroll-nca requires the NCA in PUBLISHED; a DRAFT NCA fails with ERR_NCA_NOT_PUBLISHED even when the price band would pass."
        test_recipe:
          setup: ["ACTIVE agreement; customer local 190; NCA national 200 left in DRAFT."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - *seed_cust
            - call: "POST /bottler/national-customer-agreements"
              payload: { brand_owner_id: "${bo_id}", nca_code: "NCA-2026-01", national_price_cents: 200, effective_start: "2026-09-01", effective_end: "2026-12-31" }
              as: BrandOwnerAdmin
              captures: { nca_id: $.data.id }
          trigger:
            - call: "POST /bottler/customers/${cust_id}/enroll-nca"
              payload: { nca_id: "${nca_id}" }
              as: BrandOwnerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_NCA_NOT_PUBLISHED"
            - "Customer.${cust_id}.nca_id is null"

      - name: launch_changeover_with_retired_product_line_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LAUNCH_PRODUCT_INACTIVE]"
        distinguishing_aspect: "schedule-changeover against a RETIRED product line fails with ERR_LAUNCH_PRODUCT_INACTIVE — a cross-entity guard between launch and product line."
        test_recipe:
          setup: ["ACTIVE agreement; launch created while line ACTIVE, then the line is retired."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/innovation-launches"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", committed_cases: 50000, launch_start: "2026-09-01", launch_end: "2026-10-31" }
              as: BrandOwnerAdmin
              captures: { launch_id: $.data.id }
            - call: "POST /bottler/product-lines/${pl_id}/retire"
              payload: {}
              as: BrandOwnerAdmin
          trigger:
            - call: "POST /bottler/innovation-launches/${launch_id}/schedule-changeover"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_LAUNCH_PRODUCT_INACTIVE"
            - "InnovationLaunch.${launch_id}.status == PLANNED"

  # ===========================================================================
  - section: rbac
    instances:

      - name: bottler_ops_cannot_create_product_line
        claim_type: "RBAC denial"
        grounds:
          - "roles.BottlerOps"
          - "endpoints.POST_/bottler/product-lines"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "BottlerOps (a peer role) is denied a BrandOwnerAdmin-exclusive operation with 403 ERR_UNAUTHORIZED_ROLE, and no product line is persisted."
        test_recipe:
          setup: ["Brand owner exists."]
          setup_api_calls: [*seed_clock, *seed_bo]
          trigger:
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "SNEAK-01", concentrate_base_price_per_gallon: 1.0, is_mandatory: false }
              as: BottlerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED_ROLE"

      - name: customer_manager_cannot_approve_transfer
        claim_type: "RBAC denial"
        grounds:
          - "roles.CustomerManager"
          - "endpoints.POST_/bottler/territory-transfers/{id}/approve"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "CustomerManager is denied the BrandOwnerAdmin-exclusive approve even when every business precondition would pass."
        test_recipe:
          setup: ["Territory with a VALUED transfer."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_ter
            - call: "POST /bottler/territory-transfers"
              payload: { territory_id: "${ter_id}", buyer_name: "Peachtree Consolidated", reported_ebitda_cents: 400000000 }
              as: PlatformAdmin
              captures: { tt_id: $.data.id, tt_v0: $.data.version }
            - call: "POST /bottler/territory-transfers/${tt_id}/valuate"
              payload: { expected_transfer_version: "${tt_v0}" }
              as: BrandOwnerAdmin
          trigger:
            - call: "POST /bottler/territory-transfers/${tt_id}/approve"
              payload: {}
              as: CustomerManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED_ROLE"
            - "TerritoryTransfer.${tt_id}.status == VALUED"

      - name: create_brand_owner_missing_auth_header_unauthenticated
        claim_type: "RBAC denial"
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request without X-User-Role/X-User-ID fails at priority 1 with 401 ERR_UNAUTHENTICATED before any role or existence check."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /bottler/brand-owners"
              payload: { name: "NoAuth Inc", home_country: "US" }
          assert:
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: cpo_create_with_stale_agreement_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[cpo-create-stale-agreement]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After one CPO bumps the agreement version from 2 to 3, a second create carrying the previously observed version 2 fails with 412 ERR_STALE_VERSION; resubmitting with the fresh version succeeds."
        test_recipe:
          setup: ["ACTIVE agreement (version 2); one CPO already placed (agreement version now 3)."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 10000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 10000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second create with stale expected_agreement_version rejected: HTTP 412 ERR_STALE_VERSION"
            - "exactly one ConcentratePurchaseOrder exists for ${ag_id}"

      - name: transfer_valuate_with_stale_transfer_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[transfer-valuate-stale-transfer]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Valuate carrying the pre-first-valuation version (1) after a successful valuation bumped the transfer to version 2 fails with 412; the deliberate-stale form ${tt_v0} exercises OCC on the TerritoryTransfer parent."
        test_recipe:
          setup: ["Transfer valuated once (version 2, status VALUED)."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_ter
            - call: "POST /bottler/territory-transfers"
              payload: { territory_id: "${ter_id}", buyer_name: "Peachtree Consolidated", reported_ebitda_cents: 400000000 }
              as: PlatformAdmin
              captures: { tt_id: $.data.id, tt_v0: $.data.version }
            - call: "POST /bottler/territory-transfers/${tt_id}/valuate"
              payload: { expected_transfer_version: "${tt_v0}" }
              as: BrandOwnerAdmin
          trigger:
            - call: "POST /bottler/territory-transfers/${tt_id}/valuate"
              payload: { expected_transfer_version: "${tt_v0}" }
              as: BrandOwnerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with data.error_id == ERR_STALE_VERSION"
            - "TerritoryTransfer.${tt_id}.valuation_round == 1 (second valuate did not run)"

      - name: nca_expire_reverts_bound_price_derived_field
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.Customer.fields.bound_price_cents"
          - "state_machines.NationalCustomerAgreement.PUBLISHED_to_EXPIRED"
        distinguishing_aspect: "The derived bound_price_cents reconciles with its source on NCA expiry: after enroll (bound 200) and clock advance past effective_end, expire reverts the customer to local_price_cents 190."
        test_recipe:
          setup: ["ACTIVE agreement; customer local 190 enrolled to PUBLISHED NCA national 200 with window ending 2026-09-30; clock moved to 2026-10-02."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - *seed_cust
            - call: "POST /bottler/national-customer-agreements"
              payload: { brand_owner_id: "${bo_id}", nca_code: "NCA-2026-01", national_price_cents: 200, effective_start: "2026-09-01", effective_end: "2026-09-30" }
              as: BrandOwnerAdmin
              captures: { nca_id: $.data.id }
            - call: "POST /bottler/national-customer-agreements/${nca_id}/publish"
              payload: {}
              as: BrandOwnerAdmin
            - call: "POST /bottler/customers/${cust_id}/enroll-nca"
              payload: { nca_id: "${nca_id}" }
              as: BrandOwnerAdmin
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bottler/national-customer-agreements/${nca_id}/expire"
              payload: {}
              as: BrandOwnerAdmin
          assert:
            - "NationalCustomerAgreement.${nca_id}.status == EXPIRED"
            - "Customer.${cust_id}.bound_price_cents == 190 (reverted to local)"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: cpo_create_response_immediately_shows_computed_prices
        claim_type: immediate
        grounds:
          - "calculations.concentrate_unit_price"
          - "endpoints.POST_/bottler/concentrate-purchase-orders"
        distinguishing_aspect: "Immediate consistency: the create response itself carries computed provisional_unit_price and provisional_amount_cents — no re-read or delay needed — and GET returns identical values."
        test_recipe:
          setup: ["ACTIVE agreement (version 2)."]
          setup_api_calls: [*seed_clock, *seed_bo, *seed_index, *seed_line, *seed_ter, *seed_ag, *seed_act]
          trigger:
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 10000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cpo_id: $.data.id }
            - call: "GET /bottler/concentrate-purchase-orders/${cpo_id}"
              as: BottlerOps
              as_user_id: "${ag_id}"
          assert:
            - "create response data.provisional_unit_price == 13.2 and provisional_amount_cents == 13200000"
            - "GET returns the same values (no drift between write response and read)"
