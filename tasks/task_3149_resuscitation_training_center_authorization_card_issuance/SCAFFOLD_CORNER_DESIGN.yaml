              as: TCCoordinator
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Stu Three", student_email: "s3@x.example" }
              as: TCCoordinator
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Stu Four", student_email: "s4@x.example" }
              as: TCCoordinator
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Stu Five", student_email: "s5@x.example" }
              as: TCCoordinator
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Stu Six", student_email: "s6@x.example" }
              as: TCCoordinator
          trigger:
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Stu Seven", student_email: "s7@x.example" }
              as: TCCoordinator
              captures: { err_full: $.data.error_id }
            - call: "POST /aha/roster-entries/${e1_id}/cancel"
              payload: {}
              as: TCCoordinator
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Stu Seven", student_email: "s7@x.example" }
              as: TCCoordinator
              captures: { e7_id: $.data.id }
          assert:
            - "the seventh add returns 422 and err_full == ERR_SESSION_FULL"
            - "after the cancel the identical add returns 201"
            - "CourseSession.${c_s1_id}.seats_available == 0 again after the successful re-add"

      - name: renewal_with_fewer_than_two_sessions_returns_shortfall
        claim_type: violation_to_error
