# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2601 - Ballot Production & Logic and Accuracy Testing
# =============================================================================
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. The logical clock starts at
# 2026-08-01T00:00:00Z; every chain that depends on time sets it explicitly via
# POST /_clock/set_current_utc. Every numeric assert below was computed by executing the
# named §1.3 formula against the literals pinned in the same chain.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dv_candidate_layout_provisional_versus_certified_basis
        grounds:
          - calculations.candidate_ballot_order
          - entities.Candidate.fields.base_order_index
          - entities.BallotStyle.fields.rotation_seed_index
          - state_machines.Candidate.CERTIFIED_to_DISQUALIFIED
          - endpoints["GET /ballot-styles/{id}/layout"]
        distinguishing_aspect: |
          The two variants of candidate_ballot_order differ in the BALLOT-LAYOUT domain: they run over
          different roster sizes (N == 4 for PROVISIONAL_BASIS, which keeps the disqualified filer, versus
          N == 3 for CERTIFIED_BASIS), so the rotation modulus itself changes and the same candidate
          prints in a different position under each basis - it is not a relabelling of one ordering.
        test_recipe:
          setup:
            - "An election with rotation_policy DISTRICT_ROTATION and candidate_order_method ALPHABETICAL_BY_BALLOT_NAME."
            - "One certified CANDIDATE contest in district D-12 with rotation_required true and four candidates whose ballot names are Alvarez, Brooks, Chen, Dawson."
            - "A dummy style S-050 over district D-99 created first, then style S-100 covering districts D-07, D-12 and D-19 - because rotation_seed_index is the 0-based rank of style_code ASC, S-100 lands on seed 1, and the D-12 district ordinal inside S-100 is d == 1."
            - "Dawson is disqualified after the contest was certified, so three candidates remain CERTIFIED and four remain on the as-filed roster."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "DISTRICT_ROTATION", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: true }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ben Brooks", ballot_name: "Brooks", filing_received_at: "2026-06-02T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_bro: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Cai Chen", ballot_name: "Chen", filing_received_at: "2026-06-03T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_che: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Dee Dawson", ballot_name: "Dawson", filing_received_at: "2026-06-04T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_daw: $.data.id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-050", district_codes: ["D-99"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st_low: $.data.id }
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-07", "D-12", "D-19"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st: $.data.id }
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
            - call: "POST /candidates/${c_daw}/disqualify"
              payload: { disqualified_reason: "Withdrew after filing deadline" }
              as: ElectionsDirector
          trigger:
            - call: "GET /ballot-styles/${st}/layout"
              payload: { basis: "PROVISIONAL_BASIS" }
              as: BallotCoordinator
            - call: "GET /ballot-styles/${st}/layout"
              payload: { basis: "CERTIFIED_BASIS" }
              as: BallotCoordinator
          assert:
            - "The PROVISIONAL_BASIS layout reports rotation group 2 over N == 4 and printed_position 3 for ${c_alv}, 4 for ${c_bro}, 1 for ${c_che}, 2 for ${c_daw}."
            - "The CERTIFIED_BASIS layout reports rotation group 2 over N == 3 and printed_position 3 for ${c_alv}, 1 for ${c_bro}, 2 for ${c_che}, and omits ${c_daw} entirely."
            - "Candidate.${c_alv}.base_order_index == 0 and Candidate.${c_bro}.base_order_index == 1 and Candidate.${c_che}.base_order_index == 2."
            - "Candidate.${c_daw}.base_order_index == null and Candidate.${c_daw}.status == DISQUALIFIED."
            - "Contest.${ct}.certified_candidate_count == 3 and Contest.${ct}.ballot_order_index == 1."

      - name: dv_print_job_invoice_estimate_versus_final_rounding
        grounds:
          - calculations.print_job_invoice_total
          - calculations.print_job_quality_inspection
          - entities.PrintJob.fields.invoice_basis
          - entities.Election.fields.committed_print_cents
          - state_machines.PrintJob.QC_PASSED_to_DELIVERED
        distinguishing_aspect: |
          The two variants of print_job_invoice_total differ in the MONEY domain and in rounding topology:
          ESTIMATE rounds the whole order once (sum-then-round, 105625 cents) while FINAL rounds each
          shipped lot separately and adds them (round-then-sum, 105624 cents), and only FINAL applies the
          quality credit - so the same physical job bills two different totals, 150625 then 149357.
        test_recipe:
          setup:
            - "An election in STYLES_LOCKED with one locked ballot style and one precinct of 100 registered voters assigned to it (required_ballot_quantity 110)."
            - "A certified-secure print vendor with 2 press lines."
            - "A PROOF_PENDING print job for 12500 ballots at 8450 cents per thousand against the locked style."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st: $.data.id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-001", district_codes: ["D-12"], registered_voter_count: 100, polling_place: "Kestrel Community Hall" }
              as: BallotCoordinator
              captures: { pr: $.data.id }
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
            - call: "POST /ballot-styles/${st}/language-certifications"
              payload: { translated_languages: ["EN"], certified_formats: ["PAPER_STANDARD"] }
              as: LanguageAccessCoordinator
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "APPROVE", decision_note: "Artwork accepted" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
            - call: "POST /precincts/${pr}/assign-style"
              payload: { style_id: "${st}" }
              as: BallotCoordinator
            - call: "POST /elections/${el}/lock-styles"
              payload: {}
              as: ElectionsDirector
            - call: "GET /ballot-styles/${st}"
              payload: {}
              as: BallotCoordinator
              captures: { st_v: $.data.version }
            - call: "POST /print-vendors"
              payload: { name: "Ridgeline Secure Print", press_line_count: 2, certified_secure: true, status: "ACTIVE" }
              as: ElectionsDirector
              captures: { vend: $.data.id }
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-10T08:00:00Z", press_window_end: "2026-08-12T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job: $.data.id }
          trigger:
            - call: "POST /print-jobs/${job}/approve-proof"
              payload: {}
              as: ElectionsDirector
            - call: "POST /print-jobs/${job}/inspect"
              payload: { sample_size: 500, defect_count: 6 }
              as: WarehouseCustodian
            - call: "POST /print-jobs/${job}/deliver"
              payload: { lots: [{ lot_code: "L-001", quantity_shipped: 4001, seal_number: "SEAL-1001" }, { lot_code: "L-002", quantity_shipped: 4001, seal_number: "SEAL-1002" }, { lot_code: "L-003", quantity_shipped: 4498, seal_number: "SEAL-1003" }] }
              as: PrintVendorRep
              as_user_id: "${vend}"
          assert:
            - "Immediately after approve-proof: PrintJob.${job}.invoice_basis == ESTIMATE, invoice_subtotal_cents == 105625, freight_cents == 45000, defect_credit_cents == 0, invoice_total_cents == 150625, delivered_quantity == 0, and Election.${el}.committed_print_cents == 150625."
            - "After inspect: PrintJob.${job}.sample_size == 500, defect_count == 6, defect_rate_bp == 120, inspection_count == 1, status == QC_PASSED."
            - "After deliver: PrintJob.${job}.invoice_basis == FINAL, invoice_subtotal_cents == 105624, freight_cents == 45000, defect_credit_cents == 1267, invoice_total_cents == 149357, delivered_quantity == 12500, status == DELIVERED."
            - "PrintJob.${job}.invoice_subtotal_cents under FINAL is exactly 1 cent below the ESTIMATE subtotal (105624 versus 105625)."
            - "Election.${el}.committed_print_cents == 149357 after delivery (adjusted by 149357 - 150625 == -1268)."
            - "GET /ballot-lots with print_job_id ${job} returns 3 lots ordered L-001, L-002, L-003 with quantity_shipped 4001, 4001, 4498 and custody_state IN_TRANSIT."

      - name: dv_accountability_preliminary_versus_final_canvass_scope
        grounds:
          - calculations.ballot_accountability_reconciliation
          - entities.BallotLot.fields.custody_state
          - entities.BallotLot.fields.accounted_quantity
          - entities.Election.fields.ballot_accountability_status
          - endpoints["GET /elections/{id}/accountability"]
        distinguishing_aspect: |
          The two variants of ballot_accountability_reconciliation differ in the BALLOT-ACCOUNTING
          domain by custody scope, and the scope difference flips two tier keys at once: a single
          one-ballot lot still sitting in ISSUED pushes gross_issued from 5000 to 5001, which crosses
          SPOILAGE_TIER_MAX and drops the allowance from 25 bp to 15 bp, so PRELIMINARY reports
          net_variance 105 against tolerance 99 (OUT_OF_BALANCE) while FINAL_CANVASS on the very same
          data reports net_variance 99 against tolerance 99 (BALANCED). The variants disagree on the
          final status, not merely on a subtotal.
        test_recipe:
          setup:
            - "A fully deployed election (status DEPLOYED) with one locked style S-100, one precinct P-001 of 100 registered voters, and a delivered print job of 12500 ballots in three lots."
            - "Lot L-001 received 4001 and issued 3000 to P-001; lot L-002 received 4001 and issued 2000 to P-001; lot L-003 received 4498 and issued 1 to P-001."
            - "One tabulator TAB-001 programmed for S-100, passed its public L&A test with zero discrepancy, and deployed to P-001 under seal SEAL-TAB-1."
            - "L-001 and L-002 have returned counts (voted 2900 / spoiled 30 / unused 20 and voted 1880 / spoiled 25 / unused 34, so accounted 2950 and 1939); L-003 is still ISSUED with no counts, so its accounted_quantity is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st: $.data.id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-001", district_codes: ["D-12"], registered_voter_count: 100, polling_place: "Kestrel Community Hall" }
              as: BallotCoordinator
              captures: { pr: $.data.id }
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
            - call: "POST /ballot-styles/${st}/language-certifications"
              payload: { translated_languages: ["EN"], certified_formats: ["PAPER_STANDARD"] }
              as: LanguageAccessCoordinator
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "APPROVE", decision_note: "Artwork accepted" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
            - call: "POST /precincts/${pr}/assign-style"
              payload: { style_id: "${st}" }
              as: BallotCoordinator
            - call: "POST /elections/${el}/lock-styles"
              payload: {}
              as: ElectionsDirector
            - call: "GET /ballot-styles/${st}"
              payload: {}
              as: BallotCoordinator
              captures: { st_v: $.data.version }
            - call: "POST /print-vendors"
              payload: { name: "Ridgeline Secure Print", press_line_count: 2, certified_secure: true, status: "ACTIVE" }
              as: ElectionsDirector
              captures: { vend: $.data.id }
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-10T08:00:00Z", press_window_end: "2026-08-12T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job: $.data.id }
            - call: "POST /print-jobs/${job}/approve-proof"
              payload: {}
              as: ElectionsDirector
            - call: "POST /print-jobs/${job}/inspect"
              payload: { sample_size: 500, defect_count: 6 }
              as: WarehouseCustodian
            - call: "POST /print-jobs/${job}/deliver"
              payload: { lots: [{ lot_code: "L-001", quantity_shipped: 4001, seal_number: "SEAL-1001" }, { lot_code: "L-002", quantity_shipped: 4001, seal_number: "SEAL-1002" }, { lot_code: "L-003", quantity_shipped: 4498, seal_number: "SEAL-1003" }] }
              as: PrintVendorRep
              as_user_id: "${vend}"
            - call: "GET /ballot-lots"
              payload: { print_job_id: "${job}" }
              as: WarehouseCustodian
              captures: { lot1: "$.data[0].id", lot2: "$.data[1].id", lot3: "$.data[2].id" }
            - call: "POST /ballot-lots/${lot1}/receive"
              payload: { seal_number: "SEAL-1001", quantity_received: 4001 }
              as: WarehouseCustodian
            - call: "POST /ballot-lots/${lot1}/issue"
              payload: { precinct_id: "${pr}", issue_quantity: 3000 }
              as: WarehouseCustodian
            - call: "POST /ballot-lots/${lot2}/receive"
              payload: { seal_number: "SEAL-1002", quantity_received: 4001 }
              as: WarehouseCustodian
            - call: "POST /ballot-lots/${lot2}/issue"
              payload: { precinct_id: "${pr}", issue_quantity: 2000 }
              as: WarehouseCustodian
            - call: "POST /ballot-lots/${lot3}/receive"
              payload: { seal_number: "SEAL-1003", quantity_received: 4498 }
              as: WarehouseCustodian
            - call: "POST /ballot-lots/${lot3}/issue"
              payload: { precinct_id: "${pr}", issue_quantity: 1 }
              as: WarehouseCustodian
            - call: "POST /elections/${el}/tabulator-units"
              payload: { asset_tag: "TAB-001", firmware_version: "5.2.1" }
              as: VotingSystemTechnician
              captures: { tab: $.data.id }
            - call: "POST /tabulator-units/${tab}/program"
              payload: { style_id: "${st}", firmware_version: "5.2.1" }
              as: VotingSystemTechnician
              as_user_id: "user-tech-1"
            - call: "POST /ballot-styles/${st}/test-decks"
              payload: { deck_code: "DECK-A", ballot_count: 1, blank_count: 1, overvote_count: 0, expected_marks: [] }
              as: VotingSystemTechnician
              as_user_id: "user-tech-1"
              captures: { deck: $.data.id }
            - call: "POST /la-test-sessions"
              payload: { tabulator_id: "${tab}", deck_id: "${deck}", session_type: "PRE_ELECTION_PUBLIC", scheduled_start: "2026-09-01T14:00:00Z", scheduled_end: "2026-09-01T18:00:00Z", public_notice_posted_at: "2026-08-01T00:00:00Z" }
              as: VotingSystemTechnician
              as_user_id: "user-tech-2"
              captures: { sess: $.data.id }
            - call: "POST /la-test-sessions/${sess}/observers"
              payload: { observer_name: "Obs One" }
              as: PublicObserver
            - call: "POST /la-test-sessions/${sess}/observers"
              payload: { observer_name: "Obs Two" }
              as: PublicObserver
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-09-01T14:00:00Z" }
              as: ElectionsDirector
            - call: "POST /la-test-sessions/${sess}/start"
              payload: {}
              as: VotingSystemTechnician
              as_user_id: "user-tech-2"
            - call: "POST /la-test-sessions/${sess}/record-results"
              payload: { reported_marks: [], reported_blank_count: 1, reported_overvote_count: 0 }
              as: VotingSystemTechnician
              as_user_id: "user-tech-2"
            - call: "POST /tabulator-units/${tab}/deploy"
              payload: { precinct_id: "${pr}", seal_number: "SEAL-TAB-1" }
              as: WarehouseCustodian
            - call: "POST /elections/${el}/deploy"
              payload: {}
              as: ElectionsDirector
            - call: "POST /ballot-lots/${lot1}/return-counts"
              payload: { voted_quantity: 2900, spoiled_quantity: 30, returned_unused_quantity: 20 }
              as: WarehouseCustodian
            - call: "POST /ballot-lots/${lot2}/return-counts"
              payload: { voted_quantity: 1880, spoiled_quantity: 25, returned_unused_quantity: 34 }
              as: WarehouseCustodian
          trigger:
            - call: "GET /elections/${el}/accountability"
              payload: { basis: "FINAL_CANVASS" }
              as: ElectionsDirector
            - call: "GET /elections/${el}/accountability"
              payload: { basis: "PRELIMINARY" }
              as: ElectionsDirector
          assert:
            - "The FINAL_CANVASS read returns basis FINAL_CANVASS, lot_count 2, gross_issued 5000, allowance_bp 25, spoilage_credit 12, net_issued 4988, accounted 4889, gross_variance 111, net_variance 99, tolerance_bp 200, tolerance_ballots 99 and ballot_accountability_status BALANCED."
            - "The PRELIMINARY read returns basis PRELIMINARY, lot_count 3, gross_issued 5001, allowance_bp 15, spoilage_credit 7, net_issued 4994, accounted 4889, gross_variance 112, net_variance 105, tolerance_bp 200, tolerance_ballots 99 and ballot_accountability_status OUT_OF_BALANCE."
            - "The two reads differ in ballot_accountability_status (BALANCED versus OUT_OF_BALANCE) on identical stored data, and differ in allowance_bp (25 versus 15) even though gross_issued differs by only one ballot."
            - "Both reads are pure: Election.${el}.status is still DEPLOYED, ballot_accountability_status is still PENDING, net_ballot_variance is still 0, and reconciliation_basis and last_reconciled_at are both still null because POST /elections/${el}/reconcile was never called."
            - "BallotLot.${lot1}.custody_state == RETURNED with accounted_quantity 2950, BallotLot.${lot2}.custody_state == RETURNED with accounted_quantity 1939, BallotLot.${lot3}.custody_state == ISSUED with accounted_quantity 0."

  - rule_id: combinatorial_formula
    instances:
      - name: cf_rotation_district_ordinal_and_optout
        grounds:
          - calculations.candidate_ballot_order
          - calculations.contest_ballot_ordering
          - entities.Contest.fields.rotation_required
          - entities.BallotStyle.fields.district_codes
          - entities.BallotStyle.fields.rotation_seed_index
        distinguishing_aspect: |
          printed_position is a function of FIVE interacting inputs - election.rotation_policy,
          style.rotation_seed_index, the 0-based ordinal d of the contest's district inside
          sorted(style.district_codes), the roster size N, and the contest-level rotation_required
          opt-out - and no single one of them determines the answer. Three contests on ONE style with
          ONE seed and IDENTICAL four-name rosters print three different permutations (g == 1, g == 2
          and g == 0), which cannot be reproduced by any per-election or per-style constant.
        test_recipe:
          setup:
            - "An election with rotation_policy DISTRICT_ROTATION and candidate_order_method ALPHABETICAL_BY_BALLOT_NAME."
            - "Three certified CANDIDATE contests, one per district: County Assessor in D-07 (rotation_required true), County Sheriff in D-12 (rotation_required true), County Clerk in D-19 (rotation_required false)."
            - "Every contest carries the same four ballot names Alvarez, Brooks, Chen, Dawson, so N == 4 everywhere and only the rotation group can differ."
            - "One certified MEASURE contest Bond Measure A in D-07 with no candidates."
            - "A dummy style S-050 over district D-99 created first so that style S-100 - which covers exactly D-07, D-12 and D-19 - gets computed rotation_seed_index 1; inside S-100 the district ordinals are d == 0 for D-07, d == 1 for D-12 and d == 2 for D-19."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "DISTRICT_ROTATION", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
