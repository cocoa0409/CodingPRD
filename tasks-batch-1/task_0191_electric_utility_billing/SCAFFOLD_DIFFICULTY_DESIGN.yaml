              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "CrossEnt Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-L1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-01-01T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T00:00:00Z" }
              as: BillingOperator
            - call: "POST /assistance-grants"
              payload: { account_id: "${acct_id}", pledged_cents: 500, program: "LIHEAP" }
              as: AssistanceCaseworker
              captures: { grant_id: $.data.id }
            - call: "POST /accounts/${acct_id}/disconnect-notice"
              payload: {}
              as: BillingOperator
              captures: { blocked_err: $.data.error_id }
            - call: "POST /assistance-grants/${grant_id}/cancel"
              payload: {}
              as: AssistanceCaseworker
          trigger:
            - call: "POST /accounts/${acct_id}/disconnect-notice"
              payload: {}
              as: BillingOperator
              captures: { so_id: $.data.id }
          assert:
            - "first disconnect-notice (grant PLEDGED) returns ERR_ASSISTANCE_SHIELD"
            - "after grant CANCELLED, disconnect-notice succeeds: Account.${acct_id}.service_status == DISCONNECT_PENDING"
            - "ServiceOrder.${so_id}.order_type == DISCONNECT"

      - name: bill_issue_depends_on_tariff_active_state
        grounds:
          - state_machines.Bill.DRAFT_to_ISSUED
          - validations[priority=8]
          - entities.Tariff.fields.status
          - errors[ERR_TARIFF_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Bill->Tariff: a Bill can only move DRAFT->ISSUED while its account's Tariff is
          ACTIVE. Distinct pair from Account->AssistanceGrant. We retire the tariff after account+bill
          creation and confirm issuance is rejected with ERR_TARIFF_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Account M opened while its tariff is ACTIVE; the tariff is then RETIRED before issuance"
            - "the DRAFT bill cannot move to ISSUED because price_bill re-checks tariff ACTIVE at issue time"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-XEN-M", name: "CrossEnt M", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
