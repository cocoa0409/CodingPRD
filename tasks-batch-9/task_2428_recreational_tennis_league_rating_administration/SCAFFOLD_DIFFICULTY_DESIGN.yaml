            - { call: "POST /tennis/matches/${m3}/schedule", payload: { facility_id: "${fac}", scheduled_start_at: "2026-08-25T18:00:00Z", courts_required: 3, expected_match_version: "${m3v}" }, as: LeagueCoordinator }
