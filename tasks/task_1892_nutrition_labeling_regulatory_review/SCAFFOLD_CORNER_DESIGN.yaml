            - "fc_result == FAIL and fc_viol == [TYPE_SIZE_BELOW_MIN] (format allowed, only type size violated)"

      - name: calc_claim_not_required_unregulated_market
        claim_type: variant_selection
        grounds: [calculations.claim_eligibility_evaluation, entities.ClaimAssessment.fields.status]
        distinguishing_aspect: "SUGAR_FREE on a CA_CFIA label evaluates to NOT_REQUIRED (market rule set), with evaluated_value_per_racc null — the same claim_type is regulated under US_FDA."
        test_recipe:
