            - "VarianceRequest.${nc_var}.status == DENIED, denied_by_cascade == true, decided_by_user_id is null, approval_level == OWNER_REP"
            - "OperatingBudget.${nc_bud27}.status is still SUBMITTED — the ACTIVE branch of the notice carries no budget-supersession side effect, unlike the CURE_PERIOD branch"
            - "OperatingBudget.${nc_bud26}.status == APPROVED and carryforward_applied == false — the approved budget is untouched"
            - "GET /hotel-management/report-packages/${nc_pkg}/distributions with status HELD returns pagination.total_count == 1 with shortfall_cents == 3702000"

      - name: budget_revision_cycle_returns_row_to_submitted
        claim_type: valid_transition
        grounds:
          - state_machines.OperatingBudget.REVISION_REQUESTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / budget_revision_cycle_exhausts_rounds_and_deadlocks_into_carryforward
          rationale: "The named §1.8 instance drives the REVISION_REQUESTED -> SUBMITTED cycle hop as part of its setup and asserts the branch that follows it."

      - name: package_dimensions_change_independently
        claim_type: valid_transition
        grounds:
          - state_machines.MonthlyReportPackage.benchmark_status_==_SUBMITTED_to_benchmark_status_==_CHALLENGED
        excluded_because:
          difficulty_instance: non_linear_state_machine / report_package_two_status_dimensions_advance_independently
          rationale: "The named §1.8 instance asserts the parallel-dimension shape and the CONTESTED roll-up directly."

  # =========================================================================
  # §1.3 Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: package_due_date_derivation_and_on_time_submission_boundary
        claim_type: correct_result
        grounds:
          - calculations.package_derived_fields
          - entities.MonthlyReportPackage.fields.due_date_utc
          - entities.MonthlyReportPackage.fields.submitted_late
        distinguishing_aspect: "due_date_utc is the 25th of the month after the period, so (2026, 9) is due 2026-10-25 and (2026, 12) rolls into 2027-01-25; submitted_late uses a strict comparison, so a submit landing exactly on the due instant is on time and one second later is late."
        test_recipe:
          setup:
            - "One ACTIVE agreement with an APPROVED FY2026 budget."
            - "Three packages already open: (2026, 9), (2026, 10) and (2026, 12)."
            - "Logical clock starts at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Due Date Hotel", owner_entity_name: "Due Date Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0, working_capital_floor_cents: 0, initial_working_capital_cents: 0 }
              as: PlatformAdmin
              captures: { dd_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${dd_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { dd_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${dd_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${dd_v2}" }
              as: HotelManagerOps
              captures: { dd_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${dd_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${dd_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${dd_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { dd_p9: $.data.id }
            - call: "POST /hotel-management/agreements/${dd_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 10, rooms_revenue_cents: 21000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 6000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { dd_p10: $.data.id }
            - call: "POST /hotel-management/agreements/${dd_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 12, rooms_revenue_cents: 22000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 6000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { dd_p12: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-25T00:00:00Z" }
              as: PlatformAdmin
              captures: { dd_deemed: $.data.deemed_approved_budget_count }
            - call: "POST /hotel-management/report-packages/${dd_p9}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-25T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /hotel-management/report-packages/${dd_p10}/submit"
              payload: {}
              as: HotelManagerOps
          assert:
            - "MonthlyReportPackage.${dd_p9}.due_date_utc == 2026-10-25T00:00:00Z, MonthlyReportPackage.${dd_p10}.due_date_utc == 2026-11-25T00:00:00Z, MonthlyReportPackage.${dd_p12}.due_date_utc == 2027-01-25T00:00:00Z"
            - "the first clock call reports deemed_approved_budget_count == 0 because the budget was already APPROVED"
            - "MonthlyReportPackage.${dd_p9}.submitted_at == 2026-10-25T00:00:00Z and submitted_late == false — a submit exactly at the due instant is on time"
            - "MonthlyReportPackage.${dd_p10}.submitted_at == 2026-11-25T00:00:01Z and submitted_late == true"
            - "MonthlyReportPackage.${dd_p12}.submitted_at is null and submitted_late == false"

      - name: budget_agop_floors_the_centralized_allowance_and_half_ups_the_base_fee
        claim_type: precision
        grounds:
          - calculations.budget_agop_derivation
          - entities.OperatingBudget.fields.budgeted_centralized_cents
          - entities.OperatingBudget.fields.budgeted_agop_cents
        distinguishing_aspect: "On a revenue figure whose centralized allowance lands on a half cent, the allowance is floored to 3000001 while the base fee is rounded half-up to 6500003, so budgeted_agop_cents is 60500096 and not the 60500095 a half-up allowance would give."
        test_recipe:
          setup:
            - "One ACTIVE agreement with base_fee_pct 0.0325 and centralized_services_cap_pct 0.015."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Single Rounding Hotel", owner_entity_name: "Rounding Owner LLC", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, centralized_services_cap_pct: 0.015 }
              as: PlatformAdmin
              captures: { sr_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${sr_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { sr_v2: $.data.version }
          trigger:
            - call: "POST /hotel-management/agreements/${sr_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 200000100, budgeted_operating_expenses_cents: 130000000, expected_agreement_version: "${sr_v2}" }
              as: HotelManagerOps
              captures: { sr_bud: $.data.id }
          assert:
            - "OperatingBudget.${sr_bud}.budgeted_base_fee_cents == 6500003, the half-up rounding of 6500003.25"
            - "OperatingBudget.${sr_bud}.budgeted_centralized_cents == 3000001, the floor of 3000001.5, not the half-up 3000002"
            - "OperatingBudget.${sr_bud}.budgeted_agop_cents == 60500096, not the 60500095 produced by a half-up allowance"
            - "OperatingBudget.${sr_bud}.status == DRAFT and revision_round == 0"

      - name: variance_tier_at_exactly_five_percent_stays_manager_discretion
        claim_type: constants_applied
        grounds:
          - calculations.variance_approval_routing
          - calculations.variance_approval_routing.constants.TIER1_PCT_INCLUSIVE
          - entities.VarianceRequest.fields.approval_level
        distinguishing_aspect: "A ratio that rounds to exactly 0.050000 at six places stays MANAGER_DISCRETION and auto-approves, while 0.050500 on an untouched CAPITAL_FFE baseline of the same size crosses into ASSET_MANAGER and stays PENDING."
        test_recipe:
          setup:
            - "One ACTIVE agreement with an APPROVED FY2026 budget whose budgeted_operating_expenses_cents and budgeted_capital_ffe_cents are both 20000000."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Tier Boundary Hotel", owner_entity_name: "Tier Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { tb_agr: $.data.id }
