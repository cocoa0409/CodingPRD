      - 'Call 7: HTTP 404 with data.error_id == "ERR_INVESTOR_ACCOUNT_NOT_FOUND"'
      - 'Call 8: HTTP 404 with data.error_id == "ERR_ROYALTY_PARTICIPANT_NOT_FOUND"'
