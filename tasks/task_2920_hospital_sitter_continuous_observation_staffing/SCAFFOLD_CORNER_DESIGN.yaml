              as: StaffingCoordinator
              captures: { hs_out: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u30}", full_name: "Incoming Sitter", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { hs_in: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u30}", full_name: "Other Order Sitter", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { hs_other: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${hpa}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Handoff order A" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { hoa: $.data.id, hoa_v1: $.data.version }
            - call: "POST /observation/orders"
              payload: { patient_id: "${hpb}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Handoff order B" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { hob: $.data.id, hob_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${hoa}", staff_id: "${hs_out}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${hoa_v1}" }
              as: StaffingCoordinator
              captures: { ha_out: $.data.id }
            - call: "GET /observation/orders/${hoa}"
              payload: {}
              as: StaffingCoordinator
              captures: { hoa_v2: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${hoa}", staff_id: "${hs_in}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-02T00:00:00Z", expected_order_version: "${hoa_v2}" }
              as: StaffingCoordinator
              captures: { ha_in: $.data.id }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${hob}", staff_id: "${hs_other}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${hob_v1}" }
              as: StaffingCoordinator
              captures: { hb_other: $.data.id }
          trigger:
            - call: "POST /observation/handoffs"
              payload: { outgoing_assignment_id: "${ha_out}", incoming_assignment_id: "${hb_other}", behavior_summary: "Calm, redirectable", interventions_used: ["VERBAL_REDIRECTION"] }
              as: Sitter
              as_user_id: "${hs_out}"
            - call: "POST /observation/handoffs"
              payload: { outgoing_assignment_id: "${ha_out}", incoming_assignment_id: "${ha_out}", behavior_summary: "Calm, redirectable", interventions_used: ["VERBAL_REDIRECTION"] }
              as: Sitter
              as_user_id: "${hs_out}"
            - call: "POST /observation/handoffs"
              payload: { outgoing_assignment_id: "${ha_out}", incoming_assignment_id: "${ha_in}", behavior_summary: "Calm, redirectable", interventions_used: ["VERBAL_REDIRECTION"] }
              as: Sitter
