scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fee_provisional_client_county_vs_final_run_county
        grounds:
          - calculations.voucher_delivery_fee
          - entities.Voucher.fields.fee_basis
          - entities.Voucher.fields.client_due_cents
          - entities.DeliveryRun.fields.county
          - state_machines.Voucher.SCHEDULED_to_DELIVERED
        distinguishing_aspect: |
          This dual variant lives on the Voucher money domain: the provisional quote prices the
          household's own county over stock in {RESERVED, STAGED}, while the final invoice prices
          the county the truck actually served over stock in {DELIVERED}, so identical furniture
          yields client_due_cents 1710 provisionally and 2010 finally.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z."
            - "PartnerAgency in county CENTRAL with quota 5 and standing GOOD."
            - "Client of household_size 4, county CENTRAL, has_infant false, bed_bug_status CLEAR."
            - "Referral APPROVED; Voucher ISSUED with one BED line, quantity_requested 1, min_condition B."
            - "One InventoryItem: BED, condition B, 30.0 cubic feet, AVAILABLE (clean intake, no quarantine)."
            - "After the allocation round the voucher is ALLOCATED with fee_basis PROVISIONAL and client_due_cents 1710."
            - "A DeliveryRun in county NORTH is CREWED and DISPATCHED with the voucher booked as its only stop."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Riverbend Family Services", county: "CENTRAL", quarterly_voucher_quota: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 4, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /vouchers"
              payload: { referral_id: "${ref_id}", lines: [ { category: "BED", quantity_requested: 1, min_condition: "B" } ] }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { v_id: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /trucks"
              payload: { label: "BOX-1", capacity_cubic_feet: 600, home_county: "CENTRAL", crew_minimum: 1 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
            - call: "POST /donation-offers"
              payload: { donor_name: "Ana Reyes", donor_phone: "555-0100", pickup_county: "CENTRAL", pickup_window_start: "2026-08-04T10:00:00Z", pickup_window_end: "2026-08-04T12:00:00Z", items: [ { category: "BED", declared_condition: "B", soft_surface: false, cubic_feet: 30.0 } ] }
              as: IntakeCoordinator
              captures: { off_id: "$.data.id" }
            - call: "POST /donation-offers/${off_id}/triage"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /donation-offers/${off_id}/schedule-pickup"
              payload: { truck_id: "${tr_id}" }
              as: IntakeCoordinator
            - call: "GET /donation-offers/${off_id}/items"
              payload: {}
              as: WarehouseLead
              captures: { it1_id: "$.data[0].id" }
            - call: "POST /donation-offers/${off_id}/intake"
              payload: { inspections: [ { item_id: "${it1_id}", graded_condition: "B", live_pest_observed: false } ] }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
            - call: "POST /vouchers/${v_id}/allocate"
              payload: { expected_voucher_version: "${v_ver}" }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
              captures: { prov_gross: "$.data.gross_fee_cents", prov_sub: "$.data.subsidy_cents", prov_due: "$.data.client_due_cents", prov_basis: "$.data.fee_basis" }
            - call: "POST /volunteers"
              payload: { name: "Dana Cole", county: "CENTRAL", lift_certified: true }
              as: PlatformAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /delivery-runs"
              payload: { truck_id: "${tr_id}", service_date: "2026-08-05", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T17:00:00Z", county: "NORTH" }
              as: DispatchPlanner
              captures: { run_id: "$.data.id", run_ver: "$.data.version" }
            - call: "POST /delivery-runs/${run_id}/stops"
              payload: { voucher_id: "${v_id}", sequence: 1, expected_run_version: "${run_ver}" }
              as: DispatchPlanner
              captures: { stop_id: "$.data.id" }
            - call: "POST /delivery-runs/${run_id}/crew"
              payload: { volunteer_id: "${vol_id}", role_on_crew: "DRIVER" }
              as: DispatchPlanner
              captures: { ca_id: "$.data.id" }
            - call: "POST /crew-assignments/${ca_id}/respond"
              payload: { response: "CONFIRM" }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /delivery-runs/${run_id}/dispatch"
              payload: {}
              as: DispatchPlanner
          trigger:
            - call: "POST /delivery-stops/${stop_id}/outcome"
              payload: { outcome: "DELIVERED" }
              as: DispatchPlanner
          assert:
            - "${prov_gross} == 5700"
            - "${prov_sub} == 3990"
            - "${prov_due} == 1710"
            - "${prov_basis} == PROVISIONAL"
            - "Voucher.${v_id}.gross_fee_cents == 6700"
            - "Voucher.${v_id}.subsidy_cents == 4690"
            - "Voucher.${v_id}.client_due_cents == 2010"
            - "Voucher.${v_id}.fee_basis == FINAL"
            - "Voucher.${v_id}.status == DELIVERED"
            - "Voucher.${v_id}.fee_status == PENDING"
            - "Referral.${ref_id}.status == FULFILLED"
            - "Client.${cl_id}.lifetime_vouchers_delivered == 1"
            - "DeliveryRun.${run_id}.status == COMPLETED"
            - "DeliveryStop.${stop_id}.chargeback_cents == 0"

      - name: priority_intake_score_vs_waitlist_score_tenure
        grounds:
          - calculations.client_referral_priority_score
          - entities.Referral.fields.priority_score
          - entities.WaitlistEntry.fields.priority_score
          - entities.WaitlistEntry.fields.waiting_since
          - state_machines.Voucher.ISSUED_to_ISSUED
        distinguishing_aspect: |
          This dual variant lives on the household-need domain rather than on money: the intake
          variant scores the same PRIORITY referral at 45.0 with tenure frozen at zero, while the
          waitlist variant rescores the identical household at 49.0 after 31 days of queue tenure.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z, then moved to 2026-09-04T09:00:00Z before the trigger."
            - "PartnerAgency CENTRAL with quota 5; Client household_size 4, county CENTRAL, has_infant false, no strikes."
            - "Referral urgency PRIORITY, SUBMITTED then APPROVED (expires_at 2026-09-18T09:00:00Z, still live at trigger time)."
            - "Voucher ISSUED with one BED line, quantity_requested 1; the warehouse holds no stock at all."
            - "The zero-yield allocation round leaves the voucher ISSUED and creates one WaitlistEntry WAITING with waiting_since 2026-08-04T09:00:00Z and priority_score 45.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Hillcrest Outreach", county: "CENTRAL", quarterly_voucher_quota: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 4, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "PRIORITY", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { intake_score: "$.data.priority_score" }
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /vouchers"
              payload: { referral_id: "${ref_id}", lines: [ { category: "BED", quantity_requested: 1, min_condition: "B" } ] }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { v_id: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vouchers/${v_id}/allocate"
              payload: { expected_voucher_version: "${v_ver}" }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
            - call: "GET /waitlist-entries"
              payload: { client_id: "${cl_id}", status: "WAITING" }
              as: PlatformAdmin
              captures: { wl_id: "$.data[0].id", wl_score_at_creation: "$.data[0].priority_score" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run-cycle"
              payload: { advance_quota_epoch: false }
              as: PlatformAdmin
              captures: { expired_refs: "$.data.expired_referral_count", promoted: "$.data.promoted_waitlist_count" }
          assert:
            - "${intake_score} == 45.0"
            - "${wl_score_at_creation} == 45.0"
            - "WaitlistEntry.${wl_id}.priority_score == 49.0"
            - "WaitlistEntry.${wl_id}.status == WAITING"
            - "WaitlistEntry.${wl_id}.quantity_unmet == 1"
            - "Referral.${ref_id}.priority_score == 45.0"
            - "Referral.${ref_id}.status == APPROVED"
            - "${expired_refs} == 0"
            - "${promoted} == 0"
            - "Voucher.${v_id}.status == ISSUED"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fee_cap_then_subsidy_clamp_nested_min_max
        grounds:
          - calculations.voucher_delivery_fee
          - calculations.voucher_delivery_fee.constants.FEE_CAP_CENTS
          - entities.Client.fields.has_infant
          - entities.Voucher.fields.gross_fee_cents
        distinguishing_aspect: |
          Mode (a) - a five-input non-linear formula: county base, ceil-bucketed bulk, categorical
          lift surcharge, an outer min against FEE_CAP_CENTS and an inner min clamping the infant
          bonus at 1.00 all interact, driving gross to exactly 9000 (uncapped 12500) and
          client_due_cents to exactly 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z, advanced to 2026-08-18T09:00:00Z for quarantine release."
            - "PartnerAgency SOUTH with quota 5, standing GOOD."
            - "Client household_size 6, county SOUTH, has_infant true."
            - "Referral APPROVED; Voucher ISSUED with a SOFA line (qty 1, min_condition C) and a BED line (qty 1, min_condition C)."
            - "A donation offer of SOFA 120.0 cf (soft-surface), BED 90.0 cf and DRESSER 10.0 cf triages with declared_soft_ratio 0.333 so all three are ACCEPTED."
            - "Because an accepted piece is soft-surface the intake takes the QUARANTINED branch with quarantine_release_due_at 2026-08-18T09:00:00Z; a second WarehouseLead releases the offer at exactly that instant, making all three units AVAILABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Southgate Aid", county: "SOUTH", quarterly_voucher_quota: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 6, county: "SOUTH", has_infant: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["SOFA", "BED"], urgency: "EMERGENCY", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /vouchers"
              payload: { referral_id: "${ref_id}", lines: [ { category: "SOFA", quantity_requested: 1, min_condition: "C" }, { category: "BED", quantity_requested: 1, min_condition: "C" } ] }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { v_id: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /trucks"
              payload: { label: "BOX-2", capacity_cubic_feet: 600, home_county: "SOUTH", crew_minimum: 1 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
            - call: "POST /donation-offers"
              payload: { donor_name: "Marcus Hill", donor_phone: "555-0111", pickup_county: "SOUTH", pickup_window_start: "2026-08-04T10:00:00Z", pickup_window_end: "2026-08-04T12:00:00Z", items: [ { category: "SOFA", declared_condition: "B", soft_surface: true, cubic_feet: 120.0 }, { category: "BED", declared_condition: "B", soft_surface: false, cubic_feet: 90.0 }, { category: "DRESSER", declared_condition: "C", soft_surface: false, cubic_feet: 10.0 } ] }
              as: IntakeCoordinator
              captures: { off_id: "$.data.id" }
            - call: "POST /donation-offers/${off_id}/triage"
              payload: {}
              as: IntakeCoordinator
              captures: { soft_ratio: "$.data.declared_soft_ratio", accepted: "$.data.accepted_item_count" }
            - call: "POST /donation-offers/${off_id}/schedule-pickup"
              payload: { truck_id: "${tr_id}" }
              as: IntakeCoordinator
            - call: "GET /donation-offers/${off_id}/items"
              payload: {}
              as: WarehouseLead
              captures: { it1_id: "$.data[0].id", it2_id: "$.data[1].id", it3_id: "$.data[2].id" }
            - call: "POST /donation-offers/${off_id}/intake"
              payload: { inspections: [ { item_id: "${it1_id}", graded_condition: "B", live_pest_observed: false }, { item_id: "${it2_id}", graded_condition: "B", live_pest_observed: false }, { item_id: "${it3_id}", graded_condition: "C", live_pest_observed: false } ] }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
              captures: { due_at: "$.data.quarantine_release_due_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donation-offers/${off_id}/quarantine-release"
              payload: {}
              as: WarehouseLead
              as_user_id: "wl-release-2"
          trigger:
            - call: "POST /vouchers/${v_id}/allocate"
              payload: { expected_voucher_version: "${v_ver}" }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
          assert:
            - "${soft_ratio} == 0.333"
            - "${accepted} == 3"
            - "${due_at} == 2026-08-18T09:00:00.000Z"
            - "Voucher.${v_id}.gross_fee_cents == 9000"
            - "Voucher.${v_id}.subsidy_cents == 9000"
            - "Voucher.${v_id}.client_due_cents == 0"
            - "Voucher.${v_id}.fee_basis == PROVISIONAL"
            - "Voucher.${v_id}.status == ALLOCATED"
            - "Voucher.${v_id}.fill_ratio == 1.0"
            - "DonationOffer.${off_id}.status == RELEASED"
            - "GET /inventory-items with status=AVAILABLE and category=DRESSER returns exactly 1 item (the 10.0 cf dresser was never requested)"

      - name: chargeback_rounds_per_line_before_summing
        grounds:
          - calculations.no_show_chargeback
          - calculations.no_show_chargeback.constants.CATEGORY_BASE_CENTS
          - entities.DeliveryStop.fields.chargeback_cents
          - entities.PartnerAgency.fields.no_show_credits_owed_cents
          - state_machines.DeliveryStop.SCHEDULED_to_NO_SHOW
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order decides the answer: TABLE_SET 517.5 and DRESSER
          427.5 each round half-up to 518 and 428 for a total of 946, whereas summing first
          (945.0) and rounding once yields 945; the scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z throughout."
            - "PartnerAgency CENTRAL quota 5 standing GOOD; Client household_size 4 county CENTRAL."
            - "Referral APPROVED; Voucher with a TABLE_SET line (qty 1) and a DRESSER line (qty 1), both fully allocated from a clean donation offer of TABLE_SET 25.0 cf and DRESSER 15.0 cf."
            - "The voucher is booked as the only stop on a CREWED, then DISPATCHED, run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Midtown Care Network", county: "CENTRAL", quarterly_voucher_quota: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 4, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["TABLE_SET", "DRESSER"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /vouchers"
              payload: { referral_id: "${ref_id}", lines: [ { category: "TABLE_SET", quantity_requested: 1, min_condition: "B" }, { category: "DRESSER", quantity_requested: 1, min_condition: "B" } ] }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { v_id: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /trucks"
              payload: { label: "BOX-3", capacity_cubic_feet: 600, home_county: "CENTRAL", crew_minimum: 1 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
            - call: "POST /donation-offers"
              payload: { donor_name: "Priya Nair", donor_phone: "555-0122", pickup_county: "CENTRAL", pickup_window_start: "2026-08-04T10:00:00Z", pickup_window_end: "2026-08-04T12:00:00Z", items: [ { category: "TABLE_SET", declared_condition: "B", soft_surface: false, cubic_feet: 25.0 }, { category: "DRESSER", declared_condition: "B", soft_surface: false, cubic_feet: 15.0 } ] }
              as: IntakeCoordinator
              captures: { off_id: "$.data.id" }
            - call: "POST /donation-offers/${off_id}/triage"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /donation-offers/${off_id}/schedule-pickup"
              payload: { truck_id: "${tr_id}" }
              as: IntakeCoordinator
            - call: "GET /donation-offers/${off_id}/items"
              payload: {}
              as: WarehouseLead
              captures: { it1_id: "$.data[0].id", it2_id: "$.data[1].id" }
            - call: "POST /donation-offers/${off_id}/intake"
              payload: { inspections: [ { item_id: "${it1_id}", graded_condition: "B", live_pest_observed: false }, { item_id: "${it2_id}", graded_condition: "B", live_pest_observed: false } ] }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
            - call: "POST /vouchers/${v_id}/allocate"
              payload: { expected_voucher_version: "${v_ver}" }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
              captures: { prov_due: "$.data.client_due_cents" }
            - call: "POST /volunteers"
              payload: { name: "Ray Osei", county: "CENTRAL", lift_certified: true }
              as: PlatformAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /delivery-runs"
              payload: { truck_id: "${tr_id}", service_date: "2026-08-05", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T17:00:00Z", county: "CENTRAL" }
              as: DispatchPlanner
              captures: { run_id: "$.data.id", run_ver: "$.data.version" }
            - call: "POST /delivery-runs/${run_id}/stops"
              payload: { voucher_id: "${v_id}", sequence: 1, expected_run_version: "${run_ver}" }
              as: DispatchPlanner
              captures: { stop_id: "$.data.id" }
            - call: "POST /delivery-runs/${run_id}/crew"
              payload: { volunteer_id: "${vol_id}", role_on_crew: "DRIVER" }
              as: DispatchPlanner
              captures: { ca_id: "$.data.id" }
            - call: "POST /crew-assignments/${ca_id}/respond"
              payload: { response: "CONFIRM" }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /delivery-runs/${run_id}/dispatch"
              payload: {}
              as: DispatchPlanner
          trigger:
            - call: "POST /delivery-stops/${stop_id}/outcome"
              payload: { outcome: "NO_SHOW" }
              as: DispatchPlanner
          assert:
            - "${prov_due} == 1260"
            - "DeliveryStop.${stop_id}.chargeback_cents == 946"
            - "PartnerAgency.${ag_id}.no_show_credits_owed_cents == 946"
            - "PartnerAgency.${ag_id}.standing == GOOD"
            - "DeliveryStop.${stop_id}.status == NO_SHOW"
            - "Voucher.${v_id}.status == ALLOCATED"
            - "Client.${cl_id}.no_show_strikes == 1"
            - "Client.${cl_id}.status == ACTIVE"
            - "DeliveryRun.${run_id}.status == COMPLETED"
            - "GET /inventory-items with status=RESERVED returns exactly 2 items (both stay earmarked for the voucher)"

      - name: triage_pinned_three_step_evaluation_order
        grounds:
          - calculations.donation_acceptance_triage
          - entities.DonationOffer.fields.declared_soft_ratio
          - entities.DonationOffer.fields.bed_bug_risk_score
          - entities.DonationItem.fields.reject_reason
          - state_machines.DonationOffer.OFFERED_to_TRIAGED
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency pinned by evaluation order: the soft-surface
          rejection reads the PRE-decision ratio 0.5 over all four items, while bed_bug_risk_score
          reads only the POST-decision accepted set and is therefore 0.0, not 50.0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z; warehouse completely empty so headroom is the full 4000 cf."
            - "One donation offer with exactly four pieces created in this order: SOFA condition B soft-surface 40.0 cf; CRIB condition B non-soft 10.0 cf; LINENS condition A soft-surface 5.0 cf; TABLE_SET condition A non-soft 20.0 cf."
