    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["modality?", "active_breakdown_id?", "limit?", "offset?"]
    output: "MobileImagingUnit[]"
    side_effects: []
  - method: GET
    path: "/api/units/{id}"
    description: "Get a unit"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: MobileImagingUnit
    side_effects: []
  - method: POST
    path: "/api/units/{id}/maintenance"
    description: "Send unit to MAINTENANCE (no in-flight site day allowed)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: MobileImagingUnit
    side_effects: ["status -> MAINTENANCE"]
  - method: POST
    path: "/api/units/{id}/return-to-service"
    description: "Return unit from MAINTENANCE to ACTIVE_SERVICE"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: MobileImagingUnit
    side_effects: ["status -> ACTIVE_SERVICE"]

  # --- Contracts ---
  - method: POST
    path: "/api/contracts"
    description: "Create a service contract for a facility"
    roles: [OperationsDirector]
    code: 201
    input: [facility_id, billing_model, day_rate_cents, scan_rate_cents, included_scan_quota, overage_scan_rate_cents, guaranteed_minimum_cents, no_show_fee_cents, cancel_notice_hours, cancel_late_pct, monthly_scan_cap, interruption_floor_cents]
    output: ServiceContract
    side_effects: []
  - method: GET
    path: "/api/contracts"
    description: "List contracts (filter by facility_id)"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: "ServiceContract[]"
    side_effects: []
  - method: GET
    path: "/api/contracts/{id}"
    description: "Get a contract"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []
  - method: GET
    path: "/api/contracts/{id}/period-invoice"
    description: "Computed read: monthly rollup with volume discount tier selected on gross (see contract_period_invoice_total)"
    roles: [OperationsDirector]
    code: 200
    input: [month]
    output: { month: "string", gross_cents: "integer", tier_pct: "integer", discount_cents: "integer", net_cents: "integer" }
    side_effects: []

  # --- Route Plans ---
  - method: POST
    path: "/api/route-plans"
    description: "Create a week route plan for a unit (DRAFT). Supersedes an existing DRAFT plan for the same unit+week; conflicts with PUBLISHED/LOCKED. OCC on unit.version."
    roles: [OperationsDirector]
    code: 201
    input: [unit_id, week_start_date, expected_unit_version]
    output: RoutePlan
    side_effects: ["increments MobileImagingUnit.version by 1", "existing DRAFT plan for (unit, week) -> SUPERSEDED"]
  - method: GET
    path: "/api/route-plans"
    description: "List route plans"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["unit_id?", "status?", "supersedes_plan_id?", "limit?", "offset?"]
    output: "RoutePlan[]"
    side_effects: []
  - method: GET
    path: "/api/route-plans/{id}"
    description: "Get a route plan"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: RoutePlan
    side_effects: []
  - method: POST
    path: "/api/route-plans/{id}/publish"
    description: "Publish a DRAFT plan (requires >= 1 site day)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: RoutePlan
    side_effects: ["status -> PUBLISHED"]
  - method: POST
    path: "/api/route-plans/{id}/unpublish"
    description: "Return a PUBLISHED plan to DRAFT (all days must be SCHEDULED or CANCELLED)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: RoutePlan
    side_effects: ["status -> DRAFT"]
  - method: POST
    path: "/api/route-plans/{id}/lock"
    description: "Lock a PUBLISHED plan (blocks new site days and reschedule-in)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: RoutePlan
    side_effects: ["status -> LOCKED"]
  - method: POST
    path: "/api/route-plans/{id}/close"
    description: "Close a LOCKED plan (all days terminal)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: RoutePlan
    side_effects: ["status -> CLOSED"]

  # --- Site Day Assignments ---
  - method: POST
    path: "/api/site-days"
    description: "Assign a unit to a facility for one service date inside a plan week"
    roles: [OperationsDirector]
    code: 201
    input: [route_plan_id, facility_id, contract_id, service_date, arrival_time, first_patient_time, last_patient_time, departure_time]
    output: SiteDayAssignment
    side_effects: ["status = SCHEDULED", "unit_id denormalized from plan", "increments RoutePlan.version by 1", "RoutePlan.site_day_count += 1"]
  - method: GET
    path: "/api/site-days"
    description: "List site days with filters"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["route_plan_id?", "unit_id?", "facility_id?", "contract_id?", "status?", "service_date?", "rescheduled_from_id?", "rescheduled_to_id?", "limit?", "offset?"]
    output: "SiteDayAssignment[]"
    side_effects: []
  - method: GET
    path: "/api/site-days/{id}"
    description: "Get a site day"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: SiteDayAssignment
    side_effects: []
  - method: POST
    path: "/api/site-days/{id}/depart"
    description: "SCHEDULED -> EN_ROUTE; dispatches PLANNED transport legs"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: SiteDayAssignment
    side_effects: ["status -> EN_ROUTE", "TransportLegs PLANNED -> DISPATCHED"]
  - method: POST
    path: "/api/site-days/{id}/begin-setup"
    description: "EN_ROUTE -> SETTING_UP; requires all legs ARRIVED"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: SiteDayAssignment
    side_effects: ["status -> SETTING_UP"]
  - method: POST
    path: "/api/site-days/{id}/mark-ready"
    description: "SETTING_UP -> READY; requires checklist ALL_PASSED, measured_amps >= required, accreditation valid"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: SiteDayAssignment
    side_effects: ["status -> READY"]
  - method: POST
    path: "/api/site-days/{id}/start-service"
    description: "READY -> IN_SERVICE; requires >= 1 ASSIGNED technologist"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: SiteDayAssignment
    side_effects: ["status -> IN_SERVICE"]
  - method: POST
    path: "/api/site-days/{id}/complete"
    description: "IN_SERVICE -> COMPLETED; all appointments terminal; auto-creates PROVISIONAL billing statement"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: SiteDayAssignment
    side_effects: ["status -> COMPLETED", "delivered_service_minutes = full window", "staffing RELEASED (DAY_COMPLETED)", "BillingStatement auto-created (PROVISIONAL)"]
  - method: POST
    path: "/api/site-days/{id}/cancel"
    description: "SCHEDULED/EN_ROUTE -> CANCELLED; cascades to appointments/staffing/legs; fee per contract notice"
    roles: [OperationsDirector, FacilityCoordinator]
    code: 200
    input: [notice_hours]
    output: SiteDayAssignment
    side_effects: ["status -> CANCELLED", "appointments -> CANCELLED (DAY_CANCELLED)", "staffing RELEASED (DAY_CANCELLED)", "legs PLANNED -> CANCELLED, DISPATCHED -> FAILED", "BillingStatement auto-created with cancellation fee"]
  - method: POST
    path: "/api/site-days/{id}/interrupt"
    description: "SETTING_UP/READY/IN_SERVICE -> INTERRUPTED (operator-initiated, e.g., site power failure)"
    roles: [OperationsDirector]
    code: 200
    input: [reason]
    output: SiteDayAssignment
    side_effects: ["status -> INTERRUPTED", "delivered_service_minutes computed from clock", "appointments -> CANCELLED (DAY_INTERRUPTED)", "staffing RELEASED (DAY_INTERRUPTED)", "legs DISPATCHED -> FAILED", "BillingStatement auto-created (PROVISIONAL)"]
  - method: POST
    path: "/api/site-days/{id}/reschedule"
    description: "INTERRUPTED -> RESCHEDULED; creates replacement day in a target PUBLISHED plan of the same unit. OCC on target plan.version."
    roles: [OperationsDirector]
    code: 200
    input: [target_route_plan_id, expected_route_plan_version, new_service_date, new_arrival_time, new_first_patient_time, new_last_patient_time, new_departure_time]
    output: SiteDayAssignment
    side_effects: ["source -> RESCHEDULED, rescheduled_to_id set", "replacement SiteDayAssignment created SCHEDULED with rescheduled_from_id = source", "increments target RoutePlan.version by 1", "credit carry-over linkage recorded"]

