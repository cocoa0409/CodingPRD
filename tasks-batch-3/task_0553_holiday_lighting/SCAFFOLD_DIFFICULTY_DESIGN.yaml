              as: BillingAdmin
              captures: { sr1: $.data.id }
          trigger:
            - call: "POST /storage-records"
              payload: { contract_id: "${contract_id}", storage_bin_id: "${bin_id}", stored_from: "2026-03-05T00:00:00Z", stored_until: "2026-04-01T00:00:00Z" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_BIN_OCCUPIED"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: routeday_booked_stops_conserved
        grounds:
          - state_machines.RouteAssignment.BOOKED_to_RELEASED
          - state_machines.Job.SCHEDULED_to_CANCELLED
          - entities.RouteDay.fields.booked_stops
        distinguishing_aspect: |
          Conserved quantity is the integer count RouteDay.booked_stops == |{RouteAssignment: route_day_id==rd
          AND status IN {BOOKED,DISPATCHED}}|. The forward booking (+1 -> 1) and its compensating release via
          job cancel (-1 -> 0) leave booked_stops back at its pre-booking value 0, with no drift.
        test_recipe:
          setup:
            - "An ACTIVE contract; a SCHEDULED job booked (BOOKED) onto a route day (booked_stops 1)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Ron Owner", service_address: "18 Quay St", roofline_feet: 115 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL", scheduled_date: "2026-12-02T09:00:00Z" }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew G", home_zone: "S", daily_stop_capacity: 5 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /route-days"
              payload: { crew_id: "${crew_id}", service_date: "2026-12-02T00:00:00Z", zone: "S", max_stops: 5 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-assignments"
              payload: { route_day_id: "${rd_id}", job_id: "${job_id}", window_start: "2026-12-02T09:00:00Z", window_end: "2026-12-02T11:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
          assert:
            - "RouteAssignment.${ra_id}.status == RELEASED"
            - "RouteDay.${rd_id}.booked_stops == 0"

      - name: financing_principal_conserved
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - entities.FinancingPlan.fields.remaining_principal_cents
          - entities.Payment.fields.principal_portion_cents
        distinguishing_aspect: |
          Conserved quantity is money — FinancingPlan.remaining_principal_cents + sum(principal_portion_cents of
          POSTED Payments) == original_principal_cents (1200000). A payment (-100000 principal) and its reversal
          (+100000) restore remaining_principal_cents to 1200000 with zero drift; a different conserved-quantity
          type than the booked_stops count invariant.
        test_recipe:
          setup:
            - "A PERMANENT_PURCHASE contract ACTIVE; a plan (principal 1200000, apr 1000, term 12) with one payment of 110000 POSTED (remaining 1100000, principal_portion 100000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Sue Owner", service_address: "19 Slip St", roofline_feet: 210 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "PERMANENT_PURCHASE", season_year: 2026, base_season_fee_cents: 80000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /financing-plans"
              payload: { contract_id: "${contract_id}", original_principal_cents: 1200000, apr_bps: 1000, term_months: 12 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /financing-plans/${plan_id}/payments"
              payload: { amount_cents: 110000 }
              as: BillingAdmin
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: BillingAdmin
          assert:
            - "Payment.${pay_id}.status == REVERSED"
            - "FinancingPlan.${plan_id}.remaining_principal_cents == 1200000"
