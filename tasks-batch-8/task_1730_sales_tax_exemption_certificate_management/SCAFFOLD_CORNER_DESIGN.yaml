              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /tenants/${tid}/customers/${cid}/complete_onboarding"
              payload: {}
              as: ComplianceOfficer
              captures: { cv1: $.data.version }
            - call: "POST /tenants/${tid}/customers/${cid}/certificates"
              payload: { ship_to_state: "TX", form_type: "RESALE", exemption_reason_code: "RES", state_registration_number: "", signed_date: "2026-01-01", effective_date: "2026-01-01" }
