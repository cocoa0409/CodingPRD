              as: ResearchOps
              captures: { rating9_id: $.data.id }
            - call: "POST /research/ratings/${rating9_id}/publish"
              payload: {}
              as: ResearchOps
            - call: "POST /research/licensees"
              payload: { licensee_name: "Index Licensee" }
              as: LicenseAdmin
              captures: { li_id: $.data.id }
            - call: "POST /research/license-agreements"
