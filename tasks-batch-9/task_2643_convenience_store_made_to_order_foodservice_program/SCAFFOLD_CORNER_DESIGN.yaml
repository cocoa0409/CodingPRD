            - "${tot} == 5894"
            - "${pts} == 58"
            - "${dp} == LUNCH"
            - "Order.${order_id}.subtotal_gross_cents == 5394"
            - "Order.${order_id}.promo_discount_cents == 0"
            - "Order.${order_id}.applied_promotion_id == null"
            - "Order.${order_id}.settlement_status == UNPAID"

      - name: unpublished_plan_error_wins_over_the_catering_minimum_error
        claim_type: priority_ordering
        grounds:
