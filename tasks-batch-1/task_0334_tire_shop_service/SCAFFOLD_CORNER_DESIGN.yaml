              payload: { brand: "MICHELIN", model_name: "PRIMACY", size_token: "235/45R18", load_index: 94, speed_rating: "V", unit_price_cents: 10000, mileage_warranty_miles: 60000, original_tread_32nds: 10, stock_qty: 8 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
