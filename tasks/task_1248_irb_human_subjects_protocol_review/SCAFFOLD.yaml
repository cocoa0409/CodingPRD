# =============================================================================
# Task 1248: IRB Human Subjects Protocol Review — scaffold seed tables
# =============================================================================

scenario: |
  1248. IRB Human Subjects Protocol Review (university institutional review board): submission & determination (exempt/expedited/full board), reviewer assignment & conflict management, informed-consent document review & waiver criteria, convened meeting agenda & quorum, modification & continuing review cadence, adverse event/unanticipated problem reporting, non-compliance investigation & suspension, reliance agreements for multi-site studies

domain_name: irb-protocol-review
api_prefix: /irb

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Investigator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Investigator full name" }
      - { name: email, type: string, source: input, description: "Unique institutional email", constraints: "unique across Investigator" }
      - { name: department, type: string, source: input, description: "Academic department" }
      - { name: training_expires_at, type: datetime, source: input, description: "Human-subjects training certificate expiry (ISO8601 UTC); must be strictly after current logical time to submit" }
      - { name: provisional_compliance_score, type: integer, source: computed, default: 100, description: "Gate score: 100 - 20*confirmed_findings - 5*open_cases - 8*late_unfiled_AEs (see calculations.compliance_score)" }
      - { name: final_compliance_score, type: integer, source: computed, default: 100, description: "Adjudicated score: 100 - 20*confirmed_findings only; < 60 flips status to DEBARRED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DEBARRED; DEBARRED set by system when final_compliance_score < 60", constraints: "enum: ACTIVE, DEBARRED" }

  - name: IrbMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Unique member email", constraints: "unique across IrbMember" }
      - { name: member_category, type: enum, source: input, description: "Quorum composition category", constraints: "enum: SCIENTIST, NON_SCIENTIST, UNAFFILIATED, PRISONER_REPRESENTATIVE" }
      - { name: is_chair, type: boolean, source: input, default: false, description: "True for the IRB chair (required to act as IrbChair role)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE; only ACTIVE members count toward quorum base and are assignable", constraints: "enum: ACTIVE, INACTIVE" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "= count of this member's ReviewAssignment rows with status in {OFFERED, ACCEPTED}; maintained by assignment lifecycle side effects" }

  - name: Protocol
    parent: null
    common_fields: true
    fields:
      - { name: pi_id, type: string, source: system, description: "FK -> Investigator.id; set from X-User-ID of the PrincipalInvestigator caller at creation" }
      - { name: title, type: string, source: input, description: "Protocol title" }
      - { name: claimed_review_level, type: enum, source: input, description: "PI-requested review level", constraints: "enum: EXEMPT, EXPEDITED, FULL_BOARD" }
      - { name: risk_level, type: enum, source: input, description: "MINIMAL | GREATER_THAN_MINIMAL; drives continuing-review interval and EXEMPT eligibility", constraints: "enum: MINIMAL, GREATER_THAN_MINIMAL" }
      - { name: involves_prisoners, type: boolean, source: input, default: false, description: "When true, any convened meeting deliberating this protocol requires a PRISONER_REPRESENTATIVE attendee" }
      - { name: is_industry_sponsored, type: boolean, source: input, default: false, description: "Applies INDUSTRY_MULTIPLIER to review fee lines" }
      - { name: determined_review_level, type: enum, source: system, description: "Coordinator determination; null until determination", constraints: "enum: EXEMPT, EXPEDITED, FULL_BOARD" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Provisional invoice computed at first submit from claimed_review_level; see calculations.review_fee" }
      - { name: settled_fee_cents, type: integer, source: computed, description: "Settled assessment: base by determined_review_level at determination plus per-reliance surcharges at each reliance execute; see calculations.review_fee" }
      - { name: fee_delta_cents, type: integer, source: computed, description: "= settled_fee_cents - provisional_fee_cents (recomputed whenever settled changes)" }
      - { name: approval_expires_at, type: datetime, source: system, description: "Set on entry to APPROVED = approval instant + continuing_review_interval_days; null for EXEMPT_ACTIVE" }
      - { name: continuing_review_interval_days, type: integer, source: system, description: "180 when risk_level == GREATER_THAN_MINIMAL else 365; null while not approved" }
      - { name: pre_suspension_state, type: enum, source: system, description: "State captured when SUSPENDED (APPROVED or EXEMPT_ACTIVE); reinstatement returns here", constraints: "enum: APPROVED, EXEMPT_ACTIVE" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle; see state_machines.Protocol", constraints: "enum: DRAFT, SUBMITTED, RETURNED, UNDER_EXPEDITED_REVIEW, AWAITING_FULL_BOARD, CHANGES_REQUESTED, BOARD_CHANGES_REQUESTED, EXEMPT_ACTIVE, APPROVED, SUSPENDED, EXPIRED, DISAPPROVED, WITHDRAWN, CLOSED" }

  - name: ConsentDocument
    parent: null
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id; from path" }
      - { name: version_seq, type: integer, source: system, description: "Per-protocol increasing sequence: 1 + max(existing version_seq for protocol)" }
      - { name: file_ref, type: string, source: input, description: "Document storage reference" }
      - { name: waiver_type, type: enum, source: input, default: NONE, description: "Requested consent waiver", constraints: "enum: NONE, WAIVER_OF_CONSENT, WAIVER_OF_DOCUMENTATION, ALTERATION_OF_CONSENT" }
      - { name: waiver_criterion_minimal_risk, type: boolean, source: input, default: false, description: "45 CFR 46.116(f)(1): research involves no more than minimal risk" }
      - { name: waiver_criterion_rights_not_adversely_affected, type: boolean, source: input, default: false, description: "45 CFR 46.116(f)(2): waiver does not adversely affect rights/welfare" }
      - { name: waiver_criterion_impracticable_without_waiver, type: boolean, source: input, default: false, description: "45 CFR 46.116(f)(3): research not practicable without the waiver" }
      - { name: waiver_criterion_debrief_when_appropriate, type: boolean, source: input, default: false, description: "45 CFR 46.116(f)(4): subjects debriefed when appropriate" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | SUPERSEDED | CHANGES_REQUIRED; at most one APPROVED per protocol", constraints: "enum: SUBMITTED, APPROVED, SUPERSEDED, CHANGES_REQUIRED" }

  - name: ReviewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id; from path" }
      - { name: reviewer_id, type: string, source: system, description: "FK -> IrbMember.id; from input reviewer_id or auto-selection" }
      - { name: reviewer_role, type: enum, source: input, default: SECONDARY, description: "Assignment seniority", constraints: "enum: PRIMARY, SECONDARY" }
      - { name: offered_at, type: datetime, source: system, description: "Logical-clock instant of creation" }
      - { name: response_deadline_at, type: datetime, source: system, description: "= offered_at + ASSIGNMENT_RESPONSE_WINDOW_DAYS (7)" }
      - { name: recommendation, type: enum, source: system, description: "Submitted recommendation; null until SUBMITTED", constraints: "enum: APPROVE, MINOR_REVISIONS, MAJOR_REVISIONS, DISAPPROVE" }
      - { name: recommendation_voided, type: boolean, source: computed, default: false, description: "Set true when a CONFLICTED adjudication lands on a SUBMITTED assignment; voided recommendations are excluded from expedited completeness" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "OFFERED | ACCEPTED | DECLINED | RECUSED | EXPIRED | SUBMITTED", constraints: "enum: OFFERED, ACCEPTED, DECLINED, RECUSED, EXPIRED, SUBMITTED" }

  - name: ConflictDeclaration
    parent: null
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id; from path" }
      - { name: reviewer_id, type: string, source: system, description: "FK -> IrbMember.id; set from X-User-ID of the Reviewer caller" }
      - { name: declaration_type, type: enum, source: input, description: "Nature of conflict (NONE = affirmative no-conflict)", constraints: "enum: NONE, FINANCIAL, PERSONAL, SCIENTIFIC" }
      - { name: detail, type: string, source: input, description: "Free-text detail" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | CLEARED | CONFLICTED", constraints: "enum: PENDING_REVIEW, CLEARED, CONFLICTED" }

  - name: BoardMeeting
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "Physical/virtual room identifier; half-open occupation [scheduled_at, scheduled_at + duration_minutes)" }
      - { name: scheduled_at, type: datetime, source: input, description: "Meeting start (ISO8601 UTC); must be strictly after current logical time at creation" }
      - { name: duration_minutes, type: integer, source: input, description: "Planned duration; room occupation end = scheduled_at + duration_minutes" }
      - { name: attendee_member_ids, type: array, source: system, description: "Member ids recorded at convene; basis for quorum and vote eligibility" }
      - { name: quorum_threshold, type: integer, source: computed, description: "= floor(count(IrbMember status==ACTIVE)/2) + 1, snapshot at successful convene" }
      - { name: item_count, type: integer, source: computed, default: 0, description: "= count of AgendaItem rows with meeting_id == this and status == LISTED" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | CONVENED | ADJOURNED | CANCELLED | FAILED_QUORUM", constraints: "enum: SCHEDULED, CONVENED, ADJOURNED, CANCELLED, FAILED_QUORUM" }

  - name: AgendaItem
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: system, description: "FK -> BoardMeeting.id; from path" }
      - { name: protocol_id, type: string, source: input, description: "FK -> Protocol.id; protocol under deliberation" }
      - { name: modification_id, type: string, source: input, description: "FK -> ModificationRequest.id; present when the item deliberates a MAJOR modification, else null" }
      - { name: priority_class, type: enum, source: system, description: "Derived at listing time: SUSPENSION_REVIEW if protocol in {SUSPENDED, EXPIRED}, else MODIFICATION if modification_id set, else INITIAL_REVIEW", constraints: "enum: SUSPENSION_REVIEW, INITIAL_REVIEW, MODIFICATION" }
      - { name: votes_for, type: integer, source: system, description: "Recorded tally; null until VOTED" }
      - { name: votes_against, type: integer, source: system, description: "Recorded tally; null until VOTED" }
      - { name: votes_abstain, type: integer, source: system, description: "Recorded tally; null until VOTED" }
      - { name: eligible_voter_count, type: integer, source: computed, description: "= |meeting.attendee_member_ids| - |attendees holding a CONFLICTED ConflictDeclaration on this protocol|; snapshot at vote" }
      - { name: outcome, type: enum, source: system, description: "APPROVE | DISAPPROVE | REQUIRE_CHANGES | DEFER; null until VOTED", constraints: "enum: APPROVE, DISAPPROVE, REQUIRE_CHANGES, DEFER" }
      - { name: status, type: enum, source: system, default: LISTED, description: "LISTED | VOTED | DEFERRED | REMOVED", constraints: "enum: LISTED, VOTED, DEFERRED, REMOVED" }

  - name: ModificationRequest
    parent: null
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id; from path" }
      - { name: scope, type: enum, source: input, description: "MINOR = chair-adjudicable; MAJOR = requires convened-board vote", constraints: "enum: MINOR, MAJOR" }
      - { name: description, type: string, source: input, description: "Amendment description" }
      - { name: new_consent_document_id, type: string, source: input, description: "FK -> ConsentDocument.id; optional replacement consent to be approved atomically with the modification" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | DENIED", constraints: "enum: SUBMITTED, APPROVED, DENIED" }

  - name: ContinuingReview
    parent: null
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id" }
      - { name: cycle_index, type: integer, source: system, description: "1 for the cycle created at initial approval; +1 per approved cycle" }
      - { name: due_at, type: datetime, source: system, description: "= protocol approval instant + continuing_review_interval_days (cycle 1) or adjudication instant + interval (later cycles)" }
      - { name: window_opens_at, type: datetime, source: system, description: "= due_at - CR_SUBMISSION_WINDOW_DAYS (60); submit before this is rejected" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical instant of latest submit; null until first submit" }
      - { name: status, type: enum, source: system, default: PENDING_SUBMISSION, description: "PENDING_SUBMISSION | SUBMITTED | CHANGES_REQUESTED | APPROVED | LAPSED", constraints: "enum: PENDING_SUBMISSION, SUBMITTED, CHANGES_REQUESTED, APPROVED, LAPSED" }

  - name: AdverseEventReport
    parent: null
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id; from path" }
      - { name: event_type, type: enum, source: input, description: "SERIOUS_ADVERSE_EVENT | UNANTICIPATED_PROBLEM use a 5-day window; PROTOCOL_DEVIATION_WITH_HARM uses 15 days", constraints: "enum: SERIOUS_ADVERSE_EVENT, UNANTICIPATED_PROBLEM, PROTOCOL_DEVIATION_WITH_HARM" }
      - { name: occurred_at, type: datetime, source: input, description: "When the event occurred (ISO8601 UTC); must be <= current logical time" }
      - { name: description, type: string, source: input, description: "Event narrative" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock instant of report creation" }
      - { name: deadline_at, type: datetime, source: computed, description: "= occurred_at + AE_REPORT_WINDOW_DAYS(event_type)" }
      - { name: is_late, type: boolean, source: computed, description: "= reported_at > deadline_at (strictly greater; exactly at deadline is on time)" }
      - { name: triage_note, type: string, source: input, description: "Optional note recorded at triage" }
      - { name: action_type, type: enum, source: system, description: "Set when CLOSED_WITH_ACTION: REQUIRE_MODIFICATION | SUSPEND_PROTOCOL", constraints: "enum: REQUIRE_MODIFICATION, SUSPEND_PROTOCOL" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | TRIAGED | CLOSED_NO_ACTION | CLOSED_WITH_ACTION", constraints: "enum: FILED, TRIAGED, CLOSED_NO_ACTION, CLOSED_WITH_ACTION" }

  - name: NonComplianceCase
    parent: null
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id" }
      - { name: source, type: enum, source: system, description: "LATE_AE (triage of a late report) | LAPSED_CR (clock sweep) | AE_ACTION (disposition SUSPEND_PROTOCOL) | MANUAL (officer-created)", constraints: "enum: LATE_AE, LAPSED_CR, AE_ACTION, MANUAL" }
      - { name: reason, type: string, source: input, description: "Required for MANUAL creation" }
      - { name: opened_at, type: datetime, source: system, description: "Logical instant of opening" }
      - { name: finding_confirmed, type: boolean, source: system, description: "Set at issue-finding; null until then" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED | INVESTIGATION | FINDING_CONFIRMED | FINDING_NOT_CONFIRMED | CLOSED", constraints: "enum: OPENED, INVESTIGATION, FINDING_CONFIRMED, FINDING_NOT_CONFIRMED, CLOSED" }

  - name: RelianceAgreement
    parent: null
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: input, description: "FK -> Protocol.id; multi-site study" }
      - { name: ceding_institution_code, type: string, source: input, description: "Institution ceding review to this IRB" }
      - { name: reviewing_institution_code, type: string, source: input, description: "Institution providing review (this IRB's code for inbound reliance)" }
      - { name: effective_start_date, type: datetime, source: input, description: "Inclusive window start (date-precision, closed interval)" }
      - { name: effective_end_date, type: datetime, source: input, description: "Inclusive window end; must be >= effective_start_date" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | EXECUTED | SUSPENDED | TERMINATED", constraints: "enum: PROPOSED, EXECUTED, SUSPENDED, TERMINATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Protocol
    initial_state: DRAFT
    terminal_states: [DISAPPROVED, WITHDRAWN, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /irb/protocols/{id}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Caller owns protocol (pi_id == X-User-ID) else ERR_FORBIDDEN"
          - "investigator.status != DEBARRED else ERR_INVESTIGATOR_DEBARRED"
          - "investigator.training_expires_at > current logical time else ERR_PI_TRAINING_LAPSED"
          - "investigator.provisional_compliance_score >= 60 else ERR_COMPLIANCE_SCORE_TOO_LOW"
          - ">=1 ConsentDocument for protocol with status in {SUBMITTED, APPROVED} else ERR_NO_CONSENT_DOCUMENT"
        side_effects:
          - "First submit only: provisional_fee_cents := review_fee(provisional variant) using claimed_review_level"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /irb/protocols/{id}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Same caller/training/consent preconditions as DRAFT->SUBMITTED"
        side_effects:
          - "provisional_fee_cents unchanged (computed once at first submit)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /irb/protocols/{id}/return"
        actor: IrbCoordinator
        preconditions:
          - "Protocol in SUBMITTED else ERR_INVALID_STATE"
        side_effects: []
      - from: SUBMITTED
        to: EXEMPT_ACTIVE
        trigger: "POST /irb/protocols/{id}/determinations with determined_review_level=EXEMPT"
        actor: IrbCoordinator
        preconditions:
          - "Protocol in SUBMITTED else ERR_INVALID_STATE"
          - "risk_level == MINIMAL else ERR_EXEMPT_REQUIRES_MINIMAL_RISK"
        side_effects:
          - "determined_review_level := EXEMPT"
          - "settled_fee_cents := review_fee(settled variant base, EXEMPT); fee_delta_cents := settled - provisional"
          - "No ContinuingReview is created (exempt studies have no continuing-review cadence); approval_expires_at stays null"
      - from: SUBMITTED
        to: UNDER_EXPEDITED_REVIEW
        trigger: "POST /irb/protocols/{id}/determinations with determined_review_level=EXPEDITED"
        actor: IrbCoordinator
        preconditions:
          - "Protocol in SUBMITTED else ERR_INVALID_STATE"
        side_effects:
          - "determined_review_level := EXPEDITED; settled_fee_cents := review_fee settled base; fee_delta_cents updated"
      - from: SUBMITTED
        to: AWAITING_FULL_BOARD
        trigger: "POST /irb/protocols/{id}/determinations with determined_review_level=FULL_BOARD"
        actor: IrbCoordinator
        preconditions:
          - "Protocol in SUBMITTED else ERR_INVALID_STATE"
        side_effects:
          - "determined_review_level := FULL_BOARD; settled_fee_cents := review_fee settled base; fee_delta_cents updated"
      - from: UNDER_EXPEDITED_REVIEW
        to: APPROVED
        trigger: "POST /irb/protocols/{id}/expedited-determination with outcome=APPROVE"
        actor: IrbChair
        preconditions:
          - "Protocol in UNDER_EXPEDITED_REVIEW else ERR_INVALID_STATE"
          - "Chair holds no CONFLICTED ConflictDeclaration on this protocol else ERR_CHAIR_CONFLICTED"
          - ">=2 ReviewAssignment rows with status SUBMITTED and recommendation_voided == false else ERR_INSUFFICIENT_RECOMMENDATIONS"
          - "No non-voided SUBMITTED recommendation == DISAPPROVE else ERR_EXPEDITED_DISAPPROVE_REQUIRES_BOARD"
          - ">=1 ConsentDocument with status APPROVED else ERR_NO_APPROVED_CONSENT"
        side_effects:
          - "status := APPROVED; continuing_review_interval_days := 180 if risk_level==GREATER_THAN_MINIMAL else 365"
          - "approval_expires_at := current logical time + continuing_review_interval_days"
          - "Create ContinuingReview cycle_index=1 with due_at = approval_expires_at, window_opens_at = due_at - 60 days, status PENDING_SUBMISSION"
      - from: UNDER_EXPEDITED_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /irb/protocols/{id}/expedited-determination with outcome=REQUIRE_CHANGES"
        actor: IrbChair
        preconditions:
          - "Protocol in UNDER_EXPEDITED_REVIEW else ERR_INVALID_STATE"
          - ">=1 non-voided SUBMITTED recommendation else ERR_INSUFFICIENT_RECOMMENDATIONS"
        side_effects: []
      - from: CHANGES_REQUESTED
        to: UNDER_EXPEDITED_REVIEW
        trigger: "POST /irb/protocols/{id}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Same caller/training/consent preconditions as DRAFT->SUBMITTED"
        side_effects: []
      - from: UNDER_EXPEDITED_REVIEW
        to: AWAITING_FULL_BOARD
        trigger: "POST /irb/protocols/{id}/expedited-determination with outcome=REFER_TO_FULL_BOARD"
        actor: IrbChair
        preconditions:
          - "Protocol in UNDER_EXPEDITED_REVIEW else ERR_INVALID_STATE"
        side_effects: []
        note: "Expedited review cannot disapprove; DISAPPROVE recommendations force referral"
      - from: AWAITING_FULL_BOARD
        to: APPROVED
        trigger: "POST /irb/agenda-items/{id}/vote where the item's protocol is this protocol and the motion passes"
        actor: IrbChair
        preconditions:
          - "Item LISTED, meeting CONVENED, tally == eligible_voter_count, votes_for*2 > eligible_voter_count, motion == APPROVE"
          - ">=1 ConsentDocument with status APPROVED else ERR_NO_APPROVED_CONSENT"
        side_effects:
          - "Same approval side effects as expedited APPROVE (interval, expiry, ContinuingReview creation)"
      - from: AWAITING_FULL_BOARD
        to: DISAPPROVED
        trigger: "POST /irb/agenda-items/{id}/vote with motion=APPROVE that fails (votes_for*2 <= eligible_voter_count)"
        actor: IrbChair
        preconditions:
          - "Item LISTED, meeting CONVENED, tally valid"
        side_effects: []
        note: "Only a convened board may disapprove a protocol"
      - from: AWAITING_FULL_BOARD
        to: BOARD_CHANGES_REQUESTED
        trigger: "POST /irb/agenda-items/{id}/vote with motion=REQUIRE_CHANGES that passes"
        actor: IrbChair
        preconditions:
          - "Item LISTED, meeting CONVENED, tally valid, votes_for*2 > eligible_voter_count"
        side_effects: []
      - from: BOARD_CHANGES_REQUESTED
        to: AWAITING_FULL_BOARD
        trigger: "POST /irb/protocols/{id}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Same caller/training/consent preconditions as DRAFT->SUBMITTED"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "system side effect of POST /irb/non-compliance-cases/{id}/issue-finding finding=CONFIRMED, or POST /irb/adverse-events/{id}/disposition action_type=SUSPEND_PROTOCOL"
        actor: system
        preconditions:
          - "Protocol in APPROVED or EXEMPT_ACTIVE (other states record the finding without suspension)"
        side_effects:
          - "pre_suspension_state := APPROVED (or EXEMPT_ACTIVE); status := SUSPENDED"
          - "Every RelianceAgreement of this protocol in EXECUTED -> SUSPENDED (link 2a)"
          - "Every AgendaItem of this protocol in LISTED on a meeting in SCHEDULED -> REMOVED; meeting.item_count recomputed (link 2b)"
          - "Any meeting whose item_count falls to 0 via those removals -> CANCELLED (link 3)"
      - from: EXEMPT_ACTIVE
        to: SUSPENDED
        trigger: "system side effect of issue-finding CONFIRMED / AE disposition SUSPEND_PROTOCOL"
        actor: system
        preconditions:
          - "Protocol in APPROVED or EXEMPT_ACTIVE"
        side_effects:
          - "pre_suspension_state := EXEMPT_ACTIVE; same reliance/agenda cascades as APPROVED->SUSPENDED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /irb/protocols/{id}/reinstate"
        actor: IrbChair
        preconditions:
          - "Protocol in SUSPENDED else ERR_INVALID_STATE"
          - "pre_suspension_state == APPROVED"
          - "No NonComplianceCase for this protocol in {OPENED, INVESTIGATION, FINDING_CONFIRMED} else ERR_OPEN_CASES_REMAIN"
        side_effects:
          - "status := APPROVED; pre_suspension_state := null"
          - "Every RelianceAgreement of this protocol in SUSPENDED -> EXECUTED (compensation of the suspension cascade)"
          - "Removed AgendaItems are NOT restored (asymmetric compensation; coordinator may re-list)"
      - from: SUSPENDED
        to: EXEMPT_ACTIVE
        trigger: "POST /irb/protocols/{id}/reinstate"
        actor: IrbChair
        preconditions:
          - "Protocol in SUSPENDED; pre_suspension_state == EXEMPT_ACTIVE; no open cases (ERR_OPEN_CASES_REMAIN)"
        side_effects:
          - "status := EXEMPT_ACTIVE; reliance SUSPENDED -> EXECUTED"
      - from: APPROVED
        to: EXPIRED
        trigger: "system clock sweep: current time > approval_expires_at while protocol APPROVED"
        actor: system
        preconditions:
          - "Protocol APPROVED and approval_expires_at < current logical time"
        side_effects:
          - "status := EXPIRED (enrollment must halt)"
          - "Open NonComplianceCase source=LAPSED_CR status=OPENED (link 2 of the lapse cascade)"
          - "Investigator provisional_compliance_score recomputed (open case -5) (link 3)"
      - from: EXPIRED
        to: APPROVED
        trigger: "POST /irb/continuing-reviews/{id}/adjudicate outcome=APPROVE on this protocol's LAPSED ContinuingReview"
        actor: IrbChair
        preconditions:
          - "ContinuingReview LAPSED; protocol EXPIRED"
        side_effects:
          - "status := APPROVED; approval_expires_at := adjudication instant + continuing_review_interval_days"
          - "New ContinuingReview cycle created (cycle_index+1) PENDING_SUBMISSION"
          - "The LAPSED_CR NonComplianceCase remains OPENED until investigated and closed"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /irb/protocols/{id}/close"
        actor: PrincipalInvestigator
        preconditions:
          - "Protocol in APPROVED or EXEMPT_ACTIVE else ERR_INVALID_STATE"
          - "Caller owns protocol else ERR_FORBIDDEN"
          - "No NonComplianceCase in {OPENED, INVESTIGATION, FINDING_CONFIRMED} else ERR_OPEN_CASES_REMAIN"
        side_effects:
          - "Any ContinuingReview in {PENDING_SUBMISSION, SUBMITTED, CHANGES_REQUESTED} -> terminal (no further sweep action; treated as moot)"
      - from: EXEMPT_ACTIVE
        to: CLOSED
        trigger: "POST /irb/protocols/{id}/close"
        actor: PrincipalInvestigator
        preconditions:
          - "Same as APPROVED->CLOSED"
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /irb/protocols/{id}/withdraw"
        actor: PrincipalInvestigator
        preconditions:
          - "Protocol in {DRAFT, SUBMITTED, RETURNED} else ERR_INVALID_STATE; caller owns protocol"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /irb/protocols/{id}/withdraw"
        actor: PrincipalInvestigator
        preconditions:
          - "Protocol in {DRAFT, SUBMITTED, RETURNED}"
        side_effects: []
      - from: RETURNED
        to: WITHDRAWN
        trigger: "POST /irb/protocols/{id}/withdraw"
        actor: PrincipalInvestigator
        preconditions:
          - "Protocol in {DRAFT, SUBMITTED, RETURNED}"
        side_effects: []

  - entity: ConsentDocument
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, CHANGES_REQUIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /irb/consent-documents/{id}/review outcome=APPROVE, or system side effect of ModificationRequest approval carrying new_consent_document_id"
        actor: IrbChair
        preconditions:
          - "Document SUBMITTED else ERR_INVALID_STATE"
          - "If waiver_type != NONE: all four waiver_criterion_* flags true else ERR_WAIVER_CRITERIA_NOT_MET"
        side_effects:
          - "Any other ConsentDocument of the same protocol in APPROVED -> SUPERSEDED (invariant: count(APPROVED docs per protocol) stays constant at 1 when one was already APPROVED)"
      - from: SUBMITTED
        to: CHANGES_REQUIRED
        trigger: "POST /irb/consent-documents/{id}/review outcome=REQUIRE_CHANGES"
        actor: IrbChair
        preconditions:
          - "Document SUBMITTED"
        side_effects: []
        note: "CHANGES_REQUIRED is terminal for that version; the PI uploads a new ConsentDocument row (version_seq+1)"

  - entity: ReviewAssignment
    initial_state: OFFERED
    terminal_states: [DECLINED, RECUSED, EXPIRED, SUBMITTED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /irb/review-assignments/{id}/respond response=ACCEPT"
        actor: Reviewer
        preconditions:
          - "Assignment OFFERED else ERR_INVALID_STATE; X-User-ID == reviewer_id else ERR_FORBIDDEN"
          - "Reviewer holds no CONFLICTED declaration on the protocol else ERR_REVIEWER_CONFLICTED (auto-recusal fires first at adjudication time)"
        side_effects:
          - "IrbMember.active_assignment_count unchanged (OFFERED and ACCEPTED both count)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /irb/review-assignments/{id}/respond response=DECLINE"
        actor: Reviewer
        preconditions:
          - "Assignment OFFERED; caller is the reviewer"
        side_effects:
          - "IrbMember.active_assignment_count -= 1"
      - from: OFFERED
        to: RECUSED
        trigger: "POST /irb/review-assignments/{id}/respond response=RECUSE, or system side effect of ConflictDeclaration adjudicated CONFLICTED"
        actor: Reviewer
        preconditions:
          - "Assignment OFFERED (or ACCEPTED for the system recusal)"
        side_effects:
          - "IrbMember.active_assignment_count -= 1"
      - from: ACCEPTED
        to: RECUSED
        trigger: "system side effect of ConflictDeclaration adjudicated CONFLICTED"
        actor: system
        preconditions:
          - "Assignment ACCEPTED and reviewer has newly-CONFLICTED declaration on the protocol"
        side_effects:
          - "IrbMember.active_assignment_count -= 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "system clock sweep: current time > response_deadline_at while OFFERED"
        actor: system
        preconditions:
          - "Assignment OFFERED and response_deadline_at < current logical time"
        side_effects:
          - "IrbMember.active_assignment_count -= 1"
      - from: ACCEPTED
        to: SUBMITTED
        trigger: "POST /irb/review-assignments/{id}/recommendations"
        actor: Reviewer
        preconditions:
          - "Assignment ACCEPTED else ERR_INVALID_STATE; caller is the reviewer"
          - "Protocol in {UNDER_EXPEDITED_REVIEW, AWAITING_FULL_BOARD} else ERR_INVALID_STATE"
        side_effects:
          - "recommendation stored; IrbMember.active_assignment_count -= 1"

  - entity: ConflictDeclaration
    initial_state: PENDING_REVIEW
    terminal_states: [CLEARED, CONFLICTED]
    transitions:
      - from: PENDING_REVIEW
        to: CLEARED
        trigger: "POST /irb/conflict-declarations/{id}/adjudicate outcome=CLEARED"
        actor: IrbChair
        preconditions:
          - "Declaration PENDING_REVIEW else ERR_INVALID_STATE"
        side_effects: []
      - from: PENDING_REVIEW
        to: CONFLICTED
        trigger: "POST /irb/conflict-declarations/{id}/adjudicate outcome=CONFLICTED"
        actor: IrbChair
        preconditions:
          - "Declaration PENDING_REVIEW"
        side_effects:
          - "Every ReviewAssignment of this reviewer on this protocol in {OFFERED, ACCEPTED} -> RECUSED; active_assignment_count decremented per recusal"
          - "Every SUBMITTED assignment of this reviewer on this protocol: recommendation_voided := true (recommendation excluded from expedited completeness and vote eligibility)"

  - entity: BoardMeeting
    initial_state: SCHEDULED
    terminal_states: [ADJOURNED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONVENED
        trigger: "POST /irb/board-meetings/{id}/convene"
        actor: IrbChair
        preconditions:
          - "Meeting SCHEDULED else ERR_INVALID_STATE"
          - "Every attendee_member_id resolves to an IrbMember with status ACTIVE else ERR_ATTENDEE_NOT_ELIGIBLE"
          - "|attendee_member_ids| >= floor(count(ACTIVE members)/2)+1 else ERR_QUORUM_NOT_MET"
          - ">=1 attendee NON_SCIENTIST and >=1 attendee UNAFFILIATED; if any LISTED item's protocol has involves_prisoners then >=1 attendee PRISONER_REPRESENTATIVE; else ERR_QUORUM_COMPOSITION_MISSING"
        side_effects:
          - "attendee_member_ids stored; quorum_threshold snapshot stored"
      - from: CONVENED
        to: ADJOURNED
        trigger: "POST /irb/board-meetings/{id}/adjourn"
        actor: IrbChair
        preconditions:
          - "Meeting CONVENED else ERR_INVALID_STATE"
        side_effects:
          - "Every AgendaItem still LISTED -> DEFERRED (item_count recomputed)"
      - from: SCHEDULED
        to: FAILED_QUORUM
        trigger: "system clock sweep: current time > scheduled_at + MEETING_START_GRACE_MINUTES (30) while SCHEDULED"
        actor: system
        preconditions:
          - "Meeting SCHEDULED and grace elapsed"
        side_effects: []
      - from: FAILED_QUORUM
        to: SCHEDULED
        trigger: "POST /irb/board-meetings/{id}/reschedule"
        actor: IrbCoordinator
        preconditions:
          - "Meeting FAILED_QUORUM else ERR_INVALID_STATE"
          - "New scheduled_at strictly after current logical time else ERR_SCHEDULE_IN_PAST"
          - "New room occupation must not half-open-overlap another SCHEDULED/CONVENED meeting in the same room else ERR_MEETING_ROOM_CONFLICT"
        side_effects:
          - "LISTED AgendaItems carry over to the rescheduled meeting"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system side effect: item_count falls to 0 because suspension removed its last LISTED item"
        actor: system
        preconditions:
          - "Meeting SCHEDULED and an AgendaItem removal leaves item_count == 0"
        side_effects: []
        note: "Creation with 0 items does NOT cancel; only a removal event triggers this"

  - entity: AgendaItem
    initial_state: LISTED
    terminal_states: [VOTED, DEFERRED, REMOVED]
    transitions:
      - from: LISTED
        to: VOTED
        trigger: "POST /irb/agenda-items/{id}/vote"
        actor: IrbChair
        preconditions:
          - "Item LISTED else ERR_INVALID_STATE"
          - "Meeting of this item CONVENED else ERR_INVALID_STATE (cross-entity gate)"
          - "Chair holds no CONFLICTED declaration on item's protocol else ERR_CHAIR_CONFLICTED"
          - "votes_for+votes_against+votes_abstain == eligible_voter_count else ERR_VOTE_TALLY_MISMATCH"
        side_effects:
          - "eligible_voter_count := |attendees| - |attendees CONFLICTED on protocol|"
          - "motion=APPROVE and votes_for*2 > eligible: outcome=APPROVE -> protocol APPROVED path (or modification APPROVED when modification_id set)"
          - "motion=APPROVE and fails: outcome=DISAPPROVE -> protocol DISAPPROVED (or modification DENIED)"
          - "motion=REQUIRE_CHANGES and passes: outcome=REQUIRE_CHANGES -> protocol BOARD_CHANGES_REQUESTED (or modification DENIED)"
          - "motion=REQUIRE_CHANGES and fails: outcome=DEFER -> item DEFERRED instead of VOTED"
      - from: LISTED
        to: DEFERRED
        trigger: "system side effect of POST /irb/board-meetings/{id}/adjourn, or a failed REQUIRE_CHANGES motion"
        actor: system
        preconditions: []
        side_effects:
          - "meeting.item_count recomputed"
      - from: LISTED
        to: REMOVED
        trigger: "system side effect of protocol suspension"
        actor: system
        preconditions:
          - "Item LISTED on a meeting in SCHEDULED"
        side_effects:
          - "meeting.item_count recomputed; if 0 -> meeting CANCELLED"

  - entity: ModificationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /irb/modifications/{id}/adjudicate outcome=APPROVE (scope MINOR only), or board vote pass on an AgendaItem carrying this modification_id (scope MAJOR)"
        actor: IrbChair
        preconditions:
          - "Modification SUBMITTED else ERR_INVALID_STATE"
          - "Chair adjudication of a MAJOR scope -> ERR_MAJOR_REQUIRES_BOARD"
          - "Protocol in APPROVED; if protocol SUSPENDED only MINOR may proceed (MAJOR -> ERR_INVALID_STATE)"
          - "If new_consent_document_id set: that document must be SUBMITTED else ERR_CONSENT_DOC_NOT_SUBMITTED"
        side_effects:
          - "Protocol version increments (any mutation); if new_consent_document_id set: that document SUBMITTED->APPROVED and the previously APPROVED document -> SUPERSEDED (approved-document cardinality conserved)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /irb/modifications/{id}/adjudicate outcome=DENY, or board vote DISAPPROVE/REQUIRE_CHANGES on its AgendaItem"
        actor: IrbChair
        preconditions:
          - "Modification SUBMITTED"
        side_effects: []

  - entity: ContinuingReview
    initial_state: PENDING_SUBMISSION
    terminal_states: [APPROVED]
    transitions:
      - from: PENDING_SUBMISSION
        to: SUBMITTED
        trigger: "POST /irb/continuing-reviews/{id}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "CR in PENDING_SUBMISSION or CHANGES_REQUESTED else ERR_INVALID_STATE; caller owns the protocol"
          - "window_opens_at <= current logical time else ERR_CR_WINDOW_NOT_OPEN"
          - "current logical time <= due_at else the sweep will have LAPSED it (ERR_INVALID_STATE)"
        side_effects:
          - "submitted_at := current logical time"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /irb/continuing-reviews/{id}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Same as PENDING_SUBMISSION->SUBMITTED"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /irb/continuing-reviews/{id}/adjudicate outcome=APPROVE"
        actor: IrbChair
        preconditions:
          - "CR SUBMITTED else ERR_INVALID_STATE"
        side_effects:
          - "protocol.approval_expires_at := adjudication instant + protocol.continuing_review_interval_days"
          - "Create next-cycle ContinuingReview (cycle_index+1) PENDING_SUBMISSION with recomputed due_at/window_opens_at"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /irb/continuing-reviews/{id}/adjudicate outcome=REQUIRE_CHANGES"
        actor: IrbChair
        preconditions:
          - "CR SUBMITTED"
        side_effects: []
      - from: PENDING_SUBMISSION
        to: LAPSED
        trigger: "system clock sweep: current time > due_at while PENDING_SUBMISSION or SUBMITTED"
        actor: system
        preconditions:
          - "CR in {PENDING_SUBMISSION, SUBMITTED} and due_at < current logical time"
        side_effects:
          - "Protocol APPROVED -> EXPIRED (link 1); NonComplianceCase source=LAPSED_CR OPENED (link 2); investigator provisional score recomputed (link 3)"
      - from: SUBMITTED
        to: LAPSED
        trigger: "system clock sweep"
        actor: system
        preconditions:
          - "CR in {PENDING_SUBMISSION, SUBMITTED} and due_at < current logical time"
        side_effects:
          - "Same lapse cascade as PENDING_SUBMISSION->LAPSED"
      - from: LAPSED
        to: APPROVED
        trigger: "POST /irb/continuing-reviews/{id}/adjudicate outcome=APPROVE"
        actor: IrbChair
        preconditions:
          - "CR LAPSED else ERR_INVALID_STATE"
        side_effects:
          - "Protocol EXPIRED -> APPROVED; approval_expires_at recomputed; next cycle created; LAPSED_CR case stays open"

  - entity: AdverseEventReport
    initial_state: FILED
    terminal_states: [CLOSED_NO_ACTION, CLOSED_WITH_ACTION]
    transitions:
      - from: FILED
        to: TRIAGED
        trigger: "POST /irb/adverse-events/{id}/triage"
        actor: ComplianceOfficer
        preconditions:
          - "Report FILED else ERR_INVALID_STATE"
        side_effects:
          - "If is_late: open NonComplianceCase source=LATE_AE on the protocol (status OPENED); investigator provisional score recompute (-5 open case replaces the -8 late-unfiled deduction)"
      - from: TRIAGED
        to: CLOSED_NO_ACTION
        trigger: "POST /irb/adverse-events/{id}/disposition disposition=CLOSED_NO_ACTION"
        actor: ComplianceOfficer
        preconditions:
          - "Report TRIAGED else ERR_INVALID_STATE"
        side_effects: []
      - from: TRIAGED
        to: CLOSED_WITH_ACTION
        trigger: "POST /irb/adverse-events/{id}/disposition disposition=CLOSED_WITH_ACTION action_type=REQUIRE_MODIFICATION|SUSPEND_PROTOCOL"
        actor: ComplianceOfficer
        preconditions:
          - "Report TRIAGED"
        side_effects:
          - "action_type := input; if SUSPEND_PROTOCOL and protocol in {APPROVED, EXEMPT_ACTIVE}: protocol -> SUSPENDED with the standard suspension cascades; open NonComplianceCase source=AE_ACTION"

  - entity: NonComplianceCase
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: INVESTIGATION
        trigger: "POST /irb/non-compliance-cases/{id}/open-investigation"
        actor: ComplianceOfficer
        preconditions:
          - "Case OPENED else ERR_INVALID_STATE"
        side_effects: []
      - from: INVESTIGATION
        to: FINDING_CONFIRMED
        trigger: "POST /irb/non-compliance-cases/{id}/issue-finding finding=CONFIRMED"
        actor: ComplianceOfficer
        preconditions:
          - "Case INVESTIGATION else ERR_INVALID_STATE"
        side_effects:
          - "finding_confirmed := true"
          - "If protocol in {APPROVED, EXEMPT_ACTIVE}: protocol -> SUSPENDED (cascade link 1: reliance SUSPENDED, agenda items REMOVED, empty meetings CANCELLED)"
          - "Investigator final_compliance_score recomputed (-20); if final < 60 -> investigator DEBARRED"
      - from: INVESTIGATION
        to: FINDING_NOT_CONFIRMED
        trigger: "POST /irb/non-compliance-cases/{id}/issue-finding finding=NOT_CONFIRMED"
        actor: ComplianceOfficer
        preconditions:
          - "Case INVESTIGATION"
        side_effects:
          - "finding_confirmed := false; investigator scores recomputed (the -5 open-case deduction lifts)"
      - from: FINDING_CONFIRMED
        to: CLOSED
        trigger: "POST /irb/non-compliance-cases/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "Case in {FINDING_CONFIRMED, FINDING_NOT_CONFIRMED} else ERR_INVALID_STATE"
        side_effects: []
      - from: FINDING_NOT_CONFIRMED
        to: CLOSED
        trigger: "POST /irb/non-compliance-cases/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "Case in {FINDING_CONFIRMED, FINDING_NOT_CONFIRMED}"
        side_effects: []

  - entity: RelianceAgreement
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    transitions:
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /irb/reliance-agreements/{id}/execute"
        actor: IrbAdmin
        preconditions:
          - "Agreement PROPOSED else ERR_INVALID_STATE"
          - "Protocol APPROVED else ERR_PROTOCOL_NOT_APPROVED (cross-entity gate)"
          - "No other EXECUTED agreement for the same (protocol_id, ceding_institution_code) whose closed window [effective_start_date, effective_end_date] intersects (touching endpoints DO intersect) else ERR_RELIANCE_WINDOW_OVERLAP"
        side_effects:
          - "Protocol settled_fee_cents += round_half_up(RELIANCE_SITE_FEE_CENTS * multiplier); fee_delta_cents recomputed"
      - from: EXECUTED
        to: SUSPENDED
        trigger: "system side effect of protocol suspension"
        actor: system
        preconditions:
          - "Agreement EXECUTED and its protocol SUSPENDED"
        side_effects: []
      - from: SUSPENDED
        to: EXECUTED
        trigger: "system side effect of protocol reinstatement"
        actor: system
        preconditions:
          - "Agreement SUSPENDED and its protocol reinstated"
        side_effects: []
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /irb/reliance-agreements/{id}/terminate"
        actor: IrbAdmin
        preconditions:
          - "Agreement in {EXECUTED, SUSPENDED} else ERR_INVALID_STATE"
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /irb/reliance-agreements/{id}/terminate"
        actor: IrbAdmin
        preconditions:
          - "Agreement in {EXECUTED, SUSPENDED}"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: modification-create-stale-protocol-version
    parent_entity: Protocol
    write_endpoint: "POST /irb/protocols/{id}/modifications"
    occ_field: expected_protocol_version
    description: |
      Creating a ModificationRequest against a Protocol whose version has
      advanced since the client last observed it is rejected. Approving an
      earlier modification (or any other protocol mutation) legitimately
      supersedes the client's view while leaving the protocol APPROVED, so the
      stale writer must re-read before composing its amendment.
    error_id: ERR_STALE_PROTOCOL_VERSION
    http_status: 412
  - rule_id: agenda-item-add-stale-meeting-version
    parent_entity: BoardMeeting
    write_endpoint: "POST /irb/board-meetings/{id}/agenda-items"
    occ_field: expected_meeting_version
    description: |
      Adding an AgendaItem to a BoardMeeting whose version has advanced since
      the client last observed it is rejected. Each agenda-item add bumps the
      meeting version; a writer holding an older version composes against a
      stale agenda (capacity, duplicate-listing set) and must re-read.
    error_id: ERR_STALE_MEETING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: review_fee
    trigger: "Protocol first submit (provisional variant), coordinator determination (settled base), each RelianceAgreement execute (per-line surcharge onto settled)"
    algorithm: tiered_pricing
    formula: |
      multiplier = INDUSTRY_MULTIPLIER if protocol.is_industry_sponsored else 1.0
      # ROUNDING ORDER IS PINNED: round each line to integer cents half-up
      # AFTER applying the multiplier, THEN sum the rounded lines.
      # (Sum-then-round is the rejected alternative and yields different cents.)
      base_line    = round_half_up(BASE_FEE_CENTS[level] * multiplier)
      site_line(i) = round_half_up(RELIANCE_SITE_FEE_CENTS * multiplier)   # per EXECUTED reliance agreement i
      provisional_fee_cents (at first submit) = round_half_up(BASE_FEE_CENTS[claimed_review_level] * multiplier)
      settled_fee_cents (at determination)    = base_line with level = determined_review_level
      settled_fee_cents (at each execute)     = settled_fee_cents + site_line
      fee_delta_cents = settled_fee_cents - provisional_fee_cents
    input_set: "The protocol being billed; reliance agreements of that protocol with status == EXECUTED at the evaluation instant"
    constants:
      BASE_FEE_CENTS_EXEMPT: 50000
      BASE_FEE_CENTS_EXPEDITED: 150000
      BASE_FEE_CENTS_FULL_BOARD: 250000
      RELIANCE_SITE_FEE_CENTS: 74999
      INDUSTRY_MULTIPLIER: 1.5
    precision: "integer cents; round_half_up applied per line BEFORE summation"
    variants:
      - name: provisional
        when: "Computed once at the protocol's first DRAFT->SUBMITTED transition"
        difference: "Uses claimed_review_level and ignores reliance agreements (none can be EXECUTED pre-approval)"
      - name: settled
        when: "Computed at determination (base) and mutated at each reliance execute (surcharges)"
        difference: "Uses determined_review_level; accumulates one rounded site line per EXECUTED reliance agreement"
  - name: compliance_score
    trigger: "NonComplianceCase opened / finding issued / closed; AdverseEventReport created late; AdverseEventReport triaged"
    algorithm: weighted_scoring
    formula: |
      confirmed = count(NonComplianceCase of investigator's protocols with finding_confirmed == true
                        and status in {FINDING_CONFIRMED, CLOSED})
      open_cases = count(NonComplianceCase with status in {OPENED, INVESTIGATION})
      late_unfiled = count(AdverseEventReport with is_late == true and status == FILED)
      final_compliance_score        = BASE_SCORE - CONFIRMED_DEDUCTION * confirmed
      provisional_compliance_score  = BASE_SCORE - CONFIRMED_DEDUCTION * confirmed
                                      - OPEN_CASE_DEDUCTION * open_cases
                                      - LATE_UNFILED_DEDUCTION * late_unfiled
      if final_compliance_score < DEBARMENT_THRESHOLD: investigator.status := DEBARRED
    input_set: "All NonComplianceCase and AdverseEventReport rows on protocols whose pi_id == investigator.id, regardless of protocol status"
    constants:
      BASE_SCORE: 100
      CONFIRMED_DEDUCTION: 20
      OPEN_CASE_DEDUCTION: 5
      LATE_UNFILED_DEDUCTION: 8
      DEBARMENT_THRESHOLD: 60
      SUBMISSION_GATE: 60
    precision: "integer arithmetic, no rounding"
    variants:
      - name: provisional
        when: "Evaluated at POST /irb/protocols/{id}/submit (gate: provisional >= SUBMISSION_GATE)"
        difference: "Deducts open cases and late-unfiled AE reports in addition to confirmed findings"
      - name: final
        when: "Evaluated after every issue-finding; drives DEBARRED"
        difference: "Deducts only adjudicated findings (finding_confirmed == true)"
  - name: quorum_determination
    trigger: "POST /irb/board-meetings/{id}/convene"
    algorithm: threshold
    formula: |
      active = count(IrbMember with status == ACTIVE)
      quorum_threshold = floor(active / 2) + 1
      count_ok = |attendee_member_ids| >= quorum_threshold
      composition_ok = (>=1 attendee with member_category == NON_SCIENTIST)
                       and (>=1 attendee with member_category == UNAFFILIATED)
                       and (if any LISTED AgendaItem's protocol.involves_prisoners:
                              >=1 attendee with member_category == PRISONER_REPRESENTATIVE)
      convene succeeds iff count_ok and composition_ok
    input_set: "IrbMember rows with status == ACTIVE; attendee_member_ids from the convene payload; LISTED agenda items of this meeting"
    constants:
      MEETING_START_GRACE_MINUTES: 30
    precision: "integer counts; strict >= on the threshold"
  - name: vote_outcome
    trigger: "POST /irb/agenda-items/{id}/vote"
    algorithm: threshold
    formula: |
      conflicted = count(attendees m where exists ConflictDeclaration(protocol = item.protocol_id,
                       reviewer_id = m, status == CONFLICTED))
      eligible_voter_count = |meeting.attendee_member_ids| - conflicted
      tally_ok = (votes_for + votes_against + votes_abstain == eligible_voter_count)  # else ERR_VOTE_TALLY_MISMATCH
      motion_passes = (votes_for * 2 > eligible_voter_count)   # strict majority; 2*for == eligible FAILS
      outcome = motion if motion_passes else (DISAPPROVE if motion == APPROVE else DEFER)
    input_set: "The CONVENED meeting's attendee_member_ids; CONFLICTED declarations on the item's protocol"
    precision: "integer arithmetic; strict > boundary"
  - name: continuing_review_schedule
    trigger: "Protocol entry to APPROVED; each CR adjudication APPROVE; clock sweep"
    algorithm: chronological
    formula: |
      interval_days = 180 if protocol.risk_level == GREATER_THAN_MINIMAL else 365
      cycle 1: due_at = approval_instant + interval_days
      cycle n+1: due_at = adjudication_instant + interval_days
      window_opens_at = due_at - CR_SUBMISSION_WINDOW_DAYS
      submit accepted iff window_opens_at <= now <= due_at   (both bounds inclusive)
      sweep lapse condition: now > due_at and status in {PENDING_SUBMISSION, SUBMITTED}  (strictly greater; at due_at still open)
    input_set: "The protocol's own approval/adjudication instants; logical clock"
    constants:
      STANDARD_INTERVAL_DAYS: 365
      HIGH_RISK_INTERVAL_DAYS: 180
      CR_SUBMISSION_WINDOW_DAYS: 60
    precision: "second-precision ISO8601 comparisons; strict > for lapse"
  - name: ae_timeliness
    trigger: "POST /irb/protocols/{id}/adverse-events (creation); recomputed field is_late stored"
    algorithm: threshold
    formula: |
      window_days = 15 if event_type == PROTOCOL_DEVIATION_WITH_HARM else 5
      deadline_at = occurred_at + window_days
      is_late = reported_at > deadline_at   # exactly at deadline is ON TIME
    input_set: "The single report; logical clock supplies reported_at"
    constants:
      AE_REPORT_WINDOW_DAYS_SERIOUS_ADVERSE_EVENT: 5
      AE_REPORT_WINDOW_DAYS_UNANTICIPATED_PROBLEM: 5
      AE_REPORT_WINDOW_DAYS_PROTOCOL_DEVIATION_WITH_HARM: 15
    precision: "second-precision; inclusive deadline"
  - name: reviewer_selection
    trigger: "POST /irb/protocols/{id}/review-assignments when reviewer_id is omitted"
    algorithm: aggregation
    formula: |
      candidates = IrbMember where status == ACTIVE
                   and active_assignment_count < MAX_ACTIVE_ASSIGNMENTS
                   and no ConflictDeclaration(protocol = this protocol, reviewer_id = member, status == CONFLICTED)
                   and no ReviewAssignment(protocol = this protocol, reviewer_id = member,
                                           status in {OFFERED, ACCEPTED, SUBMITTED})
      ranking = sort by active_assignment_count ASC, tie-break created_at ASC
      selected = first(ranking); empty pool -> ERR_NO_ELIGIBLE_REVIEWER
    input_set: "All IrbMember rows; declarations and assignments scoped to this protocol"
    constants:
      MAX_ACTIVE_ASSIGNMENTS: 5
    precision: "deterministic ordering; created_at ASC tie-break (never id)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for endpoint; for IrbChair endpoints the X-User-ID member must have is_chair == true; ownership rules (PI owns protocol; Reviewer owns assignment)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path template ids resolve left-to-right (protocol, meeting, agenda item, assignment, declaration, consent doc, modification, continuing review, adverse event, case, reliance, investigator, member)"
    error_id: ERR_PROTOCOL_NOT_FOUND
    http_status: 404
    applies_to: "all (per-resource variant errors: ERR_INVESTIGATOR_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_CONSENT_DOC_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_DECLARATION_NOT_FOUND, ERR_MEETING_NOT_FOUND, ERR_AGENDA_ITEM_NOT_FOUND, ERR_MODIFICATION_NOT_FOUND, ERR_CR_NOT_FOUND, ERR_AE_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_RELIANCE_NOT_FOUND)"
  - priority: 4
    category: state
    check: "Target resource in a from-state of the attempted transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "PI compliance gate (evaluated in this fixed order): (i) investigator not DEBARRED (ERR_INVESTIGATOR_DEBARRED), (ii) training_expires_at > now (ERR_PI_TRAINING_LAPSED), (iii) provisional_compliance_score >= 60 (ERR_COMPLIANCE_SCORE_TOO_LOW)"
    error_id: ERR_INVESTIGATOR_DEBARRED
    http_status: 422
    applies_to: "POST /irb/protocols/{id}/submit (variant errors ERR_PI_TRAINING_LAPSED, ERR_COMPLIANCE_SCORE_TOO_LOW)"
  - priority: 6
    category: business_safety
    check: "Reviewer/chair conflict: assignment create/respond/recommend with CONFLICTED declaration; chair acting on a protocol where the chair holds a CONFLICTED declaration"
    error_id: ERR_REVIEWER_CONFLICTED
    http_status: 422
    applies_to: "POST /irb/protocols/{id}/review-assignments, POST /irb/review-assignments/{id}/respond, POST /irb/review-assignments/{id}/recommendations (chair variant ERR_CHAIR_CONFLICTED on expedited-determination, vote, modifications adjudicate, continuing-review adjudicate)"
  - priority: 7
    category: business_safety
    check: "Consent/waiver safety: waiver criteria all true when waiver_type != NONE; an APPROVED consent document exists before protocol approval"
    error_id: ERR_WAIVER_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "POST /irb/consent-documents/{id}/review (variant ERR_NO_APPROVED_CONSENT on expedited-determination APPROVE and board APPROVE)"
  - priority: 8
    category: business_safety
    check: "Submission completeness: >=1 ConsentDocument in {SUBMITTED, APPROVED}"
    error_id: ERR_NO_CONSENT_DOCUMENT
    http_status: 422
    applies_to: "POST /irb/protocols/{id}/submit"
  - priority: 9
    category: business_constraint
    check: "Determination legality: EXEMPT requires risk_level == MINIMAL"
    error_id: ERR_EXEMPT_REQUIRES_MINIMAL_RISK
    http_status: 422
    applies_to: "POST /irb/protocols/{id}/determinations"
  - priority: 10
    category: business_constraint
    check: "Expedited routing: APPROVE requires >=2 non-voided SUBMITTED recommendations; any non-voided DISAPPROVE forces referral"
    error_id: ERR_INSUFFICIENT_RECOMMENDATIONS
    http_status: 422
    applies_to: "POST /irb/protocols/{id}/expedited-determination (variant ERR_EXPEDITED_DISAPPROVE_REQUIRES_BOARD)"
  - priority: 11
    category: business_constraint
    check: "Assignment uniqueness & pool: no second assignment in {OFFERED, ACCEPTED, SUBMITTED} for (protocol, reviewer); auto-selection pool non-empty"
    error_id: ERR_DUPLICATE_ASSIGNMENT
    http_status: 409
    applies_to: "POST /irb/protocols/{id}/review-assignments (variant ERR_NO_ELIGIBLE_REVIEWER)"
  - priority: 12
    category: business_constraint
    check: "Meeting composition: convene quorum count and category composition (incl. prisoner representative when any LISTED protocol involves prisoners)"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /irb/board-meetings/{id}/convene (variants ERR_QUORUM_COMPOSITION_MISSING, ERR_ATTENDEE_NOT_ELIGIBLE)"
  - priority: 13
    category: business_constraint
    check: "Vote integrity: tally sums to eligible_voter_count"
    error_id: ERR_VOTE_TALLY_MISMATCH
    http_status: 422
    applies_to: "POST /irb/agenda-items/{id}/vote"
  - priority: 14
    category: business_constraint
    check: "Agenda capacity & uniqueness: <=8 LISTED items per meeting; at most one LISTED item per protocol across SCHEDULED/CONVENED meetings"
    error_id: ERR_AGENDA_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /irb/board-meetings/{id}/agenda-items (variant ERR_DUPLICATE_AGENDA_LISTING 409)"
  - priority: 15
    category: business_constraint
    check: "Resource overlap: meeting room half-open overlap; reliance closed-window overlap"
    error_id: ERR_MEETING_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /irb/board-meetings, POST /irb/board-meetings/{id}/reschedule (variant ERR_RELIANCE_WINDOW_OVERLAP on reliance execute)"
  - priority: 16
    category: business_constraint
    check: "Modification routing: MAJOR requires convened-board vote"
    error_id: ERR_MAJOR_REQUIRES_BOARD
    http_status: 422
    applies_to: "POST /irb/modifications/{id}/adjudicate"
  - priority: 17
    category: business_temporal
    check: "Temporal windows: meeting scheduled_at in future; CR submit inside [window_opens_at, due_at]; reliance effective_start_date <= effective_end_date; AE occurred_at <= now"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "POST /irb/board-meetings, reschedule (variants ERR_CR_WINDOW_NOT_OPEN, ERR_INVALID_DATE_RANGE, ERR_AE_OCCURRED_IN_FUTURE)"
  - priority: 18
    category: business_referential
    check: "Cross-entity state references: reliance execute requires protocol APPROVED; modification approval requires referenced consent doc SUBMITTED; close/reinstate require no open cases"
    error_id: ERR_PROTOCOL_NOT_APPROVED
    http_status: 422
    applies_to: "POST /irb/reliance-agreements/{id}/execute (variants ERR_CONSENT_DOC_NOT_SUBMITTED, ERR_OPEN_CASES_REMAIN)"
  - priority: 19
    category: business_constraint
    check: "OCC: expected_protocol_version / expected_meeting_version match current version"
    error_id: ERR_STALE_PROTOCOL_VERSION
    http_status: 412
    applies_to: "POST /irb/protocols/{id}/modifications (variant ERR_STALE_MEETING_VERSION on POST /irb/board-meetings/{id}/agenda-items)"
  - priority: 20
    category: business_constraint
    check: "Required request fields present and well-typed; enum values valid"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; startup default 2026-05-01T00:00:00Z) ---
  - method: POST
    path: /_clock/set_current_utc
    description: "Sets the logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock. After setting, runs the sweep: lapses due ContinuingReviews (protocol -> EXPIRED, LAPSED_CR case opened), fails SCHEDULED meetings past start+30min grace, expires stale OFFERED assignments."
    roles: [IrbAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, lapsed_continuing_reviews: integer, failed_quorum_meetings: integer, expired_assignments: integer }"
    side_effects: [continuing_review_schedule lapse cascade, BoardMeeting FAILED_QUORUM sweep, ReviewAssignment EXPIRED sweep]

  # --- investigators ---
  - method: POST
    path: /irb/investigators
    description: "Register an investigator (server mints id; compliance scores start at 100)"
    roles: [IrbAdmin]
    code: 201
    input: [full_name, email, department, training_expires_at]
    output: Investigator
    side_effects: []
  - method: GET
    path: /irb/investigators/{id}
    description: "Fetch one investigator (compliance scores visible)"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Investigator
    side_effects: []
  - method: GET
    path: /irb/investigators
    description: "List investigators with pagination; filter by status"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Investigator[]
    side_effects: []

  # --- IRB members ---
  - method: POST
    path: /irb/irb-members
    description: "Register an IRB member (category drives quorum composition)"
    roles: [IrbAdmin]
    code: 201
    input: [full_name, email, member_category, "is_chair?"]
    output: IrbMember
    side_effects: []
  - method: GET
    path: /irb/irb-members/{id}
    description: "Fetch one member (active_assignment_count visible)"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: IrbMember
    side_effects: []
  - method: GET
    path: /irb/irb-members
    description: "List members; filter by status and member_category"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "member_category?", "limit?", "offset?"]
    output: IrbMember[]
    side_effects: []
  - method: POST
    path: /irb/irb-members/{id}/deactivate
    description: "Deactivate a member: excluded from quorum base and new assignments; existing OFFERED/ACCEPTED assignments unaffected"
    roles: [IrbAdmin]
    code: 200
    input: []
    output: IrbMember
    side_effects: ["status := INACTIVE"]
  - method: POST
    path: /irb/irb-members/{id}/reactivate
    description: "Reactivate an INACTIVE member"
    roles: [IrbAdmin]
    code: 200
    input: []
    output: IrbMember
    side_effects: ["status := ACTIVE"]

  # --- protocols ---
  - method: POST
    path: /irb/protocols
    description: "Create a DRAFT protocol; pi_id taken from X-User-ID"
    roles: [PrincipalInvestigator]
    code: 201
    input: [title, claimed_review_level, risk_level, "involves_prisoners?", "is_industry_sponsored?"]
    output: Protocol
    side_effects: []
  - method: GET
    path: /irb/protocols/{id}
    description: "Fetch one protocol (fees, expiry, version visible)"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Protocol
    side_effects: []
  - method: GET
    path: /irb/protocols
    description: "List protocols; filter by pi_id and status"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["pi_id?", "status?", "limit?", "offset?"]
    output: Protocol[]
    side_effects: []
  - method: POST
    path: /irb/protocols/{id}/submit
    description: "Submit from DRAFT/RETURNED/CHANGES_REQUESTED/BOARD_CHANGES_REQUESTED; first submit computes provisional fee; routes back into the correct review state"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: Protocol
    side_effects: [review_fee provisional variant on first submit]
  - method: POST
    path: /irb/protocols/{id}/return
    description: "Coordinator returns a SUBMITTED protocol for completion"
    roles: [IrbCoordinator]
    code: 200
    input: [reason]
    output: Protocol
    side_effects: []
  - method: POST
    path: /irb/protocols/{id}/determinations
    description: "Coordinator determination of review level; routes to EXEMPT_ACTIVE / UNDER_EXPEDITED_REVIEW / AWAITING_FULL_BOARD; settles fee base"
    roles: [IrbCoordinator]
    code: 200
    input: [determined_review_level]
    output: Protocol
    side_effects: [review_fee settled base + fee_delta recompute]
  - method: POST
    path: /irb/protocols/{id}/expedited-determination
    description: "Chair decision on an expedited review: APPROVE | REQUIRE_CHANGES | REFER_TO_FULL_BOARD"
    roles: [IrbChair]
    code: 200
    input: [outcome]
    output: Protocol
    side_effects: ["On APPROVE: approval_expires_at set, ContinuingReview cycle 1 created"]
  - method: POST
    path: /irb/protocols/{id}/withdraw
    description: "PI withdraws from DRAFT/SUBMITTED/RETURNED"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: Protocol
    side_effects: []
  - method: POST
    path: /irb/protocols/{id}/close
    description: "PI closes an APPROVED/EXEMPT_ACTIVE protocol with no open cases"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: Protocol
    side_effects: ["Moots open ContinuingReviews"]
  - method: POST
    path: /irb/protocols/{id}/reinstate
    description: "Chair reinstates a SUSPENDED protocol to pre_suspension_state once no cases remain open; SUSPENDED reliance agreements return to EXECUTED"
    roles: [IrbChair]
    code: 200
    input: []
    output: Protocol
    side_effects: ["RelianceAgreement SUSPENDED -> EXECUTED"]

  # --- consent documents ---
  - method: POST
    path: /irb/protocols/{id}/consent-documents
    description: "Upload a consent document version (version_seq assigned per protocol)"
    roles: [PrincipalInvestigator]
    code: 201
    input: [file_ref, "waiver_type?", "waiver_criterion_minimal_risk?", "waiver_criterion_rights_not_adversely_affected?", "waiver_criterion_impracticable_without_waiver?", "waiver_criterion_debrief_when_appropriate?"]
    output: ConsentDocument
    side_effects: []
  - method: GET
    path: /irb/consent-documents/{id}
    description: "Fetch one consent document"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ConsentDocument
    side_effects: []
  - method: GET
    path: /irb/protocols/{id}/consent-documents
    description: "List consent documents of a protocol"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConsentDocument[]
    side_effects: []
  - method: GET
    path: /irb/consent-documents/{id}/modifications
    description: "List modification requests referencing this consent document"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ModificationRequest[]
    side_effects: []
  - method: POST
    path: /irb/consent-documents/{id}/review
    description: "Chair approves or requests changes on a consent document; approval supersedes the protocol's previously APPROVED document"
    roles: [IrbChair]
    code: 200
    input: [outcome]
    output: ConsentDocument
    side_effects: ["Prior APPROVED document of same protocol -> SUPERSEDED"]

  # --- review assignments & conflicts ---
  - method: POST
    path: /irb/protocols/{id}/review-assignments
    description: "Offer a review assignment; omit reviewer_id for deterministic auto-selection (fewest active assignments, created_at tie-break)"
    roles: [IrbCoordinator]
    code: 201
    input: ["reviewer_id?", "reviewer_role?"]
    output: ReviewAssignment
    side_effects: ["reviewer_selection calculation when reviewer_id omitted", "IrbMember.active_assignment_count += 1"]
  - method: GET
    path: /irb/review-assignments/{id}
    description: "Fetch one assignment"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: []
  - method: GET
    path: /irb/review-assignments
    description: "List assignments; filter by protocol_id, reviewer_id, status"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["protocol_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: ReviewAssignment[]
    side_effects: []
  - method: POST
    path: /irb/review-assignments/{id}/respond
    description: "Reviewer responds ACCEPT | DECLINE | RECUSE to an offer"
    roles: [Reviewer]
    code: 200
    input: [response]
    output: ReviewAssignment
    side_effects: ["active_assignment_count adjusted on DECLINE/RECUSE"]
  - method: POST
    path: /irb/review-assignments/{id}/recommendations
    description: "Reviewer submits recommendation from ACCEPTED"
    roles: [Reviewer]
    code: 200
    input: [recommendation]
    output: ReviewAssignment
    side_effects: ["active_assignment_count -= 1"]
  - method: POST
    path: /irb/protocols/{id}/conflict-declarations
    description: "Reviewer self-declares a conflict (or NONE) against a protocol"
    roles: [Reviewer]
    code: 201
    input: [declaration_type, "detail?"]
    output: ConflictDeclaration
    side_effects: []
  - method: GET
    path: /irb/conflict-declarations/{id}
    description: "Fetch one declaration"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ConflictDeclaration
    side_effects: []
  - method: GET
    path: /irb/conflict-declarations
    description: "List declarations; filter by protocol_id, reviewer_id, status"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["protocol_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: ConflictDeclaration[]
    side_effects: []
  - method: POST
    path: /irb/conflict-declarations/{id}/adjudicate
    description: "Chair clears or confirms a conflict; CONFLICTED recuses open assignments and voids submitted recommendations"
    roles: [IrbChair]
    code: 200
    input: [outcome]
    output: ConflictDeclaration
    side_effects: ["Assignment recusal cascade + recommendation voiding"]

  # --- board meetings & agenda ---
  - method: POST
    path: /irb/board-meetings
    description: "Schedule a convened-board meeting; room occupation is half-open [scheduled_at, +duration_minutes)"
    roles: [IrbCoordinator]
    code: 201
    input: [room_id, scheduled_at, duration_minutes]
    output: BoardMeeting
    side_effects: []
  - method: GET
    path: /irb/board-meetings/{id}
    description: "Fetch one meeting (quorum snapshot, item_count, version visible)"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: BoardMeeting
    side_effects: []
  - method: GET
    path: /irb/board-meetings
    description: "List meetings; filter by status"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BoardMeeting[]
    side_effects: []
  - method: POST
    path: /irb/board-meetings/{id}/agenda-items
    description: "List a protocol on a meeting agenda (OCC: expected_meeting_version required); priority_class derived; capacity 8 LISTED items. Preconditions: meeting SCHEDULED; EITHER modification_id omitted and protocol AWAITING_FULL_BOARD, OR modification_id set with that modification SUBMITTED and protocol APPROVED (else ERR_INVALID_STATE); at most one LISTED item per protocol across SCHEDULED/CONVENED meetings (ERR_DUPLICATE_AGENDA_LISTING)"
    roles: [IrbCoordinator]
    code: 201
    input: [protocol_id, "modification_id?", expected_meeting_version]
    output: AgendaItem
    side_effects: ["increments BoardMeeting.version by 1", "item_count recomputed"]
  - method: GET
    path: /irb/board-meetings/{id}/agenda-items
    description: "List agenda items of a meeting, ordered by priority_class rank (SUSPENSION_REVIEW < INITIAL_REVIEW < MODIFICATION) then protocol created_at ASC"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: AgendaItem[]
    side_effects: []
  - method: GET
    path: /irb/agenda-items/{id}
    description: "Fetch one agenda item"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: AgendaItem
    side_effects: []
  - method: GET
    path: /irb/agenda-items
    description: "List agenda items; filter by protocol_id, meeting_id, modification_id, status"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["protocol_id?", "meeting_id?", "modification_id?", "status?", "limit?", "offset?"]
    output: AgendaItem[]
    side_effects: []
  - method: POST
    path: /irb/board-meetings/{id}/convene
    description: "Chair convenes with an attendee roster; quorum count + composition (and prisoner-representative branch) enforced; snapshots quorum_threshold"
    roles: [IrbChair]
    code: 200
    input: [attendee_member_ids]
    output: BoardMeeting
    side_effects: [quorum_determination calculation, attendee snapshot]
  - method: POST
    path: /irb/board-meetings/{id}/adjourn
    description: "Chair adjourns; remaining LISTED items become DEFERRED"
    roles: [IrbChair]
    code: 200
    input: []
    output: BoardMeeting
    side_effects: ["AgendaItem LISTED -> DEFERRED"]
  - method: POST
    path: /irb/board-meetings/{id}/reschedule
    description: "Coordinator reschedules a FAILED_QUORUM meeting; LISTED items carry over"
    roles: [IrbCoordinator]
    code: 200
    input: [scheduled_at, "room_id?", "duration_minutes?"]
    output: BoardMeeting
    side_effects: []
  - method: POST
    path: /irb/agenda-items/{id}/vote
    description: "Chair records the vote tally; strict-majority rule with recusal-adjusted denominator; applies protocol/modification outcome"
    roles: [IrbChair]
    code: 200
    input: [motion, votes_for, votes_against, votes_abstain]
    output: AgendaItem
    side_effects: [vote_outcome calculation, "Protocol/modification state transition per outcome"]

  # --- modifications ---
  - method: POST
    path: /irb/protocols/{id}/modifications
    description: "PI files an amendment (OCC: expected_protocol_version required); protocol must be APPROVED (or SUSPENDED for MINOR safety amendments only); MINOR chair-adjudicable, MAJOR requires board vote"
    roles: [PrincipalInvestigator]
    code: 201
    input: [scope, description, "new_consent_document_id?", expected_protocol_version]
    output: ModificationRequest
    side_effects: ["increments Protocol.version by 1"]
  - method: GET
    path: /irb/modifications/{id}
    description: "Fetch one modification"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ModificationRequest
    side_effects: []
  - method: GET
    path: /irb/protocols/{id}/modifications
    description: "List modifications of a protocol"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ModificationRequest[]
    side_effects: []
  - method: POST
    path: /irb/modifications/{id}/adjudicate
    description: "Chair approves/denies a MINOR modification; approving one carrying new_consent_document_id approves that document and supersedes the prior APPROVED one"
    roles: [IrbChair]
    code: 200
    input: [outcome]
    output: ModificationRequest
    side_effects: ["Consent supersede invariant when new_consent_document_id set"]

  # --- continuing review ---
  - method: GET
    path: /irb/continuing-reviews/{id}
    description: "Fetch one continuing review"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ContinuingReview
    side_effects: []
  - method: GET
    path: /irb/protocols/{id}/continuing-reviews
    description: "List continuing reviews of a protocol"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ContinuingReview[]
    side_effects: []
  - method: POST
    path: /irb/continuing-reviews/{id}/submit
    description: "PI submits a continuing review inside [window_opens_at, due_at]"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: ContinuingReview
    side_effects: []
  - method: POST
    path: /irb/continuing-reviews/{id}/adjudicate
    description: "Chair approves (extends expiry, opens next cycle; from LAPSED reinstates EXPIRED protocol) or requests changes"
    roles: [IrbChair]
    code: 200
    input: [outcome]
    output: ContinuingReview
    side_effects: [continuing_review_schedule recompute, "EXPIRED -> APPROVED when from LAPSED"]

  # --- adverse events ---
  - method: POST
    path: /irb/protocols/{id}/adverse-events
    description: "PI files an adverse-event / unanticipated-problem report; protocol must be in {APPROVED, SUSPENDED, EXPIRED, EXEMPT_ACTIVE} (post-approval safety reporting); is_late computed against the logical clock; occurred_at must not be after current logical time"
    roles: [PrincipalInvestigator]
    code: 201
    input: [event_type, occurred_at, description]
    output: AdverseEventReport
    side_effects: [ae_timeliness calculation]
  - method: GET
    path: /irb/adverse-events/{id}
    description: "Fetch one report"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: AdverseEventReport
    side_effects: []
  - method: GET
    path: /irb/protocols/{id}/adverse-events
    description: "List reports of a protocol"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AdverseEventReport[]
    side_effects: []
  - method: POST
    path: /irb/adverse-events/{id}/triage
    description: "ComplianceOfficer triages; a late report auto-opens a LATE_AE non-compliance case"
    roles: [ComplianceOfficer]
    code: 200
    input: ["triage_note?"]
    output: AdverseEventReport
    side_effects: ["LATE_AE case opened when is_late", "compliance_score recompute"]
  - method: POST
    path: /irb/adverse-events/{id}/disposition
    description: "Close with or without action; SUSPEND_PROTOCOL suspends an APPROVED/EXEMPT_ACTIVE protocol and opens an AE_ACTION case"
    roles: [ComplianceOfficer]
    code: 200
    input: [disposition, "action_type?"]
    output: AdverseEventReport
    side_effects: ["Optional protocol suspension cascade + AE_ACTION case"]

  # --- non-compliance ---
  - method: POST
    path: /irb/protocols/{id}/non-compliance-cases
    description: "ComplianceOfficer opens a MANUAL case"
    roles: [ComplianceOfficer]
    code: 201
    input: [reason]
    output: NonComplianceCase
    side_effects: [compliance_score recompute]
  - method: GET
    path: /irb/non-compliance-cases/{id}
    description: "Fetch one case"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: NonComplianceCase
    side_effects: []
  - method: GET
    path: /irb/protocols/{id}/non-compliance-cases
    description: "List cases of a protocol"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: NonComplianceCase[]
    side_effects: []
  - method: POST
    path: /irb/non-compliance-cases/{id}/open-investigation
    description: "Move case OPENED -> INVESTIGATION"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: NonComplianceCase
    side_effects: []
  - method: POST
    path: /irb/non-compliance-cases/{id}/issue-finding
    description: "Issue finding; CONFIRMED suspends an APPROVED/EXEMPT_ACTIVE protocol (with cascades) and recomputes investigator scores (DEBARRED below 60)"
    roles: [ComplianceOfficer]
    code: 200
    input: [finding]
    output: NonComplianceCase
    side_effects: ["Protocol suspension cascade when applicable", "compliance_score recompute"]
  - method: POST
    path: /irb/non-compliance-cases/{id}/close
    description: "Close a case after the finding"
    roles: [ComplianceOfficer]
    code: 200
    input: ["closure_note?"]
    output: NonComplianceCase
    side_effects: []

  # --- reliance agreements ---
  - method: POST
    path: /irb/reliance-agreements
    description: "Create a PROPOSED reliance agreement for a multi-site protocol; protocol must not be in a terminal state {DISAPPROVED, WITHDRAWN, CLOSED}; effective_start_date <= effective_end_date"
    roles: [IrbAdmin]
    code: 201
    input: [protocol_id, ceding_institution_code, reviewing_institution_code, effective_start_date, effective_end_date]
    output: RelianceAgreement
    side_effects: []
  - method: GET
    path: /irb/reliance-agreements/{id}
    description: "Fetch one agreement"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: RelianceAgreement
    side_effects: []
  - method: GET
    path: /irb/reliance-agreements
    description: "List agreements; filter by protocol_id, ceding_institution_code, status"
    roles: [PrincipalInvestigator, Reviewer, IrbChair, IrbCoordinator, IrbAdmin, ComplianceOfficer]
    code: 200
    input: ["protocol_id?", "ceding_institution_code?", "status?", "limit?", "offset?"]
    output: RelianceAgreement[]
    side_effects: []
  - method: POST
    path: /irb/reliance-agreements/{id}/execute
    description: "Execute a PROPOSED agreement; requires protocol APPROVED and no closed-window overlap for the same (protocol, ceding institution); adds the reliance fee line to settled_fee_cents"
    roles: [IrbAdmin]
    code: 200
    input: []
    output: RelianceAgreement
    side_effects: ["review_fee reliance surcharge onto settled_fee_cents"]
  - method: POST
    path: /irb/reliance-agreements/{id}/terminate
    description: "Terminate an EXECUTED or SUSPENDED agreement"
    roles: [IrbAdmin]
    code: 200
    input: []
    output: RelianceAgreement
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, non-chair member acting as IrbChair, PI acting on another's protocol, reviewer acting on another's assignment" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field / invalid enum / malformed value" }
  - { id: ERR_INVESTIGATOR_NOT_FOUND, http: 404, condition: "investigator id does not resolve" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member id does not resolve" }
  - { id: ERR_PROTOCOL_NOT_FOUND, http: 404, condition: "protocol id does not resolve" }
  - { id: ERR_CONSENT_DOC_NOT_FOUND, http: 404, condition: "consent document id does not resolve" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignment id does not resolve" }
  - { id: ERR_DECLARATION_NOT_FOUND, http: 404, condition: "conflict declaration id does not resolve" }
  - { id: ERR_MEETING_NOT_FOUND, http: 404, condition: "meeting id does not resolve" }
  - { id: ERR_AGENDA_ITEM_NOT_FOUND, http: 404, condition: "agenda item id does not resolve" }
  - { id: ERR_MODIFICATION_NOT_FOUND, http: 404, condition: "modification id does not resolve" }
  - { id: ERR_CR_NOT_FOUND, http: 404, condition: "continuing review id does not resolve" }
  - { id: ERR_AE_NOT_FOUND, http: 404, condition: "adverse event id does not resolve" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "non-compliance case id does not resolve" }
  - { id: ERR_RELIANCE_NOT_FOUND, http: 404, condition: "reliance agreement id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a from-state of the attempted transition (includes MAJOR modification on SUSPENDED protocol)" }
  - { id: ERR_INVESTIGATOR_DEBARRED, http: 422, condition: "Submit attempted while investigator.status == DEBARRED" }
  - { id: ERR_PI_TRAINING_LAPSED, http: 422, condition: "Submit with training_expires_at <= current logical time" }
  - { id: ERR_COMPLIANCE_SCORE_TOO_LOW, http: 422, condition: "Submit with provisional_compliance_score < 60" }
  - { id: ERR_NO_CONSENT_DOCUMENT, http: 422, condition: "Submit without any ConsentDocument in {SUBMITTED, APPROVED}" }
  - { id: ERR_NO_APPROVED_CONSENT, http: 422, condition: "Protocol approval (expedited or board) without an APPROVED ConsentDocument" }
  - { id: ERR_WAIVER_CRITERIA_NOT_MET, http: 422, condition: "Approving a consent document whose waiver_type != NONE without all four criteria true" }
  - { id: ERR_EXEMPT_REQUIRES_MINIMAL_RISK, http: 422, condition: "Determination EXEMPT on a GREATER_THAN_MINIMAL protocol" }
  - { id: ERR_INSUFFICIENT_RECOMMENDATIONS, http: 422, condition: "Expedited APPROVE with fewer than 2 non-voided SUBMITTED recommendations (REQUIRE_CHANGES needs >=1)" }
  - { id: ERR_EXPEDITED_DISAPPROVE_REQUIRES_BOARD, http: 422, condition: "Expedited APPROVE attempted while a non-voided DISAPPROVE recommendation exists" }
  - { id: ERR_REVIEWER_CONFLICTED, http: 422, condition: "Assignment create/respond/recommend where the reviewer holds a CONFLICTED declaration on the protocol" }
  - { id: ERR_CHAIR_CONFLICTED, http: 422, condition: "Chair acts (determine/vote/adjudicate) on a protocol where the chair holds a CONFLICTED declaration" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "Second non-terminal assignment for the same (protocol, reviewer)" }
  - { id: ERR_NO_ELIGIBLE_REVIEWER, http: 422, condition: "Auto-selection candidate pool empty" }
  - { id: ERR_ATTENDEE_NOT_ELIGIBLE, http: 422, condition: "Convene attendee id is not an ACTIVE IrbMember" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "Convene attendee count below floor(active/2)+1" }
  - { id: ERR_QUORUM_COMPOSITION_MISSING, http: 422, condition: "Convene lacks required NON_SCIENTIST/UNAFFILIATED/PRISONER_REPRESENTATIVE composition" }
  - { id: ERR_VOTE_TALLY_MISMATCH, http: 422, condition: "votes_for+votes_against+votes_abstain != eligible_voter_count" }
  - { id: ERR_AGENDA_CAPACITY_EXCEEDED, http: 422, condition: "Ninth LISTED item on one meeting" }
  - { id: ERR_DUPLICATE_AGENDA_LISTING, http: 409, condition: "Protocol already LISTED on a SCHEDULED/CONVENED meeting" }
  - { id: ERR_MEETING_ROOM_CONFLICT, http: 409, condition: "Half-open room occupation overlap with another SCHEDULED/CONVENED meeting" }
  - { id: ERR_RELIANCE_WINDOW_OVERLAP, http: 409, condition: "Closed-window overlap (inclusive endpoints) with an EXECUTED agreement for the same protocol + ceding institution" }
  - { id: ERR_MAJOR_REQUIRES_BOARD, http: 422, condition: "Chair adjudication APPROVE on a MAJOR modification" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "Meeting scheduled_at not strictly after current logical time" }
  - { id: ERR_CR_WINDOW_NOT_OPEN, http: 422, condition: "Continuing-review submit before window_opens_at" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "effective_start_date > effective_end_date on a reliance agreement" }
  - { id: ERR_AE_OCCURRED_IN_FUTURE, http: 422, condition: "Adverse event occurred_at after current logical time" }
  - { id: ERR_PROTOCOL_NOT_APPROVED, http: 422, condition: "Reliance execute while protocol not APPROVED" }
  - { id: ERR_CONSENT_DOC_NOT_SUBMITTED, http: 422, condition: "Modification approval referencing a consent document not in SUBMITTED" }
  - { id: ERR_OPEN_CASES_REMAIN, http: 422, condition: "Close/reinstate while cases in {OPENED, INVESTIGATION, FINDING_CONFIRMED} exist" }
  - { id: ERR_STALE_PROTOCOL_VERSION, http: 412, condition: "expected_protocol_version mismatch on modification create" }
  - { id: ERR_STALE_MEETING_VERSION, http: 412, condition: "expected_meeting_version mismatch on agenda-item create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PrincipalInvestigator
    description: "Study PI; owns protocols (pi_id == X-User-ID); files submissions, consent documents, modifications, continuing reviews, adverse events"
    identity: "entity_backed:Investigator"
    exclusive_operations:
      - "POST /irb/protocols"
      - "POST /irb/protocols/{id}/submit"
      - "POST /irb/protocols/{id}/withdraw"
      - "POST /irb/protocols/{id}/close"
      - "POST /irb/protocols/{id}/consent-documents"
      - "POST /irb/protocols/{id}/modifications"
      - "POST /irb/continuing-reviews/{id}/submit"
      - "POST /irb/protocols/{id}/adverse-events"
    shared_operations:
      - "GET endpoints (read access shared by all roles)"
  - name: Reviewer
    description: "IRB member acting as assigned reviewer; responds to offers, submits recommendations, self-declares conflicts"
    identity: "entity_backed:IrbMember"
    exclusive_operations:
      - "POST /irb/review-assignments/{id}/respond"
      - "POST /irb/review-assignments/{id}/recommendations"
      - "POST /irb/protocols/{id}/conflict-declarations"
    shared_operations:
      - "GET endpoints"
  - name: IrbChair
    description: "Chair (IrbMember with is_chair == true); expedited determinations, consent review, conflict adjudication, convene/vote/adjourn, modification & continuing-review adjudication, reinstatement"
    identity: "entity_backed:IrbMember"
    exclusive_operations:
      - "POST /irb/protocols/{id}/expedited-determination"
      - "POST /irb/consent-documents/{id}/review"
      - "POST /irb/conflict-declarations/{id}/adjudicate"
      - "POST /irb/board-meetings/{id}/convene"
      - "POST /irb/board-meetings/{id}/adjourn"
      - "POST /irb/agenda-items/{id}/vote"
      - "POST /irb/modifications/{id}/adjudicate"
      - "POST /irb/continuing-reviews/{id}/adjudicate"
      - "POST /irb/protocols/{id}/reinstate"
    shared_operations:
      - "GET endpoints"
  - name: IrbCoordinator
    description: "IRB staff; intake returns, determinations, reviewer assignment, meeting scheduling, agenda building"
    identity: "opaque"
    exclusive_operations:
      - "POST /irb/protocols/{id}/return"
      - "POST /irb/protocols/{id}/determinations"
      - "POST /irb/protocols/{id}/review-assignments"
      - "POST /irb/board-meetings"
      - "POST /irb/board-meetings/{id}/agenda-items"
      - "POST /irb/board-meetings/{id}/reschedule"
    shared_operations:
      - "GET endpoints"
  - name: IrbAdmin
    description: "Institutional administrator; investigator/member registry, reliance agreements, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /irb/investigators"
      - "POST /irb/irb-members"
      - "POST /irb/irb-members/{id}/deactivate"
      - "POST /irb/irb-members/{id}/reactivate"
      - "POST /irb/reliance-agreements"
      - "POST /irb/reliance-agreements/{id}/execute"
      - "POST /irb/reliance-agreements/{id}/terminate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
  - name: ComplianceOfficer
    description: "Research-compliance officer; adverse-event triage/disposition, non-compliance case lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /irb/adverse-events/{id}/triage"
      - "POST /irb/adverse-events/{id}/disposition"
      - "POST /irb/protocols/{id}/non-compliance-cases"
      - "POST /irb/non-compliance-cases/{id}/open-investigation"
      - "POST /irb/non-compliance-cases/{id}/issue-finding"
      - "POST /irb/non-compliance-cases/{id}/close"
    shared_operations:
      - "GET endpoints"
