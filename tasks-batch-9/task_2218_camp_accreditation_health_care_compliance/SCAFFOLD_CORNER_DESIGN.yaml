      - name: pending_plan_shelters_the_finding_from_escalation_but_late_review_and_a_fourth_plan_are_refused
        claim_type: Temporal validation
        grounds:
          - validations[priority 25]
          - validations[priority 44]
          - validations[priority 54]
          - errors[ERR_DEFICIENCY_INVALID_STATE]
          - errors[ERR_PLAN_REVISION_LIMIT]
          - errors[ERR_CORRECTION_WINDOW_EXPIRED]
          - state_machines[Deficiency].transitions.PLAN_SUBMITTED_to_PLAN_SUBMITTED
        distinguishing_aspect: "The self-loop lets the camp burn all three revisions without any office action, so the fourth plan is refused on the revision budget rather than on state; and because PLAN_SUBMITTED is sheltered from clock escalation, the finding survives the deadline and the office's own late review is what fails - with the state rule at priority 25 still outranking the expired window on a WAIVE that the status never admitted."
        test_recipe:
          setup:
