      - name: caseload_full_rejection
        claim_type: violation_to_error
        grounds:
          - "validations[priority=22]"
          - "errors[ERR_CASELOAD_FULL]"
        distinguishing_aspect: "Assigning a student to a counselor whose caseload_count == max_caseload fails ERR_CASELOAD_FULL."
        test_recipe:
          setup:
            - "counselor c_full with max_caseload 1 already owning 1 student"
          setup_api_calls:
