      - name: calc_provisional_and_final_credit_quantities_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.credit_quantity
        excluded_because:
          difficulty_instance: dv_credit_quantity_provisional_vs_final_diverge_after_material_finding
          rationale: "The PROVISIONAL/FINAL divergence and its cent-level revaluation is the entire subject of the named §1.8 dual_variant instance."

      - name: calc_pathway_ci_variant_is_selected_by_the_trigger_not_the_payload
        claim_type: variant_selection
        grounds:
          - calculations.pathway_ci_score
        excluded_because:
          difficulty_instance: dv_pathway_ci_certified_variant_uses_design_constant_verified_uses_measured_process
          rationale: "Which CI variant runs - certification decision versus audit fieldwork - is pinned by the named §1.8 dual_variant instance, including the shared-input equality it forces."

      - name: calc_credit_ledger_reconciles_after_issue_and_reverse
        claim_type: reconciliation
        grounds:
          - calculations.credit_control_invariant
        excluded_because:
          difficulty_instance: comp_credit_control_credits_return_to_zero_residual_after_issue_then_reverse
          rationale: "The credit control-total reconciliation is the named §1.8 conservation instance; repeating it here would duplicate the same ledger walk."

      - name: calc_dairy_share_residual_cent_ordering
        claim_type: waterfall_allocation
        grounds:
          - calculations.dairy_share_allocation
        excluded_because:
          difficulty_instance: cf_dairy_share_floor_per_line_then_residual_cent_by_committed_tonnage
          rationale: "Floor-per-line plus deterministic residual-cent distribution is the named §1.8 compound_formula instance, which needs three share lines to be observable."

