      - name: taproom_staff_cannot_confirm_a_shipment
        claim_type: Role denial
        grounds:
          - roles.TaproomStaff
          - roles.SalesRep
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /shipments/{id}/confirm lists only SalesRep and PlatformAdmin, so a TaproomStaff caller is refused with ERR_UNAUTHORIZED and the shipment stays DRAFT."
        test_recipe:
          setup: ["One ACTIVE account with a DRAFT shipment."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_name: "Role Test Co", channel: "WHOLESALE_DISTRIBUTOR", credit_limit: 1000.0 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: SalesRep
            - call: "POST /shipments"
              payload: { account_id: "${acct_id}" }
              as: SalesRep
              as_user_id: "sales-1"
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /shipments/${ship_id}/confirm"
              payload: {}
              as: TaproomStaff
              as_user_id: "tap-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_UNAUTHORIZED with HTTP 403"
            - "Shipment.${ship_id}.status == DRAFT"

      - name: a_subscriber_cannot_pause_a_subscription_they_do_not_own
        claim_type: Ownership
        grounds:
          - roles.Subscriber
          - validations[priority=4]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Subscriber identity is entity_backed:Subscription, so an X-User-ID equal to subscription A's id may not pause subscription B; B stays ACTIVE."
        test_recipe:
          setup: ["Two ACTIVE subscriptions on the same recipe."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_email: "a@example.com", subscriber_birth_date: "1991-01-01T00:00:00.000Z", preferred_recipe_id: "${rec_id}" }
              as: PlatformAdmin
              captures: { sub_a: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_email: "b@example.com", subscriber_birth_date: "1991-01-01T00:00:00.000Z", preferred_recipe_id: "${rec_id}" }
              as: PlatformAdmin
              captures: { sub_b: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_b}/pause"
              payload: { start_date: "2026-05-05T00:00:00.000Z", end_date: "2026-05-11T00:00:00.000Z" }
              as: Subscriber
              as_user_id: "${sub_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_UNAUTHORIZED with HTTP 403"
            - "Subscription.${sub_b}.status == ACTIVE"
            - "Subscription.${sub_b}.current_pause_start_date == null"

      - name: platform_admin_is_still_bound_by_the_label_segregation_rule
        claim_type: Segregation of duties
        grounds:
          - roles.PlatformAdmin
          - validations[priority=49]
          - state_machines.LabelApproval.approve_revision
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "PlatformAdmin passes the role check on both endpoints, yet the same X-User-ID submitting and then approving one revision is refused with ERR_SEGREGATION_OF_DUTIES; the revision stays SUBMITTED."
        test_recipe:
          setup: ["One recipe with a DRAFT label revision whose declared elements already cover the required set."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /label-approvals"
              payload: { recipe_id: "${rec_id}", abv_class: "NON_ALCOHOLIC", pasteurized: false, declared_elements: ["PRODUCT_NAME", "NET_CONTENTS", "INGREDIENTS", "PRODUCER_ADDRESS", "LOT_CODE", "BEST_BY", "NON_ALCOHOLIC_STATEMENT", "CONTAINS_LESS_THAN_HALF_PERCENT_ALCOHOL", "KEEP_REFRIGERATED", "LIVE_CULTURES"] }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { la_id: $.data.id }
            - call: "POST /label-approvals/${la_id}/submit"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /label-approvals/${la_id}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "LabelApproval.${la_id}.status == SUBMITTED"
            - "LabelApproval.${la_id}.approved_by_user_id == null"
            - "LabelApproval.${la_id}.approved_recipe_version_number == null"
            - "Recipe.${rec_id}.active_label_approval_id == null"

