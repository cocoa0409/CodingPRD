            - "T1: ${t1_req_open} == 1 — linking does NOT change the requester's open count"
            - "COMPENSATED: ${p1_status_final} == ABANDONED"
            - "T2 (post-compensation): ${t2_open} == 1, ${t2_linked} == 0, ${t2_terminal} == 1, ${t2_total} == 2 and 1 + 0 + 1 == 2 — byte-identical to T0"
            - "T2: ${t2_req_open} == 1, unchanged across BOTH actions (the compensation must not double-decrement the requester bucket)"
            - "CitizenComplaint.${x1_id}.status == OPEN and CitizenComplaint.${x1_id}.linked_project_id == null"
            - "CitizenComplaint.${x1_id}.reopen_count == 1 — the only lasting trace of the round trip"
            - "CitizenComplaint.${x2_id}.status == CLOSED_NO_ACTION and CitizenComplaint.${x2_id}.reopen_count == 0 (the terminal bucket occupant was never touched by either action)"
            - "the partition identity complaint_open_count + complaint_linked_count + complaint_terminal_count == complaint_total_count holds at all three observation points"
