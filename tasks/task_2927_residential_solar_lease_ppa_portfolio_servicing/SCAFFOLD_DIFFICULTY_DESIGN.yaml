  - rule_id: cross_entity_state_dependency
    instances:

      - name: clear_title_requires_every_ucc_filing_subordinated
        grounds:
          - validations[priority=12].title_not_clear
          - errors[ERR_TITLE_NOT_CLEAR]
          - state_machines.UccFiling.FILED_to_SUBORDINATION_REQUESTED
          - state_machines.UccFiling.SUBORDINATION_REQUESTED_to_SUBORDINATED
          - state_machines.TransferCase.CREDIT_APPROVED_to_TITLE_CLEARED
        distinguishing_aspect: |
          Whether clear-title succeeds is decided entirely by the status of a DIFFERENT
          entity, and by a three-valued distinction on it: FILED is not clear,
          SUBORDINATION_REQUESTED is still not clear (a requested-but-unrecorded
          subordination is the trap), and only SUBORDINATED lets the case through. The
          case's own fields never change across the two rejections.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE PPA agreement: start 2025-01-01, escalator 0.029, base rate 14750, 9600 kWh."
            - "One UccFiling FIXTURE_FILING filed 2025-01-15 in CA-ALAMEDA, in FILED."
            - "One ASSUMPTION TransferCase closing 2026-09-01, moved to CREDIT_APPROVED by u_credit_1 (buyer fico 760, dti 0.05, income 3000000 -> composite 86.67)."
