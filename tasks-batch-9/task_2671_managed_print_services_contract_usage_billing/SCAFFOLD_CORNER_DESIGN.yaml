# §1.9 Scaffold Corner Design - Managed Print Services Contract & Usage Billing (task 2671)
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Sections and claim_types come from
# references/claim-extraction-guide.md; corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# are emitted as `excluded_because:` stubs naming the covering §1.8 instance.
# Logical clock: every chain that depends on time pins it with POST /_clock/set_current_utc.
scaffold_corner_design:
  - section: entities
    instances:
      - name: creation_service_contract_starts_draft_with_zeroed_ledgers
        claim_type: creation
        grounds:
          - entities.ServiceContract
          - endpoints.POST_/service-contracts
          - state_machines.ServiceContract.initial_state
        distinguishing_aspect: "POST /service-contracts with all required fields returns 201 and echoes every input verbatim, with status DRAFT and all five computed ledgers at 0 - no ledger may start null."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 20000, minimum_color_pages_per_period: 2000, monthly_service_fee_cents: 48000, response_sla_hours_critical: 4, response_sla_hours_standard: 24, labor_rate_cents_per_hour: 9500, early_termination_fee_cents: 480000 }
              as: AccountManager
              captures: { c1: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ServiceContract.${c1}.customer_name == Larkin Mfg"
            - "ServiceContract.${c1}.term_months == 36"
            - "ServiceContract.${c1}.included_service_scope == BASIC"
            - "ServiceContract.${c1}.status == DRAFT"
            - "ServiceContract.${c1}.active_device_count == 0"
            - "ServiceContract.${c1}.consumables_committed_cents == 0"
            - "ServiceContract.${c1}.true_up_balance_cents == 0"
            - "ServiceContract.${c1}.lifetime_billed_cents == 0"
            - "ServiceContract.${c1}.suspension_count == 0"
            - "ServiceContract.${c1}.suspension_reason == NONE"
            - "ServiceContract.${c1}.version == 1"

      - name: retrieval_device_returns_stored_and_system_initialised_fields
        claim_type: retrieval
        grounds:
          - entities.Device
          - endpoints.GET_/devices/{id}
        distinguishing_aspect: "GET /devices/{id} returns the row as stored: input fields verbatim, lifecycle_state ASSESSED, supply_state SUPPLY_OK, toner_level_pct 100, every meter watermark 0 and last_read_at null."
        test_recipe:
          setup:
            - "a DRAFT contract with a MONO tier-1 row and one site; one device registered but never placed"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /sites"
              payload: { contract_id: "${c1}", name: "Plant 1", address_region: "NE-01", toner_unit_cap: 4, network_vlan_tag: 2001 }
              as: AccountManager
              captures: { s1: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", asset_tag: "MPS-0001", model_code: "XR-M4200", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 0, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500, color_capable: false }
              as: FleetOpsController
              captures: { d1: $.data.id }
          trigger:
            - call: "GET /devices/${d1}"
              payload: {}
              as: FleetOpsController
          assert:
            - "HTTP status == 200"
            - "Device.${d1}.asset_tag == MPS-0001"
            - "Device.${d1}.model_code == XR-M4200"
            - "Device.${d1}.rated_monthly_duty_cycle == 20000"
            - "Device.${d1}.lifecycle_state == ASSESSED"
            - "Device.${d1}.supply_state == SUPPLY_OK"
            - "Device.${d1}.toner_level_pct == 100"
            - "Device.${d1}.last_accepted_mono_meter == 0"
            - "Device.${d1}.last_accepted_color_meter == 0"
            - "Device.${d1}.last_read_at == null"
            - "Device.${d1}.right_sizing_action == NONE"
            - "Device.${d1}.refresh_due == false"
            - "Device.${d1}.removal_order_id == null"
            - "Device.${d1}.secure_release_enrolled == false"

      - name: listing_devices_filters_by_contract_and_reports_pagination_totals
        claim_type: listing
        grounds:
          - endpoints.GET_/devices
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /devices?contract_id=…&limit=2&offset=0 returns exactly 2 of the 3 devices of that contract with total_count 3 and has_more true; the other contract's device never appears."
        test_recipe:
          setup:
            - "contract C1 with site S1 and three devices MPS-0001..0003; a second contract C2 with site S2 and one device MPS-0009"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-contracts"
              payload: { customer_name: "Orbit Legal", term_months: 24, included_service_scope: "FULL", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 30000 }
              as: AccountManager
              captures: { c2: $.data.id }
            - call: "POST /sites"
              payload: { contract_id: "${c1}", name: "Plant 1", address_region: "NE-01", toner_unit_cap: 4, network_vlan_tag: 2001 }
              as: AccountManager
              captures: { s1: $.data.id }
            - call: "POST /sites"
              payload: { contract_id: "${c2}", name: "Tower 9", address_region: "SE-02", toner_unit_cap: 4, network_vlan_tag: 2002 }
              as: AccountManager
              captures: { s2: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", asset_tag: "MPS-0001", model_code: "XR-M4200", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 0, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500, color_capable: false }
              as: FleetOpsController
              captures: { d1: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", asset_tag: "MPS-0002", model_code: "XR-M4200", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 0, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500, color_capable: false }
              as: FleetOpsController
              captures: { d2: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", asset_tag: "MPS-0003", model_code: "XR-M4200", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 0, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500, color_capable: false }
              as: FleetOpsController
              captures: { d3: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c2}", site_id: "${s2}", asset_tag: "MPS-0009", model_code: "XR-M4200", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 0, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500, color_capable: false }
              as: FleetOpsController
              captures: { d9: $.data.id }
          trigger:
            - call: "GET /devices"
              payload: { contract_id: "${c1}", limit: 2, offset: 0 }
              as: FleetOpsController
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "the response contains exactly 2 devices"
            - "meta/total_count == 3"
            - "has_more == true"
            - "device ${d9} is NOT in the returned page"
            - "GET /devices?contract_id=${c1}&limit=2&offset=2 returns exactly 1 device with has_more == false"

      - name: not_found_unknown_path_ids_return_the_resource_specific_404
        claim_type: not_found
        grounds:
          - validations.priority_3_existence
          - errors[ERR_DEVICE_NOT_FOUND]
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
        distinguishing_aspect: "Each path-templated GET resolves its own id and answers with the resource-specific 404 error_id, not a generic one; a random well-formed UUID never leaks another resource's error."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /devices/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: FleetOpsController
            - call: "GET /sites/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: AccountManager
            - call: "GET /service-contracts/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: AccountManager
            - call: "GET /billing-periods/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: BillingAnalyst
            - call: "GET /meter-reads/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: FleetOpsController
            - call: "GET /billing-statements/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: BillingAnalyst
            - call: "GET /consumable-orders/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: FleetOpsController
            - call: "GET /service-tickets/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: FleetOpsController
            - call: "GET /quarterly-reviews/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: AccountManager
            - call: "GET /removal-orders/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
              payload: {}
              as: AccountManager
          assert:
            - "trigger call 1 returns HTTP status 404 with error.id == ERR_DEVICE_NOT_FOUND"
            - "trigger call 2 returns HTTP status 404 with error.id == ERR_SITE_NOT_FOUND"
            - "trigger call 3 returns HTTP status 404 with error.id == ERR_CONTRACT_NOT_FOUND"
            - "trigger call 4 returns HTTP status 404 with error.id == ERR_PERIOD_NOT_FOUND"
            - "trigger call 5 returns HTTP status 404 with error.id == ERR_METER_READ_NOT_FOUND"
            - "trigger call 6 returns HTTP status 404 with error.id == ERR_STATEMENT_NOT_FOUND"
            - "trigger call 7 returns HTTP status 404 with error.id == ERR_ORDER_NOT_FOUND"
            - "trigger call 8 returns HTTP status 404 with error.id == ERR_TICKET_NOT_FOUND"
            - "trigger call 9 returns HTTP status 404 with error.id == ERR_REVIEW_NOT_FOUND"
            - "trigger call 10 returns HTTP status 404 with error.id == ERR_REMOVAL_ORDER_NOT_FOUND"
            - "every error response carries response_type == error and a non-empty message"

      - name: required_fields_device_create_without_asset_tag_is_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_4_business_constraint_ERR_INVALID_REQUEST
          - endpoints.POST_/devices
        distinguishing_aspect: "asset_tag has source input with no default, so omitting it must fail with ERR_INVALID_REQUEST (422) and persist nothing - not default to an empty string."
        test_recipe:
          setup:
            - "a DRAFT contract with one site"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /sites"
              payload: { contract_id: "${c1}", name: "Plant 1", address_region: "NE-01", toner_unit_cap: 4, network_vlan_tag: 2001 }
              as: AccountManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", model_code: "XR-M4200", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 0, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500 }
              as: FleetOpsController
          assert:
            - "HTTP status == 422"
            - "error.id == ERR_INVALID_REQUEST"
            - "GET /devices?contract_id=${c1} returns exactly 0 devices"

      - name: defaults_omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Site.fields.toner_unit_cap
          - entities.Device.fields.color_capable
          - entities.Technician.fields.travel_buffer_minutes
          - entities.ServiceContract.fields.response_sla_hours_critical
        distinguishing_aspect: "Omitting every optional input yields the declared defaults exactly: contract SLA 4/24 h, labor rate 9500, ETF 0; site toner_unit_cap 4 and network_vlan_tag null; technician travel_buffer_minutes 30; device color_capable false."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /sites"
              payload: { contract_id: "${c1}", name: "Plant 1", address_region: "NE-01" }
              as: AccountManager
              captures: { s1: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tess Rowan", home_region: "NE-01", skill_level: "L3" }
              as: AccountManager
              captures: { t1: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", asset_tag: "MPS-0001", model_code: "XR-M4200", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 0, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500 }
              as: FleetOpsController
              captures: { d1: $.data.id }
          assert:
            - "ServiceContract.${c1}.response_sla_hours_critical == 4"
            - "ServiceContract.${c1}.response_sla_hours_standard == 24"
            - "ServiceContract.${c1}.labor_rate_cents_per_hour == 9500"
            - "ServiceContract.${c1}.early_termination_fee_cents == 0"
            - "Site.${s1}.toner_unit_cap == 4"
            - "Site.${s1}.network_vlan_tag == null"
            - "Site.${s1}.release_method == NONE"
            - "Site.${s1}.secure_release_state == UNCONFIGURED"
            - "Technician.${t1}.travel_buffer_minutes == 30"
            - "Technician.${t1}.open_dispatch_count == 0"
            - "Device.${d1}.color_capable == false"
            - "Device.${d1}.pages_since_last_cartridge == 0"

      - name: computed_fields_active_device_count_tracks_placement_not_registration
        claim_type: computed_fields
        grounds:
          - entities.ServiceContract.fields.active_device_count
          - state_machines.Device.ASSESSED_to_PLACED
        distinguishing_aspect: "active_device_count is computed from placements, not registrations: it stays 0 while two devices sit in ASSESSED and becomes 1 only after the first place call, 2 after the second."
        test_recipe:
          setup:
            - "ACTIVE contract with a MONO tier-1 row, one CONFIGURED-eligible site and two registered devices in ASSESSED"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "MONO", tier_index: 1, from_page: 1, rate_micro_dollars_per_page: 9375 }
              as: AccountManager
            - call: "POST /technicians"
              payload: { full_name: "Tess Rowan", home_region: "NE-01", skill_level: "L3", travel_buffer_minutes: 30 }
              as: AccountManager
              captures: { t1: $.data.id }
            - call: "POST /sites"
              payload: { contract_id: "${c1}", name: "Plant 1", address_region: "NE-01", toner_unit_cap: 4, network_vlan_tag: 2001 }
              as: AccountManager
              captures: { s1: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", asset_tag: "MPS-0001", model_code: "XR-M4200", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 0, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500, color_capable: false }
              as: FleetOpsController
              captures: { d1: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", asset_tag: "MPS-0002", model_code: "XR-M4200", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 0, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500, color_capable: false }
              as: FleetOpsController
              captures: { d2: $.data.id }
            - call: "POST /service-contracts/${c1}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /devices/${d1}/place"
              payload: {}
              as: FieldTechnician
              as_user_id: "${t1}"
            - call: "POST /devices/${d2}/place"
              payload: {}
              as: FieldTechnician
              as_user_id: "${t1}"
          assert:
            - "before trigger call 1, ServiceContract.${c1}.active_device_count == 0"
            - "after trigger call 1, ServiceContract.${c1}.active_device_count == 1"
            - "after trigger call 2, ServiceContract.${c1}.active_device_count == 2"
            - "Device.${d1}.lifecycle_state == PLACED"
            - "Device.${d2}.lifecycle_state == PLACED"

      - name: system_fields_id_timestamps_and_version_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.ServiceContract
          - complexity_profile.consistency_model
        distinguishing_aspect: "id is a bare UUID with no type prefix, created_at/updated_at are ISO 8601 UTC with three fractional digits, version starts at 1 and increments by exactly one per mutation (activate then suspend gives 3)."
        test_recipe:
          setup:
            - "a DRAFT contract with a MONO tier-1 row, ready to activate"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "MONO", tier_index: 1, from_page: 1, rate_micro_dollars_per_page: 9375 }
              as: AccountManager
          trigger:
            - call: "POST /service-contracts/${c1}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /service-contracts/${c1}/suspend"
              payload: { reason: "DISPUTE" }
              as: AccountManager
          assert:
            - "ServiceContract.${c1}.id is a bare UUID with no type prefix"
            - "ServiceContract.${c1}.created_at is ISO 8601 UTC with three fractional digits"
            - "ServiceContract.${c1}.version == 3"
            - "ServiceContract.${c1}.updated_at > ServiceContract.${c1}.created_at"
            - "ServiceContract.${c1}.status == SUSPENDED"
            - "ServiceContract.${c1}.suspension_reason == DISPUTE"
            - "ServiceContract.${c1}.suspension_count == 1"

      - name: type_constraints_invalid_enum_and_out_of_range_numbers_are_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_4_business_constraint_ERR_INVALID_REQUEST
          - entities.Site.fields.release_method
          - entities.Site.fields.network_vlan_tag
          - entities.ServiceContract.fields.term_months
        distinguishing_aspect: "Enum members outside the declared set (release_method FACE_ID, severity URGENT) and numbers outside the declared range (network_vlan_tag 9000, term_months 6, limit 500) all fail with ERR_INVALID_REQUEST (422) and never persist."
        test_recipe:
          setup:
            - "a DRAFT contract with one site"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /sites"
              payload: { contract_id: "${c1}", name: "Plant 1", address_region: "NE-01", toner_unit_cap: 4, network_vlan_tag: 2001 }
              as: AccountManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /sites/${s1}/secure-release-config"
              payload: { release_method: "FACE_ID", probe_result: "PASS", network_vlan_tag: 2001 }
              as: CustomerAdmin
              as_user_id: "${s1}"
            - call: "POST /sites/${s1}/secure-release-config"
              payload: { release_method: "PIN", probe_result: "PASS", network_vlan_tag: 9000 }
              as: CustomerAdmin
              as_user_id: "${s1}"
            - call: "POST /service-contracts"
              payload: { customer_name: "Too Short", term_months: 6, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 1000 }
              as: AccountManager
            - call: "GET /devices"
              payload: { contract_id: "${c1}", limit: 500 }
              as: FleetOpsController
          assert:
            - "trigger call 1 returns HTTP status 422 with error.id == ERR_INVALID_REQUEST"
            - "trigger call 2 returns HTTP status 422 with error.id == ERR_INVALID_REQUEST"
            - "trigger call 3 returns HTTP status 422 with error.id == ERR_INVALID_REQUEST"
            - "trigger call 4 returns HTTP status 422 with error.id == ERR_INVALID_REQUEST"
            - "Site.${s1}.secure_release_state == UNCONFIGURED"
            - "Site.${s1}.release_method == NONE"
            - "Site.${s1}.network_vlan_tag == 2001"

      - name: immutability_cost_tier_rows_carry_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.CostTier
          - endpoints.GET_/service-contracts/{id}/cost-tiers
        distinguishing_aspect: "CostTier declares common_fields false, so its rows expose only id and created_at - no version, no updated_at - and §1.5 offers no PUT/PATCH/DELETE for them; the rate card is append-only."
        test_recipe:
          setup:
            - "a DRAFT contract with two MONO tier rows (1..20000 @9375 and 20001..null @7333)"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "MONO", tier_index: 1, from_page: 1, to_page: 20000, rate_micro_dollars_per_page: 9375 }
              as: AccountManager
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "MONO", tier_index: 2, from_page: 20001, rate_micro_dollars_per_page: 7333 }
              as: AccountManager
          trigger:
            - call: "GET /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "MONO" }
              as: AccountManager
          assert:
            - "HTTP status == 200"
            - "the response contains exactly 2 cost tiers"
            - "each returned tier exposes id and created_at and does NOT expose version or updated_at"
            - "the tier with tier_index 1 has from_page == 1, to_page == 20000, rate_micro_dollars_per_page == 9375"
