              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINOCC001", plate: "OCC1", make: "Honda", model: "Fit", odometer: 1000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 1000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/begin-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v_pre: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { inspection_item_id: "${item_a}", expected_work_order_version: "${wo_v_pre}" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
