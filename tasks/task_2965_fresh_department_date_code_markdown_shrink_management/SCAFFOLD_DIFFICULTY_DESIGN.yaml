            - "the first markdown does NOT return ERR_PRICE_BELOW_COST_FLOOR even though 160 < 168"
            - "the second markdown returns 422 with error_id ERR_PRICE_BELOW_COST_FLOOR"
            - "the second markdown does NOT return ERR_MAX_DISCOUNT_EXCEEDED, because 160 cents is a 73.29 percent discount which is inside max_total_discount_pct 75"
