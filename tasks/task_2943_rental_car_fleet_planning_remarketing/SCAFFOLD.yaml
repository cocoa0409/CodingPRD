scenario: |
  2943. Rental Car Fleet Planning & Remarketing (rental car fleet department): fleet sizing by market, season and segment with utilization and revenue-per-unit targets, vehicle purchase mix across program and risk vehicles with manufacturer repurchase terms, in-fleeting logistics, registration, licensing and preparation before first rent, inter-city redistribution to match demand imbalances with transport cost tradeoffs, holding period optimization against depreciation curves and mileage bands, remarketing channel selection across auction, retail lots and dealer direct with reconditioning decisions, damage recovery and total loss handling in the fleet ledger, residual value forecasting and depreciation policy

domain_name: rental-fleet-planning-remarketing
api_prefix: /fleet

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Quota / allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Vehicle sits at the centre of a many-to-many web: it is claimed by a
  # PurchaseAllocation (which itself joins FleetPlan x ManufacturerProgram x
  # VehicleSegment), occupied by RedistributionOrders that reference TWO
  # Markets, encumbered by DamageEvents, consigned to RemarketingChannels,
  # and projected onto an append-only LedgerEntry stream. DepreciationPolicy
  # is self-referential (supersedes_policy_id -> DepreciationPolicy.id).

  state_machine_shape: parallel
  # Vehicle carries two INDEPENDENT state dimensions that evolve on the same
  # row: `fleet_status` (ON_ORDER..SOLD/TOTAL_LOSS, cyclic through IN_TRANSIT
  # and through HELD_FOR_SALE->IN_SERVICE on withdrawal) and
  # `condition_status` (SOUND..TOTALED, cyclic through RECONDITIONED ->
  # DAMAGE_REPORTED). RedistributionOrder is cyclic
  # (PROPOSED->REJECTED->PROPOSED); Consignment is branching fork-join
  # (DRAFT -> {RECONDITION_PENDING | LISTED} -> LISTED join);
  # PurchaseAllocation and FleetPlan are compound (state derived from
  # children); FleetPlan additionally exposes a derived `posture` that gates
  # every child allocation write.

  relationship_patterns:
    - one_to_many          # FleetPlan -> PurchaseAllocation -> Vehicle
    - many_to_many         # PurchaseAllocation joins FleetPlan x Program x Segment
    - self_referential     # DepreciationPolicy.supersedes_policy_id -> DepreciationPolicy.id
    - polymorphic          # LedgerEntry.source_entity_type / source_entity_id
    - cross_aggregate      # RedistributionOrder spans two Markets and one Vehicle

  role_model: segregation_of_duties
  # The operator id that proposes a RedistributionOrder may not authorize it;
  # the operator id that creates a Consignment may not settle it; the operator
  # id that drafts a DepreciationPolicy may not activate it.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Market
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Airport/city market code, unique across all Markets."
        constraints: "3-5 uppercase letters; unique"
      - name: name
        type: string
        source: input
        description: "Human-readable market name."
      - name: region
        type: enum
        source: input
        description: "Geographic region the market belongs to."
        constraints: "enum: {EAST, CENTRAL, WEST}"
      - name: transport_hub_distance_km
        type: integer
        source: input
        description: "Distance in km from this market to its remarketing hub; drives Consignment.transport_to_channel_cents."
        constraints: ">= 0"
      - name: transfer_cost_per_km_cents
        type: integer
        source: input
        description: "Line-haul rate in cents per km charged when this market is the ORIGIN of a RedistributionOrder."
        constraints: "> 0"
      - name: storage_cost_per_day_cents
        type: integer
        source: input
        description: "Daily yard storage cost in cents for a vehicle held at this market."
        constraints: ">= 0"
      - name: prep_capacity_per_day
        type: integer
        source: input
        description: "Maximum number of PREPARATION InFleetingTasks whose window_start falls on one UTC calendar date at this market."
        constraints: ">= 1"
      - name: registration_lead_days
        type: integer
        source: input
        description: "Advertised lead time in days for title/registration work at this market; informational."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Operational status; SUSPENDED markets cannot receive redistributions or accept new fleet plans."
        default: ACTIVE
        constraints: "enum: {ACTIVE, SUSPENDED}"
      - name: in_service_unit_count
        type: integer
        source: computed
        description: "COUNT of Vehicle rows with current_market_id == this Market.id AND fleet_status == IN_SERVICE. Vehicles in IN_TRANSIT are counted by neither origin nor destination."

  - name: VehicleSegment
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Segment code, unique across all VehicleSegments."
        constraints: "uppercase; unique; e.g. ECONOMY, MIDSIZE, SUV, LUXURY, VAN"
      - name: name
        type: string
        source: input
        description: "Human-readable segment name."
      - name: baseline_daily_rate_cents
        type: integer
        source: input
        description: "Reference daily rental rate in cents for this segment; used by the redistribution payback test."
        constraints: "> 0"
      - name: target_utilization_pct
        type: number
        source: input
        description: "Target utilization as a 0..1 fraction, 4 decimal places."
        constraints: "0 < value <= 1"
      - name: target_revenue_per_unit_month_cents
        type: integer
        source: input
        description: "Target monthly revenue per in-fleet unit in cents."
        constraints: "> 0"
      - name: mileage_band_soft_limit_km
        type: integer
        source: input
        description: "Odometer km above which the vehicle's mileage_band becomes OVER_SOFT."
        constraints: "> 0"
      - name: mileage_band_hard_limit_km
        type: integer
        source: input
        description: "Odometer km above which the vehicle's mileage_band becomes OVER_HARD and the RETAIL_LOT channel is excluded."
        constraints: "> mileage_band_soft_limit_km"
      - name: recondition_cap_cents
        type: integer
        source: input
        description: "Maximum reconditioning spend in cents that may be authorized on one Consignment for a vehicle in this segment."
        constraints: ">= 0"

  - name: ManufacturerProgram
    parent: null
    common_fields: true
    fields:
      - name: manufacturer_name
        type: string
        source: input
        description: "Manufacturer offering the purchase terms."
      - name: program_year
        type: integer
        source: input
        description: "Model year the terms apply to."
      - name: program_type
        type: enum
        source: input
        description: "PROGRAM = manufacturer repurchase guarantee applies; RISK = fleet bears full residual risk."
        constraints: "enum: {PROGRAM, RISK}"
      - name: repurchase_guarantee_pct
        type: number
        source: input
        description: "Fraction of capitalized cost guaranteed at repurchase; MUST be 0 when program_type == RISK."
        constraints: "0 <= value <= 1, 4 decimal places"
      - name: min_holding_days
        type: integer
        source: input
        description: "Minimum days a vehicle must sit IN_SERVICE before it may be moved to HELD_FOR_SALE."
        constraints: ">= 0"
      - name: max_holding_days
        type: integer
        source: input
        description: "Days beyond which PROGRAM_REPURCHASE becomes an ineligible remarketing channel."
        constraints: "> min_holding_days"
      - name: max_eligible_mileage_km
        type: integer
        source: input
        description: "Odometer km beyond which excess-mileage charges apply and PROGRAM_REPURCHASE becomes ineligible."
        constraints: "> 0"
      - name: excess_mileage_charge_cents_per_km
        type: integer
        source: input
        description: "Cents deducted from the repurchase guarantee per km above max_eligible_mileage_km."
        constraints: ">= 0"
      - name: damage_deduction_cap_cents
        type: integer
        source: input
        description: "Ceiling in cents on the aggregate open-damage deduction applied to the repurchase guarantee."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "CLOSED programs cannot back new PurchaseAllocations."
        default: ACTIVE
        constraints: "enum: {ACTIVE, CLOSED}"

  - name: RemarketingChannel
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: "Channel code, unique across all RemarketingChannels."
        constraints: "enum: {AUCTION, RETAIL_LOT, DEALER_DIRECT, PROGRAM_REPURCHASE}; unique"
      - name: name
        type: string
        source: input
        description: "Human-readable channel name."
      - name: fee_pct
        type: number
        source: input
        description: "Selling commission as a 0..1 fraction of gross proceeds, 4 decimal places."
        constraints: "0 <= value < 1"
      - name: fixed_fee_cents
        type: integer
        source: input
        description: "Flat listing/entry fee in cents charged by this channel."
        constraints: ">= 0"
      - name: expected_days_to_sell
        type: integer
        source: input
        description: "Expected days to liquidation; the ASC tie-break key of the channel selector."
        constraints: "> 0"
      - name: expected_proceeds_multiplier
        type: number
        source: input
        description: "Projected gross proceeds as a multiple of net_book_value_cents, 4 decimal places."
        constraints: "> 0"
      - name: recondition_required
        type: boolean
        source: input
        description: "When true, a Consignment on this channel MUST pass through RECONDITION_PENDING before it may be LISTED."
      - name: status
        type: enum
        source: system
        description: "Only ACTIVE channels enter the channel-selector candidate pool."
        default: ACTIVE
        constraints: "enum: {ACTIVE, SUSPENDED}"

  - name: DepreciationPolicy
    parent: null
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: "FK -> VehicleSegment.id; the segment this depreciation curve governs."
      - name: supersedes_policy_id
        type: string
        source: input
        description: "FK -> DepreciationPolicy.id; the currently ACTIVE policy this draft is intended to replace. Null for the first policy on a segment."
        default: null
      - name: name
        type: string
        source: input
        description: "Policy label, e.g. MID-2026-H1."
      - name: monthly_depreciation_pct
        type: number
        source: input
        description: "Fraction of capitalized cost depreciated per whole completed holding month, 4 decimal places."
        constraints: "0 < value < 1"
      - name: mileage_depreciation_cents_per_km
        type: integer
        source: input
        description: "Cents of depreciation charged per odometer km."
        constraints: ">= 0"
      - name: floor_residual_pct
        type: number
        source: input
        description: "Fraction of capitalized cost below which the policy-schedule book value cannot fall, 4 decimal places."
        constraints: "0 < value < 1"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant (three fractional digits) at or after which the policy may be activated."
      - name: created_by_user_id
        type: string
        source: system
        description: "Opaque operator id copied from the X-User-ID header of the create request; the segregation-of-duties subject."
      - name: activated_by_user_id
        type: string
        source: system
        description: "Opaque operator id copied from the X-User-ID header of the activate request; MUST differ from created_by_user_id."
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; exactly one ACTIVE policy per segment at any time."
        default: DRAFT
        constraints: "enum: {DRAFT, ACTIVE, SUPERSEDED}"

  - name: FleetPlan
    parent: Market
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: "FK -> Market.id; the market this sizing plan covers."
      - name: season
        type: enum
        source: input
        description: "Season the plan covers; fixes the planned season length in days (PEAK 92, SHOULDER 122, OFF_PEAK 151)."
        constraints: "enum: {PEAK, SHOULDER, OFF_PEAK}"
      - name: plan_year
        type: integer
        source: input
        description: "Calendar year of the plan. (market_id, season, plan_year) is unique."
        constraints: ">= 2020"
      - name: planned_unit_count
        type: integer
        source: input
        description: "Target fleet size in units for this market/season/segment mix."
        constraints: "> 0"
      - name: revenue_per_unit_target_cents
        type: integer
        source: input
        description: "Revenue-per-unit target in cents for the plan period."
        constraints: "> 0"
      - name: utilization_target_pct
        type: number
        source: input
        description: "Utilization target as a 0..1 fraction, 4 decimal places."
        constraints: "0 < value <= 1"
      - name: allocated_unit_count
        type: integer
        source: computed
        description: "SUM of PurchaseAllocation.unit_count over allocations with plan_id == this FleetPlan.id AND status IN {ORDERED, PARTIALLY_INFLEETED, INFLEETED}. CANCELLED allocations are excluded."
        default: 0
      - name: in_fleeted_unit_count
        type: integer
        source: computed
        description: "COUNT of Vehicle rows whose allocation_id belongs to this plan AND whose fleet_status IN {IN_SERVICE, IN_TRANSIT, HELD_FOR_SALE, SOLD}."
        default: 0
      - name: posture
        type: enum
        source: computed
        description: "Derived gate over child allocation writes. fill_ratio_bp = floor(allocated_unit_count * 10000 / planned_unit_count). OPEN when fill_ratio_bp < 9000; RESTRICTED when 9000 <= fill_ratio_bp < 10000; FROZEN when fill_ratio_bp >= 10000."
        default: OPEN
        constraints: "enum: {OPEN, RESTRICTED, FROZEN}"
      - name: status
        type: enum
        source: system
        description: "DRAFT accepts no allocations; LOCKED accepts allocations; CLOSED is terminal and reached only by the in-fleeting bubble-up cascade."
        default: DRAFT
        constraints: "enum: {DRAFT, LOCKED, CLOSED}"

  - name: PurchaseAllocation
    parent: FleetPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> FleetPlan.id; the plan this purchase lot fills."
      - name: program_id
        type: string
        source: input
        description: "FK -> ManufacturerProgram.id; the purchase terms backing this lot."
      - name: segment_id
        type: string
        source: input
        description: "FK -> VehicleSegment.id; the segment of every vehicle in this lot."
      - name: unit_count
        type: integer
        source: input
        description: "Number of vehicles ordered in this lot."
        constraints: "> 0"
      - name: capitalized_cost_per_unit_cents
        type: integer
        source: input
        description: "Capitalized cost in cents booked for each vehicle created under this lot."
        constraints: "> 0"
      - name: in_fleeted_count
        type: integer
        source: computed
        description: "COUNT of Vehicle rows with allocation_id == this PurchaseAllocation.id AND fleet_status IN {IN_SERVICE, IN_TRANSIT, HELD_FOR_SALE, SOLD}."
        default: 0
      - name: created_vehicle_count
        type: integer
        source: computed
        description: "COUNT of all Vehicle rows with allocation_id == this PurchaseAllocation.id regardless of fleet_status; capped at unit_count."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Compound state derived from child Vehicle fleet_status values, except CANCELLED which is operator-driven."
        default: ORDERED
        constraints: "enum: {ORDERED, PARTIALLY_INFLEETED, INFLEETED, CANCELLED}"

  - name: Vehicle
    parent: PurchaseAllocation
    common_fields: true
    fields:
      - name: allocation_id
        type: string
        source: input
        description: "FK -> PurchaseAllocation.id; the purchase lot that produced this unit."
      - name: segment_id
        type: string
        source: computed
        description: "FK -> VehicleSegment.id; copied from PurchaseAllocation.segment_id at creation and immutable thereafter."
      - name: program_id
        type: string
        source: computed
        description: "FK -> ManufacturerProgram.id; copied from PurchaseAllocation.program_id at creation and immutable thereafter."
      - name: current_market_id
        type: string
        source: input
        description: "FK -> Market.id; the market currently holding the unit. Rewritten only by RedistributionOrder receive."
      - name: vin
        type: string
        source: input
        description: "Vehicle identification number, unique across all Vehicles."
        constraints: "16 characters; unique"
      - name: capitalized_cost_cents
        type: integer
        source: computed
        description: "Copied from PurchaseAllocation.capitalized_cost_per_unit_cents at creation; the CAPITALIZATION ledger amount."
      - name: fleet_status
        type: enum
        source: system
        description: "Lifecycle dimension 1 of 2. Evolves independently of condition_status."
        default: ON_ORDER
        constraints: "enum: {ON_ORDER, IN_FLEETING, IN_SERVICE, IN_TRANSIT, HELD_FOR_SALE, SOLD, TOTAL_LOSS}"
      - name: condition_status
        type: enum
        source: system
        description: "Lifecycle dimension 2 of 2. Evolves independently of fleet_status."
        default: SOUND
        constraints: "enum: {SOUND, DAMAGE_REPORTED, RECONDITIONING, RECONDITIONED, TOTALED}"
      - name: odometer_km
        type: integer
        source: input
        description: "Absolute odometer reading in km; monotonically non-decreasing."
        default: 0
        constraints: ">= 0"
      - name: rented_days_total
        type: integer
        source: computed
        description: "Cumulative rented days, advanced only by POST /fleet/vehicles/{vehicle_id}/usage."
        default: 0
      - name: available_days_total
        type: integer
        source: computed
        description: "Cumulative fleet-available days, advanced only by POST /fleet/vehicles/{vehicle_id}/usage."
        default: 0
      - name: revenue_to_date_cents
        type: integer
        source: computed
        description: "Cumulative rental revenue in cents, advanced only by POST /fleet/vehicles/{vehicle_id}/usage."
        default: 0
      - name: registered_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the REGISTRATION InFleetingTask was COMPLETED (or WAIVED). ISO 8601 UTC, three fractional digits."
        default: null
      - name: licensed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the LICENSING InFleetingTask was COMPLETED (or WAIVED)."
        default: null
      - name: prep_completed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the PREPARATION InFleetingTask was COMPLETED (or WAIVED)."
        default: null
      - name: first_rent_ready_at
        type: datetime
        source: system
        description: "Logical-clock instant at which all three InFleetingTask types became resolved and fleet_status flipped IN_FLEETING -> IN_SERVICE. Equals in_service_at."
        default: null
      - name: in_service_at
        type: datetime
        source: system
        description: "Logical-clock instant of the first IN_FLEETING -> IN_SERVICE transition; the holding-period clock start. Never rewritten by later IN_TRANSIT round trips."
        default: null
      - name: held_for_sale_at
        type: datetime
        source: system
        description: "Logical-clock instant of the IN_SERVICE -> HELD_FOR_SALE transition; freezes the holding period and the disposal book value. Cleared to null when a Consignment is withdrawn."
        default: null
      - name: net_book_value_at_hold_cents
        type: integer
        source: system
        description: "net_book_value_cents frozen at the instant of the IN_SERVICE -> HELD_FOR_SALE transition; the disposal gain/loss baseline. Cleared to null on Consignment withdrawal."
        default: null
      - name: total_recondition_cents
        type: integer
        source: computed
        description: "SUM of LedgerEntry.amount_cents for this vehicle with entry_type IN {RECONDITION_COST, RECONDITION_REVERSAL}. Returns to 0 after a withdrawal reversal."
        default: 0
      - name: net_book_value_cents
        type: integer
        source: computed
        description: "Output of the vehicle_residual_valuation calculation under the variant selected by ManufacturerProgram.program_type."

  - name: InFleetingTask
    parent: Vehicle
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the unit being made rent-ready."
      - name: market_id
        type: string
        source: computed
        description: "FK -> Market.id; copied from Vehicle.current_market_id at task creation; the prep-bay capacity scope."
      - name: task_type
        type: enum
        source: input
        description: "Which in-fleeting step this task represents. At most one non-superseded task per (vehicle_id, task_type)."
        constraints: "enum: {REGISTRATION, LICENSING, PREPARATION}"
      - name: cost_cents
        type: integer
        source: input
        description: "Cost in cents posted to the fleet ledger as PREP_COST when the task is COMPLETED. Not posted on WAIVED."
        constraints: ">= 0"
      - name: bay_code
        type: string
        source: input
        description: "Prep bay identifier at market_id. REQUIRED when task_type == PREPARATION, MUST be omitted otherwise."
        default: null
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the prep bay occupation. REQUIRED when task_type == PREPARATION, MUST be omitted otherwise. ISO 8601 UTC."
        default: null
      - name: window_end
        type: datetime
        source: input
        description: "Inclusive end of the prep bay occupation. REQUIRED when task_type == PREPARATION, MUST be omitted otherwise. ISO 8601 UTC."
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the task was COMPLETED or WAIVED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Task lifecycle. COMPLETED posts PREP_COST; WAIVED posts nothing but still counts as resolved for the in-fleeting bubble-up."
        default: PENDING
        constraints: "enum: {PENDING, COMPLETED, WAIVED}"

  - name: RedistributionOrder
    parent: Vehicle
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the unit being repositioned."
      - name: origin_market_id
        type: string
        source: computed
        description: "FK -> Market.id; copied from Vehicle.current_market_id at order creation and immutable thereafter."
      - name: destination_market_id
        type: string
        source: input
        description: "FK -> Market.id; the market the unit is being moved to. MUST differ from origin_market_id."
      - name: distance_km
        type: integer
        source: input
        description: "Line-haul distance in km used by the transport-cost tier calculation."
        constraints: "> 0"
      - name: planned_depart_at
        type: datetime
        source: input
        description: "Planned start of the vehicle's transfer occupation window (inclusive). ISO 8601 UTC."
      - name: planned_receive_at
        type: datetime
        source: input
        description: "Planned end of the vehicle's transfer occupation window (exclusive). MUST be strictly after planned_depart_at."
      - name: proposed_by_user_id
        type: string
        source: system
        description: "Opaque operator id copied from X-User-ID on the propose call; the segregation-of-duties subject. Rewritten on every re-propose."
        default: null
      - name: authorized_by_user_id
        type: string
        source: system
        description: "Opaque operator id copied from X-User-ID on the authorize call; MUST differ from proposed_by_user_id."
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: "Number of REJECTED -> PROPOSED re-submissions performed on this order. Incremented by the re-propose transition only."
        default: 0
      - name: rejection_reason
        type: string
        source: input
        description: "Free-text reason recorded on the PROPOSED -> REJECTED transition."
        default: null
      - name: estimated_transport_cost_cents
        type: integer
        source: computed
        description: "Output of the redistribution_transport_cost calculation, frozen at order creation."
      - name: actual_transport_cost_cents
        type: integer
        source: input
        description: "Invoiced haul cost in cents supplied on receive; posted to the ledger as TRANSPORT_COST."
        default: null
      - name: depart_at
        type: datetime
        source: system
        description: "Logical-clock instant of the AUTHORIZED -> IN_TRANSIT transition."
        default: null
      - name: receive_at
        type: datetime
        source: system
        description: "Logical-clock instant of the IN_TRANSIT -> RECEIVED transition."
        default: null
      - name: status
        type: enum
        source: system
        description: "Cyclic lifecycle: PROPOSED -> REJECTED -> PROPOSED is a legal revision loop bounded by MAX_REVISIONS."
        default: DRAFT
        constraints: "enum: {DRAFT, PROPOSED, REJECTED, AUTHORIZED, IN_TRANSIT, RECEIVED, CANCELLED}"

  - name: DamageEvent
    parent: Vehicle
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the damaged unit."
      - name: market_id
        type: string
        source: computed
        description: "FK -> Market.id; copied from Vehicle.current_market_id at report time."
      - name: damage_type
        type: enum
        source: input
        description: "Damage classification."
        constraints: "enum: {COLLISION, HAIL, VANDALISM, MECHANICAL}"
      - name: estimate_cents
        type: integer
        source: input
        description: "Repair estimate in cents; the numerator of the total-loss ratio test."
        constraints: "> 0"
      - name: net_book_value_at_report_cents
        type: integer
        source: system
        description: "net_book_value_cents frozen at the instant the damage was reported; the denominator of the total-loss ratio test."
      - name: total_loss_required
        type: boolean
        source: computed
        description: "TRUE iff estimate_cents * 10000 >= net_book_value_at_report_cents * TOTAL_LOSS_THRESHOLD_BP. Frozen at report time."
      - name: recovery_source
        type: enum
        source: input
        description: "Party pursued for recovery; set by the open-recovery transition."
        default: null
        constraints: "enum: {CUSTOMER, THIRD_PARTY_INSURER, OWN_INSURANCE}"
      - name: recovered_cents
        type: integer
        source: input
        description: "Amount recovered in cents, supplied on settle-recovery."
        default: null
      - name: recovery_alloc_recondition_cents
        type: integer
        source: computed
        description: "Bucket 1 of the recovery waterfall: min(recovered_cents, Vehicle.total_recondition_cents)."
        default: null
      - name: recovery_alloc_depreciation_cents
        type: integer
        source: computed
        description: "Bucket 2 of the recovery waterfall: min(recovered_cents - bucket1, max(0, estimate_cents - Vehicle.total_recondition_cents))."
        default: null
      - name: recovery_alloc_income_cents
        type: integer
        source: computed
        description: "Bucket 3 of the recovery waterfall: recovered_cents - bucket1 - bucket2."
        default: null
      - name: salvage_proceeds_cents
        type: integer
        source: input
        description: "Salvage proceeds in cents supplied on declare-total-loss."
        default: null
      - name: total_loss_gain_loss_cents
        type: integer
        source: computed
        description: "salvage_proceeds_cents + COALESCE(recovered_cents, 0) - net_book_value_at_report_cents; posted as DISPOSAL_GAIN_LOSS."
        default: null
      - name: status
        type: enum
        source: system
        description: "Branching lifecycle: REPORTED forks to RECOVERY_PENDING or directly to TOTAL_LOSS_DECLARED."
        default: REPORTED
        constraints: "enum: {REPORTED, RECOVERY_PENDING, RECOVERED, WRITTEN_OFF, TOTAL_LOSS_DECLARED}"

  - name: Consignment
    parent: Vehicle
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the unit being remarketed."
      - name: channel_id
        type: string
        source: input
        description: "FK -> RemarketingChannel.id; the disposal channel chosen for this consignment."
      - name: created_by_user_id
        type: string
        source: system
        description: "Opaque operator id copied from X-User-ID on the create request; the segregation-of-duties subject for settlement."
      - name: settled_by_user_id
        type: string
        source: system
        description: "Opaque operator id copied from X-User-ID on the settle request; MUST differ from created_by_user_id."
        default: null
      - name: floor_price_cents
        type: integer
        source: computed
        description: "round_half_up(Vehicle.net_book_value_at_hold_cents * FLOOR_PRICE_PCT); frozen at consignment creation. gross_proceeds_cents below this is rejected."
      - name: recondition_authorized_cents
        type: integer
        source: input
        description: "Reconditioning budget in cents approved on the authorize-recondition transition."
        default: null
      - name: recondition_actual_cents
        type: integer
        source: input
        description: "Reconditioning spend in cents reported on the complete-recondition transition; MUST NOT exceed recondition_authorized_cents."
        default: null
      - name: recondition_loaded_cents
        type: integer
        source: computed
        description: "round_half_up(recondition_actual_cents * (1 + RECONDITION_OVERHEAD_PCT)); the amount posted as RECONDITION_COST and the reconditioning line of net proceeds."
        default: null
      - name: gross_proceeds_cents
        type: integer
        source: input
        description: "Hammer/retail price in cents reported on the record-sale transition."
        default: null
      - name: channel_fee_cents
        type: integer
        source: computed
        description: "round_half_up(gross_proceeds_cents * RemarketingChannel.fee_pct) + RemarketingChannel.fixed_fee_cents; computed on record-sale."
        default: null
      - name: transport_to_channel_cents
        type: integer
        source: computed
        description: "round_half_up(Market.transport_hub_distance_km * Market.transfer_cost_per_km_cents * CHANNEL_HAUL_FACTOR) for Vehicle.current_market_id; computed on record-sale."
        default: null
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: "gross_proceeds_cents minus the sum of the three independently rounded cost lines; computed on record-sale."
        default: null
      - name: gain_loss_cents
        type: integer
        source: computed
        description: "net_proceeds_cents - Vehicle.net_book_value_at_hold_cents; posted as DISPOSAL_GAIN_LOSS on settle."
        default: null
      - name: listed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into LISTED."
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of the SOLD_PENDING_SETTLEMENT -> SETTLED transition."
        default: null
      - name: status
        type: enum
        source: system
        description: "Branching fork-join lifecycle: DRAFT forks to RECONDITION_PENDING or straight to LISTED, and both branches join at LISTED."
        default: DRAFT
        constraints: "enum: {DRAFT, RECONDITION_PENDING, LISTED, SOLD_PENDING_SETTLEMENT, SETTLED, WITHDRAWN}"

  - name: LedgerEntry
    parent: Vehicle
    common_fields: false
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the unit this entry is booked against."
      - name: entry_type
        type: enum
        source: system
        description: "Ledger line classification. Sign convention: POSITIVE amount_cents = cost debited to the unit's fleet cost basis; NEGATIVE = credit/recovery/proceeds."
        constraints: "enum: {CAPITALIZATION, PREP_COST, TRANSPORT_COST, RECONDITION_COST, RECONDITION_REVERSAL, CHANNEL_FEE, DAMAGE_RECOVERY, SALVAGE_PROCEEDS, DISPOSAL_PROCEEDS, DISPOSAL_GAIN_LOSS}"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed amount in cents per the sign convention on entry_type."
      - name: source_entity_type
        type: enum
        source: system
        description: "Polymorphic discriminator naming the entity type whose transition emitted this entry."
        constraints: "enum: {Vehicle, InFleetingTask, RedistributionOrder, DamageEvent, Consignment}"
      - name: source_entity_id
        type: string
        source: system
        description: "Polymorphic id of the source_entity_type row that emitted this entry. Deliberately NOT a canonical FK because the target type varies."
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant the entry was posted. ISO 8601 UTC, three fractional digits."
      - name: memo
        type: string
        source: system
        description: "Human-readable provenance string, e.g. 'recovery waterfall recondition 250000 / depreciation 350000 / income 100000'."

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: FleetPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /fleet/fleet-plans/{plan_id}/lock"
        actor: FleetController
        preconditions:
          - "plan.status == DRAFT"
          - "Market(plan.market_id).status == ACTIVE"
        side_effects:
          - "recomputes FleetPlan.posture from allocated_unit_count (0 allocations => fill_ratio_bp 0 => OPEN)"
          - "increments FleetPlan.version by 1"
      - from: LOCKED
        to: CLOSED
        trigger: "system event: a PurchaseAllocation under this plan reached INFLEETED and the recomputed in_fleeted_unit_count >= planned_unit_count"
        actor: system
        preconditions:
          - "plan.status == LOCKED"
          - "FleetPlan.in_fleeted_unit_count >= FleetPlan.planned_unit_count after recompute"
        side_effects:
          - "recomputes FleetPlan.in_fleeted_unit_count and FleetPlan.posture"
          - "increments FleetPlan.version by 1"
        note: "Hop 4 of the in-fleeting cascade. Never reachable by a direct client call."

  - entity: PurchaseAllocation
    initial_state: ORDERED
    terminal_states: [INFLEETED, CANCELLED]
    transitions:
      - from: ORDERED
        to: PARTIALLY_INFLEETED
        trigger: "system event: a child Vehicle entered IN_SERVICE and 0 < in_fleeted_count < unit_count after recompute"
        actor: system
        preconditions:
          - "allocation.status == ORDERED"
          - "0 < recomputed in_fleeted_count < allocation.unit_count"
        side_effects:
          - "recomputes PurchaseAllocation.in_fleeted_count"
          - "increments PurchaseAllocation.version by 1"
      - from: ORDERED
        to: INFLEETED
        trigger: "system event: a child Vehicle entered IN_SERVICE and in_fleeted_count == unit_count after recompute"
        actor: system
        preconditions:
          - "allocation.status == ORDERED"
          - "recomputed in_fleeted_count == allocation.unit_count"
        side_effects:
          - "recomputes PurchaseAllocation.in_fleeted_count"
          - "increments PurchaseAllocation.version by 1"
          - "triggers the FleetPlan LOCKED -> CLOSED evaluation (cascade hop 4)"
        note: "Fires directly from ORDERED when unit_count == 1, skipping PARTIALLY_INFLEETED."
      - from: PARTIALLY_INFLEETED
        to: INFLEETED
        trigger: "system event: a child Vehicle entered IN_SERVICE and in_fleeted_count == unit_count after recompute"
        actor: system
        preconditions:
          - "allocation.status == PARTIALLY_INFLEETED"
          - "recomputed in_fleeted_count == allocation.unit_count"
        side_effects:
          - "recomputes PurchaseAllocation.in_fleeted_count"
          - "increments PurchaseAllocation.version by 1"
          - "triggers the FleetPlan LOCKED -> CLOSED evaluation (cascade hop 4)"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /fleet/purchase-allocations/{allocation_id}/cancel"
        actor: FleetPlanner
        preconditions:
          - "allocation.status == ORDERED"
          - "allocation.created_vehicle_count == 0"
          - "FleetPlan(allocation.plan_id).status == LOCKED"
        side_effects:
          - "recomputes FleetPlan.allocated_unit_count by subtracting allocation.unit_count"
          - "recomputes FleetPlan.posture from the new allocated_unit_count"
          - "increments FleetPlan.version by 1 and PurchaseAllocation.version by 1"
        note: "Compensating action for the allocation-create forward action; conserves FleetPlan.allocated_unit_count."

  - entity: Vehicle
    initial_state: ON_ORDER
    terminal_states: [SOLD, TOTAL_LOSS]
    transitions:
      - from: ON_ORDER
        to: IN_FLEETING
        trigger: "POST /fleet/vehicles/{vehicle_id}/in-fleet"
        actor: MarketOperator
        preconditions:
          - "vehicle.fleet_status == ON_ORDER"
          - "PurchaseAllocation(vehicle.allocation_id).status IN {ORDERED, PARTIALLY_INFLEETED}"
          - "FleetPlan of that allocation has status == LOCKED"
          - "Market(vehicle.current_market_id).status == ACTIVE"
          - "X-User-ID == vehicle.current_market_id"
        side_effects:
          - "increments Vehicle.version by 1"
        note: "Cross-entity guard: the gate is the grandparent FleetPlan's state, not the allocation's."
      - from: IN_FLEETING
        to: IN_SERVICE
        trigger: "system event: the third distinct InFleetingTask task_type for this vehicle reached status IN {COMPLETED, WAIVED}"
        actor: system
        preconditions:
          - "vehicle.fleet_status == IN_FLEETING"
          - "the vehicle has one task in status IN {COMPLETED, WAIVED} for EACH of REGISTRATION, LICENSING, PREPARATION"
        side_effects:
          - "sets Vehicle.first_rent_ready_at and Vehicle.in_service_at to the current logical clock"
          - "increments Market(vehicle.current_market_id).in_service_unit_count by 1"
          - "triggers the PurchaseAllocation in_fleeted_count recompute (cascade hop 3)"
          - "increments Vehicle.version by 1"
        note: "Hop 2 of the in-fleeting cascade; bubble-up from the task, not from the client call."
      - from: IN_SERVICE
        to: IN_TRANSIT
        trigger: "POST /fleet/redistribution-orders/{order_id}/depart"
        actor: MarketOperator
        preconditions:
          - "vehicle.fleet_status == IN_SERVICE"
          - "order.status == AUTHORIZED"
          - "Market(order.destination_market_id).status == ACTIVE"
        side_effects:
          - "decrements Market(order.origin_market_id).in_service_unit_count by 1"
          - "increments Vehicle.version by 1"
      - from: IN_TRANSIT
        to: IN_SERVICE
        trigger: "POST /fleet/redistribution-orders/{order_id}/receive"
        actor: MarketOperator
        preconditions:
          - "vehicle.fleet_status == IN_TRANSIT"
          - "order.status == IN_TRANSIT"
        side_effects:
          - "sets Vehicle.current_market_id = order.destination_market_id"
          - "increments Market(order.destination_market_id).in_service_unit_count by 1"
          - "posts LedgerEntry {entry_type: TRANSPORT_COST, amount_cents: +order.actual_transport_cost_cents, source_entity_type: RedistributionOrder}"
          - "increments Vehicle.version by 1"
        note: "Closes the IN_SERVICE -> IN_TRANSIT -> IN_SERVICE cycle at a DIFFERENT market."
      - from: IN_TRANSIT
        to: IN_SERVICE
        trigger: "POST /fleet/redistribution-orders/{order_id}/cancel"
        actor: FleetController
        preconditions:
          - "vehicle.fleet_status == IN_TRANSIT"
          - "order.status == IN_TRANSIT"
        side_effects:
          - "leaves Vehicle.current_market_id unchanged at order.origin_market_id"
          - "increments Market(order.origin_market_id).in_service_unit_count by 1"
          - "posts NO LedgerEntry of entry_type TRANSPORT_COST"
          - "increments Vehicle.version by 1"
        note: "Compensating action for depart; restores the market unit census exactly."
      - from: IN_SERVICE
        to: HELD_FOR_SALE
        trigger: "POST /fleet/consignments"
        actor: RemarketingManager
        preconditions:
          - "vehicle.fleet_status == IN_SERVICE"
          - "vehicle.condition_status IN {SOUND, RECONDITIONED}"
          - "when RemarketingChannel(consignment.channel_id).code == PROGRAM_REPURCHASE: holding_days >= ManufacturerProgram(vehicle.program_id).min_holding_days"
          - "no DamageEvent for the vehicle has status IN {REPORTED, RECOVERY_PENDING}"
        side_effects:
          - "sets Vehicle.held_for_sale_at to the current logical clock"
          - "sets Vehicle.net_book_value_at_hold_cents = Vehicle.net_book_value_cents evaluated at that instant"
          - "decrements Market(vehicle.current_market_id).in_service_unit_count by 1; the unit leaves the rentable census the moment it is consigned"
          - "increments Vehicle.version by 1"
      - from: HELD_FOR_SALE
        to: IN_SERVICE
        trigger: "POST /fleet/consignments/{consignment_id}/withdraw"
        actor: RemarketingManager
        preconditions:
          - "vehicle.fleet_status == HELD_FOR_SALE"
          - "consignment.status IN {DRAFT, RECONDITION_PENDING, LISTED}"
        side_effects:
          - "clears Vehicle.held_for_sale_at and Vehicle.net_book_value_at_hold_cents to null"
          - "increments Market(vehicle.current_market_id).in_service_unit_count by 1, exactly undoing the decrement the consignment creation applied"
          - "when consignment.recondition_loaded_cents is not null, posts LedgerEntry {entry_type: RECONDITION_REVERSAL, amount_cents: -consignment.recondition_loaded_cents, source_entity_type: Consignment} so Vehicle.total_recondition_cents returns to 0"
          - "when Vehicle.condition_status IN {RECONDITIONING, RECONDITIONED}, sets condition_status = SOUND"
          - "increments Vehicle.version by 1"
        note: "Compensating action for the consignment forward path; conserves the recondition ledger total."
      - from: HELD_FOR_SALE
        to: SOLD
        trigger: "system event: the Consignment for this vehicle reached SETTLED"
        actor: system
        preconditions:
          - "vehicle.fleet_status == HELD_FOR_SALE"
          - "consignment.status == SETTLED"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: ON_ORDER
        to: TOTAL_LOSS
        trigger: "POST /fleet/damage-events/{damage_event_id}/declare-total-loss"
        actor: FleetController
        preconditions:
          - "damage_event.total_loss_required == true"
          - "damage_event.status IN {REPORTED, RECOVERY_PENDING}"
        side_effects:
          - "sets Vehicle.condition_status = TOTALED"
          - "increments Vehicle.version by 1"
      - from: IN_FLEETING
        to: TOTAL_LOSS
        trigger: "POST /fleet/damage-events/{damage_event_id}/declare-total-loss"
        actor: FleetController
        preconditions:
          - "damage_event.total_loss_required == true"
          - "damage_event.status IN {REPORTED, RECOVERY_PENDING}"
        side_effects:
          - "sets Vehicle.condition_status = TOTALED"
          - "cancels every InFleetingTask for this vehicle whose status == PENDING (conditional cascade; COMPLETED and WAIVED tasks are untouched) by setting status = WAIVED with completed_at at the current clock and posting NO PREP_COST"
          - "increments Vehicle.version by 1"
      - from: IN_SERVICE
        to: TOTAL_LOSS
        trigger: "POST /fleet/damage-events/{damage_event_id}/declare-total-loss"
        actor: FleetController
        preconditions:
          - "damage_event.total_loss_required == true"
          - "damage_event.status IN {REPORTED, RECOVERY_PENDING}"
        side_effects:
          - "sets Vehicle.condition_status = TOTALED"
          - "decrements Market(vehicle.current_market_id).in_service_unit_count by 1"
          - "triggers hop 3 of the total-loss cascade: every RedistributionOrder for this vehicle with status IN {DRAFT, PROPOSED, REJECTED, AUTHORIZED, IN_TRANSIT} moves to CANCELLED, and every Consignment for this vehicle with status IN {DRAFT, RECONDITION_PENDING, LISTED} moves to WITHDRAWN"
          - "increments Vehicle.version by 1"
      - from: IN_TRANSIT
        to: TOTAL_LOSS
        trigger: "POST /fleet/damage-events/{damage_event_id}/declare-total-loss"
        actor: FleetController
        preconditions:
          - "damage_event.total_loss_required == true"
          - "damage_event.status IN {REPORTED, RECOVERY_PENDING}"
        side_effects:
          - "sets Vehicle.condition_status = TOTALED"
          - "triggers hop 3 of the total-loss cascade as described for IN_SERVICE -> TOTAL_LOSS"
          - "increments Vehicle.version by 1"
      - from: HELD_FOR_SALE
        to: TOTAL_LOSS
        trigger: "POST /fleet/damage-events/{damage_event_id}/declare-total-loss"
        actor: FleetController
        preconditions:
          - "damage_event.total_loss_required == true"
          - "damage_event.status IN {REPORTED, RECOVERY_PENDING}"
        side_effects:
          - "sets Vehicle.condition_status = TOTALED"
          - "triggers hop 3 of the total-loss cascade as described for IN_SERVICE -> TOTAL_LOSS"
          - "increments Vehicle.version by 1"

  - entity: Vehicle
    initial_state: SOUND
    terminal_states: [TOTALED]
    transitions:
      - from: SOUND
        to: DAMAGE_REPORTED
        trigger: "POST /fleet/vehicles/{vehicle_id}/damage-events"
        actor: MarketOperator
        preconditions:
          - "vehicle.condition_status == SOUND"
          - "vehicle.fleet_status NOT IN {SOLD, TOTAL_LOSS}"
        side_effects:
          - "increments Vehicle.version by 1"
        note: "Parallel dimension: fleet_status is untouched by this transition."
      - from: RECONDITIONED
        to: DAMAGE_REPORTED
        trigger: "POST /fleet/vehicles/{vehicle_id}/damage-events"
        actor: MarketOperator
        preconditions:
          - "vehicle.condition_status == RECONDITIONED"
          - "vehicle.fleet_status NOT IN {SOLD, TOTAL_LOSS}"
        side_effects:
          - "increments Vehicle.version by 1"
        note: "Closes the SOUND -> ... -> RECONDITIONED -> DAMAGE_REPORTED condition cycle."
      - from: SOUND
        to: RECONDITIONING
        trigger: "POST /fleet/consignments/{consignment_id}/authorize-recondition"
        actor: RemarketingManager
        preconditions:
          - "vehicle.condition_status == SOUND"
          - "consignment.status == DRAFT"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: DAMAGE_REPORTED
        to: RECONDITIONING
        trigger: "POST /fleet/consignments/{consignment_id}/authorize-recondition"
        actor: RemarketingManager
        preconditions:
          - "vehicle.condition_status == DAMAGE_REPORTED"
          - "consignment.status == DRAFT"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: RECONDITIONING
        to: RECONDITIONED
        trigger: "POST /fleet/consignments/{consignment_id}/complete-recondition"
        actor: RemarketingManager
        preconditions:
          - "vehicle.condition_status == RECONDITIONING"
          - "consignment.status == RECONDITION_PENDING"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: RECONDITIONING
        to: SOUND
        trigger: "POST /fleet/consignments/{consignment_id}/withdraw"
        actor: RemarketingManager
        preconditions:
          - "vehicle.condition_status == RECONDITIONING"
          - "consignment.status IN {DRAFT, RECONDITION_PENDING, LISTED}"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: RECONDITIONED
        to: SOUND
        trigger: "POST /fleet/consignments/{consignment_id}/withdraw"
        actor: RemarketingManager
        preconditions:
          - "vehicle.condition_status == RECONDITIONED"
          - "consignment.status IN {DRAFT, RECONDITION_PENDING, LISTED}"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: DAMAGE_REPORTED
        to: SOUND
        trigger: "system event: a DamageEvent for this vehicle reached RECOVERED or WRITTEN_OFF and no other DamageEvent for the vehicle remains in status IN {REPORTED, RECOVERY_PENDING}"
        actor: system
        preconditions:
          - "vehicle.condition_status == DAMAGE_REPORTED"
          - "COUNT of DamageEvent for this vehicle with status IN {REPORTED, RECOVERY_PENDING} == 0 after the triggering transition"
        side_effects:
          - "increments Vehicle.version by 1"
        note: "Conditional cascade: suppressed while any other damage event is still open."
      - from: DAMAGE_REPORTED
        to: TOTALED
        trigger: "POST /fleet/damage-events/{damage_event_id}/declare-total-loss"
        actor: FleetController
        preconditions:
          - "vehicle.condition_status == DAMAGE_REPORTED"
          - "damage_event.total_loss_required == true"
        side_effects:
          - "increments Vehicle.version by 1"

  - entity: InFleetingTask
    initial_state: PENDING
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /fleet/in-fleeting-tasks/{task_id}/complete"
        actor: MarketOperator
        preconditions:
          - "task.status == PENDING"
          - "Vehicle(task.vehicle_id).fleet_status == IN_FLEETING"
          - "X-User-ID == task.market_id"
        side_effects:
          - "sets InFleetingTask.completed_at to the current logical clock"
          - "posts LedgerEntry {entry_type: PREP_COST, amount_cents: +task.cost_cents, source_entity_type: InFleetingTask}"
          - "stamps Vehicle.registered_at / licensed_at / prep_completed_at according to task.task_type"
          - "triggers hop 2 of the in-fleeting cascade: the Vehicle IN_FLEETING -> IN_SERVICE evaluation"
          - "increments InFleetingTask.version by 1"
        note: "Hop 1 of the in-fleeting cascade."
      - from: PENDING
        to: WAIVED
        trigger: "POST /fleet/in-fleeting-tasks/{task_id}/waive"
        actor: FleetController
        preconditions:
          - "task.status == PENDING"
          - "Vehicle(task.vehicle_id).fleet_status == IN_FLEETING"
        side_effects:
          - "sets InFleetingTask.completed_at to the current logical clock"
          - "posts NO LedgerEntry"
          - "stamps Vehicle.registered_at / licensed_at / prep_completed_at according to task.task_type"
          - "triggers hop 2 of the in-fleeting cascade: the Vehicle IN_FLEETING -> IN_SERVICE evaluation"
          - "increments InFleetingTask.version by 1"

  - entity: RedistributionOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /fleet/redistribution-orders/{order_id}/propose"
        actor: FleetPlanner
        preconditions:
          - "order.status == DRAFT"
          - "Vehicle(order.vehicle_id).fleet_status == IN_SERVICE"
        side_effects:
          - "sets RedistributionOrder.proposed_by_user_id = X-User-ID"
          - "increments RedistributionOrder.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /fleet/redistribution-orders/{order_id}/reject"
        actor: FleetController
        preconditions:
          - "order.status == PROPOSED"
        side_effects:
          - "records RedistributionOrder.rejection_reason from the request body"
          - "increments RedistributionOrder.version by 1"
      - from: REJECTED
        to: PROPOSED
        trigger: "POST /fleet/redistribution-orders/{order_id}/propose"
        actor: FleetPlanner
        preconditions:
          - "order.status == REJECTED"
          - "order.revision_count < MAX_REVISIONS (3)"
          - "Vehicle(order.vehicle_id).fleet_status == IN_SERVICE"
        side_effects:
          - "increments RedistributionOrder.revision_count by 1"
          - "rewrites RedistributionOrder.proposed_by_user_id = X-User-ID"
          - "clears RedistributionOrder.rejection_reason to null"
          - "increments RedistributionOrder.version by 1"
        note: "The revision cycle. The fourth re-propose attempt (revision_count already 3) is rejected with ERR_REVISION_LIMIT_REACHED."
      - from: PROPOSED
        to: AUTHORIZED
        trigger: "POST /fleet/redistribution-orders/{order_id}/authorize"
        actor: FleetController
        preconditions:
          - "order.status == PROPOSED"
          - "X-User-ID != order.proposed_by_user_id"
          - "Market(order.destination_market_id).status == ACTIVE"
        side_effects:
          - "sets RedistributionOrder.authorized_by_user_id = X-User-ID"
          - "increments RedistributionOrder.version by 1"
      - from: AUTHORIZED
        to: IN_TRANSIT
        trigger: "POST /fleet/redistribution-orders/{order_id}/depart"
        actor: MarketOperator
        preconditions:
          - "order.status == AUTHORIZED"
          - "Vehicle(order.vehicle_id).fleet_status == IN_SERVICE"
          - "Market(order.destination_market_id).status == ACTIVE"
          - "X-User-ID == order.origin_market_id"
        side_effects:
          - "sets RedistributionOrder.depart_at to the current logical clock"
          - "drives the Vehicle IN_SERVICE -> IN_TRANSIT transition"
          - "increments RedistributionOrder.version by 1"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /fleet/redistribution-orders/{order_id}/receive"
        actor: MarketOperator
        preconditions:
          - "order.status == IN_TRANSIT"
          - "X-User-ID == order.destination_market_id"
        side_effects:
          - "sets RedistributionOrder.receive_at to the current logical clock and actual_transport_cost_cents from the request body"
          - "drives the Vehicle IN_TRANSIT -> IN_SERVICE transition with the market rewrite and the TRANSPORT_COST ledger post"
          - "increments RedistributionOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fleet/redistribution-orders/{order_id}/cancel"
        actor: FleetController
        preconditions: ["order.status == DRAFT"]
        side_effects: ["increments RedistributionOrder.version by 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /fleet/redistribution-orders/{order_id}/cancel"
        actor: FleetController
        preconditions: ["order.status == PROPOSED"]
        side_effects: ["increments RedistributionOrder.version by 1"]
      - from: REJECTED
        to: CANCELLED
        trigger: "POST /fleet/redistribution-orders/{order_id}/cancel"
        actor: FleetController
        preconditions: ["order.status == REJECTED"]
        side_effects: ["increments RedistributionOrder.version by 1"]
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "POST /fleet/redistribution-orders/{order_id}/cancel"
        actor: FleetController
        preconditions: ["order.status == AUTHORIZED"]
        side_effects: ["increments RedistributionOrder.version by 1"]
      - from: IN_TRANSIT
        to: CANCELLED
        trigger: "POST /fleet/redistribution-orders/{order_id}/cancel"
        actor: FleetController
        preconditions:
          - "order.status == IN_TRANSIT"
          - "Vehicle(order.vehicle_id).fleet_status == IN_TRANSIT"
        side_effects:
          - "drives the Vehicle IN_TRANSIT -> IN_SERVICE compensating transition at the ORIGIN market"
          - "posts NO TRANSPORT_COST LedgerEntry"
          - "increments RedistributionOrder.version by 1"
        note: "Compensating action for depart; the market unit census returns to its pre-depart values exactly."
      - from: DRAFT
        to: CANCELLED
        trigger: "system event: the vehicle reached TOTAL_LOSS (total-loss cascade hop 3)"
        actor: system
        preconditions: ["order.status IN {DRAFT, PROPOSED, REJECTED, AUTHORIZED, IN_TRANSIT}"]
        side_effects: ["increments RedistributionOrder.version by 1"]
        note: "Applies from every non-terminal status; enumerated once to avoid five identical rows."

  - entity: DamageEvent
    initial_state: REPORTED
    terminal_states: [RECOVERED, WRITTEN_OFF, TOTAL_LOSS_DECLARED]
    transitions:
      - from: REPORTED
        to: RECOVERY_PENDING
        trigger: "POST /fleet/damage-events/{damage_event_id}/open-recovery"
        actor: RemarketingManager
        preconditions:
          - "damage_event.status == REPORTED"
          - "damage_event.total_loss_required == false"
        side_effects:
          - "sets DamageEvent.recovery_source from the request body"
          - "increments DamageEvent.version by 1"
        note: "Branch A of the REPORTED fork."
      - from: RECOVERY_PENDING
        to: RECOVERED
        trigger: "POST /fleet/damage-events/{damage_event_id}/settle-recovery"
        actor: RemarketingManager
        preconditions:
          - "damage_event.status == RECOVERY_PENDING"
        side_effects:
          - "sets DamageEvent.recovered_cents from the request body and computes the three recovery_alloc_* waterfall buckets"
          - "posts LedgerEntry {entry_type: DAMAGE_RECOVERY, amount_cents: -recovered_cents, source_entity_type: DamageEvent, memo: the three-bucket split}"
          - "triggers the Vehicle DAMAGE_REPORTED -> SOUND conditional cascade"
          - "increments DamageEvent.version by 1"
      - from: RECOVERY_PENDING
        to: WRITTEN_OFF
        trigger: "POST /fleet/damage-events/{damage_event_id}/write-off"
        actor: FleetController
        preconditions:
          - "damage_event.status == RECOVERY_PENDING"
        side_effects:
          - "posts NO LedgerEntry"
          - "triggers the Vehicle DAMAGE_REPORTED -> SOUND conditional cascade"
          - "increments DamageEvent.version by 1"
      - from: REPORTED
        to: WRITTEN_OFF
        trigger: "POST /fleet/damage-events/{damage_event_id}/write-off"
        actor: FleetController
        preconditions:
          - "damage_event.status == REPORTED"
          - "damage_event.total_loss_required == false"
        side_effects:
          - "posts NO LedgerEntry"
          - "triggers the Vehicle DAMAGE_REPORTED -> SOUND conditional cascade"
          - "increments DamageEvent.version by 1"
      - from: REPORTED
        to: TOTAL_LOSS_DECLARED
        trigger: "POST /fleet/damage-events/{damage_event_id}/declare-total-loss"
        actor: FleetController
        preconditions:
          - "damage_event.status == REPORTED"
          - "damage_event.total_loss_required == true"
        side_effects:
          - "sets DamageEvent.salvage_proceeds_cents from the request body and computes total_loss_gain_loss_cents"
          - "posts LedgerEntry {entry_type: SALVAGE_PROCEEDS, amount_cents: -salvage_proceeds_cents, source_entity_type: DamageEvent}"
          - "posts LedgerEntry {entry_type: DISPOSAL_GAIN_LOSS, amount_cents: total_loss_gain_loss_cents, source_entity_type: DamageEvent}"
          - "triggers hop 2 of the total-loss cascade: the Vehicle -> TOTAL_LOSS and condition -> TOTALED transitions"
          - "increments DamageEvent.version by 1"
        note: "Branch B of the REPORTED fork; hop 1 of the total-loss cascade."
      - from: RECOVERY_PENDING
        to: TOTAL_LOSS_DECLARED
        trigger: "POST /fleet/damage-events/{damage_event_id}/declare-total-loss"
        actor: FleetController
        preconditions:
          - "damage_event.status == RECOVERY_PENDING"
          - "damage_event.total_loss_required == true"
        side_effects:
          - "same side-effect set as the REPORTED -> TOTAL_LOSS_DECLARED transition"
          - "increments DamageEvent.version by 1"
        note: "Reachable only after POST /fleet/damage-events/{damage_event_id}/revise-estimate raises estimate_cents past the total-loss ratio while the event sits in RECOVERY_PENDING."
      - from: REPORTED
        to: REPORTED
        trigger: "POST /fleet/damage-events/{damage_event_id}/revise-estimate"
        actor: MarketOperator
        preconditions:
          - "damage_event.status IN {REPORTED, RECOVERY_PENDING}"
          - "Vehicle(damage_event.vehicle_id).fleet_status NOT IN {SOLD, TOTAL_LOSS}"
        side_effects:
          - "rewrites DamageEvent.estimate_cents from the request body"
          - "recomputes DamageEvent.total_loss_required against the UNCHANGED net_book_value_at_report_cents baseline"
          - "increments DamageEvent.version by 1"
        note: "Self-loop; also applies from RECOVERY_PENDING without changing status. The baseline denominator is deliberately NOT re-frozen."

  - entity: Consignment
    initial_state: DRAFT
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: RECONDITION_PENDING
        trigger: "POST /fleet/consignments/{consignment_id}/authorize-recondition"
        actor: RemarketingManager
        preconditions:
          - "consignment.status == DRAFT"
          - "recondition_authorized_cents <= VehicleSegment(vehicle.segment_id).recondition_cap_cents"
        side_effects:
          - "sets Consignment.recondition_authorized_cents from the request body"
          - "drives the Vehicle condition SOUND|DAMAGE_REPORTED -> RECONDITIONING transition"
          - "increments Consignment.version by 1"
        note: "Fork branch 1 of the DRAFT fork."
      - from: RECONDITION_PENDING
        to: LISTED
        trigger: "POST /fleet/consignments/{consignment_id}/complete-recondition then POST /fleet/consignments/{consignment_id}/list"
        actor: RemarketingManager
        preconditions:
          - "consignment.status == RECONDITION_PENDING"
          - "recondition_actual_cents <= consignment.recondition_authorized_cents"
        side_effects:
          - "complete-recondition sets recondition_actual_cents, computes recondition_loaded_cents, posts LedgerEntry {entry_type: RECONDITION_COST, amount_cents: +recondition_loaded_cents, source_entity_type: Consignment}, and drives Vehicle condition RECONDITIONING -> RECONDITIONED; the consignment stays in RECONDITION_PENDING"
          - "list then moves the consignment to LISTED and stamps listed_at"
          - "increments Consignment.version by 1 per call"
        note: "Join point: this branch and the DRAFT -> LISTED branch converge on LISTED with DIFFERENT side-effect sets (this branch has posted a RECONDITION_COST ledger line and left condition_status == RECONDITIONED; the direct branch has posted none and left condition_status == SOUND)."
      - from: DRAFT
        to: LISTED
        trigger: "POST /fleet/consignments/{consignment_id}/list"
        actor: RemarketingManager
        preconditions:
          - "consignment.status == DRAFT"
          - "RemarketingChannel(consignment.channel_id).recondition_required == false"
          - "vehicle.condition_status IN {SOUND, RECONDITIONED}"
          - "no DamageEvent for the vehicle has status IN {REPORTED, RECOVERY_PENDING}"
        side_effects:
          - "stamps Consignment.listed_at at the current logical clock"
          - "posts NO RECONDITION_COST LedgerEntry"
          - "increments Consignment.version by 1"
        note: "Fork branch 2 of the DRAFT fork; forbidden when the channel requires reconditioning."
      - from: LISTED
        to: SOLD_PENDING_SETTLEMENT
        trigger: "POST /fleet/consignments/{consignment_id}/record-sale"
        actor: RemarketingManager
        preconditions:
          - "consignment.status == LISTED"
          - "gross_proceeds_cents >= consignment.floor_price_cents"
        side_effects:
          - "sets gross_proceeds_cents and computes channel_fee_cents, transport_to_channel_cents, net_proceeds_cents and gain_loss_cents"
          - "increments Consignment.version by 1"
      - from: SOLD_PENDING_SETTLEMENT
        to: SETTLED
        trigger: "POST /fleet/consignments/{consignment_id}/settle"
        actor: RemarketingManager
        preconditions:
          - "consignment.status == SOLD_PENDING_SETTLEMENT"
          - "X-User-ID != consignment.created_by_user_id"
        side_effects:
          - "sets settled_by_user_id = X-User-ID and settled_at to the current logical clock"
          - "posts LedgerEntry {entry_type: DISPOSAL_PROCEEDS, amount_cents: -gross_proceeds_cents, source_entity_type: Consignment}"
          - "posts LedgerEntry {entry_type: CHANNEL_FEE, amount_cents: +channel_fee_cents, source_entity_type: Consignment}"
          - "posts LedgerEntry {entry_type: TRANSPORT_COST, amount_cents: +transport_to_channel_cents, source_entity_type: Consignment}"
          - "posts LedgerEntry {entry_type: DISPOSAL_GAIN_LOSS, amount_cents: gain_loss_cents, source_entity_type: Consignment}"
          - "drives the Vehicle HELD_FOR_SALE -> SOLD transition"
          - "increments Consignment.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /fleet/consignments/{consignment_id}/withdraw"
        actor: RemarketingManager
        preconditions: ["consignment.status == DRAFT"]
        side_effects:
          - "drives the Vehicle HELD_FOR_SALE -> IN_SERVICE compensating transition"
          - "increments Consignment.version by 1"
      - from: RECONDITION_PENDING
        to: WITHDRAWN
        trigger: "POST /fleet/consignments/{consignment_id}/withdraw"
        actor: RemarketingManager
        preconditions: ["consignment.status == RECONDITION_PENDING"]
        side_effects:
          - "drives the Vehicle HELD_FOR_SALE -> IN_SERVICE compensating transition including the RECONDITION_REVERSAL ledger post when recondition_loaded_cents is not null"
          - "increments Consignment.version by 1"
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /fleet/consignments/{consignment_id}/withdraw"
        actor: RemarketingManager
        preconditions: ["consignment.status == LISTED"]
        side_effects:
          - "drives the Vehicle HELD_FOR_SALE -> IN_SERVICE compensating transition including the RECONDITION_REVERSAL ledger post when recondition_loaded_cents is not null"
          - "increments Consignment.version by 1"
      - from: LISTED
        to: WITHDRAWN
        trigger: "system event: the vehicle reached TOTAL_LOSS (total-loss cascade hop 3)"
        actor: system
        preconditions: ["consignment.status IN {DRAFT, RECONDITION_PENDING, LISTED}"]
        side_effects:
          - "increments Consignment.version by 1"
          - "posts NO RECONDITION_REVERSAL: the reconditioning spend is retained in the total-loss book value"
        note: "Applies from every non-terminal status; enumerated once to avoid three identical rows."

  - entity: DepreciationPolicy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fleet/depreciation-policies/{policy_id}/activate"
        actor: FleetController
        preconditions:
          - "policy.status == DRAFT"
          - "policy.effective_from <= current logical clock"
          - "X-User-ID != policy.created_by_user_id"
          - "if a policy P0 with segment_id == policy.segment_id and status == ACTIVE exists then policy.supersedes_policy_id == P0.id"
          - "if no ACTIVE policy exists for the segment then policy.supersedes_policy_id IS NULL"
        side_effects:
          - "sets activated_by_user_id = X-User-ID"
          - "moves the previously ACTIVE policy for the segment (if any) to SUPERSEDED"
          - "increments DepreciationPolicy.version by 1 on both the activated and the superseded policy"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: another DepreciationPolicy for the same segment was activated"
        actor: system
        preconditions:
          - "policy.status == ACTIVE"
          - "the newly activated policy's supersedes_policy_id == policy.id"
        side_effects:
          - "increments DepreciationPolicy.version by 1"

  - entity: Market
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fleet/markets/{market_id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "market.status == ACTIVE"
        side_effects:
          - "increments Market.version by 1"
        note: "One-way for the purposes of this benchmark: there is no un-suspend operation."

  - entity: RemarketingChannel
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fleet/remarketing-channels/{channel_id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "channel.status == ACTIVE"
        side_effects:
          - "increments RemarketingChannel.version by 1"
          - "removes the channel from the channel-selector candidate pool"

  - entity: ManufacturerProgram
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /fleet/manufacturer-programs/{program_id}/close"
        actor: PlatformAdmin
        preconditions:
          - "program.status == ACTIVE"
        side_effects:
          - "increments ManufacturerProgram.version by 1"
          - "blocks the program from backing any new PurchaseAllocation; existing allocations and vehicles are untouched"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: allocation-create-stale-plan
    parent_entity: FleetPlan
    write_endpoint: "POST /fleet/fleet-plans/{plan_id}/allocations"
    occ_field: "expected_plan_version"
    description: |
      Creating a PurchaseAllocation against a FleetPlan whose version has
      advanced since the client last read it is rejected. A plan legitimately
      accepts many allocations, so a writer holding a fresh version always
      succeeds; the rejection captures the case where an earlier allocation
      (or an allocation cancellation) has already moved allocated_unit_count
      and therefore the plan's posture, invalidating the sizing arithmetic the
      current writer based its unit_count on.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: consignment-create-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /fleet/consignments"
    occ_field: "expected_vehicle_version"
    description: |
      Creating a Consignment against a Vehicle whose version has advanced
      since the client last read it is rejected. A new Consignment legitimately
      supersedes a WITHDRAWN one on the same vehicle, so a writer holding a
      fresh version always succeeds; the rejection captures the case where a
      usage posting, a damage report, or a withdrawal has already moved the
      vehicle's odometer, condition or hold baseline, invalidating the
      valuation the channel choice was made on.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: vehicle_residual_valuation
    trigger: "On GET /fleet/vehicles/{vehicle_id}/valuation; on the Vehicle IN_SERVICE -> HELD_FOR_SALE transition (to freeze net_book_value_at_hold_cents); on POST /fleet/vehicles/{vehicle_id}/damage-events (to freeze net_book_value_at_report_cents); and as the input to remarketing_channel_selection."
    algorithm: decay_function
    formula: |
      # --- shared inputs -------------------------------------------------
      cap                = Vehicle.capitalized_cost_cents
      odo                = Vehicle.odometer_km
      policy             = the DepreciationPolicy with segment_id == Vehicle.segment_id
                           AND status == ACTIVE   (exactly one; none => ERR_NO_ACTIVE_DEPRECIATION_POLICY)
      program            = ManufacturerProgram(Vehicle.program_id)
      # holding clock: starts at in_service_at, frozen by held_for_sale_at
      if Vehicle.in_service_at IS NULL:
          holding_days = 0
      else:
          end_instant  = Vehicle.held_for_sale_at IF NOT NULL ELSE current_logical_clock
          holding_days = floor((end_instant - Vehicle.in_service_at) / 86400 seconds)
      holding_months     = floor(holding_days / 30)

      # --- variant POLICY_SCHEDULE ---------------------------------------
      time_dep_cents     = round_half_up(cap * policy.monthly_depreciation_pct * holding_months)
      mileage_dep_cents  = odo * policy.mileage_depreciation_cents_per_km
      floor_value_cents  = round_half_up(cap * policy.floor_residual_pct)
      policy_net_book_value_cents = max(cap - (time_dep_cents + mileage_dep_cents), floor_value_cents)

      # --- variant PROGRAM_GUARANTEE -------------------------------------
      guarantee_base_cents  = round_half_up(cap * program.repurchase_guarantee_pct)
      excess_km             = max(0, odo - program.max_eligible_mileage_km)
      excess_charge_cents   = excess_km * program.excess_mileage_charge_cents_per_km
      open_damage_cents     = SUM(DamageEvent.estimate_cents) over DamageEvents with
                              vehicle_id == Vehicle.id AND status IN {REPORTED, RECOVERY_PENDING}
      damage_deduction_cents= min(open_damage_cents, program.damage_deduction_cap_cents)
      program_guaranteed_value_cents = max(0, guarantee_base_cents
                                              - excess_charge_cents
                                              - damage_deduction_cents)

      # --- variant selection (pinned, not a preference) -------------------
      if program.program_type == 'PROGRAM':
          net_book_value_cents = program_guaranteed_value_cents ; applied_variant = 'PROGRAM_GUARANTEE'
      else:
          net_book_value_cents = policy_net_book_value_cents    ; applied_variant = 'POLICY_SCHEDULE'
      accumulated_depreciation_cents = cap - net_book_value_cents

      # --- mileage band ---------------------------------------------------
      seg = VehicleSegment(Vehicle.segment_id)
      mileage_band = 'OVER_HARD' IF odo >  seg.mileage_band_hard_limit_km
               ELSE  'OVER_SOFT' IF odo >  seg.mileage_band_soft_limit_km
               ELSE  'WITHIN_SOFT'
    input_set: "Exactly one Vehicle row. The open-damage deduction includes ONLY DamageEvents with status IN {REPORTED, RECOVERY_PENDING}; RECOVERED, WRITTEN_OFF and TOTAL_LOSS_DECLARED events are excluded. The depreciation policy input set is the single status == ACTIVE policy for the vehicle's segment; DRAFT and SUPERSEDED policies are never read."
    constants:
      SECONDS_PER_DAY: 86400
      DAYS_PER_DEPRECIATION_MONTH: 30
    precision: "All money in whole cents, round_half_up. holding_days and holding_months are integer floors. Percentages are 4-decimal fractions."
    variants:
      - name: POLICY_SCHEDULE
        when: "Applied as net_book_value_cents when ManufacturerProgram.program_type == RISK. Always exposed as policy_net_book_value_cents regardless of program_type."
        difference: "Time-and-mileage straight-line decay from capitalized cost, clamped below by floor_residual_pct. Ignores the manufacturer guarantee entirely, so a high-mileage vehicle can fall to the floor."
      - name: PROGRAM_GUARANTEE
        when: "Applied as net_book_value_cents when ManufacturerProgram.program_type == PROGRAM. Always exposed as program_guaranteed_value_cents regardless of program_type."
        difference: "Starts from a fixed fraction of capitalized cost and subtracts excess-mileage and open-damage deductions instead of accruing time decay. Holding_months does not enter it at all, so the two variants diverge for identical inputs."

  - name: consignment_net_proceeds
    trigger: "On POST /fleet/consignments/{consignment_id}/record-sale, which writes channel_fee_cents, transport_to_channel_cents, net_proceeds_cents and gain_loss_cents on the Consignment."
    algorithm: aggregation
    formula: |
      chan   = RemarketingChannel(Consignment.channel_id)
      mkt    = Market(Vehicle(Consignment.vehicle_id).current_market_id)
      gross  = Consignment.gross_proceeds_cents

      # PINNED ROUNDING ORDER: each of the three cost lines is rounded to whole
      # cents INDEPENDENTLY (round_half_up) and only THEN summed. Summing the
      # unrounded lines and rounding once is a DIFFERENT, forbidden order and
      # can differ by one or more cents.
      line_1_channel_fee_cents = round_half_up(gross * chan.fee_pct) + chan.fixed_fee_cents
      line_2_transport_cents   = round_half_up(mkt.transport_hub_distance_km
                                               * mkt.transfer_cost_per_km_cents
                                               * CHANNEL_HAUL_FACTOR)
      line_3_recondition_cents = 0 IF Consignment.recondition_actual_cents IS NULL
                                 ELSE round_half_up(Consignment.recondition_actual_cents
                                                     * (1 + RECONDITION_OVERHEAD_PCT))

      total_cost_cents = line_1_channel_fee_cents + line_2_transport_cents + line_3_recondition_cents
      Consignment.channel_fee_cents         = line_1_channel_fee_cents
      Consignment.transport_to_channel_cents= line_2_transport_cents
      Consignment.recondition_loaded_cents  = line_3_recondition_cents (null stays null)
      Consignment.net_proceeds_cents        = gross - total_cost_cents
      Consignment.gain_loss_cents           = Consignment.net_proceeds_cents
                                              - Vehicle.net_book_value_at_hold_cents

      # Frozen EARLIER, at consignment CREATION (POST /fleet/consignments), not on
      # record-sale. It is the reserve that priority-27 ERR_PROCEEDS_BELOW_FLOOR
      # enforces against gross_proceeds_cents, and it never moves afterwards even
      # if reconditioning or a redistribution later changes the vehicle.
      Consignment.floor_price_cents = round_half_up(
          Vehicle.net_book_value_at_hold_cents * FLOOR_PRICE_PCT)
    input_set: "Exactly one Consignment plus its channel, its vehicle and the vehicle's CURRENT market. The vehicle's market is read at record-sale time, so a redistribution completed before HELD_FOR_SALE changes the transport line."
    constants:
      CHANNEL_HAUL_FACTOR: 1.15
      RECONDITION_OVERHEAD_PCT: 0.075
      FLOOR_PRICE_PCT: 0.75
    precision: "Whole cents, round_half_up, applied per cost line before summation. The subtraction gross - total_cost_cents is exact integer arithmetic."
    variants: []

  - name: fleet_plan_utilization_and_rpu
    trigger: "On GET /fleet/fleet-plans/{plan_id}/performance."
    algorithm: forward_looking
    formula: |
      plan       = FleetPlan(plan_id)
      season_days= PLAN_SEASON_DAYS[plan.season]
      # candidate vehicles = every Vehicle whose allocation_id belongs to a
      # PurchaseAllocation with plan_id == plan.id AND status != CANCELLED
      set_A = candidates with fleet_status IN {ON_ORDER, IN_FLEETING, IN_SERVICE, IN_TRANSIT}
      set_B = candidates with fleet_status == IN_SERVICE

      # --- variant FORWARD_LOOKING_PLANNED -------------------------------
      utilization_pct_planned      = round_half_up( SUM(rented_days_total over set_A)
                                                    / (plan.planned_unit_count * season_days), 4)
      revenue_per_unit_cents_planned = floor( SUM(revenue_to_date_cents over set_A)
                                             / plan.planned_unit_count )

      # --- variant CHRONOLOGICAL_ACTUAL ----------------------------------
      denom_available = SUM(available_days_total over set_B)
      utilization_pct_actual       = 0.0 IF denom_available == 0
                                     ELSE round_half_up( SUM(rented_days_total over set_B)
                                                          / denom_available, 4)
      revenue_per_unit_cents_actual = 0 IF COUNT(set_B) == 0
                                      ELSE floor( SUM(revenue_to_date_cents over set_B)
                                                   / COUNT(set_B) )
      rpu_variance_cents = revenue_per_unit_cents_actual - plan.revenue_per_unit_target_cents
    input_set: "Variant FORWARD_LOOKING_PLANNED includes every non-cancelled pipeline vehicle (ON_ORDER, IN_FLEETING, IN_SERVICE, IN_TRANSIT) and divides by the PLANNED unit count and the fixed season length. Variant CHRONOLOGICAL_ACTUAL includes ONLY vehicles currently IN_SERVICE and divides by the observed available-day total and the observed in-service unit count. HELD_FOR_SALE, SOLD and TOTAL_LOSS vehicles are excluded from BOTH sets; vehicles under CANCELLED allocations are excluded from both."
    constants:
      PLAN_SEASON_DAYS: { PEAK: 92, SHOULDER: 122, OFF_PEAK: 151 }
    precision: "utilization_pct to 4 decimal places, round_half_up. revenue_per_unit_cents is an integer FLOOR of whole cents (never rounded up)."
    variants:
      - name: FORWARD_LOOKING_PLANNED
        when: "Reported as utilization_pct_planned / revenue_per_unit_cents_planned on every performance read."
        difference: "Denominators come from the PLAN (planned_unit_count x season_days), and the inclusion set is the whole pipeline including units that have never earned a dollar. Dilutes both metrics."
      - name: CHRONOLOGICAL_ACTUAL
        when: "Reported as utilization_pct_actual / revenue_per_unit_cents_actual on the same read; rpu_variance_cents is measured against this variant only."
        difference: "Denominators come from OBSERVED vehicle counters at the evaluation instant and the inclusion set is only IN_SERVICE units. For identical data the two variants return different numbers whenever the pipeline is not fully in service."

  - name: redistribution_transport_cost
    trigger: "On POST /fleet/redistribution-orders, which freezes estimated_transport_cost_cents on the new order."
    algorithm: tiered_pricing
    formula: |
      origin    = Market(Vehicle(vehicle_id).current_market_id)
      base_haul_cents = RedistributionOrder.distance_km * origin.transfer_cost_per_km_cents

      # PINNED EVALUATION ORDER (this is the whole point of the rule):
      # the surcharge tier is selected from base_haul_cents ALONE, BEFORE the
      # surcharge and the handling flat are added. Selecting the tier from the
      # final total - which is what the circular reading "the surcharge tier
      # depends on the total cost" invites - yields a different number and is
      # FORBIDDEN.
      if   base_haul_cents <  SURCHARGE_TIER_1_CEILING_CENTS: surcharge_pct = 0.12
      elif base_haul_cents <  SURCHARGE_TIER_2_CEILING_CENTS: surcharge_pct = 0.08
      else:                                                   surcharge_pct = 0.05
      fuel_surcharge_cents = round_half_up(base_haul_cents * surcharge_pct)
      estimated_transport_cost_cents = base_haul_cents
                                       + fuel_surcharge_cents
                                       + HANDLING_FLAT_CENTS

      # payback gate (evaluated after the cost is known)
      payback_ceiling_cents = round_half_up(VehicleSegment(Vehicle.segment_id).baseline_daily_rate_cents
                                            * TRANSPORT_PAYBACK_DAYS)
      if estimated_transport_cost_cents > payback_ceiling_cents:
          reject with ERR_TRANSPORT_COST_EXCEEDS_BENEFIT
    input_set: "Exactly one prospective RedistributionOrder. The per-km rate is always the ORIGIN market's transfer_cost_per_km_cents (the destination market's rate is never read). Tier boundaries are inclusive-below / exclusive-at: base_haul_cents == 50000 falls in tier 2 (0.08), base_haul_cents == 150000 falls in tier 3 (0.05)."
    constants:
      SURCHARGE_TIER_1_CEILING_CENTS: 50000
      SURCHARGE_TIER_2_CEILING_CENTS: 150000
      SURCHARGE_PCT_TIER_1: 0.12
      SURCHARGE_PCT_TIER_2: 0.08
      SURCHARGE_PCT_TIER_3: 0.05
      HANDLING_FLAT_CENTS: 7500
      TRANSPORT_PAYBACK_DAYS: 45
    precision: "Whole cents, round_half_up on the surcharge only; base_haul and handling are exact integers."
    variants: []

  - name: total_loss_determination_and_recovery_waterfall
    trigger: "The ratio test runs on POST /fleet/vehicles/{vehicle_id}/damage-events and again on POST /fleet/damage-events/{damage_event_id}/revise-estimate. The waterfall runs on POST /fleet/damage-events/{damage_event_id}/settle-recovery. total_loss_gain_loss_cents is computed on POST /fleet/damage-events/{damage_event_id}/declare-total-loss."
    algorithm: threshold
    formula: |
      # --- ratio test (integer arithmetic; no floating point) -------------
      # baseline denominator is FROZEN at first report and is NOT re-frozen by
      # revise-estimate.
      DamageEvent.net_book_value_at_report_cents = Vehicle.net_book_value_cents at report time
      total_loss_required = (DamageEvent.estimate_cents * 10000
                             >= DamageEvent.net_book_value_at_report_cents * TOTAL_LOSS_THRESHOLD_BP)
      # >= means the exact 70.00% point IS a total loss.

      # --- recovery waterfall (ordered buckets, no remainder ambiguity) ---
      recovery_cap_cents = round_half_up(DamageEvent.estimate_cents * RECOVERY_CAP_FACTOR)
      if recovered_cents > recovery_cap_cents: reject with ERR_RECOVERY_EXCEEDS_CAP
      b1 = min(recovered_cents, Vehicle.total_recondition_cents)
      b2 = min(recovered_cents - b1,
               max(0, DamageEvent.estimate_cents - Vehicle.total_recondition_cents))
      b3 = recovered_cents - b1 - b2
      recovery_alloc_recondition_cents  = b1
      recovery_alloc_depreciation_cents = b2
      recovery_alloc_income_cents       = b3
      # invariant: b1 + b2 + b3 == recovered_cents, exactly, always.

      # --- total loss settlement -----------------------------------------
      total_loss_gain_loss_cents = DamageEvent.salvage_proceeds_cents
                                   + COALESCE(DamageEvent.recovered_cents, 0)
                                   - DamageEvent.net_book_value_at_report_cents
    input_set: "Exactly one DamageEvent plus its Vehicle. Vehicle.total_recondition_cents is read live at settle-recovery time, so a reconditioning spend posted after the damage report DOES enter bucket 1. Bucket 2's ceiling uses the CURRENT estimate_cents, i.e. the value after any revise-estimate call."
    constants:
      TOTAL_LOSS_THRESHOLD_BP: 7000
      RECOVERY_CAP_FACTOR: 1.25
    precision: "Whole cents. The ratio test is pure integer cross-multiplication (estimate * 10000 vs baseline * 7000) so there is no rounding at the boundary."
    variants: []

  - name: remarketing_channel_selection
    trigger: "On GET /fleet/vehicles/{vehicle_id}/channel-recommendation."
    algorithm: weighted_scoring
    formula: |
      veh  = Vehicle(vehicle_id) ; prog = ManufacturerProgram(veh.program_id)
      seg  = VehicleSegment(veh.segment_id) ; mkt = Market(veh.current_market_id)
      nbv  = veh.net_book_value_cents            # from vehicle_residual_valuation
      hold = holding_days                        # from vehicle_residual_valuation

      # (a) ELIGIBILITY FILTER over RemarketingChannel rows
      candidate iff chan.status == 'ACTIVE'
        AND NOT (chan.code == 'RETAIL_LOT'          AND veh.odometer_km > seg.mileage_band_hard_limit_km)
        AND NOT (chan.code == 'PROGRAM_REPURCHASE'  AND NOT (
                     prog.program_type == 'PROGRAM'
                 AND hold >= prog.min_holding_days
                 AND hold <= prog.max_holding_days
                 AND veh.odometer_km <= prog.max_eligible_mileage_km
                 AND veh.condition_status IN {'SOUND', 'RECONDITIONED'}))

      # (b) RANKING EXPRESSION - DESC by projected_net_proceeds_cents
      projected_gross_cents       = round_half_up(nbv * chan.expected_proceeds_multiplier)
      projected_fee_cents         = round_half_up(projected_gross_cents * chan.fee_pct)
                                    + chan.fixed_fee_cents
      projected_transport_cents   = round_half_up(mkt.transport_hub_distance_km
                                                   * mkt.transfer_cost_per_km_cents
                                                   * CHANNEL_HAUL_FACTOR)
      projected_recondition_cents = 0 IF chan.recondition_required == false
                                    ELSE min(seg.recondition_cap_cents,
                                             round_half_up(veh.capitalized_cost_cents
                                                            * RECONDITION_ESTIMATE_PCT))
      projected_net_proceeds_cents = projected_gross_cents
                                     - projected_fee_cents
                                     - projected_transport_cents
                                     - projected_recondition_cents

      # (c) TIE-BREAK when projected_net_proceeds_cents ties:
      #     ASC chan.expected_days_to_sell, then ASC chan.created_at.
      #     RemarketingChannel.id is NEVER consulted.
      # (d) EMPTY CANDIDATE POOL: reject with ERR_NO_ELIGIBLE_CHANNEL (422).
    input_set: "All RemarketingChannel rows with status == ACTIVE, filtered by (a). SUSPENDED channels never enter the pool. The vehicle's valuation is the live value from vehicle_residual_valuation at read time, not the frozen net_book_value_at_hold_cents."
    constants:
      CHANNEL_HAUL_FACTOR: 1.15
      RECONDITION_ESTIMATE_PCT: 0.02
    precision: "Whole cents, round_half_up per line. The ranking comparison is exact integer comparison on projected_net_proceeds_cents."
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest priority number wins
#      when a single request violates several rows)
# ---------------------------------------------------------------------------
validations:

  # --- 1-4 authentication / authorization ---------------------------------
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role names one of the five roles declared in §1.7."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The named role appears in the target endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: "When X-User-Role is MarketOperator, X-User-ID equals the id of the Market the target resource belongs to: Vehicle.current_market_id, InFleetingTask.market_id, DamageEvent.market_id, RedistributionOrder.origin_market_id on depart, and RedistributionOrder.destination_market_id on receive (the receiving market signs for the haul). Evaluated after existence so the market can be resolved."
    error_id: ERR_MARKET_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /fleet/vehicles/{vehicle_id}/in-fleet, POST /fleet/vehicles/{vehicle_id}/usage, POST /fleet/vehicles/{vehicle_id}/in-fleeting-tasks, POST /fleet/in-fleeting-tasks/{task_id}/complete, POST /fleet/vehicles/{vehicle_id}/damage-events, POST /fleet/damage-events/{damage_event_id}/revise-estimate, POST /fleet/redistribution-orders/{order_id}/depart, POST /fleet/redistribution-orders/{order_id}/receive"

  # --- 5-6 existence -------------------------------------------------------
  - priority: 5
    category: existence
    check: "Every id in the request PATH resolves to a stored row, validated left to right."
    error_id: ERR_MARKET_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id (each entity has its own code: ERR_MARKET_NOT_FOUND, ERR_SEGMENT_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_CHANNEL_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_FLEET_PLAN_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_VEHICLE_NOT_FOUND, ERR_TASK_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_DAMAGE_EVENT_NOT_FOUND, ERR_CONSIGNMENT_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND)"

  - priority: 6
    category: existence
    check: "Every foreign-key id in the request BODY resolves to a stored row, validated in the field order declared by the endpoint's input list."
    error_id: ERR_CHANNEL_NOT_FOUND
    http_status: 404
    applies_to: "POST /fleet/depreciation-policies, POST /fleet/fleet-plans, POST /fleet/fleet-plans/{plan_id}/allocations, POST /fleet/consignments, POST /fleet/redistribution-orders"

  # --- 7 request schema ----------------------------------------------------
  - priority: 7
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: all required fields present, enum values in range, integers non-negative where declared, instants parse as ISO-8601 UTC. Unknown fields and attempts to set system or computed fields are ignored, not rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all non-GET endpoints"

  - priority: 7
    category: business_constraint
    check: "limit is an integer in 1..200 and offset is an integer >= 0 on every list endpoint."
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

  - priority: 7
    category: business_constraint
    check: "unit_count on an allocation is an integer >= 1."
    error_id: ERR_INVALID_UNIT_COUNT
    http_status: 422
    applies_to: "POST /fleet/fleet-plans/{plan_id}/allocations"

  # --- 8 optimistic concurrency -------------------------------------------
  - priority: 8
    category: state
    check: "expected_plan_version equals the target FleetPlan's current version."
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /fleet/fleet-plans/{plan_id}/allocations"

  - priority: 8
    category: state
    check: "expected_vehicle_version equals the target Vehicle's current version."
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
    applies_to: "POST /fleet/consignments"

  # --- 9 uniqueness --------------------------------------------------------
  - priority: 9
    category: business_constraint
    check: "Market.code, VehicleSegment.code and RemarketingChannel.code are each globally unique; Vehicle.vin is globally unique; (market_id, season, plan_year) is unique across FleetPlans; (vehicle_id, task_type) is unique across non-WAIVED InFleetingTasks."
    error_id: ERR_DUPLICATE_MARKET_CODE
    http_status: 409
    applies_to: "POST /fleet/markets, POST /fleet/vehicle-segments, POST /fleet/remarketing-channels, POST /fleet/purchase-allocations/{allocation_id}/vehicles, POST /fleet/fleet-plans, POST /fleet/vehicles/{vehicle_id}/in-fleeting-tasks (codes ERR_DUPLICATE_SEGMENT_CODE, ERR_DUPLICATE_CHANNEL_CODE, ERR_DUPLICATE_VIN, ERR_DUPLICATE_FLEET_PLAN, ERR_DUPLICATE_TASK_TYPE respectively)"

  # --- 10 state preconditions ---------------------------------------------
  - priority: 10
    category: state
    check: "FleetPlan is in status DRAFT when a mutation that §1.2 declares from DRAFT is invoked (lock, allocation create)."
    error_id: ERR_PLAN_NOT_DRAFT
    http_status: 409
    applies_to: "POST /fleet/fleet-plans/{plan_id}/lock"

  - priority: 10
    category: state
    check: "FleetPlan is in status LOCKED before any vehicle under it may be in-fleeted."
    error_id: ERR_PLAN_NOT_LOCKED
    http_status: 409
    applies_to: "POST /fleet/vehicles/{vehicle_id}/in-fleet"

  - priority: 10
    category: state
    check: "PurchaseAllocation is in status ORDERED with created_vehicle_count == 0 to be cancelled; it is in status ORDERED or PARTIALLY_INFLEETED to mint a vehicle."
    error_id: ERR_ALLOCATION_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /fleet/purchase-allocations/{allocation_id}/cancel, POST /fleet/purchase-allocations/{allocation_id}/vehicles"

  - priority: 10
    category: state
    check: "Vehicle.fleet_status is one of the from-states §1.2 declares for the requested transition."
    error_id: ERR_VEHICLE_INVALID_FLEET_STATE
    http_status: 409
    applies_to: "POST /fleet/vehicles/{vehicle_id}/in-fleet, POST /fleet/vehicles/{vehicle_id}/usage, POST /fleet/consignments, POST /fleet/redistribution-orders, POST /fleet/vehicles/{vehicle_id}/damage-events"

  - priority: 10
    category: state
    check: "Vehicle.condition_status is one of the from-states §1.2 declares for the requested condition transition (the two Vehicle dimensions are checked independently)."
    error_id: ERR_VEHICLE_INVALID_CONDITION_STATE
    http_status: 409
    applies_to: "POST /fleet/consignments/{consignment_id}/authorize-recondition, POST /fleet/consignments/{consignment_id}/complete-recondition, POST /fleet/vehicles/{vehicle_id}/damage-events"

  - priority: 10
    category: state
    check: "InFleetingTask is in status PENDING; a COMPLETED or WAIVED task cannot be completed or waived again."
    error_id: ERR_TASK_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /fleet/in-fleeting-tasks/{task_id}/complete, POST /fleet/in-fleeting-tasks/{task_id}/waive"

  - priority: 10
    category: state
    check: "RedistributionOrder is in one of the from-states §1.2 declares for the requested transition."
    error_id: ERR_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "POST /fleet/redistribution-orders/{order_id}/propose, POST /fleet/redistribution-orders/{order_id}/reject, POST /fleet/redistribution-orders/{order_id}/authorize, POST /fleet/redistribution-orders/{order_id}/depart, POST /fleet/redistribution-orders/{order_id}/receive, POST /fleet/redistribution-orders/{order_id}/cancel"

  - priority: 10
    category: state
    check: "DamageEvent is in one of the from-states §1.2 declares for the requested transition."
    error_id: ERR_DAMAGE_EVENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /fleet/damage-events/{damage_event_id}/revise-estimate, POST /fleet/damage-events/{damage_event_id}/open-recovery, POST /fleet/damage-events/{damage_event_id}/settle-recovery, POST /fleet/damage-events/{damage_event_id}/write-off, POST /fleet/damage-events/{damage_event_id}/declare-total-loss"

  - priority: 10
    category: state
    check: "Consignment is in one of the from-states §1.2 declares for the requested transition."
    error_id: ERR_CONSIGNMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /fleet/consignments/{consignment_id}/authorize-recondition, POST /fleet/consignments/{consignment_id}/complete-recondition, POST /fleet/consignments/{consignment_id}/list, POST /fleet/consignments/{consignment_id}/record-sale, POST /fleet/consignments/{consignment_id}/settle, POST /fleet/consignments/{consignment_id}/withdraw"

  - priority: 10
    category: state
    check: "DepreciationPolicy is in status DRAFT when activated."
    error_id: ERR_POLICY_NOT_DRAFT
    http_status: 409
    applies_to: "POST /fleet/depreciation-policies/{policy_id}/activate"

  - priority: 10
    category: state
    check: "The ManufacturerProgram named by a new allocation has status ACTIVE; a CLOSED program accepts no new purchases."
    error_id: ERR_PROGRAM_CLOSED
    http_status: 409
    applies_to: "POST /fleet/fleet-plans/{plan_id}/allocations"

  - priority: 10
    category: state
    check: "RedistributionOrder.revision_count is strictly less than MAX_REVISIONS (3) before a rejected order may be re-proposed."
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /fleet/redistribution-orders/{order_id}/propose"

  # --- 11 segregation of duties -------------------------------------------
  - priority: 11
    category: business_safety
    check: "The acting X-User-ID differs from the user recorded on the earlier step of the same control: RedistributionOrder.proposed_by_user_id on authorize, Consignment.created_by_user_id on settle, DepreciationPolicy.created_by_user_id on activate."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fleet/redistribution-orders/{order_id}/authorize, POST /fleet/consignments/{consignment_id}/settle, POST /fleet/depreciation-policies/{policy_id}/activate"

  # --- 12-14 business: safety / compliance --------------------------------
  - priority: 12
    category: business_safety
    check: "A DamageEvent whose total_loss_required is true cannot be routed through the ordinary recovery path; it must be resolved by declare-total-loss."
    error_id: ERR_TOTAL_LOSS_DETERMINATION_REQUIRED
    http_status: 422
    applies_to: "POST /fleet/damage-events/{damage_event_id}/open-recovery, POST /fleet/damage-events/{damage_event_id}/write-off"

  - priority: 12
    category: business_safety
    check: "declare-total-loss is refused when the DamageEvent's total_loss_required is false."
    error_id: ERR_TOTAL_LOSS_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /fleet/damage-events/{damage_event_id}/declare-total-loss"

  - priority: 13
    category: business_safety
    check: "No DamageEvent for the vehicle is in status REPORTED or RECOVERY_PENDING when a consignment is created or listed."
    error_id: ERR_OPEN_DAMAGE_BLOCKS_LISTING
    http_status: 422
    applies_to: "POST /fleet/consignments, POST /fleet/consignments/{consignment_id}/list"

  # --- 15-17 business: temporal -------------------------------------------
  - priority: 15
    category: business_temporal
    check: "A PREPARATION task may only be created after the vehicle's REGISTRATION and LICENSING tasks are both resolved (COMPLETED or WAIVED)."
    error_id: ERR_PREP_BEFORE_REGISTRATION
    http_status: 422
    applies_to: "POST /fleet/vehicles/{vehicle_id}/in-fleeting-tasks"

  - priority: 15
    category: business_temporal
    check: "window_start is strictly before window_end on an in-fleeting task."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /fleet/vehicles/{vehicle_id}/in-fleeting-tasks"

  - priority: 15
    category: business_temporal
    check: "planned_depart_at is strictly before planned_receive_at on a redistribution order."
    error_id: ERR_TRANSFER_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /fleet/redistribution-orders"

  - priority: 16
    category: business_temporal
    check: "For PROGRAM_REPURCHASE consignments the vehicle's holding_days is at least ManufacturerProgram.min_holding_days."
    error_id: ERR_MIN_HOLDING_PERIOD_NOT_MET
    http_status: 422
    applies_to: "POST /fleet/consignments"

  - priority: 17
    category: business_temporal
    check: "The proposed transfer window [planned_depart_at, planned_receive_at) must not overlap any existing non-terminal RedistributionOrder window for the same vehicle. The interval is half-open, so one order's planned_receive_at may equal the next order's planned_depart_at."
    error_id: ERR_VEHICLE_TRANSFER_OVERLAP
    http_status: 409
    applies_to: "POST /fleet/redistribution-orders"

  - priority: 17
    category: business_temporal
    check: "A PREPARATION task's [window_start, window_end] closed interval, expanded by PREP_BAY_BUFFER_MINUTES (60) on both ends, must not intersect any other PENDING or COMPLETED PREPARATION task on the same market and bay_code. Adjacency is forbidden: touching endpoints conflict."
    error_id: ERR_PREP_BAY_CONFLICT
    http_status: 409
    applies_to: "POST /fleet/vehicles/{vehicle_id}/in-fleeting-tasks"

  # --- 18-21 business: referential / configuration ------------------------
  - priority: 18
    category: business_referential
    check: "The requested RemarketingChannel appears in the vehicle's eligible-channel
      pool per remarketing_channel_selection's filter (a), EXCEPT for that filter's
      RETAIL_LOT mileage clause, which is reported by the dedicated priority-20 code
      ERR_MILEAGE_BAND_EXCLUDES_CHANNEL instead. In practice this rule fires for a
      PROGRAM_REPURCHASE request whose vehicle is on a RISK program, is past
      max_holding_days, is over max_eligible_mileage_km, or is not in condition
      SOUND or RECONDITIONED, and for any request naming a SUSPENDED channel."
    error_id: ERR_CHANNEL_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /fleet/consignments"

  - priority: 18
    category: business_referential
    check: "supersedes_policy_id, when supplied, names a DepreciationPolicy with the same segment_id and status ACTIVE."
    error_id: ERR_SUPERSEDE_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /fleet/depreciation-policies"

  - priority: 19
    category: business_referential
    check: "Every Market that participates in the operation has status ACTIVE: the plan's market on plan create, the destination market on redistribution authorize and depart, the vehicle's current market on in-fleet."
    error_id: ERR_MARKET_SUSPENDED
    http_status: 422
    applies_to: "POST /fleet/fleet-plans, POST /fleet/redistribution-orders/{order_id}/authorize, POST /fleet/redistribution-orders/{order_id}/depart, POST /fleet/vehicles/{vehicle_id}/in-fleet"

  - priority: 19
    category: business_referential
    check: "destination_market_id differs from the vehicle's current_market_id."
    error_id: ERR_SAME_MARKET_TRANSFER
    http_status: 422
    applies_to: "POST /fleet/redistribution-orders"

  - priority: 20
    category: business_referential
    check: "Exactly one ACTIVE DepreciationPolicy exists for the vehicle's segment whenever a valuation is required."
    error_id: ERR_NO_ACTIVE_DEPRECIATION_POLICY
    http_status: 422
    applies_to: "GET /fleet/vehicles/{vehicle_id}/valuation, GET /fleet/vehicles/{vehicle_id}/channel-recommendation, POST /fleet/consignments, POST /fleet/vehicles/{vehicle_id}/damage-events"

  - priority: 20
    category: business_referential
    check: "A RETAIL_LOT consignment is refused when Vehicle.odometer_km exceeds VehicleSegment.mileage_band_hard_limit_km."
    error_id: ERR_MILEAGE_BAND_EXCLUDES_CHANNEL
    http_status: 422
    applies_to: "POST /fleet/consignments"

  # --- 22-24 business: constraint / capacity ------------------------------
  - priority: 22
    category: business_constraint
    check: "The count of non-CANCELLED Vehicles under a PurchaseAllocation may not exceed the allocation's unit_count."
    error_id: ERR_ALLOCATION_UNIT_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /fleet/purchase-allocations/{allocation_id}/vehicles"

  - priority: 22
    category: business_constraint
    check: "The number of PENDING plus COMPLETED PREPARATION tasks whose window_start falls on the same UTC calendar date as the new task, on the same market, may not exceed Market.prep_capacity_per_day. Each task individually fits a free bay yet the aggregate can still breach the daily ceiling."
    error_id: ERR_PREP_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /fleet/vehicles/{vehicle_id}/in-fleeting-tasks"

  - priority: 22
    category: business_constraint
    check: "The submitted odometer_km is greater than or equal to Vehicle.odometer_km."
    error_id: ERR_ODOMETER_REGRESSION
    http_status: 422
    applies_to: "POST /fleet/vehicles/{vehicle_id}/usage, POST /fleet/redistribution-orders/{order_id}/receive"

  - priority: 23
    category: business_constraint
    check: "recondition_authorized_cents may not exceed VehicleSegment.recondition_cap_cents."
    error_id: ERR_RECONDITION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /fleet/consignments/{consignment_id}/authorize-recondition"

  - priority: 23
    category: business_constraint
    check: "recondition_actual_cents may not exceed the previously authorized recondition_authorized_cents."
    error_id: ERR_RECONDITION_OVERRUN
    http_status: 422
    applies_to: "POST /fleet/consignments/{consignment_id}/complete-recondition"

  - priority: 23
    category: business_constraint
    check: "recovered_cents may not exceed round_half_up(DamageEvent.estimate_cents * RECOVERY_CAP_FACTOR)."
    error_id: ERR_RECOVERY_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /fleet/damage-events/{damage_event_id}/settle-recovery"

  - priority: 24
    category: business_constraint
    check: "The eligible-channel pool computed by remarketing_channel_selection is non-empty."
    error_id: ERR_NO_ELIGIBLE_CHANNEL
    http_status: 422
    applies_to: "GET /fleet/vehicles/{vehicle_id}/channel-recommendation"

  # --- 25-27 business: fiscal (last) --------------------------------------
  - priority: 25
    category: business_fiscal
    check: "A FleetPlan whose computed posture is RESTRICTED accepts a new allocation only when the added unit_count keeps allocated_unit_count at or below planned_unit_count."
    error_id: ERR_PLAN_POSTURE_RESTRICTED
    http_status: 422
    applies_to: "POST /fleet/fleet-plans/{plan_id}/allocations"

  - priority: 26
    category: business_fiscal
    check: "A FleetPlan whose computed posture is FROZEN (fill_ratio_bp >= 10000) accepts no further allocations at all."
    error_id: ERR_PLAN_POSTURE_FROZEN
    http_status: 422
    applies_to: "POST /fleet/fleet-plans/{plan_id}/allocations"

  - priority: 26
    category: business_fiscal
    check: "estimated_transport_cost_cents may not exceed round_half_up(VehicleSegment.baseline_daily_rate_cents * TRANSPORT_PAYBACK_DAYS)."
    error_id: ERR_TRANSPORT_COST_EXCEEDS_BENEFIT
    http_status: 422
    applies_to: "POST /fleet/redistribution-orders"

  - priority: 27
    category: business_fiscal
    check: "gross_proceeds_cents may not be below Consignment.floor_price_cents."
    error_id: ERR_PROCEEDS_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /fleet/consignments/{consignment_id}/record-sale"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # ===================== logical clock (test-driving) =====================
  - method: POST
    path: "/fleet/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical UTC clock to an explicit instant. The server's startup default logical clock is exactly 2026-08-01T00:00:00Z; until this endpoint is called the clock reads that default and MUST NOT fall back to real wall-clock time. Every holding-period, window, capacity-date and season computation reads this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock repositioned; no stored entity is recomputed retroactively"]

  - method: GET
    path: "/fleet/_clock"
    description: "Reads the logical UTC clock. Returns 2026-08-01T00:00:00Z when set_current_utc has never been called."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: null
    side_effects: []

  # ===================== Market ==========================================
  - method: POST
    path: "/fleet/markets"
    description: "Registers a rental market with its transport, storage and preparation economics."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, region, transport_hub_distance_km, transfer_cost_per_km_cents, storage_cost_per_day_cents, prep_capacity_per_day, registration_lead_days]
    output: Market
    side_effects: ["Market created in status ACTIVE with in_service_unit_count 0"]

  - method: GET
    path: "/fleet/markets/{market_id}"
    description: "Reads one market including its live in_service_unit_count census."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: Market
    side_effects: []

  - method: GET
    path: "/fleet/markets"
    description: "Lists markets, newest created_at last, with optional filters."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["region?", "status?", "code?", "limit?", "offset?"]
    output: Market[]
    side_effects: []

  - method: POST
    path: "/fleet/markets/{market_id}/suspend"
    description: "Suspends a market so it can no longer host new plans, in-fleeting or inbound transfers."
    roles: [PlatformAdmin]
    code: 200
    output: Market
    side_effects: ["Market.status ACTIVE -> SUSPENDED", "increments Market.version by 1"]

  # ===================== VehicleSegment ==================================
  - method: POST
    path: "/fleet/vehicle-segments"
    description: "Registers a vehicle segment with its rate, utilization, mileage-band and reconditioning-cap policy."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, baseline_daily_rate_cents, target_utilization_pct, target_revenue_per_unit_month_cents, mileage_band_soft_limit_km, mileage_band_hard_limit_km, recondition_cap_cents]
    output: VehicleSegment
    side_effects: ["VehicleSegment created"]

  - method: GET
    path: "/fleet/vehicle-segments/{segment_id}"
    description: "Reads one vehicle segment."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: VehicleSegment
    side_effects: []

  - method: GET
    path: "/fleet/vehicle-segments"
    description: "Lists vehicle segments."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: VehicleSegment[]
    side_effects: []

  # ===================== ManufacturerProgram =============================
  - method: POST
    path: "/fleet/manufacturer-programs"
    description: "Registers a model-year purchase program. program_type PROGRAM carries manufacturer repurchase terms; RISK carries none."
    roles: [PlatformAdmin]
    code: 201
    input: [manufacturer_name, program_year, program_type, repurchase_guarantee_pct, min_holding_days, max_holding_days, max_eligible_mileage_km, excess_mileage_charge_cents_per_km, damage_deduction_cap_cents]
    output: ManufacturerProgram
    side_effects: ["ManufacturerProgram created in status ACTIVE"]

  - method: GET
    path: "/fleet/manufacturer-programs/{program_id}"
    description: "Reads one manufacturer program."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: ManufacturerProgram
    side_effects: []

  - method: GET
    path: "/fleet/manufacturer-programs"
    description: "Lists manufacturer programs."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["program_type?", "program_year?", "status?", "limit?", "offset?"]
    output: ManufacturerProgram[]
    side_effects: []

  - method: POST
    path: "/fleet/manufacturer-programs/{program_id}/close"
    description: "Closes a program so no new purchase allocation may reference it. Vehicles already bought under it keep their repurchase terms."
    roles: [PlatformAdmin]
    code: 200
    output: ManufacturerProgram
    side_effects: ["ManufacturerProgram.status ACTIVE -> CLOSED", "increments ManufacturerProgram.version by 1"]

  # ===================== RemarketingChannel ==============================
  - method: POST
    path: "/fleet/remarketing-channels"
    description: "Registers a disposal channel with its fee structure, expected sale velocity and proceeds multiplier."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, fee_pct, fixed_fee_cents, expected_days_to_sell, expected_proceeds_multiplier, recondition_required]
    output: RemarketingChannel
    side_effects: ["RemarketingChannel created in status ACTIVE"]

  - method: GET
    path: "/fleet/remarketing-channels/{channel_id}"
    description: "Reads one remarketing channel."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: RemarketingChannel
    side_effects: []

  - method: GET
    path: "/fleet/remarketing-channels"
    description: "Lists remarketing channels in created_at ASC order."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["code?", "status?", "recondition_required?", "limit?", "offset?"]
    output: RemarketingChannel[]
    side_effects: []

  - method: POST
    path: "/fleet/remarketing-channels/{channel_id}/suspend"
    description: "Suspends a channel, removing it from every vehicle's eligible-channel pool."
    roles: [PlatformAdmin]
    code: 200
    output: RemarketingChannel
    side_effects: ["RemarketingChannel.status ACTIVE -> SUSPENDED", "increments RemarketingChannel.version by 1"]

  # ===================== DepreciationPolicy ==============================
  - method: POST
    path: "/fleet/depreciation-policies"
    description: "Drafts a depreciation policy for one segment. Optionally names the ACTIVE policy it will supersede on activation."
    roles: [FleetController]
    code: 201
    input: [segment_id, name, monthly_depreciation_pct, mileage_depreciation_cents_per_km, floor_residual_pct, effective_from, "supersedes_policy_id?"]
    output: DepreciationPolicy
    side_effects: ["DepreciationPolicy created in status DRAFT with created_by_user_id set from X-User-ID"]

  - method: GET
    path: "/fleet/depreciation-policies/{policy_id}"
    description: "Reads one depreciation policy."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: DepreciationPolicy
    side_effects: []

  - method: GET
    path: "/fleet/depreciation-policies"
    description: "Lists depreciation policies; the segment_id and supersedes_policy_id filters are the reverse-reachability channel for both of this entity's foreign keys."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["segment_id?", "supersedes_policy_id?", "status?", "limit?", "offset?"]
    output: DepreciationPolicy[]
    side_effects: []

  - method: POST
    path: "/fleet/depreciation-policies/{policy_id}/activate"
    description: "Activates a DRAFT policy. Segregation of duties: the activating X-User-ID must differ from created_by_user_id."
    roles: [FleetController]
    code: 200
    output: DepreciationPolicy
    side_effects: ["DepreciationPolicy.status DRAFT -> ACTIVE", "activated_by_user_id set from X-User-ID", "any other ACTIVE policy for the same segment transitions ACTIVE -> SUPERSEDED", "increments DepreciationPolicy.version by 1"]

  # ===================== FleetPlan =======================================
  - method: POST
    path: "/fleet/fleet-plans"
    description: "Drafts a fleet-sizing plan for one market, season and plan year with utilization and revenue-per-unit targets."
    roles: [FleetPlanner]
    code: 201
    input: [market_id, season, plan_year, planned_unit_count, revenue_per_unit_target_cents, utilization_target_pct]
    output: FleetPlan
    side_effects: ["FleetPlan created in status DRAFT with allocated_unit_count 0, in_fleeted_unit_count 0 and posture OPEN"]

  - method: GET
    path: "/fleet/fleet-plans/{plan_id}"
    description: "Reads one fleet plan including its computed allocated_unit_count, in_fleeted_unit_count and posture."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: FleetPlan
    side_effects: []

  - method: GET
    path: "/fleet/fleet-plans"
    description: "Lists fleet plans; the market_id filter is the reverse-reachability channel for FleetPlan.market_id."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["market_id?", "season?", "plan_year?", "status?", "limit?", "offset?"]
    output: FleetPlan[]
    side_effects: []

  - method: POST
    path: "/fleet/fleet-plans/{plan_id}/lock"
    description: "Locks a DRAFT plan. Locking is the gate that lets vehicles under the plan be in-fleeted."
    roles: [FleetController]
    code: 200
    output: FleetPlan
    side_effects: ["FleetPlan.status DRAFT -> LOCKED", "increments FleetPlan.version by 1"]

  - method: POST
    path: "/fleet/fleet-plans/{plan_id}/allocations"
    description: "Adds a purchase allocation to a plan, splitting the planned units across a manufacturer program and a segment. Optimistic-concurrency protected: expected_plan_version must equal the plan's current version."
    roles: [FleetPlanner]
    code: 201
    input: [program_id, segment_id, unit_count, capitalized_cost_per_unit_cents, expected_plan_version]
    output: PurchaseAllocation
    side_effects: ["PurchaseAllocation created in status ORDERED", "FleetPlan.allocated_unit_count increased by unit_count", "FleetPlan.posture recomputed from the new fill_ratio_bp", "increments FleetPlan.version by 1"]

  - method: GET
    path: "/fleet/fleet-plans/{plan_id}/performance"
    description: "Computed read. Returns both variants of fleet_plan_utilization_and_rpu side by side plus the plan's posture. Fields: planned_unit_count, allocated_unit_count, in_fleeted_unit_count, utilization_pct_planned, revenue_per_unit_cents_planned, utilization_pct_actual, revenue_per_unit_cents_actual, rpu_variance_cents, posture, season_days."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager]
    code: 200
    output: null
    side_effects: []

  # ===================== PurchaseAllocation ==============================
  - method: GET
    path: "/fleet/purchase-allocations/{allocation_id}"
    description: "Reads one purchase allocation including its computed in_fleeted_count and created_vehicle_count."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: PurchaseAllocation
    side_effects: []

  - method: GET
    path: "/fleet/purchase-allocations"
    description: "Lists purchase allocations; the plan_id, program_id and segment_id filters are the reverse-reachability channel for all three of this entity's foreign keys."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["plan_id?", "program_id?", "segment_id?", "status?", "limit?", "offset?"]
    output: PurchaseAllocation[]
    side_effects: []

  - method: POST
    path: "/fleet/purchase-allocations/{allocation_id}/cancel"
    description: "Cancels an ORDERED allocation that has not yet minted any vehicle, returning its units to the parent plan's headroom. This is the compensating action for allocation creation."
    roles: [FleetPlanner]
    code: 200
    output: PurchaseAllocation
    side_effects: ["PurchaseAllocation.status ORDERED -> CANCELLED", "FleetPlan.allocated_unit_count decreased by unit_count", "FleetPlan.posture recomputed", "increments FleetPlan.version by 1", "increments PurchaseAllocation.version by 1"]

  - method: POST
    path: "/fleet/purchase-allocations/{allocation_id}/vehicles"
    description: "Mints one physical vehicle against an allocation. segment_id, program_id and capitalized_cost_cents are copied from the allocation and cannot be supplied."
    roles: [FleetPlanner]
    code: 201
    input: [vin, current_market_id]
    output: Vehicle
    side_effects: ["Vehicle created in fleet_status ON_ORDER and condition_status SOUND with odometer_km 0", "LedgerEntry of entry_type CAPITALIZATION posted for +capitalized_cost_cents", "PurchaseAllocation.created_vehicle_count recomputed"]

  # ===================== Vehicle =========================================
  - method: GET
    path: "/fleet/vehicles/{vehicle_id}"
    description: "Reads one vehicle including its computed total_recondition_cents and net_book_value_cents."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/fleet/vehicles"
    description: "Lists vehicles; the allocation_id, segment_id, program_id and current_market_id filters are the reverse-reachability channel for all four of this entity's foreign keys."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["allocation_id?", "segment_id?", "program_id?", "current_market_id?", "fleet_status?", "condition_status?", "vin?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  - method: POST
    path: "/fleet/vehicles/{vehicle_id}/in-fleet"
    description: "Moves an ON_ORDER vehicle into the in-fleeting pipeline. Requires the grandparent FleetPlan to be LOCKED and the vehicle's market to be ACTIVE."
    roles: [MarketOperator]
    code: 200
    output: Vehicle
    side_effects: ["Vehicle.fleet_status ON_ORDER -> IN_FLEETING", "increments Vehicle.version by 1"]

  - method: POST
    path: "/fleet/vehicles/{vehicle_id}/usage"
    description: "Posts a rental-usage delta onto an IN_SERVICE vehicle: cumulative odometer plus rented-day, available-day and revenue increments. Feeds fleet_plan_utilization_and_rpu."
    roles: [MarketOperator]
    code: 200
    input: [odometer_km, rented_days_delta, available_days_delta, revenue_cents_delta]
    output: Vehicle
    side_effects: ["Vehicle.odometer_km replaced by the submitted cumulative value", "rented_days_total, available_days_total and revenue_to_date_cents each increased by their delta", "increments Vehicle.version by 1"]

  - method: GET
    path: "/fleet/vehicles/{vehicle_id}/valuation"
    description: "Computed read. Runs vehicle_residual_valuation and returns both variants side by side. Fields: holding_days, holding_months, odometer_km, capitalized_cost_cents, policy_net_book_value_cents, program_guaranteed_value_cents, net_book_value_cents, accumulated_depreciation_cents, applied_variant, mileage_band, open_damage_cents."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: null
    side_effects: []

  - method: GET
    path: "/fleet/vehicles/{vehicle_id}/channel-recommendation"
    description: "Computed read. Runs remarketing_channel_selection. Fields: recommended_channel_id, recommended_channel_code, projected_net_proceeds_cents, eligible_channel_count, ranked_channel_codes, excluded_channel_codes. Returns ERR_NO_ELIGIBLE_CHANNEL (422) when the candidate pool is empty."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager]
    code: 200
    output: null
    side_effects: []

  - method: GET
    path: "/fleet/vehicles/{vehicle_id}/ledger-entries"
    description: "Sub-resource list. The per-vehicle discovery channel for cascade-posted ledger rows. Ordered posted_at ASC, then created_at ASC."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["entry_type?", "source_entity_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ===================== LedgerEntry =====================================
  - method: GET
    path: "/fleet/ledger-entries/{ledger_entry_id}"
    description: "Reads one immutable ledger row. LedgerEntry has common_fields false, so there is deliberately no POST, PATCH or DELETE for it: every row is written as a side effect of another transition."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/fleet/ledger-entries"
    description: "Lists ledger rows across the fleet; the vehicle_id filter is the reverse-reachability channel for LedgerEntry.vehicle_id. Ordered posted_at ASC, then created_at ASC."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["vehicle_id?", "entry_type?", "source_entity_type?", "source_entity_id?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ===================== InFleetingTask ==================================
  - method: POST
    path: "/fleet/vehicles/{vehicle_id}/in-fleeting-tasks"
    description: "Schedules one in-fleeting task (REGISTRATION, LICENSING or PREPARATION) for an IN_FLEETING vehicle. market_id is copied from the vehicle. PREPARATION additionally requires a bay_code and is subject to bay-interval and daily-capacity checks."
    roles: [MarketOperator]
    code: 201
    input: [task_type, cost_cents, window_start, window_end, "bay_code?"]
    output: InFleetingTask
    side_effects: ["InFleetingTask created in status PENDING"]

  - method: GET
    path: "/fleet/in-fleeting-tasks/{task_id}"
    description: "Reads one in-fleeting task."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: InFleetingTask
    side_effects: []

  - method: GET
    path: "/fleet/in-fleeting-tasks"
    description: "Lists in-fleeting tasks; the vehicle_id and market_id filters are the reverse-reachability channel for both of this entity's foreign keys."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["vehicle_id?", "market_id?", "task_type?", "status?", "limit?", "offset?"]
    output: InFleetingTask[]
    side_effects: []

  - method: POST
    path: "/fleet/in-fleeting-tasks/{task_id}/complete"
    description: "Marks a PENDING task complete, stamping the matching milestone on the vehicle. Completing or waiving the third distinct task_type promotes the vehicle to IN_SERVICE and cascades to the allocation and the plan."
    roles: [MarketOperator]
    code: 200
    output: InFleetingTask
    side_effects: ["InFleetingTask.status PENDING -> COMPLETED with completed_at stamped from the logical clock", "Vehicle.registered_at / licensed_at / prep_completed_at stamped per task_type", "LedgerEntry of entry_type PREP_COST posted for +cost_cents", "when all three task_types are resolved: Vehicle.first_rent_ready_at and in_service_at stamped, Vehicle.fleet_status IN_FLEETING -> IN_SERVICE, Market.in_service_unit_count incremented, PurchaseAllocation.in_fleeted_count recomputed and its status advanced, FleetPlan.in_fleeted_unit_count recomputed and the plan possibly CLOSED", "increments Vehicle.version by 1"]

  - method: POST
    path: "/fleet/in-fleeting-tasks/{task_id}/waive"
    description: "Waives a PENDING task without cost. Counts toward the three-task completion gate but posts no PREP_COST ledger row."
    roles: [FleetController]
    code: 200
    output: InFleetingTask
    side_effects: ["InFleetingTask.status PENDING -> WAIVED", "same completion cascade as complete when it resolves the third task_type", "no LedgerEntry is posted"]

  # ===================== RedistributionOrder =============================
  - method: POST
    path: "/fleet/redistribution-orders"
    description: "Drafts an inter-city redistribution for an IN_SERVICE vehicle. origin_market_id is copied from the vehicle's current_market_id; estimated_transport_cost_cents is frozen by redistribution_transport_cost."
    roles: [FleetPlanner]
    code: 201
    input: [vehicle_id, destination_market_id, distance_km, planned_depart_at, planned_receive_at]
    output: RedistributionOrder
    side_effects: ["RedistributionOrder created in status DRAFT with revision_count 0", "estimated_transport_cost_cents computed and frozen"]

  - method: GET
    path: "/fleet/redistribution-orders/{order_id}"
    description: "Reads one redistribution order."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: RedistributionOrder
    side_effects: []

  - method: GET
    path: "/fleet/redistribution-orders"
    description: "Lists redistribution orders; the vehicle_id, origin_market_id and destination_market_id filters are the reverse-reachability channel for all three of this entity's foreign keys."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["vehicle_id?", "origin_market_id?", "destination_market_id?", "status?", "limit?", "offset?"]
    output: RedistributionOrder[]
    side_effects: []

  - method: POST
    path: "/fleet/redistribution-orders/{order_id}/propose"
    description: "Submits a DRAFT or REJECTED order for authorization, recording the proposing user. Re-proposing a REJECTED order increments revision_count and is refused once revision_count reaches 3."
    roles: [FleetPlanner]
    code: 200
    output: RedistributionOrder
    side_effects: ["RedistributionOrder.status DRAFT|REJECTED -> PROPOSED", "proposed_by_user_id set from X-User-ID", "revision_count incremented by 1 when the previous status was REJECTED", "increments RedistributionOrder.version by 1"]

  - method: POST
    path: "/fleet/redistribution-orders/{order_id}/reject"
    description: "Rejects a PROPOSED order with a reason, sending it back for revision."
    roles: [FleetController]
    code: 200
    input: [rejection_reason]
    output: RedistributionOrder
    side_effects: ["RedistributionOrder.status PROPOSED -> REJECTED", "rejection_reason stored", "increments RedistributionOrder.version by 1"]

  - method: POST
    path: "/fleet/redistribution-orders/{order_id}/authorize"
    description: "Authorizes a PROPOSED order. Segregation of duties: the authorizing X-User-ID must differ from proposed_by_user_id. The destination market must be ACTIVE."
    roles: [FleetController]
    code: 200
    output: RedistributionOrder
    side_effects: ["RedistributionOrder.status PROPOSED -> AUTHORIZED", "authorized_by_user_id set from X-User-ID", "increments RedistributionOrder.version by 1"]

  - method: POST
    path: "/fleet/redistribution-orders/{order_id}/depart"
    description: "Dispatches an AUTHORIZED order. Takes the vehicle out of the origin market's in-service census for the duration of the haul."
    roles: [MarketOperator]
    code: 200
    output: RedistributionOrder
    side_effects: ["RedistributionOrder.status AUTHORIZED -> IN_TRANSIT with depart_at stamped from the logical clock", "Vehicle.fleet_status IN_SERVICE -> IN_TRANSIT", "origin Market.in_service_unit_count decremented", "increments Vehicle.version by 1", "increments RedistributionOrder.version by 1"]

  - method: POST
    path: "/fleet/redistribution-orders/{order_id}/receive"
    description: "Receives an IN_TRANSIT order at the destination, rehoming the vehicle and posting the actual transport cost to the fleet ledger."
    roles: [MarketOperator]
    code: 200
    input: [actual_transport_cost_cents, odometer_km]
    output: RedistributionOrder
    side_effects: ["RedistributionOrder.status IN_TRANSIT -> RECEIVED with receive_at stamped from the logical clock", "Vehicle.current_market_id replaced by destination_market_id", "Vehicle.fleet_status IN_TRANSIT -> IN_SERVICE", "Vehicle.odometer_km replaced by the submitted cumulative value", "destination Market.in_service_unit_count incremented", "LedgerEntry of entry_type TRANSPORT_COST posted for +actual_transport_cost_cents", "increments Vehicle.version by 1", "increments RedistributionOrder.version by 1"]

  - method: POST
    path: "/fleet/redistribution-orders/{order_id}/cancel"
    description: "Cancels an order at any non-terminal stage. Cancelling an IN_TRANSIT order returns the vehicle to its ORIGIN market and restores the origin market's census exactly."
    roles: [FleetController]
    code: 200
    output: RedistributionOrder
    side_effects: ["RedistributionOrder.status DRAFT|PROPOSED|REJECTED|AUTHORIZED|IN_TRANSIT -> CANCELLED", "when the previous status was IN_TRANSIT: Vehicle.fleet_status IN_TRANSIT -> IN_SERVICE, Vehicle.current_market_id left at origin_market_id, origin Market.in_service_unit_count incremented back", "no TRANSPORT_COST LedgerEntry is posted", "increments RedistributionOrder.version by 1"]

  # ===================== DamageEvent =====================================
  - method: POST
    path: "/fleet/vehicles/{vehicle_id}/damage-events"
    description: "Reports damage on a vehicle. market_id is copied from the vehicle. net_book_value_at_report_cents is frozen from vehicle_residual_valuation and total_loss_required is decided by the 70.00% integer ratio test."
    roles: [MarketOperator]
    code: 201
    input: [damage_type, estimate_cents]
    output: DamageEvent
    side_effects: ["DamageEvent created in status REPORTED", "net_book_value_at_report_cents frozen", "total_loss_required computed", "Vehicle.condition_status SOUND|RECONDITIONED -> DAMAGE_REPORTED", "increments Vehicle.version by 1"]

  - method: GET
    path: "/fleet/damage-events/{damage_event_id}"
    description: "Reads one damage event including its recovery-waterfall allocation buckets."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: DamageEvent
    side_effects: []

  - method: GET
    path: "/fleet/damage-events"
    description: "Lists damage events; the vehicle_id and market_id filters are the reverse-reachability channel for both of this entity's foreign keys."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["vehicle_id?", "market_id?", "damage_type?", "status?", "limit?", "offset?"]
    output: DamageEvent[]
    side_effects: []

  - method: POST
    path: "/fleet/damage-events/{damage_event_id}/revise-estimate"
    description: "Revises the repair estimate on a REPORTED or RECOVERY_PENDING event. Re-runs the total-loss ratio test against the ORIGINAL frozen net_book_value_at_report_cents, which can flip total_loss_required to true after recovery has already been opened."
    roles: [MarketOperator]
    code: 200
    input: [estimate_cents]
    output: DamageEvent
    side_effects: ["DamageEvent.estimate_cents replaced", "total_loss_required recomputed against the unchanged net_book_value_at_report_cents", "DamageEvent.status is unchanged", "increments DamageEvent.version by 1"]

  - method: POST
    path: "/fleet/damage-events/{damage_event_id}/open-recovery"
    description: "Opens a recovery claim against a customer, third-party insurer or own insurance. Refused when total_loss_required is true."
    roles: [RemarketingManager]
    code: 200
    input: [recovery_source]
    output: DamageEvent
    side_effects: ["DamageEvent.status REPORTED -> RECOVERY_PENDING", "recovery_source stored", "Vehicle.condition_status is untouched (the two dimensions move independently)", "increments DamageEvent.version by 1"]

  - method: POST
    path: "/fleet/damage-events/{damage_event_id}/settle-recovery"
    description: "Settles a recovery, splitting recovered_cents across the reconditioning, depreciation and income buckets by the ordered waterfall."
    roles: [RemarketingManager]
    code: 200
    input: [recovered_cents]
    output: DamageEvent
    side_effects: ["DamageEvent.status RECOVERY_PENDING -> RECOVERED", "recovery_alloc_recondition_cents, recovery_alloc_depreciation_cents and recovery_alloc_income_cents written from the waterfall", "LedgerEntry of entry_type DAMAGE_RECOVERY posted for -recovered_cents", "Vehicle.condition_status DAMAGE_REPORTED -> SOUND once no other damage event for the vehicle remains open; suppressed when the condition has since moved to RECONDITIONING", "increments Vehicle.version by 1", "increments DamageEvent.version by 1"]

  - method: POST
    path: "/fleet/damage-events/{damage_event_id}/write-off"
    description: "Absorbs the repair cost with no recovery, from REPORTED or RECOVERY_PENDING. Refused when total_loss_required is true."
    roles: [FleetController]
    code: 200
    output: DamageEvent
    side_effects: ["DamageEvent.status REPORTED|RECOVERY_PENDING -> WRITTEN_OFF", "recovered_cents set to 0 and all three allocation buckets set to 0", "no LedgerEntry is posted", "Vehicle.condition_status DAMAGE_REPORTED -> SOUND once no other damage event for the vehicle remains open; suppressed when the condition has since moved to RECONDITIONING", "increments Vehicle.version by 1", "increments DamageEvent.version by 1"]

  - method: POST
    path: "/fleet/damage-events/{damage_event_id}/declare-total-loss"
    description: "Declares a total loss and retires the vehicle from the fleet, cascading to every open redistribution order and consignment. Refused unless total_loss_required is true."
    roles: [FleetController]
    code: 200
    input: [salvage_proceeds_cents]
    output: DamageEvent
    side_effects: ["DamageEvent.status REPORTED|RECOVERY_PENDING -> TOTAL_LOSS_DECLARED", "total_loss_gain_loss_cents computed", "LedgerEntry of entry_type SALVAGE_PROCEEDS posted for -salvage_proceeds_cents", "Vehicle.fleet_status -> TOTAL_LOSS and Vehicle.condition_status -> TOTALED", "every RedistributionOrder for the vehicle in a non-terminal status -> CANCELLED", "every Consignment for the vehicle in a non-terminal status -> WITHDRAWN", "Market.in_service_unit_count decremented when the vehicle was IN_SERVICE", "increments Vehicle.version by 1", "increments DamageEvent.version by 1"]

  # ===================== Consignment =====================================
  - method: POST
    path: "/fleet/consignments"
    description: "Consigns a vehicle to a remarketing channel, moving it out of service and freezing its net book value. Optimistic-concurrency protected: expected_vehicle_version must equal the vehicle's current version. The channel must be in the vehicle's eligible-channel pool; the min_holding_days gate applies only to PROGRAM_REPURCHASE."
    roles: [RemarketingManager]
    code: 201
    input: [vehicle_id, channel_id, expected_vehicle_version]
    output: Consignment
    side_effects: ["Consignment created in status DRAFT with created_by_user_id set from X-User-ID", "floor_price_cents frozen at round_half_up(net_book_value_cents * 0.75)", "Vehicle.fleet_status IN_SERVICE -> HELD_FOR_SALE with held_for_sale_at and net_book_value_at_hold_cents frozen", "Market.in_service_unit_count decremented", "increments Vehicle.version by 1"]

  - method: GET
    path: "/fleet/consignments/{consignment_id}"
    description: "Reads one consignment including its computed fee, transport, loaded-recondition, net-proceeds and gain/loss lines."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    output: Consignment
    side_effects: []

  - method: GET
    path: "/fleet/consignments"
    description: "Lists consignments; the vehicle_id and channel_id filters are the reverse-reachability channel for both of this entity's foreign keys."
    roles: [PlatformAdmin, FleetPlanner, FleetController, RemarketingManager, MarketOperator]
    code: 200
    input: ["vehicle_id?", "channel_id?", "status?", "limit?", "offset?"]
    output: Consignment[]
    side_effects: []

  - method: POST
    path: "/fleet/consignments/{consignment_id}/authorize-recondition"
    description: "Authorizes a reconditioning budget on a DRAFT consignment, capped by the segment's recondition_cap_cents."
    roles: [RemarketingManager]
    code: 200
    input: [recondition_authorized_cents]
    output: Consignment
    side_effects: ["Consignment.status DRAFT -> RECONDITION_PENDING", "recondition_authorized_cents stored", "Vehicle.condition_status SOUND|DAMAGE_REPORTED -> RECONDITIONING", "increments Vehicle.version by 1", "increments Consignment.version by 1"]

  - method: POST
    path: "/fleet/consignments/{consignment_id}/complete-recondition"
    description: "Books the actual reconditioning spend, which may not exceed the authorized budget."
    roles: [RemarketingManager]
    code: 200
    input: [recondition_actual_cents]
    output: Consignment
    side_effects: ["Consignment.status is unchanged and stays RECONDITION_PENDING", "recondition_actual_cents stored and recondition_loaded_cents computed as round_half_up(recondition_actual_cents * 1.075)", "LedgerEntry of entry_type RECONDITION_COST posted for +recondition_loaded_cents", "Vehicle.total_recondition_cents recomputed as the signed sum of RECONDITION_COST and RECONDITION_REVERSAL rows", "Vehicle.condition_status RECONDITIONING -> RECONDITIONED", "increments Vehicle.version by 1", "increments Consignment.version by 1"]

  - method: POST
    path: "/fleet/consignments/{consignment_id}/list"
    description: "Publishes a DRAFT or RECONDITION_PENDING consignment to its channel. From DRAFT the channel's recondition_required must be false. Refused while any damage event on the vehicle is still open."
    roles: [RemarketingManager]
    code: 200
    output: Consignment
    side_effects: ["Consignment.status DRAFT|RECONDITION_PENDING -> LISTED with listed_at stamped from the logical clock", "increments Consignment.version by 1"]

  - method: POST
    path: "/fleet/consignments/{consignment_id}/record-sale"
    description: "Records the hammer price on a LISTED consignment. Runs consignment_net_proceeds with per-line rounding. gross_proceeds_cents may not fall below floor_price_cents."
    roles: [RemarketingManager]
    code: 200
    input: [gross_proceeds_cents]
    output: Consignment
    side_effects: ["Consignment.status LISTED -> SOLD_PENDING_SETTLEMENT", "gross_proceeds_cents stored and channel_fee_cents, transport_to_channel_cents, net_proceeds_cents and gain_loss_cents computed and stored", "no LedgerEntry is posted yet; the four disposal rows post at settle", "increments Consignment.version by 1"]

  - method: POST
    path: "/fleet/consignments/{consignment_id}/settle"
    description: "Settles the sale and retires the vehicle. Segregation of duties: the settling X-User-ID must differ from created_by_user_id."
    roles: [RemarketingManager]
    code: 200
    output: Consignment
    side_effects: ["Consignment.status SOLD_PENDING_SETTLEMENT -> SETTLED with settled_at stamped and settled_by_user_id set from X-User-ID", "LedgerEntry of entry_type DISPOSAL_PROCEEDS posted for -gross_proceeds_cents", "LedgerEntry of entry_type CHANNEL_FEE posted for +channel_fee_cents", "LedgerEntry of entry_type TRANSPORT_COST posted for +transport_to_channel_cents", "LedgerEntry of entry_type DISPOSAL_GAIN_LOSS posted for gain_loss_cents", "Vehicle.fleet_status HELD_FOR_SALE -> SOLD", "increments Vehicle.version by 1", "increments Consignment.version by 1"]

  - method: POST
    path: "/fleet/consignments/{consignment_id}/withdraw"
    description: "Withdraws a consignment before settlement and compensates every cost already posted, returning the vehicle to service."
    roles: [RemarketingManager]
    code: 200
    output: Consignment
    side_effects: ["Consignment.status DRAFT|RECONDITION_PENDING|LISTED -> WITHDRAWN; a SOLD_PENDING_SETTLEMENT or SETTLED consignment may NOT be withdrawn and returns ERR_CONSIGNMENT_INVALID_STATE", "a compensating LedgerEntry of entry_type RECONDITION_REVERSAL is posted for -recondition_loaded_cents when a RECONDITION_COST row exists", "Vehicle.total_recondition_cents recomputed back to its pre-consignment value", "Vehicle.fleet_status HELD_FOR_SALE -> IN_SERVICE with held_for_sale_at and net_book_value_at_hold_cents cleared", "Vehicle.condition_status RECONDITIONING|RECONDITIONED -> SOUND", "Market.in_service_unit_count incremented back", "increments Vehicle.version by 1", "increments Consignment.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # --- auth / authz -------------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or an empty string."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the five roles declared in §1.7."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The role is valid but does not appear in the target endpoint's roles list."
  - id: ERR_MARKET_SCOPE_VIOLATION
    http: 403
    condition: "A MarketOperator's X-User-ID is not the id of the market that owns the target resource."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user is the same user who performed the preceding step of a two-man control (redistribution propose vs authorize, consignment create vs settle, policy draft vs activate)."

  # --- not found ----------------------------------------------------------
  - id: ERR_MARKET_NOT_FOUND
    http: 404
    condition: "No Market with the given id, whether referenced in the path or in a request body."
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "No VehicleSegment with the given id."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No ManufacturerProgram with the given id."
  - id: ERR_CHANNEL_NOT_FOUND
    http: 404
    condition: "No RemarketingChannel with the given id."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "No DepreciationPolicy with the given id, including via supersedes_policy_id."
  - id: ERR_FLEET_PLAN_NOT_FOUND
    http: 404
    condition: "No FleetPlan with the given id."
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No PurchaseAllocation with the given id."
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "No Vehicle with the given id."
  - id: ERR_TASK_NOT_FOUND
    http: 404
    condition: "No InFleetingTask with the given id."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No RedistributionOrder with the given id."
  - id: ERR_DAMAGE_EVENT_NOT_FOUND
    http: 404
    condition: "No DamageEvent with the given id."
  - id: ERR_CONSIGNMENT_NOT_FOUND
    http: 404
    condition: "No Consignment with the given id."

  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "No LedgerEntry with the given id."

  # --- request schema -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required body field, unparseable type, out-of-range number, unknown enum member, or malformed ISO-8601 instant."
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1..200 or offset negative."
  - id: ERR_INVALID_UNIT_COUNT
    http: 422
    condition: "unit_count on an allocation is not an integer >= 1."

  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version does not equal the target FleetPlan's current version."
  - id: ERR_STALE_VEHICLE_VERSION
    http: 412
    condition: "expected_vehicle_version does not equal the target Vehicle's current version."

  # --- uniqueness ---------------------------------------------------------
  - id: ERR_DUPLICATE_MARKET_CODE
    http: 409
    condition: "A Market with the same code already exists."
  - id: ERR_DUPLICATE_SEGMENT_CODE
    http: 409
    condition: "A VehicleSegment with the same code already exists."
  - id: ERR_DUPLICATE_CHANNEL_CODE
    http: 409
    condition: "A RemarketingChannel with the same code already exists."
  - id: ERR_DUPLICATE_VIN
    http: 409
    condition: "A Vehicle with the same vin already exists."
  - id: ERR_DUPLICATE_FLEET_PLAN
    http: 409
    condition: "A FleetPlan already exists for the same (market_id, season, plan_year) triple."
  - id: ERR_DUPLICATE_TASK_TYPE
    http: 409
    condition: "A non-WAIVED InFleetingTask of the same task_type already exists for the vehicle."

  # --- state preconditions ------------------------------------------------
  - id: ERR_PLAN_NOT_DRAFT
    http: 409
    condition: "The FleetPlan is not in status DRAFT for an operation that requires DRAFT."
  - id: ERR_PLAN_NOT_LOCKED
    http: 409
    condition: "The grandparent FleetPlan is not in status LOCKED when a vehicle under it is in-fleeted."
  - id: ERR_ALLOCATION_NOT_CANCELLABLE
    http: 409
    condition: "The PurchaseAllocation is not ORDERED (PARTIALLY_INFLEETED, INFLEETED or already CANCELLED), or its created_vehicle_count is greater than 0."
  - id: ERR_VEHICLE_INVALID_FLEET_STATE
    http: 409
    condition: "Vehicle.fleet_status is not a declared from-state for the requested transition."
  - id: ERR_VEHICLE_INVALID_CONDITION_STATE
    http: 409
    condition: "Vehicle.condition_status is not a declared from-state for the requested condition transition."
  - id: ERR_TASK_ALREADY_RESOLVED
    http: 409
    condition: "The InFleetingTask is already COMPLETED or WAIVED."
  - id: ERR_ORDER_INVALID_STATE
    http: 409
    condition: "RedistributionOrder.status is not a declared from-state for the requested transition."
  - id: ERR_DAMAGE_EVENT_INVALID_STATE
    http: 409
    condition: "DamageEvent.status is not a declared from-state for the requested transition."
  - id: ERR_CONSIGNMENT_INVALID_STATE
    http: 409
    condition: "Consignment.status is not a declared from-state for the requested transition."
  - id: ERR_POLICY_NOT_DRAFT
    http: 409
    condition: "The DepreciationPolicy being activated is already ACTIVE or SUPERSEDED."
  - id: ERR_PROGRAM_CLOSED
    http: 409
    condition: "The referenced ManufacturerProgram has status CLOSED when a new allocation names it."
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "A REJECTED RedistributionOrder whose revision_count already equals 3 is re-proposed."

  # --- business: safety ---------------------------------------------------
  - id: ERR_TOTAL_LOSS_DETERMINATION_REQUIRED
    http: 422
    condition: "open-recovery or write-off invoked on a DamageEvent whose total_loss_required is true."
  - id: ERR_TOTAL_LOSS_NOT_APPLICABLE
    http: 422
    condition: "declare-total-loss invoked on a DamageEvent whose total_loss_required is false."
  - id: ERR_OPEN_DAMAGE_BLOCKS_LISTING
    http: 422
    condition: "A DamageEvent for the vehicle is still in status REPORTED or RECOVERY_PENDING when a consignment is created or listed."

  # --- business: temporal -------------------------------------------------
  - id: ERR_PREP_BEFORE_REGISTRATION
    http: 422
    condition: "A PREPARATION task is scheduled before the vehicle's REGISTRATION and LICENSING tasks are both resolved."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_start is not strictly before window_end."
  - id: ERR_TRANSFER_WINDOW_INVALID
    http: 422
    condition: "planned_depart_at is not strictly before planned_receive_at."
  - id: ERR_MIN_HOLDING_PERIOD_NOT_MET
    http: 422
    condition: "A PROGRAM_REPURCHASE consignment is created before the program's min_holding_days has elapsed."
  - id: ERR_VEHICLE_TRANSFER_OVERLAP
    http: 409
    condition: "The proposed half-open window [planned_depart_at, planned_receive_at) intersects an existing non-terminal transfer window for the same vehicle. Exact adjacency does not conflict."
  - id: ERR_PREP_BAY_CONFLICT
    http: 409
    condition: "A PREPARATION task's closed window, expanded by 60 minutes on both ends, intersects another PREPARATION task on the same market and bay_code. Exact adjacency does conflict."

  # --- business: referential ---------------------------------------------
  - id: ERR_CHANNEL_NOT_ELIGIBLE
    http: 422
    condition: "The named channel is not in the vehicle's eligible-channel pool (e.g. PROGRAM_REPURCHASE on a RISK vehicle or past max_eligible_mileage_km)."
  - id: ERR_SUPERSEDE_TARGET_MISMATCH
    http: 422
    condition: "supersedes_policy_id names a policy with a different segment_id or a status other than ACTIVE."
  - id: ERR_MARKET_SUSPENDED
    http: 422
    condition: "A market that must be ACTIVE for the operation has status SUSPENDED."
  - id: ERR_SAME_MARKET_TRANSFER
    http: 422
    condition: "destination_market_id equals the vehicle's current_market_id."
  - id: ERR_NO_ACTIVE_DEPRECIATION_POLICY
    http: 422
    condition: "No DepreciationPolicy with status ACTIVE exists for the vehicle's segment when a valuation is required."
  - id: ERR_MILEAGE_BAND_EXCLUDES_CHANNEL
    http: 422
    condition: "A RETAIL_LOT consignment is attempted on a vehicle whose odometer_km exceeds the segment's mileage_band_hard_limit_km."

  # --- business: constraint / capacity ------------------------------------
  - id: ERR_ALLOCATION_UNIT_LIMIT_REACHED
    http: 422
    condition: "Minting one more vehicle would push the allocation's non-cancelled vehicle count past unit_count."
  - id: ERR_PREP_CAPACITY_EXCEEDED
    http: 422
    condition: "The market's prep_capacity_per_day would be exceeded for the UTC calendar date of window_start, even though each individual bay interval is free."
  - id: ERR_ODOMETER_REGRESSION
    http: 422
    condition: "The submitted cumulative odometer_km is lower than the vehicle's stored odometer_km."
  - id: ERR_RECONDITION_CAP_EXCEEDED
    http: 422
    condition: "recondition_authorized_cents exceeds the segment's recondition_cap_cents."
  - id: ERR_RECONDITION_OVERRUN
    http: 422
    condition: "recondition_actual_cents exceeds recondition_authorized_cents."
  - id: ERR_RECOVERY_EXCEEDS_CAP
    http: 422
    condition: "recovered_cents exceeds round_half_up(estimate_cents * 1.25)."
  - id: ERR_NO_ELIGIBLE_CHANNEL
    http: 422
    condition: "The eligible-channel pool for the vehicle is empty, so no recommendation can be ranked."

  # --- business: fiscal ---------------------------------------------------
  - id: ERR_PLAN_POSTURE_RESTRICTED
    http: 422
    condition: "The plan's posture is RESTRICTED and the requested unit_count would push allocated_unit_count above planned_unit_count."
  - id: ERR_PLAN_POSTURE_FROZEN
    http: 422
    condition: "The plan's posture is FROZEN (fill_ratio_bp >= 10000); no further allocation is accepted at any size."
  - id: ERR_TRANSPORT_COST_EXCEEDS_BENEFIT
    http: 422
    condition: "estimated_transport_cost_cents exceeds the segment's 45-day baseline revenue payback ceiling."
  - id: ERR_PROCEEDS_BELOW_FLOOR
    http: 422
    condition: "gross_proceeds_cents is below the consignment's frozen floor_price_cents."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:

  - name: PlatformAdmin
    description: "Owns the reference configuration of the fleet platform: markets, vehicle segments, manufacturer programs, remarketing channels and the logical clock. Touches no vehicle, plan or money."
    identity: "opaque"
    exclusive_operations:
      - "POST /fleet/markets"
      - "POST /fleet/markets/{market_id}/suspend"
      - "POST /fleet/vehicle-segments"
      - "POST /fleet/manufacturer-programs"
      - "POST /fleet/manufacturer-programs/{program_id}/close"
      - "POST /fleet/remarketing-channels"
      - "POST /fleet/remarketing-channels/{channel_id}/suspend"
      - "POST /fleet/_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint in §1.5"

  - name: FleetPlanner
    description: "Sizes the fleet: drafts plans, allocates purchases across program and risk vehicles, mints vehicles against allocations and proposes inter-city redistributions. Cannot lock its own plan or authorize its own transfer."
    identity: "opaque"
    exclusive_operations:
      - "POST /fleet/fleet-plans"
      - "POST /fleet/fleet-plans/{plan_id}/allocations"
      - "POST /fleet/purchase-allocations/{allocation_id}/cancel"
      - "POST /fleet/purchase-allocations/{allocation_id}/vehicles"
      - "POST /fleet/redistribution-orders"
      - "POST /fleet/redistribution-orders/{order_id}/propose"
    shared_operations:
      - "every GET endpoint in §1.5"

  - name: FleetController
    description: "The control function. Locks plans, owns depreciation policy, authorizes and rejects redistributions, waives in-fleeting tasks and adjudicates damage write-offs and total losses. Segregation of duties binds it against itself on policy activation and transfer authorization."
    identity: "opaque"
    exclusive_operations:
      - "POST /fleet/fleet-plans/{plan_id}/lock"
      - "POST /fleet/depreciation-policies"
      - "POST /fleet/depreciation-policies/{policy_id}/activate"
      - "POST /fleet/in-fleeting-tasks/{task_id}/waive"
      - "POST /fleet/redistribution-orders/{order_id}/reject"
      - "POST /fleet/redistribution-orders/{order_id}/authorize"
      - "POST /fleet/redistribution-orders/{order_id}/cancel"
      - "POST /fleet/damage-events/{damage_event_id}/write-off"
      - "POST /fleet/damage-events/{damage_event_id}/declare-total-loss"
    shared_operations:
      - "every GET endpoint in §1.5"

  - name: RemarketingManager
    description: "Runs disposal: consigns vehicles to channels, authorizes and books reconditioning, lists, records sales, settles and withdraws, and works damage-recovery claims. Segregation of duties binds it against itself on settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /fleet/consignments"
      - "POST /fleet/consignments/{consignment_id}/authorize-recondition"
      - "POST /fleet/consignments/{consignment_id}/complete-recondition"
      - "POST /fleet/consignments/{consignment_id}/list"
      - "POST /fleet/consignments/{consignment_id}/record-sale"
      - "POST /fleet/consignments/{consignment_id}/settle"
      - "POST /fleet/consignments/{consignment_id}/withdraw"
      - "POST /fleet/damage-events/{damage_event_id}/open-recovery"
      - "POST /fleet/damage-events/{damage_event_id}/settle-recovery"
    shared_operations:
      - "every GET endpoint in §1.5"

  - name: MarketOperator
    description: "The branch on the ground. In-fleets vehicles, schedules and completes registration, licensing and preparation, posts rental usage, reports and revises damage, and dispatches and receives transfers. Scoped to a single market: X-User-ID is that Market's id, so an operator cannot touch another market's vehicles."
    identity: "entity_backed:Market"
    exclusive_operations:
      - "POST /fleet/vehicles/{vehicle_id}/in-fleet"
      - "POST /fleet/vehicles/{vehicle_id}/usage"
      - "POST /fleet/vehicles/{vehicle_id}/in-fleeting-tasks"
      - "POST /fleet/in-fleeting-tasks/{task_id}/complete"
      - "POST /fleet/vehicles/{vehicle_id}/damage-events"
      - "POST /fleet/damage-events/{damage_event_id}/revise-estimate"
      - "POST /fleet/redistribution-orders/{order_id}/depart"
      - "POST /fleet/redistribution-orders/{order_id}/receive"
    shared_operations:
      - "every GET endpoint in §1.5 except GET /fleet/fleet-plans/{plan_id}/performance and GET /fleet/vehicles/{vehicle_id}/channel-recommendation"
