scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: settlement_pay_provisional_estimate_diverges_from_final
    grounds:
    - calculations.provisional_assignment_pay
    - calculations.final_settlement_pay
    - entities.BlockAssignment.fields.provisional_pay_cents
    - entities.PayStatement.fields.final_pay_cents
    distinguishing_aspect: 'Entity domain = block pay (money). Identical block data produces two different pay numbers: provisional_pay_cents
      == 7500 at acceptance (gross at surge snapshot 12500 bp only) vs final_pay_cents == 8521 at completion (7500 + 750 + 621 - 350). The sibling
      instance covers the driver-reputation domain, so the two instances operate on different entity domains.'
    test_recipe:
      setup:
      - Clock starts at the default 2026-09-01T00:00:00Z.
      - Station A; driver Dana One onboarded; one warm-up clean completion makes the driver PREMIER (rating 500, reliability 10000).
      - Main block 10:00-13:00 base 6000 surged to 12500 bp at 08:30 (90 min to start); accepted 08:35; packages A (0.5kg, on time, compliant),
        B (1.5kg, LATE, compliant), C (2.0kg, on time, photo not gps-tagged).
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /stations
        payload:
          name: Station A
          zone_code: SEA1
        as: PlatformAdmin
        captures:
          st: $.data.id
          stv: $.data.version
      - call: POST /drivers/register
        payload:
          legal_name: Dana One
          email: dana.one@example.com
        as: Anonymous
        captures:
          d: $.data.id
      - call: GET /drivers/${d}/screenings
        as: PlatformAdmin
        captures:
          sc: $.data[0].id
      - call: POST /screenings/${sc}/begin-review
        as: PlatformAdmin
      - call: POST /screenings/${sc}/decide
        payload:
          decision: CLEARED
        as: PlatformAdmin
      - call: POST /drivers/${d}/vehicles
        payload:
          vin: VIN-D1-0001
          vehicle_class: SEDAN
        as: Driver
        as_user_id: ${d}
        captures:
          v: $.data.id
      - call: POST /vehicles/${v}/attest-insurance
        payload:
          insurance_expires_on: '2027-01-01'
        as: Driver
        as_user_id: ${d}
      - call: POST /drivers/${d}/activate
        as: PlatformAdmin
      - call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T02:00:00Z'
          ends_at: '2026-09-01T04:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 4000
        as: StationOps
        captures:
          bw: $.data.id
      - call: POST /blocks/${bw}/publish
        as: StationOps
      - call: POST /blocks/${bw}/accept
        payload:
          vehicle_id: ${v}
        as: Driver
        as_user_id: ${d}
        captures:
          aw: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T01:45:00Z'
        as: PlatformAdmin
      - call: POST /assignments/${aw}/check-in
        as: Driver
        as_user_id: ${d}
      - call: POST /assignments/${aw}/load-packages
        payload:
          packages:
          - tracking_code: PW-1
            billable_weight_kg: 1.0
            promised_by: '2026-09-01T03:00:00Z'
        as: StationOps
      - call: POST /assignments/${aw}/depart
        as: Driver
        as_user_id: ${d}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T02:30:00Z'
        as: PlatformAdmin
      - call: GET /assignments/${aw}/packages
        as: StationOps
        captures:
          pw1: $.data[0].id
      - call: POST /packages/${pw1}/deliver
        payload:
          photo_url: https://img.example/pw1.jpg
          photo_gps_tagged: true
        as: Driver
        as_user_id: ${d}
      - call: POST /assignments/${aw}/complete
        as: StationOps
      - call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T10:00:00Z'
          ends_at: '2026-09-01T13:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 6000
        as: StationOps
        captures:
          bm: $.data.id
      - call: POST /blocks/${bm}/publish
        as: StationOps
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:30:00Z'
        as: PlatformAdmin
      - call: POST /stations/${st}/run-surge-cycle
        payload:
          expected_station_version: ${stv}
        as: StationOps
      - call: POST /blocks/${bm}/accept
        payload:
          vehicle_id: ${v}
        as: Driver
        as_user_id: ${d}
        captures:
          am: $.data.id
          am_prov: $.data.provisional_pay_cents
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T09:45:00Z'
        as: PlatformAdmin
      - call: POST /assignments/${am}/check-in
        as: Driver
        as_user_id: ${d}
      - call: POST /assignments/${am}/load-packages
        payload:
          packages:
          - tracking_code: M-A
            billable_weight_kg: 0.5
            promised_by: '2026-09-01T11:00:00Z'
          - tracking_code: M-B
            billable_weight_kg: 1.5
            promised_by: '2026-09-01T11:00:00Z'
          - tracking_code: M-C
            billable_weight_kg: 2.0
            promised_by: '2026-09-01T12:00:00Z'
        as: StationOps
      - call: POST /assignments/${am}/depart
        as: Driver
        as_user_id: ${d}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T10:30:00Z'
        as: PlatformAdmin
      - call: GET /assignments/${am}/packages
        as: StationOps
        captures:
          pa: $.data[0].id
          pb: $.data[1].id
          pc: $.data[2].id
      - call: POST /packages/${pa}/deliver
        payload:
          photo_url: https://img.example/a.jpg
          photo_gps_tagged: true
        as: Driver
        as_user_id: ${d}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T11:05:00Z'
        as: PlatformAdmin
      - call: POST /packages/${pb}/deliver
        payload:
          photo_url: https://img.example/b.jpg
          photo_gps_tagged: true
        as: Driver
        as_user_id: ${d}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T11:30:00Z'
        as: PlatformAdmin
      - call: POST /packages/${pc}/deliver
        payload:
          photo_url: https://img.example/c.jpg
          photo_gps_tagged: false
        as: Driver
        as_user_id: ${d}
      trigger:
      - call: POST /assignments/${am}/complete
        as: StationOps
        captures: &id002
          ps_id: $.data.id
          ps_gross: $.data.gross_cents
          ps_bonus: $.data.tier_bonus_cents
          ps_sur: $.data.surcharges_cents
          ps_pen: $.data.penalties_cents
          ps_final: $.data.final_pay_cents
          ps_tier: $.data.tier_applied
      assert:
      - 'BlockAssignment.${am}.provisional_pay_cents == 7500 (provisional variant: round_half_up(6000 * 12500 / 10000))'
      - 'PayStatement.${ps_id}.final_pay_cents == 8521 (final variant: 7500 + 750 + 621 - 350)'
      - the two variants diverge by exactly 1021 cents for identical block data
      - captured ${am_prov} == 7500 and ${ps_final} == 8521
  - name: rating_rolling_window_diverges_from_lifetime_weighted
    grounds:
    - calculations.rolling_rating
    - calculations.lifetime_weighted_rating
    - entities.Driver.fields.rating_score_x100
    - entities.Driver.fields.lifetime_rating_x100
