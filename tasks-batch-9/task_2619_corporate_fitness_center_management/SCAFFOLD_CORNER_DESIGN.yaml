            - "REJECT without rejection_reason -> HTTP 422 AND data.error_id == \"ERR_REJECTION_REASON_REQUIRED\" AND status still \"PENDING_VERIFICATION\""
            - "REJECT with a reason -> HTTP 200 AND StaffCredential.${mgr_cred_id}.status == \"REJECTED\" AND StaffMember.${mgr_id}.duty_status == \"SUSPENDED_FROM_DUTY\""
            - "renew to 2026-07-01 -> HTTP 422 AND data.error_id == \"ERR_RENEWAL_DATE_INVALID\" AND status still \"REJECTED\" AND credential_number still \"AHA-770\""
