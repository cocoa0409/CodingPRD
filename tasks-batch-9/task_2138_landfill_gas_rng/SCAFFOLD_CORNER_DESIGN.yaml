              captures: { ctr_v_fresh: $.data.version }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-13T00:00:00Z", gas_day_end: "2026-08-14T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v_fresh}" }
              as: CommercialScheduler
              captures: { n3_id: $.data.id }
          assert:
            - "The first create returns HTTP 201 and PipelineNomination.${n1_id}.status == DRAFT"
            - "The second create returns HTTP 412 with data.error_id == 'ERR_STALE_CONTRACT_VERSION'"
            - "${ctr_v_fresh} == ${ctr_v_read} + 1"
            - "The retry returns HTTP 201 and PipelineNomination.${n3_id}.hourly_rate_dth == 100.0"
            - "GET /pipeline-nominations?contract_id=${contract_id}&limit=10&offset=0 returns total_count == 2"

