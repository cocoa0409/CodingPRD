      - name: vendorrep_distribute_direction_forbidden
        claim_type: role_denied
        grounds: ["endpoints[POST /talent/vendors/{id}/content-ledger-events]", "roles[VendorRepresentative]"]
        distinguishing_aspect: "Direction-split custody SoD: VendorRepresentative may record DESTROY for their own vendor but DISTRIBUTE is admin-only — rep DISTRIBUTE -> ERR_FORBIDDEN; admin DESTROY -> 201 (shared op positive control)."
        test_recipe:
          setup: ["vendor v ACTIVE with 3 copies outstanding (admin distributed 3)"]
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/vendors/${v}/content-ledger-events", payload: { direction: "DISTRIBUTE", copies: 3, note: "Initial workbook shipment out." }, as: TalentAssessmentAdmin }
          trigger:
            - { call: "POST /talent/vendors/${v}/content-ledger-events", payload: { direction: "DISTRIBUTE", copies: 1, note: "Rep tries to record distribution." }, as: VendorRepresentative, as_user_id: "${v}", captures: { err: $.data.error_id } }
            - { call: "POST /talent/vendors/${v}/content-ledger-events", payload: { direction: "DESTROY", copies: 1, note: "Admin records destruction instead." }, as: TalentAssessmentAdmin, captures: { ev: $.data.id } }
          assert:
            - "rep DISTRIBUTE: err == ERR_FORBIDDEN (403)"
            - "admin DESTROY: ${ev} created; vendor content_copies_outstanding == 2"

