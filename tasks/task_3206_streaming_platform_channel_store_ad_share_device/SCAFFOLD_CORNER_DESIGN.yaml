            - "PlacementBooking.${b}.status == RELEASED (NOT re-confirmed)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_mutation_visible_in_same_response
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/channels/{id}/publish
        distinguishing_aspect: "Immediate consistency: the publish response itself shows status PUBLISHED, and a GET issued right after shows identical state with the bumped version — no reconciliation lag anywhere."
        test_recipe:
          setup:
            - "Publisher P with channel C CERTIFIED (version passed, not yet published)."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Imm Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
