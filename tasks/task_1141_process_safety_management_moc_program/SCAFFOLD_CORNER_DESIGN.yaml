# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task 1141
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 per references/claim-extraction-guide.md.
# Sections/claim_types follow the guide. Names are unique across §1.8 and §1.9.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: unit_creation_applies_config_defaults
        claim_type: defaults
        grounds: [entities.PlantUnit.fields.temp_moc_max_days, entities.PlantUnit.fields.max_extensions, entities.PlantUnit.fields.training_coverage_threshold_pct]
        distinguishing_aspect: "Omitting optional config applies the pinned defaults; computed posture fields initialize."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 36 }, as: PsmAdmin, captures: { u_id: $.data.id } }
          trigger:
            - { call: "GET /psm/units/${u_id}", as: PsmManager }
          assert:
            - "temp_moc_max_days == 180, max_extensions == 2, extension_max_days == 90, total_temp_cap_days == 360, training_coverage_threshold_pct == 100.00"
            - "psm_posture == NORMAL, open_action_count == 0, overdue_action_count == 0, process_safety_index == 0, version == 1"

      - name: moc_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ['errors[ERR_INVALID_REQUEST]', 'endpoints[POST /psm/units/{unitId}/moc-requests]']
        distinguishing_aspect: "discipline is required input; omitting it fails before any state work."
        test_recipe:
          setup: ["Unit U and REQ exist"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
          trigger:
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d" }, as: Requester, as_user_id: "${req_id}", captures: { err: $.data.error_id } }
          assert: ["rejected: error_id == ERR_INVALID_REQUEST; no MocRequest row created"]

      - name: personnel_invalid_qualification_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Personnel.fields.qualifications, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "qualifications is a closed enum array; WIZARD is not a member."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /psm/personnel", payload: { full_name: "X", employee_ref: "E-X", qualifications: ["WIZARD"] }, as: PsmAdmin, captures: { err: $.data.error_id } }
          assert: ["rejected: error_id == ERR_INVALID_REQUEST"]

      - name: moc_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ['errors[ERR_MOC_NOT_FOUND]']
        distinguishing_aspect: "GET with a well-formed but absent UUID yields the resource-specific 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /psm/moc-requests/00000000-0000-4000-8000-000000000000", as: PsmManager, captures: { err: $.data.error_id } }
          assert: ["rejected: error_id == ERR_MOC_NOT_FOUND, http 404"]

      - name: moc_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.MocRequest.fields.screening_risk_score, entities.MocRequest.fields.status]
        distinguishing_aspect: "Client-supplied computed fields (screening_risk_score, status) are ignored, not persisted."
        test_recipe:
          setup: ["Unit U and REQ exist"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
          trigger:
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL", screening_risk_score: 99.99, status: "CLOSED" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
          assert:
            - "MocRequest.${m_id}.screening_risk_score == null and status == DRAFT (client values ignored)"

      - name: evidence_item_is_append_only
        claim_type: immutability
        grounds: [entities.EvidenceItem]
        distinguishing_aspect: "EvidenceItem has common_fields false: response exposes id and created_at only — no version/updated_at, and no update/delete endpoint exists."
        test_recipe:
          setup: ["Unit U, REQ, and an OPEN manual P1 item assigned to REQ"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a", priority: "P1", assignee_id: "${req_id}" }, as: PsmManager, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /psm/action-items/${a_id}/evidence-items", payload: { file_ref: "s3://ev/e1.pdf", description: "photo" }, as: Requester, as_user_id: "${req_id}", captures: { ev_id: $.data.id } }
          assert:
            - "create response for ${ev_id} contains id and created_at but no version field"
            - "GET /psm/action-items/${a_id}/evidence-items lists exactly 1 row; ActionItem.${a_id}.evidence_count == 1"

      - name: unit_listing_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, 'endpoints[GET /psm/units]']
        distinguishing_aspect: "limit/offset/total_count/has_more per §1.0 defaults: page 1 of 3 rows with limit 2 has has_more true; offset 2 yields 1 row with has_more false."
        test_recipe:
          setup: ["Three units exist"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U1", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin }
            - { call: "POST /psm/units", payload: { name: "U2", unit_code: "U2", pha_cycle_months: 24 }, as: PsmAdmin }
            - { call: "POST /psm/units", payload: { name: "U3", unit_code: "U3", pha_cycle_months: 36 }, as: PsmAdmin }
          trigger:
            - { call: "GET /psm/units", payload: { limit: 2, offset: 0 }, as: PsmManager }
            - { call: "GET /psm/units", payload: { limit: 2, offset: 2 }, as: PsmManager }
          assert:
            - "page 1: response_type array, total_count == 3, has_more == true, 2 rows"
            - "page 2 (offset 2): 1 row, has_more == false"

      - name: nested_child_create_requires_existing_parent
        claim_type: parent_relationships
        grounds: [entities.MocRequest.fields.unit_id, 'errors[ERR_UNIT_NOT_FOUND]']
        distinguishing_aspect: "Creating a MOC under a non-existent unit id fails existence (404) before any business rule."
        test_recipe:
          setup: ["REQ exists"]
          setup_api_calls:
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
          trigger:
            - { call: "POST /psm/units/00000000-0000-4000-8000-000000000000/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { err: $.data.error_id } }
          assert: ["rejected: error_id == ERR_UNIT_NOT_FOUND, http 404"]

  - section: state_machines
    instances:
      - name: moc_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.MocRequest]
        distinguishing_aspect: "New MOC starts DRAFT with review_round 0, version 1, null scores."
        test_recipe:
          setup: ["Unit U, REQ exist"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
          trigger:
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "PROCESS" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
          assert:
            - "MocRequest.${m_id}.status == DRAFT, review_round == 0, version == 1, requester_id == ${req_id}"
            - "change_class == null, screening_risk_score == null, requires_pssr == null"

      - name: moc_terminal_lockdown_authorize_after_close_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.MocRequest.IN_SERVICE_to_CLOSED, 'errors[ERR_MOC_INVALID_STATE]']
        distinguishing_aspect: "CLOSED is terminal: every further action endpoint on the MOC returns ERR_MOC_INVALID_STATE."
        test_recipe:
          setup:
            - "Unit U (NORMAL), study CURRENT; REQ/REV(CHEMICAL)/APP/LEAD(PSSR_CERTIFIED) exist"
            - "PERMANENT MOC M driven to CLOSED via the full gate chain (coverage 100, PSSR approved, activate, close)"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-04-01" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Rev", employee_ref: "E-REV", qualifications: ["CHEMICAL"] }, as: PsmAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "App", employee_ref: "E-APP" }, as: PsmAdmin, captures: { app_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Lead", employee_ref: "E-LEAD", qualifications: ["PSSR_CERTIFIED"] }, as: PsmAdmin, captures: { lead_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 2, screening_likelihood: 2 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r_id: "$.data[0].id" } }
            - { call: "POST /psm/technical-reviews/${r_id}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 2, likelihood_score: 2, detection_score: 1, verdict: "ACCEPT" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/approve", payload: {}, as: OpsApprover, as_user_id: "${app_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/procedure-updates", payload: { document_ref: "SOP-1" }, as: TrainingCoordinator, captures: { pu: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu}/training-assignments", payload: { personnel_id: "${req_id}" }, as: TrainingCoordinator, captures: { ta: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu}/publish", payload: {}, as: TrainingCoordinator }
            - { call: "POST /psm/training-assignments/${ta}/complete", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/mark-implemented", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}", as: PsmManager, captures: { v1: $.data.version } }
            - { call: "POST /psm/moc-requests/${m_id}/pssrs", payload: { field_window_start: "2026-05-01", field_window_end: "2026-05-05", expected_moc_version: "${v1}" }, as: PssrLead, as_user_id: "${lead_id}", captures: { p_id: $.data.id } }
            - { call: "POST /psm/pssrs/${p_id}/begin-fieldwork", payload: {}, as: PssrLead, as_user_id: "${lead_id}" }
            - { call: "POST /psm/pssrs/${p_id}/approve", payload: {}, as: PssrLead, as_user_id: "${lead_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/authorize-startup", payload: {}, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/activate", payload: {}, as: OpsApprover, as_user_id: "${app_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/close", payload: {}, as: PsmManager }
          trigger:
            - { call: "POST /psm/moc-requests/${m_id}/authorize-startup", payload: {}, as: PsmManager, captures: { err: $.data.error_id } }
          assert:
            - "MocRequest.${m_id}.status == CLOSED, closed_at == 2026-05-01T00:00:00Z"
            - "authorize on CLOSED rejected: error_id == ERR_MOC_INVALID_STATE (terminal lockdown)"

      - name: classify_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.MocRequest.DRAFT_to_CLASSIFIED, 'errors[ERR_MOC_INVALID_STATE]']
        distinguishing_aspect: "classify is only valid from DRAFT; a second classify from CLASSIFIED is rejected."
        test_recipe:
          setup: ["Unit U, REQ, MOC M classified"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 1, screening_likelihood: 1 }, as: PsmManager }
          trigger:
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 1, screening_likelihood: 1 }, as: PsmManager, captures: { err: $.data.error_id } }
          assert: ["rejected: error_id == ERR_MOC_INVALID_STATE; status remains CLASSIFIED"]

      - name: rik_bypass_branch_skips_technical_review
        claim_type: valid_transition
        grounds: [state_machines.MocRequest.CLASSIFIED_to_APPROVAL_PENDING, entities.MocRequest.fields.requires_pssr]
        distinguishing_aspect: "REPLACEMENT_IN_KIND forks at submit directly to APPROVAL_PENDING with no review round minted and requires_pssr == false."
        test_recipe:
          setup: ["Unit U, study CURRENT, REQ; MOC M classified REPLACEMENT_IN_KIND"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "CHECKLIST", initial_validated_at: "2026-04-01" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "MECHANICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "REPLACEMENT_IN_KIND", screening_severity: 2, screening_likelihood: 2 }, as: PsmManager }
          trigger:
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager }
          assert:
            - "MocRequest.${m_id}.status == APPROVAL_PENDING (bypass branch)"
            - "review_round == 0 and technical-reviews list is empty"
            - "requires_pssr == false; screening_risk_score == 2.00 (2*2*0.5)"

      - name: verdict_twice_on_same_review_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.TechnicalReview.OPEN_to_SUBMITTED, 'errors[ERR_REVIEW_INVALID_STATE]']
        distinguishing_aspect: "A SUBMITTED review is terminal: a second verdict on the same review id fails."
        test_recipe:
          setup: ["Unit U, study CURRENT, REQ, REV(CHEMICAL); MOC M in TECHNICAL_REVIEW with review R submitted ACCEPT"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-04-01" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Rev", employee_ref: "E-REV", qualifications: ["CHEMICAL"] }, as: PsmAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 2, screening_likelihood: 2 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r_id: "$.data[0].id" } }
            - { call: "POST /psm/technical-reviews/${r_id}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 2, likelihood_score: 2, detection_score: 1, verdict: "ACCEPT" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
          trigger:
            - { call: "POST /psm/technical-reviews/${r_id}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 2, likelihood_score: 2, detection_score: 1, verdict: "ACCEPT" }, as: TechnicalReviewer, as_user_id: "${rev_id}", captures: { err: $.data.error_id } }
          assert: ["rejected: error_id == ERR_REVIEW_INVALID_STATE (SUBMITTED is terminal)"]

      - name: incident_submit_findings_before_rca_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.IncidentInvestigation, 'errors[ERR_INCIDENT_INVALID_STATE]']
        distinguishing_aspect: "submit-findings requires ROOT_CAUSE_ANALYSIS; from OPEN it is rejected."
        test_recipe:
          setup: ["Unit U, INV; investigation OPEN"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Inv", employee_ref: "E-INV" }, as: PsmAdmin, captures: { inv_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/incident-investigations", payload: { title: "i", severity_class: "MINOR", occurred_at: "2026-04-20", investigator_id: "${inv_id}" }, as: PsmManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /psm/incident-investigations/${i_id}/submit-findings", payload: { findings: [{ title: "f", priority: "P3", assignee_id: "${req_id}" }] }, as: Investigator, as_user_id: "${inv_id}", captures: { err: $.data.error_id } }
          assert: ["rejected: error_id == ERR_INCIDENT_INVALID_STATE; no ActionItem spawned"]

      - name: pssr_approve_with_open_punch_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.Pssr.IN_FIELD_to_APPROVED, 'errors[ERR_PSSR_OPEN_PUNCH_ITEMS]']
        distinguishing_aspect: "approve requires punch_open_count == 0; with one OPEN punch item it fails."
        test_recipe:
          setup: ["Unit U, study CURRENT, REQ/REV/APP/LEAD; PERMANENT MOC at IMPLEMENTED_PSSR_PENDING; PSSR P IN_FIELD with one punch item raised"]
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-04-01" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Rev", employee_ref: "E-REV", qualifications: ["CHEMICAL"] }, as: PsmAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "App", employee_ref: "E-APP" }, as: PsmAdmin, captures: { app_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Lead", employee_ref: "E-LEAD", qualifications: ["PSSR_CERTIFIED"] }, as: PsmAdmin, captures: { lead_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 2, screening_likelihood: 2 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r_id: "$.data[0].id" } }
            - { call: "POST /psm/technical-reviews/${r_id}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 2, likelihood_score: 2, detection_score: 1, verdict: "ACCEPT" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/approve", payload: {}, as: OpsApprover, as_user_id: "${app_id}" }
