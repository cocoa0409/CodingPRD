  - section: errors
    instances:
      - name: every_not_found_error_is_reachable
        claim_type: triggerability
        grounds:
          - validations[priority=30]
          - errors[ERR_STORE_NOT_FOUND]
          - errors[ERR_CASHIER_NOT_FOUND]
          - errors[ERR_SAFE_NOT_FOUND]
          - errors[ERR_SALES_JOURNAL_NOT_FOUND]
