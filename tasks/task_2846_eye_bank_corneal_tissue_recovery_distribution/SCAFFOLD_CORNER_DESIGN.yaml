              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-S04", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
