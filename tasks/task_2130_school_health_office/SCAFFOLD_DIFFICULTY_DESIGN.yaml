              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Omar Silva", grade_level: 5, date_of_birth: "2015-04-04T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "NONCOMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "ILLNESS", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id, triage: $.data.triage_score }
            - call: "POST /health-office/health-visits/${visit_id}/assess"
              payload: { assessment_note: "Low-grade fever resolved, afebrile now" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
          trigger:
            - call: "POST /health-office/health-visits/${visit_id}/dispose"
              payload: { disposition: "RETURN_TO_CLASS" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { err: $.data.error_id }
            - call: "PATCH /health-office/students/${stu_id}"
              payload: { immunization_status: "COMPLIANT" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { imm_after: $.data.immunization_status, intake_after: $.data.intake_risk_score }
            - call: "POST /health-office/health-visits/${visit_id}/dispose"
              payload: { disposition: "RETURN_TO_CLASS" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { disp_after: $.data.disposition }
          assert:
            - "Before the PATCH: Student.${stu_id}.intake_risk_score == 20"
            - "Before the PATCH: IMMUNIZATION_HOLD is a member of Student.${stu_id}.alert_flags"
            - "First dispose: HTTP status == 409 and data.error_id == ERR_IMMUNIZATION_HOLD"
            - "First dispose: HealthVisit.${visit_id}.status == IN_ASSESSMENT and HealthVisit.${visit_id}.disposition == null"
            - "First dispose: School.${sch_id}.occupied_cot_count == 1"
            - "After the PATCH: Student.${stu_id}.immunization_status == COMPLIANT"
            - "After the PATCH: Student.${stu_id}.intake_risk_score == 0"
            - "After the PATCH: IMMUNIZATION_HOLD is NOT a member of Student.${stu_id}.alert_flags"
            - "Second dispose: HTTP status == 200 and HealthVisit.${visit_id}.disposition == RETURN_TO_CLASS"
            - "Second dispose: HealthVisit.${visit_id}.status == DISPOSITIONED and HealthVisit.${visit_id}.guardian_notified == false"
            - "Second dispose: School.${sch_id}.occupied_cot_count == 0"

  - rule_id: resource_temporal_overlap
    instances:

      - name: nurse_block_half_open_touch_ok_but_cross_school_needs_20_minute_buffer
        grounds:
          - validations[priority=33]
          - errors[ERR_COVERAGE_OVERLAP]
          - entities.CoverageAssignment.fields.start_minute
          - entities.CoverageAssignment.fields.end_minute
          - entities.CoverageAssignment.fields.weekday
        distinguishing_aspect: |
          Interval semantics = PAIRWISE HALF-OPEN [start_minute, end_minute) on the
          resource entity NURSE, with a TRAVEL_BUFFER_MINUTES = 20 separation that
          applies only between different schools: touching exactly at 720 at the
          same school is accepted, a different-school block starting at 900 with a
          zero-minute gap is refused, and the same block moved to 920 (exactly 20
          minutes of clear time) is accepted.
        test_recipe:
          setup:
            - "Two Schools, LOW13 and MON14, and one RN with weekly_contracted_minutes 2400 so the fiscal row at priority 47 never fires."
