# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Blow Molding & Bottle Plant. 9 rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: freight_warehouse_vs_blow_on_site_divergence
        grounds:
          - calculations.logistics_mode_comparison
          - calculations.freight_of_air_charge
        distinguishing_aspect: |
          Dual-variant freight logic on the Shipment/BottleSpec domain: identical
          quantity (3000) and identical spec produce warehouse_total_cents ==
          197880 (bottle cube dominates, freight-of-air) vs blow_on_site_total_cents
          == 131880 (dense preform cube + per-bottle on-site fee); the companion
          instance resin_provisional_vs_actual_variance sits on the MaterialLot/
          ProductionRun domain, so the two dual-variant calcs operate on different
          entity domains as §0.5 Rule 1 requires.
        test_recipe:
          setup:
            - "Customer ACME exists; ACTIVE rate card MAIN with tiers 0->120c/kg, 500->90c/kg, 2000->60c/kg"
            - "BottleSpec S1 (cube 4000 cm3, preform cube 150 cm3, target weight 22 g, preform weight 22 g) exists and is QUALIFIED"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/freight-rate-cards", payload: { lane_code: "MAIN", tiers: [ { min_kg: 0, rate_cents_per_kg: 120 }, { min_kg: 500, rate_cents_per_kg: 90 }, { min_kg: 2000, rate_cents_per_kg: 60 } ] }, as: PlantAdmin }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "PRESSURE_SENSITIVE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
          trigger:
            - { call: "GET /plant/bottle-specs/${spec_id}/logistics-comparison", payload: { quantity: 3000 }, as: LogisticsCoordinator, captures: { wh: "$.data.warehouse_total_cents", bos: "$.data.blow_on_site_total_cents", rec: "$.data.recommended_mode" } }
          assert:
            - "warehouse_total_cents == 197880  (dim 2048.0 kg chargeable; 500*120 + 1500*90 + 48*60)"
            - "blow_on_site_total_cents == 131880  (preform chargeable 99.0 kg * 120 = 11880 + 3000*40 = 120000)"
            - "recommended_mode == BLOW_ON_SITE"
            - "warehouse_total_cents != blow_on_site_total_cents (same inputs, two variants diverge)"

      - name: resin_provisional_vs_actual_variance
        grounds:
          - calculations.resin_consumption_reconciliation
          - state_machines.ProductionRun.OPEN_to_CLOSED
        distinguishing_aspect: |
          Dual-variant consumption accounting on the MaterialLot/ProductionRun
          domain (machine-counter theoretical vs measured silo drawdown): the same
          close yields provisional_consumption_kg == 352.0 and actual_drawdown_kg
          == 360.0, variance 2.27 pct (no alert since <= 3.0). Distinct entity
          domain from freight_warehouse_vs_blow_on_site_divergence.
        test_recipe:
          setup:
            - "Qualified spec S1; order O1 qty 3000 planned weight 22 g SCHEDULED then RELEASED on line L1 with mold M8 (8 cavities) installed"
            - "Material lot R-100: 500 kg PET RELEASED; logical clock inside the slot window"
            - "Run R1 started (order RUNNING, slot IN_PROGRESS, line RUNNING)"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/molds", payload: { mold_code: "M8", base_cavities: 8, compatible_resins: ["PET"], reference_weight_g: 20 }, as: PlantAdmin, captures: { mold_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "PRESSURE_SENSITIVE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
            - { call: "POST /plant/production-orders", payload: { bottle_spec_id: "${spec_id}", quantity_ordered: 3000, planned_weight_g: 22, logistics_mode: "WAREHOUSE" }, as: ProductionScheduler, captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /plant/production-orders/${ord_id}/schedule", payload: { machine_line_id: "${line_id}", planned_start: "2026-08-02T10:00:00Z", planned_end: "2026-08-02T14:00:00Z", expected_production_order_version: "${ord_v}" }, as: ProductionScheduler }
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-100", received_kg: 500 }, as: PlantAdmin, captures: { mlot_id: "$.data.id" } }
            - { call: "POST /plant/material-lots/${mlot_id}/release", as: QualityTechnician }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer }
            - { call: "POST /plant/production-orders/${ord_id}/release", as: ProductionScheduler }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/production-runs", payload: { production_order_id: "${ord_id}", machine_line_id: "${line_id}", mold_id: "${mold_id}", material_lot_id: "${mlot_id}" }, as: ProcessEngineer, captures: { run_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/production-runs/${run_id}/close", payload: { cycles_completed: 2000, good_count: 11880, scrap_count: 120, actual_drawdown_kg: 360.0 }, as: ProcessEngineer, captures: { prov: "$.data.provisional_consumption_kg", varpct: "$.data.consumption_variance_pct", alert: "$.data.variance_alert" } }
          assert:
            - "ProductionRun.provisional_consumption_kg == 352.0  (2000 * 8 * 22 / 1000, theoretical variant)"
            - "ProductionRun.actual_drawdown_kg == 360.0  (measured variant; the two variants differ)"
            - "ProductionRun.consumption_variance_pct == 2.27  (round_half_up(8/352*100, 2))"
            - "ProductionRun.variance_alert == false  (2.27 <= VARIANCE_TOLERANCE_PCT 3.0)"
            - "MaterialLot.${mlot_id}: consumed_kg == 360.0, available_kg == 140.0, purge_wasted_kg == 0.0, status == IN_USE"

  - rule_id: combinatorial_formula
    instances:
      - name: cycle_throughput_labeler_cap_blockout_tradeoff
        grounds:
          - calculations.cycle_throughput
          - calculations.effective_cavitation
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — bottle weight
          drives cycle time (10 + 0.08*max(0, 22-20) = 10.16 s), the inline-labeler
          branch caps cycles/hour at 240 (raw 354.33 is cut), and two OPEN
          blockouts cut effective cavitation 8 -> 6; hourly_output ==
          floor(240 * 6 * 0.97) == 1396, whereas the uncapped value would be 2062.
          The companion instance uses rounding-order mode (b), a different mode.
        test_recipe:
          setup:
            - "Qualified spec S1 (requires inline labeler; planned/reference weights 22/20 g)"
            - "Mold M8 installed on line L1 (which has an inline labeler); two OPEN blockouts on cavities 1 and 2"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/molds", payload: { mold_code: "M8", base_cavities: 8, compatible_resins: ["PET"], reference_weight_g: 20 }, as: PlantAdmin, captures: { mold_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "PRESSURE_SENSITIVE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer, captures: { mold_v: "$.data.version" } }
            - { call: "POST /plant/molds/${mold_id}/cavity-blockouts", payload: { cavity_index: 1, reason: "DAMAGE", expected_mold_version: "${mold_v}" }, as: ProcessEngineer }
            - { call: "GET /plant/molds/${mold_id}", as: ProcessEngineer, captures: { mold_v2: "$.data.version" } }
            - { call: "POST /plant/molds/${mold_id}/cavity-blockouts", payload: { cavity_index: 2, reason: "PREVENTIVE", expected_mold_version: "${mold_v2}" }, as: ProcessEngineer }
          trigger:
            - { call: "GET /plant/machine-lines/${line_id}/throughput-preview", payload: { mold_id: "${mold_id}", bottle_spec_id: "${spec_id}", planned_weight_g: 22 }, as: ProcessEngineer, captures: { cav: "$.data.effective_cavities", cyc: "$.data.cycle_time_s", cph: "$.data.cycles_per_hour", out: "$.data.hourly_output" } }
          assert:
            - "effective_cavities == 6  (8 base - 2 OPEN blockouts)"
            - "cycle_time_s == 10.16  (10.0 + 0.08 * max(0, 22 - 20))"
            - "cycles_per_hour == 240  (raw 3600/10.16 = 354.33 capped by LABELER_CAP_CPH because spec requires inline label and line has a labeler)"
            - "hourly_output == 1396  (floor(240 * 6 * 0.97)); uncapped would be floor(354.33*6*0.97) = 2062"

      - name: freight_per_pallet_rounding_order
        grounds:
          - calculations.freight_of_air_charge
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — dim weight is rounded
          half-up to 0.1 kg PER PALLET then summed (855.25 -> 855.3 per pallet,
          total 2565.9 kg), whereas the forbidden aggregate-then-round order gives
          2565.75 -> 2565.8 kg; the pinned order yields chargeable 2565.9 kg and
          freight 228954 cents. Different mode from the companion instance (a).
        test_recipe:
          setup:
            - "Customer ACME; ACTIVE rate card MAIN (0->120, 500->90, 2000->60 cents/kg marginal)"
            - "BottleSpec S2 with bottle_cube_cm3 3325, target weight 22 g (DRAFT status is enough for a quote)"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/freight-rate-cards", payload: { lane_code: "MAIN", tiers: [ { min_kg: 0, rate_cents_per_kg: 120 }, { min_kg: 500, rate_cents_per_kg: 90 }, { min_kg: 2000, rate_cents_per_kg: 60 } ] }, as: PlantAdmin }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B330", resin_type: "PET", color_contrast_class: "LIGHT", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 200, diameter_mm: 66, bottle_cube_cm3: 3325, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 7, label_type: "NONE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec2_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/freight-quotes", payload: { bottle_spec_id: "${spec2_id}", quantity: 4500, shipment_mode: "FINISHED_BOTTLES" }, as: LogisticsCoordinator, captures: { dimw: "$.data.dim_weight_kg", charg: "$.data.chargeable_weight_kg", cost: "$.data.freight_cost_cents", pal: "$.data.pallets", trk: "$.data.trucks" } }
          assert:
            - "pallets == 3  (ceil(4500/1500))"
            - "dim_weight_kg == 2565.9  (per-pallet 855.25 -> 855.3 half-up at 0.1 kg, x3; aggregate-then-round would give 2565.8)"
            - "actual_weight_kg == 159.0  (4500*22/1000 + 3*20)"
            - "chargeable_weight_kg == 2565.9"
            - "freight_cost_cents == 228954  (500*120 + 1500*90 + 565.9*60, per-tier half-up cents then summed)"
            - "trucks == 1  (pallets_per_truck = min(floor(96000000/5131500)=18, floor(24000/53)=452) = 18)"

  - rule_id: non_linear_state_machine
    instances:
      - name: spec_revision_loop_requalification
        grounds:
          - state_machines.BottleSpec.IN_QUALIFICATION_to_REVISION_REQUESTED
          - state_machines.BottleSpec.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.BottleSpec.PRODUCTION_ACTIVE_to_REVISION_REQUESTED
          - validations[priority=8]
        distinguishing_aspect: |
          BottleSpec has a true cycle: IN_QUALIFICATION -> REVISION_REQUESTED ->
          SUBMITTED -> IN_QUALIFICATION -> QUALIFIED, and re-submission is gated
          on content_revision advancing past rejected_revision. The companion
          instance (quality lot) is a different entity with a different non-linear
          shape (auto-fork plus rework loop).
        test_recipe:
          setup:
            - "Spec S1 qualified at content_revision 1, then REJECTED in a second qualification round after a PATCH to target_weight_g 23 raised content_revision to 2"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "PRESSURE_SENSITIVE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "REJECT", review_note: "weight too high" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer, captures: { rej_err: "$.data.error_id" } }
            - { call: "PATCH /plant/bottle-specs/${spec_id}", payload: { target_weight_g: 23 }, as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v2: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v2}" }, as: ProcessEngineer, captures: { qrun2_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun2_id}/execute", payload: { measured_mean_weight_g: 23.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun2_id}/submit-review", as: QualityTechnician }
          trigger:
            - { call: "POST /plant/qualification-runs/${qrun2_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
            - { call: "GET /plant/bottle-specs/${spec_id}", as: ProcessEngineer, captures: { st: "$.data.status", qrev: "$.data.qualified_revision", crev: "$.data.content_revision", rounds: "$.data.qualification_round" } }
          assert:
            - "the premature resubmit (before any PATCH) was rejected with rej_err == ERR_SPEC_UNCHANGED_SINCE_REJECTION"
            - "BottleSpec.status == QUALIFIED after the second loop (cycle REVISION_REQUESTED -> SUBMITTED -> IN_QUALIFICATION -> QUALIFIED traversed)"
            - "BottleSpec.content_revision == 2 and qualified_revision == 2"
            - "BottleSpec.qualification_round == 2 and QualificationRun.${qrun2_id}.spec_revision_pinned == 2"

      - name: quality_lot_reject_rework_retest_cycle
        grounds:
          - state_machines.QualityTestLot.SAMPLED_to_ACCEPTED
          - state_machines.QualityTestLot.SAMPLED_to_REJECTED
          - state_machines.QualityTestLot.REJECTED_to_PENDING
        distinguishing_aspect: |
          QualityTestLot record-results is a branching auto-fork (SAMPLED ->
          {ACCEPTED, REJECTED} by AQL numbers with divergent side effects) and
          REJECTED -> PENDING forms a rework loop with retest_count incrementing;
          a different entity and a different non-linear shape than the spec loop.
        test_recipe:
          setup:
            - "Order O1 RUNNING with run R1 closed (good 11880 -> lot band4 n=200, c_leak=5, c_drop=6); lot L sampled"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/molds", payload: { mold_code: "M8", base_cavities: 8, compatible_resins: ["PET"], reference_weight_g: 20 }, as: PlantAdmin, captures: { mold_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "PRESSURE_SENSITIVE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
            - { call: "POST /plant/production-orders", payload: { bottle_spec_id: "${spec_id}", quantity_ordered: 3000, planned_weight_g: 22, logistics_mode: "WAREHOUSE" }, as: ProductionScheduler, captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /plant/production-orders/${ord_id}/schedule", payload: { machine_line_id: "${line_id}", planned_start: "2026-08-02T10:00:00Z", planned_end: "2026-08-02T14:00:00Z", expected_production_order_version: "${ord_v}" }, as: ProductionScheduler }
