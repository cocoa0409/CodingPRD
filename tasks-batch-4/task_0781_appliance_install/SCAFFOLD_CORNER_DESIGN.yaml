          rationale: "ERR_ZONE_CAPACITY_EXCEEDED is the asserted outcome of that §1.8 instance."
      - name: error_pro_schedule_conflict_on_accept
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRO_SCHEDULE_CONFLICT]"]
        excluded_because:
