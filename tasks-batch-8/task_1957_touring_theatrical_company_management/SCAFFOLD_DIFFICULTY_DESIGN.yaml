              as: Producer
              captures: { s_id: "$.data[0].id" }
            - call: "PUT /settlements/${s_id}"
              payload: { audited_gross_cents: 6000000, taxes_cents: 300000, levies_cents: 200000 }
              as: Treasurer
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
            - call: "PUT /settlements/${s_id}"
              payload: { status: DISPUTED, dispute_reason: "levies misclassified" }
              as: Producer
              as_user_id: prod-1
          trigger:
            - call: "PUT /settlements/${s_id}"
              payload: { status: APPROVED }
              as: Treasurer
              as_user_id: trs-1
              captures: { err_a: "$.data.error_id "}
            - call: "PUT /settlements/${s_id}"
              payload: { status: APPROVED }
              as: Treasurer
              as_user_id: trs-2
              captures: { err_b: "$.data.error_id "}
          assert:
            - "Approve by submitter trs-1 on DISPUTED settlement -> ERR_SOD_SUBMIT_APPROVE (auth p2 beats state p5)"
            - "Approve by non-submitter trs-2 on DISPUTED settlement -> ERR_SETTLEMENT_INVALID_STATE (SoD passes, state fires)"

      - name: state_beats_fiscal_on_amend
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_STOP_INVALID_STATE]
          - errors[ERR_TOUR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair state(p5) vs business_fiscal(p10): amending an ADVANCED stop (amend
          is CONTRACTED-only) while the new guarantee also exceeds the remaining budget
          fails both; the pinned order returns ERR_STOP_INVALID_STATE.
        test_recipe:
          setup:
            - "Tour budget 50,000,000; stop CONTRACTED (guarantee 4,000,000 committed, available 46,000,000) then ADVANCED"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
              captures: { stop_v: "$.data.version "}
          trigger:
            - call: "POST /stops/${stop_id}/amend"
              payload: { expected_stop_version: "${stop_v}", guarantee_cents: 60000000 }
              as: Producer
              captures: { err: "$.data.error_id "}
          assert:
            - "Amend on ADVANCED stop with guarantee 60,000,000 (> 46,000,000 available) -> ERR_STOP_INVALID_STATE (state p5 beats fiscal p10)"

      - name: shape_beats_state_on_played
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_PERFORMANCE_INVALID_STATE]
        distinguishing_aspect: |
          Category pair request-shape(p4) vs state(p5): marking a CANCELLED performance
          PLAYED with a negative gross fails both; the pinned order returns
          ERR_INVALID_REQUEST, proving shape is validated before transition legality.
        test_recipe:
          setup:
            - "READY stop with one performance, cancelled before being played"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
