            - call: "POST /allocation/transfer-recommendations"
              payload: { program_id: "${prog_id}", from_store_id: "${s3_id}", to_store_id: "${s1_id}", item_id: "${item_id}", units: 1, expected_from_position_version: "${p3_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { t4_id: $.data.id }
          assert:
            - "With 0101 in REMODEL the dispatch returns ERR_STORE_NOT_ELIGIBLE (409) and TransferRecommendation.${t1_id}.status stays APPROVED with dispatched_at null"
            - "StorePosition.${p1_id}.in_transit_units is still 0 and StorePosition.${p2_id}.on_hand_units is still 30 after the refused dispatch"
            - "After 0101 returns to ACTIVE the identical dispatch returns 200: status == DISPATCHED, ${p1_id}.in_transit_units == 6, ${p2_id}.on_hand_units == 24 with size_on_hand == [{S:4},{M:10},{L:8},{XL:2}]"
            - "Store.${s1_id}.version incremented twice (ACTIVE -> REMODEL -> ACTIVE) and the cycle left no other field changed"
            - "Creating a transfer INTO the CLOSING store 0103 returns ERR_STORE_NOT_ELIGIBLE (409) - the eligibility rule at priority 26 also guards create"
            - "Creating a transfer OUT OF the CLOSING store 0103 succeeds: TransferRecommendation.${t4_id}.units == 1, size_split == [{XL:1}] (XL is the only CORE size 0101 is out of that 0103 holds), benefit_usd == 13.05, landed_cost_usd == 50.40, benefit_ratio_bp == 2589"
