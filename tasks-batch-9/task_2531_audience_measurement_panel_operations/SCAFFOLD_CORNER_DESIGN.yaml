              captures: { m13_v1: "$.data.version" }
            - call: "POST /universe-estimates"
              payload: { market_id: "${m13_id}", vintage_label: "2026Q3", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${c13_id}", population_households: 100000, population_persons: 250000 }], expected_market_version: "${m13_v1}" }
              as: MethodologyStatistician
              captures: { ue13_id: "$.data.id" }
            - call: "POST /universe-estimates/${ue13_id}/publish"
