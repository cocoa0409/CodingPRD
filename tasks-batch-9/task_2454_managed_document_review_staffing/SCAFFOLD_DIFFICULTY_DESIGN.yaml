            - "Reviewer B (SECOND_LEVEL, remote-authorised) is also VERIFIED, CLEARED and EXECUTED, so staffing survives A's lapse"
            - "Reviewer A's credential is then moved VERIFIED -> LAPSED, which leaves her existing assignment untouched"
