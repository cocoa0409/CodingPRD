scenario: "2685. Community Development Financial Institution Certification & Lending (certified community development lender): certification application with primary mission, target market definition and financing activity tests, accountability requirement demonstration through board or advisory structures representing the target market, target market lending percentage monitoring with geocoding of borrowers and periodic recertification, loan products designed for underserved borrowers with flexible underwriting and credit-building features, technical assistance and borrower support integrated with lending, federal award program applications with matching funds and performance goals, impact measurement across jobs, housing units and businesses financed with data collection from borrowers, portfolio risk management with loss reserves reflecting higher-risk lending"
domain_name: "cdfi-certification-lending"
api_prefix: "/cdfi"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - ops_run_checkpoint
    - derived_field_reconciliation

  entity_topology: graph
  # graph: Loan is self-referential (refinance_of_loan_id), BoardSeat joins
  # Institution x TargetMarket, TAEngagement joins Institution x Borrower x Loan,
  # MatchingFundCommitment hangs off AwardApplication while its posture gate is
  # owned by Institution. URL shape is a mix of nested creation paths and flat
  # FK-filtered list endpoints; no strict ownership tree exists.

  state_machine_shape: parallel
  secondary_state_machine_shapes: [cyclic, compound, branching, posture_driven]
  # parallel:  Loan carries two independent dimensions on one row
  #            (underwriting_state x servicing_state).
  # cyclic:    CertificationApplication UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW,
  #            ImpactReport VERIFIED -> DISPUTED -> SUBMITTED -> VERIFIED,
  #            AwardApplication DISBURSING -> DRAW_SUSPENDED -> DISBURSING,
  #            Borrower GEOCODE_FAILED -> GEOCODED retry loop.
  # compound:  CertificationApplication.state is gated by the aggregate of its six
  #            test verdict fields; Institution.compliance_posture is derived from
  #            the aggregate of its Loan portfolio.
  # branching: TAEngagement SCHEDULED -> {COMPLETED, NO_SHOW} with divergent
  #            side-effect sets; loan decision APPROVE vs DECLINE.
  # posture_driven: Institution.compliance_posture gates award draws and
  #            recertification outcomes.

  relationship_patterns:
    - one_to_many          # Institution -> Borrower / Loan / LoanProduct / TargetMarket
    - many_to_many         # BoardSeat associates Institution with TargetMarket
    - self_referential     # Loan.refinance_of_loan_id -> Loan.id
    - cross_aggregate      # Loan servicing state drives Institution posture drives AwardApplication draws

  role_model: segregation_of_duties
  # Three explicit same-id-space segregation checks:
  #  (1) Loan.decision actor MUST NOT equal Loan.underwritten_by_user_id
  #  (2) CertificationApplication.decide actor MUST NOT equal reviewed_by_user_id
  #  (3) MatchingFundCommitment.verify actor MUST NOT equal the award's decided_by_user_id

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 12 entities / 71 endpoints / 52 error codes / 9 calculations (3 dual-variant)
  # / 9 state machines / 2 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_location: "list responses put the rows themselves in data as a JSON array (response_type array) and the four pagination fields in meta, so a page is read as data[N] and its envelope as meta.total_count / meta.has_more"
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Institution
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the community development lender.
      - name: ein
        type: string
        source: input
        description: Employer identification number; unique across all Institutions.
        constraints: "unique; exactly 9 digits"
      - name: entity_type
        type: enum
        source: input
        description: Charter form of the lender.
        constraints: "one of {LOAN_FUND, CREDIT_UNION, BANK_HOLDING, VENTURE_FUND}"
      - name: primary_mission_statement
        type: string
        source: input
        description: Board-adopted primary mission text used by the PRIMARY_MISSION test.
        constraints: "min length 40 characters"
      - name: asset_size_cents
        type: integer
        source: input
        description: Total assets in cents at registration.
        constraints: ">= 0"
      - name: loss_reserve_balance_cents
        type: integer
        source: input
        description: Funded loan-loss reserve balance in cents; debited by charge-offs.
        default: 0
        constraints: ">= 0"
      - name: reserve_method
        type: enum
        source: input
        description: Which reserve variant is authoritative for reserve_coverage_ratio.
        default: MIGRATION_ANALYSIS
        constraints: "one of {MIGRATION_ANALYSIS, STATIC_POOL}"
      - name: certification_state
        type: enum
        source: system
        description: Certification lifecycle dimension of the Institution.
        default: UNCERTIFIED
        constraints: "one of {UNCERTIFIED, CERTIFIED, RECERT_DUE, DECERTIFIED}"
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived posture from reserve_coverage_ratio; gates award draws.
        default: COMPLIANT
        constraints: "one of {COMPLIANT, WATCH, PROBATION}"
      - name: accountability_score
        type: number
        source: computed
        description: Output of calculations.accountability_representation_score, 4 decimals.
        default: 0.0000
      - name: accountability_satisfied
        type: boolean
        source: computed
        description: True iff accountability_score >= 0.5000.
        default: false
      - name: governing_seats_active
        type: integer
        source: computed
        description: Count of BoardSeat rows with structure GOVERNING_BOARD and status ACTIVE.
        default: 0
      - name: advisory_seats_active
        type: integer
        source: computed
        description: Count of BoardSeat rows with structure ADVISORY_BOARD and status ACTIVE.
        default: 0
      - name: portfolio_principal_outstanding_cents
        type: integer
        source: computed
        description: Sum of Loan.principal_outstanding_cents over this Institution's Loans.
        default: 0
      - name: portfolio_principal_disbursed_cents
        type: integer
        source: computed
        description: Sum of Loan.principal_disbursed_cents over this Institution's Loans.
        default: 0
      - name: loss_reserve_required_migration_cents
        type: integer
        source: computed
        description: MIGRATION_ANALYSIS variant output of calculations.portfolio_loss_reserve.
        default: 0
      - name: loss_reserve_required_static_cents
        type: integer
        source: computed
        description: STATIC_POOL variant output of calculations.portfolio_loss_reserve.
        default: 0
      - name: loss_reserve_required_cents
        type: integer
        source: computed
        description: The variant selected by reserve_method.
        default: 0
      - name: reserve_coverage_ratio
        type: number
        source: computed
        description: loss_reserve_balance_cents / loss_reserve_required_cents, 4 decimals; pinned to 1.0000 when required is 0.
        default: 1.0000
      - name: reserve_deficit_cents
        type: integer
        source: computed
        description: Charge-off amount that could not be absorbed by loss_reserve_balance_cents.
        default: 0
      - name: target_market_lending_pct
        type: number
        source: computed
        description: selected_pct of the most recently FINALIZED ComplianceMeasurement, 2 decimals.
        default: 0.00
      - name: jobs_created_total
        type: integer
        source: computed
        description: Sum of jobs_created over ImpactReport rows in state VERIFIED for this Institution's Loans.
        default: 0
      - name: jobs_retained_total
        type: integer
        source: computed
        description: Sum of jobs_retained over ImpactReport rows in state VERIFIED.
        default: 0
      - name: housing_units_total
        type: integer
        source: computed
        description: Sum of housing_units over ImpactReport rows in state VERIFIED.
        default: 0
      - name: businesses_financed_total
        type: integer
        source: computed
        description: Sum of businesses_financed over ImpactReport rows in state VERIFIED.
        default: 0
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock instant at which certification_state became CERTIFIED; null otherwise.
      - name: recertification_due_at
        type: datetime
        source: computed
        description: period_end of the passing ComplianceMeasurement plus 1095 days; null until first PASS.

  - name: TargetMarket
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; owner of this target market definition."
      - name: market_type
        type: enum
        source: input
        description: Statutory target market category.
        constraints: "one of {INVESTMENT_AREA, LOW_INCOME_TARGETED_POPULATION, OTHER_TARGETED_POPULATION}"
      - name: name
        type: string
        source: input
        description: Human label for the market definition.
      - name: census_tract_codes
        type: array
        source: input
        description: 11-character tract codes composing an INVESTMENT_AREA; required non-empty when market_type is INVESTMENT_AREA, MUST be empty otherwise.
        default: []
      - name: ami_threshold_pct
        type: number
        source: input
        description: Household-income ceiling as a percentage of area median income; required when market_type is LOW_INCOME_TARGETED_POPULATION, MUST be null otherwise.
      - name: state
        type: enum
        source: system
        description: Definition approval state.
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED}"
      - name: approved_at
        type: datetime
        source: computed
        description: Logical-clock instant of approval; null while DRAFT.

  - name: CertificationApplication
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; the applicant."
      - name: primary_mission_statement
        type: string
        source: input
        description: Mission text as submitted on this application.
        constraints: "min length 40 characters"
      - name: financing_activity_pct_claimed
        type: number
        source: input
        description: Share of activity the applicant claims is financing activity, 2 decimals.
        constraints: ">= 0.00 and <= 100.00"
      - name: development_services_description
        type: string
        source: input
        description: Narrative of technical assistance and borrower support offered alongside lending.
        constraints: "min length 20 characters"
      - name: state
        type: enum
        source: system
        description: Application lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, CERTIFIED, DENIED}"
      - name: revision_round
        type: integer
        source: system
        description: Number of times the application has entered INFO_REQUESTED.
        default: 0
        constraints: "<= 2; a third increment forces DENIED"
      - name: accountability_score_snapshot
        type: number
        source: computed
        description: Institution.accountability_score copied at creation time, 4 decimals.
      - name: test_primary_mission_state
        type: enum
        source: system
        description: Verdict of the PRIMARY_MISSION certification test.
        default: PENDING
        constraints: "one of {PENDING, PASSED, FAILED, WAIVED}"
      - name: test_financing_entity_state
        type: enum
        source: system
        description: Verdict of the FINANCING_ENTITY certification test.
        default: PENDING
        constraints: "one of {PENDING, PASSED, FAILED, WAIVED}"
      - name: test_target_market_state
        type: enum
        source: system
        description: Verdict of the TARGET_MARKET certification test.
        default: PENDING
        constraints: "one of {PENDING, PASSED, FAILED, WAIVED}"
      - name: test_development_services_state
        type: enum
        source: system
        description: Verdict of the DEVELOPMENT_SERVICES certification test.
        default: PENDING
        constraints: "one of {PENDING, PASSED, FAILED, WAIVED}"
      - name: test_accountability_state
        type: enum
        source: system
        description: Verdict of the ACCOUNTABILITY certification test; also written by the board-resignation cascade.
        default: PENDING
        constraints: "one of {PENDING, PASSED, FAILED, WAIVED}"
      - name: test_non_government_state
        type: enum
        source: system
        description: Verdict of the NON_GOVERNMENT_ENTITY certification test.
        default: PENDING
        constraints: "one of {PENDING, PASSED, FAILED, WAIVED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the InstitutionOfficer that submitted; null while DRAFT.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationReviewer that opened review; segregation-of-duties anchor for decide.
      - name: info_requested_reason
        type: string
        source: system
        description: Reason recorded on the most recent INFO_REQUESTED entry; null otherwise.
      - name: decided_at
        type: datetime
        source: computed
        description: Logical-clock instant of CERTIFIED or DENIED; null otherwise.

  - name: BoardSeat
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; the institution whose board this seat belongs to."
      - name: target_market_id
        type: string
        source: input
        description: "FK -> TargetMarket.id; the target market this seat represents. Required when represents_target_market is true, MUST be null otherwise."
      - name: structure
        type: enum
        source: input
        description: Which accountability structure the seat sits on.
        constraints: "one of {GOVERNING_BOARD, ADVISORY_BOARD}"
      - name: holder_name
        type: string
        source: input
        description: Name of the seat holder.
      - name: represents_target_market
        type: boolean
        source: input
        description: Whether the holder is accountable to the referenced target market.
        default: false
      - name: status
        type: enum
        source: system
        description: Seat occupancy; only ACTIVE seats enter accountability_representation_score.
        default: ACTIVE
        constraints: "one of {ACTIVE, RESIGNED}"
      - name: resigned_at
        type: datetime
        source: computed
        description: Logical-clock instant of resignation; null while ACTIVE.

  - name: Borrower
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; the lender that intake this borrower."
      - name: full_name
        type: string
        source: input
        description: Borrower legal name.
      - name: street_address
        type: string
        source: input
        description: Street address submitted for geocoding.
      - name: postal_code
        type: string
        source: input
        description: 5-digit postal code submitted for geocoding.
      - name: household_income_cents
        type: integer
        source: input
        description: Annual household income in cents.
        constraints: ">= 0"
      - name: area_median_income_cents
        type: integer
        source: input
        description: Area median income in cents for the borrower's area.
        constraints: "> 0"
      - name: credit_score
        type: integer
        source: input
        description: Credit bureau score; null means no scoreable file.
        constraints: "null, or between 300 and 850 inclusive"
      - name: income_pct_ami
        type: number
        source: computed
        description: round_half_up(100 * household_income_cents / area_median_income_cents, 2).
        default: 0.00
      - name: census_tract_code
        type: string
        source: system
        description: Tract code resolved by geocoding; null until GEOCODED.
      - name: geocode_state
        type: enum
        source: system
        description: Geocoding lifecycle for target-market attribution.
        default: UNGEOCODED
        constraints: "one of {UNGEOCODED, GEOCODED, GEOCODE_FAILED}"
      - name: geocode_attempts
        type: integer
        source: system
        description: Number of geocode calls made against this borrower.
        default: 0
      - name: in_target_market
        type: boolean
        source: computed
        description: True iff geocode_state is GEOCODED and the borrower matched an APPROVED TargetMarket of the owning Institution.
        default: false
      - name: matched_target_market_type
        type: enum
        source: computed
        description: market_type of the APPROVED TargetMarket that matched; null when in_target_market is false.
        constraints: "null, or one of {INVESTMENT_AREA, LOW_INCOME_TARGETED_POPULATION, OTHER_TARGETED_POPULATION}"
      - name: ta_hours_total
        type: number
        source: computed
        description: Sum of actual_hours over this borrower's TAEngagement rows in state COMPLETED, 2 decimals.
        default: 0.00

  - name: LoanProduct
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; the lender offering the product."
      - name: name
        type: string
        source: input
        description: Product name.
      - name: base_rate_bps
        type: integer
        source: input
        description: Base annual rate in basis points before risk spread and TA discount.
        constraints: ">= 0 and <= 3600"
      - name: term_months
        type: integer
        source: input
        description: Amortization term in months.
        constraints: ">= 1 and <= 360"
      - name: max_dti_pct
        type: number
        source: input
        description: Maximum allowable debt-to-income percentage, 2 decimals.
        constraints: "> 0.00 and <= 60.00"
      - name: min_credit_score
        type: integer
        source: input
        description: Minimum scoreable credit score accepted when a score exists.
        constraints: ">= 300 and <= 850"
      - name: allow_no_credit_score
        type: boolean
        source: input
        description: Whether a borrower with credit_score null may be graded via the E tier.
        default: false
      - name: credit_building_features
        type: array
        source: input
        description: Credit-building features attached to the product.
        default: []
        constraints: "subset of {REPORTS_TO_BUREAUS, SAVINGS_MATCH, RATE_STEP_DOWN, DEFERRED_FIRST_PAYMENT}"
      - name: requires_ta_completion
        type: boolean
        source: input
        description: Whether an approval requires a COMPLETED, competency-verified TAEngagement for the borrower.
        default: false
      - name: product_cap_cents
        type: integer
        source: input
        description: Ceiling on committed principal across all approved and closed loans of this product.
        constraints: "> 0"
      - name: committed_principal_cents
        type: integer
        source: computed
        description: Sum of approved_principal_cents over Loans of this product with underwriting_state in {APPROVED, CLOSED}.
        default: 0

  - name: Loan
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; the lender booking the loan."
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id; the borrower obligated on the loan."
      - name: product_id
        type: string
        source: input
        description: "FK -> LoanProduct.id; the product whose underwriting box governs this loan."
      - name: refinance_of_loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the prior loan this one refinances. Null for new-money loans."
      - name: requested_principal_cents
        type: integer
        source: input
        description: Principal requested at intake in cents.
        constraints: "> 0"
      - name: approved_principal_cents
        type: integer
        source: computed
        description: Principal authorised at decision; null until APPROVED.
      - name: underwriting_state
        type: enum
        source: system
        description: First independent state dimension of the Loan row.
        default: SCREENING
        constraints: "one of {SCREENING, UNDERWRITING, APPROVED, DECLINED, CLOSED}"
      - name: servicing_state
        type: enum
        source: system
        description: Second independent state dimension of the same Loan row; advances only via disbursement, payment, servicing run or charge-off.
        default: NOT_DISBURSED
        constraints: "one of {NOT_DISBURSED, CURRENT, DELINQUENT_30, DELINQUENT_60, DELINQUENT_90, CHARGED_OFF, PAID_OFF}"
      - name: verified_monthly_income_cents
        type: integer
        source: system
        description: Income verified at underwriting; null before UNDERWRITING.
      - name: existing_monthly_debt_cents
        type: integer
        source: system
        description: Monthly debt obligations excluding this loan, captured at underwriting.
      - name: credit_score_at_underwriting
        type: integer
        source: system
        description: Score used for tiering; null when the borrower has no scoreable file.
      - name: provisional_monthly_payment_cents
        type: integer
        source: computed
        description: Step 1 of calculations.loan_pricing_and_grade, computed at base_rate_bps.
      - name: dti_pct
        type: number
        source: computed
        description: Step 2 of calculations.loan_pricing_and_grade, 2 decimals; frozen and never recomputed from the final rate.
      - name: risk_grade
        type: enum
        source: computed
        description: Step 3 tier assignment.
        constraints: "null, or one of {A, B, C, D, E}"
      - name: risk_spread_bps
        type: integer
        source: computed
        description: Step 4 spread implied by risk_grade.
      - name: ta_discount_bps
        type: integer
        source: computed
        description: Step 5 technical-assistance rate discount in basis points.
      - name: final_rate_bps
        type: integer
        source: computed
        description: Step 6 contractual rate in basis points.
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: Step 7 payment recomputed at final_rate_bps.
      - name: principal_disbursed_cents
        type: integer
        source: computed
        description: Cumulative principal advanced.
        default: 0
      - name: principal_repaid_cents
        type: integer
        source: computed
        description: Cumulative principal repaid by payments.
        default: 0
      - name: principal_outstanding_cents
        type: integer
        source: computed
        description: principal_disbursed_cents - principal_repaid_cents - charged_off_principal_cents.
        default: 0
      - name: charged_off_principal_cents
        type: integer
        source: computed
        description: Principal written off at charge-off.
        default: 0
      - name: first_disbursed_on
        type: datetime
        source: computed
        description: Logical-clock instant of the first disbursement; the vintage and measurement-period anchor.
      - name: next_payment_due_on
        type: datetime
        source: computed
        description: Due date the servicing run compares against the logical clock.
      - name: days_past_due
        type: integer
        source: computed
        description: Whole days between next_payment_due_on and the logical clock at the last servicing run; 0 when not past due.
        default: 0
      - name: borrower_in_target_market_at_origination
        type: boolean
        source: computed
        description: Snapshot of Borrower.in_target_market taken at first disbursement; the only field target-market lending percentage reads.
        default: false
      - name: vintage_year
        type: integer
        source: computed
        description: Calendar year of first_disbursed_on; drives the STATIC_POOL vintage loss rate.
      - name: underwritten_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditUnderwriter that underwrote; segregation-of-duties anchor for decision.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditCommittee member that decided.
      - name: decline_reason
        type: string
        source: system
        description: Reason recorded on a DECLINED decision; null otherwise.

  - name: TAEngagement
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; the lender delivering technical assistance."
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id; the borrower receiving assistance. This borrower is the occupied resource for slot-conflict detection."
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the loan the engagement supports. Null for pre-application coaching."
      - name: topic
        type: enum
        source: input
        description: Curriculum topic delivered.
        constraints: "one of {CREDIT_BUILDING, BUSINESS_PLANNING, HOMEBUYER_EDUCATION, FINANCIAL_COACHING}"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: Inclusive start of the booked slot.
      - name: scheduled_end_at
        type: datetime
        source: input
        description: Inclusive end of the booked slot; MUST be strictly after scheduled_start_at.
      - name: planned_hours
        type: number
        source: input
        description: Hours planned, 2 decimals.
        constraints: "> 0.00 and <= 8.00"
      - name: actual_hours
        type: number
        source: system
        description: Hours actually delivered, recorded at close with outcome COMPLETED; null otherwise.
      - name: competency_verified
        type: boolean
        source: system
        description: Whether the coach attested competency; only a true value satisfies a product's TA prerequisite.
        default: false
      - name: state
        type: enum
        source: system
        description: Engagement lifecycle; the fork at close has divergent side-effect sets.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, NO_SHOW}"
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant of close; null while SCHEDULED.

  - name: ImpactReport
    parent: Loan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the financed loan whose outcomes are reported."
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id; the reporting borrower, copied from the loan at creation."
      - name: reporting_period_end
        type: datetime
        source: input
        description: End of the outcome period covered by this report.
      - name: jobs_created
        type: integer
        source: input
        description: Full-time-equivalent jobs created during the period.
        constraints: ">= 0"
      - name: jobs_retained
        type: integer
        source: input
        description: Full-time-equivalent jobs retained during the period.
        constraints: ">= 0"
      - name: housing_units
        type: integer
        source: input
        description: Housing units financed or preserved during the period.
        constraints: ">= 0"
      - name: businesses_financed
        type: integer
        source: input
        description: Businesses financed during the period.
        constraints: ">= 0"
      - name: state
        type: enum
        source: system
        description: Report lifecycle; VERIFIED reports are the only rows that feed Institution impact totals.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, VERIFIED, DISPUTED, SUPERSEDED}"
      - name: dispute_reason
        type: string
        source: system
        description: Analyst reason recorded on dispute; null otherwise.
      - name: verified_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent verification; null until first VERIFIED.
      - name: revision_count
        type: integer
        source: system
        description: Number of times the borrower has resubmitted after a dispute.
        default: 0

  - name: ComplianceMeasurement
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; the measured lender. This institution is the occupied resource for period-overlap detection."
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the half-open measurement window.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the half-open measurement window; MUST be strictly after period_start.
      - name: weighting_basis
        type: enum
        source: input
        description: Which variant of target_market_lending_percentage is authoritative for verdict.
        constraints: "one of {DOLLAR_WEIGHTED, COUNT_WEIGHTED}"
      - name: state
        type: enum
        source: system
        description: Measurement lifecycle; VOIDED rows are excluded from overlap detection, which is scoped per (institution_id, weighting_basis).
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED, VOIDED}"
      - name: measured_loan_count
        type: integer
        source: computed
        description: Count of Loans in the measurement input set.
        default: 0
      - name: target_market_loan_count
        type: integer
        source: computed
        description: Count of measured Loans with borrower_in_target_market_at_origination true.
        default: 0
      - name: measured_principal_cents
        type: integer
        source: computed
        description: Sum of principal_disbursed_cents over the measurement input set.
        default: 0
      - name: target_market_principal_cents
        type: integer
        source: computed
        description: Sum of principal_disbursed_cents over measured Loans with borrower_in_target_market_at_origination true.
        default: 0
      - name: dollar_weighted_pct
        type: number
        source: computed
        description: DOLLAR_WEIGHTED variant result, 2 decimals; null until FINALIZED.
      - name: count_weighted_pct
        type: number
        source: computed
        description: COUNT_WEIGHTED variant result, 2 decimals; null until FINALIZED.
      - name: selected_pct
        type: number
        source: computed
        description: The variant named by weighting_basis; null until FINALIZED.
      - name: verdict
        type: enum
        source: computed
        description: PASS iff selected_pct >= 60.00.
        default: PENDING
        constraints: "one of {PENDING, PASS, FAIL}"
      - name: void_reason
        type: string
        source: system
        description: Reason recorded when the draft is voided; null otherwise.
      - name: finalized_at
        type: datetime
        source: computed
        description: Logical-clock instant of finalization; null otherwise.

  - name: AwardApplication
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; the applicant lender."
      - name: program
        type: enum
        source: input
        description: Federal award program applied for.
        constraints: "one of {CDFI_PROGRAM_FA, CDFI_PROGRAM_TA, NEW_MARKETS, CMF}"
      - name: requested_amount_cents
        type: integer
        source: input
        description: Award amount requested in cents.
        constraints: "> 0"
      - name: match_ratio_pct
        type: number
        source: input
        description: Required non-federal match as a percentage of the request, 2 decimals.
        constraints: ">= 0.00 and <= 200.00"
      - name: required_match_cents
        type: integer
        source: computed
        description: round_half_up(requested_amount_cents * match_ratio_pct / 100).
        default: 0
      - name: match_eligible_cents
        type: integer
        source: computed
        description: Sum of eligible_cents over this award's MatchingFundCommitment rows in status VERIFIED.
        default: 0
      - name: match_shortfall_cents
        type: integer
        source: computed
        description: max(0, required_match_cents - match_eligible_cents).
        default: 0
      - name: performance_goal_jobs
        type: integer
        source: input
        description: Jobs the applicant commits to create over the award period.
        constraints: ">= 0"
      - name: performance_goal_housing_units
        type: integer
        source: input
        description: Housing units the applicant commits to finance over the award period.
        constraints: ">= 0"
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the award performance period.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the award performance period; MUST be strictly after period_start.
      - name: awarded_amount_cents
        type: integer
        source: computed
        description: Amount obligated at decision; null unless AWARDED or beyond.
      - name: goal_attainment_pct
        type: number
        source: computed
        description: round_half_up(100 * (Institution.jobs_created_total + Institution.housing_units_total) / max(1, performance_goal_jobs + performance_goal_housing_units), 2).
        default: 0.00
      - name: state
        type: enum
        source: system
        description: Award lifecycle; DISBURSING and DRAW_SUSPENDED form a posture-driven loop.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, AWARDED, REJECTED, DISBURSING, DRAW_SUSPENDED}"
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded when draws are suspended by the posture cascade; null otherwise.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the AwardAdministrator that decided; segregation-of-duties anchor for match verification.

  - name: MatchingFundCommitment
    parent: AwardApplication
    common_fields: true
    fields:
      - name: award_application_id
        type: string
        source: input
        description: "FK -> AwardApplication.id; the award this pledge matches."
      - name: source_name
        type: string
        source: input
        description: Name of the matching-fund source.
      - name: source_type
        type: enum
        source: input
        description: Source class that determines the eligibility factor.
        constraints: "one of {CASH_PRIVATE, CASH_PUBLIC_NON_FEDERAL, IN_KIND, DEFERRED_PLEDGE, FEDERAL}"
      - name: amount_cents
        type: integer
        source: input
        description: Face amount pledged in cents.
        constraints: "> 0"
      - name: committed_on
        type: datetime
        source: input
        description: Date the pledge was executed.
      - name: eligible_cents
        type: integer
        source: computed
        description: round_half_up(amount_cents * source factor); written at verification, 0 while PLEDGED.
        default: 0
      - name: status
        type: enum
        source: system
        description: Pledge lifecycle; HELD is written by the draw-suspension cascade.
        default: PLEDGED
        constraints: "one of {PLEDGED, VERIFIED, WITHDRAWN, HELD}"
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the AwardAdministrator that verified the pledge.
      - name: withdraw_reason
        type: string
        source: system
        description: Reason recorded on withdrawal; null otherwise.

state_machines:
  - entity: Institution
    initial_state: UNCERTIFIED
    terminal_states: [DECERTIFIED]
    note: |
      Institution carries two independent state dimensions on one row. Dimension 1
      is `certification_state` (UNCERTIFIED / CERTIFIED / RECERT_DUE / DECERTIFIED),
      driven by certification decisions and recertification measurements. Dimension 2
      is `compliance_posture` (COMPLIANT / WATCH / PROBATION), derived purely from
      reserve_coverage_ratio and re-derived on every reserve recompute. Neither
      dimension constrains the other's transitions; posture gates award draws while
      certification_state gates award submission.
    transitions:
      - from: UNCERTIFIED
        to: CERTIFIED
        trigger: "POST /cdfi/certification-applications/{application_id}/decide when every one of the six test_*_state fields is PASSED or WAIVED"
        actor: CertificationReviewer
        preconditions:
          - "CertificationApplication.state == UNDER_REVIEW"
          - "all six test_*_state fields != PENDING"
          - "test_primary_mission_state, test_financing_entity_state, test_target_market_state, test_development_services_state, test_accountability_state and test_non_government_state each in {PASSED, WAIVED}"
        side_effects:
          - "Institution.certification_state := CERTIFIED"
          - "Institution.certified_at := current logical clock"
          - "Institution.recertification_due_at := current logical clock + 1095 days"
          - "CertificationApplication.state := CERTIFIED, decided_at set"
      - from: CERTIFIED
        to: RECERT_DUE
        trigger: "system, evaluated inside POST /cdfi/institutions/{institution_id}/servicing-runs"
        actor: system
        preconditions:
          - "Institution.recertification_due_at is not null"
          - "current logical clock >= Institution.recertification_due_at"
        side_effects:
          - "Institution.certification_state := RECERT_DUE"
      - from: RECERT_DUE
        to: CERTIFIED
        trigger: "POST /cdfi/compliance-measurements/{measurement_id}/finalize producing verdict PASS"
        actor: ComplianceAnalyst
        preconditions:
          - "ComplianceMeasurement.institution_id == this Institution.id"
          - "ComplianceMeasurement.verdict == PASS"
        side_effects:
          - "Institution.certification_state := CERTIFIED"
          - "Institution.recertification_due_at := ComplianceMeasurement.period_end + 1095 days"
          - "Institution.target_market_lending_pct := ComplianceMeasurement.selected_pct"
      - from: RECERT_DUE
        to: DECERTIFIED
        trigger: "POST /cdfi/compliance-measurements/{measurement_id}/finalize producing verdict FAIL"
        actor: ComplianceAnalyst
        preconditions:
          - "ComplianceMeasurement.verdict == FAIL"
        side_effects:
          - "Institution.certification_state := DECERTIFIED"
          - "Institution.target_market_lending_pct := ComplianceMeasurement.selected_pct"
          - "every AwardApplication of this Institution with state in {DISBURSING, DRAW_SUSPENDED} keeps its state; new award submissions are blocked by validation priority 63 (ERR_INSTITUTION_NOT_CERTIFIED)"
      - from: COMPLIANT
        to: WATCH
        trigger: "system, on any reserve recompute (loan disbursement, payment, servicing run, charge-off)"
        actor: system
        preconditions:
          - "Institution.reserve_coverage_ratio >= 0.8000 and < 1.0000"
        side_effects:
          - "Institution.compliance_posture := WATCH"
        note: "Second state dimension. WATCH does not suspend award draws."
      - from: COMPLIANT
        to: PROBATION
        trigger: "system, on any reserve recompute"
        actor: system
        preconditions:
          - "Institution.reserve_coverage_ratio < 0.8000"
        side_effects:
          - "Institution.compliance_posture := PROBATION"
          - "every AwardApplication of this Institution with state == DISBURSING transitions to DRAW_SUSPENDED with suspension_reason 'POSTURE_PROBATION'"
      - from: WATCH
        to: PROBATION
        trigger: "system, on any reserve recompute"
        actor: system
        preconditions:
          - "Institution.reserve_coverage_ratio < 0.8000"
        side_effects:
          - "Institution.compliance_posture := PROBATION"
          - "every AwardApplication of this Institution with state == DISBURSING transitions to DRAW_SUSPENDED with suspension_reason 'POSTURE_PROBATION'"
      - from: WATCH
        to: COMPLIANT
        trigger: "system, on any reserve recompute"
        actor: system
        preconditions:
          - "Institution.reserve_coverage_ratio >= 1.0000"
        side_effects:
          - "Institution.compliance_posture := COMPLIANT"
      - from: PROBATION
        to: COMPLIANT
        trigger: "system, on any reserve recompute"
        actor: system
        preconditions:
          - "Institution.reserve_coverage_ratio >= 1.0000"
        side_effects:
          - "Institution.compliance_posture := COMPLIANT"
        note: "Award draws are NOT auto-resumed; POST /award-applications/{award_id}/resume-draws is required."

  - entity: TargetMarket
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /cdfi/target-markets/{target_market_id}/approve"
        actor: CertificationReviewer
        preconditions:
          - "TargetMarket.state == DRAFT"
          - "market_type == INVESTMENT_AREA implies census_tract_codes has at least 1 element"
          - "market_type == LOW_INCOME_TARGETED_POPULATION implies ami_threshold_pct is not null"
        side_effects:
          - "TargetMarket.state := APPROVED, approved_at := current logical clock"
          - "Institution.accountability_score and accountability_satisfied recomputed (seats referencing this market now count)"
          - "Institution.version incremented by 1"

  - entity: CertificationApplication
    initial_state: DRAFT
    terminal_states: [CERTIFIED, DENIED]
    note: |
      Cyclic machine. UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW may repeat while
      revision_round <= 2; the third request-info forces DENIED instead of looping.
      The state is also compound: `decide` reads the aggregate of the six
      test_*_state fields, and the accountability cascade can push a row backwards
      from UNDER_REVIEW to INFO_REQUESTED without any reviewer action.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cdfi/certification-applications/{application_id}/submit"
        actor: InstitutionOfficer
        preconditions:
          - "CertificationApplication.state == DRAFT"
          - "the Institution has at least one TargetMarket with state == APPROVED"
          - "Institution.accountability_satisfied == true"
          - "financing_activity_pct_claimed >= 60.00"
        side_effects:
          - "state := SUBMITTED, submitted_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /cdfi/certification-applications/{application_id}/begin-review"
        actor: CertificationReviewer
        preconditions:
          - "CertificationApplication.state == SUBMITTED"
        side_effects:
          - "state := UNDER_REVIEW, reviewed_by_user_id := X-User-ID"
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /cdfi/certification-applications/{application_id}/evaluate-test"
        actor: CertificationReviewer
        preconditions:
          - "CertificationApplication.state == UNDER_REVIEW"
          - "test_code == TARGET_MARKET implies the Institution has at least one TargetMarket with state == APPROVED"
          - "test_code == ACCOUNTABILITY implies Institution.accountability_satisfied == true"
        side_effects:
          - "test_<test_code>_state := verdict"
        note: "Self-loop; records one verdict per call and never changes state."
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /cdfi/certification-applications/{application_id}/request-info"
        actor: CertificationReviewer
        preconditions:
          - "CertificationApplication.state == UNDER_REVIEW"
          - "revision_round < 2"
        side_effects:
          - "state := INFO_REQUESTED, revision_round incremented by 1, info_requested_reason recorded"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /cdfi/certification-applications/{application_id}/request-info when revision_round == 2"
        actor: CertificationReviewer
        preconditions:
          - "CertificationApplication.state == UNDER_REVIEW"
          - "revision_round == 2"
        side_effects:
          - "state := DENIED, revision_round incremented to 3, info_requested_reason recorded, decided_at set"
        note: "Loop-termination branch: the cycle is bounded at two revisions."
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /cdfi/certification-applications/{application_id}/resubmit"
        actor: InstitutionOfficer
        preconditions:
          - "CertificationApplication.state == INFO_REQUESTED"
        side_effects:
          - "state := UNDER_REVIEW"
          - "any supplied primary_mission_statement / financing_activity_pct_claimed / development_services_description overwrite the stored values"
          - "every test_*_state currently FAILED is reset to PENDING; PASSED and WAIVED verdicts are retained"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "system, cascade from POST /cdfi/board-seats/{board_seat_id}/resign"
        actor: system
        preconditions:
          - "Institution.accountability_satisfied flipped from true to false as a consequence of the seat resignation"
          - "CertificationApplication.state == UNDER_REVIEW"
          - "revision_round < 2"
        side_effects:
          - "test_accountability_state := FAILED"
          - "state := INFO_REQUESTED, revision_round incremented by 1, info_requested_reason := 'ACCOUNTABILITY_TEST_FAILED'"
        note: "Third and fourth links of the board-resignation cascade."
      - from: UNDER_REVIEW
        to: CERTIFIED
        trigger: "POST /cdfi/certification-applications/{application_id}/decide when every one of the six test_*_state fields is PASSED or WAIVED"
        actor: CertificationReviewer
        preconditions:
          - "CertificationApplication.state == UNDER_REVIEW"
          - "X-User-ID != reviewed_by_user_id"
          - "no test_*_state == PENDING"
          - "no test_*_state == FAILED"
        side_effects:
          - "state := CERTIFIED, decided_at set"
          - "Institution.certification_state := CERTIFIED, certified_at set"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /cdfi/certification-applications/{application_id}/decide when at least one of the six test_*_state fields is FAILED"
        actor: CertificationReviewer
        preconditions:
          - "CertificationApplication.state == UNDER_REVIEW"
          - "X-User-ID != reviewed_by_user_id"
          - "no test_*_state == PENDING"
        side_effects:
          - "state := DENIED, decided_at set"
          - "Institution.certification_state is left unchanged"

  - entity: Borrower
    initial_state: UNGEOCODED
    terminal_states: []
    note: "Cyclic: GEOCODE_FAILED may be retried and become GEOCODED."
    transitions:
      - from: UNGEOCODED
        to: GEOCODED
        trigger: "POST /cdfi/borrowers/{borrower_id}/geocode with outcome MATCHED"
        actor: ComplianceAnalyst
        preconditions:
          - "census_tract_code supplied in the request body"
        side_effects:
          - "geocode_state := GEOCODED, census_tract_code stored, geocode_attempts incremented by 1"
          - "in_target_market and matched_target_market_type recomputed by calculations.target_market_attribution"
      - from: UNGEOCODED
        to: GEOCODE_FAILED
        trigger: "POST /cdfi/borrowers/{borrower_id}/geocode with outcome UNMATCHED"
        actor: ComplianceAnalyst
        preconditions: []
        side_effects:
          - "geocode_state := GEOCODE_FAILED, geocode_attempts incremented by 1, in_target_market := false, matched_target_market_type := null"
      - from: GEOCODE_FAILED
        to: GEOCODED
        trigger: "POST /cdfi/borrowers/{borrower_id}/geocode with outcome MATCHED"
        actor: ComplianceAnalyst
        preconditions:
          - "census_tract_code supplied in the request body"
        side_effects:
          - "geocode_state := GEOCODED, census_tract_code stored, geocode_attempts incremented by 1"
          - "in_target_market and matched_target_market_type recomputed"
      - from: GEOCODED
        to: GEOCODED
        trigger: "POST /cdfi/borrowers/{borrower_id}/geocode with outcome MATCHED"
        actor: ComplianceAnalyst
        preconditions:
          - "census_tract_code supplied in the request body"
        side_effects:
          - "census_tract_code overwritten, geocode_attempts incremented by 1, in_target_market and matched_target_market_type recomputed"
          - "already-disbursed Loans keep borrower_in_target_market_at_origination unchanged"
        note: "Re-geocoding never rewrites the origination snapshot on existing loans."

  - entity: Loan
    initial_state: SCREENING
    terminal_states: [DECLINED, CHARGED_OFF, PAID_OFF]
    note: |
      Two independent state dimensions live on the same Loan row and advance on
      disjoint trigger sets. Dimension 1 `underwriting_state`:
      SCREENING -> UNDERWRITING -> {APPROVED, DECLINED}; APPROVED -> CLOSED at first
      disbursement. Dimension 2 `servicing_state`: NOT_DISBURSED -> CURRENT ->
      DELINQUENT_30/60/90 -> CHARGED_OFF, with payment-driven cure back to CURRENT and
      CURRENT -> PAID_OFF. A CLOSED loan is still actively servicing; a PAID_OFF loan
      keeps underwriting_state == CLOSED forever. No trigger advances both dimensions
      except the first disbursement, which moves APPROVED -> CLOSED and
      NOT_DISBURSED -> CURRENT in one request.
    transitions:
      - from: SCREENING
        to: UNDERWRITING
        trigger: "POST /cdfi/loans/{loan_id}/underwrite"
        actor: CreditUnderwriter
        preconditions:
          - "Loan.underwriting_state == SCREENING"
          - "Borrower.geocode_state == GEOCODED"
          - "credit_score supplied, or LoanProduct.allow_no_credit_score == true"
          - "calculations.loan_pricing_and_grade resolves a risk_grade (otherwise ERR_UNDERWRITING_TIER_UNMET)"
        side_effects:
          - "underwriting_state := UNDERWRITING, underwritten_by_user_id := X-User-ID"
          - "verified_monthly_income_cents, existing_monthly_debt_cents, credit_score_at_underwriting stored"
          - "provisional_monthly_payment_cents, dti_pct, risk_grade, risk_spread_bps, ta_discount_bps, final_rate_bps, monthly_payment_cents written by calculations.loan_pricing_and_grade"
      - from: UNDERWRITING
        to: APPROVED
        trigger: "POST /cdfi/loans/{loan_id}/decision with decision APPROVE"
        actor: CreditCommittee
        preconditions:
          - "Loan.underwriting_state == UNDERWRITING"
          - "X-User-ID != Loan.underwritten_by_user_id"
          - "LoanProduct.requires_ta_completion == false, or a TAEngagement exists with borrower_id == Loan.borrower_id, state == COMPLETED and competency_verified == true"
          - "LoanProduct.committed_principal_cents + approved_principal_cents <= LoanProduct.product_cap_cents"
        side_effects:
          - "underwriting_state := APPROVED, approved_principal_cents := supplied value or requested_principal_cents, decided_by_user_id := X-User-ID"
          - "LoanProduct.committed_principal_cents increased by approved_principal_cents"
      - from: UNDERWRITING
        to: DECLINED
        trigger: "POST /cdfi/loans/{loan_id}/decision with decision DECLINE"
        actor: CreditCommittee
        preconditions:
          - "Loan.underwriting_state == UNDERWRITING"
          - "X-User-ID != Loan.underwritten_by_user_id"
        side_effects:
          - "underwriting_state := DECLINED, decline_reason recorded, decided_by_user_id := X-User-ID"
          - "LoanProduct.committed_principal_cents unchanged"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /cdfi/loans/{loan_id}/disbursements"
        actor: InstitutionOfficer
        preconditions:
          - "Loan.underwriting_state == APPROVED"
          - "principal_disbursed_cents + amount_cents <= approved_principal_cents"
        side_effects:
          - "underwriting_state := CLOSED (dimension 1)"
          - "servicing_state := CURRENT (dimension 2)"
          - "principal_disbursed_cents increased by amount_cents, principal_outstanding_cents recomputed"
          - "first_disbursed_on := current logical clock date, vintage_year := calendar year of that date, next_payment_due_on := that date + 30 days"
          - "borrower_in_target_market_at_origination := Borrower.in_target_market as observed now"
          - "Institution.portfolio_principal_outstanding_cents and portfolio_principal_disbursed_cents recomputed, then loss_reserve_required_* / reserve_coverage_ratio / compliance_posture re-derived"
      - from: NOT_DISBURSED
        to: CURRENT
        trigger: "POST /cdfi/loans/{loan_id}/disbursements (first advance)"
        actor: InstitutionOfficer
        preconditions:
          - "Loan.servicing_state == NOT_DISBURSED"
          - "Loan.underwriting_state == APPROVED"
        side_effects:
          - "servicing_state := CURRENT; see the APPROVED -> CLOSED entry for the full side-effect set of the same request"
      - from: CURRENT
        to: DELINQUENT_30
        trigger: "POST /cdfi/institutions/{institution_id}/servicing-runs"
        actor: ComplianceAnalyst
        preconditions:
          - "Loan.servicing_state == CURRENT"
          - "days_past_due recomputed from the logical clock is >= 30 and < 60"
        side_effects:
          - "days_past_due stored, servicing_state := DELINQUENT_30"
          - "Institution loss_reserve_required_* / reserve_coverage_ratio / compliance_posture re-derived"
      - from: CURRENT
        to: DELINQUENT_60
        trigger: "POST /cdfi/institutions/{institution_id}/servicing-runs"
        actor: ComplianceAnalyst
        preconditions:
          - "Loan.servicing_state == CURRENT"
          - "days_past_due recomputed from the logical clock is >= 60 and < 90"
        side_effects:
          - "days_past_due stored, servicing_state := DELINQUENT_60"
          - "Institution reserve fields and compliance_posture re-derived"
        note: "Buckets may be skipped: a single run can move CURRENT straight to DELINQUENT_60 or DELINQUENT_90."
      - from: CURRENT
        to: DELINQUENT_90
        trigger: "POST /cdfi/institutions/{institution_id}/servicing-runs"
        actor: ComplianceAnalyst
        preconditions:
          - "Loan.servicing_state == CURRENT"
          - "days_past_due recomputed from the logical clock is >= 90"
        side_effects:
          - "days_past_due stored, servicing_state := DELINQUENT_90"
          - "Institution reserve fields and compliance_posture re-derived"
      - from: DELINQUENT_30
        to: DELINQUENT_60
        trigger: "POST /cdfi/institutions/{institution_id}/servicing-runs"
        actor: ComplianceAnalyst
        preconditions:
          - "days_past_due recomputed from the logical clock is >= 60 and < 90"
        side_effects:
          - "days_past_due stored, servicing_state := DELINQUENT_60"
          - "Institution reserve fields and compliance_posture re-derived"
      - from: DELINQUENT_60
        to: DELINQUENT_90
        trigger: "POST /cdfi/institutions/{institution_id}/servicing-runs"
        actor: ComplianceAnalyst
        preconditions:
          - "days_past_due recomputed from the logical clock is >= 90"
        side_effects:
          - "days_past_due stored, servicing_state := DELINQUENT_90"
          - "Institution reserve fields and compliance_posture re-derived"
      - from: DELINQUENT_30
        to: CURRENT
        trigger: "POST /cdfi/loans/{loan_id}/payments"
        actor: InstitutionOfficer
        preconditions:
          - "Loan.servicing_state in {DELINQUENT_30, DELINQUENT_60, DELINQUENT_90}"
          - "amount_cents <= principal_outstanding_cents"
          - "amount_cents >= Loan.monthly_payment_cents - a payment of at least one installment cures the arrears in full"
        side_effects:
          - "principal_repaid_cents increased by amount_cents, principal_outstanding_cents recomputed"
          - "next_payment_due_on := current logical clock date + 30 days, days_past_due := 0"
          - "days_past_due recomputed, servicing_state := CURRENT"
          - "Institution reserve fields and compliance_posture re-derived"
        note: "Cure applies identically from DELINQUENT_60 and DELINQUENT_90."
      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /cdfi/loans/{loan_id}/payments retiring the balance"
        actor: InstitutionOfficer
        preconditions:
          - "amount_cents == principal_outstanding_cents"
        side_effects:
          - "principal_repaid_cents increased by amount_cents, principal_outstanding_cents := 0"
          - "servicing_state := PAID_OFF, next_payment_due_on := null, days_past_due := 0"
          - "Institution reserve fields and compliance_posture re-derived"
      - from: DELINQUENT_90
        to: CHARGED_OFF
        trigger: "POST /cdfi/loans/{loan_id}/charge-off"
        actor: ComplianceAnalyst
        preconditions:
          - "Loan.servicing_state == DELINQUENT_90"
        side_effects:
          - "LINK 1: charged_off_principal_cents := principal_outstanding_cents, principal_outstanding_cents := 0, servicing_state := CHARGED_OFF"
          - "LINK 2 (caused by LINK 1 changing principal_outstanding_cents): Institution.loss_reserve_balance_cents := max(0, balance - charged_off_principal_cents), Institution.reserve_deficit_cents := max(0, charged_off_principal_cents - prior balance), portfolio_principal_outstanding_cents recomputed, loss_reserve_required_* recomputed, reserve_coverage_ratio recomputed; if the new ratio < 0.8000 then Institution.compliance_posture := PROBATION"
          - "LINK 3 (caused by LINK 2 setting compliance_posture to PROBATION): every AwardApplication of this Institution with state == DISBURSING transitions to DRAW_SUSPENDED with suspension_reason 'POSTURE_PROBATION'"
          - "LINK 4 (caused by LINK 3 suspending an award): every MatchingFundCommitment of each newly DRAW_SUSPENDED award with status == PLEDGED transitions to HELD"

  - entity: TAEngagement
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW]
    note: "Branching fork: one endpoint, two targets, disjoint side-effect sets."
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /cdfi/ta-engagements/{engagement_id}/close with outcome COMPLETED"
        actor: InstitutionOfficer
        preconditions:
          - "TAEngagement.state == SCHEDULED"
          - "actual_hours supplied and > 0.00"
        side_effects:
          - "state := COMPLETED, actual_hours and competency_verified stored, closed_at set"
          - "Borrower.ta_hours_total recomputed as the sum of actual_hours over COMPLETED engagements"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /cdfi/ta-engagements/{engagement_id}/close with outcome NO_SHOW"
        actor: InstitutionOfficer
        preconditions:
          - "TAEngagement.state == SCHEDULED"
        side_effects:
          - "state := NO_SHOW, closed_at set, actual_hours := null, competency_verified := false"
          - "Borrower.ta_hours_total unchanged"
          - "the engagement leaves the slot-conflict candidate set, so its interval becomes bookable again"

  - entity: ImpactReport
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    note: |
      Cyclic machine: SUBMITTED -> VERIFIED -> DISPUTED -> SUBMITTED -> VERIFIED ...
      Verification and dispute are exact compensating actions over the four
      Institution impact counters, so any number of loops leaves
      Institution.jobs_created_total equal to the sum of jobs_created over
      ImpactReport rows in state VERIFIED.
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /cdfi/impact-reports/{impact_report_id}/verify"
        actor: ComplianceAnalyst
        preconditions:
          - "ImpactReport.state == SUBMITTED"
        side_effects:
          - "state := VERIFIED, verified_at := current logical clock"
          - "Institution.jobs_created_total, jobs_retained_total, housing_units_total and businesses_financed_total each increased by this report's corresponding field"
          - "goal_attainment_pct recomputed on every AwardApplication of the Institution with state in {AWARDED, DISBURSING, DRAW_SUSPENDED}"
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /cdfi/impact-reports/{impact_report_id}/dispute"
        actor: ComplianceAnalyst
        preconditions:
          - "ImpactReport.state in {SUBMITTED, VERIFIED}"
        side_effects:
          - "state := DISPUTED, dispute_reason recorded"
          - "Institution.jobs_created_total, jobs_retained_total, housing_units_total and businesses_financed_total each decreased by this report's corresponding field (exact compensation of the verification)"
          - "goal_attainment_pct recomputed on the same AwardApplication set"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /cdfi/impact-reports/{impact_report_id}/dispute"
        actor: ComplianceAnalyst
        preconditions:
          - "ImpactReport.state == SUBMITTED"
        side_effects:
          - "state := DISPUTED, dispute_reason recorded"
          - "Institution impact counters unchanged, because an unverified report never entered them"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /cdfi/impact-reports/{impact_report_id}/resubmit"
        actor: Borrower
        preconditions:
          - "ImpactReport.state == DISPUTED"
          - "X-User-ID == ImpactReport.borrower_id"
        side_effects:
          - "jobs_created, jobs_retained, housing_units and businesses_financed overwritten with the supplied values"
          - "state := SUBMITTED, revision_count incremented by 1, dispute_reason := null"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "POST /cdfi/loans/{loan_id}/impact-reports creating a newer report for the same loan"
        actor: system
        preconditions:
          - "a new ImpactReport is created for the same loan_id"
        side_effects:
          - "state := SUPERSEDED"
          - "Institution impact counters decreased by this report's four fields"
        note: "SUBMITTED and DISPUTED rows for the same loan are also moved to SUPERSEDED, but only a VERIFIED row adjusts counters."
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /cdfi/loans/{loan_id}/impact-reports creating a newer report for the same loan"
        actor: system
        preconditions:
          - "a new ImpactReport is created for the same loan_id"
        side_effects:
          - "state := SUPERSEDED"
          - "Institution impact counters unchanged"
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "POST /cdfi/loans/{loan_id}/impact-reports creating a newer report for the same loan"
        actor: system
        preconditions:
          - "a new ImpactReport is created for the same loan_id"
        side_effects:
          - "state := SUPERSEDED"
          - "Institution impact counters unchanged"

  - entity: ComplianceMeasurement
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /cdfi/compliance-measurements/{measurement_id}/finalize"
        actor: ComplianceAnalyst
        preconditions:
          - "ComplianceMeasurement.state == DRAFT"
          - "the measurement input set is non-empty (otherwise ERR_NO_MEASURABLE_LOANS)"
        side_effects:
          - "measured_loan_count, target_market_loan_count, measured_principal_cents, target_market_principal_cents populated"
          - "dollar_weighted_pct and count_weighted_pct both written by calculations.target_market_lending_percentage; selected_pct := the variant named by weighting_basis"
          - "verdict := PASS when selected_pct >= 60.00 else FAIL"
          - "state := FINALIZED, finalized_at set"
          - "Institution.target_market_lending_pct := selected_pct"
          - "on PASS: Institution.recertification_due_at := period_end + 1095 days, and Institution.certification_state := CERTIFIED when it was RECERT_DUE"
          - "on FAIL while Institution.certification_state == RECERT_DUE: Institution.certification_state := DECERTIFIED"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /cdfi/compliance-measurements/{measurement_id}/void"
        actor: ComplianceAnalyst
        preconditions:
          - "ComplianceMeasurement.state == DRAFT"
        side_effects:
          - "state := VOIDED, void_reason recorded"
          - "the period is released: the row leaves the overlap candidate set so an overlapping period may now be created"

  - entity: AwardApplication
    initial_state: DRAFT
    terminal_states: [REJECTED]
    note: "Posture-driven loop: DISBURSING -> DRAW_SUSPENDED -> DISBURSING."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cdfi/award-applications/{award_id}/submit"
        actor: InstitutionOfficer
        preconditions:
          - "AwardApplication.state == DRAFT"
          - "Institution.certification_state == CERTIFIED"
          - "at least one MatchingFundCommitment exists for this award"
        side_effects:
          - "state := SUBMITTED"
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /cdfi/award-applications/{award_id}/decide with decision AWARD"
        actor: AwardAdministrator
        preconditions:
          - "AwardApplication.state == SUBMITTED"
        side_effects:
          - "state := AWARDED, awarded_amount_cents := supplied value or requested_amount_cents, decided_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /cdfi/award-applications/{award_id}/decide with decision REJECT"
        actor: AwardAdministrator
        preconditions:
          - "AwardApplication.state == SUBMITTED"
        side_effects:
          - "state := REJECTED, awarded_amount_cents := null, decided_by_user_id := X-User-ID"
      - from: AWARDED
        to: DISBURSING
        trigger: "POST /cdfi/award-applications/{award_id}/activate-disbursing"
        actor: AwardAdministrator
        preconditions:
          - "AwardApplication.state == AWARDED"
          - "no MatchingFundCommitment of this award has status in {PLEDGED, HELD}"
          - "match_shortfall_cents == 0"
          - "Institution.compliance_posture in {COMPLIANT, WATCH}"
        side_effects:
          - "state := DISBURSING, suspension_reason := null"
      - from: DISBURSING
        to: DRAW_SUSPENDED
        trigger: "system, cascade from any reserve recompute that sets Institution.compliance_posture to PROBATION"
        actor: system
        preconditions:
          - "AwardApplication.state == DISBURSING"
          - "Institution.compliance_posture became PROBATION"
        side_effects:
          - "state := DRAW_SUSPENDED, suspension_reason := 'POSTURE_PROBATION'"
          - "every MatchingFundCommitment of this award with status == PLEDGED transitions to HELD"
      - from: DRAW_SUSPENDED
        to: DISBURSING
        trigger: "POST /cdfi/award-applications/{award_id}/resume-draws"
        actor: AwardAdministrator
        preconditions:
          - "AwardApplication.state == DRAW_SUSPENDED"
          - "Institution.compliance_posture == COMPLIANT"
        side_effects:
          - "state := DISBURSING, suspension_reason := null"
          - "every MatchingFundCommitment of this award with status == HELD returns to PLEDGED"

  - entity: MatchingFundCommitment
    initial_state: PLEDGED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PLEDGED
        to: VERIFIED
        trigger: "POST /cdfi/matching-fund-commitments/{commitment_id}/verify"
        actor: AwardAdministrator
        preconditions:
          - "MatchingFundCommitment.status == PLEDGED"
          - "source_type != FEDERAL"
          - "X-User-ID != AwardApplication.decided_by_user_id"
        side_effects:
          - "eligible_cents := round_half_up(amount_cents * factor(source_type)) per calculations.award_eligible_match_total"
          - "status := VERIFIED, verified_by_user_id := X-User-ID"
          - "AwardApplication.match_eligible_cents and match_shortfall_cents recomputed"
      - from: VERIFIED
        to: WITHDRAWN
        trigger: "POST /cdfi/matching-fund-commitments/{commitment_id}/withdraw"
        actor: InstitutionOfficer
        preconditions:
          - "MatchingFundCommitment.status in {PLEDGED, VERIFIED}"
        side_effects:
          - "status := WITHDRAWN, withdraw_reason recorded, eligible_cents := 0"
          - "AwardApplication.match_eligible_cents and match_shortfall_cents recomputed (exact compensation of the verification)"
      - from: PLEDGED
        to: WITHDRAWN
        trigger: "POST /cdfi/matching-fund-commitments/{commitment_id}/withdraw"
        actor: InstitutionOfficer
        preconditions:
          - "MatchingFundCommitment.status == PLEDGED"
        side_effects:
          - "status := WITHDRAWN, withdraw_reason recorded"
          - "AwardApplication.match_eligible_cents unchanged, because an unverified pledge never entered the ledger"
      - from: PLEDGED
        to: HELD
        trigger: "system, cascade from an award entering DRAW_SUSPENDED"
        actor: system
        preconditions:
          - "the owning AwardApplication transitioned to DRAW_SUSPENDED"
          - "MatchingFundCommitment.status == PLEDGED"
        side_effects:
          - "status := HELD"
      - from: HELD
        to: PLEDGED
        trigger: "POST /cdfi/award-applications/{award_id}/resume-draws"
        actor: AwardAdministrator
        preconditions:
          - "the owning AwardApplication transitioned from DRAW_SUSPENDED to DISBURSING"
        side_effects:
          - "status := PLEDGED"

concurrency_rules:
  - rule_id: application-create-stale-institution
    parent_entity: Institution
    write_endpoint: "POST /cdfi/institutions/{institution_id}/certification-applications"
    occ_field: "expected_institution_version"
    description: |
      A CertificationApplication snapshots Institution.accountability_score at
      creation. Creating an application against an Institution whose version has
      advanced since the client last read it is rejected, because the snapshot
      would be taken from a view the client never observed - a target market has
      since been approved, or a board seat has been added or resigned, either of
      which moves accountability_score. The new application legitimately supersedes
      any prior DENIED application, so the operation is otherwise valid and only the
      stale version distinguishes it.
    error_id: ERR_STALE_INSTITUTION_VERSION
    http_status: 412

  - rule_id: impact-report-supersede-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /cdfi/loans/{loan_id}/impact-reports"
    occ_field: "expected_loan_version"
    description: |
      A new ImpactReport legitimately supersedes the loan's prior report and, when
      that prior report was VERIFIED, removes its counts from the Institution's
      impact totals. Creating a report against a Loan whose version has advanced
      since the client last read it is rejected: the client's view of which report
      is current, and of the loan's servicing position, is stale.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

calculations:
  - name: accountability_representation_score
    trigger: "on POST /cdfi/institutions/{institution_id}/board-seats, on POST /cdfi/board-seats/{board_seat_id}/resign, and on POST /cdfi/target-markets/{target_market_id}/approve - each of those transitions lists 'Institution.accountability_score ... recomputed' in its side_effects"
    algorithm: weighted_scoring
    formula: |
      # Candidate set: BoardSeat rows of this Institution with status == ACTIVE.
      # A seat only counts as representing when represents_target_market == true
      # AND its target_market_id points at a TargetMarket with state == APPROVED.
      governing_total       = count(seats where structure == GOVERNING_BOARD)
      governing_representing= count(seats where structure == GOVERNING_BOARD
                                     and represents_target_market == true
                                     and referenced TargetMarket.state == APPROVED)
      advisory_total        = count(seats where structure == ADVISORY_BOARD)
      advisory_representing = count(seats where structure == ADVISORY_BOARD
                                     and represents_target_market == true
                                     and referenced TargetMarket.state == APPROVED)

      # Step 1 - governing share, with an explicit empty-board branch.
      if governing_total == 0:
          governing_pct = 0
      else:
          governing_pct = governing_representing / governing_total      # exact rational

      # Step 2 - advisory partial credit: half weight, capped at 0.2000 of the
      # combined seat count. Nested min over a ratio whose denominator spans BOTH
      # structures, so adding a non-representing advisory seat can LOWER the credit.
      if governing_total + advisory_total == 0:
          advisory_credit = 0
      else:
          advisory_credit = min(0.2000,
                                0.5 * advisory_representing / (governing_total + advisory_total))

      # Step 3 - single rounding at the end, ceiling at 1.0000.
      accountability_score     = round_half_up(min(1.0000, governing_pct + advisory_credit), 4)
      accountability_satisfied = accountability_score >= 0.5000
    input_set: "BoardSeat rows with status == ACTIVE only; RESIGNED seats leave both the numerator and the denominator. A seat whose target_market_id references a DRAFT TargetMarket is counted in the totals but NOT in the representing counts."
    constants:
      ADVISORY_WEIGHT: 0.5
      ADVISORY_CREDIT_CAP: 0.2000
      SATISFACTION_THRESHOLD: 0.5000
      SCORE_PRECISION: 4
    precision: "4 decimal places, round_half_up, applied once to the final sum (never to the intermediate ratios)"

  - name: target_market_attribution
    trigger: "on POST /cdfi/borrowers/{borrower_id}/geocode (every outcome); the transition side_effects list 'in_target_market and matched_target_market_type recomputed'"
    algorithm: constraint_propagation
    formula: |
      income_pct_ami = round_half_up(100 * household_income_cents / area_median_income_cents, 2)

      if geocode_state != GEOCODED:
          in_target_market = false ; matched_target_market_type = null ; stop

      # Eligibility filter: TargetMarket rows of the SAME institution with state == APPROVED.
      # Ranking: market_type precedence INVESTMENT_AREA(1) >
      #          LOW_INCOME_TARGETED_POPULATION(2) > OTHER_TARGETED_POPULATION(3);
      # tie-break within one market_type: created_at ASC.
      # First candidate whose predicate holds wins; empty candidate set is not an error.
      predicate(INVESTMENT_AREA)               = Borrower.census_tract_code in census_tract_codes
      predicate(LOW_INCOME_TARGETED_POPULATION)= income_pct_ami <= ami_threshold_pct
      predicate(OTHER_TARGETED_POPULATION)     = Borrower.credit_score is null

      in_target_market            = a winner exists
      matched_target_market_type  = winner.market_type, else null
    input_set: "TargetMarket rows of the borrower's Institution with state == APPROVED. DRAFT markets never match."
    constants:
      MARKET_TYPE_PRECEDENCE: "INVESTMENT_AREA=1, LOW_INCOME_TARGETED_POPULATION=2, OTHER_TARGETED_POPULATION=3"
    precision: "income_pct_ami 2 decimal places, round_half_up; the LOW_INCOME comparison uses the ROUNDED income_pct_ami, so 80.004 becomes 80.00 and satisfies a threshold of 80.00"

  - name: loan_pricing_and_grade
    trigger: "on POST /cdfi/loans/{loan_id}/underwrite; the SCREENING -> UNDERWRITING transition lists provisional_monthly_payment_cents, dti_pct, risk_grade, risk_spread_bps, ta_discount_bps, final_rate_bps and monthly_payment_cents in its side_effects"
    algorithm: constraint_propagation
    formula: |
      # This chain LOOKS circular: final_rate_bps depends on risk_spread_bps, which
      # depends on risk_grade, which depends on dti_pct, which depends on the monthly
      # payment, which depends on the rate. The evaluation order below is PINNED and
      # is NOT iterated to a fixed point. dti_pct is computed once, from the
      # PROVISIONAL payment, and is never recomputed from final_rate_bps.
      P = Loan.requested_principal_cents
      N = LoanProduct.term_months

      # STEP 1 - provisional payment at the base rate (simple declining method:
      #          one month of simple interest on the full principal, plus straight-line
      #          principal). Single rounding at the end of the step.
      provisional_monthly_payment_cents =
          round_half_up( P * (LoanProduct.base_rate_bps / 10000) / 12 + P / N )

      # STEP 2 - DTI from the PROVISIONAL payment. FROZEN after this step.
      dti_pct = round_half_up( 100 * (existing_monthly_debt_cents
                                      + provisional_monthly_payment_cents)
                               / verified_monthly_income_cents , 2 )

      # STEP 3 - tier selection; first matching row wins, evaluated top to bottom.
      #   A: credit_score is not null and credit_score >= 720 and dti_pct <= 36.00
      #   B: credit_score is not null and credit_score >= 660 and dti_pct <= 43.00
      #   C: credit_score is not null and credit_score >= 600 and dti_pct <= 45.00
      #   D: credit_score is not null and credit_score >= LoanProduct.min_credit_score
      #      and dti_pct <= 50.00
      #   E: credit_score is null and LoanProduct.allow_no_credit_score == true
      #      and Borrower.ta_hours_total >= 12.00 and dti_pct <= 45.00
      #   no row matches -> reject with ERR_UNDERWRITING_TIER_UNMET
      # Additional gate applied BEFORE tiering: dti_pct <= LoanProduct.max_dti_pct,
      # otherwise ERR_UNDERWRITING_TIER_UNMET.
      risk_grade = first matching tier

      # STEP 4 - spread implied by the grade.
      risk_spread_bps = {A: 0, B: 75, C: 150, D: 275, E: 200}[risk_grade]

      # STEP 5 - technical-assistance discount, a step function on hours already
      #          delivered at underwriting time.
      ta_discount_bps = 25 if Borrower.ta_hours_total >= 8.00 else 0

      # STEP 6 - contractual rate.
      final_rate_bps = LoanProduct.base_rate_bps + risk_spread_bps - ta_discount_bps

      # STEP 7 - payment recomputed at the contractual rate. dti_pct is NOT touched.
      monthly_payment_cents =
          round_half_up( P * (final_rate_bps / 10000) / 12 + P / N )
    input_set: "The Loan under underwriting, its LoanProduct, and the Borrower's ta_hours_total as of this request. TAEngagement rows in state SCHEDULED or NO_SHOW contribute zero hours."
    constants:
      TIER_A: "score >= 720 and dti <= 36.00 -> spread 0"
      TIER_B: "score >= 660 and dti <= 43.00 -> spread 75"
      TIER_C: "score >= 600 and dti <= 45.00 -> spread 150"
      TIER_D: "score >= product.min_credit_score and dti <= 50.00 -> spread 275"
      TIER_E: "no score, allow_no_credit_score, ta_hours_total >= 12.00, dti <= 45.00 -> spread 200"
      TA_DISCOUNT_BPS: 25
      TA_DISCOUNT_HOURS_THRESHOLD: 8.00
    precision: "payments rounded to whole cents with round_half_up once per step; dti_pct 2 decimal places round_half_up"

  - name: target_market_lending_percentage
    trigger: "on POST /cdfi/compliance-measurements/{measurement_id}/finalize; the DRAFT -> FINALIZED transition lists dollar_weighted_pct, count_weighted_pct and selected_pct in its side_effects"
    algorithm: aggregation
    formula: |
      # Input set (pinned): Loan rows where
      #   Loan.institution_id == measurement.institution_id
      #   AND Loan.first_disbursed_on IS NOT NULL      # ever disbursed; underwriting_state
      #                                                 # may be APPROVED or CLOSED
      #   AND Loan.first_disbursed_on >= period_start
      #   AND Loan.first_disbursed_on <  period_end          # half-open window
      # servicing_state is NOT filtered: PAID_OFF and CHARGED_OFF loans stay in the set.
      # Target-market membership reads ONLY the origination snapshot
      # Loan.borrower_in_target_market_at_origination - never the borrower's current
      # in_target_market value.
      measured_loan_count           = count(input set)
      target_market_loan_count      = count(input set where borrower_in_target_market_at_origination)
      measured_principal_cents      = sum(principal_disbursed_cents over input set)
      target_market_principal_cents = sum(principal_disbursed_cents over input set
                                          where borrower_in_target_market_at_origination)

      if measured_loan_count == 0: reject with ERR_NO_MEASURABLE_LOANS

      dollar_weighted_pct = round_half_up(100 * target_market_principal_cents
                                          / measured_principal_cents, 2)
      count_weighted_pct  = round_half_up(100 * target_market_loan_count
                                          / measured_loan_count, 2)
      selected_pct = dollar_weighted_pct if weighting_basis == DOLLAR_WEIGHTED
                     else count_weighted_pct
      verdict = PASS if selected_pct >= 60.00 else FAIL      # inclusive at exactly 60.00
    input_set: "See the pinned filter in formula. Loans that were never disbursed (first_disbursed_on null - i.e. still SCREENING, UNDERWRITING, DECLINED, or APPROVED but undrawn) are excluded; a disbursed loan stays in the set whether it is still APPROVED/CURRENT, PAID_OFF or CHARGED_OFF."
    constants:
      TARGET_MARKET_THRESHOLD_PCT: 60.00
      RECERTIFICATION_INTERVAL_DAYS: 1095
    precision: "2 decimal places, round_half_up; the threshold comparison uses the ROUNDED percentage"
    variants:
      - name: DOLLAR_WEIGHTED
        when: "measurement.weighting_basis == DOLLAR_WEIGHTED"
        difference: "Weights each loan by principal_disbursed_cents, so one large non-target-market loan can sink the percentage even when most loans are in the target market."
      - name: COUNT_WEIGHTED
        when: "measurement.weighting_basis == COUNT_WEIGHTED"
        difference: "Weights every loan equally, so many small target-market loans outvote a single large non-target-market loan. For a portfolio of one 6,000,000-cent target-market loan and one 4,000,000-cent non-target-market loan the two variants return 60.00 and 50.00 respectively - PASS versus FAIL on identical data."

  - name: portfolio_loss_reserve
    trigger: "on POST /cdfi/loans/{loan_id}/disbursements, POST /cdfi/loans/{loan_id}/payments, POST /cdfi/institutions/{institution_id}/servicing-runs and POST /cdfi/loans/{loan_id}/charge-off; each of those transitions lists 'loss_reserve_required_* recomputed' in its side_effects"
    algorithm: weighted_scoring
    formula: |
      # VARIANT 1 - MIGRATION_ANALYSIS: roll rates applied to CURRENT outstanding.
      # Rounding order is PINNED: multiply per loan exactly, sum the exact products,
      # and round ONCE at the end.
      roll_rate = {CURRENT: 0.0200, DELINQUENT_30: 0.1000,
                   DELINQUENT_60: 0.3500, DELINQUENT_90: 0.7500}
      loss_reserve_required_migration_cents = round_half_up(
          sum over Loans of this Institution with servicing_state in
              {CURRENT, DELINQUENT_30, DELINQUENT_60, DELINQUENT_90}
          of ( principal_outstanding_cents * roll_rate[servicing_state] ) )
      # NOT_DISBURSED, PAID_OFF and CHARGED_OFF loans contribute 0.

      # VARIANT 2 - STATIC_POOL: vintage cumulative loss rates applied to ORIGINAL
      # disbursed principal, including loans that are already PAID_OFF or CHARGED_OFF.
      vintage_rate(loan) = 0.0450 if loan.vintage_year == calendar year of the current
                                     logical clock
                           else 0.0300
      loss_reserve_required_static_cents = round_half_up(
          sum over Loans of this Institution with principal_disbursed_cents > 0
          of ( principal_disbursed_cents * vintage_rate(loan) ) )

      loss_reserve_required_cents = loss_reserve_required_migration_cents
                                    if Institution.reserve_method == MIGRATION_ANALYSIS
                                    else loss_reserve_required_static_cents
    input_set: "MIGRATION_ANALYSIS reads only loans currently carrying a balance in one of the four live buckets. STATIC_POOL reads every loan that was ever disbursed, so charge-offs never leave its base."
    constants:
      ROLL_RATE_CURRENT: 0.0200
      ROLL_RATE_DELINQUENT_30: 0.1000
      ROLL_RATE_DELINQUENT_60: 0.3500
      ROLL_RATE_DELINQUENT_90: 0.7500
      VINTAGE_RATE_CURRENT_YEAR: 0.0450
      VINTAGE_RATE_PRIOR_YEAR: 0.0300
    precision: "whole cents, round_half_up, applied once to the summed exact products (explicitly NOT per loan)"
    variants:
      - name: MIGRATION_ANALYSIS
        when: "Institution.reserve_method == MIGRATION_ANALYSIS"
        difference: "Forward-looking on the live book: a charge-off REMOVES the 0.7500 bucket contribution, so the required reserve falls sharply after the write-off."
      - name: STATIC_POOL
        when: "Institution.reserve_method == STATIC_POOL"
        difference: "Vintage-cohort based on original principal: a charge-off leaves the required reserve completely unchanged. For a book of a 1,000,000-cent CURRENT loan and a 2,000,000-cent DELINQUENT_90 loan, both first disbursed in the clock's calendar year, the variants return 1,520,000 and 135,000 cents on identical data."

  - name: reserve_coverage_and_posture
    trigger: "immediately after every calculations.portfolio_loss_reserve run, i.e. on POST /cdfi/loans/{loan_id}/disbursements, POST /cdfi/loans/{loan_id}/payments, POST /cdfi/institutions/{institution_id}/servicing-runs and POST /cdfi/loans/{loan_id}/charge-off; each of those transitions lists 'reserve_coverage_ratio ... compliance_posture re-derived' in its side_effects"
    algorithm: threshold
    formula: |
      # Empty-portfolio edge is PINNED, not a division by zero and not 0.0000.
      if loss_reserve_required_cents == 0:
          reserve_coverage_ratio = 1.0000
      else:
          reserve_coverage_ratio = round_half_up(loss_reserve_balance_cents
                                                / loss_reserve_required_cents, 4)

      # Boundaries are inclusive on the LOWER bound of each band.
      if   reserve_coverage_ratio >= 1.0000: compliance_posture = COMPLIANT
      elif reserve_coverage_ratio >= 0.8000: compliance_posture = WATCH
      else:                                  compliance_posture = PROBATION

      # Charge-off absorption, applied BEFORE the ratio is recomputed:
      #   loss_reserve_balance_cents := max(0, balance - charged_off_principal_cents)
      #   reserve_deficit_cents      := max(0, charged_off_principal_cents - balance_before)
    input_set: "Institution.loss_reserve_balance_cents and the loss_reserve_required_cents produced by the variant named in reserve_method."
    constants:
      POSTURE_COMPLIANT_MIN_RATIO: 1.0000
      POSTURE_WATCH_MIN_RATIO: 0.8000
      EMPTY_PORTFOLIO_RATIO: 1.0000
    precision: "ratio 4 decimal places, round_half_up; band comparisons use the ROUNDED ratio, so 0.79996 becomes 0.8000 and lands in WATCH, not PROBATION"

  - name: award_eligible_match_total
    trigger: "on POST /cdfi/matching-fund-commitments/{commitment_id}/verify and on POST /cdfi/matching-fund-commitments/{commitment_id}/withdraw; both transitions list 'AwardApplication.match_eligible_cents and match_shortfall_cents recomputed' in their side_effects. required_match_cents is written on POST /cdfi/institutions/{institution_id}/award-applications."
    algorithm: waterfall_allocation
    formula: |
      factor = {CASH_PRIVATE: 1.00, CASH_PUBLIC_NON_FEDERAL: 1.00,
                IN_KIND: 0.50, DEFERRED_PLEDGE: 0.75, FEDERAL: 0.00}

      # ROUNDING ORDER IS PINNED: round EACH commitment to whole cents FIRST, then sum.
      # The alternative order (sum the exact products, round once) is explicitly WRONG
      # here and can differ by whole cents.
      per_commitment_eligible_cents = round_half_up(amount_cents * factor[source_type])
      match_eligible_cents = sum(per_commitment_eligible_cents over commitments of this
                                 award with status == VERIFIED)

      required_match_cents  = round_half_up(requested_amount_cents * match_ratio_pct / 100)
      match_shortfall_cents = max(0, required_match_cents - match_eligible_cents)
    input_set: "MatchingFundCommitment rows of the award with status == VERIFIED only. PLEDGED, HELD and WITHDRAWN rows contribute 0."
    constants:
      FACTOR_CASH_PRIVATE: 1.00
      FACTOR_CASH_PUBLIC_NON_FEDERAL: 1.00
      FACTOR_IN_KIND: 0.50
      FACTOR_DEFERRED_PLEDGE: 0.75
      FACTOR_FEDERAL: 0.00
    precision: |
      Whole cents, round_half_up, applied PER COMMITMENT and then summed. Worked
      example proving the order matters: pledges of 20,000,001 CASH_PRIVATE,
      15,000,001 IN_KIND, 10,000,001 DEFERRED_PLEDGE and 30,000,003 IN_KIND round to
      20,000,001 + 7,500,001 + 7,500,001 + 15,000,002 = 50,000,005 cents. Summing the
      exact products first gives 50,000,003.75, which rounds to 50,000,004 - one cent
      short of a 50,000,005-cent requirement.

  - name: institution_impact_aggregation
    trigger: "on POST /cdfi/impact-reports/{impact_report_id}/verify, POST /cdfi/impact-reports/{impact_report_id}/dispute and POST /cdfi/loans/{loan_id}/impact-reports (supersede path); each of those transitions lists the four Institution counters in its side_effects"
    algorithm: aggregation
    formula: |
      # Maintained incrementally, but the invariant below is the definition and MUST
      # hold after every request:
      #   Institution.jobs_created_total        == sum(jobs_created)
      #   Institution.jobs_retained_total       == sum(jobs_retained)
      #   Institution.housing_units_total       == sum(housing_units)
      #   Institution.businesses_financed_total == sum(businesses_financed)
      # taken over ImpactReport rows R where R.state == VERIFIED and
      # R.loan_id belongs to a Loan of this Institution.
      #
      # Verify adds the four values; dispute-from-VERIFIED subtracts exactly the same
      # four values; supersede-of-a-VERIFIED-row subtracts them as well. No other
      # transition touches the counters.
      goal_attainment_pct = round_half_up(
          100 * (Institution.jobs_created_total + Institution.housing_units_total)
          / max(1, performance_goal_jobs + performance_goal_housing_units), 2)
    input_set: "ImpactReport rows with state == VERIFIED. SUBMITTED, DISPUTED and SUPERSEDED rows are excluded, which is what makes verify and dispute exact inverses."
    constants:
      GOAL_DENOMINATOR_FLOOR: 1
    precision: "counters are exact integers; goal_attainment_pct 2 decimal places, round_half_up"

  - name: delinquency_bucket_assignment
    trigger: "on POST /cdfi/institutions/{institution_id}/servicing-runs; the CURRENT/DELINQUENT_* transitions list 'days_past_due stored, servicing_state := ...' in their side_effects"
    algorithm: threshold
    formula: |
      # Processing order across the institution's loans is PINNED as Loan.created_at ASC
      # so that the reserve recompute at the end of the run is order-independent and
      # reproducible. Loans with servicing_state in {NOT_DISBURSED, CHARGED_OFF,
      # PAID_OFF} are skipped.
      days_past_due = max(0, whole days from next_payment_due_on to the current
                             logical clock, truncated toward zero)
      if   days_past_due >= 90: servicing_state = DELINQUENT_90
      elif days_past_due >= 60: servicing_state = DELINQUENT_60
      elif days_past_due >= 30: servicing_state = DELINQUENT_30
      else:                     servicing_state unchanged
      # Buckets may be skipped in one run; the assignment never moves a loan to a
      # LOWER bucket - only a payment can do that.
      # A run also evaluates Institution.certification_state CERTIFIED -> RECERT_DUE
      # when the clock has reached recertification_due_at, and finishes by re-running
      # calculations.portfolio_loss_reserve and calculations.reserve_coverage_and_posture.
    input_set: "Loans of the institution with servicing_state in {CURRENT, DELINQUENT_30, DELINQUENT_60}, processed in Loan.created_at ASC order."
    constants:
      BUCKET_30_DAYS: 30
      BUCKET_60_DAYS: 60
      BUCKET_90_DAYS: 90
      PAYMENT_PERIOD_DAYS: 30
    precision: "days_past_due is a whole-day integer; exactly 30 days past due lands in DELINQUENT_30, 29 days leaves the loan CURRENT"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 10
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 12
    category: auth
    check: "POST /cdfi/institutions is exempt because the institution does not exist yet; otherwise, when the acting role is InstitutionOfficer, X-User-ID equals the institution_id that owns the addressed resource (the path institution, or the owning institution of the addressed target market, board seat, borrower, loan, engagement, impact report, measurement, award or commitment)"
    error_id: ERR_INSTITUTION_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles include InstitutionOfficer"
  - priority: 13
    category: auth
    check: "when the acting role is Borrower, X-User-ID equals Loan.borrower_id for POST /cdfi/loans/{loan_id}/impact-reports and ImpactReport.borrower_id for POST /cdfi/impact-reports/{impact_report_id}/resubmit"
    error_id: ERR_BORROWER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /cdfi/loans/{loan_id}/impact-reports, POST /cdfi/impact-reports/{impact_report_id}/resubmit"
  - priority: 14
    category: auth
    check: "X-User-ID != Loan.underwritten_by_user_id (the member who underwrote a loan may not decide it)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cdfi/loans/{loan_id}/decision"
  - priority: 15
    category: auth
    check: "X-User-ID != CertificationApplication.reviewed_by_user_id (the reviewer who opened review may not sign the decision)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cdfi/certification-applications/{application_id}/decide"
  - priority: 16
    category: auth
    check: "X-User-ID != AwardApplication.decided_by_user_id (the administrator who obligated the award may not verify its matching funds)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cdfi/matching-fund-commitments/{commitment_id}/verify"
  - priority: 20
    category: existence
    check: "path or body institution_id resolves to an Institution"
    error_id: ERR_INSTITUTION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying institution_id"
  - priority: 21
    category: existence
    check: "path application_id resolves to a CertificationApplication"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "all /certification-applications/{application_id} endpoints"
  - priority: 22
    category: existence
    check: "path or body target_market_id resolves to a TargetMarket owned by the same Institution"
    error_id: ERR_TARGET_MARKET_NOT_FOUND
    http_status: 404
    applies_to: "all /target-markets/{target_market_id} endpoints, POST /cdfi/institutions/{institution_id}/board-seats"
  - priority: 23
    category: existence
    check: "path board_seat_id resolves to a BoardSeat"
    error_id: ERR_BOARD_SEAT_NOT_FOUND
    http_status: 404
    applies_to: "GET /cdfi/board-seats/{board_seat_id}, POST /cdfi/board-seats/{board_seat_id}/resign"
  - priority: 24
    category: existence
    check: "path or body borrower_id resolves to a Borrower owned by the same Institution"
    error_id: ERR_BORROWER_NOT_FOUND
    http_status: 404
    applies_to: "all /borrowers/{borrower_id} endpoints, POST /cdfi/loans, POST /cdfi/institutions/{institution_id}/ta-engagements"
  - priority: 25
    category: existence
    check: "body product_id resolves to a LoanProduct owned by the same Institution, and path product_id resolves to a LoanProduct"
    error_id: ERR_LOAN_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "POST /cdfi/loans, GET /cdfi/loan-products/{product_id}"
  - priority: 26
    category: existence
    check: "path loan_id, and body refinance_of_loan_id when supplied, resolve to Loans"
    error_id: ERR_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "all /loans/{loan_id} endpoints, POST /cdfi/loans, POST /cdfi/institutions/{institution_id}/ta-engagements"
  - priority: 27
    category: existence
    check: "path engagement_id resolves to a TAEngagement"
    error_id: ERR_TA_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /cdfi/ta-engagements/{engagement_id}, POST /cdfi/ta-engagements/{engagement_id}/close"
  - priority: 28
    category: existence
    check: "path impact_report_id resolves to an ImpactReport"
    error_id: ERR_IMPACT_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "all /impact-reports/{impact_report_id} endpoints"
  - priority: 29
    category: existence
    check: "path measurement_id resolves to a ComplianceMeasurement"
    error_id: ERR_MEASUREMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /compliance-measurements/{measurement_id} endpoints"
  - priority: 30
    category: existence
    check: "path award_id resolves to an AwardApplication"
    error_id: ERR_AWARD_NOT_FOUND
    http_status: 404
    applies_to: "all /award-applications/{award_id} endpoints"
  - priority: 31
    category: existence
    check: "path commitment_id resolves to a MatchingFundCommitment"
    error_id: ERR_COMMITMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /matching-fund-commitments/{commitment_id} endpoints"
  - priority: 35
    category: business_constraint
    check: "request body contains every required field with the declared type, enum values are members of the declared set, numeric fields satisfy their declared range, census_tract_codes is non-empty exactly when market_type == INVESTMENT_AREA, ami_threshold_pct is non-null exactly when market_type == LOW_INCOME_TARGETED_POPULATION, target_market_id is non-null exactly when represents_target_market == true, and geocode outcome MATCHED carries a census_tract_code"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 36
    category: business_constraint
    check: "limit is between 1 and 100 and offset is >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 40
    category: state
    check: "expected_institution_version equals the current Institution.version"
    error_id: ERR_STALE_INSTITUTION_VERSION
    http_status: 412
    applies_to: "POST /cdfi/institutions/{institution_id}/certification-applications"
  - priority: 41
    category: state
    check: "expected_loan_version equals the current Loan.version"
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    applies_to: "POST /cdfi/loans/{loan_id}/impact-reports"
  - priority: 50
    category: state
    check: "the requested transition is declared for the resource's current state in the §1.2 table"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-changing endpoints without a more specific state error"
  - priority: 51
    category: state
    check: "CertificationApplication.state == UNDER_REVIEW"
    error_id: ERR_APPLICATION_NOT_UNDER_REVIEW
    http_status: 409
    applies_to: "POST /cdfi/certification-applications/{application_id}/evaluate-test, POST /cdfi/certification-applications/{application_id}/request-info, POST /cdfi/certification-applications/{application_id}/decide"
  - priority: 52
    category: state
    check: "Loan.underwriting_state == UNDERWRITING"
    error_id: ERR_LOAN_NOT_IN_UNDERWRITING
    http_status: 409
    applies_to: "POST /cdfi/loans/{loan_id}/decision"
  - priority: 53
    category: state
    check: "Loan.servicing_state == DELINQUENT_90"
    error_id: ERR_LOAN_NOT_DELINQUENT_90
    http_status: 409
    applies_to: "POST /cdfi/loans/{loan_id}/charge-off"
  - priority: 54
    category: state
    check: "ComplianceMeasurement.state == DRAFT"
    error_id: ERR_MEASUREMENT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /cdfi/compliance-measurements/{measurement_id}/finalize, POST /cdfi/compliance-measurements/{measurement_id}/void"
  - priority: 55
    category: state
    check: "AwardApplication.state == AWARDED"
    error_id: ERR_AWARD_NOT_AWARDED
    http_status: 409
    applies_to: "POST /cdfi/award-applications/{award_id}/activate-disbursing"
  - priority: 56
    category: state
    check: "MatchingFundCommitment.status == PLEDGED"
    error_id: ERR_COMMITMENT_NOT_PLEDGED
    http_status: 409
    applies_to: "POST /cdfi/matching-fund-commitments/{commitment_id}/verify"
  - priority: 57
    category: state
    check: "TAEngagement.state == SCHEDULED"
    error_id: ERR_ENGAGEMENT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /cdfi/ta-engagements/{engagement_id}/close"
  - priority: 58
    category: state
    check: "ImpactReport.state == DISPUTED"
    error_id: ERR_REPORT_NOT_DISPUTED
    http_status: 409
    applies_to: "POST /cdfi/impact-reports/{impact_report_id}/resubmit"
  - priority: 60
    category: business_safety
    check: "when LoanProduct.requires_ta_completion is true, a TAEngagement exists for Loan.borrower_id with state == COMPLETED and competency_verified == true"
    error_id: ERR_TA_PREREQUISITE_UNMET
    http_status: 409
    applies_to: "POST /cdfi/loans/{loan_id}/decision with decision APPROVE"
  - priority: 61
    category: business_safety
    check: "dti_pct <= LoanProduct.max_dti_pct and calculations.loan_pricing_and_grade resolves one of the tiers A-E"
    error_id: ERR_UNDERWRITING_TIER_UNMET
    http_status: 422
    applies_to: "POST /cdfi/loans/{loan_id}/underwrite"
  - priority: 62
    category: business_safety
    check: "Institution.compliance_posture == COMPLIANT for resume-draws, and in {COMPLIANT, WATCH} for activate-disbursing"
    error_id: ERR_POSTURE_NOT_COMPLIANT
    http_status: 409
    applies_to: "POST /cdfi/award-applications/{award_id}/resume-draws, POST /cdfi/award-applications/{award_id}/activate-disbursing"
  - priority: 63
    category: business_safety
    check: "Institution.certification_state == CERTIFIED"
    error_id: ERR_INSTITUTION_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /cdfi/award-applications/{award_id}/submit"
  - priority: 64
    category: business_referential
    check: "the Institution has at least one TargetMarket with state == APPROVED (required to submit an application, and required when evaluating the TARGET_MARKET test)"
    error_id: ERR_TARGET_MARKET_NOT_APPROVED
    http_status: 422
    applies_to: "POST /cdfi/certification-applications/{application_id}/submit, POST /cdfi/certification-applications/{application_id}/evaluate-test"
  - priority: 65
    category: business_referential
    check: "Institution.accountability_satisfied == true"
    error_id: ERR_ACCOUNTABILITY_NOT_SATISFIED
    http_status: 422
    applies_to: "POST /cdfi/certification-applications/{application_id}/submit, POST /cdfi/certification-applications/{application_id}/evaluate-test with test_code ACCOUNTABILITY"
  - priority: 66
    category: business_referential
    check: "Borrower.geocode_state == GEOCODED"
    error_id: ERR_BORROWER_NOT_GEOCODED
    http_status: 422
    applies_to: "POST /cdfi/loans/{loan_id}/underwrite"
  - priority: 67
    category: business_referential
    check: "no test_*_state on the application is still PENDING"
    error_id: ERR_TEST_VERDICT_PENDING
    http_status: 422
    applies_to: "POST /cdfi/certification-applications/{application_id}/decide"
  - priority: 68
    category: business_referential
    check: "no MatchingFundCommitment of the award has status in {PLEDGED, HELD}"
    error_id: ERR_MATCH_COMMITMENTS_UNVERIFIED
    http_status: 409
    applies_to: "POST /cdfi/award-applications/{award_id}/activate-disbursing"
  - priority: 69
    category: business_referential
    check: "the award has at least one MatchingFundCommitment"
    error_id: ERR_NO_MATCH_COMMITMENTS
    http_status: 422
    applies_to: "POST /cdfi/award-applications/{award_id}/submit"
  - priority: 70
    category: business_constraint
    check: "ein is not already used by another Institution"
    error_id: ERR_DUPLICATE_EIN
    http_status: 409
    applies_to: "POST /cdfi/institutions"
  - priority: 71
    category: business_constraint
    check: "the half-open window [period_start, period_end) does not intersect the window of any ComplianceMeasurement of the same Institution AND the same weighting_basis with state in {DRAFT, FINALIZED}; adjacency (new.period_start == existing.period_end) is permitted, and a window that duplicates an existing one under the OTHER weighting_basis is permitted because each basis forms its own measurement series"
    error_id: ERR_MEASUREMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /cdfi/institutions/{institution_id}/compliance-measurements"
  - priority: 72
    category: business_constraint
    check: "the closed interval [scheduled_start_at, scheduled_end_at] padded by a 30-minute buffer on both sides does not intersect any TAEngagement of the SAME borrower_id with state in {SCHEDULED, COMPLETED}; formally rejected when new.scheduled_start_at <= existing.scheduled_end_at + 30 minutes AND existing.scheduled_start_at <= new.scheduled_end_at + 30 minutes"
    error_id: ERR_TA_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /cdfi/institutions/{institution_id}/ta-engagements"
  - priority: 73
    category: business_constraint
    check: "the measurement input set defined by calculations.target_market_lending_percentage contains at least one Loan"
    error_id: ERR_NO_MEASURABLE_LOANS
    http_status: 422
    applies_to: "POST /cdfi/compliance-measurements/{measurement_id}/finalize"
  - priority: 74
    category: business_constraint
    check: "financing_activity_pct_claimed >= 60.00"
    error_id: ERR_FINANCING_ACTIVITY_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /cdfi/certification-applications/{application_id}/submit"
  - priority: 75
    category: business_temporal
    check: "period_end is strictly after period_start, and scheduled_end_at is strictly after scheduled_start_at"
    error_id: ERR_PERIOD_BOUNDS_INVALID
    http_status: 422
    applies_to: "POST /cdfi/institutions/{institution_id}/compliance-measurements, POST /cdfi/institutions/{institution_id}/award-applications, POST /cdfi/institutions/{institution_id}/ta-engagements"
  - priority: 76
    category: business_temporal
    check: "period_end <= the current logical clock"
    error_id: ERR_PERIOD_END_IN_FUTURE
    http_status: 422
    applies_to: "POST /cdfi/institutions/{institution_id}/compliance-measurements"
  - priority: 80
    category: business_fiscal
    check: "LoanProduct.committed_principal_cents + approved_principal_cents <= LoanProduct.product_cap_cents"
    error_id: ERR_PRODUCT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /cdfi/loans/{loan_id}/decision with decision APPROVE"
  - priority: 81
    category: business_fiscal
    check: "principal_disbursed_cents + amount_cents <= approved_principal_cents"
    error_id: ERR_DISBURSEMENT_EXCEEDS_APPROVED
    http_status: 422
    applies_to: "POST /cdfi/loans/{loan_id}/disbursements"
  - priority: 82
    category: business_fiscal
    check: "amount_cents <= principal_outstanding_cents"
    error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /cdfi/loans/{loan_id}/payments"
  - priority: 83
    category: business_fiscal
    check: "match_shortfall_cents == 0"
    error_id: ERR_MATCH_SHORTFALL
    http_status: 422
    applies_to: "POST /cdfi/award-applications/{award_id}/activate-disbursing"
  - priority: 84
    category: business_fiscal
    check: "source_type != FEDERAL"
    error_id: ERR_FEDERAL_SOURCE_INELIGIBLE
    http_status: 422
    applies_to: "POST /cdfi/matching-fund-commitments/{commitment_id}/verify"

endpoints:
  # ---- test-driving surface -------------------------------------------------
  - method: POST
    path: "/cdfi/_clock/set_current_utc"
    description: "Sets the server's logical current UTC instant, used by every date-derived field (first_disbursed_on, next_payment_due_on, days_past_due, decided_at, verified_at, period_end bound checks). Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ComplianceAnalyst, CertificationReviewer, AwardAdministrator, CreditUnderwriter, CreditCommittee, InstitutionOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets the logical clock to to_iso8601; no entity is mutated"]
  # ---- Institution ---------------------------------------------------------
  - method: POST
    path: "/cdfi/institutions"
    description: "Registers a candidate community development lender. certification_state starts UNCERTIFIED, compliance_posture starts COMPLIANT, accountability_score starts 0.0000, reserve_coverage_ratio starts 1.0000."
    roles: [InstitutionOfficer]
    code: 201
    input: [legal_name, ein, entity_type, primary_mission_statement, asset_size_cents, reserve_method, "loss_reserve_balance_cents?"]
    output: Institution
    side_effects: ["creates Institution in certification_state UNCERTIFIED and compliance_posture COMPLIANT", "sets accountability_score 0.0000 and accountability_satisfied false", "sets reserve_coverage_ratio 1.0000 per calculations.reserve_coverage_and_posture empty-portfolio pin"]
  - method: GET
    path: "/cdfi/institutions/{institution_id}"
    description: "Reads one institution, including version (the OCC token for certification-application creation), the two reserve variants, reserve_coverage_ratio, target_market_lending_pct and the four impact counters."
    roles: [InstitutionOfficer, CertificationReviewer, ComplianceAnalyst, AwardAdministrator, CreditUnderwriter, CreditCommittee]
    code: 200
    input: []
    output: Institution
    side_effects: []
  - method: GET
    path: "/cdfi/institutions"
    description: "Lists institutions with pagination, optionally filtered by certification_state or compliance_posture."
    roles: [CertificationReviewer, ComplianceAnalyst, AwardAdministrator]
    code: 200
    input: ["certification_state?", "compliance_posture?", "limit?", "offset?"]
    output: Institution[]
    side_effects: []
  - method: POST
    path: "/cdfi/institutions/{institution_id}/servicing-runs"
    description: "Operations checkpoint. Re-buckets every non-terminal loan by days past due against the logical clock (calculations.delinquency_bucket_assignment, processing order Loan.created_at ASC), then recomputes both loss-reserve variants (calculations.portfolio_loss_reserve), reserve_coverage_ratio and compliance_posture (calculations.reserve_coverage_and_posture) in that order."
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: Institution
    side_effects: ["advances servicing_state of eligible loans through DELINQUENT_30/60/90 per calculations.delinquency_bucket_assignment", "when Institution.certification_state is CERTIFIED and recertification_due_at is not null and the logical clock has reached it, sets certification_state RECERT_DUE", "recomputes Institution.loss_reserve_required_migration_cents and loss_reserve_required_static_cents", "sets loss_reserve_required_cents from the variant named by Institution.reserve_method", "recomputes reserve_coverage_ratio, reserve_deficit_cents and compliance_posture", "increments Institution.version by 1"]
  # ---- TargetMarket --------------------------------------------------------
  - method: POST
    path: "/cdfi/institutions/{institution_id}/target-markets"
    description: "Defines a target market in state DRAFT. census_tract_codes is required exactly when market_type == INVESTMENT_AREA; ami_threshold_pct is required exactly when market_type == LOW_INCOME_TARGETED_POPULATION."
    roles: [InstitutionOfficer]
    code: 201
    input: [market_type, name, "census_tract_codes?", "ami_threshold_pct?"]
    output: TargetMarket
    side_effects: ["creates TargetMarket in state DRAFT"]
  - method: GET
    path: "/cdfi/institutions/{institution_id}/target-markets"
    description: "Lists the institution's target markets (reverse lookup for TargetMarket.institution_id)."
    roles: [InstitutionOfficer, CertificationReviewer, ComplianceAnalyst]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: TargetMarket[]
    side_effects: []
  - method: POST
    path: "/cdfi/target-markets/{target_market_id}/approve"
    description: "Reviewer approves a DRAFT target market, making it eligible to back accountability seats and borrower attribution."
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: TargetMarket
    side_effects: ["sets TargetMarket.state APPROVED and approved_at to the logical clock", "recomputes Institution.accountability_score and accountability_satisfied per calculations.accountability_representation_score", "increments TargetMarket.version by 1"]
  # ---- BoardSeat -----------------------------------------------------------
  - method: POST
    path: "/cdfi/institutions/{institution_id}/board-seats"
    description: "Seats a governing-board or advisory-board member. target_market_id is required exactly when represents_target_market is true, and must name an APPROVED target market of the same institution."
    roles: [InstitutionOfficer]
    code: 201
    input: [structure, holder_name, represents_target_market, "target_market_id?"]
    output: BoardSeat
    side_effects: ["creates BoardSeat with status ACTIVE", "increments Institution.governing_seats_active or advisory_seats_active", "recomputes Institution.accountability_score and accountability_satisfied per calculations.accountability_representation_score", "increments Institution.version by 1"]
  - method: GET
    path: "/cdfi/board-seats/{board_seat_id}"
    description: "Reads one board seat."
    roles: [InstitutionOfficer, CertificationReviewer, ComplianceAnalyst]
    code: 200
    input: []
    output: BoardSeat
    side_effects: []
  - method: GET
    path: "/cdfi/board-seats"
    description: "Filtered list of board seats (reverse lookup for BoardSeat.institution_id and BoardSeat.target_market_id)."
    roles: [InstitutionOfficer, CertificationReviewer, ComplianceAnalyst]
    code: 200
    input: ["institution_id?", "target_market_id?", "structure?", "status?", "limit?", "offset?"]
    output: BoardSeat[]
    side_effects: []
  - method: POST
    path: "/cdfi/board-seats/{board_seat_id}/resign"
    description: "Records a seat holder's resignation. Head of cascade B: seat -> accountability score -> application accountability test verdict -> application state."
    roles: [InstitutionOfficer]
    code: 200
    input: []
    output: BoardSeat
    side_effects: ["sets BoardSeat.status RESIGNED and resigned_at to the logical clock", "decrements the matching Institution seat counter", "recomputes Institution.accountability_score and accountability_satisfied", "when accountability_satisfied flips to false, sets test_accountability_state FAILED on every CertificationApplication of the institution whose state is UNDER_REVIEW", "when that verdict flips to FAILED, moves the application UNDER_REVIEW -> INFO_REQUESTED, increments revision_round by 1 and sets info_requested_reason to ACCOUNTABILITY_LOST", "increments Institution.version by 1"]
  # ---- CertificationApplication -------------------------------------------
  - method: POST
    path: "/cdfi/institutions/{institution_id}/certification-applications"
    description: "Opens a certification application in state DRAFT. Guarded by optimistic concurrency on the institution: expected_institution_version must equal the institution's current version, which the accountability and reserve cascades bump behind the officer's back."
    roles: [InstitutionOfficer]
    code: 201
    input: [expected_institution_version, primary_mission_statement, financing_activity_pct_claimed, development_services_description]
    output: CertificationApplication
    side_effects: ["creates CertificationApplication in state DRAFT with revision_round 0 and all six test_*_state fields PENDING", "snapshots Institution.accountability_score into accountability_score_snapshot", "increments Institution.version by 1"]
  - method: GET
    path: "/cdfi/certification-applications/{application_id}"
    description: "Reads one certification application including revision_round and the six per-test verdict fields."
    roles: [InstitutionOfficer, CertificationReviewer, ComplianceAnalyst]
    code: 200
    input: []
    output: CertificationApplication
    side_effects: []
  - method: GET
    path: "/cdfi/institutions/{institution_id}/certification-applications"
    description: "Lists the institution's certification applications (reverse lookup for CertificationApplication.institution_id)."
    roles: [InstitutionOfficer, CertificationReviewer, ComplianceAnalyst]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: CertificationApplication[]
    side_effects: []
  - method: POST
    path: "/cdfi/certification-applications/{application_id}/submit"
    description: "Submits a DRAFT application. Requires at least one APPROVED target market, accountability_satisfied true, at least one matching-market seat, and financing_activity_pct_claimed >= 60.00."
    roles: [InstitutionOfficer]
    code: 200
    input: []
    output: CertificationApplication
    side_effects: ["sets CertificationApplication.state SUBMITTED and submitted_by_user_id to X-User-ID", "increments CertificationApplication.version by 1"]
  - method: POST
    path: "/cdfi/certification-applications/{application_id}/begin-review"
    description: "Reviewer takes up a SUBMITTED application; records the reviewer identity that the decide step is then barred from reusing."
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: CertificationApplication
    side_effects: ["sets CertificationApplication.state UNDER_REVIEW and reviewed_by_user_id to X-User-ID", "increments CertificationApplication.version by 1"]
  - method: POST
    path: "/cdfi/certification-applications/{application_id}/evaluate-test"
    description: "Records the verdict for one of the six certification tests. test_code is one of PRIMARY_MISSION, FINANCING_ENTITY, TARGET_MARKET, DEVELOPMENT_SERVICES, ACCOUNTABILITY, NON_GOVERNMENT; verdict is one of PASSED, FAILED, WAIVED."
    roles: [CertificationReviewer]
    code: 200
    input: [test_code, verdict, "evidence_note?"]
    output: CertificationApplication
    side_effects: ["sets the test_<test_code>_state field to verdict", "increments CertificationApplication.version by 1"]
  - method: POST
    path: "/cdfi/certification-applications/{application_id}/request-info"
    description: "Reviewer returns an UNDER_REVIEW application for more information, opening a bounded review cycle."
    roles: [CertificationReviewer]
    code: 200
    input: [info_requested_reason]
    output: CertificationApplication
    side_effects: ["sets CertificationApplication.state INFO_REQUESTED and increments revision_round by 1", "increments CertificationApplication.version by 1"]
  - method: POST
    path: "/cdfi/certification-applications/{application_id}/resubmit"
    description: "Officer answers an information request. When revision_round has already reached 2 the cycle is exhausted and the application is denied instead of returning to review."
    roles: [InstitutionOfficer]
    code: 200
    input: ["primary_mission_statement?", "development_services_description?"]
    output: CertificationApplication
    side_effects: ["when revision_round <= 1, sets state UNDER_REVIEW and clears info_requested_reason", "when revision_round >= 2, sets state DENIED and decided_at to the logical clock", "increments CertificationApplication.version by 1"]
  - method: POST
    path: "/cdfi/certification-applications/{application_id}/decide"
    description: "Signs the certification decision. All six test verdicts must be non-PENDING; the decision is CERTIFIED when every verdict is PASSED or WAIVED and DENIED when any verdict is FAILED. The signer must differ from reviewed_by_user_id."
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: CertificationApplication
    side_effects: ["sets CertificationApplication.state CERTIFIED or DENIED and decided_at to the logical clock", "on CERTIFIED sets Institution.certification_state CERTIFIED, certified_at to the logical clock and recertification_due_at to the logical clock plus 1095 days", "increments Institution.version by 1 and CertificationApplication.version by 1"]
  # ---- Borrower ------------------------------------------------------------
  - method: POST
    path: "/cdfi/institutions/{institution_id}/borrowers"
    description: "Registers a borrower in geocode_state UNGEOCODED with geocode_attempts 0. income_pct_ami is computed from household_income_cents and area_median_income_cents. credit_score may be omitted for credit-invisible borrowers."
    roles: [InstitutionOfficer]
    code: 201
    input: [full_name, street_address, postal_code, household_income_cents, area_median_income_cents, "credit_score?"]
    output: Borrower
    side_effects: ["creates Borrower with geocode_state UNGEOCODED, geocode_attempts 0, in_target_market false", "computes income_pct_ami as household_income_cents * 100 / area_median_income_cents rounded HALF_UP to 2 decimals"]
  - method: GET
    path: "/cdfi/institutions/{institution_id}/borrowers"
    description: "Lists the institution's borrowers (reverse lookup for Borrower.institution_id)."
    roles: [InstitutionOfficer, CreditUnderwriter, ComplianceAnalyst]
    code: 200
    input: ["geocode_state?", "in_target_market?", "limit?", "offset?"]
    output: Borrower[]
    side_effects: []
  - method: POST
    path: "/cdfi/borrowers/{borrower_id}/geocode"
    description: "Records the outcome of one geocoding attempt against the borrower's street address. outcome MATCHED carries the resolved census_tract_code and runs target-market attribution; outcome UNMATCHED leaves the borrower retryable in GEOCODE_FAILED."
    roles: [InstitutionOfficer, ComplianceAnalyst]
    code: 200
    input: [outcome, "census_tract_code?"]
    output: Borrower
    side_effects: ["increments Borrower.geocode_attempts by 1", "on MATCHED sets geocode_state GEOCODED and census_tract_code, then applies calculations.target_market_attribution to set in_target_market and matched_target_market_type", "on UNMATCHED sets geocode_state GEOCODE_FAILED", "increments Borrower.version by 1"]
  # ---- LoanProduct ---------------------------------------------------------
  - method: POST
    path: "/cdfi/institutions/{institution_id}/loan-products"
    description: "Publishes a loan product designed for underserved borrowers: flexible underwriting knobs (max_dti_pct, min_credit_score, allow_no_credit_score), one credit-building feature, an optional technical-assistance prerequisite and a hard product cap."
    roles: [InstitutionOfficer]
    code: 201
    input: [name, base_rate_bps, term_months, max_dti_pct, min_credit_score, allow_no_credit_score, credit_building_features, requires_ta_completion, product_cap_cents]
    output: LoanProduct
    side_effects: ["creates LoanProduct with committed_principal_cents 0"]
  - method: GET
    path: "/cdfi/institutions/{institution_id}/loan-products"
    description: "Lists the institution's loan products (reverse lookup for LoanProduct.institution_id)."
    roles: [InstitutionOfficer, CreditUnderwriter, CreditCommittee, ComplianceAnalyst]
    code: 200
    input: ["requires_ta_completion?", "limit?", "offset?"]
    output: LoanProduct[]
    side_effects: []
  # ---- Loan ----------------------------------------------------------------
  - method: POST
    path: "/cdfi/loans"
    description: "Files a loan request in underwriting_state SCREENING and servicing_state NOT_DISBURSED. refinance_of_loan_id, when supplied, must name another loan of the same borrower (self-referential credit-building refinance)."
    roles: [InstitutionOfficer]
    code: 201
    input: [institution_id, borrower_id, product_id, requested_principal_cents, "refinance_of_loan_id?"]
    output: Loan
    side_effects: ["creates Loan with underwriting_state SCREENING, servicing_state NOT_DISBURSED and all money fields 0", "sets days_past_due 0"]
  - method: GET
    path: "/cdfi/loans/{loan_id}"
    description: "Reads one loan, including version (the OCC token for impact-report creation), the pricing chain fields and every servicing balance."
    roles: [InstitutionOfficer, CreditUnderwriter, CreditCommittee, ComplianceAnalyst, Borrower]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: GET
    path: "/cdfi/loans"
    description: "Filtered list of loans (reverse lookup for Loan.institution_id, Loan.borrower_id, Loan.product_id and the self-referential Loan.refinance_of_loan_id)."
    roles: [InstitutionOfficer, CreditUnderwriter, CreditCommittee, ComplianceAnalyst]
    code: 200
    input: ["institution_id?", "borrower_id?", "product_id?", "refinance_of_loan_id?", "underwriting_state?", "servicing_state?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: POST
    path: "/cdfi/loans/{loan_id}/underwrite"
    description: "Underwriter enters verified capacity figures and runs the pricing chain (calculations.loan_pricing_and_grade) in its pinned order: provisional payment at the product base rate, then dti_pct frozen from that payment, then risk_grade, risk_spread_bps, ta_discount_bps, final_rate_bps and the re-quoted monthly_payment_cents. The borrower must be GEOCODED."
    roles: [CreditUnderwriter]
    code: 200
    input: [verified_monthly_income_cents, existing_monthly_debt_cents, "credit_score_at_underwriting?"]
    output: Loan
    side_effects: ["sets Loan.underwriting_state UNDERWRITING and underwritten_by_user_id to X-User-ID", "computes provisional_monthly_payment_cents, dti_pct, risk_grade, risk_spread_bps, ta_discount_bps, final_rate_bps and monthly_payment_cents per calculations.loan_pricing_and_grade", "increments Loan.version by 1"]
  - method: POST
    path: "/cdfi/loans/{loan_id}/decision"
    description: "Credit committee approves or declines an UNDERWRITING loan. Approval requires the product's technical-assistance prerequisite to be satisfied and the product cap to still cover approved_principal_cents. The deciding member must differ from underwritten_by_user_id."
    roles: [CreditCommittee]
    code: 200
    input: [decision, "approved_principal_cents?", "decline_reason?"]
    output: Loan
    side_effects: ["on APPROVE sets underwriting_state APPROVED, approved_principal_cents and decided_by_user_id to X-User-ID", "on APPROVE adds approved_principal_cents to LoanProduct.committed_principal_cents", "on DECLINE sets underwriting_state DECLINED and decline_reason", "increments Loan.version by 1"]
  - method: POST
    path: "/cdfi/loans/{loan_id}/disbursements"
    description: "Disburses principal against an APPROVED loan. The disbursement is dated by the logical clock, not by any request field, so tests position vintages with the clock endpoint."
    roles: [InstitutionOfficer]
    code: 200
    input: [amount_cents]
    output: Loan
    side_effects: ["adds amount_cents to Loan.principal_disbursed_cents and principal_outstanding_cents", "on the first disbursement sets underwriting_state CLOSED, servicing_state CURRENT, first_disbursed_on and vintage_year from the logical clock, next_payment_due_on to the logical clock date plus 30 days, and borrower_in_target_market_at_origination from Borrower.in_target_market as observed at that moment", "adds amount_cents to Institution.portfolio_principal_disbursed_cents and portfolio_principal_outstanding_cents", "recomputes both loss-reserve variants, reserve_coverage_ratio and compliance_posture per calculations.portfolio_loss_reserve and calculations.reserve_coverage_and_posture", "increments Loan.version by 1 and Institution.version by 1"]
  - method: POST
    path: "/cdfi/loans/{loan_id}/payments"
    description: "Applies a principal payment, dated by the logical clock. A payment of at least one installment cures a delinquent loan outright; a partial payment on a CURRENT loan reduces the balance and re-dates the installment without changing servicing_state; a payment that clears the outstanding balance retires the loan."
    roles: [InstitutionOfficer]
    code: 200
    input: [amount_cents]
    output: Loan
    side_effects: ["adds amount_cents to Loan.principal_repaid_cents and subtracts it from principal_outstanding_cents", "when the loan was DELINQUENT_30/60/90 and amount_cents >= monthly_payment_cents, sets servicing_state CURRENT, days_past_due 0 and next_payment_due_on to the logical clock date plus 30 days", "when principal_outstanding_cents reaches 0 sets servicing_state PAID_OFF and underwriting_state CLOSED", "subtracts amount_cents from Institution.portfolio_principal_outstanding_cents and recomputes the reserve variants, reserve_coverage_ratio and compliance_posture", "increments Loan.version by 1 and Institution.version by 1"]
  - method: POST
    path: "/cdfi/loans/{loan_id}/charge-off"
    description: "Charges off a loan sitting at DELINQUENT_90. Head of cascade A: loan -> institution reserve and posture -> award draw suspension -> matching-fund commitment hold."
    roles: [ComplianceAnalyst]
    code: 200
    input: [charge_off_reason]
    output: Loan
    side_effects: ["moves the outstanding balance into Loan.charged_off_principal_cents, sets principal_outstanding_cents 0, servicing_state CHARGED_OFF and underwriting_state CLOSED", "subtracts the charged-off amount from Institution.portfolio_principal_outstanding_cents and recomputes both reserve variants, reserve_coverage_ratio, reserve_deficit_cents and compliance_posture", "when compliance_posture becomes PROBATION, moves every AwardApplication of the institution in state DISBURSING to DRAW_SUSPENDED with suspension_reason POSTURE_PROBATION", "for each award so suspended, moves every MatchingFundCommitment with status PLEDGED to HELD", "increments Loan.version by 1 and Institution.version by 1"]
  # ---- TAEngagement --------------------------------------------------------
  - method: POST
    path: "/cdfi/institutions/{institution_id}/ta-engagements"
    description: "Books a technical-assistance session for a borrower, optionally attached to a specific loan. Sessions for the same borrower must not collide, counting a 30-minute buffer on each side of the requested window."
    roles: [InstitutionOfficer]
    code: 201
    input: [borrower_id, topic, scheduled_start_at, scheduled_end_at, planned_hours, "loan_id?"]
    output: TAEngagement
    side_effects: ["creates TAEngagement in state SCHEDULED with actual_hours 0.00 and competency_verified false"]
  - method: GET
    path: "/cdfi/ta-engagements/{engagement_id}"
    description: "Reads one technical-assistance engagement."
    roles: [InstitutionOfficer, CreditUnderwriter, CreditCommittee, ComplianceAnalyst]
    code: 200
    input: []
    output: TAEngagement
    side_effects: []
  - method: GET
    path: "/cdfi/ta-engagements"
    description: "Filtered list of technical-assistance engagements (reverse lookup for TAEngagement.institution_id, TAEngagement.borrower_id and TAEngagement.loan_id)."
    roles: [InstitutionOfficer, CreditUnderwriter, CreditCommittee, ComplianceAnalyst]
    code: 200
    input: ["institution_id?", "borrower_id?", "loan_id?", "state?", "limit?", "offset?"]
    output: TAEngagement[]
    side_effects: []
  - method: POST
    path: "/cdfi/ta-engagements/{engagement_id}/close"
    description: "Closes a SCHEDULED engagement down one of two forks. outcome COMPLETED records actual_hours and the competency verification that loan approval depends on; outcome NO_SHOW records zero hours and releases the borrower's calendar slot."
    roles: [InstitutionOfficer]
    code: 200
    input: [outcome, "actual_hours?", "competency_verified?"]
    output: TAEngagement
    side_effects: ["on COMPLETED sets state COMPLETED, actual_hours, competency_verified and closed_at from the logical clock, and adds actual_hours to Borrower.ta_hours_total", "on NO_SHOW sets state NO_SHOW, actual_hours 0.00, competency_verified false and closed_at from the logical clock, leaving Borrower.ta_hours_total unchanged", "increments TAEngagement.version by 1"]
  # ---- ImpactReport --------------------------------------------------------
  - method: POST
    path: "/cdfi/loans/{loan_id}/impact-reports"
    description: "Borrower files the impact data collected for one reporting period. Guarded by optimistic concurrency on the loan: expected_loan_version must equal the loan's current version, which servicing runs, payments and charge-off bump behind the filer's back. A new report for a reporting_period_end already on file supersedes the earlier one."
    roles: [Borrower, InstitutionOfficer]
    code: 201
    input: [expected_loan_version, reporting_period_end, jobs_created, jobs_retained, housing_units, businesses_financed]
    output: ImpactReport
    side_effects: ["creates ImpactReport in state SUBMITTED with revision_count 0 and borrower_id copied from Loan.borrower_id", "when an earlier ImpactReport of the same loan carries the same reporting_period_end and is in state SUBMITTED, VERIFIED or DISPUTED, sets that report SUPERSEDED", "when the superseded report was VERIFIED, subtracts its four counts from the Institution impact totals and recomputes goal_attainment_pct on every AwardApplication of the institution in state AWARDED, DISBURSING or DRAW_SUSPENDED", "increments Loan.version by 1"]
  - method: GET
    path: "/cdfi/impact-reports/{impact_report_id}"
    description: "Reads one impact report."
    roles: [Borrower, InstitutionOfficer, ComplianceAnalyst, AwardAdministrator]
    code: 200
    input: []
    output: ImpactReport
    side_effects: []
  - method: GET
    path: "/cdfi/impact-reports"
    description: "Filtered list of impact reports (reverse lookup for ImpactReport.loan_id and ImpactReport.borrower_id)."
    roles: [InstitutionOfficer, ComplianceAnalyst, AwardAdministrator]
    code: 200
    input: ["loan_id?", "borrower_id?", "state?", "limit?", "offset?"]
    output: ImpactReport[]
    side_effects: []
  - method: POST
    path: "/cdfi/impact-reports/{impact_report_id}/verify"
    description: "Analyst accepts a SUBMITTED report, rolling its four counts into the institution's impact ledger."
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: ImpactReport
    side_effects: ["sets ImpactReport.state VERIFIED and verified_at from the logical clock", "adds jobs_created, jobs_retained, housing_units and businesses_financed to the matching Institution totals per calculations.institution_impact_aggregation", "recomputes goal_attainment_pct on every AwardApplication of the institution in state AWARDED, DISBURSING or DRAW_SUSPENDED", "increments ImpactReport.version by 1 and Institution.version by 1"]
  - method: POST
    path: "/cdfi/impact-reports/{impact_report_id}/dispute"
    description: "Analyst rejects a report's figures. When the report had already been verified, the ledger entry is reversed exactly."
    roles: [ComplianceAnalyst]
    code: 200
    input: [dispute_reason]
    output: ImpactReport
    side_effects: ["sets ImpactReport.state DISPUTED, dispute_reason and clears verified_at to null", "when the report was VERIFIED, subtracts its four counts from the matching Institution totals per calculations.institution_impact_aggregation", "recomputes goal_attainment_pct on every AwardApplication of the institution in state AWARDED, DISBURSING or DRAW_SUSPENDED", "increments ImpactReport.version by 1 and Institution.version by 1"]
  - method: POST
    path: "/cdfi/impact-reports/{impact_report_id}/resubmit"
    description: "Borrower corrects a DISPUTED report's figures and re-files it for verification."
    roles: [Borrower, InstitutionOfficer]
    code: 200
    input: [jobs_created, jobs_retained, housing_units, businesses_financed]
    output: ImpactReport
    side_effects: ["overwrites the four counts, sets state SUBMITTED, clears dispute_reason and increments revision_count by 1", "increments ImpactReport.version by 1"]
  # ---- ComplianceMeasurement ----------------------------------------------
  - method: POST
    path: "/cdfi/institutions/{institution_id}/compliance-measurements"
    description: "Opens a DRAFT target-market lending measurement over the half-open window [period_start, period_end). Each weighting_basis forms its own series: the window must not intersect an existing DRAFT or FINALIZED window of the same institution with the SAME weighting_basis, while adjacency (new period_start equal to an existing period_end) and an identical window under the other basis are both allowed. period_end must not be later than the logical clock."
    roles: [ComplianceAnalyst]
    code: 201
    input: [period_start, period_end, weighting_basis]
    output: ComplianceMeasurement
    side_effects: ["creates ComplianceMeasurement in state DRAFT with verdict PENDING and all measured counters 0"]
  - method: GET
    path: "/cdfi/institutions/{institution_id}/compliance-measurements"
    description: "Lists the institution's measurements (reverse lookup for ComplianceMeasurement.institution_id)."
    roles: [InstitutionOfficer, ComplianceAnalyst, CertificationReviewer]
    code: 200
    input: ["state?", "verdict?", "limit?", "offset?"]
    output: ComplianceMeasurement[]
    side_effects: []
  - method: POST
    path: "/cdfi/compliance-measurements/{measurement_id}/finalize"
    description: "Computes both target-market lending percentages over the window (calculations.target_market_lending_percentage), publishes the one named by weighting_basis as selected_pct, and rules PASS at or above 60.00. A FAIL puts a certified institution into recertification."
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: ComplianceMeasurement
    side_effects: ["computes measured_loan_count, target_market_loan_count, measured_principal_cents, target_market_principal_cents, dollar_weighted_pct and count_weighted_pct", "sets selected_pct from the variant named by weighting_basis and verdict PASS when selected_pct >= 60.00 else FAIL", "sets state FINALIZED and finalized_at from the logical clock", "copies selected_pct into Institution.target_market_lending_pct", "on verdict PASS, when Institution.certification_state is RECERT_DUE, sets it CERTIFIED and recertification_due_at to period_end plus 1095 days", "on verdict FAIL, when Institution.certification_state is RECERT_DUE, sets it DECERTIFIED", "increments ComplianceMeasurement.version by 1 and Institution.version by 1"]
  - method: POST
    path: "/cdfi/compliance-measurements/{measurement_id}/void"
    description: "Withdraws a DRAFT measurement, freeing its window for a re-cut."
    roles: [ComplianceAnalyst]
    code: 200
    input: [void_reason]
    output: ComplianceMeasurement
    side_effects: ["sets ComplianceMeasurement.state VOIDED and void_reason", "the window no longer participates in overlap checks", "increments ComplianceMeasurement.version by 1"]
  # ---- AwardApplication ----------------------------------------------------
  - method: POST
    path: "/cdfi/institutions/{institution_id}/award-applications"
    description: "Drafts a federal award application with its matching-funds requirement and performance goals. required_match_cents is computed as requested_amount_cents * match_ratio_pct / 100 rounded HALF_UP to whole cents."
    roles: [AwardAdministrator, InstitutionOfficer]
    code: 201
    input: [program, requested_amount_cents, match_ratio_pct, performance_goal_jobs, performance_goal_housing_units, period_start, period_end]
    output: AwardApplication
    side_effects: ["creates AwardApplication in state DRAFT with match_eligible_cents 0, awarded_amount_cents 0 and goal_attainment_pct 0.00", "computes required_match_cents and sets match_shortfall_cents equal to it"]
  - method: GET
    path: "/cdfi/award-applications/{award_id}"
    description: "Reads one award application including the match ledger (required_match_cents, match_eligible_cents, match_shortfall_cents) and goal_attainment_pct."
    roles: [AwardAdministrator, InstitutionOfficer, ComplianceAnalyst]
    code: 200
    input: []
    output: AwardApplication
    side_effects: []
  - method: GET
    path: "/cdfi/institutions/{institution_id}/award-applications"
    description: "Lists the institution's award applications (reverse lookup for AwardApplication.institution_id)."
    roles: [AwardAdministrator, InstitutionOfficer, ComplianceAnalyst]
    code: 200
    input: ["state?", "program?", "limit?", "offset?"]
    output: AwardApplication[]
    side_effects: []
  - method: POST
    path: "/cdfi/award-applications/{award_id}/submit"
    description: "Submits a DRAFT award application. The institution must be CERTIFIED and the application must carry at least one matching-fund commitment."
    roles: [AwardAdministrator, InstitutionOfficer]
    code: 200
    input: []
    output: AwardApplication
    side_effects: ["sets AwardApplication.state SUBMITTED", "increments AwardApplication.version by 1"]
  - method: POST
    path: "/cdfi/award-applications/{award_id}/decide"
    description: "Award administrator obligates or rejects a SUBMITTED application. decision AWARD requires awarded_amount_cents; the deciding identity is recorded and is then barred from verifying this award's matching funds."
    roles: [AwardAdministrator]
    code: 200
    input: [decision, "awarded_amount_cents?"]
    output: AwardApplication
    side_effects: ["on AWARD sets state AWARDED, awarded_amount_cents and decided_by_user_id to X-User-ID", "on REJECT sets state REJECTED", "increments AwardApplication.version by 1"]
  - method: POST
    path: "/cdfi/award-applications/{award_id}/activate-disbursing"
    description: "Opens the draw window on an AWARDED application. Requires every matching-fund commitment to be settled (none PLEDGED or HELD), zero match shortfall, and an institution posture of COMPLIANT or WATCH."
    roles: [AwardAdministrator]
    code: 200
    input: []
    output: AwardApplication
    side_effects: ["sets AwardApplication.state DISBURSING and suspension_reason null", "increments AwardApplication.version by 1"]
  - method: POST
    path: "/cdfi/award-applications/{award_id}/resume-draws"
    description: "Lifts a draw suspension once the institution's reserve coverage is repaired. Requires compliance_posture COMPLIANT, which is strictly tighter than the activation gate."
    roles: [AwardAdministrator]
    code: 200
    input: []
    output: AwardApplication
    side_effects: ["sets AwardApplication.state DISBURSING and suspension_reason null", "returns every MatchingFundCommitment of this award with status HELD to PLEDGED", "increments AwardApplication.version by 1"]
  # ---- MatchingFundCommitment ---------------------------------------------
  - method: POST
    path: "/cdfi/award-applications/{award_id}/matching-fund-commitments"
    description: "Records a pledged matching-funds source in status PLEDGED with eligible_cents 0. Permitted while the award is in DRAFT, SUBMITTED, AWARDED or DISBURSING, so a source pledged after the draw window opens starts out unsettled."
    roles: [AwardAdministrator, InstitutionOfficer]
    code: 201
    input: [source_name, source_type, amount_cents, committed_on]
    output: MatchingFundCommitment
    side_effects: ["creates MatchingFundCommitment with status PLEDGED and eligible_cents 0"]
  - method: GET
    path: "/cdfi/award-applications/{award_id}/matching-fund-commitments"
    description: "Lists an award's matching-fund commitments (reverse lookup for MatchingFundCommitment.award_application_id)."
    roles: [AwardAdministrator, InstitutionOfficer, ComplianceAnalyst]
    code: 200
    input: ["status?", "source_type?", "limit?", "offset?"]
    output: MatchingFundCommitment[]
    side_effects: []
  - method: POST
    path: "/cdfi/matching-fund-commitments/{commitment_id}/verify"
    description: "Verifies a PLEDGED source and books its haircut-adjusted contribution per calculations.award_eligible_match_total (each commitment is rounded to whole cents before summation). FEDERAL sources are never eligible. The verifier must differ from the award's decided_by_user_id."
    roles: [AwardAdministrator]
    code: 200
    input: []
    output: MatchingFundCommitment
    side_effects: ["sets MatchingFundCommitment.status VERIFIED, verified_by_user_id to X-User-ID and eligible_cents per calculations.award_eligible_match_total", "recomputes AwardApplication.match_eligible_cents and match_shortfall_cents", "increments MatchingFundCommitment.version by 1 and AwardApplication.version by 1"]
  - method: POST
    path: "/cdfi/matching-fund-commitments/{commitment_id}/withdraw"
    description: "Withdraws a pledged or verified source. Withdrawing a verified source reverses its exact contribution to the match ledger."
    roles: [AwardAdministrator, InstitutionOfficer]
    code: 200
    input: [withdraw_reason]
    output: MatchingFundCommitment
    side_effects: ["sets MatchingFundCommitment.status WITHDRAWN and withdraw_reason", "when the commitment was VERIFIED, subtracts its eligible_cents from AwardApplication.match_eligible_cents, sets its own eligible_cents to 0 and recomputes match_shortfall_cents", "increments MatchingFundCommitment.version by 1 and AwardApplication.version by 1"]

  # ---- single-resource reads added for reverse reachability -----------------
  - method: GET
    path: "/cdfi/target-markets/{target_market_id}"
    description: "Reads one target market, including state, approved_at and the tract or AMI definition that borrower attribution matches against."
    roles: [InstitutionOfficer, CertificationReviewer, ComplianceAnalyst]
    code: 200
    input: []
    output: TargetMarket
    side_effects: []
  - method: GET
    path: "/cdfi/borrowers/{borrower_id}"
    description: "Reads one borrower, including geocode_state, geocode_attempts, census_tract_code, income_pct_ami, in_target_market, matched_target_market_type and ta_hours_total."
    roles: [InstitutionOfficer, CreditUnderwriter, CreditCommittee, ComplianceAnalyst]
    code: 200
    input: []
    output: Borrower
    side_effects: []
  - method: GET
    path: "/cdfi/loan-products/{product_id}"
    description: "Reads one loan product, including committed_principal_cents against product_cap_cents and the flexible-underwriting flags."
    roles: [InstitutionOfficer, CreditUnderwriter, CreditCommittee, ComplianceAnalyst]
    code: 200
    input: []
    output: LoanProduct
    side_effects: []
  - method: GET
    path: "/cdfi/compliance-measurements/{measurement_id}"
    description: "Reads one compliance measurement, including both weighting variants, selected_pct and verdict."
    roles: [InstitutionOfficer, ComplianceAnalyst, CertificationReviewer]
    code: 200
    input: []
    output: ComplianceMeasurement
    side_effects: []
  - method: GET
    path: "/cdfi/matching-fund-commitments/{commitment_id}"
    description: "Reads one matching fund commitment, including status, source_type and eligible_cents."
    roles: [InstitutionOfficer, AwardAdministrator, ComplianceAnalyst]
    code: 200
    input: []
    output: MatchingFundCommitment
    side_effects: []
  # ---- flat reverse-lookup lists -------------------------------------------
  - method: GET
    path: "/cdfi/target-markets"
    description: "Filtered list of target markets (reverse lookup for TargetMarket.institution_id). Paginated."
    roles: [CertificationReviewer, ComplianceAnalyst]
    code: 200
    input: ["institution_id?", "market_type?", "state?", "limit?", "offset?"]
    output: TargetMarket[]
    side_effects: []
  - method: GET
    path: "/cdfi/borrowers"
    description: "Filtered list of borrowers (reverse lookup for Borrower.institution_id), also filterable by geocode_state and in_target_market for target-market monitoring. Paginated."
    roles: [ComplianceAnalyst, CreditUnderwriter, CreditCommittee]
    code: 200
    input: ["institution_id?", "geocode_state?", "in_target_market?", "limit?", "offset?"]
    output: Borrower[]
    side_effects: []
  - method: GET
    path: "/cdfi/loan-products"
    description: "Filtered list of loan products (reverse lookup for LoanProduct.institution_id). Paginated."
    roles: [ComplianceAnalyst, CreditUnderwriter, CreditCommittee]
    code: 200
    input: ["institution_id?", "limit?", "offset?"]
    output: LoanProduct[]
    side_effects: []
  - method: GET
    path: "/cdfi/certification-applications"
    description: "Filtered list of certification applications (reverse lookup for CertificationApplication.institution_id). Paginated."
    roles: [CertificationReviewer, ComplianceAnalyst]
    code: 200
    input: ["institution_id?", "state?", "limit?", "offset?"]
    output: CertificationApplication[]
    side_effects: []
  - method: GET
    path: "/cdfi/compliance-measurements"
    description: "Filtered list of compliance measurements (reverse lookup for ComplianceMeasurement.institution_id), filterable by weighting_basis, state and verdict. Paginated."
    roles: [ComplianceAnalyst, CertificationReviewer]
    code: 200
    input: ["institution_id?", "weighting_basis?", "state?", "verdict?", "limit?", "offset?"]
    output: ComplianceMeasurement[]
    side_effects: []
  - method: GET
    path: "/cdfi/award-applications"
    description: "Filtered list of federal award applications (reverse lookup for AwardApplication.institution_id). Paginated."
    roles: [AwardAdministrator, ComplianceAnalyst]
    code: 200
    input: ["institution_id?", "state?", "limit?", "offset?"]
    output: AwardApplication[]
    side_effects: []
  - method: GET
    path: "/cdfi/matching-fund-commitments"
    description: "Filtered list of matching fund commitments (reverse lookup for MatchingFundCommitment.award_application_id), filterable by status and source_type. Paginated."
    roles: [AwardAdministrator, ComplianceAnalyst]
    code: 200
    input: ["award_application_id?", "status?", "source_type?", "limit?", "offset?"]
    output: MatchingFundCommitment[]
    side_effects: []

errors:
  # --- authentication / authorisation ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_INSTITUTION_SCOPE_VIOLATION
    http: 403
    condition: "an InstitutionOfficer acts on a resource owned by a different institution"
  - id: ERR_BORROWER_SCOPE_VIOLATION
    http: 403
    condition: "a Borrower files or resubmits an impact report for a loan that is not theirs"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user id equals the identity that performed the incompatible prior step: loan underwriter deciding the same loan, review opener signing the same certification decision, or award decider verifying that award's matching funds"
  # --- existence ---
  - id: ERR_INSTITUTION_NOT_FOUND
    http: 404
    condition: "institution_id does not resolve to an Institution"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application_id does not resolve to a CertificationApplication"
  - id: ERR_TARGET_MARKET_NOT_FOUND
    http: 404
    condition: "target_market_id does not resolve to a TargetMarket of the addressed institution"
  - id: ERR_BOARD_SEAT_NOT_FOUND
    http: 404
    condition: "board_seat_id does not resolve to a BoardSeat"
  - id: ERR_BORROWER_NOT_FOUND
    http: 404
    condition: "borrower_id does not resolve to a Borrower of the addressed institution"
  - id: ERR_LOAN_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id does not resolve to a LoanProduct (of the addressed institution, when an institution is addressed)"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "loan_id or refinance_of_loan_id does not resolve to a Loan"
  - id: ERR_TA_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "engagement_id does not resolve to a TAEngagement"
  - id: ERR_IMPACT_REPORT_NOT_FOUND
    http: 404
    condition: "impact_report_id does not resolve to an ImpactReport"
  - id: ERR_MEASUREMENT_NOT_FOUND
    http: 404
    condition: "measurement_id does not resolve to a ComplianceMeasurement"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "award_id does not resolve to an AwardApplication"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "commitment_id does not resolve to a MatchingFundCommitment"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, a field has the wrong type, an enum value is outside its declared set, a numeric field is outside its declared range, or a conditionally required field (census_tract_codes, ami_threshold_pct, target_market_id, census_tract_code, approved_amount fields) is absent when its condition holds"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset below 0"
  # --- optimistic concurrency ---
  - id: ERR_STALE_INSTITUTION_VERSION
    http: 412
    condition: "expected_institution_version does not equal the institution's current version when opening a certification application"
  - id: ERR_STALE_LOAN_VERSION
    http: 412
    condition: "expected_loan_version does not equal the loan's current version when filing an impact report"
  # --- state ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared for the resource's current state"
  - id: ERR_APPLICATION_NOT_UNDER_REVIEW
    http: 409
    condition: "a review action (evaluate-test, request-info, decide) is attempted on an application whose state is not UNDER_REVIEW"
  - id: ERR_LOAN_NOT_IN_UNDERWRITING
    http: 409
    condition: "a credit decision is attempted on a loan whose underwriting_state is not UNDERWRITING"
  - id: ERR_LOAN_NOT_DELINQUENT_90
    http: 409
    condition: "charge-off is attempted on a loan whose servicing_state is not DELINQUENT_90"
  - id: ERR_MEASUREMENT_NOT_DRAFT
    http: 409
    condition: "finalize or void is attempted on a measurement whose state is not DRAFT"
  - id: ERR_AWARD_NOT_AWARDED
    http: 409
    condition: "activate-disbursing is attempted on an award whose state is not AWARDED"
  - id: ERR_COMMITMENT_NOT_PLEDGED
    http: 409
    condition: "verify is attempted on a commitment whose status is not PLEDGED"
  - id: ERR_ENGAGEMENT_NOT_SCHEDULED
    http: 409
    condition: "close is attempted on an engagement whose state is not SCHEDULED"
  - id: ERR_REPORT_NOT_DISPUTED
    http: 409
    condition: "resubmit is attempted on an impact report whose state is not DISPUTED"
  # --- business safety ---
  - id: ERR_TA_PREREQUISITE_UNMET
    http: 409
    condition: "loan approval attempted on a product with requires_ta_completion true while the borrower has no COMPLETED engagement with competency_verified true"
  - id: ERR_UNDERWRITING_TIER_UNMET
    http: 422
    condition: "underwriting produces a debt-to-income ratio above the product's max_dti_pct, or a credit profile that resolves no risk grade (no credit score on a product that does not allow credit-invisible borrowers, or a score below min_credit_score)"
  - id: ERR_POSTURE_NOT_COMPLIANT
    http: 409
    condition: "resume-draws attempted while compliance_posture is not COMPLIANT, or activate-disbursing attempted while compliance_posture is PROBATION"
  - id: ERR_INSTITUTION_NOT_CERTIFIED
    http: 409
    condition: "award submission attempted while the institution's certification_state is not CERTIFIED"
  # --- business referential ---
  - id: ERR_TARGET_MARKET_NOT_APPROVED
    http: 422
    condition: "the institution has no TargetMarket in state APPROVED when submitting an application or evaluating a certification test"
  - id: ERR_ACCOUNTABILITY_NOT_SATISFIED
    http: 422
    condition: "Institution.accountability_satisfied is false when submitting an application or evaluating the ACCOUNTABILITY test"
  - id: ERR_BORROWER_NOT_GEOCODED
    http: 422
    condition: "underwriting attempted for a borrower whose geocode_state is not GEOCODED"
  - id: ERR_TEST_VERDICT_PENDING
    http: 422
    condition: "the certification decision is signed while any of the six test verdicts is still PENDING"
  - id: ERR_MATCH_COMMITMENTS_UNVERIFIED
    http: 409
    condition: "activate-disbursing attempted while at least one matching-fund commitment is PLEDGED or HELD"
  - id: ERR_NO_MATCH_COMMITMENTS
    http: 422
    condition: "award submission attempted with no matching-fund commitment on file"
  # --- business constraint ---
  - id: ERR_DUPLICATE_EIN
    http: 409
    condition: "an institution is registered with an ein already on file"
  - id: ERR_MEASUREMENT_PERIOD_OVERLAP
    http: 409
    condition: "the requested half-open measurement window intersects an existing DRAFT or FINALIZED window of the same institution under the same weighting_basis"
  - id: ERR_TA_SLOT_CONFLICT
    http: 409
    condition: "the requested engagement window, padded by 30 minutes on each side, intersects a SCHEDULED or COMPLETED engagement of the same borrower"
  - id: ERR_NO_MEASURABLE_LOANS
    http: 422
    condition: "finalize finds no loan in the measurement input set for the window"
  - id: ERR_FINANCING_ACTIVITY_BELOW_MINIMUM
    http: 422
    condition: "application submission attempted with financing_activity_pct_claimed below 60.00"
  # --- business temporal ---
  - id: ERR_PERIOD_BOUNDS_INVALID
    http: 422
    condition: "period_end is not strictly after period_start, or scheduled_end_at is not strictly after scheduled_start_at"
  - id: ERR_PERIOD_END_IN_FUTURE
    http: 422
    condition: "a measurement window's period_end is later than the current logical clock"
  # --- business fiscal ---
  - id: ERR_PRODUCT_CAP_EXCEEDED
    http: 422
    condition: "approving the loan would push the product's committed principal above product_cap_cents"
  - id: ERR_DISBURSEMENT_EXCEEDS_APPROVED
    http: 422
    condition: "the disbursement would push principal_disbursed_cents above approved_principal_cents"
  - id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http: 422
    condition: "the payment exceeds principal_outstanding_cents"
  - id: ERR_MATCH_SHORTFALL
    http: 422
    condition: "activate-disbursing attempted while match_shortfall_cents is above 0"
  - id: ERR_FEDERAL_SOURCE_INELIGIBLE
    http: 422
    condition: "verification attempted on a commitment whose source_type is FEDERAL"

roles:
  - name: InstitutionOfficer
    description: "Officer of the lender: registers the institution, defines target markets, seats board members, files certification and award paperwork, onboards borrowers, publishes products, books technical assistance, disburses and collects."
    identity: "entity_backed:Institution"
    exclusive_operations: [register_institution, define_target_market, seat_board_member, resign_board_seat, open_certification_application, submit_certification_application, resubmit_certification_application, register_borrower, publish_loan_product, file_loan_request, disburse_principal, apply_payment, book_ta_engagement, close_ta_engagement]
    shared_operations: [read_institution, list_target_markets, read_board_seat, list_board_seats, list_borrowers, geocode_borrower, list_loan_products, read_loan, list_loans, read_ta_engagement, list_ta_engagements, file_impact_report, resubmit_impact_report, read_impact_report, list_impact_reports, read_certification_application, list_certification_applications, list_compliance_measurements, draft_award_application, submit_award_application, read_award_application, list_award_applications, pledge_matching_funds, list_matching_fund_commitments, withdraw_matching_funds, set_clock]
  - name: Borrower
    description: "Borrower of record: files and corrects the impact data collected on their own loans."
    identity: "entity_backed:Borrower"
    exclusive_operations: []
    shared_operations: [read_loan, file_impact_report, resubmit_impact_report, read_impact_report]
  - name: CertificationReviewer
    description: "Certifying-authority reviewer: approves target markets, opens review, records the six test verdicts, requests information and signs the certification decision (subject to segregation of duties)."
    identity: "opaque"
    exclusive_operations: [approve_target_market, begin_review, evaluate_certification_test, request_information, decide_certification]
    shared_operations: [read_institution, list_institutions, list_target_markets, read_board_seat, list_board_seats, read_certification_application, list_certification_applications, list_compliance_measurements, set_clock]
  - name: CreditUnderwriter
    description: "Credit underwriter: enters verified capacity figures and runs the pricing and grading chain. Barred from deciding the loans they underwrite."
    identity: "opaque"
    exclusive_operations: [underwrite_loan]
    shared_operations: [read_institution, list_borrowers, list_loan_products, read_loan, list_loans, read_ta_engagement, list_ta_engagements, set_clock]
  - name: CreditCommittee
    description: "Credit committee member: approves or declines underwritten loans under the technical-assistance prerequisite and the product cap."
    identity: "opaque"
    exclusive_operations: [decide_loan]
    shared_operations: [read_institution, list_loan_products, read_loan, list_loans, read_ta_engagement, list_ta_engagements, set_clock]
  - name: ComplianceAnalyst
    description: "Compliance analyst: geocodes borrowers, runs the servicing checkpoint, charges off unrecoverable loans, cuts and finalizes target-market lending measurements, and verifies or disputes impact reports."
    identity: "opaque"
    exclusive_operations: [run_servicing_checkpoint, charge_off_loan, open_compliance_measurement, finalize_compliance_measurement, void_compliance_measurement, verify_impact_report, dispute_impact_report]
    shared_operations: [read_institution, list_institutions, list_target_markets, read_board_seat, list_board_seats, list_borrowers, geocode_borrower, list_loan_products, read_loan, list_loans, read_ta_engagement, list_ta_engagements, read_impact_report, list_impact_reports, read_certification_application, list_certification_applications, list_compliance_measurements, read_award_application, list_award_applications, list_matching_fund_commitments, set_clock]
  - name: AwardAdministrator
    description: "Federal award administrator: obligates awards, opens and resumes draw windows, and verifies matching funds (barred from verifying the matching funds of an award they obligated)."
    identity: "opaque"
    exclusive_operations: [decide_award, activate_disbursing, resume_draws, verify_matching_funds]
    shared_operations: [read_institution, list_institutions, draft_award_application, submit_award_application, read_award_application, list_award_applications, pledge_matching_funds, list_matching_fund_commitments, withdraw_matching_funds, read_impact_report, list_impact_reports, set_clock]
