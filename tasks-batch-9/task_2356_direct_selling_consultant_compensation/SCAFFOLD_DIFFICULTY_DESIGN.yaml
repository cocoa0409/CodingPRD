              as: CommissionAnalyst
              captures: { h_personal: "$.data[0].personal_volume_points", h_net: "$.data[0].net_personal_volume_points", h_group: "$.data[0].group_volume_points" }
            - call: "GET /direct-selling/qualification-periods/${p8_id}"
