scenario: |
  Municipal Lost & Found Property Management (city/transit lost and found): found property intake & item description/tagging, storage location & retention period by item type/value, owner claim verification & release documentation, unclaimed property auction or disposal process, high-value/identification item handling & law enforcement referral, online searchable inventory & inquiry handling, transit vs facility program differences, evidence vs found property distinction

domain_name: municipal-lost-found
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: program_type, type: enum, source: input, description: "TRANSIT | FACILITY; drives retention-deadline and inquiry-SLA variant selection", constraints: "one of {TRANSIT, FACILITY}" }
      - { name: contact_email, type: string, source: input, description: "Public contact email for the program" }
      - { name: active, type: boolean, source: system, description: "False after deactivation; inactive programs reject new item intake", default: true }

  - name: RetentionPolicy
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: item_category, type: enum, source: input, description: "Category this policy governs", constraints: "one of {ELECTRONICS, JEWELRY, ID_DOCUMENT, KEYS, CLOTHING, BAG, WALLET, BICYCLE, CASH, OTHER}" }
      - { name: value_tier, type: enum, source: input, description: "Tier this policy governs", constraints: "one of {LOW, MID, HIGH}" }
      - { name: retention_days, type: integer, source: input, description: "Days an item is held before auction/disposal", constraints: ">= 1" }
      - { name: disposal_method, type: enum, source: input, description: "Where expired items route", constraints: "one of {AUCTION, DESTRUCTION, DONATION}" }
      - { name: active, type: boolean, source: system, description: "True until superseded by a newer policy with the same (program_id, item_category, value_tier) key", default: true }

  - name: StorageLocation
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: name, type: string, source: input, description: "Human label, e.g. 'Cage A / Shelf 3'" }
      - { name: capacity_slots, type: integer, source: input, description: "Maximum simultaneously occupied slots", constraints: ">= 1" }
      - { name: supports_high_value, type: boolean, source: input, description: "True for secure vault locations; HIGH-tier items may only be stored in such locations" }
      - { name: active, type: boolean, source: system, description: "False after deactivation; inactive locations cannot receive items", default: true }
      - { name: occupied_slots, type: integer, source: computed, description: "Count of Items with storage_location_id = this location and status IN {STORED, LISTED, RELEASE_PENDING, REFERRED_TO_LE, AUCTION_ELIGIBLE, LOTTED, DISPOSAL_PENDING}; IN_LE_CUSTODY and terminal states free the slot", default: 0 }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: insurance_cap_cents, type: integer, source: input, description: "Maximum aggregate lot minimum-bid value the venue will insure per event; adding an item that pushes the lot's projected minimum_bid_cents above this cap is rejected", constraints: ">= 0" }

  - name: Claimant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone", default: null }
      - { name: id_verified, type: boolean, source: system, description: "Set true by ClaimsExaminer via verify-id; required for HIGH-tier claim approval and weighted into proof score", default: false }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: storage_location_id, type: string, source: input, description: "FK -> StorageLocation.id; current storage bin" }
      - { name: category, type: enum, source: input, description: "Found-property category", constraints: "one of {ELECTRONICS, JEWELRY, ID_DOCUMENT, KEYS, CLOTHING, BAG, WALLET, BICYCLE, CASH, OTHER}" }
      - { name: declared_value_cents, type: integer, source: input, description: "Intake officer's estimated value in cents", constraints: ">= 0" }
      - { name: value_tier, type: enum, source: computed, description: "LOW if declared_value_cents < 10000; MID if 10000 <= declared_value_cents < 100000; HIGH if declared_value_cents >= 100000", constraints: "one of {LOW, MID, HIGH}" }
      - { name: is_identification, type: boolean, source: computed, description: "True iff category == ID_DOCUMENT; identification items can never be publicly listed", default: false }
      - { name: description, type: string, source: input, description: "Public-safe item description" }
      - { name: found_at, type: datetime, source: input, description: "When the item was found (ISO 8601 UTC)" }
      - { name: found_location, type: string, source: input, description: "Where the item was found" }
      - { name: external_ref, type: string, source: input, description: "Physical tag number", default: null }
      - { name: retention_policy_id, type: string, source: computed, description: "FK -> RetentionPolicy.id; active policy resolved at intake for (program_id, category, value_tier)" }
      - { name: retention_deadline, type: datetime, source: computed, description: "Expiry instant per retention_deadline calculation; TRANSIT programs use hour-precise arithmetic, FACILITY programs use end-of-calendar-day arithmetic" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of {STORED, LISTED, RELEASE_PENDING, RELEASED, REFERRED_TO_LE, IN_LE_CUSTODY, EVIDENCE, AUCTION_ELIGIBLE, LOTTED, SOLD, DISPOSAL_PENDING, DISPOSED, DONATED}" }
      - { name: unsold_count, type: integer, source: system, description: "Number of times the item has been in a lot that closed unsold; at 2 the item escalates to disposal", default: 0 }
      - { name: pending_disposal_method, type: enum, source: system, description: "Method fixed when the item enters DISPOSAL_PENDING: policy.disposal_method for expiry, DESTRUCTION for unsold escalation", default: null, constraints: "null or one of {AUCTION, DESTRUCTION, DONATION}" }
      - { name: intake_officer_id, type: string, source: system, description: "X-User-ID of the IntakeOfficer who registered the item; used for segregation-of-duties checks" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; claimed item" }
      - { name: claimant_id, type: string, source: input, description: "FK -> Claimant.id; must equal X-User-ID when role is Claimant" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, STAYED, APPROVED, REJECTED, WITHDRAWN, RELEASED}" }
      - { name: proof_serial, type: boolean, source: input, description: "Claimant asserts knowledge of serial/unique marking" }
      - { name: proof_photo, type: boolean, source: input, description: "Claimant supplies a photo of themselves with the item" }
      - { name: proof_receipt, type: boolean, source: input, description: "Claimant supplies a purchase receipt" }
      - { name: proof_description_detail, type: enum, source: input, description: "Detail level of the claimant's independent description", constraints: "one of {BRIEF, DETAILED}" }
      - { name: proof_score, type: integer, source: computed, description: "Weighted verification score per claim_proof_score calculation; recomputed at creation, resubmission, and claimant id_verification" }
      - { name: examiner_id, type: string, source: system, description: "X-User-ID of the ClaimsExaminer who started review", default: null }
      - { name: decision_reason, type: string, source: system, description: "Free-text reason; auto-set to ITEM_AWARDED or ITEM_EVIDENCE on cascade rejections", default: null }
      - { name: pre_stay_status, type: enum, source: system, description: "Status the claim held before being STAYED by a law-enforcement referral; restored on return-to-custody", default: null, constraints: "null or one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}" }

  - name: Inquiry
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; item inquired about", default: null }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; used for SLA variant when item_id absent; both absent -> FACILITY variant", default: null }
      - { name: contact_email, type: string, source: input, description: "Inquirer's email" }
      - { name: subject, type: string, source: input, description: "Subject line" }
      - { name: message, type: string, source: input, description: "Inquiry body" }
      - { name: status, type: enum, source: system, description: "OPEN | ANSWERED | CLOSED", constraints: "one of {OPEN, ANSWERED, CLOSED}" }
      - { name: sla_deadline, type: datetime, source: computed, description: "Response deadline per inquiry_sla_deadline calculation (TRANSIT 24h, FACILITY 72h)" }
      - { name: answer_text, type: string, source: system, description: "Staff answer body", default: null }
      - { name: answered_by, type: string, source: system, description: "X-User-ID of answering IntakeOfficer", default: null }

  - name: AuctionEvent
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue whose calendar is occupied [starts_at, ends_at)" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; must equal the venue's program_id" }
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (exclusive); must be strictly after starts_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}" }
      - { name: gross_proceeds_cents, type: integer, source: computed, description: "Sum of hammer_price_cents over SOLD lots; set at settle", default: null }
      - { name: total_commission_cents, type: integer, source: computed, description: "Sum of per-lot commissions; set at settle", default: null }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "gross_proceeds_cents - total_commission_cents; set at settle", default: null }

  - name: AuctionLot
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> AuctionEvent.id; parent event" }
      - { name: title, type: string, source: input, description: "Lot title" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SOLD | CLOSED_UNSOLD | CANCELLED", constraints: "one of {DRAFT, PUBLISHED, SOLD, CLOSED_UNSOLD, CANCELLED}" }
      - { name: minimum_bid_cents, type: integer, source: computed, description: "Sum of per-item floor prices (each rounded HALF_UP to whole cents before summing) per lot_minimum_bid calculation", default: 0 }
      - { name: hammer_price_cents, type: integer, source: system, description: "Winning bid recorded at finalize-sale", default: null }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the AuctionCoordinator who created the lot; that user may not finalize its sale" }
      - { name: finalized_by, type: string, source: system, description: "X-User-ID of the AuctionCoordinator who finalized the sale", default: null }

  - name: LotItem
    parent: null
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> AuctionLot.id; containing lot" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; lotted item (an item may appear in at most one non-terminal lot at a time)" }
      - { name: floor_price_cents, type: integer, source: computed, description: "round_half_up(declared_value_cents * tier rate) computed at add-time: LOW 10%, MID 20%, HIGH 30%" }

  - name: ReferralCase
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; referred item" }
      - { name: agency_name, type: string, source: input, description: "Law-enforcement agency" }
      - { name: case_number, type: string, source: input, description: "Agency case reference" }
      - { name: status, type: enum, source: system, description: "REFERRED | IN_CUSTODY | RETURNED | CONVERTED_TO_EVIDENCE", constraints: "one of {REFERRED, IN_CUSTODY, RETURNED, CONVERTED_TO_EVIDENCE}" }
      - { name: referred_by, type: string, source: system, description: "X-User-ID of the PoliceLiaison who created the referral" }

  - name: ReleaseRecord
    parent: null
    common_fields: false
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; released item" }
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the APPROVED claim this release satisfies" }
      - { name: released_by, type: string, source: system, description: "X-User-ID of the ReleaseOfficer performing handover" }
      - { name: handover_method, type: enum, source: input, description: "IN_PERSON | MAIL", constraints: "one of {IN_PERSON, MAIL}" }
      - { name: id_document_ref, type: string, source: input, description: "Reference to the claimant ID document inspected at handover" }
      - { name: released_at, type: datetime, source: system, description: "Server timestamp of release" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Item
    initial_state: STORED
    terminal_states: [RELEASED, EVIDENCE, SOLD, DISPOSED, DONATED]
    transitions:
      - from: STORED
        to: LISTED
        trigger: "POST /items/{item_id}/publish"
        actor: IntakeOfficer
        preconditions:
          - "item.status == STORED"
          - "item.is_identification == false (ERR_IDENTIFICATION_NOT_LISTABLE otherwise)"
          - "program of item.program_id has active == true (ERR_PROGRAM_INACTIVE otherwise)"
        side_effects:
          - "increments Item.version by 1"
      - from: LISTED
        to: STORED
        trigger: "POST /items/{item_id}/unpublish"
        actor: IntakeOfficer
        preconditions:
          - "item.status == LISTED"
        side_effects:
          - "increments Item.version by 1"
      - from: STORED
        to: REFERRED_TO_LE
        trigger: "POST /items/{item_id}/refer-to-law-enforcement"
        actor: PoliceLiaison
        preconditions:
          - "item.status IN {STORED, LISTED}"
        side_effects:
          - "creates ReferralCase(status=REFERRED, item_id, referred_by=X-User-ID)"
          - "every Claim with claim.item_id == item.id and status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} transitions to STAYED, storing its current status in pre_stay_status (Claim.version += 1 each)"
          - "increments Item.version by 1"
      - from: LISTED
        to: REFERRED_TO_LE
        trigger: "POST /items/{item_id}/refer-to-law-enforcement"
        actor: PoliceLiaison
        preconditions:
          - "item.status IN {STORED, LISTED}"
        side_effects:
          - "creates ReferralCase(status=REFERRED, item_id, referred_by=X-User-ID)"
          - "every Claim with claim.item_id == item.id and status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} transitions to STAYED, storing its current status in pre_stay_status (Claim.version += 1 each)"
          - "increments Item.version by 1"
      - from: REFERRED_TO_LE
        to: IN_LE_CUSTODY
        trigger: "POST /referrals/{referral_id}/confirm-pickup"
        actor: PoliceLiaison
        preconditions:
          - "referral.status == REFERRED"
          - "item.status == REFERRED_TO_LE"
        side_effects:
          - "ReferralCase REFERRED -> IN_CUSTODY (version += 1)"
          - "recompute storage_occupancy for item.storage_location_id (slot freed)"
          - "increments Item.version by 1"
      - from: IN_LE_CUSTODY
        to: STORED
        trigger: "POST /referrals/{referral_id}/return-to-custody"
        actor: PoliceLiaison
        preconditions:
          - "referral.status == IN_CUSTODY"
          - "item.status == IN_LE_CUSTODY"
        side_effects:
          - "ReferralCase IN_CUSTODY -> RETURNED (version += 1)"
          - "every Claim with claim.item_id == item.id and status == STAYED transitions back to its pre_stay_status and clears pre_stay_status (Claim.version += 1 each)"
          - "recompute storage_occupancy for item.storage_location_id (slot re-occupied)"
          - "increments Item.version by 1"
      - from: IN_LE_CUSTODY
        to: EVIDENCE
        trigger: "POST /referrals/{referral_id}/convert-to-evidence"
        actor: PoliceLiaison
        preconditions:
          - "referral.status == IN_CUSTODY"
          - "item.status == IN_LE_CUSTODY"
        side_effects:
          - "ReferralCase IN_CUSTODY -> CONVERTED_TO_EVIDENCE (version += 1)"
          - "every Claim with claim.item_id == item.id and status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, STAYED} transitions to REJECTED with decision_reason = ITEM_EVIDENCE (Claim.version += 1 each)"
          - "increments Item.version by 1"
      - from: STORED
        to: AUCTION_ELIGIBLE
        trigger: "POST /_sweeps/retention (system sweep at current logical clock)"
        actor: system
        preconditions:
          - "current_utc >= item.retention_deadline"
          - "item.retention_policy.disposal_method == AUCTION"
        side_effects:
          - "increments Item.version by 1"
      - from: LISTED
        to: AUCTION_ELIGIBLE
        trigger: "POST /_sweeps/retention (system sweep at current logical clock)"
        actor: system
        preconditions:
          - "current_utc >= item.retention_deadline"
          - "item.retention_policy.disposal_method == AUCTION"
        side_effects:
          - "increments Item.version by 1"
      - from: STORED
        to: DISPOSAL_PENDING
        trigger: "POST /_sweeps/retention (system sweep at current logical clock)"
        actor: system
        preconditions:
          - "current_utc >= item.retention_deadline"
          - "item.retention_policy.disposal_method IN {DESTRUCTION, DONATION}"
        side_effects:
          - "sets item.pending_disposal_method = retention_policy.disposal_method"
          - "increments Item.version by 1"
      - from: LISTED
        to: DISPOSAL_PENDING
        trigger: "POST /_sweeps/retention (system sweep at current logical clock)"
        actor: system
        preconditions:
          - "current_utc >= item.retention_deadline"
          - "item.retention_policy.disposal_method IN {DESTRUCTION, DONATION}"
        side_effects:
          - "sets item.pending_disposal_method = retention_policy.disposal_method"
          - "increments Item.version by 1"
      - from: AUCTION_ELIGIBLE
        to: LOTTED
        trigger: "POST /auction-lots/{lot_id}/items"
        actor: AuctionCoordinator
        preconditions:
          - "item.status == AUCTION_ELIGIBLE (ERR_ITEM_NOT_AUCTION_ELIGIBLE otherwise)"
          - "lot.status == DRAFT"
          - "item.program_id == lot.event.program_id (ERR_CROSS_PROGRAM_REFERENCE otherwise)"
          - "lot.minimum_bid_cents + item floor price <= lot.event.venue.insurance_cap_cents (ERR_INSURANCE_CAP_EXCEEDED otherwise)"
        side_effects:
          - "creates LotItem(lot_id, item_id, floor_price_cents per lot_minimum_bid)"
          - "recompute lot.minimum_bid_cents"
          - "increments AuctionLot.version by 1"
          - "increments Item.version by 1"
      - from: LOTTED
        to: AUCTION_ELIGIBLE
        trigger: "DELETE /auction-lots/{lot_id}/items/{item_id} OR cascade from auction-event cancel OR lot close-unsold with unsold_count below threshold"
        actor: AuctionCoordinator
        preconditions:
          - "for DELETE: lot.status == DRAFT and item.status == LOTTED"
        side_effects:
          - "deletes the LotItem row (DELETE path)"
          - "recompute lot.minimum_bid_cents"
          - "increments Item.version by 1"
        note: "close-unsold path increments item.unsold_count first; item lands in AUCTION_ELIGIBLE only when new unsold_count < 2"
      - from: LOTTED
        to: SOLD
        trigger: "POST /auction-lots/{lot_id}/finalize-sale"
        actor: AuctionCoordinator
        preconditions:
          - "lot.status == PUBLISHED"
          - "item.status == LOTTED"
        side_effects:
          - "recompute storage_occupancy for item.storage_location_id (slot freed)"
          - "increments Item.version by 1"
      - from: LOTTED
        to: DISPOSAL_PENDING
        trigger: "POST /auction-lots/{lot_id}/close-unsold (unsold escalation)"
        actor: AuctionCoordinator
        preconditions:
          - "lot.status == PUBLISHED"
          - "item.unsold_count + 1 >= 2"
        side_effects:
          - "sets item.unsold_count += 1 and item.pending_disposal_method = DESTRUCTION"
          - "increments Item.version by 1"
      - from: STORED
        to: RELEASE_PENDING
        trigger: "POST /claims/{claim_id}/approve (cascade)"
        actor: system
        preconditions:
          - "claim.status == UNDER_REVIEW and claim.item_id == item.id"
        side_effects:
          - "increments Item.version by 1"
      - from: LISTED
        to: RELEASE_PENDING
        trigger: "POST /claims/{claim_id}/approve (cascade)"
        actor: system
        preconditions:
          - "claim.status == UNDER_REVIEW and claim.item_id == item.id"
        side_effects:
          - "increments Item.version by 1"
      - from: RELEASE_PENDING
        to: RELEASED
        trigger: "POST /items/{item_id}/release"
        actor: ReleaseOfficer
        preconditions:
          - "item.status == RELEASE_PENDING"
          - "X-User-ID != item.intake_officer_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
          - "X-User-ID != examiner_id of the APPROVED claim on this item (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "creates ReleaseRecord(item_id, claim_id of the APPROVED claim, released_by=X-User-ID, handover_method, id_document_ref, released_at=now)"
          - "the APPROVED Claim on this item transitions APPROVED -> RELEASED (Claim.version += 1)"
          - "recompute storage_occupancy for item.storage_location_id (slot freed)"
          - "increments Item.version by 1"
      - from: DISPOSAL_PENDING
        to: DISPOSED
        trigger: "POST /items/{item_id}/dispose"
        actor: PropertyCustodian
        preconditions:
          - "item.status == DISPOSAL_PENDING"
          - "input method == DESTRUCTION and method == item.pending_disposal_method (ERR_DISPOSAL_METHOD_MISMATCH otherwise)"
        side_effects:
          - "recompute storage_occupancy for item.storage_location_id (slot freed)"
          - "increments Item.version by 1"
      - from: DISPOSAL_PENDING
        to: DONATED
        trigger: "POST /items/{item_id}/dispose"
        actor: PropertyCustodian
        preconditions:
          - "item.status == DISPOSAL_PENDING"
          - "input method == DONATION and method == item.pending_disposal_method (ERR_DISPOSAL_METHOD_MISMATCH otherwise)"
        side_effects:
          - "recompute storage_occupancy for item.storage_location_id (slot freed)"
          - "increments Item.version by 1"

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN, RELEASED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{claim_id}/start-review"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "sets claim.examiner_id = X-User-ID"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /claims/{claim_id}/request-info"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "claim.examiner_id == X-User-ID (ERR_FORBIDDEN otherwise)"
        side_effects:
          - "stores info_request_text"
          - "increments Claim.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /claims/{claim_id}/resubmit"
        actor: Claimant
        preconditions:
          - "claim.status == INFO_REQUESTED"
          - "claim.claimant_id == X-User-ID (ERR_FORBIDDEN otherwise)"
        side_effects:
          - "replaces proof_* inputs with the resubmission payload"
          - "recompute claim.proof_score per claim_proof_score"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{claim_id}/approve"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "claim.examiner_id == X-User-ID (ERR_FORBIDDEN otherwise)"
          - "item of claim.item_id has status IN {STORED, LISTED} (ERR_INVALID_STATE otherwise)"
          - "claim.proof_score >= tier threshold of item.value_tier (LOW >= 40, MID >= 60, HIGH >= 80) and, for HIGH, claimant.id_verified == true (ERR_CLAIM_PROOF_INSUFFICIENT otherwise)"
          - "X-User-ID != item.intake_officer_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "item transitions {STORED, LISTED} -> RELEASE_PENDING (Item.version += 1)"
          - "every OTHER Claim with claim.item_id == item.id and status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} transitions to REJECTED with decision_reason = ITEM_AWARDED (Claim.version += 1 each)"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /claims/{claim_id}/reject"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "claim.examiner_id == X-User-ID (ERR_FORBIDDEN otherwise)"
        side_effects:
          - "stores decision_reason from input"
          - "increments Claim.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /claims/{claim_id}/withdraw"
        actor: Claimant
        preconditions:
          - "claim.status IN {SUBMITTED, INFO_REQUESTED}"
          - "claim.claimant_id == X-User-ID (ERR_FORBIDDEN otherwise)"
        side_effects:
          - "increments Claim.version by 1"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /claims/{claim_id}/withdraw"
        actor: Claimant
        preconditions:
          - "claim.status IN {SUBMITTED, INFO_REQUESTED}"
          - "claim.claimant_id == X-User-ID (ERR_FORBIDDEN otherwise)"
        side_effects:
          - "increments Claim.version by 1"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /items/{item_id}/release (cascade)"
        actor: system
        preconditions:
          - "item of claim.item_id transitions RELEASE_PENDING -> RELEASED in the same request"
        side_effects:
          - "increments Claim.version by 1"
      - from: SUBMITTED
        to: STAYED
        trigger: "POST /items/{item_id}/refer-to-law-enforcement (cascade)"
        actor: system
        preconditions:
          - "claim.item_id == referred item"
        side_effects:
          - "stores current status in pre_stay_status"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: STAYED
        trigger: "POST /items/{item_id}/refer-to-law-enforcement (cascade)"
        actor: system
        preconditions:
          - "claim.item_id == referred item"
        side_effects:
          - "stores current status in pre_stay_status"
          - "increments Claim.version by 1"
      - from: INFO_REQUESTED
        to: STAYED
        trigger: "POST /items/{item_id}/refer-to-law-enforcement (cascade)"
        actor: system
        preconditions:
          - "claim.item_id == referred item"
        side_effects:
          - "stores current status in pre_stay_status"
          - "increments Claim.version by 1"
      - from: STAYED
        to: SUBMITTED
        trigger: "POST /referrals/{referral_id}/return-to-custody (cascade; restores pre_stay_status)"
        actor: system
        preconditions:
          - "claim.status == STAYED and claim.pre_stay_status == SUBMITTED"
        side_effects:
          - "clears pre_stay_status"
          - "increments Claim.version by 1"
      - from: STAYED
        to: UNDER_REVIEW
        trigger: "POST /referrals/{referral_id}/return-to-custody (cascade; restores pre_stay_status)"
        actor: system
        preconditions:
          - "claim.status == STAYED and claim.pre_stay_status == UNDER_REVIEW"
        side_effects:
          - "clears pre_stay_status"
          - "increments Claim.version by 1"
      - from: STAYED
        to: INFO_REQUESTED
        trigger: "POST /referrals/{referral_id}/return-to-custody (cascade; restores pre_stay_status)"
        actor: system
        preconditions:
          - "claim.status == STAYED and claim.pre_stay_status == INFO_REQUESTED"
        side_effects:
          - "clears pre_stay_status"
          - "increments Claim.version by 1"

  - entity: ReferralCase
    initial_state: REFERRED
    terminal_states: [RETURNED, CONVERTED_TO_EVIDENCE]
    transitions:
      - from: REFERRED
        to: IN_CUSTODY
        trigger: "POST /referrals/{referral_id}/confirm-pickup"
        actor: PoliceLiaison
        preconditions:
          - "referral.status == REFERRED"
        side_effects:
          - "item transitions REFERRED_TO_LE -> IN_LE_CUSTODY (Item.version += 1); occupancy slot freed"
          - "increments ReferralCase.version by 1"
      - from: IN_CUSTODY
        to: RETURNED
        trigger: "POST /referrals/{referral_id}/return-to-custody"
        actor: PoliceLiaison
        preconditions:
          - "referral.status == IN_CUSTODY"
        side_effects:
          - "item transitions IN_LE_CUSTODY -> STORED (Item.version += 1); STAYED claims restored; occupancy slot re-occupied"
          - "increments ReferralCase.version by 1"
      - from: IN_CUSTODY
        to: CONVERTED_TO_EVIDENCE
        trigger: "POST /referrals/{referral_id}/convert-to-evidence"
        actor: PoliceLiaison
        preconditions:
          - "referral.status == IN_CUSTODY"
        side_effects:
          - "item transitions IN_LE_CUSTODY -> EVIDENCE (Item.version += 1); open/STAYED claims on it auto-REJECTED with decision_reason = ITEM_EVIDENCE"
          - "increments ReferralCase.version by 1"

  - entity: Inquiry
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ANSWERED
        trigger: "POST /inquiries/{inquiry_id}/answer"
        actor: IntakeOfficer
        preconditions:
          - "inquiry.status == OPEN"
        side_effects:
          - "sets answer_text, answered_by = X-User-ID"
          - "increments Inquiry.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /inquiries/{inquiry_id}/close"
        actor: IntakeOfficer
        preconditions:
          - "inquiry.status IN {OPEN, ANSWERED}"
        side_effects:
          - "increments Inquiry.version by 1"
      - from: ANSWERED
        to: CLOSED
        trigger: "POST /inquiries/{inquiry_id}/close"
        actor: IntakeOfficer
        preconditions:
          - "inquiry.status IN {OPEN, ANSWERED}"
        side_effects:
          - "increments Inquiry.version by 1"

  - entity: AuctionEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /auction-events/{event_id}/cancel"
        actor: AuctionCoordinator
        preconditions:
          - "event.status == SCHEDULED"
        side_effects:
          - "every AuctionLot with lot.event_id == event.id and status IN {DRAFT, PUBLISHED} transitions to CANCELLED (AuctionLot.version += 1 each)"
          - "every Item lotted in those cancelled lots transitions LOTTED -> AUCTION_ELIGIBLE with NO change to unsold_count (Item.version += 1 each); their LotItem rows are deleted; each affected lot's minimum_bid_cents recomputed (to 0)"
          - "increments AuctionEvent.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /auction-events/{event_id}/settle"
        actor: AuctionCoordinator
        preconditions:
          - "event.status == SCHEDULED"
          - "current_utc >= event.ends_at (ERR_EVENT_STILL_OPEN otherwise)"
          - "every AuctionLot with lot.event_id == event.id has status IN {SOLD, CLOSED_UNSOLD, CANCELLED} (ERR_LOTS_NOT_FINAL otherwise)"
        side_effects:
          - "compute gross_proceeds_cents, total_commission_cents, net_proceeds_cents per auction_settlement"
          - "increments AuctionEvent.version by 1"

  - entity: AuctionLot
    initial_state: DRAFT
    terminal_states: [SOLD, CLOSED_UNSOLD, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /auction-lots/{lot_id}/publish"
        actor: AuctionCoordinator
        preconditions:
          - "lot.status == DRAFT"
          - "count of LotItem rows with lot_id == lot.id >= 1 (ERR_LOT_EMPTY otherwise)"
        side_effects:
          - "increments AuctionLot.version by 1"
      - from: PUBLISHED
        to: SOLD
        trigger: "POST /auction-lots/{lot_id}/finalize-sale"
        actor: AuctionCoordinator
        preconditions:
          - "lot.status == PUBLISHED"
          - "input hammer_price_cents >= lot.minimum_bid_cents (ERR_BELOW_MINIMUM_BID otherwise)"
          - "X-User-ID != lot.created_by (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "sets lot.hammer_price_cents and lot.finalized_by = X-User-ID"
          - "every Item lotted in this lot transitions LOTTED -> SOLD (Item.version += 1 each); occupancy slots freed"
          - "increments AuctionLot.version by 1"
      - from: PUBLISHED
        to: CLOSED_UNSOLD
        trigger: "POST /auction-lots/{lot_id}/close-unsold"
        actor: AuctionCoordinator
        preconditions:
          - "lot.status == PUBLISHED"
        side_effects:
          - "every lotted Item: unsold_count += 1; if new unsold_count >= 2 then Item -> DISPOSAL_PENDING with pending_disposal_method = DESTRUCTION else Item -> AUCTION_ELIGIBLE (Item.version += 1 each)"
          - "LotItem rows of this lot are deleted; lot.minimum_bid_cents recomputed (to 0)"
          - "increments AuctionLot.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /auction-events/{event_id}/cancel (cascade)"
        actor: system
        preconditions:
          - "lot.event_id == cancelled event"
        side_effects:
          - "lotted Items -> AUCTION_ELIGIBLE without unsold_count change; LotItem rows deleted; minimum_bid_cents recomputed (to 0)"
          - "increments AuctionLot.version by 1"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /auction-events/{event_id}/cancel (cascade)"
        actor: system
        preconditions:
          - "lot.event_id == cancelled event"
        side_effects:
          - "lotted Items -> AUCTION_ELIGIBLE without unsold_count change; LotItem rows deleted; minimum_bid_cents recomputed (to 0)"
          - "increments AuctionLot.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: claim-create-stale-item
    parent_entity: Item
    write_endpoint: "POST /claims"
    occ_field: "expected_item_version"
    description: |
      Creating a Claim against an Item whose version has advanced since the
      claimant last observed it is rejected with ERR_STALE_ITEM_VERSION. The
      claimant's view of the item (storage state, other claims, referral
      status) is stale, so the claim must be re-based on a fresh read.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412
  - rule_id: lot-add-item-stale-lot
    parent_entity: AuctionLot
    write_endpoint: "POST /auction-lots/{lot_id}/items"
    occ_field: "expected_lot_version"
    description: |
      Adding an item to an AuctionLot whose version has advanced since the
      coordinator last observed it is rejected with ERR_STALE_LOT_VERSION,
      because the lot's composition and minimum_bid_cents have changed and the
      coordinator's insurance-cap reasoning is stale.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
  - rule_id: policy-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /retention-policies"
    occ_field: "expected_program_version"
    description: |
      Creating a RetentionPolicy (which supersedes any active policy with the
      same key) against a Program whose version has advanced since the admin
      last observed it is rejected with ERR_STALE_PROGRAM_VERSION, because the
      policy set the admin reviewed is no longer current.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: item_value_tier
    trigger: "on Item creation (and never recomputed afterwards)"
    algorithm: threshold
    formula: |
      if declared_value_cents < TIER_LOW_MAX_EXCLUSIVE:      value_tier = LOW
      elif declared_value_cents < TIER_MID_MAX_EXCLUSIVE:    value_tier = MID
      else:                                                  value_tier = HIGH
      # boundaries: 10000 -> MID (inclusive), 100000 -> HIGH (inclusive)
    input_set: "the Item being created"
    constants:
      TIER_LOW_MAX_EXCLUSIVE: 10000
      TIER_MID_MAX_EXCLUSIVE: 100000
    precision: "integer cents; exact comparisons"
    variants: []

  - name: retention_deadline
    trigger: "on Item creation, after retention_policy_id is resolved"
    algorithm: threshold
    formula: |
      policy = active RetentionPolicy with (program_id, category, value_tier) of the item
      if program.program_type == TRANSIT:
          retention_deadline = found_at + retention_days * 24h        # hour-precise
      else:  # FACILITY
          retention_deadline = (date(found_at) + retention_days + 1 day) at 00:00:00Z
          # i.e. the item is held for the whole found calendar day PLUS retention_days
          # full calendar days; expiry at the next midnight boundary
    input_set: "the Item being created, its Program, its active RetentionPolicy"
    constants: {}
    precision: "ISO 8601 UTC, second precision"
    variants:
      - name: transit_hour_precise
        when: "owning program.program_type == TRANSIT"
        difference: "deadline = found_at + retention_days * 24 hours (preserves time-of-day)"
      - name: facility_calendar_day
        when: "owning program.program_type == FACILITY"
        difference: "deadline = midnight UTC following (calendar date of found_at + retention_days); time-of-day of found_at is discarded"

  - name: claim_proof_score
    trigger: "on Claim creation, on Claim resubmit, and on Claimant id_verification (recomputes all of that claimant's claims in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED})"
    algorithm: weighted_scoring
    formula: |
      score = 0
      if claimant.id_verified:                    score += W_ID_VERIFIED   # 30
      if claim.proof_serial:                      score += W_SERIAL        # 30
      if claim.proof_photo:                       score += W_PHOTO         # 15
      if claim.proof_description_detail == DETAILED: score += W_DETAIL     # 15
      if claim.proof_receipt:                     score += W_RECEIPT       # 10
      # approval threshold is conditional on the claimed item's value_tier:
      #   LOW:  score >= 40
      #   MID:  score >= 60
      #   HIGH: score >= 80 AND claimant.id_verified == true
    input_set: "the Claim, its Claimant, and the claimed Item's value_tier"
    constants:
      W_ID_VERIFIED: 30
      W_SERIAL: 30
      W_PHOTO: 15
      W_DETAIL: 15
      W_RECEIPT: 10
      THRESHOLD_LOW: 40
      THRESHOLD_MID: 60
      THRESHOLD_HIGH: 80
    precision: "integer score; exact comparisons"
    variants: []

  - name: lot_minimum_bid
    trigger: "on LotItem creation, on LotItem removal (DELETE or cascade), on lot close-unsold and event-cancel cascades"
    algorithm: aggregation
    formula: |
      rate(tier) = LOW -> 0.10, MID -> 0.20, HIGH -> 0.30
      per_item_floor_cents = round_half_up(item.declared_value_cents * rate(item.value_tier))
      # PINNED ROUNDING ORDER: round each item's floor to whole cents FIRST,
      # then sum the rounded floors. Summing raw values then rounding is FORBIDDEN.
      minimum_bid_cents = sum(per_item_floor_cents for each LotItem in the lot)
      # empty lot -> minimum_bid_cents = 0
    input_set: "all LotItem rows with lot_id == lot.id (regardless of item status, which is always LOTTED for members)"
    constants:
      RATE_LOW: 0.10
      RATE_MID: 0.20
      RATE_HIGH: 0.30
    precision: "integer cents; round_half_up per item before summation"
    variants: []

  - name: storage_occupancy
    trigger: "on Item creation, Item move, and every Item status transition that enters or leaves the occupying set"
    algorithm: aggregation
    formula: |
      occupied_slots(location) = count of Item where
          item.storage_location_id == location.id
          AND item.status IN {STORED, LISTED, RELEASE_PENDING, REFERRED_TO_LE,
                              AUCTION_ELIGIBLE, LOTTED, DISPOSAL_PENDING}
      # IN_LE_CUSTODY and all terminal states do NOT occupy a slot.
    input_set: "all Items referencing the StorageLocation, filtered by the occupying status set above"
    constants: {}
    precision: "integer count"
    variants: []

  - name: inquiry_sla_deadline
    trigger: "on Inquiry creation"
    algorithm: threshold
    formula: |
      program = program of inquiry.item_id if item_id present
                else program of inquiry.program_id if present
                else null
      if program != null and program.program_type == TRANSIT:
          sla_deadline = created_at + 24 hours
      else:  # FACILITY program, or no program context at all
          sla_deadline = created_at + 72 hours
    input_set: "the Inquiry being created and its resolved Program (if any)"
    constants:
      TRANSIT_SLA_HOURS: 24
      FACILITY_SLA_HOURS: 72
    precision: "ISO 8601 UTC, second precision"
    variants:
      - name: transit_sla
        when: "resolved program.program_type == TRANSIT"
        difference: "24-hour response deadline"
      - name: facility_sla
        when: "resolved program is FACILITY-typed or absent"
        difference: "72-hour response deadline"

  - name: auction_settlement
    trigger: "on POST /auction-events/{event_id}/settle"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER (breaks the apparent commission<->proceeds cycle):
      # (1) gross first; (2) commission tier keyed on GROSS; (3) per-lot commission;
      # (4) net = gross - total_commission.
      gross_proceeds_cents = sum(lot.hammer_price_cents for lots of event with status == SOLD)
      if gross_proceeds_cents < COMMISSION_TIER1_MAX:        rate = 0.10
      elif gross_proceeds_cents < COMMISSION_TIER2_MAX:      rate = 0.08
      else:                                                  rate = 0.06
      total_commission_cents = sum(round_half_up(lot.hammer_price_cents * rate)
                                   for each SOLD lot)   # per-lot rounding, then sum
      net_proceeds_cents = gross_proceeds_cents - total_commission_cents
      # event with zero SOLD lots -> gross = 0, commission = 0, net = 0
    input_set: "AuctionLot rows with event_id == event.id and status == SOLD (CLOSED_UNSOLD and CANCELLED lots excluded)"
    constants:
      COMMISSION_TIER1_MAX: 1000000
      COMMISSION_TIER2_MAX: 5000000
      RATE_TIER1: 0.10
      RATE_TIER2: 0.08
      RATE_TIER3: 0.06
    precision: "integer cents; per-lot round_half_up before summation"
    variants: []

  - name: unsold_escalation
    trigger: "on POST /auction-lots/{lot_id}/close-unsold, per lotted item"
    algorithm: threshold
    formula: |
      item.unsold_count += 1
      if item.unsold_count >= MAX_UNSOLD_CYCLES:
          item.status = DISPOSAL_PENDING; item.pending_disposal_method = DESTRUCTION
      else:
          item.status = AUCTION_ELIGIBLE
      # event-cancel and manual LotItem removal do NOT increment unsold_count
    input_set: "Items with status LOTTED in the lot being closed"
    constants:
      MAX_UNSOLD_CYCLES: 2
    precision: "integer count; >= comparison"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID present for all roles except PublicUser"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles; for Claimant endpoints, X-User-ID must equal the target claim's claimant_id (or body's claimant_id on create)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path parameters resolve left-to-right (program/location/venue/item/claim/inquiry/referral/event/lot ids)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "body-referenced FK ids exist (program_id, storage_location_id, item_id, claimant_id, venue_id, event_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /items, POST /items/{item_id}/move, POST /claims, POST /inquiries, POST /auction-events, POST /auction-lots, POST /auction-lots/{lot_id}/items, POST /retention-policies, POST /storage-locations, POST /venues"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412
    applies_to: "POST /claims (item), POST /auction-lots/{lot_id}/items (lot -> ERR_STALE_LOT_VERSION), POST /retention-policies (program -> ERR_STALE_PROGRAM_VERSION)"
  - priority: 6
    category: state
    check: "target resource's current state permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "claim creation: item.status IN {STORED, LISTED}"
    error_id: ERR_ITEM_NOT_CLAIMABLE
    http_status: 409
    applies_to: "POST /claims"
  - priority: 8
    category: state
    check: "lot add-item: item.status == AUCTION_ELIGIBLE"
    error_id: ERR_ITEM_NOT_AUCTION_ELIGIBLE
    http_status: 409
    applies_to: "POST /auction-lots/{lot_id}/items"
  - priority: 9
    category: state
    check: "event settle: every lot of the event is in {SOLD, CLOSED_UNSOLD, CANCELLED}"
    error_id: ERR_LOTS_NOT_FINAL
    http_status: 409
    applies_to: "POST /auction-events/{event_id}/settle"
  - priority: 10
    category: business_safety
    check: "identification items (category ID_DOCUMENT) may never be publicly listed"
    error_id: ERR_IDENTIFICATION_NOT_LISTABLE
    http_status: 422
    applies_to: "POST /items/{item_id}/publish"
  - priority: 11
    category: business_safety
    check: "claim approval: proof_score >= tier threshold (LOW 40 / MID 60 / HIGH 80) and claimant.id_verified for HIGH tier"
    error_id: ERR_CLAIM_PROOF_INSUFFICIENT
    http_status: 422
    applies_to: "POST /claims/{claim_id}/approve"
  - priority: 12
    category: business_safety
    check: "segregation of duties: release officer != item intake officer and != approving examiner; lot finalizer != lot creator; claim approver != item intake officer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /items/{item_id}/release, POST /auction-lots/{lot_id}/finalize-sale, POST /claims/{claim_id}/approve"
  - priority: 13
    category: business_constraint
    check: "owning program must be active for item intake and publish"
    error_id: ERR_PROGRAM_INACTIVE
    http_status: 409
    applies_to: "POST /items, POST /items/{item_id}/publish"
  - priority: 14
    category: business_constraint
    check: "target storage location must be active for intake and move"
    error_id: ERR_LOCATION_INACTIVE
    http_status: 409
    applies_to: "POST /items, POST /items/{item_id}/move"
  - priority: 15
    category: business_constraint
    check: "storage location deactivation requires occupied_slots == 0"
    error_id: ERR_LOCATION_NOT_EMPTY
    http_status: 409
    applies_to: "POST /storage-locations/{location_id}/deactivate"
  - priority: 16
    category: business_constraint
    check: "storage capacity: occupied_slots + incoming (1) <= capacity_slots; a full location (occupied == capacity) rejects"
    error_id: ERR_STORAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /items, POST /items/{item_id}/move"
  - priority: 17
    category: business_constraint
    check: "HIGH-tier items may only be stored in locations with supports_high_value == true"
    error_id: ERR_SECURE_STORAGE_REQUIRED
    http_status: 422
    applies_to: "POST /items, POST /items/{item_id}/move"
  - priority: 18
    category: business_constraint
    check: "an active RetentionPolicy must exist for (program_id, category, computed value_tier)"
    error_id: ERR_NO_RETENTION_POLICY
    http_status: 422
    applies_to: "POST /items"
  - priority: 19
    category: business_constraint
    check: "dispose input method must equal item.pending_disposal_method"
    error_id: ERR_DISPOSAL_METHOD_MISMATCH
    http_status: 422
    applies_to: "POST /items/{item_id}/dispose"
  - priority: 20
    category: business_constraint
    check: "lot publish requires at least one LotItem"
    error_id: ERR_LOT_EMPTY
    http_status: 422
    applies_to: "POST /auction-lots/{lot_id}/publish"
  - priority: 21
    category: business_temporal
    check: "event window: ends_at strictly greater than starts_at"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /auction-events"
  - priority: 22
    category: business_temporal
    check: "venue half-open interval overlap: no other SCHEDULED or COMPLETED event at the same venue may occupy [starts_at, ends_at); adjacency (existing.ends_at == new.starts_at or new.ends_at == existing.starts_at) is allowed"
    error_id: ERR_VENUE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /auction-events"
  - priority: 23
    category: business_temporal
    check: "event settle requires current_utc >= event.ends_at"
    error_id: ERR_EVENT_STILL_OPEN
    http_status: 409
    applies_to: "POST /auction-events/{event_id}/settle"
  - priority: 24
    category: business_referential
    check: "cross-program consistency: event.program_id must equal venue.program_id; lotted item's program_id must equal event.program_id"
    error_id: ERR_CROSS_PROGRAM_REFERENCE
    http_status: 422
    applies_to: "POST /auction-events, POST /auction-lots/{lot_id}/items"
  - priority: 25
    category: business_fiscal
    check: "insurance cap: lot.minimum_bid_cents + candidate item floor price <= venue.insurance_cap_cents"
    error_id: ERR_INSURANCE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /auction-lots/{lot_id}/items"
  - priority: 26
    category: business_fiscal
    check: "hammer price must be >= lot.minimum_bid_cents"
    error_id: ERR_BELOW_MINIMUM_BID
    http_status: 422
    applies_to: "POST /auction-lots/{lot_id}/finalize-sale"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- system / test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time. The logical clock drives every server-stamped timestamp (created_at, updated_at, released_at) and every time-gated rule (retention sweep, event settle window, SLA deadlines)."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequent server timestamps and time-gated rule evaluations use the new clock value"]
  - method: POST
    path: "/_sweeps/retention"
    description: "Ops-run sweep: every Item in {STORED, LISTED} whose retention_deadline <= current logical clock transitions to AUCTION_ELIGIBLE (policy disposal_method == AUCTION) or DISPOSAL_PENDING (DESTRUCTION/DONATION, pending_disposal_method set)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { transitioned_count: integer, transitioned_item_ids: list }
    side_effects: ["applies retention sweep transitions per §1.2 Item machine"]

  # ---- programs & policies & storage & venues ----
  - method: POST
    path: "/programs"
    description: "Create a lost-and-found program (TRANSIT or FACILITY)."
    roles: [ProgramAdmin]
    code: 201
    input: [name, program_type, contact_email]
    output: Program
    side_effects: []
  - method: GET
    path: "/programs"
    description: "List programs."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["program_type?", "active?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: GET
    path: "/programs/{program_id}"
    description: "Get one program."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: POST
    path: "/programs/{program_id}/deactivate"
    description: "Deactivate a program (blocks new item intake and publishing)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["sets active = false", "increments Program.version by 1"]
  - method: POST
    path: "/retention-policies"
    description: "Create a retention policy; supersedes (deactivates) any active policy with the same (program_id, item_category, value_tier). OCC-guarded on the parent Program."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, item_category, value_tier, retention_days, disposal_method, expected_program_version]
    output: RetentionPolicy
    side_effects: ["deactivates superseded policy (its version += 1) if key matches", "increments Program.version by 1"]
  - method: GET
    path: "/retention-policies"
    description: "List retention policies."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["program_id?", "item_category?", "value_tier?", "active?", "limit?", "offset?"]
    output: RetentionPolicy[]
    side_effects: []
  - method: GET
    path: "/retention-policies/{policy_id}"
    description: "Get one retention policy."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: RetentionPolicy
    side_effects: []
  - method: POST
    path: "/storage-locations"
    description: "Create a storage location."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, name, capacity_slots, supports_high_value]
    output: StorageLocation
    side_effects: []
  - method: GET
    path: "/storage-locations"
    description: "List storage locations."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["program_id?", "active?", "limit?", "offset?"]
    output: StorageLocation[]
    side_effects: []
  - method: GET
    path: "/storage-locations/{location_id}"
    description: "Get one storage location including computed occupied_slots."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: StorageLocation
    side_effects: []
  - method: POST
    path: "/storage-locations/{location_id}/deactivate"
    description: "Deactivate a storage location; requires occupied_slots == 0."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: StorageLocation
    side_effects: ["sets active = false", "increments StorageLocation.version by 1"]
  - method: POST
    path: "/venues"
    description: "Create an auction venue."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, name, address, insurance_cap_cents]
    output: Venue
    side_effects: []
  - method: GET
    path: "/venues"
    description: "List venues."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []
  - method: GET
    path: "/venues/{venue_id}"
    description: "Get one venue."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # ---- claimants ----
  - method: POST
    path: "/claimants"
    description: "Register a claimant (public self-service)."
    roles: [PublicUser]
    code: 201
    input: [full_name, email, "phone?"]
    output: Claimant
    side_effects: []
  - method: GET
    path: "/claimants/{claimant_id}"
    description: "Get a claimant; Claimant role may only read its own record."
    roles: [ClaimsExaminer, ReleaseOfficer, ProgramAdmin, Claimant]
    code: 200
    input: []
    output: Claimant
    side_effects: []
  - method: POST
    path: "/claimants/{claimant_id}/verify-id"
    description: "Mark the claimant's ID as verified; recomputes proof_score of that claimant's claims in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}."
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claimant
    side_effects: ["sets id_verified = true", "increments Claimant.version by 1", "recompute claim_proof_score for affected claims (Claim.version += 1 each)"]

  # ---- items ----
  - method: POST
    path: "/items"
    description: "Register found property. Server computes value_tier, is_identification, retention_policy_id, retention_deadline; any client-sent value_tier is ignored. intake_officer_id = X-User-ID."
    roles: [IntakeOfficer]
    code: 201
    input: [program_id, storage_location_id, category, declared_value_cents, description, found_at, found_location, "external_ref?", "value_tier?"]
    output: Item
    side_effects: ["compute item_value_tier", "resolve active RetentionPolicy and compute retention_deadline", "recompute storage_occupancy for storage_location_id", "status = STORED"]
  - method: GET
    path: "/items"
    description: "Staff item list with filters."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["program_id?", "storage_location_id?", "retention_policy_id?", "status?", "category?", "value_tier?", "limit?", "offset?"]
    output: Item[]
    side_effects: []
  - method: GET
    path: "/items/{item_id}"
    description: "Staff item read."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Item
    side_effects: []
  - method: GET
    path: "/public/items"
    description: "Public searchable inventory: only Items with status == LISTED and is_identification == false are returned; response includes only id, category, description, found_at, found_location, program_id (no storage location, value, or claimant data)."
    roles: [PublicUser, Claimant]
    code: 200
    input: ["category?", "keyword?", "program_id?", "limit?", "offset?"]
    output: Item[]
    side_effects: []
  - method: POST
    path: "/items/{item_id}/publish"
    description: "Make a stored item publicly searchable (STORED -> LISTED)."
    roles: [IntakeOfficer]
    code: 200
    input: []
    output: Item
    side_effects: ["Item STORED -> LISTED", "increments Item.version by 1"]
  - method: POST
    path: "/items/{item_id}/unpublish"
    description: "Remove an item from public search (LISTED -> STORED)."
    roles: [IntakeOfficer]
    code: 200
    input: []
    output: Item
    side_effects: ["Item LISTED -> STORED", "increments Item.version by 1"]
  - method: POST
    path: "/items/{item_id}/move"
    description: "Move an item to a different storage location (capacity, active, and secure-storage checks apply)."
    roles: [PropertyCustodian]
    code: 200
    input: [storage_location_id]
    output: Item
    side_effects: ["recompute storage_occupancy for source and destination locations", "increments Item.version by 1"]
  - method: POST
    path: "/items/{item_id}/dispose"
    description: "Dispose of a DISPOSAL_PENDING item via destruction or donation."
    roles: [PropertyCustodian]
    code: 200
    input: [method]
    output: Item
    side_effects: ["Item DISPOSAL_PENDING -> DISPOSED or DONATED", "recompute storage_occupancy", "increments Item.version by 1"]
  - method: POST
    path: "/items/{item_id}/release"
    description: "Release an item with an APPROVED claim to its owner; creates a ReleaseRecord. Segregation of duties enforced."
    roles: [ReleaseOfficer]
    code: 200
    input: [handover_method, id_document_ref]
    output: Item
    side_effects: ["Item RELEASE_PENDING -> RELEASED", "creates ReleaseRecord", "APPROVED Claim -> RELEASED", "recompute storage_occupancy", "increments Item.version by 1"]
  - method: POST
    path: "/items/{item_id}/refer-to-law-enforcement"
    description: "Refer a stored/listed item to law enforcement; creates a ReferralCase and STAYs open claims on the item."
    roles: [PoliceLiaison]
    code: 201
    input: [agency_name, case_number]
    output: ReferralCase
    side_effects: ["Item -> REFERRED_TO_LE", "open Claims on item -> STAYED (pre_stay_status stored)", "creates ReferralCase REFERRED", "increments Item.version by 1"]

  # ---- referrals ----
  - method: GET
    path: "/referrals"
    description: "List referral cases."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["item_id?", "status?", "limit?", "offset?"]
    output: ReferralCase[]
    side_effects: []
  - method: GET
    path: "/referrals/{referral_id}"
    description: "Get one referral case."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: ReferralCase
    side_effects: []
  - method: POST
    path: "/referrals/{referral_id}/confirm-pickup"
    description: "Confirm law enforcement picked up the item (REFERRED -> IN_CUSTODY; item -> IN_LE_CUSTODY, slot freed)."
    roles: [PoliceLiaison]
    code: 200
    input: []
    output: ReferralCase
    side_effects: ["Item REFERRED_TO_LE -> IN_LE_CUSTODY", "recompute storage_occupancy (slot freed)", "increments ReferralCase.version by 1"]
  - method: POST
    path: "/referrals/{referral_id}/return-to-custody"
    description: "Law enforcement returns the item (IN_CUSTODY -> RETURNED; item -> STORED; STAYED claims restored)."
    roles: [PoliceLiaison]
    code: 200
    input: []
    output: ReferralCase
    side_effects: ["Item IN_LE_CUSTODY -> STORED", "STAYED Claims restored to pre_stay_status", "recompute storage_occupancy (slot re-occupied)", "increments ReferralCase.version by 1"]
  - method: POST
    path: "/referrals/{referral_id}/convert-to-evidence"
    description: "Convert the held item to evidence (terminal); open claims auto-rejected with ITEM_EVIDENCE."
    roles: [PoliceLiaison]
    code: 200
    input: []
    output: ReferralCase
    side_effects: ["Item IN_LE_CUSTODY -> EVIDENCE", "open/STAYED Claims -> REJECTED (decision_reason = ITEM_EVIDENCE)", "increments ReferralCase.version by 1"]

  # ---- claims ----
  - method: POST
    path: "/claims"
    description: "File an ownership claim. claimant_id must equal X-User-ID. OCC-guarded on the Item."
    roles: [Claimant]
    code: 201
    input: [item_id, claimant_id, proof_serial, proof_photo, proof_receipt, proof_description_detail, expected_item_version]
    output: Claim
    side_effects: ["compute claim_proof_score", "status = SUBMITTED", "increments Item.version by 1"]
  - method: GET
    path: "/claims"
    description: "List claims; Claimant role sees only its own."
    roles: [ClaimsExaminer, ReleaseOfficer, PoliceLiaison, ProgramAdmin, Claimant]
    code: 200
    input: ["item_id?", "claimant_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/claims/{claim_id}"
    description: "Get one claim; Claimant role may only read its own."
    roles: [ClaimsExaminer, ReleaseOfficer, PoliceLiaison, ProgramAdmin, Claimant]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/claims/{claim_id}/start-review"
    description: "Begin examiner review (SUBMITTED -> UNDER_REVIEW); records examiner_id."
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects: ["sets examiner_id = X-User-ID", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{claim_id}/request-info"
    description: "Ask claimant for more evidence (UNDER_REVIEW -> INFO_REQUESTED)."
    roles: [ClaimsExaminer]
    code: 200
    input: [info_request_text]
    output: Claim
    side_effects: ["increments Claim.version by 1"]
  - method: POST
    path: "/claims/{claim_id}/resubmit"
    description: "Claimant resubmits with new proof flags (INFO_REQUESTED -> SUBMITTED); proof_score recomputed."
    roles: [Claimant]
    code: 200
    input: [proof_serial, proof_photo, proof_receipt, proof_description_detail]
    output: Claim
    side_effects: ["recompute claim_proof_score", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{claim_id}/approve"
    description: "Approve a claim (requires score threshold, item still claimable, segregation of duties). Cascades: item -> RELEASE_PENDING, competing claims auto-rejected."
    roles: [ClaimsExaminer]
    code: 200
    input: ["decision_reason?"]
    output: Claim
    side_effects: ["Item {STORED, LISTED} -> RELEASE_PENDING", "other open Claims on item -> REJECTED (ITEM_AWARDED)", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{claim_id}/reject"
    description: "Reject a claim under review."
    roles: [ClaimsExaminer]
    code: 200
    input: [decision_reason]
    output: Claim
    side_effects: ["increments Claim.version by 1"]
  - method: POST
    path: "/claims/{claim_id}/withdraw"
    description: "Claimant withdraws an open claim."
    roles: [Claimant]
    code: 200
    input: []
    output: Claim
    side_effects: ["increments Claim.version by 1"]

  # ---- inquiries ----
  - method: POST
    path: "/inquiries"
    description: "Submit a public inquiry; sla_deadline computed per program variant (TRANSIT 24h / FACILITY 72h / none 72h)."
    roles: [PublicUser]
    code: 201
    input: ["item_id?", "program_id?", contact_email, subject, message]
    output: Inquiry
    side_effects: ["compute inquiry_sla_deadline", "status = OPEN"]
  - method: GET
    path: "/inquiries"
    description: "List inquiries."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["item_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Inquiry[]
    side_effects: []
  - method: GET
    path: "/inquiries/{inquiry_id}"
    description: "Get one inquiry."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Inquiry
    side_effects: []
  - method: POST
    path: "/inquiries/{inquiry_id}/answer"
    description: "Answer an open inquiry (OPEN -> ANSWERED)."
    roles: [IntakeOfficer]
    code: 200
    input: [answer_text]
    output: Inquiry
    side_effects: ["sets answer_text, answered_by", "increments Inquiry.version by 1"]
  - method: POST
    path: "/inquiries/{inquiry_id}/close"
    description: "Close an inquiry (OPEN/ANSWERED -> CLOSED)."
    roles: [IntakeOfficer]
    code: 200
    input: []
    output: Inquiry
    side_effects: ["increments Inquiry.version by 1"]

  # ---- auction events ----
  - method: POST
    path: "/auction-events"
    description: "Schedule an auction event at a venue; half-open [starts_at, ends_at) overlap check per venue."
    roles: [AuctionCoordinator]
    code: 201
    input: [venue_id, program_id, name, starts_at, ends_at]
    output: AuctionEvent
    side_effects: []
  - method: GET
    path: "/auction-events"
    description: "List auction events."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["venue_id?", "program_id?", "status?", "limit?", "offset?"]
    output: AuctionEvent[]
    side_effects: []
  - method: GET
    path: "/auction-events/{event_id}"
    description: "Get one auction event."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: AuctionEvent
    side_effects: []
  - method: POST
    path: "/auction-events/{event_id}/cancel"
    description: "Cancel a scheduled event; cascades to DRAFT/PUBLISHED lots and returns their items to AUCTION_ELIGIBLE without incrementing unsold_count."
    roles: [AuctionCoordinator]
    code: 200
    input: []
    output: AuctionEvent
    side_effects: ["lots {DRAFT, PUBLISHED} -> CANCELLED", "lotted Items -> AUCTION_ELIGIBLE (no unsold_count change)", "LotItem rows deleted", "increments AuctionEvent.version by 1"]
  - method: POST
    path: "/auction-events/{event_id}/settle"
    description: "Settle a finished event: computes gross/commission/net per auction_settlement. Requires clock >= ends_at and all lots terminal."
    roles: [AuctionCoordinator]
    code: 200
    input: []
    output: AuctionEvent
    side_effects: ["compute auction_settlement fields", "AuctionEvent SCHEDULED -> COMPLETED", "increments AuctionEvent.version by 1"]

  # ---- auction lots ----
  - method: POST
    path: "/auction-lots"
    description: "Create a draft lot under an event; created_by = X-User-ID."
    roles: [AuctionCoordinator]
    code: 201
    input: [event_id, title]
    output: AuctionLot
    side_effects: []
  - method: GET
    path: "/auction-lots"
    description: "List lots."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["event_id?", "status?", "limit?", "offset?"]
    output: AuctionLot[]
    side_effects: []
  - method: GET
    path: "/auction-lots/{lot_id}"
    description: "Get one lot including computed minimum_bid_cents."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
