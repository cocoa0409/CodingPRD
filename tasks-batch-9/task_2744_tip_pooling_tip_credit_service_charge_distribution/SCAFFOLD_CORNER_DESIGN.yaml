            - "trigger 2 returns HTTP 422 with data.error_id == ERR_PARTIAL_AMOUNT_INVALID: awarded_cents 0 fails the strict lower bound, which is what makes DENIED a separate resolution rather than a zero award"
            - "trigger 3 returns HTTP 422 with data.error_id == ERR_PARTIAL_AMOUNT_INVALID: awarded_cents equal to claimed_amount_cents fails the strict upper bound, which is what makes UPHELD a separate resolution"
            - "trigger 4 returns HTTP 422 with data.error_id == ERR_PARTIAL_AMOUNT_INVALID: awarded_cents must be absent for UPHELD"
