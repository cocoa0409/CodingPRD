            - call: "POST /experience-mod-sheets"
              payload: { employer_id: "${employer_a}", rating_effective_date: "2026-01-01", expected_employer_version: "${employer_a_v}" }
              as: BureauAnalyst
              captures: { sheet_1: $.data.id }
            - call: "POST /experience-mod-sheets/${sheet_1}/promulgate"
              payload: {}
              as: BureauAnalyst
            - call: "POST /unit-stat-reports"
              payload: { policy_id: "${policy_p1}", correction_of_report_id: "${report_r1}", payroll_lines: [{ class_code: "3632", payroll_dollars: 2000000 } ], claim_lines: [{ claim_number: "C1", claim_type: "INDEMNITY", incurred_cents: 1600000, paid_cents: 1600000, claim_status: "CLOSED", state_code: "TX" }, { claim_number: "C2", claim_type: "INDEMNITY", incurred_cents: 1700000, paid_cents: 1700000, claim_status: "CLOSED", state_code: "TX" } ] }
