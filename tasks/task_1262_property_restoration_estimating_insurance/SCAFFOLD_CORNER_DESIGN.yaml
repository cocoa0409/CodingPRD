            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "FIRE", date_of_loss: "2026-04-15T00:00:00Z" }, as: ContractorAdmin, captures: { c2: $.data.id } }
          trigger:
            - { call: "GET /v1/claims?policy_id=${pol_id}&limit=1", payload: {}, as: Adjuster }
            - { call: "GET /v1/claims?policy_id=${pol_id}&status=COMPLETE", payload: {}, as: Adjuster }
          assert:
            - "first response: data has exactly 1 claim, total_count == 2, has_more == true"
            - "second response: data empty, total_count == 0, has_more == false"
