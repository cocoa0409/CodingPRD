              as: CertificationEngineer
              captures: { cert2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-09-30T00:00:00Z", window_end: "2026-10-15T00:00:00Z" }
              as: CertificationEngineer
              captures: { err: $.data.error_id }
            - call: "GET /driver-exchange/jurisdictions/${j_a}/system-participations"
              payload: {}
              as: AssociationAdmin
              captures: { p_status: "$.data[0].status" }
          assert:
            - "cert1 and cert2 are both non-null: the [2026-10-01T00:00:00Z, 2026-11-01T00:00:00Z) window touches but does not intersect [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)"
            - "err == ERR_CERT_WINDOW_OVERLAP for the 2026-09-30 start (one day of true intersection)"
            - "p_status == TESTING (ENROLLING -> TESTED on first schedule)"
            - "Exactly 2 certifications exist for the participation"

