          setup:
            - "Logical clock at 2028-04-10T09:00:00Z."
            - "ACTIVE PlanYear PY2027, covered_lives 6000, rxdc_deadline_date 2028-06-01."
            - "TPA contract ACTIVE with data_rights_status NOT_SECURED and gag_review_status COMPLIANT."
            - "One RxDataSubmission for reference_year 2027 in status OPEN and one EXPECTED VendorDataPackage on it for the TPA vendor (data_section D2_SPENDING, expected_record_count 1200)."
            - "A DATA_RIGHTS ContractAmendment on the TPA contract is still PROPOSED."
