      - name: sop_admin_cannot_approve_a_promotion_or_review_an_adjustment
        claim_type: Exclusive Operations
        grounds:
          - roles.SopAdmin
          - roles.DemandReviewLead
          - endpoints[POST /sop/promotions/{promotion_id}/approve]
          - endpoints[POST /sop/consensus-adjustments/{adjustment_id}/reviews]
        distinguishing_aspect: |
          SopAdmin is the widest role in the system — it owns all master data, opens cycles and
          even drives cycle transitions — yet both demand-review judgement calls are withheld
          from it. Two different endpoints must refuse the SAME actor with 403 ERR_UNAUTHORIZED
          while the DemandReviewLead is admitted to both on the identical rows.
        test_recipe:
          setup:
            - "The base family, one MATURE item and one customer; one DRAFT promotion for 2026-09..2026-09 (the logical clock stays at 2026-08-01T00:00:00Z so the horizon is open)."
            - "A cycle over 2026-09..2026-09 (commitment 0) in DEMAND_REVIEW with one 1000-unit forecast and one PROPOSED SALES_INTELLIGENCE adjustment of +100."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-09", end_month: "2026-09", lift_pct: 10, cannibalization_pct: 2 }
              as: SopAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-RBAC-ADMIN", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: SopAdmin
              captures: { fc_id: $.data.id, fc_v0: $.data.version }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "field intelligence", expected_demand_forecast_version: "${fc_v0}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id }
          trigger:
            - call: "POST /sop/promotions/${promo_id}/approve"
              payload: {}
              as: SopAdmin
              captures: { err_promo: $.data.error_id }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "ENDORSE" }
              as: SopAdmin
              captures: { err_review: $.data.error_id }
            - call: "POST /sop/promotions/${promo_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { promo_status: $.data.status }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "ENDORSE" }
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { adj_status: $.data.status }
          assert:
            - "${err_promo} == \"ERR_UNAUTHORIZED\" at 403 — the admin that CREATED the promotion may not approve it"
            - "${err_review} == \"ERR_UNAUTHORIZED\" at 403 — the admin that created the forecast may not endorse an adjustment on it"
            - "Neither refusal is 422 or 409: the promotion was DRAFT with an open horizon and the adjustment was PROPOSED, so both would have been legal for the right role"
            - "The lead succeeds on both rows: ${promo_status} == \"APPROVED\" and ${adj_status} == \"COMMITTED\""
            - "DemandForecast.${fc_id}.consensus_units == 1100 only after the lead's endorsement"

      - name: customer_rep_cannot_write_forecasts_or_adjustments
        claim_type: Exclusive Operations
        grounds:
          - roles.CustomerRep
          - endpoints[POST /sop/demand-forecasts]
          - endpoints[POST /sop/consensus-adjustments]
          - validations[priority=20]
        distinguishing_aspect: |
          CustomerRep has an EMPTY exclusive_operations list and no POST anywhere, so it is
          refused on writes that concern its OWN customer's own forecast line — the scope rule at
          priority 70 never gets a chance to "allow" a write just because the row belongs to the
          caller. Its read of the same forecast succeeds, which shows the identity resolved fine.
        test_recipe:
          setup:
            - "The base family, one MATURE item and one customer CUST-SELF; a cycle over 2026-09..2026-09 (commitment 0) in DEMAND_REVIEW with one 1000-unit forecast for CUST-SELF."
          setup_api_calls:
