              as: PlantOperator
            - call: "POST /processing-runs/${run_id}/hydrogen-securements"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantOperator
            - call: "POST /processing-runs/${run_id}/starts"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlantOperator
            - call: "POST /processing-runs/${run_id}/completions"
