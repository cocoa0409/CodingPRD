            - { call: "POST /lane-assignments/${lane_tb}/readings", payload: { pad_cs: 2500, backup1_cs: 2505, backup2_cs: 2507 }, as: TimingOperator }
            - { call: "POST /lane-assignments/${lane_tc}/readings", payload: { pad_cs: 2500, backup1_cs: 2505, backup2_cs: 2507 }, as: TimingOperator }
