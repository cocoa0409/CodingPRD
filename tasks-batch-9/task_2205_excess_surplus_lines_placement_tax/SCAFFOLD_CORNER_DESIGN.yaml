              payload: { naic_number: "50001", legal_name: "Tier One Exact Insurance Company", domicile_type: "US_STATE", capital_surplus_cents: 5000000000, am_best_rating: "A", trust_fund_cents: 0, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { c_t1_id: $.data.id }
            - call: "POST /carriers"
              payload: { naic_number: "50002", legal_name: "Tier One Minus One Insurance Company", domicile_type: "US_STATE", capital_surplus_cents: 4999999999, am_best_rating: "A", trust_fund_cents: 0, naic_quarterly_listing: true }
