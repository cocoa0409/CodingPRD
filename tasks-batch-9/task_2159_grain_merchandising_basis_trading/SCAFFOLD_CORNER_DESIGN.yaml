              payload: { fleet_id: "${fleet_id}", contract_id: "${c_id}", cars_requested: 25, placement_at: "2026-11-05T00:00:00Z", release_at: "2026-11-07T00:00:00Z", expected_fleet_version: "${fv0}" }
              as: FreightCoordinator
