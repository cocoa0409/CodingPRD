              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "TE", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0060", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m_te: $.data.id }
            - call: "POST /in-bond/movements/${m_te}/departure"
              payload: { seal_number: "SEAL-600" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/reports"
              payload: { movement_id: "${m_te}", port_id: "${p_chi}", report_type: "ARRIVAL", packages_reported: 3 }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/reports"
              payload: { movement_id: "${m_te}", port_id: "${p_chi}", report_type: "EXPORT", packages_reported: 3 }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { rep_exp: $.data.id, rep_exp_status: $.data.status }
          trigger:
            - call: "POST /in-bond/reports/${rep_exp}/proof"
              payload: { proof_of_export_ref: "BOL-88123", export_conveyance_ref: "VESSEL-ATLANTIC-9" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/reports/${rep_exp}/proof"
              payload: { proof_of_export_ref: "BOL-88124" }
              as: BondedCarrier
              as_user_id: "${c1}"
          assert:
            - "the setup EXPORT report came back with status == PENDING_PROOF (captured as ${rep_exp_status}) and the movement stayed ARRIVED"
            - "the first proof call returned HTTP 200"
            - "MovementReport.${rep_exp}.status == ACCEPTED"
            - "MovementReport.${rep_exp}.proof_of_export_ref == BOL-88123"
            - "MovementReport.${rep_exp}.export_conveyance_ref == VESSEL-ATLANTIC-9"
            - "InBondMovement.${m_te}.transit_status == CLOSED"
            - "InBondMovement.${m_te}.export_reported_at == 2026-08-12T00:00:00Z"
            - "CustomsBond.${b1}.obligated_amount == 0.00"
            - "CustomsBond.${b1}.available_amount == 50000.00"
