              payload: {}
              as: Dispatcher
              captures: { e_contractor: $.data.error_id }
            - call: "GET /hiring-hall/job-requests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { e_jr: $.data.error_id }
            - call: "GET /hiring-hall/dispatches/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { e_dispatch: $.data.error_id }
            - call: "GET /hiring-hall/grievances/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BusinessManager
              captures: { e_grievance: $.data.error_id }
            - call: "GET /hiring-hall/ledger-entries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HallAdmin
              captures: { e_ledger: $.data.error_id }
          assert:
            - "All seven reads return HTTP 404"
            - "${e_local} == ERR_LOCAL_NOT_FOUND and ${e_list} == ERR_LIST_NOT_FOUND"
            - "${e_contractor} == ERR_CONTRACTOR_NOT_FOUND and ${e_jr} == ERR_JOB_REQUEST_NOT_FOUND"
            - "${e_dispatch} == ERR_DISPATCH_NOT_FOUND and ${e_grievance} == ERR_GRIEVANCE_NOT_FOUND"
            - "${e_ledger} == ERR_LEDGER_ENTRY_NOT_FOUND"
