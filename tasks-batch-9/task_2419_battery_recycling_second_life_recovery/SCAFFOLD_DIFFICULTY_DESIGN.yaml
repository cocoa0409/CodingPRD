          domain and a different trigger from the finalize cascade): link 1 SupplierSettlement
          DRAFT -> POSTED freezing posted_amount_cents 30723, link 2 Supplier
          payable_balance_cents 0 -> 30723, link 3 credit_hold false -> true because 30723
          exceeds credit_limit_cents 20000, link 4 every RECEIVED Intake of that supplier moves
