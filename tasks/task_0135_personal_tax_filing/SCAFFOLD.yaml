scenario: |
  135. Personal Income Tax Filing (TurboTax style): W-2/1099-NEC/INT/DIV/B import, Schedule A/B/C/D/E,
  tax credits (EITC/CTC/AOTC), electronic filing, amended 1040X, Estimated Tax quarterly

domain_name: personal-tax-filing
api_prefix: /tax-returns

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - scheduled_deferred_actions
    - optimistic_concurrency
    - compliance_audit

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many          # TaxReturn -> IncomeDocument, Schedule, TaxCredit
    - polymorphic          # IncomeDocument.doc_type discriminates W-2/1099-NEC/INT/DIV/B
    - self_referential     # AmendedReturn references prior TaxReturn (1040X chain)
    - cross_aggregate      # EstimatedTaxPayment credits against TaxReturn settlement

  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Taxpayer
    parent: null
    common_fields: true
    fields:
      - name: ssn_last4
        type: string
        source: input
        description: "Last 4 digits of SSN (privacy-preserving identifier)"
        constraints: "exactly 4 digits"
      - name: full_name
        type: string
        source: input
        description: "Legal name as printed on return"
      - name: date_of_birth
        type: string
        source: input
        description: "Date of birth in YYYY-MM-DD"
      - name: filing_address
        type: object
        source: input
        description: "Mailing address with street, city, state, zip"
      - name: is_blind
        type: boolean
        source: input
        description: "Affects extra standard-deduction add-on per IRS rules"
        default: false
      - name: account_status
        type: enum
        source: system
        description: "Locks taxpayer if compliance hold is placed"
        default: ACTIVE
        constraints: "ACTIVE | LOCKED"

  - name: TaxReturn
    parent: Taxpayer
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK to Taxpayer"
      - name: tax_year
        type: integer
        source: input
        description: "Calendar tax year (e.g. 2025)"
        constraints: "2020 <= tax_year <= 2025"
      - name: filing_status
        type: enum
        source: input
        description: "IRS filing status"
        constraints: "SINGLE | MARRIED_JOINT | MARRIED_SEPARATE | HEAD_OF_HOUSEHOLD | QUALIFYING_SURVIVING_SPOUSE"
      - name: dependents_count
        type: integer
        source: input
        description: "Number of qualifying dependents claimed"
        default: 0
        constraints: ">= 0"
      - name: qualifying_children_under_17
        type: integer
        source: input
        description: "Subset of dependents that are qualifying children under 17 for CTC"
        default: 0
        constraints: ">= 0 and <= dependents_count"
      - name: status
        type: enum
        source: system
        description: "Return lifecycle state"
        default: DRAFT
        constraints: "DRAFT | READY_TO_FILE | FILED | ACCEPTED | REJECTED | AMENDED | SUPERSEDED"
      - name: deduction_method
        type: enum
        source: input
        description: "Which deduction the taxpayer elected"
        default: STANDARD
        constraints: "STANDARD | ITEMIZED"
      - name: total_income_cents
        type: integer
        source: computed
        description: "Sum of all imported IncomeDocument amounts in cents (AGI numerator)"
        default: 0
      - name: agi_cents
        type: integer
        source: computed
        description: "Adjusted Gross Income (cents). Computed by calc_agi."
        default: 0
      - name: taxable_income_cents
        type: integer
        source: computed
        description: "AGI minus chosen deduction (>= 0)"
        default: 0
      - name: regular_tax_cents
        type: integer
        source: computed
        description: "Tax from progressive brackets before credits"
        default: 0
      - name: amt_cents
        type: integer
        source: computed
        description: "Alternative Minimum Tax (parallel calculation)"
        default: 0
      - name: total_credits_cents
        type: integer
        source: computed
        description: "Sum of approved non-refundable + refundable credits applied this return"
        default: 0
      - name: total_withholding_cents
        type: integer
        source: computed
        description: "Sum of withholding from W-2 box 2 and 1099 federal withholding"
        default: 0
      - name: estimated_payments_applied_cents
        type: integer
        source: computed
        description: "Sum of confirmed EstimatedTaxPayment records for this taxpayer/tax_year"
        default: 0
      - name: balance_due_or_refund_cents
        type: integer
        source: computed
        description: "Positive = refund owed to taxpayer; negative = balance due to IRS"
        default: 0
      - name: filed_at
        type: datetime
        source: system
        description: "Timestamp when return entered FILED state"
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: "Timestamp when IRS accepted (entered ACCEPTED state)"
        default: null

  - name: IncomeDocument
    parent: TaxReturn
    common_fields: true
    fields:
      - name: tax_return_id
        type: string
        source: input
        description: "FK to TaxReturn"
      - name: doc_type
        type: enum
        source: input
        description: "Tax form type"
        constraints: "W2 | 1099_NEC | 1099_INT | 1099_DIV | 1099_B"
      - name: payer_ein
        type: string
        source: input
        description: "Employer/payer EIN"
      - name: payer_name
        type: string
        source: input
        description: "Payer legal name"
      - name: wages_cents
        type: integer
        source: input
        description: "W-2 box 1 wages. 0 for non-W2 forms"
        default: 0
      - name: federal_withholding_cents
        type: integer
        source: input
        description: "W-2 box 2 or 1099 federal income tax withheld"
        default: 0
      - name: nonemployee_comp_cents
        type: integer
        source: input
        description: "1099-NEC box 1 amount. 0 for non-NEC forms"
        default: 0
      - name: interest_income_cents
        type: integer
        source: input
        description: "1099-INT box 1 amount. 0 otherwise"
        default: 0
      - name: ordinary_dividends_cents
        type: integer
        source: input
        description: "1099-DIV box 1a (ordinary dividends). 0 otherwise"
        default: 0
      - name: qualified_dividends_cents
        type: integer
        source: input
        description: "1099-DIV box 1b (qualified). MUST be <= ordinary_dividends_cents"
        default: 0
      - name: proceeds_cents
        type: integer
        source: input
        description: "1099-B sale proceeds. 0 otherwise"
        default: 0
      - name: cost_basis_cents
        type: integer
        source: input
        description: "1099-B cost basis. 0 otherwise"
        default: 0
      - name: holding_period
        type: enum
        source: input
        description: "1099-B holding-period classification"
        default: NONE
        constraints: "NONE | SHORT_TERM | LONG_TERM"
      - name: imported_at
        type: datetime
        source: system
        description: "When this document was imported into the return"

  - name: Schedule
    parent: TaxReturn
    common_fields: true
    fields:
      - name: tax_return_id
        type: string
        source: input
        description: "FK to TaxReturn"
      - name: schedule_type
        type: enum
        source: input
        description: "IRS schedule code"
        constraints: "A | B | C | D | E"
      - name: itemized_medical_cents
        type: integer
        source: input
        description: "Schedule A medical/dental expenses (subject to 7.5% AGI floor)"
        default: 0
      - name: itemized_salt_cents
        type: integer
        source: input
        description: "Schedule A state and local tax (capped at $10,000)"
        default: 0
      - name: itemized_mortgage_interest_cents
        type: integer
        source: input
        description: "Schedule A mortgage interest"
        default: 0
      - name: itemized_charity_cents
        type: integer
        source: input
        description: "Schedule A charitable contributions (capped at 60% AGI)"
        default: 0
      - name: schedule_b_interest_cents
        type: integer
        source: computed
        description: "Schedule B total interest (mirrors sum of 1099-INT)"
        default: 0
      - name: schedule_b_dividends_cents
        type: integer
        source: computed
        description: "Schedule B total ordinary dividends (mirrors sum of 1099-DIV)"
        default: 0
      - name: schedule_c_gross_receipts_cents
        type: integer
        source: input
        description: "Schedule C self-employment gross receipts"
        default: 0
      - name: schedule_c_expenses_cents
        type: integer
        source: input
        description: "Schedule C deductible business expenses"
        default: 0
      - name: schedule_c_net_profit_cents
        type: integer
        source: computed
        description: "Schedule C net profit (gross_receipts - expenses); contributes to AGI and SE tax"
        default: 0
      - name: schedule_d_short_term_gain_cents
        type: integer
        source: computed
        description: "Net short-term gain/loss from 1099-B short-term lots"
        default: 0
      - name: schedule_d_long_term_gain_cents
        type: integer
        source: computed
        description: "Net long-term gain/loss from 1099-B long-term lots"
        default: 0
      - name: schedule_e_rental_income_cents
        type: integer
        source: input
        description: "Schedule E rental real estate income"
        default: 0
      - name: schedule_e_rental_expenses_cents
        type: integer
        source: input
        description: "Schedule E rental real estate expenses"
        default: 0
      - name: total_itemized_deduction_cents
        type: integer
        source: computed
        description: "Schedule A total after AGI floor + caps. 0 for non-A schedules"
        default: 0

  - name: TaxCredit
    parent: TaxReturn
    common_fields: true
    fields:
      - name: tax_return_id
        type: string
        source: input
        description: "FK to TaxReturn"
      - name: credit_type
        type: enum
        source: input
        description: "Credit code"
        constraints: "EITC | CTC | AOTC"
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Taxpayer-requested credit amount (cents). Server validates eligibility."
      - name: eligibility_status
        type: enum
        source: computed
        description: "Whether credit passed eligibility checks at compute time"
        default: PENDING
        constraints: "PENDING | ELIGIBLE | INELIGIBLE"
      - name: approved_amount_cents
        type: integer
        source: computed
        description: "Server-computed approved credit (cents) after phase-out and caps"
        default: 0
      - name: refundable_portion_cents
        type: integer
        source: computed
        description: "Portion that is refundable (EITC: full; CTC: up to $1700/child cap; AOTC: 40%)"
        default: 0
      - name: aotc_student_count
        type: integer
        source: input
        description: "Number of eligible students claimed (AOTC only). 0 otherwise."
        default: 0
      - name: aotc_qualified_expenses_cents
        type: integer
        source: input
        description: "AOTC qualified expenses per student aggregated"
        default: 0
      - name: ineligibility_reason
        type: string
        source: computed
        description: "Brief explanation if eligibility_status is INELIGIBLE"
        default: null

  - name: EFiling
    parent: TaxReturn
    common_fields: false
    fields:
      - name: tax_return_id
        type: string
        source: input
        description: "FK to TaxReturn that was filed"
      - name: submission_id
        type: string
        source: system
        description: "IRS submission identifier"
      - name: outcome
        type: enum
        source: system
        description: "Filing outcome"
        default: PENDING
        constraints: "PENDING | ACCEPTED | REJECTED"
      - name: rejection_code
        type: string
        source: system
        description: "IRS rejection code if outcome=REJECTED"
        default: null
      - name: rejection_message
        type: string
        source: system
        description: "Human-readable rejection explanation"
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: "When the submission was created"
      - name: processed_at
        type: datetime
        source: system
        description: "When the outcome was decided"
        default: null

  - name: AmendedReturn
    parent: TaxReturn
    common_fields: true
    fields:
      - name: original_return_id
        type: string
        source: input
        description: "FK to the prior TaxReturn (must be ACCEPTED)"
      - name: form_code
        type: string
        source: system
        description: "Always '1040X'"
        default: "1040X"
      - name: reason_summary
        type: string
        source: input
        description: "Short text explaining why the amendment is filed"
      - name: status
        type: enum
        source: system
        description: "Amendment lifecycle"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED"
      - name: delta_agi_cents
        type: integer
        source: computed
        description: "Restated_AGI - Original_AGI (can be negative)"
        default: 0
      - name: delta_tax_cents
        type: integer
        source: computed
        description: "Restated_tax - Original_tax (can be negative)"
        default: 0
      - name: delta_balance_due_or_refund_cents
        type: integer
        source: computed
        description: "Restated_balance - Original_balance (positive = additional refund; negative = additional owed)"
        default: 0
      - name: restated_return_snapshot
        type: object
        source: system
        description: "Snapshot of restated tax computation values at submission"
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "When amendment moved DRAFT->SUBMITTED"
        default: null

  - name: EstimatedTaxPayment
    parent: Taxpayer
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK to Taxpayer"
      - name: tax_year
        type: integer
        source: input
        description: "Tax year the quarterly payment applies to"
      - name: quarter
        type: enum
        source: input
        description: "Q1 | Q2 | Q3 | Q4 (IRS quarterly schedule)"
        constraints: "Q1 | Q2 | Q3 | Q4"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents (>0)"
      - name: scheduled_pay_date
        type: string
        source: input
        description: "Date payment is scheduled (YYYY-MM-DD)"
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle"
        default: SCHEDULED
        constraints: "SCHEDULED | CONFIRMED | CANCELLED"
      - name: confirmed_at
        type: datetime
        source: system
        description: "When payment moved SCHEDULED->CONFIRMED (clock-driven)"
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: "When payment was cancelled (before confirmation)"
        default: null

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: string
        source: system
        description: "Role that triggered the event"
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID of actor"
      - name: action
        type: string
        source: system
        description: "Action verb (e.g. RETURN_FILED, AMENDMENT_SUBMITTED, COMPLIANCE_LOCK)"
      - name: target_entity
        type: string
        source: system
        description: "Entity type acted upon"
      - name: target_id
        type: string
        source: system
        description: "Entity id acted upon"
      - name: payload
        type: object
        source: system
        description: "Structured event payload"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TaxReturn
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: READY_TO_FILE
        trigger: "POST /tax-returns/{id}/compute"
        actor: Taxpayer
        preconditions:
          - "Taxpayer.account_status == ACTIVE"
          - "filing_status is set"
          - "At least one IncomeDocument attached OR deduction_method == STANDARD with zero income"
          - "For each Schedule A attached, itemized_salt_cents <= 1_000_000 cents ($10,000 SALT cap input)"
          - "qualified_dividends_cents <= ordinary_dividends_cents on every 1099-DIV"
        side_effects:
          - "Run calc_agi → set agi_cents, total_income_cents"
          - "Run calc_taxable_income → set taxable_income_cents"
          - "Run calc_regular_tax → set regular_tax_cents"
          - "Run calc_amt → set amt_cents"
          - "Run calc_credits per TaxCredit row → set approved_amount_cents, eligibility_status"
          - "Run calc_balance_due_or_refund → set balance_due_or_refund_cents"
          - "Refresh Schedule.schedule_b_interest_cents, schedule_b_dividends_cents, schedule_d_short_term_gain_cents, schedule_d_long_term_gain_cents"

      - from: READY_TO_FILE
        to: DRAFT
        trigger: "Any PATCH/POST that modifies child IncomeDocument, Schedule, TaxCredit, or TaxReturn input fields"
        actor: Taxpayer
        preconditions:
          - "TaxReturn.status == READY_TO_FILE"
        side_effects:
          - "Invalidate computed fields: set agi_cents, taxable_income_cents, regular_tax_cents, amt_cents, total_credits_cents, balance_due_or_refund_cents back to 0"
          - "Set deduction_method untouched (still elected)"

      - from: READY_TO_FILE
        to: FILED
        trigger: "POST /tax-returns/{id}/efile"
        actor: Taxpayer
        preconditions:
          - "status == READY_TO_FILE"
          - "All TaxCredit.eligibility_status != PENDING (every claimed credit was evaluated)"
          - "Taxpayer.account_status == ACTIVE"
        side_effects:
          - "Create EFiling record with outcome=PENDING, submission_id=server-minted"
          - "Set filed_at = clock.now"
          - "Append AuditLog action=RETURN_FILED"

      - from: FILED
        to: ACCEPTED
        trigger: "POST /efilings/{id}/decide with outcome=ACCEPTED"
        actor: IRSAdjudicator
        preconditions:
          - "EFiling.outcome == PENDING"
        side_effects:
          - "EFiling.outcome = ACCEPTED, processed_at = clock.now"
          - "TaxReturn.accepted_at = clock.now"
          - "Append AuditLog action=RETURN_ACCEPTED"

      - from: FILED
        to: REJECTED
        trigger: "POST /efilings/{id}/decide with outcome=REJECTED"
        actor: IRSAdjudicator
        preconditions:
          - "EFiling.outcome == PENDING"
          - "rejection_code is provided"
        side_effects:
          - "EFiling.outcome = REJECTED, processed_at = clock.now"
          - "Append AuditLog action=RETURN_REJECTED"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /tax-returns/{id}/unlock-for-correction"
        actor: Taxpayer
        preconditions:
          - "status == REJECTED"
          - "Most recent EFiling.outcome == REJECTED"
        side_effects:
          - "Invalidate computed fields per READY_TO_FILE→DRAFT rule"
          - "Append AuditLog action=RETURN_REOPENED"

      - from: ACCEPTED
        to: AMENDED
        trigger: "POST /amendments/{amendment_id}/submit on an AmendedReturn whose original_return_id = this return"
        actor: Taxpayer
        preconditions:
          - "status == ACCEPTED"
          - "Linked AmendedReturn.status moves DRAFT→SUBMITTED in same operation"
        side_effects:
          - "Set status = AMENDED"
          - "Append AuditLog action=RETURN_AMENDED"

      - from: AMENDED
        to: SUPERSEDED
        trigger: "POST /amendments/{amendment_id}/decide with outcome=ACCEPTED"
        actor: IRSAdjudicator
        preconditions:
          - "Linked AmendedReturn.status == SUBMITTED"
        side_effects:
          - "Set status = SUPERSEDED (terminal)"
          - "Append AuditLog action=RETURN_SUPERSEDED"

  - entity: AmendedReturn
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /amendments/{id}/submit"
        actor: Taxpayer
        preconditions:
          - "AmendedReturn.status == DRAFT"
          - "original_return_id points to a TaxReturn with status == ACCEPTED"
          - "reason_summary is non-empty"
          - "At least one restated field differs from original snapshot"
        side_effects:
          - "Recompute restated AGI, tax, credits, balance using calc_agi/calc_taxable_income/calc_regular_tax/calc_amt/calc_credits"
          - "Set delta_agi_cents = restated_agi - original.agi_cents"
          - "Set delta_tax_cents = restated_tax - (original.regular_tax_cents max original.amt_cents) - restated_credits + original.total_credits_cents (sign-corrected per calc_amendment_delta)"
          - "Set delta_balance_due_or_refund_cents per calc_amendment_delta"
          - "Set restated_return_snapshot, submitted_at = clock.now"
          - "Cascade: TaxReturn.DRAFT→AMENDED transition fires on the original return"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /amendments/{id}/decide with outcome=ACCEPTED"
        actor: IRSAdjudicator
        preconditions:
          - "AmendedReturn.status == SUBMITTED"
        side_effects:
          - "Cascade: linked TaxReturn AMENDED→SUPERSEDED"
          - "Append AuditLog action=AMENDMENT_ACCEPTED"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /amendments/{id}/decide with outcome=REJECTED"
        actor: IRSAdjudicator
        preconditions:
          - "AmendedReturn.status == SUBMITTED"
          - "rejection_message provided"
        side_effects:
          - "Original TaxReturn status reverts from AMENDED back to ACCEPTED"
          - "Append AuditLog action=AMENDMENT_REJECTED"

  - entity: EFiling
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /efilings/{id}/decide outcome=ACCEPTED"
        actor: IRSAdjudicator
        preconditions:
          - "outcome == PENDING"
        side_effects:
          - "Cascade: linked TaxReturn FILED→ACCEPTED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /efilings/{id}/decide outcome=REJECTED"
        actor: IRSAdjudicator
        preconditions:
          - "outcome == PENDING"
          - "rejection_code provided"
        side_effects:
          - "Cascade: linked TaxReturn FILED→REJECTED"

  - entity: EstimatedTaxPayment
    initial_state: SCHEDULED
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "Automatic on POST /_clock/advance when clock.now >= scheduled_pay_date (00:00 UTC)"
        actor: system
        preconditions:
          - "Taxpayer.account_status == ACTIVE at confirmation time"
          - "status == SCHEDULED"
        side_effects:
          - "Set confirmed_at = clock.now"
          - "If a TaxReturn for the same taxpayer/tax_year is in DRAFT or READY_TO_FILE, increment its estimated_payments_applied_cents on next compute"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /estimated-payments/{id}/cancel"
        actor: Taxpayer
        preconditions:
          - "status == SCHEDULED"
          - "clock.now < scheduled_pay_date (strict, must cancel BEFORE the pay-date)"
        side_effects:
          - "Set cancelled_at = clock.now"

  - entity: Taxpayer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: LOCKED
        trigger: "POST /taxpayers/{id}/compliance-lock"
        actor: IRSAdjudicator
        preconditions:
          - "account_status == ACTIVE"
        side_effects:
          - "All this taxpayer's DRAFT TaxReturns remain DRAFT but cannot transition to READY_TO_FILE"
          - "All SCHEDULED EstimatedTaxPayments for this taxpayer auto-cancel (cascade)"
          - "Append AuditLog action=COMPLIANCE_LOCK"
      - from: LOCKED
        to: ACTIVE
        trigger: "POST /taxpayers/{id}/compliance-unlock"
        actor: IRSAdjudicator
        preconditions:
          - "account_status == LOCKED"
        side_effects:
          - "Append AuditLog action=COMPLIANCE_UNLOCK"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clients call POST /tax-returns/{id}/efile simultaneously"
    guarantee: "Exactly one efile request creates the EFiling record; the second sees status already FILED and is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TaxReturn.status transition READY_TO_FILE→FILED"

  - scenario: "Stale PATCH on TaxReturn after compute already advanced version"
    guarantee: "OCC: client version mismatch rejected; resource state preserved"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Compare-and-swap on TaxReturn.version"

  - scenario: "POST /tax-returns/{id}/compute races with PATCH on a child IncomeDocument"
    guarantee: "Whichever request sees TaxReturn.version first wins; loser must re-read and retry"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Compare-and-swap on TaxReturn.version (children mutations bump parent version)"

  - scenario: "Two AmendedReturn submissions on the same original TaxReturn"
    guarantee: "First submission moves original to AMENDED; second submission rejected because original no longer ACCEPTED"
    error_id: ERR_AMENDMENT_ALREADY_OPEN
    http_status: 409
    serialization: "First-writer-wins on TaxReturn.status ACCEPTED→AMENDED"

  - scenario: "Cancel and clock-advance hit the same EstimatedTaxPayment on its pay-date"
    guarantee: "Exactly one wins; cancel must observe clock.now < scheduled_pay_date strictly"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on EstimatedTaxPayment.status SCHEDULED→{CONFIRMED, CANCELLED}"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_agi
    trigger: "On POST /tax-returns/{id}/compute (DRAFT→READY_TO_FILE) and on AmendedReturn submit"
    algorithm: aggregation
    formula: |
      # All amounts in cents (integers). Pin evaluation order:
      total_wages = sum(IncomeDocument.wages_cents for doc_type=W2)
      total_nec   = sum(IncomeDocument.nonemployee_comp_cents for doc_type=1099_NEC)
      total_int   = sum(IncomeDocument.interest_income_cents for doc_type=1099_INT)
      total_div   = sum(IncomeDocument.ordinary_dividends_cents for doc_type=1099_DIV)
      schedule_c_net = max(0, sum(Schedule.schedule_c_gross_receipts_cents - Schedule.schedule_c_expenses_cents
                                  for Schedule.schedule_type=='C'))
      schedule_e_net = sum(Schedule.schedule_e_rental_income_cents - Schedule.schedule_e_rental_expenses_cents
                           for Schedule.schedule_type=='E')   # may be negative; floored at 0 for AGI
      schedule_e_net = max(0, schedule_e_net)
      cap_gains_net = schedule_d_short_term_gain_cents + schedule_d_long_term_gain_cents  # cap loss at -300000 cents ($3000) deduction
      cap_gains_net = max(cap_gains_net, -300000)
      total_income_cents = total_wages + total_nec + total_int + total_div
                          + schedule_c_net + schedule_e_net + cap_gains_net
      # Adjustments: deductible half of SE tax on schedule_c_net
      se_tax = floor(schedule_c_net * 9235 / 10000 * 1530 / 10000)   # 0.9235 * 0.153, integer cents
      half_se = se_tax // 2
      agi_cents = total_income_cents - half_se
    input_set: "All IncomeDocument with tax_return_id == this return; all Schedule rows with tax_return_id == this return"
    constants:
      SE_RATE_BPS: 1530           # 15.30% in basis points
      SE_NET_FACTOR_BPS: 9235     # 92.35% in basis points
      CAP_LOSS_FLOOR_CENTS: -300000  # max $3000 net capital loss deductible against ordinary income
    precision: "integer cents; truncation (floor division) on each integer ratio step in pin order"

  - name: calc_taxable_income
    trigger: "Immediately after calc_agi during compute"
    algorithm: threshold
    formula: |
      # Standard deduction lookup (2025-style, simplified) in cents:
      STD = {
        SINGLE: 1500000,                       # $15,000
        MARRIED_JOINT: 3000000,                # $30,000
        MARRIED_SEPARATE: 1500000,
        HEAD_OF_HOUSEHOLD: 2225000,            # $22,250
        QUALIFYING_SURVIVING_SPOUSE: 3000000
      }
      std_deduction = STD[filing_status] + (150000 if is_blind else 0)   # $1500 add-on

      if deduction_method == 'STANDARD':
          deduction = std_deduction
      else:  # ITEMIZED
          medical_floor = floor(agi_cents * 75 / 1000)                   # 7.5% of AGI floor
          medical_allowed = max(0, schedule_a.itemized_medical_cents - medical_floor)
          salt_allowed    = min(schedule_a.itemized_salt_cents, 1000000) # $10,000 SALT cap
          mortgage_allowed = schedule_a.itemized_mortgage_interest_cents
          charity_cap     = floor(agi_cents * 60 / 100)                  # 60% AGI cap
          charity_allowed = min(schedule_a.itemized_charity_cents, charity_cap)
          deduction = medical_allowed + salt_allowed + mortgage_allowed + charity_allowed

      taxable_income_cents = max(0, agi_cents - deduction)
    input_set: "agi_cents from calc_agi; filing_status; deduction_method; Schedule A row if present"
    constants:
      SALT_CAP_CENTS: 1000000
      MEDICAL_FLOOR_BPS: 750         # 7.5% of AGI
      CHARITY_CAP_PCT: 60
      BLIND_ADDON_CENTS: 150000
    precision: "integer cents; pin order: medical floor → SALT cap → charity cap → sum → subtract from AGI → floor at 0"
    variants:
      - name: standard_path
        when: "deduction_method == STANDARD"
        difference: "Use STD[filing_status] table directly; ignore Schedule A entirely"
      - name: itemized_path
        when: "deduction_method == ITEMIZED"
        difference: "Compute itemized deduction with AGI-dependent floors/caps from Schedule A; may yield smaller OR larger deduction than standard"

  - name: calc_regular_tax
    trigger: "Immediately after calc_taxable_income during compute"
    algorithm: tiered_pricing
    formula: |
      # 2025-style brackets (cents) by filing_status. Marginal rates in basis points (bps).
      BRACKETS_SINGLE = [
          (0,        1100000, 1000),  # 10% up to $11,000
          (1100000,  4475000, 1200),  # 12%
          (4475000,  9537500, 2200),  # 22%
          (9537500, 18222500, 2400),  # 24%
          (18222500, infinity, 3200)  # 32% top bucket (simplified)
      ]
      BRACKETS_MARRIED_JOINT = [
          (0,        2200000, 1000),
          (2200000,  8950000, 1200),
          (8950000, 19075000, 2200),
          (19075000, infinity, 2400)
      ]
      brackets = BRACKETS_SINGLE if filing_status in {SINGLE, MARRIED_SEPARATE}
                 else BRACKETS_MARRIED_JOINT if filing_status in {MARRIED_JOINT, QUALIFYING_SURVIVING_SPOUSE}
                 else BRACKETS_SINGLE   # HoH uses single brackets in this simplified model
      tax = 0
      for (lo, hi, bps) in brackets:
          if taxable_income_cents <= lo: break
          slice_top = min(taxable_income_cents, hi)
          slice_amt = slice_top - lo
          tax += floor(slice_amt * bps / 10000)   # truncate each bracket slice
      regular_tax_cents = tax
    input_set: "taxable_income_cents; filing_status"
    constants:
      ROUND_MODE: "floor per-bracket then sum"
    precision: "integer cents; PIN ORDER: compute each bracket slice → integer floor that slice → sum (do NOT sum then floor)"

  - name: calc_amt
    trigger: "Immediately after calc_regular_tax during compute"
    algorithm: forward_looking
    formula: |
      # Alternative Minimum Tax — parallel simplified calc:
      AMT_EXEMPTION = {
        SINGLE: 8550000,           # $85,500
        MARRIED_JOINT: 13325000,   # $133,250
        MARRIED_SEPARATE: 6662500,
        HEAD_OF_HOUSEHOLD: 8550000,
        QUALIFYING_SURVIVING_SPOUSE: 13325000
      }
      amti = agi_cents   # simplified: no preference adjustments
      exemption = AMT_EXEMPTION[filing_status]
      amt_base = max(0, amti - exemption)
      # 26% under $23222500, 28% above
      if amt_base <= 23222500:
          tentative_amt = floor(amt_base * 2600 / 10000)
      else:
          tentative_amt = floor(23222500 * 2600 / 10000) + floor((amt_base - 23222500) * 2800 / 10000)
      amt_cents = max(0, tentative_amt - regular_tax_cents)
      # Final tax used downstream = regular_tax_cents + amt_cents
    input_set: "agi_cents; filing_status; regular_tax_cents"
    constants:
      AMT_LOW_RATE_BPS: 2600
      AMT_HIGH_RATE_BPS: 2800
      AMT_BRACKET_BREAK_CENTS: 23222500
    precision: "integer cents; floor per-tier slice then sum; floor at 0"
    variants:
      - name: regular_only_path
        when: "amt_cents == 0 (AMTI doesn't exceed exemption / tentative_amt <= regular)"
        difference: "Final tax = regular_tax_cents"
      - name: amt_triggered_path
        when: "amt_cents > 0 (AMT add-on applies)"
        difference: "Final tax = regular_tax_cents + amt_cents; same inputs produce structurally different liability"

  - name: calc_credits
    trigger: "Immediately after calc_amt during compute; also on amendment submit"
    algorithm: waterfall_allocation
    formula: |
      # Phase-out and cap each credit. Apply in this PINNED ORDER: non-refundable first (CTC non-refundable, AOTC 60% non-refundable),
      # then refundable (EITC, CTC refundable up to $1700/child, AOTC 40%).
      final_tax = regular_tax_cents + amt_cents

      # --- CTC ---
      CTC_BASE_PER_CHILD = 200000                 # $2000/child
      CTC_REFUNDABLE_CAP_PER_CHILD = 170000       # $1700/child
      CTC_PHASEOUT_START = {SINGLE: 20000000, MARRIED_JOINT: 40000000,
                            MARRIED_SEPARATE: 20000000,
                            HEAD_OF_HOUSEHOLD: 20000000,
                            QUALIFYING_SURVIVING_SPOUSE: 40000000}
      CTC_PHASEOUT_RATE_BPS = 500                 # $50 per $1000 over threshold = 5%
      gross_ctc = qualifying_children_under_17 * CTC_BASE_PER_CHILD
      excess = max(0, agi_cents - CTC_PHASEOUT_START[filing_status])
      excess_rounded_up_thousand = ((excess + 99999) // 100000) * 100000   # round UP to next $1000
      phaseout = floor(excess_rounded_up_thousand * CTC_PHASEOUT_RATE_BPS / 10000)
      ctc_total = max(0, gross_ctc - phaseout)
      ctc_refundable = min(ctc_total, qualifying_children_under_17 * CTC_REFUNDABLE_CAP_PER_CHILD)
      ctc_nonrefundable = ctc_total - ctc_refundable

      # --- AOTC ---
      AOTC_MAX_PER_STUDENT = 250000               # $2500/student
      AOTC_PHASEOUT_START = {SINGLE: 8000000, MARRIED_JOINT: 16000000,
                             MARRIED_SEPARATE: 0,   # MFS ineligible
                             HEAD_OF_HOUSEHOLD: 8000000,
                             QUALIFYING_SURVIVING_SPOUSE: 16000000}
      AOTC_PHASEOUT_RANGE = {SINGLE: 1000000, MARRIED_JOINT: 2000000,
                             MARRIED_SEPARATE: 0,
                             HEAD_OF_HOUSEHOLD: 1000000,
                             QUALIFYING_SURVIVING_SPOUSE: 2000000}
      if filing_status == MARRIED_SEPARATE or aotc_student_count == 0:
          aotc_total = 0
      else:
          # Per student: 100% of first $2000 + 25% of next $2000
          per_student = min(aotc_qualified_expenses_cents / aotc_student_count, 400000)
          if per_student <= 200000:
              raw_per_student = per_student
          else:
              raw_per_student = 200000 + floor((per_student - 200000) * 2500 / 10000)
          aotc_gross = aotc_student_count * raw_per_student
          # Phase-out
          excess_a = max(0, agi_cents - AOTC_PHASEOUT_START[filing_status])
          if AOTC_PHASEOUT_RANGE[filing_status] == 0:
              aotc_total = 0
          elif excess_a >= AOTC_PHASEOUT_RANGE[filing_status]:
              aotc_total = 0
          else:
              retain_bps = 10000 - floor(excess_a * 10000 / AOTC_PHASEOUT_RANGE[filing_status])
              aotc_total = floor(aotc_gross * retain_bps / 10000)
      aotc_refundable = floor(aotc_total * 40 / 100)
      aotc_nonrefundable = aotc_total - aotc_refundable

      # --- EITC --- (simplified table-based)
      EITC_MAX = {0: 60000, 1: 400000, 2: 660000, 3: 740000}      # $600/$4000/$6600/$7400 caps by qualifying children
      EITC_PHASEOUT_START_SINGLE = {0: 1000000, 1: 2200000, 2: 2200000, 3: 2200000}
      EITC_PHASEOUT_END_SINGLE   = {0: 1882000, 1: 4949000, 2: 5535000, 3: 5907000}
      kids = min(qualifying_children_under_17, 3)
      if filing_status == MARRIED_SEPARATE:
          eitc_total = 0       # MFS ineligible
      elif agi_cents <= EITC_PHASEOUT_START_SINGLE[kids]:
          eitc_total = EITC_MAX[kids]
      elif agi_cents >= EITC_PHASEOUT_END_SINGLE[kids]:
          eitc_total = 0
      else:
          range_ = EITC_PHASEOUT_END_SINGLE[kids] - EITC_PHASEOUT_START_SINGLE[kids]
          retained_bps = 10000 - floor((agi_cents - EITC_PHASEOUT_START_SINGLE[kids]) * 10000 / range_)
          eitc_total = floor(EITC_MAX[kids] * retained_bps / 10000)
      eitc_refundable = eitc_total   # fully refundable

      # --- Apply waterfall, PIN ORDER: non-refundable first reducing final_tax (not below 0), refundable next ---
      nonref_pool = ctc_nonrefundable + aotc_nonrefundable
      applied_nonref = min(nonref_pool, final_tax)
      remaining_tax = final_tax - applied_nonref
      refundable_pool = ctc_refundable + aotc_refundable + eitc_refundable
      # Each credit row stores its own approved_amount_cents and refundable_portion_cents
    input_set: "TaxCredit rows for this return; agi_cents; filing_status; qualifying_children_under_17; aotc_student_count; aotc_qualified_expenses_cents; regular_tax_cents+amt_cents"
    constants:
      CTC_BASE_PER_CHILD_CENTS: 200000
      CTC_REFUNDABLE_CAP_PER_CHILD_CENTS: 170000
      CTC_PHASEOUT_STEP_CENTS: 100000
      CTC_PHASEOUT_RATE_BPS: 500
      AOTC_FIRST_TIER_CENTS: 200000
      AOTC_SECOND_TIER_RATE_BPS: 2500
      AOTC_REFUNDABLE_PCT: 40
    precision: "integer cents; PIN ORDER: per-credit phase-out → cap → split refundable/non-refundable → waterfall non-refundable first against (regular_tax + amt); refundable added afterward"
    variants:
      - name: refundable_excess_path
        when: "Sum of approved refundable credits > remaining_tax after non-refundable waterfall"
        difference: "Excess increases refund (balance_due_or_refund_cents positive)"
      - name: nonrefundable_capped_path
        when: "Non-refundable pool exceeds final_tax"
        difference: "Excess non-refundable evaporates (NOT carried to refund); refundable pool then applies to remaining 0 tax"

  - name: calc_balance_due_or_refund
    trigger: "Final step of compute; also on amendment submit"
    algorithm: aggregation
    formula: |
      final_tax = regular_tax_cents + amt_cents
      applied_nonref = min(ctc_nonrefundable + aotc_nonrefundable, final_tax)
      remaining_tax = final_tax - applied_nonref
      refundable_pool = ctc_refundable + aotc_refundable + eitc_refundable
      net_tax = remaining_tax - refundable_pool          # may be negative
      total_withholding_cents = sum(IncomeDocument.federal_withholding_cents)
      # estimated payments applied = sum of EstimatedTaxPayment with status==CONFIRMED, tax_year matches, taxpayer matches
      payments = total_withholding_cents + estimated_payments_applied_cents
      balance_due_or_refund_cents = payments - net_tax
      # positive = refund; negative = balance due
    input_set: "regular_tax_cents, amt_cents, TaxCredit rows, IncomeDocument withholding, EstimatedTaxPayment (CONFIRMED status)"
    constants: {}
    precision: "integer cents; PIN: waterfall non-refundable first (cap at final_tax), then subtract refundable pool (may produce negative net_tax), then add payments"

  - name: calc_amendment_delta
    trigger: "On POST /amendments/{id}/submit"
    algorithm: chronological
    formula: |
      # Reads original snapshot from TaxReturn fields; re-runs calc_agi → calc_taxable_income → calc_regular_tax →
      # calc_amt → calc_credits → calc_balance_due_or_refund on the AmendedReturn's modified data.
      delta_agi_cents = restated.agi_cents - original.agi_cents
      delta_tax_cents = (restated.regular_tax_cents + restated.amt_cents - restated.total_credits_cents)
                       - (original.regular_tax_cents + original.amt_cents - original.total_credits_cents)
      delta_balance_due_or_refund_cents = restated.balance_due_or_refund_cents - original.balance_due_or_refund_cents
      # Invariant: delta_balance_due_or_refund_cents == (original_net_tax - restated_net_tax)
      #            because payments are identical (same withholding + same confirmed estimated payments).
    input_set: "Original TaxReturn snapshot + AmendedReturn's restated values"
    constants: {}
    precision: "integer cents; signed differences"
    variants:
      - name: refund_increase
        when: "delta_balance_due_or_refund_cents > 0 (taxpayer owed more refund)"
        difference: "IRS owes additional refund equal to delta"
      - name: additional_owed
        when: "delta_balance_due_or_refund_cents < 0"
        difference: "Taxpayer owes additional tax equal to abs(delta)"

  - name: calc_estimated_payment_safe_harbor
    trigger: "GET /tax-returns/{id}/safe-harbor"
    algorithm: threshold
    formula: |
      # IRS safe harbor: avoid penalty if either:
      #   (a) total_withholding + confirmed estimated payments >= 90% of CURRENT year total tax, OR
      #   (b) >= 100% of PRIOR year total tax (110% if AGI > $150,000)
      current_tax = regular_tax_cents + amt_cents       # from current return compute
      payments_made = total_withholding_cents + estimated_payments_applied_cents
      threshold_current = ceil(current_tax * 90 / 100)
      prior_total_tax = lookup prior-year TaxReturn for same taxpayer (status in ACCEPTED, SUPERSEDED) by tax_year-1
      if prior_total_tax is null:
          prior_threshold = +infinity     # cannot use prior-year safe harbor
      elif agi_cents > 15000000:          # $150,000
          prior_threshold = ceil(prior_total_tax * 110 / 100)
      else:
          prior_threshold = ceil(prior_total_tax * 100 / 100)
      safe_harbor_met = (payments_made >= threshold_current) OR (payments_made >= prior_threshold)
    input_set: "Current return tax + payments; prior year TaxReturn"
    constants:
      SAFE_HARBOR_CURRENT_PCT: 90
      HIGH_INCOME_PRIOR_PCT: 110
      LOW_INCOME_PRIOR_PCT: 100
      HIGH_INCOME_THRESHOLD_CENTS: 15000000
    precision: "integer cents; ceil rounding on thresholds"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Referenced Taxpayer exists"
    error_id: ERR_TAXPAYER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing /taxpayers/{id}"

  - priority: 4
    category: existence
    check: "Referenced TaxReturn exists"
    error_id: ERR_RETURN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing /tax-returns/{id}"

  - priority: 5
    category: existence
    check: "Referenced IncomeDocument/Schedule/TaxCredit/EFiling/AmendedReturn/EstimatedTaxPayment exists"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all child-resource endpoints"

  - priority: 6
    category: state
    check: "Taxpayer.account_status == ACTIVE for mutating operations"
    error_id: ERR_TAXPAYER_LOCKED
    http_status: 409
    applies_to: "POST/PATCH on tax-returns, income-documents, schedules, tax-credits, estimated-payments, amendments, /compute, /efile, /submit"

  - priority: 7
    category: state
    check: "TaxReturn.status is in the set valid for this operation (e.g., compute requires DRAFT; efile requires READY_TO_FILE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "/compute, /efile, /unlock-for-correction, child mutations after READY_TO_FILE"

  - priority: 8
    category: business_referential
    check: "AmendedReturn.original_return_id must point to a TaxReturn currently in status ACCEPTED"
    error_id: ERR_AMENDMENT_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /amendments, POST /amendments/{id}/submit"

  - priority: 9
    category: business_referential
    check: "Only one active AmendedReturn (status in {DRAFT, SUBMITTED}) per original_return_id"
    error_id: ERR_AMENDMENT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /amendments, POST /amendments/{id}/submit"

  - priority: 10
    category: business_safety
    check: "1099-DIV qualified_dividends_cents <= ordinary_dividends_cents (cannot exceed)"
    error_id: ERR_QUALIFIED_DIV_EXCEEDS_ORDINARY
    http_status: 422
    applies_to: "POST/PATCH /tax-returns/{id}/income-documents"

  - priority: 11
    category: business_safety
    check: "1099-B cost_basis_cents <= proceeds_cents + 100_000_000 (loose sanity: prevent absurd values); holding_period required for 1099-B"
    error_id: ERR_INCOME_DOC_INVALID
    http_status: 422
    applies_to: "POST/PATCH /tax-returns/{id}/income-documents with doc_type=1099_B"

  - priority: 12
    category: business_safety
    check: "Schedule A SALT entry cannot exceed $10,000 ($1,000,000 cents) input"
    error_id: ERR_SALT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST/PATCH /tax-returns/{id}/schedules with schedule_type=A"

  - priority: 13
    category: business_constraint
    check: "qualifying_children_under_17 <= dependents_count on TaxReturn"
    error_id: ERR_QUALIFYING_CHILDREN_EXCEED_DEPENDENTS
    http_status: 422
    applies_to: "POST/PATCH /tax-returns"

  - priority: 14
    category: business_constraint
    check: "TaxCredit eligibility: AOTC requires aotc_student_count >= 1 and aotc_qualified_expenses_cents > 0; MARRIED_SEPARATE filing_status makes EITC and AOTC ineligible"
    error_id: ERR_CREDIT_INELIGIBLE
    http_status: 422
    applies_to: "POST /tax-returns/{id}/credits"

  - priority: 15
    category: business_constraint
    check: "Cannot claim two credits of the same credit_type on one return"
    error_id: ERR_DUPLICATE_CREDIT
    http_status: 409
    applies_to: "POST /tax-returns/{id}/credits"

  - priority: 16
    category: business_constraint
    check: "Cannot claim two Schedules of the same schedule_type on one return"
    error_id: ERR_DUPLICATE_SCHEDULE
    http_status: 409
    applies_to: "POST /tax-returns/{id}/schedules"

  - priority: 17
    category: business_temporal
    check: "EstimatedTaxPayment.scheduled_pay_date must be strictly AFTER clock.now at creation time"
    error_id: ERR_PAYMENT_DATE_PAST
    http_status: 422
    applies_to: "POST /estimated-payments"

  - priority: 18
    category: business_temporal
    check: "Cancel EstimatedTaxPayment requires clock.now < scheduled_pay_date (strict)"
    error_id: ERR_PAYMENT_CANNOT_CANCEL
    http_status: 409
    applies_to: "POST /estimated-payments/{id}/cancel"

  - priority: 19
    category: business_constraint
    check: "Cannot file two TaxReturns with the same (taxpayer_id, tax_year) where prior status in {READY_TO_FILE, FILED, ACCEPTED, AMENDED, SUPERSEDED}"
    error_id: ERR_DUPLICATE_RETURN
    http_status: 409
    applies_to: "POST /tax-returns"

  - priority: 20
    category: business_fiscal
    check: "OCC: client-provided version (when present) must equal current entity version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH operations and POST /compute, POST /efile"

  - priority: 21
    category: business_fiscal
    check: "tax_year must be within supported range (2020..2025); filing_status must be valid enum"
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: "POST /tax-returns"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Taxpayer -----
  - method: POST
    path: "/taxpayers"
    description: "Register a new taxpayer"
    roles: [Taxpayer, IRSAdjudicator]
    code: 201
    input: [ssn_last4, full_name, date_of_birth, filing_address, 'is_blind?']
    output: Taxpayer
    side_effects: []

  - method: GET
    path: "/taxpayers/{id}"
    description: "Get a taxpayer"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: []
    output: Taxpayer
    side_effects: []

  - method: POST
    path: "/taxpayers/{id}/compliance-lock"
    description: "IRS places compliance hold on taxpayer"
    roles: [IRSAdjudicator]
    code: 200
    input: ['reason?']
    output: Taxpayer
    side_effects: ["Cascade: cancel all SCHEDULED EstimatedTaxPayment for this taxpayer (status SCHEDULED → CANCELLED with cancelled_at)"]

  - method: POST
    path: "/taxpayers/{id}/compliance-unlock"
    description: "Release compliance hold"
    roles: [IRSAdjudicator]
    code: 200
    input: []
    output: Taxpayer
    side_effects: []

  # ----- TaxReturn -----
  - method: POST
    path: "/tax-returns"
    description: "Create a new tax return (DRAFT)"
    roles: [Taxpayer]
    code: 201
    input: [taxpayer_id, tax_year, filing_status, 'dependents_count?', 'qualifying_children_under_17?', 'deduction_method?']
    output: TaxReturn
    side_effects: []

  - method: GET
    path: "/tax-returns/{id}"
    description: "Get a tax return"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: []
    output: TaxReturn
    side_effects: []

  - method: GET
    path: "/tax-returns"
    description: "List tax returns (supports filter by taxpayer_id, tax_year, status; paginated)"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: ['taxpayer_id?', 'tax_year?', 'status?', 'limit?', 'offset?']
    output: "TaxReturn[]"
    side_effects: []

  - method: PATCH
    path: "/tax-returns/{id}"
    description: "Update mutable inputs on a return (filing_status, dependents, deduction_method); auto-reverts READY_TO_FILE → DRAFT"
    roles: [Taxpayer]
    code: 200
    input: ['filing_status?', 'dependents_count?', 'qualifying_children_under_17?', 'deduction_method?', 'version?']
    output: TaxReturn
    side_effects: ["If status==READY_TO_FILE → DRAFT; invalidate computed fields"]

  - method: POST
    path: "/tax-returns/{id}/compute"
    description: "Compute AGI, taxable income, regular tax, AMT, credits, balance; moves DRAFT→READY_TO_FILE"
    roles: [Taxpayer]
    code: 200
    input: ['version?']
    output: TaxReturn
    side_effects: ["calc_agi", "calc_taxable_income", "calc_regular_tax", "calc_amt", "calc_credits", "calc_balance_due_or_refund", "Refresh Schedule.schedule_b/schedule_d aggregates"]

  - method: POST
    path: "/tax-returns/{id}/efile"
    description: "Electronic file the return (READY_TO_FILE → FILED)"
    roles: [Taxpayer]
    code: 201
    input: ['version?']
    output: EFiling
    side_effects: ["Create EFiling with outcome=PENDING", "Set TaxReturn.filed_at"]

  - method: POST
    path: "/tax-returns/{id}/unlock-for-correction"
    description: "Re-open a REJECTED return back to DRAFT"
    roles: [Taxpayer]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["Invalidate computed fields"]

  - method: GET
    path: "/tax-returns/{id}/safe-harbor"
    description: "Compute IRS safe-harbor status for estimated-payment penalty avoidance"
    roles: [Taxpayer]
    code: 200
    input: []
    output: "object {current_tax_cents, payments_made_cents, threshold_current_cents, prior_threshold_cents, safe_harbor_met}"
    side_effects: ["calc_estimated_payment_safe_harbor"]

  # ----- IncomeDocument (import) -----
  - method: POST
    path: "/tax-returns/{id}/income-documents"
    description: "Import a W-2/1099-NEC/INT/DIV/B document onto the return"
    roles: [Taxpayer]
    code: 201
    input: [doc_type, payer_ein, payer_name, 'wages_cents?', 'federal_withholding_cents?', 'nonemployee_comp_cents?', 'interest_income_cents?', 'ordinary_dividends_cents?', 'qualified_dividends_cents?', 'proceeds_cents?', 'cost_basis_cents?', 'holding_period?']
    output: IncomeDocument
    side_effects: ["If TaxReturn.status==READY_TO_FILE → DRAFT"]

  - method: GET
    path: "/tax-returns/{id}/income-documents"
    description: "List imported income documents"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: ['doc_type?', 'limit?', 'offset?']
    output: "IncomeDocument[]"
    side_effects: []

  - method: PATCH
    path: "/income-documents/{id}"
    description: "Correct an imported document"
    roles: [Taxpayer]
    code: 200
    input: ['wages_cents?', 'federal_withholding_cents?', 'nonemployee_comp_cents?', 'interest_income_cents?', 'ordinary_dividends_cents?', 'qualified_dividends_cents?', 'proceeds_cents?', 'cost_basis_cents?', 'holding_period?', 'version?']
    output: IncomeDocument
    side_effects: ["If parent TaxReturn.status==READY_TO_FILE → DRAFT"]

  - method: DELETE
    path: "/income-documents/{id}"
    description: "Remove an imported document"
    roles: [Taxpayer]
    code: 204
    input: []
    output: null
    side_effects: ["If parent TaxReturn.status==READY_TO_FILE → DRAFT"]

  # ----- Schedule -----
  - method: POST
    path: "/tax-returns/{id}/schedules"
    description: "Attach a Schedule (A/B/C/D/E)"
    roles: [Taxpayer]
    code: 201
    input: [schedule_type, 'itemized_medical_cents?', 'itemized_salt_cents?', 'itemized_mortgage_interest_cents?', 'itemized_charity_cents?', 'schedule_c_gross_receipts_cents?', 'schedule_c_expenses_cents?', 'schedule_e_rental_income_cents?', 'schedule_e_rental_expenses_cents?']
    output: Schedule
    side_effects: ["If TaxReturn.status==READY_TO_FILE → DRAFT"]

  - method: PATCH
    path: "/schedules/{id}"
    description: "Update a schedule"
    roles: [Taxpayer]
    code: 200
    input: ['itemized_medical_cents?', 'itemized_salt_cents?', 'itemized_mortgage_interest_cents?', 'itemized_charity_cents?', 'schedule_c_gross_receipts_cents?', 'schedule_c_expenses_cents?', 'schedule_e_rental_income_cents?', 'schedule_e_rental_expenses_cents?', 'version?']
    output: Schedule
    side_effects: ["If parent TaxReturn.status==READY_TO_FILE → DRAFT"]

  - method: GET
    path: "/tax-returns/{id}/schedules"
    description: "List schedules on a return"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: []
    output: "Schedule[]"
    side_effects: []

  # ----- TaxCredit -----
  - method: POST
    path: "/tax-returns/{id}/credits"
    description: "Claim a credit (EITC/CTC/AOTC); eligibility evaluated on compute"
    roles: [Taxpayer]
    code: 201
    input: [credit_type, requested_amount_cents, 'aotc_student_count?', 'aotc_qualified_expenses_cents?']
    output: TaxCredit
    side_effects: ["If TaxReturn.status==READY_TO_FILE → DRAFT"]

  - method: GET
    path: "/tax-returns/{id}/credits"
    description: "List credits on a return"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: []
    output: "TaxCredit[]"
    side_effects: []

  - method: DELETE
    path: "/credits/{id}"
    description: "Remove a claimed credit"
    roles: [Taxpayer]
    code: 204
    input: []
    output: null
    side_effects: ["If parent TaxReturn.status==READY_TO_FILE → DRAFT"]

  # ----- EFiling adjudication (IRS side) -----
  - method: GET
    path: "/efilings/{id}"
    description: "Inspect a filing record"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: []
    output: EFiling
    side_effects: []

  - method: POST
    path: "/efilings/{id}/decide"
    description: "IRS decides on a filing (ACCEPTED or REJECTED)"
    roles: [IRSAdjudicator]
    code: 200
    input: [outcome, 'rejection_code?', 'rejection_message?']
    output: EFiling
    side_effects: ["Cascade: TaxReturn FILED→ACCEPTED or FILED→REJECTED with timestamps"]

  # ----- Amendment (1040X) -----
  - method: POST
    path: "/amendments"
    description: "Create a 1040X amendment (DRAFT) pointing at an ACCEPTED original return"
    roles: [Taxpayer]
    code: 201
    input: [original_return_id, reason_summary, 'restated_filing_status?', 'restated_dependents_count?', 'restated_qualifying_children_under_17?', 'restated_deduction_method?']
    output: AmendedReturn
    side_effects: []

  - method: GET
    path: "/amendments/{id}"
    description: "Get an amendment"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: []
    output: AmendedReturn
    side_effects: []

  - method: POST
    path: "/amendments/{id}/submit"
    description: "Submit amendment (DRAFT→SUBMITTED); cascades original TaxReturn ACCEPTED→AMENDED and computes deltas"
    roles: [Taxpayer]
    code: 200
    input: ['version?']
    output: AmendedReturn
    side_effects: ["calc_amendment_delta", "TaxReturn ACCEPTED→AMENDED"]

  - method: POST
    path: "/amendments/{id}/decide"
    description: "IRS decides on an amendment (ACCEPTED or REJECTED)"
    roles: [IRSAdjudicator]
    code: 200
    input: [outcome, 'rejection_message?']
    output: AmendedReturn
    side_effects: ["If ACCEPTED: cascade TaxReturn AMENDED→SUPERSEDED. If REJECTED: revert TaxReturn AMENDED→ACCEPTED"]

  # ----- EstimatedTaxPayment -----
  - method: POST
    path: "/estimated-payments"
    description: "Schedule a quarterly estimated tax payment"
    roles: [Taxpayer]
    code: 201
    input: [taxpayer_id, tax_year, quarter, amount_cents, scheduled_pay_date]
    output: EstimatedTaxPayment
    side_effects: []

  - method: GET
    path: "/estimated-payments"
    description: "List estimated payments (filter by taxpayer/year/status; paginated)"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: ['taxpayer_id?', 'tax_year?', 'quarter?', 'status?', 'limit?', 'offset?']
    output: "EstimatedTaxPayment[]"
    side_effects: []

  - method: POST
    path: "/estimated-payments/{id}/cancel"
    description: "Cancel a scheduled payment before its pay-date"
    roles: [Taxpayer]
    code: 200
    input: []
    output: EstimatedTaxPayment
    side_effects: []

  # ----- AuditLog -----
  - method: GET
    path: "/audit-logs"
    description: "List audit events (filter by actor_role, action, target_entity, target_id; paginated)"
    roles: [IRSAdjudicator]
    code: 200
    input: ['actor_role?', 'action?', 'target_entity?', 'target_id?', 'limit?', 'offset?']
    output: "AuditLog[]"
    side_effects: []

  # ----- Test/system clock -----
  - method: POST
    path: "/_clock/advance"
    description: "Advance virtual clock and run automatic transitions (e.g., EstimatedTaxPayment SCHEDULED→CONFIRMED when pay-date reached)"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: [to_iso_timestamp]
    output: "object {now: ISO8601, advanced_transitions: [{entity, id, from, to}]}"
    side_effects: ["Auto-CONFIRM EstimatedTaxPayments whose scheduled_pay_date <= clock.now"]

  - method: GET
    path: "/_clock"
    description: "Read current virtual clock"
    roles: [Taxpayer, IRSAdjudicator]
    code: 200
    input: []
    output: "object {now: ISO8601}"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted for this operation"

  - id: ERR_TAXPAYER_NOT_FOUND
    http: 404
    condition: "Referenced taxpayer id does not exist"

  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "Referenced TaxReturn id does not exist"

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Child resource (IncomeDocument, Schedule, TaxCredit, EFiling, AmendedReturn, EstimatedTaxPayment) id does not exist"

  - id: ERR_TAXPAYER_LOCKED
    http: 409
    condition: "Taxpayer.account_status == LOCKED; mutating operation rejected"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a state valid for this operation"

  - id: ERR_AMENDMENT_NOT_ALLOWED
    http: 409
    condition: "Original TaxReturn is not in ACCEPTED status; cannot create or submit amendment"

  - id: ERR_AMENDMENT_ALREADY_OPEN
    http: 409
    condition: "An active AmendedReturn (status DRAFT or SUBMITTED) already exists for the original return"

  - id: ERR_QUALIFIED_DIV_EXCEEDS_ORDINARY
    http: 422
    condition: "1099-DIV qualified_dividends_cents > ordinary_dividends_cents"

  - id: ERR_INCOME_DOC_INVALID
    http: 422
    condition: "1099-B missing holding_period; or fields inconsistent with doc_type (e.g., wages_cents on a 1099_INT)"

  - id: ERR_SALT_CAP_EXCEEDED
    http: 422
    condition: "Schedule A itemized_salt_cents input exceeds $10,000 (1,000,000 cents)"

  - id: ERR_QUALIFYING_CHILDREN_EXCEED_DEPENDENTS
    http: 422
    condition: "qualifying_children_under_17 > dependents_count"

  - id: ERR_CREDIT_INELIGIBLE
    http: 422
    condition: "Credit fails eligibility input check (e.g., AOTC with 0 students; EITC or AOTC with filing_status=MARRIED_SEPARATE)"

  - id: ERR_DUPLICATE_CREDIT
    http: 409
    condition: "Two TaxCredit rows with same credit_type on one return"

  - id: ERR_DUPLICATE_SCHEDULE
    http: 409
    condition: "Two Schedule rows with same schedule_type on one return"

  - id: ERR_DUPLICATE_RETURN
    http: 409
    condition: "Existing non-DRAFT TaxReturn already exists for same (taxpayer_id, tax_year)"

  - id: ERR_PAYMENT_DATE_PAST
    http: 422
    condition: "EstimatedTaxPayment.scheduled_pay_date not strictly after clock.now at creation"

  - id: ERR_PAYMENT_CANNOT_CANCEL
    http: 409
    condition: "Cancel attempted on or after pay-date, or payment already CONFIRMED/CANCELLED"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: provided version does not match current entity version"

  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Required field missing, malformed, or out of supported range (e.g., tax_year not in 2020..2025)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Taxpayer
    description: "End-user filing their personal return. May only see/mutate resources belonging to their own taxpayer_id."
    identity: "entity_backed:Taxpayer"
    exclusive_operations:
      - "POST /tax-returns"
      - "PATCH /tax-returns/{id}"
      - "POST /tax-returns/{id}/compute"
      - "POST /tax-returns/{id}/efile"
      - "POST /tax-returns/{id}/unlock-for-correction"
      - "POST /tax-returns/{id}/income-documents"
      - "PATCH /income-documents/{id}"
      - "DELETE /income-documents/{id}"
      - "POST /tax-returns/{id}/schedules"
      - "PATCH /schedules/{id}"
      - "POST /tax-returns/{id}/credits"
      - "DELETE /credits/{id}"
      - "POST /amendments"
      - "POST /amendments/{id}/submit"
      - "POST /estimated-payments"
      - "POST /estimated-payments/{id}/cancel"
    shared_operations:
      - "GET /taxpayers/{id} (self only)"
      - "GET /tax-returns, GET /tax-returns/{id} (self only)"
      - "GET /tax-returns/{id}/income-documents, /schedules, /credits (self only)"
      - "GET /efilings/{id} (self only)"
      - "GET /amendments/{id} (self only)"
      - "GET /estimated-payments (self only)"
      - "GET /tax-returns/{id}/safe-harbor (self only)"
      - "POST /_clock/advance, GET /_clock (testing utility)"

  - name: IRSAdjudicator
    description: "IRS-side reviewer that decides on filed returns and amendments; can place compliance locks. Cannot create/file returns on behalf of taxpayers."
    identity: "opaque"
    exclusive_operations:
      - "POST /efilings/{id}/decide"
      - "POST /amendments/{id}/decide"
      - "POST /taxpayers/{id}/compliance-lock"
      - "POST /taxpayers/{id}/compliance-unlock"
      - "GET /audit-logs"
      - "POST /taxpayers (also taxpayers can self-register)"
    shared_operations:
      - "GET /taxpayers/{id} (any)"
      - "GET /tax-returns, GET /tax-returns/{id} (any)"
      - "GET /tax-returns/{id}/income-documents, /schedules, /credits (any)"
      - "GET /efilings/{id}, GET /amendments/{id} (any)"
      - "GET /estimated-payments (any)"
      - "POST /_clock/advance, GET /_clock"
