      - name: pickup_weight_variance_recomputed_on_each_receive
        claim_type: correct_result
        grounds: [calculations.pickup_weight_variance]
        distinguishing_aspect: "actual_soiled_weight_lb accumulates only RECEIVED/SORTED carts; DECLARED carts excluded until received."
        test_recipe:
          setup: ["Stop with declared weight 100.0; pickup declares two carts 60.0 and 45.0"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
