  # ------------------------------------------------------------ applications ---
  - method: POST
    path: "/licensing/license-applications"
    description: "Opens a DRAFT licence application for a classification, naming the offered qualifying individual and the declared net worth."
    roles: [Licensee, LicensingAnalyst]
    code: 201
    input: [licensee_id, classification_id, qualifying_individual_id, application_type, declared_net_worth_cents, "education_credential?", "predecessor_license_id?"]
    output: LicenseApplication
    side_effects: ["status = DRAFT; deficiency_round_count = 0; credited_experience_months left null until submit"]

  - method: GET
    path: "/licensing/license-applications/{id}"
    description: "Reads one licence application."
    roles: [BoardAdmin, LicensingAnalyst, Licensee]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: []

  - method: GET
    path: "/licensing/license-applications"
    description: "Lists licence applications with FK and status filters (FK reverse-reachability for licensee_id, classification_id, qualifying_individual_id and predecessor_license_id)."
    roles: [BoardAdmin, LicensingAnalyst, Licensee]
    code: 200
    input: ["licensee_id?", "classification_id?", "qualifying_individual_id?", "predecessor_license_id?", "status?", "limit?", "offset?"]
    output: LicenseApplication[]
    side_effects: []

  - method: POST
    path: "/licensing/license-applications/{id}/submit"
    description: "Submits a DRAFT application for review; runs the examination, experience and financial-responsibility gates."
    roles: [Licensee]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["DRAFT -> SUBMITTED", "credited_experience_months recomputed by calculations.credited_experience_months", "submitted_at stamped from the clock"]

  - method: POST
    path: "/licensing/license-applications/{id}/cure"
    description: "Re-submits a DEFICIENT application, optionally replacing the net worth, the credential or the offered qualifier."
    roles: [Licensee]
    code: 200
    input: ["declared_net_worth_cents?", "education_credential?", "qualifying_individual_id?"]
    output: LicenseApplication
    side_effects: ["DEFICIENT -> SUBMITTED (cure loop)", "credited_experience_months recomputed", "submitted_at restamped"]

  - method: POST
    path: "/licensing/license-applications/{id}/decision"
    description: "Records the analyst's decision on a SUBMITTED application: APPROVED mints the licence, DEFICIENT opens a cure round (the third one denies), DENIED closes the file."
    roles: [LicensingAnalyst]
    code: 200
    input: [outcome, "deficiency_reason?", "denial_reason?"]
    output: LicenseApplication
    side_effects:
      - "SUBMITTED -> APPROVED | DEFICIENT | DENIED"
      - "on DEFICIENT: deficiency_round_count += 1; the third finding lands DENIED with denial_reason = EXCESSIVE_DEFICIENCY_ROUNDS instead"
      - "on APPROVED: creates the License (ACTIVE, expires_on = clock date + 24 months), then creates its RESPONSIBLE_MANAGING_EMPLOYEE QualifierAssignment (ACTIVE), then increments QualifyingIndividual.active_qualification_count, then stamps License.compliance_posture = NON_COMPLIANT for want of a verified bond"

  - method: POST
    path: "/licensing/license-applications/{id}/withdraw"
    description: "Withdraws an application that has not yet been decided."
    roles: [Licensee]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["DRAFT | SUBMITTED | DEFICIENT -> WITHDRAWN"]

  # ----------------------------------------------------------------- licences --
  - method: GET
    path: "/licensing/licenses/{id}"
    description: "Reads one licence: both state dimensions (status, compliance_posture), the recovery-fund ledger fields, CE bank, term dates and the version used as the OCC token."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, HearingOfficer, FundAdjudicator, Licensee, Consumer]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/licensing/licenses"
    description: "Lists licences with FK and dual-dimension filters (FK reverse-reachability for licensee_id, classification_id, application_id, qualifying_individual_id and the self-referential predecessor_license_id)."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, HearingOfficer, FundAdjudicator, Licensee, Consumer]
    code: 200
    input: ["licensee_id?", "classification_id?", "application_id?", "qualifying_individual_id?", "predecessor_license_id?", "status?", "compliance_posture?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: POST
    path: "/licensing/licenses/{id}/ce-credits"
    description: "Banks continuing-education hours against the licence's current term."
    roles: [Licensee, LicensingAnalyst]
    code: 200
    input: [ce_hours, completed_on, provider_name]
    output: License
    side_effects: ["ce_hours_completed += ce_hours (capped by the 40-hour term ceiling)"]

  - method: POST
    path: "/licensing/licenses/{id}/renew"
    description: "Renews a licence for another 24-month term, assessing the CE-shortfall fee, the delinquency surcharge and the recovery-fund assessment in that order."
    roles: [Licensee]
    code: 200
    input: []
    output: License
    side_effects:
      - "ACTIVE -> ACTIVE (expires_on += 24 months, anchored on the OLD expiry) or EXPIRED -> ACTIVE (expires_on = clock date + 24 months)"
      - "last_renewal_fee_cents = calculations.renewal_fee; last_renewed_on = clock date; renewal_count += 1; ce_hours_completed reset to 0"
      - "compliance_posture recomputed"

  - method: POST
    path: "/licensing/licenses/{id}/reinstate"
    description: "Reinstates a SUSPENDED licence once the suspension period has run, all penalties are paid, all recovery-fund money is repaid, bond coverage is live and CE is complete."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: License
    side_effects:
      - "SUSPENDED -> ACTIVE; suspension_reason and suspension_until cleared; ce_hours_completed reset to 0"
      - "every SUSPENDED_BY_LICENSE QualifierAssignment on the licence returns to ACTIVE and each bumps its qualifier's active_qualification_count by +1"
      - "compliance_posture recomputed"

  - method: POST
    path: "/licensing/licenses/{id}/recovery-repayments"
    description: "Credits a licensee repayment against the recovery-fund money the board paid out on this licence; full repayment lifts the payout suspension."
    roles: [Licensee]
    code: 200
    input: [repayment_amount_cents, expected_license_version]
    output: License
    side_effects:
      - "increments License.version by 1"
      - "the oldest PAID claims on this licence absorb the credit in created_at ASC order; each claim whose repaid_amount_cents reaches its paid_amount_cents moves PAID -> REIMBURSED"
      - "RecoveryFundAccount.balance_cents rises by the credited amount; outstanding_recovery_repayment_cents falls by it"
      - "when outstanding_recovery_repayment_cents reaches 0 and suspension_reason = RECOVERY_FUND_PAYOUT: SUSPENDED -> ACTIVE, SUSPENDED_BY_LICENSE assignments return to ACTIVE and each qualifier's active_qualification_count rises by 1"
      - "compliance_posture recomputed"

  - method: POST
    path: "/licensing/compliance-sweeps"
    description: "Ops-run continuous-monitoring checkpoint: lapses every VERIFIED coverage record whose expiration_date has arrived, expires every ACTIVE licence past its expires_on, suspends licences left without live bond coverage, and restamps every affected compliance_posture."
    roles: [BoardAdmin, LicensingAnalyst]
    code: 200
    input: []
    output: { lapsed_coverage_count: integer, expired_license_count: integer, suspended_license_count: integer, swept_on: string }
    side_effects:
      - "CoverageRecord VERIFIED -> LAPSED for every record with clock date >= expiration_date"
      - "License ACTIVE -> EXPIRED for every licence with clock date > expires_on (QualifierAssignments untouched)"
      - "License ACTIVE -> SUSPENDED (BOND_LAPSE) for every licence left with no VERIFIED BOND covering the clock date, cascading to its ACTIVE QualifierAssignments and to each qualifier's active_qualification_count"

  # -------------------------------------------------------- coverage records ---
  - method: POST
    path: "/licensing/coverage-records"
    description: "Files a bond or insurance instrument against a licence for verification. The period is half-open: [effective_date, expiration_date)."
    roles: [LicensingAnalyst, Licensee]
    code: 201
    input: [license_id, coverage_type, carrier_name, policy_number, amount_cents, effective_date, expiration_date]
    output: CoverageRecord
    side_effects: ["status = PENDING_VERIFICATION; compliance_posture is NOT affected until the instrument is verified"]

  - method: GET
    path: "/licensing/coverage-records/{id}"
    description: "Reads one coverage record."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, Licensee]
    code: 200
    input: []
    output: CoverageRecord
    side_effects: []

  - method: GET
    path: "/licensing/coverage-records"
    description: "Lists coverage records with licence, type and status filters (FK reverse-reachability for license_id)."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, Licensee]
    code: 200
    input: ["license_id?", "coverage_type?", "status?", "limit?", "offset?"]
    output: CoverageRecord[]
    side_effects: []

  - method: POST
    path: "/licensing/coverage-records/{id}/verification"
    description: "Records the carrier confirmation outcome: VERIFY moves the instrument to VERIFIED after the bond-amount and non-overlap tests, REJECT closes it."
    roles: [LicensingAnalyst]
    code: 200
    input: [outcome, "rejection_reason?"]
    output: CoverageRecord
    side_effects: ["PENDING_VERIFICATION -> VERIFIED (verified_on stamped) or -> REJECTED", "License.compliance_posture recomputed"]

  - method: POST
    path: "/licensing/coverage-records/{id}/cancel"
    description: "Records a mid-term carrier cancellation, truncating the coverage period to the cancellation date."
    roles: [LicensingAnalyst]
    code: 200
    input: [cancellation_date]
    output: CoverageRecord
    side_effects:
      - "VERIFIED -> CANCELLED; cancellation_date stored and expiration_date rewritten to it"
      - "License.compliance_posture recomputed to NON_COMPLIANT when the licence loses its only live bond, and in that case License ACTIVE -> SUSPENDED with suspension_reason = BOND_LAPSE"
      - "every ACTIVE QualifierAssignment on that licence moves to SUSPENDED_BY_LICENSE and each qualifier's active_qualification_count falls by 1"

  # ------------------------------------------------------------- qualifiers ---
  - method: POST
    path: "/licensing/qualifier-assignments"
    description: "Designates a qualifying individual as the licence's responsible managing officer or employee. Supersedes any live designation of the same relationship_type, which is why the licence version must be presented."
    roles: [LicensingAnalyst]
    code: 201
    input: [license_id, qualifying_individual_id, relationship_type, effective_from, expected_license_version, "ownership_pct?", "effective_to?"]
    output: QualifierAssignment
    side_effects:
      - "increments License.version by 1"
      - "status = ACTIVE; QualifyingIndividual.active_qualification_count += 1; License.qualifying_individual_id set to the designee"
      - "any prior ACTIVE assignment of the same relationship_type on the licence moves to WITHDRAWN and its qualifier's active_qualification_count falls by 1"
      - "License.compliance_posture recomputed"

  - method: GET
    path: "/licensing/qualifier-assignments/{id}"
    description: "Reads one qualifier designation."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, Licensee]
    code: 200
    input: []
    output: QualifierAssignment
    side_effects: []

  - method: GET
    path: "/licensing/qualifier-assignments"
    description: "Lists qualifier designations by licence, by person or by status (FK reverse-reachability for license_id and qualifying_individual_id)."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, Licensee]
    code: 200
    input: ["license_id?", "qualifying_individual_id?", "status?", "limit?", "offset?"]
    output: QualifierAssignment[]
    side_effects: []

  - method: POST
    path: "/licensing/qualifier-assignments/{id}/withdraw"
    description: "Withdraws a live designation — an entity-relationship change that leaves the licence without a qualifier of record until another is designated."
    roles: [LicensingAnalyst]
    code: 200
    input: [withdrawn_on]
    output: QualifierAssignment
    side_effects:
      - "ACTIVE -> WITHDRAWN; effective_to rewritten to withdrawn_on"
      - "QualifyingIndividual.active_qualification_count -= 1"
      - "License.qualifying_individual_id cleared when it named this person, and License.compliance_posture recomputed to NON_COMPLIANT"

  # ------------------------------------------------------------- complaints ---
  - method: POST
    path: "/licensing/complaints"
    description: "Intakes a consumer complaint against a licensed contractor (license_id supplied) or against an unlicensed operator (subject_business_name only)."
    roles: [Consumer, LicensingAnalyst]
    code: 201
    input: [consumer_id, alleged_loss_cents, contract_date, description, "license_id?", "subject_business_name?", "work_completed_on?"]
    output: Complaint
    side_effects: ["status = RECEIVED; mediation_round_count = 0; settlement_amount_cents = 0; jurisdiction_basis null until screened"]

  - method: GET
    path: "/licensing/complaints/{id}"
    description: "Reads one complaint with its screening, mediation and settlement fields."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, HearingOfficer, FundAdjudicator, Consumer, Licensee]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/licensing/complaints"
    description: "Lists complaints by consumer, by subject licence, by status or by jurisdiction basis (FK reverse-reachability for consumer_id and license_id)."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, HearingOfficer, FundAdjudicator, Consumer]
    code: 200
    input: ["consumer_id?", "license_id?", "status?", "jurisdiction_basis?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/licensing/complaints/{id}/screen"
    description: "Records the jurisdiction screening. ACCEPTED routes the file either to MEDIATION or straight to INVESTIGATION depending on the subject licence's state and its classification's mediation_required flag; REJECTED dismisses it."
    roles: [LicensingAnalyst]
    code: 200
    input: [jurisdiction_finding, "rejection_reason?"]
    output: Complaint
    side_effects:
      - "RECEIVED -> MEDIATION (jurisdiction_basis = LICENSED_SUBJECT, mediation_round_count = 1, mediation_deadline = clock date + 30 days)"
      - "RECEIVED -> INVESTIGATION (jurisdiction_basis = UNLICENSED_PRACTICE for an unlicensed subject, else LICENSED_SUBJECT; no mediation window is opened)"
      - "RECEIVED -> DISMISSED_NO_JURISDICTION (dismissal_reason stored)"

  - method: POST
    path: "/licensing/complaints/{id}/mediation-outcome"
    description: "Closes a mediation attempt: SETTLED resolves the complaint and records the cash the consumer received, FAILED escalates it to investigation."
    roles: [LicensingAnalyst]
    code: 200
    input: [outcome, "settlement_amount_cents?"]
    output: Complaint
    side_effects:
      - "MEDIATION -> CLOSED_RESOLVED or MEDIATION -> INVESTIGATION"
      - "settlement_amount_cents stored — it later offsets any recovery-fund award on this complaint"

  - method: POST
    path: "/licensing/complaints/{id}/remand-to-mediation"
    description: "Sends an investigated complaint back for a second mediation attempt, subject to the two-round cap and only while no citation has issued."
    roles: [Investigator]
    code: 200
    input: [remand_reason]
    output: Complaint
    side_effects: ["INVESTIGATION -> MEDIATION; mediation_round_count += 1; mediation_deadline = clock date + 30 days; OPEN investigations stay OPEN"]

  - method: POST
    path: "/licensing/complaints/{id}/withdraw"
    description: "Consumer withdrawal of the complaint. Enforcement already under way is not withdrawn with it."
    roles: [Consumer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["RECEIVED | MEDIATION | INVESTIGATION -> WITHDRAWN; any OPEN Investigation stays OPEN"]

  # ---------------------------------------------------------- investigations ---
  - method: POST
    path: "/licensing/investigations"
    description: "Opens an enforcement case — from a screened complaint (origin = COMPLAINT) or from a board sting against an unlicensed operator (origin = STING, no complaint)."
    roles: [Investigator]
    code: 201
    input: [origin, "complaint_id?", "subject_license_id?", "subject_business_name?"]
    output: Investigation
    side_effects: ["status = OPEN; opened_on = clock date; assigned_investigator_user_id = X-User-ID of the opener"]

  - method: GET
    path: "/licensing/investigations/{id}"
    description: "Reads one investigation, including the assigned investigator (the segregation-of-duties key)."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, HearingOfficer, FundAdjudicator]
    code: 200
    input: []
    output: Investigation
    side_effects: []

  - method: GET
    path: "/licensing/investigations"
    description: "Lists investigations by complaint, by subject licence, by origin or by status (FK reverse-reachability for complaint_id and subject_license_id)."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, HearingOfficer]
    code: 200
    input: ["complaint_id?", "subject_license_id?", "origin?", "status?", "limit?", "offset?"]
    output: Investigation[]
    side_effects: []

  - method: POST
    path: "/licensing/investigations/{id}/close"
    description: "Closes the case with a substantiated finding and its severity, or as unsubstantiated. Only the assigned investigator may close it."
    roles: [Investigator]
    code: 200
    input: [finding, evidence_summary, "finding_severity?"]
    output: Investigation
    side_effects:
      - "OPEN -> SUBSTANTIATED (finding_severity stored) or OPEN -> UNSUBSTANTIATED"
      - "on UNSUBSTANTIATED with origin = COMPLAINT: the complaint moves INVESTIGATION -> CLOSED_UNFOUNDED"

  # --------------------------------------------------------------- citations ---
  - method: POST
    path: "/licensing/citations"
    description: "Issues a citation on a substantiated case, assessing the INITIAL_ASSESSMENT civil penalty and an order of correction. Only the assigned investigator may issue it."
    roles: [Investigator]
    code: 201
    input: [investigation_id, classification_id, violation_code, correction_due_date]
    output: Citation
    side_effects:
      - "status = ISSUED; issued_on = clock date; appeal_deadline = issued_on + 15 days"
      - "license_id and severity copied from the investigation; subject_type computed; prior_final_citation_count computed"
      - "civil_penalty_cents = calculations.citation_civil_penalty INITIAL_ASSESSMENT variant"
      - "the linked complaint moves INVESTIGATION -> CITATION_ISSUED"

  - method: GET
    path: "/licensing/citations/{id}"
    description: "Reads one citation with its penalty, penalty_variant, prior-citation count and appeal deadline."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, HearingOfficer, FundAdjudicator, Licensee, Consumer]
    code: 200
    input: []
    output: Citation
    side_effects: []

  - method: GET
    path: "/licensing/citations"
    description: "Lists citations by investigation, by licence, by classification or by status (FK reverse-reachability for investigation_id, license_id and classification_id)."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, HearingOfficer, FundAdjudicator, Licensee]
    code: 200
    input: ["investigation_id?", "license_id?", "classification_id?", "status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []

  - method: POST
    path: "/licensing/citations/{id}/appeal"
    description: "Files the licensee's appeal inside the 15-day window, taking the citation onto the appeal branch."
    roles: [Licensee]
    code: 200
    input: [appeal_grounds]
    output: Citation
    side_effects: ["ISSUED -> APPEAL_REQUESTED; the penalty stays at its INITIAL_ASSESSMENT value and is not yet collectable"]

  - method: POST
    path: "/licensing/citations/{id}/finalize"
    description: "Defaults an unappealed citation to FINAL once the appeal window has closed, making the penalty collectable."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: Citation
    side_effects:
      - "ISSUED -> FINAL with no penalty recalculation and no sanction ladder"
      - "Licensee.unpaid_penalty_cents rises by the unpaid remainder; License.compliance_posture recomputed"
      - "the linked complaint moves CITATION_ISSUED -> CLOSED_SANCTIONED"

  - method: POST
    path: "/licensing/citations/{id}/comply"
    description: "Records payment in full of the civil penalty together with the date the order of correction was performed."
    roles: [Licensee]
    code: 200
    input: [penalty_payment_cents, corrected_on]
    output: Citation
    side_effects:
      - "FINAL | AFFIRMED | MODIFIED -> SATISFIED; penalty_paid_cents = civil_penalty_cents; correction_completed_on = corrected_on"
      - "Licensee.unpaid_penalty_cents falls by the amount remitted; License.compliance_posture recomputed"

  # ------------------------------------------------------------- hearings -----
  - method: POST
    path: "/licensing/disciplinary-hearings"
    description: "Calendars an appealed citation before a hearing officer who was not the investigator, in a slot that does not overlap that officer's other hearings."
    roles: [BoardAdmin, HearingOfficer]
    code: 201
    input: [citation_id, presiding_officer_user_id, scheduled_start_utc, scheduled_end_utc]
    output: DisciplinaryHearing
    side_effects: ["status = SCHEDULED", "the citation moves APPEAL_REQUESTED -> HEARING_SCHEDULED"]

  - method: GET
    path: "/licensing/disciplinary-hearings/{id}"
    description: "Reads one hearing with its decision, sanction_points and sanction_tier."
    roles: [BoardAdmin, LicensingAnalyst, Investigator, HearingOfficer, Licensee]
    code: 200
    input: []
    output: DisciplinaryHearing
    side_effects: []

  - method: GET
    path: "/licensing/disciplinary-hearings"
    description: "Lists hearings by citation, by presiding officer or by status (FK reverse-reachability for citation_id)."
    roles: [BoardAdmin, LicensingAnalyst, HearingOfficer]
    code: 200
    input: ["citation_id?", "presiding_officer_user_id?", "status?", "limit?", "offset?"]
    output: DisciplinaryHearing[]
    side_effects: []

  - method: POST
    path: "/licensing/disciplinary-hearings/{id}/decide"
    description: "Renders the disposition of the appeal and, on AFFIRM or MODIFY, grades the sanction ladder against the licence's history and posture. Only the presiding officer may decide."
    roles: [HearingOfficer]
    code: 200
    input: [decision, findings_summary, "modified_penalty_cents?", "correction_verified_on?"]
    output: DisciplinaryHearing
    side_effects:
      - "SCHEDULED -> DECIDED; decision and decided_at stored"
      - "citation HEARING_SCHEDULED -> AFFIRMED | MODIFIED | VACATED; on AFFIRM the penalty is restamped by the POST_HEARING_RECALCULATION variant, on MODIFY it becomes modified_penalty_cents, on VACATE it becomes 0"
      - "when correction_verified_on is supplied it is stamped onto Citation.correction_completed_on and, if it is <= correction_due_date, it earns the 25% mitigation credit inside the POST_HEARING_RECALCULATION variant"
      - "on AFFIRM/MODIFY: sanction_points = calculations.sanction_points and sanction_tier read off the ladder; LETTER_OF_REPRIMAND and PROBATION leave License.status untouched and only restamp compliance_posture (PROBATION lands CONDITIONAL unless a NON_COMPLIANT condition still holds), SUSPENSION_30/90 move the licence to SUSPENDED (DISCIPLINARY) with suspension_until = clock + 30/90 days, REVOCATION moves it to REVOKED and terminates its qualifier designations, decrementing each qualifier's active_qualification_count"
      - "the linked complaint moves CITATION_ISSUED -> CLOSED_SANCTIONED (AFFIRM/MODIFY) or -> CLOSED_UNFOUNDED (VACATE)"
      - "Licensee.unpaid_penalty_cents restated from the citation's new penalty"

  # -------------------------------------------------------- recovery fund -----
  - method: POST
    path: "/licensing/recovery-fund-claims"
    description: "Files a consumer claim against the recovery fund on a final citation or on an unsatisfied court judgment, stamping the preliminary estimate."
    roles: [Consumer, FundAdjudicator]
    code: 201
    input: [fund_account_id, complaint_id, basis, claimed_amount_cents, "judgment_amount_cents?", "judgment_docket_number?", "judgment_entered_on?"]
    output: RecoveryFundClaim
    side_effects: ["status = FILED; consumer_id and license_id copied from the complaint", "estimated_award_cents = calculations.recovery_award preliminary_estimate variant"]

  - method: GET
    path: "/licensing/recovery-fund-claims/{id}"
    description: "Reads one claim with its estimate, award, disbursed and repaid amounts."
    roles: [BoardAdmin, LicensingAnalyst, FundAdjudicator, Consumer, Licensee]
    code: 200
    input: []
    output: RecoveryFundClaim
    side_effects: []

  - method: GET
    path: "/licensing/recovery-fund-claims"
    description: "Lists claims by fund account, complaint, consumer, licence or status (FK reverse-reachability for fund_account_id, complaint_id, consumer_id and license_id)."
    roles: [BoardAdmin, LicensingAnalyst, FundAdjudicator, Consumer, Licensee]
    code: 200
    input: ["fund_account_id?", "complaint_id?", "consumer_id?", "license_id?", "status?", "limit?", "offset?"]
    output: RecoveryFundClaim[]
    side_effects: []

  - method: POST
    path: "/licensing/recovery-fund-claims/{id}/adjudicate"
    description: "Approves or denies a filed claim, computing the final award net of any mediation settlement and clipped by the per-claim and per-licence aggregate caps. Approval encumbers aggregate room but moves no cash."
    roles: [FundAdjudicator]
    code: 200
    input: [outcome, "denial_reason?"]
    output: RecoveryFundClaim
    side_effects:
      - "FILED -> APPROVED (awarded_amount_cents = calculations.recovery_award final_award variant) or FILED -> DENIED"
      - "an APPROVE whose final award computes to 0 lands DENIED with denial_reason = AGGREGATE_CAP_EXHAUSTED"
      - "License.recovery_encumbered_cents recomputed"

  - method: POST
    path: "/licensing/recovery-fund-claims/{id}/pay"
    description: "Disburses the approved claims on this licence out of the pool, pro-rating every approved sibling when the pool cannot cover them all, and suspending the licence until the money is repaid."
    roles: [FundAdjudicator]
    code: 200
    input: [expected_fund_account_version]
    output: RecoveryFundClaim
    side_effects:
      - "increments RecoveryFundAccount.version by 1"
      - "calculations.recovery_prorata_distribution stamps paid_amount_cents on every APPROVED claim of this licence and moves them all APPROVED -> PAID"
      - "RecoveryFundAccount.balance_cents falls by the total disbursed; License.recovery_paid_to_date_cents and outstanding_recovery_repayment_cents rise by it; Licensee.outstanding_recovery_payout_cents follows"
      - "License ACTIVE -> SUSPENDED with suspension_reason = RECOVERY_FUND_PAYOUT and compliance_posture = NON_COMPLIANT"
      - "every ACTIVE QualifierAssignment on the licence moves to SUSPENDED_BY_LICENSE and each qualifier's active_qualification_count falls by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- request plumbing -----------------------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or empty on any endpoint other than POST /_clock/set_current_utc" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "X-User-Role is not in the called endpoint's roles list" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong JSON type (including money sent as a string), unknown enum value, unparseable date/datetime, scheduled_end_utc <= scheduled_start_utc, expiration_date <= effective_date, effective_to < effective_from, score outside 0..100, hazard_tier outside {1,2,3}, ownership_pct outside 0..100, limit outside 1..100 or negative offset" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "a Licensee actor acts on an application, licence or citation belonging to another licensee, or a Consumer actor acts on another consumer's complaint" }

  # ---- existence ------------------------------------------------------------
  - { id: ERR_TRADE_CLASSIFICATION_NOT_FOUND, http: 404, condition: "classification_id in a path or body does not resolve" }
  - { id: ERR_RECOVERY_FUND_ACCOUNT_NOT_FOUND, http: 404, condition: "fund_account_id in a path or body does not resolve" }
  - { id: ERR_LICENSEE_NOT_FOUND, http: 404, condition: "licensee_id in a path or body does not resolve" }
  - { id: ERR_QUALIFYING_INDIVIDUAL_NOT_FOUND, http: 404, condition: "qualifying_individual_id in a path or body does not resolve" }
  - { id: ERR_CONSUMER_NOT_FOUND, http: 404, condition: "consumer_id in a path or body does not resolve" }
  - { id: ERR_LICENSE_APPLICATION_NOT_FOUND, http: 404, condition: "the application named by {id} does not exist" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "the licence named by {id}, license_id, subject_license_id or predecessor_license_id does not exist" }
  - { id: ERR_COVERAGE_RECORD_NOT_FOUND, http: 404, condition: "the coverage record named by {id} does not exist" }
  - { id: ERR_QUALIFIER_ASSIGNMENT_NOT_FOUND, http: 404, condition: "the qualifier designation named by {id} does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "the complaint named by {id} or complaint_id does not exist" }
  - { id: ERR_INVESTIGATION_NOT_FOUND, http: 404, condition: "the investigation named by {id} or investigation_id does not exist" }
  - { id: ERR_CITATION_NOT_FOUND, http: 404, condition: "the citation named by {id} or citation_id does not exist" }
  - { id: ERR_DISCIPLINARY_HEARING_NOT_FOUND, http: 404, condition: "the hearing named by {id} does not exist" }
  - { id: ERR_RECOVERY_FUND_CLAIM_NOT_FOUND, http: 404, condition: "the claim named by {id} does not exist" }

  # ---- optimistic concurrency ----------------------------------------------
  - { id: ERR_STALE_LICENSE_VERSION, http: 412, condition: "expected_license_version does not equal the current License.version on POST /licensing/qualifier-assignments or POST /licensing/licenses/{id}/recovery-repayments" }
  - { id: ERR_STALE_FUND_ACCOUNT_VERSION, http: 412, condition: "expected_fund_account_version does not equal the current RecoveryFundAccount.version on POST /licensing/recovery-fund-claims/{id}/pay" }

  # ---- state ---------------------------------------------------------------
  - { id: ERR_APPLICATION_STATE_INVALID, http: 409, condition: "the application is not in a state from which the requested action is defined (e.g. submitting an already SUBMITTED application, curing one that is not DEFICIENT, deciding a WITHDRAWN one)" }
  - { id: ERR_LICENSE_STATE_INVALID, http: 409, condition: "the licence is not in a state from which the requested action is defined (e.g. reinstating an ACTIVE licence, renewing a SUSPENDED one, any action at all on a REVOKED one)" }
  - { id: ERR_COVERAGE_STATE_INVALID, http: 409, condition: "verifying a record that is not PENDING_VERIFICATION, or cancelling one that is not VERIFIED" }
  - { id: ERR_ASSIGNMENT_STATE_INVALID, http: 409, condition: "withdrawing a designation that is not ACTIVE (already WITHDRAWN, SUSPENDED_BY_LICENSE or TERMINATED_BY_REVOCATION)" }
  - { id: ERR_COMPLAINT_STATE_INVALID, http: 409, condition: "screening a complaint that is not RECEIVED, recording a mediation outcome on one not in MEDIATION, remanding one not in INVESTIGATION, withdrawing a closed one, or opening an investigation on a complaint not in INVESTIGATION" }
  - { id: ERR_INVESTIGATION_STATE_INVALID, http: 409, condition: "closing an investigation that is not OPEN" }
  - { id: ERR_CITATION_STATE_INVALID, http: 409, condition: "appealing or finalizing a citation that is not ISSUED, complying with one that is not FINAL/AFFIRMED/MODIFIED, or scheduling a hearing on one not in APPEAL_REQUESTED" }
  - { id: ERR_HEARING_STATE_INVALID, http: 409, condition: "deciding a hearing that is already DECIDED" }
  - { id: ERR_CLAIM_STATE_INVALID, http: 409, condition: "adjudicating a claim that is not FILED, or paying one that is not APPROVED" }
  - { id: ERR_INVESTIGATION_NOT_SUBSTANTIATED, http: 409, condition: "issuing a citation on an investigation that is still OPEN or was closed UNSUBSTANTIATED" }
  - { id: ERR_CLAIM_BASIS_NOT_ESTABLISHED, http: 409, condition: "approving a FINAL_CITATION claim whose complaint is not CLOSED_SANCTIONED, or a COURT_JUDGMENT claim whose complaint was dismissed, withdrawn or resolved in mediation" }
  - { id: ERR_MEDIATION_ROUNDS_EXHAUSTED, http: 409, condition: "remanding to mediation when mediation_round_count is already 2, or after a citation has issued on the complaint" }

  # ---- business safety -----------------------------------------------------
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "presiding_officer_user_id equals the assigned_investigator_user_id of the citation's investigation" }
  - { id: ERR_NOT_PRESIDING_OFFICER, http: 403, condition: "a HearingOfficer other than the hearing's presiding_officer_user_id attempts the decision" }
  - { id: ERR_NOT_ASSIGNED_INVESTIGATOR, http: 403, condition: "an Investigator other than assigned_investigator_user_id closes the investigation or issues its citation" }
  - { id: ERR_COVERAGE_CONTINUITY_GAP, http: 422, condition: "renewal attempted while calculations.bond_continuity_gap_days > 0 over the expiring term" }
  - { id: ERR_BOND_COVERAGE_MISSING, http: 422, condition: "reinstatement attempted with no VERIFIED BOND record covering the clock date" }
  - { id: ERR_LICENSE_NOT_COMPLIANT, http: 409, condition: "renewal attempted while compliance_posture is NON_COMPLIANT" }
  - { id: ERR_OUTSTANDING_OBLIGATIONS, http: 409, condition: "reinstatement attempted with unpaid final penalties on the licence or with outstanding_recovery_repayment_cents > 0" }

  # ---- business referential ------------------------------------------------
  - { id: ERR_CLASSIFICATION_MISMATCH, http: 422, condition: "the citation's classification_id differs from the subject licence's classification_id" }
  - { id: ERR_EXAM_REQUIREMENT_UNMET, http: 422, condition: "the offered qualifier lacks a passed unexpired LAW_AND_BUSINESS exam, lacks a passed unexpired TRADE exam for the classification code, or holds one whose expires_on has passed the clock date" }
  - { id: ERR_QUALIFIER_CAPACITY_EXCEEDED, http: 422, condition: "the qualifier already occupies MAX_CONCURRENT_QUALIFICATIONS (2) live designations covering the requested effective date" }
  - { id: ERR_OWNERSHIP_PCT_INSUFFICIENT, http: 422, condition: "relationship_type = RESPONSIBLE_MANAGING_OFFICER with ownership_pct < 10" }
  - { id: ERR_UNLICENSED_SUBJECT_NOT_CLAIMABLE, http: 422, condition: "a recovery-fund claim is filed on a complaint whose license_id is null" }
  - { id: ERR_INVESTIGATION_ORIGIN_MISMATCH, http: 422, condition: "origin = COMPLAINT without complaint_id, origin = STING with complaint_id, or subject_license_id omitted without subject_business_name" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "a second recovery-fund claim is filed on a complaint that already has one in a status other than DENIED" }
  - { id: ERR_PREDECESSOR_LICENSE_INVALID, http: 422, condition: "REINSTATEMENT without predecessor_license_id, with a predecessor belonging to another licensee or another classification, with a predecessor that is ACTIVE or SUSPENDED, or a non-REINSTATEMENT application that supplies predecessor_license_id" }
  - { id: ERR_JUDGMENT_FIELDS_MISMATCH, http: 422, condition: "basis = COURT_JUDGMENT missing judgment_amount_cents / judgment_docket_number / judgment_entered_on, or basis = FINAL_CITATION supplying any of them" }

  # ---- business temporal ---------------------------------------------------
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "appeal filed when the clock date is past appeal_deadline (issued_on + 15 days)" }
  - { id: ERR_APPEAL_WINDOW_OPEN, http: 422, condition: "finalize attempted while the clock date is still on or before appeal_deadline" }
  - { id: ERR_ASSIGNMENT_EFFECTIVE_DATE_INVALID, http: 422, condition: "effective_from precedes the licence's issued_on, or effective_to falls after the licence's expires_on" }
  - { id: ERR_COVERAGE_PERIOD_OVERLAP, http: 409, condition: "verification would leave two VERIFIED records of the same coverage_type on one licence with overlapping half-open [effective_date, expiration_date) periods" }
  - { id: ERR_HEARING_SLOT_CONFLICT, http: 409, condition: "the presiding officer already has a SCHEDULED hearing overlapping the half-open [scheduled_start_utc, scheduled_end_utc) block" }
  - { id: ERR_STATUTE_OF_LIMITATIONS_EXPIRED, http: 422, condition: "jurisdiction accepted more than 48 months after COALESCE(work_completed_on, contract_date)" }
  - { id: ERR_CONTRACT_PREDATES_LICENSE, http: 422, condition: "jurisdiction accepted over a licensed subject whose contract_date precedes the licence's issued_on" }
  - { id: ERR_JUDGMENT_NOT_RIPE, http: 422, condition: "a COURT_JUDGMENT claim is approved fewer than 90 days after judgment_entered_on" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 422, condition: "renewal attempted more than 90 days after expires_on" }
  - { id: ERR_SUSPENSION_PERIOD_ACTIVE, http: 422, condition: "reinstatement attempted before suspension_until" }
  - { id: ERR_HEARING_NOT_CONVENED, http: 422, condition: "a decision is rendered before scheduled_start_utc" }

  # ---- business constraint -------------------------------------------------
  - { id: ERR_CE_HOURS_INSUFFICIENT, http: 422, condition: "renewal attempted with a CE shortfall larger than the 4-hour grace band, or reinstatement attempted with ce_hours_completed below the classification's full required_ce_hours" }
  - { id: ERR_CE_HOURS_CEILING_EXCEEDED, http: 422, condition: "a CE credit is non-positive or would push ce_hours_completed past the 40-hour term ceiling" }
  - { id: ERR_EXPERIENCE_INSUFFICIENT, http: 422, condition: "credited_experience_months is below the classification's min_experience_months" }
  - { id: ERR_NET_WORTH_INSUFFICIENT, http: 422, condition: "declared_net_worth_cents is below the classification's min_net_worth_cents" }
  - { id: ERR_BOND_AMOUNT_INSUFFICIENT, http: 422, condition: "a BOND record is verified with amount_cents below the classification's required_bond_amount_cents" }
  - { id: ERR_LOSS_BELOW_JURISDICTIONAL_MINIMUM, http: 422, condition: "jurisdiction accepted on alleged_loss_cents below 50000" }
  - { id: ERR_PENALTY_EXCEEDS_STATUTORY_MAX, http: 422, condition: "MODIFY without modified_penalty_cents, MODIFY above 1500000, or AFFIRM/VACATE supplying modified_penalty_cents" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "a licensee opens a second application for a classification while one is DRAFT, SUBMITTED or DEFICIENT" }

  # ---- business fiscal -----------------------------------------------------
  - { id: ERR_FUND_BALANCE_EXHAUSTED, http: 409, condition: "disbursement attempted when RecoveryFundAccount.balance_cents is 0" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "penalty_payment_cents differs from civil_penalty_cents - penalty_paid_cents (partial payment or overpayment)" }
  - { id: ERR_REPAYMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "repayment_amount_cents is below 1 or above outstanding_recovery_repayment_cents" }
  - { id: ERR_CLAIM_EXCEEDS_ALLEGED_LOSS, http: 422, condition: "claimed_amount_cents is below 1 or above the complaint's alleged_loss_cents" }

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================
roles:

  - name: BoardAdmin
    description: "Board registrar. Owns reference data (classifications, fund appropriations), registers parties, calendars hearings and runs the compliance sweep. Never adjudicates."
    identity: opaque
    exclusive_operations:
      - "POST /licensing/trade-classifications"
      - "POST /licensing/recovery-fund-accounts"
    shared_operations:
      - "POST /licensing/licensees, /licensing/qualifying-individuals, /licensing/consumers (with LicensingAnalyst)"
      - "POST /licensing/qualifying-individuals/{id}/exam-results (with LicensingAnalyst)"
      - "POST /licensing/disciplinary-hearings (with HearingOfficer)"
      - "POST /licensing/compliance-sweeps (with LicensingAnalyst)"
      - "POST /_clock/set_current_utc"
      - "all GET reads"

  - name: LicensingAnalyst
    description: "Licensing desk. Decides applications, verifies and cancels coverage, designates and withdraws qualifiers, reinstates suspended licences, screens complaints, runs mediation, and defaults unappealed citations to final. Does not investigate, does not preside, does not touch the fund."
    identity: opaque
    exclusive_operations:
      - "POST /licensing/license-applications/{id}/decision"
      - "POST /licensing/coverage-records/{id}/verification"
      - "POST /licensing/coverage-records/{id}/cancel"
      - "POST /licensing/qualifier-assignments"
      - "POST /licensing/qualifier-assignments/{id}/withdraw"
      - "POST /licensing/licenses/{id}/reinstate"
      - "POST /licensing/complaints/{id}/screen"
      - "POST /licensing/complaints/{id}/mediation-outcome"
      - "POST /licensing/citations/{id}/finalize"
    shared_operations:
      - "POST /licensing/licensees, /licensing/qualifying-individuals, /licensing/consumers (with BoardAdmin)"
      - "POST /licensing/qualifying-individuals/{id}/exam-results (with BoardAdmin)"
      - "POST /licensing/license-applications (with Licensee)"
      - "POST /licensing/coverage-records (with Licensee)"
      - "POST /licensing/licenses/{id}/ce-credits (with Licensee)"
      - "POST /licensing/complaints (with Consumer)"
      - "POST /licensing/compliance-sweeps (with BoardAdmin)"
      - "all GET reads"

  - name: Investigator
    description: "Enforcement field staff. Opens complaint and sting cases, closes them with a severity finding, issues citations, and may remand a complaint for a second mediation attempt. Barred from presiding over the hearing on a case it built."
    identity: opaque
    exclusive_operations:
      - "POST /licensing/investigations"
      - "POST /licensing/investigations/{id}/close"
      - "POST /licensing/citations"
      - "POST /licensing/complaints/{id}/remand-to-mediation"
    shared_operations:
      - "all GET reads"

  - name: HearingOfficer
    description: "Administrative law officer. Presides over appealed citations and renders the disposition that grades the sanction ladder. Only the hearing's own presiding_officer_user_id may decide it."
    identity: opaque
    exclusive_operations:
      - "POST /licensing/disciplinary-hearings/{id}/decide"
    shared_operations:
      - "POST /licensing/disciplinary-hearings (with BoardAdmin)"
      - "all GET reads"

  - name: FundAdjudicator
    description: "Recovery-fund office. Adjudicates and disburses consumer claims against the pool. Separate from both the licensing desk and enforcement so the office that grades the violation is not the office that spends the fund."
    identity: opaque
    exclusive_operations:
      - "POST /licensing/recovery-fund-claims/{id}/adjudicate"
      - "POST /licensing/recovery-fund-claims/{id}/pay"
    shared_operations:
      - "POST /licensing/recovery-fund-claims (with Consumer)"
      - "all GET reads"

  - name: Licensee
    description: "The contracting entity. X-User-ID is the Licensee.id. Drives its own applications, banks CE, renews, repays recovery-fund money, appeals citations and complies with them. May never decide, screen, verify, investigate, preside or adjudicate."
    identity: "entity_backed:Licensee"
    exclusive_operations:
      - "POST /licensing/license-applications/{id}/submit"
      - "POST /licensing/license-applications/{id}/cure"
      - "POST /licensing/license-applications/{id}/withdraw"
      - "POST /licensing/licenses/{id}/renew"
      - "POST /licensing/licenses/{id}/recovery-repayments"
      - "POST /licensing/citations/{id}/appeal"
      - "POST /licensing/citations/{id}/comply"
    shared_operations:
      - "POST /licensing/license-applications (with LicensingAnalyst)"
      - "POST /licensing/coverage-records (with LicensingAnalyst)"
      - "POST /licensing/licenses/{id}/ce-credits (with LicensingAnalyst)"
      - "GET reads of its own licences, applications, coverage, designations, citations, hearings and the claims filed against it"

  - name: Consumer
    description: "The complaining consumer. X-User-ID is the Consumer.id. Files and withdraws complaints and files recovery-fund claims. Cannot screen, mediate, investigate or adjudicate."
    identity: "entity_backed:Consumer"
    exclusive_operations:
      - "POST /licensing/complaints/{id}/withdraw"
    shared_operations:
      - "POST /licensing/complaints (with LicensingAnalyst)"
      - "POST /licensing/recovery-fund-claims (with FundAdjudicator)"
      - "GET reads of its own complaints and claims, plus public licence and citation reads"
