  - rule_id: transitive_cascade
    instances:
      - name: adverse_opinion_six_hop_cascade
        grounds:
          - state_machines.PackagingReport.UNDER_VERIFICATION_to_CORRECTION_REQUIRED
          - calculations.reported_weight_ytd_rollup
          - calculations.producer_fee_balance_rollup
          - calculations.registration_compliance_posture
          - state_machines.Membership.ACTIVE_to_PROBATION
          - state_machines.Invoice.ISSUED_to_VOID
        distinguishing_aspect: |
          One ADVERSE opinion call propagates six hops deep across five entities
          (PackagingReport correction_due_at -> Registration.reported_weight_kg_ytd ->
          PackagingReport.fee_status/Invoice.status -> Producer.assessed_fee_balance_cents ->
          Registration.compliance_posture -> Membership.status), so hops 4 and 6 are only reachable
          through hops 3 and 5 respectively.
        test_recipe:
          setup:
            - "CA program (verification_required_threshold_kg 3000, correction_window_days 30 on the period) with a GLASS band [0,-) at 9 cents/kg."
            - "Producer P7 (revenue 8000000, brand owner) with one ACTIVE GLASS SKU of 50 g and units_sold_annual_estimate 110, so annual_packaging_weight_kg is 5.500."
            - "P7 holds an ACTIVE CA registration and a PAID ACTIVE membership (fee 250000 cents); the single CA-2026-H2 report has one 110-unit line (5.500 kg), is SUBMITTED, FINAL-assessed at 50 cents and invoiced at 53 cents (admin fee round_half_up(50 * 500 / 10000) = 3)."
            - "Because total_weight_kg 5.500 is below verification_required_threshold_kg 3000 the report was assessable without an opinion, so the engagement in the trigger is the first one on this report."
            - "The logical clock is 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /epr/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
