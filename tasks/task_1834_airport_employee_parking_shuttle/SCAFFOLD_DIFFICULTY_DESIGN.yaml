scaffold_difficulty_design:
  # ===================================================================
  # Rule 1: dual_variant_calc (>= 2 instances, different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: proration_calendar_day_vs_half_month
        grounds:
          - calculations.proration_charge
          - entities.ParkingProgram.fields.proration_mode
          - state_machines.Permit.OFFERED_to_ACTIVE
        distinguishing_aspect: |
          Identical activation inputs (DAY shift, CORE lot, activation on 2026-08-11 of a
          31-day cycle) produce 7316 under CALENDAR_DAY but 10800 under HALF_MONTH —
          the two proration variants diverge on the ChargeEntry/BillingCycle domain.
        test_recipe:
          setup:
            - "Two programs identical except proration_mode (CAL vs HALF), each with pool 100000, a CORE lot capacity 10, an OPEN August 2026 cycle (31 days), and one DAY employee holding an OFFERED permit"
            - "Logical clock at 2026-08-11T09:00:00Z for both accepts"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-CAL", proration_mode: CALENDAR_DAY, monthly_subsidy_pool_cents: 100000 }, as: ParkingAdmin, captures: { prog_cal: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog_cal}", code: "CORE-A", tier: CORE, capacity: 10 }, as: ParkingAdmin, captures: { lot_cal: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog_cal}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc_cal: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog_cal}", badge_number: "B001", full_name: "Cal Day", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { emp_cal: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${emp_cal}", lot_id: "${lot_cal}", vehicle_plate: "CAL001" }, as: Employee, as_user_id: "${emp_cal}", captures: { perm_cal: $.data.id } }
            - { call: "POST /parking/programs", payload: { name: "P-HALF", proration_mode: HALF_MONTH, monthly_subsidy_pool_cents: 100000 }, as: ParkingAdmin, captures: { prog_half: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog_half}", code: "CORE-A", tier: CORE, capacity: 10 }, as: ParkingAdmin, captures: { lot_half: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog_half}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc_half: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog_half}", badge_number: "B001", full_name: "Half Day", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { emp_half: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${emp_half}", lot_id: "${lot_half}", vehicle_plate: "HALF01" }, as: Employee, as_user_id: "${emp_half}", captures: { perm_half: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/permits/${perm_cal}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${emp_cal}" }
            - { call: "POST /parking/permits/${perm_half}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${emp_half}" }
          assert:
            - "GET /parking/charge-entries?permit_id=${perm_cal} has exactly one PERMIT_FEE entry with amount_cents == 7316 (round_half_up(10800 * 21/31)) and span [2026-08-11, 2026-08-31]"
            - "GET /parking/charge-entries?permit_id=${perm_half} has exactly one PERMIT_FEE entry with amount_cents == 10800 (day_index 11 <= 15 -> full month)"
            - "Both permits are ACTIVE with monthly_fee_cents == 12000 (gross snapshot; identical inputs, divergent charges 7316 vs 10800)"

      - name: shuttle_sla_scheduled_vs_observed
        grounds:
          - calculations.shuttle_wait_time_service_level
          - state_machines.ShuttleTrip.SCHEDULED_to_DEPARTED
          - state_machines.ShuttleTrip.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          One trip set (4 trips at 10-minute headways, middle two cancelled) is SLA-compliant
          under the SCHEDULED variant (max gap 10 <= 20) but non-compliant under OBSERVED
          (actual gap 30 > 20) — dual-variant logic on the ShuttleRoute/ShuttleTrip domain,
          a different entity domain than proration_calendar_day_vs_half_month.
        test_recipe:
          setup:
            - "Program, CORE lot, route R (headway_target_minutes 10, operating_cost 4000), four trips scheduled 2026-08-03T08:00/08:10/08:20/08:30Z"
            - "Trip 1 DEPARTED at 08:00 and trip 4 DEPARTED at 08:30 (logical clock); trips 2 and 3 CANCELLED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-SLA" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 10 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/routes", payload: { lot_id: "${lot}", code: "R1", headway_target_minutes: 10, operating_cost_per_trip_cents: 4000 }, as: ShuttleDispatcher, captures: { rte: $.data.id } }
            - { call: "POST /parking/trips", payload: { route_id: "${rte}", scheduled_departure_at: "2026-08-03T08:00:00Z" }, as: ShuttleDispatcher, captures: { t1: $.data.id } }
            - { call: "POST /parking/trips", payload: { route_id: "${rte}", scheduled_departure_at: "2026-08-03T08:10:00Z" }, as: ShuttleDispatcher, captures: { t2: $.data.id } }
            - { call: "POST /parking/trips", payload: { route_id: "${rte}", scheduled_departure_at: "2026-08-03T08:20:00Z" }, as: ShuttleDispatcher, captures: { t3: $.data.id } }
            - { call: "POST /parking/trips", payload: { route_id: "${rte}", scheduled_departure_at: "2026-08-03T08:30:00Z" }, as: ShuttleDispatcher, captures: { t4: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/trips/${t1}/events", payload: { event_type: DEPART }, as: ShuttleDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:30:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/trips/${t4}/events", payload: { event_type: DEPART }, as: ShuttleDispatcher }
            - { call: "POST /parking/trips/${t2}/events", payload: { event_type: CANCEL }, as: ShuttleDispatcher }
            - { call: "POST /parking/trips/${t3}/events", payload: { event_type: CANCEL }, as: ShuttleDispatcher }
          trigger:
            - { call: "GET /parking/routes/${rte}/service-level", payload: { window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-03T23:59:59Z", mode: SCHEDULED }, as: ShuttleDispatcher, captures: { sla_s: $.data } }
            - { call: "GET /parking/routes/${rte}/service-level", payload: { window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-03T23:59:59Z", mode: OBSERVED }, as: ShuttleDispatcher, captures: { sla_o: $.data } }
          assert:
            - "SCHEDULED response: trip_count == 4, max_gap_minutes == 10, expected_wait_minutes == 5.0, sla_compliant == true"
            - "OBSERVED response: trip_count == 2, max_gap_minutes == 30, expected_wait_minutes == 15.0, sla_compliant == false"
            - "Same window, same trips, divergent verdicts: sla_s.sla_compliant != sla_o.sla_compliant"

      - name: cost_report_gross_vs_net
        grounds:
          - calculations.program_cost_per_employee
          - entities.ParkingLot.fields.monthly_maintenance_cents
          - entities.ChargeEntry.fields.subsidy_cents
        distinguishing_aspect: |
          The GROSS variant reports 19000 while NET reports 16550 for identical program data
          (subsidy spend 7350 is the only difference) — a dual-variant aggregation on the
          ParkingProgram economics domain, distinct from both proration and shuttle SLA.
        test_recipe:
          setup:
            - "Program with pool 100000; CORE lot maintenance 30000; REMOTE lot maintenance 15000; August cycle"
            - "DAY, NIGHT, ROTATING employees each holding an ACTIVE permit accepted 2026-08-01 (fees 10800/5400/7650 with subsidy_cents 1200/3600/2550)"
            - "Route on the CORE lot (cost 4000/trip) with exactly 3 COMPLETED trips"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-COST", monthly_subsidy_pool_cents: 100000 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 10, monthly_maintenance_cents: 30000 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "REM-A", tier: REMOTE, capacity: 10, monthly_maintenance_cents: 15000 }, as: ParkingAdmin }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Night Two", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B003", full_name: "Rot Three", employer_code: "ACME", shift_pattern: ROTATING, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e3: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { p2: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e3}", lot_id: "${lot}", vehicle_plate: "P003" }, as: Employee, as_user_id: "${e3}", captures: { p3: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /parking/permits/${p2}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e2}" }
            - { call: "POST /parking/permits/${p3}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e3}" }
            - { call: "POST /parking/routes", payload: { lot_id: "${lot}", code: "R1", headway_target_minutes: 10, operating_cost_per_trip_cents: 4000 }, as: ShuttleDispatcher, captures: { rte: $.data.id } }
            - { call: "POST /parking/trips", payload: { route_id: "${rte}", scheduled_departure_at: "2026-08-02T08:00:00Z" }, as: ShuttleDispatcher, captures: { t1: $.data.id } }
            - { call: "POST /parking/trips", payload: { route_id: "${rte}", scheduled_departure_at: "2026-08-02T08:10:00Z" }, as: ShuttleDispatcher, captures: { t2: $.data.id } }
            - { call: "POST /parking/trips", payload: { route_id: "${rte}", scheduled_departure_at: "2026-08-02T08:20:00Z" }, as: ShuttleDispatcher, captures: { t3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/trips/${t1}/events", payload: { event_type: DEPART }, as: ShuttleDispatcher }
            - { call: "POST /parking/trips/${t1}/events", payload: { event_type: COMPLETE, boarded_count: 12 }, as: ShuttleDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:10:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/trips/${t2}/events", payload: { event_type: DEPART }, as: ShuttleDispatcher }
            - { call: "POST /parking/trips/${t2}/events", payload: { event_type: COMPLETE, boarded_count: 8 }, as: ShuttleDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:20:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/trips/${t3}/events", payload: { event_type: DEPART }, as: ShuttleDispatcher }
            - { call: "POST /parking/trips/${t3}/events", payload: { event_type: COMPLETE, boarded_count: 5 }, as: ShuttleDispatcher }
          trigger:
            - { call: "GET /parking/programs/${prog}/cost-report", payload: {}, as: PayrollAdmin, captures: { rep: $.data } }
          assert:
            - "rep.total_cost_cents == 57000 (3 trips x 4000 + 30000 + 15000 maintenance)"
            - "rep.subsidy_spent_cents == 7350 (1200 + 3600 + 2550 from the three PERMIT_FEE entries)"
            - "rep.active_permit_count == 3"
            - "rep.gross_cost_per_employee_cents == 19000 (round_half_up(57000/3))"
            - "rep.net_cost_per_employee_cents == 16550 (round_half_up((57000 - 7350)/3)) — diverges from gross by exactly the per-capita subsidy"

  # ===================================================================
  # Rule 2: combinatorial_formula (>= 2 instances, different modes a/b/c)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_tier_shift_pool_interaction
        grounds:
          - calculations.permit_monthly_fee
          - calculations.subsidy_per_capita_cap
          - entities.BillingCycle.fields.subsidy_per_capita_cap_cents
        distinguishing_aspect: |
          Mode (a): the fee formula combines >= 3 inputs (lot tier base rate, shift multiplier,
          pool-derived per-capita cap) with non-linear interaction — the min(pct x gross, cap, gross)
          binds at the pool cap (500), so a NIGHT permit nets 8500 instead of 5400 while the
          stored cycle cap remains 500.
        test_recipe:
          setup:
            - "Program with monthly_subsidy_pool_cents 1000; CORE lot capacity 10; August cycle (cap snapshot 1000 with 0 eligible); DAY and NIGHT employees ACTIVE (nets 11000 and 8000 under the August cap)"
            - "September cycle created afterwards -> 2 eligible ACTIVE permits -> subsidy_per_capita_cap_cents == floor(1000/2) == 500; full-period entries 11500 (DAY) and 8500 (NIGHT) posted at creation"
            - "A third NIGHT employee applies and accepts on 2026-09-05 (26 active days of 30)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-FEE", monthly_subsidy_pool_cents: 1000 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 10 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Night Two", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { p2: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /parking/permits/${p2}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e2}" }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: PayrollAdmin, captures: { cyc2: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B003", full_name: "Night Three", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e3: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e3}", lot_id: "${lot}", vehicle_plate: "P003" }, as: Employee, as_user_id: "${e3}", captures: { p3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T09:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/permits/${p3}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e3}" }
            - { call: "GET /parking/billing-cycles/${cyc2}", payload: {}, as: PayrollAdmin, captures: { c2: $.data } }
          assert:
            - "c2.subsidy_per_capita_cap_cents == 500 (floor(1000 / 2) frozen at creation)"
            - "E3's PERMIT_FEE entry amount_cents == 7367 (round_half_up((9000 - min(3600, 500)) * 26/30)) — the pool cap, not the 40% shift subsidy, sets the net"
            - "c2.total_charges_cents == 27367 (11500 + 8500 + 7367)"
            - "E3's entry subsidy_cents == 433 (round_half_up(500 * 26/30))"

      - name: proration_per_entry_rounding_order
        grounds:
          - calculations.proration_charge
          - entities.BillingCycle.fields.total_charges_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two identical ROTATING permits
          activated 2026-08-22 each post round_half_up(10200 * 10/31) == 3290; the pinned
          per-entry-then-sum order yields cycle total 6580, whereas sum-then-round would yield
          6581. The scaffold pins per-entry rounding.
        test_recipe:
          setup:
            - "Program CALENDAR_DAY with pool 0 (subsidy always 0, nets equal gross); CORE lot capacity 10; OPEN August cycle"
            - "Two ROTATING employees, both accepting on 2026-08-22 (10 active days of 31)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-RND", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 10 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Rot One", employer_code: "ACME", shift_pattern: ROTATING, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Rot Two", employer_code: "ACME", shift_pattern: ROTATING, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { p2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T08:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /parking/permits/${p2}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e2}" }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { c: $.data } }
          assert:
            - "Each permit's PERMIT_FEE entry amount_cents == 3290 (round_half_up(10200 * 10/31) per entry)"
            - "c.total_charges_cents == 6580 (3290 + 3290) — NOT 6581, which the rejected sum-then-round order would produce"

      - name: subsidy_cap_evaluation_order
        grounds:
          - calculations.subsidy_per_capita_cap
          - calculations.permit_monthly_fee
          - validations[priority=10]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — the September cap
          divides pool 900 by the eligible count snapshot (3 ACTIVE, GOOD_STANDING permits)
          BEFORE any September fee exists, giving cap 300 and full-period entries
          11700/8700/9900 (each shift's nominal subsidy 1200/3600/2550 is clamped to 300).
        test_recipe:
          setup:
            - "Program with pool 900; CORE lot; August cycle (cap snapshot 900 with 0 eligible)"
            - "DAY, NIGHT, ROTATING employees all ACTIVE in August"
            - "September cycle created -> eligible_count snapshot 3 -> cap 300"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-SUB", monthly_subsidy_pool_cents: 900 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 10 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Night Two", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B003", full_name: "Rot Three", employer_code: "ACME", shift_pattern: ROTATING, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e3: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { p2: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e3}", lot_id: "${lot}", vehicle_plate: "P003" }, as: Employee, as_user_id: "${e3}", captures: { p3: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /parking/permits/${p2}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e2}" }
            - { call: "POST /parking/permits/${p3}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e3}" }
          trigger:
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: PayrollAdmin, captures: { cyc2: $.data.id } }
            - { call: "GET /parking/billing-cycles/${cyc2}", payload: {}, as: PayrollAdmin, captures: { c2: $.data } }
          assert:
            - "c2.subsidy_per_capita_cap_cents == 300 (floor(900/3) using the pre-fee eligibility snapshot)"
            - "September full-period entries: DAY 11700, NIGHT 8700, ROTATING 9900 — every nominal subsidy clamped to 300 by the cap"
            - "c2.total_charges_cents == 30300"
            - "Eligibility is evaluated from standing BEFORE these September fees exist (no circularity: the new entries cannot change the count that produced them)"

  # ===================================================================
  # Rule 3: non_linear_state_machine (>= 2 instances, different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_suspend_reinstate_cycle
        grounds:
          - state_machines.Permit.ACTIVE_to_SUSPENDED
          - state_machines.Permit.SUSPENDED_to_ACTIVE
          - entities.ChargeEntry.fields.span_start
        distinguishing_aspect: |
          Permit is cyclic: ACTIVE -> SUSPENDED (2026-08-16) -> ACTIVE (2026-08-21) with
          span-truncating billing side effects on both arcs — entry A [08-01,08-31] 10800 is
          REVERSED and replaced by B [08-01,08-16] 5574, then reinstate posts C [08-21,08-31] 3832,
          leaving an unbilled gap 08-17..08-20 and cycle total 9406.
        test_recipe:
          setup:
            - "Program pool 100000 (cap unbound); CORE lot capacity 2; OPEN August cycle; DAY employee with ACTIVE permit accepted 2026-08-01 (entry A 10800)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-CYC", monthly_subsidy_pool_cents: 100000 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T09:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: SUSPEND }, as: ParkingAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T09:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: REINSTATE }, as: ParkingAdmin, captures: { perm: $.data } }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { c: $.data } }
          assert:
            - "perm.status == ACTIVE after the loop (SUSPENDED -> ACTIVE legal only via REINSTATE with suspension_reason ADMIN and standing GOOD_STANDING)"
            - "Three PERMIT_FEE entries exist for ${p1}: A [2026-08-01,2026-08-31] 10800 REVERSED, B [2026-08-01,2026-08-16] 5574 PENDING, C [2026-08-21,2026-08-31] 3832 PENDING"
            - "c.total_charges_cents == 9406 (5574 + 3832); days 2026-08-17..2026-08-20 are billed to nobody"
            - "GET /parking/lots/${lot}.occupied_slots == 1"

      - name: violation_parallel_payment_appeal_dimensions
        grounds:
          - state_machines.Violation.NONE_to_APPEALED
          - state_machines.Violation.APPEALED_to_DISMISSED
          - state_machines.Violation.UNPAID_to_PAID
          - state_machines.Violation.UNPAID_to_REVERSED
        distinguishing_aspect: |
          Violation carries two parallel state dimensions: appeal_status NONE->APPEALED->DISMISSED
          moves while payment_status stays UNPAID, and the DISMISSED arc cross-fires payment_status
          -> REVERSED; a second violation independently walks payment UNPAID->PAID while its
          appeal axis stays NONE.
        test_recipe:
          setup:
            - "Program pool 0; CORE lot; OPEN August cycle; DAY employee with ACTIVE permit (accepted 2026-08-01)"
            - "Officer officer-1 issues V1 WRONG_LOT (fine 3500) on 2026-08-05"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-PAR", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T10:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/violations/${v1}/events", payload: { event_type: APPEAL }, as: Employee, as_user_id: "${e1}", captures: { v1a: $.data } }
            - { call: "POST /parking/violations/${v1}/events", payload: { event_type: DECIDE_APPEAL, decision: DISMISSED }, as: AppealsOfficer, as_user_id: "officer-2", captures: { v1d: $.data } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: NO_PERMIT_DISPLAY }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v2: $.data.id, v2_entry: $.data.charge_entry_id } }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { cv: $.data.version } }
            - { call: "POST /parking/billing-cycles/${cyc}/close", payload: { expected_billing_cycle_version: "${cv}" }, as: PayrollAdmin }
            - { call: "POST /parking/billing-cycles/${cyc}/events", payload: { event_type: EXPORT }, as: PayrollAdmin }
            - { call: "POST /parking/charge-entries/${v2_entry}/settle", payload: { outcome: SETTLED }, as: PayrollAdmin }
            - { call: "GET /parking/violations/${v2}", payload: {}, as: AppealsOfficer, captures: { v2f: $.data } }
          assert:
            - "v1a.appeal_status == APPEALED while v1a.payment_status == UNPAID (dimensions move independently)"
            - "v1d.appeal_status == DISMISSED and v1d.payment_status == REVERSED (cross-dimension side effect); V1's PENDING fine entry is REVERSED"
            - "V2 fine_cents == 2500 (prior_unpaid 0 — the REVERSED V1 is excluded from the escalation window)"
            - "v2f.payment_status == PAID and v2f.appeal_status == NONE after its VIOLATION_FINE entry settles"

  # ===================================================================
  # Rule 4: transitive_cascade (>= 2 instances, depth >= 3 and >= 2, different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: notice_closure_three_hop_cascade
        grounds:
          - state_machines.ServiceChangeNotice.PUBLISHED_to_EFFECTIVE
          - state_machines.ParkingLot.ACTIVE_to_CLOSED
          - state_machines.Permit.ACTIVE_to_SUSPENDED
          - state_machines.ChargeEntry.PENDING_to_REVERSED
        distinguishing_aspect: |
          Depth-3 chain from a single trigger (run-ops): notice becomes EFFECTIVE -> lot flips
          CLOSED -> every ACTIVE permit on the lot flips SUSPENDED(LOT_CLOSURE) -> each suspension
          REVERSES its PENDING fee entry and posts a truncated repost (3484). Each hop is caused by
          the previous link, not by run-ops directly.
        test_recipe:
          setup:
            - "Program pool 100000; CORE lot capacity 5; OPEN August cycle; DAY employee ACTIVE with entry 10800 PENDING (accepted 2026-08-01)"
            - "LOT_CLOSURE notice effective_from 2026-08-10T00:00:00Z, PUBLISHED at 2026-08-01T00:00:00Z (>= now + 72h)"
            - "Clock advanced to 2026-08-10T06:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-CAS", monthly_subsidy_pool_cents: 100000 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /parking/notices", payload: { notice_type: LOT_CLOSURE, headline: "Lot A closes for resurfacing", effective_from: "2026-08-10T00:00:00Z", lot_id: "${lot}" }, as: ParkingAdmin, captures: { ntc: $.data.id } }
            - { call: "POST /parking/notices/${ntc}/events", payload: { event_type: PUBLISH }, as: ParkingAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/programs/${prog}/run-ops", payload: {}, as: ParkingAdmin }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { c: $.data } }
          assert:
            - "GET /parking/notices/${ntc}.status == EFFECTIVE (hop 1)"
            - "GET /parking/lots/${lot}.status == CLOSED (hop 2, caused by hop 1)"
            - "GET /parking/permits/${p1}: status == SUSPENDED, suspension_reason == LOT_CLOSURE, suspended_at == 2026-08-10T06:00:00Z (hop 3, caused by hop 2)"
            - "The original 10800 PERMIT_FEE entry is REVERSED; a truncated PENDING entry [2026-08-01,2026-08-10] amount 3484 exists (hop 3's own billing side effect)"
            - "c.total_charges_cents == 3484"

      - name: violation_threshold_two_hop_cascade
        grounds:
          - calculations.violation_fine_escalation
          - state_machines.Permit.ACTIVE_to_SUSPENDED
          - state_machines.ChargeEntry.PENDING_to_REVERSED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (violation issuance, not run-ops): the third
          unpaid violation crosses the >= 3 threshold -> permit flips SUSPENDED(VIOLATION_THRESHOLD)
          -> the suspension REVERSES the live fee entry and posts a truncated repost (5574).
        test_recipe:
          setup:
            - "Program pool 100000, violation_suspension_threshold 3; CORE lot; OPEN August cycle; DAY employee ACTIVE with entry 10800 PENDING"
            - "Clock 2026-08-16T10:00:00Z; no prior violations"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-ESC", monthly_subsidy_pool_cents: 100000, violation_suspension_threshold: 3 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T10:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: BLOCKED_LANE }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v1: $.data.id, f1: $.data.fine_cents } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: BLOCKED_LANE }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v2: $.data.id, f2: $.data.fine_cents } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: BLOCKED_LANE }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v3: $.data.id, f3: $.data.fine_cents } }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { c: $.data } }
          assert:
            - "f1 == 7500, f2 == 11250, f3 == 15000 (escalation x1.0 / x1.5 / x2.0 on BLOCKED_LANE base 7500)"
            - "After V3: GET /parking/permits/${p1}.status == SUSPENDED with suspension_reason == VIOLATION_THRESHOLD (hop 1 caused by V3's creation, not by any direct permit call)"
            - "The 10800 fee entry is REVERSED and a truncated PENDING repost [2026-08-01,2026-08-16] of 5574 exists (hop 2 caused by hop 1's suspension)"
            - "c.total_charges_cents == 39324 (5574 + 7500 + 11250 + 15000)"

  # ===================================================================
  # Rule 5: priority_pair_validation_conflict (>= 2 instances, different error-category pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_state_beats_billing_hold
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.Permit.OFFERED_to_ACTIVE
        distinguishing_aspect: |
          state (priority 6, ERR_PERMIT_NOT_OFFERED) vs business_fiscal (priority 10,
          ERR_BILLING_HOLD): a second ACCEPT on an already-ACTIVE permit whose owner is on
          BILLING_HOLD violates both; the state error must win.
        test_recipe:
          setup:
            - "Program pool 0; CORE lot capacity 2; August cycle; DAY employee E1 with permit already ACTIVE (accepted 2026-08-01)"
            - "E1 standing == BILLING_HOLD: a 5000 ADJUSTMENT_DEBIT was posted, the cycle closed and exported, and the adjustment settled DEDUCTION_FAILED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-PVC1", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /parking/charge-entries", payload: { cycle_id: "${cyc}", employee_id: "${e1}", charge_type: ADJUSTMENT_DEBIT, amount_cents: 5000, description: "badge replacement" }, as: PayrollAdmin, captures: { adj: $.data.id } }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { cv: $.data.version } }
            - { call: "POST /parking/billing-cycles/${cyc}/close", payload: { expected_billing_cycle_version: "${cv}" }, as: PayrollAdmin }
            - { call: "POST /parking/billing-cycles/${cyc}/events", payload: { event_type: EXPORT }, as: PayrollAdmin }
            - { call: "POST /parking/charge-entries/${adj}/settle", payload: { outcome: DEDUCTION_FAILED }, as: PayrollAdmin }
          trigger:
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}", captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_PERMIT_NOT_OFFERED with http 409 (state, priority 6) — NOT ERR_BILLING_HOLD (business_fiscal, priority 10), even though both preconditions fail"
            - "GET /parking/employees/${e1}.standing == BILLING_HOLD and balance_due_cents == 5000 (the fiscal failure was real and remains)"
            - "GET /parking/permits/${p1}.status remains ACTIVE (no side effects fired)"

      - name: tow_safety_beats_hold_timer
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.TowEvent
        distinguishing_aspect: |
          business_safety (priority 7, ERR_TOW_VIOLATION_NOT_ENFORCEABLE) vs business_temporal
          (priority 8, ERR_TOW_HOLD_NOT_ELAPSED): tow authorization citing an already-PAID
          violation only 4 hours into the 48-hour hold violates both; the safety error must win.
        test_recipe:
          setup:
            - "Program threshold 3, tow_hold_hours 48, pool 0; CORE lot; August cycle; DAY employee ACTIVE (accepted 2026-08-01)"
            - "Three BLOCKED_LANE violations issued at 2026-08-10T08:00:00Z -> permit SUSPENDED(VIOLATION_THRESHOLD), suspended_at 08-10T08:00"
            - "Cycle closed and exported; V3's fine entry settled SETTLED -> V3.payment_status == PAID"
            - "Clock at 2026-08-10T12:00:00Z (4h < 48h hold)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-PVC2", monthly_subsidy_pool_cents: 0, violation_suspension_threshold: 3, tow_hold_hours: 48 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: BLOCKED_LANE }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: BLOCKED_LANE }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v2: $.data.id } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: BLOCKED_LANE }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v3: $.data.id, v3_entry: $.data.charge_entry_id } }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { cv: $.data.version } }
            - { call: "POST /parking/billing-cycles/${cyc}/close", payload: { expected_billing_cycle_version: "${cv}" }, as: PayrollAdmin }
            - { call: "POST /parking/billing-cycles/${cyc}/events", payload: { event_type: EXPORT }, as: PayrollAdmin }
            - { call: "POST /parking/charge-entries/${v3_entry}/settle", payload: { outcome: SETTLED }, as: PayrollAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/tow-events", payload: { permit_id: "${p1}", violation_id: "${v3}" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_TOW_VIOLATION_NOT_ENFORCEABLE with http 409 (business_safety, priority 7) — NOT ERR_TOW_HOLD_NOT_ELAPSED (business_temporal, priority 8), even though the 48h hold has also not elapsed"
            - "GET /parking/permits/${p1}.status remains SUSPENDED with suspension_reason VIOLATION_THRESHOLD"
            - "No TowEvent is created (GET /parking/tow-events?permit_id=${p1} is empty)"

  # ===================================================================
  # Rule 6: boundary_precision_check (>= 2 instances, different metrics/endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: offer_accept_at_exact_expiry
        grounds:
          - validations[priority=8]
          - state_machines.Permit.OFFERED_to_ACTIVE
          - entities.Permit.fields.offer_expires_at
        distinguishing_aspect: |
          Time metric on the accept endpoint: accept is valid while now <= offer_expires_at
          (inclusive) — at exactly the expiry second it succeeds (entry 9755), one second later
          it fails with ERR_OFFER_EXPIRED and the permit stays OFFERED.
        test_recipe:
          setup:
            - "Program pool 100000, waitlist_offer_ttl_hours 72; CORE lot capacity 2; OPEN August cycle"
            - "E1 and E2 (DAY) both OFFERED at 2026-08-01T09:00:00Z -> offer_expires_at 2026-08-04T09:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-BND", monthly_subsidy_pool_cents: 100000, waitlist_offer_ttl_hours: 72 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Day Two", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id, exp1: $.data.offer_expires_at } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}", captures: { perm1: $.data } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:01Z" }, as: ParkingAdmin }
            - { call: "POST /parking/permits/${p2}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e2}", captures: { err2: $.data.error_id } }
          assert:
            - "exp1 == 2026-08-04T09:00:00Z (offered 2026-08-01T09:00:00Z + 72h)"
            - "E1's accept at exactly the expiry second succeeds: perm1.status == ACTIVE; its PERMIT_FEE entry spans [2026-08-04,2026-08-31] with amount_cents == 9755 (round_half_up(10800*28/31))"
            - "err2 == ERR_OFFER_EXPIRED with http 409 one second later; GET /parking/permits/${p2}.status remains OFFERED (failed accept mutates nothing)"

      - name: violation_suspension_at_exact_threshold
        grounds:
          - calculations.violation_fine_escalation
          - validations[priority=9]
          - state_machines.Permit.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Count metric on the violations endpoint: with threshold 3 the comparison is >= —
          the 2nd unpaid violation leaves the permit ACTIVE, the 3rd (prior_unpaid + 1 == 3)
          suspends it. Boundary sits exactly at the threshold value.
        test_recipe:
          setup:
            - "Program pool 0, violation_suspension_threshold 3; CORE lot; OPEN August cycle; DAY employee ACTIVE"
            - "Clock 2026-08-16T10:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-THR", monthly_subsidy_pool_cents: 0, violation_suspension_threshold: 3 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T10:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { f1: $.data.fine_cents } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { f2: $.data.fine_cents } }
            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { mid: $.data.status } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { f3: $.data.fine_cents } }
            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { fin: $.data.status } }
          assert:
            - "f1 == 3500 and f2 == 5250 (WRONG_LOT base 3500, escalation x1.0 then x1.5)"
            - "mid == ACTIVE after exactly 2 unpaid violations (2 < 3 does not suspend)"
            - "f3 == 7000 (x2.0) and fin == SUSPENDED with suspension_reason VIOLATION_THRESHOLD (3 >= 3 suspends — equality triggers)"

  # ===================================================================
  # Rule 7: cross_entity_state_dependency (>= 2 instances, different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: accept_requires_active_employee
        grounds:
          - state_machines.Permit.OFFERED_to_ACTIVE
          - state_machines.Employee.ACTIVE_to_TERMINATED
          - validations[priority=7]
        distinguishing_aspect: |
          Permit -> Employee pair: ACCEPT's valid next-state set depends on
          Employee.employment_status — a TERMINATED employee's offer cannot be accepted
          (ERR_EMPLOYEE_NOT_ACTIVE) even though the permit itself is legitimately OFFERED.
        test_recipe:
          setup:
            - "Program pool 0; CORE lot capacity 2; OPEN August cycle; E1 DAY OFFERED at 2026-08-01"
            - "E1 terminated at 2026-08-02T09:00:00Z (no run-ops yet, so the permit is NOT swept)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-XE1", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/employees/${e1}/terminate", payload: {}, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}", captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_EMPLOYEE_NOT_ACTIVE with http 409"
            - "GET /parking/permits/${p1}.status remains OFFERED (termination alone does not sweep; only run-ops revokes)"
            - "GET /parking/employees/${e1}.employment_status == TERMINATED"

      - name: depart_requires_active_route
        grounds:
          - state_machines.ShuttleTrip.SCHEDULED_to_DEPARTED
          - state_machines.ShuttleRoute.ACTIVE_to_SUSPENDED
          - validations[priority=6]
        distinguishing_aspect: |
          ShuttleTrip -> ShuttleRoute pair: DEPART is a valid trip transition only while the
          parent route is ACTIVE; a SCHEDULED trip on a SUSPENDED route is rejected with
          ERR_ROUTE_NOT_ACTIVE and keeps actual_departure_at null.
        test_recipe:
          setup:
            - "Program; CORE lot; route R1 ACTIVE; trip T scheduled 2026-08-03T08:00:00Z"
            - "Route suspended at 2026-08-03T07:55:00Z (trip remains SCHEDULED — suspension does not cancel trips)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-XE2" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/routes", payload: { lot_id: "${lot}", code: "R1", headway_target_minutes: 10, operating_cost_per_trip_cents: 4000 }, as: ShuttleDispatcher, captures: { rte: $.data.id } }
            - { call: "POST /parking/trips", payload: { route_id: "${rte}", scheduled_departure_at: "2026-08-03T08:00:00Z" }, as: ShuttleDispatcher, captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T07:55:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/routes/${rte}/events", payload: { event_type: SUSPEND }, as: ShuttleDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/trips/${t1}/events", payload: { event_type: DEPART }, as: ShuttleDispatcher, captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_ROUTE_NOT_ACTIVE with http 409"
            - "GET /parking/trips/${t1}: status == SCHEDULED and actual_departure_at is null"

  # ===================================================================
  # Rule 8: resource_temporal_overlap (>= 2 instances, different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: peak_window_half_open_adjacency
        grounds:
          - validations[priority=9]
          - entities.PeakWindow.fields.starts_at
          - state_machines.PeakWindow
        distinguishing_aspect: |
          Half-open [starts_at, ends_at) semantics on the ParkingLot resource: a new window
          starting at 2026-08-19T23:59:59Z overlaps [08-10,08-20) and is rejected, while one
          starting exactly at 2026-08-20T00:00:00Z (adjacent, zero shared instant) is accepted.
        test_recipe:
          setup:
            - "Program; REMOTE lot R (STANDBY); existing non-CANCELLED PeakWindow [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-PK" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "REM-A", tier: REMOTE, capacity: 40 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/peak-windows", payload: { lot_id: "${lot}", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z" }, as: ParkingAdmin, captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /parking/peak-windows", payload: { lot_id: "${lot}", starts_at: "2026-08-19T23:59:59Z", ends_at: "2026-08-25T00:00:00Z" }, as: ParkingAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /parking/peak-windows", payload: { lot_id: "${lot}", starts_at: "2026-08-20T00:00:00Z", ends_at: "2026-08-25T00:00:00Z" }, as: ParkingAdmin, captures: { w2: $.data.id } }
          assert:
            - "err1 == ERR_PEAK_WINDOW_OVERLAP with http 409 (one second of shared time is an overlap)"
            - "The adjacent create succeeds: w2 bound, GET /parking/peak-windows/${w2}.status == SCHEDULED"
            - "Exactly 2 windows exist for the lot afterwards (the rejected create left no residue)"

      - name: billing_cycle_closed_interval_boundary
        grounds:
          - validations[priority=9]
          - entities.BillingCycle.fields.period_end
          - state_machines.BillingCycle
        distinguishing_aspect: |
          Closed-interval [period_start, period_end] semantics on the ParkingProgram resource:
          a cycle starting 2026-08-31 shares the boundary DAY with [2026-08-01, 2026-08-31] and
          is rejected, while 2026-09-01 is accepted — adjacency is FORBIDDEN here, the exact
          opposite of the peak-window half-open rule on a different resource.
        test_recipe:
          setup:
            - "Program; existing cycle [2026-08-01, 2026-08-31]"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-BC" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-31", period_end: "2026-09-30" }, as: PayrollAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: PayrollAdmin, captures: { c2: $.data.id } }
          assert:
            - "err1 == ERR_BILLING_CYCLE_OVERLAP with http 409 (sharing the boundary day 2026-08-31 is an overlap under closed-interval semantics)"
            - "The 2026-09-01 create succeeds: c2 bound, status OPEN"
            - "GET /parking/billing-cycles?program_id=${prog} returns exactly 2 cycles"

  # ===================================================================
  # Rule 9: compensating_invariant (>= 2 instances, different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slot_occupancy_forward_reverse_conservation
        grounds:
          - calculations.lot_occupancy
          - state_machines.Permit.OFFERED_to_ACTIVE
          - state_machines.Permit.ACTIVE_to_REVOKED
          - entities.ParkingLot.fields.occupied_slots
        distinguishing_aspect: |
          Conserved quantity: ParkingLot.occupied_slots (a slot count). Forward accept (+1)
          paired with compensating revoke (-1) returns occupied_slots to its exact baseline,
          and at every step occupied_slots == count(ACTIVE permits on the lot).
        test_recipe:
          setup:
            - "Program pool 0; CORE lot capacity 2; OPEN August cycle; E1 and E2 (DAY) each OFFERED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-SLOT", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Day Two", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "GET /parking/lots/${lot}", payload: {}, as: ParkingAdmin, captures: { l1: $.data.occupied_slots } }
            - { call: "POST /parking/permits/${p2}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e2}" }
            - { call: "GET /parking/lots/${lot}", payload: {}, as: ParkingAdmin, captures: { l2: $.data.occupied_slots } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: REVOKE }, as: ParkingAdmin }
            - { call: "GET /parking/lots/${lot}", payload: {}, as: ParkingAdmin, captures: { l3: $.data.occupied_slots } }
            - { call: "POST /parking/permits/${p2}/events", payload: { event_type: REVOKE }, as: ParkingAdmin }
            - { call: "GET /parking/lots/${lot}", payload: {}, as: ParkingAdmin, captures: { l4: $.data.occupied_slots } }
          assert:
            - "l1 == 1, l2 == 2, l3 == 1, l4 == 0 — each forward action exactly undone by its compensating action"
            - "At every step occupied_slots == count of ACTIVE permits on the lot (verified against GET /parking/permits?lot_id=${lot}&status=ACTIVE)"
            - "reserved_slots returns to 0 after the two accepts (offers consumed, none leaked)"

      - name: cycle_total_span_truncation_conservation
        grounds:
          - entities.BillingCycle.fields.total_charges_cents
          - state_machines.ChargeEntry.PENDING_to_REVERSED
          - state_machines.Permit.SUSPENDED_to_ACTIVE
          - calculations.proration_charge
        distinguishing_aspect: |
          Conserved quantity: BillingCycle.total_charges_cents (money). A charge followed by its
          compensating reverse+truncate pair never drifts: 10800 -> REVERSED + 5574 -> +3832 on
          reinstate -> C REVERSED + 2090 on revoke, total always equals the sum of non-REVERSED
          entries (final 7664), with each repost rounded per-entry.
        test_recipe:
          setup:
            - "Program pool 100000; CORE lot capacity 5; OPEN August cycle; E1 DAY ACTIVE accepted 2026-08-01 (entry A 10800 PENDING)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-MONEY", monthly_subsidy_pool_cents: 100000 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
