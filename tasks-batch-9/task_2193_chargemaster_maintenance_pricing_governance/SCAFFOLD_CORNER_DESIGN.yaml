            - "ChargeItem.${item}.version == 3"
            - "Facility.${fac}.stale_price_item_count == 0 (the staled item is DRAFT, and the counter only counts ACTIVE items)"
            - "Facility.${fac}.chargemaster_posture == OPEN"
            - "listing price rules for facility ${fac} returns total_count 3"
      - name: contract_term_closed_overlap_then_notice_buffer_then_scope_key_isolation
        claim_type: temporal_validation
        grounds:
          - validations[priority=11]
          - validations[priority=35]
          - validations[priority=36]
          - endpoints[POST /chargemaster/payer-contracts]
        distinguishing_aspect: "Contract terms are CLOSED intervals checked against status IN {ACTIVE, EXPIRED}, so the already-EXPIRED 2026-01-01..2026-06-30 term still blocks: an inverted term returns ERR_VALIDATION, a term starting exactly on the incumbent's term_end_date returns ERR_CONTRACT_TERM_OVERLAP (abutting IS overlap, unlike price rules), a gap of exactly renegotiation_notice_days (30) returns ERR_CONTRACT_TERM_BUFFER_VIOLATION, 31 days is accepted, and a different product_line escapes all three checks."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001."
            - "PayerContract AETNA / COMMERCIAL, PERCENT_OF_CHARGE 4000 bp, term 2026-01-01..2026-06-30, renegotiation_notice_days omitted so the default 30 applies; at the current clock it is EXPIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac}", payer_code: "AETNA", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4000, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-06-30T00:00:00Z", trailing_units: 100 }
              as: ContractManager
              as_user_id: "cm_1"
              captures: { c1: $.data.id, c1_status: $.data.status, c1_notice: $.data.renegotiation_notice_days }
          trigger:
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac}", payer_code: "AETNA", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4000, term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2026-05-01T00:00:00Z" }
              as: ContractManager
              as_user_id: "cm_1"
              captures: { e_schema: $.data.error_id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac}", payer_code: "AETNA", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4000, term_start_date: "2026-06-30T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z" }
              as: ContractManager
              as_user_id: "cm_1"
              captures: { e_overlap: $.data.error_id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac}", payer_code: "AETNA", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4000, term_start_date: "2026-07-30T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z" }
              as: ContractManager
              as_user_id: "cm_1"
              captures: { e_buffer: $.data.error_id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac}", payer_code: "AETNA", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4500, term_start_date: "2026-07-31T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", trailing_units: 200 }
              as: ContractManager
              as_user_id: "cm_1"
              captures: { c2: $.data.id, c2_status: $.data.status }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac}", payer_code: "AETNA", product_line: "MEDICARE_ADVANTAGE", reimbursement_method: "CASE_RATE", case_rate_cents: 350000, term_start_date: "2026-06-30T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", trailing_units: 40 }
              as: ContractManager
              as_user_id: "cm_1"
              captures: { c3: $.data.id, c3_status: $.data.status }
          assert:
            - "${c1_status} == EXPIRED and ${c1_notice} == 30"
            - "${e_schema} == ERR_VALIDATION with HTTP 422 (term_end_date < term_start_date beats the overlap at 35)"
            - "${e_overlap} == ERR_CONTRACT_TERM_OVERLAP with HTTP 409 (2026-06-30 is inside the closed incumbent term)"
            - "${e_buffer} == ERR_CONTRACT_TERM_BUFFER_VIOLATION with HTTP 409 (gap is exactly 30 days, which is not strictly greater than 30)"
            - "the fourth call returns HTTP 201 and ${c2_status} == ACTIVE (a 31-day gap clears the buffer)"
            - "the fifth call returns HTTP 201 and ${c3_status} == ACTIVE (payer_code + product_line is the scope key, so MEDICARE_ADVANTAGE is unconstrained)"
            - "PayerContract.${c2}.percent_of_charge_bp == 4500"
            - "PayerContract.${c3}.case_rate_cents == 350000"
            - "listing payer contracts for facility ${fac} returns total_count 3"

      - name: batch_capacity_and_service_date_window_sit_below_existence_and_batch_state_checks
        claim_type: aggregate_validation
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - validations[priority=37]
          - validations[priority=38]
          - endpoints[POST /chargemaster/charge-capture-batches]
        distinguishing_aspect: "Capacity is a per-DAY aggregate, not a per-batch one: two batches may cover 2026-09-05..09-07, so a third window touching 09-07 is rejected while a window starting 09-08 is accepted. On the line endpoint, an unknown batch_id returns ERR_CAPTURE_RESOURCE_NOT_FOUND even with an out-of-window datetime, the inclusive window end 2026-09-07T23:59:59Z is accepted, and once the batch is RECONCILING the same out-of-window line returns ERR_INVALID_BATCH_STATE instead of ERR_SERVICE_DATE_OUTSIDE_WINDOW."
