            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${g2}", readiness_rating: "READY_1_2", slate_position: 2, expected_critical_role_version: "${r_v3}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { e2: $.data.id } }
