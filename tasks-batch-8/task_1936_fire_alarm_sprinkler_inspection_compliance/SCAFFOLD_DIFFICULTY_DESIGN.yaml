              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "SPRINKLER", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/impairments"
              payload: { impairment_kind: "PLANNED", planned_start: "2026-08-10T08:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { imp1: $.data.id }
          trigger:
            - call: "POST /fire-compliance/systems/${sys_id}/impairments"
              payload: { impairment_kind: "PLANNED", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T14:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_IMPAIRMENT_OVERLAP"
            - "HTTP status == 409"
            - "no second Impairment persisted on ${sys_id}"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: false_alarm_third_alarm_exactly_triggers_fee
        grounds:
          - calculations.false_alarm_fee
          - entities.FalseAlarmCase.fields.sequence_number
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Threshold boundary on the chargeable-alarm COUNT metric: alarms 1-2
          cost 0, alarm exactly 3 costs 15000 (>= vs > pinned). Reached via
          POST /false-alarm-cases + assess on a BUSINESS property.
        test_recipe:
          setup:
            - "BUSINESS property with 2 prior ASSESSED chargeable false alarms in the rolling window (2026-08-02, 2026-08-03)"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Boundary Co", state_license_no: "C-1111" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "3 Edge Ct", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/false-alarm-cases"
              payload: { alarm_occurred_at: "2026-08-02T01:00:00Z", cause_code: "EQUIPMENT_FAULT" }
              as: FireMarshal
              captures: { fa1: $.data.id }
            - call: "POST /fire-compliance/false-alarm-cases/${fa1}/assess"
              payload: {}
              as: FireMarshal
            - call: "POST /fire-compliance/properties/${prop_id}/false-alarm-cases"
              payload: { alarm_occurred_at: "2026-08-03T01:00:00Z", cause_code: "UNKNOWN" }
              as: FireMarshal
              captures: { fa2: $.data.id }
            - call: "POST /fire-compliance/false-alarm-cases/${fa2}/assess"
              payload: {}
              as: FireMarshal
          trigger:
            - call: "POST /fire-compliance/properties/${prop_id}/false-alarm-cases"
              payload: { alarm_occurred_at: "2026-08-04T01:00:00Z", cause_code: "NEGLIGENCE" }
              as: FireMarshal
              captures: { fa3: $.data.id, seq3: $.data.sequence_number }
            - call: "POST /fire-compliance/false-alarm-cases/${fa3}/assess"
              payload: {}
              as: FireMarshal
          assert:
            - "FalseAlarmCase.${fa1}.fee_cents == 0 (sequence 1)"
            - "FalseAlarmCase.${fa2}.fee_cents == 0 (sequence 2)"
            - "captured seq3 == 3"
            - "FalseAlarmCase.${fa3}.fee_cents == 15000 (third alarm crosses the >=3 threshold)"
      - name: empty_plan_publish_zero_events_rejected
        grounds:
          - state_machines.InspectionPlan.DRAFT_to_SCHEDULED
          - errors[ERR_EMPTY_PLAN]
          - calculations.plan_requirement_count
        distinguishing_aspect: |
          Empty-set boundary on the total_events_required COUNT metric through
          the publish endpoint: a plan whose property has zero IN_SERVICE
          devices computes total_events_required == 0 and publish is rejected
          with ERR_EMPTY_PLAN — 0 is the exact floor, no off-by-one.
        test_recipe:
          setup:
            - "Property with one system that has NO devices (all removed), plan created in DRAFT"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Empty Plan Co", state_license_no: "C-1212" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "4 Null St", occupancy_class: "EDUCATIONAL", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "FIRE_ALARM", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id, total_req: $.data.total_events_required }
          trigger:
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured total_req == 0"
            - "captured err == ERR_EMPTY_PLAN"
            - "InspectionPlan.${plan_id}.plan_posture == DRAFT (unchanged)"

