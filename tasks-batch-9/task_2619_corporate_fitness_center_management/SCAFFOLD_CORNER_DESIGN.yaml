  # ===========================================================================
  # 5. From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: readiness_summary_reports_site_wide_counts
        claim_type: computed_read
        grounds:
          - endpoints[GET /operations/readiness-summary]
          - calculations.aed_readiness_status
          - state_machines.FacilityAsset.IN_SERVICE_to_OUT_OF_SERVICE
        distinguishing_aspect: |
          The summary is derived on read, never stored: with one READY AED and no
          problems it reports aed_ready_count 1 and every other counter 0, and
          after the AED is taken out of service by a service event the very next
          read flips to aed_ready_count 0, aed_not_ready_count 1 and
          assets_out_of_service 1 with rooms_restricted still 0 (a manual service
          event does not restrict the room; only an incident review does).
        test_recipe:
          setup:
            - "ACTIVE-PROGRAM chain: one OPEN room, one READY AED, two staff members with VERIFIED credentials, one ACTIVE offering, no sessions."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
