              payload: { case_id: "${caseA_id}", relocation_unit_id: "${u_id}", start_date: "2026-06-01", end_date: "2026-06-10", occupant_count: 2 }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { plcA_id: $.data.id }
            - call: "POST /api/v1/cases/${caseB_id}/withdraw"
              payload: {}
              as: CaseManager
              as_user_id: "cm-1"
          trigger:
            - call: "POST /api/v1/relocation-placements"
              payload: { case_id: "${caseB_id}", relocation_unit_id: "${u_id}", start_date: "2026-06-05", end_date: "2026-06-08", occupant_count: 2 }
              as: CaseManager
              as_user_id: "cm-1"
          assert:
            - "response error_id == ERR_CASE_NOT_ACTIVE (referential priority 12 beats temporal priority 14), NOT ERR_RELOCATION_OVERLAP"
            - "HTTP status == 409"

  # =========================================================================
  # RULE 6 — boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bll_case_open_threshold_boundary
        grounds:
          - validations[priority=9]
          - errors[ERR_BLL_BELOW_THRESHOLD]
          - calculations.case_priority_classification
        distinguishing_aspect: |
          Numeric threshold on POST /cases: a qualifying test of 3.4 ug/dL is
          rejected with ERR_BLL_BELOW_THRESHOLD, while exactly 3.5 (the inclusive
          lower bound BLL_CASE_THRESHOLD_UG_DL) opens the case at priority CLASS_III.
        test_recipe:
          setup:
            - "One dwelling; child B with a 3.4 capillary screen; child C with a 3.5 capillary screen."
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Below Kid", date_of_birth: "2022-03-01", guardian_name: "G B", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { chB_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${chB_id}", bll_ug_dl: 3.4, specimen_type: "CAPILLARY", test_kind: "SCREENING", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { tB_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "At Kid", date_of_birth: "2022-04-01", guardian_name: "G C", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { chC_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${chC_id}", bll_ug_dl: 3.5, specimen_type: "CAPILLARY", test_kind: "SCREENING", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { tC_id: $.data.id }
          trigger:
            - call: "POST /api/v1/cases"
              payload: { child_id: "${chB_id}", dwelling_id: "${d_id}", qualifying_test_id: "${tB_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
            - call: "POST /api/v1/cases"
              payload: { child_id: "${chC_id}", dwelling_id: "${d_id}", qualifying_test_id: "${tC_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { caseC_id: $.data.id }
          assert:
            - "The 3.4 case-open call fails with error_id == ERR_BLL_BELOW_THRESHOLD and HTTP 422"
            - "The 3.5 case-open call returns 201 with Case.${caseC_id}.reference_bll_ug_dl == 3.5 AND priority_class == CLASS_III"

      - name: empty_hazard_set_completes_without_order
        grounds:
          - state_machines.EnvironmentalInvestigation.SCHEDULED_to_COMPLETED
          - entities.EnvironmentalInvestigation.fields.hazard_finding_count
          - entities.Case.fields.case_status
        distinguishing_aspect: |
          Empty-collection edge on POST /investigations/{id}/complete: completing
          an investigation with hazard_finding_count == 0 issues NO order and
          leaves case_status == INVESTIGATION (contrast: >=1 finding issues an
          order and moves the case to ENFORCEMENT). Different metric/endpoint than
          the BLL threshold.
        test_recipe:
          setup:
            - "An OPEN case with a SCHEDULED investigation and zero findings recorded."
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Ida Child", date_of_birth: "2022-03-01", guardian_name: "G Ida", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 22.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Ivy Inspector", certification_id_number: "RA-001" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp_id: $.data.id }
            - call: "POST /api/v1/investigations"
              payload: { case_id: "${case_id}", dwelling_id: "${d_id}", inspector_id: "${insp_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T12:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /api/v1/investigations/${inv_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /api/v1/hazard-control-orders"
              payload: { case_id: "${case_id}" }
              as: CaseManager
              as_user_id: "cm-1"
          assert:
            - "EnvironmentalInvestigation.${inv_id}.status == COMPLETED AND hazard_finding_count == 0"
            - "GET /api/v1/hazard-control-orders?case_id=${case_id} returns total_count == 0 (no order issued)"
            - "Case.${case_id}.case_status == INVESTIGATION (not ENFORCEMENT)"

  # =========================================================================
  # RULE 7 — cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: investigation_create_requires_case_open_or_investigation
        grounds:
          - state_machines.Case.OPEN_to_INVESTIGATION
          - entities.Case.fields.case_status
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair EnvironmentalInvestigation -> Case: scheduling an investigation is
          gated by the CASE's state. Once the case is in ENFORCEMENT (its first
          investigation completed with a hazard), a new POST /investigations is
          rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
