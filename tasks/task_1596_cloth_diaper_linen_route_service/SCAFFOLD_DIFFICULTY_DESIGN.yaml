          assert:
            - "complete while Route LOCKED -> $.data.error_id == ERR_INVALID_STATE"
            - "same payload after START -> RouteStop.${stop_id}.status == COMPLETED"

      - name: subscription_activate_requires_kit_issued
        grounds:
          - state_machines.Subscription.service_status_PENDING_START_to_ACTIVE
          - state_machines.StarterKit.RESERVED_to_ISSUED
        distinguishing_aspect: |
          Entity pair Subscription -> StarterKit: subscription ACTIVATE while its kit is
          RESERVED fails with ERR_INVALID_STATE; after the kit's ISSUE transition the same
          event succeeds — the gate is the other entity's state, not any subscription field.
        test_recipe:
          setup: ["Subscription PENDING_START; customer already ACTIVE (kit still RESERVED)"]
