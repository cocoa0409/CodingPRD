              as: ProgramAdmin
              captures: { ba_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bh_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { ch_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bh_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { ch_sep_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bh_id}", site_number: "G-007", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g7_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${ba_id}", site_number: "F-007", site_type: "OWNED_FUEL_CENTER" }
              as: ProgramAdmin
              captures: { f_away_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${bh_id}", alt_id: "5550000008", card_number: "4000000000000008", full_name: "Hal Crossbanner" }
              as: ProgramAdmin
              captures: { m8_id: $.data.id }
            - call: "POST /households"
              payload: { banner_id: "${ba_id}", household_code: "HH-AWAY-1" }
              as: LoyaltyAnalyst
              captures: { h5_id: $.data.id }
            - call: "POST /household-links"
              payload: { household_id: "${h5_id}", member_id: "${m8_id}", link_role: "SECONDARY" }
              as: LoyaltyAnalyst
              captures: { l5_id: $.data.id }
            - call: "POST /household-links/${l5_id}/activate"
              payload: {}
              as: LoyaltyAnalyst
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m8_id}", site_id: "${g7_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g7_id}"
              captures: { t8_id: $.data.id }
            - call: "POST /purchase-transactions/${t8_id}/post"
              payload: {}
