          setup:
            - "Two 200-unit lots (declared retail 2000000 each) sold FIXED_PRICE at 1000000 to the same QUALIFIED buyer: order A on 2026-08-05T01:00:00Z, order B on 2026-08-06T01:00:00Z."
            - "Neither order has been paid or scheduled, so both sit in AWAITING_APPOINTMENT with total_due_cents 1148500."
            - "The clock is advanced to 2026-08-15T01:00:01Z, one second past order A's pickup deadline."
