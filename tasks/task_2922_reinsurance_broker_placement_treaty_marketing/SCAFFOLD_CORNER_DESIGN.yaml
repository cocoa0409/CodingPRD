          assert:
            - "${placed_before} == 100.0000 and Layer.${layer_id}.status was FULLY_PLACED with the program at FIRM_ORDER"
            - "${sl_c_status} == PROVISIONAL and Layer.${layer_id}.written_line_total_pct == 130.0000 with status OVERSUBSCRIBED"
            - "${rel_status} == RELEASED with ${rel_reason} == WITHDRAWN_BY_BROKER and Quote.${q_c}.status == LAPSED"
            - "Layer.${layer_id}.written_line_total_pct == 100.0000 exactly and status == FULLY_PLACED again; Program.${prog_id}.placement_status is still FIRM_ORDER"
            - "${e_again} == ERR_SIGNING_LINE_STATE_INVALID with HTTP 409 and release_reason is still WITHDRAWN_BY_BROKER"
            - "${bound} == BOUND with SigningLine.${sl_a}.status == BOUND and signed_line_pct == 60.0000, SigningLine.${sl_b}.status == BOUND and signed_line_pct == 40.0000"
            - "${e_bound_line} == ERR_SIGNING_LINE_STATE_INVALID with HTTP 409 — the line-state rule at priority 27 answers before the program-state rule at 32, which would also have rejected a BOUND program"
            - "SigningLine.${sl_c}.signed_line_pct == null — a released line is never signed"
      - name: excluded_parallel_dimensions_move_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: program_documentation_dimension_advances_independently_of_placement_dimension
          rationale: |
            The parallel shape claim — the two Program state dimensions advancing without disturbing
            each other, and their combined state being correct — is exactly what §1.8 rule 3 asserts
            over the full SLIP / WORDING_DRAFT / CERTAINTY_BREACHED / WORDING_AGREED walk against a
            frozen placement_status. Repeating it here would duplicate the assertions.

      - name: excluded_compensating_undo_reverses_all_side_effects
        claim_type: Compensation
        excluded_because:
          difficulty_instance: reversing_a_settled_remittance_restores_the_fiduciary_balance_exactly
          rationale: |
            The Compensation pattern claim — undo transition reverses every original side effect with
            no drift — is asserted by §1.8 rule 9, which reverses a settled remittance, checks the
            REMITTANCE_REVERSAL row, and proves fiduciary_holding_minor returns to its exact
            pre-settlement integer.

      - name: excluded_negotiation_loop_termination
        claim_type: cyclic
        excluded_because:
          difficulty_instance: quote_counter_requote_cycle_rejects_the_fourth_broker_counter
          rationale: |
            The cyclic shape claim — the entity loops back and the loop-count termination condition is
            respected — is asserted by §1.8 rule 2, which drives QUOTED → COUNTERED → REQUOTED three
            times and shows the fourth counter refused at MAX_NEGOTIATION_ROUNDS with the round
            counter frozen at 3.

      - name: excluded_fork_and_join_on_the_advocacy_machine
        claim_type: branching
        excluded_because:
          difficulty_instance: advocacy_forks_into_arbitration_freezing_collections_until_the_dispute_join
          rationale: |
            The branching shape claim — each fork path works and the join requires all branches
            complete — is asserted by §1.8 rule 2, which forks DISPUTED into ADVOCACY_ARBITRATION and
            shows the join to RESOLVED only once no CessionDispute remains RAISED.

      - name: excluded_children_bubbling_the_parent_forward
        claim_type: Bubble up
        excluded_because:
          difficulty_instance: firm_order_cascades_line_to_layer_to_program_to_rival_quote_lapse
          rationale: |
            The Bubble up pattern claim — when the children reach the required state the parent
            auto-transitions — is asserted by §1.8 rule 4, where the firm order drives SigningLine →
            Layer FULLY_PLACED → Program FIRM_ORDER in a single request and then lapses the rival
            quotes from the parent transition.

  # ===========================================================================
  # SECTION 3 — CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:
      - name: completeness_score_combines_four_weighted_components_with_clamp_and_zero_record_guard
        claim_type: Correct Result
        grounds:
          - calculations.submission_completeness_score
          - entities.ExposureSubmission.fields.completeness_score
        distinguishing_aspect: |
          One DRAFT program carries three packages that exercise the three structural quirks of the
          weighted score at once: the ordinary case 40*0.98 + 25 + 25*0.90 + 10 = 96.70, the
          zero-record guard where data_quality_ratio is defined as 0 instead of dividing by zero
          (57.50, not a 500), and the history clamp where 7 supplied years scores the same 25 as 5
          because min(years, HISTORY_TARGET_YEARS) caps the factor at 1 (100.00 exactly).
        test_recipe:
          setup:
            - "The clock at 2026-01-01 and one cedent with a DRAFT program; no layer is needed because the score depends only on the package's own fields."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "EDP-ORDINARY", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { s_ord: $.data.completeness_score }
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "EDP-ZERO-RECORDS", exposure_records_count: 0, data_quality_flags_count: 0, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { s_zero: $.data.completeness_score }
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "EDP-CLAMPED", exposure_records_count: 1000, data_quality_flags_count: 0, historical_years_supplied: 7, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 100.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { s_clamp: $.data.completeness_score }
          assert:
            - "${s_ord} == 96.70  # 39.20 + 25 + 22.50 + 10, two decimal places"
            - "${s_zero} == 57.50  # data_quality_ratio forced to 0, no division by zero and no error"
            - "${s_clamp} == 100.00  # 7 years clamps to the 5-year target, so the score does not exceed 100"
            - "all three rows are status DRAFT and Program.${prog_id}.placement_status == DRAFT — scoring is not a transition"
            - "GET /programs/${prog_id}/exposure-submissions returns 3 rows"

      - name: revising_a_rejected_package_recomputes_only_its_own_score
        claim_type: Input Set Filtering
        grounds:
          - calculations.submission_completeness_score.input_set
          - state_machines.ExposureSubmission.transitions[REJECTED->DRAFT]
          - endpoints.POST /exposure-submissions/{submission_id}/revise
        distinguishing_aspect: |
          The score's input set is the package's own fields — sibling packages of the same program
          never contribute. Package A is scored 96.70, rejected, then revised so that its flag count
          rises to 500 and its actuarial report is dropped: A alone falls to 67.50 while sibling B
          stays at 100.00, and the revise only overwrites the two fields supplied, leaving
          historical_years_supplied and loss_history_completeness_pct at their original values.
        test_recipe:
          setup:
            - "A DRAFT program with package A (1000 records, 20 flags, 5 years, 90.0000, report attached) and package B (1000 records, 0 flags, 7 years, 100.0000, report attached)."
            - "A is submitted for review and then rejected by the actuary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "EDP-A", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_a: $.data.id, a_score0: $.data.completeness_score }
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "EDP-B", exposure_records_count: 1000, data_quality_flags_count: 0, historical_years_supplied: 7, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 100.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_b: $.data.id, b_score0: $.data.completeness_score }
            - call: "POST /exposure-submissions/${sub_a}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_a}/signoff"
              payload: { decision: "REJECTED", review_note: "Data quality scrub incomplete" }
              as: BrokerActuary
              captures: { a_rejected: $.data.status }
          trigger:
            - call: "POST /exposure-submissions/${sub_a}/revise"
              payload: { data_quality_flags_count: 500, actuarial_report_attached: false }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { a_score1: $.data.completeness_score, a_state1: $.data.status, a_years: $.data.historical_years_supplied, a_loss: $.data.loss_history_completeness_pct }
            - call: "GET /exposure-submissions/${sub_b}"
              payload: {}
              as: BrokerActuary
              captures: { b_score1: $.data.completeness_score, b_state1: $.data.status }
          assert:
            - "${a_score0} == 96.70 and ${b_score0} == 100.00"
            - "${a_rejected} == REJECTED and Program.${prog_id}.placement_status == DRAFT — a rejection never advances the program"
            - "${a_score1} == 67.50  # 40*0.50 + 25 + 22.50 + 0"
            - "${a_state1} == DRAFT, ${a_years} == 5 and ${a_loss} == 90.0000 — untouched fields survive the revise"
            - "${b_score1} == 100.00 and ${b_state1} == DRAFT — the sibling is not rescored"
            - "ExposureSubmission.${sub_a}.review_note is still Data quality scrub incomplete"

      - name: certainty_deadline_adds_the_thirty_day_constant_to_inception_across_month_lengths
        claim_type: Constants Applied
        grounds:
          - calculations.contract_certainty_window
          - entities.Program.fields.contract_certainty_deadline
          - validations[priority=48]
          - errors.ERR_CERTAINTY_NOT_BREACHED
        distinguishing_aspect: |
          CONTRACT_CERTAINTY_DAYS is 30 calendar days added to inception_date — not one month, and not
          measured from bind. Three programs on three cedents show the constant surviving a 31-day
          January (2026-01-01 -> 2026-01-31), a 28-day February (2026-02-01 -> 2026-03-03) and a
          mid-month July start (2026-07-15 -> 2026-08-14). The breach comparison is strict, so a
          checkpoint at exactly the deadline instant is 409 ERR_CERTAINTY_NOT_BREACHED.
        test_recipe:
          setup:
            - "Three cedents, one program each so that no treaty periods overlap, all created at clock 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_1: $.data.id }
            - call: "POST /cedents"
              payload: { name: "Southgate Casualty", domicile_code: "GBLON", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_2: $.data.id }
            - call: "POST /cedents"
              payload: { name: "Eastwater Marine", domicile_code: "SGSIN", financial_rating: "BBB" }
              as: PlatformAdmin
              captures: { ced_3: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { cedent_id: "${ced_1}", program_name: "January Start", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000 }
              as: BrokerPlacementLead
              captures: { p1: $.data.id, dl1: $.data.contract_certainty_deadline }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_2}", program_name: "February Start", line_of_business: "CASUALTY", underwriting_year: 2026, inception_date: "2026-02-01T00:00:00.000Z", expiry_date: "2027-02-01T00:00:00.000Z", estimated_premium_income_minor: 1000000000 }
              as: BrokerPlacementLead
              captures: { p2: $.data.id, dl2: $.data.contract_certainty_deadline }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_3}", program_name: "Mid July Start", line_of_business: "MARINE", underwriting_year: 2026, inception_date: "2026-07-15T00:00:00.000Z", expiry_date: "2027-07-15T00:00:00.000Z", estimated_premium_income_minor: 500000000 }
              as: BrokerPlacementLead
              captures: { p3: $.data.id, dl3: $.data.contract_certainty_deadline }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-31T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs/${p1}/documentation-checkpoint"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compl-1"
              captures: { e_equal: $.data.error_id }
          assert:
            - "${dl1} == 2026-01-31T00:00:00.000Z"
            - "${dl2} == 2026-03-03T00:00:00.000Z  # 30 days across a 28-day February, not 2026-03-01"
            - "${dl3} == 2026-08-14T00:00:00.000Z"
            - "${e_equal} == ERR_CERTAINTY_NOT_BREACHED with HTTP 409 — current_utc equal to the deadline is not yet a breach"
            - "Program.${p1}.documentation_status == NOT_STARTED and placement_status == DRAFT after the refused checkpoint"
            - "Program.${p2}.contract_certainty_deadline and Program.${p3}.contract_certainty_deadline are unaffected by the clock move"

      - name: renewal_analytics_feeds_each_rounded_stage_forward_and_counts_released_lines
        claim_type: Precision
        grounds:
          - calculations.renewal_analytics
          - entities.RenewalReport.fields.market_condition_index
          - entities.RenewalReport.fields.placement_efficiency_pct
        distinguishing_aspect: |
          Every stage consumes the previous stage's ROUNDED value, and the released line stays in the
          efficiency denominator. Prior 800,000,000 limit at 69,825,000 gross gives rate_on_line
          8.7281 (4 dp), current 1,000,000,000 at 97,125,000 gives 9.7125, so rate_change 11.28,
          exposure_change 25.00, risk_adjusted 11.28 - 12.50 = -1.22, efficiency 100.0000/120.0000 =
          83.33 (Bravo's released 20.0000 line still counts as offered), and the index is
          0.6*(-1.22) + 0.4*16.67 = 5.94. Computing the same figures from unrounded intermediates
