          assert:
            - "409 with error_id == ERR_WORKER_INVALID_STATE (W_B is PETITIONED, not VISA_ISSUED)"
            - "Control: the same call for W_A (VISA_ISSUED) would succeed — the gate is the worker's state, not the order's"

      - name: petition_file_requires_order_petitioning
        grounds:
          - state_machines.VisaPetition.DRAFT_to_FILED
          - errors[ERR_JOB_ORDER_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair VisaPetition -> JobOrder (different pair than
          WorkerAssignment -> Worker): filing is gated on the PARENT order's
          state (PETITIONING); while the order is still RECRUITING the file
          call fails ERR_JOB_ORDER_INVALID_STATE.
