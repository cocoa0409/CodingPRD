scenario: |
  Mortgage Origination: pre-qualification, income and asset verification, appraisal, Title
  search, UDAAP compliance, Loan Estimate/Closing Disclosure, TRID timelines, rate lock and
  extension.

domain_name: mortgage-origination
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Applicant legal name; required at creation."
      - name: email
        type: string
        source: input
        description: "Unique applicant email; uniqueness enforced across non-archived Applicants."
      - name: ssn_last4
        type: string
        source: input
        description: "Last four digits of SSN; exactly four digits, used for soft-pull keying."
      - name: annual_income_cents
        type: integer
        source: input
        description: "Stated annual gross income in cents; non-negative integer."
      - name: monthly_debt_cents
        type: integer
        source: input
        description: "Stated monthly recurring debt obligations in cents; non-negative integer."
      - name: credit_score
        type: integer
        source: input
        description: "Soft-pull credit score, 300–850 inclusive."
      - name: state_code
        type: string
        source: input
        description: "USPS two-letter state code of applicant residence."

  - name: LoanApplication
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the borrower of this loan application."
      - name: property_address
        type: string
        source: input
        description: "Free-text property address being financed."
      - name: property_state_code
        type: string
        source: input
        description: "USPS two-letter state code of subject property."
      - name: loan_purpose
        type: enum
        source: input
        description: "Purpose of loan."
        constraints: "Enum: PURCHASE | REFINANCE."
      - name: requested_loan_amount_cents
        type: integer
        source: input
        description: "Requested principal amount in cents; positive integer."
      - name: property_value_cents
        type: integer
        source: input
        description: "Stated property value (purchase price or refi appraised estimate) in cents; positive integer."
      - name: loan_term_months
        type: integer
        source: input
        description: "Loan term in months; one of 180 or 360."
      - name: status
        type: enum
        source: system
        description: "Application lifecycle status; managed by §1.2 LoanApplication state machine."
        default: DRAFT
        constraints: "Enum: DRAFT | PREQUALIFIED | UNDER_REVIEW | APPROVED | CLEAR_TO_CLOSE | CLOSED | DENIED | WITHDRAWN."
      - name: prequal_decision
        type: enum
        source: computed
        description: "Output of pre-qualification; null until PREQUALIFY runs."
        default: null
        constraints: "Enum: APPROVED | DENIED | null."
      - name: front_end_dti
        type: number
        source: computed
        description: "Front-end DTI ratio (housing payment / gross monthly income); see §1.3 dti_ratio.front_end."
      - name: back_end_dti
        type: number
        source: computed
        description: "Back-end DTI ratio ((housing + other debt) / gross monthly income); see §1.3 dti_ratio.back_end."
      - name: ltv_ratio
        type: number
        source: computed
        description: "Loan-to-value ratio; see §1.3 ltv_ratio."
      - name: provisional_apr
        type: number
        source: computed
        description: "APR computed at Loan Estimate issuance; see §1.3 apr_calculation.provisional."
      - name: final_apr
        type: number
        source: computed
        description: "APR computed at Closing Disclosure issuance; see §1.3 apr_calculation.final."
      - name: clear_to_close_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp the application transitioned to CLEAR_TO_CLOSE; null until reached."
        default: null
      - name: earliest_consummation_at
        type: datetime
        source: computed
        description: "Earliest UTC timestamp closing/funding may occur; derived from TRID timeline rules — see §1.3 trid_timeline_calc."

  - name: IncomeVerification
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the application this verification belongs to."
      - name: document_type
        type: enum
        source: input
        description: "Type of verification document."
        constraints: "Enum: W2 | PAYSTUB | TAX_RETURN | BANK_DEPOSITS."
      - name: verified_annual_income_cents
        type: integer
        source: input
        description: "Income amount the underwriter has verified from the document, in cents; non-negative integer."
      - name: status
        type: enum
        source: system
        description: "Verification lifecycle status; managed by IncomeVerification state machine."
        default: PENDING
        constraints: "Enum: PENDING | ACCEPTED | REJECTED."
      - name: rejection_reason
        type: string
        source: input
        description: "Reason text required on transition to REJECTED; null otherwise."
        default: null

  - name: AssetVerification
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the application this verification belongs to."
      - name: asset_type
        type: enum
        source: input
        description: "Asset class being verified."
        constraints: "Enum: CHECKING | SAVINGS | BROKERAGE | RETIREMENT."
      - name: verified_balance_cents
        type: integer
        source: input
        description: "Account balance the underwriter has verified, in cents; non-negative integer."
      - name: status
        type: enum
        source: system
        description: "Verification lifecycle status; managed by AssetVerification state machine."
        default: PENDING
        constraints: "Enum: PENDING | ACCEPTED | REJECTED."
      - name: rejection_reason
        type: string
        source: input
        description: "Reason text required on transition to REJECTED; null otherwise."
        default: null

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the application this appraisal supports."
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Appraiser's opinion of value in cents; positive integer; set on COMPLETE transition."
        default: null
      - name: status
        type: enum
        source: system
        description: "Appraisal lifecycle status; managed by Appraisal state machine."
        default: ORDERED
        constraints: "Enum: ORDERED | COMPLETED | RECONSIDERED."
      - name: reconsideration_note
        type: string
        source: input
        description: "Free text reason for an ROV (Reconsideration of Value) request; required on RECONSIDER transition."
        default: null

  - name: TitleSearch
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the application this title search supports."
      - name: status
        type: enum
        source: system
        description: "Title search lifecycle status; managed by TitleSearch state machine."
        default: ORDERED
        constraints: "Enum: ORDERED | CLEAR | EXCEPTIONS_FOUND | CURED."
      - name: exception_summary
        type: string
        source: input
        description: "Description of title exceptions when status flips to EXCEPTIONS_FOUND; null otherwise."
        default: null

  - name: RateLock
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the application the lock is bound to."
      - name: locked_rate_bps
        type: integer
        source: input
        description: "Locked interest rate in basis points (e.g., 6.875% = 687); positive integer."
      - name: lock_term_days
        type: integer
        source: input
        description: "Initial lock duration in days; one of 30, 45, 60."
      - name: locked_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp the lock was created."
      - name: expires_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp the lock expires; recomputed on EXTEND per §1.3 rate_lock_extension_calc."
      - name: extension_count
        type: integer
        source: system
        description: "Number of extensions applied; starts at 0, increments by 1 per accepted EXTEND. Hard cap is 2."
        default: 0
      - name: extension_fee_cents
        type: integer
        source: computed
        description: "Total cumulative extension fees in cents; recomputed per §1.3 rate_lock_extension_calc."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Rate lock lifecycle status; managed by RateLock state machine."
        default: ACTIVE
        constraints: "Enum: ACTIVE | EXPIRED | SUPERSEDED | CANCELLED."

  - name: Disclosure
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the application this disclosure belongs to."
      - name: disclosure_type
        type: enum
        source: input
        description: "Disclosure document type."
        constraints: "Enum: LOAN_ESTIMATE | CLOSING_DISCLOSURE."
      - name: status
        type: enum
        source: system
        description: "Disclosure lifecycle status; managed by Disclosure state machine."
        default: DRAFT
        constraints: "Enum: DRAFT | DELIVERED | ACKNOWLEDGED | SUPERSEDED."
      - name: delivered_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp when disclosure was DELIVERED; null while DRAFT."
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp when applicant acknowledged receipt; null until ACKNOWLEDGE transition."
        default: null
      - name: apr_at_issuance
        type: number
        source: computed
        description: "APR snapshot embedded in this disclosure at DELIVER time. For LOAN_ESTIMATE this matches LoanApplication.provisional_apr; for CLOSING_DISCLOSURE this matches LoanApplication.final_apr."
      - name: change_requires_redisclose
        type: boolean
        source: computed
        description: "True only for CLOSING_DISCLOSURE rows whose APR changed by more than 12.5 bps since the immediately prior DELIVERED CLOSING_DISCLOSURE for the same application; see §1.3 cd_redisclose_check."
        default: false
      - name: earliest_consummation_at
        type: datetime
        source: computed
        description: "Snapshot of LoanApplication.earliest_consummation_at at DELIVER time; recomputed on REDISCLOSE."

  - name: UDAAPCheck
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the application this UDAAP review references."
      - name: review_outcome
        type: enum
        source: input
        description: "UDAAP compliance outcome decided by the ComplianceOfficer."
        constraints: "Enum: CLEARED | FLAGGED."
      - name: flagged_reasons
        type: array
        source: input
        description: "List of one or more reason codes when review_outcome == FLAGGED; required and non-empty when FLAGGED, MUST be omitted/empty when CLEARED."
        constraints: "Each element is one of: HIDDEN_FEES | MISLEADING_RATE | STEERING | PRESSURE_TACTICS."
      - name: reviewer_user_id
        type: string
        source: system
        description: "Opaque ComplianceOfficer user id taken from X-User-ID at creation."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LoanApplication
    initial_state: DRAFT
    terminal_states: [CLOSED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PREQUALIFIED
        trigger: "POST /loan-applications/{id}/prequalify"
        actor: LoanOfficer
        preconditions:
          - "LoanApplication.status == DRAFT"
          - "Applicant.credit_score >= 580"
          - "LoanApplication.requested_loan_amount_cents <= 4_000_000_00 (conforming cap)"
        side_effects:
          - "compute LoanApplication.front_end_dti via §1.3 dti_ratio.front_end (uses Applicant.annual_income_cents)"
          - "compute LoanApplication.back_end_dti via §1.3 dti_ratio.back_end"
          - "compute LoanApplication.ltv_ratio via §1.3 ltv_ratio"
          - "set LoanApplication.prequal_decision = APPROVED iff back_end_dti <= 0.43 AND ltv_ratio <= 0.95, else DENIED"
          - "if prequal_decision == DENIED, transition LoanApplication to DENIED instead of PREQUALIFIED (auto-branch)"
          - "increment LoanApplication.version by 1"

      - from: DRAFT
        to: DENIED
        trigger: "auto-branch from prequalify when prequal_decision == DENIED"
        actor: system
        preconditions:
          - "LoanApplication.status == DRAFT"
          - "back_end_dti > 0.43 OR ltv_ratio > 0.95"
        side_effects:
          - "increment LoanApplication.version by 1"

      - from: PREQUALIFIED
        to: UNDER_REVIEW
        trigger: "POST /loan-applications/{id}/submit-for-review"
        actor: LoanOfficer
        preconditions:
          - "LoanApplication.status == PREQUALIFIED"
          - "LoanApplication has at least one DELIVERED Disclosure of type LOAN_ESTIMATE"
          - "LoanApplication has at least one ACTIVE RateLock"
        side_effects:
          - "increment LoanApplication.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /loan-applications/{id}/approve"
        actor: Underwriter
        preconditions:
          - "LoanApplication.status == UNDER_REVIEW"
          - "LoanApplication has at least one IncomeVerification with status == ACCEPTED"
          - "LoanApplication has at least one AssetVerification with status == ACCEPTED"
          - "LoanApplication has exactly one Appraisal with status IN {COMPLETED, RECONSIDERED}"
          - "LoanApplication has at least one TitleSearch with status IN {CLEAR, CURED}"
          - "LoanApplication has at least one UDAAPCheck with review_outcome == CLEARED whose created_at is the most recent UDAAPCheck for this application (ordered by created_at ASC, last entry wins)"
        side_effects:
          - "increment LoanApplication.version by 1"

      - from: APPROVED
        to: CLEAR_TO_CLOSE
        trigger: "POST /loan-applications/{id}/clear-to-close"
        actor: Underwriter
        preconditions:
          - "LoanApplication.status == APPROVED"
          - "LoanApplication has at least one ACKNOWLEDGED Disclosure of type CLOSING_DISCLOSURE"
          - "LoanApplication has an ACTIVE RateLock whose expires_at >= the system clock"
        side_effects:
          - "set LoanApplication.clear_to_close_at = current UTC clock"
          - "set LoanApplication.earliest_consummation_at via §1.3 trid_timeline_calc"
          - "increment LoanApplication.version by 1"

      - from: CLEAR_TO_CLOSE
        to: CLOSED
        trigger: "POST /loan-applications/{id}/close"
        actor: Closer
        preconditions:
          - "LoanApplication.status == CLEAR_TO_CLOSE"
          - "system clock >= LoanApplication.earliest_consummation_at (TRID waiting period elapsed)"
          - "LoanApplication has an ACTIVE RateLock whose expires_at >= system clock"
        side_effects:
          - "transition the ACTIVE RateLock to SUPERSEDED (terminal use)"
          - "increment LoanApplication.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /loan-applications/{id}/deny"
        actor: Underwriter
        preconditions:
          - "LoanApplication.status == UNDER_REVIEW"
        side_effects:
          - "cancel any ACTIVE RateLock on the application (transitions RateLock to CANCELLED)"
          - "increment LoanApplication.version by 1"

      - from: PREQUALIFIED
        to: DENIED
        trigger: "auto-cascade from Appraisal COMPLETE/RECONSIDER when recomputed ltv_ratio > 0.95"
        actor: system
        preconditions:
          - "LoanApplication.status IN {PREQUALIFIED, UNDER_REVIEW}"
          - "an Appraisal COMPLETE or RECONSIDER side-effect on this application just produced ltv_ratio > 0.95"
        side_effects:
          - "cancel any ACTIVE RateLock on the application (transitions RateLock to CANCELLED) — this is the second cascade hop from the original Appraisal mutation"
          - "increment LoanApplication.version by 1"
        note: "Triggered from PREQUALIFIED or UNDER_REVIEW symmetrically — the from-state is whichever non-terminal status the application is in at the moment the cascade fires."

      - from: PREQUALIFIED
        to: WITHDRAWN
        trigger: "POST /loan-applications/{id}/withdraw"
        actor: LoanOfficer
        preconditions:
          - "LoanApplication.status IN {DRAFT, PREQUALIFIED, UNDER_REVIEW}"
        side_effects:
          - "cancel any ACTIVE RateLock (transitions RateLock to CANCELLED)"
          - "increment LoanApplication.version by 1"
        note: "Same trigger also accepted from DRAFT and UNDER_REVIEW; the from-state is whatever the current status is among the three listed in preconditions."

  - entity: IncomeVerification
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /income-verifications/{id}/accept"
        actor: Underwriter
        preconditions:
          - "IncomeVerification.status == PENDING"
          - "the parent LoanApplication.status IN {PREQUALIFIED, UNDER_REVIEW}"
        side_effects:
          - "increment IncomeVerification.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /income-verifications/{id}/reject"
        actor: Underwriter
        preconditions:
          - "IncomeVerification.status == PENDING"
          - "the parent LoanApplication.status IN {PREQUALIFIED, UNDER_REVIEW}"
          - "rejection_reason is provided in the request body (non-empty)"
        side_effects:
          - "set IncomeVerification.rejection_reason = request.rejection_reason"
          - "increment IncomeVerification.version by 1"

  - entity: AssetVerification
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /asset-verifications/{id}/accept"
        actor: Underwriter
        preconditions:
          - "AssetVerification.status == PENDING"
          - "the parent LoanApplication.status IN {PREQUALIFIED, UNDER_REVIEW}"
        side_effects:
          - "increment AssetVerification.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /asset-verifications/{id}/reject"
        actor: Underwriter
        preconditions:
          - "AssetVerification.status == PENDING"
          - "the parent LoanApplication.status IN {PREQUALIFIED, UNDER_REVIEW}"
          - "rejection_reason is provided in the request body (non-empty)"
        side_effects:
          - "set AssetVerification.rejection_reason = request.rejection_reason"
          - "increment AssetVerification.version by 1"

  - entity: Appraisal
    initial_state: ORDERED
    terminal_states: []
    transitions:
      - from: ORDERED
        to: COMPLETED
        trigger: "POST /appraisals/{id}/complete"
        actor: Appraiser
        preconditions:
          - "Appraisal.status == ORDERED"
          - "request body provides appraised_value_cents > 0"
          - "the parent LoanApplication.status IN {PREQUALIFIED, UNDER_REVIEW}"
        side_effects:
          - "set Appraisal.appraised_value_cents = request.appraised_value_cents"
          - "recompute LoanApplication.ltv_ratio using min(property_value_cents, appraised_value_cents) per §1.3 ltv_ratio (variant_final)"
          - "if the recomputed ltv_ratio > 0.95, auto-transition LoanApplication to DENIED (cascade hop); if LoanApp transitions to DENIED, also auto-CANCEL any ACTIVE RateLock on the application (further cascade hop) — see LoanApplication and RateLock state machines below"
          - "increment Appraisal.version by 1; increment parent LoanApplication.version by 1 (plus an additional +1 if the auto-DENY hop fires)"
      - from: COMPLETED
        to: RECONSIDERED
        trigger: "POST /appraisals/{id}/reconsider"
        actor: LoanOfficer
        preconditions:
          - "Appraisal.status == COMPLETED"
          - "request body provides reconsideration_note (non-empty) and new_appraised_value_cents > 0"
          - "the parent LoanApplication.status IN {PREQUALIFIED, UNDER_REVIEW}"
        side_effects:
          - "set Appraisal.appraised_value_cents = request.new_appraised_value_cents"
          - "set Appraisal.reconsideration_note = request.reconsideration_note"
          - "recompute LoanApplication.ltv_ratio using min(property_value_cents, appraised_value_cents) per §1.3 ltv_ratio (variant_final)"
          - "increment Appraisal.version by 1; increment parent LoanApplication.version by 1"
      - from: RECONSIDERED
        to: COMPLETED
        trigger: "POST /appraisals/{id}/confirm-reconsideration"
        actor: Appraiser
        preconditions:
          - "Appraisal.status == RECONSIDERED"
        side_effects:
          - "increment Appraisal.version by 1"
        note: "Cyclic revision loop — Appraisal may bounce COMPLETED → RECONSIDERED → COMPLETED any number of times while parent LoanApplication is non-terminal."

  - entity: TitleSearch
    initial_state: ORDERED
    terminal_states: []
    transitions:
      - from: ORDERED
        to: CLEAR
        trigger: "POST /title-searches/{id}/mark-clear"
        actor: TitleAgent
        preconditions:
          - "TitleSearch.status == ORDERED"
          - "the parent LoanApplication.status IN {PREQUALIFIED, UNDER_REVIEW}"
        side_effects:
          - "increment TitleSearch.version by 1"
      - from: ORDERED
        to: EXCEPTIONS_FOUND
        trigger: "POST /title-searches/{id}/raise-exception"
        actor: TitleAgent
        preconditions:
          - "TitleSearch.status == ORDERED"
          - "request body provides exception_summary (non-empty)"
          - "the parent LoanApplication.status IN {PREQUALIFIED, UNDER_REVIEW}"
        side_effects:
          - "set TitleSearch.exception_summary = request.exception_summary"
          - "increment TitleSearch.version by 1"
      - from: EXCEPTIONS_FOUND
        to: CURED
        trigger: "POST /title-searches/{id}/cure"
        actor: TitleAgent
        preconditions:
          - "TitleSearch.status == EXCEPTIONS_FOUND"
        side_effects:
          - "increment TitleSearch.version by 1"

  - entity: RateLock
    initial_state: ACTIVE
    terminal_states: [EXPIRED, SUPERSEDED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /rate-locks/{id}/extend"
        actor: LoanOfficer
        preconditions:
          - "RateLock.status == ACTIVE"
          - "system clock < RateLock.expires_at (cannot extend an already-expired lock)"
          - "RateLock.extension_count < 2"
          - "request body provides extend_days in {7, 15, 30}"
        side_effects:
          - "set RateLock.expires_at = RateLock.expires_at + extend_days (UTC arithmetic)"
          - "increment RateLock.extension_count by 1"
          - "set RateLock.extension_fee_cents = RateLock.extension_fee_cents + per-extension fee per §1.3 rate_lock_extension_calc"
          - "increment RateLock.version by 1"
        note: "Self-loop transition — same from/to state; tracked by extension_count cap."
      - from: ACTIVE
        to: EXPIRED
        trigger: "auto-system check at endpoint dispatch: system clock >= RateLock.expires_at"
        actor: system
        preconditions:
          - "RateLock.status == ACTIVE"
          - "system clock >= RateLock.expires_at"
        side_effects:
          - "increment RateLock.version by 1"
        note: "Implementation MAY lazily transition on read; an ACTIVE lock past expiry MUST behave as EXPIRED for all downstream preconditions."
      - from: ACTIVE
        to: CANCELLED
        trigger: "side-effect of LoanApplication WITHDRAWN or DENIED transition (the latter includes the Appraisal-LTV auto-DENY cascade)"
        actor: system
        preconditions:
          - "RateLock.status == ACTIVE"
          - "the parent LoanApplication transitioned to WITHDRAWN or DENIED"
        side_effects:
          - "increment RateLock.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "side-effect of creating a new RateLock on the same LoanApplication"
        actor: system
        preconditions:
          - "RateLock.status == ACTIVE"
          - "a new RateLock was successfully created on the same LoanApplication"
        side_effects:
          - "increment RateLock.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "side-effect of LoanApplication CLOSE transition"
        actor: system
        preconditions:
          - "RateLock.status == ACTIVE"
          - "the parent LoanApplication transitioned from CLEAR_TO_CLOSE to CLOSED"
        side_effects:
          - "increment RateLock.version by 1"

  - entity: Disclosure
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: DELIVERED
        trigger: "POST /disclosures/{id}/deliver"
        actor: LoanOfficer
        preconditions:
          - "Disclosure.status == DRAFT"
          - "the parent LoanApplication.status IN {PREQUALIFIED, UNDER_REVIEW, APPROVED}"
          - "if disclosure_type == CLOSING_DISCLOSURE: LoanApplication.status IN {UNDER_REVIEW, APPROVED} AND there exists a DELIVERED or ACKNOWLEDGED Disclosure of type LOAN_ESTIMATE for this application"
        side_effects:
          - "set Disclosure.delivered_at = current UTC clock"
          - "snapshot Disclosure.apr_at_issuance = LoanApplication.provisional_apr (for LOAN_ESTIMATE) or LoanApplication.final_apr (for CLOSING_DISCLOSURE) — both computed per §1.3 apr_calculation"
          - "recompute LoanApplication.earliest_consummation_at per §1.3 trid_timeline_calc and snapshot it onto this Disclosure"
          - "if disclosure_type == CLOSING_DISCLOSURE: evaluate §1.3 cd_redisclose_check vs the immediately prior DELIVERED CLOSING_DISCLOSURE for this application and set change_requires_redisclose accordingly"
          - "increment Disclosure.version by 1; increment LoanApplication.version by 1"
      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /disclosures/{id}/acknowledge"
        actor: Applicant
        preconditions:
          - "Disclosure.status == DELIVERED"
          - "the parent LoanApplication is not in a terminal state"
        side_effects:
          - "set Disclosure.acknowledged_at = current UTC clock"
          - "increment Disclosure.version by 1"
      - from: DELIVERED
        to: SUPERSEDED
        trigger: "side-effect of delivering a new Disclosure of the same type on the same application"
        actor: system
        preconditions:
          - "Disclosure.status == DELIVERED"
          - "a new Disclosure of the same disclosure_type was just DELIVERED on the same LoanApplication"
        side_effects:
          - "increment Disclosure.version by 1"
      - from: ACKNOWLEDGED
        to: SUPERSEDED
        trigger: "side-effect of delivering a new Disclosure of the same type on the same application"
        actor: system
        preconditions:
          - "Disclosure.status == ACKNOWLEDGED"
          - "a new Disclosure of the same disclosure_type was just DELIVERED on the same LoanApplication"
        side_effects:
          - "increment Disclosure.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: ratelock-create-stale-application
    parent_entity: LoanApplication
    write_endpoint: "POST /rate-locks"
    occ_field: "expected_application_version"
    description: |
      Creating a new RateLock against a LoanApplication whose version has
      advanced since the client last observed it is rejected. The canonical
      case: client reads loan_application.version == 5; another writer creates
      a RateLock (which legitimately supersedes any prior ACTIVE lock on the
      application per the §1.2 RateLock state machine, bumping application
      version to 6); the current client still posts expected_application_version
      == 5 and the server rejects on stale version. Two strictly sequential
      requests, no parallelism.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: disclosure-create-stale-application
    parent_entity: LoanApplication
    write_endpoint: "POST /disclosures"
    occ_field: "expected_application_version"
    description: |
      Creating a new Disclosure (LOAN_ESTIMATE or CLOSING_DISCLOSURE) against
      a LoanApplication whose version has advanced since the client last
      observed it is rejected. A new DELIVERED disclosure of the same type
      legitimately supersedes the prior under §1.2 Disclosure side effects;
      a stale view that does not see the supersede triggers the OCC check
      deterministically without any parallelism.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dti_ratio
    trigger: "Computed during POST /loan-applications/{id}/prequalify; recomputed if an IncomeVerification flips to ACCEPTED before APPROVED."
    algorithm: aggregation
    formula: |
      monthly_income_cents = floor(income_basis_cents / 12)        # integer cents
      front_end_dti = round(housing_payment_cents / monthly_income_cents, 4)
      back_end_dti  = round((housing_payment_cents + Applicant.monthly_debt_cents) / monthly_income_cents, 4)
      where housing_payment_cents is approximated as
        principal_and_interest_cents
          = round( requested_loan_amount_cents * monthly_rate
                   / (1 - (1 + monthly_rate) ** (-loan_term_months)), 0 )
        monthly_rate = locked_rate_bps / 10_000 / 12  if an ACTIVE RateLock exists
                       else 700 / 10_000 / 12        (7.00% default underwriting rate)
        housing_payment_cents = principal_and_interest_cents      # taxes/insurance assumed elsewhere
    input_set: |
      front_end variant uses ONLY Applicant.annual_income_cents as income basis.
      back_end variant uses the SAME annual_income_cents AND adds Applicant.monthly_debt_cents to the numerator.
      Both variants exclude any IncomeVerification.verified_annual_income_cents at pre-qualification; that value
      only affects re-evaluation triggered by acceptance of an IncomeVerification, NEVER pre-qualification.
    constants:
      DEFAULT_UNDERWRITING_RATE_BPS: 700
      ROUNDING_DTI_PLACES: 4
      ROUNDING_DTI_MODE: round_half_up
    precision: "DTI ratios stored to 4 decimal places, round_half_up; monthly_income_cents floored to integer cents BEFORE division."
    variants:
      - name: front_end
        when: "Always computed on prequalify; used by ERR_DTI_FRONTEND_TOO_HIGH (front-end DTI cap 0.31)."
        difference: "Numerator is housing payment only."
      - name: back_end
        when: "Always computed on prequalify; back_end_dti > 0.43 triggers prequal_decision = DENIED."
        difference: "Numerator adds Applicant.monthly_debt_cents to housing payment."

  - name: ltv_ratio
    trigger: "Computed during POST /loan-applications/{id}/prequalify (variant_provisional); recomputed during Appraisal COMPLETE/RECONSIDER (variant_final)."
    algorithm: threshold
    formula: |
      provisional: ltv_ratio = round(requested_loan_amount_cents / property_value_cents, 4)
      final:       ltv_ratio = round(requested_loan_amount_cents / min(property_value_cents, appraised_value_cents), 4)
      Both rounded to 4 decimal places, round_half_up.
    input_set: |
      provisional uses LoanApplication.property_value_cents (applicant-stated).
      final uses min(LoanApplication.property_value_cents, Appraisal.appraised_value_cents) where the Appraisal
      is the unique Appraisal for the application whose status IN {COMPLETED, RECONSIDERED}.
    constants:
      LTV_PREQUAL_MAX: 0.9500
      ROUNDING_LTV_PLACES: 4
      ROUNDING_LTV_MODE: round_half_up
    precision: "4 decimal places, round_half_up."
    variants:
      - name: provisional
        when: "On prequalify before Appraisal exists."
        difference: "Denominator is stated property value only."
      - name: final
        when: "Recomputed whenever an Appraisal transitions to COMPLETED or RECONSIDERED."
        difference: "Denominator becomes min(stated_property_value, appraised_value) — uses the LESSER of the two."

  - name: apr_calculation
    trigger: "Computed during Disclosure DELIVER. provisional snapshot freezes onto LOAN_ESTIMATE; final snapshot freezes onto CLOSING_DISCLOSURE."
    algorithm: forward_looking
    formula: |
      effective_principal_cents = requested_loan_amount_cents - prepaid_finance_charge_cents
      where prepaid_finance_charge_cents =
        provisional: 0                                                       # LE excludes lock extension fees
        final:       RateLock.extension_fee_cents of the application's CURRENT lock (sum of all extensions so far)
      monthly_rate_decimal = current_active_RateLock.locked_rate_bps / 10_000 / 12
      n = loan_term_months
      monthly_payment_cents = round(
        requested_loan_amount_cents * monthly_rate_decimal
        / (1 - (1 + monthly_rate_decimal) ** (-n)), 0 )
      Solve for apr_decimal in:
        effective_principal_cents
          = sum_{k=1..n} monthly_payment_cents / (1 + apr_decimal/12) ** k
      Use Newton-Raphson with seed apr_decimal = locked_rate_bps / 10_000;
      iterate until |Δ| < 1e-8 OR 50 iterations; then round to 4 decimal places, round_half_up.
      Final stored APR_pct = round(apr_decimal * 100, 3) — APR is recorded as a percentage to 3 decimal places.
    input_set: |
      provisional ignores RateLock.extension_fee_cents (treats prepaid finance charge as 0).
      final uses the current ACTIVE RateLock's cumulative extension_fee_cents (post any extensions to date).
      Both use the application's CURRENT ACTIVE RateLock's locked_rate_bps.
    constants:
      APR_NEWTON_TOLERANCE: 1e-8
      APR_MAX_ITERATIONS: 50
      ROUNDING_APR_PERCENT_PLACES: 3
      ROUNDING_APR_PERCENT_MODE: round_half_up
    precision: "APR stored as percentage with 3 decimal places (e.g., 6.875), round_half_up."
    variants:
      - name: provisional
        when: "Used on LOAN_ESTIMATE delivery and stored as LoanApplication.provisional_apr."
        difference: "Prepaid finance charge treated as 0."
      - name: final
        when: "Used on CLOSING_DISCLOSURE delivery and stored as LoanApplication.final_apr."
        difference: "Prepaid finance charge equals cumulative RateLock.extension_fee_cents on the application's current lock — produces higher APR than provisional whenever extensions exist."

  - name: rate_lock_extension_calc
    trigger: "Computed during POST /rate-locks/{id}/extend; nested-rounding rule (mode (b))."
    algorithm: tiered_pricing
    formula: |
      # Per-extension fee — order of operations MUST be exactly:
      #   1. PER-EXTENSION rounding (round each tier's bps fee to whole cents)
      #   2. SUM across all accumulated extensions (cents)
      # Order matters: summing decimals first then rounding the total produces
      # a different cents value when the unrounded per-extension fees have
      # fractional cents.
      tier_bps = {7: 5, 15: 10, 30: 25}            # bps of requested principal per extend_days
      per_extension_fee_cents_unrounded =
        LoanApplication.requested_loan_amount_cents * tier_bps[extend_days] / 10_000
      per_extension_fee_cents = round_half_up(per_extension_fee_cents_unrounded, 0)
      RateLock.extension_fee_cents = sum of per_extension_fee_cents for every extension applied so far
    input_set: |
      Each extend call contributes exactly one rounded per-extension fee, indexed by that call's
      extend_days. Re-summing on EVERY extend (not incremental) is permitted as long as the
      per-extension rounding order is preserved.
    constants:
      EXT_FEE_TIER_BPS: { '7': 5, '15': 10, '30': 25 }
      EXT_DAYS_ALLOWED: [7, 15, 30]
      MAX_EXTENSIONS: 2
      ROUNDING_FEE_PLACES: 0
      ROUNDING_FEE_MODE: round_half_up
    precision: "Per-extension fee rounded to whole cents BEFORE summing. Total is the sum of rounded per-extension fees."

  - name: trid_timeline_calc
    trigger: "Computed on Disclosure DELIVER and on LoanApplication CLEAR_TO_CLOSE."
    algorithm: chronological
    formula: |
      Let LE_first.delivered_at = the EARLIEST DELIVERED Disclosure of type LOAN_ESTIMATE for this
      application (ordered by delivered_at ASC; tie-break by created_at ASC; never by id).
      Let CD_last.delivered_at = the LATEST DELIVERED Disclosure of type CLOSING_DISCLOSURE for
      this application (ordered by delivered_at DESC; tie-break by created_at DESC).
      If LE_first or CD_last is missing, earliest_consummation_at = null.
      Otherwise:
        le_floor  = LE_first.delivered_at + 7 calendar days  # TRID 7-business-day waiting period,
                                                              # modeled as 7 calendar days for determinism
        cd_floor  = CD_last.delivered_at  + 3 calendar days  # TRID 3-business-day CD waiting period
        earliest_consummation_at = max(le_floor, cd_floor)
      Times are wall-clock UTC; "+ N calendar days" adds exactly N * 86400 seconds (no DST adjustments).
    input_set: "Only DELIVERED disclosures (NOT DRAFT, NOT SUPERSEDED) participate. Acknowledgement timestamps are NOT inputs to the timeline."
    constants:
      LE_WAITING_DAYS: 7
      CD_WAITING_DAYS: 3
    precision: "Timestamps stored to millisecond precision, ISO 8601 UTC with three fractional digits."

  - name: cd_redisclose_check
    trigger: "Evaluated on every CLOSING_DISCLOSURE DELIVER transition."
    algorithm: threshold
    formula: |
      Let prior_cd = the immediately-prior DELIVERED-or-SUPERSEDED CLOSING_DISCLOSURE on the same
      application (ordered by delivered_at DESC; tie-break by created_at DESC; never by id).
      If prior_cd is null, change_requires_redisclose = false (this is the first CD).
      Else:
        delta_bps = abs(this.apr_at_issuance - prior_cd.apr_at_issuance) * 100  # APRs are percents → bps
        change_requires_redisclose = (delta_bps > 12.5)
      Boundary: exactly 12.5 bps delta → false (NOT a redisclose trigger).
    input_set: "Only the most recent prior CLOSING_DISCLOSURE counts; LOAN_ESTIMATE rows are ignored here."
    constants:
      APR_TOLERANCE_BPS: 12.5
    precision: "Comparison done in bps with one fractional digit (12.5)."

# =============================================================================
# §1.4 Validation Rules Table (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Headers X-User-Role and X-User-ID present on every endpoint except response envelope errors themselves."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the §1.7 declared roles."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path parameters resolve to existing resources, validated left-to-right in the URL."
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with path id segments"

  - priority: 4
    category: existence
    check: "Sub-resource path id (income-verification, asset-verification, appraisal, title-search, rate-lock, disclosure, udaap-check) exists."
    error_id: ERR_SUBRESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with sub-resource id segments"

  - priority: 5
    category: existence
    check: "Foreign-key references in body (applicant_id, application_id) resolve to existing entities."
    error_id: ERR_APPLICANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /loan-applications, POST /income-verifications, POST /asset-verifications, POST /appraisals, POST /title-searches, POST /rate-locks, POST /disclosures, POST /udaap-checks"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is allowed per §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version when the endpoint declares an OCC field (§1.2.1)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rate-locks, POST /disclosures"

  - priority: 8
    category: business_safety
    check: "UDAAP gate — POST /loan-applications/{id}/approve REQUIRES the most recent UDAAPCheck on the application (ordered by created_at ASC, last wins) to have review_outcome == CLEARED. A FLAGGED most-recent UDAAPCheck blocks approval."
    error_id: ERR_UDAAP_BLOCKED
    http_status: 422
    applies_to: "POST /loan-applications/{id}/approve"

  - priority: 9
    category: business_safety
    check: "TRID waiting period — POST /loan-applications/{id}/close REQUIRES system clock >= LoanApplication.earliest_consummation_at (sum of LE 7-day floor and CD 3-day floor per §1.3 trid_timeline_calc)."
    error_id: ERR_TRID_WAITING_PERIOD
    http_status: 422
    applies_to: "POST /loan-applications/{id}/close"

  - priority: 10
    category: business_constraint
    check: "DTI front-end ceiling — front_end_dti computed at prequalify or recomputed afterward MUST NOT exceed 0.31; exceeding it rejects prequalify (DTI front-end check fires AHEAD of back-end APPROVED/DENIED branch)."
    error_id: ERR_DTI_FRONTEND_TOO_HIGH
    http_status: 422
    applies_to: "POST /loan-applications/{id}/prequalify"

  - priority: 11
    category: business_constraint
    check: "Rate lock extension cap — RateLock.extension_count + 1 MUST be <= 2 on POST /rate-locks/{id}/extend."
    error_id: ERR_EXTENSION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /rate-locks/{id}/extend"

  - priority: 12
    category: business_constraint
    check: "Rate lock extend_days MUST be in {7, 15, 30}."
    error_id: ERR_INVALID_EXTEND_DAYS
    http_status: 422
    applies_to: "POST /rate-locks/{id}/extend"

  - priority: 13
    category: business_temporal
    check: "Rate lock extension on a lock whose system clock >= expires_at MUST be rejected (lock has already expired); fires before extension_count cap check."
    error_id: ERR_LOCK_EXPIRED
    http_status: 422
    applies_to: "POST /rate-locks/{id}/extend"

  - priority: 13.5
    category: business_temporal
    check: "Rate lock total duration cap — proposed_expires_at (current expires_at + extend_days) MUST NOT exceed locked_at + 90 calendar days. The lock's total live window (lock_term_days + sum of all extension_days) cannot exceed 90 days. Boundary: exactly 90 days = allowed; 91 days = rejected."
    error_id: ERR_LOCK_DURATION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /rate-locks/{id}/extend"

  - priority: 14
    category: business_referential
    check: "UDAAPCheck flagged_reasons array MUST be non-empty when review_outcome == FLAGGED, and MUST be empty/omitted when review_outcome == CLEARED."
    error_id: ERR_UDAAP_REASONS_INVALID
    http_status: 422
    applies_to: "POST /udaap-checks"

  - priority: 15
    category: business_referential
    check: "CD redisclose enforcement — if cd_redisclose_check returns true on a CLOSING_DISCLOSURE deliver, the disclosure is delivered AND change_requires_redisclose=true is set; subsequently, POST /loan-applications/{id}/clear-to-close MUST be rejected until a fresh ACKNOWLEDGED CLOSING_DISCLOSURE with change_requires_redisclose=false exists."
    error_id: ERR_CD_REDISCLOSE_REQUIRED
    http_status: 422
    applies_to: "POST /loan-applications/{id}/clear-to-close"

  - priority: 16
    category: business_referential
    check: "Segregation of duties — the user (X-User-ID) who created the LoanApplication MUST NOT be the underwriter who approves it. The same X-User-ID cannot perform POST /loan-applications/{id}/prequalify as LoanOfficer AND POST /loan-applications/{id}/approve as Underwriter; the system records the LoanOfficer X-User-ID at prequalify and rejects approve when X-User-ID matches."
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /loan-applications/{id}/approve"

  - priority: 17
    category: business_constraint
    check: "Required fields present and well-typed per §1.5 input shape (e.g., loan_purpose IN {PURCHASE, REFINANCE}; loan_term_months IN {180, 360}; credit_score IN [300, 850]; lock_term_days IN {30, 45, 60})."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Applicant ----
  - method: POST
    path: "/applicants"
    description: "Create a new applicant."
    roles: [LoanOfficer]
    code: 201
    input: [full_name, email, ssn_last4, annual_income_cents, monthly_debt_cents, credit_score, state_code]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants/{id}"
    description: "Read an applicant."
    roles: [LoanOfficer, Underwriter, ComplianceOfficer]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants"
    description: "List applicants with pagination."
    roles: [LoanOfficer, Underwriter, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "email?", "state_code?"]
    output: Applicant[]
    side_effects: []

  # ---- LoanApplication ----
  - method: POST
    path: "/loan-applications"
    description: "Create a new loan application in DRAFT status."
    roles: [LoanOfficer]
    code: 201
    input: [applicant_id, property_address, property_state_code, loan_purpose, requested_loan_amount_cents, property_value_cents, loan_term_months]
    output: LoanApplication
    side_effects: ["set LoanApplication.status = DRAFT; record creating LoanOfficer X-User-ID for SoD"]

  - method: GET
    path: "/loan-applications/{id}"
    description: "Read a loan application."
    roles: [LoanOfficer, Underwriter, Closer, ComplianceOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: []

  - method: GET
    path: "/loan-applications"
    description: "List loan applications."
    roles: [LoanOfficer, Underwriter, Closer, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "applicant_id?", "status?", "property_state_code?"]
    output: LoanApplication[]
    side_effects: []

  - method: POST
    path: "/loan-applications/{id}/prequalify"
    description: "Run pre-qualification. Auto-branches to PREQUALIFIED or DENIED per §1.2."
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["compute front_end_dti, back_end_dti, ltv_ratio (provisional)", "set prequal_decision", "transition to PREQUALIFIED or DENIED", "increment LoanApplication.version by 1"]

  - method: POST
    path: "/loan-applications/{id}/submit-for-review"
    description: "Move application from PREQUALIFIED to UNDER_REVIEW."
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["increment LoanApplication.version by 1"]

  - method: POST
    path: "/loan-applications/{id}/approve"
    description: "Move application from UNDER_REVIEW to APPROVED."
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["increment LoanApplication.version by 1"]

  - method: POST
    path: "/loan-applications/{id}/deny"
    description: "Move application from UNDER_REVIEW to DENIED."
    roles: [Underwriter]
    code: 200
    input: [reason]
    output: LoanApplication
    side_effects: ["increment LoanApplication.version by 1"]

  - method: POST
    path: "/loan-applications/{id}/clear-to-close"
    description: "Move application from APPROVED to CLEAR_TO_CLOSE; sets earliest_consummation_at."
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["set clear_to_close_at", "set earliest_consummation_at", "increment LoanApplication.version by 1"]

  - method: POST
    path: "/loan-applications/{id}/close"
    description: "Move application from CLEAR_TO_CLOSE to CLOSED. Supersedes active RateLock."
    roles: [Closer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["transition ACTIVE RateLock to SUPERSEDED", "increment RateLock.version by 1", "increment LoanApplication.version by 1"]

  - method: POST
    path: "/loan-applications/{id}/withdraw"
    description: "Withdraw the application from DRAFT, PREQUALIFIED, or UNDER_REVIEW."
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["cancel any ACTIVE RateLock (transitions RateLock to CANCELLED)", "increment LoanApplication.version by 1"]

  # ---- IncomeVerification ----
  - method: POST
    path: "/income-verifications"
    description: "Create an IncomeVerification in PENDING."
    roles: [LoanOfficer]
    code: 201
    input: [application_id, document_type, verified_annual_income_cents]
    output: IncomeVerification
    side_effects: []

  - method: GET
    path: "/income-verifications/{id}"
    description: "Read an income verification."
    roles: [LoanOfficer, Underwriter]
    code: 200
    input: []
    output: IncomeVerification
    side_effects: []

  - method: GET
    path: "/income-verifications"
    description: "List income verifications with optional application_id filter."
    roles: [LoanOfficer, Underwriter]
    code: 200
    input: ["limit?", "offset?", "application_id?", "status?"]
    output: IncomeVerification[]
    side_effects: []

  - method: POST
    path: "/income-verifications/{id}/accept"
    description: "Mark verification ACCEPTED."
    roles: [Underwriter]
    code: 200
    input: []
    output: IncomeVerification
    side_effects: ["increment IncomeVerification.version by 1"]

  - method: POST
    path: "/income-verifications/{id}/reject"
    description: "Mark verification REJECTED with reason."
    roles: [Underwriter]
    code: 200
    input: [rejection_reason]
    output: IncomeVerification
    side_effects: ["increment IncomeVerification.version by 1"]

  # ---- AssetVerification ----
  - method: POST
    path: "/asset-verifications"
    description: "Create an AssetVerification in PENDING."
    roles: [LoanOfficer]
    code: 201
    input: [application_id, asset_type, verified_balance_cents]
    output: AssetVerification
    side_effects: []

  - method: GET
    path: "/asset-verifications/{id}"
    description: "Read an asset verification."
    roles: [LoanOfficer, Underwriter]
    code: 200
    input: []
    output: AssetVerification
    side_effects: []

  - method: GET
    path: "/asset-verifications"
    description: "List asset verifications with optional application_id filter."
    roles: [LoanOfficer, Underwriter]
    code: 200
    input: ["limit?", "offset?", "application_id?", "status?"]
    output: AssetVerification[]
    side_effects: []

  - method: POST
    path: "/asset-verifications/{id}/accept"
    description: "Mark verification ACCEPTED."
    roles: [Underwriter]
    code: 200
    input: []
    output: AssetVerification
    side_effects: ["increment AssetVerification.version by 1"]

  - method: POST
    path: "/asset-verifications/{id}/reject"
    description: "Mark verification REJECTED with reason."
    roles: [Underwriter]
    code: 200
    input: [rejection_reason]
    output: AssetVerification
    side_effects: ["increment AssetVerification.version by 1"]

  # ---- Appraisal ----
  - method: POST
    path: "/appraisals"
    description: "Order an appraisal for an application; status = ORDERED."
    roles: [LoanOfficer]
    code: 201
    input: [application_id]
    output: Appraisal
    side_effects: []

  - method: GET
    path: "/appraisals/{id}"
    description: "Read an appraisal."
    roles: [LoanOfficer, Underwriter, Appraiser]
    code: 200
    input: []
    output: Appraisal
    side_effects: []

  - method: GET
    path: "/appraisals"
    description: "List appraisals filtered by application_id."
    roles: [LoanOfficer, Underwriter, Appraiser]
    code: 200
    input: ["limit?", "offset?", "application_id?", "status?"]
    output: Appraisal[]
    side_effects: []

  - method: POST
    path: "/appraisals/{id}/complete"
    description: "Appraiser reports completion with a value."
    roles: [Appraiser]
    code: 200
    input: [appraised_value_cents]
    output: Appraisal
    side_effects: ["set Appraisal.appraised_value_cents; recompute LoanApplication.ltv_ratio (variant_final)", "increment Appraisal.version by 1", "increment parent LoanApplication.version by 1"]

  - method: POST
    path: "/appraisals/{id}/reconsider"
    description: "LoanOfficer requests reconsideration of value with a new value and note."
    roles: [LoanOfficer]
    code: 200
    input: [reconsideration_note, new_appraised_value_cents]
    output: Appraisal
    side_effects: ["set Appraisal.appraised_value_cents (new) and reconsideration_note; recompute LoanApplication.ltv_ratio (variant_final)", "increment Appraisal.version by 1", "increment parent LoanApplication.version by 1"]

  - method: POST
    path: "/appraisals/{id}/confirm-reconsideration"
    description: "Appraiser accepts the reconsidered value, returning Appraisal to COMPLETED."
    roles: [Appraiser]
    code: 200
    input: []
    output: Appraisal
    side_effects: ["increment Appraisal.version by 1"]

  # ---- TitleSearch ----
  - method: POST
    path: "/title-searches"
    description: "Order a title search for an application; status = ORDERED."
    roles: [LoanOfficer]
    code: 201
    input: [application_id]
    output: TitleSearch
    side_effects: []

  - method: GET
    path: "/title-searches/{id}"
    description: "Read a title search."
    roles: [LoanOfficer, Underwriter, TitleAgent]
    code: 200
    input: []
    output: TitleSearch
    side_effects: []

  - method: GET
    path: "/title-searches"
    description: "List title searches filtered by application_id."
    roles: [LoanOfficer, Underwriter, TitleAgent]
    code: 200
    input: ["limit?", "offset?", "application_id?", "status?"]
    output: TitleSearch[]
    side_effects: []

  - method: POST
    path: "/title-searches/{id}/mark-clear"
    description: "TitleAgent marks the title search CLEAR."
    roles: [TitleAgent]
    code: 200
    input: []
    output: TitleSearch
    side_effects: ["increment TitleSearch.version by 1"]

  - method: POST
    path: "/title-searches/{id}/raise-exception"
    description: "TitleAgent reports a title exception."
    roles: [TitleAgent]
    code: 200
    input: [exception_summary]
    output: TitleSearch
    side_effects: ["increment TitleSearch.version by 1"]

  - method: POST
    path: "/title-searches/{id}/cure"
    description: "TitleAgent reports the exception cured."
    roles: [TitleAgent]
    code: 200
    input: []
    output: TitleSearch
    side_effects: ["increment TitleSearch.version by 1"]

  # ---- RateLock ----
  - method: POST
    path: "/rate-locks"
    description: "Create a new RateLock on a LoanApplication. Supersedes any prior ACTIVE lock on the same application. Uses OCC on application.version."
    roles: [LoanOfficer]
    code: 201
    input: [application_id, locked_rate_bps, lock_term_days, expected_application_version]
    output: RateLock
    side_effects: ["if a prior ACTIVE RateLock exists on the application, transition it to SUPERSEDED", "set RateLock.locked_at = current UTC clock", "set RateLock.expires_at = locked_at + lock_term_days", "increment any superseded RateLock.version by 1", "increment LoanApplication.version by 1"]

  - method: GET
    path: "/rate-locks/{id}"
    description: "Read a rate lock."
    roles: [LoanOfficer, Underwriter, Closer]
    code: 200
    input: []
    output: RateLock
    side_effects: []

  - method: GET
    path: "/rate-locks"
    description: "List rate locks filtered by application_id."
    roles: [LoanOfficer, Underwriter, Closer]
    code: 200
    input: ["limit?", "offset?", "application_id?", "status?"]
    output: RateLock[]
    side_effects: []

  - method: POST
    path: "/rate-locks/{id}/extend"
    description: "Extend the lock by extend_days; fee per §1.3 rate_lock_extension_calc. Self-loop transition."
    roles: [LoanOfficer]
    code: 200
    input: [extend_days]
    output: RateLock
    side_effects: ["set RateLock.expires_at = old_expires_at + extend_days", "increment RateLock.extension_count by 1", "recompute RateLock.extension_fee_cents (per-extension rounding, then sum)", "increment RateLock.version by 1"]

  # ---- Disclosure ----
  - method: POST
    path: "/disclosures"
    description: "Create a new Disclosure in DRAFT for an application. Uses OCC on application.version."
    roles: [LoanOfficer]
    code: 201
    input: [application_id, disclosure_type, expected_application_version]
    output: Disclosure
    side_effects: ["increment LoanApplication.version by 1"]

  - method: GET
    path: "/disclosures/{id}"
    description: "Read a disclosure."
    roles: [LoanOfficer, Underwriter, Closer, Applicant]
    code: 200
    input: []
    output: Disclosure
    side_effects: []

  - method: GET
    path: "/disclosures"
    description: "List disclosures filtered by application_id and/or disclosure_type."
    roles: [LoanOfficer, Underwriter, Closer, Applicant]
    code: 200
    input: ["limit?", "offset?", "application_id?", "disclosure_type?", "status?"]
    output: Disclosure[]
    side_effects: []

  - method: POST
    path: "/disclosures/{id}/deliver"
    description: "Deliver a DRAFT disclosure. Recomputes APR, TRID timeline, redisclose flag."
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Disclosure
    side_effects: ["set delivered_at", "snapshot apr_at_issuance and earliest_consummation_at", "set change_requires_redisclose for CLOSING_DISCLOSURE via §1.3 cd_redisclose_check", "supersede prior DELIVERED/ACKNOWLEDGED disclosure of same type", "recompute LoanApplication.earliest_consummation_at", "increment Disclosure.version by 1", "increment LoanApplication.version by 1"]

  - method: POST
    path: "/disclosures/{id}/acknowledge"
    description: "Applicant acknowledges receipt of a delivered disclosure."
    roles: [Applicant]
    code: 200
    input: []
    output: Disclosure
    side_effects: ["set acknowledged_at", "increment Disclosure.version by 1"]

  # ---- UDAAPCheck ----
  - method: POST
    path: "/udaap-checks"
    description: "Record a UDAAP compliance review outcome for an application."
    roles: [ComplianceOfficer]
    code: 201
    input: [application_id, review_outcome, "flagged_reasons?"]
    output: UDAAPCheck
    side_effects: ["set reviewer_user_id from X-User-ID"]

  - method: GET
    path: "/udaap-checks/{id}"
    description: "Read a UDAAP check."
    roles: [LoanOfficer, Underwriter, ComplianceOfficer]
    code: 200
    input: []
    output: UDAAPCheck
    side_effects: []

  - method: GET
    path: "/udaap-checks"
    description: "List UDAAP checks filtered by application_id."
    roles: [LoanOfficer, Underwriter, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "application_id?", "review_outcome?"]
    output: UDAAPCheck[]
    side_effects: []

  # ---- Test-driving (clock) endpoint ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-only: advance the system clock to a fixed UTC timestamp. Used to drive TRID waiting periods and rate-lock expiry deterministically."
    roles: [LoanOfficer, Underwriter, Closer, ComplianceOfficer, Appraiser, TitleAgent, Applicant]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["set system clock = to_iso8601 (UTC, ISO 8601)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Required auth headers missing."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not permitted to call this endpoint (or unknown role)."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "Loan application id in the path does not exist."
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "Referenced applicant_id or application_id in body does not exist."
  - id: ERR_SUBRESOURCE_NOT_FOUND
    http: 404
    condition: "Sub-resource id (income-verification, asset-verification, appraisal, title-search, rate-lock, disclosure, udaap-check) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Attempted transition is not allowed from the resource's current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match the parent's current version."
  - id: ERR_UDAAP_BLOCKED
    http: 422
    condition: "Approve attempted while the most recent UDAAPCheck for the application is FLAGGED."
  - id: ERR_TRID_WAITING_PERIOD
    http: 422
    condition: "Close attempted before earliest_consummation_at."
  - id: ERR_DTI_FRONTEND_TOO_HIGH
    http: 422
    condition: "Pre-qualification computed front_end_dti > 0.31."
  - id: ERR_EXTENSION_CAP_EXCEEDED
    http: 422
    condition: "RateLock extend attempted when extension_count is already 2."
  - id: ERR_INVALID_EXTEND_DAYS
    http: 422
    condition: "RateLock extend_days not in {7, 15, 30}."
  - id: ERR_LOCK_EXPIRED
    http: 422
    condition: "RateLock extend attempted on a lock whose system clock >= expires_at."
  - id: ERR_LOCK_DURATION_CAP_EXCEEDED
    http: 422
    condition: "RateLock extend would push total live duration past 90 calendar days from locked_at."
  - id: ERR_UDAAP_REASONS_INVALID
    http: 422
    condition: "UDAAPCheck flagged_reasons missing/empty when FLAGGED, or present when CLEARED."
  - id: ERR_CD_REDISCLOSE_REQUIRED
    http: 422
    condition: "Clear-to-close attempted while the latest CLOSING_DISCLOSURE has change_requires_redisclose=true and no fresh acknowledged superseding CD exists."
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Underwriter X-User-ID equals the LoanOfficer X-User-ID that prequalified the application."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required body field missing, malformed, or out of declared range/enum."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LoanOfficer
    description: "Originates loan applications, orders verifications/appraisals/title searches, creates rate locks and disclosures, drives prequalify and submit-for-review."
    identity: opaque
    exclusive_operations:
      - "POST /loan-applications"
      - "POST /loan-applications/{id}/prequalify"
      - "POST /loan-applications/{id}/submit-for-review"
      - "POST /loan-applications/{id}/withdraw"
      - "POST /income-verifications"
      - "POST /asset-verifications"
      - "POST /appraisals"
      - "POST /appraisals/{id}/reconsider"
      - "POST /title-searches"
      - "POST /rate-locks"
      - "POST /rate-locks/{id}/extend"
      - "POST /disclosures"
      - "POST /disclosures/{id}/deliver"
    shared_operations:
      - "GET /applicants/{id}"
      - "GET /applicants"
      - "GET /loan-applications/{id}"
      - "GET /loan-applications"
      - "GET /income-verifications/{id}"
      - "GET /income-verifications"
      - "GET /asset-verifications/{id}"
      - "GET /asset-verifications"
      - "GET /appraisals/{id}"
      - "GET /appraisals"
      - "GET /title-searches/{id}"
      - "GET /title-searches"
      - "GET /rate-locks/{id}"
      - "GET /rate-locks"
      - "GET /disclosures/{id}"
      - "GET /disclosures"
      - "GET /udaap-checks/{id}"
      - "GET /udaap-checks"
      - "POST /_clock/set_current_utc"

  - name: Underwriter
    description: "Reviews verifications, approves or denies applications; cannot approve an application they created (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /income-verifications/{id}/accept"
      - "POST /income-verifications/{id}/reject"
      - "POST /asset-verifications/{id}/accept"
      - "POST /asset-verifications/{id}/reject"
      - "POST /loan-applications/{id}/approve"
      - "POST /loan-applications/{id}/deny"
      - "POST /loan-applications/{id}/clear-to-close"
    shared_operations:
      - "GET /applicants/{id}"
      - "GET /applicants"
      - "GET /loan-applications/{id}"
      - "GET /loan-applications"
      - "GET /income-verifications/{id}"
      - "GET /income-verifications"
      - "GET /asset-verifications/{id}"
      - "GET /asset-verifications"
      - "GET /appraisals/{id}"
      - "GET /appraisals"
      - "GET /title-searches/{id}"
      - "GET /title-searches"
      - "GET /rate-locks/{id}"
      - "GET /rate-locks"
      - "GET /disclosures/{id}"
      - "GET /disclosures"
      - "GET /udaap-checks/{id}"
      - "GET /udaap-checks"
      - "POST /_clock/set_current_utc"

  - name: Closer
    description: "Performs the closing/funding step after the TRID waiting period has elapsed."
    identity: opaque
    exclusive_operations:
      - "POST /loan-applications/{id}/close"
    shared_operations:
      - "GET /loan-applications/{id}"
      - "GET /loan-applications"
      - "GET /rate-locks/{id}"
      - "GET /rate-locks"
      - "GET /disclosures/{id}"
      - "GET /disclosures"
      - "POST /_clock/set_current_utc"

  - name: Appraiser
    description: "Reports appraised value and confirms reconsideration outcomes."
    identity: opaque
    exclusive_operations:
      - "POST /appraisals/{id}/complete"
      - "POST /appraisals/{id}/confirm-reconsideration"
    shared_operations:
      - "GET /appraisals/{id}"
      - "GET /appraisals"
      - "POST /_clock/set_current_utc"

  - name: TitleAgent
    description: "Performs title search workflow steps."
    identity: opaque
    exclusive_operations:
      - "POST /title-searches/{id}/mark-clear"
      - "POST /title-searches/{id}/raise-exception"
      - "POST /title-searches/{id}/cure"
    shared_operations:
      - "GET /title-searches/{id}"
      - "GET /title-searches"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Records UDAAP compliance review outcomes."
    identity: opaque
    exclusive_operations:
      - "POST /udaap-checks"
    shared_operations:
      - "GET /applicants/{id}"
      - "GET /applicants"
      - "GET /loan-applications/{id}"
      - "GET /loan-applications"
      - "GET /udaap-checks/{id}"
      - "GET /udaap-checks"
      - "POST /_clock/set_current_utc"

  - name: Applicant
    description: "The borrower; acknowledges disclosures. X-User-ID is the Applicant entity id."
    identity: entity_backed:Applicant
    exclusive_operations:
      - "POST /disclosures/{id}/acknowledge"
    shared_operations:
      - "GET /disclosures/{id}"
      - "GET /disclosures"
      - "POST /_clock/set_current_utc"
