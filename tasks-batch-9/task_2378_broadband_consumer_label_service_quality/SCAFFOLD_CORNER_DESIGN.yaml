              as: RetailAgent
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: RetailAgent
            - call: "POST /plan-change-notices/${notice_id}/effect"
              payload: {}
              as: RetailAgent
            - call: "POST /plan-change-notices/${notice_id}/acknowledge"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { e2: $.data.error_id }
          assert:
            - "PlanChangeNotice.${notice_id}: state == SENT at creation, notice_days == 30, source_plan_id == ${plan_id}, disclosed_net_monthly_cents == 7628 (the target plan's PUBLISHED label net_monthly_post_promo_cents)"
            - "PlanChangeNotice.${notice_id}.etf_disclosed_cents == 12000: PRORATED_MONTHLY with elapsed_months == 0 and remaining_months == 6 gives 12000 * 6 / 6"
            - "SubscriberAccount.${acct_id}.subscription_state == PENDING_CHANGE immediately after the notice is created"
            - "after the acknowledge, state == ACKNOWLEDGED with acknowledged_at == 2026-09-01T00:00:00.000Z"
            - "e1 == ERR_NOTICE_NOT_DUE (422): the ACKNOWLEDGED_to_EFFECTED precondition requires the clock to reach 2026-10-01T00:00:00Z"
            - "after the clock advance the effect returns 200: state == EFFECTED, effected_at == 2026-10-01T00:00:00.000Z"
            - "SubscriberAccount.${acct_id}.subscription_state == ACTIVE again and plan_id is still ${plan_id} — notice_type PRICE_INCREASE does not move the account to target_plan_id"
            - "SubscriberAccount.${acct_id}.pricing_phase == INTRO: recomputed as floor(30 days / 30 days) == 1 elapsed month, still below intro_term_months 6"
            - "e2 == ERR_NOTICE_INVALID_STATE (409): EFFECTED is terminal for the notice machine"

      - name: parallel_label_dimensions_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.LabelVersion.transitions.SUBSTANTIATED_to_UNSUBSTANTIATED
        excluded_because:
          difficulty_instance: non_linear_state_machine / label_publication_and_substantiation_dimensions_move_independently
          rationale: "The named §1.8 instance walks both LabelVersion dimensions through every combined state and asserts that publication_state stays PUBLISHED while substantiation_status moves."

      - name: cyclic_investigation_loop_is_bounded
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Complaint.transitions.INFO_REQUESTED_to_UNDER_INVESTIGATION
          - validations.priority_80
        excluded_because:
          difficulty_instance: non_linear_state_machine / complaint_info_request_cycle_and_reopen_bound
          rationale: "The named §1.8 instance drives the request-info loop repeatedly and exhausts MAX_REOPENS, asserting both the loop counters and the termination condition."

      - name: branching_docket_join_requires_both_filings
        claim_type: branching
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.RegulatorInquiry.transitions.EVIDENCE_ASSEMBLY_to_RESPONSE_COMPLETE
          - errors.ERR_INQUIRY_FILINGS_INCOMPLETE
        excluded_because:
          difficulty_instance: non_linear_state_machine / regulator_inquiry_fork_join_requires_both_filings
          rationale: "The named §1.8 instance enters the fork from both branches and asserts the join, the premature close rejection and filed_late."

      - name: ledger_sync_on_upheld_complaint
        claim_type: ledger_sync
        grounds:
          - entities.SubscriberAccount.fields.credit_balance_cents
          - endpoints.POST_complaints_id_resolve
        excluded_because:
          difficulty_instance: transitive_cascade / uphold_complaint_four_hop_credit_audit_cascade
          rationale: "The named §1.8 instance reconciles credit_balance_cents, remediation_count and audit_flag before and after each upheld finding."

      - name: compensation_on_voided_credit
        claim_type: compensation
        grounds:
          - state_machines.RemediationCredit.transitions.ISSUED_to_VOIDED
          - entities.SubscriberAccount.fields.audit_flag
        excluded_because:
          difficulty_instance: compensating_invariant / void_credit_restores_account_ledger_invariant
          rationale: "The named §1.8 instance asserts the ledger invariant before issuance, after issuance and after each void, including the audit_flag reversal."

      - name: conditional_cascade_skips_substantiated_labels
        claim_type: conditional_cascade
        grounds:
          - endpoints.POST_test_runs_id_invalidate
          - state_machines.PerformanceAttestation.transitions.CERTIFIED_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / invalidate_run_five_hop_substantiation_cascade
          rationale: "The named §1.8 instance shows the cascade stopping at hop 2 when the invalidated run backs no attestation, and running all five hops when it does."

      - name: guarded_publication_requires_certified_attestation
        claim_type: guarded_transitions
        grounds:
          - state_machines.LabelVersion.transitions.DRAFT_to_PUBLISHED
          - errors.ERR_ATTESTATION_NOT_CERTIFIED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / label_publication_requires_certified_attestation
          rationale: "The named §1.8 instance walks the guarding PerformanceAttestation through DRAFT, CERTIFIED, SUPERSEDED and REVOKED and asserts publish success or ERR_ATTESTATION_NOT_CERTIFIED at each."

  - section: calculations
    instances:

      - name: pricing_phase_selects_the_disclosed_net_charge
        claim_type: correct_result
        grounds:
          - calculations.account_pricing_phase
          - calculations.effective_label_selection
          - entities.LabelDisclosure.fields.disclosed_net_monthly_cents
        distinguishing_aspect: "Three accounts on the same plan and the same clock disclose different net charges purely because of their service_start_date: elapsed_months 0 and 5 are INTRO (3766) while exactly 6 elapsed 30-day months is already POST_PROMO (7628)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (the scaffold default 2026-08-01T00:00:00Z is repositioned first)."
            - "ServicePlan FIBER300 (advertised 300/140, intro 4999 for 6 months, post-promotional 7999, ETF 12000 PRORATED_MONTHLY, required_locales [en-US])."
            - "Five FeeLineItems: EQUIP_RENTAL 1500 ALWAYS, NETWORK_ACCESS 700 POST_PROMO_ONLY, REG_RECOVERY 3.25% ALWAYS, STATE_USF 2.11% ALWAYS, INSTALL 9900 ONE_TIME."
            - "PUBLISHED MethodologyDocument MTH-2026-A (peak [19,23), min_samples_required 4, max_run_duration_days 7) and MeasurementProbe PRB-1 (max_concurrent_windows 2)."
            - "One INCLUDED TestRun A with 6 samples, 4 of them peak-hour; ServicePlan.evidence_sample_total == 6."
            - "One CERTIFIED PEAK_HOUR_MEDIAN PerformanceAttestation: typical 240.00 / 115.00 / 42 ms, margins 0.8000 / 0.8214."
            - "One PUBLISHED, SUBSTANTIATED LabelVersion (version_seq 1, effective_from 2026-09-01, effective_until null, WCAG_AA, VERIFIED en-US translation, net intro 3766, net post-promotional 7628); ServicePlan.label_posture == OPEN."

            - "Three accounts on FIBER300: ACC-A service_start 2026-09-01 (0 elapsed months), ACC-B service_start 2026-03-05 (exactly 180 days == 6 elapsed months at the clock), ACC-C service_start 2026-03-06 (179 days == 5 elapsed months)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, data_allowance_gb: 1200, overage_rate_cents_per_gb: 1000, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }

            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "EQUIP_RENTAL", description: "Equipment rental", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 1500, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "NETWORK_ACCESS", description: "Network access surcharge", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 700, applies_during: "POST_PROMO_ONLY" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "REG_RECOVERY", description: "Regulatory cost recovery", label_category: "MONTHLY_RECURRING", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0325, applies_during: "ALWAYS", is_regulatory_recovery: true }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "STATE_USF", description: "State universal service fund", label_category: "GOVERNMENT_TAX", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0211, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "INSTALL", description: "Professional installation", label_category: "ONE_TIME", basis: "FIXED", amount_cents: 9900, applies_during: "ALWAYS" }
              as: ComplianceOfficer

            - call: "POST /methodology-documents"
              payload: { doc_code: "MTH-2026-A", version_label: "v1.0", methodology_url: "https://isp.example/methodology/v1.0", peak_hours_start_utc_hour: 19, peak_hours_end_utc_hour: 23, min_samples_required: 4, max_run_duration_days: 7 }
              as: NetworkEngineer
              captures: { doc_id: $.data.id }
