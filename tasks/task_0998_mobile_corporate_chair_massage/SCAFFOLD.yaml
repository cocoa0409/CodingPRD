    roles: [PlatformAdmin, Organizer, Therapist]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: /chair-massage/bookings/{id}/open-scheduling
    description: "Move DRAFT -> SCHEDULING; materializes ChairSlots"
    roles: [Organizer]
    code: 200
    input: []
    output: Booking
    side_effects: ["chair_count ChairSlot rows created", "Booking.version += 1"]

  - method: POST
    path: /chair-massage/bookings/{id}/confirm
    description: "Move SCHEDULING -> CONFIRMED (OCC-guarded)"
    roles: [Organizer]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "TravelLeg rows created (one per assigned therapist) with QUOTED travel_fee"
      - "Booking.version += 1"

  - method: POST
    path: /chair-massage/bookings/{id}/start-service
    description: "Move CONFIRMED -> IN_PROGRESS (must be event_date, at least one chair ON_SITE)"
    roles: [Organizer]
    code: 200
    input: []
    output: Booking
    side_effects: ["Booking.version += 1"]

  - method: POST
    path: /chair-massage/bookings/{id}/complete
    description: "Move IN_PROGRESS -> COMPLETED (all claims terminal); posts payout ledger, settles travel fees"
    roles: [Organizer]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "TravelLegs recomputed to SETTLED variant and transitioned to REIMBURSED"
      - "PayoutLedgerEntry rows posted (EARNING + TRAVEL_REIMBURSEMENT)"
      - "ChairSlots transition ON_SITE -> COMPLETED"
      - "Booking.version += 1"

  - method: POST
    path: /chair-massage/bookings/{id}/cancel
    description: "Cancel from DRAFT/SCHEDULING/CONFIRMED; tiered cancellation fee applies from CONFIRMED"
    roles: [Organizer]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "ASSIGNED ChairSlots -> RELEASED"
      - "PLANNED TravelLegs -> WAIVED and travel_fee_cents zeroed"
      - "cancellation_fee_cents computed per cancellation_fee calculation"
      - "Booking.version += 1"

  - method: GET
    path: /chair-massage/bookings/{id}/chair-slots
    description: "List chair-slots of booking"
    roles: [PlatformAdmin, Organizer, Therapist]
    code: 200
    input: ["limit?", "offset?", "status?", "therapist_id?"]
