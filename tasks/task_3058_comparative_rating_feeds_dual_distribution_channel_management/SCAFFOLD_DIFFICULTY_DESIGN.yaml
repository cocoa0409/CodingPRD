            - "final bind succeeds: Quote.${q_id}.status == BOUND and Policy.${pol_id}.written_premium_cents == 57500"

      - name: agent_suspend_reinstate_cycle_on_agent
        grounds:
          - state_machines.Agent.APPOINTED_to_SUSPENDED
          - state_machines.Agent.SUSPENDED_to_APPOINTED
        distinguishing_aspect: |
          Entity: Agent (different entity from Quote) — an APPOINTED ->
          SUSPENDED -> APPOINTED cycle that may repeat; each pass bumps
          Agent.version, and a second suspend from APPOINTED is legal while a
          suspend from SUSPENDED is not. The cycle also re-validates the
          ACTIVE-appointment precondition on reinstate.
        test_recipe:
          setup:
            - "Logical clock 2026-01-01T00:00:00Z. Agent A created with ACTIVE appointment (TX, AUTO) and appointed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /agents"
              payload: { agency_name: "Hill Country Insurance", principal_name: "A. Reyes", resident_state_code: "TX" }
              as: CarrierAdmin
              captures: { agent_a: $.data.id, agent_v: $.data.version }
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z" }
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/appoint"
              payload: {}
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/suspend"
              payload: {}
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/reinstate"
              payload: {}
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/suspend"
              payload: {}
              as: UnderwritingReviewer
          trigger:
            - call: "POST /agents/${agent_a}/suspend"
              payload: {}
              as: UnderwritingReviewer
              captures: { err: $.data.error_id }
            - call: "POST /agents/${agent_a}/reinstate"
              payload: {}
              as: UnderwritingReviewer
            - call: "GET /agents/${agent_a}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "the second suspend from SUSPENDED fails with ERR_INVALID_STATE_TRANSITION (cycle allows APPOINTED<->SUSPENDED, not SUSPENDED->SUSPENDED)"
            - "Agent.${agent_a}.status == APPOINTED after reinstate"
            - "Agent.${agent_a}.version == ${agent_v} + 4 (appoint, suspend, reinstate, suspend, reinstate each +1 after creation)"

