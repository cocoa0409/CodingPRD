  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sign_state_beats_safety
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - state_machines.Report.FINAL_to_SIGNED
        distinguishing_aspect: |
          Category pair = state vs business_safety. Report in DRAFTING (state
          violation) AND signer is a TRAINEE (safety violation
          ERR_SIGNER_NOT_MAI_DESIGNATED) — priority 8 beats 10, so the error
          is ERR_INVALID_STATE_TRANSITION.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS; INCOME approach COMPLETE weight 100.00; report in DRAFTING (never submitted)"
            - "A TRAINEE appraiser exists"
          setup_api_calls:
