              as: TrialAgronomist
              captures: { site_id: $.data.id }
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 3, min_locations: 1 }
              as: TrialAgronomist
              captures: { series_id: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_a}", trial_site_id: "${site_id}", plot_count: 9, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_a: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_b}", trial_site_id: "${site_id}", plot_count: 9, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_b: $.data.id }
            - call: "POST /trial-series/${series_id}/plant"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 14.1 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 14.2 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 14.4 }
              as: TrialAgronomist
          trigger:
            - call: "POST /trial-entries/${e_a}/finalize"
              payload: {}
              as: TrialAgronomist
            - call: "GET /trial-entries/${e_a}"
              payload: {}
              as: DataAnalyst
            - call: "GET /trial-series/${series_id}"
              payload: {}
              as: DataAnalyst
            - call: "GET /trial-sites/${site_id}"
