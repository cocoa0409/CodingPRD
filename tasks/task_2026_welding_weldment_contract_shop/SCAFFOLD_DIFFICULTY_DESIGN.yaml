            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_id}/approve"
              payload: { expected_wps_version: "${wps_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/welder-qualifications"
              payload: { welder_id: "${welder_id}", wps_id: "${wps_id}", process: "SMAW", qualified_at_utc: "2026-08-01T00:00:00Z" }
              as: QCManager
              captures: { qual_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV6", holding_temp_c: 150, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { oven_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L6", filler_spec: "E7018", process: "SMAW", received_kg: 50, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 10 }
              as: MaterialController
            - call: "POST /weld-shop/shops/${shop_id}/fixtures"
              payload: { fixture_code: "F6", capacity_weldments: 4, owner_party: "SHOP" }
              as: ProductionPlanner
              captures: { fixture_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures/${fixture_id}/reserve"
              payload: {}
              as: ProductionPlanner
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders"
              payload: { po_number: "PO-6", customer_name: "Cust F", promised_ship_date_utc: "2026-12-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-6", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { weldment_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${weldment_id}/joints"
              payload: { joint_number: "J6", wps_id: "${wps_id}", base_metal_thickness_mm: 10, required_ndt_methods: ["VT"] }
              as: WeldLead
              captures: { joint_id: $.data.id, joint_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_id}/start-fabrication"
              payload: { expected_joint_version: "${joint_v}" }
