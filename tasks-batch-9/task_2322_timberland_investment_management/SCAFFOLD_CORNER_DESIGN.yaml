        claim_type: valid_transition
        grounds:
          - "state_machines.CertificationAudit.FINDINGS_ISSUED_to_SUSPENDED"
          - "state_machines.CertificationAudit.SUSPENDED_to_FINDINGS_ISSUED"
          - "state_machines.Property.CONDITIONAL_to_SUSPENDED"
          - "state_machines.Property.SUSPENDED_to_CONDITIONAL"
          - "calculations.certification_posture_derivation"
        distinguishing_aspect: |
          A single open MINOR finding puts the property at CONDITIONAL, not SUSPENDED. An
          auditor SUSPEND overrides that by the audit-status branch of the derivation, and
          REINSTATE must fall back to the count-driven branch — CONDITIONAL, not CERTIFIED —
          because the MINOR finding is still open. A reinstatement that jumped to CERTIFIED
          would silently drop the finding.
