  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: clock_effectivation_cascade_to_monitoring
        grounds:
          - state_machines.Adjustment.APPROVED_to_EFFECTIVE
          - state_machines.GapFinding.TARGETED_to_RESOLVED
          - state_machines.RemediationPlan.FULLY_COMMITTED_to_COMPLETED
          - state_machines.PayEquityStudy.REMEDIATION_OPEN_to_MONITORING
          - calculations.scheduled_transition_sweep
        distinguishing_aspect: |
          Depth-3 cascade from POST /api/_clock/set_current_utc: adjustments flip
          APPROVED -> EFFECTIVE (link 1); that empties the finding's open
          adjustments so the finding flips TARGETED -> RESOLVED (link 2); with
          zero unresolved findings and the plan COMPLETED the study auto-flips
          REMEDIATION_OPEN -> MONITORING (link 3) — each link caused by the
          previous one, not by the clock call directly.
        test_recipe:
          setup:
            - "Study C (period 2024-01-01..2024-12-31, protected_classes [GENDER], min_group_size 6) REMEDIATION_OPEN; 6-member group (FIN, NY, 5) MEDIAN gap 10.0000; finding TARGETED; plan budget 2700000 APPROVED with exactly three adjustments 950000/900000/850000 all APPROVED with effective_date 2026-09-01 (plan FULLY_COMMITTED, committed == total)"
