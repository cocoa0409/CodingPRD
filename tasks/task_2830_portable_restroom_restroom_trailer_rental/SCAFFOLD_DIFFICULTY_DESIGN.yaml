              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-08-03", deploy_to: "2026-08-10" }
              as: DispatchPlanner
              captures: { d1_id: $.data.id, d1_state: $.data.state }
          trigger:
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-08-10", deploy_to: "2026-08-17" }
              as: DispatchPlanner
              captures: { touch_after_error: $.data.error_id }
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-07-27", deploy_to: "2026-08-03" }
              as: DispatchPlanner
              captures: { touch_before_error: $.data.error_id }
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-08-11", deploy_to: "2026-08-17" }
              as: DispatchPlanner
              captures: { gap_after_id: $.data.id, gap_after_state: $.data.state }
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-07-27", deploy_to: "2026-08-02" }
              as: DispatchPlanner
              captures: { gap_before_id: $.data.id, gap_before_state: $.data.state }
          assert:
            - "${d1_state} == RESERVED for 2026-08-03..2026-08-10"
            - "TOUCH AFTER — ${touch_after_error} == ERR_UNIT_DOUBLE_BOOKED with HTTP 409: 2026-08-10 <= 2026-08-10, so back-to-back booking on the incumbent's last day conflicts"
            - "TOUCH BEFORE — ${touch_before_error} == ERR_UNIT_DOUBLE_BOOKED: 2026-08-03 <= 2026-08-03 on the other end"
            - "ONE DAY AFTER — ${gap_after_state} == RESERVED: 2026-08-11 <= 2026-08-10 is false, and there is NO buffer, so a single day of clearance suffices"
            - "ONE DAY BEFORE — ${gap_before_state} == RESERVED: 2026-08-03 <= 2026-08-02 is false"
            - "No 20-day (or any) buffer is applied here — ${gap_after_id} starts the very next calendar day after d1 ends and is accepted, unlike the 20-minute buffer on route windows"
            - "GET /unit-deployments?asset_unit_id=${asset_id} returns total_count 3 — d1, ${gap_after_id} and ${gap_before_id}"
            - "All three surviving rows are in state RESERVED, which together with DEPLOYED is the whole candidate set of priority 58"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: waiving_the_missed_service_credit_restores_the_account_credit_balance_exactly
        grounds:
          - state_machines.ChargeEvent.ASSESSED_to_WAIVED
          - calculations.account_open_credit_balance
          - entities.RentalAccount.fields.open_credit_balance_cents
          - entities.RentalAccount.fields.billing_hold
          - entities.RentalContract.fields.credit_accrued_cents
          - entities.RentalContract.fields.net_billable_cents
          - validations[priority=7]
        distinguishing_aspect: |
          Conserved quantity: MONEY — RentalAccount.open_credit_balance_cents (and the contract's
          credit_accrued_cents / net_billable_cents that feed it). The forward action is a missed
          visit that mints a 62413 credit; the compensating action is the waive of exactly that
          charge. The post-waive values must equal the pre-missed values to the cent, and
          billing_hold must fall back with them. What is deliberately NOT conserved is
          RentalContract.billing_state, which stays REBILL_REQUIRED as an audit trace.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, permitted OPEN site, MON route capacity 20."
            - "CONSTRUCTION contract 60 / freq 2 / ada true, quoted 181500, activated, invoiced to 199197 (billing_state INVOICED)."
            - "One ACTIVE schedule (13 units, density_planned_pct 65) and one PLANNED visit on 2026-08-10."
            - "Balances are read BEFORE the forward action so the compensation can be checked against them."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Meridian Infrastructure", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Meridian Segment 7", jurisdiction_code: "AZ-MA-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-8701", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-8701" }
              as: ComplianceOfficer
            - call: "POST /routes"
              payload: { route_code: "RT-MON-26", service_day: "MON", truck_capacity_units: 20, waste_capacity_gallons: 3000 }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 60, event_duration_hours: 8, service_frequency_per_week: 2, season_code: "SHOULDER", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
            - call: "POST /rental-contracts/${contract_id}/invoice"
              payload: {}
              as: SalesRep
              captures: { subtotal: $.data.invoice_subtotal_cents, bs_pre: $.data.billing_state, net_pre: $.data.net_billable_cents, credit_pre: $.data.credit_accrued_cents }
            - call: "GET /rental-accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { balance_pre: $.data.open_credit_balance_cents, hold_pre: $.data.billing_hold }
            - call: "POST /service-schedules"
              payload: { contract_id: "${contract_id}", route_id: "${route_id}", service_day: "MON", window_start_minute: 480, window_end_minute: 600 }
              as: DispatchPlanner
              captures: { schedule_id: $.data.id }
            - call: "POST /service-visits"
              payload: { schedule_id: "${schedule_id}", visit_kind: "SERVICE", scheduled_date: "2026-08-10", window_start_minute: 480, window_end_minute: 540 }
              as: DispatchPlanner
              captures: { visit_id: $.data.id }
            - call: "POST /service-visits/${visit_id}/mark-missed"
              payload: { missed_reason: "driver rerouted to a spill response" }
              as: DispatchPlanner
              as_user_id: "planner-1"
              captures: { visit_state_mid: $.data.state }
            - call: "GET /charge-events?contract_id=${contract_id}&charge_kind=MISSED_SERVICE_CREDIT"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { credit_id: "$.data[0].id", credit_amount_mid: "$.data[0].amount_cents", credit_actor: "$.data[0].assessed_by_user_id" }
            - call: "GET /rental-accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { balance_mid: $.data.open_credit_balance_cents, hold_mid: $.data.billing_hold }
          trigger:
            - call: "POST /charge-events/${credit_id}/waive"
              payload: { resolution_note: "service was covered by the neighbouring route, credit withdrawn" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { charge_state_post: $.data.state, charge_amount_post: $.data.amount_cents, resolver: $.data.resolved_by_user_id }
            - call: "GET /rental-accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { balance_post: $.data.open_credit_balance_cents, hold_post: $.data.billing_hold }
            - call: "GET /rental-contracts/${contract_id}"
              payload: {}
              as: SalesRep
              captures: { credit_post: $.data.credit_accrued_cents, net_post: $.data.net_billable_cents, bs_post: $.data.billing_state }
            - call: "GET /service-visits/${visit_id}"
              payload: {}
              as: DispatchPlanner
              captures: { visit_state_post: $.data.state }
          assert:
            - "PRE — ${subtotal} == 199197, ${bs_pre} == INVOICED, ${net_pre} == 199197, ${credit_pre} == 0, ${balance_pre} == 0, ${hold_pre} == false"
            - "FORWARD — ${visit_state_mid} == MISSED, ${credit_amount_mid} == 62413, ${credit_actor} == SYSTEM, ${balance_mid} == 62413, ${hold_mid} == true"
            - "COMPENSATION — ${charge_state_post} == WAIVED and ${resolver} == officer-2 (priority 7 is satisfied because assessed_by_user_id is SYSTEM)"
            - "CONSERVED — ${balance_post} == ${balance_pre} == 0, exactly, with no residue"
            - "CONSERVED — ${hold_post} == ${hold_pre} == false"
            - "CONSERVED — ${credit_post} == ${credit_pre} == 0 and ${net_post} == ${net_pre} == 199197"
            - "AMOUNT PRESERVED — ${charge_amount_post} == 62413: the waive removes the charge from the input set, it does NOT zero the recorded amount"
            - "NOT CONSERVED (deliberately) — ${bs_post} == REBILL_REQUIRED, not INVOICED: the billing flag is an audit trace, not a conserved quantity"
            - "NOT CONSERVED (deliberately) — ${visit_state_post} == MISSED: waiving the credit does not un-miss the service"
            - "Route.${route_id}.density_planned_pct is still 65 and density_realized_pct is still 0 — the compensation touches money only"

      - name: waiving_a_damage_charge_restores_the_asset_strike_count_exactly
        grounds:
          - state_machines.ChargeEvent.ASSESSED_to_WAIVED
          - calculations.damage_tip_over_charge
          - entities.AssetUnit.fields.damage_strikes
          - entities.AssetUnit.fields.tip_over_count
          - entities.AssetUnit.fields.status
          - entities.RentalContract.fields.charge_debits_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity type: a PHYSICAL STRIKE COUNTER
          (AssetUnit.damage_strikes + tip_over_count), not money. Restoration is proved
          constructively rather than by reading the counter back: a third identical DAMAGE charge is
          assessed after the waive and must price at the 100 percent strike multiplier (24000). An
          implementation that decrements the ledger but leaves the strike history at 2 prices it at
          150 percent (36000), so the invariant cannot be faked.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, permitted OPEN site with max_truck_length_ft 40."
            - "One STANDARD_PORTABLE asset (DAMAGE_BASE_CENTS 32000), tare 8 ft, deployed and ACTIVE so its status is DEPLOYED."
            - "CONSTRUCTION contract 40 / freq 3 / no ada, quoted 91500, one deployment, activated."
            - "Two DAMAGE / MODERATE charges are assessed by officer-1: ch1 at prior_strikes 0 and ch2 at prior_strikes 1, both 32000 * 75 percent * 100 percent = 24000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Fairhaven Renovations", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Fairhaven Annex", jurisdiction_code: "MA-SU-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-8801", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-8801" }
              as: ComplianceOfficer
            - call: "POST /asset-units"
              payload: { asset_tag: "SP-777", unit_class: "STANDARD_PORTABLE", yard_code: "YD-1", tare_length_ft: 8 }
              as: PlatformAdmin
              captures: { asset_id: $.data.id, strikes_pre: $.data.damage_strikes, tipovers_pre: $.data.tip_over_count }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 40, event_duration_hours: 8, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "SITEWORK", ada_required: false }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-08-03", deploy_to: "2026-09-30" }
              as: DispatchPlanner
              captures: { dep_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
            - call: "GET /asset-units/${asset_id}"
              payload: {}
              as: PlatformAdmin
              captures: { status_pre: $.data.status }
            - call: "POST /charge-events"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", charge_kind: "DAMAGE", severity: "MODERATE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ch1_id: $.data.id, ch1_amount: $.data.amount_cents, ch1_assessor: $.data.assessed_by_user_id }
            - call: "POST /charge-events"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", charge_kind: "DAMAGE", severity: "MODERATE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ch2_id: $.data.id, ch2_amount: $.data.amount_cents }
            - call: "GET /asset-units/${asset_id}"
              payload: {}
              as: PlatformAdmin
              captures: { strikes_mid: $.data.damage_strikes, status_mid: $.data.status }
            - call: "GET /rental-contracts/${contract_id}"
              payload: {}
              as: SalesRep
              captures: { debits_mid: $.data.charge_debits_cents }
          trigger:
            - call: "POST /charge-events/${ch2_id}/waive"
              payload: { resolution_note: "damage traced to a third-party contractor, not the renter" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { ch2_state_post: $.data.state, ch2_amount_post: $.data.amount_cents, ch2_resolver: $.data.resolved_by_user_id }
            - call: "GET /asset-units/${asset_id}"
              payload: {}
              as: PlatformAdmin
              captures: { strikes_post: $.data.damage_strikes, tipovers_post: $.data.tip_over_count, status_post: $.data.status }
            - call: "GET /rental-contracts/${contract_id}"
              payload: {}
              as: SalesRep
              captures: { debits_post: $.data.charge_debits_cents }
            - call: "POST /charge-events"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", charge_kind: "DAMAGE", severity: "MODERATE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ch3_id: $.data.id, ch3_amount: $.data.amount_cents }
          assert:
            - "PRE — ${strikes_pre} == 0, ${tipovers_pre} == 0, ${status_pre} == DEPLOYED"
            - "FORWARD — ${ch1_amount} == 24000 and ${ch2_amount} == 24000 (prior_strikes 0 then 1, both at strike_mult_pct 100), ${ch1_assessor} == officer-1"
            - "FORWARD — ${strikes_mid} == 2, ${status_mid} == DEPLOYED (2 < UNIT_REPAIR_STRIKE_THRESHOLD 3), ${debits_mid} == 48000"
            - "COMPENSATION — ${ch2_state_post} == WAIVED, ${ch2_resolver} == officer-2 (priority 7 forbids officer-1 from resolving its own charge)"
            - "CONSERVED — ${strikes_post} == 1 and ${tipovers_post} == 0: the waived charge left the ASSESSED/UPHELD counting set entirely"
            - "CONSERVED — ${debits_post} == 24000, exactly ch1's amount"
            - "${status_post} == DEPLOYED — the status write only fires when the sum crosses 3, so nothing moved here"
            - "AMOUNT PRESERVED — ${ch2_amount_post} == 24000"
            - "CONSTRUCTIVE PROOF — ${ch3_amount} == 24000, priced at strike_mult_pct 100 from prior_strikes 1; a drifted counter of 2 would have produced 36000 and a counter of 3+ would have produced 48000"
            - "After ch3 the unit has damage_strikes 2 and is still DEPLOYED; RentalContract.${contract_id}.charge_debits_cents == 48000 again"
