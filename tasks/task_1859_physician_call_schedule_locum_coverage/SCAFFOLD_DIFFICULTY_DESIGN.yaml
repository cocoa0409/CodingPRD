            - "hop 1: CallAssignment.${a_id}.status == CANCELLED (captured ${a_status})"
            - "hop 2: CallSlot.${slot_0909}.status == OPEN (captured ${slot_status})"
            - "hop 2: a CoverageGap with reason == ASSIGNMENT_CANCELLED and status == OPEN exists for the slot (captured ${gap_reason}, ${gap_status})"
            - "hop 2: CallProgram.payroll_reserved_cents == 0 (captured ${reserved}; 50000 released)"

