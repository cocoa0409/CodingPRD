            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-10", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
