scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_licensee_returns_201_with_defaults
        claim_type: creation
        grounds: ['entities.Licensee', 'endpoints.POST /licensing/licensees']
        distinguishing_aspect: "POST with all required fields returns 201, a UUID id, version 1, and ISO-8601 created_at."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-C1" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id, ver: $.data.version } }
          assert:
            - "HTTP 201; response envelope has meta.api_request_id, response_type == \"object\""
            - "Licensee.${lic_id}.name == \"LC\" and ver == 1"
      - name: create_licensee_missing_legal_entity_code_returns_400
        claim_type: required_fields
        grounds: ['entities.Licensee.fields.legal_entity_code', 'errors[ERR_INVALID_REQUEST']
        distinguishing_aspect: "Omitting a required input field yields ERR_INVALID_REQUEST 400 before any existence or state check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensing/licensees", payload: { name: "LC" }, as: BrandProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_INVALID_REQUEST\" with HTTP 400"
      - name: get_licensee_not_found_returns_404
        claim_type: not_found
        grounds: ['errors[ERR_NOT_FOUND]', 'validations[priority=5']
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /licensing/licensees/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: BrandProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_NOT_FOUND\" with HTTP 404"
      - name: licensee_list_pagination_defaults
        claim_type: listing
        grounds: ['response_envelope', 'endpoints.GET /licensing/licensees']
        distinguishing_aspect: "List endpoint honors pagination defaults limit=10/offset=0 and returns total_count plus has_more."
        test_recipe:
          setup: ["three licensees exist"]
          setup_api_calls:
            - { call: "POST /licensing/licensees", payload: { name: "L1", legal_entity_code: "LE-P1" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "L2", legal_entity_code: "LE-P2" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "L3", legal_entity_code: "LE-P3" }, as: BrandProgramAdmin }
          trigger:
            - { call: "GET /licensing/licensees", payload: {}, as: BrandProgramAdmin,  }
          assert:
            - "response envelope for the list has response_type == \"array\" and data.total_count == 3, data.has_more == false, limit == 10, offset == 0 (asserted structurally, no capture needed)"
      - name: distributor_approved_defaults_false
        claim_type: defaults
        grounds: ['entities.Distributor.fields.approved']
        distinguishing_aspect: "Omitting approval at creation leaves approved == false, which later gates order submission."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensing/distributors", payload: { name: "D1", lead_time_days: 2 }, as: BrandProgramAdmin, captures: { dist_id: $.data.id, appr: $.data.approved } }
          assert:
            - "appr == false"
      - name: net_sales_cents_computed_not_client_supplied
        claim_type: computed_fields
        grounds: ['entities.SalesReport.fields.net_sales_cents']
        distinguishing_aspect: "Client-supplied net_sales_cents in the create body is ignored; after finalize the field equals gross - returns - loyalty_redemption exactly."
        test_recipe:
          setup:
            - "OPERATING store (minimal two-cert fixture)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-C2" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_id}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
          trigger:
            - { call: "POST /licensing/stores/${store_id}/sales-reports", payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-14", gross_sales_cents: 1000, returns_cents: 100, loyalty_redemption_cents: 50 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { rep_id: $.data.id } }
            - { call: "POST /licensing/sales-reports/${rep_id}/finalize", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
          assert:
            - "SalesReport.${rep_id}.net_sales_cents == 850 (1000 - 100 - 50) and status == FINALIZED"
      - name: venue_type_enum_rejects_invalid_value
        claim_type: type_constraints
        grounds: ['entities.HostVenue.fields.venue_type', 'errors[ERR_INVALID_REQUEST']
        distinguishing_aspect: "venue_type outside {GROCERY, AIRPORT, CAMPUS, HOSPITAL} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "MALL", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_INVALID_REQUEST\" with HTTP 400"
      - name: supply_order_line_immutable_no_version
        claim_type: immutability
        grounds: ['entities.SupplyOrderLine']
        distinguishing_aspect: "SupplyOrderLine has common_fields false: its read exposes id and created_at but no version field."
        test_recipe:
          setup:
            - "OPERATING store with assorted product, approved distributor, and one DRAFT order"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-C3" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_id}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/product-items", payload: { sku: "SKU-1", name: "P1", category: "FOOD", proprietary: false, venue_type_restrictions: [], unit_cost_cents: 500, case_pack_units: 1, footprint_units: 0 }, as: BrandProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /licensing/stores/${store_id}/assortment-items", payload: { product_item_id: "${p1}", par_level: 50 }, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/distributors", payload: { name: "D1", lead_time_days: 2 }, as: BrandProgramAdmin, captures: { dist_id: $.data.id } }
            - { call: "POST /licensing/stores/${store_id}/supply-orders", payload: { distributor_id: "${dist_id}", auto_replenish: false, lines: [ { product_item_id: "${p1}", quantity: 10 } ] }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { order_id: $.data.id } }
          trigger:
            - { call: "GET /licensing/supply-order-lines", payload: { supply_order_id: "${order_id}" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { line_id: "$.data[0].id" } }
          assert:
            - "line row exposes id, created_at, quantity_ordered == 10, unit_cost_cents == 500, line_cost_cents == 5000"
            - "line row has no version field (common_fields: false)"
      - name: store_creation_requires_active_agreement
        claim_type: parent_relationships
        grounds: ['entities.LicensedStore.fields.agreement_id', 'errors[ERR_AGREEMENT_NOT_ACTIVE']
        distinguishing_aspect: "Creating a store under a DRAFT agreement fails with ERR_AGREEMENT_NOT_ACTIVE; the parent must be ACTIVE."
        test_recipe:
          setup: ["licensee, venue, and an agreement still in DRAFT"]
          setup_api_calls:
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-C4" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_AGREEMENT_NOT_ACTIVE\" with HTTP 409"

  # ===========================================================================
  # State machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: agreement_created_in_draft
        claim_type: initial_state
        grounds: ['state_machines.LicenseAgreement']
        distinguishing_aspect: "A newly created agreement has status DRAFT and breach_strikes 0."
        test_recipe:
          setup: ["licensee and venue exist"]
          setup_api_calls:
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-S1" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
          assert:
            - "LicenseAgreement.${agr_id}.status == \"DRAFT\" and breach_strikes == 0 and version == 1"
      - name: terminated_agreement_locks_all_transitions
        claim_type: terminal_state_lockdown
        grounds: ['state_machines.LicenseAgreement', 'errors[ERR_INVALID_AGREEMENT_STATE']
        distinguishing_aspect: "From terminal TERMINATED, suspend/reinstate/terminate/submit all fail with ERR_INVALID_AGREEMENT_STATE."
        test_recipe:
          setup: ["agreement driven ACTIVE then TERMINATED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-S2" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/terminate", payload: {}, as: BrandProgramAdmin }
          trigger:
            - { call: "POST /licensing/license-agreements/${agr_id}/reinstate", payload: {}, as: BrandProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_INVALID_AGREEMENT_STATE\" with HTTP 409"
            - "LicenseAgreement.${agr_id}.status == \"TERMINATED\""
      - name: agreement_suspend_reinstate_cycle_resets_strikes
        claim_type: valid_transition
        grounds: ['state_machines.LicenseAgreement.SUSPENDED_to_ACTIVE']
        distinguishing_aspect: "The ACTIVE->SUSPENDED->ACTIVE cycle is legal and reinstate resets breach_strikes to 0 while stores stay SUSPENDED."
        test_recipe:
          setup: ["ACTIVE agreement with one OPERATING store, suspended manually"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-S3" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_id}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/suspend", payload: {}, as: BrandProgramAdmin }
          trigger:
            - { call: "POST /licensing/license-agreements/${agr_id}/reinstate", payload: {}, as: BrandProgramAdmin }
          assert:
            - "LicenseAgreement.${agr_id}.status == \"ACTIVE\" and breach_strikes == 0"
            - "LicensedStore.${store_id}.operating_status == \"SUSPENDED\" (stores do NOT auto-resume)"
      - name: order_idempotent_second_submit_rejected
        claim_type: idempotency
        grounds: ['state_machines.SupplyOrder.DRAFT_to_SUBMITTED', 'errors[ERR_INVALID_ORDER_STATE']
        distinguishing_aspect: "Repeating the submit trigger after success fails with ERR_INVALID_ORDER_STATE because the order is no longer DRAFT."
        test_recipe:
          setup: ["OPERATING store, assorted product, approved distributor, one SUBMITTED order"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-S4" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
