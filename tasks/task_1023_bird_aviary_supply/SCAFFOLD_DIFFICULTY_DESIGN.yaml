          assert:
            - "response data.error_id == ERR_SPECIES_RESTRICTED"
            - "Bird.${bird_id}.status == CLEARED (unchanged)"

      - name: boarding_checkin_depends_on_cage_capacity
        grounds:
          - state_machines.BoardingReservation.RESERVED_to_CHECKED_IN
          - entities.CageUnit.fields.current_occupancy
          - entities.CageUnit.fields.status
          - validations[priority=12]
        distinguishing_aspect: |
          A reservation cannot move RESERVED->CHECKED_IN while its CageUnit is at capacity (occupancy==capacity, status OCCUPIED);
          check-in returns ERR_NO_BOARDING_CAPACITY. The dependency crosses the BoardingReservation->CageUnit pair (distinct from Bird->Species).
        test_recipe:
          setup:
            - "One capacity-1 BOARDING cage; R1 (07-03..07-05) checked in (cage OCCUPIED); R2 (07-06..07-08) still RESERVED; clock 07-06."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cap Full", email: "cap@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
