            - "compensation is exact: unbilled_wip == 3389.85 again, billed_open == 0.00, paid_gross_to_date == 0.00, written_off_gross == 0.00, total_charge_value == 3389.85"
            - "TimeEntry.${te_a} and ${te_b} are APPROVED with billed_invoice_id null; ExpenseItem.${ex_id}.billing_status == UNBILLED with billed_invoice_id null"
            - "GET /time-entries filtered by billed_invoice_id ${inv_1} returns total_count 0, and so does GET /expenses — no dangling back-references survive"
            - "no drift in earned value: Phase.${ph_id}.actual_labor_cost_to_date == 1084.38, effort_based_percent_complete == 0.0181 and recognized_earned_value == 3620.00 both before and after the void"
            - "Invoice.${inv_2} reproduces the money exactly: gross_billed == 3389.85, retainage_amount == 169.49, net_due == 3220.36, revision_round == 0, swept_labor_count == 2, swept_expense_count == 1"
            - "Project.${p_id}.net_multiplier_achieved == 3.0500 at every step (the void must not disturb the labor ratio)"

      - name: payable_rejection_restores_commitment_and_markup_base
        grounds:
          - state_machines.ConsultantInvoice.APPROVED_to_REJECTED
          - calculations.subcontract_commitment_rollup
