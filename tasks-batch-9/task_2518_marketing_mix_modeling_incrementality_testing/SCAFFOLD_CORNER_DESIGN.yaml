          Sealing a complete elapsed window moves it OPEN -> SEALED and bumps its version, but does NOT
          by itself lift the market out of RESTRICTED, because the posture formula's second branch also
          requires a PUBLISHED ModelRun; an implementation that flips the posture to OPEN on seal alone
          fails the last assert.
          
