              payload: { loop_id: "${loop_t_id}", rate_schedule_id: "${rs_t1_id}", customer_name: "Threshold Offices One", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 100.0, service_mode: "HEATING", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ct1_id: $.data.id, ct1_billing_new: $.data.billing_state }
            - call: "POST /district-energy/connection-agreements/${ct1_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_t_id}", rate_schedule_id: "${rs_t2_id}", customer_name: "Threshold Offices Two", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 100.0, service_mode: "HEATING", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
