  - rule_id: priority_pair_validation_conflict
    instances:
      - name: resubmit_state_error_wins_over_pro_forma_capital_insufficiency
        pair: "priority 10 (state) versus priority 36 (business_fiscal)"
        grounds:
          - validations[priority 10].ERR_INVALID_APPLICATION_STATE
          - validations[priority 36].ERR_PRO_FORMA_CAPITAL_INSUFFICIENT
          - calculations.pro_forma_capital_ratios
        distinguishing_aspect: |
          The request violates both rules at once: the application is already SUBMITTED so no submit
          transition is declared from that state (priority 10, category state, 409), and its CURRENT
          REGULATORY_ADJUSTED schedule is now UNDERCAPITALIZED at cet1 0.28 / leverage 0.61 (priority 36,
          category business_fiscal, 422). The response must be ERR_INVALID_APPLICATION_STATE with HTTP 409;
          returning the 422 would prove the fiscal gate is evaluated before the state gate.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an application whose first REGULATORY_ADJUSTED schedule is WELL_CAPITALIZED, used to reach SUBMITTED"
            - "a second REGULATORY_ADJUSTED schedule filed with goodwill 180,000,000, CDI 30,000,000, DTA 40,000,000, transaction costs 8,000,000 and cash 60,000,000, which supersedes the first and is UNDERCAPITALIZED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
