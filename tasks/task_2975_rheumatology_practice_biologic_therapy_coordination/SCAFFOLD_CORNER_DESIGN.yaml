              as: Patient
              as_user_id: "${pat_id}"
              captures: { err_403: $.data.error_id }
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegistryAdmin
              captures: { err_404: $.data.error_id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Clone One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
