              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_found_id: $.data.id }
            - call: "POST /engineering-reports/${er_id}/submit"
              payload: {}
              as: LicensedEngineer
              as_user_id: "eng-1"
            - call: "POST /major-components/${mc_found_id}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /engineering-reports/${er_id}/peer-review-decisions"
              payload: { decision: "ACCEPT", reviewed_by_user_id: "peer-1" }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "GET /engineering-reports/${er_id}"
              payload: {}
              as: ConverterSponsor
              captures: { er_v: $.data.version }
            - call: "POST /engineering-reports/${er_id}/suitability-assessments"
              payload: { variant: "AS_INSPECTED", expected_engineering_report_version: "${er_v}" }
              as: ConverterSponsor
            - call: "POST /conversion-projects/${proj_id}/declaration-packages"
              payload: { declaration_text_ref: "s3://decl/lintel.pdf", bylaws_text_ref: "s3://bylaws/lintel.pdf", boundary_convention: "STUD_TO_STUD" }
              as: ConverterSponsor
              captures: { dp_id: $.data.id }
            - call: "POST /declaration-packages/${dp_id}/units"
              payload: { unit_number: "L-1", floor_level: 1, heated_square_feet: 1000, boundary_note: "stud faces", base_percentage_interest_bp: 3333 }
              as: ConverterSponsor
              captures: { u1_id: $.data.id }
            - call: "POST /declaration-packages/${dp_id}/units"
              payload: { unit_number: "L-2", floor_level: 2, heated_square_feet: 1000, boundary_note: "stud faces", base_percentage_interest_bp: 3333 }
              as: ConverterSponsor
              captures: { u2_id: $.data.id }
            - call: "POST /declaration-packages/${dp_id}/units"
              payload: { unit_number: "L-3", floor_level: 3, heated_square_feet: 1010, boundary_note: "stud faces", base_percentage_interest_bp: 3334 }
              as: ConverterSponsor
