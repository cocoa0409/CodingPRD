# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3059_instant_claim_automation_charitable_giveback_allocation
#
# Depth probe: 9 Difficulty Rules x 3 instances each = 27 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and carries a fully
# structured, replayable test_recipe. All monetary values are integer cents;
# all formula-derived assert literals were pre-computed by executing the
# §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fee_split_absolute_vs_pct_variants_diverge_on_identical_charge
        grounds:
          - calculations.fee_split_on_premium_charge
          - entities.RateFiling.fields.filing_mode
          - entities.FeeConfig.fields.flat_fee_cents
          - entities.FeeConfig.fields.flat_fee_pct
        distinguishing_aspect: |
          The two fee variants live on the PremiumCharge domain: an
          ABSOLUTE_CENTS filing yields fee = min(flat_fee_cents, charge) while a
          PCT_OF_PREMIUM filing yields fee = round_half_up(charge * flat_fee_pct);
          the identical 100000-cent charge produces 25000 vs 20000 cents of fee
          and therefore different claims pots (75000 vs 80000).
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Cause C1; cohort 2026 OPEN."
            - "State TX: APPROVED filing mode ABSOLUTE_CENTS cap 25000; ACTIVE FeeConfig flat_fee_cents=25000."
            - "State CA: APPROVED filing mode PCT_OF_PREMIUM pct 0.25; ACTIVE FeeConfig flat_fee_pct=0.20."
            - "Policyholder TX with clean application (0 signals) bound to a TX policy, annual premium 100000."
            - "Policyholder CA with clean application bound to a CA policy, annual premium 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /causes"
              payload: { name: "Clean Water Fund" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 25000, filing_mode: "ABSOLUTE_CENTS" }
              as: UnderwritingAdmin
              captures: { filing_tx: $.data.id }
            - call: "POST /rate-filings/${filing_tx}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing_tx}", flat_fee_pct: 0.30, flat_fee_cents: 25000 }
              as: UnderwritingAdmin
              captures: { fc_tx: $.data.id }
            - call: "POST /fee-configs/${fc_tx}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /rate-filings"
              payload: { state_code: "CA", max_flat_fee_pct: 0.25, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing_ca: $.data.id }
            - call: "POST /rate-filings/${filing_ca}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "CA", filing_id: "${filing_ca}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc_ca: $.data.id }
            - call: "POST /fee-configs/${fc_ca}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "tx@x.com", full_name: "T Ex", state_code: "TX" }
              as: Anonymous
              captures: { ph_tx: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 500000, premium_cents: 100000 }
              as: Policyholder
              as_user_id: "${ph_tx}"
              captures: { q_tx: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q_tx}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph_tx}"
              captures: { app_tx: $.data.id }
            - call: "POST /applications/${app_tx}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol_tx: $.data.id }
            - call: "POST /policyholders"
              payload: { email: "ca@x.com", full_name: "C Ay", state_code: "CA" }
              as: Anonymous
              captures: { ph_ca: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 500000, premium_cents: 100000 }
              as: Policyholder
              as_user_id: "${ph_ca}"
              captures: { q_ca: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q_ca}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph_ca}"
              captures: { app_ca: $.data.id }
            - call: "POST /applications/${app_ca}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol_ca: $.data.id }
          trigger:
            - call: "POST /policies/${pol_tx}/premium-payments"
              payload: { amount_cents: 100000 }
              as: FinanceOps
            - call: "POST /policies/${pol_ca}/premium-payments"
              payload: { amount_cents: 100000 }
              as: FinanceOps
          assert:
            - "GET /policies/${pol_tx}/ledger contains FEE_RETAINED entry with amount_cents == 25000 (min(25000, 100000))"
            - "GET /policies/${pol_ca}/ledger contains FEE_RETAINED entry with amount_cents == 20000 (round_half_up(100000 * 0.20))"
            - "Cohort.${cohort_id}.fee_retained_cents == 45000"
            - "Cohort.${cohort_id}.claims_pot_cents == 155000 (75000 + 80000; no treaty attached)"
            - "Policy.${pol_tx}.premium_outstanding_cents == 0 and Policy.${pol_ca}.premium_outstanding_cents == 0"

      - name: giveback_actual_vs_projected_variants_diverge_with_open_reserve
        grounds:
          - calculations.retained_claims_and_giveback
          - entities.Cohort.fields.giveback_actual_cents
          - entities.Cohort.fields.giveback_projected_cents
        distinguishing_aspect: |
          The two variants live on the Cohort giveback domain (different domain
          from the fee split): the ACTUAL_PAID basis counts only PAID claims
          (giveback 18750) while the PAID_PLUS_RESERVE basis additionally counts
          the ESCALATED claim's retained reserve (giveback 3750) over identical
          cohort state — and the run-giveback endpoint MUST pay out on the
          ACTUAL basis.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Cause C1; cohort 2026 OPEN."
            - "State NY: APPROVED filing ABSOLUTE_CENTS cap 25000; ACTIVE FeeConfig flat_fee_cents=25000."
            - "ACTIVE treaty quota_share_pct=0.75 attached to the cohort."
            - "One NY policyholder, clean application, policy bound with premium 200000; premium fully paid (pot = 200000 - 25000 - 131250 = 43750)."
            - "Claim A (fraud_score 0.10, 100000) escalates via... no — Claim A auto-pays only if <= 250000 and clean; here fraud_score 0.10 < 0.30 and 100000 <= 250000 so Claim A instant-pays (retained 25000). Claim B (fraud_score 0.90, 60000) escalates with reserve 60000 and retroactive reinsurance share 45000 (retained reserve 15000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /causes"
              payload: { name: "Riverkeepers" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /rate-filings"
              payload: { state_code: "NY", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 25000, filing_mode: "ABSOLUTE_CENTS" }
              as: UnderwritingAdmin
              captures: { filing_ny: $.data.id }
            - call: "POST /rate-filings/${filing_ny}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "NY", filing_id: "${filing_ny}", flat_fee_pct: 0.30, flat_fee_cents: 25000 }
              as: UnderwritingAdmin
              captures: { fc_ny: $.data.id }
            - call: "POST /fee-configs/${fc_ny}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /reinsurance-treaties"
              payload: { name: "QS-75", quota_share_pct: 0.75 }
              as: FinanceOps
              captures: { treaty_id: $.data.id }
            - call: "POST /reinsurance-treaties/${treaty_id}/activate"
              payload: {}
              as: FinanceOps
            - call: "POST /cohorts/${cohort_id}/reinsurance"
              payload: { treaty_id: "${treaty_id}" }
              as: FinanceOps
            - call: "POST /policyholders"
              payload: { email: "ny@x.com", full_name: "N Y", state_code: "NY" }
              as: Anonymous
              captures: { ph_ny: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 900000, premium_cents: 200000 }
              as: Policyholder
              as_user_id: "${ph_ny}"
              captures: { q_ny: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q_ny}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph_ny}"
              captures: { app_ny: $.data.id }
            - call: "POST /applications/${app_ny}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol_ny: $.data.id }
            - call: "POST /policies/${pol_ny}/premium-payments"
              payload: { amount_cents: 200000 }
              as: FinanceOps
            - call: "POST /claims"
              payload: { policy_id: "${pol_ny}", video_statement_ref: "vid-A", claimed_amount_cents: 100000, fraud_score: 0.10 }
              as: Policyholder
              as_user_id: "${ph_ny}"
              captures: { claim_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_ny}", video_statement_ref: "vid-B", claimed_amount_cents: 60000, fraud_score: 0.90 }
              as: Policyholder
              as_user_id: "${ph_ny}"
              captures: { claim_b: $.data.id }
          trigger:
            - call: "GET /cohorts/${cohort_id}"
              payload: {}
              as: FinanceOps
          assert:
            - "Claim.${claim_a}.status == PAID and Claim.${claim_a}.reinsurance_share_cents == 75000"
            - "Claim.${claim_b}.status == ESCALATED and Claim.${claim_b}.reserve_cents == 60000 and Claim.${claim_b}.reinsurance_share_cents == 45000 (reserve cession recomputed on the attached treaty)"
            - "Cohort.${cohort_id}.claims_pot_cents == 43750"
            - "Cohort.${cohort_id}.retained_claims_actual_cents == 25000"
            - "Cohort.${cohort_id}.retained_claims_reserved_cents == 40000"
            - "Cohort.${cohort_id}.giveback_actual_cents == 18750"
            - "Cohort.${cohort_id}.giveback_projected_cents == 3750"

      - name: giveback_run_pays_actual_basis_not_projected_basis
        grounds:
          - calculations.retained_claims_and_giveback
          - calculations.giveback_allocation
          - state_machines.Cohort.CLOSED_to_DONATED
        distinguishing_aspect: |
          Variant SELECTION claim (same Cohort giveback domain, distinct testable
          behavior): the annual giveback run over the identical cohort state (an
          ESCALATED claim with retained reserve 15000 still open) donates
          giveback_total_cents == 18750 (ACTUAL_PAID basis), NOT the 3750 the
          projected basis shows — proving the run pins the actual variant.
        test_recipe:
          setup:
            - "Identical cohort state to giveback_actual_vs_projected_variants_diverge_with_open_reserve (pot 43750; claim A PAID retained 25000; claim B ESCALATED retained reserve 15000)."
            - "Cohort closed via POST /cohorts/{id}/close."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /causes"
              payload: { name: "Riverkeepers" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /rate-filings"
              payload: { state_code: "NY", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 25000, filing_mode: "ABSOLUTE_CENTS" }
              as: UnderwritingAdmin
              captures: { filing_ny: $.data.id }
            - call: "POST /rate-filings/${filing_ny}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "NY", filing_id: "${filing_ny}", flat_fee_pct: 0.30, flat_fee_cents: 25000 }
              as: UnderwritingAdmin
              captures: { fc_ny: $.data.id }
            - call: "POST /fee-configs/${fc_ny}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /reinsurance-treaties"
              payload: { name: "QS-75", quota_share_pct: 0.75 }
              as: FinanceOps
              captures: { treaty_id: $.data.id }
            - call: "POST /reinsurance-treaties/${treaty_id}/activate"
              payload: {}
              as: FinanceOps
            - call: "POST /cohorts/${cohort_id}/reinsurance"
              payload: { treaty_id: "${treaty_id}" }
              as: FinanceOps
            - call: "POST /policyholders"
              payload: { email: "ny@x.com", full_name: "N Y", state_code: "NY" }
              as: Anonymous
              captures: { ph_ny: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 900000, premium_cents: 200000 }
              as: Policyholder
              as_user_id: "${ph_ny}"
              captures: { q_ny: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q_ny}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph_ny}"
              captures: { app_ny: $.data.id }
            - call: "POST /applications/${app_ny}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol_ny: $.data.id }
            - call: "POST /policies/${pol_ny}/premium-payments"
              payload: { amount_cents: 200000 }
              as: FinanceOps
            - call: "POST /claims"
              payload: { policy_id: "${pol_ny}", video_statement_ref: "vid-A", claimed_amount_cents: 100000, fraud_score: 0.10 }
              as: Policyholder
              as_user_id: "${ph_ny}"
            - call: "POST /claims"
              payload: { policy_id: "${pol_ny}", video_statement_ref: "vid-B", claimed_amount_cents: 60000, fraud_score: 0.90 }
              as: Policyholder
              as_user_id: "${ph_ny}"
            - call: "POST /cohorts/${cohort_id}/close"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /cohorts/${cohort_id}/run-giveback"
              payload: {}
              as: FinanceOps
              captures: { giveback_total: $.data.giveback_total_cents }
          assert:
            - "giveback_total == 18750 (ACTUAL_PAID basis: pot 43750 - retained actual 25000; the 15000 open reserve is NOT deducted)"
            - "Cohort.${cohort_id}.status == DONATED"
            - "Cohort.${cohort_id}.giveback_projected_cents == 3750 (projection field is NOT the basis the run used)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fee_split_nested_conditional_min_fee_cap_branch
        grounds:
          - calculations.fee_split_on_premium_charge
        distinguishing_aspect: |
          Mode (a) — non-linear interaction of >= 3 inputs: the fee under an
          ABSOLUTE_CENTS filing is min(flat_fee_cents, charge), so a 10000-cent
          charge against a 25000-cent cap takes the charge branch
          (fee == 10000 == the whole charge, pot 0) while a 100000-cent charge
          takes the cap branch (fee == 25000); the branch taken depends jointly
          on filing_mode, flat_fee_cents, and the charge amount.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Cause; cohort 2026 OPEN."
            - "State TX: APPROVED ABSOLUTE_CENTS filing cap 25000; ACTIVE FeeConfig flat_fee_cents=25000."
            - "Two TX policyholders with clean applications bound to policies; policy SMALL premium 10000, policy BIG premium 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 25000, filing_mode: "ABSOLUTE_CENTS" }
              as: UnderwritingAdmin
              captures: { filing_tx: $.data.id }
            - call: "POST /rate-filings/${filing_tx}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing_tx}", flat_fee_pct: 0.30, flat_fee_cents: 25000 }
              as: UnderwritingAdmin
              captures: { fc_tx: $.data.id }
            - call: "POST /fee-configs/${fc_tx}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "s@x.com", full_name: "Small", state_code: "TX" }
              as: Anonymous
              captures: { ph_s: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 50000, premium_cents: 10000 }
              as: Policyholder
              as_user_id: "${ph_s}"
              captures: { q_s: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q_s}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph_s}"
              captures: { app_s: $.data.id }
            - call: "POST /applications/${app_s}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol_s: $.data.id }
            - call: "POST /policyholders"
              payload: { email: "b@x.com", full_name: "Big", state_code: "TX" }
              as: Anonymous
              captures: { ph_b: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 900000, premium_cents: 100000 }
              as: Policyholder
              as_user_id: "${ph_b}"
              captures: { q_b: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q_b}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph_b}"
              captures: { app_b: $.data.id }
            - call: "POST /applications/${app_b}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol_b: $.data.id }
          trigger:
            - call: "POST /policies/${pol_s}/premium-payments"
              payload: { amount_cents: 10000 }
              as: FinanceOps
            - call: "POST /policies/${pol_b}/premium-payments"
              payload: { amount_cents: 100000 }
              as: FinanceOps
          assert:
            - "Policy.${pol_s} ledger FEE_RETAINED amount_cents == 10000 (charge branch: min(25000, 10000))"
            - "Policy.${pol_s} ledger REINSURANCE_CEDED absent (amount 0) and pot increment for the small policy == 0"
            - "Policy.${pol_b} ledger FEE_RETAINED amount_cents == 25000 (cap branch: min(25000, 100000))"
            - "Cohort.${cohort_id}.claims_pot_cents == 75000 (0 + 75000)"

      - name: fee_split_per_component_rounding_order_pinned
        grounds:
          - calculations.fee_split_on_premium_charge
          - calculations.retained_claims_and_giveback
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (distinct from mode (a)):
          with flat_fee_pct 0.25 and quota_share 0.75, a 9999-cent charge must
          round fee first (round_half_up(2499.75) == 2500), then cede on the
          POST-FEE remainder (round_half_up(7499 * 0.75) == 5624), leaving pot
          1875 — sum-then-round or cede-on-gross orders yield different cents.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Cause; cohort 2026 OPEN."
            - "State WA: APPROVED PCT_OF_PREMIUM filing pct cap 0.30; ACTIVE FeeConfig flat_fee_pct=0.25."
            - "ACTIVE treaty quota_share_pct=0.75 attached to the cohort."
            - "One WA policyholder, clean application, policy bound with premium 9999."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /rate-filings"
              payload: { state_code: "WA", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 50000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing_wa: $.data.id }
            - call: "POST /rate-filings/${filing_wa}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "WA", filing_id: "${filing_wa}", flat_fee_pct: 0.25, flat_fee_cents: 50000 }
              as: UnderwritingAdmin
              captures: { fc_wa: $.data.id }
            - call: "POST /fee-configs/${fc_wa}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /reinsurance-treaties"
              payload: { name: "QS-75", quota_share_pct: 0.75 }
              as: FinanceOps
              captures: { treaty_id: $.data.id }
            - call: "POST /reinsurance-treaties/${treaty_id}/activate"
              payload: {}
              as: FinanceOps
            - call: "POST /cohorts/${cohort_id}/reinsurance"
              payload: { treaty_id: "${treaty_id}" }
              as: FinanceOps
            - call: "POST /policyholders"
              payload: { email: "wa@x.com", full_name: "W A", state_code: "WA" }
              as: Anonymous
              captures: { ph_wa: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 50000, premium_cents: 9999 }
              as: Policyholder
              as_user_id: "${ph_wa}"
              captures: { q_wa: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q_wa}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph_wa}"
              captures: { app_wa: $.data.id }
            - call: "POST /applications/${app_wa}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol_wa: $.data.id }
          trigger:
            - call: "POST /policies/${pol_wa}/premium-payments"
              payload: { amount_cents: 9999 }
              as: FinanceOps
          assert:
            - "Policy.${pol_wa} ledger PREMIUM_CHARGE amount_cents == 9999"
            - "Policy.${pol_wa} ledger FEE_RETAINED amount_cents == 2500 (round_half_up(9999 * 0.25))"
            - "Policy.${pol_wa} ledger REINSURANCE_CEDED amount_cents == 5624 (round_half_up((9999 - 2500) * 0.75))"
