  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_approve
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REGULATORY_GATE]
        distinguishing_aspect: |
          Pair (state, business_safety): approving a request still in DRAFT
          violates both priority-5 state (DRAFT cannot transition to APPROVED)
          and priority-8 regulatory gating (no exams passed, no cleared
          fingerprint) — the state error MUST win per the declared ordering.
        test_recipe:
          setup:
            - "Firm, applicant, request in DRAFT with one CA STATE selection; no fingerprint, no exams passed"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1501", legal_name: "Prio Firm S" }
              as: SystemOperator
              captures: { firm_ps_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2501", full_name: "Prio Rep S", date_of_birth: "1989-09-09" }
              as: RegistrationPrincipal
              captures: { app_ps_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_ps_id}", firm_id: "${firm_ps_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_ps_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_ps_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
          trigger:
            - call: "POST /registration-desk/registration-requests/${req_ps_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-prio-s"
              captures: { err_ps: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 — priority-5 state check beats the priority-8 regulatory gate that would also fail"

      - name: state_vs_temporal_on_termination_filing
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TEMPORAL_VIOLATION]
        distinguishing_aspect: |
          Pair (state, business_temporal) — different category pair from
          instance 1: filing a U5 with a FUTURE termination_date (2026-12-31
          against clock 2026-06-15) on a request that is merely SUBMITTED (not
          ACTIVE) violates both priority-5 state and priority-10 temporal; the
          state error MUST win, pinning state < temporal in the precedence chain.
        test_recipe:
          setup:
            - "Firm, applicant; request submitted (status SUBMITTED); clock 2026-06-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1502", legal_name: "Prio Firm T" }
              as: SystemOperator
              captures: { firm_pt_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2502", full_name: "Prio Rep T", date_of_birth: "1990-10-10" }
              as: RegistrationPrincipal
              captures: { app_pt_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_pt_id}", firm_id: "${firm_pt_id}", registration_category: "IA" }
              as: RegistrationPrincipal
              captures: { req_pt_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_pt_id}", jurisdiction_code: "WA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/registration-requests/${req_pt_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              as_user_id: "rp-prio-t"
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /registration-desk/termination-filings"
              payload: { registration_request_id: "${req_pt_id}", termination_reason: "VOLUNTARY", termination_date: "2026-12-31" }
              as: RegistrationPrincipal
              captures: { err_pt: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 — priority-5 (request not ACTIVE) beats priority-10 (future-dated termination_date) even though both fail"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: exam_credit_expires_at_exact_second
        grounds:
          - calculations.exam_credit_window
          - state_machines.ExamRequirement.PASSED_to_EXPIRED
        distinguishing_aspect: |
          Metric: timestamp equality with second precision. The credit is
          expired AT exactly credit_expiry_at (>=, not >): one second before
          leaves PASSED; the exact expiry second flips EXPIRED.
        test_recipe:
          setup:
            - "Firm, applicant, request in DRAFT; SIE requirement PASSed at 2026-06-01T10:00:00Z => credit_expiry_at 2026-09-29T10:00:00Z"
