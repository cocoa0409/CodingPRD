              payload: { name: "P-CE1", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-CE1-1", full_name: "Cross One" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-CE1-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Device.${dev_id}.status == ENROLLED"

      - name: alert_resolve_blocked_by_open_review_task
        grounds:
          - state_machines.ThresholdAlert.ACKNOWLEDGED_to_RESOLVED
          - entities.ReviewTask.fields.status
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair ThresholdAlert -> ReviewTask (different from Device->Patient): an alert in
          ACKNOWLEDGED cannot transition to RESOLVED while its linked ReviewTask is IN_REVIEW; resolve
          returns ERR_OPEN_REVIEW_TASK. The ACKNOWLEDGED-with-open-task state is reached by escalating
          (spawns QUEUED task) then claiming the task (which reverts the alert to ACKNOWLEDGED but leaves
          the task IN_REVIEW).
        test_recipe:
          setup:
            - "A CRITICAL alert escalated (spawning a ReviewTask), then the task is claimed which reverts the alert to ACKNOWLEDGED while the task stays IN_REVIEW (open)."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-CE2", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-CE2-1", full_name: "Cross Two" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "RPM", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-CE2-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/vitals"
              payload: { device_id: "${dev_id}", reading_value: 205, secondary_value: 130, measured_at: "2026-06-10T08:00:00Z" }
              as: Clinician
              captures: { vr_id: $.data.id }
            - call: "GET /alerts"
              payload: {}
              as: Clinician
              captures: { alert_id: "$.data[0].id" }
            - call: "POST /alerts/${alert_id}/escalate"
              payload: {}
              as: Clinician
              as_user_id: "clin-x"
            - call: "GET /review-tasks"
              payload: {}
              as: Physician
              captures: { rt_id: "$.data[0].id" }
            - call: "POST /review-tasks/${rt_id}/claim"
              payload: {}
              as: Physician
              as_user_id: "phys-Z"
          trigger:
            - call: "POST /alerts/${alert_id}/resolve"
              payload: {}
              as: Clinician
              as_user_id: "clin-x"
              captures: { err: $.data.error_id }
          assert:
            - "ThresholdAlert.${alert_id}.status == ACKNOWLEDGED (reverted on claim) before the resolve attempt"
            - "ReviewTask.${rt_id}.status == IN_REVIEW"
            - "response status == 409"
            - "data.error_id == ERR_OPEN_REVIEW_TASK"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_billing_period_same_month_rejected
        grounds:
          - validations[priority=15]
          - entities.BillingPeriod.fields.period_year
          - entities.BillingPeriod.fields.period_month
          - errors[ERR_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: identical-calendar-month collision on the BillingPeriod resource — a second
          OPEN period for the same patient on (2026, 6) collides with the existing one (same half-open
          month interval) and is rejected with ERR_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "A patient already has an OPEN BillingPeriod for 2026-06."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-OV1", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-OV1-1", full_name: "Over One" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/billing-periods"
              payload: { period_year: 2026, period_month: 6 }
              as: BillingSpecialist
              captures: { bp_id: $.data.id }
          trigger:
            - call: "POST /patients/${pid}/billing-periods"
              payload: { period_year: 2026, period_month: 6 }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PERIOD_OVERLAP"

      - name: billing_consent_gap_when_consent_starts_mid_month
        grounds:
          - validations[priority=19]
          - entities.ConsentRecord.fields.effective_at
          - errors[ERR_BILLING_CONSENT_GAP]
        distinguishing_aspect: |
          Different interval semantics (containment-coverage, not exact-month collision) on the
          ConsentRecord resource: the ACTIVE consent interval [effective_at, revoked_at) must fully
          contain the billing month; an effective_at of 2026-06-15 leaves the first half of June
          uncovered, so claim submission for a consent-required payer fails with ERR_BILLING_CONSENT_GAP.
        test_recipe:
          setup:
            - "Consent-required payer; consent effective only from 2026-06-15 (mid-month); period 2026-06 finalized with eligible 99457."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-OV2", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877, requires_active_consent: true }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-OV2-1", full_name: "Over Two" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "BOTH", effective_at: "2026-06-15T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/billing-periods"
              payload: { period_year: 2026, period_month: 6 }
              as: BillingSpecialist
              captures: { bp_id: $.data.id }
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-OV2-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-activities"
              payload: { billing_period_id: "${bp_id}", clinician_user_id: "clin-5", activity_type: "REVIEW", minutes: 20, performed_at: "2026-06-16T10:00:00Z" }
              as: Clinician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingSpecialist
              captures: { bp_v: $.data.version }
            - call: "POST /billing-periods/${bp_id}/finalize"
              payload: { expected_billing_period_version: "${bp_v}" }
              as: BillingSpecialist
          trigger:
            - call: "POST /billing-periods/${bp_id}/claims"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_BILLING_CONSENT_GAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reopen_voids_line_items_conserving_period_charge_total
        grounds:
          - state_machines.BillingPeriod.OPEN_to_FINALIZED
          - state_machines.BillingPeriod.FINALIZED_to_REOPENED
          - entities.BillingLineItem.fields.amount_cents
          - entities.BillingLineItem.fields.status
        distinguishing_aspect: |
          Conserved quantity = sum of non-VOIDED BillingLineItem.amount_cents for the period. Finalize
          accrues line items summing to 6842; reopen (the compensating action) voids them all so the
          non-VOIDED charge total returns to 0 — no residual charge drift remains after forward+compensate.
        test_recipe:
          setup:
            - "A FINALIZED period with finalized_total_cents == 6842 (99453+99457), no live claim."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-CI1", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877, requires_active_consent: false }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-CI1-1", full_name: "Comp One" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "BOTH", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/billing-periods"
              payload: { period_year: 2026, period_month: 6 }
              as: BillingSpecialist
              captures: { bp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-CI1-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-activities"
              payload: { billing_period_id: "${bp_id}", clinician_user_id: "clin-6", activity_type: "REVIEW", minutes: 20, performed_at: "2026-06-03T10:00:00Z" }
              as: Clinician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingSpecialist
              captures: { bp_v: $.data.version }
            - call: "POST /billing-periods/${bp_id}/finalize"
              payload: { expected_billing_period_version: "${bp_v}" }
              as: BillingSpecialist
              captures: { fin_cents: $.data.finalized_total_cents }
          trigger:
            - call: "POST /billing-periods/${bp_id}/reopen"
              payload: {}
              as: BillingSpecialist
          assert:
            - "before reopen: BillingPeriod.${bp_id}.finalized_total_cents == 6842 and sum of non-VOIDED BillingLineItem.amount_cents for ${bp_id} == 6842"
            - "after reopen: BillingPeriod.${bp_id}.status == REOPENED and finalized_total_cents == null"
            - "after reopen: every BillingLineItem for ${bp_id} has status == VOIDED; sum of non-VOIDED amount_cents == 0"

      - name: device_return_conserves_monitoring_count_invariant
        grounds:
          - state_machines.Device.ENROLLED_to_ACTIVE
          - state_machines.Device.ACTIVE_to_RETURNED
          - entities.Patient.fields.monitoring_status
        distinguishing_aspect: |
          A different conserved quantity (device-monitoring count/flag, not money): the invariant
          monitoring_status == MONITORING iff count of ACTIVE devices > 0. Activating the only device
          (forward) flips monitoring to MONITORING; returning it (compensating) flips it back to PAUSED,
          leaving the count==0 / flag-consistent invariant intact with no drift.
        test_recipe:
          setup:
            - "Patient ENROLLED with exactly one ACTIVE device and monitoring_status == MONITORING."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-CI2", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-CI2-1", full_name: "Comp Two" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "RPM", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-CI2-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
          trigger:
            - call: "POST /patients/${pid}/devices/${dev_id}/return"
              payload: {}
              as: CareCoordinator
          assert:
            - "before return: Patient.${pid}.monitoring_status == MONITORING (one ACTIVE device)"
            - "after return: Device.${dev_id}.status == RETURNED"
            - "after return: Patient.${pid}.monitoring_status == PAUSED (zero ACTIVE devices)"
