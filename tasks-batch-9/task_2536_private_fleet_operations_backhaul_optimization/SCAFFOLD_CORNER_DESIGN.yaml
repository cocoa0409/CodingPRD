              payload: { asset_kind: "TRACTOR", tractor_id: "${tractor_id}", service_type: "PM_A", window_start_at: "2026-08-06T08:00:00Z", window_end_at: "2026-08-06T16:00:00Z" }
              as: MaintenanceCoordinator
              captures: { pm_id: $.data.id }
          trigger:
            - call: "POST /fleet/maintenance-work-orders/${insp_id}/start"
              payload: {}
              as: MaintenanceCoordinator
              captures: { insp_started: $.data.status }
            - call: "GET /fleet/tractors/${tractor_id}"
              payload: {}
              as: MaintenanceCoordinator
              captures: { mid_status: $.data.status }
            - call: "POST /fleet/maintenance-work-orders/${insp_id}/complete"
              payload: {}
              as: MaintenanceCoordinator
              captures: { insp_done: $.data.status }
            - call: "GET /fleet/tractors/${tractor_id}"
              payload: {}
              as: MaintenanceCoordinator
              captures: { after_insp_status: $.data.status, after_insp_since: $.data.miles_since_pm, after_insp_last: $.data.pm_last_service_odometer }
            - call: "POST /fleet/maintenance-work-orders/${pm_id}/start"
              payload: {}
              as: MaintenanceCoordinator
            - call: "POST /fleet/maintenance-work-orders/${pm_id}/complete"
              payload: {}
              as: MaintenanceCoordinator
              captures: { pm_done: $.data.status }
            - call: "GET /fleet/tractors/${tractor_id}"
              payload: {}
              as: MaintenanceCoordinator
              captures: { after_pm_status: $.data.status, after_pm_since: $.data.miles_since_pm, after_pm_last: $.data.pm_last_service_odometer, after_pm_hold: $.data.pm_hold, after_pm_odo: $.data.odometer_miles }
          assert:
            - "at creation ${t_since} == 10000 (50000 - 40000), ${t_hold} == false, ${t_status} == AVAILABLE, ${insp_status} == SCHEDULED, ${insp_auto} == false, ${insp_deferrals} == 0"
            - "${insp_started} == IN_SHOP and ${mid_status} == IN_SHOP - the work order drives the asset"
            - "${insp_done} == COMPLETED, ${after_insp_status} == AVAILABLE, and ${after_insp_since} == 10000 with ${after_insp_last} == 40000 - INSPECTION does not touch the PM counters"
            - "${pm_done} == COMPLETED, ${after_pm_status} == AVAILABLE, ${after_pm_odo} == 50000"
            - "${after_pm_since} == 0, ${after_pm_last} == 50000 and ${after_pm_hold} == false - only PM_A/PM_B rewrite the counters"

      - name: plan_demands_staffing_before_it_looks_at_stops
        claim_type: Precondition Enforcement
        grounds:
          - state_machines[Trip.plan_status].transitions[DRAFT->PLANNED].preconditions
          - errors.ERR_TRIP_NOT_STAFFED
          - errors.ERR_TRIP_HAS_NO_STOPS
        distinguishing_aspect: "The DRAFT->PLANNED precondition list is ordered, and staffing sits above the stop-count check. A trip that is both unstaffed and stopless reports ERR_TRIP_NOT_STAFFED; only after the three FKs are filled does the same call fall through to ERR_TRIP_HAS_NO_STOPS."
