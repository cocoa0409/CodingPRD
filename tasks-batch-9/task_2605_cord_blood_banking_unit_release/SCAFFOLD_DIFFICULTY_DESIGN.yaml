            - call: "POST /cbb/processing-runs/${run_f5_id}/complete"
              payload: { outcome: "COMPLETED", post_volume_ml: 25.0, post_tnc_millions: 1000 }
              as: ProcessingTechnologist
            - call: "POST /cbb/quality-tests"
              payload: { unit_id: "${unit_f5_id}", test_kind: "POST_PROCESSING", tnc_millions: 1000, cd34_thousands: 2400, viability_pct: 88.0, volume_ml: 25.0, sterility_result: "NEGATIVE" }
