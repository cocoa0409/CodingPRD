  # =========================================================================
  - section: calculations
    instances:

      - name: nondiscrimination_regime_matrix_across_employer_and_plan_type
        claim_type: correct_result
        grounds:
          - calculations.nondiscrimination_regime
          - entities.Plan.fields.nondiscrimination_regime
          - entities.Plan.fields.is_governmental_457
        distinguishing_aspect: "All five declared regime values are produced: PUBLIC_SCHOOL 403(b) gives UA_ONLY, TAX_EXEMPT_501C3 403(b) gives UA_PLUS_410B_401A4, PUBLIC_SCHOOL 457(b) gives GOVERNMENTAL_457_ALL_EMPLOYEES, TAX_EXEMPT_501C3 457(b) gives TOP_HAT_457, and a CHURCH sponsor gives CHURCH_EXEMPT."
        test_recipe:
          setup:
            - "Three sponsors: PUBLIC_SCHOOL/SCHOOL, TAX_EXEMPT_501C3/OTHER and CHURCH/CHURCH_ORG."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { gov_id: $.data.id }
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Lakeside Community Trust", ein: "33-3333333", entity_type: "TAX_EXEMPT_501C3", organization_subtype: "OTHER", total_employee_count: 300 }
              as: SystemOperator
              captures: { nq_id: $.data.id }
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Grace Assembly", ein: "55-5555555", entity_type: "CHURCH", organization_subtype: "CHURCH_ORG", total_employee_count: 40 }
              as: SystemOperator
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${gov_id}", plan_name: "Gov 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${gov_id}"
              captures: { g403_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${nq_id}", plan_name: "NP 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 120 }
              as: PlanSponsorAdmin
              as_user_id: "${nq_id}"
              captures: { n403_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${gov_id}", plan_name: "Gov 457(b)", plan_type: "PLAN_457B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${gov_id}"
              captures: { g457_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${nq_id}", plan_name: "NP 457(b)", plan_type: "PLAN_457B", plan_year: 2026, reported_participant_count: 40 }
              as: PlanSponsorAdmin
              as_user_id: "${nq_id}"
              captures: { n457_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${ch_id}", plan_name: "Church 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 40 }
              as: PlanSponsorAdmin
              as_user_id: "${ch_id}"
              captures: { c403_id: $.data.id }
          assert:
            - "Plan.${g403_id}.nondiscrimination_regime == UA_ONLY and is_governmental_457 == false"
            - "Plan.${n403_id}.nondiscrimination_regime == UA_PLUS_410B_401A4"
            - "Plan.${g457_id}.nondiscrimination_regime == GOVERNMENTAL_457_ALL_EMPLOYEES and is_governmental_457 == true"
            - "Plan.${n457_id}.nondiscrimination_regime == TOP_HAT_457 and is_governmental_457 == false"
            - "Plan.${c403_id}.nondiscrimination_regime == CHURCH_EXEMPT"
            - "Plan.${n457_id}.is_small_plan == true because reported_participant_count 40 is below 100"
            - "Plan.${g403_id}.is_small_plan == false"

      - name: catchup_457b_uses_greater_of_final_three_year_and_age_fifty
        claim_type: correct_result
        grounds:
          - calculations.catchup_capacity_457b
          - entities.Participant.fields.underutilized_prior_limit_cents
          - endpoints[GET /plan-admin/participants/{id}/contribution-limit-summary]
        distinguishing_aspect: "In a governmental 457(b), a participant aged 63 with 1000000 cents of underutilized prior limit has final_3yr capacity 1000000 and age-50 capacity 800000, and usable_catchup_capacity_cents is the GREATER of the two (1000000), never their sum of 1800000."
        test_recipe:
          setup:
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_457B plan, so is_governmental_457 is true."
            - "One participant born 1963-01-01 (attained_age_at_year_end 63, inside the final-three-year window) with underutilized_prior_limit_cents 1000000."
            - "One contract under the plan with no year-to-date deferrals."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Northline Annuity", vendor_code: "NLA", contact_email: "ops@northline.example" }
              as: SystemOperator
              captures: { v1_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 457(b)", plan_type: "PLAN_457B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p457_id: $.data.id }
            - call: "POST /plan-admin/plans/${p457_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Fern Vela", date_of_birth: "1963-01-01", hire_date: "2000-01-01", scheduled_hours_per_week: 40, prior_year_hours_worked: 2000, includible_compensation_cents: 9000000, years_of_service: 26, underutilized_prior_limit_cents: 1000000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pf_id: $.data.id }
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pf_id}", plan_id: "${p457_id}", vendor_id: "${v1_id}", contract_number: "NLA-F001", accumulated_benefit_cents: 2000000, vested_percentage_bps: 10000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /plan-admin/participants/${pf_id}/contribution-limit-summary"
              payload: { plan_id: "${p457_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "bucket_plan_type == PLAN_457B and basic_limit_cents == 2450000"
            - "final_3yr_catchup_capacity_cents == 1000000"
            - "age50_catchup_capacity_cents == 800000"
            - "usable_catchup_capacity_cents == 1000000"
            - "total_limit_cents == 3450000, not 4250000"
            - "service_15yr_catchup_capacity_cents == 0 because the 15-year rule is 403(b)-only"
            - "room_gross_cents == 3450000 and ytd_gross_cents == 0"

      - name: final_three_year_window_excludes_normal_retirement_age
        claim_type: precision
        grounds:
          - calculations.catchup_capacity_457b
          - entities.Participant.fields.attained_age_at_year_end
        distinguishing_aspect: "The final-three-year window is exactly ages 62, 63 and 64: a participant who attains 65 in the plan year has final_3yr_catchup_capacity_cents 0 and falls back on the 800000-cent age-50 capacity, giving total_limit_cents 3250000."
        test_recipe:
          setup:
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_457B plan."
            - "Two participants with identical underutilized_prior_limit_cents 1000000, one born 1962-01-01 (age 64) and one born 1961-01-01 (age 65)."
            - "Each holds one contract under the plan."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Northline Annuity", vendor_code: "NLA", contact_email: "ops@northline.example" }
              as: SystemOperator
