            - "the 13 captured ids are pairwise distinct"

      - name: interchange_capture_business_guards_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_17_ERR_CAR_BAD_ORDER_NOT_INTERCHANGEABLE
          - validations.priority_18_ERR_RAILROAD_SUSPENDED
          - validations.priority_19_ERR_JUNCTION_CLOSED
          - validations.priority_22_ERR_ROADS_NOT_CONNECTED_AT_JUNCTION
          - validations.priority_23_ERR_DELIVERING_ROAD_NOT_IN_CUSTODY
          - validations.priority_30_ERR_EVENT_IN_FUTURE
          - validations.priority_32_ERR_EVENT_OUT_OF_SEQUENCE
        distinguishing_aspect: "One capture endpoint is gated by six independent cross-entity or temporal facts — the receiving road's status, the junction's status, the junction's road pair, the car's current holder, the clock, and the car's own last event — and each produces its own error id from otherwise identical bodies. NS is registered SUSPENDED and still appears as a junction road, because priority 18 enumerates the delivering, receiving, payer, payee, owner and acting roads and never the roads of a junction registration."
        test_recipe:
          setup:
            - "Railroads BN and CX (ACTIVE) and NS (created SUSPENDED); car type XM; junction JCT-CHI (CX, BN) OPEN; junction JCT-STL (CX, BN) created CLOSED; junction JCT-KC (BN, NS) OPEN; CX-owned car CX 100001 delivered to BN at 2026-08-24T00:00:00Z; the clock reads 2026-08-28T00:00:00Z."
          setup_api_calls:
