  # ================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_ledger_conservation_payment_refund
        grounds:
          - entities.FeeInvoice.fields.assessed_amount_cents
          - entities.FeeInvoice.fields.outstanding_amount_cents
          - state_machines.PermitApplication.DRAFT_to_WITHDRAWN
          - entities.Payment.fields.payment_type
        distinguishing_aspect: |
          Conserved quantity = money: assessed_amount_cents == outstanding_amount_cents +
          paid_amount_cents - refunded_amount_cents at all times. Paying 51454 then withdrawing
          (which refunds the full net) restores outstanding to the assessed 51454 and net collected to 0.
        test_recipe:
          setup:
            - "1 COLLOCATION node app submitted (assessed 51454) and fully paid (51454)."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Rho Wireless", contact_email: "r@rho.example" }
              as: PlatformAdmin
