      - name: one_certification_fans_out_across_four_dependent_entities
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ConsequenceAssessment.DRAFT_to_CERTIFIED
          - calculations.hazard_classification
          - state_machines.EmergencyActionPlan.APPROVED_to_REVISION_REQUIRED
        distinguishing_aspect: |
          Certification is the single deepest write in the domain: it supersedes the prior
          assessment, reclassifies the dam, reschedules its inspection, forces the approved plan back
          to REVISION_REQUIRED and opens a system deficiency, all in one request.
        excluded_because:
          difficulty_instance: certification_supersedes_reclassifies_revises_plan_and_opens_deficiency
          rationale: |
            The §1.8 transitive_cascade instance already drives exactly this chain end to end - the
            SIGNIFICANT-to-HIGH recertification with the SUPERSEDED predecessor, the recomputed
            due date, the plan knocked out of APPROVED and the SYSTEM_RECLASSIFICATION deficiency
            with its incremented open_deficiency_count. Restating it here as a corner case would
            duplicate that test rather than probe an untested edge, so this section only records the
            coverage.

