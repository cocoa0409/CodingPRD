        claim_type: Cross-entity validation
        grounds:
          - validations[priority=59]
          - state_machines.TrailerModel.certification_status
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / jig_reservation_blocked_until_model_reaches_certified
          rationale: "That instance runs the identical reservation request before and after certification, changing only the model state."
