              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: false, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/cancel.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-cancel-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { acct_v_cn: $.data.version }
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}", subject_agent_id: "${agt_id}", restore_point_in_utc: "2026-09-03T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 10.0, restore_transaction_count: 0, expected_account_version: "${acct_v_cn}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { rr_cn_id: $.data.id }
            - call: "POST /backup-provider/restore-requests/${rr_cn_id}/validate"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /backup-provider/restore-requests/${rr_cn_id}/begin"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /backup-provider/restore-requests/${rr_cn_id}/prepare"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /backup-provider/restore-requests/${rr_cn_id}/cancel"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the cancel returns 409 and error_id == ERR_INVALID_STATE"
            - "RestoreRequest.${rr_cn_id}.state == READY"
            - "Account.${acct_id}.restore_download_gb == 0.0 (the refused cancel accrued nothing)"

  # ===========================================================================
  - section: errors
    instances:

      - name: complete_initial_with_no_live_version_returns_initial_backup_empty
        claim_type: Error Trigger
        grounds:
          - errors.ERR_INITIAL_BACKUP_EMPTY
          - state_machines.BackupSet.INITIAL_RUNNING_to_ACTIVE
          - entities.FileVersion.fields.operation
        distinguishing_aspect: "A set whose only version is a DELETE has nothing to promote: complete-initial is refused with 409 ERR_INITIAL_BACKUP_EMPTY and the set stays INITIAL_RUNNING with is_initial_flush true."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. PERSONAL account with a set whose single recorded version is a DELETE."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/ghost.bin", version_number: 1, operation: "DELETE", size_bytes: 0, content_hash: "sha256-ghost-del", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
              captures: { ghost_set_state: $.data.backup_set_id }
          trigger:
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
              captures: { error_id: $.data.error_id }
          assert:
            - "the complete-initial returns 409 and error_id == ERR_INITIAL_BACKUP_EMPTY"
            - "BackupSet.${set_id}.state == INITIAL_RUNNING and is_initial_flush == true"
            - "Agent.${agt_id}.in_throttle_window == true"

      - name: retention_floor_error_is_covered_by_the_boundary_instance
        claim_type: Error Trigger
        grounds:
          - errors.ERR_RETENTION_BELOW_POLICY_FLOOR
          - validations[priority=5]
        excluded_because:
          difficulty_instance: boundary_precision_check / retention_window_at_policy_floor_exactly
          rationale: "The 59-day-under-a-60-day-floor rejection is asserted as the failure path of the named §1.8 instance."

      - name: cooling_off_error_is_covered_by_the_overlap_instance
        claim_type: Error Trigger
        grounds:
          - errors.ERR_COOLING_OFF_ACTIVE
          - state_machines.RetentionChangeRequest.COOLING_OFF_to_APPLIED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / retention_cooling_off_window_blocks_early_apply
          rationale: "The one-second-before-the-window apply rejection is asserted as the failure path of the named §1.8 instance."

      - name: closure_sets_error_is_covered_by_the_cross_entity_instance
        claim_type: Error Trigger
        grounds:
          - errors.ERR_CLOSURE_SETS_REMAIN
          - state_machines.Account.ACTIVE_to_CLOSED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / account_closure_requires_every_set_deleted
          rationale: "The closure blocked by a surviving set is asserted as the failure path of the named §1.8 instance."

      - name: mfa_required_error_is_covered_by_the_priority_instance
        claim_type: Error Trigger
        grounds:
          - errors.ERR_MFA_REQUIRED
          - entities.GroupPolicy.fields.require_mfa_for_restore
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / restore_validate_conflicts_mfa_before_capacity
          rationale: "The MFA-without-ticket rejection is asserted as the failure path of the named §1.8 instance."

      - name: drive_capacity_error_is_covered_by_the_boundary_instance
        claim_type: Error Trigger
        grounds:
          - errors.ERR_DRIVE_CAPACITY_EXCEEDED
          - entities.RestoreRequest.fields.requested_size_gb
        excluded_because:
          difficulty_instance: boundary_precision_check / drive_capacity_exactly_equal_at_begin
          rationale: "The 51 GB-onto-a-50 GB-drive rejection is asserted as the failure path of the named §1.8 instance."

  # ===========================================================================
  - section: rbac
    instances:

      - name: backup_operator_cannot_create_restore_request
        claim_type: Unauthorized
        grounds:
          - roles.BackupOperator.exclusive_operations
          - roles.AccountOwner.exclusive_operations
          - endpoints.POST_/backup-provider/restore-requests
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Restore creation is reserved to AccountOwner: the same payload and the same account sent as BackupOperator is refused at the authorization layer with 403 ERR_UNAUTHORIZED, and no RestoreRequest row appears."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. PERSONAL account with an ACTIVE set holding a 10 GB file."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/rbac.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-rbac-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { acct_v_rb: $.data.version }
          trigger:
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}", subject_agent_id: "${agt_id}", restore_point_in_utc: "2026-09-02T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 10.0, restore_transaction_count: 0, requester_mfa_ticket: "mfa-ticket-rb1", expected_account_version: "${acct_v_rb}" }
              as: BackupOperator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "GET /backup-provider/restore-requests?account_id=${acct_id} returns 0 rows"

      - name: request_missing_role_header_returns_user_context_error
        claim_type: Unauthorized
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
          - endpoints.GET_/backup-provider/accounts/{id}
        distinguishing_aspect: "A read with no X-User-Role at all is refused at the authentication layer with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, distinct from the 403 an authenticated but unpermitted role receives."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One account exists."
          setup_api_calls:
            - *clk
            - *acct
          trigger:
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "error_id != ERR_UNAUTHORIZED"

      - name: retention_officer_cannot_close_a_billing_period
        claim_type: Role Isolation
        grounds:
          - roles.SystemOperator.exclusive_operations
          - roles.RetentionOfficer.exclusive_operations
          - endpoints.POST_/backup-provider/billing-periods/{id}/close
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The two operator roles do not overlap: closing a billing period is exclusive to SystemOperator, so the identical call as RetentionOfficer is refused with 403 and the period stays OPEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. PERSONAL account with an OPEN billing period."
          setup_api_calls:
            - *clk
            - *acct
            - call: "POST /backup-provider/billing-periods"
              payload: { account_id: "${acct_id}", period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z", restore_active_days: 0 }
              as: SystemOperator
              captures: { bp_iso_id: $.data.id }
          trigger:
            - call: "POST /backup-provider/billing-periods/${bp_iso_id}/close"
              payload: {}
              as: RetentionOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "BillingPeriod.${bp_iso_id}.state == OPEN"

      - name: account_owner_cannot_read_another_accounts_restore_requests
        claim_type: Ownership
        grounds:
          - roles.AccountOwner.identity
          - endpoints.GET_/backup-provider/restore-requests
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "AccountOwner is entity_backed:Account, so X-User-ID must equal the account id. An owner whose X-User-ID is a different account is refused with 403 even though the query names the target account explicitly."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. Two PERSONAL accounts exist; the first has one restore request."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - call: "POST /backup-provider/backup-groups/${grp_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: false, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/own.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-own-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "POST /backup-provider/accounts"
              payload: { name: "Other Owner", account_type: "PERSONAL", region: "US_EAST", storage_tier: "BASIC", encryption_key_id: "aes-256-key-other", usage_gb: 0 }
              as: SystemOperator
              captures: { other_acct_id: $.data.id }
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { acct_v_own: $.data.version }
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}", subject_agent_id: "${agt_id}", restore_point_in_utc: "2026-09-02T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 10.0, restore_transaction_count: 0, expected_account_version: "${acct_v_own}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}" }
              as: AccountOwner
              as_user_id: "${other_acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "the same GET with as_user_id ${acct_id} returns 1 row"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: restore_create_with_stale_account_version_is_rejected
        claim_type: Optimistic Concurrency
        grounds:
          - concurrency_rules[restore-request-stale-account]
          - errors.ERR_STALE_VERSION
          - entities.Account.fields.version
        distinguishing_aspect: "Two strictly sequential creates: the first advances Account.version, so the second, still carrying the version the client observed before the first, is refused with 412 ERR_STALE_VERSION — no overlapping requests are involved."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. PERSONAL account with an ACTIVE set holding a 10 GB file."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - call: "POST /backup-provider/backup-groups/${grp_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: false, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/stale.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-stale-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { acct_v_stale: $.data.version }
          trigger:
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}", subject_agent_id: "${agt_id}", restore_point_in_utc: "2026-09-02T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 10.0, restore_transaction_count: 0, expected_account_version: "${acct_v_stale}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { rr_first_id: $.data.id }
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}", subject_agent_id: "${agt_id}", restore_point_in_utc: "2026-09-02T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 10.0, restore_transaction_count: 0, expected_account_version: "${acct_v_stale}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { stale_error: $.data.error_id }
          assert:
            - "the first create succeeds and RestoreRequest.${rr_first_id}.state == REQUESTED"
            - "the second create returns 412 and ${stale_error} == ERR_STALE_VERSION"
            - "GET /backup-provider/restore-requests?account_id=${acct_id} returns exactly 1 row"

      - name: file_version_list_filters_and_paginates_together
        claim_type: Pagination With Filtering
        grounds:
          - endpoints.GET_/backup-provider/backup-sets/{id}/file-versions
          - response_envelope.pagination_fields
          - entities.FileVersion.fields.operation
        distinguishing_aspect: "Filter and page compose: with three CREATE and two MODIFY versions the operation=CREATE filter narrows to three rows, and limit=2&offset=0 over that filter reports total_count 3 with has_more true."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. PERSONAL account with an ACTIVE set holding five versions: three CREATE and two MODIFY."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/p1.bin", version_number: 1, operation: "CREATE", size_bytes: 1073741824, content_hash: "sha256-p1-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/p2.bin", version_number: 1, operation: "CREATE", size_bytes: 1073741824, content_hash: "sha256-p2-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/p3.bin", version_number: 1, operation: "CREATE", size_bytes: 1073741824, content_hash: "sha256-p3-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/p1.bin", version_number: 2, operation: "MODIFY", size_bytes: 2147483648, content_hash: "sha256-p1-v2", event_utc: "2026-09-02T01:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/p2.bin", version_number: 2, operation: "MODIFY", size_bytes: 2147483648, content_hash: "sha256-p2-v2", event_utc: "2026-09-02T02:00:00Z" }
              as: BackupOperator
          trigger:
            - call: "GET /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { operation: "CREATE", limit: 2, offset: 0 }
              as: BackupOperator
          assert:
            - "the filtered page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /backup-provider/backup-sets/${set_id}/file-versions?operation=CREATE&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /backup-provider/backup-sets/${set_id}/file-versions?operation=MODIFY returns 2 rows"
            - "GET /backup-provider/backup-sets/${set_id}/file-versions with no filter returns 5 rows"

      - name: billable_egress_free_allowance_boundary
        claim_type: Rate Threshold Triggers
        grounds:
          - calculations.billable_egress_gb
          - entities.RestoreRequest.fields.egress_gb
          - endpoints.POST_/backup-provider/restore-requests/{id}/begin
        distinguishing_aspect: "The 1 GB free allowance is consumed inclusively: a 1.0 GB restore is billed 0.0 GB while a 1.01 GB restore is billed 0.01 GB — the boundary sits on the allowance value itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T00:00:00Z. PERSONAL account (PRO tier) with an ACTIVE set holding a 2 GB file, no MFA policy requirement."
          setup_api_calls:
            - *clk
            - *acct
