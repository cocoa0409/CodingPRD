              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/doctor-employments/${emp_id}/accept-offer"
              payload: {}
              as: Dentist
              as_user_id: "${doc_id}"
            - call: "POST /dso/affiliations/${aff_id}/close"
              payload: {}
              as: DsoIntegrationLead
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: DsoFinanceController
            - call: "GET /dso/affiliations/${aff_id}"
              payload: {}
              as: DsoFinanceController
              captures: { aff_v: "$.data.version" }
            - call: "POST /dso/earnout-tranches"
              payload: { affiliation_id: "${aff_id}", period_label: "EO-Y1", measurement_start: "2026-09-01T00:00:00Z", measurement_end: "2027-09-01T00:00:00Z", expected_affiliation_version: "${aff_v}" }
              as: DsoFinanceController
              captures: { tr_id: "$.data.id" }
