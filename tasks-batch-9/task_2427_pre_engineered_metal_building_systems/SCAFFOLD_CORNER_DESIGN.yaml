scaffold_corner_design:
  - section: entities
    instances:
      - name: create_jurisdiction_with_all_required_fields_returns_201
        claim_type: creation
        grounds:
          - entities.Jurisdiction
          - endpoints[POST /jurisdictions]
        distinguishing_aspect: "A jurisdiction created with every required field returns 201 and echoes all ten input fields plus the two computed counters seeded at criteria_revision 1 and authorized_builder_count 0."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z by the startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response_type == object and data.code == TX-HARRIS"
            - "Jurisdiction.${j1_id}.state_code == TX and territory_code == TX-GULF and freight_zone == 3"
            - "Jurisdiction.${j1_id}.exposure_category == C and design_wind_speed_mph == 140 and ground_snow_load_psf == 5"
            - "Jurisdiction.${j1_id}.seismic_design_category == A and max_authorized_builders == 2"
            - "Jurisdiction.${j1_id}.criteria_revision == 1 and authorized_builder_count == 0"
            - "Jurisdiction.${j1_id}.version == 1"

      - name: get_jurisdiction_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /jurisdictions/{id}]
          - entities.Jurisdiction
        distinguishing_aspect: "A read-back of the created jurisdiction returns byte-identical field values and the same id, and does not bump version — a GET is not a mutation."
        test_recipe:
          setup:
            - "One jurisdiction TX-HARRIS exists at version 1."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${j1_id}"
              payload: {}
              as: SalesEngineer
              captures: { read_back_id: $.data.id }
          assert:
            - "HTTP status == 200 and response_type == object"
            - "data.id == ${j1_id}"
            - "data.code == TX-HARRIS and data.design_wind_speed_mph == 140"
            - "data.criteria_revision == 1"
            - "data.version == 1 — the read did not mutate the row"

      - name: list_builders_returns_pagination_envelope_fields
        claim_type: listing
        grounds:
          - endpoints[GET /builders]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The collection read returns limit, offset, total_count and has_more; with three builders and limit 2 the first page reports has_more true and total_count 3 while the second page returns the single remaining row with has_more false."
        test_recipe:
          setup:
            - "One jurisdiction TX-HARRIS and three builders created in a known order."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Alpha Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { ba_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Bravo Builders", tier: "BRONZE", credit_limit_cents: 50000000 }
              as: PlatformAdmin
              captures: { bb_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Charlie Builders", tier: "GOLD", credit_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
          trigger:
            - call: "GET /builders"
              payload: { limit: 2, offset: 0 }
              as: SalesEngineer
            - call: "GET /builders"
              payload: { limit: 2, offset: 2 }
              as: SalesEngineer
            - call: "GET /builders"
              payload: { jurisdiction_id: "${j1_id}" }
              as: SalesEngineer
          assert:
            - "first page: response_type == array, 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "first page rows are ${ba_id} then ${bb_id} in created_at ascending order"
            - "second page: 1 row == ${bc_id}, offset == 2, total_count == 3, has_more == false"
            - "third call omits limit and offset, so limit == 10 and offset == 0 are applied as the pagination defaults and all 3 rows are returned"
            - "every listed row has territory_code == TX-GULF copied from the jurisdiction"

      - name: get_order_with_unknown_id_returns_order_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4, error_id=ERR_ORDER_NOT_FOUND]
          - endpoints[GET /orders/{id}]
        distinguishing_aspect: "A well-formed UUID that matches no Order row yields ERR_ORDER_NOT_FOUND with HTTP 404, not a 200 with an empty body and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database — no Order rows exist."
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProductionPlanner
          assert:
            - "HTTP status == 404"
            - "response_type == error and data.error_id == ERR_ORDER_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: create_builder_without_credit_limit_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3, error_id=ERR_INVALID_REQUEST]
          - endpoints[POST /builders]
          - entities.Builder.fields.credit_limit_cents
        distinguishing_aspect: "credit_limit_cents is declared source: input with no default, so omitting it is a 400 ERR_INVALID_REQUEST rather than a silent 0 credit limit — the difference is observable because a 0 limit would instead surface later as ERR_BUILDER_CREDIT_EXCEEDED."
        test_recipe:
          setup:
            - "One jurisdiction TX-HARRIS exists."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
          trigger:
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "No Credit Builders", tier: "SILVER" }
              as: PlatformAdmin
          assert:
            - "HTTP status == 400 and data.error_id == ERR_INVALID_REQUEST"
            - "no Builder row is persisted"
            - "the error is not ERR_BUILDER_NOT_FOUND and not ERR_BUILDER_CREDIT_EXCEEDED"

      - name: omitted_max_authorized_builders_defaults_to_two
        claim_type: defaults
        grounds:
          - entities.Jurisdiction.fields.max_authorized_builders
          - endpoints[POST /jurisdictions]
        distinguishing_aspect: "max_authorized_builders is optional with default 2, so a jurisdiction created without it behaves exactly like one created with an explicit 2 — the third authorization in the territory is rejected."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "TX-BRAZORIA", name: "Brazoria County TX", state_code: "TX", territory_code: "TX-COAST", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A" }
              as: PlatformAdmin
              captures: { j_def_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Jurisdiction.${j_def_id}.max_authorized_builders == 2"
            - "Jurisdiction.${j_def_id}.criteria_revision == 1 and authorized_builder_count == 0"

      - name: configuration_computed_geometry_is_null_until_lock_then_derived
        claim_type: computed_fields
        grounds:
          - calculations.configuration_geometry_and_loads
          - entities.BuildingConfiguration.fields.building_length_ft
          - entities.BuildingConfiguration.fields.panel_area_sqft
          - entities.BuildingConfiguration.fields.estimated_frame_weight_lbs
        distinguishing_aspect: "The geometry and load fields are source: computed and are produced by the lock transition, not by the create call. Before lock they are null; after lock they equal the derived literals for the reference geometry, and none of them can be supplied by the client because POST /building-configurations does not declare them as inputs."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS with exposure C, 140 mph and 5 psf ground snow; AUTHORIZED SILVER builder."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg_id: $.data.id }
            - call: "POST /building-configurations/${cfg_id}/lock"
              payload: {}
              as: SalesEngineer
          assert:
            - "immediately after create BuildingConfiguration.${cfg_id}.status == DRAFT and building_length_ft, footprint_sqft, panel_area_sqft, design_wind_pressure_psf, dead_load_psf, roof_snow_load_psf and estimated_frame_weight_lbs are all null"
            - "after lock building_length_ft == 100.0 and footprint_sqft == 10000"
            - "after lock roof_slope_factor == 1.0035 and panel_area_sqft == 19635.00"
            - "after lock design_wind_pressure_psf == 48.79"
            - "after lock dead_load_psf == 3.08 and roof_snow_load_psf == 3.50"
            - "after lock estimated_frame_weight_lbs == 49680.00"
            - "after lock criteria_revision_at_lock == 1 and locked_at == 2026-08-05T00:00:00Z"

      - name: jurisdiction_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Jurisdiction
          - complexity_profile
        distinguishing_aspect: "id, created_at, updated_at and version are all server-minted: the id is a bare UUID with no type prefix, created_at and updated_at match at creation, and version starts at 1 and advances to 2 on the first mutation while created_at stays fixed."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; one jurisdiction TX-HARRIS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
          trigger:
            - call: "POST /jurisdictions/${j1_id}/loading-criteria"
              payload: { exposure_category: "D", design_wind_speed_mph: 160, ground_snow_load_psf: 5, seismic_design_category: "B" }
              as: PlatformAdmin
          assert:
            - "${j1_id} is a bare 36-character UUID with no type prefix such as jur_"
            - "at creation Jurisdiction.${j1_id}.created_at == 2026-08-01T00:00:00.000Z is false — created_at == 2026-08-05T00:00:00.000Z because the clock was set first"
            - "at creation created_at == updated_at and version == 1"
            - "after the criteria update version == 2 and created_at is unchanged"
            - "after the criteria update updated_at == 2026-08-05T00:00:00.000Z and criteria_revision == 2"

      - name: out_of_range_span_and_unknown_enum_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3, error_id=ERR_INVALID_REQUEST]
          - entities.BuildingConfiguration.fields.clear_span_ft
          - entities.BuildingConfiguration.fields.insulation_r_value
          - entities.Jurisdiction.fields.freight_zone
        distinguishing_aspect: "Numeric ranges and enum membership are enforced at priority 3, before any existence or state check: clear_span_ft 201 exceeds the 20..200 band, insulation_r_value 20 is not in {0,13,19,25} and freight_zone 6 exceeds 1..5 — each is a 400, not a 404 or a 409."
        test_recipe:
          setup:
            - "One jurisdiction TX-HARRIS and one AUTHORIZED builder."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 201, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 20 }
              as: SalesEngineer
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "CORRUGATED_TIN", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
            - call: "POST /jurisdictions"
              payload: { code: "TX-FORTBEND", name: "Fort Bend County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 6, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
          assert:
            - "all four calls return HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "clear_span_ft 201 is rejected because the band is 20..200 inclusive"
            - "insulation_r_value 20 is rejected because the allowed set is {0, 13, 19, 25}"
            - "panel_profile CORRUGATED_TIN is rejected because the enum is {PBR, STANDING_SEAM, R_PANEL}"
            - "freight_zone 6 is rejected because the band is 1..5"
            - "no BuildingConfiguration and no second Jurisdiction row is persisted"

      - name: design_component_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.DesignComponent
          - endpoints[POST /engineering-designs/{id}/components]
        distinguishing_aspect: "DesignComponent is the scaffold's only common_fields: false entity: the created row carries id and created_at but no version and no updated_at, and §1.5 declares no PATCH, PUT or DELETE for it — a component is corrected by superseding the whole design, never by editing the row."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS; AUTHORIZED builder; LOCKED configuration cfg1; DRAFT ASD design d_imm."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id }
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
              captures: { cfg1_v_locked: $.data.version }
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "ASD", expected_configuration_version: "${cfg1_v_locked}" }
              as: Engineer
              captures: { d_imm_id: $.data.id }
          trigger:
            - call: "POST /engineering-designs/${d_imm_id}/components"
              payload: { component_class: "PRIMARY_FRAME_MEMBER", mark: "C-1", member_type: "COLUMN", erection_stage: "PRIMARY_FRAME", quantity: 10, length_ft: 24.5, weight_per_ft: 62.35 }
              as: Engineer
              captures: { comp_id: $.data.id }
          assert:
            - "HTTP status == 201 and data.id == ${comp_id}"
            - "the component payload carries created_at == 2026-08-05T00:00:00.000Z"
            - "the component payload carries no version field and no updated_at field"
            - "DesignComponent.${comp_id}.unit_weight_lbs == 1527.58 and line_weight_lbs == 15275.80"
            - "§1.5 declares no PATCH, PUT or DELETE route addressing a DesignComponent"
            - "GET /engineering-designs/${d_imm_id}/components returns exactly this one row"

      - name: accessory_kit_against_unknown_configuration_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4, error_id=ERR_CONFIGURATION_NOT_FOUND]
          - endpoints[POST /building-configurations/{id}/accessory-kits]
          - entities.AccessoryKit.fields.configuration_id
        distinguishing_aspect: "AccessoryKit exists only under a BuildingConfiguration: addressing a configuration id that does not exist returns ERR_CONFIGURATION_NOT_FOUND (404) at priority 4, before the body is examined, so an otherwise valid kit body is still rejected."
        test_recipe:
          setup:
            - "Empty database — no BuildingConfiguration rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /building-configurations/00000000-0000-4000-8000-000000000000/accessory-kits"
              payload: { kit_type: "OVERHEAD_DOOR", quantity: 2, unit_price_cents: 385075, unit_weight_lbs: 640.5, erection_stage: "TRIM_ACCESSORY" }
              as: SalesEngineer
          assert:
            - "HTTP status == 404 and data.error_id == ERR_CONFIGURATION_NOT_FOUND"
            - "no AccessoryKit row is persisted"

      - name: quote_rejects_unknown_builder_and_configuration_references
        claim_type: foreign_key_validated
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=4, error_id=ERR_BUILDER_NOT_FOUND]
          - validations[priority=4, error_id=ERR_CONFIGURATION_NOT_FOUND]
          - endpoints[POST /quotes]
        distinguishing_aspect: "The topology is flat, so cross-references travel in the body rather than the path: POST /quotes carries both builder_id and configuration_id and each is validated for existence independently — a real builder with a bogus configuration and a bogus builder with a real configuration both fail at priority 4."
        test_recipe:
          setup:
            - "Jurisdiction TX-HARRIS, AUTHORIZED SILVER builder b1 and LOCKED configuration cfg1 all exist."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id }
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
          trigger:
            - call: "POST /quotes"
              payload: { builder_id: "00000000-0000-4000-8000-000000000000", configuration_id: "${cfg1_id}", freight_distance_miles: 240, adjustment_cents: 0 }
              as: SalesEngineer
            - call: "POST /quotes"
              payload: { builder_id: "${b1_id}", configuration_id: "00000000-0000-4000-8000-000000000000", freight_distance_miles: 240, adjustment_cents: 0 }
              as: SalesEngineer
          assert:
            - "the first call returns 404 with data.error_id == ERR_BUILDER_NOT_FOUND"
            - "the second call returns 404 with data.error_id == ERR_CONFIGURATION_NOT_FOUND"
            - "no Quote row is persisted by either call"
            - "Builder.${b1_id}.credit_used_cents == 0 after both rejections"

  - section: state_machines
    instances:
      - name: new_builder_starts_in_pending_authorization
        claim_type: initial_state
        grounds:
          - state_machines.Builder.initial_state
          - entities.Builder.fields.status
        distinguishing_aspect: "A freshly created Builder is PENDING_AUTHORIZATION with authorized_at null and does not yet count toward the territory's authorized_builder_count — creation is not authorization."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; one jurisdiction TX-HARRIS with territory TX-GULF."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
          trigger:
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
