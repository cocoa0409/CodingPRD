  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: rework_close_depth_four_cascade
        grounds:
          - state_machines.ReworkOrder.OPEN_to_CLOSED
          - entities.InventoryLot.fields.remaining_qty
          - entities.Part.fields.available_qty
          - entities.WorkOrder.fields.material_cost_cents
          - entities.Unit.fields.quality_status
        distinguishing_aspect: |
          Depth-4 transitive chain triggered by rework close: close consumes a lot
          (hop1: lot.remaining_qty drops) -> the depleted lot drives Part.available_qty
          recompute (hop2) -> the rework cost rolls into WorkOrder.material_cost_cents
          (hop3) -> the target Unit flips to REWORKED with rework_count++ (hop4). Each
          hop is caused by the previous, not by the close directly.
        test_recipe:
          setup:
            - "A FAILED unit on a WorkOrder whose pre-rework material_cost_cents=200 (1 unit consumed 1 @ 200). Lot LOT-F qty 10 @ 200; after start remaining is 9."
            - "Rework consumes replacement_qty 5 @ 200 (base 1000 -> low tier flat 1500 -> added 2500)."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-CAS", description: "diode", package_type: "SOT23", standard_cost_cents: 200, is_rohs_required: false, contains_conflict_minerals: false }
              as: ProcessEngineer
