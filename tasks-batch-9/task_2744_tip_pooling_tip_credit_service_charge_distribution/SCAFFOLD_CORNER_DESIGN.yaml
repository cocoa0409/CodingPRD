              as_user_id: "op_comp_2"
              captures: { err_same_issuer: $.data.error_id }
            - call: "POST /back-wage-corrections/${corr_id}/apply"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
          assert:
            - "trigger 1 returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES: op_prep_1 is the period's computed_by_user_id, and presenting the ComplianceOfficer role does not launder the identity"
            - "after trigger 1 GET /pay-periods/${period_id} still reports status == COMPUTED with approved_by_user_id == null, and GET /pay-lines?pay_period_id=${period_id} reports every line status == DRAFT"
            - "trigger 2 returns HTTP 200 with status == APPROVED, approved_by_user_id == op_comp_1 and computed_by_user_id == op_prep_1"
