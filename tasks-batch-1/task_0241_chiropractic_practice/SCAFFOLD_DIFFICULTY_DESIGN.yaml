# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Chiropractic Practice
# Nine §0.5 Difficulty Rules × ≥2 instances each (18 instances).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: patient_responsibility_insurance_vs_cash_diverge
        grounds:
          - calculations.patient_responsibility
          - entities.Appointment.fields.patient_responsibility_cents
          - entities.Patient.fields.payer_mode
        distinguishing_aspect: |
          Two billing algorithms on the SAME Appointment domain produce different patient_responsibility_cents
          for an identical ADJUSTMENT visit: a CASH patient owes the full cash_rate (6000), an INSURANCE patient
          whose deductible is already met owes only coinsurance (1600). The divergence is the dual-variant claim.
        test_recipe:
          setup:
            - "An ACTIVE FeeSchedule for ADJUSTMENT with cash_rate_cents=6000, billed_amount_cents=9000."
            - "An ACTIVE Provider, an OPEN ADJUSTMENT room."
            - "Clock at 2026-03-02T08:00:00Z (a Monday)."
            - "A CASH patient with one BOOKED ADJUSTMENT at 2026-03-02T17:00:00Z, checked in, SOAP signed."
            - "An INSURANCE patient with an ACTIVE policy (annual_visit_cap=20, deductible_total_cents=10000, deductible_met_cents=10000 already met, coinsurance_pct=0.20, allowed_amount_cents=8000) and one BOOKED ADJUSTMENT, checked in, SOAP signed."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
              captures: { fs_adj_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Cash Carl", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: FrontDesk
              captures: { cash_pt_id: $.data.id }
            - call: "POST /patients/${cash_pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-02T17:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { cash_appt_id: $.data.id }
            - call: "POST /patients/${cash_pt_id}/appointments/${cash_appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /patients/${cash_pt_id}/appointments/${cash_appt_id}/soap-note"
              payload: { provider_id: "${prov_id}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${cash_pt_id}/appointments/${cash_appt_id}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients"
              payload: { full_name: "Ins Ida", date_of_birth: "1980-01-01", payer_mode: "INSURANCE" }
              as: FrontDesk
              captures: { ins_pt_id: $.data.id }
            - call: "POST /patients/${ins_pt_id}/insurance-policies"
              payload: { carrier_name: "Acme", annual_visit_cap: 20, deductible_total_cents: 10000, coinsurance_pct: 0.20, allowed_amount_cents: 8000 }
              as: BillingClerk
              captures: { pol_id: $.data.id }
            - call: "POST /patients/${ins_pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-03T17:00:00Z", duration_minutes: 15, insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { ins_appt_id: $.data.id }
            - call: "POST /patients/${ins_pt_id}/appointments/${ins_appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /patients/${ins_pt_id}/appointments/${ins_appt_id}/soap-note"
              payload: { provider_id: "${prov_id}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${ins_pt_id}/appointments/${ins_appt_id}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /patients/${cash_pt_id}/appointments/${cash_appt_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { cash_pr: $.data.patient_responsibility_cents }
            - call: "POST /patients/${ins_pt_id}/appointments/${ins_appt_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { ins_pr: $.data.patient_responsibility_cents }
          assert:
            - "Appointment.${cash_appt_id}.patient_responsibility_cents == 6000"
            - "Appointment.${cash_appt_id}.insurance_paid_cents == 0"
            - "Appointment.${ins_appt_id}.patient_responsibility_cents == 1600"
            - "Appointment.${ins_appt_id}.insurance_paid_cents == 6400"

      - name: no_show_fee_no_show_vs_late_cancel_diverge
        grounds:
          - calculations.no_show_fee
          - entities.Appointment.fields.no_show_fee_cents
          - entities.Patient.fields.no_show_strike_count
        distinguishing_aspect: |
          On the Patient-penalty domain (distinct from the Appointment-billing domain of the first instance),
          the same first-tier strike yields a different no_show_fee_cents depending on the transition: a NO_SHOW
          is charged the full tier fee (2500) while a LATE_CANCEL is charged the 0.5 multiplier (1250).
        test_recipe:
          setup:
            - "An ACTIVE Provider, an OPEN ADJUSTMENT room, ACTIVE FeeSchedule for ADJUSTMENT."
            - "Clock at 2026-03-02T08:00:00Z."
            - "CASH patient A with one BOOKED appointment at 2026-03-03T17:00:00Z."
            - "CASH patient B with one BOOKED appointment at 2026-03-02T20:00:00Z; clock then advanced to 2026-03-02T12:00:00Z so cancel is within the 24h late window."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "NS Ann", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_a_id: $.data.id }
            - call: "POST /patients/${pt_a_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-03T17:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { appt_a_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "LC Bob", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_b_id: $.data.id }
            - call: "POST /patients/${pt_b_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-02T20:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { appt_b_id: $.data.id }
          trigger:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-03T17:30:00Z" }
              as: PracticeAdmin
            - call: "POST /patients/${pt_a_id}/appointments/${appt_a_id}/no-show"
              payload: {}
              as: FrontDesk
              captures: { ns_fee: $.data.no_show_fee_cents }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T12:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients/${pt_b_id}/appointments/${appt_b_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { lc_fee: $.data.no_show_fee_cents, lc_status: $.data.attendance_status }
          assert:
            - "Appointment.${appt_a_id}.attendance_status == NO_SHOW"
            - "Appointment.${appt_a_id}.no_show_fee_cents == 2500"
            - "Appointment.${appt_b_id}.attendance_status == LATE_CANCEL"
            - "Appointment.${appt_b_id}.no_show_fee_cents == 1250"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: insurance_responsibility_mode_a_min_max_nesting
        grounds:
          - calculations.patient_responsibility
          - entities.InsurancePolicy.fields.deductible_total_cents
          - entities.InsurancePolicy.fields.deductible_met_cents
          - entities.InsurancePolicy.fields.coinsurance_pct
          - entities.InsurancePolicy.fields.allowed_amount_cents
        distinguishing_aspect: |
          MODE (a): the INSURANCE branch is a 4-input non-linear formula —
          applied = min(allowed, max(0, deductible_total - deductible_met)); after = allowed - applied;
          patient_resp = applied + round(after * coinsurance_pct). With a PARTIAL deductible (met=8000 of 14000,
          allowed=8000, coins=0.20) the nested min/max gives applied=min(8000,6000)=6000, coins=round(2000*0.2)=400 -> 6400,
          not the trivial sum.
        test_recipe:
          setup:
            - "ACTIVE FeeSchedule for ADJUSTMENT (cash 6000)."
            - "ACTIVE Provider, OPEN ADJUSTMENT room, clock at 2026-03-02T08:00:00Z."
            - "INSURANCE patient with one ACTIVE policy (cap 20, deductible_total 14000, coinsurance 0.20, allowed 8000)."
            - "deductible_met_cents=8000 is produced by first completing AND adjudicating a prior ADJUSTMENT visit on the SAME policy (applied_to_deductible = min(8000,14000) = 8000); that visit's adjudicate raises deductible_met to 8000."
            - "Then a second ADJUSTMENT (the trigger) is BOOKED+CHECKED_IN with a SIGNED SOAP note on the same policy."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Ins Ida", date_of_birth: "1980-01-01", payer_mode: "INSURANCE" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/insurance-policies"
              payload: { carrier_name: "Acme", annual_visit_cap: 20, deductible_total_cents: 14000, coinsurance_pct: 0.20, allowed_amount_cents: 8000 }
              as: BillingClerk
              captures: { pol_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-02T17:00:00Z", duration_minutes: 15, insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { prior_appt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments/${prior_appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /patients/${pt_id}/appointments/${prior_appt_id}/soap-note"
              payload: { provider_id: "${prov_id}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${prior_appt_id}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${prior_appt_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${prior_appt_id}/adjudicate"
              payload: {}
              as: BillingClerk
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-03T17:00:00Z", duration_minutes: 15, insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/soap-note"
              payload: { provider_id: "${prov_id}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { pr: $.data.patient_responsibility_cents }
          assert:
            - "InsurancePolicy.${pol_id}.deductible_met_cents == 8000"
            - "Appointment.${appt_id}.patient_responsibility_cents == 6400"
            - "Appointment.${appt_id}.insurance_paid_cents == 1600"

      - name: wellness_overage_mode_c_ordinal_then_branch
        grounds:
          - calculations.patient_responsibility
          - entities.WellnessPlan.fields.included_adjustments_per_month
          - entities.WellnessPlan.fields.overage_discount_pct
          - entities.Patient.fields.payer_mode
        distinguishing_aspect: |
          MODE (c): the WELLNESS branch is order-pinned circular-looking — patient_responsibility for THIS adjustment
          is undefined until the monthly ordinal n is fixed (count ATTENDED ADJUSTMENTs in the same calendar month,
          ordered scheduled_start ASC then created_at ASC, this one included), THEN branch (n<=included -> $0; else
          cash - round(cash*overage_discount_pct)). With included=4, cash=6000, disc=0.30, the 5th adjustment is 4200.
        test_recipe:
          setup:
            - "A WellnessPlan included_adjustments_per_month=4, overage_discount_pct=0.30, monthly_fee 9900."
            - "ACTIVE FeeSchedule for ADJUSTMENT cash_rate 6000."
            - "ACTIVE Provider, OPEN ADJUSTMENT room, clock at 2026-04-01T08:00:00Z."
            - "WELLNESS patient on that plan with four prior ATTENDED ADJUSTMENTs in April 2026 (ordinals 1-4, all $0), and a fifth BOOKED+CHECKED_IN ADJUSTMENT in April with a SIGNED SOAP note."
          setup_api_calls:
            - call: "POST /wellness-plans"
              payload: { name: "Gold", monthly_fee_cents: 9900, included_adjustments_per_month: 4, overage_discount_pct: 0.30 }
              as: PracticeAdmin
              captures: { wp_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT", turnover_buffer_minutes: 0 }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Well Wendy", date_of_birth: "1980-01-01", payer_mode: "WELLNESS", wellness_plan_id: "${wp_id}" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            # four prior visits (ordinals 1-4) — distinct start times so intervals never overlap
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-04-06T15:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { a1: $.data.id }
            - call: "POST /patients/${pt_id}/appointments/${a1}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /patients/${pt_id}/appointments/${a1}/soap-note"
              payload: { provider_id: "${prov_id}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${a1}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${a1}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-04-07T15:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { a2: $.data.id }
            - call: "POST /patients/${pt_id}/appointments/${a2}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /patients/${pt_id}/appointments/${a2}/soap-note"
              payload: { provider_id: "${prov_id}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Provider
