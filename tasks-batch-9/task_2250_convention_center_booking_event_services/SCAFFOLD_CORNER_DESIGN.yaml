              as: VenueAdmin
            - call: "POST /convention-center/bookings/${bk_id}/open-show"
              payload: {}
              as: EventServicesManager
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-14T09:00:00Z" }
              as: VenueAdmin
