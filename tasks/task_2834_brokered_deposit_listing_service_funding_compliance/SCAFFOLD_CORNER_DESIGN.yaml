          trigger:
            - call: "POST /deposit-programs/${prog_id}/state-actions"
              payload: { action: "FROBNICATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e1: $.data.error_id }
            - call: "POST /institutions/${inst_id}/call-report-filings"
              payload: { report_period: "2026Q5", rc_e_brokered_reported_cents: 0, rc_o_listing_reported_cents: 0, rc_e_core_reported_cents: 30000000000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e2: $.data.error_id }
            - call: "POST /institutions/${inst_id}/call-report-filings"
              payload: { report_period: "2026Q3", rc_e_brokered_reported_cents: -1, rc_o_listing_reported_cents: 0, rc_e_core_reported_cents: 30000000000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e3: $.data.error_id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-9065", fee_structure: "FLAT_FEE", fee_flat_cents: 10000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 101, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
