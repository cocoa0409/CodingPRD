          ceil(500 * 0 / 10000) is 0, and the endpoint must answer HTTP 200 with zeroed counters
          and an empty array rather than a 4xx or a division-by-zero. A DRAFT renewal exists but
          is not CE_VERIFIED, so it must be excluded from the pool and must NOT receive an
