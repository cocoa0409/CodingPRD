scenario: "914. School-Based Health Center: student enrollment & consent, visit (acute/behavioral/dental) & sports physical, immunization & screening, referral & care coordination, sponsor-hospital billing & sliding fee, parent notification, telehealth-to-classroom, reporting"
domain_name: "school-based-health-center"
api_prefix: "/sbhc"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"

  entity_topology: graph
  # Student sits at the centre of a cross-aggregate reference graph: Visit points at
  # Enrollment AND Consent AND Clinician AND School; Screening and Referral point at
  # each other (Screening.generated_referral_id <-> Referral.source_screening_id);
  # Consent.granted_by_user_id is polymorphic (Guardian.id or Student.id).

  state_machine_shape: parallel
  # Visit carries two independent axes on one row (clinical_status x billing_status).
  # Six further machines are cyclic or capped-retry: Enrollment (reinstatement loop),
  # SportsPhysicalClearance (deferral re-evaluation loop), Referral (outreach loop),
  # BillableCharge (denial/appeal loop), ParentNotification (delivery retry loop),
  # TelehealthSession (no-show/reschedule loop), School (suspend/reinstate loop).

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
    - self_referential
  # self_referential: ImmunizationDose N is validated against ImmunizationDose N-1 of
  # the same student and series (predecessor lookup inside the same entity).

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Domain constants — EVERY numeric constant referenced anywhere in this
# scaffold has an explicit value here (or in a calculations[].constants block,
# which repeats the value verbatim). No named constant is left value-less.
# Boundary semantics are stated inline on every threshold and window.
# ---------------------------------------------------------------------------
domain_constants:

  clock_and_calendar:
    DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00.000Z"     # server startup default; never falls back to wall clock
    SCHOOL_YEAR_2025_2026_START_DATE: "2025-08-01"
    SCHOOL_YEAR_2025_2026_END_DATE: "2026-07-31"      # school-year end instant = 2026-07-31T23:59:59.000Z
    SCHOOL_YEAR_2026_2027_START_DATE: "2026-08-01"
    SCHOOL_YEAR_2026_2027_END_DATE: "2027-07-31"      # school-year end instant = 2027-07-31T23:59:59.000Z
    SUPPORTED_SCHOOL_YEARS: ["2025-2026", "2026-2027"]
    school_year_of_date_rule: |
      current_school_year(d) = "<Y>-<Y+1>" when month(d) >= 8, else "<Y-1>-<Y>", where Y = year(d).
      With DEFAULT_CLOCK_UTC (2026-05-01) the current school year is "2025-2026".

  consent:
    SELF_CONSENT_MIN_AGE_YEARS: 14                    # inclusive: age_years >= 14 permits self-consent
    SELF_CONSENTABLE_CATEGORIES: ["BEHAVIORAL_HEALTH", "CONFIDENTIAL_SERVICES"]
    CONSENT_CATEGORIES: ["GENERAL_TREATMENT", "BEHAVIORAL_HEALTH", "CONFIDENTIAL_SERVICES", "DENTAL", "TELEHEALTH"]
    consent_usable_rule: |
      A Consent authorizes an operation when status == ACTIVE AND
      current_utc <= expires_at (INCLUSIVE, "at or before"). expires_at is the
      school-year end instant of Consent.school_year.

  enrollment:
    MAX_ENROLLMENT_REINSTATEMENTS: 2                  # 3rd reinstate on the same Enrollment row is rejected

  immunization:
    REQUIRED_SERIES: ["HEPB", "MMR"]
    HEPB_REQUIRED_DOSES: 3
    HEPB_DOSE1_MIN_AGE_DAYS: 0
    HEPB_DOSE2_MIN_INTERVAL_DAYS: 28
    HEPB_DOSE3_MIN_INTERVAL_DAYS: 56
    MMR_REQUIRED_DOSES: 2
    MMR_DOSE1_MIN_AGE_DAYS: 365
    MMR_DOSE2_MIN_INTERVAL_DAYS: 28
    IMMUNIZATION_GRACE_DAYS: 4                        # dose is VALID when administered_date >= earliest_valid_date (INCLUSIVE)
    PROVISIONAL_WINDOW_DAYS: 30                       # inclusive: clock_date <= activated_date + 30 keeps PROVISIONAL alive

  screening_bands:
    VISION_REFER_DENOMINATOR_MIN: 40                  # REFER when numeric_result >= 40 (INCLUSIVE)
    HEARING_REFER_DB_EXCLUSIVE: 25                    # REFER when numeric_result > 25 (STRICTLY greater)
    DENTAL_REFER_CARIES_MIN: 1                        # REFER when numeric_result >= 1 (INCLUSIVE)
    BMI_REFER_PERCENTILE_LOW_EXCLUSIVE: 5             # REFER when numeric_result < 5 (STRICTLY less)
    BMI_REFER_PERCENTILE_HIGH_INCLUSIVE: 95           # REFER when numeric_result >= 95 (INCLUSIVE)
    BEHAVIORAL_REFER_SCORE_MIN: 10                    # REFER when numeric_result >= 10 (INCLUSIVE)

  sports_clearance:
    CLEARANCE_VALIDITY_DAYS_CLEARED: 365
    CLEARANCE_VALIDITY_DAYS_RESTRICTED: 180
    DEFERRAL_REEVALUATION_WINDOW_DAYS: 30             # inclusive: re-evaluation allowed while clock_date <= determination_date + 30
    MAX_DEFERRAL_REEVALUATIONS: 2                     # 3rd re-evaluate on the same clearance row is rejected

  referral:
    MAX_OUTREACH_ATTEMPTS: 3                          # the 3rd NO_ANSWER drives LOST_TO_FOLLOW_UP; a 4th attempt is rejected

  notification:
    MAX_NOTIFICATION_DELIVERY_ATTEMPTS: 3             # the 3rd FAILED drives UNDELIVERABLE; a 4th deliver is rejected
    NOTIFICATION_ACK_WINDOW_DAYS: 14                  # inclusive: acknowledge allowed while current_utc <= sent_at + 14 days

  telehealth:
    TELEHEALTH_TURNAROUND_BUFFER_MINUTES: 15          # clinician axis; a gap of EXACTLY 15 minutes is ALLOWED
    TELEHEALTH_MIN_DURATION_MINUTES: 15               # inclusive lower bound
    TELEHEALTH_MAX_DURATION_MINUTES: 60               # inclusive upper bound
    MAX_SESSION_RESCHEDULES: 2                        # 3rd reschedule on the same session row is rejected
    DEFAULT_TELEHEALTH_CONCURRENT_CAPACITY: 1
    MIN_TELEHEALTH_CONCURRENT_CAPACITY: 1
    MAX_TELEHEALTH_CONCURRENT_CAPACITY: 4

  visit:
    NO_SHOW_GRACE_MINUTES: 10                         # inclusive: NO_SHOW allowed once current_utc >= scheduled_start_at + 10 min

  sliding_fee:
    FPL_BASE_ANNUAL_CENTS: 1560000                    # household size 1
    FPL_INCREMENT_PER_ADDITIONAL_PERSON_CENTS: 550000
    TIER_A_MAX_FPL_PERCENT: 100.00                    # TIER_A when fpl_percent <= 100.00 (INCLUSIVE)
    TIER_B_MAX_FPL_PERCENT: 138.00                    # TIER_B when 100.00 < fpl_percent <= 138.00
    TIER_C_MAX_FPL_PERCENT: 175.00                    # TIER_C when 138.00 < fpl_percent <= 175.00
    TIER_D_MAX_FPL_PERCENT: 200.00                    # TIER_D when 175.00 < fpl_percent <= 200.00; TIER_E when > 200.00
    DISCOUNT_PCT_TIER_A: 1.00
    DISCOUNT_PCT_TIER_B: 0.80
    DISCOUNT_PCT_TIER_C: 0.60
    DISCOUNT_PCT_TIER_D: 0.40
    DISCOUNT_PCT_TIER_E: 0.00
    NOMINAL_FEE_FLOOR_CENTS: 500                      # encounter-level floor, applied per §1.3 encounter_nominal_fee_floor
    PRIVATE_COPAY_CENTS: 2500
    MAX_CLAIM_APPEALS: 2                              # 3rd appeal on the same charge is rejected

  fee_schedule:
    FEE_ACUTE_OFFICE_VISIT_CENTS: 12000
    FEE_BEHAVIORAL_THERAPY_CENTS: 15000
    FEE_DENTAL_PREVENTIVE_CENTS: 9000
    FEE_SPORTS_PHYSICAL_EXAM_CENTS: 5000
    FEE_IMMUNIZATION_ADMIN_CENTS: 3000
    FEE_TELEHEALTH_ENCOUNTER_CENTS: 11000
    NO_CHARGE_SERVICE_CATEGORIES: ["IMMUNIZATION_ADMIN"]   # always no-charge regardless of tier and payer route

  reporting:
    REPORT_RATE_PRECISION_DP: 4                       # rates rounded half-up to 4 decimal places
    MONEY_PRECISION_DP: 0                             # all money is whole cents, round_half_up

  mappings:
    visit_type_to_required_consent_category: |
      ACUTE            -> GENERAL_TREATMENT   (when confidential_service_requested == false)
      ACUTE            -> CONFIDENTIAL_SERVICES (when confidential_service_requested == true)
      BEHAVIORAL       -> BEHAVIORAL_HEALTH
      DENTAL           -> DENTAL
      SPORTS_PHYSICAL  -> GENERAL_TREATMENT
      Additionally, delivery_mode == TELEHEALTH requires an ACTIVE unexpired TELEHEALTH consent on top of the above.
    visit_type_to_clinician_discipline: |
      ACUTE -> MEDICAL ; BEHAVIORAL -> BEHAVIORAL ; DENTAL -> DENTAL ; SPORTS_PHYSICAL -> MEDICAL
    visit_to_service_category: |
      delivery_mode == TELEHEALTH -> TELEHEALTH_ENCOUNTER (overrides visit_type)
      else ACUTE -> ACUTE_OFFICE_VISIT ; BEHAVIORAL -> BEHAVIORAL_THERAPY ;
           DENTAL -> DENTAL_PREVENTIVE ; SPORTS_PHYSICAL -> SPORTS_PHYSICAL_EXAM
      Plus one IMMUNIZATION_ADMIN charge per ImmunizationDose with visit_id == this visit and status == VALID.
    screening_instrument_to_referral_specialty: |
      VISION -> OPHTHALMOLOGY ; HEARING -> AUDIOLOGY ; DENTAL -> DENTISTRY ;
      BMI -> NUTRITION ; BEHAVIORAL -> BEHAVIORAL_HEALTH

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:

  - name: School
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "School site display name"
        constraints: "1..120 characters"
      - name: site_code
        type: string
        source: input
        description: "Short site identifier, unique across all School rows"
        constraints: "1..16 characters; uniqueness enforced case-sensitively"
      - name: sponsor_hospital_name
        type: string
        source: input
        description: "Sponsoring hospital that owns the billing relationship for this site"
      - name: program_status
        type: enum
        source: computed
        description: "Program posture of the site; gates every clinical operation performed at the site"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED — written only by the School state machine"
      - name: telehealth_concurrent_capacity
        type: integer
        source: input
        description: "Number of telehealth sessions the site's classroom/presenter staff can host at overlapping times"
        default: 1
        constraints: "MIN_TELEHEALTH_CONCURRENT_CAPACITY(1) <= value <= MAX_TELEHEALTH_CONCURRENT_CAPACITY(4)"
      - name: telehealth_booked_minutes_total
        type: integer
        source: computed
        description: "Conserved quantity: sum of TelehealthSession.duration_minutes over sessions with school_id == this School and status IN {SCHEDULED, COMPLETED}"
        default: 0
      - name: suspended_count
        type: integer
        source: computed
        description: "Number of times this School has entered SUSPENDED; increments on each suspend transition"
        default: 0

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Clinician display name"
      - name: discipline
        type: enum
        source: input
        description: "Scope of practice; must match the visit_type discipline mapping for every Visit this clinician delivers"
        constraints: "MEDICAL | BEHAVIORAL | DENTAL"
      - name: license_number
        type: string
        source: input
        description: "State licence identifier"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: first_name
        type: string
        source: input
        description: "Student given name"
      - name: last_name
        type: string
        source: input
        description: "Student family name"
      - name: date_of_birth
        type: string
        source: input
        description: "Birth date, YYYY-MM-DD; drives SELF_CONSENT_MIN_AGE_YEARS and MMR_DOSE1_MIN_AGE_DAYS"
        constraints: "ISO date, must be strictly before the current logical clock date"
      - name: household_income_annual_cents
        type: integer
        source: input
        description: "Annual household income in whole cents, set through the financial-profile endpoint"
        default: 0
        constraints: ">= 0"
      - name: household_size
        type: integer
        source: input
        description: "Number of people in the household, set through the financial-profile endpoint"
        default: 1
        constraints: ">= 1"
      - name: payer_route
        type: enum
        source: input
        description: "Billing route applied to every BillableCharge minted for this student"
        default: SELF_PAY
        constraints: "MEDICAID | PRIVATE_INSURANCE | SELF_PAY"
      - name: insurance_member_id
        type: string
        source: input
        description: "Payer member identifier; null for SELF_PAY"
        default: null
      - name: fpl_percent
        type: number
        source: computed
        description: "Household income as a percentage of the federal poverty level; see calculations.fpl_percent_and_discount_tier"
        default: 0.00
        constraints: "2 decimal places, round_half_up"
      - name: discount_tier
        type: enum
        source: computed
        description: "Sliding-fee tier derived from fpl_percent; snapshotted onto every BillableCharge at creation"
        default: TIER_A
        constraints: "TIER_A | TIER_B | TIER_C | TIER_D | TIER_E"
      - name: immunization_compliance_status
        type: enum
        source: computed
        description: "Posture field gating sports-physical clearance; see calculations.immunization_compliance_status"
        default: NON_COMPLIANT
        constraints: "COMPLIANT | PROVISIONAL | NON_COMPLIANT"
      - name: immunization_exemption_type
        type: enum
        source: input
        description: "Exemption on file; NONE means no exemption"
        default: NONE
        constraints: "NONE | MEDICAL | RELIGIOUS"
      - name: valid_dose_count
        type: integer
        source: computed
        description: "Count of ImmunizationDose rows for this student with status == VALID"
        default: 0
      - name: invalid_dose_count
        type: integer
        source: computed
        description: "Count of ImmunizationDose rows for this student with status == INVALID_TOO_EARLY"
        default: 0
      - name: voided_dose_count
        type: integer
        source: computed
        description: "Count of ImmunizationDose rows for this student with status == VOIDED"
        default: 0
      - name: total_dose_count
        type: integer
        source: computed
        description: "Count of all ImmunizationDose rows for this student; equals valid_dose_count + invalid_dose_count + voided_dose_count"
        default: 0

  - name: Guardian
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student this guardian is responsible for"
      - name: full_name
        type: string
        source: input
        description: "Guardian display name"
      - name: relationship
        type: enum
        source: input
        description: "Relationship to the student"
        constraints: "MOTHER | FATHER | LEGAL_GUARDIAN | OTHER"
      - name: contact_email
        type: string
        source: input
        description: "Delivery address for parent notifications"
      - name: is_primary
        type: boolean
        source: input
        description: "Primary contact flag; first key of the notification-target selector"
        default: false
      - name: notification_opt_out
        type: boolean
        source: input
        description: "When true every notification targeted at this guardian is created directly in SUPPRESSED_OPT_OUT"
        default: false

  - name: Enrollment
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the enrolled student"
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the site the student is enrolled at for this school year"
      - name: school_year
        type: string
        source: input
        description: "School year label this enrollment covers"
        constraints: "one of SUPPORTED_SCHOOL_YEARS: 2025-2026 | 2026-2027"
      - name: status
        type: enum
        source: computed
        description: "Enrollment lifecycle state; written only by the Enrollment state machine"
        default: PENDING
        constraints: "PENDING | ACTIVE | WITHDRAWN | TRANSFERRED"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into ACTIVE; anchors PROVISIONAL_WINDOW_DAYS"
        default: null
      - name: withdrawn_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into WITHDRAWN"
        default: null
      - name: withdrawal_reason
        type: string
        source: input
        description: "Free-text reason captured on withdraw"
        default: null
      - name: reinstated_count
        type: integer
        source: computed
        description: "Number of WITHDRAWN -> ACTIVE reinstatements applied to this row; capped by MAX_ENROLLMENT_REINSTATEMENTS(2)"
        default: 0

  - name: Consent
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student the consent covers"
      - name: category
        type: enum
        source: input
        description: "Consent category; gates which visit types may be delivered"
        constraints: "GENERAL_TREATMENT | BEHAVIORAL_HEALTH | CONFIDENTIAL_SERVICES | DENTAL | TELEHEALTH"
      - name: school_year
        type: string
        source: input
        description: "School year the consent is scoped to"
        constraints: "one of SUPPORTED_SCHOOL_YEARS: 2025-2026 | 2026-2027"
      - name: granted_by
        type: enum
        source: input
        description: "Who granted the consent; STUDENT_SELF marks the minor-consent-by-law path"
        constraints: "GUARDIAN | STUDENT_SELF"
      - name: granted_by_user_id
        type: string
        source: input
        description: "Polymorphic actor id — Guardian.id when granted_by == GUARDIAN, Student.id when granted_by == STUDENT_SELF. Deliberately not a single-target FK; resolvability is pinned by granted_by."
      - name: status
        type: enum
        source: computed
        description: "Consent lifecycle state; written only by the Consent state machine"
        default: ACTIVE
        constraints: "ACTIVE | REVOKED | EXPIRED | SUPERSEDED"
      - name: effective_at
        type: datetime
        source: system
        description: "Logical-clock instant at creation"
      - name: expires_at
        type: datetime
        source: computed
        description: "School-year end instant of school_year: 2026-07-31T23:59:59.000Z for 2025-2026 and 2027-07-31T23:59:59.000Z for 2026-2027. Consent is usable while current_utc <= expires_at (inclusive)."
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into REVOKED"
        default: null
      - name: revocation_reason
        type: string
        source: input
        description: "Free-text reason captured on revoke"
        default: null

  - name: Visit
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student seen"
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the site where the encounter happens"
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the delivering clinician"
      - name: enrollment_id
        type: string
        source: computed
        description: "FK -> Enrollment.id; the ACTIVE enrollment resolved at creation (student_id, school_id, current school year)"
      - name: consent_id
        type: string
        source: computed
        description: "FK -> Consent.id; the governing consent resolved at creation via visit_type_to_required_consent_category"
      - name: visit_type
        type: enum
        source: input
        description: "Clinical service line delivered"
        constraints: "ACUTE | BEHAVIORAL | DENTAL | SPORTS_PHYSICAL"
      - name: delivery_mode
        type: enum
        source: input
        description: "Whether the encounter is in person or delivered into the classroom by telehealth"
        default: IN_PERSON
        constraints: "IN_PERSON | TELEHEALTH"
      - name: confidential_service_requested
        type: boolean
        source: input
        description: "For ACUTE visits, requests the CONFIDENTIAL_SERVICES consent category instead of GENERAL_TREATMENT"
        default: false
      - name: confidential
        type: boolean
        source: computed
        description: "True when the governing Consent has granted_by == STUDENT_SELF; suppresses every parent notification this visit would otherwise raise"
        default: false
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Planned encounter start; anchors NO_SHOW_GRACE_MINUTES"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into COMPLETED"
        default: null
      - name: disposition
        type: enum
        source: input
        description: "Clinical disposition captured at completion; reported by the aggregate report"
        default: null
        constraints: "TREATED_RETURNED_TO_CLASS | TREATED_SENT_HOME | REFERRED_OUT | NO_TREATMENT_NEEDED"
      - name: clinical_status
        type: enum
        source: computed
        description: "Clinical axis of the Visit parallel state machine"
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED | NO_SHOW"
      - name: billing_status
        type: enum
        source: computed
        description: "Billing axis of the Visit parallel state machine; evolves independently of clinical_status"
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | PENDING_CHARGES | CHARGES_POSTED | REVERSED"
      - name: gross_charge_total_cents
        type: integer
        source: computed
        description: "Sum of BillableCharge.gross_amount_cents over this visit's charges with status != REVERSED"
        default: 0
      - name: no_charge_total_cents
        type: integer
        source: computed
        description: "Sum of BillableCharge.gross_amount_cents over this visit's charges with status == NO_CHARGE"
        default: 0
      - name: patient_responsibility_total_cents
        type: integer
        source: computed
        description: "Sum of BillableCharge.patient_responsibility_cents over this visit's charges with status NOT IN {REVERSED, NO_CHARGE}"
        default: 0
      - name: write_off_total_cents
        type: integer
        source: computed
        description: "Sum of BillableCharge.write_off_amount_cents over this visit's charges with status == WRITTEN_OFF"
        default: 0
      - name: payer_billed_total_cents
        type: integer
        source: computed
        description: "Sum of (gross_amount_cents - patient_responsibility_cents - write_off_amount_cents) over this visit's charges with status NOT IN {REVERSED, NO_CHARGE}"
        default: 0

  - name: SportsPhysicalClearance
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the SPORTS_PHYSICAL visit that produced the determination"
      - name: student_id
        type: string
        source: computed
        description: "FK -> Student.id; copied from the parent Visit at creation"
      - name: school_year
        type: string
        source: computed
        description: "School year copied from the visit's Enrollment; scopes supersede and the validity cap"
      - name: outcome
        type: enum
        source: input
        description: "Multi-outcome athletic participation determination"
        constraints: "CLEARED | CLEARED_WITH_RESTRICTIONS | DEFERRED | NOT_CLEARED"
      - name: restrictions
        type: string
        source: input
        description: "Restriction text; required when outcome == CLEARED_WITH_RESTRICTIONS"
        default: null
      - name: determination_date
        type: string
        source: system
        description: "Logical-clock date (YYYY-MM-DD) of the most recent determination or re-evaluation"
      - name: unrestricted_valid_until
        type: string
        source: computed
        description: "CALENDAR_DAYS variant of the validity window: determination_date + validity days; null for DEFERRED and NOT_CLEARED"
        default: null
      - name: valid_until
        type: string
        source: computed
        description: "SCHOOL_YEAR_CAPPED variant (operative): min(unrestricted_valid_until, school-year end date); null for DEFERRED and NOT_CLEARED"
        default: null
      - name: reevaluation_count
        type: integer
        source: computed
        description: "Number of re-evaluations applied to this row; capped by MAX_DEFERRAL_REEVALUATIONS(2)"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Clearance lifecycle state; written only by the SportsPhysicalClearance state machine"
        default: ACTIVE
        constraints: "ACTIVE | PENDING_REEVALUATION | VOIDED | EXPIRED | SUPERSEDED"
      - name: void_reason
        type: string
        source: system
        description: "Why the clearance was voided: IMMUNIZATION_COMPLIANCE_LOST or SCREENING_REFERRAL_RAISED"
        default: null

  - name: ImmunizationDose
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student the dose was administered to"
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the encounter the dose was given at; null when recorded from outside records"
        default: null
      - name: series_code
        type: enum
        source: input
        description: "Required immunization series this dose belongs to"
        constraints: "HEPB | MMR"
      - name: dose_number
        type: integer
        source: input
        description: "Position in the series; must equal (highest VALID dose_number in the series) + 1"
        constraints: "1 <= dose_number <= HEPB_REQUIRED_DOSES(3) for HEPB, <= MMR_REQUIRED_DOSES(2) for MMR"
      - name: administered_date
        type: string
        source: input
        description: "Administration date, YYYY-MM-DD; must not be after the current logical clock date"
      - name: earliest_valid_date
        type: string
        source: computed
        description: "Earliest date this dose could have been given and still count, grace included; see calculations.immunization_dose_validity"
      - name: strict_earliest_valid_date
        type: string
        source: computed
        description: "Same date with IMMUNIZATION_GRACE_DAYS removed; used only by the STRICT_COUNTING compliance variant"
      - name: status
        type: enum
        source: computed
        description: "Dose validity state; written only by the ImmunizationDose state machine"
        default: VALID
        constraints: "VALID | INVALID_TOO_EARLY | VOIDED"
      - name: invalid_reason
        type: string
        source: computed
        description: "MIN_AGE_NOT_MET | MIN_INTERVAL_NOT_MET | PREDECESSOR_VOIDED; null when status == VALID"
        default: null
      - name: void_reason
        type: string
        source: input
        description: "Free-text reason captured on void"
        default: null

  - name: Screening
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the encounter the screening was performed at"
      - name: student_id
        type: string
        source: computed
        description: "FK -> Student.id; copied from the parent Visit at creation"
      - name: instrument
        type: enum
        source: input
        description: "Screening instrument administered"
        constraints: "VISION | HEARING | DENTAL | BMI | BEHAVIORAL"
      - name: numeric_result
        type: number
        source: input
        description: "Instrument reading; Snellen denominator, dB HL, untreated caries count, BMI percentile, or PHQ-9 total"
        constraints: ">= 0"
      - name: outcome
        type: enum
        source: computed
        description: "Banded outcome; see calculations.screening_band_outcome"
        constraints: "PASS | REFER"
      - name: band_label
        type: enum
        source: computed
        description: "NORMAL when outcome == PASS, ABNORMAL when outcome == REFER"
        constraints: "NORMAL | ABNORMAL"
      - name: generated_referral_id
        type: string
        source: computed
        description: "FK -> Referral.id; the referral auto-created by a REFER outcome; null on PASS"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Screening lifecycle state; written only by the Screening state machine"
        default: RECORDED
        constraints: "RECORDED | CLOSED_PASS | REFERRED"

  - name: Referral
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the referred student"
      - name: source_screening_id
        type: string
        source: computed
        description: "FK -> Screening.id; set when the referral was auto-created by a REFER screening outcome; null for clinician-raised referrals"
        default: null
      - name: source_visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the encounter the referral was raised at; null when raised outside an encounter"
        default: null
      - name: requested_by_user_id
        type: string
        source: system
        description: "FK -> Clinician.id; X-User-ID of the requesting clinician, captured at creation. The closer must differ from this id."
      - name: specialty
        type: enum
        source: input
        description: "External specialty the student is referred to"
        constraints: "OPHTHALMOLOGY | AUDIOLOGY | DENTISTRY | BEHAVIORAL_HEALTH | PRIMARY_CARE | NUTRITION"
      - name: reason
        type: string
        source: input
        description: "Clinical reason for referral"
      - name: outreach_attempt_count
        type: integer
        source: computed
        description: "Number of outreach attempts logged; capped by MAX_OUTREACH_ATTEMPTS(3)"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Referral lifecycle state; written only by the Referral state machine"
        default: OPEN
        constraints: "OPEN | OUTREACH_IN_PROGRESS | SCHEDULED | REPORT_RECEIVED | CLOSED | LOST_TO_FOLLOW_UP"
      - name: report_received_date
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the external report-back was received"
        default: null
      - name: report_summary
        type: string
        source: input
        description: "External provider report text; required for loop closure"
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who closed the loop; segregation of duties requires closed_by_user_id != requested_by_user_id"
        default: null
      - name: closure_note
        type: string
        source: input
        description: "Free-text note captured on close"
        default: null

  - name: BillableCharge
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: computed
        description: "FK -> Visit.id; the encounter that minted this charge"
      - name: student_id
        type: string
        source: computed
        description: "FK -> Student.id; copied from the parent Visit at creation"
      - name: service_category
        type: enum
        source: computed
        description: "Billable service line; derived by visit_to_service_category"
        constraints: "ACUTE_OFFICE_VISIT | BEHAVIORAL_THERAPY | DENTAL_PREVENTIVE | SPORTS_PHYSICAL_EXAM | IMMUNIZATION_ADMIN | TELEHEALTH_ENCOUNTER"
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Fee-schedule amount for service_category, from domain_constants.fee_schedule"
      - name: payer_route
        type: enum
        source: computed
        description: "Snapshot of Student.payer_route taken at charge creation"
        constraints: "MEDICAID | PRIVATE_INSURANCE | SELF_PAY"
      - name: discount_tier_snapshot
        type: enum
        source: computed
        description: "Snapshot of Student.discount_tier taken at charge creation"
        constraints: "TIER_A | TIER_B | TIER_C | TIER_D | TIER_E"
      - name: provisional_patient_responsibility_cents
        type: integer
        source: computed
        description: "PROVISIONAL_GROSS_FIRST variant of calculations.charge_patient_responsibility, computed at charge creation"
        default: 0
      - name: final_patient_responsibility_cents
        type: integer
        source: computed
        description: "FINAL_NET_OF_PAYER variant, computed at adjudication; null until the charge is adjudicated"
        default: null
      - name: floor_adjustment_cents
        type: integer
        source: computed
        description: "Encounter-level nominal-fee top-up assigned to this charge by calculations.encounter_nominal_fee_floor"
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: "Operative amount owed by the family: (final_patient_responsibility_cents when non-null else provisional_patient_responsibility_cents) + floor_adjustment_cents"
        default: 0
      - name: payer_paid_amount_cents
        type: integer
        source: input
        description: "Amount the payer allowed, recorded at adjudication"
        default: 0
      - name: patient_paid_amount_cents
        type: integer
        source: input
        description: "Amount collected from the family"
        default: 0
      - name: write_off_amount_cents
        type: integer
        source: computed
        description: "Amount written off; set to gross_amount_cents - payer_paid_amount_cents - patient_responsibility_cents on the write-off transition"
        default: 0
      - name: appeal_count
        type: integer
        source: computed
        description: "Number of appeals filed on this charge; capped by MAX_CLAIM_APPEALS(2)"
        default: 0
      - name: denial_reason
        type: string
        source: input
        description: "Payer denial reason recorded at adjudication"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Charge lifecycle state; written only by the BillableCharge state machine"
        default: PENDING
        constraints: "PENDING | NO_CHARGE | CLAIM_SUBMITTED | CLAIM_DENIED | CLAIM_APPEALED | PAID | WRITTEN_OFF | REVERSED"

  - name: ParentNotification
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: computed
        description: "FK -> Student.id; the student the event concerns"
      - name: guardian_id
        type: string
        source: computed
        description: "FK -> Guardian.id; target chosen by calculations.notification_guardian_selection; null when the student has no guardian on file"
        default: null
      - name: visit_id
        type: string
        source: computed
        description: "FK -> Visit.id; the encounter that raised the event; null for events not anchored to an encounter"
        default: null
      - name: event_type
        type: enum
        source: computed
        description: "The domain event that raised this notification"
        constraints: "VISIT_COMPLETED | CLEARANCE_DETERMINED | CLEARANCE_VOIDED | REFERRAL_CREATED | IMMUNIZATION_NON_COMPLIANT"
      - name: status
        type: enum
        source: computed
        description: "Delivery lifecycle state; written only by the ParentNotification state machine"
        default: QUEUED
        constraints: "QUEUED | SENT | ACKNOWLEDGED | FAILED | UNDELIVERABLE | SUPPRESSED_CONFIDENTIAL | SUPPRESSED_OPT_OUT"
      - name: delivery_attempt_count
        type: integer
        source: computed
        description: "Number of delivery attempts logged; capped by MAX_NOTIFICATION_DELIVERY_ATTEMPTS(3)"
        default: 0
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into SENT; anchors NOTIFICATION_ACK_WINDOW_DAYS"
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into ACKNOWLEDGED"
        default: null
      - name: suppression_reason
        type: string
        source: computed
        description: "CONFIDENTIAL_SERVICE | GUARDIAN_OPT_OUT | NO_GUARDIAN_ON_FILE; null when the notification was not suppressed"
        default: null

  - name: TelehealthSession
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the TELEHEALTH visit this session delivers"
      - name: clinician_id
        type: string
        source: computed
        description: "FK -> Clinician.id; copied from the parent Visit; the buffered-overlap resource axis"
      - name: school_id
        type: string
        source: computed
        description: "FK -> School.id; copied from the parent Visit; the aggregate-capacity classroom/presenter resource axis"
      - name: start_at
        type: datetime
        source: input
        description: "Session start instant"
      - name: end_at
        type: datetime
        source: input
        description: "Session end instant; must be strictly after start_at"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between start_at and end_at; contributes to School.telehealth_booked_minutes_total while status IN {SCHEDULED, COMPLETED}"
      - name: reschedule_count
        type: integer
        source: computed
        description: "Number of NO_SHOW -> SCHEDULED reschedules applied to this row; capped by MAX_SESSION_RESCHEDULES(2)"
        default: 0
      - name: closure_reason
        type: string
        source: input
        description: "Free-text reason captured on close"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Session lifecycle state; written only by the TelehealthSession state machine"
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED"

  - name: AggregateReport
    parent: null
    common_fields: false
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; site filter applied to the report; null means all sites"
        default: null
      - name: visit_type_filter
        type: enum
        source: input
        description: "Visit type filter applied to the report; null means all visit types"
        default: null
        constraints: "ACUTE | BEHAVIORAL | DENTAL | SPORTS_PHYSICAL"
      - name: period_start_date
        type: string
        source: input
        description: "Inclusive first date of the reporting period, YYYY-MM-DD"
      - name: period_end_date
        type: string
        source: input
        description: "Inclusive last date of the reporting period, YYYY-MM-DD; must be >= period_start_date"
      - name: generated_at
        type: datetime
        source: system
        description: "Logical-clock instant the snapshot was taken"
      - name: total_visits
        type: integer
        source: computed
        description: "Count of Visit rows whose created_at date falls inside the period and that pass the filters"
        default: 0
      - name: scheduled_visit_count
        type: integer
        source: computed
        description: "In-period visits with clinical_status == SCHEDULED"
        default: 0
      - name: in_progress_visit_count
        type: integer
        source: computed
        description: "In-period visits with clinical_status == IN_PROGRESS"
        default: 0
      - name: completed_visit_count
        type: integer
        source: computed
        description: "In-period visits with clinical_status == COMPLETED"
        default: 0
      - name: cancelled_visit_count
        type: integer
        source: computed
        description: "In-period visits with clinical_status == CANCELLED"
        default: 0
      - name: no_show_visit_count
        type: integer
        source: computed
        description: "In-period visits with clinical_status == NO_SHOW"
        default: 0
      - name: gross_charge_total_cents
        type: integer
        source: computed
        description: "Sum of Visit.gross_charge_total_cents over the in-period visits"
        default: 0
      - name: no_charge_total_cents
        type: integer
        source: computed
        description: "Sum of Visit.no_charge_total_cents over the in-period visits"
        default: 0
      - name: patient_responsibility_total_cents
        type: integer
        source: computed
        description: "Sum of Visit.patient_responsibility_total_cents over the in-period visits"
        default: 0
      - name: write_off_total_cents
        type: integer
        source: computed
        description: "Sum of Visit.write_off_total_cents over the in-period visits"
        default: 0
      - name: payer_billed_total_cents
        type: integer
        source: computed
        description: "Sum of Visit.payer_billed_total_cents over the in-period visits"
        default: 0
      - name: referral_total_count
        type: integer
        source: computed
        description: "Count of Referral rows created inside the period for students with an in-period visit scope"
        default: 0
      - name: referral_closed_count
        type: integer
        source: computed
        description: "In-period referrals with status == CLOSED"
        default: 0
      - name: referral_lost_count
        type: integer
        source: computed
        description: "In-period referrals with status == LOST_TO_FOLLOW_UP"
        default: 0
      - name: referral_closure_rate_all
        type: number
        source: computed
        description: "DENOMINATOR_ALL variant of calculations.referral_closure_rate, 4 decimal places"
        default: 0.0000
      - name: referral_closure_rate_excluding_lost
        type: number
        source: computed
        description: "DENOMINATOR_EXCLUDING_LOST variant of calculations.referral_closure_rate, 4 decimal places"
        default: 0.0000
      - name: grace_compliance_count
        type: integer
        source: computed
        description: "GRACE_COUNTING variant of calculations.immunization_compliance_status: in-scope students whose status is COMPLIANT"
        default: 0
      - name: strict_compliance_count
        type: integer
        source: computed
        description: "STRICT_COUNTING variant: in-scope students that would be COMPLIANT with IMMUNIZATION_GRACE_DAYS removed and exemptions ignored"
        default: 0

# ===========================================================================
# §1.2 State Machine Table
# 11 machines; Visit is modelled as two independent parallel axes and so
# occupies two entries. Non-linear machines: School (cyclic),
# Enrollment (cyclic + capped), Visit (parallel axes), SportsPhysicalClearance
# (cyclic + capped), Referral (capped self-loop), BillableCharge (denial/appeal
# cycle), ParentNotification (capped retry self-loop), TelehealthSession
# (no-show/reschedule cycle).
# ===========================================================================
state_machines:

  - entity: School
    axis: program
    initial_state: ACTIVE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sbhc/schools/{id}/program-status with program_status = SUSPENDED"
        actor: SbhcAdmin
        preconditions:
          - "School.program_status == ACTIVE"
        side_effects:
          - "School.suspended_count increments by 1"
          - "School.version increments by 1"
        note: "While SUSPENDED, every enrollment activation, visit creation and telehealth session creation at this site is rejected with ERR_SCHOOL_SUSPENDED. Existing rows are untouched."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sbhc/schools/{id}/program-status with program_status = ACTIVE"
        actor: SbhcAdmin
        preconditions:
          - "School.program_status == SUSPENDED"
        side_effects:
          - "School.version increments by 1"
        note: "Cycle: a site may be suspended and reinstated any number of times."

  - entity: Enrollment
    axis: lifecycle
    initial_state: PENDING
    terminal_states: [TRANSFERRED]
    shape: cyclic
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /sbhc/students/{id}/enrollments"
        actor: Registrar
        preconditions:
          - "School.program_status == ACTIVE"
          - "school_year is one of SUPPORTED_SCHOOL_YEARS"
          - "expected_student_version == Student.version (OCC, §1.2.1 enrollment-create-stale-student)"
        side_effects:
          - "Any existing Enrollment for the same student_id and school_year with status IN {PENDING, ACTIVE} transitions to TRANSFERRED and records withdrawn_at = current_utc"
          - "Student.version increments by 1"
      - from: PENDING
        to: ACTIVE
        trigger: "POST /sbhc/enrollments/{id}/activate"
        actor: Registrar
        preconditions:
          - "Enrollment.status == PENDING"
          - "School.program_status == ACTIVE"
        side_effects:
          - "Enrollment.activated_at = current_utc"
          - "Student.immunization_compliance_status recomputed (calculations.immunization_compliance_status) because the PROVISIONAL window now has an anchor"
          - "Student.version increments by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /sbhc/enrollments/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "Enrollment.status == ACTIVE"
        side_effects:
          - "Enrollment.withdrawn_at = current_utc, Enrollment.withdrawal_reason = reason"
          - "Every Visit with enrollment_id == this Enrollment and clinical_status IN {SCHEDULED, IN_PROGRESS} transitions to CANCELLED"
          - "Every TelehealthSession whose visit was just cancelled and whose status == SCHEDULED transitions to CANCELLED, which decrements School.telehealth_booked_minutes_total by that session's duration_minutes"
          - "Student.immunization_compliance_status recomputed; Student.version increments by 1"
      - from: WITHDRAWN
        to: ACTIVE
        trigger: "POST /sbhc/enrollments/{id}/reinstate"
        actor: Registrar
        preconditions:
          - "Enrollment.status == WITHDRAWN"
          - "Enrollment.reinstated_count < MAX_ENROLLMENT_REINSTATEMENTS (2), else ERR_REINSTATEMENT_LIMIT_EXCEEDED"
          - "School.program_status == ACTIVE"
        side_effects:
          - "Enrollment.reinstated_count increments by 1"
          - "Enrollment.activated_at = current_utc (the PROVISIONAL window restarts from the reinstatement)"
          - "Enrollment.withdrawn_at = null"
          - "Student.immunization_compliance_status recomputed; Student.version increments by 1"
        note: "Cyclic ACTIVE -> WITHDRAWN -> ACTIVE, capped at 2 reinstatements per row."
      - from: PENDING
        to: TRANSFERRED
        trigger: "system, on creation of a newer Enrollment for the same student_id and school_year"
        actor: system
        preconditions:
          - "Enrollment.status == PENDING"
        side_effects:
          - "Enrollment.withdrawn_at = current_utc"
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "system, on creation of a newer Enrollment for the same student_id and school_year"
        actor: system
        preconditions:
          - "Enrollment.status == ACTIVE"
        side_effects:
          - "Enrollment.withdrawn_at = current_utc"
          - "Visits already anchored to this Enrollment keep their enrollment_id; they are NOT cancelled by a transfer"

  - entity: Consent
    axis: lifecycle
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED, SUPERSEDED]
    shape: branching
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /sbhc/students/{id}/consents"
        actor: Registrar | Student
        preconditions:
          - "granted_by == STUDENT_SELF requires category IN SELF_CONSENTABLE_CATEGORIES and student age_years >= SELF_CONSENT_MIN_AGE_YEARS (14, inclusive), else ERR_SELF_CONSENT_NOT_PERMITTED"
          - "granted_by == GUARDIAN requires granted_by_user_id to be a Guardian with student_id == path student"
          - "expected_student_version == Student.version (OCC, §1.2.1 consent-create-stale-student)"
        side_effects:
          - "Consent.effective_at = current_utc; Consent.expires_at = school-year end instant of school_year"
          - "Any existing Consent for the same student_id, category and school_year with status == ACTIVE transitions to SUPERSEDED"
          - "Student.version increments by 1"
        note: "Re-consent after revocation is exactly this transition executed again; the REVOKED row stays REVOKED."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /sbhc/consents/{id}/revoke"
        actor: Registrar | Guardian | Student
        preconditions:
          - "Consent.status == ACTIVE"
        side_effects:
          - "Consent.revoked_at = current_utc; Consent.revocation_reason = reason"
          - "CASCADE link 2: when category == TELEHEALTH, every TelehealthSession with status == SCHEDULED whose Visit.student_id == this student transitions to CANCELLED"
          - "CASCADE link 3: each such cancellation decrements School.telehealth_booked_minutes_total by that session's duration_minutes"
          - "CASCADE link 4: the Visit behind each cancelled session transitions clinical_status to CANCELLED when it is still SCHEDULED or IN_PROGRESS"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /sbhc/operations/daily-sweep"
        actor: system
        preconditions:
          - "Consent.status == ACTIVE"
          - "current_utc > Consent.expires_at (strictly after; at exactly expires_at the consent is still usable)"
        side_effects:
          - "no cascade; the consent simply stops authorizing new visits"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, on creation of a newer ACTIVE Consent for the same student_id, category and school_year"
        actor: system
        preconditions:
          - "Consent.status == ACTIVE"
        side_effects:
          - "Visits already anchored to this Consent keep their consent_id and their confidential flag"

  - entity: Visit
    axis: clinical
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    shape: parallel
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /sbhc/visits"
        actor: Clinician
        preconditions:
          - "School.program_status == ACTIVE, else ERR_SCHOOL_SUSPENDED"
          - "an Enrollment exists with student_id, school_id and school_year == current school year and status == ACTIVE, else ERR_ENROLLMENT_NOT_ACTIVE"
          - "a Consent exists for the required category with status == ACTIVE and current_utc <= expires_at, else ERR_CONSENT_REQUIRED"
          - "when delivery_mode == TELEHEALTH, an ACTIVE unexpired TELEHEALTH consent also exists, else ERR_TELEHEALTH_CONSENT_REQUIRED"
          - "Clinician.discipline == visit_type_to_clinician_discipline[visit_type], else ERR_DISCIPLINE_MISMATCH"
        side_effects:
          - "Visit.enrollment_id = the resolved ACTIVE Enrollment id"
          - "Visit.consent_id = the resolved governing Consent id"
          - "Visit.confidential = (governing Consent.granted_by == STUDENT_SELF)"
          - "Visit.billing_status = NOT_APPLICABLE"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /sbhc/visits/{id}/start"
        actor: Clinician
        preconditions:
          - "Visit.clinical_status == SCHEDULED"
          - "School.program_status == ACTIVE"
          - "the governing Consent still has status == ACTIVE and current_utc <= expires_at, else ERR_CONSENT_REQUIRED"
        side_effects:
          - "none beyond the state change"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /sbhc/visits/{id}/complete"
        actor: Clinician
        preconditions:
          - "Visit.clinical_status == IN_PROGRESS"
          - "when Visit.delivery_mode == TELEHEALTH, a TelehealthSession with visit_id == this visit and status == COMPLETED exists, else ERR_INVALID_STATE"
        side_effects:
          - "Visit.completed_at = current_utc; Visit.disposition = disposition"
          - "CASCADE link 1: one BillableCharge is minted for the visit's service_category, plus one IMMUNIZATION_ADMIN charge per ImmunizationDose with visit_id == this visit and status == VALID"
          - "CASCADE link 2: calculations.charge_patient_responsibility PROVISIONAL_GROSS_FIRST runs on each new charge"
          - "CASCADE link 3: calculations.encounter_nominal_fee_floor runs across the new charge set and may write floor_adjustment_cents onto exactly one charge"
          - "CASCADE link 4: Visit bucket totals are recomputed from the charge set and Visit.billing_status moves per the billing axis"
          - "one ParentNotification with event_type VISIT_COMPLETED is created per calculations.notification_guardian_selection; it is created directly in SUPPRESSED_CONFIDENTIAL when Visit.confidential == true"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sbhc/visits/{id}/close-unfulfilled with outcome = CANCELLED"
        actor: Clinician
        preconditions:
          - "Visit.clinical_status == SCHEDULED"
        side_effects:
          - "every TelehealthSession with visit_id == this visit and status == SCHEDULED transitions to CANCELLED, decrementing School.telehealth_booked_minutes_total"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /sbhc/visits/{id}/close-unfulfilled with outcome = CANCELLED"
        actor: Clinician
        preconditions:
          - "Visit.clinical_status == IN_PROGRESS"
        side_effects:
          - "every TelehealthSession with visit_id == this visit and status == SCHEDULED transitions to CANCELLED, decrementing School.telehealth_booked_minutes_total"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /sbhc/visits/{id}/close-unfulfilled with outcome = NO_SHOW"
        actor: Clinician
        preconditions:
          - "Visit.clinical_status == SCHEDULED"
          - "current_utc >= Visit.scheduled_start_at + NO_SHOW_GRACE_MINUTES (10, inclusive), else ERR_NO_SHOW_TOO_EARLY"
        side_effects:
          - "every TelehealthSession with visit_id == this visit and status == SCHEDULED transitions to NO_SHOW, decrementing School.telehealth_booked_minutes_total"

  - entity: Visit
    axis: billing
    initial_state: NOT_APPLICABLE
    terminal_states: [REVERSED]
    shape: compound
    transitions:
      - from: NOT_APPLICABLE
        to: PENDING_CHARGES
        trigger: "system, when POST /sbhc/visits/{id}/complete mints at least one charge whose status is not terminal"
        actor: system
        preconditions:
          - "at least one BillableCharge for this visit has status NOT IN {NO_CHARGE, PAID, WRITTEN_OFF, REVERSED}"
        side_effects:
          - "Visit bucket totals recomputed"
      - from: NOT_APPLICABLE
        to: CHARGES_POSTED
        trigger: "system, when POST /sbhc/visits/{id}/complete mints only terminal charges (e.g. every charge is IMMUNIZATION_ADMIN)"
        actor: system
        preconditions:
          - "every BillableCharge for this visit has status IN {NO_CHARGE, PAID, WRITTEN_OFF, REVERSED}"
          - "and NOT every charge of the visit is REVERSED — the all-REVERSED case is evaluated first and yields REVERSED instead"
        side_effects:
          - "Visit bucket totals recomputed"
      - from: PENDING_CHARGES
        to: CHARGES_POSTED
        trigger: "system, on any charge transition that leaves every charge of the visit terminal"
        actor: system
        preconditions:
          - "every BillableCharge for this visit has status IN {NO_CHARGE, PAID, WRITTEN_OFF, REVERSED}"
          - "and NOT every charge of the visit is REVERSED — the all-REVERSED case is evaluated first and yields REVERSED instead"
        side_effects:
          - "Visit bucket totals recomputed"
        note: "Bubble-up: the billing axis is a pure function of the child charge states and moves without any clinical-axis change."
      - from: PENDING_CHARGES
        to: REVERSED
        trigger: "system, on a charge transition that leaves every charge of the visit REVERSED"
        actor: system
        preconditions:
          - "every BillableCharge for this visit has status == REVERSED"
        side_effects:
          - "Visit bucket totals recomputed to zero on all five buckets"
      - from: CHARGES_POSTED
        to: REVERSED
        trigger: "system, on a charge transition that leaves every charge of the visit REVERSED"
        actor: system
        preconditions:
          - "every BillableCharge for this visit has status == REVERSED"
        side_effects:
          - "Visit bucket totals recomputed to zero on all five buckets"

  - entity: SportsPhysicalClearance
    axis: lifecycle
    initial_state: ACTIVE
    terminal_states: [VOIDED, EXPIRED, SUPERSEDED]
    shape: cyclic
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /sbhc/visits/{id}/sports-clearances with outcome IN {CLEARED, CLEARED_WITH_RESTRICTIONS, NOT_CLEARED}"
        actor: Clinician
        preconditions:
          - "Visit.visit_type == SPORTS_PHYSICAL and Visit.clinical_status IN {IN_PROGRESS, COMPLETED}, else ERR_INVALID_STATE"
          - "Student.immunization_compliance_status != NON_COMPLIANT, else ERR_IMMUNIZATION_NON_COMPLIANT"
          - "restrictions is non-null when outcome == CLEARED_WITH_RESTRICTIONS, else ERR_VALIDATION"
          - "expected_student_version == Student.version (OCC, §1.2.1 clearance-create-stale-student)"
        side_effects:
          - "determination_date = current logical clock date; unrestricted_valid_until and valid_until computed by calculations.clearance_validity_window"
          - "Any existing SportsPhysicalClearance for the same student_id and school_year with status IN {ACTIVE, PENDING_REEVALUATION} transitions to SUPERSEDED"
          - "Student.version increments by 1"
          - "one ParentNotification with event_type CLEARANCE_DETERMINED is created; created directly in SUPPRESSED_CONFIDENTIAL when Visit.confidential == true"
      - from: null
        to: PENDING_REEVALUATION
        trigger: "POST /sbhc/visits/{id}/sports-clearances with outcome = DEFERRED"
        actor: Clinician
        preconditions:
          - "same preconditions as the ACTIVE creation transition"
        side_effects:
          - "determination_date = current logical clock date; unrestricted_valid_until = null and valid_until = null"
          - "Any existing SportsPhysicalClearance for the same student_id and school_year with status IN {ACTIVE, PENDING_REEVALUATION} transitions to SUPERSEDED"
          - "Student.version increments by 1"
          - "one ParentNotification with event_type CLEARANCE_DETERMINED is created, subject to the same suppression rules"
      - from: PENDING_REEVALUATION
        to: PENDING_REEVALUATION
        trigger: "POST /sbhc/sports-clearances/{id}/re-evaluate with outcome = DEFERRED"
        actor: Clinician
        preconditions:
          - "SportsPhysicalClearance.status == PENDING_REEVALUATION"
          - "reevaluation_count < MAX_DEFERRAL_REEVALUATIONS (2), else ERR_REEVALUATION_LIMIT_EXCEEDED"
          - "current clock date <= determination_date + DEFERRAL_REEVALUATION_WINDOW_DAYS (30, inclusive), else ERR_INVALID_STATE"
        side_effects:
          - "reevaluation_count increments by 1; determination_date reset to the current clock date (the 30-day window restarts)"
        note: "Self-loop cycle capped at 2 re-evaluations."
      - from: PENDING_REEVALUATION
        to: ACTIVE
        trigger: "POST /sbhc/sports-clearances/{id}/re-evaluate with outcome IN {CLEARED, CLEARED_WITH_RESTRICTIONS, NOT_CLEARED}"
        actor: Clinician
        preconditions:
          - "SportsPhysicalClearance.status == PENDING_REEVALUATION"
          - "reevaluation_count < MAX_DEFERRAL_REEVALUATIONS (2), else ERR_REEVALUATION_LIMIT_EXCEEDED"
          - "current clock date <= determination_date + DEFERRAL_REEVALUATION_WINDOW_DAYS (30, inclusive), else ERR_INVALID_STATE"
          - "Student.immunization_compliance_status != NON_COMPLIANT, else ERR_IMMUNIZATION_NON_COMPLIANT"
        side_effects:
          - "reevaluation_count increments by 1; outcome and determination_date updated; validity window recomputed by calculations.clearance_validity_window"
      - from: ACTIVE
        to: VOIDED
        trigger: "system, on Student.immunization_compliance_status becoming NON_COMPLIANT, or on creation of a Referral with source_screening_id != null for this student"
        actor: system
        preconditions:
          - "SportsPhysicalClearance.status == ACTIVE"
        side_effects:
          - "void_reason = IMMUNIZATION_COMPLIANCE_LOST or SCREENING_REFERRAL_RAISED"
          - "CASCADE next link: one ParentNotification with event_type CLEARANCE_VOIDED is created"
      - from: PENDING_REEVALUATION
        to: VOIDED
        trigger: "system, on Student.immunization_compliance_status becoming NON_COMPLIANT, or on creation of a Referral with source_screening_id != null for this student"
        actor: system
        preconditions:
          - "SportsPhysicalClearance.status == PENDING_REEVALUATION"
        side_effects:
          - "void_reason = IMMUNIZATION_COMPLIANCE_LOST or SCREENING_REFERRAL_RAISED"
          - "CASCADE next link: one ParentNotification with event_type CLEARANCE_VOIDED is created"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /sbhc/operations/daily-sweep"
        actor: system
        preconditions:
          - "SportsPhysicalClearance.status == ACTIVE and valid_until != null"
          - "current clock date > valid_until (strictly after; on valid_until itself the clearance is still ACTIVE)"
        side_effects:
          - "no notification is raised by expiry"
      - from: PENDING_REEVALUATION
        to: EXPIRED
        trigger: "POST /sbhc/operations/daily-sweep"
        actor: system
        preconditions:
          - "SportsPhysicalClearance.status == PENDING_REEVALUATION"
          - "current clock date > determination_date + DEFERRAL_REEVALUATION_WINDOW_DAYS (30, strictly after)"
        side_effects:
          - "the deferral loop is abandoned; a new clearance must be created from a new visit"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, on creation of a newer clearance for the same student_id and school_year"
        actor: system
        preconditions:
          - "SportsPhysicalClearance.status == ACTIVE"
        side_effects:
          - "none"
      - from: PENDING_REEVALUATION
        to: SUPERSEDED
        trigger: "system, on creation of a newer clearance for the same student_id and school_year"
        actor: system
        preconditions:
          - "SportsPhysicalClearance.status == PENDING_REEVALUATION"
        side_effects:
          - "none"

  - entity: ImmunizationDose
    axis: validity
    initial_state: VALID
    terminal_states: [VOIDED]
    shape: branching
    transitions:
      - from: null
        to: VALID
        trigger: "POST /sbhc/students/{id}/immunization-doses when administered_date >= earliest_valid_date"
        actor: Clinician
        preconditions:
          - "dose_number == (highest dose_number among VALID doses of the same student and series) + 1, else ERR_DOSE_SEQUENCE"
          - "no VALID dose already exists for the same student, series_code and dose_number, else ERR_DUPLICATE_DOSE"
          - "administered_date <= current clock date, else ERR_VALIDATION"
        side_effects:
          - "earliest_valid_date and strict_earliest_valid_date computed by calculations.immunization_dose_validity"
          - "Student dose counters recomputed; Student.immunization_compliance_status recomputed; Student.version increments by 1"
          - "if the recomputed compliance is NON_COMPLIANT, the compliance cascade fires (clearance void chain)"
      - from: null
        to: INVALID_TOO_EARLY
        trigger: "POST /sbhc/students/{id}/immunization-doses when administered_date < earliest_valid_date"
        actor: Clinician
        preconditions:
          - "same preconditions as the VALID creation transition"
        side_effects:
          - "invalid_reason = MIN_AGE_NOT_MET for dose_number == 1, MIN_INTERVAL_NOT_MET otherwise"
          - "the dose does NOT count toward the series; Student counters and compliance recomputed; Student.version increments by 1"
        note: "A too-early dose is recorded, not rejected — recording it is what makes the STRICT vs GRACE compliance variants observable."
      - from: VALID
        to: VOIDED
        trigger: "POST /sbhc/immunization-doses/{id}/void"
        actor: Clinician
        preconditions:
          - "ImmunizationDose.status == VALID"
        side_effects:
          - "CASCADE link 1: this dose becomes VOIDED and stops counting"
          - "CASCADE link 2: because this dose is no longer VALID, every later dose of the same student and series is re-evaluated; a dose whose VALID predecessor disappeared moves VALID -> INVALID_TOO_EARLY with invalid_reason = PREDECESSOR_VOIDED"
          - "CASCADE link 3: Student.immunization_compliance_status is recomputed from the new dose statuses and may become NON_COMPLIANT; Student.version increments by 1"
          - "CASCADE link 4 (only when link 3 produced NON_COMPLIANT): the student's SportsPhysicalClearance with status IN {ACTIVE, PENDING_REEVALUATION} transitions to VOIDED with void_reason = IMMUNIZATION_COMPLIANCE_LOST"
          - "CASCADE link 5: the clearance void creates one ParentNotification with event_type CLEARANCE_VOIDED"
          - "ordering: the IMMUNIZATION_NON_COMPLIANT notification raised by link 3 is created BEFORE the CLEARANCE_VOIDED notification raised by link 5"
      - from: INVALID_TOO_EARLY
        to: VOIDED
        trigger: "POST /sbhc/immunization-doses/{id}/void"
        actor: Clinician
        preconditions:
          - "ImmunizationDose.status == INVALID_TOO_EARLY"
        side_effects:
          - "Student counters recomputed; compliance recomputed; Student.version increments by 1"
      - from: VALID
        to: INVALID_TOO_EARLY
        trigger: "system, when the VALID predecessor dose of the same student and series is voided"
        actor: system
        preconditions:
          - "ImmunizationDose.status == VALID and dose_number > 1"
          - "no VALID dose with dose_number == this dose_number - 1 remains for the same student and series"
        side_effects:
          - "invalid_reason = PREDECESSOR_VOIDED; earliest_valid_date is left at its recorded value"

  - entity: Screening
    axis: lifecycle
    initial_state: RECORDED
    terminal_states: [CLOSED_PASS, REFERRED]
    shape: branching
    transitions:
      - from: RECORDED
        to: CLOSED_PASS
        trigger: "system, inside POST /sbhc/visits/{id}/screenings when calculations.screening_band_outcome yields PASS"
        actor: system
        preconditions:
          - "Visit.clinical_status IN {IN_PROGRESS, COMPLETED}"
        side_effects:
          - "outcome = PASS; band_label = NORMAL; generated_referral_id stays null"
      - from: RECORDED
        to: REFERRED
        trigger: "system, inside POST /sbhc/visits/{id}/screenings when calculations.screening_band_outcome yields REFER"
        actor: system
        preconditions:
          - "Visit.clinical_status IN {IN_PROGRESS, COMPLETED}"
        side_effects:
          - "outcome = REFER; band_label = ABNORMAL"
          - "CASCADE link 2: one Referral is auto-created in OPEN with source_screening_id = this screening, source_visit_id = the visit, specialty from screening_instrument_to_referral_specialty and requested_by_user_id = the acting clinician; Screening.generated_referral_id is set to it"
          - "CASCADE link 3: because a Referral with source_screening_id != null now exists, the student's SportsPhysicalClearance with status IN {ACTIVE, PENDING_REEVALUATION} transitions to VOIDED with void_reason = SCREENING_REFERRAL_RAISED"
          - "CASCADE link 4: the clearance void creates one ParentNotification with event_type CLEARANCE_VOIDED"
          - "the REFERRAL_CREATED notification raised directly by link 2 is created BEFORE the CLEARANCE_VOIDED notification raised by link 4"

  - entity: Referral
    axis: lifecycle
    initial_state: OPEN
    terminal_states: [CLOSED, LOST_TO_FOLLOW_UP]
    shape: cyclic
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /sbhc/students/{id}/referrals, or system auto-creation from a REFER screening"
        actor: Clinician | system
        preconditions:
          - "an Enrollment exists for the student with status == ACTIVE, else ERR_ENROLLMENT_NOT_ACTIVE"
        side_effects:
          - "requested_by_user_id = X-User-ID of the acting clinician"
          - "one ParentNotification with event_type REFERRAL_CREATED is created, subject to the confidential and opt-out suppression rules"
          - "when source_screening_id != null, the clearance-void cascade fires"
      - from: OPEN
        to: OUTREACH_IN_PROGRESS
        trigger: "POST /sbhc/referrals/{id}/outreach-attempts with outcome = NO_ANSWER"
        actor: CareCoordinator
        preconditions:
          - "Referral.status == OPEN"
          - "outreach_attempt_count < MAX_OUTREACH_ATTEMPTS (3), else ERR_OUTREACH_LIMIT_EXCEEDED"
        side_effects:
          - "outreach_attempt_count increments by 1"
      - from: OUTREACH_IN_PROGRESS
        to: OUTREACH_IN_PROGRESS
        trigger: "POST /sbhc/referrals/{id}/outreach-attempts with outcome = NO_ANSWER while outreach_attempt_count + 1 < MAX_OUTREACH_ATTEMPTS"
        actor: CareCoordinator
        preconditions:
          - "Referral.status == OUTREACH_IN_PROGRESS"
          - "outreach_attempt_count < MAX_OUTREACH_ATTEMPTS - 1 (i.e. < 2)"
        side_effects:
          - "outreach_attempt_count increments by 1"
        note: "Self-loop; the loop is capped so the 3rd NO_ANSWER exits to LOST_TO_FOLLOW_UP instead of looping again."
      - from: OUTREACH_IN_PROGRESS
        to: LOST_TO_FOLLOW_UP
        trigger: "POST /sbhc/referrals/{id}/outreach-attempts with outcome = NO_ANSWER on the attempt that reaches MAX_OUTREACH_ATTEMPTS"
        actor: CareCoordinator
        preconditions:
          - "Referral.status == OUTREACH_IN_PROGRESS"
          - "outreach_attempt_count == MAX_OUTREACH_ATTEMPTS - 1 (i.e. == 2)"
        side_effects:
          - "outreach_attempt_count increments to 3; the referral becomes terminal"
        note: "A further outreach attempt on this terminal row returns ERR_OUTREACH_LIMIT_EXCEEDED, not ERR_INVALID_STATE, because §1.4 rung 16 is evaluated above rung 17."
      - from: OPEN
        to: SCHEDULED
        trigger: "POST /sbhc/referrals/{id}/outreach-attempts with outcome = REACHED"
        actor: CareCoordinator
        preconditions:
          - "Referral.status == OPEN"
          - "outreach_attempt_count < MAX_OUTREACH_ATTEMPTS (3)"
        side_effects:
          - "outreach_attempt_count increments by 1"
      - from: OUTREACH_IN_PROGRESS
        to: SCHEDULED
        trigger: "POST /sbhc/referrals/{id}/outreach-attempts with outcome = REACHED"
        actor: CareCoordinator
        preconditions:
          - "Referral.status == OUTREACH_IN_PROGRESS"
          - "outreach_attempt_count < MAX_OUTREACH_ATTEMPTS (3)"
        side_effects:
          - "outreach_attempt_count increments by 1"
      - from: SCHEDULED
        to: REPORT_RECEIVED
        trigger: "POST /sbhc/referrals/{id}/report-back"
        actor: CareCoordinator
        preconditions:
          - "Referral.status == SCHEDULED"
          - "report_received_date <= current clock date, else ERR_VALIDATION"
        side_effects:
          - "report_summary and report_received_date stored; loop closure is now permitted"
      - from: REPORT_RECEIVED
        to: CLOSED
        trigger: "POST /sbhc/referrals/{id}/close"
        actor: CareCoordinator | Clinician
        preconditions:
          - "Referral.status == REPORT_RECEIVED"
          - "X-User-ID != Referral.requested_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "closed_by_user_id = X-User-ID; closure_note stored"

  - entity: BillableCharge
    axis: lifecycle
    initial_state: PENDING
    terminal_states: [NO_CHARGE, PAID, WRITTEN_OFF, REVERSED]
    shape: cyclic
    transitions:
      - from: null
        to: NO_CHARGE
        trigger: "system, inside POST /sbhc/visits/{id}/complete when service_category IN NO_CHARGE_SERVICE_CATEGORIES"
        actor: system
        preconditions:
          - "service_category == IMMUNIZATION_ADMIN"
        side_effects:
          - "provisional_patient_responsibility_cents = 0; patient_responsibility_cents = 0; the charge is excluded from the encounter nominal-fee floor"
          - "gross_amount_cents still counts toward Visit.gross_charge_total_cents and Visit.no_charge_total_cents"
        note: "Always no-charge regardless of discount tier and payer route."
      - from: null
        to: PENDING
        trigger: "system, inside POST /sbhc/visits/{id}/complete for every other service_category"
        actor: system
        preconditions:
          - "service_category NOT IN NO_CHARGE_SERVICE_CATEGORIES"
        side_effects:
          - "payer_route and discount_tier_snapshot copied from the Student"
          - "provisional_patient_responsibility_cents computed by calculations.charge_patient_responsibility variant PROVISIONAL_GROSS_FIRST"
      - from: PENDING
        to: CLAIM_SUBMITTED
        trigger: "POST /sbhc/charges/{id}/submit-claim"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == PENDING"
          - "payer_route IN {MEDICAID, PRIVATE_INSURANCE}, else ERR_CLAIM_NOT_APPLICABLE"
        side_effects:
          - "none beyond the state change"
      - from: PENDING
        to: PAID
        trigger: "POST /sbhc/charges/{id}/record-patient-payment"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == PENDING"
          - "payer_route == SELF_PAY, else ERR_CLAIM_NOT_APPLICABLE"
          - "amount_cents == BillableCharge.patient_responsibility_cents exactly, else ERR_PAYMENT_AMOUNT_MISMATCH"
        side_effects:
          - "patient_paid_amount_cents = amount_cents"
          - "Visit bucket totals recomputed; the Visit billing axis may bubble up to CHARGES_POSTED"
      - from: CLAIM_SUBMITTED
        to: PAID
        trigger: "POST /sbhc/charges/{id}/adjudicate with outcome = PAID"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == CLAIM_SUBMITTED"
          - "0 <= payer_paid_amount_cents <= gross_amount_cents, else ERR_VALIDATION"
        side_effects:
          - "payer_paid_amount_cents stored"
          - "final_patient_responsibility_cents computed by calculations.charge_patient_responsibility variant FINAL_NET_OF_PAYER"
          - "patient_responsibility_cents switched to the final value and calculations.encounter_nominal_fee_floor re-run over the visit"
          - "Visit bucket totals recomputed; the Visit billing axis may bubble up to CHARGES_POSTED"
      - from: CLAIM_SUBMITTED
        to: CLAIM_DENIED
        trigger: "POST /sbhc/charges/{id}/adjudicate with outcome = DENIED"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == CLAIM_SUBMITTED"
          - "denial_reason is non-null, else ERR_VALIDATION"
        side_effects:
          - "denial_reason stored; payer_paid_amount_cents forced to 0"
      - from: CLAIM_DENIED
        to: CLAIM_APPEALED
        trigger: "POST /sbhc/charges/{id}/appeal"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == CLAIM_DENIED"
          - "appeal_count < MAX_CLAIM_APPEALS (2), else ERR_APPEAL_LIMIT_EXCEEDED"
        side_effects:
          - "appeal_count increments by 1"
      - from: CLAIM_APPEALED
        to: CLAIM_DENIED
        trigger: "POST /sbhc/charges/{id}/adjudicate with outcome = DENIED"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == CLAIM_APPEALED"
          - "denial_reason is non-null, else ERR_VALIDATION"
        side_effects:
          - "denial_reason stored"
        note: "Cycle CLAIM_DENIED -> CLAIM_APPEALED -> CLAIM_DENIED, capped at MAX_CLAIM_APPEALS(2) appeals."
      - from: CLAIM_APPEALED
        to: PAID
        trigger: "POST /sbhc/charges/{id}/adjudicate with outcome = PAID"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == CLAIM_APPEALED"
          - "0 <= payer_paid_amount_cents <= gross_amount_cents, else ERR_VALIDATION"
        side_effects:
          - "same side effects as the CLAIM_SUBMITTED -> PAID transition"
      - from: CLAIM_DENIED
        to: WRITTEN_OFF
        trigger: "POST /sbhc/charges/{id}/write-off"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == CLAIM_DENIED"
          - "appeal_count == MAX_CLAIM_APPEALS (2), else ERR_WRITE_OFF_NOT_PERMITTED"
        side_effects:
          - "write_off_amount_cents = gross_amount_cents - payer_paid_amount_cents - patient_responsibility_cents"
          - "Visit bucket totals recomputed; the charge-bucket identity still holds"
      - from: PENDING
        to: REVERSED
        trigger: "POST /sbhc/charges/{id}/reverse"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == PENDING"
        side_effects:
          - "the charge leaves every Visit bucket; floor_adjustment_cents is cleared and calculations.encounter_nominal_fee_floor is re-run across the surviving charges"
          - "Visit bucket totals recomputed; the conserved residual stays 0"
      - from: CLAIM_SUBMITTED
        to: REVERSED
        trigger: "POST /sbhc/charges/{id}/reverse"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == CLAIM_SUBMITTED"
        side_effects:
          - "same compensating side effects as the PENDING -> REVERSED transition"
      - from: CLAIM_DENIED
        to: REVERSED
        trigger: "POST /sbhc/charges/{id}/reverse"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == CLAIM_DENIED"
        side_effects:
          - "same compensating side effects as the PENDING -> REVERSED transition"
      - from: CLAIM_APPEALED
        to: REVERSED
        trigger: "POST /sbhc/charges/{id}/reverse"
        actor: BillingSpecialist
        preconditions:
          - "BillableCharge.status == CLAIM_APPEALED"
        side_effects:
          - "same compensating side effects as the PENDING -> REVERSED transition"

  - entity: ParentNotification
    axis: delivery
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, UNDELIVERABLE, SUPPRESSED_CONFIDENTIAL, SUPPRESSED_OPT_OUT]
    shape: cyclic
    transitions:
      - from: null
        to: QUEUED
        trigger: "system, on any notification-raising event when the selected guardian exists and has notification_opt_out == false and the raising Visit is not confidential"
        actor: system
        preconditions:
          - "calculations.notification_guardian_selection returned a guardian"
        side_effects:
          - "delivery_attempt_count = 0"
      - from: null
        to: SUPPRESSED_CONFIDENTIAL
        trigger: "system, on any notification-raising event whose originating Visit has confidential == true"
        actor: system
        preconditions:
          - "Visit.confidential == true (the governing Consent was granted_by STUDENT_SELF)"
        side_effects:
          - "suppression_reason = CONFIDENTIAL_SERVICE; the record exists for audit but is never delivered"
        note: "Branch-asymmetric side effect: the identical event on a guardian-consented visit produces a QUEUED notification."
      - from: null
        to: SUPPRESSED_OPT_OUT
        trigger: "system, when the selected guardian has notification_opt_out == true and the visit is not confidential"
        actor: system
        preconditions:
          - "selected Guardian.notification_opt_out == true"
        side_effects:
          - "suppression_reason = GUARDIAN_OPT_OUT"
      - from: null
        to: UNDELIVERABLE
        trigger: "system, when the student has no Guardian on file"
        actor: system
        preconditions:
          - "the guardian candidate set for the student is empty"
        side_effects:
          - "guardian_id = null; suppression_reason = NO_GUARDIAN_ON_FILE"
      - from: QUEUED
        to: SENT
        trigger: "POST /sbhc/notifications/{id}/deliver with outcome = DELIVERED"
        actor: SbhcAdmin
        preconditions:
          - "ParentNotification.status == QUEUED"
          - "delivery_attempt_count < MAX_NOTIFICATION_DELIVERY_ATTEMPTS (3), else ERR_DELIVERY_ATTEMPTS_EXHAUSTED"
        side_effects:
          - "delivery_attempt_count increments by 1; sent_at = current_utc"
      - from: QUEUED
        to: FAILED
        trigger: "POST /sbhc/notifications/{id}/deliver with outcome = FAILED"
        actor: SbhcAdmin
        preconditions:
          - "ParentNotification.status == QUEUED"
          - "delivery_attempt_count < MAX_NOTIFICATION_DELIVERY_ATTEMPTS (3)"
        side_effects:
          - "delivery_attempt_count increments by 1"
      - from: FAILED
        to: FAILED
        trigger: "POST /sbhc/notifications/{id}/deliver with outcome = FAILED while delivery_attempt_count + 1 < MAX_NOTIFICATION_DELIVERY_ATTEMPTS"
        actor: SbhcAdmin
        preconditions:
          - "ParentNotification.status == FAILED"
          - "delivery_attempt_count < MAX_NOTIFICATION_DELIVERY_ATTEMPTS - 1 (i.e. < 2)"
        side_effects:
          - "delivery_attempt_count increments by 1"
        note: "Capped retry self-loop."
      - from: FAILED
        to: UNDELIVERABLE
        trigger: "POST /sbhc/notifications/{id}/deliver with outcome = FAILED on the attempt that reaches MAX_NOTIFICATION_DELIVERY_ATTEMPTS"
        actor: SbhcAdmin
        preconditions:
          - "ParentNotification.status == FAILED"
          - "delivery_attempt_count == MAX_NOTIFICATION_DELIVERY_ATTEMPTS - 1 (i.e. == 2)"
        side_effects:
          - "delivery_attempt_count increments to 3; suppression_reason stays null"
        note: "A further delivery attempt on this terminal row returns ERR_DELIVERY_ATTEMPTS_EXHAUSTED, not ERR_INVALID_STATE, because §1.4 rung 16 is evaluated above rung 17."
      - from: FAILED
        to: SENT
        trigger: "POST /sbhc/notifications/{id}/deliver with outcome = DELIVERED"
        actor: SbhcAdmin
        preconditions:
          - "ParentNotification.status == FAILED"
          - "delivery_attempt_count < MAX_NOTIFICATION_DELIVERY_ATTEMPTS (3)"
        side_effects:
          - "delivery_attempt_count increments by 1; sent_at = current_utc"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /sbhc/notifications/{id}/acknowledge"
        actor: Guardian
        preconditions:
          - "ParentNotification.status == SENT"
          - "X-User-ID == ParentNotification.guardian_id, else ERR_OWNERSHIP_VIOLATION"
          - "current_utc <= sent_at + NOTIFICATION_ACK_WINDOW_DAYS (14 days, inclusive), else ERR_ACK_WINDOW_EXPIRED"
        side_effects:
          - "acknowledged_at = current_utc"

  - entity: TelehealthSession
    axis: lifecycle
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    shape: cyclic
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /sbhc/telehealth-sessions"
        actor: Clinician
        preconditions:
          - "Visit.delivery_mode == TELEHEALTH and Visit.clinical_status IN {SCHEDULED, IN_PROGRESS}, else ERR_INVALID_STATE"
          - "School.program_status == ACTIVE, else ERR_SCHOOL_SUSPENDED"
          - "an ACTIVE unexpired TELEHEALTH Consent exists for the student, else ERR_TELEHEALTH_CONSENT_REQUIRED"
          - "end_at strictly after start_at and TELEHEALTH_MIN_DURATION_MINUTES (15) <= duration_minutes <= TELEHEALTH_MAX_DURATION_MINUTES (60), else ERR_INVALID_SESSION_WINDOW"
          - "no clinician buffered-overlap conflict per calculations.telehealth_resource_conflict, else ERR_CLINICIAN_SLOT_CONFLICT"
          - "school aggregate capacity not exceeded per calculations.telehealth_resource_conflict, else ERR_SCHOOL_CAPACITY_EXCEEDED"
        side_effects:
          - "clinician_id and school_id copied from the Visit; duration_minutes computed"
          - "School.telehealth_booked_minutes_total increments by duration_minutes; School.version increments by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /sbhc/telehealth-sessions/{id}/complete"
        actor: Clinician
        preconditions:
          - "TelehealthSession.status == SCHEDULED"
        side_effects:
          - "School.telehealth_booked_minutes_total unchanged (COMPLETED sessions keep their booking)"
          - "the parent Visit may now be completed"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /sbhc/telehealth-sessions/{id}/close with outcome = NO_SHOW"
        actor: Clinician
        preconditions:
          - "TelehealthSession.status == SCHEDULED"
          - "current_utc >= start_at + NO_SHOW_GRACE_MINUTES (10, inclusive), else ERR_NO_SHOW_TOO_EARLY"
        side_effects:
          - "School.telehealth_booked_minutes_total decrements by duration_minutes; School.version increments by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sbhc/telehealth-sessions/{id}/close with outcome = CANCELLED"
        actor: Clinician
        preconditions:
          - "TelehealthSession.status == SCHEDULED"
        side_effects:
          - "School.telehealth_booked_minutes_total decrements by duration_minutes; School.version increments by 1"
        note: "Compensating action for the create transition — the conserved quantity returns to its pre-create value."
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /sbhc/telehealth-sessions/{id}/reschedule"
        actor: Clinician
        preconditions:
          - "TelehealthSession.status == NO_SHOW"
          - "reschedule_count < MAX_SESSION_RESCHEDULES (2), else ERR_RESCHEDULE_LIMIT_EXCEEDED"
          - "the new window passes the same duration, clinician-buffer and school-capacity checks as creation"
        side_effects:
          - "start_at, end_at and duration_minutes replaced; reschedule_count increments by 1"
          - "School.telehealth_booked_minutes_total increments by the NEW duration_minutes; School.version increments by 1"
        note: "Cycle SCHEDULED -> NO_SHOW -> SCHEDULED, capped at 2 reschedules."
      - from: NO_SHOW
        to: CANCELLED
        trigger: "POST /sbhc/telehealth-sessions/{id}/close with outcome = CANCELLED"
        actor: Clinician
        preconditions:
          - "TelehealthSession.status == NO_SHOW"
        side_effects:
          - "School.telehealth_booked_minutes_total unchanged (the NO_SHOW transition already removed the booking)"

# ===========================================================================
# §1.2.1 Concurrency Rules — OCC on Student.version only.
# Every rule below is a CREATE-with-supersede: the new row legitimately
# supersedes the prior one, so a strictly-sequential second request would
# itself succeed under the product semantics. That is what makes it a true
# race rather than a state precondition in disguise.
# ===========================================================================
concurrency_rules:
  - rule_id: consent-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /sbhc/students/{id}/consents"
    occ_field: "expected_student_version"
    description: |
      Granting a Consent against a Student whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already granted a consent in the same category and school year
      (which legitimately supersedes the prior one per the Consent state
      machine) and the current writer's view of the student is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enrollment-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /sbhc/students/{id}/enrollments"
    occ_field: "expected_student_version"
    description: |
      Creating an Enrollment against a Student whose version has advanced since
      the client last observed it is rejected. A new enrollment for the same
      school year legitimately transfers the prior one to TRANSFERRED, so the
      losing writer would otherwise silently move the student to a different
      site on top of a view of the record that is already out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: clearance-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /sbhc/visits/{id}/sports-clearances"
    occ_field: "expected_student_version"
    description: |
      Recording a sports-physical determination against a Student whose version
      has advanced since the client last observed it is rejected. A new
      clearance legitimately supersedes the student's prior clearance for the
      same school year, and the student's version also advances whenever the
      immunization compliance posture that gates clearance changes, so a stale
      view may no longer justify the determination being recorded.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# 12 rules; 4 carry two variants that produce different numbers from the same
# stored data (charge_patient_responsibility, immunization_compliance_status,
# clearance_validity_window, referral_closure_rate).
# ===========================================================================
calculations:

  - name: fpl_percent_and_discount_tier
    trigger: "PATCH /sbhc/students/{id}/financial-profile — writes Student.fpl_percent and Student.discount_tier"
    algorithm: tiered_pricing
    formula: |
      fpl_threshold_cents = FPL_BASE_ANNUAL_CENTS
                          + (household_size - 1) * FPL_INCREMENT_PER_ADDITIONAL_PERSON_CENTS
      raw_percent  = (household_income_annual_cents * 100) / fpl_threshold_cents      # exact rational, no truncation
      fpl_percent  = round_half_up(raw_percent, 2)                                    # STEP 1: round FIRST
      # STEP 2: select the tier using the ROUNDED value. This order is pinned:
      # raw 100.0000641 rounds to 100.00 and therefore lands in TIER_A, not TIER_B.
      discount_tier = TIER_A when fpl_percent <= 100.00                               # inclusive
                      TIER_B when 100.00 <  fpl_percent <= 138.00
                      TIER_C when 138.00 <  fpl_percent <= 175.00
                      TIER_D when 175.00 <  fpl_percent <= 200.00
                      TIER_E when fpl_percent >  200.00                               # strictly greater
      discount_pct  = DISCOUNT_PCT_TIER_<letter>
    input_set: "Student.household_income_annual_cents and Student.household_size as most recently written by the financial-profile endpoint. No other entity participates."
    constants:
      FPL_BASE_ANNUAL_CENTS: 1560000
      FPL_INCREMENT_PER_ADDITIONAL_PERSON_CENTS: 550000
      TIER_A_MAX_FPL_PERCENT: 100.00
      TIER_B_MAX_FPL_PERCENT: 138.00
      TIER_C_MAX_FPL_PERCENT: 175.00
      TIER_D_MAX_FPL_PERCENT: 200.00
      DISCOUNT_PCT_TIER_A: 1.00
      DISCOUNT_PCT_TIER_B: 0.80
      DISCOUNT_PCT_TIER_C: 0.60
      DISCOUNT_PCT_TIER_D: 0.40
      DISCOUNT_PCT_TIER_E: 0.00
    precision: "fpl_percent: 2 decimal places, round_half_up. Tier selection consumes the rounded value."
    combinatorial_mode: "(b) nested rounding where the order matters — round-then-band vs band-then-round diverge at the tier edges"

  - name: charge_patient_responsibility
    trigger: "system, inside POST /sbhc/visits/{id}/complete (PROVISIONAL) and inside POST /sbhc/charges/{id}/adjudicate with outcome = PAID (FINAL) — writes BillableCharge.provisional_patient_responsibility_cents, .final_patient_responsibility_cents and .patient_responsibility_cents"
    algorithm: waterfall_allocation
    formula: |
      discount_pct = DISCOUNT_PCT_TIER_<discount_tier_snapshot>
      # --- variant PROVISIONAL_GROSS_FIRST (charge creation) ---
      base_provisional = 0                     when service_category IN NO_CHARGE_SERVICE_CATEGORIES
                       = 0                     when payer_route == MEDICAID
                       = PRIVATE_COPAY_CENTS   when payer_route == PRIVATE_INSURANCE
                       = gross_amount_cents    when payer_route == SELF_PAY
      provisional_patient_responsibility_cents = round_half_up(base_provisional * (1 - discount_pct), 0)
      # --- variant FINAL_NET_OF_PAYER (adjudication with outcome = PAID) ---
      residual   = max(0, gross_amount_cents - payer_paid_amount_cents)
      base_final = 0          when service_category IN NO_CHARGE_SERVICE_CATEGORIES
                 = 0          when payer_route == MEDICAID
                 = residual   when payer_route == PRIVATE_INSURANCE
                 = gross_amount_cents when payer_route == SELF_PAY
      final_patient_responsibility_cents = round_half_up(base_final * (1 - discount_pct), 0)
      # --- operative value ---
      patient_responsibility_cents =
          (final_patient_responsibility_cents when it is non-null else provisional_patient_responsibility_cents)
          + floor_adjustment_cents
    input_set: "One BillableCharge row plus the payer_route and discount_tier_snapshot copied onto it at creation. The Student's live tier is deliberately NOT re-read at adjudication — the snapshot governs."
    constants:
      PRIVATE_COPAY_CENTS: 2500
      NO_CHARGE_SERVICE_CATEGORIES: ["IMMUNIZATION_ADMIN"]
      DISCOUNT_PCT_TIER_A: 1.00
      DISCOUNT_PCT_TIER_B: 0.80
      DISCOUNT_PCT_TIER_C: 0.60
      DISCOUNT_PCT_TIER_D: 0.40
      DISCOUNT_PCT_TIER_E: 0.00
    precision: "whole cents, round_half_up"
    combinatorial_mode: "(a) formula with >= 3 inputs and non-linear interaction — payer-route branch selects the base, tier selects the multiplier, max() clamps the residual"
    variants:
      - name: PROVISIONAL_GROSS_FIRST
        when: "at charge creation, before any payer adjudication"
        difference: "PRIVATE_INSURANCE bases the discount on the flat PRIVATE_COPAY_CENTS(2500), ignoring what the payer will actually allow"
      - name: FINAL_NET_OF_PAYER
        when: "at adjudication with outcome = PAID"
        difference: "PRIVATE_INSURANCE bases the discount on max(0, gross - payer_paid), so identical stored inputs yield a different number: gross 12000, payer paid 8000, TIER_C gives provisional 1000 but final 1600"

  - name: encounter_nominal_fee_floor
    trigger: "system, inside POST /sbhc/visits/{id}/complete, POST /sbhc/charges/{id}/adjudicate and POST /sbhc/charges/{id}/reverse — writes BillableCharge.floor_adjustment_cents and Visit.patient_responsibility_total_cents"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED because the floor depends on the encounter total,
      # which depends on the per-charge amounts the floor then modifies.
      STEP 1: eligible = charges of this visit with status NOT IN {NO_CHARGE, REVERSED}
              For each eligible charge, clear floor_adjustment_cents to 0 and take
              unfloored = final_patient_responsibility_cents when non-null
                          else provisional_patient_responsibility_cents
      STEP 2: encounter_sum = sum(unfloored over eligible)
      STEP 3: apply the floor only when ALL of:
                - eligible is non-empty
                - Student.payer_route != MEDICAID          (Medicaid families are never charged a nominal fee)
                - encounter_sum < NOMINAL_FEE_FLOOR_CENTS  (strictly less; exactly 500 is left alone)
              target charge = the eligible charge with the greatest gross_amount_cents;
                              ties broken by created_at ASC (never by id)
              target.floor_adjustment_cents = NOMINAL_FEE_FLOOR_CENTS - encounter_sum
      STEP 4: Visit.patient_responsibility_total_cents = sum over eligible of
              (unfloored + floor_adjustment_cents)
              which equals NOMINAL_FEE_FLOOR_CENTS when STEP 3 fired and encounter_sum otherwise
    input_set: "All BillableCharge rows of one Visit; NO_CHARGE and REVERSED charges are excluded from both the sum and the target selection."
    constants:
      NOMINAL_FEE_FLOOR_CENTS: 500
    precision: "whole cents"
    combinatorial_mode: "(c) circular-looking dependency — the per-charge amount depends on the encounter total which depends on the per-charge amounts; the four-step order makes it well defined"

  - name: immunization_dose_validity
    trigger: "POST /sbhc/students/{id}/immunization-doses, and system re-evaluation inside POST /sbhc/immunization-doses/{id}/void — writes ImmunizationDose.earliest_valid_date, .strict_earliest_valid_date, .status and .invalid_reason"
    algorithm: threshold
    formula: |
      if dose_number == 1:
          min_days = HEPB_DOSE1_MIN_AGE_DAYS (0) for HEPB, MMR_DOSE1_MIN_AGE_DAYS (365) for MMR
          strict_earliest_valid_date = Student.date_of_birth + min_days days
          invalid_reason_on_failure  = MIN_AGE_NOT_MET
      else:
          predecessor = the ImmunizationDose of the same student_id and series_code with
                        dose_number == dose_number - 1 and status == VALID
          if no such predecessor exists:
              status = INVALID_TOO_EARLY, invalid_reason = PREDECESSOR_VOIDED, and both
              earliest_valid_date and strict_earliest_valid_date keep their last computed values
          else:
              interval = HEPB_DOSE2_MIN_INTERVAL_DAYS (28) | HEPB_DOSE3_MIN_INTERVAL_DAYS (56)
                       | MMR_DOSE2_MIN_INTERVAL_DAYS (28)
              strict_earliest_valid_date = predecessor.administered_date + interval days
              invalid_reason_on_failure  = MIN_INTERVAL_NOT_MET
      earliest_valid_date = strict_earliest_valid_date - IMMUNIZATION_GRACE_DAYS (4) days
      status = VALID when administered_date >= earliest_valid_date            # INCLUSIVE boundary
             = INVALID_TOO_EARLY otherwise
    input_set: "The dose being recorded plus at most one predecessor dose of the same student and series with status == VALID. Doses with status IN {INVALID_TOO_EARLY, VOIDED} are never used as predecessors."
    constants:
      HEPB_DOSE1_MIN_AGE_DAYS: 0
      HEPB_DOSE2_MIN_INTERVAL_DAYS: 28
      HEPB_DOSE3_MIN_INTERVAL_DAYS: 56
      MMR_DOSE1_MIN_AGE_DAYS: 365
      MMR_DOSE2_MIN_INTERVAL_DAYS: 28
      IMMUNIZATION_GRACE_DAYS: 4
    precision: "whole calendar days, UTC dates"

  - name: immunization_compliance_status
    trigger: "system, after every ImmunizationDose create/void, every immunization-exemption write, every Enrollment activate/withdraw/reinstate, and POST /sbhc/operations/daily-sweep — writes Student.immunization_compliance_status"
    algorithm: aggregation
    formula: |
      # --- variant GRACE_COUNTING (operative; written to Student) ---
      valid_count(series) = number of ImmunizationDose rows for the student with that
                            series_code and status == VALID
      if Student.immunization_exemption_type != NONE:
          COMPLIANT
      elif valid_count(HEPB) >= 3 and valid_count(MMR) >= 2:
          COMPLIANT
      elif the student's Enrollment with status == ACTIVE has activated_at != null
           and current_clock_date <= date(activated_at) + PROVISIONAL_WINDOW_DAYS (30, inclusive)
           and valid_count(HEPB) >= 1 and valid_count(MMR) >= 1:
          PROVISIONAL
      else:
          NON_COMPLIANT
      # --- variant STRICT_COUNTING (report only; AggregateReport.strict_compliance_count) ---
      strict_valid(series) = number of doses with that series_code, status == VALID and
                             administered_date >= strict_earliest_valid_date
                             (i.e. the 4-day grace is removed)
      strict COMPLIANT iff strict_valid(HEPB) >= 3 and strict_valid(MMR) >= 2
      exemptions are IGNORED by the strict variant
    input_set: "All ImmunizationDose rows of one student (VALID only), the student's exemption type, and the student's Enrollment with status == ACTIVE."
    constants:
      HEPB_REQUIRED_DOSES: 3
      MMR_REQUIRED_DOSES: 2
      PROVISIONAL_WINDOW_DAYS: 30
    precision: "integer counts; dates compared at whole-day granularity"
    variants:
      - name: GRACE_COUNTING
        when: "always, for the field that gates sports-physical clearance"
        difference: "a dose given up to 4 days before its strict due date counts, and any exemption forces COMPLIANT"
      - name: STRICT_COUNTING
        when: "only inside aggregate report generation"
        difference: "the 4-day grace is removed and exemptions are ignored, so the same stored doses can yield COMPLIANT under GRACE_COUNTING and not-compliant under STRICT_COUNTING"

  - name: screening_band_outcome
    trigger: "POST /sbhc/visits/{id}/screenings — writes Screening.outcome and Screening.band_label"
    algorithm: threshold
    formula: |
      VISION:     outcome = REFER when numeric_result >= VISION_REFER_DENOMINATOR_MIN (40)          # inclusive
      HEARING:    outcome = REFER when numeric_result >  HEARING_REFER_DB_EXCLUSIVE (25)            # strictly greater
      DENTAL:     outcome = REFER when numeric_result >= DENTAL_REFER_CARIES_MIN (1)                # inclusive
      BMI:        outcome = REFER when numeric_result <  BMI_REFER_PERCENTILE_LOW_EXCLUSIVE (5)     # strictly less
                                  or numeric_result >= BMI_REFER_PERCENTILE_HIGH_INCLUSIVE (95)     # inclusive
      BEHAVIORAL: outcome = REFER when numeric_result >= BEHAVIORAL_REFER_SCORE_MIN (10)            # inclusive
      otherwise outcome = PASS
      band_label = ABNORMAL when outcome == REFER, NORMAL when outcome == PASS
      referral specialty on REFER = screening_instrument_to_referral_specialty[instrument]
    input_set: "The single Screening row being recorded. No history, no aggregation."
    constants:
      VISION_REFER_DENOMINATOR_MIN: 40
      HEARING_REFER_DB_EXCLUSIVE: 25
      DENTAL_REFER_CARIES_MIN: 1
      BMI_REFER_PERCENTILE_LOW_EXCLUSIVE: 5
      BMI_REFER_PERCENTILE_HIGH_INCLUSIVE: 95
      BEHAVIORAL_REFER_SCORE_MIN: 10
    precision: "numeric_result compared as a decimal number; no rounding is applied before banding"

  - name: clearance_validity_window
    trigger: "POST /sbhc/visits/{id}/sports-clearances and POST /sbhc/sports-clearances/{id}/re-evaluate — writes SportsPhysicalClearance.unrestricted_valid_until and .valid_until"
    algorithm: interval_merge
    formula: |
      validity_days = CLEARANCE_VALIDITY_DAYS_CLEARED (365)     when outcome == CLEARED
                    = CLEARANCE_VALIDITY_DAYS_RESTRICTED (180)  when outcome == CLEARED_WITH_RESTRICTIONS
                    = null                                      when outcome IN {DEFERRED, NOT_CLEARED}
      # --- variant CALENDAR_DAYS (advisory, stored on unrestricted_valid_until) ---
      unrestricted_valid_until = determination_date + validity_days days   (null when validity_days is null)
      # --- variant SCHOOL_YEAR_CAPPED (operative, stored on valid_until) ---
      school_year_end = SCHOOL_YEAR_2025_2026_END_DATE (2026-07-31) or
                        SCHOOL_YEAR_2026_2027_END_DATE (2027-07-31), chosen by
                        SportsPhysicalClearance.school_year
      valid_until = min(unrestricted_valid_until, school_year_end)         (null when validity_days is null)
      # The clearance is usable while current_clock_date <= valid_until (INCLUSIVE).
    input_set: "One clearance row plus the school_year copied from the visit's Enrollment."
    constants:
      CLEARANCE_VALIDITY_DAYS_CLEARED: 365
      CLEARANCE_VALIDITY_DAYS_RESTRICTED: 180
      SCHOOL_YEAR_2025_2026_END_DATE: "2026-07-31"
      SCHOOL_YEAR_2026_2027_END_DATE: "2027-07-31"
    precision: "whole calendar days, UTC dates"
    variants:
      - name: CALENDAR_DAYS
        when: "stored on unrestricted_valid_until"
        difference: "pure determination_date + validity_days, ignoring the academic calendar"
      - name: SCHOOL_YEAR_CAPPED
        when: "stored on valid_until and used by every gate that reads a clearance"
        difference: "clamped to the school-year end, so a CLEARED determination on 2026-05-10 gives unrestricted_valid_until 2027-05-10 but valid_until 2026-07-31"

  - name: telehealth_resource_conflict
    trigger: "POST /sbhc/telehealth-sessions and POST /sbhc/telehealth-sessions/{id}/reschedule — decides ERR_CLINICIAN_SLOT_CONFLICT and ERR_SCHOOL_CAPACITY_EXCEEDED"
    algorithm: interval_merge
    formula: |
      duration_minutes = whole minutes between start_at and end_at
      # --- axis 1: Clinician, BUFFERED CLOSED intervals ---
      # Every existing session S of the same clinician_id with status IN {SCHEDULED, COMPLETED}
      # (the row being rescheduled is excluded from its own check):
      clinician_conflict = exists S such that
          new.start_at < S.end_at   + TELEHEALTH_TURNAROUND_BUFFER_MINUTES (15 minutes)
        AND S.start_at  < new.end_at + TELEHEALTH_TURNAROUND_BUFFER_MINUTES
      # A gap of EXACTLY 15 minutes on either side does NOT conflict:
      # S = 09:00-09:30 and new = 09:45-10:15 is allowed; new = 09:44-10:14 conflicts.
      # --- axis 2: School, HALF-OPEN intervals with AGGREGATE CAPACITY, no buffer ---
      overlapping = count of sessions S of the same school_id with status IN {SCHEDULED, COMPLETED}
                    such that new.start_at < S.end_at AND S.start_at < new.end_at
      # Adjacency is allowed on this axis: S = 09:00-09:30 and new = 09:30-10:00 do not overlap.
      school_conflict = overlapping >= School.telehealth_concurrent_capacity
      # Priority: the clinician check runs BEFORE the school check.
    input_set: "TelehealthSession rows with status IN {SCHEDULED, COMPLETED}; sessions with status IN {NO_SHOW, CANCELLED} never block a new booking."
    constants:
      TELEHEALTH_TURNAROUND_BUFFER_MINUTES: 15
      TELEHEALTH_MIN_DURATION_MINUTES: 15
      TELEHEALTH_MAX_DURATION_MINUTES: 60
    precision: "whole minutes; instants compared in UTC"

  - name: notification_guardian_selection
    trigger: "system, whenever a notification-raising event fires — decides ParentNotification.guardian_id and the initial status"
    algorithm: weighted_scoring
    formula: |
      candidate_set = Guardian rows with student_id == the event's student           # eligibility filter
      ranking       = is_primary DESC (true before false), then created_at ASC       # ranking expression
      tie_break     = created_at ASC (never id)                                       # explicit tie-break
      selected      = first row under the ranking
      if candidate_set is empty:                                                      # empty-pool fallback
          guardian_id = null, status = UNDELIVERABLE, suppression_reason = NO_GUARDIAN_ON_FILE
      elif the raising Visit has confidential == true:
          guardian_id = selected.id, status = SUPPRESSED_CONFIDENTIAL,
          suppression_reason = CONFIDENTIAL_SERVICE
      elif selected.notification_opt_out == true:
          guardian_id = selected.id, status = SUPPRESSED_OPT_OUT,
          suppression_reason = GUARDIAN_OPT_OUT
      else:
          guardian_id = selected.id, status = QUEUED
    input_set: "All Guardian rows of one student; no status filter exists on Guardian, so every row of that student is a candidate."
    constants: {}
    precision: "not applicable"

  - name: visit_charge_bucket_totals
    trigger: "system, after every BillableCharge creation or transition — writes the five Visit bucket fields"
    algorithm: aggregation
    formula: |
      C = BillableCharge rows with visit_id == this Visit
      gross_charge_total_cents          = sum(gross_amount_cents          for c in C if c.status != REVERSED)
      no_charge_total_cents             = sum(gross_amount_cents          for c in C if c.status == NO_CHARGE)
      patient_responsibility_total_cents= sum(patient_responsibility_cents for c in C if c.status NOT IN {REVERSED, NO_CHARGE})
      write_off_total_cents             = sum(write_off_amount_cents      for c in C if c.status == WRITTEN_OFF)
      payer_billed_total_cents          = sum(gross_amount_cents - patient_responsibility_cents - write_off_amount_cents
                                              for c in C if c.status NOT IN {REVERSED, NO_CHARGE})
      # CONSERVED QUANTITY (must be 0 before and after every forward action and its
      # compensating action):
      visit_charge_bucket_residual = gross_charge_total_cents
                                   - (payer_billed_total_cents
                                      + patient_responsibility_total_cents
                                      + write_off_total_cents
                                      + no_charge_total_cents)
    input_set: "All BillableCharge rows of one Visit, partitioned by status exactly as written above; every charge lands in exactly one of the four right-hand buckets."
    constants: {}
    precision: "whole cents"

  - name: school_booked_minutes_total
    trigger: "system, after every TelehealthSession creation, close or reschedule — writes School.telehealth_booked_minutes_total"
    algorithm: aggregation
    formula: |
      School.telehealth_booked_minutes_total =
          sum(TelehealthSession.duration_minutes
              for s in TelehealthSession
              if s.school_id == this School and s.status IN {SCHEDULED, COMPLETED})
      # CONSERVED QUANTITY: scheduling a session and then closing it with
      # outcome = CANCELLED returns telehealth_booked_minutes_total to its exact
      # pre-scheduling value.
    input_set: "TelehealthSession rows of one School with status IN {SCHEDULED, COMPLETED}; NO_SHOW and CANCELLED rows contribute 0."
    constants: {}
    precision: "whole minutes"

  - name: referral_closure_rate
    trigger: "POST /sbhc/reports — writes AggregateReport.referral_closure_rate_all and .referral_closure_rate_excluding_lost"
    algorithm: aggregation
    formula: |
      R = Referral rows whose date(created_at) is within
          [period_start_date, period_end_date] INCLUSIVE on both ends, and, when
          AggregateReport.school_id is non-null, whose student has an Enrollment with
          status IN {ACTIVE, WITHDRAWN, TRANSFERRED} at that school for the current school year
      referral_total_count  = count(R)
      referral_closed_count = count(r in R if r.status == CLOSED)
      referral_lost_count   = count(r in R if r.status == LOST_TO_FOLLOW_UP)
      # --- variant DENOMINATOR_ALL ---
      referral_closure_rate_all = 0.0000 when referral_total_count == 0
                                  else round_half_up(referral_closed_count / referral_total_count, 4)
      # --- variant DENOMINATOR_EXCLUDING_LOST ---
      denom_excl = referral_total_count - referral_lost_count
      referral_closure_rate_excluding_lost = 0.0000 when denom_excl == 0
                                  else round_half_up(referral_closed_count / denom_excl, 4)
    input_set: "Referral rows created inside the period; status is read at report-generation time, not at creation time."
    constants:
      REPORT_RATE_PRECISION_DP: 4
    precision: "4 decimal places, round_half_up; an empty denominator yields exactly 0.0000 rather than an error"
    variants:
      - name: DENOMINATOR_ALL
        when: "stored on referral_closure_rate_all"
        difference: "counts lost-to-follow-up referrals in the denominator"
      - name: DENOMINATOR_EXCLUDING_LOST
        when: "stored on referral_closure_rate_excluding_lost"
        difference: "removes lost-to-follow-up referrals from the denominator, so 2 closed of 4 created with 1 lost yields 0.5000 versus 0.6667"

  - name: report_visit_partition
    trigger: "POST /sbhc/reports — writes the five AggregateReport visit-count fields"
    algorithm: aggregation
    formula: |
      V = Visit rows whose date(created_at) is within [period_start_date, period_end_date]
          INCLUSIVE, filtered by school_id when non-null and by visit_type_filter when non-null
      total_visits            = count(V)
      scheduled_visit_count   = count(v in V if v.clinical_status == SCHEDULED)
      in_progress_visit_count = count(v in V if v.clinical_status == IN_PROGRESS)
      completed_visit_count   = count(v in V if v.clinical_status == COMPLETED)
      cancelled_visit_count   = count(v in V if v.clinical_status == CANCELLED)
      no_show_visit_count     = count(v in V if v.clinical_status == NO_SHOW)
      # PARTITION INVARIANT: the five counts sum to total_visits exactly.
      money buckets are summed per visit and then added (round-per-visit-then-sum is
      moot because every visit bucket is already an integer number of cents)
    input_set: "Visit rows inside the period after the school and visit-type filters; no status filter is applied before partitioning."
    constants: {}
    precision: "integer counts; money in whole cents"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority — 32 rungs)
# The ladder is evaluated strictly in priority order; the first failing rung
# decides the response. Rungs 13-32 are the domain ladder and are where the
# priority-conflict pairs live.
# ===========================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "every id in the path resolves to a stored row, validated left to right"
    error_id: "ERR_STUDENT_NOT_FOUND | ERR_SCHOOL_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_CHARGE_NOT_FOUND | ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "every id supplied in the request body (school_id, clinician_id, student_id, visit_id) resolves to a stored row"
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_VISIT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /sbhc/visits, POST /sbhc/students/{id}/enrollments, POST /sbhc/telehealth-sessions, POST /sbhc/students/{id}/immunization-doses, POST /sbhc/reports"

  - priority: 6
    category: business_constraint
    check: "every required body field is present and every enum, integer, boolean, date and datetime field is well formed and within its declared range"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 7
    category: business_constraint
    check: "pagination limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 8
    category: business_temporal
    check: "AggregateReport period_end_date >= period_start_date (inclusive; equal dates give a single-day period)"
    error_id: ERR_INVALID_REPORT_PERIOD
    http_status: 400
    applies_to: "POST /sbhc/reports"

  - priority: 9
    category: business_temporal
    check: "TelehealthSession end_at strictly after start_at and TELEHEALTH_MIN_DURATION_MINUTES(15) <= duration_minutes <= TELEHEALTH_MAX_DURATION_MINUTES(60), both inclusive"
    error_id: ERR_INVALID_SESSION_WINDOW
    http_status: 400
    applies_to: "POST /sbhc/telehealth-sessions, POST /sbhc/telehealth-sessions/{id}/reschedule"

  - priority: 10
    category: business_constraint
    check: "expected_student_version equals the current Student.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sbhc/students/{id}/consents, POST /sbhc/students/{id}/enrollments, POST /sbhc/visits/{id}/sports-clearances"

  - priority: 11
    category: auth
    check: "an entity-backed actor may only act on its own row: Student self-consent requires X-User-ID == path student id; Guardian acknowledge requires X-User-ID == ParentNotification.guardian_id; Guardian notification-preference requires X-User-ID == path guardian id; Guardian or Student consent revoke requires X-User-ID == Consent.granted_by_user_id"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /sbhc/students/{id}/consents, POST /sbhc/consents/{id}/revoke, POST /sbhc/guardians/{id}/notification-preference, POST /sbhc/notifications/{id}/acknowledge"

  - priority: 12
    category: business_safety
    check: "a STUDENT_SELF consent is only accepted when category IN SELF_CONSENTABLE_CATEGORIES {BEHAVIORAL_HEALTH, CONFIDENTIAL_SERVICES} and the student's whole-year age at the current clock date is >= SELF_CONSENT_MIN_AGE_YEARS (14, inclusive)"
    error_id: ERR_SELF_CONSENT_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /sbhc/students/{id}/consents"

  - priority: 13
    category: business_safety
    check: "the actor closing a referral loop is not the actor who requested it: X-User-ID != Referral.requested_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sbhc/referrals/{id}/close"

  - priority: 14
    category: business_referential
    check: "the School whose site the operation happens at has program_status == ACTIVE"
    error_id: ERR_SCHOOL_SUSPENDED
    http_status: 409
    applies_to: "POST /sbhc/visits, POST /sbhc/enrollments/{id}/activate, POST /sbhc/enrollments/{id}/reinstate, POST /sbhc/students/{id}/enrollments, POST /sbhc/telehealth-sessions"

  - priority: 15
    category: business_referential
    check: "the student has an Enrollment with status == ACTIVE for the current school year at the operation's school"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sbhc/visits, POST /sbhc/students/{id}/referrals, POST /sbhc/students/{id}/immunization-doses"

  - priority: 16
    category: business_constraint
    check: "exhausted-attempt guards that are deliberately evaluated ABOVE the generic state check, because the attempt that exhausts the cap also drives the row into a terminal state and the cap error would otherwise be permanently masked: Referral.outreach_attempt_count >= MAX_OUTREACH_ATTEMPTS (3) on an outreach attempt, and ParentNotification.delivery_attempt_count >= MAX_NOTIFICATION_DELIVERY_ATTEMPTS (3) on a delivery attempt"
    error_id: "ERR_OUTREACH_LIMIT_EXCEEDED | ERR_DELIVERY_ATTEMPTS_EXHAUSTED"
    http_status: 409
    applies_to: "POST /sbhc/referrals/{id}/outreach-attempts, POST /sbhc/notifications/{id}/deliver"

  - priority: 17
    category: state
    check: "the target row is in a state from which the requested transition exists in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 18
    category: business_safety
    check: "a Consent of the category required by visit_type_to_required_consent_category exists for the student with status == ACTIVE and current_utc <= expires_at (inclusive)"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /sbhc/visits, POST /sbhc/visits/{id}/start"

  - priority: 19
    category: business_safety
    check: "for delivery_mode == TELEHEALTH, a Consent of category TELEHEALTH exists with status == ACTIVE and current_utc <= expires_at"
    error_id: ERR_TELEHEALTH_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /sbhc/visits, POST /sbhc/telehealth-sessions"

  - priority: 20
    category: business_constraint
    check: "Clinician.discipline equals visit_type_to_clinician_discipline[visit_type]"
    error_id: ERR_DISCIPLINE_MISMATCH
    http_status: 409
    applies_to: "POST /sbhc/visits"

  - priority: 21
    category: business_safety
    check: "Student.immunization_compliance_status != NON_COMPLIANT"
    error_id: ERR_IMMUNIZATION_NON_COMPLIANT
    http_status: 409
    applies_to: "POST /sbhc/visits/{id}/sports-clearances, POST /sbhc/sports-clearances/{id}/re-evaluate"

  - priority: 22
    category: business_constraint
    check: "dose_number equals (highest dose_number among the student's VALID doses of that series) + 1"
    error_id: ERR_DOSE_SEQUENCE
    http_status: 409
    applies_to: "POST /sbhc/students/{id}/immunization-doses"

  - priority: 23
    category: business_constraint
    check: "no VALID ImmunizationDose already exists for the same student_id, series_code and dose_number"
    error_id: ERR_DUPLICATE_DOSE
    http_status: 409
    applies_to: "POST /sbhc/students/{id}/immunization-doses"

  - priority: 24
    category: business_temporal
    check: "administered_date and report_received_date are not after the current logical clock date"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /sbhc/students/{id}/immunization-doses, POST /sbhc/referrals/{id}/report-back"

  - priority: 25
    category: business_temporal
    check: "NO_SHOW is only accepted once current_utc >= scheduled_start_at + NO_SHOW_GRACE_MINUTES (10, inclusive) for a Visit, or start_at + 10 minutes for a TelehealthSession"
    error_id: ERR_NO_SHOW_TOO_EARLY
    http_status: 409
    applies_to: "POST /sbhc/visits/{id}/close-unfulfilled, POST /sbhc/telehealth-sessions/{id}/close"

  - priority: 26
    category: business_temporal
    check: "no clinician buffered-overlap conflict per calculations.telehealth_resource_conflict axis 1"
    error_id: ERR_CLINICIAN_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /sbhc/telehealth-sessions, POST /sbhc/telehealth-sessions/{id}/reschedule"

  - priority: 27
    category: business_constraint
    check: "the count of school-overlapping sessions is strictly below School.telehealth_concurrent_capacity per calculations.telehealth_resource_conflict axis 2"
    error_id: ERR_SCHOOL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /sbhc/telehealth-sessions, POST /sbhc/telehealth-sessions/{id}/reschedule"

  - priority: 28
    category: business_constraint
    check: "Enrollment.reinstated_count < MAX_ENROLLMENT_REINSTATEMENTS (2)"
    error_id: ERR_REINSTATEMENT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /sbhc/enrollments/{id}/reinstate"

  - priority: 29
    category: business_constraint
    check: "SportsPhysicalClearance.reevaluation_count < MAX_DEFERRAL_REEVALUATIONS (2)"
    error_id: ERR_REEVALUATION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /sbhc/sports-clearances/{id}/re-evaluate"

  - priority: 30
    category: business_constraint
    check: "TelehealthSession.reschedule_count < MAX_SESSION_RESCHEDULES (2)"
    error_id: ERR_RESCHEDULE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /sbhc/telehealth-sessions/{id}/reschedule"

  - priority: 31
    category: business_temporal
    check: "acknowledge happens while current_utc <= sent_at + NOTIFICATION_ACK_WINDOW_DAYS (14 days, inclusive)"
    error_id: ERR_ACK_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /sbhc/notifications/{id}/acknowledge"

  - priority: 32
    category: business_fiscal
    check: "claim routing and money rules: submit-claim requires payer_route IN {MEDICAID, PRIVATE_INSURANCE} and record-patient-payment requires payer_route == SELF_PAY (ERR_CLAIM_NOT_APPLICABLE); appeal requires appeal_count < MAX_CLAIM_APPEALS(2) (ERR_APPEAL_LIMIT_EXCEEDED); write-off requires appeal_count == 2 (ERR_WRITE_OFF_NOT_PERMITTED); record-patient-payment requires amount_cents == patient_responsibility_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
    error_id: "ERR_CLAIM_NOT_APPLICABLE | ERR_APPEAL_LIMIT_EXCEEDED | ERR_WRITE_OFF_NOT_PERMITTED | ERR_PAYMENT_AMOUNT_MISMATCH"
    http_status: 409
    applies_to: "POST /sbhc/charges/{id}/submit-claim, POST /sbhc/charges/{id}/appeal, POST /sbhc/charges/{id}/write-off, POST /sbhc/charges/{id}/record-patient-payment"

# Documented priority-conflict pairs (each pair is a §0.5 Rule 5 instance):
#  - business_referential (15, ERR_ENROLLMENT_NOT_ACTIVE)    BEFORE business_safety     (18, ERR_CONSENT_REQUIRED)
#  - business_temporal    (26, ERR_CLINICIAN_SLOT_CONFLICT)  BEFORE business_constraint (27, ERR_SCHOOL_CAPACITY_EXCEEDED)
#  - business_constraint  (16, ERR_OUTREACH_LIMIT_EXCEEDED)  BEFORE state               (17, ERR_INVALID_STATE)
#  - state                (17, ERR_INVALID_STATE)            BEFORE business_fiscal     (32, ERR_APPEAL_LIMIT_EXCEEDED)
#  - business_safety      (13, ERR_SEGREGATION_OF_DUTIES)    BEFORE state               (17, ERR_INVALID_STATE),
#                         so a wrong-state close attempted by the requester still returns ERR_SEGREGATION_OF_DUTIES.

# ===========================================================================
# §1.5 API Endpoint Table
# All paths are prefixed with /sbhc. The primary resource id segment is always
# spelled {id}; sub-resource collections hang off /sbhc/<parent>/{id}/<segment>.
# ===========================================================================
endpoints:

  # ---- clock and operations -------------------------------------------------
  - method: POST
    path: "/sbhc/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the clock reads exactly 2026-05-01T00:00:00.000Z and never falls back to real wall-clock time. Every date and window rule in the scaffold is evaluated against this clock."
    roles: [SbhcAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["no entity is mutated; subsequent requests evaluate every temporal rule against the new instant"]

  - method: POST
    path: "/sbhc/operations/daily-sweep"
    description: "Advance the system epoch: expire consents past expires_at, expire clearances past valid_until or past the deferral window, and recompute every student's immunization compliance posture."
    roles: [SbhcAdmin]
    code: 200
    input: []
    output: { consents_expired: integer, clearances_expired: integer, students_recomputed: integer, current_utc: string }
    side_effects:
      - "Consent ACTIVE -> EXPIRED for every consent with current_utc > expires_at"
      - "SportsPhysicalClearance ACTIVE -> EXPIRED and PENDING_REEVALUATION -> EXPIRED per §1.2"
      - "Student.immunization_compliance_status recomputed for every student; PROVISIONAL lapses to NON_COMPLIANT once the 30-day window closes"
      - "each student whose compliance changes has version incremented by 1 and may trigger the clearance-void cascade"

  # ---- schools --------------------------------------------------------------
  - method: POST
    path: "/sbhc/schools"
    description: "Register a school site operated by the sponsor hospital."
    roles: [SbhcAdmin]
    code: 201
    input: ["name", "site_code", "sponsor_hospital_name", "telehealth_concurrent_capacity?"]
    output: School
    side_effects: ["program_status initialised to ACTIVE; telehealth_booked_minutes_total initialised to 0"]

  - method: GET
    path: "/sbhc/schools/{id}"
    description: "Read one school site including its program posture and its conserved booked-minutes total."
    roles: [SbhcAdmin, Registrar, Clinician, CareCoordinator, BillingSpecialist]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: POST
    path: "/sbhc/schools/{id}/program-status"
    description: "Suspend or reinstate the health-center program at a site. program_status is one of {ACTIVE, SUSPENDED}."
    roles: [SbhcAdmin]
    code: 200
    input: ["program_status"]
    output: School
    side_effects:
      - "School program state machine transition ACTIVE <-> SUSPENDED"
      - "increments School.version by 1"

  # ---- clinicians -----------------------------------------------------------
  - method: POST
    path: "/sbhc/clinicians"
    description: "Register a clinician and their scope of practice."
    roles: [SbhcAdmin]
    code: 201
    input: ["full_name", "discipline", "license_number"]
    output: Clinician
    side_effects: []

  - method: GET
    path: "/sbhc/clinicians/{id}"
    description: "Read one clinician."
    roles: [SbhcAdmin, Registrar, Clinician]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  # ---- students -------------------------------------------------------------
  - method: POST
    path: "/sbhc/students"
    description: "Register a student in the health-center roster."
    roles: [Registrar]
    code: 201
    input: ["first_name", "last_name", "date_of_birth"]
    output: Student
    side_effects:
      - "fpl_percent initialised to 0.00 and discount_tier to TIER_A (income 0 of a size-1 household is 0.00% of FPL)"
      - "immunization_compliance_status initialised to NON_COMPLIANT; version initialised to 1"

  - method: GET
    path: "/sbhc/students/{id}"
    description: "Read one student including fpl_percent, discount_tier, immunization_compliance_status, the dose counters and the version used by every optimistic-concurrency write."
    roles: [Registrar, Clinician, CareCoordinator, BillingSpecialist, SbhcAdmin, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: PATCH
    path: "/sbhc/students/{id}/financial-profile"
    description: "Record household income, household size and payer route; recomputes the sliding-fee position."
    roles: [Registrar]
    code: 200
    input: ["household_income_annual_cents", "household_size", "payer_route", "insurance_member_id?"]
    output: Student
    side_effects:
      - "runs calculations.fpl_percent_and_discount_tier, writing fpl_percent and discount_tier"
      - "increments Student.version by 1"
      - "already-created BillableCharge rows keep their snapshotted tier and payer route"

  - method: PUT
    path: "/sbhc/students/{id}/immunization-exemption"
    description: "Set or clear the student's immunization exemption. exemption_type = NONE revokes an exemption already on file."
    roles: [Registrar]
    code: 200
    input: ["exemption_type"]
    output: Student
    side_effects:
      - "recomputes Student.immunization_compliance_status via calculations.immunization_compliance_status"
      - "increments Student.version by 1"
      - "revoking an exemption that leaves the student NON_COMPLIANT fires the clearance-void cascade and raises an IMMUNIZATION_NON_COMPLIANT notification"

  # ---- guardians ------------------------------------------------------------
  - method: POST
    path: "/sbhc/students/{id}/guardians"
    description: "Add a guardian contact for a student."
    roles: [Registrar]
    code: 201
    input: ["full_name", "relationship", "contact_email", "is_primary?"]
    output: Guardian
    side_effects: ["the guardian immediately enters the notification-target candidate set"]

  - method: GET
    path: "/sbhc/students/{id}/guardians"
    description: "List every guardian on file for a student, ordered by is_primary DESC then created_at ASC — the same order the notification-target selector uses."
    roles: [Registrar, SbhcAdmin, Clinician]
    code: 200
    input: ["limit?", "offset?"]
    output: Guardian[]
    side_effects: []

  - method: POST
    path: "/sbhc/guardians/{id}/notification-preference"
    description: "Set or clear a guardian's notification opt-out."
    roles: [Guardian, Registrar]
    code: 200
    input: ["notification_opt_out"]
    output: Guardian
    side_effects: ["notifications already created keep their status; only future notifications are affected"]

  # ---- enrollment -----------------------------------------------------------
  - method: POST
    path: "/sbhc/students/{id}/enrollments"
    description: "Enroll a student at a site for a school year. Optimistic-concurrency guarded: a stale expected_student_version is rejected with 412."
    roles: [Registrar]
    code: 201
    input: ["school_id", "school_year", "expected_student_version"]
    output: Enrollment
    side_effects:
      - "any prior PENDING or ACTIVE enrollment of the same student and school year transitions to TRANSFERRED"
      - "increments Student.version by 1"

  - method: GET
    path: "/sbhc/enrollments/{id}"
    description: "Read one enrollment."
    roles: [Registrar, Clinician, SbhcAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/sbhc/enrollments"
    description: "List enrollments, filtered by student, site, school year or status."
    roles: [Registrar, SbhcAdmin, Clinician]
    code: 200
    input: ["student_id?", "school_id?", "school_year?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/sbhc/enrollments/{id}/activate"
    description: "Activate a pending enrollment; the immunization provisional window starts here."
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "activated_at = current_utc"
      - "recomputes Student.immunization_compliance_status and increments Student.version by 1"

  - method: POST
    path: "/sbhc/enrollments/{id}/withdraw"
    description: "Withdraw an active enrollment; cancels the student's future encounters at that site."
    roles: [Registrar]
    code: 200
    input: ["reason"]
    output: Enrollment
    side_effects:
      - "SCHEDULED and IN_PROGRESS visits on this enrollment transition to CANCELLED"
      - "SCHEDULED telehealth sessions on those visits transition to CANCELLED, decrementing School.telehealth_booked_minutes_total"
      - "recomputes Student.immunization_compliance_status and increments Student.version by 1"

  - method: POST
    path: "/sbhc/enrollments/{id}/reinstate"
    description: "Re-enroll a withdrawn student on the same enrollment row; capped at MAX_ENROLLMENT_REINSTATEMENTS (2)."
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "reinstated_count increments by 1; activated_at reset to current_utc so the provisional window restarts"
      - "recomputes Student.immunization_compliance_status and increments Student.version by 1"

  # ---- consent --------------------------------------------------------------
  - method: POST
    path: "/sbhc/students/{id}/consents"
    description: "Record a consent. granted_by = GUARDIAN takes a Guardian id in granted_by_user_id; granted_by = STUDENT_SELF takes the student's own id and is only accepted for the self-consentable categories above the age threshold. Optimistic-concurrency guarded."
    roles: [Registrar, Student]
    code: 201
    input: ["category", "school_year", "granted_by", "granted_by_user_id", "expected_student_version"]
    output: Consent
    side_effects:
      - "expires_at set to the school-year end instant"
      - "any prior ACTIVE consent for the same student, category and school year transitions to SUPERSEDED"
      - "increments Student.version by 1"

  - method: GET
    path: "/sbhc/students/{id}/consents"
    description: "List the consents on file for a student, optionally filtered by category or status."
    roles: [Registrar, Clinician, SbhcAdmin, Student]
    code: 200
    input: ["category?", "status?", "school_year?", "limit?", "offset?"]
    output: Consent[]
    side_effects: []

  - method: POST
    path: "/sbhc/consents/{id}/revoke"
    description: "Revoke an active consent. Revoking a TELEHEALTH consent cancels the student's scheduled telehealth sessions and the visits behind them."
    roles: [Registrar, Guardian, Student]
    code: 200
    input: ["reason"]
    output: Consent
    side_effects:
      - "revoked_at = current_utc"
      - "for category == TELEHEALTH: SCHEDULED sessions of that student transition to CANCELLED, School.telehealth_booked_minutes_total decrements, and the parent visits transition to CANCELLED"

  # ---- visits ---------------------------------------------------------------
  - method: POST
    path: "/sbhc/visits"
    description: "Schedule an encounter. The governing consent, the active enrollment and the confidentiality flag are all resolved server-side at creation."
    roles: [Clinician]
    code: 201
    input: ["student_id", "school_id", "clinician_id", "visit_type", "scheduled_start_at", "delivery_mode?", "confidential_service_requested?"]
    output: Visit
    side_effects:
      - "enrollment_id, consent_id and confidential resolved and stored"
      - "clinical_status = SCHEDULED, billing_status = NOT_APPLICABLE"

  - method: GET
    path: "/sbhc/visits/{id}"
    description: "Read one encounter including the five charge-bucket totals and both state axes."
    roles: [Clinician, Registrar, BillingSpecialist, SbhcAdmin, CareCoordinator]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: GET
    path: "/sbhc/visits"
    description: "List encounters filtered by student, site, clinician, enrollment, governing consent or clinical status."
    roles: [Clinician, Registrar, BillingSpecialist, SbhcAdmin]
    code: 200
    input: ["student_id?", "school_id?", "clinician_id?", "enrollment_id?", "consent_id?", "clinical_status?", "billing_status?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []

  - method: POST
    path: "/sbhc/visits/{id}/start"
    description: "Move an encounter into IN_PROGRESS; re-checks that the governing consent is still active and unexpired."
    roles: [Clinician]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: POST
    path: "/sbhc/visits/{id}/complete"
    description: "Complete an encounter. Mints the billable charges, runs the provisional sliding-fee calculation and the encounter nominal-fee floor, recomputes the visit buckets, and raises the parent notification unless the encounter is confidential."
    roles: [Clinician]
    code: 200
    input: ["disposition"]
    output: Visit
    side_effects:
      - "one BillableCharge for the visit's service category plus one IMMUNIZATION_ADMIN charge per VALID dose linked to the visit"
      - "runs calculations.charge_patient_responsibility (PROVISIONAL_GROSS_FIRST) and calculations.encounter_nominal_fee_floor"
      - "runs calculations.visit_charge_bucket_totals and advances the billing axis"
      - "creates one ParentNotification with event_type VISIT_COMPLETED, suppressed when Visit.confidential == true"

  - method: POST
    path: "/sbhc/visits/{id}/close-unfulfilled"
    description: "Close an encounter that did not happen. outcome is one of {CANCELLED, NO_SHOW}. NO_SHOW is only permitted once the 10-minute grace has elapsed."
    roles: [Clinician]
    code: 200
    input: ["outcome"]
    output: Visit
    side_effects:
      - "SCHEDULED telehealth sessions on this visit transition to CANCELLED (outcome CANCELLED) or NO_SHOW (outcome NO_SHOW), decrementing School.telehealth_booked_minutes_total in both cases"

  # ---- sports physical clearance -------------------------------------------
  - method: POST
    path: "/sbhc/visits/{id}/sports-clearances"
    description: "Record the athletic participation determination for a sports-physical encounter. Optimistic-concurrency guarded on the student."
    roles: [Clinician]
    code: 201
    input: ["outcome", "expected_student_version", "restrictions?"]
    output: SportsPhysicalClearance
    side_effects:
      - "runs calculations.clearance_validity_window, writing unrestricted_valid_until and valid_until"
      - "any prior ACTIVE or PENDING_REEVALUATION clearance for the same student and school year transitions to SUPERSEDED"
      - "increments Student.version by 1"
      - "creates one ParentNotification with event_type CLEARANCE_DETERMINED, suppressed when Visit.confidential == true"

  - method: GET
    path: "/sbhc/sports-clearances/{id}"
    description: "Read one clearance including both validity-window variants."
    roles: [Clinician, Registrar, SbhcAdmin]
    code: 200
    input: []
    output: SportsPhysicalClearance
    side_effects: []

  - method: GET
    path: "/sbhc/sports-clearances"
    description: "List clearances filtered by student, originating visit or status."
    roles: [Clinician, Registrar, SbhcAdmin]
    code: 200
    input: ["student_id?", "visit_id?", "status?", "limit?", "offset?"]
    output: SportsPhysicalClearance[]
    side_effects: []

  - method: POST
    path: "/sbhc/sports-clearances/{id}/re-evaluate"
    description: "Re-evaluate a deferred clearance. Capped at MAX_DEFERRAL_REEVALUATIONS (2) and only inside the 30-day deferral window."
    roles: [Clinician]
    code: 200
    input: ["outcome", "restrictions?"]
    output: SportsPhysicalClearance
    side_effects:
      - "reevaluation_count increments by 1; determination_date reset to the current clock date"
      - "a non-DEFERRED outcome moves the row to ACTIVE and recomputes both validity-window variants"

  # ---- immunization ---------------------------------------------------------
  - method: POST
    path: "/sbhc/students/{id}/immunization-doses"
    description: "Record an administered dose. A dose given before its earliest valid date is stored with status INVALID_TOO_EARLY rather than rejected."
    roles: [Clinician]
    code: 201
    input: ["series_code", "dose_number", "administered_date", "visit_id?"]
    output: ImmunizationDose
    side_effects:
      - "runs calculations.immunization_dose_validity, writing earliest_valid_date, strict_earliest_valid_date, status and invalid_reason"
      - "recomputes the Student dose counters and immunization_compliance_status; increments Student.version by 1"

  - method: GET
    path: "/sbhc/immunization-doses/{id}"
    description: "Read one recorded dose."
    roles: [Clinician, Registrar, SbhcAdmin]
    code: 200
    input: []
    output: ImmunizationDose
    side_effects: []

  - method: GET
    path: "/sbhc/immunization-doses"
    description: "List recorded doses filtered by student, encounter, series or validity status."
    roles: [Clinician, Registrar, SbhcAdmin]
    code: 200
    input: ["student_id?", "visit_id?", "series_code?", "status?", "limit?", "offset?"]
    output: ImmunizationDose[]
    side_effects: []

  - method: POST
    path: "/sbhc/immunization-doses/{id}/void"
    description: "Void a recorded dose. Triggers the five-link compliance cascade: successor doses lose their predecessor, the student's compliance posture is recomputed, an active clearance is voided and a parent notification is raised."
    roles: [Clinician]
    code: 200
    input: ["reason"]
    output: ImmunizationDose
    side_effects:
      - "successor doses of the same series move VALID -> INVALID_TOO_EARLY with invalid_reason = PREDECESSOR_VOIDED"
      - "recomputes Student counters and immunization_compliance_status; increments Student.version by 1"
      - "an ACTIVE or PENDING_REEVALUATION clearance transitions to VOIDED with void_reason = IMMUNIZATION_COMPLIANCE_LOST"
      - "raises an IMMUNIZATION_NON_COMPLIANT notification and then a CLEARANCE_VOIDED notification, in that order"

  # ---- screening ------------------------------------------------------------
  - method: POST
    path: "/sbhc/visits/{id}/screenings"
    description: "Record a screening result. The banded outcome is computed server-side; a REFER outcome auto-creates a referral and voids any active sports clearance."
    roles: [Clinician]
    code: 201
    input: ["instrument", "numeric_result"]
    output: Screening
    side_effects:
      - "runs calculations.screening_band_outcome, writing outcome and band_label"
      - "on REFER: creates a Referral in OPEN with source_screening_id set, writes Screening.generated_referral_id, raises a REFERRAL_CREATED notification, voids an ACTIVE or PENDING_REEVALUATION clearance and raises a CLEARANCE_VOIDED notification"

  - method: GET
    path: "/sbhc/screenings/{id}"
    description: "Read one screening."
    roles: [Clinician, Registrar, SbhcAdmin]
    code: 200
    input: []
    output: Screening
    side_effects: []

  - method: GET
    path: "/sbhc/screenings"
    description: "List screenings filtered by student, encounter, instrument, outcome or the referral they generated."
    roles: [Clinician, Registrar, SbhcAdmin]
    code: 200
    input: ["student_id?", "visit_id?", "instrument?", "outcome?", "generated_referral_id?", "limit?", "offset?"]
    output: Screening[]
    side_effects: []

  # ---- referral and care coordination --------------------------------------
  - method: POST
    path: "/sbhc/students/{id}/referrals"
    description: "Raise a referral to an external specialty. requested_by_user_id is taken from X-User-ID and is what the segregation-of-duties check on closure compares against."
    roles: [Clinician]
    code: 201
    input: ["specialty", "reason", "source_visit_id?"]
    output: Referral
    side_effects:
      - "requested_by_user_id = X-User-ID"
      - "raises a REFERRAL_CREATED notification subject to the suppression rules"

  - method: GET
    path: "/sbhc/referrals/{id}"
    description: "Read one referral including the outreach counter and the closer identity."
    roles: [Clinician, CareCoordinator, SbhcAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/sbhc/referrals"
    description: "List referrals filtered by student, originating screening, originating visit, requester or status."
    roles: [Clinician, CareCoordinator, SbhcAdmin]
    code: 200
    input: ["student_id?", "source_screening_id?", "source_visit_id?", "requested_by_user_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/sbhc/referrals/{id}/outreach-attempts"
    description: "Log an outreach attempt. outcome is one of {REACHED, NO_ANSWER}. NO_ANSWER advances the capped retry loop and the third one loses the referral to follow-up; REACHED moves it to SCHEDULED."
    roles: [CareCoordinator]
    code: 200
    input: ["outcome"]
    output: Referral
    side_effects:
      - "outreach_attempt_count increments by 1"
      - "the third NO_ANSWER transitions the referral to LOST_TO_FOLLOW_UP"

  - method: POST
    path: "/sbhc/referrals/{id}/report-back"
    description: "Record the external provider's report; loop closure is only permitted after this."
    roles: [CareCoordinator]
    code: 200
    input: ["report_summary", "report_received_date"]
    output: Referral
    side_effects: []

  - method: POST
    path: "/sbhc/referrals/{id}/close"
    description: "Close the referral loop. The closer must not be the requester."
    roles: [CareCoordinator, Clinician]
    code: 200
    input: ["closure_note"]
    output: Referral
    side_effects: ["closed_by_user_id = X-User-ID"]

  # ---- sponsor-hospital billing and sliding fee ----------------------------
  - method: GET
    path: "/sbhc/charges/{id}"
    description: "Read one billable charge including both sliding-fee variants and the encounter floor adjustment."
    roles: [BillingSpecialist, Registrar, SbhcAdmin]
    code: 200
    input: []
    output: BillableCharge
    side_effects: []

  - method: GET
    path: "/sbhc/charges"
    description: "List billable charges filtered by student, encounter, status or service category."
    roles: [BillingSpecialist, Registrar, SbhcAdmin]
    code: 200
    input: ["student_id?", "visit_id?", "status?", "service_category?", "limit?", "offset?"]
    output: BillableCharge[]
    side_effects: []

  - method: POST
    path: "/sbhc/charges/{id}/submit-claim"
    description: "Submit the charge to the payer. Only Medicaid and private-insurance routes are claimable."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: BillableCharge
    side_effects: []

  - method: POST
    path: "/sbhc/charges/{id}/adjudicate"
    description: "Record the payer's decision. outcome is one of {PAID, DENIED}. A PAID outcome recomputes the family's responsibility with the FINAL_NET_OF_PAYER variant and re-runs the encounter nominal-fee floor."
    roles: [BillingSpecialist]
    code: 200
    input: ["outcome", "payer_paid_amount_cents", "denial_reason?"]
    output: BillableCharge
    side_effects:
      - "on PAID: writes final_patient_responsibility_cents, switches patient_responsibility_cents to it, re-runs calculations.encounter_nominal_fee_floor and calculations.visit_charge_bucket_totals"
      - "on DENIED: stores denial_reason and forces payer_paid_amount_cents to 0"

  - method: POST
    path: "/sbhc/charges/{id}/appeal"
    description: "Appeal a denial. Capped at MAX_CLAIM_APPEALS (2)."
    roles: [BillingSpecialist]
    code: 200
    input: ["appeal_note"]
    output: BillableCharge
    side_effects: ["appeal_count increments by 1"]

  - method: POST
    path: "/sbhc/charges/{id}/write-off"
    description: "Write the charge off. Only permitted once both appeals have been exhausted."
    roles: [BillingSpecialist]
    code: 200
    input: ["reason"]
    output: BillableCharge
    side_effects:
      - "write_off_amount_cents = gross_amount_cents - payer_paid_amount_cents - patient_responsibility_cents"
      - "runs calculations.visit_charge_bucket_totals"

  - method: POST
    path: "/sbhc/charges/{id}/record-patient-payment"
    description: "Record a self-pay family payment. The amount must match the family's responsibility exactly."
    roles: [BillingSpecialist]
    code: 200
    input: ["amount_cents"]
    output: BillableCharge
    side_effects:
      - "patient_paid_amount_cents = amount_cents"
      - "runs calculations.visit_charge_bucket_totals and may bubble the visit billing axis to CHARGES_POSTED"

  - method: POST
    path: "/sbhc/charges/{id}/reverse"
    description: "Compensating action for a charge posted in error. The charge leaves every visit bucket and the encounter floor is re-derived across the surviving charges."
    roles: [BillingSpecialist]
    code: 200
    input: ["reason"]
    output: BillableCharge
    side_effects:
      - "floor_adjustment_cents cleared and calculations.encounter_nominal_fee_floor re-run over the surviving charges"
      - "runs calculations.visit_charge_bucket_totals; the conserved residual stays 0"

  # ---- parent notification --------------------------------------------------
  - method: GET
    path: "/sbhc/notifications/{id}"
    description: "Read one parent notification."
    roles: [SbhcAdmin, Registrar, Guardian]
    code: 200
    input: []
    output: ParentNotification
    side_effects: []

  - method: GET
    path: "/sbhc/notifications"
    description: "List parent notifications filtered by student, guardian, encounter, status or event type."
    roles: [SbhcAdmin, Registrar, Guardian]
    code: 200
    input: ["student_id?", "guardian_id?", "visit_id?", "status?", "event_type?", "limit?", "offset?"]
    output: ParentNotification[]
    side_effects: []

  - method: POST
    path: "/sbhc/notifications/{id}/deliver"
    description: "Attempt delivery. outcome is one of {DELIVERED, FAILED}. Capped at MAX_NOTIFICATION_DELIVERY_ATTEMPTS (3); the third failure marks the notification undeliverable."
    roles: [SbhcAdmin]
    code: 200
    input: ["outcome"]
    output: ParentNotification
    side_effects: ["delivery_attempt_count increments by 1; a DELIVERED outcome stamps sent_at"]

  - method: POST
    path: "/sbhc/notifications/{id}/acknowledge"
    description: "Guardian acknowledgement, permitted within 14 days of sent_at."
    roles: [Guardian]
    code: 200
    input: []
    output: ParentNotification
    side_effects: ["acknowledged_at = current_utc"]

  # ---- telehealth to classroom ---------------------------------------------
  - method: POST
    path: "/sbhc/telehealth-sessions"
    description: "Book a telehealth-into-the-classroom session against a telehealth visit. Consumes both a clinician slot (15-minute turnaround buffer) and school-side classroom capacity (half-open intervals, aggregate capacity)."
    roles: [Clinician]
    code: 201
    input: ["visit_id", "start_at", "end_at"]
    output: TelehealthSession
    side_effects:
      - "clinician_id and school_id copied from the visit; duration_minutes computed"
      - "School.telehealth_booked_minutes_total increments by duration_minutes and School.version increments by 1"

  - method: GET
    path: "/sbhc/telehealth-sessions/{id}"
    description: "Read one telehealth session."
    roles: [Clinician, SbhcAdmin, Registrar]
    code: 200
    input: []
    output: TelehealthSession
    side_effects: []

  - method: GET
    path: "/sbhc/telehealth-sessions"
    description: "List telehealth sessions filtered by encounter, clinician, site or status."
    roles: [Clinician, SbhcAdmin, Registrar]
    code: 200
    input: ["visit_id?", "clinician_id?", "school_id?", "status?", "limit?", "offset?"]
    output: TelehealthSession[]
    side_effects: []

  - method: POST
    path: "/sbhc/telehealth-sessions/{id}/complete"
    description: "Complete a session; the parent telehealth visit may only be completed once this has happened."
    roles: [Clinician]
    code: 200
    input: []
    output: TelehealthSession
    side_effects: ["School.telehealth_booked_minutes_total is unchanged — COMPLETED sessions keep their booking"]

  - method: POST
    path: "/sbhc/telehealth-sessions/{id}/close"
    description: "Close a session. outcome is one of {NO_SHOW, CANCELLED}. NO_SHOW requires the 10-minute grace to have elapsed. Both outcomes release the school-side booking when the row was SCHEDULED."
    roles: [Clinician]
    code: 200
    input: ["outcome", "closure_reason?"]
    output: TelehealthSession
    side_effects:
      - "from SCHEDULED: School.telehealth_booked_minutes_total decrements by duration_minutes and School.version increments by 1"
      - "from NO_SHOW with outcome CANCELLED: the booking was already released, so the total is unchanged"

  - method: POST
    path: "/sbhc/telehealth-sessions/{id}/reschedule"
    description: "Re-book a no-showed session into a new window. Capped at MAX_SESSION_RESCHEDULES (2) and re-runs both resource checks."
    roles: [Clinician]
    code: 200
    input: ["start_at", "end_at"]
    output: TelehealthSession
    side_effects:
      - "start_at, end_at and duration_minutes replaced; reschedule_count increments by 1"
      - "School.telehealth_booked_minutes_total increments by the new duration_minutes and School.version increments by 1"

  # ---- reporting ------------------------------------------------------------
  - method: POST
    path: "/sbhc/reports"
    description: "Generate an immutable aggregate snapshot over an inclusive date period, optionally scoped to one site and one visit type."
    roles: [SbhcAdmin]
    code: 201
    input: ["period_start_date", "period_end_date", "school_id?", "visit_type_filter?"]
    output: AggregateReport
    side_effects:
      - "runs calculations.report_visit_partition, calculations.referral_closure_rate and both immunization compliance variants"
      - "no entity outside AggregateReport is mutated"

  - method: GET
    path: "/sbhc/reports/{id}"
    description: "Read one generated report snapshot."
    roles: [SbhcAdmin]
    code: 200
    input: []
    output: AggregateReport
    side_effects: []

  - method: GET
    path: "/sbhc/reports"
    description: "List generated report snapshots, optionally filtered by the site they were scoped to."
    roles: [SbhcAdmin]
    code: 200
    input: ["school_id?", "limit?", "offset?"]
    output: AggregateReport[]
    side_effects: []

# ===========================================================================
# §1.6 Error Code Catalog — 38 codes, every one triggerable from §1.5.
# ===========================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or X-User-Role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles in §1.5"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "an entity-backed actor acts on a row it does not own — Student self-consenting for another student, Guardian acknowledging another guardian's notification, Guardian or Student revoking a consent they did not grant"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required body field, malformed or out-of-range value, unknown enum member, restrictions omitted on CLEARED_WITH_RESTRICTIONS, denial_reason omitted on a DENIED adjudication, payer_paid_amount_cents outside 0..gross_amount_cents, administered_date or report_received_date after the current clock date, or pagination limit outside 1..100"

  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "the student id in the path or body does not resolve"
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "the school id in the path or body does not resolve"
  - id: ERR_CLINICIAN_NOT_FOUND
    http: 404
    condition: "the clinician id in the path or body does not resolve"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "the visit id in the path or body does not resolve"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "the referral id in the path does not resolve"
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "the charge id in the path does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "an enrollment, consent, guardian, clearance, dose, screening, notification, telehealth session or report id in the path does not resolve"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_student_version does not equal the current Student.version on any of the three optimistic-concurrency write endpoints"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition does not exist from the row's current state — including completing a telehealth visit whose session is not COMPLETED, and re-evaluating a clearance outside its 30-day deferral window"
  - id: ERR_SCHOOL_SUSPENDED
    http: 409
    condition: "the site's program_status is SUSPENDED"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "the student has no Enrollment with status == ACTIVE for the current school year at the operation's site"
  - id: ERR_CONSENT_REQUIRED
    http: 409
    condition: "no ACTIVE unexpired Consent exists in the category the visit type requires"
  - id: ERR_TELEHEALTH_CONSENT_REQUIRED
    http: 409
    condition: "a telehealth encounter or session is requested without an ACTIVE unexpired TELEHEALTH consent"
  - id: ERR_SELF_CONSENT_NOT_PERMITTED
    http: 403
    condition: "granted_by == STUDENT_SELF with a category outside SELF_CONSENTABLE_CATEGORIES, or with a student younger than 14 whole years at the current clock date"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the actor closing a referral is the same X-User-ID that requested it"
  - id: ERR_DISCIPLINE_MISMATCH
    http: 409
    condition: "the clinician's discipline does not match the discipline the visit type requires"
  - id: ERR_IMMUNIZATION_NON_COMPLIANT
    http: 409
    condition: "a sports-physical determination or re-evaluation is attempted while the student's immunization_compliance_status is NON_COMPLIANT"
  - id: ERR_DOSE_SEQUENCE
    http: 409
    condition: "dose_number is not exactly one more than the highest VALID dose_number already recorded for that student and series"
  - id: ERR_DUPLICATE_DOSE
    http: 409
    condition: "a VALID dose already exists for the same student, series and dose_number"

  - id: ERR_INVALID_SESSION_WINDOW
    http: 400
    condition: "end_at is not strictly after start_at, or the duration is outside 15..60 minutes inclusive"
  - id: ERR_CLINICIAN_SLOT_CONFLICT
    http: 409
    condition: "the requested window collides with another session of the same clinician once the 15-minute turnaround buffer is applied to both ends"
  - id: ERR_SCHOOL_CAPACITY_EXCEEDED
    http: 409
    condition: "the count of half-open-overlapping sessions at the site has reached School.telehealth_concurrent_capacity"
  - id: ERR_NO_SHOW_TOO_EARLY
    http: 409
    condition: "a NO_SHOW close is attempted before scheduled_start_at (visit) or start_at (session) plus the 10-minute grace"

  - id: ERR_REINSTATEMENT_LIMIT_EXCEEDED
    http: 409
    condition: "a third reinstatement is attempted on the same enrollment row"
  - id: ERR_REEVALUATION_LIMIT_EXCEEDED
    http: 409
    condition: "a third re-evaluation is attempted on the same clearance row"
  - id: ERR_OUTREACH_LIMIT_EXCEEDED
    http: 409
    condition: "a fourth outreach attempt is logged on the same referral"
  - id: ERR_RESCHEDULE_LIMIT_EXCEEDED
    http: 409
    condition: "a third reschedule is attempted on the same telehealth session"
  - id: ERR_DELIVERY_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "a fourth delivery attempt is made on the same notification"
  - id: ERR_ACK_WINDOW_EXPIRED
    http: 409
    condition: "acknowledgement is attempted more than 14 days after sent_at"

  - id: ERR_CLAIM_NOT_APPLICABLE
    http: 409
    condition: "submit-claim on a SELF_PAY charge, or record-patient-payment on a MEDICAID or PRIVATE_INSURANCE charge"
  - id: ERR_APPEAL_LIMIT_EXCEEDED
    http: 409
    condition: "a third appeal is filed on the same charge"
  - id: ERR_WRITE_OFF_NOT_PERMITTED
    http: 409
    condition: "a write-off is attempted before both appeals have been used"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 409
    condition: "the recorded patient payment does not equal patient_responsibility_cents exactly"
  - id: ERR_INVALID_REPORT_PERIOD
    http: 400
    condition: "period_end_date is earlier than period_start_date"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:

  - name: SbhcAdmin
    description: "Health-center operations administrator: site configuration, the logical clock, the daily sweep, notification delivery and reporting."
    identity: "opaque"
    exclusive_operations:
      - "POST /sbhc/_clock/set_current_utc"
      - "POST /sbhc/operations/daily-sweep"
      - "POST /sbhc/schools"
      - "POST /sbhc/schools/{id}/program-status"
      - "POST /sbhc/clinicians"
      - "POST /sbhc/notifications/{id}/deliver"
      - "POST /sbhc/reports"
      - "GET /sbhc/reports/{id}"
      - "GET /sbhc/reports"
    shared_operations:
      - "GET /sbhc/schools/{id}"
      - "GET /sbhc/clinicians/{id}"
      - "GET /sbhc/students/{id}"
      - "GET /sbhc/students/{id}/guardians"
      - "GET /sbhc/students/{id}/consents"
      - "GET /sbhc/enrollments/{id}, GET /sbhc/enrollments"
      - "GET /sbhc/visits/{id}, GET /sbhc/visits"
      - "GET /sbhc/sports-clearances/{id}, GET /sbhc/sports-clearances"
      - "GET /sbhc/immunization-doses/{id}, GET /sbhc/immunization-doses"
      - "GET /sbhc/screenings/{id}, GET /sbhc/screenings"
      - "GET /sbhc/referrals/{id}, GET /sbhc/referrals"
      - "GET /sbhc/charges/{id}, GET /sbhc/charges"
      - "GET /sbhc/notifications/{id}, GET /sbhc/notifications"
      - "GET /sbhc/telehealth-sessions/{id}, GET /sbhc/telehealth-sessions"

  - name: Registrar
    description: "Front-office registrar: student roster, guardians, enrollment lifecycle, guardian-granted consent and the sliding-fee financial profile."
    identity: "opaque"
    exclusive_operations:
      - "POST /sbhc/students"
      - "PATCH /sbhc/students/{id}/financial-profile"
      - "PUT /sbhc/students/{id}/immunization-exemption"
      - "POST /sbhc/students/{id}/guardians"
      - "POST /sbhc/students/{id}/enrollments"
      - "POST /sbhc/enrollments/{id}/activate"
      - "POST /sbhc/enrollments/{id}/withdraw"
      - "POST /sbhc/enrollments/{id}/reinstate"
    shared_operations:
      - "POST /sbhc/students/{id}/consents (with Student)"
      - "POST /sbhc/consents/{id}/revoke (with Guardian and Student)"
      - "POST /sbhc/guardians/{id}/notification-preference (with Guardian)"
      - "the read endpoints listed for SbhcAdmin except the report endpoints"

  - name: Clinician
    description: "Licensed provider delivering encounters. X-User-ID is the Clinician row id, which is what the referral segregation-of-duties rule compares against."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /sbhc/visits"
      - "POST /sbhc/visits/{id}/start"
      - "POST /sbhc/visits/{id}/complete"
      - "POST /sbhc/visits/{id}/close-unfulfilled"
      - "POST /sbhc/visits/{id}/sports-clearances"
      - "POST /sbhc/sports-clearances/{id}/re-evaluate"
      - "POST /sbhc/students/{id}/immunization-doses"
      - "POST /sbhc/immunization-doses/{id}/void"
      - "POST /sbhc/visits/{id}/screenings"
      - "POST /sbhc/students/{id}/referrals"
      - "POST /sbhc/telehealth-sessions"
      - "POST /sbhc/telehealth-sessions/{id}/complete"
      - "POST /sbhc/telehealth-sessions/{id}/close"
      - "POST /sbhc/telehealth-sessions/{id}/reschedule"
    shared_operations:
      - "POST /sbhc/referrals/{id}/close (with CareCoordinator, subject to segregation of duties)"
      - "the clinical read endpoints"

  - name: CareCoordinator
    description: "Care-coordination staff who work the referral outreach loop and close the loop once the external report arrives."
    identity: "opaque"
    exclusive_operations:
      - "POST /sbhc/referrals/{id}/outreach-attempts"
      - "POST /sbhc/referrals/{id}/report-back"
    shared_operations:
      - "POST /sbhc/referrals/{id}/close (with Clinician, subject to segregation of duties)"
      - "GET /sbhc/referrals/{id}, GET /sbhc/referrals, GET /sbhc/students/{id}, GET /sbhc/visits/{id}, GET /sbhc/schools/{id}"

  - name: BillingSpecialist
    description: "Sponsor-hospital revenue-cycle staff owning the entire charge lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /sbhc/charges/{id}/submit-claim"
      - "POST /sbhc/charges/{id}/adjudicate"
      - "POST /sbhc/charges/{id}/appeal"
      - "POST /sbhc/charges/{id}/write-off"
      - "POST /sbhc/charges/{id}/record-patient-payment"
      - "POST /sbhc/charges/{id}/reverse"
    shared_operations:
      - "GET /sbhc/charges/{id}, GET /sbhc/charges, GET /sbhc/visits/{id}, GET /sbhc/visits, GET /sbhc/students/{id}, GET /sbhc/schools/{id}"

  - name: Guardian
    description: "Parent or legal guardian. X-User-ID is the Guardian row id; ownership checks compare it to Guardian.id and to ParentNotification.guardian_id."
    identity: "entity_backed:Guardian"
    exclusive_operations:
      - "POST /sbhc/notifications/{id}/acknowledge"
    shared_operations:
      - "POST /sbhc/guardians/{id}/notification-preference (with Registrar, own row only)"
      - "POST /sbhc/consents/{id}/revoke (with Registrar and Student, own granted consents only)"
      - "GET /sbhc/notifications/{id}, GET /sbhc/notifications"

  - name: Student
    description: "The minor themself, acting under minor-consent-by-law for the self-consentable categories. X-User-ID is the Student row id."
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /sbhc/students/{id}/consents (with Registrar; only granted_by = STUDENT_SELF on their own row, only for BEHAVIORAL_HEALTH and CONFIDENTIAL_SERVICES, only at or above 14 whole years)"
      - "POST /sbhc/consents/{id}/revoke (with Registrar and Guardian, own granted consents only)"
      - "GET /sbhc/students/{id}, GET /sbhc/students/{id}/consents"
