  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sequencer_run_closed_interval_buffer_conflict
        grounds:
          - calculations.sequencer_run_overlap
          - validations[priority=15]
          - errors[ERR_RUN_WINDOW_CONFLICT]
          - entities.Sequencer.fields.turnaround_buffer_minutes
        distinguishing_aspect: |
          With buffer 60 min, an existing SCHEDULED run [10:00,12:00] makes a new run
          [12:30,13:30] conflict (gap 30 < buffer, closed-interval + buffer geometry) ->
          ERR_RUN_WINDOW_CONFLICT, while [13:00,14:00] (exactly buffer apart) would be allowed.
          Closed + buffer semantics on the Sequencer resource.
        test_recipe:
          setup:
            - "A SCHEDULED order in SEQUENCING; a sequencer with buffer 60; one existing run [10:00,12:00]."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/sequencers"
              payload: { instrument_name: "NovaSeq-A", turnaround_buffer_minutes: 60 }
              as: LabDirector
              captures: { seq_id: $.data.id }
            - call: "POST /lab/genes"
              payload: { symbol: "GS1", is_acmg_reportable: false }
              as: LabDirector
              captures: { gs1_id: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "PS1", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${gs1_id}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "1616161616", full_name: "Dr Sixteen" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-O", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/requisition"
              payload: { clinical_indication: "dx", insurance_payer: "SELF_PAY" }
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/requisition/submit"
              payload: {}
              as: LabIntake
            - call: "POST /lab/sequencers/${seq_id}/runs"
              payload: { test_order_id: "${order_id}", window_start: "2026-06-20T10:00:00.000Z", window_end: "2026-06-20T12:00:00.000Z" }
              as: AccessioningTech
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /lab/sequencers/${seq_id}/runs"
              payload: { test_order_id: "${order_id}", window_start: "2026-06-20T12:30:00.000Z", window_end: "2026-06-20T13:30:00.000Z" }
              as: AccessioningTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RUN_WINDOW_CONFLICT"

      - name: counselor_slot_half_open_overlap_conflict
        grounds:
          - calculations.counselor_slot_overlap
          - validations[priority=16]
          - state_machines.CounselorReferral.REQUESTED_to_SCHEDULED
          - errors[ERR_COUNSELOR_SLOT_CONFLICT]
        distinguishing_aspect: |
          For one counselor, an existing SCHEDULED referral [10:00,11:00) makes a new
          schedule [10:30,11:30) conflict (half-open overlap) -> ERR_COUNSELOR_SLOT_CONFLICT,
          while [11:00,12:00) (adjacency) would be allowed. Half-open, no-buffer geometry on
          the GeneticCounselorProfile resource — distinct interval semantics from the sequencer.
        test_recipe:
          setup:
