# =============================================================================
# PRD Benchmark Seed Tables — Hazardous-Materials & Tier II Reporting (EPCRA)
# Difficulty: Expert
# =============================================================================

scenario: |
  835. Hazardous-Materials & Tier II Reporting (EPCRA): facility & chemical
  inventory, threshold determination & Tier II filing, SDS repository, release
  notification & LEPC, permit & fee, inspection & compliance,
  risk-management-plan (RMP) tracking, emergency-response linkage

domain_name: hazmat-tier2-reporting
api_prefix: /epcra

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - rate_threshold_triggers        # TPQ / 10,000 lb reporting thresholds, RQ release thresholds
    - cascading_side_effects         # release/inspection → case → posture → permit suspension
    - dual_variant_calculation       # max-vs-average inventory; provisional-vs-assessed fee
    - optimistic_concurrency         # SDS supersede on Facility.version
    - derived_field_reconciliation   # facility posture / hazard_index / outstanding fee computed-on-read

  entity_topology: flat
  # Flat peer entities under a single /epcra prefix, linked by explicit foreign
  # keys (facility_id, chemical_id, release_id). No nesting of business ids in
  # URL paths; cross-aggregate references resolved via filtered-list / sub-resource GETs.

  state_machine_shape: cyclic
  # TierIIFiling is cyclic (RETURNED_FOR_REVISION -> SUBMITTED loop); ReleaseNotification
  # carries two independent parallel dimensions; Inspection is a branching fork with
  # divergent side-effect sets; Facility posture is compound/derived.

  relationship_patterns:
    - one_to_many        # Facility -> {ChemicalInventory, TierIIFiling, SDS, ReleaseNotification, Permit, Inspection, ComplianceCase, RiskManagementPlan}
    - cross_aggregate    # ChemicalInventory / SDS / ReleaseNotification reference the global Chemical catalog
    - polymorphic        # ComplianceCase.origin_ref points at a ReleaseNotification or an Inspection id

  role_model: peer_roles
  # Regulator owns registration/review/enforcement; FacilityOperator owns its own
  # facility's inventory/filings/SDS/releases; LEPCCoordinator owns LEPC-notice acknowledgement.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: epa_facility_id, type: string, source: input, description: "EPA facility registry id; unique across facilities" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code, e.g. TX" }
      - { name: county, type: string, source: input, description: "County / LEPC district name" }
      - { name: operator_name, type: string, source: input, description: "Legal operator of record" }
      - { name: erp_contact_name, type: string, source: system, default: null, description: "Emergency-response contact; set by emergency-response-plan linkage" }
      - { name: erp_contact_phone, type: string, source: system, default: null, description: "24-hour emergency contact phone" }
      - { name: erp_plan_ref, type: string, source: system, default: null, description: "Document reference for the facility emergency response plan" }
      - { name: erp_linked_lepc_district, type: string, source: system, default: null, description: "LEPC district the emergency plan is filed with" }
      - { name: erp_status, type: enum, source: system, default: NONE, constraints: "NONE | ACTIVE", description: "NONE until an emergency-response-plan is linked, then ACTIVE" }
      - { name: compliance_posture, type: enum, source: computed, default: COMPLIANT, constraints: "COMPLIANT | DEFICIENT | ENFORCEMENT", description: "Derived from open ComplianceCases (see calc compliance_posture_derivation)" }
      - { name: open_case_count, type: integer, source: computed, default: 0, description: "Count of ComplianceCases in {OPEN, UNDER_REVIEW}" }
      - { name: hazard_index, type: number, source: computed, default: 0.0, description: "Round-then-sum weighted hazard score over ACTIVE inventories (see calc facility_hazard_index)" }
      - { name: total_outstanding_fee_cents, type: integer, source: computed, default: 0, description: "Sum over filings in {SUBMITTED, UNDER_REVIEW} of (assessed_fee_cents - fee_paid_cents)" }
      - { name: is_rmp_required, type: boolean, source: computed, default: false, description: "True iff facility has an ACTIVE inventory of an EHS chemical over its TPQ" }

  - name: Chemical
    parent: null
    common_fields: true
    fields:
      - { name: cas_number, type: string, source: input, description: "CAS registry number; unique across chemicals" }
      - { name: name, type: string, source: input, description: "Chemical common name" }
      - { name: is_ehs, type: boolean, source: input, description: "Whether this is an Extremely Hazardous Substance (EPCRA 302)" }
      - { name: tpq_lbs, type: integer, source: input, default: null, description: "Threshold Planning Quantity in lbs; required when is_ehs, ignored otherwise" }
      - { name: rq_lbs, type: integer, source: input, description: "Reportable Quantity in lbs for release notification (CERCLA/EPCRA 304)" }
      - { name: hazard_weight, type: number, source: input, description: "Per-1000-lb weighting factor for the facility hazard_index" }
      - { name: physical_state, type: enum, source: input, constraints: "SOLID | LIQUID | GAS", description: "Physical state as stored" }

  - name: ChemicalInventory
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; must equal acting FacilityOperator X-User-ID" }
      - { name: chemical_id, type: string, source: input, description: "FK -> Chemical.id" }
      - { name: reporting_year, type: integer, source: input, description: "Calendar year the amounts describe, e.g. 2025" }
      - { name: max_daily_amount_lbs, type: number, source: input, description: "Maximum amount present on any single day during the year (lbs)" }
      - { name: average_daily_amount_lbs, type: number, source: input, description: "Average amount present per day the chemical was on-site (lbs)" }
      - { name: days_on_site, type: integer, source: input, description: "Number of days the chemical was on-site during the year" }
      - { name: storage_type, type: enum, source: input, constraints: "TANK | CYLINDER | DRUM | BULK", description: "Primary storage container type" }
      - { name: reportable_amount_lbs, type: number, source: computed, description: "MAX variant: equals max_daily_amount_lbs; the basis for threshold determination and Tier II" }
      - { name: average_onsite_lbs, type: number, source: computed, description: "AVERAGE variant: equals average_daily_amount_lbs; reported alongside but never used for thresholds" }
      - { name: applicable_threshold_lbs, type: integer, source: computed, description: "EHS: min(chemical.tpq_lbs, EHS_TPQ_CAP_LBS); non-EHS: NON_EHS_THRESHOLD_LBS" }
      - { name: is_reportable, type: boolean, source: computed, description: "reportable_amount_lbs >= applicable_threshold_lbs" }
      - { name: exceeds_tpq, type: boolean, source: computed, description: "EHS chemicals only: reportable_amount_lbs >= chemical.tpq_lbs; false for non-EHS" }
      - { name: weighted_hazard_contribution, type: number, source: computed, description: "round((max_daily_amount_lbs / 1000) * chemical.hazard_weight, 2)" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | RETIRED", description: "ACTIVE on create; RETIRED via retire action" }

  - name: TierIIFiling
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; must equal acting FacilityOperator X-User-ID" }
      - { name: reporting_year, type: integer, source: input, description: "Calendar year covered by this filing" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | ACCEPTED | RETURNED_FOR_REVISION", description: "Cyclic lifecycle; RETURNED_FOR_REVISION re-enters via submit" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "PROVISIONAL variant: BASE_FEE_CENTS + declared_inventory_count * PROVISIONAL_RATE_CENTS at draft creation" }
      - { name: assessed_fee_cents, type: integer, source: computed, default: 0, description: "ASSESSED variant: tiered per-reportable-chemical + EHS surcharge + late penalty, computed at submit; reset to 0 on RETURN" }
      - { name: fee_paid_cents, type: integer, source: system, default: 0, description: "Cumulative amount paid against this filing" }
      - { name: reportable_chemical_count, type: integer, source: computed, description: "Count of facility ACTIVE inventories for reporting_year with is_reportable=true" }
      - { name: ehs_reportable_count, type: integer, source: computed, description: "Count of those reportable inventories whose chemical.is_ehs=true" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "submitted_at > deadline (strict)" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent submit" }
      - { name: deadline, type: datetime, source: computed, description: "March 1 00:00:00Z of (reporting_year + 1)" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of times this filing has been RETURNED_FOR_REVISION" }

  - name: SDS
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; must equal acting FacilityOperator X-User-ID" }
      - { name: chemical_id, type: string, source: input, description: "FK -> Chemical.id" }
      - { name: document_ref, type: string, source: input, description: "Storage reference / URL for the safety data sheet document" }
      - { name: revision_date, type: datetime, source: input, description: "Manufacturer revision date printed on the SDS" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUPERSEDED", description: "ACTIVE on create; prior ACTIVE sheet for same (facility, chemical) flips to SUPERSEDED" }

  - name: ReleaseNotification
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; must equal acting FacilityOperator X-User-ID" }
      - { name: chemical_id, type: string, source: input, description: "FK -> Chemical.id" }
      - { name: release_datetime, type: datetime, source: input, description: "When the release occurred; must be <= current logical clock" }
      - { name: quantity_released_lbs, type: number, source: input, description: "Quantity released in lbs" }
      - { name: medium, type: enum, source: input, constraints: "AIR | WATER | SOIL", description: "Environmental medium of the release" }
      - { name: reporting_status, type: enum, source: system, default: PENDING_VERBAL, constraints: "PENDING_VERBAL | VERBAL_GIVEN | WRITTEN_FILED", description: "Reporting dimension (independent of remediation_status)" }
      - { name: remediation_status, type: enum, source: system, default: ONGOING, constraints: "ONGOING | CONTAINED | CLOSED", description: "Remediation dimension (independent of reporting_status)" }
      - { name: exceeds_rq, type: boolean, source: computed, description: "quantity_released_lbs >= chemical.rq_lbs" }
      - { name: requires_lepc, type: boolean, source: computed, description: "Equals exceeds_rq; RQ-exceeding releases require LEPC/SERC notice" }
      - { name: origin_case_opened, type: boolean, source: computed, default: false, description: "True when this release auto-opened a RELEASE_RQ_EXCEEDED ComplianceCase" }

  - name: LEPCNotice
    parent: ReleaseNotification
    common_fields: true
    fields:
      - { name: release_id, type: string, source: input, description: "FK -> ReleaseNotification.id" }
      - { name: notice_type, type: enum, source: input, constraints: "VERBAL | WRITTEN", description: "Verbal (immediate) or written (follow-up) notice" }
      - { name: recipient, type: enum, source: input, constraints: "LEPC | SERC | NRC", description: "Recipient body of the notice" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp when the notice was recorded" }
      - { name: acknowledged, type: boolean, source: system, default: false, description: "True once the LEPCCoordinator acknowledges" }

  - name: Permit
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: permit_type, type: enum, source: input, constraints: "OPERATING | STORAGE | AIR", description: "Permit category" }
      - { name: issued_date, type: datetime, source: input, description: "Inclusive start of the permit validity interval" }
      - { name: expiry_date, type: datetime, source: input, description: "Inclusive end of the permit validity interval" }
      - { name: fee_cents, type: integer, source: input, description: "Permit issuance fee in cents" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED | EXPIRED", description: "ACTIVE on issue; SUSPENDED by enforcement cascade; EXPIRED when clock passes expiry_date" }

  - name: Inspection
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: inspector_id, type: string, source: input, description: "Opaque inspector operator id (not an entity FK)" }
      - { name: scheduled_date, type: datetime, source: input, description: "Scheduled point-in-time of the inspection" }
      - { name: status, type: enum, source: system, default: SCHEDULED, constraints: "SCHEDULED | IN_PROGRESS | PASSED | FAILED", description: "Branching fork at completion into PASSED or FAILED" }
      - { name: result, type: enum, source: system, default: null, constraints: "PASS | FAIL | null", description: "Set at completion" }
      - { name: findings_count, type: integer, source: system, default: 0, description: "Number of adverse findings recorded at completion" }

  - name: ComplianceCase
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: origin, type: enum, source: system, default: MANUAL, constraints: "RELEASE_RQ_EXCEEDED | INSPECTION_FAILED | LATE_FILING | MANUAL", description: "What opened the case" }
      - { name: origin_ref, type: string, source: system, default: null, description: "Id of the triggering ReleaseNotification / Inspection / TierIIFiling (polymorphic; not a typed FK)" }
      - { name: severity, type: enum, source: system, default: LOW, constraints: "LOW | MEDIUM | HIGH", description: "HIGH for RELEASE_RQ_EXCEEDED, MEDIUM for INSPECTION_FAILED, LOW for LATE_FILING/MANUAL" }
      - { name: status, type: enum, source: system, default: OPEN, constraints: "OPEN | UNDER_REVIEW | RESOLVED", description: "Case lifecycle" }
      - { name: penalty_cents, type: integer, source: system, default: 0, description: "Penalty assessed at resolution" }

  - name: RiskManagementPlan
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; must equal acting FacilityOperator X-User-ID" }
      - { name: program_level, type: integer, source: input, description: "RMP program level 1, 2, or 3" }
      - { name: submitted_date, type: datetime, source: input, description: "Date the RMP was submitted / most recently resubmitted" }
      - { name: next_due_date, type: datetime, source: computed, description: "submitted_date + RMP_RESUBMIT_YEARS years" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | DUE | OVERDUE", description: "ACTIVE until clock nears/passes next_due_date (DUE/OVERDUE); resubmit returns to ACTIVE" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: TierIIFiling
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    note: "Cyclic — RETURNED_FOR_REVISION re-enters the pipeline via submit."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /epcra/tier-ii-filings/{id}/submit"
        actor: FacilityOperator
        preconditions:
          - "Filing in DRAFT or RETURNED_FOR_REVISION (ERR_FILING_NOT_SUBMITTABLE)"
          - "Facility.compliance_posture != ENFORCEMENT (ERR_FACILITY_UNDER_ENFORCEMENT) — cross-entity"
          - "Every reportable chemical for reporting_year has an ACTIVE SDS at the facility (ERR_MISSING_SDS)"
          - "At least one reportable inventory for reporting_year (ERR_NO_REPORTABLE_CHEMICALS)"
        side_effects:
          - "assessed_fee_cents = tier_ii_filing_fee(ASSESSED variant)"
          - "submitted_at = current logical clock; is_late = submitted_at > deadline"
          - "Facility.total_outstanding_fee_cents increases by assessed_fee_cents (via ledger recompute)"
          - "If is_late: open ComplianceCase(origin=LATE_FILING, severity=LOW, origin_ref=filing.id); posture recomputed"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /epcra/tier-ii-filings/{id}/submit"
        actor: FacilityOperator
        preconditions:
          - "Filing in DRAFT or RETURNED_FOR_REVISION (ERR_FILING_NOT_SUBMITTABLE)"
          - "Same submit preconditions as from DRAFT"
        side_effects:
          - "assessed_fee_cents recomputed; submitted_at / is_late refreshed; outstanding ledger recomputed"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /epcra/tier-ii-filings/{id}/review (decision=BEGIN)"
        actor: Regulator
        preconditions:
          - "Filing in SUBMITTED (ERR_FILING_NOT_REVIEWABLE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /epcra/tier-ii-filings/{id}/review (decision=ACCEPT)"
        actor: Regulator
        preconditions:
          - "Filing in UNDER_REVIEW (ERR_FILING_NOT_REVIEWABLE)"
          - "fee_paid_cents >= assessed_fee_cents (ERR_FEE_UNPAID)"
        side_effects:
          - "Filing terminal; leaves {SUBMITTED,UNDER_REVIEW} so outstanding ledger drops its (assessed-paid)=0 contribution"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /epcra/tier-ii-filings/{id}/review (decision=RETURN)"
        actor: Regulator
        preconditions:
          - "Filing in UNDER_REVIEW (ERR_FILING_NOT_REVIEWABLE)"
        side_effects:
          - "COMPENSATION: assessed_fee_cents reset to 0; filing leaves {SUBMITTED,UNDER_REVIEW} so Facility.total_outstanding_fee_cents decreases by the previously-assessed amount"
          - "revision_count += 1"

  - entity: ReleaseNotification
    initial_state: PENDING_VERBAL   # reporting dimension initial; remediation initial is ONGOING
    terminal_states: [WRITTEN_FILED, CLOSED]
    note: "Parallel dimensions — reporting_status (PENDING_VERBAL->VERBAL_GIVEN->WRITTEN_FILED) and remediation_status (ONGOING->CONTAINED->CLOSED) advance independently on the same row."
    transitions:
      - from: "reporting:PENDING_VERBAL"
        to: "reporting:VERBAL_GIVEN"
        trigger: "POST /epcra/release-notifications/{id}/report (stage=VERBAL)"
        actor: FacilityOperator
        preconditions:
          - "reporting_status == PENDING_VERBAL (ERR_RELEASE_INVALID_STAGE)"
        side_effects: []
      - from: "reporting:VERBAL_GIVEN"
        to: "reporting:WRITTEN_FILED"
        trigger: "POST /epcra/release-notifications/{id}/report (stage=WRITTEN)"
        actor: FacilityOperator
        preconditions:
          - "reporting_status == VERBAL_GIVEN (ERR_RELEASE_INVALID_STAGE)"
          - "Facility.erp_status == ACTIVE (ERR_NO_ERP_LINKAGE) — cross-entity"
        side_effects: []
      - from: "remediation:ONGOING"
        to: "remediation:CONTAINED"
        trigger: "POST /epcra/release-notifications/{id}/remediation (to=CONTAINED)"
        actor: FacilityOperator
        preconditions:
          - "remediation_status == ONGOING (ERR_RELEASE_INVALID_STAGE)"
        side_effects: []
      - from: "remediation:CONTAINED"
        to: "remediation:CLOSED"
        trigger: "POST /epcra/release-notifications/{id}/remediation (to=CLOSED)"
        actor: FacilityOperator
        preconditions:
          - "remediation_status == CONTAINED (ERR_RELEASE_INVALID_STAGE)"
        side_effects: []
      - from: "(create)"
        to: "reporting:PENDING_VERBAL"
        trigger: "POST /epcra/release-notifications"
        actor: FacilityOperator
        preconditions:
          - "release_datetime <= current logical clock (ERR_FUTURE_RELEASE)"
        side_effects:
          - "exceeds_rq = quantity_released_lbs >= chemical.rq_lbs; requires_lepc = exceeds_rq"
          - "CASCADE hop 1 — if exceeds_rq: open ComplianceCase(origin=RELEASE_RQ_EXCEEDED, severity=HIGH, origin_ref=release.id); origin_case_opened=true"
          - "CASCADE hop 2 — new HIGH case forces Facility.compliance_posture -> ENFORCEMENT"
          - "CASCADE hop 3 — because posture entered ENFORCEMENT, every ACTIVE Permit of the facility -> SUSPENDED"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    note: "Branching fork at completion — PASSED and FAILED carry divergent side-effect sets."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /epcra/inspections/{id}/start"
        actor: Regulator
        preconditions:
          - "Inspection in SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED)"
        side_effects: []
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /epcra/inspections/{id}/complete (result=PASS)"
        actor: Regulator
        preconditions:
          - "Inspection in IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS)"
        side_effects:
          - "result = PASS; findings_count = 0"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /epcra/inspections/{id}/complete (result=FAIL)"
        actor: Regulator
        preconditions:
          - "Inspection in IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS)"
        side_effects:
          - "result = FAIL; findings_count set from payload"
          - "CASCADE hop 1 — open ComplianceCase(origin=INSPECTION_FAILED, severity=MEDIUM, origin_ref=inspection.id)"
          - "CASCADE hop 2 — new open case forces Facility.compliance_posture -> DEFICIENT (unless already ENFORCEMENT)"

  - entity: ComplianceCase
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /epcra/compliance-cases/{id}/review"
        actor: Regulator
        preconditions:
          - "Case in OPEN (ERR_CASE_NOT_OPEN)"
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /epcra/compliance-cases/{id}/resolve"
        actor: Regulator
        preconditions:
          - "Case in UNDER_REVIEW (ERR_CASE_NOT_UNDER_REVIEW)"
          - "Facility's most recent Inspection is PASSED (ERR_UNRESOLVED_INSPECTION) — cross-entity"
        side_effects:
          - "penalty_cents set from payload; open_case_count recomputed"
          - "Facility.compliance_posture recomputed; if it leaves ENFORCEMENT, every SUSPENDED Permit -> ACTIVE (compensating reinstatement)"

  - entity: Permit
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (facility enters ENFORCEMENT via release RQ cascade)"
        actor: system
        preconditions:
          - "Permit ACTIVE at the moment the facility posture becomes ENFORCEMENT"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (facility leaves ENFORCEMENT when its last enforcement case resolves)"
        actor: system
        preconditions:
          - "Permit SUSPENDED and facility posture no longer ENFORCEMENT"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (current logical clock > expiry_date, evaluated on read/access)"
        actor: system
        preconditions:
          - "Permit ACTIVE and clock past expiry_date"
        side_effects: []

  - entity: RiskManagementPlan
    initial_state: ACTIVE
    terminal_states: []
    note: "Cyclic — OVERDUE/DUE return to ACTIVE via resubmit."
    transitions:
      - from: ACTIVE
        to: DUE
        trigger: "system (clock within RMP_DUE_WINDOW_DAYS of next_due_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DUE
        to: OVERDUE
        trigger: "system (clock > next_due_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: ACTIVE
        trigger: "POST /epcra/risk-management-plans/{id}/resubmit"
        actor: FacilityOperator
        preconditions: []
        side_effects:
          - "submitted_date set from payload; next_due_date = submitted_date + RMP_RESUBMIT_YEARS years"
      - from: DUE
        to: ACTIVE
        trigger: "POST /epcra/risk-management-plans/{id}/resubmit"
        actor: FacilityOperator
        preconditions: []
        side_effects:
          - "submitted_date set from payload; next_due_date recomputed"

  - entity: ChemicalInventory
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /epcra/chemical-inventories/{id}/retire"
        actor: FacilityOperator
        preconditions:
          - "Inventory in ACTIVE (ERR_INVENTORY_NOT_ACTIVE)"
        side_effects:
          - "COMPENSATION: inventory leaves the ACTIVE set, so Facility.hazard_index decreases by exactly this row's weighted_hazard_contribution; is_rmp_required recomputed"

  - entity: SDS
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer SDS is created for the same facility+chemical)"
        actor: system
        preconditions:
          - "A newer SDS for the same (facility_id, chemical_id) is successfully created"
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: sds-create-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /epcra/sds"
    occ_field: "expected_facility_version"
    description: |
      Creating an SDS that supersedes the prior ACTIVE sheet for the same
      (facility_id, chemical_id) against a Facility whose version has advanced
      since the client last observed it is rejected. A newly created SDS
      legitimately supersedes the prior one, so a second create carrying a
      stale expected_facility_version is operating on an out-of-date view of
      the facility's SDS repository and is refused.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: reportable_amount
    trigger: "ChemicalInventory create"
    algorithm: dual_variant_selection
    formula: |
      reportable_amount_lbs = max_daily_amount_lbs            # MAX variant
      average_onsite_lbs    = average_daily_amount_lbs        # AVERAGE variant
      # Threshold determination and Tier II reportability ALWAYS use the MAX
      # variant. The AVERAGE variant is reported for information only and is
      # NEVER substituted into any threshold or fee decision.
    input_set: "The single inventory row being created."
    precision: "lbs, exact (no rounding)"
    variants:
      - name: MAX
        when: "threshold determination, is_reportable, exceeds_tpq, Tier II reportable_chemical_count"
        difference: "Uses max_daily_amount_lbs (the peak single-day holding)."
      - name: AVERAGE
        when: "informational average_onsite_lbs field only"
        difference: "Uses average_daily_amount_lbs; can differ from MAX for the same row and must never drive a threshold."

  - name: applicable_threshold_determination
    trigger: "ChemicalInventory create"
    algorithm: threshold
    formula: |
      if chemical.is_ehs:
        applicable_threshold_lbs = min(chemical.tpq_lbs, EHS_TPQ_CAP_LBS)
        exceeds_tpq = (reportable_amount_lbs >= chemical.tpq_lbs)
      else:
        applicable_threshold_lbs = NON_EHS_THRESHOLD_LBS
        exceeds_tpq = false
      is_reportable = (reportable_amount_lbs >= applicable_threshold_lbs)   # boundary: >=, not >
    input_set: "Single inventory row + its Chemical catalog entry."
    constants:
      NON_EHS_THRESHOLD_LBS: 10000
      EHS_TPQ_CAP_LBS: 500
    precision: "integer lbs comparison; inclusive lower bound (>=)"
    note: "Combinatorial mode (a): >=3 inputs (is_ehs, tpq_lbs, EHS_TPQ_CAP_LBS, reportable_amount_lbs) with a conditional branch and a nested min()."

  - name: facility_hazard_index
    trigger: "read of Facility.hazard_index (derived); recomputed whenever ACTIVE inventory set changes"
    algorithm: weighted_scoring
    formula: |
      # ROUND-THEN-SUM is pinned. Do NOT sum raw terms then round.
      terms = [ round((inv.max_daily_amount_lbs / 1000) * inv.chemical.hazard_weight, 2)
                for inv in facility ACTIVE ChemicalInventory ]     # status == ACTIVE only
      hazard_index = sum(terms)                                     # already-rounded 2dp terms summed
    input_set: "Facility ChemicalInventory rows with status == ACTIVE (RETIRED excluded)."
    constants:
      LBS_PER_UNIT: 1000
    precision: "each term round_half_up to 2 decimals, THEN summed"
    note: "Combinatorial mode (b): rounding order is decisive — round-per-term-then-sum differs from sum-then-round for weights whose per-term products carry a 3rd-decimal .xx5."

  - name: tier_ii_filing_fee
    trigger: "TierIIFiling create (PROVISIONAL) and submit (ASSESSED)"
    algorithm: tiered_pricing
    formula: |
      # PROVISIONAL — at draft creation, over ALL inventory rows for the year:
      declared_inventory_count = count(facility ACTIVE ChemicalInventory for reporting_year)
      provisional_fee_cents = BASE_FEE_CENTS + declared_inventory_count * PROVISIONAL_RATE_CENTS

      # ASSESSED — at submit, over REPORTABLE rows only, evaluation order pinned:
      N = reportable_chemical_count          # is_reportable == true rows for the year
      E = ehs_reportable_count               # subset whose chemical.is_ehs
      if   N <= INCLUDED_CHEMICALS: per = 0
      elif N <= TIER1_MAX:          per = (N - INCLUDED_CHEMICALS) * TIER1_RATE_CENTS
      else:                         per = (TIER1_MAX - INCLUDED_CHEMICALS) * TIER1_RATE_CENTS
                                          + (N - TIER1_MAX) * TIER2_RATE_CENTS
      ehs_surcharge = E * EHS_SURCHARGE_CENTS
      subtotal      = BASE_FEE_CENTS + per + ehs_surcharge
      late_penalty  = round(subtotal * LATE_PENALTY_PCT) if is_late else 0   # step 1: subtotal, step 2: penalty
      assessed_fee_cents = subtotal + late_penalty
    input_set: "PROVISIONAL: all ACTIVE inventories for (facility, year). ASSESSED: reportable subset."
    constants:
      BASE_FEE_CENTS: 5000
      PROVISIONAL_RATE_CENTS: 2000
      INCLUDED_CHEMICALS: 5
      TIER1_MAX: 25
      TIER1_RATE_CENTS: 2000
      TIER2_RATE_CENTS: 1000
      EHS_SURCHARGE_CENTS: 5000
      LATE_PENALTY_PCT: 0.10
    precision: "integer cents; round_half_up on the single late-penalty multiplication"
    variants:
      - name: PROVISIONAL
        when: "computed once at draft creation"
        difference: "Flat per-declared-row estimate over ALL inventories; no EHS surcharge, no late penalty."
      - name: ASSESSED
        when: "computed at submit"
        difference: "Tiered over REPORTABLE rows only, plus EHS surcharge and late penalty; differs from PROVISIONAL on identical inventory."

  - name: release_rq_determination
    trigger: "ReleaseNotification create"
    algorithm: threshold
    formula: |
      exceeds_rq   = (quantity_released_lbs >= chemical.rq_lbs)   # boundary: >=, not >
      requires_lepc = exceeds_rq
    input_set: "Single release row + its Chemical catalog entry."
    precision: "lbs comparison, inclusive lower bound (>=)"

  - name: facility_outstanding_fee_ledger
    trigger: "read of Facility.total_outstanding_fee_cents (derived); reconciled on any filing submit/return/pay/accept"
    algorithm: aggregation
    formula: |
      total_outstanding_fee_cents =
        sum( (f.assessed_fee_cents - f.fee_paid_cents)
             for f in facility TierIIFiling if f.status in {SUBMITTED, UNDER_REVIEW} )
    input_set: "Facility TierIIFilings whose status is SUBMITTED or UNDER_REVIEW (DRAFT / RETURNED_FOR_REVISION / ACCEPTED excluded)."
    precision: "integer cents; never below 0 per filing"
    note: "Conserved quantity for the fee compensation invariant: submit adds a filing's (assessed-paid); return removes it (and zeroes assessed), so a submit->return round-trip with no payment restores the pre-submit total exactly."

  - name: compliance_posture_derivation
    trigger: "read of Facility.compliance_posture; recomputed on case open / resolve"
    algorithm: aggregation
    formula: |
      open_cases = [c for c in facility ComplianceCase if c.status in {OPEN, UNDER_REVIEW}]
      open_case_count = len(open_cases)
      if any(c.origin == RELEASE_RQ_EXCEEDED or c.severity == HIGH for c in open_cases):
        compliance_posture = ENFORCEMENT
      elif open_case_count > 0:
        compliance_posture = DEFICIENT
      else:
        compliance_posture = COMPLIANT
    input_set: "Facility ComplianceCases in {OPEN, UNDER_REVIEW}."
    precision: "exact enum selection"

  - name: rmp_next_due_date
    trigger: "RiskManagementPlan create and resubmit"
    algorithm: decay_function
    formula: |
      next_due_date = submitted_date + RMP_RESUBMIT_YEARS years
    constants:
      RMP_RESUBMIT_YEARS: 5
      RMP_DUE_WINDOW_DAYS: 90
    precision: "calendar date arithmetic"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and recognized"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation; for FacilityOperator, X-User-ID equals the target resource's facility_id (ownership)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numbers non-negative, EHS chemical carries tpq_lbs"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 4
    category: existence
    check: "All referenced ids exist (facility_id, chemical_id, release_id, path ids)"
    error_id: "ERR_FACILITY_NOT_FOUND / ERR_CHEMICAL_NOT_FOUND / ERR_INVENTORY_NOT_FOUND / ERR_FILING_NOT_FOUND / ERR_SDS_NOT_FOUND / ERR_RELEASE_NOT_FOUND / ERR_PERMIT_NOT_FOUND / ERR_INSPECTION_NOT_FOUND / ERR_CASE_NOT_FOUND / ERR_RMP_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body references"

  - priority: 5
    category: state
    check: "Optimistic concurrency: expected_facility_version matches current Facility.version"
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    applies_to: "POST /epcra/sds"

  - priority: 6
    category: state
    check: "Target resource in a state that permits the requested transition"
    error_id: "ERR_FILING_NOT_SUBMITTABLE / ERR_FILING_NOT_REVIEWABLE / ERR_INSPECTION_NOT_SCHEDULED / ERR_INSPECTION_NOT_IN_PROGRESS / ERR_CASE_NOT_OPEN / ERR_CASE_NOT_UNDER_REVIEW / ERR_RELEASE_INVALID_STAGE / ERR_INVENTORY_NOT_ACTIVE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Tier II submit: every reportable chemical for the reporting_year has an ACTIVE SDS at the facility"
    error_id: ERR_MISSING_SDS
    http_status: 409
    applies_to: "POST /epcra/tier-ii-filings/{id}/submit"

  - priority: 8
    category: business_referential
    check: "Tier II submit: at least one reportable inventory exists for the reporting_year (non-empty reportable set)"
    error_id: ERR_NO_REPORTABLE_CHEMICALS
    http_status: 422
    applies_to: "POST /epcra/tier-ii-filings/{id}/submit"

  - priority: 9
    category: business_temporal
    check: "Interval / point temporal conflicts: permit period overlap; inspector double-booking within buffer; future release; written follow-up without ERP linkage"
    error_id: "ERR_PERMIT_PERIOD_OVERLAP / ERR_INSPECTOR_DOUBLE_BOOKED / ERR_FUTURE_RELEASE / ERR_NO_ERP_LINKAGE"
    http_status: 409
    applies_to: "POST /epcra/permits, POST /epcra/inspections, POST /epcra/release-notifications, POST /epcra/release-notifications/{id}/report"

  - priority: 10
    category: business_constraint
    check: "Cross-entity gating: filing submit blocked while facility ENFORCEMENT; case resolve blocked unless latest inspection PASSED"
    error_id: "ERR_FACILITY_UNDER_ENFORCEMENT / ERR_UNRESOLVED_INSPECTION"
    http_status: 409
    applies_to: "POST /epcra/tier-ii-filings/{id}/submit, POST /epcra/compliance-cases/{id}/resolve"

  - priority: 11
    category: business_fiscal
    check: "Fiscal gates: permit issuance requires zero facility outstanding fees; filing accept requires fee fully paid"
    error_id: "ERR_OUTSTANDING_FEES / ERR_FEE_UNPAID"
    http_status: 402
    applies_to: "POST /epcra/permits, POST /epcra/tier-ii-filings/{id}/review"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Regulator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # --- Facilities ---
  - method: POST
    path: "/epcra/facilities"
    description: "Register a regulated facility"
    roles: [Regulator]
    code: 201
    input: [name, epa_facility_id, state_code, county, operator_name]
    output: Facility
    side_effects: ["status fields initialized; compliance_posture=COMPLIANT; erp_status=NONE; version=1"]
  - method: GET
    path: "/epcra/facilities"
    description: "List facilities"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: "Facility[]"
    side_effects: []
  - method: GET
    path: "/epcra/facilities/{id}"
    description: "Get a facility (derived posture/hazard/outstanding fields reconciled on read)"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: POST
    path: "/epcra/facilities/{id}/emergency-response-plan"
    description: "Link / update the facility emergency-response plan (emergency-response linkage)"
    roles: [FacilityOperator]
    code: 200
    input: [contact_name, contact_phone, plan_ref, linked_lepc_district]
    output: Facility
    side_effects: ["erp_* fields set; erp_status=ACTIVE; increments Facility.version by 1"]
  - method: GET
    path: "/epcra/facilities/{id}/tier-ii-filings"
    description: "List a facility's Tier II filings"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: "TierIIFiling[]"
    side_effects: []
  - method: GET
    path: "/epcra/facilities/{id}/permits"
    description: "List a facility's permits"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: "Permit[]"
    side_effects: []
  - method: GET
    path: "/epcra/facilities/{id}/inspections"
    description: "List a facility's inspections"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: "Inspection[]"
    side_effects: []
  - method: GET
    path: "/epcra/facilities/{id}/compliance-cases"
    description: "List a facility's compliance cases (only reverse-discovery channel for cascade-created cases)"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: "ComplianceCase[]"
    side_effects: []
  - method: GET
    path: "/epcra/facilities/{id}/risk-management-plans"
    description: "List a facility's risk-management plans"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: "RiskManagementPlan[]"
    side_effects: []

  # --- Chemicals (global catalog) ---
  - method: POST
    path: "/epcra/chemicals"
    description: "Add a chemical to the global catalog"
    roles: [Regulator]
    code: 201
    input: [cas_number, name, is_ehs, rq_lbs, hazard_weight, physical_state, "tpq_lbs?"]
    output: Chemical
    side_effects: []
  - method: GET
    path: "/epcra/chemicals"
    description: "List catalog chemicals"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: ["is_ehs?", "limit?", "offset?"]
    output: "Chemical[]"
    side_effects: []
  - method: GET
    path: "/epcra/chemicals/{id}"
    description: "Get a catalog chemical"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: Chemical
    side_effects: []

  # --- Chemical Inventories ---
  - method: POST
    path: "/epcra/chemical-inventories"
    description: "Declare a facility chemical inventory for a reporting year"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, chemical_id, reporting_year, max_daily_amount_lbs, average_daily_amount_lbs, days_on_site, storage_type]
    output: ChemicalInventory
    side_effects:
      - "reportable_amount_lbs / average_onsite_lbs / applicable_threshold_lbs / is_reportable / exceeds_tpq / weighted_hazard_contribution computed"
      - "Facility.hazard_index and is_rmp_required reconciled (derived-on-read)"
  - method: GET
    path: "/epcra/chemical-inventories"
    description: "List inventories, filterable by facility, chemical, and year"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: ["facility_id?", "chemical_id?", "reporting_year?", "limit?", "offset?"]
    output: "ChemicalInventory[]"
    side_effects: []
  - method: GET
    path: "/epcra/chemical-inventories/{id}"
    description: "Get an inventory row"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: ChemicalInventory
    side_effects: []
  - method: POST
    path: "/epcra/chemical-inventories/{id}/retire"
    description: "Retire an inventory row"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: ChemicalInventory
    side_effects: ["status=RETIRED; Facility.hazard_index drops by this row's weighted_hazard_contribution; is_rmp_required recomputed"]

  # --- Tier II Filings ---
  - method: POST
    path: "/epcra/tier-ii-filings"
    description: "Open a Tier II filing draft for a reporting year"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, reporting_year]
    output: TierIIFiling
    side_effects: ["status=DRAFT; provisional_fee_cents computed; deadline computed"]
  - method: POST
    path: "/epcra/tier-ii-filings/{id}/submit"
    description: "Submit (or resubmit after revision) a Tier II filing"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: TierIIFiling
    side_effects:
      - "status DRAFT/RETURNED_FOR_REVISION -> SUBMITTED"
      - "assessed_fee_cents computed (ASSESSED variant); submitted_at / is_late set; outstanding ledger recomputed"
      - "If is_late: ComplianceCase(origin=LATE_FILING) opened; posture recomputed"
  - method: POST
    path: "/epcra/tier-ii-filings/{id}/review"
    description: "Regulator review decision: BEGIN, ACCEPT, or RETURN"
    roles: [Regulator]
    code: 200
    input: [decision]
    output: TierIIFiling
    side_effects:
      - "BEGIN: SUBMITTED -> UNDER_REVIEW"
      - "ACCEPT: UNDER_REVIEW -> ACCEPTED (requires fee paid)"
      - "RETURN: UNDER_REVIEW -> RETURNED_FOR_REVISION; assessed_fee_cents reset to 0; outstanding drops; revision_count += 1"
  - method: POST
    path: "/epcra/tier-ii-filings/{id}/pay"
    description: "Record a fee payment against a filing"
    roles: [FacilityOperator]
    code: 200
    input: [amount_cents]
    output: TierIIFiling
    side_effects: ["fee_paid_cents += amount_cents; outstanding ledger recomputed"]

  # --- SDS repository ---
  - method: POST
    path: "/epcra/sds"
    description: "Upload an SDS; supersedes prior ACTIVE sheet for same facility+chemical (OCC on Facility.version)"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, chemical_id, document_ref, revision_date, expected_facility_version]
    output: SDS
    side_effects:
      - "prior ACTIVE SDS for (facility_id, chemical_id) -> SUPERSEDED"
      - "increments Facility.version by 1"
  - method: GET
    path: "/epcra/sds"
    description: "List SDS documents, filterable by facility and chemical"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: ["facility_id?", "chemical_id?", "limit?", "offset?"]
    output: "SDS[]"
    side_effects: []
  - method: GET
    path: "/epcra/sds/{id}"
    description: "Get an SDS document"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: SDS
    side_effects: []

  # --- Release Notifications ---
  - method: POST
    path: "/epcra/release-notifications"
    description: "Report a chemical release; RQ-exceeding releases trigger the enforcement cascade"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, chemical_id, release_datetime, quantity_released_lbs, medium]
    output: ReleaseNotification
    side_effects:
      - "reporting_status=PENDING_VERBAL; remediation_status=ONGOING; exceeds_rq / requires_lepc computed"
      - "If exceeds_rq: ComplianceCase(RELEASE_RQ_EXCEEDED, HIGH) opened -> posture ENFORCEMENT -> ACTIVE permits SUSPENDED"
  - method: GET
    path: "/epcra/release-notifications"
    description: "List releases, filterable by facility and chemical"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: ["facility_id?", "chemical_id?", "limit?", "offset?"]
    output: "ReleaseNotification[]"
    side_effects: []
  - method: GET
    path: "/epcra/release-notifications/{id}"
    description: "Get a release notification"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: ReleaseNotification
    side_effects: []
  - method: POST
    path: "/epcra/release-notifications/{id}/report"
    description: "Advance the reporting dimension (VERBAL then WRITTEN)"
    roles: [FacilityOperator]
    code: 200
    input: [stage]
    output: ReleaseNotification
    side_effects: ["reporting_status advances per parallel state machine"]
  - method: POST
    path: "/epcra/release-notifications/{id}/remediation"
    description: "Advance the remediation dimension (CONTAINED then CLOSED)"
    roles: [FacilityOperator]
    code: 200
    input: [to]
    output: ReleaseNotification
    side_effects: ["remediation_status advances per parallel state machine"]
  - method: GET
    path: "/epcra/release-notifications/{id}/lepc-notices"
    description: "List LEPC/SERC/NRC notices for a release"
    roles: [Regulator, FacilityOperator, LEPCCoordinator]
    code: 200
    input: []
    output: "LEPCNotice[]"
    side_effects: []

  # --- LEPC Notices ---
  - method: POST
    path: "/epcra/lepc-notices"
    description: "Record a LEPC/SERC/NRC notice for a release"
    roles: [FacilityOperator]
    code: 201
    input: [release_id, notice_type, recipient]
    output: LEPCNotice
    side_effects: ["sent_at stamped from logical clock; acknowledged=false"]
  - method: POST
    path: "/epcra/lepc-notices/{id}/acknowledge"
    description: "LEPC coordinator acknowledges receipt of a notice"
    roles: [LEPCCoordinator]
    code: 200
    input: []
    output: LEPCNotice
    side_effects: ["acknowledged=true"]

  # --- Permits ---
  - method: POST
    path: "/epcra/permits"
    description: "Issue a facility permit"
    roles: [Regulator]
    code: 201
    input: [facility_id, permit_type, issued_date, expiry_date, fee_cents]
    output: Permit
    side_effects: ["status=ACTIVE"]

  # --- Inspections ---
  - method: POST
    path: "/epcra/inspections"
    description: "Schedule a facility inspection"
    roles: [Regulator]
    code: 201
    input: [facility_id, inspector_id, scheduled_date]
    output: Inspection
    side_effects: ["status=SCHEDULED"]
  - method: POST
    path: "/epcra/inspections/{id}/start"
    description: "Begin a scheduled inspection"
    roles: [Regulator]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status=IN_PROGRESS"]
  - method: POST
    path: "/epcra/inspections/{id}/complete"
    description: "Complete an inspection with PASS or FAIL"
    roles: [Regulator]
    code: 200
    input: [result, "findings_count?"]
    output: Inspection
    side_effects:
      - "PASS: status=PASSED"
      - "FAIL: status=FAILED; ComplianceCase(INSPECTION_FAILED, MEDIUM) opened -> posture DEFICIENT"

  # --- Compliance Cases ---
  - method: POST
    path: "/epcra/compliance-cases"
    description: "Open a compliance case manually"
    roles: [Regulator]
    code: 201
    input: [facility_id, "severity?"]
    output: ComplianceCase
    side_effects: ["origin=MANUAL; status=OPEN; posture recomputed"]
  - method: POST
    path: "/epcra/compliance-cases/{id}/review"
    description: "Move a case into review"
    roles: [Regulator]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: ["status OPEN -> UNDER_REVIEW"]
  - method: POST
    path: "/epcra/compliance-cases/{id}/resolve"
    description: "Resolve a case (requires latest inspection PASSED)"
    roles: [Regulator]
    code: 200
    input: ["penalty_cents?"]
    output: ComplianceCase
    side_effects:
      - "status UNDER_REVIEW -> RESOLVED; penalty_cents set; open_case_count recomputed"
      - "posture recomputed; if it leaves ENFORCEMENT, SUSPENDED permits reinstated to ACTIVE"

  # --- Risk Management Plans ---
  - method: POST
    path: "/epcra/risk-management-plans"
    description: "Submit a facility RMP"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, program_level, submitted_date]
    output: RiskManagementPlan
    side_effects: ["status=ACTIVE; next_due_date computed"]
  - method: POST
    path: "/epcra/risk-management-plans/{id}/resubmit"
    description: "Resubmit an RMP (returns DUE/OVERDUE to ACTIVE)"
    roles: [FacilityOperator]
    code: 200
    input: [submitted_date]
    output: RiskManagementPlan
    side_effects: ["submitted_date updated; next_due_date recomputed; status=ACTIVE"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_AUTH_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or unrecognized" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation, or FacilityOperator acting on a facility it does not own" }
  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, negative amount, or EHS chemical without tpq_lbs" }
  # --- Not found ---
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id does not exist" }
  - { id: ERR_CHEMICAL_NOT_FOUND, http: 404, condition: "Chemical id does not exist" }
  - { id: ERR_INVENTORY_NOT_FOUND, http: 404, condition: "Chemical inventory id does not exist" }
  - { id: ERR_FILING_NOT_FOUND, http: 404, condition: "Tier II filing id does not exist" }
  - { id: ERR_SDS_NOT_FOUND, http: 404, condition: "SDS id does not exist" }
  - { id: ERR_RELEASE_NOT_FOUND, http: 404, condition: "Release notification id does not exist" }
  - { id: ERR_LEPC_NOTICE_NOT_FOUND, http: 404, condition: "LEPC notice id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Permit id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Compliance case id does not exist" }
  - { id: ERR_RMP_NOT_FOUND, http: 404, condition: "Risk management plan id does not exist" }
  # --- Concurrency ---
  - { id: ERR_STALE_FACILITY_VERSION, http: 412, condition: "expected_facility_version does not match current Facility.version on SDS create" }
  # --- State ---
  - { id: ERR_FILING_NOT_SUBMITTABLE, http: 409, condition: "Submit attempted on a filing not in DRAFT or RETURNED_FOR_REVISION" }
  - { id: ERR_FILING_NOT_REVIEWABLE, http: 409, condition: "Review decision invalid for the filing's current status" }
  - { id: ERR_INSPECTION_NOT_SCHEDULED, http: 409, condition: "Start attempted on an inspection not in SCHEDULED" }
  - { id: ERR_INSPECTION_NOT_IN_PROGRESS, http: 409, condition: "Complete attempted on an inspection not in IN_PROGRESS" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "Review attempted on a case not in OPEN" }
  - { id: ERR_CASE_NOT_UNDER_REVIEW, http: 409, condition: "Resolve attempted on a case not in UNDER_REVIEW" }
  - { id: ERR_RELEASE_INVALID_STAGE, http: 409, condition: "Report/remediation advance out of order for the current dimension state" }
  - { id: ERR_INVENTORY_NOT_ACTIVE, http: 409, condition: "Retire attempted on an inventory not in ACTIVE" }
  # --- Safety / referential ---
  - { id: ERR_MISSING_SDS, http: 409, condition: "Submit blocked: a reportable chemical for the year lacks an ACTIVE SDS" }
  - { id: ERR_NO_REPORTABLE_CHEMICALS, http: 422, condition: "Submit blocked: no reportable inventory exists for the reporting_year" }
  # --- Temporal ---
  - { id: ERR_PERMIT_PERIOD_OVERLAP, http: 409, condition: "New permit's [issued,expiry] interval overlaps an existing same-type permit on the facility" }
  - { id: ERR_INSPECTOR_DOUBLE_BOOKED, http: 409, condition: "Inspection scheduled within MIN_INSPECTION_GAP_HOURS (=24 hours) of another for the same inspector_id" }
  - { id: ERR_FUTURE_RELEASE, http: 422, condition: "release_datetime is after the current logical clock" }
  - { id: ERR_NO_ERP_LINKAGE, http: 409, condition: "Written follow-up filed while facility erp_status is not ACTIVE" }
  # --- Cross-entity constraint ---
  - { id: ERR_FACILITY_UNDER_ENFORCEMENT, http: 409, condition: "Filing submit blocked while facility compliance_posture is ENFORCEMENT" }
  - { id: ERR_UNRESOLVED_INSPECTION, http: 409, condition: "Case resolve blocked because the facility's most recent inspection is not PASSED" }
  # --- Fiscal ---
  - { id: ERR_OUTSTANDING_FEES, http: 402, condition: "Permit issuance blocked while facility total_outstanding_fee_cents > 0" }
  - { id: ERR_FEE_UNPAID, http: 402, condition: "Filing accept blocked because fee_paid_cents < assessed_fee_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Regulator
    description: "State/SERC regulatory authority: registers facilities and chemicals, reviews filings, issues permits, runs inspections, and manages enforcement cases."
    identity: opaque
    exclusive_operations:
      - "POST /epcra/facilities — register facility"
      - "POST /epcra/chemicals — catalog chemical"
      - "POST /epcra/tier-ii-filings/{id}/review — review filing"
      - "POST /epcra/permits — issue permit"
      - "POST /epcra/inspections — schedule inspection"
      - "POST /epcra/inspections/{id}/start — start inspection"
      - "POST /epcra/inspections/{id}/complete — complete inspection"
      - "POST /epcra/compliance-cases — open case"
      - "POST /epcra/compliance-cases/{id}/review — review case"
      - "POST /epcra/compliance-cases/{id}/resolve — resolve case"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET /epcra/** — read any resource"

  - name: FacilityOperator
    description: "Operator of a specific facility (X-User-ID == its Facility.id); manages that facility's inventory, filings, SDS, releases, RMP, and emergency-response linkage."
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /epcra/facilities/{id}/emergency-response-plan — link ERP"
      - "POST /epcra/chemical-inventories — declare inventory"
      - "POST /epcra/chemical-inventories/{id}/retire — retire inventory"
      - "POST /epcra/tier-ii-filings — open filing draft"
      - "POST /epcra/tier-ii-filings/{id}/submit — submit filing"
      - "POST /epcra/tier-ii-filings/{id}/pay — pay fee"
      - "POST /epcra/sds — upload SDS"
      - "POST /epcra/release-notifications — report release"
      - "POST /epcra/release-notifications/{id}/report — advance reporting"
      - "POST /epcra/release-notifications/{id}/remediation — advance remediation"
      - "POST /epcra/lepc-notices — record LEPC notice"
      - "POST /epcra/risk-management-plans — submit RMP"
      - "POST /epcra/risk-management-plans/{id}/resubmit — resubmit RMP"
    shared_operations:
      - "GET /epcra/** — read any resource"

  - name: LEPCCoordinator
    description: "Local Emergency Planning Committee coordinator; acknowledges LEPC/SERC/NRC notices and reads facility compliance data."
    identity: opaque
    exclusive_operations:
      - "POST /epcra/lepc-notices/{id}/acknowledge — acknowledge notice"
    shared_operations:
      - "GET /epcra/** — read any resource"
