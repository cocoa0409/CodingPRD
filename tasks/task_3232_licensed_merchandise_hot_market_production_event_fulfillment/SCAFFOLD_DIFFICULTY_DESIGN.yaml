            - "every FulfillmentOrder of run ${po7_id} has requested_wholesale_cents == 0"
            - "FulfillmentOrder.${fo7x_id}.realized_wholesale_cents == 0"

      - name: print_failure_two_hop_rescale
        grounds:
          - state_machines.PrintLayer.PRINTED_to_PRINT_FAILED
          - state_machines.FulfillmentOrder.PLANNED_to_DISTRESSED
          - entities.ProductionOrder.fields.base_units_printed
        distinguishing_aspect: "A print-failure first reduces the parent run's base_units_printed, and that reduction is what rescales the run's open order to zero wholesale value — the order's collapse is caused by the layer change and not by the failure request directly."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC8, design DSG8 APPROVED, run PO8 committed with a BASE layer of 20 and one ECOM order of 100 units in PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
