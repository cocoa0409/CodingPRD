          - entities.Junction.fields.road_a_id
          - entities.Junction.fields.road_b_id
          - validations.priority_8_body_fk_not_found
        distinguishing_aspect: "The topology is flat, so cross-references are validated by FK rather than by nesting: a junction naming one real railroad and one unknown id is refused with 404 ERR_RAILROAD_NOT_FOUND, while the same call with both real ids succeeds and both directions are then readable through GET /car-hire/junctions?road_a_id= and ?road_b_id=."
