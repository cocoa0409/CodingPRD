  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: forecast_lock_supersedes_sibling_drafts
        claim_type: side_effect_execution
        grounds:
          - state_machines.SalesForecast.DRAFT_to_COMMITTEE_LOCKED
        excluded_because:
          difficulty_instance: submit_requires_committee_locked_forecast_of_same_site
          rationale: "F2's supersession by F1's lock is asserted in the named §1.8 instance's setup/asserts."

      - name: loi_negotiation_cycle_happy_path
        claim_type: valid_transition
        grounds:
          - state_machines.LOI
        excluded_because:
          difficulty_instance: loi_counter_resend_cycle
          rationale: "SENT -> COUNTERED -> SENT -> ACCEPTED with round_number and agreed-rent assertions lives in the named §1.8 instance."

      - name: committee_approve_happy_path
        claim_type: valid_transition
        grounds:
          - state_machines.CommitteeReview.OPEN_to_DECIDED
          - state_machines.CommitteeReview.DECIDED_to_RATIFIED
        excluded_because:
          difficulty_instance: ratify_approve_capex_cascade
          rationale: "Full-turnout DECIDED -> RATIFIED APPROVE with site and capex side effects is asserted in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: market_screening_happy_path_scores
        claim_type: correct_result
        grounds:
          - calculations.market_screening_evaluation
        excluded_because:
          difficulty_instance: market_screening_circular_order
          rationale: "raw/tier/target/penetration/final literals are pinned in the named §1.8 instance."

      - name: effective_rent_resend_recompute
        claim_type: correct_result
        grounds:
          - calculations.loi_effective_rent
        excluded_because:
          difficulty_instance: loi_counter_resend_cycle
          rationale: "Effective rent at send (19125555) and after resend (20090000) are asserted there."

      - name: occupancy_band_yellow_override_branch
        claim_type: correct_result
        grounds:
          - calculations.occupancy_cost_ratio
        excluded_because:
          difficulty_instance: occupancy_ratio_tiered_branching
          rationale: "YELLOW band plus ERR_CHAIR_OVERRIDE_REQUIRED and override success are asserted there."

      - name: vote_tally_sixty_percent_reject
        claim_type: correct_result
        grounds:
          - calculations.committee_vote_tally
        excluded_because:
          difficulty_instance: site_rejected_revision_loop
          rationale: "The strict-greater 60% rejection (300 not > 300) is asserted in the named §1.8 instance; the inclusive quorum boundary is asserted in vote_quorum_exactly_met_approves."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: priority_conflicts_covered_by_difficulty
        claim_type: priority_ordering
        grounds:
          - validations
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_submit
          rationale: "Three distinct error-category pairs are dual-failure tested in state_beats_fiscal_on_submit, constraint_beats_temporal_on_loi_create, and temporal_beats_referential_on_lease_create."

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_loi_exclusivity_overlap_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LOI_EXCLUSIVITY_OVERLAP]
        excluded_because:
          difficulty_instance: loi_exclusivity_half_open_adjacency
          rationale: "Overlap rejection (and adjacency acceptance) asserted in the named §1.8 instance."

      - name: error_crew_window_conflict_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CREW_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: crew_window_closed_interval_buffer
          rationale: "Buffer boundary (gap 7 allowed, gap 6 rejected) asserted in the named §1.8 instance."

      - name: error_market_not_qualified_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MARKET_NOT_QUALIFIED]
        excluded_because:
          difficulty_instance: site_screening_requires_market_qualified
          rationale: "Triggered and asserted in the named §1.8 instance."

      - name: error_forecast_not_locked_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FORECAST_NOT_LOCKED]
        excluded_because:
          difficulty_instance: submit_requires_committee_locked_forecast_of_same_site
          rationale: "Triggered and asserted in the named §1.8 instance."

      - name: error_chair_override_required_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHAIR_OVERRIDE_REQUIRED]
        excluded_because:
          difficulty_instance: occupancy_ratio_tiered_branching
          rationale: "First trigger call of the named §1.8 instance asserts ERR_CHAIR_OVERRIDE_REQUIRED."

      - name: error_stale_version_covered_by_corners
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: model_lock_supersession_cascade
          rationale: "The OCC 412 path itself is exercised by corner instances occ_stale_model_lock_rejected and occ_stale_vote_rejected; the named difficulty instance grounds the guarded endpoint's happy path."
