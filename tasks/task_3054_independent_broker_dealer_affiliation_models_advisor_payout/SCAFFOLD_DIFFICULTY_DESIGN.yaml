              as: PlatformAdmin
              captures: { a3_id: $.data.id, a3_v: $.data.version }
            - call: "POST /branch-supervisor-enrollments"
              payload: { branch_code: "SUP-1", advisor_code: "A-1003", effective_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { e3_id: $.data.id }
            - call: "POST /branch-supervisor-enrollments/${e3_id}/state"
              payload: { to_status: "ENROLLED", expected_branch_version: "${b_sup_v}" }
              as: PlatformAdmin
              captures: { b_sup_v2: $.data.version }
            - call: "POST /advisor-links"
              payload: { advisor_code: "A-1003", branch_code: "SUP-1", is_supervisor: true, assignment_type: "PRIMARY" }
              as: AdvisorOps
              as_user_id: "${a3_id}"
              captures: { l3_id: $.data.id, b_sup_v3: $.data.version }
            - call: "POST /payout-loans"
              payload: { advisor_code: "A-1003", principal_cents: 300000, amortization_rate_bps: 2000, forgiveness_milestone_pct: 99 }
              as: PlatformAdmin
              captures: { ln3_id: $.data.id }
            - call: "POST /advisors/${a3_id}/enrollment"
              payload: { expected_advisor_version: "${a3_v}" }
              as: AdvisorOps
              as_user_id: "${a3_id}"
              captures: { a3_v2: $.data.version }
            - call: "POST /advisors/${a3_id}/affiliation"
              payload: { affiliation_model: "IC", expected_advisor_version: "${a3_v2}" }
              as: AdvisorOps
              as_user_id: "${a3_id}"
              captures: { a3_v3: $.data.version }
            - call: "POST /accounts"
              payload: { advisor_code: "A-1003", account_number: "A-2001-EQ", account_type: "BROKERAGE", balance_cents: 20000000, annual_fee_cents: 0, held_away: false }
              as: AdvisorOps
              as_user_id: "${a3_id}"
              captures: { ac3_id: $.data.id }
            - call: "POST /payout-periods"
              payload: { branch_code: "SUP-1", year: 2026, month: 9, period_index: 1 }
              as: BranchManager
              captures: { p3_id: $.data.id, b_sup_v4: $.data.version }
            - call: "POST /advisors/${a3_id}/payout-lines"
              payload: { payout_period_id: "${p3_id}", projected_annual_production_cents: 80000000 }
              as: AdvisorOps
              as_user_id: "${a3_id}"
              captures: { pl3_id: $.data.id }
            - call: "POST /revenue-entries"
              payload: { advisor_code: "A-1003", account_id: "${ac3_id}", product_type: "EQUITY", gross_commission_cents: 700001, production_date: "2026-09-03" }
              as: AdvisorOps
              as_user_id: "${a3_id}"
            - call: "POST /revenue-entries"
              payload: { advisor_code: "A-1003", account_id: "${ac3_id}", product_type: "MUTUAL_FUND", gross_commission_cents: 650001, production_date: "2026-09-08" }
              as: AdvisorOps
              as_user_id: "${a3_id}"
            - call: "POST /revenue-entries"
              payload: { advisor_code: "A-1003", account_id: "${ac3_id}", product_type: "ADVISORY", gross_commission_cents: 450001, production_date: "2026-09-12" }
              as: AdvisorOps
              as_user_id: "${a3_id}"
          trigger:
            - call: "POST /payout-periods/${p3_id}/state"
              payload: { to_state: "CLOSED", expected_branch_version: "${b_sup_v4}" }
              as: BranchManager
              captures: { b_sup_v5: $.data.version }
            - call: "GET /payout-periods/${p3_id}/payout-lines"
              payload: {}
              as: BranchManager
          assert:
            - "the provisional applied rate is 7000 for the EQUITY entry, 6500 for the MUTUAL_FUND entry and 7500 for the ADVISORY entry, all keyed on the projected basis 80000000"
            - "the per-entry amounts are 490001, 422501 and 337501, so after posting release_amount_cents == 1250003"
            - "summing the three raw products (490000.70 + 422500.65 + 337500.75 == 1250002.10) and rounding once would give 1250002, so 1250003 distinguishes the pinned per-entry order"
            - "GET /payout-periods/${p3_id} reports period_payout_cents == 1250003 and period_gross_cents == 1800003"

      - name: net_settlement_waterfall_evaluation_order_and_override_basis
