  - rule_id: cross_entity_state_dependency
    instances:
      - name: credential_activation_gated_by_member_membership_status
        grounds:
          - state_machines.AccessCredential.PENDING_ACTIVATION_to_ACTIVE
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - validations[priority=42]
          - errors[ERR_MEMBER_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Entity pair AccessCredential -> Member: the credential's PENDING_ACTIVATION -> ACTIVE
          transition is legal only while the referenced Member is ACTIVE or PROBATION, so the very
          same request fails while the member is SUSPENDED and succeeds after REINSTATE.
        test_recipe:
          setup:
            - "Ana (m1) is ACTIVE and holds one KEY_APP credential still in PENDING_ACTIVATION"
            - "Ana is then SUSPENDED, which leaves the PENDING_ACTIVATION credential untouched"
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /access-credentials"
              payload: { member_id: "${m1_id}", credential_type: "KEY_APP", expires_at: "2027-06-30T00:00:00Z", expected_member_version: "${m1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "GET /members/${m1_id}"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_v2: $.data.version }
            - call: "POST /members/${m1_id}/membership-events"
              payload: { event_type: "SUSPEND", reason: "Ethics complaint", expected_member_version: "${m1_v2}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /access-credentials/${c1_id}/state"
              payload: { action: "ACTIVATE", expected_credential_version: "${c1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /members/${m1_id}"
              payload: {}
              as: AssociationAdmin
