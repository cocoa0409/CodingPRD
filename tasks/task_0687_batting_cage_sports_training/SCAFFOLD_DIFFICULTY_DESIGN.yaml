# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — task_0687_batting_cage_sports_training
# §1.8 Test Targeting Index — 9 Difficulty Rules × ≥2 instances
# All asserts use literals pre-computed against §1.3 formulas.
# Default logical clock = 2026-04-01T00:00:00Z. Facility default open hours
# [480,1320) = 08:00–22:00 UTC. PEAK [1020,1260) = 17:00–21:00 UTC.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: booking_quote_vs_charge_diverge_on_peak
        grounds:
          - calculations.booking_quote
          - calculations.booking_charge
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - entities.Booking.fields.quoted_cost_cents
          - entities.Booking.fields.final_cost_cents
        distinguishing_aspect: |
          booking_quote (forward_looking) never applies the peak multiplier while
          booking_charge (chronological) does; for an OPEN_SLOT HOURLY booking whose
          start minute-of-day falls in PEAK [1020,1260), final_cost_cents (6000) is
          strictly greater than quoted_cost_cents (4000). This is cost accounting on Booking.
        test_recipe:
          setup:
            - "Facility with default hours, hourly_rate_cents=4000, token_price_cents=500."
            - "Lane CAGE, buffer 0, no rate override."
            - "Member tier NONE, SIGNED waiver, wallet topped up to 100 tokens."
            - "Clock at 2026-04-01T00:00:00Z. Booking start 2026-04-02T17:30:00Z (minute 1050 = PEAK), end 18:30 (60 min)."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F1", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "Pat", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "HOURLY", start_utc: "2026-04-02T17:30:00Z", end_utc: "2026-04-02T18:30:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id, quoted: $.data.quoted_cost_cents }
          trigger:
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { final: $.data.final_cost_cents }
          assert:
            - "Booking.${bk_id}.quoted_cost_cents == 4000"
            - "Booking.${bk_id}.final_cost_cents == 6000"
            - "Booking.${bk_id}.final_cost_cents > Booking.${bk_id}.quoted_cost_cents"

      - name: machine_wear_status_threshold_distinct_from_cost
        grounds:
          - calculations.machine_status
          - state_machines.PitchingMachine.OPERATIONAL_to_DEGRADED
          - entities.PitchingMachine.fields.pitch_count
          - entities.PitchingMachine.fields.status
        distinguishing_aspect: |
          machine_status is a wear/risk threshold on PitchingMachine.pitch_count (a different
          entity domain than Booking cost): after exactly 5 COMPLETED sessions pitch_count==5000
          and status flips OPERATIONAL->DEGRADED, independent of any monetary calculation.
        test_recipe:
          setup:
            - "Facility default; lane with installed WHEEL machine (pitch_count starts 0)."
            - "Member tier NONE, SIGNED waiver, wallet 200 tokens."
            - "Five sequential 10-min OPEN_SLOT bookings on the lane using the machine, each fully run REQUESTED->CONFIRMED->CHECKED_IN->COMPLETED, non-overlapping back-to-back from 09:00."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F2", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id }
            - call: "POST /v1/machines"
              payload: { lane_id: "${lane_id}", model: "WHEEL", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mach_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "Sam", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 200 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", machine_id: "${mach_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-01T09:00:00Z", end_utc: "2026-04-01T09:10:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { b1: $.data.id }
            - call: "GET /v1/lanes/${lane_id}"
              payload: {}
              as: FacilityManager
              captures: { lv1: $.data.version }
            - call: "POST /v1/bookings/${b1}/confirm"
              payload: { expected_lane_version: "${lv1}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/bookings/${b1}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/bookings/${b1}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", machine_id: "${mach_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-01T09:10:00Z", end_utc: "2026-04-01T09:20:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { b2: $.data.id }
            - call: "GET /v1/lanes/${lane_id}"
              payload: {}
              as: FacilityManager
              captures: { lv2: $.data.version }
            - call: "POST /v1/bookings/${b2}/confirm"
              payload: { expected_lane_version: "${lv2}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/bookings/${b2}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/bookings/${b2}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", machine_id: "${mach_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-01T09:20:00Z", end_utc: "2026-04-01T09:30:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { b3: $.data.id }
            - call: "GET /v1/lanes/${lane_id}"
              payload: {}
              as: FacilityManager
              captures: { lv3: $.data.version }
            - call: "POST /v1/bookings/${b3}/confirm"
              payload: { expected_lane_version: "${lv3}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/bookings/${b3}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/bookings/${b3}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", machine_id: "${mach_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-01T09:30:00Z", end_utc: "2026-04-01T09:40:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { b4: $.data.id }
            - call: "GET /v1/lanes/${lane_id}"
              payload: {}
              as: FacilityManager
              captures: { lv4: $.data.version }
            - call: "POST /v1/bookings/${b4}/confirm"
              payload: { expected_lane_version: "${lv4}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/bookings/${b4}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/bookings/${b4}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", machine_id: "${mach_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-01T09:40:00Z", end_utc: "2026-04-01T09:50:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { b5: $.data.id }
            - call: "GET /v1/lanes/${lane_id}"
              payload: {}
              as: FacilityManager
              captures: { lv5: $.data.version }
            - call: "POST /v1/bookings/${b5}/confirm"
              payload: { expected_lane_version: "${lv5}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/bookings/${b5}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /v1/bookings/${b5}/complete"
              payload: {}
              as: FrontDesk
              captures: { last: $.data.id }
          assert:
            - "PitchingMachine.${mach_id}.pitch_count == 5000"
            - "PitchingMachine.${mach_id}.status == DEGRADED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: charge_three_input_nonlinear_lesson_gold_arm_peak
        grounds:
          - calculations.booking_charge
          - entities.Booking.fields.final_cost_cents
          - state_machines.Booking.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          MODE (a): final_cost_cents combines >=3 interacting inputs with non-linear
          interaction — peak multiplier (conditional branch on start minute), tiered
          TIER_DISCOUNT_PCT selection (GOLD=0.25), and per-model machine surcharge
          (ARM=1200). For a 90-min peak LESSON (lane 4000/hr, coach 6000/hr, ARM, GOLD)
          final_cost_cents == 14400.
        test_recipe:
          setup:
            - "Facility default, hourly_rate_cents=4000."
            - "Lane CAGE buffer 0, WHEEL? no — ARM machine installed."
            - "Instructor active, rate_cents_per_hour=6000."
            - "Member tier GOLD, SIGNED waiver, wallet 100 tokens."
            - "90-min LESSON at 2026-04-02T17:30:00Z (PEAK)."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F3", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/machines"
              payload: { lane_id: "${lane_id}", model: "ARM", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mach_id: $.data.id }
            - call: "POST /v1/instructors"
              payload: { full_name: "Coach Lee", rate_cents_per_hour: 6000, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { inst_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "Gus", tier: "GOLD", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", instructor_id: "${inst_id}", machine_id: "${mach_id}", kind: "LESSON", pay_mode: "TOKEN", start_utc: "2026-04-02T17:30:00Z", end_utc: "2026-04-02T19:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { final: $.data.final_cost_cents, tok: $.data.token_cost }
          assert:
            - "Booking.${bk_id}.final_cost_cents == 14400"
            - "Booking.${bk_id}.token_cost == 29"

      - name: charge_rounding_order_per_component_then_sum
        grounds:
          - calculations.booking_charge
          - calculations.booking_quote
          - entities.Lane.fields.hourly_rate_cents
          - entities.Booking.fields.final_cost_cents
        distinguishing_aspect: |
          MODE (b): nested rounding order is pinned to round-per-component-then-sum.
          For an off-peak 10-min LESSON with lane override 2000/hr and coach 2000/hr,
          tier NONE: lane_part=round(333.33)=333, coach_part=round(333.33)=333, sum=666.
          The wrong sum-then-round order yields 667. final_cost_cents == 666.
        test_recipe:
          setup:
            - "Facility default."
            - "Lane CAGE buffer 0 with hourly_rate_cents override 2000."
            - "Instructor rate_cents_per_hour=2000 active."
            - "Member tier NONE, SIGNED waiver, wallet 50 tokens."
            - "10-min LESSON off-peak at 2026-04-02T09:00:00Z (minute 540)."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F4", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, hourly_rate_cents: 2000, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/instructors"
              payload: { full_name: "Coach Ada", rate_cents_per_hour: 2000, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { inst_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "Nia", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 50 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", instructor_id: "${inst_id}", kind: "LESSON", pay_mode: "TOKEN", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T09:10:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { final: $.data.final_cost_cents, tok: $.data.token_cost }
          assert:
            - "Booking.${bk_id}.final_cost_cents == 666"
            - "Booking.${bk_id}.token_cost == 2"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_branch_requested_forks_confirm_vs_reject
        grounds:
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - state_machines.Booking.REQUESTED_to_REJECTED
          - entities.Booking.fields.status
        distinguishing_aspect: |
          Booking is branching: from REQUESTED the machine forks to CONFIRMED (charges +
          occupies lane) or REJECTED (no charge), with divergent side-effect sets. A
          rejected booking leaves member.token_balance unchanged while a confirmed one debits it.
        test_recipe:
          setup:
            - "Facility default; lane; member tier NONE waiver SIGNED wallet 100 tokens."
            - "Two independent REQUESTED OPEN_SLOT TOKEN bookings on non-overlapping intervals."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F5", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "Rex", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_confirm: $.data.id }
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-02T11:00:00Z", end_utc: "2026-04-02T12:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_reject: $.data.id }
            - call: "POST /v1/bookings/${bk_confirm}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /v1/bookings/${bk_reject}/reject"
              payload: {}
              as: FacilityManager
          assert:
            - "Booking.${bk_confirm}.status == CONFIRMED"
            - "Booking.${bk_reject}.status == REJECTED"
            - "Member.${mem_id}.token_balance == 92"

      - name: program_cyclic_full_to_open_on_withdraw
        grounds:
          - state_machines.Program.OPEN_to_FULL
          - state_machines.Program.FULL_to_OPEN
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.Program.fields.status
        distinguishing_aspect: |
          Program cycles OPEN->FULL->OPEN (a different entity than Booking): a single-seat
          program goes FULL on its only enrollment, then returns to OPEN when that
          enrollment is withdrawn. The cyclic back-edge distinguishes this from a linear pipeline.
        test_recipe:
          setup:
            - "Facility default; lane; program LEAGUE capacity 1 price 5000 on a session interval."
            - "One member enrolled, making the program FULL."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F6", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Lane A", kind: "LANE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "Lee", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { lane_id: "${lane_id}", kind: "LEAGUE", capacity: 1, price_cents: 5000, session_start_utc: "2026-04-10T18:00:00Z", session_end_utc: "2026-04-10T20:00:00Z", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { prog_id: $.data.id, prog_ver: $.data.version }
            - call: "POST /v1/programs/${prog_id}/enrollments"
              payload: { member_id: "${mem_id}", expected_program_version: "${prog_ver}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /v1/enrollments/${enr_id}/withdraw"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Program.${prog_id}.status == OPEN"
            - "Program.${prog_id}.enrolled_count == 0"
            - "Enrollment.${enr_id}.status == WITHDRAWN"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: critical_maintenance_cascades_lane_facility_and_booking
        grounds:
          - state_machines.Lane.AVAILABLE_to_CLOSED
          - state_machines.Facility.OPEN_to_RESTRICTED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.facility_posture
          - calculations.refund_policy
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger (open CRITICAL maintenance): the window
          opening sets Lane.maint_status=CLOSED; THAT lane closure causes
          facility.open_incident_count to rise and Facility.posture to recompute to
          RESTRICTED; and the lane closure ITSELF cancels the overlapping CONFIRMED
          booking which in turn refunds the payer's tokens. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Facility default; one lane; member tier NONE waiver SIGNED wallet 100 tokens."
            - "One CONFIRMED OPEN_SLOT TOKEN booking on the lane 2026-04-05T18:00–19:00 (peak), token_cost debited."
            - "Clock at 2026-04-05T12:00:00Z (>2h before start, so full refund on cancel)."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F7", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "Mia", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-05T18:00:00Z", end_utc: "2026-04-05T19:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T12:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "POST /v1/maintenance"
              payload: { lane_id: "${lane_id}", start_utc: "2026-04-05T17:00:00Z", end_utc: "2026-04-05T20:00:00Z", severity: "CRITICAL", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { win_id: $.data.id }
          assert:
            - "Lane.${lane_id}.maint_status == CLOSED"
            - "Facility.${fac_id}.posture == RESTRICTED"
            - "Booking.${bk_id}.status == CANCELLED"
            - "Member.${mem_id}.token_balance == 100"

      - name: program_withdraw_cascades_count_status_and_wallet
        grounds:
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - state_machines.Program.FULL_to_OPEN
          - calculations.program_enrollment_ledger
          - entities.Member.fields.token_balance
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (withdraw enrollment): withdrawing the
          enrollment decrements program.enrolled_count; THAT decrement drives Program.status
          FULL->OPEN; and the withdrawal also credits the member wallet with the token
          refund of the charged price. Origin transition differs from the maintenance cascade.
        test_recipe:
          setup:
            - "Facility default token_price_cents=500; lane; program CLINIC capacity 1 price 5000."
            - "Member enrolled -> program FULL, member.token_balance starts at 0."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F8", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Lane A", kind: "LANE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "Ola", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { lane_id: "${lane_id}", kind: "CLINIC", capacity: 1, price_cents: 5000, session_start_utc: "2026-04-12T18:00:00Z", session_end_utc: "2026-04-12T19:00:00Z", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { prog_id: $.data.id, prog_ver: $.data.version }
            - call: "POST /v1/programs/${prog_id}/enrollments"
              payload: { member_id: "${mem_id}", expected_program_version: "${prog_ver}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /v1/enrollments/${enr_id}/withdraw"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Program.${prog_id}.enrolled_count == 0"
            - "Program.${prog_id}.status == OPEN"
            - "Member.${mem_id}.token_balance == 10"

