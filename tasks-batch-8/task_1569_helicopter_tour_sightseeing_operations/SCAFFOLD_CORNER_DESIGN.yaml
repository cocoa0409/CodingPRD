      - name: rotation_seq_ordered_by_departure
        claim_type: correct_result
        grounds:
          - calculations.rotation_sequence
          - entities.Flight.fields.rotation_seq
        distinguishing_aspect: |
          rotation_seq is chronological, not creation-order: creating the 16:00
          flight first and the 08:00 flight last still numbers the day's three
          rotations 1 (08:00), 2 (09:00), 3 (16:00) per scheduled_departure_utc.
        test_recipe:
          setup: ["Base; route R1 SHORT 25 min (turn 15); aircraft A1; pilot P; three flights created out of order: 16:00 first, then 08:00, then 09:00"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
