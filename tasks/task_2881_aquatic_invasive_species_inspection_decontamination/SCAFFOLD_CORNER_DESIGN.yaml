            - "data.decon_mandatory == true on the trigger record, because a MODERATE band with residual_water_present true is mandatory decon"
            - "data.dry_credit_points == 5 == floor(24 / 24) * DRY_CREDIT_POINTS_PER_DAY, well under the cap of 25"
            - "data.quarantine_warranted == false on both records"
