# =============================================================================
# Scaffold: Merchant Chargeback Representment (acquirer side)
# =============================================================================

scenario: |
  Merchant Chargeback Representment (acquirer side): chargeback receipt & merchant notification window, compelling-evidence assembly by reason code, representment submission deadline & network rules, chargeback ratio monitoring & excessive-program enrollment, fine/fee pass-through to merchant, reserve/holdback for high-risk merchant, win-rate analytics by reason & merchant, merchant education & prevention tooling

domain_name: merchant-chargeback-representment
api_prefix: /acquirer

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Merchant legal name" }
      - { name: merchant_category_code, type: string, source: input, description: "ISO 18245 MCC, 4 digits" }
      - { name: risk_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | HIGH_RISK — HIGH_RISK triggers per-chargeback reserve holdback", constraints: "one of STANDARD, HIGH_RISK" }
      - { name: reserve_mode, type: enum, source: input, default: FIXED_TIER, description: "Reserve target algorithm selector: FIXED_TIER | EXPOSURE_BASED", constraints: "one of FIXED_TIER, EXPOSURE_BASED" }
      - { name: reserve_rate_bps, type: integer, source: input, default: 500, description: "Basis points of each settled transaction held into the rolling reserve (500 = 5.00%)", constraints: "0 <= reserve_rate_bps <= 10000" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED blocks merchant-side actions and new transaction ingest", constraints: "initial ACTIVE" }
      - { name: clearing_balance_cents, type: integer, source: computed, default: 0, description: "Net clearing position with the acquirer: + transaction settlement (net of reserve hold), - chargeback debit at receipt, + recredit on representment win, - re-debit on pre-arbitration, + compensating credit on network reversal, - refund on alert action, - fee on settlement" }
      - { name: current_count_ratio_bps, type: integer, source: computed, description: "count_ratio_bps of the most recent POSTED RatioSnapshot (by period_month, tie-break: latest computed_at); null when no snapshot exists", constraints: "nullable" }

  - name: ReasonCodeRule
    parent: null
    common_fields: false
    fields:
      - { name: network, type: enum, source: input, description: "VISA | MASTERCARD", constraints: "one of VISA, MASTERCARD" }
      - { name: reason_code, type: string, source: input, description: "Network reason code, e.g. '10.4' (VISA fraud) or '4853' (MC cardholder dispute)" }
      - { name: category, type: enum, source: input, description: "FRAUD | AUTHORIZATION | PROCESSING_ERROR | CONSUMER_DISPUTE", constraints: "one of FRAUD, AUTHORIZATION, PROCESSING_ERROR, CONSUMER_DISPUTE" }
      - { name: required_evidence_types, type: array, source: input, description: "Compelling-evidence checklist: every listed EvidenceItem.evidence_type must be covered by >= 1 ATTACHED item at representment submit" }
      - { name: merchant_response_days, type: integer, source: input, description: "Calendar days from merchant_notified_at within which the merchant may accept liability", constraints: ">= 1" }
      - { name: representment_days, type: integer, source: input, description: "Calendar days from received_at of the network hard representment deadline", constraints: ">= 1" }
      - { name: chargeback_fee_cents, type: integer, source: input, description: "Per-case fee auto-assessed to the merchant at chargeback receipt", constraints: ">= 0" }
      - { name: effective_from, type: datetime, source: input, description: "Start of the rule's effective window (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "End of the rule's effective window (exclusive); null = open-ended", constraints: "nullable; windows are half-open [effective_from, effective_to)" }
    # Immutable configuration: no update/delete endpoints. Versioning is expressed
    # by creating a new rule with an adjacent non-overlapping effective window.

  - name: Transaction
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; selling merchant" }
      - { name: external_ref, type: string, source: input, description: "Merchant-scoped external reference (ARN-style); unique per merchant", constraints: "unique within (merchant_id)" }
      - { name: network, type: enum, source: input, description: "VISA | MASTERCARD", constraints: "one of VISA, MASTERCARD" }
      - { name: amount_cents, type: integer, source: input, description: "Sale amount", constraints: "> 0" }
      - { name: occurred_at, type: datetime, source: input, description: "Sale timestamp (drives ratio denominator month and reserve hold maturity)" }
      - { name: status, type: enum, source: system, description: "SETTLED | REFUNDED | CHARGED_BACK — initial SETTLED; REFUNDED via prevention-alert refund action; CHARGED_BACK on first chargeback receipt", constraints: "initial SETTLED" }

  - name: Chargeback
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; merchant the network case is filed against" }
      - { name: transaction_external_ref, type: string, source: input, description: "External reference of the disputed sale; resolved to Transaction within merchant_id scope at ingest" }
      - { name: transaction_id, type: string, source: system, description: "FK -> Transaction.id; resolved from (merchant_id, transaction_external_ref) at ingest" }
      - { name: network_case_id, type: string, source: input, description: "Network-assigned case identifier", constraints: "globally unique" }
      - { name: reason_code, type: string, source: input, description: "Network reason code; must be covered by a ReasonCodeRule effective at received_at" }
      - { name: network, type: enum, source: system, description: "VISA | MASTERCARD — copied from the disputed Transaction" }
      - { name: amount_cents, type: integer, source: input, description: "Disputed amount; partial chargebacks allowed", constraints: "0 < amount_cents <= Transaction.amount_cents" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at ingest" }
      - { name: merchant_notified_at, type: datetime, source: system, description: "Set by the notify transition; null before", constraints: "nullable" }
      - { name: merchant_response_due_at, type: datetime, source: computed, description: "= merchant_notified_at + ReasonCodeRule.merchant_response_days calendar days; null until notified", constraints: "nullable" }
      - { name: representment_due_at, type: datetime, source: computed, description: "= received_at + ReasonCodeRule.representment_days calendar days (network hard deadline, inclusive)" }
      - { name: case_status, type: enum, source: system, description: "RECEIVED | MERCHANT_NOTIFIED | REPRESENTED | DECIDED_WON | DECIDED_LOST | MERCHANT_ACCEPTED | PRE_ARBITRATION | EXPIRED | REVERSED — lifecycle axis", constraints: "initial RECEIVED" }
      - { name: funds_status, type: enum, source: system, description: "MERCHANT_DEBITED | FUNDS_RETURNED | DEBIT_FINAL | NOT_DEBITED — parallel money axis, evolves independently of case_status", constraints: "initial MERCHANT_DEBITED" }
      - { name: recredited_cents, type: integer, source: system, default: 0, description: "Amount returned to the merchant on the most recent win (full or partial)" }
      - { name: is_ratio_counted, type: boolean, source: computed, description: "false once case_status == REVERSED; true otherwise (POSTED ratio basis excludes REVERSED)" }

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - { name: chargeback_id, type: string, source: input, description: "FK -> Chargeback.id; case this document supports" }
      - { name: evidence_type, type: enum, source: input, description: "RECEIPT | AVS_MATCH | CVV_MATCH | DELIVERY_PROOF | SIGNED_AGREEMENT | REFUND_PROOF | PRIOR_TXN_HISTORY | IP_DEVICE_LOG | CARDHOLDER_COMMUNICATION", constraints: "one of the listed values" }
      - { name: document_uri, type: string, source: input, description: "Opaque storage URI of the uploaded document" }
      - { name: status, type: enum, source: system, description: "DRAFT | ATTACHED | WITHDRAWN — ATTACHED while referenced by a non-SUPERSEDED representment; returns to DRAFT when that representment is superseded", constraints: "initial DRAFT" }

  - name: Representment
    parent: null
    common_fields: true
    fields:
      - { name: chargeback_id, type: string, source: input, description: "FK -> Chargeback.id; case being re-presented" }
      - { name: evidence_item_ids, type: array, source: input, description: "Ordered EvidenceItem ids forming the packet; must be non-empty and all DRAFT items of this chargeback", constraints: "min length 1" }
      - { name: status, type: enum, source: system, description: "ASSEMBLED | SUBMITTED | WON | PARTIAL_WON | LOST | RETURNED_FOR_CURE | SUPERSEDED", constraints: "initial ASSEMBLED" }
      - { name: cure_count, type: integer, source: system, default: 0, description: "Number of RETURNED_FOR_CURE cycles consumed by this packet lineage; network allows at most 1 cure (MAX_CURES = 1)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submit; null until submitted", constraints: "nullable" }
      - { name: won_amount_cents, type: integer, source: system, description: "Set on PARTIAL_WON outcome: 0 < won_amount_cents < Chargeback.amount_cents; equals amount_cents on WON; null otherwise", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at network outcome; null until decided", constraints: "nullable" }

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; merchant the fee is passed through to (system-derived for auto-assessed fees)" }
      - { name: chargeback_id, type: string, source: system, description: "FK -> Chargeback.id; originating case for CHARGEBACK_FEE; null otherwise", constraints: "nullable" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> ProgramEnrollment.id; originating enrollment for PROGRAM_FINE; null otherwise", constraints: "nullable" }
      - { name: kind, type: enum, source: input, description: "CHARGEBACK_FEE | PROGRAM_FINE | ARBITRATION_FEE — only ARBITRATION_FEE may be created via the manual endpoint; other kinds are system-assessed", constraints: "manual creation restricted to ARBITRATION_FEE" }
      - { name: amount_cents, type: integer, source: input, description: "Fee amount; computed by fee schedule for system-assessed kinds, client-provided for manual ARBITRATION_FEE", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ASSESSED | SETTLED | WAIVED", constraints: "initial ASSESSED" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of the assessing FinanceOps user; literal 'system' for auto-assessed fees" }
      - { name: waived_by_user_id, type: string, source: system, description: "X-User-ID of the waiving FinanceOps user; null until waived", constraints: "nullable" }
      - { name: settled_at, type: datetime, source: system, description: "Logical clock at settlement; null until settled", constraints: "nullable" }
      - { name: waived_at, type: datetime, source: system, description: "Logical clock at waiver; null until waived", constraints: "nullable" }

  - name: ReserveAccount
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; owning merchant (1:1, created with the merchant)", constraints: "unique" }
      - { name: held_cents, type: integer, source: computed, default: 0, description: "= sum(HOLD amounts) - sum(RELEASE amounts) - sum(FORFEIT amounts) over all ReserveLedgerEntry rows of this account; never negative by construction" }
      - { name: target_cents, type: integer, source: computed, default: 0, description: "Reserve target per reserve_target calculation (variant selected by Merchant.reserve_mode); recomputed on transaction ingest, chargeback funds transitions, reserve-policy patch, and month sweep; recomputation never itself creates ledger entries" }
      - { name: last_recomputed_at, type: datetime, source: system, description: "Logical clock of last target recompute; null before first", constraints: "nullable" }

  - name: ReserveLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: reserve_account_id, type: string, source: system, description: "FK -> ReserveAccount.id; account this entry posts to" }
      - { name: entry_type, type: enum, source: system, description: "HOLD | RELEASE | FORFEIT", constraints: "one of HOLD, RELEASE, FORFEIT" }
      - { name: amount_cents, type: integer, source: system, description: "Entry amount", constraints: "> 0" }
      - { name: source_kind, type: enum, source: system, description: "TRANSACTION_SETTLEMENT | CHARGEBACK_RECEIPT | CHARGEBACK_WON | CHARGEBACK_LOST | SCHEDULED_RELEASE", constraints: "one of the listed values" }
      - { name: source_id, type: string, source: system, description: "Originating Transaction.id or Chargeback.id; null for SCHEDULED_RELEASE", constraints: "nullable" }
      - { name: release_eligible_at, type: datetime, source: system, description: "Maturity instant for voluntary release; = Transaction.occurred_at + 90 days for TRANSACTION_SETTLEMENT holds; null for case-bound entries (CHARGEBACK_RECEIPT holds never mature)", constraints: "nullable" }
    # Append-only event log: no update or delete; ReserveAccount.held_cents is its fold.

  - name: RatioSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; snapshot subject" }
      - { name: network, type: enum, source: system, description: "VISA | MASTERCARD — ratios are computed per merchant per network", constraints: "one of VISA, MASTERCARD" }
      - { name: period_month, type: string, source: system, description: "Calendar month swept, format YYYY-MM" }
      - { name: sales_count, type: integer, source: system, description: "Denominator: count of the merchant's Transactions on this network with occurred_at inside period_month (any status)" }
      - { name: sales_amount_cents, type: integer, source: system, description: "Sum of amount_cents over the denominator set" }
      - { name: chargeback_count, type: integer, source: system, description: "POSTED basis numerator: chargebacks with received_at inside period_month whose case_status != REVERSED at sweep time" }
      - { name: gross_chargeback_count, type: integer, source: system, description: "GROSS basis numerator: all chargebacks with received_at inside period_month including REVERSED" }
      - { name: count_ratio_bps, type: integer, source: computed, description: "POSTED basis: round_half_up(10000 * chargeback_count / sales_count); sentinel 100000 when sales_count == 0 and chargeback_count > 0; 0 when both 0" }
      - { name: gross_count_ratio_bps, type: integer, source: computed, description: "GROSS basis: same formula over gross_chargeback_count" }
      - { name: computed_at, type: datetime, source: system, description: "Logical clock at sweep" }
    # Immutable once posted: a repeat sweep of the same (merchant, network, period_month) skips it.

  - name: ProgramEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; enrolled merchant" }
      - { name: network, type: enum, source: input, description: "VISA | MASTERCARD", constraints: "one of VISA, MASTERCARD" }
      - { name: program_code, type: enum, source: input, description: "VDMP_STANDARD | VDMP_EXCESSIVE | ECM | HECM", constraints: "family convention only (VDMP_* for VISA-originated programs, ECM/HECM for MASTERCARD-originated); not a cross-field validation" }
      - { name: enrolled_month, type: string, source: input, description: "First month over threshold, format YYYY-MM" }
      - { name: exited_month, type: string, source: system, description: "Month the enrollment exited, format YYYY-MM; null while ACTIVE/REMEDIATION", constraints: "nullable" }
      - { name: months_over_count, type: integer, source: computed, default: 1, description: "Count of POSTED snapshots at or above the program threshold since enrolled_month (inclusive); incremented by each over-threshold sweep" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMEDIATION | EXITED — REMEDIATION once a plan is APPROVED; EXITED via exit-review", constraints: "initial ACTIVE" }

  - name: RemediationPlan
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> ProgramEnrollment.id; enrollment this plan remediates" }
      - { name: root_cause_codes, type: array, source: input, description: "Non-empty list of FRAUD_GAP | FULFILLMENT_GAP | CUSTOMER_SERVICE_GAP | POLICY_GAP", constraints: "min length 1" }
      - { name: corrective_actions, type: array, source: input, description: "Non-empty list of free-text corrective action descriptions", constraints: "min length 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | RETURNED — RETURNED plans may be resubmitted (cycle)", constraints: "initial DRAFT" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewing RiskOfficer; null until reviewed", constraints: "nullable" }
      - { name: decision_note, type: string, source: system, description: "Reviewer note captured at review; null until reviewed", constraints: "nullable" }

  - name: PreventionAlert
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: input, description: "FK -> Transaction.id; sale the network alert references" }
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; derived from the transaction" }
      - { name: alert_type, type: enum, source: input, description: "FRAUD_ALERT | DISPUTE_ALERT | REFUND_OPPORTUNITY", constraints: "one of the listed values" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at alert ingest" }
      - { name: response_due_at, type: datetime, source: computed, description: "= received_at + 72 hours (ALERT_RESPONSE_HOURS); actions allowed while now <= response_due_at" }
      - { name: status, type: enum, source: system, description: "OPEN | ACTIONED_REFUND | DISMISSED | EXPIRED", constraints: "initial OPEN" }

  - name: EducationAssignment
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; merchant being educated" }
      - { name: enrollment_ref, type: string, source: system, description: "id of the triggering ProgramEnrollment (informational reference, not a navigable FK)", constraints: "nullable" }
      - { name: module_code, type: enum, source: system, description: "CHARGEBACK_BASICS | EVIDENCE_BEST_PRACTICE | FRAUD_PREVENTION", constraints: "one of the listed values" }
      - { name: assigned_reason, type: enum, source: system, description: "PROGRAM_ENROLLMENT — assignments are auto-created when a ProgramEnrollment is created (VDMP_* programs: CHARGEBACK_BASICS + EVIDENCE_BEST_PRACTICE; ECM/HECM programs: CHARGEBACK_BASICS + FRAUD_PREVENTION)", constraints: "one of PROGRAM_ENROLLMENT" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED", constraints: "initial ASSIGNED" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at completion; null until completed", constraints: "nullable" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Merchant
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /acquirer/merchants/{id}/suspend"
        actor: RiskOfficer
        preconditions: []
        side_effects:
          - "Merchant.status := SUSPENDED; Merchant.version += 1"
          - "Merchant-side actions (evidence upload, representment create/submit, chargeback accept, alert action, plan create/submit, education complete) become rejected with ERR_MERCHANT_SUSPENDED while SUSPENDED"
          - "New Transaction ingest for this merchant becomes rejected with ERR_MERCHANT_NOT_ACTIVE while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /acquirer/merchants/{id}/reinstate"
        actor: RiskOfficer
        preconditions: []
        side_effects:
          - "Merchant.status := ACTIVE; Merchant.version += 1"

  - entity: Chargeback
    initial_state: RECEIVED
    terminal_states: [DECIDED_LOST, MERCHANT_ACCEPTED, EXPIRED, REVERSED]
    # Two parallel state axes on one row: case_status (lifecycle) x funds_status (money).
    # case_status carries a cycle: DECIDED_WON -> PRE_ARBITRATION -> DECIDED_WON | DECIDED_LOST.
    transitions:
      - from: RECEIVED
        to: MERCHANT_NOTIFIED
        trigger: "POST /acquirer/chargebacks/{id}/notify"
        actor: AcquirerOps
        preconditions: []
        side_effects:
          - "merchant_notified_at := now; merchant_response_due_at := now + rule.merchant_response_days days"
          - "Chargeback.version += 1"

      - from: MERCHANT_NOTIFIED
        to: MERCHANT_ACCEPTED
        trigger: "POST /acquirer/chargebacks/{id}/accept"
        actor: MerchantUser
        preconditions:
          - "acting MerchantUser owns the chargeback (X-User-ID == merchant_id) else ERR_NOT_FOUND"
          - "now <= merchant_response_due_at else ERR_ACCEPT_WINDOW_PASSED"
          - "no Representment of this chargeback in ASSEMBLED or SUBMITTED else ERR_REPRESENTMENT_ALREADY_OPEN"
          - "Merchant.status == ACTIVE else ERR_MERCHANT_SUSPENDED"
        side_effects:
          - "funds_status := DEBIT_FINAL (the receipt debit stands)"
          - "is_ratio_counted stays true; Chargeback.version += 1"

      - from: MERCHANT_NOTIFIED
        to: REPRESENTED
        trigger: "POST /acquirer/representments/{id}/submit (first submission for the case)"
        actor: MerchantUser | AcquirerOps
        preconditions:
          - "see Representment ASSEMBLED -> SUBMITTED preconditions"
        side_effects:
          - "case_status := REPRESENTED; Chargeback.version += 1"

      - from: REPRESENTED
        to: DECIDED_WON
        trigger: "POST /acquirer/representments/{id}/network-outcome with outcome WON or PARTIAL_WON"
        actor: AcquirerOps
        preconditions:
          - "active Representment of this chargeback is SUBMITTED"
        side_effects:
          - "case_status := DECIDED_WON; funds_status := FUNDS_RETURNED"
          - "recredited_cents := amount_cents (WON) or won_amount_cents (PARTIAL_WON)"
          - "Merchant.clearing_balance_cents += recredited_cents (re-credit)"
          - "HIGH_RISK cascade: create ReserveLedgerEntry(RELEASE, amount_cents, source_kind=CHARGEBACK_WON, source_id=chargeback.id) offsetting the receipt holdback; then recompute ReserveAccount.held_cents"
          - "recompute ReserveAccount.target_cents (this case leaves the open-exposure set); Chargeback.version += 1"

      - from: REPRESENTED
        to: DECIDED_LOST
        trigger: "POST /acquirer/representments/{id}/network-outcome with outcome LOST"
        actor: AcquirerOps
        preconditions:
          - "active Representment of this chargeback is SUBMITTED"
        side_effects:
          - "case_status := DECIDED_LOST; funds_status := DEBIT_FINAL (no money movement; the receipt debit stands)"
          - "HIGH_RISK cascade: create ReserveLedgerEntry(FORFEIT, amount_cents, source_kind=CHARGEBACK_LOST, source_id=chargeback.id) forfeiting the receipt holdback; then recompute ReserveAccount.held_cents"
          - "recompute ReserveAccount.target_cents; Chargeback.version += 1"

      - from: DECIDED_WON
        to: PRE_ARBITRATION
        trigger: "POST /acquirer/chargebacks/{id}/pre-arbitration"
        actor: AcquirerOps
        preconditions: []
        side_effects:
          - "case_status := PRE_ARBITRATION; funds_status := MERCHANT_DEBITED (issuer re-debits)"
          - "Merchant.clearing_balance_cents -= recredited_cents (reversal of the win re-credit)"
          - "HIGH_RISK cascade: create ReserveLedgerEntry(HOLD, amount_cents, source_kind=CHARGEBACK_RECEIPT, source_id=chargeback.id, release_eligible_at=null) restoring the holdback; then recompute ReserveAccount.held_cents"
          - "recompute ReserveAccount.target_cents; Chargeback.version += 1"

      - from: PRE_ARBITRATION
        to: DECIDED_WON
        trigger: "POST /acquirer/chargebacks/{id}/pre-arbitration/outcome with decision WON"
        actor: AcquirerOps
        preconditions: []
        side_effects:
          - "case_status := DECIDED_WON; funds_status := FUNDS_RETURNED"
          - "Merchant.clearing_balance_cents += recredited_cents"
          - "HIGH_RISK cascade: create ReserveLedgerEntry(RELEASE, amount_cents, source_kind=CHARGEBACK_WON, source_id=chargeback.id); recompute ReserveAccount.held_cents"
          - "recompute ReserveAccount.target_cents; Chargeback.version += 1"

      - from: PRE_ARBITRATION
        to: DECIDED_LOST
        trigger: "POST /acquirer/chargebacks/{id}/pre-arbitration/outcome with decision LOST"
        actor: AcquirerOps
        preconditions: []
        side_effects:
          - "case_status := DECIDED_LOST; funds_status := DEBIT_FINAL"
          - "recredited_cents stays as recorded (no further money movement; the pre-arb re-debit stands)"
          - "HIGH_RISK cascade: create ReserveLedgerEntry(FORFEIT, amount_cents, source_kind=CHARGEBACK_LOST, source_id=chargeback.id); recompute ReserveAccount.held_cents"
          - "recompute ReserveAccount.target_cents; Chargeback.version += 1"

      - from: RECEIVED
        to: EXPIRED
        trigger: "system (on POST /acquirer/_clock/set_current_utc when now > representment_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "case_status := EXPIRED; funds_status := DEBIT_FINAL"
          - "any ASSEMBLED Representment of this chargeback -> SUPERSEDED (its ATTACHED evidence returns to DRAFT)"
          - "recompute ReserveAccount.target_cents; Chargeback.version += 1"

      - from: MERCHANT_NOTIFIED
        to: EXPIRED
        trigger: "system (on POST /acquirer/_clock/set_current_utc when now > representment_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "case_status := EXPIRED; funds_status := DEBIT_FINAL"
          - "any ASSEMBLED Representment of this chargeback -> SUPERSEDED (its ATTACHED evidence returns to DRAFT)"
          - "recompute ReserveAccount.target_cents; Chargeback.version += 1"

      - from: RECEIVED
        to: REVERSED
        trigger: "POST /acquirer/chargebacks/{id}/reverse"
        actor: AcquirerOps
        preconditions: []
        side_effects:
          - "case_status := REVERSED; funds_status := NOT_DEBITED"
          - "Merchant.clearing_balance_cents += amount_cents (compensating credit of the receipt debit)"
          - "any ASSEMBLED/SUBMITTED/RETURNED_FOR_CURE Representment -> SUPERSEDED (RETURNED/ASSEMBLED evidence -> DRAFT)"
          - "is_ratio_counted := false; the CHARGEBACK_FEE FeeAssessment is NOT auto-waived (network fees survive reversal)"
          - "HIGH_RISK cascade: create ReserveLedgerEntry(RELEASE, amount_cents, source_kind=CHARGEBACK_WON, source_id=chargeback.id) unwinding the receipt holdback; recompute ReserveAccount.held_cents"
          - "recompute ReserveAccount.target_cents; Chargeback.version += 1"

      - from: MERCHANT_NOTIFIED
        to: REVERSED
        trigger: "POST /acquirer/chargebacks/{id}/reverse"
        actor: AcquirerOps
        preconditions: []
        side_effects:
          - "same side-effect set as RECEIVED -> REVERSED"

      - from: REPRESENTED
        to: REVERSED
        trigger: "POST /acquirer/chargebacks/{id}/reverse"
        actor: AcquirerOps
        preconditions: []
        side_effects:
          - "same side-effect set as RECEIVED -> REVERSED"

  - entity: Representment
    initial_state: ASSEMBLED
    terminal_states: [WON, PARTIAL_WON, LOST, SUPERSEDED]
    # Cyclic: SUBMITTED -> RETURNED_FOR_CURE -> (new ASSEMBLED packet supersedes) -> SUBMITTED.
    transitions:
      - from: null
        to: ASSEMBLED
        trigger: "POST /acquirer/representments (creation)"
        actor: MerchantUser | AcquirerOps
        preconditions:
          - "OCC: expected_chargeback_version == Chargeback.version else ERR_STALE_VERSION (412)"
          - "Chargeback.case_status in {MERCHANT_NOTIFIED, REPRESENTED} else ERR_INVALID_CASE_STATE"
          - "Merchant.status == ACTIVE else ERR_MERCHANT_SUSPENDED"
          - "no other Representment of this chargeback in ASSEMBLED or SUBMITTED else ERR_REPRESENTMENT_ALREADY_OPEN"
          - "if Chargeback.case_status == REPRESENTED: the latest non-SUPERSEDED Representment must be RETURNED_FOR_CURE with cure_count < 1 else ERR_CURE_LIMIT_EXCEEDED (an in-flight ASSEMBLED/SUBMITTED packet is caught earlier by ERR_REPRESENTMENT_ALREADY_OPEN)"
          - "evidence_item_ids non-empty else ERR_EMPTY_EVIDENCE_PACKET"
          - "every id in evidence_item_ids resolves to an EvidenceItem of this chargeback in DRAFT else ERR_EVIDENCE_NOT_ATTACHABLE"
        side_effects:
          - "new Representment.cure_count := 0 when case_status was MERCHANT_NOTIFIED, else superseded packet's cure_count + 1"
          - "prior RETURNED_FOR_CURE Representment -> SUPERSEDED; its ATTACHED evidence items return to DRAFT"
          - "each id in evidence_item_ids: EvidenceItem DRAFT -> ATTACHED"
          - "Chargeback.version += 1 (case activity; this is the OCC write)"

      - from: ASSEMBLED
        to: SUBMITTED
        trigger: "POST /acquirer/representments/{id}/submit"
        actor: MerchantUser | AcquirerOps
        preconditions:
          - "MerchantUser actor must own the parent chargeback else ERR_NOT_FOUND"
          - "Merchant.status == ACTIVE else ERR_MERCHANT_SUSPENDED"
          - "now <= Chargeback.representment_due_at (inclusive) else ERR_REPRESENTMENT_DEADLINE_PASSED"
          - "compelling-evidence completeness: every type in the governing ReasonCodeRule.required_evidence_types is covered by >= 1 ATTACHED EvidenceItem of this packet else ERR_EVIDENCE_INCOMPLETE"
        side_effects:
          - "submitted_at := now"
          - "if Chargeback.case_status == MERCHANT_NOTIFIED: Chargeback -> REPRESENTED"
          - "Chargeback.version += 1"

      - from: SUBMITTED
        to: WON
        trigger: "POST /acquirer/representments/{id}/network-outcome with outcome WON"
        actor: AcquirerOps
        preconditions: []
        side_effects:
          - "won_amount_cents := Chargeback.amount_cents; decided_at := now"
          - "Chargeback REPRESENTED -> DECIDED_WON cascade (funds, clearing, reserve release, target recompute)"

      - from: SUBMITTED
        to: PARTIAL_WON
        trigger: "POST /acquirer/representments/{id}/network-outcome with outcome PARTIAL_WON"
        actor: AcquirerOps
        preconditions:
          - "won_amount_cents provided and 0 < won_amount_cents < Chargeback.amount_cents else ERR_INVALID_REQUEST"
        side_effects:
          - "won_amount_cents recorded; decided_at := now"
          - "Chargeback REPRESENTED -> DECIDED_WON cascade with recredited_cents := won_amount_cents"

      - from: SUBMITTED
        to: LOST
        trigger: "POST /acquirer/representments/{id}/network-outcome with outcome LOST"
        actor: AcquirerOps
        preconditions: []
        side_effects:
          - "decided_at := now"
          - "Chargeback REPRESENTED -> DECIDED_LOST cascade (funds DEBIT_FINAL, HIGH_RISK reserve forfeit, target recompute)"

      - from: SUBMITTED
        to: RETURNED_FOR_CURE
        trigger: "POST /acquirer/representments/{id}/network-outcome with outcome RETURNED_FOR_CURE"
        actor: AcquirerOps
        preconditions:
          - "this.cure_count < 1 (MAX_CURES) else ERR_CURE_LIMIT_EXCEEDED"
        side_effects:
          - "decided_at stays null; Chargeback remains REPRESENTED (cure window open)"
          - "Chargeback.version += 1"

      - from: RETURNED_FOR_CURE
        to: SUPERSEDED
        trigger: "system (when a successor Representment is created for the same chargeback)"
        actor: system
        preconditions: []
        side_effects:
          - "this packet's ATTACHED EvidenceItems return to DRAFT"

      - from: ASSEMBLED
        to: SUPERSEDED
        trigger: "system (when the parent Chargeback -> REVERSED or -> EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "this packet's ATTACHED EvidenceItems return to DRAFT"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (when the parent Chargeback -> REVERSED)"
        actor: system
        preconditions: []
        side_effects:
          - "this packet's ATTACHED EvidenceItems return to DRAFT"

  - entity: EvidenceItem
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    # Cyclic: DRAFT -> ATTACHED -> DRAFT on representment supersede.
    transitions:
      - from: DRAFT
        to: ATTACHED
        trigger: "system (POST /acquirer/representments referencing this item)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ATTACHED
        to: DRAFT
        trigger: "system (when the referencing Representment -> SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /acquirer/evidence-items/{id}/withdraw"
        actor: MerchantUser
        preconditions:
          - "acting MerchantUser owns the parent chargeback else ERR_NOT_FOUND"
        side_effects: []

  - entity: FeeAssessment
    initial_state: ASSESSED
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: ASSESSED
        to: SETTLED
        trigger: "POST /acquirer/fee-assessments/{id}/settle"
        actor: FinanceOps
        preconditions: []
        side_effects:
          - "Merchant.clearing_balance_cents -= amount_cents (fee collected from clearing)"
          - "settled_at := now"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /acquirer/fee-assessments/{id}/waive"
        actor: FinanceOps
        preconditions:
          - "segregation of duties: X-User-ID != assessed_by_user_id whenever assessed_by_user_id != 'system' else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "waived_by_user_id := X-User-ID; waived_at := now; no money movement"

  - entity: ProgramEnrollment
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - from: ACTIVE
        to: REMEDIATION
        trigger: "system (when a RemediationPlan of this enrollment -> APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "PROGRAM_FINE assessments stop while in REMEDIATION"
      - from: ACTIVE
        to: EXITED
        trigger: "POST /acquirer/program-enrollments/{id}/exit-review"
        actor: RiskOfficer
        preconditions:
          - "an APPROVED RemediationPlan exists for this enrollment else ERR_EXIT_CRITERIA_NOT_MET"
          - "at least 3 POSTED RatioSnapshots exist for (merchant_id, network) and the 3 most recent by period_month are all strictly below the program threshold else ERR_EXIT_CRITERIA_NOT_MET"
        side_effects:
          - "status := EXITED; exited_month := request exited_month"
      - from: REMEDIATION
        to: EXITED
        trigger: "POST /acquirer/program-enrollments/{id}/exit-review"
        actor: RiskOfficer
        preconditions:
          - "same exit criteria as ACTIVE -> EXITED"
        side_effects:
          - "status := EXITED; exited_month := request exited_month"

  - entity: RemediationPlan
    initial_state: DRAFT
    terminal_states: [APPROVED]
    # Cyclic: SUBMITTED -> RETURNED -> SUBMITTED.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /acquirer/remediation-plans/{id}/submit"
        actor: MerchantUser
        preconditions:
          - "acting MerchantUser owns the enrollment's merchant else ERR_NOT_FOUND"
          - "Merchant.status == ACTIVE else ERR_MERCHANT_SUSPENDED"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /acquirer/remediation-plans/{id}/review with decision APPROVE"
        actor: RiskOfficer
        preconditions: []
        side_effects:
          - "reviewed_by_user_id := X-User-ID; decision_note recorded"
          - "parent ProgramEnrollment ACTIVE -> REMEDIATION"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /acquirer/remediation-plans/{id}/review with decision RETURN"
        actor: RiskOfficer
        preconditions: []
        side_effects:
          - "reviewed_by_user_id := X-User-ID; decision_note recorded"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /acquirer/remediation-plans/{id}/submit"
        actor: MerchantUser
        preconditions:
          - "acting MerchantUser owns the enrollment's merchant else ERR_NOT_FOUND"
          - "Merchant.status == ACTIVE else ERR_MERCHANT_SUSPENDED"
        side_effects: []

  - entity: PreventionAlert
    initial_state: OPEN
    terminal_states: [ACTIONED_REFUND, DISMISSED, EXPIRED]
    transitions:
      - from: OPEN
        to: ACTIONED_REFUND
        trigger: "POST /acquirer/prevention-alerts/{id}/action with action REFUND"
        actor: MerchantUser
        preconditions:
          - "acting MerchantUser owns the alert's merchant else ERR_NOT_FOUND"
          - "Merchant.status == ACTIVE else ERR_MERCHANT_SUSPENDED"
          - "Transaction.status == SETTLED else ERR_TRANSACTION_NOT_REFUNDABLE"
          - "note: the window is enforced by the clock-set expiry sweep — an alert whose response_due_at has passed is EXPIRED and fails the OPEN state check"
        side_effects:
          - "Transaction -> REFUNDED (deflection: a refunded sale can no longer be charged back)"
          - "Merchant.clearing_balance_cents -= Transaction.amount_cents (refund funded from clearing)"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /acquirer/prevention-alerts/{id}/action with action DISMISS"
        actor: MerchantUser
        preconditions:
          - "acting MerchantUser owns the alert's merchant else ERR_NOT_FOUND"
          - "Merchant.status == ACTIVE else ERR_MERCHANT_SUSPENDED"
        side_effects: []
      - from: OPEN
        to: EXPIRED
        trigger: "system (on POST /acquirer/_clock/set_current_utc when now > response_due_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EducationAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /acquirer/education-assignments/{id}/complete"
        actor: MerchantUser
        preconditions:
          - "acting MerchantUser owns the assignment's merchant else ERR_NOT_FOUND"
          - "Merchant.status == ACTIVE else ERR_MERCHANT_SUSPENDED"
        side_effects:
          - "completed_at := now"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: representment-create-stale-chargeback
    parent_entity: Chargeback
    write_endpoint: "POST /acquirer/representments"
    occ_field: expected_chargeback_version
    description: |
      Creating a Representment against a Chargeback whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created a packet (which legitimately
      supersedes a RETURNED_FOR_CURE packet under the cure rule) and the
      current writer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reserve-policy-patch-stale-merchant
    parent_entity: Merchant
    write_endpoint: "PATCH /acquirer/merchants/{id}/reserve-policy"
    occ_field: expected_merchant_version
    description: |
      Patching a Merchant's reserve policy (reserve_rate_bps / reserve_mode)
      whose version has advanced since the client last observed it is
      rejected, because a reserve-policy write blindly overwrites the prior
      policy values and the prior write's effects (including a target
      recompute) would be silently lost.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: deadline_computation
    trigger: "chargeback ingest (representment_due_at); notify transition (merchant_response_due_at); prevention-alert ingest (response_due_at)"
    algorithm: interval_merge
    formula: |
      representment_due_at   = received_at          + ReasonCodeRule.representment_days * 24h
      merchant_response_due_at = merchant_notified_at + ReasonCodeRule.merchant_response_days * 24h
      alert response_due_at  = PreventionAlert.received_at + ALERT_RESPONSE_HOURS * 1h
      All three deadlines are INCLUSIVE: the guarded action is allowed while
      now <= deadline, and rejected (or the entity auto-expires) when now > deadline.
    input_set: "the chargeback/alert being stamped; governing ReasonCodeRule resolved by (network, reason_code) whose half-open window [effective_from, effective_to) covers received_at"
    constants:
      ALERT_RESPONSE_HOURS: 72
    precision: "second precision on ISO8601 UTC instants"

  - name: chargeback_ratio
    trigger: "POST /acquirer/ops/advance-month sweep, once per (merchant, network, period_month) with any sales or chargeback activity in that month"
    algorithm: aggregation
    formula: |
      denominator = count(Transaction t where t.merchant_id = m, t.network = n,
                          occurred_at within period_month, any status)
      posted_num  = count(Chargeback c where c.merchant_id = m, c.network = n,
                          received_at within period_month, c.case_status != REVERSED)
      gross_num   = count(Chargeback c where c.merchant_id = m, c.network = n,
                          received_at within period_month)   # REVERSED included
      ratio_bps(num) =
        if denominator == 0 and num == 0: 0
        elif denominator == 0:            100000   # zero-denominator sentinel
        else: round_half_up(10000 * num / denominator)
      count_ratio_bps       = ratio_bps(posted_num)
      gross_count_ratio_bps = ratio_bps(gross_num)
    input_set: "Transactions by occurred_at month (any status); Chargebacks by received_at month; POSTED excludes case_status == REVERSED at sweep time, GROSS includes them"
    constants:
      ZERO_DENOMINATOR_SENTINEL_BPS: 100000
    precision: "integer basis points, round_half_up"
    variants:
      - name: POSTED
        when: "program-enrollment threshold evaluation and Merchant.current_count_ratio_bps"
        difference: "numerator excludes REVERSED chargebacks"
      - name: GROSS
        when: "network-reported gross basis surfaced on the same snapshot"
        difference: "numerator includes REVERSED chargebacks, so a reversed case still inflates gross_count_ratio_bps"

  - name: reserve_hold_rounding
    trigger: "Transaction ingest (per-transaction rolling-reserve hold)"
    algorithm: aggregation
    formula: |
      per_transaction_hold_cents = round_half_up(amount_cents * Merchant.reserve_rate_bps / 10000)
      ReserveAccount.held_cents    = sum over ReserveLedgerEntry of (HOLD - RELEASE - FORFEIT) amounts
      PINNED ORDER: each per-transaction hold is rounded to whole cents FIRST
      (round_half_up), and held_cents is the SUM OF THE ROUNDED per-entry amounts.
      Rounding only at the aggregate level is the forbidden alternative order.
    input_set: "the ingested transaction; all ReserveLedgerEntry rows of the merchant's ReserveAccount"
    precision: "whole cents, round_half_up per ledger entry"

  - name: reserve_target
    trigger: "Transaction ingest; any Chargeback funds_status transition; PATCH reserve-policy; advance-month sweep"
    algorithm: threshold
    formula: |
      trailing_90d_sales_cents = sum(Transaction.amount_cents where
          merchant_id = m and (now - 90 days) <= occurred_at <= now)   # closed both ends
      rate_floor_cents = round_half_up(Merchant.reserve_rate_bps * trailing_90d_sales_cents / 10000)
      open_exposure_cents = sum(Chargeback.amount_cents where merchant_id = m
          and case_status IN {RECEIVED, MERCHANT_NOTIFIED, REPRESENTED, PRE_ARBITRATION}
          and funds_status == MERCHANT_DEBITED)
    input_set: "merchant's transactions in the trailing 90-day closed window; merchant's open chargebacks by (case_status, funds_status)"
    constants:
      EXPOSURE_MULTIPLIER: 2
    precision: "whole cents, round_half_up"
    variants:
      - name: FIXED_TIER
        when: "Merchant.reserve_mode == FIXED_TIER"
        difference: "target_cents = rate_floor_cents (exposure ignored)"
      - name: EXPOSURE_BASED
        when: "Merchant.reserve_mode == EXPOSURE_BASED"
        difference: "target_cents = max(rate_floor_cents, EXPOSURE_MULTIPLIER * open_exposure_cents) — >= 3 inputs (rate, trailing sales, open exposure) with nested max and state-filtered input set"

  - name: releasable_reserve
    trigger: "POST /acquirer/reserve-accounts/{id}/release"
    algorithm: waterfall_allocation
    formula: |
      matured_pool_cents = sum(HOLD amounts where
          source_kind == TRANSACTION_SETTLEMENT and release_eligible_at <= now)
                         - sum(RELEASE amounts where source_kind == SCHEDULED_RELEASE)
      releasable_cents = max(0, matured_pool_cents)
      release_amount   = min(releasable_cents, max(0, held_cents - target_cents))
      Case-bound entries (CHARGEBACK_RECEIPT / CHARGEBACK_WON / CHARGEBACK_LOST)
      never enter the matured pool. If release_amount <= 0 the release is
      rejected with ERR_NO_RELEASABLE_FUNDS; otherwise a ReserveLedgerEntry
      (RELEASE, release_amount, source_kind=SCHEDULED_RELEASE) is created.
    input_set: "all ReserveLedgerEntry rows of the account; ReserveAccount.held_cents and target_cents at evaluation time"
    precision: "whole cents"

  - name: program_threshold_evaluation
    trigger: "POST /acquirer/ops/advance-month, after each RatioSnapshot is posted"
    algorithm: threshold
    formula: |
      For network VISA, evaluate in order:
        VDMP_EXCESSIVE: count_ratio_bps >= 180 and chargeback_count >= 10
        VDMP_STANDARD:  count_ratio_bps >= 90  and chargeback_count >= 5
      For network MASTERCARD, evaluate in order:
        HECM: count_ratio_bps >= 300 and chargeback_count >= 10
        ECM:  count_ratio_bps >= 150 and chargeback_count >= 10
      The higher tier wins when both match; boundaries are INCLUSIVE (>=).
      No program matches -> no enrollment, no months_over_count change.
      If an ACTIVE/REMEDIATION enrollment already exists for (merchant, network):
        over threshold -> months_over_count += 1; else unchanged.
      If none exists and a tier matches -> create ProgramEnrollment
        (status ACTIVE, enrolled_month = period_month, months_over_count = 1)
        subject to the closed-interval month-overlap rule.
    input_set: "the just-posted RatioSnapshot (POSTED basis) and existing enrollments for (merchant, network)"
    constants:
      VDMP_STANDARD_MIN_BPS: 90
      VDMP_STANDARD_MIN_COUNT: 5
      VDMP_EXCESSIVE_MIN_BPS: 180
      VDMP_EXCESSIVE_MIN_COUNT: 10
      ECM_MIN_BPS: 150
      ECM_MIN_COUNT: 10
      HECM_MIN_BPS: 300
      HECM_MIN_COUNT: 10
    precision: "integer bps comparison, >="

  - name: program_fine_schedule
    trigger: "advance-month sweep, for each ProgramEnrollment in status ACTIVE whose (merchant, network) snapshot that month is at or over threshold"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER (pinned, circular-looking otherwise):
        1) post the RatioSnapshot and compute count_ratio_bps
        2) if over threshold: months_over_count += 1
        3) compute the fine from the ALREADY-INCREMENTED months_over_count
      base_cents = BASE_FINE_CENTS[program_code]
      multiplier(m) = 1.0 if m <= 3; 1.5 if 4 <= m <= 6; 2.0 if m >= 7
      fine_cents = round_half_up(base_cents * multiplier(months_over_count))
      Create FeeAssessment(kind=PROGRAM_FINE, amount_cents=fine_cents,
        merchant_id, enrollment_id, assessed_by_user_id='system').
      Enrollments in REMEDIATION are not fined.
    input_set: "ACTIVE enrollments of the swept (merchant, network); the snapshot's POSTED ratio"
    constants:
      VDMP_STANDARD_BASE_CENTS: 250000
      VDMP_EXCESSIVE_BASE_CENTS: 500000
      ECM_BASE_CENTS: 250000
      HECM_BASE_CENTS: 500000
    precision: "whole cents, round_half_up"

  - name: win_rate_analytics
    trigger: "GET /acquirer/analytics/win-rate (computed read)"
    algorithm: aggregation
    formula: |
      decided = Representments with status IN {WON, PARTIAL_WON, LOST},
        joined to their Chargeback, filtered by optional merchant_id /
        reason_code / network query parameters
      win_rate_bps =
        if count(decided) == 0: null
        else: round_half_up(10000 * (count(WON) + 0.5 * count(PARTIAL_WON)) / count(decided))
    input_set: "decided Representments only; ASSEMBLED / SUBMITTED / RETURNED_FOR_CURE / SUPERSEDED are excluded"
    precision: "integer bps, round_half_up; null on empty set"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced ids exist after path ids. MerchantUser accessing a merchant-scoped resource whose merchant_id != X-User-ID is answered as NOT_FOUND (existence hidden, never 403)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /acquirer/representments; PATCH /acquirer/merchants/{id}/reserve-policy"
  - priority: 5
    category: state
    check: "Target (or guarding) entity is in a state that permits the operation: chargeback case_status, representment status, fee status, enrollment status, plan status, alert OPEN, assignment ASSIGNED, related Transaction SETTLED for chargeback ingest / alert refund"
    error_id: "ERR_INVALID_CASE_STATE | ERR_INVALID_REPRESENTMENT_STATE | ERR_INVALID_FEE_STATE | ERR_INVALID_ENROLLMENT_STATE | ERR_INVALID_PLAN_STATE | ERR_ALERT_NOT_OPEN | ERR_ASSIGNMENT_NOT_OPEN | ERR_TRANSACTION_NOT_CHARGEBACKABLE | ERR_TRANSACTION_NOT_REFUNDABLE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Compliance gates: Merchant.status == ACTIVE for merchant-side actions (ERR_MERCHANT_SUSPENDED); merchant ACTIVE for transaction ingest (ERR_MERCHANT_NOT_ACTIVE); segregation of duties on fee waiver (ERR_SEGREGATION_OF_DUTIES); reserve release blocked while any program enrollment is ACTIVE/REMEDIATION (ERR_PROGRAM_RESERVE_LOCK)"
    error_id: "ERR_MERCHANT_SUSPENDED | ERR_MERCHANT_NOT_ACTIVE | ERR_SEGREGATION_OF_DUTIES | ERR_PROGRAM_RESERVE_LOCK"
    http_status: 409
    applies_to: "merchant-side actions; transaction ingest; fee waive; reserve release"
  - priority: 7
    category: business_constraint
    check: "Uniqueness and structural constraints: network_case_id globally unique (ERR_DUPLICATE_NETWORK_CASE); external_ref unique per merchant (ERR_DUPLICATE_EXTERNAL_REF); at most one open chargeback per transaction (ERR_TRANSACTION_HAS_OPEN_CHARGEBACK); amount_cents <= transaction amount (ERR_CHARGEBACK_AMOUNT_EXCEEDS_TRANSACTION); rule effective windows half-open non-overlapping (ERR_RULE_WINDOW_OVERLAP); enrollment month ranges closed non-overlapping (ERR_ENROLLMENT_WINDOW_OVERLAP); packet constraints (ERR_EMPTY_EVIDENCE_PACKET, ERR_EVIDENCE_NOT_ATTACHABLE, ERR_REPRESENTMENT_ALREADY_OPEN, ERR_CURE_LIMIT_EXCEEDED)"
    error_id: "ERR_DUPLICATE_NETWORK_CASE | ERR_DUPLICATE_EXTERNAL_REF | ERR_TRANSACTION_HAS_OPEN_CHARGEBACK | ERR_CHARGEBACK_AMOUNT_EXCEEDS_TRANSACTION | ERR_RULE_WINDOW_OVERLAP | ERR_ENROLLMENT_WINDOW_OVERLAP | ERR_EMPTY_EVIDENCE_PACKET | ERR_EVIDENCE_NOT_ATTACHABLE | ERR_REPRESENTMENT_ALREADY_OPEN | ERR_CURE_LIMIT_EXCEEDED"
    http_status: 409
    applies_to: "creation and packet endpoints"
  - priority: 8
    category: business_temporal
    check: "Deadline gates (inclusive): representment submit now <= representment_due_at (ERR_REPRESENTMENT_DEADLINE_PASSED); merchant accept now <= merchant_response_due_at (ERR_ACCEPT_WINDOW_PASSED)"
    error_id: "ERR_REPRESENTMENT_DEADLINE_PASSED | ERR_ACCEPT_WINDOW_PASSED"
    http_status: 409
    applies_to: "representment submit; chargeback accept; alert action"
  - priority: 9
    category: business_referential
    check: "Referential completeness: a ReasonCodeRule whose half-open effective window covers received_at must exist for (network, reason_code) at ingest (ERR_REASON_CODE_RULE_NOT_FOUND); compelling-evidence completeness per required_evidence_types at submit (ERR_EVIDENCE_INCOMPLETE)"
    error_id: "ERR_REASON_CODE_RULE_NOT_FOUND | ERR_EVIDENCE_INCOMPLETE"
    http_status: 422
    applies_to: "chargeback ingest; representment submit"
  - priority: 10
    category: business_fiscal
    check: "Funds gates: reserve release_amount > 0 (ERR_NO_RELEASABLE_FUNDS)"
    error_id: ERR_NO_RELEASABLE_FUNDS
    http_status: 409
    applies_to: "reserve release"
  - priority: 11
    category: business_constraint
    check: "Payload shape: required fields present, types valid (ERR_INVALID_REQUEST); enum fields carry declared members (ERR_INVALID_ENUM)"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_ENUM"
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Merchant ---
  - method: POST
    path: "/acquirer/merchants"
    description: "Onboard a merchant; auto-creates its 1:1 ReserveAccount (held_cents=0, target_cents=0)"
    roles: [AcquirerOps]
    code: 201
    input: [legal_name, merchant_category_code, "risk_tier?", "reserve_mode?", "reserve_rate_bps?"]
    output: Merchant
    side_effects:
      - "Merchant.status := ACTIVE; clearing_balance_cents := 0"
      - "ReserveAccount created for the merchant (cascade)"
  - method: GET
    path: "/acquirer/merchants"
    description: "List merchants with pagination; MerchantUser is force-scoped to its own id"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["status?", "risk_tier?", "limit?", "offset?"]
    output: "Merchant[]"
    side_effects: []
  - method: GET
    path: "/acquirer/merchants/{id}"
    description: "Get one merchant; MerchantUser may only read its own id (else ERR_NOT_FOUND)"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: []
    output: Merchant
    side_effects: []
  - method: PATCH
    path: "/acquirer/merchants/{id}/reserve-policy"
    description: "Blind-overwrite reserve policy update, OCC-guarded on Merchant.version; recomputes ReserveAccount.target_cents"
    roles: [RiskOfficer]
    code: 200
    input: ["reserve_rate_bps?", "reserve_mode?", expected_merchant_version]
    output: Merchant
    side_effects:
      - "Merchant.version += 1 (OCC write)"
      - "recompute ReserveAccount.target_cents per reserve_target (no ledger entries created)"
  - method: POST
    path: "/acquirer/merchants/{id}/suspend"
    description: "Suspend a merchant (blocks merchant-side actions and transaction ingest)"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Merchant
    side_effects: ["Merchant ACTIVE -> SUSPENDED; version += 1"]
  - method: POST
    path: "/acquirer/merchants/{id}/reinstate"
    description: "Reinstate a suspended merchant"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Merchant
    side_effects: ["Merchant SUSPENDED -> ACTIVE; version += 1"]

  # --- ReasonCodeRule (immutable configuration) ---
  - method: POST
    path: "/acquirer/reason-code-rules"
    description: "Create a reason-code rule version; effective windows per (network, reason_code) are half-open [effective_from, effective_to) and must not overlap (adjacency allowed); null effective_to is open-ended"
    roles: [AcquirerOps]
    code: 201
    input: [network, reason_code, category, required_evidence_types, merchant_response_days, representment_days, chargeback_fee_cents, effective_from, "effective_to?"]
    output: ReasonCodeRule
    side_effects: []
  - method: GET
    path: "/acquirer/reason-code-rules"
    description: "List reason-code rules with filters and pagination"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["network?", "reason_code?", "limit?", "offset?"]
    output: "ReasonCodeRule[]"
    side_effects: []

  # --- Transaction ---
  - method: POST
    path: "/acquirer/transactions"
    description: "Ingest one settled card sale"
    roles: [AcquirerOps]
    code: 201
    input: [merchant_id, external_ref, network, amount_cents, occurred_at]
    output: Transaction
    side_effects:
      - "Merchant.clearing_balance_cents += amount_cents - per-transaction reserve hold"
      - "ReserveLedgerEntry(HOLD, round_half_up(amount_cents * reserve_rate_bps / 10000), source_kind=TRANSACTION_SETTLEMENT, source_id=transaction.id, release_eligible_at = occurred_at + 90 days) when the hold rounds to > 0"
      - "recompute ReserveAccount.held_cents and target_cents"
  - method: POST
    path: "/acquirer/transactions/batch"
    description: "Batch settlement-file ingest: creates `count` identical transactions with external_ref = external_ref_prefix + '-' + zero-padded 4-digit sequence (0001..count); same per-transaction side effects as single ingest, applied in ascending sequence order"
    roles: [AcquirerOps]
    code: 201
    input: [merchant_id, network, count, amount_cents, occurred_at, external_ref_prefix]
    output: "{ created_count: integer, first_external_ref: string, last_external_ref: string }"
    side_effects:
      - "per created transaction: clearing credit, reserve HOLD, held/target recompute (same as POST /acquirer/transactions)"
  - method: GET
    path: "/acquirer/transactions"
    description: "List transactions with filters; MerchantUser force-scoped to own merchant_id"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["merchant_id?", "status?", "limit?", "offset?"]
    output: "Transaction[]"
    side_effects: []
  - method: GET
    path: "/acquirer/transactions/{id}"
    description: "Get one transaction"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  # --- Chargeback ---
  - method: POST
    path: "/acquirer/chargebacks"
    description: "Network case ingestion: resolves the disputed sale by (merchant_id, transaction_external_ref), debits the merchant, auto-assesses the per-case fee, and applies the HIGH_RISK receipt holdback"
    roles: [AcquirerOps]
    code: 201
    input: [merchant_id, transaction_external_ref, network_case_id, reason_code, amount_cents]
    output: Chargeback
    side_effects:
      - "case_status := RECEIVED, funds_status := MERCHANT_DEBITED, received_at := now, representment_due_at := received_at + rule.representment_days"
      - "Merchant.clearing_balance_cents -= amount_cents (receipt debit)"
      - "Transaction -> CHARGED_BACK"
      - "auto-create FeeAssessment(kind=CHARGEBACK_FEE, amount_cents = rule.chargeback_fee_cents, assessed_by_user_id='system')"
      - "HIGH_RISK cascade: ReserveLedgerEntry(HOLD, amount_cents, source_kind=CHARGEBACK_RECEIPT, source_id=chargeback.id, release_eligible_at=null); recompute held_cents"
      - "recompute ReserveAccount.target_cents (case enters the open-exposure set)"
  - method: GET
    path: "/acquirer/chargebacks"
    description: "List chargebacks with filters; MerchantUser force-scoped to own merchant_id; list order: created_at ascending, ties keep creation order"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["merchant_id?", "transaction_id?", "case_status?", "limit?", "offset?"]
    output: "Chargeback[]"
    side_effects: []
  - method: GET
    path: "/acquirer/chargebacks/{id}"
    description: "Get one chargeback"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: []
    output: Chargeback
    side_effects: []
  - method: POST
    path: "/acquirer/chargebacks/{id}/notify"
    description: "Notify the merchant; opens the merchant response window"
    roles: [AcquirerOps]
    code: 200
    input: []
    output: Chargeback
    side_effects: ["Chargeback RECEIVED -> MERCHANT_NOTIFIED; merchant_notified_at and merchant_response_due_at stamped"]
  - method: POST
    path: "/acquirer/chargebacks/{id}/accept"
    description: "Merchant accepts liability within the merchant response window"
    roles: [MerchantUser]
    code: 200
    input: []
    output: Chargeback
    side_effects: ["Chargeback MERCHANT_NOTIFIED -> MERCHANT_ACCEPTED; funds_status := DEBIT_FINAL"]
  - method: POST
    path: "/acquirer/chargebacks/{id}/reverse"
    description: "Network reversal / issuer withdrawal; compensating credit to the merchant; fee survives"
    roles: [AcquirerOps]
    code: 200
    input: []
    output: Chargeback
    side_effects: ["Chargeback -> REVERSED cascade (clearing credit, representment supersede, ratio exclusion, HIGH_RISK holdback release)"]
  - method: POST
    path: "/acquirer/chargebacks/{id}/pre-arbitration"
    description: "Issuer escalates a won case to pre-arbitration; merchant is re-debited"
    roles: [AcquirerOps]
    code: 200
    input: []
    output: Chargeback
    side_effects: ["Chargeback DECIDED_WON -> PRE_ARBITRATION cascade (re-debit, HIGH_RISK holdback restored)"]
  - method: POST
    path: "/acquirer/chargebacks/{id}/pre-arbitration/outcome"
    description: "Network decision on a pre-arbitration case"
    roles: [AcquirerOps]
    code: 200
    input: [decision]
    output: Chargeback
    side_effects: ["PRE_ARBITRATION -> DECIDED_WON (decision=WON) or DECIDED_LOST (decision=LOST) with the documented funds/reserve cascades"]

  # --- EvidenceItem ---
  - method: POST
    path: "/acquirer/evidence-items"
    description: "Upload a compelling-evidence document for a chargeback in MERCHANT_NOTIFIED or REPRESENTED"
    roles: [MerchantUser, AcquirerOps]
    code: 201
    input: [chargeback_id, evidence_type, document_uri]
    output: EvidenceItem
    side_effects: []
  - method: GET
    path: "/acquirer/evidence-items"
    description: "List evidence items with filters; list order: created_at ascending, ties keep creation order"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["chargeback_id?", "status?", "limit?", "offset?"]
    output: "EvidenceItem[]"
    side_effects: []
  - method: GET
    path: "/acquirer/evidence-items/{id}"
    description: "Get one evidence item"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []
  - method: POST
    path: "/acquirer/evidence-items/{id}/withdraw"
    description: "Withdraw a DRAFT evidence item"
    roles: [MerchantUser]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: ["EvidenceItem DRAFT -> WITHDRAWN"]

  # --- Representment ---
  - method: POST
    path: "/acquirer/representments"
    description: "Assemble a representment packet from DRAFT evidence items; OCC-guarded on Chargeback.version; supersedes a RETURNED_FOR_CURE packet (cure rule)"
    roles: [MerchantUser, AcquirerOps]
    code: 201
    input: [chargeback_id, evidence_item_ids, expected_chargeback_version]
    output: Representment
    side_effects:
      - "Representment created ASSEMBLED; cure_count carried per the cure rule"
      - "prior RETURNED_FOR_CURE packet -> SUPERSEDED; its evidence returns to DRAFT; new packet's evidence DRAFT -> ATTACHED"
      - "increments Chargeback.version by 1"
  - method: GET
    path: "/acquirer/representments"
    description: "List representments with filters; list order: created_at ascending, ties keep creation order"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["chargeback_id?", "status?", "limit?", "offset?"]
    output: "Representment[]"
    side_effects: []
  - method: GET
    path: "/acquirer/representments/{id}"
    description: "Get one representment"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: []
    output: Representment
    side_effects: []
  - method: POST
    path: "/acquirer/representments/{id}/submit"
    description: "Submit the packet to the network before the inclusive representment deadline; enforces compelling-evidence completeness per the governing reason-code rule"
    roles: [MerchantUser, AcquirerOps]
    code: 200
    input: []
    output: Representment
    side_effects: ["Representment ASSEMBLED -> SUBMITTED; first submission moves Chargeback MERCHANT_NOTIFIED -> REPRESENTED; Chargeback.version += 1"]
  - method: POST
    path: "/acquirer/representments/{id}/network-outcome"
    description: "Post the network decision: WON | PARTIAL_WON (requires won_amount_cents) | LOST | RETURNED_FOR_CURE (cure allowed at most once per packet lineage)"
    roles: [AcquirerOps]
    code: 200
    input: [outcome, "won_amount_cents?"]
    output: Representment
    side_effects: ["Representment -> outcome state; Chargeback cascade per the chargeback state machine (funds, clearing, reserve, target)"]

  # --- FeeAssessment ---
  - method: POST
    path: "/acquirer/fee-assessments"
    description: "Manual ad-hoc fee assessment; restricted to kind ARBITRATION_FEE (other kinds are system-assessed only)"
    roles: [FinanceOps]
    code: 201
    input: [merchant_id, kind, amount_cents, "chargeback_id?", "enrollment_id?"]
    output: FeeAssessment
    side_effects: ["assessed_by_user_id := X-User-ID; status := ASSESSED"]
  - method: GET
    path: "/acquirer/fee-assessments"
    description: "List fee assessments with filters; list order: created_at ascending, ties keep creation order"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["merchant_id?", "chargeback_id?", "enrollment_id?", "status?", "limit?", "offset?"]
    output: "FeeAssessment[]"
    side_effects: []
  - method: GET
    path: "/acquirer/fee-assessments/{id}"
    description: "Get one fee assessment"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []
  - method: POST
    path: "/acquirer/fee-assessments/{id}/waive"
    description: "Waive an ASSESSED fee; segregation of duties: the waiving FinanceOps user must differ from assessed_by_user_id (unless system-assessed)"
    roles: [FinanceOps]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["FeeAssessment ASSESSED -> WAIVED"]
  - method: POST
    path: "/acquirer/fee-assessments/{id}/settle"
    description: "Settle an ASSESSED fee by collecting it from merchant clearing"
    roles: [FinanceOps]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["FeeAssessment ASSESSED -> SETTLED; Merchant.clearing_balance_cents -= amount_cents"]

  # --- ReserveAccount / ReserveLedgerEntry ---
  - method: GET
    path: "/acquirer/reserve-accounts"
    description: "List reserve accounts (reverse lookup for the merchant's 1:1 account)"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["merchant_id?", "limit?", "offset?"]
    output: "ReserveAccount[]"
    side_effects: []
  - method: GET
    path: "/acquirer/reserve-accounts/{id}"
    description: "Get one reserve account"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: []
    output: ReserveAccount
    side_effects: []
  - method: POST
    path: "/acquirer/reserve-accounts/{id}/release"
    description: "Release matured settlement holds down to the reserve target; blocked while any program enrollment of the merchant is ACTIVE/REMEDIATION"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: ReserveAccount
    side_effects: ["ReserveLedgerEntry(RELEASE, release_amount, source_kind=SCHEDULED_RELEASE) per releasable_reserve; Merchant.clearing_balance_cents += release_amount; held_cents recomputed"]
  - method: GET
    path: "/acquirer/reserve-accounts/{id}/ledger-entries"
    description: "List the append-only reserve ledger of an account; list order: created_at ascending, ties keep creation order"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReserveLedgerEntry[]"
    side_effects: []

  # --- RatioSnapshot (sub-resource) ---
  - method: GET
    path: "/acquirer/merchants/{id}/ratio-snapshots"
    description: "List posted ratio snapshots of a merchant, optionally filtered to one month; list order: created_at ascending, ties keep creation order"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["period_month?", "limit?", "offset?"]
    output: "RatioSnapshot[]"
    side_effects: []

  # --- ProgramEnrollment ---
  - method: POST
    path: "/acquirer/program-enrollments"
    description: "Manual enrollment (audit-driven); enrollment month ranges per (merchant_id, network, program_code) are CLOSED intervals [enrolled_month, exited_month] and must not overlap — re-enrollment in the exit month itself conflicts"
    roles: [RiskOfficer]
    code: 201
    input: [merchant_id, network, program_code, enrolled_month]
    output: ProgramEnrollment
    side_effects:
      - "status := ACTIVE; months_over_count := 1"
      - "education cascade: create two EducationAssignments for the merchant — CHARGEBACK_BASICS plus EVIDENCE_BEST_PRACTICE for VDMP_* programs or FRAUD_PREVENTION for ECM/HECM programs"
  - method: GET
    path: "/acquirer/program-enrollments"
    description: "List program enrollments with filters; list order: created_at ascending, ties keep creation order"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["merchant_id?", "status?", "limit?", "offset?"]
    output: "ProgramEnrollment[]"
    side_effects: []
  - method: GET
    path: "/acquirer/program-enrollments/{id}"
    description: "Get one program enrollment"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: []
    output: ProgramEnrollment
    side_effects: []
  - method: POST
    path: "/acquirer/program-enrollments/{id}/exit-review"
    description: "RiskOfficer exit decision; requires an APPROVED remediation plan and the 3 most recent POSTED snapshots strictly below threshold"
    roles: [RiskOfficer]
    code: 200
    input: [exited_month]
    output: ProgramEnrollment
    side_effects: ["ProgramEnrollment ACTIVE|REMEDIATION -> EXITED; exited_month recorded"]
  - method: GET
    path: "/acquirer/program-enrollments/{id}/remediation-plans"
    description: "List remediation plans of an enrollment (reverse lookup)"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "RemediationPlan[]"
    side_effects: []

  # --- RemediationPlan ---
  - method: POST
    path: "/acquirer/remediation-plans"
    description: "Merchant drafts a remediation plan for an ACTIVE/REMEDIATION enrollment; at most one plan in DRAFT or SUBMITTED per enrollment"
    roles: [MerchantUser]
    code: 201
    input: [enrollment_id, root_cause_codes, corrective_actions]
    output: RemediationPlan
    side_effects: []
  - method: POST
    path: "/acquirer/remediation-plans/{id}/submit"
    description: "Submit a DRAFT plan, or resubmit a RETURNED plan (review cycle)"
    roles: [MerchantUser]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: ["RemediationPlan DRAFT|RETURNED -> SUBMITTED"]
  - method: POST
    path: "/acquirer/remediation-plans/{id}/review"
    description: "RiskOfficer reviews a SUBMITTED plan; APPROVE moves the enrollment to REMEDIATION"
    roles: [RiskOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: RemediationPlan
    side_effects: ["RemediationPlan SUBMITTED -> APPROVED|RETURNED; on APPROVED the parent enrollment ACTIVE -> REMEDIATION"]

  # --- PreventionAlert ---
  - method: POST
    path: "/acquirer/prevention-alerts"
    description: "Ingest a network prevention alert for a transaction; response window is 72h from the logical clock"
    roles: [AcquirerOps]
    code: 201
    input: [transaction_id, alert_type]
    output: PreventionAlert
    side_effects: ["status := OPEN; received_at := now; response_due_at := now + 72h"]
  - method: GET
    path: "/acquirer/prevention-alerts"
    description: "List prevention alerts with filters"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["merchant_id?", "transaction_id?", "status?", "limit?", "offset?"]
    output: "PreventionAlert[]"
    side_effects: []
  - method: GET
    path: "/acquirer/prevention-alerts/{id}"
    description: "Get one prevention alert"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: []
    output: PreventionAlert
    side_effects: []
  - method: POST
    path: "/acquirer/prevention-alerts/{id}/action"
    description: "Merchant actions an OPEN alert: REFUND deflects (refunds the sale, blocking any later chargeback on it) or DISMISS"
    roles: [MerchantUser]
    code: 200
    input: [action]
    output: PreventionAlert
    side_effects: ["REFUND: Transaction SETTLED -> REFUNDED, Merchant.clearing_balance_cents -= Transaction.amount_cents; DISMISS: status := DISMISSED"]

  # --- EducationAssignment ---
  - method: GET
    path: "/acquirer/merchants/{id}/education-assignments"
    description: "List a merchant's education assignments (reverse lookup; assignments are system-created on program enrollment); list order: created_at ascending, ties keep creation order"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EducationAssignment[]"
    side_effects: []
  - method: POST
    path: "/acquirer/education-assignments/{id}/complete"
    description: "Merchant marks an ASSIGNED education module complete"
    roles: [MerchantUser]
    code: 200
    input: []
    output: EducationAssignment
    side_effects: ["EducationAssignment ASSIGNED -> COMPLETED; completed_at stamped"]

  # --- Analytics ---
  - method: GET
    path: "/acquirer/analytics/win-rate"
    description: "Win-rate analytics over decided representments, filterable by merchant, reason code, and network; PARTIAL_WON counts as half a win; empty decided set yields win_rate_bps null"
    roles: [AcquirerOps, RiskOfficer, FinanceOps, MerchantUser]
    code: 200
    input: ["merchant_id?", "reason_code?", "network?"]
    output: "{ decided_count: integer, won_count: integer, partial_win_count: integer, lost_count: integer, win_rate_bps: integer }"
    side_effects: []

  # --- Ops & clock ---
  - method: POST
    path: "/acquirer/ops/advance-month"
    description: "Monthly ops checkpoint: posts RatioSnapshots (one per merchant x network with any activity; repeat sweeps of an existing triple are skipped), evaluates program thresholds (POSTED basis), creates enrollments (+ education cascade), increments months_over_count, and assesses program fines"
    roles: [AcquirerOps]
    code: 200
    input: [period_month, "merchant_id?"]
    output: "{ snapshots_created: integer, snapshots_skipped: integer, enrollments_created: integer, fines_assessed: integer }"
    side_effects:
      - "RatioSnapshot posted per chargeback_ratio; Merchant.current_count_ratio_bps refreshed"
      - "program_threshold_evaluation + program_fine_schedule cascades (enrollment -> education assignments -> fine)"
      - "recompute ReserveAccount.target_cents for each swept merchant"
  - method: POST
    path: "/acquirer/_clock/set_current_utc"
    description: "Test-driving logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never the wall clock. The clock may be set to any ISO8601 UTC instant (forward or backward); each set fires the expiry sweep: OPEN alerts with response_due_at < now become EXPIRED, and chargebacks in RECEIVED/MERCHANT_NOTIFIED with representment_due_at < now become EXPIRED (with the documented cascades)."
    roles: [AcquirerOps]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["alert expiry sweep; chargeback expiry sweep (see Chargeback EXPIRED transitions)"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's allowed roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist; also the answer when a MerchantUser touches a resource whose merchant_id differs from X-User-ID (existence hidden)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or constraint violated (e.g., PARTIAL_WON without 0 < won_amount_cents < amount; manual fee kind other than ARBITRATION_FEE)" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries a value outside its declared member set" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version on an OCC-guarded write" }
  - { id: ERR_DUPLICATE_NETWORK_CASE, http: 409, condition: "network_case_id already exists on any chargeback" }
  - { id: ERR_DUPLICATE_EXTERNAL_REF, http: 409, condition: "external_ref already used by another transaction of the same merchant" }
  - { id: ERR_REASON_CODE_RULE_NOT_FOUND, http: 422, condition: "No ReasonCodeRule for (network, reason_code) whose half-open effective window covers the chargeback's received_at" }
  - { id: ERR_RULE_WINDOW_OVERLAP, http: 409, condition: "New ReasonCodeRule effective window overlaps an existing rule with the same (network, reason_code); half-open adjacency is allowed" }
  - { id: ERR_TRANSACTION_NOT_CHARGEBACKABLE, http: 409, condition: "Chargeback ingest against a transaction whose status is not SETTLED (e.g., REFUNDED via alert deflection)" }
  - { id: ERR_TRANSACTION_HAS_OPEN_CHARGEBACK, http: 409, condition: "Transaction already has a chargeback in a non-terminal case_status {RECEIVED, MERCHANT_NOTIFIED, REPRESENTED, PRE_ARBITRATION}" }
  - { id: ERR_CHARGEBACK_AMOUNT_EXCEEDS_TRANSACTION, http: 409, condition: "chargeback amount_cents exceeds the disputed transaction's amount_cents" }
  - { id: ERR_MERCHANT_SUSPENDED, http: 409, condition: "Merchant-side action (evidence upload, representment create/submit, accept, alert action, plan create/submit, education complete) while Merchant.status == SUSPENDED" }
  - { id: ERR_MERCHANT_NOT_ACTIVE, http: 409, condition: "Transaction ingest (single or batch) for a merchant whose status != ACTIVE" }
  - { id: ERR_INVALID_CASE_STATE, http: 409, condition: "Chargeback case_status does not permit the operation (e.g., notify/accept/reverse/pre-arbitration from a wrong state; evidence upload outside MERCHANT_NOTIFIED/REPRESENTED; representment create outside MERCHANT_NOTIFIED/REPRESENTED)" }
  - { id: ERR_ACCEPT_WINDOW_PASSED, http: 409, condition: "Merchant accept after merchant_response_due_at (deadline inclusive: accept allowed while now <= merchant_response_due_at)" }
  - { id: ERR_REPRESENTMENT_DEADLINE_PASSED, http: 409, condition: "Representment submit after representment_due_at (deadline inclusive: submit allowed while now <= representment_due_at)" }
  - { id: ERR_EVIDENCE_INCOMPLETE, http: 422, condition: "Packet at submit does not cover every type in the governing ReasonCodeRule.required_evidence_types with at least one ATTACHED item" }
  - { id: ERR_EVIDENCE_NOT_ATTACHABLE, http: 409, condition: "evidence_item_ids references an item that is not DRAFT or belongs to a different chargeback" }
  - { id: ERR_EMPTY_EVIDENCE_PACKET, http: 409, condition: "evidence_item_ids is empty on representment create" }
  - { id: ERR_REPRESENTMENT_ALREADY_OPEN, http: 409, condition: "A Representment of this chargeback is already ASSEMBLED or SUBMITTED (also blocks merchant accept while a packet is in flight)" }
  - { id: ERR_CURE_LIMIT_EXCEEDED, http: 409, condition: "Cure cycle exhausted: representment create against a REPRESENTED chargeback whose latest non-SUPERSEDED packet is not a curable RETURNED_FOR_CURE (cure_count >= 1), or network-outcome RETURNED_FOR_CURE on a packet with cure_count >= 1" }
  - { id: ERR_INVALID_REPRESENTMENT_STATE, http: 409, condition: "Representment status does not permit the operation (submit of non-ASSEMBLED; network-outcome of non-SUBMITTED)" }
  - { id: ERR_INVALID_FEE_STATE, http: 409, condition: "waive/settle of a FeeAssessment not in ASSESSED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "FinanceOps user attempts to waive a fee whose assessed_by_user_id equals their own X-User-ID (system-assessed fees exempt)" }
  - { id: ERR_NO_RELEASABLE_FUNDS, http: 409, condition: "Reserve release computed release_amount <= 0 (no matured pool, or held already at/below target)" }
  - { id: ERR_PROGRAM_RESERVE_LOCK, http: 409, condition: "Reserve release while any ProgramEnrollment of the merchant is ACTIVE or REMEDIATION (compliance lock outranks funds availability)" }
  - { id: ERR_ENROLLMENT_WINDOW_OVERLAP, http: 409, condition: "Manual enrollment whose [enrolled_month, exited_month] CLOSED month range collides with an existing enrollment of the same (merchant, network, program_code); enrollment in the prior exit month itself conflicts" }
  - { id: ERR_INVALID_ENROLLMENT_STATE, http: 409, condition: "exit-review of an already EXITED enrollment, or remediation-plan create against an EXITED enrollment" }
  - { id: ERR_EXIT_CRITERIA_NOT_MET, http: 409, condition: "exit-review without an APPROVED remediation plan, or fewer than 3 POSTED snapshots, or any of the 3 most recent POSTED snapshots at/above the program threshold" }
  - { id: ERR_INVALID_PLAN_STATE, http: 409, condition: "submit of a non-DRAFT/non-RETURNED plan; review of a non-SUBMITTED plan; create while another plan of the enrollment is DRAFT or SUBMITTED" }
  - { id: ERR_ALERT_NOT_OPEN, http: 409, condition: "action on a PreventionAlert whose status is not OPEN (the clock-set expiry sweep has already flipped past-due OPEN alerts to EXPIRED, so a stale-window action surfaces as this state error)" }
  - { id: ERR_TRANSACTION_NOT_REFUNDABLE, http: 409, condition: "Alert REFUND action against a transaction whose status is not SETTLED" }
  - { id: ERR_ASSIGNMENT_NOT_OPEN, http: 409, condition: "complete on an EducationAssignment not in ASSIGNED" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: AcquirerOps
    description: "Acquirer network-operations operator: ingests network cases, alerts, and settlement files; posts network outcomes; runs the monthly sweep and the logical clock; manages reason-code rules"
    identity: opaque
    exclusive_operations:
      - "POST /acquirer/merchants"
      - "POST /acquirer/reason-code-rules"
      - "POST /acquirer/transactions and /acquirer/transactions/batch"
      - "POST /acquirer/chargebacks (network case ingest)"
      - "POST /acquirer/chargebacks/{id}/notify and /reverse and /pre-arbitration(+ /outcome)"
      - "POST /acquirer/representments/{id}/network-outcome"
      - "POST /acquirer/prevention-alerts"
      - "POST /acquirer/ops/advance-month and /acquirer/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /acquirer/evidence-items and POST /acquirer/representments(+ /submit) on behalf of a merchant"

  - name: MerchantUser
    description: "Merchant-side operator acting as its own Merchant entity; merchant-scoped resources are visible/actionable only when merchant_id == X-User-ID (otherwise ERR_NOT_FOUND)"
    identity: entity_backed:Merchant
    exclusive_operations:
      - "POST /acquirer/chargebacks/{id}/accept"
      - "POST /acquirer/evidence-items/{id}/withdraw"
      - "POST /acquirer/prevention-alerts/{id}/action"
      - "POST /acquirer/remediation-plans and /submit"
      - "POST /acquirer/education-assignments/{id}/complete"
    shared_operations:
      - "All GET endpoints (force-scoped to own merchant)"
      - "POST /acquirer/evidence-items and POST /acquirer/representments(+ /submit) for own chargebacks"

  - name: RiskOfficer
    description: "Acquirer risk officer: merchant suspension, reserve policy and release, program enrollment administration and exit review, remediation plan review"
    identity: opaque
    exclusive_operations:
      - "PATCH /acquirer/merchants/{id}/reserve-policy"
      - "POST /acquirer/merchants/{id}/suspend and /reinstate"
      - "POST /acquirer/reserve-accounts/{id}/release"
      - "POST /acquirer/program-enrollments and /exit-review"
      - "POST /acquirer/remediation-plans/{id}/review"
    shared_operations:
      - "All GET endpoints"

  - name: FinanceOps
    description: "Acquirer finance operator: manual fee assessment, fee waiver (segregated from the original assessor), fee settlement"
    identity: opaque
    exclusive_operations:
      - "POST /acquirer/fee-assessments (manual ARBITRATION_FEE only)"
      - "POST /acquirer/fee-assessments/{id}/waive (not for fees the same user assessed)"
      - "POST /acquirer/fee-assessments/{id}/settle"
    shared_operations:
      - "All GET endpoints"
