              captures: { o_zout: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${o_off}", full_name: "Olive Overlap", employee_code: "EMP-OV", level: "SENIOR" }
              as: PlatformAdmin
              captures: { o_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${o_off}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${o_fc}"
              captures: { o_storm: $.data.id }
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${o_off}", storm_event_id: "${o_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.01 }, { lat: 0.1, lon: 0.01 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T01:00:00Z" }
              as: Forecaster
              as_user_id: "${o_fc}"
              captures: { o_pin: $.data.id }
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${o_off}", storm_event_id: "${o_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.2 }, { lat: 0.0, lon: 0.209 }, { lat: 0.1, lon: 0.209 }, { lat: 0.1, lon: 0.2 } ] }, expires_at: "2026-09-01T01:00:00Z" }
