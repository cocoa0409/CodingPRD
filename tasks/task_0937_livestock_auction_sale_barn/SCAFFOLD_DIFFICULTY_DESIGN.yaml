            - "SaleDay.${sale_day_id}.reopen_count == 1"

  # =========================================================================
  # Rule 6 — boundary precision on DIFFERENT metrics via DIFFERENT endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bid_exactly_at_tiered_increment_boundary_is_accepted
        grounds:
          - calculations.min_next_bid
          - validations[priority=36]
          - errors[ERR_BID_BELOW_INCREMENT]
          - state_machines.Bid.WINNING_to_OUTBID
        distinguishing_aspect: |
          METRIC 1 - a MONEY threshold on POST /sale-barn/bids. With a 182.50 high in the
          100.00-500.00 increment band the minimum next bid is exactly 183.50: a bid of
          183.50 is accepted (the comparison is >=, not >), and one cent under the next
          boundary (184.49 against a 184.50 minimum) is refused.
        test_recipe:
          setup:
            - "Clock 2026-06-01T08:00:00Z; sale day BARN-1/NE in RINGING; pen 60 head; certified scale."
            - "One 10-head lot weighed 7200/200 (settle 6790) is IN_RING."
            - "Two BONDED buyers, numbers 101 and 102, each with credit_limit 50000 (effective 75000)."
            - "Buyer 101 holds the high bid at 182.50 $/cwt."
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
