            - "FundCompany.${frc_id}.company_status == SUSPENDED"

      - name: terminate_agreement_with_active_seats_blocked
        claim_type: Violation → Error
        grounds:
          - state_machines.LicenseAgreement.transitions
          - errors[ERR_SEATS_STILL_ACTIVE]
        distinguishing_aspect: "Terminating an agreement with seats_in_use > 0 fails with ERR_SEATS_STILL_ACTIVE; after revoking the seat, termination succeeds and a linked LIVE index would suspend."
        test_recipe:
          setup:
            - "Licensee LTS ACTIVE; agreement AGTS ACTIVE with 1 seat granted."
          setup_api_calls:
