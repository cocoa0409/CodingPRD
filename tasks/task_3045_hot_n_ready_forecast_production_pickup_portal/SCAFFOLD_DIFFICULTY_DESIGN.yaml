  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_existence_vs_business_temporal_on_claim
        grounds:
          - validations[priority=4]
          - validations[priority=17]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PICKUP_CODE_EXPIRED]
        distinguishing_aspect: |
          Pair state-vs-business_temporal: a claim call whose order is already
          CANCELLED (state violation) AND whose pickup_code is stale/wrong
          (temporal violation) MUST surface ERR_INVALID_STATE — priority 4
          state beats priority 17 temporal regardless of code correctness.
        test_recipe:
          setup:
            - "StoreDay 2026-09-18 opened; LUNCH daypart ACTIVE; locker slot; product PEP"
            - "Portal order paid then CANCELLED while PLACED"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-18" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/locker-slots"
              payload: { slot_number: 1 }
              as: StoreManager
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-18T11:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_pep: $.data.id }
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-4"
                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_pep}", quantity: 1, customized: false }
              as: Customer
              as_user_id: "cust-4"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "cust-4"
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "cust-4"
          trigger:
            - call: "POST /orders/${ord_id}/claim"
