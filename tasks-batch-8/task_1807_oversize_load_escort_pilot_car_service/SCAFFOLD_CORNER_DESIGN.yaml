      - name: invoice_generate_state_and_empty_gates
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_JOB_INVALID_STATE]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "generate requires DELIVERED or CANCELLED; a CANCELLED job with no fee and no completed work has nothing to bill (400)."
        test_recipe:
          setup: ["Job A BOOKED (width 170 / height 150, quoted 22500); Job B cancelled from QUOTED (fee 0)"]
          setup_api_calls:
