            - "drill flips the plan back to ACTIVE"
            - "identical slot create after the drill: status == RESERVED"

      - name: reinstate_blocked_by_active_transition_then_reversal_roundtrip
        grounds:
          - state_machines.Patient.SUSPENDED_to_ACTIVE_HOME
          - state_machines.TransitionRecord.APPROVED_to_ACTIVE
          - state_machines.TransitionRecord.ACTIVE_to_REVERSED
          - entities.TransitionRecord.fields.reversal_of_id
        distinguishing_aspect: |
          Entity pair Patient -> TransitionRecord (distinct from reservation -> plan): reinstate is
          rejected while an ACTIVE HOME_TO_CENTER transition exists; a CENTER_TO_HOME reversal then
          fails its readiness-gate re-check (machine was cascade-unassigned) and only succeeds after
          reassignment, flipping the original transition to REVERSED.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient; temporary HOME_TO_CENTER transition (2026-05-10..2026-05-20, PATIENT_CHOICE) APPROVED; clock at 2026-05-10; activated -> patient SUSPENDED and machine cascade-unassigned"
