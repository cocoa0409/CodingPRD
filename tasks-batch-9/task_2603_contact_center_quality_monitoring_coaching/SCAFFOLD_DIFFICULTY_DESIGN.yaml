            - "Interaction.${i1}.sampled_count == 0 and Interaction.${i2}.sampled_count == 0"
            - "the sweep processed the two selections in created_at ASC order (${sel1} then ${sel2}); each SampleSelection.version took exactly one bump and SamplePlan.${pl1}.version took exactly one bump for the close"
