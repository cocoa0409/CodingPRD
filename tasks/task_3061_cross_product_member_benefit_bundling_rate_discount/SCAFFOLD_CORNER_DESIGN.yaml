          assert:
            - "LoanAccount.${calc02_la_id}.discount_stack_bps == 20, because W_CLOSED's effective_to equals the clock and the window is half-open on the right"
            - "effective_from is inclusive, so W_OPEN qualifies at exactly 2026-09-01T00:00:00Z"
            - "LoanAccount.${calc02_la_id}.effective_apr_bps == 980"
            - "had W_CLOSED's window been closed on the right the stack would read 90 and the APR 910 — the boundary is not off by one"

