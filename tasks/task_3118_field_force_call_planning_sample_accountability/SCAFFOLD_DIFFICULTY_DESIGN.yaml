              payload: { to_rep_id: "${v_id}", lot_id: "${lot_id}", quantity: 0, reason_code: "REBALANCE", documentation_note: "Zero quantity transfer attempt here", expected_lot_version: "${lot_v} + 1" }
              as: FieldRep
