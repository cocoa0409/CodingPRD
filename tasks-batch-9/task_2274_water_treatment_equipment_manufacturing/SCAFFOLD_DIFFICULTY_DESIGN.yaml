              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /water-treatment/or-equal-submittals/${sub_id}/submit"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /water-treatment/or-equal-submittals/${sub_id}/engineer-decision"
              payload: { decision: "PRE_APPROVED" }
              as: EngineerOfRecord
              as_user_id: "eor-1"
            - call: "POST /water-treatment/projects/${proj_id}/bid"
              payload: { offered_price_cents: 400000000 }
              as: ContractsAdministrator
              as_user_id: "ca-1"
            - call: "POST /water-treatment/projects/${proj_id}/award"
              payload: { award_decision: "AWARDED" }
              as: ContractsAdministrator
              as_user_id: "ca-1"
            - call: "POST /water-treatment/equipment-packages/${pkg_f_id}/release-for-fabrication"
              payload: {}
              as: FabricationManager
              as_user_id: "fab-1"
            - call: "GET /water-treatment/skids"
              payload: { equipment_package_id: "${pkg_f_id}" }
              as: FabricationManager
              as_user_id: "fab-1"
              captures: { skid_f_id: "$.data[0].id" }
            - call: "POST /water-treatment/skids/${skid_f_id}/milestones"
              payload: { dimension: "MECHANICAL", to_state: "PIPING_COMPLETE" }
              as: FabricationManager
              as_user_id: "fab-1"
