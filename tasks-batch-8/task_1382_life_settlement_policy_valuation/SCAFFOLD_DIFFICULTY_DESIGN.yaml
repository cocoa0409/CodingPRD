        grounds:
          - validations[priority=10]
          - entities.StateLicense.fields.effective_date
          - entities.StateLicense.fields.expiry_date
        distinguishing_aspect: |
          Closed-interval semantics on StateLicense windows over the state_code
          resource (different resource and different semantics than the half-open
          snapshot rule): a new TX window whose effective_date equals the existing
          expiry_date TOUCHES and is rejected ERR_LICENSE_WINDOW_OVERLAP; only a
          strict gap (effective > expiry) is accepted.
        test_recipe:
          setup:
            - "Existing TX license window [2026-01-01, 2027-12-31] ACTIVE"
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin, captures: { lic1: "$.data.id" } }
          trigger:
