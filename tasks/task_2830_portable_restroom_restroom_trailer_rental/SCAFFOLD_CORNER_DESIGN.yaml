              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-FIRST" }
              as: ComplianceOfficer
              captures: { st1: $.data.status, round1: $.data.revision_round, v1: $.data.version }
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture1: $.data.site_posture }
          trigger:
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-SECOND" }
              as: ComplianceOfficer
              captures: { replay_error: $.data.error_id }
            - call: "GET /placement-permits/${permit_id}"
