            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-30T00:00:00Z" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/licenses/${lic_id}/transfer-applications"
              payload: { transfer_type: "FULL_ASSIGNMENT", transferee_applicant_id: "${t2_id}" }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { ta2_id: "$.data.id", ta2_uje: "$.data.unjust_enrichment_cents" }
          assert:
            - "ta1_uje == 7710000 (2031-09-29 is grant+1824 days: years_elapsed 4 -> 20% of 38,550,000)"
            - "ta2_uje == 0 (2031-09-30 is grant+1825 days: years_elapsed 5 -> schedule bucket 0)"
            - "TransferApplication.${ta1_id}.status == WITHDRAWN; TransferApplication.${ta2_id}.status == FILED"
            - "License.${lic_id}.credit_amount_cents == 38550000 is the shared basis of both computations"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: settlement_blocked_until_incumbents_cleared
        grounds:
          - state_machines.License.PENDING_PAYMENT_to_ACTIVE
          - entities.Incumbent.fields.status
          - errors[ERR_INCUMBENTS_NOT_CLEARED]
        distinguishing_aspect: |
          Pair License x Incumbent: the settlement payment that would activate the license is
          rejected while the area's incumbent is NOTIFIED; the identical payment succeeds once
          the incumbent reaches RELOCATING (a state of a DIFFERENT entity gates the transition).
        test_recipe:
          setup:
            - "Rural applicant wins CATEGORY_A@PEA002 (net 212,500,000); license PENDING_PAYMENT; incumbent KOLD940 in area PEA002 is NOTIFIED"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_y
            - *c_block_a
            - *c_publish
            - *c_auction
            - *c_open
            - *c_applicant_rural
            - *c_upfront_rural
            - *c_review_rural
            - *c_qualify_rural
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - *c_get_rounds
            - *c_bid_rural_a_y
            - *c_close_r1
            - call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", amount_cents: 0 }
              as: Bidder
              as_user_id: "${r_id}"
            - *c_complete
            - call: "GET /spectrum-auctions/licenses"
              payload: { holder_applicant_id: "${r_id}" }
              as: AuctionAdmin
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /spectrum-auctions/incumbents"
              payload: { band_plan_id: "${plan_id}", area_id: "${area_y_id}", callsign: "KOLD940", relocation_cost_cents: 5000000 }
              as: AuctionAdmin
              captures: { inc_id: "$.data.id" }
          trigger:
            - call: "POST /spectrum-auctions/licenses/${lic_id}/settlement-payments"
              payload: { amount_cents: 212500000 }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { pay_err: "$.data.error_id" }
            - call: "POST /spectrum-auctions/incumbents/${inc_id}/transition"
              payload: { action: "SUBMIT_PLAN" }
              as: IncumbentOperator
              as_user_id: "${inc_id}"
            - call: "POST /spectrum-auctions/incumbents/${inc_id}/transition"
              payload: { action: "BEGIN_RELOCATION", transition_window_start: "2026-10-05T00:00:00Z", transition_window_end: "2026-11-05T00:00:00Z" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/licenses/${lic_id}/settlement-payments"
              payload: { amount_cents: 212500000 }
              as: Bidder
              as_user_id: "${r_id}"
          assert:
            - "pay_err == ERR_INCUMBENTS_NOT_CLEARED (incumbent NOTIFIED blocks settlement)"
            - "after SUBMIT_PLAN + BEGIN_RELOCATION the incumbent is RELOCATING, which does NOT block"
            - "the retried payment succeeds: License.${lic_id}.status == ACTIVE, paid_cents == 212500000"
            - "License.${lic_id}.grant_date == 2026-09-16T00:00:00Z (the clock read 2026-09-16 when the payment landed; grant time is the clock at payment, not at license creation)"
            - "two BuildoutMilestones exist for the license (INTERIM and FINAL, both PENDING)"

      - name: bid_gated_on_applicant_qualified
        grounds:
          - state_machines.Applicant
          - endpoints.POST_/spectrum-auctions/rounds/{id}/bids
          - errors[ERR_APPLICANT_INVALID_STATE]
        distinguishing_aspect: |
          Pair Bid x Applicant: bid placement requires the BIDDER's Applicant record to be
          QUALIFIED — U (SUBMITTED, fully paid) is rejected while V (QUALIFIED, same auction)
          can bid in the same round. A different entity pair than License x Incumbent.
        test_recipe:
          setup:
            - "Area PEA001 / CATEGORY_A; U exists SUBMITTED with upfront paid (12,500,000 units); V is QUALIFIED (so START_CLOCK is legal); auction CLOCK_ACTIVE, round 1 OPEN"
          setup_api_calls:
