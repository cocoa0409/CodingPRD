  - rule_id: boundary_precision_check
    instances:

      - name: freight_waiver_exact_threshold_on_pricing_preview
        grounds:
          - calculations.order_total_assembly.constants.FREIGHT_WAIVER_SUBTOTAL_CENTS
          - endpoints[GET /pro/pro-orders/{pro_order_id}/pricing-preview]
          - entities.ProOrder.fields.freight_surcharge_cents
        distinguishing_aspect: |
          Metric = a money threshold (subtotal_cents vs FREIGHT_WAIVER_SUBTOTAL_CENTS 250000), probed on
          the read-only GET pricing-preview endpoint. A MEMBER account buying MORTAR-BAG at list 2000
          lands on 250000 exactly at 125 units (waiver applies, inclusive) and on 248000 at 124 units
          (surcharge 8900 applies), so the boundary is exercised at threshold and threshold-minus-one-step
          without persisting anything.
        test_recipe:
          setup:
            - "Store HD-101 (IL, tax 0.0825) stocking MORTAR-BAG at list 2000 with 600 on hand."
            - "A MEMBER account (baseline 0, so tier_discount_pct 0.00 and effective unit price == list)."
            - "Two DRAFT delivery orders without lift gate: one with 125 units, one with 124 units."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_main_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "MORTAR-BAG", on_hand_units: 600, list_unit_price_cents: 2000 }
              as: PlatformAdmin
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Corner Handyman", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 0 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "DELIVERY", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_at_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_at_id}/lines"
              payload: { sku: "MORTAR-BAG", qty_units: 125 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "DELIVERY", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_below_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_below_id}/lines"
              payload: { sku: "MORTAR-BAG", qty_units: 124 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /pro/pro-orders/${order_at_id}/pricing-preview"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { at_sub: "$.data.subtotal_cents", at_freight: "$.data.freight_surcharge_cents", at_tax: "$.data.tax_cents", at_total: "$.data.total_cents" }
            - call: "GET /pro/pro-orders/${order_below_id}/pricing-preview"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { below_sub: "$.data.subtotal_cents", below_freight: "$.data.freight_surcharge_cents", below_tax: "$.data.tax_cents", below_total: "$.data.total_cents" }
          assert:
            - "${at_sub} == 250000"
            - "${at_freight} == 0"
            - "${at_tax} == 20625"
            - "${at_total} == 270625"
            - "${below_sub} == 248000"
            - "${below_freight} == 8900"
            - "${below_tax} == 21194"
            - "${below_total} == 278094"
            - "ProOrder.${order_at_id}.fulfillment_status == DRAFT"
            - "ProOrder.${order_at_id}.total_cents == null (preview persisted nothing)"

      - name: empty_sourcing_candidate_set_on_reserve
        grounds:
          - calculations.multi_store_sourcing_allocation
          - validations[priority=42]
          - validations[priority=43]
          - endpoints[POST /pro/pro-orders/{pro_order_id}/reserve]
          - entities.StoreStock.fields.available_units
        distinguishing_aspect: |
          A different metric on a different endpoint: the boundary is the *cardinality* of the sourcing
          candidate set (1 versus 0), probed on POST /pro/pro-orders/{pro_order_id}/reserve. With
          available_units == 1 the candidate set is non-empty and the shortfall reports
          ERR_INSUFFICIENT_JOB_LOT (409); with available_units == 0 the same shortfall reports
          ERR_NO_SOURCING_CANDIDATES (409). One unit of stock changes which rule owns the failure.
        test_recipe:
          setup:
            - "A single store HD-101 in region MIDWEST stocking TRIM-PACK at list 1000 with only 3 units on hand."
            - "A MEMBER account with three orders: order A for 2 units (reserved), order B for 3 units (submitted, never reservable), order C for 1 unit."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_main_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "TRIM-PACK", on_hand_units: 3, list_unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { stock_trim_id: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Corner Handyman", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 0 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "WILL_CALL", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_a_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_a_id}/lines"
              payload: { sku: "TRIM-PACK", qty_units: 2 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders/${order_a_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders/${order_a_id}/reserve"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "assoc-1"
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "WILL_CALL", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_b_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_b_id}/lines"
              payload: { sku: "TRIM-PACK", qty_units: 3 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders/${order_b_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "WILL_CALL", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_c_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_c_id}/lines"
              payload: { sku: "TRIM-PACK", qty_units: 1 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders/${order_c_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /pro/pro-orders/${order_b_id}/reserve"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "assoc-1"
              captures: { err_one_left: "$.data.error_id" }
            - call: "POST /pro/pro-orders/${order_c_id}/reserve"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "assoc-1"
            - call: "POST /pro/pro-orders/${order_b_id}/reserve"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "assoc-1"
              captures: { err_none_left: "$.data.error_id" }
          assert:
            - "${err_one_left} == ERR_INSUFFICIENT_JOB_LOT"
            - "${err_none_left} == ERR_NO_SOURCING_CANDIDATES"
            - "StoreStock.${stock_trim_id}.on_hand_units == 3"
            - "StoreStock.${stock_trim_id}.reserved_units == 3"
