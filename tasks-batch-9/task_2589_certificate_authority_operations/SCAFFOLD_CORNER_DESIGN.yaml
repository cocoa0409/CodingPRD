            - "KeyCeremony.${cer_id}.state is still WITNESSED with witness_count == 2, attested_at null and attested_by_user_id null"
            - "HsmPartition.${part_id}.attested_ceremony_count == 0 at that point"
            - "the third trigger returns HTTP 200 with ${attested_state} == ATTESTED and ${attestation_expiry} == 2026-09-30T00:30:00Z"
            - "HsmPartition.${part_id}.attested_ceremony_count == 1 afterwards"

  - section: rbac
    instances:
      - name: every_roles_exclusive_write_is_denied_to_the_other_five_roles
        claim_type: denials
        grounds:
          - roles[POLICY_ADMIN].exclusive_operations
          - roles[VALIDATION_OFFICER].exclusive_operations
          - roles[VETTING_APPROVER].exclusive_operations
          - roles[ISSUANCE_OPERATOR].exclusive_operations
          - roles[REVOCATION_OFFICER].exclusive_operations
          - roles[COMPLIANCE_AUDITOR].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=4]
        distinguishing_aspect: "peer_roles model: no role is a superset of another, so POLICY_ADMIN is refused on ceremony scheduling, CRL publication and audit creation exactly as VALIDATION_OFFICER is refused on profile creation. Every denial is HTTP 403 ERR_UNAUTHORIZED and leaves no row and no counter change, and the role check at priority 4 fires before any entity-state or payload check."
        test_recipe:
          setup:
            - "One DRAFT profile, one subscriber with one PENDING vetting, and one HSM partition — enough for each denied call to address a real row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/certificate-profiles"
              payload: { name: "rbac-denials", validation_type: "OV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 30, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
