              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { status_after: $.data.status, activated_at: $.data.activated_at, version_after: $.data.version, level_after: $.data.required_vetting_level }
            - call: "POST /ca/certificate-profiles/7c9e6679-0000-4000-8000-000000000000/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { err_profile_missing: $.data.error_id }
