      - name: cost_share_enrollment_requires_vendor_invoice_only_for_grants
        claim_type: Conditional validation
        grounds:
          - validations.priority_32
          - errors[ERR_MISSING_VENDOR_INVOICE]
          - entities.SupportEnrollment.fields.vendor_invoice_cents
        distinguishing_aspect: |
          vendor_invoice_cents is declared OPTIONAL on the endpoint, so its absence is not a generic 400:
          it becomes mandatory only when the target program's program_type is COST_SHARE_GRANT, yielding
          422 ERR_MISSING_VENDOR_INVOICE, while the identical payload against a CHIPPER_DAY program is
          admitted with award_cents left null.
        test_recipe:
          setup:
            - "Active cycle; one COST_SHARE_GRANT program (budget 500000, 2 slots) and one CHIPPER_DAY program (budget 0, 2 slots), both open across the clock 2026-08-01T00:00:00Z; one HIGH-risk parcel with owner_hardship_flag false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
