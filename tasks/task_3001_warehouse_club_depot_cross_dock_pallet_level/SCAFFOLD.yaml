scenario: |
  Warehouse Club Depot Cross-Dock & Pallet-Level Replenishment (Costco Wholesale): item pallet-quantity design constrained by case pack, pallet footprint and club floor slots, depot cross-dock scheduling where vendor pallets are received and reallocated to clubs within the same day, club allocation driven by membership demographics and velocity with no backroom overflow capacity, treasure-hunt one-time-buy items with sell-through-or-markdown decisions and no reorder, vendor delivery appointment compliance with unload fee and chargeback assessment, member limit enforcement and per-membership purchase caps on constrained items, ancillary business linkage across gas, pharmacy and optical departments, item deletion review with member complaint weighting

domain_name: warehouse-club-crossdock
api_prefix: /wcd

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# NOTE for all list endpoints: default sort is created_at ASC; no tie-break on
# id is ever used for business decisions (identity only).

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable region name"
      - name: code
        type: string
        source: input
        description: "Two-to-four-letter region code, uppercase"
        constraints: "Matches ^[A-Z]{2,4}$; unique"
      - name: avg_member_income_cents
        type: integer
        source: input
        description: "Average member household income in cents, feeds allocation weighting"
        constraints: ">= 0"

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Vendor legal name"
      - name: vendor_code
        type: string
        source: input
        description: "Unique vendor code"
        constraints: "Matches ^V[0-9]{6}$; unique"
      - name: status
        type: enum
        source: system
        description: "Vendor lifecycle status"
        constraints: "ACTIVE | SUSPENDED | DEACTIVATED"
        default: ACTIVE
      - name: compliance_score_bp
        type: integer
        source: computed
        description: "Rolling compliance score in basis points (10000 = perfect), derived from CONFIRMED chargebacks with 30-day bucket decay"
        default: 10000
      - name: total_chargeback_cents
        type: integer
        source: computed
        description: "Cumulative amount of CONFIRMED chargebacks in cents"
        default: 0

  - name: Club
    parent: null
    common_fields: true
    fields:
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id; owning region"
      - name: name
        type: string
        source: input
        description: "Club name"
      - name: club_number
        type: integer
        source: input
        description: "Club number"
        constraints: "Positive integer; unique"
      - name: floor_slot_capacity
        type: integer
        source: input
        description: "Total number of pallet floor slots on the sales floor; no backroom overflow exists"
        constraints: ">= 1"
      - name: member_base
        type: integer
        source: input
        description: "Active membership count for this club"
        constraints: ">= 0"
      - name: posture
        type: enum
        source: computed
        description: "Derived operating posture gating allocations"
        constraints: "NORMAL | CONSTRAINED | FROZEN"
        default: NORMAL
      - name: allocated_slot_count
        type: integer
        source: computed
        description: "Sum of floor_slots_reserved over Allocations for this club with status IN {PROPOSED, COMMITTED}"
        default: 0
      - name: ancillary_flags
        type: object
        source: input
        description: "Per-club ancillary department flags: { gas: bool, pharmacy: bool, optical: bool }"
        default: { gas: false, pharmacy: false, optical: false }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; supplying vendor"
      - name: sku
        type: string
        source: input
        description: "Item SKU"
        constraints: "Matches ^[0-9]{7}$; unique"
      - name: description
        type: string
        source: input
        description: "Item description"
      - name: case_pack_qty
        type: integer
        source: input
        description: "Selling units per case"
        constraints: ">= 1"
      - name: pallet_length_in
        type: number
        source: input
        description: "Pallet footprint length in inches"
        constraints: "> 0"
      - name: pallet_width_in
        type: number
        source: input
        description: "Pallet footprint width in inches"
        constraints: "> 0"
      - name: cases_per_layer
        type: integer
        source: input
        description: "Cases that fit in one pallet layer"
        constraints: ">= 1"
      - name: max_layers
        type: integer
        source: input
        description: "Maximum stackable layers per pallet"
        constraints: ">= 1"
      - name: item_type
        type: enum
        source: input
        description: "Regular replenishable vs treasure-hunt one-time-buy"
        constraints: "REGULAR | TREASURE_HUNT"
      - name: status
        type: enum
        source: system
        description: "Item lifecycle"
        constraints: "DRAFT | ACTIVE | DELETION_REVIEW | DISCONTINUED"
        default: DRAFT
      - name: pallet_qty_units
        type: integer
        source: computed
        description: "Units per pallet = case_pack_qty * cases_per_layer * max_layers"
      - name: pallets_per_slot
        type: integer
        source: computed
        description: "Floor slots consumed per pallet; 1 unless footprint exceeds the 48x40 standard slot, in which case 2"
      - name: member_purchase_cap
        type: integer
        source: input
        description: "Per-membership purchase cap (units) per cap window; 0 means uncapped"
        constraints: ">= 0"
        default: 0
      - name: sell_through_target_pct
        type: integer
        source: input
        description: "Treasure-hunt sell-through percentage that must be reached by the exit window to allow SELL_THROUGH"
        constraints: "0 < value <= 100"
        default: 80
      - name: exit_window_date
        type: string
        source: input
        description: "Treasure-hunt exit window date YYYY-MM-DD; mandatory markdown evaluation date"
        constraints: "Required iff item_type == TREASURE_HUNT"
      - name: complaint_weighted_score
        type: number
        source: computed
        description: "Deletion-review weighted member complaint score over OPEN complaints in trailing 30 days"
        default: 0
      - name: complaint_count
        type: integer
        source: computed
        description: "Count of OPEN complaints in the trailing-30-day window for this item"
        default: 0

  - name: Depot
    parent: null
    common_fields: true
    fields:
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id; region the depot serves"
      - name: name
        type: string
        source: input
        description: "Depot name"
      - name: dock_count
        type: integer
        source: input
        description: "Number of receiving dock doors"
        constraints: ">= 1"
      - name: dock_hours_open
        type: string
        source: input
        description: "Daily dock open time, HH:MM 24h"
        constraints: "Matches ^([01][0-9]|2[0-3]):[0-5][0-9]$"
      - name: dock_hours_close
        type: string
        source: input
        description: "Daily dock close time, HH:MM 24h"
        constraints: "Matches ^([01][0-9]|2[0-3]):[0-5][0-9]$; close > open"
      - name: slot_length_minutes
        type: integer
        source: input
        description: "Granularity of bookable appointment windows in minutes"
        constraints: "Divisor of 60; >= 15"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: depot_id
        type: string
        source: input
        description: "FK -> Depot.id; depot where the delivery is booked"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; delivering vendor"
      - name: delivery_date
        type: string
        source: input
        description: "Delivery date, YYYY-MM-DD"
        constraints: "On or after the current logical date"
      - name: start_time
        type: string
        source: input
        description: "Window start, HH:MM"
        constraints: "Within depot dock hours; start aligned to depot.slot_length_minutes measured from dock_hours_open"
      - name: end_time
        type: string
        source: input
        description: "Window end, HH:MM (half-open [start_time, end_time))"
        constraints: "end_time > start_time; aligned to depot.slot_length_minutes"
      - name: pallet_count
        type: integer
        source: input
        description: "Number of pallets to be unloaded"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Appointment lifecycle"
        constraints: "BOOKED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED"
        default: BOOKED
      - name: checked_in_at
        type: datetime
        source: system
        description: "Timestamp of driver check-in, if any"
      - name: unload_fee_cents
        type: integer
        source: computed
        description: "Computed unload fee charged to vendor at completion"
        default: 0
      - name: chargeback_cents
        type: integer
        source: computed
        description: "Total chargebacks assessed on this appointment"
        default: 0

  - name: Pallet
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; appointment the pallet arrived on"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; item carried on the pallet"
      - name: unit_qty
        type: integer
        source: input
        description: "Units physically on the pallet; must equal item.pallet_qty_units at receipt"
        constraints: ">= 1"
      - name: received_at
        type: datetime
        source: system
        description: "Timestamp the pallet was received at depot"
      - name: received_date
        type: string
        source: system
        description: "Logical delivery date of receipt, YYYY-MM-DD; same-day cross-dock compares against this"
      - name: status
        type: enum
        source: system
        description: "Pallet lifecycle"
        constraints: "RECEIVED | ALLOCATED | SHIPPED | STRANDED | RECONCILED"
        default: RECEIVED

  - name: CrossDockRun
    parent: null
    common_fields: true
    fields:
      - name: depot_id
        type: string
        source: input
        description: "FK -> Depot.id; depot executing the run"
      - name: run_date
        type: string
        source: input
        description: "Logical date the run reallocates pallets for, YYYY-MM-DD"
      - name: cutoff_time
        type: string
        source: input
        description: "Commit cutoff time on run_date, HH:MM; allocations may be added only while OPEN and at/before cutoff"
        constraints: "Matches ^([01][0-9]|2[0-3]):[0-5][0-9]$"
      - name: status
        type: enum
        source: system
        description: "Run lifecycle"
        constraints: "OPEN | COMMITTED | CANCELLED"
        default: OPEN
      - name: committed_at
        type: datetime
        source: system
        description: "When the run was committed"

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - name: cross_dock_run_id
        type: string
        source: input
        description: "FK -> CrossDockRun.id; run this allocation belongs to"
      - name: pallet_id
        type: string
        source: input
        description: "FK -> Pallet.id; pallet being reallocated"
      - name: club_id
        type: string
        source: input
        description: "FK -> Club.id; destination club"
      - name: allocation_score
        type: number
        source: computed
        description: "Demographics-and-velocity priority score computed at allocation time"
      - name: floor_slots_reserved
        type: integer
        source: computed
        description: "Floor slots consumed at destination club for this pallet (= item.pallets_per_slot)"
      - name: run_version
        type: integer
        source: computed
        description: "The parent CrossDockRun.version after this allocation was applied (OCC echo so clients can chain allocations without re-reading the run)"
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle"
        constraints: "PROPOSED | COMMITTED | SHIPPED | VOIDED"
        default: PROPOSED
      - name: void_reason
        type: string
        source: input
        description: "Reason recorded when voided"
        default: ""

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: club_id
        type: string
        source: input
        description: "FK -> Club.id; home club"
      - name: membership_number
        type: string
        source: input
        description: "Membership number"
        constraints: "Matches ^M[0-9]{9}$; unique"
      - name: tier
        type: enum
        source: input
        description: "Membership tier"
        constraints: "GOLD_STAR | EXECUTIVE"
      - name: household_size
        type: integer
        source: input
        description: "Members in household; feeds complaint weighting"
        constraints: ">= 1"
        default: 1
      - name: status
        type: enum
        source: system
        description: "Membership status"
        constraints: "ACTIVE | SUSPENDED"
        default: ACTIVE

  - name: Purchase
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; purchasing member"
      - name: club_id
        type: string
        source: input
        description: "FK -> Club.id; club of purchase"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; purchased item"
      - name: unit_qty
        type: integer
        source: input
        description: "Units purchased"
        constraints: ">= 1"
      - name: purchased_at
        type: datetime
        source: system
        description: "Logical timestamp of purchase"
      - name: cap_window
        type: string
        source: system
        description: "Cap window key = logical date of purchase, YYYY-MM-DD (per-day cap windows)"
      - name: status
        type: enum
        source: system
        description: "Purchase lifecycle; refund reverses cap usage"
        constraints: "COMPLETED | REFUNDED"
        default: COMPLETED

  - name: MarkdownDecision
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; treasure-hunt item under decision"
      - name: decision
        type: enum
        source: input
        description: "Sell-through-or-markdown outcome"
        constraints: "SELL_THROUGH | MARKDOWN"
      - name: markdown_pct
        type: integer
        source: input
        description: "Markdown percentage; required iff decision == MARKDOWN"
        constraints: "0 < value < 100 when present"
      - name: note
        type: string
        source: input
        description: "Free-text note"
        default: ""
      - name: sell_through_pct
        type: integer
        source: computed
        description: "Sell-through percentage recomputed at decision time"
      - name: decided_by_role
        type: string
        source: system
        description: "Role recorded at decision time"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical timestamp of decision"

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; complaining member"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; item complained about"
      - name: category
        type: enum
        source: input
        description: "Complaint category"
        constraints: "QUALITY | AVAILABILITY | PRICING | SAFETY"
      - name: created_on
        type: string
        source: system
        description: "Logical creation date YYYY-MM-DD"
      - name: weight
        type: number
        source: computed
        description: "Per-complaint weight = category_weight * household_size, frozen at creation"
      - name: status
        type: enum
        source: system
        description: "Complaint lifecycle"
        constraints: "OPEN | RESOLVED"
        default: OPEN

  - name: Chargeback
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; assessed vendor"
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; originating appointment"
      - name: amount_cents
        type: integer
        source: computed
        description: "Assessed chargeback amount; always positive"
      - name: reason
        type: enum
        source: input
        description: "Violation reason"
        constraints: "LATE_CHECKIN | NO_SHOW | OVER_PALLET_COUNT"
      - name: status
        type: enum
        source: system
        description: "Chargeback lifecycle"
        constraints: "ASSESSED | APPEALED | WAIVED | CONFIRMED"
        default: ASSESSED
      - name: assessed_at
        type: datetime
        source: system
        description: "Logical timestamp of assessment"

  - name: DepartmentSale
    parent: null
    common_fields: true
    fields:
      - name: club_id
        type: string
        source: input
        description: "FK -> Club.id; club where the ancillary sale occurred"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; member purchasing ancillary service"
      - name: department
        type: enum
        source: input
        description: "Ancillary department"
        constraints: "GAS | PHARMACY | OPTICAL"
      - name: amount_cents
        type: integer
        source: input
        description: "Sale amount in cents"
        constraints: ">= 1"
      - name: sold_on
        type: string
        source: system
        description: "Logical sale date YYYY-MM-DD"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Item
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /wcd/items/{id}/activate"
        actor: CategoryManager
        preconditions:
          - "item.status == DRAFT"
          - "item.case_pack_qty >= 1 AND item.cases_per_layer >= 1 AND item.max_layers >= 1"
        side_effects:
          - "recompute item.pallet_qty_units and item.pallets_per_slot"
      - from: ACTIVE
        to: DELETION_REVIEW
        trigger: "POST /wcd/items/{id}/request-deletion (no decision field)"
        actor: CategoryManager
        preconditions:
          - "item.status == ACTIVE"
        side_effects:
          - "recompute item.complaint_weighted_score and complaint_count from OPEN complaints in trailing 30 days"
      - from: DELETION_REVIEW
        to: ACTIVE
        trigger: "POST /wcd/items/{id}/request-deletion with decision=REJECT (cycle back)"
        actor: CategoryManager
        preconditions:
          - "item.status == DELETION_REVIEW"
        side_effects:
          - "no field mutations; updated_at/version bump only"
      - from: DELETION_REVIEW
        to: DISCONTINUED
        trigger: "POST /wcd/items/{id}/request-deletion with decision=APPROVE"
        actor: CategoryManager
        preconditions:
          - "item.status == DELETION_REVIEW"
          - "item.complaint_weighted_score >= COMPLAINT_DISCONTINUE_THRESHOLD (25.0), else ERR_REFERENTIAL_GUARD"
        side_effects:
          - "all Pallet with item_id == item.id and status IN {RECEIVED, ALLOCATED} become STRANDED"
          - "that pallet mutation cascades: each Allocation with status == PROPOSED for those pallets becomes VOIDED with void_reason='ITEM_DISCONTINUED'"
          - "each void cascades: club.allocated_slot_count decremented by allocation.floor_slots_reserved and club.posture recomputed"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /wcd/items/{id}/discontinue (direct path for TREASURE_HUNT only)"
        actor: CategoryManager
        preconditions:
          - "item.status == ACTIVE"
          - "item.item_type == TREASURE_HUNT"
          - "a MarkdownDecision with decision == MARKDOWN exists for this item, else ERR_REFERENTIAL_GUARD"
        side_effects:
          - "Pallet rows in {RECEIVED, ALLOCATED} for this item become STRANDED"
          - "their PROPOSED Allocations become VOIDED (void_reason='ITEM_DISCONTINUED')"
          - "club slot counts and postures recomputed"

  - entity: Appointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /wcd/appointments/{id}/check-in"
        actor: DepotManager
        preconditions:
          - "appointment.status == BOOKED"
          - "current logical date == appointment.delivery_date"
          - "current logical time <= appointment.end_time, else ERR_APPOINTMENT_CONFLICT"
        side_effects:
          - "set appointment.checked_in_at to current logical timestamp"
          - "if checked_in_at time > appointment.start_time + LATE_GRACE_MINUTES (15) then create Chargeback(reason=LATE_CHECKIN, status=ASSESSED) and add its amount to appointment.chargeback_cents"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system auto-transition fired by POST /wcd/_clock/set_current_utc advancing the logical clock past appointment.delivery_date end-of-day with no check-in"
        actor: system
        preconditions:
          - "appointment.status == BOOKED"
          - "current logical timestamp > appointment.delivery_date 23:59:59"
        side_effects:
          - "create Chargeback(reason=NO_SHOW, status=ASSESSED) and add its amount to appointment.chargeback_cents"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /wcd/appointments/{id}/cancel"
        actor: VendorRep
        preconditions:
          - "appointment.status == BOOKED"
          - "acting vendor rep's vendor_id == appointment.vendor_id, else ERR_FORBIDDEN"
          - "current logical datetime < appointment.delivery_date at appointment.start_time"
        side_effects:
          - "no chargeback; dock window freed"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /wcd/appointments/{id}/complete"
        actor: DepotManager
        preconditions:
          - "appointment.status == CHECKED_IN"
          - "count of Pallet rows with appointment_id == appointment.id equals appointment.pallet_count, else ERR_INVALID_STATE"
        side_effects:
          - "compute and set appointment.unload_fee_cents (unload_fee_assessment)"
          - "if received pallet count > appointment.pallet_count then create Chargeback(reason=OVER_PALLET_COUNT, status=ASSESSED)"

  - entity: Pallet
    initial_state: RECEIVED
    terminal_states: [SHIPPED, RECONCILED]
    transitions:
      - from: RECEIVED
        to: ALLOCATED
        trigger: "POST /wcd/cross-dock-runs/{run_id}/allocations (allocation references this pallet)"
        actor: DepotPlanner
        preconditions:
          - "pallet.status == RECEIVED"
          - "pallet.received_date == cross_dock_run.run_date (same-day cross-dock only), else ERR_SAME_DAY_ONLY"
        side_effects:
          - "allocation row created with status PROPOSED"
          - "club.allocated_slot_count increased by allocation.floor_slots_reserved"
          - "club.posture recomputed"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /wcd/cross-dock-runs/{run_id}/commit (commit ships all committed allocations)"
        actor: DepotPlanner
        preconditions:
          - "allocation.status == COMMITTED (second phase of commit)"
        side_effects: []
      - from: ALLOCATED
        to: RECEIVED
        trigger: "POST /wcd/allocations/{id}/void OR run cancel (allocation voided, pallet freed)"
        actor: DepotPlanner
        preconditions:
          - "the pallet's only non-terminal allocation transitioned PROPOSED -> VOIDED"
        side_effects: []
      - from: RECEIVED
        to: STRANDED
        trigger: "system auto-transition fired by POST /wcd/_clock/set_current_utc when current logical date > pallet.received_date and pallet still RECEIVED"
        actor: system
        preconditions:
          - "pallet.status == RECEIVED"
          - "current logical date > pallet.received_date"
        side_effects: []
      - from: RECEIVED
        to: STRANDED
        trigger: "item discontinue cascade (item DISCONTINUED strands its unshipped pallets)"
        actor: system
        preconditions:
          - "pallet.status IN {RECEIVED, ALLOCATED}"
          - "pallet's item transitioned to DISCONTINUED"
        side_effects:
          - "if pallet was ALLOCATED, its PROPOSED allocation becomes VOIDED first (see Allocation machine)"
      - from: STRANDED
        to: RECONCILED
        trigger: "POST /wcd/pallets/{id}/reconcile"
        actor: DepotManager
        preconditions:
          - "pallet.status == STRANDED"
        side_effects:
          - "no inventory restored; audit only"

  - entity: Allocation
    initial_state: PROPOSED
    terminal_states: [SHIPPED, VOIDED]
    transitions:
      - from: PROPOSED
        to: COMMITTED
        trigger: "POST /wcd/cross-dock-runs/{run_id}/commit (phase 1)"
        actor: DepotPlanner
        preconditions:
          - "allocation.status == PROPOSED"
          - "destination club.posture != FROZEN, else whole commit fails with ERR_CLUB_FROZEN and no allocation transitions"
        side_effects:
          - "club slot reservation locked"
      - from: COMMITTED
        to: SHIPPED
        trigger: "POST /wcd/cross-dock-runs/{run_id}/commit (phase 2, after all PROPOSED->COMMITTED succeed)"
        actor: DepotPlanner
        preconditions:
          - "allocation.status == COMMITTED"
        side_effects:
          - "pallet.status: ALLOCATED -> SHIPPED"
      - from: PROPOSED
        to: VOIDED
        trigger: "POST /wcd/allocations/{id}/void OR run cancel OR item discontinue cascade"
        actor: DepotPlanner
        preconditions:
          - "allocation.status == PROPOSED"
        side_effects:
          - "club.allocated_slot_count decreased by allocation.floor_slots_reserved"
          - "club.posture recomputed"
          - "pallet.status: ALLOCATED -> RECEIVED (pallet freed for re-allocation) unless the void came from the item discontinue cascade, in which case the pallet becomes STRANDED"

  - entity: CrossDockRun
    initial_state: OPEN
    terminal_states: [COMMITTED, CANCELLED]
    transitions:
      - from: OPEN
        to: COMMITTED
        trigger: "POST /wcd/cross-dock-runs/{run_id}/commit"
        actor: DepotPlanner
        preconditions:
          - "run.status == OPEN"
          - "current logical time on run_date <= run.cutoff_time (equality allowed), else ERR_CUTOFF_PASSED"
          - "every PROPOSED allocation's destination club.posture != FROZEN, else whole commit fails atomically with ERR_CLUB_FROZEN"
        side_effects:
          - "phase 1: all PROPOSED allocations -> COMMITTED"
          - "phase 2: all COMMITTED allocations -> SHIPPED (in allocation_score DESC, created_at ASC order); their pallets ALLOCATED -> SHIPPED"
          - "set committed_at; increments CrossDockRun.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /wcd/cross-dock-runs/{run_id}/cancel"
        actor: DepotPlanner
        preconditions:
          - "run.status == OPEN"
        side_effects:
          - "all PROPOSED allocations -> VOIDED (void_reason='RUN_CANCELLED')"
          - "their pallets ALLOCATED -> RECEIVED"
          - "club slot counts decremented; postures recomputed"

  - entity: Purchase
    initial_state: COMPLETED
    terminal_states: [REFUNDED]
    transitions:
      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /wcd/purchases/{id}/refund"
        actor: MembershipDesk
        preconditions:
          - "purchase.status == COMPLETED"
        side_effects:
          - "member per-item cap usage for purchase.cap_window reduced by purchase.unit_qty (refunded purchases are excluded from member_cap_check)"

  - entity: Chargeback
    initial_state: ASSESSED
    terminal_states: [CONFIRMED, WAIVED]
    transitions:
      - from: ASSESSED
        to: APPEALED
        trigger: "POST /wcd/chargebacks/{id}/appeal"
        actor: VendorRep
        preconditions:
          - "chargeback.status == ASSESSED"
          - "acting vendor rep's vendor_id == chargeback.vendor_id, else ERR_FORBIDDEN"
        side_effects: []
      - from: APPEALED
        to: CONFIRMED
        trigger: "POST /wcd/chargebacks/{id}/resolve with outcome=CONFIRM"
        actor: DepotManager
        preconditions:
          - "chargeback.status == APPEALED"
        side_effects:
          - "vendor.total_chargeback_cents increased by chargeback.amount_cents"
          - "vendor.compliance_score_bp recomputed (vendor_compliance_score)"
          - "if vendor.compliance_score_bp < COMPLIANCE_SUSPEND_THRESHOLD_BP (8500) and vendor.status == ACTIVE then vendor.status -> SUSPENDED"
      - from: APPEALED
        to: WAIVED
        trigger: "POST /wcd/chargebacks/{id}/resolve with outcome=WAIVE"
        actor: DepotManager
        preconditions:
          - "chargeback.status == APPEALED"
        side_effects:
          - "vendor.compliance_score_bp recomputed (waived chargebacks never counted)"
      - from: ASSESSED
        to: CONFIRMED
        trigger: "system auto-confirm fired by POST /wcd/_clock/set_current_utc when current logical date > assessed_at date + APPEAL_WINDOW_DAYS (7) and never appealed"
        actor: system
        preconditions:
          - "chargeback.status == ASSESSED"
          - "current logical date > chargeback.assessed_at date + 7 days"
        side_effects:
          - "vendor.total_chargeback_cents increased"
          - "vendor.compliance_score_bp recomputed"
          - "possible vendor ACTIVE -> SUSPENDED cascade as above"

  - entity: Club
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: CONSTRAINED
        trigger: "system posture recompute (after allocation create/void/commit) when allocated_slot_count > floor( floor_slot_capacity * 80 / 100 )"
        actor: system
        preconditions: []
        side_effects:
          - "subsequent allocations to this club while CONSTRAINED require regional_ops_approved: true on the create payload, else ERR_SAFETY_GATE"
      - from: CONSTRAINED
        to: NORMAL
        trigger: "system posture recompute when allocated_slot_count <= floor( floor_slot_capacity * 80 / 100 )"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONSTRAINED
        to: FROZEN
        trigger: "system posture recompute when allocated_slot_count >= floor_slot_capacity"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: CONSTRAINED
        trigger: "system posture recompute when floor( capacity * 80 / 100 ) < allocated_slot_count < floor_slot_capacity"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: NORMAL
        trigger: "system posture recompute when allocated_slot_count <= floor( capacity * 80 / 100 )"
        actor: system
        preconditions: []
        side_effects: []
      - from: NORMAL
        to: FROZEN
        trigger: "system posture recompute when a single allocation crosses both thresholds at once (allocated_slot_count >= floor_slot_capacity from <= floor(capacity*80/100))"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Vendor
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade when vendor.compliance_score_bp < 8500 after a chargeback CONFIRMED transition"
        actor: system
        preconditions: []
        side_effects:
          - "new Appointment creation for this vendor rejected with ERR_INACTIVE_REFERENCE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wcd/vendors/{id}/reinstate"
        actor: DepotManager
        preconditions:
          - "vendor.status == SUSPENDED"
        side_effects: []
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /wcd/vendors/{id}/deactivate"
        actor: DepotManager
        preconditions:
          - "vendor.status == SUSPENDED"
          - "no Appointment rows with status IN {BOOKED, CHECKED_IN} for this vendor, else ERR_REFERENTIAL_GUARD"
        side_effects:
          - "items of this vendor remain but new pallets cannot be received (vendor not ACTIVE gate)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-run
    parent_entity: CrossDockRun
    write_endpoint: "POST /wcd/cross-dock-runs/{run_id}/allocations"
    occ_field: "expected_cross_dock_run_version"
    description: |
      Creating an Allocation against a CrossDockRun whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just added or voided an allocation (advancing
      the run version) and the current writer's view of remaining club
      capacity is therefore stale.
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412

  - rule_id: markdown-decision-stale-item
    parent_entity: Item
    write_endpoint: "POST /wcd/items/{item_id}/markdown-decisions"
    occ_field: "expected_item_version"
    description: |
      Recording a MarkdownDecision against an Item whose version has advanced
      since the client last observed it is rejected. A prior decision (or any
      item mutation) advances the item version, so the deciding manager must
      re-read the item before deciding.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pallet_quantity_design
    trigger: "on Item create and on Item activation"
    algorithm: constraint_propagation
    formula: |
      pallet_qty_units = case_pack_qty * cases_per_layer * max_layers
      slot_area_sq_in = STANDARD_SLOT_LENGTH_IN * STANDARD_SLOT_WIDTH_IN
      footprint_sq_in = pallet_length_in * pallet_width_in
      pallets_per_slot = 1 if footprint_sq_in <= slot_area_sq_in else 2
    input_set: "the Item being created or activated"
    constants:
      STANDARD_SLOT_LENGTH_IN: 48
      STANDARD_SLOT_WIDTH_IN: 40
    precision: "integers for counts; footprint compared at 2 decimal places"

  - name: allocation_priority_score
    trigger: "on POST /wcd/cross-dock-runs/{run_id}/allocations, per allocation"
    algorithm: weighted_scoring
    formula: |
      # velocity: sum of unit_qty over Purchase rows with status == COMPLETED,
      # club_id == destination club, item_id == pallet's item,
      # cap_window within (run_date - W days, run_date - 1] inclusive,
      # where W = 7 for REGULAR items and W = 3 for TREASURE_HUNT items.
      demo_factor = 1 + min(club.member_base, MEMBER_BASE_CAP) / MEMBER_BASE_CAP * DEMO_WEIGHT
      income_factor = 1 + min(region.avg_member_income_cents, INCOME_CAP_CENTS) / INCOME_CAP_CENTS * INCOME_WEIGHT
      allocation_score = (velocity + VELOCITY_BASE) * demo_factor * income_factor
      floor_slots_reserved = item.pallets_per_slot
    input_set: "the destination Club, its Region, the pallet's Item, and COMPLETED Purchase rows for that club+item in the trailing window"
    constants:
      MEMBER_BASE_CAP: 200000
      DEMO_WEIGHT: 0.5
      INCOME_CAP_CENTS: 20000000
      INCOME_WEIGHT: 0.3
      VELOCITY_BASE: 10
      WINDOW_DAYS_REGULAR: 7
      WINDOW_DAYS_TREASURE_HUNT: 3
    precision: "allocation_score rounded to 4 decimal places, round_half_up; intermediate factors unrounded"
    variants:
      - name: standard
        when: "item.item_type == REGULAR"
        difference: "velocity window W = 7 days"
      - name: conservative
        when: "item.item_type == TREASURE_HUNT"
        difference: "velocity window W = 3 days (treasure-hunt items have shallow history)"

  - name: unload_fee_assessment
    trigger: "on Appointment CHECKED_IN -> COMPLETED"
    algorithm: tiered_pricing
    formula: |
      base_fee_cents = pallet_count * PER_PALLET_FEE_CENTS
      if pallet_count <= SMALL_LOAD_THRESHOLD:
          tier_multiplier = 1.00
      elif pallet_count <= MID_LOAD_THRESHOLD:
          tier_multiplier = 1.15
      else:
          tier_multiplier = 1.30
      unload_fee_cents = round_half_up(base_fee_cents * tier_multiplier)
    input_set: "the completing Appointment (its booked pallet_count)"
    constants:
      PER_PALLET_FEE_CENTS: 4500
      SMALL_LOAD_THRESHOLD: 10
      MID_LOAD_THRESHOLD: 25
    precision: "integer cents, round_half_up"

  - name: chargeback_amount
    trigger: "on Chargeback assessment (LATE_CHECKIN at check-in, NO_SHOW at day rollover, OVER_PALLET_COUNT at completion)"
    algorithm: aggregation
    formula: |
      # evaluation order pinned: (1) base by reason, (2) add per-extra-pallet penalty, (3) apply repeat-offender multiplier
      if reason == LATE_CHECKIN:
          base_cents = 15000
      elif reason == NO_SHOW:
          base_cents = 75000
      else:  # OVER_PALLET_COUNT
          base_cents = 25000
      per_pallet_cents = max(0, received_pallet_count - appointment.pallet_count) * PER_EXTRA_PALLET_CENTS if reason == OVER_PALLET_COUNT else 0
      prior_confirmed = count of Chargeback rows for this vendor with status == CONFIRMED and assessed_at date within trailing 90 days (inclusive)
      repeat_multiplier = 1 + min(prior_confirmed, REPEAT_CAP) * REPEAT_STEP
      amount_cents = round_half_up((base_cents + per_pallet_cents) * repeat_multiplier)
    input_set: "the Appointment, its Vendor, and that vendor's trailing-90-day CONFIRMED Chargeback history"
    constants:
      PER_EXTRA_PALLET_CENTS: 6000
      REPEAT_CAP: 4
      REPEAT_STEP: 0.25
      LATE_GRACE_MINUTES: 15
      APPEAL_WINDOW_DAYS: 7
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "OVER_PALLET_COUNT assessed while the appointment is still CHECKED_IN (not used by any current transition; documented for forward compatibility)"
        difference: "received_pallet_count counted mid-unload; would be recomputed at completion"
      - name: final
        when: "assessed on a terminal observation point (check-in for LATE_CHECKIN, day rollover for NO_SHOW, completion for OVER_PALLET_COUNT)"
        difference: "inputs frozen at assessment; amount never recomputed"

  - name: member_cap_check
    trigger: "on POST /wcd/purchases (create)"
    algorithm: threshold
    formula: |
      if item.member_purchase_cap == 0: pass
      window_key = current logical date (YYYY-MM-DD)
      used = sum of unit_qty over Purchase rows where member_id == member AND item_id == item AND cap_window == window_key AND status == COMPLETED
      pass iff used + requested_unit_qty <= item.member_purchase_cap
      # boundary pinned: equality allowed; reject only when used + requested > cap
    input_set: "COMPLETED Purchase rows for member+item on the current logical date"
    precision: "integer units"

  - name: club_posture_recompute
    trigger: "after any Allocation create/void/commit affecting a club"
    algorithm: threshold
    formula: |
      # boundary pinned: CONSTRAINED iff allocated_slot_count > floor(capacity * 80 / 100) (strictly greater)
      # FROZEN iff allocated_slot_count >= capacity
      threshold = (floor_slot_capacity * 80) // 100   # integer floor
      if allocated_slot_count >= floor_slot_capacity: posture = FROZEN
      elif allocated_slot_count > threshold: posture = CONSTRAINED
      else: posture = NORMAL
    input_set: "the Club row and its Allocations with status IN {PROPOSED, COMMITTED}"
    constants:
      CONSTRAINED_THRESHOLD_PCT: 80
    precision: "integer slots"

  - name: complaint_weighted_score_calc
    trigger: "on Complaint create, on Complaint resolve, and on Item ACTIVE -> DELETION_REVIEW"
    algorithm: weighted_scoring
    formula: |
      # per-complaint weight (frozen at complaint creation) = category_weight * household_size
      # complaint_weighted_score = sum of weight over OPEN complaints for item
      #   with created_on within [current_date - 30, current_date] inclusive
      # complaint_count = count of those complaints
    input_set: "OPEN Complaint rows for the item created within the trailing-30-day inclusive window"
    constants:
      WEIGHT_SAFETY: 4.0
      WEIGHT_QUALITY: 2.0
      WEIGHT_AVAILABILITY: 1.5
      WEIGHT_PRICING: 1.0
      COMPLAINT_WINDOW_DAYS: 30
      COMPLAINT_DISCONTINUE_THRESHOLD: 25.0
    precision: "score rounded to 2 decimal places, round_half_up"

  - name: vendor_compliance_score
    trigger: "after Chargeback transitions to CONFIRMED or WAIVED, after auto-confirm"
    algorithm: decay_function
    formula: |
      # step decay per trailing 30-day bucket; only CONFIRMED chargebacks count
      penalty(cb) = 250 if cb.reason == LATE_CHECKIN else 600 if cb.reason == NO_SHOW else 400
      age_days = current_logical_date - cb.assessed_at date
      bucket = 0 if age_days <= 30 else 1 if age_days <= 60 else 2
      decayed = penalty(cb) >> bucket   # integer right shift: halves per bucket
      compliance_score_bp = max(0, 10000 - sum(decayed for cb in vendor chargebacks with status == CONFIRMED and age_days <= 90))
    input_set: "Chargeback rows for the vendor with status == CONFIRMED, assessed within trailing 90 days inclusive"
    constants:
      COMPLIANCE_SUSPEND_THRESHOLD_BP: 8500
      PERFECT_SCORE_BP: 10000
    precision: "integer basis points"

  - name: sell_through_ratio
    trigger: "on POST /wcd/items/{item_id}/markdown-decisions (decision evaluation)"
    algorithm: aggregation
    formula: |
      received_units = sum of unit_qty over Pallet rows for item with status IN {RECEIVED, ALLOCATED, SHIPPED}
      sold_units = sum of unit_qty over Purchase rows for item with status == COMPLETED
      sell_through_pct = round_half_up(100 * sold_units / max(1, received_units))
      # mandatory markdown rule: if current logical date >= item.exit_window_date
      #   AND sell_through_pct < item.sell_through_target_pct
      #   then decision MUST be MARKDOWN (SELL_THROUGH rejected with ERR_MARKDOWN_RULE_VIOLATION)
      # reorder guard: if any MARKDOWN decision exists for the item, POST /wcd/pallets
      #   for that item is rejected with ERR_MARKDOWN_RULE_VIOLATION (no reorder)
    input_set: "Pallet rows and COMPLETED Purchase rows for the item"
    precision: "integer percent, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint per §1.7; entity-backed identity (VendorRep) must match the target resource's vendor"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "request body is well-formed and all required fields for the endpoint are present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "field-level format/range/enum validation (e.g., sku matches ^[0-9]{7}$, region code ^[A-Z]{2,4}$, enums in their declared sets, times HH:MM)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: existence
    check: "every path and body FK reference resolves to an existing row (validated left-to-right in path, then body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 6
    category: state
    check: "target entity is in a state that permits the transition per §1.2 (e.g., only BOOKED appointments can check in; only OPEN runs accept allocations or commit)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "member status must be ACTIVE for purchases, complaints, and department sales; allocation to a CONSTRAINED club requires regional_ops_approved: true"
    error_id: ERR_SAFETY_GATE
    http_status: 422
    applies_to: "POST /wcd/purchases, POST /wcd/complaints, POST /wcd/cross-dock-runs/{run_id}/allocations"

  - priority: 8
    category: business_safety
    check: "ancillary department sale rejected when the club's ancillary_flags disable that department"
    error_id: ERR_DEPARTMENT_DISABLED
    http_status: 422
    applies_to: "POST /wcd/department-sales"

  - priority: 9
    category: business_safety
    check: "destination club posture must not be FROZEN for allocation create"
    error_id: ERR_CLUB_FROZEN
    http_status: 422
    applies_to: "POST /wcd/cross-dock-runs/{run_id}/allocations"

  - priority: 10
    category: business_temporal
    check: "appointment windows are within depot dock hours, aligned to slot granularity, half-open [start,end) non-overlapping per depot per dock door (dock door assigned by server, lowest-numbered free door, tie-break by window start then created_at); check-in only on delivery_date and not after end_time"
    error_id: ERR_APPOINTMENT_CONFLICT
    http_status: 409
    applies_to: "POST /wcd/appointments, POST /wcd/appointments/{id}/check-in"

  - priority: 11
    category: business_temporal
    check: "cross-dock cutoff: allocations may be created and the run committed only while current logical time on run_date is <= cutoff_time (equality allowed); after cutoff the run can no longer accept allocations or be committed"
    error_id: ERR_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /wcd/cross-dock-runs/{run_id}/allocations, POST /wcd/cross-dock-runs/{run_id}/commit"

  - priority: 12
    category: business_constraint
    check: "uniqueness constraints (region.code, vendor.vendor_code, club.club_number, item.sku, member.membership_number); pallet unit_qty must equal item.pallet_qty_units"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 422
    applies_to: "create endpoints for regions, vendors, clubs, items, members; POST /wcd/pallets"

  - priority: 13
    category: business_constraint
    check: "same-day cross-dock: pallet.received_date must equal cross_dock_run.run_date for allocation"
    error_id: ERR_SAME_DAY_ONLY
    http_status: 422
    applies_to: "POST /wcd/cross-dock-runs/{run_id}/allocations"

  - priority: 14
    category: business_constraint
    check: "purchase per-member cap: used + requested <= item.member_purchase_cap when cap > 0 (equality allowed)"
    error_id: ERR_MEMBER_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /wcd/purchases"

  - priority: 15
    category: business_constraint
    check: "club floor slot capacity: allocation must not push club.allocated_slot_count above club.floor_slot_capacity (landing exactly at capacity is allowed; no backroom overflow)"
    error_id: ERR_CLUB_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /wcd/cross-dock-runs/{run_id}/allocations"

  - priority: 16
    category: business_fiscal
    check: "markdown decision rules: markdown_pct required iff decision == MARKDOWN; SELL_THROUGH rejected when at/after exit_window_date with sell_through_pct < target; treasure-hunt no-reorder: POST /wcd/pallets rejected when a MARKDOWN decision exists for the item"
    error_id: ERR_MARKDOWN_RULE_VIOLATION
    http_status: 422
    applies_to: "POST /wcd/items/{item_id}/markdown-decisions, POST /wcd/pallets"

  - priority: 17
    category: business_fiscal
    check: "vendor must be ACTIVE to book appointments or receive pallets; item must be ACTIVE to receive pallets or record purchases"
    error_id: ERR_INACTIVE_REFERENCE
    http_status: 422
    applies_to: "POST /wcd/appointments, POST /wcd/pallets, POST /wcd/purchases"

  - priority: 18
    category: business_referential
    check: "delete/discontinue guards: vendor deactivate blocked by open appointments; item deletion-review APPROVE requires complaint_weighted_score >= 25.0; treasure-hunt direct discontinue requires an existing MARKDOWN decision"
    error_id: ERR_REFERENTIAL_GUARD
    http_status: 409
    applies_to: "POST /wcd/vendors/{id}/deactivate, POST /wcd/items/{id}/request-deletion, POST /wcd/items/{id}/discontinue"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/wcd/regions"
    description: "Create a region"
    roles: [RegionalOps]
    code: 201
    input: [name, code, avg_member_income_cents]
    output: Region
    side_effects: []
  - method: GET
    path: "/wcd/regions"
    description: "List regions (created_at ASC)"
    roles: [RegionalOps, CategoryManager, DepotManager, DepotPlanner, MembershipDesk, VendorRep]
    code: 200
    input: ["limit?", "offset?", "code?"]
    output: Region[]
    side_effects: []
  - method: GET
    path: "/wcd/regions/{id}"
    description: "Get region"
    roles: [RegionalOps, CategoryManager, DepotManager, DepotPlanner, MembershipDesk, VendorRep]
    code: 200
    input: []
    output: Region
    side_effects: []

  - method: POST
    path: "/wcd/vendors"
    description: "Create a vendor"
    roles: [RegionalOps]
    code: 201
    input: [name, vendor_code]
    output: Vendor
    side_effects: ["vendor.compliance_score_bp initialized to 10000"]
  - method: GET
    path: "/wcd/vendors"
    description: "List vendors (created_at ASC)"
    roles: [RegionalOps, DepotManager, DepotPlanner, VendorRep, CategoryManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Vendor[]
    side_effects: []
  - method: GET
    path: "/wcd/vendors/{id}"
    description: "Get vendor"
