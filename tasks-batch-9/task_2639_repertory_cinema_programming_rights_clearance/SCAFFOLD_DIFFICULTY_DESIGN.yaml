  - rule_id: compensating_invariant
    instances:

      - name: seat_conservation_survives_sellout_then_refund
        grounds:
          - calculations.showtime_box_office_rollup
          - state_machines.TicketOrder[PAID -> REFUNDED]
          - state_machines.Showtime[ON_SALE -> SOLD_OUT]
          - state_machines.Showtime[SOLD_OUT -> ON_SALE]
          - entities.Venue.house_hold_seats
        distinguishing_aspect: |
          Conserved quantity: SEATS. seats_sold + seats_available + venue.house_hold_seats ==
          venue.seat_capacity must hold after every mutation, and the held-back house seats are never sellable
          on either side of the ledger. The refund is the compensating operation: it reverses seats, gross and
          admissions together and drags sale_status back from SOLD_OUT to ON_SALE, leaving no drift.
        test_recipe:
          setup:
            - "Canonical venue with seat_capacity 12 and house_hold_seats 4, so 8 seats are sellable."
            - "Canonical distributor / title / CONFIRMED booking / CLEARED clearance / non-encrypted DCP asset."
