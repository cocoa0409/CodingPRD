              payload: { application_id: "${app2_id}", officer_id: "${officer_id}", shift_start_at: "2026-06-01T08:00:00Z", shift_end_at: "2026-06-01T12:00:00Z" }
              as: FilmOfficeCoordinator
              captures: { oa2_id: $.data.id }
            - call: "POST /applications/${app1_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc1_id}"
            - call: "GET /department-reviews?application_id=${app1_id}&department_id=${dept_pol_id}"
              as: FilmOfficeCoordinator
