  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: bid_increment_exact_boundary_accepted
        grounds:
          - calculations.bid_increment_schedule
          - validations[priority=17]
        distinguishing_aspect: |
          Money-threshold boundary on POST /api/bids: with current high exactly 700000 the tier
          increment is 5000, so 705000.00 must be ACCEPTED (rule is >=, not >) while 704999.99 is
          rejected ERR_BID_BELOW_INCREMENT. The other Rule-6 instance is an empty-collection edge
          reached through the clock endpoint, a different metric and endpoint.
        test_recipe:
          setup:
            - "WHOLE listing (reserve 770000, T1 min 700000), ONLINE auction OPEN at 2026-08-10T17:00Z; B1 and B2 qualified; B1 holds high bid 700000"
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer One", email: "b1@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b1_id: $.data.id } }
            - { call: "POST /api/buyers/${b1_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer Two", email: "b2@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b2_id: $.data.id } }
            - { call: "POST /api/buyers/${b2_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 100, packaging_strategy: "WHOLE", reserve_price_total: 770000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t1_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "ONLINE", scheduled_start: "2026-08-10T17:00:00Z", scheduled_end: "2026-08-10T19:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T17:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/open", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 700000, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b1_id}", captures: { bid1_id: $.data.id } }
            - { call: "GET /api/auctions/${a_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
          trigger:
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 704999.99, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b2_id}", captures: { err: $.data.error_id } }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 705000, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b2_id}", captures: { bid2_id: $.data.id, bid2_st: $.data.status } }
            - { call: "GET /api/bids/${bid1_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { bid1_st: $.data.status } }
          assert:
            - "err == ERR_BID_BELOW_INCREMENT (704999.99 < 700000 + 5000)"
            - "bid2_st == PLACED — exactly 705000.00 accepted because the rule is amount >= high + increment"
            - "bid1_st == OUTBID after the accepted bid"

      - name: zero_bid_sealed_auction_auto_no_sale
        grounds:
          - state_machines.AuctionEvent.OPEN_to_NO_SALE
          - state_machines.Listing.AUCTION_SCHEDULED_to_MARKETED
        distinguishing_aspect: |
          Empty-collection boundary (zero bids) reached via POST /api/_clock/set_current_utc — a
          different metric (collection cardinality, not money) and a different endpoint than the
          other Rule-6 instance: a SEALED_BID auction whose window ends with exactly 0 bids goes
          straight to NO_SALE rather than CLOSED_PENDING_AWARD, and the listing reverts to MARKETED.
        test_recipe:
          setup:
            - "WHOLE listing (reserve 770000, T1 min 700000), SEALED_BID auction 2026-08-11 10:00-12:00Z, opened; no bids placed"
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L3", county: "Dallas", state_code: "IA", total_gross_acres: 100, packaging_strategy: "WHOLE", reserve_price_total: 770000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t1_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "SEALED_BID", scheduled_start: "2026-08-11T10:00:00Z", scheduled_end: "2026-08-11T12:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/open", as: BrokerAgent, as_user_id: "${g_id}" }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T12:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/auctions/${a_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_st: $.data.status } }
            - { call: "GET /api/listings/${l_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { l_st: $.data.status } }
            - { call: "GET /api/tracts/${t1_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { t_st: $.data.status } }
          assert:
            - "a_st == NO_SALE (zero PLACED/SEALED bids at close => not CLOSED_PENDING_AWARD)"
            - "l_st == MARKETED (re-list cycle)"
            - "t_st == OFFERED (tract survives for a future auction)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bid_gate_depends_on_buyer_qualification
        grounds:
          - validations[priority=7]
          - state_machines.Buyer.UNVERIFIED_to_QUALIFIED
          - errors[ERR_BUYER_NOT_QUALIFIED]
        distinguishing_aspect: |
          Entity pair Bid -> Buyer: the same bid payload is rejected ERR_BUYER_NOT_QUALIFIED while
          Buyer.qualification_status == UNVERIFIED and accepted after POST /api/buyers/{id}/qualify
          flips the buyer to QUALIFIED — the bid's validity is gated by a different entity's state.
          The other Rule-7 instance uses the ClosingPackage -> LeaseDisclosure pair.
        test_recipe:
          setup:
            - "WHOLE listing, OPEN ONLINE auction (2026-08-10 17:00-19:00Z), buyer B1 created but UNVERIFIED"
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer One", email: "b1@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b1_id: $.data.id } }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 100, packaging_strategy: "WHOLE", reserve_price_total: 770000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t1_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "ONLINE", scheduled_start: "2026-08-10T17:00:00Z", scheduled_end: "2026-08-10T19:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T17:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/open", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
          trigger:
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 700000, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /api/buyers/${b1_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 700000, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b1_id}", captures: { bid_st: $.data.status } }
          assert:
            - "err == ERR_BUYER_NOT_QUALIFIED while UNVERIFIED (rejected bid does not bump auction version, so the retry reuses the same expected_auction_version)"
            - "bid_st == PLACED after qualification — identical payload, outcome decided solely by Buyer state"

      - name: closing_gate_depends_on_disclosure_acknowledgment
        grounds:
          - validations[priority=8]
          - state_machines.LeaseDisclosure.DISCLOSED_to_ACKNOWLEDGED
          - errors[ERR_DISCLOSURE_NOT_ACKNOWLEDGED]
        distinguishing_aspect: |
