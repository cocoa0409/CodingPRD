  - section: calculations
    instances:

      - name: invoice_gross_filters_by_period_status_and_prior_billing
        claim_type: input_set_filtering
        grounds:
          - calculations.invoice_net_due
          - errors[ERR_REPORT_ALREADY_BILLED]
          - entities.SubscriberReport.fields.invoice_id
          - endpoints[POST /carriage/invoices]
        distinguishing_aspect: >-
          With an accepted 2026-05 report worth 4,800,000, an accepted 2026-06 report
          worth 5,200,000 and a DISPUTED second 2026-06 report, a 2026-06 LICENSE_FEE
          invoice grosses exactly 5,200,000 — the other period and the disputed row
          are both excluded — and once that invoice is ISSUED a second 2026-06 invoice
          is refused ERR_REPORT_ALREADY_BILLED at priority 81, which outranks the
          priority-82 "nothing to bill" complaint.
        test_recipe:
          setup:
            - "Cliffside Telco (200,000 homes) with an executed 40.0000-cent flat agreement, 0.50 floor, BASIC tier."
            - "Reports: 2026-05 at 120,000 accepted; 2026-06 at 130,000 accepted; a second 2026-06 filing at 140,000 disputed."
