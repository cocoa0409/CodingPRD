              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://num-v1" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc1}", code_section_ref: "1604.3", reference_edition: "IBC_2021", severity: "MINOR", category: "DETAILING", comment_text: "Base plate thickness missing" }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/cycles/${cyc1}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://num-v2" }
              as: ReviewCoordinator
              captures: { cyc2: $.data.id }
          assert:
            - "ReviewCycle.${cyc1}.cycle_number == 1"
            - "ReviewCycle.${cyc2}.cycle_number == 2"
            - "Engagement.${eng_id}.cycle_count == 2"

      - name: estimated_fee_survives_amendment
        claim_type: variant_selection
        grounds: [calculations.estimated_fee, calculations.final_fee]
        distinguishing_aspect: "Amending the valuation after registration leaves estimated_fee_cents pinned at its creation value; only the final fee (at seal) reflects the amended input."
        test_recipe:
          setup: ["engagement registered at valuation 30000000 (est 250000); amended to 50000000 before any cycle"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Amend Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE16", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Amend", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "PUT /plan-review/engagements/${eng_id}"
              payload: { declared_valuation_cents: 50000000 }
              as: ReviewCoordinator
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://amend-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/cycles/${cyc}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "GET /plan-review/records"
              payload: { engagement_id: "${eng_id}" }
              as: ReviewCoordinator
              captures: { rec_id: "$.data[0].id" }
            - call: "POST /plan-review/records/${rec_id}/seal"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "GET /plan-review/engagements/${eng_id}"
              payload: {}
              as: ReviewCoordinator
          assert:
            - "Engagement.${eng_id}.estimated_fee_cents == 250000 (unchanged by the amendment)"
            - "Engagement.${eng_id}.final_fee_cents == 400000 (amended valuation 50000000 -> base 400000; 1 cycle <= 2 free)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: jurisdiction_create_missing_auth_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "HTTP status == 400"

