            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T11:10:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${rg2}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tg}"
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${rg2}", audit_method: "ATP_SWAB", rlu_reading: 50 }
              as: QualityAuditor
              as_user_id: "${a1}"
            # --- T_MISS shift: clock-in 08:00-ish is impossible (clock moved); use remaining window: in 11:10, out 13:00 plus earlier span? Simpler: T_MISS clocked in late ---
            - call: "POST /evs/staff/${tm}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tm}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T11:20:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${bm1}", clean_type: "TERMINAL" }
              as: EVSDispatcher
