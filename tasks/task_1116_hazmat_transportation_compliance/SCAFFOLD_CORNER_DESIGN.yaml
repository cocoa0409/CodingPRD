# =============================================================================
# Task 1116: Hazmat Transportation Compliance & Placarding — §1.9
# Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# Logical clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: carrier_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Carrier.fields.registration_status, entities.Carrier.fields.safety_rating, entities.Carrier.fields.credit_balance_cents, entities.Carrier.fields.security_plan_required]
        distinguishing_aspect: "Omitting all optional inputs on carrier create yields DRAFT status, safety_rating 100, credit 0, and security_plan_required false for a FLAMMABLE_LIQUID-only carrier."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-3001", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_st: "$.data.registration_status", c_sr: "$.data.safety_rating", c_cr: "$.data.credit_balance_cents", c_spr: "$.data.security_plan_required", c_v: "$.data.version" }
          trigger: []
          assert:
            - "captured c_st == 'DRAFT', c_sr == 100, c_cr == 0, c_spr == false, c_v == 1"
      - name: carrier_create_missing_usdot_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Carrier.fields.usdot_number, "validations[priority=4]"]
        distinguishing_aspect: "usdot_number has no default; omitting it on create must fail with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "No Dot LLC", fleet_size_declared: 3, hazmat_categories: ["MISC"] }
              as: CarrierAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "captured err == 'ERR_INVALID_REQUEST'"
      - name: material_invalid_hazard_class_rejected
        claim_type: type_constraints
        grounds: [entities.HazmatMaterial.fields.hazard_class, "validations[priority=4]"]
        distinguishing_aspect: "hazard_class is a closed enum; 'CLASS_10' is not a member and must fail with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN9999", proper_shipping_name: "MYSTERY", hazard_class: "CLASS_10", packing_group: "PG_II", placard_table: "TABLE_2", transport_category: "MISC", reportable_quantity_lbs: 1, erg_guide_number: "999" }
              as: Regulator
              captures: { err: "$.data.error_id" }
          assert:
            - "captured err == 'ERR_INVALID_REQUEST'"
      - name: material_requires_security_plan_computed
        claim_type: computed_fields
        grounds: [entities.HazmatMaterial.fields.requires_security_plan]
        distinguishing_aspect: "requires_security_plan is computed: true for TABLE_1 or CLASS_7 or inhalation hazard, false otherwise; any client-supplied value is ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN1993", proper_shipping_name: "FLAMMABLE LIQUID, N.O.S.", hazard_class: "CLASS_3", packing_group: "PG_II", placard_table: "TABLE_2", transport_category: "FLAMMABLE_LIQUID", reportable_quantity_lbs: 100, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "128" }
              as: Regulator
              captures: { m1_rsp: "$.data.requires_security_plan" }
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN0335", proper_shipping_name: "FIREWORKS", hazard_class: "CLASS_1_1", packing_group: "PG_NONE", placard_table: "TABLE_1", transport_category: "EXPLOSIVE", reportable_quantity_lbs: 1, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "112" }
              as: Regulator
              captures: { m2_rsp: "$.data.requires_security_plan" }
          trigger: []
          assert:
            - "captured m1_rsp == false (TABLE_2, not inhalation, not CLASS_7)"
            - "captured m2_rsp == true (TABLE_1)"
      - name: get_carrier_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CARRIER_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown carrier id returns ERR_CARRIER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /hazmat/carriers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Regulator
              captures: { err: "$.data.error_id" }
          assert:
            - "captured err == 'ERR_CARRIER_NOT_FOUND'"
      - name: duplicate_usdot_rejected
        claim_type: type_constraints
        grounds: [entities.Carrier.fields.usdot_number, "errors[ERR_DUPLICATE_USDOT]", "validations[priority=22]"]
        distinguishing_aspect: "usdot_number uniqueness is enforced at create; second carrier with the same number fails ERR_DUPLICATE_USDOT (409)."
        test_recipe:
          setup: ["one carrier with usdot_number USDOT-3006"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-3006", fleet_size_declared: 5, hazmat_categories: ["MISC"] }
              as: CarrierAdmin
          trigger:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Copycat Carriers", usdot_number: "USDOT-3006", fleet_size_declared: 2, hazmat_categories: ["MISC"] }
              as: CarrierAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "captured err == 'ERR_DUPLICATE_USDOT'"
      - name: shipment_create_bogus_material_returns_invalid_reference
        claim_type: parent_relationships
        grounds: [entities.Shipment.fields.material_id, "errors[ERR_INVALID_REFERENCE]", "validations[priority=5]"]
        distinguishing_aspect: "A body FK to a non-existent material fails with ERR_INVALID_REFERENCE (422), after path existence and before state checks."
        test_recipe:
          setup: ["Carrier APPROVED_ACTIVE with fees paid"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-3007", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 26250 }
              as: CarrierAdmin
          trigger:
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", packaging_spec_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", declared_shipping_name: "X", quantity_kg: 1.0, declared_value_cents: 1 }
              as: ShipperComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "captured err == 'ERR_INVALID_REFERENCE'"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: classify_from_classified_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Shipment.DRAFT_to_CLASSIFIED, "errors[ERR_SHIPMENT_NOT_DRAFT]"]
        distinguishing_aspect: "Classify is valid only from DRAFT; repeating it on a CLASSIFIED shipment fails ERR_SHIPMENT_NOT_DRAFT and changes nothing."
        test_recipe:
          setup: ["Carrier APPROVED_ACTIVE, fees paid; shipment classified once (now CLASSIFIED)"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-3008", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 26250 }
              as: CarrierAdmin
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN1993", proper_shipping_name: "FLAMMABLE LIQUID, N.O.S.", hazard_class: "CLASS_3", packing_group: "PG_II", placard_table: "TABLE_2", transport_category: "FLAMMABLE_LIQUID", reportable_quantity_lbs: 100, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "128" }
              as: Regulator
              captures: { m_id: "$.data.id" }
            - call: "POST /hazmat/packaging-specs"
              payload: { spec_code: "UN4G", authorized_hazard_classes: ["CLASS_3"], max_packing_group: "PG_II", max_net_quantity_kg: 500.0 }
              as: Regulator
              captures: { s_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 100.0, declared_value_cents: 1000 }
              as: ShipperComplianceOfficer
              captures: { sh_id: "$.data.id", st0: "$.data.status" }
            - call: "POST /hazmat/shipments/${sh_id}/classify"
              payload: {}
              as: ShipperComplianceOfficer
          trigger:
            - call: "POST /hazmat/shipments/${sh_id}/classify"
              payload: {}
              as: ShipperComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "captured st0 == 'DRAFT' (initial state on create)"
            - "captured err == 'ERR_SHIPMENT_NOT_DRAFT' (second classify rejected; idempotency is an error here)"
      - name: cancel_cancelled_shipment_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Shipment.DRAFT_to_CANCELLED, "errors[ERR_SHIPMENT_NOT_CANCELLABLE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on the same shipment fails ERR_SHIPMENT_NOT_CANCELLABLE."
        test_recipe:
          setup: ["Carrier APPROVED_ACTIVE, fees paid; shipment created then cancelled (now CANCELLED)"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-3009", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 26250 }
              as: CarrierAdmin
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN1993", proper_shipping_name: "FLAMMABLE LIQUID, N.O.S.", hazard_class: "CLASS_3", packing_group: "PG_II", placard_table: "TABLE_2", transport_category: "FLAMMABLE_LIQUID", reportable_quantity_lbs: 100, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "128" }
              as: Regulator
              captures: { m_id: "$.data.id" }
            - call: "POST /hazmat/packaging-specs"
              payload: { spec_code: "UN4G", authorized_hazard_classes: ["CLASS_3"], max_packing_group: "PG_II", max_net_quantity_kg: 500.0 }
              as: Regulator
              captures: { s_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 100.0, declared_value_cents: 1000 }
              as: ShipperComplianceOfficer
              captures: { sh_id: "$.data.id" }
            - call: "POST /hazmat/shipments/${sh_id}/cancel"
              payload: {}
              as: ShipperComplianceOfficer
              captures: { st1: "$.data.status" }
          trigger:
            - call: "POST /hazmat/shipments/${sh_id}/cancel"
              payload: {}
              as: ShipperComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "captured st1 == 'CANCELLED'"
            - "captured err == 'ERR_SHIPMENT_NOT_CANCELLABLE' (terminal lockdown)"
      - name: vehicle_auto_loading_on_first_load
        claim_type: valid_transition
        grounds: [state_machines.Vehicle.AVAILABLE_to_LOADING]
        distinguishing_aspect: "Vehicle auto-transition: creating the first non-terminal load flips the vehicle AVAILABLE -> LOADING without any explicit vehicle call."
        test_recipe:
          setup: ["Carrier APPROVED_ACTIVE; vehicle PLT-3010 AVAILABLE; route exists"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-3010", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/vehicles"
              payload: { plate_number: "PLT-3010", vehicle_class: "VAN" }
              as: CarrierAdmin
              captures: { v_id: "$.data.id", v_st0: "$.data.status" }
            - call: "POST /hazmat/routes"
              payload: { route_code: "R-3010", allowed_hazard_classes: ["CLASS_3"], is_restricted_corridor: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: Regulator
              captures: { r_id: "$.data.id" }
          trigger:
            - call: "POST /hazmat/vehicles/${v_id}/loads"
              payload: { route_id: "${r_id}", planned_departure_at: "2026-05-10T08:00:00Z", planned_arrival_at: "2026-05-10T12:00:00Z" }
              as: ShipperComplianceOfficer
            - call: "GET /hazmat/vehicles/${v_id}"
              as: Regulator
              captures: { v_st1: "$.data.status" }
          assert:
            - "captured v_st0 == 'AVAILABLE'"
            - "captured v_st1 == 'LOADING' (system transition on first load)"
      - name: incident_minor_skips_phone_branch
        claim_type: valid_transition
        grounds: [state_machines.IncidentReport.DRAFT_to_WRITTEN_FILED, entities.IncidentReport.fields.phone_report_required]
        distinguishing_aspect: "Branching fork: MINOR severity allows DRAFT -> WRITTEN_FILED directly (phone step skipped); phone_report_required must be false."
        test_recipe:
          setup: ["Carrier APPROVED_ACTIVE, fees paid; DRAFT shipment; MINOR incident reported at occurred 2026-05-02T00:00:00Z; clock at 2026-05-03T00:00:00Z"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-3011", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 26250 }
              as: CarrierAdmin
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN1993", proper_shipping_name: "FLAMMABLE LIQUID, N.O.S.", hazard_class: "CLASS_3", packing_group: "PG_II", placard_table: "TABLE_2", transport_category: "FLAMMABLE_LIQUID", reportable_quantity_lbs: 100, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "128" }
              as: Regulator
              captures: { m_id: "$.data.id" }
            - call: "POST /hazmat/packaging-specs"
              payload: { spec_code: "UN4G", authorized_hazard_classes: ["CLASS_3"], max_packing_group: "PG_II", max_net_quantity_kg: 500.0 }
              as: Regulator
              captures: { s_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 10.0, declared_value_cents: 100 }
              as: ShipperComplianceOfficer
              captures: { sh_id: "$.data.id" }
            - call: "POST /hazmat/shipments/${sh_id}/incident-reports"
              payload: { occurred_at: "2026-05-02T00:00:00Z", severity: "MINOR" }
              as: ShipperComplianceOfficer
              captures: { i_id: "$.data.id", i_pr: "$.data.phone_report_required" }
            - call: "POST /hazmat/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "POST /hazmat/incident-reports/${i_id}/file-written"
              payload: {}
              as: ShipperComplianceOfficer
              captures: { i_st: "$.data.status", i_pen: "$.data.penalty_cents" }
          assert:
            - "captured i_pr == false (MINOR does not require phone report)"
            - "captured i_st == 'WRITTEN_FILED' (branch taken without phone step)"
            - "captured i_pen == 0 (MINOR base 0, no late components)"
      - name: invoice_auto_paid_on_exact_payment
        claim_type: valid_transition
        grounds: [state_machines.RegistrationInvoice.OPEN_to_PAID, calculations.payment_waterfall]
        distinguishing_aspect: "Bubble-up: a payment exactly equal to the open invoice's total_due flips the invoice OPEN -> PAID and zeroes outstanding_balance_cents in the same response."
        test_recipe:
          setup: ["Carrier SUBMITTED with INITIAL invoice OPEN (provisional 27500), approved -> final 26250, invoice OPEN"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-3012", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
          trigger:
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 26250 }
              as: CarrierAdmin
              captures: { c_out: "$.data.outstanding_balance_cents" }
            - call: "GET /hazmat/carriers/${c_id}/registration-invoices"
              as: Regulator
              captures: { inv_st: "$.data[0].status", inv_paid: "$.data[0].paid_cents" }
          assert:
            - "captured c_out == 0 (immediate consistency in the payment response)"
            - "captured inv_st == 'PAID' and inv_paid == 26250"
      - name: dispatch_rejects_stale_security_plan
        claim_type: precondition_enforcement
        grounds: [state_machines.VehicleLoad.SEALED_to_DISPATCHED, "errors[ERR_STALE_SECURITY_PLAN]", entities.Shipment.fields.pinned_security_plan_version]
        distinguishing_aspect: "Version-pinning: revising the pinned security plan (version bump) stales the TENDERED shipment; dispatch fails ERR_STALE_SECURITY_PLAN until the plan is re-approved AND the shipment re-tendered to re-pin."
        test_recipe:
          setup: ["EXPLOSIVE carrier APPROVED_ACTIVE, fees paid (38750); APPROVED security plan; qualified driver; TENDERED CLASS_1_1 shipment on a SEALED load"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Pyro Haulers", usdot_number: "USDOT-3013", fleet_size_declared: 5, hazmat_categories: ["EXPLOSIVE"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 38750 }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/security-plans"
              payload: { plan_name: "EXP-PLAN", coverage_categories: ["EXPLOSIVE"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: CarrierAdmin
              captures: { sp_id: "$.data.id" }
            - call: "POST /hazmat/security-plans/${sp_id}/submit"
              payload: {}
              as: CarrierAdmin
            - call: "POST /hazmat/security-plans/${sp_id}/approve"
              payload: {}
              as: Regulator
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN0335", proper_shipping_name: "FIREWORKS", hazard_class: "CLASS_1_1", packing_group: "PG_NONE", placard_table: "TABLE_1", transport_category: "EXPLOSIVE", reportable_quantity_lbs: 1, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "112" }
              as: Regulator
              captures: { m_id: "$.data.id" }
            - call: "POST /hazmat/packaging-specs"
              payload: { spec_code: "UN4G", authorized_hazard_classes: ["CLASS_1_1"], max_packing_group: "PG_II", max_net_quantity_kg: 500.0 }
              as: Regulator
              captures: { s_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/drivers"
              payload: { full_name: "Dana Roe", cdl_number: "CDL-3013", hazmat_endorsement_expires_at: "2027-01-01T00:00:00Z" }
              as: CarrierAdmin
              captures: { d_id: "$.data.id" }
            - call: "POST /hazmat/drivers/${d_id}/training-records"
              payload: { training_type: "INITIAL", completed_at: "2026-04-01T00:00:00Z", certificate_code: "CERT-3013" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/vehicles"
              payload: { plate_number: "PLT-3013", vehicle_class: "VAN" }
              as: CarrierAdmin
