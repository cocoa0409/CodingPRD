  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: edition_weekly_cadence_minimum_gap
        grounds:
          - state_machines.ValuationEdition.PENDING_to_PUBLISHED
          - validations.priority=9
        distinguishing_aspect: |
          Minimum-gap interval semantics on the series' publication resource:
          a second PUBLISHED edition whose effective_at is less than 7 days
          after the previous one is rejected (ERR_CADENCE_VIOLATION); exactly
          7 days is accepted — the guard constrains the gap between point
          intervals, not interval intersection.
        test_recipe:
          setup:
            - "std published edition E_to1 (effective 2026-09-01) on series S_to (SEDAN cfg_to, region EAST); second edition E_to2 created with effective_at 2026-09-05 (4-day gap)"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_to: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "TO", year: 2023, trim: "X", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-to" }
              as: ValuationAdmin
              captures: { cfg_to: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_to}", name: "TOD", external_key: "src-to" }
              as: DataOps
              captures: { src_to: $.data.id }
