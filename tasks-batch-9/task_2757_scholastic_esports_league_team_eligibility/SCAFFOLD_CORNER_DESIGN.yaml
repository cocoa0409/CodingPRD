      - name: title_approval_ceiling_applies_only_to_the_approve_branch_and_only_above_the_districts_rating
        claim_type: conditional_validation
        grounds:
          - validations[priority=34]
          - errors[ERR_TITLE_AGE_RATING_EXCEEDS_DISTRICT_CEILING]
          - state_machines.TitleApproval.PENDING_to_APPROVED
          - entities.District.fields.max_age_rating
        distinguishing_aspect: |
          The ceiling check is conditional twice over: it applies only to action=APPROVE
          (a DENY of the same M-rated title must succeed) and only when the title's rating
          ordinal EXCEEDS the district's. The same title and the same request are approved
          in a district whose ceiling is M and refused in the district whose ceiling is the
          default T, so the rule must compare ordinals E=0 < E10=1 < T=2 < M=3 rather than
          strings.
        test_recipe:
          setup:
            - "District T keeps the default max_age_rating T; district M is created with max_age_rating M; each has one school"
            - "One M-rated title, and one PENDING TitleApproval in each district"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Cautious District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_t_id: $.data.id }
            - call: "POST /districts"
              payload: { name: "Permissive District", state_code: "CA", max_age_rating: "M" }
              as: LeagueAdmin
              captures: { d_m_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_t_id}", name: "North High", nces_code: "NCES-001" }
              as: LeagueAdmin
              captures: { s_t_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_m_id}", name: "South High", nces_code: "NCES-002" }
              as: LeagueAdmin
              captures: { s_m_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Siege Protocol", publisher: "Astro Interactive", age_rating: "M", min_player_age: 17 }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /title-approvals"
              payload: { district_id: "${d_t_id}", title_id: "${t_id}", requested_by_school_id: "${s_t_id}" }
              as: AthleticDirector
              as_user_id: "${s_t_id}"
              captures: { ap_t_id: $.data.id }
            - call: "POST /title-approvals"
              payload: { district_id: "${d_m_id}", title_id: "${t_id}", requested_by_school_id: "${s_m_id}" }
              as: AthleticDirector
              as_user_id: "${s_m_id}"
              captures: { ap_m_id: $.data.id }
          trigger:
            - call: "POST /title-approvals/${ap_t_id}/decision"
              payload: { action: "APPROVE", decision_note: "requested by North High" }
              as: DistrictAdmin
              as_user_id: "${d_t_id}"
              captures: { e_ceiling: $.data.error_id }
            - call: "POST /title-approvals/${ap_t_id}/decision"
              payload: { action: "DENY", decision_note: "rating above district policy" }
              as: DistrictAdmin
              as_user_id: "${d_t_id}"
            - call: "POST /title-approvals/${ap_m_id}/decision"
              payload: { action: "APPROVE", decision_note: "within district policy" }
              as: DistrictAdmin
              as_user_id: "${d_m_id}"
          assert:
            - "trigger 1 returns 422 with data.error_id == ERR_TITLE_AGE_RATING_EXCEEDS_DISTRICT_CEILING and TitleApproval.${ap_t_id}.status is still PENDING with decided_by_user_id null"
            - "trigger 2 returns 200 with data.status == DENIED, data.decided_by_user_id == ${d_t_id} and data.decided_at == 2026-08-01T00:00:00.000Z — the ceiling never blocks a denial"
            - "trigger 3 returns 200 with data.status == APPROVED and data.decided_by_user_id == ${d_m_id}"

      - name: showcase_and_recruiting_preconditions_are_enforced_in_their_declared_order
