    grounds:
    - entities.DropshipOrder
    - endpoints[POST /dropship/orders]
    - response_envelope.success
    distinguishing_aspect: 'id, created_at, updated_at and version are system-sourced on DropshipOrder: a client-supplied
      id and a client-supplied placed_at are both ignored, and placed_at is taken from the logical clock.'
    test_recipe:
      setup:
      - Vendor V1 is ACTIVE; offer I1 is ACTIVE with a fresh feed of 60 on-hand at 2026-08-03T09:00:00Z.
      - The logical clock is at 2026-08-03T10:00:00Z.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/vendors
        payload:
          vendor_code: V1
          legal_name: Northwind Dropship LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
          inventory_refresh_cadence_minutes: 60
          safety_buffer_units: 5
          oversell_grace_units: 0
          default_lead_time_days: 3
          ack_sla_hours: 24
          ship_sla_grace_hours: 12
        as: PlatformAdmin
        captures:
          v1_id: $.data.id
      - call: POST /dropship/vendors/${v1_id}/begin-integration
        payload: {}
        as: VendorOpsAnalyst
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: CATALOG
          sample_payload_digest: sha256-V1-catalog
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_catalog: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: INVENTORY
          sample_payload_digest: sha256-V1-inventory
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_inventory: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: ORDER
          sample_payload_digest: sha256-V1-order
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_order: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
