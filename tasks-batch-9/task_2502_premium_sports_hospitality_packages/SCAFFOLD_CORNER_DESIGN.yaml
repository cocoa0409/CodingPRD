            - { call: "GET /payment-installments", payload: { booking_id: "${b1}", limit: 10, offset: 0 }, as: FinanceController, as_user_id: u_fin, captures: { a1: "$.data[0].amount_cents", d1: "$.data[0].due_at", k1: "$.data[0].installment_kind", a2: "$.data[1].amount_cents", d2: "$.data[1].due_at", a3: "$.data[2].amount_cents", d3: "$.data[2].due_at", s3: "$.data[2].sequence_no" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-01-02T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 1 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b2: "$.data.id" } }
            - { call: "GET /payment-installments", payload: { booking_id: "${b2}", limit: 10, offset: 0 }, as: FinanceController, as_user_id: u_fin, captures: { b2_a1: "$.data[0].amount_cents", b2_d1: "$.data[0].due_at", b2_a3: "$.data[2].amount_cents", b2_d2: "$.data[1].due_at", b2_d3: "$.data[2].due_at" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-01-03T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 1 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b3: "$.data.id" } }
