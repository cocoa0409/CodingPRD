            - "trigger[5] data.error_id == ERR_PATCH_NOT_FOUND; trigger[6] == ERR_SITE_EVENT_NOT_FOUND; trigger[7] == ERR_CAMPAIGN_NOT_FOUND; trigger[8] == ERR_CHANGE_REQUEST_NOT_FOUND; trigger[9] == ERR_TALKPATH_REQUEST_NOT_FOUND"

      - name: error_unit_not_found_on_lifecycle_action
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - endpoints[POST /radio-system/units/{unit_id}/lifecycle]
          - errors.ERR_UNIT_NOT_FOUND
        distinguishing_aspect: "Path resolution precedes body validation on an action endpoint: an unknown unit id returns HTTP 404 ERR_UNIT_NOT_FOUND even though the body also names a non-existent template."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; agency NFU exists so the acting X-User-ID resolves, but it owns no unit."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "No Such Unit Agency", agency_code: "NFU01", agency_type: "EMS", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_nfu_id: "$.data.id" }
          trigger:
            - call: "POST /radio-system/units/00000000-0000-4000-8000-000000000000/lifecycle"
              payload: { action: "ASSIGN", template_id: "00000000-0000-4000-8000-000000000000" }
              as: AgencyRadioManager
              as_user_id: "${agency_nfu_id}"
              captures: { nfu_error_id: "$.data.error_id" }
          assert:
            - "trigger[0] returns HTTP 404 with data.error_id == ERR_UNIT_NOT_FOUND (not ERR_TEMPLATE_NOT_FOUND, because path ids resolve before body foreign keys)"
            - "GET /radio-system/units?agency_id=${agency_nfu_id} returns total_count == 0"

      - name: error_unauthenticated_when_user_role_header_is_not_a_declared_role
        claim_type: error_triggerable
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "X-User-Role must be one of the eight declared roles, so the header value RegionalIntern returns HTTP 401 ERR_UNAUTHENTICATED — not 403 ERR_UNAUTHORIZED, which is reserved for a real role missing from the endpoint's list."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one site exists so the endpoint would otherwise succeed."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "AUT-1", name: "Auth One", channel_capacity: 4, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_aut_id: "$.data.id" }
          trigger:
            - call: "GET /radio-system/sites/${site_aut_id}"
