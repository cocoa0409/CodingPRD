  # ===================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: change_order_reject_leaves_quote_price_unchanged
        grounds:
          - state_machines.ChangeOrder.PENDING_to_REJECTED
          - calculations.change_order_delta
          - entities.Quote.fields.firm_total_cents
        distinguishing_aspect: |
          Conserved quantity = Quote.firm_total_cents (project price). Raising then REJECTING a change order is the
          forward+compensating pair that must leave firm_total_cents exactly equal to its pre-change-order value
          (715000): a PENDING->REJECTED change order applies no price_delta. Invariant: firm_total_cents unchanged.
        test_recipe:
          setup:
            - "APPROVED REFACE/WOOD_VENEER quote (lf=25,d=18), firm_total_cents 715000; one PENDING change order +4lf/+2d raised."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h17@x.com", full_name: "H 17", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust17: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust17}", address_line: "17 Kitchen Way" }
              as: SalesRep
              captures: { proj17: $.data.id }
            - call: "POST /projects/${proj17}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas17: $.data.id }
            - call: "POST /projects/${proj17}/measures/${meas17}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${proj17}/quotes"
              payload: { measure_id: "${meas17}", scope: "REFACE" }
              as: SalesRep
              captures: { q17: $.data.id }
            - call: "POST /quotes/${q17}/issue"
              payload: {}
              as: SalesRep
              captures: { q17v: $.data.version }
            - call: "POST /quotes/${q17}/approve"
              payload: { expected_quote_version: "${q17v}" }
              as: Customer
              as_user_id: "${cust17}"
            - call: "POST /quotes/${q17}/change-orders"
              payload: { delta_linear_feet: 4, delta_door_count: 2, rush: false }
              as: SalesRep
              captures: { co17: $.data.id }
          trigger:
            - call: "POST /change-orders/${co17}/reject"
              payload: {}
              as: Customer
              as_user_id: "${cust17}"
              captures: { co17status: $.data.status }
          assert:
            - "ChangeOrder.${co17}.status == REJECTED"
            - "Quote.${q17}.firm_total_cents == 715000"

      - name: install_cancel_reverts_project_posture_conserving_lifecycle
        grounds:
          - state_machines.InstallJob.SCHEDULED_to_CANCELLED
          - state_machines.Project.SOLD_to_IN_PRODUCTION
          - entities.Project.fields.status
        distinguishing_aspect: |
          Conserved quantity = Project lifecycle posture (a different conserved quantity from the cents price): the
          forward SOLD->IN_PRODUCTION (material-order placement) paired with the compensating InstallJob cancel must
          return Project.status to exactly SOLD, with no orphan IN_PRODUCTION posture left behind.
        test_recipe:
          setup:
            - "Project IN_PRODUCTION via placed MaterialOrder; a SCHEDULED InstallJob exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
