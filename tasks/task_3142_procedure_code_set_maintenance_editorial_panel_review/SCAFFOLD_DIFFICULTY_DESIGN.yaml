            - "ContentDeliveryOrder.${del_t2}.delivery_status == WITHDRAWN"
            - "LicensingAgreement.${lic_t}.distribution_scope == INTERNAL_ONLY"
            - "DistributionTerritory.${ter_t}.territory_status == WITHDRAWN"

  - rule_id: boundary_precision_check
