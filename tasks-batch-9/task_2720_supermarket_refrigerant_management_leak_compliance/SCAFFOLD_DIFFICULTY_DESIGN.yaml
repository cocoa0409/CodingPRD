              payload: { leak_event_id: "${event_id}", repair_attempt_id: "${attempt1_id}", technician_id: "${tech2_id}", test_method_code: "PRESSURE_DECAY", performed_at: "2026-08-07T13:00:00Z", result: "PASS", measured_leak_rate_pct: 2.0 }
