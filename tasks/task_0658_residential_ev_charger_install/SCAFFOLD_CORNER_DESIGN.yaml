scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_install_job_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.InstallJob.fields.workflow_status, entities.InstallJob.fields.compliance_status]
        distinguishing_aspect: "POST /install-jobs with property_id + charger_product_sku returns 201; workflow_status=CREATED, compliance_status=PENDING_REVIEW, requires_panel_upgrade=false, version=1."
        test_recipe:
          setup: ["A CA property with a 200A panel and charger CHG40 (40A circuit, fits 200A band)"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c1@x.com", full_name: "C One", state_code: "CA" }
              as: Anonymous
              captures: {hc1: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CCHG1", name: "C Charger 1", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc1}", address_line: "1 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc1: $.data.id}
          trigger:
            - call: "POST /install-jobs"
              payload: { property_id: "${pc1}", charger_product_sku: "CCHG1" }
              as: Coordinator
              captures: {jc1: $.data.id, wf: $.data.workflow_status, cs: $.data.compliance_status, ver: $.data.version}
          assert:
            - "response.status == 201"
            - "InstallJob.${jc1}.workflow_status == CREATED"
            - "InstallJob.${jc1}.compliance_status == PENDING_REVIEW"
            - "InstallJob.${jc1}.requires_panel_upgrade == false"
            - "InstallJob.${jc1}.version == 1"

      - name: get_install_job_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /install-jobs/{id} with a non-existent UUID returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /install-jobs/00000000-0000-4000-8000-000000000000"
              as: Coordinator
              captures: {err: $.data.error_id}
          assert:
            - "response.status == 404"
            - "$.data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_install_job_missing_required_field
        claim_type: Required Fields
        grounds: [endpoints, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /install-jobs missing charger_product_sku returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A CA property exists"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c2@x.com", full_name: "C Two", state_code: "CA" }
              as: Anonymous
              captures: {hc2: $.data.id}
            - call: "POST /properties"
              payload: { homeowner_id: "${hc2}", address_line: "2 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc2: $.data.id}
          trigger:
            - call: "POST /install-jobs"
              payload: { property_id: "${pc2}" }
              as: Coordinator
              captures: {err: $.data.error_id}
          assert:
            - "response.status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: create_property_default_service_voltage_applied
        claim_type: Defaults
        grounds: [entities.Property.fields.service_voltage]
        distinguishing_aspect: "Omitting service_voltage on POST /properties applies the default 240."
        test_recipe:
          setup: ["A homeowner exists"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c3@x.com", full_name: "C Three", state_code: "CA" }
              as: Anonymous
              captures: {hc3: $.data.id}
          trigger:
            - call: "POST /properties"
              payload: { homeowner_id: "${hc3}", address_line: "3 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc3: $.data.id, v: $.data.service_voltage}
          assert:
            - "Property.${pc3}.service_voltage == 240"

      - name: site_assessment_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.SiteAssessment.fields.existing_demand_va, entities.SiteAssessment.fields.spare_capacity_va]
        distinguishing_aspect: "existing_demand_va/spare_capacity_va/charger_fits are computed; they are not accepted as input fields (no such keys in §1.5 input) — values come only from the formula."
        test_recipe:
          setup: ["A 200A property and a CREATED job"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c4@x.com", full_name: "C Four", state_code: "CA" }
              as: Anonymous
              captures: {hc4: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CCHG4", name: "C Charger 4", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc4}", address_line: "4 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc4: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${pc4}", charger_product_sku: "CCHG4" }
              as: Coordinator
              captures: {jc4: $.data.id}
          trigger:
            - call: "POST /site-assessments"
              payload: { property_id: "${pc4}", install_job_id: "${jc4}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sac4: $.data.id, ed: $.data.existing_demand_va}
          assert:
            - "SiteAssessment.${sac4}.existing_demand_va == 9000"
            - "SiteAssessment.${sac4}.spare_capacity_va == 39000"

      - name: charger_product_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ChargerProduct]
        distinguishing_aspect: "ChargerProduct has common_fields:false; it exposes id + created_at only, no version field, and there is no update endpoint."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /charger-products"
              payload: { sku: "CCHG5", name: "C Charger 5", rated_amps: 40, required_circuit_amps: 50, msrp_cents: 70000 }
              as: Coordinator
              captures: {cp5: $.data.id}
          trigger:
            - call: "GET /charger-products/${cp5}"
              as: Coordinator
              captures: {sku5: $.data.sku}
          assert:
            - "ChargerProduct.${cp5}.sku == CCHG5"
            - "response.data has no field named version"

      - name: install_job_property_fk_not_found
        claim_type: Parent Relationships
        grounds: ["validations[priority=4]", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /install-jobs with a non-existent property_id returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["A charger product exists; no property"]
          setup_api_calls:
            - call: "POST /charger-products"
              payload: { sku: "CCHG6", name: "C Charger 6", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
          trigger:
            - call: "POST /install-jobs"
              payload: { property_id: "00000000-0000-4000-8000-0000000000aa", charger_product_sku: "CCHG6" }
              as: Coordinator
              captures: {err: $.data.error_id}
          assert:
            - "response.status == 404"
            - "$.data.error_id == ERR_FK_NOT_FOUND"

      - name: list_install_jobs_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /install-jobs returns an array response with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One install job exists for a property"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c7@x.com", full_name: "C Seven", state_code: "CA" }
              as: Anonymous
              captures: {hc7: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CCHG7", name: "C Charger 7", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc7}", address_line: "7 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc7: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${pc7}", charger_product_sku: "CCHG7" }
              as: Coordinator
          trigger:
            - call: "GET /install-jobs?property_id=${pc7}&limit=10&offset=0"
              as: Coordinator
          assert:
            - "response.response_type == array"
            - "response.meta/pagination total_count == 1"
            - "response has_more == false"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_install_job_from_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.InstallJob.CREATED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /install-jobs/{id}/cancel on an already CANCELLED job returns ERR_INVALID_STATE (409); no side effects re-fire."
        test_recipe:
          setup: ["A CREATED install job that has been cancelled once"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c8@x.com", full_name: "C Eight", state_code: "CA" }
              as: Anonymous
              captures: {hc8: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CCHG8", name: "C Charger 8", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc8}", address_line: "8 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc8: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${pc8}", charger_product_sku: "CCHG8" }
              as: Coordinator
              captures: {jc8: $.data.id}
            - call: "POST /install-jobs/${jc8}/cancel"
              as: Homeowner
              as_user_id: "${hc8}"
          trigger:
            - call: "POST /install-jobs/${jc8}/cancel"
              as: Homeowner
              as_user_id: "${hc8}"
              captures: {err: $.data.error_id}
          assert:
            - "response.status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: newly_created_job_initial_states
        claim_type: Initial State
        grounds: [state_machines.InstallJob]
        excluded_because:
          difficulty_instance: non_linear_state_machine / install_job_parallel_workflow_compliance_dimensions
          rationale: "Initial CREATED/PENDING_REVIEW state and the parallel-dimension evolution are asserted by the named §1.8 instance and by corner create_install_job_returns_201_with_defaults."

      - name: permit_corrections_loop_three_rounds_auto_reject
        claim_type: cyclic
        grounds: [state_machines.PermitApplication.CORRECTIONS_REQUESTED_to_REJECTED, entities.PermitApplication.fields.correction_rounds]
        distinguishing_aspect: "After 3 request-corrections rounds, the next resubmit auto-transitions the permit to REJECTED (correction_rounds >= 3) instead of SUBMITTED."
        test_recipe:
          setup: ["A job with compliance PERMIT_PENDING and a SUBMITTED permit application that has cycled corrections 3 times"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c9@x.com", full_name: "C Nine", state_code: "CA" }
              as: Anonymous
              captures: {hc9: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CCHG9", name: "C Charger 9", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc9}", address_line: "9 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc9: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${pc9}", charger_product_sku: "CCHG9" }
              as: Coordinator
              captures: {jc9: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${pc9}", install_job_id: "${jc9}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sac9: $.data.id}
            - call: "POST /site-assessments/${sac9}/accept"
              as: Coordinator
            - call: "POST /permit-applications"
              payload: { install_job_id: "${jc9}", jurisdiction_code: "AHJ1" }
              as: Coordinator
              captures: {pmc9: $.data.id}
            - call: "POST /permit-applications/${pmc9}/request-corrections"
              as: Coordinator
            - call: "POST /permit-applications/${pmc9}/resubmit"
              as: Coordinator
            - call: "POST /permit-applications/${pmc9}/request-corrections"
              as: Coordinator
            - call: "POST /permit-applications/${pmc9}/resubmit"
              as: Coordinator
            - call: "POST /permit-applications/${pmc9}/request-corrections"
              as: Coordinator
          trigger:
            - call: "POST /permit-applications/${pmc9}/resubmit"
              as: Coordinator
              captures: {st: $.data.status, rounds: $.data.correction_rounds}
          assert:
            - "PermitApplication.${pmc9}.correction_rounds == 3"
            - "PermitApplication.${pmc9}.status == REJECTED"

      - name: warranty_reopen_limit_reached
        claim_type: cyclic
        grounds: [state_machines.WarrantyTicket.RESOLVED_to_OPEN, "errors[ERR_REOPEN_LIMIT_REACHED]", entities.WarrantyTicket.fields.reopen_count]
        distinguishing_aspect: "A WarrantyTicket already reopened twice (reopen_count==2) rejects a third reopen with ERR_REOPEN_LIMIT_REACHED (409)."
        test_recipe:
          setup: ["Activated job J with a WarrantyTicket reopened twice and currently RESOLVED"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c10@x.com", full_name: "C Ten", state_code: "CA" }
              as: Anonymous
              captures: {hc10: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CCHG10", name: "C Charger 10", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc10}", address_line: "10 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc10: $.data.id}
            - call: "POST /electricians"
              payload: { full_name: "C Elec Ten", license_state_code: "CA" }
              as: Coordinator
              captures: {ec10: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${pc10}", charger_product_sku: "CCHG10" }
              as: Coordinator
              captures: {jc10: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${pc10}", install_job_id: "${jc10}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sac10: $.data.id}
            - call: "POST /site-assessments/${sac10}/accept"
              as: Coordinator
            - call: "POST /quotes"
              payload: { install_job_id: "${jc10}", labor_cents: 120000, parts_line_cents: [60000, 5000] }
              as: Coordinator
              captures: {qc10: $.data.id}
            - call: "POST /quotes/${qc10}/send"
              as: Coordinator
            - call: "GET /install-jobs/${jc10}"
              as: Coordinator
              captures: {jvc10: $.data.version}
            - call: "POST /quotes/${qc10}/accept"
              payload: { expected_install_job_version: "${jvc10}" }
              as: Homeowner
              as_user_id: "${hc10}"
            - call: "POST /permit-applications"
              payload: { install_job_id: "${jc10}", jurisdiction_code: "AHJ1" }
              as: Coordinator
              captures: {pmc10: $.data.id}
            - call: "POST /permit-applications/${pmc10}/approve"
              as: Coordinator
            - call: "POST /interconnection-requests"
              payload: { install_job_id: "${jc10}", utility_territory_code: "PGE", requested_load_amps: 32 }
              as: Coordinator
              captures: {icc10: $.data.id}
            - call: "POST /interconnection-requests/${icc10}/start-review"
              as: UtilityReviewer
            - call: "POST /interconnection-requests/${icc10}/approve"
              as: UtilityReviewer
            - call: "POST /dispatch-assignments"
              payload: { install_job_id: "${jc10}", electrician_id: "${ec10}", window_date: "2026-05-11T00:00:00Z", window_start_minute: 540, window_end_minute: 720 }
              as: Coordinator
              captures: {dac10: $.data.id}
            - call: "POST /dispatch-assignments/${dac10}/depart"
              as: Electrician
              as_user_id: "${ec10}"
            - call: "POST /dispatch-assignments/${dac10}/complete"
              as: Electrician
              as_user_id: "${ec10}"
            - call: "GET /install-jobs/${jc10}"
              as: Coordinator
              captures: {pairc10: $.data.activation_pairing_code}
            - call: "POST /install-jobs/${jc10}/activate"
              payload: { pairing_code: "${pairc10}" }
              as: Homeowner
              as_user_id: "${hc10}"
            - call: "POST /warranty-tickets"
              payload: { install_job_id: "${jc10}", summary: "issue" }
              as: Homeowner
              as_user_id: "${hc10}"
              captures: {wtc10: $.data.id}
            - call: "POST /warranty-tickets/${wtc10}/diagnose"
              as: Electrician
              as_user_id: "${ec10}"
            - call: "POST /warranty-tickets/${wtc10}/resolve"
              as: Electrician
              as_user_id: "${ec10}"
            - call: "POST /warranty-tickets/${wtc10}/reopen"
              as: Homeowner
              as_user_id: "${hc10}"
            - call: "POST /warranty-tickets/${wtc10}/diagnose"
              as: Electrician
              as_user_id: "${ec10}"
            - call: "POST /warranty-tickets/${wtc10}/resolve"
              as: Electrician
              as_user_id: "${ec10}"
            - call: "POST /warranty-tickets/${wtc10}/reopen"
              as: Homeowner
              as_user_id: "${hc10}"
            - call: "POST /warranty-tickets/${wtc10}/diagnose"
              as: Electrician
              as_user_id: "${ec10}"
            - call: "POST /warranty-tickets/${wtc10}/resolve"
              as: Electrician
              as_user_id: "${ec10}"
          trigger:
            - call: "POST /warranty-tickets/${wtc10}/reopen"
              as: Homeowner
              as_user_id: "${hc10}"
              captures: {err: $.data.error_id}
          assert:
            - "response.status == 409"
            - "$.data.error_id == ERR_REOPEN_LIMIT_REACHED"

      - name: terminal_quote_accepted_locked
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Quote, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An ACCEPTED Quote (terminal) rejects POST /quotes/{id}/reject with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A Quote ACCEPTED, driving its job to QUOTED"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c11@x.com", full_name: "C Eleven", state_code: "CA" }
              as: Anonymous
              captures: {hc11: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CCHG11", name: "C Charger 11", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc11}", address_line: "11 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc11: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${pc11}", charger_product_sku: "CCHG11" }
              as: Coordinator
              captures: {jc11: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${pc11}", install_job_id: "${jc11}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sac11: $.data.id}
            - call: "POST /site-assessments/${sac11}/accept"
              as: Coordinator
            - call: "POST /quotes"
              payload: { install_job_id: "${jc11}", labor_cents: 120000, parts_line_cents: [60000, 5000] }
              as: Coordinator
              captures: {qc11: $.data.id}
            - call: "POST /quotes/${qc11}/send"
              as: Coordinator
            - call: "GET /install-jobs/${jc11}"
              as: Coordinator
              captures: {jvc11: $.data.version}
            - call: "POST /quotes/${qc11}/accept"
              payload: { expected_install_job_version: "${jvc11}" }
              as: Homeowner
              as_user_id: "${hc11}"
          trigger:
            - call: "POST /quotes/${qc11}/reject"
              as: Homeowner
              as_user_id: "${hc11}"
              captures: {err: $.data.error_id}
          assert:
            - "response.status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: quote_revision_loop_back_to_draft
        claim_type: cyclic
        grounds: [state_machines.Quote.REJECTED_to_DRAFT, state_machines.Quote.DRAFT_to_SENT]
        distinguishing_aspect: "A REJECTED quote revised back to DRAFT (POST /quotes/{id}/revise) recomputes totals from new labor/parts; revising with labor 100000 + parts [100000] yields base 200000, discount 20000 (10% boundary), permit 20000, tax 8250, total 208250."
        test_recipe:
          setup: ["A SENT quote rejected by the homeowner (job still ASSESSED)"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c12@x.com", full_name: "C Twelve", state_code: "CA" }
              as: Anonymous
              captures: {hc12: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CCHG12", name: "C Charger 12", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc12}", address_line: "12 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc12: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${pc12}", charger_product_sku: "CCHG12" }
              as: Coordinator
              captures: {jc12: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${pc12}", install_job_id: "${jc12}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sac12: $.data.id}
            - call: "POST /site-assessments/${sac12}/accept"
              as: Coordinator
            - call: "POST /quotes"
              payload: { install_job_id: "${jc12}", labor_cents: 50000, parts_line_cents: [10000] }
              as: Coordinator
              captures: {qc12: $.data.id}
            - call: "POST /quotes/${qc12}/send"
              as: Coordinator
            - call: "POST /quotes/${qc12}/reject"
              as: Homeowner
              as_user_id: "${hc12}"
          trigger:
            - call: "POST /quotes/${qc12}/revise"
