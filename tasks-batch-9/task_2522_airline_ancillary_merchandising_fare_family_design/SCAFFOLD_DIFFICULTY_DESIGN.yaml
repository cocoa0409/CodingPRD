  - rule_id: boundary_precision_check
    instances:
      - name: demand_tier_thresholds_at_59_60_79_and_80_pct
        grounds:
          - calculations.seat_segment_effective_price
          - calculations.seat_segment_effective_price.constants.DEMAND_TIER_THRESHOLD_PCT
          - entities.SeatInventorySegment.fields.effective_price_cents
          - entities.Flight.fields.demand_tier
        boundary_type: threshold
        boundary_value: "booked_load_factor_pct == 60 (MID_AT_OR_ABOVE) and == 80 (HIGH_AT_OR_ABOVE)"
        distinguishing_aspect: |
          Both demand thresholds are AT-OR-ABOVE, walked from just below to exactly on:
          59 -> LOW (2000), 60 -> MID (2200), 79 -> MID (2200), 80 -> HIGH (2500). The segment
          starts at row 16, whose ROW_BAND_ADJUST_CENTS band is exactly 0, so the only moving
          part is the demand multiplier. A strictly-greater-than comparison reports 2000 at 60
          and 2200 at 80.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; SEAT_STANDARD (1900, category SEAT) is ACTIVE"
            - "flight AB300 carries one OPEN MID segment rows 16..18 letters A,B,C with base_price_cents 2000 (row band 0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AB300", origin: "JFK", destination: "LAX", scheduled_departure_utc: "2026-09-15T14:00:00Z", cabin_seat_total: 180 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_seat_std_id}", zone: "MID", row_start: 16, row_end: 18, seat_letters: ["A", "B", "C"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /flights/${fl_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 59, demand_index_bp: 0 }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights/${fl_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 60, demand_index_bp: 0 }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights/${fl_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 79, demand_index_bp: 0 }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights/${fl_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 80, demand_index_bp: 0 }
              as: OperationsController
              as_user_id: "oc-001"
          assert:
            - "after the 59 snapshot: Flight.${fl_id}.demand_tier == LOW and SeatInventorySegment.${seg_id}.effective_price_cents == 2000"
            - "after the 60 snapshot: demand_tier == MID and effective_price_cents == 2200"
            - "after the 79 snapshot: demand_tier == MID and effective_price_cents == 2200 (unchanged inside the band)"
            - "after the 80 snapshot: demand_tier == HIGH and effective_price_cents == 2500"
            - "SeatInventorySegment.${seg_id}.total_seats == 9 and available_seats == 9 throughout: repricing never touches inventory"

      - name: offer_session_empty_candidate_pool_returns_empty_list
