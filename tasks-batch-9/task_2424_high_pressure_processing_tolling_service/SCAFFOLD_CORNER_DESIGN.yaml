          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_dev
            - *c_get_dev
          trigger:
            - { call: "POST /deviations/${dev_id}/adjudicate", payload: { disposition: "ACCEPT", root_cause_code: "EQUIP_PUMP_FAULT" }, as: QualityManager, as_user_id: "op_bob", captures: { e_sod: $.data.error_id } }
            - *c_accept_dev
          assert:
            - "trigger step 1: HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
