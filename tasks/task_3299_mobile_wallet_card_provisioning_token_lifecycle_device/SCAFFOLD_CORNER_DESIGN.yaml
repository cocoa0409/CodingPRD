          - concurrency_rules[device-default-stale-version]
        distinguishing_aspect: "Version increments on every mutation: reading Device before and after a default-card set shows version +1; a second default-card with the pre-set version fails 412 while the fresh version succeeds."
        test_recipe:
          setup: ["Standard ACTIVE token."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - *tokA
