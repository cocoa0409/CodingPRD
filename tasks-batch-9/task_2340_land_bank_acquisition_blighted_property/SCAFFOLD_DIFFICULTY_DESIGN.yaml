              captures: { p_v3: $.data.version }
          trigger:
            - call: "POST /land-bank/properties/${p_id}/maintenance-orders"
              payload: { work_type: "MOW", contractor_id: "${ctr_id}", funding_source_id: "${fs_id}", window_start: "2026-09-04T00:00:00Z", window_end: "2026-09-06T00:00:00Z", expected_property_version: "${p_v3}" }
