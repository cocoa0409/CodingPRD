              as: PermitSpecialist
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 250, proposed_activity_type: "RIVER_FLOAT", narrative: "Second filing." }
              as: PermitSpecialist
              captures: { app_2: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_2}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_2}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/prospectuses"
              payload: { use_area_id: "${ua_id}", needs_assessment_id: "${na_id}", offered_service_days: 300, submission_deadline_date: "2027-03-31T00:00:00Z" }
              as: PermitSpecialist
              captures: { pr_id: "$.data.id" }
            - call: "POST /osup/prospectuses/${pr_id}/responses"
              payload: { application_id: "${app_2}" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/prospectuses/${pr_id}/responses"
              payload: { application_id: "${app_1}" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/prospectuses/${pr_id}/close-submissions"
              payload: {}
              as: PermitSpecialist
          trigger:
            - call: "GET /osup/use-areas/${ua_id}"
              payload: {}
              as: AuthorizedOfficer
              captures: { ua_ver: "$.data.version" }
            - call: "POST /osup/prospectuses/${pr_id}/award"
              payload: { expected_use_area_version: "${ua_ver}" }
              as: AuthorizedOfficer
            - call: "GET /osup/permit-applications/${app_1}"
              payload: {}
              as: AuthorizedOfficer
            - call: "GET /osup/permit-applications/${app_2}"
              payload: {}
              as: AuthorizedOfficer
            - call: "GET /osup/permit-applications"
              payload: { prospectus_id: "${pr_id}" }
              as: AuthorizedOfficer
          assert:
            - "both applications score final_evaluation_score 66.67: identical experience (0), guide roster (1 of 1 QUALIFIED), assurance (verified) and need_match (100.0 - 16.67) terms leave the ranking expression tied"
            - "the award names ${app_1} in awarded_application_id — the EARLIER-created application wins, even though ${app_2} filed its response first, so response order is not the tie-break either"
            - "${app_1} is AWARDED and ${app_2} is DENIED with denial_reason_code NOT_SELECTED: the loser is disposed of, not left in PROSPECTUS_RESPONDED"
            - "the prospectus-filtered listing returns both rows in created_at ASC order, ${app_1} then ${app_2}, matching the order the selector ranked them in"

      - name: fee_variants_diverge_on_the_same_accepted_set
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: fee_assessment_provisional_per_report_versus_final_aggregate
          rationale: |
            The dual-variant corner for money — both variants over one accepted set, plus the delta that
            appears when finalization switches variants — is the entire subject of the §1.8 dual-variant
            instance, which walks a report set straddling the 2500000-cent tier-1 ceiling so that
            variant A bills it wholly at 300 bp and variant B splits it across brackets.

      - name: scoring_variants_reorder_the_same_response_pool
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: prospectus_scoring_preliminary_versus_final_rank_flip
          rationale: |
            The second dual-variant pair (PRELIMINARY vs FINAL prospectus scoring, whose two axes move in
            opposite directions and flip the ranking) is driven end-to-end by the §1.8 instance,
            including the award that must follow the FINAL order rather than the PRELIMINARY one.

      - name: cascade_chains_run_to_their_full_declared_depth
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: screen_oversubscription_reroutes_sibling_depth_four
          rationale: |
            End-to-end depth and hop ordering for the cascade layer are covered by the §1.8 cascade
            instances, which drive the four-hop screening reroute, the five-hop point-threshold
            suspension and the sweep's guide-lapse chain. This stub keeps the corner recorded without
            duplicating those chains.

  # ===========================================================================
  # §1.0 consistency_model: immediate
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: acceptance_side_effects_are_visible_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints.POST /osup/trip-use-reports/{id}/accept
          - calculations.permit_compliance_derivation
        distinguishing_aspect: |
          Acceptance synthesizes a FeeAssessment and rewrites three derived permit fields at once. Under
          an immediate model the accept response itself must already show the new report state, and the
          very next reads — with no intervening write, no re-fetch loop and no settling delay — must show
          the assessment row, the incremented service_days_used_ytd, fee_delinquent true and the
          PROBATION status it forces. An implementation that defers any of these to the next write, or
          recomputes compliance only on the compliance endpoint, is caught by the ordering of these calls.
        test_recipe:
          setup:
            - "an ISSUED Alpine permit with insurance and bond on file, Rita authorized, clock 2027-06-15"
            - "no report has been filed yet, so service_days_used_ytd is 0 and no fee assessment exists"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Alpine float program." }
              as: PermitSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${app_id}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { p_id: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", carrier_name: "Cascade Mutual", coverage_amount_cents: 100000000, effective_date: "2027-01-01", expiration_date: "2029-12-31", additional_insured_endorsed: true }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permits/${p_id}/bonds"
              payload: { surety_name: "Cascade Surety", bond_amount_cents: 1000000, effective_date: "2027-01-01", expiration_date: "2029-12-31" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Rita Long", qualification_level: "LEAD", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30", seasons_experience: 7 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { g_rita: "$.data.id" }
            - call: "POST /osup/guides/${g_rita}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permits/${p_id}/guide-authorizations"
              payload: { guide_id: "${g_rita}" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/permits/${p_id}/trip-use-reports"
              payload: { period_start_date: "2027-05-15", period_end_date: "2027-06-01", service_days_used: 30, client_count: 8, gross_revenue_cents: 2000000, allowable_deductions_cents: 0 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { r_1: "$.data.id" }
          trigger:
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/trip-use-reports/${r_1}/accept"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permits/${p_id}/fee-assessments"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permits/${p_id}/noncompliance-actions"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/trip-use-reports/${r_1}"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
          assert:
            - "before acceptance the permit reads service_days_used_ytd 0, fee_delinquent false and compliance_status COMPLIANT, and the assessment collection is empty with total_count 0"
            - "the accept response itself already reports status ACCEPTED and accepted_at 2027-06-15T00:00:00Z — the transition is not queued behind a later read"
            - "the immediately following assessment read returns exactly one row for season 2027 with assessed_fee_cents 60000, variant_applied PROVISIONAL_PER_REPORT, amount_paid_cents 0 and balance_due_cents 60000, with no second call needed to materialize it"
            - "the immediately following permit read shows service_days_used_ytd 30 and fee_delinquent true, both consequences of the same accept — not of any later write"
            - "that same permit read already shows compliance_status PROBATION and open_noncompliance_points 0 on the same tick: the status is re-derived inside the accept, driven by fee_delinquent true while insurance_current and bond_current are both true"
            - "the noncompliance-action listing is empty with total_count 0, confirming the PROBATION came from the fee balance the accept created and not from any point accrual"
            - "the report read from the holder's side shows the same ACCEPTED state the specialist saw, so the write is visible to every reader at once rather than to its author first"
