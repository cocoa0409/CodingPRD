# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1898: Curriculum Approval Workflow & Catalog Publication
# 9 rules x 2 instances. Every chain replays against SCAFFOLD.yaml §1.2/§1.4/§1.5.
# Fixture conventions: logical clock defaults to 2026-08-01T00:00:00Z; all default
# term freeze dates are after it, so un-frozen terms accept submissions.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: score_provisional_vs_final_crosslisted_deactivation
        grounds:
          - calculations.substantive_change_score
          - state_machines.Proposal.SENATE_REVIEW_to_REGISTRAR_REVIEW
          - entities.Proposal.fields.substantive_change_score
        distinguishing_aspect: |
          Proposal-domain dual variant: the PROVISIONAL score (submit-time, payload-known
          factors only) is 30 for this DEACTIVATION, while the FINAL score (on entering
          REGISTRAR_REVIEW) adds CROSS_LISTING_FACTOR 15 and TEACH_OUT_FACTOR 20, yielding 65 —
          same proposal, two valid algorithm variants, different stored results, and the
          accreditor_notification_required flag flips false -> true only at FINAL.
        test_recipe:
          setup:
            - "Departments CS and MATH exist; term 2026FA (seq 1, AY 2026-2027) OPEN_FOR_PROPOSALS"
            - "Course C (CS 301, dept CS) and course M (MATH 210, dept MATH) both ACTIVE via registrar import"
            - "A PENDING CrossListing pairs C (home, dept CS) with M (partner, dept MATH)"
            - "DEACTIVATION proposal on C with declared_remaining_cohorts 3 is submitted and has reached SENATE_REVIEW"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/departments", payload: { dept_name: "Mathematics", subject_codes: ["MATH"], college: "Sciences" }, as: Registrar, as_user_id: "reg-1", captures: { dept_math: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "301", title: "Legacy Systems", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["maintain legacy code"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_c: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "MATH", course_number: "210", title: "Discrete Math", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["prove theorems"], owning_department_id: "${dept_math}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_m: $.data.id } }
            - { call: "POST /curriculum/cross-listings", payload: { home_course_id: "${course_c}", partner_course_id: "${course_m}" }, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { xl: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "DEACTIVATION", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", target_course_id: "${course_c}", declared_remaining_cohorts: 3, justification: "obsolete content" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { score_prov: $.data.substantive_change_score, flag_prov: $.data.accreditor_notification_required } }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE", rationale: "dept ok" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE", rationale: "committee ok" }, as: CurriculumCommittee, as_user_id: "cc-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE", rationale: "senate ok" }, as: FacultySenate, as_user_id: "sen-1", captures: { score_final: $.data.substantive_change_score, flag_final: $.data.accreditor_notification_required } }
          trigger:
            - { call: "GET /curriculum/proposals/${prop}", payload: {}, as: Registrar, as_user_id: "reg-1" }
          assert:
            - "captured score_prov == 30 (BASE_DEACTIVATION only: PROVISIONAL excludes cross-listing and teach-out factors)"
            - "captured flag_prov == false"
            - "captured score_final == 65 (30 + 15 cross-listed target + 20 declared_remaining_cohorts > 0)"
            - "captured flag_final == true (65 >= NOTIFY_THRESHOLD 50)"
            - "Proposal.${prop}.status == REGISTRAR_REVIEW"
      - name: teach_out_completion_enrollment_vs_catalog_variants
        grounds:
          - calculations.teach_out_completion_terms
          - entities.TeachOutPlan.fields.provisional_completion_sequence
          - entities.TeachOutPlan.fields.committed_completion_sequence
        distinguishing_aspect: |
          TeachOutPlan-domain dual variant (different entity domain from the other instance):
          ENROLLMENT_DRIVEN provisional completion = last_enrolled sequence 3 + ceil(3/2) = 5,
          while CATALOG_DRIVEN committed completion = requested effective sequence 4 + 4 = 8 —
          identical plan inputs, two valid algorithms, different term indices.
        test_recipe:
          setup:
            - "Department CS; terms seq 1..4 (2026FA, 2027SP, 2027SU all AY 2026-2027; 2027FA seq 4 AY 2027-2028)"
            - "ACTIVE course C (CS 301); DEACTIVATION proposal in DRAFT with declared_remaining_cohorts 3, requested term 2027FA (seq 4)"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2027SP", academic_year: "2026-2027", sequence_index: 2, classes_start_date: "2027-01-16", classes_end_date: "2027-05-10", proposal_freeze_at: "2027-02-01T00:00:00Z", catalog_freeze_at: "2027-05-20T00:00:00Z" }, as: Registrar, as_user_id: "reg-1" }
            - { call: "POST /curriculum/terms", payload: { term_code: "2027SU", academic_year: "2026-2027", sequence_index: 3, classes_start_date: "2027-06-01", classes_end_date: "2027-08-10", proposal_freeze_at: "2027-05-01T00:00:00Z", catalog_freeze_at: "2027-07-01T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t3: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2027FA", academic_year: "2027-2028", sequence_index: 4, classes_start_date: "2027-08-24", classes_end_date: "2027-12-15", proposal_freeze_at: "2027-10-01T00:00:00Z", catalog_freeze_at: "2027-11-01T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t4: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "301", title: "Legacy Systems", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["maintain legacy code"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_c: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "DEACTIVATION", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t4}", target_course_id: "${course_c}", declared_remaining_cohorts: 3, justification: "obsolete" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/teach-out-plan", payload: { enrolled_cohort_count: 3, cohort_sizes: [5, 5, 5], last_enrolled_term_id: "${t3}" }, as: FacultyProposer, as_user_id: "fac-001", captures: { plan: $.data.id, prov_seq: $.data.provisional_completion_sequence } }
          trigger:
            - { call: "POST /curriculum/teach-out-plans/${plan}/commit", payload: {}, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { comm_seq: $.data.committed_completion_sequence } }
          assert:
            - "captured prov_seq == 5 (ENROLLMENT_DRIVEN: 3 + ceil(3/2))"
            - "captured comm_seq == 8 (CATALOG_DRIVEN: 4 + CATALOG_TEACH_OUT_TERMS 4)"
            - "TeachOutPlan.${plan}.status == COMMITTED"
            - "provisional and committed completion sequences differ for identical plan inputs (5 != 8)"

  - rule_id: combinatorial_formula
    instances:
      - name: substantive_score_multi_factor_branching
        grounds:
          - calculations.substantive_change_score
          - validations[priority=23]
        distinguishing_aspect: |
          Mode (a) combinatorial: a formula with >= 3 inputs and non-linear interaction —
          proposal-type-dependent base (conditional branch), a ratio-triggered credit-delta
          factor (|3-4|/4 = 0.25 >= 0.25 branch fires), and a per-link factor capped at
          PREREQ_FACTOR_CAP 20 — combining to exactly 55 on the Proposal domain.
        test_recipe:
          setup:
            - "Department CS; term 2026FA OPEN_FOR_PROPOSALS"
            - "ACTIVE courses: target C (CS 301, credit_hours 4), R1 (CS 101), R2 (CS 102)"
            - "COURSE_CHANGE proposal on C: proposed_credit_hours 3 (delta exactly 0.25), workload-consistent hours, two new PREREQUISITE links to R1 and R2"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "301", title: "Systems", credit_hours: 4, contact_hours_per_week: 4, out_of_class_hours_per_week: 5, learning_outcomes: ["design systems"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_c: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "101", title: "Intro I", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["basics"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_r1: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "102", title: "Intro II", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["more basics"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_r2: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "COURSE_CHANGE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", target_course_id: "${course_c}", proposed_subject_code: "CS", proposed_course_number: "301", proposed_title: "Systems (revamped)", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["design modern systems"], justification: "rebalance", proposed_requisites: [{ requisite_course_id: "${course_r1}", requisite_type: "PREREQUISITE" }, { requisite_course_id: "${course_r2}", requisite_type: "PREREQUISITE" }] }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { score: $.data.substantive_change_score, flag: $.data.accreditor_notification_required } }
          assert:
            - "captured score == 55 (base 10 + credit-delta 25 at exactly 0.25 ratio + min(2*10, 20) prereq factor)"
            - "captured flag == true (55 >= 50)"
            - "Proposal.${prop}.status == DEPT_REVIEW"
      - name: teach_out_cost_per_cohort_rounding
        grounds:
          - calculations.teach_out_resource_cost_cents
          - entities.TeachOutPlan.fields.resource_cost_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (different mode from the other instance): nested rounding
          order is pinned — ceil per cohort THEN sum sections. cohort_sizes [16, 9] with
          SECTION_CAPACITY 15 yields ceil(16/15)+ceil(9/15) = 3 sections -> 1,200,000 cents,
          whereas the forbidden sum-first order would yield ceil(25/15)=2 -> 800,000 cents.
        test_recipe:
          setup:
            - "Department CS; terms seq 1..4 as in the teach-out variant instance"
            - "ACTIVE course C (CS 301); DEACTIVATION proposal DRAFT, declared_remaining_cohorts 2, requested term 2027FA (seq 4)"
            - "TeachOutPlan created with enrolled_cohort_count 2, cohort_sizes [16, 9], last_enrolled term 2027SU (seq 3)"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2027SU", academic_year: "2026-2027", sequence_index: 3, classes_start_date: "2027-06-01", classes_end_date: "2027-08-10", proposal_freeze_at: "2027-05-01T00:00:00Z", catalog_freeze_at: "2027-07-01T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t3: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2027FA", academic_year: "2027-2028", sequence_index: 4, classes_start_date: "2027-08-24", classes_end_date: "2027-12-15", proposal_freeze_at: "2027-10-01T00:00:00Z", catalog_freeze_at: "2027-11-01T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t4: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "301", title: "Legacy Systems", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["maintain legacy code"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_c: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "DEACTIVATION", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t4}", target_course_id: "${course_c}", declared_remaining_cohorts: 2, justification: "obsolete" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/teach-out-plan", payload: { enrolled_cohort_count: 2, cohort_sizes: [16, 9], last_enrolled_term_id: "${t3}" }, as: FacultyProposer, as_user_id: "fac-001", captures: { plan: $.data.id } }
          trigger:
            - { call: "POST /curriculum/teach-out-plans/${plan}/commit", payload: {}, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { cost: $.data.resource_cost_cents } }
          assert:
            - "captured cost == 1200000 (ceil(16/15)=2 plus ceil(9/15)=1 gives 3 sections x 400000; sum-first order would wrongly give 800000)"
            - "TeachOutPlan.${plan}.committed_completion_sequence == 8"

  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_return_resubmit_cycle
        grounds:
          - state_machines.Proposal.DEPT_REVIEW_to_RETURNED
          - state_machines.Proposal.RETURNED_to_DEPT_REVIEW
        distinguishing_aspect: |
          Cyclic machine on Proposal: DEPT_REVIEW -> RETURNED -> DEPT_REVIEW resubmission
          loop, verifiable via the append-only decision log showing the SUBMIT, RETURN,
          SUBMIT action sequence while the proposal returns to the same review stage.
        test_recipe:
          setup:
            - "Department CS; term 2026FA OPEN_FOR_PROPOSALS; minimal valid NEW_COURSE proposal created by fac-001"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "Compilers", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["build a compiler"], justification: "curriculum gap" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "RETURN", rationale: "expand outcomes" }, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { st_returned: $.data.status } }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { st_resub: $.data.status } }
            - { call: "GET /curriculum/proposals/${prop}/decisions", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { first_action: "$.data[0].action", third_action: "$.data[2].action" } }
          assert:
            - "captured st_returned == RETURNED (cycle entry)"
            - "captured st_resub == DEPT_REVIEW (loop back to the same stage, not a new state)"
            - "decision log holds exactly 3 records with actions [SUBMIT, RETURN, SUBMIT] in created_at order (captured first_action == SUBMIT, third_action == SUBMIT)"
      - name: cross_listing_diamond_with_rescind
        grounds:
          - state_machines.CrossListing.PENDING_to_PARTNER_APPROVED
          - state_machines.CrossListing.HOME_APPROVED_to_PENDING
          - state_machines.CrossListing.PARTNER_APPROVED_to_ACTIVE
        distinguishing_aspect: |
          Branching fork-join diamond on CrossListing (different entity from the cyclic
          Proposal instance): the two approval branches commute (partner-first and
          home-first both converge on ACTIVE), and the HOME_APPROVED -> PENDING rescind
          branch reverts a partially-approved listing.
        test_recipe:
          setup:
            - "Departments CS and MATH; term 2026FA; ACTIVE courses C1/C2 (dept CS) and M1/M2 (dept MATH)"
            - "XL1 pairs (C1, M1); XL2 pairs (C2, M2)"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/departments", payload: { dept_name: "Mathematics", subject_codes: ["MATH"], college: "Sciences" }, as: Registrar, as_user_id: "reg-1", captures: { dept_math: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "301", title: "C1", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { c1: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "302", title: "C2", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { c2: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "MATH", course_number: "210", title: "M1", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x"], owning_department_id: "${dept_math}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { m1: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "MATH", course_number: "211", title: "M2", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x"], owning_department_id: "${dept_math}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { m2: $.data.id } }
            - { call: "POST /curriculum/cross-listings", payload: { home_course_id: "${c1}", partner_course_id: "${m1}" }, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { xl1: $.data.id } }
            - { call: "POST /curriculum/cross-listings", payload: { home_course_id: "${c2}", partner_course_id: "${m2}" }, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { xl2: $.data.id } }
            - { call: "POST /curriculum/cross-listings/${xl1}/approve", payload: {}, as: DepartmentChair, as_user_id: "${dept_math}", captures: { xl1_mid: $.data.status } }
          trigger:
            - { call: "POST /curriculum/cross-listings/${xl1}/approve", payload: {}, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { xl1_final: $.data.status } }
            - { call: "POST /curriculum/cross-listings/${xl2}/approve", payload: {}, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { xl2_home: $.data.status } }
            - { call: "POST /curriculum/cross-listings/${xl2}/rescind", payload: {}, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { xl2_back: $.data.status } }
            - { call: "POST /curriculum/cross-listings/${xl2}/approve", payload: {}, as: DepartmentChair, as_user_id: "${dept_math}" }
            - { call: "POST /curriculum/cross-listings/${xl2}/approve", payload: {}, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { xl2_final: $.data.status } }
          assert:
            - "captured xl1_mid == PARTNER_APPROVED (partner-first branch)"
            - "captured xl1_final == ACTIVE (join after home approval)"
            - "captured xl2_home == HOME_APPROVED then captured xl2_back == PENDING (rescind reverts the fork)"
            - "captured xl2_final == ACTIVE (partner-then-home order converges to the same join)"
            - "CrossListing.${xl1}.home_approved_by == ${dept_cs} and partner_approved_by == ${dept_math}"

  - rule_id: transitive_cascade
    instances:
      - name: deactivation_activation_cascade_depth3
        grounds:
          - state_machines.Proposal.APPROVED_to_EFFECTIVE
          - state_machines.Course.ACTIVE_to_DEACTIVATING
          - state_machines.RequisiteLink.ACTIVE_to_REMOVED
          - entities.Course.fields.prerequisite_summary
        distinguishing_aspect: |
          Depth-3 chain from the activate trigger: Proposal EFFECTIVE deactivates course C
          (hop 1); C's deactivation REMOVES the ACTIVE requisite link D->C (hop 2); that
          removal itself recomputes dependent course D's prerequisite_summary and bumps
          D.version (hop 3) — each link caused by the previous mutation, not by the
          original action.
        test_recipe:
          setup:
            - "Department CS; terms T1 (2026FA seq 1) and T2 (2027SP seq 2), both OPEN initially"
            - "Course C (CS 101) ACTIVE via import; course D (CS 201) created ACTIVE via a NEW_COURSE proposal with a PREREQUISITE link D->C, activated after T1 froze"
            - "DEACTIVATION proposal on C (declared_remaining_cohorts 1, requested T2) with a COMMITTED teach-out plan, fully approved with effective term T1 (PROPOSAL_FROZEN), accreditor notification sent (FINAL score 50)"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
