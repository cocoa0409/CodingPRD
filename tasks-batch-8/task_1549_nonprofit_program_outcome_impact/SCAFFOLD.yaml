scenario: |
  Nonprofit Program Outcome & Impact Measurement (nonprofit evaluation team): logic model & indicator definition, data collection instrument & staff training, participant consent & data privacy, milestone/outcome tracking across program cycles, data quality audit & missing data handling, dashboard & funder-specific report generation, evaluation vendor coordination, continuous improvement loop from findings

domain_name: nonprofit-program-outcome-impact
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - version_pinning_on_approval
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable program name"
      - name: code
        type: string
        source: input
        description: "Unique program code; unique across all programs"
        constraints: "unique; non-empty"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see Program state machine"
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, SUSPENDED, ARCHIVED"
      - name: current_logic_model_id
        type: string
        source: system
        description: "FK -> LogicModel.id; the single APPROVED logic model of this program; null until first approval"
        default: null
      - name: current_consent_form_version
        type: integer
        source: system
        description: "Monotonic consent form version; starts at 1; incremented by consent-form-bump"
        default: 1
        constraints: ">= 1"

  - name: Funder
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Funder organization name"
      - name: code
        type: string
        source: input
        description: "Unique funder code"
        constraints: "unique; non-empty"
      - name: status
        type: enum
        source: system
        description: "Funder lifecycle; INACTIVE funders cannot receive new reports"
        default: ACTIVE
        constraints: "one of ACTIVE, INACTIVE"

  - name: LogicModel
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; owning program"
      - name: title
        type: string
        source: input
        description: "Logic model title"
      - name: description
        type: string
        source: input
        description: "Narrative: inputs, activities, outputs, outcomes, impact"
        default: ""
      - name: version_no
        type: integer
        source: system
        description: "Per-program monotonic version number; max(existing version_no)+1 at creation"
      - name: status
        type: enum
        source: system
        description: "Approval workflow state; at most one APPROVED per program"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED, SUPERSEDED"
      - name: approved_at
        type: datetime
        source: system
        description: "Set on APPROVED transition; null otherwise"
        default: null

  - name: Indicator
    parent: LogicModel
    common_fields: true
    fields:
      - name: logic_model_id
        type: string
        source: input
        description: "FK -> LogicModel.id; owning logic model"
      - name: code
        type: string
        source: input
        description: "Indicator code; unique within its logic model"
        constraints: "unique within logic_model_id"
      - name: level
        type: enum
        source: input
        description: "Logic model level this indicator measures"
        constraints: "one of OUTPUT, OUTCOME, IMPACT"
      - name: unit
        type: enum
        source: input
        description: "Measurement unit"
        constraints: "one of COUNT, PERCENT, SCORE"
      - name: direction
        type: enum
        source: input
        description: "Whether higher or lower aggregated values are better"
        constraints: "one of HIGHER_IS_BETTER, LOWER_IS_BETTER"
      - name: baseline_value
        type: number
        source: input
        description: "Baseline measurement against which attainment is computed"
      - name: target_value
        type: number
        source: input
        description: "Target value; may equal baseline (zero-guard rule applies)"
      - name: weight
        type: number
        source: input
        description: "Weight in overall impact index"
        default: 1.0
        constraints: "> 0"
      - name: measurement_frequency
        type: enum
        source: input
        description: "How often data is expected"
        constraints: "one of PER_EVENT, MONTHLY, END_OF_CYCLE"
      - name: status
        type: enum
        source: system
        description: "DRAFT while model editable; ACTIVE on model approval; RETIRED on supersede or explicit retire"
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, RETIRED"

  - name: ProgramCycle
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; owning program"
      - name: label
        type: string
        source: input
        description: "Cycle label, e.g. 2026-FALL"
      - name: enrollment_start
        type: datetime
        source: input
        description: "Enrollment window open (inclusive)"
      - name: enrollment_end
        type: datetime
        source: input
        description: "Enrollment window close (inclusive)"
      - name: cycle_start
        type: datetime
        source: input
        description: "Cycle window start; closed-interval overlap semantics on [cycle_start, cycle_end]"
      - name: cycle_end
        type: datetime
        source: input
        description: "Cycle window end; observations recorded after this are flagged is_late"
      - name: reporting_due_date
        type: datetime
        source: input
        description: "Funder reporting deadline (informational)"
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle; see ProgramCycle state machine"
        default: SETUP
        constraints: "one of SETUP, ENROLLING, ACTIVE, DATA_CLOSED, UNDER_REVIEW, REPORTED, ARCHIVED"
      - name: pinned_logic_model_id
        type: string
        source: system
        description: "FK -> LogicModel.id; logic model pinned at cycle activation; immutable thereafter"
        default: null
      - name: consent_form_version_snapshot
        type: integer
        source: system
        description: "Program.current_consent_form_version captured at cycle activation (audit trail)"
        default: null
      - name: active_participant_count
        type: integer
        source: computed
        description: "Count of participants with status == ACTIVE; maintained on every participant transition"
        default: 0
      - name: total_observation_count
        type: integer
        source: computed
        description: "Count of observations with review_status != EXCLUDED in this cycle"
        default: 0
      - name: validated_observation_count
        type: integer
        source: computed
        description: "Count of observations with review_status == VALIDATED in this cycle"
        default: 0
      - name: data_completeness_pct
        type: number
        source: computed
        description: "Cycle data completeness per calculation data_completeness_pct; null when no eligible participants"
        default: null
      - name: latest_dq_score
        type: number
        source: computed
        description: "Standard-variant data quality score of the most recent audit; refreshed on audit open, finding waive/remediate, and audit close; null until first audit"
        default: null

  - name: Participant
    parent: ProgramCycle
    common_fields: true
    fields:
      - name: program_cycle_id
        type: string
        source: input
        description: "FK -> ProgramCycle.id; cycle enrolled into"
      - name: external_ref
        type: string
        source: input
        description: "Pseudonymous participant code; unique within the cycle"
        constraints: "unique within program_cycle_id"
      - name: enrolled_at
        type: datetime
        source: system
        description: "Server timestamp of enrollment"
      - name: status
        type: enum
        source: system
        description: "See Participant state machine"
        default: ENROLLED
        constraints: "one of ENROLLED, ACTIVE, EXITED, COMPLETED, WITHDRAWN"
      - name: exit_reason
        type: string
        source: input
        description: "Reason recorded on exit transition"
        default: null
      - name: consent_status
        type: enum
        source: computed
        description: "CURRENT if latest GRANTED consent is unexpired and form_version == program.current_consent_form_version; EXPIRED if granted but time- or form-expired; NONE otherwise"
        default: NONE
        constraints: "one of NONE, CURRENT, EXPIRED"

  - name: ConsentRecord
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; consent subject"
      - name: form_version
        type: integer
        source: input
        description: "Consent form version presented; must equal program.current_consent_form_version at grant time"
      - name: scope
        type: enum
        source: input
        description: "Data use scope granted"
        constraints: "one of FULL, AGGREGATE_ONLY"
      - name: granted_at
        type: datetime
        source: system
        description: "Server timestamp of grant"
      - name: expires_at
        type: datetime
        source: input
        description: "Consent expiry instant; GRANTED consents with expires_at <= current time are treated as EXPIRED at check time"
      - name: status
        type: enum
        source: system
        description: "See ConsentRecord state machine; at most one GRANTED per participant"
        default: GRANTED
        constraints: "one of GRANTED, SUPERSEDED, REVOKED, EXPIRED"
      - name: revoked_at
        type: datetime
        source: system
        description: "Set on revoke transition"
        default: null

  - name: Instrument
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; owning program"
      - name: code
        type: string
        source: input
        description: "Instrument code; revisions share the same code within a program"
      - name: title
        type: string
        source: input
        description: "Instrument title"
      - name: instrument_version
        type: integer
        source: system
        description: "1 for the first instrument with this code in the program; +1 per new-revision"
      - name: status
        type: enum
        source: system
        description: "See Instrument state machine"
        default: DRAFT
        constraints: "one of DRAFT, PUBLISHED, RETIRED"

  - name: TrainingCertification
    parent: null
    common_fields: true
    fields:
      - name: staff_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the FieldCollector being certified; not entity-backed"
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id; instrument the collector is certified on"
      - name: certified_instrument_version
        type: integer
        source: system
        description: "Instrument.instrument_version pinned at certification time; certification goes STALE when the instrument version advances"
      - name: certified_at
        type: datetime
        source: system
        description: "Server timestamp of certification"
      - name: expires_at
        type: datetime
        source: input
        description: "Certification expiry; CERTIFIED with expires_at <= current time treated as EXPIRED at check time"
      - name: status
        type: enum
        source: system
        description: "See TrainingCertification state machine"
        default: CERTIFIED
        constraints: "one of CERTIFIED, SUSPENDED, STALE, EXPIRED"

  - name: Observation
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; observation subject"
      - name: indicator_id
        type: string
        source: input
        description: "FK -> Indicator.id; indicator measured"
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id; instrument used"
      - name: instrument_version
        type: integer
        source: system
        description: "Instrument.instrument_version pinned at record time"
      - name: value
        type: number
        source: input
        description: "Recorded measurement value"
      - name: collected_at
        type: datetime
        source: input
        description: "When the data was collected in the field (may precede recorded_at: late data)"
      - name: recorded_at
        type: datetime
        source: system
        description: "Server logical-clock timestamp of record"
      - name: collected_by_id
        type: string
        source: system
        description: "X-User-ID of the recording FieldCollector; segregation-of-duties anchor"
      - name: review_status
        type: enum
        source: system
        description: "See Observation state machine"
        default: PENDING
        constraints: "one of PENDING, VALIDATED, FLAGGED, EXCLUDED"
      - name: is_late
        type: boolean
        source: computed
        description: "true iff recorded_at > cycle.cycle_end"
        default: false
      - name: exclusion_reason
        type: string
        source: system
        description: "Reason recorded when transitioning to EXCLUDED"
        default: null

  - name: Milestone
    parent: ProgramCycle
    common_fields: true
    fields:
      - name: program_cycle_id
        type: string
        source: input
        description: "FK -> ProgramCycle.id; owning cycle"
      - name: indicator_id
        type: string
        source: input
        description: "FK -> Indicator.id; indicator evaluated; must belong to the cycle's pinned logic model"
      - name: due_date
        type: datetime
        source: input
        description: "Evaluation eligibility instant; evaluated when due_date <= current time (inclusive boundary)"
      - name: milestone_target
        type: number
        source: input
        description: "Target compared against the final-variant aggregated value"
      - name: status
        type: enum
        source: system
        description: "PENDING until evaluated"
        default: PENDING
        constraints: "one of PENDING, MET, MISSED"
      - name: evaluated_at
        type: datetime
        source: system
        description: "Set when status flips from PENDING"
        default: null

  - name: DataQualityAudit
    parent: ProgramCycle
    common_fields: true
    fields:
      - name: program_cycle_id
        type: string
        source: input
        description: "FK -> ProgramCycle.id; audited cycle"
      - name: status
        type: enum
        source: system
        description: "OPEN while findings can be recorded; CLOSED when all findings resolved; at most one OPEN per cycle"
        default: OPEN
        constraints: "one of OPEN, CLOSED"
      - name: opened_by_id
        type: string
        source: system
        description: "X-User-ID of the opening DataSteward"
      - name: completeness_pct
        type: number
        source: computed
        description: "Cycle data_completeness_pct snapshot at open (null treated as 0.00)"
        default: null
      - name: validated_pct
        type: number
        source: computed
        description: "Standard-variant validated percentage snapshot at open"
        default: null
      - name: dq_score
        type: number
        source: computed
        description: "Standard-variant data quality score; recomputed on open, finding waive/remediate, and close"
        default: null
      - name: open_finding_count
        type: integer
        source: computed
        description: "Count of findings with status == OPEN under this audit"
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Set on close transition"
        default: null

  - name: AuditFinding
    parent: DataQualityAudit
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: input
        description: "FK -> DataQualityAudit.id; owning audit"
      - name: finding_type
        type: enum
        source: input
        description: "Category of data quality issue"
        constraints: "one of MISSING_DATA, OUTLIER, UNCERTIFIED_COLLECTOR, CONSENT_LAPSE, LATE_DATA"
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; participant the finding concerns"
      - name: indicator_id
        type: string
        source: input
        description: "FK -> Indicator.id; optional indicator the finding concerns"
        default: null
      - name: observation_id
        type: string
        source: input
        description: "FK -> Observation.id; optional observation the finding concerns; null for MISSING_DATA"
        default: null
      - name: description
        type: string
        source: input
        description: "Free-text description of the finding"
        default: ""
      - name: status
        type: enum
        source: system
        description: "OPEN until WAIVED or REMEDIATED"
        default: OPEN
        constraints: "one of OPEN, WAIVED, REMEDIATED"
      - name: resolution_note
        type: string
        source: input
        description: "Reason/note supplied on waive or remediate"
        default: null

  - name: Report
    parent: ProgramCycle
    common_fields: true
    fields:
      - name: program_cycle_id
        type: string
        source: input
        description: "FK -> ProgramCycle.id; reported cycle"
      - name: funder_id
        type: string
        source: input
        description: "FK -> Funder.id; report recipient"
      - name: report_type
        type: enum
        source: input
        description: "FUNDER_* types are gated on the data-quality threshold; INTERNAL_DASHBOARD is exempt"
        constraints: "one of FUNDER_STANDARD, FUNDER_CUSTOM, INTERNAL_DASHBOARD"
      - name: status
        type: enum
        source: system
        description: "See Report state machine (includes RETURNED rework cycle and SUPERSEDED on replacement)"
        default: DRAFT
        constraints: "one of DRAFT, GENERATED, DELIVERED, ACCEPTED, RETURNED, SUPERSEDED"
      - name: snapshot_overall_impact_index
        type: number
        source: computed
        description: "Overall impact index computed and pinned at (re)generation time"
        default: null
      - name: snapshot_data_completeness_pct
        type: number
        source: computed
        description: "Data completeness pinned at (re)generation time"
        default: null
      - name: snapshot_dq_score
        type: number
        source: computed
        description: "Standard data quality score pinned at (re)generation time"
        default: null
      - name: generated_at
        type: datetime
        source: system
        description: "Set on each GENERATED transition"
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "Set on DELIVERED transition"
        default: null

  - name: VendorEngagement
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; engaged program"
      - name: vendor_name
        type: string
        source: input
        description: "Vendor organization name"
      - name: scope_program_cycle_ids
        type: array
        source: input
        description: "Array of ProgramCycle ids the vendor may access; overlap with another engagement's scope plus window overlap is a conflict"
      - name: access_start
        type: datetime
        source: input
        description: "Access window start; half-open interval [access_start, access_end) semantics"
      - name: access_end
        type: datetime
        source: input
        description: "Access window end (exclusive)"
      - name: deliverable_due
        type: datetime
        source: input
        description: "Contractual deliverable due date"
      - name: deliverable_received_at
        type: datetime
        source: system
        description: "Set when the vendor submits its deliverable"
        default: null
      - name: status
        type: enum
        source: system
        description: "See VendorEngagement state machine"
        default: PROPOSED
        constraints: "one of PROPOSED, ACTIVE, COMPLETED, TERMINATED"

  - name: ImprovementAction
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; owning program"
      - name: audit_finding_id
        type: string
        source: input
        description: "FK -> AuditFinding.id; optional originating audit finding"
        default: null
      - name: report_id
        type: string
        source: input
        description: "FK -> Report.id; optional originating returned report"
        default: null
      - name: title
        type: string
        source: input
        description: "Action title"
      - name: description
        type: string
        source: input
        description: "What will change as a result of evaluation findings"
        default: ""
      - name: status
        type: enum
        source: system
        description: "See ImprovementAction state machine (INEFFECTIVE loops back to PROPOSED)"
        default: PROPOSED
        constraints: "one of PROPOSED, APPROVED, IN_PROGRESS, IMPLEMENTED, VERIFIED_EFFECTIVE, VERIFIED_INEFFECTIVE"
      - name: effectiveness_reviewed_at
        type: datetime
        source: system
        description: "Set on verify transition"
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{id}/activate"
        actor: ProgramDirector
        preconditions: ["program.status == DRAFT"]
        side_effects: ["increments Program.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /programs/{id}/suspend"
        actor: ProgramDirector
        preconditions: ["program.status == ACTIVE"]
        side_effects: ["increments Program.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /programs/{id}/resume"
        actor: ProgramDirector
        preconditions: ["program.status == SUSPENDED"]
        side_effects: ["increments Program.version by 1"]
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /programs/{id}/archive"
        actor: ProgramDirector
        preconditions: ["program.status IN {ACTIVE, SUSPENDED}", "every ProgramCycle of this program has status == ARCHIVED"]
        side_effects: ["increments Program.version by 1"]
      - from: SUSPENDED
        to: ARCHIVED
        trigger: "POST /programs/{id}/archive"
        actor: ProgramDirector
        preconditions: ["program.status IN {ACTIVE, SUSPENDED}", "every ProgramCycle of this program has status == ARCHIVED"]
        side_effects: ["increments Program.version by 1"]

  - entity: Funder
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /funders/{id}/deactivate"
        actor: ProgramDirector
        preconditions: ["funder.status == ACTIVE"]
        side_effects: ["increments Funder.version by 1"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /funders/{id}/reactivate"
        actor: ProgramDirector
        preconditions: ["funder.status == INACTIVE"]
        side_effects: ["increments Funder.version by 1"]

  - entity: LogicModel
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /logic-models/{id}/submit"
        actor: EvaluationLead
        preconditions: ["model.status == DRAFT", "model has at least 1 Indicator"]
        side_effects: ["increments LogicModel.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /logic-models/{id}/approve (requires expected_program_version)"
        actor: EvaluationLead
        preconditions: ["model.status == SUBMITTED", "expected_program_version == program.version (OCC)"]
        side_effects:
          - "prior APPROVED LogicModel of the same program (if any) transitions APPROVED -> SUPERSEDED and increments its version by 1"
          - "each Indicator of the superseded model with status ACTIVE transitions to RETIRED and increments its version by 1"
          - "each Indicator of this model with status DRAFT transitions to ACTIVE and increments its version by 1"
          - "program.current_logic_model_id := this model's id"
          - "increments Program.version by 1 (in addition to this model's version)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /logic-models/{id}/reject"
        actor: EvaluationLead
        preconditions: ["model.status == SUBMITTED"]
        side_effects: ["increments LogicModel.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /logic-models/{id}/revise"
        actor: EvaluationLead
        preconditions: ["model.status == REJECTED"]
        side_effects: ["increments LogicModel.version by 1"]

  - entity: Indicator
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system: parent LogicModel approved"
        actor: system
        preconditions: ["parent LogicModel transitions SUBMITTED -> APPROVED"]
        side_effects: ["increments Indicator.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /indicators/{id}/retire OR system: parent LogicModel superseded"
        actor: EvaluationLead | system
        preconditions: ["indicator.status == ACTIVE"]
        side_effects: ["increments Indicator.version by 1"]

  - entity: ProgramCycle
    initial_state: SETUP
    terminal_states: [ARCHIVED]
    transitions:
      - from: SETUP
        to: ENROLLING
        trigger: "POST /cycles/{id}/open-enrollment"
        actor: ProgramDirector
        preconditions: ["cycle.status == SETUP", "program.status == ACTIVE"]
        side_effects: ["increments ProgramCycle.version by 1"]
      - from: ENROLLING
        to: SETUP
        trigger: "POST /cycles/{id}/revert-setup"
        actor: ProgramDirector
        preconditions: ["cycle.status == ENROLLING", "cycle has 0 participants"]
        side_effects: ["increments ProgramCycle.version by 1"]
      - from: ENROLLING
        to: ACTIVE
        trigger: "POST /cycles/{id}/activate"
        actor: ProgramDirector
        preconditions: ["cycle.status == ENROLLING", "program.status == ACTIVE", "program.current_logic_model_id is not null (an APPROVED LogicModel exists)"]
        side_effects:
          - "cycle.pinned_logic_model_id := program.current_logic_model_id (version pinning)"
          - "cycle.consent_form_version_snapshot := program.current_consent_form_version"
          - "increments ProgramCycle.version by 1"
      - from: ACTIVE
        to: DATA_CLOSED
        trigger: "POST /cycles/{id}/close-data"
        actor: ProgramDirector
        preconditions: ["cycle.status == ACTIVE"]
        side_effects:
          - "each Participant of this cycle with status ACTIVE transitions to COMPLETED (participant hop)"
          - "cycle.active_participant_count recomputed (becomes 0)"
          - "increments ProgramCycle.version by 1"
      - from: DATA_CLOSED
        to: ACTIVE
        trigger: "POST /cycles/{id}/reopen-data"
        actor: ProgramDirector
        preconditions: ["cycle.status == DATA_CLOSED"]
        side_effects:
          - "each Participant of this cycle with status COMPLETED transitions back to ACTIVE (compensation of close-data)"
          - "cycle.active_participant_count recomputed"
          - "increments ProgramCycle.version by 1"
      - from: DATA_CLOSED
        to: UNDER_REVIEW
        trigger: "POST /cycles/{id}/begin-review"
        actor: ProgramDirector
        preconditions: ["cycle.status == DATA_CLOSED"]
        side_effects: ["increments ProgramCycle.version by 1"]
      - from: UNDER_REVIEW
        to: REPORTED
        trigger: "POST /cycles/{id}/mark-reported"
        actor: ProgramDirector
        preconditions: ["cycle.status == UNDER_REVIEW", "no Report of this cycle has status IN {DRAFT, GENERATED, DELIVERED, RETURNED}"]
        side_effects: ["increments ProgramCycle.version by 1"]
      - from: REPORTED
        to: ARCHIVED
        trigger: "POST /cycles/{id}/archive"
        actor: ProgramDirector
        preconditions: ["cycle.status == REPORTED"]
        side_effects: ["increments ProgramCycle.version by 1"]

  - entity: Participant
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "system: a ConsentRecord for this participant becomes GRANTED with consent_status CURRENT"
        actor: system
        preconditions: ["participant.status == ENROLLED", "granted consent's form_version == program.current_consent_form_version", "granted consent's expires_at > current time"]
        side_effects: ["cycle.active_participant_count recomputed", "increments Participant.version by 1"]
      - from: ACTIVE
        to: EXITED
        trigger: "POST /participants/{id}/exit"
        actor: ProgramDirector
        preconditions: ["participant.status == ACTIVE"]
        side_effects: ["participant.exit_reason := request reason", "cycle.active_participant_count recomputed", "increments Participant.version by 1"]
      - from: EXITED
        to: ACTIVE
        trigger: "POST /participants/{id}/re-enroll"
        actor: ProgramDirector
        preconditions: ["participant.status == EXITED", "participant.consent_status == CURRENT"]
        side_effects: ["cycle.active_participant_count recomputed", "increments Participant.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: cycle close-data"
        actor: system
        preconditions: ["participant.status == ACTIVE", "owning cycle transitions ACTIVE -> DATA_CLOSED"]
        side_effects: ["cycle.active_participant_count recomputed", "increments Participant.version by 1"]
      - from: COMPLETED
        to: ACTIVE
        trigger: "system: cycle reopen-data"
        actor: system
        preconditions: ["participant.status == COMPLETED", "owning cycle transitions DATA_CLOSED -> ACTIVE"]
        side_effects: ["cycle.active_participant_count recomputed", "increments Participant.version by 1"]
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "system: consent revocation cascade (participant has no other GRANTED consent)"
        actor: system
        preconditions: ["participant.status IN {ENROLLED, ACTIVE, EXITED}"]
        side_effects:
          - "participant.consent_status := NONE"
          - "every Observation of this participant with review_status IN {PENDING, VALIDATED, FLAGGED} transitions to EXCLUDED with exclusion_reason CONSENT_REVOKED (observation hop)"
          - "cycle observation counters, data_completeness_pct, and (if an audit exists) audit dq fields recomputed (cycle hop)"
          - "cycle.active_participant_count recomputed"
          - "increments Participant.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "system: consent revocation cascade (participant has no other GRANTED consent)"
        actor: system
        preconditions: ["participant.status IN {ENROLLED, ACTIVE, EXITED}"]
        side_effects:
          - "participant.consent_status := NONE"
          - "every Observation of this participant with review_status IN {PENDING, VALIDATED, FLAGGED} transitions to EXCLUDED with exclusion_reason CONSENT_REVOKED (observation hop)"
          - "cycle observation counters, data_completeness_pct, and (if an audit exists) audit dq fields recomputed (cycle hop)"
          - "cycle.active_participant_count recomputed"
          - "increments Participant.version by 1"
      - from: EXITED
        to: WITHDRAWN
        trigger: "system: consent revocation cascade (participant has no other GRANTED consent)"
        actor: system
        preconditions: ["participant.status IN {ENROLLED, ACTIVE, EXITED}"]
        side_effects:
          - "participant.consent_status := NONE"
          - "every Observation of this participant with review_status IN {PENDING, VALIDATED, FLAGGED} transitions to EXCLUDED with exclusion_reason CONSENT_REVOKED (observation hop)"
          - "cycle observation counters, data_completeness_pct, and (if an audit exists) audit dq fields recomputed (cycle hop)"
          - "cycle.active_participant_count recomputed"
          - "increments Participant.version by 1"

  - entity: ConsentRecord
    initial_state: GRANTED
    terminal_states: [SUPERSEDED, REVOKED, EXPIRED]
    transitions:
      - from: GRANTED
        to: SUPERSEDED
        trigger: "system: a newer ConsentRecord granted for the same participant, OR program consent-form-bump advanced current_consent_form_version beyond this record's form_version"
        actor: system
        preconditions: ["consent.status == GRANTED"]
        side_effects: ["participant.consent_status recomputed", "increments ConsentRecord.version by 1"]
      - from: GRANTED
        to: REVOKED
        trigger: "POST /consents/{id}/revoke"
        actor: PrivacyOfficer
        preconditions: ["consent.status == GRANTED"]
        side_effects:
          - "consent.revoked_at := current time"
          - "if participant has no other GRANTED consent: participant transitions to WITHDRAWN (participant hop), which cascades to observations (observation hop) and cycle aggregates (cycle hop) per the Participant machine"
          - "participant.consent_status recomputed"
          - "increments ConsentRecord.version by 1"
      - from: GRANTED
        to: EXPIRED
        trigger: "system: lazy expiry evaluated at any consent check or read when expires_at <= current time"
        actor: system
        preconditions: ["consent.status == GRANTED", "consent.expires_at <= current time"]
        side_effects: ["participant.consent_status recomputed", "increments ConsentRecord.version by 1"]

  - entity: Instrument
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /instruments/{id}/publish"
        actor: EvaluationLead
        preconditions: ["instrument.status == DRAFT"]
        side_effects:
          - "the predecessor instrument (same program_id + code, instrument_version one less) with status PUBLISHED, if any, transitions to RETIRED (predecessor hop)"
          - "each TrainingCertification with instrument_id == predecessor id and status CERTIFIED transitions to STALE (certification hop)"
          - "increments Instrument.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /instruments/{id}/retire OR system: successor published"
        actor: EvaluationLead | system
        preconditions: ["instrument.status == PUBLISHED"]
        side_effects:
          - "when retired explicitly (not via successor): each TrainingCertification with instrument_id == this id and status CERTIFIED transitions to STALE"
          - "increments Instrument.version by 1"

  - entity: TrainingCertification
    initial_state: CERTIFIED
    terminal_states: [STALE, EXPIRED]
    transitions:
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /certifications/{id}/suspend"
        actor: EvaluationLead
        preconditions: ["certification.status == CERTIFIED"]
        side_effects: ["increments TrainingCertification.version by 1"]
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /certifications/{id}/reinstate"
        actor: EvaluationLead
        preconditions: ["certification.status == SUSPENDED", "certification.certified_instrument_version == instrument.instrument_version (else ERR_CERTIFICATION_STALE)"]
        side_effects: ["increments TrainingCertification.version by 1"]
      - from: CERTIFIED
        to: STALE
        trigger: "system: instrument version advanced (successor published or instrument retired)"
        actor: system
        preconditions: ["certification.status == CERTIFIED", "certification.certified_instrument_version < instrument.instrument_version OR instrument.status == RETIRED"]
        side_effects: ["increments TrainingCertification.version by 1"]
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system: lazy expiry evaluated at any certification check or read when expires_at <= current time"
        actor: system
        preconditions: ["certification.status == CERTIFIED", "certification.expires_at <= current time"]
        side_effects: ["increments TrainingCertification.version by 1"]

  - entity: Observation
    initial_state: PENDING
    terminal_states: [EXCLUDED]
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: "POST /observations/{id}/validate"
        actor: DataSteward
        preconditions: ["observation.review_status IN {PENDING, FLAGGED}", "acting DataSteward X-User-ID != observation.collected_by_id (segregation of duties)"]
        side_effects: ["cycle.validated_observation_count and cycle.total_observation_count recomputed", "cycle.data_completeness_pct recomputed", "if an OPEN or most-recent audit exists for the cycle, audit dq fields and cycle.latest_dq_score recomputed", "increments Observation.version by 1"]
      - from: FLAGGED
        to: VALIDATED
        trigger: "POST /observations/{id}/validate"
        actor: DataSteward
        preconditions: ["observation.review_status IN {PENDING, FLAGGED}", "acting DataSteward X-User-ID != observation.collected_by_id (segregation of duties)"]
        side_effects: ["cycle.validated_observation_count and cycle.total_observation_count recomputed", "cycle.data_completeness_pct recomputed", "if an OPEN or most-recent audit exists for the cycle, audit dq fields and cycle.latest_dq_score recomputed", "increments Observation.version by 1"]
      - from: PENDING
        to: FLAGGED
        trigger: "POST /observations/{id}/flag"
        actor: DataSteward
        preconditions: ["observation.review_status == PENDING"]
        side_effects: ["cycle counters and data_completeness_pct unchanged (FLAGGED stays in denominators)", "increments Observation.version by 1"]
      - from: FLAGGED
        to: EXCLUDED
        trigger: "POST /observations/{id}/exclude OR system: consent revocation cascade"
        actor: DataSteward | system
        preconditions: ["observation.review_status IN {PENDING, VALIDATED, FLAGGED}"]
        side_effects: ["observation.exclusion_reason := request reason or CONSENT_REVOKED", "cycle observation counters and data_completeness_pct recomputed", "if an audit exists for the cycle, audit dq fields and cycle.latest_dq_score recomputed", "increments Observation.version by 1"]
      - from: PENDING
        to: EXCLUDED
        trigger: "POST /observations/{id}/exclude OR system: consent revocation cascade"
        actor: DataSteward | system
        preconditions: ["observation.review_status IN {PENDING, VALIDATED, FLAGGED}"]
        side_effects: ["observation.exclusion_reason := request reason or CONSENT_REVOKED", "cycle observation counters and data_completeness_pct recomputed", "if an audit exists for the cycle, audit dq fields and cycle.latest_dq_score recomputed", "increments Observation.version by 1"]
      - from: VALIDATED
        to: EXCLUDED
        trigger: "POST /observations/{id}/exclude OR system: consent revocation cascade"
        actor: DataSteward | system
        preconditions: ["observation.review_status IN {PENDING, VALIDATED, FLAGGED}"]
        side_effects: ["observation.exclusion_reason := request reason or CONSENT_REVOKED", "cycle observation counters and data_completeness_pct recomputed", "if an audit exists for the cycle, audit dq fields and cycle.latest_dq_score recomputed", "increments Observation.version by 1"]

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [MET, MISSED]
    transitions:
      - from: PENDING
        to: MET
        trigger: "system: POST /cycles/{id}/evaluate-milestones batch"
        actor: system
        preconditions: ["milestone.status == PENDING", "milestone.due_date <= current time", "final-variant aggregated value for milestone.indicator_id exists (at least one VALIDATED observation) and satisfies the direction comparison vs milestone_target"]
        side_effects: ["milestone.evaluated_at := current time", "increments Milestone.version by 1"]
      - from: PENDING
        to: MISSED
        trigger: "system: POST /cycles/{id}/evaluate-milestones batch"
        actor: system
        preconditions: ["milestone.status == PENDING", "milestone.due_date <= current time", "final-variant aggregated value missing or fails the direction comparison vs milestone_target"]
        side_effects: ["milestone.evaluated_at := current time", "increments Milestone.version by 1"]

  - entity: DataQualityAudit
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /audits/{id}/close"
        actor: DataSteward
        preconditions: ["audit.status == OPEN", "audit.open_finding_count == 0 (no OPEN findings)"]
        side_effects: ["audit.closed_at := current time", "audit.dq_score recomputed one final time", "cycle.latest_dq_score := audit.dq_score", "increments DataQualityAudit.version by 1"]

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [WAIVED, REMEDIATED]
    transitions:
      - from: OPEN
        to: WAIVED
        trigger: "POST /findings/{id}/waive"
        actor: DataSteward
        preconditions: ["finding.status == OPEN", "parent audit.status == OPEN", "if finding.observation_id is not null: acting DataSteward X-User-ID != that observation's collected_by_id (segregation of duties)"]
        side_effects: ["finding.resolution_note := request reason", "parent audit.open_finding_count recomputed", "parent audit dq fields and cycle.latest_dq_score recomputed (penalty decreases)", "increments AuditFinding.version by 1"]
      - from: OPEN
        to: REMEDIATED
        trigger: "POST /findings/{id}/remediate"
        actor: DataSteward
        preconditions: ["finding.status == OPEN", "parent audit.status == OPEN", "if finding.observation_id is not null: acting DataSteward X-User-ID != that observation's collected_by_id (segregation of duties)"]
        side_effects: ["finding.resolution_note := request note", "parent audit.open_finding_count recomputed", "parent audit dq fields and cycle.latest_dq_score recomputed (penalty decreases)", "increments AuditFinding.version by 1"]

  - entity: Report
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /reports/{id}/generate"
        actor: EvaluationLead
        preconditions: ["report.status == DRAFT", "for report_type IN {FUNDER_STANDARD, FUNDER_CUSTOM}: cycle.latest_dq_score is not null AND >= 80.00"]
        side_effects:
          - "snapshot_overall_impact_index := overall_impact_index (final variant) at this instant"
          - "snapshot_data_completeness_pct := cycle.data_completeness_pct"
          - "snapshot_dq_score := cycle.latest_dq_score"
          - "report.generated_at := current time"
          - "increments Report.version by 1"
      - from: GENERATED
        to: DELIVERED
        trigger: "POST /reports/{id}/deliver"
        actor: EvaluationLead
        preconditions: ["report.status == GENERATED"]
        side_effects: ["report.delivered_at := current time", "increments Report.version by 1"]
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /reports/{id}/accept"
        actor: FunderViewer
        preconditions: ["report.status == DELIVERED", "acting FunderViewer X-User-ID == report.funder_id (scope)"]
        side_effects: ["increments Report.version by 1"]
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /reports/{id}/return"
        actor: FunderViewer
        preconditions: ["report.status == DELIVERED", "acting FunderViewer X-User-ID == report.funder_id (scope)"]
        side_effects: ["increments Report.version by 1"]
      - from: RETURNED
        to: GENERATED
        trigger: "POST /reports/{id}/regenerate"
        actor: EvaluationLead
        preconditions: ["report.status == RETURNED", "for report_type IN {FUNDER_STANDARD, FUNDER_CUSTOM}: cycle.latest_dq_score is not null AND >= 80.00"]
        side_effects:
          - "snapshot fields recomputed and re-pinned at this instant (rework cycle may observe changed data)"
          - "report.generated_at := current time"
          - "increments Report.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a new Report with the same (program_cycle_id, funder_id, report_type) is created"
        actor: system
        preconditions: ["report.status IN {DRAFT, GENERATED}"]
        side_effects: ["increments Report.version by 1"]
      - from: GENERATED
        to: SUPERSEDED
        trigger: "system: a new Report with the same (program_cycle_id, funder_id, report_type) is created"
        actor: system
        preconditions: ["report.status IN {DRAFT, GENERATED}"]
        side_effects: ["increments Report.version by 1"]

  - entity: VendorEngagement
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /vendor-engagements/{id}/activate"
        actor: ProgramDirector
        preconditions: ["engagement.status == PROPOSED", "program.status == ACTIVE"]
        side_effects: ["increments VendorEngagement.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /vendor-engagements/{id}/complete"
        actor: ProgramDirector
        preconditions: ["engagement.status == ACTIVE", "engagement.deliverable_received_at is not null"]
        side_effects: ["increments VendorEngagement.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /vendor-engagements/{id}/terminate"
        actor: ProgramDirector
        preconditions: ["engagement.status IN {PROPOSED, ACTIVE}"]
        side_effects: ["increments VendorEngagement.version by 1"]
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /vendor-engagements/{id}/terminate"
        actor: ProgramDirector
        preconditions: ["engagement.status IN {PROPOSED, ACTIVE}"]
        side_effects: ["increments VendorEngagement.version by 1"]

  - entity: ImprovementAction
    initial_state: PROPOSED
    terminal_states: [VERIFIED_EFFECTIVE]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /improvement-actions/{id}/approve"
        actor: ProgramDirector
        preconditions: ["action.status == PROPOSED", "acting ProgramDirector X-User-ID != action creator's X-User-ID recorded at creation (segregation of duties: proposer cannot approve)"]
        side_effects: ["increments ImprovementAction.version by 1"]
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /improvement-actions/{id}/start"
        actor: EvaluationLead
        preconditions: ["action.status == APPROVED"]
        side_effects: ["increments ImprovementAction.version by 1"]
      - from: IN_PROGRESS
        to: IMPLEMENTED
        trigger: "POST /improvement-actions/{id}/implement"
        actor: EvaluationLead
        preconditions: ["action.status == IN_PROGRESS"]
        side_effects: ["increments ImprovementAction.version by 1"]
      - from: IMPLEMENTED
        to: VERIFIED_EFFECTIVE
        trigger: "POST /improvement-actions/{id}/verify with outcome=EFFECTIVE"
        actor: ProgramDirector
        preconditions: ["action.status == IMPLEMENTED"]
        side_effects: ["action.effectiveness_reviewed_at := current time", "increments ImprovementAction.version by 1"]
      - from: IMPLEMENTED
        to: VERIFIED_INEFFECTIVE
        trigger: "POST /improvement-actions/{id}/verify with outcome=INEFFECTIVE"
        actor: ProgramDirector
        preconditions: ["action.status == IMPLEMENTED"]
        side_effects: ["action.effectiveness_reviewed_at := current time", "increments ImprovementAction.version by 1"]
      - from: VERIFIED_INEFFECTIVE
        to: PROPOSED
        trigger: "POST /improvement-actions/{id}/reopen"
        actor: EvaluationLead
        preconditions: ["action.status == VERIFIED_INEFFECTIVE"]
        side_effects: ["increments ImprovementAction.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: report-create-stale-cycle
    parent_entity: ProgramCycle
    write_endpoint: "POST /cycles/{id}/reports"
    occ_field: "expected_program_cycle_version"
    description: |
      Creating a Report against a ProgramCycle whose version has advanced since
      the client last observed it is rejected. A new Report legitimately
      supersedes the existing DRAFT or GENERATED report for the same
      (cycle, funder, report_type) triple, so a writer holding a stale cycle
      version must re-read the cycle before creating a replacement.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
  - rule_id: logic-model-approve-stale-program
    parent_entity: Program
    write_endpoint: "POST /logic-models/{id}/approve"
    occ_field: "expected_program_version"
    description: |
      Approving a LogicModel against a Program whose version has advanced since
      the client last observed it is rejected. Approval supersedes the
      program's currently APPROVED model, so a writer holding a stale program
      version would silently supersede a model it never saw; the stale writer
      must re-read the program before approving.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: indicator_attainment
    trigger: "GET /indicators/{id}/attainment with program_cycle_id and variant; also used by milestone_evaluation (FINAL variant) and overall_impact_index (FINAL variant)"
    algorithm: weighted_scoring
    formula: |
      # Step 1: aggregated value over the input set
      agg = round_half_up( mean(observation.value for obs in input_set), 2 )
      # Step 2: attainment percentage (evaluation order pinned: zero-guard first,
      # then direction branch, then clamp, then round)
      if target_value == baseline_value:
          if (direction == HIGHER_IS_BETTER and agg >= target_value) or
             (direction == LOWER_IS_BETTER and agg <= target_value):
              attainment_pct = 100.00
          else:
              attainment_pct = 0.00
      elif direction == HIGHER_IS_BETTER:
          attainment_pct = 100 * (agg - baseline_value) / (target_value - baseline_value)
      else:  # LOWER_IS_BETTER
          attainment_pct = 100 * (baseline_value - agg) / (baseline_value - target_value)
      attainment_pct = clamp(attainment_pct, 0, 150)
      attainment_pct = round_half_up(attainment_pct, 2)
    input_set: |
      Observations obs where obs.indicator_id == this indicator AND obs belongs to
      a participant of the given program cycle AND obs.participant.status != WITHDRAWN
      AND obs.review_status IN variant-dependent set:
        PROVISIONAL: {PENDING, VALIDATED}
        FINAL:       {VALIDATED}
      FLAGGED and EXCLUDED observations are never included.
    constants:
      ATTAINMENT_CAP: 150
      ATTAINMENT_FLOOR: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "mid-cycle monitoring; variant=PROVISIONAL on the attainment endpoint"
        difference: "input set includes PENDING observations in addition to VALIDATED"
      - name: FINAL
        when: "default variant; used by milestone_evaluation and overall_impact_index"
        difference: "input set restricted to VALIDATED observations only"

  - name: attainment_band
    trigger: "computed alongside indicator_attainment whenever attainment_pct is surfaced"
    algorithm: threshold
    formula: |
      if attainment_pct >= 90.00: band = GREEN
      elif attainment_pct >= 70.00: band = YELLOW
      else: band = RED
      # Boundaries are inclusive at the lower edge: exactly 90.00 is GREEN,
      # exactly 70.00 is YELLOW.
    input_set: "the attainment_pct produced by indicator_attainment"
    constants:
      BAND_GREEN_MIN_PCT: 90.00
      BAND_YELLOW_MIN_PCT: 70.00
    precision: "2 decimal places, round_half_up"

  - name: data_completeness_pct
    trigger: "recomputed on every observation create/validate/exclude, on participant status transitions, and snapshotted into DataQualityAudit.completeness_pct at audit open"
    algorithm: aggregation
    formula: |
      eligible_participants = participants of the cycle with status IN {ACTIVE, COMPLETED, EXITED}
      active_indicators = indicators of cycle.pinned_logic_model_id with status == ACTIVE
      if eligible_participants is empty or active_indicators is empty:
          data_completeness_pct = null
      else:
          covered(p) = count of DISTINCT indicator_ids in active_indicators having at least
                       one observation by p with review_status IN {PENDING, VALIDATED}
          data_completeness_pct = round_half_up(
              100 * sum(covered(p) for p in eligible_participants)
                  / (count(eligible_participants) * count(active_indicators)), 2)
    input_set: "participants of the cycle with status IN {ACTIVE, COMPLETED, EXITED}; indicators of the pinned logic model with status == ACTIVE; observations with review_status IN {PENDING, VALIDATED}"
    constants: {}
    precision: "2 decimal places, round_half_up; null when the eligible-participant set or the active-indicator set is empty"

  - name: dq_score
    trigger: "computed at DataQualityAudit open; recomputed on finding waive/remediate, on finding record, on observation validate/exclude, and at audit close; result written to audit.dq_score and cycle.latest_dq_score"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is PINNED (circular-looking dependency resolved):
      # (1) apply the finding-resolution or observation mutation that triggered
      #     this recompute, (2) compute components C, V, K from post-mutation
      #     state, (3) count OPEN findings F after the mutation, (4) weighted
      #     sum minus penalty, (5) clamp, (6) round.
      C = cycle.data_completeness_pct, or 0.00 if null
      V = round_half_up(100 * validated_observation_count
                        / total_observation_count, 2)   # 0.00 when total == 0
      K = round_half_up(100 * count(participants of cycle with consent_status == CURRENT)
                        / count(participants of cycle with status != WITHDRAWN), 2)  # 0.00 when none
      F = count of AuditFinding with parent audit of this cycle in any status
          whose own status == OPEN
      raw = 0.5 * C + 0.3 * V + 0.2 * K - 4.00 * F
      dq_score = round_half_up(clamp(raw, 0, 100), 2)
    input_set: "the cycle's participants, observations, and findings as of the recompute instant; STRICT variant additionally drops late observations from V"
    constants:
      W_COMPLETENESS: 0.5
      W_VALIDATED: 0.3
      W_CONSENT: 0.2
      FINDING_PENALTY: 4.00
      DQ_CAP: 100
    precision: "2 decimal places, round_half_up"
    variants:
      - name: STANDARD
        when: "audit.dq_score, cycle.latest_dq_score, report gate, and report snapshots"
        difference: "V uses all observations with review_status != EXCLUDED as denominator"
      - name: STRICT
        when: "surfaced on the cycle dashboard as dq_score_strict"
        difference: "V excludes observations with is_late == true from BOTH numerator and denominator; C and K unchanged"

  - name: milestone_evaluation
    trigger: "POST /cycles/{id}/evaluate-milestones (batch over PENDING milestones)"
    algorithm: threshold
    formula: |
      for each milestone m of the cycle with m.status == PENDING and
      m.due_date <= current_utc (INCLUSIVE boundary):
          agg = FINAL-variant aggregated value of indicator_attainment for
                m.indicator_id in this cycle (mean of VALIDATED observations)
          if agg is null (no VALIDATED observations):
              m.status = MISSED
          elif m.indicator.direction == HIGHER_IS_BETTER:
              m.status = MET iff agg >= m.milestone_target else MISSED
          else:  # LOWER_IS_BETTER
              m.status = MET iff agg <= m.milestone_target else MISSED
      Milestones with due_date > current_utc remain PENDING and are not counted
      in evaluated_count.
    input_set: "milestones of the cycle with status == PENDING; FINAL-variant observation set per milestone's indicator"
    constants: {}
    precision: "2 decimal places, round_half_up on the aggregated value before comparison"

  - name: overall_impact_index
    trigger: "GET /cycles/{id}/dashboard; snapshotted into Report.snapshot_overall_impact_index at (re)generation"
    algorithm: weighted_scoring
    formula: |
      # Nested rounding order is PINNED: round each weighted term BEFORE summing;
      # then divide by the renormalized weight sum; then round the quotient.
      # (Rounding each term before summing vs summing exact products then
      # rounding once produce different results — this scaffold pins per-term.)
      eligible = indicators i of cycle.pinned_logic_model_id with i.status == ACTIVE
                 AND at least one VALIDATED observation in this cycle
      if eligible is empty or sum(i.weight for i in eligible) == 0:
          overall_impact_index = null
      else:
          a_i = FINAL-variant indicator_attainment.attainment_pct for i   # already 2dp
          numerator = sum( round_half_up(a_i * i.weight, 2) for i in eligible )
          weight_sum = sum(i.weight for i in eligible)   # renormalized over eligible only
          overall_impact_index = round_half_up(numerator / weight_sum, 2)
    input_set: "indicators of the cycle's pinned logic model with status == ACTIVE and at least one VALIDATED observation in the cycle"
    constants: {}
    precision: "2 decimal places, round_half_up; per-term products rounded to 2dp before summation"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role value is a declared role name"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "role scoping: FunderViewer X-User-ID must equal the target report's funder_id (single GET, accept, return) and is restricted to its own funder on list; VendorAnalyst engagement must be ACTIVE with current time in [access_start, access_end) and the target cycle in scope_program_cycle_ids"
    error_id: ERR_SCOPE_DENIED
    http_status: 403
    applies_to: "GET /reports/{id}, GET /reports, POST /reports/{id}/accept, POST /reports/{id}/return, GET /cycles/{id}, GET /cycles/{id}/observations, GET /observations/{id}, GET /vendor-engagements/{id}, POST /vendor-engagements/{id}/submit-deliverable"
  - priority: 5
    category: existence
    check: "path parameters resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: existence
    check: "request body is well-formed and every required input field is present with the correct type and enum membership; unknown or system-managed fields supplied in the body are ignored (not rejected)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 7
    category: state
    check: "target entity is in a state from which the requested transition or child-mutation is defined (includes: cycle must be ACTIVE to record observations; logic model must be DRAFT to create/patch indicators; audit must be OPEN to record findings; funder/program/cycle parent states per transition preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/creation endpoints"
  - priority: 8
    category: business_safety
    check: "observation recording: participant.status != WITHDRAWN AND participant.consent_status == CURRENT (a GRANTED consent with expires_at <= now or form_version < program.current_consent_form_version fails)"
    error_id: ERR_CONSENT_NOT_CURRENT
    http_status: 422
    applies_to: "POST /participants/{id}/observations"
  - priority: 9
    category: business_safety
    check: "consent grant: form_version must equal program.current_consent_form_version (version pinning)"
    error_id: ERR_STALE_CONSENT_FORM
    http_status: 422
    applies_to: "POST /participants/{id}/consents"
  - priority: 10
    category: business_constraint
    check: "observation recording: instrument.status == PUBLISHED"
    error_id: ERR_INSTRUMENT_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /participants/{id}/observations"
  - priority: 11
    category: business_constraint
    check: "observation recording: indicator.status == ACTIVE AND indicator.logic_model_id == cycle.pinned_logic_model_id"
    error_id: ERR_INDICATOR_NOT_IN_MODEL
    http_status: 422
    applies_to: "POST /participants/{id}/observations"
  - priority: 12
    category: business_constraint
    check: "observation recording: a TrainingCertification exists for (staff_user_id == acting X-User-ID, instrument_id)"
    error_id: ERR_CERTIFICATION_MISSING
    http_status: 422
    applies_to: "POST /participants/{id}/observations"
  - priority: 13
    category: business_constraint
    check: "observation recording: certification.certified_instrument_version == instrument.instrument_version and certification.status not STALE"
    error_id: ERR_CERTIFICATION_STALE
    http_status: 422
    applies_to: "POST /participants/{id}/observations, POST /certifications/{id}/reinstate"
  - priority: 14
    category: business_temporal
    check: "observation recording: certification.status == CERTIFIED and certification.expires_at > current time"
    error_id: ERR_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /participants/{id}/observations"
  - priority: 15
    category: business_temporal
    check: "participant enrollment: current time within [enrollment_start, enrollment_end] inclusive"
    error_id: ERR_ENROLLMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /cycles/{id}/participants"
  - priority: 16
    category: business_temporal
    check: "cycle creation: closed-interval [cycle_start, cycle_end] does not intersect any other cycle of the same program (sharing a boundary instant IS an intersection); also enrollment_start <= enrollment_end and cycle_start <= cycle_end"
    error_id: ERR_CYCLE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /programs/{id}/cycles"
  - priority: 17
    category: business_temporal
    check: "vendor engagement creation: half-open window [access_start, access_end) overlapping another engagement of the same program with status IN {PROPOSED, ACTIVE} AND non-empty scope_program_cycle_ids intersection is a conflict (touching windows are NOT an overlap)"
    error_id: ERR_ENGAGEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /programs/{id}/vendor-engagements"
  - priority: 18
    category: business_constraint
    check: "uniqueness: program.code, funder.code globally unique; indicator.code unique within logic model; participant.external_ref unique within cycle"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /programs, POST /funders, POST /logic-models/{id}/indicators, POST /cycles/{id}/participants"
  - priority: 19
    category: business_constraint
    check: "at most one OPEN DataQualityAudit per cycle"
    error_id: ERR_AUDIT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /cycles/{id}/audits"
  - priority: 20
    category: business_constraint
    check: "segregation of duties: DataSteward cannot validate, or waive/remediate a finding on, an observation whose collected_by_id equals the steward's X-User-ID; ProgramDirector cannot approve an ImprovementAction they created"
    error_id: ERR_SEGREGATION_OF_DUTY
    http_status: 422
    applies_to: "POST /observations/{id}/validate, POST /findings/{id}/waive, POST /findings/{id}/remediate, POST /improvement-actions/{id}/approve"
  - priority: 21
    category: business_fiscal
    check: "report (re)generation of FUNDER_STANDARD/FUNDER_CUSTOM: cycle.latest_dq_score is not null AND >= 80.00"
    error_id: ERR_DQ_GATE_NOT_MET
    http_status: 422
    applies_to: "POST /reports/{id}/generate, POST /reports/{id}/regenerate"
  - priority: 22
    category: business_fiscal
    check: "report creation: funder.status == ACTIVE"
    error_id: ERR_FUNDER_INACTIVE
    http_status: 422
    applies_to: "POST /cycles/{id}/reports"
  - priority: 23
    category: state
    check: "OCC: expected_program_cycle_version == cycle.version on report creation; expected_program_version == program.version on logic-model approval"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cycles/{id}/reports, POST /logic-models/{id}/approve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time."
    roles: [ProgramDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["lazy EXPIRED evaluations for consents and certifications are re-evaluated against the new time on their next read or check"]

  # --- Programs ---
  - method: POST
    path: "/programs"
    description: "Create a program (status DRAFT, current_consent_form_version 1)"
    roles: [ProgramDirector]
    code: 201
    input: [name, code]
    output: Program
    side_effects: []
  - method: GET
    path: "/programs"
    description: "List programs with pagination and optional filters"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer, FieldCollector]
    code: 200
    input: ["status?", "current_logic_model_id?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: GET
    path: "/programs/{id}"
    description: "Get one program"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer, FieldCollector]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: POST
    path: "/programs/{id}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Program
    side_effects: ["Program transition DRAFT -> ACTIVE"]
  - method: POST
    path: "/programs/{id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Program
    side_effects: ["Program transition ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/programs/{id}/resume"
    description: "SUSPENDED -> ACTIVE"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Program
    side_effects: ["Program transition SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/programs/{id}/archive"
    description: "ACTIVE|SUSPENDED -> ARCHIVED; requires all cycles ARCHIVED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Program
    side_effects: ["Program transition to ARCHIVED"]
  - method: POST
    path: "/programs/{id}/consent-form-bump"
    description: "Advance program.current_consent_form_version by 1; every GRANTED ConsentRecord of every participant in every cycle of the program whose form_version is below the new value transitions GRANTED -> SUPERSEDED and participant consent_status is recomputed"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: Program
    side_effects: ["current_consent_form_version += 1", "ConsentRecord SUPERSEDED cascade", "participant consent_status recompute cascade", "increments Program.version by 1"]

  # --- Funders ---
  - method: POST
    path: "/funders"
    description: "Create a funder (status ACTIVE)"
    roles: [ProgramDirector]
    code: 201
    input: [name, code]
    output: Funder
    side_effects: []
  - method: GET
    path: "/funders"
    description: "List funders"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Funder[]
    side_effects: []
  - method: GET
    path: "/funders/{id}"
    description: "Get one funder"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer]
    code: 200
    input: []
    output: Funder
    side_effects: []
  - method: POST
    path: "/funders/{id}/deactivate"
    description: "ACTIVE -> INACTIVE"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Funder
    side_effects: ["Funder transition ACTIVE -> INACTIVE"]
  - method: POST
    path: "/funders/{id}/reactivate"
    description: "INACTIVE -> ACTIVE"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Funder
    side_effects: ["Funder transition INACTIVE -> ACTIVE"]

  # --- Logic models & indicators ---
  - method: POST
    path: "/programs/{id}/logic-models"
    description: "Create a DRAFT logic model; version_no = max(existing per program) + 1"
    roles: [EvaluationLead]
    code: 201
    input: [title, "description?"]
    output: LogicModel
    side_effects: []
  - method: GET
    path: "/programs/{id}/logic-models"
    description: "List logic models of a program (reverse reachability for LogicModel.program_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LogicModel[]
    side_effects: []
  - method: GET
    path: "/logic-models/{id}"
    description: "Get one logic model"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer]
    code: 200
    input: []
    output: LogicModel
    side_effects: []
  - method: POST
    path: "/logic-models/{id}/submit"
    description: "DRAFT -> SUBMITTED; requires at least one indicator"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: LogicModel
    side_effects: ["LogicModel transition DRAFT -> SUBMITTED"]
  - method: POST
    path: "/logic-models/{id}/approve"
    description: "SUBMITTED -> APPROVED under OCC on the parent program; supersedes the previously APPROVED model and retires its ACTIVE indicators"
    roles: [EvaluationLead]
    code: 200
    input: [expected_program_version]
    output: LogicModel
    side_effects: ["LogicModel transition SUBMITTED -> APPROVED", "prior APPROVED model -> SUPERSEDED", "superseded model's ACTIVE indicators -> RETIRED", "this model's DRAFT indicators -> ACTIVE", "program.current_logic_model_id updated", "increments Program.version by 1"]
  - method: POST
    path: "/logic-models/{id}/reject"
    description: "SUBMITTED -> REJECTED"
    roles: [EvaluationLead]
    code: 200
    input: ["reason?"]
    output: LogicModel
    side_effects: ["LogicModel transition SUBMITTED -> REJECTED"]
  - method: POST
    path: "/logic-models/{id}/revise"
    description: "REJECTED -> DRAFT (revision loop)"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: LogicModel
    side_effects: ["LogicModel transition REJECTED -> DRAFT"]
  - method: GET
    path: "/logic-models/{id}/indicators"
    description: "List indicators of a logic model (reverse reachability for Indicator.logic_model_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer, FieldCollector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Indicator[]
    side_effects: []
  - method: POST
    path: "/logic-models/{id}/indicators"
    description: "Create a DRAFT indicator under a DRAFT logic model"
    roles: [EvaluationLead]
    code: 201
    input: [code, level, unit, direction, baseline_value, target_value, "weight?", measurement_frequency]
    output: Indicator
    side_effects: []
  - method: GET
    path: "/indicators/{id}"
    description: "Get one indicator"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer, FieldCollector]
    code: 200
    input: []
    output: Indicator
    side_effects: []
  - method: PATCH
    path: "/indicators/{id}"
    description: "Update mutable indicator fields; only while parent logic model is DRAFT"
    roles: [EvaluationLead]
    code: 200
    input: ["code?", "level?", "unit?", "direction?", "baseline_value?", "target_value?", "weight?", "measurement_frequency?"]
    output: Indicator
    side_effects: ["increments Indicator.version by 1"]
  - method: POST
    path: "/indicators/{id}/retire"
    description: "ACTIVE -> RETIRED"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: Indicator
    side_effects: ["Indicator transition ACTIVE -> RETIRED"]
  - method: GET
    path: "/indicators/{id}/attainment"
    description: "Computed read: aggregated value, attainment_pct, band, and observation count for this indicator within a cycle; variant selects PROVISIONAL or FINAL (default FINAL)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector]
    code: 200
    input: [program_cycle_id, "variant?"]
    output: { aggregated_value: "number|null", attainment_pct: "number|null", band: "string|null", observation_count: integer }
    side_effects: []

  # --- Program cycles ---
  - method: POST
    path: "/programs/{id}/cycles"
    description: "Create a cycle (status SETUP); closed-interval window overlap check against sibling cycles"
    roles: [ProgramDirector]
    code: 201
    input: [label, enrollment_start, enrollment_end, cycle_start, cycle_end, reporting_due_date]
    output: ProgramCycle
    side_effects: []
  - method: GET
    path: "/programs/{id}/cycles"
    description: "List cycles of a program (reverse reachability for ProgramCycle.program_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer, FieldCollector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProgramCycle[]
    side_effects: []
  - method: GET
    path: "/cycles"
    description: "List cycles across programs with filters (reverse reachability for ProgramCycle.pinned_logic_model_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer, FieldCollector]
    code: 200
    input: ["program_id?", "pinned_logic_model_id?", "status?", "limit?", "offset?"]
    output: ProgramCycle[]
    side_effects: []
  - method: GET
    path: "/cycles/{id}"
    description: "Get one cycle; VendorAnalyst allowed only with an ACTIVE engagement whose window covers now and whose scope contains this cycle"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer, FieldCollector, VendorAnalyst]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: []
  - method: POST
    path: "/cycles/{id}/open-enrollment"
    description: "SETUP -> ENROLLING"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["ProgramCycle transition SETUP -> ENROLLING"]
  - method: POST
    path: "/cycles/{id}/revert-setup"
    description: "ENROLLING -> SETUP; requires zero participants"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["ProgramCycle transition ENROLLING -> SETUP"]
  - method: POST
    path: "/cycles/{id}/activate"
    description: "ENROLLING -> ACTIVE; pins the program's APPROVED logic model and consent form version"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["ProgramCycle transition ENROLLING -> ACTIVE", "pinned_logic_model_id and consent_form_version_snapshot pinned"]
  - method: POST
    path: "/cycles/{id}/close-data"
    description: "ACTIVE -> DATA_CLOSED; ACTIVE participants complete"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["ProgramCycle transition ACTIVE -> DATA_CLOSED", "participants ACTIVE -> COMPLETED"]
  - method: POST
    path: "/cycles/{id}/reopen-data"
    description: "DATA_CLOSED -> ACTIVE; COMPLETED participants return to ACTIVE (compensation)"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["ProgramCycle transition DATA_CLOSED -> ACTIVE", "participants COMPLETED -> ACTIVE"]
  - method: POST
    path: "/cycles/{id}/begin-review"
    description: "DATA_CLOSED -> UNDER_REVIEW"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["ProgramCycle transition DATA_CLOSED -> UNDER_REVIEW"]
  - method: POST
    path: "/cycles/{id}/mark-reported"
    description: "UNDER_REVIEW -> REPORTED; requires no report in DRAFT/GENERATED/DELIVERED/RETURNED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["ProgramCycle transition UNDER_REVIEW -> REPORTED"]
  - method: POST
    path: "/cycles/{id}/archive"
    description: "REPORTED -> ARCHIVED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["ProgramCycle transition REPORTED -> ARCHIVED"]
  - method: POST
    path: "/cycles/{id}/evaluate-milestones"
    description: "Batch: evaluate PENDING milestones with due_date <= current time (inclusive)"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: { evaluated_count: integer, met_count: integer, missed_count: integer }
    side_effects: ["milestone_evaluation calculation", "PENDING -> MET|MISSED transitions"]
  - method: GET
    path: "/cycles/{id}/participants"
    description: "List participants of a cycle (reverse reachability for Participant.program_cycle_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer, FieldCollector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/cycles/{id}/observations"
    description: "List observations of a cycle; VendorAnalyst scoped as on GET /cycles/{id}"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector, VendorAnalyst]
    code: 200
    input: ["review_status?", "limit?", "offset?"]
    output: Observation[]
    side_effects: []
  - method: GET
    path: "/cycles/{id}/milestones"
    description: "List milestones of a cycle (reverse reachability for Milestone.program_cycle_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []
  - method: GET
    path: "/cycles/{id}/audits"
    description: "List audits of a cycle (reverse reachability for DataQualityAudit.program_cycle_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DataQualityAudit[]
    side_effects: []
  - method: GET
    path: "/cycles/{id}/reports"
    description: "List reports of a cycle (reverse reachability for Report.program_cycle_id); FunderViewer restricted to own funder"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FunderViewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Report[]
    side_effects: []
  - method: GET
    path: "/cycles/{id}/dashboard"
    description: "Computed read: overall impact index, completeness, and both data-quality variants"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: []
    output: { overall_impact_index: "number|null", data_completeness_pct: "number|null", dq_score_standard: "number|null", dq_score_strict: "number|null" }
    side_effects: []

  # --- Participants & consents ---
  - method: POST
    path: "/cycles/{id}/participants"
    description: "Enroll a participant (status ENROLLED); cycle must be ENROLLING or ACTIVE; enrollment window and external_ref uniqueness enforced"
    roles: [ProgramDirector]
    code: 201
    input: [external_ref]
    output: Participant
    side_effects: []
  - method: GET
    path: "/participants/{id}"
    description: "Get one participant"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer, FieldCollector]
    code: 200
    input: []
    output: Participant
    side_effects: ["lazy consent EXPIRED evaluation"]
  - method: POST
    path: "/participants/{id}/exit"
    description: "ACTIVE -> EXITED"
    roles: [ProgramDirector]
    code: 200
    input: ["reason?"]
    output: Participant
    side_effects: ["Participant transition ACTIVE -> EXITED"]
  - method: POST
    path: "/participants/{id}/re-enroll"
    description: "EXITED -> ACTIVE; requires consent_status CURRENT"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Participant
    side_effects: ["Participant transition EXITED -> ACTIVE"]
  - method: GET
    path: "/participants/{id}/consents"
    description: "List consent records of a participant (reverse reachability for ConsentRecord.participant_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, PrivacyOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: ["lazy consent EXPIRED evaluation"]
  - method: GET
    path: "/participants/{id}/observations"
    description: "List observations of a participant (reverse reachability for Observation.participant_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector]
    code: 200
    input: ["review_status?", "limit?", "offset?"]
    output: Observation[]
    side_effects: []
  - method: GET
    path: "/participants/{id}/findings"
    description: "List audit findings about a participant (reverse reachability for AuditFinding.participant_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
  - method: POST
    path: "/participants/{id}/consents"
    description: "Grant consent; form_version must equal the program's current consent form version; supersedes any prior GRANTED record"
    roles: [PrivacyOfficer]
    code: 201
    input: [form_version, scope, expires_at]
    output: ConsentRecord
    side_effects: ["prior GRANTED ConsentRecord -> SUPERSEDED", "participant ENROLLED -> ACTIVE when consent current", "participant.consent_status recomputed"]
  - method: POST
    path: "/consents/{id}/revoke"
    description: "GRANTED -> REVOKED; cascades participant WITHDRAWN and observation EXCLUDED when no other GRANTED consent remains"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["ConsentRecord transition GRANTED -> REVOKED", "participant WITHDRAWN cascade", "observation EXCLUDED cascade", "cycle aggregates recomputed"]

  # --- Instruments & certifications ---
  - method: POST
    path: "/programs/{id}/instruments"
    description: "Create a DRAFT instrument (instrument_version 1 for a new code)"
    roles: [EvaluationLead]
    code: 201
    input: [code, title]
    output: Instrument
    side_effects: []
  - method: GET
    path: "/programs/{id}/instruments"
    description: "List instruments of a program (reverse reachability for Instrument.program_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Instrument[]
    side_effects: []
  - method: GET
    path: "/instruments/{id}"
    description: "Get one instrument"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector]
    code: 200
    input: []
    output: Instrument
    side_effects: []
  - method: POST
    path: "/instruments/{id}/publish"
    description: "DRAFT -> PUBLISHED; retires the PUBLISHED predecessor revision and stales its certifications"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: Instrument
    side_effects: ["Instrument transition DRAFT -> PUBLISHED", "predecessor PUBLISHED -> RETIRED", "predecessor certifications CERTIFIED -> STALE"]
  - method: POST
    path: "/instruments/{id}/new-revision"
    description: "Create a successor DRAFT instrument with instrument_version + 1 under the same program and code"
    roles: [EvaluationLead]
    code: 201
    input: []
    output: Instrument
    side_effects: []
  - method: POST
    path: "/instruments/{id}/retire"
    description: "PUBLISHED -> RETIRED; certifications pinned to it go STALE"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: Instrument
    side_effects: ["Instrument transition PUBLISHED -> RETIRED", "certifications CERTIFIED -> STALE"]
  - method: GET
    path: "/instruments/{id}/observations"
    description: "List observations recorded with an instrument (reverse reachability for Observation.instrument_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector]
    code: 200
    input: ["review_status?", "limit?", "offset?"]
    output: Observation[]
    side_effects: []
  - method: POST
    path: "/certifications"
    description: "Certify a FieldCollector on a PUBLISHED instrument; pins the instrument's current version"
    roles: [EvaluationLead]
    code: 201
    input: [staff_user_id, instrument_id, expires_at]
    output: TrainingCertification
    side_effects: ["certified_instrument_version pinned to instrument.instrument_version"]
  - method: GET
    path: "/certifications"
    description: "List certifications with filters (reverse reachability for TrainingCertification.instrument_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: ["staff_user_id?", "instrument_id?", "status?", "limit?", "offset?"]
    output: TrainingCertification[]
    side_effects: ["lazy certification EXPIRED evaluation"]
  - method: GET
    path: "/certifications/{id}"
    description: "Get one certification"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: []
    output: TrainingCertification
    side_effects: ["lazy certification EXPIRED evaluation"]
  - method: POST
    path: "/certifications/{id}/suspend"
    description: "CERTIFIED -> SUSPENDED"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: TrainingCertification
    side_effects: ["TrainingCertification transition CERTIFIED -> SUSPENDED"]
  - method: POST
    path: "/certifications/{id}/reinstate"
    description: "SUSPENDED -> CERTIFIED; fails with ERR_CERTIFICATION_STALE if the pinned version no longer matches"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: TrainingCertification
    side_effects: ["TrainingCertification transition SUSPENDED -> CERTIFIED"]

  # --- Observations ---
  - method: POST
    path: "/participants/{id}/observations"
    description: "Record an observation; heavy ordered validation (state, consent, instrument, indicator-in-pinned-model, certification present/not-stale/not-expired)"
    roles: [FieldCollector]
    code: 201
    input: [indicator_id, instrument_id, value, collected_at]
    output: Observation
    side_effects: ["instrument_version pinned", "collected_by_id := X-User-ID", "recorded_at := logical clock", "is_late computed", "cycle.total_observation_count and data_completeness_pct recomputed"]
  - method: GET
    path: "/observations/{id}"
    description: "Get one observation; VendorAnalyst scoped via the owning cycle"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector, VendorAnalyst]
    code: 200
    input: []
    output: Observation
    side_effects: []
  - method: GET
    path: "/observations"
    description: "List observations with filters (reverse reachability for Observation.indicator_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector]
    code: 200
    input: ["participant_id?", "indicator_id?", "instrument_id?", "review_status?", "limit?", "offset?"]
    output: Observation[]
    side_effects: []
  - method: POST
    path: "/observations/{id}/validate"
    description: "PENDING|FLAGGED -> VALIDATED; segregation of duties vs collected_by_id"
    roles: [DataSteward]
    code: 200
    input: []
    output: Observation
    side_effects: ["Observation transition to VALIDATED", "cycle counters, completeness, and latest_dq_score recomputed"]
  - method: POST
    path: "/observations/{id}/flag"
    description: "PENDING -> FLAGGED"
    roles: [DataSteward]
    code: 200
    input: [reason]
    output: Observation
    side_effects: ["Observation transition PENDING -> FLAGGED"]
  - method: POST
    path: "/observations/{id}/exclude"
    description: "PENDING|VALIDATED|FLAGGED -> EXCLUDED"
    roles: [DataSteward]
    code: 200
    input: [reason]
    output: Observation
    side_effects: ["Observation transition to EXCLUDED", "cycle counters, completeness, and latest_dq_score recomputed"]

  # --- Milestones ---
  - method: POST
    path: "/cycles/{id}/milestones"
    description: "Define a milestone; cycle must be ACTIVE, DATA_CLOSED, or UNDER_REVIEW and the indicator must be ACTIVE in the cycle's pinned logic model"
    roles: [EvaluationLead]
    code: 201
    input: [indicator_id, due_date, milestone_target]
    output: Milestone
    side_effects: []
  - method: GET
    path: "/milestones/{id}"
    description: "Get one milestone"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector]
    code: 200
    input: []
    output: Milestone
    side_effects: []
  - method: GET
    path: "/indicators/{id}/milestones"
    description: "List milestones referencing an indicator (reverse reachability for Milestone.indicator_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FieldCollector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []

  # --- Data quality audits & findings ---
  - method: POST
    path: "/cycles/{id}/audits"
    description: "Open an audit (cycle must be DATA_CLOSED or UNDER_REVIEW; at most one OPEN per cycle); snapshots completeness_pct/validated_pct and computes dq_score"
    roles: [DataSteward]
    code: 201
    input: []
    output: DataQualityAudit
    side_effects: ["dq_score computed (STANDARD variant)", "cycle.latest_dq_score updated"]
  - method: GET
    path: "/audits/{id}"
    description: "Get one audit"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: []
    output: DataQualityAudit
    side_effects: []
  - method: POST
    path: "/audits/{id}/close"
    description: "OPEN -> CLOSED; requires zero OPEN findings"
    roles: [DataSteward]
    code: 200
    input: []
    output: DataQualityAudit
    side_effects: ["DataQualityAudit transition OPEN -> CLOSED", "final dq_score recomputed", "cycle.latest_dq_score updated"]
  - method: GET
    path: "/audits/{id}/findings"
    description: "List findings of an audit (reverse reachability for AuditFinding.audit_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: ["status?", "finding_type?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
  - method: POST
    path: "/audits/{id}/findings"
    description: "Record a finding under an OPEN audit"
    roles: [DataSteward]
    code: 201
    input: [finding_type, participant_id, "indicator_id?", "observation_id?", "description?"]
    output: AuditFinding
    side_effects: ["audit.open_finding_count recomputed", "audit.dq_score and cycle.latest_dq_score recomputed (penalty increases)"]
  - method: GET
    path: "/findings/{id}"
    description: "Get one finding"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []
  - method: GET
    path: "/findings"
    description: "List findings with filters (reverse reachability for AuditFinding.observation_id and AuditFinding.indicator_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: ["audit_id?", "observation_id?", "participant_id?", "indicator_id?", "status?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
  - method: POST
    path: "/findings/{id}/waive"
    description: "OPEN -> WAIVED; segregation of duties when observation-linked"
    roles: [DataSteward]
    code: 200
    input: [reason]
    output: AuditFinding
    side_effects: ["AuditFinding transition OPEN -> WAIVED", "audit.open_finding_count, dq_score and cycle.latest_dq_score recomputed"]
  - method: POST
    path: "/findings/{id}/remediate"
    description: "OPEN -> REMEDIATED; segregation of duties when observation-linked"
    roles: [DataSteward]
    code: 200
    input: [note]
    output: AuditFinding
    side_effects: ["AuditFinding transition OPEN -> REMEDIATED", "audit.open_finding_count, dq_score and cycle.latest_dq_score recomputed"]

  # --- Reports ---
  - method: POST
    path: "/cycles/{id}/reports"
    description: "Create a DRAFT report under OCC on the cycle; supersedes an existing DRAFT/GENERATED report for the same (cycle, funder, report_type); cycle must be UNDER_REVIEW or REPORTED; funder must be ACTIVE"
    roles: [EvaluationLead]
    code: 201
    input: [funder_id, report_type, expected_program_cycle_version]
    output: Report
    side_effects: ["existing DRAFT/GENERATED report with same triple -> SUPERSEDED", "increments ProgramCycle.version by 1"]
  - method: GET
    path: "/reports/{id}"
    description: "Get one report; FunderViewer restricted to reports whose funder_id == X-User-ID"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FunderViewer]
    code: 200
    input: []
    output: Report
    side_effects: []
  - method: GET
    path: "/reports"
    description: "List reports with filters (reverse reachability for Report.funder_id); FunderViewer results forcibly scoped to funder_id == X-User-ID"
    roles: [ProgramDirector, EvaluationLead, DataSteward, FunderViewer]
    code: 200
    input: ["funder_id?", "program_cycle_id?", "status?", "limit?", "offset?"]
    output: Report[]
    side_effects: []
  - method: POST
    path: "/reports/{id}/generate"
    description: "DRAFT -> GENERATED; FUNDER_* types gated on latest_dq_score >= 80.00; pins snapshot fields"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: Report
    side_effects: ["Report transition DRAFT -> GENERATED", "snapshot fields pinned", "generated_at set"]
  - method: POST
    path: "/reports/{id}/deliver"
    description: "GENERATED -> DELIVERED"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: Report
    side_effects: ["Report transition GENERATED -> DELIVERED", "delivered_at set"]
  - method: POST
    path: "/reports/{id}/accept"
    description: "DELIVERED -> ACCEPTED; FunderViewer of record only"
    roles: [FunderViewer]
    code: 200
    input: []
    output: Report
    side_effects: ["Report transition DELIVERED -> ACCEPTED"]
  - method: POST
    path: "/reports/{id}/return"
    description: "DELIVERED -> RETURNED; FunderViewer of record only"
    roles: [FunderViewer]
    code: 200
    input: [reason]
    output: Report
    side_effects: ["Report transition DELIVERED -> RETURNED"]
  - method: POST
    path: "/reports/{id}/regenerate"
    description: "RETURNED -> GENERATED; recomputes and re-pins snapshot fields; FUNDER_* types re-checked against the dq gate"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: Report
    side_effects: ["Report transition RETURNED -> GENERATED", "snapshot fields re-pinned"]

  # --- Vendor engagements ---
  - method: POST
    path: "/programs/{id}/vendor-engagements"
    description: "Propose a vendor engagement; half-open window overlap + scope intersection check against PROPOSED/ACTIVE engagements of the program"
    roles: [ProgramDirector]
    code: 201
    input: [vendor_name, scope_program_cycle_ids, access_start, access_end, deliverable_due]
    output: VendorEngagement
    side_effects: []
  - method: GET
    path: "/programs/{id}/vendor-engagements"
    description: "List engagements of a program (reverse reachability for VendorEngagement.program_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VendorEngagement[]
    side_effects: []
  - method: GET
    path: "/vendor-engagements/{id}"
    description: "Get one engagement; VendorAnalyst restricted to X-User-ID == engagement id"
    roles: [ProgramDirector, EvaluationLead, DataSteward, VendorAnalyst]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: []
  - method: POST
    path: "/vendor-engagements/{id}/activate"
    description: "PROPOSED -> ACTIVE"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["VendorEngagement transition PROPOSED -> ACTIVE"]
  - method: POST
    path: "/vendor-engagements/{id}/complete"
    description: "ACTIVE -> COMPLETED; requires deliverable_received_at"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["VendorEngagement transition ACTIVE -> COMPLETED"]
  - method: POST
    path: "/vendor-engagements/{id}/terminate"
    description: "PROPOSED|ACTIVE -> TERMINATED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["VendorEngagement transition to TERMINATED"]
  - method: POST
    path: "/vendor-engagements/{id}/submit-deliverable"
    description: "Vendor submits its deliverable; engagement must be ACTIVE and current time within [access_start, access_end); X-User-ID must equal the engagement id"
    roles: [VendorAnalyst]
    code: 200
    input: [note]
    output: VendorEngagement
    side_effects: ["deliverable_received_at := current time"]

  # --- Improvement actions ---
  - method: POST
    path: "/programs/{id}/improvement-actions"
    description: "Propose an improvement action; optional links to an audit finding or a returned report"
    roles: [EvaluationLead]
    code: 201
    input: [title, "description?", "audit_finding_id?", "report_id?"]
    output: ImprovementAction
    side_effects: ["creator X-User-ID recorded for segregation of duties on approve"]
  - method: GET
    path: "/programs/{id}/improvement-actions"
    description: "List improvement actions of a program (reverse reachability for ImprovementAction.program_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ImprovementAction[]
    side_effects: []
  - method: GET
    path: "/improvement-actions/{id}"
    description: "Get one improvement action"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: []
    output: ImprovementAction
    side_effects: []
  - method: GET
    path: "/improvement-actions"
    description: "List improvement actions with filters (reverse reachability for ImprovementAction.audit_finding_id and ImprovementAction.report_id)"
    roles: [ProgramDirector, EvaluationLead, DataSteward]
    code: 200
    input: ["program_id?", "audit_finding_id?", "report_id?", "status?", "limit?", "offset?"]
    output: ImprovementAction[]
    side_effects: []
  - method: POST
    path: "/improvement-actions/{id}/approve"
    description: "PROPOSED -> APPROVED; proposer cannot approve own action (segregation of duties)"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ImprovementAction
    side_effects: ["ImprovementAction transition PROPOSED -> APPROVED"]
  - method: POST
    path: "/improvement-actions/{id}/start"
    description: "APPROVED -> IN_PROGRESS"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: ImprovementAction
    side_effects: ["ImprovementAction transition APPROVED -> IN_PROGRESS"]
  - method: POST
    path: "/improvement-actions/{id}/implement"
    description: "IN_PROGRESS -> IMPLEMENTED"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: ImprovementAction
    side_effects: ["ImprovementAction transition IN_PROGRESS -> IMPLEMENTED"]
  - method: POST
    path: "/improvement-actions/{id}/verify"
    description: "IMPLEMENTED -> VERIFIED_EFFECTIVE | VERIFIED_INEFFECTIVE per outcome"
    roles: [ProgramDirector]
    code: 200
    input: [outcome]
    output: ImprovementAction
    side_effects: ["ImprovementAction transition per outcome", "effectiveness_reviewed_at set"]
  - method: POST
    path: "/improvement-actions/{id}/reopen"
    description: "VERIFIED_INEFFECTIVE -> PROPOSED (continuous improvement loop)"
    roles: [EvaluationLead]
    code: 200
    input: []
    output: ImprovementAction
    side_effects: ["ImprovementAction transition VERIFIED_INEFFECTIVE -> PROPOSED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the declared role names"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "role recognized but not listed in the endpoint's roles (e.g., PrivacyOfficer reading observations)"
  - id: ERR_SCOPE_DENIED
    http: 403
    condition: "FunderViewer targets a report whose funder_id != X-User-ID, or VendorAnalyst targets a resource outside engagement scope/window/status"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id does not resolve to an existing resource (left-to-right)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong type, or enum value outside the declared set"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target entity not in a state from which the requested transition or child creation is defined"
  - id: ERR_CONSENT_NOT_CURRENT
    http: 422
    condition: "observation recording against a participant whose consent_status is not CURRENT (withdrawn, expired, superseded, or never granted)"
  - id: ERR_STALE_CONSENT_FORM
    http: 422
    condition: "consent grant form_version != program.current_consent_form_version"
  - id: ERR_INSTRUMENT_NOT_PUBLISHED
    http: 422
    condition: "observation recording with an instrument whose status is not PUBLISHED"
  - id: ERR_INDICATOR_NOT_IN_MODEL
    http: 422
    condition: "observation or milestone references an indicator that is not ACTIVE in the cycle's pinned logic model"
  - id: ERR_CERTIFICATION_MISSING
    http: 422
    condition: "no TrainingCertification exists for (acting collector, instrument)"
  - id: ERR_CERTIFICATION_STALE
    http: 422
    condition: "certification pinned instrument_version no longer matches the instrument's current version (or certification status STALE)"
  - id: ERR_CERTIFICATION_EXPIRED
    http: 422
    condition: "certification expires_at <= current time or status SUSPENDED/EXPIRED at recording time"
  - id: ERR_ENROLLMENT_WINDOW_CLOSED
    http: 422
    condition: "enrollment attempted outside [enrollment_start, enrollment_end]"
  - id: ERR_CYCLE_WINDOW_OVERLAP
    http: 409
    condition: "new cycle's closed interval [cycle_start, cycle_end] intersects a sibling cycle's interval (boundary touch counts)"
  - id: ERR_ENGAGEMENT_WINDOW_OVERLAP
    http: 409
    condition: "new engagement's half-open window [access_start, access_end) overlaps a PROPOSED/ACTIVE engagement of the same program with intersecting scope (boundary touch does not count)"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "program.code or funder.code already in use; indicator.code duplicated within a logic model; participant.external_ref duplicated within a cycle"
  - id: ERR_AUDIT_ALREADY_OPEN
    http: 409
    condition: "an OPEN DataQualityAudit already exists for the cycle"
  - id: ERR_SEGREGATION_OF_DUTY
    http: 422
    condition: "actor barred from acting on their own work product (steward vs own-collected observation; director vs own-proposed improvement action)"
  - id: ERR_DQ_GATE_NOT_MET
    http: 422
    condition: "FUNDER_* report (re)generation while cycle.latest_dq_score is null or < 80.00"
  - id: ERR_FUNDER_INACTIVE
    http: 422
    condition: "report creation for a funder whose status is INACTIVE"
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_program_cycle_version != cycle.version on report creation (OCC)"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version != program.version on logic-model approval (OCC)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Owns program and cycle lifecycle, enrollment, milestone evaluation, vendor engagements, funder admin, and improvement-action approval/verification"
    identity: opaque
    exclusive_operations: [program lifecycle actions, cycle lifecycle actions, enrollment, evaluate-milestones, funder deactivate/reactivate, vendor engagement lifecycle, improvement-action approve/verify, clock set]
    shared_operations: [read access to all entities except none-restricted]
  - name: EvaluationLead
    description: "Designs logic models, indicators, instruments, milestones; certifies collectors; creates/generates/delivers reports; proposes improvement actions"
    identity: opaque
    exclusive_operations: [logic model lifecycle, indicator create/patch/retire, instrument lifecycle, certifications, milestone creation, report create/generate/deliver/regenerate, improvement-action propose/start/implement/reopen]
    shared_operations: [read access to all entities]
  - name: FieldCollector
    description: "Records observations against participants using instruments they are certified on"
    identity: opaque
    exclusive_operations: [record observation]
    shared_operations: [read programs, cycles, participants, instruments, indicators, observations, milestones]
  - name: DataSteward
    description: "Reviews observations, opens/closes audits, records and resolves findings; barred from validating or resolving findings on self-collected data"
    identity: opaque
    exclusive_operations: [validate/flag/exclude observations, open/close audits, record findings, waive/remediate findings]
    shared_operations: [read access to all entities]
  - name: PrivacyOfficer
    description: "Manages consent records and consent form versioning; may NOT read observation data"
    identity: opaque
    exclusive_operations: [grant consent, revoke consent, consent-form-bump]
    shared_operations: [read programs, cycles, participants, consents, funders, logic models, indicators]
  - name: FunderViewer
    description: "External funder; sees only reports where funder_id == X-User-ID; accepts or returns delivered reports"
    identity: "entity_backed:Funder"
    exclusive_operations: [accept report, return report]
    shared_operations: [read own reports]
  - name: VendorAnalyst
    description: "External evaluation vendor user whose X-User-ID equals a VendorEngagement id; scoped read access to in-scope cycles/observations while the engagement is ACTIVE and inside its access window; submits deliverables"
    identity: "entity_backed:VendorEngagement"
    exclusive_operations: [submit deliverable]
    shared_operations: [scoped read of cycles, cycle observations, single observations, own engagement]
