    roles: [Dispatcher]
    code: 201
    input: [equipment_id, from_project_id, to_project_id, lowboy_id, depart_at, arrive_at, "assignment_id?"]
    output: TransportJob
    side_effects: ["status=PLANNED", "equipment.availability_status -> IN_TRANSIT", "increments Equipment.version by 1"]

  - method: GET
    path: "/fleet/transport-jobs/{id}"
    description: "Get one transport job"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: []
    output: TransportJob
    side_effects: []

  - method: GET
    path: "/fleet/transport-jobs"
    description: "List transport jobs (filtered-list reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["equipment_id?", "lowboy_id?", "assignment_id?", "status?", "limit?", "offset?"]
    output: TransportJob[]
    side_effects: []

  - method: POST
    path: "/fleet/transport-jobs/{id}/depart"
    description: "Depart a PLANNED haul"
    roles: [Dispatcher]
    code: 200
    input: []
    output: TransportJob
    side_effects: ["status -> EN_ROUTE", "lowboy.status -> ON_Haul"]

  - method: POST
    path: "/fleet/transport-jobs/{id}/deliver"
    description: "Deliver an EN_ROUTE haul"
    roles: [Dispatcher]
    code: 200
    input: []
    output: TransportJob
    side_effects: ["status -> DELIVERED", "equipment -> IDLE, current_site_id = to_project_id", "lowboy -> AVAILABLE", "increments Equipment.version by 1"]

  - method: POST
    path: "/fleet/transport-jobs/{id}/cancel"
    description: "Cancel a PLANNED haul"
    roles: [Dispatcher]
    code: 200
    input: []
    output: TransportJob
    side_effects: ["status -> CANCELLED", "equipment -> IDLE", "increments Equipment.version by 1"]

  # --- DamageReport ---
  - method: POST
    path: "/fleet/damage-reports"
    description: "File a damage report against the project currently renting the unit"
    roles: [FleetAdmin]
    code: 201
    input: [equipment_id, project_id, description, abuse_flag, line_items]
    output: DamageReport
    side_effects: ["status=FILED"]

  - method: GET
    path: "/fleet/damage-reports/{id}"
    description: "Get one damage report"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: []
    output: DamageReport
    side_effects: []

  - method: GET
    path: "/fleet/damage-reports"
    description: "List damage reports (filtered-list reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["equipment_id?", "project_id?", "status?", "limit?", "offset?"]
    output: DamageReport[]
    side_effects: []

  - method: POST
    path: "/fleet/damage-reports/{id}/assess"
    description: "Assess a FILED report; computes assessed_charge_cents"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: DamageReport
    side_effects: ["status -> ASSESSED", "damage_chargeback computed (per-line rounding)"]

  - method: POST
    path: "/fleet/damage-reports/{id}/dispute"
