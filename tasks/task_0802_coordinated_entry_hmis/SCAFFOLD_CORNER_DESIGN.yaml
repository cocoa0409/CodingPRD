# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Coordinated Entry & Homeless Services (HMIS) — breadth probe over §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_client_success_returns_intake
        claim_type: Creation
        grounds: [entities.Client.fields.status, endpoints]
        distinguishing_aspect: "POST /clients with the required fields returns 201 and a Client whose status is INTAKE and version is 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "New Client", dob: "1990-01-01", household_size: 3 }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
          assert:
            - "response.status == 201"
            - "Client.${cli}.status == INTAKE"
            - "Client.${cli}.version == 1"
            - "Client.${cli}.household_size == 3"

      - name: err_get_client_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", entities.Client]
        distinguishing_aspect: "GET /clients/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HMISAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: req_create_client_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Client.fields.dob]
        distinguishing_aspect: "POST /clients missing the required dob field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "No DOB" }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: req_reservation_entry_after_exit_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=4]", entities.BedReservation.fields.entry_date]
        distinguishing_aspect: "POST /bed-reservations with entry_date >= expected_exit_date returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Shelter with one bed; one client."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Bad Window", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Willow ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
          trigger:
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${sh}", entry_date: "2026-03-20", expected_exit_date: "2026-03-10", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: sm_double_checkin_from_checked_in_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.BedReservation.CHECKED_IN_to_CHECKED_OUT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /bed-reservations/{id}/check-in on a CHECKED_IN reservation returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Client with ACTIVE consent CHECKED_IN in a shelter bed."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dbl Checkin", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /shelters"
              payload: { name: "Yew ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${cli}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { res: $.data.id }
            - call: "POST /bed-reservations/${res}/check-in"
              payload: {}
              as: ShelterManager
          trigger:
            - call: "POST /bed-reservations/${res}/check-in"
              payload: {}
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: sm_activate_already_active_consent_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.ROIConsent.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE consent a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Client with an ACTIVE consent."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Idem Consent", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
          trigger:
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: sm_consent_revoke_removes_pool_entry
        claim_type: Side Effect Execution
        grounds: [state_machines.ROIConsent.ACTIVE_to_REVOKED, state_machines.PrioritizationEntry.ACTIVE_to_REMOVED]
        distinguishing_aspect: "Revoking an ACTIVE consent cascades the client's ACTIVE PrioritizationEntry to REMOVED."
        test_recipe:
          setup: ["Client active with completed assessment, ACTIVE consent, and an ACTIVE pool entry."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Rev Pool", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${cli}", self_report_points: 9 }
              as: IntakeSpecialist
              captures: { asm: $.data.id }
            - call: "POST /assessments/${asm}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /prioritization-entries"
              payload: { client_id: "${cli}" }
              as: HMISAdmin
              captures: { pe: $.data.id }
          trigger:
            - call: "POST /consents/${con}/revoke"
              payload: {}
              as: IntakeSpecialist
          assert:
            - "ROIConsent.${con}.status == REVOKED"
            - "PrioritizationEntry.${pe}.status == REMOVED"

      - name: sm_screening_resolve_diverted_outcome
        claim_type: Valid Transition
        grounds: [state_machines.DiversionScreening.OPEN_to_RESOLVED, entities.DiversionScreening.fields.outcome]
        distinguishing_aspect: "Resolving a screening with has_safe_alternative=true and is_fleeing_dv=false sets outcome DIVERTED."
        test_recipe:
          setup: ["Client with an OPEN screening (safe alternative, not fleeing DV)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Div Client", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /screenings"
              payload: { client_id: "${cli}", has_safe_alternative: true, is_fleeing_dv: false }
              as: IntakeSpecialist
              captures: { scr: $.data.id }
          trigger:
            - call: "POST /screenings/${scr}/resolve"
              payload: {}
              as: IntakeSpecialist
          assert:
            - "DiversionScreening.${scr}.status == RESOLVED"
            - "DiversionScreening.${scr}.outcome == DIVERTED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: calc_exit_outcome_negative_street
        claim_type: Correct Result
        grounds: [calculations.exit_outcome, entities.ExitRecord.fields.outcome]
        distinguishing_aspect: "A shelter exit with destination STREET yields outcome NEGATIVE."
        test_recipe:
          setup: ["Client with ACTIVE consent checked in and out of a shelter bed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /clients"
              payload: { full_name: "Neg Exit", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /shelters"
              payload: { name: "Rowan ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${cli}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { res: $.data.id }
            - call: "POST /bed-reservations/${res}/check-in"
              payload: {}
              as: ShelterManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-08T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /bed-reservations/${res}/check-out"
              payload: {}
              as: ShelterManager
          trigger:
            - call: "POST /exit-records"
              payload: { client_id: "${cli}", reservation_id: "${res}", destination: "STREET" }
              as: ShelterManager
              captures: { ex: $.data.id }
          assert:
            - "ExitRecord.${ex}.outcome == NEGATIVE"
            - "ExitRecord.${ex}.bed_nights == 3"

      - name: calc_apr_metrics_computed_read
        claim_type: Correct Result
        grounds: [calculations.apr_metrics, calculations.length_of_stay, endpoints]
        distinguishing_aspect: "With one POSITIVE shelter exit of 5 bed-nights, GET /reports/apr returns total_exited=1, positive_exit_rate=100.0, avg_length_of_stay=5.0, total_enrolled=0."
        test_recipe:
          setup: ["One completed shelter stay 2026-03-05..2026-03-10 exited to PERMANENT_HOUSING; no open enrollments."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /clients"
              payload: { full_name: "Apr Client", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /shelters"
              payload: { name: "Aspen ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${cli}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { res: $.data.id }
            - call: "POST /bed-reservations/${res}/check-in"
              payload: {}
              as: ShelterManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /bed-reservations/${res}/check-out"
              payload: {}
              as: ShelterManager
            - call: "POST /exit-records"
              payload: { client_id: "${cli}", reservation_id: "${res}", destination: "PERMANENT_HOUSING" }
              as: ShelterManager
              captures: { ex: $.data.id }
          trigger:
            - call: "GET /reports/apr"
              payload: {}
              as: HMISAdmin
          assert:
            - "response.data.total_exited == 1"
            - "response.data.positive_exit_rate == 100.0"
            - "response.data.avg_length_of_stay == 5.0"
            - "response.data.total_enrolled == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: val_duplicate_bed_label_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_BED_LABEL]"]
        distinguishing_aspect: "Adding a second bed with a label already used in the shelter returns ERR_DUPLICATE_BED_LABEL (409)."
        test_recipe:
          setup: ["Shelter with a bed labelled B1."]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Dup ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_BED_LABEL"
            - "response.status == 409"

      - name: val_duplicate_waitlist_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE_WAITLIST]"]
        distinguishing_aspect: "A second WAITING waitlist entry for the same client at the same shelter returns ERR_DUPLICATE_WAITLIST (409)."
        test_recipe:
          setup: ["Shelter with one bed; client already WAITING on that shelter's waitlist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Wait Twice", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Wait ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { shelter_id: "${sh}", client_id: "${cli}", entry_date: "2026-03-06", expected_exit_date: "2026-03-19" }
              as: ShelterManager
              captures: { wl1: $.data.id }
          trigger:
            - call: "POST /waitlist-entries"
              payload: { shelter_id: "${sh}", client_id: "${cli}", entry_date: "2026-03-06", expected_exit_date: "2026-03-19" }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_WAITLIST"
            - "response.status == 409"

      - name: val_pool_ineligible_without_consent_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_POOL_INELIGIBLE]"]
        distinguishing_aspect: "Placing a client with no ACTIVE consent into the prioritization pool returns ERR_POOL_INELIGIBLE (409)."
        test_recipe:
          setup: ["Client with only a PENDING consent (never activated)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "No Consent Pool", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
          trigger:
            - call: "POST /prioritization-entries"
              payload: { client_id: "${cli}" }
              as: HMISAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_POOL_INELIGIBLE"
            - "response.status == 409"

      - name: val_merge_same_client_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_MERGE_INVALID]"]
        distinguishing_aspect: "Merging a client into itself returns ERR_MERGE_INVALID (409) even when consent is ACTIVE."
        test_recipe:
          setup: ["One ACTIVE client with an ACTIVE consent."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Self Merge", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${cli}", self_report_points: 5 }
              as: IntakeSpecialist
              captures: { asm: $.data.id }
            - call: "POST /assessments/${asm}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
          trigger:
            - call: "POST /clients/${cli}/merge"
              payload: { duplicate_client_id: "${cli}" }
              as: HMISAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MERGE_INVALID"
            - "response.status == 409"

      - name: val_merge_without_active_consent_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=8]", "errors[ERR_CONSENT_REQUIRED]"]
        distinguishing_aspect: "Merging an ACTIVE duplicate that lacks an ACTIVE consent returns ERR_CONSENT_REQUIRED (409)."
        test_recipe:
          setup: ["Master client (INTAKE); duplicate ACTIVE (assessment) with NO consent."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Master NC", dob: "1970-01-01" }
              as: IntakeSpecialist
              captures: { master: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Dupe NC", dob: "1970-01-01" }
              as: IntakeSpecialist
              captures: { dup: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${dup}", self_report_points: 5 }
              as: IntakeSpecialist
              captures: { asm: $.data.id }
            - call: "POST /assessments/${asm}/complete"
              payload: {}
              as: IntakeSpecialist
          trigger:
            - call: "POST /clients/${master}/merge"
              payload: { duplicate_client_id: "${dup}" }
              as: HMISAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CONSENT_REQUIRED"
            - "response.status == 409"

      - name: val_caseload_full_on_accept_rejected
        claim_type: Aggregate validation
        grounds: ["validations[priority=11]", "errors[ERR_CASELOAD_FULL]", calculations.navigator_caseload]
        distinguishing_aspect: "A navigator with max_caseload=1 already holding one ACCEPTED referral gets ERR_CASELOAD_FULL (409) when accepting a second."
        test_recipe:
          setup: ["Navigator max_caseload=1; referral A already ACCEPTED; referral B PENDING for a second client."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Case A", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${ca}", self_report_points: 9 }
              as: IntakeSpecialist
              captures: { aa: $.data.id }
            - call: "POST /assessments/${aa}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${ca}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { cona: $.data.id }
            - call: "POST /consents/${cona}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /prioritization-entries"
              payload: { client_id: "${ca}" }
              as: HMISAdmin
              captures: { pea: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Case B", dob: "1990-02-02" }
              as: IntakeSpecialist
              captures: { cb: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${cb}", self_report_points: 9 }
              as: IntakeSpecialist
              captures: { ab: $.data.id }
            - call: "POST /assessments/${ab}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${cb}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { conb: $.data.id }
            - call: "POST /consents/${conb}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /prioritization-entries"
              payload: { client_id: "${cb}" }
              as: HMISAdmin
              captures: { peb: $.data.id }
            - call: "POST /housing-navigators"
              payload: { name: "Nav Cap", max_caseload: 1 }
              as: HMISAdmin
              captures: { nav: $.data.id }
            - call: "POST /referrals"
              payload: { client_id: "${ca}", prioritization_entry_id: "${pea}", navigator_id: "${nav}", psh_project_name: "Maple PSH" }
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { refa: $.data.id }
            - call: "POST /referrals/${refa}/accept"
              payload: {}
              as: HousingNavigator
              as_user_id: "${nav}"
            - call: "POST /referrals"
              payload: { client_id: "${cb}", prioritization_entry_id: "${peb}", navigator_id: "${nav}", psh_project_name: "Maple PSH" }
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { refb: $.data.id }
          trigger:
            - call: "POST /referrals/${refb}/accept"
              payload: {}
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CASELOAD_FULL"
            - "response.status == 409"

      - name: val_exit_already_exited_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "errors[ERR_ALREADY_EXITED]"]
        distinguishing_aspect: "Creating a second exit record for a reservation that already has one returns ERR_ALREADY_EXITED (409)."
        test_recipe:
          setup: ["Completed shelter stay already exited once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /clients"
              payload: { full_name: "Twice Exit", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /shelters"
              payload: { name: "Once ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${cli}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { res: $.data.id }
            - call: "POST /bed-reservations/${res}/check-in"
              payload: {}
              as: ShelterManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /bed-reservations/${res}/check-out"
              payload: {}
              as: ShelterManager
            - call: "POST /exit-records"
              payload: { client_id: "${cli}", reservation_id: "${res}", destination: "PERMANENT_HOUSING" }
              as: ShelterManager
              captures: { ex1: $.data.id }
          trigger:
            - call: "POST /exit-records"
              payload: { client_id: "${cli}", reservation_id: "${res}", destination: "STREET" }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ALREADY_EXITED"
            - "response.status == 409"

  # ---------------------------------------------------------------------------
  - section: endpoints
