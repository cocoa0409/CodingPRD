              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /road-segments/${seg_id}/access-inspections"
              payload: { inspected_at: "2026-10-01T00:00:00Z", measured_width_feet: 22, measured_max_grade_pct: 9, measured_turnout_count: 2, turnaround_present: true }
              as: RoadCommissioner
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P41" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "GET /assessment-charges?roll_id=${roll_id}"
              payload: {}
              as: AssessmentClerk
              captures: { charge_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: BoardTreasurer
            - call: "POST /assessment-charges/${charge_id}/delinquency-actions"
              payload: { action_type: "ACCESS_RESTRICTION", restriction_start_date: "2026-12-16", restriction_end_date: "2027-01-15" }
              as: BoardTreasurer
              as_user_id: "bt-user-1"
              captures: { r1_id: "$.data.id" }
            - call: "POST /assessment-charges/${charge_id}/delinquency-actions"
              payload: { action_type: "ACCESS_RESTRICTION", restriction_start_date: "2027-01-15", restriction_end_date: "2027-01-30" }
              as: BoardTreasurer
              as_user_id: "bt-user-1"
              captures: { r2_id: "$.data.id" }
            - call: "POST /assessment-charges/${charge_id}/delinquency-actions"
              payload: { action_type: "ACCESS_RESTRICTION", restriction_start_date: "2027-01-30", restriction_end_date: "2027-01-31" }
              as: BoardTreasurer
              as_user_id: "bt-user-1"
              captures: { r3_id: "$.data.id" }
          trigger:
            - call: "POST /delinquency-actions/${r1_id}/effectuate"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-user-2"
            - call: "POST /delinquency-actions/${r2_id}/effectuate"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-user-2"
            - call: "GET /members/${m1_id}"
              payload: {}
              as: BoardTreasurer
            - call: "POST /delinquency-actions/${r3_id}/effectuate"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-user-2"
              captures: { ceiling_error: "$.data.error_id" }
            - call: "POST /delinquency-actions/${r2_id}/release"
              payload: { release_reason: "owner produced a payment plan" }
              as: BoardTreasurer
              as_user_id: "bt-user-2"
            - call: "POST /delinquency-actions/${r3_id}/effectuate"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-user-2"
              captures: { ceiling_error_again: "$.data.error_id" }
            - call: "GET /members/${m1_id}"
              payload: {}
              as: BoardTreasurer
          assert:
            - "the three initiations recorded restriction_days 30, 15 and 1 from the half-open intervals, and all three actions start INITIATED with restricted_days_used still 0"
            - "R1 effectuates 200: status EFFECTIVE, lien_amount_cents 1600000, payoff_amount_cents 1615781, the charge becomes LIEN_ENCUMBERED and the member becomes standing_status LIEN_FILED with access_status RESTRICTED and restricted_days_used 30"
            - "R2 effectuates 200 at exactly the ceiling: 30 + 15 == 45 is allowed because priority 50 is inclusive, and the member reads restricted_days_used 45"
            - "with two EFFECTIVE actions the member reads encumbered_principal_cents 3200000, the declared sum of lien_amount_cents over EFFECTIVE actions rather than the 1600000 charge balance"
            - "R3 returns HTTP 409 with error_id ERR_RESTRICTION_DAYS_EXCEEDED because 45 + 1 == 46 exceeds MAX_RESTRICTION_DAYS_PER_FY, and R3 stays INITIATED with lien_amount_cents 0"
            - "releasing R2 sets it to RELEASED with lien_amount_cents 0, drops encumbered_principal_cents to 1600000, and leaves the charge LIEN_ENCUMBERED because R1 is still EFFECTIVE"
            - "restricted_days_used is still 45 after the release: RELEASED actions keep counting and the counter is never decremented"
            - "R3 effectuated again still returns HTTP 409 with error_id ERR_RESTRICTION_DAYS_EXCEEDED, and the member's access_status is still RESTRICTED from R1"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reserve_balance_conserved_across_award_cancel_and_bid_withdrawal
        grounds:
          - "calculations.reserve_balance_reconciliation"
          - "state_machines.MaintenanceProject.AWARDED_to_BID_SOLICITATION"
          - "endpoints[POST /maintenance-projects/{project_id}/cancel]"
          - "endpoints[POST /contractor-bids/{bid_id}/withdraw]"
        distinguishing_aspect: >
          reserve_balance_cents is a derived ledger with a declared closed form:
          levied contributions plus approved connection buy-ins minus the draws
          of projects in status AWARDED or COMPLETE. Six mutations exercise both
          compensation paths — a project cancellation and an awarded-bid
          withdrawal — and every intermediate balance must equal that closed
          form, ending back at exactly 600000 with zero drift after two awards,
          one cancellation, one withdrawal, one re-award and one final
          cancellation. Implementations that adjust the balance incrementally
          drift (double-returning a draw when a cancelled project's
