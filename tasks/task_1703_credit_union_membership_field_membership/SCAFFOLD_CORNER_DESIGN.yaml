      - name: enrollment_duplicate_and_funding_account_ownership
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "validations[priority=10]", "errors[ERR_PRODUCT_FUNDING_ACCOUNT_INVALID]", "errors[ERR_ALREADY_ENROLLED]"]
        distinguishing_aspect: "Funding account must belong to the enrolling member (another member's OPEN account yields 422), and a second ACTIVE enrollment in the same product yields 409."
        test_recipe:
          setup: ["members A and B, each with PRIMARY accounts; A enrolled in MONEY_MARKET (A approved 2025-07-01 with 500,000 -> SELECT at enrollment on 2026-08-01)"]
          setup_api_calls:
