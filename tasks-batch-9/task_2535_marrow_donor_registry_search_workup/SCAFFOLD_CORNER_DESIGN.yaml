        distinguishing_aspect: |
          Two typing requests of the same search are overdue at the same instant. A single sweep must
          expire BOTH - not just the first one it finds, and not just the primary's - stamping them with
          the identical expired_by_sweep_at, and a second sweep at the same instant must then be a
          complete no-op. Because both rows are only on attempt 1, the bulk expiry must NOT drag the
          promotion cascade or the STALLED transition along with it.
        test_recipe:
          setup:
            - "domestic registry (168 h), donors D1 and D5, canonical patient, DOMESTIC_ONLY search"
            - "a typing request on the PRIMARY candidate and one on the rank-2 BACKUP candidate, both raised at 2026-08-01T00:00:00Z, both with deadline 2026-08-08T00:00:00Z"
          setup_api_calls:
