      - name: seasonal_complete_setup_without_allocation_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=26]", "errors[ERR_SEASONAL_ALLOCATION_MISSING]"]
        distinguishing_aspect: "complete-setup requires a covering ACTIVE SpaceAllocation of the same category — missing allocation blocks the transition."
