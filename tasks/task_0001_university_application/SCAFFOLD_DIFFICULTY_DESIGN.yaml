  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: yield_posture_exact_0_85_ratio_maps_on_target
        grounds:
          - calculations.yield_posture_calc
          - entities.School.fields.yield_posture
        distinguishing_aspect: |
          Metric: yield_posture threshold at ratio == 0.85 exactly. Per
          calculation, ratio >= 0.85 maps to ON_TARGET (NOT >). Endpoint
          reached via POST /applications/{id}/admit. School with target=20,
          rate=0.50: 33 admits → projected=round(16.5)=17 → ratio=0.85 →
          ON_TARGET (boundary inclusive).
        test_recipe:
          setup:
            - "School with target_class_size=20, assumed_yield_rate=0.50, admitted_count=32 (projected=16, ratio=0.80 → OPEN). One more admit will bring it to ratio=0.85 exactly."
          setup_api_calls:
            # See instance combinatorial_formula/yield_posture_multi_input_nonlinear_threshold for the
            # loop chain that produces admitted_count=32. Reuse the same chain pattern
            # (omitted for brevity — the test-generator expands a 32-iteration admit loop).
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U Bdry", state_code: "OR", admission_track: "REGULAR", deadline_iso: "2026-10-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 20, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_bdry_id: $.data.id }
            # ... (loop 32 admits — same shape as Rule 2 yield_posture instance, omitted)
          trigger:
            # 33rd admit — boundary
            - call: "POST /applications/{app_bdry_33}/admit"
              payload: { expected_application_version: "${ver_bdry_33}" }
              as: AdmissionsOfficer
          assert:
            - "School.${s_bdry_id}.admitted_count == 33"
            - "School.${s_bdry_id}.yield_posture == 'ON_TARGET' (because round_half_up(33*0.50) = 17, ratio = 17/20 = 0.85, which is >=0.85 — boundary inclusive)"

      - name: essay_word_count_exact_5_word_delta_passes_6_word_delta_fails
        grounds:
          - validations[priority=12]
          - errors[ERR_WORD_COUNT_MISMATCH]
        distinguishing_aspect: |
          Metric: essay word-count tolerance ±5 — a different metric (text-token
          count) on a different endpoint (POST /essays) than instance 1 (yield
          ratio on admit). Delta of EXACTLY 5 words → accept (boundary
          inclusive). Delta of 6 words → reject with ERR_WORD_COUNT_MISMATCH.
        test_recipe:
          setup:
            - "Applicant A has a DRAFT Application app_e at school S_e."
            - "Essay text has 500 actual words."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U Wc", state_code: "AZ", admission_track: "REGULAR", deadline_iso: "2026-12-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_e_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "wc@u.edu", full_name: "WC A", gpa_unweighted: 3.50, sat_total: 1300, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_e_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${a_e_id}", school_id: "${s_e_id}" }
              as: Applicant
              as_user_id: "${a_e_id}"
              captures: { app_e_id: $.data.id }
          trigger:
            # First call: declared word_count = 505 vs actual = 500 (delta 5) → must succeed (boundary inclusive).
            - call: "POST /essays"
              payload: { application_id: "${app_e_id}", prompt_code: "P_PASS", word_count: 505, text: "TEXT_WITH_500_WORDS_PLACEHOLDER", completed: true }
              as: Applicant
              as_user_id: "${a_e_id}"
              captures: { essay_pass_id: $.data.id }
            # Second call: declared word_count = 506 vs actual = 500 (delta 6) → must fail with ERR_WORD_COUNT_MISMATCH.
            - call: "POST /essays"
              payload: { application_id: "${app_e_id}", prompt_code: "P_FAIL", word_count: 506, text: "TEXT_WITH_500_WORDS_PLACEHOLDER", completed: true }
              as: Applicant
              as_user_id: "${a_e_id}"
          assert:
            - "First /essays call succeeded with HTTP 201 (delta 5 — boundary inclusive)"
            - "Second /essays call returned HTTP 422 and response.data.error_id == 'ERR_WORD_COUNT_MISMATCH' (delta 6 — exceeds tolerance)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enroll_requires_aid_package_finalized_application_aidpackage
        grounds:
          - state_machines.Application.ADMITTED_to_ENROLLED
          - state_machines.AidPackage.DRAFT_to_FINALIZED
          - entities.AidPackage.fields.status
