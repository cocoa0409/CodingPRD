      - name: graph_topology_many_hop_reachability_from_observation_to_advance
        claim_type: graph
        excluded_because:
          difficulty_instance: audit_reconcile_cascades_five_hops_from_observation_to_voided_advance
          rationale: "The entity_topology graph claim is that a change at one node is reachable across the junction edges (observation -> incident -> unit -> dealer -> credit line -> advance). The difficulty instance already walks that exact five-hop path and asserts every intermediate node, which subsumes a lighter breadth check."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: funding_advance_reject_moves_requested_to_rejected
        claim_type: valid_transition
        grounds:
          - state_machines.FundingAdvance.REQUESTED_to_REJECTED
          - endpoints["POST /floorplan/funding-advances/{id}/reject"]
        distinguishing_aspect: "Rejecting a REQUESTED advance parks it in REJECTED with the reason code recorded, returns the unit from PENDING_FUNDING to REGISTERED, and leaves the credit line's money fields untouched at zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ACTIVE Dealer with an ACTIVE CreditLine and one NEW unit at title LENDER_HELD holding a single REQUESTED FundingAdvance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Reject Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "ND" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c12_d: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c12_d}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c12_cl: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${c12_cl}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${c12_d}", credit_line_id: "${c12_cl}", vin: "1CRNREJECTUNIT001", inventory_class: "NEW", invoice_amount_cents: 3000000, invoice_date: "2026-08-01", title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${c12_d}"
              captures: { c12_u: "$.data.id" }
            - call: "POST /floorplan/units/${c12_u}/title-custody"
              payload: { new_custody_status: "LENDER_HELD", document_reference: "MSO-C12" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units/${c12_u}/funding-advances"
              payload: { requested_amount_cents: 3000000, dealer_invoice_reference: "INV-C12" }
              as: DealerPrincipal
              as_user_id: "${c12_d}"
              captures: { c12_a: "$.data.id" }
          trigger:
            - call: "POST /floorplan/funding-advances/${c12_a}/reject"
