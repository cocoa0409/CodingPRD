      - name: ventilation_requirement_is_read_from_the_discipline_not_the_studio
        claim_type: cross_entity_validation
        grounds: ["validations[priority 37]", "errors[ERR_VENTILATION_INSUFFICIENT]", "constants.VENTILATION_RANK", "entities.Discipline.required_ventilation_class"]
        distinguishing_aspect: "The very same studio is legal for one residency and illegal for another: validity is a RANK COMPARISON between two other entities' configuration (the Studio's ventilation_class and the residency's Discipline.required_ventilation_class), with neither the studio nor the residency changing between the two calls. Because NONE is the Discipline default, rank 0 >= 0 must pass - an implementation that treats NONE as 'unset' and demands ventilation everywhere fails the positive leg."
        test_recipe:
          setup: ["One OPEN cycle with TWO disciplines that differ only in ventilation: CLAYWORK requires capability KILN with required_ventilation_class NONE, and ETCH requires capability KILN with required_ventilation_class FUME_HOOD. Two applicants, one invited residency in each discipline, both scheduled 2026-11-02 for 8 weeks. One studio S-N: capability ['KILN'], ventilation_class NONE, max_concurrent_residents 2 (so no interval or headcount rule interferes)."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
