        distinguishing_aspect: "Passes exist only for timed-entry museums: reserving against a museum with requires_timed_pass false fails 409 ERR_TIMED_PASS_NOT_USED_HERE rather than issuing a meaningless pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One walk-in museum (requires_timed_pass false)."
          setup_api_calls:
