              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-M1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "POST /tariffs/${tar_id}/retire"
              payload: {}
              as: BillingOperator
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "issue returns ERR_TARIFF_NOT_ACTIVE (http 409)"
            - "Bill.${bill_id}.status == DRAFT (unchanged)"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bill_period_overlap_half_open_no_buffer
        grounds:
          - validations[priority=15]
          - entities.Bill.fields.period_start
          - entities.Bill.fields.period_end
          - errors[ERR_BILL_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Bill-period interval semantics: half-open [period_start, period_end) per account, NO buffer,
          adjacency allowed. A second bill [2026-01-15,2026-02-15) overlapping an existing non-VOID
          [2026-01-01,2026-02-01) is rejected; an adjacent [2026-02-01,2026-03-01) is accepted.
        test_recipe:
          setup:
            - "Account N with an existing non-VOID bill over [2026-01-01,2026-02-01)"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-OVL-N", name: "Overlap N", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Overlap Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill1_id: $.data.id }
          trigger:
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-15T00:00:00Z", period_end: "2026-02-15T00:00:00Z", due_date: "2026-03-05T00:00:00Z" }
              as: BillingOperator
              captures: { err: $.data.error_id }
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", due_date: "2026-03-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill3_id: $.data.id }
          assert:
            - "overlapping bill [2026-01-15,2026-02-15) returns ERR_BILL_PERIOD_OVERLAP (http 409)"
            - "adjacent bill [2026-02-01,2026-03-01) succeeds (status DRAFT) — adjacency allowed under half-open semantics"

      - name: meter_read_interval_overlap_fixed_hour_slots
        grounds:
          - validations[priority=16]
          - entities.MeterRead.fields.interval_start
          - entities.MeterRead.fields.interval_end
          - errors[ERR_READ_OVERLAP]
        distinguishing_aspect: |
          MeterRead interval semantics differ from Bill: each read is a FIXED 1-hour slot on a meter
          (interval_end == interval_start+60min, lint enforced), and any overlap — including a duplicate
          identical slot — is rejected. Different resource entity (Meter) and different arithmetic
          (fixed-width slot equality) than the variable-width Bill period.
        test_recipe:
          setup:
            - "Account O + meter with an existing read [2026-01-05T16:00,17:00)"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-OVL-O", name: "Overlap O", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "ReadOverlap Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-O1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
          trigger:
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 3.0, export_kwh: 0.0 }
              as: BillingOperator
              captures: { err: $.data.error_id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T17:00:00Z", interval_end: "2026-01-05T18:00:00Z", import_kwh: 1.0, export_kwh: 0.0 }
              as: BillingOperator
          assert:
            - "duplicate slot [16:00,17:00) returns ERR_READ_OVERLAP (http 409)"
            - "adjacent slot [17:00,18:00) succeeds"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_conserves_net_metering_credit_pool
        grounds:
          - state_machines.Bill.ISSUED_to_VOID
          - calculations.price_bill
          - entities.Account.fields.net_metering_credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity = net-metering credit pool. INVARIANT pinned as formula:
          Account.net_metering_credit_balance_cents AFTER (issue then void) ==
          export_credit produced by the period's reads (the pre-issue balance was 0, and the issue+void
          must net to the full export_credit, with NONE consumed). Issue debits the applied credit;
          void refunds exactly that applied credit; the pool returns to balance.
        test_recipe:
          setup:
            - "Account P + meter with read import 10 export 2000 OFF_PEAK; issue consumes 96 credit, void refunds it"
            - "pre-issue net_metering_credit_balance == 0; export_credit == 20000; applied == 96; carryover after issue == 19904"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-INV-P", name: "Invariant P", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Invariant Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-P1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T00:00:00Z", interval_end: "2026-01-05T01:00:00Z", import_kwh: 10.0, export_kwh: 2000.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
              captures: { applied: $.data.net_metering_credit_applied_cents }
          trigger:
            - call: "POST /bills/${bill_id}/void"
              payload: {}
              as: BillingOperator
          assert:
            - "after issue: Account.${acct_id}.net_metering_credit_balance_cents == 19904"
            - "Bill.${bill_id}.net_metering_credit_applied_cents == 96"
            - "after void: Account.${acct_id}.net_metering_credit_balance_cents == 20000 (== export_credit, pool conserved)"

      - name: payment_reverse_conserves_account_balance
        grounds:
          - state_machines.Bill.PARTIALLY_PAID_to_ISSUED
          - calculations.payment_waterfall
          - entities.Account.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = account balance_cents (a different conserved quantity than the credit
          pool). INVARIANT pinned as formula: balance_cents AFTER (payment then reverse) ==
          balance_cents BEFORE the payment. Payment reduces balance by amount_cents; reversal restores
          it; net drift must be 0.
        test_recipe:
          setup:
            - "Account Q with one issued bill total_due 2756, balance == 2756; pay 1000 (balance 1756, bill PARTIALLY_PAID), then reverse"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-INV-Q", name: "Invariant Q", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Invariant Q Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-Q1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T17:00:00Z", interval_end: "2026-01-05T18:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T18:00:00Z", interval_end: "2026-01-05T19:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T07:00:00Z", interval_end: "2026-01-05T08:00:00Z", import_kwh: 4.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
            - call: "POST /payments"
              payload: { account_id: "${acct_id}", amount_cents: 1000, method: "ACH" }
              as: Customer
              as_user_id: "${acct_id}"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: BillingOperator
          assert:
            - "before payment: Account.${acct_id}.balance_cents == 2756"
            - "after payment 1000: Account.${acct_id}.balance_cents == 1756 and Bill.${bill_id}.status == PARTIALLY_PAID"
            - "after reverse: Account.${acct_id}.balance_cents == 2756 and Bill.${bill_id}.status == ISSUED"
