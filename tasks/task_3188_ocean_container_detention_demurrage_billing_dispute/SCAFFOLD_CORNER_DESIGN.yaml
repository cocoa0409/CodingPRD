# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Ocean Container Detention & Demurrage Billing Dispute
# Breadth probe over every §1.1–§1.7 claim not already covered by §1.8.
# Fixture calendar identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml (clock default
# 2026-09-01T00:00:00Z, terminal Pacific/Honolulu, holiday 2026-09-07).
# Shared setup abbreviations used below are always spelled out as concrete
# setup_api_calls chains per instance.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_account_creation_defaults_applied
        claim_type: defaults
        grounds:
          - entities.CustomerAccount.fields.credit_hold
          - entities.CustomerAccount.fields.status
        distinguishing_aspect: "Creating an account with only required inputs yields status=ACTIVE, credit_hold=false, outstanding_balance_cents=0; system fields id/created_at/updated_at/version present, version==1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-D1", legal_name: "Defaults Co" }
              as: ContractManager
              captures: { a: $.data.id, st: $.data.status, ch: $.data.credit_hold, ob: $.data.outstanding_balance_cents, v: $.data.version }
          assert:
            - "st == ACTIVE and ch == false and ob == 0 and v == 1"

      - name: customer_account_duplicate_account_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.CustomerAccount.fields.account_code
          - errors[ERR_CAPACITY_OR_CONFLICT]
        distinguishing_aspect: "account_code uniqueness: second POST with the same code fails with ERR_CAPACITY_OR_CONFLICT (409)."
        test_recipe:
          setup: ["ACCT-DUP exists"]
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-DUP", legal_name: "First" }
              as: ContractManager
          trigger:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-DUP", legal_name: "Second" }
              as: ContractManager
              captures: { e: $.data.error_id }
          assert:
            - "e == ERR_CAPACITY_OR_CONFLICT"

      - name: service_contract_free_days_range_enforced
        claim_type: type_constraints
        grounds:
          - entities.ServiceContract.fields.demurrage_free_days
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "demurrage_free_days=31 exceeds the 0..30 range -> ERR_INVALID_REQUEST; 30 is accepted."
        test_recipe:
          setup: ["ACCT-R1 exists"]
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-R1", legal_name: "Range Co" }
              as: ContractManager
              captures: { a: $.data.id }
          trigger:
            - call: "POST /ocean-billing/customer-accounts/${a}/service-contracts"
              payload: { contract_ref: "CTR-R1-BAD", demurrage_free_days: 31, detention_free_days: 5, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { e1: $.data.error_id }
            - call: "POST /ocean-billing/customer-accounts/${a}/service-contracts"
              payload: { contract_ref: "CTR-R1-OK", demurrage_free_days: 30, detention_free_days: 5, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { ok: $.data.id }
          assert:
            - "e1 == ERR_INVALID_REQUEST"
            - "ok is a non-null id (30 accepted at the inclusive boundary)"

      - name: terminal_holiday_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.TerminalHoliday
        distinguishing_aspect: "TerminalHoliday has common_fields=false: response carries id and created_at but no version and no updated_at; no PUT/PATCH endpoint exists for it."
        test_recipe:
          setup: ["Terminal OAK exists"]
          setup_api_calls:
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5 }
              as: TerminalOperator
              captures: { t: $.data.id }
          trigger:
            - call: "POST /ocean-billing/terminals/${t}/holidays"
              payload: { holiday_date: "2026-09-07T00:00:00Z", name: "Labor Day" }
              as: TerminalOperator
              captures: { hid: $.data.id, hcreated: $.data.created_at }
          assert:
            - "holiday response contains id and created_at and contains no version field"
            - "holiday response contains no updated_at field"

      - name: container_get_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a random UUID path id returns 404 ERR_NOT_FOUND with the error envelope shape."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ocean-billing/containers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BillingAgent
              captures: { e: $.data.error_id, m: $.data.message }
          assert:
            - "e == ERR_NOT_FOUND"
            - "m is a non-empty string (error envelope data.message present)"

      - name: invoice_computed_gross_and_balance_fields
        claim_type: computed_fields
        grounds:
          - entities.Invoice.fields.gross_amount_cents
          - entities.Invoice.fields.balance_due_cents
        distinguishing_aspect: "gross_amount_cents == demurrage_total_cents + detention_total_cents and balance_due_cents == gross - credits - paid on a freshly issued invoice (credits=paid=0)."
        test_recipe:
          setup: ["CNTR-CF driven to EMPTY_RETURNED with demurrage 45000 (free=0, 3 days) and detention 9000 (gate-out 09-04, det free=0 on CTR-CF, return 09-08 -> billable 09-08 only = 1 day @9000)"]
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-CF", legal_name: "CompField Co" }
              as: ContractManager
              captures: { a: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${a}/service-contracts"
              payload: { contract_ref: "CTR-CF", demurrage_free_days: 0, detention_free_days: 0, saturday_counts_as_free_day: false, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { c: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${c}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5 }
              as: TerminalOperator
              captures: { t: $.data.id }
            - call: "POST /ocean-billing/terminals/${t}/holidays"
              payload: { holiday_date: "2026-09-07T00:00:00Z", name: "Labor Day" }
              as: TerminalOperator
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${t}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0001001", equipment_type: "DRY40", customer_account_id: "${a}", service_contract_id: "${c}", terminal_id: "${t}", discharge_ts: "2026-08-31T12:00:00Z", available_ts: "2026-09-01T12:00:00Z" }
              as: TerminalOperator
              captures: { cn: $.data.id }
            - call: "POST /ocean-billing/containers/${cn}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cn}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cn}/return-empty"
              payload: {}
              as: EquipmentController
          trigger:
            - call: "POST /ocean-billing/containers/${cn}/issue-invoice"
              payload: {}
              as: BillingAgent
              captures: { g: $.data.gross_amount_cents, b: $.data.balance_due_cents, dem: $.data.demurrage_total_cents, det: $.data.detention_total_cents }
          assert:
            - "dem == 45000 and det == 9000 (detention free=0: first working day after gate-out 09-04 is 09-08 — 09-05 Sat/09-06 Sun/09-07 holiday skipped — return ON 09-08 makes 09-08 billable, 1 day @9000)"
            - "g == 54000 and b == 54000"

      - name: dispute_evidence_self_reference_supersession
        claim_type: parent_relationships
        grounds:
          - entities.DisputeEvidence.fields.supersedes_evidence_id
        distinguishing_aspect: "An evidence item superseding another leaves both queryable via GET /disputes/{id}/evidence; the superseded item is identifiable by being the target of supersedes_evidence_id."
        test_recipe:
          setup: ["INV-SE issued (45000) for ACCT-SE; DSP-SE filed with window 2026-09-02..2026-09-04"]
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-SE", legal_name: "Supersede Co" }
              as: ContractManager
              captures: { a: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${a}/service-contracts"
              payload: { contract_ref: "CTR-SE", demurrage_free_days: 0, detention_free_days: 5, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { c: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${c}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5 }
              as: TerminalOperator
              captures: { t: $.data.id }
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${t}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0001019", equipment_type: "DRY40", customer_account_id: "${a}", service_contract_id: "${c}", terminal_id: "${t}", discharge_ts: "2026-08-31T12:00:00Z", available_ts: "2026-09-01T12:00:00Z" }
              as: TerminalOperator
              captures: { cn: $.data.id }
            - call: "POST /ocean-billing/containers/${cn}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cn}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cn}/return-empty"
              payload: {}
              as: EquipmentController
            - call: "POST /ocean-billing/containers/${cn}/issue-invoice"
              payload: {}
              as: BillingAgent
              captures: { inv: $.data.id }
            - call: "POST /ocean-billing/invoices/${inv}/disputes"
              payload: { dispute_reason: "APPOINTMENT_UNAVAILABLE", contested_amount_cents: 45000, evidence_window_start: "2026-09-02T00:00:00Z", evidence_window_end: "2026-09-04T00:00:00Z", evidence_summary: "gate full" }
              as: CustomerRep
              as_user_id: "${a}"
              captures: { dsp: $.data.id }
            - call: "POST /ocean-billing/disputes/${dsp}/evidence"
              payload: { evidence_type: "APPOINTMENT_SCREENSHOT", evidence_date: "2026-09-02T00:00:00Z", reference_uri: "s3://ev/v1.png" }
              as: CustomerRep
              as_user_id: "${a}"
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /ocean-billing/disputes/${dsp}/evidence"
              payload: { evidence_type: "APPOINTMENT_SCREENSHOT", evidence_date: "2026-09-02T00:00:00Z", reference_uri: "s3://ev/v2.png", supersedes_evidence_id: "${ev1}" }
              as: CustomerRep
              as_user_id: "${a}"
              captures: { ev2: $.data.id }
            - call: "GET /ocean-billing/disputes/${dsp}/evidence"
              payload: {}
              as: CustomerRep
              as_user_id: "${a}"
              captures: { ev_list: $.data }
          assert:
            - "ev2 != ev1 and both appear in the evidence list (2 items)"
            - "ev2.supersedes_evidence_id == ev1"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: container_initial_state_is_discharged
        claim_type: initial_state
        grounds:
          - state_machines.Container
        distinguishing_aspect: "A newly registered container has status == DISCHARGED before any action."
        test_recipe:
          setup: ["ACCT-IS ACTIVE with ACTIVE contract; terminal OAK exists"]
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-IS", legal_name: "InitState Co" }
              as: ContractManager
              captures: { a: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${a}/service-contracts"
              payload: { contract_ref: "CTR-IS", demurrage_free_days: 2, detention_free_days: 5, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { c: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${c}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5 }
              as: TerminalOperator
              captures: { t: $.data.id }
          trigger:
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0001027", equipment_type: "DRY40", customer_account_id: "${a}", service_contract_id: "${c}", terminal_id: "${t}", discharge_ts: "2026-09-01T12:00:00Z", available_ts: "2026-09-02T12:00:00Z" }
              as: TerminalOperator
              captures: { st: $.data.status }
          assert:
            - "st == DISCHARGED"

      - name: terminal_state_lockdown_paid_invoice_rejects_payment
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Invoice
          - errors[ERR_INVOICE_ALREADY_SETTLED]
        distinguishing_aspect: "From terminal PAID, a further payment is rejected with ERR_INVOICE_ALREADY_SETTLED — terminal states accept no transitions."
        test_recipe:
          setup: ["INV-TL issued with balance 45000 then paid in full"]
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-TL", legal_name: "TermLock Co" }
              as: ContractManager
              captures: { a: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${a}/service-contracts"
              payload: { contract_ref: "CTR-TL", demurrage_free_days: 0, detention_free_days: 5, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { c: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${c}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5 }
              as: TerminalOperator
              captures: { t: $.data.id }
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${t}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0001035", equipment_type: "DRY40", customer_account_id: "${a}", service_contract_id: "${c}", terminal_id: "${t}", discharge_ts: "2026-08-31T12:00:00Z", available_ts: "2026-09-01T12:00:00Z" }
              as: TerminalOperator
              captures: { cn: $.data.id }
            - call: "POST /ocean-billing/containers/${cn}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cn}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cn}/return-empty"
              payload: {}
              as: EquipmentController
            - call: "POST /ocean-billing/containers/${cn}/issue-invoice"
              payload: {}
              as: BillingAgent
              captures: { inv: $.data.id }
            - call: "POST /ocean-billing/invoices/${inv}/payments"
              payload: { amount_cents: 45000 }
              as: BillingAgent
          trigger:
            - call: "POST /ocean-billing/invoices/${inv}/payments"
              payload: { amount_cents: 100 }
              as: BillingAgent
              captures: { e: $.data.error_id }
          assert:
            - "e == ERR_INVOICE_ALREADY_SETTLED"

      - name: invalid_transition_gate_out_from_discharged
        claim_type: invalid_transition
        grounds:
          - state_machines.Container
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / gate_out_held_container_vs_closed_account_state_vs_safety
          rationale: "The first trigger of that §1.8 instance asserts gate-out from DISCHARGED returns ERR_INVALID_STATE."

      - name: dispute_withdraw_from_under_review_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Dispute
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "withdraw is declared only from SUBMITTED; calling it on an UNDER_REVIEW dispute returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["INV-WD issued for ACCT-WD (45000); DSP-WD filed and moved to UNDER_REVIEW (reason OTHER so no evidence needed at start-review)"]
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-WD", legal_name: "Withdraw Co" }
              as: ContractManager
              captures: { a: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${a}/service-contracts"
              payload: { contract_ref: "CTR-WD", demurrage_free_days: 0, detention_free_days: 5, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { c: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${c}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5 }
              as: TerminalOperator
              captures: { t: $.data.id }
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${t}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0001043", equipment_type: "DRY40", customer_account_id: "${a}", service_contract_id: "${c}", terminal_id: "${t}", discharge_ts: "2026-08-31T12:00:00Z", available_ts: "2026-09-01T12:00:00Z" }
              as: TerminalOperator
              captures: { cn: $.data.id }
            - call: "POST /ocean-billing/containers/${cn}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cn}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cn}/return-empty"
              payload: {}
              as: EquipmentController
            - call: "POST /ocean-billing/containers/${cn}/issue-invoice"
              payload: {}
              as: BillingAgent
              captures: { inv: $.data.id }
            - call: "POST /ocean-billing/invoices/${inv}/disputes"
              payload: { dispute_reason: "OTHER", contested_amount_cents: 1000, evidence_window_start: "2026-09-02T00:00:00Z", evidence_window_end: "2026-09-04T00:00:00Z", evidence_summary: "misc" }
              as: CustomerRep
              as_user_id: "${a}"
              captures: { dsp: $.data.id }
            - call: "POST /ocean-billing/disputes/${dsp}/start-review"
              payload: {}
              as: BillingAgent
          trigger:
            - call: "POST /ocean-billing/disputes/${dsp}/withdraw"
              payload: {}
              as: CustomerRep
              as_user_id: "${a}"
              captures: { e: $.data.error_id }
          assert:
            - "e == ERR_INVALID_STATE (withdraw only from SUBMITTED)"
            - "Dispute remains UNDER_REVIEW"

      - name: credit_waiver_reject_terminal_then_approve_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CreditWaiver
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A REJECTED waiver is terminal: approving it afterwards returns ERR_INVALID_STATE, not ERR_STALE_VERSION (state check precedes OCC in validation order for a version-matching request)."
        test_recipe:
          setup: ["INV-CW issued (159000) for ACCT-CW; waiver 60000 proposed by BillingAgent, then rejected by CreditSupervisor"]
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-CW", legal_name: "CredWav Co" }
              as: ContractManager
              captures: { a: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${a}/service-contracts"
              payload: { contract_ref: "CTR-CW", demurrage_free_days: 4, detention_free_days: 5, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { c: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${c}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5 }
              as: TerminalOperator
              captures: { t: $.data.id }
            - call: "POST /ocean-billing/terminals/${t}/holidays"
              payload: { holiday_date: "2026-09-07T00:00:00Z", name: "Labor Day" }
              as: TerminalOperator
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${t}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
