# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Online Legal Document Self-Service — breadth probe over §1.1-§1.7.
# Taxonomy: references/claim-extraction-guide.md sections + claim_type rows.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_fields
        claim_type: Creation
        grounds:
          - "entities.Customer"
          - "endpoints"
        distinguishing_aspect: "POST /legal/customers with email/full_name/state_of_residence -> 201 and all three fields echoed plus system id/created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /legal/customers"
              payload: { email: "c@x.com", full_name: "C", state_of_residence: "CA" }
              as: Customer
              captures: { cid: $.data.id }
          assert:
            - "Response status 201"
            - "Customer.email == 'c@x.com' and Customer.full_name == 'C' and Customer.state_of_residence == 'CA'"
            - "Customer.id is a UUID with no type prefix; Customer.version == 1"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Customer"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /legal/customers/{id} for a random UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /legal/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_customer_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Customer"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /legal/customers omitting state_of_residence -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /legal/customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "Response status 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_customer_invalid_enum_state_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Customer"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /legal/customers with state_of_residence='ZZ' (not in {CA,NY,TX,FL}) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /legal/customers"
              payload: { email: "c@x.com", full_name: "C", state_of_residence: "ZZ" }
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "Response status 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: project_attorney_review_addon_defaults_false
        claim_type: Defaults
        grounds:
          - "entities.DocumentProject.fields.attorney_review_addon"
        distinguishing_aspect: "POST /legal/document-projects omitting attorney_review_addon -> stored value false (default applied)."
        test_recipe:
          setup: ["STANDARD ACTIVE subscription; CA customer"]
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /legal/customers"
              payload: { email: "d1@x.com", full_name: "D1", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "Defaults" }
              as: Customer
              as_user_id: "${cust}"
              captures: { addon: $.data.attorney_review_addon }
          assert:
            - "DocumentProject.attorney_review_addon == false"
            - "DocumentProject.status == DRAFT and DocumentProject.credit_held == true"

      - name: assembled_clause_has_no_version_field
        claim_type: Immutability
        grounds:
          - "entities.AssembledClause"
        distinguishing_aspect: "AssembledClause has common_fields=false: only id + created_at; no version/updated_at returned on GET."
        test_recipe:
          setup: ["WILL/CA STANDARD ACTIVE project assembled with 1 clause"]
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W1", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c1" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "d2@x.com", full_name: "D2", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "AC" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a", q7: "a", q8: "a" } }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "GET /legal/assembled-clauses?document_project_id=${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { ckey: $.data.0.clause_key }
          assert:
            - "Exactly 1 AssembledClause returned with clause_key == 'W1' and is_mandatory == true and body_text == 'c1'"

      - name: order_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - "entities.Order.fields.provisional_quote_cents"
          - "endpoints"
        distinguishing_aspect: "Order is auto-created at project creation with all amount fields 0; there is no client write path to set provisional_quote_cents."
        test_recipe:
          setup: ["STANDARD ACTIVE subscription; CA customer; project created"]
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /legal/customers"
              payload: { email: "d3@x.com", full_name: "D3", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "Ord" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
          trigger:
            - call: "GET /legal/orders?document_project_id=${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { q: $.data.0.provisional_quote_cents }
          assert:
            - "Exactly 1 Order with provisional_quote_cents == 0, final_invoice_cents == 0, amount_charged_cents == 0, net_collected_cents == 0"

      - name: list_clause_templates_pagination_envelope
        claim_type: Listing
        grounds:
          - "entities.ClauseTemplate"
          - "response_envelope"
        distinguishing_aspect: "GET /legal/clause-templates returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["two WILL/CA clause templates"]
          setup_api_calls:
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W1", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c1" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W2", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c2" }
              as: PlatformAdmin
          trigger:
            - call: "GET /legal/clause-templates?document_type=WILL&state_code=CA&limit=1&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response_type == 'array'; meta.total_count == 2; has_more == true; exactly 1 item returned"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: assemble_from_draft_without_questionnaire_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.DocumentProject.IN_PROGRESS_to_ASSEMBLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Assemble on a DRAFT project (no questionnaire yet) -> 409 ERR_INVALID_STATE (from-state must be IN_PROGRESS)."
        test_recipe:
          setup: ["STANDARD ACTIVE subscription; project just created (DRAFT)"]
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W1", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c1" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "s1@x.com", full_name: "S1", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "Draft" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: finalize_blocked_while_review_in_progress
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.DocumentProject.ASSEMBLED_to_FINALIZED"
          - "validations[priority=13]"
          - "errors[ERR_REVIEW_IN_PROGRESS]"
        distinguishing_aspect: "Finalize while an AttorneyReview is IN_REVIEW... but project is IN_REVIEW so test finalize from CHANGES path. Here: review ASSIGNED, project IN_REVIEW; transition project to FINALIZED -> blocked by state then by review-in-progress. Pinned: project not in ASSEMBLED -> ERR_INVALID_STATE precedes; use a project in ASSEMBLED with a stale review. Simpler: covered by §1.8."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / review_request_requires_active_subscription
          rationale: "Finalize-gating and review-in-progress interplay is exercised through the §1.8 review lifecycle instances; the standalone ERR_REVIEW_IN_PROGRESS path is asserted there."

      - name: terminal_stored_rejects_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.DocumentProject"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From STORED (terminal) any /transition target -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["WILL/CA project taken all the way to STORED"]
          setup_api_calls:
            - call: "POST /legal/_clock/set"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W1", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c1" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "s2@x.com", full_name: "S2", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "ToStored" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a", q7: "a", q8: "a" } }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /legal/document-revisions"
              payload: { document_project_id: "${proj}", expected_document_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { rev: $.data.id }
            - call: "POST /legal/signature-requests"
              payload: { document_revision_id: "${rev}", signer_emails: ["s@x.com"] }
              as: Customer
              as_user_id: "${cust}"
              captures: { sig: $.data.id }
            - call: "POST /legal/document-projects/${proj}/transition"
              payload: { to_status: "FINALIZED" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/signature-requests/${sig}/transition"
              payload: { to_status: "SENT" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/signature-requests/${sig}/sign"
              payload: { signer_email: "s@x.com" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/document-projects/${proj}/transition"
              payload: { to_status: "STORED" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /legal/document-projects/${proj}/transition"
              payload: { to_status: "ABANDONED" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "DocumentProject.status == STORED before trigger"
            - "Response status 409 and data.error_id == ERR_INVALID_STATE"

      - name: signature_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - "state_machines.SignatureRequest"
          - "entities.SignatureRequest.fields.status"
        distinguishing_aspect: "A newly created SignatureRequest starts in DRAFT with signed_count 0."
        test_recipe:
          setup: ["WILL/CA STANDARD ACTIVE project assembled; FINAL revision"]
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W1", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c1" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "s3@x.com", full_name: "S3", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "Sig" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a", q7: "a", q8: "a" } }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /legal/document-revisions"
              payload: { document_project_id: "${proj}", expected_document_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { rev: $.data.id }
          trigger:
            - call: "POST /legal/signature-requests"
              payload: { document_revision_id: "${rev}", signer_emails: ["a@x.com", "b@x.com"] }
              as: Customer
              as_user_id: "${cust}"
              captures: { st: $.data.status }
          assert:
            - "SignatureRequest.status == DRAFT and SignatureRequest.signed_count == 0"

      - name: subscription_past_due_to_active_cure_cycle
        claim_type: Valid Transition
        grounds:
          - "state_machines.Subscription.PAST_DUE_to_ACTIVE"
        distinguishing_aspect: "Subscription PAST_DUE -> ACTIVE (cure) is a valid revert edge restoring paid-feature access."
        test_recipe:
          setup: ["STANDARD subscription ACTIVE then PAST_DUE"]
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /legal/customers"
              payload: { email: "s4@x.com", full_name: "S4", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "PAST_DUE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { st: $.data.status }
          assert:
            - "Subscription.status == ACTIVE after the cure"

      - name: reminder_dispatch_before_due_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.UpdateReminder.SCHEDULED_to_SENT"
          - "validations[priority=7]"
          - "errors[ERR_REMINDER_NOT_DUE]"
        distinguishing_aspect: "dispatch_due sweep before the reminder due_at leaves it SCHEDULED (not due); only when clock advances past due_at does it go SENT."
        test_recipe:
          setup: ["clock 2026-04-01; WILL/CA project SIGNED -> one SCHEDULED reminder due_at = signed + REMINDER_INTERVAL_DAYS"]
          setup_api_calls:
            - call: "POST /legal/_clock/set"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W1", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c1" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "s5@x.com", full_name: "S5", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "Rem" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a", q7: "a", q8: "a" } }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /legal/document-revisions"
              payload: { document_project_id: "${proj}", expected_document_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { rev: $.data.id }
            - call: "POST /legal/signature-requests"
              payload: { document_revision_id: "${rev}", signer_emails: ["s@x.com"] }
              as: Customer
              as_user_id: "${cust}"
              captures: { sig: $.data.id }
            - call: "POST /legal/document-projects/${proj}/transition"
              payload: { to_status: "FINALIZED" }
