          rationale: |
            The dependency of the priority-50 lot-state check on the earlier priority-116
            selection — the lot must be chosen by the FEFO selector before its liveness can
            be re-verified at prepare time, and the sweep can expire it in between — is
            exactly what that §1.8 instance drives, including the units_committed rollback
            and the retry on a fresh lot.

