          assert:
            - "${enr2_last_issued} == null"
            - "${enr2_device_status} == AWAITING_DEVICE"
            - "Device.${dev1_id}.status == RECLAIM_PENDING before the first trigger"
            - "the first trigger returns HTTP 409 and ${err} == ERR_SINGLE_DEVICE_PER_SUBSCRIBER"
            - "Device.${dev2_id}.status == IN_STOCK immediately after the first trigger"
            - "Enrollment.${enr2_id}.device_issuance_count == 0 immediately after the first trigger"
            - "${d1_status} == IN_STOCK and ${d1_returned} == 2026-09-02T00:00:00.000Z"
            - "Device.${dev1_id}.return_condition == GOOD"
            - "Enrollment.${enr1_id}.device_status == AWAITING_DEVICE"
            - "the last trigger returns HTTP 200 with ${d2_status_after} == ISSUED and ${d2_enr_after} == ${enr2_id}"
            - "${enr2_status_after} == DEVICE_ISSUED and ${enr2_count_after} == 1"
            - "Device.${dev2_id}.status == ISSUED and Device.${dev2_id}.issued_enrollment_id == ${enr2_id}"
            - "Provider.${prov_id}.devices_total_count == 2"
            - "Provider.${prov_id}.devices_in_stock_count == 1"
            - "Provider.${prov_id}.devices_issued_count == 1"
            - "Provider.${prov_id}.devices_reclaim_pending_count == 0"

      - name: claim_lifecycle_gate_runs_before_the_sample_size_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=50]
          - validations[priority=51]
          - validations[priority=92]
          - errors[ERR_CLAIM_NOT_FILED]
          - errors[ERR_CLAIM_NOT_DRAFT]
        distinguishing_aspect: |
          The dependent check must run in order: an audit-draw carrying the illegal
          sample_size 0 against a DRAFT claim returns ERR_CLAIM_NOT_FILED, NOT
          ERR_INVALID_SAMPLE_SIZE - the lifecycle gate at priority 51 shadows the cardinality
          check at 92 - and the identical body only reveals ERR_INVALID_SAMPLE_SIZE once the
          claim is FILED. Re-filing the FILED claim then yields the mirror gate
          ERR_CLAIM_NOT_DRAFT.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50 and one non-tribal VOICE enrollment starting 2026-06-01."
            - "Clock moved to 2026-07-02T00:00:00Z and a DRAFT claim for 2026-06 is created."
