          - endpoints["POST /investigations/{id}/assignments"]
          - entities.Officer.fields.certification_level
        distinguishing_aspect: |
          The certification check is a non-strict at-least comparison against
          investigation.required_certification_level, so an investigator whose certification_level
          equals the bar exactly must be accepted rather than refused. A CLASS_II complaint sets
          the bar at 2 and the assignee carries exactly 2, which is the pass side of the same rule
          whose failure side returns ERR_CERTIFICATION_INSUFFICIENT.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "Internal Affairs holds Commander Reyes and Investigator Calder with certification_level exactly 2, is_investigator true, max_case_load 3 and open_case_load 0."
