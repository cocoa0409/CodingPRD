            - "trigger call 3 -> HTTP 200 with status ACTIVE and a version strictly greater than ${v_before}"
            - "trigger call 4 -> HTTP 201 with state == DRAFT, distributable_total_cents == 700000, cost_deduction_cents == 0, recoupment_base_cents == 700000, recoup_applied_cents == 0, royalty_base_cents == 700000, provisional_royalty_payable_cents == 175000, final_royalty_payable_cents == null and finalized_at == null"
