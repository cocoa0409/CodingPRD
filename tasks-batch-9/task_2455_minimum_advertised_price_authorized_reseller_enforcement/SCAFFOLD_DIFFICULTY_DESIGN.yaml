            - "${cb_final_status} == REVERSED and DistributorChargeback.${cb_id}.status == REVERSED"
            - "HOP 1 — Distributor.${d_id}.chargeback_balance_cents == 0 and Distributor.${d_id}.diversion_score == 0.0"
            - "HOP 2 — Distributor.${d_id}.standing == GOOD (re-derived from the restored score, crossing back under the 10.0 break)"
            - "HOP 3 — Reseller.${rs_id}.review_required == false (recomputed because its sourcing distributor left PROBATION)"
            - "DistributorChargeback.${cb_id}.amount_cents == 10000 and score_delta_applied == 10.0 (retained on the reversed row for audit; only its ledger membership changes)"
            - "SerialUnit.${su_id}.status == TRACED_UNAUTHORIZED (the reversal does not un-trace the unit) and SerialUnit.${su_id}.downstream_reseller_id == null"
            - "TestPurchase.${tp_id}.outcome == CONFIRMED_UNAUTHORIZED is unchanged and Distributor.${d_id}.probation_entered_at is retained as 2026-08-10T00:00:00Z"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: antitrust_pricing_discussion_outranks_unpublished_policy_rejected
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.PricingPolicy.PUBLISHED_to_WITHDRAWN
          - entities.EnforcementNotice.fields.contains_pricing_discussion
          - entities.Violation.fields.cited_policy_id
        distinguishing_aspect: |
          One request violates business_safety (priority 9, contains_pricing_discussion
          true) and business_referential (priority 10, the cited policy is WITHDRAWN)
          simultaneously; only ERR_ANTITRUST_NEGOTIATION_PROHIBITED (422) may be
          returned. Removing just the antitrust flag from the identical request then
          surfaces ERR_POLICY_NOT_PUBLISHED, proving both defects were live.
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-I published effective_from 2026-08-01T00:00:00Z, then WITHDRAWN after a violation was already detected under it."
            - "Product SKU-MAP-3 standard_map_floor_cents 10000; Reseller AUTHORIZED / OPEN, permitted_channels [MARKETPLACE], violation_points_total 0."
            - "Clock at 2026-08-10T00:00:00Z; one MARKETPLACE observation at 8000 evaluated to a DETECTED Violation citing the now-withdrawn policy."
            - "The reseller's current version has been read so the priority-8 OCC check passes and the request reaches the business tiers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-I", cure_window_days: 10 }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Cleared." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-MAP-3", name: "Aurora Monitor", msrp_cents: 15000, standard_map_floor_cents: 10000, governing_policy_id: "${pol_id}" }
              as: BrandChannelManager
              captures: { prod_id: $.data.id }
            - call: "POST /resellers"
              payload: { legal_name: "Echo Retail LLC", contact_email: "notices@echoretail.example", primary_channel: "MARKETPLACE" }
              as: BrandChannelManager
              captures: { rs_id: $.data.id }
            - call: "POST /reseller-agreements"
