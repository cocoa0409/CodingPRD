      - name: spend_observation_restatement_supersedes_incumbent
        claim_type: side_effect_execution
        grounds:
          - "entities.SpendObservation.superseded_by_id - set on the older row when a later row restates the same (data_window_id, channel_id, period_start_date) triple"
          - "entities.SpendObservation.is_restatement - true when this row superseded an earlier row for the same triple"
          - "entities.DataWindow.spend_observation_count - counts only rows whose superseded_by_id IS null"
          - "endpoints GET /mmm/spend-observations input [data_window_id?, channel_id?, superseded_by_id?, include_superseded?, limit?, offset?]"
        distinguishing_aspect: |
          A restatement does not overwrite in place: the incumbent row survives with superseded_by_id
          pointing at the new row, the new row carries is_restatement true, and the window's
