            - "the peer's confirm, payments and cancel on Alpha's order each return HTTP 403 with error_id ERR_DEALER_SCOPE_VIOLATION"
            - "the peer's GET of the same order returns HTTP 200 with dealer_id equal to Alpha, production_status DRAFT, financial_status AWAITING_DEPOSIT and deposit_paid_cents 0 - reads are not dealer-scoped and the refused payment recorded nothing"
            - "the peer's GET /dealer-orders filtered by Alpha's dealer_id returns HTTP 200 with total_count 1"
            - "Alpha's own confirm on the same order returns HTTP 200 with production_status QUEUED, so all four 403s were identity failures rather than payload failures"

      - name: every_role_shares_the_entire_get_surface_with_identical_payloads
        claim_type: shared_operations
        grounds:
          - roles.PlantAdmin
          - roles.QualityInspector
          - endpoints.GET /bin-designs/{id}
          - endpoints.GET /dealer-orders/{id}/kit-lines
          - endpoints.GET /coil-lots
          - endpoints.GET /dealers/{id}/installation-crews
        distinguishing_aspect: "Every role declares `every GET endpoint` as its shared_operations, so the read surface is deliberately flat: seven different X-User-Role values read the same design and must receive byte-identical data objects with no per-role redaction and no per-role filtering. The reads also cross ownership and function boundaries that the write surface enforces - a QualityInspector reads a coil lot, a ProductionPlanner reads a dealer's kit lines and pricing, a SealingEngineer lists another party's crews - which is exactly where an implementation that reuses its write-side scope check for reads will return 403."
