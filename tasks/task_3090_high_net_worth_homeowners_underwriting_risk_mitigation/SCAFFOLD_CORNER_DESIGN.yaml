            - "POST /hnw/claims/${c1_id}/settle as Underwriter returns 403 ERR_FORBIDDEN"
            - "the adjuster CAN read the enrollment through GET /hnw/enrollments/${e1_id} with status 200"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: optimistic_concurrency_stale_property_version_on_posture_eval_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[attach-stale-property-version-second-path]
          - errors[ERR_STALE_VERSION]
          - validations[priority=9]
          - entities.Property.fields.version
        distinguishing_aspect: "The second OCC guard, on a different write path from the attach: a posture evaluation carrying a version the client read before the appraisal was approved is refused with 412 ERR_STALE_VERSION, and the property's version is not advanced by the refused attempt."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a property whose version was read before a second appraisal was approved."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { stale_v: $.data.version }
            - call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Second Opinion LLC", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-25T00:00:00Z", dwelling_cost_cents: 50000000, contents_cost_cents: 0, valuation_confidence_pct: 90.0 }
              as: Underwriter
              captures: { appr2: $.data.id }
            - call: "POST /hnw/appraisals/${appr2}/review"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/appraisals/${appr2}/approve"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /hnw/properties/${p1_id}/posture-eval"
              payload: { expected_property_version: "${stale_v}" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the evaluation is refused with status 412 and error_id == ERR_STALE_VERSION"
            - "Property.${p1_id}.dwelling_replacement_cost_cents == 250000000, so the second appraisal's approval did land"
            - "a repeat evaluation with a freshly read version succeeds with status 200"
            - "the stale call did not increment Property.${p1_id}.version a second time"

      - name: derived_field_reconciliation_restores_required_coverage_after_a_lapse
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Property.UNDERWRITABLE_to_PENDING_APPRAISAL
          - calculations.replacement_cost_valuation.variants.base_appraisal_lapse
          - entities.Enrollment.fields.required_dwelling_coverage_cents
          - errors[ERR_COVERAGE_BELOW_REQUIRED]
        distinguishing_aspect: "The permitted window is time-bound rather than perpetual: at 24 months the re-opened valuation withdraws the 1.5x guarantee band, the required Coverage A drops and a 300000000 enrollment becomes eligible to attach — a declared quantity that was pinned to a valuation rather than to a lifetime state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a mitigation-cleared property appraised at 200000000 with an APPROVED enrollment of Coverage A 300000000, then the clock advanced 25 months so the base appraisal lapses."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/mitigation-requirements"
              payload: { requirement_code: "DEFENSIBLE_SPACE", band_awarded: "CLEARED", source: "UNDERWRITING", due_on: "2028-12-01T00:00:00Z" }
              as: RiskConsultant
              captures: { mit_id: $.data.id }
            - call: "POST /hnw/mitigation-requirements/${mit_id}/verify"
              payload: { verified_band: "CLEARED", verification_count: 0 }
              as: RiskConsultant
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2028-10-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "before the clock move Enrollment.${e1_id}.required_dwelling_coverage_cents == 300000000, because the current replacement cost of 200000000 is multiplied by the 1.5 guarantee ratio"
            - "after the clock passes the 24-month appraisal anniversary Property.${p1_id}.base_posture == PENDING_APPRAISAL and posture == WRITE_FROZEN"
            - "the enrollment is parked: POST /hnw/enrollments/${e1_id}/attach returns 409 ERR_WRITE_FROZEN rather than 422 ERR_COVERAGE_BELOW_REQUIRED"
            - "after POST /hnw/properties/${p1_id}/reopen and a fresh approval of a 220000000 site appraisal, base_posture == UNDERWRITABLE and required_dwelling_coverage_cents == 330000000, so the 300000000 enrollment is now short by 30000000 and the attach is refused with 422 ERR_COVERAGE_BELOW_REQUIRED"

