  # ===================================================================================
  # SECTION 4 — VALIDATIONS
  # ===================================================================================
  - section: validations
    instances:
      - name: duplicate_event_code_returns_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors[ERR_EVENT_CODE_DUPLICATE]
        distinguishing_aspect: "Event.code is unique globally: a second event with code SUM26 returns 409 ERR_EVENT_CODE_DUPLICATE even though every other field differs."
        test_recipe:
          setup: ["One event with code SUM26 exists."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event1_id: $.data.id }
          trigger:
            - call: "POST /housing/events"
              payload: { name: "Other Summit", code: "SUM26", event_start_date: "2026-10-01", event_end_date: "2026-10-03", cutoff_date: "2026-09-01", attrition_deadline_date: "2026-08-25", standard_commission_pct: 0.11, standard_rebate_per_room_night_cents: 600 }
              as: BureauCoordinator
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_EVENT_CODE_DUPLICATE"
            - "GET /housing/hotel-blocks with event_id=${event1_id} still resolves, so the first event is untouched"

      - name: duplicate_attendee_email_within_event_returns_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - errors[ERR_ATTENDEE_EMAIL_DUPLICATE]
        distinguishing_aspect: "Attendee.email is unique per event, so re-importing a1@example.com into the same event returns 409 ERR_ATTENDEE_EMAIL_DUPLICATE with a different registration_id."
        test_recipe:
          setup: ["One event with attendee a1@example.com already imported."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
          trigger:
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One Again", registration_id: "REG-9", attendee_type: "VIP" }
              as: BureauCoordinator
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_ATTENDEE_EMAIL_DUPLICATE"
            - "Attendee.${att1_id}.attendee_type == GENERAL"
            - "Attendee.${att1_id}.registration_id == REG-1"

      - name: same_email_in_a_second_event_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=33]
          - entities.Attendee.fields.email
        distinguishing_aspect: "The uniqueness scope is (event_id, email), not email alone: the same address imported into a second event is accepted with 201 and gets its own attendee id."
        test_recipe:
          setup: ["Two events; a1@example.com already imported into the first."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event1_id: $.data.id }
            - call: "POST /housing/events"
              payload: { name: "Winter Expo", code: "WEX26", event_start_date: "2026-11-10", event_end_date: "2026-11-13", cutoff_date: "2026-10-15", attrition_deadline_date: "2026-10-01", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event2_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event1_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
          trigger:
            - call: "POST /housing/attendees"
              payload: { event_id: "${event2_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att2_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "${att2_id} != ${att1_id}"
            - "Attendee.${att2_id}.event_id == ${event2_id}"
            - "Attendee.${att2_id}.warning_count == 0"

      - name: duplicate_poaching_incident_key_returns_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=34]
          - errors[ERR_DUPLICATE_INCIDENT]
        distinguishing_aspect: "The incident key is (rogue_vendor_id, attendee_id, contact_channel, occurred_at): re-filing the identical EMAIL contact at 2026-07-20T10:00:00Z returns 409, while the same channel at 2026-07-21T10:00:00Z is accepted and lifts the score from 50 to 75."
        test_recipe:
          setup: ["One vendor with one verified EMAIL incident against attendee 1 at 2026-07-20T10:00:00Z (risk_score 50)."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
            - call: "POST /housing/rogue-vendors"
              payload: { event_id: "${event_id}", name: "Summit Rooms LLC", contact_domain: "summit-rooms.example", detection_source: "ATTENDEE_REPORT" }
              as: ComplianceOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /housing/rogue-vendors/${vendor_id}/incidents"
              payload: { attendee_id: "${att1_id}", contact_channel: "EMAIL", occurred_at: "2026-07-20T10:00:00Z", verified: true }
              as: ComplianceOfficer
              captures: { inc1_id: $.data.id }
          trigger:
            - call: "POST /housing/rogue-vendors/${vendor_id}/incidents"
