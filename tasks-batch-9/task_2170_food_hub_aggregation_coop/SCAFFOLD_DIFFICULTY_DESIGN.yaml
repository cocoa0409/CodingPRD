      - Producer.${p1_id}.onboarding_status == SUSPENDED
      - Producer.${p1_id}.suspension_count == 1
      - ProducerDocument.${p1_ins}.status == VERIFIED
  - name: voting_shares_threshold_at_the_exact_equity_unit
    grounds:
    - calculations.producer_voting_shares
    - entities.Producer.fields.paid_in_capital_cents
    - entities.Producer.fields.voting_shares
    distinguishing_aspect: Boundary metric 2 — an integer capital threshold reached through POST /producers/{id}/equity-contributions, a different endpoint and a different metric from the datetime expiry
      boundary. floor(paid_in_capital_cents / 25000) is 0 at 24999 and 1 at exactly 25000, and the MAX_VOTING_SHARES ceiling clamps 300000 cents (12 raw units) to 10.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Producer P1 exists in onboarding_status DRAFT.
      - P1 has paid_in_capital_cents 24999 and voting_shares 0 — one cent short of the first share unit.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /producers
        payload:
          legal_name: Hollow Pine Orchard
          region_code: PIE
          contact_email: hp@example.org
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          p1_id: $.data.id
      - call: POST /producers/${p1_id}/equity-contributions
        payload:
          amount_cents: 24999
          memo: initial subscription
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          shares_below: $.data.voting_shares
      trigger:
      - call: POST /producers/${p1_id}/equity-contributions
        payload:
          amount_cents: 1
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          shares_at_unit: $.data.voting_shares
          capital_at_unit: $.data.paid_in_capital_cents
      - call: POST /producers/${p1_id}/equity-contributions
        payload:
          amount_cents: 275000
        as: HubAdmin
        as_user_id: hub-admin-1
      assert:
      - ${shares_below} == 0
      - ${capital_at_unit} == 25000
      - ${shares_at_unit} == 1
      - Producer.${p1_id}.paid_in_capital_cents == 300000
      - Producer.${p1_id}.voting_shares == 10
