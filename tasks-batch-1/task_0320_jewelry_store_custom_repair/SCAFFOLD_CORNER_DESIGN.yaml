            - call: "GET /customers/${cust_id}"
              payload: {}
              as: SalesAssociate
              captures: { bal: $.data.store_credit_balance_cents }
          assert:
            - "Customer.${cust_id}.store_credit_balance_cents == 25000"

  # ===========================================================================
  # excluded_because stubs — corners already exercised by §1.8 instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: layaway_cancel_restores_item_in_stock_stub
        claim_type: Side Effect Execution
        grounds: [state_machines.LayawayPlan.ACTIVE_to_CANCELLED, entities.InventoryItem.fields.status]
        excluded_because:
          difficulty_instance: compensating_invariant / inventory_availability_conserved_under_reserve_then_cancel
          rationale: "The §1.8 invariant instance already asserts item returns to IN_STOCK after activate+cancel."
      - name: warranty_approve_spawns_repair_ticket_stub
        claim_type: Side Effect Execution
        grounds: [state_machines.WarrantyClaim.SUBMITTED_to_APPROVED, entities.WarrantyClaim.fields.spawned_repair_ticket_id]
        excluded_because:
          difficulty_instance: transitive_cascade / warranty_pickup_bubbles_claim_resolved_depth2
          rationale: "The §1.8 cascade instance approves the claim (spawning the ticket) as part of its setup chain."

  - section: calculations
    instances:
      - name: trade_in_credit_correct_result_stub
        claim_type: Correct Result
        grounds: [calculations.trade_in_credit, entities.TradeInOffer.fields.buyback_credit_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / trade_in_credit_tiered_nested_min_max
          rationale: "The §1.8 combinatorial instance already pins buyback_credit_cents=153000 for the same inputs."
      - name: layaway_settlement_refund_stub
        claim_type: Variant Selection
        grounds: [calculations.layaway_schedule, entities.LayawayPlan.fields.settlement_refund_cents]
        excluded_because:
          difficulty_instance: dual_variant_calc / layaway_projected_payoff_vs_settlement_refund
          rationale: "The §1.8 dual-variant instance asserts settlement_refund_cents=230000."

  - section: cross_cutting_complexity_layers
    instances:
      - name: trade_in_accept_cascade_to_balance_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.TradeInOffer.OFFERED_to_ACCEPTED, calculations.store_credit_balance]
        excluded_because:
          difficulty_instance: compensating_invariant / store_credit_conserved_under_credit_then_debit
          rationale: "The §1.8 invariant instance accepts a trade-in (cascade to store credit) before the compensating debit."
