      - name: surge_threshold_inclusive_at_peak_factor_one_point_five_zero
        grounds:
          - calculations.fleet_sizing.required_surge_blocks
          - calculations.fleet_sizing.constants.SURGE_THRESHOLD_PEAK_FACTOR
          - state_machines.DemandForecast.state.PUBLISHED_to_SUPERSEDED
        distinguishing_aspect: |
          Straddles SURGE_THRESHOLD_PEAK_FACTOR at the 2-decimal granularity the field allows: a
          peak_factor of exactly 1.50 must produce ZERO surge blocks because the threshold is
          inclusive, while 1.51 — one representable step higher — produces 2. The step is large
          because BOTH ceil() calls matter: ceil(40 * 1.51) == ceil(60.4) == 61 rather than 60, so
          surge_trips == 21 and ceil(21 / 16) == 2 rather than 1. required_base_blocks is
          deliberately identical (ceil(40/16) == 3) in both forecasts, so any difference in the
          response can only come from the surge branch. The second POST also proves the supersession
          side effect and that its OCC token is the ZONE's version, re-read after the first write.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE with no other rows; the logical clock sits at 2026-08-03T05:00:00Z."
            - "Forecast window 06:00-10:00Z is 4.00 hours, so block_trip_capacity == TRIPS_PER_BLOCK_HOUR * 4 == 16."
            - "Both forecasts declare forecast_trips 40 over that identical window and differ only in peak_factor."
            - "The zone version is captured from the activate response for the first forecast and re-read from GET /service-zones/{id} for the second, because creating the first forecast bumps the zone row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
              captures: { z_v1: $.data.version }
          trigger:
            - call: "POST /demand-forecasts"
              payload: { zone_id: "${z_id}", window_start_utc: "2026-08-03T06:00:00Z", window_end_utc: "2026-08-03T10:00:00Z", forecast_trips: 40, peak_factor: 1.50, expected_service_zone_version: "${z_v1}" }
              as: ZoneAdmin
              captures: { f1_id: $.data.id }
            - call: "GET /service-zones/${z_id}"
              payload: {}
              as: Dispatcher
              captures: { z_v2: $.data.version }
            - call: "POST /demand-forecasts"
              payload: { zone_id: "${z_id}", window_start_utc: "2026-08-03T06:00:00Z", window_end_utc: "2026-08-03T10:00:00Z", forecast_trips: 40, peak_factor: 1.51, expected_service_zone_version: "${z_v2}" }
              as: ZoneAdmin
              captures: { f2_id: $.data.id }
          assert:
            - "DemandForecast.${f1_id}.required_base_blocks == 3"
            - "DemandForecast.${f1_id}.required_surge_blocks == 0"
            - "DemandForecast.${f2_id}.required_base_blocks == 3"
            - "DemandForecast.${f2_id}.required_surge_blocks == 2"
            - "DemandForecast.${f1_id}.state == SUPERSEDED"
            - "DemandForecast.${f2_id}.state == PUBLISHED"
            - "GET /demand-forecasts?zone_id=${z_id}&state=PUBLISHED returns total_count == 1 and its only row has id == ${f2_id}"
            - "${z_v2} > ${z_v1}"

      - name: zero_trip_denominator_and_half_up_revenue_hours_boundary
        grounds:
          - calculations.subsidy_per_trip.subsidy_per_trip_cents
          - entities.VehicleBlock.fields.actual_revenue_hours
          - calculations.service_performance_metrics.boardings_per_revenue_hour
        distinguishing_aspect: |
          Two boundaries in one shot. First, the total_trips == 0 guard: a FINAL report over a day
          with a CLOSED block but no COMPLETED trips must report subsidy_per_trip_cents 0 instead of
          dividing by zero, while total_operating_cost_cents stays non-zero. Second, a half-up
          rounding boundary that only a two-stage implementation gets right: the block is open for
          7218 seconds == 2.005 hours, which round_half_up to 2 decimals gives actual_revenue_hours
          2.01, and 2.01 * 8250 * 1.12 == 18572.4 rounds to 18572. Truncating the hours to 2.00
          yields 18480 and rounding the hours down-to-even yields 2.00 as well, so both wrong paths
          are visible. scheduled_revenue_hours stays 4.00, proving FINAL reads the ACTUAL figure.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; vehicle V1 and driver D1 exist; no riders, stops or trips are created at all."
            - "Block B1 (V1/D1) is scheduled 06:00-10:00Z (scheduled_revenue_hours 4.00), opened at exactly 06:00:00Z and closed at 08:00:18Z, i.e. 7218 seconds == 2.005 hours of actual revenue service."
            - "No PoolAssignment ever exists, so the close precondition is trivially satisfied and boardings_count stays 0."
            - "FinanceAnalyst fa-1 files a FINAL report for 2026-08-03..2026-08-03, whose block_scope is CLOSED blocks only and whose trip_scope is COMPLETED trips only (empty)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: Dispatcher
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:18Z" }
              as: Dispatcher
            - call: "POST /vehicle-blocks/${b1_id}/close"
              payload: {}
              as: Dispatcher
            - call: "POST /subsidy-reports"
              payload: { zone_id: "${z_id}", period_start_date: "2026-08-03", period_end_date: "2026-08-03", variant: "FINAL" }
              as: FinanceAnalyst
              as_user_id: "fa-1"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /subsidy-reports/${rep_id}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "fa-1"
          assert:
            - "VehicleBlock.${b1_id}.state == CLOSED"
            - "VehicleBlock.${b1_id}.scheduled_revenue_hours == 4.00"
            - "VehicleBlock.${b1_id}.actual_revenue_hours == 2.01"
            - "VehicleBlock.${b1_id}.boardings_count == 0"
            - "SubsidyReport.${rep_id}.state == SUBMITTED"
            - "SubsidyReport.${rep_id}.total_trips == 0"
            - "SubsidyReport.${rep_id}.total_fare_revenue_cents == 0"
            - "SubsidyReport.${rep_id}.total_operating_cost_cents == 18572"
            - "SubsidyReport.${rep_id}.subsidy_per_trip_cents == 0"
            - "ServiceZone.${z_id}.boardings_per_revenue_hour == 0.00"
            - "ServiceZone.${z_id}.avg_wait_minutes == 0.00 and ServiceZone.${z_id}.avg_ride_minutes == 0.00"
            - "ServiceZone.${z_id}.wav_equivalence_ratio == 0.000 and ServiceZone.${z_id}.equivalence_verdict == COMPLIANT"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: trip_intake_gated_on_zone_status_and_suspension_is_not_undone
        grounds:
          - state_machines.ServiceZone.status.ACTIVE_to_SUSPENDED
          - state_machines.ServiceZone.status.SUSPENDED_to_ACTIVE
          - state_machines.TripRequest.status.RECEIVED_to_NO_SERVICE
          - validations.priority_14.ERR_ZONE_NOT_ACTIVE
        distinguishing_aspect: |
          Intake on TripRequest depends on the state of a DIFFERENT entity (ServiceZone), and the
          dependency is asymmetric in time: suspending the zone both blocks new intake AND sweeps the
          already-RECEIVED trip to the terminal NO_SERVICE / ZONE_SUSPENDED, and re-activating the zone
          restores intake WITHOUT resurrecting that swept trip. An implementation that models the zone
          gate as a simple mirror of zone status (restoring trips on re-activation, or forgetting to
          sweep on suspension) fails one of the two halves.
        test_recipe:
          setup:
            - "Zone RBM is ACTIVE with approved stops S0 and S4 and two riders R1 and R2."
            - "Trip T1 (R1, S0->S4, requested 07:00Z) exists in status RECEIVED, fare_status UNPRICED, and has never been matched."
            - "The zone is then suspended, which must sweep T1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R2", fare_category: "REDUCED", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /service-zones/${z_id}/suspend"
              payload: { note: "flood detour, service halted" }
              as: ZoneAdmin
          trigger:
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r2_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:30:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r2_id}"
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r2_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:30:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r2_id}"
              captures: { t2_id: $.data.id }
          assert:
            - "while the zone is SUSPENDED the first POST /trip-requests returns HTTP 409 with error_id == ERR_ZONE_NOT_ACTIVE"
            - "TripRequest.${t1_id}.status == NO_SERVICE"
            - "TripRequest.${t1_id}.no_service_reason == ZONE_SUSPENDED"
            - "TripRequest.${t1_id}.assigned_block_id == null"
            - "TripRequest.${t1_id}.fare_status == UNPRICED"
            - "after re-activation ServiceZone.${z_id}.status == ACTIVE"
            - "TripRequest.${t1_id}.status is STILL NO_SERVICE after re-activation (NO_SERVICE is terminal; the zone cycle does not restore it)"
            - "TripRequest.${t1_id}.no_service_reason == ZONE_SUSPENDED after re-activation"
            - "ServiceZone.${z_id}.unserved_trip_count == 1"
            - "the second POST /trip-requests returns HTTP 201 and TripRequest.${t2_id}.status == RECEIVED"
            - "TripRequest.${t2_id}.fare_status == UNPRICED and TripRequest.${t2_id}.match_attempt_count == 0"
            - "GET /trip-requests?zone_id=${z_id}&status=NO_SERVICE returns total_count == 1"

      - name: block_open_gated_on_vehicle_status_then_released_by_maintenance_return
        grounds:
          - state_machines.VehicleBlock.state.SCHEDULED_to_OPEN
          - state_machines.Vehicle.status.AVAILABLE_to_IN_MAINTENANCE
          - state_machines.Vehicle.status.IN_MAINTENANCE_to_AVAILABLE
          - errors.ERR_INVALID_VEHICLE_STATE
        distinguishing_aspect: |
          The guard lives on a referenced entity, not on the entity being transitioned: the block is
          perfectly SCHEDULED and its zone is ACTIVE, yet the open must fail with
          ERR_INVALID_VEHICLE_STATE purely because Vehicle V1 sits in IN_MAINTENANCE. The failed
          attempt must be a true no-op — state still SCHEDULED, opened_at still null and version
          unchanged — and the identical call must succeed once the vehicle returns to AVAILABLE, so
          the error cannot be memoised on the block.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; vehicle V1 (seat_capacity 6, wav_positions 2) and driver D1 (ACTIVE) belong to it."
            - "Block B1 (V1/D1) 06:00-10:00Z is SCHEDULED; its version is captured from the create response."
            - "No DemandForecast exists, so the fleet-sizing check at priority 56 is skipped and cannot mask the vehicle-state failure."
            - "V1 is moved to IN_MAINTENANCE before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:30:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /vehicles/${v1_id}/status"
              payload: { status: "IN_MAINTENANCE" }
              as: ZoneAdmin
          trigger:
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
            - call: "POST /vehicles/${v1_id}/status"
              payload: { status: "AVAILABLE" }
              as: ZoneAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: Dispatcher
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
          assert:
            - "the first POST /vehicle-blocks/${b1_id}/open returns HTTP 409 with error_id == ERR_INVALID_VEHICLE_STATE"
            - "immediately after that failure VehicleBlock.${b1_id}.state == SCHEDULED"
            - "immediately after that failure VehicleBlock.${b1_id}.opened_at == null"
            - "immediately after that failure VehicleBlock.${b1_id}.version == ${b1_v} (no write occurred)"
            - "Vehicle.${v1_id}.status == AVAILABLE after the maintenance return"
            - "the second POST /vehicle-blocks/${b1_id}/open returns HTTP 200"
            - "VehicleBlock.${b1_id}.state == OPEN"
            - "VehicleBlock.${b1_id}.opened_at == 2026-08-03T06:00:00Z"
            - "VehicleBlock.${b1_id}.version > ${b1_v}"
            - "VehicleBlock.${b1_id}.actual_revenue_hours == 0.00 and VehicleBlock.${b1_id}.scheduled_revenue_hours == 4.00"

      - name: certification_gated_on_block_finalization_with_totals_frozen_at_submit
        grounds:
          - state_machines.SubsidyReport.state.SUBMITTED_to_CERTIFIED
          - validations.priority_58.ERR_BLOCKS_NOT_FINALIZED
          - calculations.subsidy_per_trip.variants.FINAL
        distinguishing_aspect: |
          The certify gate reads the state of every VehicleBlock in the period — an entity the report
          does not even reference by FK — and the recipe pins the companion subtlety that totals are
          frozen by SUBMIT, not recomputed by CERTIFY: at submit time B1 was still OPEN, so the FINAL
          variant's CLOSED-only block_scope was empty and total_operating_cost_cents is 0 while
          trip_scope already held one COMPLETED trip worth 325 cents of revenue, giving a NEGATIVE
          subsidy_per_trip_cents of -325. After B1 is closed the very same certify call succeeds and
          those frozen totals must NOT change, even though the now-CLOSED block would have
          contributed 11088 cents (1.20 revenue hours) had the report been recomputed.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; stops S0 and S4 approved; vehicle V1 (6 seats, 2 WAV positions); driver D1 (wav_certified true); rider R1 (FULL, NONE)."
            - "Block B1 (V1/D1) 06:00-10:00Z is opened at exactly 06:00:00Z."
