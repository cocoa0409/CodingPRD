              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { esme_id: $.data.id }
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${esme_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-06", discipline: "SANITATION", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "reg-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${esme_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-07", discipline: "SANITATION", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "reg-001"
          trigger:
