  # ===========================================================================
  # Rule 4 — transitive_cascade
  # One chain of depth >= 3, one of depth >= 2, from DIFFERENT triggering
  # transitions. Each hop is caused by the previous hop.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: delinquency_report_chain_reaches_coverage_cancellation
        grounds:
          - state_machines.DelinquencyReport.FILED_to_FILED
          - state_machines.Loan.ACTIVE_to_PENDING_CANCELLATION
          - state_machines.Loan.PENDING_CANCELLATION_to_CANCELLED
          - calculations.delinquency_streak
          - calculations.claim_eligibility_gate
        distinguishing_aspect: "A depth-3 cascade from one report creation: hop 1 sets the loan's eligibility flag and deficiency instant, hop 2 uses those to satisfy the cancellation trigger once the streak reaches three, and hop 3 is the separate expiry transition that turns the pending cancellation into a CANCELLED loan — each hop is caused by the one before it, not by the original request."
