            - "trigger call 2: data has total_count 6 and every item has adjudicated_at at the 2026-08-05 logical clock, and no item is still CAPTURED"
            - "trigger call 3: data.intake_status == \"CLOSED\", data.settlement_status == \"PENDING\" (the lot was VALIDATED, so the all-rejected fraud branch did not fire), data.rejected_lot_count == 0, data.declared_face_value_cents == 300, data.accepted_item_face_value_cents == 50, data.rejected_item_face_value_cents == 300, data.adjudicated_face_value_cents == 350 == 50 + 300"
            - "trigger call 4: status still \"ACTIVE\" and fraud_score still 0.00 — no rescore has run yet"
            - "trigger call 5: data.duplicate_rate == 16.67, data.misredemption_rate == 33.33, data.counterfeit_rate == 16.67 over the six-item pool"
            - "trigger call 5: data.fraud_score == 90.01 = round_half_up(16.67*1.40 + 33.33*1.00 + 16.67*2.00, 2) = round_half_up(90.008, 2); rounding each rate to zero decimals first would give 89.60 and miss the threshold"
            - "trigger call 5: data.status == \"SUSPENDED\" (90.01 >= 90.00) and data.handling_fee_tier == \"PROBATION\""

      - name: offer_withdraw_cascades_only_sorted_lots_and_closes_that_submission
        claim_type: cascade_down
        grounds:
          - state_machines.Offer.transitions.ACTIVE_to_WITHDRAWN
          - state_machines.SubmissionLot.transitions.SORTED_to_LOT_REJECTED[trigger=withdraw_cascade]
          - state_machines.Submission.transitions.SORTED_to_CLOSED
        distinguishing_aspect: |
          The withdraw cascade reaches three levels down (offer -> lots ->
          submission money and intake_status) and stops at terminal children: an
          already-VALIDATED lot on the same offer keeps its status, its 50/7
          valuation and its version, and its own submission is not re-closed.
          The affected submission's lots are rejected without adjudicating a
          single CouponItem, so the fraud rescore that the all-lots-rejected
          branch triggers runs over an empty pool and leaves the retailer ACTIVE
          at 0.00 while still incrementing rejected_submission_count.
