  - rule_id: cross_entity_state_dependency
    instances:

      - name: contract_file_requires_active_registration_in_every_contract_state
        grounds:
          - validations[priority=19]
          - state_machines.FundraisingContract.DRAFT_to_FILED
          - entities.FundraiserRegistration.fields.status
          - calculations.contract_filing_deadline
        depends_on:
          acting_entity: "FundraisingContract (DRAFT, state_codes [CA, FL])"
          gating_entity: "FundraiserRegistration rows of the contract's ProfessionalFundraiser, one per state"
          gating_condition: "every state in state_codes has a FundraiserRegistration with status == ACTIVE"
        distinguishing_aspect: |
          The gate is per-element over the contract's state_codes array, not a single existence
          check: with an ACTIVE CA registration and no FL registration the file call is refused,
          and the identical call succeeds once the FL registration exists. An implementation
          that requires only one ACTIVE registration anywhere, or that consults the
          ProfessionalFundraiser's aggregate registry_status, files the contract on the first
          attempt.
        test_recipe:
          setup:
            - "StateProfiles CA (fundraiser_contract_filing_days 10) and FL (fundraiser_contract_filing_days 15), both with fundraiser_bond_minimum_cents 2500000."
            - "A PROFESSIONAL_SOLICITOR with an ACTIVE CA FundraiserRegistration and no FL registration."
            - "A DRAFT FundraisingContract for state_codes [CA, FL] running 2026-08-01 to 2027-08-01, so filing_due_date is 2026-08-11 under the minimum filing window."
            - "Clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000 }
