      - name: program_income_expenditure_to_exactly_zero_balance_is_permitted
        grounds:
          - calculations.program_income_federal_share
          - validations.priority_56
          - entities.MitigationProject.fields.program_income_balance_cents
          - entities.ProgramIncomeLedgerEntry.fields.federal_share_cents
          - concurrency_rules.program-income-stale-project
        distinguishing_aspect: |
          Signed zero boundary on a running balance: priority 56 rejects an entry only when the
          resulting balance would go NEGATIVE, so debiting the balance to exactly 0 must succeed and
          a further 3-cent debit must be refused. The magnitudes are also rounded on the POSITIVE
          amount before the sign is applied - 100002 at 0.75 rounds to 75002 in both directions, so
          the credit and the debit cancel to exactly zero with no drift.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with cost_share_federal_pct 0.75 and no ledger entries."
            - "One ACTIVE LEASE_REVENUE entry of 100002 posted 2026-08-01, giving program_income_balance_cents 75002."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "PI-ZERO", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "GET /mitigation-projects/${proj}"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { v_credit: $.data.version }
            - call: "POST /mitigation-projects/${proj}/program-income-entries"
              payload: { project_id: "${proj}", entry_type: "LEASE_REVENUE", amount_cents: 100002, posted_on: "2026-08-01", expected_project_version: "${v_credit}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { e_credit: $.data.id }
            - call: "GET /mitigation-projects/${proj}"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { v_debit: $.data.version, balance_before: $.data.program_income_balance_cents }
          trigger:
            - call: "POST /mitigation-projects/${proj}/program-income-entries"
              payload: { project_id: "${proj}", entry_type: "EXPENDITURE", amount_cents: 100002, posted_on: "2026-08-02", expected_project_version: "${v_debit}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { e_debit: $.data.id }
            - call: "GET /mitigation-projects/${proj}"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { v_overdraw: $.data.version }
            - call: "POST /mitigation-projects/${proj}/program-income-entries"
              payload: { project_id: "${proj}", entry_type: "EXPENDITURE", amount_cents: 4, posted_on: "2026-08-03", expected_project_version: "${v_overdraw}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
          assert:
            - "${balance_before} == 75002"
            - "ProgramIncomeLedgerEntry.${e_credit}.federal_share_cents == 75002"
            - "the first trigger call returns 201"
            - "ProgramIncomeLedgerEntry.${e_debit}.federal_share_cents == -75002"
            - "ProgramIncomeLedgerEntry.${e_debit}.status == ACTIVE"
            - "MitigationProject.${proj}.program_income_balance_cents == 0"
            - "the third trigger call returns 422 and data.error_id == ERR_PROGRAM_INCOME_OVERDRAWN"
            - "MitigationProject.${proj}.program_income_balance_cents == 0 after the refused entry"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: appraisal_creation_depends_on_grandparent_project_reaching_approved
        grounds:
          - validations.priority_25
          - entities.MitigationProject.fields.status
          - entities.Parcel.fields.project_id
          - endpoints.POST_parcels_parcel_id_appraisals
          - state_machines.MitigationProject.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The blocking state sits TWO ownership hops above the entity being written: Appraisal ->
          Parcel -> MitigationProject. The request body, the parcel and the acting role are all
          valid; only the grandparent project's status makes the difference, and the identical call
          succeeds after the project is approved with no change to the payload.
        test_recipe:
          setup:
            - "One MitigationProject in SUBMITTED with a VALIDATED PRE_CALCULATED_BENEFIT analysis at bcr 2.667."
            - "One OWNER_OCCUPIED parcel on that project, created while the project was DRAFT."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "XENT-A", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-XA", site_address: "501 River Rd", acreage: 0.34, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: $.data.id }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
          trigger:
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-1", effective_date: "2026-07-01", indicated_value_cents: 20000000 }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-1", effective_date: "2026-07-01", indicated_value_cents: 20000000 }
              as: StaffAppraiser
              as_user_id: "sa-1"
              captures: { ap1: $.data.id }
          assert:
            - "the first trigger call returns 409 and data.error_id == ERR_PROJECT_NOT_APPROVED"
            - "Parcel.${p1}.acquisition_status == NOT_STARTED after the first trigger call"
            - "MitigationProject.${proj}.status == APPROVED after the second trigger call"
            - "the third trigger call returns 201"
            - "Appraisal.${ap1}.status == DRAFT"
            - "Appraisal.${ap1}.appraiser_user_id == sa-1"
            - "Appraisal.${ap1}.revision_count == 0"
            - "Appraisal.${ap1}.validity_end_date == 2027-07-01"
            - "Parcel.${p1}.acquisition_status == APPRAISAL_IN_PROGRESS"

      - name: demolition_start_depends_on_independent_contractor_aggregate_status
        grounds:
          - validations.priority_37
          - entities.DemolitionContractor.fields.status
          - state_machines.DemolitionContractor.ACTIVE_to_SUSPENDED
          - state_machines.DemolitionWorkOrder.READY_to_IN_PROGRESS
          - endpoints.POST_demolition-work-orders_work_order_id_start
        distinguishing_aspect: |
          The blocking state sits on an INDEPENDENT aggregate root that is not in the work order's
          ownership chain at all - DemolitionContractor is referenced, not owned - and the check
          reads the contractor's CURRENT status rather than the one captured when the work order was
          issued. The work order is fully READY with asbestos CLEARED, so priorities 36 and 48 are
          both satisfied and only the contractor's suspension blocks the start.
        test_recipe:
          setup:
            - "One MitigationProject in DRAFT with one parcel."
            - "One DemolitionContractor, asbestos_certified true, ACTIVE at the time the work order was issued and then SUSPENDED."
            - "One DemolitionWorkOrder in READY: asbestos_survey_status CLEARED and all four required utility disconnections CONFIRMED."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "XENT-B", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
