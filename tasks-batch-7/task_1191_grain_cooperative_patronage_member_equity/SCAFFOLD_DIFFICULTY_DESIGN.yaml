              payload: { delegate_id: "${del_m22}", vote: "FOR" }
              as: BoardSecretary
            - call: "POST /coop/revolvement_cycles/${cyc_a}/open"
              payload: {}
              as: BoardSecretary
            - call: "POST /coop/board_resolutions"
              payload: { resolution_code: "RES-CYC-B", kind: "OPEN_REVOLVEMENT", subject_ref_id: "placeholder-cyc-b", quorum_required: 1, voting_opens_at: "2029-12-01T00:00:00Z", voting_closes_at: "2029-12-31T00:00:00Z" }
