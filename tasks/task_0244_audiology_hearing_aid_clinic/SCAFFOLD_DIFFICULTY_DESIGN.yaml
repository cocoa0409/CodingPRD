              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-DRF-1", name: "DraftModel", list_price_cents: 300000, restock_fee_cents: 15000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
