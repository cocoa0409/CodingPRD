    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RENEWAL_FORECAST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE_TRANSITION, ERR_FORECAST_NOT_SUBMITTED]

