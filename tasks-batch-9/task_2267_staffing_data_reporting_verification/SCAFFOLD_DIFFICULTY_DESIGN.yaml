scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: hprd_as_submitted_vs_audit_adjusted_divergence
        grounds:
          - calculations.hprd_reconciliation
          - entities.HourEntry.fields.verification_status
          - entities.CensusDay.fields.mds_resident_count
          - endpoints[GET /submissions/{id}/hprd]
        distinguishing_aspect: |
          This instance exercises the dual variant in the QuarterlySubmission hours-per-resident-day
          domain: as_submitted counts every ACTIVE hour over facility-reported resident_count
          (4.0000) while audit_adjusted counts only SUPPORTED hours over MDS-substituted resident
          days (1.8750), so both the numerator filter and the denominator source differ.
        test_recipe:
          setup:
            - "One TX facility with an OPEN 2026Q2 period covering 2026-04-01..2026-04-30, deadline 2026-08-14T23:59:59Z, correction window to 2026-12-31T23:59:59Z"
            - "A DRAFT QuarterlySubmission carrying four 15.00-hour RN shifts on 2026-04-01..2026-04-04 (60.00 direct care hours total)"
            - "Only the 2026-04-01 and 2026-04-02 entries are payroll-supported and verified SUPPORTED (30.00 hours)"
            - "Three census days: 2026-04-01 resident_count 5 mds 5 RECONCILED, 2026-04-02 resident_count 5 mds null REPORTED, 2026-04-04 resident_count 5 mds 6 DISPUTED"
            - "Logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - &c_fac
              call: "POST /facilities"
              payload: { ccn: "675001", name: "Cedar Grove Care Center", state_code: "TX", certified_bed_count: 120 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { fac: $.data.id }
            - &c_per
              call: "POST /reporting-periods"
              payload: { period_code: "2026Q2", state_code: "TX", start_date: "2026-04-01", end_date: "2026-04-30", submission_deadline: "2026-08-14T23:59:59Z", correction_window_end: "2026-12-31T23:59:59Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { per: $.data.id }
            - &c_jc_rn
              call: "POST /job-categories"
              payload: { code: "RN", cms_job_code: 5, direct_care_class: "DIRECT_CARE", nurse_group: "RN", direct_care_credit_pct: 1.00, weekend_countable: true }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { jc_rn: $.data.id }
            - &c_jc_split
              call: "POST /job-categories"
              payload: { code: "RN_ADMIN", cms_job_code: 3, direct_care_class: "DIRECT_CARE_SPLIT", nurse_group: "RN", direct_care_credit_pct: 0.60, weekend_countable: true }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { jc_split: $.data.id }
            - &c_jc_admin
              call: "POST /job-categories"
              payload: { code: "ADMIN", cms_job_code: 1, direct_care_class: "ADMINISTRATIVE", nurse_group: "NONE", direct_care_credit_pct: 0.00, weekend_countable: false }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { jc_admin: $.data.id }
            - &c_w_coord
              call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Dana Coordinator", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_admin}", hire_date: "2026-01-01", authorized_roles: ["STAFFING_COORDINATOR"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_coord: $.data.id }
            - &c_w_admin
              call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Avery Administrator", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_admin}", hire_date: "2026-01-01", authorized_roles: ["FACILITY_ADMINISTRATOR"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_admin: $.data.id }
            - &c_w_rn
              call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Riley Nurse", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_rn}", hire_date: "2026-01-01", authorized_roles: [] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_rn: $.data.id }
            - &c_sub
              call: "POST /submissions"
              payload: { facility_id: "${fac}", reporting_period_id: "${per}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { sub: $.data.id, sv: $.data.version }
            - call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-01", pay_period_end: "2026-04-01", paid_hours: 15.00, support_type: "TIMECARD", document_ref: "TC-20260401" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { pr1: $.data.id }
            - call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-02", pay_period_end: "2026-04-02", paid_hours: 15.00, support_type: "TIMECARD", document_ref: "TC-20260402" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { pr2: $.data.id }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "22:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], payroll_record_id: "${pr1}", expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e1: $.data.id, sv2: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "07:00", shift_end: "22:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], payroll_record_id: "${pr2}", expected_submission_version: "${sv2}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e2: $.data.id, sv3: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-03", shift_start: "07:00", shift_end: "22:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv3}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e3: $.data.id, sv4: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-04", shift_start: "07:00", shift_end: "22:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv4}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e4: $.data.id, sv5: $.data.submission_version }
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-01", resident_count: 5, mds_resident_count: 5 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c1: $.data.id }
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-02", resident_count: 5 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c2: $.data.id }
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-04", resident_count: 5, mds_resident_count: 6 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c3: $.data.id }
            - call: "POST /census-days/${c1}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /census-days/${c3}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /hour-entries/${e1}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
            - call: "POST /hour-entries/${e2}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
          trigger:
            - call: "GET /submissions/${sub}/hprd"
              payload: { variant: "AS_SUBMITTED" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "GET /submissions/${sub}/hprd"
              payload: { variant: "AUDIT_ADJUSTED" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "GET /submissions/${sub}/hprd variant AS_SUBMITTED returns total_direct_care_hours == 60.00, resident_days == 15, total_nurse_hprd == 4.0000, rn_hprd == 4.0000"
            - "GET /submissions/${sub}/hprd variant AS_SUBMITTED returns weekend_direct_care_hours == 15.00, weekend_resident_days == 5, weekend_total_nurse_hprd == 3.0000"
            - "GET /submissions/${sub}/hprd variant AUDIT_ADJUSTED returns total_direct_care_hours == 30.00, resident_days == 16, total_nurse_hprd == 1.8750, rn_hprd == 1.8750"
            - "GET /submissions/${sub}/hprd variant AUDIT_ADJUSTED returns weekend_direct_care_hours == 0.00, weekend_resident_days == 6, weekend_total_nurse_hprd == 0.0000"
            - "the two variants diverge: 4.0000 - 1.8750 == 2.1250 on total_nurse_hprd"
            - "QuarterlySubmission.${sub}.hprd_reported == 4.0000 (the persisted field always holds the as_submitted variant)"

      - name: audit_support_score_sampled_vs_full_population
        grounds:
          - calculations.audit_support_score
          - endpoints[GET /facilities/{id}/audit-readiness]
          - entities.CensusDay.fields.status
        distinguishing_aspect: |
          This instance exercises the dual variant in the Facility audit-readiness domain, where the
          variants differ by sample truncation rather than by data filtering: sampled_audit scores only
          the first 5 entries ordered by work_date ASC then created_at ASC and yields 64.17 (at risk),
          while full_population scores all 6 entries and yields exactly 70.00 (not at risk).
        test_recipe:
          setup:
            - "One TX facility with an OPEN 2026Q2 period and a DRAFT submission"
            - "Six RN shifts: 2026-04-01 8.00h, 2026-04-02 12.00h, 2026-04-03 12.00h, 2026-04-04 8.00h, 2026-04-05 8.00h, 2026-04-06 12.00h (60.00 direct care hours)"
            - "The 2026-04-01, 2026-04-02, and 2026-04-06 entries are payroll-supported and verified SUPPORTED (32.00 hours; only 20.00 of that falls in the first five by work_date)"
            - "Three census days 2026-04-01 (5/5), 2026-04-02 (5/5), 2026-04-03 (5/6), all reconciled so two land RECONCILED and one lands DISPUTED"
            - "No vendor-sourced hours, so vendor_attestation_ratio is the 1.0000 empty-set default"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-01", pay_period_end: "2026-04-01", paid_hours: 8.00, support_type: "TIMECARD", document_ref: "TC-A0401" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { pr1: $.data.id }
            - call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-02", pay_period_end: "2026-04-02", paid_hours: 12.00, support_type: "TIMECARD", document_ref: "TC-A0402" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { pr2: $.data.id }
            - call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-06", pay_period_end: "2026-04-06", paid_hours: 12.00, support_type: "TIMECARD", document_ref: "TC-A0406" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { pr6: $.data.id }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], payroll_record_id: "${pr1}", expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e1: $.data.id, sv2: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], payroll_record_id: "${pr2}", expected_submission_version: "${sv2}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e2: $.data.id, sv3: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-03", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv3}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e3: $.data.id, sv4: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-04", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv4}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e4: $.data.id, sv5: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-05", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv5}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e5: $.data.id, sv6: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-06", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], payroll_record_id: "${pr6}", expected_submission_version: "${sv6}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e6: $.data.id, sv7: $.data.submission_version }
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-01", resident_count: 5, mds_resident_count: 5 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c1: $.data.id }
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-02", resident_count: 5, mds_resident_count: 5 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c2: $.data.id }
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-03", resident_count: 5, mds_resident_count: 6 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c3: $.data.id }
            - call: "POST /census-days/${c1}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /census-days/${c2}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /census-days/${c3}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /hour-entries/${e1}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
            - call: "POST /hour-entries/${e2}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
            - call: "POST /hour-entries/${e6}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
          trigger:
            - call: "GET /facilities/${fac}/audit-readiness"
              payload: { submission_id: "${sub}", variant: "SAMPLED" }
              as: StateAuditor
              as_user_id: "auditor-read-01"
            - call: "GET /facilities/${fac}/audit-readiness"
              payload: { submission_id: "${sub}", variant: "FULL" }
              as: StateAuditor
              as_user_id: "auditor-read-01"
          assert:
            - "variant SAMPLED returns considered_entry_count == 5, considered_hours == 48.00, supported_hours == 20.00, support_ratio == 0.4167"
            - "variant SAMPLED returns vendor_attestation_ratio == 1.0000, census_reconciled_ratio == 0.6667, score == 64.17, at_risk == true"
            - "variant FULL returns considered_entry_count == 6, considered_hours == 60.00, supported_hours == 32.00, support_ratio == 0.5333"
            - "variant FULL returns score == 70.00 and at_risk == false, because at_risk uses a strict < against 70.00"
            - "the two variants diverge by exactly 70.00 - 64.17 == 5.83 score points on identical stored data"

  - rule_id: combinatorial_formula
    instances:
      - name: allocation_rounding_per_line_before_sum
        grounds:
          - calculations.hour_entry_classification
          - entities.HourEntry.fields.direct_care_hours
          - entities.HourEntry.fields.excluded_hours
          - endpoints[POST /hour-entries]
        distinguishing_aspect: |
          Mode (b) multi-step rounding order: each of the three allocation lines is rounded to
          2 decimals before summing, producing direct_care_hours 4.62; summing the unrounded line
          values and rounding once yields 4.61, so the pinned per-line rounding order is the only
          way to reach the correct literal.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, DRAFT submission, RN / RN_ADMIN / ADMIN job categories with direct_care_credit_pct 1.00 / 0.60 / 0.00"
            - "Worker Riley Nurse hired 2026-01-01, no hours reported yet"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "14:30", allocations: [{ job_category_id: "${jc_rn}", percent: 45.00 }, { job_category_id: "${jc_split}", percent: 27.50 }, { job_category_id: "${jc_admin}", percent: 27.50 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e1: $.data.id }
          assert:
            - "HourEntry.${e1}.raw_hours == 7.50"
            - "HourEntry.${e1}.direct_care_hours == 4.62"
            - "HourEntry.${e1}.direct_care_hours != 4.61 (the sum-then-round result is wrong)"
            - "HourEntry.${e1}.excluded_hours == 2.88"
            - "HourEntry.${e1}.rn_hours == 4.62"
            - "HourEntry.${e1}.lpn_hours == 0.00 and HourEntry.${e1}.na_hours == 0.00"
            - "QuarterlySubmission.${sub}.total_raw_hours == 7.50, total_direct_care_hours == 4.62, total_excluded_hours == 2.88"

      - name: amendment_surcharge_tier_keyed_on_base_fee_not_total
        grounds:
          - calculations.amendment_surcharge
          - state_machines.QuarterlySubmission.ACCEPTED_to_DRAFT
          - endpoints[POST /submissions/{id}/reopen]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Mode (c) circular-looking evaluation order: the late-rate tier is looked up on
          base_fee_cents (25000, tier 0.0200) and fixed before late_fee_cents is added, giving
          28000 cents; reading the tier off the resulting 28000 total would select 0.0300 and
          give 29500 cents, so the pinned order is the only path to the correct literal.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period with submission_deadline 2026-08-14T23:59:59Z"
            - "A submission carrying one payroll-supported 8.00-hour RN shift on 2026-04-01 and one RECONCILED census day, driven all the way to ACCEPTED with amendment_index 0 and amendment_surcharge_cents 0"
            - "Logical clock repositioned to 2026-08-20T12:00:00Z, which is 5 days 12:00:01 past the deadline and therefore 6 whole late days"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - &c_pr_0401
              call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-01", pay_period_end: "2026-04-01", paid_hours: 8.00, support_type: "TIMECARD", document_ref: "TC-B0401" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { pr1: $.data.id }
            - &c_entry_0401
              call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], payroll_record_id: "${pr1}", expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e1: $.data.id, sv2: $.data.submission_version }
            - &c_census_0401
              call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-01", resident_count: 5, mds_resident_count: 5 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c1: $.data.id }
            - &c_reconcile_c1
              call: "POST /census-days/${c1}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - &c_verify_e1
              call: "POST /hour-entries/${e1}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
            - &c_validate
              call: "POST /submissions/${sub}/validate"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - &c_submit
              call: "POST /submissions/${sub}/submit"
              payload: {}
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
            - &c_accept
              call: "POST /submissions/${sub}/accept"
              payload: {}
              as: StateAuditor
              as_user_id: "auditor-accept-01"
              captures: { sv_acc: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /submissions/${sub}/reopen"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "QuarterlySubmission.${sub}.status == DRAFT"
            - "QuarterlySubmission.${sub}.amendment_index == 1"
            - "QuarterlySubmission.${sub}.amendment_surcharge_cents == 28000"
            - "QuarterlySubmission.${sub}.amendment_surcharge_cents != 29500 (the total-keyed tier reading is wrong)"
            - "QuarterlySubmission.${sub}.waived_surcharge_cents == 0"
            - "Facility.${fac}.outstanding_surcharge_cents == 28000"
            - "QuarterlySubmission.${sub}.validated_by_worker_id == null and QuarterlySubmission.${sub}.attested_by_worker_id == null"

  - rule_id: non_linear_state_machine
    instances:
      - name: submission_cycle_accepted_reopened_revalidated
        grounds:
          - state_machines.QuarterlySubmission.ACCEPTED_to_DRAFT
          - state_machines.QuarterlySubmission.DRAFT_to_VALIDATED
          - entities.QuarterlySubmission.fields.amendment_index
        distinguishing_aspect: |
          Non-linearity here is a true cycle in one dimension: the submission traverses
          DRAFT -> VALIDATED -> SUBMITTED -> ACCEPTED -> DRAFT -> VALIDATED, and the second pass
          through DRAFT is distinguishable from the first because amendment_index is 1 and the
          attestation fields were cleared and re-earned.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, one payroll-supported 8.00-hour RN shift on 2026-04-01, one RECONCILED census day"
            - "The submission has been accepted once at the default clock 2026-08-01T00:00:00Z, which is before the deadline so no late fee accrues"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - *c_pr_0401
            - *c_entry_0401
            - *c_census_0401
            - *c_reconcile_c1
            - *c_verify_e1
            - *c_validate
            - *c_submit
            - *c_accept
          trigger:
            - call: "POST /submissions/${sub}/reopen"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /submissions/${sub}/validate"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "QuarterlySubmission.${sub}.status == VALIDATED on the second pass"
            - "QuarterlySubmission.${sub}.amendment_index == 1"
            - "QuarterlySubmission.${sub}.amendment_surcharge_cents == 25000 (base fee only, 0 late days at the 2026-08-01T00:00:00Z clock)"
            - "QuarterlySubmission.${sub}.validated_by_worker_id == ${w_coord} after the re-validate"
            - "QuarterlySubmission.${sub}.attested_by_worker_id == null (cleared by the reopen and not yet re-earned)"
            - "QuarterlySubmission.${sub}.total_direct_care_hours == 8.00 and hprd_reported == 1.6000 are preserved across the cycle"
            - "QuarterlySubmission.${sub}.open_fatal_finding_count == 0"

      - name: hour_entry_orthogonal_void_and_verification_dimensions
        grounds:
          - state_machines.HourEntry.ACTIVE_to_VOID
          - state_machines.HourEntry.UNVERIFIED_to_SUPPORTED
          - entities.HourEntry.fields.entry_status
          - entities.HourEntry.fields.verification_status
        distinguishing_aspect: |
          Non-linearity here is two independent state dimensions on one entity rather than a cycle:
          voiding the entry advances entry_status to VOID while verification_status stays SUPPORTED
          and verified_by_user_id is retained, and the void removes the hours from the submission
          rollup without touching the verification axis.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, DRAFT submission with one payroll-supported 8.00-hour RN shift on 2026-04-01 and one census day"
            - "The entry has already been verified SUPPORTED by auditor-verify-01"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - *c_pr_0401
            - *c_entry_0401
            - *c_census_0401
            - *c_reconcile_c1
            - *c_verify_e1
          trigger:
            - call: "POST /hour-entries/${e1}/void"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "HourEntry.${e1}.entry_status == VOID"
            - "HourEntry.${e1}.verification_status == SUPPORTED (unchanged by the void)"
            - "HourEntry.${e1}.verified_by_user_id == auditor-verify-01 (retained across the void)"
            - "HourEntry.${e1}.raw_hours == 8.00 and HourEntry.${e1}.direct_care_hours == 8.00 are retained on the row"
            - "QuarterlySubmission.${sub}.total_raw_hours == 0.00 and total_direct_care_hours == 0.00"
            - "QuarterlySubmission.${sub}.hprd_reported == 0.0000"
            - "Worker.${w_rn}.reported_hours_total == 0.00"

  - rule_id: transitive_cascade
    instances:
      - name: substantiation_cascade_sanctions_facility_and_reverts_other_submission
        grounds:
          - state_machines.DiscrepancyCase.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.StaffingMeasure.UNDER_AUDIT_to_AUDIT_REVISED
          - state_machines.Facility.REPORTING_OPEN_to_SANCTIONED
          - calculations.facility_posture_derivation
        distinguishing_aspect: |
          Trigger is a case substantiation. Depth 4: (1) the case becomes SUBSTANTIATED,
          (2) the named StaffingMeasure flips audit_status to AUDIT_REVISED and recomputes on the
          audit_adjusted variant so staffing_rating drops 5 -> 3, (3) facility_posture_derivation sets
          Facility.posture SANCTIONED and refreshes latest_staffing_rating, (4) a completely separate
          VALIDATED submission for the next reporting period is knocked back to DRAFT with a FATAL
          FACILITY_SANCTIONED finding.
        test_recipe:
          setup:
            - "One TX facility with two non-overlapping periods: 2026Q2 (2026-04-01..2026-04-30) and 2026Q3 (2026-07-01..2026-07-31)"
            - "The 2026Q2 submission carries a 12.00-hour RN shift on 2026-04-01 (payroll-supported, verified SUPPORTED) and a 12.00-hour RN shift on Saturday 2026-04-04 (unverified), with two RECONCILED census days of resident_count 2 / mds 2"
            - "That submission is ACCEPTED with audit_support_score 75.00, so no automatic case was opened, and its published measure has staffing_rating 5"
            - "The 2026Q3 submission is VALIDATED, carrying an 8.00-hour RN shift on 2026-07-01 and one census day"
            - "A manually opened DiscrepancyCase names the published measure and has been walked OPEN -> INFO_REQUESTED -> UNDER_REVIEW, which moved the measure to UNDER_AUDIT"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-01", pay_period_end: "2026-04-01", paid_hours: 12.00, support_type: "TIMECARD", document_ref: "TC-C0401" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { pr1: $.data.id }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], payroll_record_id: "${pr1}", expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e1: $.data.id, sv2: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-04", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv2}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e2: $.data.id, sv3: $.data.submission_version }
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-01", resident_count: 2, mds_resident_count: 2 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c1: $.data.id }
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-04", resident_count: 2, mds_resident_count: 2 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c2: $.data.id }
            - call: "POST /census-days/${c1}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /census-days/${c2}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /hour-entries/${e1}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
            - *c_validate
            - *c_submit
            - *c_accept
            - call: "POST /staffing-measures"
              payload: { submission_id: "${sub}" }
              as: CmsPublisher
              as_user_id: "publisher-01"
              captures: { meas: $.data.id }
            - call: "POST /staffing-measures/${meas}/publish"
              payload: {}
              as: CmsPublisher
              as_user_id: "publisher-01"
            - call: "POST /reporting-periods"
              payload: { period_code: "2026Q3", state_code: "TX", start_date: "2026-07-01", end_date: "2026-07-31", submission_deadline: "2026-11-14T23:59:59Z", correction_window_end: "2027-03-31T23:59:59Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { per2: $.data.id }
            - call: "POST /submissions"
              payload: { facility_id: "${fac}", reporting_period_id: "${per2}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { sub2: $.data.id, sv_b: $.data.version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub2}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-07-01", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv_b}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e3: $.data.id }
            - call: "POST /census-days"
              payload: { submission_id: "${sub2}", census_date: "2026-07-01", resident_count: 2, mds_resident_count: 2 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c3: $.data.id }
            - call: "POST /submissions/${sub2}/validate"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /discrepancy-cases"
              payload: { facility_id: "${fac}", submission_id: "${sub}", staffing_measure_id: "${meas}", trigger_reason: "UNSUPPORTED_HOURS", detail: "Half of the reported 2026Q2 hours have no payroll support." }
              as: StateAuditor
              as_user_id: "auditor-case-01"
              captures: { case: $.data.id }
            - call: "POST /discrepancy-cases/${case}/request-info"
              payload: { request_note: "Provide timecards for the 2026-04-04 shift." }
              as: StateAuditor
              as_user_id: "auditor-case-01"
            - call: "POST /discrepancy-cases/${case}/respond"
              payload: { response_note: "No timecard exists for the 2026-04-04 shift." }
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
          trigger:
            - call: "POST /discrepancy-cases/${case}/substantiate"
              payload: { resolution_note: "Unsupported hours confirmed; measure to be recomputed on supported hours only." }
              as: StateAuditor
              as_user_id: "auditor-case-01"
          assert:
            - "level 1: DiscrepancyCase.${case}.status == SUBSTANTIATED and facility_response_count == 1"
            - "level 2: StaffingMeasure.${meas}.audit_status == AUDIT_REVISED, measure_variant == AUDIT_ADJUSTED, publication_status == PUBLISHED (untouched dimension)"
            - "level 2: StaffingMeasure.${meas}.total_nurse_hprd == 3.0000, rn_hprd == 3.0000, weekend_total_nurse_hprd == 0.0000"
            - "level 2: StaffingMeasure.${meas}.total_nurse_points == 4, rn_points == 5, days_with_zero_rn_hours == 0, staffing_rating == 3 (was 5 before the cascade)"
            - "level 3: Facility.${fac}.posture == SANCTIONED, substantiated_case_count == 1, open_case_count == 0, latest_staffing_rating == 3"
            - "level 4: QuarterlySubmission.${sub2}.status == DRAFT and open_fatal_finding_count == 1"
            - "level 4: GET /submissions/${sub2}/findings contains a ValidationFinding with code FACILITY_SANCTIONED, severity FATAL, status OPEN"
            - "QuarterlySubmission.${sub}.status == ACCEPTED (already-accepted submissions are not reverted)"

      - name: vendor_batch_accept_cascade_flips_submission_back_to_draft
        grounds:
          - state_machines.VendorHourSubmission.SUBMITTED_to_ACCEPTED
          - state_machines.QuarterlySubmission.VALIDATED_to_DRAFT
          - calculations.submission_hour_census_rollup
          - calculations.hprd_reconciliation
        distinguishing_aspect: |
          Different trigger from the substantiation cascade: accepting a vendor hour batch.
          Depth 4: (1) the batch becomes ACCEPTED, (2) two HourEntry rows are synthesized into the
          target submission, (3) the rollup and hprd_reported are recomputed to 36.00 hours over
          2 resident days = 18.0000, (4) that implausible value knocks the VALIDATED submission back
          to DRAFT and the vendor's accepted_hours_total is refreshed; a follow-up validate then
          raises the FATAL HPRD_IMPLAUSIBLE finding.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, and an approved staffing vendor with one AGENCY_CONTRACTOR worker"
            - "A submission with one 12.00-hour RN shift on 2026-04-01 and one census day of resident_count 2, validated at hprd_reported 6.0000"
            - "A SUBMITTED VendorHourSubmission carrying two 12.00-hour RN lines on 2026-04-02 and 2026-04-03"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - call: "POST /vendors"
              payload: { facility_id: "${fac}", vendor_name: "Northgate Agency Staffing", tax_id: "74-2210099", attestation_contact: "ops@northgate.example" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { vend: $.data.id }
            - call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Casey Agency", worker_type: "AGENCY_CONTRACTOR", primary_job_category_id: "${jc_rn}", hire_date: "2026-01-01", vendor_id: "${vend}" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_ag: $.data.id }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e1: $.data.id, sv2: $.data.submission_version }
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-01", resident_count: 2, mds_resident_count: 2 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c1: $.data.id }
            - *c_validate
            - call: "POST /vendor-submissions"
              payload: { vendor_id: "${vend}", facility_id: "${fac}", reporting_period_id: "${per}", attested_by: "Northgate Ops Lead", lines: [{ worker_id: "${w_ag}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }] }, { worker_id: "${w_ag}", job_category_id: "${jc_rn}", work_date: "2026-04-03", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }] }] }
              as: VendorRepresentative
              as_user_id: "${vend}"
              captures: { batch: $.data.id }
            - call: "POST /vendor-submissions/${batch}/submit"
              payload: {}
              as: VendorRepresentative
              as_user_id: "${vend}"
          trigger:
            - call: "POST /vendor-submissions/${batch}/accept"
              payload: { submission_id: "${sub}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /submissions/${sub}/validate"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "level 1: VendorHourSubmission.${batch}.status == ACCEPTED, line_count == 2, accepted_direct_care_hours == 24.00"
            - "level 2: GET /hour-entries with submission_id ${sub} returns 3 entries, the two synthesized ones having source VENDOR_SUBMISSION and worker_id ${w_ag}"
            - "level 3: QuarterlySubmission.${sub}.total_direct_care_hours == 36.00, vendor_sourced_hours == 24.00, total_resident_days == 2, hprd_reported == 18.0000"
            - "level 4: QuarterlySubmission.${sub}.status was flipped VALIDATED -> DRAFT by the accept, and StaffingVendor.${vend}.accepted_hours_total == 24.00"
            - "after the follow-up validate: QuarterlySubmission.${sub}.status == VALIDATED with open_fatal_finding_count == 1"
            - "GET /submissions/${sub}/findings contains a ValidationFinding with code HPRD_IMPLAUSIBLE and severity FATAL, because 18.0000 exceeds MAX_PLAUSIBLE_HPRD 12.0000"
            - "Worker.${w_ag}.reported_hours_total == 24.00"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submission_state_error_precedes_correction_window_error
        grounds:
          - validations[priority 18 ERR_SUBMISSION_STATE_INVALID]
          - validations[priority 42 ERR_CORRECTION_WINDOW_CLOSED]
          - endpoints[POST /hour-entries]
        distinguishing_aspect: |
          Category pair is state (priority 18) versus business_temporal (priority 42): the submission
          is ACCEPTED and the clock is past correction_window_end, so both rules fire and the lower
          priority number must win.
        test_recipe:
          setup:
            - "An ACCEPTED 2026Q2 submission whose correction_deadline is 2026-12-31T23:59:59Z"
            - "The logical clock advanced to 2027-01-05T00:00:00Z, which is past the correction window"
            - "The reporting period is still OPEN, so the priority 17 period check does not fire"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - *c_pr_0401
            - *c_entry_0401
            - *c_census_0401
            - *c_reconcile_c1
            - *c_verify_e1
            - *c_validate
            - *c_submit
            - *c_accept
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv_acc}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "response is 409 with error_id ERR_SUBMISSION_STATE_INVALID"
            - "error_id is not ERR_CORRECTION_WINDOW_CLOSED even though 2027-01-05T00:00:00Z is past correction_deadline 2026-12-31T23:59:59Z"
            - "QuarterlySubmission.${sub}.total_direct_care_hours remains 8.00 and version is unchanged"
            - "GET /hour-entries with submission_id ${sub} still returns exactly 1 entry"

      - name: worker_facility_mismatch_precedes_shift_length_error
        grounds:
          - validations[priority 44 ERR_WORKER_FACILITY_MISMATCH]
          - validations[priority 50 ERR_SHIFT_LENGTH_EXCEEDED]
          - endpoints[POST /hour-entries]
        distinguishing_aspect: |
          A different category pair from the state/temporal instance: business_referential
          (priority 44) versus business_constraint (priority 50). The referenced worker belongs to
          a second facility and the shift is 17.00 hours, exceeding MAX_SHIFT_HOURS 16.00, so the
          referential error must be reported.
        test_recipe:
          setup:
            - "Two facilities: Cedar Grove (with the DRAFT 2026Q2 submission) and Willow Bend"
            - "Worker Sam Substitute belongs to Willow Bend and was hired 2026-01-01"
            - "The attempted entry runs 06:00 to 23:00, which is 17.00 hours"
          setup_api_calls:
            - *c_fac
            - *c_per
            - *c_jc_rn
            - *c_jc_split
            - *c_jc_admin
            - *c_w_coord
            - *c_w_admin
            - *c_w_rn
            - *c_sub
            - call: "POST /facilities"
              payload: { ccn: "675002", name: "Willow Bend Nursing", state_code: "TX", certified_bed_count: 90 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { fac2: $.data.id }
            - call: "POST /workers"
              payload: { facility_id: "${fac2}", full_name: "Sam Substitute", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_rn}", hire_date: "2026-01-01" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_other: $.data.id }
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_other}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "06:00", shift_end: "23:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "response is 422 with error_id ERR_WORKER_FACILITY_MISMATCH"
            - "error_id is not ERR_SHIFT_LENGTH_EXCEEDED even though 17.00 exceeds MAX_SHIFT_HOURS 16.00"
            - "no HourEntry is created and QuarterlySubmission.${sub}.version is unchanged"
            - "Worker.${w_other}.reported_hours_total == 0.00"

  - rule_id: boundary_precision_check
    instances:
      - name: census_variance_exactly_at_tolerance_reconciles
        grounds:
          - calculations.census_variance_reconciliation
          - endpoints[POST /census-days/{id}/reconcile]
          - entities.CensusDay.fields.variance_pct
        distinguishing_aspect: |
          Boundary metric is variance_pct against CENSUS_VARIANCE_TOLERANCE 0.0500 on the reconcile
          endpoint. 105 against an MDS count of 100 lands exactly on 0.0500 and must RECONCILE
          because the comparison is <=; 106 lands on 0.0600 and must go DISPUTED.
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, DRAFT submission"
            - "Census day 2026-04-01 with resident_count 105 and mds_resident_count 100"
            - "Census day 2026-04-02 with resident_count 106 and mds_resident_count 100"
