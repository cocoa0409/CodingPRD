    instances:
      - name: satisfaction_to_pass_advance_exactly_equal_to_the_borrowing_base_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=44]
          - calculations.facility_borrowing_base
          - endpoints[POST /lease-buyouts/financing-facilities/{id}/advances]
        distinguishing_aspect: |
          The rule is <= and is therefore satisfied at equality: an advance of exactly 29007557 cents
          against a borrowing base of exactly 29007557 is accepted with 200, leaving
          advances_outstanding_cents == borrowing_base_cents and compliance_state COMPLIANT rather than
          BORROWING_BASE_DEFICIT, because the deficit test is a strict > comparison.
