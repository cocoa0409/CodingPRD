            - { call: "POST /conf/waitlist-entries", payload: { window_id: "${w}", student_id: "${e1}", teacher_id: "${t2}", channel_pref: "EITHER" }, as: FamilyGuardian, as_user_id: "${famE}", captures: { entryE: $.data.id } }
