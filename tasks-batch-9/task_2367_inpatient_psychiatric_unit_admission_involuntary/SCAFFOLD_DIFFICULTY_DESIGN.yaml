# =============================================================================
# §1.8 Scaffold Difficulty Design — task 2367
# 9 rule_ids x >= 2 instances = 19 instances.
# Every numeric literal in `assert:` was produced by executing the matching
# §1.3 formula as code; none are estimates.
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: hold_deadline_calendar_vs_judicial_day_variants_diverge
        grounds:
          - calculations.hold_deadline_pair
          - entities.HoldOrder.fields.release_deadline_at
          - entities.HoldOrder.fields.petition_filing_deadline_at
          - entities.EmergencyEvaluation.fields.signed_at
        distinguishing_aspect: |
          One HoldOrder carries two deadlines computed from the identical anchor and identical
          72-hour offset: the calendar_clock variant lands on 2026-09-06T14:30:00.000Z while the
          judicial_day_clock variant rolls the same raw instant across a Sunday and the
          2026-09-07 holiday to 2026-09-08T09:00:00.000Z — a 41.5-hour divergence on one row.
        test_recipe:
          setup:
            - "Two patients registered; no admissions exist, so prior_admission_count_30d is 0 for both evaluations."
            - "Patient B's evaluation is signed at 2026-09-01T10:00:00Z (Tuesday) — a weekday anchor whose raw +72h instant already sits inside the court window."
            - "Patient A's evaluation is signed at 2026-09-03T14:30:00Z (Thursday) — an anchor whose raw +72h instant lands on Sunday 2026-09-06."
            - "Both evaluations report danger_to_self true and capacity_present false, so acuity_score is 7 (MODERATE) and recommended_status is INVOLUNTARY_HOLD."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-A", legal_name: "Patient A", age_years: 34, gender_care_category: "FEMALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_a: $.data.id }
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-B", legal_name: "Patient B", age_years: 41, gender_care_category: "MALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_b: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_b}", danger_to_self: true, danger_to_others: false, grave_disability: false, capacity_present: false, clinical_summary: "Weekday anchor case." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_b: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_b}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T14:30:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_a}", danger_to_self: true, danger_to_others: false, grave_disability: false, capacity_present: false, clinical_summary: "Weekend-rolling anchor case." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_a: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_a}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
          trigger:
            - call: "POST /behavioral-health/holds"
              payload: { patient_id: "${p_a}", evaluation_id: "${e_a}", hold_type: "EMERGENCY_72H" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { h_a: $.data.id }
            - call: "POST /behavioral-health/holds"
              payload: { patient_id: "${p_b}", evaluation_id: "${e_b}", hold_type: "EMERGENCY_72H" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { h_b: $.data.id }
          assert:
            - "HoldOrder.${h_a}.statutory_hours == 72"
            - "HoldOrder.${h_a}.clock_started_at == \"2026-09-03T14:30:00.000Z\" (the evaluation's signed_at, NOT the hold's created_at)"
            - "HoldOrder.${h_a}.certification_deadline_at == \"2026-09-03T18:30:00.000Z\""
            - "HoldOrder.${h_a}.release_deadline_at == \"2026-09-06T14:30:00.000Z\" (calendar_clock variant)"
            - "HoldOrder.${h_a}.petition_filing_deadline_at == \"2026-09-08T09:00:00.000Z\" (judicial_day_clock variant: Sunday 09-06 rolled, holiday 09-07 rolled)"
            - "HoldOrder.${h_a}.petition_filing_deadline_at != HoldOrder.${h_a}.release_deadline_at"
            - "HoldOrder.${h_b}.release_deadline_at == \"2026-09-04T10:00:00.000Z\""
            - "HoldOrder.${h_b}.petition_filing_deadline_at == \"2026-09-04T10:00:00.000Z\" (variants coincide when the raw instant already sits inside a judicial-day window)"
            - "HoldOrder.${h_a}.status == \"PENDING_CERTIFICATION\" and HoldOrder.${h_b}.status == \"PENDING_CERTIFICATION\""

      - name: restraint_monitoring_grid_vs_raw_compliance_diverge
        grounds:
          - calculations.monitoring_compliance_pair
          - entities.RestraintEpisode.fields.grid_compliance_pct
          - entities.RestraintEpisode.fields.raw_compliance_pct
          - state_machines.RestraintEpisode.RELEASED_to_DEBRIEFED
          - validations[priority=28]
        distinguishing_aspect: |
          For one 30-minute MECHANICAL_RESTRAINT episode with monitoring entries clustered at
          +3 and +7 minutes, the interval_grid variant reports 50.0 while the raw_count variant
          reports 100.0, and only the interval_grid figure gates RELEASED -> DEBRIEFED, so the
          debrief is refused with ERR_MONITORING_INCOMPLETE despite a 100.0 raw score.
        test_recipe:
          setup:
            - "Unit with three STANDARD beds, all AVAILABLE, so posture is OPEN (licensed 3, restricted_threshold 1)."
            - "Adult MALE patient admitted INVOLUNTARY on a certified hold, safety search COMPLETED, PLACED in bed 401-A."
            - "Logical clock at 2026-09-03T08:00:00Z when the MECHANICAL_RESTRAINT order is written, so authorized_until_at is 08:30 and face_to_face_deadline_at is 09:00."
            - "Exactly two monitoring entries recorded, both inside the first 15-minute slot (08:03 and 08:07)."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Alma Reyes", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-1" }
              as: ComplianceOfficer
              captures: { c_psa: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Bo Fenn", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-2" }
              as: ComplianceOfficer
              captures: { c_psb: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Rosa Kim", staff_role: "CHARGE_NURSE", license_number: "LIC-RN-2367-1" }
              as: ComplianceOfficer
              captures: { c_rn: $.data.id }
            - call: "POST /behavioral-health/units"
              payload: { name: "Ward 4 North", gender_mixing_policy: "SEPARATE_BY_ROOM", seclusion_room_count: 1 }
              as: ComplianceOfficer
              captures: { u1: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u1}", room_number: "401", wing_code: "A", bed_label: "A", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { b1: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u1}", room_number: "402", wing_code: "A", bed_label: "A", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { b2: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u1}", room_number: "403", wing_code: "B", bed_label: "A", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { b3: $.data.id }
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-C", legal_name: "Patient C", age_years: 37, gender_care_category: "MALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_c: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_c}", danger_to_self: true, danger_to_others: false, grave_disability: false, capacity_present: false, clinical_summary: "Acute suicidal ideation." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_c: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_c}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
            - call: "POST /behavioral-health/holds"
              payload: { patient_id: "${p_c}", evaluation_id: "${e_c}", hold_type: "EMERGENCY_72H" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { h_c: $.data.id }
            - call: "POST /behavioral-health/holds/${h_c}/certify"
              payload: { certification_note: "Criteria met on independent review." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psb}"
            - call: "POST /behavioral-health/admissions"
              payload: { patient_id: "${p_c}", evaluation_id: "${e_c}", unit_id: "${u1}", requested_legal_status: "INVOLUNTARY" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { a_c: $.data.id }
            - call: "POST /behavioral-health/admissions/${a_c}/safety-search"
              payload: { search_type: "WANDED", search_witness_clinician_id: "${c_int}", search_items_secured_count: 2, contraband_found: false, outcome: "COMPLETED" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "GET /behavioral-health/units/${u1}"
              payload: {}
              as: ChargeNurse
              as_user_id: "${c_rn}"
              captures: { u1_v: $.data.version }
            - call: "POST /behavioral-health/admissions/${a_c}/place"
              payload: { unit_id: "${u1}", expected_unit_version: "${u1_v}", bed_id: "${b1}" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "POST /behavioral-health/restraints"
              payload: { admission_id: "${a_c}", intervention_type: "MECHANICAL_RESTRAINT", ordered_duration_minutes: 30, clinical_justification: "Imminent self-harm, least restrictive alternatives failed." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { ep_c: $.data.id }
            - call: "POST /behavioral-health/restraints/${ep_c}/face-to-face"
              payload: { assessment_note: "In-person review by second psychiatrist." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psb}"
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:03:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/restraints/${ep_c}/monitoring-checks"
              payload: { check_type: "CIRCULATION", note: "Distal pulses intact." }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:07:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/restraints/${ep_c}/monitoring-checks"
              payload: { check_type: "HYDRATION_OFFERED", note: "Water offered and declined." }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:30:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /behavioral-health/restraints/${ep_c}/release"
              payload: { release_note: "Patient calm, restraints removed." }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "POST /behavioral-health/restraints/${ep_c}/debrief"
              payload: { patient_participated_in_debrief: true, staff_participants_count: 3, debrief_note: "Reviewed precipitants." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { debrief_err: $.data.error_id }
          assert:
            - "RestraintEpisode.${ep_c}.actual_duration_minutes == 30"
            - "RestraintEpisode.${ep_c}.monitoring_interval_minutes == 15"
            - "RestraintEpisode.${ep_c}.required_check_count == 2"
            - "RestraintEpisode.${ep_c}.grid_satisfied_slot_count == 1"
            - "RestraintEpisode.${ep_c}.grid_compliance_pct == 50.0 (interval_grid variant)"
            - "RestraintEpisode.${ep_c}.raw_compliance_pct == 100.0 (raw_count variant)"
            - "the debrief response is HTTP 409 with ${debrief_err} == \"ERR_MONITORING_INCOMPLETE\""
            - "RestraintEpisode.${ep_c}.status == \"RELEASED\" and RestraintEpisode.${ep_c}.debrief_completed_at == null"
            - "Admission.${a_c}.observation_staff_quarter_hours == 2"

  - rule_id: combinatorial_formula
    instances:
      - name: bed_selector_cohort_filter_then_exact_fit_then_occupancy_rank
        grounds:
          - calculations.bed_placement_selector
          - entities.Bed.fields.bed_type
          - entities.Patient.fields.gender_care_category
          - validations[priority=44]
        distinguishing_aspect: |
          Mode (a) multi-factor selector: from five beds the eligibility filter drops the SECLUSION
          bed and the opposite-gender roommate bed, then ranking key 2 (exact bed-type fit) picks
          room 506 over the numerically lower room 505, and on the next placement ranking key 1
          (emptier room) picks room 505 over the numerically lower room 501 — each key demonstrably
          overrides the later room_number key.
        test_recipe:
          setup:
            - "Unit with gender_mixing_policy SEPARATE_BY_ROOM, four placement beds (501-A, 501-B, 505-A, 506-A) plus one SECLUSION bed 509-A; licensed_placement_bed_count is 4 and posture is OPEN."
            - "506-A is LIGATURE_RESISTANT_OBSERVATION; 501-A, 501-B and 505-A are STANDARD."
            - "Three adult patients, each with a signed evaluation scoring 8 (MODERATE, recommended VOLUNTARY) and a VOLUNTARY admission with safety_search_status COMPLETED."
            - "MALE patient 1 is already PLACED in 501-A, so 501-B has one MALE roommate."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Rosa Kim", staff_role: "CHARGE_NURSE", license_number: "LIC-RN-2367-1" }
              as: ComplianceOfficer
              captures: { c_rn: $.data.id }
            - call: "POST /behavioral-health/units"
              payload: { name: "Ward 5 South", gender_mixing_policy: "SEPARATE_BY_ROOM", seclusion_room_count: 1 }
              as: ComplianceOfficer
              captures: { u2: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u2}", room_number: "501", wing_code: "A", bed_label: "A", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { bA: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u2}", room_number: "501", wing_code: "A", bed_label: "B", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { bB: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u2}", room_number: "505", wing_code: "B", bed_label: "A", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { bD: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u2}", room_number: "506", wing_code: "B", bed_label: "A", bed_type: "LIGATURE_RESISTANT_OBSERVATION" }
              as: ComplianceOfficer
              captures: { bC: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u2}", room_number: "509", wing_code: "B", bed_label: "A", bed_type: "SECLUSION" }
              as: ComplianceOfficer
              captures: { bE: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-S1", legal_name: "Sel One", age_years: 45, gender_care_category: "MALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_s1: $.data.id }
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-S2", legal_name: "Sel Two", age_years: 29, gender_care_category: "FEMALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_s2: $.data.id }
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-S3", legal_name: "Sel Three", age_years: 52, gender_care_category: "MALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_s3: $.data.id }
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_s1}", danger_to_self: false, danger_to_others: true, grave_disability: true, capacity_present: true, clinical_summary: "Agitation with self-neglect, retains capacity." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_s1: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_s1}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
            - call: "POST /behavioral-health/admissions"
              payload: { patient_id: "${p_s1}", evaluation_id: "${e_s1}", unit_id: "${u2}", requested_legal_status: "VOLUNTARY" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { a_s1: $.data.id }
            - call: "POST /behavioral-health/admissions/${a_s1}/safety-search"
              payload: { search_type: "VISUAL", search_witness_clinician_id: "${c_int}", search_items_secured_count: 1, contraband_found: false, outcome: "COMPLETED" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "GET /behavioral-health/units/${u2}"
              payload: {}
              as: ChargeNurse
              as_user_id: "${c_rn}"
              captures: { u2_v1: $.data.version }
            - call: "POST /behavioral-health/admissions/${a_s1}/place"
              payload: { unit_id: "${u2}", expected_unit_version: "${u2_v1}", bed_id: "${bA}" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_s2}", danger_to_self: false, danger_to_others: true, grave_disability: true, capacity_present: true, clinical_summary: "Agitation with self-neglect, retains capacity." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_s2: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_s2}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
            - call: "POST /behavioral-health/admissions"
              payload: { patient_id: "${p_s2}", evaluation_id: "${e_s2}", unit_id: "${u2}", requested_legal_status: "VOLUNTARY" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { a_s2: $.data.id }
            - call: "POST /behavioral-health/admissions/${a_s2}/safety-search"
              payload: { search_type: "VISUAL", search_witness_clinician_id: "${c_int}", search_items_secured_count: 0, contraband_found: false, outcome: "COMPLETED" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_s3}", danger_to_self: false, danger_to_others: true, grave_disability: true, capacity_present: true, clinical_summary: "Agitation with self-neglect, retains capacity." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_s3: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_s3}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
            - call: "POST /behavioral-health/admissions"
              payload: { patient_id: "${p_s3}", evaluation_id: "${e_s3}", unit_id: "${u2}", requested_legal_status: "VOLUNTARY" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { a_s3: $.data.id }
            - call: "POST /behavioral-health/admissions/${a_s3}/safety-search"
              payload: { search_type: "VISUAL", search_witness_clinician_id: "${c_int}", search_items_secured_count: 0, contraband_found: false, outcome: "COMPLETED" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
          trigger:
            - call: "GET /behavioral-health/units/${u2}"
              payload: {}
              as: ChargeNurse
              as_user_id: "${c_rn}"
              captures: { u2_v2: $.data.version }
            - call: "POST /behavioral-health/admissions/${a_s2}/place"
              payload: { unit_id: "${u2}", expected_unit_version: "${u2_v2}" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "GET /behavioral-health/units/${u2}"
              payload: {}
              as: ChargeNurse
              as_user_id: "${c_rn}"
              captures: { u2_v3: $.data.version }
            - call: "POST /behavioral-health/admissions/${a_s3}/place"
              payload: { unit_id: "${u2}", expected_unit_version: "${u2_v3}" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
          assert:
            - "Admission.${a_s2}.bed_id == ${bC} (room 506, LIGATURE_RESISTANT_OBSERVATION — exact bed-type fit for MODERATE beats the lower room_number 505)"
            - "Admission.${a_s2}.bed_id != ${bB} (501-B eliminated by the SEPARATE_BY_ROOM cohort filter: its roommate is MALE, the patient is FEMALE)"
            - "Admission.${a_s2}.bed_id != ${bE} (SECLUSION beds are outside SELECTABLE_BED_TYPES)"
            - "Admission.${a_s3}.bed_id == ${bD} (room 505, zero roommates — occupancy key outranks the lower room_number 501)"
            - "Bed.${bB}.status == \"AVAILABLE\" after both placements"
            - "Unit.${u2}.occupied_bed_count == 3 and Unit.${u2}.raw_available_bed_count == 1"
            - "Unit.${u2}.licensed_placement_bed_count == 4 (the SECLUSION bed 509-A is excluded)"
            - "Unit.${u2}.posture == \"RESTRICTED\" and Unit.${u2}.effective_available_bed_count == 0"

      - name: observation_quarter_hours_per_episode_ceiling_before_sum
        grounds:
          - calculations.observation_staffing_quarter_hours
          - entities.Admission.fields.observation_staff_quarter_hours
