          - roles[ComplianceOfficer].exclusive_operations
          - roles[SystemOperator].exclusive_operations
        distinguishing_aspect: "A single chain drives one exclusive operation of each of the five roles to a 2xx: the clock (SystemOperator), the agreement and cadence (LiquidationConsultant), the approval and the sales-day review (RetailerController), the jurisdiction, licence decision, suspend and resume (ComplianceOfficer) and the sales-day filing (StoreManager, identified by its own store id)."
