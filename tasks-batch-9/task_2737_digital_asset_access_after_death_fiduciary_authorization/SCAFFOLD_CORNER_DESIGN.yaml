            - "${e_unsupported} == ERR_DISPOSITION_UNSUPPORTED with HTTP 409"
            - "${e_beneficiary_missing} == ERR_BENEFICIARY_REQUIRED with HTTP 400"
            - "${e_beneficiary_extra} == ERR_BENEFICIARY_REQUIRED with HTTP 400 (a designation supplied for DELETE is the same violation)"
            - "${el_del_status0} == PENDING_COUNTERSIGN and ${el_del_countersigner} is null"
            - "${e_countersign} == ERR_COUNTERSIGN_REQUIRED with HTTP 409"
            - "${a_vault_disp} == PENDING and DigitalAsset.${a_vault_id}.version == ${a_vault_v} + 1 (only the one accepted election bumped it)"
