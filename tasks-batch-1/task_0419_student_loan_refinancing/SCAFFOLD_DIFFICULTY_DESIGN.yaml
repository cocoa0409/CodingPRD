  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: forbearance_capitalization_conserves_total_obligation
        grounds:
          - calculations.capitalization
          - calculations.interest_accrual
          - state_machines.Loan.FORBEARANCE_to_CURRENT
          - entities.Loan.fields.principal_balance_cents
        distinguishing_aspect: |
          Conserved quantity: total_obligation = principal_balance_cents + accrued_interest_cents. Ending forbearance
          capitalizes accrued interest into principal — interest_capitalized_cents moves from the accrued bucket into
          principal, so total_obligation is unchanged across the FORBEARANCE->CURRENT transition (5,031,849 + 0 ==
          5,000,000 + 31,849).
        test_recipe:
          setup:
            - "A funded Loan principal 5,000,000, locked_apr_bps 775, last_accrual_at 2026-06-01; clock advanced 30 days; placed in FORBEARANCE; interest 31,849 accrued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /abs-pools"
              payload: { pool_code: "POOL-P9", max_principal_cents: 20000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b16@x.com", full_name: "B Sixteen", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b16_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b16_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b16_id}"
              captures: { app16_id: $.data.id, app16_ver: $.data.version }
            - call: "POST /applications/${app16_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b16_id}"
            - call: "GET /offers"
              payload: { application_id: "${app16_id}" }
              as: Borrower
              as_user_id: "${b16_id}"
              captures: { offer16_id: "$.data[0].id"}
            - call: "POST /offers/${offer16_id}/lock"
              payload: { expected_application_version: "${app16_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b16_id}"
            - call: "POST /applications/${app16_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-16"
            - call: "POST /applications/${app16_id}/fund"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-16"
              captures: { loan16_id: $.data.id }
            - call: "POST /loans/${loan16_id}/forbearance"
              payload: { reason_code: "JOB_LOSS", months_requested: 3 }
              as: ServicingAgent
              as_user_id: "sa-16"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /forbearance-plans"
              payload: { loan_id: "${loan16_id}", status: "ACTIVE" }
              as: ServicingAgent
              as_user_id: "sa-16"
              captures: { fp16_id: "$.data[0].id"}
          trigger:
            - call: "POST /forbearance-plans/${fp16_id}/end"
              payload: {}
              as: ServicingAgent
              as_user_id: "sa-16"
              captures: { cap: $.data.interest_capitalized_cents }
          assert:
            - "ForbearancePlan.${fp16_id}.interest_capitalized_cents == 31849"
            - "Loan.${loan16_id}.principal_balance_cents == 5031849 and accrued_interest_cents == 0"
            - "total_obligation conserved: 5031849 + 0 == 5000000 + 31849"

      - name: payment_waterfall_conserves_paid_vs_obligation_reduction
        grounds:
          - calculations.payment_waterfall
          - calculations.interest_accrual
          - state_machines.Loan.CURRENT_to_PAID_OFF
          - entities.Payment.fields.interest_portion_cents
        distinguishing_aspect: |
          Conserved quantity (different from total_obligation): payment_amount_consumed = interest_portion_cents +
          principal_portion_cents must equal the reduction applied to (accrued_interest + principal), so the payment
          split conserves cents — 31,849 interest + 28,151 principal == 60,000 paid, with no cent created or lost.
        test_recipe:
          setup:
            - "A funded Loan principal 5,000,000, locked_apr_bps 775, last_accrual_at 2026-06-01; clock advanced 30 days; interest 31,849 will accrue at payment time."
