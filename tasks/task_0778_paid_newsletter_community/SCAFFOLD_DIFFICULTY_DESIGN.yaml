            - call: "POST /publications/${pub_id}/events"
              payload: { title: "E", starts_at: "2026-04-01T10:00:00Z", ends_at: "2026-04-01T11:00:00Z", registration_closes_at: "2026-03-31T00:00:00Z", capacity: 3, min_tier_rank: 0, allow_waitlist: true }
              as: Creator
              as_user_id: "creator_1"
              captures: { ev_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_tier_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /events/${ev_id}/registrations"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "EventRegistration.${reg_id}.status == CANCELED"
            - "Event.${ev_id}.registered_count == 0"
            - "Event.${ev_id}.available_slots == 3"
