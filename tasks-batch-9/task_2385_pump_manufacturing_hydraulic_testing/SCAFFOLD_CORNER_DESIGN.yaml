            - call: "POST /repair-kits/${k1_id}/receipts"
              payload: { qty: 4 }
              as: ProductionPlanner
              captures: { k1_ver: $.data.version }
          assert:
            - "both calls return 200 and the response body is the RepairKit"
            - "RepairKit.${k1_id}.qty_on_hand == 10 and qty_received_total == 10"
            - "RepairKit.${k1_id}.qty_reserved == 0 and qty_issued == 0 and qty_consumed_total == 0"
            - "RepairKit.${k1_id}.version == 3 and ${k1_ver} == 3"
            - "RepairKit.${k1_id}.status is still ACTIVE"
      - name: clock_set_and_read_expose_the_logical_time_every_calculation_uses
        claim_type: standard_crud
        grounds:
          - endpoints["POST /_clock/set_current_utc"]
          - endpoints["GET /_clock"]
        distinguishing_aspect: |
          The logical clock is the only mutable platform state and it never falls back to wall time: an
          untouched deployment reads exactly 2026-08-01T00:00:00Z, a set is echoed back verbatim on the
          next read, and every role may read it because support windows and warranty months depend on it.
        test_recipe:
          setup:
            - "A fresh deployment with the clock never set."
          setup_api_calls:
            []
          trigger:
            - call: "GET /_clock"
