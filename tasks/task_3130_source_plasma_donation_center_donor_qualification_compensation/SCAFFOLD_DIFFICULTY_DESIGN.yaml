  # =====================================================================
  # Rule 4 — transitive_cascade: cascades from DIFFERENT triggers; at least
  # one of depth >= 3 and another of depth >= 2. Here: depth 4 (reactive
  # marker), depth 3 (severe reaction), depth 3 (look-back destroy).
  # =====================================================================
  - rule_id: transitive_cascade
    instances:

      - name: severe_reaction_deferral_noshow_cascade
        grounds:
          - state_machines.DonationVisit.IN_PROGRESS_to_ABORTED_REACTION
          - state_machines.Donor.APPLICANT_to_DEFERRED_TEMP
          - entities.AdverseReaction.fields.severity
        distinguishing_aspect: |
          Depth-3 chain triggered by POST adverse-reactions (SEVERE): (1) the visit
          aborts, which (2) auto-files a TEMPORARY DeferralRegistryEntry
          (ADVERSE_REACTION_SEVERE), whose creation (3) flips the donor to
          DEFERRED_TEMP, which itself (4) cascades the donor's OTHER SCHEDULED
          donation visit dv2 to NO_SHOW. Link (4) is caused by the donor status
          change, not by the original POST — fan-out would not order it this way.
        test_recipe:
