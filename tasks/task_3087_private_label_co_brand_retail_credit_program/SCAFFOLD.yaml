# =============================================================================
# PRD Benchmark Scaffold — task_3087_private_label_co_brand_retail_credit_program
# §1.0–§1.7. The §1.8/§1.9 difficulty and corner designs live in the sibling
# files SCAFFOLD_DIFFICULTY_DESIGN.yaml and SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================
scenario: |
  Private-Label and Co-Brand Retail Credit Program Economics (Synchrony Financial): retail partner program
  agreements specifying revenue share, promotional financing subsidy and term, in-store and digital application
  flows with instant decisioning and prescreened offers, deferred-interest promotional accounting with required
  disclosures and payoff behavior, partner-funded promotions charged back to the retailer with reconciliation,
  cardholder benefits and loyalty integration with the retailer's own program, program profitability monitoring
  and renewal negotiation with portfolio purchase rights, servicing and dispute handling branded as the retailer,
  program wind-down and portfolio transfer when a partnership ends

domain_name: private-label-retail-credit-program
api_prefix: /servicing

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation          # forward (projected) vs chronological (as-charged) settlement
  secondary_archetype: multi_party_negotiation      # retailer / bank / cardholder negotiation with veto + purchase rights
  complexity_layers:
    - dual_variant_calculation                      # projected vs as-charged; subsidy-at-application vs backfilled
    - cascading_side_effects                        # dispute -> program exposure -> portfolio rollup (depth 3+)
    - scheduled_and_deferred_actions                # promo expiry, payment-due dating, statement close epochs
    - selector_policy                               # pick the program by an explicit deterministic ranking
    - optimistic_concurrency                        # OCC on CreditProgram.version for negotiation-round writes
    - derived_field_reconciliation                  # denormalized program/portfolio rollups recomputed on every mutation
  entity_topology: flat                             # peers joined by FK links, plus the PartnerProgram negotiator join
  state_machine_shape: compound                     # Program close is derived from every program's terminal state
  relationship_patterns:
    - one_to_many
    - many_to_many                                  # PartnerProgram mediates CreditProgram <-> RetailPartner
    - self_referential                              # CreditProgram.supersedes_program_id chains renewals
    - cross_aggregate
  role_model: delegated_authority                   # CoBrandIssuer holds a delegated PortfolioPurchaseRight
  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  # ---------------------------------------------------------------------------
  - name: RetailPartner
    parent: null
    common_fields: true
    fields:
      - name: retailer_name
        type: string
        source: input
        description: "Legal trading name of the retail partner as printed on statements and card plastics."
      - name: partner_status
        type: enum
        source: input
        description: "Lifecycle status of the retailer's program participation."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | OFFBOARDING"
      - name: loyalty_program_code
        type: string
        source: input
        description: "The retailer's own loyalty scheme identifier (e.g. MYSTYLE_REWARDS) that cardholder benefit accrual posts into."
      - name: loyalty_link_enabled
        type: boolean
        source: input
        description: "Whether cardholder reward points earned on this program are allowed to post into the retailer's own loyalty balances."
        default: true
      - name: partner_portfolio_exposure_cents
        type: integer
        source: computed
        description: "Denormalized sum of free_look_exposure_cents across every CreditProgram whose partner_id points at this retailer. Recomputed on every mutation that changes a program's exposure."

  # ---------------------------------------------------------------------------
  - name: ProgramAgreement
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> RetailPartner.id; the retailer this agreement governs."
      - name: agreement_status
        type: enum
        source: input
        description: "Negotiation and enforcement lifecycle of the agreement."
        default: DRAFT
        constraints: "DRAFT | NEGOTIATION | ACTIVE | SUSPENDED | TERMINATED"
      - name: revenue_share_rate
        type: number
        source: input
        description: "Share of credit-card net revenue the retailer retains; 0.0–1.0."
      - name: promo_subsidy_rate
        type: number
        source: input
        description: "Share of deferred-interest promotional interest subsidy the retailer funds; 0.0–1.0."
      - name: promo_term_months
        type: integer
        source: input
        description: "Default promotional financing term in months (e.g. 6, 12, 18, 24)."
      - name: minimum_charge_cents
        type: integer
        source: input
        description: "Minimum purchase amount eligible for deferred-interest promotional financing."
        default: 29900
      - name: settlement_terms_days
        type: integer
        source: input
        description: "Net days the retailer has to pay a partner-funded promotion chargeback invoice."
        default: 30
      - name: dispute_grace_days
        type: integer
        source: input
        description: "Days a program agreement's program remains eligible for dispute filing after statement close; defaults to 0 when the agreement does not relax the regulatory period."
        default: 0
      - name: renewal_notice_days
        type: integer
        source: input
        description: "Minimum days before expiry at which a renewal notice must be issued."
        default: 90
      - name: purchase_right_rate
        type: number
        source: input
        description: "Price multiple over portfolio book value at which the retailer may exercise its portfolio purchase right on wind-down."
        default: 1.04

  # ---------------------------------------------------------------------------
  - name: CreditProgram
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> RetailPartner.id; the retailer whose card this program issues."
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ProgramAgreement.id; the governing economic agreement."
      - name: program_status
        type: enum
        source: input
        description: "Program lifecycle status."
        default: ACTIVE
        constraints: "ACTIVE | RENEWAL_NEGOTIATION | WINDING_DOWN | CLOSED"
      - name: supersedes_program_id
        type: string
        source: input
        description: "FK -> CreditProgram.id; the predecessor program this program's renewal chain replaces. Null for a first-generation program."
      - name: outstanding_receivable_cents
        type: integer
        source: computed
        description: "Denormalized sum of outstanding_balance_cents over every Account on this program whose account_status is not CHARGED_OFF."
      - name: free_look_exposure_cents
        type: integer
        source: computed
        description: "Denormalized sum of subsidy_at_risk_cents over every PromoPlan on this program whose plan_status is ACTIVE."
      - name: program_profitability_cents
        type: integer
        source: computed
        description: "Denormalized net program profit from the program_profitability calculation; recomputed on every settlement, payment and write-off."
      - name: cycle_day
        type: integer
        source: input
        description: "Statement close day-of-month; a value of 29, 30 or 31 clamps to the last real day of shorter months."
        constraints: "1–31"

  # ---------------------------------------------------------------------------
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> CreditProgram.id; the issuing program this account belongs to."
      - name: cardholder_ref
        type: string
        source: input
        description: "Opaque masked cardholder reference printed on correspondence."
      - name: account_status
        type: enum
        source: input
        description: "Servicing lifecycle of the account."
        default: ACTIVE
        constraints: "ACTIVE | DELINQUENT | CHARGED_OFF | PAID_OFF | TRANSFERRED"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Approved revolving credit line in cents."
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Denormalized sum of principal_balance_cents over every ScheduledBalance on this account while the account is not CHARGED_OFF."
      - name: linked_loyalty_balance
        type: integer
        source: computed
        description: "Denormalized running total of loyalty points posted from cardholder benefit accruals on this account."

  # ---------------------------------------------------------------------------
  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> CreditProgram.id; the program applied to."
      - name: source_channel
        type: enum
        source: input
        description: "Application capture channel."
        constraints: "IN_STORE | DIGITAL | PRESCREENED"
      - name: requested_credit_limit_cents
        type: integer
        source: input
        description: "Credit line requested by the applicant."
      - name: prescreen_reference
        type: string
        source: input
        description: "Prescreened-offer reference when the application originates from a prescreened solicitation; required for source_channel PRESCREENED."
      - name: application_status
        type: enum
        source: system
        description: "Instant-decisioning outcome."
        default: PENDING
        constraints: "PENDING | APPROVED | DECLINED"
      - name: decision_code
        type: string
        source: computed
        description: "Machine-readable decision reason code stamped at decision time."
      - name: approved_credit_limit_cents
        type: integer
        source: computed
        description: "Approved line once decisioned; null while PENDING."
      - name: instant_decision_at
        type: datetime
        source: system
        description: "Timestamp the instant-decision outcome was stamped."

  # ---------------------------------------------------------------------------
  - name: Transaction
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account the purchase posts to."
      - name: merchant_name
        type: string
        source: input
        description: "Merchant descriptor captured at authorisation."
      - name: amount_cents
        type: integer
        source: input
        description: "Purchase amount in cents."
      - name: transaction_channel
        type: enum
        source: input
        description: "Where the purchase was captured."
        constraints: "IN_STORE | DIGITAL"
      - name: transaction_status
        type: enum
        source: system
        description: "Posting lifecycle."
        default: POSTED
        constraints: "POSTED | DISPUTED"
      - name: promo_requested
        type: boolean
        source: input
        description: "Whether the cardholder elected deferred-interest promotional financing at point of sale."
        default: false
      - name: promo_term_months
        type: integer
        source: input
        description: "Requested promotional term in months; only meaningful when promo_requested is true."

  # ---------------------------------------------------------------------------
  - name: PromoPlan
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> CreditProgram.id; the program whose promotional subsidy is at risk."
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account holding the deferred-interest balance."
      - name: transaction_id
        type: string
        source: input
        description: "FK -> Transaction.id; the qualifying purchase that created the plan."
      - name: promo_term_months
        type: integer
        source: input
        description: "Deferred-interest term length in months; must be a member of TERM_RATE_TABLE."
      - name: promo_principal_cents
        type: integer
        source: input
        description: "Principal placed under the promotional balance."
      - name: qualifying_flag
        type: boolean
        source: input
        description: "Whether the purchase met the agreement minimum_charge_cents at qualification time."
      - name: subsidy_at_application_cents
        type: integer
        source: computed
        description: "Projected promotional interest subsidy struck at application time from the transaction-specific term rate; never revised after creation."
      - name: subsidy_at_risk_cents
        type: integer
        source: computed
        description: "Partner-funded exposure the retailer would absorb if the balance is not paid in full before promo_expires_at. Zero when promo_start_at has fallen on or after promo_expires_at."
      - name: net_subsidy_cents
        type: integer
        source: computed
        description: "As-charged subsidy asset for this plan, struck only at settlement; null while plan_status is not SETTLED."
      - name: promo_start_at
        type: datetime
        source: system
        description: "Logical-clock instant the plan qualified."
      - name: promo_expires_at
        type: datetime
        source: system
        description: "promo_start_at advanced by (promo_term_months * 30) days; deferred-interest expiry instant."
      - name: plan_status
        type: enum
        source: system
        description: "Promotional plan lifecycle; moves to SETTLED only at batch finalize."
        default: ACTIVE
        constraints: "ACTIVE | SETTLED | EXPIRED"

  # ---------------------------------------------------------------------------
  - name: SettlementBatch
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ProgramAgreement.id; the agreement whose promotions are being settled."
      - name: period_start
        type: datetime
        source: input
        description: "Statement-period start instant; inclusive."
      - name: period_end
        type: datetime
        source: input
        description: "Statement-period end instant; exclusive."
      - name: settlement_method
        type: enum
        source: input
        description: "Which of the two dual-variant subsidy algorithms governs subsidy_at_risk_cents."
        default: AS_CHARGED
        constraints: "FORWARD_LOOKING | AS_CHARGED"
      - name: reconciliation_method
        type: enum
        source: input
        description: "Which dual-variant algorithm governs gross_subsidy_cents / net_subsidy_cents / variance_cents / retailer_liability_cents."
        default: PROJECTED
        constraints: "PROJECTED | AS_CHARGED"
      - name: transaction_count
        type: integer
        source: computed
        description: "Count of qualifying purchases in the settlement input set at settle time."
      - name: gross_subsidy_cents
        type: integer
        source: computed
        description: "Forward-looking (projected) promotional subsidy across the input set."
      - name: net_subsidy_cents
        type: integer
        source: computed
        description: "Chronological (as-charged) promotional subsidy across the input set."
      - name: retailer_liability_cents
        type: integer
        source: computed
        description: "Partner-funded chargeback under the batch's reconciliation_method."
      - name: issuer_subsidy_cents
        type: integer
        source: computed
        description: "Program subsidy retained by the issuer under the batch's reconciliation_method."
      - name: variance_cents
        type: integer
        source: computed
        description: "gross_subsidy_cents - net_subsidy_cents (signed); the reconciliation rollup the program variance series is read from."
      - name: batch_status
        type: enum
        source: system
        description: "Settlement batch lifecycle."
        default: OPEN
        constraints: "OPEN | SETTLED"

  # ---------------------------------------------------------------------------
  - name: DisputeCase
    parent: null
    common_fields: true
    fields:
      - name: transaction_id
        type: string
        source: input
        description: "FK -> Transaction.id; the disputed purchase."
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account raising the dispute (account_status may be CHARGED_OFF)."
      - name: dispute_reason
        type: enum
        source: input
        description: "Cardholder-stated dispute reason."
        constraints: "FRAUD | GOODS_NOT_RECEIVED | UNAUTHORIZED | DUPLICATE_CHARGE | SERVICE_NOT_RENDERED"
      - name: case_status
        type: enum
        source: system
        description: "Dispute servicing lifecycle."
        default: OPEN
        constraints: "OPEN | UNDER_REVIEW | RESOLVED_FAVOR_CARDHOLDER | RESOLVED_FAVOR_MERCHANT | CLOSED"
      - name: resolution_outcome
        type: enum
        source: input
        description: "Resolution recorded at closure."
        constraints: "CARDHOLDER | MERCHANT"
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant the case left UNDER_REVIEW."
      - name: chargeback_amount_cents
        type: integer
        source: computed
        description: "Amount charged back to the merchant on a CARDHOLDER resolution; equals the disputed transaction amount_cents."
      - name: program_exposure_delta_cents
        type: integer
        source: computed
        description: "Signed change this case contributes to the program's free_look_exposure_cents on resolution."
      - name: servicing_brand_name
        type: string
        source: computed
        description: "The retailer's retailer_name — dispute handling is branded as the retailer, never as the issuer."

  # ---------------------------------------------------------------------------
  - name: BenefitPosting
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account earning or losing retailer loyalty points."
      - name: transaction_id
        type: string
        source: input
        description: "FK -> Transaction.id; the purchase that motivated the cardholder benefit accrual."
      - name: posting_reason
        type: enum
        source: input
        description: "Why the benefit posted."
        constraints: "PURCHASE_EARN | PROMO_BONUS | DISPUTE_CLAWBACK"
      - name: points_amount
        type: integer
        source: input
        description: "Signed points delta; DISPUTE_CLAWBACK postings carry a negative value."
      - name: posts_to_retailer_loyalty
        type: boolean
        source: input
        description: "Whether the retailer's own loyalty_program_code accepts this posting."
        default: true
      - name: loyalty_program_code
        type: string
        source: computed
        description: "The retailer's loyalty_program_code copied at posting time; null when posts_to_retailer_loyalty is false."
      - name: posted_status
        type: enum
        source: system
        description: "Posting lifecycle."
        default: POSTED
        constraints: "POSTED | REVERSED"
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant the posting was applied."

  # ---------------------------------------------------------------------------
  - name: ScheduledBalance
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account whose revolving principal this row carries."
      - name: principal_balance_cents
        type: integer
        source: input
        description: "Revolving principal component on this account at statement close; the source row that Account.outstanding_balance_cents sums."
      - name: balance_bucket
        type: enum
        source: input
        description: "Which bucket the principal sits in."
        constraints: "PRINCIPAL | PROMO_PRINCIPAL"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the statement slice was recorded."

  # ---------------------------------------------------------------------------
  - name: WindDownTransfer
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> CreditProgram.id; the program whose portfolio is being transferred."
      - name: buyer_role
        type: enum
        source: input
        description: "Party exercising the portfolio purchase right on a partnership end."
        constraints: "RETAILER | ISSUER"
      - name: transfer_status
        type: enum
        source: system
        description: "Wind-down transfer negotiation lifecycle."
        default: PROPOSED
        constraints: "PROPOSED | AGREEMENT_REACHED | COMPLETED | WITHDRAWN"
      - name: portfolio_book_value_cents
        type: integer
        source: computed
        description: "Denormalized program outstanding_receivable_cents at the instant the transfer was proposed."
      - name: purchase_right_rate
        type: number
        source: computed
        description: "The governing agreement's purchase_right_rate copied at proposal time."
      - name: purchase_price_cents
        type: integer
        source: computed
        description: "The accepted purchase price: proposed_price_cents when the proposer supplied one, else round_half_up(portfolio_book_value_cents * purchase_right_rate)."
      - name: accepted_by_role
        type: enum
        source: input
        description: "Party that accepted the transfer terms; null until AGREEMENT_REACHED."
        constraints: "RETAILER | ISSUER"
      - name: transfer_executed_at
        type: datetime
        source: system
        description: "Logical-clock instant the transfer completed."
# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  # --- RetailPartner: cyclic (SUSPENDED -> ACTIVE -> SUSPENDED) --------------
  - entity: RetailPartner
    initial_state: ACTIVE
    terminal_states: [OFFBOARDING]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /partners/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "RetailPartner.partner_status == ACTIVE"
        side_effects:
          - "No program status change fires here — cascading is driven by the agreement, not the partner."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /partners/{id}/reinstate"
        actor: ProgramAdmin
        preconditions: ["RetailPartner.partner_status == SUSPENDED"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: every program governed by this partner's agreements reaches WINDING_DOWN or CLOSED (bubble up)"
        actor: system
        preconditions:
          - "no CreditProgram with partner_id == this partner has program_status IN {ACTIVE, RENEWAL_NEGOTIATION}"
        side_effects:
          - "RetailPartner.partner_status := SUSPENDED"
        note: "Reachable only after all programs wind down; distinct from the explicit admin suspend above."
      - from: ACTIVE
        to: OFFBOARDING
        trigger: "POST /partners/{id}/offboard"
        actor: ProgramAdmin
        preconditions:
          - "RetailPartner.partner_status == ACTIVE"
          - "every CreditProgram with partner_id == this partner has program_status == CLOSED"
        side_effects:
          - "RetailPartner.partner_status := OFFBOARDING; terminal."

  # --- ProgramAgreement: cyclic (ACTIVE <-> SUSPENDED) ----------------------
  - entity: ProgramAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: NEGOTIATION
        trigger: "POST /agreements/{id}/open-negotiation"
        actor: ProgramAdmin
        preconditions:
          - "ProgramAgreement.agreement_status == DRAFT"
          - "revenue_share_rate + promo_subsidy_rate <= 1.0"
        side_effects: []
      - from: NEGOTIATION
        to: ACTIVE
        trigger: "POST /agreements/{id}/execute"
        actor: ProgramAdmin
        preconditions:
          - "ProgramAgreement.agreement_status == NEGOTIATION"
          - "expected_agreement_version matches ProgramAgreement.version"
        side_effects:
          - "increments ProgramAgreement.version by 1"
          - "any CreditProgram.supersedes_program_id == this agreement's active program is attached as a renewal"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: partner_portfolio_exposure rollup crosses the program suspension threshold"
        actor: system
        preconditions:
          - "sum of CreditProgram.free_look_exposure_cents over this agreement's programs >= 5000000000"
        side_effects:
          - "increments ProgramAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /agreements/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "ProgramAgreement.agreement_status == SUSPENDED"
          - "expected_agreement_version matches ProgramAgreement.version"
        side_effects:
          - "increments ProgramAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: exposure rollup falls back below the reinstatement threshold"
        actor: system
        preconditions: ["aggregate free_look_exposure_cents < 4000000000"]
        side_effects: ["increments ProgramAgreement.version by 1"]
      - from: ACTIVE
        to: NEGOTIATION
        trigger: "system event: the agreement's last active CreditProgram closes or the agreement is within renewal_notice_days of expiry (bubble up)"
        actor: system
        preconditions:
          - "no CreditProgram under this agreement has program_status IN {ACTIVE, RENEWAL_NEGOTIATION}"
        side_effects:
          - "ProgramAgreement.agreement_status := NEGOTIATION"
      - from: NEGOTIATION
        to: TERMINATED
        trigger: "POST /agreements/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "ProgramAgreement.agreement_status == NEGOTIATION"
          - "expected_agreement_version matches ProgramAgreement.version"
        side_effects:
          - "increments ProgramAgreement.version by 1; terminal."

  # --- CreditProgram: branching + self-referential renewal chain ------------
  - entity: CreditProgram
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: RENEWAL_NEGOTIATION
        trigger: "POST /credit-programs/{id}/open-renewal"
        actor: ProgramAdmin
        preconditions:
          - "CreditProgram.program_status == ACTIVE"
          - "expected_program_version matches CreditProgram.version"
        side_effects:
          - "increments CreditProgram.version by 1"
      - from: RENEWAL_NEGOTIATION
        to: WINDING_DOWN
        trigger: "POST /credit-programs/{id}/open-renewal"
        actor: ProgramAdmin
        side_effects:
          - "CASCADE (hop 1): each Account with program_id == this program, outstanding_balance_cents == 0 and account_status IN {ACTIVE, DELINQUENT} has account_status := PAID_OFF; accounts still carrying principal are left in place so they must be paid off or transferred before closure"
          - "increments CreditProgram.version by 1"
        note: "A renewal round that fails settlement rolls the program into wind-down — the renewal negotiation cycle is ACTIVE -> RENEWAL_NEGOTIATION -> {ACTIVE (renewed) | WINDING_DOWN (failed)}."
      - from: RENEWAL_NEGOTIATION
        to: ACTIVE
        trigger: "POST /credit-programs/{id}/complete-renewal"
        actor: ProgramAdmin
        preconditions:
          - "CreditProgram.program_status == RENEWAL_NEGOTIATION"
          - "expected_program_version matches CreditProgram.version"
        side_effects:
          - "the renewal round closes; the newly executed successor program (supersedes_program_id == this program) becomes the governing program"
          - "increments CreditProgram.version by 1"
        note: "Second arm of the renewal cycle; a program that completes renewal returns to ACTIVE while its predecessor chain is recorded via supersedes_program_id."
      - from: WINDING_DOWN
        to: CLOSED
        trigger: "POST /credit-programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "CreditProgram.program_status == WINDING_DOWN"
          - "every WindDownTransfer with program_id == this program has transfer_status == COMPLETED"
          - "expected_program_version matches CreditProgram.version"
        side_effects:
          - "CreditProgram.free_look_exposure_cents := 0"
          - "increments CreditProgram.version by 1; terminal."

  # --- Account: parallel dimensions (servicing x delinquency) ---------------
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CHARGED_OFF, PAID_OFF, TRANSFERRED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system event: the account's scheduled minimum payment stays unpaid past its statement due date"
        actor: system
        preconditions: ["Account.outstanding_balance_cents > 0"]
        side_effects: ["Account.account_status := DELINQUENT"]
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /accounts/{id}/post-payment (payment posts and satisfies the overdue minimum)"
        actor: Cardholder
        preconditions: ["payment_amount_cents >= the overdue minimum due"]
        side_effects: ["Account.account_status := ACTIVE"]
      - from: DELINQUENT
        to: CHARGED_OFF
        trigger: "POST /accounts/{id}/charge-off"
        actor: ProgramAdmin
        preconditions:
          - "Account.account_status == DELINQUENT"
          - "the account's payment_due_date is 180 or more logical days in the past"
        side_effects:
          - "hop 1: Account.account_status := CHARGED_OFF (chain origin)"
          - "hop 2 (caused by hop 1): each PromoPlan with account_id == this account has plan_status := EXPIRED and subsidy_at_risk_cents := 0"
          - "hop 3 (caused by hop 2): because the plans left the ACTIVE exposure set, CreditProgram.free_look_exposure_cents is recomputed; the account's ScheduledBalance rows stop summing into CreditProgram.outstanding_receivable_cents and program_profitability_cents is recomputed"
      - from: ACTIVE
        to: PAID_OFF
        trigger: "POST /accounts/{id}/post-payment (payment_amount_cents >= outstanding_balance_cents)"
        actor: Cardholder
        side_effects: ["Account.outstanding_balance_cents := 0"]
      - from: DELINQUENT
        to: PAID_OFF
        trigger: "POST /accounts/{id}/post-payment (payment_amount_cents >= outstanding_balance_cents)"
        actor: Cardholder
        side_effects: ["Account.outstanding_balance_cents := 0"]

  # --- Application: branching (APPROVED | DECLINED) -------------------------
  - entity: Application
    initial_state: PENDING
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /applications/{id}/decide"
        actor: Underwriter
        preconditions:
          - "Application.application_status == PENDING"
          - "requested_credit_limit_cents <= 1500000"
        side_effects:
          - "Application.approved_credit_limit_cents := requested_credit_limit_cents"
          - "a new Account is synthesized with account_status ACTIVE, program_id == Application.program_id, credit_limit_cents == approved_credit_limit_cents, outstanding_balance_cents 0"
          - "the new Account is discoverable only via GET /accounts?program_id=..."
      - from: PENDING
        to: DECLINED
        trigger: "POST /applications/{id}/decide"
        actor: Underwriter
        preconditions:
          - "Application.application_status == PENDING"
          - "requested_credit_limit_cents > 1500000"
        side_effects:
          - "Application.approved_credit_limit_cents := null"

  # --- Transaction: cyclic (POSTED <-> DISPUTED) ----------------------------
  - entity: Transaction
    initial_state: POSTED
    terminal_states: []
    transitions:
      - from: POSTED
        to: DISPUTED
        trigger: "POST /disputes (a DisputeCase is opened against this transaction)"
        actor: CardholderService
        preconditions:
          - "Transaction.transaction_status == POSTED"
          - "no DisputeCase with transaction_id == this transaction already exists in case_status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "hop 1: Transaction.transaction_status := DISPUTED (this mutation is the chain's origin; the DisputeCase itself does not touch downstream rows)"
          - "hop 2 (caused by hop 1): because the transaction is now DISPUTED, each PromoPlan with transaction_id == this transaction has subsidy_at_risk_cents := 0"
          - "hop 3 (caused by hop 2): because a PromoPlan.subsidy_at_risk_cents changed, the owning CreditProgram.free_look_exposure_cents is recomputed"
      - from: DISPUTED
        to: POSTED
        trigger: "POST /disputes/{id}/resolve (RESOLVED_FAVOR_MERCHANT)"
        actor: CardholderService
        side_effects:
          - "Transaction.transaction_status := POSTED"
          - "CASCADE (hop 1): the PromoPlan with transaction_id == this transaction has subsidy_at_risk_cents recomputed from its promo_principal_cents and agreement promo_subsidy_rate"
      - from: DISPUTED
        to: POSTED
        trigger: "POST /disputes/{id}/resolve (RESOLVED_FAVOR_CARDHOLDER)"
        actor: CardholderService
        side_effects:
          - "Transaction.transaction_status := POSTED (permanently chargeback-discharged; the PromoPlan carries subsidy_at_risk_cents 0 and is not recomputed)"

  # --- PromoPlan: cyclic (ACTIVE <-> EXPIRED) -------------------------------
  - entity: PromoPlan
    initial_state: ACTIVE
    terminal_states: [SETTLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: promo_start_at is on or after promo_expires_at at an epoch boundary"
        actor: system
        preconditions:
          - "PromoPlan.plan_status == ACTIVE"
          - "current logical clock >= PromoPlan.promo_expires_at"
        side_effects:
          - "PromoPlan.subsidy_at_risk_cents := 0"
          - "CreditProgram.free_look_exposure_cents recomputed"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /promo-plans/{id}/reopen (a cardholder's in-term payoff payment is reversed)"
        actor: CardholderService
        side_effects:
          - "PromoPlan.subsidy_at_risk_cents recomputed from promo_principal_cents and promo_subsidy_rate"
          - "CreditProgram.free_look_exposure_cents recomputed"
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /settlement-batches/{id}/finalize"
        actor: ProgramAdmin
        preconditions:
          - "no DisputeCase with transaction_id == this PromoPlan.transaction_id has case_status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "PromoPlan.net_subsidy_cents := the as-charged subsidy the chronological pass strikes for this plan"
          - "CreditProgram.free_look_exposure_cents recomputed (the settled plan drops out of the ACTIVE exposure set)"

  # --- SettlementBatch: linear ----------------------------------------------
  - entity: SettlementBatch
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /settlement-batches/{id}/finalize"
        actor: ProgramAdmin
        preconditions:
          - "SettlementBatch.batch_status == OPEN"
          - "no DisputeCase on any transaction in the input set is in {OPEN, UNDER_REVIEW}"
        side_effects:
          - "each qualifying PromoPlan moves ACTIVE -> SETTLED and stamps net_subsidy_cents"
          - "the batch's retailer_liability_cents is posted as a partner-funded chargeback invoice "
          - "CreditProgram.program_profitability_cents recomputed; ProgramAgreement.version incremented once for the settlement day"

  # --- DisputeCase: branching with revert -----------------------------------
  - entity: DisputeCase
    initial_state: OPEN
    terminal_states: [RESOLVED_FAVOR_CARDHOLDER, RESOLVED_FAVOR_MERCHANT, CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/review"
        actor: CardholderService
        preconditions: ["DisputeCase.case_status == OPEN"]
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED_FAVOR_CARDHOLDER
        trigger: "POST /disputes/{id}/resolve"
        actor: CardholderService
        preconditions:
          - "DisputeCase.case_status == UNDER_REVIEW"
          - "the disputed transaction posted no more than (60 + agreement dispute_grace_days) logical days before the current clock"
        side_effects:
          - "hop 1: chargeback_amount_cents := disputed Transaction.amount_cents and the case moves to RESOLVED_FAVOR_CARDHOLDER"
          - "hop 2 (caused by hop 1): a DISPUTE_CLAWBACK BenefitPosting is created for the transaction's PURCHASE_EARN posting (see the BenefitPosting machine, which owns the next hop)"
          - "hop 3 (caused by hop 2): applying that clawback decrements Account.linked_loyalty_balance by the original points_amount and marks the original posting REVERSED"
          - "the disputed Transaction.transaction_status := POSTED and its PromoPlan keeps subsidy_at_risk_cents 0"
      - from: UNDER_REVIEW
        to: RESOLVED_FAVOR_MERCHANT
        trigger: "POST /disputes/{id}/resolve"
        actor: CardholderService
        preconditions: ["DisputeCase.case_status == UNDER_REVIEW"]
        side_effects:
          - "CASCADE (hop 1): the disputed PromoPlan.subsidy_at_risk_cents recomputed; Transaction.transaction_status := POSTED"
          - "CASCADE (hop 2): CreditProgram.free_look_exposure_cents recomputed"
      - from: OPEN
        to: CLOSED
        trigger: "POST /disputes/{id}/withdraw"
        actor: CardholderService
        preconditions: ["DisputeCase.case_status == OPEN"]
        side_effects: ["the disputed Transaction.transaction_status := POSTED"]

  # --- BenefitPosting: linear -----------------------------------------------
  - entity: BenefitPosting
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /disputes/{id}/resolve (RESOLVED_FAVOR_CARDHOLDER) — a clawback posting is raised"
        actor: system
        preconditions: ["a BenefitPosting with posting_reason PURCHASE_EARN exists on the disputed transaction"]
        side_effects:
          - "a new BenefitPosting with posting_reason DISPUTE_CLAWBACK and points_amount == -1 * the original points_amount is created"
          - "Account.linked_loyalty_balance decremented by the original points_amount"
          - "the original BenefitPosting.posted_status := REVERSED"

  # --- WindDownTransfer: cyclic ---------------------------------------------
  - entity: WindDownTransfer
    initial_state: PROPOSED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: AGREEMENT_REACHED
        trigger: "POST /transfer-agreements/{id}/accept"
        actor: ProgramAdmin
        preconditions: ["WindDownTransfer.transfer_status == PROPOSED"]
        side_effects: []
      - from: AGREEMENT_REACHED
        to: COMPLETED
        trigger: "POST /transfer-agreements/{id}/execute"
        actor: ProgramAdmin
        preconditions:
          - "WindDownTransfer.transfer_status == AGREEMENT_REACHED"
          - "every Account with program_id == this program has account_status IN {PAID_OFF, TRANSFERRED}"
        side_effects:
          - "CASCADE (hop 1): each Account with program_id == this program has account_status := TRANSFERRED"
          - "CreditProgram.program_status := WINDING_DOWN (the transfer is the wind-down precondition; the program then closes)"
          - "increments CreditProgram.version by 1"
      - from: AGREEMENT_REACHED
        to: PROPOSED
        trigger: "POST /transfer-agreements/{id}/withdraw"
        actor: ProgramAdmin
        preconditions: ["WindDownTransfer.transfer_status == AGREEMENT_REACHED"]
        side_effects: ["WindDownTransfer.transfer_status := PROPOSED (the negotiation reopens against the same program)"]
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /transfer-agreements/{id}/withdraw"
        actor: ProgramAdmin
        preconditions: ["WindDownTransfer.transfer_status == PROPOSED"]
        side_effects: ["WindDownTransfer.transfer_status := WITHDRAWN; terminal."]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: renewal-round-stale-program
    parent_entity: CreditProgram
    write_endpoint: "POST /credit-programs/{id}/open-renewal"
    occ_field: "expected_program_version"
    description: |
      Opening a renewal round against a CreditProgram whose version has advanced
      since the client last observed it is rejected with a stale-version
      precondition failure. This is a genuine race: two renewal rounds are both
      legitimate under the product semantics, and the second sequential request
      would otherwise succeed because it observes no state field that the first
      request cleared — only the version distinguishes them.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-execute-stale-agreement
    parent_entity: ProgramAgreement
    write_endpoint: "POST /agreements/{id}/execute"
    occ_field: "expected_agreement_version"
    description: |
      Executing a negotiated ProgramAgreement against a version the client no
      longer holds is rejected. Two executions are both legitimate in principle
      (re-execution of amended terms), so the loser is detected only by the
      advanced version, not by any state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  # --- A: dual-variant (projected vs as-charged) on the subsidy asset -------
  - name: promo_subsidy_settlement
    trigger: "POST /settlement-batches/{id}/finalize — the settlement pass strikes the program's promotional subsidy asset"
    algorithm: dual_variant_reconciliation
    formula: |
      # Evaluation order is pinned: (1) resolve the day window, (2) select the
      # input set, (3) strike each plan's subsidy, (4) round each plan, (5) sum.
      # No step reads a value produced by a later step, so the result is total.
      #
      # PER-TRANSACTION ROUNDING ORDER (order matters — see Rule 2(b)):
      #   subsidy per plan is rounded to cents BEFORE the cross-plan sum.
      #   "sum-then-round" produces different cents whenever >= 2 plans carry
      #   half-cent remainders; the scaffold pins round-per-plan-then-sum.
      #
      # --- variant forward_looking (projected; struck at BATCH OPEN and held) ---
      #   for P sorted by (promo_start_at ASC, transaction_id ASC):
      #     projected_interest(P) = round_half_up(
      #         P.promo_principal_cents * TERM_RATE[P.promo_term_months]
      #         * P.promo_term_months / 12 )
      #   batch.gross_subsidy_cents = SUM over selected P of projected_interest(P)
      #
      # --- variant as_charged (chronological; accrued through period_end) ---
      #   for P in the same order:
      #     days_accrued = min( (SettlementBatch.period_end - P.promo_start_at) in days,
      #                         P.promo_term_months * 30 )
      #     accrued_interest(P) = round_half_up(
      #         P.promo_principal_cents * TERM_RATE[P.promo_term_months]
      #         * days_accrued / 365 )
      #   batch.net_subsidy_cents = SUM over selected P of accrued_interest(P)
      #   batch.variance_cents    = gross_subsidy_cents - net_subsidy_cents
    input_set: |
      PromoPlan rows whose promo_start_at falls in [SettlementBatch.period_start, SettlementBatch.period_end)
      and whose transaction_id resolves to a Transaction with transaction_status == POSTED.
      Plans whose transaction is DISPUTED at settle time are EXCLUDED from both variants.
      The forward_looking variant additionally requires plan_status == ACTIVE at evaluation time;
      the as_charged variant does not (it replays plans that may since have reached EXPIRED).
    constants:
      TERM_RATE: { 6: 0.1299, 12: 0.1599, 18: 0.1899, 24: 0.2199 }
      HALF_CENT: 0.5
      ROUNDING_ORDER: "per-plan round_half_up, then sum"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: forward_looking
        when: "Struck at batch creation (OPEN) to quote the projected partner-funded promo exposure."
        difference: "Projects the full-term subsidy at the requested term rate; ignores actual payoff timing, so it over-states exposure whenever a balance is paid in full inside the promo window."
      - name: as_charged
        when: "Struck only at batch finalize; the legally payable subsidy."
        difference: "Replays actual remaining principal and the as-charged day count, so a balance paid in full early drives net_subsidy_cents toward zero while gross_subsidy_cents is unchanged."

  # --- B: dual-variant on the partner chargeback ledger ---------------------
  - name: program_reconciliation
    trigger: "POST /settlement-batches/{id}/finalize — the partner-funded chargeback is reconciled against the retailer"
    algorithm: dual_variant_reconciliation
    formula: |
      # --- variant PROJECTED (the settlement-day accounting view) ---
      #   retailer_liability_cents = round_half_up(SUM over selected P of
      #       promo_principal_cents(P) * TERM_RATE[P.promo_term_months]
      #       * promo_term_months(P) / 12 * agreement.promo_subsidy_rate)
      #   issuer_subsidy_cents     = round_half_up(SUM over selected P of
      #       promo_principal_cents(P) * TERM_RATE[P.promo_term_months]
      #       * promo_term_months(P) / 12 * (1 - agreement.promo_subsidy_rate))
      #
      # --- variant AS_CHARGED (the accrued asset view) ---
      #   retailer_liability_cents = SUM over selected P of
      #       round_half_up( accrued_interest(P) * agreement.promo_subsidy_rate )
      #   issuer_subsidy_cents     = SUM over selected P of
      #       round_half_up( accrued_interest(P) * (1 - agreement.promo_subsidy_rate) )
      #   where accrued_interest(P) is the per-plan figure from
      #   promo_subsidy_settlement's as_charged pass — NOT the batch-cumulative
      #   net_subsidy_cents total.
      #
      # INVARIANT (violating it is a bug): retailer_liability_cents +
      # issuer_subsidy_cents == the variant's total promotional subsidy, to the cent.
    input_set: "The same PromoPlan input set as promo_subsidy_settlement for the same batch."
    constants:
      ROUNDING_ORDER: "per-plan round_half_up, then sum"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: projected
        when: "reconciliation_method == PROJECTED (the default written by most partner agreements)."
        difference: "Bills the retailer the full projected subsidy share; no credit for early payoffs inside the window."
      - name: as_charged
        when: "reconciliation_method == AS_CHARGED."
        difference: "Bills the retailer only its share of the subsidy actually struck at finalize; the two variants differ by round((gross - net) * promo_subsidy_rate)."

  # --- C: forward-looking single-strike, revised on dispute -----------------
  - name: promo_subsidy_at_risk
    trigger: "PromoPlan creation and every subsequent plan/transaction state change; recomputes the program's free_look_exposure_cents"
    algorithm: forward_looking
    formula: |
      # subsidy_at_risk_cents(P) =
      #   if P.promo_start_at >= P.promo_expires_at          -> 0   (boundary: expiry, not >)
      #   elif P.promo_principal_cents < agreement.minimum_charge_cents -> 0
      #   elif P.qualifying_flag == false                    -> 0
      #   else round_half_up( P.promo_principal_cents
      #                       * TERM_RATE[P.promo_term_months]
      #                       * P.promo_term_months / 12
      #                       * agreement.promo_subsidy_rate )
      #
      # subsidy_at_application_cents(P) is struck ONCE from the transaction-specific
      # term rate and is NEVER revised; subsidy_at_risk_cents is the live field that
      # moves on dispute, expiry, and cardholder-chargeoff.
    input_set: "Plans with plan_status == ACTIVE whose Transaction.transaction_status == POSTED."
    constants:
      TERM_RATE: { 6: 0.1299, 12: 0.1599, 18: 0.1899, 24: 0.2199 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: at_application
        when: "Plan creation — the quote the cardholder is shown."
        difference: "Struck once from the transaction term rate and frozen; a later term-rate change or dispute does not revise it."
      - name: at_risk_live
        when: "Every exposure recompute — the partner-funded number the retailer carries."
        difference: "Revises on dispute (to 0), on expiry (to 0 while promo_start_at >= promo_expires_at), and onward; diverges from subsidy_at_application_cents without any change to the underlying purchase."

  # --- D: aggregation with a zero-count boundary ----------------------------
  - name: account_minimum_payment
    trigger: "Daily scheduling; recomputed when a statement closes or an account's status changes"
    algorithm: aggregation
    formula: |
      # minimum_payment_due_cents(A) =
      #   if A.outstanding_balance_cents == 0                 -> 0   (zero-count boundary)
      #   elif A.account_status == DELINQUENT                 -> A.outstanding_balance_cents
      #   else max( 3500,
      #             round_half_up(0.02 * A.outstanding_balance_cents)
      #             + round_half_up(A.outstanding_balance_cents * 0.0) )   # interest is not part of the minimum twice
      #
      # The 2% is taken on the balance BEFORE any same-day payment is applied;
      # the floor of 3500 cents (the absolute minimum) is applied only when the
      # computed minimum is strictly less than it.
    input_set: "The single Account A named in the request, plus its non-CHARGED_OFF balances."
    constants:
      MINIMUM_PAYMENT_FLOOR_CENTS: 3500
      BALANCE_FRACTION: 0.02
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard
        when: "account_status IN {ACTIVE, DELINQUENT, PAID_OFF}."
        difference: "Applies the 2% floor rule; a zero balance yields exactly 0, never 3500."
      - name: chargeback_discharged
        when: "account_status == CHARGED_OFF."
        difference: "Returns 0 — a charged-off account carries no serviced minimum even though a residual balance may remain."

  # --- E: combinatorial formula (mode a) with a linked evaluation order ------
  - name: program_profitability
    trigger: "program settlement finalizes, an account is charged off or paid off, or a program is wound down"
    algorithm: constraint_propagation
    formula: |
      # program_profitability_cents(G) =
      #   round_half_up( SUM over settled batches B of this program
      #       ( (gross_subsidy_cents(B) - retailer_liability_cents(B))
      #         * (1 + revenue_share_rate * min( average_balance_cents(B) / 1000000, cap_multiple )) )
      #     - write_off_cents(G)
      #   ) - customer_acquisition_cost_cents(G)
      #
      # average_balance_cents(B) is defined AFTER the profitability pass for B
      # (pinned evaluation order: settle B, recompute balances, then score).
      # The min() cap is the circular-looking dependency: the revenue-share
      # multiplier is keyed on a balance figure that itself moves as batches
      # settle, so the scaffold fixes the order settle -> balance -> score.
    input_set: |
      Settled SettlementBatch rows of program G, ordered by (period_end ASC, id ASC) — but
      ordering does NOT change the sum; the CDC re-derivation below is order-independent.
    constants:
      ACQUISITION_COST_PER_ACCOUNT_CENTS: 4200
      BALANCE_CAP_MULTIPLE: 2.5
      BALANCE_UNIT_CENTS: 1000000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: full_recompute
        when: "Any trigger mutation."
        difference: "Sums all settled batches from scratch — the authoritative figure."
      - name: incremental
        when: "A single batch settles while the rest are unchanged."
        difference: "Adds the new batch's contribution to the prior total; must equal full_recompute exactly (no rounding drift), which is why each batch contribution is rounded before the outer sum."

  # --- F: tiered combination with a boundary ---------------------------------
  - name: account_delinquency_risk
    trigger: "Recomputed on every account status or balance change; read by GET /credit-programs/{id}/summary"
    algorithm: weighted_scoring
    formula: |
      # risk_score(A) =
      #   min(1000,
      #     ( if A.account_status == DELINQUENT then 400 else 0 )
      #   + ( if A.outstanding_balance_cents > A.credit_limit_cents then 300 else 0 )   # strict >, not >=
      #   + min(200, floor(A.outstanding_balance_cents / 500000) * 25)
      #   + min(100, days_since_last_payment(A) * 2) )
      #
      # At the exact boundary outstanding_balance_cents == credit_limit_cents the
      # over-limit term contributes 0 and the score is 200 lower than one cent above.
    input_set: "The single Account A; its program's accounts aggregate for the program-level rollup."
    constants:
      OVER_LIMIT_POINTS: 300
      UTILIZATION_UNIT_CENTS: 500000
      UTILIZATION_STEP_POINTS: 25
      UTILIZATION_CAP_POINTS: 200
      DAYS_PENALTY_PER_DAY: 2
      DAYS_CAP_POINTS: 100
      SCORE_CEILING: 1000
    precision: "integer, floor for utilization steps, round_half_up elsewhere"
    variants:
      - name: per_account
        when: "Scoring a single account."
        difference: "Ceiling 1000 applies to the individual score."
      - name: program_rollup
        when: "Scoring the program in GET /credit-programs/{id}/summary."
        difference: "Averages the per-account scores over accounts whose account_status != CHARGED_OFF and rounds half up; charged-off accounts are excluded from the denominator entirely."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present on every request."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The caller's role is permitted for the operation per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path-segment and body-referenced resource exists, validated left-to-right along the path."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "No OTHER DisputeCase in case_status IN {OPEN, UNDER_REVIEW} already exists on the same transaction."
    error_id: ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    applies_to: ["POST /disputes"]
  - priority: 5
    category: state
    check: "The target resource is in a state that admits the requested transition (its §1.2 from-state)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_temporal
    check: "Promotional term length is a member of the supported term set {6, 12, 18, 24}."
    error_id: ERR_INVALID_PROMO_TERM
    http_status: 422
    applies_to: ["POST /transactions"]
  - priority: 7
    category: business_safety
    check: "A deferred-interest promotional purchase meets the agreement's minimum_charge_cents."
    error_id: ERR_PROMO_MINIMUM_CHARGE
    http_status: 422
    applies_to: ["POST /transactions"]
  - priority: 8
    category: business_safety
    check: "Prescreened applications carry a prescreen_reference that resolves to a live offer."
    error_id: ERR_PRESCREEN_REQUIRED
    http_status: 422
    applies_to: ["POST /applications"]
  - priority: 9
    category: business_safety
    check: "The account's revolving credit limit is not exceeded by the new purchase plus its outstanding balance."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /transactions"]
  - priority: 10
    category: business_fiscal
    check: "Revenue share plus promotional subsidy share does not exceed 100% of net revenue."
    error_id: ERR_REVENUE_SHARE_INVALID
    http_status: 422
    applies_to: ["POST /agreements", "POST /agreements/{id}/execute"]
  - priority: 11
    category: business_referential
    check: "Any supersedes_program_id names a program that exists and whose program_status is not CLOSED."
    error_id: ERR_SUPERSEDES_INVALID
    http_status: 422
    applies_to: ["POST /credit-programs"]
  - priority: 12
    category: business_fiscal
    check: "The requested credit limit does not exceed the program's per-applicant ceiling (5,000,000 cents)."
    error_id: ERR_CREDIT_LIMIT_OUT_OF_BAND
    http_status: 422
    applies_to: ["POST /applications"]
  - priority: 13
    category: business_temporal
    check: "A dispute is filed no more than 60 logical days plus the agreement's dispute_grace_days after the disputed transaction posted."
    error_id: ERR_DISPUTE_PERIOD_EXPIRED
    http_status: 422
    applies_to: ["POST /disputes"]
  - priority: 14
    category: business_constraint
    check: "A promotional plan is settled only when no DisputeCase on its transaction is OPEN or UNDER_REVIEW."
    error_id: ERR_SETTLEMENT_DISPUTE_HOLD
    http_status: 422
    applies_to: ["POST /settlement-batches/{id}/finalize"]
  - priority: 15
    category: business_referential
    check: "An account is serviced only while its program's program_status is not CLOSED."
    error_id: ERR_PROGRAM_CLOSED
    http_status: 422
    applies_to: ["POST /transactions", "POST /applications", "POST /accounts/{id}/post-payment"]
  - priority: 16
    category: business_fiscal
    check: "A portfolio purchase price is at least the program's book value times the agreement purchase_right_rate."
    error_id: ERR_PURCHASE_PRICE_BELOW_FLOOR
    http_status: 422
    applies_to: ["POST /transfer-agreements"]
  - priority: 17
    category: business_referential
    check: "A loyalty benefit posting is accepted only when the partner's loyalty_link_enabled is true."
    error_id: ERR_LOYALTY_LINK_DISABLED
    http_status: 422
    applies_to: ["POST /benefit-postings"]
  - priority: 18
    category: business_constraint
    check: "Program closure requires every account on the program to be TRANSFERRED or PAID_OFF."
    error_id: ERR_ACCOUNT_NOT_SETTLED
    http_status: 422
    applies_to: ["POST /credit-programs/{id}/close"]
  - priority: 19
    category: business_temporal
    check: "A scheduled payment due date is not earlier than the current logical clock."
    error_id: ERR_PAYMENT_DUE_IN_PAST
    http_status: 422
    applies_to: ["POST /accounts/{id}/schedule-payment"]
  - priority: 20
    category: business_constraint
    check: "The current logical clock is at or after promo_expires_at before a plan may reach EXPIRED."
    error_id: ERR_PROMO_NOT_EXPIRED
    http_status: 422
    applies_to: ["POST /promo-plans/{id}/expire"]
  - priority: 21
    category: business_fiscal
    check: "A charge-off is permitted only in the delinquency window (payment due at least 180 logical days in the past)."
    error_id: ERR_CHARGEOFF_WINDOW_NOT_MET
    http_status: 422
    applies_to: ["POST /accounts/{id}/charge-off"]
  - priority: 22
    category: business_temporal
    check: "A clock advance carries a whole-day count in the inclusive range 1-3650."
    error_id: ERR_INVALID_ADVANCE_DAYS
    http_status: 422
    applies_to: ["POST /_clock/advance"]

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # --- clock (test-driving; default-time rule per §1.5) ---------------------
  - method: POST
    path: "/servicing/_clock/set_current_utc"
    description: "Sets the logical clock to the supplied ISO-8601 instant. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{}"
    side_effects: []
  - method: POST
    path: "/servicing/_clock/advance"
    description: "Advances the logical clock by a whole number of days (1–3650) and runs every scheduled effect that falls due in the advanced window — delinquency marks, promotional expiries, statement close and payment-due dating. The clock defaults to 2026-09-01T00:00:00Z before any set or advance."
    roles: [ProgramAdmin]
    code: 200
    input: [days]
    output: "{ current_utc: string, advanced_days: integer }"
    side_effects: ["fires due scheduled effects: Account ACTIVE -> DELINQUENT on missed due dates", "PromoPlan ACTIVE -> EXPIRED at promo_expires_at", "statement close and payment-due dating on the cycle day"]

  # --- RetailPartner --------------------------------------------------------
  - method: POST
    path: "/servicing/partners"
    description: "Onboards a retail partner."
    roles: [ProgramAdmin]
    code: 201
    input: [retailer_name, loyalty_program_code, "loyalty_link_enabled?"]
    output: RetailPartner
    side_effects: []
  - method: GET
    path: "/servicing/partners"
    description: "Lists retail partners."
    roles: [ProgramAdmin, CardholderService, Underwriter]
    code: 200
    input: ["limit?", "offset?"]
    output: RetailPartner[]
    side_effects: []
  - method: GET
    path: "/servicing/partners/{id}"
    description: "Reads one retail partner."
    roles: [ProgramAdmin, CardholderService, Underwriter, RetailPartnerAnalyst]
    code: 200
    input: []
    output: RetailPartner
    side_effects: []
  - method: POST
    path: "/servicing/partners/{id}/suspend"
    description: "Suspends a partner's participation."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: RetailPartner
    side_effects: ["RetailPartner.partner_status -> SUSPENDED"]
  - method: POST
    path: "/servicing/partners/{id}/reinstate"
    description: "Reinstates a suspended partner."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: RetailPartner
    side_effects: ["RetailPartner.partner_status -> ACTIVE"]
  - method: POST
    path: "/servicing/partners/{id}/offboard"
    description: "Offboards a partner whose programs have all closed."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: RetailPartner
    side_effects: ["RetailPartner.partner_status -> OFFBOARDING (terminal)"]
  - method: GET
    path: "/servicing/partners/{id}/credit-programs"
    description: "Lists every program issued for a partner."
    roles: [ProgramAdmin, Underwriter]
    code: 200
    input: []
    output: CreditProgram[]
    side_effects: []

  # --- ProgramAgreement -----------------------------------------------------
  - method: POST
    path: "/servicing/agreements"
    description: "Drafts a partner program agreement."
    roles: [ProgramAdmin]
    code: 201
    input: [partner_id, revenue_share_rate, promo_subsidy_rate, promo_term_months, "minimum_charge_cents?", "settlement_terms_days?", "dispute_grace_days?", "renewal_notice_days?", "purchase_right_rate?"]
    output: ProgramAgreement
    side_effects: []
  - method: GET
    path: "/servicing/agreements"
    description: "Lists agreements, optionally filtered by partner."
    roles: [ProgramAdmin, CardholderService, Underwriter]
    code: 200
    input: ["partner_id?", "limit?", "offset?"]
    output: ProgramAgreement[]
    side_effects: []
  - method: GET
    path: "/servicing/agreements/{id}"
    description: "Reads one agreement."
    roles: [ProgramAdmin, CardholderService, Underwriter, RetailPartnerAnalyst]
    code: 200
    input: []
    output: ProgramAgreement
    side_effects: []
  - method: POST
    path: "/servicing/agreements/{id}/open-negotiation"
    description: "Opens negotiation on a drafted agreement."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramAgreement
    side_effects: ["ProgramAgreement.agreement_status -> NEGOTIATION"]
  - method: POST
    path: "/servicing/agreements/{id}/execute"
    description: "Executes a negotiated agreement into force."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_agreement_version]
    output: ProgramAgreement
    side_effects: ["ProgramAgreement.agreement_status -> ACTIVE", "increments ProgramAgreement.version by 1"]
  - method: POST
    path: "/servicing/agreements/{id}/reinstate"
    description: "Reinstates a suspended agreement."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_agreement_version]
    output: ProgramAgreement
    side_effects: ["ProgramAgreement.agreement_status -> ACTIVE", "increments ProgramAgreement.version by 1"]
  - method: POST
    path: "/servicing/agreements/{id}/terminate"
    description: "Terminates a negotiated agreement."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_agreement_version]
    output: ProgramAgreement
    side_effects: ["ProgramAgreement.agreement_status -> TERMINATED (terminal)", "increments ProgramAgreement.version by 1"]

  # --- CreditProgram --------------------------------------------------------
  - method: POST
    path: "/servicing/credit-programs"
    description: "Issues a credit program under a partner and agreement."
    roles: [ProgramAdmin]
    code: 201
    input: [partner_id, agreement_id, "supersedes_program_id?", cycle_day]
    output: CreditProgram
    side_effects: []
  - method: GET
    path: "/servicing/credit-programs"
    description: "Lists credit programs with optional FK filters."
    roles: [ProgramAdmin, Underwriter, CardholderService]
    code: 200
    input: ["partner_id?", "agreement_id?", "supersedes_program_id?", "limit?", "offset?"]
    output: CreditProgram[]
    side_effects: []
  - method: GET
    path: "/servicing/credit-programs/{id}"
    description: "Reads one credit program."
    roles: [ProgramAdmin, Underwriter, CardholderService, RetailPartnerAnalyst, CoBrandIssuer]
    code: 200
    input: []
    output: CreditProgram
    side_effects: []
  - method: POST
    path: "/servicing/credit-programs/{id}/open-renewal"
    description: "Opens a renewal round (to_status RENEWAL_NEGOTIATION) or rolls a failed renewal into wind-down (to_status WINDING_DOWN)."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_program_version, to_status]
    output: CreditProgram
    side_effects: ["CreditProgram.program_status -> to_status", "on WINDING_DOWN: cascade accounts to PAID_OFF and recompute program_profitability_cents", "increments CreditProgram.version by 1"]
  - method: POST
    path: "/servicing/credit-programs/{id}/complete-renewal"
    description: "Closes a successful renewal round."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_program_version]
    output: CreditProgram
    side_effects: ["CreditProgram.program_status -> ACTIVE", "increments CreditProgram.version by 1"]
  - method: POST
    path: "/servicing/credit-programs/{id}/close"
    description: "Closes a wound-down program once its transfer has completed."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_program_version]
    output: CreditProgram
    side_effects: ["CreditProgram.program_status -> CLOSED (terminal)", "CreditProgram.free_look_exposure_cents := 0", "increments CreditProgram.version by 1"]
  - method: GET
    path: "/servicing/credit-programs/{id}/summary"
    description: "Computed program economics rollup."
    roles: [ProgramAdmin, Underwriter, RetailPartnerAnalyst]
    code: 200
    input: []
    output: "{ program_id: string, program_status: string, outstanding_receivable_cents: integer, free_look_exposure_cents: integer, program_profitability_cents: integer, program_risk_score: integer, account_count: integer, settled_batch_count: integer }"
    side_effects: []

  # --- Application ----------------------------------------------------------
  - method: POST
    path: "/servicing/applications"
    description: "Submits a credit application for instant decisioning."
    roles: [Applicant, ProgramAdmin]
    code: 201
    input: [program_id, source_channel, requested_credit_limit_cents, "prescreen_reference?"]
    output: Application
    side_effects: []
  - method: GET
    path: "/servicing/applications"
    description: "Lists applications with an optional program filter."
    roles: [ProgramAdmin, Underwriter]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/servicing/applications/{id}"
    description: "Reads one application."
    roles: [ProgramAdmin, Underwriter, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/servicing/applications/{id}/decide"
    description: "Instant decisioning; synthesizes an Account on approval."
    roles: [Underwriter]
    code: 200
    input: []
    output: Application
    side_effects: ["Application.application_status -> APPROVED or DECLINED", "on APPROVED a new Account is synthesized (discoverable via GET /accounts?program_id=...)"]

  # --- Transaction ----------------------------------------------------------
  - method: POST
    path: "/servicing/transactions"
    description: "Posts a purchase; electing promotional financing synthesizes a PromoPlan."
    roles: [Cardholder, ProgramAdmin]
    code: 201
    input: [account_id, merchant_name, amount_cents, transaction_channel, "promo_requested?", "promo_term_months?"]
    output: Transaction
    side_effects: ["when promo_requested is true, a PromoPlan is synthesized for the transaction (discoverable via GET /promo-plans?transaction_id=...)"]
  - method: GET
    path: "/servicing/transactions"
    description: "Lists transactions with an optional account filter."
    roles: [ProgramAdmin, CardholderService, Cardholder]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []
  - method: GET
    path: "/servicing/transactions/{id}"
    description: "Reads one transaction."
    roles: [ProgramAdmin, CardholderService, Cardholder]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  # --- Account --------------------------------------------------------------
  - method: GET
    path: "/servicing/accounts"
    description: "Lists accounts with an optional program filter."
    roles: [ProgramAdmin, CardholderService, Underwriter]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: GET
    path: "/servicing/accounts/{id}"
    description: "Reads one account."
    roles: [ProgramAdmin, CardholderService, Cardholder, Underwriter]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/servicing/accounts/{id}/post-payment"
    description: "Applies a cardholder payment; clears delinquency or pays the account off."
    roles: [Cardholder, ProgramAdmin]
    code: 200
    input: [payment_amount_cents]
    output: Account
    side_effects: ["principal_balance_cents rows on the account are reduced by payment_amount_cents (floored at 0)", "recomputes Account.outstanding_balance_cents and CreditProgram.program_profitability_cents"]
  - method: POST
    path: "/servicing/accounts/{id}/schedule-payment"
    description: "Schedules a statement payment due date."
    roles: [Cardholder, ProgramAdmin]
    code: 200
    input: [due_date]
    output: Account
    side_effects: []
  - method: POST
    path: "/servicing/accounts/{id}/charge-off"
    description: "Charges off a delinquent account past the window."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.account_status -> CHARGED_OFF", "cascade: each PromoPlan on the account -> EXPIRED with subsidy_at_risk_cents 0", "recomputes CreditProgram.program_profitability_cents"]
  - method: POST
    path: "/servicing/accounts/{id}/balances"
    description: "Records a statement-close principal-balance slice on an account."
    roles: [ProgramAdmin]
    code: 201
    input: [principal_balance_cents, balance_bucket]
    output: ScheduledBalance
    side_effects: ["recomputes Account.outstanding_balance_cents as the sum of its principal_balance_cents rows"]
  - method: GET
    path: "/servicing/accounts/{id}/balances"
    description: "Lists the principal-balance rows on an account."
    roles: [ProgramAdmin, CardholderService, Cardholder, Underwriter]
    code: 200
    input: []
    output: ScheduledBalance[]
    side_effects: []
  - method: GET
    path: "/servicing/balances"
    description: "Lists principal-balance rows with an optional account filter."
    roles: [ProgramAdmin, CardholderService, Underwriter]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: ScheduledBalance[]
    side_effects: []
  - method: GET
    path: "/servicing/accounts/{id}/loyalty"
    description: "Cardholder-facing loyalty view for one account."
    roles: [Cardholder, CardholderService, ProgramAdmin]
    code: 200
    input: []
    output: "{ linked_loyalty_balance: integer, posting_count: integer, last_posted_at: datetime }"
    side_effects: []

  # --- PromoPlan ------------------------------------------------------------
  - method: GET
    path: "/servicing/promo-plans"
    description: "Lists promotional plans with optional FK filters."
    roles: [ProgramAdmin, CardholderService, Underwriter]
    code: 200
    input: ["program_id?", "account_id?", "transaction_id?", "limit?", "offset?"]
    output: PromoPlan[]
    side_effects: []
  - method: GET
    path: "/servicing/promo-plans/{id}"
    description: "Reads one promotional plan."
    roles: [ProgramAdmin, CardholderService, Cardholder, Underwriter]
    code: 200
    input: []
    output: PromoPlan
    side_effects: []
  - method: POST
    path: "/servicing/promo-plans/{id}/expire"
    description: "Expires a plan at or past its expiry instant."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PromoPlan
    side_effects: ["PromoPlan.plan_status -> EXPIRED", "PromoPlan.subsidy_at_risk_cents := 0", "recomputes CreditProgram.free_look_exposure_cents"]
  - method: POST
    path: "/servicing/promo-plans/{id}/reopen"
    description: "Reopens an expired plan after a reversed payoff."
    roles: [CardholderService]
    code: 200
    input: []
    output: PromoPlan
    side_effects: ["PromoPlan.plan_status -> ACTIVE", "recomputes PromoPlan.subsidy_at_risk_cents and CreditProgram.free_look_exposure_cents"]

  # --- SettlementBatch ------------------------------------------------------
  - method: POST
    path: "/servicing/settlement-batches"
    description: "Opens a settlement batch; projects the forward-looking subsidy."
    roles: [ProgramAdmin]
    code: 201
    input: [agreement_id, period_start, period_end, "settlement_method?", "reconciliation_method?"]
    output: SettlementBatch
    side_effects: ["computes transaction_count, gross_subsidy_cents (forward_looking), variance_cents"]
  - method: GET
    path: "/servicing/settlement-batches"
    description: "Lists settlement batches with an optional agreement filter."
    roles: [ProgramAdmin, Underwriter, RetailPartnerAnalyst]
    code: 200
    input: ["agreement_id?", "limit?", "offset?"]
    output: SettlementBatch[]
    side_effects: []
  - method: GET
    path: "/servicing/settlement-batches/{id}"
    description: "Reads one settlement batch."
    roles: [ProgramAdmin, Underwriter, RetailPartnerAnalyst]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []
  - method: POST
    path: "/servicing/settlement-batches/{id}/finalize"
    description: "Finalizes a batch; strikes the as-charged subsidy and reconciles the chargeback."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["SettlementBatch.batch_status -> SETTLED", "each in-scope PromoPlan -> SETTLED with net_subsidy_cents stamped", "computes net_subsidy_cents, retailer_liability_cents, issuer_subsidy_cents", "recomputes CreditProgram.program_profitability_cents"]

  # --- DisputeCase ----------------------------------------------------------
  - method: POST
    path: "/servicing/disputes"
    description: "Opens a dispute against a transaction."
    roles: [CardholderService, Cardholder]
    code: 201
    input: [transaction_id, account_id, dispute_reason]
    output: DisputeCase
    side_effects: ["Transaction.transaction_status -> DISPUTED", "cascade: PromoPlan.subsidy_at_risk_cents -> 0", "recomputes CreditProgram.free_look_exposure_cents"]
  - method: GET
    path: "/servicing/disputes"
    description: "Lists dispute cases with optional FK filters."
    roles: [ProgramAdmin, CardholderService]
    code: 200
    input: ["account_id?", "transaction_id?", "limit?", "offset?"]
    output: DisputeCase[]
    side_effects: []
  - method: GET
    path: "/servicing/disputes/{id}"
    description: "Reads one dispute case."
    roles: [ProgramAdmin, CardholderService, Cardholder]
    code: 200
    input: []
    output: DisputeCase
    side_effects: []
  - method: POST
    path: "/servicing/disputes/{id}/review"
    description: "Moves an open dispute into review."
    roles: [CardholderService]
    code: 200
    input: []
    output: DisputeCase
    side_effects: ["DisputeCase.case_status -> UNDER_REVIEW"]
  - method: POST
    path: "/servicing/disputes/{id}/resolve"
    description: "Resolves a dispute for the cardholder or the merchant."
    roles: [CardholderService]
    code: 200
    input: [resolution_outcome]
    output: DisputeCase
    side_effects: ["DisputeCase.case_status -> RESOLVED_FAVOR_CARDHOLDER or RESOLVED_FAVOR_MERCHANT", "cascade transaction + promo plan exposure", "recomputes CreditProgram.free_look_exposure_cents"]
  - method: POST
    path: "/servicing/disputes/{id}/withdraw"
    description: "Withdraws an unresolved dispute."
    roles: [CardholderService]
    code: 200
    input: []
    output: DisputeCase
    side_effects: ["DisputeCase.case_status -> CLOSED", "Transaction.transaction_status -> POSTED"]

  # --- BenefitPosting -------------------------------------------------------
  - method: POST
    path: "/servicing/benefit-postings"
    description: "Posts a cardholder benefit accrual into the retailer's loyalty scheme."
    roles: [CardholderService, ProgramAdmin]
    code: 201
    input: [account_id, transaction_id, posting_reason, points_amount, "posts_to_retailer_loyalty?"]
    output: BenefitPosting
    side_effects: ["Account.linked_loyalty_balance incremented by points_amount when the posting is accepted"]
  - method: GET
    path: "/servicing/benefit-postings"
    description: "Lists benefit postings with optional FK filters."
    roles: [ProgramAdmin, CardholderService, Cardholder]
    code: 200
    input: ["account_id?", "transaction_id?", "limit?", "offset?"]
    output: BenefitPosting[]
    side_effects: []
  - method: GET
    path: "/servicing/benefit-postings/{id}"
    description: "Reads one benefit posting."
    roles: [ProgramAdmin, CardholderService, Cardholder]
    code: 200
    input: []
    output: BenefitPosting
    side_effects: []

  # --- WindDownTransfer -----------------------------------------------------
  - method: POST
    path: "/servicing/transfer-agreements"
    description: "Proposes a portfolio transfer on partnership wind-down."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, buyer_role, "proposed_price_cents?"]
    output: WindDownTransfer
    side_effects: ["copies portfolio_book_value_cents and purchase_right_rate; purchase_price_cents := proposed_price_cents when supplied, else round_half_up(portfolio_book_value_cents * purchase_right_rate)"]
  - method: GET
    path: "/servicing/transfer-agreements"
    description: "Lists transfer agreements with an optional program filter."
    roles: [ProgramAdmin, Underwriter, CoBrandIssuer]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: WindDownTransfer[]
    side_effects: []
  - method: GET
    path: "/servicing/transfer-agreements/{id}"
    description: "Reads one transfer agreement."
    roles: [ProgramAdmin, Underwriter, CoBrandIssuer]
    code: 200
    input: []
    output: WindDownTransfer
    side_effects: []
  - method: POST
    path: "/servicing/transfer-agreements/{id}/accept"
    description: "Accepts proposed transfer terms."
    roles: [ProgramAdmin, CoBrandIssuer]
    code: 200
    input: [accepted_by_role]
    output: WindDownTransfer
    side_effects: ["WindDownTransfer.transfer_status -> AGREEMENT_REACHED"]
  - method: POST
    path: "/servicing/transfer-agreements/{id}/execute"
    description: "Executes the accepted transfer."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: WindDownTransfer
    side_effects: ["WindDownTransfer.transfer_status -> COMPLETED", "cascade accounts to TRANSFERRED", "CreditProgram.program_status -> WINDING_DOWN"]
  - method: POST
    path: "/servicing/transfer-agreements/{id}/withdraw"
    description: "Withdraws a proposed or accepted transfer."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: WindDownTransfer
    side_effects: ["WindDownTransfer.transfer_status -> PROPOSED or WITHDRAWN"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not permitted for the operation."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path-segment or body-referenced resource does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, or a field is malformed for its declared type."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state that admits the requested transition."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version."
  - id: ERR_INVALID_PROMO_TERM
    http: 422
    condition: "promo_term_months is not a member of {6, 12, 18, 24}."
  - id: ERR_PROMO_MINIMUM_CHARGE
    http: 422
    condition: "The promotional purchase amount is below the agreement minimum_charge_cents."
  - id: ERR_PRESCREEN_REQUIRED
    http: 422
    condition: "A PRESCREENED-channel application omits or misstates prescreen_reference."
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "The purchase plus outstanding balance exceeds the account credit_limit_cents."
  - id: ERR_DISPUTE_ALREADY_OPEN
    http: 409
    condition: "An OPEN or UNDER_REVIEW dispute already exists on the transaction."
  - id: ERR_REVENUE_SHARE_INVALID
    http: 422
    condition: "revenue_share_rate + promo_subsidy_rate exceeds 1.0."
  - id: ERR_SUPERSEDES_INVALID
    http: 422
    condition: "supersedes_program_id names no program or a CLOSED program."
  - id: ERR_CREDIT_LIMIT_OUT_OF_BAND
    http: 422
    condition: "The requested credit limit exceeds the program per-applicant ceiling of 5,000,000 cents."
  - id: ERR_DISPUTE_PERIOD_EXPIRED
    http: 422
    condition: "The dispute was filed outside the statement cycle plus dispute_grace_days."
  - id: ERR_SETTLEMENT_DISPUTE_HOLD
    http: 422
    condition: "A batch cannot finalize while any in-scope transaction carries an OPEN or UNDER_REVIEW dispute."
  - id: ERR_PROGRAM_CLOSED
    http: 422
    condition: "The account's program is CLOSED."
  - id: ERR_PURCHASE_PRICE_BELOW_FLOOR
    http: 422
    condition: "The proposed purchase price is below book value times the agreement purchase_right_rate."
  - id: ERR_LOYALTY_LINK_DISABLED
    http: 422
    condition: "The partner has loyalty_link_enabled false; retailer loyalty postings are rejected."
  - id: ERR_ACCOUNT_NOT_SETTLED
    http: 422
    condition: "Program closure attempted while accounts are neither TRANSFERRED nor PAID_OFF."
  - id: ERR_PAYMENT_DUE_IN_PAST
    http: 422
    condition: "A scheduled payment due date precedes the current logical clock."
  - id: ERR_PROMO_NOT_EXPIRED
    http: 422
    condition: "A plan is expired or charged off before the logical clock reaches promo_expires_at."
  - id: ERR_CHARGEOFF_WINDOW_NOT_MET
    http: 422
    condition: "A charge-off is attempted before the account's payment due date is 180 logical days past."
  - id: ERR_INVALID_ADVANCE_DAYS
    http: 422
    condition: "A clock advance is requested with a day count outside 1–3650."

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "Issuer-side program operations administrator owning agreements, programs, settlements, charge-offs and transfers."
    identity: opaque
    exclusive_operations:
      - "POST /partners, POST /partners/{id}/suspend, POST /partners/{id}/reinstate, POST /partners/{id}/offboard"
      - "POST /agreements and every /agreements/{id}/* transition"
      - "POST /credit-programs and every /credit-programs/{id}/* transition"
      - "POST /settlement-batches, POST /settlement-batches/{id}/finalize"
      - "POST /accounts/{id}/charge-off, POST /accounts/{id}/schedule-payment"
      - "POST /transfer-agreements and every /transfer-agreements/{id}/* transition"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /credit-programs/{id}/summary"
      - "POST /benefit-postings, POST /transactions, POST /accounts/{id}/post-payment"
  - name: RetailPartnerAnalyst
    description: "Retail-partner-side analyst who reviews the partner's program economics read-only."
    identity: entity_backed:RetailPartner
    exclusive_operations: []
    shared_operations:
      - "GET /partners/{id}, GET /agreements/{id}, GET /credit-programs/{id}, GET /credit-programs/{id}/summary"
      - "GET /settlement-batches, GET /settlement-batches/{id}"
  - name: Underwriter
    description: "Credit underwriter performing instant decisioning and program risk review."
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/decide"
    shared_operations:
      - "GET /applications, GET /applications/{id}, GET /credit-programs/{id}/summary"
      - "GET /promo-plans, GET /promo-plans/{id}, GET /accounts"
  - name: CardholderService
    description: "Servicing agent handling disputes, promo reopens and loyalty postings branded as the retailer."
    identity: opaque
    exclusive_operations:
      - "POST /disputes/{id}/review, POST /disputes/{id}/resolve, POST /disputes/{id}/withdraw"
      - "POST /promo-plans/{id}/reopen"
    shared_operations:
      - "POST /disputes, POST /benefit-postings"
      - "GET /accounts/{id}/loyalty, GET /disputes, GET /transactions"
  - name: Cardholder
    description: "The cardholder acting on their own account."
    identity: entity_backed:Account
    exclusive_operations: []
    shared_operations:
      - "POST /accounts/{id}/post-payment (own account only)"
      - "GET /accounts/{id}, GET /accounts/{id}/loyalty (own account only)"
      - "POST /transactions (own account only), POST /disputes (own account only)"
  - name: Applicant
    description: "A credit applicant submitting an application for instant decisioning."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /applications, GET /applications/{id}"
  - name: CoBrandIssuer
    description: "Co-brand issuer partner holding a delegated portfolio purchase right on wind-down."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /credit-programs/{id}, GET /transfer-agreements, GET /transfer-agreements/{id}"
      - "POST /transfer-agreements/{id}/accept (as ISSUER buyer only)"
