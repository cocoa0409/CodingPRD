      - name: stale_player_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.baseline-create-supersedes-prior
          - errors.ERR_STALE_PLAYER_VERSION
        distinguishing_aspect: "Reusing the version that was valid before the first baseline test is refused: the second POST with the same expected_player_version returns ERR_STALE_PLAYER_VERSION (412), and only after re-reading the player does the identical payload succeed."
        test_recipe:
          setup: ["Harbor City with Dr Vance and K Mbeki freshly created at version 1"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_doc_h
            - *k_player
            - *k_baseline
          trigger:
            - call: "POST /concussion-program/baseline-tests"
              payload: { player_id: "${player_id}", season_year: 2026, composite_score: 84, reaction_time_ms: 540, symptom_score: 0, expected_player_version: "${player_v1}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - call: "GET /concussion-program/players/${player_id}"
              as: LeagueAdmin
              captures: { player_v_now: $.data.version }
            - call: "POST /concussion-program/baseline-tests"
              payload: { player_id: "${player_id}", season_year: 2026, composite_score: 84, reaction_time_ms: 540, symptom_score: 0, expected_player_version: "${player_v_now}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { baseline_retry_id: $.data.id }
          assert:
            - "trigger 1: response status 412 with error_id ERR_STALE_PLAYER_VERSION"
            - "trigger 1: BaselineTest.${baseline_id}.status is still VALID and GET /concussion-program/baseline-tests?player_id=${player_id} returns meta.total_count == 1"
            - "trigger 2: ${player_v_now} == ${player_v1} + 1 (the first successful test incremented the player)"
            - "trigger 3: response status 201, BaselineTest.${baseline_retry_id}.status == VALID, BaselineTest.${baseline_id}.status == SUPERSEDED"
            - "trigger 3: Player.${player_id}.version == ${player_v_now} + 1"

