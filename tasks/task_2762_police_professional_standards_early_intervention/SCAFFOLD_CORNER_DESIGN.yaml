      - name: officer_invalid_enum_rank_and_out_of_range_certification_are_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Officer.fields.rank
          - entities.Officer.fields.certification_level
          - entities.Complaint.fields.reported_allegation_types
          - validations[priority=4]
        distinguishing_aspect: |
          Three different constraint kinds live in §1.1: an enum domain (rank), a numeric
          range (certification_level 0..3) and a non-empty array (reported_allegation_types).
          All three are enforced by the same priority-4 schema rule and all three must return
          ERR_INVALID_REQUEST (400) rather than being coerced, clamped or stored as supplied.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit and one PATROL_DIVISION unit exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
