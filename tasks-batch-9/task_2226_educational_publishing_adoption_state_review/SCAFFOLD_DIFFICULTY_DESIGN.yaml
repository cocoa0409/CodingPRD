            - call: "POST /presentation-slots/${slot_id}/votes"
              payload: { vote: "RECOMMEND", rationale: "Pricing and platform commitments are acceptable." }
              as: ReviewCommitteeMember
              as_user_id: "cm-3"
          trigger:
            - call: "POST /presentation-slots/${slot_id}/tally"
              payload: {}
