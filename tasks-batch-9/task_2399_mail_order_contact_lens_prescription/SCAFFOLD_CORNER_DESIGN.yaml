  - section: errors
    instances:
      - name: request_with_missing_auth_headers_returns_401_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "Priority 1 fires before anything else, so a syntactically perfect product listing with no identity headers is 401 ERR_UNAUTHENTICATED rather than 403 or 200."
        test_recipe:
          setup:
            - One product exists so that a successful listing would otherwise return a row.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /products
              payload: { brand: "AcuityFlex", name: "Daily 30", wear_schedule: "DAILY_DISPOSABLE", lenses_per_box: 30, unit_price_cents: 3200, base_curve: 8.60, diameter: 14.20, sphere_min: -8.00, sphere_max: 4.00, sphere_step: 0.25, material_family: "silicone_hydrogel" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: GET /products
              payload: {}
              as: NONE_NO_HEADERS_SENT
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 401 and data.error_id is ERR_UNAUTHENTICATED."
            - "response_type is error and data.message is present, matching the declared error envelope."
            - "Sending the same request with X-Role PlatformAdmin and an empty X-User-ID is also 401 ERR_UNAUTHENTICATED."
            - "Sending it with X-Role Customer and X-User-ID any-customer-reader returns 200 with total_count 1."

