              payload: { buyer_id: "${buyer_id}", name: "Face Conservation Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200, min_days_early: 5, concentration_cap_pct: 100.00, funding_policy: "SELF_ONLY" }
