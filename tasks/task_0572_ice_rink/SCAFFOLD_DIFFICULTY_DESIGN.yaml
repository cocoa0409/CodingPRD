scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tuition_refund_calendar_vs_sessions_diverge
        grounds:
          - calculations.tuition_proration_refund
          - entities.TuitionSubscription.fields.proration_mode
          - state_machines.TuitionSubscription.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Two valid refund algorithms on the TuitionSubscription domain: CALENDAR
          prorates by days-remaining and yields 6000, SESSIONS prorates by unused
          sessions and yields 4500 for the identical fee/cycle, so the two produce
          different results.
        test_recipe:
          setup:
            - "One rink; a published LEARN_TO_SKATE slot with a class; two funded skaters each with an enrollment; skater A holds a CALENDAR subscription, skater B a SESSIONS subscription, both monthly_fee 12000, cycle 2026-06-01..2026-07-01, 8 total sessions / 5 attended; logical clock at 2026-06-16."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 1500, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 2000 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: RinkManager
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "LEARN_TO_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /learn-to-skate-classes"
              payload: { ice_slot_id: "${slot_id}", level_name: "BASIC_1", capacity: 5 }
              as: RinkManager
              captures: { class_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "Skater A", email: "a@x.com" }
              as: RinkManager
              captures: { sk_a: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "Skater B", email: "b@x.com" }
              as: RinkManager
              captures: { sk_b: $.data.id }
            - call: "POST /skaters/${sk_a}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
            - call: "POST /skaters/${sk_b}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
            - call: "POST /learn-to-skate-classes/${class_id}/enrollments"
              payload: { skater_id: "${sk_a}" }
              as: RinkManager
              captures: { enr_a: $.data.id, enr_a_v: $.data.version }
            - call: "POST /learn-to-skate-classes/${class_id}/enrollments"
              payload: { skater_id: "${sk_b}" }
              as: RinkManager
              captures: { enr_b: $.data.id, enr_b_v: $.data.version }
            - call: "POST /enrollments/${enr_a}/tuition-subscriptions"
              payload: { expected_enrollment_version: "${enr_a_v}", monthly_fee_cents: 12000, billing_cycle_start: "2026-06-01", billing_cycle_end: "2026-07-01", total_sessions_in_cycle: 8, sessions_attended: 5, proration_mode: "CALENDAR" }
              as: RinkManager
              captures: { sub_a: $.data.id }
            - call: "POST /enrollments/${enr_b}/tuition-subscriptions"
              payload: { expected_enrollment_version: "${enr_b_v}", monthly_fee_cents: 12000, billing_cycle_start: "2026-06-01", billing_cycle_end: "2026-07-01", total_sessions_in_cycle: 8, sessions_attended: 5, proration_mode: "SESSIONS" }
              as: RinkManager
              captures: { sub_b: $.data.id }
          trigger:
            - call: "POST /tuition-subscriptions/${sub_a}/cancel"
              payload: {}
              as: RinkManager
            - call: "POST /tuition-subscriptions/${sub_b}/cancel"
              payload: {}
              as: RinkManager
          assert:
            - "Skater.${sk_a}.wallet_credit_cents == 94000"
            - "Skater.${sk_b}.wallet_credit_cents == 92500"
            - "TuitionSubscription.${sub_a} refund (94000-88000) == 6000 differs from TuitionSubscription.${sub_b} refund (92500-88000) == 4500"

      - name: party_charge_provisional_vs_final_diverge
        grounds:
          - calculations.slot_booking_party_charge
          - entities.SlotBooking.fields.quoted_cents
          - entities.SlotBooking.fields.final_cents
          - state_machines.SlotBooking.BOOKED_to_COMPLETED
        distinguishing_aspect: |
          On the SlotBooking (PARTY) domain the provisional charge on 5 booked
          guests (10305) differs from the final charge on 3 actual guests (8183);
          two valid computations over the same rate card yield different totals.
        test_recipe:
          setup:
            - "One rink; a published PARTY slot 2026-06-12T10:00..12:00; a funded skater; clock at 2026-06-13 (after slot end so completion is allowed)."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T00:00:00Z" }
              as: RinkManager
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PARTY", start_utc: "2026-06-12T10:00:00Z", end_utc: "2026-06-12T12:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "Host", email: "h@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
            - call: "POST /ice-slots/${slot_id}/slot-bookings"
              payload: { skater_id: "${sk}", booking_type: "PARTY", base_fee_cents: 5000, per_guest_cents: 1010, guest_count_booked: 5, tax_rate: 0.05 }
              as: Skater
              as_user_id: "${sk}"
              captures: { bk: $.data.id }
          trigger:
            - call: "POST /slot-bookings/${bk}/complete"
              payload: { guest_count_final: 3 }
              as: RinkManager
          assert:
            - "SlotBooking.${bk}.quoted_cents == 10305"
            - "SlotBooking.${bk}.final_cents == 8183"
            - "SlotBooking.${bk}.captured_cents == 8183"
            - "Skater.${sk}.wallet_credit_cents == 91817"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rental_quote_tiered_peak_member_broomball
        grounds:
          - calculations.slot_booking_rental_quote
          - entities.SlotBooking.fields.quoted_cents
          - entities.Skater.fields.membership
          - entities.Rink.fields.peak_start_hour_utc
        distinguishing_aspect: |
          Mode (a): quote combines 5 inputs with non-linear interaction — peak/off-peak
          tiered rate selection (start hour vs peak_start_hour), fractional hours,
          member discount branch, broomball equipment branch, resurface branch — pinned
          evaluation order yields 36000 (30000 base - 3000 discount + 5000 + 4000).
        test_recipe:
          setup:
            - "One rink (peak_start_hour_utc 16); a published BROOMBALL slot 2026-06-10T18:00..19:30 (peak, 1.5h); a MEMBER skater funded 100000."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0, peak_start_hour_utc: 16 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "BROOMBALL", start_utc: "2026-06-10T18:00:00Z", end_utc: "2026-06-10T19:30:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "Member", email: "m@x.com", membership: "MEMBER" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
          trigger:
            - call: "POST /ice-slots/${slot_id}/slot-bookings"
              payload: { skater_id: "${sk}", booking_type: "BROOMBALL", includes_resurface: true }
              as: Skater
              as_user_id: "${sk}"
              captures: { bk: $.data.id }
          assert:
            - "SlotBooking.${bk}.quoted_cents == 36000"
            - "Skater.${sk}.wallet_credit_cents == 64000"

      - name: party_per_guest_rounding_order_pinned
        grounds:
          - calculations.slot_booking_party_charge
          - entities.SlotBooking.fields.quoted_cents
          - entities.SlotBooking.fields.tax_rate
        distinguishing_aspect: |
          Mode (b): tax rounded PER GUEST then summed (3 x round_half_up(1010*0.05)=3x51=153)
          gives quoted 8183, whereas sum-then-tax (round_half_up(3030*0.05)=152) would give
          8182; the scaffold pins per-guest rounding so the observable value is 8183.
        test_recipe:
          setup:
            - "One rink; a published PARTY slot; a funded skater; booking with base 5000, per_guest 1010, tax 0.05, 3 guests booked."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PARTY", start_utc: "2026-06-12T10:00:00Z", end_utc: "2026-06-12T12:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "Host", email: "h2@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
          trigger:
            - call: "POST /ice-slots/${slot_id}/slot-bookings"
              payload: { skater_id: "${sk}", booking_type: "PARTY", base_fee_cents: 5000, per_guest_cents: 1010, guest_count_booked: 3, tax_rate: 0.05 }
              as: Skater
              as_user_id: "${sk}"
              captures: { bk: $.data.id }
          assert:
            - "SlotBooking.${bk}.quoted_cents == 8183"
            - "Skater.${sk}.wallet_credit_cents == 91817"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ice_slot_draft_scheduled_cycle
        grounds:
          - state_machines.IceSlot.DRAFT_to_SCHEDULED
          - state_machines.IceSlot.SCHEDULED_to_DRAFT
          - entities.IceSlot.fields.status
        distinguishing_aspect: |
          IceSlot cycles DRAFT<->SCHEDULED via publish/unpublish (a non-linear cycle on
          the IceSlot entity); after publish, unpublish, publish the status is SCHEDULED
          and version has advanced from 1 to 4.
        test_recipe:
          setup:
            - "One rink; one PUBLIC_SKATE slot in DRAFT (version 1)."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /ice-slots/${slot_id}/unpublish"
              payload: {}
              as: RinkManager
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
          assert:
            - "IceSlot.${slot_id}.status == SCHEDULED"
            - "IceSlot.${slot_id}.version == 4"

      - name: tuition_active_pastdue_cycle
        grounds:
          - state_machines.TuitionSubscription.ACTIVE_to_PAST_DUE
          - state_machines.TuitionSubscription.PAST_DUE_to_ACTIVE
          - entities.TuitionSubscription.fields.status
        distinguishing_aspect: |
          TuitionSubscription cycles ACTIVE<->PAST_DUE via advance-cycle/pay (a non-linear
          cycle on a different entity than IceSlot); after create, advance-cycle, pay the
          status returns to ACTIVE and the wallet reflects two monthly charges (76000).
        test_recipe:
          setup:
            - "One rink; published LEARN_TO_SKATE slot + class; funded skater with an enrollment and an ACTIVE subscription (monthly 12000, cycle 2026-06-01..2026-07-01); clock at 2026-07-02 (past cycle end)."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: RinkManager
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "LEARN_TO_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /learn-to-skate-classes"
              payload: { ice_slot_id: "${slot_id}", level_name: "BASIC_1", capacity: 5 }
              as: RinkManager
              captures: { class_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "Skater", email: "c@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
            - call: "POST /learn-to-skate-classes/${class_id}/enrollments"
              payload: { skater_id: "${sk}" }
              as: RinkManager
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /enrollments/${enr}/tuition-subscriptions"
              payload: { expected_enrollment_version: "${enr_v}", monthly_fee_cents: 12000, billing_cycle_start: "2026-06-01", billing_cycle_end: "2026-07-01", total_sessions_in_cycle: 8 }
              as: RinkManager
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /tuition-subscriptions/${sub}/advance-cycle"
              payload: {}
              as: RinkManager
            - call: "POST /tuition-subscriptions/${sub}/pay"
              payload: {}
              as: Skater
              as_user_id: "${sk}"
          assert:
            - "TuitionSubscription.${sub}.status == ACTIVE"
            - "Skater.${sk}.wallet_credit_cents == 76000"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_slot_cancel_class_enrollment_subscription_refund
        grounds:
          - state_machines.IceSlot.SCHEDULED_to_CANCELLED
          - state_machines.LearnToSkateClass.OPEN_to_CANCELLED
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - state_machines.TuitionSubscription.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain from IceSlot cancel: slot->CANCELLED causes class->CANCELLED,
          which causes enrollment->WITHDRAWN, which causes subscription->CANCELLED with a
          6000 proration refund to the wallet (94000). Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "One rink; published LEARN_TO_SKATE slot + class; funded skater with an enrollment and an ACTIVE CALENDAR subscription (12000, cycle 2026-06-01..2026-07-01); clock at 2026-06-16."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: RinkManager
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "LEARN_TO_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /learn-to-skate-classes"
              payload: { ice_slot_id: "${slot_id}", level_name: "BASIC_1", capacity: 5 }
              as: RinkManager
              captures: { class_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "Skater", email: "d@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
            - call: "POST /learn-to-skate-classes/${class_id}/enrollments"
              payload: { skater_id: "${sk}" }
              as: RinkManager
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /enrollments/${enr}/tuition-subscriptions"
              payload: { expected_enrollment_version: "${enr_v}", monthly_fee_cents: 12000, billing_cycle_start: "2026-06-01", billing_cycle_end: "2026-07-01", total_sessions_in_cycle: 8, sessions_attended: 5, proration_mode: "CALENDAR" }
              as: RinkManager
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /ice-slots/${slot_id}/cancel"
              payload: {}
              as: RinkManager
          assert:
            - "IceSlot.${slot_id}.status == CANCELLED"
            - "LearnToSkateClass.${class_id}.status == CANCELLED"
            - "Enrollment.${enr}.status == WITHDRAWN"
            - "TuitionSubscription.${sub}.status == CANCELLED"
            - "Skater.${sk}.wallet_credit_cents == 94000"

      - name: cascade_league_cancel_registration_locker_release
        grounds:
          - state_machines.League.REGISTRATION_OPEN_to_CANCELLED
          - state_machines.LeagueRegistration.ACTIVE_to_CANCELLED
          - state_machines.LockerAssignment.ACTIVE_to_RELEASED
          - entities.Rink.fields.available_lockers
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (League cancel): league->CANCELLED causes
          registration->CANCELLED, which causes its LockerAssignment->RELEASED, restoring
          rink.available_lockers from 2 back to 3.
        test_recipe:
          setup:
            - "One rink (locker_count 3); a funded skater; a REGISTRATION_OPEN league; a registration that reserved locker 1 (available_lockers now 2)."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 2000 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "Skater", email: "e@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
            - call: "POST /leagues"
              payload: { name: "Beer League", sport: "HOCKEY", season_start: "2026-06-01", season_end: "2026-09-01", roster_capacity: 20 }
              as: RinkManager
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/registrations"
              payload: { skater_id: "${sk}", locker_number: 1, season_start_date: "2026-06-01", season_end_date: "2026-09-01" }
              as: Skater
              as_user_id: "${sk}"
              captures: { reg: $.data.id }
          trigger:
            - call: "POST /leagues/${lg}/cancel"
              payload: {}
              as: RinkManager
          assert:
            - "League.${lg}.status == CANCELLED"
            - "LeagueRegistration.${reg}.status == CANCELLED"
            - "GET /locker-assignments?league_registration_id=${reg} returns exactly one item with status == RELEASED"
            - "Rink.${rink_id}.available_lockers == 3"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: conflict_existence_beats_state_returns_not_found
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair (existence vs state): enrolling a non-existent skater_id into a
          CANCELLED class fails both the existence check (priority 3) and the state check
          (priority 4); the higher-priority existence error ERR_NOT_FOUND (404) wins.
        test_recipe:
          setup:
            - "One rink; a LEARN_TO_SKATE slot + class whose slot was cancelled so the class is CANCELLED; no skater registered for the fabricated id."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "LEARN_TO_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /learn-to-skate-classes"
              payload: { ice_slot_id: "${slot_id}", level_name: "BASIC_1", capacity: 5 }
              as: RinkManager
              captures: { class_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/cancel"
              payload: {}
              as: RinkManager
          trigger:
            - call: "POST /learn-to-skate-classes/${class_id}/enrollments"
              payload: { skater_id: "00000000-0000-4000-8000-000000000000" }
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: conflict_locker_overlap_beats_insufficient_funds
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_LOCKER_OCCUPIED]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Category pair (business_temporal vs business_fiscal): a locker request that both
          overlaps an existing ACTIVE assignment on the same locker (priority 6) and is made
          by a zero-balance skater who cannot pay the fee (priority 8) returns the
          higher-priority ERR_LOCKER_OCCUPIED (409), not ERR_INSUFFICIENT_FUNDS.
        test_recipe:
          setup:
            - "One rink (locker_fee 2000); skater A funded holds locker 1 for [2026-06-01,2026-09-01); skater B has wallet 0."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 2000 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "Skater A", email: "la@x.com" }
              as: RinkManager
              captures: { sk_a: $.data.id }
            - call: "POST /skaters/${sk_a}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
            - call: "POST /rinks/${rink_id}/locker-assignments"
              payload: { skater_id: "${sk_a}", locker_number: 1, season_start_date: "2026-06-01", season_end_date: "2026-09-01" }
              as: Skater
              as_user_id: "${sk_a}"
              captures: { la1: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "Skater B", email: "lb@x.com" }
              as: RinkManager
              captures: { sk_b: $.data.id }
          trigger:
            - call: "POST /rinks/${rink_id}/locker-assignments"
              payload: { skater_id: "${sk_b}", locker_number: 1, season_start_date: "2026-08-01", season_end_date: "2026-10-01" }
              as: Skater
              as_user_id: "${sk_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LOCKER_OCCUPIED"
            - "http status == 409"

  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: public_skate_capacity_strict_boundary
        grounds:
          - calculations.public_skate_available_capacity
          - validations[priority=7]
          - errors[ERR_CAPACITY_FULL]
        distinguishing_aspect: |
          Numeric threshold on the admission endpoint: with capacity 2, admissions succeed
          while admitted_count < 2 (0 and 1) and the third (admitted_count == 2) is rejected
          ERR_CAPACITY_FULL — strict '<' not '<='.
        test_recipe:
          setup:
            - "One rink (public_skate_capacity 2, fee 0); a published PUBLIC_SKATE slot; three skaters."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 5, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "S1", email: "s1@x.com" }
              as: RinkManager
              captures: { s1: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "S2", email: "s2@x.com" }
              as: RinkManager
              captures: { s2: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "S3", email: "s3@x.com" }
              as: RinkManager
              captures: { s3: $.data.id }
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${s1}" }
              as: FrontDesk
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${s2}" }
              as: FrontDesk
          trigger:
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${s3}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "IceSlot.${slot_id}.admitted_count == 2"
            - "response error_id == ERR_CAPACITY_FULL"
            - "http status == 409"

      - name: cancel_slot_with_empty_children_no_op
        grounds:
          - state_machines.IceSlot.SCHEDULED_to_CANCELLED
          - entities.Rink.fields.available_rental_skates
        distinguishing_aspect: |
          Empty-collection edge on the cancel endpoint: cancelling a SCHEDULED PUBLIC_SKATE
          slot with zero admissions succeeds (200) with an empty cascade — no refunds fire
          and rink.available_rental_skates stays equal to rental_skate_count (5).
        test_recipe:
          setup:
            - "One rink (rental_skate_count 5); a published PUBLIC_SKATE slot with zero admissions."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 1500, rental_skate_count: 5, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
          trigger:
            - call: "POST /ice-slots/${slot_id}/cancel"
              payload: {}
              as: RinkManager
          assert:
            - "IceSlot.${slot_id}.status == CANCELLED"
            - "Rink.${rink_id}.available_rental_skates == 5"

  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: admission_requires_scheduled_public_slot
        grounds:
          - state_machines.IceSlot.DRAFT_to_SCHEDULED
          - validations[priority=4]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair (PublicSkateAdmission -> IceSlot): admitting onto a DRAFT slot is
          rejected ERR_INVALID_STATE; after the same slot is published to SCHEDULED the
          identical admission succeeds (status ADMITTED).
        test_recipe:
          setup:
            - "One rink (fee 0); a PUBLIC_SKATE slot left in DRAFT; one skater."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 5, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "Skater", email: "adm@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
          trigger:
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${sk}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${sk}" }
              as: FrontDesk
              captures: { adm_ok: $.data.id }
          assert:
            - "first admission attempt error_id == ERR_INVALID_STATE (409)"
            - "PublicSkateAdmission.${adm_ok}.status == ADMITTED"

      - name: enrollment_requires_non_cancelled_class
        grounds:
          - state_machines.LearnToSkateClass.OPEN_to_CANCELLED
          - validations[priority=4]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair (Enrollment -> LearnToSkateClass): enrolling into a class whose slot
          was cancelled (class status CANCELLED) is rejected ERR_INVALID_STATE — a different
          entity pair than admission->IceSlot.
        test_recipe:
          setup:
            - "One rink; a LEARN_TO_SKATE slot + class; the slot cancelled so the class is CANCELLED; one skater."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "LEARN_TO_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /learn-to-skate-classes"
              payload: { ice_slot_id: "${slot_id}", level_name: "BASIC_1", capacity: 5 }
              as: RinkManager
              captures: { class_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/cancel"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "Skater", email: "enr@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
          trigger:
            - call: "POST /learn-to-skate-classes/${class_id}/enrollments"
              payload: { skater_id: "${sk}" }
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: ice_slot_resurface_buffer_overlap
        grounds:
          - state_machines.IceSlot.DRAFT_to_SCHEDULED
          - validations[priority=6]
          - errors[ERR_SLOT_OVERLAP]
          - entities.Rink.fields.resurface_buffer_minutes
        distinguishing_aspect: |
          Buffered-interval semantics on the Rink resource: a second slot starting 10 min
          after the first (< 15 min buffer) collides ERR_SLOT_OVERLAP, but a slot starting
          exactly 15 min after (gap == buffer) publishes successfully — adjacency at the
          buffer boundary is allowed.
        test_recipe:
          setup:
            - "One rink (resurface_buffer_minutes 15); slot A [08:00,09:00) published; slot B [09:10,10:10) and slot C [09:15,10:15) in DRAFT."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_a: $.data.id }
            - call: "POST /ice-slots/${slot_a}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T09:10:00Z", end_utc: "2026-06-10T10:10:00Z" }
              as: RinkManager
              captures: { slot_b: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T09:15:00Z", end_utc: "2026-06-10T10:15:00Z" }
              as: RinkManager
              captures: { slot_c: $.data.id }
          trigger:
            - call: "POST /ice-slots/${slot_b}/publish"
              payload: {}
              as: RinkManager
              captures: { err: $.data.error_id }
            - call: "POST /ice-slots/${slot_c}/publish"
              payload: {}
              as: RinkManager
          assert:
            - "slot_b publish error_id == ERR_SLOT_OVERLAP (409)"
            - "IceSlot.${slot_c}.status == SCHEDULED"

      - name: locker_season_half_open_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_LOCKER_OCCUPIED]
          - entities.LockerAssignment.fields.season_start_date
        distinguishing_aspect: |
          Half-open date-interval semantics (no buffer) on the Locker resource: a request
          overlapping [2026-06-01,2026-09-01) on locker 1 is rejected ERR_LOCKER_OCCUPIED,
          but an adjacent request starting exactly at the prior end (2026-09-01) succeeds —
          distinct interval arithmetic from the buffered ice-slot rule and on a different resource.
        test_recipe:
          setup:
            - "One rink (locker_fee 0); a funded skater holding locker 1 for [2026-06-01,2026-09-01)."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "Skater", email: "lk@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /rinks/${rink_id}/locker-assignments"
              payload: { skater_id: "${sk}", locker_number: 1, season_start_date: "2026-06-01", season_end_date: "2026-09-01" }
              as: Skater
              as_user_id: "${sk}"
              captures: { la1: $.data.id }
          trigger:
            - call: "POST /rinks/${rink_id}/locker-assignments"
              payload: { skater_id: "${sk}", locker_number: 1, season_start_date: "2026-08-01", season_end_date: "2026-10-01" }
              as: Skater
              as_user_id: "${sk}"
              captures: { err: $.data.error_id }
            - call: "POST /rinks/${rink_id}/locker-assignments"
              payload: { skater_id: "${sk}", locker_number: 1, season_start_date: "2026-09-01", season_end_date: "2026-11-01" }
              as: Skater
              as_user_id: "${sk}"
              captures: { la3: $.data.id }
          assert:
            - "overlapping request error_id == ERR_LOCKER_OCCUPIED (409)"
            - "LockerAssignment.${la3}.status == ACTIVE"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: money_conserved_across_admission_and_refund
        grounds:
          - state_machines.PublicSkateAdmission.ADMITTED_to_REFUNDED
          - entities.PublicSkateAdmission.fields.captured_cents
          - entities.Skater.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity = money cents: G_money = Skater.wallet_credit_cents +
          sum(PublicSkateAdmission.captured_cents where ADMITTED) stays 5000 across admit
          (wallet 3500 + captured 1500) and refund (wallet 5000 + captured 0).
        test_recipe:
          setup:
            - "One rink (public_skate_fee_cents 1500, rental_skate_count 1); a published PUBLIC_SKATE slot; a skater with wallet 5000."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 1500, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "Skater", email: "mc@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 5000 }
              as: RinkManager
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${sk}", rental_skate: true }
              as: FrontDesk
              captures: { adm: $.data.id }
          trigger:
            - call: "POST /admissions/${adm}/refund"
              payload: {}
              as: FrontDesk
          assert:
            - "PublicSkateAdmission.${adm}.status == REFUNDED"
            - "PublicSkateAdmission.${adm}.captured_cents == 0"
            - "PublicSkateAdmission.${adm}.refunded_cents == 1500"
            - "Skater.${sk}.wallet_credit_cents == 5000"
            - "invariant Skater.${sk}.wallet_credit_cents + PublicSkateAdmission.${adm}.captured_cents == 5000"

      - name: locker_units_conserved_across_assign_and_release
        grounds:
          - state_machines.LockerAssignment.ACTIVE_to_RELEASED
          - calculations.rink_available_lockers
          - entities.Rink.fields.available_lockers
        distinguishing_aspect: |
          Conserved quantity = physical locker slots: G_lockers = Rink.available_lockers +
          count(distinct locker_number ACTIVE) stays equal to locker_count 3 across assign
          (available 2 + 1 occupied) and release (available 3 + 0) — a different conserved
          quantity type than money.
        test_recipe:
          setup:
            - "One rink (locker_count 3, locker_fee 2000); a funded skater; one ACTIVE assignment on locker 1 (available_lockers 2)."
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 2000 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "Skater", email: "lu@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
            - call: "POST /rinks/${rink_id}/locker-assignments"
              payload: { skater_id: "${sk}", locker_number: 1, season_start_date: "2026-06-01", season_end_date: "2026-09-01" }
              as: Skater
              as_user_id: "${sk}"
              captures: { la: $.data.id }
          trigger:
            - call: "POST /locker-assignments/${la}/release"
              payload: {}
              as: Skater
              as_user_id: "${sk}"
          assert:
            - "LockerAssignment.${la}.status == RELEASED"
            - "Rink.${rink_id}.available_lockers == 3"
            - "invariant Rink.${rink_id}.available_lockers + count(ACTIVE distinct locker_number) == 3"
