      - name: closing_an_open_investigation_yields_err_investigation_state_invalid
        claim_type: every_code_triggerable
        grounds:
          - validations.priority_20
          - "errors[ERR_INVESTIGATION_STATE_INVALID]"
          - state_machines.LookbackInvestigation.OPEN_to_NOTIFIED
        distinguishing_aspect: |
          close requires NOTIFIED, not OPEN: closing a freshly opened investigation is 409
          ERR_INVESTIGATION_STATE_INVALID with closed_at still null, while notify from the same
          OPEN state succeeds — the two-step recall sequence cannot be short-circuited.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor in REFERRED and one OPEN operator-initiated lookback investigation on it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
