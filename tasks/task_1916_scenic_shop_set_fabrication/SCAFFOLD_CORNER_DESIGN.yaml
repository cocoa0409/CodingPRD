            - "ChangeOrder.${co_2}.delta_price_cents == 156000   # dd -7: min(3000, 3500)=3000bp — cap binds, same price"
            - "ChangeOrder.${co_1}.co_no == 1 and ChangeOrder.${co_2}.co_no == 2"

