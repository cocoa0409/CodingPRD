            - "${err_geometry} == ERR_INVALID_GEOMETRY_STATE"
            - "${err_grade} == ERR_INVALID_GRADE_STATE"
            - "${err_wheel} == ERR_INVALID_WHEEL_STATE (dressing is only legal from DRESSING)"
            - "${err_customer} == ERR_INVALID_CUSTOMER_STATE"
