# =============================================================================
# Section 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_1500_artist_management_commission_accounting
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and drives empty-DB state
# through declared §1.5 endpoints only. Shared fixture vocabulary:
#   clock default 2026-08-01T00:00:00Z; base agreement term 2026-01-01..2027-12-31;
#   rates TOURING 1500/750/12mo, RECORDING 2000/1000/24mo, PUBLISHING 2500/1250/24mo,
#   ENDORSEMENT 1000/500/6mo, all effective_from 2026-01-01 open-ended.
#   15% of 200000 = 30000 (net 170000); 25% of 200000 = 50000 (net 150000);
#   25% of 33333 = 8333.25 -> 8333 (round_half_up); 750bps of 200000 = 15000.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 - dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: statement_accrual_vs_cash_period_inclusion
        grounds:
          - calculations.statement_generation
          - entities.Statement.fields.basis
          - entities.IncomeEvent.fields.recognition_date
          - entities.IncomeEvent.fields.received_date
        distinguishing_aspect: |
          Statement-domain dual variant: ACCRUAL keys INCOME lines on
          recognition_date and admits VERIFIED events; CASH keys on received_date
          and admits only SETTLED events. Two artists with byte-identical data
          (one event recognized 2026-03-28, settled 2026-04-02) get divergent
          books: the ACCRUAL artist's Q1 statement nets 170000 while the CASH
          artist's Q1 statement nets 0 and the income surfaces in April instead.
        test_recipe:
          setup:
            - "Artist A_ACC and Artist A_CSH with identical ACTIVE agreements (TOURING 1500bps), identical agents/BMs"
            - "Each has one TOURING event gross 200000 recognized 2026-03-28, VERIFIED at the default clock 2026-08-01"
            - "A_ACC generates+issues ACCRUAL Q1 [2026-01-01..2026-03-31]; A_CSH generates+issues CASH Q1; then both events settle with received_date 2026-04-02; then both generate April [2026-04-01..2026-04-30] with their own basis"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Acc Act", legal_name: "Acc Act LLC", primary_genre: "pop", home_currency: "USD" }
              as: FirmAdmin
              captures: { aa_id: $.data.id, aa_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${aa_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${aa_v}" }
              as: FirmAdmin
              captures: { agr_a: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_a}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_a}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${aa_id}", member_role: "AGENT", display_name: "Agent A", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_a_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${aa_id}", member_role: "BUSINESS_MANAGER", display_name: "BM A", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_a_bm: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${aa_id}", income_type: "TOURING", gross_amount_cents: 200000, recognition_date: "2026-03-28", source_name: "Promoter X" }
              as: Agent
              as_user_id: "${tm_a_agent}"
              captures: { ev_a: $.data.id }
            - call: "POST /income-events/${ev_a}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_a_bm}"
            - call: "POST /statements/generate"
              payload: { artist_id: "${aa_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", basis: "ACCRUAL" }
              as: BusinessManager
              as_user_id: "${tm_a_bm}"
              captures: { st_acc_q1: $.data.id }
            - call: "POST /statements/${st_acc_q1}/issue"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_a_bm}"
            - call: "POST /artists"
              payload: { stage_name: "Cash Act", legal_name: "Cash Act LLC", primary_genre: "pop", home_currency: "USD" }
              as: FirmAdmin
              captures: { ac_id: $.data.id, ac_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${ac_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${ac_v}" }
              as: FirmAdmin
              captures: { agr_c: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_c}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_c}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${ac_id}", member_role: "AGENT", display_name: "Agent C", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_c_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${ac_id}", member_role: "BUSINESS_MANAGER", display_name: "BM C", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_c_bm: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${ac_id}", income_type: "TOURING", gross_amount_cents: 200000, recognition_date: "2026-03-28", source_name: "Promoter X" }
              as: Agent
              as_user_id: "${tm_c_agent}"
              captures: { ev_c: $.data.id }
            - call: "POST /income-events/${ev_c}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_c_bm}"
            - call: "POST /statements/generate"
              payload: { artist_id: "${ac_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", basis: "CASH" }
              as: BusinessManager
              as_user_id: "${tm_c_bm}"
              captures: { st_csh_q1: $.data.id }
            - call: "POST /statements/${st_csh_q1}/issue"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_c_bm}"
            - call: "POST /income-events/${ev_a}/settle"
              payload: { received_date: "2026-04-02", received_amount_cents: 200000 }
              as: BusinessManager
              as_user_id: "${tm_a_bm}"
            - call: "POST /income-events/${ev_c}/settle"
              payload: { received_date: "2026-04-02", received_amount_cents: 200000 }
              as: BusinessManager
              as_user_id: "${tm_c_bm}"
          trigger:
            - call: "POST /statements/generate"
              payload: { artist_id: "${aa_id}", period_start_date: "2026-04-01", period_end_date: "2026-04-30", basis: "ACCRUAL" }
              as: BusinessManager
              as_user_id: "${tm_a_bm}"
              captures: { st_acc_apr: $.data.id }
            - call: "POST /statements/generate"
              payload: { artist_id: "${ac_id}", period_start_date: "2026-04-01", period_end_date: "2026-04-30", basis: "CASH" }
              as: BusinessManager
              as_user_id: "${tm_c_bm}"
              captures: { st_csh_apr: $.data.id }
          assert:
            - "ACCRUAL artist Q1 statement ${st_acc_q1}: gross_total_cents == 200000, commission_total_cents == 30000, income_net_total_cents == 170000, net_payable_cents == 170000 (VERIFIED event included by recognition_date)"
            - "CASH artist Q1 statement ${st_csh_q1}: gross_total_cents == 0, net_payable_cents == 0 (the same event, still unsettled inside Q1, is excluded)"
            - "ACCRUAL artist April statement ${st_acc_apr}: income_net_total_cents == 0 (the event was already posted on Q1; statement_id is set)"
            - "CASH artist April statement ${st_csh_apr}: gross_total_cents == 200000, income_net_total_cents == 170000 (surfaced a month later under CASH)"
            - "Identical inputs, different bases: Q1 net_payable differs 170000 vs 0 and April net_payable differs 0 vs 170000"

      - name: touring_commission_gross_vs_net_of_expenses
        grounds:
          - calculations.commission_amount
          - entities.Agreement.fields.touring_commission_base
          - entities.Expense.fields.engagement_id
        distinguishing_aspect: |
          IncomeEvent-domain dual variant: the same TOURING event (gross 200000,
          1500 bps, engagement-linked approved expenses 30000) yields commission
          30000 under touring_commission_base=GROSS and 25500 under
          NET_OF_EXPENSES - two valid commission doctrines on identical gross.
        test_recipe:
          setup:
            - "Two artists A_GROSS and A_NET with identical ACTIVE agreements (TOURING 1500bps); A_NET's agreement sets touring_commission_base=NET_OF_EXPENSES"
            - "Each has a CONFIRMED engagement and a PRODUCTION expense 30000 linked to it, APPROVED (expense 30000 <= 100000 tier: single BUSINESS_MANAGER approval)"
            - "Each has an identical TOURING income event gross 200000 recognized 2026-03-10 linked to the engagement, in REPORTED"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Gross Act", legal_name: "Gross Act LLC", primary_genre: "rock" }
              as: FirmAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${ag_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${ag_v}", touring_commission_base: "GROSS" }
              as: FirmAdmin
              captures: { agr_g: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_g}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_g}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${ag_id}", member_role: "AGENT", display_name: "Agent G", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_g_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${ag_id}", member_role: "BUSINESS_MANAGER", display_name: "BM G", window_start_date: "2026-01-01", authority_expense_cap_cents: 1000000 }
              as: FirmAdmin
              captures: { tm_g_bm: $.data.id }
            - call: "POST /engagements"
              payload: { artist_id: "${ag_id}", income_type: "TOURING", counterparty_name: "Promoter G", start_datetime: "2026-09-10T18:00:00Z", end_datetime: "2026-09-10T23:00:00Z", guarantee_cents: 200000, travel_buffer_hours: 0 }
              as: Agent
              as_user_id: "${tm_g_agent}"
              captures: { eng_g: $.data.id }
            - call: "POST /engagements/${eng_g}/confirm"
              payload: {}
              as: Agent
              as_user_id: "${tm_g_agent}"
            - call: "POST /expenses"
              payload: { artist_id: "${ag_id}", category: "PRODUCTION", amount_cents: 30000, incurred_date: "2026-03-10", description: "Backline", engagement_id: "${eng_g}" }
              as: Agent
              as_user_id: "${tm_g_agent}"
              captures: { exp_g: $.data.id }
            - call: "GET /approval-requests"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_g_bm}"
              captures: { ap_g: "$.data[0].id" }
            - call: "POST /approval-requests/${ap_g}/approve"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_g_bm}"
            - call: "POST /income-events"
              payload: { artist_id: "${ag_id}", income_type: "TOURING", gross_amount_cents: 200000, recognition_date: "2026-03-10", source_name: "Promoter G", linked_engagement_id: "${eng_g}" }
              as: Agent
              as_user_id: "${tm_g_agent}"
              captures: { ev_g: $.data.id }
            - call: "POST /artists"
              payload: { stage_name: "Net Act", legal_name: "Net Act LLC", primary_genre: "rock" }
              as: FirmAdmin
              captures: { an_id: $.data.id, an_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${an_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${an_v}", touring_commission_base: "NET_OF_EXPENSES" }
              as: FirmAdmin
              captures: { agr_n: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_n}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_n}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${an_id}", member_role: "AGENT", display_name: "Agent N", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_n_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${an_id}", member_role: "BUSINESS_MANAGER", display_name: "BM N", window_start_date: "2026-01-01", authority_expense_cap_cents: 1000000 }
              as: FirmAdmin
              captures: { tm_n_bm: $.data.id }
            - call: "POST /engagements"
              payload: { artist_id: "${an_id}", income_type: "TOURING", counterparty_name: "Promoter N", start_datetime: "2026-09-10T18:00:00Z", end_datetime: "2026-09-10T23:00:00Z", guarantee_cents: 200000, travel_buffer_hours: 0 }
              as: Agent
              as_user_id: "${tm_n_agent}"
              captures: { eng_n: $.data.id }
            - call: "POST /engagements/${eng_n}/confirm"
              payload: {}
              as: Agent
              as_user_id: "${tm_n_agent}"
            - call: "POST /expenses"
              payload: { artist_id: "${an_id}", category: "PRODUCTION", amount_cents: 30000, incurred_date: "2026-03-10", description: "Backline", engagement_id: "${eng_n}" }
              as: Agent
              as_user_id: "${tm_n_agent}"
              captures: { exp_n: $.data.id }
            - call: "GET /approval-requests"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_n_bm}"
              captures: { ap_n: "$.data[0].id" }
            - call: "POST /approval-requests/${ap_n}/approve"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_n_bm}"
            - call: "POST /income-events"
              payload: { artist_id: "${an_id}", income_type: "TOURING", gross_amount_cents: 200000, recognition_date: "2026-03-10", source_name: "Promoter N", linked_engagement_id: "${eng_n}" }
              as: Agent
              as_user_id: "${tm_n_agent}"
              captures: { ev_n: $.data.id }
          trigger:
            - call: "POST /income-events/${ev_g}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_g_bm}"
            - call: "POST /income-events/${ev_n}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_n_bm}"
          assert:
            - "IncomeEvent.${ev_g}.commission_amount_cents == 30000 and artist_net_cents == 170000 (GROSS base)"
            - "IncomeEvent.${ev_n}.commission_amount_cents == 25500 and artist_net_cents == 174500 (NET_OF_EXPENSES base: 200000 - 30000 = 170000 base, x 1500bps = 25500)"
            - "Both events have identical gross_amount_cents and applied_rate_bps; the commissions differ by exactly 4500 (1500bps of the 30000 expense)"

      - name: advance_waterfall_fifo_vs_pro_rata
        grounds:
          - calculations.advance_recoupment_waterfall
          - entities.Agreement.fields.recoupment_policy
          - entities.Advance.fields.recouped_cents
        distinguishing_aspect: |
          Advance-domain dual variant: identical advances (A outstanding 50000 @100%,
          B outstanding 60000 @50%) and identical cash share 80000 recoup 65000 under
          FIFO (A: 50000, B: 15000) but 58182 under PRO_RATA (A: 36363, B: 21819).
        test_recipe:
          setup:
            - "Artist A_FIFO with FIFO agreement; Artist A_PRO with PRO_RATA agreement; both with TOURING 1500bps schedules"
            - "Each has Advance1 50000 @10000bps issued 2026-01-05 and Advance2 60000 @5000bps issued 2026-02-01 (both cross-collateralized: applies_to_income_types [])"
            - "Each has a VERIFIED TOURING event gross 94118 recognized 2026-03-10: commission = round_half_up(94118 * 1500/10000) = round_half_up(14117.7) = 14118, so cash share on full receipt = 94118 - 14118 = 80000 exactly"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Fifo Act", legal_name: "Fifo Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { af_id: $.data.id, af_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${af_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${af_v}", recoupment_policy: "FIFO" }
              as: FirmAdmin
              captures: { agr_f: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_f}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_f}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${af_id}", member_role: "AGENT", display_name: "Agent F", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_f_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${af_id}", member_role: "BUSINESS_MANAGER", display_name: "BM F", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_f_bm: $.data.id }
            - call: "POST /advances"
              payload: { artist_id: "${af_id}", principal_cents: 50000, issued_date: "2026-01-05", recoup_pct_bps: 10000 }
              as: BusinessManager
              as_user_id: "${tm_f_bm}"
              captures: { adv_f1: $.data.id }
            - call: "POST /advances"
              payload: { artist_id: "${af_id}", principal_cents: 60000, issued_date: "2026-02-01", recoup_pct_bps: 5000 }
              as: BusinessManager
              as_user_id: "${tm_f_bm}"
              captures: { adv_f2: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${af_id}", income_type: "TOURING", gross_amount_cents: 94118, recognition_date: "2026-03-10", source_name: "Promoter F" }
              as: Agent
              as_user_id: "${tm_f_agent}"
              captures: { ev_f: $.data.id }
            - call: "POST /income-events/${ev_f}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_f_bm}"
            - call: "POST /artists"
              payload: { stage_name: "Pro Act", legal_name: "Pro Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { ap_id: $.data.id, ap_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${ap_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${ap_v}", recoupment_policy: "PRO_RATA" }
              as: FirmAdmin
              captures: { agr_p: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_p}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_p}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${ap_id}", member_role: "AGENT", display_name: "Agent P", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_p_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${ap_id}", member_role: "BUSINESS_MANAGER", display_name: "BM P", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_p_bm: $.data.id }
            - call: "POST /advances"
              payload: { artist_id: "${ap_id}", principal_cents: 50000, issued_date: "2026-01-05", recoup_pct_bps: 10000 }
              as: BusinessManager
              as_user_id: "${tm_p_bm}"
              captures: { adv_p1: $.data.id }
            - call: "POST /advances"
              payload: { artist_id: "${ap_id}", principal_cents: 60000, issued_date: "2026-02-01", recoup_pct_bps: 5000 }
              as: BusinessManager
              as_user_id: "${tm_p_bm}"
              captures: { adv_p2: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${ap_id}", income_type: "TOURING", gross_amount_cents: 94118, recognition_date: "2026-03-10", source_name: "Promoter P" }
              as: Agent
              as_user_id: "${tm_p_agent}"
              captures: { ev_p: $.data.id }
            - call: "POST /income-events/${ev_p}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_p_bm}"
          trigger:
            - call: "POST /income-events/${ev_f}/settle"
              payload: { received_date: "2026-03-12", received_amount_cents: 94118 }
              as: BusinessManager
              as_user_id: "${tm_f_bm}"
            - call: "POST /income-events/${ev_p}/settle"
              payload: { received_date: "2026-03-12", received_amount_cents: 94118 }
              as: BusinessManager
              as_user_id: "${tm_p_bm}"
          assert:
            - "FIFO artist: Advance.${adv_f1}.recouped_cents == 50000 and status == RECOUPED; Advance.${adv_f2}.recouped_cents == 15000 (50% of remaining 30000); IncomeEvent.${ev_f}.recouped_amount_cents == 65000 and artist_payable_cents == 15000"
            - "PRO_RATA artist: Advance.${adv_p1}.recouped_cents == 36363 (share floor(80000*50000/110000)=36363 @100%); Advance.${adv_p2}.recouped_cents == 21819 (share 43637 @50% -> round_half_up(21818.5)=21819); IncomeEvent.${ev_p}.recouped_amount_cents == 58182 and artist_payable_cents == 21818"
            - "Identical gross/received/advances: FIFO recoups 65000 vs PRO_RATA 58182 (delta 6818)"

  # ---------------------------------------------------------------------------
  # Rule 2 - combinatorial_formula (instances in DIFFERENT modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_mode_a_min_scope_order
        grounds:
          - calculations.advance_recoupment_waterfall
          - entities.Advance.fields.applies_to_income_types
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: per-advance take is
          min(outstanding, round(remaining * pct)) gated by an income-type scope
          filter and an issued_date ordering; three advances with different
          pcts/scopes cap out at different points and two of them flip RECOUPED.
        test_recipe:
          setup:
            - "Artist with FIFO agreement (TOURING 1500bps); advances: A1 20000 @100% scope [] issued 2026-01-05; A2 10000 @50% scope [TOURING] issued 2026-01-10; A3 90000 @100% scope [] issued 2026-02-01"
            - "TOURING event gross 94118 recognized 2026-03-10 VERIFIED (commission 14118; cash share on full receipt 80000)"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Water Act", legal_name: "Water Act LLC", primary_genre: "pop" }
