  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: conduct_resolve_linkage_and_double_resolve_guards
        claim_type: violation_to_error
        grounds: ["errors[ERR_CASE_LINKAGE_INVALID]", "errors[ERR_CASE_ALREADY_RESOLVED]"]
        distinguishing_aspect: "resolve UPHELD with sanction BAN_GUEST but no linked_order_id fails with ERR_CASE_LINKAGE_INVALID; resolving an already-resolved case fails with ERR_CASE_ALREADY_RESOLVED."
        test_recipe:
          setup: ["Season PLANNING; case A REPORTED without links; case B REPORTED then DISMISSED"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Conduct Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /conduct-cases", payload: { season_id: "${s_id}", category: "COSTUME_POLICY", subject_description: "Modern sneakers in the lanes" }, as: GateAgent, captures: { ca: $.data.id } }
            - { call: "POST /conduct-cases", payload: { season_id: "${s_id}", category: "BEHAVIOR", subject_description: "Heckling the juggler" }, as: GateAgent, captures: { cb: $.data.id } }
            - { call: "POST /conduct-cases/${cb}/resolve", payload: { outcome: "DISMISSED", sanction: "NONE" }, as: FaireOperator }
          trigger:
            - { call: "POST /conduct-cases/${ca}/resolve", payload: { outcome: "UPHELD", sanction: "BAN_GUEST" }, as: FaireOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /conduct-cases/${ca}/resolve", payload: { outcome: "UPHELD", sanction: "NONE" }, as: FaireOperator, captures: { ca_st: $.data.status } }
            - { call: "POST /conduct-cases/${cb}/resolve", payload: { outcome: "UPHELD", sanction: "NONE" }, as: FaireOperator, captures: { err2: $.data.error_id } }
          assert:
            - "BAN_GUEST without linked_order_id: ERR_CASE_LINKAGE_INVALID (409)"
            - "Retry with sanction NONE succeeds (UPHELD)"
            - "Resolving DISMISSED case: ERR_CASE_ALREADY_RESOLVED (409)"

      - name: permit_duplicate_and_revoke_guards
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_PERMIT]", "errors[ERR_PERMIT_NOT_REVOKABLE]"]
        distinguishing_aspect: "A second permit application on the same application fails (ERR_DUPLICATE_PERMIT); revoking a permit that is merely APPLIED fails (ERR_PERMIT_NOT_REVOKABLE)."
        test_recipe:
          setup: ["Season PLANNING; FOOD vendor JURIED_IN; permit APPLIED"]
          setup_api_calls:
