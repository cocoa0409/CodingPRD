      - name: election_approval_blocked_by_uncertified_egwp_subsidy
        grounds:
          - validations[priority=28]
          - errors.ERR_SUBSIDY_NOT_CERTIFIED
          - state_machines.PlanOption.ATTESTED_to_CERTIFIED
          - state_machines.ElectionEvent.UNDER_REVIEW_to_APPROVED
          - calculations.msp_payer_order_determination
        distinguishing_aspect: |
          A second, structurally different cross-entity dependency: here the
          blocking state is the second, orthogonal status dimension of the
          PlanOption - subsidy_certification_status - while the dimension the
          endpoint naturally consults, PlanOption.status, is already ACTIVE.
          The option has been attested but not yet certified by compliance, so
          the election cannot be approved. Because the unblocking action is
          performed by a different role on a different entity (ComplianceOfficer
          on the PlanOption, not EnrollmentCounselor on the ElectionEvent), an
          implementation that conflates the two PlanOption dimensions passes
          the first attempt and fails this test. The successful retry also pins
          the derived Enrollment fields: working-aged MSP order and a
