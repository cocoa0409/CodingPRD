        grounds:
          - validations[priority=10]
          - entities.EquipmentReservation.fields.window_start_minute
          - entities.EquipmentAsset.fields.accumulated_usage_minutes
        distinguishing_aspect: |
          CLOSED interval semantics on EquipmentAsset (opposite adjacency rule
          and different resource entity): a second reservation [600,720] that
          touches the first [480,600] at minute 600 is REJECTED with
          ERR_EQUIPMENT_DOUBLE_BOOKED, unlike the half-open visit-slot rule.
        test_recipe:
          setup:
            - "Account/site/ACTIVE contract/plan/crew/route; a SCHEDULED visit; an asset; one RESERVED reservation window [480,600]."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id }
            - call: "POST /v1/equipment"
              payload: { service_account_id: "${acct}", name: "Mower 3", hourly_usage_cost_cents: 3000, service_interval_hours: 100 }
              as: AccountManager
              captures: { asset: $.data.id }
            - call: "POST /v1/reservations"
              payload: { equipment_asset_id: "${asset}", service_visit_id: "${visit}", window_start_minute: 480, window_end_minute: 600 }
              as: CrewLead
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /v1/reservations"
              payload: { equipment_asset_id: "${asset}", service_visit_id: "${visit}", window_start_minute: 600, window_end_minute: 720 }
              as: CrewLead
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EQUIPMENT_DOUBLE_BOOKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_visit_restores_route_booked_minutes
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_CANCELLED
          - calculations.contract_committed_reconcile
          - entities.RouteSchedule.fields.booked_minutes
          - entities.ServiceContract.fields.committed_cents
        distinguishing_aspect: |
          Conserved quantity = RouteSchedule.booked_minutes: placing a visit
          adds slot_duration_minute (0 -> 90) and cancelling it subtracts the
          same amount (90 -> 0); the forward+compensating pair leaves
          booked_minutes unchanged at 0, and contract committed_cents back to 0.
        test_recipe:
          setup:
            - "Account/site/ACTIVE contract/plan/crew/OPEN route; a single SCHEDULED visit (slot_duration_minute=90) -> route booked_minutes=90, committed_cents=59000."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id }
          trigger:
            - call: "POST /v1/visits/${visit}/cancel"
              payload: {}
              as: CrewLead
          assert:
            - "ServiceVisit.${visit}.execution_status == CANCELLED"
            - "RouteSchedule.${route}.booked_minutes == 0"
            - "ServiceContract.${contract}.committed_cents == 0"

      - name: release_reservation_restores_asset_usage_minutes
        grounds:
          - state_machines.EquipmentReservation.RESERVED_to_RELEASED
          - entities.EquipmentAsset.fields.accumulated_usage_minutes
          - entities.EquipmentReservation.fields.reserved_minutes
        distinguishing_aspect: |
          Conserved quantity = EquipmentAsset.accumulated_usage_minutes (a
          DIFFERENT conserved pool than booked_minutes): reserving adds 120
          (0 -> 120) and releasing subtracts the same 120 (120 -> 0); the
          forward+compensating pair leaves the usage pool unchanged at 0.
        test_recipe:
          setup:
            - "Account/site/ACTIVE contract/plan/crew/route; a SCHEDULED visit; an asset; one RESERVED reservation window [480,600] (120 min) -> asset accumulated_usage_minutes=120."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
