          trigger:
            - { call: "POST /v1/reports", payload: { program_id: "${prog}", period_start: "2026-08-03", period_end: "2026-08-03" }, as: ComplianceOfficer, captures: { rep: "$.data.id" } }
            - { call: "POST /v1/reports/${rep}/finalize", payload: {}, as: ComplianceOfficer, as_user_id: "co-1", captures: { prov: "$.data.revenue_provisional_cents", fin: "$.data.revenue_final_cents", ratio: "$.data.waiver_ratio_bps", avg: "$.data.avg_fees_per_overdrafter_centi", flag: "$.data.scrutiny_flag" } }
          assert:
            - "wr_status == APPLIED  (3000 <= teller cap, staff creator)"
            - "ratio == 2142 AND flag == true  (2142 > 1500)"
            - "avg == 400  (4 fees * 100 / 1 overdrafter)"
            - "prov == 11000 AND fin == 11000  (14000 - 3000; all batches settled so bases agree)"

      - name: report_scrutiny_ratio_exact_1500_not_flagged
        claim_type: boundary_edge
        grounds: [calculations.report_revenue_metrics, entities.RegulatoryReport.fields.waiver_ratio_bps]
        distinguishing_aspect: "waiver_ratio_bps uses strict > 1500: waiving exactly 15% (ratio 1500) does NOT flag scrutiny; avg 400 < 1200 also clear."
        test_recipe:
          setup:
            - "Program: fee 2500, count cap 5, cents cap 20000, de_minimis 500, sustained threshold 5, steering 99, disclosure D1"
            - "Opted-in account (ledger 0); batch 2026-08-03: debits 1000 x4 -> 4 fees of 2500 (10000), settled"
            - "FIXED_AMOUNT waiver 1500 on the first fee by Teller -> waived 1500"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-CAL6", fee_amount_cents: 2500, daily_fee_cap_cents: 20000, max_daily_fees_count: 5, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 99, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H CAL6" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: ONLINE, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acct}", as: ProgramAdmin, captures: { f1: "$.data[0].id" } }
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acct}", fee_ids: ["${f1}"], kind: FIXED_AMOUNT, amount_cents: 1500, reason_code: GOODWILL }, as: Teller, as_user_id: "teller-1" }
          trigger:
            - { call: "POST /v1/reports", payload: { program_id: "${prog}", period_start: "2026-08-03", period_end: "2026-08-03" }, as: ComplianceOfficer, captures: { rep: "$.data.id" } }
            - { call: "POST /v1/reports/${rep}/finalize", payload: {}, as: ComplianceOfficer, as_user_id: "co-1", captures: { ratio: "$.data.waiver_ratio_bps", flag: "$.data.scrutiny_flag", fin: "$.data.revenue_final_cents" } }
          assert:
            - "ratio == 1500 AND flag == false  (strict > 1500 semantics; exact boundary not flagged)"
            - "fin == 8500  (10000 - 1500)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers is rejected 400 before role, existence, or body checks."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            # Sent WITHOUT X-User-ID / X-User-Role headers (negative test).
            - { call: "POST /v1/accounts", payload: { program_id: "11111111-2222-4333-8444-555555555555", holder_name: "No Auth" }, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"

      - name: opt_in_stale_disclosure_version_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_STALE_DISCLOSURE_VERSION]"]
        distinguishing_aspect: "Election create AND reinstate both require disclosure_version == program.current_disclosure_version; 'D0' vs 'D1' fails at both points."
        test_recipe:
          setup: ["Program (current_disclosure_version D1); account"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V2", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H V2" }, as: Teller, captures: { acct: "$.data.id" } }
          trigger:
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D0" }, as: AccountHolder, as_user_id: "${acct}", captures: { err_create: "$.data.error_id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}", captures: { el: "$.data.id", el_status: "$.data.status" } }
            - { call: "POST /v1/opt-in-elections/${el}/revoke", payload: {}, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/opt-in-elections/${el}/reinstate", payload: { disclosure_version: "D0" }, as: AccountHolder, as_user_id: "${acct}", captures: { err_reinstate: "$.data.error_id" } }
          assert:
            - "err_create == ERR_STALE_DISCLOSURE_VERSION"
            - "el_status == OPTED_IN  (correct version succeeds)"
            - "err_reinstate == ERR_STALE_DISCLOSURE_VERSION"

      - name: second_election_for_account_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ELECTION_ALREADY_EXISTS]"]
        distinguishing_aspect: "At most one OptInElection per account ever; a second create on the same account fails."
        test_recipe:
          setup: ["Program; account; election already created"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V3", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H V3" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: ONLINE, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
          trigger:
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: MAIL, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_ELECTION_ALREADY_EXISTS"

      - name: account_create_on_suspended_program_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PROGRAM_SUSPENDED]", state_machines.OverdraftProgram.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Program SUSPENDED posture gates account opening; resume re-enables it."
        test_recipe:
          setup: ["Program created then suspended"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V4", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/programs/${prog}/suspend", payload: {}, as: ProgramAdmin, captures: { p_status: "$.data.status" } }
          trigger:
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H V4" }, as: Teller, captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/programs/${prog}/resume", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H V4" }, as: Teller, captures: { acct_status: "$.data.status" } }
          assert:
            - "p_status == SUSPENDED AND err == ERR_PROGRAM_SUSPENDED"
            - "acct_status == ACTIVE  (after resume)"

      - name: restricted_account_debit_rejected_credit_allowed
        claim_type: conditional_validation
        grounds: ["validations[priority=6]", "errors[ERR_ACCOUNT_RESTRICTED]"]
        distinguishing_aspect: "RESTRICTED blocks new DEBIT authorizations but still accepts CREDIT_DEPOSIT (which is how the holder cures the account)."
        test_recipe:
          setup: ["Program sustained threshold 1; opted-in account; batch 2026-08-03 debit 5000 sealed+settled -> RESTRICTED, ledger -11500"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V5", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 1, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H V5" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 5000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acct}", captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: CREDIT_DEPOSIT, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acct}", captures: { cred_status: "$.data.status" } }
          assert:
            - "err == ERR_ACCOUNT_RESTRICTED"
            - "cred_status == AUTHORIZED  (credits still accepted on RESTRICTED accounts)"

      - name: closed_account_transaction_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_ACCOUNT_CLOSED]"]
        distinguishing_aspect: "A CLOSED_VOLUNTARY account rejects both debits and credits (recovery posting exists only on CLOSED_CHARGEOFF)."
        test_recipe:
          setup: ["Program; account funded to 100 (batch 2026-08-03 credit, sealed); account closed by Teller"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V6", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H V6" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: CREDIT_DEPOSIT, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/accounts/${acct}/close", payload: {}, as: Teller, captures: { close_status: "$.data.status" } }
          trigger:
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 50 }, as: AccountHolder, as_user_id: "${acct}", captures: { err_debit: "$.data.error_id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: CREDIT_DEPOSIT, amount_cents: 50 }, as: AccountHolder, as_user_id: "${acct}", captures: { err_credit: "$.data.error_id" } }
          assert:
            - "close_status == CLOSED_VOLUNTARY"
            - "err_debit == ERR_ACCOUNT_CLOSED AND err_credit == ERR_ACCOUNT_CLOSED"

      - name: duplicate_batch_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_BATCH_ALREADY_EXISTS]"]
        distinguishing_aspect: "One batch per program per business_date; the second create on 2026-08-03 fails, and a different date succeeds."
        test_recipe:
          setup: ["Program; batch 2026-08-03 exists"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V7", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { b2_status: "$.data.status" } }
          assert:
            - "err == ERR_BATCH_ALREADY_EXISTS AND b2_status == OPEN"

      - name: weekend_batch_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_NON_BUSINESS_DAY]"]
        distinguishing_aspect: "2026-08-08 is a Saturday and 2026-08-09 a Sunday; both are rejected with 422 ERR_NON_BUSINESS_DAY."
        test_recipe:
          setup: ["Program"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V8", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
          trigger:
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-08" }, as: OperationsClerk, captures: { err_sat: "$.data.error_id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-09" }, as: OperationsClerk, captures: { err_sun: "$.data.error_id" } }
          assert:
            - "err_sat == ERR_NON_BUSINESS_DAY AND err_sun == ERR_NON_BUSINESS_DAY"

      - name: settle_with_earlier_unsettled_batch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_EARLIER_BATCH_UNSETTLED]"]
        distinguishing_aspect: "Batches must settle in business-date order: settling 2026-08-04 while 2026-08-03 is merely SEALED fails; settling in order succeeds."
        test_recipe:
          setup: ["Program; batches 2026-08-03 and 2026-08-04, both SEALED"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V9", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { b2: "$.data.id" } }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b2}/seal", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/batches/${b2}/settle", payload: {}, as: OperationsClerk, captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk, captures: { s1: "$.data.status" } }
            - { call: "POST /v1/batches/${b2}/settle", payload: {}, as: OperationsClerk, captures: { s2: "$.data.status" } }
          assert:
            - "err == ERR_EARLIER_BATCH_UNSETTLED"
            - "s1 == SETTLED AND s2 == SETTLED"

      - name: reverse_after_settle_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_REVERSAL_WINDOW_CLOSED]", state_machines.AccountTransaction.POSTED_to_REVERSED]
        distinguishing_aspect: "Reversal is only possible while the item's batch is SEALED; after settle the window is closed."
        test_recipe:
          setup: ["Program; opted-in account; batch 2026-08-03 debit 2000 sealed+settled (item POSTED, fee POSTED)"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V10", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H V10" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}", captures: { txn: "$.data.id" } }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/transactions/${txn}/reverse", payload: {}, as: OperationsClerk, captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/transactions/${txn}", as: ProgramAdmin, captures: { t_status: "$.data.status" } }
          assert:
            - "err == ERR_REVERSAL_WINDOW_CLOSED AND t_status == POSTED"

      - name: waiver_fixed_amount_exceeds_outstanding_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_WAIVER_AMOUNT_INVALID]"]
        distinguishing_aspect: "FIXED_AMOUNT of 9999 against a single 3500-outstanding fee fails with 422; the fee is waivable (POSTED), so only the fiscal rule fires."
        test_recipe:
          setup: ["Program; opted-in account; batch 2026-08-03 debit 2000 sealed+settled -> fee F1 3500 POSTED"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V11", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H V11" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
