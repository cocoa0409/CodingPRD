# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2459 — Digital Accessibility Conformance Reporting
# Grounds resolve into SCAFFOLD.yaml §1.1–§1.7. Every numeric literal in an
# assert below was computed by executing the §1.3 formula with its constants.
# Logical clock default: 2026-08-01T00:00:00Z (pinned explicitly in every chain).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_versus_certified_conformance_index_divergence
        grounds:
          - calculations.product_conformance_index
          - entities.Product.fields.conformance_index_provisional
          - entities.ConformanceReport.fields.conformance_index_certified
          - state_machines.ConformanceReport.APPROVED_to_PUBLISHED
        distinguishing_aspect: |
          Variant 1 of 2 lives in the Product/ConformanceReport reporting domain: on identical
          evidence the PROVISIONAL variant counts DRAFT rows and drops unassessed criteria from
          the denominator (75.00) while the CERTIFIED variant counts only ATTESTED rows and
          charges unassessed in-scope criteria as 0.0 inside the denominator (50.00).
        test_recipe:
          setup:
            - "Standard WCAG_2_2 with criterion 1.1.1 (level A, VISION+COGNITIVE) and criterion 1.4.3 (level AA, VISION)"
            - "Product targets level AA, so both criteria are in scope; one in-scope WEB_UI component with applicable_criteria_count 40"
            - "One MANUAL SCREEN_READER run exercising all 40 criteria is COMPLETED, so coverage_pct is 45.00 and the component is COMPLETE"
            - "Criterion 1.1.1 has an ATTESTED assessment with support_level SUPPORTS; criterion 1.4.3 has a DRAFT assessment with support_level PARTIALLY_SUPPORTS"
            - "Component design review is REVIEWED_PASS; a report is APPROVED and awaiting publication"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit1_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.4.3", title: "Contrast Minimum", level: "AA", disability_categories: ["VISION"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit2_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_sr_id: $.data.id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_sr_id: $.data.id }
            - call: "POST /assessment-runs/${run_sr_id}/complete"
              payload: { defects_found: 3 }
              as: AccessibilityTester
            - call: "GET /components/${comp_id}"
              payload: {}
              as: AccessibilityTester
              captures: { comp_v1: $.data.version }
            - call: "POST /criterion-assessments"
              payload: { component_id: "${comp_id}", criterion_id: "${crit1_id}", support_level: "SUPPORTS", expected_component_version: "${comp_v1}" }
              as: AccessibilityTester
              as_user_id: "tester-1"
              captures: { ca1_id: $.data.id }
            - call: "POST /criterion-assessments/${ca1_id}/attest"
              payload: { attestation_note: "Reproduced with NVDA 2026.1 on Windows" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
            - call: "GET /components/${comp_id}"
              payload: {}
              as: AccessibilityTester
              captures: { comp_v2: $.data.version }
            - call: "POST /criterion-assessments"
              payload: { component_id: "${comp_id}", criterion_id: "${crit2_id}", support_level: "PARTIALLY_SUPPORTS", remarks: "Contrast fails on the legacy chrome only", expected_component_version: "${comp_v2}" }
              as: AccessibilityTester
              as_user_id: "tester-1"
              captures: { ca2_id: $.data.id }
            - call: "POST /components/${comp_id}/design-review"
              payload: { review_decision: "PASS", review_note: "Acceptance criteria include the AT matrix" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { prod_v1: $.data.version, prov_index_before: $.data.conformance_index_provisional }
            - call: "POST /conformance-reports"
              payload: { product_id: "${prod_id}", standard_id: "${std_id}", report_title: "ACR Insight Portal 7.0", expected_product_version: "${prod_v1}" }
              as: AccessibilityLead
              captures: { rep_id: $.data.id }
            - call: "POST /conformance-reports/${rep_id}/submit"
              payload: { submission_note: "Ready for reviewer sign-off" }
              as: ProductOwner
              as_user_id: "${prod_id}"
            - call: "POST /conformance-reports/${rep_id}/approve"
              payload: { approval_note: "Evidence pinned" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /conformance-reports/${rep_id}/publish"
              payload: { publication_channel: "CUSTOMER_TRUST_PORTAL" }
              as: AccessibilityLead
              captures: { certified_index: $.data.conformance_index_certified }
          assert:
            - "${prov_index_before} == 75.00"
            - "Product.${prod_id}.conformance_index_provisional == 75.00"
            - "Product.${prod_id}.assessed_criteria_count == 2"
            - "${certified_index} == 50.00"
            - "ConformanceReport.${rep_id}.conformance_index_certified == 50.00"
            - "ConformanceReport.${rep_id}.state == PUBLISHED"
            - "ConformanceReport.${rep_id}.pinned_assessment_ids == [${ca1_id}] (the DRAFT assessment ${ca2_id} was never pinned)"
            - "Product.${prod_id}.publication_posture == RESTRICTED (provisional 75.00 < POSTURE_INDEX_FLOOR 85.00 with assessed_criteria_count 2)"

      - name: intake_versus_board_review_remediation_risk_divergence
        grounds:
          - calculations.remediation_risk_score
          - entities.KnownIssue.fields.risk_score
          - entities.KnownIssue.fields.risk_variant
          - state_machines.KnownIssue.TRIAGED_to_TRIAGED
        distinguishing_aspect: |
          Variant 2 of 2 lives in a different entity domain — KnownIssue risk scoring, not report
          conformance accounting: the INTAKE_ESTIMATE variant yields 23.00 from severity, disability
          breadth and user reach alone, while the BOARD_REVIEW variant multiplies the same base by
          the 20-day aging factor and the one-complaint amplification factor to 35.42.
        test_recipe:
          setup:
            - "Standard WCAG_2_2 with criterion 1.1.1 tagged VISION and COGNITIVE (breadth 2)"
            - "Product with one component whose user_reach_pct is 60"
            - "A SERIOUS known issue with target_remediation_date 2026-08-05 has been triaged, so risk_score is the INTAKE_ESTIMATE 23.00"
            - "One complaint has been triaged onto the REMEDIATION branch and linked to that issue, so linked_complaint_count is 1"
            - "The logical clock has moved to 2026-08-25, which is 20 days past the target date"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit1_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "SERIOUS", summary: "Media library thumbnails expose no accessible name", effort_points: 1, target_remediation_date: "2026-08-05", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { issue_id: $.data.id, intake_risk: $.data.risk_score }
            - call: "POST /known-issues/${issue_id}/triage"
              payload: { triage_note: "Confirmed on NVDA and JAWS" }
              as: AccessibilityLead
            - call: "POST /complaints"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", channel: "EMAIL", description: "Screen reader users cannot identify library images", disability_category: "VISION" }
              as: CustomerLiaison
              captures: { cmp_id: $.data.id }
            - call: "POST /complaints/${cmp_id}/triage"
              payload: { route: "REMEDIATION" }
              as: AccessibilityLead
            - call: "POST /complaints/${cmp_id}/link-issue"
              payload: { known_issue_id: "${issue_id}" }
              as: AccessibilityLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: AccessibilityLead
          trigger:
            - call: "POST /known-issues/${issue_id}/board-review"
              payload: { board_review_note: "Board keeps the issue committable", defer: false }
              as: AccessibilityLead
              captures: { board_risk: $.data.risk_score }
          assert:
            - "${intake_risk} == 23.00"
            - "${board_risk} == 35.42"
            - "KnownIssue.${issue_id}.risk_score == 35.42"
            - "KnownIssue.${issue_id}.risk_variant == BOARD_REVIEW"
            - "KnownIssue.${issue_id}.state == TRIAGED"
            - "KnownIssue.${issue_id}.linked_complaint_count == 1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: coverage_weighted_scoring_automated_cap_branch
        grounds:
          - calculations.component_testing_coverage_pct
          - entities.ProductComponent.fields.coverage_pct
          - state_machines.ProductComponent.IN_TESTING_to_COMPLETE
        distinguishing_aspect: |
          Mode (a) instance: four inputs (per-profile automated units, per-profile manual units,
          applicable_criteria_count, the profile weight table) interact non-linearly through two
          nested min() calls plus a conditional cap that flips from 0.60 to 1.00 the moment any
          MANUAL evidence exists — 80 automated units score 27.00 while adding 40 manual units
          on the same profile scores 45.00.
          The axis is non-linear input interaction, unlike the mode (b) rounding-order instance and
          the mode (c) evaluation-order instance.
        test_recipe:
          setup:
            - "One in-scope component with applicable_criteria_count 40 on a SCREEN_READER bench with a 30-minute reconfiguration buffer"
            - "Two AUTOMATED SCREEN_READER runs of 40 exercised criteria each are COMPLETED, so automated units total 80 and the automated-only cap of 0.60 binds"
            - "A third run on the same bench is MANUAL, SCREEN_READER, 40 exercised criteria, still SCHEDULED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_sr_id: $.data.id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "AUTOMATED", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION"] }
              as: AccessibilityTester
              captures: { run_a1_id: $.data.id }
            - call: "POST /assessment-runs/${run_a1_id}/complete"
              payload: { defects_found: 12 }
              as: AccessibilityTester
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "AUTOMATED", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T11:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION"] }
              as: AccessibilityTester
              captures: { run_a2_id: $.data.id }
            - call: "POST /assessment-runs/${run_a2_id}/complete"
              payload: { defects_found: 9 }
              as: AccessibilityTester
            - call: "GET /components/${comp_id}"
              payload: {}
              as: AccessibilityTester
              captures: { cov_automated_only: $.data.coverage_pct, state_automated_only: $.data.assessment_state }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T13:00:00Z", scheduled_end: "2026-08-03T15:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_m1_id: $.data.id }
          trigger:
            - call: "POST /assessment-runs/${run_m1_id}/complete"
              payload: { defects_found: 4 }
              as: AccessibilityTester
          assert:
            - "${cov_automated_only} == 27.00"
            - "${state_automated_only} == IN_TESTING"
            - "ProductComponent.${comp_id}.coverage_pct == 45.00"
            - "ProductComponent.${comp_id}.evidence_units_total == 120"
            - "ProductComponent.${comp_id}.assessment_state == COMPLETE"
            - "ProductComponent.${comp_id}.validated_disability_categories == [VISION, COGNITIVE] (AUTOMATED runs contribute no validated categories)"
            - "Product.${prod_id}.components_complete_count == 1"

      - name: budget_waterfall_rounds_per_issue_before_allocating
        grounds:
          - calculations.remediation_budget_allocation
          - entities.KnownIssue.fields.funded_cents
          - entities.ReleaseTrain.fields.unallocated_cents
          - validations[priority=84]
        distinguishing_aspect: |
          Mode (b) instance: three one-point issues each ask round_half_up(18750 * 1.0725) = 20109
          cents, so the pinned round-per-issue-then-allocate order fully funds all three from a
          60327-cent budget with zero remainder, whereas the rejected sum-then-round order needs
          60328 cents and would leave the last issue PARTIALLY_FUNDED at 20108.
          Rounding order is the axis here, not the non-linear interaction of mode (a).
        test_recipe:
          setup:
            - "One product with one component; three known issues of severity BLOCKER, SERIOUS and MODERATE, each effort_points 1 and publish_intent INCLUDED"
            - "Intake risk scores are 36.80 (BLOCKER), 23.00 (SERIOUS) and 11.04 (MODERATE), which fixes the waterfall order"
            - "All three are TRIAGED and COMMITTED to release train 2026.09 (window 2026-09-01..2026-09-30, freeze_days 5, capacity 10 points, budget 60327 cents)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit1_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /release-trains"
              payload: { name: "Train 2026.09", window_start: "2026-09-01", window_end: "2026-09-30", freeze_days: 5, effort_capacity_points: 10, remediation_budget_cents: 60327 }
              as: AccessibilityLead
              captures: { train_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "BLOCKER", summary: "Primary navigation is unreachable by keyboard", effort_points: 1, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_blocker_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "SERIOUS", summary: "Media library thumbnails expose no accessible name", effort_points: 1, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_serious_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "MODERATE", summary: "Status messages are not announced politely", effort_points: 1, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_moderate_id: $.data.id }
            - call: "POST /known-issues/${iss_blocker_id}/triage"
              payload: { triage_note: "Reproduced on Windows and macOS" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_serious_id}/triage"
              payload: { triage_note: "Reproduced with NVDA" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_moderate_id}/triage"
              payload: { triage_note: "Reproduced with VoiceOver" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_blocker_id}/commit"
              payload: { release_train_id: "${train_id}" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_serious_id}/commit"
              payload: { release_train_id: "${train_id}" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_moderate_id}/commit"
              payload: { release_train_id: "${train_id}" }
              as: AccessibilityLead
          trigger:
            - call: "POST /release-trains/${train_id}/allocate-budget"
              payload: { product_id: "${prod_id}" }
              as: AccessibilityLead
              captures: { remainder: $.data.unallocated_cents }
          assert:
            - "KnownIssue.${iss_blocker_id}.funded_cents == 20109"
            - "KnownIssue.${iss_serious_id}.funded_cents == 20109"
            - "KnownIssue.${iss_moderate_id}.funded_cents == 20109"
            - "KnownIssue.${iss_moderate_id}.funding_state == FULLY_FUNDED"
            - "${remainder} == 0"
            - "ReleaseTrain.${train_id}.unallocated_cents == 0"
            - "ReleaseTrain.${train_id}.allocation_state == ALLOCATED"
            - "ReleaseTrain.${train_id}.committed_effort_points == 3"
            - "ReleaseTrain.${train_id}.remediation_budget_cents == 60327 == 0 + 20109 + 20109 + 20109 (sum-then-round would demand 60328 and fund the MODERATE issue only 20108)"

      - name: disclosure_debt_tier_keyed_on_base_debt_only
        grounds:
          - calculations.questionnaire_disclosure_debt
          - entities.QuestionnaireResponse.fields.disclosure_debt
          - entities.QuestionnaireResponse.fields.disclosure_tier
          - state_machines.QuestionnaireResponse.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (c) instance: the staleness penalty is keyed on a tier that is itself keyed on a debt
          figure, so the evaluation order must be pinned — tier from base_debt 11 gives ELEVATED and
          a final debt of 13.00, while iterating the tier off the final 13.00 would give CRITICAL and
          15.00. Evaluation order, not rounding order (mode b) and not non-linearity (mode a).
        test_recipe:
          setup:
            - "One product with one component and two INCLUDED known issues in state OPEN: a BLOCKER with target_remediation_date 2026-09-15 and a MINOR with target 2026-12-01"
            - "A DRAFT questionnaire response was created while the clock read 2026-08-01T00:00:00Z, so its debt reference timestamp is 2026-08-01T00:00:00Z"
            - "The clock is then moved to 2026-10-05T00:00:00Z: the BLOCKER is 20 days overdue and 65 days have elapsed since the reference"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit1_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /known-issues"
