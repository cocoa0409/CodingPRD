            - call: "POST /diversion-consignments/${consignment_id}/dispatch"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /hauler-tickets"
              payload: { consignment_id: "${consignment_id}", ticket_number: "GLC-EDGE-1", gross_weight_grams: 254000, ticket_date: "2026-06-11" }
              as: HaulerOperator
              as_user_id: "${hauler_id}"
              captures: { ticket_edge: "$.data.id" }
            - call: "POST /hauler-tickets/${ticket_edge}/dispute"
              payload: { dispute_note: "reweigh requested by the site" }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /hauler-tickets"
              payload: { consignment_id: "${consignment_id}", ticket_number: "GLC-EDGE-2", gross_weight_grams: 255000, ticket_date: "2026-06-11" }
              as: HaulerOperator
              as_user_id: "${hauler_id}"
              captures: { ticket_over: "$.data.id" }
          assert:
            - "The FIRST trigger call (gross 254000) returns net_weight_grams 252000, billable_tonnes 0.2520, base_haul_fee_cents 14904 (13104 + 1800), fuel_surcharge_pct 0.06, fuel_surcharge_cents 894 and settlement_subtotal_cents 15798."
            - "The FIRST trigger call returns variance_pct == 5.00 exactly (12000 / 240000 * 100, an exact division), variance_credit_cents == 0 because the comparison is STRICTLY greater than VARIANCE_TOLERANCE_PCT 5.00, and settlement_total_cents == 15798."
            - "The THIRD trigger call (gross 255000, only 1000 g more) returns net_weight_grams 253000, billable_tonnes 0.2530, base_haul_fee_cents 14956 (13156 + 1800), fuel_surcharge_pct 0.06, fuel_surcharge_cents 897 and settlement_subtotal_cents 15853."
            - "The THIRD trigger call returns variance_pct == 5.42 (13000 / 240000 * 100 = 5.41666..., rounded half up at 2 decimals), which IS strictly greater than 5.00, so variance_credit_cents == 1585 (round(15853 * 0.10) = 1585.3 -> 1585) and settlement_total_cents == 14268."
            - "Both tickets keep the same base tier 0.06 even though their subtotals sit above 15000, so the credit difference is attributable to the variance edge alone."
            - "GET /hauler-tickets/${ticket_edge} still shows status DISPUTED and settlement_total_cents 15798 after the third call; a disputed ticket's frozen money is never recomputed."

      - name: baseline_empty_window_is_an_error_while_the_inclusive_end_date_captures_the_last_day
        grounds: "§1.4 validations[priority=115] ERR_BASELINE_NO_DATA; §1.3 calculations.baseline_period_metrics (both window endpoints inclusive; only CLOSED shifts contribute meals)."
        distinguishing_aspect: "Metric: set membership at the window endpoints, on POST /baseline-periods/{id}/submit — neither a money nor a rate edge. Two edges are checked at once: the empty set (count 0 is an error, not a zero-valued freeze) and the inclusive upper bound (a capture at 23:59-scale on end_date is IN, a capture the next calendar day is OUT). The 2026-06-30 / 2026-07-01 pair is one day apart, so an exclusive end_date implementation freezes 0 g and an off-by-one implementation freezes 1200 g."
        test_recipe:
          setup: |
            Site with one PREP station and FT_PREP. Shift 2026-06-30 AM (meals_served 100, one
            500 g capture, CLOSED) and shift 2026-07-01 AM (meals_served 100, one 700 g capture,
            CLOSED). Two baseline periods are created: MAY 2026-05-01..2026-05-31, which contains
            no data at all, and JUNE 2026-06-01..2026-06-30, whose last day is a service day.
