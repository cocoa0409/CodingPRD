# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Flood Insurance (NFIP / FEMA) — depth probe: 9 Difficulty Rules x >=2 instances
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls
# chain drives empty-DB -> setup using only §1.5 endpoints. Numeric asserts are
# literals computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: premium_rr2_vs_legacy_same_inputs_diverge
        grounds:
          - calculations.premium_quote
          - entities.Policy.fields.quoted_premium
          - entities.Policy.fields.rating_method
        distinguishing_aspect: >
          Two Policy quotes on the SAME property/community/coverage inputs diverge:
          RISK_RATING_2_0 -> quoted_premium 676 (zone band x elevation factor),
          LEGACY_SUBSIDIZED -> quoted_premium 1538 (flat zone rates, ignores elevation);
          dual-variant lives on the Policy domain.
        test_recipe:
          setup:
            - "Community CRS class 5 (crs_discount_pct 0.25), participating; AE-zone primary-residence property with BFE 8.0 and an elevation certificate at lowest_floor 10.0 (freeboard +2.0)."
            - "Two QUOTED policies on that property, identical coverage 250000/100000, differing only by rating_method."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Riverside", county_code: "C001", participating: true, crs_class: 5 }
              as: FemaAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${comm_id}", owner_id: "holder-1", address: "1 Levee Rd", flood_zone: "AE", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0 }
              as: PolicyHolder
              as_user_id: "holder-1"
              captures: { prop_id: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${prop_id}", surveyor_license: "SURV-9", lowest_floor_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "holder-1"
            - call: "POST /properties/${prop_id}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 250000, contents_coverage: 100000 }
              as: PolicyHolder
              as_user_id: "holder-1"
              captures: { pol_rr2_id: $.data.id, prem_rr2: $.data.quoted_premium }
            - call: "POST /properties/${prop_id}/policies"
              payload: { rating_method: "LEGACY_SUBSIDIZED", building_coverage: 250000, contents_coverage: 100000 }
              as: PolicyHolder
              as_user_id: "holder-1"
              captures: { pol_leg_id: $.data.id, prem_leg: $.data.quoted_premium }
          trigger:
            - call: "GET /policies/${pol_rr2_id}"
              as: Underwriter
            - call: "GET /policies/${pol_leg_id}"
              as: Underwriter
          assert:
            - "Policy.${pol_rr2_id}.quoted_premium == 676"
            - "Policy.${pol_leg_id}.quoted_premium == 1538"
            - "Policy.${pol_rr2_id}.quoted_premium != Policy.${pol_leg_id}.quoted_premium"

      - name: claim_settlement_rcv_primary_vs_acv_nonprimary
        grounds:
          - calculations.claim_settlement
          - entities.Claim.fields.building_payable
          - entities.Property.fields.occupancy
        distinguishing_aspect: >
          Same building loss 120000 settles differently by occupancy: PRIMARY_RESIDENCE
          building_payable 118000 (RCV, no depreciation), NON_PRIMARY building_payable
          94000 (ACV at 20% depreciation); dual-variant lives on the Claim domain (distinct
          from the Policy premium dual variant).
        test_recipe:
          setup:
            - "A PRIMARY_RESIDENCE property with an ACTIVE lender-required RR2 policy (0-day waiting) covering 250000/100000, ded 2000/1000; a substantial-damage claim with building loss 120000, contents loss 30000, depreciation 0.20, icc 40000, approved with an accepted reconciling proof-of-loss."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Bayou", county_code: "C002", participating: true, crs_class: 5 }
              as: FemaAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${comm_id}", owner_id: "holder-2", address: "2 Bayou Ln", flood_zone: "AE", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0, has_active_mortgage: true }
              as: PolicyHolder
              as_user_id: "holder-2"
              captures: { prop_id: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${prop_id}", surveyor_license: "SURV-1", lowest_floor_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "holder-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties/${prop_id}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 250000, contents_coverage: 100000, building_deductible: 2000, contents_deductible: 1000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_id: "holder-2", date_of_loss: "2026-04-10T00:00:00Z", building_loss: 120000, contents_loss: 30000, depreciation_pct: 0.20, substantial_damage: true, icc_eligible_cost: 40000 }
              as: PolicyHolder
              as_user_id: "holder-2"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/open-review"
              payload: {}
              as: Adjuster
              captures: { claim_v: $.data.version }
            - call: "POST /proofs-of-loss"
              payload: { claim_id: "${claim_id}", documented_building_loss: 120000, documented_contents_loss: 30000 }
              as: PolicyHolder
              as_user_id: "holder-2"
              captures: { pol_loss_id: $.data.id }
            - call: "POST /proofs-of-loss/${pol_loss_id}/accept"
              payload: {}
              as: Adjuster
          trigger:
            - call: "POST /claims/${claim_id}/approve"
              payload: { expected_claim_version: "${claim_v}" }
              as: Adjuster
              captures: { bpay: $.data.building_payable, total: $.data.settlement_total }
          assert:
            - "Claim.${claim_id}.building_payable == 118000"
            - "Claim.${claim_id}.contents_payable == 23000"
            - "Claim.${claim_id}.icc_payable == 30000"
            - "Claim.${claim_id}.settlement_total == 171000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: premium_quote_zone_band_times_elevation_times_crs
        grounds:
          - calculations.premium_quote
          - entities.ElevationCertificate.fields.freeboard_ft
          - entities.Community.fields.crs_discount_pct
        distinguishing_aspect: >
          Mode (a): >=3 interacting inputs with non-linear interaction — flood-zone rate
          band selection x elevation freeboard step factor (multiplicative) x CRS tier
          discount, then flat ICC/fee/surcharge; RR2 quote on AE/freeboard+2/CRS5/primary
          resolves to quoted_premium 676.
        test_recipe:
          setup:
            - "Participating AE community CRS class 5; primary-residence property BFE 8.0 with elevation cert at 10.0 (freeboard +2.0 -> factor 0.85); RR2 quote 250000/100000."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Delta", county_code: "C003", participating: true, crs_class: 5 }
              as: FemaAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${comm_id}", owner_id: "holder-3", address: "3 Delta St", flood_zone: "AE", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0 }
              as: PolicyHolder
              as_user_id: "holder-3"
              captures: { prop_id: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${prop_id}", surveyor_license: "SURV-3", lowest_floor_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "holder-3"
              captures: { ec_id: $.data.id }
          trigger:
            - call: "POST /properties/${prop_id}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 250000, contents_coverage: 100000 }
              as: PolicyHolder
              as_user_id: "holder-3"
              captures: { pol_id: $.data.id, prem: $.data.quoted_premium }
          assert:
            - "ElevationCertificate.${ec_id}.freeboard_ft == 2.0"
            - "Policy.${pol_id}.quoted_premium == 676"

      - name: claim_settlement_round_per_bucket_then_sum
        grounds:
          - calculations.claim_settlement
          - entities.Claim.fields.contents_payable
          - entities.Claim.fields.settlement_total
        distinguishing_aspect: >
          Mode (b): rounding order is pinned — each ACV bucket is rounded to whole dollars
          BEFORE its deductible is subtracted and the buckets summed (round-per-bucket-then-sum);
          contents loss 30000 at 0.20 depreciation rounds to 24000 then nets 1000 -> 23000.
        test_recipe:
          setup:
            - "ACTIVE lender-required RR2 policy on a NON_PRIMARY AE property; substantial claim building 120000 / contents 30000 / depreciation 0.20 / icc 40000, accepted reconciling proof-of-loss; building ACV applies (non-primary)."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Marsh", county_code: "C004", participating: true, crs_class: 5 }
              as: FemaAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${comm_id}", owner_id: "holder-4", address: "4 Marsh Ave", flood_zone: "AE", occupancy: "NON_PRIMARY", base_flood_elevation_ft: 8.0, has_active_mortgage: true }
              as: PolicyHolder
              as_user_id: "holder-4"
              captures: { prop_id: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${prop_id}", surveyor_license: "SURV-4", lowest_floor_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "holder-4"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties/${prop_id}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 250000, contents_coverage: 100000, building_deductible: 2000, contents_deductible: 1000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_id: "holder-4", date_of_loss: "2026-04-10T00:00:00Z", building_loss: 120000, contents_loss: 30000, depreciation_pct: 0.20, substantial_damage: false, icc_eligible_cost: 0 }
              as: PolicyHolder
              as_user_id: "holder-4"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/open-review"
              payload: {}
              as: Adjuster
              captures: { claim_v: $.data.version }
            - call: "POST /proofs-of-loss"
              payload: { claim_id: "${claim_id}", documented_building_loss: 120000, documented_contents_loss: 30000 }
              as: PolicyHolder
              as_user_id: "holder-4"
              captures: { pl_id: $.data.id }
            - call: "POST /proofs-of-loss/${pl_id}/accept"
              payload: {}
              as: Adjuster
          trigger:
            - call: "POST /claims/${claim_id}/approve"
              payload: { expected_claim_version: "${claim_v}" }
              as: Adjuster
          assert:
            - "Claim.${claim_id}.building_payable == 94000"
            - "Claim.${claim_id}.contents_payable == 23000"
            - "Claim.${claim_id}.icc_payable == 0"
            - "Claim.${claim_id}.settlement_total == 117000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_review_revision_cycle_under_review_to_submitted
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_SUBMITTED
          - state_machines.ProofOfLoss.PENDING_to_REJECTED
          - entities.Claim.fields.status
        distinguishing_aspect: >
          Cyclic shape on the Claim entity: rejecting the proof-of-loss bounces the claim
          UNDER_REVIEW -> SUBMITTED (a revision loop, not a forward-only pipeline), allowing
          a corrected proof to be re-filed.
        test_recipe:
          setup:
            - "A claim UNDER_REVIEW on an ACTIVE lender policy with a PENDING proof-of-loss."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Cove", county_code: "C005", participating: true, crs_class: 10 }
              as: FemaAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${comm_id}", owner_id: "holder-5", address: "5 Cove Ct", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "holder-5"
              captures: { prop_id: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${prop_id}", surveyor_license: "SURV-5", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "holder-5"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties/${prop_id}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_id: "holder-5", date_of_loss: "2026-04-10T00:00:00Z", building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "holder-5"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/open-review"
              payload: {}
              as: Adjuster
            - call: "POST /proofs-of-loss"
              payload: { claim_id: "${claim_id}", documented_building_loss: 9999 }
              as: PolicyHolder
              as_user_id: "holder-5"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /proofs-of-loss/${pl_id}/reject"
              payload: {}
              as: Adjuster
              captures: { pol_status: $.data.review_status }
          assert:
            - "ProofOfLoss.${pl_id}.review_status == REJECTED"
            - "Claim.${claim_id}.status == SUBMITTED"

      - name: policy_branching_active_to_transferred_vs_cancelled
        grounds:
          - state_machines.Policy.ACTIVE_to_TRANSFERRED
          - state_machines.Policy.ACTIVE_to_CANCELLED
          - entities.Policy.fields.status
        distinguishing_aspect: >
          Branching shape on the Policy entity: ACTIVE forks to TRANSFERRED (credits unearned
          premium to premium_credit_balance, reassigns holder) OR to CANCELLED (refunds unearned
          to holder, leaves premium_credit_balance 0) — divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Two independent ACTIVE legacy AE policies (quoted_premium 2000 each), each effective 2026-03-31; clock advanced to 2026-09-30 so 183 days elapsed."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Shoal", county_code: "C006", participating: true, crs_class: 10 }
              as: FemaAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
              payload: { community_id: "${comm_id}", owner_id: "holder-6", address: "6A Shoal Rd", flood_zone: "AE", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0 }
              as: Underwriter
              captures: { prop_a: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${comm_id}", owner_id: "holder-6", address: "6B Shoal Rd", flood_zone: "AE", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0 }
              as: Underwriter
              captures: { prop_b: $.data.id }
            - call: "POST /properties/${prop_a}/policies"
              payload: { rating_method: "LEGACY_SUBSIDIZED", building_coverage: 250000, contents_coverage: 100000 }
              as: Underwriter
              captures: { pol_a: $.data.id }
            - call: "POST /properties/${prop_b}/policies"
              payload: { rating_method: "LEGACY_SUBSIDIZED", building_coverage: 250000, contents_coverage: 100000 }
              as: Underwriter
              captures: { pol_b: $.data.id }
            - call: "POST /policies/${pol_a}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_b}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-31T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /policies/${pol_a}/activate"
              payload: {}
              as: Underwriter
              captures: { va: $.data.version }
            - call: "POST /policies/${pol_b}/activate"
              payload: {}
              as: Underwriter
              captures: { vb: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: FemaAdmin
          trigger:
            - call: "POST /policy-transfers"
              payload: { from_policy_id: "${pol_a}", new_owner_id: "holder-7", expected_policy_version: "${va}" }
              as: Underwriter
            - call: "POST /policies/${pol_b}/cancel"
              payload: { expected_policy_version: "${vb}" }
              as: Underwriter
          assert:
            - "Policy.${pol_a}.status == TRANSFERRED"
            - "Policy.${pol_a}.premium_credit_balance == 997"
            - "Policy.${pol_b}.status == CANCELLED"
            - "Policy.${pol_b}.premium_credit_balance == 0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: claim_approve_cascade_to_repetitive_loss_depth3
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Policy.fields.total_claims_paid
          - entities.Property.fields.loss_history_count
          - entities.Property.fields.is_repetitive_loss
        distinguishing_aspect: >
          Depth-3 chain from the claim-approve trigger: approve -> Policy.total_claims_paid +=
          settlement (link 1) -> Property.loss_history_count += 1 (link 2, caused by the ledger
          bump) -> Property.is_repetitive_loss flips true at count==2 (link 3, caused by the
          tally crossing the threshold). Each link is caused by the prior, not by approve directly.
        test_recipe:
          setup:
            - "One ACTIVE lender policy on a property with one prior APPROVED claim (loss_history_count already 1, total_claims_paid 3000); a second claim UNDER_REVIEW with an ACCEPTED proof-of-loss, building loss 5000 / ded 2000 -> settlement 3000."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Eddy", county_code: "C007", participating: true, crs_class: 10 }
              as: FemaAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
              payload: { community_id: "${comm_id}", owner_id: "holder-8", address: "8 Eddy Way", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "holder-8"
              captures: { prop_id: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${prop_id}", surveyor_license: "SURV-8", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "holder-8"
            - call: "POST /properties/${prop_id}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_id: "holder-8", date_of_loss: "2026-04-10T00:00:00Z", building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "holder-8"
              captures: { claim1_id: $.data.id }
            - call: "POST /claims/${claim1_id}/open-review"
              payload: {}
              as: Adjuster
              captures: { c1v: $.data.version }
            - call: "POST /proofs-of-loss"
              payload: { claim_id: "${claim1_id}", documented_building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "holder-8"
              captures: { pl1: $.data.id }
            - call: "POST /proofs-of-loss/${pl1}/accept"
              payload: {}
              as: Adjuster
            - call: "POST /claims/${claim1_id}/approve"
              payload: { expected_claim_version: "${c1v}" }
              as: Adjuster
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_id: "holder-8", date_of_loss: "2026-05-01T00:00:00Z", building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "holder-8"
              captures: { claim2_id: $.data.id }
            - call: "POST /claims/${claim2_id}/open-review"
              payload: {}
              as: Adjuster
              captures: { c2v: $.data.version }
            - call: "POST /proofs-of-loss"
              payload: { claim_id: "${claim2_id}", documented_building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "holder-8"
              captures: { pl2: $.data.id }
            - call: "POST /proofs-of-loss/${pl2}/accept"
              payload: {}
              as: Adjuster
          trigger:
            - call: "POST /claims/${claim2_id}/approve"
              payload: { expected_claim_version: "${c2v}" }
              as: Adjuster
          assert:
            - "Policy.${pol_id}.total_claims_paid == 6000"
            - "Property.${prop_id}.loss_history_count == 2"
            - "Property.${prop_id}.is_repetitive_loss == true"

      - name: policy_cancel_cascade_to_compliance_lapsed_depth2
        grounds:
          - state_machines.Policy.ACTIVE_to_CANCELLED
          - entities.Property.fields.active_policy_id
          - entities.Property.fields.compliance_status
        distinguishing_aspect: >
          Depth-2 chain from the policy-cancel trigger (distinct from the claim-approve trigger):
          cancel -> Property.active_policy_id cleared (link 1) -> Property.compliance_status flips
          to LAPSED because the property is SFHA + mortgaged and now has no active policy (link 2,
          caused by the cleared pointer).
        test_recipe:
          setup:
            - "An ACTIVE lender RR2 policy on an AE property with has_active_mortgage true (compliance_status COMPLIANT)."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Inlet", county_code: "C008", participating: true, crs_class: 10 }
              as: FemaAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
