            - "After the waiver: InspectionFinding.${f_major}.penalty_component_cents == 60000 and InspectionFinding.${f_critical}.penalty_component_cents == 40000 (unchanged)"

      - name: inspection_net_settlement_pinned_order_breaks_apparent_circularity
        grounds:
          - calculations.inspection_net_settlement
          - calculations.penalty_exposure
          - calculations.refund_claim_amount
          - entities.RegulatoryInspection.fields.refund_liability_cents
          - entities.RegulatoryInspection.fields.refund_credit_cents
          - entities.RegulatoryInspection.fields.assessed_penalty_cents
          - entities.Store.fields.cumulative_penalty_exposure_cents
          - state_machines.RegulatoryInspection.RESPONSE_SUBMITTED_to_CLOSED
        distinguishing_aspect: |
          Mode (c) apparent circular dependency with a pinned five-step order: penalty exposure
          feeds the refund credit cap while the refund programme is what settles findings, so the
          order penalty -> liability -> credit -> assessed -> store ledger is evaluated exactly
          once with no feedback; the credit 487 never re-enters tier selection, which is why
