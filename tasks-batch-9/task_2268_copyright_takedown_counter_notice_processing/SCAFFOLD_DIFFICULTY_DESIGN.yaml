          Substantiating one case fans out across five entity families in a single
          call: RightsHolder ENROLLED -> SUSPENDED with tier demoted TRUSTED ->
          VERIFIED, its ACTIVE ReferenceFile -> QUARANTINED, the claim ->
          WITHDRAWN, its ContentItem -> RESTORED/RESOLVED, the StrikeRecord ->
